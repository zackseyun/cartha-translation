source:
  edition: SBLGNT
  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: fr
  text: Que les nôtres[a] apprennent aussi à s’appliquer aux bonnes œuvres[b] pour satisfaire aux besoins nécessaires[c], afin qu’ils ne soient pas sans fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui nous appartiennent » ou « nos propres gens ».
    reason: lexical_alternative
  - marker: b
    text: Ou « se consacrer aux bonnes œuvres » ou « prendre l’initiative dans les bonnes œuvres ».
    reason: lexical_alternative
  - marker: c
    text: Ou « pour répondre aux besoins pressants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: qu’ils apprennent
  rationale: L’impératif présent à la troisième personne du pluriel exprime une exhortation suivie; cette tournure française en garde la force sans la durcir en obligation explicite.
- source_word: οἱ ἡμέτεροι
  choice: les nôtres
  rationale: L’expression signifie littéralement «ceux qui sont à nous» et désigne ici les membres de la communauté associée à Paul et à Tite. «Les nôtres» est naturel, collectif et non restrictif quant au genre.
- source_word: καλῶν ἔργων
  choice: bonnes œuvres
  rationale: Rendu transparent qui conserve le vocabulaire récurrent de la lettre à Tite et sa portée morale concrète.
- source_word: προΐστασθαι
  choice: se consacrer à
  rationale: Le verbe peut signifier diriger, prendre soin de, s’appliquer à ou se vouer à. Avec «bonnes œuvres» en Tite 3.8 et 3.14, il évoque ici un engagement actif et soutenu, sans imposer l’idée de direction.
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: pour répondre aux besoins indispensables
  rationale: La préposition exprime la visée des bonnes œuvres, tandis que χρεία désigne des besoins réels et ἀναγκαῖος leur caractère nécessaire. «Répondre aux» rend naturellement en français cette orientation concrète.
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: afin de ne pas rester sans fruit
  rationale: La proposition finale est conservée, de même que la métaphore littérale du fruit; «rester» rend idiomatiquement l’état visé sans réduire ἄκαρποι à la seule inefficacité.
theological_decisions:
- issue: Portée de οἱ ἡμέτεροι
  choice: les membres de la communauté chrétienne associée à Paul et à Tite
  alternative: nos propres gens, éventuellement par contraste avec les personnes extérieures à la communauté
  rationale: La formule est relationnelle et communautaire. «Les nôtres» préserve cette appartenance sans introduire une restriction masculine ni une catégorie doctrinale.
- issue: Sens de προΐστασθαι
  choice: un engagement soutenu dans les bonnes œuvres
  alternative: prendre la tête dans l’accomplissement des bonnes œuvres
  rationale: Le contexte autorise les deux nuances. Le texte principal retient l’application active, mieux adaptée à la collocation avec «bonnes œuvres», et la note conserve la possibilité d’une idée d’initiative ou de direction.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’exhortation, le vocabulaire des «bonnes œuvres» et la métaphore du fruit. Les appels de notes suivent immédiatement les expressions concernées tout en restant groupés à la fin du segment pertinent.
