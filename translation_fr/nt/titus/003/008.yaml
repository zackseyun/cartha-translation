id: TIT.3.8
reference: Titus 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: fr
  text: Cette parole est digne de confiance. Je veux que tu insistes fermement sur ces points, afin que ceux qui ont fait confiance à Dieu[a] veillent à se consacrer à de bonnes œuvres[b]. Voilà ce qui est bon et utile aux êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ont cru Dieu » ou « qui ont cru en Dieu ».
    reason: Le datif θεῷ peut mettre l’accent sur le fait de croire Dieu, de lui faire confiance ou de placer sa foi en lui.
  - marker: b
    text: Ou « veillent à pratiquer de bonnes œuvres » ; le verbe peut aussi, selon le contexte, évoquer le fait d’être à la tête de telles œuvres.
    reason: προΐστασθαι possède ici une nuance discutée entre direction, engagement et application soutenue.
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: Cette parole est digne de confiance
  rationale: La formule désigne ici le message ou l’affirmation qui précède, et non un mot isolé. « Digne de confiance » rend naturellement πιστός dans cette formule des Pastorales.
- source_word: περὶ τούτων
  choice: sur ces points
  rationale: Cette expression renvoie à l’ensemble des affirmations précédentes. « Sur ces points » est idiomatique en français et conserve le pluriel.
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: Je veux que tu insistes fermement
  rationale: Le verbe exprime une affirmation assurée et appuyée. Cette formulation préserve à la fois la volonté personnelle de l’auteur et la force de l’exhortation.
- source_word: ἵνα φροντίζωσιν
  choice: afin que … veillent à
  rationale: φροντίζω implique une attention réfléchie et soutenue. « Veiller à » exprime naturellement cette diligence en français.
- source_word: καλῶν ἔργων προΐστασθαι
  choice: s’appliquer aux œuvres bonnes
  rationale: Dans ce contexte, προΐστασθαι évoque le fait de se consacrer activement à une pratique plutôt qu’une fonction de direction. L’ordre « œuvres bonnes » garde la qualité morale au premier plan sans employer une tournure archaïque.
- source_word: οἱ πεπιστευκότες θεῷ
  choice: ceux qui ont fait confiance à Dieu
  rationale: Le parfait décrit ceux qui sont entrés dans une relation de foi qui demeure. « Faire confiance à Dieu » rend naturellement le datif θεῷ tout en conservant l’idée de croire Dieu et de se fier à lui.
- source_word: ταῦτά ἐστιν καλὰ καὶ ὠφέλιμα
  choice: Voilà ce qui est bon et utile
  rationale: Le neutre pluriel grec peut se reprendre naturellement en français par « voilà ce qui ». « Bon et utile » conserve les dimensions morale et pratique.
- source_word: τοῖς ἀνθρώποις
  choice: aux êtres humains
  rationale: ἀνθρώποις désigne ici les humains en général, sans restriction au sexe masculin.
theological_decisions:
- issue: Rapport entre la foi et les œuvres
  choice: Les œuvres bonnes sont présentées comme la conduite à laquelle doivent s’appliquer ceux qui ont déjà fait confiance à Dieu.
  alternative: Présenter les œuvres comme le fondement ou le moyen méritoire du salut.
  rationale: La syntaxe place l’acte de croire avant l’exhortation aux œuvres et décrit celles-ci comme son résultat attendu, sans développer davantage leur rapport au salut.
- issue: Sens de πιστεύω avec le datif θεῷ
  choice: ont fait confiance à Dieu
  alternative: ont cru Dieu ; ont cru en Dieu
  rationale: Le datif permet de comprendre qu’ils ont cru ce que Dieu dit ou qu’ils se sont fiés à lui. La formulation retenue reste naturelle sans réduire la foi à la seule reconnaissance de l’existence de Dieu.
- issue: Portée de προΐστασθαι
  choice: s’appliquer aux œuvres bonnes
  alternative: prendre la tête dans les œuvres bonnes ; se consacrer à de bonnes œuvres
  rationale: Le verbe peut évoquer la direction ou l’engagement actif. Dans cette construction, le sens d’application soutenue est contextuellement probable, mais les autres nuances sont signalées.
translation_notes:
  register: Français international actuel, clair et digne. Le tutoiement singulier correspond à l’adresse personnelle à Tite. La formulation évite le jargon confessionnel tout en conservant le lien explicite entre confiance en Dieu et œuvres bonnes.
