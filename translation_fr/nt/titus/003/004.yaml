  text: ὅτε δὲ ἡ χρηστότης καὶ ἡ φιλανθρωπία ἐπεφάνη τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/004.yaml
  text: But when the kindness and love for humanity of God our Savior appeared,[a]
translation:
  language: fr
  text: Mais lorsque la bonté de Dieu notre Sauveur et son amour pour les êtres humains se sont manifestés,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son amour pour l’humanité » ; le terme grec désigne la bienveillance ou l’amour envers les êtres humains.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mais lorsque
  rationale: ὅτε introduit la proposition temporelle, tandis que δέ marque ici un léger contraste avec la description précédente de la condition humaine.
- source_word: χρηστότης
  choice: bonté
  rationale: Le terme désigne une bonté bienveillante qui se manifeste dans les relations. « Bonté » est naturel et digne en français, tout en restant distinct de l’amour exprimé ensuite.
- source_word: φιλανθρωπία
  choice: amour pour les êtres humains
  rationale: Le mot grec exprime la bienveillance ou l’amour envers l’humanité. Cette formulation actuelle et inclusive évite les connotations techniques modernes de « philanthropie ».
- source_word: ἐπεφάνη
  choice: se sont manifestés
  rationale: Le verbe indique l’apparition ou la manifestation. L’accord au pluriel est naturel en français avec les deux réalités coordonnées, la bonté et l’amour, tout en rendant le singulier grec qui les envisage ensemble.
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: de Dieu notre Sauveur
  rationale: La construction génitive dépend des deux noms précédents. « Dieu notre Sauveur » conserve naturellement le titre appositif et l’ordre idiomatique français.
theological_decisions:
- issue: Référent de « Dieu notre Sauveur »
  choice: Conserver sans explicitation la désignation « Dieu notre Sauveur », qui, dans ce contexte, renvoie vraisemblablement au Père.
  alternative: Comprendre l’expression plus généralement comme un titre divin sans préciser ici la personne visée.
  rationale: L’usage des épîtres pastorales et la mention distincte de Jésus-Christ au verset 6 favorisent le Père comme référent, mais la traduction ne doit ni ajouter cette précision ni atténuer la portée du titre.
translation_notes:
  register: Français international moderne, naturel et digne. La construction place « de Dieu notre Sauveur » après « bonté » afin d’éviter une longue accumulation de compléments, tout en indiquant clairement que la bonté et l’amour lui appartiennent. Le pluriel « se sont manifestés » est imposé par l’usage français avec le sujet composé.
