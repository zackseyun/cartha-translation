id: TIT.3.12
reference: Titus 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: fr
  text: Quand je t’aurai envoyé Artémas ou Tychique, fais tout ton possible pour venir me rejoindre à Nicopolis, car j’ai décidé d’y passer l’hiver.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: Quand je t’aurai envoyé
  rationale: La construction ὅταν avec l’aoriste du subjonctif envisage un événement futur attendu. En français, le futur antérieur marque naturellement que l’envoi précédera la venue de Tite.
- source_word: Ἀρτεμᾶν
  choice: Artémas
  rationale: Translittération française usuelle du nom propre grec.
- source_word: ἢ Τυχικόν
  choice: ou Tychique
  rationale: ἤ exprime une alternative simple; « Tychique » est la forme française traditionnelle et intelligible du nom.
- source_word: σπούδασον
  choice: fais tout ton possible
  rationale: L’impératif demande empressement, diligence et effort sérieux, sans se limiter à la seule idée de vitesse.
- source_word: ἐλθεῖν πρός με
  choice: pour venir me rejoindre
  rationale: Le mouvement est dirigé vers Paul. « Me rejoindre » rend naturellement en français la combinaison de ἐλθεῖν et πρός με.
- source_word: εἰς Νικόπολιν
  choice: à Nicopolis
  rationale: La préposition indique la destination; après « venir me rejoindre », « à Nicopolis » est idiomatique et évite une répétition maladroite.
- source_word: ἐκεῖ γὰρ
  choice: car… y
  rationale: γάρ donne la raison de la demande, tandis que « y » reprend naturellement Nicopolis en français.
- source_word: κέκρικα
  choice: j’ai décidé
  rationale: Le parfait exprime ici une décision arrêtée dont l’effet demeure présent.
- source_word: παραχειμάσαι
  choice: passer l’hiver
  rationale: Expression française courante correspondant précisément au fait de séjourner quelque part pendant l’hiver.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la contingence future de l’envoi et le caractère arrêté de la décision de Paul, sans surcharge explicative.
