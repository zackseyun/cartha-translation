source:
  edition: SBLGNT
  text: οὗ ἐξέχεεν ἐφ’ ἡμᾶς πλουσίως διὰ Ἰησοῦ Χριστοῦ τοῦ σωτῆρος ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/006.yaml
  text: whom he poured out on us richly through Jesus the Messiah our Savior[b][a],
translation:
  language: fr
  text: qu’il a répandu sur nous avec abondance par Jésus le Messie, notre Sauveur[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom traduit par « qu’ » renvoie à l’Esprit Saint mentionné au verset 5. En français, « que » peut reprendre aussi bien une personne qu’une chose.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « Jésus Christ »; « Christ » est ici rendu par son sens, « le Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ
  choice: qu’
  rationale: Le pronom relatif renvoie à l’Esprit Saint mentionné au verset précédent. En français, « que » est la tournure naturelle avec « répandre » et ne marque pas grammaticalement la distinction personnel/non personnel.
- source_word: ἐξέχεεν
  choice: a répandu
  rationale: Le verbe ἐκχέω désigne l’action de verser ou répandre et s’emploie couramment pour l’effusion de l’Esprit.
- source_word: ἐφ’ ἡμᾶς
  choice: sur nous
  rationale: Avec l’accusatif, ἐπί exprime ici le mouvement ou la direction vers les bénéficiaires.
- source_word: πλουσίως
  choice: avec abondance
  rationale: Cette expression rend clairement l’idée de profusion portée par l’adverbe, dans un français naturel; « richement » serait moins idiomatique dans ce contexte.
- source_word: διὰ
  choice: par
  rationale: Avec le génitif, διά indique ici la médiation ou le moyen; « par » est concis et naturel.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός conserve ici sa valeur de titre messianique. L’article français est nécessaire pour une formulation idiomatique.
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: notre Sauveur
  rationale: Cette formulation française naturelle conserve le titre σωτήρ et rend le génitif ἡμῶν par le possessif « notre ».
theological_decisions:
- issue: Référent du pronom relatif οὗ
  choice: Le pronom renvoie à l’Esprit Saint de Tite 3.5, que Dieu a répandu sur nous.
  alternative: Une traduction plus explicitement personnelle pourrait employer une reprise telle que « lui qu’il a répandu », mais elle serait lourde en français.
  rationale: L’antécédent immédiat est τὸ πνεῦμα ἅγιον. Le français « que » préserve naturellement le renvoi sans imposer une distinction que sa grammaire n’exprime pas.
- issue: Valeur de Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Dans cette construction, Χριστός peut être entendu comme le titre « Messie ». La traduction principale en exprime le sens, tandis que la forme française traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Avec abondance » est préféré à « richement » pour son naturel. La syntaxe reste liée au verset précédent, conformément à la proposition relative grecque.
