id: 1JN.1.7
reference: 1 John 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ ἐν τῷ φωτὶ περιπατῶμεν ὡς αὐτός ἐστιν ἐν τῷ φωτί, κοινωνίαν ἔχομεν μετ’ ἀλλήλων καὶ τὸ αἷμα ⸀Ἰησοῦ τοῦ υἱοῦ αὐτοῦ καθαρίζει ἡμᾶς ἀπὸ πάσης ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/007.yaml
  text: But if we walk in the light[a], as he himself is in the light, we have fellowship with one another[b], and the blood of Jesus his Son cleanses us from every sin.
translation:
  language: fr
  text: Mais si nous marchons dans la lumière, comme lui-même est dans la lumière, nous sommes en communion les uns avec les autres[a], et le sang de Jésus, son Fils, nous purifie de tout péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains comprennent cette expression comme la communion entre les croyants et Dieu. Toutefois, le pronom réciproque grec désigne le plus naturellement la communion mutuelle entre les croyants.
    reason: alternative_reading
  - marker: b
    text: Le grec peut être compris soit au sens de « chaque péché », soit au sens de « tout péché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Mais si
  rationale: δέ oppose cette affirmation à celle du verset précédent concernant la marche dans les ténèbres ; « Mais si » rend naturellement ce contraste.
- source_word: ἐν τῷ φωτὶ
  choice: dans la lumière
  rationale: Cette formulation conserve l’image johannique chargée de sens sans l’expliciter.
- source_word: περιπατῶμεν
  choice: nous marchons
  rationale: Le choix maintient la métaphore éthique du grec plutôt que de la réduire à « nous vivons » ; le présent français convient à une conduite habituelle ou continue.
- source_word: ὡς αὐτός ἐστιν ἐν τῷ φωτί
  choice: comme lui-même est dans la lumière
  rationale: « lui-même » fait légèrement ressortir le pronom explicite αὐτός, tandis que « comme » conserve la comparaison sans en préciser davantage la portée.
- source_word: κοινωνίαν ἔχομεν
  choice: nous sommes en communion
  rationale: Cette tournure française naturelle exprime la participation et la relation partagées que désigne κοινωνία, sans donner nécessairement au mot un sens sacramentel.
- source_word: μετ’ ἀλλήλων
  choice: les uns avec les autres
  rationale: Cette expression réciproque naturelle conserve la mutualité indiquée par ἀλλήλων.
- source_word: τὸ αἷμα Ἰησοῦ τοῦ υἱοῦ αὐτοῦ
  choice: le sang de Jésus, son Fils
  rationale: La formulation garde « le sang » comme sujet et identifie naturellement Jésus comme le Fils de Dieu. Les virgules évitent de faire de « son Fils » un second nom propre.
- source_word: καθαρίζει
  choice: nous purifie
  rationale: « purifier » rend ici les dimensions morale et cultuelle de καθαρίζω. Le présent simple peut exprimer une action continue ou caractéristique sans ajouter « continuellement » au texte.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: de tout péché
  rationale: Cette formulation idiomatique reste proche du singulier grec et peut évoquer aussi bien chaque péché que le péché envisagé dans sa totalité.
theological_decisions:
- issue: Référent de « les uns avec les autres » (μετ’ ἀλλήλων)
  choice: La communion mutuelle entre les croyants
  alternative: La communion entre les croyants et Dieu
  rationale: Le pronom réciproque ἀλλήλων désigne le plus naturellement des relations mutuelles au sein du groupe. Le contexte plus large parle bien de communion avec Dieu, mais il n’est pas nécessaire d’imposer ce sens à cette expression précise.
- issue: Valeur du présent καθαρίζει
  choice: Une purification continue ou caractéristique exprimée par le présent simple
  alternative: Une purification ponctuelle, ou la formulation explicite « continue de nous purifier »
  rationale: Le présent grec se prête ici à une action continue ou caractéristique, mais « nous purifie » préserve cette possibilité sans surinterpréter l’aspect verbal.
- issue: Portée de πάσης ἁμαρτίας
  choice: Conserver l’ouverture entre un sens distributif et un sens collectif
  alternative: Préciser exclusivement « chaque péché » ou « tout le péché »
  rationale: Le grec permet de comprendre soit chaque péché individuellement, soit le péché dans sa totalité. « de tout péché » et la note maintiennent cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore « marcher dans la lumière » est conservée. « Être en communion » est plus idiomatique en français courant que « avoir communion », tout en maintenant le sens relationnel du grec. Les marqueurs de note sont placés immédiatement après les expressions auxquelles ils se rapportent.
