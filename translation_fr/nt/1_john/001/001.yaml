reference: 1 John 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὃ ἦν ἀπ’ ἀρχῆς, ὃ ἀκηκόαμεν, ὃ ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν, ὃ ἐθεασάμεθα καὶ αἱ χεῖρες ἡμῶν ἐψηλάφησαν, περὶ τοῦ λόγου τῆς ζωῆς—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/001.yaml
  text: What was from the beginning[a], what we have heard, what we have seen with our eyes, what we looked upon and our hands have touched[b], concerning the word of life—
translation:
  language: fr
  text: Ce qui était dès le commencement[a], ce que nous avons entendu, ce que nous avons vu de nos yeux, ce que nous avons contemplé et que nos mains ont touché, au sujet de la parole de vie[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ce qui existait depuis le commencement. »'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « la Parole de vie ». L’expression peut désigner personnellement le Fils, en écho à Jean 1.1, ou la parole porteuse de vie qui le concerne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ / ὃ
  choice: Ce qui / ce que
  rationale: Les pronoms relatifs grecs sont neutres et désignent largement la réalité dont témoignent les apôtres. Cette formulation française préserve cette ampleur sans remplacer le neutre par un référent personnel masculin.
- source_word: ἦν ἀπ’ ἀρχῆς
  choice: était dès le commencement
  rationale: L’imparfait ἦν est rendu directement par « était » ; « dès le commencement » restitue l’idiome johannique et sa profondeur temporelle.
- source_word: ἀκηκόαμεν
  choice: nous avons entendu
  rationale: Le passé composé rend naturellement en français le parfait grec et présente l’audition passée comme constitutive du témoignage présent.
- source_word: ἑωράκαμεν τοῖς ὀφθαλμοῖς ἡμῶν
  choice: nous avons vu de nos yeux
  rationale: Le passé composé convient au parfait grec, tandis que « de nos yeux » conserve l’insistance concrète sur le témoignage oculaire.
- source_word: ἐθεασάμεθα
  choice: nous avons contemplé
  rationale: « Contempler » exprime une observation attentive et prolongée, plus forte qu’un simple regard, sans recourir à une tournure archaïque.
- source_word: αἱ χεῖρες ἡμῶν ἐψηλάφησαν
  choice: nos mains ont touché
  rationale: « Toucher » est clair et naturel en français moderne, tout en conservant la dimension physique du témoignage. Le verbe grec est à l’aoriste, et le passé composé en donne ici une expression idiomatique.
- source_word: περὶ
  choice: au sujet de
  rationale: Cette locution introduit naturellement le thème du témoignage et reste digne sans être inutilement soutenue.
- source_word: τοῦ λόγου τῆς ζωῆς
  choice: la parole de vie
  rationale: « Parole » conserve mieux que « message » la résonance johannique de λόγος, tout en laissant ouverte la possibilité d’une référence à la proclamation. La minuscule évite de trancher typographiquement une ambiguïté absente du grec.
theological_decisions:
- issue: Référent des propositions relatives neutres et de λόγος
  choice: Conserver « Ce qui / ce que » et écrire « la parole de vie » avec une minuscule dans le texte principal.
  alternative: Personnaliser par « Celui qui » et/ou écrire « la Parole de vie » avec une majuscule.
  rationale: Le contexte est christologique, mais le grec emploie des relatifs neutres et ne marque aucune majuscule. La traduction garde ainsi ensemble la personne du Fils, la réalité manifestée en lui et le témoignage proclamé à son sujet, sans résoudre prématurément cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La structure cumulative et le tiret final sont conservés parce que la phrase se poursuit au verset suivant. La répétition de « ce que » reproduit l’insistance rhétorique du grec sans alourdir excessivement la lecture.
