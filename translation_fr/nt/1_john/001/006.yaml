id: 1JN.1.6
reference: 1 John 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι κοινωνίαν ἔχομεν μετ’ αὐτοῦ καὶ ἐν τῷ σκότει περιπατῶμεν, ψευδόμεθα καὶ οὐ ποιοῦμεν τὴν ἀλήθειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/006.yaml
  text: If we say that we have fellowship with him and yet walk in the darkness[b][a], we are lying and are not practicing the truth.
translation:
  language: fr
  text: Si nous disons que nous sommes en communion avec lui et que nous marchons dans les ténèbres, nous mentons et nous ne mettons pas la vérité en pratique.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « nous ne faisons pas la vérité » ; expression qui désigne une conduite conforme à la vérité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Si nous disons
  rationale: Rend naturellement la condition avec le subjonctif aoriste sans ajouter la nuance plus accusatrice de « prétendons ».
- source_word: κοινωνίαν ἔχομεν
  choice: nous sommes en communion
  rationale: Expression française naturelle qui conserve le sens relationnel de κοινωνία et l’idée d’une relation partagée.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: Conserve le pronom et l’association exprimée par μετά avec le génitif, sans expliciter son antécédent.
- source_word: ἐν τῷ σκότει
  choice: dans les ténèbres
  rationale: La formulation garde l’article et la métaphore johannique du domaine moral et spirituel opposé à Dieu.
- source_word: περιπατῶμεν
  choice: marchant
  rationale: Préserve la métaphore biblique de la marche comme manière de vivre, tout en s’intégrant naturellement à la construction concessive française.
- source_word: ψευδόμεθα
  choice: nous mentons
  rationale: Rend directement le présent grec et son contraste avec une profession de communion démentie par la conduite.
- source_word: οὐ ποιοῦμεν τὴν ἀλήθειαν
  choice: nous ne mettons pas la vérité en pratique
  rationale: Exprime en français courant l’idiome johannique littéral « faire la vérité », sans réduire la vérité à une simple connaissance ou affirmation.
theological_decisions:
- issue: Métaphore morale et spirituelle des ténèbres
  choice: Conserver « marcher dans les ténèbres »
  alternative: vivre dans le péché
  rationale: Chez Jean, les ténèbres évoquent à la fois le mal, le mensonge et l’éloignement de Dieu. Garder la métaphore préserve cette richesse et cette tension sans la ramener à une seule catégorie doctrinale.
- issue: Sens pratique de « faire la vérité »
  choice: mettre la vérité en pratique
  alternative: faire la vérité
  rationale: La traduction retenue garde le lien entre vérité et conduite tout en évitant une tournure peu naturelle en français moderne.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore johannique de la marche et des ténèbres est conservée; l’idiome final est rendu de manière naturelle et précisé en note.
