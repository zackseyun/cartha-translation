  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν ὁμολογῶμεν τὰς ἁμαρτίας ἡμῶν, πιστός ἐστιν καὶ δίκαιος ἵνα ἀφῇ ἡμῖν τὰς ἁμαρτίας καὶ καθαρίσῃ ἡμᾶς ἀπὸ πάσης ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/009.yaml
  text: If we confess our sins[a], he is faithful and righteous to forgive us our sins and to cleanse us from all unrighteousness.
translation:
  language: fr
  text: Si nous reconnaissons nos péchés, il est fidèle et juste pour nous pardonner nos péchés et nous purifier de toute injustice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Si
  rationale: Introduit une condition éventuelle ; « si » en conserve naturellement la force sans suggérer nécessairement une répétition.
- source_word: ὁμολογῶμεν
  choice: nous reconnaissons
  rationale: Dans ce contexte, ὁμολογέω désigne l’aveu explicite des péchés. « Reconnaître » est naturel en français moderne et garde l’idée d’admettre ouvertement leur réalité.
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: nos péchés
  rationale: Rendu direct et idiomatique du complément d’objet accompagné du possessif.
- source_word: πιστός
  choice: fidèle
  rationale: Exprime la constance et la fiabilité de Dieu ; « fidèle » est l’équivalent français naturel et traditionnel.
- source_word: δίκαιος
  choice: juste
  rationale: « Juste » couvre ici la rectitude morale et la conformité de Dieu à ce qui est droit, tout en restant naturel dans l’expression française « fidèle et juste ».
- source_word: ἵνα ἀφῇ ... καὶ καθαρίσῃ
  choice: il nous pardonnera ... et nous purifiera
  rationale: Dans cette construction, ἵνα peut introduire ce qui découle de la fidélité et de la justice de Dieu. Les futurs français expriment clairement cette conséquence assurée sans imposer un but exclusif.
- source_word: ἀφῇ
  choice: pardonnera
  rationale: Dans un contexte de péché, ἀφίημι signifie couramment pardonner.
- source_word: καθαρίσῃ
  choice: purifiera
  rationale: καθαρίζω évoque l’élimination de la souillure morale ; « purifier » rend cette image avec naturel et dignité.
- source_word: ἀπὸ πάσης ἀδικίας
  choice: de toute injustice
  rationale: « Injustice » conserve la large portée morale de ἀδικία et le lien lexical avec « juste », sans réduire le terme aux seules infractions judiciaires.
theological_decisions:
- issue: Sens de δίκαιος en rapport avec le pardon divin
  choice: juste
  alternative: droit
  rationale: Le texte fonde le pardon et la purification dans le caractère de Dieu. « Juste » préserve à la fois sa rectitude morale et sa conformité à ce qui est droit, sans préciser davantage le mécanisme théologique du pardon.
- issue: Valeur de ἵνα après « fidèle et juste »
  choice: présenter le pardon et la purification comme la conséquence assurée de ce caractère
  alternative: « afin de nous pardonner… » comme expression explicite du but
  rationale: La construction grecque peut porter une nuance de but ou de résultat. La ponctuation suivie du futur donne un français naturel tout en évitant de trancher lourdement entre ces catégories.
translation_notes:
  register: Français international moderne, courant et digne. « Reconnaissons » évite une coloration ecclésiastique excessive tout en gardant le sérieux de l’aveu ; « fidèle et juste » conserve la formulation théologique dense et mémorable du grec.
