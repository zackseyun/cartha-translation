  source_fidelity: Le texte rend fidèlement les parfaits de témoignage (« avons vu et entendu »), l’annonce aux destinataires avec la portée additive de καὶ, la proposition finale, et les deux emplois de κοινωνία. « Jésus le Messie » traduit correctement Χριστοῦ comme titre. La révision proposée remplace seulement une formulation française inutilement redoublée et ajuste la liaison de δέ sans introduire de contraste.
