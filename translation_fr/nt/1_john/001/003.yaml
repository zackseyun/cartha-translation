source:
  edition: SBLGNT
  text: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν ἀπαγγέλλομεν ⸀καὶ ὑμῖν, ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν· καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/003.yaml
  text: What we have seen and heard we also proclaim to you[a], so that you too may have fellowship with us; and indeed our fellowship is with the Father and with his Son[b], Jesus the Messiah.
translation:
  language: fr
  text: Ce que nous avons vu et entendu, nous vous l’annonçons aussi, afin que vous aussi soyez en communion avec nous ; et notre communion est avec le Père et avec son Fils, Jésus le Messie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus Christ ». Le grec Χριστός signifie « Messie » et peut aussi être rendu par le titre traditionnel « Christ ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ ἑωράκαμεν καὶ ἀκηκόαμεν
  choice: Ce que nous avons vu et entendu
  rationale: Le relatif neutre ὃ garde une référence large à ce qui a été manifesté et attesté; les parfaits sont rendus par le passé composé, naturel en français et compatible avec la portée actuelle du témoignage.
- source_word: ἀπαγγέλλομεν καὶ ὑμῖν
  choice: nous vous l’annonçons à vous aussi
  rationale: « Annonçons » exprime la communication publique d’un témoignage; « l’ » reprend naturellement « ce que », et « à vous aussi » représente explicitement καὶ ὑμῖν.
- source_word: ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν
  choice: afin que vous aussi soyez en communion avec nous
  rationale: « Afin que » marque le but. L’expression idiomatique « être en communion » rend le fait d’avoir part à une relation et à une vie partagées, sans réduire κοινωνία à une simple fréquentation sociale.
- source_word: καὶ ἡ κοινωνία δὲ ἡ ἡμετέρα
  choice: Or, notre communion
  rationale: « Or » rend sobrement la valeur explicative et légèrement contrastive de δέ, tandis que « notre communion » restitue l’emphase possessive sans lourdeur.
- source_word: μετὰ τοῦ πατρὸς καὶ μετὰ τοῦ υἱοῦ αὐτοῦ
  choice: avec le Père et avec son Fils
  rationale: La répétition de « avec » reflète celle de μετά et souligne les deux relations; les majuscules indiquent les titres relationnels désignant Dieu et son Fils.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός conserve ici sa valeur de titre apposé à Jésus; « le Messie » en communique le sens en français actuel plutôt que de le traiter comme un simple élément de nom.
theological_decisions:
- issue: Portée de κοινωνία
  choice: communion
  alternative: partage; participation; relation fraternelle
  rationale: « Communion » maintient ensemble la participation partagée entre les témoins et les destinataires, et la relation avec le Père et le Fils. Le terme n’est pas limité ici à un rite sacramentel.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Dans « Jésus le Messie », Χριστός fonctionne intelligiblement comme un titre. Cette traduction en préserve le contenu messianique, tandis que « Jésus-Christ » pourrait être entendu comme un nom composé.
- issue: Relation de la communion humaine à la communion divine
  choice: Deux propositions coordonnées, sans explicitation causale
  alternative: Expliquer que la communion avec les témoins consiste nécessairement dans la communion avec Dieu
  rationale: Le grec affirme les deux réalités et leur lien, mais n’en formule pas explicitement la relation logique exacte. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Communion » est retenu pour sa profondeur relationnelle et participative. La ponctuation en deux phrases allège la longue période grecque sans modifier son enchaînement logique.
