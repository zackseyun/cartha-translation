id: 1JN.1.5
reference: 1 John 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἔστιν αὕτη ἡ ἀγγελία ἣν ἀκηκόαμεν ἀπ’ αὐτοῦ καὶ ἀναγγέλλομεν ὑμῖν, ὅτι ὁ θεὸς φῶς ἐστιν καὶ σκοτία ⸂ἐν αὐτῷ οὐκ ἔστιν⸃ οὐδεμία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/005.yaml
  text: 'And this is the message that we have heard from him and announce to you: that God is light[a], and there is no darkness at all in him.'
translation:
  language: fr
  text: 'Et voici le message que nous avons entendu de lui et que nous vous annonçons : Dieu est lumière, et il n’y a en lui aucune obscurité.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία
  choice: message
  rationale: « Message » est naturel en français moderne et convient au contenu transmis, tout en restant proche du sens d’annonce.
- source_word: ἀκηκόαμεν
  choice: nous avons entendu
  rationale: 'Le passé composé rend naturellement le parfait grec et son résultat présent : le message entendu demeure celui qui est transmis.'
- source_word: ἀπ’ αὐτοῦ
  choice: de lui
  rationale: Le pronom grec est conservé sans expliciter son référent, afin de ne pas ajouter une interprétation absente de la formulation.
- source_word: ἀναγγέλλομεν
  choice: nous vous annonçons
  rationale: « Annonçons » exprime la transmission déclarée du message et garde en français un lien lexical naturel avec l’idée d’annonce portée par ἀγγελία.
- source_word: ὁ θεὸς φῶς ἐστιν
  choice: Dieu est lumière
  rationale: L’absence d’article devant le prédicat et sa valeur qualitative appellent cette formulation, qui préserve directement la métaphore sans la réduire à « la lumière ».
- source_word: σκοτία
  choice: obscurité
  rationale: « Obscurité » conserve les résonances littérales et morales du terme tout en produisant avec « lumière » une opposition claire et naturelle en français.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Cette tournure idiomatique préserve la formulation relationnelle et métaphorique du grec sans l’expliciter.
- source_word: οὐδεμία
  choice: aucune
  rationale: Associé à « il n’y a », « aucune » rend avec netteté la négation absolue et emphatique du grec.
theological_decisions:
- issue: Prédicat métaphorique « Dieu est lumière »
  choice: 'Maintien direct de la métaphore : « Dieu est lumière »'
  alternative: « Dieu est la lumière » ; « Dieu est une lumière pure » ; « Dieu est saint »
  rationale: Le grec énonce une métaphore qualitative sans article ni explication. La conserver respecte sa force, son ampleur théologique et son ambiguïté féconde, sans ajouter une définition doctrinale.
translation_notes:
  register: 'Français international moderne, digne et accessible. La structure déclarative et le contraste absolu entre lumière et obscurité sont conservés. Aucun marqueur de note n’est requis, car la note anglaise fournie semble mal rattachée : son contenu concerne ἀναγγέλλομεν, non « lumière », et « annoncer » rend déjà adéquatement le verbe.'
