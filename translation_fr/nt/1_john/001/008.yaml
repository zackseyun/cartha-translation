id: 1JN.1.8
reference: 1 John 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι ἁμαρτίαν οὐκ ἔχομεν, ἑαυτοὺς πλανῶμεν καὶ ἡ ἀλήθεια ⸂οὐκ ἔστιν ἐν ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/008.yaml
  text: If we say that we have no sin[a], we deceive ourselves, and the truth is not in us.
translation:
  language: fr
  text: Si nous disons que nous n’avons pas de péché[a], nous nous trompons nous-mêmes, et la vérité n’est pas en nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus interprétative : « notre condition pécheresse » ; le grec dit littéralement « péché ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Si nous disons
  rationale: Rend naturellement en français la condition éventuelle formée par ἐὰν avec le subjonctif aoriste, sans alourdir la phrase.
- source_word: ἁμαρτίαν οὐκ ἔχομεν
  choice: nous n’avons pas de péché
  rationale: Préserve la construction grecque « avoir du péché » et le singulier pris au sens général, plutôt que de la réduire à un acte particulier ou à l’absence d’actes commis.
- source_word: ἑαυτοὺς πλανῶμεν
  choice: nous nous trompons nous-mêmes
  rationale: Le verbe signifie égarer ou tromper; avec le pronom réfléchi, il exprime clairement l’idée de se tromper soi-même. L’ajout de « nous-mêmes » conserve l’insistance du grec.
- source_word: ἡ ἀλήθεια
  choice: la vérité
  rationale: Conserve l’article et la formulation johannique, qui peut évoquer à la fois la réalité vraie, la véracité et la vérité révélée par Dieu sans imposer une seule nuance.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: n’est pas en nous
  rationale: Traduction directe et naturelle qui maintient la dimension intérieure de ἐν ἡμῖν.
theological_decisions:
- issue: Sens de « péché » dans l’affirmation « nous n’avons pas de péché »
  choice: « péché » au singulier, dans un sens général désignant la présence du péché
  alternative: « nous n’avons commis aucun péché » ou « nous ne sommes pas pécheurs »
  rationale: Le grec emploie ἁμαρτίαν avec ἔχομεν, « avoir du péché », et non une expression désignant le fait de commettre des péchés. Cette formulation préserve aussi la distinction avec le verset 10.
- issue: Portée de « la vérité n’est pas en nous »
  choice: Conserver la formule sans explicitation
  alternative: « la vérité de Dieu n’est pas en nous » ou « nous ne vivons pas dans la vérité »
  rationale: La concision grecque peut englober la vérité objective et la véracité intérieure. Une paraphrase trancherait une tension que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, clair et digne. « Nous n’avons pas de péché » est légèrement marqué mais demeure compréhensible et conserve la formulation ainsi que la tension du grec; la note fournit l’interprétation possible sans la substituer au texte.
