reference: 1 John 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ ζωὴ ἐφανερώθη, καὶ ἑωράκαμεν καὶ μαρτυροῦμεν καὶ ἀπαγγέλλομεν ὑμῖν τὴν ζωὴν τὴν αἰώνιον ἥτις ἦν πρὸς τὸν πατέρα καὶ ἐφανερώθη ἡμῖν—
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/002.yaml
  text: and the life was revealed[a], and we have seen and testify and proclaim to you the eternal life[b], which was with the Father and was revealed to us—
translation:
  language: fr
  text: — et la vie s’est manifestée[a] ; nous l’avons vue, nous en rendons témoignage et nous vous annonçons la vie éternelle[b], qui était auprès du Père et qui s’est manifestée à nous —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est apparue » ou « a été révélée » ; le verbe grec peut exprimer le fait de devenir visible ou d’être rendu manifeste.
    reason: lexical_alternative
  - marker: b
    text: L’expression « la vie éternelle » est grammaticalement formulée comme une réalité, mais, dans le contexte, elle renvoie personnellement au Fils, celui qui était auprès du Père et qui s’est manifesté aux apôtres.
    reason: cross_reference
lexical_decisions:
- source_word: ἡ ζωὴ / τὴν ζωὴν
  choice: la vie
  rationale: L’article est conservé, car Jean désigne ici une réalité déterminée, ensuite qualifiée de « vie éternelle », et non la vie en général.
- source_word: ἐφανερώθη
  choice: s’est manifestée
  rationale: Cette tournure française exprime naturellement le fait de devenir visible ou connu et convient aux deux occurrences du passif grec, sans réduire le sens à une simple apparition visuelle.
- source_word: ἑωράκαμεν
  choice: nous l’avons vue
  rationale: Le passé composé rend le parfait grec comme une expérience accomplie dont la portée demeure. Le pronom féminin explicite en français l’objet sous-entendu, « la vie ».
- source_word: μαρτυροῦμεν
  choice: nous en témoignons
  rationale: « Témoigner » conserve la dimension de témoignage oculaire. « En » reprend naturellement en français ce qui a été vu.
- source_word: ἀπαγγέλλομεν ὑμῖν
  choice: nous vous annonçons
  rationale: « Annoncer » exprime la communication déclarative aux destinataires tout en restant distinct de « témoigner ».
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: la vie éternelle
  rationale: La formulation garde le caractère défini de l’expression grecque et son lien d’apposition avec « la vie ».
- source_word: ἥτις
  choice: qui
  rationale: En français, « qui » convient grammaticalement à l’antécédent « la vie » sans obliger à décider dans la traduction s’il faut l’entendre de façon purement impersonnelle ou personnelle.
- source_word: ἦν πρὸς τὸν πατέρα
  choice: était auprès du Père
  rationale: « Auprès du Père » exprime avec naturel la proximité relationnelle de πρός et fait écho à la langue johannique, sans paraphrase doctrinale.
- source_word: ἡμῖν
  choice: à nous
  rationale: Le complément est conservé explicitement, car il souligne l’expérience des témoins apostoliques.
theological_decisions:
- issue: Le caractère personnel ou impersonnel de « la vie »
  choice: Conserver « la vie » et « la vie éternelle » dans le texte principal.
  alternative: Employer un pronom personnel ou nommer directement le Fils.
  rationale: Le grec emploie le nom féminin ζωή plutôt qu’un nom personnel explicite. Le contexte renvoie au Fils, mais la traduction préserve l’expression johannique et sa tension théologique.
- issue: La préexistence et la relation exprimées par πρὸς τὸν πατέρα
  choice: « était auprès du Père »
  alternative: « était avec le Père » ou « était en présence du Père »
  rationale: Cette formulation affirme la relation antérieure avec le Père tout en restant proche de l’expression grecque, sans l’élargir en explication doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le point-virgule clarifie la longue coordination grecque. Les reprises pronominales « l’ » et « en » sont nécessaires à une syntaxe française fluide. Les tirets signalent que le verset forme une parenthèse au sein de la phrase commencée au verset 1 et poursuivie au verset 3.
