source:
  edition: SBLGNT
  text: ἐὰν εἴπωμεν ὅτι οὐχ ἡμαρτήκαμεν, ψεύστην ποιοῦμεν αὐτὸν καὶ ὁ λόγος αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/001/010.yaml
  text: If we say that we have not sinned[a], we make him a liar[b], and his word is not in us.
translation:
  language: fr
  text: Si nous disons que nous n’avons pas péché[a], nous faisons de lui un menteur, et sa parole[b] n’est pas en nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie un parfait, rendu naturellement ici par le passé composé français ; il évoque un fait passé qui garde une portée dans le présent. « Nous n’avons jamais péché » serait plus absolu que le texte grec.
    reason: grammatical_note
  - marker: b
    text: 'Ou : « son message ». Le grec λόγος peut avoir les deux sens ; « parole » est retenu pour préserver le vocabulaire caractéristique de Jean.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν εἴπωμεν
  choice: Si nous disons
  rationale: La construction ἐὰν avec le subjonctif aoriste introduit une condition éventuelle. « Si nous disons » est naturel en français et n’ajoute pas la nuance interprétative de « prétendons ».
- source_word: οὐχ ἡμαρτήκαμεν
  choice: nous n’avons pas péché
  rationale: Le parfait grec présente l’action passée dans sa pertinence présente. Le passé composé français rend ici naturellement l’affirmation sans l’amplifier en « nous n’avons jamais péché ».
- source_word: ψεύστην
  choice: un menteur
  rationale: ψεύστης est un nom désignant un menteur. Cette formulation conserve la force directe et personnelle du grec.
- source_word: ποιοῦμεν αὐτὸν
  choice: nous faisons de lui
  rationale: Avec un attribut à l’accusatif, ποιέω signifie ici tenir ou présenter quelqu’un pour quelque chose. « Faire de lui un menteur » est idiomatique et proche de la structure grecque.
- source_word: ὁ λόγος αὐτοῦ
  choice: sa parole
  rationale: λόγος peut désigner la parole, le message ou l’enseignement. « Sa parole » préserve le vocabulaire johannique et ses résonances possibles.
- source_word: οὐκ ἔστιν ἐν ἡμῖν
  choice: n’est pas en nous
  rationale: La traduction directe conserve la dimension intérieure de l’expression johannique sans ajouter l’image plus interprétative d’une parole qui « demeure » en nous.
theological_decisions:
- issue: Référent de αὐτόν et αὐτοῦ
  choice: 'Conserver le pronom : « lui » et « sa » ; dans le contexte, il renvoie à Dieu.'
  alternative: Nommer explicitement Dieu dans le texte.
  rationale: Le contexte immédiat indique Dieu comme référent, mais le grec emploie des pronoms. Les conserver respecte la cohésion du passage et évite une explicitation inutile.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant idiomatique. Les pronoms divins ne reçoivent pas de majuscule, conformément à l’usage courant. Le second appel de note est placé après « sa parole » afin d’identifier clairement le terme commenté.
