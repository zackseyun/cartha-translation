lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction naturelle qui relie cette déclaration au témoignage précédent.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie au contenu écrit et conserve le pluriel du grec ainsi que le style johannique.
- source_word: γράφομεν
  choice: nous écrivons
  rationale: Le présent français rend naturellement le présent épistolaire grec et l'acte d'écrire en cours.
- source_word: ἡμεῖς
  choice: nous
  rationale: Le pronom grec explicite marque une certaine insistance; le pronom sujet français le représente naturellement sans ajouter une tournure lourde comme «nous-mêmes».
- source_word: ἵνα
  choice: afin que
  rationale: Cette locution introduit clairement le but tout en gardant un registre actuel et digne.
- source_word: χαρά
  choice: joie
  rationale: Équivalent français courant et précis dans l'usage johannique.
- source_word: ἡμῶν
  choice: notre
  rationale: Le texte SBLGNT fourni porte la première personne du pluriel; la variante «votre» est signalée en note.
- source_word: ᾖ πεπληρωμένη
  choice: soit complète
  rationale: La construction périphrastique exprime un état résultant de plénitude; cette formulation est claire et idiomatique en français.
theological_decisions:
- issue: Pronom dans l'expression ἡ χαρὰ ἡμῶν
  choice: notre joie
  alternative: votre joie
  rationale: Le texte grec fourni lit ἡμῶν («notre»). La variante manuscrite «votre» est suffisamment importante pour être conservée en note sans remplacer la leçon du texte de base.
