  text: ἐν τούτῳ ἐγνώκαμεν τὴν ἀγάπην, ὅτι ἐκεῖνος ὑπὲρ ἡμῶν τὴν ψυχὴν αὐτοῦ ἔθηκεν· καὶ ἡμεῖς ὀφείλομεν ὑπὲρ τῶν ἀδελφῶν τὰς ψυχὰς ⸀θεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/016.yaml
  text: 'By this we have come to know love: that he laid down his life for us[b][a], and we ought to lay down our lives for the brothers.'
translation:
  language: fr
  text: 'Voici comment nous avons connu l’amour : lui, il a donné sa vie pour nous[a]. Nous aussi, nous devons donner notre vie pour les frères[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « C’est en ceci que nous avons connu l’amour » ou « Par ceci, nous avons connu l’amour ».
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « les frères » ; dans ce contexte, l’expression désigne vraisemblablement l’ensemble des autres croyants, y compris les sœurs.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Voici comment
  rationale: La tournure introduit le moyen ou le fondement par lequel l’amour est connu. « Voici comment » est naturel en français et annonce clairement l’explication qui suit, tout en laissant en note les rendus plus formels.
- source_word: ἐγνώκαμεν
  choice: nous avons connu
  rationale: Le parfait exprime une connaissance acquise dont l’effet demeure. Le passé composé français convient naturellement sans imposer la nuance plus progressive de « nous avons appris à connaître ».
- source_word: τὴν ἀγάπην
  choice: l’amour
  rationale: Le terme désigne ici l’amour, défini concrètement par le don de soi qui suit.
- source_word: ἐκεῖνος
  choice: lui, il
  rationale: La dislocation emphatique rend la force distinctive du pronom grec tout en laissant le contexte identifier Jésus, sans ajouter son nom au texte.
- source_word: ὑπὲρ ἡμῶν
  choice: pour nous
  rationale: « Pour nous » exprime naturellement le don en notre faveur sans préciser davantage une théorie de l’expiation.
- source_word: τὴν ψυχὴν αὐτοῦ ἔθηκεν
  choice: il a donné sa vie
  rationale: Dans cet idiome johannique, ψυχή désigne la vie et τίθημι son abandon volontaire. « Donner sa vie » est idiomatique en français moderne et conserve l’idée de sacrifice volontaire.
- source_word: ὀφείλομεν
  choice: nous devons
  rationale: Le verbe marque une obligation morale réelle. « Nous devons » est clair, direct et actuel.
- source_word: τῶν ἀδελφῶν
  choice: les frères
  rationale: Le masculin pluriel grec est conservé dans le texte; une note précise qu’il désigne vraisemblablement ici l’ensemble des croyants, femmes comprises.
- source_word: τὰς ψυχὰς θεῖναι
  choice: donner notre vie
  rationale: La même expression que précédemment est rendue de façon cohérente. Le français emploie naturellement le singulier distributif « notre vie » pour le pluriel grec « nos vies ».
theological_decisions:
- issue: Référent de ἐκεῖνος
  choice: Le pronom est rendu par « lui, il », le contexte renvoyant à Jésus.
  alternative: Nommer explicitement Jésus, ou traduire plus littéralement « celui-là ».
  rationale: Le contexte johannique identifie Jésus comme celui qui a donné sa vie, mais le grec emploie seulement un pronom emphatique. La traduction préserve donc à la fois l’emphase et l’identification contextuelle.
- issue: Portée de ὑπὲρ ἡμῶν
  choice: « pour nous »
  alternative: « à notre place » ou « en notre faveur »
  rationale: La préposition exprime clairement un acte accompli en faveur d’autrui et peut porter une dimension substitutive, mais le verset ne demande pas que la traduction tranche entre ces nuances.
- issue: Portée de ἀδελφῶν
  choice: « les frères » dans le texte, avec une note sur sa portée collective probable
  alternative: « les frères et les sœurs »
  rationale: Cette solution maintient la forme masculine du grec tout en rendant explicite, en note, son emploi vraisemblablement représentatif de l’ensemble des croyants.
translation_notes:
  register: Français international moderne, digne et accessible. L’emphase de ἐκεῖνος est rendue par « lui, il ». « Donner sa vie » évite le calque peu naturel « déposer sa vie » et garde l’idée de don volontaire. Les marqueurs de note suivent les expressions auxquelles ils se rapportent.
