reference: 1 John 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ καθὼς Κάϊν ἐκ τοῦ πονηροῦ ἦν καὶ ἔσφαξεν τὸν ἀδελφὸν αὐτοῦ· καὶ χάριν τίνος ἔσφαξεν αὐτόν; ὅτι τὰ ἔργα αὐτοῦ πονηρὰ ἦν, τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/012.yaml
  text: not like Cain[a], who was from the evil one and slaughtered his brother. And why did he slaughter him? Because his deeds were evil[b], but those of his brother were righteous.
translation:
  language: fr
  text: Ne soyons pas comme Caïn, qui venait du Malin[a] et qui a égorgé[b] son frère. Et pourquoi l’a-t-il égorgé ? Parce que ses actes étaient mauvais, tandis que ceux de son frère étaient justes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du mal ». L’expression grecque peut être comprise de manière abstraite, mais, dans les écrits de Jean, elle désigne le plus souvent le Malin, un être personnel.
    reason: alternative_reading
  - marker: b
    text: Ou « a tué » ou « a assassiné ». Le verbe grec évoque une mise à mort violente et est plus frappant que le simple « tuer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ καθὼς
  choice: Ne soyons pas comme
  rationale: La négation et la comparaison prolongent l’exhortation du verset précédent. Cette formulation explicite naturellement en français le verbe sous-entendu sans modifier la force de la comparaison.
- source_word: ἐκ τοῦ πονηροῦ
  choice: venait du Mauvais
  rationale: « Venait de » exprime naturellement l’origine indiquée par ἐκ. Dans les écrits johanniques, l’adjectif substantivé avec l’article désigne généralement l’être personnel mauvais ; la majuscule rend cette lecture perceptible sans ajouter le nom « diable ».
- source_word: ἔσφαξεν
  choice: a égorgé
  rationale: Le verbe σφάζω est plus violent et imagé qu’un simple « tuer ». « Égorgé » conserve cette vigueur et convient au registre biblique sans être archaïque.
- source_word: ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Traduction directe et naturelle ; le lien fraternel est essentiel au contraste moral du passage.
- source_word: χάριν τίνος
  choice: pourquoi
  rationale: Équivalent français idiomatique de l’expression interrogative causale.
- source_word: ὅτι
  choice: Parce que
  rationale: Introduit explicitement la raison du meurtre de Caïn.
- source_word: τὰ ἔργα αὐτοῦ πονηρὰ ἦν
  choice: ses actes étaient mauvais
  rationale: Dans ce contexte concret, « actes » rend ἔργα plus naturellement que « œuvres », tout en maintenant le contraste moral avec les actes du frère.
- source_word: τὰ δὲ τοῦ ἀδελφοῦ αὐτοῦ δίκαια
  choice: tandis que ceux de son frère étaient justes
  rationale: « Ceux » conserve l’ellipse grecque de ἔργα. « Justes » rend la qualité morale exprimée par δίκαια.
theological_decisions:
- issue: τοῦ πονηροῦ désigne-t-il une personne ou le mal de façon abstraite ?
  choice: 'Lecture personnelle : « du Mauvais »'
  alternative: 'Lecture abstraite : « du mal »'
  rationale: Dans l’usage johannique, ὁ πονηρός désigne couramment l’être personnel mauvais. Une note conserve néanmoins l’ambiguïté grammaticale réelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Le Mauvais » garde la désignation personnelle sans importer le nom explicite de Satan. « Égorgé » préserve la violence du verbe grec ; la note offre des équivalents moins imagés.
