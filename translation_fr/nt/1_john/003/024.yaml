source:
  edition: SBLGNT
  text: καὶ ὁ τηρῶν τὰς ἐντολὰς αὐτοῦ ἐν αὐτῷ μένει καὶ αὐτὸς ἐν αὐτῷ· καὶ ἐν τούτῳ γινώσκομεν ὅτι μένει ἐν ἡμῖν, ἐκ τοῦ πνεύματος οὗ ἡμῖν ἔδωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/024.yaml
  text: 'And the one who keeps his commandments remains in him[a], and he in him[b]. And by this we know that he remains in us: by the Spirit whom he gave to us.'
translation:
  language: fr
  text: 'Celui qui garde ses commandements demeure en lui, et lui demeure en celui qui les garde. Et voici à quoi nous reconnaissons qu’il demeure en nous : à l’Esprit[a] qu’il nous a donné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « venant de l’Esprit qu’il nous a donné ». La préposition grecque peut marquer aussi bien la provenance que le moyen ou le fondement.
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῶν
  choice: garde
  rationale: « Garder » conserve la formulation johannique et réunit les nuances d’observance fidèle et d’obéissance sans réduire le verbe à la seule exécution.
- source_word: ἐντολάς
  choice: commandements
  rationale: Terme naturel en français biblique moderne, « commandements » maintient la force morale et l’usage johannique du mot.
- source_word: μένει
  choice: demeure
  rationale: Répété pour les trois occurrences, « demeure » rend la continuité relationnelle de μένω et reste vivant, digne et intelligible en français actuel.
- source_word: ἐν αὐτῷ / αὐτὸς ἐν αὐτῷ
  choice: en lui / lui en cette personne
  rationale: La première occurrence garde le pronom grec. Dans la seconde, « en cette personne » évite en français l’ambiguïté grammaticale de « lui en lui », où les deux pronoms pourraient sembler désigner le même référent, tout en préservant la réciprocité de l’inhabitation.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: voici comment nous savons
  rationale: Cette tournure française naturelle présente l’Esprit comme le moyen ou le fondement de cette connaissance, conformément au contexte.
- source_word: ἐκ τοῦ πνεύματος
  choice: par l’Esprit
  rationale: « Par » exprime naturellement le moyen ou le fondement de la connaissance; une note conserve la nuance possible de provenance portée par ἐκ.
- source_word: οὗ ἡμῖν ἔδωκεν
  choice: qu’il nous a donné
  rationale: Le relatif « que » est grammaticalement naturel avec « Esprit » en français et n’implique aucune dépersonnalisation. Le passé composé rend ici naturellement l’aoriste grec et la pertinence actuelle du don.
theological_decisions:
- issue: Référent des pronoms αὐτῷ / αὐτός et du sujet de μένει ἐν ἡμῖν
  choice: Conserver les pronoms sans remplacer ceux-ci par « Dieu » ou « Christ »; le contexte immédiat oriente vers Dieu.
  alternative: Expliciter partout « Dieu », ou comprendre la dernière occurrence dans un sens christologique plus large.
  rationale: Le grec emploie des pronoms. Les conserver respecte la formulation source et laisse subsister la densité johannique de l’inhabitation sans imposer une explicitation doctrinale.
- issue: Identification de πνεῦμα
  choice: Employer la majuscule dans « l’Esprit ».
  alternative: Écrire « l’esprit » avec une minuscule.
  rationale: Le don divin mentionné et le contexte johannique désignent l’Esprit Saint; la majuscule française signale correctement ce référent sans ajouter de titre absent du grec.
translation_notes:
  register: Français international moderne, courant et digne. La répétition de « demeure », importante dans le vocabulaire johannique, est maintenue. La formulation évite l’archaïsme tout en conservant la réciprocité et l’ambiguïté référentielle du texte grec.
