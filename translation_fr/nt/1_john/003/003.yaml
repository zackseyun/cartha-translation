  naturalness: La révision est idiomatique en français international moderne et conserve un registre digne. « Comme lui-même est pur » est plus naturel que « tout comme lui est pur », dont la succession de pronoms est lourde.
  terminology: « Espérance », « se purifie » et « pur » reproduisent adéquatement le vocabulaire et le lien lexical entre ἁγνίζει et ἁγνός. La note indique les possibilités de référence sans les trancher doctrinalement.
