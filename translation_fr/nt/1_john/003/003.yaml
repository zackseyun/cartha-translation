  text: καὶ πᾶς ὁ ἔχων τὴν ἐλπίδα ταύτην ἐπ’ αὐτῷ ἁγνίζει ἑαυτὸν καθὼς ἐκεῖνος ἁγνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/003.yaml
  text: And everyone who has this hope set on him purifies himself[b][a], just as he is pure.
translation:
  language: fr
  text: Et quiconque a cette espérance en lui[a] se purifie, comme lui-même est pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi se rendre par « fonde cette espérance sur lui » ou « place cette espérance en lui ». Les pronoms renvoient très probablement au Fils dans le contexte, sans que le grec le nomme explicitement.
    reason: lexical_alternative_and_referent_ambiguity
lexical_decisions:
- source_word: πᾶς ὁ ἔχων
  choice: quiconque place
  rationale: La tournure rend naturellement la portée générale du participe substantivé. Avec le complément « en lui », « place » exprime en français idiomatique une espérance orientée vers son objet.
- source_word: τὴν ἐλπίδα ταύτην
  choice: cette espérance
  rationale: Le démonstratif renvoie à l’espérance exposée dans le contexte précédent; « espérance » exprime une attente confiante plutôt qu’un simple souhait.
- source_word: ἐπ’ αὐτῷ
  choice: en lui
  rationale: Avec ἐπί suivi du datif, l’expression peut désigner l’objet ou le fondement sur lequel repose l’espérance. « Placer en lui cette espérance » rend clairement ce rapport sans nommer le référent.
- source_word: ἁγνίζει ἑαυτὸν
  choice: se purifie lui-même
  rationale: « Se purifie » conserve le sens moral de ἁγνίζω et son lien lexical avec ἁγνός. « Lui-même » fait ressortir la valeur réfléchie de ἑαυτόν sans limiter la portée générale de « quiconque ».
- source_word: καθὼς
  choice: tout comme
  rationale: Cette expression introduit clairement la comparaison et convient à un français moderne et digne.
- source_word: ἐκεῖνος
  choice: lui
  rationale: Le pronom démonstratif grec renvoie très probablement au Fils dans le contexte. Le français « lui » évite le peu naturel « celui-là » tout en s’abstenant d’ajouter le nom « Christ », absent du verset.
- source_word: ἁγνός
  choice: pur
  rationale: « Pur » est le meilleur équivalent dans ce contexte éthique et maintient le rapport avec le verbe « se purifie ».
theological_decisions:
- issue: Référent de αὐτῷ et de ἐκεῖνος
  choice: Conserver des pronoms, le contexte orientant naturellement vers le Fils ou le Christ.
  alternative: Nommer explicitement le Christ, ou comprendre éventuellement αὐτῷ comme renvoyant au Père.
  rationale: Le contexte immédiat favorise une référence au Fils, mais le grec ne nomme pas le référent. La traduction préserve cette discrétion et la tension du texte.
- issue: Portée du réfléchi masculin singulier ἑαυτόν
  choice: Employer « se purifie lui-même » après le générique « quiconque ».
  alternative: Employer seulement « se purifie » ou reformuler au pluriel.
  rationale: La formulation retenue garde la force réfléchie du grec tout en restant générique en français; elle n’introduit aucune restriction aux hommes.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la répétition « se purifie / pur » et laisse le référent pronominal implicite comme dans le grec.
