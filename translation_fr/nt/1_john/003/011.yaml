id: 1JN.3.11
reference: 1 John 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅτι αὕτη ἐστὶν ἡ ἀγγελία ἣν ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/011.yaml
  text: 'For this is the message that you have heard from the beginning: that we should love one another[a][b].'
translation:
  language: fr
  text: 'Car voici le message que vous avez entendu dès le commencement[a] : que nous nous aimions les uns les autres[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « depuis le commencement » ou « dès le début ».
    reason: lexical_alternative
  - marker: b
    text: Ou « afin que nous nous aimions les uns les autres » ou « aimons-nous les uns les autres ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτι
  choice: Car
  rationale: Dans le contexte, ὅτι introduit l’explication de ce qui précède. « Car » exprime naturellement ce lien logique en français.
- source_word: αὕτη ἐστὶν ἡ ἀγγελία
  choice: voici le message
  rationale: « Voici le message » rend avec naturel la tournure démonstrative αὕτη ἐστὶν tout en gardant son caractère direct. « Message » est le terme courant qui convient ici à ἀγγελία.
- source_word: ἣν ἠκούσατε
  choice: que vous avez entendu
  rationale: Le passé composé rend naturellement l’aoriste français dans ce contexte et présente le message comme reçu antérieurement par les destinataires.
- source_word: ἀπ’ ἀρχῆς
  choice: depuis le commencement
  rationale: Cette formulation conserve l’expression johannique et sa possible résonance avec les autres emplois de « commencement », sans préciser de quel commencement il s’agit.
- source_word: ἵνα ἀγαπῶμεν
  choice: nous devons nous aimer
  rationale: Après un nom comme « message », ἵνα introduit ici très probablement son contenu et sa portée éthique. « Nous devons » transmet la valeur exhortative du subjonctif sans recourir à l’imparfait du subjonctif français, artificiel aujourd’hui.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Expression réciproque française courante, qui conserve la dimension communautaire de l’énoncé.
theological_decisions:
- issue: Valeur de ἵνα ἀγαπῶμεν ἀλλήλους
  choice: 'Le contenu et la portée morale du message : « nous devons nous aimer les uns les autres »'
  alternative: « afin que nous nous aimions les uns les autres » ou « aimons-nous les uns les autres »
  rationale: La construction peut exprimer le contenu du message, son but, ou prendre une nuance exhortative. Le texte principal retient le contenu moral, le plus naturel dans le contexte, tandis que la note préserve les autres nuances possibles sans les exclure.
- issue: Référence de ἀπ’ ἀρχῆς
  choice: « depuis le commencement », sans explicitation
  alternative: « depuis le début »
  rationale: Jean ne précise pas explicitement s’il s’agit du commencement de l’annonce chrétienne aux lecteurs ou d’un horizon plus large. La traduction conserve cette ouverture.
translation_notes:
  register: Français international moderne, clair et digne. « Voici le message » évite une formulation pesante, tandis que « nous devons nous aimer » exprime l’obligation morale dans un français actuel. Les notes signalent les nuances réelles de ἀπ’ ἀρχῆς et de la proposition introduite par ἵνα.
