id: 1JN.3.21
reference: 1 John 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀγαπητοί, ἐὰν ἡ καρδία ⸂μὴ καταγινώσκῃ ἡμῶν⸃, παρρησίαν ἔχομεν πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/021.yaml
  text: Beloved[a], if our heart does not condemn us, we have confidence before God[c][b],
translation:
  language: fr
  text: Bien-aimés, si notre cœur[a] ne nous condamne pas[b], nous avons de l’assurance devant Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, le « cœur » désigne l’être intérieur ou la conscience morale.
    reason: cultural_note
  - marker: b
    text: Ou « ne nous accuse pas » ou « ne nous trouve pas en faute ».
    reason: lexical_alternative
  - marker: c
    text: Ou « de la confiance devant Dieu » ou « de la hardiesse auprès de Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Bien-aimés
  rationale: Ce vocatif pluriel exprime une affection fondée sur l’amour. « Bien-aimés » conserve le lien lexical avec le langage de l’amour très présent dans 1 Jean, tout en gardant un ton digne et intelligible.
- source_word: ἐὰν
  choice: si
  rationale: La conjonction introduit ici une condition avec le subjonctif ; « si » en est le rendu français le plus direct et naturel.
- source_word: ἡ καρδία
  choice: notre cœur
  rationale: « Cœur » conserve la métaphore de l’original. Dans ce contexte, il désigne l’être intérieur dans sa fonction d’évaluation morale, sans devoir être réduit au seul concept de conscience.
- source_word: μὴ καταγινώσκῃ ἡμῶν
  choice: ne nous condamne pas
  rationale: Le verbe peut exprimer un jugement défavorable, un blâme ou une condamnation. « Condamner » préserve sa nuance morale et quasi judiciaire ainsi que le lien avec le verset précédent.
- source_word: παρρησίαν
  choice: de l’assurance
  rationale: Le nom désigne la liberté de parole ou d’approche, la hardiesse et la confiance ouverte. « Assurance » convient à l’attitude libre et non honteuse du croyant en présence de Dieu, sans suggérer l’insolence.
- source_word: πρὸς τὸν θεόν
  choice: devant Dieu
  rationale: Avec παρρησία, la préposition exprime la relation ou l’orientation envers Dieu. « Devant Dieu » est naturel en français et évoque clairement sa présence.
theological_decisions:
- issue: La faculté intérieure désignée par καρδία
  choice: cœur
  alternative: conscience
  rationale: Le texte présente l’être intérieur comme pouvant condamner la personne. « Cœur » respecte l’image et le vocabulaire johanniques, tandis que « conscience » préciserait davantage que ne le fait le grec.
- issue: La nuance de παρρησία dans la relation à Dieu
  choice: assurance devant Dieu
  alternative: confiance devant Dieu ; liberté de nous présenter devant Dieu
  rationale: Le texte évoque une attitude ouverte et sans honte en présence de Dieu. « Assurance » maintient cette liberté d’accès sans transformer le propos en certitude psychologique absolue ni atténuer la sainteté divine.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec sans devenir raide. « Bien-aimés » maintient le réseau lexical de l’amour dans l’épître ; les notes préservent les principales nuances possibles sans les imposer au texte.
