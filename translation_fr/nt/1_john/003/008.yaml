source:
  edition: SBLGNT
  text: ὁ ποιῶν τὴν ἁμαρτίαν ἐκ τοῦ διαβόλου ἐστίν, ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει. εἰς τοῦτο ἐφανερώθη ὁ υἱὸς τοῦ θεοῦ ἵνα λύσῃ τὰ ἔργα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/008.yaml
  text: 'The one who practices sin is from the devil[a], because the devil has been sinning from the beginning[d][c][b]. For this purpose the Son of God was revealed: to destroy the works of the devil.'
translation:
  language: fr
  text: 'Celui qui pratique le péché[a] vient du diable[b], car le diable pèche depuis le commencement. C’est dans ce but que le Fils de Dieu a été manifesté[c] : pour détruire[d] les œuvres du diable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Celui qui commet le péché ». Le grec emploie un participe présent qui peut évoquer une pratique continue ou caractéristique, plutôt qu’un seul acte isolé.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « est du diable ». Le grec exprime la provenance ou la source, ici dans un sens moral et spirituel.
    reason: alternative_reading
  - marker: c
    text: Ou « est apparu » ou « a été révélé ». Le verbe grec, au passif, évoque une manifestation ou un dévoilement.
    reason: lexical_alternative
  - marker: d
    text: Ou « défaire » ou « démanteler ». Le verbe grec signifie d’abord « délier », puis, selon le contexte, « défaire » ou « détruire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ποιῶν τὴν ἁμαρτίαν
  choice: Celui qui pratique le péché
  rationale: Le participe présent ποιῶν présente ici le péché comme une conduite en cours ou caractéristique. « Pratique le péché » rend cette valeur sans réduire l’énoncé à un acte isolé.
- source_word: ἐκ τοῦ διαβόλου ἐστίν
  choice: vient du diable
  rationale: ἐκ exprime la provenance ou la source. « Vient du diable » conserve cette image dans un français naturel, sans expliciter davantage la nature de cette relation.
- source_word: ὅτι ἀπ’ ἀρχῆς ὁ διάβολος ἁμαρτάνει
  choice: car le diable pèche depuis le commencement
  rationale: « Car » rend la valeur explicative de ὅτι. Le présent « pèche », associé à « depuis le commencement », exprime une activité caractéristique qui se prolonge, tout en conservant l’ambiguïté de « commencement ».
- source_word: εἰς τοῦτο
  choice: C’est dans ce but
  rationale: L’expression annonce la proposition de but introduite par ἵνα. Cette formulation française rend clairement l’orientation téléologique du passage.
- source_word: ἐφανερώθη
  choice: s’est manifesté
  rationale: Le verbe désigne l’entrée dans la manifestation, l’apparition ou le dévoilement. « S’est manifesté » est naturel en français et conserve le vocabulaire johannique de la manifestation.
- source_word: ἵνα λύσῃ
  choice: pour détruire
  rationale: Avec « les œuvres du diable », λύω signifie défaire, démanteler ou réduire à néant. « Pour détruire » exprime clairement le but et le caractère décisif de l’action.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: les œuvres du diable
  rationale: Cette traduction directe conserve le pluriel et la relation génitive, tout en gardant la portée générale du mot ἔργα.
theological_decisions:
- issue: Portée du langage au présent concernant le péché
  choice: 'Une pratique en cours ou caractéristique : « pratique le péché »'
  alternative: Une affirmation absolue visant tout acte de péché isolé
  rationale: La forme présente décrit naturellement une conduite caractéristique. Ce choix préserve la tension avec les passages voisins où Jean reconnaît que les croyants peuvent pécher, sans neutraliser la force de l’avertissement.
- issue: Sens de « vient du diable »
  choice: Conserver l’image de la provenance ou de la source morale et spirituelle
  alternative: Exprimer explicitement l’appartenance au diable ou une génération littérale par lui
  rationale: ἐκ marque une provenance. La traduction garde cette métaphore sans la transformer soit en relation ontologique littérale, soit en paraphrase interprétative trop précise.
- issue: But de la manifestation du Fils de Dieu
  choice: Détruire les œuvres du diable
  alternative: Seulement les révéler ou les dénoncer
  rationale: La construction ἵνα avec λύσῃ exprime un but, et λύω désigne ici l’action de défaire ou de démanteler ces œuvres, non leur simple exposition.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de la structure grecque, tandis que « s’est manifesté » et « C’est dans ce but » assurent un rendu idiomatique. Le terme traditionnel « œuvres » conserve la largeur sémantique de ἔργα.
