language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν τούτῳ φανερά ἐστιν τὰ τέκνα τοῦ θεοῦ καὶ τὰ τέκνα τοῦ διαβόλου· πᾶς ὁ μὴ ποιῶν δικαιοσύνην οὐκ ἔστιν ἐκ τοῦ θεοῦ, καὶ ὁ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/010.yaml
  text: 'By this the children of God and the children of the devil are evident: everyone who does not practice righteousness is not from God[c][b][a], nor is the one who does not love his brother.'
translation:
  language: fr
  text: 'Voici à quoi[a] l’on reconnaît les enfants de Dieu et les enfants du diable : quiconque ne pratique pas la justice[b] n’est pas de Dieu, pas plus que celui qui n’aime pas son frère[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « C’est en ceci » ou « C’est par ceci ». L’expression grecque peut désigner le moyen ou le critère qui rend cette distinction reconnaissable.
    reason: lexical_alternative
  - marker: b
    text: Ou « la droiture ». Ici, le mot grec désigne une conduite conforme à ce qui est juste.
    reason: lexical_alternative
  - marker: c
    text: Ou « son frère ou sa sœur », c’est-à-dire un autre croyant. Le grec porte littéralement « son frère », au masculin singulier.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Voici à quoi
  rationale: Cette tournure française naturelle présente le critère auquel la distinction devient manifeste, tout en évitant de préciser excessivement si le grec signifie « en ceci », « par ceci » ou « à partir de ceci ».
- source_word: φανερά ἐστιν
  choice: l’on reconnaît
  rationale: Le grec décrit les deux groupes comme manifestes ou évidents. En français courant, « l’on reconnaît » exprime clairement leur caractère observable sans suggérer une révélation surnaturelle absente du terme.
- source_word: τὰ τέκνα
  choice: les enfants
  rationale: « Enfants » conserve l’image familiale explicite et le contraste johannique d’appartenance ou de filiation.
- source_word: τοῦ διαβόλου
  choice: du diable
  rationale: Dans ce contexte, διάβολος est la désignation personnelle établie du diable, et non simplement le nom commun « calomniateur ».
- source_word: πᾶς ὁ μὴ ποιῶν
  choice: quiconque ne pratique pas
  rationale: Le participe présent substantivé décrit une conduite caractéristique. « Pratique » rend cette dimension habituelle mieux que la simple mention d’un acte isolé.
- source_word: δικαιοσύνην
  choice: la justice
  rationale: « Justice » est l’équivalent français biblique naturel de δικαιοσύνη et désigne ici une conduite conforme à ce qui est juste; la note signale « droiture » comme autre formulation possible.
- source_word: οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: n’est pas de Dieu
  rationale: Cette formulation concise conserve l’idée grecque de provenance ou d’appartenance sans la réduire à une seule catégorie doctrinale.
- source_word: καὶ ὁ μὴ ἀγαπῶν
  choice: pas plus que celui qui n’aime pas
  rationale: La formulation explicite naturellement en français le verbe sous-entendu dans le second membre et maintient le parallélisme négatif.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Le texte grec emploie le masculin singulier. Le texte principal le conserve, tandis que la note indique sa portée possible dans la communauté croyante.
theological_decisions:
- issue: Langage familial de l’identité spirituelle
  choice: les enfants de Dieu et les enfants du diable
  alternative: ceux qui appartiennent à Dieu et ceux qui appartiennent au diable
  rationale: Le grec emploie explicitement τέκνα. Garder « enfants » préserve l’image théologique de filiation ou d’appartenance sans l’aplatir en catégories génériques.
- issue: Portée du masculin singulier ἀδελφός
  choice: son frère
  alternative: son frère ou sa sœur; un frère ou une sœur dans la foi
  rationale: Le texte principal suit la forme masculine singulière du grec. Sa portée représentative potentiellement plus large est indiquée en note plutôt qu’imposée dans la traduction.
- issue: Force éthique de δικαιοσύνη
  choice: la justice
  alternative: la droiture; ce qui est juste
  rationale: Dans ce contexte, le terme vise la conduite juste qui caractérise les enfants de Dieu. « Justice » maintient le terme théologique traditionnel, avec une précision en note pour éviter de le limiter à la justice sociale ou judiciaire.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le contraste familial marqué ainsi que le parallélisme éthique. « Voici à quoi l’on reconnaît » privilégie une formulation française idiomatique tout en maintenant l’idée que l’identité des deux groupes devient manifeste par leur conduite.
