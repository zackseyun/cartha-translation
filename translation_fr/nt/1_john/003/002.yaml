reference: 1 John 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀγαπητοί, νῦν τέκνα θεοῦ ἐσμεν, καὶ οὔπω ἐφανερώθη τί ἐσόμεθα. ⸀οἴδαμεν ὅτι ἐὰν φανερωθῇ ὅμοιοι αὐτῷ ἐσόμεθα, ὅτι ὀψόμεθα αὐτὸν καθώς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/002.yaml
  text: Beloved[a], now we are children of God, and what we will be has not yet been revealed. We know that if he is revealed, we will be like him[b], because we will see him as he is.
translation:
  language: fr
  text: Bien-aimés, dès maintenant nous sommes enfants de Dieu, et ce que nous serons n’a pas encore été manifesté. Nous savons que, s’il est manifesté[a][b], nous serons semblables à lui, parce que nous le verrons tel qu’il est.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si cela est manifesté », en renvoyant à ce que nous serons; le sujet du verbe grec n’est pas exprimé. Le contexte favorise toutefois « il », en renvoyant au Christ.'
    reason: alternative_reading
  - marker: b
    text: De nombreuses traductions rendent cette proposition par « quand il paraîtra ». Plus littéralement, le grec dit « s’il est manifesté » et emploie le même verbe que dans la phrase précédente.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Bien-aimés
  rationale: Ce vocatif pluriel exprime une affection profonde et conserve le lien lexical avec le langage de l’amour, tout en gardant un ton digne.
- source_word: νῦν
  choice: dès maintenant
  rationale: Cette formulation marque clairement la réalité présente de la filiation divine, en contraste avec l’état futur qui n’est pas encore manifesté.
- source_word: τέκνα θεοῦ
  choice: enfants de Dieu
  rationale: τέκνα désigne la relation filiale sans distinction de sexe ni insistance sur l’âge.
- source_word: οὔπω ἐφανερώθη
  choice: n’a pas encore été manifesté
  rationale: Le passif de φανερόω évoque ce qui est rendu visible ou dévoilé. « Manifesté » permet aussi de conserver la répétition du même verbe dans la proposition suivante.
- source_word: τί ἐσόμεθα
  choice: ce que nous serons
  rationale: Le neutre τί porte sur la condition ou la nature future des croyants; cette traduction directe n’en précise pas davantage le contenu.
- source_word: οἴδαμεν
  choice: Nous savons
  rationale: Rend simplement le parfait grec employé avec un sens présent.
- source_word: ἐὰν φανερωθῇ
  choice: s’il est manifesté
  rationale: La traduction conserve le conditionnel ἐάν, la voix passive et le lien lexical avec ἐφανερώθη. Le pronom renvoie vraisemblablement au Christ, sans dissimuler dans la note l’ambiguïté du sujet grec implicite.
- source_word: ὅμοιοι αὐτῷ
  choice: semblables à lui
  rationale: « Semblables » exprime une ressemblance réelle sans suggérer une identité absolue.
- source_word: ὀψόμεθα αὐτὸν
  choice: nous le verrons
  rationale: Rend naturellement le futur de ὁράω et maintient le pronom comme complément direct.
- source_word: καθώς ἐστιν
  choice: tel qu’il est
  rationale: Formulation française naturelle qui exprime la perception du Christ dans sa réalité véritable.
theological_decisions:
- issue: Référent du sujet implicite de ἐὰν φανερωθῇ
  choice: 'Le texte principal comprend le Christ comme sujet : « s’il est manifesté » ou « lorsqu’il se manifestera ».'
  alternative: 'Le sujet pourrait être « ce que nous serons » : « si cela est manifesté ».'
  rationale: La mention immédiate du fait de le voir et de devenir semblables à lui favorise un renvoi au Christ. La note préserve toutefois l’ambiguïté grammaticale réelle du grec.
- issue: Force conditionnelle et aspect de ἐὰν φανερωθῇ
  choice: s’il est manifesté
  alternative: quand il paraîtra / lorsqu’il sera manifesté
  rationale: La formulation retenue suit de près ἐάν et garde la voix passive ainsi que la répétition de φανερόω, au lieu de transformer silencieusement la proposition en indication temporelle.
- issue: Nature de la ressemblance future des croyants avec le Christ
  choice: nous serons semblables à lui
  alternative: nous serons comme lui
  rationale: ὅμοιοι exprime la ressemblance, non une identité totale. « Semblables à lui » maintient à la fois la force de la promesse de transformation et cette distinction.
translation_notes:
  register: Français international moderne, naturel et digne. « Bien-aimés » conserve le ton pastoral de l’adresse; « manifesté » est légèrement soutenu, mais il permet de reproduire le lien verbal central du grec. La ponctuation vise une lecture fluide sans effacer l’ambiguïté de la proposition conditionnelle.
