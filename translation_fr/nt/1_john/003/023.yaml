id: 1JN.3.23
reference: 1 John 3:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐντολὴ αὐτοῦ, ἵνα ⸀πιστεύσωμεν τῷ ὀνόματι τοῦ υἱοῦ αὐτοῦ Ἰησοῦ Χριστοῦ καὶ ἀγαπῶμεν ἀλλήλους, καθὼς ἔδωκεν ἐντολὴν ⸀ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/023.yaml
  text: 'And this is his command: that we believe in the name of his Son Jesus the Messiah and love one another[d][c][b][a], just as he gave us command.'
translation:
  language: fr
  text: 'Et voici son commandement : que nous croyions au nom de son Fils, Jésus le Messie[a], et que nous nous aimions les uns les autres, comme il nous l’a commandé[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus-Christ ». Le grec Χριστός signifie « Messie » et peut aussi être rendu par la forme traditionnelle « Christ ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « comme il nous a donné un commandement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντολή
  choice: commandement
  rationale: « Commandement » exprime naturellement en français l’autorité de l’injonction et permet de conserver la répétition du nom grec au singulier.
- source_word: ἵνα πιστεύσωμεν
  choice: que nous croyions
  rationale: Après « voici son commandement », ἵνα introduit le contenu du commandement. Le subjonctif français rend naturellement cette construction.
- source_word: πιστεύω τῷ ὀνόματι
  choice: croire au nom
  rationale: Avec le datif, l’expression johannique désigne la foi placée dans la personne telle que son nom la révèle. « Croire au nom » conserve la formulation biblique sans l’expliciter excessivement.
- source_word: υἱοῦ
  choice: Fils
  rationale: La majuscule signale ici le titre relationnel appliqué à Jésus, sans modifier le sens lexical.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre identifiant le Fils; « le Messie » est idiomatique en français et en rend le sens plutôt que de le traiter comme un patronyme.
- source_word: ἀγαπῶμεν ἀλλήλους
  choice: que nous nous aimions les uns les autres
  rationale: La tournure réciproque française rend clairement le second élément coordonné du contenu du commandement.
- source_word: καθὼς
  choice: comme
  rationale: « Comme » marque avec naturel la conformité à l’ordre donné précédemment.
- source_word: ἔδωκεν ἐντολὴν ἡμῖν
  choice: il nous en a donné le commandement
  rationale: Cette formulation française idiomatique maintient le nom « commandement » et son singulier. Le pronom « en » rattache l’ordre à ses deux composantes immédiatement énoncées.
theological_decisions:
- issue: Valeur de Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Dans cette apposition à « son Fils », Χριστός peut être entendu comme le titre messianique. Le choix retenu en manifeste le sens, tandis que la forme française traditionnelle demeure signalée en note.
- issue: Portée de πιστεύω τῷ ὀνόματι
  choice: croire au nom
  alternative: mettre notre confiance dans le nom
  rationale: La traduction conserve l’expression johannique et son amplitude théologique, sans réduire la foi à un simple assentiment ni imposer une paraphrase interprétative.
- issue: Référent du sujet de ἔδωκεν
  choice: il
  alternative: Jésus le Messie nous l’a commandé
  rationale: Le grec laisse le sujet implicite. Garder « il » préserve cette continuité et évite de préciser silencieusement si le référent immédiat est Dieu ou son Fils.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure en deux volets du commandement grec. « Et voici » maintient le lien discursif de καί; le subjonctif après « que » est naturel en français soutenu courant.
