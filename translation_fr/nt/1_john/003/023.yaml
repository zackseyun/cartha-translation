    text: 'Ou : « Jésus-Christ ». Le grec Χριστός signifie « Messie » et peut aussi être rendu par la forme traditionnelle « Christ ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « comme il nous a donné un commandement ».'
    reason: lexical_alternative
  revision_rationale: La révision remplace uniquement la dernière expression par une tournure française naturelle qui transmet la force directive de ἔδωκεν ἐντολήν ἡμῖν. La note conserve la formulation plus proche de la structure nominale grecque. Les deux subjonctifs coordonnés et l’ambiguïté contrôlée du sujet de « il » sont préservés.
