- from: 'Et voici son commandement : que nous croyions au nom de son Fils, Jésus le Messie[a], et que nous nous aimions les uns les autres, comme il nous en a donné le commandement[b].'
  to: 'Et voici son commandement : que nous croyions au nom de son Fils, Jésus le Messie[a], et que nous nous aimions les uns les autres, comme il nous l’a commandé[b].'
  rationale: La révision remplace uniquement la dernière expression par une tournure française naturelle qui transmet la force directive de ἔδωκεν ἐντολήν ἡμῖν. La note conserve la formulation plus proche de la structure nominale grecque. Les deux subjonctifs coordonnés et l’ambiguïté contrôlée du sujet de « il » sont préservés.
