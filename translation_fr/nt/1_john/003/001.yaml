id: 1JN.3.1
reference: 1 John 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἴδετε ποταπὴν ἀγάπην δέδωκεν ἡμῖν ὁ πατὴρ ἵνα τέκνα θεοῦ κληθῶμεν, ⸂καὶ ἐσμέν⸃. διὰ τοῦτο ὁ κόσμος οὐ γινώσκει ⸀ἡμᾶς ὅτι οὐκ ἔγνω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/001.yaml
  text: See what kind of love the Father has given to us[a], that we should be called children of God—and we are. For this reason the world does not know us[e][d][c][b], because it did not know him.
translation:
  language: fr
  text: Voyez quel amour le Père nous a donné[a], afin que nous soyons appelés enfants de Dieu — et nous le sommes. Voilà pourquoi le monde ne nous connaît pas[b], parce qu’il ne l’a pas connu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelle sorte d’amour ». Le grec exprime l’étonnement devant la nature ou la qualité de l’amour du Père, et pas seulement devant sa grandeur.
    reason: lexical_alternative
  - marker: b
    text: Ou « le monde ne nous reconnaît pas ».
    reason: lexical_alternative
  - marker: c
    text: « L’ » renvoie le plus naturellement au Père dans ce verset ; dans le contexte des écrits de Jean, certains comprennent qu’il renvoie au Christ. Certains manuscrits omettent « et nous le sommes ».
    reason: alternative_reading_and_textual_variant
lexical_decisions:
- source_word: ἴδετε
  choice: Voyez
  rationale: L’impératif attire directement l’attention des lecteurs et garde un ton actuel sans recourir à l’archaïque « Voici ».
- source_word: ποταπὴν ἀγάπην
  choice: quel amour
  rationale: Cette tournure française naturelle exprime l’étonnement devant la nature et la qualité de l’amour, sans le réduire à son seul degré.
- source_word: δέδωκεν
  choice: a donné
  rationale: Le passé composé rend naturellement en français l’acte accompli dont le résultat demeure.
- source_word: ἵνα τέκνα θεοῦ κληθῶμεν
  choice: nous sommes appelés enfants de Dieu
  rationale: La formulation exprime le contenu et le résultat du don du Père. « Enfants » traduit le pluriel inclusif τέκνα sans ajouter « fils et filles ».
- source_word: καὶ ἐσμέν
  choice: et nous le sommes
  rationale: La reprise pronominale est idiomatique en français et conserve l’affirmation emphatique du grec.
- source_word: διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Cette expression actuelle marque clairement le lien explicatif avec ce qui précède.
- source_word: οὐ γινώσκει ἡμᾶς
  choice: ne nous connaît pas
  rationale: « Connaître » conserve le parallélisme lexical avec οὐκ ἔγνω αὐτόν; la nuance possible de reconnaissance est signalée en note.
- source_word: οὐκ ἔγνω αὐτόν
  choice: ne l’a pas connu
  rationale: Le pronom français préserve la référence masculine et le verbe garde le parallèle avec « ne nous connaît pas ».
theological_decisions:
- issue: Référent de αὐτόν
  choice: Le pronom renvoie le plus naturellement au Père
  alternative: Le pronom peut être compris comme renvoyant au Christ dans le contexte johannique
  rationale: Le Père est l’antécédent explicite le plus proche dans le verset, mais le pronom grec permet une ambiguïté contextuelle qu’il convient de préserver en note.
- issue: Présence de καὶ ἐσμέν
  choice: Inclure « et nous le sommes » dans le texte
  alternative: Omettre la proposition selon la variante de certains manuscrits
  rationale: Le SBLGNT retient ces mots, qui affirment fortement la réalité de l’identité donnée aux croyants; la variante est indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation met en relief l’affirmation « et nous le sommes » sans alourdir la phrase. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
