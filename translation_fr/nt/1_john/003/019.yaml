  text: ⸀ἐν τούτῳ ⸀γνωσόμεθα ὅτι ἐκ τῆς ἀληθείας ἐσμέν, καὶ ἔμπροσθεν αὐτοῦ πείσομεν ⸂τὴν καρδίαν⸃ ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/019.yaml
  text: By this we will know that we are from the truth[a], and before him we will persuade our hearts[b],
translation:
  language: fr
  text: C’est ainsi que nous saurons que nous sommes de la vérité[a], et, devant lui, nous rassurerons notre cœur[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous sommes issus de la vérité » ou « nous appartenons à la vérité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « nous persuaderons notre cœur » ou « nous apaiserons notre cœur devant lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: C’est ainsi
  rationale: Cette tournure française naturelle conserve la valeur démonstrative et instrumentale de l’expression grecque sans préciser indûment si elle renvoie à ce qui précède ou à ce qui suit.
- source_word: γνωσόμεθα
  choice: nous saurons
  rationale: Le futur simple rend directement le futur de γινώσκω, sans ajouter une nuance progressive ou ingressive.
- source_word: ἐκ τῆς ἀληθείας ἐσμέν
  choice: nous sommes issus de la vérité
  rationale: « Issus de » exprime en français moderne la provenance marquée par ἐκ tout en conservant la catégorie johannique de la vérité; « nous appartenons à la vérité » serait plus interprétatif.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: devant lui
  rationale: Rendu concis et formellement proche, pouvant aussi signifier « en sa présence ».
- source_word: πείσομεν
  choice: nous rassurerons
  rationale: Avec « cœur » comme objet et dans ce contexte d’assurance devant Dieu, πείθω prend vraisemblablement le sens de rassurer ou d’apaiser; une note conserve le sens plus littéral « persuader ».
- source_word: τὴν καρδίαν ἡμῶν
  choice: notre cœur
  rationale: Le singulier collectif du grec est naturel en français avec « notre » et préserve plus directement la forme source.
theological_decisions:
- issue: Portée de « issus de la vérité »
  choice: Conserver une expression de provenance sans l’expliciter doctrinalement.
  alternative: nous appartenons à la vérité
  rationale: Le texte ne définit pas ici toutes les implications de cette origine; la formulation retenue préserve l’ambiguïté et la tension johanniques.
- issue: Sens de πείσομεν appliqué au cœur
  choice: nous rassurerons notre cœur
  alternative: nous persuaderons notre cœur
  rationale: Le contexte immédiat concerne l’assurance devant Dieu, mais la variante littérale est signalée afin de ne pas masquer l’étendue sémantique du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset se termine par une virgule, conformément à sa continuité syntaxique avec le verset suivant. Les pronoms divins ne prennent pas de majuscule, selon l’usage courant.
