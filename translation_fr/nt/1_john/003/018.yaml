source:
  edition: SBLGNT
  text: ⸀Τεκνία, μὴ ἀγαπῶμεν λόγῳ μηδὲ τῇ γλώσσῃ ἀλλὰ ἐν ἔργῳ καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/018.yaml
  text: Little children[a], let us not love in word or with the tongue[b], but in deed and truth.
translation:
  language: fr
  text: Mes petits enfants, n’aimons pas en paroles ni avec la langue[a], mais en actes et en vérité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « en parole ni avec la langue ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre : « par des actes, avec sincérité » ; « vérité » conserve toutefois la portée plus large du grec.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Mes petits enfants
  rationale: Le vocatif diminutif exprime une adresse familiale et affectueuse. « Mes petits enfants » conserve cette tendresse dans un français naturel, sans ajouter explicitement « chers ».
- source_word: μὴ ἀγαπῶμεν
  choice: n’aimons pas
  rationale: Le subjonctif présent précédé de μή a ici une valeur d’exhortation négative à la première personne du pluriel. « N’aimons pas » la rend directement et naturellement.
- source_word: λόγῳ μηδὲ τῇ γλώσσῃ
  choice: en paroles ni seulement avec la langue
  rationale: « En paroles » rend λόγῳ, tandis que « avec la langue » conserve l’image concrète de γλώσσῃ. « Seulement » explicite sobrement que le contraste ne condamne pas les paroles elles-mêmes, mais un amour qui s’y limite.
- source_word: ἀλλὰ ἐν ἔργῳ
  choice: mais en actes
  rationale: ἔργον désigne l’acte ou l’action concrète. « En actes » forme en français un contraste net et naturel avec « en paroles ».
- source_word: καὶ ἀληθείᾳ
  choice: et en vérité
  rationale: « Vérité » préserve la valeur ordinaire de ἀλήθεια ainsi que sa résonance johannique, sans réduire le sens à la seule sincérité.
theological_decisions:
- issue: Portée de « vérité » dans l’expression ἐν ἔργῳ καὶ ἀληθείᾳ
  choice: Conserver « en vérité »
  alternative: « avec sincérité » ou « de façon authentique »
  rationale: Le terme peut qualifier l’authenticité de l’amour, mais il peut aussi évoquer un amour conforme à la vérité de Dieu. La traduction retenue préserve cette double portée.
- issue: Nature du contraste entre paroles et actes
  choice: Exprimer un amour qui ne se limite pas au discours
  alternative: Lire le verset comme une condamnation de toute expression verbale de l’amour
  rationale: Le contraste grec oppose l’amour purement verbal à l’amour concrètement mis en œuvre; il ne présente pas les paroles aimantes comme mauvaises en elles-mêmes.
translation_notes:
  register: Français international moderne, affectueux et digne. Le parallélisme « en paroles… en actes » est privilégié pour sa clarté, tandis que « avec la langue » maintient l’image du texte grec.
