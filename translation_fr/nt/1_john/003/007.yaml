  source_fidelity: 'Le sens du grec est fidèlement rendu : l’interdiction présente (« que personne ne vous égare »), la portée habituelle de ὁ ποιῶν (« celui qui pratique »), le lien δικαιοσύνη / δίκαιος (« justice / juste ») et la comparaison finale sont conservés. Le possessif « Mes » ne correspond cependant à aucun élément de τεκνία et doit être retiré.'
