source:
  edition: SBLGNT
  text: τεκνία, μηδεὶς πλανάτω ὑμᾶς· ὁ ποιῶν τὴν δικαιοσύνην δίκαιός ἐστιν, καθὼς ἐκεῖνος δίκαιός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/007.yaml
  text: Little children, let no one deceive you. The one who practices righteousness is righteous, just as that one is righteous.
translation:
  language: fr
  text: Petits enfants, que personne ne vous égare[a]. Celui qui pratique la justice est juste, tout comme lui est juste[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que personne ne vous trompe » ou « que personne ne vous séduise ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « celui-là » ; il s’agit probablement du Christ, bien que certains y voient une référence à Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: Mes petits enfants
  rationale: Le vocatif diminutif exprime une adresse familiale et affectueuse. « Mes petits enfants » est naturel en français biblique moderne et conserve cette tendresse.
- source_word: μηδεὶς πλανάτω ὑμᾶς
  choice: que personne ne vous égare
  rationale: La tournure rend l’interdiction grecque et conserve l’idée de conduire dans l’erreur, qu’elle soit doctrinale ou morale.
- source_word: ὁ ποιῶν
  choice: Celui qui pratique
  rationale: Le participe présent substantivé évoque une conduite caractéristique ou habituelle, et non un acte isolé.
- source_word: τὴν δικαιοσύνην
  choice: la justice
  rationale: En français, « pratiquer la justice » exprime naturellement une conduite droite et maintient le lien lexical avec « juste ».
- source_word: δίκαιός ἐστιν
  choice: est juste
  rationale: « Juste » décrit ici la qualité ou le caractère de la personne et préserve le lien avec δικαιοσύνη.
- source_word: καθὼς
  choice: comme
  rationale: Cette conjonction comparative rend clairement la correspondance exprimée par le grec sans alourdir la phrase.
- source_word: ἐκεῖνος
  choice: celui-là
  rationale: Le démonstratif est conservé afin de ne pas préciser dans le corps du texte un référent que le grec laisse implicite.
theological_decisions:
- issue: Référent de ἐκεῖνος
  choice: Conserver le démonstratif « celui-là » dans le texte principal.
  alternative: Traduire par « lui », « le Christ » ou comprendre le référent comme Dieu/le Père.
  rationale: Dans ce contexte johannique, le Christ est probablement visé, mais le texte grec ne le nomme pas. Le maintien du démonstratif préserve cette relative ouverture sans résoudre silencieusement la question.
translation_notes:
  register: Français international moderne, simple et digne. L’adresse affectueuse est conservée par « Mes petits enfants ». « Pratiquer la justice » rend une conduite habituelle et maintient le parallélisme entre δικαιοσύνη et δίκαιος.
