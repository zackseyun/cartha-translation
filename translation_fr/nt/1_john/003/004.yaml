  text: Πᾶς ὁ ποιῶν τὴν ἁμαρτίαν καὶ τὴν ἀνομίαν ποιεῖ, καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/004.yaml
  text: Everyone who practices sin also practices lawlessness[b][a], and sin is lawlessness.
translation:
  language: fr
  text: Quiconque pratique le péché pratique aussi la transgression de la loi[a], et le péché est la transgression de la loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « commet aussi une violation de la loi ». Les présents grecs peuvent se traduire plus littéralement par « fait », mais « pratique » fait ressortir ici l’idée d’une conduite caractéristique ou suivie. Le terme grec traduit par « transgression de la loi » peut aussi être rendu par « illégalité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ ποιῶν
  choice: Quiconque pratique
  rationale: Le participe présent substantivé a une portée générale. « Quiconque pratique » exprime naturellement en français une conduite caractéristique ou suivie, sans transformer la forme grecque en temps technique.
- source_word: τὴν ἁμαρτίαν
  choice: le péché
  rationale: En français, le nom abstrait se construit naturellement avec l’article défini. Il désigne ici le péché comme réalité ou conduite générale, non un acte précis déjà mentionné.
- source_word: καὶ τὴν ἀνομίαν ποιεῖ
  choice: pratique aussi le mépris de la loi
  rationale: La répétition de « pratique » conserve le parallélisme de ποιῶν et ποιεῖ. « Le mépris de la loi » rend l’idée d’ἀνομία de façon claire et digne, sans préciser de quelle loi il s’agit.
- source_word: ἀνομία
  choice: le mépris de la loi
  rationale: 'Cette formulation conserve le rapport à la loi tout en exprimant davantage qu’une simple infraction ponctuelle : une attitude ou conduite qui refuse son autorité. « Iniquité » serait moins transparent en français courant, et « violation de la loi » pourrait paraître trop strictement juridique.'
- source_word: καὶ ἡ ἁμαρτία ἐστὶν ἡ ἀνομία
  choice: et le péché, c’est le mépris de la loi
  rationale: La tournure disloquée avec « c’est » est idiomatique en français moderne et garde la force définitoire de la proposition grecque.
theological_decisions:
- issue: Rendre les présents grecs comme acte ponctuel ou comme conduite caractéristique
  choice: 'Conduite caractéristique : « pratique »'
  alternative: « commet » ou, plus littéralement, « fait »
  rationale: Dans le contexte immédiat de 1 Jean 3, les formes présentes peuvent décrire une conduite suivie ou caractéristique. « Pratique » fait ressortir cette valeur contextuelle sans nier qu’une traduction plus formelle soit possible.
- issue: Sens d’ἀνομία dans la proposition définitoire
  choice: « le mépris de la loi »
  alternative: « l’absence de loi », « la violation de la loi » ou « l’iniquité »
  rationale: Le texte associe directement le péché à ἀνομία. La traduction retenue préserve le rapport à la loi et la tension théologique sans identifier explicitement celle-ci à la loi mosaïque, civile ou à une autre catégorie doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « Quiconque » maintient la portée universelle sans formulation genrée. La répétition de « pratique » reproduit le parallélisme grec; la virgule avant « c’est » soutient une lecture fluide de la définition finale.
