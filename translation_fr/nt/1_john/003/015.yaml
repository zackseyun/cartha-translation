id: 1JN.3.15
reference: 1 John 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶς ὁ μισῶν τὸν ἀδελφὸν αὐτοῦ ἀνθρωποκτόνος ἐστίν, καὶ οἴδατε ὅτι πᾶς ἀνθρωποκτόνος οὐκ ἔχει ζωὴν αἰώνιον ἐν ⸀αὐτῷ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/015.yaml
  text: Everyone who hates his brother is a murderer[b][a], and you know that every murderer does not have eternal life remaining in him.
translation:
  language: fr
  text: Quiconque déteste son frère est un meurtrier[a], et vous savez qu’aucun meurtrier n’a la vie éternelle demeurant en lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « son frère » désigne probablement, dans le contexte, un autre membre de la communauté croyante ; le grec est au masculin singulier.
    reason: cultural_note
  - marker: b
    text: 'Ou : « restant en lui ». Le verbe grec μένω, souvent traduit par « demeurer » ou « rester », est un terme important dans les écrits de Jean.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ μισῶν
  choice: Quiconque déteste
  rationale: Le participe présent substantivé désigne toute personne caractérisée par cette haine. « Quiconque déteste » est naturel en français et conserve la portée générale de l’expression.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Le grec porte un masculin singulier. Dans le contexte johannique, il s’agit vraisemblablement d’un membre de la communauté croyante, sans que cette précision soit introduite dans le texte principal.
- source_word: ἀνθρωποκτόνος
  choice: meurtrier
  rationale: « Meurtrier » est l’équivalent français courant qui restitue clairement la force morale du terme.
- source_word: οἴδατε
  choice: vous savez
  rationale: Cette formulation rend naturellement la deuxième personne du pluriel.
- source_word: πᾶς ἀνθρωποκτόνος οὐκ ἔχει
  choice: aucun meurtrier n’a
  rationale: La négation du groupe universel se rend idiomatiquement en français par « aucun… ne », sans modifier le sens.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Expression française consacrée et naturelle dans les écrits johanniques, portant à la fois une dimension qualitative et durable.
- source_word: ἐν αὐτῷ μένουσαν
  choice: demeurant en lui
  rationale: Le participe présent qualifie la vie éternelle comme demeurant dans la personne. « Demeurer » conserve le lien lexical avec le thème johannique récurrent de μένω.
theological_decisions:
- issue: Portée de « frère »
  choice: Conserver « son frère » dans le texte principal.
  alternative: « son frère ou sa sœur » ; « un autre croyant »
  rationale: Le contexte vise probablement les membres de la communauté croyante, mais le grec demeure masculin singulier. La note signale la portée contextuelle sans la résoudre par une paraphrase.
- issue: Valeur de μένω
  choice: Traduire par « demeurant en lui ».
  alternative: « restant en lui » ; « qui demeure en lui »
  rationale: « Demeurer » est compréhensible en français moderne et maintient l’écho du vocabulaire johannique, tout en préservant l’idée d’une présence durable.
- issue: Lien entre haine et meurtre
  choice: Affirmer directement que celui qui hait est « un meurtrier ».
  alternative: « est comme un meurtrier »
  rationale: Le grec emploie une proposition nominale directe et ne contient aucun marqueur explicite de comparaison. Ajouter « comme » atténuerait l’affirmation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise et sentencieuse. « Quiconque » convient au registre biblique sans être archaïque ; « demeurant » préserve le lien thématique johannique tout en restant intelligible.
