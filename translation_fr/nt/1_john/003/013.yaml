id: 1JN.3.13
reference: 1 John 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀μὴ θαυμάζετε, ⸀ἀδελφοί, εἰ μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/013.yaml
  text: Do not be surprised[a], brothers, if the world hates you.
translation:
  language: fr
  text: Ne vous étonnez pas, frères[a], si le monde vous déteste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « frères » est au masculin pluriel et désigne vraisemblablement ici toute la communauté des croyants, femmes comprises.
    reason: Précision lexicale sur la portée représentative du masculin grec.
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: Ne vous étonnez pas
  rationale: L’impératif présent avec μή exprime ici une défense. « Ne vous étonnez pas » est naturel en français moderne et rend le sens contextuel de θαυμάζω sans l’archaïsme possible de « ne vous émerveillez pas ».
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif pluriel est grammaticalement masculin. « Frères » en conserve la forme, tandis qu’une note précise que l’interpellation vise vraisemblablement toute la communauté croyante, femmes comprises.
- source_word: εἰ
  choice: si
  rationale: « Si » conserve la forme conditionnelle du grec sans la transformer en « quand » ni présumer davantage du degré de réalité de la condition.
- source_word: μισεῖ
  choice: déteste
  rationale: Le présent de l’indicatif exprime une réalité générale ou continue. « Déteste » rend clairement μισέω en français courant; « hait » serait possible, mais plus marqué dans l’usage moderne.
- source_word: ὁ κόσμος
  choice: le monde
  rationale: « Le monde » préserve l’expression johannique et sa portée théologique sans l’expliciter abusivement par « le système du monde » ou « la société opposée à Dieu ».
theological_decisions:
- issue: Valeur représentative du masculin dans ἀδελφοί
  choice: Conserver « frères » dans le texte principal
  alternative: « frères et sœurs » ou « communauté »
  rationale: Le grec emploie une forme masculine plurielle, probablement représentative de l’ensemble des croyants. Le texte principal en conserve la forme, et la note signale sa portée vraisemblablement inclusive.
- issue: Sens johannique de κόσμος
  choice: Traduire simplement par « le monde »
  alternative: « le système du monde » ou « la société opposée à Dieu »
  rationale: Dans 1 Jean, κόσμος peut désigner l’humanité ou l’ordre humain opposé à Dieu. « Le monde » maintient cette densité et cette ambiguïté contextuelle sans imposer une paraphrase interprétative.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe brève du grec est conservée. « Déteste » est préféré à « hait » pour sa naturalité actuelle, sans atténuer l’hostilité exprimée.
