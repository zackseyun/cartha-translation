  text: ἡμεῖς οἴδαμεν ὅτι μεταβεβήκαμεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν, ὅτι ἀγαπῶμεν τοὺς ἀδελφούς· ὁ μὴ ⸀ἀγαπῶν μένει ἐν τῷ θανάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/014.yaml
  text: We know that we have passed from death into life[a], because we love the brothers. The one who does not love remains in death.
translation:
  language: fr
  text: Nous savons que nous sommes passés de la mort à la vie, parce que nous aimons les frères[a]. Celui qui n’aime pas demeure dans la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les frères et sœurs » ; le grec dit « les frères » et, dans ce contexte, ce terme désigne probablement les autres croyants en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: nous savons
  rationale: Le parfait οἶδα a en grec koinè une valeur stative présente ; « nous savons » est l’équivalent français naturel.
- source_word: μεταβεβήκαμεν
  choice: nous sommes passés
  rationale: Le parfait exprime un passage accompli dont le résultat demeure. Le passé composé français conserve naturellement cette transition et son état résultant.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: de la mort à la vie
  rationale: Cette formulation française idiomatique exprime clairement le mouvement hors de la mort vers la vie, sans développer la métaphore.
- source_word: ἀγαπῶμεν
  choice: nous aimons
  rationale: Le présent indique ici une conduite durable ou caractéristique ; « aimons » conserve simplement le vocabulaire de l’amour.
- source_word: τοὺς ἀδελφούς
  choice: les frères
  rationale: Le texte grec emploie un masculin pluriel. Le corps du texte en préserve la forme, tandis qu’une note signale son sens communautaire probablement inclusif.
- source_word: ὁ μὴ ἀγαπῶν
  choice: celui qui n’aime pas
  rationale: Le participe présent substantivé désigne de manière générale la personne caractérisée par l’absence d’amour ; cette tournure est claire et naturelle en français.
- source_word: μένει
  choice: demeure
  rationale: « Demeure » conserve le sens de persistance et fait écho au vocabulaire johannique de μένω, tout en restant compréhensible en français actuel.
- source_word: ἐν τῷ θανάτῳ
  choice: dans la mort
  rationale: La formulation garde intacte l’image compacte d’un état ou domaine de mort sans lui imposer une explication théologique.
theological_decisions:
- issue: Référent et portée de genre de ἀδελφοί
  choice: « les frères » dans le texte, avec en note le sens inclusif probable
  alternative: « les frères et sœurs »
  rationale: Le grec est au masculin pluriel, mais, dans ce contexte johannique, le terme désigne vraisemblablement l’ensemble des autres croyants, femmes comprises. La note préserve les deux données sans effacer la forme source.
- issue: Nature de « la mort » et de « la vie »
  choice: Conserver « la mort » et « la vie » sans explicitation
  alternative: « la mort spirituelle » et « la vie éternelle », ou « le domaine de la mort » et « le domaine de la vie »
  rationale: Le verset évoque une transition théologique profonde, mais il la formule par une opposition métaphorique concise. L’expliciter réduirait une tension que le grec laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé rend naturellement le parfait grec ; « demeure » conserve un terme johannique important sans archaïsme marqué. Le marqueur [a] est placé après « la vie » comme dans la couche de consultation anglaise, bien que la note porte sur « les frères ».
