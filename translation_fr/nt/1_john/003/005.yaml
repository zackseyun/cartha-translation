id: 1JN.3.5
reference: 1 John 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἴδατε ὅτι ἐκεῖνος ἐφανερώθη ἵνα τὰς ⸀ἁμαρτίας ἄρῃ, καὶ ἁμαρτία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/005.yaml
  text: And you know that he appeared in order to take away sins[b][a], and in him there is no sin.
translation:
  language: fr
  text: Et vous savez qu’il est apparu pour enlever les péchés[a], et qu’il n’y a pas de péché en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « emporter les péchés ». Le verbe grec peut signifier « enlever », « ôter » ou « emporter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδατε
  choice: vous savez
  rationale: Le parfait οἶδα a couramment un sens présent en grec koinè. « Vous savez » est la formulation française naturelle.
- source_word: ἐκεῖνος
  choice: il
  rationale: Le pronom démonstratif renvoie ici, dans le contexte johannique, à Jésus Christ. « Il » est idiomatique et n’ajoute pas un nom absent du texte grec.
- source_word: ἐφανερώθη
  choice: est apparu
  rationale: Le passif de φανερόω évoque ici la venue historique du Christ. « Est apparu » est naturel en français moderne et conserve l’idée de manifestation sans la lourdeur de « a été manifesté ».
- source_word: ἵνα
  choice: pour
  rationale: Avec l’infinitif, « pour » exprime clairement et naturellement le but marqué par ἵνα.
- source_word: ἁμαρτίας
  choice: les péchés
  rationale: Le pluriel grec désigne les péchés dans leur multiplicité concrète. L’article défini est requis idiomatiquement en français dans cette construction.
- source_word: ἄρῃ
  choice: enlever
  rationale: αἴρω peut signifier enlever, ôter ou emporter. « Enlever » exprime ici la suppression des péchés sans imposer un mécanisme expiatoire particulier.
- source_word: ἁμαρτία
  choice: péché
  rationale: Le singulier sans article exprime le péché comme réalité morale; « péché » garde cette formulation absolue.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Cette traduction directe préserve l’expression johannique et sa portée théologique.
theological_decisions:
- issue: Référent de ἐκεῖνος
  choice: Le pronom « il » renvoie à Jésus Christ.
  alternative: Traduire littéralement par « celui-là ».
  rationale: Le contexte immédiat identifie celui qui est apparu pour enlever les péchés et en qui il n’y a pas de péché comme Jésus Christ. Le pronom « il » garde cette référence sans explicitation doctrinale ajoutée.
- issue: Sens de αἴρω appliqué aux péchés
  choice: enlever les péchés
  alternative: porter ou emporter les péchés
  rationale: « Enlever » met en avant la suppression des péchés, comme le permet le verbe grec, sans réduire le verset à un modèle particulier de l’expiation. Une note conserve l’autre nuance lexicale possible.
- issue: Absence de péché en Christ
  choice: il n’y a pas de péché en lui
  alternative: le péché n’est pas en lui
  rationale: La formulation retenue est française et naturelle tout en préservant l’affirmation absolue du texte sur l’absence de péché en Christ.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe coordonnée du grec est conservée, avec répétition de « que » dans la seconde proposition pour assurer une lecture française fluide. Le terme traditionnel et largement compris « péché » est maintenu.
