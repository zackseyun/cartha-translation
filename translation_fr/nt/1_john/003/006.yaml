  text: πᾶς ὁ ἐν αὐτῷ μένων οὐχ ἁμαρτάνει· πᾶς ὁ ἁμαρτάνων οὐχ ἑώρακεν αὐτὸν οὐδὲ ἔγνωκεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/006.yaml
  text: Everyone who remains in him does not sin[a]; everyone who sins has not seen him nor known him.
translation:
  language: fr
  text: Quiconque demeure en lui ne pèche pas[a] ; quiconque pèche ne l’a pas vu et ne l’a pas connu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les formes grecques au présent peuvent décrire une action continue ou caractéristique; on peut donc aussi traduire : « ne continue pas à pécher […] continue à pécher ».'
    reason: alternative lexicale et nuance aspectuelle
lexical_decisions:
- source_word: πᾶς ὁ
  choice: Quiconque
  rationale: La construction générique désigne toute personne appartenant à la catégorie énoncée. « Quiconque » en préserve la portée universelle dans un français naturel et digne.
- source_word: ἐν αὐτῷ μένων
  choice: demeure en lui
  rationale: « Demeurer » conserve le vocabulaire relationnel caractéristique de Jean ainsi que l’idée de continuité exprimée par μένω, sans expliciter le référent du pronom.
- source_word: οὐχ ἁμαρτάνει
  choice: ne continue pas à pécher
  rationale: Le présent peut ici décrire une conduite continue ou caractéristique. Cette formulation rend cet aspect probable tout en maintenant l’affirmation éthique forte du texte.
- source_word: ὁ ἁμαρτάνων
  choice: quiconque continue à pécher
  rationale: Le participe présent désigne la personne caractérisée par cette activité. La formulation reste parallèle à la première proposition.
- source_word: οὐχ ἑώρακεν αὐτόν
  choice: ne l’a pas vu
  rationale: Le passé composé français rend naturellement le parfait grec et son état résultant, tout en conservant le pronom du texte source.
- source_word: οὐδὲ ἔγνωκεν αὐτόν
  choice: et ne l’a pas connu
  rationale: Dans cet emploi johannique, γινώσκω peut comporter une dimension relationnelle. « Connaître » la préserve sans paraphrase, tandis que « et ne… pas » rend naturellement οὐδέ après une première négation.
theological_decisions:
- issue: Le verset enseigne-t-il une perfection sans aucun péché chez les croyants ?
  choice: 'Rendre les présents grecs comme une action continue ou caractéristique : « ne continue pas à pécher… continue à pécher ».'
  alternative: 'Traduire formellement : « ne pèche pas… pèche ».'
  rationale: Cette solution tient compte de la valeur possible des formes au présent et de la tension interne de la lettre, qui condamne fermement le péché tout en reconnaissant ailleurs que les croyants peuvent pécher. La note signale toutefois la formulation plus formelle, car la continuité n’est pas exprimée par un adverbe distinct dans le grec.
- issue: Référent de αὐτῷ / αὐτόν
  choice: Conserver « lui / le » sans préciser davantage.
  alternative: Expliciter « Dieu », « le Fils » ou « Christ ».
  rationale: Le grec emploie un pronom. Ne pas en préciser le référent préserve la formulation et l’ambiguïté contextuelle du texte source.
translation_notes:
  register: Français international moderne, accessible et digne. « Demeure » conserve le terme johannique traditionnel sans archaïsme marqué. La ponctuation maintient le parallélisme serré des deux propositions.
