source:
  edition: SBLGNT
  text: ὅτι ἐὰν καταγινώσκῃ ἡμῶν ἡ καρδία, ὅτι μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν καὶ γινώσκει πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/020.yaml
  text: for if our heart condemns us[a], God is greater than our heart[b], and he knows all things.
translation:
  language: fr
  text: Car si notre cœur nous condamne[a], Dieu est plus grand que notre cœur[b] et il sait tout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous fait des reproches » ou « nous accuse ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « Dieu est plus grand que notre cœur » peut évoquer sa connaissance plus complète de la vérité à notre sujet et, par implication, son autorité sur notre propre condamnation.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Le premier ὅτι introduit l’explication ou le fondement de l’affirmation précédente; « Car » en restitue naturellement la valeur explicative.
- source_word: ἐὰν καταγινώσκῃ
  choice: même si … condamne
  rationale: ἐὰν avec le subjonctif exprime une éventualité conditionnelle. Dans cette construction française, « même si » fait ressortir le contraste rassurant avec la grandeur et la connaissance de Dieu, sans transformer la condition en fait établi.
- source_word: ἡμῶν ἡ καρδία
  choice: notre cœur
  rationale: « Cœur » conserve l’image de καρδία et sa portée comme centre de la vie intérieure, sans la réduire par interprétation à la seule conscience.
- source_word: ὅτι
  choice: non rendu séparément
  rationale: Le second ὅτι introduit le contenu ou le motif de l’assurance. En français idiomatique, sa force est portée par la proposition principale qui suit, sans qu’un second connecteur soit nécessaire.
- source_word: μείζων ἐστὶν ὁ θεὸς τῆς καρδίας ἡμῶν
  choice: Dieu est plus grand que notre cœur
  rationale: Cette formulation garde le comparatif volontairement large, sans le limiter à la miséricorde, à l’autorité ou à la connaissance.
- source_word: γινώσκει πάντα
  choice: il sait tout
  rationale: Formulation française naturelle et complète, qui conserve la portée universelle de πάντα.
theological_decisions:
- issue: Sens de « Dieu est plus grand que notre cœur »
  choice: Conserver l’affirmation dans toute son ampleur, tout en laissant la proposition « il sait tout » orienter le lecteur vers la connaissance parfaite de Dieu.
  alternative: Préciser que Dieu est plus miséricordieux que notre conscience, que son verdict annule notre condamnation intérieure, ou qu’il connaît mieux que nous toute la vérité à notre sujet.
  rationale: Le grec ne précise pas sous quel rapport Dieu est « plus grand ». La suite met sa connaissance en relief, mais n’épuise pas nécessairement la portée du comparatif; la traduction ne doit donc pas trancher silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. « Notre cœur » maintient l’image johannique; « il sait tout » est plus courant en français actuel que « il connaît toutes choses ». Les marqueurs [a] et [b] figurent dans le texte principal.
