id: 1JN.3.9
reference: 1 John 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ ἁμαρτίαν οὐ ποιεῖ, ὅτι σπέρμα αὐτοῦ ἐν αὐτῷ μένει, καὶ οὐ δύναται ἁμαρτάνειν, ὅτι ἐκ τοῦ θεοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/009.yaml
  text: Everyone who has been born of God does not practice sin[a], because his seed remains in him; and he is not able to keep sinning[c][b], because he has been born of God.
translation:
  language: fr
  text: Quiconque est né de Dieu ne pratique pas le péché[a], parce que sa semence demeure en lui[b] ; et il ne peut pas continuer à pécher[c], parce qu’il est né de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « ne fait pas le péché » ou « ne commet pas le péché ». Dans ce contexte, le présent grec désigne probablement une pratique continue ou caractéristique plutôt qu’un acte isolé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « reste en lui ».'
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « il ne peut pas pécher ». Dans ce contexte, l’infinitif présent grec peut avoir le sens de « continuer à pécher » ou « persister dans le péché ».'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ γεγεννημένος
  choice: Quiconque est né
  rationale: Cette formulation naturelle exprime la portée générale de πᾶς avec le participe substantivé. Le passé composé français « est né » convient à l’état résultant exprimé par le parfait grec.
- source_word: ἐκ τοῦ θεοῦ
  choice: de Dieu
  rationale: Avec γεννάω, ἐκ indique l’origine. « Né de Dieu » est une expression française claire et établie qui conserve cette idée de provenance.
- source_word: ἁμαρτίαν οὐ ποιεῖ
  choice: ne pratique pas le péché
  rationale: L’expression ποιεῖν ἁμαρτίαν signifie formellement « faire/commettre le péché », mais le présent et le parallèle qui suit favorisent ici l’idée d’une conduite persistante ou caractéristique. « Pratiquer le péché » rend cette valeur sans suggérer qu’un seul acte serait impossible.
- source_word: σπέρμα αὐτοῦ
  choice: sa semence
  rationale: « Semence » conserve la métaphore concrète de σπέρμα sans décider si elle désigne précisément la parole, la vie ou la nature de Dieu. Dans le contexte immédiat, le possessif renvoie à Dieu.
- source_word: ἐν αὐτῷ μένει
  choice: demeure en lui
  rationale: « Demeurer » rend la continuité de μένω et maintient un terme important du vocabulaire johannique, tout en restant compréhensible en français moderne.
- source_word: οὐ δύναται ἁμαρτάνειν
  choice: il ne peut pas continuer à pécher
  rationale: L’infinitif présent ἁμαρτάνειν peut, dans ce contexte, décrire une action continue. « Continuer à pécher » rend cette valeur probable tout en signalant en note la formulation plus littérale.
- source_word: γεγέννηται
  choice: il est né
  rationale: Le passé composé français exprime naturellement à la fois l’événement accompli et l’état qui en résulte, correspondant au parfait grec.
theological_decisions:
- issue: Le verset enseigne-t-il une incapacité absolue à commettre le moindre péché, ou l’incompatibilité de la nouvelle naissance avec une pratique persistante du péché ?
  choice: Le texte principal exclut la pratique continue ou caractéristique du péché.
  alternative: « Il ne peut pas pécher », compris comme une incapacité absolue à commettre quelque péché que ce soit.
  rationale: Les présents ποιεῖ et ἁμαρτάνειν, ainsi que le contexte de 1 Jean 1.8–2.1, favorisent une lecture continue ou habituelle. La traduction conserve toutefois la formulation plus littérale en note afin de ne pas effacer la force ni la tension du grec.
- issue: Que désigne « sa semence » ?
  choice: La métaphore est conservée sans en préciser le référent.
  alternative: La parole de Dieu, la vie de Dieu ou la nature de Dieu.
  rationale: Le texte ne définit pas explicitement σπέρμα. Traduire directement par l’une de ces interprétations introduirait une précision doctrinale absente du verset.
translation_notes:
  register: Français international moderne, naturel et digne. « Quiconque » convient au caractère général de l’affirmation ; « demeure » préserve le vocabulaire johannique sans être obscur. La ponctuation maintient les deux propositions causales parallèles.
