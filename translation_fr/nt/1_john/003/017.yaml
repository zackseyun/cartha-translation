id: 1JN.3.17
reference: 1 John 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν ἔχῃ τὸν βίον τοῦ κόσμου καὶ θεωρῇ τὸν ἀδελφὸν αὐτοῦ χρείαν ἔχοντα καὶ κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ, πῶς ἡ ἀγάπη τοῦ θεοῦ μένει ἐν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/017.yaml
  text: But whoever has the world's goods and sees his brother in need[c][b][a], yet closes his heart against him—how does the love of God remain in him?
translation:
  language: fr
  text: Mais si quelqu’un possède les biens de ce monde, voit son frère[a] dans le besoin et lui ferme son cœur[b], comment l’amour de Dieu[c] demeure-t-il en lui ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son frère ou sa sœur » ; le grec dit « frère », terme qui peut représenter ici un autre croyant ou une autre croyante.
    reason: lexical_alternative
  - marker: b
    text: Ou « lui refuse sa compassion » ; littéralement, « lui ferme ses entrailles », expression qui désigne le refus d’une compassion profonde.
    reason: lexical_alternative
  - marker: c
    text: « L’amour de Dieu » peut désigner l’amour de Dieu présent en cette personne ou l’amour de cette personne pour Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: βίον τοῦ κόσμου
  choice: les biens de ce monde
  rationale: Dans ce contexte, βίος désigne les ressources matérielles qui permettent de vivre. « Les biens de ce monde » est naturel en français et convient à la question de répondre au besoin d’autrui.
- source_word: θεωρῇ
  choice: voit
  rationale: Le verbe exprime ici une perception directe et consciente de la situation du frère. « Voit » reste simple et fidèle.
- source_word: ἀδελφὸν
  choice: frère
  rationale: Le grec emploie le masculin singulier. « Frère » en conserve la forme lexicale, tout en pouvant représenter ici un autre croyant ou une autre croyante, comme l’indique la note.
- source_word: χρείαν ἔχοντα
  choice: dans le besoin
  rationale: Cette expression rend naturellement en français l’idée littérale d’« avoir un besoin », notamment le manque du nécessaire.
- source_word: κλείσῃ τὰ σπλάγχνα αὐτοῦ ἀπ’ αὐτοῦ
  choice: lui ferme son cœur
  rationale: Les « entrailles » désignent idiomatiquement le siège de la compassion profonde. L’expression française conserve l’image d’une fermeture intérieure et le refus délibéré de compatir.
- source_word: πῶς
  choice: comment
  rationale: « Comment » introduit fidèlement la question rhétorique sans ajouter explicitement une impossibilité modale.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: l’amour de Dieu
  rationale: Cette formulation préserve l’ambiguïté du génitif grec entre l’amour venant de Dieu et l’amour dirigé vers Dieu.
- source_word: μένει ἐν αὐτῷ
  choice: demeure-t-il en lui
  rationale: « Demeurer » restitue le vocabulaire johannique de μένω et sa nuance de permanence relationnelle, dans un registre français actuel et digne.
theological_decisions:
- issue: Ambiguïté de « l’amour de Dieu »
  choice: Conserver « l’amour de Dieu » sans préciser le sens du génitif.
  alternative: « l’amour que Dieu lui porte » ou « son amour pour Dieu »
  rationale: Le grec permet les deux compréhensions, et le contexte johannique lie étroitement l’amour reçu de Dieu et l’amour manifesté envers Dieu. La traduction ne doit pas trancher silencieusement.
- issue: Portée de ἀδελφὸν
  choice: Traduire par « frère » dans le texte principal.
  alternative: « frère ou sœur » ou « autre croyant »
  rationale: Le grec est au masculin singulier. Une note peut expliciter sa portée représentative sans remplacer la forme lexicale dans le texte.
translation_notes:
  register: 'Français international moderne, naturel et digne. La syntaxe directe conserve la progression du grec : possession de ressources, constat du besoin, fermeture du cœur, puis question rhétorique. Les notes rendent visibles l’idiome corporel, la portée possible de « frère » et l’ambiguïté théologique du génitif.'
