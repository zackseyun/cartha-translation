reference: 1 John 3:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὃ ⸀ἐὰν αἰτῶμεν λαμβάνομεν ⸀ἀπ’ αὐτοῦ, ὅτι τὰς ἐντολὰς αὐτοῦ τηροῦμεν καὶ τὰ ἀρεστὰ ἐνώπιον αὐτοῦ ποιοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/003/022.yaml
  text: And whatever we ask[a], we receive from him, because we keep his commandments and do what is pleasing in his sight.
translation:
  language: fr
  text: Et tout ce que nous demandons, nous le recevons de lui, parce que nous gardons ses commandements et faisons ce qui est agréable à ses yeux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ce qui est agréable devant lui ».'
    reason: Précise la formulation spatiale ou relationnelle de ἐνώπιον αὐτοῦ, rendue idiomatiquement par « à ses yeux » dans le texte.
lexical_decisions:
- source_word: ὃ ἐὰν
  choice: tout ce que
  rationale: La construction relative indéfinie signifie « tout ce que » ou « quoi que ». « Tout ce que » est naturel en français et s’intègre clairement à la reprise pronominale « nous le recevons ».
- source_word: αἰτῶμεν
  choice: nous demandons
  rationale: Dans ce contexte de prière et de requête, αἰτέω se rend naturellement par « demander ».
- source_word: λαμβάνομεν
  choice: nous le recevons
  rationale: Le présent exprime ici une réalité générale. Le pronom « le » reprend « tout ce que » et rend la phrase idiomatique en français.
- source_word: ἀπ’ αὐτοῦ
  choice: de lui
  rationale: 'La préposition ἀπό avec le génitif indique la source : ce qui est demandé est reçu de lui.'
- source_word: ὅτι
  choice: parce que
  rationale: ὅτι introduit explicitement la raison donnée dans le texte et doit conserver sa force causale.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: ses commandements
  rationale: « Commandements » préserve le vocabulaire éthique et théologique caractéristique des écrits johanniques.
- source_word: τηροῦμεν
  choice: nous gardons
  rationale: '« Garder » conserve la nuance johannique de τηρέω : observer fidèlement, et non seulement obéir ponctuellement.'
- source_word: τὰ ἀρεστὰ ἐνώπιον αὐτοῦ
  choice: ce qui lui est agréable
  rationale: Cette formulation française naturelle exprime ce qui est plaisant devant Dieu. Le rapport à son regard ou à sa présence, porté par ἐνώπιον αὐτοῦ, est rendu implicitement par « lui » et explicité dans la note.
- source_word: ποιοῦμεν
  choice: faisons
  rationale: ποιέω est le verbe courant « faire » ; aucune nuance plus spécialisée, telle que « pratiquer », n’est nécessaire ici.
theological_decisions:
- issue: Rapport entre l’exaucement de la prière et l’obéissance
  choice: 'Maintenir le lien causal explicite : « parce que nous gardons ses commandements… »'
  alternative: Affaiblir ce rapport en présentant seulement l’obéissance comme une circonstance associée à la prière.
  rationale: Le grec emploie ὅτι pour donner une raison. La traduction conserve donc la tension théologique du verset sans transformer celui-ci en formule mécanique ni atténuer son affirmation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste accessible tout en conservant le lien causal et le vocabulaire johannique de « garder ses commandements ».
