id: 1JN.5.3
reference: 1 John 5:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὕτη γάρ ἐστιν ἡ ἀγάπη τοῦ θεοῦ ἵνα τὰς ἐντολὰς αὐτοῦ τηρῶμεν, καὶ αἱ ἐντολαὶ αὐτοῦ βαρεῖαι οὐκ εἰσίν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/003.yaml
  text: 'For this is the love of God: that we keep his commandments[a], and his commandments are not burdensome.'
translation:
  language: fr
  text: En effet, l’amour pour Dieu consiste à garder ses commandements[a], et ses commandements ne sont pas pénibles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La formule grecque peut aussi se comprendre comme « l’amour de Dieu », c’est-à-dire l’amour qui vient de Dieu. Le contexte immédiat favorise toutefois « l’amour pour Dieu ».
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη
  choice: consiste à
  rationale: Le démonstratif, avec la proposition introduite par ἵνα, annonce ici ce qui caractérise concrètement l’amour pour Dieu. « consiste à » rend cette relation de manière naturelle en français.
- source_word: γάρ
  choice: En effet
  rationale: Le connecteur introduit l’explication de l’affirmation précédente. « En effet » exprime clairement cette fonction justificative en français moderne.
- source_word: ἀγάπη τοῦ θεοῦ
  choice: l’amour pour Dieu
  rationale: 'Dans le contexte immédiat, le génitif est très probablement objectif : il s’agit de l’amour des croyants dirigé vers Dieu, manifesté par l’obéissance. La note signale l’autre analyse grammaticale possible.'
- source_word: ἵνα
  choice: à
  rationale: ἵνα introduit ici le contenu ou la définition pratique de cet amour, plutôt qu’un simple but. La construction « consiste à » est idiomatique en français.
- source_word: ἐντολάς
  choice: commandements
  rationale: « Commandements » conserve la force normative du terme et son emploi caractéristique dans les écrits johanniques.
- source_word: τηρῶμεν
  choice: garder
  rationale: Le verbe τηρέω signifie ici observer fidèlement les commandements. « Garder » préserve le vocabulaire johannique tout en restant compréhensible en français biblique moderne.
- source_word: βαρεῖαι
  choice: pénibles
  rationale: L’adjectif désigne ce qui pèse et est difficile à porter. « Pénibles » communique naturellement l’idée sans suggérer que les commandements seraient seulement importants ou solennels.
theological_decisions:
- issue: Sens du génitif dans ἡ ἀγάπη τοῦ θεοῦ
  choice: 'Génitif objectif : l’amour des croyants pour Dieu'
  alternative: 'Génitif subjectif : l’amour qui vient de Dieu ou que Dieu manifeste'
  rationale: Le verset précédent associe l’amour pour Dieu à l’accomplissement de ses commandements, et le présent verset définit aussitôt cet amour par leur observation. Le sens objectif est donc privilégié dans le texte, tandis qu’une note préserve l’ambiguïté grammaticale réelle.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » rend la liaison argumentative; « consiste à garder » évite une tournure lourde tout en conservant la fonction explicative de ἵνα. Le choix « pénibles » exprime le poids difficile à porter indiqué par βαρεῖαι.
