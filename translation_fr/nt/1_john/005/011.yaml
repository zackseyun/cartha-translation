id: 1JN.5.11
reference: 1 John 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ μαρτυρία, ὅτι ζωὴν αἰώνιον ἔδωκεν ⸂ὁ θεὸς ἡμῖν⸃, καὶ αὕτη ἡ ζωὴ ἐν τῷ υἱῷ αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/011.yaml
  text: 'And this is the testimony: that God has given us eternal life[c][b][a], and this life is in his Son.'
translation:
  language: fr
  text: 'Et voici le témoignage : Dieu nous a donné la vie éternelle, et cette vie est dans son Fils.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μαρτυρία
  choice: témoignage
  rationale: « Témoignage » désigne naturellement en français le contenu de ce qui est attesté et convient au cadre probatoire du passage.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent idiomatiquement en français le contenu du témoignage, sans ajouter d’explication absente du grec.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Expression française consacrée, claire et fidèle à l’usage johannique, qui évoque à la fois la durée et la qualité de la vie venant de Dieu.
- source_word: ἔδωκεν
  choice: a donné
  rationale: Le passé composé exprime naturellement en français l’acte accompli de Dieu dont le résultat demeure présent.
- source_word: ἡμῖν
  choice: nous
  rationale: Rend directement le datif sans préciser davantage l’étendue du groupe auquel l’auteur s’associe.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: dans son Fils
  rationale: Conserve la préposition ἐν et la formulation johannique compacte, sans la réduire à « par son Fils » ni à « auprès de son Fils ».
- source_word: αὕτη ... αὕτη ἡ ζωή
  choice: voici ... cette vie
  rationale: « Voici » rend naturellement la première formule démonstrative, tandis que « cette vie » reprend explicitement la vie qui vient d’être mentionnée.
theological_decisions:
- issue: Valeur de l’aoriste ἔδωκεν et possession présente de la vie
  choice: « Dieu nous a donné la vie éternelle »
  alternative: « Dieu nous donna la vie éternelle »
  rationale: Le passé composé maintient l’acte accompli tout en faisant entendre son résultat actuel, sans préciser le moment ni imposer un système doctrinal.
- issue: La vie est « dans son Fils »
  choice: Maintien de « dans son Fils »
  alternative: « par son Fils » ou « auprès de son Fils »
  rationale: La formulation conserve l’ambiguïté féconde de l’expression johannique, qui peut évoquer le lieu, la relation et la source, sans la ramener exclusivement au moyen ou à la possession.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde la répétition de « vie » et la formulation théologiquement dense « dans son Fils ». La majuscule à « Fils » signale le titre christologique dans ce contexte.
