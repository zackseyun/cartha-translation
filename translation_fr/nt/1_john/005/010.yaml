- from: Celui qui croit au Fils de Dieu a ce témoignage en lui-même[a] ; celui qui ne croit pas Dieu fait de lui un menteur, puisqu’il n’a pas cru au témoignage que Dieu a rendu au sujet de son Fils.[b]
  to: Celui qui croit au Fils de Dieu a le témoignage en lui-même[a] ; celui qui ne croit pas Dieu a fait de lui un menteur[b], puisqu’il n’a pas cru au témoignage que Dieu a rendu au sujet de son Fils.
  rationale: La révision restitue le parfait de πεποίηκεν par « a fait », retire le démonstratif ajouté devant « témoignage » et rattache la note lexicale à l’expression qu’elle explique. Elle conserve l’ambiguïté textuelle signalée par la note a ainsi que la distinction johannique entre « croire au Fils » et « croire Dieu ».
