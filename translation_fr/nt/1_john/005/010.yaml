source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ ἔχει τὴν μαρτυρίαν ἐν ⸀αὑτῷ· ὁ μὴ πιστεύων τῷ θεῷ ψεύστην πεποίηκεν αὐτόν, ὅτι οὐ πεπίστευκεν εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/010.yaml
  text: The one who believes in the Son of God has the testimony in himself[a]; the one who does not believe God has made him a liar[b], because he has not believed the testimony that God has testified about his Son.
translation:
  language: fr
  text: Celui qui croit au Fils de Dieu a le témoignage en lui-même[a] ; celui qui ne croit pas Dieu a fait de lui un menteur[b], puisqu’il n’a pas cru au témoignage que Dieu a rendu au sujet de son Fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « en lui » plutôt que « en lui-même » ; cette leçon pourrait aussi être comprise comme « dans le Fils ».
    reason: textual_variant
  - marker: b
    text: '« A fait de lui un menteur » signifie ici que le refus du témoignage de Dieu revient à traiter Dieu comme s’il était menteur. On pourrait aussi traduire : « le tient pour menteur » ou « le fait passer pour un menteur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱὸν τοῦ θεοῦ
  choice: Celui qui croit au Fils de Dieu
  rationale: La tournure générique au singulier rend le participe substantivé, tandis que « croire à quelqu’un » exprime ici la confiance dirigée vers le Fils sans employer une formulation archaïque.
- source_word: τὴν μαρτυρίαν
  choice: ce témoignage
  rationale: « Témoignage » conserve la nuance juridique et johannique ; le démonstratif est naturel en français pour reprendre le témoignage évoqué dans le contexte immédiat.
- source_word: ἐν αὑτῷ
  choice: en lui-même
  rationale: Le pronom réfléchi renvoie naturellement au croyant et exprime la présence intérieure du témoignage.
- source_word: ὁ μὴ πιστεύων τῷ θεῷ
  choice: celui qui ne croit pas Dieu
  rationale: Le datif désigne le refus d'accepter comme vraie la parole de Dieu, et non la simple négation de son existence ; « ne croit pas Dieu » maintient cette distinction.
- source_word: ψεύστην πεποίηκεν αὐτόν
  choice: fait de lui un menteur
  rationale: 'Cette formulation proche du grec conserve la force provocante de l''expression : rejeter le témoignage de Dieu revient à le présenter ou à le tenir pour menteur.'
- source_word: οὐ πεπίστευκεν
  choice: n’a pas cru
  rationale: Le passé composé rend naturellement en français l'état présent résultant du parfait grec.
- source_word: εἰς τὴν μαρτυρίαν ἣν μεμαρτύρηκεν ὁ θεὸς
  choice: au témoignage que Dieu a rendu
  rationale: « Croire au témoignage » est idiomatique en français. L'association « témoignage / rendre » restitue naturellement le couple lexical grec sans lourde répétition.
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: au sujet de son Fils
  rationale: Cette expression rend précisément περί avec le génitif dans un français moderne et digne.
theological_decisions:
- issue: Référent du témoignage « en lui-même »
  choice: Le témoignage se trouve intérieurement dans le croyant.
  alternative: Le témoignage se trouve dans le Fils.
  rationale: Le texte du SBLGNT porte le réfléchi ἐν αὑτῷ, qui renvoie le plus naturellement au croyant mentionné juste avant. La variante est signalée sans imposer une explication doctrinale.
- issue: Sens de « ne croit pas Dieu »
  choice: Il s’agit du refus de tenir pour vrai le témoignage donné par Dieu.
  alternative: Il s’agirait de l’absence générale de foi en Dieu ou de la négation de son existence.
  rationale: La proposition causale qui suit définit cette incrédulité comme le refus de croire le témoignage de Dieu au sujet de son Fils.
- issue: Force de « fait de lui un menteur »
  choice: Conserver l’expression directe du grec.
  alternative: « le tient pour menteur » ou « fait passer Dieu pour un menteur »
  rationale: La formulation directe préserve la tension rhétorique du texte ; une note explique qu’il ne s’agit pas de rendre Dieu mensonger, mais de le traiter comme tel en rejetant son témoignage.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme du grec. « Croire au Fils » et « croire Dieu » sont distingués intentionnellement, et l'expression abrupte « fait de lui un menteur » est maintenue avec une note explicative.
