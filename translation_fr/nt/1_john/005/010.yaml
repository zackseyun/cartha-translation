  source_fidelity: 'Révision nécessaire : πεποίηκεν est un parfait et doit être rendu par « a fait », non par le présent « fait ». Le reste rend fidèlement les distinctions importantes : πιστεύειν εἰς le Fils, πιστεύειν Dieu, et le témoignage que Dieu a rendu au sujet de son Fils.'
  naturalness: Le français est clair et d’un registre moderne et digne. « Le témoignage » est plus exact et plus sobre que « ce témoignage », qui ajoute une valeur démonstrative non explicitée par l’article grec. L’appel de note sur « un menteur » doit être placé immédiatement après l’expression expliquée.
  terminology: « Témoignage », « Fils de Dieu », « croire Dieu » et « au sujet de son Fils » sont appropriés. « A fait de lui un menteur » conserve à la fois la formulation forte et l’aspect résultatif du parfait grec, sans suggérer que Dieu serait effectivement devenu menteur.
