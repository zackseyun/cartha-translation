id: 1JN.5.20
reference: 1 John 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι ὁ υἱὸς τοῦ θεοῦ ἥκει, καὶ δέδωκεν ἡμῖν διάνοιαν ἵνα ⸀γινώσκωμεν τὸν ἀληθινόν· καὶ ἐσμὲν ἐν τῷ ἀληθινῷ, ἐν τῷ υἱῷ αὐτοῦ Ἰησοῦ Χριστῷ. οὗτός ἐστιν ὁ ἀληθινὸς θεὸς καὶ ζωὴ αἰώνιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/020.yaml
  text: And we know that the Son of God has come and has given us understanding so that we may know the True One; and we are in the True One[a], in his Son Jesus the Messiah. This one is the true God and eternal life.
translation:
  language: fr
  text: Nous savons que le Fils de Dieu est venu et qu’il nous a donné l’intelligence afin que nous connaissions le Véritable. Nous sommes dans le Véritable, dans son Fils Jésus le Messie. Celui-ci[a] est le vrai Dieu et la vie éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Celui-ci » peut désigner précisément Jésus le Messie, son antécédent personnel le plus proche. Certains comprennent toutefois que ce démonstratif renvoie au « Véritable », c’est-à-dire au Père, dans la proposition précédente.
    reason: L’antécédent du démonstratif grec οὗτός est discuté; la note conserve les deux lectures possibles sans trancher au-delà de la syntaxe.
lexical_decisions:
- source_word: οἴδαμεν
  choice: nous savons
  rationale: Le parfait οἶδα a ici une valeur stative présente et exprime une connaissance établie.
- source_word: ἥκει
  choice: est venu
  rationale: Le verbe désigne une venue accomplie dont le résultat demeure; le passé composé français l’exprime naturellement.
- source_word: δέδωκεν
  choice: a donné
  rationale: Le parfait présente le don comme accompli avec un effet durable; le passé composé convient au français courant.
- source_word: διάνοιαν
  choice: l’intelligence
  rationale: Le terme désigne ici la faculté de comprendre ou de discerner, plutôt que le seul esprit comme organe abstrait.
- source_word: ἵνα γινώσκωμεν
  choice: afin que nous connaissions
  rationale: Cette tournure conserve explicitement la valeur de but de ἵνα avec le subjonctif.
- source_word: τὸν ἀληθινόν / τῷ ἀληθινῷ
  choice: le Véritable / dans le Véritable
  rationale: L’adjectif substantivé désigne une personne. La même expression est conservée dans les deux occurrences pour rendre la répétition johannique; la majuscule signale le référent divin sans préciser davantage son identité.
- source_word: ἐσμὲν ἐν
  choice: nous sommes dans
  rationale: Traduction directe qui préserve le langage relationnel johannique sans ajouter les notions de demeure ou d’union, absentes du verbe grec.
- source_word: ἐν τῷ υἱῷ αὐτοῦ
  choice: dans son Fils
  rationale: Rend naturellement la préposition et la relation possessive sans explicitation interprétative.
- source_word: Ἰησοῦ Χριστῷ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre; « le Messie » est idiomatique et intelligible en français.
- source_word: οὗτός
  choice: Celui-ci
  rationale: Le démonstratif français reflète plus directement οὗτός qu’un simple pronom personnel et laisse perceptible la question de son antécédent.
- source_word: ὁ ἀληθινὸς θεὸς
  choice: le vrai Dieu
  rationale: Expression française naturelle et précise correspondant au syntagme grec.
- source_word: ζωὴ αἰώνιος
  choice: la vie éternelle
  rationale: Formulation établie dans le vocabulaire johannique, qui rend la durée et la qualité de cette vie.
theological_decisions:
- issue: Antécédent de οὗτός dans la dernière proposition
  choice: Conserver le démonstratif « Celui-ci », dont l’antécédent le plus proche est Jésus le Messie.
  alternative: Comprendre « Celui-ci » comme renvoyant au Véritable, c’est-à-dire au Père, mentionné dans la proposition précédente.
  rationale: La proximité syntaxique favorise Jésus le Messie, mais la construction permet historiquement une autre compréhension. Le texte principal ne remplace donc pas le démonstratif par un nom explicite, et une note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « le Véritable » ainsi que la construction « être dans » sont volontairement conservées pour respecter le style et la tension théologique du texte johannique.
