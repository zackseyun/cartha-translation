id: 1JN.5.12
reference: 1 John 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἔχων τὸν υἱὸν ἔχει τὴν ζωήν· ὁ μὴ ἔχων τὸν υἱὸν τοῦ θεοῦ τὴν ζωὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/012.yaml
  text: The one who has the Son has life[a]; the one who does not have the Son of God does not have life.
translation:
  language: fr
  text: Celui qui a le Fils a la vie[a] ; celui qui n’a pas le Fils de Dieu n’a pas la vie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la vie éternelle » ; dans l’usage johannique, « la vie » désigne ici la vie qui se trouve dans le Fils.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: celui qui a
  rationale: L’article suivi du participe présent forme une expression substantivée désignant de manière générale la personne caractérisée par le fait d’avoir le Fils. « Celui qui a » est naturel et conserve le singulier générique.
- source_word: τὸν υἱόν
  choice: le Fils
  rationale: La première proposition dit simplement « le Fils ». Cette forme brève préserve la variation du grec, tandis que le contexte et la seconde proposition en précisent l’identité.
- source_word: ἔχει
  choice: a
  rationale: Traduction directe et idiomatique de ἔχω, qui laisse intacte la portée relationnelle et théologique du verbe sans la surinterpréter par « possède ».
- source_word: τὴν ζωήν
  choice: la vie
  rationale: Le français emploie naturellement l’article défini ici. « La vie » conserve le terme du grec et sa densité johannique sans ajouter explicitement « éternelle ».
- source_word: ὁ μὴ ἔχων
  choice: celui qui n’a pas
  rationale: μή nie le participe substantivé. Cette formulation reprend celle de la première proposition et maintient l’antithèse équilibrée.
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Cette traduction transparente conserve le titre christologique complet et la relation génitive explicitement exprimée dans le grec.
- source_word: οὐκ ἔχει
  choice: n’a pas
  rationale: οὐκ nie le verbe conjugué. « N’a pas » est la tournure française moderne et maintient le parallélisme avec la proposition affirmative.
theological_decisions:
- issue: Sens de « vie » dans le contexte johannique
  choice: Traduire ζωή par « la vie » sans développer en « la vie éternelle » dans le texte principal.
  alternative: la vie éternelle
  rationale: Dans 1 Jean, ζωή désigne souvent la vie éternelle qui se trouve dans le Fils, mais ce verset porte simplement ζωή. Le texte principal conserve donc l’expression du grec, et une note en indique la portée contextuelle.
- issue: Portée générique des participes substantivés masculins
  choice: Employer « celui qui… » comme singulier générique.
  alternative: quiconque…
  rationale: Le grec est au masculin singulier sur le plan grammatical, mais sa portée est générale. « Celui qui… » reproduit la structure et le singulier sans restreindre l’énoncé aux hommes.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme serré et la répétition de « a / n’a pas » ainsi que de « la vie » reproduisent l’antithèse du grec. L’espace avant le point-virgule suit la typographie française.
