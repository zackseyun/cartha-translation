id: 1JN.5.1
reference: 1 John 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πᾶς ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ἐκ τοῦ θεοῦ γεγέννηται, καὶ πᾶς ὁ ἀγαπῶν τὸν γεννήσαντα ἀγαπᾷ ⸀καὶ τὸν γεγεννημένον ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/001.yaml
  text: Everyone who believes that Jesus is the Messiah has been born of God[b][a], and everyone who loves the one who fathered him also loves the one born of him.
translation:
  language: fr
  text: Toute personne qui croit que Jésus est le Messie[a] est née de Dieu[b], et toute personne qui aime celui qui l’a engendrée aime aussi celui qui est né de lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός (Christos) signifie « l’Oint » et correspond à « Messie ».
    reason: alternative_reading
  - marker: b
    text: On pourrait aussi traduire par « a été engendrée par Dieu ». Le grec emploie dans tout le verset plusieurs formes du même verbe, qui peut exprimer l’action d’engendrer ou celle de naître.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ὁ πιστεύων
  choice: Toute personne qui croit
  rationale: Le participe présent substantivé a une portée générale. Cette formulation inclusive et naturelle exprime « quiconque croit » sans alourdir la phrase.
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: que Jésus est le Messie
  rationale: Χριστός fonctionne ici comme un titre confessionnel désignant l’Oint attendu; « Messie » en communique le sens plutôt que de simplement le translittérer.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: est née de Dieu
  rationale: Le parfait passif présente une naissance accomplie dont le résultat demeure. En français, « est née de Dieu » conserve l’image johannique de la naissance divine et convient grammaticalement à « toute personne ».
- source_word: πᾶς ὁ ἀγαπῶν
  choice: toute personne qui aime
  rationale: La reprise de « toute personne » rend clairement la valeur générale du participe substantivé et maintient le parallélisme avec la première proposition.
- source_word: τὸν γεννήσαντα
  choice: celui qui a engendré
  rationale: L’aoriste actif substantivé désigne Dieu comme celui qui engendre. La formulation reste proche du grec sans ajouter un complément d’objet explicite absent du texte source.
- source_word: ἀγαπᾷ καὶ
  choice: aime aussi
  rationale: '« Aussi » rend naturellement la valeur additive de καί: l’amour porté à celui qui engendre s’étend également à celui qui est né de lui.'
- source_word: τὸν γεγεννημένον ἐξ αὐτοῦ
  choice: celui qui est né de lui
  rationale: Cette expression maintient le lien lexical et imagé avec « est née de Dieu », tout en laissant au singulier sa portée représentative plutôt que de le paraphraser par « son enfant ».
theological_decisions:
- issue: Langage de l’engendrement et de la naissance venant de Dieu
  choice: Employer « née de Dieu », « celui qui a engendré » et « celui qui est né de lui »
  alternative: Employer partout « engendré »; ou expliciter « le Père » et « son enfant »
  rationale: Le texte articule l’amour pour Dieu, source de la naissance, et l’amour pour la personne née de lui. La traduction conserve cette relation et la variation actif/passif du grec sans imposer une identification plus précise que le verset lui-même.
- issue: Titre messianique de Jésus
  choice: Traduire ὁ χριστός par « le Messie »
  alternative: « le Christ »
  rationale: 'Dans cette confession, le terme est un titre: Jésus est l’Oint attendu. « Messie » en rend directement la portée, tandis qu’une note signale l’équivalent traditionnel « Christ ».'
translation_notes:
  register: Français international moderne, clair et digne. « Toute personne » évite le masculin générique tout en gardant la portée universelle. La répétition et l’image familiale du grec sont conservées, malgré la légère solennité de « celui qui a engendré ».
