  text: ἐν τούτῳ γινώσκομεν ὅτι ἀγαπῶμεν τὰ τέκνα τοῦ θεοῦ, ὅταν τὸν θεὸν ἀγαπῶμεν καὶ τὰς ἐντολὰς αὐτοῦ ⸀ποιῶμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/002.yaml
  text: 'By this we know that we love the children of God: when we love God and keep his commandments[a].'
translation:
  language: fr
  text: 'C’est à ceci que nous savons que nous aimons les enfants de Dieu : lorsque nous aimons Dieu et mettons ses commandements en pratique[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faisons ses commandements ». On peut aussi traduire : « observons ses commandements » ou « obéissons à ses commandements ». Le grec emploie ici le verbe ποιέω, « faire », et non le verbe plus habituel τηρέω, « garder, observer ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: À ceci
  rationale: Cette formule johannique introduit le signe ou le critère qui permet de savoir. « À ceci » est idiomatique en français et conserve la force démonstrative de τούτῳ.
- source_word: γινώσκομεν
  choice: nous savons
  rationale: Le présent exprime ici une connaissance ou une reconnaissance actuelle et continue. « Nous savons » rend simplement le verbe dans le fil de l’argument.
- source_word: ἀγαπῶμεν
  choice: nous aimons
  rationale: Le présent simple français rend naturellement le présent grec et maintient le vocabulaire caractéristique de l’amour dans l’épître.
- source_word: τὰ τέκνα τοῦ θεοῦ
  choice: les enfants de Dieu
  rationale: τέκνα désigne les enfants de manière inclusive. La formulation conserve aussi la construction génitivale et le langage johannique.
- source_word: ὅταν
  choice: lorsque
  rationale: Avec le subjonctif présent grec, ὅταν peut exprimer « quand » ou « chaque fois que ». « Lorsque » préserve ici la nuance à la fois temporelle et conditionnelle sans l’alourdir.
- source_word: τὰς ἐντολὰς αὐτοῦ ποιῶμεν
  choice: mettons ses commandements en pratique
  rationale: ποιέω signifie littéralement « faire ». En français, « mettre les commandements en pratique » exprime naturellement l’accomplissement concret demandé, tout en évitant de traduire comme si le grec portait le verbe τηρέω, « garder, observer ».
theological_decisions:
- issue: Rapport entre l’amour pour les enfants de Dieu, l’amour pour Dieu et la pratique de ses commandements
  choice: La phrase présente l’amour pour Dieu et la mise en pratique de ses commandements comme le critère auquel se reconnaît l’amour pour les enfants de Dieu.
  alternative: Comprendre ce rapport comme strictement causal, purement probatoire, ou comme une définition exhaustive de l’amour fraternel.
  rationale: Le grec énonce le rapport de façon concise sans préciser davantage sa nature logique. La traduction conserve cette tension et n’impose aucune systématisation théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « À ceci nous savons » maintient la cadence johannique; « mettons ses commandements en pratique » privilégie une expression française naturelle tout en signalant en note la formulation grecque littérale.
