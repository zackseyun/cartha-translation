source:
  edition: SBLGNT
  text: ἐάν τις ἴδῃ τὸν ἀδελφὸν αὐτοῦ ἁμαρτάνοντα ἁμαρτίαν μὴ πρὸς θάνατον, αἰτήσει, καὶ δώσει αὐτῷ ζωήν, τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον. ἔστιν ἁμαρτία πρὸς θάνατον· οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/016.yaml
  text: If anyone sees his brother committing a sin not leading to death[a], he shall ask, and God will give him life—to those committing sins not leading to death. There is sin leading to death[c][b]; I am not saying that he should ask about that.
translation:
  language: fr
  text: Si quelqu’un voit son frère commettre un péché qui ne mène pas à la mort[a], qu’il demande, et Dieu lui donnera la vie — à ceux qui commettent des péchés qui ne mènent pas à la mort. Il y a un péché qui mène à la mort[b] ; je ne dis pas qu’il doive prier à ce sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec ne précise pas s’il s’agit de la mort physique, de la mort spirituelle ou de la condamnation finale.
    reason: theological_ambiguity
  - marker: b
    text: 'Ou : « Il y a du péché qui mène à la mort. » Le grec peut évoquer un péché particulier ou une catégorie de péché.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφὸν
  choice: frère
  rationale: Le grec emploie un nom masculin singulier qui, dans le contexte johannique, désigne vraisemblablement un autre croyant. « Frère » conserve la forme du texte source sans exclure que le terme puisse avoir une portée communautaire plus large.
- source_word: ἁμαρτάνοντα ἁμαρτίαν
  choice: commettre un péché
  rationale: Cette tournure française naturelle restitue le participe accompagné de son accusatif de même racine et garde l’idée d’un acte concret.
- source_word: μὴ πρὸς θάνατον
  choice: qui ne mène pas à la mort
  rationale: « Mener à » exprime l’orientation ou l’issue indiquée par πρός, tout en laissant ouverte la nature physique, spirituelle ou finale de la mort.
- source_word: αἰτήσει
  choice: qu’il demande
  rationale: Le futur grec a ici une force directive probable. La tournure avec « que » est idiomatique en français et convient au contexte de la prière.
- source_word: δώσει αὐτῷ ζωήν
  choice: Dieu lui donnera la vie
  rationale: Le sujet de « donnera » n’est pas exprimé en grec. Le contexte de la demande adressée à Dieu indique fortement que Dieu est celui qui donne la vie; son nom est explicité pour éviter une ambiguïté française trompeuse.
- source_word: τοῖς ἁμαρτάνουσιν μὴ πρὸς θάνατον
  choice: à ceux qui commettent des péchés qui ne mènent pas à la mort
  rationale: Le complément datif pluriel est maintenu après un tiret, ce qui conserve sa forme explicative sans imposer une analyse syntaxique trop précise.
- source_word: ἔστιν ἁμαρτία πρὸς θάνατον
  choice: Il y a un péché qui mène à la mort
  rationale: L’article indéfini est naturel en français. La formulation peut désigner un péché ou une catégorie de péché sans préciser lequel ni définir la mort.
- source_word: οὐ περὶ ἐκείνης λέγω ἵνα ἐρωτήσῃ
  choice: ce n’est pas à son sujet que je dis de demander
  rationale: 'La formulation conserve la prudence de l’original: Jean ne formule pas directement une interdiction de prier, mais dit qu’il ne demande pas de le faire dans ce cas.'
theological_decisions:
- issue: Nature de la « mort » dans le péché qui mène à la mort
  choice: Conserver le terme non précisé « mort ».
  alternative: Mort physique sous le jugement de Dieu, mort spirituelle ou condamnation finale.
  rationale: Le verset ne définit pas cette mort. La traduction ne doit pas trancher une question théologique que le grec laisse ouverte.
- issue: Identité de celui qui donne la vie
  choice: Expliciter Dieu comme sujet.
  alternative: Traduire littéralement « il lui donnera la vie », avec un antécédent grammatical incertain en français.
  rationale: Dans le contexte de la prière, Dieu est naturellement compris comme celui qui accorde la vie. L’explicitation rend la phrase intelligible sans préciser la nature de cette vie.
- issue: Portée de la dernière proposition
  choice: « ce n’est pas à son sujet que je dis de demander »
  alternative: « je dis de ne pas demander à son sujet »
  rationale: La négation porte sur « je dis », et non directement sur le verbe « demander ». La traduction retenue évite de transformer cette réserve en interdiction explicite.
translation_notes:
  register: Français international moderne, clair et digne. « Qu’il demande » garde la valeur directive du futur grec; le tiret préserve la reprise explicative difficile du datif pluriel. Tous les termes théologiquement disputés restent volontairement non définis.
