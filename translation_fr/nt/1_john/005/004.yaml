id: 1JN.5.4
reference: 1 John 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ γεγεννημένον ἐκ τοῦ θεοῦ νικᾷ τὸν κόσμον. καὶ αὕτη ἐστὶν ἡ νίκη ἡ νικήσασα τὸν κόσμον, ἡ πίστις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/004.yaml
  text: 'For everyone who has been born of God overcomes the world[b][a]. And this is the victory that has overcome the world: our faith.'
translation:
  language: fr
  text: 'En effet, toute personne qui est née de Dieu[a] vainc le monde. Et voici la victoire qui a vaincu le monde : notre foi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « tout ce qui est né de Dieu ». La formulation grecque au neutre désigne collectivement l’ensemble des personnes nées de Dieu.'
    reason: lexical_alternative
  - marker: b
    text: Ou « notre fidélité ». Selon le contexte, le mot grec peut signifier « foi », « confiance » ou « fidélité » ; ici, le texte retient « foi ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: En effet
  rationale: La conjonction introduit ici la raison de l’affirmation précédente. « En effet » restitue naturellement cette valeur explicative et causale en français.
- source_word: πᾶν τὸ γεγεννημένον
  choice: toute personne qui est née
  rationale: La formulation grecque est au neutre singulier, mais elle désigne collectivement les personnes nées de Dieu. Cette tournure française rend clairement la référence personnelle, tandis qu’une note conserve la forme plus littérale.
- source_word: γεγεννημένον
  choice: est née
  rationale: Le participe parfait passif présente une naissance accomplie dont l’effet demeure. En français, « est née » exprime naturellement cet état résultant et correspond au langage johannique de la naissance venant de Dieu.
- source_word: ἐκ τοῦ θεοῦ
  choice: de Dieu
  rationale: « De Dieu » exprime avec naturel l’origine divine dans le contexte de la naissance spirituelle.
- source_word: νικᾷ
  choice: vainc
  rationale: « Vaincre » rend directement le verbe et permet de préserver le lien lexical avec « victoire » et « a vaincu » dans la suite du verset.
- source_word: τὸν κόσμον
  choice: le monde
  rationale: La traduction conserve l’expression johannique sans expliciter dans le texte principal le sens de système humain opposé à Dieu.
- source_word: αὕτη ἐστὶν ἡ νίκη
  choice: voici la victoire
  rationale: « Voici » met naturellement en relief ce qui est ensuite identifié comme la victoire, tout en conservant le substantif grec.
- source_word: ἡ νικήσασα
  choice: qui a vaincu
  rationale: Le passé composé restitue naturellement en français l’aspect accompli du participe aoriste et maintient le lien avec « vainc » et « victoire ».
- source_word: ἡ πίστις ἡμῶν
  choice: notre foi
  rationale: '« Foi » est ici le sens le plus naturel de πίστις : le texte identifie ce par quoi les croyants remportent la victoire. Le possessif grec est rendu directement par « notre ».'
theological_decisions:
- issue: Référence de πᾶν τὸ γεγεννημένον
  choice: 'Référence personnelle et collective : « toute personne qui est née de Dieu »'
  alternative: « tout ce qui est né de Dieu »
  rationale: Bien que la forme grecque soit neutre et puisse être rendue littéralement de manière impersonnelle, le contexte concerne les croyants. Le texte principal rend donc le référent personnel, sans effacer la forme grecque, signalée en note.
- issue: Sens de πίστις
  choice: « foi »
  alternative: « fidélité » ou « confiance »
  rationale: Dans ce contexte, « notre foi » est la lecture la plus probable et la plus naturelle. La possibilité lexicale de « fidélité » est néanmoins conservée en note afin de ne pas éliminer une nuance possible du terme grec.
translation_notes:
  register: 'Français international moderne, clair et digne. La répétition « vainc / victoire / a vaincu » est volontaire : elle reproduit le jeu de mots formé en grec par le verbe, le nom et le participe de la même famille lexicale.'
