reference: 1 John 5:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ ἐλθὼν δι’ ὕδατος καὶ αἵματος, Ἰησοῦς Χριστός· οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ⸀ἐν τῷ αἵματι· καὶ τὸ πνεῦμά ἐστιν τὸ μαρτυροῦν, ὅτι τὸ πνεῦμά ἐστιν ἡ ἀλήθεια.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/006.yaml
  text: This is the one who came by water and blood—Jesus the Messiah[a]; not by the water only, but by the water and by the blood. And the Spirit is the one testifying[c][b], because the Spirit is the truth.
translation:
  language: fr
  text: 'C’est lui qui est venu par l’eau et le sang : Jésus, le Messie[a]. Ce n’est pas par l’eau seulement, mais par l’eau et par le sang. Et c’est l’Esprit qui témoigne, parce que l’Esprit est la vérité[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « par l’eau et le sang » est discutée. Elle peut évoquer le baptême et la mort de Jésus, sa naissance et sa mort, ou une imagerie sacramentelle. Le texte conserve l’expression grecque sans trancher.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « témoigne que l’Esprit est la vérité ». Le mot grec peut introduire soit la cause du témoignage, soit son contenu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ ἐλθὼν
  choice: C’est lui qui est venu
  rationale: Cette tournure française naturelle conserve la force identificatrice du démonstratif et rend idiomatiquement le participe substantivé, avec une référence historique sans surinterpréter l’aspect.
- source_word: δι’ ὕδατος καὶ αἵματος
  choice: par l’eau et le sang
  rationale: « Par » peut exprimer ici le moyen ou la circonstance associée. La formulation garde intacte l’expression grecque et n’impose aucune identification de l’eau et du sang.
- source_word: Ἰησοῦς Χριστός
  choice: Jésus le Messie
  rationale: Dans cette apposition, Χριστός conserve sa valeur de titre. « Le Messie » est idiomatique en français et évite de traiter le terme comme un simple nom de famille.
- source_word: οὐκ ἐν τῷ ὕδατι μόνον ἀλλ’ ἐν τῷ ὕδατι καὶ ἐν τῷ αἵματι
  choice: non par l’eau seulement, mais par l’eau et par le sang
  rationale: La répétition de « par » reflète l’insistance du grec sur les deux éléments, tandis que « non… seulement, mais… » restitue clairement le contraste.
- source_word: τὸ πνεῦμά
  choice: l’Esprit
  rationale: Le contexte johannique du témoignage indique l’Esprit Saint. La majuscule identifie le référent sans développer explicitement la doctrine dans le texte.
- source_word: τὸ μαρτυροῦν
  choice: qui témoigne
  rationale: Le présent français conserve la valeur verbale et durative du participe présent grec dans une formulation moderne et naturelle.
- source_word: ὅτι
  choice: parce que
  rationale: La lecture causale fournit ici le fondement du témoignage de l’Esprit et s’intègre naturellement à l’enchaînement de la phrase, tout en laissant l’autre possibilité en note.
- source_word: ἡ ἀλήθεια
  choice: la vérité
  rationale: 'L’article est conservé, car le prédicat grec présente une identification définie : l’Esprit est « la vérité », et non simplement véridique.'
theological_decisions:
- issue: Sens de « l’eau et le sang »
  choice: L’expression est conservée sans explication dans le texte principal.
  alternative: Le baptême et la mort de Jésus ; sa naissance et sa mort ; une imagerie sacramentelle.
  rationale: Le grec nomme les deux éléments sans les interpréter. La traduction préserve donc l’ambiguïté et la tension théologique réelles.
- issue: Référent de « l’Esprit »
  choice: L’Esprit Saint
  alternative: Un esprit générique
  rationale: Le contexte immédiat du témoignage divin et l’usage johannique soutiennent fortement cette identification ; la majuscule suffit à la signaler.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: L’apposition identifie Jésus par son titre messianique. « Jésus le Messie » rend cette fonction explicitement et naturellement en français.
- issue: Valeur de ὅτι
  choice: parce que
  alternative: que
  rationale: La lecture causale explique pourquoi l’Esprit témoigne. La lecture complétive demeure grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure contrastive et les répétitions significatives du grec sont conservées sans produire une syntaxe artificielle. Les marqueurs de notes [a] et [b] figurent dans le texte principal.
