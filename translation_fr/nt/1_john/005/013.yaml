reference: 1 John 5:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ταῦτα ἔγραψα ⸀ὑμῖν ἵνα εἰδῆτε ὅτι ζωὴν ⸂ἔχετε αἰώνιον⸃, ⸂τοῖς πιστεύουσιν⸃ εἰς τὸ ὄνομα τοῦ υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/013.yaml
  text: I have written these things to you who believe in the name of the Son of God[a], so that you may know that you have eternal life.
translation:
  language: fr
  text: Je vous ai écrit ces choses, à vous qui croyez au nom du Fils de Dieu[a], afin que vous sachiez que vous avez la vie éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en suivant de plus près l’ordre des mots grecs : « Je vous ai écrit ces choses afin que vous sachiez que vous avez la vie éternelle, à vous qui croyez au nom du Fils de Dieu. »'
    reason: Alternative syntaxique et ordre des mots grecs.
lexical_decisions:
- source_word: Ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie au contenu écrit, probablement à la lettre ou à ce qui précède, et le pluriel grec est conservé.
- source_word: ἔγραψα
  choice: j’ai écrit
  rationale: Le passé composé exprime naturellement en français l’action accomplie de l’aoriste dans un contexte épistolaire.
- source_word: ὑμῖν
  choice: à vous
  rationale: Rend directement le datif du destinataire tout en permettant la reprise appositive qui suit.
- source_word: ἵνα εἰδῆτε
  choice: afin que vous sachiez
  rationale: « Afin que » marque clairement le but, tandis que le subjonctif « sachiez » est requis et naturel en français.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Expression française biblique claire et courante, qui conserve la portée temporelle et qualitative de l’expression johannique.
- source_word: ἔχετε
  choice: vous avez
  rationale: Le présent indique que cette vie est possédée dès maintenant, et non seulement attendue pour l’avenir.
- source_word: τοῖς πιστεύουσιν
  choice: à vous qui croyez
  rationale: Le participe substantivé au datif est compris comme une apposition à ὑμῖν, identifiant les destinataires, sans effacer l’ordre grec inhabituel, signalé en note.
- source_word: πιστεύουσιν εἰς
  choice: croyez au nom
  rationale: En français, « croire au nom de » rend idiomatiquement πιστεύειν εἰς avec ὄνομα et conserve l’idée d’une foi orientée vers la personne révélée.
- source_word: τὸ ὄνομα
  choice: le nom
  rationale: Maintient l’idiome biblique du nom comme expression de la personne et de son autorité, sans le paraphraser.
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: du Fils de Dieu
  rationale: Traduction directe et consacrée du titre christologique et de la construction au génitif.
theological_decisions:
- issue: Placement et relation syntaxique de τοῖς πιστεύουσιν
  choice: 'Rattachement à ὑμῖν : « à vous qui croyez au nom du Fils de Dieu »'
  alternative: 'Apposition reprise après la proposition d’assurance : « afin que vous sachiez que vous avez la vie éternelle, vous qui croyez au nom du Fils de Dieu »'
  rationale: L’ordre grec place l’expression après la proposition sur la vie éternelle, mais elle peut identifier les destinataires annoncés par ὑμῖν. Le rattachement anticipé produit un français naturel et exprime vraisemblablement le sens; la note conserve toutefois l’ordre et l’ambiguïté syntaxique du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les expressions johanniques « croire au nom » et « vie éternelle ». La légère reprise « à vous » permet d’identifier clairement les destinataires; la note documente l’ordre grec et son ambiguïté.
