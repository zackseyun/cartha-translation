id: 1JN.5.14
reference: 1 John 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ παρρησία ἣν ἔχομεν πρὸς αὐτόν, ὅτι ἐάν τι αἰτώμεθα κατὰ τὸ θέλημα αὐτοῦ ἀκούει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/014.yaml
  text: 'And this is the confidence that we have before him: that if we ask anything according to his will[a], he hears us.'
translation:
  language: fr
  text: 'Et voici l’assurance[a] que nous avons auprès de lui : si nous demandons quoi que ce soit conformément à sa volonté, il nous écoute.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la pleine confiance » ou « la hardiesse ».
    reason: Alternative lexicale pour παρρησία, qui peut évoquer à la fois l’assurance, la liberté de parole et la hardiesse.
lexical_decisions:
- source_word: παρρησία
  choice: assurance
  rationale: Dans ce contexte johannique de prière et de relation avec Dieu, le mot désigne une liberté confiante en sa présence. « Assurance » est naturel en français et conserve cette nuance sans la réduire à la seule hardiesse.
- source_word: πρὸς αὐτόν
  choice: devant lui
  rationale: Avec une personne, πρός peut exprimer l’orientation relationnelle ou la présence. « Devant lui » rend naturellement l’idée de se tenir avec confiance en présence de Dieu.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι introduit ici le contenu de l’assurance. En français, les deux-points expriment cette relation plus naturellement qu’un « que » après « voici l’assurance ».
- source_word: ἐάν τι αἰτώμεθα
  choice: si nous demandons quoi que ce soit
  rationale: La tournure conserve la condition générale exprimée par ἐάν avec le subjonctif présent et la portée ouverte de τι.
- source_word: κατὰ τὸ θέλημα αὐτοῦ
  choice: conformément à sa volonté
  rationale: Cette formulation rend κατά comme une conformité à une norme et préserve le poids théologique de θέλημα sans paraphrase excessive.
- source_word: ἀκούει ἡμῶν
  choice: il nous écoute
  rationale: Dans le contexte de la prière, « écouter » exprime que Dieu prête attention aux demandes. Le rendu n’ajoute pas l’idée, plus forte et non explicitée ici, qu’il accorde nécessairement chaque demande.
theological_decisions:
- issue: Sens de l’écoute divine dans la prière
  choice: « il nous écoute », au sens où Dieu entend la prière et y prête attention
  alternative: « il nous exauce » ou « il accorde nos demandes »
  rationale: Le verset affirme que Dieu écoute les demandes conformes à sa volonté. Il ne faut pas anticiper sur le verset suivant ni transformer ici l’écoute en promesse explicite d’accorder immédiatement toute demande.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste proche de la structure grecque, tandis que les deux-points rendent clairement la valeur explicative de ὅτι. « Quoi que ce soit » conserve l’ampleur de τι, limitée dans la proposition suivante par la conformité à la volonté de Dieu.
