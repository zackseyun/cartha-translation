  source_fidelity: 'Le sens global est fidèle : παρρησία exprime ici une assurance confiante, ὅτι introduit le contenu de cette assurance, et ἀκούει ἡμῶν est rendu sans le renforcer en « exauce ». Toutefois, « devant lui » suggère principalement une position spatiale ou judiciaire. Dans ce contexte relationnel de prière, « auprès de lui » rend plus naturellement πρὸς αὐτόν tout en conservant l''idée d''accès confiant à Dieu.'
  naturalness: La phrase est fluide, de registre moderne et international. « Auprès de lui » est plus idiomatique que « devant lui » après « l’assurance que nous avons » et s'insère naturellement avec les deux-points introduisant le contenu.
