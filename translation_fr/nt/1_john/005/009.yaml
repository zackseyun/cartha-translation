reference: 1 John 5:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ τὴν μαρτυρίαν τῶν ἀνθρώπων λαμβάνομεν, ἡ μαρτυρία τοῦ θεοῦ μείζων ἐστίν, ὅτι αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ ⸀ὅτι μεμαρτύρηκεν περὶ τοῦ υἱοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/009.yaml
  text: 'If we receive the testimony of men[a], the testimony of God is greater[c][b], because this is the testimony of God: that he has testified concerning his Son.'
translation:
  language: fr
  text: 'Si nous acceptons le témoignage des êtres humains[a], le témoignage de Dieu est plus grand, car le témoignage de Dieu est celui-ci : il a rendu témoignage au sujet de son Fils[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le témoignage des hommes ». Le grec désigne ici les humains en général, par contraste avec Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition peut aussi être comprise comme exprimant la cause : « parce qu’il a rendu témoignage au sujet de son Fils ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρίαν / μαρτυρία
  choice: témoignage
  rationale: Ce terme conserve le sens probatoire du grec ainsi que sa répétition rhétorique dans le verset.
- source_word: ἀνθρώπων
  choice: des êtres humains
  rationale: Le pluriel grec est générique et oppose le témoignage humain à celui de Dieu ; cette formulation moderne et inclusive exprime précisément cette portée.
- source_word: λαμβάνομεν
  choice: nous acceptons
  rationale: Dans le contexte d'un témoignage, « accepter » rend naturellement l'idée de recevoir comme valable, sans alourdir la phrase.
- source_word: μείζων
  choice: plus grand
  rationale: Rend directement le comparatif grec et préserve la formulation simple et emphatique.
- source_word: αὕτη ἐστὶν ἡ μαρτυρία τοῦ θεοῦ
  choice: voici le témoignage de Dieu
  rationale: « Voici » présente naturellement en français le contenu du témoignage annoncé, tout en maintenant la répétition du mot « témoignage ».
- source_word: μεμαρτύρηκεν
  choice: il a rendu témoignage
  rationale: Le passé composé traduit le parfait grec comme un acte accompli dont la portée demeure, et garde le lien lexical avec « témoignage ».
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: au sujet de son Fils
  rationale: Rend clairement περί avec le génitif dans un registre digne et courant.
theological_decisions:
- issue: Portée générique de ἀνθρώπων
  choice: des êtres humains
  alternative: des hommes
  rationale: Le terme grec désigne ici les humains en général, par contraste avec Dieu. « Êtres humains » évite en français moderne une possible lecture exclusivement masculine sans modifier la portée du texte.
- issue: Fonction du premier ὅτι
  choice: car
  alternative: parce que
  rationale: La conjonction introduit la justification de la supériorité du témoignage divin ; « car » conserve cette relation avec un enchaînement naturel.
- issue: Fonction du second ὅτι
  choice: 'proposition de contenu : « il a rendu témoignage au sujet de son Fils »'
  alternative: 'proposition causale : « parce qu’il a rendu témoignage au sujet de son Fils »'
  rationale: La lecture épexégétique explique le contenu du témoignage de Dieu et s'accorde naturellement avec « voici ». La lecture causale reste grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition structurante de « témoignage » est conservée. « Rendre témoignage » maintient le lien lexical grec, tandis que « au sujet de » reste naturel sans être familier.
