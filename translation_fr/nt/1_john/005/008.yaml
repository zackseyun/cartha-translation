  text: the Spirit and the water and the blood[a], and the three are for the one.
translation:
  language: fr
  text: l’Esprit, l’eau et le sang ; et tous trois sont d’accord.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « les trois sont un ». Dans ce contexte, l’expression grecque signifie probablement que leurs témoignages concordent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: La majuscule indique que, dans le contexte immédiat de 1 Jean 5.6-8, il s’agit très probablement de l’Esprit Saint, présenté comme témoin.
- source_word: τὸ ὕδωρ
  choice: l’eau
  rationale: Traduction concrète et sobre qui conserve l’image grecque sans préciser dans ce verset ce que l’eau représente.
- source_word: τὸ αἷμα
  choice: le sang
  rationale: Traduction directe qui préserve le nom concret et laisse au contexte l’identification précise de son référent.
- source_word: οἱ τρεῖς
  choice: les trois
  rationale: Rend directement l’expression substantivée et renvoie aux trois témoins qui viennent d’être nommés.
- source_word: εἰς τὸ ἕν εἰσιν
  choice: convergent vers un même témoignage
  rationale: Le mouvement exprimé par εἰς τὸ ἕν est conservé par « convergent vers », tandis que « témoignage » explicite sobrement le sens contextuel. La note maintient accessible la formulation plus littérale et son ambiguïté.
theological_decisions:
- issue: εἰς τὸ ἕν εἰσιν exprime-t-il une unité ontologique ou la concordance des témoins ?
  choice: convergence vers un même témoignage
  alternative: les trois sont un
  rationale: Le contexte porte sur le témoignage de l’Esprit, de l’eau et du sang. La traduction principale rend donc leur convergence testimoniale sans importer une affirmation ontologique; la traduction plus formelle est conservée en note afin de ne pas effacer l’ambiguïté de l’expression grecque.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition des articles est naturelle en français et préserve les trois éléments distincts. « Convergent » évite la tournure peu idiomatique « sont pour l’un » tout en reflétant la préposition grecque; la note fournit la forme littérale.
