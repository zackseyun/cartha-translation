  text: οἴδαμεν ὅτι ἐκ τοῦ θεοῦ ἐσμεν, καὶ ὁ κόσμος ὅλος ἐν τῷ πονηρῷ κεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/019.yaml
  text: We know that we are from God[b][a], and the whole world lies in the evil one.
translation:
  language: fr
  text: Nous savons que nous sommes de Dieu et que le monde entier est au pouvoir du Mauvais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « le monde entier est dans le Mauvais ». « Le Mauvais » peut aussi être compris comme « le mal », mais, dans les écrits de Jean, le sens personnel est plus probable.'
    reason: Conserve une représentation plus proche de ἐν τῷ πονηρῷ tout en signalant l’autre compréhension possible; la traduction principale rend idiomatiquement l’état exprimé par κεῖται.
lexical_decisions:
- source_word: οἴδαμεν
  choice: Nous savons
  rationale: Exprime une connaissance assurée; cette tournure directe et naturelle conserve le ton de certitude de l’épître.
- source_word: ἐκ τοῦ θεοῦ
  choice: nous sommes de Dieu
  rationale: ἐκ marque ici l’origine ou l’appartenance. « De Dieu » reste idiomatique en français et n’ajoute pas explicitement la notion de naissance.
- source_word: ὁ κόσμος ὅλος
  choice: le monde entier
  rationale: Rend naturellement la totalité soulignée par ὅλος tout en conservant le terme johannique « monde ».
- source_word: ἐν τῷ πονηρῷ
  choice: sous l’emprise du Mauvais
  rationale: Dans le contexte johannique, le substantif désigne vraisemblablement une figure personnelle. « Sous l’emprise » communique en français actuel l’état exprimé par ἐν avec κεῖται, sans suggérer une localisation physique.
- source_word: κεῖται
  choice: est sous l’emprise
  rationale: Le verbe décrit littéralement le fait d’être étendu ou placé, et ici un état durable. La formulation française en restitue la portée contextuelle avec naturel.
theological_decisions:
- issue: τῷ πονηρῷ désigne-t-il le mal abstrait ou une figure personnelle?
  choice: 'Lecture personnelle : « le Mauvais »'
  alternative: 'Lecture abstraite : « le mal »'
  rationale: Dans les écrits johanniques, ὁ πονηρός désigne couramment le Mauvais comme figure personnelle (voir 1 Jean 2.13-14; 3.12; 5.18). L’ambiguïté grammaticale possible est néanmoins signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Le Mauvais » conserve le caractère personnel probable du grec; « sous l’emprise » rend l’expression grecque intelligible sans introduire le titre confessionnel « Satan ».
