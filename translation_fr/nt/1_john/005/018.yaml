source:
  edition: SBLGNT
  text: Οἴδαμεν ὅτι πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ οὐχ ἁμαρτάνει, ἀλλ’ ὁ γεννηθεὶς ἐκ τοῦ θεοῦ τηρεῖ ⸀αὐτόν, καὶ ὁ πονηρὸς οὐχ ἅπτεται αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/018.yaml
  text: We know that everyone who has been born of God does not keep sinning[a]; rather, the one who was born of God keeps him[c][b], and the evil one does not touch him.
translation:
  language: fr
  text: Nous savons que quiconque est né de Dieu ne continue pas à pécher[a] ; au contraire, celui qui est né de Dieu le garde[b], et le Mauvais ne le touche pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression peut aussi se traduire plus littéralement : « ne pèche pas ». Ici, le présent grec désigne probablement une conduite continue ou habituelle, sans affirmer que les croyants ne commettent jamais aucun péché (voir 1 Jean 1.8-10 ; 2.1).'
    reason: cross_reference
  - marker: b
    text: 'Ou, selon une autre compréhension : « celui qui est né de Dieu se garde lui-même ». Beaucoup comprennent cependant « celui qui est né de Dieu » comme une désignation de Jésus, le Fils, qui garde le croyant.'
    reason: alternative_reading
  - marker: c
    text: « Toucher » peut ici avoir le sens de mettre la main sur quelqu’un afin de lui nuire.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Nous savons
  rationale: Le parfait οἶδα a ici une valeur stative de présent ; « nous savons » est la formulation française naturelle.
- source_word: πᾶς ὁ γεγεννημένος ἐκ τοῦ θεοῦ
  choice: quiconque est né de Dieu
  rationale: La construction est distributive. « Né de Dieu » conserve l’expression johannique et le parfait souligne l’état résultant sans qu’une forme composée soit nécessaire en français.
- source_word: οὐχ ἁμαρτάνει
  choice: ne persiste pas dans le péché
  rationale: Le présent grec peut exprimer une conduite continue ou habituelle. Cette formulation rend cette valeur sans affirmer que le croyant ne commet jamais aucun péché.
- source_word: ἀλλ’
  choice: au contraire
  rationale: Cette locution marque clairement le contraste correctif introduit par ἀλλά.
- source_word: ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: celui qui est né de Dieu
  rationale: 'Cette traduction conserve l’expression grecque et son ambiguïté possible : elle peut désigner le croyant ou, selon une interprétation répandue, Jésus, le Fils.'
- source_word: τηρεῖ αὐτόν
  choice: le garde
  rationale: τηρέω peut signifier garder, veiller sur ou préserver. « Le garde » reste proche du grec et permet une nuance protectrice sans l’imposer explicitement.
- source_word: ὁ πονηρὸς
  choice: le Mauvais
  rationale: Avec l’article et dans l’usage johannique, l’expression désigne très probablement une figure personnelle, Satan, plutôt que le mal abstrait.
- source_word: οὐχ ἅπτεται αὐτοῦ
  choice: ne le touche pas
  rationale: La formulation conserve le sens premier de ἅπτομαι, tout en laissant entendre dans le contexte l’idée de saisir pour nuire.
theological_decisions:
- issue: Portée de l’énoncé au présent οὐχ ἁμαρτάνει
  choice: La proposition nie la persistance dans le péché.
  alternative: Le croyant ne commet absolument aucun péché.
  rationale: La valeur imperfective probable du présent et le contexte de 1 Jean 1.8-10 et 2.1 favorisent l’idée d’une pratique continue, sans supprimer entièrement la tension du texte.
- issue: Référent de ὁ γεννηθεὶς ἐκ τοῦ θεοῦ
  choice: Le texte principal conserve la formulation ambiguë « celui qui est né de Dieu ».
  alternative: L’expression désigne soit le croyant, soit précisément Jésus, le Fils de Dieu.
  rationale: La syntaxe grecque permet les deux compréhensions. Le texte principal n’ajoute donc pas « Jésus » ou « le Fils », tandis que la note expose les interprétations.
- issue: Rapport entre le sujet et αὐτόν dans τηρεῖ αὐτόν
  choice: Le pronom est rendu par « le », conformément à la leçon αὐτόν.
  alternative: 'Si le sujet est le croyant, la proposition peut se comprendre au sens réfléchi : « se garde lui-même ».'
  rationale: Le texte grec fourni porte le pronom non réfléchi αὐτόν. La traduction littérale préserve la possibilité que le sujet soit le Fils gardant le croyant, tandis qu’une note signale la lecture réfléchie.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « ne persiste pas dans le péché » explicite sobrement la valeur habituelle probable du présent. « Celui qui est né de Dieu le garde » maintient l’ambiguïté théologique et syntaxique du grec ; les notes exposent les principales possibilités sans imposer une lecture confessionnelle.
