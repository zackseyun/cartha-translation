id: 1JN.5.5
reference: 1 John 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς ⸂δέ ἐστιν⸃ ὁ νικῶν τὸν κόσμον εἰ μὴ ὁ πιστεύων ὅτι Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/005.yaml
  text: And who is the one who overcomes the world except the one who believes that Jesus is the Son of God?[a]
translation:
  language: fr
  text: Et qui est celui qui vainc le monde, sinon celui qui croit que Jésus est le Fils de Dieu ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « celui qui vainc … celui qui croit ». Le grec emploie des participes présents masculins singuliers à valeur représentative.'
    reason: Préciser la formulation participiale et la valeur générique des deux participes grecs.
lexical_decisions:
- source_word: τίς
  choice: qui
  rationale: Le pronom interrogatif introduit une question rhétorique ; « qui » en conserve simplement et naturellement la force.
- source_word: δέ
  choice: Et
  rationale: Ici, δέ assure une légère liaison avec ce qui précède plutôt qu’une opposition marquée.
- source_word: ὁ νικῶν
  choice: celui qui est vainqueur
  rationale: Le participe présent substantivé exprime une réalité caractéristique. Cette formulation conserve sa force verbale et représentative.
- source_word: τὸν κόσμον
  choice: du monde
  rationale: « Le monde » rend directement κόσμος sans expliciter de manière interprétative l’ordre du monde opposé à Dieu dans l’usage johannique.
- source_word: εἰ μὴ
  choice: sinon
  rationale: Dans cette question rhétorique, εἰ μή exprime naturellement l’exception exclusive.
- source_word: ὁ πιστεύων
  choice: celui qui croit
  rationale: Cette formulation rend le participe présent substantivé en préservant l’acte de croire plutôt qu’en le remplaçant par un nom abstrait.
- source_word: ὅτι
  choice: que
  rationale: ὅτι introduit ici le contenu de la foi, non une proposition causale.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française habituelle du nom propre.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Cette traduction directe conserve l’article défini et le poids confessionnel du titre christologique.
theological_decisions:
- issue: Valeur représentative des participes masculins singuliers ὁ νικῶν et ὁ πιστεύων
  choice: celui qui est vainqueur / celui qui croit
  alternative: la personne qui est victorieuse / la personne qui croit
  rationale: Le masculin singulier grec a ici une portée générique. « Celui qui » en garde la forme représentative et le parallélisme sans limiter explicitement l’énoncé aux hommes.
- issue: Confession christologique ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  alternative: le Fils de Dieu (sans autre explicitation)
  rationale: Le titre est conservé directement, sans développer ni réduire l’affirmation du texte concernant l’identité de Jésus.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « être vainqueur du monde » est idiomatique tout en maintenant l’image johannique de la victoire ; « celui qui » préserve le parallélisme de l’original.
