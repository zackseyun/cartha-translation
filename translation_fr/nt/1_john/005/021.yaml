  text: Τεκνία, φυλάξατε ἑαυτὰ ἀπὸ τῶν ⸀εἰδώλων.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/021.yaml
  text: Little children[a], guard yourselves from idols.
translation:
  language: fr
  text: Petits enfants[a], gardez-vous des idoles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Enfants » ou « Chers enfants ». Le terme grec est un diminutif affectueux que Jean emploie lorsqu’il s’adresse directement à ses lecteurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τεκνία
  choice: Petits enfants
  rationale: Vocatif pluriel diminutif de τεκνίον, employé par Jean comme une adresse pastorale affectueuse. « Petits enfants » conserve l’image familiale et la tendresse du diminutif.
- source_word: φυλάξατε
  choice: gardez-vous
  rationale: Impératif aoriste actif à la deuxième personne du pluriel, exprimant un appel ferme à la vigilance. Avec « de », la tournure pronominale « gardez-vous » rend naturellement en français l’idée de se tenir à l’écart et de se protéger.
- source_word: ἑαυτὰ
  choice: -vous
  rationale: Le pronom réfléchi est intégré à la forme idiomatique « gardez-vous », qui en préserve clairement la valeur réflexive.
- source_word: ἀπὸ
  choice: des
  rationale: Dans la construction française « se garder de », « des » rend naturellement la séparation marquée par ἀπό sans ajouter d’explication.
- source_word: εἰδώλων
  choice: idoles
  rationale: « Idoles » est le correspondant direct et courant du terme grec, sans l’affaiblir en « images » ni l’interpréter par « faux dieux ».
theological_decisions:
- issue: Portée du terme « idoles »
  choice: Traduire concrètement par « idoles » sans élargir la formulation.
  alternative: « tout ce qui prend la place de Dieu » ou « le faux culte »
  rationale: Le grec désigne directement les idoles. Même si l’avertissement peut avoir une portée plus large par implication, la traduction ne doit pas expliciter ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, simple et digne. « Petits enfants » garde la tonalité affectueuse de l’adresse johannique; « gardez-vous des idoles » est une formulation concise, naturelle et solennelle.
