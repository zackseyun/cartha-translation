id: 1JN.5.15
reference: 1 John 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐὰν οἴδαμεν ὅτι ἀκούει ἡμῶν ὃ ⸀ἐὰν αἰτώμεθα, οἴδαμεν ὅτι ἔχομεν τὰ αἰτήματα ἃ ᾐτήκαμεν ⸀ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/015.yaml
  text: And if we know that he hears us in whatever we ask, we know that we have the requests that we have asked from him.
translation:
  language: fr
  text: Et si nous savons qu’il nous écoute, quoi que nous demandions[a], nous savons que nous avons ce que nous lui avons demandé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce que nous pourrions demander ». La construction grecque exprime une portée ouverte : quelle que soit la chose demandée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούει ἡμῶν
  choice: il nous écoute
  rationale: Avec le génitif, ἀκούω désigne ici l’écoute d’une personne qui prie. « Écouter » est naturel en français et n’anticipe pas l’idée plus forte d’exaucer.
- source_word: ὃ ἐὰν αἰτώμεθα
  choice: quoi que nous demandions
  rationale: 'Le relatif avec ἐάν exprime une portée indéfinie et ouverte : toute chose susceptible d’être demandée, et non le moment où l’on demande.'
- source_word: αἰτώμεθα
  choice: nous demandions
  rationale: Dans ce contexte de prière, « demander » est le terme français le plus direct et maintient le lien lexical avec la demande mentionnée ensuite.
- source_word: ἔχομεν
  choice: nous avons
  rationale: Le présent grec signifie simplement « avoir ». Le traduire par « recevoir » ajouterait une étape qui n’est pas explicitement formulée.
- source_word: τὰ αἰτήματα
  choice: ce que nous lui avons demandé
  rationale: Cette tournure française naturelle rend les choses demandées et évite le substantif plus administratif « requêtes », tout en conservant le lien avec « demander ».
- source_word: ἃ ᾐτήκαμεν ἀπ’ αὐτοῦ
  choice: ce que nous lui avons demandé
  rationale: Le passé composé rend l’action accomplie ayant une pertinence présente. Le pronom indirect « lui » exprime naturellement en français que la demande est adressée à Dieu.
- source_word: οἴδαμεν
  choice: nous savons
  rationale: La répétition de « nous savons » préserve l’insistance johannique sur la connaissance assurée.
theological_decisions:
- issue: ἀκούει désigne-t-il le fait d’écouter ou celui d’exaucer la prière ?
  choice: il nous écoute
  alternative: il nous exauce
  rationale: « Exaucer » fusionnerait l’écoute de Dieu avec le résultat affirmé ensuite. « Écoute » conserve la progression du raisonnement et la tension théologique du grec.
- issue: La possession présente des demandes doit-elle être reformulée comme une réception future ?
  choice: nous avons
  alternative: nous recevrons
  rationale: Le texte emploie le présent ἔχομεν. Le conserver respecte l’assurance formulée sans préciser artificiellement quand ou comment les demandes se réalisent.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve les deux occurrences de « nous savons » et rend la prière sans vocabulaire administratif. Le subjonctif après « quoi que » est idiomatique et traduit la valeur indéfinie de la construction grecque.
