  - marker: a
    text: 'Des manuscrits tardifs ajoutent une leçon plus longue, souvent appelée le Comma Johanneum : « dans le ciel : le Père, la Parole et le Saint-Esprit, et ces trois sont un. Et il y en a trois qui rendent témoignage sur la terre… » Cette formulation est absente des plus anciens témoins manuscrits grecs et ne figure pas dans le texte du SBLGNT.'
