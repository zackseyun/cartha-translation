lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans le contexte, la conjonction introduit l’explication de l’affirmation précédente. « Car » en restitue naturellement la valeur explicative.
- source_word: τρεῖς
  choice: trois
  rationale: Le numéral cardinal est rendu directement.
- source_word: εἰσιν
  choice: il y en a
  rationale: Cette tournure existentielle est idiomatique en français avec « trois » et exprime naturellement le sens de la copule dans cette construction.
- source_word: οἱ μαρτυροῦντες
  choice: qui rendent témoignage
  rationale: Le participe présent substantivé désigne ceux qui accomplissent l’action de témoigner. La proposition relative conserve cette valeur verbale sans la réduire au nom « témoins ».
theological_decisions:
- issue: Forme textuelle de 1 Jean 5.7 et Comma Johanneum
  choice: 'Traduire uniquement le texte court du SBLGNT : « Car il y en a trois qui rendent témoignage, »'
  alternative: 'La tradition textuelle tardive du Textus Receptus ajoute : « dans le ciel : le Père, la Parole et le Saint-Esprit, et ces trois sont un. Et il y en a trois qui rendent témoignage sur la terre… »'
  rationale: Le texte grec fourni porte la leçon courte. L’ajout trinitaire, historiquement important, est signalé en note plutôt qu’introduit dans le texte principal, puisqu’il est absent des plus anciens témoins grecs et du SBLGNT.
