source:
  edition: SBLGNT
  text: πᾶσα ἀδικία ἁμαρτία ἐστίν, καὶ ἔστιν ἁμαρτία οὐ πρὸς θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/005/017.yaml
  text: All unrighteousness is sin[b][a], and there is sin not leading to death.
translation:
  language: fr
  text: Toute injustice est un péché[a], et il y a un péché qui ne mène pas à la mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Toute mauvaise action est un péché » ou « Toute conduite injuste est un péché ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui ne conduit pas à la mort » ou « qui n’aboutit pas à la mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ἀδικία
  choice: Toute injustice
  rationale: Le singulier sans article avec πᾶσα a une portée globale. « Toute injustice » est naturel en français et conserve le champ moral large de ἀδικία, qui peut aussi désigner ce qui est mal ou contraire à la justice.
- source_word: ἁμαρτία
  choice: péché
  rationale: « Péché » est l’équivalent français courant et précis dans les deux occurrences.
- source_word: καὶ
  choice: et
  rationale: Le simple coordonnant relie l’affirmation générale à la précision qui suit sans imposer une nuance absente du grec.
- source_word: οὐ πρὸς θάνατον
  choice: qui ne mène pas à la mort
  rationale: Cette formulation française actuelle exprime la direction ou l’aboutissement indiqué par πρὸς et reste cohérente avec le contexte immédiat.
- source_word: θάνατον
  choice: mort
  rationale: La traduction directe préserve l’indétermination du texte quant à la nature physique, spirituelle ou eschatologique de la mort.
theological_decisions:
- issue: Nature de la « mort »
  choice: Traduire simplement par « la mort » sans qualificatif interprétatif
  alternative: La mort physique, la mort spirituelle ou la condamnation eschatologique
  rationale: Le grec ne précise pas la nature de cette mort; la traduction doit donc conserver cette ambiguïté théologique.
- issue: Portée de ἀδικία
  choice: Employer « injustice » dans le texte principal
  alternative: « mal », « mauvaise action » ou « conduite contraire à la justice »
  rationale: « Injustice » garde le lien lexical avec la justice et peut, dans cet énoncé universel, désigner largement ce qui n’est pas juste. La note prévient toutefois une lecture limitée à l’injustice sociale ou juridique.
translation_notes:
  register: Français international moderne, clair et digne. La structure brève et sentencieuse du grec est conservée. L’ajout de « qui mène » explicite idiomatiquement la valeur de πρὸς sans définir la nature de la mort.
