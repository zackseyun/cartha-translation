id: 1JN.4.20
reference: 1 John 4:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐάν τις εἴπῃ ὅτι Ἀγαπῶ τὸν θεόν, καὶ τὸν ἀδελφὸν αὐτοῦ μισῇ, ψεύστης ἐστίν· ὁ γὰρ μὴ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ὃν ἑώρακεν, τὸν θεὸν ὃν οὐχ ἑώρακεν ⸀οὐ δύναται ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/020.yaml
  text: If anyone says[a], “I love God,” and hates his brother, he is a liar; for the one who does not love his brother whom he has seen cannot love God whom he has not seen.
translation:
  language: fr
  text: 'Si quelqu’un dit : « J’aime Dieu », mais qu’il déteste son frère[a], c’est un menteur ; en effet, celui qui n’aime pas son frère qu’il a vu ne peut pas aimer Dieu qu’il n’a pas vu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son frère ou sa sœur ». Le grec emploie le masculin singulier « son frère » (τὸν ἀδελφὸν αὐτοῦ), qui peut avoir ici une valeur représentative.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις εἴπῃ
  choice: Si quelqu’un dit
  rationale: ἐάν avec le subjonctif aoriste introduit une condition générale; « si quelqu’un dit » en restitue naturellement la portée indéfinie.
- source_word: Ἀγαπῶ
  choice: J’aime
  rationale: Le présent est rendu directement et maintient le lien lexical avec les autres formes de ἀγαπάω dans le verset.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Cette formulation conserve le masculin singulier du grec sans imposer dans le texte principal l’interprétation plus explicite « frère ou sœur » ou « autre croyant ».
- source_word: μισῇ
  choice: qu’il déteste
  rationale: Le présent du subjonctif est rendu par un présent français; « détester » exprime clairement l’opposition forte entre μισεῖν et ἀγαπᾶν.
- source_word: ψεύστης ἐστίν
  choice: c’est un menteur
  rationale: ψεύστης est un nom attribut et formule un jugement catégorique, que « c’est un menteur » restitue avec naturel en français.
- source_word: ὁ γὰρ μὴ ἀγαπῶν
  choice: En effet, celui qui n’aime pas
  rationale: Le participe substantivé est rendu par « celui qui »; « en effet » marque la valeur explicative de γάρ.
- source_word: ὃν ἑώρακεν
  choice: qu’il voit
  rationale: Le parfait grec désigne ici le frère accessible à la perception et connu par la vue. Le présent français est idiomatique dans le contraste avec Dieu, invisible, tout en gardant la pertinence actuelle de cette perception.
- source_word: οὐ δύναται ἀγαπᾶν
  choice: ne peut pas aimer
  rationale: La formulation conserve la force d’incapacité ou d’impossibilité exprimée par δύναται, sans l’atténuer en simple difficulté.
theological_decisions:
- issue: Portée de ἀδελφός dans un contexte pouvant viser les membres de la communauté croyante en général
  choice: son frère
  alternative: son frère ou sa sœur; l’autre croyant
  rationale: Le texte principal conserve la forme masculine singulière du grec. Une note signale sa possible fonction représentative sans enfermer le terme dans une paraphrase interprétative.
- issue: Force de οὐ δύναται ἀγαπᾶν
  choice: ne peut pas aimer Dieu
  alternative: n’est pas capable d’aimer Dieu
  rationale: La traduction maintient l’affirmation forte d’impossibilité morale et spirituelle dans l’argument de Jean, sans lui ajouter d’explication philosophique.
- issue: Aspect de ἑώρακεν dans le contraste entre le frère et Dieu
  choice: qu’il voit / qu’il ne voit pas
  alternative: qu’il a vu / qu’il n’a pas vu
  rationale: Le présent français exprime naturellement le contraste actuel entre le frère visible et Dieu invisible. L’alternative au passé composé serre davantage la forme parfaite grecque, mais peut suggérer à tort un simple événement passé.
translation_notes:
  register: Français international moderne, clair et digne. « Mais qu’il déteste » rend explicite et naturel le contraste porté par καί dans cette construction. La répétition d’« aimer », « frère » et « Dieu » est volontaire afin de préserver la structure argumentative du grec.
