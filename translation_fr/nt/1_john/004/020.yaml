  to: 'Si quelqu’un dit : « J’aime Dieu », mais qu’il déteste son frère[a], c’est un menteur ; en effet, celui qui n’aime pas son frère qu’il a vu ne peut pas aimer Dieu qu’il n’a pas vu.'
  rationale: La révision est limitée au rendu des deux parfaits de ὁράω. Le passé composé français conserve l’idée que le frère a été vu, par opposition à Dieu qui n’a pas été vu, conformément à la formulation grecque et au parallèle syntaxique du verset. La note et les autres choix sont conservés.
  reviewer_model: gpt-5.6-terra
