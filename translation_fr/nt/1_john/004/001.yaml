  rationale: La révision limitée de la dernière proposition rend plus naturellement et plus précisément le parfait de ἐξέρχομαι suivi de εἰς, sans remplacer l’image de mouvement par une interprétation telle que « se sont répandus » ou « sont apparus ». La note b est clarifiée pour préserver la distinction textuelle entre esprits et faux prophètes.
