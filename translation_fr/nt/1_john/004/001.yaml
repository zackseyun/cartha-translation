id: 1JN.4.1
reference: 1 John 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ παντὶ πνεύματι πιστεύετε, ἀλλὰ δοκιμάζετε τὰ πνεύματα εἰ ἐκ τοῦ θεοῦ ἐστιν, ὅτι πολλοὶ ψευδοπροφῆται ἐξεληλύθασιν εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/001.yaml
  text: Beloved[a], do not believe every spirit, but test the spirits to see whether they are from God[b], because many false prophets have gone out into the world.
translation:
  language: fr
  text: Bien-aimés[a], ne croyez pas tout esprit, mais mettez les esprits à l’épreuve pour savoir s’ils viennent de Dieu[b], car beaucoup de faux prophètes sont sortis dans le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Chers amis ». Le terme grec signifie littéralement « bien-aimés ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’examiner la source spirituelle des prétentions prophétiques ; la proposition suivante présente les « faux prophètes » comme les agents humains de ces esprits.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Bien-aimés
  rationale: Ce vocatif pluriel exprime une adresse chaleureuse et conserve le lien lexical avec l’amour, caractéristique du style de Jean. « Chers amis » serait plus courant, mais moins proche de cette dimension théologique.
- source_word: παντὶ πνεύματι
  choice: tout esprit
  rationale: Le singulier a une valeur générique. Garder « esprit » préserve le cadre spirituel du texte sans le réduire aux personnes ou à leurs paroles.
- source_word: πιστεύετε
  choice: croyez
  rationale: Avec la négation et l’impératif présent, le verbe formule une interdiction générale d’accepter sans discernement les affirmations attribuées à un esprit.
- source_word: δοκιμάζετε
  choice: mettez … à l’épreuve
  rationale: Cette expression française naturelle rend l’idée d’examiner afin de déterminer l’authenticité ou la valeur.
- source_word: τὰ πνεύματα
  choice: les esprits
  rationale: La traduction directe maintient la correspondance avec « tout esprit » et évite de remplacer l’expression par une interprétation telle que « influences » ou « messages spirituels ».
- source_word: εἰ ἐκ τοῦ θεοῦ ἐστιν
  choice: pour savoir s’ils viennent de Dieu
  rationale: La tournure explicite naturellement en français le but de l’épreuve. Le pluriel français reprend les esprits de manière distributive malgré la forme verbale grecque au singulier.
- source_word: πολλοὶ ψευδοπροφῆται
  choice: beaucoup de faux prophètes
  rationale: Rendu direct et usuel du groupe nominal grec.
- source_word: ἐξεληλύθασιν
  choice: sont allés
  rationale: Le passé composé conserve l’image du déplacement et implique qu’ils sont désormais actifs dans le monde. « Ont paru » serait plus interprétatif.
- source_word: εἰς τὸν κόσμον
  choice: dans le monde
  rationale: En français, « aller dans le monde » rend naturellement le mouvement vers la sphère humaine où ces prophètes exercent leur activité, sans ajouter la notion interprétative de « système ».
theological_decisions:
- issue: Référent des « esprits »
  choice: Des esprits ou sources spirituelles à l’œuvre derrière les prétentions prophétiques, discernés à travers des prophètes humains
  alternative: De simples enseignants humains, ou seulement des paroles prophétiques considérées abstraitement
  rationale: Le texte distingue les « esprits » des « faux prophètes ». La traduction conserve donc le langage spirituel tout en laissant la proposition suivante montrer que le discernement s’exerce concrètement à propos d’agents humains.
translation_notes:
  register: Français international moderne, digne et accessible. « Bien-aimés » conserve la tonalité affectueuse et théologique de Jean ; « mettez à l’épreuve » est idiomatique sans affaiblir la notion de discernement.
