    issue: La dernière phrase de la note inverse potentiellement le rapport entre le Fils et le sacrifice.
    rationale: Le grec dit que Dieu a envoyé « son Fils [comme] ἱλασμός ». « Le sacrifice par lequel le Fils traite la question de nos péchés » peut plutôt suggérer que le Fils agit au moyen d’un sacrifice distinct. Une reformulation neutre rend mieux le prédicat appliqué au Fils.
  - severity: low
    issue: L’alternative « sacrifice qui obtient le pardon » est une paraphrase explicative plutôt qu’une alternative lexicale parallèle.
    rationale: Elle ajoute explicitement le résultat du pardon et risque de réduire l’éventail sémantique disputé de ἱλασμός. Une note concise avec « propitiation » et « moyen d’expiation » préserve mieux l’ambiguïté.
