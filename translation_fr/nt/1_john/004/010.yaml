- from: 'Voici en quoi consiste l’amour : ce n’est pas que nous ayons aimé Dieu, mais c’est lui qui nous a aimés et qui a envoyé son Fils comme sacrifice d’expiation[a] pour nos péchés.'
  to: 'Voici en quoi consiste l’amour : ce n’est pas que nous ayons aimé Dieu, mais c’est lui qui nous a aimés et qui a envoyé son Fils comme sacrifice d’expiation[a] pour nos péchés.'
  rationale: La traduction principale est conservée. Seule la note est corrigée afin d’éviter de présenter le Fils comme l’agent utilisant un sacrifice et de préserver, par des alternatives lexicales plus directes, la nuance disputée de ἱλασμός.
