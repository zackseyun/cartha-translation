source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐστὶν ἡ ἀγάπη, οὐχ ὅτι ἡμεῖς ⸀ἠγαπήκαμεν τὸν θεόν, ἀλλ’ ὅτι αὐτὸς ἠγάπησεν ἡμᾶς καὶ ἀπέστειλεν τὸν υἱὸν αὐτοῦ ἱλασμὸν περὶ τῶν ἁμαρτιῶν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/010.yaml
  text: 'In this is love: not that we have loved God, but that he loved us and sent his Son as an atoning sacrifice for our sins.'
translation:
  language: fr
  text: 'Voici en quoi consiste l’amour : ce n’est pas que nous ayons aimé Dieu, mais c’est lui qui nous a aimés et qui a envoyé son Fils comme sacrifice d’expiation[a] pour nos péchés.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sacrifice de propitiation » ; aussi « moyen d’expiation ». Le terme grec désigne le Fils comme celui qui traite la question de nos péchés.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ ἐστὶν ἡ ἀγάπη
  choice: Voici en quoi consiste l’amour
  rationale: Rend naturellement l’expression johannique qui introduit ce qui définit ou manifeste l’amour, tout en conservant son orientation vers ce qui suit.
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: ce n’est pas que… mais
  rationale: Préserve la construction contrastive grecque et le propos définitoire, plutôt que de la transformer en explication causale.
- source_word: ἠγαπήκαμεν
  choice: nous ayons aimé
  rationale: Après « ce n’est pas que », le subjonctif passé est idiomatique en français et rend l’action antérieure exprimée par le parfait grec.
- source_word: αὐτὸς ἠγάπησεν ἡμᾶς
  choice: c’est lui qui nous a aimés
  rationale: La tournure clivée fait ressortir l’emphase de αὐτός et le contraste entre l’initiative humaine et l’initiative divine.
- source_word: ἀπέστειλεν τὸν υἱὸν αὐτοῦ
  choice: a envoyé son Fils
  rationale: Traduction directe et naturelle qui conserve le langage johannique de l’envoi ainsi que la relation filiale.
- source_word: ἱλασμὸν
  choice: sacrifice d’expiation
  rationale: Expression française accessible qui conserve à la fois la dimension sacrificielle et le traitement effectif des péchés, sans imposer à elle seule une théorie précise de l’expiation.
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: pour nos péchés
  rationale: Dans ce contexte sacrificiel, « pour » exprime naturellement le rapport du sacrifice aux péchés.
theological_decisions:
- issue: Sens doctrinalement sensible de ἱλασμός
  choice: sacrifice d’expiation
  alternative: sacrifice de propitiation; sacrifice qui obtient le pardon
  rationale: Le terme grec désigne ici l’action sacrificielle du Fils à l’égard des péchés. Le texte principal emploie une formulation compréhensible et précise, tandis que la note conserve les principales nuances lexicales sans trancher entre elles.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase met en relief l’initiative de Dieu par « c’est lui qui », sans ajouter d’explication doctrinale étrangère au texte.
