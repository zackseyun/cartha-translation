  naturalness: Le français est moderne, fluide et d’un registre approprié au texte biblique. « Celui qui aime Dieu aime aussi son frère » est clair et naturel. « Et voici » rend avec souplesse l’élément démonstratif ταύτην dans l’enchaînement discursif.
