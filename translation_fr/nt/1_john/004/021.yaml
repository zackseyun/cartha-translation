id: 1JN.4.21
reference: 1 John 4:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν ἐντολὴν ἔχομεν ἀπ’ αὐτοῦ, ἵνα ὁ ἀγαπῶν τὸν θεὸν ἀγαπᾷ καὶ τὸν ἀδελφὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/021.yaml
  text: 'And we have this commandment from him: that the one who loves God should also love his brother[a].'
translation:
  language: fr
  text: 'Et voici le commandement que nous avons reçu de lui : que celui qui aime Dieu aime aussi son frère[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son frère ou sa sœur » ; le grec dit « son frère », au masculin singulier, forme qui peut représenter ici un autre membre de la communauté croyante.
    reason: Alternative lexicale et précision sur la portée représentative du masculin singulier grec.
lexical_decisions:
- source_word: ἐντολήν
  choice: commandement
  rationale: « Commandement » conserve la force morale et l’autorité du terme dans l’usage johannique, tout en étant naturel en français.
- source_word: ἀπ’ αὐτοῦ
  choice: de lui
  rationale: Le pronom grec est maintenu plutôt que remplacé par « de Dieu » ; son référent naturel dans le contexte immédiat est Dieu.
- source_word: ἵνα
  choice: que
  rationale: Ici, ἵνα introduit le contenu du commandement. La tournure française « le commandement… que » restitue naturellement cette valeur sans lui imposer un sens final.
- source_word: ὁ ἀγαπῶν τὸν θεόν
  choice: celui qui aime Dieu
  rationale: Cette formulation rend le participe substantivé au singulier de façon actuelle et digne, sans recourir à une tournure archaïque.
- source_word: ἀγαπᾷ
  choice: aime
  rationale: Le subjonctif français après « que » exprime ici ce que le commandement exige, sans devoir ajouter « doit », qui renforcerait explicitement la modalité.
- source_word: ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: La traduction conserve le masculin singulier du grec. Dans ce contexte, le terme peut avoir une portée représentative et désigner un autre membre de la communauté croyante ; cette portée est signalée en note.
- source_word: καὶ
  choice: aussi
  rationale: '« Aussi » rend la valeur additive du second καί : l’amour du frère s’ajoute nécessairement à l’amour de Dieu.'
- source_word: ἀγαπάω / ἀγαπῶν / ἀγαπᾷ
  choice: aimer / aime
  rationale: Le même verbe français est employé dans les deux occurrences afin de préserver la cohérence lexicale et thématique du passage.
theological_decisions:
- issue: Référence masculine singulière dans ἀδελφὸν αὐτοῦ
  choice: Conserver « son frère » dans le texte principal et préciser en note sa possible portée représentative.
  alternative: « son frère ou sa sœur » ; « l’autre croyant »
  rationale: Le grec porte explicitement le masculin singulier, tout en pouvant employer cette forme pour représenter les autres membres de la communauté croyante. Le texte principal respecte la forme source, tandis que la note préserve sa portée contextuelle sans l’imposer dans la traduction.
translation_notes:
  register: Français international moderne, naturel et digne. « Et voici » assure une articulation idiomatique avec le contexte tout en rendant καὶ et la mise en relief de ταύτην ; la syntaxe avec le subjonctif conserve la teneur prescriptive du commandement.
