  naturalness: Le français est sobre, moderne et fluide. « Nous avons connu … et nous y avons cru » rend naturellement les deux parfaits sans alourdir la phrase. La répétition de « demeure » maintient volontairement le vocabulaire johannique.
  terminology: « Dieu est amour », « demeure en Dieu » et « dans l’amour » sont exacts, naturels et cohérents. « Celui » et « lui » reflètent le masculin singulier représentatif du grec; la note explicite correctement sa portée générale.
