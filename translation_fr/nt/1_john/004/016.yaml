reference: 1 John 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς ἐγνώκαμεν καὶ πεπιστεύκαμεν τὴν ἀγάπην ἣν ἔχει ὁ θεὸς ἐν ἡμῖν. Ὁ θεὸς ἀγάπη ἐστίν, καὶ ὁ μένων ἐν τῇ ἀγάπῃ ἐν τῷ θεῷ μένει καὶ ὁ θεὸς ἐν αὐτῷ ⸀μένει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/016.yaml
  text: And we have come to know and have believed the love that God has for us[a]. God is love, and the one who remains in love remains in God[c][b], and God remains in him.
translation:
  language: fr
  text: Et nous, nous avons connu l’amour que Dieu a parmi nous et nous y avons cru.[a] Dieu est amour. Celui qui demeure dans l’amour demeure en Dieu, et Dieu demeure en lui.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’amour que Dieu a en nous ». L’expression grecque peut désigner l’amour présent chez les croyants ou manifesté au sein de leur communauté.'
    reason: alternative_reading
  - marker: b
    text: 'Les mots « Celui » et « lui » ont ici une valeur générale : ils désignent toute personne qui demeure dans l’amour.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκαμεν
  choice: nous avons connu
  rationale: Le parfait grec exprime une connaissance acquise dont l’effet demeure. Le passé composé français rend naturellement cette acquisition et son résultat présent.
- source_word: πεπιστεύκαμεν
  choice: nous y avons cru
  rationale: Le pronom « y » reprend « l’amour » et évite l’expression peu idiomatique « croire l’amour ». Le passé composé correspond à la confiance établie qu’exprime le parfait grec.
- source_word: τὴν ἀγάπην
  choice: l’amour
  rationale: Le terme désigne ici l’amour précis de Dieu évoqué dans le contexte; l’article défini est donc conservé.
- source_word: ἣν ἔχει ὁ θεὸς ἐν ἡμῖν
  choice: que Dieu a pour nous
  rationale: Cette formulation est naturelle en français et exprime clairement l’amour de Dieu à l’égard des croyants. Comme ἐν ἡμῖν signifie littéralement « en nous » et peut aussi avoir une portée communautaire, cette ambiguïté est signalée en note.
- source_word: Ὁ θεὸς ἀγάπη ἐστίν
  choice: Dieu est amour
  rationale: La construction attributive grecque est rendue directement, sans ajout explicatif.
- source_word: ὁ μένων
  choice: Celui qui demeure
  rationale: « Demeurer » conserve le vocabulaire johannique de permanence et d’union relationnelle tout en restant naturel en français actuel.
- source_word: ἐν τῇ ἀγάπῃ
  choice: dans l’amour
  rationale: La préposition marque la sphère dans laquelle la personne demeure; « dans l’amour » garde cette image.
- source_word: ἐν τῷ θεῷ μένει
  choice: demeure en Dieu
  rationale: Cette traduction directe conserve le thème de la demeure réciproque et la répétition intentionnelle de μένω.
- source_word: ὁ θεὸς ἐν αὐτῷ μένει
  choice: Dieu demeure en lui
  rationale: Le masculin singulier reprend grammaticalement « Celui qui demeure » et garde la forme représentative du grec.
theological_decisions:
- issue: Sens de ἐν ἡμῖν dans la première phrase
  choice: « pour nous » dans le texte, avec l’ambiguïté locative et communautaire en note
  alternative: « en nous » ou « parmi nous »
  rationale: Dans ce contexte, la phrase concerne l’amour de Dieu connu par les croyants, et « pour nous » est la formulation française la plus naturelle. Toutefois, ἐν ne porte pas normalement à lui seul le sens bénéficiaire; la note préserve donc les lectures selon lesquelles cet amour est présent intérieurement chez les croyants ou au milieu de leur communauté.
- issue: Portée du masculin singulier αὐτῷ
  choice: « en lui »
  alternative: « en cette personne »
  rationale: Le pronom reprend fidèlement le participe substantivé masculin singulier. Il a ici une valeur représentative et ne limite pas l’affirmation aux hommes, ce que précise la note.
translation_notes:
  register: Français international moderne, sobre et digne. La reprise « Et nous, nous » met en relief le sujet grec καὶ ἡμεῖς. La seconde proposition coordonnée est reformulée avec « y » afin de rester idiomatique sans effacer les deux parfaits grecs. La répétition de « demeure » est volontairement conservée pour refléter le motif johannique.
