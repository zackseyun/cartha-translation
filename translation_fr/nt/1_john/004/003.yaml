id: 1JN.4.3
reference: 1 John 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶν πνεῦμα ὃ μὴ ὁμολογεῖ ⸀τὸν ⸀Ἰησοῦν ἐκ τοῦ θεοῦ οὐκ ἔστιν· καὶ τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου, ὃ ἀκηκόατε ὅτι ἔρχεται, καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/003.yaml
  text: and every spirit that does not confess Jesus is not from God[a]. And this is the spirit of the antichrist, which you have heard is coming[c][b], and now is already in the world.
translation:
  language: fr
  text: et tout esprit qui ne reconnaît pas Jésus ne vient pas de Dieu.[a] C’est l’esprit de l’antichrist,[b] dont vous avez entendu dire qu’il vient et qui est maintenant déjà dans le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « ne reconnaît pas que Jésus Christ est venu dans la chair ».'
    reason: textual_variant
  - marker: b
    text: 'Littéralement : « c’est ce qui est de l’antichrist » ; le grec sous-entend ici le mot « esprit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν πνεῦμα
  choice: tout esprit
  rationale: Le singulier distributif désigne chaque influence ou prétention spirituelle soumise à l’épreuve; la minuscule évite d’y voir l’Esprit Saint.
- source_word: ὁμολογεῖ τὸν Ἰησοῦν
  choice: reconnaît Jésus
  rationale: Dans ce contexte, «reconnaître» exprime une confession assumée de l’identité de Jésus et reste naturel en français; le texte critique porte la forme brève, sans complément christologique explicite.
- source_word: ἐκ τοῦ θεοῦ οὐκ ἔστιν
  choice: ne vient pas de Dieu
  rationale: ἐκ marque ici la provenance ou l’origine; cette tournure est idiomatique et précise en français moderne.
- source_word: τοῦτό ἐστιν τὸ τοῦ ἀντιχρίστου
  choice: C’est là l’esprit de l’antichrist
  rationale: Le grec est elliptique, mais πνεῦμα se déduit clairement de la proposition précédente. Le rétablir donne un français naturel sans ajouter une idée étrangère au contexte.
- source_word: ἀκηκόατε ὅτι ἔρχεται
  choice: dont vous avez entendu dire qu’il vient
  rationale: La formulation conserve l’idée d’un enseignement déjà reçu et le présent ἔρχεται. Le pronom français reprend naturellement «l’esprit», qui explicite l’antécédent neutre grec.
- source_word: καὶ νῦν ἐν τῷ κόσμῳ ἐστὶν ἤδη
  choice: et qui, dès maintenant, est déjà dans le monde
  rationale: «Dès maintenant» rend νῦν avec sa portée temporelle, tandis que «déjà» conserve l’insistance de ἤδη sur la présence actuelle.
theological_decisions:
- issue: Forme textuelle de la confession refusée
  choice: 'Suivre dans le texte principal la leçon courte du SBLGNT: «ne reconnaît pas Jésus».'
  alternative: «ne reconnaît pas que Jésus Christ est venu dans la chair»
  rationale: La leçon critique courte doit gouverner le texte principal; la forme longue, probablement influencée par le verset précédent, est signalée en note afin de préserver l’histoire textuelle sans l’introduire dans le texte.
- issue: Explicitation de l’ellipse τὸ τοῦ ἀντιχρίστου
  choice: Rétablir «l’esprit» dans le texte principal.
  alternative: «c’est ce qui est de l’antichrist»
  rationale: Le nom sous-entendu est fourni par πνεῦμα dans la première proposition. Son explicitation est nécessaire à un français clair et digne, tout en signalant l’ellipse grecque en note.
- issue: Référent de ce qui «vient»
  choice: Faire reprendre «l’esprit de l’antichrist» par le pronom français «il».
  alternative: Comprendre la venue comme celle de l’antichrist lui-même.
  rationale: Le relatif grec est neutre et renvoie formellement à l’expression neutre précédente. La traduction évite donc de substituer sans indication une référence masculine directe à la personne de l’antichrist.
translation_notes:
  register: Français international moderne, naturel et digne. «Antichrist» est retenu comme forme biblique transparente. La répétition «dès maintenant… déjà» conserve l’insistance distincte de νῦν et ἤδη, malgré une légère redondance voulue.
