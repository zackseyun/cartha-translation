    rationale: νῦν signifie « maintenant », tandis que ἤδη ajoute « déjà ». « Dès maintenant » peut évoquer un commencement à partir du présent; « maintenant déjà » conserve plus exactement les deux adverbes.
  - severity: low
    issue: Tour « C’est là l’esprit »
    rationale: Le tour est compréhensible mais légèrement marqué. « C’est l’esprit de l’antichrist » est plus idiomatique tout en gardant l’explicitation justifiée de l’ellipse grecque.
