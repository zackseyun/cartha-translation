  text: ἡμεῖς ⸀ἀγαπῶμεν, ὅτι αὐτὸς πρῶτος ἠγάπησεν ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/019.yaml
  text: We love because he first loved us[a].
translation:
  language: fr
  text: Nous aimons parce qu’il nous a aimés le premier[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent: « Nous l’aimons parce qu’il nous a aimés le premier. »'
    reason: 'Variante textuelle: ces manuscrits ajoutent un pronom objet après « nous aimons ».'
lexical_decisions:
- source_word: ἡμεῖς
  choice: Nous
  rationale: Le pronom sujet explicite marque une certaine insistance ou un contraste en grec; « Nous » le rend naturellement en français sans alourdir la phrase.
- source_word: ἀγαπῶμεν
  choice: aimons
  rationale: Le présent actif de la première personne du pluriel est rendu par le présent simple, tout en maintenant le lien lexical avec le vocabulaire de l’amour dans le contexte.
- source_word: ὅτι
  choice: parce que
  rationale: 'La conjonction a ici une valeur causale: l’amour de Dieu, qui précède le nôtre, en est le fondement.'
- source_word: αὐτὸς
  choice: il
  rationale: Le pronom renvoie à Dieu dans le contexte. Le français naturel emploie ici « il »; une forme plus appuyée comme « lui-même » serait inutilement lourde.
- source_word: πρῶτος
  choice: le premier
  rationale: Cette expression rend clairement l’antériorité de l’amour de Dieu et s’intègre naturellement après le verbe en français.
- source_word: ἠγάπησεν
  choice: a aimés
  rationale: Le passé composé exprime naturellement en français l’acte antérieur et décisif par lequel Dieu a manifesté son amour.
- source_word: ἡμᾶς
  choice: nous
  rationale: Le pronom est le complément d’objet direct de « a aimés »; l’accord du participe passé est donc marqué au pluriel.
theological_decisions:
- issue: Faut-il ajouter un complément à « nous aimons »?
  choice: 'Laisser le complément non exprimé: « Nous aimons »'
  alternative: « Nous l’aimons » ou « Nous aimons Dieu »
  rationale: Le texte grec retenu ne donne aucun complément après ἀγαπῶμεν. En ajouter un résoudrait une ouverture réelle du texte et suivrait une variante manuscrite plutôt que le texte de base. Le contexte permet d’englober l’amour pour Dieu et l’amour mutuel sans imposer ici un seul objet.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve l’objet non exprimé de « aimons » et rend la priorité de l’amour divin sans explicitation doctrinale ajoutée.
