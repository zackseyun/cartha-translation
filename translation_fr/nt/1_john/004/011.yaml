id: 1JN.4.11
reference: 1 John 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀγαπητοί, εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς, καὶ ἡμεῖς ὀφείλομεν ἀλλήλους ἀγαπᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/011.yaml
  text: Beloved[a], if God so loved us, we also ought to love one another.
translation:
  language: fr
  text: Bien-aimés, si Dieu nous a aimés ainsi[a], nous devons, nous aussi, nous aimer les uns les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « puisque Dieu nous a aimés de cette manière ». Le grec emploie une forme conditionnelle (« si »), mais, dans ce contexte, la condition est vraisemblablement tenue pour vraie.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπητοί
  choice: Bien-aimés
  rationale: Ce vocatif pluriel conserve le lien lexical et thématique avec les formes du verbe ἀγαπάω présentes dans la suite du verset, tout en gardant le ton affectueux et solennel de Jean.
- source_word: εἰ
  choice: si
  rationale: « Si » préserve la forme conditionnelle grecque. Dans le contexte, la réalité de l’amour de Dieu est tenue pour acquise, mais la traduire directement par « puisque » supprimerait la force rhétorique de la formulation.
- source_word: οὕτως
  choice: ainsi
  rationale: « Ainsi » peut renvoyer à la manière dont Dieu a manifesté son amour dans le contexte précédent, tout en laissant résonner l’intensité de cet amour.
- source_word: ἠγάπησεν
  choice: a aimés
  rationale: Le passé composé est la manière naturelle, en français courant, d’exprimer ici l’acte accompli désigné par l’aoriste grec; il maintient aussi la répétition du vocabulaire de l’amour.
- source_word: καὶ ἡμεῖς
  choice: nous aussi
  rationale: Cette formulation rend la conjonction ainsi que l’insistance portée par le pronom sujet explicite en grec.
- source_word: ὀφείλομεν
  choice: nous devons
  rationale: Le verbe exprime une obligation morale. « Devons » la communique clairement sans ajouter l’image explicite d’une dette, qui demeure seulement implicite dans le terme grec.
- source_word: ἀλλήλους ἀγαπᾶν
  choice: nous aimer les uns les autres
  rationale: Cette tournure française naturelle rend le pronom réciproque et l’infinitif, tout en préservant le vocabulaire central de l’amour.
theological_decisions:
- issue: Valeur de la proposition conditionnelle εἰ οὕτως ὁ θεὸς ἠγάπησεν ἡμᾶς
  choice: 'Conserver la condition formelle : « si Dieu nous a aimés ainsi »'
  alternative: « puisque Dieu nous a aimés ainsi » ou « puisque Dieu nous a aimés de cette manière »
  rationale: Le contexte suppose vraie l’affirmation concernant l’amour de Dieu, mais le grec la présente sous une forme conditionnelle qui soutient l’exhortation. Garder « si » préserve cette tension rhétorique sans transformer implicitement la condition en proposition causale.
translation_notes:
  register: Français international moderne, naturel et digne. « Bien-aimés » maintient le réseau lexical de l’amour propre au verset; la structure de la seconde proposition a été légèrement ordonnée pour rendre naturellement l’emphase de καὶ ἡμεῖς.
