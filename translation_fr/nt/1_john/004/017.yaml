id: 1JN.4.17
reference: 1 John 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν τούτῳ τετελείωται ἡ ἀγάπη μεθ’ ἡμῶν, ἵνα παρρησίαν ἔχωμεν ἐν τῇ ἡμέρᾳ τῆς κρίσεως, ὅτι καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν ἐν τῷ κόσμῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/017.yaml
  text: By this[a], love has been perfected with us, so that we may have boldness in the day of judgment, because as he is[d][c][b], so also are we in this world.
translation:
  language: fr
  text: 'C’est ainsi[a] que l’amour a été porté à son accomplissement parmi nous, afin que nous ayons de l’assurance au jour du jugement : tel il est[c], tels nous sommes, nous aussi, dans ce monde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « En ceci, l’amour a été porté à son accomplissement avec nous ». L’expression grecque peut reprendre ce qui précède ou annoncer ce qui suit; « parmi nous » peut aussi se traduire par « avec nous ».
    reason: ambiguïté syntaxique et variante lexicale
  - marker: c
    text: « Il » renvoie probablement à Jésus; certains comprennent le pronom comme renvoyant plus généralement à Dieu.
    reason: référent implicite
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: C’est ainsi
  rationale: Cette tournure française naturelle peut annoncer la proposition explicative qui suit tout en conservant la valeur démonstrative ou modale du grec. Une note signale l’autre rattachement possible.
- source_word: τετελείωται
  choice: a été porté à son accomplissement
  rationale: Le parfait passif décrit un accomplissement dont le résultat demeure. Cette formulation évite de suggérer que l’amour aurait été auparavant moralement imparfait.
- source_word: ἡ ἀγάπη
  choice: l’amour
  rationale: Équivalent français courant et suffisamment ouvert pour ne pas décider s’il s’agit exclusivement de l’amour de Dieu ou de celui des croyants.
- source_word: μεθ’ ἡμῶν
  choice: parmi nous
  rationale: Dans ce contexte communautaire, « parmi nous » est plus idiomatique que « avec nous », tout en gardant l’idée d’un amour accompli dans la relation avec les croyants.
- source_word: ἵνα
  choice: afin que
  rationale: Exprime clairement la visée ou le résultat sans effacer la force télique de la proposition.
- source_word: παρρησίαν
  choice: de l’assurance
  rationale: Dans le contexte du jugement, le terme désigne une confiance libre de crainte; « assurance » est naturel en français moderne.
- source_word: ἐν τῇ ἡμέρᾳ τῆς κρίσεως
  choice: au jour du jugement
  rationale: Formulation eschatologique consacrée et idiomatique en français.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points rendent naturellement en français la valeur explicative ou causale de ὅτι, sans imposer trop rigidement « parce que ».
- source_word: καθὼς ἐκεῖνός ἐστιν καὶ ἡμεῖς ἐσμεν
  choice: tel il est, tels nous sommes, nous aussi
  rationale: Cette construction corrélative française restitue la comparaison καθώς… καί, maintient le présent et souligne le pronom ἡμεῖς sans lourdeur excessive.
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: dans ce monde
  rationale: Rendu français standard du cadre actuel de l’existence humaine désigné ici par κόσμος.
theological_decisions:
- issue: Référent de ἐκεῖνος (« il »)
  choice: Le pronom reste implicite dans le texte, comme en grec; il renvoie probablement à Jésus-Christ.
  alternative: Le pronom peut être compris comme renvoyant plus généralement à Dieu.
  rationale: Dans 1 Jean, ἐκεῖνος renvoie souvent à Jésus dans des affirmations comparables. La traduction ne remplace toutefois pas le pronom par un nom et conserve donc l’implicite du texte source.
- issue: Sens de l’amour porté à son accomplissement
  choice: L’amour atteint son but parmi les croyants et produit de l’assurance en vue du jugement.
  alternative: Il s’agirait exclusivement de notre amour pour Dieu, ou exclusivement de l’amour de Dieu pour nous.
  rationale: Le grec ne précise pas à lui seul la direction de l’amour. La formulation retenue préserve cette ouverture et n’introduit pas une doctrine de perfection morale absolue.
- issue: Rapport de ἐν τούτῳ avec les propositions voisines
  choice: « C’est ainsi » prépare principalement l’explication donnée par la suite du verset.
  alternative: L’expression peut reprendre ce qui précède ou désigner le moyen par lequel l’amour est accompli.
  rationale: La syntaxe johannique autorise plusieurs rattachements. Le texte principal privilégie une lecture fluide, tandis que la note conserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure corrélative « tel il est, tels nous sommes » reste soutenue sans être archaïque. Les marqueurs de notes présents dans le texte correspondent exactement aux notes fournies.
