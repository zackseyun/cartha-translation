reference: 1 John 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ θεοῦ ἐστε, τεκνία, καὶ νενικήκατε αὐτούς, ὅτι μείζων ἐστὶν ὁ ἐν ὑμῖν ἢ ὁ ἐν τῷ κόσμῳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/004.yaml
  text: You are from God[a], little children, and you have overcome them[b], because the one who is in you is greater than the one who is in the world.
translation:
  language: fr
  text: Vous êtes de Dieu, petits enfants, et vous les avez vaincus[a], parce que celui qui est en vous est plus grand que celui qui est dans le monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les adversaires mentionnés juste auparavant, en particulier les faux prophètes.
    reason: cross_reference
  - marker: b
    text: Le grec laisse l’identité des deux référents implicite ; le contexte suggère Dieu ou son Esprit pour le premier, et le Mauvais qui agit derrière le monde pour le second.
    reason: alternative_reading
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vous
  rationale: Le pronom est explicite et emphatique en grec. Sa place initiale, reprise naturellement dans « Vous êtes », conserve cette mise en relief sans ajouter une tournure lourde comme « vous-mêmes ».
- source_word: ἐκ τοῦ θεοῦ
  choice: êtes de Dieu
  rationale: La préposition ἐκ exprime ici l’origine ou l’appartenance découlant de Dieu. « Être de Dieu » est une formulation johannique concise, naturelle en français biblique moderne et parallèle au contraste avec le monde.
- source_word: τεκνία
  choice: petits enfants
  rationale: Le diminutif est une adresse familiale et affectueuse. « Petits enfants » en conserve la tendresse sans introduire dans le texte le qualificatif interprétatif « chers ».
- source_word: νενικήκατε
  choice: vous les avez vaincus
  rationale: Le parfait présente une victoire acquise dont l’effet demeure. Le passé composé français rend naturellement cet accomplissement, tandis que « vaincus » conserve le vocabulaire johannique de la victoire.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom renvoie aux adversaires évoqués dans le contexte immédiat, notamment aux faux prophètes. Le pronom français maintient ce renvoi sans préciser davantage que le grec.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit la raison de la victoire des croyants. « Parce que » exprime clairement ce lien causal en français actuel.
- source_word: μείζων
  choice: plus grand
  rationale: Le comparatif a un sens large qui ne doit pas être réduit à la seule puissance physique. « Plus grand » préserve cette amplitude.
- source_word: ὁ ἐν ὑμῖν
  choice: celui qui est en vous
  rationale: Cette expression substantivée désigne une personne sans la nommer. La traduction garde le référent implicite et respecte la formulation du grec.
- source_word: ὁ ἐν τῷ κόσμῳ
  choice: celui qui est dans le monde
  rationale: La formulation fait pendant à la précédente et laisse également l’identité du référent implicite. « Dans le monde » rend ici naturellement ἐν τῷ κόσμῳ.
- source_word: κόσμῳ
  choice: monde
  rationale: Dans les écrits johanniques, κόσμος peut désigner le monde opposé à Dieu, mais « monde » demeure la traduction de base et évite la glose excessive « système du monde ».
theological_decisions:
- issue: Identité de « celui qui est en vous » et de « celui qui est dans le monde »
  choice: Les deux référents restent implicites dans le texte principal.
  alternative: Identifier explicitement le premier à Dieu ou à son Esprit, et le second au diable ou au Mauvais.
  rationale: Le contexte conduit naturellement à comprendre Dieu ou son Esprit dans le premier cas, et la puissance mauvaise à l’œuvre dans le monde dans le second. Toutefois, le grec ne les nomme pas ici. La traduction conserve donc cette retenue et la tension rhétorique du verset.
translation_notes:
  register: 'Français international moderne, clair et digne. La tournure « être de Dieu » conserve la concision et la coloration johanniques. Les marqueurs de notes ont été placés selon leur contenu : [a] après le pronom renvoyant aux adversaires, [b] après l’opposition entre les deux référents implicites.'
