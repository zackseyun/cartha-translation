id: 1JN.4.6
reference: 1 John 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν· ὁ γινώσκων τὸν θεὸν ἀκούει ἡμῶν, ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ οὐκ ἀκούει ἡμῶν. ἐκ τούτου γινώσκομεν τὸ πνεῦμα τῆς ἀληθείας καὶ τὸ πνεῦμα τῆς πλάνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/006.yaml
  text: We are from God[a]. The one who knows God listens to us; whoever is not from God does not listen to us[c][b]. By this we know the Spirit of truth and the spirit of error.
translation:
  language: fr
  text: Nous, nous sommes de Dieu. Celui qui connaît Dieu nous écoute ; celui qui n’est pas de Dieu ne nous écoute pas[a]. C’est à cela que nous reconnaissons l’Esprit de la vérité[b][c] et l’esprit de l’erreur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous entend », dans les deux occurrences. Le verbe grec peut désigner le fait d’entendre, mais il exprime probablement ici l’accueil attentif du témoignage apostolique.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’esprit de la vérité ». L’expression peut être comprise de manière plus générale, bien que, dans les écrits johanniques, elle désigne couramment l’Esprit Saint.
    reason: alternative_reading
  - marker: c
    text: L’expression « l’Esprit de la vérité » fait écho à Jean 14.17 ; 15.26 ; 16.13.
    reason: cross_reference
lexical_decisions:
- source_word: ἡμεῖς ἐκ τοῦ θεοῦ ἐσμεν
  choice: Nous, nous sommes de Dieu
  rationale: Le pronom exprimé ἡμεῖς est rendu par la dislocation emphatique « Nous, nous », naturelle en français et pertinente dans le contraste du passage. « De Dieu » conserve l’idée de source ou d’origine portée par ἐκ.
- source_word: ὁ γινώσκων τὸν θεόν
  choice: Celui qui connaît Dieu
  rationale: Cette formulation rend le participe substantivé au présent et sa portée générale ou caractéristique.
- source_word: ἀκούει ἡμῶν
  choice: nous écoute
  rationale: 'Dans ce contexte, ἀκούω désigne plus qu’une simple perception auditive : il s’agit d’accueillir avec attention le témoignage apostolique. « Écouter » exprime cette réception sans aller jusqu’à « obéir ».'
- source_word: ὃς οὐκ ἔστιν ἐκ τοῦ θεοῦ
  choice: celui qui n’est pas de Dieu
  rationale: Le relatif grec a ici une valeur générique. « De Dieu » maintient le contraste d’origine établi par ἐκ sans le réduire à une simple possession.
- source_word: ἐκ τούτου
  choice: C’est ainsi que
  rationale: Cette tournure française idiomatique présente ce qui précède comme le critère permettant la reconnaissance mentionnée ensuite.
- source_word: γινώσκομεν
  choice: nous reconnaissons
  rationale: « Reconnaissons » fait ressortir la valeur de discernement en contexte tout en restant dans le champ sémantique de γινώσκω.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: l’Esprit de la vérité
  rationale: Dans les écrits johanniques, cette expression désigne couramment l’Esprit Saint. La majuscule indique ce référent probable, tandis que la note préserve la possibilité d’une lecture plus générale.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: l’esprit de l’erreur
  rationale: « Erreur » rend de façon concise πλάνη et maintient l’antithèse formelle avec « vérité ». La minuscule évite d’identifier ce second esprit à l’Esprit Saint tout en laissant ouverte la nature exacte de l’influence trompeuse.
theological_decisions:
- issue: Le référent de πνεῦμα dans τὸ πνεῦμα τῆς ἀληθείας
  choice: l’Esprit de la vérité
  alternative: l’esprit de la vérité
  rationale: Le contexte immédiat de l’épreuve des esprits et l’usage johannique plus large rendent probable une désignation de l’Esprit Saint. La majuscule retient cette lecture sans effacer l’autre possibilité, signalée en note.
- issue: La portée de ἀκούει ἡμῶν
  choice: nous écoute
  alternative: nous entend
  rationale: Le propos porte sur l’accueil ou le refus du témoignage apostolique. « Écoute » communique cette attention réceptive sans importer la notion plus forte d’obéissance.
- issue: La nature de τὸ πνεῦμα τῆς πλάνης
  choice: l’esprit de l’erreur
  alternative: l’esprit de l’égarement / l’esprit de la tromperie
  rationale: Le grec peut évoquer l’erreur, l’égarement ou la tromperie. « Erreur » conserve le parallèle antithétique avec « vérité » et ne tranche pas indûment entre une puissance spirituelle personnelle et une influence trompeuse.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « Nous, nous » rend l’emphase grecque sans lourdeur excessive. Le parallélisme « de Dieu / pas de Dieu » et « vérité / erreur » est conservé, ainsi que l’ambiguïté relative au mot πνεῦμα grâce aux majuscules et aux notes.
