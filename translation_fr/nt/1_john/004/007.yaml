reference: 1 John 4:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀγαπητοί, ἀγαπῶμεν ἀλλήλους, ὅτι ἡ ἀγάπη ἐκ τοῦ θεοῦ ἐστιν, καὶ πᾶς ὁ ἀγαπῶν ἐκ τοῦ θεοῦ γεγέννηται καὶ γινώσκει τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/007.yaml
  text: Beloved[a], let us love one another, because love is from God, and everyone who loves has been born of God and knows God.
translation:
  language: fr
  text: Bien-aimés[a], aimons-nous les uns les autres, car l’amour vient de Dieu, et toute personne qui aime est née de Dieu et connaît Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Chers amis ». Le grec dit littéralement « Bien-aimés » et reprend ainsi la même famille de mots que « aimons », « amour » et « aime » dans ce verset.
    reason: Alternative lexicale et préservation de l’écho rhétorique.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Bien-aimés
  rationale: Ce vocatif pluriel exprime une adresse affectueuse et conserve en français le lien lexical et rhétorique avec ἀγαπῶμεν et ἀγάπη dans le reste du verset.
- source_word: ἀγαπῶμεν
  choice: aimons-nous
  rationale: Le subjonctif présent à valeur exhortative se rend naturellement par « aimons-nous »; le caractère continu possible de l’action reste implicite, sans être surtraduit.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Équivalent français courant du pronom réciproque, adapté à un groupe pluriel.
- source_word: ὅτι
  choice: car
  rationale: Introduit la raison de l’exhortation. « Car » exprime clairement ce rapport causal dans un registre digne et naturel.
- source_word: ἡ ἀγάπη
  choice: l’amour
  rationale: L’article grec accompagne ici une notion générique; « l’amour » est la formulation française idiomatique et maintient la répétition de la famille lexicale d’aimer.
- source_word: ἐκ τοῦ θεοῦ
  choice: vient de Dieu
  rationale: ἐκ indique la source ou l’origine. La tournure « vient de Dieu » est naturelle en français et explicite ce rapport sans ajouter d’interprétation.
- source_word: πᾶς ὁ ἀγαπῶν
  choice: toute personne qui aime
  rationale: Le participe substantivé avec πᾶς désigne de façon générale quiconque aime. Cette formulation inclusive et actuelle évite l’ambiguïté possible de « tout homme ».
- source_word: γεγέννηται
  choice: est née
  rationale: Le parfait passif de γεννάω désigne une naissance accomplie dont l’effet demeure. Le passé composé « est née » le rend naturellement en français, l’auxiliaire être portant aussi la forme passive/résultative dans ce contexte.
- source_word: ἐκ τοῦ θεοῦ γεγέννηται
  choice: est née de Dieu
  rationale: Cette expression johannique indique Dieu comme source de la naissance. « Née de Dieu » est idiomatique, fidèle et bien établie en français.
- source_word: γινώσκει τὸν θεόν
  choice: connaît Dieu
  rationale: Le présent exprime la réalité actuelle de cette connaissance. « Connaît Dieu » reste direct et n’ajoute pas une nuance d’entrée dans la connaissance absente de la forme grecque.
theological_decisions:
- issue: Rapport entre l’amour, la naissance venant de Dieu et la connaissance de Dieu
  choice: Conserver l’affirmation directe selon laquelle toute personne qui aime est née de Dieu et connaît Dieu.
  alternative: Présenter l’amour comme une preuve technique de régénération dans un ordre du salut précis, ou réduire le propos à une simple maxime morale.
  rationale: Le grec relie explicitement ces réalités, mais ne développe ici ni un système doctrinal complet ni une explication de leurs rapports chronologiques. La traduction préserve cette tension sans l’amplifier ni l’affaiblir.
- issue: Répétition de la famille ἀγαπ-
  choice: Employer « Bien-aimés », « aimons-nous », « amour » et « aime » afin de rendre visible la répétition.
  alternative: Employer « chers amis » pour l’adresse et varier ensuite le vocabulaire.
  rationale: La répétition structure le verset et porte son insistance littéraire et théologique. Le français permet de la conserver de manière intelligible, avec une note signalant l’autre formulation naturelle de l’adresse.
translation_notes:
  register: Français international moderne, naturel et digne. « Bien-aimés » est légèrement soutenu mais demeure compréhensible et préserve l’écho lexical central. « Toute personne » évite un masculin générique potentiellement moins clair aujourd’hui.
