source:
  edition: SBLGNT
  text: Ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ μένομεν καὶ αὐτὸς ἐν ἡμῖν, ὅτι ἐκ τοῦ πνεύματος αὐτοῦ δέδωκεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/013.yaml
  text: 'By this we know that we remain in him and he in us: because he has given us of his Spirit[a][b][c].'
translation:
  language: fr
  text: 'Voici comment nous savons que nous demeurons en lui et lui en nous : il nous a donné de son Esprit[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « C’est à ceci que nous reconnaissons… ». L’expression grecque peut être rendue de manière plus formelle ainsi.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « il nous a donné de son Esprit » : la préposition grecque souligne la provenance et peut aussi suggérer la participation à ce que Dieu donne de son Esprit.'
    reason: lexical_clarification
lexical_decisions:
- source_word: Ἐν τούτῳ
  choice: Voici comment
  rationale: Dans cette formule johannique, l’expression introduit le moyen ou le signe qui permet de savoir. « Voici comment » est naturel en français et conserve cette valeur probante.
- source_word: γινώσκομεν
  choice: nous savons
  rationale: Le présent exprime ici une connaissance assurée et actuelle ; « nous savons » est direct et idiomatique.
- source_word: ἐν αὐτῷ μένομεν
  choice: nous demeurons en lui
  rationale: « Demeurer » conserve le caractère durable et relationnel de μένω ainsi que son rôle de terme clé chez Jean.
- source_word: καὶ αὐτὸς ἐν ἡμῖν
  choice: et lui en nous
  rationale: Le grec sous-entend le verbe déjà exprimé. L’ellipse française préserve le parallélisme compact et reste intelligible.
- source_word: ὅτι
  choice: deux-points explicatif
  rationale: Le second ὅτι introduit le fondement ou le signe de cette connaissance. En français, les deux-points rendent naturellement ce rapport sans le déterminer plus étroitement que le grec.
- source_word: ἐκ τοῦ πνεύματος αὐτοῦ
  choice: de son Esprit
  rationale: « De son Esprit » conserve la nuance de provenance ou de participation portée par ἐκ, tout en étant idiomatique en français.
- source_word: δέδωκεν
  choice: il nous a donné
  rationale: Le passé composé rend l’acte accompli dont le résultat demeure, conformément à la valeur du parfait grec.
theological_decisions:
- issue: Référent de « son » et identité de l’Esprit
  choice: « son Esprit », avec une majuscule
  alternative: « son esprit », compris comme une disposition ou un don spirituel générique
  rationale: Dans le contexte immédiat, le don de l’Esprit par Dieu atteste la demeure réciproque de Dieu et des croyants. La majuscule signale ce référent contextuel sans ajouter de précision au texte.
- issue: Langage johannique de la demeure réciproque
  choice: « nous demeurons en lui et lui en nous »
  alternative: « nous restons en lui et il reste en nous »
  rationale: Cette formulation conserve la réciprocité théologique et le terme johannique central, tout en respectant l’ellipse du grec.
translation_notes:
  register: Français international moderne, digne et accessible. « Demeurer » est légèrement soutenu, mais il préserve le vocabulaire relationnel caractéristique de Jean. L’ellipse « et lui en nous » reproduit le parallélisme sans alourdir la phrase.
