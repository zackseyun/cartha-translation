  text: ὁ μὴ ἀγαπῶν οὐκ ἔγνω τὸν θεόν, ὅτι ὁ θεὸς ἀγάπη ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/008.yaml
  text: The one who does not love has not known God[a], because God is love.
translation:
  language: fr
  text: Celui qui n’aime pas n’a pas connu Dieu[a], car Dieu est amour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui qui n’aime pas ne connaît pas Dieu. » L’aoriste grec peut être rendu plus simplement par un présent en français, mais « n’a pas connu » souligne le fait de ne pas être parvenu à connaître Dieu.'
    reason: Alternative lexicale et aspectuelle
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν
  choice: Celui qui n’aime pas
  rationale: L’article suivi du participe présent forme une expression substantivée et générique. Cette traduction naturelle conserve le singulier ainsi que l’idée d’une absence d’amour caractéristique ou continue.
- source_word: ἀγαπῶν
  choice: aime
  rationale: Le verbe « aimer » garde en français le lien lexical avec le nom « amour » (ἀγάπη) à la fin du verset.
- source_word: οὐκ ἔγνω
  choice: n’a pas connu
  rationale: Le passé composé rend ici l’aoriste en faisant entendre que la personne n’est pas parvenue à connaître Dieu, avec une conséquence présente, sans réduire cette connaissance à une simple compréhension intellectuelle.
- source_word: τὸν θεόν
  choice: Dieu
  rationale: Traduction directe du complément d’objet de ἔγνω.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de l’affirmation précédente. « Car » exprime clairement ce rapport causal dans un registre biblique actuel et digne.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Le groupe nominal est le sujet de la proposition; le nom divin s’emploie naturellement sans article en français.
- source_word: ἀγάπη
  choice: amour
  rationale: Le nom abstrait préserve la force du prédicat nominal et le lien lexical avec « aime », sans l’affaiblir en simple adjectif.
- source_word: ἐστίν
  choice: est
  rationale: Traduction directe de la copule au présent, sans ajout interprétatif.
theological_decisions:
- issue: Portée de « Dieu est amour »
  choice: Conserver « Dieu est amour » comme affirmation prédicative sur la nature ou le caractère de Dieu.
  alternative: « Dieu est aimant » ou « L’amour est Dieu »
  rationale: Dans le grec, « Dieu » est le sujet et « amour » le prédicat. La formulation retenue conserve le poids théologique du nom abstrait sans renverser la proposition ni en faire explicitement une définition exhaustive.
- issue: Aspect et portée de la connaissance de Dieu
  choice: « n’a pas connu Dieu »
  alternative: « ne connaît pas Dieu » ou « n’a pas compris Dieu »
  rationale: L’aoriste peut désigner le fait de ne pas être parvenu à connaître Dieu. Dans le contexte johannique, cette connaissance est relationnelle et se manifeste dans la conduite; « connu » préserve cette portée sans paraphrase doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier générique « Celui qui » reste immédiatement compréhensible. La répétition lexicale « aime / amour » est volontaire afin de refléter ἀγαπῶν / ἀγάπη.
