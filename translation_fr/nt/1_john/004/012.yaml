id: 1JN.4.12
reference: 1 John 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς πώποτε τεθέαται· ἐὰν ἀγαπῶμεν ἀλλήλους, ὁ θεὸς ἐν ἡμῖν μένει καὶ ἡ ἀγάπη αὐτοῦ ⸂ἐν ἡμῖν τετελειωμένη ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/012.yaml
  text: No one has ever seen God[a]; if we love one another, God remains in us[b], and his love is perfected in us.
translation:
  language: fr
  text: Personne n’a jamais vu Dieu. Si nous nous aimons les uns les autres, Dieu demeure en nous, et son amour[a] trouve en nous son plein accomplissement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « notre amour pour Dieu ». Le grec « son amour » peut désigner soit l’amour de Dieu envers nous, soit notre amour envers Dieu ; le contexte favorise le premier sens.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « est porté en nous à sa perfection » ; « est rendu complet en nous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τεθέαται
  choice: a vu
  rationale: Avec πώποτε et la négation, le parfait grec exprime ici qu’à aucun moment jusqu’à présent personne n’a vu Dieu. « A vu » est naturel en français moderne et évite l’archaïsme de « contemplé ».
- source_word: πώποτε
  choice: jamais
  rationale: Sous la négation, « jamais » rend de façon idiomatique l’idée de « à aucun moment ».
- source_word: ἐὰν ἀγαπῶμεν ἀλλήλους
  choice: si nous nous aimons les uns les autres
  rationale: Cette formulation conserve la valeur conditionnelle de ἐάν avec le subjonctif présent et rend clairement la réciprocité de ἀλλήλους.
- source_word: μένει
  choice: demeure
  rationale: « Demeure » conserve le thème johannique d’une présence relationnelle continue, tout en restant courant dans un registre biblique moderne et digne.
- source_word: ἡ ἀγάπη αὐτοῦ
  choice: son amour
  rationale: Le pronom renvoie naturellement à Dieu. La formulation conserve néanmoins l’ambiguïté possible du génitif, explicitée en note.
- source_word: ἐν ἡμῖν τετελειωμένη ἐστιν
  choice: trouve en nous son plein accomplissement
  rationale: Cette tournure française naturelle exprime l’état accompli et son résultat durable portés par la périphrase au parfait, sans suggérer principalement une perfection morale sans défaut.
theological_decisions:
- issue: Sens de ἡ ἀγάπη αὐτοῦ (« son amour »)
  choice: l’amour de Dieu qui s’exerce envers nous
  alternative: notre amour pour Dieu
  rationale: Le contexte immédiat met en avant l’initiative de l’amour de Dieu (versets 10-11), ce qui favorise le génitif subjectif. Comme le grec permet aussi de comprendre l’amour dirigé vers Dieu, cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Nous nous aimons les uns les autres » est idiomatique et explicite la réciprocité. « Demeure » maintient le vocabulaire thématique de Jean. « Plein accomplissement » rend l’idée de τελειόω sans réduire celle-ci à une absence de défaut moral.
