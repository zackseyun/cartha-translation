  text: ἐν τούτῳ ⸀γινώσκετε τὸ πνεῦμα τοῦ θεοῦ· πᾶν πνεῦμα ὃ ὁμολογεῖ Ἰησοῦν Χριστὸν ἐν σαρκὶ ἐληλυθότα ἐκ τοῦ θεοῦ ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/002.yaml
  text: 'By this you know the Spirit of God: every spirit that confesses Jesus the Messiah having come in the flesh is from God[c][b][a],'
translation:
  language: fr
  text: 'Voici à quoi vous reconnaissez[a] l’Esprit de Dieu : tout esprit qui confesse que Jésus, le Messie[b], est venu dans la chair[c] vient de Dieu,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Reconnaissez à ceci l’Esprit de Dieu ». La forme grecque peut être comprise comme un indicatif ou comme un impératif.'
    reason: grammatical_alternative
  - marker: b
    text: 'Ou : « Jésus-Christ ». Le grec Χριστός signifie « Messie » et fonctionne ici comme un titre.'
    reason: lexical_alternative
  - marker: c
    text: 'Plus littéralement : « qui confesse Jésus, le Messie, venu dans la chair ». Le grec emploie un participe parfait, qui présente cette venue comme accomplie et toujours déterminante.'
    reason: formal_rendering
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Voici à quoi
  rationale: Cette tournure française naturelle introduit le critère permettant de discerner l’Esprit de Dieu et conserve la valeur instrumentale de l’expression grecque.
- source_word: γινώσκετε
  choice: vous reconnaissez
  rationale: Le présent de l’indicatif décrit ici le moyen de reconnaître ou discerner l’Esprit de Dieu. « Reconnaissez » rend mieux ce discernement contextuel que le simple « connaissez ».
- source_word: τὸ πνεῦμα τοῦ θεοῦ
  choice: l’Esprit de Dieu
  rationale: L’article et le contraste avec « tout esprit » orientent vers l’Esprit propre à Dieu. La majuscule suit l’usage français pour cette désignation.
- source_word: πᾶν πνεῦμα
  choice: tout esprit
  rationale: L’expression distributive englobe chaque esprit ou influence spirituelle soumis à l’épreuve, qu’il soit vrai ou faux.
- source_word: ὁμολογεῖ
  choice: confesse
  rationale: Le verbe exprime une reconnaissance déclarée, voire publique. « Confesse » conserve cette force dans un registre biblique encore intelligible en français moderne.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésus, le Messie
  rationale: Χριστός garde ici sa valeur de titre. L’apposition française rend clairement ce titre sans le traiter comme un simple élément de nom.
- source_word: ἐν σαρκὶ
  choice: dans la chair
  rationale: La formule maintient le vocabulaire concret du grec et affirme la venue réellement humaine de Jésus sans ajouter de terminologie doctrinale ultérieure.
- source_word: ἐληλυθότα
  choice: est venu
  rationale: Le participe parfait est rendu par un passé composé naturel après « confesse que ». Cette formulation exprime un événement accompli dont la portée demeure.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: vient de Dieu
  rationale: Cette formulation française claire exprime l’origine indiquée par ἐκ, plus naturellement que « est de Dieu ».
theological_decisions:
- issue: Référence de τὸ πνεῦμα τοῦ θεοῦ
  choice: « l’Esprit de Dieu », compris comme l’Esprit propre à Dieu
  alternative: « l’esprit qui vient de Dieu », compris de façon générique
  rationale: Le singulier défini, immédiatement opposé à « tout esprit », désigne naturellement l’Esprit de Dieu que les croyants doivent discerner, sans qu’il soit nécessaire d’ajouter « Saint » au texte.
- issue: Force christologique de ἐν σαρκὶ ἐληλυθότα
  choice: « est venu dans la chair »
  alternative: « est venu comme être humain »
  rationale: La traduction retenue affirme la venue réelle et corporelle de Jésus tout en conservant l’expression propre du texte grec et sans introduire un vocabulaire théologique technique absent de celui-ci.
- issue: Relation syntaxique entre ὁμολογεῖ et le groupe accusatif avec participe
  choice: « confesse que Jésus, le Messie, est venu dans la chair »
  alternative: « confesse Jésus, le Messie, venu dans la chair »
  rationale: Le français exige ici une proposition complétive pour être immédiatement clair. La note conserve la construction participiale plus formelle et son ambiguïté syntaxique relative.
translation_notes:
  register: Français international moderne, clair et digne. « Voici à quoi » et « vient de Dieu » assurent une lecture naturelle; « confesse » et « dans la chair » conservent la densité biblique et théologique du grec. La ponctuation appositive autour de « le Messie » rend explicitement sa fonction de titre.
