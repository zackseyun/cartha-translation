reference: 1 John 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐφανερώθη ἡ ἀγάπη τοῦ θεοῦ ἐν ἡμῖν, ὅτι τὸν υἱὸν αὐτοῦ τὸν μονογενῆ ἀπέσταλκεν ὁ θεὸς εἰς τὸν κόσμον ἵνα ζήσωμεν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/009.yaml
  text: 'In this the love of God was revealed among us: that God has sent his one and only Son into the world so that we might live through him[a][b].'
translation:
  language: fr
  text: 'Voici comment l’amour de Dieu s’est manifesté parmi nous[a] : Dieu a envoyé son Fils unique[b] dans le monde afin que nous vivions par lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en nous ». L’expression grecque peut désigner une manifestation au-dedans des croyants ou au milieu d’eux, comme communauté.'
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « son Fils unique-engendré ». Le grec μονογενής souligne le caractère unique du Fils; cette formulation traditionnelle met l’accent sur l’engendrement.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: Voici comment
  rationale: La formule johannique introduit ici la manière dont l’amour s’est manifesté; cette tournure est naturelle en français tout en gardant le lien avec la proposition explicative qui suit.
- source_word: ἐφανερώθη
  choice: s’est manifesté
  rationale: Le verbe désigne ce qui devient visible ou clairement perceptible. Le passé composé rend naturellement l’aoriste dans ce contexte français.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: l’amour de Dieu
  rationale: Le génitif désigne très probablement l’amour qui appartient à Dieu et procède de lui, démontré par l’envoi du Fils.
- source_word: ἐν ἡμῖν
  choice: parmi nous
  rationale: Cette traduction exprime naturellement la manifestation au sein de la communauté, tout en signalant en note le sens possible « en nous ».
- source_word: ὅτι
  choice: ':'
  rationale: En français, les deux-points introduisent avec clarté le contenu qui explique comment l’amour de Dieu s’est manifesté.
- source_word: τὸν υἱὸν αὐτοῦ τὸν μονογενῆ
  choice: son Fils unique
  rationale: μονογενής souligne ici l’unicité du Fils dans sa relation à Dieu. « Fils unique » est idiomatique, digne et lexicalement sobre.
- source_word: ἀπέσταλκεν
  choice: a envoyé
  rationale: Le passé composé français présente l’envoi comme accompli et toujours pertinent, convenant à la valeur du parfait grec.
- source_word: εἰς τὸν κόσμον
  choice: dans le monde
  rationale: Expression française normale pour l’entrée du Fils dans le monde humain auquel il est envoyé.
- source_word: ἵνα ζήσωμεν
  choice: afin que nous vivions
  rationale: « Afin que » marque explicitement le but exprimé par ἵνα avec le subjonctif.
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: διά avec le génitif indique le moyen ou la médiation; « par lui » est naturel en français et préserve cette fonction.
theological_decisions:
- issue: Sens de μονογενής appliqué au Fils
  choice: Fils unique
  alternative: Fils unique-engendré; Fils seul-engendré
  rationale: Le mot grec met principalement l’accent sur le caractère unique du Fils. La traduction principale n’introduit pas directement une formulation doctrinale ultérieure, tandis que la note conserve la formulation ecclésiale traditionnelle.
- issue: Portée de ἐν ἡμῖν
  choice: parmi nous
  alternative: en nous
  rationale: « Parmi nous » rend la dimension communautaire de la manifestation, mais le grec peut aussi désigner une manifestation intérieure; la note maintient cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. La structure explicative est rendue idiomatiquement par « Voici comment » et les deux-points. Les ambiguïtés de ἐν ἡμῖν et l’histoire de traduction de μονογενής sont conservées en notes.
