  text: αὐτοὶ ἐκ τοῦ κόσμου εἰσίν· διὰ τοῦτο ἐκ τοῦ κόσμου λαλοῦσιν καὶ ὁ κόσμος αὐτῶν ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/005.yaml
  text: They are from the world[a]; for this reason they speak from the world[b], and the world listens to them.
translation:
  language: fr
  text: Eux, ils sont du monde[a] ; c’est pourquoi leur parole vient du monde, et le monde[b] les écoute.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Ils tirent leur origine du monde. » Le grec répète deux fois une expression signifiant « du monde », dont la préposition souligne la source ou l’origine.'
    reason: lexical_alternative
  - marker: b
    text: Ici, le « monde » désigne l’ordre humain opposé à Dieu, et non l’univers créé en lui-même.
    reason: cultural_note
lexical_decisions:
- source_word: αὐτοὶ
  choice: Eux, ils
  rationale: Cette dislocation naturelle en français moderne rend la valeur contrastive du pronom grec, notamment par rapport au « nous » du verset suivant, sans recourir au plus lourd « eux-mêmes ».
- source_word: ἐκ τοῦ κόσμου εἰσίν
  choice: ils sont du monde
  rationale: La tournure française demeure concise et naturelle. Elle exprime l’appartenance et l’origine, tandis que la note signale la valeur propre de ἐκ, qui marque la provenance.
- source_word: διὰ τοῦτο
  choice: c’est pourquoi
  rationale: Cette expression établit clairement le lien causal entre leur origine et la teneur de leur parole.
- source_word: ἐκ τοῦ κόσμου λαλοῦσιν
  choice: ce qu’ils disent vient du monde
  rationale: Une traduction littérale comme « ils parlent à partir du monde » serait peu idiomatique. Cette formulation naturelle conserve l’idée essentielle de source ou d’origine et répète « vient du monde ».
- source_word: κόσμος
  choice: monde
  rationale: Le terme traditionnel et suffisamment large préserve la résonance johannique sans introduire dans le texte une paraphrase telle que « système du monde ».
- source_word: ὁ κόσμος αὐτῶν ἀκούει
  choice: le monde les écoute
  rationale: « Écoute » exprime ici un accueil favorable, et non la simple perception auditive que pourrait suggérer « entend ».
theological_decisions:
- issue: Sens de κόσμος dans ce contexte johannique
  choice: L’ordre humain opposé à Dieu
  alternative: L’univers créé ou l’humanité prise dans un sens neutre
  rationale: Le contexte oppose ceux qui sont de Dieu à ceux qui sont du monde. Le texte principal conserve néanmoins le mot « monde » afin de ne pas remplacer le terme théologique de Jean par une explication.
- issue: Valeur de αὐτοὶ
  choice: Rendre le contraste par « Eux, ils »
  alternative: Employer simplement « Ils » ou renforcer par « eux-mêmes »
  rationale: La dislocation rend l’accent contrastif perceptible en français sans donner au pronom une insistance réflexive excessive.
translation_notes:
  register: Français international moderne, naturel et digne. La reformulation « ce qu’ils disent vient du monde » évite le calque peu idiomatique « ils parlent à partir du monde » tout en conservant la répétition et l’idée de provenance du grec.
