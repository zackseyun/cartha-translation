id: 1JN.4.14
reference: 1 John 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς τεθεάμεθα καὶ μαρτυροῦμεν ὅτι ὁ πατὴρ ἀπέσταλκεν τὸν υἱὸν σωτῆρα τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/014.yaml
  text: And we have seen and testify that the Father has sent the Son as the Savior of the world[a].
translation:
  language: fr
  text: Et nous, nous avons vu et nous témoignons que le Père a envoyé le Fils comme Sauveur du monde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « le Père a envoyé le Fils, Sauveur du monde ».'
    reason: La construction grecque place « Sauveur du monde » en apposition à « le Fils », sans équivalent explicite de « comme ».
lexical_decisions:
- source_word: καὶ ἡμεῖς
  choice: Et nous, nous
  rationale: Le pronom grec explicite porte une légère emphase. La dislocation naturelle « Et nous, nous » la rend en français moderne tout en maintenant le lien avec le contexte.
- source_word: τεθεάμεθα
  choice: avons vu
  rationale: Le parfait exprime une vision accomplie dont la portée demeure. « Avons vu » est naturel et conserve la force du témoignage direct, sans archaïsme.
- source_word: μαρτυροῦμεν
  choice: témoignons
  rationale: Le présent indique un témoignage en cours découlant de ce qui a été vu; « témoignons » rend directement cette activité.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit ici le contenu du témoignage, et non sa cause.
- source_word: ὁ πατήρ
  choice: le Père
  rationale: Dans ce contexte johannique, il s’agit du titre relationnel de Dieu vis-à-vis du Fils; la majuscule signale cet emploi titulaire.
- source_word: ἀπέσταλκεν
  choice: a envoyé
  rationale: Le passé composé français exprime naturellement l’acte accompli avec sa pertinence présente.
- source_word: τὸν υἱόν
  choice: le Fils
  rationale: Le grec porte l’article sans possessif explicite. « Le Fils » préserve exactement le titre relationnel employé en regard de « le Père ».
- source_word: σωτῆρα τοῦ κόσμου
  choice: comme Sauveur du monde
  rationale: « Sauveur » est l’équivalent établi de σωτήρ, et « du monde » conserve le génitif et sa portée générale. « Comme » rend l’apposition prédicative de façon idiomatique en français.
theological_decisions:
- issue: Portée de « Sauveur du monde »
  choice: Maintenir sans restriction l’expression « Sauveur du monde ».
  alternative: Sauveur des élus; Sauveur potentiel du monde
  rationale: Le grec donne directement ce titre et cette portée. La traduction ne doit ni les réduire ni préciser une théorie particulière du salut.
- issue: Langage relationnel du Père et du Fils
  choice: Employer « le Père » et « le Fils ».
  alternative: Dieu le Père a envoyé Jésus-Christ
  rationale: Le verset emploie ces titres relationnels et ne donne ici ni le nom Jésus ni le titre Christ; une explicitation dépasserait le texte.
- issue: Valeur de l’apposition σωτῆρα
  choice: Rendre l’apposition par « comme Sauveur ».
  alternative: « le Fils, Sauveur du monde »
  rationale: La formulation avec « comme » est naturelle et indique la fonction dans laquelle le Fils a été envoyé, tandis que la note conserve la construction plus littérale et son éventuelle nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « Et nous, nous » conserve l’emphase du pronom grec explicite. Les majuscules à Père, Fils et Sauveur correspondent à leur emploi comme titres dans ce contexte.
