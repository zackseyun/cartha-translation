id: 1JN.4.15
reference: 1 John 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ⸀ἐὰν ὁμολογήσῃ ὅτι ⸀Ἰησοῦς ἐστιν ὁ υἱὸς τοῦ θεοῦ, ὁ θεὸς ἐν αὐτῷ μένει καὶ αὐτὸς ἐν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/015.yaml
  text: Whoever confesses that Jesus is the Son of God[a], God remains in him, and he in God.
translation:
  language: fr
  text: Quiconque reconnaît que Jésus est le Fils de Dieu[a], Dieu demeure en lui, et lui en Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec menō, terme important dans les écrits de Jean, peut aussi être rendu par « rester » ou « habiter » : « Dieu habite en lui, et lui en Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: Quiconque
  rationale: Le pronom relatif avec ἐάν introduit une proposition relative indéfinie. « Quiconque » en conserve la portée générale dans un français digne et naturel.
- source_word: ὁμολογήσῃ
  choice: reconnaît
  rationale: Dans le contexte johannique, ὁμολογέω désigne le fait de reconnaître ou de déclarer ouvertement une vérité au sujet de Jésus. « Reconnaît » est clair en français moderne et conserve ici la portée confessionnelle sans suggérer principalement l’aveu d’une faute.
- source_word: ὅτι
  choice: que
  rationale: Introduit directement le contenu de la reconnaissance.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française usuelle du nom propre.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Conserve l’article, la forme explicite et la valeur de titre christologique de l’expression grecque.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Sujet défini, rendu selon l’usage français ordinaire.
- source_word: ἐν αὐτῷ μένει
  choice: demeure en lui
  rationale: μένω est un terme johannique majeur. « Demeure » exprime la continuité et la relation intérieure tout en restant courant dans le registre biblique français.
- source_word: καὶ αὐτὸς ἐν τῷ θεῷ
  choice: et lui en Dieu
  rationale: Le grec omet le verbe dans le second membre. Cette formulation conserve l’ellipse et le parallélisme, le verbe « demeure » étant naturellement sous-entendu.
theological_decisions:
- issue: Demeure réciproque de Dieu et de la personne croyante
  choice: Conserver la formulation réciproque « Dieu demeure en lui, et lui en Dieu » sans l’expliquer ni la systématiser.
  alternative: Dieu vit en lui, et lui vit en Dieu.
  rationale: Le texte relie directement la confession concernant Jésus à cette demeure mutuelle. La traduction maintient la tension et la symétrie théologiques du grec sans les réduire à une simple association.
- issue: Titre christologique
  choice: Traduire ὁ υἱὸς τοῦ θεοῦ par « le Fils de Dieu ».
  alternative: le Fils qui vient de Dieu
  rationale: La formulation retenue reproduit le titre explicite du texte grec sans ajout interprétatif.
translation_notes:
  register: Français international moderne, clair et digne. « Reconnaît » évite que « confesse » soit compris avant tout comme l’aveu d’un péché. « Demeure » maintient le vocabulaire relationnel caractéristique de Jean. L’ellipse du second verbe est conservée, car elle reste intelligible en français et respecte le rythme du grec.
