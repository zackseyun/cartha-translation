id: 1JN.4.18
reference: 1 John 4:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: φόβος οὐκ ἔστιν ἐν τῇ ἀγάπῃ, ἀλλ’ ἡ τελεία ἀγάπη ἔξω βάλλει τὸν φόβον, ὅτι ὁ φόβος κόλασιν ἔχει, ὁ δὲ φοβούμενος οὐ τετελείωται ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/004/018.yaml
  text: There is no fear in love[a], but perfect love drives out fear, because fear has punishment[c][b]. But the one who fears has not been perfected in love.
translation:
  language: fr
  text: Il n’y a pas de crainte dans l’amour, mais l’amour parfait[a] chasse la crainte, car la crainte comporte un châtiment[b]. Celui qui éprouve de la crainte n’a pas été rendu parfait dans l’amour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « parfait » peut aussi signifier « complet » ou « arrivé à son plein accomplissement ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la crainte a un châtiment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος / φοβούμενος
  choice: crainte / celui qui éprouve de la crainte
  rationale: « Crainte » convient au contexte du jugement et permet de conserver la répétition du terme grec. La tournure avec « éprouve » reste naturelle en français sans préciser indûment la nature de cette crainte.
- source_word: ἀγάπη / ἀγάπῃ
  choice: amour
  rationale: Rend directement le terme grec et maintient le mot clé de manière constante dans tout le verset.
- source_word: τελεία
  choice: parfait
  rationale: « Parfait » conserve le lien lexical et conceptuel avec τετελείωται, tout en pouvant désigner ici ce qui est arrivé à son plein accomplissement.
- source_word: ἔξω βάλλει
  choice: chasse
  rationale: Expression française naturelle qui garde l’image d’une expulsion énergique, sans l’alourdir par une formulation trop littérale.
- source_word: κόλασιν ἔχει
  choice: comporte un châtiment
  rationale: Cette formulation reste proche du grec, littéralement « a un châtiment », tout en étant idiomatique en français. Elle préserve l’ambiguïté du rapport exact entre la crainte et le châtiment.
- source_word: τετελείωται
  choice: n’a pas été rendu parfait
  rationale: Le parfait passif grec décrit un état résultant d’un accomplissement qui n’a pas eu lieu. Cette traduction maintient aussi le rapport verbal avec « l’amour parfait ».
- source_word: ἐν τῇ ἀγάπῃ
  choice: dans l’amour
  rationale: Traduction simple et naturelle qui conserve la portée relationnelle ou sphérique de la préposition grecque.
theological_decisions:
- issue: Rapport entre « l’amour parfait » et la personne « rendue parfaite dans l’amour »
  choice: Conserver « parfait » dans les deux propositions apparentées.
  alternative: « l’amour accompli » / « n’est pas arrivé à maturité dans l’amour »
  rationale: La répétition préserve la tension du texte entre la plénitude de l’amour et l’état encore incomplet de la personne, sans introduire une doctrine de perfection morale absolue.
- issue: Nature du lien entre crainte et châtiment
  choice: « la crainte comporte un châtiment »
  alternative: « la crainte est liée au châtiment » ou « la crainte vient de l’attente du châtiment »
  rationale: Le grec affirme littéralement que la crainte « a » un châtiment, sans expliquer précisément le lien. La traduction choisie évite de réduire le sens à la seule anticipation psychologique du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « crainte », « amour » et « parfait » conserve la structure argumentative et les liens lexicaux du grec.
