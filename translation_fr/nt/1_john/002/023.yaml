  text: πᾶς ὁ ἀρνούμενος τὸν υἱὸν οὐδὲ τὸν πατέρα ἔχει· ⸂ὁ ὁμολογῶν τὸν υἱὸν καὶ τὸν πατέρα ἔχει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/023.yaml
  text: Everyone who denies the Son does not have the Father either[a]; whoever confesses the Son has the Father also.
translation:
  language: fr
  text: Quiconque nie le Fils n’a pas non plus le Père ; quiconque confesse le Fils a aussi le Père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits omettent : « quiconque confesse le Fils a aussi le Père ».'
    reason: textual_variant
lexical_decisions:
- source_word: πᾶς ὁ ἀρνούμενος
  choice: Quiconque nie
  rationale: Le participe présent substantivé a une portée générale. « Quiconque nie » exprime naturellement en français cette portée universelle sans reproduire lourdement la forme participiale grecque.
- source_word: ἀρνούμενος
  choice: nie
  rationale: Dans ce contexte confessionnel, ἀρνέομαι désigne la négation ou le refus de reconnaître l’identité du Fils. « Nie » conserve la formulation directe du grec sans ajouter l’idée plus large de rejet.
- source_word: τὸν υἱὸν
  choice: le Fils
  rationale: Le grec emploie le titre défini « le Fils » sans complément. Ajouter « de Dieu » expliciterait une vérité contextuelle qui n’est pas formulée ici.
- source_word: οὐδὲ
  choice: pas non plus
  rationale: Dans cette proposition négative, οὐδὲ étend la négation au Père. « Pas non plus » rend clairement et idiomatiquement cette relation en français.
- source_word: τὸν πατέρα ἔχει
  choice: a le Père
  rationale: La traduction conserve l’idiome johannique avec le verbe « avoir ». Elle n’en réduit pas la portée à une seule interprétation relationnelle, telle que la communion avec le Père ou l’appartenance au Père.
- source_word: ὁ ὁμολογῶν
  choice: celui qui reconnaît
  rationale: Le participe présent substantivé désigne de manière générale la personne qui reconnaît ou professe le Fils. « Reconnaît » est naturel en français moderne dans cette opposition avec « nie » et évite l’ambiguïté courante de « confesser », souvent compris comme l’aveu d’une faute.
- source_word: καὶ
  choice: aussi
  rationale: Dans la construction antithétique, καὶ indique que celui qui reconnaît le Fils a également le Père. « Aussi » fait ressortir ce parallélisme avec « pas non plus ».
theological_decisions:
- issue: Seconde proposition signalée comme textuellement incertaine dans le SBLGNT
  choice: 'Inclure dans le texte principal : « celui qui reconnaît le Fils a aussi le Père »'
  alternative: Omettre cette proposition, absente de certains manuscrits
  rationale: Le texte grec fourni imprime cette proposition, tout en la signalant comme variante. Elle est donc traduite dans le texte principal, et son omission dans certains témoins est indiquée en note.
- issue: Portée relationnelle de l’expression « avoir le Père »
  choice: Conserver littéralement « a le Père »
  alternative: Expliciter par « est en communion avec le Père » ou « appartient au Père »
  rationale: La formulation johannique affirme l’inséparabilité du rapport au Fils et du rapport au Père. La conserver évite de limiter sa portée théologique à une seule catégorie relationnelle.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme « nie / reconnaît » et « pas non plus / aussi » rend lisible l’antithèse du grec. L’idiome théologique « avoir le Père » est volontairement conservé.
