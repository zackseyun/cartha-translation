source:
  edition: SBLGNT
  text: ὅτι πᾶν τὸ ἐν τῷ κόσμῳ, ἡ ἐπιθυμία τῆς σαρκὸς καὶ ἡ ἐπιθυμία τῶν ὀφθαλμῶν καὶ ἡ ἀλαζονεία τοῦ βίου, οὐκ ἔστιν ἐκ τοῦ πατρός, ἀλλὰ ἐκ τοῦ κόσμου ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/016.yaml
  text: For everything in the world—the desire of the flesh[a], the desire of the eyes, and the pride of life—is not from the Father[c][b], but is from the world.
translation:
  language: fr
  text: En effet, tout ce qui est dans le monde — le désir de la chair[a], le désir des yeux et l’orgueil de la vie[b] — ne vient pas du Père, mais du monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la convoitise de la chair ». Le mot grec traduit par « désir » peut désigner un désir intense, une convoitise ou une passion. Ici, « chair » peut évoquer les désirs corporels ou, plus largement, la condition humaine portée au péché.
    reason: lexical_alternative
  - marker: b
    text: L’expression peut aussi se comprendre comme « l’arrogance liée à son train de vie » ou « la prétention fondée sur ses biens ». Le mot grec traduit par « vie » peut désigner la manière de vivre, les moyens d’existence ou les possessions.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: En effet
  rationale: Introduit la raison qui fonde l’exhortation précédente. « En effet » exprime naturellement ce lien explicatif en français.
- source_word: πᾶν τὸ ἐν τῷ κόσμῳ
  choice: tout ce qui est dans le monde
  rationale: Le neutre singulier a une valeur collective. Cette formulation conserve à la fois la portée générale et la structure du grec.
- source_word: κόσμῳ / κόσμου
  choice: monde
  rationale: Le contexte désigne le monde en tant qu’ordre opposé au Père, mais « monde » préserve la portée du terme sans intégrer cette interprétation dans la traduction.
- source_word: ἐπιθυμία
  choice: désir
  rationale: Le mot peut désigner un désir intense et, dans ce contexte, mauvais. « Désir » conserve son étendue sémantique sans le limiter à la convoitise sexuelle.
- source_word: τῆς σαρκὸς
  choice: de la chair
  rationale: La traduction littérale conserve la texture théologique de l’expression et évite de la résoudre d’emblée en « nature pécheresse » ou en désirs purement corporels.
- source_word: τῶν ὀφθαλμῶν
  choice: des yeux
  rationale: Rend directement le génitif pluriel grec et demeure intelligible en français.
- source_word: ἀλαζονεία τοῦ βίου
  choice: l’orgueil de la vie
  rationale: Cette formulation maintient l’ambiguïté de βίος, qui peut évoquer la vie menée, les moyens d’existence ou les biens, tandis que ἀλαζονεία exprime une fierté arrogante et ostentatoire. Une note explicite les sens possibles.
- source_word: οὐκ ἔστιν ἐκ τοῦ πατρός
  choice: ne vient pas du Père
  rationale: « Venir de » exprime clairement en français l’idée de source ou d’origine portée par ἐκ.
- source_word: ἀλλὰ ἐκ τοῦ κόσμου ἐστίν
  choice: mais du monde
  rationale: L’ellipse française évite une répétition lourde tout en maintenant nettement le contraste entre les deux origines.
theological_decisions:
- issue: Sens de σάρξ dans une liste moralement négative
  choice: la chair
  alternative: la nature pécheresse
  rationale: « Chair » laisse ouverte la portée corporelle et anthropologique de l’expression. « Nature pécheresse » imposerait une interprétation théologique plus précise que le grec lui-même.
- issue: Portée théologique de κόσμος
  choice: le monde
  alternative: l’ordre du monde opposé à Dieu
  rationale: Le contraste avec le Père indique une valeur négative, mais l’expliciter dans le texte réduirait la polysémie johannique de « monde ».
- issue: Interprétation de ἀλαζονεία τοῦ βίου
  choice: l’orgueil de la vie
  alternative: l’arrogance fondée sur les biens que l’on possède
  rationale: La formulation retenue préserve la tension entre orgueil intérieur, vantardise sociale, train de vie et confiance dans les possessions; la solution alternative serait plus immédiatement claire, mais plus étroite.
translation_notes:
  register: Français international moderne, sobre et digne. La construction en trois éléments reproduit le rythme du grec. Les tirets isolent la liste explicative sans alourdir la phrase; « ne vient pas du Père, mais du monde » exprime naturellement le contraste d’origine.
