id: 1JN.2.21
reference: 1 John 2:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἔγραψα ὑμῖν ὅτι οὐκ οἴδατε τὴν ἀλήθειαν, ἀλλ’ ὅτι οἴδατε αὐτήν, καὶ ὅτι πᾶν ψεῦδος ἐκ τῆς ἀληθείας οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/021.yaml
  text: I have not written to you because you do not know the truth[a], but because you do know it[b], and because no lie is from the truth.
translation:
  language: fr
  text: Je ne vous ai pas écrit parce que vous ne connaissez pas la vérité, mais parce que vous la connaissez et parce qu’aucun mensonge ne vient de la vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγραψα
  choice: je ne vous ai pas écrit
  rationale: Le passé composé rend naturellement en français moderne l’aoriste dans ce contexte épistolaire, où les destinataires reçoivent maintenant ce que Jean a écrit.
- source_word: οἴδατε
  choice: vous connaissez / vous la connaissez
  rationale: « Connaître » convient à l’objet défini « la vérité » et le contraste entre la négation et l’affirmation suffit à porter l’insistance du grec.
- source_word: τὴν ἀλήθειαν / τῆς ἀληθείας
  choice: la vérité
  rationale: L’article défini est conservé, sans réduire la portée johannique de l’expression à une paraphrase doctrinale plus étroite.
- source_word: αὐτήν
  choice: la
  rationale: Le pronom reprend naturellement en français le nom féminin « vérité ».
- source_word: πᾶν ψεῦδος
  choice: aucun mensonge
  rationale: La tournure idiomatique française exprime clairement la négation universelle portée par πᾶν avec οὐκ.
- source_word: ἐκ τῆς ἀληθείας οὐκ ἔστιν
  choice: ne vient de la vérité
  rationale: « Venir de » exprime naturellement la source ou l’origine indiquée par ἐκ, tout en restant proche de la formulation grecque.
theological_decisions:
- issue: Nature de « la vérité » dans l’usage johannique
  choice: Conserver « la vérité » sans explicitation.
  alternative: « le vrai message » ou « la vérité de l’Évangile »
  rationale: Le texte possède une profondeur théologique, mais ne précise pas ici une désignation plus étroite; la formulation retenue préserve cette amplitude.
- issue: Rapport du mensonge à la vérité
  choice: « aucun mensonge ne vient de la vérité » comme affirmation de source ou d’origine
  alternative: « aucun mensonge n’est de la vérité »
  rationale: La préposition ἐκ indique l’origine. « Ne vient de » rend ce rapport clairement en français sans élargir l’énoncé au-delà du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination répétée par « parce que » conserve la structure argumentative du grec sans lourdeur excessive.
