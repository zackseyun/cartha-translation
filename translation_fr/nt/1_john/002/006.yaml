id: 1JN.2.6
reference: 1 John 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ λέγων ἐν αὐτῷ μένειν ὀφείλει καθὼς ἐκεῖνος περιεπάτησεν καὶ ⸀αὐτὸς περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/006.yaml
  text: The one who says he remains in him ought also to walk just as that one walked[a][b][c].
translation:
  language: fr
  text: Celui qui dit demeurer en lui doit, lui aussi, marcher comme celui-là a marché[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rester en lui ». Le verbe grec μένω, fréquent chez Jean, évoque le fait de rester, de continuer ou de demeurer dans une relation.
    reason: lexical_alternative
  - marker: b
    text: « Celui-là » désigne Jésus et conserve la valeur démonstrative appuyée du grec; on pourrait aussi traduire simplement par « il ».
    reason: alternative_reading
  - marker: c
    text: 'Dans la Bible, « marcher » est une image de la manière de vivre: il faut donc vivre comme Jésus a vécu.'
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λέγων
  choice: Celui qui dit
  rationale: Le participe substantivé désigne une personne représentative. « Celui qui dit » conserve le singulier et la structure grecque dans un français naturel.
- source_word: ἐν αὐτῷ μένειν
  choice: demeurer en lui
  rationale: « Demeurer » rend le terme johannique majeur μένω et préserve ses dimensions de continuité et de relation. L’infinitif exprime directement le contenu de ce que la personne affirme.
- source_word: ὀφείλει
  choice: doit
  rationale: Le verbe exprime ici une obligation morale. « Doit » est clair, digne et idiomatique, sans la lourdeur de « est tenu de ».
- source_word: καθὼς
  choice: comme
  rationale: « Comme » exprime naturellement la correspondance de manière indiquée par καθώς; la comparaison étroite ressort déjà de la construction entière.
- source_word: ἐκεῖνος
  choice: celui-là
  rationale: « Celui-là » conserve la valeur démonstrative et emphatique de ἐκεῖνος plutôt que de la réduire à un simple pronom. Le contexte permet de reconnaître Jésus comme référent.
- source_word: περιεπάτησεν ... περιπατεῖν
  choice: a marché ... marcher
  rationale: Le maintien du verbe « marcher » préserve la métaphore biblique de la conduite et la correspondance lexicale entre le modèle et celui qui doit l’imiter.
- source_word: καὶ αὐτὸς
  choice: lui aussi
  rationale: Cette formulation rend à la fois la valeur additive de καί et l’emphase portée par αὐτός sur le sujet.
theological_decisions:
- issue: Référent de αὐτῷ et ἐκεῖνος
  choice: Les expressions « en lui » et « celui-là » restent en minuscules; le contexte désigne Jésus.
  alternative: Employer « en Lui » et « Celui-là », ou remplacer « celui-là » par « il » ou « Jésus ».
  rationale: Le grec ne marque pas les pronoms divins par des majuscules. Conserver « celui-là » respecte l’emphase démonstrative sans insérer le nom de Jésus dans le corps du texte; une note explicite le référent contextuel.
- issue: Portée représentative du masculin singulier
  choice: Conserver le singulier « Celui qui dit » et reprendre le sujet par « lui aussi ».
  alternative: Reformuler au pluriel ou employer une tournure épicène telle que « Quiconque dit ».
  rationale: La forme grecque est un masculin singulier à portée représentative. La traduction en garde la forme grammaticale sans limiter le propos aux hommes.
- issue: Métaphore éthique de la marche
  choice: Conserver « marcher » dans le texte.
  alternative: Expliciter directement par « vivre » ou « se conduire ».
  rationale: La métaphore exprime la manière de vivre et s’inscrit dans un réseau biblique important. La note en éclaire le sens sans l’effacer.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans devenir artificielle. « Demeurer » et « marcher » maintiennent deux termes johanniques et bibliques importants; les notes préviennent toute opacité. La virgule autour de « lui aussi » rend l’emphase de καὶ αὐτός.
