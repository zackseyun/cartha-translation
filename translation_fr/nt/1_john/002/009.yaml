source:
  edition: SBLGNT
  text: ὁ λέγων ἐν τῷ φωτὶ εἶναι καὶ τὸν ἀδελφὸν αὐτοῦ μισῶν ἐν τῇ σκοτίᾳ ἐστὶν ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/009.yaml
  text: The one who says he is in the light and hates his brother is in the darkness until now[a].
translation:
  language: fr
  text: Celui qui dit être dans la lumière et qui hait son frère est dans les ténèbres jusqu’à présent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son frère ou sa sœur ». Le grec emploie le masculin singulier « frère », qui peut avoir ici une valeur représentative.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Celui qui dit
  rationale: L’article suivi du participe présent forme un sujet substantivé et décrit une personne représentative; cette tournure française conserve naturellement la structure grecque.
- source_word: ἐν τῷ φωτὶ εἶναι
  choice: être dans la lumière
  rationale: Après « dit », l’infinitif est idiomatique en français et maintient l’image johannique d’une sphère morale et spirituelle.
- source_word: καί ... μισῶν
  choice: tout en haïssant
  rationale: Cette construction exprime nettement la simultanéité et la contradiction entre la prétention affichée et l’attitude persistante, sans ajouter de causalité.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Le masculin singulier du grec est conservé. Dans ce contexte éthique, il peut toutefois avoir une portée représentative, signalée en note.
- source_word: ἐν τῇ σκοτίᾳ
  choice: dans les ténèbres
  rationale: La formulation française traditionnelle et naturelle préserve le contraste conceptuel avec « la lumière » ainsi que l’imagerie johannique.
- source_word: ἕως ἄρτι
  choice: encore maintenant
  rationale: Cette expression rend la continuité de l’état jusqu’au moment présent. Elle évite l’éventuelle suggestion française de « jusqu’à maintenant » qu’un changement vient nécessairement de se produire.
theological_decisions:
- issue: Portée de ἀδελφός dans une affirmation éthique représentative
  choice: frère
  alternative: frère ou sœur; frère ou sœur dans la foi
  rationale: « Frère » respecte la forme masculine singulière du texte. La note préserve la possible portée inclusive sans imposer dans le corps du texte l’interprétation plus précise de « croyant ».
- issue: Force temporelle de ἕως ἄρτι
  choice: encore maintenant
  alternative: jusqu’à maintenant
  rationale: Le texte affirme que la personne demeure présentement dans les ténèbres; « encore maintenant » exprime cette persistance sans laisser entendre que cet état prend fin au moment où l’auteur parle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant idiomatique; « tout en haïssant » met en relief la contradiction centrale, et « les ténèbres » conserve le vocabulaire johannique usuel.
