id: 1JN.2.17
reference: 1 John 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ κόσμος παράγεται καὶ ἡ ἐπιθυμία αὐτοῦ, ὁ δὲ ποιῶν τὸ θέλημα τοῦ θεοῦ μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/017.yaml
  text: And the world is passing away[a], along with its desire[b], but the one who does the will of God remains forever.
translation:
  language: fr
  text: Et le monde passe, et son désir aussi[a], mais celui qui fait la volonté de Dieu demeure pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa convoitise ». Le grec ἐπιθυμία désigne un désir intense ; dans ce contexte, il s’agit des désirs désordonnés qui caractérisent le monde.
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: le monde
  rationale: 'Cette formulation large et habituelle conserve le sens johannique, précisé par le contexte immédiat : le monde humain envisagé dans son opposition à Dieu et caractérisé par ses désirs, sans réduire le terme à la seule création physique.'
- source_word: παράγεται
  choice: passe
  rationale: Le présent français exprime naturellement le processus en cours et le caractère transitoire du monde. « Est en train de passer » serait plus explicitement duratif, mais plus lourd.
- source_word: ἐπιθυμία
  choice: désir
  rationale: Le terme grec désigne ici un désir moralement désordonné, sans être nécessairement sexuel. « Désir » garde sa portée générale; le contexte de 2.16 en précise le caractère négatif.
- source_word: αὐτοῦ
  choice: son
  rationale: Le possessif renvoie à κόσμος, rendu par le nom masculin français « monde ».
- source_word: ὁ δὲ ποιῶν
  choice: mais celui qui fait
  rationale: Cette tournure rend le participe substantivé au singulier et décrit la personne caractérisée par l'accomplissement de la volonté divine, sans archaïsme.
- source_word: θέλημα
  choice: la volonté
  rationale: « Volonté » est l'équivalent français naturel et conserve la portée théologique du dessein ou de la volonté exprimée de Dieu.
- source_word: μένει
  choice: demeure
  rationale: « Demeure » restitue le verbe johannique μένω et exprime une continuité durable dans un registre à la fois courant et digne.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression idiomatique rend clairement la permanence sans fin indiquée ici.
theological_decisions:
- issue: Sens de κόσμος dans le contexte johannique
  choice: Conserver « le monde » en laissant le contexte indiquer l'ordre humain transitoire opposé à Dieu
  alternative: Préciser dans le texte « l'ordre du monde » ou comprendre uniquement la création physique
  rationale: 1 Jean 2.15-16 caractérise ce monde par ses désirs et son orgueil. La traduction garde néanmoins l'ampleur et la tension du terme grec au lieu d'imposer une paraphrase doctrinale.
- issue: Portée de μένει εἰς τὸν αἰῶνα
  choice: « demeure pour toujours », affirmant la permanence de celui qui fait la volonté de Dieu
  alternative: Expliciter cette permanence comme une déclaration technique sur la vie éternelle
  rationale: Le grec affirme une continuité durable sans exposer ici son mécanisme théologique. La formulation retenue conserve cette force sans ajouter de catégorie absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. Le présent « passe » est naturel en français et conserve l'idée d'un processus actuel. « Demeure » maintient l'écho du vocabulaire johannique sans rendre la phrase obscure.
