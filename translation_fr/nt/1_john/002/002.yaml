id: 1JN.2.2
reference: 1 John 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἱλασμός ἐστιν περὶ τῶν ἁμαρτιῶν ἡμῶν, οὐ περὶ τῶν ἡμετέρων δὲ μόνον ἀλλὰ καὶ περὶ ὅλου τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/002.yaml
  text: And he himself is the atoning sacrifice for our sins[a], and not for ours only but also for the whole world.
translation:
  language: fr
  text: Et lui-même est le sacrifice expiatoire pour nos péchés[a], non seulement pour les nôtres, mais aussi pour ceux du monde entier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « propitiation ». Le terme grec peut aussi être compris au sens d’« expiation ».
    reason: alternative_lexicale
lexical_decisions:
- source_word: αὐτὸς
  choice: lui-même
  rationale: L’emploi intensif de αὐτός souligne le rôle personnel de Jésus et se rend naturellement en français par « lui-même ».
- source_word: ἱλασμός
  choice: le sacrifice qui expie
  rationale: Cette formulation actuelle et accessible exprime à la fois la dimension sacrificielle et le traitement du péché, sans imposer le vocabulaire technique et controversé de « propitiation ».
- source_word: περὶ τῶν ἁμαρτιῶν ἡμῶν
  choice: nos péchés
  rationale: Avec ἱλασμός, περί établit le rapport entre le sacrifice et les péchés. La tournure verbale française « le sacrifice qui expie nos péchés » rend ce lien clairement et naturellement.
- source_word: τῶν ἡμετέρων
  choice: les nôtres
  rationale: L’adjectif grec est elliptique et reprend « péchés » ; « les nôtres » conserve cette ellipse de façon idiomatique.
- source_word: ὅλου τοῦ κόσμου
  choice: ceux du monde entier
  rationale: « Ceux » reprend explicitement les péchés, tandis que « du monde entier » préserve sans restriction la portée générale de ὅλου τοῦ κόσμου.
- source_word: οὐ … μόνον ἀλλὰ καὶ
  choice: non seulement … mais aussi
  rationale: Cette construction française reproduit naturellement la corrélation et le contraste du grec.
theological_decisions:
- issue: Portée de « ὅλου τοῦ κόσμου »
  choice: Conserver « du monde entier » sans en limiter la portée.
  alternative: « des personnes du monde entier » ou « des élus partout dans le monde »
  rationale: Le grec affirme une portée globale sans préciser l’une de ces interprétations. La traduction maintient donc l’ampleur et la tension théologique du texte.
- issue: Sens de ἱλασμός
  choice: « le sacrifice qui expie » dans le texte principal
  alternative: « la propitiation », « l’expiation » ou « le sacrifice de réconciliation »
  rationale: ἱλασμός appartient à un champ sémantique discuté pouvant mettre en jeu l’expiation, la propitiation et le rétablissement de la relation. Le texte principal privilégie une formulation intelligible qui conserve la dimension sacrificielle ; la note signale les principales nuances possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite un jargon théologique inutile tout en conservant la dimension sacrificielle du grec. Le point-virgule clarifie la structure contrastive sans alourdir la phrase.
