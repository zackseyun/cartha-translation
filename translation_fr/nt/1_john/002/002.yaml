review_pass:
  verdict: revise
  source_fidelity: Le sens global est bien rendu et la portée universelle de ὅλου τοῦ κόσμου est conservée. Toutefois, la reprise elliptique « les nôtres » après « nos péchés » doit rester introduite par « pour », correspondant au δεύτερο περὶ grec et évitant une coordination française moins nette.
  naturalness: « Le sacrifice expiatoire » est une formulation française établie, plus concise et plus idiomatique que « le sacrifice qui expie ». La répétition de « pour » clarifie la structure sans alourdir excessivement la phrase.
  terminology: « Sacrifice expiatoire » rend de manière accessible la dimension sacrificielle de ἱλασμός, sans prétendre trancher entre les nuances d’expiation et de propitiation. La note préserve l’alternative importante « propitiation ».
  issues:
  - severity: medium
    issue: La seconde partie omet « pour » devant « les nôtres ».
    rationale: Le grec répète περὶ dans « οὐ περὶ τῶν ἡμετέρων… ἀλλὰ καὶ περὶ… ». En français, « non seulement les nôtres, mais aussi ceux… » peut se comprendre, mais la construction est moins explicite après « est le sacrifice qui expie nos péchés » et atténue le parallélisme du texte source.
  - severity: low
    issue: « Le sacrifice qui expie » est moins naturel et moins précis comme désignation de ἱλασμός.
    rationale: « Sacrifice expiatoire » est une collocation française usuelle qui conserve le caractère nominal du grec et sa référence sacrificielle.
  revised_text: Et lui-même est le sacrifice expiatoire pour nos péchés[a], non seulement pour les nôtres, mais aussi pour ceux du monde entier.
  revised_footnotes:
  - marker: a
    text: Ou « propitiation ». Le terme grec peut aussi être compris au sens d’« expiation ».
    reason: alternative_lexicale
  revision_rationale: La révision rétablit explicitement le rapport « pour » dans les deux membres de l’opposition grecque et adopte « sacrifice expiatoire », expression française naturelle pour le sens sacrificiel de ἱλασμός. La note maintient l’ambiguïté lexicale disputée sans imposer une interprétation doctrinale.
