- from: Et lui-même est le sacrifice qui expie nos péchés[a] ; non seulement les nôtres, mais aussi ceux du monde entier.
  to: Et lui-même est le sacrifice expiatoire pour nos péchés[a], non seulement pour les nôtres, mais aussi pour ceux du monde entier.
  rationale: La révision rétablit explicitement le rapport « pour » dans les deux membres de l’opposition grecque et adopte « sacrifice expiatoire », expression française naturelle pour le sens sacrificiel de ἱλασμός. La note maintient l’ambiguïté lexicale disputée sans imposer une interprétation doctrinale.
