    rationale: Cette expression transforme le simple marqueur « de nouveau / encore » en opposition explicite. Le contraste avec le verset précédent peut être perçu par le lecteur sans être incorporé au sens lexical du mot.
  - severity: low
    issue: « les ténèbres passent » pour παράγεται
    rationale: La formulation française est recevable, mais peut évoquer un simple passage plutôt qu’un effacement. « se dissipent » exprime plus clairement le mouvement de disparition inhérent au contexte.
  - severity: low
    issue: Note sur le référent de αὐτῷ
    rationale: L’alternative mérite d’être formulée à partir de l’ambiguïté formelle du datif grec, identique au masculin et au neutre, plutôt que comme si le référent personnel était grammaticalement imposé.
