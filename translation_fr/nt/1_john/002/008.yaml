id: 1JN.2.8
reference: 1 John 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάλιν ἐντολὴν καινὴν γράφω ὑμῖν, ὅ ἐστιν ἀληθὲς ἐν αὐτῷ καὶ ἐν ὑμῖν, ὅτι ἡ σκοτία παράγεται καὶ τὸ φῶς τὸ ἀληθινὸν ἤδη φαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/008.yaml
  text: Again[a], I am writing to you a new commandment, which is true in him and in you, because the darkness is passing away and the true light is already shining.
translation:
  language: fr
  text: De nouveau, je vous écris un commandement nouveau, ce qui est vrai en lui[a] et en vous, puisque les ténèbres se dissipent et que la vraie lumière brille déjà.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui est vrai dans ce commandement et en vous », si le pronom grec renvoie au commandement plutôt qu’au Christ. La forme grecque peut être masculine ou neutre.'
    reason: Lecture alternative du référent de αὐτῷ.
lexical_decisions:
- source_word: πάλιν
  choice: D’un autre côté
  rationale: 'Dans le prolongement du verset 7, le terme introduit l’autre aspect d’une affirmation en tension : le commandement n’est pas nouveau, et pourtant il l’est. Cette formulation française marque ce contraste sans le surinterpréter.'
- source_word: ἐντολὴν καινὴν
  choice: un commandement nouveau
  rationale: Rendu direct et idiomatique qui conserve l’idée d’une nouveauté de nature ou de qualité et reprend le vocabulaire johannique.
- source_word: γράφω
  choice: je vous écris
  rationale: Le présent grec désigne naturellement l’acte d’écrire en cours. La construction avec le complément indirect est claire en français actuel.
- source_word: ὅ ἐστιν ἀληθές
  choice: ce qui est vrai
  rationale: Le relatif neutre reprend vraisemblablement l’idée précédente dans son ensemble. Cette tournure française en préserve la portée conceptuelle.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Le pronom renvoie le plus naturellement à Christ dans le contexte johannique, tout en laissant l’autre compréhension dans une note.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: Le rendu direct conserve le parallélisme avec « en lui » et peut désigner une réalité présente chez les destinataires collectivement.
- source_word: ὅτι
  choice: puisque
  rationale: La conjonction introduit le fondement de l’affirmation précédente. « Puisque » exprime naturellement ce lien causal.
- source_word: ἡ σκοτία παράγεται
  choice: les ténèbres passent
  rationale: Le présent décrit un processus en cours. « Passent » reste sobre et conserve l’image sans préciser indûment si elles disparaissent ou s’éloignent.
- source_word: τὸ φῶς τὸ ἀληθινόν
  choice: la vraie lumière
  rationale: Cette expression conserve le vocabulaire théologique caractéristique de Jean et le contraste avec les ténèbres.
- source_word: ἤδη φαίνει
  choice: brille déjà
  rationale: Le présent et l’adverbe indiquent que l’action est dès maintenant en cours, sans nier son accomplissement futur.
theological_decisions:
- issue: Référent de αὐτῷ
  choice: « en lui », avec Christ comme référent
  alternative: « dans ce commandement », si le pronom renvoie à l’idée du commandement
  rationale: Dans le contexte, le pronom s’entend le plus naturellement d’un référent personnel, Christ, et le parallélisme indique que la réalité du commandement se manifeste en lui puis chez les croyants. L’autre analyse possible est conservée en note afin de ne pas supprimer l’ambiguïté.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la tension entre le « commandement nouveau » et le verset précédent, ainsi que le contraste johannique entre ténèbres et lumière.
