  source_fidelity: La formulation « D’un autre côté » interprète πάλιν comme un marqueur d’opposition. Bien que le contexte avec le v. 7 explique cette nuance, πάλιν signifie d’abord « de nouveau / encore »; il convient de conserver ce marqueur sans expliciter davantage le contraste. « Les ténèbres passent » reste possible, mais rend moins nettement παράγεται, qui exprime leur disparition en cours.
  naturalness: « De nouveau » est idiomatique et sobre en français international. « Les ténèbres se dissipent » rend naturellement le processus en cours et le contraste avec la lumière. Le reste de la phrase est clair et conserve la densité johannique.
  terminology: « Commandement nouveau », « vrai », « en lui », « les ténèbres » et « la vraie lumière » sont appropriés et cohérents avec l’usage johannique. La note doit préciser que la forme grecque αὐτῷ peut être masculine ou neutre, afin de présenter l’alternative sans la surdéterminer.
  issues:
