reference: 1 John 2:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὑμεῖς ὃ ἠκούσατε ἀπ’ ἀρχῆς, ἐν ὑμῖν μενέτω· ἐὰν ἐν ὑμῖν μείνῃ ὃ ἀπ’ ἀρχῆς ἠκούσατε, καὶ ὑμεῖς ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ μενεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/024.yaml
  text: As for you[a], let what you heard from the beginning remain in you. If what you heard from the beginning remains in you[b], you also will remain in the Son and in the Father.
translation:
  language: fr
  text: Quant à vous, que ce que vous avez entendu dès le commencement demeure en vous. Si ce que vous avez entendu dès le commencement demeure en vous, vous aussi demeurerez dans le Fils et dans le Père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: Quant à vous
  rationale: Le pronom placé en tête est emphatique et marque un contraste avec les personnes évoquées auparavant. « Quant à vous » rend naturellement cette mise en relief en français.
- source_word: ὃ ἠκούσατε ἀπ’ ἀρχῆς
  choice: ce que vous avez entendu dès le commencement
  rationale: Le relatif neutre ὃ reste général et ne précise pas s’il s’agit du message, de l’Évangile ou de l’enseignement apostolique. « Ce que » préserve cette ouverture, tandis que « dès le commencement » conserve la résonance johannique de l’expression.
- source_word: ἐν ὑμῖν μενέτω
  choice: que … demeure en vous
  rationale: Le présent impératif appelle à une continuité durable. « Demeurer » est actuel, digne et permet de conserver le même verbe dans les trois occurrences de μένω du verset.
- source_word: ἐὰν ἐν ὑμῖν μείνῃ
  choice: si … demeure en vous
  rationale: Cette formulation rend naturellement en français la condition introduite par ἐάν avec le subjonctif, sans ajouter d’interprétation.
- source_word: καὶ ὑμεῖς
  choice: vous aussi, vous
  rationale: « Aussi » rend καί, et la reprise du pronom sujet reproduit sans lourdeur excessive l’emphase du pronom grec explicite.
- source_word: ἐν τῷ υἱῷ καὶ ἐν τῷ πατρὶ
  choice: dans le Fils et dans le Père
  rationale: La répétition de « dans » reflète les deux occurrences de ἐν et maintient le parallélisme relationnel entre le Fils et le Père.
- source_word: μενεῖτε
  choice: vous demeurerez
  rationale: Le futur de l’indicatif est rendu directement par le futur français, tout en conservant le lien lexical avec les deux formes précédentes de μένω.
theological_decisions:
- issue: Nature de l’affirmation conditionnelle finale
  choice: 'Rendre directement le futur : « vous aussi, vous demeurerez dans le Fils et dans le Père »'
  alternative: Transformer la proposition en exhortation ou l’expliciter selon une doctrine particulière de la persévérance
  rationale: Le grec formule une conséquence future conditionnée par la permanence de ce qui a été entendu. La traduction conserve cette tension sans la résoudre dans un cadre confessionnel.
- issue: Référent de « ce que vous avez entendu dès le commencement »
  choice: Conserver l’expression générale « ce que »
  alternative: Préciser « l’Évangile », « le message » ou « l’enseignement apostolique »
  rationale: Le contexte renvoie vraisemblablement à la proclamation apostolique concernant le Fils, mais le relatif grec ne nomme pas explicitement son référent. Le texte principal ne doit donc pas le préciser davantage.
translation_notes:
  register: Français international moderne, clair et digne. Le choix constant de « demeurer » préserve la répétition structurante du verbe johannique μένω. La syntaxe reste proche du grec tout en étant naturelle en français.
