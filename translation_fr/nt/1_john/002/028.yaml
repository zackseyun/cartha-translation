id: 1JN.2.28
reference: 1 John 2:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ νῦν, τεκνία, μένετε ἐν αὐτῷ, ἵνα ⸀ἐὰν φανερωθῇ ⸀σχῶμεν παρρησίαν καὶ μὴ αἰσχυνθῶμεν ἀπ’ αὐτοῦ ἐν τῇ παρουσίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/028.yaml
  text: And now[a], little children, remain in him, so that if he is revealed[c][b], we may have confidence and not shrink away from him in shame at his coming.
translation:
  language: fr
  text: Et maintenant, petits enfants, demeurez en lui, afin que, s’il se manifeste[a], nous ayons de l’assurance et que nous ne nous éloignions pas de lui, honteux[b], lors de sa venue[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’il apparaît »; plus littéralement, « s’il est manifesté ». Le verbe grec est au passif.
    reason: lexical_alternative
  - marker: b
    text: Ou « et que nous n’ayons pas honte devant lui ». L’expression peut désigner la honte éprouvée en sa présence sans mettre l’accent sur un éloignement de lui.
    reason: alternative_reading
  - marker: c
    text: Ou « lors de sa présence ». Dans ce contexte, « venue » rend le sens eschatologique du terme grec.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: petits enfants
  rationale: Le diminutif employé comme interpellation exprime une affection pastorale. « Petits enfants » conserve l’image familiale et la nuance diminutive, même si « mes enfants » serait plus idiomatique en français courant.
- source_word: μένετε
  choice: demeurez
  rationale: Le verbe μένω est un terme johannique majeur. « Demeurez » conserve son sens relationnel et duratif ainsi que sa récurrence littéraire, sans expliciter davantage la métaphore.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Cette traduction directe préserve la formulation relationnelle caractéristique de Jean sans la développer en « en union avec lui ».
- source_word: φανερωθῇ
  choice: il se manifeste
  rationale: Cette tournure est naturelle en français et exprime l’entrée dans la manifestation publique. Le grec est toutefois passif; la note conserve donc la traduction plus formelle « il est manifesté ».
- source_word: σχῶμεν παρρησίαν
  choice: nous ayons de l’assurance
  rationale: Dans ce contexte johannique, παρρησία désigne une confiance ouverte devant Dieu ou le Christ. « Assurance » est naturel et évite la nuance parfois combative de « hardiesse ».
- source_word: αἰσχυνθῶμεν ἀπ’ αὐτοῦ
  choice: nous ne reculions pas loin de lui, couverts de honte
  rationale: La formulation rend à la fois la honte exprimée par le verbe et le mouvement d’éloignement suggéré par ἀπό. Une note signale la lecture plus simple « ayons honte devant lui ».
- source_word: παρουσίᾳ
  choice: venue
  rationale: Dans ce contexte eschatologique, παρουσία désigne la venue future du Christ. « Venue » est clair et établi, tandis que « présence » en conserve le sens plus littéral.
theological_decisions:
- issue: Référent des pronoms et manifestation eschatologique
  choice: Les pronoms renvoient contextuellement au Fils, Jésus-Christ, et le verset évoque sa manifestation future.
  alternative: Comprendre les pronoms comme une référence plus générale à Dieu, sans préciser le Fils.
  rationale: Le contexte immédiat porte sur le fait de demeurer dans le Fils et sur sa manifestation. La traduction ne précise pas le nom du référent dans le corps du texte et conserve ainsi les pronoms du grec, tout en rendant παρουσία par « venue » conformément à son emploi eschatologique ici.
- issue: Nuance de la honte lors de la venue du Christ
  choice: Le texte envisage un recul loin de lui sous l’effet de la honte, sans identifier explicitement cette honte à une condamnation judiciaire finale.
  alternative: Comprendre simplement « avoir honte devant lui », sans nuance d’éloignement.
  rationale: L’association de αἰσχυνθῶμεν avec ἀπ’ αὐτοῦ permet de percevoir un mouvement de recul ou d’éloignement. La formulation retenue garde la force de l’avertissement sans lui ajouter une conclusion doctrinale absente du texte.
- issue: Valeur conditionnelle de ἐὰν
  choice: Conserver « si », qui maintient la forme conditionnelle du grec.
  alternative: Traduire « lorsqu’il se manifestera », en donnant à ἐὰν une valeur temporelle attendue.
  rationale: Dans ce contexte, la manifestation est tenue pour attendue, mais la construction grecque emploie ἐὰν avec le subjonctif. « S’il se manifeste » préserve cette forme et l’ambiguïté entre condition et temporalité indéfinie.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les termes johanniques « demeurez » et « en lui ». « Petits enfants » maintient l’adresse affectueuse et diminutive du grec; « mes enfants » serait plus courant, mais ajouterait un possessif absent du texte. Les notes préservent le passif de φανερωθῇ, l’autre compréhension possible de l’expression de honte et le sens littéral de παρουσία.
