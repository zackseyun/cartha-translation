  text: Γράφω ὑμῖν, τεκνία, ὅτι ἀφέωνται ὑμῖν αἱ ἁμαρτίαι διὰ τὸ ὄνομα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/012.yaml
  text: I am writing to you[a], little children[c][b], because your sins have been forgiven for the sake of his name.
translation:
  language: fr
  text: Je vous écris, petits enfants, parce que[a] vos péchés vous ont été pardonnés à cause de son nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou l’on peut comprendre la conjonction au sens déclaratif : elle introduirait le contenu de ce que Jean écrit. Ici, elle indique probablement la raison pour laquelle il écrit.'
    reason: alternative_reading
  - marker: b
    text: Le contexte peut conduire à comprendre « son » comme renvoyant à Dieu ou à Jésus ; le grec ne précise pas ici le référent.
    reason: alternative_reading
lexical_decisions:
- source_word: Γράφω
  choice: Je vous écris
  rationale: Le présent grec peut décrire simplement l’acte d’écrire en cours. En français épistolaire, « Je vous écris » est naturel et fidèle; « Je suis en train de vous écrire » serait inutilement lourd.
- source_word: τεκνία
  choice: petits enfants
  rationale: Le diminutif au vocatif exprime une tendre relation familiale, sans désigner nécessairement l’âge des destinataires. « Petits enfants » conserve cette forme affectueuse sans ajouter le possessif absent du grec.
- source_word: ὅτι
  choice: parce que
  rationale: Dans cette série d’énoncés, ὅτι indique très probablement la raison pour laquelle Jean écrit. « Parce que » rend clairement ce lien discursif tout en signalant l’autre analyse possible en note.
- source_word: ἀφέωνται
  choice: ont été pardonnés
  rationale: Le parfait passif présente le pardon comme un acte accompli dont le résultat demeure. Le passé composé passif français en conserve l’accomplissement et la voix passive.
- source_word: ὑμῖν αἱ ἁμαρτίαι
  choice: vos péchés vous ont été pardonnés
  rationale: Le datif ὑμῖν désigne les bénéficiaires du pardon. La tournure française avec « vos péchés » et « vous » transmet explicitement ce rapport sans traiter l’article grec comme un simple possessif.
- source_word: διὰ τὸ ὄνομα αὐτοῦ
  choice: à cause de son nom
  rationale: διά avec l’accusatif exprime ici la cause ou le fondement. « À cause de son nom » garde l’image biblique du nom, avec sa portée personnelle et théologique, au lieu de la réduire à la réputation.
theological_decisions:
- issue: Référent de αὐτοῦ (« son »)
  choice: Maintien du pronom « son » sans identifier explicitement son référent dans le texte
  alternative: « le nom de Dieu » ou « le nom de Jésus-Christ »
  rationale: Le verset ne nomme pas explicitement le référent. Le contexte plus large permet plusieurs analyses; conserver le pronom respecte l’ambiguïté du grec et évite d’imposer une conclusion théologique.
- issue: Fonction de ὅτι
  choice: 'Valeur causale : « parce que »'
  alternative: 'Valeur déclarative : « que »'
  rationale: La structure du passage favorise une explication de la raison pour laquelle l’auteur écrit, mais la valeur déclarative demeure grammaticalement possible et est conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’adresse affectueuse « petits enfants », le parfait passif du pardon et l’expression biblique « son nom », sans expliciter ce que le grec laisse ouvert.
