  source_fidelity: 'Le texte rend fidèlement la structure et le sens du grec : sujet générique (« Celui qui dit »), affirmation de connaissance actuelle (« Je le connais »), non-observance des commandements, jugement « est un menteur », et négation finale concernant la vérité. Le pronom « le » conserve à juste titre l’antécédent implicite sans trancher entre Dieu et le Christ. La note a signale de manière adéquate la valeur résultative du parfait ἔγνωκα.'
