id: 1JN.2.4
reference: 1 John 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ λέγων ⸀ὅτι Ἔγνωκα αὐτὸν καὶ τὰς ἐντολὰς αὐτοῦ μὴ τηρῶν ψεύστης ἐστίν, καὶ ἐν τούτῳ ἡ ἀλήθεια οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/004.yaml
  text: The one who says[a], “I have come to know him,” and does not keep his commandments is a liar[b], and the truth is not in him.
translation:
  language: fr
  text: 'Celui qui dit : « Je le connais[a] », mais qui ne garde pas ses commandements est un menteur, et la vérité n’est pas en lui[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « J’ai appris à le connaître. » Le parfait grec présente ici une connaissance actuelle résultant d’une démarche antérieure.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « en celui-ci » ; autre traduction possible : « en une telle personne ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ λέγων
  choice: Celui qui dit
  rationale: Le participe présent substantivé a une portée générique singulière. Cette formulation est naturelle et digne en français moderne.
- source_word: ὅτι
  choice: « »
  rationale: ὅτι introduit ici le discours direct ; les guillemets rendent cette fonction idiomatiquement en français.
- source_word: Ἔγνωκα
  choice: Je le connais
  rationale: Le présent français exprime naturellement l’état actuel résultant d’une connaissance acquise ; une note signale la valeur aspectuelle possible du parfait grec.
- source_word: αὐτὸν
  choice: le
  rationale: Le pronom objet conserve le référent implicite du contexte sans préciser s’il s’agit de Dieu ou, plus spécifiquement, du Christ.
- source_word: τὰς ἐντολὰς αὐτοῦ
  choice: ses commandements
  rationale: « Commandements » maintient le poids et les résonances johanniques de ἐντολή.
- source_word: μὴ τηρῶν
  choice: ne garde pas
  rationale: Le présent participial décrit une conduite persistante. « Garder » préserve la nuance johannique d’observer et de mettre en pratique, sans la réduire au seul verbe « obéir ».
- source_word: ψεύστης
  choice: un menteur
  rationale: Le nom prédicatif caractérise directement la personne et se traduit sans atténuation.
- source_word: ἐν τούτῳ
  choice: en lui
  rationale: Le démonstratif renvoie le plus naturellement à la personne qui vient d’être décrite ; la note conserve des formulations plus explicites.
- source_word: ἡ ἀλήθεια οὐκ ἔστιν
  choice: la vérité n’est pas
  rationale: La formulation simple conserve à « vérité » sa densité à la fois morale, relationnelle et théologique.
theological_decisions:
- issue: Référent de αὐτόν / αὐτοῦ
  choice: 'Maintien du pronom implicite : « le » / « ses »'
  alternative: Préciser « Dieu » ou « le Christ »
  rationale: Le contexte immédiat oriente vers Dieu, tout en maintenant dans la théologie johannique un lien étroit avec le Fils. La traduction ne tranche pas au-delà du grec.
- issue: Portée du langage johannique de la connaissance
  choice: « Je le connais » avec note aspectuelle
  alternative: « J’ai appris à le connaître » ou « Je suis parvenu à le connaître »
  rationale: Le parfait grec présente une relation actuelle issue d’un processus antérieur. Le présent français est naturel, tandis que la note préserve cette nuance sans surinterpréter la nature de la connaissance.
translation_notes:
  register: Français international moderne, naturel et digne. La structure antithétique est conservée, ainsi que le vocabulaire johannique « connaître », « garder », « commandements » et « vérité ». Les deux marqueurs de note figurent dans le texte principal.
