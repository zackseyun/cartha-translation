id: 1JN.2.22
reference: 1 John 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς ἐστιν ὁ ψεύστης εἰ μὴ ὁ ἀρνούμενος ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός; οὗτός ἐστιν ὁ ἀντίχριστος, ὁ ἀρνούμενος τὸν πατέρα καὶ τὸν υἱόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/022.yaml
  text: 'Who is the liar except the one who denies that Jesus is the Messiah? This is the antichrist: the one who denies the Father and the Son[a][b].'
translation:
  language: fr
  text: 'Qui est le menteur, sinon celui qui nie que Jésus est le Messie[a] ? Celui-là est l’antichrist[b] : celui qui nie le Père et le Fils.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le grec emploie ici ὁ χριστός comme un titre.
    reason: alternative_reading
  - marker: b
    text: Ou « l’Antichrist ». Le grec porte l’article défini, mais, dans les lettres de Jean, ce terme peut caractériser un type d’adversaire qui nie le Père et le Fils, sans désigner nécessairement ici un seul personnage de la fin des temps.
    reason: lexical_alternative
lexical_decisions:
- source_word: ψεύστης
  choice: le menteur
  rationale: L’article grec présente ici la figure caractéristique du menteur dans ce contexte polémique ; le français défini « le menteur » en conserve la force.
- source_word: ἀρνούμενος
  choice: celui qui nie
  rationale: Le participe présent substantivé décrit la personne caractérisée par ce refus ; cette formulation est naturelle et garde cette valeur.
- source_word: ὅτι Ἰησοῦς οὐκ ἔστιν ὁ χριστός
  choice: que Jésus est le Messie
  rationale: Après un verbe de négation, le grec exprime le contenu refusé sous la forme « que Jésus n’est pas le Messie ». En français courant, « nier que Jésus est le Messie » restitue sans ambiguïté ce contenu tout en évitant la tournure plus lourde « nier que Jésus n’est pas ».
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre. « Messie » en communique le sens et le cadre juif mieux que l’emploi quasi nominal de « Christ ».
- source_word: ἀντίχριστος
  choice: l’antichrist
  rationale: Le terme français établi « antichrist » conserve le mot johannique, tandis que l’article défini reflète ὁ sans décider s’il s’agit exclusivement d’un individu eschatologique ou d’un type d’opposant.
- source_word: πατέρα / υἱόν
  choice: le Père / le Fils
  rationale: Les majuscules signalent les désignations relationnelles de Dieu le Père et du Fils dans le contexte johannique.
- source_word: οὗτός ἐστιν
  choice: Celui-là est
  rationale: Le démonstratif renvoie directement à la personne qui vient d’être décrite. « Celui-là » rend ce renvoi personnel plus nettement que le français « Ceci ».
theological_decisions:
- issue: Rendu de Χριστός dans la formule christologique
  choice: Messie
  alternative: Christ
  rationale: Le mot est employé comme titre dans l’affirmation contestée. « Messie » rend le contenu du titre sans le traiter comme un second nom de Jésus.
- issue: Référence de ἀντίχριστος
  choice: l’antichrist
  alternative: un antichrist / l’Antichrist
  rationale: L’article grec est conservé, mais la minuscule évite d’imposer la lecture d’un unique personnage eschatologique. La formulation demeure compatible avec la portée typologique du terme dans les lettres de Jean.
- issue: Forme française du contenu nié
  choice: celui qui nie que Jésus est le Messie
  alternative: celui qui nie que Jésus n’est pas le Messie
  rationale: 'Le grec place la négation dans la proposition citée, mais le français exprime normalement le contenu rejeté après « nier » sans reprendre cette négation. La traduction conserve donc le sens : cette personne refuse l’affirmation selon laquelle Jésus est le Messie.'
translation_notes:
  register: Français international moderne, direct et digne. La question polémique est conservée, ainsi que le parallélisme des deux occurrences de « celui qui nie ». « Celui-là » assure un renvoi personnel clair, et les notes préservent les principales possibilités lexicales et théologiques sans trancher au-delà du grec.
