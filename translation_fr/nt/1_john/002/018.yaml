id: 1JN.2.18
reference: 1 John 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παιδία, ἐσχάτη ὥρα ἐστίν, καὶ καθὼς ἠκούσατε ⸀ὅτι ἀντίχριστος ἔρχεται, καὶ νῦν ἀντίχριστοι πολλοὶ γεγόνασιν· ὅθεν γινώσκομεν ὅτι ἐσχάτη ὥρα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/018.yaml
  text: Children[a], it is the last hour, and just as you heard that antichrist is coming, even now many antichrists have arisen[b]. From this we know that it is the last hour.
translation:
  language: fr
  text: Mes enfants, c’est la dernière heure. Comme vous avez entendu dire que l’antichrist vient, beaucoup d’antichrists sont déjà apparus. Nous savons par là que c’est la dernière heure.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παιδία
  choice: Mes enfants
  rationale: Le vocatif sert ici d’adresse pastorale et affectueuse. « Mes enfants » est naturel en français moderne et exprime le lien familial sans infantiliser les destinataires.
- source_word: ἐσχάτη ὥρα
  choice: la dernière heure
  rationale: Ce calque naturel préserve l’image temporelle et sa portée eschatologique sans la réduire à une heure littérale ni préciser un calendrier.
- source_word: καθὼς ἠκούσατε ὅτι
  choice: Comme vous avez entendu dire que
  rationale: Cette tournure française exprime clairement le contenu de l’enseignement reçu auparavant tout en conservant le rapport introduit par καθὼς.
- source_word: ἀντίχριστος
  choice: l’Antichrist
  rationale: Bien que le nom grec soit sans article, le français exige normalement un déterminant devant ce nom commun et emploie naturellement « l’Antichrist » pour la figure attendue. La note signale l’absence d’article grec afin de ne pas surdéterminer la référence.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent français peut, comme le grec, désigner une venue attendue et conserve une formulation concise.
- source_word: καὶ νῦν
  choice: de même, dès maintenant
  rationale: « Dès maintenant » souligne que la réalité plurielle est déjà présente; « de même » rattache explicitement cette constatation à ce que les lecteurs avaient entendu.
- source_word: ἀντίχριστοι πολλοὶ
  choice: beaucoup d’antichrists
  rationale: Le pluriel du même terme est conservé pour maintenir le lien lexical et la tension entre la figure singulière attendue et ses nombreuses manifestations présentes.
- source_word: γεγόνασιν
  choice: sont apparus
  rationale: Le passé composé rend l’émergence accomplie dont les effets demeurent présents. « Sont apparus » est idiomatique et évite le peu naturel « sont devenus » sans complément.
- source_word: ὅθεν γινώσκομεν
  choice: C’est ainsi que nous savons
  rationale: La formule rend l’inférence fondée sur l’apparition des nombreux antichrists et reste naturelle en français.
theological_decisions:
- issue: Sens de « la dernière heure »
  choice: Conserver l’expression temporelle et eschatologique « la dernière heure » sans l’expliquer dans le corps du texte.
  alternative: Préciser « la dernière période de l’histoire » ou comprendre une heure chronologique strictement imminente.
  rationale: Le contexte lui donne une portée eschatologique, mais la traduction ne doit ni imposer un schéma de la fin des temps ni supprimer la métaphore temporelle.
- issue: Rapport entre l’Antichrist singulier et les nombreux antichrists
  choice: Maintenir la juxtaposition entre la figure singulière attendue et la pluralité déjà présente.
  alternative: Réduire le singulier à une simple catégorie générique, ou expliciter qu’il s’agit nécessairement d’un individu eschatologique précisément défini.
  rationale: Le texte établit délibérément ce contraste sans en fournir ici une systématisation; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Mes enfants » garde le ton pastoral; « l’Antichrist » suit l’usage français tout en accompagnant d’une note l’anarthrie grecque. La répétition de « la dernière heure » et le lien lexical Antichrist/antichrists sont volontairement conservés.
