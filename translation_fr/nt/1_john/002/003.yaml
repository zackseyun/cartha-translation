  text: Καὶ ἐν τούτῳ γινώσκομεν ὅτι ἐγνώκαμεν αὐτόν, ἐὰν τὰς ἐντολὰς αὐτοῦ τηρῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/003.yaml
  text: 'And by this we know that we have come to know him: if we keep his commandments[a].'
translation:
  language: fr
  text: 'Et voici comment nous savons que nous en sommes venus à le connaître : si nous gardons ses commandements[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « que nous l’avons connu » ; le parfait grec a probablement le sens de « que nous en sommes venus à le connaître ».'
    reason: Alternative lexicale et précision sur la valeur du parfait grec.
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: voici comment
  rationale: Cette tournure française naturelle introduit le critère ou le moyen permettant de savoir, tout en conservant la force démonstrative de l’expression johannique.
- source_word: γινώσκομεν
  choice: nous savons
  rationale: Le présent indique ici une connaissance ou une assurance actuelle ; le présent simple français convient naturellement.
- source_word: ὅτι ἐγνώκαμεν αὐτόν
  choice: que nous sommes parvenus à le connaître
  rationale: Le parfait grec peut évoquer l’accès à la connaissance avec un résultat qui demeure. Cette formulation rend cette valeur résultative sans réduire le verbe à un simple état.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom masculin est maintenu sans préciser s’il désigne Dieu ou Christ, conformément à l’ambiguïté du grec et au contexte johannique.
- source_word: ἐὰν
  choice: si
  rationale: Marque conditionnelle directe et idiomatique introduisant le critère qui manifeste cette connaissance.
- source_word: ἐντολάς
  choice: commandements
  rationale: Le terme conserve la portée morale et l’écho biblique de ἐντολή, dans un registre français actuel et digne.
- source_word: τηρῶμεν
  choice: nous gardons
  rationale: « Garder » préserve l’image et le vocabulaire johanniques, tout en exprimant l’observation fidèle et obéissante des commandements.
theological_decisions:
- issue: Référent de αὐτόν (« le »)
  choice: Conserver le pronom sans préciser son référent.
  alternative: Expliciter « Dieu » ou « Jésus-Christ ».
  rationale: Le grec emploie un pronom, et le contexte de 1 Jean associe étroitement la connaissance de Dieu et la relation au Fils. Expliciter le référent résoudrait une tension que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici comment » évite le calque « en ceci » ; « garder ses commandements » maintient le registre biblique et le vocabulaire caractéristique de Jean.
