id: 1JN.2.7
reference: 1 John 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Ἀγαπητοί, οὐκ ἐντολὴν καινὴν γράφω ὑμῖν, ἀλλ’ ἐντολὴν παλαιὰν ἣν εἴχετε ἀπ’ ἀρχῆς· ἡ ἐντολὴ ἡ παλαιά ἐστιν ὁ λόγος ὃν ⸀ἠκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/007.yaml
  text: Beloved[a], I am not writing a new commandment to you, but an old commandment that you have had from the beginning. The old commandment is the message that you heard.
translation:
  language: fr
  text: Bien-aimés, ce n’est pas un commandement nouveau que je vous écris, mais un commandement ancien, que vous avez depuis le commencement. Ce commandement ancien, c’est le message[a] que vous avez entendu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : la parole.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Bien-aimés
  rationale: Ce vocatif pluriel exprime une affection pastorale et conserve le lien lexical avec l’amour, sans préciser un rapport d’amitié absent du grec.
- source_word: ἐντολήν
  choice: commandement
  rationale: Ce terme garde la portée théologique et les échos johanniques de ἐντολή, tout en restant courant en français.
- source_word: καινήν
  choice: nouveau
  rationale: Rend directement l’opposition avec παλαιάν, sans ajouter la nuance interprétative de « renouvelé » ou « inédit ».
- source_word: γράφω
  choice: je vous écris
  rationale: Le présent grec désigne naturellement l’acte d’écrire en cours; la tournure française place le complément en tête pour éviter une formulation lourde.
- source_word: παλαιάν / παλαιά
  choice: ancien
  rationale: En français, « commandement ancien » exprime plus naturellement qu’« vieux commandement » l’antériorité opposée à la nouveauté, sans suggérer qu’il serait périmé.
- source_word: εἴχετε
  choice: vous avez
  rationale: Dans la construction « depuis le commencement », le présent français exprime idiomatiquement une possession commencée dans le passé et toujours valable, ce qui restitue la continuité portée par l’imparfait grec.
- source_word: ἀπ’ ἀρχῆς
  choice: depuis le commencement
  rationale: Cette formulation conserve l’expression johannique et son indétermination, tout en marquant naturellement la continuité temporelle en français.
- source_word: λόγος
  choice: message
  rationale: Dans ce contexte, λόγος désigne le contenu communiqué et entendu. « Message » est immédiatement intelligible; « parole », possible mais plus polysémique, est signalé en note.
- source_word: ἠκούσατε
  choice: vous avez entendu
  rationale: Le passé composé rend naturellement en français actuel l’aoriste indiquant la réception antérieure du message.
theological_decisions:
- issue: Référent de « depuis le commencement »
  choice: L’expression est conservée sans préciser de quel commencement il s’agit.
  alternative: « depuis le début de votre vie chrétienne » ou « depuis le commencement de la proclamation de l’Évangile »
  rationale: Le contexte peut évoquer l’instruction chrétienne initiale des destinataires, mais le texte ne définit pas explicitement ce commencement; la traduction préserve donc l’ampleur et l’ambiguïté johanniques.
- issue: Identification du commandement ancien au message entendu
  choice: 'L’équation est rendue directement : « Ce commandement ancien, c’est le message… »'
  alternative: Développer le rapport entre le commandement et le message à partir des versets voisins.
  rationale: Le grec identifie directement le commandement ancien au λόγος entendu. Aucun élément explicatif extérieur n’est ajouté.
translation_notes:
  register: Français international actuel, simple et digne. « Bien-aimés » maintient la chaleur pastorale; « ancien » évite la connotation péjorative de « vieux ». La structure répétitive du grec est conservée afin de préserver l’insistance de l’auteur.
