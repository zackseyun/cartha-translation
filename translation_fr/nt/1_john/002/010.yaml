id: 1JN.2.10
reference: 1 John 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἀγαπῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῷ φωτὶ μένει, καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/010.yaml
  text: The one who loves his brother remains in the light[a], and there is no cause for stumbling in him.
translation:
  language: fr
  text: Celui qui aime son frère demeure dans la lumière, et il n’y a en lui aucune cause de chute.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il n’y a pour lui aucun obstacle qui le fasse trébucher ». L’expression grecque peut désigner soit ce qui n’est pas présent en lui, soit ce qui ne se dresse pas devant lui.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἀγαπῶν
  choice: Celui qui aime
  rationale: Le participe présent substantivé exprime une réalité générale et continue. « Celui qui aime » est naturel en français moderne et conserve cette valeur.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: son frère
  rationale: Cette traduction respecte le masculin singulier du grec sans expliciter dans le texte principal le sens communautaire possible de ἀδελφός.
- source_word: ἐν τῷ φωτὶ
  choice: dans la lumière
  rationale: La formulation conserve l’image johannique tout en étant idiomatique en français.
- source_word: μένει
  choice: demeure
  rationale: « Demeure » rend la continuité exprimée par μένω et maintient le vocabulaire relationnel caractéristique de Jean, dans un registre digne mais encore courant.
- source_word: σκάνδαλον
  choice: cause de chute
  rationale: Ce choix conserve la métaphore éthique d’un obstacle qui fait trébucher sans suggérer nécessairement un objet matériel.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: La traduction la plus directe rattache le pronom masculin à celui qui aime, tout en laissant ouverte la portée exacte de la proposition.
- source_word: οὐκ ἔστιν
  choice: il n’y a… aucune
  rationale: La tournure existentielle est naturelle en français et rend clairement la négation grecque.
theological_decisions:
- issue: Référent et nuance de καὶ σκάνδαλον ἐν αὐτῷ οὐκ ἔστιν
  choice: Il n’y a en celui qui aime aucune cause de chute.
  alternative: Il n’y a pour lui aucun obstacle qui le fasse trébucher; ou rien en lui ne fait trébucher autrui.
  rationale: La construction grecque permet de comprendre ἐν αὐτῷ comme désignant ce qui n’est pas présent en lui ou, avec une nuance différente, ce qui ne se trouve pas sur son chemin. Le texte principal suit la syntaxe la plus directe sans préciser qui risquerait de chuter; la note préserve l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. « Demeure » préserve le motif johannique de la permanence; « cause de chute » garde la métaphore sans en fixer excessivement l’interprétation.
