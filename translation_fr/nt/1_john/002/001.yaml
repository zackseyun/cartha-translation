id: 1JN.2.1
reference: 1 John 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τεκνία μου, ταῦτα γράφω ὑμῖν ἵνα μὴ ἁμάρτητε. καὶ ἐάν τις ἁμάρτῃ, παράκλητον ἔχομεν πρὸς τὸν πατέρα Ἰησοῦν Χριστὸν δίκαιον,
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/001.yaml
  text: My little children[a], I write these things to you so that you may not sin. But if anyone does sin[b], we have an advocate with the Father—Jesus the Messiah the Righteous One.
translation:
  language: fr
  text: 'Mes petits enfants, je vous écris cela afin que vous ne péchiez pas. Mais si quelqu’un pèche, nous avons un défenseur[a] auprès du Père : Jésus le Messie[b], le Juste.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec παράκλητος peut aussi désigner un avocat, un soutien, un conseiller ou un consolateur.
    reason: lexical_alternative
  - marker: b
    text: 'Traduction traditionnelle : « Jésus-Christ ». Le titre grec Χριστός signifie « Messie », mais peut aussi fonctionner comme le nom « Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τεκνία μου
  choice: Mes petits enfants
  rationale: Cette adresse conserve à la fois la métaphore familiale, le possessif et la tendresse du diminutif grec, dans un français digne et compréhensible.
- source_word: ταῦτα γράφω ὑμῖν
  choice: je vous écris cela
  rationale: Le présent « je vous écris » convient naturellement au contexte épistolaire. Le singulier collectif « cela » rend ταῦτα de manière idiomatique sans en préciser excessivement le référent.
- source_word: ἵνα μὴ ἁμάρτητε
  choice: afin que vous ne péchiez pas
  rationale: Cette formulation exprime clairement le but marqué par ἵνα avec le subjonctif, sans transformer la proposition en affirmation d’une perfection déjà atteinte.
- source_word: καὶ ἐάν τις ἁμάρτῃ
  choice: Mais si quelqu’un vient à pécher
  rationale: Dans ce contexte, καί introduit un contraste avec le but qui précède. « Vient à pécher » présente naturellement en français l’éventualité exprimée par ἐάν avec le subjonctif.
- source_word: παράκλητον
  choice: un défenseur
  rationale: Dans le cadre d’une relation auprès du Père, « défenseur » exprime bien la fonction représentative et intercessoire du παράκλητος, tout en laissant sa gamme sémantique plus large en note.
- source_word: πρὸς τὸν πατέρα
  choice: auprès du Père
  rationale: « Auprès du Père » rend la présence orientée et la proximité relationnelle exprimées par πρός avec l’accusatif.
- source_word: Ἰησοῦν Χριστὸν
  choice: Jésus le Messie
  rationale: Χριστός est ici rendu comme un titre messianique apposé à Jésus. L’article français est requis pour une expression naturelle du titre.
- source_word: δίκαιον
  choice: le Juste
  rationale: L’adjectif substantivé en apposition est rendu par « le Juste », formulation française concise qui conserve sa force christologique.
theological_decisions:
- issue: Portée de παράκλητος appliqué à Jésus
  choice: un défenseur
  alternative: un avocat, un soutien, un consolateur
  rationale: Le contexte auprès du Père favorise une fonction de défense et d’intercession, mais la note préserve l’étendue sémantique du terme sans imposer une image exclusivement judiciaire.
- issue: Valeur de Χριστός dans l’expression Ἰησοῦν Χριστόν
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: La traduction principale explicite le titre messianique, tandis que la forme traditionnelle, où « Christ » peut fonctionner presque comme un nom, est signalée en note.
- issue: Tension entre l’appel à ne pas pécher et l’éventualité du péché
  choice: Conserver successivement le but (« afin que vous ne péchiez pas ») et l’éventualité (« si quelqu’un vient à pécher »)
  alternative: Formulation suggérant soit une perfection sans péché déjà réalisée, soit le caractère inévitable du péché
  rationale: Le grec juxtapose une exhortation réelle et la possibilité d’un manquement. La traduction maintient cette tension sans la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, naturel et digne. « Mes petits enfants » garde la tendresse pastorale de l’adresse; « vient à pécher » exprime une éventualité sans lourdeur; les deux notes rendent visibles les principales possibilités lexicales et traditionnelles.
