id: 1JN.2.14
reference: 1 John 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἔγραψα ὑμῖν, παιδία, ὅτι ἐγνώκατε τὸν πατέρα· ἔγραψα ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· ἔγραψα ὑμῖν, νεανίσκοι, ὅτι ἰσχυροί ἐστε καὶ ὁ λόγος τοῦ θεοῦ ἐν ὑμῖν μένει καὶ νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/014.yaml
  text: I have written to you[a], children, because you have known the Father. I have written to you, fathers, because you have known him who is from the beginning. I have written to you, young men, because you are strong, and the word of God remains in you[c][b], and you have overcome the evil one.
translation:
  language: fr
  text: Je vous ai écrit[a], enfants, parce que vous avez connu le Père. Je vous ai écrit, pères, parce que vous avez connu celui qui est dès le commencement[b]. Je vous ai écrit, jeunes hommes, parce que vous êtes forts, que la parole de Dieu demeure en vous[c] et que vous avez vaincu le Malin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je vous écrivis », ici et dans tout le verset. L’aoriste grec peut se traduire par un passé simple, mais le passé composé convient mieux au contexte épistolaire et à la portée présente de l’écrit.'
    reason: lexical_alternative
  - marker: b
    text: « Celui qui est dès le commencement » désigne probablement le Fils préexistant dans l’usage johannique, bien que le texte ne nomme pas explicitement le référent.
    reason: alternative_reading
  - marker: c
    text: 'Ou : « reste en vous ». Le verbe grec exprime une présence durable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψα
  choice: Je vous ai écrit
  rationale: Le passé composé rend naturellement en français l’aoriste épistolaire comme un acte accompli dont l’écrit demeure pertinent pour les destinataires, tout en conservant l’anaphore du verset.
- source_word: παιδία
  choice: enfants
  rationale: Ce vocatif conserve la métaphore familiale sans ajouter explicitement l’affection de « chers » ni insister sur le jeune âge avec « petits enfants ».
- source_word: ἐγνώκατε
  choice: vous avez connu
  rationale: Le passé composé reflète le parfait grec, qui présente une connaissance acquise et toujours effective, sans la réduire au simple présent « vous connaissez ».
- source_word: τὸν πατέρα
  choice: le Père
  rationale: Dans l’usage johannique, il s’agit d’un titre divin désignant Dieu ; la majuscule en français marque cet emploi titulaire.
- source_word: πατέρες
  choice: pères
  rationale: Le terme direct préserve le vocatif masculin et la structure rhétorique des trois groupes, sans le réduire à une simple catégorie d’âge.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: celui qui est dès le commencement
  rationale: Cette formulation conserve le référent personnel implicite et la valeur présente de la tournure grecque, sans identifier dans le texte celui que le grec ne nomme pas.
- source_word: νεανίσκοι
  choice: jeunes hommes
  rationale: Cette traduction directe respecte le masculin pluriel et maintient le contraste avec « pères » et « enfants ».
- source_word: ἰσχυροί
  choice: forts
  rationale: « Forts » est l’équivalent français naturel dans ce contexte de vigueur spirituelle.
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: 'La formulation biblique usuelle laisse ouverte la portée exacte : message de Dieu en général ou proclamation de l’Évangile.'
- source_word: μένει
  choice: demeure
  rationale: « Demeure » restitue la continuité exprimée par μένω et son importance dans le vocabulaire johannique, dans un registre digne mais courant.
- source_word: νενικήκατε
  choice: vous avez vaincu
  rationale: Le passé composé exprime une victoire accomplie dont les effets subsistent, conformément au parfait grec.
- source_word: τὸν πονηρόν
  choice: le Mauvais
  rationale: L’article et la forme masculine indiquent ici un adversaire personnel plutôt que le mal abstrait ; « le Mauvais » conserve cette personnification sans ajouter le nom « Satan ».
theological_decisions:
- issue: Référent de « celui qui est dès le commencement »
  choice: Le référent reste implicite dans la traduction.
  alternative: L’identifier explicitement au Christ ou au Fils, ou le comprendre plus généralement comme Dieu.
  rationale: L’usage johannique suggère fortement le Fils préexistant, mais le grec ne le nomme pas dans ce verset. La traduction préserve donc cette réserve et la tension théologique du texte.
- issue: Genre des groupes interpellés
  choice: Traduire παιδία par « enfants » et les masculins πατέρες et νεανίσκοι par « pères » et « jeunes hommes ».
  alternative: Neutraliser les trois termes comme des catégories spirituelles inclusives ou des groupes d’âge génériques.
  rationale: Le grec emploie un terme non marqué ici comme masculin pour le premier groupe, puis deux vocatifs masculins. La traduction conserve cette configuration au lieu de l’aplanir.
- issue: Caractère personnel de τὸν πονηρόν
  choice: Traduire par « le Mauvais », compris comme un adversaire personnel.
  alternative: Traduire par « le mal », en donnant au terme une valeur abstraite.
  rationale: La construction grecque au masculin avec article favorise nettement le sens personnel, tout en évitant d’introduire un nom propre absent du texte.
translation_notes:
  register: Français international moderne, naturel et digne. L’anaphore « Je vous ai écrit » et les trois vocatifs sont conservés. « Demeure » maintient le motif johannique tout en restant compréhensible ; « le Mauvais » marque le référent personnel sans explicitation doctrinale supplémentaire.
