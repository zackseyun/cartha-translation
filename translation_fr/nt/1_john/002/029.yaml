id: 1JN.2.29
reference: 1 John 2:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν εἰδῆτε ὅτι δίκαιός ἐστιν, γινώσκετε ⸀ὅτι πᾶς ὁ ποιῶν τὴν δικαιοσύνην ἐξ αὐτοῦ γεγέννηται.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/029.yaml
  text: If you know that he is righteous[b][a], you know that everyone who practices righteousness has been born of him.
translation:
  language: fr
  text: Si vous savez qu’il est juste[a], vous savez que toute personne qui pratique la justice est née de lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « il » peut désigner Dieu le Père ou le Fils; le grec ne précise pas explicitement son référent ici.
    reason: alternative_reading
  - marker: b
    text: 'Ou « vient de lui ». La forme grecque peut aussi se traduire ainsi. Le verbe « savez » peut également être compris comme un impératif: « sachez » ou « reconnaissez ».'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: ἐὰν εἰδῆτε
  choice: Si vous savez
  rationale: La tournure conditionnelle est rendue naturellement en français, sans affaiblir la valeur cognitive de οἶδα.
- source_word: δίκαιός
  choice: juste
  rationale: « Juste » exprime ici la rectitude morale et conserve le lien lexical avec « justice ».
- source_word: γινώσκετε
  choice: vous savez
  rationale: La forme est comprise comme un indicatif. La répétition de « savez » reproduit le parallélisme, même si le grec emploie deux verbes différents.
- source_word: πᾶς ὁ ποιῶν
  choice: toute personne qui pratique
  rationale: Cette formulation inclusive et naturelle fait ressortir le caractère habituel de l’action exprimée par le participe présent.
- source_word: τὴν δικαιοσύνην
  choice: la justice
  rationale: Dans ce contexte, « justice » désigne une conduite droite conforme au caractère de Dieu et répond directement à l’adjectif « juste ».
- source_word: ἐξ αὐτοῦ
  choice: de lui
  rationale: « Être né de lui » est naturel en français biblique moderne et conserve l’image de l’origine ou de la filiation; « venir de lui » reste une possibilité de traduction.
- source_word: γεγέννηται
  choice: est née
  rationale: Le parfait passif présente une naissance accomplie dont l’effet demeure. Le passé composé français rend naturellement cet état résultant.
theological_decisions:
- issue: Référent de αὐτός dans « il est juste » et « de lui »
  choice: Conserver les pronoms « il » et « lui » sans nommer leur référent.
  alternative: Préciser « Dieu le Père » ou « le Fils ».
  rationale: Le contexte permet de discuter le référent, mais le verset ne le précise pas explicitement. La traduction préserve donc cette ambiguïté théologique.
- issue: Valeur de γινώσκετε
  choice: 'Le comprendre comme un indicatif: « vous savez ».'
  alternative: 'Le comprendre comme un impératif: « sachez » ou « reconnaissez ».'
  rationale: La forme grecque peut être morphologiquement indicative ou impérative. Dans le parallélisme avec la proposition conditionnelle, l’indicatif offre une lecture fluide, tandis que l’autre analyse est signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. « Toute personne » évite un masculin générique marqué tout en restant fidèle à πᾶς ὁ ποιῶν. Le rapport lexical entre « juste » et « justice » est maintenu.
