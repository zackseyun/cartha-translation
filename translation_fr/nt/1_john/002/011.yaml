reference: 1 John 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ μισῶν τὸν ἀδελφὸν αὐτοῦ ἐν τῇ σκοτίᾳ ἐστὶν καὶ ἐν τῇ σκοτίᾳ περιπατεῖ, καὶ οὐκ οἶδεν ποῦ ὑπάγει, ὅτι ἡ σκοτία ἐτύφλωσεν τοὺς ὀφθαλμοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/011.yaml
  text: But the one who hates his brother is in the darkness and walks in the darkness[a], and does not know where he is going, because the darkness has blinded his eyes.
translation:
  language: fr
  text: Mais celui qui hait son frère[a] est dans les ténèbres et marche dans les ténèbres ; il ne sait pas où il va, parce que les ténèbres ont aveuglé ses yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son frère ou sa sœur » ; le grec dit « frère » et désigne probablement ici un autre croyant au sein de la communauté chrétienne.
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: celui qui déteste
  rationale: Le participe présent substantivé décrit une attitude caractéristique. « Celui qui déteste » est naturel en français et conserve cette portée.
- source_word: ἀδελφὸν
  choice: son frère
  rationale: Le grec emploie le masculin singulier. Dans ce contexte johannique, le terme désigne probablement un membre de la communauté croyante ; le texte principal conserve la forme de la source, avec une précision en note.
- source_word: ἐν τῇ σκοτίᾳ
  choice: dans les ténèbres
  rationale: L’article et la répétition sont conservés. « Les ténèbres » maintient l’image johannique d’une sphère morale et spirituelle opposée à la lumière.
- source_word: περιπατεῖ
  choice: marche
  rationale: « Marche » préserve la métaphore biblique de la conduite, sans la réduire à l’explication « vit » ou « se conduit ».
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: il ne sait pas où il va
  rationale: Formulation française actuelle et naturelle qui conserve l’image du déplacement.
- source_word: ἐτύφλωσεν
  choice: ont aveuglé
  rationale: Le passé composé rend l’action accomplie de l’aoriste ainsi que son effet toujours perceptible dans le contexte.
- source_word: τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: ses yeux
  rationale: Expression possessive idiomatique en français, qui conserve l’image concrète des yeux.
theological_decisions:
- issue: Sens moral et spirituel des ténèbres dans le dualisme johannique
  choice: Rendre σκοτία littéralement par « les ténèbres ».
  alternative: « le mal » ou « les ténèbres du péché »
  rationale: La métaphore garde toute sa profondeur et son opposition implicite à la lumière, sans imposer une explication doctrinale plus étroite.
- issue: Référent de « frère »
  choice: Conserver « son frère » dans le texte principal, avec une note sur sa portée probable.
  alternative: « son frère ou sa sœur » ou « un autre croyant »
  rationale: Le grec est au masculin singulier, tout en pouvant avoir une portée représentative dans la communauté chrétienne. La note clarifie cette portée sans neutraliser la forme de la source.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « dans les ténèbres » et la métaphore « marche » sont volontairement maintenues pour préserver le style et l’imagerie de Jean.
