review_pass:
  verdict: revise
  source_fidelity: La dernière proposition grecque, οὐκ εἰσὶν πάντες ἐξ ἡμῶν, signifie « ils ne sont pas tous des nôtres » (ou, plus littéralement, « tous ne sont pas des nôtres »). Le texte proposé « aucun d’eux n’est des nôtres » élimine sans nécessité cette portée partielle et renforce indûment l’énoncé. Le reste rend fidèlement le départ de la communauté, l’appartenance exprimée par ἐξ ἡμῶν et l’irréel du passé.
  naturalness: « Ils sont sortis du milieu de nous » et « des nôtres » sont naturels en français moderne. Pour la finale, « afin qu’il apparaisse » est plus idiomatique que « afin qu’il soit manifeste », tout en exprimant la mise en évidence visée par le passif grec.
  terminology: « Des nôtres » préserve avec justesse le langage relationnel du texte sans imposer une définition doctrinale de l’appartenance. « Restés avec nous » conserve convenablement la résonance de μένω.
  issues:
  - severity: high
    issue: La traduction principale rend οὐκ εἰσὶν πάντες ἐξ ἡμῶν par « aucun d’eux n’est des nôtres ».
    rationale: Cette formulation transforme « ils ne sont pas tous des nôtres » en une négation universelle. Même si le contexte oppose les dissidents au groupe, la formulation grecque ne doit pas être résolue ainsi dans le texte principal; la note ne compense pas ce renforcement.
  - severity: low
    issue: La note regroupe deux alternatives distinctes sous un seul ancrage final.
    rationale: Une note unique peut utilement signaler l’alternative de φανερωθῶσιν, mais elle ne doit pas présenter comme simple variante une correction nécessaire de la portée de la négation dans le texte principal.
  revised_text: Ils sont sortis du milieu de nous, mais ils n’étaient pas des nôtres. Car s’ils avaient été des nôtres, ils seraient restés avec nous. Mais c’est afin qu’il apparaisse[a] qu’ils ne sont pas tous des nôtres.
  revised_footnotes:
  - marker: a
    text: 'Ou : « afin qu’ils soient révélés » ou « manifestés ».'
    reason: lexical_alternative
  revision_rationale: La révision rétablit la portée non universelle de οὐκ…πάντες (« ils ne sont pas tous ») et conserve l’ambiguïté que le grec ne tranche pas davantage. « Afin qu’il apparaisse » rend naturellement en français la fonction de mise en évidence de φανερωθῶσιν; la note signale la formulation plus personnelle et plus littérale du passif grec.
