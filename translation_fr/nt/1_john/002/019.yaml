source:
  edition: SBLGNT
  text: ἐξ ἡμῶν ἐξῆλθαν, ἀλλ’ οὐκ ἦσαν ἐξ ἡμῶν· εἰ γὰρ ⸂ἐξ ἡμῶν ἦσαν⸃, μεμενήκεισαν ἂν μεθ’ ἡμῶν· ἀλλ’ ἵνα φανερωθῶσιν ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/019.yaml
  text: They went out from us[a], but they were not of us; for if they had been of us, they would have remained with us[b]. But this happened so that it might be made clear that not all are of us.
translation:
  language: fr
  text: Ils sont sortis du milieu de nous, mais ils n’étaient pas des nôtres. Car s’ils avaient été des nôtres, ils seraient restés avec nous. Mais c’est afin qu’il apparaisse[a] qu’ils ne sont pas tous des nôtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin qu’ils soient révélés » ou « manifestés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἡμῶν
  choice: du milieu de nous / des nôtres
  rationale: La première occurrence décrit concrètement le départ hors de la communauté, tandis que les suivantes expriment l’appartenance. Cette variation rend en français les deux valeurs contextuelles de la même expression grecque.
- source_word: ἐξῆλθαν
  choice: sont sortis
  rationale: Cette formulation conserve l’image concrète du mouvement sans intégrer au verbe une interprétation telle que « apostasié ».
- source_word: οὐκ ἦσαν ἐξ ἡμῶν
  choice: ils n’étaient pas des nôtres
  rationale: « Des nôtres » exprime naturellement l’appartenance en français tout en évitant de préciser selon quelles catégories théologiques cette appartenance doit être comprise.
- source_word: μεμενήκεισαν ἂν μεθ’ ἡμῶν
  choice: ils seraient restés avec nous
  rationale: Le conditionnel passé rend l’irréel du passé; « rester » conserve le sens johannique de μένω dans une langue courante et digne.
- source_word: ἀλλ’ ἵνα φανερωθῶσιν
  choice: Mais cela est arrivé afin qu’il soit manifeste
  rationale: « Cela est arrivé » explicite sobrement l’événement sous-entendu après ἀλλά; « manifeste » conserve la valeur passive de révélation ou de mise en évidence.
- source_word: ὅτι οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: qu’aucun d’eux n’est des nôtres
  rationale: Dans ce contexte, οὐ…πάντες peut signifier « ils ne sont pas tous », avec une ambiguïté de portée, ou idiomatiquement « aucun d’eux ». Le texte principal retient la lecture contextuellement forte, tandis que la note préserve la formulation plus strictement distributive.
theological_decisions:
- issue: Nature de l’appartenance exprimée par ἐξ ἡμῶν
  choice: Conserver le langage relationnel « des nôtres »
  alternative: « Ils n’étaient jamais de vrais croyants » ou « ils n’appartenaient pas réellement à l’Église »
  rationale: Le grec distingue le départ visible de l’appartenance réelle sans définir celle-ci au moyen de catégories systématiques ultérieures. « Des nôtres » préserve cette tension.
- issue: Portée de la négation dans οὐκ εἰσὶν πάντες ἐξ ἡμῶν
  choice: « aucun d’eux n’est des nôtres » dans le texte, avec l’alternative en note
  alternative: « ils ne sont pas tous des nôtres »
  rationale: La construction οὐ…πάντες est formellement susceptible d’une lecture « pas tous », mais le raisonnement précédent peut soutenir la lecture idiomatique « aucun ». La note évite de supprimer l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Des nôtres » rend l’appartenance sans jargon confessionnel; la répétition structurelle du grec est conservée autant que le permet l’usage français.
