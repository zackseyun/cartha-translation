revisions:
- from: Ils sont sortis du milieu de nous, mais ils n’étaient pas des nôtres. Car s’ils avaient été des nôtres, ils seraient restés avec nous. Mais cela est arrivé afin qu’il soit manifeste qu’aucun d’eux n’est des nôtres.[a]
  to: Ils sont sortis du milieu de nous, mais ils n’étaient pas des nôtres. Car s’ils avaient été des nôtres, ils seraient restés avec nous. Mais c’est afin qu’il apparaisse[a] qu’ils ne sont pas tous des nôtres.
  rationale: La révision rétablit la portée non universelle de οὐκ…πάντες (« ils ne sont pas tous ») et conserve l’ambiguïté que le grec ne tranche pas davantage. « Afin qu’il apparaisse » rend naturellement en français la fonction de mise en évidence de φανερωθῶσιν; la note signale la formulation plus personnelle et plus littérale du passif grec.
  reviewer_model: gpt-5.6-terra
