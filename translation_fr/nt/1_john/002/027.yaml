revisions:
- from: Quant à vous, l’onction que vous avez reçue de lui demeure en vous, et vous n’avez pas besoin que quelqu’un vous enseigne. Mais puisque son onction vous enseigne toutes choses, qu’elle est vraie et n’est pas un mensonge, demeurez en lui comme elle vous l’a enseigné.[a][b]
  to: Quant à vous, l’onction que vous avez reçue de lui demeure en vous, et vous n’avez pas besoin que quelqu’un vous enseigne. Mais, comme son onction vous enseigne sur tout, qu’elle est vraie et n’est pas un mensonge, demeurez en lui, comme elle vous l’a enseigné.[a][b]
  rationale: La révision remplace « puisque » par « comme » afin de préserver la valeur comparative de ὡς et la progression argumentative du grec. Elle conserve l’onction comme métaphore non explicitée, l’affirmation non atténuée concernant l’enseignement, et l’impératif « demeurez » du texte SBLGNT. Les notes restent correctement ancrées à la clausule finale et rendent compte de la variante et de la répétition de μένω.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:45:48Z'
review_pass:
  verdict: revise
  source_fidelity: La proposition « puisque son onction » rend de façon trop causale le grec ἀλλ’ ὡς (« mais comme/de même que »), qui introduit une comparaison et non une cause. Le reste rend fidèlement les pronoms, la répétition de μένω, l’impératif final du texte SBLGNT et l’opposition entre vérité et mensonge.
  naturalness: Le français est globalement naturel et d’un registre biblique moderne. « Mais, comme ... » restitue mieux l’articulation grecque que « Mais puisque ... ». « vous enseigne sur tout » est idiomatique et conserve l’ampleur de περὶ πάντων.
  terminology: « Onction », « demeure/demeurez », « enseigne » et « en lui » sont cohérents avec les choix lexicaux et ne surinterprètent pas les référents.
  issues:
  - severity: medium
    issue: « puisque » traduit ὡς de manière causale
    rationale: Dans « ἀλλ’ ὡς τὸ αὐτοῦ χρῖσμα διδάσκει », ὡς signifie « comme/de même que », non « puisque ». La causalité ajoutée modifie le lien logique avec l’exhortation finale.
  revised_text: Quant à vous, l’onction que vous avez reçue de lui demeure en vous, et vous n’avez pas besoin que quelqu’un vous enseigne. Mais, comme son onction vous enseigne sur tout, qu’elle est vraie et n’est pas un mensonge, demeurez en lui, comme elle vous l’a enseigné.[a][b]
