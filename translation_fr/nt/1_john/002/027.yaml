id: 1JN.2.27
reference: 1 John 2:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς τὸ χρῖσμα ὃ ἐλάβετε ἀπ’ αὐτοῦ ⸂μένει ἐν ὑμῖν⸃, καὶ οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς· ἀλλ’ ὡς τὸ ⸀αὐτοῦ χρῖσμα διδάσκει ὑμᾶς περὶ πάντων, καὶ ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος, καὶ καθὼς ἐδίδαξεν ὑμᾶς, ⸀μένετε ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/027.yaml
  text: And as for you[a], the anointing that you received from him remains in you, and you have no need that anyone should teach you. But as his anointing teaches you about all things, and is true and is not a lie, and just as it taught you[b], remain in him.
translation:
  language: fr
  text: Quant à vous, l’onction que vous avez reçue de lui demeure en vous, et vous n’avez pas besoin que quelqu’un vous enseigne. Mais, comme son onction vous enseigne sur tout, qu’elle est vraie et n’est pas un mensonge, demeurez en lui, comme elle vous l’a enseigné.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits permettent de lire : « et, comme elle vous l’a enseigné, vous demeurez en lui ».'
    reason: textual_variant
  - marker: b
    text: Le même verbe grec est rendu par « demeure » et « demeurez » dans ce verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῖσμα
  choice: onction
  rationale: « Onction » conserve la métaphore johannique sans l’expliciter comme « Saint-Esprit » ni la réduire à l’huile matérielle.
- source_word: ἀπ’ αὐτοῦ
  choice: de lui
  rationale: Le pronom renvoie au contexte antérieur; le conserver évite de préciser dans le verset une identité que le grec ne répète pas.
- source_word: μένει ἐν ὑμῖν / μένετε ἐν αὐτῷ
  choice: demeure en vous / demeurez en lui
  rationale: « Demeurer » est naturel dans un registre biblique moderne et permet de préserver la répétition du même verbe grec μένω.
- source_word: οὐ χρείαν ἔχετε ἵνα τις διδάσκῃ ὑμᾶς
  choice: vous n’avez pas besoin que quelqu’un vous enseigne
  rationale: Cette formulation suit étroitement le grec sans atténuer ni absolutiser l’affirmation.
- source_word: διδάσκῃ / διδάσκει / ἐδίδαξεν
  choice: enseigne / enseigne / a enseigné
  rationale: La répétition du même verbe français conserve la cohésion rhétorique du texte.
- source_word: περὶ πάντων
  choice: toutes choses
  rationale: Cette expression conserve l’ampleur de πάντων sans en limiter interprétativement la portée.
- source_word: ἀληθές ἐστιν καὶ οὐκ ἔστιν ψεῦδος
  choice: elle est vraie et n’est pas un mensonge
  rationale: Le féminin renvoie grammaticalement à « onction » et maintient l’antithèse vigoureuse entre vérité et mensonge.
- source_word: καθὼς ἐδίδαξεν ὑμᾶς
  choice: comme elle vous l’a enseigné
  rationale: « Comme » rend καθὼς; le pronom « l’ » exprime naturellement en français le contenu implicite de l’enseignement sans le définir.
theological_decisions:
- issue: Référent de l’onction (χρῖσμα)
  choice: Conserver « l’onction » sans l’identifier explicitement dans le texte principal.
  alternative: Le Saint-Esprit; le message ou l’Évangile reçu.
  rationale: Le contexte peut évoquer l’Esprit et son œuvre d’enseignement, mais le verset emploie lui-même la métaphore de l’onction; la traduction ne doit pas trancher davantage.
- issue: Portée de « vous n’avez pas besoin que quelqu’un vous enseigne »
  choice: Conserver l’affirmation sans l’adoucir ni l’absolutiser.
  alternative: Négation absolue de tout enseignement humain; rejet contextuel des seuls enseignants dissidents.
  rationale: La traduction laisse le contexte déterminer la portée de cette déclaration et n’en fait pas une thèse doctrinale plus précise que le grec.
- issue: Valeur du dernier μένετε
  choice: 'Impératif : « demeurez en lui ».'
  alternative: 'Indicatif : « vous demeurez en lui ».'
  rationale: Dans le texte principal du SBLGNT, μένετε se comprend naturellement comme un impératif dans ce contexte; la lecture indicative attestée par une variante est signalée en note.
- issue: Référent du pronom final αὐτῷ
  choice: « en lui »
  alternative: « en elle », c’est-à-dire dans l’onction.
  rationale: Le pronom grec est masculin et renvoie vraisemblablement à une personne mentionnée dans le contexte; « lui » préserve cette donnée sans expliciter davantage le référent.
translation_notes:
  register: Français international moderne, clair et digne. « Quant à vous » marque l’emphase de καὶ ὑμεῖς; « onction » préserve le terme théologique traditionnel tout en restant intelligible. La syntaxe finale a été légèrement réordonnée pour être naturelle en français, sans modifier le rapport entre l’enseignement reçu et l’exhortation à demeurer.
