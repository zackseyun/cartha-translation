  text: Ταῦτα ἔγραψα ὑμῖν περὶ τῶν πλανώντων ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/026.yaml
  text: I have written these things to you concerning those who are leading you astray[a].
translation:
  language: fr
  text: Je vous ai écrit ces choses au sujet de ceux qui vous égarent[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui vous trompent » ou « ceux qui vous induisent en erreur ». Le participe grec désigne ceux dont l’action consiste à vous égarer; il ne précise pas si cette action réussit.
    reason: alternative lexicale et absence de précision quant au résultat de l’action
lexical_decisions:
- source_word: Ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie naturellement à ce que l’auteur vient d’écrire.
- source_word: ἔγραψα ὑμῖν
  choice: je vous ai écrit
  rationale: Le passé composé rend naturellement en français actuel l’acte d’écrire accompli dont le contenu demeure pertinent pour les destinataires.
- source_word: περὶ
  choice: au sujet de
  rationale: Cette expression introduit clairement et dignement le thème dont traite l’auteur.
- source_word: τῶν πλανώντων ὑμᾶς
  choice: ceux qui cherchent à vous égarer
  rationale: Le verbe πλανάω évoque le fait de détourner quelqu’un de la vérité. « Égarer » conserve cette image, tandis que « cherchent à » évite d’affirmer que leur entreprise a déjà réussi.
theological_decisions:
- issue: L’action des adversaires a-t-elle effectivement égaré les lecteurs, ou vise-t-elle à les égarer ?
  choice: ceux qui cherchent à vous égarer
  alternative: ceux qui vous égarent ; ceux qui vous trompent
  rationale: Le participe présent désigne les adversaires par l’action qu’ils exercent envers les lecteurs, sans préciser sans ambiguïté si elle a atteint son but. La traduction retenue convient au caractère pastoral de l’avertissement sans présumer leur réussite ; la note conserve les autres lectures possibles.
translation_notes:
  register: Français international moderne, clair et digne. « Ces choses » conserve le pluriel grec et le renvoi au contexte précédent ; « au sujet de » reste naturel sans être familier.
