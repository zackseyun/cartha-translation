    issue: « cherchent à vous égarer » introduit une nuance d’intention ou de tentative non explicitée par le grec.
    rationale: τῶν πλανώντων ὑμᾶς signifie littéralement « de ceux qui vous égarent / trompent ». Le présent participe décrit leur activité; il ne dit ni que les lecteurs ont effectivement été égarés ni que les adversaires ne font que tenter de l’être. La traduction directe préserve cette absence de précision.
  - severity: low
