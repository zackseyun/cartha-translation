  naturalness: « Je vous ai écrit ces choses au sujet de ceux qui vous égarent » est naturel, clair et d’un registre moderne et digne. « Au sujet de » convient ici.
  terminology: « Égarer » conserve bien la portée de πλανάω. La note peut proposer « trompent » et « induisent en erreur » sans transformer le sens principal en tentative explicite.
  issues:
