reference: 1 John 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς χρῖσμα ἔχετε ἀπὸ τοῦ ἁγίου ⸀καὶ οἴδατε ⸀πάντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/020.yaml
  text: But you have an anointing from the Holy One[a], and you all know.
translation:
  language: fr
  text: Mais vous, vous avez une onction de la part du Saint[a], et vous savez tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon une autre leçon du texte grec : « et vous savez toutes choses ». Le texte du SBLGNT porte : « et vous savez tous ».'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Mais
  rationale: Dans ce contexte, καί marque le contraste avec les antichrists mentionnés au verset précédent; « Mais » rend naturellement cette opposition en français.
- source_word: ὑμεῖς
  choice: vous, vous
  rationale: Le pronom grec explicite est emphatique. La dislocation « vous, vous » exprime clairement et naturellement ce contraste en français.
- source_word: χρῖσμα ἔχετε
  choice: vous avez reçu l’onction
  rationale: « L’onction » conserve la métaphore de χρῖσμα. Avec ce nom d’action, « avez reçu » rend en français naturel la possession d’une onction venant du Saint, sans préciser qu’il s’agit de l’Esprit.
- source_word: ἀπὸ τοῦ ἁγίου
  choice: de la part du Saint
  rationale: Cette formulation conserve le titre substantivé et l’origine exprimée par ἀπό, sans déterminer si « le Saint » désigne le Père ou le Fils.
- source_word: καὶ
  choice: et
  rationale: Le second καί relie simplement les deux propositions.
- source_word: οἴδατε
  choice: vous savez
  rationale: « Savoir » est l’équivalent direct et idiomatique de οἶδα dans ce contexte.
- source_word: πάντες
  choice: tous
  rationale: 'Dans le texte du SBLGNT, πάντες est nominatif masculin pluriel et se rapporte au sujet: « vous savez tous », non « vous savez toutes choses ».'
theological_decisions:
- issue: Référent du « Saint »
  choice: Le titre « le Saint » est conservé sans préciser son référent.
  alternative: « Dieu, le Saint » ou « Jésus, le Saint »
  rationale: Le grec ne détermine pas explicitement ici si le titre désigne le Père ou le Fils; la traduction préserve cette ambiguïté réelle.
- issue: Sens de χρῖσμα
  choice: La métaphore est rendue par « l’onction ».
  alternative: « le Saint-Esprit » ou « l’action de l’Esprit »
  rationale: Même si l’onction peut désigner l’Esprit ou son œuvre, le texte emploie χρῖσμα; l’expliciter dans le corps du verset résoudrait une question interprétative.
- issue: Portée de πάντες
  choice: « vous savez tous »
  alternative: « vous savez toutes choses »
  rationale: Le texte principal du SBLGNT porte πάντες, qui qualifie les destinataires. Une variante porte πάνTa et donne le sens « toutes choses ».
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « vous, vous » marque l’emphase du pronom grec et le contraste discursif. Le vocabulaire théologique traditionnel « onction » est conservé parce qu’il reste compréhensible et préserve la métaphore originale.
