source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἐπαγγελία ἣν αὐτὸς ἐπηγγείλατο ἡμῖν, τὴν ζωὴν τὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/025.yaml
  text: 'And this is the promise that he himself promised us: eternal life[a][b].'
translation:
  language: fr
  text: 'Et voici la promesse qu’il nous a lui-même faite : la vie éternelle.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « lui-même » est emphatique en grec. Le texte ne précise pas ici s’il désigne le Père ou le Fils.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελία / ἐπηγγείλατο
  choice: promesse / faite
  rationale: « Promesse » rend directement le nom. En français naturel, « la promesse qu’il nous a lui-même faite » évite la lourdeur de « la promesse qu’il nous a promise »; la parenté lexicale grecque est donc exprimée par la construction entière plutôt que répétée formellement.
- source_word: αὐτός
  choice: lui-même
  rationale: Le pronom grec est emphatique. « Lui-même », placé près du sujet, conserve cette insistance sans identifier explicitement son référent.
- source_word: ἡμῖν
  choice: nous
  rationale: Le pronom datif est rendu naturellement comme complément indirect dans « qu’il nous a faite ».
- source_word: τὴν ζωὴν τὴν αἰώνιον
  choice: la vie éternelle
  rationale: Le groupe accusatif est en apposition et précise le contenu de la promesse. « La vie éternelle » est l’expression française courante et conserve naturellement l’article grec.
- source_word: καὶ αὕτη ἐστίν
  choice: Et voici
  rationale: « Et voici » est une formulation française naturelle qui relie le verset au contexte et introduit ce qui constitue la promesse.
theological_decisions:
- issue: Référent de αὐτός (« lui-même »)
  choice: Conserver « il… lui-même » sans préciser le référent
  alternative: Nommer le Père ou le Fils
  rationale: Le verset ne répète pas explicitement l’antécédent du pronom. La traduction maintient donc l’ouverture du texte grec au lieu de trancher entre le Père et le Fils.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « promesse… faite » est idiomatique; elle privilégie la fluidité tout en conservant le sens et l’emphase de l’original.
