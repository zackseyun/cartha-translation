id: 1JN.2.13
reference: 1 John 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γράφω ὑμῖν, πατέρες, ὅτι ἐγνώκατε τὸν ἀπ’ ἀρχῆς· γράφω ὑμῖν, νεανίσκοι, ὅτι νενικήκατε τὸν πονηρόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/013.yaml
  text: I write to you[a], fathers, because you have known him who is from the beginning; I write to you, young men, because you have overcome the evil one.
translation:
  language: fr
  text: Je vous écris, pères, parce que vous connaissez celui qui est depuis le commencement[a] ; je vous écris, jeunes gens, parce que vous avez vaincu le Mauvais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression désigne probablement le Fils, bien que certains la comprennent plus largement comme une référence à Dieu.
    reason: Le grec ne nomme pas explicitement le référent de « celui qui est depuis le commencement ».
lexical_decisions:
- source_word: γράφω
  choice: Je vous écris
  rationale: Le présent épistolaire grec se rend naturellement par le présent français et conserve le caractère direct de l’adresse.
- source_word: πατέρες
  choice: pères
  rationale: Le terme vocatif signifie littéralement « pères ». Il peut désigner ici des hommes spirituellement mûrs, mais le texte ne dit pas simplement « hommes âgés ».
- source_word: ἐγνώκατε
  choice: vous connaissez
  rationale: Le parfait grec exprime une connaissance acquise qui demeure. En français actuel, « vous connaissez » rend mieux cet état présent que « vous avez connu », qui pourrait suggérer une relation révolue.
- source_word: τὸν ἀπ’ ἀρχῆς
  choice: celui qui est dès le commencement
  rationale: Cette formulation conserve l’expression substantive et sa référence personnelle sans nommer explicitement son référent. « Dès le commencement » rend la nuance de provenance ou de présence continue attachée à ἀπ’ ἀρχῆς.
- source_word: νεανίσκοι
  choice: jeunes gens
  rationale: Le nom grec est masculin pluriel. « Jeunes gens » est une adresse française naturelle et digne qui garde cette référence masculine.
- source_word: νενικήκατε
  choice: vous avez vaincu
  rationale: Le passé composé exprime une victoire accomplie dont l’effet demeure, conformément au parfait grec.
- source_word: τὸν πονηρόν
  choice: le Mauvais
  rationale: L’article masculin singulier et l’adjectif substantivé indiquent très probablement un adversaire personnel. « Le Mauvais » conserve cette personnification sans ajouter le nom de Satan.
theological_decisions:
- issue: Référent de « celui qui est dès le commencement »
  choice: Maintenir l’expression sans identifier explicitement son référent
  alternative: Nommer le Fils ou comprendre plus largement Dieu
  rationale: Le contexte johannique oriente probablement vers le Fils, mais le grec ne le nomme pas dans ce verset. La formulation retenue préserve cette réserve et la tension théologique du texte.
- issue: Sens de « le Mauvais »
  choice: Un adversaire mauvais personnel
  alternative: Le mal abstrait
  rationale: La forme masculine singulière substantivée favorise nettement un référent personnel, généralement compris comme Satan, tout en ne justifiant pas l’ajout de ce nom dans le texte.
translation_notes:
  register: Français international moderne, direct et digne. La répétition de « je vous écris » et les deux vocatifs sont conservés. « Pères » maintient l’image du texte source, tandis que « jeunes gens » évite une tournure vieillie sans neutraliser le masculin grec.
