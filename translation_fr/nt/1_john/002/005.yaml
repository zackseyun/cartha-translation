id: 1JN.2.5
reference: 1 John 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν τηρῇ αὐτοῦ τὸν λόγον, ἀληθῶς ἐν τούτῳ ἡ ἀγάπη τοῦ θεοῦ τετελείωται. ἐν τούτῳ γινώσκομεν ὅτι ἐν αὐτῷ ἐσμεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/005.yaml
  text: 'But whoever keeps his word[a], truly in him the love of God has been perfected[b]. By this we know that we are in him:'
translation:
  language: fr
  text: 'Mais celui qui garde sa parole, en lui l’amour de Dieu est vraiment parvenu à son plein accomplissement[a]. Voici comment nous savons que nous sommes en lui :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque traduite par « en lui » peut aussi se rendre plus littéralement par « en celui-ci » ou « en cela ». « L’amour de Dieu » peut désigner soit l’amour venant de Dieu et agissant dans le croyant, soit l’amour que le croyant porte à Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: Mais celui qui
  rationale: La tournure avec ἄν exprime une condition générale. « Celui qui » est naturel en français et δέ marque un léger contraste avec ce qui précède.
- source_word: τηρῇ
  choice: garde
  rationale: « Garder » conserve l’éventail de sens de τηρέω — garder, observer, mettre en pratique — ainsi que le vocabulaire johannique, sans réduire le terme à une obéissance seulement extérieure.
- source_word: αὐτοῦ τὸν λόγον
  choice: sa parole
  rationale: Le singulier λόγος désigne ici la parole communiquée par Dieu ou le Christ. « Sa parole » est naturel et préserve la résonance johannique.
- source_word: ἀληθῶς
  choice: vraiment
  rationale: « Vraiment » rend l’intensification exprimée par l’adverbe tout en s’intégrant naturellement à la phrase française.
- source_word: ἐν τούτῳ
  choice: en lui
  rationale: Le démonstratif renvoie très probablement à la personne qui garde la parole. « En lui » exprime clairement ce sens personnel; la possibilité plus littérale « en celui-ci » ou circonstancielle « en cela » est signalée en note.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: l’amour de Dieu
  rationale: Cette formulation conserve l’ambiguïté du génitif grec entre l’amour venant de Dieu et l’amour dirigé vers Dieu.
- source_word: τετελείωται
  choice: est parvenu à son plein accomplissement
  rationale: Le parfait passif présente un état accompli. Cette expression rend l’idée johannique d’un amour mené à son terme sans suggérer une perfection morale abstraite.
- source_word: ἐν τούτῳ γινώσκομεν
  choice: Voici comment nous savons
  rationale: La formule introduit ici le moyen ou le signe permettant de savoir. Cette tournure est idiomatique et prépare naturellement la proposition suivante.
- source_word: ὅτι ἐν αὐτῷ ἐσμεν
  choice: que nous sommes en lui
  rationale: « En lui » maintient l’expression johannique de communion ou d’union sans en imposer une explication interprétative.
theological_decisions:
- issue: Sens du génitif dans ἡ ἀγάπη τοῦ θεοῦ
  choice: l’amour de Dieu
  alternative: l’amour que Dieu donne / l’amour que l’on porte à Dieu
  rationale: Le génitif grec permet réellement les deux orientations. La formulation retenue maintient cette tension théologique sans trancher.
- issue: Référent du premier ἐν τούτῳ
  choice: en lui
  alternative: en celui-ci / en cela
  rationale: Le contexte favorise le renvoi personnel à celui qui garde la parole, mais la forme grecque peut aussi désigner cette réalité comme preuve. Une note conserve cette possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. « Garde sa parole » préserve le vocabulaire johannique; « parvenu à son plein accomplissement » rend l’aspect résultatif du parfait et le sens d’achèvement de τελειόω. Le deux-points final est maintenu puisque la pensée se poursuit au verset suivant.
