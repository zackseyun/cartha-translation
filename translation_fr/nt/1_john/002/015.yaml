id: 1JN.2.15
reference: 1 John 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ ἀγαπᾶτε τὸν κόσμον μηδὲ τὰ ἐν τῷ κόσμῳ. ἐάν τις ἀγαπᾷ τὸν κόσμον, οὐκ ἔστιν ἡ ἀγάπη τοῦ πατρὸς ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/1_john/002/015.yaml
  text: Do not love the world or the things in the world[a]. If anyone loves the world[c][b], the love of the Father is not in him.
translation:
  language: fr
  text: N’aimez pas le monde ni ce qui est dans le monde. Si quelqu’un aime le monde, l’amour du Père[a] n’est pas en lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « L’amour du Père » peut signifier « l’amour pour le Père » ou « l’amour qui vient du Père ».
    reason: alternative_reading
  - marker: b
    text: Le grec emploie ici un masculin singulier dans un sens générique.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ἀγαπᾶτε
  choice: N’aimez pas
  rationale: Le présent impératif avec μή peut exprimer une interdiction générale ou l’arrêt d’une action en cours. « N’aimez pas » préserve cette portée sans imposer une valeur aspectuelle plus précise.
- source_word: τὸν κόσμον
  choice: le monde
  rationale: Dans ce contexte, κόσμος désigne l’ordre humain opposé à Dieu, sans condamner la création matérielle ni les êtres humains en eux-mêmes. La traduction traditionnelle et large « le monde » laisse le contexte préciser ce sens.
- source_word: μηδὲ τὰ ἐν τῷ κόσμῳ
  choice: ni ce qui est dans le monde
  rationale: Le neutre pluriel grec désigne collectivement les réalités qui appartiennent au monde. Cette formulation est naturelle en français et suit de près la structure grecque.
- source_word: ἐάν τις ἀγαπᾷ
  choice: Si quelqu’un aime
  rationale: « Quelqu’un » rend naturellement l’indéfini τις et conserve la portée générale de la proposition conditionnelle.
- source_word: ἡ ἀγάπη τοῦ πατρὸς
  choice: l’amour du Père
  rationale: Le génitif grec peut désigner l’amour pour le Père ou l’amour venant du Père. La formulation française conserve cette ambiguïté, même si le contraste immédiat favorise probablement l’amour pour le Père.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Le grec emploie un pronom masculin singulier de portée générique. « En lui » en reproduit la forme, tandis qu’une note explicite cet usage.
theological_decisions:
- issue: Sens de « le monde » dans l’éthique johannique
  choice: Conserver « le monde » sans explicitation interprétative dans le texte principal.
  alternative: « l’ordre du monde » ou « le système du monde »
  rationale: Le passage vise une allégeance désordonnée à l’ordre opposé à Dieu, non l’amour de la création ou des personnes. Une paraphrase résoudrait trop vite la tension lexicale.
- issue: Valeur du génitif dans « ἡ ἀγάπη τοῦ πατρὸς »
  choice: Conserver « l’amour du Père » dans le texte principal.
  alternative: « l’amour pour le Père » ou « l’amour que donne le Père »
  rationale: Le contraste avec l’amour du monde favorise le sens objectif, « amour pour le Père », mais la syntaxe grecque permet aussi un sens subjectif. La traduction retenue préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle. « Ce qui est dans le monde » évite le tour plus lourd « les choses qui sont dans le monde ».
