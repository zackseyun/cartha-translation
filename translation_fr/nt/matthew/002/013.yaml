id: MAT.2.13
reference: Matthew 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀναχωρησάντων δὲ αὐτῶν ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ φεῦγε εἰς Αἴγυπτον, καὶ ἴσθι ἐκεῖ ἕως ἂν εἴπω σοι· μέλλει γὰρ Ἡρῴδης ζητεῖν τὸ παιδίον τοῦ ἀπολέσαι αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/013.yaml
  text: After they had departed[a], behold, an angel of the Lord appeared to Joseph in a dream, saying, “Get up, take the child and his mother, and flee to Egypt, and stay there until I tell you[c][b]; for Herod is about to seek the child in order to destroy him.”
translation:
  language: fr
  text: 'Après leur départ, voici qu’un ange du Seigneur apparut en rêve à Joseph et lui dit : « Lève-toi, prends l’enfant et sa mère, fuis en Égypte et reste-y jusqu’à ce que je te le dise[a] ; car Hérode va rechercher l’enfant pour le faire mourir[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’à ce que je te dise ». Le contenu de l’instruction future reste implicite.'
    reason: clarification
  - marker: b
    text: 'Littéralement : « pour le détruire », ici au sens de causer sa mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχωρησάντων δὲ αὐτῶν
  choice: Après leur départ
  rationale: Le génitif absolu marque une action antérieure. Cette formulation française est naturelle et maintient clairement la succession des événements.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Cette tournure conserve le marqueur narratif vif de Matthieu tout en restant naturelle dans un registre français digne.
- source_word: ἄγγελος κυρίου
  choice: un ange du Seigneur
  rationale: L’absence d’article devant ἄγγελος favorise ici une formulation indéfinie ; « Seigneur » rend le titre κύριος sans préciser davantage l’identité de l’ange.
- source_word: φαίνεται κατ’ ὄναρ τῷ Ἰωσὴφ
  choice: apparut en rêve à Joseph
  rationale: Le présent grec est un présent historique, naturellement rendu au passé simple dans ce récit. κατ’ ὄναρ signifie idiomatiquement « en rêve ».
- source_word: Ἐγερθεὶς παράλαβε
  choice: Lève-toi, prends
  rationale: Le participe a ici une valeur injonctive dans une suite d’ordres. La formulation restitue clairement les deux actions demandées.
- source_word: τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ
  choice: l’enfant et sa mère
  rationale: La formulation est simple et fidèle ; le possessif renvoie naturellement à l’enfant.
- source_word: φεῦγε εἰς Αἴγυπτον
  choice: fuis en Égypte
  rationale: « Fuir » préserve l’urgence et le danger exprimés par φεύγω.
- source_word: ἴσθι ἐκεῖ
  choice: restes-y
  rationale: Littéralement « sois là », l’expression commande de demeurer sur place ; « restes-y » en restitue le sens idiomatique.
- source_word: ἕως ἂν εἴπω σοι
  choice: jusqu’à ce que je te dise de partir
  rationale: Le grec dit littéralement « jusqu’à ce que je te dise », sans complément explicite. Le complément est rendu explicite dans le texte pour un français idiomatique, tout en étant signalé par une note.
- source_word: μέλλει γὰρ Ἡρῴδης ζητεῖν
  choice: car Hérode va rechercher
  rationale: μέλλει avec l’infinitif présente l’action comme imminente ou sur le point de se produire ; « va » conserve cette imminence.
- source_word: τοῦ ἀπολέσαι αὐτό
  choice: pour le faire mourir
  rationale: Dans ce contexte, ἀπόλλυμι désigne le fait de causer la mort de l’enfant. Cette traduction naturelle conserve la finalité meurtrière sans employer une expression ambiguë en français.
theological_decisions:
- issue: Traduction de κύριος dans ἄγγελος κυρίου
  choice: Seigneur
  alternative: maître
  rationale: « Seigneur » est le rendu biblique et lexical naturel du titre κύριος dans cette expression, sans imposer une identification plus précise de l’ange.
- issue: Caractère défini ou indéfini de ἄγγελος κυρίου
  choice: un ange du Seigneur
  alternative: l’ange du Seigneur
  rationale: Le nom ἄγγελος est sans article dans le grec. Le français indéfini respecte cette forme sans exclure que l’expression évoque pour certains lecteurs une figure biblique familière.
- issue: Portée de ἀπολέσαι appliqué à l’enfant
  choice: le faire mourir
  alternative: le détruire
  rationale: Le contexte indique une intention de donner la mort. « Faire mourir » exprime ce sens sans introduire de précision doctrinale ou de moyen d’exécution absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme excessif. Les impératifs gardent l’urgence du passage, et les notes préservent les nuances que le français idiomatique doit expliciter.
