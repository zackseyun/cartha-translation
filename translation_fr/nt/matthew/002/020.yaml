source:
  edition: SBLGNT
  text: λέγων· Ἐγερθεὶς παράλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ πορεύου εἰς γῆν Ἰσραήλ, τεθνήκασιν γὰρ οἱ ζητοῦντες τὴν ψυχὴν τοῦ παιδίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/020.yaml
  text: saying[a], “Get up, take the child and his mother, and go to the land of Israel, for those seeking the child’s life are dead.”
translation:
  language: fr
  text: 'en disant : « Lève-toi, prends l’enfant et sa mère, et va au pays d’Israël, car ceux qui en voulaient à la vie de l’enfant sont morts[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « ceux qui cherchent la vie de l’enfant » ; expression qui signifie ici qu’ils cherchaient à le tuer.
    reason: La note conserve la formulation grecque tout en explicitant son sens idiomatique dans ce contexte de menace mortelle.
lexical_decisions:
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent rattache directement les paroles de l’ange à la phrase précédente ; « en disant » conserve ce lien syntaxique.
- source_word: Ἐγερθείς
  choice: Lève-toi
  rationale: Ce participe aoriste, employé de façon idiomatique avant un impératif, exprime ici l’ordre de se lever.
- source_word: παράλαβε
  choice: prends
  rationale: Dans ce contexte, παραλαμβάνω signifie prendre quelqu’un avec soi ; « prends » est naturel et précis.
- source_word: τὸ παιδίον
  choice: l’enfant
  rationale: παιδίον désigne simplement l’enfant, sans qu’il soit nécessaire d’ajouter « jeune » ou « petit ».
- source_word: τὴν μητέρα αὐτοῦ
  choice: sa mère
  rationale: Cette formulation rend naturellement en français le possessif grec renvoyant à l’enfant.
- source_word: πορεύου
  choice: va
  rationale: L’impératif de πορεύομαι exprime ici un ordre simple de partir ou de se rendre quelque part.
- source_word: εἰς γῆν Ἰσραήλ
  choice: au pays d’Israël
  rationale: γῆ Ἰσραήλ désigne le territoire d’Israël ; « pays d’Israël » est idiomatique en français et maintient le sens géographique.
- source_word: τεθνήκασιν
  choice: sont morts
  rationale: Le parfait souligne l’état présent résultant de leur mort ; « sont morts » rend naturellement cette valeur.
- source_word: οἱ ζητοῦντες
  choice: ceux qui cherchaient
  rationale: Le participe substantivé désigne les personnes qui poursuivaient ce dessein ; l’imparfait français convient au point de vue narratif et à une action désormais interrompue.
- source_word: τὴν ψυχὴν τοῦ παιδίου
  choice: à ôter la vie à l’enfant
  rationale: Dans cette expression de menace mortelle, ψυχή signifie « vie ». La tournure française rend clairement l’intention de tuer sans introduire la notion théologique d’âme.
theological_decisions:
- issue: Sens de ψυχή dans un contexte de menace mortelle
  choice: vie
  alternative: âme
  rationale: L’expression « chercher la ψυχή de quelqu’un » renvoie ici à la volonté de le tuer. « Âme » introduirait une nuance anthropologique ou théologique étrangère au contexte immédiat.
translation_notes:
  register: Français international moderne, naturel et digne. L’ouverture participiale conserve le lien avec le verset précédent. Les impératifs restent directs, et l’expression de la menace mortelle est clarifiée sans surinterprétation.
