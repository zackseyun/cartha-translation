id: MAT.2.22
reference: Matthew 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὅτι Ἀρχέλαος ⸀βασιλεύει τῆς Ἰουδαίας ἀντὶ ⸂τοῦ πατρὸς αὐτοῦ Ἡρῴδου⸃ ἐφοβήθη ἐκεῖ ἀπελθεῖν· χρηματισθεὶς δὲ κατ’ ὄναρ ἀνεχώρησεν εἰς τὰ μέρη τῆς Γαλιλαίας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/022.yaml
  text: But when he heard that Archelaus was reigning over Judea in place of his father Herod[a], he was afraid to go there. And after being warned in a dream, he withdrew to the regions of Galilee,
translation:
  language: fr
  text: Mais lorsqu’il apprit qu’Archélaüs régnait sur la Judée à la place de son père Hérode, il eut peur de s’y rendre. Averti[a] en rêve, il se retira dans les régions de la Galilée,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant reçu un avertissement » ; le verbe désigne souvent un avertissement ou une instruction d’origine divine.
    reason: alternative_lexicale
lexical_decisions:
- source_word: ἀκούσας
  choice: lorsqu’il apprit
  rationale: Le participe aoriste présente ce qu’il apprend comme la circonstance antérieure qui provoque sa crainte. Cette tournure est naturelle en français et conserve la valeur temporelle.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un contraste narratif avec l’intention précédente de retourner en Israël.
- source_word: βασιλεύει τῆς Ἰουδαίας
  choice: régnait sur la Judée
  rationale: Le verbe garde sa nuance royale, et la préposition « sur » rend naturellement en français le génitif désignant le territoire gouverné.
- source_word: ἀντὶ τοῦ πατρὸς αὐτοῦ Ἡρῴδου
  choice: à la place de son père Hérode
  rationale: ἀντί exprime ici le remplacement ou la succession, sans qu’il soit nécessaire d’expliciter davantage le mode de succession.
- source_word: ἐφοβήθη ἐκεῖ ἀπελθεῖν
  choice: il eut peur de s’y rendre
  rationale: La formulation idiomatique exprime clairement la peur d’aller dans le lieu dont il vient d’être question.
- source_word: χρηματισθεὶς
  choice: Averti
  rationale: Le participe passif désigne un avertissement ou une instruction reçue. Le contexte matthéen suggère une communication divine, mais l’agent reste implicite dans le grec.
- source_word: κατ’ ὄναρ
  choice: en rêve
  rationale: Expression française naturelle pour la formule matthéenne désignant une communication reçue pendant un rêve.
- source_word: ἀνεχώρησεν
  choice: il se retira
  rationale: Le verbe décrit un départ délibéré en réaction au danger, nuance mieux conservée par « se retira » que par le simple « partit ».
- source_word: εἰς τὰ μέρη τῆς Γαλιλαίας
  choice: dans les régions de la Galilée
  rationale: Le pluriel « régions » reflète μέρη, tandis que « dans » convient au mouvement vers un territoire étendu.
theological_decisions:
- issue: Faut-il expliciter Dieu comme auteur de l’avertissement ?
  choice: Maintenir le passif « Averti » sans ajouter « par Dieu ».
  alternative: « Averti par Dieu » ou « ayant reçu une instruction divine ».
  rationale: Dans l’usage de Matthieu, le verbe implique souvent une communication divine, mais le texte grec ne nomme pas ici l’agent. Le passif préserve cette implication sans la transformer en affirmation explicite.
translation_notes:
  register: Français international moderne, narratif et digne. « Archélaüs » suit la forme française usuelle du nom. La virgule finale est conservée puisque le verset se poursuit syntaxiquement au verset suivant.
