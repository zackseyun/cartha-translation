  source_fidelity: La structure temporelle (« Quand ... apprit cela »), le titre « le roi Hérode », le trouble exprimé par ἐταράχθη et l’association de Jérusalem à Hérode (« avec lui ») rendent fidèlement le grec. « Cela » reprend de façon légitime la nouvelle rapportée au verset précédent. La formulation collective conserve la métonymie de πᾶσα Ἱεροσόλυμα sans en limiter le référent.
