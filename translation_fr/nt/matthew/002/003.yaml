source:
  edition: SBLGNT
  text: ἀκούσας δὲ ⸂ὁ βασιλεὺς Ἡρῴδης⸃ ἐταράχθη καὶ πᾶσα Ἱεροσόλυμα μετ’ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/003.yaml
  text: When King Herod heard this[a], he was troubled[b], and all Jerusalem with him.
translation:
  language: fr
  text: Quand le roi Hérode apprit cela, il fut bouleversé, et toute Jérusalem avec lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Toute Jérusalem » désigne ici les habitants de la ville ; l’expression peut être une manière générale ou hyperbolique de parler de l’inquiétude partagée dans la ville.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: Quand … apprit cela
  rationale: 'Le participe aoriste a ici une valeur temporelle. « Quand … apprit cela » est naturel en français et explicite l’objet sous-entendu par le contexte immédiat : la nouvelle apportée par les mages.'
- source_word: δὲ
  choice: intégré à « Quand »
  rationale: Cette particule assure une transition légère. En français, sa fonction discursive est naturellement portée par la proposition temporelle, sans qu’il soit nécessaire d’ajouter « mais » ou « or ».
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: le roi Hérode
  rationale: Cette formulation française courante conserve à la fois le titre royal et le nom propre.
- source_word: ἐταράχθη
  choice: il fut bouleversé
  rationale: Le passif aoriste de ταράσσω exprime un profond trouble intérieur ou une vive inquiétude. « Fut bouleversé » garde cette force sans préciser indûment sa nature exacte.
- source_word: πᾶσα Ἱεροσόλυμα
  choice: tout Jérusalem
  rationale: La ville désigne ici, par métonymie, ses habitants. La formulation conserve l’image grecque et son éventuelle portée générale ou hyperbolique, sans la restreindre aux dirigeants.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: Traduction directe qui associe le trouble de Jérusalem à celui d’Hérode.
theological_decisions:
- issue: Portée de πᾶσα Ἱεροσόλυμα
  choice: Conserver la désignation collective et métonymique « tout Jérusalem »
  alternative: « tous les habitants de Jérusalem » ; « beaucoup de gens à Jérusalem » ; une référence particulière aux dirigeants de la ville
  rationale: Le grec nomme la ville entière sans préciser quels groupes sont visés. La traduction préserve donc cette généralisation narrative et sa tension, plutôt que d’en fixer la portée sociologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Apprit cela » convient mieux à la réception d’une nouvelle que le plus littéral « entendit cela ». « Bouleversé » rend nettement le trouble exprimé par le grec, tandis que la note préserve l’ambiguïté de la portée de « tout Jérusalem ».
