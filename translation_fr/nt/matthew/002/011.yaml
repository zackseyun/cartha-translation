id: MAT.2.11
reference: Matthew 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐλθόντες εἰς τὴν οἰκίαν εἶδον τὸ παιδίον μετὰ Μαρίας τῆς μητρὸς αὐτοῦ, καὶ πεσόντες προσεκύνησαν αὐτῷ, καὶ ἀνοίξαντες τοὺς θησαυροὺς αὐτῶν προσήνεγκαν αὐτῷ δῶρα, χρυσὸν καὶ λίβανον καὶ σμύρναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/011.yaml
  text: 'And when they came into the house[a], they saw the child with Mary his mother, and falling down they paid homage to him, and opening their treasures they offered him gifts: gold and frankincense and myrrh.'
translation:
  language: fr
  text: 'Ils entrèrent dans la maison et virent l’enfant avec Marie, sa mère. Ils se prosternèrent et lui rendirent hommage[a]. Puis ils ouvrirent leurs trésors et lui offrirent des présents : de l’or, de l’oliban et de la myrrhe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adorèrent ». Le verbe grec peut désigner l’adoration ou un acte d’hommage révérencieux, selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίαν
  choice: maison
  rationale: Le nom désigne ici concrètement une habitation; « maison » est direct, naturel et n’ajoute aucune précision absente du grec.
- source_word: παιδίον
  choice: enfant
  rationale: Le terme désigne un enfant, sans qu’il soit nécessaire de préciser davantage son âge ou son sexe dans la traduction.
- source_word: μετὰ Μαρίας τῆς μητρὸς αὐτοῦ
  choice: avec Marie, sa mère
  rationale: La formulation rend simplement l’accompagnement et l’apposition qui identifie Marie comme la mère de l’enfant.
- source_word: πεσόντες
  choice: ils se prosternèrent
  rationale: Dans ce contexte de révérence, cette expression française rend naturellement le geste corporel consistant à tomber ou s’abaisser devant quelqu’un.
- source_word: προσεκύνησαν
  choice: lui rendirent hommage
  rationale: Le verbe peut exprimer soit un hommage révérencieux, notamment royal, soit l’adoration. Le choix principal préserve cette amplitude contextuelle sans imposer la lecture théologique la plus forte.
- source_word: θησαυροὺς
  choice: trésors
  rationale: « Trésors » conserve la formulation grecque sans préciser indûment qu’il s’agissait de coffres ou de contenants particuliers.
- source_word: προσήνεγκαν
  choice: offrirent
  rationale: Le verbe exprime ici l’action de présenter ou d’offrir quelque chose; « offrirent » convient au geste solennel décrit.
- source_word: δῶρα
  choice: présents
  rationale: « Présents » désigne naturellement des dons offerts en signe d’honneur et évite la répétition sonore de « offrirent des cadeaux ».
- source_word: λίβανον
  choice: encens
  rationale: Dans l’usage biblique français, « encens » est le terme courant et intelligible pour la résine aromatique appelée plus précisément oliban.
- source_word: σμύρναν
  choice: myrrhe
  rationale: « Myrrhe » est l’équivalent français précis et traditionnel du terme grec.
theological_decisions:
- issue: Portée de προσκυνέω appliqué à l’enfant Jésus
  choice: lui rendirent hommage
  alternative: l’adorèrent
  rationale: Le contexte permet de comprendre le geste comme un hommage rendu à un enfant royal ou, dans une lecture théologique plus forte, comme une adoration. Le texte principal ne tranche pas cette tension, et la note conserve explicitement l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. Les participes grecs ont été rendus par des verbes conjugués pour obtenir un récit naturel. « Puis » clarifie la succession des gestes sans modifier leur relation narrative. Le marqueur de note est placé après « hommage », le mot auquel la variante se rapporte.
