id: MAT.2.19
reference: Matthew 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τελευτήσαντος δὲ τοῦ Ἡρῴδου ἰδοὺ ἄγγελος κυρίου ⸂φαίνεται κατ’ ὄναρ⸃ τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/019.yaml
  text: But after Herod died[a], behold, an angel of the Lord appears in a dream to Joseph in Egypt.
translation:
  language: fr
  text: Mais après la mort d’Hérode, voici qu’un ange[a] du Seigneur apparaît en rêve à Joseph, en Égypte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’ange du Seigneur ». Le grec ne met pas d’article devant « ange ».'
    reason: Préserver la possibilité grammaticale d’une lecture définie tout en indiquant pourquoi le texte principal emploie l’indéfini.
lexical_decisions:
- source_word: Τελευτήσαντος δὲ τοῦ Ἡρῴδου
  choice: Mais, après la mort d’Hérode
  rationale: Le participe aoriste dans un génitif absolu exprime ici une circonstance temporelle antérieure. « Après la mort d’Hérode » est naturel en français et conserve la transition légèrement contrastive marquée par δέ.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Cette tournure garde la fonction de mise en relief narrative et la solennité de l’expression grecque, sans archaïsme excessif.
- source_word: ἄγγελος κυρίου
  choice: un ange du Seigneur
  rationale: L’absence d’article devant ἄγγελος favorise la forme indéfinie, tandis que le génitif κυρίου se rend idiomatiquement par « du Seigneur ».
- source_word: φαίνεται
  choice: apparaît
  rationale: Le présent français préserve le présent historique du récit grec et son effet de vivacité.
- source_word: κατ’ ὄναρ
  choice: en rêve
  rationale: Expression française naturelle pour une apparition ou une révélation reçue pendant un rêve.
- source_word: τῷ Ἰωσὴφ ἐν Αἰγύπτῳ
  choice: à Joseph, en Égypte
  rationale: Le datif désigne la personne à qui l’ange apparaît, et le complément locatif indique où se trouve Joseph. La virgule facilite la lecture sans modifier le sens.
theological_decisions:
- issue: Sens de κύριος dans ἄγγελος κυρίου
  choice: du Seigneur
  alternative: du maître
  rationale: Dans ce contexte biblique, κύριος fonctionne comme un titre divin; « Seigneur » est l’équivalent français établi et contextuellement approprié.
- issue: Détermination de ἄγγελος
  choice: un ange du Seigneur
  alternative: l’ange du Seigneur
  rationale: Le grec ne porte pas d’article devant ἄγγελος, ce qui favorise « un ange ». Toutefois, l’absence d’article en grec n’exclut pas absolument une lecture définie; l’autre possibilité est donc signalée sans imposer les associations théologiques que la formule traditionnelle peut évoquer.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » conserve la mise en relief de ἰδού; le présent « apparaît » reproduit le présent historique grec.
