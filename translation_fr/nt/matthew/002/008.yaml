source:
  edition: SBLGNT
  text: καὶ πέμψας αὐτοὺς εἰς Βηθλέεμ εἶπεν· Πορευθέντες ⸂ἐξετάσατε ἀκριβῶς⸃ περὶ τοῦ παιδίου· ἐπὰν δὲ εὕρητε, ἀπαγγείλατέ μοι, ὅπως κἀγὼ ἐλθὼν προσκυνήσω αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/008.yaml
  text: And after sending them to Bethlehem[a], he said, “Go and search carefully for the child, and when you find him, report to me, so that I too may come and worship him.”
translation:
  language: fr
  text: 'Après les avoir envoyés à Bethléem, il leur dit : « Allez vous renseigner avec soin au sujet de l’enfant. Quand vous l’aurez trouvé, faites-le-moi savoir, afin que moi aussi j’aille me prosterner devant lui[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’adorer » ou « lui rendre hommage ». Le verbe grec peut désigner l’adoration ou un geste de profond respect devant un roi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέμψας
  choice: Il les envoya
  rationale: Le participe aoriste indique une action liée et antérieure à εἶπεν. La coordination française rend naturellement la succession sans alourdir la phrase.
- source_word: Πορευθέντες
  choice: Allez
  rationale: Le participe accompagne ici l’impératif ἐξετάσατε et se rend naturellement en français par un impératif coordonné.
- source_word: ἐξετάσατε ἀκριβῶς περὶ τοῦ παιδίου
  choice: vous renseigner soigneusement sur l’enfant
  rationale: La formulation exprime une enquête attentive et précise au sujet de l’enfant, dans un français courant qui n’implique pas seulement une recherche physique.
- source_word: παιδίου
  choice: l’enfant
  rationale: παιδίον désigne ici un enfant, sans qu’il soit nécessaire d’ajouter « petit » ou « jeune ».
- source_word: ἐπὰν δὲ εὕρητε
  choice: Quand vous l’aurez trouvé
  rationale: La conjonction avec le subjonctif présente une éventualité attendue. Le futur antérieur français marque clairement que la découverte précède le rapport demandé, sans transformer l’énoncé en certitude absolue.
- source_word: ἀπαγγείλατέ μοι
  choice: faites-le-moi savoir
  rationale: Cette expression idiomatique transmet l’idée de communiquer à Hérode le résultat de la recherche.
- source_word: ὅπως κἀγὼ
  choice: afin que moi aussi
  rationale: « Afin que » conserve la valeur de but de ὅπως, tandis que « moi aussi » rend l’insistance de κἀγώ.
- source_word: ἐλθὼν προσκυνήσω αὐτῷ
  choice: j’aille me prosterner devant lui
  rationale: La coordination idiomatique rend le participe suivi du subjonctif. « Se prosterner devant » conserve l’acte de révérence exprimé par προσκυνέω sans décider à lui seul s’il s’agit d’adoration ou d’hommage royal.
theological_decisions:
- issue: Portée de προσκυνέω lorsque l’enfant Jésus en est l’objet
  choice: me prosterner devant lui
  alternative: l’adorer ; lui rendre hommage
  rationale: Le verbe peut désigner aussi bien l’adoration que la prosternation respectueuse devant un souverain. La traduction principale préserve cette amplitude sémantique et la tension du récit, tandis que la note explicite les lectures possibles.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct reste naturel, et « se prosterner devant » maintient l’ambiguïté lexicale et théologique du grec.
