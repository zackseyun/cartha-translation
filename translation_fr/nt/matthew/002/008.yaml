    rationale: « Il les envoya à Bethléem et leur dit » est compréhensible, mais le grec présente πέμψας comme un participe rattaché à « il dit ». « Après les avoir envoyés à Bethléem, il leur dit » rend plus directement la relation syntaxique et temporelle.
  - severity: low
    issue: Ponctuation dans la proposition finale
    rationale: La virgule après « moi aussi » n’est pas nécessaire en français et interrompt inutilement la proposition subordonnée.
