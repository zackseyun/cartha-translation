id: MAT.2.16
reference: Matthew 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης ἰδὼν ὅτι ἐνεπαίχθη ὑπὸ τῶν μάγων ἐθυμώθη λίαν, καὶ ἀποστείλας ἀνεῖλεν πάντας τοὺς παῖδας τοὺς ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς ἀπὸ διετοῦς καὶ κατωτέρω, κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/016.yaml
  text: Then Herod[a], seeing that he had been tricked by the magi, became very angry, and sending men, he killed all the boys in Bethlehem and in all its surrounding districts, from two years old and under[b], according to the time that he had determined from the magi.
translation:
  language: fr
  text: Alors Hérode, voyant que les mages[b] s’étaient joués de lui[a], entra dans une grande colère. Il envoya des hommes tuer tous les garçons de Bethléem et de tout son territoire, âgés de deux ans ou moins, d’après le moment qu’il avait établi avec précision d’après les renseignements des mages.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’étaient moqués de lui ».'
    reason: Alternative lexicale pour ἐνεπαίχθη, qui peut exprimer la moquerie autant que le fait de s’être joué de quelqu’un.
  - marker: b
    text: On traduit aussi par « sages ». Le terme grec désigne ici des sages-astrologues venus d’Orient.
    reason: Précision culturelle sur le sens de μάγοι.
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession narrative introduite par l’adverbe grec.
- source_word: ἰδὼν ὅτι
  choice: voyant que
  rationale: Conserve la forme perceptive et la valeur circonstancielle du participe grec sans surinterpréter.
- source_word: ἐνεπαίχθη
  choice: s’étaient joués de lui
  rationale: Rend à la fois l’idée que les mages ont déjoué Hérode et celle qu’il s’est estimé tourné en ridicule; l’équivalent plus littéral est signalé en note.
- source_word: μάγων
  choice: mages
  rationale: Transcrit le terme désignant ici des sages-astrologues orientaux et évite de lui substituer l’expression traditionnelle plus générale « sages ».
- source_word: ἐθυμώθη λίαν
  choice: entra dans une grande colère
  rationale: Expression française naturelle qui conserve le changement d’état exprimé par le verbe et l’intensification de λίαν.
- source_word: ἀποστείλας ἀνεῖλεν
  choice: Il envoya des hommes tuer
  rationale: Rend le participe d’envoi et le verbe principal tout en explicitant sobrement les agents nécessairement impliqués par le contexte.
- source_word: πάντας τοὺς παῖδας
  choice: tous les garçons
  rationale: Dans ce contexte, παῖδας désigne les enfants de sexe masculin visés par la recherche du garçon annoncé.
- source_word: ἐν Βηθλέεμ καὶ ἐν πᾶσι τοῖς ὁρίοις αὐτῆς
  choice: de Bethléem et de tout son territoire
  rationale: « Territoire » exprime ici la zone dépendant de Bethléem et ses environs, plutôt que de simples frontières.
- source_word: ἀπὸ διετοῦς καὶ κατωτέρω
  choice: âgés de deux ans ou moins
  rationale: Formulation française claire qui inclut les enfants de deux ans et tous les plus jeunes.
- source_word: κατὰ τὸν χρόνον ὃν ἠκρίβωσεν παρὰ τῶν μάγων
  choice: d’après l’époque qu’il avait déterminée avec précision grâce aux mages
  rationale: Conserve la référence temporelle, le soin de la détermination et le fait que les renseignements provenaient des mages.
theological_decisions:
- issue: Sens de ἐνεπαίχθη
  choice: s’étaient joués de lui
  alternative: s’étaient moqués de lui
  rationale: Le contexte implique qu’Hérode a été déjoué lorsque les mages ne sont pas revenus, tandis que le verbe peut aussi évoquer directement la moquerie. Le texte choisit une expression française capable de porter les deux nuances et la note préserve l’autre rendu.
- issue: Désignation des μάγοι
  choice: mages
  alternative: sages
  rationale: « Mages » préserve l’identité culturelle et lexicale des visiteurs sans importer des développements traditionnels ultérieurs.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste directe; « envoya des hommes tuer » explicite naturellement l’action déléguée sans atténuer la responsabilité d’Hérode. Les marqueurs de notes sont placés sur les expressions auxquelles les notes se rapportent.
