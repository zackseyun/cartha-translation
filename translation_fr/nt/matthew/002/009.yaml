id: MAT.2.9
reference: Matthew 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἀκούσαντες τοῦ βασιλέως ἐπορεύθησαν, καὶ ἰδοὺ ὁ ἀστὴρ ὃν εἶδον ἐν τῇ ἀνατολῇ προῆγεν αὐτούς, ἕως ἐλθὼν ⸀ἐστάθη ἐπάνω οὗ ἦν τὸ παιδίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/009.yaml
  text: After hearing the king[a], they went on their way, and behold, the star that they had seen in the east went before them until it came and stood over where the child was.
translation:
  language: fr
  text: Après avoir entendu le roi, ils se mirent en route. Et voici que l’étoile qu’ils avaient vue en Orient[a] les précédait, jusqu’à ce qu’elle arrive et s’arrête au-dessus de l’endroit où se trouvait l’enfant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à son lever »; l’expression grecque peut désigner soit l’Orient comme région ou direction, soit le lever d’un astre.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες τοῦ βασιλέως
  choice: Après avoir entendu le roi
  rationale: Le participe aoriste marque ici une action antérieure au verbe principal. En français, « après avoir entendu » restitue naturellement cette succession. Le génitif désigne la personne entendue, sans qu’il soit nécessaire d’ajouter « Hérode ».
- source_word: ἐπορεύθησαν
  choice: ils se mirent en route
  rationale: Cette formulation française exprime naturellement le départ et la poursuite du trajet, sans surcharger le simple verbe grec de déplacement.
- source_word: ἰδοὺ
  choice: Et voici que
  rationale: Ce marqueur attire vivement l’attention sur un nouvel événement. « Et voici que » conserve cet effet narratif dans un registre actuel et digne.
- source_word: ὃν εἶδον
  choice: qu’ils avaient vue
  rationale: Le plus-que-parfait français indique clairement que cette vision de l’étoile précédait la scène racontée. L’accord « vue » se fait avec le complément direct antéposé « qu’ », qui reprend « l’étoile ».
- source_word: ἐν τῇ ἀνατολῇ
  choice: en Orient
  rationale: L’expression peut désigner l’est comme région ou direction. « En Orient » est idiomatique dans ce récit et maintient la lecture géographique dans le texte principal; le sens astronomique possible est signalé en note.
- source_word: προῆγεν αὐτούς
  choice: les précédait
  rationale: Le verbe signifie aller devant ou conduire en précédant. « Les précédait » préserve sobrement cette image sans préciser le mécanisme du guidage.
- source_word: ἕως ἐλθὼν ἐστάθη
  choice: jusqu’à ce qu’elle arrive et s’arrête
  rationale: La coordination française rend clairement l’arrivée exprimée par le participe, puis l’arrêt exprimé par le verbe principal. « S’arrête » est plus naturel ici que le littéral « se tienne debout » pour une étoile.
- source_word: ἐπάνω οὗ ἦν τὸ παιδίον
  choice: au-dessus de l’endroit où se trouvait l’enfant
  rationale: Cette formulation rend explicitement la relation de position indiquée par ἐπάνω et le relatif de lieu, tout en conservant le simple terme « l’enfant » pour παιδίον.
theological_decisions:
- issue: Sens de ἐν τῇ ἀνατολῇ dans le récit de l’étoile
  choice: en Orient
  alternative: à son lever
  rationale: L’expression grecque permet aussi bien une compréhension géographique qu’une compréhension astronomique. Le texte principal retient la lecture géographique courante, tandis que la note conserve l’autre possibilité sans trancher la nature du phénomène.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » préserve la vivacité de ἰδού; « se mirent en route » et « arrive et s’arrête » évitent un littéralisme raide. Le marqueur [a] est placé immédiatement après l’expression qu’il explique.
