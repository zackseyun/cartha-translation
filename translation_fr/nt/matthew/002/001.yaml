id: MAT.2.1
reference: Matthew 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦ δὲ Ἰησοῦ γεννηθέντος ἐν Βηθλέεμ τῆς Ἰουδαίας ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως, ἰδοὺ μάγοι ἀπὸ ἀνατολῶν παρεγένοντο εἰς Ἱεροσόλυμα
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/001.yaml
  text: After Jesus was born in Bethlehem of Judea in the days of Herod the king[a], behold, wise men from the east arrived in Jerusalem,
translation:
  language: fr
  text: Après la naissance de Jésus à Bethléem en Judée, au temps du roi Hérode, voici que des mages[a] venus d’Orient arrivèrent à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec désigne des savants venus d’Orient, probablement liés à l’astrologie ou à la sagesse de cour.
    reason: Précision lexicale destinée à éviter que le mot « mages » soit compris à travers des traditions ultérieures.
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γεννηθέντος
  choice: Après la naissance de Jésus
  rationale: Le génitif absolu fournit l’arrière-plan temporel, antérieur à l’action principale. Cette formulation est naturelle en français et conserve cette relation sans ajouter un « maintenant » absent du grec.
- source_word: Βηθλέεμ τῆς Ἰουδαίας
  choice: Bethléem en Judée
  rationale: « En Judée » est la tournure géographique française la plus naturelle et distingue cette ville des autres localités portant le même nom.
- source_word: ἐν ἡμέραις Ἡρῴδου τοῦ βασιλέως
  choice: au temps du roi Hérode
  rationale: Cette expression situe clairement le récit dans son cadre historique tout en rendant naturellement l’idiome grec.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Cette locution attire l’attention sur l’arrivée inattendue des personnages et conserve la valeur narrative marquée de ἰδού dans un français actuel.
- source_word: μάγοι
  choice: mages
  rationale: « Mages » est le terme français précis et traditionnel pour ces savants orientaux; il n’implique ni qu’ils étaient rois ni qu’ils étaient trois.
- source_word: ἀπὸ ἀνατολῶν
  choice: venus d’Orient
  rationale: Le pluriel grec désigne des régions orientales. « D’Orient » est idiomatique en français, et « venus » relie naturellement leur origine à leur arrivée.
- source_word: παρεγένοντο εἰς Ἱεροσόλυμα
  choice: arrivèrent à Jérusalem
  rationale: Le verbe exprime l’arrivée sur les lieux; avec une ville comme destination, « arriver à Jérusalem » est la construction française naturelle.
theological_decisions:
- issue: Rendre μάγοι sans introduire les développements de la tradition ultérieure
  choice: mages
  alternative: savants venus d’Orient
  rationale: Le mot grec peut désigner des spécialistes orientaux liés à l’astrologie ou à la sagesse de cour. « Mages » conserve le terme spécifique sans leur attribuer un nombre ni un statut royal; une note en précise le sens historique.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » conserve le relief du marqueur discursif grec sans recourir à l’archaïque « voici ». Le passé simple convient au registre narratif biblique tout en restant clair.
