  text: οἱ δὲ εἶπαν αὐτῷ· Ἐν Βηθλέεμ τῆς Ἰουδαίας· οὕτως γὰρ γέγραπται διὰ τοῦ προφήτου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/005.yaml
  text: And they said to him[a], “In Bethlehem of Judea[b], for thus it has been written through the prophet:”
translation:
  language: fr
  text: 'Ils lui dirent : « À Bethléem en Judée, car il est ainsi écrit par le prophète : »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ εἶπαν αὐτῷ
  choice: Ils lui répondirent
  rationale: Le groupe désigne les chefs des prêtres et les spécialistes de la Loi mentionnés au verset précédent. Dans ce contexte de question et réponse, « répondirent » rend naturellement εἶπαν sans surcharger le faible connecteur δέ.
- source_word: Ἐν Βηθλέεμ τῆς Ἰουδαίας
  choice: À Bethléem en Judée
  rationale: En français, « à » convient naturellement devant un nom de ville, tandis que « en Judée » identifie clairement la région et distingue cette Bethléem d’une autre localité du même nom.
- source_word: οὕτως γὰρ
  choice: car voici ce qui
  rationale: γάρ introduit la justification de la réponse, et οὕτως annonce la citation qui suit. Cette formulation française conserve ce mouvement vers l’avant sans raideur.
- source_word: γέγραπται
  choice: a été écrit
  rationale: Le parfait passif appartient à la formule habituelle d’introduction d’une citation biblique. « A été écrit » conserve l’aspect accompli, tout en restant naturel en français.
- source_word: διὰ τοῦ προφήτου
  choice: par l’intermédiaire du prophète
  rationale: διά avec le génitif présente le prophète comme médiateur de l’énoncé. Cette expression garde cette nuance plus explicitement que le simple « par le prophète ».
theological_decisions:
- issue: Formule de médiation prophétique
  choice: par l’intermédiaire du prophète
  alternative: par le prophète
  rationale: La traduction préserve la distinction implicite entre la source ultime du message et le prophète qui le transmet, sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste fluide à l’oral tout en gardant le caractère solennel de l’introduction à la citation prophétique.
