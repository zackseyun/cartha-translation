  text: Καὶ σύ, Βηθλέεμ γῆ Ἰούδα, οὐδαμῶς ἐλαχίστη εἶ ἐν τοῖς ἡγεμόσιν Ἰούδα· ἐκ σοῦ γὰρ ἐξελεύσεται ἡγούμενος, ὅστις ποιμανεῖ τὸν λαόν μου τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/006.yaml
  text: And you[a], Bethlehem, land of Judah, are by no means least among the rulers of Judah[b]; for from you will come a ruler who will shepherd my people Israel.
translation:
  language: fr
  text: Et toi, Bethléem, terre de Juda, tu n’es certainement pas la moindre parmi les chefs de Juda ; car de toi sortira[a] un chef qui prendra soin de mon peuple Israël en berger[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « viendra de toi ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec signifie littéralement « faire paître » ; il peut aussi évoquer l’action de gouverner, tout en conservant l’image du berger.
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆ
  choice: terre
  rationale: En apposition à « Bethléem » et avec le complément « de Juda », le terme désigne ici le territoire associé à Juda. « Terre » conserve naturellement cette portée géographique.
- source_word: οὐδαμῶς
  choice: vraiment pas
  rationale: L’adverbe exprime une négation appuyée. « Vraiment pas » en restitue la force dans un français actuel sans donner au verset un ton artificiellement soutenu.
- source_word: ἐλαχίστη
  choice: la moindre
  rationale: Le superlatif porte ici sur le rang ou l’importance, et non simplement sur la superficie. « La moindre » préserve cette nuance.
- source_word: ἡγεμόσιν
  choice: les chefs
  rationale: Le terme désigne des autorités ou des entités dirigeantes de Juda. « Chefs » garde une portée assez large sans imposer la fonction politique plus précise de « gouverneurs ».
- source_word: ἐξελεύσεται
  choice: sortira
  rationale: Le futur de ἐξέρχομαι signifie littéralement « sortir » ou « aller hors de ». « De toi sortira » est naturel en français et conserve l’image d’une personne issue de Bethléem.
- source_word: ἡγούμενος
  choice: un chef
  rationale: Employé comme substantif, le participe désigne celui qui dirige. « Un chef » exprime cette autorité sans préciser indûment un titre politique.
- source_word: ποιμανεῖ
  choice: conduira … comme un berger
  rationale: Cette formulation rend explicite et intelligible l’image verbale du berger tout en conservant sa dimension de direction, sans la réduire au seul fait de gouverner.
- source_word: λαόν μου τὸν Ἰσραήλ
  choice: mon peuple Israël
  rationale: Cette formulation directe préserve l’expression d’appartenance et l’apposition présentes dans le grec.
theological_decisions:
- issue: La double dimension royale et pastorale de la figure annoncée
  choice: Rendre ἡγούμενος par « un chef » et ποιμανεῖ par « conduira … comme un berger »
  alternative: Employer uniquement un vocabulaire politique (« dirigeant » / « gouvernera ») ou uniquement un vocabulaire pastoral
  rationale: Le texte associe autorité et image pastorale. La traduction maintient ensemble ces deux dimensions au lieu de réduire la figure annoncée à une seule d’entre elles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la forme solennelle de la citation, tandis que « conduira … comme un berger » rend l’image pastorale immédiatement compréhensible.
