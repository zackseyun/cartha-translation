    issue: Rendu de ποιμανεῖ par « conduira … comme un berger »
    rationale: Le grec emploie directement le verbe pastoral « faire paître / être berger de », dont le sens figuré inclut l’exercice de l’autorité. La comparaison ajoutée (« comme ») et le choix de « conduira » rendent l’image moins directe. « Prendra soin de … en berger » conserve mieux le trope tout en restant moderne.
  - severity: low
    issue: Note a redondante avec le texte principal
    rationale: Le texte principal dit déjà « sortira de toi », tandis que la note donne comme option plus littérale exactement « sortira de toi ». La note doit proposer une véritable alternative, telle que « viendra de toi ».
