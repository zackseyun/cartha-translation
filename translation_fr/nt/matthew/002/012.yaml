id: MAT.2.12
reference: Matthew 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ χρηματισθέντες κατ’ ὄναρ μὴ ἀνακάμψαι πρὸς Ἡρῴδην δι’ ἄλλης ὁδοῦ ἀνεχώρησαν εἰς τὴν χώραν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/012.yaml
  text: And having been warned in a dream not to return to Herod[b][a], they departed for their own country by another route.
translation:
  language: fr
  text: Avertis[a] dans un rêve de ne pas retourner vers Hérode, ils repartirent vers leur pays par un autre chemin[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec peut aussi se comprendre : « divinement avertis ». Le passif laisse entendre un avertissement venant de Dieu, sans que Dieu soit explicitement nommé dans ce verset.'
    reason: lexical_alternative
  - marker: b
    text: Ou « par une autre route ».
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισθέντες
  choice: Avertis
  rationale: Le participe passif désigne ici un avertissement reçu, dont le contexte laisse entendre l’origine divine sans que Dieu soit explicitement nommé.
- source_word: κατ’ ὄναρ
  choice: en rêve
  rationale: Cette expression matthéenne désigne naturellement une communication reçue pendant un rêve.
- source_word: μὴ ἀνακάμψαι
  choice: de ne pas retourner
  rationale: L’infinitif avec μή exprime le contenu négatif de l’avertissement; « retourner » convient au contexte du voyage.
- source_word: πρὸς Ἡρῴδην
  choice: auprès d’Hérode
  rationale: πρός avec l’accusatif indique ici le retour vers une personne; « auprès d’Hérode » exprime naturellement l’idée de revenir le voir.
- source_word: δι’ ἄλλης ὁδοῦ
  choice: par un autre chemin
  rationale: ὁδός désigne concrètement la voie empruntée; « chemin » reste naturel et conserve la formulation simple du grec.
- source_word: ἀνεχώρησαν
  choice: ils regagnèrent
  rationale: Dans ce contexte de retour vers leur patrie, « regagnèrent » rend idiomatiquement le départ et la destination exprimée par le complément.
- source_word: εἰς τὴν χώραν αὐτῶν
  choice: leur pays
  rationale: χώρα peut signifier pays, territoire ou région; ici, la destination des mages est naturellement leur pays d’origine.
theological_decisions:
- issue: Origine divine implicite de l’avertissement
  choice: Employer le passif « Avertis » sans ajouter « par Dieu » dans le texte principal.
  alternative: « Divinement avertis » ou « avertis par Dieu »
  rationale: Le contexte et l’emploi de χρηματίζω impliquent fortement une communication divine, mais le verset grec ne nomme pas explicitement Dieu; la traduction préserve cette implication sans expliciter davantage que le texte.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve la construction participiale concise du grec tout en employant un vocabulaire courant. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
