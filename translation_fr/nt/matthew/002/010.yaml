  yaml_path: translation/nt/matthew/002/010.yaml
  text: And when they saw the star[a], they rejoiced with exceedingly great joy.
translation:
  language: fr
  text: Quand ils virent l’étoile, ils se réjouirent d’une très grande joie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: Quand ils virent
  rationale: Le participe aoriste a ici une valeur temporelle liée au verbe principal. « Quand ils virent » est naturel en français et conserve cette relation.
- source_word: δὲ
  choice: non traduit explicitement
  rationale: Cette particule assure une transition narrative légère. En français, l’enchaînement est naturel sans connecteur explicite ; « mais » introduirait un contraste trop marqué.
- source_word: τὸν ἀστέρα
  choice: l’étoile
  rationale: Le nom désigne simplement une étoile, et l’article défini renvoie à celle qui a déjà été mentionnée dans le récit.
- source_word: ἐχάρησαν
  choice: ils éprouvèrent une joie
  rationale: Le verbe signifie qu’ils se réjouirent. La tournure choisie permet de rendre naturellement en français la construction grecque avec l’accusatif apparenté χαράν.
- source_word: χαρὰν μεγάλην σφόδρα
  choice: une joie immense
  rationale: Le grec accumule un nom apparenté au verbe, l’adjectif « grande » et l’adverbe intensif σφόδρα. « Une joie immense » restitue cette forte insistance dans un français actuel et digne, sans lourdeur artificielle.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La forte emphase du grec est intégrée au texte par « une joie immense », ce qui évite une note tout en préservant l’intensité de l’expression originale.
