revisions:
- from: Il rassembla tous les chefs des prêtres et les spécialistes de la Loi du peuple, puis leur demanda où le Messie[a] devait naître.
  to: Après avoir réuni tous les grands prêtres et les scribes du peuple, il leur demandait où le Messie[a] devait naître.
  rationale: La révision conserve le sens et l’ambiguïté du grec tout en rétablissant l’aspect imperfectif du verbe principal, la relation syntaxique de « du peuple » et la terminologie française usuelle pour les autorités sacerdotales.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:42:15Z'
review_pass:
  verdict: revise
  source_fidelity: La séquence participiale antérieure, la totalité de l’assemblée, le titre « Messie » et la naissance attendue sont bien rendus. Toutefois, le passé simple « leur demanda » atténue l’aspect imperfectif de ἐπυνθάνετο, et « spécialistes de la Loi du peuple » rattache naturellement « du peuple » à « Loi » plutôt qu’aux spécialistes, contrairement au grec.
  naturalness: La formulation révisée emploie une syntaxe française fluide et un vocabulaire biblique encore largement compris. « Après avoir réuni » rend clairement l’antériorité du participe, et « il leur demandait » conserve l’aspect en cours sans suggérer nécessairement des questions répétées.
  terminology: « Grands prêtres » est l’appellation française biblique établie pour ἀρχιερεῖς au pluriel; elle désigne le groupe des autorités sacerdotales et non plusieurs titulaires simultanés d’une unique charge. « Scrib(es) du peuple » traduit directement γραμματεῖς τοῦ λαοῦ et évite l’ambiguïté syntaxique de la version proposée. « Messie » convient pour ὁ χριστός dans ce contexte.
  issues:
  - severity: medium
    issue: Aspect de ἐπυνθάνετο non conservé
    rationale: « Leur demanda » est un passé simple ponctuel, tandis que l’imparfait grec présente l’interrogation comme une démarche en cours. « Il leur demandait » conserve cette valeur sans surinterpréter une répétition.
  - severity: medium
    issue: Rattachement ambigu de « du peuple »
    rationale: Dans « les spécialistes de la Loi du peuple », le complément se lit naturellement comme qualifiant « la Loi ». En grec, τοῦ λαοῦ qualifie les scribes. « Les scribes du peuple » restitue directement cette relation.
  - severity: low
    issue: « Chefs des prêtres » peu idiomatique comme désignation établie
    rationale: « Grands prêtres » est le terme français conventionnel et précis pour le pluriel ἀρχιερεῖς dans ce cadre.
  revised_text: Après avoir réuni tous les grands prêtres et les scribes du peuple, il leur demandait où le Messie[a] devait naître.
  revised_footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός signifie « l’Oint » et correspond au titre « Messie ».
    reason: Signaler la traduction traditionnelle possible du titre et expliciter l’équivalence sans effacer le contexte messianique juif.
  revision_rationale: La révision conserve le sens et l’ambiguïté du grec tout en rétablissant l’aspect imperfectif du verbe principal, la relation syntaxique de « du peuple » et la terminologie française usuelle pour les autorités sacerdotales.
