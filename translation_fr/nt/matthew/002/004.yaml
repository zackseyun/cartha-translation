id: MAT.2.4
reference: Matthew 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ συναγαγὼν πάντας τοὺς ἀρχιερεῖς καὶ γραμματεῖς τοῦ λαοῦ ἐπυνθάνετο παρ’ αὐτῶν ποῦ ὁ χριστὸς γεννᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/004.yaml
  text: And gathering together all the chief priests and scribes of the people[a], he was inquiring of them where the Messiah was to be born.
translation:
  language: fr
  text: Après avoir réuni tous les grands prêtres et les scribes du peuple, il leur demandait où le Messie[a] devait naître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός signifie « l’Oint » et correspond au titre « Messie ».
    reason: Signaler la traduction traditionnelle possible du titre et expliciter l’équivalence sans effacer le contexte messianique juif.
lexical_decisions:
- source_word: συναγαγὼν
  choice: Il rassembla… puis
  rationale: Le participe aoriste exprime ici une action antérieure à la demande; cette coordination restitue naturellement en français la succession des actions.
- source_word: πάντας
  choice: tous
  rationale: Conserve explicitement la portée globale de l’adjectif grec.
- source_word: ἀρχιερεῖς
  choice: chefs des prêtres
  rationale: Désigne les principaux responsables sacerdotaux, et non plusieurs titulaires de la fonction de grand prêtre.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Rend la fonction de ces experts des Écritures et de la Loi de façon claire pour un lectorat moderne, sans les confondre avec de simples copistes.
- source_word: τοῦ λαοῦ
  choice: du peuple
  rationale: Préserve le génitif grec sans ajouter dans le texte une précision ethnique absente de la formulation.
- source_word: ἐπυνθάνετο παρ’ αὐτῶν
  choice: leur demanda
  rationale: Formulation française naturelle pour s’informer auprès de quelqu’un; l’imparfait grec présente la démarche en cours, mais le passé simple convient au fil narratif français sans imposer l’idée non certaine de demandes répétées.
- source_word: ποῦ
  choice: où
  rationale: Équivalent direct de l’adverbe interrogatif.
- source_word: ὁ χριστὸς
  choice: le Messie
  rationale: Dans ce contexte juif d’attente prophétique, Χριστός fonctionne comme le titre de l’oint attendu; « Messie » rend ce titre plutôt que de le traiter comme un nom propre.
- source_word: γεννᾶται
  choice: devait naître
  rationale: Dans cette interrogation indirecte située dans un récit au passé et portant sur une naissance attendue, cette tournure française exprime naturellement l’orientation prospective du présent grec.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: La question porte sur le souverain oint attendu d’après les prophéties juives. « Messie » rend clairement la fonction du titre dans ce contexte, tandis que « Christ » reste une traduction traditionnelle possible.
translation_notes:
  register: Français international moderne, naturel et digne. « Spécialistes de la Loi » privilégie la compréhension immédiate; « chefs des prêtres » évite l’ambiguïté de « grands prêtres ». La syntaxe coordonnée conserve clairement l’ordre des actions.
