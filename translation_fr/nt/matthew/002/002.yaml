id: MAT.2.2
reference: Matthew 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγοντες· Ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/002.yaml
  text: saying[b][a], “Where is the one who has been born king of the Jews? For we saw his star in the east and have come to pay him homage.”
translation:
  language: fr
  text: 'Ils disaient : « Où est celui qui est né roi des Juifs ? En effet, nous avons vu son étoile en Orient[a] et nous sommes venus lui rendre hommage[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à son lever ». L’expression grecque peut désigner l’Orient ou le lever de l’étoile.
    reason: alternative_reading
  - marker: b
    text: Ou « l’adorer ». Le verbe grec peut désigner l’hommage rendu à un roi ou l’adoration, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Ils disaient
  rationale: Le participe présent introduit directement les paroles des mages. Cette tournure française s’intègre naturellement au récit tout en conservant l’idée de parole.
- source_word: Ποῦ ἐστιν
  choice: Où est
  rationale: Question locative directe, sans ajout ni atténuation.
- source_word: ὁ τεχθεὶς
  choice: celui qui est né
  rationale: Le participe aoriste passif substantivé désigne la personne qui est née. Cette formulation préserve la construction grecque sans préciser indûment qu’il s’agit d’un nouveau-né.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: roi des Juifs
  rationale: Rendu naturel du titre royal, qui en conserve la portée politique et messianique.
- source_word: εἴδομεν γὰρ
  choice: En effet, nous avons vu
  rationale: « En effet » exprime la fonction explicative de γάρ. Le passé composé convient à une observation passée dont les conséquences demeurent présentes au moment où les mages parlent.
- source_word: αὐτοῦ τὸν ἀστέρα
  choice: son étoile
  rationale: Le pronom au génitif est rendu comme un possessif, sans définir la nature exacte du signe céleste.
- source_word: ἐν τῇ ἀνατολῇ
  choice: en Orient
  rationale: ἀνατολή peut désigner l’est ou le lever d’un astre. « En Orient » retient ici le sens géographique traditionnel tout en laissant l’autre sens dans une note.
- source_word: ἤλθομεν
  choice: nous sommes venus
  rationale: Le passé composé traduit naturellement en discours direct une venue accomplie qui explique la présence actuelle des locuteurs.
- source_word: προσκυνῆσαι αὐτῷ
  choice: lui rendre hommage
  rationale: Le verbe peut désigner la prosternation ou l’hommage rendu à un souverain, ainsi que l’adoration selon le contexte. Le cadre immédiat est celui de l’honneur rendu à un roi, sans exclure la portée théologique plus large du récit.
theological_decisions:
- issue: Sens de προσκυνῆσαι à propos de Jésus enfant
  choice: lui rendre hommage
  alternative: l’adorer
  rationale: Dans le contexte immédiat, les mages cherchent le « roi des Juifs » et veulent lui rendre un honneur royal. Le choix principal préserve ce cadre sans trancher prématurément toute la portée christologique du verbe; la note maintient explicitement la possibilité du sens cultuel.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe directe convient à un récit biblique accessible; « celui qui est né roi des Juifs » conserve étroitement le lien entre la naissance et le titre royal.
