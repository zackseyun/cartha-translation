source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ καὶ ⸀εἰσῆλθεν εἰς γῆν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/021.yaml
  text: So he rose, took the child and his mother, and entered the land of Israel.
translation:
  language: fr
  text: Il se leva donc, prit l’enfant et sa mère, et entra dans le pays d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: donc
  rationale: Ici, δέ assure la progression du récit plutôt qu’une opposition marquée. « donc » relie naturellement l’action à l’ordre reçu dans les versets précédents.
- source_word: ἐγερθεὶς
  choice: se leva
  rationale: Le participe aoriste passif est employé ici avec un sens intransitif et exprime une action antérieure à celle du verbe principal. La coordination française rend naturellement cette succession.
- source_word: παρέλαβε
  choice: prit
  rationale: Dans ce contexte, παραλαμβάνω signifie prendre avec soi. « prit » est idiomatique et maintient la formulation récurrente du récit de l’enfance chez Matthieu.
- source_word: τὸ παιδίον
  choice: l’enfant
  rationale: παιδίον désigne simplement l’enfant déjà connu dans le récit, sans qu’il soit nécessaire d’ajouter « jeune ».
- source_word: τὴν μητέρα αὐτοῦ
  choice: sa mère
  rationale: Le pronom αὐτοῦ renvoie naturellement à l’enfant. « sa mère » reproduit la construction grecque de façon concise.
- source_word: εἰσῆλθεν
  choice: entra
  rationale: εἰσέρχομαι signifie entrer ou aller dans. « entra » convient au mouvement vers le territoire indiqué et au registre narratif.
- source_word: εἰς γῆν Ἰσραήλ
  choice: dans le pays d’Israël
  rationale: L’expression désigne le territoire d’Israël. « le pays d’Israël » est naturel en français et conserve la portée géographique et nationale du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la progression narrative et la répétition matthéenne centrée sur « l’enfant et sa mère », sans explicitation théologique ajoutée.
