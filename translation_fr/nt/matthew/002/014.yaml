id: MAT.2.14
reference: Matthew 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἐγερθεὶς παρέλαβε τὸ παιδίον καὶ τὴν μητέρα αὐτοῦ νυκτὸς καὶ ἀνεχώρησεν εἰς Αἴγυπτον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/014.yaml
  text: So he got up[a], took the child and his mother during the night, and departed for Egypt.
translation:
  language: fr
  text: Alors il se leva, prit l’enfant et sa mère de nuit, et partit pour l’Égypte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: donc
  rationale: Connecteur narratif léger, δέ fait progresser le récit tout en reliant l’action de Joseph à l’ordre reçu au verset précédent.
- source_word: ἐγερθεὶς
  choice: il se leva
  rationale: Le participe aoriste exprime l’action initiale de Joseph. Une proposition coordonnée est plus naturelle en français moderne que « s’étant levé ».
- source_word: παρέλαβε
  choice: prit
  rationale: Dans ce contexte, παραλαμβάνω signifie prendre des personnes avec soi; « prit » est clair et concis.
- source_word: τὸ παιδίον
  choice: l’enfant
  rationale: Traduction directe de παιδίον, sans ajouter une précision d’âge absente du texte.
- source_word: τὴν μητέρα αὐτοῦ
  choice: sa mère
  rationale: Le possessif renvoie naturellement à l’enfant, conformément à la construction grecque.
- source_word: νυκτὸς
  choice: pendant la nuit
  rationale: Le génitif temporel situe l’action durant la nuit; cette formulation est courante et explicite en français moderne.
- source_word: ἀνεχώρησεν
  choice: partit
  rationale: ἀναχωρέω indique ici que Joseph quitte les lieux pour une autre destination. « Partit » rend naturellement ce mouvement sans expliciter davantage le motif.
- source_word: εἰς Αἴγυπτον
  choice: pour l’Égypte
  rationale: εἰς marque la destination; avec « partir », la tournure française idiomatique est « partir pour ».
theological_decisions: []
translation_notes:
  register: 'Français moderne, simple et digne. La construction participiale grecque est rendue par une suite de verbes conjugués afin de préserver la progression rapide du récit. La note de la couche anglaise n’a pas été reprise: son marqueur est attaché à « got up » alors que son contenu concerne la destination, et « pour l’Égypte » rend directement et sans difficulté εἰς Αἴγυπτον.'
