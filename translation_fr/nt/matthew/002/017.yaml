  yaml_path: translation/nt/matthew/002/017.yaml
  text: 'Then what was spoken through Jeremiah the prophet was fulfilled[a], saying:'
translation:
  language: fr
  text: 'Alors s’accomplit ce qui avait été dit par le prophète Jérémie :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans le récit de Matthieu.
- source_word: ἐπληρώθη
  choice: s’accomplit
  rationale: Rend l’aoriste passif et conserve la formule d’accomplissement caractéristique de Matthieu.
- source_word: τὸ ῥηθὲν
  choice: ce qui avait été annoncé
  rationale: Rend le participe substantivé de manière idiomatique; « annoncé » convient à une parole prophétique, tandis que le plus-que-parfait situe cette parole avant son accomplissement.
- source_word: διὰ Ἰερεμίου
  choice: par l’intermédiaire de Jérémie
  rationale: Préserve la valeur médiatrice de διά avec le génitif, sans réduire Jérémie à la source ultime de la parole.
- source_word: τοῦ προφήτου
  choice: du prophète
  rationale: Identifie simplement la fonction de Jérémie, conformément à l’apposition grecque.
- source_word: λέγοντος
  choice: ':'
  rationale: Le deux-points introduit naturellement en français la citation qui suit; la valeur de parole est déjà exprimée par « annoncé », ce qui évite un lourd « disant ».
theological_decisions:
- issue: Formule matthéenne de l’accomplissement
  choice: Conserver explicitement le verbe « s’accomplir »
  alternative: « arriva afin d’accomplir »
  rationale: Le grec affirme que la parole prophétique s’est accomplie, sans expliciter ici une construction finale.
- issue: Médiation de la parole prophétique
  choice: « par l’intermédiaire du prophète Jérémie »
  alternative: « par le prophète Jérémie »
  rationale: Cette formulation maintient la nuance instrumentale de διά et laisse intacte la compréhension théologique de la source de la parole.
translation_notes:
  register: Français moderne, digne et fluide. La formulation évite le calque peu naturel « disant » tout en maintenant le lien direct avec la citation du verset suivant.
