  text: Φωνὴ ἐν Ῥαμὰ ⸀ἠκούσθη, κλαυθμὸς καὶ ὀδυρμὸς πολύς· Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς, καὶ οὐκ ἤθελεν παρακληθῆναι ὅτι οὐκ εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/018.yaml
  text: 'A voice was heard in Ramah[a], weeping and great mourning: Rachel weeping for her children, and she was not willing to be comforted[c][b], because they are no more.'
translation:
  language: fr
  text: '« Une voix s’est fait entendre à Rama : des pleurs et une grande lamentation. Rachel pleure ses enfants et ne voulait pas se laisser consoler[a], parce qu’ils ne sont plus[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « refusait d’être consolée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « parce qu’ils ne sont pas ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Φωνὴ ἐν Ῥαμὰ ἠκούσθη
  choice: Une voix s’est fait entendre à Rama
  rationale: Cette formulation garde « voix » et la tournure passive du grec, tout en étant naturelle en français. « À Rama » est l’usage français courant avec un nom de ville.
- source_word: κλαυθμὸς καὶ ὀδυρμὸς πολύς
  choice: des pleurs et une grande lamentation
  rationale: « Pleurs » rend l’expression audible du chagrin, tandis que « grande lamentation » conserve le second nom et l’intensification exprimée par πολύς.
- source_word: Ῥαχὴλ κλαίουσα τὰ τέκνα αὐτῆς
  choice: Rachel pleure ses enfants
  rationale: Le présent français restitue l’image vive et continue du participe présent grec; « enfants » garde toute l’étendue de τέκνα sans la limiter aux fils.
- source_word: οὐκ ἤθελεν παρακληθῆναι
  choice: ne voulait pas se laisser consoler
  rationale: La traduction conserve la volonté exprimée par θέλω et le sens passif de παρακληθῆναι, dans une tournure française idiomatique.
- source_word: ὅτι οὐκ εἰσίν
  choice: parce qu’ils ne sont plus
  rationale: Cette expression française transmet l’ellipse funèbre du grec sans ajouter explicitement « morts » ni déterminer davantage la nature de leur absence.
theological_decisions:
- issue: Nature de Rachel dans la citation prophétique
  choice: Conserver Rachel comme figure maternelle nommée, sans expliquer son rôle symbolique dans le texte principal.
  alternative: Identifier explicitement Rachel aux mères d’Israël ou la présenter comme une mère historique parlant littéralement.
  rationale: Le grec présente simplement Rachel dans la citation de Jérémie. La traduction préserve ainsi la portée typologique et la tension poétique sans imposer une interprétation.
translation_notes:
  register: Français international moderne, solennel et accessible. La citation conserve son parallélisme poétique, l’image de Rachel et l’expression volontairement abrupte de la perte.
