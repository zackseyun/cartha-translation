id: MAT.2.23
reference: Matthew 2:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν κατῴκησεν εἰς πόλιν λεγομένην Ναζαρέτ, ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τῶν προφητῶν ὅτι Ναζωραῖος κληθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/023.yaml
  text: 'And he came and lived in a city called Nazareth[a], so that what was spoken through the prophets might be fulfilled: “He will be called a Nazarene.”'
translation:
  language: fr
  text: 'Il vint s’établir dans une ville appelée Nazareth[a], afin que s’accomplisse ce qui avait été annoncé par l’intermédiaire des prophètes : « Il sera appelé Nazaréen. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Nazoréen ». L’arrière-plan prophétique exact de la déclaration « Il sera appelé Nazaréen » fait débat; Matthieu résume peut-être plusieurs thèmes présents chez les prophètes plutôt que de citer un passage précis.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Il vint
  rationale: Le participe aoriste, antérieur au verbe principal, est rendu par un verbe conjugué qui marque naturellement la succession des actions.
- source_word: κατῴκησεν
  choice: s’établir
  rationale: Le verbe désigne le fait de prendre résidence; « s’établir » convient au déplacement vers Nazareth sans imposer une permanence absolue.
- source_word: εἰς πόλιν λεγομένην Ναζαρέτ
  choice: dans une ville appelée Nazareth
  rationale: Avec le verbe de résidence, « dans » est idiomatique en français. « Ville » correspond directement à πόλις.
- source_word: ὅπως πληρωθῇ
  choice: afin que s’accomplisse
  rationale: Cette formulation naturelle conserve la valeur finale et la formule matthéenne de l’accomplissement.
- source_word: τὸ ῥηθὲν
  choice: ce qui avait été annoncé
  rationale: Le plus-que-parfait situe la parole prophétique avant son accomplissement; « annoncé » exprime ici une parole prophétique sans lourdeur.
- source_word: διὰ τῶν προφητῶν
  choice: par l’intermédiaire des prophètes
  rationale: Cette expression garde la nuance de médiation portée par διά avec le génitif et maintient le pluriel du texte grec.
- source_word: Ναζωραῖος
  choice: Nazaréen
  rationale: « Nazaréen » est en français la désignation usuelle liée à Nazareth; la variante formelle « Nazoréen » est signalée en note.
- source_word: κληθήσεται
  choice: Il sera appelé
  rationale: Cette traduction conserve le futur passif et le style de la déclaration prophétique.
theological_decisions:
- issue: Nature de la citation d’accomplissement sans source vétérotestamentaire exacte
  choice: Conserver dans le texte la référence collective aux « prophètes », sans identifier une prophétie précise.
  alternative: Y voir une allusion à Ésaïe 11.1, un résumé du thème prophétique du Messie méprisé, ou traduire le terme par « naziréen ».
  rationale: Le grec emploie explicitement le pluriel « les prophètes ». Il convient donc de préserver une possible synthèse thématique plutôt que d’imposer une identification débattue. « Naziréen » renverrait en outre au vœu de naziréat, distinction que le terme grec employé ici ne justifie pas.
- issue: Traduction de Ναζωραῖος
  choice: Nazaréen
  alternative: Nazoréen
  rationale: Le contexte associe cette désignation à Nazareth. La forme usuelle est retenue dans le texte, tandis que la forme plus proche du grec et l’incertitude concernant l’arrière-plan prophétique sont préservées en note.
translation_notes:
  register: Français moderne, international et digne. La phrase reste fluide tout en conservant la formule d’accomplissement, le pluriel « prophètes » et l’ambiguïté réelle de l’allusion prophétique.
