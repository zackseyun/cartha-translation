id: MAT.2.15
reference: Matthew 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἦν ἐκεῖ ἕως τῆς τελευτῆς Ἡρῴδου· ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος· Ἐξ Αἰγύπτου ἐκάλεσα τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/015.yaml
  text: and was there until the death of Herod[a], so that what was spoken by the Lord through the prophet might be fulfilled, saying[c][b], “Out of Egypt I called my son.”
translation:
  language: fr
  text: 'et il y resta jusqu’à la mort d’Hérode, afin que s’accomplisse ce que le Seigneur avait dit par l’intermédiaire du prophète : « D’Égypte, j’ai appelé mon fils. »[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Hors d’Égypte, j’ai appelé mon fils. »'
    reason: Variante de traduction possible pour Ἐξ Αἰγύπτου, qui peut souligner davantage le mouvement hors du pays.
  - marker: b
    text: Matthieu cite Osée 11.1, qui, dans son contexte initial, parle d’Israël comme du fils de Dieu; ici, il présente Jésus comme accomplissant cette parole de l’Écriture.
    reason: La note donne la référence et signale le rapport intertextuel sans imposer une théorie unique de l’accomplissement.
lexical_decisions:
- source_word: καὶ ἦν ἐκεῖ
  choice: et il y resta
  rationale: Le grec dit littéralement « et il était là ». En français narratif, « il y resta » exprime naturellement la durée indiquée par ἕως, sans modifier le sens contextuel.
- source_word: ἕως τῆς τελευτῆς Ἡρῴδου
  choice: jusqu’à la mort d’Hérode
  rationale: τελευτή désigne ici la mort, c’est-à-dire la fin de la vie. La construction nominale est conservée dans un français naturel.
- source_word: ἵνα πληρωθῇ
  choice: afin que s’accomplisse
  rationale: Cette formulation garde la valeur finale ou consécutive de ἵνα et le passif de πληρόω, sans imposer une théorie particulière de l’accomplissement.
- source_word: τὸ ῥηθὲν ὑπὸ κυρίου
  choice: ce que le Seigneur avait dit
  rationale: L’antériorité du propos prophétique est naturellement rendue par le plus-que-parfait français. Le passif grec est transposé à l’actif pour éviter une tournure lourde, tout en gardant le Seigneur comme source de la parole.
- source_word: διὰ τοῦ προφήτου
  choice: par l’intermédiaire du prophète
  rationale: διά avec le génitif présente le prophète comme médiateur de la parole dont le Seigneur est la source ultime.
- source_word: λέγοντος
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement la citation et rendent la fonction du participe λέγοντος sans le calque pesant « disant ».
- source_word: Ἐξ Αἰγύπτου
  choice: D’Égypte
  rationale: « D’Égypte » est la formulation française la plus naturelle pour exprimer le point de départ marqué par ἐξ; « hors d’Égypte » demeure une possibilité plus imagée.
- source_word: ἐκάλεσα
  choice: j’ai appelé
  rationale: καλέω signifie ici appeler, avec l’idée contextuelle de faire venir ou sortir. « Appeler » conserve aussi le lien verbal avec Osée 11.1.
- source_word: τὸν υἱόν μου
  choice: mon fils
  rationale: υἱός désigne précisément le fils; cette formulation préserve le langage filial commun à la citation d’Osée et à son emploi par Matthieu.
theological_decisions:
- issue: Nature de l’accomplissement d’Osée 11.1
  choice: Conserver la formule « afin que s’accomplisse » sans préciser le mécanisme de l’accomplissement.
  alternative: Présenter explicitement soit une prédiction directe, soit une récapitulation typologique d’Israël en Jésus.
  rationale: Matthieu affirme l’accomplissement, tandis qu’Osée 11.1 parle dans son contexte d’Israël comme fils de Dieu. La traduction doit préserver cette relation et sa tension sans imposer une explication théologique absente du verset.
- issue: Traduction de κύριος
  choice: le Seigneur
  alternative: l’Éternel
  rationale: Le texte grec porte κυρίου. « Le Seigneur » traduit directement ce titre sans introduire dans le corps du texte une restitution particulière du nom divin hébreu.
translation_notes:
  register: Français international moderne, digne et accessible. « Il y resta » évite le littéralisme peu naturel « il était là »; « par l’intermédiaire du prophète » maintient clairement la distinction entre la source divine et le médiateur humain.
