source:
  edition: SBLGNT
  text: Τότε Ἡρῴδης λάθρᾳ καλέσας τοὺς μάγους ἠκρίβωσεν παρ’ αὐτῶν τὸν χρόνον τοῦ φαινομένου ἀστέρος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/002/007.yaml
  text: Then Herod secretly summoned the magi and determined from them the time when the star had appeared,[a]
translation:
  language: fr
  text: Alors Hérode convoqua secrètement les mages[a] et se fit préciser par eux le moment où l’étoile était apparue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les sages ». Le grec μάγοι désigne plus précisément des mages, c’est-à-dire des savants orientaux associés notamment à l’astrologie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement la succession narrative en français moderne.
- source_word: Ἡρῴδης
  choice: Hérode
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: λάθρᾳ
  choice: secrètement
  rationale: Rend clairement le caractère dissimulé de la démarche d’Hérode.
- source_word: καλέσας
  choice: convoqua
  rationale: Le participe aoriste exprime ici une action préalable étroitement liée au verbe principal; une forme verbale coordonnée est naturelle en français, et « convoqua » suggère une invitation délibérée et officielle.
- source_word: τοὺς μάγους
  choice: les mages
  rationale: Transposition directe de μάγοι, terme désignant ici des savants orientaux associés notamment à l’astrologie, sans importer les développements ultérieurs de la tradition.
- source_word: ἠκρίβωσεν
  choice: se fit préciser
  rationale: Le verbe indique qu’Hérode obtient auprès d’eux un renseignement exact; cette tournure rend à la fois la précision et παρ’ αὐτῶν dans un français idiomatique.
- source_word: παρ’ αὐτῶν
  choice: par eux
  rationale: Avec « se fit préciser », le complément indique naturellement les personnes auprès desquelles Hérode obtient le renseignement.
- source_word: τὸν χρόνον
  choice: le moment
  rationale: Dans ce contexte, χρόνος vise le point temporel de l’apparition; « le moment » est plus idiomatique que « le temps ».
- source_word: τοῦ φαινομένου ἀστέρος
  choice: où l’étoile était apparue
  rationale: La proposition temporelle rend naturellement le groupe participial génitif et situe l’apparition de l’étoile avant l’enquête d’Hérode.
