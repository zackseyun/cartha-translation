  text: καὶ ἰδόντες αὐτὸν ⸀προσεκύνησαν, οἱ δὲ ἐδίστασαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/017.yaml
  text: And when they saw him[a], they worshiped him, but some doubted.
translation:
  language: fr
  text: Quand ils le virent, ils l’adorèrent, mais certains eurent des doutes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « hésitèrent » ou « furent indécis ». Le grec peut évoquer une incertitude ou un vacillement plutôt qu’une incrédulité arrêtée.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἰδόντες
  choice: quand ils le virent
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français, qui conserve son rapport avec les verbes principaux.
- source_word: προσεκύνησαν
  choice: ils l’adorèrent
  rationale: 'Dans le contexte de l’apparition de Jésus ressuscité, le verbe exprime ici plus qu’un simple geste de politesse : il désigne un acte de profonde révérence pouvant être compris comme une adoration.'
- source_word: οἱ δὲ
  choice: mais certains
  rationale: La tournure grecque introduit un contraste et désigne vraisemblablement une partie du groupe ; le français exige que ce sous-ensemble soit explicité.
- source_word: ἐδίστασαν
  choice: eurent des doutes
  rationale: Cette formulation garde le sens courant de doute sans présenter nécessairement une incrédulité ferme et durable ; la note signale les nuances d’hésitation et d’incertitude du grec.
theological_decisions:
- issue: Portée de προσκυνέω envers Jésus ressuscité
  choice: ils l’adorèrent
  alternative: ils se prosternèrent devant lui ; ils lui rendirent hommage
  rationale: Le contexte de la résurrection et l’orientation de l’acte vers Jésus donnent au verbe une forte portée cultuelle. « Adorèrent » rend cette portée sans ajouter d’explication doctrinale au texte.
- issue: Nuance de διστάζω
  choice: eurent des doutes
  alternative: hésitèrent ; furent indécis
  rationale: Le grec peut désigner une hésitation ou un vacillement plutôt qu’une incrédulité arrêtée. Le texte principal conserve le terme usuel lié au doute, tandis que la note maintient l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque ; « eurent des doutes » reste compréhensible et préserve la tension du passage.
