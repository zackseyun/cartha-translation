id: MAT.28.8
reference: Matthew 28:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπελθοῦσαι ταχὺ ἀπὸ τοῦ μνημείου μετὰ φόβου καὶ χαρᾶς μεγάλης ἔδραμον ἀπαγγεῖλαι τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/008.yaml
  text: And leaving the tomb quickly[a], with fear and great joy, they ran to report to his disciples.
translation:
  language: fr
  text: Elles quittèrent rapidement le tombeau et coururent, avec crainte[a] et une grande joie, l’annoncer à ses disciples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec une crainte révérencielle et une grande joie ». Le mot grec traduit par « crainte » peut aussi exprimer ici une attitude de révérence.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθοῦσαι
  choice: Elles quittèrent
  rationale: Le participe aoriste décrit le départ des femmes hors du tombeau. Une proposition coordonnée est plus naturelle en français tout en conservant l’enchaînement de l’action.
- source_word: ταχὺ
  choice: rapidement
  rationale: L’adverbe exprime la hâte de manière directe et naturelle.
- source_word: μνημείου
  choice: tombeau
  rationale: Dans ce contexte funéraire et narratif, « tombeau » est le terme français courant et précis.
- source_word: μετὰ φόβου καὶ χαρᾶς μεγάλης
  choice: saisies de crainte et d’une grande joie
  rationale: Cette formulation idiomatique présente les deux émotions simultanées sans effacer leur tension. « Crainte » laisse ouverte la nuance de peur ou de profond respect.
- source_word: ἔδραμον
  choice: coururent
  rationale: Le verbe désigne explicitement l’action de courir; le passé simple convient au registre narratif biblique moderne et soutenu.
- source_word: ἀπαγγεῖλαι
  choice: l’annoncer
  rationale: L’infinitif exprime le but de leur course. Le pronom reprend naturellement en français la nouvelle reçue dans le contexte, sans en préciser davantage le contenu.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: à ses disciples
  rationale: « Disciples » est le terme relationnel établi pour les μαθηταί de Jésus, et « ses » conserve la référence à Jésus.
theological_decisions:
- issue: Tension entre les émotions des femmes
  choice: saisies de crainte et d’une grande joie
  alternative: remplies d’un profond respect et d’une grande joie
  rationale: Le grec associe φόβος et joie sans résoudre φόβος en simple peur ni en seule révérence. Le texte principal préserve donc cette tension, tandis que la note signale la nuance possible.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient une narration écrite fluide. La structure française évite un participe présent lourd, tout en préservant la rapidité du départ, la coexistence de la crainte et de la joie, puis la course vers les disciples.
