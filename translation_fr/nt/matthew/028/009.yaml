id: MAT.28.9
reference: Matthew 28:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ ⸀ἰδοὺ Ἰησοῦς ⸀ὑπήντησεν αὐταῖς λέγων· Χαίρετε· αἱ δὲ προσελθοῦσαι ἐκράτησαν αὐτοῦ τοὺς πόδας καὶ προσεκύνησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/009.yaml
  text: And behold[a], Jesus met them, saying, “Greetings!” And they came up, took hold of his feet[b], and worshiped him.
translation:
  language: fr
  text: 'Et voici que Jésus vint à leur rencontre et leur dit : « Je vous salue ! »[a] Elles s’approchèrent, lui saisirent les pieds et l’adorèrent[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Réjouissez-vous ! » Le grec est littéralement un impératif pluriel, mais il sert ici vraisemblablement de salutation.
    reason: lexical_alternative
  - marker: b
    text: Ou « se prosternèrent devant lui » ou « lui rendirent hommage ». Le verbe grec peut désigner la prosternation, l’hommage ou l’adoration ; dans ce contexte de résurrection, « adorèrent » exprime probablement le mieux sa portée.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction de mise en relief et la vivacité narrative du marqueur grec, dans un français naturel et digne.
- source_word: ὑπήντησεν
  choice: vint à leur rencontre
  rationale: Exprime clairement la rencontre sur leur chemin, sans charger le verbe d’une nuance étrangère au contexte.
- source_word: Χαίρετε
  choice: Je vous salue !
  rationale: Rend la fonction habituelle de salutation de cet impératif pluriel, tout en gardant un registre actuel et digne. Le sens littéral lié à la joie est signalé en note.
- source_word: προσελθοῦσαι
  choice: Elles s’approchèrent
  rationale: Marque simplement le mouvement vers Jésus avant les deux actions suivantes.
- source_word: ἐκράτησαν αὐτοῦ τοὺς πόδας
  choice: lui saisirent les pieds
  rationale: Traduit le contact physique ferme exprimé par κρατέω, sans la violence que pourrait suggérer « empoignèrent ».
- source_word: προσεκύνησαν αὐτῷ
  choice: l’adorèrent
  rationale: Dans le contexte de la rencontre avec Jésus ressuscité, « adorer » rend bien la forte portée religieuse probable du verbe, tout en indiquant en note les sens gestuels ou honorifiques possibles.
theological_decisions:
- issue: Sens de προσκυνέω à l’égard de Jésus ressuscité
  choice: l’adorèrent
  alternative: se prosternèrent devant lui ; lui rendirent hommage
  rationale: Le contexte postérieur à la résurrection donne vraisemblablement au geste une portée cultuelle. La note conserve toutefois l’étendue sémantique du grec, qui peut désigner une prosternation ou un hommage.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici que » conserve la mise en relief du grec ; « Je vous salue ! » évite à la fois l’archaïsme et la familiarité excessive. Les marqueurs de notes sont placés immédiatement après les expressions auxquelles ils se rapportent.
