- from: Et si cela vient aux oreilles du gouverneur[a], nous le convaincrons et nous vous éviterons tout ennui[b].
  to: Et si cela vient aux oreilles du gouverneur[a], nous le persuaderons et nous ferons en sorte que vous n’ayez aucun souci[b].
  rationale: La révision conserve l'expression idiomatique qui rend le passif grec (« vient aux oreilles ») et le titre historique « gouverneur ». Elle corrige la construction finale en français, rétablit plus exactement le sens de πείθω par « persuader » et ajuste la note littérale pour qu'elle corresponde à la structure grecque.
