source:
  edition: SBLGNT
  text: καὶ ἐὰν ἀκουσθῇ τοῦτο ⸀ἐπὶ τοῦ ἡγεμόνος, ἡμεῖς πείσομεν ⸀αὐτὸν καὶ ὑμᾶς ἀμερίμνους ποιήσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/014.yaml
  text: And if this is heard by the governor, we will persuade him and keep you out of trouble.
translation:
  language: fr
  text: Et si cela vient aux oreilles du gouverneur[a], nous le persuaderons et nous ferons en sorte que vous n’ayez aucun souci[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si cela est porté à la connaissance du gouverneur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « nous vous rendrons sans inquiétude ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκουσθῇ
  choice: vient aux oreilles
  rationale: Le passif de ἀκούω indique ici que l’affaire devient connue. Cette expression française naturelle conserve l’image de l’audition sans préciser indûment qui ferait le rapport.
- source_word: ἐπὶ τοῦ ἡγεμόνος
  choice: du gouverneur
  rationale: Avec le verbe « entendre », ἐπί suivi du génitif situe l’affaire dans la sphère d’attention du gouverneur. « Vient aux oreilles du gouverneur » exprime clairement ce sens en français.
- source_word: ἡγεμόνος
  choice: gouverneur
  rationale: Dans ce contexte romain, ἡγεμών désigne le gouverneur provincial, c’est-à-dire Pilate. « Gouverneur » est précis et usuel.
- source_word: πείσομεν αὐτόν
  choice: nous le convaincrons
  rationale: πείθω signifie normalement « persuader » ou « convaincre ». La traduction garde l’objet implicite de la persuasion sans développer la manière dont les chefs comptent apaiser le gouverneur.
- source_word: ἀμερίμνους
  choice: à l’abri de tout ennui
  rationale: L’adjectif signifie littéralement « sans souci » ou « sans inquiétude ». Dans le contexte, il s’agit des conséquences disciplinaires que risquent les gardes ; « tout ennui » en rend naturellement la portée sans la limiter explicitement à une sanction juridique.
- source_word: ποιήσομεν
  choice: nous vous éviterons
  rationale: ποιέω accompagné d’un adjectif attributif signifie « rendre » quelqu’un dans un certain état. Avec « tout ennui », la formulation idiomatique française « nous vous éviterons » exprime ce résultat.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. L’expression « vient aux oreilles » restitue l’idée que l’affaire parvient à l’attention du gouverneur, tandis que « éviterons tout ennui » rend la conséquence concrète promise aux gardes. Les notes préservent les formulations plus explicite et plus littérale.
