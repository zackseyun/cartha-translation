base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/001.yaml
  text: After the Sabbath[a], as it was dawning toward the first day of the week, Mary Magdalene and the other Mary came to look at the tomb.
translation:
  language: fr
  text: Après le sabbat[a], alors que le premier jour de la semaine commençait à poindre, Marie de Magdala et l’autre Marie vinrent voir le tombeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tard le jour du sabbat, alors que le premier jour de la semaine commençait à poindre. » L’expression grecque initiale peut signifier soit « après le sabbat », soit « tard le jour du sabbat ».'
    reason: Lecture alternative de l’expression temporelle grecque Ὀψὲ σαββάτων.
lexical_decisions:
- source_word: Ὀψὲ δὲ σαββάτων
  choice: Après le sabbat
  rationale: Avec le génitif, ὀψέ peut indiquer le temps qui suit un événement. Dans ce contexte, « après le sabbat » exprime naturellement la séquence temporelle. Le pluriel σαββάτων a ici la valeur idiomatique du singulier « sabbat ». La légère valeur connective de δέ n’exige pas de mot distinct en français.
- source_word: τῇ ἐπιφωσκούσῃ εἰς μίαν σαββάτων
  choice: quand commençait à poindre le premier jour de la semaine
  rationale: ἐπιφώσκω évoque ici l’apparition de la lumière du jour, tandis que εἰς marque la progression vers le premier jour. Cette formulation française restitue l’aube et le mouvement temporel sans calquer maladroitement le grec.
- source_word: ἦλθεν
  choice: vinrent
  rationale: L’aoriste de ἔρχομαι décrit simplement leur venue au tombeau. Le passé simple convient au récit suivi et « vinrent » conserve le point de vue du texte.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Marie de Magdala
  rationale: Le qualificatif désigne Marie par son origine, Magdala. « Marie de Magdala » est une forme française claire et courante.
- source_word: ἡ ἄλλη Μαρία
  choice: l’autre Marie
  rationale: ἄλλη distingue cette Marie de Marie de Magdala sans préciser davantage son identité dans ce verset.
- source_word: θεωρῆσαι
  choice: voir
  rationale: θεωρέω désigne un regard intentionnel ou attentif. « Voir le tombeau » reste naturel en français et n’ajoute pas l’idée plus forte d’une inspection.
- source_word: τὸν τάφον
  choice: le tombeau
  rationale: τάφος désigne ici le lieu où Jésus a été enseveli. « Tombeau » est l’équivalent moderne le plus précis dans ce contexte.
theological_decisions:
- issue: Moment indiqué au début du récit de la résurrection
  choice: Le texte situe la venue des femmes après le sabbat, au moment où commence le premier jour de la semaine.
  alternative: L’expression initiale peut aussi être comprise comme « tard le jour du sabbat ».
  rationale: Ὀψὲ σαββάτων admet les deux analyses. Le texte principal retient « après le sabbat », qui s’accorde le mieux avec la mention du jour commençant à poindre, tandis que la note conserve explicitement l’autre lecture sans chercher à résoudre la tension par harmonisation.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. La phrase évite un calque lourd de « vers le premier jour » tout en conservant l’idée de progression temporelle grâce à « commençait à poindre ».
