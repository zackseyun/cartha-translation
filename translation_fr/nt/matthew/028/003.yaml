  text: ἦν δὲ ἡ εἰδέα αὐτοῦ ⸀ὡς ἀστραπὴ καὶ τὸ ἔνδυμα αὐτοῦ λευκὸν ὡς χιών.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/003.yaml
  text: His appearance was like lightning[a], and his clothing white as snow.
translation:
  language: fr
  text: Son aspect était comme l’éclair[a], et son vêtement blanc comme la neige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « apparence » ou « forme ».
    reason: Alternative lexicale pour εἰδέα, qui peut désigner l’aspect visible, l’apparence ou la forme extérieure.
lexical_decisions:
- source_word: δὲ
  choice: non traduit explicitement
  rationale: Connecteur narratif léger; la continuité avec le verset précédent est naturelle en français sans « alors » ni « mais ».
- source_word: εἰδέα
  choice: aspect
  rationale: Le mot désigne l’apparence visible ou la forme extérieure. « Aspect » est naturel et précis dans ce contexte.
- source_word: ὡς ἀστραπή
  choice: comme l’éclair
  rationale: Conserve la comparaison explicite et emploie une formulation française idiomatique.
- source_word: ἔνδυμα
  choice: vêtement
  rationale: Terme général qui ne précise pas indûment le type d’habit.
- source_word: λευκόν
  choice: blanc
  rationale: Rend directement la couleur sans ajouter une idée d’éclat qui n’est pas explicitement portée par l’adjectif.
- source_word: ὡς χιών
  choice: comme la neige
  rationale: Préserve la seconde comparaison et exprime naturellement en français la blancheur du vêtement.
theological_decisions:
- issue: Référent de αὐτοῦ
  choice: Conserver le possessif « son »; il renvoie à l’ange mentionné dans le contexte immédiat.
  alternative: Rendre explicitement « l’aspect de l’ange » afin d’écarter toute confusion avec Jésus.
  rationale: Le plus proche antécédent est l’ange du Seigneur du verset 2. Garder le pronom respecte la formulation grecque sans introduire dans ce verset un nom absent du texte.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve les deux comparaisons parallèles et la concision du grec.
