  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πορευομένων δὲ αὐτῶν ἰδού τινες τῆς κουστωδίας ἐλθόντες εἰς τὴν πόλιν ἀπήγγειλαν τοῖς ἀρχιερεῦσιν ἅπαντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/011.yaml
  text: While they were going[a], behold[b], some of the guard came into the city and reported to the chief priests everything that had happened.
translation:
  language: fr
  text: Pendant qu’elles étaient en chemin[a], voici[b] que quelques membres de la garde se rendirent dans la ville et rapportèrent aux principaux prêtres tout ce qui s’était passé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pendant qu’elles s’en allaient ». Le grec emploie une construction qui établit le cadre temporel de l’événement suivant.
    reason: lexical_alternative
  - marker: b
    text: « Voici que » rend le marqueur d’attention grec ἰδού, qui signale un développement soudain ou remarquable dans le récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορευομένων δὲ αὐτῶν
  choice: Pendant qu’elles étaient en chemin
  rationale: Le génitif absolu établit l’arrière-plan temporel, tandis que δέ marque la transition narrative. Le féminin renvoie naturellement aux femmes du contexte précédent, sans préciser une destination que le grec ne répète pas ici.
- source_word: ἰδού
  choice: voici que
  rationale: Cette tournure française conserve la fonction de marqueur d’attention et souligne l’arrivée soudaine d’un développement notable, tout en restant naturelle dans un récit digne.
- source_word: τινες τῆς κουστωδίας
  choice: quelques hommes de la garde
  rationale: κουστωδία désigne ici le détachement placé au tombeau. « Quelques hommes de la garde » exprime clairement qu’une partie seulement de ce groupe agit.
- source_word: ἐλθόντες εἰς τὴν πόλιν
  choice: se rendirent dans la ville
  rationale: Le participe aoriste désigne une action liée à celle du verbe principal. « Se rendirent » rend naturellement le déplacement sans imposer en français le point de vue déictique de « vinrent ».
- source_word: ἀπήγγειλαν
  choice: rapportèrent
  rationale: Le verbe exprime la transmission d’un compte rendu; « rapportèrent » convient à l’information remise à des autorités.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: aux chefs des prêtres
  rationale: Cette expression actuelle et intelligible rend le titre collectif des principaux responsables sacerdotaux juifs, sans suggérer qu’il existait simultanément plusieurs grands prêtres en fonction.
- source_word: ἅπαντα τὰ γενόμενα
  choice: tout ce qui s’était passé
  rationale: La formulation préserve la totalité renforcée par ἅπαντα et situe naturellement en français les événements avant le compte rendu.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Voici que » conserve le relief narratif du grec sans l’archaïsme plus marqué de « voici ». Le pronom féminin explicite seulement le genre imposé par le référent contextuel, les femmes mentionnées aux versets précédents.
