source:
  edition: SBLGNT
  text: οἱ δὲ λαβόντες ⸀τὰ ἀργύρια ἐποίησαν ὡς ἐδιδάχθησαν. Καὶ διεφημίσθη ὁ λόγος οὗτος παρὰ Ἰουδαίοις μέχρι τῆς σήμερον ⸀ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/015.yaml
  text: So they took the silver and did as they had been instructed[a]. And this story has been spread among the Jews to this day.
translation:
  language: fr
  text: Ils prirent l’argent et firent comme on le leur avait indiqué. Et ce récit[a] s’est répandu parmi les Juifs jusqu’à aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce rapport » ou « cette version ». Le mot grec λόγος peut désigner une parole, un propos, un rapport ou un récit selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβόντες
  choice: prirent
  rationale: Le participe aoriste marque ici une action antérieure au verbe principal. « Prirent » s’insère naturellement dans la suite narrative et renvoie à l’argent donné au verset précédent.
- source_word: τὰ ἀργύρια
  choice: l’argent
  rationale: Le terme désigne de l’argent, au sens concret de somme versée. En français actuel, « l’argent » est plus naturel que « l’argent métal » et n’ajoute pas la précision de « pièces d’argent ».
- source_word: ἐποίησαν
  choice: firent
  rationale: Le verbe courant ποιέω signifie ici « faire » ou « exécuter ». « Firent » maintient le lien direct avec la proposition qui précise la manière d’agir.
- source_word: ὡς ἐδιδάχθησαν
  choice: ce qu’on leur avait appris
  rationale: Le passif de διδάσκω signifie littéralement qu’ils ont été enseignés ou instruits. Dans ce contexte, la tournure française indique qu’on leur a appris quoi dire ou faire, sans préciser explicitement un agent absent du grec.
- source_word: διεφημίσθη
  choice: s’est répandu
  rationale: Le passif exprime la large diffusion d’une nouvelle ou d’un récit. Le passé composé convient à une diffusion commencée dans le passé et présentée comme durable jusqu’au temps de l’auteur.
- source_word: ὁ λόγος οὗτος
  choice: ce récit
  rationale: λόγος peut désigner une parole, un propos, un rapport ou un récit. Ici, il renvoie à l’explication mensongère mise en circulation au sujet du corps de Jésus. « Récit » reste naturel sans trancher autant que « rumeur » sur sa véracité intrinsèque.
- source_word: παρὰ Ἰουδαίοις
  choice: parmi les Juifs
  rationale: Avec παρά suivi du datif, l’expression signifie « parmi » ou « chez ». Cette formulation désigne le milieu dans lequel le récit circulait, sans étendre la portée de l’énoncé au-delà du cadre narratif.
- source_word: μέχρι τῆς σήμερον ἡμέρας
  choice: jusqu’à aujourd’hui
  rationale: Cette expression idiomatique indique que la diffusion se poursuivait jusqu’au présent de l’auteur. « Jusqu’à aujourd’hui » est clair et naturel en français international.
theological_decisions:
- issue: Portée de Ἰουδαίοις dans un contexte susceptible d’être généralisé de manière polémique
  choice: parmi les Juifs
  alternative: parmi les Judéens
  rationale: Le sens immédiat est la circulation du récit au sein de la communauté juive évoquée par Matthieu. « Juifs » est le rendu lexical direct; « Judéens » donnerait ici une nuance principalement géographique que le contexte n’impose pas. La formulation ne doit pas être comprise comme un jugement général sur tous les Juifs.
- issue: Qualification du λόγος diffusé
  choice: ce récit
  alternative: cette version / cette nouvelle
  rationale: Le grec nomme ce qui s’est diffusé sans employer lui-même un mot signifiant explicitement « mensonge » ou « rumeur ». « Récit » préserve cette retenue lexicale, tandis que le contexte précédent permet au lecteur d’en évaluer la véracité.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure simple et narrative. Le marqueur « donc » rend δέ dans sa fonction de transition consécutive. Le singulier collectif « l’argent » est idiomatique et fidèle au référent.
