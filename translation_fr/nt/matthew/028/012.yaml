    issue: La note a dit littéralement « beaucoup d’argent » au sens d’argent monnayé.
    rationale: Le grec porte ἀργύρια ἱκανά, soit littéralement de l’« argent »/des « sommes d’argent » en quantité « considérable » ou « importante ». « Beaucoup » est une paraphrase possible, non le littéral, et « pièces » est plus précis que le texte ne l’exige.
