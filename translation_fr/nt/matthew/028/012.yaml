source:
  edition: SBLGNT
  text: καὶ συναχθέντες μετὰ τῶν πρεσβυτέρων συμβούλιόν τε λαβόντες ἀργύρια ἱκανὰ ἔδωκαν τοῖς στρατιώταις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/012.yaml
  text: And after gathering with the elders and taking counsel[a], they gave a considerable sum of silver to the soldiers,
translation:
  language: fr
  text: Après s’être réunis avec les anciens et avoir tenu conseil, ils donnèrent aux soldats une forte somme d’argent[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une somme considérable d’argent ». Le grec mentionne littéralement une quantité considérable d’« argent » (ἀργύρια), terme qui peut désigner de l’argent monnayé selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθέντες
  choice: Ils se réunirent
  rationale: Le participe aoriste passif est employé ici au sens de « se rassembler ». Une proposition conjuguée rend naturellement en français la succession des actions.
- source_word: μετὰ τῶν πρεσβυτέρων
  choice: avec les anciens
  rationale: μετά avec le génitif exprime l’association. « Les anciens » est le terme usuel pour ces responsables.
- source_word: συμβούλιόν τε λαβόντες
  choice: et, après avoir tenu conseil
  rationale: L’expression idiomatique συμβούλιον λαμβάνω désigne une délibération commune. « Tenir conseil » en conserve le sens sans préciser indûment le contenu de la décision.
- source_word: ἀργύρια ἱκανὰ
  choice: une forte somme d’argent
  rationale: Le pluriel ἀργύρια désigne de l’argent monnayé, littéralement lié à l’argent métal, et ἱκανὰ en souligne ici la quantité importante. Cette formulation est naturelle et conserve en français le terme « argent ».
- source_word: ἔδωκαν
  choice: donnèrent
  rationale: Rendu direct de l’aoriste de δίδωμι.
- source_word: τοῖς στρατιώταις
  choice: aux soldats
  rationale: στρατιώταις signifie littéralement « soldats » ; leur fonction de gardes dans le contexte ne justifie pas de remplacer le terme.
theological_decisions:
- issue: Identification du sujet sous-entendu
  choice: « Ils » renvoie aux grands prêtres mentionnés au verset précédent.
  alternative: Un groupe non précisé.
  rationale: Les participes et le verbe sont au masculin pluriel, et leur sujet se poursuit naturellement depuis Matthieu 28.11. La traduction garde toutefois le pronom, puisque le grec ne répète pas explicitement « les grands prêtres ».
translation_notes:
  register: Français moderne, digne et courant. « Tenir conseil » conserve la nuance délibérative de l’idiome grec. La virgule finale est maintenue parce que le verset se poursuit dans la phrase du verset suivant.
