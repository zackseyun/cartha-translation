- from: 'Puis allez vite dire à ses disciples : « Il a été ressuscité d’entre les morts et, regardez, il vous précède en Galilée. C’est là que vous le verrez. » Voilà, je vous l’ai dit.'
  to: 'Puis allez vite dire à ses disciples : « Il a été ressuscité d’entre les morts et voici qu’il vous précède en Galilée. C’est là que vous le verrez. » Voilà, je vous l’ai dit.'
  rationale: Révision limitée au premier rendu de ἰδού et à son enchaînement avec προάγει, afin d’obtenir une formulation française plus naturelle et de mieux faire ressortir le mouvement anticipateur vers la Galilée. Le passif volontairement non attribué de « a été ressuscité » est conservé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T02:08:49Z'
review_pass:
  verdict: revise
  source_fidelity: Le projet conserve bien l’impératif d’aller annoncer, l’urgence de ταχὺ, le passif de Ἠγέρθη sans nommer l’agent, la destination en Galilée et la promesse de voir Jésus. Toutefois, « il vous précède en Galilée » peut en français situer l’action en Galilée plutôt qu’exprimer clairement le mouvement « devant vous vers/en Galilée » ; « vous attend en Galilée » ajouterait aussi une nuance absente du grec. « Voici qu’il vous précède en Galilée » maintient l’orientation contextuelle sans surcharge.
  naturalness: « Regardez » inséré dans le discours rapporté est grammatical mais quelque peu abrupt et conversationnel pour ἰδού dans cette annonce. « Voici qu’ » est courant, clair et digne en français moderne. La formule finale « Voilà, je vous l’ai dit » reste naturelle et rend adéquatement l’énoncé conclusif.
  terminology: « Il a été ressuscité d’entre les morts » rend fidèlement le passif aoriste Ἠγέρθη ἀπὸ τῶν νεκρῶν et conserve l’agent implicite. « Galilée » et « disciples » sont appropriés. Aucun terme théologique ne requiert de note.
  issues:
  - severity: low
    issue: Rendu du premier ἰδού et de προάγει
    rationale: « Regardez, il vous précède en Galilée » est compréhensible, mais « regardez » est moins idiomatique ici et la construction peut légèrement obscurcir l’idée qu’il va devant les disciples en direction de la Galilée. « Voici qu’il vous précède en Galilée » est plus fluide tout en restant proche du grec.
  revised_text: 'Puis allez vite dire à ses disciples : « Il a été ressuscité d’entre les morts et voici qu’il vous précède en Galilée. C’est là que vous le verrez. » Voilà, je vous l’ai dit.'
