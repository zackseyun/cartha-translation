source:
  edition: SBLGNT
  text: καὶ ταχὺ πορευθεῖσαι εἴπατε τοῖς μαθηταῖς αὐτοῦ ὅτι Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἰδοὺ προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν, ἐκεῖ αὐτὸν ὄψεσθε· ἰδοὺ εἶπον ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/007.yaml
  text: And go quickly and tell his disciples, ‘He has been raised from the dead, and look, he is going ahead of you into Galilee. There you will see him.’ Look, I have told you.
translation:
  language: fr
  text: 'Puis allez vite dire à ses disciples : « Il a été ressuscité d’entre les morts et voici qu’il vous précède en Galilée. C’est là que vous le verrez. » Voilà, je vous l’ai dit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταχὺ πορευθεῖσαι εἴπατε
  choice: allez vite dire
  rationale: Rend naturellement en français l’enchaînement des participes et de l’impératif, tout en conservant l’urgence de ταχύ.
- source_word: Ἠγέρθη
  choice: Il a été ressuscité
  rationale: Conserve la forme passive grecque et son possible sous-entendu théologique, sans préciser explicitement l’agent.
- source_word: προάγει ὑμᾶς
  choice: il vous précède
  rationale: Exprime le sens contextuel d’aller en avant des disciples vers la Galilée.
- source_word: ἰδοὺ
  choice: regardez / Voilà
  rationale: Le premier emploi attire l’attention sur l’annonce; le dernier marque avec naturel la déclaration solennelle et conclusive de l’ange.
theological_decisions:
- issue: Le passif de Ἠγέρθη
  choice: Il a été ressuscité
  alternative: Il est ressuscité
  rationale: La formulation retenue préserve le passif du texte source et évite de transformer implicitement la construction en actif ou en état résultant.
- issue: L’agent de la résurrection
  choice: Ne pas le nommer
  alternative: Dieu l’a ressuscité
  rationale: L’agent est théologiquement implicite, mais il n’est pas exprimé dans ce verset; la traduction conserve cette retenue.
translation_notes:
  register: Français international moderne, clair et digne. « Regardez » évite l’archaïsme de « voici » dans le premier emploi; « Voilà, je vous l’ai dit » restitue idiomatiquement la conclusion, sans alourdir le verset.
