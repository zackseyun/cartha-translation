  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἄγγελος εἶπεν ταῖς γυναιξίν· Μὴ φοβεῖσθε ὑμεῖς, οἶδα γὰρ ὅτι Ἰησοῦν τὸν ἐσταυρωμένον ζητεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/005.yaml
  text: But the angel answered and said to the women[a], “Do not be afraid[b]; for I know that you are seeking Jesus who has been crucified.”
translation:
  language: fr
  text: 'Mais l’ange répondit aux femmes : « Vous, n’ayez pas peur[a], car je sais que vous cherchez Jésus, celui qui a été crucifié[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec exprime explicitement « vous » pour mettre l’accent sur les femmes auxquelles cette parole rassurante est adressée.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire plus brièvement : « Jésus, le crucifié » ou « Jésus qui fut crucifié ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: prit la parole et dit
  rationale: Cette formule narrative française restitue naturellement la tournure grecque « ayant répondu… dit », sans donner à penser que l’ange répond nécessairement à une question explicite.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une légère transition contrastive entre la scène effrayante et les paroles rassurantes de l’ange.
- source_word: ὁ ἄγγελος
  choice: l’ange
  rationale: Dans ce contexte de résurrection, il s’agit clairement d’un être angélique et non d’un simple messager humain.
- source_word: Μὴ φοβεῖσθε ὑμεῖς
  choice: Vous, n’ayez pas peur
  rationale: L’antéposition de « Vous » rend de façon naturelle en français la présence emphatique du pronom grec ὑμεῖς, tandis que « n’ayez pas peur » est l’expression courante de la défense rassurante.
- source_word: οἶδα γὰρ ὅτι
  choice: car je sais que
  rationale: « Car » conserve la valeur explicative de γάρ, et « que » introduit directement le contenu du savoir de l’ange.
- source_word: Ἰησοῦν τὸν ἐσταυρωμένον
  choice: Jésus, celui qui a été crucifié
  rationale: Cette formulation conserve la valeur attributive du participe passif parfait et présente la crucifixion comme un acte accompli dont le résultat demeure pertinent.
- source_word: ζητεῖτε
  choice: vous cherchez
  rationale: Le présent français convient au présent grec et exprime naturellement l’action en cours dans ce contexte.
theological_decisions:
- issue: Valeur emphatique du pronom ὑμεῖς dans la parole rassurante de l’ange
  choice: Vous, n’ayez pas peur
  alternative: N’ayez pas peur
  rationale: Le grec nomme explicitement le pronom sujet, normalement implicite dans la forme verbale, et distingue ainsi les femmes dans cette scène. La traduction garde cette insistance sans préciser davantage la nature du contraste.
- issue: Portée du participe parfait passif τὸν ἐσταυρωμένον
  choice: celui qui a été crucifié
  alternative: le crucifié ; celui qui fut crucifié
  rationale: Le parfait grec évoque un acte accompli avec une pertinence persistante. La formulation retenue préserve cet aspect sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Prit la parole et dit » garde la formule narrative grecque sans lourdeur excessive. L’ordre « Vous, n’ayez pas peur » est marqué, comme l’est le grec, mais demeure idiomatique en français.
