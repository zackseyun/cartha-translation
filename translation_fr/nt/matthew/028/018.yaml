id: MAT.28.18
reference: Matthew 28:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ Ἰησοῦς ἐλάλησεν αὐτοῖς λέγων· Ἐδόθη μοι πᾶσα ἐξουσία ἐν οὐρανῷ καὶ ἐπὶ ⸀τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/018.yaml
  text: And Jesus came near and spoke to them[a], saying[b], “All authority in heaven and on earth has been given to me.”
translation:
  language: fr
  text: 'Jésus s’approcha et leur parla en ces termes : « Toute autorité[b] dans le ciel et sur la terre m’a été donnée[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « me fut donnée ». L’aoriste passif grec présente l’acte comme accompli ; le passé composé du texte principal en exprime naturellement la portée actuelle en français.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pouvoir ». Le mot grec ἐξουσία désigne plus précisément l’autorité, le droit ou la souveraineté légitime, et non seulement la puissance ou la capacité d’agir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: s’approcha
  rationale: Le participe aoriste de προσέρχομαι indique que Jésus se déplace vers les disciples avant de parler. « S’approcha » conserve ce mouvement avec naturel en français.
- source_word: ἐλάλησεν αὐτοῖς λέγων
  choice: leur parla en ces termes
  rationale: Cette formulation française rend le verbe « parler », son complément indirect et le participe qui introduit le discours direct, sans la lourdeur de « leur parla, disant ».
- source_word: Ἐδόθη μοι
  choice: m’a été donnée
  rationale: 'Le passé composé passif exprime naturellement en français un acte accompli dont le résultat demeure actuel : Jésus possède désormais l’autorité qui lui a été donnée.'
- source_word: πᾶσα ἐξουσία
  choice: toute autorité
  rationale: Avec ce nom abstrait au singulier, πᾶσα exprime la totalité. ἐξουσία désigne ici l’autorité légitime ou le droit de gouverner, plutôt que la seule capacité d’agir.
- source_word: ἐν οὐρανῷ καὶ ἐπὶ τῆς γῆς
  choice: dans le ciel et sur la terre
  rationale: Cette tournure idiomatique conserve le contraste spatial et l’étendue universelle de l’affirmation grecque.
theological_decisions:
- issue: Nature de l’autorité universelle de Jésus
  choice: Toute autorité dans le ciel et sur la terre m’a été donnée
  alternative: Tout pouvoir dans le ciel et sur la terre m’a été donné
  rationale: La traduction conserve le passif du grec, sans transformer l’énoncé en simple affirmation de possession intrinsèque. « Autorité » met en valeur la souveraineté légitime exprimée par ἐξουσία, tout en laissant intacte la tension théologique liée au fait que cette autorité est donnée au Fils ressuscité.
translation_notes:
  register: Français international moderne, digne et accessible. « Leur parla en ces termes » introduit naturellement la citation tout en représentant les deux formes verbales grecques. La ponctuation française et les espaces typographiques sont adaptées à une publication courante.
