  verdict: revise
  source_fidelity: Le sens impératif de πορευθέντες… μαθητεύσατε, la portée universelle de πάντα τὰ ἔθνη, et la fonction de βαπτίζοντες sont bien rendus. Toutefois, « dans le nom » est un calque peu idiomatique en français et ne rend pas de façon sûre la valeur relationnelle possible de εἰς ; « au nom de » est la formulation française établie et naturelle, accompagnée d’une note qui conserve la nuance du grec.
  naturalness: La phrase est globalement claire et de registre biblique moderne. « Au nom du Père, du Fils et du Saint-Esprit » est nettement plus naturel et intelligible pour un lectorat francophone international que « dans le nom ».
  terminology: « Père », « Fils » et « Saint-Esprit » sont les titres français usuels et leur capitalisation est appropriée. « Baptiser » évite à juste titre de déterminer le mode du rite. La note doit décrire εἰς comme « dans/vers » plutôt que d’affirmer que « dans le nom » est à lui seul une traduction française littérale satisfaisante.
  issues:
  - severity: medium
    issue: « dans le nom » est une formulation non idiomatique en français moderne.
    rationale: Bien que εἰς puisse porter une nuance directionnelle, le calque français est opaque et maladroit. « Au nom de » est l’équivalent idiomatique traditionnel ; une note peut préserver la nuance relationnelle ou d’identification que peut suggérer le grec.
