id: MAT.28.19
reference: Matthew 28:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πορευθέντες ⸀οὖν μαθητεύσατε πάντα τὰ ἔθνη, ⸀βαπτίζοντες αὐτοὺς εἰς τὸ ὄνομα τοῦ πατρὸς καὶ τοῦ υἱοῦ καὶ τοῦ ἁγίου πνεύματος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/019.yaml
  text: Therefore[a], go and make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit,
translation:
  language: fr
  text: Allez donc et faites de toutes les nations des disciples, en les baptisant au nom[a] du Père, du Fils et du Saint-Esprit,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie littéralement une préposition signifiant « dans » ou « vers le nom », ce qui peut évoquer l’entrée dans une relation ou une identification.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες
  choice: Allez
  rationale: Le participe aoriste placé avant l’impératif principal prend ici une valeur étroitement liée à l’ordre missionnaire. « Allez » rend naturellement cette force en français, sans la réduire à une circonstance secondaire comme pourrait le faire « chemin faisant ».
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque l’inférence tirée de la déclaration d’autorité de Jésus au verset précédent, avec une fluidité naturelle en français contemporain.
- source_word: μαθητεύσατε
  choice: faites … des disciples
  rationale: Le verbe exprime l’action d’amener des personnes à devenir disciples. Cette tournure française claire conserve sa valeur causative.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Cette expression garde la portée universelle de ἔθνη, qui désigne ici les nations ou les peuples, sans la restreindre aux seuls non-Juifs.
- source_word: βαπτίζοντες
  choice: en les baptisant
  rationale: Le participe est rattaché à l’action de faire des disciples. « Baptiser » désigne le rite chrétien sans trancher la question confessionnellement disputée de son mode.
- source_word: εἰς τὸ ὄνομα
  choice: dans le nom
  rationale: La préposition εἰς exprime normalement un mouvement vers ou une entrée dans. « Dans le nom » conserve ici la possible idée d’entrée en relation ou d’identification, tandis que la formulation française traditionnelle « au nom » est signalée en note.
- source_word: τοῦ πατρὸς
  choice: du Père
  rationale: Dans cette formule coordonnée, « Père » est un titre divin et prend donc la majuscule.
- source_word: τοῦ υἱοῦ
  choice: du Fils
  rationale: Le terme est employé comme titre divin en coordination avec le Père et le Saint-Esprit; la majuscule en rend clairement la valeur.
- source_word: τοῦ ἁγίου πνεύματος
  choice: du Saint-Esprit
  rationale: Il s’agit de la désignation personnelle divine usuelle en français moderne. Le trait d’union suit l’usage orthographique biblique courant.
theological_decisions:
- issue: Traduction de la préposition baptismale εἰς dans la formule trinitaire
  choice: dans le nom
  alternative: au nom
  rationale: « Dans le nom » reflète le sens directionnel de εἰς et laisse percevoir l’entrée en relation ou l’identification, sans imposer une théorie sacramentelle particulière. « Au nom » reste une traduction idiomatique et traditionnelle possible, indiquée en note.
- issue: Lecture personnelle et capitalisation de Père, Fils et Saint-Esprit
  choice: du Père, du Fils et du Saint-Esprit
  alternative: du père, du fils et de l’esprit saint
  rationale: Le nom singulier suivi de trois compléments coordonnés forme une formule baptismale où ces termes fonctionnent comme des titres divins personnels. Les majuscules le signalent sans développer le texte au-delà de sa formulation.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conserve l’impératif missionnaire principal et rattache naturellement le baptême à l’action de faire des disciples. « Dans le nom » est volontairement moins traditionnel afin de préserver la nuance de εἰς; la note fournit l’expression française consacrée.
