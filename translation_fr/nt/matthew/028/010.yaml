id: MAT.28.10
reference: Matthew 28:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε λέγει αὐταῖς ὁ Ἰησοῦς· Μὴ φοβεῖσθε· ὑπάγετε ἀπαγγείλατε τοῖς ἀδελφοῖς μου ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν, κἀκεῖ με ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/010.yaml
  text: Then Jesus said to them[a], “Do not be afraid. Go, tell my brothers to go to Galilee[c][b], and there they will see me.”
translation:
  language: fr
  text: 'Alors Jésus leur dit : « N’ayez pas peur. Allez dire à mes frères[a] de se rendre en Galilée ; là, ils me verront. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « mes frères » désigne les disciples de Jésus. Le grec emploie un nom masculin pluriel.
    reason: Précision du référent et conservation de la formulation grecque.
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans un récit en français moderne.
- source_word: λέγει αὐταῖς
  choice: Jésus leur dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit français. « Leur » reprend les femmes mentionnées dans le contexte sans explicitation superflue.
- source_word: Μὴ φοβεῖσθε
  choice: N’ayez pas peur
  rationale: Formulation idiomatique, claire et actuelle de l’interdiction grecque.
- source_word: ὑπάγετε ἀπαγγείλατε
  choice: Allez dire
  rationale: Cette expression française concise restitue les deux impératifs et l’idée de transmettre un message sans la raideur de « allez annoncer » ou « faites un rapport ».
- source_word: τοῖς ἀδελφοῖς μου
  choice: à mes frères
  rationale: Conserve le terme familial masculin du grec au lieu de le remplacer dans le texte par l’interprétation « disciples ».
- source_word: ἵνα ἀπέλθωσιν εἰς τὴν Γαλιλαίαν
  choice: de se rendre en Galilée
  rationale: Rend naturellement en français le contenu de l’ordre indirect exprimé par ἵνα avec le subjonctif, tout en conservant le mouvement vers la Galilée.
- source_word: κἀκεῖ με ὄψονται
  choice: là, ils me verront
  rationale: Traduction directe qui conserve le sens ordinaire de ὄψονται, « voir », sans l’interpréter plus étroitement comme « rencontrer ».
theological_decisions:
- issue: Référent de « mes frères »
  choice: Maintenir « mes frères » dans le texte, avec une note indiquant le référent contextuel.
  alternative: Remplacer l’expression par « mes disciples ».
  rationale: Dans le contexte immédiat, Jésus parle de ses disciples, mais le maintien du terme familial préserve la formulation grecque et sa portée théologique sans substituer une explication au texte.
translation_notes:
  register: Français moderne, international et digne. Le discours est direct et naturel ; « se rendre en Galilée » évite la répétition lourde de « aller » après « Allez » tout en exprimant fidèlement le déplacement demandé.
