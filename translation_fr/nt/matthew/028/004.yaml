id: MAT.28.4
reference: Matthew 28:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τοῦ φόβου αὐτοῦ ἐσείσθησαν οἱ τηροῦντες καὶ ἐγενήθησαν ⸀ὡς νεκροί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/004.yaml
  text: And from fear of him the guards shook and became like dead men[a].
translation:
  language: fr
  text: Par peur de lui, les gardes tremblèrent et devinrent comme morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À cause de la peur qu’il leur inspirait, ceux qui montaient la garde furent ébranlés et devinrent comme morts. »'
    reason: Alternative plus formelle qui explicite la valeur causale de ἀπό et rend littéralement le participe ainsi que la forme passive de ἐσείσθησαν.
lexical_decisions:
- source_word: ἀπὸ
  choice: par
  rationale: Avec le génitif, ἀπό exprime ici la cause de la réaction. « Par peur » rend cette causalité de façon concise et naturelle en français.
- source_word: δὲ
  choice: enchaînement implicite
  rationale: δέ est un connecteur narratif léger. En français, l’enchaînement avec le verset précédent reste fluide sans ajouter un « mais » trop contrastif ni un « alors » plus marqué.
- source_word: φόβου αὐτοῦ
  choice: peur de lui
  rationale: Cette formulation conserve au plus près la relation exprimée par le génitif tout en désignant naturellement l’être angélique du contexte comme objet ou cause de la peur.
- source_word: ἐσείσθησαν
  choice: tremblèrent
  rationale: Le passif de σείω peut signifier « furent ébranlés » et, appliqué à des personnes saisies de peur, « tremblèrent ». Ce dernier choix est direct, vivant et idiomatique.
- source_word: οἱ τηροῦντες
  choice: les gardes
  rationale: Le participe substantivé signifie littéralement « ceux qui montaient la garde ». Dans le contexte du tombeau surveillé, « les gardes » est précis et naturel.
- source_word: ἐγενήθησαν
  choice: devinrent
  rationale: Le verbe indique un changement d’état; « devinrent » préserve cette nuance plutôt que de la réduire à « furent ».
- source_word: ὡς νεκροί
  choice: comme morts
  rationale: ὡς établit une comparaison et non une identité. « Comme morts » conserve la concision et l’image du grec sans affirmer que les gardes moururent réellement.
theological_decisions:
- issue: Référent de αὐτοῦ (« lui »)
  choice: Le pronom renvoie à l’être angélique décrit au verset précédent.
  alternative: Le pronom pourrait être compris plus largement en rapport avec la manifestation céleste dans son ensemble.
  rationale: L’être angélique est l’antécédent personnel le plus proche, et son aspect est immédiatement décrit avant la réaction des gardes. Le pronom est néanmoins maintenu sans explicitation dans le texte.
translation_notes:
  register: Français moderne, sobre et narratif. « Par peur de lui » garde la brièveté de l’original; « tremblèrent » et « les gardes » privilégient une expression immédiatement compréhensible sans effacer les nuances principales, signalées dans la note.
