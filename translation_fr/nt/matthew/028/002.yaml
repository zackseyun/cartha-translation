id: MAT.28.2
reference: Matthew 28:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς ἐγένετο μέγας· ἄγγελος γὰρ κυρίου καταβὰς ἐξ οὐρανοῦ ⸀καὶ προσελθὼν ἀπεκύλισε τὸν ⸀λίθον καὶ ἐκάθητο ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/002.yaml
  text: And behold, there was a great earthquake, for an angel of the Lord had come down from heaven and came up and rolled away the stone and was sitting on it.
translation:
  language: fr
  text: Et voici qu’il y eut un grand tremblement de terre, car un ange du Seigneur descendit du ciel, s’approcha, écarta la pierre en la roulant et était assis dessus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve le marqueur narratif qui attire vivement l’attention, dans un français actuel et naturel.
- source_word: σεισμὸς … μέγας
  choice: un grand tremblement de terre
  rationale: Rend directement le sens de l’expression grecque et son intensité.
- source_word: ἄγγελος κυρίου
  choice: un ange du Seigneur
  rationale: Traduction littérale et traditionnelle, sans préciser davantage l’identité du Seigneur.
- source_word: προσελθὼν
  choice: s’approcha
  rationale: Exprime le mouvement d’approche indiqué par le participe grec sans ajouter de destination absente du texte.
- source_word: ἀπεκύλισε τὸν λίθον
  choice: roula la pierre
  rationale: Reproduit simplement l’action d’écarter la pierre en la faisant rouler.
- source_word: ἐκάθητο ἐπάνω αὐτοῦ
  choice: s’assit dessus
  rationale: Rend naturellement la position de l’ange sur la pierre, référent immédiat du pronom.
theological_decisions:
- issue: Rapport causal introduit par γάρ
  choice: car
  alternative: en effet
  rationale: « Car » maintient explicitement le lien explicatif ou causal entre le tremblement de terre et la venue de l’ange, sans développer ce que le grec laisse implicite.
- issue: Valeur temporelle de καταβάς
  choice: descendit du ciel
  alternative: était descendu du ciel
  rationale: La traduction au passé simple présente naturellement la suite narrative sans imposer un plus-que-parfait. Le participe aoriste marque une action antérieure à l’action principale, mais le contexte ne requiert pas de fixer davantage la chronologie.
translation_notes:
  register: Français international moderne, narratif et digne. La structure reste proche du grec tout en évitant une accumulation maladroite de participes.
