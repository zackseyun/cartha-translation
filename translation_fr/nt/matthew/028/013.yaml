  source_fidelity: 'Le sens global et la structure de l’ordre rapporté sont fidèles : λέγοντες est bien rendu par « en disant », l’impératif pluriel par « Dites », νυκτός par une expression nocturne, et le génitif absolu par « pendant que nous dormions ». Toutefois, « l’ont volé » n’est pas une formulation française sûre pour rendre ἔκλεψαν αὐτόν : en français moderne, voler quelqu’un signifie normalement le dépouiller, plutôt que l’enlever ou l’emporter. « L’ont enlevé » conserve le pronom personnel sans introduire « son corps » et rend naturellement l’accusation alléguée.'
