  text: λέγοντες· Εἴπατε ὅτι Οἱ μαθηταὶ αὐτοῦ νυκτὸς ἐλθόντες ἔκλεψαν αὐτὸν ἡμῶν κοιμωμένων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/013.yaml
  text: saying[a], “Say[b], ‘His disciples came by night and stole him while we were sleeping.’”
translation:
  language: fr
  text: 'en disant : « Dites : “Ses disciples sont venus de nuit[a] et l’ont enlevé[b] pendant que nous dormions.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pendant la nuit ». Le grec indique le moment où ils seraient venus.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement qu’ils « l’ont volé », avec « lui » comme complément, et non explicitement « son corps ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent introduit le contenu des instructions et conserve le lien syntaxique avec le verset précédent.
- source_word: Εἴπατε
  choice: Dites
  rationale: L’impératif aoriste à la deuxième personne du pluriel exprime un ordre direct, rendu naturellement par « Dites ».
- source_word: ὅτι
  choice: rendu par l’ouverture de la citation
  rationale: ὅτι introduit ici le contenu à rapporter ; en français idiomatique, les deux-points et les guillemets remplissent cette fonction sans ajouter « que ».
- source_word: Οἱ μαθηταὶ αὐτοῦ
  choice: Ses disciples
  rationale: Cette tournure possessive française rend naturellement le groupe grec et renvoie clairement à Jésus.
- source_word: νυκτὸς
  choice: pendant la nuit
  rationale: Le génitif adverbial indique le moment de leur venue. « Pendant la nuit » est actuel, clair et naturel.
- source_word: ἐλθόντες
  choice: sont venus
  rationale: Le participe aoriste désigne une action antérieure ou associée au verbe principal ; le français la rend naturellement par un verbe conjugué coordonné.
- source_word: ἔκλεψαν
  choice: ont volé
  rationale: Le verbe signifie voler ou dérober. « L’ont volé » maintient le sens direct et le complément personnel inhabituel du grec sans ajouter « son corps ».
- source_word: αὐτὸν
  choice: l’
  rationale: Le pronom grec masculin singulier renvoie directement à Jésus. Le pronom français conserve cette formulation sans l’expliciter en « son corps ».
- source_word: ἡμῶν κοιμωμένων
  choice: pendant que nous dormions
  rationale: Cette proposition temporelle rend clairement et naturellement le génitif absolu grec.
theological_decisions:
- issue: Référent de αὐτόν dans le récit fabriqué
  choice: Conserver le pronom personnel « l’ », qui renvoie à Jésus.
  alternative: « son corps »
  rationale: Le grec emploie un pronom personnel et non le mot « corps ». L’expansion « son corps » clarifierait l’idée au prix d’une précision absente du texte et atténuerait sa formulation personnelle.
translation_notes:
  register: Français international moderne, clair et digne. La structure de citation imbriquée distingue l’ordre donné aux gardes des paroles qu’ils doivent rapporter. La formulation volontairement inhabituelle « l’ont volé » préserve le pronom personnel du grec et la tension du récit.
