  terminology: '« Ses disciples » est approprié et le maintien d’un pronom personnel est important ici : le grec dit αὐτόν, non « son corps ». La note doit expliquer la littéralité grecque sans présenter « l’ont volé » comme une tournure française recommandable.'
  issues:
