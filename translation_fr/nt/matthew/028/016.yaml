id: MAT.28.16
reference: Matthew 28:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ δὲ ἕνδεκα μαθηταὶ ἐπορεύθησαν εἰς τὴν Γαλιλαίαν εἰς τὸ ὄρος οὗ ἐτάξατο αὐτοῖς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/016.yaml
  text: The eleven disciples went to Galilee[a], to the mountain where Jesus had directed them,
translation:
  language: fr
  text: Les onze disciples se rendirent en Galilée, sur la montagne que Jésus leur avait indiquée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur avait désignée ». Le verbe grec peut exprimer l’idée de fixer, d’assigner ou d’indiquer.
    reason: alternative lexicale
lexical_decisions:
- source_word: δὲ
  choice: absence de connecteur explicite
  rationale: δέ marque ici une transition narrative légère. En français, l’enchaînement reste naturel sans « mais » ni « alors », qui accentueraient respectivement le contraste ou la temporalité.
- source_word: ἕνδεκα μαθηταὶ
  choice: les onze disciples
  rationale: « Disciples » est le terme établi pour les élèves et compagnons de Jésus; « onze » conserve la précision du texte après la disparition de Judas du groupe.
- source_word: ἐπορεύθησαν
  choice: se rendirent
  rationale: Le verbe exprime un déplacement vers un lieu. « Se rendirent » est naturel dans ce contexte et indique clairement une destination.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: en Galilée
  rationale: Avec le nom d’une région, « en Galilée » est la tournure française idiomatique pour le mouvement vers cette région.
- source_word: εἰς τὸ ὄρος
  choice: sur la montagne
  rationale: ὄρος désigne une montagne ou une hauteur. La préposition française « sur » convient au mouvement vers le lieu situé sur la montagne, tandis que l’article défini en conserve la spécificité.
- source_word: οὗ
  choice: que
  rationale: La relation locale exprimée en grec est rendue naturellement par « la montagne que Jésus leur avait indiquée », où la montagne devient l’objet du verbe en français.
- source_word: ἐτάξατο
  choice: avait indiquée
  rationale: Dans ce contexte, le verbe renvoie à la détermination préalable du lieu de rencontre. « Avait indiquée » communique ce sens sans transformer la phrase en commandement formel.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif est rendu idiomatiquement par le pronom complément indirect « leur ».
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Forme française usuelle du nom personnel.
theological_decisions:
- issue: Nature de la désignation préalable du lieu par Jésus
  choice: « que Jésus leur avait indiquée »
  alternative: « que Jésus leur avait désignée » ou « où Jésus leur avait donné rendez-vous »
  rationale: Le texte rapporte que Jésus avait préalablement fixé ou indiqué le lieu. La formulation choisie préserve cette autorité narrative sans introduire l’idée plus forte d’une nomination institutionnelle ou d’un ordre explicite.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au récit écrit, tandis que le plus-que-parfait marque clairement l’indication antérieure donnée par Jésus. La formulation reste accessible et évite un vocabulaire institutionnel ou confessionnel.
