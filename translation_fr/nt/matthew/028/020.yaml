id: MAT.28.20
reference: Matthew 28:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διδάσκοντες αὐτοὺς τηρεῖν πάντα ὅσα ἐνετειλάμην ὑμῖν· καὶ ἰδοὺ ἐγὼ μεθ’ ὑμῶν εἰμι πάσας τὰς ἡμέρας ἕως τῆς συντελείας τοῦ ⸀αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/020.yaml
  text: teaching them to keep all that I commanded you. And behold[a], I am with you all the days, until the end of the age.
translation:
  language: fr
  text: 'en leur apprenant à observer tout ce que je vous ai commandé. Et voici : moi, je suis avec vous tous les jours, jusqu’à l’achèvement de l’âge[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’à la fin de l’âge » ; traditionnellement, « jusqu’à la fin du monde ». Le grec parle de l’achèvement de l’âge (αἰών), et non précisément du monde physique.
    reason: alternative_reading
lexical_decisions:
- source_word: διδάσκοντες
  choice: en leur apprenant
  rationale: Le participe présent exprime la manière continue de faire des disciples dans le verset précédent. « En leur apprenant » rend naturellement cette relation en français.
- source_word: τηρεῖν
  choice: à observer
  rationale: Dans le contexte de commandements, « observer » réunit l’idée d’obéir et celle de respecter fidèlement, avec plus de naturel que « garder » en français courant.
- source_word: πάντα ὅσα
  choice: tout ce que
  rationale: Cette tournure française concise conserve la portée exhaustive de l’expression grecque.
- source_word: ἐνετειλάμην
  choice: je vous ai commandé
  rationale: « Commander » préserve l’autorité exprimée par ἐντέλλομαι sans prendre le ton excessivement dur de « ordonner ».
- source_word: ἰδοὺ
  choice: Et voici
  rationale: « Voici » attire solennellement l’attention sur la promesse qui suit tout en restant intelligible en français moderne.
- source_word: ἐγὼ μεθ’ ὑμῶν εἰμι
  choice: moi, je suis avec vous
  rationale: Le pronom détaché « moi » rend l’insistance de ἐγώ, tandis que « avec vous » exprime directement la présence promise.
- source_word: πάσας τὰς ἡμέρας
  choice: tous les jours
  rationale: Cette expression rend littéralement et naturellement la continuité jour après jour, plutôt que de la réduire au seul adverbe « toujours ».
- source_word: συντελείας
  choice: achèvement
  rationale: « Achèvement » exprime l’idée d’une période menée à son terme, nuance plus précise qu’une simple cessation.
- source_word: αἰῶνος
  choice: l’âge
  rationale: « L’âge » conserve la référence à une époque ou un ordre temporel et évite de faire dire au grec « le monde » au sens de l’univers physique.
theological_decisions:
- issue: Sens de ἕως τῆς συντελείας τοῦ αἰῶνος
  choice: jusqu’à l’achèvement de l’âge
  alternative: jusqu’à la fin du monde
  rationale: Le grec évoque la consommation ou l’achèvement d’un âge, non explicitement la disparition du monde physique. La formulation retenue préserve cette portée eschatologique sans la préciser davantage.
translation_notes:
  register: Français moderne, digne et accessible. « Et voici » maintient la solennité du marqueur grec ; « moi, je » en restitue l’emphase. « L’âge » est volontairement plus formel afin de préserver la distinction grecque entre αἰών et le monde physique.
