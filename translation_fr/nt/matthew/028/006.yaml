id: MAT.28.6
reference: Matthew 28:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἔστιν ὧδε, ἠγέρθη γὰρ καθὼς εἶπεν· δεῦτε ἴδετε τὸν τόπον ὅπου ⸀ἔκειτο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/028/006.yaml
  text: He is not here[a], for he has been raised, just as he said. Come[b], see the place where he was lying.
translation:
  language: fr
  text: Il n’est pas ici, car il a été ressuscité[a], comme il l’avait dit. Venez voir l’endroit où il était couché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il est ressuscité ». Le verbe grec est de forme passive (« il a été ressuscité »), bien qu’on le traduise souvent par une tournure active.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « où il reposait » ou « où on l’avait déposé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: Il n’est pas ici
  rationale: Cette formulation française naturelle restitue l’énoncé de localisation; le pronom « il » reprend clairement Jésus dans le contexte.
- source_word: ἠγέρθη
  choice: il a été ressuscité
  rationale: Le passé composé passif préserve la forme passive grecque et exprime un événement accompli dont l’effet demeure pertinent.
- source_word: γὰρ
  choice: car
  rationale: « Car » marque avec concision la raison de son absence du tombeau, dans un registre digne et courant.
- source_word: καθὼς εἶπεν
  choice: comme il l’avait dit
  rationale: Le plus-que-parfait rend naturellement en français l’antériorité de la parole de Jésus, tandis que « comme » conserve l’idée de conformité.
- source_word: δεῦτε ἴδετε
  choice: Venez voir
  rationale: L’expression idiomatique française réunit naturellement l’invitation δεῦτε et l’impératif d’inspection ἴδετε.
- source_word: τὸν τόπον
  choice: l’endroit
  rationale: « L’endroit » désigne concrètement l’emplacement dans le tombeau et sonne plus naturel ici que « la place ».
- source_word: ὅπου ἔκειτο
  choice: où il reposait
  rationale: L’imparfait conserve l’aspect statif et duratif de ἔκειτο; « reposait » convient avec dignité à la position du corps dans le tombeau sans transformer le verbe en événement passif explicite.
theological_decisions:
- issue: Voix et agent dans l’affirmation de la résurrection
  choice: il a été ressuscité
  alternative: il est ressuscité
  rationale: Le grec ἠγέρθη est passif dans sa forme. La traduction retenue en conserve la voix sans préciser explicitement l’agent, préservant ainsi la formulation et la tension théologique du texte.
- issue: Sens statif de ὅπου ἔκειτο
  choice: où il reposait
  alternative: où on l’avait déposé
  rationale: Le choix principal décrit l’état ou la position du corps, conformément à la valeur stative de κεῖμαι. L’alternative explicite l’action antérieure d’une manière que la forme grecque n’impose pas.
translation_notes:
  register: Français international moderne, clair et digne. « Il a été ressuscité » conserve la voix du grec malgré une tournure légèrement moins traditionnelle; « Venez voir » est idiomatique, et « reposait » maintient le caractère statif sans archaïsme.
