id: MAT.5.3
reference: Matthew 5:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μακάριοι οἱ πτωχοὶ τῷ πνεύματι, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/003.yaml
  text: Blessed are the poor in spirit[c][b][a], because the kingdom of heaven is theirs.
translation:
  language: fr
  text: Heureux[a] ceux qui sont pauvres en esprit[b], car le royaume des cieux[c] est à eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bénis ». Le mot grec désigne la condition enviable de ceux qui bénéficient de la faveur divine, et non pas seulement un sentiment de bonheur.
    reason: lexical_alternative
  - marker: b
    text: « Pauvres en esprit » peut aussi être compris comme « pauvres spirituellement » ou comme désignant ceux qui reconnaissent leur pauvreté spirituelle. La traduction conserve l’expression grecque sans en restreindre le sens.
    reason: alternative_reading
  - marker: c
    text: Littéralement « royaume des cieux », expression caractéristique de Matthieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Heureux
  rationale: Dans la formule des béatitudes, « heureux » exprime naturellement en français la condition enviable de ceux qui bénéficient de la faveur divine, sans se limiter ici à une émotion passagère.
- source_word: οἱ πτωχοὶ
  choice: ceux qui sont pauvres
  rationale: Cette formulation rend la valeur substantivée de l’adjectif grec tout en restant naturelle en français; elle conserve l’idée de pauvreté sans la réduire à la mendicité.
- source_word: τῷ πνεύματι
  choice: en esprit
  rationale: Le datif précise le domaine ou le rapport dans lequel ils sont pauvres. « En esprit » conserve la formulation concise et l’ouverture interprétative du grec, sans désigner explicitement le Saint-Esprit.
- source_word: ὅτι
  choice: car
  rationale: « Car » introduit avec dignité et naturel le motif de cette déclaration de bonheur.
- source_word: αὐτῶν ἐστιν
  choice: est à eux
  rationale: Cette tournure française rend la possession au présent et conserve la mise en relief de ceux auxquels appartient le royaume.
- source_word: ἡ βασιλεία
  choice: le royaume
  rationale: « Royaume » est le terme français établi et intelligible; il peut évoquer à la fois l’autorité royale et le domaine où elle s’exerce.
- source_word: τῶν οὐρανῶν
  choice: des cieux
  rationale: Le pluriel « des cieux » correspond directement à la forme grecque et appartient à la formulation française traditionnelle et naturelle de l’expression matthéenne.
theological_decisions:
- issue: Sens de « pauvres en esprit »
  choice: Conserver « pauvres en esprit » sans explicitation dans le texte principal.
  alternative: « pauvres spirituellement », « humbles » ou « ceux qui reconnaissent leur besoin spirituel »
  rationale: L’expression grecque demeure ouverte et théologiquement riche. Une paraphrase choisirait une interprétation que le texte ne formule pas explicitement.
- issue: Présent de la possession du royaume
  choice: Rendre ἐστιν au présent par « est à eux ».
  alternative: « sera à eux »
  rationale: Le grec emploie le présent; la traduction ne doit donc pas transformer cette possession en récompense uniquement future.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe garde la cadence mémorable d’une béatitude. « Heureux » est plus naturel que « bienheureux » dans l’usage courant, tandis que « royaume des cieux » préserve l’expression matthéenne établie.
