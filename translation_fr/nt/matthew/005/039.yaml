reference: Matthew 5:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ἀντιστῆναι τῷ πονηρῷ· ἀλλ’ ὅστις σε ⸀ῥαπίζει ⸀εἰς τὴν δεξιὰν ⸀σιαγόνα, στρέψον αὐτῷ καὶ τὴν ἄλλην·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/039.yaml
  text: But I say to you[a], do not resist the evil person. Instead, if anyone slaps you on the right cheek[b], turn the other to him as well.
translation:
  language: fr
  text: 'Mais moi, je vous dis : ne résistez pas à celui qui fait le mal[a]. Au contraire, si quelqu’un te gifle sur la joue droite, tourne aussi vers lui l’autre joue[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « ne résistez pas au mal » ou « ne résistez pas au Mauvais ».'
    reason: 'Le grec τῷ πονηρῷ est ambigu : il peut désigner une personne mauvaise, le mal en général ou le Mauvais.'
  - marker: b
    text: 'Littéralement : « tourne aussi vers lui l’autre »; le mot « joue » est sous-entendu en grec.'
    reason: La note signale l’ellipse du texte grec et la formulation littérale sans alourdir le texte principal.
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Mais moi, je vous dis
  rationale: « Mais » marque le contraste introduit par δέ, tandis que « moi » rend l’insistance portée par le pronom explicite ἐγώ. La tournure reste digne et naturelle en français.
- source_word: μὴ ἀντιστῆναι
  choice: ne résistez pas
  rationale: ἀνθίστημι signifie s’opposer à quelqu’un ou lui résister. « Ne résistez pas » conserve cette portée large sans réduire d’emblée le propos à la seule vengeance ou à l’opposition judiciaire.
- source_word: τῷ πονηρῷ
  choice: à celui qui fait le mal
  rationale: Le contexte immédiat favorise un agresseur humain. Cette formulation française exprime ce sens personnel générique sans identifier nécessairement le référent au diable; les autres analyses grammaticalement possibles sont signalées en note.
- source_word: ῥαπίζει
  choice: gifle
  rationale: ῥαπίζω désigne ici un coup porté de la main au visage. « Gifler » convient au contexte de la joue et garde la dimension d’affront ou d’humiliation.
- source_word: εἰς τὴν δεξιὰν σιαγόνα
  choice: sur la joue droite
  rationale: σιαγών peut désigner la mâchoire ou la joue; avec une gifle, « joue » est le terme français naturel. « Sur » rend idiomatiquement εἰς après le verbe de frappe.
- source_word: ὅστις
  choice: si quelqu’un
  rationale: Dans cette construction à valeur conditionnelle et indéfinie, « si quelqu’un » est naturel en français moderne.
- source_word: στρέψον αὐτῷ καὶ τὴν ἄλλην
  choice: tourne aussi vers lui l’autre joue
  rationale: « Tourne » rend directement στρέψον, et « l’autre joue » explicite le nom sous-entendu par l’adjectif grec. La formulation évite la nuance légèrement plus interprétative de « présente-lui ».
theological_decisions:
- issue: Référent de τῷ πονηρῷ
  choice: 'Sens personnel générique : « celui qui fait le mal »'
  alternative: 'Sens abstrait : « le mal »; ou sens personnel spécifique : « le Mauvais »'
  rationale: L’adjectif substantivé au datif peut être compris comme neutre, masculin générique ou titre personnel. L’exemple qui suit met en scène un agresseur humain, ce qui favorise le sens personnel générique, mais l’ambiguïté réelle est conservée dans la note.
- issue: Portée de l’ordre μὴ ἀντιστῆναι
  choice: 'Formulation générale : « ne résistez pas »'
  alternative: 'Formulation interprétative plus étroite : « ne rendez pas le mal » ou « ne ripostez pas »'
  rationale: Le contexte illustre la non-riposte à une offense, mais le verbe grec a une portée plus large. La traduction ne limite donc pas explicitement le commandement à la vengeance ou aux représailles.
translation_notes:
  register: Français international moderne, clair et digne. Le passage du pluriel « vous » au singulier « te » reproduit celui du grec, qui adresse d’abord l’ensemble des auditeurs puis formule un cas individuel. « Tourne aussi vers lui l’autre joue » reste proche de l’image grecque tout en demeurant compréhensible.
