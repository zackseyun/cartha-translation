source:
  edition: SBLGNT
  text: Ἐρρέθη ⸀δέ· Ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ, δότω αὐτῇ ἀποστάσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/031.yaml
  text: But it was said[a], ‘Whoever divorces his wife, let him give her a certificate of divorce.’
translation:
  language: fr
  text: 'Il a aussi été dit : « Que celui qui divorce de sa femme lui donne un acte de divorce[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que celui qui renvoie sa femme lui donne un document de répudiation. » Le verbe grec peut signifier « renvoyer », mais, dans ce contexte matrimonial et juridique, il désigne le divorce.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρρέθη δέ
  choice: Il a aussi été dit
  rationale: La tournure impersonnelle rend naturellement le passif grec et conserve la formule d’introduction d’une parole citée. Ici, δέ marque surtout la transition vers un nouvel exemple; « aussi » convient mieux au fil du discours français qu’un « mais » fortement adversatif.
- source_word: Ὃς ἂν
  choice: celui qui
  rationale: Cette expression rend la condition générale indéfinie dans un français naturel. Dans la formulation injonctive complète, « Que celui qui… » restitue clairement la portée de l’original.
- source_word: ἀπολύσῃ
  choice: divorce de
  rationale: Bien que le verbe puisse signifier « renvoyer », le contexte matrimonial et la mention de l’acte écrit lui donnent ici le sens juridique de divorcer.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sa femme
  rationale: Le contexte matrimonial impose le sens « femme, épouse » de γυνή, et le possessif masculin de l’original est conservé.
- source_word: δότω αὐτῇ
  choice: lui donne
  rationale: Le subjonctif français introduit par « que » rend naturellement l’impératif grec à la troisième personne, tandis que « lui » exprime le datif.
- source_word: ἀποστάσιον
  choice: un acte de divorce
  rationale: Le terme désigne le document écrit qui officialise la répudiation ou le divorce; « acte de divorce » est clair, actuel et juridiquement intelligible.
theological_decisions:
- issue: Rapport entre cette parole et la disposition mosaïque sur le divorce
  choice: Présenter la phrase comme la citation d’une règle sans y ajouter, dans ce verset, ni approbation ni désapprobation.
  alternative: La traduire de manière interprétative comme une approbation du divorce ou comme une simple description d’un usage.
  rationale: Le verset introduit la formulation à laquelle Jésus répondra au verset suivant. La traduction doit donc préserver la forme juridique citée et la tension théologique du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe « Que celui qui… » conserve le caractère formel de la prescription citée sans devenir archaïque.
