  text: καὶ ὅστις σε ἀγγαρεύσει μίλιον ἕν, ὕπαγε μετ’ αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/041.yaml
  text: And whoever forces you to go one mile[c][b][a], go with him two miles.
translation:
  language: fr
  text: Et si quelqu’un te force à parcourir un mille, parcours-en deux avec lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec peut désigner une réquisition imposée par une autorité, comme celles qui existaient sous la domination romaine ; littéralement : « va avec lui deux », « milles » étant sous-entendu.'
    reason: historical_context; lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: si quelqu’un
  rationale: Le relatif indéfini introduit un cas général. « Si quelqu’un » est naturel en français moderne et conserve cette portée générale.
- source_word: ἀγγαρεύσει
  choice: te force à faire ... avec lui
  rationale: Le verbe désigne le fait de réquisitionner ou de contraindre quelqu’un à un service, notamment sous l’autorité officielle. « Force » rend clairement la coercition sans préciser dans le texte qu’il s’agit d’un soldat romain.
- source_word: μίλιον ἕν
  choice: un mille
  rationale: Il s’agit du mille romain. « Un mille » conserve l’unité historique et la distance concrète du texte source.
- source_word: ὕπαγε μετ’ αὐτοῦ
  choice: fais-en ... avec lui
  rationale: Dans ce contexte de trajet imposé, « faire [une distance] avec quelqu’un » exprime naturellement en français l’idée d’aller ou de parcourir cette distance en sa compagnie.
- source_word: δύο
  choice: deux
  rationale: Le nom « milles » est sous-entendu en grec après le nombre. Le pronom « en » reprend naturellement l’unité en français tout en conservant l’ellipse.
theological_decisions:
- issue: Portée historique et sociale du service imposé
  choice: Présenter une contrainte de trajet sans identifier explicitement son auteur comme un soldat romain.
  alternative: Traduire explicitement comme une réquisition militaire romaine.
  rationale: Le verbe et le mille évoquent fortement les réquisitions pratiquées sous l’autorité romaine, mais le grec ne mentionne ni soldat ni armée. La traduction garde donc la coercition sans ajouter un acteur précis.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le tutoiement singulier du grec et évite le terme technique « réquisitionner » dans le corps du verset. Le mille romain est maintenu plutôt que converti en unité moderne.
