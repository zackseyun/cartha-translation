  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ φῶς τοῦ κόσμου. οὐ δύναται πόλις κρυβῆναι ἐπάνω ὄρους κειμένη·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/014.yaml
  text: You are the light of the world[a]. A city set on a hill cannot be hidden.
translation:
  language: fr
  text: Vous êtes la lumière du monde. Une ville située sur une montagne ne peut pas être cachée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Vous
  rationale: Le pronom grec est explicite et emphatique. En français, « vous » exprime naturellement l’adresse directe au pluriel; l’accent ressort du contexte et de la place du pronom sans qu’il soit nécessaire d’ajouter « vous-mêmes ».
- source_word: τὸ φῶς
  choice: la lumière
  rationale: L’article défini grec est conservé, et la métaphore directe reste intacte.
- source_word: τοῦ κόσμου
  choice: du monde
  rationale: Cette traduction directe du génitif préserve la portée large de κόσμος sans introduire l’interprétation plus fonctionnelle « pour le monde ».
- source_word: οὐ δύναται
  choice: ne peut pas
  rationale: Formulation française naturelle qui exprime l’impossibilité indiquée par le grec.
- source_word: πόλις
  choice: Une ville
  rationale: « Ville » est l’équivalent courant de πόλις et convient à l’image d’une agglomération visible de loin.
- source_word: κρυβῆναι
  choice: être cachée
  rationale: L’infinitif passif est rendu directement, avec l’accord grammatical exigé par « ville ».
- source_word: ἐπάνω ὄρους
  choice: sur une montagne
  rationale: ὄρος désigne normalement une montagne ou une hauteur. « Montagne » conserve ici plus directement le terme grec, sans exclure une hauteur de relief modéré.
- source_word: κειμένη
  choice: située
  rationale: Le participe décrit la position de la ville. « Située » est idiomatique en français et évite de suggérer davantage que le texte qu’elle aurait été intentionnellement placée là.
theological_decisions:
- issue: Identification métaphorique des disciples à la lumière
  choice: « Vous êtes la lumière du monde »
  alternative: « Vous êtes une lumière pour le monde »
  rationale: La formulation retenue conserve l’article défini et l’identification métaphorique directe du grec, sans transformer celle-ci en simple fonction ni lui ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. La seconde phrase reste proche de la structure grecque tout en employant une formulation naturelle. Aucun appel de note n’est nécessaire, puisque « située sur une montagne » rend explicitement κειμένη ἐπάνω ὄρους.
