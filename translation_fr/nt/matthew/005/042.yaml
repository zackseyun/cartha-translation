id: MAT.5.42
reference: Matthew 5:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῷ αἰτοῦντί σε ⸀δός, καὶ τὸν θέλοντα ἀπὸ σοῦ δανίσασθαι μὴ ἀποστραφῇς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/042.yaml
  text: Give to the one who asks you[a], and do not turn away from the one who wants to borrow from you.
translation:
  language: fr
  text: Donne à celui qui te demande, et ne te détourne pas de celui qui veut emprunter auprès de toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne refuse pas celui qui veut emprunter auprès de toi ».'
    reason: Alternative lexicale explicitant le sens pratique de μὴ ἀποστραφῇς.
lexical_decisions:
- source_word: αἰτοῦντί
  choice: celui qui te demande
  rationale: Le participe présent substantivé désigne de manière générale la personne qui demande. Cette formulation naturelle conserve l’absence d’objet explicite dans le grec.
- source_word: δός
  choice: Donne
  rationale: L’impératif aoriste de δίδωμι exprime ici un ordre direct, rendu simplement sans ajout modal.
- source_word: θέλοντα
  choice: celui qui veut
  rationale: Le participe présent substantivé est rendu par une tournure française courante qui préserve l’idée de volonté.
- source_word: ἀπὸ σοῦ
  choice: auprès de toi
  rationale: Dans le contexte d’un emprunt, « auprès de toi » exprime naturellement la source indiquée par la préposition grecque.
- source_word: δανίσασθαι
  choice: emprunter
  rationale: L’infinitif signifie ici emprunter. Aucun objet, notamment de l’argent, n’est précisé dans le texte grec ; la traduction conserve cette généralité.
- source_word: μὴ ἀποστραφῇς
  choice: ne te détourne pas
  rationale: Cette formulation conserve l’image du verbe ἀποστρέφω tout en restant claire et naturelle en français ; « ne refuse pas » en expliciterait davantage l’effet pratique.
theological_decisions:
- issue: Portée et force du commandement éthique de Jésus
  choice: Conserver deux injonctions directes, générales et sans restriction ajoutée.
  alternative: Limiter le commandement à certaines personnes jugées dignes d’aide, ou rendre la seconde injonction uniquement par « ne refuse pas ».
  rationale: Le grec énonce directement ces commandements sans préciser de conditions. La traduction préserve donc leur force et leur portée générale, ainsi que l’image ouverte de « se détourner ».
translation_notes:
  register: Français international moderne, simple et digne. « Emprunter auprès de toi » évite d’ajouter un objet absent du grec. La répétition de « celui qui » reflète le parallélisme des deux participes substantivés.
