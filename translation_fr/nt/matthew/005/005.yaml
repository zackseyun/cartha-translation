id: MAT.5.5
reference: Matthew 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριοι οἱ πραεῖς, ὅτι αὐτοὶ κληρονομήσουσι τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/005.yaml
  text: Blessed are the meek[b][a], because they will inherit the earth.
translation:
  language: fr
  text: Heureux ceux qui sont doux[a], car ils hériteront de la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les humbles ». La douceur évoquée ici est humble et maîtrisée; elle ne signifie ni faiblesse ni timidité.
    reason: lexical_alternative
  - marker: b
    text: Ou « du pays ». Cette phrase fait probablement écho au Psaume 37.11, où la promesse peut s’entendre à la fois du pays promis et, dans un sens plus large, de la terre.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Formulation consacrée et naturelle des béatitudes en français. Ici, « heureux » exprime la condition favorable accordée par Dieu, et non une simple émotion passagère.
- source_word: οἱ πραεῖς
  choice: ceux qui sont doux
  rationale: πραεῖς désigne une douceur humble et maîtrisée, non la faiblesse ou la timidité. La tournure substantivée française rend naturellement l’adjectif grec précédé de l’article.
- source_word: ὅτι
  choice: car
  rationale: Introduit le fondement de la déclaration. « Car » convient au registre bref, solennel et poétique des béatitudes.
- source_word: αὐτοὶ
  choice: ils
  rationale: Le pronom grec est emphatique. En français, le pronom sujet « ils » suffit dans cette formule compacte; « eux-mêmes » alourdirait inutilement la phrase.
- source_word: κληρονομήσουσι
  choice: hériteront
  rationale: Rend directement le futur de κληρονομέω et conserve le langage de l’héritage associé à la promesse biblique.
- source_word: τὴν γῆν
  choice: la terre
  rationale: γῆ peut désigner la terre entière ou un pays. « La terre » est naturel en français et préserve l’ampleur possible de la promesse, tandis qu’une note signale le sens plus local évoqué par le Psaume 37.11.
theological_decisions:
- issue: Portée de τὴν γῆν
  choice: la terre
  alternative: le pays
  rationale: Le grec permet une portée universelle (« la terre ») aussi bien qu’un sens territorial lié à la promesse (« le pays »). Le texte principal garde la formulation large, et la note préserve l’écho probable du Psaume 37.11 sans trancher la tension.
- issue: Sens de πραεῖς
  choice: ceux qui sont doux
  alternative: les humbles
  rationale: « Doux » maintient au premier plan l’attitude de douceur maîtrisée exprimée par πραΰς. « Humbles » est possible selon le contexte, mais risquerait de réduire le champ du mot à l’humilité sociale ou intérieure.
translation_notes:
  register: Français international moderne, simple et digne. La cadence traditionnelle de la béatitude est conservée sans archaïsme. Les deux notes rendent explicites les principales ambiguïtés lexicales du grec.
