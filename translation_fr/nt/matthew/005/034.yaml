  source_fidelity: Le texte rend fidèlement ἐγὼ δὲ λέγω ὑμῖν par « Mais moi, je vous dis », en conservant l’emphase de ἐγώ et le contraste de δέ. « de ne pas jurer du tout » correspond à μὴ ὀμόσαι ὅλως sans restreindre indûment la portée de l’interdiction. « ni par le ciel » exprime naturellement l’emploi de ἐν dans le cadre d’un serment, et « parce qu’il est le trône de Dieu » rend correctement la justification introduite par ὅτι.
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. La construction « je vous dis de ne pas… » est idiomatique et conserve de façon recevable la tournure infinitive du grec. La ponctuation avec deux-points et point-virgule prépare naturellement la suite de l’énumération dans les versets suivants.
  terminology: « Jurer » est le terme courant et approprié ici pour ὀμόσαι, entendu comme prêter serment. « Le ciel » et « le trône de Dieu » sont établis, naturels et non confessionnellement surinterprétés. Aucun appel de note n’est requis dans ce verset.
