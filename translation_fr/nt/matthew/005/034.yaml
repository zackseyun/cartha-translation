source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν μὴ ὀμόσαι ὅλως· μήτε ἐν τῷ οὐρανῷ, ὅτι θρόνος ἐστὶν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/034.yaml
  text: 'But I say to you, do not swear at all: neither by heaven, because it is the throne of God;'
translation:
  language: fr
  text: 'Mais moi, je vous dis de ne pas jurer du tout : ni par le ciel, parce qu’il est le trône de Dieu ;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Mais moi, je vous dis
  rationale: Le pronom explicite ἐγώ est rendu par « moi » pour conserver l’emphase et le contraste introduit par δέ.
- source_word: μὴ ὀμόσαι ὅλως
  choice: de ne pas jurer du tout
  rationale: « Jurer » exprime ici le fait de prêter serment, tandis que « du tout » conserve la portée générale de ὅλως.
- source_word: μήτε ἐν τῷ οὐρανῷ
  choice: ni par le ciel
  rationale: Dans le contexte d’un serment, ἐν introduit ce par quoi l’on jure ; « par le ciel » est l’expression française naturelle.
- source_word: ὅτι
  choice: parce que
  rationale: La valeur causale explique pourquoi il ne faut pas jurer par le ciel.
- source_word: θρόνος ἐστὶν τοῦ θεοῦ
  choice: il est le trône de Dieu
  rationale: Rendu direct de la proposition nominale grecque, le pronom « il » reprenant « le ciel ».
theological_decisions:
- issue: Portée de l’interdiction de jurer
  choice: ne pas jurer du tout
  alternative: ne faire absolument aucun serment
  rationale: La traduction conserve la formulation absolue du verset sans préciser ici si elle vise toute forme de serment ou les pratiques de serments évoquées dans le contexte.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe maintient le contraste emphatique de Jésus et le lien causal du texte grec. Aucun appel de note n’est requis.
