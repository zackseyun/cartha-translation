id: MAT.5.10
reference: Matthew 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριοι οἱ δεδιωγμένοι ἕνεκεν δικαιοσύνης, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/010.yaml
  text: Blessed are those who have been persecuted because of righteousness[a], for theirs is the kingdom of heaven.
translation:
  language: fr
  text: Heureux ceux qui sont persécutés à cause de la justice[a], car le royaume des cieux est à eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «à cause de ce qui est juste». Le mot grec peut désigner la justice ainsi qu’une conduite conforme à la volonté de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Formule française consacrée et naturelle des béatitudes; elle exprime une condition déclarée favorable plutôt qu’un simple sentiment passager.
- source_word: οἱ δεδιωγμένοι
  choice: ceux qui sont persécutés
  rationale: Le participe parfait passif substantivé désigne des personnes ayant subi la persécution et se trouvant dans cet état; le présent passif français rend naturellement cette situation durable.
- source_word: ἕνεκεν
  choice: à cause de
  rationale: Exprime clairement le motif de la persécution en français moderne.
- source_word: δικαιοσύνης
  choice: la justice
  rationale: «Justice» est le correspondant français naturel de δικαιοσύνη et peut inclure ici la conduite juste, conforme à la volonté de Dieu; une note préserve l’autre formulation possible.
- source_word: ὅτι
  choice: car
  rationale: Introduit avec naturel la raison qui fonde la déclaration de bonheur.
- source_word: αὐτῶν ἐστιν
  choice: est à eux
  rationale: Rend directement la possession emphatique exprimée par le génitif placé en tête, dans un français simple et idiomatique.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Expression française traditionnelle et intelligible qui conserve le pluriel caractéristique de la formule matthéenne.
theological_decisions:
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: ce qui est juste; conduite conforme à la volonté de Dieu
  rationale: Le terme grec peut évoquer à la fois la justice et la conduite droite conforme à Dieu. Le texte principal garde le terme français large «justice», tandis que la note signale la portée morale et relationnelle sans imposer une lecture confessionnelle étroite.
- issue: Temporalité du royaume
  choice: «est à eux» au présent
  alternative: «leur appartiendra» au futur
  rationale: Le grec emploie explicitement le présent ἐστιν; celui-ci est conservé afin de ne pas déplacer entièrement la promesse vers l’avenir.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence brève de la béatitude et le parallèle avec Matthieu 5.3 sont préservés.
source_grounding:
  english_pob_role: consult_only
