source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν, ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ, ἰῶτα ἓν ἢ μία κεραία οὐ μὴ παρέλθῃ ἀπὸ τοῦ νόμου, ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/018.yaml
  text: For truly I say to you[a], until heaven and earth pass away[c][b], not one iota or one stroke will ever pass away from the law until all things happen.
translation:
  language: fr
  text: 'Car, je vous le dis en vérité : jusqu’à ce que le ciel et la terre disparaissent, pas un seul iota[a] ni un seul petit trait[b] ne disparaîtra jamais de la Loi, jusqu’à ce que tout se soit réalisé[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pas une seule petite lettre » ; « iota » désigne ici la plus petite lettre ou unité alphabétique.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire une minuscule marque écrite servant à distinguer des lettres.
    reason: lexical_clarification
  - marker: c
    text: 'Ou : « jusqu’à ce que tout soit arrivé » ; autre possibilité : « jusqu’à ce que tout soit accompli ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: vraiment
  rationale: Dans les paroles de Jésus, ἀμήν introduit une affirmation solennelle et faisant autorité. « Vraiment » en restitue la force dans un français moderne sans conserver inutilement l’emprunt sémitique.
- source_word: γὰρ
  choice: car
  rationale: γάρ relie cette déclaration à ce qui précède en lui donnant une valeur explicative ou justificative. « Car » préserve clairement ce lien.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette formulation naturelle en français conserve le ton direct et solennel de la parole de Jésus.
- source_word: ἕως ἂν παρέλθῃ ὁ οὐρανὸς καὶ ἡ γῆ
  choice: jusqu’à ce que le ciel et la terre disparaissent
  rationale: La construction indique une éventualité future. « Disparaissent » rend ici naturellement παρέρχομαι appliqué au ciel et à la terre, sans affaiblir la portée cosmique de l’expression.
- source_word: ἰῶτα ἓν
  choice: pas un seul iota
  rationale: ἰῶτα nomme la plus petite lettre de l’alphabet grec. Le mot français « iota » conserve cette précision lexicale et reste largement compréhensible.
- source_word: μία κεραία
  choice: un seul petit trait
  rationale: κεραία désigne une minuscule saillie ou un trait graphique servant notamment à distinguer des lettres. « Petit trait » est concret, moderne et intelligible.
- source_word: οὐ μὴ παρέλθῃ
  choice: ne disparaîtra
  rationale: Le tour français « pas un seul… ni un seul… ne disparaîtra » exprime une négation catégorique et rend naturellement la négation grecque fortement emphatique οὐ μή.
- source_word: ἀπὸ τοῦ νόμου
  choice: de la Loi
  rationale: Dans le contexte de Matthieu 5.17-19, νόμος désigne la Loi scripturaire. La majuscule française signale ce référent reconnu sans préciser à elle seule s’il faut entendre strictement le Pentateuque ou une portée scripturaire plus large.
- source_word: ἕως ἂν πάντα γένηται
  choice: jusqu’à ce que tout soit arrivé
  rationale: γίνομαι peut exprimer ce qui arrive, a lieu ou se réalise. Cette formulation large évite de réduire la phrase à un seul schéma d’accomplissement, tandis que la note conserve une autre nuance possible.
theological_decisions:
- issue: Portée de νόμος dans la déclaration de Jésus
  choice: « la Loi » désigne la Loi scripturaire de Dieu
  alternative: La Torah ou le Pentateuque en particulier, ou plus largement l’ensemble des Écritures anciennes par extension
  rationale: Le contexte immédiat associe « la Loi » et « les Prophètes » et traite de l’autorité durable des Écritures. La traduction conserve le terme même de la source sans trancher plus précisément son étendue.
- issue: Sens de πάντα γένηται
  choice: « jusqu’à ce que tout soit arrivé »
  alternative: « jusqu’à ce que tout soit accompli » ou « jusqu’à ce que tout se réalise »
  rationale: La phrase peut viser soit la survenue de toutes choses, soit leur plein accomplissement. Le texte principal garde une formulation large, et la note signale explicitement la nuance d’accomplissement afin de préserver la tension interprétative.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La structure solennelle de la déclaration est conservée, tout en évitant des termes vieillis comme « iote » ou « trait de lettre » lorsqu’ils nuiraient à la compréhension immédiate.
