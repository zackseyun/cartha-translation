id: MAT.5.30
reference: Matthew 5:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰ ἡ δεξιά σου χεὶρ σκανδαλίζει σε, ἔκκοψον αὐτὴν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου ⸂εἰς γέενναν ἀπέλθῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/030.yaml
  text: And if your right hand causes you to stumble[a], cut it off and throw it away[c][b]. For it is better for you that one of your members should perish than that your whole body should go into Gehenna.
translation:
  language: fr
  text: Et si ta main droite est pour toi une cause de chute[a], coupe-la et jette-la loin de toi. Il est en effet préférable pour toi qu’un seul de tes membres périsse et que ton corps tout entier n’aille pas dans la géhenne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te pousse à pécher ». Le verbe grec évoque littéralement le fait de faire trébucher ou tomber.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’enfer ». Le mot grec « géhenne », tiré du nom de la vallée de Hinnom, désigne ici le jugement à venir.
    reason: alternative_reading
lexical_decisions:
- source_word: δεξιά ... χείρ
  choice: ta main droite
  rationale: Expression française courante qui conserve la précision corporelle et le parallèle avec le verset précédent.
- source_word: σκανδαλίζει
  choice: est pour toi une cause de chute
  rationale: Cette formulation conserve la métaphore grecque du faux pas tout en laissant entendre, dans ce contexte, l’idée d’une incitation au péché.
- source_word: ἔκκοψον
  choice: coupe-la
  rationale: Impératif direct et énergique, naturel en français pour parler de l’ablation d’une main.
- source_word: βάλε ἀπὸ σοῦ
  choice: jette-la loin de toi
  rationale: Rend à la fois la force de βάλε et l’éloignement explicite exprimé par ἀπὸ σοῦ.
- source_word: συμφέρει γάρ σοι
  choice: Il est en effet préférable pour toi
  rationale: Exprime l’avantage comparatif voulu dans ce contexte, sans suggérer un profit matériel.
- source_word: ἵνα ἀπόληται
  choice: qu’un seul de tes membres périsse
  rationale: Conserve la gravité de ἀπόλλυμι ainsi que la structure de la proposition grecque.
- source_word: ἓν τῶν μελῶν σου
  choice: un seul de tes membres
  rationale: « Membre » garde l’image d’une partie du corps sans réduire le terme grec aux seuls bras ou jambes; « seul » met en relief l’opposition avec le corps entier.
- source_word: ὅλον τὸ σῶμά σου
  choice: ton corps tout entier
  rationale: Formulation française naturelle qui préserve l’opposition entre une partie du corps et sa totalité.
- source_word: εἰς γέενναν ἀπέλθῃ
  choice: ne s’en aille pas dans la géhenne
  rationale: Rend le verbe de mouvement ἀπέρχομαι et conserve le terme historique et théologiquement chargé γέεννα plutôt que de le confondre d’emblée avec toutes les associations ultérieures du mot « enfer ».
theological_decisions:
- issue: Sens moral de σκανδαλίζει
  choice: est pour toi une cause de chute
  alternative: te pousse à pécher
  rationale: Le texte garde ainsi la métaphore de la chute présente dans le grec, tandis qu’une note précise son sens moral dans le contexte.
- issue: Traduction de γέεννα
  choice: géhenne
  alternative: enfer
  rationale: « Géhenne » représente directement le terme grec issu du nom de la vallée de Hinnom et préserve son cadre historique ainsi que sa portée de jugement eschatologique; « enfer » demeure une glose contextuelle possible, signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse grecque au singulier. La métaphore corporelle et la solennité de l’avertissement sont maintenues sans en atténuer la tension.
