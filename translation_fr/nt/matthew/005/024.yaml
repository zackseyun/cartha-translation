reference: Matthew 5:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄφες ἐκεῖ τὸ δῶρόν σου ἔμπροσθεν τοῦ θυσιαστηρίου καὶ ὕπαγε πρῶτον διαλλάγηθι τῷ ἀδελφῷ σου, καὶ τότε ἐλθὼν πρόσφερε τὸ δῶρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/024.yaml
  text: leave your gift there before the altar[a], and go; first be reconciled to your brother[b], and then come and offer your gift.
translation:
  language: fr
  text: Laisse là ton offrande devant l’autel, et va d’abord te réconcilier avec ton frère.[a] Puis viens présenter ton offrande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « ton frère » au masculin singulier; dans ce contexte, le principe de réconciliation peut s’appliquer plus largement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφες ἐκεῖ
  choice: laisse là
  rationale: L’impératif demande de laisser l’objet sur place; « laisse là » conserve avec naturel la précision spatiale.
- source_word: τὸ δῶρόν σου
  choice: ton offrande
  rationale: Dans ce cadre cultuel, δῶρον désigne un don présenté à Dieu; « offrande » est plus immédiatement clair en français que le simple « don ».
- source_word: ἔμπροσθεν τοῦ θυσιαστηρίου
  choice: devant l’autel
  rationale: Rend directement et naturellement la relation spatiale exprimée par le grec.
- source_word: ὕπαγε πρῶτον
  choice: va d’abord
  rationale: Conserve l’ordre impératif et la priorité explicite accordée à la réconciliation.
- source_word: διαλλάγηθι τῷ ἀδελφῷ σου
  choice: te réconcilier avec ton frère
  rationale: Le passif grec appelle à entrer dans une relation rétablie; en français, « se réconcilier avec » est la construction idiomatique.
- source_word: καὶ τότε ἐλθὼν πρόσφερε
  choice: Puis reviens présenter
  rationale: Le contexte implique le retour à l’autel. « Puis » marque la succession, et « présenter » convient à l’acte d’apporter l’offrande sans alourdir la répétition.
theological_decisions:
- issue: Portée de ἀδελφός dans une instruction éthique
  choice: ton frère
  alternative: ton frère ou ta sœur; ton prochain
  rationale: Le grec emploie un nom masculin singulier. Le texte principal en conserve la forme, tandis qu’une note signale que le principe de réconciliation peut avoir une portée relationnelle plus large.
translation_notes:
  register: Français moderne, digne et direct. La syntaxe impérative reste vive; « offrande » explicite naturellement le contexte cultuel, et « reviens » rend l’implication contextuelle de ἐλθών.
