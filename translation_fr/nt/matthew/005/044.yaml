id: MAT.5.44
reference: Matthew 5:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν, ἀγαπᾶτε τοὺς ἐχθροὺς ⸀ὑμῶν καὶ προσεύχεσθε ὑπὲρ ⸀τῶν διωκόντων ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/044.yaml
  text: But I say to you[a], love your enemies and pray for those who persecute you.
translation:
  language: fr
  text: 'Mais moi, je vous dis : aimez vos ennemis et priez pour[a] ceux qui vous persécutent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en faveur de ».'
    reason: Alternative lexicale explicitant la nuance de ὑπέρ, que le français idiomatique exprime normalement par « pour ».
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Mais moi, je vous dis
  rationale: « Mais » marque le contraste introduit par δέ, tandis que « moi » rend l’insistance explicite de ἐγώ. La tournure reste naturelle et solennelle en français moderne.
- source_word: ἀγαπᾶτε
  choice: aimez
  rationale: L’impératif « aimez » rend directement le commandement sans ajouter une définition particulière de l’amour ni surinterpréter l’aspect du présent grec.
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: vos ennemis
  rationale: Traduction directe et idiomatique qui conserve pleinement la relation d’hostilité exprimée par ἐχθρός.
- source_word: προσεύχεσθε
  choice: priez
  rationale: Équivalent français courant et précis de l’impératif grec, sans lourdeur aspectuelle.
- source_word: ὑπὲρ
  choice: pour
  rationale: Avec le génitif, ὑπέρ indique ici que la prière est faite en faveur des personnes concernées. « Pour » est la formulation française la plus naturelle.
- source_word: τῶν διωκόντων ὑμᾶς
  choice: ceux qui vous persécutent
  rationale: Cette formulation conserve la valeur verbale du participe substantivé et suggère une conduite caractéristique ou en cours sans employer le substantif plus abstrait « persécuteurs ».
theological_decisions:
- issue: Portée du commandement envers les ennemis
  choice: Rendre directement les deux impératifs, sans préciser la forme que doit prendre l’amour ni le contenu de la prière.
  alternative: Développer « aimez » comme une action bienveillante ou préciser qu’il faut prier pour la bénédiction, la repentance ou la conversion des persécuteurs.
  rationale: Le texte commande l’amour des ennemis et la prière en faveur des persécuteurs, mais ne définit pas ici toutes leurs implications concrètes. La traduction préserve cette force et cette ouverture interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Mais moi, je vous dis » conserve l’emphase et le contraste rhétorique du grec sans devenir archaïque.
