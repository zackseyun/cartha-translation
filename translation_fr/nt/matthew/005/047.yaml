review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : ἀσπάσησθε (« saluez »), ἀδελφούς (« frères »), μόνον (« seulement ») et τί περισσὸν ποιεῖτε (« que faites-vous d’extraordinaire ? ») sont fidèles. Dans la dernière question, « eux-mêmes » ne rend pas de façon assez nette le καί de οὐχὶ καὶ οἱ ἐθνικοί, qui introduit l’idée de « eux aussi / même les non-Juifs ».'
  naturalness: Le français est moderne, clair et d’un registre approprié. « Les non-Juifs ne font-ils pas eux aussi la même chose ? » est plus direct et restitue plus explicitement la relation comparative que « Les non-Juifs eux-mêmes n’en font-ils pas autant ? ».
  terminology: « Non-Juifs » est un choix défendable pour ἐθνικοί dans ce contraste juif, sans surcharger le terme de la connotation religieuse possible de « païens ». La note conserve cette alternative. « Frères » avec une note sur l’extension possible du référent préserve l’ambiguïté du grec.
  issues:
  - severity: low
    issue: Rendu insuffisamment explicite de καί dans la dernière question
    rationale: Dans οὐχὶ καὶ οἱ ἐθνικοὶ τὸ αὐτὸ ποιοῦσιν, καί signifie ici « aussi » avec une force rhétorique proche de « même ». « Eux-mêmes » peut être lu comme une simple insistance sur le sujet et ne marque pas aussi clairement que les non-Juifs accomplissent également cette action. « Eux aussi » rend cette relation sans ajouter d’interprétation.
  - severity: low
    issue: Formulation littérale de la note c trop schématique
    rationale: ἐθνικοί est un adjectif substantivé; « ceux des nations » n’est pas une glose française très précise ni nécessaire. La note peut conserver l’alternative « païens » sans présenter une pseudo-littéralité.
