  text: καὶ ἐὰν ἀσπάσησθε τοὺς ⸀ἀδελφοὺς ὑμῶν μόνον, τί περισσὸν ποιεῖτε; οὐχὶ καὶ οἱ ⸀ἐθνικοὶ ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/047.yaml
  text: And if you greet only your brothers[c][b][a], what are you doing that is extraordinary? Do not even the Gentiles do the same?
translation:
  language: fr
  text: Et si vous saluez seulement vos frères[a], que faites-vous d’extraordinaire[b] ? Les non-Juifs ne font-ils pas eux aussi la même chose ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos frères et sœurs » ; le grec dit « frères », mais le mot peut désigner plus largement les membres de votre propre groupe.
    reason: lexical_alternative
  - marker: b
    text: Ou « que faites-vous de plus ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσησθε
  choice: saluez
  rationale: Le verbe désigne ici le fait d’adresser une salutation. « Saluez » est naturel en français et n’ajoute pas l’idée plus précise d’accueil ou d’hospitalité.
- source_word: ἀδελφοὺς
  choice: frères
  rationale: Le grec emploie un masculin pluriel. « Frères » en préserve la forme, tandis qu’une note signale que le mot peut viser plus largement les membres de son propre groupe, femmes comprises.
- source_word: μόνον
  choice: seulement
  rationale: Le terme restreint les salutations aux seuls membres du groupe concerné; « seulement » rend clairement cette limitation.
- source_word: τί περισσὸν ποιεῖτε
  choice: que faites-vous d’extraordinaire ?
  rationale: περισσόν évoque ce qui dépasse l’ordinaire. Cette formulation française restitue avec naturel la force rhétorique, sans exclure le sens plus littéral « que faites-vous de plus ? ».
- source_word: ἐθνικοὶ
  choice: les non-Juifs
  rationale: Dans ce contexte juif, le terme désigne d’abord ceux qui appartiennent aux autres peuples. « Les non-Juifs » est immédiatement compréhensible et évite la nuance religieuse plus accusée de « païens ».
- source_word: τὸ αὐτὸ
  choice: en font autant
  rationale: Cette expression idiomatique française rend naturellement « font la même chose » et reprend l’action de saluer les membres de son propre groupe.
theological_decisions:
- issue: Portée de ἀδελφοὺς dans l’enseignement éthique
  choice: « frères » dans le texte principal
  alternative: « frères et sœurs » ou « membres de votre groupe »
  rationale: Le masculin pluriel grec est conservé sans décider que seuls des hommes sont visés. La note préserve la possibilité d’un référent social plus large.
- issue: Sens de ἐθνικοὶ
  choice: « les non-Juifs »
  alternative: « les païens » ou « les gens des autres nations »
  rationale: Le choix maintient principalement le contraste entre Juifs et autres peuples sans imposer une caractérisation religieuse plus forte que ne l’exige le terme grec.
- issue: Force de περισσόν
  choice: « d’extraordinaire »
  alternative: « de plus »
  rationale: Le texte exprime une conduite qui dépasse la norme commune. La formulation choisie en restitue la portée éthique, tandis que la note conserve l’alternative plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. La tournure interrogative reste vive et naturelle. « Les non-Juifs » privilégie la compréhension immédiate, et « eux-mêmes » restitue la valeur emphatique de καί dans la question finale.
