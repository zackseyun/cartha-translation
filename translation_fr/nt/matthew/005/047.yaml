revisions:
- from: Et si vous saluez seulement vos frères[a], que faites-vous d’extraordinaire[b] ? Les non-Juifs[c] eux-mêmes n’en font-ils pas autant ?
  to: Et si vous saluez seulement vos frères[a], que faites-vous d’extraordinaire[b] ? Les non-Juifs ne font-ils pas eux aussi la même chose ?
  rationale: La révision explicite la valeur inclusive et rhétorique de καί dans la dernière question par « eux aussi » et rend τὸ αὐτό par « la même chose ». La note sur ἐθνικοί est simplifiée afin de ne pas donner une littéralité imprécise. Les autres choix, fidèles au grec et naturels en français international moderne, sont maintenus.
