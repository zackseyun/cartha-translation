source:
  edition: SBLGNT
  text: μήτε ἐν τῇ γῇ, ὅτι ὑποπόδιόν ἐστιν τῶν ποδῶν αὐτοῦ· μήτε εἰς Ἱεροσόλυμα, ὅτι πόλις ἐστὶν τοῦ μεγάλου βασιλέως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/035.yaml
  text: nor by the earth[a], because it is the footstool of his feet; nor by Jerusalem, because it is the city of the great King[d][c][b];
translation:
  language: fr
  text: ni par la terre, car elle est le marchepied sous ses pieds[a] ; ni par Jérusalem[b], car elle est la ville du grand roi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Allusion à Ésaïe 66.1 : « La terre est le marchepied sous mes pieds. »'
    reason: cross_reference
  - marker: b
    text: Le grec dit littéralement « vers Jérusalem », tournure qui semble fonctionner ici comme une formule de serment signifiant « par Jérusalem ».
    reason: lexical_alternative
  - marker: c
    text: Allusion au Psaume 48.3 (48.2 dans certaines numérotations), où Jérusalem est appelée « la ville du grand roi ».
    reason: cross_reference
lexical_decisions:
- source_word: μήτε
  choice: ni
  rationale: Dans la série d’interdictions commencée au verset précédent, « ni » assure naturellement la coordination en français.
- source_word: ἐν τῇ γῇ
  choice: par la terre
  rationale: Dans cette formule de serment, ἐν désigne ce par quoi l’on jure ; « par la terre » exprime clairement cet emploi idiomatique.
- source_word: γῇ
  choice: terre
  rationale: Le contraste avec le ciel et Jérusalem indique ici la terre dans son ensemble, non un territoire particulier.
- source_word: ὅτι
  choice: car
  rationale: « Car » introduit avec clarté la raison donnée pour chaque interdiction et convient au registre digne du passage.
- source_word: ὑποπόδιόν
  choice: marchepied
  rationale: « Marchepied » est l’équivalent précis et usuel, tout en conservant l’écho du langage scripturaire.
- source_word: τῶν ποδῶν αὐτοῦ
  choice: de ses pieds
  rationale: Cette formulation maintient l’expression grecque et son écho à Ésaïe 66.1, même si la répétition de « pied » est marquée en français.
- source_word: εἰς Ἱεροσόλυμα
  choice: par Jérusalem
  rationale: Bien que εἰς ait normalement un sens directionnel, il fonctionne ici dans une formule de serment. « Par Jérusalem » est naturel en français ; la particularité de la préposition grecque est signalée en note.
- source_word: πόλις
  choice: ville
  rationale: « Ville » est l’équivalent direct et naturel dans ce contexte.
- source_word: τοῦ μεγάλου βασιλέως
  choice: du grand roi
  rationale: La construction exprime l’appartenance. La minuscule évite d’ajouter au grec une marque typographique interprétative, tandis que le contexte et l’allusion indiquent Dieu.
theological_decisions:
- issue: Référent de αὐτοῦ dans « de ses pieds »
  choice: Conserver le pronom sans expliciter « Dieu »
  alternative: Traduire « des pieds de Dieu »
  rationale: Le contexte désigne Dieu, mais le grec emploie simplement un pronom. La traduction préserve cette formulation implicite.
- issue: Capitalisation de « roi »
  choice: 'Employer la minuscule : « le grand roi »'
  alternative: Écrire « le grand Roi » pour expliciter le référent divin
  rationale: Le grec ancien ne code pas cette distinction typographique. La minuscule conserve la transparence envers la source sans empêcher l’allusion au règne de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle et la répétition de la source sont conservées. Le verset commence par « ni », puisqu’il poursuit directement l’interdiction du verset précédent.
