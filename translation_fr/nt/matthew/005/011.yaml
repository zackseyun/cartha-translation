id: MAT.5.11
reference: Matthew 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριοί ἐστε ὅταν ὀνειδίσωσιν ὑμᾶς καὶ διώξωσιν καὶ εἴπωσιν πᾶν ⸀πονηρὸν καθ’ ὑμῶν ψευδόμενοι ἕνεκεν ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/011.yaml
  text: Blessed are you when they insult you and persecute you and falsely say every kind of evil against you because of me[a][b][c].
translation:
  language: fr
  text: Heureux êtes-vous quand on vous insulte[a], qu’on vous persécute et qu’on dit faussement toutes sortes de mal contre vous[b], à cause de moi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « on vous outrage ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « tout mal contre vous »; autre traduction possible : « toutes sortes de choses mauvaises contre vous ».'
    reason: lexical_alternative
  - marker: c
    text: Ou « en raison de moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοί ἐστε
  choice: Heureux êtes-vous
  rationale: Conserve la formule solennelle des béatitudes tout en employant un français clair. « Heureux » exprime ici l’état favorable reconnu par Dieu, et non une simple émotion passagère.
- source_word: ὅταν
  choice: quand
  rationale: Rend naturellement la circonstance générale introduite par ὅταν avec le subjonctif, sans imposer une fréquence particulière.
- source_word: ὀνειδίσωσιν
  choice: on vous insulte
  rationale: Exprime clairement les paroles offensantes et humiliantes visées par le verbe grec; « outrage » reste une possibilité plus soutenue.
- source_word: διώξωσιν
  choice: on vous persécute
  rationale: Préserve l’ampleur de l’hostilité décrite, sans la limiter à la violence physique, au harcèlement social ou aux poursuites judiciaires.
- source_word: εἴπωσιν πᾶν πονηρὸν καθ’ ὑμῶν
  choice: on dit contre vous toutes sortes de choses mauvaises
  rationale: Rend de manière idiomatique la portée générale de πᾶν πονηρόν et conserve l’orientation hostile exprimée par κατά avec le génitif.
- source_word: ψευδόμενοι
  choice: faussement
  rationale: Le participe est rendu adverbialement en français naturel et précise que les accusations proférées ne sont pas vraies.
- source_word: ἕνεκεν ἐμοῦ
  choice: à cause de moi
  rationale: 'Exprime directement le motif de l’opposition: le lien des disciples avec Jésus, sans ajouter une explication doctrinale.'
theological_decisions:
- issue: Nature de l’opposition décrite
  choice: Le verset réunit insultes, persécution et accusations mensongères subies à cause de Jésus, sans restreindre la persécution à une forme précise.
  alternative: Limiter l’opposition à la violence physique ou, à l’inverse, à la seule calomnie.
  rationale: Les trois verbes coordonnés décrivent plusieurs formes d’hostilité. La traduction en préserve l’étendue et maintient l’exigence explicite de fausseté pour les propos mauvais.
translation_notes:
  register: Français international moderne, clair et digne. L’inversion « Heureux êtes-vous » maintient la forme reconnaissable de la béatitude; le pronom indéfini « on » rend naturellement les verbes grecs à la troisième personne du pluriel sans identifier les persécuteurs.
