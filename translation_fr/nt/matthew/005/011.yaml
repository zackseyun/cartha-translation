  source_fidelity: Le projet rend fidèlement les trois actions coordonnées (insulter, persécuter, dire du mal) et conserve explicitement la fausseté des accusations ainsi que leur motif, « à cause de moi ». « On » est une bonne manière française de rendre les verbes grecs non spécifiés à la troisième personne du pluriel. La formulation de πᾶν πονηρόν peut toutefois être plus idiomatique sans perdre son ampleur.
