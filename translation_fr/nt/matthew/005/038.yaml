  text: Ἠκούσατε ὅτι ἐρρέθη· Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ καὶ ὀδόντα ἀντὶ ὀδόντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/038.yaml
  text: You have heard that it was said[a], ‘An eye for an eye and a tooth for a tooth.’
translation:
  language: fr
  text: 'Vous avez entendu qu’il a été dit : « Œil pour œil et dent pour dent. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Vous avez entendu
  rationale: Le passé composé rend naturellement en français cette formule introductive à l’aoriste et présente l’enseignement comme une parole reçue que les auditeurs connaissent.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit le contenu de ce que les auditeurs ont entendu.
- source_word: ἐρρέθη
  choice: il a été dit
  rationale: Cette tournure impersonnelle au passif respecte la forme grecque sans préciser un locuteur que le texte ne nomme pas.
- source_word: Ὀφθαλμὸν ἀντὶ ὀφθαλμοῦ
  choice: Œil pour œil
  rationale: La formule française consacrée exprime fidèlement la correspondance ou la substitution marquée par ἀντί, tout en conservant le parallélisme lapidaire de la maxime juridique.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux membres parallèles.
- source_word: ὀδόντα ἀντὶ ὀδόντος
  choice: dent pour dent
  rationale: Cette formulation idiomatique et traditionnelle reproduit le second membre de la maxime et reste cohérente avec le rendu du premier ἀντί.
theological_decisions:
- issue: Rendu de la formule juridique citée par Jésus
  choice: « Œil pour œil et dent pour dent »
  alternative: « Un œil à la place d’un œil et une dent à la place d’une dent »
  rationale: La formule française reconnue correspond au principe talionique cité dans la Torah et préserve sa concision. Elle n’ajoute aucune interprétation quant au caractère littéral, compensatoire ou limitatif de son application.
translation_notes:
  register: 'Français international moderne, digne et immédiatement compréhensible. La formulation traditionnelle de la maxime est conservée parce qu’elle demeure courante et naturelle. Aucune note n’est nécessaire : contrairement à l’anglais « for », le français « pour » rend ici clairement et conventionnellement la formule juridique, tandis qu’une variante littérale serait plus lourde sans apporter une ambiguïté textuelle significative.'
