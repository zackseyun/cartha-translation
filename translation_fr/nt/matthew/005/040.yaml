id: MAT.5.40
reference: Matthew 5:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τῷ θέλοντί σοι κριθῆναι καὶ τὸν χιτῶνά σου λαβεῖν, ἄφες αὐτῷ καὶ τὸ ἱμάτιον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/040.yaml
  text: And to the one who wants to sue you and take your tunic[b][a], let him have your cloak also.
translation:
  language: fr
  text: Et à celui qui veut te poursuivre en justice[a] et prendre ta tunique[b], laisse-lui aussi ton manteau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te traduire en justice ». Le verbe grec renvoie littéralement au fait d’être jugé dans un cadre judiciaire.
    reason: lexical_alternative
  - marker: b
    text: La tunique était le vêtement porté dessous, tandis que le manteau était le vêtement extérieur.
    reason: cultural_note
lexical_decisions:
- source_word: τῷ θέλοντί
  choice: à celui qui veut
  rationale: Le participe présent substantivé désigne de manière générale toute personne qui en a la volonté. Cette formulation est naturelle et conserve la valeur volitive de θέλω.
- source_word: σοι κριθῆναι
  choice: te poursuivre en justice
  rationale: Dans ce contexte, κριθῆναι désigne l’action d’engager une procédure judiciaire contre quelqu’un. Cette expression française rend clairement le cadre légal sans alourdir la phrase.
- source_word: χιτῶνά
  choice: tunique
  rationale: Le χιτών est le vêtement porté sous le vêtement extérieur. « Tunique » maintient la distinction historique avec ἱμάτιον tout en restant compréhensible.
- source_word: λαβεῖν
  choice: prendre
  rationale: Le verbe exprime ici la prise de possession du vêtement réclamé dans le cadre du litige.
- source_word: ἄφες αὐτῷ
  choice: laisse-lui
  rationale: L’impératif de ἀφίημι appelle à céder également l’autre vêtement. « Laisse-lui » conserve la force directe du commandement sans ajouter explicitement l’idée d’un don.
- source_word: ἱμάτιον
  choice: manteau
  rationale: Ἱμάτιον désigne le vêtement extérieur, par opposition au χιτών. « Manteau » exprime clairement ce contraste en français courant.
- source_word: καὶ ... καὶ
  choice: Et ... aussi
  rationale: Le premier καί relie cette parole à ce qui précède, tandis que le second marque l’ajout frappant du vêtement extérieur.
theological_decisions:
- issue: Portée éthique de l’instruction de Jésus dans un litige judiciaire
  choice: Conserver un impératif direct exprimant une générosité radicale et non vindicative.
  alternative: Reformuler comme un principe général et abstrait d’abandon de ses droits.
  rationale: L’impératif ἄφες et l’image concrète des deux vêtements donnent à l’enseignement sa force provocante. La traduction ne doit ni l’atténuer ni l’enfermer dans un système doctrinal particulier.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement conserve l’adresse directe au singulier du grec. La formulation garde le cadre judiciaire concret et le contraste culturel entre les deux vêtements.
