id: MAT.5.20
reference: Matthew 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι ἐὰν μὴ περισσεύσῃ ⸂ὑμῶν ἡ δικαιοσύνη⸃ πλεῖον τῶν γραμματέων καὶ Φαρισαίων, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/020.yaml
  text: For I tell you that unless your righteousness exceeds that of the scribes and Pharisees[a], you will certainly not enter the kingdom of heaven.
translation:
  language: fr
  text: 'Car je vous le dis : si votre justice ne surpasse pas celle des spécialistes de la Loi et des pharisiens, vous n’entrerez certainement pas dans le royaume des cieux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Car je vous le dis
  rationale: Le présent λέγω et la valeur explicative de γάρ sont rendus par une formule française naturelle qui maintient l’adresse directe.
- source_word: ἐὰν μὴ
  choice: si … ne … pas
  rationale: Cette tournure exprime clairement en français la condition négative nécessaire; « à moins que » serait également possible, mais plus lourd ici avec le comparatif.
- source_word: περισσεύσῃ … πλεῖον
  choice: surpasse
  rationale: Le verbe et le comparatif indiquent une mesure supérieure. « Surpasse » rend cette comparaison de façon concise et idiomatique.
- source_word: ὑμῶν ἡ δικαιοσύνη
  choice: votre justice
  rationale: En français biblique moderne, « justice » peut désigner la conformité à ce qui est juste devant Dieu, englobant ici la conduite droite; le contexte empêche de réduire le terme à la seule équité sociale.
- source_word: γραμματέων
  choice: spécialistes de la Loi
  rationale: Dans ce contexte, les γραμματεῖς sont des experts reconnus de la Loi. Cette formulation actuelle est plus transparente pour le lecteur ordinaire que « scribes », sans les réduire à de simples copistes.
- source_word: Φαρισαίων
  choice: pharisiens
  rationale: Nom traditionnel et usuel en français pour ce groupe juif de l’époque.
- source_word: οὐ μὴ εἰσέλθητε
  choice: vous n’entrerez certainement pas
  rationale: La double négation grecque avec le subjonctif aoriste est fortement emphatique; « certainement pas » en conserve la force sans archaïsme.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Cette expression consacrée demeure naturelle en français et conserve la tournure caractéristique de Matthieu ainsi que le pluriel grec.
theological_decisions:
- issue: Portée de δικαιοσύνη dans Matthieu 5.20
  choice: justice
  alternative: droiture
  rationale: « Justice » est l’équivalent français traditionnel et sémantiquement large de δικαιοσύνη; il peut exprimer ici la vie conforme à la volonté de Dieu. « Droiture » rendrait plus explicitement la qualité morale, mais réduirait quelque peu l’éventail du terme grec.
- issue: Nature de la comparaison avec les spécialistes de la Loi et les pharisiens
  choice: « celle » indique que leur justice est comparée à celle des disciples
  alternative: traduire littéralement « surpasse davantage les spécialistes… »
  rationale: Le grec formule elliptiquement la comparaison. Fournir « celle » en français clarifie la syntaxe sans préciser en quoi consiste cette justice supérieure, préservant ainsi la tension du contexte.
translation_notes:
  register: Français international moderne, digne et directement intelligible. La phrase conserve la solennité de l’avertissement, l’explication introduite par « Car » et l’emphase de la négation grecque. « Spécialistes de la Loi » privilégie la compréhension actuelle tout en respectant la fonction historique des γραμματεῖς.
