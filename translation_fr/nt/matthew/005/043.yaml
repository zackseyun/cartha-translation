  text: Ἠκούσατε ὅτι ἐρρέθη· Ἀγαπήσεις τὸν πλησίον σου καὶ μισήσεις τὸν ἐχθρόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/043.yaml
  text: You have heard that it was said[a], ‘You shall love your neighbor and hate your enemy.’
translation:
  language: fr
  text: 'Vous avez entendu qu’il a été dit[a] : « Tu aimeras ton prochain et tu haïras ton ennemi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La première proposition fait écho à Lévitique 19.18. La seconde (« et tu haïras ton ennemi ») n’est pas une citation directe de l’Ancien Testament, mais reflète un enseignement reçu que Jésus corrige.
    reason: cross_reference
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Vous avez entendu
  rationale: Le passé composé rend naturellement en français cette formule d’introduction et indique que les auditeurs ont reçu cet enseignement auparavant.
- source_word: ἐρρέθη
  choice: il a été dit
  rationale: Le passif impersonnel est conservé sans préciser qui a parlé.
- source_word: Ἀγαπήσεις
  choice: Tu aimeras
  rationale: Le futur a ici une valeur prescriptive et reprend la formulation de Lévitique 19.18.
- source_word: τὸν πλησίον σου
  choice: ton prochain
  rationale: « Prochain » est l’équivalent français établi dans ce contexte éthique et dans l’écho à Lévitique 19.18.
- source_word: μισήσεις
  choice: tu détesteras
  rationale: Le futur conserve la forme parallèle et prescriptive du grec. « Détester » exprime clairement μισέω en français moderne.
- source_word: τὸν ἐχθρόν σου
  choice: ton ennemi
  rationale: « Ennemi » est l’équivalent direct et naturel dans l’opposition avec « prochain ».
theological_decisions:
- issue: Statut de la proposition « et tu détesteras ton ennemi »
  choice: La rendre comme une partie de l’enseignement rapporté par Jésus, sans la présenter comme une citation directe de l’Ancien Testament.
  alternative: Présenter toute la phrase comme une citation biblique homogène, ou signaler dans le corps du texte que la seconde proposition relève de la tradition interprétative.
  rationale: Le grec rapporte une seule parole après « il a été dit », mais seule la première proposition fait directement écho à Lévitique 19.18. La note préserve cette distinction sans modifier la forme du propos rapporté.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier est conservé dans la parole citée, conformément aux formes grecques au singulier et au style traditionnel des commandements bibliques.
