revisions:
- from: 'Vous avez encore entendu qu’il a été dit aux gens d’autrefois : « Tu ne feras pas de faux serment[a], mais tu t’acquitteras envers le Seigneur[b] de tes serments. »'
  to: 'Vous avez aussi entendu qu’il a été dit aux gens d’autrefois : « Tu ne prêteras pas de faux serment[a], mais tu t’acquitteras de tes serments envers le Seigneur[b]. »'
  rationale: Révision limitée à des améliorations idiomatiques et syntaxiques. Le texte conserve la voix passive non spécifiée, la référence aux personnes d’autrefois, la portée non technique de ἐπιορκήσεις, ainsi que « Seigneur » pour κύριος. Les ancres de notes restent attachées aux mots qu’elles éclairent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:42:32Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est bien rendu : la formule introductive, la référence aux générations anciennes, l’interdiction et l’obligation envers le Seigneur correspondent au grec. Toutefois, « faire de faux serment » et la construction « s’acquitteras envers le Seigneur de tes serments » ne sont pas les formulations françaises les plus naturelles pour exprimer respectivement le faux serment et l’acquittement des serments dus à Dieu.'
  naturalness: « Vous avez encore entendu » est compréhensible, mais « Vous avez aussi entendu » est plus idiomatique dans cette série d’exemples. « Tu ne feras pas de faux serment » appelle normalement l’article indéfini (« un faux serment ») ou, plus naturellement ici, le verbe « prêter ». « Tu t’acquitteras envers le Seigneur de tes serments » est lourd ; placer « envers le Seigneur » après le complément direct rend la phrase plus fluide.
  terminology: « Seigneur » rend correctement κυρίῳ et la note conservant « le SEIGNEUR » comme possibilité liée à l’arrière-plan vétérotestamentaire est appropriée. « Serment » convient pour ὅρκος. « Prêter un faux serment » conserve une portée plus large que le terme juridique « commettre un parjure ».
  issues:
  - severity: medium
    issue: Formulation française de l’interdiction
    rationale: « Tu ne feras pas de faux serment » est moins idiomatique et son absence d’article est maladroite. « Tu ne prêteras pas de faux serment » est une expression française usuelle qui rend directement l’idée de jurer faussement.
  - severity: medium
    issue: Ordre et régime de la seconde proposition
    rationale: « Tu t’acquitteras envers le Seigneur de tes serments » est syntaxiquement possible mais pesant. « Tu t’acquitteras de tes serments envers le Seigneur » est plus naturel tout en conservant l’idée de serments dus au Seigneur.
  - severity: low
    issue: Connecteur Πάλιν
    rationale: Dans cette succession d’enseignements, « aussi » est plus naturel que « encore » après « vous avez entendu », sans modifier la progression discursive.
  - severity: low
    issue: Alternative de la note a
    rationale: La formulation « Tu ne rompras pas ton serment » passe au singulier possessif et est moins générique. « Tu ne violeras pas tes serments » exprime plus clairement l’alternative lexicale de violation d’un engagement juré.
  revised_text: 'Vous avez aussi entendu qu’il a été dit aux gens d’autrefois : « Tu ne prêteras pas de faux serment[a], mais tu t’acquitteras de tes serments envers le Seigneur[b]. »'
  revised_footnotes:
