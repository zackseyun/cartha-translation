id: MAT.5.33
reference: Matthew 5:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πάλιν ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐκ ἐπιορκήσεις, ἀποδώσεις δὲ τῷ κυρίῳ τοὺς ὅρκους σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/033.yaml
  text: Again[a], you have heard that it was said to those of old, ‘You shall not swear falsely[b], but you shall fulfill your oaths to the Lord.’
translation:
  language: fr
  text: 'Vous avez aussi entendu qu’il a été dit aux gens d’autrefois : « Tu ne prêteras pas de faux serment[a], mais tu t’acquitteras de tes serments envers le Seigneur[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tu ne violeras pas tes serments » ; le verbe peut désigner le fait de jurer faussement ou de violer un serment.
    reason: lexical_alternative
  - marker: b
    text: Ou « le SEIGNEUR », pour faire ressortir le nom divin de l’alliance dans l’arrière-plan de l’Ancien Testament.
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν
  choice: encore
  rationale: Introduit un nouvel exemple dans la série et marque naturellement la progression du discours en français.
- source_word: ἠκούσατε
  choice: vous avez entendu
  rationale: Le passé composé convient à cette formule et souligne la portée présente de ce qui a été transmis.
- source_word: ἐρρέθη
  choice: il a été dit
  rationale: Conserve la tournure passive impersonnelle sans préciser qui a parlé.
- source_word: τοῖς ἀρχαίοις
  choice: aux gens d’autrefois
  rationale: Expression française claire qui renvoie aux générations anciennes, sans suggérer simplement des personnes âgées.
- source_word: Οὐκ ἐπιορκήσεις
  choice: Tu ne feras pas de faux serment
  rationale: Rend le sens de serment mensonger tout en évitant le terme juridique plus étroit « parjure »; l’autre nuance possible, rompre un serment, est signalée en note.
- source_word: ἀποδώσεις
  choice: tu t’acquitteras
  rationale: Exprime l’accomplissement effectif d’une obligation contractée par serment, tout en conservant l’idée de rendre ce qui est dû.
- source_word: τῷ κυρίῳ
  choice: envers le Seigneur
  rationale: Le référent est Dieu; « Seigneur » suit directement le grec κύριος, tandis que l’arrière-plan vétérotestamentaire du nom divin est indiqué en note.
- source_word: τοὺς ὅρκους σου
  choice: de tes serments
  rationale: Rend précisément ὅρκος et s’intègre naturellement à la construction française « s’acquitter de ».
theological_decisions:
- issue: Traduction de κύριος dans une allusion aux Écritures d’Israël
  choice: le Seigneur
  alternative: le SEIGNEUR
  rationale: Le texte grec porte κυρίῳ et ne cite pas directement le tétragramme hébreu. Le texte principal traduit donc le grec, tout en préservant en note la possibilité de faire ressortir l’arrière-plan du nom divin.
- issue: Étendue du sens de ἐπιορκέω
  choice: faire un faux serment
  alternative: rompre un serment
  rationale: Le verbe peut désigner le fait de jurer faussement ou de violer un serment. Le texte principal retient la première nuance, large et non technique, et la seconde est maintenue en note.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier dans la citation conserve la forme juridique directe du grec. « Aux gens d’autrefois » évite l’ambiguïté de « aux anciens », qui pourrait désigner une fonction communautaire.
