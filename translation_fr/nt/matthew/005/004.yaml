id: MAT.5.4
reference: Matthew 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριοι οἱ πενθοῦντες, ὅτι αὐτοὶ παρακληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/004.yaml
  text: Blessed are those who mourn[a], because they will be comforted.
translation:
  language: fr
  text: Heureux ceux qui pleurent[a], car ils seront consolés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui sont dans l’affliction ». Le grec a un sens large et ne précise pas la cause de leur douleur.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Formule française établie des béatitudes. Ici, « heureux » exprime une évaluation favorable devant Dieu, et non une simple émotion passagère; « bénis » serait moins naturel en français dans cette construction.
- source_word: οἱ πενθοῦντες
  choice: ceux qui pleurent
  rationale: Le participe présent substantivé désigne les personnes qui vivent le deuil, la douleur ou l’affliction. « Ceux qui pleurent » est naturel et digne, sans préciser la cause de leur peine.
- source_word: ὅτι
  choice: car
  rationale: Introduit la raison de la déclaration. « Car » conserve clairement la valeur causale et le rythme solennel de la béatitude.
- source_word: αὐτοὶ
  choice: ils
  rationale: Le pronom grec porte une certaine insistance, mais « eux-mêmes » ou « ce sont eux qui » donnerait en français une emphase potentiellement exclusive. La structure de la phrase suffit à faire ressortir les personnes concernées.
- source_word: παρακληθήσονται
  choice: seront consolés
  rationale: Rend naturellement le futur passif et le sens de recevoir consolation et réconfort, sans identifier explicitement l’agent.
theological_decisions:
- issue: Étendue du deuil ou de l’affliction dans la béatitude
  choice: Garder la formulation générale « ceux qui pleurent », sans préciser la cause.
  alternative: Limiter le sens à ceux qui pleurent leurs péchés, un décès, l’oppression ou la situation d’Israël.
  rationale: Le texte grec ne nomme pas l’objet de la douleur. La traduction préserve donc l’ouverture théologique et pastorale de la parole.
- issue: Agent de la consolation
  choice: Conserver le passif « seront consolés ».
  alternative: Expliciter « Dieu les consolera ».
  rationale: Le passif peut suggérer l’action de Dieu, mais le grec ne nomme pas directement l’agent. L’expliciter dans le texte principal résoudrait une implication que l’original laisse formellement ouverte.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le rythme mémorable d’une béatitude et évite aussi bien un vocabulaire trop technique qu’une restriction du deuil à la seule perte d’un proche.
