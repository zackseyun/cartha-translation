  source_fidelity: Le sens marital de ἀπολύω est bien rendu par « divorce », l’exception introduite par παρεκτὸς est conservée sans en réduire arbitrairement la portée, et « femme divorcée » rend correctement ἀπολελυμένην. « La rend adultère » préserve utilement la valeur causative et le caractère passif formel de μοιχευθῆναι. En revanche, la note actuelle proposant « fait qu’elle subisse un adultère » ne correspond pas de manière défendable au grec et introduit un sens inapproprié.
  naturalness: Le français est globalement moderne et naturel. « Commet un adultère » est possible, mais « commet l’adultère » est l’expression idiomatique habituelle dans ce contexte. La révision améliore aussi la note, dont la formulation actuelle est peu naturelle.
  terminology: « Inconduite sexuelle » convient comme terme large pour πορνεία, sans l’assimiler à l’adultère. « Adultère » conserve le vocabulaire conjugal du passage. La note doit présenter l’alternative active comme une interprétation idiomatique, sans transformer la forme passive du grec en l’idée de subir un acte.
