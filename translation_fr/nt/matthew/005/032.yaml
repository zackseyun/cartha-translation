id: MAT.5.32
reference: Matthew 5:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι ⸂πᾶς ὁ ἀπολύων⸃ τὴν γυναῖκα αὐτοῦ παρεκτὸς λόγου πορνείας ποιεῖ αὐτὴν ⸀μοιχευθῆναι, καὶ ὃς ἐὰν ἀπολελυμένην γαμήσῃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/032.yaml
  text: But I say to you that everyone who divorces his wife[a], except on the ground of sexual immorality, makes her commit adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: fr
  text: Mais moi, je vous dis que quiconque divorce de sa femme, sauf en cas d’inconduite sexuelle[a], la rend adultère[b] ; et celui qui épouse une femme divorcée commet l’adultère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porneia est un terme large qui désigne des conduites sexuelles illicites ; on le traduit aussi par « immoralité sexuelle », « débauche » ou « inconduite sexuelle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’amène à commettre l’adultère ». L’infinitif grec est passif dans sa forme ; plus littéralement, on peut comprendre « fait d’elle une adultère ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύων / ἀπολελυμένην
  choice: divorce de / femme divorcée
  rationale: Dans un contexte conjugal, ἀπολύω désigne couramment le divorce plutôt qu’un simple renvoi. Le même vocabulaire est conservé dans les deux propositions.
- source_word: γυναῖκα
  choice: femme
  rationale: γυνή peut signifier « femme » ou « épouse ». Avec le possessif et dans le contexte du divorce, « sa femme » exprime clairement le sens d’épouse en français courant.
- source_word: παρεκτὸς λόγου πορνείας
  choice: sauf en cas d’inconduite sexuelle
  rationale: παρεκτός introduit une exception, λόγου désigne ici un cas ou un motif, et πορνεία est un terme large qui ne doit pas être réduit au seul adultère.
- source_word: ποιεῖ αὐτὴν μοιχευθῆναι
  choice: la rend adultère
  rationale: Cette formulation française conserve la valeur causative de ποιεῖ et la nuance résultative du passif μοιχευθῆναι, sans imposer exclusivement une lecture active.
- source_word: ὃς ἐὰν ... γαμήσῃ
  choice: celui qui épouse
  rationale: La relative avec ἐάν énonce un cas général. « Celui qui épouse » est naturel et correspond au référent masculin exprimé par le grec.
- source_word: μοιχᾶται
  choice: commet un adultère
  rationale: Cette expression idiomatique rend clairement le verbe grec dans son emploi conjugal.
- source_word: πᾶς ὁ ἀπολύων
  choice: quiconque divorce
  rationale: La tournure participiale exprime une règle générale. « Quiconque » la restitue avec concision, tandis que « sa femme » maintient le cadre masculin de la situation décrite.
theological_decisions:
- issue: Portée de l’exception παρεκτὸς λόγου πορνείας
  choice: 'Traduire comme une véritable exception : « sauf en cas d’inconduite sexuelle »'
  alternative: « sauf dans le cas d’une union illégitime »
  rationale: Le grec présente explicitement une exception, mais le texte ne précise pas davantage l’étendue exacte de πορνεία. La traduction ne tranche donc pas entre les interprétations théologiques de cette clause.
- issue: Valeur de μοιχευθῆναι après ποιεῖ
  choice: « la rend adultère » dans le texte principal
  alternative: « l’amène à commettre un adultère » ou, plus littéralement quant à la forme, « fait qu’elle subisse un adultère »
  rationale: L’infinitif est passif dans sa forme, mais sa portée exacte est discutée. Le texte principal garde une formulation résultative et la note signale les autres possibilités sans résoudre la tension.
translation_notes:
  register: Français international moderne, sobre et digne. « Mais moi, je vous dis » maintient le contraste emphatique de ἐγὼ δέ. « Quiconque » évite une lourdeur tout en conservant la portée générale, et la ponctuation garde les deux affirmations étroitement liées.
