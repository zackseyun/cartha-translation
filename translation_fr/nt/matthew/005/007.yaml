  text: μακάριοι οἱ ἐλεήμονες, ὅτι αὐτοὶ ἐλεηθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/007.yaml
  text: Blessed are the merciful[a], for they will be shown mercy.
translation:
  language: fr
  text: Heureux ceux qui font preuve de miséricorde, car il leur sera fait miséricorde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Formule française naturelle et consacrée des béatitudes. Dans ce contexte, « heureux » désigne une condition favorable reconnue par Dieu, et non une simple émotion passagère.
- source_word: οἱ ἐλεήμονες
  choice: ceux qui font preuve de miséricorde
  rationale: L’adjectif substantivé désigne les personnes caractérisées par la miséricorde. Cette formulation est claire en français moderne et permet de conserver le lien lexical avec la promesse qui suit.
- source_word: ὅτι
  choice: car
  rationale: Introduit la raison de la déclaration initiale tout en conservant la forme concise et solennelle d’une béatitude.
- source_word: αὐτοὶ
  choice: ils
  rationale: Le pronom grec souligne la correspondance entre ceux qui exercent la miséricorde et ceux qui la recevront. En français, « ils » exprime cette reprise sans alourdir la phrase.
- source_word: ἐλεηθήσονται
  choice: ils recevront miséricorde
  rationale: Le futur passif grec promet que la miséricorde leur sera accordée sans nommer l’agent. Cette tournure française naturelle conserve le même champ lexical que « miséricorde » dans le premier membre.
theological_decisions:
- issue: Identité de celui qui accordera la miséricorde
  choice: 'Ne pas nommer l’agent : « ils recevront miséricorde »'
  alternative: « Dieu leur fera miséricorde »
  rationale: Le contexte suggère fortement l’action de Dieu, mais le passif grec ne le nomme pas explicitement. La traduction préserve cette retenue et ne limite pas davantage la portée de la promesse.
- issue: Rapport entre la conduite miséricordieuse et la miséricorde promise
  choice: Conserver la relation exprimée par « car » sans en préciser le mécanisme
  alternative: Présenter la miséricorde reçue comme un mérite ou un salaire
  rationale: Le verset établit une correspondance, mais n’explique pas ici si elle relève de la récompense, de la réciprocité ou d’une autre logique. La traduction ne tranche pas cette question.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « miséricorde » reproduit l’écho entre ἐλεήμονες et ἐλεηθήσονται. « Ceux qui font preuve de » est plus naturel aujourd’hui que le substantif « les miséricordieux », tout en gardant la concision proverbiale du verset.
