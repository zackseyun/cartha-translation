id: MAT.5.28
reference: Matthew 5:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ βλέπων γυναῖκα πρὸς τὸ ἐπιθυμῆσαι αὐτὴν ἤδη ἐμοίχευσεν αὐτὴν ἐν τῇ καρδίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/028.yaml
  text: But I say to you that everyone who looks at a woman in order to desire her has already committed adultery with her in his heart[a][b][c].
translation:
  language: fr
  text: Mais moi, je vous dis que quiconque regarde une femme dans l’intention de la désirer a déjà commis l’adultère avec elle dans son cœur[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une épouse »; le grec γυνή peut signifier « femme » ou « épouse » selon le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « dans l’intention de la convoiter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Mais moi, je vous dis
  rationale: Le pronom explicite ἐγώ donne de l’emphase au locuteur, tandis que δέ marque le contraste. Cette formulation française conserve les deux traits sans lourdeur excessive.
- source_word: πᾶς ὁ βλέπων
  choice: quiconque regarde
  rationale: « Quiconque » exprime naturellement la portée générale de la construction grecque sans préciser le sexe du sujet au-delà de ce qu’exige le français.
- source_word: γυναῖκα
  choice: une femme
  rationale: γυνή peut désigner une femme ou une épouse. Ici, le terme général « femme » évite d’introduire dans le texte principal un statut matrimonial que le grec ne précise pas explicitement.
- source_word: πρὸς τὸ ἐπιθυμῆσαι αὐτὴν
  choice: dans l’intention de la désirer
  rationale: πρός suivi de l’infinitif substantivé exprime ici une visée ou une intention. La formulation met en évidence le regard délibérément orienté vers le désir, plutôt que la simple constatation visuelle.
- source_word: ἤδη ἐμοίχευσεν αὐτὴν
  choice: a déjà commis l’adultère avec elle
  rationale: « Déjà » rend ἤδη, et l’expression française idiomatique « commettre l’adultère avec » restitue clairement μοιχεύω avec son complément.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: dans son cœur
  rationale: Cette traduction littérale et naturelle conserve l’image biblique du cœur comme siège de la pensée, de la volonté et du désir.
theological_decisions:
- issue: Faut-il rendre γυνή par « femme » ou par « épouse » dans un contexte d’adultère ?
  choice: femme
  alternative: épouse
  rationale: Le grec ne marque pas explicitement le statut matrimonial. « Femme » préserve la généralité et l’ambiguïté lexicale du texte, tandis que le contexte d’adultère en indique la gravité morale.
- issue: Faut-il rendre ἐπιθυμέω par « désirer » ou par « convoiter » ?
  choice: désirer
  alternative: convoiter
  rationale: Le verbe grec a un champ sémantique plus large que la seule convoitise sexuelle, même si le contexte rend ici le désir moralement coupable. « Désirer » reste proche du lexème source; l’autre possibilité est signalée en note.
- issue: Le syntagme πρὸς τὸ ἐπιθυμῆσαι exprime-t-il seulement le résultat ou une intention ?
  choice: dans l’intention de la désirer
  alternative: de manière à la désirer
  rationale: La construction avec πρός et l’infinitif substantivé a une force orientée vers un but. La traduction retenue conserve cette intentionnalité sans faire de tout regard suivi d’un désir involontaire l’énoncé explicite du texte.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « Mais moi » conserve l’emphase grecque; « dans l’intention de » explicite naturellement la valeur de but sans effacer la tension entre le regard, l’intention et le désir.
