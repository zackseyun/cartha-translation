  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Le simple lien narratif est conservé sans lui ajouter une nuance temporelle plus forte.
- source_word: ἀνοίξας τὸ στόμα αὐτοῦ
  choice: il ouvrit la bouche
  rationale: Cette formulation garde l’expression solennelle du grec tout en restant claire en français moderne.
- source_word: ἐδίδασκεν
  choice: se mit à les enseigner
  rationale: L’imparfait grec présente l’enseignement dans son déroulement et peut, dans ce contexte introductif, avoir une valeur inchoative. Cette tournure française introduit naturellement le discours qui suit.
- source_word: αὐτοὺς
  choice: les
  rationale: Le pronom est maintenu sans préciser ici s’il désigne seulement les disciples ou un groupe plus large.
- source_word: λέγων
  choice: en disant
  rationale: Le participe introduit explicitement le contenu de l’enseignement et demeure naturel avant les paroles rapportées.
