translation_notes:
  register: Français moderne, digne et narratif. L’expression « ouvrit la bouche » est volontairement conservée pour rendre la solennité de la formule source; « se mit à les enseigner » donne une expression française naturelle à l’aspect imperfectif ou inchoatif du verbe grec.
