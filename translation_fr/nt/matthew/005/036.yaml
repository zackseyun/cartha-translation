  text: μήτε ἐν τῇ κεφαλῇ σου ὀμόσῃς, ὅτι οὐ δύνασαι μίαν τρίχα λευκὴν ⸂ποιῆσαι ἢ μέλαιναν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/036.yaml
  text: Nor shall you swear by your head[a], because you are not able to make one hair white or black.
translation:
  language: fr
  text: Ne jure pas non plus par ta tête, car tu ne peux rendre un seul cheveu blanc ou noir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτε
  choice: Ne… pas non plus
  rationale: Cette tournure poursuit naturellement en français la série coordonnée d’interdictions négatives du contexte.
- source_word: ἐν τῇ κεφαλῇ σου
  choice: par ta tête
  rationale: Avec le verbe « jurer », la préposition introduit ce qui est invoqué pour garantir le serment ; « jurer par » est l’expression idiomatique française correspondante.
- source_word: ὀμόσῃς
  choice: jure
  rationale: L’aoriste subjonctif après μήτε exprime ici une interdiction directe. L’impératif français transmet clairement cette force.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de l’interdiction. « Car » conserve ce lien causal dans un registre naturel et digne.
- source_word: οὐ δύνασαι
  choice: tu ne peux
  rationale: Cette formulation française concise exprime directement l’incapacité indiquée par δύνασαι.
- source_word: μίαν τρίχα
  choice: un seul cheveu
  rationale: « Un seul » fait ressortir la valeur emphatique de μίαν et souligne l’incapacité humaine jusque dans la plus petite chose.
- source_word: λευκὴν … ἢ μέλαιναν
  choice: blanc ou noir
  rationale: Ces termes rendent directement les deux adjectifs de couleur et en préservent le contraste marqué.
- source_word: ποιῆσαι
  choice: rendre
  rationale: Avec un complément suivi d’un adjectif attribut, « rendre… blanc ou noir » exprime naturellement en français l’idée de faire devenir ou d’amener à un état.
theological_decisions:
- issue: Portée de l’interdiction de jurer
  choice: Traduire comme une interdiction directe de jurer par sa propre tête, sans élargir explicitement l’énoncé à tous les serments.
  alternative: Interpréter le verset soit comme l’interdiction absolue de toute forme de serment, soit comme la seule condamnation de formules de serment manipulatrices ou évasives.
  rationale: Le verset vise expressément le fait de jurer par sa tête et fonde l’interdiction sur l’incapacité humaine. La traduction conserve cette formulation et la tension théologique du passage sans trancher un débat plus large.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux formes grecques de deuxième personne du singulier. La syntaxe reste proche du texte source tout en étant idiomatique.
