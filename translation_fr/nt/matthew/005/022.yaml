id: MAT.5.22
reference: Matthew 5:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ λέγω ὑμῖν ὅτι πᾶς ὁ ὀργιζόμενος τῷ ἀδελφῷ ⸀αὐτοῦ ἔνοχος ἔσται τῇ κρίσει· ὃς δ’ ἂν εἴπῃ τῷ ἀδελφῷ αὐτοῦ· Ῥακά, ἔνοχος ἔσται τῷ συνεδρίῳ· ὃς δ’ ἂν εἴπῃ· Μωρέ, ἔνοχος ἔσται εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/022.yaml
  text: But I say to you that everyone who is angry with his brother will be liable to the judgment[a]; and whoever says to his brother, ‘Raca,’ will be liable to the council; and whoever says[e][d][c][b], ‘Fool,’ will be liable to the Gehenna of fire.
translation:
  language: fr
  text: 'Mais moi, je vous dis que quiconque est en colère contre son frère[a][d] sera passible du jugement ; celui qui dira à son frère : « Raca ! »[b] devra répondre devant le conseil[c] ; et celui qui dira : « Insensé ! » sera passible de la géhenne de feu[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits ajoutent « sans raison » après « est en colère contre son frère ». Les témoins les plus anciens et les mieux attestés omettent ces mots.
    reason: textual_variant
  - marker: b
    text: « Raca » est un terme araméen méprisant qui signifie approximativement « tête vide » ou « bon à rien ».
    reason: cultural_note
  - marker: c
    text: Ou « du Sanhédrin », le grand conseil juif.
    reason: alternative_reading
  - marker: d
    text: Le mot grec traduit par « frère » est au masculin singulier, mais il peut avoir ici une portée représentative ; l’enseignement ne concerne donc pas seulement les frères de sexe masculin.
    reason: lexical_alternative
  - marker: e
    text: Ou « de l’enfer de feu ». « Géhenne » conserve le terme précis employé par Jésus, issu de l’image de la vallée de Hinnom associée au jugement.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ λέγω ὑμῖν
  choice: Mais moi, je vous dis
  rationale: La tournure conserve le contraste introduit par δέ et l’accent porté par le pronom explicite ἐγώ, tout en restant naturelle en français.
- source_word: πᾶς ὁ ὀργιζόμενος
  choice: quiconque est en colère
  rationale: Le participe présent substantivé énonce une catégorie générale. Cette formulation en préserve la portée sans préciser indûment le commencement ou la durée de la colère.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: contre son frère
  rationale: Avec ὀργίζομαι, le datif désigne la personne visée par la colère. « Contre » est idiomatique en français, tandis que « frère » respecte le masculin singulier du grec; sa possible portée représentative est signalée en note.
- source_word: ἔνοχος ἔσται
  choice: sera passible
  rationale: L’expression indique que la personne s’expose à une instance ou à une peine judiciaire. « Sera passible » maintient cette image juridique dans les trois propositions.
- source_word: τῇ κρίσει
  choice: du jugement
  rationale: Cette traduction préserve le sens judiciaire et l’article grec sans trancher entre une juridiction locale précise et l’acte de jugement.
- source_word: Ῥακά
  choice: Raca
  rationale: L’insulte araméenne transcrite dans le grec est conservée afin de préserver la texture du texte source; son sens approximatif est expliqué en note.
- source_word: τῷ συνεδρίῳ
  choice: du conseil
  rationale: Le nom grec désigne une assemblée ou un conseil. Le terme générique évite d’identifier avec certitude cette instance au Sanhédrin, possibilité maintenue en note.
- source_word: Μωρέ
  choice: Insensé !
  rationale: Le vocatif constitue une insulte directe. « Insensé » exprime en français actuel et digne la condamnation intellectuelle et morale portée par μωρός, sans l’association clinique trompeuse de « débile ».
- source_word: εἰς τὴν γέενναν τοῦ πυρός
  choice: de la géhenne de feu
  rationale: « Géhenne » conserve le terme historique et imagé employé par Jésus, tandis que « de feu » reproduit simplement le génitif τοῦ πυρός. La préposition requise en français après « passible » explique « de la ».
theological_decisions:
- issue: Sens de γέεννα
  choice: géhenne
  alternative: enfer
  rationale: « Géhenne » préserve l’arrière-plan juif de la vallée de Hinnom et l’image de jugement, sans y incorporer silencieusement toutes les associations ultérieures du mot « enfer ».
- issue: Portée du masculin ἀδελφός
  choice: frère
  alternative: frère ou sœur
  rationale: Le texte principal respecte le masculin singulier de la source. Une note indique que le terme peut fonctionner de manière représentative et que l’enseignement ne se limite pas aux frères biologiques masculins.
- issue: Identification de συνέδριον
  choice: conseil
  alternative: Sanhédrin
  rationale: Le mot peut désigner le grand conseil juif, mais le contexte ne contraint pas à cette identification technique. La traduction conserve donc l’ambiguïté et présente l’autre possibilité en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe parallèle et le vocabulaire judiciaire du grec sont conservés. Les termes culturellement chargés « Raca » et « géhenne » restent dans le texte et sont éclairés par des notes; les ambiguïtés concernant le jugement, le conseil et la portée de « frère » ne sont pas résolues artificiellement.
