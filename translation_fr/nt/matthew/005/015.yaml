id: MAT.5.15
reference: Matthew 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲ καίουσιν λύχνον καὶ τιθέασιν αὐτὸν ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, καὶ λάμπει πᾶσιν τοῖς ἐν τῇ οἰκίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/015.yaml
  text: Nor do people light a lamp and put it under a basket[a], but on a lampstand[b], and it gives light to everyone in the house.
translation:
  language: fr
  text: On n’allume pas non plus une lampe pour la mettre sous un récipient servant de mesure[a], mais on la place sur un support de lampe, et elle éclaire tous ceux qui sont dans la maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous un panier servant de mesure » ; traditionnellement « sous un boisseau ». Le mot grec désigne une mesure de capacité pour matières sèches et, par extension, le récipient correspondant.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: On n’allume pas non plus
  rationale: La tournure relie naturellement cet exemple négatif à la parole précédente et rend en français le sujet pluriel générique implicite.
- source_word: καίουσιν λύχνον
  choice: on allume une lampe
  rationale: « Allumer une lampe » est l’expression française courante; λύχνος désigne ici une lampe concrète, vraisemblablement à huile.
- source_word: τιθέασιν αὐτόν
  choice: pour la mettre
  rationale: Le pronom reprend « lampe » au féminin en français. L’infinitif avec « pour » exprime naturellement l’action envisagée dans cette maxime, sans changer son sens.
- source_word: ὑπὸ τὸν μόδιον
  choice: sous un récipient de mesure
  rationale: μόδιος désigne une mesure de capacité pour matières sèches et, par extension, son récipient. Cette formulation conserve cette précision historique sans employer le traditionnel « boisseau », peu courant aujourd’hui.
- source_word: ἀλλ’ ἐπὶ τὴν λυχνίαν
  choice: mais on la place sur un porte-lampe
  rationale: λυχνία est le support sur lequel on pose une lampe. « Porte-lampe » préserve l’image concrète et se comprend sans suggérer nécessairement un chandelier à bougies.
- source_word: λάμπει
  choice: elle éclaire
  rationale: Le verbe λάμπω signifie « briller »; avec le datif des bénéficiaires, « éclairer » rend naturellement ici l’effet de la lampe sur les personnes présentes.
- source_word: πᾶσιν τοῖς ἐν τῇ οἰκίᾳ
  choice: tous ceux qui sont dans la maison
  rationale: Cette formulation conserve la portée universelle de πᾶσιν et le sens spatial de οἰκία.
theological_decisions:
- issue: Sujet pluriel générique non exprimé en grec
  choice: On n’allume pas non plus une lampe… mais on la place…
  alternative: Les gens n’allument pas non plus une lampe… mais la placent…
  rationale: Le pronom français « on » rend idiomatiquement le pluriel générique grec sans introduire un référent précis pour un éventuel « ils ».
- issue: Rapport de λάμπει avec les personnes dans la maison
  choice: elle éclaire tous ceux qui sont dans la maison
  alternative: elle brille pour tous ceux qui sont dans la maison
  rationale: « Éclaire » rend clairement la fonction bénéfique de la lampe dans ce contexte. L’alternative plus formelle reste possible, mais aucune interprétation théologique supplémentaire n’est ajoutée.
translation_notes:
  register: Français international moderne, simple et digne. La phrase proverbiale est rendue avec le pronom générique « on ». « Récipient de mesure » privilégie la précision et l’accessibilité; « porte-lampe » évite l’image anachronique d’un chandelier à bougies.
