id: MAT.5.13
reference: Matthew 5:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑμεῖς ἐστε τὸ ἅλας τῆς γῆς· ἐὰν δὲ τὸ ἅλας μωρανθῇ, ἐν τίνι ἁλισθήσεται; εἰς οὐδὲν ἰσχύει ἔτι εἰ μὴ ⸂βληθὲν ἔξω⸃ καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/013.yaml
  text: You are the salt of the earth. But if the salt becomes tasteless[a], with what will it be made salty? It is no longer good for anything except to be thrown out and trampled underfoot by men.
translation:
  language: fr
  text: Vous êtes le sel de la terre. Mais si le sel s’affadit[a], avec quoi sera-t-il salé ? Il n’est plus bon à rien, sinon à être jeté dehors et piétiné par les gens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi signifier « devenir insensé »; appliqué au sel, il signifie « s’affadir » ou « perdre sa saveur ».
    reason: jeu_lexical
lexical_decisions:
- source_word: Ὑμεῖς
  choice: Vous
  rationale: Le pronom grec explicite met les auditeurs en relief. En français, « Vous » en tête de phrase transmet naturellement cette insistance sans ajouter le plus lourd « vous-mêmes ».
- source_word: τὸ ἅλας τῆς γῆς
  choice: le sel de la terre
  rationale: γῆ peut désigner la terre, le pays ou le sol. « Le sel de la terre » est ici naturel, fidèle à l’image et suffisamment large pour le contexte.
- source_word: μωρανθῇ
  choice: s’affadit
  rationale: Appliqué au sel, le verbe désigne la perte de saveur ou de caractère salé. « S’affadit » conserve l’image concrète et reste concis; une note signale le jeu lexical possible avec le sens ordinaire « devenir insensé ».
- source_word: ἐν τίνι ἁλισθήσεται
  choice: avec quoi sera-t-il salé ?
  rationale: Cette formulation garde la question grecque et son passif, sans la reformuler comme une restauration explicitement absente du texte.
- source_word: εἰς οὐδὲν ἰσχύει ἔτι
  choice: Il n’est plus bon à rien
  rationale: Dans ce contexte, ἰσχύει exprime l’utilité ou l’efficacité. Cette tournure française rend naturellement l’inutilité pratique du sel.
- source_word: εἰ μὴ βληθὲν ἔξω
  choice: sinon à être jeté dehors
  rationale: « Jeté dehors » conserve la valeur spatiale de ἔξω tout en restant idiomatique en français.
- source_word: καταπατεῖσθαι ὑπὸ τῶν ἀνθρώπων
  choice: piétiné par les gens
  rationale: καταπατεῖσθαι évoque le fait de fouler aux pieds. ἄνθρωποι désigne ici les êtres humains en général; « les gens » exprime clairement ce sens collectif en français moderne.
theological_decisions:
- issue: Portée de ὑπὸ τῶν ἀνθρώπων
  choice: par les gens
  alternative: par les hommes
  rationale: Le grec vise les êtres humains en général, sans limiter l’action aux personnes de sexe masculin. « Les gens » préserve cette portée générique dans un français actuel.
- issue: Jeu lexical possible de μωρανθῇ
  choice: s’affadit dans le texte, avec signalement en note du sens « devenir insensé »
  alternative: devient insensé
  rationale: Le contexte du sel impose le sens de perte de saveur, mais la parenté lexicale avec l’idée de folie peut être perceptible. La note conserve cette résonance sans rendre l’image principale obscure.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve les images concrètes, la question passive et la progression rhétorique du grec, sans ajouter d’explication sur la nature du sel.
