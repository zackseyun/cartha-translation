id: MAT.5.25
reference: Matthew 5:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἴσθι εὐνοῶν τῷ ἀντιδίκῳ σου ταχὺ ἕως ὅτου εἶ ⸂μετ’ αὐτοῦ ἐν τῇ ὁδῷ⸃, μήποτέ σε παραδῷ ὁ ἀντίδικος τῷ κριτῇ, καὶ ὁ ⸀κριτὴς τῷ ὑπηρέτῃ, καὶ εἰς φυλακὴν βληθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/025.yaml
  text: Be well-disposed toward your accuser quickly[a], while you are with him on the way, lest your accuser hand you over to the judge, and the judge to the officer, and you be thrown into prison.
translation:
  language: fr
  text: Sois bien disposé envers ton adversaire[a], sans tarder, pendant que tu es encore en chemin avec lui, de peur que ton adversaire ne te livre au juge, que le juge ne te livre à l’huissier, et que tu ne sois jeté en prison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus idiomatiquement dans ce contexte judiciaire : « Entends-toi sans tarder avec ton adversaire. »'
    reason: Alternative lexicale et contextuelle pour ἴσθι εὐνοῶν ; elle explicite l’idée possible de parvenir à un accord, sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: ἴσθι εὐνοῶν
  choice: Mets-toi dans de bonnes dispositions
  rationale: Cette formulation conserve l’idée première d’une attitude favorable envers l’autre, exprimée par la périphrase impérative, tout en restant naturelle en français moderne. Elle évite de transformer sans indication l’attitude demandée en règlement formel du litige.
- source_word: ἀντιδίκῳ / ἀντίδικος
  choice: adversaire
  rationale: Dans ce cadre judiciaire, « adversaire » désigne clairement la partie opposée sans préciser à tort qu’elle exerce nécessairement le rôle d’accusateur.
- source_word: ταχὺ
  choice: vite
  rationale: « Vite » exprime simplement et naturellement l’urgence de l’exhortation.
- source_word: ἕως ὅτου εἶ μετ’ αὐτοῦ ἐν τῇ ὁδῷ
  choice: pendant que tu es encore en chemin avec lui
  rationale: La traduction maintient l’image concrète du chemin et rend la limite temporelle implicite par « encore », sans ajouter explicitement « vers le tribunal ».
- source_word: μήποτέ
  choice: de peur que… ne
  rationale: Cette tournure française rend avec dignité la mise en garde et le risque envisagé.
- source_word: παραδῷ
  choice: livre
  rationale: « Livrer au juge » exprime clairement le transfert judiciaire et convient au registre du passage.
- source_word: κριτῇ / κριτὴς
  choice: juge
  rationale: Équivalent français direct et usuel dans ce contexte judiciaire.
- source_word: ὑπηρέτῃ
  choice: garde
  rationale: Dans la chaîne judiciaire décrite, il s’agit du subalterne chargé d’exécuter la décision et de conduire le débiteur en prison. « Garde » est compréhensible et moins lié à un système judiciaire moderne particulier que « huissier ».
- source_word: εἰς φυλακὴν
  choice: en prison
  rationale: Formulation française standard qui conserve la gravité de l’avertissement.
- source_word: βληθήσῃ
  choice: sois jeté
  rationale: Le verbe garde la vigueur de l’image grecque, plus forte qu’une simple mise en prison.
theological_decisions:
- issue: Faut-il rendre l’ordre initial comme une disposition favorable ou comme la conclusion d’un accord judiciaire ?
  choice: 'Conserver dans le texte l’idée d’une disposition favorable : « Mets-toi vite dans de bonnes dispositions envers ton adversaire ».'
  alternative: « Entends-toi vite avec ton adversaire » ou « Trouve vite un accord avec ton adversaire ».
  rationale: Le contexte judiciaire autorise nettement le sens idiomatique d’un accord, mais εὐνοέω exprime d’abord une attitude favorable. Le texte principal préserve cette nuance et la note signale l’implication contextuelle sans résoudre silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse individuelle au singulier. La syntaxe juridique demeure claire sans employer de termes propres à une institution judiciaire contemporaine particulière.
