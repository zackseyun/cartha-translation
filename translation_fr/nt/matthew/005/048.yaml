  text: Ἔσεσθε οὖν ὑμεῖς τέλειοι ⸀ὡς ὁ πατὴρ ὑμῶν ὁ ⸀οὐράνιος τέλειός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/048.yaml
  text: You[a], therefore, shall be perfect, as your heavenly Father is perfect.
translation:
  language: fr
  text: Soyez donc parfaits[a], comme votre Père céleste est parfait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « complets », « entiers » ou « mûrs ». Le mot grec τέλειος peut désigner la perfection, mais aussi ce qui est complet, entier ou parvenu à maturité.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔσεσθε
  choice: soyez
  rationale: Le futur de εἰμί a ici une valeur exhortative ou impérative. L’impératif français « soyez » exprime naturellement cette force sans faire entendre une simple prédiction.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence tirée de l’enseignement précédent, notamment sur l’amour des ennemis.
- source_word: ὑμεῖς
  choice: vous
  rationale: Le pronom grec est explicite et emphatique. « Vous donc » conserve cette mise en relief, même si la tournure française est volontairement solennelle.
- source_word: τέλειοι / τέλειός
  choice: parfaits
  rationale: « Parfaits » est l’équivalent direct et traditionnel, tout en conservant la force exigeante de la comparaison. La répétition du même mot français reproduit celle du grec; sa portée possible de totalité, d’intégrité ou de maturité est signalée en note.
- source_word: ὡς
  choice: comme
  rationale: Introduit directement et naturellement la comparaison avec le Père.
- source_word: πατὴρ ὑμῶν ὁ οὐράνιος
  choice: votre Père céleste
  rationale: Rend naturellement en français la construction grecque et conserve la référence divine de « Père ».
theological_decisions:
- issue: Sens de τέλειος dans l’exhortation éthique
  choice: Traduire par « parfaits / parfait » dans le texte principal, avec une note sur l’étendue sémantique.
  alternative: « accomplis », « entiers » ou « mûrs »
  rationale: Dans le contexte immédiat de Matthieu 5.43-47, le mot évoque notamment un amour entier, qui ne se limite pas aux proches. « Parfaits » préserve cependant la formulation exigeante et la comparaison avec le Père, sans réduire d’emblée le sens à une seule interprétation.
- issue: Valeur du futur Ἔσεσθε
  choice: Employer l’impératif « soyez ».
  alternative: « vous serez »
  rationale: Le futur grec peut porter ici une force impérative ou exhortative. Le futur français risquerait d’être compris surtout comme une prédiction; « soyez » transmet plus clairement l’appel solennel dans le contexte.
translation_notes:
  register: Français international moderne, digne et concis. La tournure marquée « Vous donc » maintient l’emphase du pronom grec; « Père » prend une majuscule comme désignation divine.
