  source_fidelity: Le texte rend correctement l’inférence de οὖν, l’exhortation à valeur impérative de Ἔσεσθε, la comparaison introduite par ὡς et la répétition de τέλειος. « Soyez donc » est une formulation française plus idiomatique pour cette exhortation; la désinence plurielle conserve la référence à « vous », sans reproduire de manière calquée l’ordre grec marqué.
  naturalness: « Vous donc, soyez » est grammatical, mais son ordre est sensiblement calqué sur le grec et peu naturel en français international moderne. « Soyez donc parfaits » est à la fois digne, courant dans le registre biblique et clair.
  terminology: « Père céleste » et la répétition de « parfait » sont appropriés. La note conserve utilement l’éventail sémantique de τέλειος; « complets » est plus immédiatement lexical et naturel que « accomplis » dans cette note.
