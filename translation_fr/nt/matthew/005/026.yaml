  text: ἀμὴν λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ἂν ἀποδῷς τὸν ἔσχατον κοδράντην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/026.yaml
  text: Truly I tell you[b][a], you will certainly not get out of there until you have paid the last quadrans.
translation:
  language: fr
  text: 'En vérité, je te le dis : tu ne sortiras absolument pas de là jusqu’à ce que tu aies payé le dernier quadrant[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le quadrant était une petite monnaie romaine de très faible valeur.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν
  choice: En vérité
  rationale: Dans la formule synoptique ἀμὴν λέγω σοι, ἀμήν introduit une déclaration solennelle et autoritative. « En vérité » en restitue naturellement la force en français moderne.
- source_word: λέγω σοι
  choice: je te le dis
  rationale: Cette tournure française est directe et idiomatique, tout en conservant l’adresse au singulier et l’autorité de la déclaration.
- source_word: οὐ μὴ ἐξέλθῃς
  choice: tu ne sortiras certainement pas
  rationale: La combinaison οὐ μή avec le subjonctif aoriste exprime une négation fortement appuyée. « certainement pas » préserve cette emphase sans archaïsme.
- source_word: ἐκεῖθεν
  choice: de là
  rationale: L’adverbe indique un mouvement à partir du lieu évoqué. Avec « sortir », « de là » est la formulation française la plus naturelle.
- source_word: ἕως ἂν ἀποδῷς
  choice: avant d’avoir payé
  rationale: La construction marque le terme futur de la détention, tandis que l’aoriste envisage le paiement comme accompli. Cette formulation française rend clairement cette idée d’achèvement.
- source_word: τὸν ἔσχατον κοδράντην
  choice: jusqu’au dernier quadrans
  rationale: « Jusqu’au dernier » rend idiomatiquement l’idée d’un paiement intégral. Le nom précis de la petite monnaie romaine est conservé plutôt que remplacé par une monnaie moderne ou historiquement trompeuse.
theological_decisions:
- issue: Faut-il expliciter que l’image de la prison et de la dette désigne le jugement final, une purification ou seulement une situation judiciaire ?
  choice: Conserver l’image concrète de la détention jusqu’au paiement intégral, sans en imposer une interprétation doctrinale.
  alternative: Expliciter une référence au jugement divin, à une purification après la mort ou uniquement à une procédure judiciaire humaine.
  rationale: Le grec affirme seulement que la personne ne sortira pas avant d’avoir tout payé. Le contexte permet plusieurs lectures de la portée de cette image, mais le verset ne tranche pas explicitement entre elles.
- issue: La proposition introduite par « avant d’avoir payé » implique-t-elle nécessairement qu’une libération finira par avoir lieu ?
  choice: Préserver la formulation temporelle du grec sans affirmer que la condition sera effectivement remplie.
  alternative: Traduire de manière à exclure toute libération future ou, inversement, à la garantir.
  rationale: ἕως ἄν fixe la condition précédant une éventuelle sortie, mais ne précise pas à lui seul si le paiement pourra réellement être effectué. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « En vérité, je te le dis » conserve la solennité de la formule de Jésus ; « sortir de là » reste naturel, et le terme historique « quadrans » est expliqué en note.
