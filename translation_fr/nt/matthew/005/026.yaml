review_pass:
  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : la négation emphatique, la sortie « de là » et la condition du paiement intégral sont bien rendues. Toutefois, « avant d’avoir payé » est moins exact que « jusqu’à ce que tu aies payé », car ἕως ἂν introduit explicitement la limite temporelle durant laquelle la non-sortie demeure. « Le dernier quadrant » reproduit plus directement τὸν ἔσχατον κοδράντην que la tournure française plus interprétative « jusqu’au dernier quadrans ».'
  naturalness: '« En vérité, je te le dis » est naturel dans un registre biblique moderne. La formulation révisée est plus idiomatique et plus nette en français : « tu ne sortiras absolument pas de là jusqu’à ce que tu aies payé le dernier quadrant ». « Quadrant » est la forme française usuelle pour la monnaie romaine, tandis que « quadrans » est le terme latin.'
  terminology: Le maintien du nom de monnaie historique est approprié et ne convertit pas abusivement la somme en monnaie moderne. La note culturelle doit employer la forme française retenue dans le texte. La traduction conserve l’image judiciaire et de détention sans imposer une lecture eschatologique ou doctrinale.
