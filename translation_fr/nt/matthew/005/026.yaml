  - severity: low
    issue: « jusqu’au dernier quadrans » est moins direct et « quadrans » est une forme latine plutôt que française.
    rationale: Le grec dit littéralement « le dernier κοδράντης ». En français courant et dans le vocabulaire historique français, « quadrant » est préférable ; « le dernier quadrant » restitue directement l’objet du paiement.
