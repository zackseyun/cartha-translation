id: MAT.5.9
reference: Matthew 5:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριοι οἱ εἰρηνοποιοί, ὅτι αὐτοὶ υἱοὶ θεοῦ κληθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/009.yaml
  text: Blessed are the peacemakers[a], because they will be called sons of God.
translation:
  language: fr
  text: Heureux ceux qui font la paix, car ils seront appelés fils de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants de Dieu ». Le grec dit littéralement « fils de Dieu »; ce masculin pluriel a ici une portée représentative et inclut les femmes comme les hommes.
    reason: Alternative lexicale et clarification de la portée inclusive du langage filial grec.
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Formule française établie des béatitudes. Elle exprime la condition enviable de ceux qui reçoivent la faveur de Dieu, plutôt qu’un simple sentiment passager de bonheur.
- source_word: εἰρηνοποιοί
  choice: ceux qui font la paix
  rationale: 'Cette formulation naturelle conserve la valeur active du nom composé grec : il s’agit de personnes qui produisent ou rétablissent la paix, et non seulement de personnes paisibles.'
- source_word: ὅτι
  choice: car
  rationale: Introduit avec clarté le motif de la béatitude, dans un registre français courant et digne.
- source_word: αὐτοὶ
  choice: ils
  rationale: Le pronom grec est emphatique, mais la structure française de la béatitude suffit ici à mettre le groupe en relief; « eux-mêmes » serait inutilement appuyé.
- source_word: υἱοὶ θεοῦ
  choice: fils de Dieu
  rationale: Rend directement le masculin pluriel filial du grec et préserve ses possibles résonances de statut et d’appartenance. La portée représentative et inclusive est signalée en note.
- source_word: κληθήσονται
  choice: seront appelés
  rationale: Reproduit directement le futur passif sans réduire le sens à une simple reconnaissance sociale.
theological_decisions:
- issue: Langage filial masculin dans υἱοὶ θεοῦ
  choice: fils de Dieu
  alternative: enfants de Dieu
  rationale: Le texte principal conserve la formulation masculine du grec et sa portée théologique possible, sans exclure sa valeur représentative. La variante inclusive est donnée en note afin d’éviter de laisser entendre que la promesse concernerait uniquement les hommes.
translation_notes:
  register: Français international moderne, simple et digne. La cadence brève de la béatitude est conservée; « ceux qui font la paix » reste immédiatement compréhensible tout en exprimant une action concrète.
