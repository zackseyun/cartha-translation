  source_fidelity: 'Le sens de la phrase grecque est globalement bien rendu : le pluriel « les foules », la montée vers « la montagne », l’approche des disciples et le caractère circonstanciel de καθίσαντος αὐτοῦ sont respectés. Toutefois, « Puis » ajoute une articulation temporelle plus marquée que le simple καί, et « quand il se fut assis » est plus lourd et littéraire que nécessaire en français international moderne.'
  naturalness: « Une fois assis » est une formulation moderne, fluide et narrative qui rend naturellement le génitif absolu, tout en indiquant que les disciples viennent après que Jésus s’est assis. La suppression de « Puis » évite une surarticulation du récit.
  terminology: « Disciples », « foules » et « montagne » conviennent au registre et à l’usage évangélique français. La note doit nommer précisément le « génitif absolu » plutôt qu’une formulation plus vague de « construction participiale indépendante ».
