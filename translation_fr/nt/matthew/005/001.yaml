  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος· καὶ καθίσαντος αὐτοῦ προσῆλθαν αὐτῷ οἱ μαθηταὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/001.yaml
  text: Seeing the crowds[a], he went up the mountain; and when he sat down[c][b], his disciples came to him.
translation:
  language: fr
  text: Voyant les foules, il monta sur la montagne[a]. Une fois assis, ses disciples s’approchèrent de lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il gravit la montagne ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « après qu’il se fut assis ». Le grec emploie ici un génitif absolu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν
  choice: Voyant
  rationale: Le participe aoriste de ὁράω présente la circonstance qui accompagne l’action principale. « Voyant » conserve le lien participial sans imposer une succession temporelle trop précise.
- source_word: δὲ
  choice: —
  rationale: Particule légère de transition, δέ n’a pas besoin d’être exprimée ici en français ; « mais » marquerait une opposition absente du contexte.
- source_word: τοὺς ὄχλους
  choice: les foules
  rationale: Le pluriel grec est conservé par une expression naturelle en français moderne.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: il monta sur la montagne
  rationale: Le verbe indique un mouvement vers le haut et εἰς marque ici l’accès au relief. Cette formulation est naturelle et conserve le nom ainsi que son article défini.
- source_word: τὸ ὄρος
  choice: la montagne
  rationale: ὄρος peut désigner une montagne ou une hauteur ; « la montagne » est la correspondance directe et traditionnelle, sans préciser davantage la topographie.
- source_word: καὶ καθίσαντος αὐτοῦ
  choice: Puis, quand il se fut assis
  rationale: Le génitif absolu situe l’approche des disciples par rapport au fait que Jésus s’assoit. Le passé antérieur rend naturellement en français cette circonstance antérieure, tandis que « quand » évite de surcharger la séquence.
- source_word: προσῆλθαν αὐτῷ
  choice: s’approchèrent de lui
  rationale: προσέρχομαι signifie venir auprès de quelqu’un ou s’en approcher. « S’approchèrent de lui » est précis et idiomatique.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: « Disciples » est le terme français usuel pour les élèves et fidèles d’un maître dans ce contexte.
theological_decisions:
- issue: Valeur de l’article dans τὸ ὄρος
  choice: la montagne
  alternative: une montagne ; le flanc de la montagne
  rationale: L’article grec est conservé sans pour autant identifier une montagne nommée ni préciser une topographie que le texte ne donne pas.
- issue: Rapport temporel du génitif absolu καθίσαντος αὐτοῦ
  choice: quand il se fut assis
  alternative: après qu’il se fut assis ; comme il s’asseyait
  rationale: La construction situe l’arrivée des disciples dans le cadre temporel de l’installation de Jésus. La traduction retient une antériorité naturelle sans attribuer à sa posture une portée cérémonielle ou doctrinale absente de la phrase.
translation_notes:
  register: Français international moderne, narratif et digne. Le texte privilégie des formulations accessibles, conserve le pluriel « les foules » et évite aussi bien l’archaïsme que l’explicitation théologique.
