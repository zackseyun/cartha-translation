  source_fidelity: Le texte rend fidèlement l’inférence de οὖν, le sens juridique-métaphorique de λύσῃ (« écarte »), la référence à l’un des commandements les plus petits, ainsi que le contraste entre celui qui écarte et enseigne ainsi et celui qui met en pratique et enseigne. « Aux autres à faire de même » explicite correctement οὕτως sans restreindre τοὺς ἀνθρώπους à un sexe. Le futur passif (« sera appelé »), l’emphase de οὗτος (« celui-là ») et le cadre « dans le royaume des cieux » sont conservés.
