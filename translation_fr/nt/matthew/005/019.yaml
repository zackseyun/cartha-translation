id: MAT.5.19
reference: Matthew 5:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἐὰν οὖν λύσῃ μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων καὶ διδάξῃ οὕτως τοὺς ἀνθρώπους, ἐλάχιστος κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν· ὃς δ’ ἂν ποιήσῃ καὶ διδάξῃ, οὗτος μέγας κληθήσεται ἐν τῇ βασιλείᾳ τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/019.yaml
  text: Therefore[a], whoever relaxes one of the least of these commandments and teaches others to do so will be called least in the kingdom of heaven; but whoever does them and teaches them[b], this one will be called great in the kingdom of heaven.
translation:
  language: fr
  text: Ainsi donc, celui qui écarte[a] l’un de ces plus petits commandements et enseigne aux autres à faire de même sera appelé le plus petit dans le royaume des cieux. Mais celui qui les met en pratique et les enseigne, celui-là sera appelé grand dans le royaume des cieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « délie ». Le verbe grec peut aussi se rendre par « abolit », « enfreint » ou « affaiblit »; ici, il évoque le fait d’écarter un commandement ou de le traiter comme non contraignant.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Ainsi donc
  rationale: Marque explicitement la conséquence tirée de l’affirmation précédente, dans un français naturel et soutenu.
- source_word: λύσῃ
  choice: écarte
  rationale: Dans ce contexte relatif aux commandements, le verbe signifie littéralement « délier » et peut évoquer le fait d’abolir, d’affaiblir ou de traiter comme non contraignant. « Écarte » conserve cette portée sans réduire le sens à la seule désobéissance.
- source_word: μίαν τῶν ἐντολῶν τούτων τῶν ἐλαχίστων
  choice: l’un de ces plus petits commandements
  rationale: Rend la construction qui classe un commandement parmi ceux considérés comme les plus petits, sans suggérer qu’il serait insignifiant.
- source_word: διδάξῃ οὕτως τοὺς ἀνθρώπους
  choice: enseigne aux autres à faire de même
  rationale: οὕτως renvoie à l’action précédente, tandis que ἀνθρώπους désigne ici les êtres humains en général. Cette formulation est claire et idiomatique en français.
- source_word: ἐλάχιστος κληθήσεται
  choice: sera appelé le plus petit
  rationale: Conserve le futur passif de καλέω et exprime naturellement en français le statut comparatif indiqué par ἐλάχιστος.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: dans le royaume des cieux
  rationale: Formule française traditionnelle et naturelle qui conserve le pluriel caractéristique de l’expression matthéenne.
- source_word: ποιήσῃ καὶ διδάξῃ
  choice: les met en pratique et les enseigne
  rationale: Avec des commandements pour objet implicite, « mettre en pratique » exprime clairement ποιέω sans introduire l’idée plus spécifique de mérite ou d’observance parfaite.
- source_word: οὗτος
  choice: celui-là
  rationale: Préserve l’emphase du démonstratif grec et renforce le contraste entre les deux personnes décrites.
- source_word: μέγας
  choice: grand
  rationale: Équivalent direct qui maintient l’opposition avec « le plus petit » sans transformer le terme en superlatif.
theological_decisions:
- issue: Statut de « plus petit » ou de « grand » dans le royaume
  choice: Conserver une description comparative au sein du royaume, sans préciser la nature de ce statut.
  alternative: Interpréter « le plus petit » comme exclu du royaume, ou « grand » comme un rang technique de récompense.
  rationale: Le texte dit « dans le royaume des cieux » et ne définit ni exclusion, ni système précis de mérite ou de récompense. La traduction maintient cette tension.
- issue: Portée de τοὺς ἀνθρώπους
  choice: « aux autres », avec une portée humaine générale
  alternative: « aux hommes »
  rationale: Dans ce contexte, le pluriel grec est générique. « Aux autres » rend naturellement en français les personnes auxquelles cet enseignement est transmis, sans limiter le référent aux hommes de sexe masculin.
- issue: Rapport entre action et enseignement
  choice: Maintenir conjointement « mettre en pratique » et « enseigner » sans établir une doctrine du salut par les œuvres.
  alternative: Présenter ces actes comme la cause explicite du salut ou d’une récompense céleste définie.
  rationale: Le verset associe la pratique et l’enseignement au fait d’être appelé grand, mais ne formule pas ici une doctrine complète du salut ou du mérite.
translation_notes:
  register: Français international moderne, digne et accessible. « Royaume des cieux » conserve l’expression caractéristique de Matthieu. La répétition et le démonstratif « celui-là » sont maintenus pour préserver le contraste rhétorique du grec.
