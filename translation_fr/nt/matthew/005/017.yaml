id: MAT.5.17
reference: Matthew 5:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον καταλῦσαι τὸν νόμον ἢ τοὺς προφήτας· οὐκ ἦλθον καταλῦσαι ἀλλὰ πληρῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/017.yaml
  text: Do not think that I came to abolish the Law or the Prophets[b][a]; I did not come to abolish them but to fulfill them.
translation:
  language: fr
  text: Ne pensez pas que je sois venu abolir la Loi ou les Prophètes. Je ne suis pas venu abolir, mais accomplir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Accomplir » peut aussi être compris au sens de « mener à son achèvement » ou « porter à sa pleine expression ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Ne pensez pas
  rationale: L’aoriste subjonctif avec μή exprime ici une défense. « Ne pensez pas » est direct, naturel et fidèle à la force de l’expression.
- source_word: ἦλθον
  choice: je sois venu / je ne suis pas venu
  rationale: Après « ne pensez pas que », le subjonctif passé est requis en français courant; dans la seconde proposition, le passé composé rend naturellement l’aoriste grec et conserve le parallélisme verbal.
- source_word: καταλῦσαι
  choice: abolir
  rationale: Avec « la Loi ou les Prophètes », le verbe signifie mettre hors vigueur ou supprimer, plutôt que détruire matériellement. « Abolir » exprime clairement cette valeur.
- source_word: τὸν νόμον ἢ τοὺς προφήτας
  choice: la Loi ou les Prophètes
  rationale: Les majuscules indiquent que l’expression renvoie aux Écritures d’Israël, considérées sous les catégories reconnues de la Loi et des Prophètes.
- source_word: ἀλλὰ πληρῶσαι
  choice: mais accomplir
  rationale: « Accomplir » conserve l’ampleur sémantique et la portée intertextuelle de πληρόω sans imposer une seule interprétation. En français, il n’est pas nécessaire d’ajouter un pronom objet, les compléments restant clairement sous-entendus.
theological_decisions:
- issue: Le sens de πληρῶσαι dans la relation de Jésus à « la Loi ou les Prophètes »
  choice: Conserver « accomplir » sans préciser une seule explication théologique
  alternative: mener à son achèvement / porter à sa pleine expression / confirmer
  rationale: Le terme grec peut évoquer l’accomplissement, l’achèvement ou la pleine réalisation. La formulation retenue préserve cette tension interprétative sans inscrire une doctrine particulière dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le subjonctif passé dans la première phrase et le passé composé dans la seconde sont idiomatiques. La répétition d’« abolir » reproduit l’insistance du grec; la ponctuation en deux phrases favorise la lisibilité sans modifier le rapport logique.
