id: MAT.5.46
reference: Matthew 5:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀγαπήσητε τοὺς ἀγαπῶντας ὑμᾶς, τίνα μισθὸν ἔχετε; οὐχὶ καὶ οἱ τελῶναι ⸂τὸ αὐτὸ⸃ ποιοῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/046.yaml
  text: For if you love those who love you[a], what reward do you have? Do not even the tax collectors do the same?
translation:
  language: fr
  text: En effet, si vous aimez ceux qui vous aiment, quelle récompense avez-vous[a] ? Même les collecteurs d’impôts n’en font-ils pas autant ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quel salaire avez-vous ? » Le mot grec peut désigner un salaire, une rétribution ou une récompense.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: En effet, si
  rationale: γάρ rattache l’énoncé à l’exhortation précédente, tandis que ἐάν introduit la condition. « En effet, si » rend naturellement les deux fonctions en français.
- source_word: ἀγαπήσητε
  choice: vous aimez
  rationale: L’aoriste subjonctif avec ἐάν exprime ici une condition générale ; le présent français convient sans surinterpréter l’aspect verbal.
- source_word: τοὺς ἀγαπῶντας ὑμᾶς
  choice: ceux qui vous aiment
  rationale: Le participe substantivé désigne les personnes caractérisées par leur amour envers les auditeurs, tout en conservant la répétition du verbe « aimer ».
- source_word: τίνα μισθὸν ἔχετε
  choice: quelle récompense avez-vous
  rationale: μισθός peut signifier salaire, rétribution ou récompense. Dans l’enseignement éthique de ce passage, « récompense » est clair et préserve la portée théologique sans imposer une conception mécanique du mérite.
- source_word: οὐχὶ καὶ
  choice: Même … n’… pas
  rationale: οὐχί introduit une question qui appelle une réponse affirmative, et καί met en relief le groupe comparé. La tournure française rend ensemble cette force rhétorique.
- source_word: οἱ τελῶναι
  choice: les collecteurs d’impôts
  rationale: Le terme désigne ceux qui percevaient taxes et péages. « Collecteurs d’impôts » est moderne, précis et intelligible dans l’ensemble du monde francophone.
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: n’en font-ils pas autant
  rationale: Cette expression française idiomatique signifie qu’ils accomplissent la même action et convient à la question rhétorique.
theological_decisions:
- issue: Sens de μισθός dans l’enseignement éthique de Jésus
  choice: récompense
  alternative: salaire / rétribution
  rationale: Le contexte oppose l’amour réciproque ordinaire à la conduite demandée aux disciples. « Récompense » maintient l’idée d’une contrepartie ou reconnaissance sans préciser abusivement sa nature ni importer une doctrine particulière du mérite.
translation_notes:
  register: Français international moderne, digne et accessible. La question finale conserve son attente implicite d’une réponse affirmative. « N’en font-ils pas autant ? » évite une formulation trop littérale tout en gardant la vigueur rhétorique.
