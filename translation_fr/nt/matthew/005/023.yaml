id: MAT.5.23
reference: Matthew 5:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν οὖν προσφέρῃς τὸ δῶρόν σου ἐπὶ τὸ θυσιαστήριον κἀκεῖ μνησθῇς ὅτι ὁ ἀδελφός σου ἔχει τι κατὰ σοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/023.yaml
  text: Therefore, if you are offering your gift on the altar, and there remember that your brother has something against you,
translation:
  language: fr
  text: Ainsi donc, si tu présentes ton offrande sur l’autel et que, là, tu te souviens que ton frère[a] a quelque chose contre toi,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton frère ou ta sœur » ; le grec dit « frère », terme masculin singulier qui peut avoir ici une valeur représentative.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Ainsi donc, si
  rationale: « Si » conserve la condition introduite par ἐάν, tandis que « ainsi donc » marque explicitement l’inférence signalée par οὖν et le lien avec l’enseignement précédent.
- source_word: προσφέρῃς
  choice: tu présentes
  rationale: Dans ce cadre cultuel, « présenter » exprime naturellement l’action d’apporter et d’offrir un don, sans imposer une valeur aspectuelle plus précise que le grec.
- source_word: τὸ δῶρόν σου
  choice: ton offrande
  rationale: δῶρον signifie littéralement « don », mais désigne ici un don cultuel. « Offrande » est le terme français naturel et précis dans le contexte de l’autel.
- source_word: ἐπὶ τὸ θυσιαστήριον
  choice: sur l’autel
  rationale: Avec ἐπί suivi de l’accusatif, la formulation représente l’offrande présentée sur l’autel; « sur l’autel » préserve cette orientation spatiale.
- source_word: κἀκεῖ
  choice: et que là
  rationale: « Là » conserve l’insistance spatiale de κἀκεῖ et rattache le souvenir au lieu même où l’offrande est présentée.
- source_word: μνησθῇς
  choice: tu te souviennes
  rationale: Le verbe déponent est naturellement rendu par « se souvenir »; le subjonctif français convient à la construction conditionnelle coordonnée.
- source_word: ὁ ἀδελφός σου
  choice: ton frère
  rationale: Le grec emploie un nom masculin singulier. La traduction principale en conserve la forme, tandis qu’une note signale sa possible portée représentative.
- source_word: ἔχει τι κατὰ σοῦ
  choice: a quelque chose contre toi
  rationale: Cette tournure idiomatique française correspond étroitement au grec et préserve l’indétermination de τι sans préciser la nature du grief.
theological_decisions:
- issue: Portée du terme de parenté ἀδελφός
  choice: ton frère
  alternative: ton frère ou ta sœur; un autre croyant
  rationale: Le texte grec porte explicitement le masculin singulier « frère ». Le conserver évite de neutraliser la forme source; la note reconnaît cependant que le terme peut fonctionner de manière représentative dans ce contexte.
- issue: Nature de ce que le frère a contre la personne
  choice: quelque chose contre toi
  alternative: un grief contre toi
  rationale: Le grec reste volontairement indéfini. La traduction ne précise donc ni la faute, ni sa gravité, ni la validité de l’accusation.
translation_notes:
  register: Français moderne, international et digne, avec tutoiement singulier conforme aux formes grecques. « Offrande » rend le contexte cultuel immédiatement clair. La phrase demeure inachevée, comme le verset grec, puisque la proposition principale vient au verset suivant.
