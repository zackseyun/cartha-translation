id: MAT.5.6
reference: Matthew 5:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριοι οἱ πεινῶντες καὶ διψῶντες τὴν δικαιοσύνην, ὅτι αὐτοὶ χορτασθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/006.yaml
  text: Blessed are those who hunger and thirst for righteousness[a], because they will be filled.
translation:
  language: fr
  text: Heureux ceux qui ont faim et soif de justice[a], car ils seront rassasiés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de droiture » ou « de ce qui est juste devant Dieu ». Le mot grec peut désigner la justice, la droiture ou ce qui est conforme à la volonté de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Formule traditionnelle et naturelle des béatitudes en français. Ici, « heureux » exprime une condition déclarée favorable par Dieu, et non une simple émotion passagère.
- source_word: οἱ πεινῶντες καὶ διψῶντες
  choice: ceux qui ont faim et soif
  rationale: Cette tournure idiomatique conserve l’image concrète ainsi que la force continue des participes présents grecs.
- source_word: τὴν δικαιοσύνην
  choice: de justice
  rationale: En français biblique moderne, « justice » peut désigner à la fois la conduite conforme à ce qui est juste, l’ordre juste et ce qui est droit devant Dieu. La note explicite cette ampleur sémantique sans la réduire.
- source_word: ὅτι
  choice: car
  rationale: « Car » introduit naturellement, dans un registre digne, le motif de la déclaration de bonheur.
- source_word: αὐτοὶ
  choice: ils
  rationale: Le pronom grec est emphatique, mais le rendre par « eux-mêmes » alourdirait inutilement la phrase française. Le contraste demeure perceptible dans la structure de la béatitude.
- source_word: χορτασθήσονται
  choice: seront rassasiés
  rationale: Le futur passif conserve l’image de la faim et de la soif satisfaites jusqu’à satiété. Le passif laisse implicitement Dieu comme agent, conformément à la formulation grecque.
theological_decisions:
- issue: Portée de δικαιοσύνη
  choice: justice
  alternative: droiture; ce qui est juste devant Dieu
  rationale: Le français « justice » est l’équivalent biblique usuel de δικαιοσύνη et peut couvrir ses dimensions personnelle, relationnelle et sociale. Une note préserve explicitement cette pluralité afin d’éviter de limiter le terme à la seule justice judiciaire ou sociale.
- issue: Agent du rassasiement
  choice: Maintien du passif « ils seront rassasiés »
  alternative: Dieu les rassasiera
  rationale: Le grec ne nomme pas l’agent. Le passif français préserve cette discrétion, souvent comprise comme un passif divin, sans ajouter explicitement « Dieu » au texte.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le rythme mémorable de la béatitude, son image alimentaire et le passif théologique du grec.
