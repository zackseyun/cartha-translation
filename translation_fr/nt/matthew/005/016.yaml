id: MAT.5.16
reference: Matthew 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως λαμψάτω τὸ φῶς ὑμῶν ἔμπροσθεν τῶν ἀνθρώπων, ὅπως ἴδωσιν ὑμῶν τὰ καλὰ ἔργα καὶ δοξάσωσιν τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/016.yaml
  text: In the same way[a], let your light shine before men[b], so that they may see your good works and glorify your Father who is in the heavens.
translation:
  language: fr
  text: De même, que votre lumière brille devant tous, afin qu’ils voient vos bonnes œuvres et rendent gloire à votre Père qui est dans les cieux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: De même
  rationale: Renvoie naturellement à l’image précédente de la lampe et exprime la manière dont la lumière doit briller.
- source_word: λαμψάτω τὸ φῶς ὑμῶν
  choice: que votre lumière brille
  rationale: Rend naturellement l’impératif grec à la troisième personne tout en conservant le singulier collectif « lumière ».
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: devant tous
  rationale: Dans ce contexte, ἄνθρωποι désigne les êtres humains en général. « Devant tous » exprime clairement cette portée sans suggérer qu’il s’agit uniquement des hommes de sexe masculin.
- source_word: ὅπως ἴδωσιν
  choice: afin qu’ils voient
  rationale: Préserve la valeur de but portée par ὅπως suivi du subjonctif.
- source_word: τὰ καλὰ ἔργα
  choice: vos belles œuvres
  rationale: καλά évoque ici des actes bons, nobles et admirables. « Belles œuvres » conserve cette nuance visible et attirante, tandis que le contexte en indique la valeur morale.
- source_word: δοξάσωσιν
  choice: rendent gloire à
  rationale: Expression française courante et précise pour δοξάζω lorsqu’il a Dieu pour objet.
- source_word: τὸν πατέρα ὑμῶν τὸν ἐν τοῖς οὐρανοῖς
  choice: votre Père qui est dans les cieux
  rationale: Conserve le langage relationnel ainsi que le pluriel οὐρανοῖς du texte grec.
theological_decisions:
- issue: Portée générique de ἀνθρώπων
  choice: devant tous
  alternative: devant les hommes
  rationale: Le nom grec a ici une portée humaine générale. Le français moderne « tous » communique cette universalité sans introduire une restriction masculine absente du sens contextuel.
- issue: Sens de καλὰ ἔργα
  choice: vos belles œuvres
  alternative: vos bonnes œuvres
  rationale: « Belles » préserve la qualité noble et admirable de καλά et s’accorde avec l’idée d’œuvres visibles qui conduisent autrui à glorifier le Père, sans nier leur bonté morale.
- issue: Pluriel οὐρανοῖς
  choice: dans les cieux
  alternative: au ciel
  rationale: Le pluriel du grec est conservé sans développer une cosmologie particulière.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde l’image de la lumière, l’impératif, la finalité du témoignage visible et le pluriel « les cieux », sans ajouter de précision confessionnelle.
