id: MAT.5.21
reference: Matthew 5:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἠκούσατε ὅτι ἐρρέθη τοῖς ἀρχαίοις· Οὐ φονεύσεις· ὃς δ’ ἂν φονεύσῃ, ἔνοχος ἔσται τῇ κρίσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/021.yaml
  text: You have heard that it was said to the ancients[a], ‘You shall not murder[c][b]; and whoever murders will be liable to judgment.’
translation:
  language: fr
  text: 'Vous avez entendu qu’il a été dit aux gens d’autrefois[a] : « Tu ne commettras pas de meurtre[b] ; quiconque commet un meurtre sera passible de jugement. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux anciens ».'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « Tu ne tueras pas » ; le verbe grec désigne ici plus précisément le meurtre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκούσατε
  choice: Vous avez entendu
  rationale: 'Le passé composé rend naturellement en français cette formule de discours : il s’agit d’un enseignement reçu dans le passé et toujours connu des auditeurs.'
- source_word: ἐρρέθη
  choice: il a été dit
  rationale: Le passif impersonnel conserve la formulation grecque sans préciser indûment qui a parlé.
- source_word: τοῖς ἀρχαίοις
  choice: aux gens d’autrefois
  rationale: Cette expression désigne naturellement les personnes des temps anciens et maintient le datif de destinataire, tout en évitant que « les anciens » soit compris seulement comme un titre de responsables communautaires.
- source_word: Οὐ φονεύσεις
  choice: Tu ne commettras pas de meurtre
  rationale: Le verbe φονεύω désigne le meurtre plutôt que toute mise à mort. Cette formulation française est précise et convient au singulier de la citation du commandement.
- source_word: ὃς δ’ ἂν φονεύσῃ
  choice: quiconque commet un meurtre
  rationale: Le relatif accompagné de ἄν et du subjonctif exprime ici une condition générale indéfinie, rendue naturellement par « quiconque ».
- source_word: ἔνοχος ἔσται τῇ κρίσει
  choice: sera passible de jugement
  rationale: La tournure conserve la portée judiciaire de ἔνοχος et de κρίσις sans décider si κρίσις désigne précisément un tribunal déterminé ou le jugement rendu.
theological_decisions:
- issue: Portée du sixième commandement cité
  choice: meurtre
  alternative: tuer
  rationale: φονεύω vise l’homicide meurtrier ou illicite, et non toute forme de mise à mort. « Meurtre » évite donc d’élargir théologiquement le commandement au-delà du grec.
- issue: Identité de celui qui a parlé autrefois
  choice: 'passif impersonnel : « il a été dit »'
  alternative: « Dieu a dit »
  rationale: Le texte grec ne nomme pas explicitement l’auteur de la parole. Le passif français préserve cette réserve et n’élimine pas la possible portée divine de la formule.
- issue: Nature précise de la κρίσις
  choice: jugement
  alternative: tribunal
  rationale: « Jugement » maintient l’ambiguïté entre la procédure ou décision judiciaire et une instance juridictionnelle, sans préciser davantage que le verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier est conservé dans la citation du commandement. Le point-virgule présente le commandement et sa conséquence judiciaire comme une seule unité de tradition reçue.
