  text: ἔστω δὲ ὁ λόγος ὑμῶν ναὶ ναί, οὒ οὔ· τὸ δὲ περισσὸν τούτων ἐκ τοῦ πονηροῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/037.yaml
  text: But let your word be[a], ‘Yes, yes,’ or ‘No, no.’ Anything beyond these is from the evil one.
translation:
  language: fr
  text: 'Mais que votre parole soit : « Oui, oui » ou « Non, non ». Tout ce qui va au-delà de cela vient du Mauvais[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du mal ». Le grec τοῦ πονηροῦ peut désigner soit le Mauvais, soit le mal.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστω
  choice: que … soit
  rationale: Le présent impératif à la troisième personne de εἰμί se rend naturellement en français par une tournure exhortative au subjonctif.
- source_word: ὁ λόγος ὑμῶν
  choice: votre parole
  rationale: Dans ce contexte, λόγος désigne ce que l’on dit. « Votre parole » conserve la formulation concise et proverbiale du grec.
- source_word: ναὶ ναί, οὒ οὔ
  choice: '« Oui, oui », ou : « Non, non »'
  rationale: Le redoublement des particules est maintenu pour préserver l’insistance et le rythme de l’original ; « ou » explicite naturellement le contraste en français.
- source_word: τὸ δὲ περισσὸν τούτων
  choice: Tout ce qui va au-delà
  rationale: L’adjectif substantivé περισσόν désigne ce qui dépasse les simples réponses qui précèdent. Cette formulation française restitue clairement la valeur comparative sans préciser abusivement la nature de cet ajout.
- source_word: ἐκ
  choice: vient de
  rationale: La préposition indique ici la source ou l’origine ; la tournure verbale est naturelle en français.
- source_word: τοῦ πονηροῦ
  choice: du Mauvais
  rationale: La forme grecque peut désigner soit le mal de manière impersonnelle, soit personnellement le Mauvais. Dans Matthieu, l’emploi personnel est probable ; la majuscule signale ce sens tout en conservant l’autre possibilité en note.
theological_decisions:
- issue: τοῦ πονηροῦ désigne-t-il le mal en général ou personnellement le Mauvais ?
  choice: du Mauvais
  alternative: du mal
  rationale: La grammaire permet les deux lectures. L’usage matthéen favorise souvent une référence personnelle, mais l’ambiguïté réelle est préservée par une note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste concise afin de préserver la force proverbiale de la parole, et le redoublement « Oui, oui » / « Non, non » suit délibérément le grec.
