  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριοι οἱ καθαροὶ τῇ καρδίᾳ, ὅτι αὐτοὶ τὸν θεὸν ὄψονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/008.yaml
  text: Blessed are the pure in heart[b][a], because they will see God.
translation:
  language: fr
  text: Heureux ceux qui ont le cœur pur[a], car ils verront Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « pur » peut aussi signifier « propre ». Ici, il qualifie le cœur, c’est-à-dire la personne intérieure.
    reason: lexical_alternative
  - marker: b
    text: La promesse de « voir Dieu » peut désigner l’accès direct à sa présence, y compris dans son accomplissement futur. La traduction conserve la formulation sans en restreindre le sens.
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριοι
  choice: Heureux
  rationale: Formulation naturelle et consacrée des béatitudes en français. Elle décrit une condition enviable liée à la faveur de Dieu, sans se limiter à une émotion passagère.
- source_word: οἱ καθαροὶ τῇ καρδίᾳ
  choice: ceux qui ont le cœur pur
  rationale: Cette tournure française naturelle exprime la pureté de la personne intérieure. « Pur » convient ici au sens moral et intérieur de καθαρός, tout en conservant son lien possible avec l’idée de propreté ou de purification.
- source_word: ὅτι
  choice: car
  rationale: « Car » introduit clairement le fondement de la déclaration et s’intègre mieux que « parce que » à cette phrase française de registre digne.
- source_word: αὐτοὶ
  choice: ils
  rationale: Le pronom grec est emphatique, mais la structure française de la béatitude permet de désigner clairement les mêmes personnes sans recourir à la formulation plus lourde « eux-mêmes ».
- source_word: τὸν θεὸν
  choice: Dieu
  rationale: Complément direct de ὄψονται, rendu simplement et naturellement.
- source_word: ὄψονται
  choice: verront
  rationale: Le futur direct préserve la concision et la force de la promesse grecque sans en préciser davantage la manière ou le moment.
theological_decisions:
- issue: Sens de « voir Dieu »
  choice: Conserver « ils verront Dieu » sans développement interprétatif.
  alternative: « ils connaîtront la présence de Dieu » ou « ils contempleront Dieu lors de l’accomplissement final »
  rationale: L’expression peut évoquer l’accès direct à la présence de Dieu et son accomplissement futur, mais le grec reste concis. La traduction maintient donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste accessible, tout en conservant la structure concise de la béatitude et la portée ouverte de sa promesse.
