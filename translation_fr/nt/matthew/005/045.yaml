reference: Matthew 5:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπως γένησθε υἱοὶ τοῦ πατρὸς ὑμῶν τοῦ ⸀ἐν οὐρανοῖς, ὅτι τὸν ἥλιον αὐτοῦ ἀνατέλλει ἐπὶ πονηροὺς καὶ ἀγαθοὺς καὶ βρέχει ἐπὶ δικαίους καὶ ἀδίκους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/045.yaml
  text: so that you may become sons of your Father in heaven[a], because he makes his sun rise on evil and good[c][b], and sends rain on righteous and unrighteous.
translation:
  language: fr
  text: afin que vous deveniez fils de votre Père[a] qui est dans les cieux[b], car il fait lever son soleil sur les méchants et les bons, et il fait pleuvoir sur les justes et les injustes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants de votre Père ». Le grec dit littéralement « fils », terme conservé dans le texte pour préserver le langage filial de la source.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « qui est au ciel ». Le grec emploie le pluriel : « dans les cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit ici le but ou le résultat visé. « Afin que » en conserve nettement la valeur tout en restant naturel en français.
- source_word: γένησθε
  choice: vous deveniez
  rationale: Rend la valeur dynamique de γίνομαι (« devenir », « parvenir à être ») sans la réduire au simple verbe « être ».
- source_word: υἱοὶ
  choice: fils
  rationale: Le grec emploie explicitement le masculin pluriel υἱοί. « Fils » préserve le langage filial de la source; sa portée contextuelle peut inclure l’ensemble des disciples.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: de votre Père
  rationale: Reproduit directement le groupe génitif et garde distincte la précision suivante concernant les cieux.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: qui est dans les cieux
  rationale: Rend explicitement la proposition grecque et conserve le pluriel οὐρανοῖς, courant dans cette expression matthéenne.
- source_word: ὅτι
  choice: car
  rationale: Introduit l’explication qui fonde l’exhortation précédente. « Car » assure une articulation claire et digne en français.
- source_word: τὸν ἥλιον αὐτοῦ
  choice: son soleil
  rationale: Conserve le possessif explicite αὐτοῦ, qui souligne que le soleil appartient à Dieu et relève de sa providence.
- source_word: ἀνατέλλει
  choice: il fait lever
  rationale: La construction causative française exprime naturellement l’action de Dieu à l’égard du soleil.
- source_word: ἐπὶ πονηροὺς καὶ ἀγαθοὺς
  choice: sur les méchants et sur les bons
  rationale: Les adjectifs grecs sont substantivés. Les articles sont nécessaires en français; la répétition de « sur » maintient l’équilibre de la formule.
- source_word: βρέχει
  choice: il fait pleuvoir
  rationale: Rend directement le verbe grec tout en exprimant naturellement en français que Dieu est l’agent de la pluie.
- source_word: ἐπὶ δικαίους καὶ ἀδίκους
  choice: sur les justes et sur les injustes
  rationale: Préserve l’opposition morale établie entre δίκαιοι et ἄδικοι ainsi que le parallélisme de la phrase.
theological_decisions:
- issue: Langage filial genré
  choice: fils de votre Père
  alternative: enfants de votre Père
  rationale: Le texte porte υἱοί (« fils »), non τέκνα (« enfants »). Le choix principal conserve donc l’image précise de la filiation, sans exclure les femmes de la portée de l’enseignement adressé aux disciples.
- issue: Portée de γένησθε relativement à la filiation divine
  choice: vous deveniez
  alternative: vous soyez / vous vous montriez
  rationale: « Deveniez » conserve la force lexicale du grec et la tension du passage. La traduction n’explicite pas un mécanisme d’adoption ni ne remplace le devenir par la seule manifestation d’un statut; dans le contexte, l’appel porte sur la ressemblance avec le Père dans la conduite.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme antithétique du grec, le possessif « son soleil » et l’action directe de Dieu. « Dans les cieux » garde la forme matthéenne sans rendre la phrase difficile.
