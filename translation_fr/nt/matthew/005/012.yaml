id: MAT.5.12
reference: Matthew 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χαίρετε καὶ ἀγαλλιᾶσθε, ὅτι ὁ μισθὸς ὑμῶν πολὺς ἐν τοῖς οὐρανοῖς· οὕτως γὰρ ἐδίωξαν τοὺς προφήτας τοὺς πρὸ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/012.yaml
  text: Rejoice and be very glad[a], because your reward is great in the heavens; for in this way they persecuted the prophets who were before you.
translation:
  language: fr
  text: Réjouissez-vous et soyez transportés de joie, car votre récompense est grande dans les cieux. En effet, c’est ainsi qu’on a persécuté les prophètes qui vous ont précédés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρετε
  choice: Réjouissez-vous
  rationale: L’impératif présent appelle collectivement les disciples à se réjouir activement ; cette formulation est naturelle, claire et digne en français.
- source_word: ἀγαλλιᾶσθε
  choice: soyez transportés de joie
  rationale: Le verbe exprime une joie intense et exubérante. Cette tournure accessible conserve l’intensification par rapport à χαίρετε sans recourir au plus soutenu « exultez ».
- source_word: μισθὸς
  choice: récompense
  rationale: Dans ce contexte de rétribution divine face à la persécution, « récompense » convient mieux que « salaire », qui risquerait d’introduire une nuance trop commerciale.
- source_word: πολὺς
  choice: grande
  rationale: L’adjectif souligne l’importance de la récompense ; « grande » est l’association idiomatique naturelle en français.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  rationale: Le pluriel du grec est conservé parce que « les cieux » reste naturel et intelligible en français, tout en reflétant l’usage caractéristique de Matthieu.
- source_word: οὕτως
  choice: c’est ainsi
  rationale: Cette expression indique une correspondance de manière entre la persécution des disciples et celle des prophètes.
- source_word: ἐδίωξαν
  choice: on a persécuté
  rationale: Le sens hostile de διώκω est certain dans le contexte. Le pronom « on » rend naturellement en français le sujet pluriel non exprimé et non identifié du grec.
- source_word: τοὺς προφήτας
  choice: les prophètes
  rationale: C’est la désignation française habituelle des prophètes d’Israël.
- source_word: τοὺς πρὸ ὑμῶν
  choice: qui vous ont précédés
  rationale: La proposition relative rend clairement l’antériorité historique exprimée par la construction grecque, dans un français plus naturel que « qui étaient avant vous ».
theological_decisions:
- issue: Sens de « dans les cieux »
  choice: Conserver le pluriel et laisser la phrase désigner le domaine céleste où se trouve la récompense auprès de Dieu.
  alternative: « au ciel », formulation française plus idiomatique au singulier
  rationale: Le pluriel grec peut être rendu naturellement en français et sa conservation n’impose aucune précision doctrinale supplémentaire sur la nature ou le moment de la récompense.
- issue: Rapport entre persécution et récompense
  choice: Conserver le lien causal exprimé par « car » sans expliquer davantage la nature du mérite ou de la rétribution.
  alternative: Expliciter que la récompense serait gagnée par la souffrance
  rationale: Le verset affirme la grandeur de la récompense comme motif de joie, mais ne développe pas ici un système doctrinal du mérite ; la traduction ne doit pas résoudre cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Soyez transportés de joie » garde l’intensité du second impératif tout en restant plus immédiatement compréhensible que « exultez ». La ponctuation en deux phrases allège la lecture sans modifier le rapport logique marqué par γάρ.
