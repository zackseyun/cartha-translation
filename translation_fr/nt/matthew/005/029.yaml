id: MAT.5.29
reference: Matthew 5:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ὁ ὀφθαλμός σου ὁ δεξιὸς σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ, συμφέρει γάρ σοι ἵνα ἀπόληται ἓν τῶν μελῶν σου καὶ μὴ ὅλον τὸ σῶμά σου βληθῇ εἰς γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/005/029.yaml
  text: But if your right eye causes you to stumble[a], tear it out and throw it away from you[b]. For it is better for you that one of your members should perish than that your whole body should be thrown into Gehenna.
translation:
  language: fr
  text: Mais si ton œil droit te fait tomber[a], arrache-le et jette-le loin de toi. Car il vaut mieux pour toi qu’un seul de tes membres périsse plutôt que tout ton corps ne soit jeté dans la géhenne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te fait pécher ».'
    reason: lexical_alternative
  - marker: b
    text: La géhenne est la forme grecque d’un nom associé à la vallée de Hinnom; le terme est traditionnellement traduit par « enfer ».
    reason: historical_and_translation_note
lexical_decisions:
- source_word: σκανδαλίζει
  choice: te fait tomber
  rationale: Cette formulation conserve l’image grecque de la chute tout en restant compréhensible en français moderne. Dans ce contexte, la chute est morale; la note donne donc l’explicitation possible « te fait pécher ».
- source_word: ἔξελε
  choice: arrache-le
  rationale: L’impératif exprime une action énergique. « Arrache-le » restitue l’image volontairement violente et urgente mieux que le plus neutre « enlève-le ».
- source_word: βάλε ἀπὸ σοῦ
  choice: jette-le loin de toi
  rationale: « Jette » garde la force de βάλε, tandis que « loin de toi » exprime nettement la séparation indiquée par ἀπὸ σοῦ.
- source_word: συμφέρει
  choice: il vaut mieux pour toi
  rationale: Cette tournure française naturelle rend l’idée d’avantage personnel et introduit clairement la comparaison qui suit.
- source_word: ἀπόληται
  choice: périsse
  rationale: « Périsse » conserve la gravité du verbe sans préciser davantage la nature de la perte du membre.
- source_word: ἓν τῶν μελῶν σου
  choice: un seul de tes membres
  rationale: « Membre » désigne ici une partie du corps et maintient le contraste avec le corps tout entier; « seul » fait ressortir la valeur de ἓν dans cette opposition.
- source_word: βληθῇ
  choice: soit jeté
  rationale: Le passif français correspond directement au passif grec et en conserve la force.
- source_word: γέενναν
  choice: la géhenne
  rationale: La translittération préserve le terme historique et religieux particulier employé dans le texte grec, sans le réduire d’emblée au terme théologique plus général « enfer ».
- source_word: ὁ δεξιὸς
  choice: droit
  rationale: Le détail explicite selon lequel il s’agit de l’œil droit est conservé.
- source_word: δὲ
  choice: Mais
  rationale: « Mais » rend la légère valeur contrastive de δέ dans la continuité du passage.
theological_decisions:
- issue: Traduction de γέεννα
  choice: la géhenne
  alternative: l’enfer
  rationale: Garder le terme distinct « géhenne » respecte la formulation grecque et laisse subsister ses associations historiques et théologiques sans les assimiler silencieusement à une notion ultérieure plus générale. La traduction traditionnelle figure en note.
- issue: Force métaphorique de σκανδαλίζω
  choice: te fait tomber
  alternative: te fait pécher
  rationale: Le texte principal conserve l’image de la chute présente dans le grec. Le contexte lui donne une portée morale, que la note explicite sans remplacer la métaphore.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement suit l’adresse individuelle au singulier du grec. La vigueur des impératifs et l’image saisissante sont conservées, tandis que la syntaxe comparative demeure naturelle en français.
