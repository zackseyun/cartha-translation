id: MAT.1.15
reference: Matthew 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐλιοὺδ δὲ ἐγέννησεν τὸν Ἐλεάζαρ, Ἐλεάζαρ δὲ ἐγέννησεν τὸν Ματθάν, Ματθὰν δὲ ἐγέννησεν τὸν Ἰακώβ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/015.yaml
  text: Eliud fathered Eleazar, and Eleazar fathered Matthan, and Matthan fathered Jacob.
translation:
  language: fr
  text: Élioud engendra Éléazar, Éléazar engendra Matthan, et Matthan engendra Jacob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλιοὺδ
  choice: Élioud
  rationale: Nom propre translittéré selon l’usage biblique français courant, avec les accents nécessaires à une lecture naturelle.
- source_word: δὲ
  choice: ponctuation / « et »
  rationale: Dans cette généalogie, δέ est un connecteur léger qui fait progresser l’énumération. Le français naturel peut l’exprimer par une virgule entre les deux premières propositions et par « et » avant la dernière.
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans une généalogie, le verbe désigne la paternité ou la descendance. « Engendra » est précis, concis et consacré dans le registre biblique français, sans imposer que chaque relation soit nécessairement comprise hors de toute profondeur généalogique.
- source_word: τὸν
  choice: non traduit séparément
  rationale: L’article grec marque ici le complément d’objet devant un nom propre ; le français n’emploie normalement pas d’article dans cette construction.
- source_word: Ἐλεάζαρ
  choice: Éléazar
  rationale: Forme traditionnelle et intelligible du nom dans les Bibles françaises.
- source_word: Ματθάν
  choice: Matthan
  rationale: Translittération conforme à l’usage biblique français.
- source_word: Ἰακώβ
  choice: Jacob
  rationale: Forme française biblique traditionnelle du nom.
theological_decisions: []
translation_notes:
  register: Style généalogique concis, digne et actuel. « Engendra » conserve la précision de la formule grecque tout en restant immédiatement compréhensible. La variation légère des connecteurs évite une répétition pesante sans effacer la progression de la liste.
