id: MAT.1.11
reference: Matthew 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰωσίας δὲ ἐγέννησεν τὸν Ἰεχονίαν καὶ τοὺς ἀδελφοὺς αὐτοῦ ἐπὶ τῆς μετοικεσίας Βαβυλῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/011.yaml
  text: Josiah fathered Jeconiah and his brothers at the time of the deportation to Babylon[a].
translation:
  language: fr
  text: Josias engendra Jéconias et ses frères à l’époque de la déportation à Babylone[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pendant l’exil à Babylone ». Le terme grec peut désigner un déplacement forcé ou un exil ; « déportation » souligne le caractère contraint de l’événement.
    reason: Alternative lexicale pour μετοικεσία.
lexical_decisions:
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans la formule généalogique de Matthieu, le verbe désigne l’engendrement ou la filiation du côté paternel. « Engendra » est concis, digne et traditionnellement intelligible en français biblique, sans développer le texte.
- source_word: Ἰεχονίαν
  choice: Jékonias
  rationale: Cette forme française usuelle translittère le nom grec Ἰεχονίας et permet de reconnaître le personnage biblique.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: ses frères
  rationale: Le grec emploie un pluriel masculin explicite, qui désigne ici les parents masculins mentionnés avec Jékonias.
- source_word: ἐπὶ τῆς μετοικεσίας Βαβυλῶνος
  choice: à l’époque de la déportation à Babylone
  rationale: μετοικεσία évoque un déplacement forcé, donc une déportation; ἐπί avec le génitif a ici une valeur temporelle, et Babylone est la destination.
- source_word: δὲ
  choice: non rendu séparément
  rationale: Cette particule assure une liaison légère dans la généalogie; le français naturel n’exige pas ici de connecteur explicite.
theological_decisions:
- issue: Compression généalogique dans la lignée rapportée par Matthieu
  choice: Traduire directement la formule généalogique sans résoudre dans le texte principal les questions historiques liées aux générations omises.
  alternative: Comprendre ἐγέννησεν comme pouvant exprimer une ascendance plus large plutôt qu’une paternité biologique immédiate à chaque maillon.
  rationale: Le style généalogique biblique peut comprimer certaines générations. « Engendra » reflète toutefois la formulation grecque et préserve la tension sans ajouter une harmonisation interprétative.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure généalogique « engendra » conserve la concision répétitive du passage; « à l’époque de » rend naturellement la valeur temporelle de la construction grecque.
