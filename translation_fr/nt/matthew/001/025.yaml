  text: καὶ οὐκ ἐγίνωσκεν αὐτὴν ἕως οὗ ἔτεκεν ⸀υἱόν· καὶ ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/025.yaml
  text: And he did not know her until she gave birth to a son[c][b][a], and he called his name Jesus.
translation:
  language: fr
  text: Il n’avait pas de relations sexuelles avec elle[a] jusqu’à ce qu’elle donne naissance à un fils[b], et il lui donna le nom de Jésus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il ne la connaissait pas ». Le grec emploie « connaître » comme euphémisme pour parler des relations sexuelles.'
    reason: lexical_alternative
  - marker: b
    text: « Jusqu’à ce que » indique ce qui était vrai jusqu’à la naissance de Jésus ; cette expression ne détermine pas, à elle seule, ce qui s’est passé ensuite.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « il appela son nom Jésus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: n’eut pas de relations conjugales avec elle
  rationale: Dans ce contexte, γινώσκω (« connaître ») est un euphémisme désignant les relations sexuelles. La formulation choisie en exprime naturellement le sens en français moderne tout en gardant un registre digne.
- source_word: ἕως οὗ
  choice: jusqu’à ce que
  rationale: Cette tournure temporelle française correspond naturellement au grec et indique ce qui était vrai jusqu’à la naissance, sans déterminer à elle seule ce qui s’est passé ensuite.
- source_word: ἔτεκεν
  choice: donne naissance
  rationale: Rendu courant et naturel de τίκτω en français moderne.
- source_word: υἱόν
  choice: un fils
  rationale: Le nom grec sans article se rend naturellement ici par l’indéfini « un fils », sans ajouter une emphase absente du texte source.
- source_word: ἐκάλεσεν τὸ ὄνομα αὐτοῦ Ἰησοῦν
  choice: il lui donna le nom de Jésus
  rationale: Cette expression française restitue de manière idiomatique la tournure sémitique du grec, littéralement « il appela son nom Jésus ».
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: « Jésus » est la forme française conventionnelle du nom dans le Nouveau Testament.
theological_decisions:
- issue: Portée de « jusqu’à ce que » quant à la vie conjugale ultérieure de Marie
  choice: Rendre ἕως οὗ par « jusqu’à ce que » sans affirmer ni nier l’existence de relations conjugales après la naissance de Jésus.
  alternative: Certains comprennent que les relations conjugales ont commencé ensuite ; d’autres estiment que cette tournure n’implique aucun changement après le terme indiqué.
  rationale: L’expression grecque établit une limite temporelle jusqu’à la naissance, mais ne tranche pas par elle-même la question de ce qui s’est passé ensuite. La note préserve cette tension sans importer une conclusion confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. Le texte principal explicite l’euphémisme grec afin d’éviter l’opacité de « ne pas connaître une femme » pour le lecteur contemporain, tandis que la note conserve la forme littérale. La coordination de la phrase grecque est maintenue.
