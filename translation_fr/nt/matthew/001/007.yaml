source:
  edition: SBLGNT
  text: Σολομὼν δὲ ἐγέννησεν τὸν Ῥοβοάμ, Ῥοβοὰμ δὲ ἐγέννησεν τὸν Ἀβιά, Ἀβιὰ δὲ ἐγέννησεν τὸν ⸂Ἀσάφ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/007.yaml
  text: Solomon fathered Rehoboam[a], Rehoboam fathered Abijah, and Abijah fathered Asaph.
translation:
  language: fr
  text: Salomon fut le père de Roboam ; Roboam fut le père d’Abia ; Abia fut le père d’Asaph[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « Asa », conformément au nom du roi de Juda mentionné en 1 Rois 15 et en 2 Chroniques 14–16 ; le texte grec retenu ici porte « Asaph ».
    reason: textual_variant
lexical_decisions:
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans cette généalogie, γεννάω exprime la paternité et la descendance. « Engendra » est concis, digne et bien établi en français dans ce contexte, sans ajouter une précision absente du grec.
- source_word: δὲ
  choice: ponctuation, puis « et » dans le dernier membre
  rationale: Ici, δέ est un connecteur léger qui fait progresser la chaîne généalogique, sans valeur adversative. La répétition est rendue naturellement par des virgules et par « et » avant le dernier membre.
- source_word: Σολομών
  choice: Salomon
  rationale: Forme française usuelle du nom biblique.
- source_word: Ῥοβοάμ
  choice: Roboam
  rationale: Forme française usuelle du nom biblique.
- source_word: Ἀβιά
  choice: Abia
  rationale: Forme française biblique traditionnelle correspondant au nom royal de l’Ancien Testament et proche de la forme grecque.
- source_word: Ἀσάφ
  choice: Asaph
  rationale: Le texte grec édité porte Ἀσάφ. La traduction conserve donc « Asaph » dans le texte principal, au lieu d’harmoniser silencieusement avec le roi Asa.
theological_decisions:
- issue: Faut-il harmoniser la généalogie de Matthieu avec la liste des rois de l’Ancien Testament en traduisant Ἀσάφ par « Asa » ?
  choice: Conserver « Asaph » dans le texte principal.
  alternative: Lire « Asa », nom du roi de Juda mentionné en 1 Rois 15 et en 2 Chroniques 14–16.
  rationale: La source grecque fournie lit Ἀσάφ. La priorité donnée au texte source exige de préserver cette lecture et de signaler l’autre lecture en note, plutôt que de résoudre implicitement la difficulté généalogique.
translation_notes:
  register: Français international moderne, clair et digne. La structure répétitive du grec est conservée parce qu’elle caractérise la généalogie, tandis que les connecteurs sont rendus avec une ponctuation française naturelle. Le marqueur de note est placé après « Asaph », le mot concerné par la variante.
