  yaml_path: translation/nt/matthew/001/004.yaml
  text: Aram fathered Amminadab[a], and Amminadab fathered Nahshon, and Nahshon fathered Salmon.
translation:
  language: fr
  text: Aram engendra Amminadab[a], Amminadab engendra Nahshôn, et Nahshôn engendra Salmôn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou Ram. Le grec porte Aram (Ἀράμ) ; « Ram » correspond à une forme utilisée dans des généalogies d’origine hébraïque.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρὰμ
  choice: Aram
  rationale: Translittération directe de la forme grecque Ἀράμ. La forme correspond aussi à l’usage français courant dans la généalogie de Matthieu.
- source_word: δὲ
  choice: absence de rendu explicite dans les deux premiers membres, puis « et »
  rationale: Dans cette énumération, δέ assure la progression sans exprimer de contraste marqué. La ponctuation et un dernier « et » rendent naturellement l’enchaînement répétitif en français.
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans une généalogie masculine, le verbe désigne la procréation ou la filiation ancestrale. « Engendra » est concis, précis et demeure compréhensible dans le registre biblique français.
- source_word: Ἀμιναδάβ
  choice: Amminadab
  rationale: Translittération française biblique usuelle, qui conserve les deux m de la forme grecque.
- source_word: Ναασσών
  choice: Nahshôn
  rationale: Forme française biblique reconnaissable, correspondant au nom hébreu représenté par le grec Ναασσών.
- source_word: Σαλμών
  choice: Salmôn
  rationale: Forme française traditionnelle et reconnaissable du nom propre, avec accent circonflexe indiquant la voyelle longue usuelle dans sa francisation.
