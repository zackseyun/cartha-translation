id: MAT.1.8
reference: Matthew 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀσὰφ⸃ δὲ ἐγέννησεν τὸν Ἰωσαφάτ, Ἰωσαφὰτ δὲ ἐγέννησεν τὸν Ἰωράμ, Ἰωρὰμ δὲ ἐγέννησεν τὸν Ὀζίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/008.yaml
  text: Asaph fathered Jehoshaphat[a], Jehoshaphat fathered Joram, and Joram fathered Uzziah.
translation:
  language: fr
  text: Asaph[a] engendra Josaphat, Josaphat engendra Joram, et Joram engendra Ozias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « Asa » au lieu d’« Asaph » ; « Asa » correspond aussi au nom du roi de Juda dans la généalogie de l’Ancien Testament.
    reason: textual_variant
lexical_decisions:
- source_word: Ἀσὰφ
  choice: Asaph
  rationale: Le texte grec de la SBLGNT porte Ἀσάφ. Le texte principal translittère donc cette forme au lieu de l’harmoniser silencieusement avec Asa, le roi visé dans l’arrière-plan généalogique de l’Ancien Testament.
- source_word: δὲ
  choice: ponctuation, puis « et » dans la dernière proposition
  rationale: Dans cette généalogie, δέ est un connecteur léger et non adversatif. En français, la juxtaposition des deux premières propositions et « et » avant la dernière donnent un enchaînement naturel tout en conservant la structure.
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans une généalogie, « engendra » exprime de façon concise et digne le lien paternel. Le terme demeure immédiatement intelligible en français biblique moderne.
- source_word: Ἰωσαφάτ
  choice: Josaphat
  rationale: Forme française biblique usuelle du nom du roi de Juda correspondant au grec Ἰωσαφάτ.
- source_word: Ἰωράμ
  choice: Joram
  rationale: Translittération française courante de la forme grecque Ἰωράμ, qui conserve ici la forme courte du nom.
- source_word: Ὀζίαν
  choice: Ozias
  rationale: Forme française biblique traditionnelle et reconnaissable du nom royal porté par le grec Ὀζίας à l’accusatif.
theological_decisions:
- issue: Rendu de la succession généalogique marquée par la répétition de δὲ et ἐγέννησεν
  choice: Conserver chaque lien généalogique, avec juxtaposition puis un dernier « et » pour un français fluide.
  alternative: Répéter « et » devant chacune des propositions, ou employer trois propositions séparées par des points-virgules.
  rationale: Cette décision stylistique préserve exactement la séquence des trois liens tout en évitant une coordination pesante en français.
- issue: Harmonisation éventuelle de Ἀσὰφ avec le nom historique attendu, Asa
  choice: Garder « Asaph » dans le texte principal et signaler « Asa » en note.
  alternative: Mettre « Asa » dans le texte principal en harmonisant avec la généalogie de l’Ancien Testament.
  rationale: La priorité accordée au texte grec reçu impose de traduire la forme effectivement attestée sans résoudre silencieusement la tension avec l’arrière-plan historique.
translation_notes:
  register: Français international moderne, sobre et digne. « Engendra » conserve la concision propre à une généalogie biblique. Les noms suivent leurs formes françaises bibliques usuelles, tandis qu’« Asaph » reproduit délibérément la forme du texte grec.
