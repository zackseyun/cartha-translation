lexical_decisions:
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans cette généalogie, le verbe désigne l’engendrement ou la filiation du côté paternel. « Engendra » conserve cette formule généalogique avec dignité et concision.
- source_word: ἐκ
  choice: né de
  rationale: Avec le nom de la mère, ἐκ marque ici l’origine maternelle. « Né de » l’exprime clairement et naturellement en français, sans effacer la mention inhabituelle des mères.
- source_word: δὲ
  choice: ponctuation de coordination, puis « et »
  rationale: δέ est ici un connecteur léger, non adversatif. Les points-virgules rendent l’enchaînement généalogique naturel, tandis que « et » introduit le dernier membre.
- source_word: Σαλμὼν
  choice: Salmon
  rationale: Forme française biblique usuelle du nom.
- source_word: Βόες
  choice: Booz
  rationale: Forme française biblique traditionnelle qui permet de reconnaître le personnage de l’Ancien Testament.
- source_word: Ῥαχάβ
  choice: Rahab
  rationale: Forme française biblique usuelle du nom.
- source_word: Ἰωβὴδ
  choice: Obed
  rationale: Forme française biblique usuelle, assurant la continuité avec le personnage de l’Ancien Testament.
- source_word: Ῥούθ
  choice: Ruth
  rationale: Forme française biblique usuelle, identique au titre du livre biblique.
- source_word: Ἰεσσαί
  choice: Jessé
  rationale: Forme française biblique usuelle du nom.
theological_decisions:
- issue: Formule généalogique et mention des mères
  choice: Conserver la ligne paternelle par « engendra » et rendre explicitement l’origine maternelle par « né de Rahab » et « né de Ruth ».
  alternative: « Salmon engendra Booz de Rahab, et Booz engendra Obed de Ruth » ou « avec Rahab/avec Ruth ».
  rationale: Le grec nomme expressément les mères au moyen de ἐκ. « Né de » préserve cette particularité et le sens d’origine maternelle, tandis que « avec » pourrait suggérer une relation conjugale ou sexuelle que la préposition seule n’explicite pas.
translation_notes:
  register: Français moderne, sobre et digne. « Engendra » relève du registre généalogique biblique mais demeure immédiatement compréhensible. Les points-virgules évitent une succession lourde de « et » sans perdre le rythme de la généalogie.
