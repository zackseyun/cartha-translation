id: MAT.1.16
reference: Matthew 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰωσὴφ τὸν ἄνδρα Μαρίας, ἐξ ἧς ἐγεννήθη Ἰησοῦς ὁ λεγόμενος χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/016.yaml
  text: And Jacob fathered Joseph[a], the husband of Mary, from whom Jesus was born[b], who is called the Messiah.
translation:
  language: fr
  text: Jacob engendra Joseph, l’époux de Marie, de laquelle naquit Jésus, celui qu’on appelle le Messie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: '[non exprimé séparément]'
  rationale: Dans cette suite généalogique, δέ assure une légère transition. En français, la simple juxtaposition des générations rend naturellement cette continuité sans alourdir la phrase par « et » ou « puis ».
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans une généalogie, « engendra » exprime avec concision la filiation paternelle et reste intelligible dans un registre biblique digne, sans être aussi archaïque que d’autres tournures possibles.
- source_word: τὸν ἄνδρα Μαρίας
  choice: l’époux de Marie
  rationale: Avec le complément « de Marie », ἀνήρ désigne ici le mari. « Époux » convient au registre soutenu et naturel du passage.
- source_word: ἐξ ἧς
  choice: de laquelle
  rationale: Le relatif féminin singulier renvoie précisément à Marie. « De laquelle » préserve cette référence grammaticale ainsi que la valeur de provenance de ἐκ.
- source_word: ἐγεννήθη
  choice: naquit
  rationale: Le passif grec marque une rupture avec la formule active répétée « engendra ». Le français idiomatique emploie l’actif intransitif « naquit », qui conserve clairement le sens de la naissance sans faire de Joseph le père biologique dans cette proposition.
- source_word: ὁ λεγόμενος
  choice: celui qu’on appelle
  rationale: Cette formulation rattache clairement le titre à Jésus et rend naturellement l’expression identificatrice grecque.
- source_word: χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre dans la formule « celui qu’on appelle… ». « Le Messie » en transmet le sens plutôt que de le traiter comme un nom propre.
theological_decisions:
- issue: Le passage de la filiation de Joseph à la naissance de Jésus
  choice: « Jacob engendra Joseph », mais « de laquelle naquit Jésus »
  alternative: « Joseph engendra Jésus » ou une formulation laissant entendre cette relation
  rationale: Le grec passe délibérément de l’actif ἐγέννησεν à ἐγεννήθη avec le relatif féminin ἐξ ἧς, qui renvoie à Marie. La traduction maintient ce changement sans lui ajouter d’explication doctrinale.
- issue: Valeur de Χριστός dans la formule d’identification
  choice: « le Messie »
  alternative: « le Christ »
  rationale: Ici, Χριστός est explicitement présenté comme ce qu’on appelle Jésus et fonctionne donc comme un titre. « Messie » en rend le contenu titulaire en français.
translation_notes:
  register: Français international moderne, concis et digne. « Engendra » conserve le rythme généalogique traditionnel tout en restant compris aujourd’hui. La tournure « de laquelle naquit Jésus » est légèrement soutenue, mais naturelle dans ce contexte et permet de préserver nettement le référent féminin.
