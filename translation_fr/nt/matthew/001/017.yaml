id: MAT.1.17
reference: Matthew 1:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πᾶσαι οὖν αἱ γενεαὶ ἀπὸ Ἀβραὰμ ἕως Δαυὶδ γενεαὶ δεκατέσσαρες, καὶ ἀπὸ Δαυὶδ ἕως τῆς μετοικεσίας Βαβυλῶνος γενεαὶ δεκατέσσαρες, καὶ ἀπὸ τῆς μετοικεσίας Βαβυλῶνος ἕως τοῦ χριστοῦ γενεαὶ δεκατέσσαρες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/017.yaml
  text: So all the generations from Abraham to David were fourteen generations[a], and from David to the exile to Babylon fourteen generations[b], and from the exile to Babylon to the Messiah fourteen generations.
translation:
  language: fr
  text: Ainsi, il y a en tout quatorze générations depuis Abraham jusqu’à David, quatorze depuis David jusqu’à la déportation à Babylone, et quatorze depuis la déportation à Babylone jusqu’au Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au Christ ». Le grec χριστός est ici un titre qui signifie « Messie ».
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσαι οὖν αἱ γενεαὶ
  choice: Ainsi, il y a en tout … générations
  rationale: « Ainsi » rend la valeur récapitulative de οὖν. « En tout » exprime Πᾶσαι sans produire la répétition peu naturelle « toutes les générations étaient quatorze générations ».
- source_word: γενεαὶ δεκατέσσαρες
  choice: quatorze générations
  rationale: γενεά désigne ici les générations successives de la généalogie. La répétition de « quatorze » dans les trois périodes conserve la structure rhétorique du grec.
- source_word: ἀπὸ … ἕως
  choice: depuis … jusqu’à
  rationale: Cette tournure française marque clairement les deux limites de chacune des trois périodes généalogiques.
- source_word: μετοικεσίας Βαβυλῶνος
  choice: la déportation à Babylone
  rationale: μετοικεσία désigne le déplacement forcé ou la déportation. « Déportation à Babylone » est précis et distingue l’événement du séjour ultérieur en exil.
- source_word: τοῦ χριστοῦ
  choice: au Messie
  rationale: Avec l’article et à l’aboutissement de la généalogie, χριστός fonctionne comme un titre. « Messie » en communique directement le sens en français.
- source_word: Ἀβραὰμ / Δαυὶδ / Βαβυλῶνος
  choice: Abraham / David / Babylone
  rationale: Les noms personnels et géographiques suivent leurs formes françaises bibliques usuelles.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le terme est ici un titre au génitif articulé et constitue le point culminant messianique de la généalogie. « Messie » en traduit le sens, tandis que « Christ » en est la forme traditionnellement translittérée.
- issue: Décompte des générations
  choice: Conserver l’affirmation récapitulative de trois groupes de quatorze
  alternative: Expliquer ou harmoniser le décompte avec les noms omis dans la généalogie
  rationale: Le verset affirme la structure littéraire de la généalogie. La traduction la conserve sans résoudre ni commenter les questions liées à son mode de calcul.
translation_notes:
  register: Français international moderne, clair et digne. La formulation parallèle met en relief les trois séries de quatorze tout en évitant une répétition maladroite. « Déportation » conserve la précision historique du déplacement forcé vers Babylone.
