id: MAT.1.23
reference: Matthew 1:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδοὺ ἡ παρθένος ἐν γαστρὶ ἕξει καὶ τέξεται υἱόν, καὶ καλέσουσιν τὸ ὄνομα αὐτοῦ Ἐμμανουήλ· ὅ ἐστιν μεθερμηνευόμενον Μεθ’ ἡμῶν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/023.yaml
  text: Behold[a], the virgin will conceive and bear a son, and they will call his name Immanuel—which is translated[d][c][b], 'God with us.'
translation:
  language: fr
  text: « Voici, la vierge[a] sera enceinte et mettra au monde un fils, et on l’appellera[b] Emmanuel[c] », ce qui se traduit par « Dieu avec nous ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On traduit parfois par « jeune femme » dans les discussions sur Ésaïe 7.14. Ici, le grec παρθένος et le récit de la naissance chez Matthieu appuient le sens « vierge ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ils appelleront » ; le sujet du verbe grec n’est pas précisé.'
    reason: lexical_alternative
  - marker: c
    text: Aussi transcrit « Immanuel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Marque naturellement l’appel à l’attention et conserve le ton solennel de la citation prophétique.
- source_word: ἡ παρθένος
  choice: la vierge
  rationale: Dans le grec de Matthieu et dans le récit immédiat de la conception de Jésus, παρθένος désigne ici une vierge. L’article défini grec est également conservé.
- source_word: ἐν γαστρὶ ἕξει
  choice: sera enceinte
  rationale: Équivalent français naturel de l’expression grecque, littéralement « aura dans le ventre », tout en gardant sa valeur future.
- source_word: τέξεται υἱόν
  choice: mettra au monde un fils
  rationale: Formulation française actuelle et digne qui exprime clairement l’accouchement indiqué par τέξεται.
- source_word: καλέσουσιν τὸ ὄνομα αὐτοῦ
  choice: on l’appellera
  rationale: Le pluriel grec a un sujet non précisé. Le pronom indéfini « on » en restitue naturellement la fonction en français sans inventer d’acteurs déterminés.
- source_word: Ἐμμανουήλ
  choice: Emmanuel
  rationale: Transcription traditionnelle et immédiatement reconnaissable en français du nom sémitique représenté par le grec.
- source_word: ὅ ἐστιν μεθερμηνευόμενον
  choice: nom qui se traduit
  rationale: Rend avec naturel le participe explicatif grec et rattache sans ambiguïté l’explication au nom Emmanuel.
- source_word: Μεθ’ ἡμῶν ὁ θεός
  choice: Dieu avec nous
  rationale: Traduction directe, claire et consacrée du sens donné au nom, sans ajout interprétatif.
theological_decisions:
- issue: Sens de παρθένος dans le contexte de la conception virginale
  choice: la vierge
  alternative: la jeune femme
  rationale: Le sens ordinaire de παρθένος et le contexte narratif de Matthieu 1 soutiennent « vierge ». L’autre formulation est signalée en note en raison du débat lexical lié au passage d’Ésaïe cité.
- issue: Portée théologique de l’explication du nom Emmanuel
  choice: Dieu avec nous
  alternative: Avec nous est Dieu, ou une paraphrase développant explicitement l’incarnation
  rationale: La traduction garde la formulation interprétative fournie par Matthieu et toute sa portée, sans développer une doctrine au-delà des mots du verset.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici » maintient le ton prophétique ; « sera enceinte » et « mettra au monde » évitent à la fois l’archaïsme et la paraphrase excessive. Les guillemets distinguent la citation prophétique et l’explication du nom.
