source:
  edition: SBLGNT
  text: Ἰεσσαὶ δὲ ἐγέννησεν τὸν Δαυὶδ τὸν βασιλέα. Δαυὶδ ⸀δὲ ἐγέννησεν τὸν Σολομῶνα ἐκ τῆς τοῦ Οὐρίου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/006.yaml
  text: Jesse fathered David the king[a]. David fathered Solomon by the wife of Uriah,
translation:
  language: fr
  text: Jessé fut le père de David, le roi. David fut le père de Salomon, qu’il eut de la femme d’Urie[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « de celle d’Urie », formule elliptique qui signifie « de la femme d’Urie ». Matthieu ne nomme pas Bethsabée ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγέννησεν
  choice: fut le père de / eut
  rationale: Dans cette généalogie, γεννάω décrit la paternité et la transmission de la lignée. « Fut le père de » est naturel en français moderne; « eut » évite une tournure lourde dans la seconde proposition tout en gardant le même sens généalogique.
- source_word: βασιλέα
  choice: le roi
  rationale: L’article grec est rendu, et le titre souligne expressément la dignité royale de David.
- source_word: ἐκ τῆς τοῦ Οὐρίου
  choice: de la femme d’Urie
  rationale: 'La formule grecque est elliptique: le nom « femme » est sous-entendu. Cette traduction française naturelle conserve l’identification indirecte de la femme par son lien avec Urie, sans introduire le nom de Bethsabée.'
- source_word: Ἰεσσαί / Δαυίδ / Σολομών / Οὐρίας
  choice: Jessé / David / Salomon / Urie
  rationale: Formes françaises usuelles des noms bibliques.
- source_word: δέ
  choice: non exprimé séparément
  rationale: Dans l’enchaînement généalogique, δέ sert de liaison légère. La succession des phrases suffit à rendre ce lien en français.
theological_decisions:
- issue: Référence indirecte à Bethsabée
  choice: Conserver « de la femme d’Urie »
  alternative: « de Bethsabée » ou « de celle qui avait été la femme d’Urie »
  rationale: Matthieu ne nomme pas la femme, mais la désigne par rapport à Urie. Garder cette formulation préserve sa portée narrative et morale sans préciser davantage que le grec.
translation_notes:
  register: Français moderne, simple et digne. « Fut le père de » évite l’archaïsme possible de « engendra », tandis que « qu’il eut de » reste idiomatique dans un contexte généalogique. L’apposition « David, le roi » maintient l’insistance du grec.
