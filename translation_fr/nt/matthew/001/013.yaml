source:
  edition: SBLGNT
  text: Ζοροβαβὲλ δὲ ἐγέννησεν τὸν Ἀβιούδ, Ἀβιοὺδ δὲ ἐγέννησεν τὸν Ἐλιακίμ, Ἐλιακὶμ δὲ ἐγέννησεν τὸν Ἀζώρ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/013.yaml
  text: Zerubbabel fathered Abiud[a], Abiud fathered Eliakim, and Eliakim fathered Azor.
translation:
  language: fr
  text: Zorobabel engendra Abioud[a], Abioud engendra Éliakim, et Éliakim engendra Azor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fut le père de » ; dans les généalogies bibliques, le verbe répété peut présenter la lignée sous une forme condensée.
    reason: Alternative lexicale et précision sur l’usage généalogique.
lexical_decisions:
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: Forme française traditionnelle et courante du nom propre biblique, employée sans le traduire.
- source_word: δέ
  choice: — / et
  rationale: Dans cette suite généalogique, δέ sert de lien léger et ne marque pas une opposition. Le français naturel permet de l’omettre dans les deux premières propositions et d’employer « et » avant la dernière.
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans une généalogie, le verbe désigne la transmission de la lignée par le père. « Engendra » conserve la formule concise et répétée du grec, dans un registre biblique digne mais encore compréhensible.
- source_word: Ἀβιούδ
  choice: Abioud
  rationale: Transcription française usuelle de ce nom propre grec.
- source_word: Ἐλιακίμ
  choice: Éliakim
  rationale: Forme française biblique courante, avec l’accent initial requis par l’orthographe française.
- source_word: Ἀζώρ
  choice: Azor
  rationale: Transcription française simple et usuelle du nom propre grec.
theological_decisions:
- issue: Portée de γεννάω dans une généalogie susceptible de condenser certaines générations
  choice: engendra
  alternative: devint le père de / fut l’ancêtre de
  rationale: « Engendra » maintient la formulation généalogique directe du grec sans remplacer celle-ci par l’interprétation plus générale « fut l’ancêtre de ». La note signale que la formule biblique peut présenter une lignée sous une forme condensée, sans trancher si chaque lien est immédiat.
translation_notes:
  register: Français international moderne, concis et digne. La répétition de « engendra » reproduit volontairement la structure généalogique du grec ; les noms suivent les formes françaises bibliques usuelles.
