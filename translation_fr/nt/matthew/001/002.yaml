source:
  edition: SBLGNT
  text: Ἀβραὰμ ἐγέννησεν τὸν Ἰσαάκ, Ἰσαὰκ δὲ ἐγέννησεν τὸν Ἰακώβ, Ἰακὼβ δὲ ἐγέννησεν τὸν Ἰούδαν καὶ τοὺς ἀδελφοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/002.yaml
  text: Abraham fathered Isaac[a], and Isaac fathered Jacob, and Jacob fathered Judah and his brothers,
translation:
  language: fr
  text: Abraham engendra Isaac[a] ; Isaac engendra Jacob ; Jacob engendra Juda et ses frères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut le père d’Isaac ». Dans une généalogie, le verbe grec désigne l’engendrement du côté paternel.'
    reason: alternative lexicale et précision de la valeur généalogique du verbe
lexical_decisions:
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans cette généalogie, γεννάω désigne l’engendrement ou la filiation du côté paternel. « Engendra » est la formulation française traditionnelle, concise et précise ; elle n’impose pas que chaque lien généalogique soit nécessairement immédiat.
- source_word: δὲ
  choice: ponctuation par point-virgule, sans équivalent lexical explicite
  rationale: Ici, δέ est un connecteur faible qui fait progresser l’énumération sans marquer de contraste. En français, la juxtaposition par des points-virgules rend naturellement cette progression.
- source_word: Ἰούδαν
  choice: Juda
  rationale: Il s’agit du patriarche Juda, fils de Jacob. « Juda » est la forme française biblique usuelle de ce nom.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: ses frères
  rationale: Le nom grec est masculin et désigne ici les autres fils de Jacob ; « ses frères » est donc précis dans ce contexte.
- source_word: Ἀβραὰμ / Ἰσαάκ / Ἰακώβ
  choice: Abraham / Isaac / Jacob
  rationale: Ces formes correspondent aux conventions françaises courantes pour les noms des patriarches.
theological_decisions:
- issue: Rendu du verbe généalogique
  choice: Employer « engendra »
  alternative: « fut le père de » ou « eut pour fils »
  rationale: « Engendra » conserve la force généalogique et paternelle du grec sans préciser indûment si la filiation est immédiate ou si une généalogie peut être condensée. Une note offre une formulation française plus courante.
translation_notes:
  register: Français moderne, digne et lisible. « Engendra » est légèrement soutenu mais reste courant dans le registre généalogique biblique. Les points-virgules évitent une répétition lourde de « et » tout en reflétant les connecteurs faibles du grec.
