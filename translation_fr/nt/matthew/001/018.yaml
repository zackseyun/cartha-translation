  to: 'Voici comment eut lieu la naissance de Jésus, le Messie[a] : Marie, sa mère, était promise en mariage à Joseph[b]. Avant qu’ils ne s’unissent[c], on constata qu’elle était enceinte par l’Esprit Saint.'
  rationale: La révision corrige la subordonnée introduite par « avant que », rend plus nettement le passif εὑρέθη dans un français actuel, et normalise le nom divin « Esprit Saint ». Elle conserve l’ambiguïté mesurée de συνελθεῖν, le registre narratif, ainsi que toutes les notes et leurs ancres.
