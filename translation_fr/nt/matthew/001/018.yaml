id: MAT.1.18
reference: Matthew 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦ δὲ ⸀Ἰησοῦ χριστοῦ ἡ ⸀γένεσις οὕτως ἦν. ⸀μνηστευθείσης τῆς μητρὸς αὐτοῦ Μαρίας τῷ Ἰωσήφ, πρὶν ἢ συνελθεῖν αὐτοὺς εὑρέθη ἐν γαστρὶ ἔχουσα ἐκ πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/018.yaml
  text: 'The birth of Jesus the Messiah happened in this way: when his mother Mary had been betrothed to Joseph[a], before they came together[c][b], she was found to be pregnant from the Holy Spirit.'
translation:
  language: fr
  text: 'Voici comment eut lieu la naissance de Jésus, le Messie[a] : Marie, sa mère, était promise en mariage à Joseph[b]. Avant qu’ils ne s’unissent[c], on constata qu’elle était enceinte par l’Esprit Saint.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus Christ ». Le titre grec Χριστός signifie « Messie ».
    reason: alternative_reading
  - marker: b
    text: Être « promise en mariage » désignait un engagement officiel et juridiquement reconnu, plus contraignant que les fiançailles modernes.
    reason: cultural_note
  - marker: c
    text: L’expression peut évoquer le début de la vie conjugale et, dans ce contexte, la consommation du mariage.
    reason: lexical_alternative
lexical_decisions:
- source_word: γένεσις
  choice: naissance
  rationale: Dans ce contexte, le terme introduit le récit de la venue au monde de Jésus. « Naissance » est naturel en français et correspond directement à la suite du récit, tout en laissant « origine » comme nuance lexicale possible.
- source_word: Ἰησοῦ χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός fonctionne ici comme un titre. « Le Messie » en transmet le sens, tandis que « Jésus Christ » reste une traduction traditionnelle possible.
- source_word: οὕτως ἦν
  choice: Voici comment eut lieu
  rationale: Cette tournure française actuelle et digne introduit clairement la manière dont l’événement s’est produit, sans ajouter un marqueur temporel absent du grec.
- source_word: μνηστευθείσης
  choice: était promise en mariage
  rationale: Cette formulation est plus immédiatement compréhensible que « fiancée » et indique un engagement matrimonial formel, dont la portée juridique et culturelle est précisée en note.
- source_word: πρὶν ἢ συνελθεῖν αὐτούς
  choice: Avant qu’ils se soient unis
  rationale: 'La formulation conserve l’expression discrète et relativement ouverte du grec : elle peut évoquer leur union conjugale et, dans le contexte, sa consommation, sans explicitation excessive.'
- source_word: εὑρέθη
  choice: elle se trouva
  rationale: La tournure conserve l’idée qu’il fut constaté qu’elle était enceinte, tout en restant idiomatique et sans introduire d’agent absent du grec.
- source_word: ἐν γαστρὶ ἔχουσα
  choice: enceinte
  rationale: « Enceinte » est l’équivalent français moderne et direct de cette expression idiomatique.
- source_word: ἐκ πνεύματος ἁγίου
  choice: par l’Esprit saint
  rationale: En français, « par » exprime naturellement ici l’origine ou l’action causale indiquée par ἐκ, sans la formulation ambiguë « enceinte de l’Esprit saint ». La majuscule identifie le référent divin dans ce contexte.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Le mot fonctionne comme un titre dans cette introduction narrative. Le traduire par « le Messie » en rend le sens au lecteur, sans nier que « Christ » soit la forme traditionnelle du même titre.
- issue: Référence de πνεύματος ἁγίου
  choice: l’Esprit saint
  alternative: un esprit saint / esprit saint
  rationale: Dans le récit matthéen de la naissance, l’expression désigne l’Esprit divin. L’absence d’article en grec n’impose pas une lecture indéfinie.
- issue: Portée de συνελθεῖν
  choice: se soient unis
  alternative: aient vécu ensemble / aient eu des relations sexuelles
  rationale: Le grec emploie une expression discrète susceptible d’évoquer l’union conjugale, y compris sa consommation. La traduction ne tranche pas plus explicitement que le texte source.
translation_notes:
  register: Français international moderne, clair et digne. « Voici comment eut lieu » assure une introduction narrative naturelle sans ajouter un « maintenant » absent du grec. Les formulations « promise en mariage » et « se soient unis » privilégient l’intelligibilité tout en conservant la retenue et l’ambiguïté relative du texte source.
