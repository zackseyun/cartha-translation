  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν ⸀ὑπὸ κυρίου διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/022.yaml
  text: All this happened so that what was spoken by the Lord through the prophet might be fulfilled[a], saying,
translation:
  language: fr
  text: 'Tout cela[a] est arrivé afin que s’accomplisse ce que le Seigneur avait dit par l’intermédiaire du prophète :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Or, tout cet événement est arrivé afin que s’accomplisse ce qui avait été dit par le Seigneur par l’intermédiaire du prophète. » L’expression grecque τοῦτο δὲ ὅλον souligne l’ensemble des événements qui viennent d’être racontés.'
    reason: Variante lexicale et discursive signalant l’accent mis sur la totalité.
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Tout cela
  rationale: Le démonstratif neutre singulier renvoie à l’ensemble des événements qui viennent d’être racontés, tandis que ὅλον en souligne la totalité. « Tout cela » est naturel en français. δέ marque ici une transition narrative légère qui n’exige pas de mot distinct.
- source_word: γέγονεν
  choice: est arrivé
  rationale: Le parfait de γίνομαι présente les événements comme advenus; « est arrivé » convient au récit moderne sans archaïsme.
- source_word: ἵνα πληρωθῇ
  choice: afin que s’accomplisse
  rationale: Cette formulation conserve la visée ou le résultat exprimé par ἵνα avec le subjonctif, ainsi que le passif de la formule d’accomplissement, sans trancher entre finalité et conséquence.
- source_word: τὸ ῥηθὲν
  choice: ce que ... avait dit
  rationale: Le participe passif substantivé désigne la parole prononcée. En français, l’actif avec le Seigneur pour sujet évite une tournure lourde tout en maintenant clairement l’agence indiquée dans le grec.
- source_word: ὑπὸ κυρίου
  choice: le Seigneur avait dit
  rationale: ὑπό avec le génitif désigne le Seigneur comme auteur ultime de la parole. « Seigneur » traduit κύριος sans ajouter « Dieu », absent du texte grec.
- source_word: διὰ τοῦ προφήτου
  choice: par l’intermédiaire du prophète
  rationale: διά avec le génitif exprime la médiation. Cette formulation distingue nettement le Seigneur, auteur de la parole, du prophète qui la transmet.
- source_word: λέγοντος
  choice: ':'
  rationale: Le participe introduit la citation du verset suivant. En français courant, les deux-points remplissent naturellement cette fonction et évitent le calque pesant « en disant ».
theological_decisions:
- issue: Agence dans la parole prophétique
  choice: « ce que le Seigneur avait dit par l’intermédiaire du prophète »
  alternative: « ce qui avait été dit par le Seigneur par le prophète »
  rationale: La formulation française préserve la distinction grecque entre le Seigneur comme auteur ultime (ὑπό) et le prophète comme intermédiaire (διά), sans développer une doctrine de l’inspiration au-delà du texte.
- issue: Formule d’accomplissement
  choice: « afin que s’accomplisse »
  alternative: « de sorte que s’accomplisse »
  rationale: ἵνα avec le subjonctif peut porter une nuance de finalité ou de résultat. « Afin que » maintient la dimension téléologique de la formule matthéenne, sans expliquer davantage la relation entre dessein divin et résultat narratif.
translation_notes:
  register: Français international moderne, digne et accessible. « Par l’intermédiaire de » explicite naturellement la différence d’agence présente dans le grec. Les deux-points introduisent idiomatiquement la citation qui suit.
