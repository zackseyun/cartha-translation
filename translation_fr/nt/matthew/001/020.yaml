id: MAT.1.20
reference: Matthew 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ ἐνθυμηθέντος ἰδοὺ ἄγγελος κυρίου κατ’ ὄναρ ἐφάνη αὐτῷ λέγων· Ἰωσὴφ υἱὸς Δαυίδ, μὴ φοβηθῇς παραλαβεῖν ⸀Μαρίαν τὴν γυναῖκά σου, τὸ γὰρ ἐν αὐτῇ γεννηθὲν ἐκ πνεύματός ἐστιν ἁγίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/020.yaml
  text: But as he was considering these things, behold, an angel of the Lord appeared to him in a dream, saying, “Joseph, son of David, do not be afraid to take Mary as your wife, for what has been conceived in her is from the Holy Spirit.”
translation:
  language: fr
  text: 'Mais tandis qu’il réfléchissait à cela, voici qu’un ange du Seigneur lui apparut en rêve et lui dit : « Joseph, fils de David, n’aie pas peur de prendre chez toi Marie, ta femme[a], car ce qui a été conçu en elle vient de l’Esprit Saint. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « accueillir Marie, ta femme ». L’expression grecque évoque le fait de la prendre avec lui dans le foyer conjugal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνθυμηθέντος
  choice: tandis qu’il réfléchissait à cela
  rationale: Le génitif absolu présente la réflexion intérieure de Joseph en cours, sans en faire une décision déjà arrêtée.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Ce marqueur discursif introduit vivement l’intervention inattendue de l’ange et reste naturel dans un récit français de registre digne.
- source_word: ἄγγελος κυρίου
  choice: un ange du Seigneur
  rationale: L’absence d’article devant ἄγγελος favorise l’indéfini « un ange », sans imposer l’identification particulière que pourrait suggérer « l’ange du Seigneur ».
- source_word: κατ’ ὄναρ ἐφάνη αὐτῷ
  choice: lui apparut en rêve
  rationale: Formulation française idiomatique qui conserve l’idée d’une apparition reçue dans un rêve.
- source_word: υἱὸς Δαυίδ
  choice: fils de David
  rationale: La traduction directe préserve l’indication de l’ascendance davidique et ses résonances narratives.
- source_word: μὴ φοβηθῇς
  choice: n’aie pas peur
  rationale: Expression actuelle et naturelle qui rend fidèlement l’interdiction et la dimension émotionnelle du verbe.
- source_word: παραλαβεῖν Μαρίαν τὴν γυναῖκά σου
  choice: prendre chez toi Marie, ta femme
  rationale: « Prendre chez toi » exprime ici l’accueil de Marie dans le foyer conjugal, tandis que l’apposition « ta femme » préserve son statut déjà énoncé par le grec sans suggérer qu’elle le devient seulement à ce moment-là.
- source_word: τὸ ἐν αὐτῇ γεννηθὲν
  choice: l’enfant qui a été conçu en elle
  rationale: Le grec emploie un participe substantivé neutre, littéralement « ce qui a été engendré en elle ». Dans ce contexte prénatal, « l’enfant qui a été conçu » en communique clairement le référent sans donner au français une tournure impersonnelle ou maladroite.
- source_word: ἐκ πνεύματός ἐστιν ἁγίου
  choice: vient de l’Esprit Saint
  rationale: La préposition ἐκ indique la source ou l’origine. « Vient de » la rend clairement et naturellement en français.
theological_decisions:
- issue: Identification de κυρίου dans ἄγγελος κυρίου
  choice: du Seigneur
  alternative: de YHWH / l’ange du Seigneur
  rationale: « Seigneur » rend κύριος sans forcer une identification théophanique précise. L’indéfini porte sur « un ange », conformément à la syntaxe grecque.
- issue: Référence de πνεύματός ... ἁγίου
  choice: l’Esprit Saint
  alternative: un esprit saint / la puissance de l’Esprit Saint
  rationale: Dans le récit matthéen, l’expression désigne l’Esprit divin comme source de la conception; elle ne parle ni d’un esprit indéfini ni explicitement d’une puissance impersonnelle.
- issue: Statut marital de Marie dans τὴν γυναῖκά σου
  choice: Marie, ta femme
  alternative: Marie comme femme / pour épouse
  rationale: L’apposition grecque appelle « ta femme » et ne présente pas explicitement l’action comme un changement de statut. La traduction conserve ainsi la tension propre au cadre des fiançailles matrimoniales du récit.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici que » garde la vivacité narrative de ἰδοὺ sans archaïsme excessif. « Prendre chez toi » rend concrètement le contexte matrimonial tout en évitant l’ambiguïté moderne de « prendre Marie ».
