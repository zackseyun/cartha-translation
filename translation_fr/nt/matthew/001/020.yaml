  rationale: La seule révision consiste à remplacer « l’enfant qui a été conçu » par « ce qui a été conçu », afin de conserver le participe substantivé neutre du grec sans ajouter de référent nominal. Le reste du texte et la note rendent fidèlement et naturellement le sens du passage.
