  text: Ἀζὼρ δὲ ἐγέννησεν τὸν Σαδώκ, Σαδὼκ δὲ ἐγέννησεν τὸν Ἀχίμ, Ἀχὶμ δὲ ἐγέννησεν τὸν Ἐλιούδ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/014.yaml
  text: Azor fathered Zadok, Zadok fathered Achim, and Achim fathered Eliud.
translation:
  language: fr
  text: Azor engendra Sadok, Sadok engendra Akim, et Akim engendra Élioud.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀζώρ
  choice: Azor
  rationale: Nom propre transcrit selon la forme française traditionnelle et courante.
- source_word: δέ
  choice: et / non exprimé séparément
  rationale: Dans cette généalogie, δέ assure une simple liaison entre les propositions. Le dernier est rendu par « et »; les précédents restent implicites dans l’enchaînement naturel des propositions françaises.
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans un cadre généalogique, le verbe désigne l’engendrement ou la filiation par la lignée masculine. « Engendra » est concis, digne et bien établi dans ce type de texte.
- source_word: τὸν
  choice: non traduit séparément
  rationale: L’article grec marque ici le complément d’objet direct devant un nom propre; le français n’emploie normalement pas d’article dans cette construction.
- source_word: Σαδώκ
  choice: Sadok
  rationale: Forme française traditionnelle du nom propre grec.
- source_word: Ἀχίμ
  choice: Akim
  rationale: Transcription française claire du nom grec, avec « k » pour rendre le χ dans ce nom propre.
- source_word: Ἐλιούδ
  choice: Élioud
  rationale: Transcription française naturelle du nom grec, avec accent initial pour guider la prononciation.
