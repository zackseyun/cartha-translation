id: MAT.1.1
reference: Matthew 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Βίβλος γενέσεως Ἰησοῦ χριστοῦ υἱοῦ Δαυὶδ υἱοῦ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/001.yaml
  text: The book of the genealogy of Jesus the Messiah[a], the son of David[b], the son of Abraham.
translation:
  language: fr
  text: Livre[a] de la généalogie de Jésus le Messie[b], fils de David, fils d’Abraham.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Livre de l’origine » ou « Livre de la naissance ». Le mot grec peut avoir le sens plus large de « genèse » ou d’« origine », bien que « généalogie » corresponde le mieux à la lignée qui suit.'
    reason: alternative_reading
  - marker: b
    text: 'Traditionnellement : « Jésus-Christ ». « Le Messie » traduit ici le titre grec Χριστός.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βίβλος
  choice: Livre
  rationale: Dans cet intitulé sans article, « Livre » garde la forme concise et solennelle d’un titre et désigne un écrit ou un registre.
- source_word: γενέσεως
  choice: de la généalogie
  rationale: Le sens de « généalogie » convient le mieux à la liste d’ancêtres qui suit, sans exclure les résonances plus larges d’origine et de naissance signalées en note.
- source_word: Ἰησοῦ
  choice: de Jésus
  rationale: Le nom propre est rendu selon l’usage français établi; le génitif grec dépend de « généalogie ».
- source_word: χριστοῦ
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre; « le Messie » en exprime naturellement la portée d’oint royal en français.
- source_word: υἱοῦ Δαυὶδ
  choice: fils de David
  rationale: La formulation littérale conserve l’expression généalogique et le titre messianique, tout en pouvant désigner un descendant.
- source_word: υἱοῦ Ἀβραάμ
  choice: fils d’Abraham
  rationale: La formulation littérale préserve l’idiome généalogique et le lien avec Abraham; dans ce contexte, « fils » inclut l’idée de descendance.
theological_decisions:
- issue: Rendu de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Le terme présente ici l’identité messianique de Jésus comme un titre. « Christ » est traditionnel, mais peut être compris comme un nom propre; « le Messie » rend plus clairement la fonction du grec.
- issue: Sens de γενέσεως dans l’intitulé
  choice: généalogie
  alternative: origine ou naissance
  rationale: La généalogie qui suit favorise ce sens, mais le champ sémantique du grec et son éventuelle évocation d’une genèse restent explicitement ouverts dans la note.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure nominale concise reproduit la fonction d’intitulé du grec. Les répétitions « fils de » sont conservées pour leur force généalogique, royale et scripturaire.
