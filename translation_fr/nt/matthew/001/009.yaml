  variant: modern international French
source:
  edition: SBLGNT
  text: Ὀζίας δὲ ἐγέννησεν τὸν Ἰωαθάμ, Ἰωαθὰμ δὲ ἐγέννησεν τὸν Ἀχάζ, Ἀχὰζ δὲ ἐγέννησεν τὸν Ἑζεκίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/009.yaml
  text: Uzziah fathered Jotham[a], and Jotham fathered Ahaz, and Ahaz fathered Hezekiah,
translation:
  language: fr
  text: Ozias engendra Yotam[a], Yotam engendra Acaz, et Acaz engendra Ézéchias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ἐγέννησεν est traditionnellement traduit par « engendra »; dans cette généalogie, il exprime la filiation paternelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀζίας
  choice: Ozias
  rationale: Forme française biblique traditionnelle du nom royal correspondant à Ozias, plutôt qu’une translittération strictement grecque.
- source_word: δὲ
  choice: et
  rationale: Dans cette généalogie, δέ est un connecteur léger qui fait progresser l’énumération; « et » rend naturellement l’enchaînement, avec une omission possible là où le français préfère la juxtaposition.
- source_word: ἐγέννησεν
  choice: engendra
  rationale: « Engendra » exprime précisément la filiation paternelle et conserve la formule répétitive et solennelle de la généalogie; le terme reste intelligible en français moderne dans ce contexte.
- source_word: Ἰωαθάμ
  choice: Yotam
  rationale: Forme moderne courante dans les traductions françaises récentes, correspondant au nom du roi de Juda dans l’Ancien Testament.
- source_word: Ἀχάζ
  choice: Acaz
  rationale: Forme biblique française usuelle du nom du roi de Juda.
- source_word: Ἑζεκίαν
  choice: Ézéchias
  rationale: Forme biblique française usuelle du nom du roi de Juda, avec l’accentuation orthographique française.
theological_decisions:
- issue: Portée généalogique de γεννάω
  choice: « engendra », présentant une succession généalogique paternelle directe
  alternative: « fut le père de » ou « fut l’ancêtre de »
  rationale: La formule stylisée de Matthieu présente ici les relations comme des filiations paternelles. « Engendra » en préserve la force lexicale et le rythme sans élargir explicitement le sens à « fut l’ancêtre de », même si les généalogies bibliques peuvent parfois omettre des générations.
translation_notes:
  register: Français international moderne, digne et concis. La répétition d’« engendra » reproduit le rythme généalogique du grec. Les noms suivent l’usage biblique français courant.
