source:
  edition: SBLGNT
  text: τέξεται δὲ υἱὸν καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν, αὐτὸς γὰρ σώσει τὸν λαὸν αὐτοῦ ἀπὸ τῶν ἁμαρτιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/021.yaml
  text: She will bear a son[a], and you shall call his name Jesus, for he will save his people from their sins.
translation:
  language: fr
  text: Elle mettra au monde un fils, et tu lui donneras le nom de Jésus[a], car c’est lui qui sauvera son peuple de ses péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Jésus » est la forme française du grec Iêsous, qui correspond au nom hébreu ou araméen Yeshoua, apparenté à « Josué » et associé à l’idée « le SEIGNEUR sauve ». L’explication « car c’est lui qui sauvera » fait écho au sens de ce nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέξεται
  choice: mettra au monde
  rationale: Le futur de τίκτω désigne ici l’accouchement. « Mettra au monde » est une expression française naturelle qui conserve la valeur prédictive.
- source_word: δὲ
  choice: —
  rationale: δέ est un connecteur léger. Le français n’a pas besoin de le rendre séparément ici, puisque « et » relie déjà naturellement les deux propositions.
- source_word: υἱὸν
  choice: un fils
  rationale: Dans cette annonce de naissance, le nom sans article se rend idiomatiquement par « un fils ».
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: tu lui donneras le nom de
  rationale: Cette formulation française naturelle exprime fidèlement la formule de nomination grecque sans reproduire servilement le sémitisme « appeler son nom ».
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: « Jésus » est la forme française traditionnelle du nom grec Ἰησοῦς; la note signale son arrière-plan hébreu ou araméen et le jeu de mots explicatif.
- source_word: αὐτὸς
  choice: c’est lui qui
  rationale: La tournure met naturellement en relief le sujet en français et rend l’insistance portée par le pronom grec.
- source_word: γὰρ
  choice: car
  rationale: γάρ introduit l’explication du nom donné à l’enfant; « car » convient au registre narratif et explicatif.
- source_word: σώσει
  choice: sauvera
  rationale: Dans la construction « son peuple » et « de ses péchés », « sauvera » rend directement le sens de σῴζω et maintient la portée théologique du passage.
- source_word: τὸν λαὸν αὐτοῦ
  choice: son peuple
  rationale: La traduction conserve la relation possessive et les possibles résonances d’alliance sans préciser dans le verset une étendue que le grec ne définit pas explicitement.
- source_word: ἀπὸ τῶν ἁμαρτιῶν αὐτῶν
  choice: de ses péchés
  rationale: ἀπό exprime ici la délivrance ou la séparation. Le pluriel « péchés » est conservé, et « ses » reprend collectivement « son peuple » selon l’usage français.
theological_decisions:
- issue: Mise en relief de αὐτός dans l’action salvatrice de Jésus
  choice: « c’est lui qui sauvera »
  alternative: « il sauvera »
  rationale: Le grec met le sujet en relief. La tournure française retenue préserve cette insistance christologique sans préciser davantage la manière dont le salut s’accomplit.
- issue: Étendue de l’expression « son peuple »
  choice: Conserver simplement « son peuple »
  alternative: « son peuple Israël » ou « tous ceux qui lui appartiennent »
  rationale: Le contexte immédiat possède des résonances juives et liées à l’alliance, mais le verset ne définit pas lui-même plus précisément l’étendue du groupe. La traduction préserve cette ouverture interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. « Mettra au monde » et « tu lui donneras le nom de » évitent des calques peu idiomatiques, tandis que « c’est lui qui » conserve l’accent du grec. Le marqueur de note est placé après « Jésus », auquel la note se rapporte directement.
