id: MAT.1.12
reference: Matthew 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ δὲ τὴν μετοικεσίαν Βαβυλῶνος Ἰεχονίας ἐγέννησεν τὸν Σαλαθιήλ, Σαλαθιὴλ δὲ ἐγέννησεν τὸν Ζοροβαβέλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/012.yaml
  text: After the deportation to Babylon[a], Jeconiah fathered Shealtiel, and Shealtiel fathered Zerubbabel.
translation:
  language: fr
  text: Après la déportation à Babylone[a], Jéchonias engendra Salathiel, et Salathiel engendra Zorobabel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’exil à Babylone ». Le terme grec peut désigner le déplacement ou l’exil résultant de cette déportation.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ
  choice: Après
  rationale: μετά avec l’accusatif indique ici la succession temporelle. Le faible lien exprimé par δέ est naturellement absorbé en français.
- source_word: τὴν μετοικεσίαν Βαβυλῶνος
  choice: la déportation à Babylone
  rationale: μετοικεσία désigne le déplacement imposé de la population vers l’exil. « Déportation » rend clairement cette contrainte, tandis que « à Babylone » exprime la destination dans ce contexte.
- source_word: Ἰεχονίας
  choice: Jéconias
  rationale: Forme française biblique connue, correspondant au nom grec Ἰεχονίας.
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans une généalogie, γεννάω exprime la filiation ou la succession ancestrale du côté paternel. « Engendra » conserve la formule concise et solennelle sans exiger que chaque succession soit comprise comme immédiatement biologique.
- source_word: Σαλαθιήλ
  choice: Shéaltiel
  rationale: Forme française qui reflète le nom sémitique sous-jacent et reste reconnaissable dans l’usage biblique moderne.
- source_word: δὲ
  choice: et
  rationale: Dans la seconde proposition, δέ relie simplement deux maillons successifs de la généalogie ; « et » est le lien français le plus naturel.
- source_word: Ζοροβαβέλ
  choice: Zorobabel
  rationale: Forme française biblique traditionnelle et largement reconnaissable du nom Ζοροβαβέλ.
theological_decisions:
- issue: Portée de γεννάω dans une généalogie
  choice: Employer « engendra » comme formule de succession généalogique, sans affirmer une filiation biologique immédiate dans chaque cas.
  alternative: « fut le père de »
  rationale: Les généalogies anciennes peuvent présenter une lignée ancestrale de manière condensée. « Engendra » préserve la formulation masculine de la généalogie et sa tension propre, sans ajouter de précision absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe répétitive de la généalogie est conservée. Les noms suivent des formes françaises bibliques reconnaissables, avec « Shéaltiel » pour refléter plus directement le nom sémitique.
