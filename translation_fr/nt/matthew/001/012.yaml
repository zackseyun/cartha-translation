review_pass:
  verdict: revise
  source_fidelity: La structure temporelle (« Après »), le sens généalogique répété de ἐγέννησεν (« engendra ») et la destination de la déportation sont fidèlement rendus. La note conserve à juste titre l’alternative « exil ».
  naturalness: La phrase est fluide et garde la cadence sobre d’une généalogie. « Engendra » appartient à un registre biblique digne qui reste intelligible en français moderne.
  terminology: Les formes françaises bibliques usuelles « Jéchonias » et « Salathiel » sont préférables à « Jéconias » et surtout à « Shéaltiel ». « Shéaltiel » n’est pas la forme française biblique courante et ne correspond pas non plus directement à la graphie grecque Σαλαθιήλ. La note est reformulée pour ne pas attribuer au seul terme grec, de façon trop catégorique, l’idée de contrainte.
  issues:
  - severity: medium
    issue: Forme du nom « Shéaltiel »
    rationale: La forme française biblique reconnue pour Σαλαθιήλ dans ce passage est « Salathiel ». Son remplacement assure la cohérence avec l’usage français et avec les autres noms de la généalogie.
  - severity: low
    issue: Forme de « Jéconias »
    rationale: « Jéchonias » est la forme française biblique habituelle dans Matthieu 1 et favorise la reconnaissance du personnage.
  - severity: low
    issue: Explication lexicale de la note
    rationale: Dire que le terme grec désigne en lui-même un « déplacement forcé » est plus affirmatif que nécessaire. La déportation est bien le contexte, tandis que le nom peut aussi désigner l’exil ou le déplacement qui en résulte.
  revised_text: Après la déportation à Babylone[a], Jéchonias engendra Salathiel, et Salathiel engendra Zorobabel.
  revised_footnotes:
  - marker: a
    text: Ou « l’exil à Babylone ». Le terme grec peut désigner le déplacement ou l’exil résultant de cette déportation.
    reason: lexical_alternative
