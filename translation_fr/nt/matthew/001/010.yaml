id: MAT.1.10
reference: Matthew 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἑζεκίας δὲ ἐγέννησεν τὸν Μανασσῆ, Μανασσῆς δὲ ἐγέννησεν τὸν ⸂Ἀμώς, Ἀμὼς⸃ δὲ ἐγέννησεν τὸν Ἰωσίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/010.yaml
  text: Hezekiah fathered Manasseh[a], Manasseh fathered Amos, and Amos fathered Josiah.
translation:
  language: fr
  text: Ézéchias engendra Manassé, Manassé engendra Amos[a], et Amos engendra Josias.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traductions ont ici « Amon », conformément au nom du roi de Juda en 2 Rois 21 ; le texte grec de Matthieu porte « Amos ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγέννησεν
  choice: engendra
  rationale: Dans cette généalogie, le verbe désigne le fait d’avoir pour descendant dans la lignée paternelle. « Engendra » est concis, digne et usuel dans le registre généalogique biblique français.
- source_word: Ἑζεκίας
  choice: Ézéchias
  rationale: Forme française biblique conventionnelle du nom du roi de Juda.
- source_word: Μανασσῆς
  choice: Manassé
  rationale: Forme française biblique conventionnelle de ce nom propre.
- source_word: Ἀμώς
  choice: Amos
  rationale: Le texte grec du SBLGNT porte Ἀμώς, rendu directement par « Amos », sans harmonisation silencieuse avec le nom royal « Amon » dans les livres des Rois.
- source_word: Ἰωσίας
  choice: Josias
  rationale: Forme française biblique conventionnelle de ce nom propre.
- source_word: δέ
  choice: et / ponctuation
  rationale: Dans l’enchaînement généalogique, δέ fait progresser la liste. La ponctuation rend les premières occurrences, et « et » la dernière, pour un français naturel.
theological_decisions:
- issue: Différence entre le nom grec donné par Matthieu et le nom du roi dans l’Ancien Testament
  choice: Conserver « Amos » dans le texte principal
  alternative: Employer « Amon » pour harmoniser avec le roi de Juda mentionné en 2 Rois 21
  rationale: La traduction suit prioritairement le texte grec transmis, qui porte Ἀμώς. La difficulté historique et textuelle est signalée en note plutôt que résolue par une harmonisation.
translation_notes:
  register: Français international moderne, clair et digne. Le verbe « engendra » conserve la forme concise et répétitive propre à une généalogie. Le marqueur de note est placé après « Amos », le nom directement concerné.
