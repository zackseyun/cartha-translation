id: MAT.1.19
reference: Matthew 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰωσὴφ δὲ ὁ ἀνὴρ αὐτῆς, δίκαιος ὢν καὶ μὴ θέλων αὐτὴν ⸀δειγματίσαι, ἐβουλήθη λάθρᾳ ἀπολῦσαι αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/019.yaml
  text: And Joseph[a], her husband, being a righteous man and not wanting to expose her to public disgrace[c][b], intended to divorce her quietly.
translation:
  language: fr
  text: Joseph, son mari[a], était un homme juste et ne voulait pas l’exposer à la honte publique[b] ; il décida de divorcer d’elle discrètement[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son fiancé ». Le grec emploie un terme pouvant signifier « homme » ou « mari », ce qui reflète la force juridique des fiançailles juives.
    reason: lexical_alternative
  - marker: b
    text: Ou « faire d’elle un exemple » ou « la déshonorer publiquement ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « la renvoyer en secret ». Dans ce contexte, il s’agit de mettre officiellement fin au lien juridiquement contraignant des fiançailles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: son mari
  rationale: Dans ce contexte, ἀνήρ désigne Joseph comme l’époux légal de Marie. Les fiançailles juives avaient une force juridique, comme le confirme l’emploi d’ἀπολῦσαι pour leur dissolution.
- source_word: δίκαιος
  choice: un homme juste
  rationale: « Juste » exprime naturellement en français la droiture morale et religieuse de Joseph sans préciser si l’accent porte sur l’observance de la Loi, la compassion ou les deux.
- source_word: δειγματίσαι
  choice: l’exposer à la honte publique
  rationale: Le verbe évoque le fait d’exposer quelqu’un publiquement, avec l’idée de honte. Cette formulation explicite cette portée sans déterminer la procédure exacte envisagée.
- source_word: ἐβουλήθη
  choice: il décida
  rationale: Le verbe désigne une intention réfléchie ou une résolution. « Il décida » est clair, actuel et convient à la progression narrative.
- source_word: λάθρᾳ
  choice: discrètement
  rationale: L’adverbe indique une action accomplie sans publicité. « Discrètement » est naturel en français et fait écho au refus d’exposer Marie à la honte publique.
- source_word: ἀπολῦσαι
  choice: divorcer d’elle
  rationale: Dans le cadre de fiançailles juridiquement contraignantes, le verbe désigne la dissolution formelle du lien. « Divorcer » en communique mieux la portée juridique que le littéral « la renvoyer ».
- source_word: δὲ
  choice: progression rendue par l’enchaînement des phrases
  rationale: La particule est un connecteur narratif faible. En français, aucune conjonction initiale n’est nécessaire ici pour en rendre naturellement la fonction.
- source_word: ὢν καὶ μὴ θέλων
  choice: était… Comme il ne voulait pas
  rationale: La construction participiale fournit l’arrière-plan de la décision de Joseph. Deux phrases reliées par « Comme » rendent clairement cette relation sans imposer une interprétation théologique supplémentaire.
theological_decisions:
- issue: Caractérisation de Joseph comme δίκαιος
  choice: « un homme juste », sans préciser en quoi consiste ici sa justice
  alternative: « un homme droit », ou une paraphrase faisant explicitement de sa compassion la définition de sa justice
  rationale: Le grec associe la justice de Joseph à son refus d’exposer Marie, mais ne tranche pas explicitement entre observance de la Loi, droiture morale et compassion. La traduction conserve cette tension.
- issue: Statut juridique de Joseph et de Marie
  choice: « son mari » et « divorcer d’elle »
  alternative: « son fiancé » et « rompre leurs fiançailles », ou le plus littéral « son homme » et « la renvoyer »
  rationale: Le vocabulaire grec et le contexte des fiançailles juives indiquent un lien légal nécessitant une dissolution formelle. Les termes choisis le communiquent aux lecteurs modernes, tandis que les notes préservent les formulations possibles.
- issue: Nature de l’exposition envisagée
  choice: « l’exposer à la honte publique »
  alternative: « faire d’elle un exemple » ou « la déshonorer publiquement »
  rationale: Le verbe δειγματίζω implique une exposition publique honteuse, mais le texte ne décrit pas précisément la procédure ou la sanction. La traduction n’en ajoute aucune.
translation_notes:
  register: Français international moderne, digne et accessible. La division en deux phrases évite une construction participiale lourde. « Homme juste », « honte publique » et « discrètement » restent naturels tout en conservant la gravité du récit.
