source:
  edition: SBLGNT
  text: Ἰούδας δὲ ἐγέννησεν τὸν Φαρὲς καὶ τὸν Ζάρα ἐκ τῆς Θαμάρ, Φαρὲς δὲ ἐγέννησεν τὸν Ἑσρώμ, Ἑσρὼμ δὲ ἐγέννησεν τὸν Ἀράμ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/003.yaml
  text: Judah fathered Perez and Zerah by Tamar[a], Perez fathered Hezron, and Hezron fathered Aram.
translation:
  language: fr
  text: Juda engendra Pérets et Zérah de Tamar. Pérets engendra Hetsrôn, et Hetsrôn engendra Aram[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans certaines traductions ou traditions, on lit « Ram », par harmonisation avec la généalogie de l’Ancien Testament ; le texte grec de Matthieu porte ici « Aram ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδας
  choice: Juda
  rationale: Dans ce contexte généalogique, le nom désigne le patriarche Juda. La forme française traditionnelle « Juda » maintient le lien avec l’Ancien Testament et évite la confusion avec les personnages du Nouveau Testament appelés Judas.
- source_word: δὲ
  choice: ponctuation et « et »
  rationale: Ici, δέ marque la progression de la généalogie sans exprimer de contraste fort. Des phrases successives et un dernier « et » rendent naturellement cette articulation en français.
- source_word: ἐγέννησεν
  choice: eut pour fils / engendra
  rationale: Dans une généalogie, γεννάω exprime la paternité ou la filiation. « Eut … deux fils » convient à la première proposition, qui nomme deux enfants et leur mère; « engendra » conserve ensuite la formulation généalogique concise et solennelle.
- source_word: Φαρὲς
  choice: Pérets
  rationale: Cette forme française correspond au nom hébreu פֶּרֶץ et assure la continuité avec les formes modernes couramment employées dans l’Ancien Testament.
- source_word: Ζάρα
  choice: Zéra
  rationale: Cette forme française correspond au nom hébreu זֶרַח et maintient la continuité avec l’Ancien Testament.
- source_word: ἐκ τῆς Θαμάρ
  choice: de Tamar
  rationale: Avec le nom de la mère, ἐκ indique ici l’origine maternelle. La tournure « eut de Tamar deux fils » est claire, naturelle et fidèle en français.
- source_word: Θαμάρ
  choice: Tamar
  rationale: Forme française usuelle de ce nom biblique.
- source_word: Ἑσρώμ
  choice: Hetsron
  rationale: Cette forme française correspond au nom hébreu חֶצְרוֹן et permet de reconnaître le personnage de l’Ancien Testament.
- source_word: Ἀράμ
  choice: Aram
  rationale: Le texte grec fourni porte explicitement Ἀράμ. La traduction suit cette forme au lieu de l’harmoniser silencieusement avec « Ram », forme rencontrée dans la généalogie de l’Ancien Testament.
theological_decisions:
- issue: Faut-il harmoniser le dernier nom avec la forme courante dans la généalogie de l’Ancien Testament ?
  choice: Aram
  alternative: Ram
  rationale: La priorité est donnée au texte grec de Matthieu, qui porte Ἀράμ. La variante de forme connue par l’Ancien Testament est signalée en note sans remplacer la lecture du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La première proposition est légèrement restructurée pour exprimer naturellement en français la naissance de deux fils d’une même mère; les deux propositions suivantes conservent le rythme généalogique avec « engendra ». Le marqueur de note est placé après « Aram », auquel la note se rapporte.
