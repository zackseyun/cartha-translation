  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου ἐποίησεν ὡς προσέταξεν αὐτῷ ὁ ἄγγελος κυρίου καὶ παρέλαβεν τὴν γυναῖκα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/001/024.yaml
  text: Then Joseph[a], having awakened from sleep, did as the angel of the Lord commanded him and took his wife.
translation:
  language: fr
  text: À son réveil, Joseph fit ce que l’ange du Seigneur lui avait ordonné et prit sa femme avec lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reçut sa femme » ou « prit sa femme chez lui ». Le verbe grec peut exprimer le fait de prendre ou de recevoir quelqu’un auprès de soi, notamment dans son foyer.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθεὶς δὲ ὁ Ἰωσὴφ ἀπὸ τοῦ ὕπνου
  choice: À son réveil, Joseph
  rationale: La tournure française rend naturellement le participe aoriste et l’expression « hors du sommeil », tout en conservant l’antériorité du réveil par rapport à l’action principale. δέ assure ici la progression narrative et n’exige pas un connecteur explicite en français.
- source_word: ἐποίησεν ὡς
  choice: fit ce que
  rationale: Cette formulation idiomatique exprime clairement la conformité de l’action de Joseph à l’ordre reçu.
- source_word: προσέταξεν αὐτῷ
  choice: lui avait ordonné
  rationale: Le plus-que-parfait situe naturellement l’ordre avant son exécution; « ordonner » conserve la force autoritative de προστάσσω.
- source_word: ὁ ἄγγελος κυρίου
  choice: l’ange du Seigneur
  rationale: Rendu transparent et traditionnel de la construction grecque, avec « Seigneur » pour κύριος.
- source_word: παρέλαβεν
  choice: prit … auprès de lui
  rationale: παραλαμβάνω peut signifier prendre ou recevoir auprès de soi. Cette formulation conserve l’idée d’accueil personnel sans préciser indûment toutes ses modalités domestiques.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sa femme
  rationale: Dans le cadre légal et matrimonial du récit, γυνή désigne naturellement l’épouse, sans impliquer à lui seul la consommation du mariage.
theological_decisions:
- issue: Sens matrimonial de γυνή avant la consommation du mariage
  choice: sa femme
  alternative: la femme
  rationale: Matthieu présente déjà Marie dans un cadre matrimonial légal. « Sa femme » rend ce statut sans ajouter que le mariage aurait été consommé.
- issue: Rendu de κύριος dans ἄγγελος κυρίου
  choice: l’ange du Seigneur
  alternative: l’ange de Yahvé
  rationale: « Seigneur » correspond directement à κύριος dans le texte grec transmis et préserve l’expression biblique française usuelle.
translation_notes:
  register: Français international moderne, naturel et digne. « À son réveil » évite une construction participiale lourde; « auprès de lui » maintient la nuance de παραλαμβάνω. Le marqueur de note est placé immédiatement après la proposition concernée.
