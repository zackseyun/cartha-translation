id: MAT.3.9
reference: Matthew 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ δόξητε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/009.yaml
  text: And do not presume to say among yourselves[a], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: fr
  text: 'Et ne vous imaginez pas pouvoir dire entre vous[a] : « Nous avons Abraham pour père. » Car je vous le dis, Dieu peut susciter à Abraham des enfants à partir de ces pierres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dire en vous-mêmes ». L’expression grecque peut évoquer soit ce qu’ils se disent intérieurement, soit ce qu’ils disent au sein de leur groupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δόξητε
  choice: ne vous imaginez pas pouvoir
  rationale: Cette formulation rend l’interdiction d’adopter une assurance infondée, tout en conservant la dimension mentale de δοκέω. Elle convient au ton de réprimande sans durcir le texte jusqu’à « n’osez pas ».
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: dire entre vous[a]
  rationale: Le pluriel réfléchi peut désigner soit un discours tenu au sein du groupe, soit une parole intérieure. Le texte retient la première possibilité, naturelle dans ce contexte collectif, et la note conserve l’autre.
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: Nous avons Abraham pour père
  rationale: Cette tournure française naturelle préserve l’affirmation appuyée de la filiation ancestrale et l’assurance qui lui est associée.
- source_word: λέγω γὰρ ὑμῖν
  choice: Car je vous le dis
  rationale: La traduction garde la valeur explicative de γάρ et rend naturellement la formule solennelle d’énonciation.
- source_word: δύναται
  choice: peut
  rationale: En français moderne, « peut » exprime clairement la capacité ou la puissance de Dieu sans lourdeur stylistique.
- source_word: ἐκ τῶν λίθων τούτων
  choice: à partir de ces pierres
  rationale: Cette expression rend explicitement l’idée de provenance portée par ἐκ et conserve l’image concrète des pierres présentes.
- source_word: ἐγεῖραι
  choice: susciter
  rationale: Dans ce contexte, le verbe signifie faire apparaître ou produire une descendance, sans renvoyer nécessairement à la résurrection. « Susciter » garde la force du verbe et sa dignité biblique.
- source_word: τέκνα
  choice: des enfants
  rationale: τέκνα est inclusif et désigne des enfants ou descendants sans restriction de sexe ; « enfants » est ici exact et courant.
- source_word: τῷ Ἀβραάμ
  choice: à Abraham
  rationale: 'Le datif indique la relation à Abraham : Dieu peut lui susciter des enfants, c’est-à-dire une descendance qui se rattache à lui.'
theological_decisions:
- issue: Portée de la descendance d’Abraham dans l’avertissement de Jean
  choice: Le verset rejette la confiance dans la seule ascendance physique comme garantie devant Dieu, sans nier qu’Abraham soit historiquement le père d’Israël.
  alternative: Comprendre la phrase comme une simple hyperbole sans critique du privilège généalogique, ou comme l’affirmation d’un remplacement d’Israël en tant que tel.
  rationale: L’avertissement vise directement l’assurance fondée sur l’ascendance. La traduction préserve cette critique, mais n’introduit ni système théologique ultérieur ni conclusion concernant un remplacement que le verset n’énonce pas.
translation_notes:
  register: Français international moderne, naturel et digne. « Susciter » conserve une résonance biblique intelligible, tandis que la syntaxe générale reste accessible. L’ambiguïté de ἐν ἑαυτοῖς est signalée sans être artificiellement résolue.
