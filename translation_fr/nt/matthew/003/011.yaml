id: MAT.3.11
reference: Matthew 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγὼ μὲν ⸂ὑμᾶς βαπτίζω⸃ ἐν ὕδατι εἰς μετάνοιαν· ὁ δὲ ὀπίσω μου ἐρχόμενος ἰσχυρότερός μού ἐστιν, οὗ οὐκ εἰμὶ ἱκανὸς τὰ ὑποδήματα βαστάσαι· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ ⸂καὶ πυρί⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/011.yaml
  text: I indeed baptize you in water for repentance[a], but the one coming after me is stronger than I, whose sandals I am not worthy to carry[c][b]. He himself will baptize you in the Holy Spirit and fire.
translation:
  language: fr
  text: Moi, je vous baptise dans l’eau en vue de la repentance[a] ; mais celui qui vient après moi est plus puissant que moi, et je ne suis pas digne de porter ses sandales. Lui, il vous baptisera dans l’Esprit Saint et le feu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On peut aussi traduire « avec de l’eau » et, plus loin, « avec l’Esprit Saint et le feu ». La préposition grecque ἐν permet ces deux manières de rendre les expressions. « En vue de la repentance » conserve l’idée d’orientation exprimée par le grec sans préciser si la repentance précède le baptême ou si celui-ci la manifeste.
    reason: lexical_alternative
  - marker: b
    text: Le feu peut évoquer la purification ou le jugement ; l’expression grecque ne tranche pas explicitement ici, et le contexte doit guider son interprétation.
    reason: alternative_reading
lexical_decisions:
- source_word: βαπτίζω / βαπτίσει
  choice: baptise / baptisera
  rationale: Le verbe français consacré garde le sens rituel sans imposer un mode précis comme le ferait « immerger ».
- source_word: ἐν ὕδατι
  choice: dans l’eau
  rationale: « Dans » reproduit naturellement la construction grecque ἐν avec le datif, tout en laissant possible la valeur instrumentale signalée en note.
- source_word: εἰς μετάνοιαν
  choice: en vue de la repentance
  rationale: Cette formulation conserve l’orientation exprimée par εἰς sans trancher précisément le rapport chronologique ou symbolique entre baptême et repentance.
- source_word: ὁ δὲ ὀπίσω μου ἐρχόμενος
  choice: mais celui qui vient après moi
  rationale: Rend naturellement le participe substantivé et le contraste marqué par δέ.
- source_word: ἰσχυρότερός μού
  choice: est plus puissant que moi
  rationale: « Plus puissant » exprime ici clairement la supériorité de force ou d’autorité impliquée par ἰσχυρότερος.
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: je ne suis pas digne
  rationale: Dans cette formule d’humilité, « digne » restitue mieux la portée idiomatique que « capable » ou « apte ».
- source_word: τὰ ὑποδήματα βαστάσαι
  choice: de porter ses sandales
  rationale: βαστάσαι signifie porter, et non retirer ; « sandales » correspond au référent historique de ὑποδήματα.
- source_word: αὐτὸς
  choice: Lui, il
  rationale: La dislocation française rend avec naturel l’emphase du pronom grec et le contraste avec l’action de Jean.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dans l’Esprit Saint
  rationale: La formulation conserve le parallélisme avec « dans l’eau » et comprend πνεῦμα ἅγιον comme le référent personnel habituel dans ce contexte.
- source_word: καὶ πυρί
  choice: et le feu
  rationale: La traduction littérale préserve l’ambiguïté entre purification et jugement, sans ajouter une interprétation au texte.
theological_decisions:
- issue: Sens de « l’Esprit Saint et le feu »
  choice: Conserver « dans l’Esprit Saint et le feu » sans explicitation interprétative.
  alternative: « dans l’Esprit Saint et un feu purificateur » ou « dans l’Esprit Saint et le feu du jugement »
  rationale: Le grec ne précise pas directement si le feu représente ici la purification ou le jugement ; le contexte proche nourrit la discussion. La traduction doit préserver cette tension.
- issue: Référent de πνεύματι ἁγίῳ
  choice: « l’Esprit Saint »
  alternative: « un esprit saint » ou « une puissance sainte »
  rationale: Dans le contexte matthéen, l’expression renvoie le plus naturellement à l’Esprit Saint, sans qu’il soit nécessaire d’ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, courant et digne. « Repentance » est retenu comme terme biblique précis et largement intelligible. La ponctuation et la dislocation « Lui, il » rendent oralement le contraste emphatique du grec.
