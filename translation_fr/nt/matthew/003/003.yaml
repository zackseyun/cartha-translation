  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτος γάρ ἐστιν ὁ ῥηθεὶς ⸀διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/003.yaml
  text: 'For this is the one spoken of through Isaiah the prophet[a], saying: “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: fr
  text: 'Car c’est celui dont le prophète Ésaïe a parlé lorsqu’il a dit : « Une voix crie dans le désert[a] : “Préparez le chemin du Seigneur[b], rendez droits ses sentiers.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre rattachement possible : « Une voix crie : “Dans le désert, préparez le chemin du Seigneur…” »'
    reason: ambiguïté syntaxique
  - marker: b
    text: Dans Ésaïe 40.3, passage cité ici, le texte hébreu porte le nom divin YHWH.
    reason: arrière-plan de la citation
lexical_decisions:
- source_word: οὗτος γάρ ἐστιν
  choice: C’est en effet de lui
  rationale: Le démonstratif renvoie à Jean-Baptiste dans le contexte immédiat, et γάρ introduit l’explication. Cette tournure française conserve ce lien tout en restant naturelle.
- source_word: ὁ ῥηθεὶς διὰ Ἠσαΐου τοῦ προφήτου λέγοντος
  choice: qu’a parlé le prophète Ésaïe en disant
  rationale: La formulation rend la référence prophétique et l’introduction de la citation dans un français courant et digne. La médiation exprimée par διά est portée par l’idée que la parole vient par la voix du prophète.
- source_word: Φωνὴ βοῶντος
  choice: Une voix crie
  rationale: Cette formulation idiomatique rend l’idée d’« une voix de quelqu’un qui crie » sans la lourdeur de « une voix de celui qui crie ». L’article indéfini convient à φωνή sans article.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: Le terme désigne ici la région inhabitée où Jean exerce son ministère. « Désert » est naturel en français et maintient l’écho d’Ésaïe 40.3.
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: Préparez le chemin du Seigneur
  rationale: L’impératif pluriel est conservé, ainsi que la métaphore du chemin. « Seigneur » traduit directement κύριος dans le texte grec.
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: rendez droits ses sentiers
  rationale: La tournure conserve l’impératif, l’image de la rectitude et le pronom personnel. « Sentiers » convient au registre poétique de la citation.
theological_decisions:
- issue: Traduction de κυρίου dans une citation d’Ésaïe 40.3 où le texte hébreu porte le nom divin YHWH
  choice: du Seigneur
  alternative: de l’Éternel / de YHWH
  rationale: Le texte grec de Matthieu porte κυρίου, normalement rendu par « Seigneur ». Une note signale néanmoins que la source hébraïque nomme explicitement YHWH, afin de préserver la portée intertextuelle sans substituer silencieusement l’hébreu au texte grec.
- issue: Rattachement syntaxique de « dans le désert »
  choice: 'à l’action de crier : « Une voix crie dans le désert »'
  alternative: 'au commandement : « Dans le désert, préparez le chemin… »'
  rationale: La ponctuation retenue correspond au contexte immédiat, qui présente Jean proclamant dans le désert, mais le grec ancien ne fixe pas la ponctuation; l’autre rattachement, également possible dans la citation d’Ésaïe, est donc indiqué en note.
translation_notes:
  register: Français international moderne, clair et digne. La citation garde un rythme poétique sans employer de tournures archaïques. Les guillemets français encadrent la citation principale et des guillemets doubles la parole qu’elle contient.
