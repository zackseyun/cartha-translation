source:
  edition: SBLGNT
  text: αὐτὸς δὲ ὁ Ἰωάννης εἶχεν τὸ ἔνδυμα αὐτοῦ ἀπὸ τριχῶν καμήλου καὶ ζώνην δερματίνην περὶ τὴν ὀσφὺν αὐτοῦ, ἡ δὲ τροφὴ ⸂ἦν αὐτοῦ⸃ ἀκρίδες καὶ μέλι ἄγριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/004.yaml
  text: John himself wore clothing made of camel’s hair and a leather belt around his waist[c][b][a], and his food was locusts and wild honey.
translation:
  language: fr
  text: Jean lui-même portait un vêtement en poil de chameau[b] et une ceinture de cuir[a] autour de sa taille ; sa nourriture était faite de sauterelles et de miel sauvage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette description vestimentaire rappelle celle du prophète Élie en 2 Rois 1.8, un arrière-plan important de la présentation de Jean par Matthieu.
    reason: cross_reference
  - marker: b
    text: 'Ou : « un vêtement fait de poils de chameau ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ ὁ Ἰωάννης
  choice: Jean lui-même
  rationale: αὐτός a ici une valeur emphatique, rendue par « lui-même ». Le léger lien exprimé par δέ n’exige pas nécessairement un connecteur explicite en français.
- source_word: εἶχεν τὸ ἔνδυμα αὐτοῦ
  choice: portait un vêtement
  rationale: Littéralement « avait son vêtement » ; dans ce contexte descriptif, « portait » exprime naturellement l’état vestimentaire sans suggérer qu’il avait fait confectionner l’habit.
- source_word: ἀπὸ τριχῶν καμήλου
  choice: en poil de chameau
  rationale: ἀπό indique ici la matière. La tournure française « en poil de chameau » est claire et idiomatique.
- source_word: ζώνην δερματίνην
  choice: une ceinture de cuir
  rationale: ζώνη désigne une ceinture ou bande portée à la taille, et δερματίνη en précise la matière.
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: autour de la taille
  rationale: « Taille » rend naturellement ὀσφύς en français moderne, sans l’archaïsme de « reins ».
- source_word: ἡ δὲ τροφὴ ἦν αὐτοῦ
  choice: et il se nourrissait de
  rationale: Cette formulation française restitue naturellement l’idée de « sa nourriture était », tout en gardant la description habituelle portée par l’imparfait.
- source_word: ἀκρίδες
  choice: sauterelles
  rationale: Le sens lexical ordinaire est celui des insectes appelés sauterelles ; rien dans le contexte ne justifie une autre identification.
- source_word: μέλι ἄγριον
  choice: miel sauvage
  rationale: L’expression désigne du miel trouvé dans la nature plutôt qu’un produit d’élevage ou de culture.
theological_decisions:
- issue: Évocation de l’apparence du prophète Élie
  choice: Conserver dans le texte une description sobre de l’habit et placer le rapprochement avec Élie en note.
  alternative: Employer une formulation qui rendrait explicitement Jean semblable à Élie.
  rationale: Le grec décrit directement l’apparence et l’alimentation de Jean. Le lien intertextuel avec 2 Rois 1.8 est pertinent, mais il ne doit pas être ajouté comme interprétation dans le corps du texte.
translation_notes:
  register: Français international moderne, narratif et digne. « Vêtement » reste au singulier comme le grec ; « se nourrissait de » évite une tournure nominale plus lourde. Les marqueurs de notes sont placés immédiatement après les éléments concernés.
