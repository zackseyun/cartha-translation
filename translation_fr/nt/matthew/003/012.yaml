id: MAT.3.12
reference: Matthew 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ, καὶ διακαθαριεῖ τὴν ἅλωνα αὐτοῦ καὶ συνάξει τὸν σῖτον αὐτοῦ εἰς τὴν ⸀ἀποθήκην, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/012.yaml
  text: His winnowing fork is in his hand[a], and he will thoroughly clear his threshing floor and gather his wheat into the storehouse[b], but the chaff he will burn up with unquenchable fire.
translation:
  language: fr
  text: Il tient en main sa pelle à vanner[a] et nettoiera complètement son aire de battage. Il rassemblera son blé dans le grenier[b], mais il consumera la balle par un feu inextinguible[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fourche à vanner ».
    reason: lexical_alternative
  - marker: b
    text: Ou « entrepôt à grains » ou « grange ».
    reason: lexical_alternative
  - marker: c
    text: Ou « la paille ». Le mot désigne les résidus légers séparés du grain lors du vannage.
    reason: lexical_clarification
lexical_decisions:
- source_word: πτύον
  choice: pelle à vanner
  rationale: Désigne l’instrument agricole servant à lancer en l’air le produit du battage afin de séparer le grain de la paille. « Pelle à vanner » est précis et compréhensible en français moderne.
- source_word: διακαθαριεῖ
  choice: nettoiera entièrement
  rationale: Le verbe composé exprime un nettoyage complet de l’aire; l’adverbe restitue cette valeur intensive.
- source_word: ἅλωνα
  choice: aire de battage
  rationale: Terme agricole usuel et exact pour l’endroit où l’on bat puis vanne les céréales.
- source_word: σῖτον
  choice: blé
  rationale: Le mot peut désigner les céréales ou le grain en général, mais « blé » convient naturellement à l’opposition concrète avec la paille dans cette scène de vannage.
- source_word: ἀποθήκην
  choice: grenier
  rationale: Désigne ici le bâtiment ou local où le grain est entreposé; « grenier » est idiomatique sans imposer le sens moderne général d’« entrepôt ».
- source_word: ἄχυρον
  choice: paille
  rationale: Dans ce contexte, il s’agit des résidus sans valeur séparés du grain. « Paille » est l’équivalent français traditionnel et immédiatement intelligible.
- source_word: κατακαύσει
  choice: brûlera
  rationale: Le contexte du feu communique déjà la destruction; « brûlera » reste naturel, tandis que l’opposition avec la mise en réserve conserve l’idée de consommation complète.
- source_word: πυρὶ ἀσβέστῳ
  choice: dans un feu qui ne s’éteint pas
  rationale: Cette formulation naturelle conserve le sens d’un feu impossible à éteindre, sans expliquer davantage la portée théologique de l’image.
- source_word: οὗ
  choice: Il tient sa
  rationale: Le relatif génitif renvoie à celui qui vient au verset précédent. La restructuration française avec sujet pronominal et possessif préserve ce lien de manière fluide.
theological_decisions:
- issue: Image du jugement séparant le blé de la paille
  choice: Conserver la métaphore agricole concrète et les verbes au futur sans identifier explicitement ses référents.
  alternative: Remplacer dans le texte le blé et la paille par les justes et les méchants.
  rationale: Le verset présente lui-même une image sévère du jugement sans en expliciter ici chaque correspondance; la traduction doit préserver cette tension et éviter la paraphrase doctrinale.
- issue: Portée de « feu qui ne s’éteint pas »
  choice: Traduire littéralement la qualité du feu sans préciser sa durée ni sa nature au-delà du grec.
  alternative: Ajouter une interprétation explicite sur le châtiment éternel ou sur la destruction définitive.
  rationale: ἄσβεστος signifie que le feu ne peut être éteint; le texte ne doit pas être amplifié pour trancher des débats théologiques connexes.
translation_notes:
  register: Français international moderne, digne et concret. La syntaxe a été répartie en deux phrases pour une lecture naturelle, tout en maintenant la progression de l’image et son contraste final.
