  text: καὶ ἐβαπτίζοντο ἐν τῷ Ἰορδάνῃ ⸀ποταμῷ ὑπ’ αὐτοῦ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/006.yaml
  text: and they were being baptized by him in the Jordan River[a], confessing their sins.
translation:
  language: fr
  text: et ils étaient baptisés[a] par lui dans le fleuve Jourdain, en confessant leurs péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se faisaient baptiser ». L’imparfait grec peut présenter l’action comme en cours ou répétée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβαπτίζοντο
  choice: se faisaient baptiser
  rationale: Cette tournure française rend le passif et, à l’imparfait, présente les baptêmes comme une action en cours ou répétée. Le terme rituel « baptiser » est conservé sans préciser un mode que le verset ne définit pas.
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: dans le fleuve Jourdain
  rationale: La préposition ἐν est rendue dans son sens locatif, et « fleuve » traduit le nom ποταμός explicitement présent dans le grec.
- source_word: ὑπ’ αὐτοῦ
  choice: par lui
  rationale: Ὑπό suivi du génitif indique l’agent. Le pronom, qui renvoie à Jean dans le contexte, est conservé sans remplacer explicitement son antécédent.
- source_word: ἐξομολογούμενοι
  choice: en confessant
  rationale: Le participe exprime une action concomitante au baptême et désigne ici l’aveu des fautes.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: leurs péchés
  rationale: Cette formulation directe conserve le pluriel du texte grec et le rapport possessif.
- source_word: καὶ
  choice: et
  rationale: La conjonction simple maintient le lien narratif avec le verset précédent sans en préciser davantage la nuance.
theological_decisions:
- issue: Sens du terme relatif au baptême
  choice: Conserver « baptiser » sans préciser le mode.
  alternative: immerger ; laver
  rationale: Le verset rapporte que les gens recevaient le baptême de Jean dans le Jourdain, mais ne définit pas explicitement le mode du rite. « Baptiser » préserve cette retenue et évite d’introduire une conclusion confessionnelle.
translation_notes:
  register: Français moderne, clair et digne. « Fleuve Jourdain » garde l’élément explicite ποταμός, tandis que « se faisaient baptiser » reste idiomatique et conserve l’agent introduit par « par lui ».
