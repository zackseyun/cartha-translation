id: MAT.3.13
reference: Matthew 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε παραγίνεται ὁ Ἰησοῦς ἀπὸ τῆς Γαλιλαίας ἐπὶ τὸν Ἰορδάνην πρὸς τὸν Ἰωάννην τοῦ βαπτισθῆναι ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/013.yaml
  text: Then Jesus comes from Galilee to the Jordan[a], to John[c][b], to be baptized by him.
translation:
  language: fr
  text: Alors Jésus vient de Galilée au Jourdain, auprès de Jean, pour être baptisé par lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec est au présent historique, qui donne de la vivacité au récit ; on pourrait aussi traduire : « Alors Jésus arrive de Galilée… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque la progression temporelle du récit de façon naturelle et concise en français.
- source_word: παραγίνεται
  choice: vient
  rationale: Le présent français conserve le présent historique grec et sa vivacité narrative; selon le contexte, le verbe peut aussi exprimer l’idée d’arriver.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: de Galilée
  rationale: ἀπό indique le point de départ ou l’origine.
- source_word: ἐπὶ τὸν Ἰορδάνην
  choice: jusqu’au Jourdain
  rationale: Avec l’accusatif et un verbe de mouvement, ἐπί indique ici le déplacement vers le Jourdain; «jusqu’au» rend clairement la destination.
- source_word: πρὸς τὸν Ἰωάννην
  choice: auprès de Jean
  rationale: πρός avec l’accusatif marque ici le mouvement vers une personne. «Auprès de Jean» évite une répétition pesante de «à» tout en exprimant la destination personnelle.
- source_word: τοῦ βαπτισθῆναι
  choice: pour être baptisé
  rationale: L’infinitif articulé exprime le but; cette tournure française est naturelle et explicite.
- source_word: ὑπ’ αὐτοῦ
  choice: par lui
  rationale: ὑπό avec le génitif désigne l’agent personnel; le pronom reproduit le texte sans répéter explicitement le nom de Jean.
theological_decisions:
- issue: Présent historique de παραγίνεται
  choice: 'Conserver le présent: «vient»'
  alternative: 'Employer le passé: «vint» ou «est venu»'
  rationale: Le présent préserve la vivacité narrative du grec sans modifier le contenu théologique.
- issue: Désignation de Jean
  choice: Employer seulement «Jean»
  alternative: Ajouter «Jean-Baptiste»
  rationale: Le verset grec dit uniquement «Jean»; son titre n’est donc pas ajouté.
- issue: Finalité du baptême
  choice: Rendre τοῦ βαπτισθῆναι par «pour être baptisé»
  alternative: 'Traduction moins explicite ou plus développée: «afin de recevoir le baptême»'
  rationale: La formulation retenue exprime directement le but et conserve la voix passive ainsi que l’agent «par lui».
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le présent narratif et distingue naturellement le lieu, «le Jourdain», de la personne vers laquelle Jésus se rend, «Jean».
