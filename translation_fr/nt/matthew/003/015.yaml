  source_fidelity: 'La structure et le sens du grec sont bien rendus : Jésus répond à Jean, lui demande de permettre le baptême pour l’instant, invoque ce qui convient « à nous », puis Jean consent. Toutefois, « tout ce qui est juste » explicite et resserre δικαιοσύνη en une formulation interprétative. « Toute justice » conserve mieux le substantif grec, son ampleur et son écho matthéen, sans trancher indûment entre justice et righteousness.'
