  terminology: « Accomplissions » rend bien πληρῶσαι. La correction de « tout ce qui est juste » en « toute justice » est nécessaire pour préserver le terme-clé δικαιοσύνη comme expression ouverte et théologiquement non réduite. La note doit présenter « conformité à la volonté de Dieu » comme une indication contextuelle, non comme le sens littéral.
