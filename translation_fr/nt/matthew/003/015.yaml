  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν ⸂πρὸς αὐτόν⸃· Ἄφες ἄρτι, οὕτως γὰρ πρέπον ἐστὶν ἡμῖν πληρῶσαι πᾶσαν δικαιοσύνην. τότε ἀφίησιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/015.yaml
  text: But Jesus answered him[a], “Permit it for now, for in this way it is fitting for us to fulfill all righteousness.” Then he permitted him.
translation:
  language: fr
  text: 'Mais Jésus lui répondit : « Laisse faire pour le moment, car c’est ainsi qu’il convient que nous accomplissions toute justice.[a] » Alors Jean le laissa faire.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toute droiture ». Le mot grec peut désigner la justice ou la conformité à la volonté de Dieu ; ici, l’expression conserve une portée large.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν
  choice: Mais Jésus lui répondit
  rationale: La tournure grecque « ayant répondu, dit » est un idiome rendu naturellement par « répondit ». δέ marque ici le contraste avec l’objection de Jean au verset précédent.
- source_word: Ἄφες ἄρτι
  choice: Laisse faire pour le moment
  rationale: ἀφίημι signifie ici permettre ou laisser faire, non pardonner ni quitter. « Pour le moment » conserve la portée immédiate et temporaire de ἄρτι.
- source_word: οὕτως γὰρ
  choice: car c’est ainsi
  rationale: 'La formulation renvoie à la manière qui vient d’être évoquée : Jean doit baptiser Jésus.'
- source_word: πρέπον ἐστὶν ἡμῖν
  choice: il convient que nous
  rationale: Cette tournure française actuelle exprime ce qui est approprié ou conforme à la situation, tout en conservant le « nous » inclusif du grec.
- source_word: πληρῶσαι
  choice: accomplissions
  rationale: « Accomplir » conserve l’idée de mener pleinement à réalisation et les résonances matthéennes de πληρόω, sans donner ici une tournure française artificielle.
- source_word: πᾶσαν δικαιοσύνην
  choice: tout ce qui est juste
  rationale: 'Cette expression française rend naturellement l’étendue de πᾶσαν et le sens contextuel de δικαιοσύνη : tout ce qui correspond à la volonté juste de Dieu. La note préserve la traduction plus formelle et l’autre possibilité lexicale.'
- source_word: τότε ἀφίησιν αὐτόν
  choice: Alors Jean le laissa faire
  rationale: Le présent historique grec est rendu au passé simple. Le sujet implicite est explicité comme Jean pour éviter une ambiguïté française, et la reprise de « laissa faire » reflète celle du verbe ἀφίημι.
theological_decisions:
- issue: Sens de πᾶσαν δικαιοσύνην
  choice: Une référence large à l’accomplissement de tout ce qui est juste selon la volonté de Dieu dans cette situation
  alternative: « toute justice » ou une référence plus étroite à l’ensemble des exigences légales
  rationale: Le contexte concerne le baptême de Jésus par Jean, mais le texte ne détaille pas davantage la portée doctrinale de l’expression. La traduction évite donc de la réduire à l’observance légale ou de lui imposer un système théologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Laisse faire » est idiomatique sans être familier; « il convient » maintient la solennité. La répétition de ἀφίημι est conservée par la reprise de « laissa faire ».
