id: MAT.3.10
reference: Matthew 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἤδη ⸀δὲ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/010.yaml
  text: And already the axe is laid at the root of the trees[a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: fr
  text: Déjà, la hache est posée à la racine des arbres[a]. Ainsi, tout arbre qui ne produit pas de bon fruit est coupé et jeté au feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se trouve à la racine des arbres ».'
    reason: Le verbe κεῖται peut décrire ce qui est posé ou ce qui se trouve en un lieu; les deux formulations préservent l’image de la hache déjà en position.
lexical_decisions:
- source_word: ἤδη δὲ
  choice: Déjà
  rationale: « Déjà » conserve l’urgence temporelle de ἤδη. Le δέ est ici une liaison légère que le français exprime naturellement par l’enchaînement, sans ajouter une opposition marquée.
- source_word: ἡ ἀξίνη
  choice: la hache
  rationale: Équivalent français courant et précis de l’outil employé dans cette image de jugement.
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: est posée à la racine des arbres
  rationale: Cette formulation conserve l’image de la hache déjà placée au pied des arbres, prête à servir, sans expliciter davantage que le grec.
- source_word: πᾶν οὖν δένδρον
  choice: Ainsi, tout arbre
  rationale: « Ainsi » rend l’inférence marquée par οὖν tout en assurant un enchaînement naturel en français moderne.
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: qui ne produit pas de bon fruit
  rationale: La relative française rend clairement le participe et conserve le verbe général ποιέω ainsi que l’image transparente du bon fruit.
- source_word: ἐκκόπτεται
  choice: est coupé
  rationale: Dans le contexte immédiat de la hache et de l’arbre, « est coupé » est naturel et reste proche du passif grec; « abattu » serait également idiomatique, mais légèrement plus explicite.
- source_word: καὶ εἰς πῦρ βάλλεται
  choice: et jeté au feu
  rationale: « Jeté au feu » est une tournure française actuelle et énergique qui rend le passif βάλλεται et la destination exprimée par εἰς.
theological_decisions:
- issue: Nature de l’image du feu
  choice: Conserver simplement « au feu »
  alternative: Préciser « le feu du jugement », « le feu de l’enfer » ou un jugement historique
  rationale: Le verset présente clairement une image de jugement, mais n’en précise pas ici la nature. La traduction maintient donc l’image sans imposer une interprétation doctrinale plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la force proverbiale et l’urgence de l’avertissement, sans développer la métaphore ni identifier explicitement le feu.
