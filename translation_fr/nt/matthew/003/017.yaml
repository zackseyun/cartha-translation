id: MAT.3.17
reference: Matthew 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ φωνὴ ἐκ τῶν οὐρανῶν λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/017.yaml
  text: And behold[a], a voice from the heavens said, “This is my beloved Son[b], with whom I am well pleased.”
translation:
  language: fr
  text: 'Et voici qu’une voix venant des cieux[a] dit : « Celui-ci est mon Fils bien-aimé, en qui j’ai pris plaisir[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du ciel ». Le grec emploie le pluriel : « des cieux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, dans une tournure plus idiomatique : « qui fait ma joie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Et voici que
  rationale: Cette tournure française attire solennellement l’attention sur l’événement tout en restant claire et naturelle.
- source_word: φωνὴ
  choice: une voix
  rationale: Le mot désigne ici une voix articulée, puisqu’il introduit des paroles directes.
- source_word: ἐκ τῶν οὐρανῶν
  choice: venant des cieux
  rationale: Le pluriel du grec est conservé. Le participe français relie naturellement l’origine de la voix à la proposition principale.
- source_word: λέγουσα
  choice: dit
  rationale: Le participe grec introduit la citation ; une forme verbale conjuguée est plus idiomatique en français.
- source_word: Οὗτός ἐστιν
  choice: Celui-ci est
  rationale: « Celui-ci » garde la force démonstrative et identificatrice du grec, plus nettement que le simple pronom « il ».
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mon Fils bien-aimé
  rationale: Cette formulation conserve explicitement la filiation et l’idée d’un amour particulier, dans un registre digne et courant.
- source_word: ἐν ᾧ
  choice: en qui
  rationale: La construction littérale est intelligible en français et préserve la forme relationnelle du grec sans la résoudre en simple approbation.
- source_word: εὐδόκησα
  choice: j’ai pris plaisir
  rationale: Le passé composé rend l’aoriste et exprime le plaisir ou la faveur divine sans ajouter « toute » ni réduire le sens à une approbation administrative.
theological_decisions:
- issue: La déclaration divine concernant la filiation de Jésus
  choice: mon Fils bien-aimé
  alternative: mon Fils, celui que j’aime
  rationale: Le texte conserve la filiation explicite et la qualité de « bien-aimé » sans développer une doctrine supplémentaire ni donner à la déclaration un sens adoptif absent du grec.
- issue: La portée de ἐν ᾧ εὐδόκησα
  choice: en qui j’ai pris plaisir
  alternative: qui fait ma joie
  rationale: Le choix principal garde à la fois la préposition grecque et la valeur passée de l’aoriste. L’alternative idiomatique est signalée sans imposer une interprétation exclusivement présente.
- issue: Le pluriel οὐρανῶν
  choice: des cieux
  alternative: du ciel
  rationale: Le pluriel du texte source est maintenu, tandis que le singulier français courant est indiqué en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Et voici que » conserve le relief solennel du marqueur discursif ; « en qui j’ai pris plaisir » assume une légère élévation de registre afin de préserver la formulation et la tension aspectuelle du grec.
