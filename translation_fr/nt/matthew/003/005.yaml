source:
  edition: SBLGNT
  text: τότε ἐξεπορεύετο πρὸς αὐτὸν Ἱεροσόλυμα καὶ πᾶσα ἡ Ἰουδαία καὶ πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/005.yaml
  text: Then Jerusalem[a], all Judea, and all the region around the Jordan were going out to him[c][b],
translation:
  language: fr
  text: Alors, on venait à lui[a] de Jérusalem, de toute la Judée et de toute la région autour du Jourdain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’imparfait grec peut exprimer une action continue ou répétée : « on ne cessait de venir à lui ».'
    reason: lexical_alternative
  - marker: b
    text: « Toute la Judée » et « toute la région autour du Jourdain » sont des expressions géographiques générales qui soulignent l’ampleur du mouvement, sans désigner nécessairement chaque habitant sans exception.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la progression temporelle et narrative depuis la description du ministère de Jean.
- source_word: ἐξεπορεύετο
  choice: on venait
  rationale: L’imparfait grec présente une action en cours ou répétée. La tournure impersonnelle française permet d’énumérer naturellement les lieux d’origine tout en désignant les personnes qui en venaient.
- source_word: πρὸς αὐτόν
  choice: à lui
  rationale: Avec un verbe de mouvement, πρός suivi de l’accusatif indique ici le déplacement vers Jean. « Venir à lui » est idiomatique et précis.
- source_word: Ἱεροσόλυμα
  choice: de Jérusalem
  rationale: Le nom de la ville désigne par métonymie ses habitants; la construction avec « de » exprime leur lieu d’origine sans devoir expliciter cette métonymie dans le corps du texte.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: de toute la Judée
  rationale: Conserve l’expression géographique globale et l’insistance de πᾶσα, sans ajouter une limitation absente du texte.
- source_word: πᾶσα ἡ περίχωρος τοῦ Ἰορδάνου
  choice: de toute la région autour du Jourdain
  rationale: « La région autour de » rend περίχωρος dans un français actuel et naturel, tandis que « du Jourdain » identifie le repère géographique.
- source_word: καὶ … καὶ
  choice: de Jérusalem, de toute la Judée et de toute la région
  rationale: L’énumération cumulative des trois provenances est conservée; en français, une seule conjonction devant le dernier élément est plus naturelle.
theological_decisions:
- issue: Portée des désignations géographiques globales
  choice: Conserver « toute » pour les deux régions, en signalant qu’il s’agit d’expressions collectives larges
  alternative: Paraphraser par « des gens de Jérusalem, de Judée et de la région du Jourdain »
  rationale: Le texte souligne l’ampleur de la réponse au ministère de Jean par des désignations géographiques globales. Il ne faut ni affaiblir cette force rhétorique ni laisser entendre nécessairement que chaque habitant sans exception est venu.
translation_notes:
  register: Français moderne, international et digne. La tournure « on venait à lui de… » évite une personnification peu naturelle des territoires en français tout en conservant l’imparfait, la direction du mouvement et les trois zones géographiques du grec.
