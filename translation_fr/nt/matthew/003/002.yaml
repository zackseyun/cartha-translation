  text: and saying[a], “Repent[b], for the kingdom of heaven has drawn near.”
translation:
  language: fr
  text: 'et disait : « Repentez-vous[a], car le royaume des cieux s’est approché[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Changez de manière de penser ». Le verbe grec appelle à une réorientation profonde de la pensée et de la conduite; il ne se réduit pas au regret ou au sentiment de culpabilité.
    reason: lexical_alternative
  - marker: b
    text: Ou « est tout proche » ; plus littéralement, « le royaume des cieux s’est approché ». Le parfait grec souligne qu’il s’est approché et qu’il est maintenant proche.
    reason: aspectual_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: et disait
  rationale: Le participe présent λέγων se rattache au récit du verset précédent. « Et disait » conserve ce lien sans introduire l’idée plus précise de proclamer.
- source_word: Μετανοεῖτε
  choice: Changez de mentalité
  rationale: L’impératif présent pluriel appelle les auditeurs à réorienter leur manière de penser et, par conséquent, leur vie. Cette formulation française actuelle évite de réduire l’appel à un simple sentiment de culpabilité, tout en laissant en note la traduction biblique traditionnelle.
- source_word: ἤγγικεν
  choice: s’est approché
  rationale: Le parfait grec présente le royaume comme s’étant approché et étant désormais proche. Le passé composé français conserve cette dynamique mieux que le seul présent « est proche ».
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit la raison de l’appel qui précède et « car » convient au registre proclamatoire.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Cette traduction conserve la formule caractéristique de Matthieu ainsi que le pluriel du grec, tout en restant consacrée et naturelle en français biblique.
theological_decisions:
- issue: Portée de μετανοεῖτε
  choice: Changez de mentalité
  alternative: Repentez-vous
  rationale: Le choix principal met en avant la réorientation fondamentale demandée, sans nier sa portée morale et spirituelle. La variante traditionnelle est donnée en note afin de préserver le lien avec le vocabulaire biblique reçu.
- issue: Sens de « royaume des cieux »
  choice: Conserver « le royaume des cieux »
  alternative: le règne de Dieu
  rationale: La formulation directe préserve le vocabulaire propre à Matthieu et l’ambiguïté de βασιλεία, qui peut évoquer à la fois l’exercice de la royauté et le domaine royal, sans remplacer « des cieux » par une interprétation synoptique.
translation_notes:
  register: Français international actuel, digne et directement compréhensible. « Changez de mentalité » est volontairement plus courant que « repentez-vous », tandis que « royaume des cieux » maintient la texture matthéenne traditionnelle.
