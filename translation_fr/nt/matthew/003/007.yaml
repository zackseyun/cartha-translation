id: MAT.3.7
reference: Matthew 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων ἐρχομένους ἐπὶ τὸ βάπτισμα ⸀αὐτοῦ εἶπεν αὐτοῖς· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/007.yaml
  text: But when he saw many of the Pharisees and Sadducees coming for his baptism[a], he said to them, “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: fr
  text: 'Mais, lorsqu’il vit beaucoup de pharisiens et de sadducéens venir à son baptême, il leur dit : « Engeance de vipères[a] ! Qui vous a avertis de fuir la colère qui vient[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Progéniture de vipères ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la colère à venir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδὼν δὲ
  choice: Mais, lorsqu’il vit
  rationale: Le participe aoriste se rend naturellement par une proposition temporelle en français ; « mais » conserve la légère transition contrastive marquée par δέ.
- source_word: πολλοὺς τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: beaucoup de pharisiens et de sadducéens
  rationale: 'Cette formulation française rend la construction partitive : il s’agit de nombreux membres de ces groupes, sans affirmer que tous étaient présents.'
- source_word: ἐρχομένους ἐπὶ τὸ βάπτισμα αὐτοῦ
  choice: venir à son baptême
  rationale: La préposition ἐπί indique ici le mouvement vers le baptême ou le ministère baptismal de Jean. La traduction évite de préciser, au-delà du texte, qu’ils venaient nécessairement pour être eux-mêmes baptisés.
- source_word: Γεννήματα ἐχιδνῶν
  choice: Engeance de vipères
  rationale: « Engeance » exprime de façon vive et idiomatique ceux qui sont issus ou produits par des vipères, tout en conservant la force de l’invective prophétique.
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: Qui vous a avertis
  rationale: Dans ce contexte de fuite devant une colère imminente, ὑποδείκνυμι a le sens contextuel d’avertir, plutôt que celui, plus neutre, de montrer.
- source_word: φυγεῖν ἀπὸ
  choice: fuir
  rationale: « Fuir » conserve directement l’image d’une fuite urgente ; en français, le complément direct « fuir la colère » est plus naturel que « fuir loin de la colère ».
- source_word: τῆς μελλούσης ὀργῆς
  choice: la colère qui vient
  rationale: Cette expression rend à la fois ὀργή comme « colère » et le caractère imminent ou futur exprimé par μέλλω, sans réduire la notion au seul jugement ou châtiment.
theological_decisions:
- issue: Portée de l’adresse aux pharisiens et aux sadducéens
  choice: Jean s’adresse aux nombreux membres de ces groupes qui viennent à son baptême.
  alternative: Jean caractériserait sans distinction tous les pharisiens et tous les sadducéens.
  rationale: La construction partitive grecque désigne un sous-ensemble et ne permet pas d’étendre explicitement cette scène à chaque membre des deux groupes.
- issue: Force eschatologique de ὀργή
  choice: colère
  alternative: jugement ou châtiment
  rationale: « Colère » préserve la gravité théologique et la force du terme grec, ainsi que son orientation vers une intervention divine à venir, sans l’expliquer ni l’atténuer.
translation_notes:
  register: Français international moderne, soutenu mais accessible. « Engeance de vipères » garde la vigueur de l’apostrophe sans archaïsme excessif. Les minuscules à « pharisiens » et « sadducéens » suivent l’usage français pour les membres de groupes religieux.
