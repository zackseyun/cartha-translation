  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν δὲ ταῖς ἡμέραις ἐκείναις παραγίνεται Ἰωάννης ὁ βαπτιστὴς κηρύσσων ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/001.yaml
  text: In those days John the Baptist came[a], preaching in the wilderness of Judea[b],
translation:
  language: fr
  text: En ce temps-là, Jean le Baptiste vint[a] prêcher dans le désert de Judée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parut ». Le grec emploie ici un présent historique.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ ταῖς ἡμέραις ἐκείναις
  choice: En ce temps-là
  rationale: Expression temporelle française naturelle pour introduire cette nouvelle étape du récit. Le léger lien narratif porté par δέ n’exige pas ici un « mais » et peut rester implicite.
- source_word: παραγίνεται
  choice: parut
  rationale: Le présent historique introduit Jean sur la scène narrative. « Parut » restitue naturellement cette entrée sans nécessairement suggérer une apparition miraculeuse.
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: Jean le Baptiste
  rationale: Forme française traditionnelle, claire et largement reconnue du nom et du titre; « celui qui baptise » explicite davantage la valeur verbale du grec.
- source_word: κηρύσσων
  choice: et se mit à proclamer
  rationale: Le participe décrit l’activité de Jean lors de son entrée en scène. Cette formulation donne une phrase française fluide tout en conservant la simultanéité narrative.
- source_word: ἐν τῇ ἐρήμῳ τῆς Ἰουδαίας
  choice: dans le désert de Judée
  rationale: « Désert » désigne ici une région inhabitée ou désolée, sans imposer l’idée moderne d’une étendue uniquement sablonneuse. « Judée » est le nom géographique usuel de la région.
theological_decisions:
- issue: Rendu du titre βαπτιστής
  choice: Jean le Baptiste
  alternative: Jean celui qui baptise
  rationale: Il s’agit d’un choix lexical plutôt que doctrinal. Le titre traditionnel français est immédiatement identifiable, tandis que l’alternative rend plus explicitement la fonction exprimée par le grec.
translation_notes:
  register: Français moderne, international et digne. La formulation est narrative et accessible. Le deux-points prépare directement le contenu de la proclamation au verset suivant.
