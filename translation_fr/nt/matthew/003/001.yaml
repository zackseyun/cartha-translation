  source_fidelity: 'La formulation « parut et se mit à proclamer » introduit deux nuances absentes du grec : « se mit à » marque explicitement le commencement de l’activité, et la coordination tend à dissocier le participe κηρύσσων du verbe principal. « Vint prêcher » rend de façon idiomatique l’entrée en scène de Jean et son activité de proclamation, sans ajouter cet aspect inchoatif. Le deux-points final ne figure pas dans le grec et laisse le verset français incomplet lorsqu’il est présenté isolément.'
  naturalness: « En ce temps-là » et « Jean le Baptiste » sont naturels en français moderne international. « Vint prêcher » est concis, narratif et digne. La suppression du deux-points donne une phrase complète et autonome.
  terminology: « Jean le Baptiste », « prêcher », « désert » et « Judée » conviennent au sens et au registre. La note doit rester attachée au verbe qu’elle éclaire; l’alternative de titre n’a pas besoin d’être ajoutée à une note ancrée sur le verbe.
