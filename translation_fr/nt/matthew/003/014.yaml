id: MAT.3.14
reference: Matthew 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰωάννης διεκώλυεν αὐτὸν λέγων· Ἐγὼ χρείαν ἔχω ὑπὸ σοῦ βαπτισθῆναι, καὶ σὺ ἔρχῃ πρός με;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/014.yaml
  text: But John kept trying to prevent him[a], saying, “I need to be baptized by you, and do you come to me?”
translation:
  language: fr
  text: 'Mais Jean cherchait à l’en empêcher[a], en disant : « C’est moi qui ai besoin d’être baptisé par toi, et c’est toi qui viens à moi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « essayait de l’en empêcher ». L’imparfait grec peut évoquer une tentative prolongée ou répétée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκώλυεν
  choice: cherchait à l’en empêcher
  rationale: L’imparfait grec présente l’opposition de Jean comme une action en cours ou une tentative persistante. Cette tournure naturelle en français conserve cet aspect sans imposer une répétition explicite.
- source_word: λέγων
  choice: en disant
  rationale: Le participe relie directement les paroles de Jean à sa tentative d’empêcher Jésus.
- source_word: χρείαν ἔχω
  choice: j’ai besoin
  rationale: Cette expression idiomatique signifie simplement « avoir besoin » ; la formulation française est actuelle et précise.
- source_word: ὑπὸ σοῦ
  choice: par toi
  rationale: Avec l’infinitif passif « être baptisé », ὑπό suivi du génitif désigne ici l’agent personnel.
- source_word: βαπτισθῆναι
  choice: être baptisé
  rationale: Cette traduction directe préserve le sens du verbe sans préciser davantage le mode du baptême.
- source_word: καὶ σὺ ἔρχῃ πρός με;
  choice: et c’est toi qui viens à moi ?
  rationale: La construction emphatique rend le contraste marqué par les pronoms grecs ἐγώ et σύ, tout en conservant la question rhétorique au présent.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque le contraste entre la venue de Jésus et la réaction d’opposition de Jean.
theological_decisions:
- issue: L’objection de Jean à baptiser Jésus
  choice: Présenter simplement Jean comme reconnaissant son propre besoin d’être baptisé par Jésus et s’étonnant que Jésus vienne à lui.
  alternative: Expliquer cette objection principalement par l’absence de péché de Jésus ou principalement par une différence de rang et d’autorité.
  rationale: Le verset affirme le besoin de Jean et la supériorité implicite de Jésus, mais n’en donne pas ici toute l’explication théologique. La traduction conserve cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. « C’est moi… et c’est toi… » restitue l’opposition emphatique entre ἐγώ et σύ. Le terme traditionnel et largement compris « baptisé » est conservé.
