  text: ποιήσατε οὖν καρπὸν ἄξιον τῆς μετανοίας
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/008.yaml
  text: Therefore[a], produce fruit worthy of repentance.
translation:
  language: fr
  text: Produisez donc un fruit digne de la repentance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un fruit qui corresponde à la repentance ».
    reason: Alternative lexicale explicitant le sens de convenance exprimé par ἄξιον avec le génitif.
lexical_decisions:
- source_word: ποιήσατε
  choice: Produisez
  rationale: L’impératif aoriste actif, à la deuxième personne du pluriel, appelle à une action résolue. « Produisez » rend directement ποιέω et s’accorde naturellement avec l’image du fruit, sans l’atténuer.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque naturellement en français la conséquence tirée de l’avertissement et de l’exhortation qui précèdent.
- source_word: καρπὸν
  choice: un fruit
  rationale: Le singulier collectif de καρπός est conservé. Le terme désigne métaphoriquement le résultat visible, notamment dans la conduite.
- source_word: ἄξιον
  choice: digne de
  rationale: Avec le génitif, ἄξιος exprime ici une convenance ou une correspondance. « Digne de » en est l’équivalent formel le plus direct, tandis que la note explicite l’autre formulation possible.
- source_word: μετανοίας
  choice: la repentance
  rationale: « Repentance » est un terme français établi qui désigne ici un changement intérieur réel accompagné d’un retournement. Il préserve la portée morale et spirituelle de μετάνοια sans la réduire à un simple changement d’avis.
theological_decisions:
- issue: Sens de καρπὸν ἄξιον τῆς μετανοίας
  choice: Un comportement visible qui convient à une repentance véritable et en constitue le fruit
  alternative: Un fruit qui mérite, obtient ou égale en valeur la repentance
  rationale: La construction exprime la convenance ou la correspondance, non le mérite. Le verset exige les effets visibles de la repentance sans présenter les œuvres comme ce qui l’achète ou la produit.
translation_notes:
  register: Français international moderne, sobre et digne. La structure impérative et le singulier métaphorique sont maintenus; la note préserve la nuance de correspondance sans résoudre excessivement la formulation source.
