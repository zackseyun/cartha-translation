id: MAT.3.16
reference: Matthew 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂βαπτισθεὶς δὲ⸃ ὁ Ἰησοῦς ⸂εὐθὺς ἀνέβη⸃ ἀπὸ τοῦ ὕδατος· καὶ ἰδοὺ ⸀ἠνεῴχθησαν οἱ οὐρανοί, καὶ εἶδεν ⸀πνεῦμα θεοῦ καταβαῖνον ὡσεὶ ⸀περιστερὰν ἐρχόμενον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/003/016.yaml
  text: And when Jesus was baptized[a], he immediately came up from the water. And behold, the heavens were opened[c][b], and he saw the Spirit of God descending like a dove and coming upon him.
translation:
  language: fr
  text: Après avoir été baptisé, Jésus remonta aussitôt de l’eau. Et voici, les cieux s’ouvrirent[a], et il vit l’Esprit de Dieu descendre comme une colombe et venir sur lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les cieux furent ouverts ».'
    reason: La note signale la forme passive du grec, rendue plus naturellement en français par « s’ouvrirent », sans imposer l’identité de l’agent.
  - marker: b
    text: 'Ou : « venir vers lui ». Le grec peut exprimer un mouvement vers Jésus ou sur lui; il dit « venir », non précisément « se poser ».'
    reason: La note préserve la latitude de ἐπί avec l’accusatif et évite de confondre le verbe avec l’interprétation suggérée par l’image de la colombe.
lexical_decisions:
- source_word: βαπτισθεὶς δὲ ὁ Ἰησοῦς
  choice: Après avoir été baptisé, Jésus
  rationale: Le participe aoriste passif exprime ici une action accomplie avant le verbe principal. Cette tournure française conserve le passif et rend clairement la succession immédiate des actions; δέ est porté naturellement par la progression narrative sans conjonction lourde.
- source_word: εὐθὺς ἀνέβη ἀπὸ τοῦ ὕδατος
  choice: remonta aussitôt de l’eau
  rationale: « Aussitôt » restitue εὐθύς. « Remonta de l’eau » traduit ἀναβαίνω avec ἀπό sans renforcer la préposition en « hors de », tout en restant naturel en français.
- source_word: καὶ ἰδοὺ
  choice: Et voici
  rationale: Cette formule actuelle mais digne conserve la fonction de ἰδού, qui attire vivement l’attention sur ce qui suit.
- source_word: ἠνεῴχθησαν οἱ οὐρανοί
  choice: les cieux s’ouvrirent
  rationale: Le pluriel « les cieux » préserve l’expression grecque et sa portée biblique. Le pronominal français rend naturellement l’événement sans préciser un agent que le passif grec ne nomme pas.
- source_word: πνεῦμα θεοῦ
  choice: l’Esprit de Dieu
  rationale: Cette traduction conserve le génitif grec et la référence contextuelle à l’Esprit, sans remplacer l’expression par le titre plus explicite « Saint-Esprit ».
- source_word: καταβαῖνον ὡσεὶ περιστερὰν
  choice: descendre comme une colombe
  rationale: « Comme » conserve la comparaison marquée par ὡσεὶ sans identifier littéralement l’Esprit à une colombe.
- source_word: ἐρχόμενον ἐπ’ αὐτόν
  choice: venir sur lui
  rationale: La formulation reste proche du verbe général ἔρχομαι et de ἐπί; elle évite le verbe plus interprétatif « se poser ».
theological_decisions:
- issue: Identification de πνεῦμα θεοῦ
  choice: l’Esprit de Dieu
  alternative: un esprit de Dieu
  rationale: Le contexte baptismal favorise nettement la référence à l’Esprit de Dieu. La traduction conserve toutefois la formulation exacte du grec plutôt que d’introduire explicitement « le Saint-Esprit ».
- issue: Nature de la comparaison avec la colombe
  choice: descendre comme une colombe
  alternative: descendre sous la forme d’une colombe
  rationale: ὡσεὶ exprime une ressemblance, mais le texte ne précise pas si celle-ci porte sur la manière de descendre ou sur l’apparence. « Comme une colombe » préserve cette ambiguïté.
- issue: Portée de ἐρχόμενον ἐπ’ αὐτόν
  choice: venir sur lui
  alternative: se poser sur lui
  rationale: Le grec parle de venue et ne spécifie pas à lui seul un atterrissage. La formulation retenue évite de tirer de l’image de la colombe un détail que le verbe n’énonce pas.
translation_notes:
  register: Français international moderne, clair et digne. « Et voici » maintient la vivacité narrative biblique sans archaïsme excessif. Les participes grecs sont rendus par des structures françaises fluides, et les ambiguïtés portant sur la comparaison et le mouvement sont conservées.
