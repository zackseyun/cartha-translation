id: MAT.11.27
reference: Matthew 11:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς ἐπιγινώσκει τὸν υἱὸν εἰ μὴ ὁ πατήρ, οὐδὲ τὸν πατέρα τις ἐπιγινώσκει εἰ μὴ ὁ υἱὸς καὶ ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/027.yaml
  text: All things have been handed over to me by my Father[a], and no one knows the Son except the Father[b], nor does anyone know the Father except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: fr
  text: Tout m’a été remis par mon Père, et personne ne connaît[a] le Fils, sinon le Père. Personne non plus ne connaît le Père, sinon le Fils et celui à qui le Fils veut[b] le révéler.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « connaît pleinement » ou « connaît vraiment », ici et dans la proposition suivante. Le verbe grec peut, selon le contexte, évoquer une connaissance pleine ou profonde.
    reason: lexical_alternative
  - marker: b
    text: Ou « choisit de le révéler » ou « décide de le révéler ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντα
  choice: Tout
  rationale: Le neutre pluriel a une portée globale. « Tout » est naturel en français et conserve l’ampleur de l’expression sans préciser indûment son domaine.
- source_word: παρεδόθη
  choice: m’a été remis
  rationale: L’aoriste passif de παραδίδωμι exprime ici un transfert accompli. « A été remis » reste direct et n’ajoute pas explicitement l’idée de mandat que pourrait suggérer « confié ».
- source_word: ἐπιγινώσκει
  choice: connaît
  rationale: Dans ce contexte, le verbe désigne une connaissance personnelle et véritable, mais son préverbe n’impose pas à lui seul un intensif explicite. « Connaît » préserve la sobriété et la réciprocité des deux propositions; une possibilité intensive est signalée en note.
- source_word: εἰ μὴ
  choice: sinon
  rationale: Après une négation, « sinon » exprime clairement l’exclusion et maintient le parallélisme des deux déclarations.
- source_word: βούληται
  choice: veut
  rationale: Le verbe exprime la volonté ou la décision du Fils. « Veut » est direct, actuel et laisse intacte la force volitive sans la réduire à un simple souhait ni la charger d’une terminologie doctrinale.
- source_word: ἀποκαλύψαι
  choice: révéler
  rationale: « Révéler » rend directement l’idée de dévoilement ou de communication divine. Le pronom « le » reprend naturellement « le Père ».
theological_decisions:
- issue: Portée de la connaissance réciproque du Père et du Fils
  choice: « connaît » dans les deux propositions
  alternative: « connaît pleinement » ou « connaît vraiment »
  rationale: Le parallélisme et l’exclusivité expriment déjà le caractère unique de cette connaissance mutuelle. Ne pas ajouter « pleinement » dans le corps du texte évite de transformer une nuance lexicale possible en affirmation explicitement formulée, tout en la conservant en note.
- issue: Initiative du Fils dans la révélation du Père
  choice: « celui à qui le Fils veut le révéler »
  alternative: « celui à qui le Fils choisit de le révéler »
  rationale: « Veut » suit de près βούληται et attribue sans ambiguïté l’initiative révélatrice au Fils, sans préciser davantage le rapport entre volonté, désir et choix.
translation_notes:
  register: Français international moderne, clair et digne. « Père » et « Fils » prennent la majuscule comme titres relationnels dans ce contexte. La répétition de « connaît » et la construction symétrique sont conservées; la seconde phrase allège la longueur sans effacer le parallélisme grec.
