id: MAT.11.18
reference: Matthew 11:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ Ἰωάννης μήτε ἐσθίων μήτε πίνων, καὶ λέγουσιν· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/018.yaml
  text: For John came neither eating nor drinking[a], and they say, ‘He has a demon.’
translation:
  language: fr
  text: 'En effet, Jean est venu sans manger ni boire, et ils disent : « Il a un démon[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il est possédé par un démon. » Littéralement : « Il a un démon. »'
    reason: Alternative lexicale et explicitation de l’idiome grec.
lexical_decisions:
- source_word: ἦλθεν
  choice: est venu
  rationale: L’aoriste de ἔρχομαι évoque ici la venue et l’entrée en scène de Jean. « Est venu » est naturel en français et garde le sens courant du verbe.
- source_word: γὰρ
  choice: En effet
  rationale: γάρ introduit l’explication de l’affirmation précédente. « En effet » exprime clairement ce lien en français moderne.
- source_word: Ἰωάννης
  choice: Jean
  rationale: Forme française traditionnelle et courante du nom Ἰωάννης ; le contexte identifie Jean le Baptiste.
- source_word: μήτε ἐσθίων μήτε πίνων
  choice: sans manger ni boire
  rationale: Cette formulation française naturelle conserve l’expression condensée décrivant le mode de vie ascétique de Jean, sans ajouter le pain ou le vin, absents du texte grec de ce verset.
- source_word: καὶ λέγουσιν
  choice: et ils disent
  rationale: Le présent garde l’effet vif et généralisant de λέγουσιν, tandis que « ils » respecte le sujet implicite sans identifier plus précisément les accusateurs.
- source_word: Δαιμόνιον ἔχει
  choice: Il a un démon
  rationale: Cette traduction suit de près l’expression grecque et demeure claire en français. « Démon » rend δαιμόνιον sans le confondre avec διάβολος, « le diable ».
theological_decisions:
- issue: Formulation de l’accusation liée à δαιμόνιον
  choice: Il a un démon
  alternative: Il est possédé par un démon
  rationale: Le verset rapporte l’accusation portée contre Jean, sans l’affirmer comme vraie. La formulation retenue préserve l’expression grecque et évite de préciser davantage la nature supposée de cette emprise.
translation_notes:
  register: Français international moderne, digne et accessible. « En effet » assure un enchaînement explicatif naturel ; « sans manger ni boire » rend l’ascétisme sous-entendu sans importer les précisions de Luc 7.33.
