id: MAT.11.8
reference: Matthew 11:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν ⸀μαλακοῖς ἠμφιεσμένον; ἰδοὺ οἱ τὰ μαλακὰ φοροῦντες ἐν τοῖς οἴκοις τῶν ⸀βασιλέων ⸀εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/008.yaml
  text: But what did you go out to see? A man dressed in soft clothes? Look[b][a], those who wear soft clothes are in the houses of kings.
translation:
  language: fr
  text: 'Mais qu’êtes-vous allés voir ? Un homme vêtu de vêtements délicats[a] ? Voyez : ceux qui portent des vêtements délicats se trouvent dans les maisons des rois[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vêtu d’habits raffinés ». Le grec parle littéralement de choses ou de vêtements « doux », ce qui évoque ici une tenue délicate ou luxueuse.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les palais royaux ». Le grec dit plus littéralement « dans les maisons des rois ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Introduit naturellement en français le nouveau volet du contraste rhétorique de Jésus.
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: qu’êtes-vous allés voir
  rationale: Rend directement la question et l’expression de but formée par le verbe « sortir/aller » suivi de l’infinitif « voir ».
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Conserve le singulier masculin, approprié puisque la question concerne Jean le Baptiste.
- source_word: ἐν μαλακοῖς ἠμφιεσμένον
  choice: vêtu de vêtements délicats
  rationale: « Vêtu » rend le participe passif, tandis que « délicats » exprime le sens concret de μαλακός (« doux ») et sa connotation contextuelle de finesse et de luxe.
- source_word: ἰδοὺ
  choice: Voici
  rationale: Interjection française actuelle et digne qui attire l’attention sans employer une tournure archaïque.
- source_word: οἱ τὰ μαλακὰ φοροῦντες
  choice: ceux qui portent des vêtements délicats
  rationale: Le présent participial évoque une manière habituelle de s’habiller; la répétition de « vêtements délicats » maintient le lien lexical avec la question précédente.
- source_word: ἐν τοῖς οἴκοις τῶν βασιλέων εἰσίν
  choice: se trouvent dans les demeures des rois
  rationale: « Demeures des rois » reste proche du grec (« maisons des rois ») tout en étant naturel et en laissant le contexte suggérer des palais.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Les questions rhétoriques sont conservées, de même que la répétition du terme grec désignant les vêtements délicats. La formulation évite à la fois l’archaïsme et une explicitation excessive du luxe implicite.
