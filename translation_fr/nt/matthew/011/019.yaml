id: MAT.11.19
reference: Matthew 11:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦλθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγουσιν· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, τελωνῶν φίλος καὶ ἁμαρτωλῶν. καὶ ἐδικαιώθη ἡ σοφία ἀπὸ τῶν ⸀ἔργων αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/019.yaml
  text: The Son of Man came eating and drinking[a], and they say, ‘Look, a glutton and a drunkard[b], a friend of tax collectors and sinners!’ And wisdom was justified by her works.
translation:
  language: fr
  text: 'Le Fils de l’homme est venu en mangeant et en buvant, et ils disent : « Regardez : un glouton et un ivrogne, un ami des collecteurs d’impôts et des pécheurs ! » Et la sagesse a été reconnue comme juste par ses œuvres.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et la sagesse a été justifiée par ses actes. »'
    reason: Alternative lexicale pour ἐδικαιώθη et ἔργων.
  - marker: b
    text: 'Certains manuscrits portent « enfants » au lieu de « œuvres » : « Et la sagesse a été reconnue comme juste par ses enfants. »'
    reason: Variante textuelle ancienne et bien connue, également reflétée dans le parallèle de Luc 7.35.
lexical_decisions:
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Expression française consacrée qui conserve le titre sémitique et sa portée théologique sans l’expliciter.
- source_word: ἐσθίων καὶ πίνων
  choice: en mangeant et en buvant
  rationale: Rend simplement les participes et maintient le contraste contextuel avec l’ascétisme de Jean, sans amplifier en « faisant la fête ».
- source_word: Ἰδοὺ
  choice: Regardez
  rationale: Équivalent moderne et naturel qui conserve la force exclamative de l’accusation publique.
- source_word: φάγος καὶ οἰνοπότης
  choice: un glouton et un ivrogne
  rationale: Ces termes péjoratifs accusent Jésus d’excès ; la traduction préserve nettement leur caractère insultant.
- source_word: τελωνῶν φίλος καὶ ἁμαρτωλῶν
  choice: un ami des collecteurs d’impôts et des pécheurs
  rationale: Conserve la construction et la portée sociale et religieuse des deux catégories désignées.
- source_word: ἐδικαιώθη
  choice: a été reconnue juste
  rationale: Exprime ici l’idée d’être démontrée ou reconnue comme juste, dans un français plus idiomatique que « a été justifiée », tout en conservant le champ sémantique de δικαιόω.
- source_word: ἡ σοφία
  choice: la sagesse
  rationale: Maintient sans explication la personnification féminine présente dans le grec.
- source_word: ἀπὸ τῶν ἔργων αὐτῆς
  choice: d’après ses œuvres
  rationale: Rend ἀπό comme l’indication du fondement probant et suit la leçon ἔργων du SBLGNT ; « œuvres » conserve en outre l’écho lexical biblique.
theological_decisions:
- issue: Identification de « la sagesse »
  choice: Conserver l’expression personnifiée sans identifier explicitement la sagesse à Jésus, au dessein divin ou à une autre réalité.
  alternative: Identifier la sagesse à Jésus lui-même ou à la sagesse salvatrice de Dieu.
  rationale: Le texte ne tranche pas explicitement cette identification ; la formulation préserve donc son ouverture littéraire et théologique.
- issue: Forme textuelle de la proposition finale
  choice: Suivre ἔργων, « œuvres », dans le texte principal.
  alternative: τέκνων, « enfants », attesté dans certains manuscrits et dans le parallèle de Luc 7.35.
  rationale: Le texte source fourni, le SBLGNT, porte ἔργων ; la variante ancienne est néanmoins signalée pour assurer la transparence textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La tournure accusatrice reste vive sans devenir familière. La dernière proposition conserve la personnification de la sagesse et l’ambiguïté théologique du grec.
