id: MAT.11.21
reference: Matthew 11:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ἐγένοντο αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/021.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works done among you had taken place in Tyre and Sidon, they would have repented long ago in sackcloth and ashes.
translation:
  language: fr
  text: « Malheur à toi, Chorazin ! Malheur à toi, Bethsaïda ! Car si les œuvres de puissance[a] accomplies au milieu de vous avaient eu lieu à Tyr et à Sidon, ces villes se seraient repenties depuis longtemps, vêtues de toile de sac et couvertes de cendre. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « miracles » ; le grec désigne des actes de puissance.
    reason: Alternative lexicale pour αἱ δυνάμεις.
lexical_decisions:
- source_word: Οὐαί σοι
  choice: Malheur à toi
  rationale: Cette formule française conserve à la fois la lamentation prophétique et l’annonce du jugement contenues dans οὐαί, tout en maintenant l’adresse directe au singulier.
- source_word: Χοραζίν
  choice: Chorazin
  rationale: Translittération française usuelle du nom de lieu.
- source_word: Βηθσαϊδά
  choice: Bethsaïda
  rationale: Forme française usuelle du nom de lieu.
- source_word: ὅτι
  choice: Car
  rationale: Le mot introduit ici la raison du malheur prononcé sur les deux villes.
- source_word: αἱ δυνάμεις
  choice: les œuvres de puissance
  rationale: Cette expression rend la notion d’actes manifestant une puissance surnaturelle sans réduire d’emblée le terme à la catégorie moderne de « miracles ».
- source_word: ἐγένοντο … αἱ γενόμεναι
  choice: avaient eu lieu … accomplies
  rationale: La variation française évite une répétition lourde tout en conservant le rapport entre les œuvres hypothétiquement survenues à Tyr et Sidon et celles effectivement accomplies au milieu des villes interpellées.
- source_word: ἐν ὑμῖν
  choice: au milieu de vous
  rationale: Le pluriel vise les habitants des villes et indique que les œuvres ont eu lieu parmi eux, non intérieurement en eux.
- source_word: πάλαι ἂν … μετενόησαν
  choice: il y a longtemps qu’elles se seraient repenties
  rationale: La formulation rend naturellement en français l’irréel du passé et l’antériorité marquée par πάλαι, tout en conservant la personnification des villes.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: vêtues de toile de sac et couvertes de cendre
  rationale: Cette formulation intelligible pour un lectorat moderne préserve les signes concrets de deuil et de repentance évoqués par l’expression grecque.
theological_decisions:
- issue: Nature de la comparaison entre les villes de Galilée et Tyr et Sidon
  choice: Conserver comme réel le contraste contrefactuel qui souligne la culpabilité plus grande des villes témoins des œuvres de Jésus.
  alternative: Traiter la comparaison comme une simple hyperbole rhétorique dépourvue de portée comparative réelle.
  rationale: Le texte affirme que Tyr et Sidon se seraient repenties dans les mêmes circonstances. La traduction maintient cette tension et n’ajoute aucune conclusion doctrinale au-delà de l’énoncé.
- issue: Référent implicite du verbe μετενόησαν
  choice: Employer le féminin pluriel « elles » pour renvoyer à Tyr et Sidon personnifiées.
  alternative: Expliciter « leurs habitants se seraient repentis ».
  rationale: Le choix retenu respecte la personnification directe des villes dans le grec, déjà présente dans les apostrophes adressées à Chorazin et Bethsaïda.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation et les formes des noms suivent l’usage français. L’image biblique de la toile de sac et de la cendre est conservée, mais formulée de manière immédiatement compréhensible.
