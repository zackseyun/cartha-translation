revisions:
- from: « Malheur à toi, Chorazin ! Malheur à toi, Bethsaïda ! Car si les œuvres de puissance[a] accomplies au milieu de vous avaient eu lieu à Tyr et à Sidon, il y a longtemps qu’elles se seraient repenties, vêtues de toile de sac et couvertes de cendre. »
  to: « Malheur à toi, Chorazin ! Malheur à toi, Bethsaïda ! Car si les œuvres de puissance[a] accomplies au milieu de vous avaient eu lieu à Tyr et à Sidon, ces villes se seraient repenties depuis longtemps, vêtues de toile de sac et couvertes de cendre. »
  rationale: La seule révision du texte explicite le référent de la repentance afin d’éviter que « elles » ne semble désigner les œuvres. La note est légèrement resserrée pour définir δυνάμεις sans ajouter la nuance non nécessaire de « grande » puissance. L’ambiguïté interprétative du contrefactuel n’est pas résolue au-delà de ce que dit le grec.
