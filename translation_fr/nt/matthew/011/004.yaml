id: MAT.11.4
reference: Matthew 11:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ ἀκούετε καὶ βλέπετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/004.yaml
  text: And Jesus answered them[a], “Go and report to John what you hear and see:”
translation:
  language: fr
  text: 'Jésus leur répondit[a] : « Allez rapporter à Jean ce que vous entendez et voyez : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Jésus leur répondit en disant ».'
    reason: Alternative lexicale reflétant la formule grecque complète ἀποκριθεὶς ... εἶπεν.
lexical_decisions:
- source_word: καὶ
  choice: omis explicitement
  rationale: Le lien narratif est suffisamment porté en français par la succession du récit ; commencer par « Et » serait possible, mais moins naturel ici.
- source_word: ἀποκριθεὶς ... εἶπεν αὐτοῖς
  choice: leur répondit
  rationale: La formule narrative grecque « ayant répondu, il leur dit » est rendue par une expression française idiomatique qui conserve à la fois l'idée de réponse et les destinataires.
- source_word: Πορευθέντες
  choice: Allez
  rationale: Le participe a ici une valeur associée à l'impératif suivant ; « Allez rapporter » restitue naturellement la force du commandement et la séquence de l'action.
- source_word: ἀπαγγείλατε
  choice: rapporter
  rationale: Le verbe désigne le fait de transmettre un compte rendu à Jean ; « rapporter » est précis et naturel dans ce contexte.
- source_word: Ἰωάννῃ
  choice: à Jean
  rationale: Le datif marque le destinataire du message.
- source_word: ἃ ἀκούετε καὶ βλέπετε
  choice: ce que vous entendez et voyez
  rationale: Cette formulation conserve le parallélisme des deux présents et l'expérience directe des messagers.
theological_decisions:
- issue: Formule narrative ἀποκριθεὶς ... εἶπεν
  choice: Jésus leur répondit
  alternative: Jésus leur répondit en disant
  rationale: Il s'agit d'une décision stylistique sans incidence doctrinale. La formulation retenue est naturelle en français et ne perd aucun contenu pertinent.
translation_notes:
  register: Français international moderne, simple et digne. « Allez rapporter » est courant sans être familier ; la ponctuation finale conserve les deux-points qui introduisent la suite de la réponse au verset suivant.
