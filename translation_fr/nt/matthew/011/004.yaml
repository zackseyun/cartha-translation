  source_fidelity: Le texte rend fidèlement la formule narrative ἀποκριθεὶς ... εἶπεν αὐτοῖς par « Jésus leur répondit », sans perdre sa fonction discursive. « Allez rapporter à Jean » restitue adéquatement le participe à valeur impérative Πορευθέντες suivi de ἀπαγγείλατε. « Ce que vous entendez et voyez » préserve le relatif neutre pluriel et le parallélisme des présents.
  naturalness: 'Le français est moderne, clair et digne. « Allez rapporter à Jean » est naturel dans ce contexte et conserve utilement l’idée de se rendre auprès de Jean puis de lui faire un compte rendu. Les deux-points finaux sont justifiés : ils introduisent la suite directe de la réponse au verset suivant.'
  terminology: 'Les noms et termes sont cohérents : « Jésus » et « Jean » sont les formes françaises usuelles. « Rapporter » convient bien à ἀπαγγέλλω dans le cadre d’un message transmis en retour. La note exprime correctement, sans surcharge doctrinale, l’alternative plus proche de la double formule verbale grecque.'
