id: MAT.11.7
reference: Matthew 11:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τούτων δὲ πορευομένων ἤρξατο ὁ Ἰησοῦς λέγειν τοῖς ὄχλοις περὶ Ἰωάννου· Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/007.yaml
  text: 'As these men were going away[b][a], Jesus began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed being shaken by the wind?”'
translation:
  language: fr
  text: 'Tandis qu’ils s’en allaient, Jésus se mit à parler de Jean aux foules : « Qu’êtes-vous allés voir[a] dans le désert ? Un roseau agité par le vent[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’êtes-vous allés regarder dans le désert ? »'
    reason: lexical_alternative
  - marker: b
    text: L’image d’un roseau agité par le vent peut évoquer l’instabilité ou l’irrésolution. La question de Jésus appelle une réponse négative au sujet de Jean.
    reason: cultural_note
lexical_decisions:
- source_word: Τούτων δὲ πορευομένων
  choice: Tandis qu’ils s’en allaient
  rationale: Le génitif absolu exprime une action simultanée. Le pronom renvoie naturellement, dans le contexte immédiat, aux disciples de Jean, sans qu’il soit nécessaire d’ajouter leur identification dans le verset.
- source_word: ἤρξατο ... λέγειν
  choice: se mit à parler
  rationale: Cette tournure française naturelle rend la construction « commencer à dire/parler » et introduit bien un discours adressé aux foules.
- source_word: τοῖς ὄχλοις
  choice: aux foules
  rationale: Le pluriel grec est conservé; « foules » est courant et plus actuel que « multitudes ».
- source_word: περὶ Ἰωάννου
  choice: de Jean
  rationale: Avec le verbe « parler », « parler de Jean » exprime naturellement le thème indiqué par περί avec le génitif.
- source_word: Τί ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι;
  choice: Qu’êtes-vous allés voir dans le désert ?
  rationale: τί est compris comme « quoi ? » plutôt que « pourquoi ? ». « Aller voir » est idiomatique et rend l’idée d’un déplacement entrepris afin d’observer quelque chose.
- source_word: κάλαμον
  choice: un roseau
  rationale: « Roseau » est l’équivalent français direct et conserve l’image concrète au singulier.
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: agité par le vent
  rationale: Le participe passif est rendu avec naturel tout en préservant l’idée d’un mouvement provoqué par le vent.
theological_decisions:
- issue: Référent de Τούτων (« ceux-ci »)
  choice: Le rendre par « ils » dans la proposition « Tandis qu’ils s’en allaient »
  alternative: Expliciter « les disciples de Jean » ou « ces hommes »
  rationale: Le contexte immédiat identifie les personnes concernées. Le pronom français maintient la cohésion narrative sans ajouter au texte une désignation explicite absente de ce verset.
- issue: Portée de l’image du roseau agité par le vent
  choice: Conserver l’image sous forme de question, sans en intégrer l’interprétation dans le texte
  alternative: Paraphraser l’image comme une accusation d’instabilité ou d’irrésolution
  rationale: La formulation imagée et sa force rhétorique doivent rester intactes; la suggestion d’instabilité peut être signalée en note sans être imposée dans la traduction.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du mouvement du grec, tandis que « se mit à parler » et « êtes-vous allés voir » évitent une formulation inutilement littérale.
