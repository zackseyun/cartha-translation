  text: ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/026.yaml
  text: Yes[a], Father, because this was pleasing in your sight.
translation:
  language: fr
  text: Oui, Père, car tu as trouvé bon qu’il en soit ainsi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car tel a été ton bon plaisir » ; ou : « car cela a été agréable à tes yeux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναί
  choice: Oui
  rationale: Exprime directement l’assentiment dans le contexte de cette prière.
- source_word: ὁ πατήρ
  choice: Père
  rationale: Le nominatif avec article a ici valeur d’interpellation; « Père » est naturel, digne et actuel.
- source_word: ὅτι
  choice: car
  rationale: Introduit le fondement de l’assentiment; « car » convient naturellement à cette brève parole de prière.
- source_word: οὕτως
  choice: ainsi
  rationale: Renvoie à la manière d’agir du Père décrite au verset précédent.
- source_word: εὐδοκία ἐγένετο
  choice: tu l’as voulu
  rationale: Rend idiomatiquement l’idée de ce qui a été agréable au Père, sans imposer à « volonté » un sens technique de décret.
- source_word: ἔμπροσθέν σου
  choice: implicite dans « tu l’as voulu »
  rationale: La tournure française personnelle exprime naturellement ce qui a trouvé l’agrément du Père; les formulations plus littérales sont conservées en note.
theological_decisions:
- issue: Faut-il rendre εὐδοκία comme un dessein ou comme le bon plaisir et l’agrément du Père?
  choice: « tu l’as voulu ainsi »
  alternative: « tel a été ton bon plaisir »; « cela a été agréable à tes yeux »
  rationale: La formulation principale est naturelle en français et garde l’idée d’un vouloir auquel le Père prend plaisir, sans préciser s’il s’agit d’un décret, d’un dessein technique ou d’une simple approbation. La note préserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, simple et digne. La formulation évite l’archaïsme de « ô Père » et place le marqueur de note immédiatement après la proposition concernée.
