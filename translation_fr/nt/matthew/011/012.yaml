  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπὸ δὲ τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ ἕως ἄρτι ἡ βασιλεία τῶν οὐρανῶν βιάζεται, καὶ βιασταὶ ἁρπάζουσιν αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/012.yaml
  text: But from the days of John the Baptist until now[a], the kingdom of heaven suffers violence, and violent men seize it.
translation:
  language: fr
  text: Mais depuis les jours de Jean le Baptiste jusqu’à maintenant, le royaume des cieux subit la violence, et des hommes violents le saisissent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le royaume des cieux progresse avec force, et des hommes violents le saisissent ». Le verbe grec traduit par « subit la violence » peut aussi être compris dans un sens moyen ou intransitif.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ δὲ
  choice: Mais depuis
  rationale: ἀπό indique le point de départ temporel, tandis que δέ marque ici une transition légèrement adversative. « Mais depuis » conserve ce mouvement du discours sans accentuer excessivement l’opposition.
- source_word: τῶν ἡμερῶν Ἰωάννου τοῦ βαπτιστοῦ
  choice: les jours de Jean le Baptiste
  rationale: Cette formulation préserve l’expression temporelle grecque et reste naturelle dans un registre biblique moderne et digne.
- source_word: ἕως ἄρτι
  choice: jusqu’à maintenant
  rationale: Rendu français courant qui exprime la continuité entre l’époque de Jean et le moment où Jésus parle.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Expression caractéristique de Matthieu et formulation française traditionnelle, claire et fidèle au pluriel οὐρανῶν.
- source_word: βιάζεται
  choice: subit la violence
  rationale: Le verbe peut être compris au passif (« subit la violence ») ou dans un sens moyen/intransitif (« progresse avec force »). Le passif s’accorde naturellement avec la proposition suivante, sans éliminer l’autre lecture, signalée en note.
- source_word: βιασταὶ
  choice: des hommes violents
  rationale: Le nom désigne des personnes qui recourent à la force ou à la violence. « Hommes » reflète le masculin pluriel grec, et « violents » maintient le lien lexical avec βιάζεται.
- source_word: ἁρπάζουσιν αὐτήν
  choice: s’en emparent
  rationale: ἁρπάζω exprime une prise énergique ou violente. « S’en emparent » est naturel en français et conserve l’idée de saisie par la force; le pronom « en » renvoie idiomatiquement au royaume.
theological_decisions:
- issue: Sens de βιάζεται appliqué au royaume des cieux
  choice: 'Lecture passive dans le texte principal : « le royaume des cieux subit la violence »'
  alternative: 'Lecture moyenne ou intransitive : « le royaume des cieux progresse avec force »'
  rationale: La construction grecque est réellement ambiguë. La lecture passive correspond bien aux « hommes violents » qui s’emparent du royaume dans la proposition suivante, mais la lecture moyenne ou intransitive possède aussi un appui lexical sérieux. La note conserve cette tension interprétative.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’expression matthéenne « royaume des cieux », le lien lexical autour de la violence et l’ambiguïté reconnue du verbe βιάζεται grâce à une note.
