id: MAT.11.25
reference: Matthew 11:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ⸀ἔκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/025.yaml
  text: At that time Jesus answered and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding[b], and revealed them to little children.”
translation:
  language: fr
  text: 'En ce temps-là, Jésus prit la parole et dit : « Je te loue[a], Père, Seigneur du ciel et de la terre, parce que tu as caché ces choses aux sages et aux gens intelligents, et que tu les as révélées aux tout-petits[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je te remercie ». Le verbe grec peut exprimer l’action de grâce aussi bien que la louange ou une reconnaissance déclarée.
    reason: lexical_alternative
  - marker: b
    text: Ou « aux nourrissons ». Ici, le terme évoque probablement, de manière imagée, ceux qui reçoivent avec simplicité ce que Dieu révèle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: En ce temps-là
  rationale: Expression temporelle française naturelle qui conserve le cadre narratif sans imposer l’idée d’un instant précis.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: prit la parole et dit
  rationale: Cette tournure française rend naturellement la formule narrative grecque, même en l’absence de question explicite, tout en conservant l’idée d’une prise de parole en réponse à la situation.
- source_word: Ἐξομολογοῦμαί σοι
  choice: Je te loue
  rationale: Dans cette adresse au Père, le verbe exprime une reconnaissance déclarée, teintée de louange et d’action de grâce. « Je te loue » convient au ton doxologique sans suggérer un aveu de faute.
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: Père, Seigneur du ciel et de la terre
  rationale: La double apostrophe est conservée directement, ainsi que l’affirmation de la souveraineté divine.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction présente ici le motif de la louange; « parce que » en exprime clairement la valeur causale.
- source_word: ἔκρυψας
  choice: tu as caché
  rationale: Rendu direct de l’aoriste actif, qui maintient le Père comme agent sans atténuation interprétative.
- source_word: ταῦτα ... αὐτά
  choice: ces choses ... les
  rationale: Cette formulation garde ouverte la référence exacte de « ces choses », comme dans le grec.
- source_word: ἀπὸ σοφῶν καὶ συνετῶν
  choice: aux sages et aux gens intelligents
  rationale: La paire conserve la distinction entre sagesse et intelligence tout en restant naturelle en français moderne.
- source_word: ἀπεκάλυψας
  choice: tu les as révélées
  rationale: « Révéler » est le correspondant français direct et usuel, qui préserve la portée théologique de la communication divine.
- source_word: νηπίοις
  choice: aux tout-petits
  rationale: Le terme peut désigner littéralement de très jeunes enfants, mais porte ici vraisemblablement une valeur métaphorique. « Tout-petits » conserve l’image sans la remplacer par une interprétation abstraite comme « les humbles ».
theological_decisions:
- issue: Action divine de cacher et de révéler
  choice: 'Conserver l’attribution directe au Père : « tu as caché ... tu les as révélées »'
  alternative: Atténuer en disant, par exemple, « tu as laissé ces choses cachées »
  rationale: Les deux verbes grecs sont actifs et ont Dieu pour sujet. La traduction préserve cette tension théologique sans l’expliquer par une doctrine particulière.
- issue: Portée de νηπίοις
  choice: Conserver l’image avec « aux tout-petits »
  alternative: Traduire strictement par « aux nourrissons » ou interpréter par « aux humbles »
  rationale: Le contexte suggère un emploi métaphorique, mais la traduction ne doit ni effacer l’image enfantine ni en fixer exclusivement l’interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. « Prit la parole et dit » évite le tour peu naturel « répondit et dit » tout en conservant la fonction discursive de la formule grecque. « Tout-petits » maintient l’image concrète et le contraste rhétorique avec les sages et les gens intelligents.
