  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/015.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: fr
  text: Que celui qui a des oreilles[a] entende !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que quiconque a des oreilles entende ! » Le grec emploie une expression générique au singulier.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: celui qui a
  rationale: L’article suivi du participe présent forme une expression substantivée et générique. « Celui qui a » conserve le singulier représentatif du grec dans un français naturel et digne.
- source_word: ὦτα
  choice: des oreilles
  rationale: Le nom grec est au pluriel. En français, « avoir des oreilles » rend naturellement cette forme et l’appel imagé à une écoute attentive.
- source_word: ἀκουέτω
  choice: entende
  rationale: Le présent impératif à la troisième personne est bien rendu par le subjonctif dans la tournure injonctive « que… entende ». « Entendre » préserve l’expression biblique et peut inclure l’idée d’accueillir et de prendre en compte ce qui est dit.
theological_decisions:
- issue: Expression générique au masculin singulier
  choice: Que celui qui a des oreilles entende !
  alternative: Que quiconque a des oreilles entende !
  rationale: Le grec emploie une construction générique au masculin singulier. La traduction choisie en conserve la forme représentative sans limiter le propos aux hommes.
translation_notes:
  register: Français international moderne, concis et solennel. La tournure injonctive avec « que » est idiomatique et conserve la force de l’impératif grec.
