source:
  edition: SBLGNT
  text: καὶ εἰ θέλετε δέξασθαι, αὐτός ἐστιν Ἠλίας ὁ μέλλων ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/014.yaml
  text: And if you are willing to accept it[b][a], he is Elijah who is to come.
translation:
  language: fr
  text: Et, si vous voulez bien l’accepter[a], c’est lui qui est l’Élie qui doit venir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si vous voulez bien accueillir cette parole ».'
    reason: Alternative lexicale explicitant l’objet implicite de δέξασθαι.
  - marker: b
    text: Jésus identifie ici Jean le Baptiste à l’Élie attendu. Comparer Malachie 3.23 et Matthieu 17.10-13.
    reason: Renvoi permettant de situer l’attente prophétique et son interprétation dans Matthieu, sans la résoudre dans le corps du texte.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve simplement le lien avec ce qui précède, sans préciser davantage la relation logique.
- source_word: εἰ θέλετε δέξασθαι
  choice: si vous voulez bien l’accepter
  rationale: « Vouloir bien » exprime ici la disposition à accueillir ou accepter l’affirmation de Jésus. Le pronom « l’ » restitue naturellement en français l’objet implicite de δέξασθαι.
- source_word: αὐτός
  choice: c’est lui
  rationale: Renvoie à Jean le Baptiste et rend l’insistance possible de αὐτός plus clairement qu’un simple « il ».
- source_word: ἐστιν Ἠλίας
  choice: Élie
  rationale: Conserve l’identification directe formulée par le grec, sans la réduire à une simple ressemblance ou à une fonction analogue.
- source_word: ὁ μέλλων ἔρχεσθαι
  choice: qui doit venir
  rationale: Rend l’attente future portée par μέλλω et la formulation prophétique, sans suggérer artificiellement une venue immédiatement imminente.
theological_decisions:
- issue: Identification de Jean le Baptiste à Élie
  choice: « c’est lui, Élie qui doit venir »
  alternative: « il remplit le rôle d’Élie » ou « il est comme Élie »
  rationale: Le grec affirme directement l’identification tout en la faisant précéder d’un appel conditionnel à l’accueil des auditeurs. La traduction maintient cette force et cette tension sans expliquer à la place du texte la nature exacte de l’identification.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « voulez bien » indique une disposition à accepter plutôt qu’un simple désir. « C’est lui » garde une légère emphase naturelle. La numérotation de Malachie suit l’usage français courant, où Malachie 4.5 dans certaines traditions correspond à Malachie 3.23.
