id: MAT.11.1
reference: Matthew 11:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς διατάσσων τοῖς δώδεκα μαθηταῖς αὐτοῦ, μετέβη ἐκεῖθεν τοῦ διδάσκειν καὶ κηρύσσειν ἐν ταῖς πόλεσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/001.yaml
  text: And when Jesus had finished instructing his twelve disciples[b][a], he went on from there to teach and preach in their cities.
translation:
  language: fr
  text: Quand Jésus eut fini de donner ses instructions[a] à ses douze disciples, il partit de là pour enseigner et proclamer dans leurs villes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de donner ses ordres ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression grecque traduite par « leurs villes » est ambiguë : elle peut désigner les villes des disciples ou, plus généralement, celles des habitants de la région.'
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Quand
  rationale: Cette formule narrative d’allure sémitique introduit ici une circonstance temporelle et une transition. « Quand » en rend naturellement la fonction en français moderne sans alourdir la phrase par un littéral « Et il arriva que ».
- source_word: ἐτέλεσεν
  choice: eut fini
  rationale: Le passé antérieur marque clairement, dans une narration au passé, que l’achèvement des instructions précède le départ de Jésus.
- source_word: διατάσσων
  choice: de donner ses instructions
  rationale: Le participe désigne des directives données avec autorité. « Donner ses instructions » convient au contexte d’envoi des Douze, tandis que la nuance plus forte de commandement est signalée en note.
- source_word: τοῖς δώδεκα μαθηταῖς αὐτοῦ
  choice: à ses douze disciples
  rationale: Formulation française naturelle qui conserve explicitement le nombre et le terme traditionnel et exact « disciples ».
- source_word: μετέβη ἐκεῖθεν
  choice: il partit de là
  rationale: Cette expression rend le déplacement depuis le lieu précédent et assure une progression narrative fluide.
- source_word: τοῦ διδάσκειν καὶ κηρύσσειν
  choice: pour enseigner et proclamer
  rationale: L’infinitif articulé exprime ici le but. Les deux verbes distincts sont conservés; « proclamer » restitue la dimension d’annonce publique de κηρύσσειν.
- source_word: ἐν ταῖς πόλεσιν αὐτῶν
  choice: dans leurs villes
  rationale: La formulation suit le grec sans préciser le référent de « leurs ». « Villes » est l’équivalent direct de πόλεις, qui peut aussi désigner des localités de taille modeste.
theological_decisions:
- issue: Référent de αὐτῶν dans ἐν ταῖς πόλεσιν αὐτῶν
  choice: Conserver l’expression ambiguë « leurs villes ».
  alternative: Préciser « les villes des disciples », « les villes des Juifs » ou « les villes de la région ».
  rationale: Le pronom grec n’identifie pas explicitement son référent. La traduction ne tranche donc pas une question que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase évite le calque lourd de la formule narrative grecque, tout en conservant la succession des actions, l’autorité des instructions et l’ambiguïté du pronom final.
