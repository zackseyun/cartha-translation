  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀λέγουσιν· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκόψασθε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/017.yaml
  text: They say[a], ‘We played the flute for you, and you did not dance; we sang a lament[c][b], and you did not mourn.’
translation:
  language: fr
  text: 'Ils disent : « Nous avons joué de la flûte pour vous[a], et vous n’avez pas dansé ; nous avons entonné une lamentation[b], et vous ne vous êtes pas lamentés[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous avons joué de la flûte pour vous ». Le verbe grec désigne le fait de jouer d’une flûte ou d’un instrument apparenté.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous avons entonné un chant funèbre » ou « nous nous sommes lamentés ».
    reason: lexical_alternative
  - marker: c
    text: Plus littéralement, « vous ne vous êtes pas frappés », allusion aux gestes traditionnels du deuil, comme se frapper la poitrine.
    reason: cultural_note
lexical_decisions:
- source_word: λέγουσιν
  choice: Ils disent
  rationale: Le présent grec donne vie à la plainte des enfants dans la scène illustrée ; le présent français en conserve naturellement la force.
- source_word: Ηὐλήσαμεν
  choice: Nous avons joué de la flûte
  rationale: Le verbe αὐλέω désigne précisément le fait de jouer de la flûte ou du chalumeau. Cette formulation est claire en français moderne et conserve la référence à l’instrument.
- source_word: ὑμῖν
  choice: pour vous
  rationale: Dans ce contexte, « pour vous » exprime naturellement une musique jouée à l’intention des autres enfants.
- source_word: ὠρχήσασθε
  choice: vous n’avez pas dansé
  rationale: Le moyen grec se rend ici naturellement par le verbe simple « danser », sans qu’il soit nécessaire d’ajouter une nuance réfléchie.
- source_word: ἐθρηνήσαμεν
  choice: nous avons chanté une lamentation
  rationale: Le verbe θρηνέω évoque une lamentation, souvent funèbre. La formulation retenue préserve le parallélisme avec le jeu de la flûte et le caractère performatif de la scène.
- source_word: ἐκόψασθε
  choice: vous ne vous êtes pas lamentés
  rationale: Dans ce contexte, κόπτω au moyen désigne le comportement de deuil, qui pouvait notamment consister à se frapper la poitrine. La traduction exprime le sens en français naturel, tandis que la note conserve le geste concret.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation conserve les deux volets parallèles de la plainte enfantine. « Lamentation » maintient la tonalité funèbre sans imposer une interprétation confessionnelle.
