id: MAT.11.2
reference: Matthew 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰωάννης ἀκούσας ἐν τῷ δεσμωτηρίῳ τὰ ἔργα τοῦ χριστοῦ πέμψας ⸀διὰ τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/002.yaml
  text: When John heard in prison about the works of the Messiah[a], he sent word through his disciples
translation:
  language: fr
  text: Alors que Jean était en prison, il entendit parler des œuvres du Messie[a] et fit porter un message par l’intermédiaire de ses disciples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des œuvres du Christ ».
    reason: Traduction traditionnelle possible de Χριστός.
lexical_decisions:
- source_word: δὲ
  choice: non traduit explicitement
  rationale: La particule marque ici une transition narrative légère. Le français n’exige pas de connecteur explicite, et « alors » risquerait de renforcer indûment la succession temporelle.
- source_word: ἀκούσας
  choice: Quand Jean entendit parler
  rationale: Le participe aoriste exprime une action antérieure ou circonstancielle; une proposition temporelle est naturelle en français. « Entendre parler de » convient au complément désignant les œuvres.
- source_word: ἐν τῷ δεσμωτηρίῳ
  choice: en prison
  rationale: Formulation française idiomatique qui conserve clairement la situation de Jean.
- source_word: τὰ ἔργα
  choice: les œuvres
  rationale: « Œuvres » préserve la portée large du terme, qui peut englober les actes puissants et l’ensemble de l’activité du Messie.
- source_word: τοῦ χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme un titre; « Messie » en restitue le sens dans son contexte juif, tandis que « Christ » est signalé en note.
- source_word: πέμψας
  choice: il lui envoya un message
  rationale: Le contenu du message apparaît au verset suivant. L’ajout du pronom « lui », compris à partir du contexte immédiat, rend la phrase française complète sans identifier ici le destinataire par son nom.
- source_word: διὰ τῶν μαθητῶν αὐτοῦ
  choice: par l’intermédiaire de ses disciples
  rationale: διά avec le génitif exprime l’intermédiaire ou l’agent; cette formulation française rend ce rapport sans laisser croire que les disciples sont simplement l’objet du verbe « envoyer ».
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le mot est employé comme titre et désigne l’Oint attendu. « Messie » en rend directement le sens; la forme traditionnelle « Christ » demeure proposée en note afin de préserver l’alternative familière.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation encadre « en prison » afin d’éviter que cette indication soit comprise comme le lieu où Jean aurait entendu parler des œuvres. La formulation maintient « œuvres », terme à la fois concret et théologiquement ouvert.
