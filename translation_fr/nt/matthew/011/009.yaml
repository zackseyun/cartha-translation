id: MAT.11.9
reference: Matthew 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τί ἐξήλθατε⸂; προφήτην ἰδεῖν⸃; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/009.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: fr
  text: Mais qu’êtes-vous allés voir ? Un prophète ? Oui, je vous le dis, et même plus qu’un prophète.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelqu’un de plus grand qu’un prophète ». Le grec dit plus littéralement « plus qu’un prophète ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste avec les questions rhétoriques précédentes, de façon naturelle en français.
- source_word: τί ἐξήλθατε … ἰδεῖν
  choice: qu’êtes-vous allés voir ?
  rationale: Rend τί comme l’objet de ἰδεῖν et l’infinitif comme l’objectif de la sortie, sans transformer la question en « pourquoi ».
- source_word: προφήτην
  choice: un prophète
  rationale: Le singulier sans article se rend naturellement ici par l’indéfini français.
- source_word: ναί, λέγω ὑμῖν
  choice: Oui, je vous le dis
  rationale: Reproduit l’affirmation directe et la formule solennelle dans un français moderne et courant.
- source_word: καὶ περισσότερον προφήτου
  choice: et même plus qu’un prophète
  rationale: Préserve la comparaison littérale et concise du grec; « même » exprime naturellement la valeur intensive de καί dans ce contexte.
theological_decisions:
- issue: Identité et statut de Jean-Baptiste dans la parole de Jésus
  choice: plus qu’un prophète
  alternative: quelqu’un de plus grand qu’un prophète
  rationale: La formulation retenue élève Jean au-delà de la catégorie de prophète sans préciser de quelle manière ni ajouter un sujet explicite absent du grec.
translation_notes:
  register: Français international moderne, clair et digne. La tournure interrogative reste vive et orale, tandis que « je vous le dis » conserve la solennité de la déclaration.
