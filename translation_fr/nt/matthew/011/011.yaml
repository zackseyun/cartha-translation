reference: Matthew 11:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, οὐκ ἐγήγερται ἐν γεννητοῖς γυναικῶν μείζων Ἰωάννου τοῦ βαπτιστοῦ· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τῶν οὐρανῶν μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/011.yaml
  text: Truly I say to you[a], among those born of women no one greater than John the Baptist has arisen[c][b]; yet the least in the kingdom of heaven is greater than he.
translation:
  language: fr
  text: 'En vérité, je vous le dis : parmi ceux qui sont nés d’une femme[b], il ne s’est levé[a] personne de plus grand que Jean le Baptiste ; pourtant, le plus petit[c] dans le royaume des cieux est plus grand que lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’a été suscité ». Le verbe grec peut signifier « se lever » ou « être suscité » ; ici, il évoque vraisemblablement l’apparition d’une personne dans l’histoire plutôt qu’une résurrection.
    reason: lexical_alternative
  - marker: b
    text: « Ceux qui sont nés d’une femme » est une expression sémitique qui désigne les êtres humains.
    reason: cultural_note
  - marker: c
    text: Littéralement « le moins grand » ou « le plus petit ». Le grec emploie une forme comparative qui peut désigner ici celui qui a le rang ou le statut le moins élevé dans le royaume des cieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: En vérité, je vous le dis
  rationale: Formule solennelle et autoritative, rendue dans un français actuel et digne tout en gardant sa forme reconnaissable.
- source_word: οὐκ ἐγήγερται
  choice: ne s’est levé
  rationale: Le parfait exprime qu’aucun personnage supérieur à Jean n’est apparu jusqu’ici. « S’est levé » conserve l’image grecque et n’impose pas une lecture de résurrection.
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: parmi ceux qui sont nés d’une femme
  rationale: Rendu proche de l’expression sémitique désignant les êtres humains, sans la remplacer par une paraphrase interprétative.
- source_word: μείζων Ἰωάννου τοῦ βαπτιστοῦ
  choice: personne de plus grand que Jean le Baptiste
  rationale: Le français explicite naturellement « personne » tout en conservant la comparaison du grec.
- source_word: τοῦ βαπτιστοῦ
  choice: le Baptiste
  rationale: Désignation française traditionnelle, claire et immédiatement reconnaissable de Jean.
- source_word: ὁ δὲ μικρότερος
  choice: pourtant, le plus petit
  rationale: Bien que μικρότερος soit comparatif dans sa forme, l’expression désigne naturellement celui qui occupe le rang le moins élevé. « Pourtant » marque le contraste paradoxal.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: dans le royaume des cieux
  rationale: Expression matthéenne standard en français, qui respecte le pluriel du grec sans manquer de naturel.
- source_word: μείζων αὐτοῦ ἐστιν
  choice: est plus grand que lui
  rationale: Rendu direct qui préserve la comparaison sans préciser en quel sens le membre du royaume est plus grand.
theological_decisions:
- issue: La grandeur de Jean par rapport au plus petit dans le royaume
  choice: Conserver telle quelle la comparaison paradoxale, sans expliquer la nature de cette grandeur.
  alternative: Préciser qu’il s’agit d’un rang dans l’histoire du salut, d’un privilège de la nouvelle alliance ou de la sainteté personnelle.
  rationale: Le verset ne donne pas lui-même la clé théologique de la comparaison ; l’expliciter dans la traduction résoudrait indûment sa tension.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La formulation garde la texture biblique de « nés d’une femme », « s’est levé » et « royaume des cieux », tout en restant intelligible à la lecture courante.
