id: MAT.11.10
reference: Matthew 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀οὗτός ἐστιν περὶ οὗ γέγραπται· Ἰδοὺ ἐγὼ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/010.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face, who will prepare your way before you.’'
translation:
  language: fr
  text: 'C’est celui à propos duquel il est écrit : « Voici, moi, j’envoie mon messager devant toi ; il préparera ton chemin devant toi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ
  choice: C’est à son sujet
  rationale: Cette tournure française naturelle conserve l’identification emphatique du démonstratif et le sens de περί avec le génitif, sans introduire le mot interprétatif « homme ».
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule consacrée pour introduire une citation de l’Écriture ; elle rend la valeur résultative du parfait passif dans un français digne et courant.
- source_word: Ἰδοὺ ἐγώ
  choice: Voici, moi
  rationale: « Voici » maintient le registre prophétique, tandis que « moi » rend le pronom sujet explicite et emphatique ἐγώ.
- source_word: ἀποστέλλω
  choice: j’envoie
  rationale: Le présent français convient à la déclaration vive de la citation et peut porter, comme le grec, une portée imminente ou future.
- source_word: ἄγγελόν
  choice: messager
  rationale: ἄγγελος désigne ici celui qui est envoyé pour préparer la voie ; « messager » préserve ce sens sans suggérer nécessairement un être céleste.
- source_word: πρὸ προσώπου σου
  choice: devant ta face
  rationale: Rendu concret et volontairement marqué de l’expression grecque, il préserve la texture de la citation scripturaire plutôt que de la confondre avec le second « devant toi ».
- source_word: κατασκευάσει
  choice: il préparera
  rationale: Le futur et l’idée de rendre prêt sont rendus directement et naturellement.
- source_word: τὴν ὁδόν σου
  choice: ton chemin
  rationale: « Chemin » conserve à la fois l’image concrète de la route et sa portée figurée.
- source_word: ἔμπροσθέν σου
  choice: devant toi
  rationale: Équivalent français naturel qui maintient la seconde expression spatiale du texte grec.
theological_decisions:
- issue: Maintien des deux expressions spatiales de la citation
  choice: Conserver « devant ta face » puis « devant toi »
  alternative: Uniformiser ou condenser en « devant toi » / « en avant de toi »
  rationale: Le grec emploie successivement πρὸ προσώπου σου et ἔμπροσθέν σου. Les garder distincts respecte la forme emphatique de la citation et évite d’effacer son langage concret.
translation_notes:
  register: Français moderne, clair et digne, avec une légère élévation de registre propre à la citation prophétique. « Devant ta face » est intentionnellement plus marqué que l’usage courant ; la note propose l’équivalent idiomatique.
