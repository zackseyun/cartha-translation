id: MAT.11.29
reference: Matthew 11:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς καὶ μάθετε ἀπ’ ἐμοῦ, ὅτι πραΰς εἰμι καὶ ταπεινὸς τῇ καρδίᾳ, καὶ εὑρήσετε ἀνάπαυσιν ταῖς ψυχαῖς ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/029.yaml
  text: Take my yoke upon you and learn from me[a], because I am gentle and humble in heart, and you will find rest for your souls.
translation:
  language: fr
  text: Prenez sur vous mon joug et apprenez de moi, car je suis doux et humble de cœur, et vous trouverez du repos pour vos âmes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour vous-mêmes » ; le mot grec peut désigner la personne dans sa profondeur, sa vie intérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρατε τὸν ζυγόν μου ἐφ’ ὑμᾶς
  choice: Prenez sur vous mon joug
  rationale: Cette formulation conserve l’image concrète du joug et exprime naturellement en français le fait de l’accepter et de s’y soumettre.
- source_word: μάθετε ἀπ’ ἐμοῦ
  choice: apprenez de moi
  rationale: Traduction directe qui peut évoquer à la fois l’enseignement reçu de Jésus et l’apprentissage auprès de lui, sans préciser abusivement la manière.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit ici l’explication qui fonde l’appel à apprendre de Jésus. « Car » convient au registre digne du passage tout en restant courant.
- source_word: πραΰς
  choice: doux
  rationale: « Doux » rend la bienveillance et l’absence de dureté exprimées par πραΰς, sans suggérer la faiblesse.
- source_word: ταπεινὸς τῇ καρδίᾳ
  choice: humble de cœur
  rationale: Expression française naturelle et bibliquement familière qui conserve l’idée d’une disposition intérieure.
- source_word: ἀνάπαυσιν
  choice: du repos
  rationale: « Repos » est le correspondant direct et préserve la résonance scripturaire de la promesse.
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: pour vos âmes
  rationale: Le datif est rendu idiomatiquement par « pour ». « Âmes » conserve l’image traditionnelle et la dimension de la personne intérieure, sans exclure le sens plus large de la personne elle-même.
theological_decisions:
- issue: Le caractère de Jésus exprimé par πραΰς καὶ ταπεινὸς τῇ καρδίᾳ
  choice: je suis doux et humble de cœur
  alternative: je suis plein de douceur et humble de cœur
  rationale: La formulation retenue préserve la simplicité et la force de l’autodescription de Jésus sans ajouter une interprétation doctrinale.
- issue: La portée de ψυχή dans la promesse de repos
  choice: pour vos âmes
  alternative: pour vous-mêmes
  rationale: « Âmes » maintient le langage et la résonance scripturaires du texte, tandis que la note signale que ψυχή peut désigner la personne dans sa profondeur et non une composante humaine isolée.
translation_notes:
  register: Français international moderne, sobre et digne. La métaphore du joug et le vocabulaire du repos sont conservés. « Apprenez de moi » maintient la concision ainsi que l’ouverture du grec entre recevoir l’enseignement de Jésus et apprendre auprès de lui.
