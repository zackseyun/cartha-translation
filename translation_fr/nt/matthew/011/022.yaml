id: MAT.11.22
reference: Matthew 11:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν, Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/022.yaml
  text: But I tell you[a], it will be more tolerable for Tyre and Sidon on the day of judgment than for you.
translation:
  language: fr
  text: 'Mais je vous le dis : au jour du jugement, Tyr et Sidon seront traitées moins sévèrement que vous.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: Mais
  rationale: Marque nettement le contraste avec la dénonciation précédente, dans un français naturel et digne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule idiomatique qui conserve l’adresse personnelle et la force solennelle de la parole de Jésus.
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: le sort de Tyr et de Sidon
  rationale: La reformulation nominale rend naturellement en français le datif associé au comparatif et évite une tournure lourde avec un « il » impersonnel.
- source_word: ἀνεκτότερον
  choice: plus supportable
  rationale: Exprime avec précision ce qui est relativement plus facile à endurer, sans atténuer le contexte judiciaire.
- source_word: ἔσται
  choice: sera
  rationale: Rend directement le futur du verbe copule dans la construction française retenue.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: au jour du jugement
  rationale: Expression française claire et traditionnelle qui désigne le moment du jugement à venir.
- source_word: κρίσεως
  choice: jugement
  rationale: Préserve le sens judiciaire général plutôt que de préciser d’avance l’issue comme le ferait « condamnation ».
- source_word: ἢ ὑμῖν
  choice: que le vôtre
  rationale: Achève naturellement la comparaison en renvoyant au sort des destinataires, le pluriel de l’adresse étant conservé par « votre ».
theological_decisions:
- issue: Nature du jugement à venir
  choice: au jour du jugement
  alternative: en un jour de jugement
  rationale: Dans ce contexte matthéen, l’expression désigne idiomatiquement le jugement eschatologique reconnu, sans ajouter de précision doctrinale absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « le sort de… sera plus supportable » explicite seulement ce que la syntaxe comparative grecque laisse implicite et évite le calque peu naturel « ce sera plus supportable pour… ». Aucun marqueur de note n’est requis.
