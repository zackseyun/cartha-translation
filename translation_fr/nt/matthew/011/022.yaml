    issue: Ajout interprétatif de « le sort de »
    rationale: Le grec dit littéralement qu'il sera plus supportable pour Tyr et Sidon, sans nommer leur « sort ». Cette explicitation est possible, mais elle déplace inutilement l'énoncé vers le destin de ces villes et produit une collocation moins naturelle avec « supportable ».
