id: MAT.11.23
reference: Matthew 11:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ᾅδου ⸀καταβήσῃ· ὅτι εἰ ἐν Σοδόμοις ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν σοί, ⸀ἔμεινεν ἂν μέχρι τῆς σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/023.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will go down to Hades. For if the mighty works done in you had happened in Sodom, it would have remained until today.
translation:
  language: fr
  text: Et toi, Capernaüm, seras-tu élevée jusqu’au ciel ? Tu descendras jusqu’à l’Hadès[a]. Car si les actes puissants accomplis chez toi avaient eu lieu à Sodome, elle aurait subsisté jusqu’à aujourd’hui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le séjour des morts ». Le grec porte « Hadès », et non « géhenne ».
    reason: Précision lexicale destinée à préserver la distinction entre ᾅδης et les autres termes de jugement.
lexical_decisions:
- source_word: Καφαρναούμ
  choice: Capernaüm
  rationale: Forme française moderne et courante du nom de lieu grec.
- source_word: μὴ ἕως οὐρανοῦ ὑψωθήσῃ;
  choice: seras-tu élevée jusqu’au ciel ?
  rationale: μή introduit ici vraisemblablement une question rhétorique appelant une réponse négative. « Élevée » conserve l’idée de hauteur et d’exaltation, tandis que l’accord féminin correspond à la ville directement interpellée.
- source_word: ἕως ᾅδου καταβήσῃ
  choice: Tu descendras jusqu’à l’Hadès
  rationale: « Descendras » rend directement καταβήσῃ. La translittération « Hadès » préserve le terme grec et évite de le confondre avec la géhenne.
- source_word: δυνάμεις
  choice: actes puissants
  rationale: Cette expression rend à la fois les actes concrets et la puissance qu’ils manifestent, sans réduire d’emblée le mot au seul sens moderne de « miracles ».
- source_word: γενόμεναι ἐν σοί
  choice: accomplis chez toi
  rationale: La formulation est naturelle pour des actes opérés dans une ville, tout en conservant l’adresse personnifiée à Capernaüm.
- source_word: ἐγενήθησαν
  choice: avaient eu lieu
  rationale: Le plus-que-parfait français exprime clairement la condition contraire aux faits.
- source_word: ἔμεινεν ἂν
  choice: elle aurait subsisté
  rationale: Le singulier renvoie à Sodome envisagée comme ville; le conditionnel passé restitue l’irréel marqué par ἄν.
- source_word: μέχρι τῆς σήμερον
  choice: jusqu’à aujourd’hui
  rationale: Rendu direct et idiomatique de la limite temporelle indiquée par le grec.
theological_decisions:
- issue: Rendu de ᾅδης
  choice: l’Hadès
  alternative: le séjour des morts; l’enfer
  rationale: « Hadès » maintient la distinction lexicale entre ᾅδης et les termes associés à la géhenne ou au jugement final. Une note fournit l’équivalent explicatif sans imposer une interprétation doctrinale.
- issue: Valeur de μή dans la première proposition
  choice: 'question rhétorique : « seras-tu élevée… ? »'
  alternative: 'déclaration négative : « tu ne seras pas élevée… »'
  rationale: Avec le futur passif, μή se comprend naturellement comme introduisant une question qui attend une réponse négative; la forme interrogative conserve cette nuance sans transformer l’implicite en affirmation explicite.
translation_notes:
  register: Français moderne, digne et accessible. La personnification de Capernaüm est conservée par l’adresse directe et l’accord féminin. « Actes puissants » privilégie la transparence sémantique sans recourir à une tournure excessivement technique.
