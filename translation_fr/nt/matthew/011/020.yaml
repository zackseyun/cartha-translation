id: MAT.11.20
reference: Matthew 11:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε ⸀ἤρξατο ὀνειδίζειν τὰς πόλεις ἐν αἷς ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ, ὅτι οὐ μετενόησαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/020.yaml
  text: Then he began to reproach the cities in which most of his mighty works had been done[a], because they did not repent.
translation:
  language: fr
  text: Alors il se mit à faire des reproches aux villes où avaient eu lieu la plupart de ses actes de puissance[a], parce qu’elles ne s’étaient pas repenties.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « miracles » ou « œuvres puissantes » (grec : dynameis).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la progression temporelle et narrative.
- source_word: ἤρξατο ὀνειδίζειν
  choice: il se mit à faire des reproches
  rationale: « Se mit à » conserve l’aspect ingressif de ἤρξατο, tandis que « faire des reproches » exprime clairement ὀνειδίζειν sans accentuer jusqu’à une condamnation formelle.
- source_word: τὰς πόλεις ἐν αἷς
  choice: aux villes où
  rationale: Rendu idiomatique et précis de la construction relative grecque.
- source_word: ἐγένοντο αἱ πλεῖσται δυνάμεις αὐτοῦ
  choice: avaient eu lieu la plupart de ses actes de puissance
  rationale: Le plus-que-parfait situe ces actes avant les reproches. « Actes de puissance » maintient le lien lexical de δυνάμεις avec la puissance tout en désignant des œuvres miraculeuses.
- source_word: ὅτι
  choice: parce que
  rationale: Introduit explicitement la cause des reproches.
- source_word: οὐ μετενόησαν
  choice: elles ne s’étaient pas repenties
  rationale: « Se repentir » rend la portée morale et spirituelle de μετανοέω dans ce contexte; le plus-que-parfait exprime l’absence de réponse antérieure aux actes accomplis.
theological_decisions:
- issue: Sens de δυνάμεις dans le contexte des miracles de Jésus
  choice: actes de puissance
  alternative: miracles; œuvres puissantes
  rationale: Ce choix conserve l’accent grec sur la puissance manifestée sans réduire le mot à une catégorie plus étroite; une note signale les équivalents naturels.
- issue: Portée de μετενόησαν
  choice: ne s’étaient pas repenties
  alternative: n’avaient pas changé d’attitude; n’étaient pas revenues à Dieu
  rationale: « Se repentir » préserve le poids moral et spirituel du terme sans préciser davantage l’objet ou la forme de la repentance que ne le fait le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression narrative, l’antériorité des actes et de l’absence de repentance, ainsi que l’accent de δυνάμεις sur la puissance.
