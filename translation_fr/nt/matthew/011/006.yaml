  source_fidelity: Le texte rend fidèlement καὶ μακάριός ἐστιν (« Et heureux »), le référent indéfini de ὃς ἐὰν μὴ (« celui pour qui ») et la relation de σκανδαλισθῇ ἐν ἐμοί. « Je ne suis pas une occasion de chute » conserve avec justesse l’image du scandale/trébuchement sans réduire le verbe à une simple offense émotionnelle.
  naturalness: La formulation est idiomatique en français biblique moderne et demeure accessible à un lectorat international. La tournure solennelle « Et heureux celui… ! » convient à une béatitude. « Occasion de chute » est une expression française établie et claire dans ce contexte.
