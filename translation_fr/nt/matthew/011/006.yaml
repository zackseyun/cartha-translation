  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μακάριός ἐστιν ὃς ⸀ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/006.yaml
  text: And blessed is the one who is not offended by me[a].
translation:
  language: fr
  text: Et heureux celui pour qui je ne suis pas une occasion de chute[a] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ne trébuche pas à cause de moi » ; ou « qui ne prend pas offense à cause de moi ».
    reason: Le verbe grec conserve l’image figurée d’une chute, mais peut aussi exprimer le fait de prendre offense et, selon le contexte, de se détourner.
lexical_decisions:
- source_word: καί
  choice: Et
  rationale: La conjonction maintient le lien direct avec les paroles précédentes.
- source_word: μακάριος
  choice: heureux
  rationale: « Heureux » est la formulation française traditionnelle et naturelle des béatitudes ; ici, il désigne la faveur accordée par Dieu plutôt qu’un simple état émotionnel.
- source_word: ὃς ἐὰν μὴ
  choice: celui pour qui… ne… pas
  rationale: Cette tournure rend la portée indéfinie et conditionnelle de l’expression grecque tout en conservant le singulier représentatif.
- source_word: σκανδαλισθῇ
  choice: je ne suis pas une occasion de chute
  rationale: 'La reformulation française conserve l’image de la chute et la valeur passive du verbe : Jésus peut devenir l’occasion contre laquelle quelqu’un bute, au sens figuré.'
- source_word: ἐν ἐμοί
  choice: pour qui je
  rationale: Avec σκανδαλίζω, l’expression désigne ici Jésus comme la personne à propos de laquelle ou à cause de laquelle la chute peut survenir. Cette formulation est naturelle en français sans trancher trop étroitement entre ces nuances.
theological_decisions:
- issue: Portée de σκανδαλισθῇ en relation avec Jésus
  choice: Conserver dans le texte l’image d’une « occasion de chute ».
  alternative: « ne se détourne pas de moi » ou « ne prend pas offense à cause de moi »
  rationale: L’expression peut évoquer le rejet, la défection ou le fait de s’offusquer devant Jésus. L’image de la chute garde cette tension et évite de réduire le sens à une simple réaction émotionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure exclamative convient à la forme solennelle d’une béatitude. « Occasion de chute » garde la métaphore grecque tout en restant idiomatique.
