  text: εἶπεν αὐτῷ· Σὺ εἶ ὁ ἐρχόμενος ἢ ἕτερον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/003.yaml
  text: and said to him, “Are you the Coming One, or should we expect another?”
translation:
  language: fr
  text: 'Il lui dit : « Es-tu celui qui vient[a], ou devons-nous en attendre un autre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui doit venir ». L’expression grecque peut servir de titre pour désigner la figure messianique attendue.
    reason: Variante lexicale et portée possible de l’expression.
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: Il lui demanda
  rationale: Le verbe signifie littéralement « il lui dit », mais puisqu’il introduit ici une question directe, « il lui demanda » est naturel en français et ne change pas le sens. Aucun « et » n’est ajouté, car la forme grecque fournie ne comporte pas de conjonction.
- source_word: Σὺ εἶ
  choice: Es-tu
  rationale: Cette formulation rend directement la question. Le pronom explicite σύ met le sujet en relief, nuance que le contexte interrogatif français permet de percevoir sans ajouter « toi-même ».
- source_word: ὁ ἐρχόμενος
  choice: celui qui vient
  rationale: Le participe présent substantivé est rendu au plus près tout en restant idiomatique. Dans ce contexte, l’expression peut désigner la figure messianique attendue, sans que la traduction remplace l’expression grecque par « le Messie ».
- source_word: ἢ
  choice: ou
  rationale: Conjonction disjonctive introduisant l’autre possibilité.
- source_word: ἕτερον
  choice: un autre
  rationale: Cette expression rend naturellement l’idée d’une autre personne ou d’une personne différente, sans préciser davantage son identité.
- source_word: προσδοκῶμεν
  choice: devons-nous en attendre
  rationale: Dans cette question délibérative, le présent grec exprime ce qu’il convient de faire. « Attendre » réunit ici les idées d’attente et d’expectative; le pronom « en » reprend naturellement une personne de même fonction attendue.
theological_decisions:
- issue: Portée messianique ou descriptive de ὁ ἐρχόμενος
  choice: celui qui vient
  alternative: celui qui doit venir
  rationale: 'La traduction principale conserve la forme participiale et son ambiguïté réelle : elle peut décrire celui qui vient tout en fonctionnant, dans le contexte, comme une désignation de la figure messianique attendue. La note signale cette portée sans imposer « le Messie » dans le texte.'
translation_notes:
  register: Français moderne, clair et digne. « Il lui demanda » convient au discours narratif courant; « celui qui vient » préserve l’écho biblique sans recourir à une majuscule inhabituelle en français ni expliciter excessivement le titre.
