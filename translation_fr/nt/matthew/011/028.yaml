reference: Matthew 11:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Δεῦτε πρός με πάντες οἱ κοπιῶντες καὶ πεφορτισμένοι, κἀγὼ ἀναπαύσω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/028.yaml
  text: Come to me[a], all who labor and are burdened[b], and I will give you rest.
translation:
  language: fr
  text: Venez à moi, vous tous qui peinez et qui êtes accablés[a], et moi, je vous donnerai du repos[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui avez été chargés d’un fardeau ». Le participe parfait passif grec décrit des personnes sur lesquelles une charge a été placée et qui restent sous son poids.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je vous soulagerai » ou « je vous procurerai du repos ». Le verbe grec peut signifier faire reposer quelqu’un ou lui procurer soulagement et repos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε πρός με
  choice: Venez à moi
  rationale: L’impératif exprime une invitation directe, et πρός avec l’accusatif indique ici le mouvement vers une personne. « Venez à moi » est naturel et fidèle en français.
- source_word: πάντες
  choice: vous tous
  rationale: Cette formulation conserve la portée universelle de l’invitation et explicite naturellement en français que Jésus s’adresse à l’ensemble des personnes décrites ensuite.
- source_word: οἱ κοπιῶντες
  choice: qui peinez
  rationale: Le participe présent désigne ceux qui travaillent avec effort ou se fatiguent à la tâche. « Peinez » garde à la fois l’idée d’effort et celle de lassitude sans en préciser indûment la nature.
- source_word: πεφορτισμένοι
  choice: qui êtes accablés
  rationale: Le participe parfait passif décrit des personnes sur lesquelles une charge a été placée et qui demeurent sous son poids. « Êtes accablés » exprime clairement cet état durable en français moderne.
- source_word: κἀγὼ
  choice: et moi, je
  rationale: La tournure conserve le sujet grec explicite et sa légère valeur d’insistance ou de contraste, sans lui donner une force excessive.
- source_word: ἀναπαύσω ὑμᾶς
  choice: je vous donnerai du repos
  rationale: Le verbe peut signifier faire reposer, procurer du repos ou délasser. Cette formulation française est naturelle et maintient la large portée de la promesse.
theological_decisions:
- issue: Nature du repos promis par ἀναπαύσω
  choice: je vous donnerai du repos
  alternative: je vous soulagerai / je vous ranimerai
  rationale: Le verset ne précise pas à lui seul si ce repos est physique, intérieur, spirituel ou eschatologique. Une formulation large préserve cette richesse et évite d’imposer une interprétation doctrinale particulière.
- issue: Nature de la charge exprimée par πεφορτισμένοι
  choice: êtes accablés
  alternative: avez été chargés d’un lourd fardeau
  rationale: Le texte ne définit pas le fardeau comme moral, religieux, émotionnel ou matériel. Le choix retenu conserve cette indétermination tout en rendant l’état résultant exprimé par le parfait passif.
translation_notes:
  register: Français international moderne, clair et digne. « Peinez » conserve l’idée d’un effort fatigant; « êtes accablés » rend idiomatiquement l’état durable causé par une charge. La légère insistance de κἀγὼ est représentée par « et moi, je ».
