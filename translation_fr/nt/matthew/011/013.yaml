id: MAT.11.13
reference: Matthew 11:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντες γὰρ οἱ προφῆται καὶ ὁ νόμος ἕως Ἰωάννου ἐπροφήτευσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/013.yaml
  text: For all the prophets and the Law prophesied until John[a].
translation:
  language: fr
  text: Car tous les prophètes et la Loi ont prophétisé jusqu’à Jean[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au temps de Jean ». L’expression peut présenter Jean comme l’aboutissement du témoignage prophétique ou comme la limite qui en marque la transition.
    reason: Préserver l’ambiguïté temporelle et théologique de ἕως Ἰωάννου.
lexical_decisions:
- source_word: πάντες
  choice: tous
  rationale: Avec « les prophètes », désigne collectivement l’ensemble des prophètes.
- source_word: γὰρ
  choice: car
  rationale: Introduit l’explication ou le fondement de l’affirmation précédente, sans en préciser davantage la logique.
- source_word: οἱ προφῆται
  choice: les prophètes
  rationale: Équivalent français courant et précis pour ceux qui parlent prophétiquement de la part de Dieu.
- source_word: ὁ νόμος
  choice: la Loi
  rationale: La majuscule indique ici la Torah comme corpus reconnu des Écritures d’Israël, et non une loi au sens générique.
- source_word: ἕως Ἰωάννου
  choice: jusqu’à Jean
  rationale: Rend la limite temporelle avec concision tout en préservant l’ambiguïté quant à l’inclusion de Jean comme aboutissement ou à son rôle de frontière.
- source_word: ἐπροφήτευσαν
  choice: ont prophétisé
  rationale: Rend directement l’aoriste de προφητεύω et conserve la personnification selon laquelle la Loi, avec les prophètes, porte un témoignage prophétique.
theological_decisions:
- issue: Faut-il comprendre ὁ νόμος comme un terme générique ou comme le titre d’un corpus scripturaire ?
  choice: la Loi
  alternative: la loi
  rationale: Le contexte vise le témoignage reconnu des Écritures d’Israël. La majuscule aide le lecteur moderne à reconnaître cette référence sans ajouter de contenu.
- issue: ἕως Ἰωάννου inclut-il Jean dans la période prophétique ou en marque-t-il seulement la limite ?
  choice: jusqu’à Jean
  alternative: jusqu’au temps de Jean
  rationale: Le grec ne tranche pas entièrement. La formulation retenue conserve la tension entre Jean comme aboutissement du témoignage prophétique et Jean comme seuil d’une transition.
translation_notes:
  register: Français international moderne, clair et digne. « Car » maintient le lien explicatif avec le contexte ; « ont prophétisé » conserve la formulation frappante appliquée à la fois aux prophètes et à la Loi.
