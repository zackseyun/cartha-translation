id: MAT.11.24
reference: Matthew 11:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν λέγω ὑμῖν ὅτι γῇ Σοδόμων ἀνεκτότερον ἔσται ἐν ἡμέρᾳ κρίσεως ἢ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/024.yaml
  text: But I tell you that it will be more tolerable for the land of Sodom on the day of judgment than for you[a].
translation:
  language: fr
  text: 'Mais je vous le dis : au jour du jugement, ce sera plus supportable[a] pour le pays de Sodome que pour toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus tolérable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Mais
  rationale: Dans ce contexte, le terme introduit une opposition forte et une transition solennelle. « Mais » est naturel et fidèle en français moderne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette formule courante de discours direct conserve l’adresse aux auditeurs et son caractère appuyé ; le pronom « le » rend la tournure idiomatique en français.
- source_word: γῇ Σοδόμων
  choice: pour le pays de Sodome
  rationale: Cette formulation maintient le nom explicite γῇ, « terre, pays, région », plutôt que de réduire l’expression à la seule ville de Sodome.
- source_word: ἀνεκτότερον
  choice: plus supportable
  rationale: Le comparatif signifie « plus supportable, plus tolérable ». « Plus supportable » est clair, actuel et naturel dans ce contexte de jugement.
- source_word: ἔσται
  choice: ce sera
  rationale: Le futur de εἰμί est rendu par un futur simple français ; « ce » reprend naturellement la situation évoquée.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: au jour du jugement
  rationale: Cette expression française digne et courante préserve la construction temporelle et la portée eschatologique du grec.
- source_word: ἢ σοί
  choice: que pour toi
  rationale: Le datif après le comparatif se rend naturellement par « pour ». Le singulier « toi » conserve l’adresse directe à la localité personnifiée dans le contexte.
theological_decisions:
- issue: Référent du singulier σοί
  choice: Conserver « toi », au singulier, comme adresse directe à la ville personnifiée.
  alternative: « que pour vous » ou « que pour vous, ses habitants »
  rationale: Le grec porte explicitement le singulier et poursuit l’interpellation prophétique de la ville dans le contexte. Le maintenir préserve la force rhétorique sans ajouter une interprétation explicative.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde le contraste solennel, l’expression « le pays de Sodome » et l’adresse singulière à la ville, tout en évitant une tournure inutilement archaïque.
