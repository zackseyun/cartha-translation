id: MAT.11.5
reference: Matthew 11:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τυφλοὶ ἀναβλέπουσιν καὶ χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται καὶ κωφοὶ ἀκούουσιν, ⸀καὶ νεκροὶ ἐγείρονται καὶ πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/005.yaml
  text: The blind receive sight and the lame walk[a], lepers are cleansed and the deaf hear[b], and the dead are raised and the poor have good news proclaimed to them.
translation:
  language: fr
  text: Les aveugles retrouvent la vue et les boiteux marchent, ceux qui ont la lèpre[a] sont purifiés et les sourds entendent, les morts sont ressuscités, et la bonne nouvelle est annoncée aux pauvres[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traditionnellement rendu par « lépreux » pouvait désigner diverses affections cutanées, et pas seulement la maladie aujourd’hui appelée lèpre.
    reason: précision_historique_et_lexicale
  - marker: b
    text: 'Ou : « l’Évangile est annoncé aux pauvres ». Le verbe grec est au passif : les pauvres reçoivent l’annonce de la bonne nouvelle.'
    reason: variante_lexicale
  - marker: c
    text: Cette liste fait écho à Ésaïe 35.5-6 et 61.1 et présente des signes associés à l’œuvre du Messie.
    reason: renvoi_scripturaire
lexical_decisions:
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: les aveugles retrouvent la vue
  rationale: « Retrouvent la vue » exprime naturellement la restauration de la capacité de voir dans ce contexte de guérisons, sans retenir le sens littéral possible « lèvent les yeux ».
- source_word: χωλοὶ περιπατοῦσιν
  choice: les boiteux marchent
  rationale: Formulation concise qui reproduit la structure de l’énumération grecque; « boiteux » reste compréhensible en français courant.
- source_word: λεπροὶ καθαρίζονται
  choice: ceux qui ont la lèpre sont purifiés
  rationale: La formulation désigne les personnes sans les réduire à leur affection. « Sont purifiés » conserve les dimensions corporelle et rituelle de καθαρίζονται, que « sont guéris » atténuerait.
- source_word: κωφοὶ ἀκούουσιν
  choice: les sourds entendent
  rationale: Associé au verbe « entendre », κωφοί désigne ici clairement les personnes sourdes plutôt que muettes.
- source_word: νεκροὶ ἐγείρονται
  choice: les morts sont ressuscités
  rationale: Le passif français conserve l’action exercée sur les morts et rend le sens du verbe dans ce contexte miraculeux.
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: la bonne nouvelle est annoncée aux pauvres
  rationale: 'Cette tournure française naturelle conserve le sens passif: les pauvres sont les destinataires de l’annonce. Elle maintient aussi le lien lexical avec la « bonne nouvelle » sans employer un jargon ecclésiastique.'
theological_decisions:
- issue: Valeur de εὐαγγελίζονται et terminologie de l’Évangile
  choice: la bonne nouvelle est annoncée aux pauvres
  alternative: l’Évangile est prêché aux pauvres
  rationale: Le choix conserve la forme passive et la portée de l’annonce messianique, sans réduire le verbe à un usage ecclésiastique ultérieur.
- issue: Échos aux annonces d’Ésaïe concernant l’œuvre messianique
  choice: Conserver dans le texte la simple liste des actes, avec une note signalant les échos scripturaires
  alternative: Ajouter explicitement dans le verset qu’il s’agit d’un accomplissement prophétique
  rationale: Le grec évoque fortement Ésaïe, mais n’emploie ici aucune formule explicite d’accomplissement; l’interprétation ne doit donc pas être insérée dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence en propositions coordonnées préserve le caractère solennel et cumulatif de l’énumération. La formulation centrée sur les personnes pour λεπροί évite une désignation inutilement stigmatisante, tandis que la note maintient la précision historique.
