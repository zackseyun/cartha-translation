id: MAT.11.16
reference: Matthew 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τίνι δὲ ὁμοιώσω τὴν γενεὰν ταύτην; ὁμοία ἐστὶν παιδίοις ⸂καθημένοις ἐν ταῖς ἀγοραῖς ἃ προσφωνοῦντα τοῖς ἑτέροις⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/011/016.yaml
  text: But to what shall I compare this generation? It is like children sitting in the marketplaces[a], calling out to the others[b],
translation:
  language: fr
  text: 'Mais à quoi comparerai-je cette génération ? Elle ressemble à des enfants assis sur les places publiques[a], qui interpellent les autres[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur les places de marché ». Le grec désigne des espaces publics où l’on commerçait et où les gens se rassemblaient.
    reason: lexical_alternative
  - marker: b
    text: Ou « les autres enfants ». Le grec dit simplement « les autres » ; leur identité ressort de la comparaison.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίνι … ὁμοιώσω
  choice: à quoi comparerai-je
  rationale: Le datif interrogatif indique le terme de la comparaison. Cette tournure française est naturelle et conserve la forme rhétorique du futur.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une légère transition contrastive dans le discours.
- source_word: τὴν γενεὰν ταύτην
  choice: cette génération
  rationale: Traduction directe qui désigne les contemporains considérés collectivement, sans préciser davantage leur identité.
- source_word: ὁμοία ἐστὶν
  choice: Elle ressemble à
  rationale: Formulation française idiomatique exprimant clairement la similitude.
- source_word: παιδίοις
  choice: des enfants
  rationale: Le contexte n'exige pas que la nuance diminutive possible soit explicitée par « petits enfants ».
- source_word: καθημένοις
  choice: assis
  rationale: Le participe décrit simplement la posture des enfants dans la scène.
- source_word: ἐν ταῖς ἀγοραῖς
  choice: sur les places publiques
  rationale: Dans le monde gréco-romain, ἀγορά désigne une place publique servant notamment de marché et de lieu de rassemblement; « sur » est idiomatique en français avec « place ».
- source_word: προσφωνοῦντα
  choice: qui interpellent
  rationale: Le verbe décrit une adresse à voix haute; « interpeller » convient à la scène publique sans ajouter le contenu de l'appel.
- source_word: τοῖς ἑτέροις
  choice: les autres
  rationale: Cette traduction conserve l'indétermination du grec, même si le contexte suggère les autres enfants.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique et l'indétermination de « les autres » sont préservées. Le deux-points final signale que la parole des enfants se poursuit au verset suivant.
