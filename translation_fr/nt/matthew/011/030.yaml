  yaml_path: translation/nt/matthew/011/030.yaml
  text: For my yoke is kind, and my burden is light.
translation:
  language: fr
  text: Car mon joug est doux[a], et mon fardeau est léger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : bon, bienfaisant, agréable à porter. Le grec peut désigner ce qui est bon, bienveillant ou agréable.'
    reason: La note signale les principales nuances possibles de χρηστός sans faire de « facile » ou d’« adapté » le sens imposé du texte.
lexical_decisions:
- source_word: ζυγός
  choice: joug
  rationale: Le terme français « joug » conserve l’image concrète et sa portée figurée d’autorité, de discipline ou d’engagement.
- source_word: χρηστός
  choice: bienfaisant
  rationale: « Bienfaisant » exprime ici la bonté et le caractère bénéfique du joug, sans réduire le mot au seul sens de « facile » et sans employer l’étrange « gentil » pour un objet.
- source_word: φορτίον
  choice: fardeau
  rationale: « Fardeau » rend naturellement la charge portée et maintient le parallèle avec le joug.
- source_word: ἐλαφρόν
  choice: léger
  rationale: Équivalent direct qui conserve le contraste implicite avec une charge pesante.
theological_decisions:
- issue: Sens de χρηστός appliqué au joug de Jésus
  choice: bienfaisant
  alternative: facile / doux / bon
  rationale: Le grec peut évoquer ce qui est bon, bénéfique, adapté ou agréable à porter. « Bienfaisant » préserve l’accent sur la bonté du joug sans affirmer qu’il n’exige aucun effort; « doux » pourrait aussi être compris comme qualifiant sa texture, et « facile » resserrerait excessivement le sens.
translation_notes:
  register: Français moderne, international et digne. La formulation garde la métaphore traditionnelle du joug et le parallélisme concis de l’original.
