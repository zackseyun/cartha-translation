id: MAT.24.28
reference: Matthew 24:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὅπου ἐὰν ᾖ τὸ πτῶμα, ἐκεῖ συναχθήσονται οἱ ἀετοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/028.yaml
  text: Wherever the corpse is[a], there the vultures will gather.
translation:
  language: fr
  text: Où que se trouve le cadavre, là se rassembleront les vautours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les aigles ». Le mot grec peut désigner des aigles, mais « vautours » convient mieux à l’image d’oiseaux se rassemblant autour d’un cadavre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἐὰν ᾖ
  choice: Où que soit
  rationale: La construction avec ἐάν et le subjonctif exprime un lieu indéfini. « Où que soit » est naturel en français et conserve cette valeur.
- source_word: πτῶμα
  choice: le cadavre
  rationale: πτῶμα désigne ici un corps mort. « Cadavre » est précis, courant et ne suppose pas qu’il s’agisse d’un animal.
- source_word: συναχθήσονται
  choice: se rassembleront
  rationale: Bien que la forme grecque soit passive, le français idiomatique emploie ici le pronominal « se rassembleront », qui rend naturellement l’action collective des oiseaux sans suggérer explicitement un agent extérieur.
- source_word: ἀετοί
  choice: les vautours
  rationale: Le mot peut désigner des aigles, mais l’image d’oiseaux se rassemblant autour d’un cadavre correspond plus naturellement aux vautours. L’autre sens est conservé en note.
theological_decisions:
- issue: Interprétation de l’image proverbiale
  choice: Traduire directement l’image sans préciser son référent eschatologique.
  alternative: Y voir explicitement le jugement inévitable, la visibilité de la venue du Fils de l’homme, la destruction de Jérusalem ou les enseignes romaines.
  rationale: Le grec n’identifie pas ce que symbolisent le cadavre et les oiseaux. La traduction préserve donc l’image et sa tension interprétative.
translation_notes:
  register: Français international moderne, concis et digne. La tournure proverbiale est maintenue, avec inversion après « où que » et reprise corrélative par « là ».
