id: MAT.24.14
reference: Matthew 24:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κηρυχθήσεται τοῦτο τὸ εὐαγγέλιον τῆς βασιλείας ἐν ὅλῃ τῇ οἰκουμένῃ εἰς μαρτύριον πᾶσιν τοῖς ἔθνεσιν, καὶ τότε ἥξει τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/014.yaml
  text: And this good news of the kingdom will be proclaimed throughout the whole world as a testimony to all the nations[c][b][a], and then the end will come.
translation:
  language: fr
  text: Et cette bonne nouvelle[a] du royaume sera proclamée dans le monde entier[b], pour servir de témoignage à toutes les nations[c]. Alors viendra la fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cet Évangile du royaume ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans toute la terre habitée ».
    reason: lexical_alternative
  - marker: c
    text: Ou « à tous les peuples ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθήσεται
  choice: sera proclamée
  rationale: Le futur passif exprime une annonce publique. « Sera proclamée » conserve cette force sans limiter le terme à la prédication dans un cadre ecclésial.
- source_word: εὐαγγέλιον
  choice: bonne nouvelle
  rationale: C’est le sens lexical premier du terme et une formulation immédiatement compréhensible en français moderne. « Évangile » demeure signalé en note comme équivalent traditionnel.
- source_word: τῆς βασιλείας
  choice: du royaume
  rationale: Cette formulation respecte le génitif grec et conserve l’expression biblique établie sans expliciter davantage s’il s’agit du royaume, du règne ou du message à son sujet.
- source_word: ἐν ὅλῃ τῇ οἰκουμένῃ
  choice: dans le monde entier
  rationale: οἰκουμένη désigne le monde habité. « Dans le monde entier » en communique naturellement l’étendue, tandis que la nuance littérale est conservée en note.
- source_word: εἰς μαρτύριον
  choice: pour servir de témoignage
  rationale: La tournure française exprime la fonction ou le résultat de la proclamation tout en maintenant la notion de témoignage, sans préciser qu’il serait favorable ou accusateur.
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: à toutes les nations
  rationale: « Nations » conserve la portée large et la résonance biblique de ἔθνη sans réduire le terme aux seuls non-Juifs.
- source_word: ἥξει
  choice: viendra
  rationale: Rendu simple et idiomatique de ἥκω dans ce contexte eschatologique.
- source_word: τὸ τέλος
  choice: la fin
  rationale: Cette traduction directe préserve la sobriété et l’ouverture du grec sans introduire un schéma eschatologique particulier.
theological_decisions:
- issue: Portée de οἰκουμένη et de ἔθνη dans cette parole eschatologique
  choice: 'Employer des expressions de portée universelle : « dans le monde entier » et « à toutes les nations ».'
  alternative: « Dans toute la terre habitée » et « à tous les peuples », avec une nuance géographique ou ethnoculturelle plus marquée.
  rationale: Le verset présente une proclamation de portée universelle avant « la fin ». La traduction conserve cette ampleur sans décider si l’accomplissement vise spécialement le monde romain du premier siècle, une mission mondiale ultérieure ou un calendrier eschatologique précis.
- issue: Valeur de εἰς μαρτύριον
  choice: « Pour servir de témoignage à » sans préciser la teneur favorable ou accusatrice de ce témoignage.
  alternative: « Comme témoignage contre », qui lui donnerait explicitement une valeur judiciaire défavorable.
  rationale: Le grec affirme la fonction testimoniale de la proclamation, mais ne tranche pas à lui seul entre un témoignage offert aux nations et un témoignage susceptible de les mettre en cause.
translation_notes:
  register: Français international moderne, clair et digne. « Bonne nouvelle » évite un terme religieux moins transparent, tandis que « royaume », « témoignage » et « la fin » préservent la densité biblique et l’ambiguïté théologique du texte.
