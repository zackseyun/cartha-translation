lexical_decisions:
- source_word: τότε
  choice: alors
  rationale: Adverbe temporel qui marque la suite des événements dans le discours; « alors » est concis et naturel.
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ceux qui sont en Judée
  rationale: L’article suivi du groupe prépositionnel désigne les personnes qui se trouvent en Judée; cette formulation est claire et idiomatique en français.
- source_word: Ἰουδαίᾳ
  choice: Judée
  rationale: Forme française conventionnelle du nom géographique.
- source_word: φευγέτωσαν
  choice: que … fuient
  rationale: L’impératif présent actif à la troisième personne du pluriel se rend naturellement en français par « que » suivi du subjonctif, tout en conservant la force directe de l’ordre.
- source_word: ἐπὶ τὰ ὄρη
  choice: vers les montagnes
  rationale: Avec un verbe de mouvement, ἐπί suivi de l’accusatif exprime la direction ou la destination; « vers les montagnes » préserve cette valeur sans préciser davantage le point d’arrivée.
theological_decisions:
- issue: Force de l’impératif dans un avertissement eschatologique
  choice: Ordre direct rendu par « que ceux… fuient »
  alternative: « ceux… doivent fuir »
  rationale: La tournure choisie représente formellement l’impératif grec tout en restant naturelle et urgente en français, sans ajouter d’interprétation eschatologique.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la brièveté et l’urgence de l’original; « Judée » et « montagnes » restent non explicités afin de ne pas surinterpréter la référence géographique.
