id: MAT.24.33
reference: Matthew 24:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ⸂πάντα ταῦτα⸃, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/033.yaml
  text: So also you[a], when you see all these things, know that it is near, at the doors.
translation:
  language: fr
  text: De même, vous aussi, quand vous verrez toutes ces choses, sachez que cela est proche, aux portes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il est proche ». Le grec ne précise pas le sujet.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: De même, vous aussi
  rationale: « De même » reprend clairement la comparaison avec le figuier, tandis que « vous aussi » conserve l’accent porté sur les disciples.
- source_word: ὅταν ἴδητε
  choice: quand vous verrez
  rationale: ὅταν avec le subjonctif aoriste renvoie ici à une éventualité future; le futur français est naturel dans cette construction.
- source_word: πάντα ταῦτα
  choice: toutes ces choses
  rationale: Cette formulation garde explicitement le pluriel neutre du grec sans préciser qu’il s’agit d’« événements », ce que le texte ne dit pas directement.
- source_word: γινώσκετε
  choice: sachez
  rationale: L’impératif « sachez » conserve la force directive du présent grec et convient au lien logique avec le signe du figuier.
- source_word: ἐγγύς
  choice: proche
  rationale: « Proche » rend directement l’idée de proximité exprimée par ἐγγύς.
- source_word: ἐπὶ θύραις
  choice: aux portes
  rationale: La formulation conserve le pluriel θύραις et l’image idiomatique d’une réalité imminente, déjà arrivée aux portes.
- source_word: ἐγγύς ἐστιν
  choice: c’est proche
  rationale: Le grec n’exprime pas le sujet. La tournure française avec « c’ » évite autant que possible d’identifier explicitement celui-ci à une personne ou à un événement.
theological_decisions:
- issue: Sujet implicite de ἐγγύς ἐστιν
  choice: 'Traduction non personnelle : « c’est proche »'
  alternative: « il est proche »
  rationale: Le grec laisse le sujet inexprimé. Il peut être compris comme le Fils de l’homme ou comme la réalité attendue — événement, accomplissement ou règne. Le texte principal préserve cette indétermination, et la note signale la lecture personnelle.
translation_notes:
  register: Français moderne, sobre et digne. La syntaxe reste proche du mouvement de la phrase grecque. « Aux portes » conserve l’image plurielle de l’original; « c’est proche » est volontairement choisi pour ne pas trancher l’identité du sujet implicite.
