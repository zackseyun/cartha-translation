id: MAT.24.21
reference: Matthew 24:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔσται γὰρ τότε θλῖψις μεγάλη οἵα οὐ γέγονεν ἀπ’ ἀρχῆς κόσμου ἕως τοῦ νῦν οὐδ’ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/021.yaml
  text: For then there will be great tribulation[a], such as has not happened from the beginning of the world until now, and never will happen again.
translation:
  language: fr
  text: Car alors, il y aura une grande détresse[a], telle qu’il n’y en a jamais eu depuis le commencement du monde jusqu’à maintenant et qu’il n’y en aura jamais plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande tribulation » ou « une grande affliction ». Le mot grec peut désigner une détresse profonde, une épreuve sévère, une pression ou une oppression.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ τότε
  choice: Car alors
  rationale: « Car » conserve la valeur explicative de γάρ et « alors » rend directement τότε, en reliant le verset à l’avertissement précédent.
- source_word: ἔσται
  choice: il y aura
  rationale: Cette tournure existentielle est naturelle en français avec « une grande détresse » comme réalité annoncée.
- source_word: θλῖψις μεγάλη
  choice: une grande détresse
  rationale: θλῖψις désigne une épreuve intense, une oppression ou une détresse profonde. « Grande détresse » est clair en français moderne, garde toute la gravité du contexte et évite que « tribulation » soit compris uniquement comme un terme technique.
- source_word: οἵα
  choice: telle que
  rationale: Cette expression conserve la comparaison qualitative et introduit naturellement le caractère sans précédent de la détresse.
- source_word: οὐ γέγονεν
  choice: il n’y en a jamais eu
  rationale: Le parfait de γίνομαι présente ici une situation sans précédent jusqu’au moment considéré. La tournure française est idiomatique et maintient la portée temporelle du parfait.
- source_word: ἀπ’ ἀρχῆς κόσμου
  choice: depuis le commencement du monde
  rationale: « Monde » rend κόσμος sans expliciter davantage par « création », et « depuis » convient à la période qui s’étend jusqu’au présent.
- source_word: ἕως τοῦ νῦν
  choice: jusqu’à maintenant
  rationale: Rendu temporel direct, clair et actuel.
- source_word: οὐδ’ οὐ μὴ γένηται
  choice: et qu’il n’y en aura jamais plus
  rationale: La négation emphatique οὐ μή est rendue par « jamais », tandis que « plus » exprime naturellement en français l’absence future de répétition après l’événement annoncé.
theological_decisions:
- issue: Rendu du terme eschatologiquement chargé θλῖψις
  choice: grande détresse
  alternative: grande tribulation
  rationale: « Grande détresse » exprime directement l’intensité de θλῖψις en français courant tout en laissant le contexte eschatologique porter sa propre force. La note signale les autres rendus possibles sans imposer une lecture doctrinale technique.
- issue: Portée absolue de la comparaison
  choice: « jamais eu… jamais plus »
  alternative: « ne s’est pas produite… ne se produira jamais »
  rationale: La formulation retenue préserve l’affirmation forte d’un caractère sans précédent passé et futur, sans préciser la nature ou la chronologie de l’événement au-delà du texte grec.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « jamais… jamais plus » restitue l’emphase du grec sans lourdeur excessive. Le pronom « en » évite de répéter « détresse » tout en maintenant clairement le référent.
