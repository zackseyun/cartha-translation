id: MAT.24.51
reference: Matthew 24:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ὑποκριτῶν θήσει· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/051.yaml
  text: and will cut him in two and assign his place with the hypocrites[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: fr
  text: il le coupera en deux[a] et lui assignera son lot avec les hypocrites[b]. Là, il y aura des pleurs et des grincements de dents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans un sens plus idiomatique : « le punira sévèrement ». Le verbe grec signifie littéralement « couper en deux ».'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « sa part » ou « son lot avec les hypocrites ». Cette expression peut désigner le sort qui lui est attribué.
    reason: lexical_alternative
lexical_decisions:
- source_word: διχοτομήσει
  choice: le coupera en deux
  rationale: Le verbe grec désigne concrètement l’action de couper en deux. Cette image forte est conservée plutôt que remplacée dans le texte principal par une paraphrase comme « le punira sévèrement ».
- source_word: τὸ μέρος αὐτοῦ ... θήσει
  choice: lui assignera sa part
  rationale: μέρος signifie « part » ou « portion »; avec θήσει, la formulation évoque le sort attribué à quelqu’un sans préciser s’il s’agit avant tout d’un lieu, d’une destinée ou d’un lot.
- source_word: ὑποκριτῶν
  choice: hypocrites
  rationale: « Hypocrites » est le sens courant et conserve le vocabulaire thématique caractéristique de Matthieu.
- source_word: ἐκεῖ
  choice: Là
  rationale: L’adverbe renvoie avec concision au sort qui vient d’être annoncé et respecte sa position emphatique au début de la proposition grecque.
- source_word: κλαυθμὸς
  choice: pleurs
  rationale: « Pleurs » est naturel en français et convient à la formule récurrente de Matthieu.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: grincements de dents
  rationale: Expression française consacrée, exacte et évocatrice pour cette formule récurrente.
theological_decisions:
- issue: Faut-il atténuer διχοτομήσει en une formule générale de châtiment ?
  choice: Conserver « le coupera en deux » dans le texte principal.
  alternative: « le punira sévèrement »
  rationale: Le sens lexical concret et la violence de l’image appartiennent au texte. Les conserver évite de résoudre la question de leur portée littérale ou figurée.
- issue: Comment rendre le sort exprimé par τὸ μέρος αὐτοῦ ... θήσει ?
  choice: « lui assignera sa part avec les hypocrites »
  alternative: « lui assignera sa place parmi les hypocrites »
  rationale: « Sa part » traduit directement μέρος et maintient l’ambiguïté entre lot, destinée et place, tout en restant intelligible en français.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe reste naturelle tout en conservant l’image saisissante du grec et l’expression traditionnelle « pleurs et grincements de dents ».
