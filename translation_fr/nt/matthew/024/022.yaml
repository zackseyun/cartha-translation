id: MAT.24.22
reference: Matthew 24:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ἐκολοβώθησαν αἱ ἡμέραι ἐκεῖναι, οὐκ ἂν ἐσώθη πᾶσα σάρξ· διὰ δὲ τοὺς ἐκλεκτοὺς κολοβωθήσονται αἱ ἡμέραι ἐκεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/022.yaml
  text: And if those days had not been cut short[a], no flesh would have been saved; but for the sake of the elect[b], those days will be cut short.
translation:
  language: fr
  text: Et si ces jours-là n’avaient pas été écourtés, aucun être humain[a] n’aurait été sauvé ; mais à cause des élus[b], ces jours-là seront écourtés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « aucune chair ». Cette expression biblique désigne ici aucun être humain.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ceux qui ont été choisis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκολοβώθησαν / κολοβωθήσονται
  choice: n’avaient pas été écourtés / seront écourtés
  rationale: Le verbe κολοβόω exprime ici la réduction de la durée. « Écourter » est idiomatique en français moderne et conserve davantage la force du grec que le plus neutre « abréger ».
- source_word: οὐκ ἂν ἐσώθη
  choice: n’aurait été sauvé
  rationale: Cette construction exprime le résultat irréel d’une condition contraire aux faits. « Sauvé » maintient l’étendue sémantique de σῴζω, tandis que le contexte évoque immédiatement la préservation de la vie.
- source_word: πᾶσα σάρξ
  choice: aucun être humain
  rationale: Sous la négation, l’expression biblique « toute chair » désigne ici l’ensemble des êtres humains. « Aucun être humain » en restitue naturellement le sens en français sans suggérer la « chair » comme disposition morale.
- source_word: διὰ δὲ τοὺς ἐκλεκτούς
  choice: mais à cause des élus
  rationale: διά avec l’accusatif marque ici le motif ou la considération déterminante. « À cause des élus » reste proche de la formulation grecque sans préciser davantage l’identité du groupe.
- source_word: αἱ ἡμέραι ἐκεῖναι
  choice: ces jours-là
  rationale: Cette tournure française naturelle conserve la valeur démonstrative de l’expression grecque.
- source_word: καὶ εἰ μὴ
  choice: Et si… n’avaient pas
  rationale: Cette formulation conserve la coordination initiale et la structure conditionnelle explicite du grec.
theological_decisions:
- issue: Sens de « les élus » dans le discours eschatologique
  choice: Conserver « les élus » sans développement interprétatif.
  alternative: ceux que Dieu a choisis ; les croyants ; le reste fidèle
  rationale: Le verset désigne un groupe par ἐκλεκτοί sans en définir ici toute la portée théologique. « Les élus » préserve cette tension et n’impose aucune identification confessionnelle.
- issue: Portée de σῴζω dans ce contexte
  choice: Employer « sauvé » tout en laissant le contexte évoquer la préservation physique de la vie.
  alternative: survivre ; rester en vie
  rationale: Le contexte concerne la survie durant une détresse extrême, mais « survivre » réduirait la gamme de sens de σῴζω. « Sauvé » évite de trancher entre une portée exclusivement physique et une portée plus large.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le contraste temporel entre la condition irréelle portant sur le passé et l’affirmation au futur. « Les élus » et « sauvé » maintiennent volontairement les tensions lexicales et théologiques du texte grec.
