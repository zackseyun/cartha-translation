  source_fidelity: La question rhétorique, la formule solennelle « Amen, je vous le dis » et l’annonce d’une destruction totale sont bien rendues. Toutefois, « tout sera démoli » transforme la relative grecque (« aucune pierre ... qui ne sera pas démolie ») en une affirmation plus générale et rompt l’image syntaxique des pierres. Une relative explicite préserve plus exactement la portée distributive du grec.
  naturalness: Le français est globalement moderne et fluide. « Il ne restera pas ici pierre sur pierre qui ne sera pas démolie » est une formulation biblique française naturelle, claire et plus étroitement liée à l’image architecturale de l’original.
  terminology: « Démolie » rend bien καταλυθήσεται dans le contexte d’un édifice. La note doit présenter « renversée » comme une possibilité de traduction du verbe, sans faire dire au grec qu’il décrit nécessairement des pierres déplacées de leur position.
