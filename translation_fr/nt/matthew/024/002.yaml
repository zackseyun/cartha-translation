base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/002.yaml
  text: But he answered and said to them[a], “Do you not see all these things? Truly I tell you, not one stone here will be left upon another that will not be thrown down.”
translation:
  language: fr
  text: 'Mais il leur répondit : « Ne voyez-vous pas tout cela ? Amen, je vous le dis, il ne restera pas ici pierre sur pierre qui ne sera pas démolie[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « renversée ». Le verbe grec peut désigner le démantèlement ou la démolition d’une construction.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: il leur répondit
  rationale: La tournure participiale suivie d’un verbe fini est un idiome grec d’influence sémitique. En français actuel, « il leur répondit » en exprime naturellement tout le sens sans lourdeur.
- source_word: Οὐ βλέπετε ταῦτα πάντα
  choice: Ne voyez-vous pas tout cela ?
  rationale: La question rhétorique appelle l’assentiment. « Tout cela » renvoie naturellement à l’ensemble des constructions du Temple mentionnées dans le contexte.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, je vous le dis
  rationale: Conserver « Amen » respecte la formule solennelle caractéristique placée par Jésus au début de la déclaration, tout en restant intelligible en français biblique moderne.
- source_word: οὐ μὴ ἀφεθῇ ὧδε λίθος ἐπὶ λίθον
  choice: il ne restera pas ici pierre sur pierre
  rationale: La négation οὐ μή est fortement emphatique. La formule française « il ne restera pas… pierre sur pierre » rend avec naturel la prédiction catégorique et l’image architecturale.
- source_word: ὃς οὐ καταλυθήσεται
  choice: tout sera démoli
  rationale: Le relatif grec reprend chaque pierre dans une construction idiomatique. « Tout sera démoli » évite une relative française pesante et rend καταλύω dans son sens contextuel de démontage ou de démolition d’un édifice.
theological_decisions:
- issue: Portée de la prédiction concernant le Temple
  choice: Une annonce concrète et catégorique de la destruction de l’ensemble architectural
  alternative: Une déclaration principalement symbolique ou explicitement rattachée à un système eschatologique particulier
  rationale: Le vocabulaire du verset est matériel et architectural. La traduction en conserve la force sans préciser un cadre doctrinal ou chronologique que le verset lui-même n’énonce pas.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Amen » conserve la solennité propre à la parole de Jésus ; « pierre sur pierre » maintient l’expression concrète et mémorable du texte source.
