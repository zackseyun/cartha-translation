id: MAT.24.11
reference: Matthew 24:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ψευδοπροφῆται ἐγερθήσονται καὶ πλανήσουσιν πολλούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/011.yaml
  text: And many false prophets will arise and will lead many astray[a][b].
translation:
  language: fr
  text: Et beaucoup de faux prophètes surgiront et égareront beaucoup de gens.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tromperont beaucoup de gens ».
    reason: lexical_alternative
  - marker: b
    text: Ou « seront suscités ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup de
  rationale: Rend naturellement l’adjectif quantitatif grec tout en conservant sa portée générale.
- source_word: ψευδοπροφῆται
  choice: faux prophètes
  rationale: Expression française consacrée et précise pour désigner des prophètes trompeurs ou illégitimes, sans paraphrase excessive.
- source_word: ἐγερθήσονται
  choice: surgiront
  rationale: Dans ce contexte, le futur passif grec décrit l’apparition de ces figures. « Surgiront » est idiomatique et évite une évocation indue de la résurrection, tandis qu’une traduction passive demeure signalée en note.
- source_word: πλανήσουσιν
  choice: égareront
  rationale: Conserve l’image de personnes détournées du bon chemin et reste assez large pour inclure la tromperie doctrinale, morale ou spirituelle.
- source_word: πολλούς
  choice: beaucoup de gens
  rationale: Le grec substantivé désigne de nombreuses personnes; l’ajout de « gens » est nécessaire à la fluidité et à la clarté du français moderne.
- source_word: καὶ ... καὶ
  choice: Et ... et
  rationale: Préserve la coordination cumulative simple des deux propositions grecques.
theological_decisions:
- issue: Nature de l’égarement exprimé par πλανήσουσιν
  choice: Le verset avertit que de faux prophètes égareront beaucoup de personnes, sans préciser la forme ni l’étendue exactes de cet égarement.
  alternative: Comprendre l’égarement comme exclusivement doctrinal, moral ou eschatologique.
  rationale: Le verbe grec a une portée suffisamment large pour couvrir plusieurs formes de tromperie; la traduction ne réduit donc pas l’avertissement à une seule catégorie théologique.
- issue: Valeur du passif ἐγερθήσονται
  choice: « surgiront », au sens où de faux prophètes feront leur apparition
  alternative: « seront suscités »
  rationale: Le contexte favorise l’idée d’apparition, mais la forme passive grecque permet une traduction plus littérale; cette possibilité est conservée en note sans préciser qui les susciterait.
translation_notes:
  register: Français international moderne, clair et digne. « Surgiront » et « égareront » maintiennent la vigueur de l’avertissement ainsi que l’image grecque, sans imposer une interprétation confessionnelle particulière.
