  text: ἀμὴν λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/047.yaml
  text: Truly I say to you that he will appoint him over all his possessions[a].
translation:
  language: fr
  text: Vraiment, je vous le dis, il l’établira sur tous ses biens[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur tout ce qu’il possède ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Vraiment
  rationale: Introduit une déclaration solennelle et faisant autorité. « Vraiment » rend naturellement la formule synoptique sans translittérer « amen »; le grec ne comporte ici qu’un seul ἀμήν.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure française idiomatique conserve le caractère direct et solennel de la formule de Jésus.
- source_word: ὅτι
  choice: —
  rationale: En français, le contenu annoncé s’enchaîne naturellement après « je vous le dis » sans qu’il soit nécessaire de rendre ὅτι par une conjonction distincte.
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: sur tous ses biens
  rationale: ἐπί avec le datif après καθίστημι marque le domaine confié à sa responsabilité. « Tous ses biens » est concis, naturel et correspond aux choses qui appartiennent au maître; l’expression plus explicite « tout ce qu’il possède » est signalée en note.
- source_word: καταστήσει
  choice: il l’établira
  rationale: Dans ce contexte, καθίστημι désigne l’établissement de quelqu’un dans une fonction d’autorité ou de responsabilité. « Établira » préserve ce sens administratif et la solennité du registre.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin singulier renvoie au serviteur fidèle et avisé mentionné dans le contexte précédent; il est conservé sans reformulation neutralisante.
theological_decisions:
- issue: Nature de la récompense ou de la responsabilité confiée par le maître
  choice: Présenter simplement l’établissement du serviteur sur tous les biens du maître, conformément à la logique de la parabole.
  alternative: Y inscrire explicitement une autorité ecclésiale ou une récompense céleste de la fin des temps.
  rationale: Le verset décrit une promotion à une responsabilité plus large sans préciser lui-même la portée ecclésiale ou eschatologique de l’image. La traduction ne doit pas imposer ces interprétations.
translation_notes:
  register: Français international moderne, naturel et digne. La formule « Vraiment, je vous le dis » garde la solennité de l’original, tandis que « tous ses biens » convient au cadre d’intendance de la parabole.
