id: MAT.24.27
reference: Matthew 24:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ἀστραπὴ ἐξέρχεται ἀπὸ ἀνατολῶν καὶ φαίνεται ἕως δυσμῶν, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/027.yaml
  text: For just as the lightning comes from the east and is seen as far as the west[a], so will the coming of the Son of Man be.
translation:
  language: fr
  text: En effet, tout comme l’éclair vient de l’est et se voit jusqu’à l’ouest, ainsi en sera-t-il de la venue[a] du Fils de l’homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présence ». Le mot grec παρουσία peut désigner une présence ou une arrivée; dans ce contexte, il renvoie à la venue future du Fils de l’homme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: En effet, tout comme
  rationale: « En effet » rend la valeur explicative de γάρ, tandis que « tout comme » introduit naturellement la comparaison marquée par ὥσπερ.
- source_word: ἡ ἀστραπή
  choice: l’éclair
  rationale: Le nom désigne ici le phénomène visible de l’éclair, employé comme image d’une manifestation évidente et de grande portée.
- source_word: ἐξέρχεται ἀπὸ ἀνατολῶν
  choice: vient de l’est
  rationale: Cette formulation française naturelle conserve l’idée de provenance exprimée par ἐξέρχεται ἀπό et le sens directionnel de ἀνατολῶν dans son opposition à δυσμῶν.
- source_word: φαίνεται ἕως δυσμῶν
  choice: se voit jusqu’à l’ouest
  rationale: « Se voit » respecte la valeur médio-passive de φαίνεται, et « jusqu’à l’ouest » exprime l’étendue indiquée par ἕως.
- source_word: οὕτως ἔσται
  choice: ainsi en sera-t-il
  rationale: Cette tournure française conserve à la fois la comparaison introduite par οὕτως et la valeur future de ἔσται.
- source_word: παρουσία
  choice: venue
  rationale: Dans ce contexte eschatologique, « venue » exprime clairement l’aspect événementiel de παρουσία sans lui imposer un schéma doctrinal plus précis; l’autre sens lexical important, « présence », est signalé en note.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: du Fils de l’homme
  rationale: Cette traduction consacrée préserve la forme du titre et ses résonances intertextuelles, notamment avec Daniel 7.
theological_decisions:
- issue: Sens de παρουσία dans une parole eschatologique
  choice: venue
  alternative: présence; arrivée; avènement
  rationale: La comparaison avec l’éclair présente la παρουσία du Fils de l’homme comme une manifestation future et reconnaissable. « Venue » rend ce sens contextuel sans préciser davantage la chronologie ou la nature de l’événement. La possibilité lexicale « présence » demeure explicitement indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure comparative et la portée est-ouest de l’image sont conservées, sans lourdeur littérale.
