id: MAT.24.35
reference: Matthew 24:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσεται, οἱ δὲ λόγοι μου οὐ μὴ παρέλθωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/035.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: fr
  text: Le ciel et la terre passeront, mais mes paroles ne passeront jamais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne passeront absolument pas ». Le grec emploie ici une négation renforcée (οὐ μή).'
    reason: Préciser la force emphatique de la négation grecque et signaler une autre formulation française possible.
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: le ciel
  rationale: Dans l’association cosmique avec « la terre », le singulier désigne le ciel créé, et non seulement le ciel visible. « Le ciel et la terre » est l’expression française naturelle.
- source_word: ἡ γῆ
  choice: la terre
  rationale: Dans cette formule, γῆ désigne la terre dans son ensemble plutôt qu’un pays ou un territoire particulier.
- source_word: παρελεύσεται
  choice: passeront
  rationale: Le verbe exprime ici la disparition ou la fin de l’ordre créé actuel. Le français « passeront » conserve l’image sobre du grec et convient à la tournure solennelle « le ciel et la terre passeront ».
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque le contraste entre ce qui passera et la permanence des paroles de Jésus.
- source_word: οἱ λόγοι μου
  choice: mes paroles
  rationale: Le pluriel λόγοι renvoie aux déclarations et enseignements prononcés par Jésus. « Mes paroles » en est l’équivalent direct et naturel.
- source_word: οὐ μὴ παρέλθωσιν
  choice: ne passeront jamais
  rationale: La construction οὐ μή avec le subjonctif aoriste constitue une négation fortement appuyée. En français moderne, « ne… jamais » exprime clairement et naturellement cette permanence catégorique.
theological_decisions:
- issue: Portée de l’affirmation de Jésus sur la permanence de ses paroles
  choice: Présenter directement le contraste appuyé entre la disparition du ciel et de la terre et la permanence des paroles de Jésus.
  alternative: Expliciter dans la traduction des conclusions doctrinales concernant l’autorité divine de Jésus.
  rationale: Le texte affirme avec force que les paroles de Jésus ne passeront jamais, sans développer lui-même les implications doctrinales de cette affirmation. La traduction en préserve le poids sans ajouter d’interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme et le contraste de l’original, tout en rendant la négation emphatique dans un français naturel.
