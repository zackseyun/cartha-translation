id: MAT.24.32
reference: Matthew 24:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ἤδη ὁ κλάδος αὐτῆς γένηται ἁπαλὸς καὶ τὰ φύλλα ἐκφύῃ, γινώσκετε ὅτι ἐγγὺς τὸ θέρος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/032.yaml
  text: 'Learn the parable from the fig tree: as soon as its branch becomes tender and puts out leaves[c][b][a], you know that summer is near.'
translation:
  language: fr
  text: 'Apprenez du figuier la leçon suivante[a] : dès que sa branche devient tendre et que ses feuilles poussent[b], vous savez que l’été[c] est proche.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Apprenez du figuier la parabole » ; on peut aussi rendre ce terme par « l’illustration » ou « la comparaison ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « déploient leurs feuilles ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot grec peut désigner l’été et, dans certains contextes, la saison de la moisson ; ici, le sens saisonnier convient le mieux à l’image du figuier.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς μάθετε
  choice: Tirez cette leçon du figuier
  rationale: Cette formulation française naturelle conserve l’idée d’apprendre à partir du figuier. Le léger δέ transitionnel n’exige pas ici un connecteur explicite.
- source_word: τὴν παραβολήν
  choice: cette leçon
  rationale: Dans ce contexte, παραβολή désigne la comparaison instructive fournie par le figuier. « Leçon » est plus idiomatique en français courant, tandis que « parabole » est conservé en note comme équivalent plus formel.
- source_word: ὅταν ἤδη
  choice: dès que
  rationale: Rend naturellement la condition temporelle générale introduite par ὅταν et l’idée d’apparition déjà perceptible portée par ἤδη.
- source_word: ὁ κλάδος αὐτῆς γένηται ἁπαλὸς
  choice: ses branches deviennent tendres
  rationale: ἁπαλός décrit la souplesse tendre de la nouvelle croissance. Le pluriel générique est naturel en français pour évoquer la ramure du figuier, bien que le grec emploie le singulier.
- source_word: καὶ τὰ φύλλα ἐκφύῃ
  choice: et que ses feuilles poussent
  rationale: ἐκφύω exprime la sortie ou la pousse du feuillage; « les feuilles poussent » est clair et naturel.
- source_word: γινώσκετε
  choice: vous savez
  rationale: Le présent de l’indicatif exprime ici un constat général, non un impératif.
- source_word: ἐγγὺς τὸ θέρος
  choice: l’été est proche
  rationale: Dans l’image saisonnière du figuier, θέρος désigne avant tout l’été; le mot peut toutefois évoquer la saison de la moisson selon le contexte.
theological_decisions:
- issue: Portée symbolique du figuier
  choice: Maintenir l’image comme une observation saisonnière sans identifier explicitement le figuier à Israël.
  alternative: Interpréter le figuier comme un symbole explicite d’Israël, ou comme un simple exemple naturel dépourvu de toute portée symbolique.
  rationale: Le verset présente directement une analogie fondée sur la reconnaissance des signes. La traduction ne doit pas trancher les interprétations eschatologiques plus larges que le texte de ce verset ne formule pas.
translation_notes:
  register: Français international moderne, clair et digne. La phrase privilégie une tournure idiomatique tout en conservant la structure de l’analogie et ses ambiguïtés légitimes.
