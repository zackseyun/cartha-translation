id: MAT.24.12
reference: Matthew 24:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ διὰ τὸ πληθυνθῆναι τὴν ἀνομίαν ψυγήσεται ἡ ἀγάπη τῶν πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/012.yaml
  text: And because lawlessness will be multiplied[b][a], the love of many will grow cold.
translation:
  language: fr
  text: Et parce que le mépris de la loi se multipliera[a], l’amour d’un grand nombre se refroidira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce que la violation de la loi augmentera ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’amour de beaucoup se refroidira ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ πληθυνθῆναι
  choice: parce que … se répandra
  rationale: διά avec l’infinitif articularisé exprime ici la cause. Le passif de πληθύνω indique une augmentation ou une multiplication; « se répandra » conserve la force verbale et s’accorde naturellement avec le contexte futur.
- source_word: ἀνομίαν
  choice: le mépris de la loi
  rationale: ἀνομία désigne le refus ou la violation de la loi, notamment celle de Dieu. « Le mépris de la loi » est plus naturel en français courant que « l’illégalité » et plus précis que le terme général « le mal ».
- source_word: ψυγήσεται
  choice: se refroidira
  rationale: Le futur de ψύχομαι exprime métaphoriquement la perte de chaleur affective. « Se refroidira » restitue directement cette image dans un français naturel.
- source_word: ἀγάπη
  choice: l’amour
  rationale: « Amour » est l’équivalent français direct et usuel de ἀγάπη; aucun complément interprétatif n’est ajouté.
- source_word: τῶν πολλῶν
  choice: d’un grand nombre
  rationale: Cette formulation conserve la portée large mais indéfinie de l’expression grecque sans affirmer qu’il s’agit de la majorité ni identifier précisément le groupe concerné.
theological_decisions:
- issue: Portée de « l’amour d’un grand nombre »
  choice: Ne pas préciser à quel groupe appartient ce grand nombre.
  alternative: « l’amour parmi les croyants » ou « l’amour dans la société »
  rationale: Le grec τῶν πολλῶν ne précise pas s’il s’agit des disciples déclarés, de l’humanité en général ou d’un groupe mixte. La formulation retenue préserve cette indétermination.
- issue: Sens de ἀνομία
  choice: Conserver la référence à la loi par « mépris de la loi ».
  alternative: « le mal » ou « la méchanceté »
  rationale: Une formulation plus générale effacerait la composante lexicale liée à la loi, tandis que la traduction retenue n’impose pas une définition confessionnelle de cette loi.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du refroidissement est conservée. « Mépris de la loi » rend le sens de ἀνομία sans recourir au terme plus archaïque « iniquité »; les notes signalent le passif littéral et l’article de τῶν πολλῶν.
