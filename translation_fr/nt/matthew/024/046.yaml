  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριος ὁ δοῦλος ἐκεῖνος ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ⸂οὕτως ποιοῦντα⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/046.yaml
  text: Blessed is that servant whom his lord, when he comes, will find doing so.
translation:
  language: fr
  text: Heureux ce serviteur que son maître, à son arrivée, trouvera en train d’agir ainsi !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: Heureux
  rationale: Rend naturellement la déclaration de bonheur ou de faveur exprimée par μακάριος, sans la réduire à une simple émotion passagère.
- source_word: δοῦλος
  choice: serviteur
  rationale: Dans le cadre de cette parabole, « serviteur » est idiomatique en français et conserve le rapport d’autorité avec le maître; « esclave » insisterait davantage sur le statut juridique que ne l’exige ici le contexte.
- source_word: κύριος
  choice: maître
  rationale: Le terme désigne ici celui qui exerce son autorité sur le serviteur. « Maître » exprime clairement cette relation en français, tandis que « Seigneur » pourrait suggérer trop directement un titre divin dans la formulation même de la parabole.
- source_word: οὕτως ποιοῦντα
  choice: en train d’agir ainsi
  rationale: Conserve à la fois la référence à la conduite décrite au verset précédent et l’aspect continu du participe ποιοῦντα au moment de l’arrivée.
theological_decisions:
- issue: Portée de κύριος dans la parabole
  choice: maître
  alternative: Seigneur
  rationale: La traduction maintient le sens immédiat de la scène maître-serviteur sans nier que, dans l’application de la parabole, le maître représente le Fils de l’homme.
translation_notes:
  register: Français moderne, naturel et digne. La tournure « à son arrivée » évite une subordonnée lourde tout en préservant le moment de la venue; le point d’exclamation convient à la déclaration emphatique de bonheur.
