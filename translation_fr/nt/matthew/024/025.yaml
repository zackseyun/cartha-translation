  text: Look, I have told you beforehand.
translation:
  language: fr
  text: Voyez, je vous l’ai dit à l’avance.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: Voyez
  rationale: Interpellation naturelle et digne qui attire l’attention sur l’avertissement donné, sans l’archaïsme de « Voici » dans cet emploi.
- source_word: προείρηκα
  choice: je vous ai prévenus
  rationale: Le parfait indique une parole dite à l’avance dont la portée demeure. Dans ce contexte d’avertissement contre les faux christs et faux prophètes, « prévenir » exprime naturellement en français à la fois l’antériorité et la fonction d’avertissement.
- source_word: ὑμῖν
  choice: vous
  rationale: Rend directement le pronom datif pluriel désignant les disciples.
