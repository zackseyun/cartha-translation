source:
  edition: SBLGNT
  text: καὶ οὐκ ἔγνωσαν ἕως ἦλθεν ὁ κατακλυσμὸς καὶ ἦρεν ἅπαντας, οὕτως ἔσται ⸀καὶ ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/039.yaml
  text: And they did not know until the flood came and swept them all away; so also will be the coming of the Son of Man.
translation:
  language: fr
  text: Ils ne se rendirent compte de rien jusqu’à ce que le déluge vienne et les emporte tous ; ainsi en sera-t-il aussi de la venue du Fils de l’homme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: ne se rendirent compte de rien
  rationale: Dans le contexte, l’expression indique qu’ils n’ont pas pris conscience de ce qui arrivait; cette formulation française naturelle conserve leur absence de perception sans préciser indûment s’il s’agissait d’ignorance ou d’insouciance.
- source_word: κατακλυσμός
  choice: déluge
  rationale: Terme français établi pour le grand déluge du récit de Noé.
- source_word: ἦρεν ἅπαντας
  choice: les emporte tous
  rationale: Rend le mouvement destructeur du déluge de manière idiomatique, tout en conservant la totalité exprimée par ἅπαντας.
- source_word: παρουσία
  choice: venue
  rationale: Dans ce contexte eschatologique, « venue » exprime naturellement l’arrivée ou la présence attendue du Fils de l’homme, sans imposer un terme confessionnel spécialisé.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Conserve le titre christologique traditionnel et son lien avec l’arrière-plan biblique.
theological_decisions:
- issue: Sens de οὐκ ἔγνωσαν
  choice: absence de prise de conscience
  alternative: « ils ne savaient pas »
  rationale: Le grec permet une formulation cognitive générale. « Ne se rendirent compte de rien » s’accorde au contraste contextuel avec l’arrivée soudaine du déluge, sans attribuer explicitement une culpabilité ou une connaissance préalable.
- issue: Comparaison avec la venue du Fils de l’homme
  choice: « Il en sera de même lors de la venue »
  alternative: « ainsi sera aussi la venue »
  rationale: Cette tournure française claire conserve le parallèle οὕτως… καί entre la soudaineté du déluge et la venue du Fils de l’homme, sans développer davantage la nature exacte de la ressemblance.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste concise et maintient la tension du texte entre ignorance, absence de perception et soudaineté du jugement.
