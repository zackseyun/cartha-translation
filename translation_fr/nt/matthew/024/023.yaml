id: MAT.24.23
reference: Matthew 24:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἐάν τις ὑμῖν εἴπῃ· Ἰδοὺ ὧδε ὁ χριστός, ἤ· Ὧδε, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/023.yaml
  text: Then if anyone says to you[a], ‘Look, here is the Messiah!’ or[b], ‘There he is!’ do not believe it.
translation:
  language: fr
  text: 'Alors, si quelqu’un vous dit : « Regardez, le Messie[a] est ici ! » ou : « Le voilà ! »[b], ne le croyez pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « Ici ! » Le grec est elliptique.'
    reason: source_ambiguity
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque le lien temporel et logique avec la suite du discours eschatologique; « Alors » est naturel en français contemporain.
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: si quelqu’un vous dit
  rationale: Rend directement la condition et le sujet indéfini sans restreindre son référent.
- source_word: Ἰδοὺ
  choice: Regardez
  rationale: Interpellation destinée à attirer l’attention; ce choix conserve sa force sans recourir à l’archaïsme « Voici que ».
- source_word: ὧδε
  choice: ici
  rationale: Adverbe de lieu désignant l’endroit présenté par celui qui parle.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: L’article et le contexte d’identification montrent que χριστός fonctionne ici comme le titre du libérateur attendu, plutôt que comme un nom propre.
- source_word: ἤ· Ὧδε
  choice: 'ou : « Le voilà ! »'
  rationale: Le grec est elliptique et répète seulement l’indication de lieu. « Le voilà ! » restitue naturellement en français l’affirmation déictique sous-entendue sans expliciter davantage l’identité.
- source_word: μὴ πιστεύσητε
  choice: ne le croyez pas
  rationale: L’objet pronominal renvoie naturellement à ce qui vient d’être affirmé, sans faire du locuteur lui-même l’objet explicite de la mise en garde.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette annonce d’une prétendue localisation du libérateur attendu, le terme porte clairement sa valeur de titre. « Le Messie » rend cette fonction, tandis que « le Christ » demeure une traduction traditionnelle valable signalée en note.
- issue: Référent de l’interdiction de croire
  choice: ne le croyez pas, visant l’affirmation
  alternative: ne croyez pas cette personne
  rationale: Le grec n’exprime aucun complément. Le pronom français permet une formulation idiomatique tout en visant prioritairement la prétention rapportée, sans trancher au-delà du texte contre la possibilité plus générale de ne pas se fier au locuteur.
translation_notes:
  register: Français international moderne, clair et digne. « Regardez » garde la vivacité de l’interpellation; « Le voilà ! » rend l’ellipse grecque de manière naturelle. La ponctuation maintient les deux prétentions comme discours direct.
