  text: πάντα δὲ ταῦτα ἀρχὴ ὠδίνων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/008.yaml
  text: But all these things are the beginning of birth pains[a].
translation:
  language: fr
  text: Mais tout cela est le début des douleurs de l’enfantement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « douleurs de l’accouchement » ou « douleurs du travail ». Le grec évoque les douleurs de l’enfantement comme image du début des détresses à venir.
    reason: alternative lexicale et clarification de la métaphore
lexical_decisions:
- source_word: πάντα δὲ ταῦτα
  choice: Mais tout cela
  rationale: La tournure regroupe l’ensemble des événements précédemment mentionnés. « Mais » rend la transition légèrement contrastive de δέ, et « tout cela » est idiomatique en français.
- source_word: ἀρχὴ
  choice: le début
  rationale: Le nom désigne ici la première étape d’un processus. La construction française appelle naturellement l’article défini.
- source_word: ὠδίνων
  choice: douleurs de l’accouchement
  rationale: Le terme évoque précisément les douleurs liées à l’enfantement. Cette formulation moderne et claire conserve l’image sans la réduire à de simples souffrances.
theological_decisions:
- issue: Force métaphorique de ὠδίνων
  choice: Conserver explicitement l’image des douleurs de l’accouchement.
  alternative: Rendre le terme par « souffrances », « détresses » ou « douleurs de l’enfantement ».
  rationale: L’image présente les bouleversements précédents comme le commencement douloureux d’un processus, sans préciser ici davantage son déroulement eschatologique.
- issue: Portée de ἀρχὴ
  choice: « n’est que le début »
  alternative: « est le début »
  rationale: La locution française souligne naturellement que les événements évoqués ne constituent pas encore l’aboutissement, ce qui correspond au contraste contextuel, sans ajouter de chronologie doctrinale détaillée.
translation_notes:
  register: Français international moderne, naturel et digne. Le singulier collectif « tout cela » entraîne « n’est ». L’image obstétricale du grec est conservée explicitement.
