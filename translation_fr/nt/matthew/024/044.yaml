  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο καὶ ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ⸂οὐ δοκεῖτε ὥρᾳ⸃ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/044.yaml
  text: For this reason[a], you also must be ready, because the Son of Man is coming at an hour you do not expect.
translation:
  language: fr
  text: C’est pourquoi, vous aussi, soyez prêts, car le Fils de l’homme vient à une heure où vous ne vous y attendez pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à une heure où vous n’y pensez pas ». Le verbe grec peut signifier « penser », « supposer » ou, par implication dans ce contexte, « s’attendre à ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette expression renvoie à l’avertissement précédent et en tire la conséquence. « C’est pourquoi » exprime naturellement en français ce lien causal et logique.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: Le pronom explicite et καί soulignent que les disciples sont eux aussi concernés par l’avertissement.
- source_word: γίνεσθε ἕτοιμοι
  choice: soyez prêts
  rationale: L’impératif présent appelle à adopter et à maintenir un état de préparation. « Soyez prêts » transmet clairement cet ordre sans imposer le sens trop strictement progressif de « devenez prêts ».
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit ici la raison de l’ordre. « Car » convient au registre digne du passage tout en restant courant.
- source_word: ᾗ οὐ δοκεῖτε ὥρᾳ
  choice: à une heure où vous ne l’attendez pas
  rationale: La construction au datif est temporelle. Dans ce contexte d’avertissement, « attendre » exprime naturellement le sens implicite de δοκέω, tout en signalant en note son sens plus littéral de « penser » ou « supposer ».
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette traduction traditionnelle et proche de la forme grecque conserve le titre christologique, son arrière-plan sémitique et sa possible résonance avec Daniel.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent grec présente la venue avec vivacité et peut avoir une portée future. Le présent français « vient » conserve cette forme sans la convertir inutilement en futur.
theological_decisions:
- issue: Traduction du titre christologique ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: « Le Fils de l’homme » préserve la formulation du titre, sa profondeur théologique et ses résonances scripturaires sans en fixer davantage l’interprétation. « L’Humain » serait plus explicatif et moins conforme à l’usage évangélique établi.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde le lien explicite avec le contexte, l’impératif direct et le présent vivant de ἔρχεται. Le marqueur de note est placé après l’expression qu’il précise.
