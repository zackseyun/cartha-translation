  text: τότε ⸂δύο ἔσονται⸃ ἐν τῷ ἀγρῷ, ⸀εἷς παραλαμβάνεται καὶ ⸁εἷς ἀφίεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/040.yaml
  text: Then two men will be in the field; one is taken and one is left.
translation:
  language: fr
  text: 'Alors, deux hommes seront dans le champ : l’un sera pris[a] et l’autre sera laissé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « emmené ». Le verbe ne précise pas à lui seul si la personne est prise pour être sauvée ou pour subir un jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement le lien temporel avec le contexte eschatologique précédent, sans alourdir la phrase.
- source_word: δύο ἔσονται
  choice: deux hommes seront
  rationale: Le grec dit littéralement « deux seront », mais les formes masculines εἷς… εἷς, mises en parallèle avec les femmes du verset suivant, indiquent ici deux hommes. Le nom est explicité pour obtenir un français naturel et précis.
- source_word: ἐν τῷ ἀγρῷ
  choice: dans le champ
  rationale: Rend directement la localisation exprimée par le grec, dans une formulation française courante.
- source_word: εἷς … εἷς
  choice: l’un … l’autre
  rationale: Cette tournure idiomatique française restitue clairement l’opposition concise entre les deux personnes.
- source_word: παραλαμβάνεται
  choice: sera pris
  rationale: Le présent passif grec décrit une scène future. « Sera pris » reste sobre et ne précise pas à lui seul si cette prise correspond à un salut ou à un jugement.
- source_word: ἀφίεται
  choice: laissé
  rationale: « Laissé » conserve le contraste avec « pris » sans ajouter « derrière », expression susceptible d’introduire des associations eschatologiques étrangères au seul verbe.
theological_decisions:
- issue: La prise désignée par παραλαμβάνεται correspond-elle au salut ou au jugement ?
  choice: Conserver la formulation neutre « sera pris » dans le texte principal.
  alternative: « sera emmené » ou une formulation explicitant soit une délivrance, soit un jugement
  rationale: Le verbe et le contexte font l’objet d’interprétations concurrentes. La traduction ne doit pas trancher une tension que le texte ne résout pas explicitement.
- issue: Faut-il expliciter que les deux personnes sont des hommes ?
  choice: « deux hommes »
  alternative: « deux personnes » ou simplement « deux »
  rationale: Les deux occurrences de εἷς sont masculines et la scène forme un parallèle avec les deux femmes du verset suivant. « Deux hommes » rend cette distinction sans neutraliser le texte source.
translation_notes:
  register: Français international moderne, simple et digne. Le futur rend naturellement la scène annoncée, tandis que l’ellipse « l’autre laissé » conserve le parallélisme serré du grec.
