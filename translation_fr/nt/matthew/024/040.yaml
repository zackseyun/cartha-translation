  source_fidelity: 'Le sens et le contraste du grec sont bien rendus : τότε est correctement relié par « Alors », les deux référents masculins sont explicités de façon défendable au vu du parallèle féminin du verset suivant, et « pris / laissé » maintient l’ambiguïté de παραλαμβάνεται. Le grec comporte toutefois un verbe passif dans les deux membres (« est pris » et « est laissé ») ; il est préférable de le restituer dans les deux membres en français.'
  naturalness: « L’un sera pris et l’autre laissé » est compréhensible, mais l’ellipse de « sera » dans le second membre est moins naturelle et affaiblit le parallélisme verbal. « L’un sera pris et l’autre sera laissé » est clair, courant et rythmiquement équilibré.
