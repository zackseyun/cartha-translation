  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης καὶ ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν ⸂οὐδὲ ὁ υἱός⸃, εἰ μὴ ὁ ⸀πατὴρ μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/036.yaml
  text: But concerning that day and hour[a], no one knows—not even the angels of heaven, nor the Son—except the Father alone.
translation:
  language: fr
  text: Mais, pour ce qui est de ce jour et de cette heure[a], personne ne connaît ni ce jour ni cette heure, pas même les anges des cieux ni le Fils, si ce n’est le Père seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent « ni le Fils ». Le texte principal suit la lecture du SBLGNT.
    reason: textual_variant
lexical_decisions:
- source_word: Περὶ δὲ
  choice: Mais pour ce qui est de
  rationale: περί avec le génitif introduit le sujet, tandis que δέ marque ici une transition légèrement contrastive. Cette tournure est naturelle en français moderne et conserve ces deux nuances.
- source_word: τῆς ἡμέρας ἐκείνης καὶ ὥρας
  choice: ce jour et cette heure
  rationale: Le démonstratif grec porte naturellement sur l'ensemble coordonné. En français, sa répétition devant « heure » est idiomatique et évite toute lourdeur ou ambiguïté.
- source_word: οὐδεὶς οἶδεν
  choice: personne ne les connaît
  rationale: οὐδείς exprime une négation universelle. Le pronom « les » reprend clairement le jour et l'heure; « connaître » convient à un moment ou à une date déterminés.
- source_word: οὐδὲ οἱ ἄγγελοι τῶν οὐρανῶν
  choice: pas même les anges des cieux
  rationale: οὐδέ a ici une valeur additive et emphatique, bien rendue par « pas même ». Le pluriel « des cieux » reflète τῶν οὐρανῶν tout en restant biblique et intelligible.
- source_word: οὐδὲ ὁ υἱός
  choice: ni le Fils
  rationale: La coordination négative est naturellement rendue par « ni » après « pas même ». L'article signale le titre reconnu « le Fils ».
- source_word: εἰ μὴ
  choice: mais
  rationale: Après une proposition négative, εἰ μή introduit l'exception. En français, « mais le Père seul » exprime naturellement cette restriction exclusive.
- source_word: ὁ πατὴρ μόνος
  choice: le Père seul
  rationale: μόνος réserve exclusivement cette connaissance au Père. « Le Père seul » conserve cette portée sans ajout interprétatif.
theological_decisions:
- issue: Portée christologique de « ni le Fils »
  choice: Conserver « ni le Fils » dans le texte principal sans l'atténuer ni l'expliquer.
  alternative: Omettre cette proposition selon une partie de la tradition manuscrite, ou la paraphraser afin d'en réduire la tension théologique.
  rationale: Le texte du SBLGNT contient οὐδὲ ὁ υἱός. La traduction préserve donc l'affirmation et sa tension théologique, sans tenter de la résoudre dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche du grec, avec une formulation idiomatique. « Des cieux » conserve le pluriel de la source; « mais le Père seul » rend naturellement l'exception exclusive.
