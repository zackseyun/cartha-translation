id: MAT.24.3
reference: Matthew 24:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ Ὄρους τῶν Ἐλαιῶν προσῆλθον αὐτῷ οἱ μαθηταὶ κατ’ ἰδίαν λέγοντες· Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον τῆς σῆς παρουσίας ⸀καὶ συντελείας τοῦ αἰῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/003.yaml
  text: As he was sitting on the Mount of Olives[a], the disciples came to him privately, saying, “Tell us, when will these things be[b], and what will be the sign of your coming and of the end of the age?”
translation:
  language: fr
  text: 'Alors qu’il était assis sur le mont des Oliviers, les disciples s’approchèrent de lui à part et lui dirent : « Dis-nous, quand tout cela arrivera-t-il, et quel sera le signe de ta venue[a] et de la fin de l’âge[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « présence » ou « arrivée ».'
    reason: Alternative lexicale pour παρουσία.
  - marker: b
    text: 'Ou : « achèvement de l’âge » ; traditionnellement : « fin du monde ».'
    reason: Préserve la nuance de συντέλεια et signale la formulation traditionnelle sans confondre αἰών avec le monde physique.
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ
  choice: Alors qu’il était assis
  rationale: Le génitif absolu exprime ici une circonstance temporelle. Cette formulation française rend naturellement l’action en cours.
- source_word: Ὄρους τῶν Ἐλαιῶν
  choice: mont des Oliviers
  rationale: Nom géographique consacré en français, correspondant littéralement à « mont des olives ».
- source_word: προσῆλθον αὐτῷ
  choice: s’approchèrent de lui
  rationale: Rend clairement le mouvement des disciples vers Jésus dans ce contexte narratif.
- source_word: κατ’ ἰδίαν
  choice: en privé
  rationale: Expression française actuelle et concise indiquant qu’ils sont à l’écart des autres.
- source_word: Εἰπὸν ἡμῖν
  choice: Dis-nous
  rationale: Équivalent idiomatique direct de l’impératif grec.
- source_word: πότε ταῦτα ἔσται
  choice: quand tout cela arrivera-t-il
  rationale: « Tout cela » reprend naturellement en français les événements précédemment évoqués, tandis que « arrivera » exprime ici le sens contextuel du verbe être au futur.
- source_word: σημεῖον
  choice: signe
  rationale: Équivalent français usuel dans un contexte eschatologique, sans précision interprétative supplémentaire.
- source_word: παρουσίας
  choice: venue
  rationale: Dans cette question tournée vers l’avenir, « venue » exprime à la fois l’arrivée et la manifestation personnelle, tout en laissant en note les autres valeurs lexicales possibles.
- source_word: συντελείας
  choice: fin
  rationale: Choix naturel et compréhensible en français ; le sens plus formel d’« achèvement » est signalé en note.
- source_word: αἰῶνος
  choice: ère
  rationale: Le grec désigne un âge ou une époque, non explicitement le monde physique. « Ère » conserve cette distinction.
theological_decisions:
- issue: Sens eschatologique de παρουσία
  choice: venue
  alternative: présence ou arrivée
  rationale: « Venue » convient à l’orientation future de la question sans préciser la manière ni le calendrier de l’événement. Les autres sens réels du terme grec sont conservés en note.
- issue: Sens de συντελείας τοῦ αἰῶνος
  choice: fin de l’ère
  alternative: achèvement de l’ère ; traditionnellement, fin du monde
  rationale: Cette traduction suit la portée du grec, qui parle de l’aboutissement d’un âge ou d’une ère, sans imposer l’idée plus forte de la destruction du monde physique.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste direct ; « tout cela » est plus idiomatique que le calque « ces choses », et « fin de l’ère » préserve la distinction sémantique du grec.
