  source_fidelity: 'Le rendu reflète bien la progression du grec : perspective future de μελλήσετε, distinction entre guerres et informations les concernant, exhortation à ne pas être alarmés, nécessité exprimée par δεῖ, et caractère non encore advenu de la fin. Toutefois, « ce ne sera pas encore la fin » transforme la proposition grecque au présent (οὔπω ἐστὶν τὸ τέλος) en futur. « Ce n’est pas encore la fin » reproduit plus exactement l’assertion et reste naturel dans le contexte.'
