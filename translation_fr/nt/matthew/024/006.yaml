id: MAT.24.6
reference: Matthew 24:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μελλήσετε δὲ ἀκούειν πολέμους καὶ ἀκοὰς πολέμων· ὁρᾶτε, μὴ θροεῖσθε· δεῖ ⸀γὰρ γενέσθαι, ἀλλ’ οὔπω ἐστὶν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/006.yaml
  text: And you are going to hear of wars and reports of wars. See that you are not alarmed[a], for it must happen, but the end is not yet.
translation:
  language: fr
  text: Vous allez entendre parler de guerres et de nouvelles de guerres[a]. Veillez à ne pas vous alarmer, car il faut que cela arrive, mais ce n’est pas encore la fin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des rumeurs de guerres ». Le terme grec peut désigner des informations, des nouvelles ou des rumeurs.
    reason: alternative lexicale
lexical_decisions:
- source_word: μελλήσετε
  choice: vous allez
  rationale: Le futur de μέλλω avec l’infinitif présente ici ce qui est attendu ou sur le point de se produire. « Vous allez entendre » en conserve la valeur prospective dans un français naturel.
- source_word: ἀκούειν πολέμους
  choice: entendre parler de guerres
  rationale: Dans ce contexte, il s’agit d’apprendre l’existence de guerres plutôt que d’en entendre directement les sons ; « entendre parler de » l’exprime idiomatiquement.
- source_word: ἀκοὰς πολέμων
  choice: des nouvelles concernant des guerres
  rationale: ἀκοή peut désigner ce qui est entendu, une nouvelle ou une information. « Nouvelles » ne suppose pas, contrairement à « rumeurs », que l’information soit incertaine ou fausse.
- source_word: ὁρᾶτε, μὴ θροεῖσθε
  choice: Veillez à ne pas vous alarmer
  rationale: L’impératif ὁρᾶτε introduit une mise en garde, tandis que θροέομαι évoque le trouble ou l’affolement. Cette formulation est claire, digne et n’exagère pas l’intensité de l’émotion.
- source_word: δεῖ γὰρ γενέσθαι
  choice: car il faut que cela arrive
  rationale: δεῖ exprime une nécessité et γενέσθαι signifie ici « arriver » ou « se produire ». Le pronom neutre « cela » reprend sans l’élargir explicitement ce qui précède.
- source_word: ἀλλ’ οὔπω ἐστὶν τὸ τέλος
  choice: mais ce ne sera pas encore la fin
  rationale: Cette formulation française naturelle conserve la négation temporelle οὔπω et laisse à « la fin » la portée générale du grec.
theological_decisions:
- issue: Portée eschatologique de τὸ τέλος
  choice: la fin
  alternative: l’accomplissement final
  rationale: « La fin » préserve l’expression large du grec sans l’identifier à un scénario eschatologique particulier.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite l’expression traditionnelle « bruits de guerres », aujourd’hui moins transparente, tout en en conservant le sens possible dans la note.
