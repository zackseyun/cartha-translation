  text: ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/013.yaml
  text: But the one who endures to the end will be saved[a][b].
translation:
  language: fr
  text: Mais celui qui tiendra bon jusqu’à la fin sera sauvé[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « jusqu’au bout ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sera délivré ». Le verbe grec peut désigner la délivrance ou le salut; la formulation retenue garde ici ce sens large.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un contraste avec les avertissements précédents; « Mais » le rend clairement et naturellement.
- source_word: ὁ ... ὑπομείνας
  choice: celui qui tiendra bon
  rationale: L’article et le participe aoriste forment une expression substantivée désignant la personne qui persévère. Le futur français convient à la portée prospective de l’énoncé, et « tenir bon » exprime de façon courante l’endurance sous l’épreuve.
- source_word: εἰς τέλος
  choice: jusqu’à la fin
  rationale: La locution indique la continuité jusqu’au terme; « jusqu’à la fin » est idiomatique et conserve la portée sans préciser de quelle fin il s’agit.
- source_word: οὗτος
  choice: rendu par la mise en relief de « celui qui… »
  rationale: Le démonstratif reprend avec insistance la personne déjà désignée. En français naturel, cette insistance est suffisamment portée par la construction « celui qui… sera »; ajouter « celui-là » serait possible, mais plus lourd.
- source_word: σωθήσεται
  choice: sera sauvé
  rationale: Le futur passif de σῴζω peut évoquer le salut ou la délivrance. « Sera sauvé » conserve ici la portée large et la tension eschatologique du grec.
theological_decisions:
- issue: Portée de σωθήσεται dans un contexte d’endurance eschatologique
  choice: Conserver « sera sauvé » sans définir davantage la nature du salut.
  alternative: « sera délivré » ou « obtiendra le salut final »
  rationale: Le verset ne précise pas si le mot vise principalement la délivrance au milieu de l’épreuve, le salut eschatologique final, ou les deux. La traduction ne tranche donc pas cette question.
translation_notes:
  register: Français international moderne, digne et accessible. « Tenir bon » est naturel sans être familier et communique l’endurance sous la pression. Les marqueurs [a] et [b] figurent dans le texte.
