id: MAT.24.9
reference: Matthew 24:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε παραδώσουσιν ὑμᾶς εἰς θλῖψιν καὶ ἀποκτενοῦσιν ὑμᾶς, καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων τῶν ἐθνῶν διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/009.yaml
  text: Then they will hand you over to affliction and kill you[c][b][a], and you will be hated by all the nations because of my name.
translation:
  language: fr
  text: Alors, on vous livrera à la détresse[a] et on vous tuera. Vous serez haïs par toutes les nations[b] à cause de mon nom[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’affliction », « à la persécution » ou « à la tribulation ». Le mot grec peut désigner la détresse, l’oppression ou une épreuve accablante.
    reason: lexical_alternative
  - marker: b
    text: Ou « par tous les peuples » ; dans certains contextes, le mot grec peut aussi désigner les non-Juifs.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement « à cause de mon nom » : c’est-à-dire à cause de leur attachement à Jésus et de ce que son nom représente.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement la progression temporelle du discours prophétique.
- source_word: παραδώσουσιν ὑμᾶς
  choice: on vous livrera
  rationale: Rend l’idée de remettre quelqu’un au pouvoir d’autrui sans préciser indûment une trahison; le « on » français convient à l’agent indéfini du pluriel grec.
- source_word: εἰς θλῖψιν
  choice: à la détresse
  rationale: « Détresse » couvre l’épreuve, l’oppression et l’affliction, tout en gardant la gravité du contexte eschatologique sans imposer un sens technique.
- source_word: ἀποκτενοῦσιν ὑμᾶς
  choice: on vous fera mourir
  rationale: Expression française naturelle pour la mise à mort; elle n’ajoute pas la nuance morale spécifique de « meurtre ».
- source_word: ἔσεσθε μισούμενοι
  choice: vous serez détestés
  rationale: Rend directement la construction périphrastique grecque au futur passif dans un français courant.
- source_word: ὑπὸ πάντων τῶν ἐθνῶν
  choice: par toutes les nations
  rationale: Préserve la portée universelle la plus probable; « nations » conserve aussi l’ambiguïté lexicale mieux que « non-Juifs ».
- source_word: διὰ τὸ ὄνομά μου
  choice: à cause de mon nom
  rationale: Reproduit le motif causal et conserve le langage biblique du « nom », qui représente la personne de Jésus et l’attachement à lui.
theological_decisions:
- issue: Portée de θλῖψις dans le discours eschatologique
  choice: détresse
  alternative: persécution; affliction; tribulation
  rationale: « Détresse » garde à la fois le sens ordinaire de souffrance sous oppression et la possible résonance eschatologique, sans transformer le terme en catégorie doctrinale technique.
- issue: Sens de ἔθνη
  choice: nations
  alternative: non-Juifs
  rationale: Dans ce contexte, l’hostilité de portée mondiale est plus vraisemblable qu’une opposition ethnique strictement définie; la note conserve l’autre possibilité lexicale.
- issue: Sens de « mon nom »
  choice: conserver l’expression littérale
  alternative: à cause de votre attachement à moi
  rationale: Le texte relie la haine au nom de Jésus. La traduction préserve cette formulation théologiquement riche, tandis que la note en explicite le sens sans la remplacer.
translation_notes:
  register: Français international moderne, digne et accessible. « On vous livrera » évite un « ils » sans antécédent explicite en français. La phrase est divisée en deux pour une lecture naturelle, sans modifier les rapports logiques du grec.
