id: MAT.24.45
reference: Matthew 24:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τίς ἄρα ἐστὶν ὁ πιστὸς δοῦλος καὶ φρόνιμος ὃν κατέστησεν ὁ ⸀κύριος ἐπὶ τῆς ⸀οἰκετείας αὐτοῦ τοῦ ⸀δοῦναι αὐτοῖς τὴν τροφὴν ἐν καιρῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/045.yaml
  text: Who then is the faithful and wise slave[b][a], whom the master has appointed over his household to give them their food at the proper time?
translation:
  language: fr
  text: Quel est donc l’esclave fidèle et avisé[a] que le maître[b] a établi responsable des gens de sa maison pour leur donner leur nourriture au moment voulu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot grec peut désigner un esclave ou un serviteur selon le contexte; ici, « esclave » conserve plus nettement l’idée d’une personne soumise à l’autorité d’un maître.
    reason: lexical_alternative
  - marker: b
    text: Ou « Seigneur ». Dans cette image d’une maisonnée, « maître » correspond au cadre social immédiat de la parabole.
    reason: alternative_reading
lexical_decisions:
- source_word: Τίς ἄρα
  choice: Quel est donc
  rationale: Cette formulation naturelle conserve la force interrogative et la valeur déductive ou continuative de ἄρα dans le discours.
- source_word: πιστὸς
  choice: fidèle
  rationale: « Fidèle » exprime ici la fiabilité dans l’accomplissement d’une responsabilité confiée, tout en conservant la portée morale du terme grec.
- source_word: δοῦλος
  choice: esclave
  rationale: Dans cette scène domestique, δοῦλος désigne une personne soumise à l’autorité d’un maître. « Esclave » en préserve la force sociale, tandis que « serviteur » est signalé en note comme autre traduction possible.
- source_word: φρόνιμος
  choice: avisé
  rationale: φρόνιμος évoque une sagesse pratique et prudente. « Avisé » rend ce trait avec naturel en français moderne et évite de réduire le terme à une connaissance abstraite.
- source_word: κατέστησεν
  choice: a établi responsable
  rationale: Le verbe exprime ici le fait de placer quelqu’un dans une fonction d’autorité et de responsabilité. Cette tournure rend explicitement ce sens en français naturel.
- source_word: κύριος
  choice: maître
  rationale: Dans l’image d’une maison administrée par des personnes placées sous autorité, « maître » exprime le rapport social immédiat mieux que le titre « Seigneur ».
- source_word: οἰκετείας
  choice: les gens de sa maison
  rationale: οἰκετεία désigne ici la maisonnée, particulièrement les personnes qui la composent. Cette traduction rend naturel le pluriel αὐτοῖς (« leur ») qui suit.
- source_word: τοῦ δοῦναι
  choice: pour leur donner
  rationale: L’infinitif articulé exprime le but de la nomination; « pour leur donner » en restitue clairement la valeur finale.
- source_word: τροφὴν
  choice: leur nourriture
  rationale: τροφή signifie la nourriture ou la subsistance. La formulation reste concrète sans préciser indûment qu’il s’agit de rations déterminées.
- source_word: ἐν καιρῷ
  choice: au moment voulu
  rationale: καιρός désigne le moment approprié ou prévu. « Au moment voulu » conserve cette nuance plutôt que celle d’un simple repère chronologique.
theological_decisions:
- issue: Traduction de κύριος dans l’image de la maisonnée
  choice: maître
  alternative: Seigneur
  rationale: Le sens immédiat relève du rapport entre le maître d’une maison et l’esclave auquel il délègue une charge. « Maître » préserve donc l’image sociale sans nier que, dans l’application plus large du discours, ce personnage puisse représenter le Seigneur.
- issue: Force sociale de δοῦλος
  choice: esclave
  alternative: serviteur
  rationale: « Esclave » maintient la dépendance et la soumission à l’autorité présentes dans le terme grec et dans la scène. « Serviteur » demeure lexicalement possible, mais atténue ce statut; il est donc conservé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la question rhétorique du grec. « Les gens de sa maison » évite l’ambiguïté possible de « maisonnée » et fournit un antécédent personnel naturel à « leur ».
