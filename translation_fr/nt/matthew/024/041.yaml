  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δύο ἀλήθουσαι ἐν τῷ ⸀μύλῳ, μία παραλαμβάνεται καὶ μία ἀφίεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/041.yaml
  text: Two women will be grinding at the mill[c][b][a]; one is taken and one is left.
translation:
  language: fr
  text: 'Deux femmes moudront au moulin[a] : l’une sera prise et l’autre sera laissée[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la meule » ou « au moulin à bras »; le grec peut désigner plus précisément l’appareil ou la pierre servant à moudre.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit simplement que l’une est prise et que l’autre est laissée, sans préciser ici si le fait d’être prise est en vue du salut ou du jugement.
    reason: alternative_reading
lexical_decisions:
- source_word: δύο ἀλήθουσαι
  choice: Deux femmes moudront
  rationale: Le participe présent actif ἀλήθουσαι est au féminin pluriel et signifie « moudre ». Le français doit donc expliciter qu’il s’agit de femmes. Le futur restitue naturellement, dans ce contexte eschatologique, la scène annoncée.
- source_word: ἐν τῷ μύλῳ
  choice: au moulin
  rationale: μύλος peut désigner le moulin, la meule ou l’appareil manuel servant à moudre. « Au moulin » reste naturel et évite de préciser indûment le type d’installation.
- source_word: μία παραλαμβάνεται
  choice: l’une sera prise
  rationale: Le passif de παραλαμβάνω est rendu directement, sans préciser si cette prise conduit au salut ou au jugement.
- source_word: καὶ μία ἀφίεται
  choice: et l’autre sera laissée
  rationale: La coordination simple καί est conservée. « Sera laissée » traduit sobrement le passif de ἀφίημι sans ajouter « derrière » ni donner à l’action une valeur théologique non explicitée.
theological_decisions:
- issue: Sens eschatologique de « prise » et de « laissée »
  choice: Conserver les formulations neutres « sera prise » et « sera laissée »
  alternative: Préciser que l’une est prise pour être sauvée ou jugée, et que l’autre est épargnée ou abandonnée
  rationale: Le verset décrit une séparation sans indiquer explicitement ici laquelle des deux situations correspond au salut ou au jugement. La traduction préserve cette tension interprétative.
- issue: Identification des sujets féminins
  choice: Expliciter « deux femmes »
  alternative: Traduire seulement « deux personnes » ou « deux »
  rationale: La forme féminine plurielle de ἀλήθουσαι identifie réellement les sujets comme des femmes; l’explicitation est donc grammaticale plutôt qu’interprétative.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme « l’une… l’autre » est idiomatique et reflète la distinction entre les deux femmes. La répétition de « sera » donne à chaque proposition sa pleine force tout en maintenant l’ambiguïté du texte grec.
