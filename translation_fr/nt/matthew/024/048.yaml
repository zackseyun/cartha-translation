id: MAT.24.48
reference: Matthew 24:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ κακὸς δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ⸂μου ὁ κύριος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/048.yaml
  text: But if that wicked servant says in his heart[b][a], ‘My master is delaying,’
translation:
  language: fr
  text: 'Mais si ce mauvais serviteur[a] se dit dans son cœur : « Mon maître[b] tarde »,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce mauvais esclave ». Le mot grec doulos peut désigner un serviteur ou un esclave, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « Mon seigneur ». Ici, « maître » correspond au cadre domestique de la parabole; le mot grec est kyrios.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ
  choice: Mais si
  rationale: ἐὰν avec le subjonctif introduit une éventualité conditionnelle, tandis que δέ marque ici un léger contraste avec ce qui précède.
- source_word: εἴπῃ
  choice: se dit
  rationale: Dans l’expression « dire dans son cœur », le verbe désigne une parole intérieure. La tournure pronominale est naturelle en français tout en maintenant explicitement la métaphore du cœur.
- source_word: ὁ κακὸς δοῦλος ἐκεῖνος
  choice: ce mauvais serviteur
  rationale: κακός porte ici un jugement moral; « mauvais » convient au français courant et digne. δοῦλος désigne le serviteur placé sous l’autorité du maître dans le cadre domestique de la parabole; « esclave » demeure possible et est signalé en note. Le démonstratif ἐκεῖνος est rendu par « ce ».
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: dans son cœur
  rationale: Cette traduction conserve la métaphore grecque de la pensée intérieure et reste immédiatement compréhensible en français biblique moderne.
- source_word: Χρονίζει
  choice: tarde
  rationale: Le présent exprime le délai tel que le serviteur le perçoit. « Tarde » rend le sens sans ajouter explicitement une venue, que le grec ne mentionne pas dans cette proposition.
- source_word: μου ὁ κύριος
  choice: Mon maître
  rationale: Dans le cadre domestique immédiat, κύριος désigne le supérieur du serviteur. « Maître » exprime clairement cette relation, tandis que le possessif μου est naturellement placé devant le nom en français.
theological_decisions:
- issue: Traduction de κύριος dans le cadre domestique d’une parabole
  choice: maître
  alternative: Seigneur
  rationale: Le récit présente le κύριος comme le supérieur du δοῦλος au sein d’une maison. « Maître » respecte ce sens narratif immédiat sans effacer la portée possible de la parabole dans le discours sur le Fils de l’homme; « Seigneur » reste lexicalement possible et figure en note.
- issue: Traduction de δοῦλος
  choice: serviteur
  alternative: esclave
  rationale: Le contexte met au premier plan la fonction confiée à cet homme dans la maison. « Serviteur » est donc retenu dans le texte, sans nier que δοῦλος puisse aussi désigner un esclave; cette autre valeur est conservée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve l’image biblique du cœur comme lieu de la pensée intérieure. « Mauvais » et « serviteur » sont courants sans être familiers; « tarde » maintient la concision et l’ambiguïté du grec.
