id: MAT.24.34
reference: Matthew 24:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα ταῦτα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/034.yaml
  text: Truly I tell you that this generation will certainly not pass away until all these things happen[a].
translation:
  language: fr
  text: 'En vérité, je vous le dis : cette génération ne passera certainement pas avant que toutes ces choses n’arrivent[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce peuple » ou « cette race ». Le mot grec peut avoir un sens plus large, mais « génération » est ici la traduction la plus directe.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: En vérité
  rationale: Dans la formule solennelle des Synoptiques, « En vérité » transmet naturellement l’affirmation appuyée introduite par ἀμήν, tout en gardant un registre digne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formulation française idiomatique qui conserve l’adresse directe et la solennité de la déclaration.
- source_word: ὅτι
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement le contenu de la déclaration après « je vous le dis », sans qu’un équivalent lexical distinct de ὅτι soit nécessaire.
- source_word: οὐ μὴ παρέλθῃ
  choice: ne passera certainement pas
  rationale: La tournure rend la négation grecque fortement emphatique sans recourir à une formulation archaïque.
- source_word: ἡ γενεὰ αὕτη
  choice: cette génération
  rationale: « Génération » est le sens le plus direct dans ce contexte et préserve la question interprétative sans imposer un cadre eschatologique particulier.
- source_word: ἕως ἂν
  choice: avant que
  rationale: Avec le verbe « passer », « ne passera pas avant que » est une formulation française naturelle qui exprime la limite temporelle future marquée par ἕως ἄν.
- source_word: πάντα ταῦτα
  choice: toutes ces choses
  rationale: Cette formulation représente explicitement le pluriel neutre et renvoie à l’ensemble des événements évoqués dans le discours.
- source_word: γένηται
  choice: n’arrivent
  rationale: Dans ce contexte événementiel, « arriver » rend γίνομαι en français courant et naturel.
theological_decisions:
- issue: Sens de « cette génération » (ἡ γενεὰ αὕτη) dans le discours eschatologique
  choice: Traduire directement par « cette génération », sans développement interprétatif.
  alternative: « ce peuple » ou « cette race »
  rationale: Le rendu principal conserve le sens lexical le plus immédiat ainsi que la tension interprétative du passage, sans introduire une lecture eschatologique confessionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La formule « En vérité, je vous le dis » conserve la solennité traditionnelle tout en restant compréhensible; l’ordre et la ponctuation rendent la phrase naturelle en français.
