id: MAT.24.17
reference: Matthew 24:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω ἆραι τὰ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/017.yaml
  text: Let the one on the housetop not go down to take the things out of his house,[a]
translation:
  language: fr
  text: Que celui qui est sur le toit[a] ne descende pas prendre ce qui se trouve dans sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit du toit plat et accessible d’une maison, qui pouvait servir d’espace de vie.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: celui qui est sur le toit
  rationale: La tournure grecque avec article fonctionne comme un substantif et désigne « celui qui est sur le toit ». Cette formulation française conserve le singulier représentatif sans ajouter le mot « homme ».
- source_word: δώματος
  choice: toit
  rationale: Le terme désigne le toit ou la partie supérieure d’une maison, souvent plate et utilisable dans le contexte méditerranéen ancien. « Toit » est le terme français moderne le plus naturel; la note précise la réalité architecturale.
- source_word: μὴ καταβάτω
  choice: ne descende pas
  rationale: L’impératif grec exprime une interdiction urgente. Le subjonctif français après « que » rend naturellement cette directive et conserve l’idée concrète de descendre du toit.
- source_word: ἆραι
  choice: prendre
  rationale: L’infinitif indique ici le but de la descente. « Prendre » rend directement αἴρω sans préciser davantage la nature ou le déplacement des objets.
- source_word: τὰ ἐκ τῆς οἰκίας αὐτοῦ
  choice: ce qui se trouve dans sa maison
  rationale: Le neutre pluriel grec est elliptique et renvoie aux choses ou biens provenant de la maison. La formulation choisie est idiomatique en français et préserve une certaine indétermination plutôt que d’expliciter « ses affaires ».
- source_word: οἰκίας
  choice: maison
  rationale: Le contexte met en avant le bâtiment physique dont on descend du toit; « maison » convient donc mieux que « chez lui » ou une formulation affective comme « foyer ».
- source_word: αὐτοῦ
  choice: sa
  rationale: Le possessif masculin singulier correspond au sujet représentatif singulier du grec. En français, « sa » s’accorde grammaticalement avec « maison » tout en renvoyant à « celui ».
theological_decisions:
- issue: Masculin singulier à valeur représentative
  choice: Conserver « celui » et le possessif singulier « sa »
  alternative: Employer « quiconque » avec une reformulation neutralisée ou passer au pluriel
  rationale: Le grec emploie une construction masculine singulière à portée représentative, sans affirmation doctrinale concernant le genre. Le français permet de la conserver naturellement sans surinterprétation.
translation_notes:
  register: Français international moderne, direct et digne. La structure exhortative « Que celui… ne descende pas » maintient l’urgence de l’impératif grec, tandis que « ce qui se trouve » évite une tournure littérale peu naturelle.
