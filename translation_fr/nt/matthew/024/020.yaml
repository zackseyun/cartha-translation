  text: προσεύχεσθε δὲ ἵνα μὴ γένηται ἡ φυγὴ ὑμῶν χειμῶνος μηδὲ σαββάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/020.yaml
  text: But pray that your flight may not happen in winter or on a Sabbath[a].
translation:
  language: fr
  text: Mais priez pour que votre fuite n’ait pas lieu en hiver ni un jour de sabbat[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le jour du sabbat ».'
    reason: Le grec est sans article; le français peut aussi employer ici l’article défini pour désigner le sabbat.
lexical_decisions:
- source_word: προσεύχεσθε
  choice: priez
  rationale: Impératif présent à la deuxième personne du pluriel. « Priez » est l’impératif français naturel; l’éventuelle nuance de continuité du présent grec reste implicite.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une légère opposition ou une transition par rapport à l’avertissement précédent; « Mais » rend clairement ce mouvement du discours.
- source_word: ἵνα μὴ γένηται
  choice: pour que … n’ait pas lieu
  rationale: Après « priez », ἵνα avec le subjonctif exprime le contenu visé par la prière. « N’ait pas lieu » rend naturellement le sens événementiel de γίνομαι.
- source_word: ἡ φυγὴ ὑμῶν
  choice: votre fuite
  rationale: φυγή désigne l’action de fuir. « Votre fuite » est concis et ne suppose pas nécessairement que l’évasion réussira.
- source_word: χειμῶνος
  choice: en hiver
  rationale: Le génitif indique ici le moment ou la saison; « en hiver » est la formulation française idiomatique.
- source_word: μηδὲ σαββάτῳ
  choice: ni un jour de sabbat
  rationale: μηδέ coordonne une seconde circonstance négative. Le datif singulier anarthre σαββάτῳ désigne le sabbat; « un jour de sabbat » préserve l’indétermination formelle du grec tout en restant clair en français.
theological_decisions:
- issue: Présence ou absence de l’article défini devant σαββάτῳ
  choice: un jour de sabbat
  alternative: le jour du sabbat
  rationale: Le grec ne comporte pas d’article. Le texte principal reflète cette forme sans exclure la compréhension traditionnelle et idiomatique avec l’article défini, signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « pour que … n’ait pas lieu » est naturelle, tandis que « fuite » conserve la force du contexte sans transformer le terme en « évasion » ou en « départ ».
