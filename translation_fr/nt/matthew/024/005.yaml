id: MAT.24.5
reference: Matthew 24:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες· Ἐγώ εἰμι ὁ χριστός, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/005.yaml
  text: For many will come in my name[a], saying, ‘I am the Messiah,’ and they will lead many astray.
translation:
  language: fr
  text: 'Car beaucoup viendront en se réclamant de mon nom[a], disant : « C’est moi, le Messie », et ils égareront beaucoup de gens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en mon nom » ou « sous mon nom ». L’expression grecque peut évoquer le fait de se réclamer du nom de Jésus ou de l’invoquer à l’appui de sa prétention.'
    reason: La préposition ἐπί avec le datif admet ici des nuances proches. La note préserve cette marge sans présenter comme littérale une explicitation interprétative.
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup
  rationale: Rend naturellement l’adjectif quantitatif substantivé, dont le référent humain ressort clairement du contexte.
- source_word: γὰρ
  choice: car
  rationale: Conserve la fonction explicative du verset par rapport à l’avertissement précédent.
- source_word: ἐλεύσονται
  choice: viendront
  rationale: Équivalent français direct et idiomatique du futur de ἔρχομαι.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: en se réclamant de mon nom
  rationale: Exprime en français courant l’idée d’invoquer le nom et l’identité de Jésus comme fondement de sa prétention, sans réduire la formule à une simple présentation comme envoyé.
- source_word: λέγοντες
  choice: et diront
  rationale: Transforme naturellement le participe grec en verbe coordonné tout en conservant son rapport temporel avec la venue des imposteurs.
- source_word: Ἐγώ εἰμι ὁ χριστός
  choice: C’est moi, le Messie
  rationale: La tournure disloquée rend avec naturel l’emphase de Ἐγώ en français; « le Messie » traduit le titre défini ὁ χριστός.
- source_word: πλανήσουσιν
  choice: égareront
  rationale: Préserve à la fois l’idée de tromperie et celle de détourner quelqu’un du bon chemin.
- source_word: πολλοὺς
  choice: beaucoup de gens
  rationale: Le substantif explicite « gens » est naturel en français et évite l’ambiguïté d’un emploi isolé de « beaucoup » comme complément.
theological_decisions:
- issue: Traduction du titre ὁ χριστός dans la prétention de faux messies
  choice: le Messie
  alternative: le Christ
  rationale: Le grec emploie ici χριστός comme titre défini revendiqué par des imposteurs; « le Messie » communique clairement cette fonction titulaire plutôt que de donner l’impression d’un nom propre.
- issue: Portée de ἐπὶ τῷ ὀνόματί μου
  choice: en se réclamant de mon nom
  alternative: en mon nom
  rationale: La formulation retenue laisse entendre que les imposteurs invoquent le nom ou l’identité de Jésus à l’appui de leur revendication, sans leur attribuer une mission réellement autorisée par lui.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée pour éviter un participe pesant. « C’est moi, le Messie » conserve l’emphase grecque tout en restant idiomatique.
