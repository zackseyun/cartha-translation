reference: Matthew 24:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται, καὶ δώσουσιν σημεῖα μεγάλα καὶ τέρατα ὥστε ⸀πλανῆσαι εἰ δυνατὸν καὶ τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/024.yaml
  text: For false messiahs and false prophets will arise[a], and they will perform great signs and wonders so as to lead astray, if possible[c][b], even the elect.
translation:
  language: fr
  text: Car de faux messies et de faux prophètes surgiront et accompliront de grands signes et des prodiges, au point d’égarer, si possible[a], même les élus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si c’était possible ». Le grec dit simplement « si possible » et ne précise pas si cette éventualité est irréalisable.
    reason: alternative_reading
  - marker: b
    text: Ou « les choisis ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: surgiront
  rationale: Dans ce contexte, le passif futur de ἐγείρω décrit l’apparition de personnes sur la scène; « surgiront » est naturel et n’évoque pas une résurrection.
- source_word: ψευδόχριστοι
  choice: de faux messies
  rationale: Χριστός est ici un titre porté à tort par plusieurs prétendants; « messies » conserve cette valeur titulaire et le contexte juif.
- source_word: ψευδοπροφῆται
  choice: de faux prophètes
  rationale: Traduction directe et usuelle du nom composé.
- source_word: δώσουσιν
  choice: accompliront
  rationale: Avec « signes et prodiges », δίδωμι a le sens idiomatique de produire ou d’opérer; « accompliront » convient au français biblique moderne sans traduire mécaniquement par « donneront ».
- source_word: σημεῖα μεγάλα καὶ τέρατα
  choice: de grands signes et des prodiges
  rationale: « Signes » préserve la portée probante ou symbolique de σημεῖα, tandis que « prodiges » rend le caractère saisissant de τέρατα.
- source_word: ὥστε πλανῆσαι
  choice: au point d’égarer
  rationale: Cette formulation conserve la valeur de conséquence ou de résultat potentiel de ὥστε avec l’infinitif sans trancher artificiellement entre but et résultat.
- source_word: εἰ δυνατὸν
  choice: si possible
  rationale: La formule concise reproduit directement le grec et n’ajoute pas la nuance explicitement irréelle que pourrait suggérer « si c’était possible ».
- source_word: καὶ τοὺς ἐκλεκτούς
  choice: même ceux que Dieu a choisis
  rationale: καί a ici une valeur intensive, rendue par « même ». La formulation explicite en français courant le référent implicite du passif théologique « choisis », sans employer le terme plus spécialisé « élus ».
theological_decisions:
- issue: Valeur de ψευδόχριστοι
  choice: de faux messies
  alternative: de faux Christs
  rationale: Le mot Χριστός fonctionne ici comme un titre revendiqué par des imposteurs. « Messies » préserve cette fonction et évite de traiter « Christ » comme un nom propre.
- issue: Portée de εἰ δυνατὸν à propos des personnes choisies
  choice: si possible
  alternative: si c’était possible
  rationale: Le grec laisse la condition sans préciser si sa réalisation est impossible. La traduction conserve cette tension et ne tranche pas un débat théologique sur la possibilité d’égarer les personnes choisies par Dieu.
- issue: Référent de τοὺς ἐκλεκτούς
  choice: ceux que Dieu a choisis
  alternative: les élus
  rationale: Le contexte théologique sous-entend Dieu comme celui qui choisit. Cette formulation est claire pour le lecteur moderne, tout en évitant les connotations doctrinales parfois attachées au substantif « élus ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit le mouvement argumentatif du grec; le vocabulaire traditionnel « signes et prodiges » est conservé parce qu’il reste intelligible et lexicalement précis.
