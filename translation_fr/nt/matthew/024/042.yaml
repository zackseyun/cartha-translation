id: MAT.24.42
reference: Matthew 24:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε ποίᾳ ⸀ἡμέρᾳ ὁ κύριος ὑμῶν ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/042.yaml
  text: Therefore stay awake[c][b][a], because you do not know on what day your Lord is coming.
translation:
  language: fr
  text: Restez donc vigilants[a], car vous ne savez pas quel jour votre Seigneur vient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « veillez » ou « restez éveillés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « viendra ». Le grec emploie ici une forme au présent.
    reason: alternative_reading
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Restez vigilants
  rationale: L’impératif présent pluriel appelle à une vigilance continue. Cette formulation naturelle conserve l’idée de veille sans laisser entendre qu’il s’agit seulement de ne pas dormir physiquement.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée de l’enseignement précédent et s’intègre naturellement après l’impératif en français.
- source_word: ὅτι
  choice: car
  rationale: Introduit la raison de l’exhortation dans un registre courant et digne.
- source_word: οὐκ οἴδατε
  choice: vous ne savez pas
  rationale: Rend directement la négation du verbe « savoir », sans ajout interprétatif.
- source_word: ποίᾳ ἡμέρᾳ
  choice: quel jour
  rationale: Le datif a une valeur temporelle. « Quel jour » est idiomatique en français et maintient l’indétermination du jour.
- source_word: ὁ κύριος ὑμῶν
  choice: votre Seigneur
  rationale: Rend naturellement l’article accompagné du possessif, tout en conservant le titre κύριος et sa portée d’autorité.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent français préserve la forme présente et la vivacité du grec; dans ce contexte eschatologique, il peut aussi avoir une portée future sans que celle-ci soit explicitée dans la traduction.
theological_decisions:
- issue: Portée eschatologique du présent ἔρχεται
  choice: vient
  alternative: viendra
  rationale: Le présent conserve l’urgence et l’attente exprimées par la forme grecque sans fixer plus précisément la chronologie. La note signale la traduction future également possible en français.
translation_notes:
  register: Français international moderne, clair et digne. « Restez vigilants » communique l’exhortation continue de façon naturelle; « votre Seigneur vient » conserve volontairement la tension du présent grec.
