  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἄρξηται τύπτειν τοὺς συνδούλους ⸂αὐτοῦ, ἐσθίῃ δὲ καὶ πίνῃ⸃ μετὰ τῶν μεθυόντων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/049.yaml
  text: and begins to beat his fellow slaves[a], and eats and drinks with drunkards[b],
translation:
  language: fr
  text: et qu’il se mette à battre ses compagnons d’esclavage[a], et qu’il mange et boive avec ceux qui s’enivrent[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses compagnons de service ». Littéralement, « ses co-esclaves » ; certains manuscrits omettent « ses ».
    reason: alternative_reading
  - marker: b
    text: Ou « les ivrognes ». Le participe grec peut désigner ceux qui se caractérisent par l’ivresse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρξηται τύπτειν
  choice: qu’il se mette à battre
  rationale: La tournure ἄρξηται suivie de l’infinitif marque le commencement de l’action. « Se mette à battre » est naturel en français et peut suggérer, comme τύπτειν dans ce contexte, des coups répétés.
- source_word: τοὺς συνδούλους αὐτοῦ
  choice: ses compagnons d’esclavage
  rationale: σύνδουλος désigne un autre esclave soumis au même maître. Cette formulation conserve le statut partagé exprimé par le composé grec sans suggérer que ces personnes lui appartiennent.
- source_word: ἐσθίῃ δὲ καὶ πίνῃ
  choice: et qu’il mange et boive
  rationale: Les présents subjonctifs décrivent la conduite envisagée dans la proposition conditionnelle. La coordination simple préserve les deux verbes sans ajouter l’idée de festin.
- source_word: μετὰ τῶν μεθυόντων
  choice: avec ceux qui s’enivrent
  rationale: Le participe présent substantivé désigne ceux qui boivent jusqu’à l’ivresse ou qui se caractérisent par cette conduite. La formulation verbale évite l’étiquette plus interprétative « ivrognes ».
theological_decisions:
- issue: Rendu du terme de la famille de δοῦλος dans συνδούλους
  choice: compagnons d’esclavage
  alternative: compagnons de service
  rationale: Dans le cadre domestique de la parabole, le statut commun sous l’autorité d’un maître est significatif. « Compagnons d’esclavage » garde cette réalité sociale et le rapport partagé au maître, tandis que « compagnons de service » en atténue la force.
- issue: Portée de μεθυόντων
  choice: ceux qui s’enivrent
  alternative: les ivrognes
  rationale: Le participe permet de décrire leur conduite sans décider s’il s’agit d’une identité permanente. Cette traduction préserve donc mieux l’ouverture aspectuelle du grec.
translation_notes:
  register: Français moderne, digne et lisible. Le subjonctif maintient la dépendance syntaxique envers la proposition conditionnelle commencée au verset précédent. « Compagnons d’esclavage » est moins courant, mais précis et intelligible; la note offre une formulation plus traditionnelle.
