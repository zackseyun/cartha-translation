id: MAT.24.31
reference: Matthew 24:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ ⸀σάλπιγγος μεγάλης, καὶ ἐπισυνάξουσιν τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρων οὐρανῶν ἕως ⸀τῶν ἄκρων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/031.yaml
  text: And he will send out his angels with a loud trumpet[a], and they will gather his chosen ones from the four winds[d][c][b], from one end of the heavens to the other.
translation:
  language: fr
  text: Il enverra ses anges au son d’une trompette retentissante[a], et ils rassembleront ceux qu’il a choisis[b] des quatre vents[c], d’une extrémité des cieux à l’autre[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avec une grande trompette » ou « avec un coup de trompette ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ses élus ».'
    reason: lexical_alternative
  - marker: c
    text: L’expression « les quatre vents » désigne ici toutes les directions, jusqu’aux lieux les plus éloignés.
    reason: cultural_note
  - marker: d
    text: 'Littéralement : « depuis les extrémités des cieux jusqu’à leurs extrémités » ; cette expression signifie d’un extrême à l’autre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: il enverra
  rationale: Le futur simple rend directement le futur actif grec. « Envoyer » est naturel en français et convient à l’envoi des anges sans ajouter une nuance militaire.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: ses anges
  rationale: Dans ce contexte eschatologique, ἄγγελοι désigne des êtres célestes plutôt que de simples messagers humains.
- source_word: μετὰ σάλπιγγος μεγάλης
  choice: au son d’une trompette retentissante
  rationale: Cette formulation française naturelle exprime l’accompagnement signalé par μετά et la puissance sonore suggérée par μεγάλη, tout en conservant l’image concrète de la trompette. Les autres analyses possibles sont signalées en note.
- source_word: ἐπισυνάξουσιν
  choice: ils rassembleront
  rationale: Le sujet pluriel renvoie aux anges. « Rassembler » exprime suffisamment l’idée de réunir portée par le verbe préfixé.
- source_word: τοὺς ἐκλεκτοὺς αὐτοῦ
  choice: ceux qu’il a choisis
  rationale: Cette expression claire et actuelle conserve le sens de ἐκλεκτοί et le possessif αὐτοῦ sans imposer le vocabulaire théologique plus spécialisé des « élus ».
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: depuis les quatre vents
  rationale: La traduction maintient l’image biblique des quatre vents plutôt que de la remplacer dans le texte par l’explication « les quatre directions ».
- source_word: ἀπ’ ἄκρων οὐρανῶν ἕως τῶν ἄκρων αὐτῶν
  choice: d’une extrémité des cieux à l’autre
  rationale: La formulation rend naturellement le mérisme qui indique toute l’étendue, tout en conservant le pluriel οὐρανῶν, « les cieux ».
theological_decisions:
- issue: Sens doctrinal de ἐκλεκτούς dans le contexte eschatologique
  choice: ceux qu’il a choisis
  alternative: ses élus
  rationale: Le verset identifie ceux que les anges rassembleront sans développer ici un système doctrinal sur l’élection. La formulation retenue préserve l’idée du choix divin, tandis que le terme traditionnel figure en note.
- issue: Portée de l’image du rassemblement
  choice: depuis les quatre vents, d’une extrémité des cieux à l’autre
  alternative: des quatre directions de la terre entière
  rationale: Le texte conserve l’ampleur cosmique et les images du grec au lieu de les réduire à une paraphrase géographique plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les images bibliques de la trompette, des quatre vents et des cieux, avec des notes qui explicitent les principales possibilités lexicales sans résoudre indûment leur portée théologique.
