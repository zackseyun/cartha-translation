id: MAT.24.50
reference: Matthew 24:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/050.yaml
  text: the master of that slave will come on a day he does not expect and at an hour he does not know[b][a],
translation:
  language: fr
  text: le maître[a] de cet esclave[b] viendra un jour où celui-ci ne s’y attend pas, et à une heure qu’il ne connaît pas,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le seigneur ». Ici, le grec kyrios désigne le supérieur humain dans la parabole.
    reason: lexical_alternative
  - marker: b
    text: Ou « serviteur ». Le grec doulos désigne une personne liée par une relation de service et de dépendance ; « esclave » souligne ici le statut évoqué dans la scène.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξει
  choice: viendra
  rationale: Le futur de ἥκω exprime ici la venue ou le retour du maître. « Viendra » est naturel et conserve la simplicité du grec.
- source_word: κύριος
  choice: maître
  rationale: Dans le cadre domestique de la parabole, le mot désigne le supérieur humain de l’esclave. « Maître » rend clairement cette relation sans transformer le terme en titre divin explicite.
- source_word: δούλου
  choice: esclave
  rationale: δοῦλος désigne une personne placée dans une relation de dépendance servile. Dans cette scène opposant explicitement maître et esclave, « esclave » préserve la réalité sociale du terme.
- source_word: ἐκείνου
  choice: cet
  rationale: Le démonstratif renvoie à l’esclave précis dont il vient d’être question. « Cet » est la reprise française la plus naturelle.
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: un jour où celui-ci ne s’y attend pas
  rationale: La formulation conserve le caractère indéterminé du jour et le sens de προσδοκάω, « attendre, s’attendre à ». « Celui-ci » évite d’attribuer par erreur l’attente au maître.
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: à une heure qu’il ne connaît pas
  rationale: Cette traduction maintient le parallélisme entre le jour inattendu et l’heure inconnue, ainsi que le sens direct de γινώσκω.
theological_decisions:
- issue: Sens de κύριος dans le cadre de la parabole
  choice: maître
  alternative: seigneur
  rationale: Le référent immédiat est le supérieur humain de l’esclave dans le récit. La portée eschatologique de la parabole demeure, mais elle ne justifie pas d’imposer ici un titre divin dans la formulation française.
- issue: Traduction de δοῦλος
  choice: esclave
  alternative: serviteur
  rationale: La relation de dépendance et d’autorité est saillante dans ce contexte domestique. « Esclave » conserve donc mieux la force historique et rhétorique du grec, tandis que la variante plus atténuée est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. La structure « un jour… à une heure… » préserve le parallélisme grec. « Celui-ci » clarifie que l’esclave est celui qui ne s’attend pas au retour, sans modifier le sens.
