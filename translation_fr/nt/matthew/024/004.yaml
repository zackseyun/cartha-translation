  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/004.yaml
  text: And Jesus answered them[a], “See that no one leads you astray.”
translation:
  language: fr
  text: 'Jésus leur répondit : « Prenez garde que personne ne vous égare[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne vous induise en erreur ».'
    reason: 'Alternative lexicale : πλανάω peut désigner le fait de tromper ou d’induire en erreur.'
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν αὐτοῖς
  choice: leur répondit
  rationale: La tournure narrative grecque associe un participe signifiant « répondre » au verbe « dire ». En français naturel, « leur répondit » conserve à la fois le caractère responsif et l’acte de parole sans reproduire la redondance « répondit et dit ».
- source_word: Βλέπετε
  choice: Veillez à ce que
  rationale: Dans cette construction avec μή et le subjonctif, l’impératif appelle à la vigilance afin d’empêcher ce qui suit. « Veillez à ce que » est une formulation française actuelle qui exprime clairement cette mise en garde.
- source_word: μή τις
  choice: personne ne
  rationale: 'Après l’expression de vigilance, cette tournure rend naturellement en français la prévention exprimée par μή avec le subjonctif : il faut éviter que qui que ce soit accomplisse l’action.'
- source_word: πλανήσῃ
  choice: égare
  rationale: Le verbe πλανάω peut évoquer le fait de tromper, de fourvoyer ou de détourner du bon chemin. « Égarer » préserve à la fois l’idée de tromperie et la métaphore du déplacement hors de la bonne voie.
theological_decisions:
- issue: Portée de l’avertissement exprimé par πλανήσῃ
  choice: un avertissement général contre le fait d’être égaré
  alternative: un avertissement plus étroit contre la tromperie, rendu par « trompe »
  rationale: 'Dans le contexte des affirmations trompeuses concernant les événements à venir, « égare » maintient la portée large du grec : il peut s’agir aussi bien d’être induit en erreur que d’être détourné de la voie juste, sans réduire le propos à une simple méprise intellectuelle.'
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite le calque redondant « répondit et dit » tout en gardant le ton direct et solennel de l’avertissement.
