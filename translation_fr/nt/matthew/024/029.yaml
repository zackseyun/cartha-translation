- from: Mais aussitôt après la détresse de ces jours-là, le soleil s’obscurcira, la lune ne donnera plus sa lumière, les étoiles tomberont du ciel[a] et les puissances des cieux seront ébranlées[b].
  to: Mais aussitôt après la détresse de ces jours-là, le soleil s’obscurcira, la lune ne donnera pas sa lumière, les étoiles tomberont du ciel et les puissances des cieux seront ébranlées[a].
  rationale: La révision retire l’ajout de « plus » afin de reproduire la simple négation future du grec. Elle supprime aussi la note sur « firmament », alternative moins exacte et moins naturelle en français moderne. La note portant sur « les puissances des cieux » est conservée et réancrée, car elle signale sans la résoudre l’ambiguïté réelle de l’expression grecque.
