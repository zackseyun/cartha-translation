source:
  edition: SBLGNT
  text: Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/029.yaml
  text: But immediately after the tribulation of those days[a], the sun will be darkened, and the moon will not give its light, and the stars will fall from heaven[b], and the powers of the heavens will be shaken.
translation:
  language: fr
  text: Mais aussitôt après la détresse de ces jours-là, le soleil s’obscurcira, la lune ne donnera pas sa lumière, les étoiles tomberont du ciel et les puissances des cieux seront ébranlées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « les puissances des cieux » peut désigner des forces cosmiques, des corps célestes ou des puissances célestes ; le grec reste général.
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: Mais aussitôt
  rationale: « Aussitôt » conserve la forte valeur temporelle de Εὐθέως, tandis que « mais » rend la transition légèrement contrastive marquée par δὲ.
- source_word: μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων
  choice: après la détresse de ces jours-là
  rationale: « Détresse » rend naturellement θλῖψις en français moderne sans imposer au terme le sens technique que « tribulation » peut avoir dans certains systèmes eschatologiques. Le complément « de ces jours-là » suit la relation génitive du grec.
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: le soleil s’obscurcira
  rationale: Le verbe pronominal français exprime naturellement le devenir passif du futur grec tout en conservant l’image prophétique.
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: la lune ne donnera plus sa lumière
  rationale: La formulation conserve l’image littérale du grec. « Ne… plus » indique qu’elle cessera de donner sa lumière, sens naturel dans cette séquence, sans réduire l’expression à « ne brillera pas ».
- source_word: οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ
  choice: les étoiles tomberont du ciel
  rationale: « Tomberont » correspond simplement au futur grec. Dans ce contexte visible et cosmique, « ciel » est le rendu français le plus naturel de οὐρανός, tout en laissant ouverte sa portée apocalyptique.
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: les puissances des cieux
  rationale: Cette traduction garde le pluriel grec οὐρανῶν et l’ampleur sémantique de δυνάμεις, sans décider s’il s’agit de forces cosmiques, d’astres ou de puissances célestes.
- source_word: σαλευθήσονται
  choice: seront ébranlées
  rationale: Le futur passif est conservé. « Ébranlées » convient au registre prophétique et peut évoquer aussi bien une secousse qu’un bouleversement de l’ordre cosmique.
theological_decisions:
- issue: Nature des signes cosmiques dans le discours apocalyptique
  choice: Conserver directement les images cosmiques sans trancher entre accomplissement astronomique littéral, langage prophétique symbolique, ou combinaison des deux.
  alternative: Interpréter explicitement ces images soit comme un effondrement cosmique strictement littéral, soit comme le symbole de bouleversements politiques et judiciaires.
  rationale: Le grec présente les images sans en expliquer ici le mode d’accomplissement. La traduction préserve donc la tension et ne fait dépendre le verset d’aucun système eschatologique particulier.
- issue: Référent des « puissances des cieux »
  choice: Maintenir une expression large et ambiguë.
  alternative: Préciser « corps célestes », « forces cosmiques » ou « êtres célestes ».
  rationale: L’expression grecque αἱ δυνάμεις τῶν οὐρανῶν peut recevoir plusieurs référents dans ce contexte. En choisir un dans le corps du texte dépasserait les données explicites du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence prophétique est maintenue par la succession des futurs. « Détresse » évite un jargon confessionnel, tandis que « les puissances des cieux » préserve délibérément l’ambiguïté du grec.
