    rationale: 'Le grec οὐ δώσει τὸ φέγγος αὐτῆς est une simple négation au futur : « ne donnera pas sa lumière ». « Ne… plus » exprime en français une interruption par rapport à un état antérieur et précise donc légèrement le sens.'
  - severity: low
    issue: 'Note a : « Ou “du firmament” »'
    rationale: « Firmament » n’est pas l’alternative lexicale directe attendue pour οὐρανός (« ciel », selon le contexte « ciel/heaven ») et son registre est plus archaïsant. En français, « du ciel » laisse déjà suffisamment ouverte la portée de l’image; la note n’est pas nécessaire.
