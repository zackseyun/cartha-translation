  text: ὥσπερ ⸀γὰρ αἱ ἡμέραι τοῦ Νῶε, οὕτως ⸀ἔσται ἡ παρουσία τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/037.yaml
  text: For just as the days of Noah were[a], so the coming of the Son of Man will be.
translation:
  language: fr
  text: En effet, tout comme aux jours de Noé, ainsi en sera-t-il de la venue du Fils de l’homme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « présence » ou « arrivée ». Le mot grec peut désigner la présence ou l’arrivée; ici, il se rapporte à la venue future du Fils de l’homme.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ ... οὕτως
  choice: tout comme ... ainsi
  rationale: Cette construction corrélative conserve clairement la comparaison emphatique du grec dans un français naturel.
- source_word: γὰρ
  choice: En effet
  rationale: Ce connecteur marque le lien explicatif avec ce qui précède et convient mieux en tête de phrase que « car » dans cette formulation.
- source_word: αἱ ἡμέραι τοῦ Νῶε
  choice: aux jours de Noé
  rationale: La tournure française idiomatique exprime l’époque de Noé tout en respectant l’ellipse du premier membre grec.
- source_word: ἔσται
  choice: en sera-t-il
  rationale: 'Cette formulation complète naturellement en français la comparaison elliptique : « tout comme… ainsi en sera-t-il… ».'
- source_word: παρουσία
  choice: venue
  rationale: Dans ce contexte eschatologique, « venue » exprime naturellement l’avènement futur visé, sans exclure entièrement la nuance de présence portée par le terme grec.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: du Fils de l’homme
  rationale: Cette désignation consacrée préserve les résonances scripturaires et théologiques du titre grec.
theological_decisions:
- issue: Sens de παρουσία dans une parole eschatologique
  choice: venue
  alternative: présence ou arrivée
  rationale: Le contexte désigne l’avènement futur du Fils de l’homme. « Venue » rend clairement la dimension événementielle, tandis qu’une note conserve la portée lexicale plus large du grec.
translation_notes:
  register: Français moderne, international et digne. La structure corrélative garde la comparaison explicite; « aux jours de Noé » évite une formulation lourde tout en préservant le sens.
