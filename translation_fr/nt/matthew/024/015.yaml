id: MAT.24.15
reference: Matthew 24:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅταν οὖν ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου ⸀ἑστὸς ἐν τόπῳ ἁγίῳ, ὁ ἀναγινώσκων νοείτω,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/015.yaml
  text: So when you see the abomination of desolation spoken of through Daniel the prophet standing in a holy place—let the reader understand—[a][b]
translation:
  language: fr
  text: « Quand donc vous verrez l’abomination de la désolation, dont a parlé le prophète Daniel, dressée dans un lieu saint — que le lecteur comprenne —[a][b] »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « dans le lieu saint ».'
    reason: alternative_reading
  - marker: b
    text: Ou « l’abomination désolatrice » ou « l’abomination qui cause la désolation », en écho au livre de Daniel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Quand donc
  rationale: « Quand » exprime naturellement l’éventualité future introduite par ὅταν avec le subjonctif, tandis que « donc » conserve la transition logique marquée par οὖν.
- source_word: ἴδητε
  choice: vous verrez
  rationale: Le futur français convient à cette proposition temporelle orientée vers l’avenir et rend simplement le sens de ὁράω.
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: l’abomination de la dévastation
  rationale: Cette formulation conserve le génitif grec et le lien verbal reconnaissable avec Daniel, sans trancher entre une dévastation produite par l’abomination et une abomination caractérisée par elle.
- source_word: τὸ ῥηθὲν διὰ Δανιὴλ τοῦ προφήτου
  choice: annoncée par l’intermédiaire du prophète Daniel
  rationale: « Annoncée » rend ici la parole prophétique de manière idiomatique; « par l’intermédiaire de » préserve la valeur instrumentale de διά avec le génitif.
- source_word: ἑστὸς
  choice: dressée
  rationale: « Dressée » rend l’idée d’être placée ou de se tenir debout sans préciser indûment la nature exacte de l’abomination.
- source_word: ἐν τόπῳ ἁγίῳ
  choice: dans un lieu saint
  rationale: L’indéfini reflète l’absence d’article en grec et évite d’imposer une identification exclusivement temple-spécifique.
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: que le lecteur comprenne
  rationale: Cette formule concise et naturelle conserve l’exhortation à saisir le sens de l’allusion.
theological_decisions:
- issue: Détermination de τόπῳ ἁγίῳ et identification possible au sanctuaire du temple
  choice: dans un lieu saint
  alternative: dans le lieu saint
  rationale: Le contexte peut évoquer un lieu déterminé, notamment le sanctuaire, mais l’expression grecque sans article ne l’impose pas formellement. Le texte principal préserve donc l’ouverture, et la lecture traditionnelle figure en note.
- issue: Sens du génitif dans βδέλυγμα τῆς ἐρημώσεως
  choice: l’abomination de la dévastation
  alternative: l’abomination dévastatrice / l’abomination qui cause la dévastation
  rationale: La formulation retenue maintient l’ambiguïté du génitif et l’écho à Daniel au lieu de transformer celui-ci en relation causale explicite.
- issue: Nature ou référent de l’abomination
  choice: dressée
  alternative: installée
  rationale: Le participe grec décrit ce qui se tient ou a été placé là, mais n’identifie pas explicitement une personne, une idole ou un autre objet. « Dressée » conserve cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton prophétique et la parenthèse adressée au lecteur. « Par l’intermédiaire du prophète Daniel » est légèrement soutenu, mais il rend avec précision l’idée d’une parole transmise au moyen du prophète.
