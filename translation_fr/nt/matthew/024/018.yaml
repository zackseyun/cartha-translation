  text: καὶ ὁ ἐν τῷ ἀγρῷ μὴ ἐπιστρεψάτω ὀπίσω ἆραι ⸂τὸ ἱμάτιον⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/018.yaml
  text: And let the one in the field not turn back to take his cloak[a].
translation:
  language: fr
  text: Que celui qui est aux champs ne retourne pas en arrière pour prendre son manteau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son vêtement » ou « son vêtement extérieur » .
    reason: Alternative lexicale pour ἱμάτιον, qui peut désigner plus largement un vêtement ou, plus précisément, le vêtement extérieur.
lexical_decisions:
- source_word: ὁ ἐν τῷ ἀγρῷ
  choice: celui qui sera dans les champs
  rationale: La tournure française est naturelle et conserve la valeur individuelle et générique du groupe grec substantivé. Le futur s’accorde au cadre prospectif immédiat de l’avertissement.
- source_word: μὴ ἐπιστρεψάτω ὀπίσω
  choice: ne retourne pas en arrière
  rationale: « Que… ne retourne pas » rend la défense exprimée par l’impératif aoriste avec μή; « en arrière » restitue la valeur idiomatique de ὀπίσω dans cette construction.
- source_word: ἆραι
  choice: pour prendre
  rationale: L’infinitif exprime ici le but du retour envisagé; « pour prendre » le rend simplement et clairement.
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: son manteau
  rationale: ἱμάτιον désigne fréquemment le vêtement extérieur; « manteau » est précis, courant et adapté à une scène de fuite urgente.
theological_decisions:
- issue: Portée générique de l’article masculin substantivé
  choice: celui qui sera dans les champs
  alternative: l’homme qui sera dans les champs
  rationale: Le masculin grec est grammatical et représentatif dans cet avertissement. « Celui qui » préserve le singulier sans limiter inutilement l’application aux hommes.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve l’urgence de la défense et évite un langage inutilement genré.
