source:
  edition: SBLGNT
  text: ⸀ὡς γὰρ ἦσαν ἐν ταῖς ⸀ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ τρώγοντες καὶ πίνοντες, γαμοῦντες καὶ ⸀γαμίζοντες, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/038.yaml
  text: For as in the days before the flood they were eating and drinking[a], marrying and giving in marriage, until the day Noah entered the ark,
translation:
  language: fr
  text: Car, de même que, dans les jours qui précédèrent le déluge, on mangeait et buvait, on se mariait et on donnait en mariage[a], jusqu’au jour où Noé entra dans l’arche,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « on était donné en mariage ». Le grec distingue « se mariaient » et le verbe suivant, qui peut désigner le fait d’être donné en mariage ou de donner quelqu’un en mariage.'
    reason: Alternative lexicale liée à l’ambiguïté de γαμίζοντες.
lexical_decisions:
- source_word: ὡς γὰρ
  choice: En effet
  rationale: Introduit naturellement en français l’explication comparative développée dans le contexte; la comparaison elle-même se poursuit avec la proposition suivante du passage.
- source_word: ἦσαν … τρώγοντες καὶ πίνοντες
  choice: les gens mangeaient et buvaient
  rationale: L’imparfait français exprime directement les activités continues de la construction périphrastique grecque. « Les gens » explicite sobrement le sujet implicite nécessaire en français.
- source_word: ἐν ταῖς ἡμέραις ταῖς πρὸ τοῦ κατακλυσμοῦ
  choice: dans les jours qui précédèrent le déluge
  rationale: Formulation temporelle naturelle et digne; « déluge » est le terme français consacré dans le récit de Noé.
- source_word: γαμοῦντες
  choice: se mariaient
  rationale: Rend le sens courant de γαμέω et maintient le parallélisme des activités ordinaires.
- source_word: γαμίζοντες
  choice: donnaient en mariage
  rationale: Préserve la distinction lexicale avec γαμοῦντες et le sens causatif traditionnel de γαμίζω, sans exclure par le texte principal l’autre analyse possible.
- source_word: ἄχρι ἧς ἡμέρας
  choice: jusqu’au jour où
  rationale: Expression française idiomatique qui marque clairement le terme des activités en cours.
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: Noé entra dans l’arche
  rationale: Le passé simple convient au registre narratif et présente l’entrée de Noé comme l’événement ponctuel qui clôt la période évoquée; « arche » conserve le lien reconnu avec la Genèse.
theological_decisions:
- issue: Faut-il présenter les activités énumérées comme des excès coupables ou comme le cours ordinaire de la vie avant le jugement?
  choice: Les rendre de manière neutre comme des activités humaines ordinaires.
  alternative: Employer des termes suggérant l’excès, l’insouciance morale ou la débauche.
  rationale: Les participes grecs ne comportent aucun qualificatif moral explicite. Dans le contexte, l’accent porte sur la continuité de la vie habituelle avant la soudaineté du jugement; la traduction ne doit donc pas ajouter une condamnation absente de ces mots.
- issue: Sens de γαμίζοντες
  choice: « donnaient en mariage », avec une note signalant l’autre possibilité.
  alternative: « étaient donnés en mariage ».
  rationale: La forme peut recevoir un sens causatif, mais les données lexicales et textuelles permettent aussi une compréhension passive ou intransitive selon l’usage. La note conserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait rend la durée des activités, tandis que le passé simple marque l’entrée ponctuelle de Noé. Aucun ton moral négatif n’est ajouté aux actions ordinaires énumérées.
