source:
  edition: SBLGNT
  text: οὐαὶ δὲ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/019.yaml
  text: But woe to those who are pregnant and to those who are nursing infants in those days[a].
translation:
  language: fr
  text: Mais malheur à celles qui seront enceintes et à celles qui allaiteront en ces jours-là !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: malheur
  rationale: « Malheur » conserve la force prophétique et l’idée de détresse imminente, plus nettement que « hélas ».
- source_word: δὲ
  choice: mais
  rationale: Le terme marque ici une transition légèrement contrastive avec l’exhortation précédente ; « mais » convient au mouvement du discours sans exagérer l’opposition.
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: à celles qui seront enceintes
  rationale: L’expression idiomatique signifie « être enceinte ». Le futur est naturel en français dans cet avertissement portant sur les jours annoncés, tout en gardant la référence féminine des formes grecques.
- source_word: ταῖς θηλαζούσαις
  choice: à celles qui allaiteront
  rationale: « Allaiter » rend directement θηλάζω. Le complément, implicite en grec, n’a pas besoin d’être ajouté en français.
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: en ces jours-là
  rationale: Formulation temporelle naturelle et fidèle, qui renvoie aux jours dont Jésus vient de parler.
theological_decisions:
- issue: Référentes des participes féminins au datif
  choice: « celles qui seront enceintes » et « celles qui allaiteront »
  alternative: « les femmes enceintes » et « les femmes qui allaiteront »
  rationale: Les formes grecques sont explicitement féminines, mais le français les rend clairement par « celles » sans devoir ajouter le nom « femmes », absent du texte. La formulation maintient l’accent sur leur situation de particulière vulnérabilité.
- issue: Valeur temporelle des participes présents grecs
  choice: 'futur français : « seront enceintes » et « allaiteront »'
  alternative: 'présent français : « sont enceintes » et « allaitent »'
  rationale: Les participes grecs décrivent l’état de ces personnes pendant les jours futurs annoncés. En français, le futur explicite naturellement cette relation temporelle sans modifier le sens.
translation_notes:
  register: Registre actuel, digne et direct. La tournure biblique « malheur à » préserve la vigueur de l’exclamation grecque, tandis que « celles qui… » évite une formulation inutilement lourde.
