id: MAT.24.7
reference: Matthew 24:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπὶ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, καὶ ἔσονται ⸀λιμοὶ καὶ σεισμοὶ κατὰ τόπους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/007.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom[b], and there will be famines and earthquakes in various places.
translation:
  language: fr
  text: Car une nation se dressera[a] contre une nation, et un royaume contre un royaume ; il y aura des famines et des tremblements de terre en divers lieux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se soulèvera ». L’expression grecque évoque ici le déclenchement d’une hostilité.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « d’un lieu à l’autre » ou « en différents endroits ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: se dressera
  rationale: Dans la construction avec ἐπί et l’accusatif, le verbe évoque le déclenchement d’une hostilité. « Se dressera contre » est naturel en français et n’introduit pas l’idée explicite d’une action divine.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction rattache cette affirmation à ce qui précède en donnant une explication. « Car » conserve clairement ce lien discursif.
- source_word: ἔθνος ἐπὶ ἔθνος
  choice: une nation contre une nation
  rationale: ἔθνος désigne ici un peuple envisagé collectivement, dans un parallélisme politique avec « royaume ». La préposition ἐπί marque l’opposition hostile.
- source_word: βασιλεία ἐπὶ βασιλείαν
  choice: un royaume contre un royaume
  rationale: Dans ce parallélisme, βασιλεία désigne un royaume comme entité politique. La formulation française conserve la structure concise du grec.
- source_word: λιμοὶ
  choice: des famines
  rationale: Le pluriel désigne de graves pénuries de nourriture ; « famines » en est l’équivalent français précis et usuel.
- source_word: σεισμοὶ
  choice: des tremblements de terre
  rationale: Dans ce contexte, σεισμός désigne un séisme. « Tremblements de terre » est immédiatement compréhensible en français courant.
- source_word: κατὰ τόπους
  choice: en divers lieux
  rationale: 'L’expression a une valeur distributive : ces événements surviennent en plusieurs endroits. « En divers lieux » reste concis, naturel et légèrement solennel.'
theological_decisions:
- issue: Portée de ἔθνος dans l’annonce d’un conflit
  choice: nation
  alternative: peuple
  rationale: Le parallélisme avec « royaume » favorise une désignation collective et politique. « Nation » évite aussi de restreindre indûment le mot aux non-Juifs ou à une seule dimension ethnique.
- issue: Valeur de la forme passive ἐγερθήσεται
  choice: se dressera contre
  alternative: sera dressée contre
  rationale: Dans cet idiome, la forme décrit l’apparition d’une hostilité sans attribuer explicitement l’action à Dieu. Une traduction passive risquerait de suggérer une causalité théologique que le verset ne formule pas.
translation_notes:
  register: Français international moderne, digne et accessible. « Car » maintient le lien explicatif avec le contexte ; « se dresser contre » rend l’hostilité sans lourdeur. La ponctuation met en relief les deux groupes d’événements tout en conservant le mouvement de la phrase grecque.
