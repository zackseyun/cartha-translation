id: MAT.24.1
reference: Matthew 24:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ὁ Ἰησοῦς ⸂ἀπὸ τοῦ ἱεροῦ ἐπορεύετο⸃, καὶ προσῆλθον οἱ μαθηταὶ αὐτοῦ ἐπιδεῖξαι αὐτῷ τὰς οἰκοδομὰς τοῦ ἱεροῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/001.yaml
  text: And Jesus went out from the temple and was going away[a], and his disciples came to show him the buildings of the temple.
translation:
  language: fr
  text: Jésus sortit du Temple et s’en allait[a]. Ses disciples s’approchèrent alors pour lui montrer les bâtiments du Temple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « Temple » désigne ici l’ensemble du complexe ou de l’enceinte du Temple, et non seulement le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: sortit
  rationale: 'Le participe aoriste exprime une action qui précède celle du verbe principal : Jésus sort d’abord, puis s’éloigne. « Sortit » conserve cette progression sans alourdir la phrase.'
- source_word: ἱεροῦ
  choice: Temple
  rationale: Ἱερόν désigne ici l’ensemble du complexe ou de l’enceinte du Temple, et non uniquement le sanctuaire intérieur. « Temple » est la formulation française courante; la précision est donnée en note.
- source_word: ἐπορεύετο
  choice: s’en allait
  rationale: L’imparfait grec présente le déplacement comme en cours. « S’en allait » restitue naturellement cet aspect et indique qu’il quittait les lieux.
- source_word: προσῆλθον
  choice: s’approchèrent
  rationale: Le verbe signifie venir vers quelqu’un ou s’approcher. « S’approchèrent » rend explicitement le mouvement vers Jésus dans un français naturel.
- source_word: ἐπιδεῖξαι
  choice: pour lui montrer
  rationale: L’infinitif exprime le but de leur approche. « Pour lui montrer » est direct et idiomatique.
- source_word: οἰκοδομὰς
  choice: bâtiments
  rationale: Dans ce contexte, οἰκοδομή désigne les constructions composant le complexe du Temple. « Bâtiments » est précis, courant et prépare le propos sur leur destruction.
- source_word: τοῦ ἱεροῦ
  choice: du Temple
  rationale: Le génitif rattache les bâtiments à l’ensemble du complexe. La répétition de « Temple » suit l’insistance du grec et reste naturelle en français.
theological_decisions:
- issue: Distinction entre ἱερόν et ναός
  choice: Temple, avec une note précisant qu’il s’agit de l’ensemble du complexe
  alternative: enceinte du Temple / complexe du Temple
  rationale: Le texte emploie ἱερόν, terme plus large que ναός, qui peut désigner spécifiquement le sanctuaire. Garder « Temple » dans le texte assure une lecture fluide, tandis que la note préserve la distinction lexicale sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, narratif et digne. L’imparfait « s’en allait » préserve l’action en cours; la majuscule à « Temple » identifie l’institution et le complexe de Jérusalem. La phrase est divisée en deux pour une lecture naturelle, sans perdre la succession des actions.
