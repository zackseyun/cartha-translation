reference: Matthew 24:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν οὖν εἴπωσιν ὑμῖν· Ἰδοὺ ἐν τῇ ἐρήμῳ ἐστίν, μὴ ἐξέλθητε· Ἰδοὺ ἐν τοῖς ταμείοις, μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/026.yaml
  text: Therefore[a], if they say to you, ‘Look, he is in the wilderness,’ do not go out; ‘Look[c][b], he is in the inner rooms,’ do not believe it.
translation:
  language: fr
  text: 'Si donc on vous dit : « Regardez, il est dans le désert[a] », ne sortez pas ; « Regardez, il est dans les pièces intérieures[b] », ne le croyez pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un lieu désert » ou « dans la région déserte ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les réserves » ou « dans les chambres secrètes ». Le mot grec peut désigner des pièces intérieures ou privées, notamment des pièces servant de réserves.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Si donc
  rationale: Conserve à la fois la condition introduite par ἐάν et le lien déductif de οὖν avec l’avertissement précédent, dans un ordre naturel en français.
- source_word: εἴπωσιν ὑμῖν
  choice: on vous dit
  rationale: Le pluriel grec a ici une valeur indéfinie. Le pronom français « on » rend naturellement cette indétermination sans désigner un groupe précis.
- source_word: Ἰδοὺ
  choice: Regardez
  rationale: Interjection déictique qui attire immédiatement l’attention ; « Regardez » est actuel et direct, sans l’archaïsme de « Voici » pris comme simple formule solennelle.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: ἔρημος désigne un lieu désert ou inhabité. « Désert » est idiomatique en français biblique moderne, tandis que la note conserve l’autre nuance possible.
- source_word: ἐστίν
  choice: il est
  rationale: Le sujet implicite renvoie, d’après le contexte, à celui dont on annonce la présence. Le pronom nécessaire en français évite d’ajouter explicitement « le Messie » ou « Jésus ».
- source_word: μὴ ἐξέλθητε
  choice: n’y allez pas
  rationale: L’interdiction vise le fait de sortir pour se rendre au lieu annoncé. « N’y allez pas » exprime naturellement en français le mouvement contextuel sans alourdir la phrase.
- source_word: ἐν τοῖς ταμείοις
  choice: dans les pièces retirées
  rationale: ταμεῖον peut désigner des pièces intérieures, privées ou servant de réserves. « Pièces retirées » évoque des espaces intérieurs à l’écart sans imposer l’idée de secret.
- source_word: μὴ πιστεύσητε
  choice: ne le croyez pas
  rationale: L’objet implicite est l’affirmation rapportée. Le pronom neutre « le » reprend naturellement en français le contenu de cette annonce.
theological_decisions:
- issue: Référent implicite de ἐστίν
  choice: « il est », sans titre ajouté
  alternative: « le Messie est là » ou « Jésus est là »
  rationale: Le contexte identifie le référent, mais la proposition grecque ne le nomme pas. Le pronom préserve cette implicitation et évite une explicitation théologique superflue.
- issue: Rapport entre les deux annonces
  choice: Deux annonces parallèles juxtaposées sous une même condition, séparées par un point-virgule
  alternative: Ajouter « ou » avant la seconde annonce
  rationale: Le grec répète Ἰδού sans conjonction disjonctive explicite. La ponctuation rend le parallélisme sans introduire un lien absent du texte.
translation_notes:
  register: Français international moderne, direct et digne. Le parallélisme des deux avertissements est maintenu. « Pièces retirées » reste compréhensible tout en conservant l’étendue sémantique de ταμεῖον grâce à la note.
