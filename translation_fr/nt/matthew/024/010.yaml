id: MAT.24.10
reference: Matthew 24:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τότε σκανδαλισθήσονται πολλοὶ καὶ ἀλλήλους παραδώσουσιν καὶ μισήσουσιν ἀλλήλους·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/010.yaml
  text: And then many will fall away[b][a], and they will betray one another and hate one another.
translation:
  language: fr
  text: Alors, beaucoup se détourneront[a] ; ils se trahiront[b] les uns les autres et se haïront les uns les autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trébucheront », « seront amenés à tomber » ou « seront scandalisés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « se livreront les uns les autres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: alors
  rationale: L’adverbe situe ces événements dans la suite du discours de Jésus. « Alors » est naturel en français et conserve cette progression temporelle.
- source_word: σκανδαλισθήσονται
  choice: se détourneront
  rationale: Dans ce contexte de persécution, le verbe évoque une défection sous la pression. « Se détourneront » en exprime la gravité sans préciser davantage l’objet de cet abandon, absent du grec.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: L’adjectif substantivé désigne un grand nombre de personnes ; « beaucoup » le rend directement et naturellement.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Cette expression conserve clairement la réciprocité des deux actions.
- source_word: παραδώσουσιν
  choice: se trahiront
  rationale: Le verbe signifie littéralement « livrer » ou « remettre ». Dans ce contexte d’hostilité et de persécution, « se trahiront » restitue naturellement la dimension déloyale de l’action.
- source_word: μισήσουσιν
  choice: se haïront
  rationale: Le futur de μισέω exprime ici une hostilité active et se traduit directement par « se haïront ».
- source_word: καὶ τότε ... καὶ ... καὶ ...
  choice: Alors ... ; ... et ...
  rationale: Le point-virgule et la coordination française préservent la succession cumulative des actions sans produire une répétition artificielle de « et » en tête de phrase.
theological_decisions:
- issue: Sens de σκανδαλισθήσονται dans un contexte de persécution eschatologique
  choice: se détourneront
  alternative: trébucheront ; seront amenés à tomber ; seront scandalisés
  rationale: 'Le contexte suggère plus qu’une simple vexation : une rupture ou une défection qui conduit ensuite à la trahison et à la haine. « Se détourneront » garde cette gravité tout en évitant d’imposer une formulation doctrinale telle que « abandonneront la foi ».'
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la progression du verset et la réciprocité insistante du grec. Les notes maintiennent l’étendue sémantique de σκανδαλίζω et le sens concret de παραδίδωμι.
