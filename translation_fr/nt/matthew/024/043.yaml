id: MAT.24.43
reference: Matthew 24:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκεῖνο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ φυλακῇ ὁ κλέπτης ἔρχεται, ἐγρηγόρησεν ἂν καὶ οὐκ ἂν εἴασεν διορυχθῆναι τὴν οἰκίαν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/043.yaml
  text: 'But know this: if the master of the house had known in what watch the thief was coming[b][a], he would have stayed awake and would not have let his house be broken into.'
translation:
  language: fr
  text: 'Mais sachez-le : si le maître de maison avait su à quelle veille de la nuit[a] le voleur allait venir, il serait resté éveillé et ne l’aurait pas laissé entrer par effraction dans sa maison[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une « veille » était l’une des périodes en lesquelles on divisait la nuit.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « laisser sa maison être percée » ; dans l’Antiquité, un voleur pouvait entrer en creusant ou en perçant une paroi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνο δὲ γινώσκετε
  choice: Mais sachez-le
  rationale: Cette formulation naturelle conserve le changement de perspective signalé par δέ ainsi que la force injonctive de γινώσκετε.
- source_word: οἰκοδεσπότης
  choice: le maître de maison
  rationale: L’expression désigne le responsable ou chef de la maisonnée. « Maître de maison » préserve ce rôle social sans introduire la notion moderne de propriétaire.
- source_word: ποίᾳ φυλακῇ
  choice: à quelle veille de la nuit
  rationale: φυλακή désigne ici l’une des périodes en lesquelles la nuit était divisée. La précision « de la nuit » rend l’expression immédiatement intelligible.
- source_word: ὁ κλέπτης ἔρχεται
  choice: le voleur allait venir
  rationale: Le présent grec s’insère dans une condition irréelle portant sur un événement envisagé. L’imparfait périphrastique français s’accorde naturellement avec « avait su » tout en gardant l’idée de la venue attendue du voleur.
- source_word: ἐγρηγόρησεν ἂν
  choice: il serait resté éveillé
  rationale: γρηγορέω signifie rester éveillé ou veiller. « Rester éveillé » convient directement à la scène nocturne et conserve le caractère concret de l’image.
- source_word: οὐκ ἂν εἴασεν
  choice: ne l’aurait pas laissé
  rationale: Cette tournure française simple et actuelle rend la permission empêchée exprimée par ἐάω avec ἄν.
- source_word: διορυχθῆναι τὴν οἰκίαν αὐτοῦ
  choice: entrer par effraction dans sa maison
  rationale: Le verbe signifie littéralement « creuser ou percer à travers ». La traduction principale exprime naturellement en français le résultat visé dans ce contexte, tandis que la note conserve l’image concrète de la maison percée.
theological_decisions:
- issue: Interprétation de l’image du maître de maison
  choice: le maître de maison
  alternative: le propriétaire de la maison
  rationale: Il s’agit d’une comparaison exhortant à la vigilance, non d’un titre doctrinal. La formulation retenue préserve le rôle social du personnage sans lui attribuer une identité théologique non explicitée.
- issue: Expression de l’effraction dans le cadre ancien
  choice: entrer par effraction dans sa maison
  alternative: percer sa maison
  rationale: La traduction principale communique clairement l’action du voleur en français moderne. La note maintient l’image historique d’une paroi que l’on pouvait creuser ou percer, sans surinterpréter le matériau ni l’endroit précis de la brèche.
translation_notes:
  register: Français international moderne, digne et direct. La phrase garde la structure conditionnelle de l’original, tout en évitant une tournure passive peu naturelle en français. Les notes explicitent les deux images culturelles sans alourdir le texte principal.
