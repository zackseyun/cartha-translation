id: MAT.24.30
reference: Matthew 24:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν ⸀τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/024/030.yaml
  text: And then the sign of the Son of Man will appear in heaven[a], and then all the tribes of the earth will mourn[c][b], and they will see the Son of Man coming on the clouds of heaven with power and great glory.
translation:
  language: fr
  text: Alors le signe du Fils de l’homme apparaîtra dans le ciel[a]. Alors toutes les tribus de la terre se lamenteront[b], et elles verront le Fils de l’homme venir sur les nuées du ciel[c], avec puissance et une grande gloire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les cieux ». Le mot grec peut désigner le ciel visible ou les cieux.
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes les tribus du pays ». Le mot grec peut signifier « terre » ou « pays ».
    reason: alternative_reading
  - marker: c
    text: L’expression « venir sur les nuées du ciel » fait écho à Daniel 7.13.
    reason: cross_reference
lexical_decisions:
- source_word: φανήσεται
  choice: apparaîtra
  rationale: Le futur est rendu de façon intransitive et naturelle, en exprimant la manifestation visible.
- source_word: τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: le signe du Fils de l’homme
  rationale: 'Cette formulation proche du grec conserve l’ambiguïté du génitif : signe associé au Fils de l’homme ou, éventuellement, signe qu’il constitue lui-même.'
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: « Ciel » convient au registre apocalyptique tout en pouvant désigner l’espace visible; cette nuance est explicitée en note.
- source_word: κόψονται
  choice: se lamenteront
  rationale: Dans cet emploi, le verbe désigne le deuil ou la lamentation; « se lamenteront » restitue clairement le sens sans imposer un geste précis.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: toutes les tribus de la terre
  rationale: « Tribus » reflète directement φυλαί et maintient les résonances prophétiques; « terre » correspond bien à l’ampleur cosmique du contexte, tandis que « pays » reste signalé en note.
- source_word: ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: venir sur les nuées du ciel
  rationale: La traduction conserve l’image spatiale et l’écho manifeste de Daniel 7.13.
- source_word: μετὰ δυνάμεως καὶ δόξης πολλῆς
  choice: avec puissance et une grande gloire
  rationale: La formulation suit la portée grammaticale de πολλῆς, qui qualifie directement « gloire », tout en restant naturelle en français.
theological_decisions:
- issue: Sens du « signe du Fils de l’homme »
  choice: Conserver « le signe du Fils de l’homme » sans préciser la relation exacte.
  alternative: « le signe appartenant au Fils de l’homme » ou « le signe qu’est le Fils de l’homme »
  rationale: Le génitif grec ne tranche pas explicitement entre ces lectures; la traduction préserve donc cette tension eschatologique.
- issue: Étendue de γῆ dans « toutes les tribus de la terre »
  choice: « terre » dans le texte principal
  alternative: « pays »
  rationale: Le cadre cosmique favorise la portée universelle de « terre », mais une lecture centrée sur le pays d’Israël demeure lexicalement possible et figure en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Fils de l’homme » et « nuées » conservent le registre biblique et les échos prophétiques sans archaïsme excessif.
