reference: Matthew 18:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ σύνδουλος ⸀αὐτοῦ παρεκάλει αὐτὸν λέγων· Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/029.yaml
  text: So his fellow slave fell down and pleaded with him[a], saying, ‘Be patient with me, and I will repay you.’
translation:
  language: fr
  text: 'Alors, son compagnon d’esclavage tomba et le supplia : « Sois patient avec moi, et je te rembourserai. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσὼν
  choice: tomba devant lui
  rationale: Le participe décrit un mouvement physique de supplication. « Tomba devant lui » conserve ce geste sans préciser une posture, comme « à genoux », que le grec n’explicite pas.
- source_word: οὖν
  choice: Alors
  rationale: Dans ce récit, οὖν assure à la fois la conséquence et la progression narrative. « Alors » est naturel en français et convient mieux ici que le plus argumentatif « donc ».
- source_word: σύνδουλος
  choice: compagnon d’esclavage
  rationale: Le composé désigne une personne esclave du même maître. « Compagnon d’esclavage » rend explicitement cette condition commune, importante dans la parabole, sans réduire le terme au sens plus général de « serviteur ».
- source_word: παρεκάλει
  choice: le suppliait
  rationale: Le verbe à l’imparfait exprime ici un appel insistant. « Suppliait » restitue la détresse de la demande dans un français actuel et digne.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Prends patience envers moi
  rationale: L’expression demande de faire preuve de patience et de retenue à l’égard du débiteur. Cette formulation préserve l’orientation personnelle marquée par ἐπί.
- source_word: ἀποδώσω
  choice: je te rembourserai
  rationale: Dans le contexte explicite d’une dette, « rembourserai » exprime précisément le fait de rendre la somme due.
theological_decisions:
- issue: Traduction du vocabulaire de l’esclavage dans σύνδουλος
  choice: Employer « compagnon d’esclavage » dans le texte principal
  alternative: compagnon de service ; autre esclave du même maître
  rationale: La relation commune à un maître structure la parabole. Le choix principal maintient la réalité sociale exprimée par le grec, tandis que la note signale une formulation française plus douce mais moins précise.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le mouvement narratif et la parole directe. « Compagnon d’esclavage » est moins courant, mais transparent et précis ; la note fournit l’équivalent traditionnel.
