revisions:
- from: 'Alors, son compagnon d’esclavage[a] tomba devant lui et le supplia en disant : « Prends patience envers moi, et je te rembourserai. »'
  to: 'Alors, son compagnon d’esclavage tomba et le supplia : « Sois patient avec moi, et je te rembourserai. »'
  rationale: La révision conserve le vocabulaire de l’esclavage et le cadre de dette de la parabole, tout en éliminant une précision spatiale non exprimée dans le grec et en employant une demande de patience idiomatique en français moderne. La note conserve l’alternative plus traditionnelle tout en précisant la relation de co-esclavage.
