  text: ἀρξαμένου δὲ αὐτοῦ συναίρειν ⸀προσηνέχθη ⸂αὐτῷ εἷς⸃ ὀφειλέτης μυρίων ταλάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/024.yaml
  text: And when he began to settle accounts[a], one debtor who owed ten thousand talents was brought to him.
translation:
  language: fr
  text: Comme il commençait à régler les comptes, on lui amena un débiteur qui devait dix mille talents[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le talent était une unité monétaire de très grande valeur ; dans le cadre de cette parabole, « dix mille talents » représente une dette d’une ampleur inimaginable.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξαμένου δὲ αὐτοῦ
  choice: Comme il commençait
  rationale: Le génitif absolu fournit la circonstance temporelle de l’action principale. « Comme il commençait » est naturel en français et ne précise pas davantage la succession des faits que le grec.
- source_word: συναίρειν
  choice: à régler les comptes
  rationale: Dans ce contexte financier, le verbe désigne l’examen et le règlement de comptes. Cette expression française actuelle conserve l’image comptable.
- source_word: προσηνέχθη
  choice: on lui amena
  rationale: Le passif grec implique que d’autres personnes conduisent le débiteur auprès du roi. Le passif « lui fut amené » serait plus formel, tandis que le tour français avec « on » exprime clairement et naturellement la même action sans identifier les agents.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif désigne celui auprès de qui le débiteur est amené.
- source_word: εἷς ὀφειλέτης
  choice: un débiteur
  rationale: En français, « un débiteur » introduit naturellement un cas particulier parmi plusieurs. Traduire εἷς par « un certain débiteur » ou « un débiteur, un seul » lui donnerait ici une insistance peu certaine.
- source_word: μυρίων ταλάντων
  choice: dix mille talents
  rationale: μύριοι désigne littéralement dix mille et évoque ici une somme immense. Le talent est conservé comme unité historique, car toute conversion moderne serait incertaine et risquerait de réduire la portée de l’hyperbole.
