id: MAT.18.31
reference: Matthew 18:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδόντες ⸀οὖν οἱ σύνδουλοι αὐτοῦ τὰ γενόμενα ἐλυπήθησαν σφόδρα, καὶ ἐλθόντες διεσάφησαν τῷ κυρίῳ ἑαυτῶν πάντα τὰ γενόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/031.yaml
  text: Therefore[a], when his fellow slaves saw what had happened, they were deeply grieved[b], and they came and reported to their lord everything that had happened.
translation:
  language: fr
  text: Alors, ses compagnons d’esclavage[a], voyant ce qui s’était passé, furent profondément attristés. Ils vinrent rapporter à leur maître[b] en détail tout ce qui s’était passé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ses coesclaves »; le terme grec désigne des esclaves qui dépendent du même maître.
    reason: lexical_alternative
  - marker: b
    text: Ou « seigneur »; ici, le mot grec désigne le maître humain dans la parabole.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Alors
  rationale: Dans ce récit, οὖν marque la progression découlant de l’action précédente. « Alors » conserve ce lien avec plus de naturel en français narratif que « donc » ou « par conséquent ».
- source_word: σύνδουλοι
  choice: les esclaves qui servaient avec lui
  rationale: Le terme désigne des personnes partageant avec lui la condition d’esclave sous un même maître. Cette formulation française naturelle garde explicite leur statut commun sans employer le peu idiomatique « coesclaves ».
- source_word: τὰ γενόμενα / πάντα τὰ γενόμενα
  choice: ce qui s’était passé / tout ce qui s’était passé
  rationale: Ces formulations rendent naturellement les participes substantivés de γίνομαι; « tout » dans la seconde occurrence traduit πάντα et préserve l’intensification.
- source_word: ἐλυπήθησαν σφόδρα
  choice: ils furent profondément attristés
  rationale: Le passif de λυπέω exprime ici une vive peine, intensifiée par σφόδρα. « Profondément attristés » en conserve le poids affectif sans préciser indûment s’il s’agit de tristesse ou de détresse.
- source_word: ἐλθόντες
  choice: ils se rendirent auprès de
  rationale: Le participe aoriste indique le déplacement qui précède le rapport. Cette tournure rend clairement et naturellement la séquence en français.
- source_word: διεσάφησαν
  choice: lui rapportèrent en détail
  rationale: Le verbe signifie faire connaître clairement ou exposer avec précision. « Rapportèrent en détail » convient à la scène et préserve davantage sa nuance que le simple « racontèrent ».
- source_word: τῷ κυρίῳ ἑαυτῶν
  choice: à leur maître
  rationale: Pour un supérieur humain qui possède des esclaves dans le cadre de la parabole, « maître » est le terme français naturel et contextuellement exact pour κύριος.
theological_decisions:
- issue: Traduction du terme de la famille de δοῦλος dans le cadre social de la parabole
  choice: les esclaves qui servaient avec lui
  alternative: ses compagnons de service / les serviteurs qui servaient avec lui
  rationale: Le statut servile commun participe à la logique de la parabole. Le rendre explicitement évite d’atténuer le grec, tout en formulant l’expression de manière intelligible en français courant.
- issue: Traduction de κύριος lorsqu’il désigne un supérieur humain
  choice: maître
  alternative: seigneur
  rationale: Ici, le référent est le maître humain des esclaves dans la parabole. « Maître » exprime naturellement cette relation sans transformer le personnage en référent explicitement divin.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est divisée en deux phrases pour éviter une longue coordination tout en conservant la succession des actions. Le vocabulaire explicite la condition d’esclave, importante dans la scène, sans archaïsme inutile.
