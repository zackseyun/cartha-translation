id: MAT.18.10
reference: Matthew 18:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁρᾶτε μὴ καταφρονήσητε ἑνὸς τῶν μικρῶν τούτων, λέγω γὰρ ὑμῖν ὅτι οἱ ἄγγελοι αὐτῶν ἐν οὐρανοῖς διὰ παντὸς βλέπουσι τὸ πρόσωπον τοῦ πατρός μου τοῦ ἐν ⸀οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/010.yaml
  text: See that you do not despise one of these little ones[c][b][a], for I tell you that their angels in heaven continually see the face of my Father who is in heaven.
translation:
  language: fr
  text: 'Veillez à ne pas mépriser un seul de ces petits[a]. Car je vous le dis : leurs anges[b], dans les cieux, voient continuellement le visage de mon Père qui est dans les cieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « regarder de haut un seul de ces petits ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « leurs anges » peut désigner des anges associés à ces petits ou les représentant ; ce verset ne définit pas à lui seul toute la doctrine des anges gardiens.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁρᾶτε μὴ καταφρονήσητε
  choice: Veillez à ne mépriser
  rationale: La tournure grecque formule une mise en garde suivie d’une interdiction. « Veillez à ne pas » est naturel en français moderne et conserve l’appel à la vigilance ; « mépriser » garde la force de καταφρονέω.
- source_word: ἑνὸς τῶν μικρῶν τούτων
  choice: aucun de ces petits
  rationale: Dans une phrase négative, « aucun de ces petits » exprime naturellement l’interdiction de mépriser ne serait-ce qu’un seul d’entre eux. « Ces petits » préserve l’ouverture du grec, qui peut évoquer les enfants et, plus largement dans le contexte, ceux qui sont petits ou humbles.
- source_word: λέγω γὰρ ὑμῖν
  choice: Car je vous le dis
  rationale: Formulation française courante qui conserve la valeur explicative de γάρ et l’affirmation solennelle de Jésus.
- source_word: οἱ ἄγγελοι αὐτῶν
  choice: leurs anges
  rationale: Le possessif grec est rendu directement, sans préciser la nature exacte du lien entre les anges et « ces petits ».
- source_word: ἐν οὐρανοῖς
  choice: dans les cieux
  rationale: Le pluriel du grec est conservé dans une expression française claire et bibliquement naturelle.
- source_word: διὰ παντὸς
  choice: continuellement
  rationale: L’expression signifie « en tout temps » ou « sans cesse ». « Continuellement » conserve cette valeur sans imposer une explication supplémentaire.
- source_word: βλέπουσι τὸ πρόσωπον
  choice: voient […] le visage
  rationale: La traduction directe maintient l’image de l’accès à la présence du Père.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: de mon Père qui est dans les cieux
  rationale: La formulation préserve à la fois le possessif distinctif « mon Père » et la proposition attributive indiquant sa demeure.
theological_decisions:
- issue: Sens de « leurs anges »
  choice: Conserver littéralement « leurs anges » sans définir une doctrine d’anges gardiens individuels.
  alternative: Comprendre qu’un ange gardien particulier est assigné à chaque enfant ou croyant, ou que ces anges représentent ou servent collectivement les petits.
  rationale: Le grec affirme un rapport entre les anges et « ces petits », mais ne précise pas à lui seul la nature exacte de ce rapport. La traduction préserve donc cette indétermination.
- issue: Référent de « ces petits »
  choice: Employer « ces petits » sans limiter explicitement le groupe aux seuls enfants.
  alternative: Traduire « ces petits enfants » ou expliciter « ces croyants humbles ».
  rationale: Le contexte de Matthieu 18 met en scène un enfant, mais l’expression peut aussi s’étendre à ceux qui deviennent petits ou humbles. Une formulation ouverte évite de trancher au-delà du texte.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste simple et orale, tandis que « le visage de mon Père » et « dans les cieux » conservent l’imagerie et la solennité du texte grec.
