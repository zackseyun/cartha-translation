  variant: modern international French
source:
  edition: SBLGNT
  text: ὅστις οὖν ταπεινώσει ἑαυτὸν ὡς τὸ παιδίον τοῦτο, οὗτός ἐστιν ὁ μείζων ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/004.yaml
  text: Therefore, whoever humbles himself like this child, he is the greatest in the kingdom of heaven.
translation:
  language: fr
  text: Ainsi donc, celui qui s’abaissera comme cet enfant, c’est lui qui est le plus grand dans le royaume des cieux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταπεινώσει ἑαυτόν
  choice: s’abaissera
  rationale: Le verbe exprime ici l’action de se rendre humble ou petit. « S’abaissera » restitue la forme active réfléchie et s’accorde naturellement avec la comparaison à l’enfant.
- source_word: ὡς τὸ παιδίον τοῦτο
  choice: comme cet enfant
  rationale: Traduction directe qui conserve le référent concret présent dans la scène.
- source_word: ὁ μείζων
  choice: le plus grand
  rationale: Dans ce contexte comparatif de rang, le grec emploie le comparatif avec une valeur superlative idiomatique.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Formulation consacrée qui traduit littéralement l’expression caractéristique de Matthieu sans en réduire la portée.
theological_decisions:
- issue: Lien entre l’abaissement volontaire et la grandeur dans le royaume
  choice: 'Conserver l’énoncé direct : « celui qui s’abaissera… c’est lui qui est le plus grand »'
  alternative: Paraphraser en « celui qui se rendra aussi humble que cet enfant »
  rationale: La traduction maintient la tension du texte entre abaissement et grandeur, sans définir davantage en quoi consiste l’humilité de l’enfant.
- issue: Emphase de οὗτός ἐστιν
  choice: « c’est lui qui est »
  alternative: 'Simple copule : « est le plus grand »'
  rationale: La tournure disloquée française rend l’insistance du démonstratif οὗτός et de la proposition grecque sans lourdeur excessive.
translation_notes:
  register: Français moderne, courant et digne. « Ainsi donc » marque explicitement la conséquence portée par ὅστις οὖν. La tournure « c’est lui qui est » préserve l’emphase grecque.
