id: MAT.18.7
reference: Matthew 18:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐαὶ τῷ κόσμῳ ἀπὸ τῶν σκανδάλων· ἀνάγκη ⸀γὰρ ἐλθεῖν τὰ σκάνδαλα, πλὴν οὐαὶ τῷ ⸀ἀνθρώπῳ δι’ οὗ τὸ σκάνδαλον ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/007.yaml
  text: Woe to the world because of stumbling blocks[a]; for it is necessary that the stumbling blocks come[b], but woe to the man through whom the stumbling block comes.
translation:
  language: fr
  text: Malheur au monde à cause des occasions de chute[a] ! Il faut en effet que les occasions de chute surviennent. Mais malheur à l’homme[b] par qui l’occasion de chute survient !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « causes de péché », « pièges » ou « offenses ». Le mot grec désigne ce qui fait trébucher quelqu’un, notamment en l’incitant au péché ou en lui en fournissant l’occasion.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici un nom au masculin singulier; dans ce contexte, l’avertissement vise tout individu par qui une telle occasion de chute survient.
    reason: cultural_note
lexical_decisions:
- source_word: οὐαί
  choice: Malheur à
  rationale: Cette formule conserve la force prophétique et judiciaire de l’avertissement, ainsi que sa répétition dans les deux propositions.
- source_word: κόσμῳ
  choice: au monde
  rationale: Le terme désigne largement le monde humain touché par le mal, sans qu’il soit nécessaire de préciser davantage dans la traduction.
- source_word: ἀπὸ
  choice: à cause de
  rationale: Dans ce contexte, la préposition exprime la cause du malheur annoncé.
- source_word: σκάνδαλα / σκάνδαλον
  choice: occasions de chute / occasion de chute
  rationale: Cette expression préserve l’image de ce qui fait trébucher tout en couvrant l’incitation au péché, le piège et l’offense. La distinction entre pluriel et singulier est maintenue.
- source_word: ἀνάγκη
  choice: Il faut
  rationale: Cette tournure française naturelle exprime la nécessité sans en définir la source ni la nature.
- source_word: γάρ
  choice: en effet
  rationale: L’expression introduit naturellement l’explication du premier constat de malheur.
- source_word: ἐλθεῖν ... ἔρχεται
  choice: surviennent ... survient
  rationale: Le même verbe est répété afin de refléter la reprise grecque, tandis que « survenir » convient mieux que « venir » à des occasions de chute.
- source_word: πλήν
  choice: Mais
  rationale: La conjonction marque clairement le contraste entre la nécessité annoncée et la responsabilité de l’individu.
- source_word: ἀνθρώπῳ
  choice: à l’homme
  rationale: Le masculin singulier du grec est conservé dans le texte principal; sa portée représentative est explicitée en note.
- source_word: δι’ οὗ
  choice: par qui
  rationale: Cette formulation française exprime naturellement l’intermédiaire humain par lequel l’occasion de chute survient.
theological_decisions:
- issue: Nature de la nécessité exprimée par ἀνάγκη γὰρ ἐλθεῖν τὰ σκάνδαλα
  choice: Exprimer la nécessité par « Il faut » sans en préciser le fondement.
  alternative: « Les occasions de chute sont inévitables » ou « il est nécessaire que les occasions de chute surviennent ».
  rationale: Le grec affirme une nécessité, mais n’indique pas explicitement s’il s’agit d’un décret divin, d’une nécessité providentielle ou d’une inévitabilité liée à l’état du monde. La formulation retenue préserve cette tension.
- issue: Portée représentative de ἀνθρώπῳ
  choice: Conserver « l’homme » dans le texte et préciser sa portée générique en note.
  alternative: « la personne » ou « quiconque ».
  rationale: Le substantif grec est ici au masculin singulier, tout en pouvant désigner représentativement n’importe quel individu responsable.
translation_notes:
  register: Français international moderne, clair et digne. « Occasion de chute » garde la métaphore biblique sans employer « scandale », dont le sens courant moderne est souvent trop étroit. La répétition et l’opposition rhétorique du grec sont conservées.
