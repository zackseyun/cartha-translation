  text: Τότε προσελθὼν ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, ποσάκις ἁμαρτήσει εἰς ἐμὲ ὁ ἀδελφός μου καὶ ἀφήσω αὐτῷ; ἕως ἑπτάκις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/021.yaml
  text: Then Peter came up to him and said[a], “Lord, how many times will my brother sin against me, and I forgive him? Up to seven times?”
translation:
  language: fr
  text: 'Alors Pierre s’approcha de lui et dit : « Seigneur, combien de fois mon frère[a] péchera-t-il contre moi et lui pardonnerai-je ? Jusqu’à sept fois ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon frère ou ma sœur » ; le grec dit « mon frère » au masculin singulier, mais l’expression peut désigner ici plus largement un autre disciple.
    reason: Préciser la portée contextuelle possible du masculin singulier sans modifier le texte principal.
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la progression du récit et le lien avec l’enseignement qui précède.
- source_word: προσελθὼν αὐτῷ ὁ Πέτρος εἶπεν
  choice: Pierre s’approcha de lui et dit
  rationale: Reproduit le mouvement vers Jésus puis la prise de parole, tout en conservant le pronom grec sans ajouter explicitement le nom de Jésus.
- source_word: Κύριε
  choice: Seigneur
  rationale: Rend le vocatif κύριε avec son respect et sa possible portée théologique.
- source_word: ποσάκις
  choice: combien de fois
  rationale: Exprime une fréquence chiffrable et prépare naturellement la limite proposée de sept fois.
- source_word: ἁμαρτήσει εἰς ἐμὲ
  choice: péchera-t-il contre moi
  rationale: Conserve le futur grec et rend idiomatiquement εἰς ἐμέ comme une faute dirigée contre Pierre.
- source_word: ὁ ἀδελφός μου
  choice: mon frère
  rationale: Respecte le masculin singulier du grec; l’éventuelle portée plus large dans la communauté des disciples est signalée en note.
- source_word: καὶ ἀφήσω αὐτῷ
  choice: et lui pardonnerai-je
  rationale: Conserve le futur et la coordination grecque, y compris la tension de la formulation interrogative, sans la transformer en paraphrase normative.
- source_word: ἕως ἑπτάκις
  choice: Jusqu’à sept fois ?
  rationale: Présente fidèlement sept comme la limite envisagée par Pierre.
theological_decisions:
- issue: Portée de ἀδελφός dans le contexte communautaire
  choice: « mon frère » dans le texte principal
  alternative: « mon frère ou ma sœur » ou « un autre disciple »
  rationale: Le grec porte le masculin singulier, mais le terme peut désigner plus largement un membre de la communauté des disciples. La traduction conserve la forme du texte et place l’élargissement contextuel possible en note.
- issue: Relation entre le péché répété et le pardon
  choice: Conserver les deux futurs coordonnés sous forme de question
  alternative: « combien de fois devrai-je pardonner à mon frère lorsqu’il pèche contre moi ? »
  rationale: La paraphrase alternative serait plus idiomatique, mais elle réorganiserait la question et expliciterait une obligation que la formulation grecque laisse dans la demande de Pierre.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe interrogative conserve de près la structure grecque tout en restant compréhensible; « s’approcha » convient mieux au registre biblique courant que le plus familier « vint vers lui ».
