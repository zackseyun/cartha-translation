source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ ὁ δοῦλος ἐκεῖνος εὗρεν ἕνα τῶν συνδούλων αὐτοῦ ὃς ὤφειλεν αὐτῷ ἑκατὸν δηνάρια, καὶ κρατήσας αὐτὸν ἔπνιγεν λέγων· ⸀Ἀπόδος εἴ τι ὀφείλεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/028.yaml
  text: But when that slave went out[a], he found one of his fellow slaves who owed him a hundred denarii, and seizing him, he began choking him, saying[b], ‘Pay back whatever you owe.’
translation:
  language: fr
  text: 'Mais, en sortant, cet esclave trouva un de ses compagnons d’esclavage qui lui devait cent deniers[a]. Il le saisit et se mit à l’étrangler en disant : « Rembourse ce que tu dois[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un denier correspondait couramment au salaire d’une journée de travail d’un ouvrier ou d’un soldat.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « Rembourse, si tu dois quelque chose. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: esclave
  rationale: Le statut de dépendance et le pouvoir coercitif sont essentiels à la scène; « esclave » exprime plus exactement cette réalité que « serviteur ».
- source_word: ἐξελθὼν δὲ
  choice: Mais, en sortant
  rationale: Rend naturellement le participe aoriste et la transition marquée par δέ, sans préciser davantage le rapport temporel.
- source_word: συνδούλων
  choice: compagnons d’esclavage
  rationale: Exprime le préfixe σύν- et le statut commun tout en évitant l’expression peu naturelle « coesclaves ».
- source_word: ὤφειλεν
  choice: devait
  rationale: Terme français courant et exact pour une dette financière.
- source_word: ἑκατὸν δηνάρια
  choice: cent deniers
  rationale: Conserve l’unité monétaire historique et permet de maintenir le contraste quantitatif de la parabole.
- source_word: κρατήσας
  choice: le saisit
  rationale: Traduit l’action physique énergique de façon concise.
- source_word: ἔπνιγεν
  choice: se mit à l’étrangler
  rationale: Rend naturellement l’aspect imperfectif, ici compris comme le début d’une action violente qui se prolonge.
- source_word: Ἀπόδος
  choice: Rembourse
  rationale: Impératif direct et idiomatique dans le contexte d’une dette.
- source_word: εἴ τι ὀφείλεις
  choice: tout ce que tu dois
  rationale: Rend en français idiomatique la valeur indéfinie de εἴ τι, sans la réduire à une somme désignée de façon définie; la formulation plus littérale est signalée en note.
theological_decisions:
- issue: Traduction de δοῦλος dans le récit parabolique
  choice: esclave / compagnons d’esclavage
  alternative: serviteur / compagnons de service
  rationale: La relation de possession, la dette et la violence coercitive rendent ici le statut servile particulièrement saillant; « esclave » préserve cette dureté sociale sans l’atténuer.
- issue: Portée de εἴ τι ὀφείλεις
  choice: tout ce que tu dois
  alternative: si tu dois quelque chose
  rationale: Le tour peut fonctionner comme une expression indéfinie. Le texte principal privilégie une formulation française naturelle, tandis que la note conserve la forme conditionnelle et son ambiguïté apparente.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation scinde la longue phrase grecque pour la lisibilité. « Compagnon d’esclavage » garde le statut commun exprimé par σύνδουλος sans recourir à un terme rare. Les marqueurs de notes sont placés immédiatement après les éléments concernés.
