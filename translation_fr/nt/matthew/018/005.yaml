id: MAT.18.5
reference: Matthew 18:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἐὰν δέξηται ⸂ἓν παιδίον τοιοῦτο⸃ ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/005.yaml
  text: And whoever receives one such child in my name receives me[a][b].
translation:
  language: fr
  text: Et celui qui accueille en mon nom un enfant comme celui-ci m’accueille[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reçoit … me reçoit ». Le verbe grec peut signifier « accueillir », « recevoir » ou « accepter ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ἐὰν
  choice: celui qui
  rationale: La construction relative avec ἐάν exprime une condition générale. « Celui qui » est naturel en français et conserve cette portée indéfinie.
- source_word: δέξηται / δέχεται
  choice: accueille / accueille
  rationale: « Accueillir » convient naturellement à une personne reçue avec bienveillance et préserve la répétition exacte du même verbe dans les deux propositions.
- source_word: ἓν παιδίον τοιοῦτο
  choice: un enfant comme celui-ci
  rationale: Cette formulation rend explicitement παιδίον sans ajouter « petit », absent du grec, et rattache τοιοῦτο à l’enfant placé devant les disciples.
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: en mon nom
  rationale: Expression française établie qui maintient la référence au nom, à l’autorité ou à l’appartenance à Jésus sans choisir artificiellement une seule de ces nuances.
- source_word: ἐμὲ
  choice: moi-même
  rationale: Le pronom disjoint grec est emphatique. « Moi-même » rend cette insistance tout en soulignant l’identification représentative avec Jésus.
theological_decisions:
- issue: Identification représentative entre l’enfant et Jésus
  choice: Accueillir un tel enfant au nom de Jésus revient à accueillir Jésus lui-même.
  alternative: Comprendre que cet accueil honore seulement Jésus.
  rationale: La répétition de δέχομαι et l’emploi emphatique de ἐμὲ établissent une correspondance forte. La traduction la conserve sans lui ajouter d’implications sacramentelles ou ecclésiales.
translation_notes:
  register: Français international moderne, naturel et digne. « Accueille » est plus idiomatique que « reçoit » pour une personne dans ce contexte; la note conserve l’alternative formelle et signale la répétition lexicale.
