  variant: modern international French
source:
  edition: SBLGNT
  text: πεσὼν οὖν ὁ δοῦλος προσεκύνει αὐτῷ λέγων· ⸀Μακροθύμησον ἐπ’ ⸀ἐμοί, καὶ πάντα ⸂ἀποδώσω σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/026.yaml
  text: So the slave fell down before him and kept pleading[a], saying, ‘Be patient with me, and I will repay you everything.’
translation:
  language: fr
  text: 'Alors l’esclave se jeta à terre devant lui et se prosterna[a] en disant : « Prends patience avec moi, et je te rembourserai tout. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’inclina profondément devant lui ». Le verbe grec peut aussi signifier « adorer » dans d’autres contextes; ici, il décrit une prosternation respectueuse devant un maître humain.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσὼν
  choice: tomba à ses pieds
  rationale: Le participe aoriste de πίπτω décrit le geste physique par lequel l’esclave s’abaisse devant son maître. « Tomba à ses pieds » exprime naturellement cette posture en français.
- source_word: οὖν
  choice: Alors
  rationale: La particule marque ici la conséquence narrative de la décision annoncée au verset précédent. « Alors » assure un enchaînement naturel sans alourdir le récit.
- source_word: δοῦλος
  choice: esclave
  rationale: Dans cette parabole, le statut de dépendance et l’autorité absolue du maître sont saillants. « Esclave » rend plus précisément la réalité sociale désignée par δοῦλος que le terme plus atténué « serviteur ».
- source_word: προσεκύνει
  choice: se prosterna devant lui
  rationale: Dans ce contexte, προσκυνέω désigne un geste de profond respect et de soumission devant un maître humain. « Se prosterna devant lui » préserve le geste sans lui imposer nécessairement le sens religieux de « adorer ».
- source_word: λέγων
  choice: en disant
  rationale: Le participe introduit directement les paroles de l’esclave. La formulation française est simple et fidèle à la structure narrative.
- source_word: Μακροθύμησον ἐπ’ ἐμοί
  choice: Prends patience avec moi
  rationale: L’impératif demande au maître de différer son jugement et de faire preuve de patience. Cette tournure est claire et idiomatique en français moderne.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel a ici une portée globale et renvoie à la totalité de la dette.
- source_word: ἀποδώσω σοι
  choice: je te rembourserai
  rationale: Dans un contexte de dette, ἀποδίδωμι signifie rembourser ce qui est dû. Le futur français conserve la promesse formulée par l’esclave.
theological_decisions:
- issue: Sens de προσκυνέω devant un maître humain
  choice: Un geste de prosternation et de soumission respectueuse
  alternative: « Il l’adora »
  rationale: Le personnage se trouve devant un roi et maître humain au sein de la parabole. Le contexte immédiat indique une prosternation suppliante; « adora » risquerait d’introduire une portée cultuelle que le passage n’exige pas, tandis que la note conserve l’étendue sémantique du verbe.
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste accessible tout en conservant le statut social d’« esclave », le geste concret de prosternation et la portée absolue de la promesse de remboursement.
