source:
  edition: SBLGNT
  text: καὶ ἐὰν γένηται εὑρεῖν αὐτό, ἀμὴν λέγω ὑμῖν ὅτι χαίρει ἐπ’ αὐτῷ μᾶλλον ἢ ἐπὶ τοῖς ἐνενήκοντα ἐννέα τοῖς μὴ πεπλανημένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/013.yaml
  text: And if he happens to find it[a], truly I tell you[b], he rejoices over it more than over the ninety-nine that have not gone astray.
translation:
  language: fr
  text: Et s’il arrive à la retrouver[a], vraiment, je vous le dis, il se réjouit davantage à son sujet qu’au sujet des quatre-vingt-dix-neuf qui ne se sont pas égarées[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « s’il arrive qu’il la retrouve ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui ne se sont pas perdues ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Le connecteur simple maintient la continuité de l’illustration de Jésus.
- source_word: ἐὰν γένηται εὑρεῖν αὐτό
  choice: s’il arrive à la retrouver
  rationale: Cette formulation française naturelle exprime la contingence et l’aboutissement de la recherche, tout en conservant la nuance d’éventualité portée par la construction grecque.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: vraiment, je vous le dis
  rationale: Cette formule actuelle et solennelle restitue la force affirmative de ἀμήν sans recourir à un archaïsme.
- source_word: χαίρει ἐπ’ αὐτῷ
  choice: il se réjouit à son sujet
  rationale: « Se réjouit » conserve la force affective de χαίρει, tandis que « à son sujet » indique clairement l’objet de cette joie.
- source_word: μᾶλλον ἢ
  choice: davantage … que
  rationale: La comparaison est rendue directement, sans suggérer une exclusion que le grec n’impose pas.
- source_word: τοῖς ἐνενήκοντα ἐννέα
  choice: les quatre-vingt-dix-neuf
  rationale: Comme en grec, le nom « brebis » reste implicite puisqu’il est évident dans le contexte immédiat.
- source_word: τοῖς μὴ πεπλανημένοις
  choice: qui ne se sont pas égarées
  rationale: Le participe parfait décrit celles qui ne se trouvent pas dans l’état résultant d’un égarement. Le féminin s’accorde avec les brebis sous-entendues.
theological_decisions:
- issue: Portée de la comparaison entre la joie éprouvée pour la brebis retrouvée et celle éprouvée pour les quatre-vingt-dix-neuf
  choice: Conserver l’affirmation selon laquelle le berger se réjouit davantage pour celle qui est retrouvée.
  alternative: Atténuer la comparaison afin de ne suggérer aucune préférence, ou laisser entendre que les quatre-vingt-dix-neuf ont moins de valeur.
  rationale: Le comparatif μᾶλλον ἢ exprime réellement une joie plus grande. La traduction préserve cette tension sans conclure que le berger se soucie moins des quatre-vingt-dix-neuf ni établir une différence de valeur entre elles.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la solennité de la parole de Jésus et l’image pastorale, sans ajouter « brebis » là où le grec la laisse implicite.
