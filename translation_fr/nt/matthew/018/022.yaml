  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Οὐ λέγω σοι ἕως ἑπτάκις ἀλλὰ ἕως ἑβδομηκοντάκις ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/022.yaml
  text: Jesus says to him[a], “I do not say to you, up to seven times, but up to seventy times seven.
translation:
  language: fr
  text: 'Jésus lui dit : « Je ne te dis pas jusqu’à sept fois, mais jusqu’à soixante-dix-sept fois[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soixante-dix fois sept ».'
    reason: Variante de traduction d’une expression grecque ambiguë.
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Cette formulation française naturelle conserve le pronom grec et rend le présent narratif sans lourdeur ; « dit » peut fonctionner comme présent historique en français.
- source_word: Οὐ λέγω σοι
  choice: Je ne te dis pas
  rationale: Rend directement le présent de λέγω et le datif σοι, avec le tutoiement naturel entre Jésus et Pierre dans ce contexte.
- source_word: ἕως ἑπτάκις
  choice: jusqu’à sept fois
  rationale: Dans ce contexte de fréquence et de limite numérique, « jusqu’à » exprime clairement la portée de ἕως, tandis que « sept fois » rend l’adverbe ἑπτάκις.
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque simplement le contraste entre la limite proposée et la réponse de Jésus.
- source_word: ἕως ἑβδομηκοντάκις ἑπτά
  choice: jusqu’à soixante-dix-sept fois
  rationale: Le grec permet de comprendre l’expression comme « soixante-dix-sept fois ». L’autre interprétation ancienne et traditionnelle, « soixante-dix fois sept », est conservée en note afin de ne pas masquer l’ambiguïté.
theological_decisions:
- issue: Expression numérique ambiguë dans l’enseignement de Jésus sur le pardon
  choice: soixante-dix-sept fois
  alternative: soixante-dix fois sept
  rationale: La syntaxe de ἑβδομηκοντάκις ἑπτά admet les deux lectures. Le texte principal retient « soixante-dix-sept fois », lecture directe et idiomatique, tandis que la note préserve l’autre possibilité sans transformer l’une ou l’autre en explication doctrinale. Le verset garde ainsi sa force rhétorique sans imposer une interprétation du nombre.
translation_notes:
  register: Français international moderne, simple et digne. La structure répétée « jusqu’à… mais jusqu’à… » conserve le contraste du grec. Le marqueur de note est placé sur l’expression numérique concernée.
