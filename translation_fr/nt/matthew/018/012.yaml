id: MAT.18.12
reference: Matthew 18:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τί ὑμῖν δοκεῖ; ἐὰν γένηταί τινι ἀνθρώπῳ ἑκατὸν πρόβατα καὶ πλανηθῇ ἓν ἐξ αὐτῶν, οὐχὶ ⸀ἀφήσει τὰ ἐνενήκοντα ἐννέα ἐπὶ τὰ ὄρη ⸀καὶ πορευθεὶς ζητεῖ τὸ πλανώμενον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/012.yaml
  text: What do you think? If a man has a hundred sheep[a], and one of them goes astray[c][b], will he not leave the ninety-nine on the mountains and go and seek the one going astray?
translation:
  language: fr
  text: Qu’en pensez-vous ? Si un homme a cent brebis et que l’une d’elles s’égare[a], ne laissera-t-il pas les quatre-vingt-dix-neuf sur les montagnes[b] pour aller chercher celle qui s’égare[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’éloigne » ou « se met à errer ». Le verbe grec peut aussi, dans certains contextes, signifier « être égaré » ou « être induit en erreur ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans les collines ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « celle qui s’égare » ou « celle qui erre »; traditionnellement « celle qui est perdue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Qu’en pensez-vous ?
  rationale: Question introductive idiomatique qui interpelle directement les auditeurs et les invite à juger la situation.
- source_word: ἐὰν γένηταί τινι ἀνθρώπῳ
  choice: Si un homme a
  rationale: La tournure avec γίνομαι et le datif exprime ici la possession; « un homme » conserve la forme masculine singulière représentative du grec.
- source_word: ἑκατὸν πρόβατα
  choice: cent brebis
  rationale: « Brebis » est naturel dans cette parabole pastorale et correspond à l’usage biblique courant de πρόβατον, sans incidence sur le sens générique du troupeau.
- source_word: πλανηθῇ ἓν ἐξ αὐτῶν
  choice: que l’une d’elles s’égare
  rationale: « S’égarer » préserve à la fois l’image d’un animal qui quitte le chemin et la résonance figurée de πλανάω, sans préciser une cause extérieure.
- source_word: οὐχὶ ἀφήσει
  choice: ne laissera-t-il pas
  rationale: La question avec οὐχί attend une réponse affirmative; le futur français correspond à ἀφήσει, et « laisser » évite la force excessive d’« abandonner ».
- source_word: τὰ ἐνενήκοντα ἐννέα
  choice: les quatre-vingt-dix-neuf
  rationale: Rendu numérique français standard.
- source_word: ἐπὶ τὰ ὄρη
  choice: sur les montagnes
  rationale: Rendu concret et proche de ὄρη; « dans les collines » demeure possible selon la topographie envisagée.
- source_word: καὶ πορευθεὶς ζητεῖ
  choice: pour aller chercher
  rationale: La construction française exprime naturellement le déplacement suivi de la recherche; « chercher » rend directement ζητέω.
- source_word: τὸ πλανώμενον
  choice: celle qui s’égare
  rationale: Le présent verbal reprend le même champ lexical que πλανηθῇ et évite d’introduire « perdue », qui traduirait plus naturellement un autre lexème grec.
theological_decisions:
- issue: Masculin générique de ἀνθρώπῳ
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: Le grec emploie un nom masculin singulier à valeur représentative; le français « un homme » conserve cette forme sans ajouter de particularité doctrinale.
- issue: Nuance de πλανάω dans l’image de la brebis
  choice: s’égare / celle qui s’égare
  alternative: s’éloigne / se perd / est égarée
  rationale: Ce choix maintient l’ambiguïté entre l’errance concrète et sa portée figurée, sans imposer la culpabilité, une action extérieure ou l’idée plus forte exprimée par le vocabulaire de la perte.
- issue: Lien syntaxique de καὶ πορευθεὶς ζητεῖ
  choice: pour aller chercher
  alternative: et, étant allé, cherche / et va chercher
  rationale: La formulation choisie restitue naturellement la succession orientée des actions sans modifier la portée théologique du geste du berger.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique reste directe; le lexique pastoral demeure accessible. Les reprises de « s’égare » conservent l’écho grec et sa tension figurée.
