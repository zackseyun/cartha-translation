  source_fidelity: 'Le texte rend fidèlement la structure et les éléments essentiels du grec : la reprise solennelle (« encore »), la formule emphatique (« en vérité »), l’accord de deux personnes parmi les destinataires, la mention de la terre, l’ampleur de « toute affaire/chose », la demande, et le résultat attribué au Père de Jésus dans les cieux. « Cela leur sera accordé » est une formulation française idiomatique qui exprime adéquatement le résultat promis par γενήσεται αὐτοῖς, sans ajouter de restriction doctrinale.'
