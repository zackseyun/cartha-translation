id: MAT.18.19
reference: Matthew 18:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πάλιν ⸀ἀμὴν λέγω ὑμῖν ὅτι ἐὰν δύο ⸂συμφωνήσωσιν ἐξ ὑμῶν⸃ ἐπὶ τῆς γῆς περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται, γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου τοῦ ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/019.yaml
  text: Again[a], truly I tell you, if two of you agree on earth about any matter they ask for[c][b], it will be done for them by my Father in heaven.
translation:
  language: fr
  text: 'Je vous le dis encore en vérité : si deux d’entre vous, sur la terre, se mettent d’accord au sujet de quoi que ce soit qu’ils demandent, cela leur sera accordé par mon Père qui est dans les cieux.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte, cette parole suit l’enseignement de Jésus sur la démarche communautaire et l’autorité de lier et de délier (18.15-18), bien que sa formulation parle largement de demandes faites d’un commun accord.
    reason: cross_reference
lexical_decisions:
- source_word: Πάλιν
  choice: encore
  rationale: Marque la reprise ou l’ajout d’une parole solennelle en lien avec l’enseignement précédent.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Je vous le dis en vérité
  rationale: Formulation française naturelle et solennelle qui conserve la force emphatique de la formule de Jésus sans imposer la translittération « amen ».
- source_word: ἐὰν δύο συμφωνήσωσιν ἐξ ὑμῶν
  choice: si deux d’entre vous se mettent d’accord
  rationale: « Se mettre d’accord » exprime naturellement l’accord visé par συμφωνέω, tandis que « d’entre vous » rend explicitement ἐξ ὑμῶν.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Équivalent français courant qui maintient le contraste spatial avec le Père dans les cieux.
- source_word: περὶ παντὸς πράγματος οὗ ἐὰν αἰτήσωνται
  choice: au sujet de quoi que ce soit qu’ils demandent
  rationale: Conserve la grande portée de παντὸς πράγματος et le sens de requête de αἰτέω, sans ajouter de restriction absente de la proposition grecque.
- source_word: γενήσεται αὐτοῖς παρὰ τοῦ πατρός μου
  choice: cela leur sera accordé par mon Père
  rationale: Rend naturellement en français le résultat promis et l’action ou la provenance associée au Père, sans la tournure peu idiomatique « cela arrivera pour eux ».
- source_word: τοῦ ἐν οὐρανοῖς
  choice: qui est dans les cieux
  rationale: Conserve le pluriel du grec tout en employant une expression française biblique claire et naturelle.
theological_decisions:
- issue: Portée de la promesse dans son contexte
  choice: Traduire la déclaration dans toute son ampleur sans ajouter de restriction explicite concernant la prière, la discipline communautaire ou la volonté divine.
  alternative: Limiter expressément la promesse aux décisions disciplinaires de la communauté, ou l’élargir explicitement en promesse inconditionnelle applicable à toute prière.
  rationale: Le contexte immédiat concerne la vie et l’autorité de la communauté, et αἰτέω évoque une demande, vraisemblablement adressée à Dieu. Toutefois, le verset ne formule lui-même aucune des précisions doctrinales parfois ajoutées; la traduction maintient donc cette tension contextuelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la solennité de la parole de Jésus, le contraste entre la terre et les cieux, ainsi que l’étendue et l’ambiguïté contextuelle de la promesse.
