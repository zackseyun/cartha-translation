id: MAT.18.8
reference: Matthew 18:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ δὲ ἡ χείρ σου ἢ ὁ πούς σου σκανδαλίζει σε, ἔκκοψον ⸀αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν εἰσελθεῖν εἰς τὴν ζωὴν ⸂κυλλὸν ἢ χωλόν⸃, ἢ δύο χεῖρας ἢ δύο πόδας ἔχοντα βληθῆναι εἰς τὸ πῦρ τὸ αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/008.yaml
  text: And if your hand or your foot causes you to stumble[a], cut it off and throw it away from you. It is better for you to enter into life maimed or lame than, having two hands or two feet, to be thrown into the eternal fire.
translation:
  language: fr
  text: Et si ta main ou ton pied te fait trébucher[a], coupe-le et jette-le loin de toi. Il vaut mieux pour toi entrer dans la vie mutilé ou boiteux que d’avoir deux mains ou deux pieds et d’être jeté dans le feu éternel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « te fait pécher ». Le verbe grec évoque littéralement le fait de faire trébucher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίζει
  choice: te fait trébucher
  rationale: Conserve l’image grecque de la chute tout en restant compréhensible en français moderne; le contexte lui donne une portée morale.
- source_word: ἔκκοψον
  choice: coupe-le
  rationale: Rend l’impératif aoriste de manière concrète et vigoureuse, sans atténuer la dureté de l’image.
- source_word: βάλε ἀπὸ σοῦ
  choice: jette-le loin de toi
  rationale: Exprime à la fois l’action énergique de jeter et l’éloignement marqué par ἀπό.
- source_word: καλόν σοί ἐστιν
  choice: Il vaut mieux pour toi
  rationale: Dans la construction comparative introduite ensuite par ἤ, cette tournure rend naturellement la valeur contextuelle de καλόν.
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: entrer dans la vie
  rationale: Maintient le terme simple « vie » et sa portée eschatologique implicite, sans ajouter « éternelle », absent de cette expression grecque.
- source_word: κυλλὸν
  choice: mutilé
  rationale: Le terme désigne ici une personne privée d’un membre ou rendue infirme, ce qui correspond directement à l’image de la main coupée.
- source_word: χωλόν
  choice: boiteux
  rationale: Équivalent français direct et actuel dans le contexte d’un pied ou d’une jambe atteints.
- source_word: βληθῆναι
  choice: d’être jeté
  rationale: Reproduit clairement l’infinitif passif et conserve la force du verbe βάλλω.
- source_word: τὸ πῦρ τὸ αἰώνιον
  choice: le feu éternel
  rationale: Rend naturellement αἰώνιος dans ce contexte de jugement, sans paraphrase doctrinale.
theological_decisions:
- issue: Portée morale de σκανδαλίζει et maintien de la métaphore
  choice: te fait trébucher
  alternative: te fait pécher
  rationale: La formulation principale conserve l’image de trébucher présente dans le grec; une note signale le sens moral possible sans réduire la tension lexicale.
- issue: Sens eschatologique de εἰς τὴν ζωὴν
  choice: entrer dans la vie
  alternative: entrer dans la vie éternelle
  rationale: Le contexte oppose la vie au feu éternel, mais le grec dit seulement « la vie »; la traduction n’ajoute donc pas un qualificatif absent.
- issue: Caractère littéral ou hyperbolique de l’ordre de mutilation
  choice: conserver sans l’atténuer l’ordre de couper et de jeter
  alternative: paraphraser comme un appel figuré à supprimer toute occasion de péché
  rationale: Le texte emploie des impératifs concrets et saisissants. La traduction préserve cette formulation sans décider dans le texte même comment elle doit être interprétée.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier suit les formes σου et σε. La phrase conserve le parallélisme main/pied et la vigueur de l’avertissement, tout en employant des tournures idiomatiques actuelles.
