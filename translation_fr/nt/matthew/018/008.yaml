  source_fidelity: Le texte rend avec fidélité les impératifs concrets ἔκκοψον et βάλε ἀπὸ σοῦ (« coupe-le et jette-le loin de toi »), la métaphore de σκανδαλίζει (« te fait trébucher »), l’opposition entre entrer dans la vie et être jeté dans le feu éternel, ainsi que la distinction κυλλόν / χωλόν (« mutilé ou boiteux »). « D’avoir deux mains ou deux pieds et d’être jeté » exprime adéquatement le participe ἔχοντα et l’infinitif passif βληθῆναι.
