id: MAT.18.20
reference: Matthew 18:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗ γάρ εἰσιν δύο ἢ τρεῖς συνηγμένοι εἰς τὸ ἐμὸν ὄνομα, ἐκεῖ εἰμι ἐν μέσῳ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/020.yaml
  text: For where two or three are gathered in my name[a], there I am in their midst.
translation:
  language: fr
  text: Car là où deux ou trois sont réunis en mon nom, je suis là au milieu d’eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗ
  choice: là où
  rationale: Introduit une proposition de lieu et forme en français une corrélation naturelle avec ἐκεῖ (« là où… je suis là »), sans donner au grec la portée plus générale de « partout où ».
- source_word: γάρ
  choice: car
  rationale: Conserve la valeur explicative qui relie cette affirmation au contexte précédent.
- source_word: δύο ἢ τρεῖς
  choice: deux ou trois
  rationale: Rend directement l’expression numérique grecque.
- source_word: συνηγμένοι
  choice: sont réunis
  rationale: Le participe parfait passif décrit l’état résultant du rassemblement. « Sont réunis » est naturel en français et préserve la forme passive sans alourdir la phrase.
- source_word: εἰς τὸ ἐμὸν ὄνομα
  choice: en mon nom
  rationale: Expression française idiomatique qui garde la référence au nom de Jésus sans imposer une seule explication — autorité, appartenance ou motif du rassemblement — que le texte ne précise pas entièrement.
- source_word: ἐκεῖ εἰμι
  choice: je suis là
  rationale: Préserve la simplicité de εἰμι et la reprise locative entre οὗ et ἐκεῖ, sans ajouter l’interprétation explicative « je suis présent ».
- source_word: ἐν μέσῳ αὐτῶν
  choice: au milieu d’eux
  rationale: Reproduit naturellement l’image spatiale du grec et convient au groupe mixte ou non spécifié désigné par « deux ou trois ».
theological_decisions:
- issue: Nature de la présence de Jésus auprès des disciples rassemblés
  choice: Formuler directement « je suis là au milieu d’eux »
  alternative: « je suis présent parmi eux » ou une formulation explicitement sacramentelle ou ecclésiologique
  rationale: Le verset affirme la présence réelle de Jésus auprès de ceux qui sont réunis en son nom, mais n’en définit pas le mode. La traduction conserve cette affirmation sans introduire une doctrine confessionnelle particulière.
translation_notes:
  register: 'Français international moderne, clair et digne. La structure « là où… je suis là » conserve la corrélation grecque tout en restant naturelle. Aucune note n’est nécessaire : « au milieu d’eux » rend directement ἐν μέσῳ αὐτῶν, tandis que « parmi eux » serait une variante française équivalente plutôt qu’une ambiguïté exigeant une note.'
