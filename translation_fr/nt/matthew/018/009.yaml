id: MAT.18.9
reference: Matthew 18:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ ὀφθαλμός σου σκανδαλίζει σε, ἔξελε αὐτὸν καὶ βάλε ἀπὸ σοῦ· καλόν σοί ἐστιν μονόφθαλμον εἰς τὴν ζωὴν εἰσελθεῖν, ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς τὴν γέενναν τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/009.yaml
  text: And if your eye causes you to stumble[a], tear it out and throw it away from you. It is better for you to enter into life with one eye than, having two eyes[b], to be thrown into the Gehenna of fire.
translation:
  language: fr
  text: Et si ton œil te fait trébucher[a], arrache-le et jette-le loin de toi. Il vaut mieux pour toi entrer dans la vie avec un seul œil que d’être jeté avec tes deux yeux dans la géhenne[b] de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te fait pécher ». Le verbe grec peut évoquer le fait de faire trébucher, de provoquer la chute ou de conduire au péché.
    reason: lexical_alternative
  - marker: b
    text: La « géhenne » désigne ici le lieu du jugement final, traditionnellement rendu par « enfer ».
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζει
  choice: te fait tomber
  rationale: 'Conserve l’image de la chute portée par le verbe grec, tout en laissant la note expliciter sa portée morale possible : conduire au péché.'
- source_word: ἔξελε
  choice: arrache-le
  rationale: L’impératif aoriste est énergique, et « arrache-le » restitue naturellement en français la violence délibérée de l’image.
- source_word: βάλε ἀπὸ σοῦ
  choice: jette-le loin de toi
  rationale: Cette formulation exprime une séparation décisive et complète, conformément à βάλε et à ἀπὸ σοῦ.
- source_word: καλόν σοί ἐστιν
  choice: Il vaut mieux pour toi
  rationale: Dans la construction comparative introduisant ἤ, καλόν exprime ce qui est préférable plutôt que simplement ce qui est bon.
- source_word: μονόφθαλμον
  choice: avec un seul œil
  rationale: Rend clairement l’adjectif « borgne » dans un français courant, sans employer un terme pouvant paraître marqué ou désigner durablement une personne.
- source_word: εἰς τὴν ζωὴν
  choice: entrer dans la vie
  rationale: Préserve « la vie » sans ajouter « éternelle », absent du grec, tout en conservant sa portée eschatologique dans le contexte.
- source_word: βληθῆναι
  choice: être jeté
  rationale: Rend directement l’infinitif passif de βάλλω dans un français moderne et naturel.
- source_word: γέενναν
  choice: géhenne
  rationale: Conserve le terme spécifique grec et ses associations juives historiques et eschatologiques, plutôt que de le confondre d’emblée avec le terme théologique plus général « enfer ».
- source_word: τοῦ πυρός
  choice: de feu
  rationale: Reproduit sobrement le génitif grec et maintient l’image frappante de « la géhenne de feu ».
theological_decisions:
- issue: Traduction de γέεννα
  choice: géhenne
  alternative: enfer
  rationale: Le grec emploie le terme précis γέεννα. Le conserver évite d’y substituer les associations plus larges et postérieures du mot « enfer » ; une note en précise la fonction dans ce contexte.
- issue: Traduction de εἰς τὴν ζωὴν
  choice: entrer dans la vie
  alternative: entrer dans la vie éternelle
  rationale: Bien que la formule ait vraisemblablement une portée eschatologique, le qualificatif « éternelle » ne figure pas dans ce verset. La traduction maintient donc la formulation et la tension du texte.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reproduit les formes σου et σε. La syntaxe demeure proche du mouvement du grec, tandis que « Il vaut mieux pour toi » et « avec un seul œil » assurent une expression naturelle.
