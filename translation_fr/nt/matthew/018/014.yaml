id: MAT.18.14
reference: Matthew 18:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως οὐκ ἔστιν θέλημα ⸀ἔμπροσθεν τοῦ πατρὸς ⸀ὑμῶν τοῦ ἐν οὐρανοῖς ἵνα ἀπόληται ⸀ἓν τῶν μικρῶν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/014.yaml
  text: In the same way, it is not the will of your Father in heaven that even one of these little ones should perish.
translation:
  language: fr
  text: De même, votre Père qui est dans les cieux ne veut pas qu’un seul de ces petits périsse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « se perde ». Le verbe grec peut signifier « périr » ou « se perdre » ; le contexte immédiat de la brebis égarée favorise cette seconde nuance.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: De même
  rationale: Cette expression relie explicitement l’affirmation à la comparaison de la brebis égarée qui précède.
- source_word: οὐκ ἔστιν θέλημα ἔμπροσθεν τοῦ πατρός
  choice: votre Père… ne veut pas
  rationale: Cette formulation française naturelle exprime fidèlement l’absence de volonté ou de désir chez le Père. Le sens de ἔμπροσθεν est intégré à la tournure idiomatique plutôt que rendu littéralement par « devant », qui serait obscur ici.
- source_word: πατρὸς ὑμῶν τοῦ ἐν οὐρανοῖς
  choice: votre Père qui est dans les cieux
  rationale: Rend le possessif, la relation paternelle et le pluriel οὐρανοῖς dans une formulation française biblique, claire et actuelle.
- source_word: ἵνα ἀπόληται
  choice: qu’… périsse
  rationale: « Périsse » conserve la gravité possible du verbe ἀπόλλυμι, tandis que le sens contextuel « se perde » est signalé en note.
- source_word: ἓν τῶν μικρῶν τούτων
  choice: qu’un seul de ces petits
  rationale: « Un seul » fait ressortir naturellement en français la valeur particularisante du singulier, sans ajouter « même ». « Ces petits » préserve la portée relationnelle ou métaphorique sans limiter l’expression aux enfants.
theological_decisions:
- issue: Sens de ἀπόληται après la comparaison de la brebis égarée
  choice: périsse
  alternative: se perde
  rationale: Le verbe peut évoquer soit la perdition, soit le fait d’être perdu ou égaré. Le texte principal garde la portée grave de « périsse », et la note préserve l’écho immédiat à la brebis égarée.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation verbale « ne veut pas » évite le calque peu idiomatique « ce n’est pas une volonté devant votre Père », tout en conservant le sens de la construction grecque.
