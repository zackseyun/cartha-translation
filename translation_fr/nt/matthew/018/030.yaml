  source_fidelity: Le sens général est fidèlement rendu. Toutefois, « refusa » condense οὐκ ἤθελεν (« ne voulut pas / n’était pas disposé à ») et efface légèrement la formulation volitive du grec. « Il ne voulut pas » est à la fois exact et naturel dans ce contexte. « Il alla le jeter » rend correctement la succession participiale ἀπελθὼν ... ἔβαλεν et conserve la vigueur de βάλλω.
  naturalness: Le français est globalement moderne et fluide. La ponctuation par point après « refusa » rend le contraste ἀλλά un peu abrupt ; un point-virgule relie plus naturellement le refus à l’action opposée qui suit.
