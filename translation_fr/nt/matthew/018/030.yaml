id: MAT.18.30
reference: Matthew 18:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἤθελεν, ἀλλὰ ἀπελθὼν ἔβαλεν αὐτὸν εἰς φυλακὴν ἕως ⸀οὗ ἀποδῷ τὸ ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/030.yaml
  text: But he was not willing[a]; instead[c][b], he went away and threw him into prison until he should pay what was owed.
translation:
  language: fr
  text: Mais il ne voulut pas ; au contraire, il alla le jeter en prison jusqu’à ce qu’il ait remboursé ce qu’il devait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mais il
  rationale: Le pronom reprend le premier serviteur, tandis que δέ marque le contraste avec la supplication qui précède.
- source_word: οὐκ ἤθελεν
  choice: il refusa
  rationale: Littéralement, il « ne voulait pas »; dans ce contexte, « refusa » exprime naturellement sa volonté délibérée de ne pas accéder à la demande.
- source_word: ἀλλὰ
  choice: Au contraire
  rationale: Cette expression rend l’opposition forte entre le refus et l’acte sévère qui suit.
- source_word: ἀπελθὼν
  choice: il alla
  rationale: Le participe aoriste indique une action précédant ou accompagnant l’emprisonnement; une proposition coordonnée est naturelle en français.
- source_word: ἔβαλεν αὐτὸν εἰς φυλακήν
  choice: le jeter en prison
  rationale: « Jeter en prison » conserve la force de βάλλω tout en étant une expression française courante.
- source_word: ἕως οὗ
  choice: jusqu’à ce que
  rationale: Rend avec précision la limite temporelle introduite par la locution grecque.
- source_word: ἀποδῷ
  choice: il ait remboursé
  rationale: Le subjonctif passé après « jusqu’à ce que » exprime l’achèvement attendu du remboursement.
- source_word: τὸ ὀφειλόμενον
  choice: ce qu’il devait
  rationale: Cette formulation rend naturellement le participe substantivé, littéralement « ce qui était dû », sans préciser plus que le grec la nature de la dette.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et accessible. « Jeter en prison » préserve la rudesse de l’action; « refusa » est plus idiomatique que « ne voulut pas », tout en conservant la dimension volontaire du grec.
