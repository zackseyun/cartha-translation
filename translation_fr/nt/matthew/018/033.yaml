  source_fidelity: La question rhétorique « Ne devais-tu pas… ? » rend bien l’obligation morale exprimée par οὐκ ἔδει. « Toi aussi » et « moi aussi » conservent les δύο καί et le parallélisme. La répétition d’« avoir/eu compassion de » reflète correctement ἐλεῆσαι / ἠλέησα. Le terme σύνδουλος désigne bien un esclave partageant le même maître.
