  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἔδει καὶ σὲ ἐλεῆσαι τὸν σύνδουλόν σου, ὡς κἀγὼ σὲ ἠλέησα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/033.yaml
  text: Should you not also have had mercy on your fellow slave[a], as I also had mercy on you?
translation:
  language: fr
  text: Ne devais-tu pas, toi aussi, avoir compassion de ton compagnon de servitude[a], comme moi aussi j’ai eu compassion de toi ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton compagnon de service ». Le grec σύνδουλος désigne un autre esclave relevant du même maître; littéralement, « ton co-esclave ».
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἔδει
  choice: Ne devais-tu pas
  rationale: La question rhétorique exprime une obligation morale et un reproche. Cette formulation est naturelle en français et conserve la force de l’imparfait grec.
- source_word: καὶ σὲ
  choice: toi aussi
  rationale: 'Cette tournure rend l’idée de correspondance : celui qui a bénéficié de la compassion devait à son tour en faire preuve.'
- source_word: ἐλεῆσαι / ἠλέησα
  choice: avoir compassion / ai eu compassion
  rationale: La répétition de la même expression française reflète la répétition du verbe grec ἐλεέω. « Avoir compassion » reste courant, digne et suffisamment fort dans ce contexte.
- source_word: τὸν σύνδουλόν σου
  choice: ton compagnon d’esclavage
  rationale: σύνδουλος désigne un esclave qui dépend du même maître. Cette traduction conserve à la fois le statut servile et l’idée exprimée par le préfixe σύν- d’une condition partagée.
- source_word: ὡς
  choice: comme
  rationale: « Comme » marque simplement et clairement la comparaison entre la compassion attendue et celle qui a déjà été reçue.
- source_word: κἀγὼ
  choice: moi aussi
  rationale: κἀγώ, contraction de καὶ ἐγώ, met explicitement le locuteur en parallèle avec l’interlocuteur. « Moi aussi » préserve cette correspondance.
theological_decisions:
- issue: Traduction du terme de la famille de δοῦλος dans σύνδουλος
  choice: compagnon d’esclavage
  alternative: compagnon de service ; autre esclave au service du même maître
  rationale: Dans cette parabole, le rapport d’autorité avec le roi-maître et la condition de dépendance sont importants. « Compagnon d’esclavage » maintient cette dimension sans atténuer σύνδουλος en simple « serviteur », tandis que la note signale des formulations possibles plus traditionnelles ou explicatives.
translation_notes:
  register: Français international moderne, dans un registre digne et direct. La structure de la question rhétorique ainsi que la répétition de « compassion » ont été conservées. « Compagnon d’esclavage » est moins idiomatique que « compagnon de service », mais traduit plus précisément le statut commun exprimé par σύνδουλος ; une note accompagne donc ce choix.
