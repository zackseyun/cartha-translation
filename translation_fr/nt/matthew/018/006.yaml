- from: Mais si quelqu’un fait trébucher un seul de ces petits qui croient en moi[a], il vaudrait mieux pour lui qu’on lui suspende au cou une meule que fait tourner un âne[b] et qu’on le noie en pleine mer[c].
  to: Mais quiconque fait trébucher l’un de ces petits qui croient en moi[a], il vaudrait mieux pour lui qu’on lui suspende au cou une meule que fait tourner un âne[b] et qu’on le noie en pleine mer[c].
  rationale: La révision limitée de « Mais si quelqu’un » en « Mais quiconque » restitue la valeur universelle de la relative indéfinie grecque, sans modifier le sens de l’avertissement. « L’un de ces petits » est une formulation française légèrement plus idiomatique tout en conservant ἕνα (« un »).
