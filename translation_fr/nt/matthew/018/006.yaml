id: MAT.18.6
reference: Matthew 18:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὃς δ’ ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν τούτων τῶν πιστευόντων εἰς ἐμέ, συμφέρει αὐτῷ ἵνα κρεμασθῇ μύλος ὀνικὸς ⸀εἰς τὸν τράχηλον αὐτοῦ καὶ καταποντισθῇ ἐν τῷ πελάγει τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/006.yaml
  text: But whoever causes one of these little ones who believe in me to stumble[c][b][a], it is better for him that a donkey millstone be hung around his neck and that he be drowned in the open sea.
translation:
  language: fr
  text: Mais quiconque fait trébucher l’un de ces petits qui croient en moi[a], il vaudrait mieux pour lui qu’on lui suspende au cou une meule que fait tourner un âne[b] et qu’on le noie en pleine mer[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « entraîne au péché l’un de ces petits qui croient en moi ». Le verbe grec peut évoquer le fait de faire trébucher, de provoquer une chute spirituelle ou d’entraîner au péché.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit d’une grande meule actionnée par un âne, et non d’une petite meule à main.
    reason: cultural_note
  - marker: c
    text: Ou « dans les profondeurs de la mer ». Le grec désigne plus précisément la haute mer, loin du rivage.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: fait trébucher
  rationale: 'Cette formulation conserve la métaphore grecque et sa portée ouverte : provoquer la chute spirituelle, entraîner au péché ou détourner de la foi. Elle évite de réduire le verbe à une simple offense.'
- source_word: μικρῶν τούτων
  choice: ces petits
  rationale: Le syntagme peut viser les personnes humbles, vulnérables ou peu considérées, et pas seulement des enfants. « Ces petits » maintient cette largeur de sens dans le contexte.
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: qui croient en moi
  rationale: Traduction directe et naturelle du participe avec πιστεύω εἰς ; elle identifie ces petits comme des croyants sans ajouter d’interprétation.
- source_word: συμφέρει αὐτῷ
  choice: il vaudrait mieux pour lui
  rationale: Cette tournure idiomatique française exprime l’avantage comparatif sinistre envisagé dans l’avertissement.
- source_word: μύλος ὀνικὸς
  choice: une meule que fait tourner un âne
  rationale: ὀνικός désigne une meule actionnée par un âne, donc beaucoup plus grande qu’une meule à main. La formulation explicite l’image antique sans la remplacer par une simple indication de taille.
- source_word: εἰς τὸν τράχηλον αὐτοῦ
  choice: qu’on lui suspende au cou
  rationale: Cette construction rend naturellement en français l’idée de suspendre la meule à son cou.
- source_word: καταποντισθῇ
  choice: qu’on le noie
  rationale: Le passif grec décrit le fait d’être précipité ou submergé dans l’eau jusqu’à la noyade. Cette traduction communique clairement l’issue de l’image.
- source_word: ἐν τῷ πελάγει τῆς θαλάσσης
  choice: en pleine mer
  rationale: πέλαγος évoque l’étendue profonde et ouverte de la mer, loin du rivage. « En pleine mer » est précis et naturel en français.
theological_decisions:
- issue: Portée de l’expression « ces petits »
  choice: Conserver « ces petits qui croient en moi », avec une portée potentiellement plus large que les seuls enfants.
  alternative: « ces petits enfants qui croient en moi »
  rationale: Même si un enfant sert d’exemple dans le contexte immédiat, la précision « qui croient en moi » permet aussi de comprendre l’expression comme désignant des disciples humbles ou vulnérables. La traduction ne tranche pas inutilement.
- issue: Nature de la chute provoquée
  choice: Employer « fait trébucher » afin de préserver la métaphore et l’étendue sémantique du verbe.
  alternative: « entraîne à pécher »
  rationale: Le verbe peut désigner l’incitation au péché, mais aussi une chute spirituelle plus générale ou l’abandon de la foi. La traduction principale maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la force sévère de l’avertissement et l’image concrète de la meule, tout en évitant les archaïsmes et les précisions doctrinales non imposées par le grec.
