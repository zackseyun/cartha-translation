id: MAT.18.23
reference: Matthew 18:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ ὃς ἠθέλησεν συνᾶραι λόγον μετὰ τῶν δούλων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/023.yaml
  text: For this reason the kingdom of heaven has become like a king who wanted to settle accounts with his slaves[a][b].
translation:
  language: fr
  text: C’est pourquoi le royaume des cieux a été comparé à un roi qui voulut régler ses comptes avec ses esclaves[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs »; le grec δοῦλοι désigne des personnes placées sous l’autorité et la dépendance du roi.
    reason: alternative_reading
  - marker: b
    text: Littéralement « a été rendu semblable à »; on peut aussi traduire « est semblable à ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Rend naturellement le lien causal et déductif avec l’enseignement qui précède.
- source_word: ὡμοιώθη
  choice: a été comparé à
  rationale: Conserve la forme passive de l’aoriste de ὁμοιόω et introduit clairement la comparaison, sans suggérer que le royaume aurait réellement changé d’état.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Expression consacrée chez Matthieu en français, qui garde le pluriel du grec et peut désigner le règne ou la royauté céleste.
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: un roi
  rationale: βασιλεῖ précise ici ἀνθρώπῳ; en français courant, « un roi » exprime le sens sans la lourdeur de « un homme, un roi ».
- source_word: ἠθέλησεν
  choice: voulut
  rationale: Exprime directement la volonté du roi et convient au registre narratif de la parabole.
- source_word: συνᾶραι λόγον
  choice: régler ses comptes
  rationale: Locution française naturelle qui restitue l’idée d’examiner et de solder des comptes.
- source_word: μετὰ τῶν δούλων αὐτοῦ
  choice: avec ses esclaves
  rationale: Rend explicitement le statut de dépendance exprimé par δοῦλοι dans ce cadre royal et économique; « serviteurs » demeure une possibilité contextuelle.
theological_decisions:
- issue: Traduction de δοῦλος dans un contexte royal et économique
  choice: esclaves
  alternative: serviteurs; serviteurs liés
  rationale: Le pouvoir du roi et la reddition de comptes rendent saillant le statut de dépendance. Le choix ne doit toutefois pas effacer l’usage fonctionnel possible de δοῦλος pour des serviteurs administrant des biens.
- issue: Portée de la comparaison du royaume
  choice: a été comparé à un roi
  alternative: est semblable à un roi; est devenu semblable à un roi
  rationale: Le passif grec est conservé. La formule ne signifie pas nécessairement que chaque détail concernant le roi définit directement le royaume; elle introduit l’ensemble de la parabole.
translation_notes:
  register: Français international moderne, clair et digne. « C’est pourquoi » maintient le lien discursif; « régler ses comptes » est idiomatique sans perdre l’image financière. Le passé simple « voulut » convient à la narration écrite tout en restant largement compréhensible.
