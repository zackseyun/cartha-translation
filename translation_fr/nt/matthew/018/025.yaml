id: MAT.18.25
reference: Matthew 18:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι ἐκέλευσεν αὐτὸν ὁ ⸀κύριος πραθῆναι καὶ τὴν ⸀γυναῖκα καὶ τὰ τέκνα καὶ πάντα ὅσα ⸀ἔχει καὶ ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/025.yaml
  text: But since he was unable to repay[a], the master ordered that he be sold, along with his wife and children and all that he had[b], and that payment be made.
translation:
  language: fr
  text: Mais comme il n’avait pas de quoi rembourser, le maître[a] ordonna qu’il soit vendu, ainsi que sa femme, ses enfants et tout ce qu’il possédait[b], et que le remboursement soit effectué.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le seigneur ». Le grec κύριος peut désigner un seigneur ou un maître ; ici, il s’agit du supérieur humain du serviteur dans la parabole.
    reason: lexical_alternative
  - marker: b
    text: L’homme et sa famille devaient être vendus, ainsi que ses biens, afin qu’un remboursement soit effectué.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ ἔχοντος δὲ αὐτοῦ ἀποδοῦναι
  choice: Mais comme il n’avait pas de quoi rembourser
  rationale: Le génitif absolu exprime ici la circonstance causale. « Ne pas avoir de quoi rembourser » rend naturellement l’idée d’un manque de moyens, sans transformer explicitement le texte en simple incapacité.
- source_word: ὁ κύριος
  choice: le maître
  rationale: Dans le cadre social de la parabole, κύριος désigne le supérieur du serviteur. « Maître » est naturel en français et évite de présenter ce personnage humain comme portant directement le titre divin « Seigneur ».
- source_word: ἐκέλευσεν
  choice: ordonna
  rationale: Le verbe κελεύω exprime un ordre donné avec autorité ; « ordonna » convient au contexte et au registre narratif.
- source_word: πραθῆναι
  choice: qu’il soit vendu
  rationale: Cette formulation conserve la voix passive de l’infinitif grec et le caractère coercitif de la vente.
- source_word: τὴν γυναῖκα καὶ τὰ τέκνα
  choice: sa femme, ses enfants
  rationale: Les possessifs, implicites dans le contexte grec, sont nécessaires à une expression française naturelle et claire.
- source_word: πάντα ὅσα ἔχει
  choice: tout ce qu’il possédait
  rationale: Cette traduction exprime la totalité de ses biens sans réduire la formule à une catégorie particulière de possessions.
- source_word: καὶ ἀποδοθῆναι
  choice: et que le remboursement soit effectué
  rationale: La tournure passive correspond à l’infinitif passif grec et laisse l’objet du remboursement implicite, comme dans le texte source.
theological_decisions:
- issue: Valeur de κύριος dans la parabole
  choice: le maître
  alternative: le seigneur
  rationale: Le mot conserve son sens d’autorité, mais désigne ici le supérieur humain du débiteur dans le récit. « Maître » respecte ce contexte sans imposer une identification divine directe.
- issue: Nature de l’impossibilité de rembourser
  choice: il n’avait pas de quoi rembourser
  alternative: il était incapable de rembourser
  rationale: La formulation retenue suit de près μὴ ἔχοντος et met en avant l’absence de ressources, tout en laissant intacte la portée morale et théologique de la dette dans la parabole.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve les deux infinitifs passifs du grec par des propositions au subjonctif passif, tout en restant lisible. Les répétitions et l’enchaînement de la phrase reflètent le mouvement narratif du texte source.
