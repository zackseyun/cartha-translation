review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est bien rendu dans l’ensemble : la condition (« s’il ne… écoute pas »), l’ajout d’une ou deux personnes, le but, et la formule juridique relative à l’établissement de toute affaire sont conservés. « Toute affaire » rend correctement πᾶν ῥῆμα dans son contexte juridique. L’objet « t’ » dans « ne t’écoute pas » est implicite d’après le contexte immédiat et est recevable en français.'
  naturalness: « Prends encore avec toi une ou deux personnes » est compréhensible, mais la position de « encore » peut se lire comme une répétition de l’action (« prends de nouveau ») plutôt que comme l’ajout de personnes. « Une ou deux autres personnes » exprime sans ambiguïté la valeur additive de ἔτι et est plus naturel. Dans un français moderne, « sur la déclaration de deux ou trois témoins » est plus idiomatique et juridiquement clair que « sur la parole de deux ou trois témoins », tout en gardant le sens de l’idiome grec.
  terminology: « Témoins » et « affaire » sont appropriés. « Déclaration » rend ici la portée testimoniale et juridique de ἐπὶ στόματος sans réduire ῥῆμα à une accusation. Une note conserve l’allusion à Deutéronome 19.15 et signale l’expression littérale sous-jacente.
  issues:
