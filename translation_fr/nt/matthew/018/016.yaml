    issue: Placement potentiellement ambigu de « encore »
    rationale: Dans « prends encore avec toi », « encore » peut modifier l’acte de prendre plutôt que les personnes ajoutées. Le grec ἔτι porte sur « une ou deux » personnes supplémentaires.
  - severity: low
    issue: « Sur la parole de deux ou trois témoins » est peu naturel en français moderne
    rationale: La formule est intelligible mais moins idiomatique que « sur la déclaration de deux ou trois témoins ». Cette dernière conserve la fonction juridique de l’expression grecque et de l’allusion deutéronomique.
  revised_text: Mais s’il ne t’écoute pas, prends avec toi une ou deux autres personnes, afin que toute affaire soit établie sur la déclaration de deux ou trois témoins[a].
