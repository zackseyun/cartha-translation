source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀκούσῃ, παράλαβε μετὰ σοῦ ἔτι ἕνα ἢ δύο, ἵνα ἐπὶ στόματος δύο μαρτύρων ἢ τριῶν σταθῇ πᾶν ῥῆμα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/016.yaml
  text: But if he does not listen[a], take one or two others with you[b], so that by the mouth of two or three witnesses every matter may be established.
translation:
  language: fr
  text: Mais s’il ne t’écoute pas, prends avec toi une ou deux autres personnes, afin que toute affaire soit établie sur la déclaration de deux ou trois témoins[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la bouche de deux ou trois témoins ». Allusion à Deutéronome 19.15.'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ἀκούσῃ
  choice: t’écoute
  rationale: Dans ce contexte, ἀκούω désigne une écoute qui accueille et prend en compte l’intervention, non la simple perception auditive. Le complément « t’ » est naturellement implicite dans la scène décrite au verset précédent.
- source_word: παράλαβε μετὰ σοῦ
  choice: prends avec toi
  rationale: Cette formulation rend à la fois l’impératif concret παράλαβε et l’accompagnement exprimé par μετὰ σοῦ.
- source_word: ἔτι ἕνα ἢ δύο
  choice: encore une ou deux personnes
  rationale: ἔτι marque l’ajout; « personnes » explicite sans ambiguïté le référent humain, sans leur attribuer d’avance un rôle plus précis que le grec.
- source_word: ἵνα
  choice: afin que
  rationale: La locution conserve clairement la valeur de but de ἵνα dans un registre digne et courant.
- source_word: ἐπὶ στόματος
  choice: sur la parole de
  rationale: Cette expression conserve l’image sémitique de la bouche sous une forme française naturelle et reconnaissable, tout en exprimant l’idée de témoignage autorisant l’établissement d’une affaire.
- source_word: μαρτύρων
  choice: témoins
  rationale: « Témoins » est le terme juridique français normal et correspond au sens de μαρτύρων dans l’allusion deutéronomique.
- source_word: σταθῇ
  choice: soit établie
  rationale: Dans cette formule juridique, le passif de ἵστημι signifie qu’une affaire est rendue ferme ou validée; « soit établie » garde cette force sans la réduire à une accusation.
- source_word: πᾶν ῥῆμα
  choice: toute affaire
  rationale: Dans l’écho à Deutéronome 19.15, ῥῆμα ne désigne pas seulement une parole isolée, mais la chose ou l’affaire à établir. « Toute affaire » restitue ce sens juridique tout en évitant le terme plus étroit « accusation ».
theological_decisions:
- issue: Allusion à la règle des témoins de Deutéronome 19.15 dans un contexte de discipline communautaire
  choice: 'Conserver une formulation juridique ainsi qu’une trace de l’idiome biblique: « sur la parole de deux ou trois témoins »'
  alternative: 'Traduire plus explicitement: « sur le témoignage de deux ou trois témoins »; ou plus littéralement: « sur la bouche de deux ou trois témoins »'
  rationale: Le texte applique à la démarche communautaire la règle deutéronomique selon laquelle une affaire doit être établie par plusieurs témoins. La formulation retenue préserve cet écho sans imposer une interprétation confessionnelle particulière ni laisser en français une expression obscure.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le mouvement conditionnel et final du grec. « Ne t’écoute pas » est plus naturel que « n’écoute pas » dans ce contexte, tandis que « toute affaire » maintient la portée juridique sans la limiter à une accusation formelle.
