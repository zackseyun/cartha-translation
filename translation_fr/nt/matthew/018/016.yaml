revisions:
- from: Mais s’il ne t’écoute pas, prends encore avec toi une ou deux personnes, afin que toute affaire soit établie sur la parole de deux ou trois témoins[a].
  to: Mais s’il ne t’écoute pas, prends avec toi une ou deux autres personnes, afin que toute affaire soit établie sur la déclaration de deux ou trois témoins[a].
  rationale: La révision clarifie que les personnes sont ajoutées à celles déjà en présence et remplace une expression française quelque peu calquée par une formulation juridique moderne. Elle ne restreint pas « toute affaire » à une accusation et conserve, en note, l’idiome littéral ainsi que l’allusion scripturaire.
