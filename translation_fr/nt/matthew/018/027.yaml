id: MAT.18.27
reference: Matthew 18:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ κύριος τοῦ δούλου ἐκείνου ἀπέλυσεν αὐτόν, καὶ τὸ δάνειον ἀφῆκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/027.yaml
  text: Then the master of that slave[a], moved with compassion[b], released him and forgave him the debt.
translation:
  language: fr
  text: Alors, pris de compassion, le maître de cet esclave[a] le laissa partir et lui remit sa dette[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le grec δοῦλος désigne ordinairement un esclave; « serviteur » est une traduction plus générale.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « le prêt » ou « ce qui avait été prêté ».
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: pris de compassion
  rationale: Le participe exprime une compassion profonde; cette tournure française naturelle en conserve la force affective.
- source_word: δὲ
  choice: Alors
  rationale: Ici, δέ fait progresser le récit; « Alors » rend naturellement l'enchaînement narratif.
- source_word: κύριος
  choice: maître
  rationale: Dans la scène, le mot désigne le maître humain de l'esclave. « Maître » est naturel en français et évite d'en faire directement un titre divin.
- source_word: δοῦλου
  choice: esclave
  rationale: Le statut de dépendance et le rapport d'autorité sont importants dans cette parabole; « esclave » les exprime plus précisément que « serviteur ».
- source_word: ἀπέλυσεν αὐτόν
  choice: le laissa partir
  rationale: ἀπολύω signifie ici que le maître le relâche et le laisse s'en aller; la formulation ne suppose pas nécessairement un affranchissement définitif.
- source_word: τὸ δάνειον
  choice: sa dette
  rationale: Le nom désigne proprement un prêt ou ce qui a été prêté, mais, avec ἀφίημι dans ce contexte, il s'agit de l'obligation financière remise. « Dette » est idiomatique, tandis qu'une note conserve la précision lexicale.
- source_word: ἀφῆκεν αὐτῷ
  choice: lui remit
  rationale: « Remettre une dette » exprime précisément son annulation et conserve le lien lexical et thématique avec le langage du pardon.
theological_decisions:
- issue: Risque de comprendre κύριος comme un titre divin direct
  choice: « maître », pour le personnage humain de la parabole
  alternative: « Seigneur »
  rationale: Le référent immédiat est le maître de l'esclave. La traduction ne transforme pas cette désignation narrative en titre divin, sans supprimer pour autant la portée théologique de la parabole.
- issue: Représentation concrète du statut de δοῦλος
  choice: « esclave »
  alternative: « serviteur »
  rationale: Le rapport asymétrique d'autorité et de dépendance est pertinent dans ce récit de dette; le terme plus concret doit donc être conservé.
- issue: Relation entre remise financière et pardon
  choice: « lui remit sa dette »
  alternative: « lui pardonna sa dette »
  rationale: « Remettre une dette » est le français idiomatique pour une annulation financière et maintient la résonance du verbe ἀφίημι sans produire une construction maladroite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit l'ordre naturel du français tout en conservant la compassion du maître, la libération immédiate de l'esclave et la remise de l'obligation financière.
