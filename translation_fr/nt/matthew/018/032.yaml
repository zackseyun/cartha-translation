id: MAT.18.32
reference: Matthew 18:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε προσκαλεσάμενος αὐτὸν ὁ κύριος αὐτοῦ λέγει αὐτῷ· Δοῦλε πονηρέ, πᾶσαν τὴν ὀφειλὴν ἐκείνην ἀφῆκά σοι, ἐπεὶ παρεκάλεσάς με·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/032.yaml
  text: Then his master summoned him and said to him[a], ‘Wicked slave[b], I forgave you all that debt because you pleaded with me.’
translation:
  language: fr
  text: 'Alors son maître le fit appeler et lui dit : « Mauvais esclave[a], je t’ai remis toute cette dette[b], parce que tu m’as supplié. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mauvais serviteur ». Le grec δοῦλος peut désigner un serviteur ou un esclave; « esclave » souligne ici la dépendance envers le maître qui structure la parabole.
    reason: lexical_alternative
  - marker: b
    text: Ou « j’ai annulé pour toi toute cette dette ». Le verbe grec peut désigner la remise d’une dette aussi bien que le pardon.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la progression temporelle et narrative de la parabole.
- source_word: προσκαλεσάμενος
  choice: le fit appeler
  rationale: Exprime l’appel à comparaître devant le maître et son autorité, dans un français narratif naturel.
- source_word: ὁ κύριος αὐτοῦ
  choice: son maître
  rationale: Dans cette parabole, κύριος désigne le maître de l’esclave, et non un titre divin explicite.
- source_word: λέγει αὐτῷ
  choice: lui dit
  rationale: Le présent historique grec est rendu au passé simple, conformément à l’usage narratif français.
- source_word: Δοῦλε πονηρέ
  choice: Mauvais esclave
  rationale: « Esclave » rend la dépendance juridique et sociale exprimée par δοῦλος; « mauvais » traduit ici la condamnation morale portée par πονηρός sans archaïsme.
- source_word: πᾶσαν τὴν ὀφειλὴν ἐκείνην
  choice: toute cette dette
  rationale: Rend directement la totalité de la dette désignée, dans un français clair et idiomatique.
- source_word: ἀφῆκά σοι
  choice: je t’ai remis
  rationale: « Remettre une dette » exprime son annulation tout en conservant le lien lexical et théologique entre remise de dette et pardon.
- source_word: ἐπεὶ
  choice: parce que
  rationale: Introduit clairement le motif de l’action du maître.
- source_word: παρεκάλεσάς με
  choice: tu m’as supplié
  rationale: Rend l’appel insistant exprimé par παρακαλέω sans ajouter l’objet implicite de la supplication.
theological_decisions:
- issue: Traduction de δοῦλος dans la relation parabolique entre maître et personne asservie
  choice: esclave
  alternative: serviteur
  rationale: La condition de dépendance et d’asservissement est importante dans la scène. « Esclave » la rend plus explicitement que « serviteur », sans atténuer la réalité sociale évoquée.
- issue: Traduction de ἀφίημι dans le contexte d’une dette
  choice: remis
  alternative: pardonné / annulé
  rationale: « Remettre une dette » est idiomatique en français et préserve la tension voulue entre l’image financière de l’annulation et le thème du pardon, alors que « annuler » serait uniquement commercial et « pardonner une dette » moins naturel.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la structure narrative concise du grec ainsi que le double écho, financier et théologique, de la remise de dette.
