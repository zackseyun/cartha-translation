id: MAT.18.18
reference: Matthew 18:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅσα ⸀ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ⸀ἐν οὐρανῷ καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ⸁ἐν οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/018.yaml
  text: Truly I tell you[a], whatever you bind on earth will have been bound in heaven, and whatever you loose on earth will have been loosed in heaven.
translation:
  language: fr
  text: 'Vraiment, je vous le dis : tout ce que vous lierez sur la terre aura été lié dans le ciel, et tout ce que vous délierez sur la terre aura été délié dans le ciel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la traduction traditionnelle : « sera lié dans le ciel… sera délié dans le ciel ». La construction grecque peut être comprise ainsi, mais elle associe un verbe au futur à un participe parfait et peut donc désigner un état déjà établi dans le ciel.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: Vraiment
  rationale: En tête d’une parole, ἀμήν introduit une affirmation solennelle et faisant autorité. « Vraiment » en transmet clairement la force en français moderne, sans employer « amen » comme formule peu habituelle dans le fil d’une phrase.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure française naturelle conserve l’adresse directe et la solennité de la formule grecque.
- source_word: ὅσα ἐὰν
  choice: tout ce que
  rationale: Le relatif accompagné de ἐάν exprime une portée générale et indéfinie. « Tout ce que » est idiomatique en français et ne restreint pas cette portée.
- source_word: δήσητε
  choice: vous lierez
  rationale: δέω signifie d’abord « lier ». Garder cette métaphore préserve son éventuelle portée juridique ou communautaire sans la réduire d’emblée à « interdire ».
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Cette expression rend naturellement le contraste spatial entre la terre et le ciel.
- source_word: ἔσται δεδεμένα
  choice: aura été lié
  rationale: Le futur de εἰμί accompagné d’un participe parfait passif peut se rendre par un futur antérieur passif, qui exprime un état résultant d’une action déjà accomplie.
- source_word: ἐν οὐρανῷ
  choice: dans le ciel
  rationale: Le singulier désigne ici le domaine céleste. « Dans le ciel » est clair et naturel en français.
- source_word: λύσητε
  choice: vous délierez
  rationale: λύω signifie « délier, détacher, libérer ». « Délier » maintient l’opposition métaphorique exacte avec « lier » et évite de limiter le sens à « permettre ».
- source_word: ἔσται λελυμένα
  choice: aura été délié
  rationale: Comme dans la proposition parallèle, le futur avec participe parfait passif est rendu par un futur antérieur passif afin de conserver l’idée d’un état déjà établi.
theological_decisions:
- issue: Valeur temporelle et théologique de la formule « lier et délier »
  choice: « aura été lié / aura été délié dans le ciel »
  alternative: « sera lié / sera délié dans le ciel »
  rationale: La construction grecque ἔσται suivie d’un participe parfait passif peut indiquer un état futur résultant d’une action antérieure. Le futur antérieur conserve donc la possibilité que l’action terrestre corresponde à une réalité déjà établie dans le ciel, sans imposer une doctrine particulière de l’autorité communautaire. La traduction traditionnelle au futur simple reste grammaticalement possible et figure en note.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La répétition symétrique de « tout ce que vous… sur la terre… dans le ciel » conserve la structure rhétorique du grec. Les verbes « lier » et « délier » préservent la métaphore et son amplitude interprétative.
