translation_notes:
  register: Français moderne, simple et digne. La coordination initiale καί est rendue par «Puis», qui marque naturellement la progression du récit. Aucun pronom genré n’est ajouté pour l’enfant, le grec employant ici un nom neutre et un pronom neutre.
