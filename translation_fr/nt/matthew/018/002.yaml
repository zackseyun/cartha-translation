  text: Puis il appela un enfant, le plaça au milieu d’eux
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: il appela
  rationale: Le participe aoriste moyen signifie qu’il fit venir l’enfant auprès de lui; «appela» l’exprime naturellement en français sans surcharger la formulation.
- source_word: παιδίον
  choice: un enfant
  rationale: Terme courant désignant ici un jeune enfant, sans précision supplémentaire de sexe ou d’âge.
- source_word: ἔστησεν
  choice: le plaça
  rationale: Le verbe causatif signifie ici «faire tenir debout» ou «placer». «Le plaça» rend idiomatiquement l’action sans affirmer au-delà du texte la posture exacte de l’enfant.
- source_word: ἐν μέσῳ αὐτῶν
  choice: au milieu d’eux
  rationale: Reproduction directe et naturelle de l’expression spatiale grecque.
