id: MAT.18.34
reference: Matthew 18:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὀργισθεὶς ὁ κύριος αὐτοῦ παρέδωκεν αὐτὸν τοῖς βασανισταῖς ἕως οὗ ἀποδῷ πᾶν τὸ ⸀ὀφειλόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/034.yaml
  text: And in anger his master handed him over to the torturers until he should pay all that was owed[a][b].
translation:
  language: fr
  text: Dans sa colère, son maître[a] le livra aux tortionnaires[b] jusqu’à ce qu’il ait payé tout ce qu’il devait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « seigneur ». Le mot grec est kyrios ; ici, dans la parabole, il désigne le maître du serviteur.
    reason: alternative_reading
  - marker: b
    text: Ou « bourreaux » ; plus faiblement, « geôliers ». Le terme grec désigne ceux qui infligent des tortures ou des tourments, et non de simples gardiens.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: Dans sa colère
  rationale: Le participe aoriste, employé de manière circonstancielle, exprime l’état émotif qui accompagne et motive l’action. Cette tournure est naturelle en français et en conserve la force.
- source_word: κύριος
  choice: maître
  rationale: Dans le cadre narratif de la parabole, le mot désigne le maître humain du serviteur. « Maître » rend clairement cette relation sans transformer ici le terme en titre divin.
- source_word: παρέδωκεν
  choice: le livra
  rationale: Le verbe exprime la remise d’une personne au pouvoir d’autres personnes, ici dans un contexte punitif. « Livra » est concis et garde cette valeur judiciaire.
- source_word: βασανισταῖς
  choice: aux tortionnaires
  rationale: Le nom désigne ceux qui infligent la torture ou des tourments, et non de simples gardiens. « Tortionnaires » en préserve la sévérité sans ajouter d’explication au corps du texte.
- source_word: ἕως οὗ
  choice: jusqu’à ce que
  rationale: Cette locution rend directement la limite temporelle introduite par l’expression grecque.
- source_word: ἀποδῷ
  choice: il ait payé
  rationale: Le subjonctif aoriste après ἕως οὗ présente le paiement comme le terme attendu de la détention. Le subjonctif passé français convient naturellement après « jusqu’à ce que ».
- source_word: πᾶν τὸ ὀφειλόμενον
  choice: tout ce qu’il devait
  rationale: Cette formulation rend l’ensemble de la somme due sans introduire dans le texte le nom explicite « dette », absent de cette expression grecque.
theological_decisions:
- issue: Valeur de κύριος dans la parabole
  choice: maître
  alternative: Seigneur
  rationale: Le référent immédiat est le supérieur humain du serviteur dans le récit. « Maître » respecte ce cadre tout en laissant intacte la portée théologique de la parabole, sans imposer un titre christologique dans le texte principal.
- issue: Sévérité de βασανισταῖς dans un contexte de jugement
  choice: tortionnaires
  alternative: bourreaux ou geôliers
  rationale: « Tortionnaires » conserve la force lexicale du grec et l’intensité de l’avertissement. « Geôliers » atténuerait le terme en ne désignant que la fonction de garde, tandis que « bourreaux » pourrait évoquer plus spécialement l’exécution capitale.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple convient au registre narratif biblique sans être archaïque. La phrase conserve la rigueur du châtiment et ne précise pas au-delà du grec la nature ou la durée eschatologique de celui-ci.
