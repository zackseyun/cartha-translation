id: MAT.18.15
reference: Matthew 18:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐὰν δὲ ἁμαρτήσῃ ⸂εἰς σὲ⸃ ὁ ἀδελφός σου, ⸀ὕπαγε ἔλεγξον αὐτὸν μεταξὺ σοῦ καὶ αὐτοῦ μόνου. ἐάν σου ἀκούσῃ, ἐκέρδησας τὸν ἀδελφόν σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/015.yaml
  text: But if your brother sins against you[a], go and reprove him between you and him alone. If he listens to you[c][b], you have gained your brother.
translation:
  language: fr
  text: Mais si ton frère[b] pèche contre toi[a], va lui montrer sa faute[c], seul à seul. S’il t’écoute, tu as gagné ton frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits omettent « contre toi » et portent ainsi : « Mais si ton frère pèche, va lui montrer sa faute, seul à seul. »'
    reason: textual_variant
  - marker: b
    text: Le mot grec traduit par « frère » est au masculin singulier ; dans ce contexte, il peut désigner plus largement un autre disciple.
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « va le reprendre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτήσῃ
  choice: pèche
  rationale: Le verbe « pécher » conserve la portée morale et religieuse de ἁμαρτάνω. Après ἐὰν, le subjonctif aoriste exprime ici une éventualité générale, rendue naturellement en français par le présent.
- source_word: εἰς σέ
  choice: contre toi
  rationale: Cette tournure idiomatique rend le sens de l’offense dirigée contre l’interlocuteur. Elle figure dans le texte du SBLGNT, mais sa présence est signalée comme variante textuelle.
- source_word: ὁ ἀδελφός σου
  choice: ton frère
  rationale: Ce choix suit la forme masculine singulière du grec et préserve son expression concrète, sans remplacer celle-ci par une généralisation interprétative.
- source_word: ὕπαγε ἔλεγξον αὐτόν
  choice: va lui montrer sa faute
  rationale: ἐλέγχω signifie ici mettre la faute en lumière et amener l’autre à la reconnaître. Cette formulation est claire en français moderne et évite la dureté possible de « réprimander ».
- source_word: μεταξὺ σοῦ καὶ αὐτοῦ μόνου
  choice: seul à seul
  rationale: Cette expression française naturelle transmet avec concision l’exclusivité et le caractère privé de l’entretien.
- source_word: ἐάν σου ἀκούσῃ
  choice: s’il t’écoute
  rationale: « Écouter » conserve la possibilité d’une écoute réceptive sans préciser excessivement qu’il s’agit d’obéir.
- source_word: ἐκέρδησας
  choice: tu as gagné
  rationale: Le verbe « gagner » préserve la métaphore de κερδαίνω sans ajouter l’idée non explicite de « regagner ».
theological_decisions:
- issue: Portée de ἀδελφός dans le contexte des disciples
  choice: ton frère
  alternative: un frère ou une sœur ; un autre croyant
  rationale: Le texte principal conserve le masculin singulier du grec. Une note indique la possible portée contextuelle plus large sans l’imposer dans la traduction.
- issue: Statut textuel de εἰς σέ
  choice: inclure « contre toi » dans le texte principal
  alternative: 'omettre ces mots : « si ton frère pèche »'
  rationale: Le SBLGNT fourni retient εἰς σέ. Comme l’omission attestée modifie sensiblement la portée de l’instruction, elle est signalée en note.
- issue: Force de ἐλέγχω dans la démarche fraternelle
  choice: lui montrer sa faute
  alternative: le reprendre
  rationale: Le choix principal souligne la mise en lumière de la faute sans réduire le verbe à une simple réprimande. L’alternative plus formelle est conservée en note.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au singulier grec. « Seul à seul » privilégie une expression française courante tout en conservant l’accent du texte sur la confidentialité de la démarche.
