id: MAT.18.1
reference: Matthew 18:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῃ τῇ ὥρᾳ προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ λέγοντες· Τίς ἄρα μείζων ἐστὶν ἐν τῇ βασιλείᾳ τῶν οὐρανῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/001.yaml
  text: At that time the disciples came to Jesus, saying, “Who then is greater in the kingdom of heaven?”
translation:
  language: fr
  text: 'À ce moment-là, les disciples s’approchèrent de Jésus et lui demandèrent : « Qui donc est le plus grand dans le royaume des cieux ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: À ce moment-là
  rationale: Expression temporelle naturelle en français, qui conserve la référence au moment du récit sans suggérer nécessairement une heure précise.
- source_word: προσῆλθον
  choice: s’approchèrent
  rationale: Rend directement le mouvement exprimé par le verbe grec et convient au registre narratif.
- source_word: λέγοντες
  choice: et lui demandèrent
  rationale: Le participe « disant » introduit ici une question; cette formulation est idiomatique en français et explicite la fonction discursive sans changer le sens.
- source_word: Τίς ἄρα
  choice: Qui donc
  rationale: « donc » restitue la nuance inférentielle ou consécutive de ἄρα, tout en préservant la forme interrogative.
- source_word: μείζων
  choice: le plus grand
  rationale: Bien que la forme grecque soit morphologiquement comparative, elle a ici une valeur superlative dans une question portant sur l’identité de la personne qui occupe le rang supérieur au sein du royaume.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: dans le royaume des cieux
  rationale: Formulation consacrée et fidèle à l’expression matthéenne, sans remplacer « des cieux » par une interprétation.
theological_decisions:
- issue: Valeur comparative ou superlative de μείζων
  choice: le plus grand
  alternative: plus grand
  rationale: Dans « Qui est… ? », le comparatif grec peut fonctionner comme un superlatif de rang. Le français exige ici normalement l’article défini pour exprimer clairement cette portée; « qui est plus grand » appellerait plus naturellement un terme explicite de comparaison.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluide pour un lectorat ordinaire, tout en conservant la terminologie propre à Matthieu (« royaume des cieux »).
