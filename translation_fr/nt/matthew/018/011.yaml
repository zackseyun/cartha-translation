source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἦλθεν γὰρ ὁ υἱὸς τοῦ ἀνθρώπου σῶσαι τὸ ἀπολωλός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/011.yaml
  text: For the Son[a] of Man came to save the lost.
translation:
  language: fr
  text: Car le Fils de l’homme est venu sauver ce qui était perdu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent des plus anciens manuscrits grecs, notamment le Sinaïticus et le Vaticanus du IVe siècle, ainsi que d’anciennes traductions coptes. Il figure toutefois dans le Codex de Bèze du Ve siècle, dans la tradition byzantine majoritaire et dans la Vulgate latine. Il a probablement été ajouté par des copistes ultérieurs pour harmoniser ce passage avec Luc 19.10.
    reason: textual_critical
lexical_decisions:
- source_word: σῴζω
  choice: sauver
  rationale: Rend directement l’infinitif aoriste σῶσαι et conserve sa portée sotériologique naturelle dans ce contexte.
- source_word: τὸ ἀπολωλός
  choice: ce qui était perdu
  rationale: Le participe parfait substantivé est au neutre singulier. Cette formulation respecte mieux sa forme grammaticale que le collectif personnel « les perdus » et exprime l’état résultant de perte.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Expression française consacrée qui préserve le titre christologique grec sans l’expliciter davantage.
theological_decisions:
- issue: Référent de τὸ ἀπολωλός
  choice: ce qui était perdu
  alternative: les perdus
  rationale: Le grec reste grammaticalement neutre et singulier; la traduction choisie n’impose pas un référent exclusivement individuel ou collectif et maintient la tension du contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La construction « Car… est venu sauver » suit de près le grec tout en restant fluide; la note rend transparente l’importante variante textuelle.
