id: MAT.18.17
reference: Matthew 18:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ παρακούσῃ αὐτῶν, εἰπὸν τῇ ἐκκλησίᾳ· ἐὰν δὲ καὶ τῆς ἐκκλησίας παρακούσῃ, ἔστω σοι ὥσπερ ὁ ἐθνικὸς καὶ ὁ τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/017.yaml
  text: But if he refuses to listen to them[a], tell it to the assembly. And if he also refuses to listen to the assembly, let him be to you like the Gentile and the tax collector.
translation:
  language: fr
  text: Mais s’il refuse de les écouter, dis-le à l’assemblée[a]. Et s’il refuse aussi d’écouter l’assemblée, qu’il soit pour toi comme le non-Juif et le collecteur d’impôts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « à l’Église » ou « à la communauté » (grec : ekklēsia).'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσῃ
  choice: refuse d’écouter
  rationale: Dans ce contexte de correction communautaire, le verbe exprime non une simple défaillance auditive, mais le refus de tenir compte de ce qui est dit.
- source_word: εἰπὸν
  choice: dis-le
  rationale: L’impératif introduit l’étape suivante, qui consiste à porter l’affaire à la connaissance de la communauté; le pronom neutre reprend naturellement la situation évoquée.
- source_word: ἐκκλησίᾳ / ἐκκλησίας
  choice: assemblée
  rationale: « Assemblée » rend le sens de communauté réunie sans imposer les connotations institutionnelles ultérieures que peut porter « Église ».
- source_word: ἔστω σοι
  choice: qu’il soit pour toi
  rationale: Cette formulation conserve la force impérative ainsi que le datif σοι, sans expliciter davantage la conduite concrète attendue.
- source_word: ὥσπερ
  choice: comme
  rationale: Comparatif simple et naturel qui préserve la formulation analogique du grec.
- source_word: ὁ ἐθνικὸς
  choice: le non-Juif
  rationale: Dans ce contexte juif, ἐθνικός désigne une personne appartenant aux nations, extérieure à la communauté d’alliance. « Non-Juif » est clair et actuel, sans la nuance religieuse supplémentaire de « païen ».
- source_word: ὁ τελώνης
  choice: le collecteur d’impôts
  rationale: Cette expression rend directement la fonction désignée et conserve l’article grec qui présente une catégorie représentative.
theological_decisions:
- issue: Rendu de ἐκκλησία dans cette instruction communautaire de Matthieu
  choice: assemblée
  alternative: Église; communauté
  rationale: « Assemblée » garde le sens premier de la communauté réunie et évite d’introduire dans le texte une structure ecclésiastique particulière. La traduction traditionnelle « Église » demeure signalée en note.
- issue: Portée du statut attribué à la personne qui persiste à ne pas écouter
  choice: qu’il soit pour toi comme le non-Juif et le collecteur d’impôts
  alternative: traite-le comme un non-Juif et un collecteur d’impôts; considère-le comme un exclu
  rationale: La traduction maintient la comparaison du texte et n’en fait pas une procédure institutionnelle plus détaillée que l’énoncé grec.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « refuse d’écouter » reproduit la progression du grec. « Le non-Juif » et « le collecteur d’impôts » conservent les catégories représentatives marquées par l’article, tandis que la formulation « qu’il soit pour toi » préserve l’ambiguïté sur les modalités concrètes de la relation.
