id: MAT.18.35
reference: Matthew 18:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ πατήρ μου ὁ ⸀οὐράνιος ποιήσει ὑμῖν ἐὰν μὴ ἀφῆτε ἕκαστος τῷ ἀδελφῷ αὐτοῦ ἀπὸ τῶν καρδιῶν ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/035.yaml
  text: So also my heavenly Father will do to you[b][a], if each of you does not forgive his brother from your hearts.
translation:
  language: fr
  text: C’est ainsi que mon Père céleste vous traitera, si chacun de vous ne pardonne pas de tout son cœur à son frère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « frère » désigne de manière représentative un autre disciple ou croyant.
    reason: cultural_note
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: C’est ainsi que…
  rationale: Introduit naturellement en français l’application de la parabole précédente et conserve la valeur comparative et consécutive de l’expression grecque.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: mon Père céleste
  rationale: Rend directement la possession et l’adjectif οὐράνιος dans une formulation française courante et digne.
- source_word: ποιήσει ὑμῖν
  choice: vous traitera
  rationale: Renvoie à ce que le maître a fait dans la parabole. Cette tournure est idiomatique en français; elle évite le calque peu naturel « fera à vous » sans préciser davantage la nature du jugement.
- source_word: ἐὰν μὴ
  choice: si… ne… pas
  rationale: Conserve explicitement la forme conditionnelle négative du grec; « à moins que » serait également possible mais moins direct ici.
- source_word: ἀφῆτε
  choice: pardonne
  rationale: Dans le contexte d’une offense représentée comme une dette, ἀφίημι désigne clairement l’acte de pardonner.
- source_word: ἕκαστος
  choice: chacun de vous
  rationale: Exprime naturellement la portée distributive du singulier grec au sein de l’auditoire pluriel.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: à son frère
  rationale: Préserve le masculin singulier du texte grec. Dans ce contexte, « frère » peut représenter tout autre disciple ou croyant, ce qu’explicite la note.
- source_word: ἀπὸ τῶν καρδιῶν ὑμῶν
  choice: de tout son cœur
  rationale: Rend en français idiomatique l’exigence d’un pardon intérieur et sincère. Le passage du pluriel grec au singulier distributif français s’accorde avec « chacun de vous » sans ajouter l’idée d’une intensité émotionnelle.
theological_decisions:
- issue: Portée et force de l’avertissement
  choice: Un avertissement direct selon lequel le Père traitera de façon correspondante ceux qui ne pardonnent pas sincèrement.
  alternative: Préciser qu’il s’agit soit de la condamnation éternelle, soit seulement d’une perte de récompense.
  rationale: Le verset établit une correspondance solennelle avec le jugement de la parabole, mais n’en définit pas ici la catégorie systématique. La traduction en conserve la gravité sans résoudre cette tension.
- issue: Portée du masculin ἀδελφῷ
  choice: « à son frère », avec une note sur son emploi représentatif
  alternative: « à son frère ou à sa sœur » ou « à un autre croyant »
  rationale: Le texte principal conserve la forme masculine singulière de la source, tandis que la note indique sa portée contextuelle sans substituer une interprétation au lexème.
translation_notes:
  register: Français international moderne, clair et digne. « C’est ainsi que… vous traitera » fait naturellement le lien avec la parabole tout en maintenant l’avertissement. « De tout son cœur » est l’équivalent idiomatique français du pluriel grec « depuis vos cœurs » dans la construction distributive avec « chacun ».
