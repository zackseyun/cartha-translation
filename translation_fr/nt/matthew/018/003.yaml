id: MAT.18.3
reference: Matthew 18:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀμὴν λέγω ὑμῖν, ἐὰν μὴ στραφῆτε καὶ γένησθε ὡς τὰ παιδία, οὐ μὴ εἰσέλθητε εἰς τὴν βασιλείαν τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/018/003.yaml
  text: And he said[a], “Truly I say to you, unless you turn and become like children[c][b], you will certainly not enter the kingdom of heaven.”
translation:
  language: fr
  text: 'Et il dit : « Amen, je vous le dis, si vous ne vous retournez pas[a] et ne devenez pas comme les enfants, vous n’entrerez certainement pas dans le royaume des cieux[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « si vous ne changez pas » ou « si vous n’êtes pas retournés ». La forme grecque peut être comprise dans un sens intransitif ou passif.'
    reason: alternative_reading
  - marker: b
    text: 'On peut aussi traduire : « vous n’entrerez jamais ». Le grec emploie une négation renforcée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: Amen
  rationale: Dans cette formule solennelle propre aux paroles de Jésus, « Amen » conserve le terme source et reste bien connu en français biblique ; la suite « je vous le dis » en éclaire naturellement la fonction.
- source_word: στραφῆτε
  choice: changez d’orientation
  rationale: L’aoriste passif subjonctif peut avoir ici une valeur intransitive ou passive. Cette formulation naturelle exprime un retournement décisif sans imposer le terme théologique technique « vous convertir » ni préciser l’agent.
- source_word: γένησθε
  choice: devenez
  rationale: Le verbe γίνομαι indique ici un changement d’état ; « devenir » rend directement ce sens et maintient la coordination avec στραφῆτε.
- source_word: ὡς τὰ παιδία
  choice: comme les enfants
  rationale: Cette expression respecte l’article grec et peut évoquer l’enfant placé au milieu des disciples, tout en désignant les enfants comme catégorie. Elle ne précise pas quelle qualité enfantine est visée.
- source_word: οὐ μὴ εἰσέλθητε
  choice: vous n’entrerez certainement pas
  rationale: La double négation οὐ μή avec le subjonctif est fortement emphatique ; « certainement pas » en restitue clairement la force en français moderne.
- source_word: βασιλείαν τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Formulation française consacrée et naturelle pour l’expression caractéristique de Matthieu, tout en reflétant le pluriel grec τῶν οὐρανῶν.
theological_decisions:
- issue: Portée du retournement exprimé par στραφῆτε
  choice: changer d’orientation
  alternative: vous convertir ; être retournés
  rationale: Le grec appelle à un retournement décisif, mais sa forme permet de laisser ouverte la question de l’agent. La traduction évite d’introduire un sens doctrinal technique absent du seul terme.
- issue: Qualités associées aux enfants
  choice: conserver la comparaison générale « comme les enfants »
  alternative: comme les enfants dans leur innocence ; avec l’humilité d’un enfant
  rationale: Le verset ne nomme pas ici la qualité précise qui doit être imitée. La traduction préserve cette ouverture au lieu d’ajouter une interprétation théologique ou psychologique.
translation_notes:
  register: Français international moderne, digne et accessible. « Amen, je vous le dis » conserve la solennité de la formule de Jésus sans archaïsme. « Changez d’orientation » est plus explicite que « tournez-vous » et moins chargé doctrinalement que « convertissez-vous ». Les marqueurs [a] et [b] figurent dans le texte au point pertinent.
