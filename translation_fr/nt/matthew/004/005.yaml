id: MAT.4.5
reference: Matthew 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε παραλαμβάνει αὐτὸν ὁ διάβολος εἰς τὴν ἁγίαν πόλιν, καὶ ⸀ἔστησεν αὐτὸν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/005.yaml
  text: Then the devil takes him into the holy city and sets him on the pinnacle of the temple[b][a],
translation:
  language: fr
  text: Alors le diable l’emmène dans la ville sainte[a] et le place au sommet du Temple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire Jérusalem.
    reason: cross_reference
  - marker: b
    text: Ou «sur l’aile du Temple»; le grec peut désigner une extrémité saillante ou un point élevé de l’ensemble du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la progression du récit.
- source_word: παραλαμβάνει
  choice: l’emmène
  rationale: Le présent de narration est conservé; «emmène» exprime ici le fait de prendre quelqu’un avec soi vers un lieu.
- source_word: ὁ διάβολος
  choice: le diable
  rationale: Désignation personnelle consacrée et exacte dans ce contexte.
- source_word: εἰς τὴν ἁγίαν πόλιν
  choice: dans la ville sainte
  rationale: Préserve la désignation grecque et le mouvement vers le lieu sans remplacer l’expression par «Jérusalem».
- source_word: ἔστησεν
  choice: le place
  rationale: 'Rend la valeur transitive et causative de ἵστημι: le diable fait tenir Jésus à cet endroit.'
- source_word: ἐπὶ τὸ πτερύγιον
  choice: au sommet
  rationale: Expression française naturelle pour le point élevé ou l’extrémité saillante visée, tout en signalant l’incertitude architecturale en note.
- source_word: τοῦ ἱεροῦ
  choice: du Temple
  rationale: ἱερόν désigne ici l’ensemble du complexe du Temple plutôt que le seul sanctuaire intérieur; la majuscule identifie naturellement le Temple de Jérusalem.
theological_decisions:
- issue: Identification de «la ville sainte»
  choice: Conserver «la ville sainte» dans le texte principal.
  alternative: Jérusalem
  rationale: Le grec emploie cette désignation honorifique plutôt que le nom propre; une note permet l’identification sans effacer la formulation source.
- issue: Sens architectural de πτερύγιον τοῦ ἱεροῦ
  choice: «au sommet du Temple»
  alternative: «sur l’aile du Temple» ou «sur une extrémité saillante du complexe du Temple»
  rationale: Le référent architectural exact est incertain. «Sommet» fournit un français clair sans imposer une structure précise, tandis que la note conserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. Le présent historique grec est conservé par «emmène» et «place». Les marqueurs de note suivent immédiatement les expressions concernées.
