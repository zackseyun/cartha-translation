  text: Ἀκούσας ⸀δὲ ὅτι Ἰωάννης παρεδόθη ἀνεχώρησεν εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/012.yaml
  text: When he heard that John had been handed over[a], he withdrew into Galilee.
translation:
  language: fr
  text: Quand il apprit que Jean avait été livré[a], il se retira en Galilée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus précisément dans ce contexte : « avait été arrêté ».'
    reason: Alternative lexicale contextuelle pour παρεδόθη.
lexical_decisions:
- source_word: Ἀκούσας
  choice: Quand il apprit
  rationale: Le participe aoriste a ici une valeur temporelle par rapport au verbe principal. Cette formulation est naturelle en français et le sujet implicite, Jésus, ressort du contexte.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ marque ici une transition narrative légère plutôt qu’une opposition nette. En français, l’enchaînement est naturel sans ajouter artificiellement « alors » ou « or ».
- source_word: Ἰωάννης
  choice: Jean
  rationale: Forme française traditionnelle et courante du nom Ἰωάννης.
- source_word: παρεδόθη
  choice: avait été livré
  rationale: Le passif de παραδίδωμι a un sens plus large que le seul fait d’être arrêté. « Avait été livré » préserve cette ampleur lexicale, tandis que le plus-que-parfait indique clairement l’antériorité.
- source_word: ἀνεχώρησεν
  choice: il se retira
  rationale: ἀναχωρέω désigne ici le fait de s’éloigner ou de se retirer en réaction aux circonstances, sans nécessairement suggérer une fuite.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: en Galilée
  rationale: En français, « se retirer en Galilée » exprime naturellement le déplacement vers cette région; une traduction littérale par « dans la Galilée » serait moins idiomatique.
theological_decisions:
- issue: Sens de παραδίδωμι à propos de Jean
  choice: avait été livré
  alternative: avait été arrêté
  rationale: Le verbe grec ne constitue pas ici un terme technique limité à l’arrestation et peut conserver dans Matthieu la résonance plus large d’une remise aux mains d’autrui. Le texte principal préserve cette latitude; la note donne le sens contextuel plus précis.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste fluide tout en conservant la relation temporelle et l’ambiguïté lexicale du grec.
