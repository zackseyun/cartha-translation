id: MAT.4.3
reference: Matthew 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσελθὼν ⸂ὁ πειράζων εἶπεν αὐτῷ⸃· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ ἵνα οἱ λίθοι οὗτοι ἄρτοι γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/003.yaml
  text: And the tempter came and said to him[a], “If you are the Son of God[b], tell these stones to become bread.”
translation:
  language: fr
  text: 'Le tentateur s’approcha et lui dit : « Si tu es le Fils de Dieu[a], dis que ces pierres deviennent des pains[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le « si » grec peut introduire un défi sans nécessairement exprimer un doute ; on pourrait comprendre : « Puisque tu es le Fils de Dieu. »'
    reason: alternative_reading
  - marker: b
    text: 'Le grec emploie le pluriel : « des pains » ou « des miches de pain ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: s’approcha
  rationale: Le participe aoriste de προσέρχομαι indique un mouvement vers Jésus préalable à la parole ; « s’approcha » le rend clairement et naturellement.
- source_word: ὁ πειράζων
  choice: le tentateur
  rationale: Le participe présent substantivé désigne celui qui met Jésus à l’épreuve dans une intention tentatrice ; « le tentateur » est naturel et contextuellement juste.
- source_word: εἶπεν αὐτῷ
  choice: lui dit
  rationale: Rend directement la construction de λέγω avec son complément indirect.
- source_word: Εἰ
  choice: Si
  rationale: Préserve la forme conditionnelle grecque et son ambiguïté rhétorique, sans décider s’il s’agit d’un doute, d’un défi ou d’une supposition tenue pour vraie.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Dans cette construction attributive et dans le contexte de Matthieu, l’expression fonctionne comme un titre défini désignant Jésus.
- source_word: εἰπὲ ἵνα
  choice: ordonne que
  rationale: Dans ce contexte, dire que les pierres deviennent des pains constitue une parole d’autorité. « Ordonne que » rend naturellement cette force en français, sans développer le moyen du miracle.
- source_word: οἱ λίθοι οὗτοι
  choice: ces pierres
  rationale: Rend précisément le nom et le démonstratif grecs.
- source_word: ἄρτοι
  choice: des pains
  rationale: Conserve le pluriel concret du grec ἄρτοι, lequel désigne ici des pains ou des miches plutôt que la matière indénombrable « du pain ».
- source_word: γένωνται
  choice: deviennent
  rationale: Rend directement et sobrement le sens de γίνομαι, sans ajouter l’image plus familière d’une transformation exprimée par « se changent en ».
theological_decisions:
- issue: Valeur de la proposition conditionnelle Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: « Si tu es le Fils de Dieu »
  alternative: « Puisque tu es le Fils de Dieu » ou « Si vraiment tu es le Fils de Dieu »
  rationale: 'Le simple « si » conserve la tension du grec : la condition peut servir de défi sans nécessairement exprimer un doute réel. La traduction ne tranche pas l’intention du tentateur.'
- issue: Titre christologique υἱὸς τοῦ θεοῦ
  choice: « le Fils de Dieu »
  alternative: « un fils de Dieu »
  rationale: L’absence d’article devant l’attribut en grec n’impose pas un sens indéfini. Le contexte matthéen présente l’expression comme le titre qui identifie Jésus de manière unique.
translation_notes:
  register: Français moderne, international et digne. Le tutoiement correspond au singulier grec et convient au dialogue direct. La formulation reste concise tout en conservant la condition rhétorique et le pluriel concret de ἄρτοι.
