  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ προβὰς ἐκεῖθεν εἶδεν ἄλλους δύο ἀδελφούς, Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, ἐν τῷ πλοίῳ μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν καταρτίζοντας τὰ δίκτυα αὐτῶν, καὶ ἐκάλεσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/021.yaml
  text: And going on from there, he saw two other brothers, James the son of Zebedee and John his brother, in the boat with Zebedee their father, mending their nets, and he called them.
translation:
  language: fr
  text: En allant plus loin, il vit deux autres frères, Jacques, fils de Zébédée, et Jean, son frère, dans la barque avec Zébédée, leur père, en train de réparer leurs filets. Il les appela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προβὰς ἐκεῖθεν
  choice: En allant plus loin
  rationale: Le participe aoriste indique que Jésus poursuit son déplacement depuis le lieu précédent. Cette formulation naturelle conserve l’idée de progression sans alourdir le récit.
- source_word: εἶδεν
  choice: il vit
  rationale: Le verbe exprime ici simplement la perception visuelle dans la narration, sans qu’il soit nécessaire de l’intensifier en « remarqua ».
- source_word: ἄλλους δύο ἀδελφούς
  choice: deux autres frères
  rationale: ἄλλους présente cette paire comme venant s’ajouter aux deux frères mentionnés juste avant.
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: Jacques, fils de Zébédée
  rationale: La tournure génitive grecque identifie Jacques par sa filiation. « Jacques » et « Zébédée » sont les formes françaises traditionnelles et courantes de ces noms.
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: Jean, son frère
  rationale: La formulation identifie Jean comme le frère de Jacques et demeure concise en français.
- source_word: ἐν τῷ πλοίῳ
  choice: dans la barque
  rationale: Dans ce contexte de pêche, πλοῖον désigne une embarcation plutôt qu’un grand navire ; « barque » convient au cadre et à l’usage biblique français courant.
- source_word: μετὰ Ζεβεδαίου τοῦ πατρὸς αὐτῶν
  choice: avec leur père Zébédée
  rationale: μετά avec le génitif exprime l’accompagnement. L’ordre choisi est plus idiomatique en français tout en conservant l’identification du père.
- source_word: καταρτίζοντας τὰ δίκτυα αὐτῶν
  choice: réparaient leurs filets
  rationale: Dans le contexte de la pêche, καταρτίζω signifie remettre les filets en état. « Réparaient » est clair et naturel, sans exclure l’idée plus large de leur préparation.
- source_word: ἐκάλεσεν αὐτούς
  choice: il les appela
  rationale: Cette traduction conserve le sens simple de καλέω et son lien avec le thème évangélique de l’appel, sans expliciter ce que le contexte permet de comprendre.
theological_decisions:
- issue: Portée de l’appel exprimé par ἐκάλεσεν
  choice: Conserver « il les appela » sans complément.
  alternative: « il les appela à le suivre »
  rationale: Le contexte indique qu’il s’agit d’un appel à devenir disciples, mais le verset dit seulement qu’il les appela. La traduction laisse donc le contexte porter cette implication.
translation_notes:
  register: Français international moderne, narratif et digne. La longue phrase grecque est répartie en trois phrases pour assurer une lecture naturelle et lever sans ajout l’enchâssement syntaxique autour des deux frères. « Alors » rend explicitement l’enchaînement narratif porté par le dernier καί, sans lui attribuer une valeur théologique supplémentaire.
