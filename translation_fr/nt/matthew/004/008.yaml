id: MAT.4.8
reference: Matthew 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πάλιν παραλαμβάνει αὐτὸν ὁ διάβολος εἰς ὄρος ὑψηλὸν λίαν, καὶ δείκνυσιν αὐτῷ πάσας τὰς βασιλείας τοῦ κόσμου καὶ τὴν δόξαν αὐτῶν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/008.yaml
  text: Again[a], the devil takes him to a very high mountain and shows him all the kingdoms of the world and their glory.
translation:
  language: fr
  text: De nouveau, le diable l’emmène sur une très haute montagne et lui montre tous les royaumes du monde et leur gloire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur splendeur ».
    reason: Alternative lexicale contextuelle pour δόξα, qui peut désigner ici la magnificence ou l’éclat des royaumes.
lexical_decisions:
- source_word: Πάλιν
  choice: De nouveau
  rationale: Marque clairement la répétition dans la série des tentations, dans un français naturel et digne.
- source_word: παραλαμβάνει
  choice: l’emmène
  rationale: Rend naturellement l’idée de prendre quelqu’un avec soi pour le conduire ailleurs. Le présent historique du grec est conservé.
- source_word: ὁ διάβολος
  choice: le diable
  rationale: Titre reconnu dans ce contexte et équivalent français standard, sans développer ici le sens étymologique de « calomniateur ».
- source_word: εἰς ὄρος ὑψηλὸν λίαν
  choice: sur une très haute montagne
  rationale: « Sur » exprime idiomatiquement en français le mouvement vers le sommet; « très » conserve l’intensification portée par λίαν.
- source_word: δείκνυσιν
  choice: lui montre
  rationale: Rendu direct du verbe grec, sans ajouter l’idée d’une vision ni préciser le moyen employé.
- source_word: πάσας τὰς βασιλείας
  choice: tous les royaumes
  rationale: Conserve l’universalité de πᾶς et le sens politique et royal de βασιλεία.
- source_word: τοῦ κόσμου
  choice: du monde
  rationale: Expression française naturelle qui correspond à la portée générale de κόσμος dans ce contexte.
- source_word: τὴν δόξαν αὐτῶν
  choice: leur gloire
  rationale: Préserve le terme théologiquement et lexicalement riche δόξα, tout en laissant la note signaler le sens contextuel de splendeur visible.
theological_decisions:
- issue: Nature de la scène sur la montagne dans le récit de la tentation
  choice: Présenter simplement la scène telle qu’elle est racontée, sans préciser comment tous les royaumes sont montrés.
  alternative: Décrire soit un panorama géographique littéral, soit une révélation visionnaire ou surnaturelle.
  rationale: Le grec ne précise ni le mécanisme ni la nature de cette présentation. La traduction conserve donc l’ambiguïté du récit au lieu d’imposer une explication.
translation_notes:
  register: Français international moderne, clair et digne. Le présent historique conserve la vivacité narrative du grec. Le marqueur de note est placé après « gloire », le mot auquel l’alternative se rapporte.
