  text: ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/014.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled, saying:'
translation:
  language: fr
  text: 'afin que s’accomplisse ce qui avait été dit par l’intermédiaire du prophète Ésaïe :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit ici le but ou le résultat. « Afin que » conserve la force téléologique de la proposition tout en restant naturel dans un registre biblique moderne.
- source_word: πληρωθῇ
  choice: s’accomplisse
  rationale: Aoriste passif subjonctif de πληρόω dans une proposition introduite par ἵνα. La forme pronominale française exprime naturellement l’accomplissement, et le subjonctif après « afin que » correspond au mode grec.
- source_word: τὸ ῥηθὲν
  choice: ce qui avait été dit
  rationale: L’article neutre suivi du participe passif est substantivé. Le plus-que-parfait situe naturellement cette parole avant les événements racontés, sans en changer le sens.
- source_word: διὰ
  choice: par l’intermédiaire de
  rationale: Avec le génitif, διά présente Ésaïe comme l’intermédiaire de la parole prophétique. Cette formulation rend cette médiation plus explicitement que le simple « par ».
- source_word: Ἠσαΐου
  choice: Ésaïe
  rationale: Forme française traditionnelle et largement reconnue du nom du prophète.
- source_word: τοῦ προφήτου
  choice: du prophète
  rationale: Conserve explicitement l’apposition qui identifie la fonction d’Ésaïe et souligne l’autorité prophétique de la parole citée.
- source_word: λέγοντος
  choice: ':'
  rationale: Le participe présent introduit la citation qui suit. En français, les deux-points remplissent naturellement cette fonction sans l’expression lourde « disant ».
theological_decisions:
- issue: Formule d’accomplissement chez Matthieu
  choice: Traduire πληρωθῇ par « s’accomplisse » et conserver explicitement le motif de l’accomplissement des Écritures.
  alternative: Employer une expression plus dynamique telle que « se réalise » ou « devienne réalité ».
  rationale: Le vocabulaire de l’accomplissement est intentionnel et récurrent chez Matthieu. « S’accomplisse » maintient ce lien intertextuel et théologique sans préciser au-delà du texte la nature exacte de cet accomplissement.
translation_notes:
  register: Français international moderne, digne et lisible. « Par l’intermédiaire de » préserve la médiation exprimée par διά ; les deux-points rendent idiomatiquement la fonction introductive de λέγοντος.
