id: MAT.4.24
reference: Matthew 4:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν ἡ ἀκοὴ αὐτοῦ εἰς ὅλην τὴν Συρίαν· καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας ποικίλαις νόσοις καὶ βασάνοις ⸀συνεχομένους, δαιμονιζομένους καὶ σεληνιαζομένους καὶ παραλυτικούς, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/024.yaml
  text: And the report about him went out into all Syria[a], and they brought to him all who were sick, afflicted with various diseases and torments, those oppressed by demons, those having seizures, and paralytics[c][b], and he healed them.
translation:
  language: fr
  text: 'La nouvelle à son sujet se répandit dans toute la Syrie. On lui amena tous les malades, en proie à diverses maladies et souffrances : les personnes sous l’emprise de démons[a], celles qui étaient sujettes à des crises[b] et les paralysés. Et il les guérit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les possédés » ou « les démonisés ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec est traditionnellement rendu par « les épileptiques » ; plus littéralement, il désigne des personnes que l’on pensait affectées par la lune.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκοὴ
  choice: la nouvelle à son sujet
  rationale: Dans ce contexte, le nom désigne ce que l’on entend raconter au sujet de Jésus, et non la faculté d’entendre. « La nouvelle » exprime naturellement cette information qui circule.
- source_word: ἀπῆλθεν
  choice: se répandit
  rationale: Le grec emploie un verbe de mouvement, littéralement « partit/s’en alla ». En français, avec « la nouvelle », « se répandit » restitue naturellement cette image et son sens contextuel.
- source_word: κακῶς ἔχοντας
  choice: tous les malades
  rationale: Cette expression idiomatique désigne les personnes qui vont mal physiquement. « Les malades » est clair, courant et concis.
- source_word: ποικίλαις νόσοις καὶ βασάνοις συνεχομένους
  choice: en proie à diverses maladies et souffrances
  rationale: συνέχω présente ces personnes comme tenues ou accablées par leurs maux, tandis que βάσανος évoque une souffrance intense. « En proie à » conserve cette force sans raideur, et « souffrances » convient mieux ici que le français très chargé « tourments ».
- source_word: δαιμονιζομένους
  choice: les personnes sous l’emprise de démons
  rationale: Cette formulation maintient explicitement le référent démoniaque sans imposer au participe grec une catégorie technique moderne plus étroite telle que « possession ».
- source_word: σεληνιαζομένους
  choice: celles qui étaient sujettes à des crises
  rationale: Le terme est étymologiquement lié à la lune et a traditionnellement été associé à l’épilepsie. La formulation retenue communique prudemment la manifestation probable sans valider une étiologie lunaire ni poser un diagnostic médical trop précis.
- source_word: παραλυτικούς
  choice: les paralysés
  rationale: Le terme désigne des personnes atteintes de paralysie. « Les paralysés » est naturel et exact en français moderne.
- source_word: ἐθεράπευσεν
  choice: il les guérit
  rationale: Le verbe signifie ici guérir. Le passé simple convient au récit suivi et conserve l’aspect ponctuel de l’aoriste.
theological_decisions:
- issue: Rendre δαιμονιζομένους sans nier le référent surnaturel ni définir trop étroitement la nature de l’emprise
  choice: les personnes sous l’emprise de démons
  alternative: les possédés ; les démonisés
  rationale: Le texte présente une action démoniaque réelle, mais le participe ne précise pas à lui seul tous les contours d’une catégorie technique de « possession ». La traduction choisie préserve cette tension, et les formulations plus littérales ou traditionnelles figurent en note.
- issue: Rendre σεληνιαζομένους sans entériner une causalité lunaire
  choice: celles qui étaient sujettes à des crises
  alternative: les épileptiques ; les lunatiques ; les personnes atteintes par la lune
  rationale: Le mot grec est lié lexicalement à la lune, mais le contexte évoque vraisemblablement des crises. Le texte principal reste intelligible pour le lecteur moderne, tandis que la note conserve l’arrière-plan lexical et la traduction traditionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le deux-points explicite naturellement que les catégories suivantes détaillent « tous les malades ». La reprise finale « Et il les guérit » conserve la cadence narrative et l’insistance du dernier καί grec.
