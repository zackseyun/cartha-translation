  text: καὶ ⸀εἶπεν αὐτῷ· Ταῦτά ⸂σοι πάντα⸃ δώσω, ἐὰν πεσὼν προσκυνήσῃς μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/009.yaml
  text: And he said to him[a], “I will give you all these things, if you fall down and worship me.”
translation:
  language: fr
  text: 'Et il lui dit : « Je te donnerai tout cela, si tu te prosternes et m’adores[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te courbes devant moi » ou « me rends hommage ». Le verbe grec peut désigner une prosternation ou un hommage, mais, ici, le contexte favorise « adorer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple, sans ajouter une nuance temporelle absente du grec.
- source_word: εἶπεν αὐτῷ
  choice: il lui dit
  rationale: Conserve les pronoms du texte grec sans expliciter les référents.
- source_word: Ταῦτά σοι πάντα δώσω
  choice: Je te donnerai tout cela
  rationale: Formulation française naturelle qui conserve la valeur démonstrative et exhaustive de Ταῦτά… πάντα ainsi que la promesse au futur.
- source_word: ἐὰν
  choice: si
  rationale: Rend directement la condition introduite par ἐὰν.
- source_word: πεσὼν
  choice: tu te prosternes
  rationale: Exprime naturellement en français le mouvement corporel d’abaissement impliqué par le participe, sans employer le peu idiomatique « tomber à terre » dans ce contexte.
- source_word: προσκυνήσῃς μοι
  choice: m’adores
  rationale: Le contexte religieux de la tentation et la réponse du verset suivant favorisent « adorer », tout en signalant en note la portée plus large du verbe.
theological_decisions:
- issue: Sens de προσκυνέω dans l’exigence adressée à Jésus
  choice: m’adores
  alternative: te courbes devant moi / me rends hommage
  rationale: La réplique qui suit, sur le culte dû à Dieu seul, donne ici au geste une portée cultuelle. La note préserve néanmoins l’étendue sémantique du verbe grec.
translation_notes:
  register: Français international moderne, naturel et digne. « Tout cela » reprend collectivement les royaumes et leur gloire montrés au verset précédent. La combinaison « te prosternes et m’adores » maintient à la fois le geste physique et sa portée religieuse.
