  yaml_path: translation/nt/matthew/004/020.yaml
  text: And they immediately left the nets and followed him.
translation:
  language: fr
  text: Aussitôt, ils laissèrent les filets et le suivirent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: non rendu séparément
  rationale: δὲ est ici une légère articulation narrative. En français, l’enchaînement se fait naturellement sans conjonction explicite, ce qui évite un « et » lourd en tête de phrase.
- source_word: εὐθέως
  choice: Aussitôt
  rationale: « Aussitôt » exprime clairement la promptitude soulignée par εὐθέως et convient au registre narratif digne et courant.
- source_word: ἀφέντες
  choice: laissèrent
  rationale: 'Le participe aoriste exprime une action antérieure à celle du verbe principal. Deux verbes coordonnés rendent naturellement en français la succession : ils laissèrent les filets, puis le suivirent. « Abandonnèrent » serait plus appuyé que le grec ne l’exige ici.'
- source_word: τὰ δίκτυα
  choice: les filets
  rationale: Le contexte de la pêche permet de conserver simplement l’article défini et le nom, sans ajouter « leurs » ni « de pêche ».
- source_word: ἠκολούθησαν αὐτῷ
  choice: le suivirent
  rationale: Cette formulation naturelle conserve à la fois le déplacement concret derrière Jésus et la portée naissante de l’engagement comme disciples.
theological_decisions:
- issue: Portée du verbe ἠκολούθησαν dans le contexte de l’appel
  choice: le suivirent
  alternative: allèrent derrière lui
  rationale: « Le suivirent » maintient ensemble le sens physique et la nuance de l’attachement au maître, sans expliciter davantage la notion de disciple que ne le fait le texte.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient à une narration biblique écrite sans être archaïque. La phrase reste concise et reproduit la réponse immédiate des deux hommes.
