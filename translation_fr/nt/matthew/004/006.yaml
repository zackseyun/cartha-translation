id: MAT.4.6
reference: Matthew 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν κάτω· γέγραπται γὰρ ὅτι Τοῖς ἀγγέλοις αὐτοῦ ἐντελεῖται περὶ σοῦ καὶ ἐπὶ χειρῶν ἀροῦσίν σε, μήποτε προσκόψῃς πρὸς λίθον τὸν πόδα σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/006.yaml
  text: 'And he said to him[a], “If you are the Son of God, throw yourself down, for it is written: ‘He will command his angels concerning you,’ and ‘On their hands they will lift you up[b], lest you strike your foot against a stone.’”'
translation:
  language: fr
  text: 'Et il lui dit : « Si tu es le Fils de Dieu, jette-toi en bas, car il est écrit : “Il donnera des ordres à ses anges à ton sujet” et : “Ils te porteront sur leurs mains[a], de peur que ton pied ne heurte une pierre.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils te soulèveront. »'
    reason: Variante lexicale possible pour ἀροῦσίν σε ; elle conserve l’image des mains déjà exprimée dans le texte principal.
lexical_decisions:
- source_word: λέγει
  choice: il lui dit
  rationale: Le présent grec fonctionne ici comme un présent historique. Le passé composé est naturel en français narratif moderne et conserve la valeur narrative.
- source_word: Εἰ
  choice: Si
  rationale: « Si » préserve la force conditionnelle et provocatrice de l’épreuve sans transformer explicitement la condition en affirmation.
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Dans le contexte matthéen, l’expression fonctionne comme un titre reconnu. L’article français est requis par l’usage idiomatique et ne dépasse pas le sens contextuel.
- source_word: βάλε σεαυτὸν κάτω
  choice: jette-toi en bas
  rationale: Cette formulation actuelle et directe rend l’impératif, le réfléchi et l’idée de mouvement vers le bas.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée pour introduire une citation de l’Écriture, elle reflète aussi la portée durable du parfait grec.
- source_word: ἐντελεῖται
  choice: Il donnera des ordres
  rationale: Le pluriel idiomatique français exprime clairement l’idée d’un commandement adressé aux anges.
- source_word: περὶ σοῦ
  choice: à ton sujet
  rationale: Rend directement περί avec le génitif sans lui donner le sens plus interprétatif de « pour toi ».
- source_word: ἐπὶ χειρῶν
  choice: sur leurs mains
  rationale: Conserve l’image précise du texte grec et de la citation du psaume.
- source_word: ἀροῦσίν σε
  choice: Ils te porteront
  rationale: Dans ce contexte, αἴρω désigne le fait de soulever et soutenir quelqu’un. « Porter » est naturel en français tout en conservant l’image protectrice.
- source_word: μήποτε προσκόψῃς πρὸς λίθον
  choice: de peur que ... ne heurte une pierre
  rationale: La tournure exprime la prévention portée par μήποτε, tandis que « heurter » rend le contact du pied avec la pierre plus précisément qu’un simple « trébucher ».
- source_word: τὸν πόδα σου
  choice: ton pied
  rationale: Le singulier du grec est conservé.
theological_decisions:
- issue: Valeur christologique de « Fils de Dieu » dans la provocation du tentateur
  choice: Employer le titre « le Fils de Dieu »
  alternative: Traduire sans article par « fils de Dieu »
  rationale: Dans le récit de Matthieu, l’expression désigne Jésus par un titre christologique identifiable. La traduction conserve cette portée sans ajouter d’explication doctrinale.
- issue: Citation de l’Écriture par le diable
  choice: Reproduire la citation telle qu’elle est prononcée, sans correction ni commentaire dans le corps du texte
  alternative: Ajouter dans le texte une réserve interprétative ou harmoniser la citation avec le psaume complet
  rationale: Le verset met en scène le tentateur citant l’Écriture. La traduction doit préserver cette tension narrative et ne pas insérer d’interprétation étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le rythme de la citation scripturaire sans archaïsmes inutiles. Le tutoiement correspond au singulier grec et à l’usage narratif naturel en français.
