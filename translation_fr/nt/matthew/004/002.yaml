  text: καὶ νηστεύσας ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα ὕστερον ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/002.yaml
  text: And after fasting forty days and forty nights[a], he was hungry.
translation:
  language: fr
  text: Après avoir jeûné quarante jours et quarante nuits, il eut faim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Ayant jeûné quarante jours et quarante nuits, il eut ensuite faim. »'
    reason: Alternative plus formelle qui rend séparément le participe νηστεύσας et l’adverbe ὕστερον.
lexical_decisions:
- source_word: νηστεύσας
  choice: Après avoir jeûné
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. Cette tournure française est naturelle et rend clairement le rapport temporel.
- source_word: ἡμέρας τεσσεράκοντα καὶ νύκτας τεσσεράκοντα
  choice: quarante jours et quarante nuits
  rationale: L’accusatif indique la durée. En français, celle-ci s’exprime naturellement sans préposition dans cette construction, tout en conservant la formulation biblique traditionnelle.
- source_word: ὕστερον
  choice: après
  rationale: L’idée de postériorité est intégrée à la tournure « Après avoir jeûné ». Traduire en plus par « ensuite » ou « après cela » serait possible, mais plus lourd et partiellement redondant en français.
- source_word: ἐπείνασεν
  choice: il eut faim
  rationale: Cette expression française courante traduit l’apparition de la faim après le jeûne et convient au caractère ponctuel de l’aoriste, sans archaïsme.
- source_word: καὶ
  choice: Après
  rationale: Le simple enchaînement narratif porté par καί est rendu naturellement par l’ouverture temporelle de la phrase. Un « Et » initial serait possible, mais moins fluide devant « après avoir » en français moderne.
theological_decisions:
- issue: La réalité du besoin humain de Jésus après le jeûne
  choice: il eut faim
  alternative: il avait faim
  rationale: « Il eut faim » affirme simplement la faim réelle de Jésus et en marque la survenue, sans développer ni atténuer la portée christologique du récit.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve le rythme biblique « quarante jours et quarante nuits » tout en évitant une syntaxe inutilement littérale.
