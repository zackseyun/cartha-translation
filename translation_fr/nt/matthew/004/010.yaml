id: MAT.4.10
reference: Matthew 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ὕπαγε, Σατανᾶ· γέγραπται γάρ· Κύριον τὸν θεόν σου προσκυνήσεις καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/010.yaml
  text: 'Then Jesus says to him, “Go away, Satan! For it is written: ‘You shall worship the Lord your God, and serve him only.’”'
translation:
  language: fr
  text: 'Alors Jésus lui dit : « Va-t’en, Satan ! Car il est écrit : “C’est le Seigneur, ton Dieu, que tu adoreras[a], et c’est lui seul que tu serviras[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu te prosterneras devant le Seigneur, ton Dieu. » Le verbe grec peut désigner plus concrètement le fait de se prosterner ou de s’incliner avec révérence.'
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « servir » peut désigner spécialement le service sacré ou religieux rendu à Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans un récit français.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec donne de la vivacité, mais le passé simple est la forme narrative naturelle et digne en français écrit.
- source_word: Ὕπαγε
  choice: Va-t’en
  rationale: Impératif énergique de départ, courant en français moderne et plus précis que le simple « Va ».
- source_word: Σατανᾶ
  choice: Satan
  rationale: Translittération française traditionnelle du nom ou titre employé au vocatif.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule consacrée et exacte pour le parfait passif introduisant une citation de l’Écriture.
- source_word: Κύριον τὸν θεόν σου
  choice: le Seigneur ton Dieu
  rationale: Rend directement l’apposition grecque et l’identification du Seigneur comme le Dieu de l’interlocuteur.
- source_word: προσκυνήσεις
  choice: tu adoreras
  rationale: Dans ce contexte de dévotion à Dieu, « adorer » exprime naturellement le sens religieux, tandis qu’une note conserve le sens concret possible de prosternation.
- source_word: αὐτῷ μόνῳ
  choice: c’est lui seul
  rationale: La tournure clivée française met clairement en relief l’exclusivité portée par μόνῳ.
- source_word: λατρεύσεις
  choice: tu serviras
  rationale: Préserve la distinction avec προσκυνήσεις, tout en permettant à une note d’indiquer la nuance de service cultuel.
theological_decisions:
- issue: Distinction entre προσκυνέω et λατρεύω
  choice: « adorer » puis « servir »
  alternative: Employer le vocabulaire de l’adoration pour les deux verbes, ou traduire le premier par « se prosterner devant »
  rationale: Le grec emploie deux verbes apparentés mais distincts. Les différencier conserve la tension entre hommage adorant et service consacré, sans réduire ni élargir artificiellement leur portée.
- issue: Exclusivité de αὐτῷ μόνῳ
  choice: « c’est lui seul que tu serviras »
  alternative: « tu ne serviras que lui »
  rationale: La tournure choisie souligne nettement « lui seul » tout en restant naturelle et solennelle en français.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit sans archaïsme excessif. La citation emploie une structure emphatique naturelle qui fait ressortir l’objet exclusif de l’adoration et du service.
