  text: ὁ λαὸς ὁ καθήμενος ἐν ⸀σκοτίᾳ ⸂φῶς εἶδεν⸃ μέγα, καὶ τοῖς καθημένοις ἐν χώρᾳ καὶ σκιᾷ θανάτου φῶς ἀνέτειλεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/016.yaml
  text: The people sitting in darkness saw a great light[a], and on those sitting in the region and shadow of death, a light dawned.
translation:
  language: fr
  text: Le peuple assis dans les ténèbres a vu une grande lumière ; et une lumière s’est levée sur ceux qui étaient assis dans une région et dans l’ombre de la mort[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque « ombre de mort » peut aussi évoquer une profonde obscurité, mais le grec mentionne explicitement la mort.
    reason: Précision lexicale et préservation de l’image biblique.
lexical_decisions:
- source_word: λαὸς
  choice: le peuple
  rationale: « Le peuple » rend naturellement le collectif grec sans lui donner le sens politique moderne de « nation ».
- source_word: καθήμενος / καθημένοις
  choice: assis / étaient assis
  rationale: La traduction conserve l’image concrète de la position assise ainsi que le parallélisme avec la citation d’Ésaïe, plutôt que de l’atténuer par « habitait » ou « vivait ».
- source_word: σκοτίᾳ
  choice: les ténèbres
  rationale: « Les ténèbres » garde la portée à la fois concrète et métaphorique du terme sans préciser abusivement si elles sont morales, spirituelles, politiques ou existentielles.
- source_word: φῶς εἶδεν μέγα
  choice: a vu une grande lumière
  rationale: Le passé composé est naturel dans une citation intégrée au récit en français moderne, et « une grande lumière » restitue clairement l’apparition marquante évoquée.
- source_word: χώρᾳ
  choice: la région
  rationale: « Région » exprime le sens géographique sans suggérer un État moderne ; le mot convient aussi au registre prophétique de la citation.
- source_word: σκιᾷ θανάτου
  choice: l’ombre de la mort
  rationale: Cette formulation conserve explicitement θανάτου, « mort », ainsi que l’image biblique traditionnelle, au lieu de la réduire à la seule idée d’une profonde obscurité.
- source_word: ἀνέτειλεν
  choice: s’est levée
  rationale: Le verbe évoque le lever d’un astre ou l’apparition de la lumière. « S’est levée » conserve cette image et s’emploie naturellement avec « lumière ».
- source_word: αὐτοῖς
  choice: sur ceux
  rationale: Avec « une lumière s’est levée », la préposition « sur » rend idiomatiquement le datif grec et identifie clairement les bénéficiaires de cette apparition.
theological_decisions:
- issue: Nature des images des ténèbres et de la lumière
  choice: Conserver les images sans définir plus précisément leur portée.
  alternative: Identifier explicitement les ténèbres au péché ou à l’ignorance des non-Juifs, et la lumière à la révélation salvatrice du Messie.
  rationale: La citation prophétique est riche de portée théologique, mais ce membre de phrase ne limite pas lui-même le sens de ces images à une seule interprétation. La traduction préserve donc leur ampleur et leur tension.
- issue: Expression « ombre de la mort »
  choice: Maintenir la mention explicite de la mort dans le texte principal.
  alternative: Traduire par « profonde obscurité ».
  rationale: Même si l’expression biblique sous-jacente peut ailleurs désigner une obscurité profonde, le grec de Matthieu contient explicitement θανάτου, « mort » ; il convient donc de ne pas effacer cette donnée.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle et les images prophétiques sont conservées. Le point-virgule aide à faire entendre les deux membres de la citation sans alourdir la phrase.
