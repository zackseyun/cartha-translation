id: MAT.4.1
reference: Matthew 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς ἀνήχθη εἰς τὴν ἔρημον ὑπὸ τοῦ πνεύματος, πειρασθῆναι ὑπὸ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/001.yaml
  text: Then Jesus was led up into the wilderness by the Spirit to be tempted by the devil[a].
translation:
  language: fr
  text: Alors Jésus fut conduit par l’Esprit dans le désert pour être tenté par le diable[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour être mis à l’épreuve » ; le verbe grec peut exprimer soit la tentation, soit la mise à l’épreuve, mais le contexte immédiat favorise ici « être tenté ».
    reason: alternative lexicale
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession immédiate avec le récit du baptême, sans surinterpréter la chronologie.
- source_word: ἀνήχθη
  choice: fut conduit
  rationale: Le passif est conservé. Le préverbe peut évoquer un mouvement vers le haut, mais « conduit en haut dans le désert » serait peu naturel et risquerait de préciser indûment la topographie.
- source_word: εἰς τὴν ἔρημον
  choice: dans le désert
  rationale: « Le désert » est l’expression française courante et digne pour une région inhabitée ou désolée; elle convient au cadre judéen sans en préciser excessivement le terrain.
- source_word: ὑπὸ τοῦ πνεύματος
  choice: par l’Esprit
  rationale: Le contexte immédiat du baptême identifie naturellement l’agent comme l’Esprit de Dieu. La majuscule le signale sans ajouter « Saint », absent du grec.
- source_word: πειρασθῆναι
  choice: pour être tenté
  rationale: L’action du diable dans la scène qui suit favorise le sens de tentation, tandis que le sens possible de mise à l’épreuve est conservé en note.
- source_word: ὑπὸ τοῦ διαβόλου
  choice: par le diable
  rationale: Dans ce contexte, διάβολος désigne l’adversaire personnel; « le diable » est le terme français établi et immédiatement compréhensible.
theological_decisions:
- issue: Identification de τοῦ πνεύματος
  choice: « l’Esprit » désigne l’Esprit de Dieu
  alternative: un esprit ou l’esprit humain
  rationale: Le récit précédent présente l’Esprit descendant sur Jésus; la majuscule suit donc l’identification narrative sans ajouter au texte grec l’adjectif « Saint ».
- issue: Sens de πειρασθῆναι
  choice: « être tenté »
  alternative: « être mis à l’épreuve »
  rationale: L’agent, le diable, et la suite du récit favorisent « tenté ». La note préserve toutefois la polysémie grecque et la tension entre tentation et épreuve.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La formulation reste concise et conserve les deux compléments d’agent du grec.
