id: MAT.4.15
reference: Matthew 4:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Γῆ Ζαβουλὼν καὶ γῆ Νεφθαλίμ, ὁδὸν θαλάσσης, πέραν τοῦ Ἰορδάνου, Γαλιλαία τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/015.yaml
  text: Land of Zebulun and land of Naphtali[a], the way of the sea, beyond the Jordan, Galilee of the Gentiles—
translation:
  language: fr
  text: Pays de Zabulon et pays de Nephtali, route de la mer, au-delà du Jourdain, Galilée des non-Juifs[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Galilée des nations ».
    reason: Alternative lexicale pour τῶν ἐθνῶν.
lexical_decisions:
- source_word: Γῆ … γῆ
  choice: Pays … pays
  rationale: « Pays » exprime ici un territoire géographique et conserve la répétition parallèle du grec, sans suggérer la terre entière ni le sol.
- source_word: Ζαβουλὼν
  choice: Zabulon
  rationale: Forme française biblique usuelle du nom de la tribu et de son territoire.
- source_word: Νεφθαλίμ
  choice: Nephtali
  rationale: Forme française biblique usuelle du nom de la tribu et de son territoire.
- source_word: ὁδὸν θαλάσσης
  choice: route de la mer
  rationale: 'Cette formulation concise conserve l’expression géographique de la citation et son ambiguïté : elle peut désigner un itinéraire connu ou la région qui le longe.'
- source_word: πέραν τοῦ Ἰορδάνου
  choice: au-delà du Jourdain
  rationale: Rend naturellement l’expression géographique grecque sans préciser davantage le point de vue.
- source_word: Γαλιλαία
  choice: Galilée
  rationale: Nom français conventionnel de la région.
- source_word: τῶν ἐθνῶν
  choice: des non-Juifs
  rationale: Dans ce contexte juif et dans l’écho à Ésaïe, l’expression désigne principalement les populations autres que le peuple juif. « Non-Juifs » est clair en français moderne, tandis que le sens plus littéral « nations » est signalé en note.
theological_decisions:
- issue: Interprétation de ἐθνῶν dans la citation d’Ésaïe
  choice: des non-Juifs
  alternative: des nations
  rationale: Le contexte met en relief l’association de la Galilée avec des populations non juives. « Des non-Juifs » transmet clairement cette opposition ethnoreligieuse sans lui donner une portée doctrinale supplémentaire; « des nations », lexicalement possible, est conservé en note.
translation_notes:
  register: Français international moderne, sobre et digne. La structure nominale et le parallélisme de la citation sont préservés. Le tiret final indique que la citation se poursuit au verset suivant.
source_grounding:
  english_pob_role: consult_only
