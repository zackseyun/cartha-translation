  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Δεῦτε ὀπίσω μου, καὶ ποιήσω ὑμᾶς ἁλιεῖς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/019.yaml
  text: And he says to them[a], “Come after me, and I will make you fishers of men.”
translation:
  language: fr
  text: 'Et il leur dit : « Venez à ma suite, et je ferai de vous des pêcheurs d’hommes[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pêcheurs d’êtres humains » ; le grec emploie ἀνθρώπων, qui désigne ici les êtres humains en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: il leur dit
  rationale: Le présent français « dit » correspond formellement au présent historique grec et reste naturel dans le récit.
- source_word: Δεῦτε
  choice: Venez
  rationale: L’impératif exprime directement l’appel à venir, sans absorber le sens de la locution suivante.
- source_word: ὀπίσω μου
  choice: à ma suite
  rationale: Cette tournure française naturelle conserve l’image de se placer derrière Jésus pour le suivre, sans réduire les deux éléments grecs à un seul verbe.
- source_word: ποιήσω ὑμᾶς
  choice: je ferai de vous
  rationale: La construction française « faire de quelqu’un… » rend naturellement l’action future et transformatrice exprimée par le grec.
- source_word: ἁλιεῖς ἀνθρώπων
  choice: pêcheurs d’hommes
  rationale: Cette expression directe, traditionnelle et compréhensible conserve la métaphore de la pêche ainsi que la forme de ἀνθρώπων, tout en laissant une note préciser que le référent est l’humanité en général.
theological_decisions:
- issue: Portée du masculin dans ἀνθρώπων
  choice: pêcheurs d’hommes
  alternative: pêcheurs de personnes
  rationale: Le texte principal conserve l’expression grecque sous une forme française établie, tandis que la note explicite sa portée générique afin de ne pas laisser entendre qu’elle exclut les femmes.
translation_notes:
  register: Français international moderne, digne et accessible. « À ma suite » est idiomatique tout en maintenant distincts l’appel « Venez » et l’image du disciple qui marche derrière son maître. Le présent historique est conservé.
