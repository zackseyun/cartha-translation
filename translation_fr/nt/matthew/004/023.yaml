id: MAT.4.23
reference: Matthew 4:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ⸂ἐν ὅλῃ τῇ Γαλιλαίᾳ⸃, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν μαλακίαν ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/023.yaml
  text: And he went throughout all Galilee[a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness among the people.
translation:
  language: fr
  text: Il parcourait toute la Galilée, enseignant dans leurs synagogues, proclamant la bonne nouvelle du royaume[a] et guérissant toute maladie et toute infirmité parmi le peuple.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Évangile du royaume ».'
    reason: Alternative lexicale traditionnelle pour εὐαγγέλιον.
lexical_decisions:
- source_word: περιῆγεν
  choice: parcourait
  rationale: L’imparfait exprime une activité itinérante continue ou répétée. « Parcourait » rend naturellement le déplacement à travers la région.
- source_word: ἐν ὅλῃ τῇ Γαλιλαίᾳ
  choice: toute la Galilée
  rationale: Avec « parcourait », cette formulation française exprime clairement l’étendue distributive de l’activité dans l’ensemble de la région, sans calque inutile de ἐν.
- source_word: διδάσκων
  choice: enseignant
  rationale: Le participe présent garde le rapport de simultanéité avec le verbe principal.
- source_word: συναγωγαῖς αὐτῶν
  choice: leurs synagogues
  rationale: « Synagogues » désigne ici les lieux ou assemblées juives, et « leurs » conserve explicitement le possessif grec.
- source_word: κηρύσσων
  choice: proclamant
  rationale: Le verbe évoque une annonce publique faite avec autorité ; « proclamant » en conserve la force.
- source_word: τὸ εὐαγγέλιον
  choice: la bonne nouvelle
  rationale: Cette expression traduit directement le sens lexical et reste transparente pour le lectorat moderne. Le terme traditionnel « Évangile » figure en note.
- source_word: τῆς βασιλείας
  choice: du royaume
  rationale: Le génitif est conservé sans trancher plus précisément entre une nouvelle caractérisée par le royaume et une nouvelle qui le concerne. « Royaume » est clair et bien établi en français biblique.
- source_word: θεραπεύων
  choice: guérissant
  rationale: Dans ce contexte, le verbe désigne effectivement l’action de guérir.
- source_word: πᾶσαν νόσον
  choice: toute maladie
  rationale: « Maladie » rend le sens courant de νόσος et permet de maintenir la distinction avec μαλακία.
- source_word: πᾶσαν μαλακίαν
  choice: toute infirmité
  rationale: « Infirmité » couvre ici l’idée de faiblesse ou d’affection physique et préserve le second terme de la paire sans le confondre avec νόσος.
- source_word: ἐν τῷ λαῷ
  choice: parmi le peuple
  rationale: Cette tournure idiomatique française exprime la sphère humaine au sein de laquelle les guérisons avaient lieu.
theological_decisions:
- issue: Traduction de εὐαγγέλιον
  choice: la bonne nouvelle
  alternative: l’Évangile
  rationale: « Bonne nouvelle » donne directement le sens du grec sans imposer un vocabulaire ecclésiastique, tandis que la traduction traditionnelle est conservée en note.
- issue: Rapport exprimé par τῆς βασιλείας
  choice: du royaume
  alternative: concernant le royaume
  rationale: Le génitif grec permet plusieurs nuances. La formulation retenue préserve cette densité sans réduire explicitement le royaume au seul sujet de l’annonce.
- issue: Portée de πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: toute maladie et toute infirmité
  alternative: toutes sortes de maladies et d’infirmités
  rationale: La répétition de πᾶσαν est maintenue afin de conserver l’insistance et l’ampleur formulées par le texte, sans ajouter de qualification doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La structure participiale est conservée parce qu’elle reste fluide en français et montre que l’enseignement, la proclamation et les guérisons accompagnent le parcours de la Galilée.
