  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Πάλιν γέγραπται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/007.yaml
  text: 'Jesus said to him[b][a], “Again it is written: ‘You shall not put the Lord your God to the test.’”'
translation:
  language: fr
  text: 'Jésus lui dit : « Il est encore écrit : “Tu ne mettras pas le Seigneur[a] ton Dieu à l’épreuve[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citation de Deutéronome 6.16. Dans la Septante grecque, « le Seigneur » traduit le nom divin.
    reason: cross_reference
  - marker: b
    text: 'On peut aussi traduire : « Tu ne tenteras pas le Seigneur ton Dieu. » Le verbe grec ἐκπειράζω peut signifier « mettre à l’épreuve » ou « tester ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Cette formulation française naturelle rend l’introduction simple du discours et le datif αὐτῷ sans ajouter d’intensité.
- source_word: Πάλιν
  choice: aussi
  rationale: Dans cette réplique, πάλιν introduit une autre citation scripturaire qui répond à la précédente. « Aussi » exprime naturellement cette valeur argumentative en français, là où « de nouveau » pourrait suggérer que le même texte a déjà été cité.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule consacrée de citation de l’Écriture, elle rend le parfait passif et sa portée durable.
- source_word: Οὐκ ἐκπειράσεις
  choice: Tu ne mettras pas … à l’épreuve
  rationale: Le futur grec a ici valeur d’interdiction. « Mettre à l’épreuve » rend bien ἐκπειράζω tout en conservant la forme solennelle de la citation.
- source_word: κύριον τὸν θεόν σου
  choice: le Seigneur ton Dieu
  rationale: Cette formulation respecte l’apposition grecque et le registre biblique français. « Seigneur » traduit κύριος dans la citation grecque, tandis que « ton Dieu » rend naturellement le possessif σου.
theological_decisions:
- issue: Traduction de κύριος dans une citation concernant le Dieu d’Israël
  choice: le Seigneur
  alternative: l’Éternel / le SEIGNEUR
  rationale: Le texte source immédiat est grec et porte κύριον. « Le Seigneur » traduit directement ce terme sans substituer au grec une reconstruction typographique ou confessionnelle du nom divin; une note signale l’arrière-plan de la Septante.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste naturelle tout en conservant la formule scripturaire solennelle « il est écrit » et le futur à valeur d’interdiction.
