  text: οἱ δὲ εὐθέως ἀφέντες τὸ πλοῖον καὶ τὸν πατέρα αὐτῶν ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/022.yaml
  text: And they immediately left the boat and their father and followed him[a].
translation:
  language: fr
  text: Aussitôt[a], ils laissèrent la barque et leur père et suivirent Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « immédiatement ».'
    reason: Alternative lexicale pour εὐθέως.
lexical_decisions:
- source_word: οἱ δὲ
  choice: ils
  rationale: L’article substantivé renvoie aux deux frères mentionnés auparavant. En français, « ils » suffit; δέ est rendu implicitement par la progression naturelle du récit, sans introduire un contraste absent du contexte.
- source_word: εὐθέως
  choice: Aussitôt
  rationale: « Aussitôt » exprime nettement la promptitude et conserve la force narrative de ce terme caractéristique chez Matthieu.
- source_word: ἀφέντες
  choice: laissèrent
  rationale: Le participe aoriste indique une action qui précède le verbe principal. La coordination française « laissèrent… et suivirent » rend naturellement cet enchaînement sans renforcer le sens en « abandonnèrent ».
- source_word: τὸ πλοῖον
  choice: la barque
  rationale: Dans ce contexte de pêche sur le lac, « barque » est le terme français courant et approprié, plutôt que « bateau » ou « navire ».
- source_word: τὸν πατέρα αὐτῶν
  choice: leur père
  rationale: Cette formulation naturelle préserve explicitement la dimension familiale et le coût immédiat de leur réponse.
- source_word: ἠκολούθησαν αὐτῷ
  choice: suivirent Jésus
  rationale: Le verbe conserve à la fois l’idée concrète de se mettre à la suite de quelqu’un et sa portée de disciple. Le nom « Jésus », clair dans le contexte, évite en français une possible hésitation sur l’antécédent de « lui ».
theological_decisions:
- issue: Réponse des disciples et séparation familiale
  choice: Le verset présente leur départ comme immédiat et décisif, sans affirmer au-delà du grec qu’ils abandonnèrent définitivement leur père.
  alternative: « Ils abandonnèrent leur père » ou, à l’inverse, « ils s’éloignèrent momentanément de lui ».
  rationale: ἀφέντες signifie ici qu’ils laissèrent la barque et leur père pour suivre Jésus. « Laissèrent » maintient la force du récit tout en évitant de préciser indûment la durée ou la nature définitive de cette séparation.
translation_notes:
  register: Français international moderne, simple et digne. La phrase garde le rythme bref du récit et met « Aussitôt » en tête pour préserver l’accent grec sur l’immédiateté.
