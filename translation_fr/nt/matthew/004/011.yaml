id: MAT.4.11
reference: Matthew 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἀφίησιν αὐτὸν ὁ διάβολος, καὶ ἰδοὺ ἄγγελοι προσῆλθον καὶ διηκόνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/011.yaml
  text: Then the devil left him[a], and behold, angels came and were ministering to him.
translation:
  language: fr
  text: Alors le diable le laissa. Et voici que des anges s’approchèrent et le servaient[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « prenaient soin de lui ». L’imparfait grec présente leur service comme une action en cours.'
    reason: Alternative lexicale et indication de l’aspect verbal.
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans un récit en français.
- source_word: ἀφίησιν
  choice: le laissa
  rationale: Le présent historique grec est rendu au passé simple, temps naturel d’un récit soutenu en français ; ici, le verbe signifie que le diable quitte Jésus.
- source_word: ὁ διάβολος
  choice: le diable
  rationale: Dans le récit de la tentation, le mot désigne personnellement Satan ; « le diable » est clair et établi, contrairement au sens étymologique « le calomniateur ».
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction d’appel à l’attention et l’effet de soudaineté tout en restant naturel en français moderne.
- source_word: ἄγγελοι
  choice: des anges
  rationale: Le contexte indique des êtres célestes plutôt que de simples messagers humains.
- source_word: προσῆλθον
  choice: s’approchèrent
  rationale: Rend explicitement l’idée de venir auprès de quelqu’un et s’accorde avec le registre narratif.
- source_word: διηκόνουν
  choice: le servaient
  rationale: « Servir » exprime directement le sens du verbe, tandis que l’imparfait français reflète l’action présentée comme en cours.
- source_word: αὐτῷ
  choice: le
  rationale: Le pronom datif désigne Jésus comme bénéficiaire du service ; la construction française « servir quelqu’un » exige ici un complément direct.
theological_decisions:
- issue: Valeur de διάβολος comme désignation personnelle
  choice: le diable
  alternative: le calomniateur
  rationale: Dans ce contexte, le terme fonctionne comme la désignation reconnue de Satan. La traduction choisie préserve cette référence sans ajouter de contenu doctrinal.
- issue: Nature du service rendu par les anges
  choice: le servaient
  alternative: prenaient soin de lui
  rationale: Le grec ne précise pas la forme exacte du service. La formulation retenue conserve cette indétermination au lieu de réduire le geste aux seuls soins matériels.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient au récit écrit, tandis que l’imparfait de « servaient » préserve le contraste aspectuel du grec. « Et voici que » maintient la vivacité de ἰδού sans archaïsme excessif.
