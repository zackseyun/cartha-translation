id: MAT.4.25
reference: Matthew 4:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἠκολούθησαν αὐτῷ ὄχλοι πολλοὶ ἀπὸ τῆς Γαλιλαίας καὶ Δεκαπόλεως καὶ Ἱεροσολύμων καὶ Ἰουδαίας καὶ πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/025.yaml
  text: And large crowds followed him from Galilee and the Decapolis and Jerusalem and Judea and beyond the Jordan[a].
translation:
  language: fr
  text: De grandes foules le suivirent, venant de la Galilée, de la Décapole, de Jérusalem, de la Judée et d’au-delà du Jourdain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’autre côté du Jourdain ».
    reason: Alternative lexicale qui explicite le sens spatial de πέραν τοῦ Ἰορδάνου sans déterminer davantage la région visée.
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: le suivirent
  rationale: L’aoriste narratif est rendu naturellement au passé simple. « Suivre » conserve à la fois le déplacement à la suite de Jésus et une possible nuance d’intérêt envers lui, sans affirmer un engagement de disciple pleinement établi.
- source_word: ὄχλοι πολλοὶ
  choice: de grandes foules
  rationale: Cette formulation française idiomatique exprime l’importance numérique des foules sans le calque peu naturel « beaucoup de foules ».
- source_word: ἀπὸ
  choice: venant de
  rationale: Le participe ajouté explicite naturellement en français que les lieux énumérés sont les régions d’origine des foules, tout en laissant « le suivirent » porter le verbe principal.
- source_word: Γαλιλαίας
  choice: la Galilée
  rationale: Forme française usuelle du nom de cette région.
- source_word: Δεκαπόλεως
  choice: la Décapole
  rationale: Forme française consacrée pour la région des dix villes.
- source_word: Ἱεροσολύμων
  choice: Jérusalem
  rationale: Forme française usuelle du nom de la ville; le pluriel morphologique grec n’est pas reproduit.
- source_word: Ἰουδαίας
  choice: la Judée
  rationale: Forme française usuelle du nom de cette région.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: d’au-delà du Jourdain
  rationale: Rend la désignation spatiale d’un territoire situé de l’autre côté du Jourdain, tout en préservant le rattachement de toute l’énumération à l’idée de provenance.
- source_word: καὶ ... καὶ ... καὶ
  choice: de ..., de ..., de ... et de ...
  rationale: L’énumération cumulative est conservée, avec une coordination française naturelle plutôt qu’une répétition lourde de « et ».
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit sans être archaïque. « Venant de » évite que la longue série de compléments soit comprise comme indiquant seulement les lieux parcourus pendant l’action de suivre.
