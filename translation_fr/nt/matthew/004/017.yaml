source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ὁ Ἰησοῦς κηρύσσειν καὶ λέγειν· Μετανοεῖτε, ἤγγικεν γὰρ ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/017.yaml
  text: From that time Jesus began to proclaim[a], saying, “Repent[c][b], for the kingdom of heaven has drawn near.”
translation:
  language: fr
  text: 'Dès lors, Jésus commença à proclamer : « Repentez-vous[a], car le royaume des cieux[b] s’est approché[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Changez de vie ». Le verbe grec désigne une réorientation de la pensée et de la conduite.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « le royaume des cieux ». Cette expression caractéristique de Matthieu peut aussi désigner le règne, c’est-à-dire l’exercice de l’autorité royale.
    reason: lexical_alternative
  - marker: c
    text: Ou « est proche ». Le parfait grec souligne que cette proximité est devenue effective et le demeure.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: Dès lors
  rationale: Cette expression française naturelle marque nettement le tournant narratif et le commencement d’une nouvelle phase du ministère de Jésus.
- source_word: ἤρξατο
  choice: commença
  rationale: Rend directement l’idée de commencement exprimée par le verbe grec et convient au registre narratif.
- source_word: κηρύσσειν καὶ λέγειν
  choice: 'à proclamer :'
  rationale: Le second infinitif introduit le contenu de la proclamation. En français, les deux verbes coordonnés seraient inutilement lourds ; les deux-points rendent clairement et naturellement leur relation.
- source_word: Μετανοεῖτε
  choice: Repentez-vous
  rationale: Le verbe appelle à une réorientation profonde de la pensée et de la conduite. « Repentez-vous » conserve cette portée morale et spirituelle sans la réduire à un simple changement d’opinion.
- source_word: ἤγγικεν
  choice: s’est approché
  rationale: Le parfait grec présente une proximité désormais advenue et toujours effective. Le passé composé français en préserve mieux la dynamique que le simple présent « est proche ».
- source_word: βασιλεία
  choice: royaume
  rationale: Le mot peut désigner aussi bien l’exercice de la royauté que le domaine royal. « Royaume » maintient cette amplitude et correspond à l’expression française reconnue dans Matthieu.
- source_word: τῶν οὐρανῶν
  choice: des cieux
  rationale: Le pluriel reproduit l’expression caractéristique de Matthieu tout en restant idiomatique dans la formule française « royaume des cieux ».
theological_decisions:
- issue: Portée de Μετανοεῖτε
  choice: Repentez-vous
  alternative: Changez de vie ; changez de manière de penser
  rationale: Le choix retenu laisse ensemble les dimensions intérieure, morale et pratique du retournement demandé, sans imposer une définition confessionnelle particulière.
- issue: Sens de βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  alternative: le règne des cieux ; le royaume du ciel
  rationale: Cette formulation conserve l’expression distinctive de Matthieu et laisse ouverte la nuance entre le règne royal de Dieu et le domaine où il s’exerce.
- issue: Valeur aspectuelle de ἤγγικεν
  choice: s’est approché
  alternative: est proche ; s’est fait proche
  rationale: Le parfait indique que la proximité du royaume est devenue une réalité et demeure actuelle. La traduction ne précise pas davantage la manière dont cette proximité doit être comprise.
translation_notes:
  register: Français international actuel, digne et accessible. « Dès lors » marque le tournant du récit ; les deux-points évitent la lourdeur d’un calque « proclamer et dire ». La formulation conserve le vocabulaire biblique reconnu tout en explicitant dans les notes les principales ambiguïtés lexicales et aspectuelles.
