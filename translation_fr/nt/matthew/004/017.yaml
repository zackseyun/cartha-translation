  naturalness: La formulation est naturelle, actuelle et d’un registre biblique sobre. « Repentez-vous » et « le royaume des cieux » sont établis et compréhensibles. La note a contient toutefois l’alternative elliptique et peu idiomatique « Changez profondément »; « s’est fait proche » dans la note c est également moins naturel que les autres formulations proposées.
