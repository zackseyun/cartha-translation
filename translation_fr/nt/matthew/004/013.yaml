  text: καὶ καταλιπὼν τὴν Ναζαρὰ ἐλθὼν κατῴκησεν εἰς Καφαρναοὺμ τὴν παραθαλασσίαν ἐν ὁρίοις Ζαβουλὼν καὶ Νεφθαλίμ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/013.yaml
  text: And leaving Nazara[a], he came and settled in Capernaum by the sea, in the region of Zebulun and Naphtali.
translation:
  language: fr
  text: Après avoir quitté Nazara[a], il vint s’installer à Capharnaüm, au bord de la mer, dans le territoire de Zabulon et de Nephtali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Nazara »; de nombreuses traductions françaises ont « Nazareth ».'
    reason: alternative_reading
lexical_decisions:
- source_word: καταλιπὼν
  choice: Après avoir quitté
  rationale: Le participe aoriste exprime une action antérieure au verbe principal; cette tournure française en rend clairement la succession.
- source_word: Ναζαρὰ
  choice: Nazara
  rationale: Cette forme translittère le nom grec propre à ce verset, Ναζαρά, sans le remplacer silencieusement par la forme française habituelle « Nazareth ».
- source_word: ἐλθὼν κατῴκησεν
  choice: il vint s’installer
  rationale: La formulation française naturelle conserve le mouvement exprimé par ἐλθών et la prise de résidence indiquée par κατῴκησεν.
- source_word: Καφαρναοὺμ
  choice: Capharnaüm
  rationale: Forme française traditionnelle et actuelle du nom de lieu grec Καφαρναούμ.
- source_word: τὴν παραθαλασσίαν
  choice: au bord de la mer
  rationale: L’adjectif décrit Capharnaüm comme située près de la mer; la tournure est claire et idiomatique en français.
- source_word: ἐν ὁρίοις
  choice: dans le territoire de
  rationale: Dans ce contexte géographique, ὅρια désigne les districts ou territoires associés à Zabulon et Nephtali; « territoire » conserve mieux cette nuance que le plus général « région ».
- source_word: Ζαβουλὼν
  choice: Zabulon
  rationale: Forme française biblique usuelle du nom tribal et territorial.
- source_word: Νεφθαλίμ
  choice: Nephtali
  rationale: Forme française usuelle du nom tribal et territorial, avec l’orthographe moderne sans accent initial.
