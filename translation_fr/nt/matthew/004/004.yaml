reference: Matthew 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Γέγραπται· Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ἄνθρωπος, ἀλλ’ ⸀ἐπὶ παντὶ ῥήματι ἐκπορευομένῳ διὰ στόματος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/004.yaml
  text: 'But he answered[a], “It is written: ‘Man will not live by bread alone[b], but by every word proceeding through the mouth of God.’”'
translation:
  language: fr
  text: 'Mais il répondit : « Il est écrit : “L’être humain[a] ne vivra pas seulement de pain, mais de toute parole qui sort de la bouche de Dieu[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « l’homme »; le singulier masculin grec a ici une valeur représentative et désigne l’être humain en général.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « à travers » ou « par la bouche de Dieu »; l’expression présente chaque parole comme prononcée par Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: il répondit
  rationale: Cette formulation française concise rend naturellement l’expression narrative « ayant répondu, il dit » sans en reproduire la redondance d’influence sémitique.
- source_word: Γέγραπται
  choice: Il est écrit
  rationale: Formule française consacrée pour introduire une citation de l’Écriture; elle convient au parfait passif grec et à la validité durable de l’écrit cité.
- source_word: ἄρτῳ μόνῳ
  choice: de pain seulement
  rationale: « Pain » conserve le sens concret de ἄρτος, tandis que « seulement » rend μόνῳ sans élargir le terme à toute nourriture.
- source_word: ζήσεται ὁ ἄνθρωπος
  choice: l’être humain ne vivra pas
  rationale: Le futur est rendu directement; dans cette maxime, ὁ ἄνθρωπος désigne de façon représentative tout être humain plutôt qu’un homme déterminé.
- source_word: παντὶ ῥήματι
  choice: de toute parole
  rationale: « Parole » désigne ici ce que Dieu prononce et s’accorde naturellement avec l’image de sa bouche.
- source_word: ἐκπορευομένῳ διὰ στόματος θεοῦ
  choice: qui sort de la bouche de Dieu
  rationale: Cette tournure française naturelle conserve le participe exprimant la sortie et l’image corporelle de la bouche divine; le grec emploie διά avec le génitif, littéralement « à travers/par la bouche ».
theological_decisions:
- issue: Valeur générique de ὁ ἄνθρωπος
  choice: l’être humain
  alternative: l’homme
  rationale: Le propos porte sur l’humanité en général. « L’être humain » rend explicitement cette portée représentative sans faire croire qu’il est uniquement question d’un individu masculin; une note conserve la forme plus littérale possible.
- issue: Autorité durable exprimée par Γέγραπται
  choice: Il est écrit
  alternative: Cela demeure écrit
  rationale: La formule reçue en français laisse entendre qu’un texte établi est toujours invoqué, sans ajouter une explicitation théologique au verset.
- issue: Image de la parole passant par la bouche de Dieu
  choice: qui sort de la bouche de Dieu
  alternative: qui passe par la bouche de Dieu
  rationale: « Sort de la bouche » est idiomatique et préserve l’image d’une parole divine prononcée. L’alternative reproduit plus directement διά, mais serait moins naturelle et pourrait suggérer que la parole vient d’une autre source.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation distingue les paroles de Jésus de la citation scripturaire. La formulation reste proche du grec tout en évitant les calques peu naturels.
