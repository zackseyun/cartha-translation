  text: Περιπατῶν δὲ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν δύο ἀδελφούς, Σίμωνα τὸν λεγόμενον Πέτρον καὶ Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ, βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/004/018.yaml
  text: As he was walking beside the Sea of Galilee[a], he saw two brothers, Simon who is called Peter and Andrew his brother, casting a net into the sea, for they were fishermen.
translation:
  language: fr
  text: Comme il marchait au bord de la mer de Galilée, il vit deux frères, Simon, appelé Pierre, et André, son frère, qui jetaient un filet[a] dans la mer, car ils étaient pêcheurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « filet à lancer » : le terme grec désigne un filet que l’on jetait pour pêcher.'
    reason: Précision lexicale sur ἀμφίβληστρον, sans ajouter de détail non explicite sur la forme du filet.
lexical_decisions:
- source_word: Περιπατῶν
  choice: Comme il marchait
  rationale: Le participe présent exprime une action en cours, contemporaine du verbe principal; cette tournure est naturelle en français narratif.
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: le long du lac de Galilée
  rationale: παρά avec l’accusatif situe ici le déplacement au bord de l’étendue d’eau. En français moderne, « lac de Galilée » rend clairement la réalité géographique désignée par θάλασσα.
- source_word: εἶδεν
  choice: il vit
  rationale: L’aoriste indicatif marque l’événement principal du récit; le passé simple convient au registre narratif digne.
- source_word: δύο ἀδελφούς
  choice: deux frères
  rationale: Le contexte nomme deux personnes de sexe masculin et précise leur lien familial.
- source_word: Σίμωνα τὸν λεγόμενον Πέτρον
  choice: Simon, appelé Pierre
  rationale: Le participe passif λεγόμενον est rendu de manière concise sans suggérer que Pierre est encore un autre personnage.
- source_word: Ἀνδρέαν τὸν ἀδελφὸν αὐτοῦ
  choice: André, son frère
  rationale: L’apposition grecque indique clairement qu’André est le frère de Simon.
- source_word: βάλλοντας ἀμφίβληστρον εἰς τὴν θάλασσαν
  choice: qui jetaient un filet dans le lac
  rationale: Le participe présent décrit leur activité au moment où Jésus les voit. « Filet » est naturel dans le texte, tandis que la note précise le type de filet.
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: car ils étaient pêcheurs
  rationale: γάρ introduit l’explication de leur geste; « pêcheurs » désigne naturellement leur métier.
