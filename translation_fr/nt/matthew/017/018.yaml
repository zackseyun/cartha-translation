id: MAT.17.18
reference: Matthew 17:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς, καὶ ἐξῆλθεν ἀπ’ αὐτοῦ τὸ δαιμόνιον· καὶ ἐθεραπεύθη ὁ παῖς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/018.yaml
  text: And Jesus rebuked it[a], and the demon came out of him; and the boy was healed from that hour.
translation:
  language: fr
  text: Alors Jésus le réprimanda, et le démon sortit de lui ; dès ce moment[a], le garçon fut guéri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à partir de cette heure-là ».'
    reason: La note conserve la tournure temporelle littérale du grec, tandis que le texte principal emploie l’expression française naturelle « dès ce moment ».
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: réprimanda
  rationale: Le verbe exprime une vive réprimande investie d’autorité. « Réprimanda » convient au contexte d’exorcisme sans réduire le geste à un simple commandement.
- source_word: αὐτῷ
  choice: le
  rationale: Le pronom grec peut grammaticalement renvoyer au garçon ou au démon. Le pronom français masculin « le » maintient cette possibilité formelle, tandis que la proposition suivante conduit naturellement à comprendre que Jésus s’adresse au démon.
- source_word: τὸ δαιμόνιον
  choice: le démon
  rationale: Traduction directe et courante de δαιμόνιον, sans introduire la formulation distincte « esprit impur ».
- source_word: ἐξῆλθεν ἀπ’ αὐτοῦ
  choice: sortit de lui
  rationale: Cette expression conserve l’image concrète de l’exorcisme et suit de près le grec dans un français naturel.
- source_word: ἐθεραπεύθη
  choice: fut guéri
  rationale: Le passif exprime le rétablissement du garçon. « Fut guéri » est précis, digne et n’enferme pas la guérison dans une catégorie strictement médicale.
- source_word: ὁ παῖς
  choice: le garçon
  rationale: Dans le contexte, παῖς désigne le fils du père mentionné dans le récit. « Garçon » est donc plus précis qu’« enfant » et exclut le sens contextuellement improbable de « serviteur ».
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: dès ce moment
  rationale: La formule indique que la guérison fut effective à partir de cet instant. « Dès ce moment » restitue naturellement cette valeur en français moderne ; la formulation plus littérale est signalée en note.
theological_decisions:
- issue: Référent de αὐτῷ dans la réprimande de Jésus
  choice: Maintien du pronom « le », compris contextuellement comme visant le démon
  alternative: Jésus aurait réprimandé le garçon
  rationale: La suite immédiate — le démon sort de lui — favorise nettement le démon comme destinataire de la réprimande. Employer le pronom plutôt que répéter « le démon » conserve toutefois la forme et la légère ambiguïté du grec.
translation_notes:
  register: Français international moderne, clair et digne. La coordination suit le rythme narratif grec sans lourdeur. Le passé simple convient au registre narratif biblique tout en restant immédiatement compréhensible.
