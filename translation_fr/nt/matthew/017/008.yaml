  text: ἐπάραντες δὲ τοὺς ὀφθαλμοὺς αὐτῶν οὐδένα εἶδον εἰ μὴ ⸀αὐτὸν Ἰησοῦν μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/008.yaml
  text: And lifting up their eyes[a], they saw no one except Jesus alone.
translation:
  language: fr
  text: Ils levèrent alors les yeux et ne virent personne, si ce n’est Jésus, lui seul.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec insiste sur l’exclusivité en employant à la fois un pronom (« lui ») et le mot « seul ».
    reason: lexical_emphasis
lexical_decisions:
- source_word: ἐπάραντες
  choice: ils levèrent
  rationale: Le participe aoriste exprime ici une action qui précède celle du verbe principal. La coordination en français restitue naturellement cette succession.
- source_word: δὲ
  choice: alors
  rationale: La particule assure une transition narrative légère; « alors » convient au déroulement de la scène sans lui donner une opposition absente du grec.
- source_word: τοὺς ὀφθαλμοὺς αὐτῶν
  choice: les yeux
  rationale: L’expression concrète « lever les yeux » est idiomatique en français; le sujet pluriel rend le possessif explicite superflu.
- source_word: οὐδένα εἶδον
  choice: ne virent personne
  rationale: Cette formulation simple et naturelle conserve la négation personnelle et le sens ordinaire de ὁράω.
- source_word: εἰ μὴ
  choice: si ce n’est
  rationale: Après la négation, l’expression introduit l’unique exception. « Si ce n’est » garde un registre digne et courant.
- source_word: αὐτὸν Ἰησοῦν μόνον
  choice: Jésus, lui seul
  rationale: « Lui seul » rend l’accumulation du pronom αὐτόν et de μόνον, tout en produisant une emphase naturelle en français.
theological_decisions:
- issue: Jésus est l’unique personne encore visible après la vision
  choice: si ce n’est Jésus, lui seul
  alternative: si ce n’est Jésus seul
  rationale: La formulation retenue préserve l’insistance du grec, qui associe le pronom αὐτόν à μόνον, sans tirer de cette scène une conclusion théologique supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. La construction reste accessible tout en conservant l’insistance finale du grec.
