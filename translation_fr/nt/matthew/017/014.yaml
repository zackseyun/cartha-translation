  text: Καὶ ⸀ἐλθόντων πρὸς τὸν ὄχλον προσῆλθεν αὐτῷ ἄνθρωπος γονυπετῶν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/014.yaml
  text: And when they came to the crowd[a], a man came up to him, kneeling before him[b],
translation:
  language: fr
  text: Lorsqu’ils arrivèrent auprès de la foule, un homme s’approcha de lui et se mit à genoux devant lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Lorsqu’
  rationale: La coordination grecque introduit ici la nouvelle scène. En français narratif, elle s’intègre naturellement à la proposition temporelle sans qu’il soit nécessaire d’ajouter « Et ».
- source_word: ἐλθόντων
  choice: ils arrivèrent
  rationale: Le participe aoriste au génitif pluriel forme un génitif absolu à valeur temporelle. « Lorsqu’ils arrivèrent » en restitue clairement le sens, tout en conservant le sujet pluriel implicite dans le contexte.
- source_word: πρὸς τὸν ὄχλον
  choice: auprès de la foule
  rationale: La préposition πρὸς exprime ici le mouvement vers la foule. « Auprès de la foule » est naturel dans ce contexte d’arrivée et ὄχλος désigne couramment une foule.
- source_word: προσῆλθεν αὐτῷ
  choice: s’approcha de lui
  rationale: Le verbe προσέρχομαι indique qu’on vient vers quelqu’un ou qu’on s’en approche. Cette formulation française rend explicitement ce mouvement vers Jésus sans ajouter d’interprétation.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Dans ce récit, le nom désigne un individu masculin précis. « Un homme » est donc exact et naturel.
- source_word: γονυπετῶν αὐτόν
  choice: se mit à genoux devant lui
  rationale: Le participe décrit l’homme prenant ou gardant une posture à genoux devant Jésus. Cette expression française actuelle restitue clairement le geste sans lui attribuer explicitement une signification cultuelle que le terme seul ne tranche pas.
theological_decisions:
- issue: Portée du geste exprimé par γονυπετῶν
  choice: se mit à genoux devant lui
  alternative: se prosterna devant lui
  rationale: Le grec décrit directement une posture à genoux, mais ne précise pas à lui seul si le geste constitue une adoration, une supplication ou une marque de respect. La traduction retenue préserve cette ouverture contextuelle.
- issue: Référence de ἄνθρωπος
  choice: un homme
  alternative: une personne
  rationale: Le référent narratif est un individu masculin précis. Le rendre par « un homme » respecte cette donnée sans en tirer de conclusion théologique plus large.
translation_notes:
  register: 'Français international moderne, clair et digne. La phrase conserve la progression du grec : arrivée auprès de la foule, approche de l’homme, puis geste à genoux. La répétition de « lui » maintient les pronoms du texte source et reste suffisamment naturelle en français.'
