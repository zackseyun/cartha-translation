source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ τὸ γένος οὐκ ἐκπορεύεται εἰ μὴ ἐν προσευχῇ καὶ νηστείᾳ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/021.yaml
  text: But[a] this kind does not come out except by prayer and fasting.
translation:
  language: fr
  text: Mais[a] ce genre de démon ne sort que par la prière et le jeûne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset est absent des plus anciens manuscrits grecs, notamment le Sinaïticus et le Vaticanus du IVe siècle, ainsi que d’anciennes traductions syriaques et coptes. Il figure cependant dans la tradition byzantine majoritaire, dans la tradition latine et dans la plupart des témoins syriaques. Il a probablement été ajouté par des copistes ultérieurs pour harmoniser ce passage avec Marc 9.29.
    reason: textual_critical
lexical_decisions:
- source_word: γένος
  choice: sorte de démon
  rationale: Dans ce contexte, γένος désigne une catégorie d’esprits mauvais. L’ajout explicatif « de démon » rend le référent clair en français sans imposer une classification plus précise que le contexte.
- source_word: ἐκπορεύεται
  choice: sort
  rationale: Le verbe évoque ici la sortie du démon hors de la personne affligée ; « sort » est l’expression française naturelle dans ce contexte d’expulsion.
- source_word: εἰ μὴ
  choice: ne… que
  rationale: La tournure restrictive française « ne… que » restitue naturellement la valeur exclusive de εἰ μὴ devant le moyen indiqué.
- source_word: προσευχῇ καὶ νηστείᾳ
  choice: par la prière et le jeûne
  rationale: La préposition ἐν exprime ici le moyen ou la pratique requise ; « par » est idiomatique et conserve les deux éléments coordonnés du texte byzantin.
theological_decisions:
- issue: Référent de « cette sorte »
  choice: Expliciter « de démon »
  alternative: « cette sorte » sans complément
  rationale: Le contexte immédiat concerne l’expulsion d’un démon. L’explicitation évite une formulation française obscure tout en maintenant la portée catégorielle de γένος.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’opposition initiale δέ par « Mais » et suit le texte grec byzantin fourni, tout en signalant clairement dans la note son statut textuel disputé.
