id: MAT.17.10
reference: Matthew 17:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν οἱ ⸀μαθηταὶ λέγοντες· Τί οὖν οἱ γραμματεῖς λέγουσιν ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/010.yaml
  text: And the disciples asked him, saying, “Why then do the scribes say that Elijah must come first?”
translation:
  language: fr
  text: 'Et les disciples lui demandèrent : « Pourquoi donc les spécialistes de la Loi disent-ils qu’Élie doit venir d’abord ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: demandèrent
  rationale: L’aoriste introduit ici une question directe. « Demandèrent » est naturel en français narratif et n’ajoute aucune nuance de contestation.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: L’article désigne le groupe déjà connu dans le contexte. Il n’est pas nécessaire d’ajouter « ses », absent du grec.
- source_word: λέγοντες
  choice: '[non rendu séparément]'
  rationale: En français actuel, la tournure littérale « demandèrent en disant » serait lourde et redondante. Les deux verbes grecs sont naturellement représentés par « demandèrent » suivi du discours direct.
- source_word: Τί οὖν
  choice: Pourquoi donc
  rationale: Dans la construction τί… λέγουσιν ὅτι, τί demande la raison de ce que disent les spécialistes de la Loi. « Pourquoi donc » restitue aussi la valeur connective de οὖν.
- source_word: οἱ γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Dans ce contexte, γραμματεῖς désigne les experts et interprètes reconnus de la Loi. Cette formulation moderne évite que « scribes » soit compris comme désignant de simples copistes.
- source_word: λέγουσιν ὅτι
  choice: disent-ils que
  rationale: Le présent grec exprime leur enseignement actuel ou habituel, et ὅτι introduit directement son contenu.
- source_word: Ἠλίαν
  choice: Élie
  rationale: Forme française traditionnelle et largement reconnue du nom biblique.
- source_word: δεῖ ἐλθεῖν
  choice: doit venir
  rationale: δεῖ marque une nécessité. « Doit venir » en conserve la force sans préciser ici la source de cette nécessité.
- source_word: πρῶτον
  choice: d’abord
  rationale: Le mot indique la priorité dans une séquence. « D’abord » est idiomatique en français et préserve cette relation temporelle.
theological_decisions:
- issue: Portée de la question des disciples au sujet de la venue d’Élie
  choice: Formuler la question sans indiquer si les disciples contestent l’enseignement des spécialistes de la Loi ou demandent seulement comment le comprendre.
  alternative: Une formulation plus interprétative pourrait suggérer leur scepticisme ou intégrer dès ce verset l’explication de Matthieu 17.11-13 et l’arrière-plan de Malachie.
  rationale: Le grec rapporte simplement leur question. La traduction doit conserver la tension narrative et théologique jusqu’à la réponse de Jésus dans les versets suivants.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe du discours direct est naturelle; « les spécialistes de la Loi » privilégie l’intelligibilité contemporaine tout en conservant la fonction historique du groupe.
