  text: καὶ ἀκούσαντες οἱ μαθηταὶ ἔπεσαν ἐπὶ πρόσωπον αὐτῶν καὶ ἐφοβήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/006.yaml
  text: And when the disciples heard it[c][b][a], they fell on their faces and were greatly afraid.
translation:
  language: fr
  text: Quand les disciples entendirent cela[a], ils tombèrent face contre terre et eurent très peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir entendu cela ». Le grec emploie un participe qui peut être rendu par une proposition temporelle ou par une tournure participiale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: quand … entendirent cela
  rationale: Le participe aoriste marque ici naturellement la circonstance temporelle. « Cela » reprend sans lourdeur la voix entendue au verset précédent, objet implicite en grec.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: Terme consacré et naturel dans le récit évangélique pour désigner les disciples de Jésus.
- source_word: ἔπεσαν
  choice: ils tombèrent
  rationale: Rend simplement l’aoriste de πίπτω sans ajouter l’idée qu’ils se seraient volontairement jetés au sol.
- source_word: ἐπὶ πρόσωπον αὐτῶν
  choice: face contre terre
  rationale: Expression française idiomatique décrivant clairement leur posture prosternée, tout en évitant le calque peu naturel « sur leur visage ».
- source_word: ἐφοβήθησαν σφόδρα
  choice: eurent très peur
  rationale: Formulation française directe et actuelle qui exprime à la fois la peur et son intensité, σφόδρα étant rendu par « très ».
theological_decisions:
- issue: Nature de la réaction des disciples à la voix divine
  choice: Décrire leur prosternation et leur peur intense sans qualifier davantage cette réaction.
  alternative: Présenter explicitement leur réaction comme un acte d’adoration ou, à l’inverse, comme de la terreur pure.
  rationale: Le grec rapporte leur posture et leur peur, mais ne précise pas si celle-ci relève surtout de l’adoration, de la terreur ou de la crainte révérencielle. La traduction maintient cette ouverture.
translation_notes:
  register: Français international moderne, simple et digne. « Face contre terre » est idiomatique; « eurent très peur » reste accessible tout en conservant explicitement l’intensité de σφόδρα.
