id: MAT.17.4
reference: Matthew 17:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν τῷ Ἰησοῦ· Κύριε, καλόν ἐστιν ἡμᾶς ὧδε εἶναι· εἰ θέλεις, ⸀ποιήσω ὧδε τρεῖς σκηνάς, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ ⸂Ἠλίᾳ μίαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/004.yaml
  text: 'Then Peter answered and said to Jesus[a], “Lord, it is good for us to be here. If you wish, I will make three shelters here: one for you, one for Moses, and one for Elijah.”'
translation:
  language: fr
  text: 'Alors Pierre prit la parole et dit à Jésus : « Seigneur, il est bon que nous soyons ici. Si tu le veux, je dresserai ici trois abris[a] : un pour toi, un pour Moïse et un pour Élie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tentes », « huttes » ou « tabernacles »; le grec skēnas désigne des abris temporaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν
  choice: Alors Pierre prit la parole et dit
  rationale: La formule grecque « ayant répondu, Pierre dit » est idiomatique. « Prit la parole et dit » conserve l’introduction solennelle du discours sans laisser entendre qu’une question explicite venait d’être posée; « alors » rend ici la progression narrative marquée par δέ.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » préserve à la fois l’adresse respectueuse et la possible portée théologique de κύριος.
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: il est bon que nous soyons ici
  rationale: Formulation française naturelle qui suit de près la construction infinitive grecque et conserve l’évaluation positive exprimée par καλόν.
- source_word: εἰ θέλεις
  choice: Si tu le veux
  rationale: Rend naturellement le désir ou la volonté exprimés par θέλω, dans une adresse respectueuse à Jésus.
- source_word: ποιήσω
  choice: je dresserai
  rationale: Pour des structures temporaires, « dresser » est plus idiomatique en français que « faire » et n’impose pas l’idée de constructions durables.
- source_word: σκηνάς
  choice: abris
  rationale: « Abris » est clair, actuel et suffisamment large pour désigner des structures temporaires. Les équivalents susceptibles d’évoquer plus directement la fête des Tentes sont conservés en note.
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: un pour toi, un pour Moïse et un pour Élie
  rationale: La répétition de « un » conserve l’accent distributif de μίαν pour chacune des trois personnes.
- source_word: ὧδε
  choice: ici
  rationale: Les deux occurrences grecques sont rendues par « ici », ce qui préserve la répétition et l’insistance sur le lieu.
theological_decisions:
- issue: Traduction de κύριος dans l’adresse à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » maintient l’éventail sémantique du titre, de l’adresse respectueuse à une portée christologique possible, sans trancher cette tension.
- issue: Désignation des σκηναί lors de la transfiguration
  choice: abris
  alternative: tentes, huttes ou tabernacles
  rationale: Le verset n’établit pas explicitement un lien avec la fête des Tentes. Le texte principal reste donc neutre, tandis que la note conserve les possibilités lexicales et leurs éventuelles résonances bibliques.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’usage courant dans les traductions bibliques françaises pour les échanges directs. La formulation conserve les deux occurrences de « ici » ainsi que la structure ternaire de la proposition de Pierre.
