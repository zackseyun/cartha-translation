id: MAT.17.3
reference: Matthew 17:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ὤφθη αὐτοῖς Μωϋσῆς καὶ Ἠλίας ⸂συλλαλοῦντες μετ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/003.yaml
  text: And behold[a], Moses and Elijah appeared to them, talking with him.
translation:
  language: fr
  text: Et voici que Moïse et Élie leur apparurent[a], en train de parler avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « furent vus par eux ». Le verbe grec est grammaticalement au passif, mais « leur apparurent » est plus naturel en français dans ce contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Cette tournure conserve la fonction d’appel à l’attention et l’effet de soudaineté de ἰδού, dans un français actuel mais digne.
- source_word: ὤφθη
  choice: apparurent
  rationale: L’aoriste passif de ὁράω peut ici exprimer idiomatiquement une manifestation visible. « Apparurent » est naturel en français et évite la lourdeur de « furent vus » tout en conservant cette autre possibilité en note.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif désigne ceux à qui Moïse et Élie deviennent visibles. Avec « apparaître », le pronom indirect « leur » rend naturellement cette relation.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française usuelle du nom biblique.
- source_word: Ἠλίας
  choice: Élie
  rationale: Forme française usuelle du nom biblique.
- source_word: συλλαλοῦντες
  choice: en train de parler
  rationale: Le participe désigne Moïse et Élie parlant avec Jésus au moment où ils apparaissent. La tournure rend clairement la simultanéité et le caractère réciproque de l’échange sans surinterpréter son contenu.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: μετά avec le génitif exprime l’association. Le pronom conserve la formulation grecque; dans le contexte, il renvoie clairement à Jésus.
theological_decisions:
- issue: Référent de αὐτοῦ
  choice: « lui » renvoie à Jésus
  alternative: Remplacer le pronom par « Jésus »
  rationale: Le contexte immédiat de la transfiguration identifie clairement Jésus comme référent. Garder le pronom respecte la formulation grecque sans créer d’obscurité réelle.
- issue: Nature de l’apparition de Moïse et d’Élie
  choice: Une manifestation visible, exprimée par « apparurent »
  alternative: « furent vus par eux »
  rationale: Le verset affirme que Moïse et Élie deviennent visibles aux disciples, sans préciser le mode de leur présence. La traduction n’ajoute aucune explication doctrinale.
translation_notes:
  register: Français international moderne, lisible et digne. « Et voici que » maintient la vivacité narrative de l’original; « en train de parler » exprime naturellement la simultanéité du participe grec.
