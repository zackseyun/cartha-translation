id: MAT.17.20
reference: Matthew 17:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀λέγει αὐτοῖς· Διὰ τὴν ⸀ὀλιγοπιστίαν ὑμῶν· ἀμὴν γὰρ λέγω ὑμῖν, ἐὰν ἔχητε πίστιν ὡς κόκκον σινάπεως, ἐρεῖτε τῷ ὄρει τούτῳ· ⸂Μετάβα ἔνθεν⸃ ἐκεῖ, καὶ μεταβήσεται, καὶ οὐδὲν ἀδυνατήσει ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/020.yaml
  text: But he says to them[a], “Because of your little faith. For truly I say to you, if you have faith like a mustard seed, you will say to this mountain, ‘Move from here to there,’ and it will move[c][b], and nothing will be impossible for you.”
translation:
  language: fr
  text: 'Mais il leur dit : « C’est parce que votre foi est insuffisante[a]. En vérité, je vous le dis, si vous avez une foi comme un grain de moutarde[b], vous direz à cette montagne : “Déplace-toi d’ici là-bas”, et elle se déplacera ; rien ne vous sera impossible. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause de votre peu de foi ». Le terme grec évoque une foi faible ou déficiente plutôt qu’une absence complète de foi.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une foi comme un grain de moutarde ». La comparaison évoque quelque chose de très petit.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: il leur dit
  rationale: Le présent historique grec donne de la vivacité au récit, mais le passé composé est ici la tournure narrative la plus naturelle en français moderne, sans changement de sens.
- source_word: Διὰ τὴν ὀλιγοπιστίαν ὑμῶν
  choice: C’est à cause de votre peu de foi
  rationale: ὀλιγοπιστία désigne une foi faible ou insuffisante, plutôt qu’une absence totale de foi. « Peu de foi » conserve cette nuance et fait écho au vocabulaire récurrent de Matthieu.
- source_word: ἀμὴν
  choice: En vérité
  rationale: Dans cette formule solennelle de Jésus, « En vérité » restitue naturellement en français la force assertive de ἀμήν.
- source_word: πίστιν
  choice: foi
  rationale: Dans ce contexte, πίστις désigne la confiance placée en Dieu et en sa puissance. « Foi » reste le terme français courant et théologiquement non restrictif.
- source_word: ὡς κόκκον σινάπεως
  choice: comme une graine de moutarde
  rationale: Cette formulation naturelle conserve la comparaison grecque et son évocation de quelque chose de très petit.
- source_word: Μετάβα ἔνθεν ἐκεῖ
  choice: Déplace-toi d’ici jusque-là
  rationale: L’impératif de μεταβαίνω exprime ici un changement de lieu. « Déplace-toi » convient à l’adresse faite à une montagne, tandis que « jusque-là » rend clairement le point d’arrivée.
- source_word: μεταβήσεται
  choice: elle se déplacera
  rationale: 'Le futur est intransitif : la montagne change de place. La forme pronominale française exprime ce mouvement sans suggérer explicitement un agent extérieur.'
- source_word: οὐδὲν ἀδυνατήσει ὑμῖν
  choice: Rien ne vous sera impossible
  rationale: Cette formulation idiomatique et directe restitue fidèlement l’idée que rien ne se révélera impossible pour eux.
theological_decisions:
- issue: Sens de πίστις dans un contexte de miracle
  choice: foi
  alternative: confiance
  rationale: Le contexte vise la confiance insuffisante des disciples en la puissance de Dieu. « Foi » préserve le terme traditionnel sans transformer cette parole en définition de la foi salvatrice ni lui imposer une lecture confessionnelle particulière.
- issue: Portée de l’image de la graine de moutarde
  choice: Conserver l’image sans expliquer dans le corps du texte le mécanisme de la foi
  alternative: Paraphraser en « une foi même minuscule »
  rationale: Le grec formule une comparaison imagée et laisse subsister une tension entre le « peu de foi » reproché et la très petite graine évoquée. La traduction ne doit pas résoudre cette tension en faisant de la quantité de foi l’unique interprétation possible.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste direct et solennel. « Mais » représente le faible connecteur δέ tout en marquant la réponse de Jésus; les phrases finales sont séparées pour éviter une coordination trop lourde en français.
