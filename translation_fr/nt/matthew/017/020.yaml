revisions:
- from: 'Mais il leur dit : « C’est à cause de votre peu de foi[a]. En vérité, je vous le dis, si vous avez de la foi comme une graine de moutarde[b], vous direz à cette montagne : “Déplace-toi d’ici jusque-là”, et elle se déplacera. Rien ne vous sera impossible. »'
  to: 'Mais il leur dit : « C’est parce que votre foi est insuffisante[a]. En vérité, je vous le dis, si vous avez une foi comme un grain de moutarde[b], vous direz à cette montagne : “Déplace-toi d’ici là-bas”, et elle se déplacera ; rien ne vous sera impossible. »'
  rationale: La révision améliore l’idiomaticité sans modifier le sens ni résoudre de façon interprétative la tension de l’image. Elle conserve le présent narratif, la force solennelle de « En vérité, je vous le dis », et la portée générale de la dernière proposition.
