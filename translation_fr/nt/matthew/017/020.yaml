review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est fidèlement conservé : Jésus attribue l’échec à l’ὀλιγοπιστία des disciples, puis énonce la comparaison avec le grain de moutarde, l’ordre donné à la montagne et la promesse finale. « Mais » est une représentation recevable de δέ, sans imposer une opposition forte.'
  naturalness: « Votre peu de foi » et « de la foi comme une graine de moutarde » sont compréhensibles, mais peu idiomatiques en français international moderne. « Votre foi insuffisante » et « une foi comme un grain de moutarde » sont plus naturels tout en conservant la nuance de petitesse ou d’insuffisance. « D’ici jusque-là » peut sembler vague ou temporel ; « d’ici là-bas » rend plus directement ἔνθεν ἐκεῖ.
  terminology: « Foi », « En vérité », « montagne » et « impossible » conviennent au registre biblique moderne et ne surinterprètent pas le passage. « Grain de moutarde » est l’expression française usuelle pour κόκκος σινάπεως.
  issues:
  - severity: medium
    issue: Formulation peu idiomatique de l’ὀλιγοπιστία
    rationale: « Votre peu de foi » est calqué et moins naturel que « votre foi insuffisante ». Cette dernière expression maintient l’idée d’une foi déficiente, non d’une incrédulité totale.
  - severity: low
    issue: Comparaison française maladroite
    rationale: « De la foi comme une graine de moutarde » est grammaticalement possible, mais « une foi comme un grain de moutarde » est plus fluide et plus usuel dans ce contexte.
  - severity: low
    issue: Destination de l’ordre à la montagne
    rationale: « Jusque-là » peut être compris temporellement ; « là-bas » exprime sans ambiguïté le lieu visé par ἐκεῖ.
