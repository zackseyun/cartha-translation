id: MAT.17.9
reference: Matthew 17:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων· Μηδενὶ εἴπητε τὸ ὅραμα ἕως οὗ ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ⸀ἐγερθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/009.yaml
  text: And as they were coming down from the mountain[a], Jesus commanded them, saying[b], “Tell the vision to no one until the Son of Man is raised from the dead.”
translation:
  language: fr
  text: 'Pendant qu’ils descendaient de la montagne, Jésus leur ordonna : « Ne parlez à personne de la vision[a] jusqu’à ce que le Fils de l’homme soit ressuscité d’entre les morts. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ce que vous avez vu ». Le grec dit littéralement « la vision ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβαινόντων αὐτῶν ἐκ τοῦ ὄρους
  choice: Pendant qu’ils descendaient de la montagne
  rationale: Le génitif absolu au participe présent exprime une action en cours et simultanée. Cette formulation est naturelle en français et conserve cette valeur temporelle.
- source_word: ἐνετείλατο αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: 'Jésus leur ordonna :'
  rationale: « Ordonner » restitue la force de ἐντέλλομαι. Les deux-points introduisent naturellement les paroles en français, sans reproduire lourdement le participe λέγων par « en disant ».
- source_word: Μηδενὶ εἴπητε
  choice: Ne parlez à personne
  rationale: La défense aoriste interdit de communiquer le contenu mentionné ensuite. La formulation est idiomatique tout en maintenant la négation et le destinataire indéfini.
- source_word: τὸ ὅραμα
  choice: la vision
  rationale: « Vision » rend directement ὅραμα et en conserve la possible nuance révélatrice, sans réduire l’expression au simple fait d’avoir vu quelque chose.
- source_word: ἕως οὗ
  choice: jusqu’à ce que
  rationale: Cette locution exprime clairement en français la limite temporelle de l’interdiction.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation traditionnelle traduit directement l’expression grecque et en préserve les résonances scripturaires et théologiques.
- source_word: ἐκ νεκρῶν ἐγερθῇ
  choice: soit ressuscité d’entre les morts
  rationale: « Soit ressuscité » conserve la voix passive tout en étant plus naturel et immédiatement compréhensible que « soit relevé » dans ce contexte. « D’entre les morts » rend explicitement ἐκ νεκρῶν.
theological_decisions:
- issue: Formulation et voix de la résurrection
  choice: soit ressuscité d’entre les morts
  alternative: ressuscite d’entre les morts
  rationale: Le grec emploie un passif. Le français passif préserve cette forme et laisse entendre l’action divine sans en nommer explicitement l’agent, conformément au texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe grecque est légèrement réorganisée pour une lecture naturelle, tandis que « la vision », « le Fils de l’homme » et la voix passive de la résurrection sont conservés.
