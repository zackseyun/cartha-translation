    issue: Rendu de μέν par « bien »
    rationale: Dans « Élie vient bien », « bien » sonne maladroit et ne marque pas clairement l’emphase assortie d’un contraste à venir. « Certes » est plus idiomatique et conserve cette fonction.
  - severity: medium
    issue: Alternative de note « Élie doit venir »
    rationale: « Doit » introduit une nuance de nécessité absente du présent grec. La note devrait seulement signaler la valeur future du présent, sans la paraphraser par une obligation.
