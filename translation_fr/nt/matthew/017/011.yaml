  text: ὁ ⸀δὲ ἀποκριθεὶς ⸀εἶπεν· Ἠλίας μὲν ⸀ἔρχεται καὶ ἀποκαταστήσει πάντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/011.yaml
  text: He answered[a], “Elijah indeed is coming and will restore all things.”
translation:
  language: fr
  text: 'Il répondit : « Élie vient, certes, et il rétablira toutes choses.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Élie vient et rétablira toutes choses. » Le présent grec traduit par « vient » a ici un sens orienté vers l’avenir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Il répondit
  rationale: La construction participiale suivie du verbe « dire » est une tournure grecque courante, influencée par l’usage sémitique. « Il répondit » en restitue naturellement la valeur responsive sans redondance.
- source_word: Ἠλίας
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: μέν
  choice: bien
  rationale: « Bien » marque ici l’affirmation et prépare le contraste développé au verset suivant, sans alourdir la phrase.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent grec a ici une orientation future. Le présent français « vient » conserve la vivacité et l’ambiguïté formelle du grec tout en pouvant exprimer une venue attendue.
- source_word: ἀποκαταστήσει
  choice: rétablira
  rationale: Le futur exprime directement une action à venir. « Rétablira » garde l’idée de restauration sans en préciser indûment la nature.
- source_word: πάντα
  choice: toutes choses
  rationale: Le neutre pluriel a une portée large. « Toutes choses » conserve cette ampleur et le registre solennel du propos sans introduire d’objet absent du texte.
theological_decisions:
- issue: Nature et étendue de l’œuvre de rétablissement d’Élie
  choice: « rétablira toutes choses »
  alternative: « remettra tout en ordre »
  rationale: Le grec formule le rétablissement de manière globale sans en définir ici la portée exacte. La traduction retenue préserve cette ouverture et évite de la réduire à un renouvellement spirituel, social ou eschatologique particulier.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et conserve l’articulation avec le contraste du verset suivant. Le marqueur de note [a] est placé après l’ensemble de la proposition à laquelle il se rapporte.
