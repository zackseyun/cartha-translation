id: MAT.17.1
reference: Matthew 17:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/001.yaml
  text: And after six days Jesus takes Peter[a], James, and John his brother[c][b], and leads them up onto a high mountain by themselves.
translation:
  language: fr
  text: Six jours plus tard, Jésus prend avec lui Pierre, Jacques et Jean, le frère de Jacques, et les fait monter sur une haute montagne, à l’écart.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ἓξ
  choice: Six jours plus tard
  rationale: Cette tournure française rend naturellement la succession temporelle exprimée par μετά avec l’accusatif, tout en maintenant le lien narratif avec ce qui précède.
- source_word: παραλαμβάνει
  choice: prend avec lui
  rationale: παραλαμβάνω signifie ici prendre quelqu’un avec soi. « Prend avec lui » exprime explicitement cet accompagnement et convient au français courant.
- source_word: Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: Pierre, Jacques et Jean
  rationale: Formes françaises traditionnelles et largement reconnues de ces noms bibliques.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: le frère de Jacques
  rationale: Dans la construction grecque, l’apposition qualifie Jean et le pronom renvoie naturellement à Jacques. Le nom est répété en français pour éviter l’ambiguïté artificielle que créerait « son frère ».
- source_word: ἀναφέρει
  choice: les conduit
  rationale: Le verbe désigne ici le fait de mener vers le haut. Avec « sur une haute montagne », l’idée d’ascension est clairement exprimée sans lourdeur.
- source_word: εἰς ὄρος ὑψηλὸν
  choice: sur une haute montagne
  rationale: Dans ce contexte de déplacement, εἰς indique la destination. « Sur une haute montagne » est idiomatique en français et implique l’ascension.
- source_word: κατ’ ἰδίαν
  choice: à l’écart
  rationale: L’expression indique qu’ils sont séparés des autres, en privé. « À l’écart » restitue ce sens naturellement sans suggérer que Jésus n’est pas avec les trois disciples.
theological_decisions:
- issue: Présents de narration dans le récit évangélique
  choice: 'Conserver le présent historique : « Jésus prend… et les conduit »'
  alternative: 'Employer le passé composé ou le passé simple : « Jésus a pris… et les a conduits » / « Jésus prit… et les conduisit »'
  rationale: Les verbes grecs παραλαμβάνει et ἀναφέρει sont au présent historique et donnent de la vivacité au récit. Le présent de narration est naturel en français moderne et permet de préserver cet effet.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le présent narratif grec. « À l’écart » est placé avant la destination pour une lecture fluide et pour rattacher naturellement l’idée de séparation à l’ensemble du déplacement.
