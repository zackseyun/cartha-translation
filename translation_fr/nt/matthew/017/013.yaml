id: MAT.17.13
reference: Matthew 17:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε συνῆκαν οἱ μαθηταὶ ὅτι περὶ Ἰωάννου τοῦ βαπτιστοῦ εἶπεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/013.yaml
  text: Then the disciples understood that he had spoken to them about John the Baptist[a].
translation:
  language: fr
  text: Alors les disciples comprirent qu’il leur avait parlé de Jean le Baptiste[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jean, celui qui baptise ».
    reason: Variante lexicale qui rend βαπτιστής comme une désignation fonctionnelle plutôt que par le titre français traditionnel.
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque, avec naturel dans le récit, le moment où les disciples parviennent à comprendre.
- source_word: συνῆκαν
  choice: comprirent
  rationale: L’aoriste de συνίημι exprime ici le fait de saisir le sens des paroles de Jésus; « comprirent » est direct et idiomatique.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: Désignation française courante et exacte des personnes qui suivent Jésus dans le récit évangélique.
- source_word: ὅτι
  choice: que
  rationale: Introduit le contenu de ce que les disciples ont compris, et non une proposition causale.
- source_word: περὶ
  choice: de
  rationale: Avec le génitif, περί indique le sujet des paroles; en français, « parler de quelqu’un » est la tournure la plus naturelle.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jean le Baptiste
  rationale: Forme française traditionnelle, largement comprise, du nom et du titre de Jean; « celui qui baptise » explicite davantage la fonction et figure en note comme variante lexicale.
- source_word: εἶπεν αὐτοῖς
  choice: il leur avait parlé
  rationale: Le plus-que-parfait rend naturellement l’antériorité des paroles de Jésus par rapport à la compréhension des disciples, sans ajouter de contenu au verbe grec.
theological_decisions:
- issue: Identification de la figure d’Élie dans le contexte immédiat
  choice: Le récit affirme que les disciples ont compris que Jésus parlait de Jean le Baptiste.
  alternative: Laisser le référent implicite ou développer le rapport entre Jean et Élie.
  rationale: Le verset identifie explicitement Jean comme le sujet des paroles de Jésus du point de vue narratif; la traduction le dit sans développer ni résoudre davantage les tensions théologiques du contexte.
translation_notes:
  register: Français international moderne, naturel et digne. « Alors » assure une transition narrative fluide; « Jean le Baptiste » conserve la désignation française reconnue, tandis que la note signale le sens fonctionnel du grec.
