id: MAT.17.27
reference: Matthew 17:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα δὲ μὴ σκανδαλίσωμεν αὐτούς, πορευθεὶς ⸀εἰς θάλασσαν βάλε ἄγκιστρον καὶ τὸν ⸀ἀναβάντα πρῶτον ἰχθὺν ἆρον, καὶ ἀνοίξας τὸ στόμα αὐτοῦ εὑρήσεις στατῆρα· ἐκεῖνον λαβὼν δὸς αὐτοῖς ἀντὶ ἐμοῦ καὶ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/027.yaml
  text: But so that we may not offend them[a], go to the sea, cast in a hook, and take the first fish that comes up. And when you open its mouth, you will find a stater[b]. Take that and give it to them for me and for yourself.
translation:
  language: fr
  text: Mais, pour ne pas les offenser[a], va à la mer, jette un hameçon et retire le premier poisson qui remontera. Ouvre-lui la bouche, et tu trouveras un statère[b]. Prends-le et donne-le-leur pour moi et pour toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les scandaliser » ; le verbe grec peut aussi signifier « faire trébucher » ou « devenir pour quelqu’un une occasion de chute ».
    reason: 'Alternative lexicale : dans ce contexte, « offenser » rend naturellement le sens pragmatique, sans épuiser la portée du verbe grec.'
  - marker: b
    text: Le statère était une pièce valant environ quatre drachmes, soit de quoi payer l’impôt du Temple pour deux personnes.
    reason: Note culturelle expliquant la monnaie ancienne et sa valeur dans ce contexte.
lexical_decisions:
- source_word: σκανδαλίσωμεν
  choice: scandaliser
  rationale: Dans ce contexte, le verbe désigne le fait de provoquer un mécontentement ou de devenir une occasion de chute. « Scandaliser » conserve cette amplitude sans laisser entendre que Jésus reconnaît par là une obligation absolue de payer.
- source_word: θάλασσαν
  choice: mer
  rationale: Le grec emploie le mot « mer ». Même si la mer de Galilée est géographiquement un lac, « mer » préserve la désignation du texte source.
- source_word: ἄγκιστρον
  choice: hameçon
  rationale: « Hameçon » est le terme français précis et naturel pour l’instrument de pêche désigné ici.
- source_word: ἀναβάντα πρῶτον ἰχθὺν
  choice: le premier poisson qui remontera
  rationale: Cette formulation naturelle décrit le premier poisson ramené de l’eau et rend clairement la succession annoncée des actions.
- source_word: ἆρον
  choice: prends
  rationale: Dans cette suite d’impératifs, le verbe signifie prendre ou retirer le poisson une fois qu’il a mordu.
- source_word: στατῆρα
  choice: un statère
  rationale: Le nom précis de la monnaie est conservé dans le texte, tandis que sa valeur approximative est expliquée en note.
- source_word: ἀντὶ ἐμοῦ καὶ σοῦ
  choice: pour moi et pour toi
  rationale: Ici, ἀντί indique que la pièce sert au paiement dû au nom des deux personnes. La formulation française est idiomatique et ne surcharge pas l’expression.
- source_word: δὸς αὐτοῖς
  choice: donne-le-leur
  rationale: Le pronom renvoie sans ambiguïté au statère; le contexte fiscal rend manifeste qu’il s’agit de le remettre comme paiement.
theological_decisions:
- issue: Sens de σκανδαλίζω dans la décision de payer l’impôt du Temple
  choice: Jésus ordonne le paiement afin de ne pas scandaliser les percepteurs, sans annuler l’affirmation précédente selon laquelle les fils sont libres.
  alternative: Comprendre ce paiement comme la reconnaissance d’une obligation absolue, ou uniquement comme une démonstration miraculeuse sans portée relationnelle.
  rationale: 'Le lien « mais, pour ne pas… » maintient la tension du contexte : la liberté affirmée aux versets précédents demeure, tandis que Jésus choisit une concession pratique pour éviter de devenir une occasion de scandale.'
translation_notes:
  register: Français international moderne, naturel et digne. Les impératifs directs conservent le mouvement du grec. « Statère » et « mer » maintiennent les termes du texte source, avec l’explication culturelle nécessaire en note.
