  verdict: revise
  source_fidelity: 'Le sens de l’énoncé est bien rendu : Pierre répond affirmativement, Jésus prend l’initiative en entrant dans la maison, et l’opposition entre les fils des rois et les personnes extérieures à leur famille est conservée. Toutefois, « droits de douane » restreint indûment τέλη, qui peut aussi viser des droits, péages ou taxes indirectes plus largement. « Impôt par tête » rend plus précisément κῆνσον que « impôt personnel ».'
  naturalness: Le français est globalement naturel et de registre approprié. « Jésus prit les devants et lui dit » exprime clairement l’initiative de Jésus. « Des autres » est possible dans cette opposition, mais la note doit bien en préciser la portée familiale plutôt qu’une simple altérité générale.
  terminology: « Rois de la terre » et « leurs propres fils » sont fidèles et naturels. La distinction fiscale doit être maintenue sans réduire τέλη aux seuls droits de douane ; « droits » et « impôt par tête » la rendent de manière claire et différenciée.
