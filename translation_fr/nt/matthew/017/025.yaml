reference: Matthew 17:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει· Ναί. καὶ ⸀ἐλθόντα εἰς τὴν οἰκίαν προέφθασεν αὐτὸν ὁ Ἰησοῦς λέγων· Τί σοι δοκεῖ, Σίμων; οἱ βασιλεῖς τῆς γῆς ἀπὸ τίνων λαμβάνουσιν τέλη ἢ κῆνσον; ἀπὸ τῶν υἱῶν αὐτῶν ἢ ἀπὸ τῶν ἀλλοτρίων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/025.yaml
  text: He said[a], “Yes.” And when he came into the house, Jesus spoke to him first, saying, “What do you think[b], Simon? From whom do the kings of the earth collect duties or poll tax—from their own sons or from others?”
translation:
  language: fr
  text: 'Il répondit : « Oui. » Lorsqu’il entra dans la maison, Jésus prit les devants et lui dit : « Qu’en penses-tu, Simon ? De qui les rois de la terre perçoivent-ils des droits ou un impôt par tête[a] : de leurs propres fils ou des autres[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des taxes ou un tribut ». Le grec distingue τέλη, des droits, péages ou taxes indirectes, de κῆνσον, un impôt par tête ou tribut fiscal.
    reason: lexical_alternative
  - marker: b
    text: Ou « des étrangers ». Le grec désigne ceux qui ne sont pas de leur propre famille, c’est-à-dire des personnes extérieures à celle-ci.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Oui
  rationale: Réponse affirmative simple et naturelle en français moderne.
- source_word: ἐλθόντα εἰς τὴν οἰκίαν
  choice: Lorsqu’il entra dans la maison
  rationale: Le participe à l’accusatif se rapporte à Pierre, objet sous-entendu de προέφθασεν ; une proposition temporelle restitue clairement la construction.
- source_word: προέφθασεν αὐτὸν
  choice: Jésus prit les devants et lui dit
  rationale: Dans ce contexte, le verbe indique que Jésus intervient avant que Pierre ne parle. Cette formulation française conserve l’idée d’initiative et d’antériorité.
- source_word: Τί σοι δοκεῖ
  choice: Qu’en penses-tu
  rationale: Expression idiomatique naturelle qui sollicite le jugement de Simon.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: les rois de la terre
  rationale: Traduction directe qui ne restreint pas γῆ à un territoire particulier.
- source_word: τέλη
  choice: les droits de douane
  rationale: Le terme désigne des taxes indirectes, notamment des droits ou péages ; ce choix le distingue nettement de κῆνσον.
- source_word: κῆνσον
  choice: l’impôt personnel
  rationale: Le terme désigne un impôt direct imposé aux personnes, souvent compris comme une capitation ou un tribut fiscal ; la formulation reste accessible en français courant.
- source_word: υἱῶν αὐτῶν
  choice: leurs propres fils
  rationale: Conserve le sens précis de υἱοί et souligne l’opposition familiale avec ceux qui ne sont pas de la maison royale.
- source_word: ἀλλοτρίων
  choice: des autres
  rationale: Désigne ici ceux qui ne sont pas les fils des rois, autrement dit les personnes extérieures à leur famille ; « des autres » est concis et naturel, tandis que la note explicite la nuance.
theological_decisions:
- issue: Portée théologique possible de « fils » dans l’analogie de Jésus
  choice: Conserver « leurs propres fils » sans développer dans le texte l’implication christologique.
  alternative: leurs enfants ; leurs sujets
  rationale: L’image immédiate repose sur l’exemption de la famille du roi et prépare l’implication théologique du verset suivant. La traduction préserve cette tension sans l’interpréter à la place du lecteur.
translation_notes:
  register: Français international moderne, naturel et digne. « Prit les devants » rend l’initiative de Jésus avant que Pierre ne parle. Les marqueurs de note sont placés sur les expressions qu’ils expliquent.
