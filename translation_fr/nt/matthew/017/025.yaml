  - severity: low
    issue: κῆνσον est traduit par « impôt personnel ».
    rationale: Cette expression reste compréhensible, mais peut évoquer diversement un impôt individuel. « Impôt par tête » indique plus nettement la capitation ou taxe de recensement visée par κῆνσος.
