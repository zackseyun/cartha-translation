  to: 'Il répondit : « Oui. » Lorsqu’il entra dans la maison, Jésus prit les devants et lui dit : « Qu’en penses-tu, Simon ? De qui les rois de la terre perçoivent-ils des droits ou un impôt par tête[a] : de leurs propres fils ou des autres[b] ? »'
  rationale: La révision élargit « droits de douane » en « droits » afin de respecter l’étendue de τέλη, et remplace « impôt personnel » par « impôt par tête » afin de rendre plus exactement κῆνσον. Elle conserve la syntaxe, le registre et l’ambiguïté contrôlée de « des autres », explicitée par la note.
