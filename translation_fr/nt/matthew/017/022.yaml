id: MAT.17.22
reference: Matthew 17:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Συστρεφομένων δὲ αὐτῶν ἐν τῇ Γαλιλαίᾳ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μέλλει ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοσθαι εἰς χεῖρας ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/022.yaml
  text: While they were gathering together in Galilee[a], Jesus said to them[c][b], “The Son of Man is about to be delivered into the hands of men,”
translation:
  language: fr
  text: 'Comme ils se rassemblaient en Galilée[a], Jésus leur dit : « Le Fils de l’homme va être livré[b] aux mains des hommes[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme ils étaient réunis en Galilée ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « va être remis entre les mains des hommes ».'
    reason: lexical_alternative
  - marker: c
    text: Le mot grec traduit par « hommes » peut désigner les êtres humains en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: Συστρεφομένων
  choice: Comme ils se rassemblaient
  rationale: Le participe au génitif absolu décrit les disciples qui se regroupent ou se trouvent réunis. « Comme ils se rassemblaient » conserve le sens collectif sans préciser un déplacement que le grec n’impose pas.
- source_word: δὲ
  choice: Comme
  rationale: Avec le génitif absolu, la particule relie cette circonstance à la parole de Jésus. La tournure française « Comme… » rend naturellement ce lien circonstanciel.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: en Galilée
  rationale: Traduction locative directe, naturelle et suffisamment précise.
- source_word: εἶπεν αὐτοῖς
  choice: Jésus leur dit
  rationale: « Dire à eux » se rend idiomatiquement par « leur dire » en français, tout en conservant l’acte de parole simple du grec.
- source_word: Μέλλει
  choice: va
  rationale: Dans cette construction, μέλλω présente l’action comme imminente. « Va être » exprime clairement cette perspective sans introduire explicitement l’idée de destin.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Le Fils de l’homme
  rationale: Cette formulation reçue reste proche du grec et préserve les résonances scripturaires et théologiques du titre employé par Jésus.
- source_word: παραδίδοσθαι
  choice: être livré
  rationale: Le passif signifie être remis ou livré à d’autres. « Être livré » conserve le passif et n’identifie pas ici l’agent responsable, sans réduire le verbe au seul sens de « trahir ».
- source_word: εἰς χεῖρας
  choice: aux mains de
  rationale: Cette expression française garde la métaphore des mains et exprime naturellement le fait d’être placé au pouvoir d’autrui.
- source_word: ἀνθρώπων
  choice: des hommes
  rationale: « Des hommes » préserve la reprise lexicale entre « Fils de l’homme » et ἀνθρώπων ainsi que le contraste entre ce Fils et ceux aux mains desquels il sera livré. Ici, le pluriel désigne les êtres humains en général.
theological_decisions:
- issue: Traduction de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Le Fils de l’homme
  alternative: l’Être humain
  rationale: La traduction traditionnelle et formellement proche du grec conserve les échos intertextuels du titre dans les Évangiles. L’alternative expliciterait davantage un sens possible, mais atténuerait ces résonances.
- issue: Portée de παραδίδοσθαι dans l’annonce de la Passion
  choice: être livré
  alternative: être remis / être trahi
  rationale: « Être livré » maintient l’indétermination de l’agent dans le passif et laisse subsister les différentes dimensions humaines et théologiques de l’événement. « Être trahi » identifierait trop étroitement l’action à la trahison de Judas.
- issue: Sens de ἀνθρώπων après « le Fils de l’homme »
  choice: des hommes
  alternative: des humains
  rationale: Le choix principal préserve en français la répétition de « homme », présente dans les deux expressions grecques apparentées, sans exclure les femmes du sens générique du mot dans ce contexte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste proche de la structure grecque tout en employant l’ordre et les tournures idiomatiques du français. « Va être livré » est plus courant que « est sur le point d’être livré », tandis que « aux mains des hommes » conserve la métaphore et le contraste verbal du texte source.
