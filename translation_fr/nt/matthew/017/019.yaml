id: MAT.17.19
reference: Matthew 17:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ κατ’ ἰδίαν εἶπον· Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/019.yaml
  text: Then the disciples came to Jesus privately and said[a], “Why were we not able to cast it out?”
translation:
  language: fr
  text: 'Alors les disciples s’approchèrent de Jésus en privé et lui dirent : « Pourquoi n’avons-nous pas pu le[a] chasser ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom grec peut désigner le démon ou le garçon.
    reason: ambiguïté du référent
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession narrative introduite par cet adverbe temporel.
- source_word: προσελθόντες οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: les disciples s’approchèrent de Jésus
  rationale: Le participe aoriste est rendu par un verbe conjugué coordonné à la suite de la phrase; « s’approchèrent de » exprime précisément le mouvement vers Jésus.
- source_word: κατ’ ἰδίαν
  choice: en privé
  rationale: Expression française actuelle et concise pour une démarche faite à l’écart des autres.
- source_word: εἶπον
  choice: lui dirent
  rationale: Conserve le sens ordinaire de λέγω sans remplacer explicitement le verbe par « demandèrent », même si les paroles qui suivent forment une question.
- source_word: Διὰ τί ἡμεῖς οὐκ ἠδυνήθημεν
  choice: Pourquoi n’avons-nous pas pu
  rationale: Formulation interrogative naturelle qui exprime l’incapacité passée; le pronom « nous » correspond au pronom grec explicite.
- source_word: ἐκβαλεῖν
  choice: chasser
  rationale: Dans ce contexte d’exorcisme, « chasser » exprime clairement l’idée d’expulser et appartient au registre biblique français courant.
- source_word: αὐτό
  choice: le
  rationale: Le pronom français masculin peut renvoyer aussi bien au démon qu’au garçon et préserve ainsi naturellement l’ambiguïté du référent.
theological_decisions:
- issue: Référent de αὐτό dans le contexte de l’exorcisme
  choice: Conserver l’ambiguïté au moyen du pronom « le »
  alternative: Préciser « chasser le démon » ou « chasser le garçon »
  rationale: Le contexte favorise probablement le démon comme objet de l’expulsion, mais la forme grecque peut grammaticalement renvoyer au garçon. Le français permet de maintenir cette tension sans trancher.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec sans raideur, et la formulation interrogative convient au dialogue direct.
