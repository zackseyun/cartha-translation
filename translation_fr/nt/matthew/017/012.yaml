reference: Matthew 17:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι Ἠλίας ἤδη ἦλθεν, καὶ οὐκ ἐπέγνωσαν αὐτὸν ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν· οὕτως καὶ ὁ υἱὸς τοῦ ἀνθρώπου μέλλει πάσχειν ὑπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/012.yaml
  text: But I tell you that Elijah has already come[a], and they did not recognize him, but did to him whatever they wanted[c][b]. So also the Son of Man is about to suffer at their hands.
translation:
  language: fr
  text: 'Mais je vous le dis : Élie est déjà venu, et ils ne l’ont pas reconnu[a] ; mais ils lui ont fait tout ce qu’ils ont voulu[b]. De même, le Fils de l’homme va souffrir de leur part[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne l’ont pas identifié » ou « ils ne l’ont pas reconnu pour ce qu’il était ». Le verbe grec peut désigner le fait de ne pas discerner correctement son identité ou sa fonction.
    reason: lexical_alternative
  - marker: b
    text: Ou « ils l’ont traité comme ils l’ont voulu ». L’expression grecque évoque tout ce qu’ils se sont permis de lui faire.
    reason: lexical_alternative
  - marker: c
    text: Ou « est sur le point de souffrir ». Le grec présente cette souffrance comme prochaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mais je vous le dis
  rationale: Cette formulation naturelle conserve l’adresse directe et rend δέ par « mais », qui marque le contraste avec l’attente évoquée auparavant.
- source_word: Ἠλίας ἤδη ἦλθεν
  choice: Élie est déjà venu
  rationale: Le passé composé exprime naturellement en français une venue accomplie qui demeure pertinente dans le contexte ; ἤδη est rendu explicitement par « déjà ».
- source_word: οὐκ ἐπέγνωσαν αὐτόν
  choice: ils ne l’ont pas reconnu
  rationale: Dans ce contexte, ἐπιγινώσκω désigne surtout le fait de ne pas identifier correctement Élie ou sa fonction, plutôt qu’une simple absence de connaissance.
- source_word: ἀλλὰ ἐποίησαν ἐν αὐτῷ ὅσα ἠθέλησαν
  choice: au contraire, ils lui ont fait tout ce qu’ils ont voulu
  rationale: « Au contraire » fait ressortir l’opposition portée par ἀλλά. La tournure française rend l’expression idiomatique ποιέω ἐν appliquée à une personne et le caractère sans restriction de ὅσα ἠθέλησαν.
- source_word: οὕτως καὶ
  choice: De même
  rationale: Cette expression française marque clairement l’analogie entre ce qui est arrivé à Élie et ce qui arrivera au Fils de l’homme.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Traduction française établie du titre, qui en préserve les résonances bibliques sans l’interpréter davantage.
- source_word: μέλλει πάσχειν
  choice: va souffrir
  rationale: La périphrase avec « aller » exprime en français courant un événement à venir et imminent, sans introduire l’idée plus forte d’une nécessité ou d’un destin explicitement décrété.
- source_word: ὑπ’ αὐτῶν
  choice: de leur part
  rationale: Cette tournure indique clairement que ces mêmes personnes seront les agents hostiles de la souffrance, tout en restant naturelle en français.
theological_decisions:
- issue: Identification de la venue d’Élie
  choice: Conserver le nom « Élie » sans insérer dans ce verset l’identification à Jean le Baptiste.
  alternative: Paraphraser en nommant explicitement Jean le Baptiste comme l’Élie attendu.
  rationale: Le contexte immédiat fournit cette identification, mais le présent verset dit seulement « Élie ». La traduction préserve donc la formulation et laisse le contexte en préciser le référent.
- issue: Portée de μέλλει concernant la souffrance du Fils de l’homme
  choice: « va souffrir », pour exprimer une souffrance prochaine.
  alternative: « est destiné à souffrir », qui ferait davantage entendre une nécessité théologique.
  rationale: La construction grecque annonce ici une souffrance à venir, sans formuler explicitement dans cette proposition une nécessité divine. La traduction n’ajoute donc pas cette idée.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief l’opposition puis l’analogie. Les formulations restent proches du grec tout en évitant les calques peu naturels.
