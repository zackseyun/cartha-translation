  variant: modern international French
source:
  edition: SBLGNT
  text: ἔτι αὐτοῦ λαλοῦντος ἰδοὺ νεφέλη φωτεινὴ ἐπεσκίασεν αὐτούς, καὶ ἰδοὺ φωνὴ ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ἐν ᾧ εὐδόκησα· ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/005.yaml
  text: While he was still speaking[a], behold, a bright cloud overshadowed them, and behold, a voice from the cloud said, “This is my beloved Son, with whom I am well pleased[c][b]; listen to him.”
translation:
  language: fr
  text: 'Pendant qu’il parlait encore, voici[a] qu’une nuée lumineuse les couvrit de son ombre[b]. Et voici qu’une voix venant de la nuée dit : « Celui-ci est mon Fils bien-aimé, en qui j’ai pris plaisir. Écoutez-le[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie deux fois un marqueur d’attention rendu ici par « voici », ce qui accentue le caractère saisissant de la scène.
    reason: lexical_alternative
  - marker: b
    text: L’expression « couvrit de son ombre » peut évoquer le langage biblique des manifestations de la présence de Dieu.
    reason: cross_reference
  - marker: c
    text: Ou « Entendez-le ». L’impératif grec peut désigner une écoute qui prête attention et tient compte de ce qui est dit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Pendant qu’il parlait encore
  rationale: Le génitif absolu exprime une action simultanée, et ἔτι souligne que la parole est interrompue. Cette formulation est naturelle en français moderne.
- source_word: ἰδοὺ
  choice: voici
  rationale: Le marqueur attire l’attention et donne de la vivacité à la scène. Sa répétition dans le texte français reflète celle du grec.
- source_word: νεφέλη φωτεινὴ
  choice: une nuée lumineuse
  rationale: « Lumineuse » rend directement φωτεινή. « Nuée », plus élevé que « nuage » mais encore intelligible, convient au contexte biblique sans expliciter sa portée théologique.
- source_word: ἐπεσκίασεν
  choice: les couvrit de son ombre
  rationale: Cette expression rend l’image de ἐπισκιάζω dans un français naturel tout en conservant sa possible résonance théophanique.
- source_word: φωνὴ ἐκ τῆς νεφέλης λέγουσα
  choice: une voix venant de la nuée dit
  rationale: Le participe grec est rendu par un verbe conjugué, conformément à l’usage naturel du français, tandis que l’origine de la voix reste explicite.
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: mon Fils bien-aimé
  rationale: Cette formulation conserve à la fois la relation filiale et l’amour exprimé par ἀγαπητός, dans une langue digne et courante.
- source_word: ἐν ᾧ εὐδόκησα
  choice: en qui je prends plaisir
  rationale: La formule exprime l’approbation et le plaisir du Père sans ajouter d’explication doctrinale. Le présent français convient à la portée déclarative de l’aoriste grec.
- source_word: ἀκούετε αὐτοῦ
  choice: Écoutez-le !
  rationale: L’impératif appelle non seulement à entendre, mais à prêter attention et à tenir compte de ses paroles. « Écoutez-le » conserve cette force sans développer en « obéissez-lui ».
theological_decisions:
- issue: La déclaration divine sur l’identité de Jésus
  choice: Celui-ci est mon Fils bien-aimé, en qui je prends plaisir
  alternative: Celui-ci est mon Fils, le Bien-Aimé, en qui j’ai pris plaisir
  rationale: Le choix conserve l’identification directe de Jésus comme Fils ainsi que l’amour et l’approbation exprimés dans le grec, sans introduire de terminologie doctrinale absente du verset.
- issue: La force de ἀκούετε αὐτοῦ
  choice: Écoutez-le !
  alternative: Entendez-le !
  rationale: Dans ce contexte, le verbe implique une écoute attentive qui accueille la parole. La traduction évite aussi bien de réduire le sens à la perception auditive que de l’expliciter entièrement par « obéissez-lui ».
- issue: La portée de ἐπεσκίασεν
  choice: les couvrit de son ombre
  alternative: les enveloppa
  rationale: L’image de l’ombre est maintenue afin de ne pas effacer la possible évocation de la présence divine, tout en laissant cette résonance implicite.
translation_notes:
  register: Français international moderne, digne et accessible. « Nuée » et « voici » donnent au récit une légère élévation adaptée à une manifestation divine, sans archaïsme marqué. La répétition de « voici » et l’image de l’ombre sont conservées pour respecter la force narrative et les résonances du grec.
