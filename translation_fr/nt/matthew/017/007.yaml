  text: καὶ ⸂προσῆλθεν ὁ Ἰησοῦς καὶ ἁψάμενος αὐτῶν⸃ εἶπεν· Ἐγέρθητε καὶ μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/007.yaml
  text: And Jesus came near and touched them and said[a], “Get up[c][b], and do not be afraid.”
translation:
  language: fr
  text: 'Jésus s’approcha, les toucha et dit : « Relevez-vous et n’ayez pas peur. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθεν
  choice: s’approcha
  rationale: Le verbe προσέρχομαι exprime ici le mouvement de Jésus vers les disciples. « S’approcha » est naturel en français et conserve cette idée sans lourdeur.
- source_word: ἁψάμενος αὐτῶν
  choice: les toucha
  rationale: Le participe aoriste de ἅπτω avec le génitif signifie « toucher ». La coordination « les toucha » rend naturellement la succession des actions sans préciser, au-delà du grec, qu’il posa la main sur eux.
- source_word: εἶπεν
  choice: dit
  rationale: λέγω est le verbe ordinaire signifiant « dire » ; « dit » en est ici la traduction la plus directe.
- source_word: Ἐγέρθητε
  choice: Relevez-vous
  rationale: Dans le contexte immédiat, les disciples sont tombés face contre terre. « Relevez-vous » exprime clairement l’ordre de quitter cette position, sans imposer une posture finale plus précise.
- source_word: μὴ φοβεῖσθε
  choice: n’ayez pas peur
  rationale: Cette formulation moderne et naturelle rend l’interdiction de φοβέομαι sans imposer la nuance plus forte « cessez d’avoir peur », que le présent impératif ne requiert pas nécessairement ici.
- source_word: καὶ
  choice: alors / et
  rationale: Le premier καί est rendu par « Alors » pour assurer un enchaînement narratif naturel en français ; les suivants sont rendus par coordination, sans ajouter de relation causale.
theological_decisions:
- issue: Rendre l’ordre rassurant de Jésus sans ajouter de nuance pastorale ou doctrinale
  choice: « Relevez-vous et n’ayez pas peur. »
  alternative: « Levez-vous et ne craignez pas. »
  rationale: La formulation retenue conserve l’action physique demandée et la parole rassurante de Jésus dans un français actuel, sans amplifier ni expliquer théologiquement la scène.
translation_notes:
  register: 'Français moderne, digne et accessible. La syntaxe suit clairement la séquence : Jésus s’approche, touche les disciples, puis leur parle. « N’ayez pas peur » est préféré au plus littéraire « ne craignez pas ».'
