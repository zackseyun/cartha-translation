id: MAT.17.15
reference: Matthew 17:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ἐλέησόν μου τὸν υἱόν, ὅτι σεληνιάζεται καὶ κακῶς ⸀πάσχει, πολλάκις γὰρ πίπτει εἰς τὸ πῦρ καὶ πολλάκις εἰς τὸ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/015.yaml
  text: and saying[a], “Lord, have mercy on my son, because he is epileptic and suffers terribly; for he often falls into the fire and often into the water.”
translation:
  language: fr
  text: 'et dit : « Seigneur, aie pitié de mon fils, car il a des crises[a] et souffre terriblement. En effet, il tombe souvent dans le feu et souvent dans l’eau. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il est épileptique » ; littéralement, « il est frappé par la lune ». Le terme grec appartient à un idiome ancien désignant une affection caractérisée par des crises.
    reason: Alternative lexicale et explication de l’idiome grec.
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif respectueux adressé à Jésus; « Seigneur » conserve le titre courant et sa portée potentielle sans la préciser davantage.
- source_word: ἐλέησόν
  choice: aie pitié de
  rationale: Impératif exprimant un appel pressant à la compassion et au secours; tournure naturelle et digne en français.
- source_word: μου τὸν υἱόν
  choice: mon fils
  rationale: υἱός désigne précisément le fils, et le possessif est rendu naturellement.
- source_word: σεληνιάζεται
  choice: il a des crises
  rationale: Rend de façon phénoménologique l’affection évoquée par l’idiome grec lié à la lune, sans imposer un diagnostic médical moderne ni une causalité lunaire.
- source_word: κακῶς πάσχει
  choice: souffre terriblement
  rationale: Restitue l’intensité de κακῶς dans un français actuel et naturel.
- source_word: πολλάκις
  choice: souvent
  rationale: Équivalent français direct qui exprime la répétition; sa reprise conserve le parallélisme grec.
- source_word: πίπτει εἰς τὸ πῦρ
  choice: tombe dans le feu
  rationale: Rendu direct et idiomatique du mouvement vers le feu.
- source_word: εἰς τὸ ὕδωρ
  choice: dans l’eau
  rationale: Conserve le parallélisme avec « dans le feu » et rend naturellement l’article grec.
- source_word: καὶ λέγων
  choice: et dit
  rationale: Le participe présent dépend du récit précédent; le verbe conjugué constitue en français la liaison narrative la plus naturelle sans changer la relation syntaxique.
theological_decisions:
- issue: Interprétation de σεληνιάζεται dans un contexte de guérison et d’exorcisme
  choice: « il a des crises », description phénoménologique
  alternative: « il est épileptique » ou, littéralement, « il est frappé par la lune »
  rationale: Le père décrit ici l’état observable de son fils. Cette formulation évite à la fois un diagnostic médical moderne trop précis et l’affirmation d’une causalité lunaire, sans résoudre d’avance le rapport entre maladie et oppression spirituelle dans le contexte plus large.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination et la répétition de « souvent » préservent le rythme insistant du grec; le point remplace le point-virgule pour une lecture orale plus naturelle.
