  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσήνεγκα αὐτὸν τοῖς μαθηταῖς σου, καὶ οὐκ ἠδυνήθησαν αὐτὸν θεραπεῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/016.yaml
  text: And I brought him to your disciples[a], and they were not able to heal him.
translation:
  language: fr
  text: Je l’ai amené à tes disciples, et ils n’ont pas pu le guérir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσήνεγκα
  choice: j’ai amené
  rationale: Dans cette construction, προσφέρω signifie conduire ou amener quelqu’un auprès d’une autre personne. « J’ai amené » est naturel et précis en français moderne.
- source_word: μαθηταῖς σου
  choice: tes disciples
  rationale: Dans les Évangiles, μαθητής désigne les élèves et compagnons attachés à un maître. « Disciples » est le terme français courant dans ce contexte.
- source_word: οὐκ ἠδυνήθησαν
  choice: ils n’ont pas pu
  rationale: δύναμαι exprime ici la capacité. « Ils n’ont pas pu » rend directement cette incapacité et reste plus naturel que « ils n’ont pas été capables de ».
- source_word: θεραπεῦσαι
  choice: le guérir
  rationale: θεραπεύω désigne ici la guérison du garçon. « Guérir » convient au contexte sans préciser davantage la nature ou la cause de son mal.
- source_word: καὶ ... καὶ
  choice: Je… mais
  rationale: Le premier καί assure la continuité avec le récit précédent et n’a pas besoin d’être rendu isolément dans cet extrait français. Le second relie deux faits dont le rapport est naturellement contrastif en français ; « mais » exprime ce lien contextuel sans ajouter d’explication causale.
- source_word: αὐτόν
  choice: l’ / le
  rationale: Les deux occurrences du pronom renvoient au fils mentionné dans le contexte ; les pronoms français élidés ou compléments directs en donnent un équivalent clair.
theological_decisions:
- issue: Nature de l’échec des disciples
  choice: Énoncer simplement qu’ils n’ont pas pu guérir le garçon.
  alternative: Préciser qu’ils n’ont pas pu chasser le démon ou attribuer explicitement leur échec à un manque de foi.
  rationale: Le verset affirme seulement leur incapacité à le guérir. Les explications fournies par le contexte ne doivent pas être introduites dans cette phrase.
translation_notes:
  register: Français international moderne, simple et digne. La formulation privilégie une syntaxe orale naturelle tout en conservant le contenu précis du grec.
