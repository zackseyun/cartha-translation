id: MAT.17.24
reference: Matthew 17:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐλθόντων δὲ αὐτῶν εἰς Καφαρναοὺμ προσῆλθον οἱ τὰ δίδραχμα λαμβάνοντες τῷ Πέτρῳ καὶ εἶπαν· Ὁ διδάσκαλος ὑμῶν οὐ τελεῖ τὰ δίδραχμα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/024.yaml
  text: When they came to Capernaum[a], those who collected the two-drachma tax came to Peter and said[b], “Does your teacher not pay the two-drachma tax?”
translation:
  language: fr
  text: 'Lorsqu’ils arrivèrent à Capharnaüm, ceux qui percevaient l’impôt de deux drachmes[a][b] s’approchèrent de Pierre et lui demandèrent : « Votre maître ne paie-t-il pas l’impôt de deux drachmes ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les deux drachmes »; il s’agit de l’impôt de deux drachmes destiné au Temple.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « les collecteurs de l’impôt de deux drachmes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐλθόντων δὲ αὐτῶν
  choice: Lorsqu’ils arrivèrent
  rationale: Le génitif absolu exprime ici une circonstance temporelle. « Lorsqu’ils arrivèrent » est naturel en français et restitue cette valeur sans alourdir la transition; δέ n’exige pas de conjonction explicite.
- source_word: Καφαρναοὺμ
  choice: Capharnaüm
  rationale: Forme française traditionnelle et couramment reconnue du nom de lieu.
- source_word: προσῆλθον
  choice: s’approchèrent de
  rationale: Le verbe indique un mouvement vers Pierre. « S’approchèrent de » en rend précisément le sens dans un registre naturel.
- source_word: οἱ τὰ δίδραχμα λαμβάνοντες
  choice: ceux qui percevaient l’impôt de deux drachmes
  rationale: Le participe substantivé désigne ces personnes par leur fonction. Dans ce contexte, λαμβάνειν renvoie à la perception du montant exigé; « percevaient » convient au vocabulaire fiscal sans transformer le groupe en titre officiel.
- source_word: δίδραχμα
  choice: impôt de deux drachmes
  rationale: Le pluriel neutre désigne ici le versement de deux drachmes. La traduction explicite à la fois le montant et sa fonction contextuelle, tandis que la note précise qu’il s’agit de l’impôt du Temple.
- source_word: τῷ Πέτρῳ
  choice: de Pierre
  rationale: Avec « s’approcher », le datif grec se rend idiomatiquement en français par « de Pierre ».
- source_word: Ὁ διδάσκαλος ὑμῶν
  choice: votre maître
  rationale: διδάσκαλος signifie celui qui enseigne. Dans ce contexte de disciples parlant de Jésus, « maître » est le titre français naturel et conserve à la fois les notions d’enseignement et d’autorité, sans ajouter un titre doctrinal.
- source_word: οὐ τελεῖ
  choice: ne paie-t-il pas
  rationale: τελέω signifie ici acquitter une somme due. La question négative grecque, qui appelle vraisemblablement une réponse affirmative, est conservée sans en imposer explicitement la nuance pragmatique.
- source_word: εἶπαν
  choice: lui demandèrent
  rationale: Bien que le verbe signifie littéralement « dirent », il introduit ici une question directe; « demandèrent » en restitue naturellement la fonction en français.
theological_decisions:
- issue: Identification des δίδραχμα comme impôt plutôt que comme simples pièces
  choice: impôt de deux drachmes
  alternative: les didrachmes; les pièces de deux drachmes
  rationale: Le contexte porte sur l’acquittement d’un prélèvement, et non sur la simple réception de pièces. La note culturelle précise qu’il s’agit de l’impôt du Temple sans charger le texte principal d’une explication.
- issue: Force de la question négative οὐ τελεῖ
  choice: Votre maître ne paie-t-il pas… ?
  alternative: Votre maître paie bien…, n’est-ce pas ?
  rationale: La formulation retenue préserve la forme et la tension de la question grecque. Elle n’explicite pas excessivement l’attente probable d’une réponse positive.
translation_notes:
  register: Français international moderne, clair et digne. La phrase demeure proche de la structure grecque tout en employant une syntaxe idiomatique. « Impôt de deux drachmes » privilégie l’intelligibilité; « maître » correspond à l’usage narratif français pour le titre adressé à Jésus.
