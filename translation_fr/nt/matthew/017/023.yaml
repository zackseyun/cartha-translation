source:
  edition: SBLGNT
  text: καὶ ἀποκτενοῦσιν αὐτόν, καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθήσεται. καὶ ἐλυπήθησαν σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/023.yaml
  text: and they will kill him[a], and on the third day he will be raised. And they were deeply grieved.
translation:
  language: fr
  text: Ils le tueront et, le troisième jour, il sera ressuscité[a]. Ils furent profondément attristés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ressuscitera ». Le verbe grec est au passif : « il sera ressuscité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: ils le tueront
  rationale: Rend directement le futur actif et son complément, sans ajouter la nuance juridique de « mettre à mort » ni la qualification morale plus précise de « assassiner ».
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: le troisième jour
  rationale: Expression française naturelle pour le datif indiquant le moment où l’action aura lieu.
- source_word: ἐγερθήσεται
  choice: il sera ressuscité
  rationale: Conserve la voix passive du futur grec et convient au contexte d’un retour de la mort à la vie.
- source_word: ἐλυπήθησαν σφόδρα
  choice: les disciples furent profondément attristés
  rationale: « Profondément attristés » exprime naturellement l’intensité de σφόδρα; le sujet « les disciples », explicité d’après le contexte immédiat, évite en français une référence pronominale isolée et ambiguë.
- source_word: καὶ ... καὶ ... καὶ
  choice: et ... et ... Alors
  rationale: Les deux premiers « et » préservent l’enchaînement paratactique; « alors » marque naturellement en français la réaction qui suit, sans imposer une relation causale plus forte.
theological_decisions:
- issue: Voix du verbe dans l’annonce de la résurrection
  choice: il sera ressuscité
  alternative: il ressuscitera
  rationale: La forme grecque est passive. La traduction retenue préserve cette formulation et sa possible nuance d’action divine sans identifier explicitement l’agent.
translation_notes:
  register: Français moderne, courant et digne. La répétition initiale de « et » reflète la syntaxe grecque, tandis que la dernière proposition est formulée de manière idiomatique. « Ressuscité » est plus clair ici que le littéral « relevé ».
