    rationale: Le grec a simplement καί (« et »). « Alors » introduit plus explicitement une succession consécutive ; une nouvelle phrase avec « Ils » conserve mieux la sobriété de l’original.
  - severity: low
    issue: Ajout de « les disciples »
    rationale: Le sujet sous-entendu est identifiable par le contexte, mais le texte grec de ce verset ne le répète pas. « Ils » préserve la référence anaphorique sans ajout.
  - severity: low
    issue: Alternative de note « il se relèvera »
    rationale: Cette formulation peut évoquer un simple fait de se lever. « Il ressuscitera » est l’alternative française claire et attendue ; la note doit continuer à signaler le passif grec.
