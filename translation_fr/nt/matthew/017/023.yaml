  source_fidelity: 'Le sens principal est bien rendu : « ils le tueront », l’indication « le troisième jour » et le futur passif « il sera ressuscité » correspondent au grec. Toutefois, « Alors » interprète légèrement le simple καί, et l’explicitation de « les disciples » ajoute un référent qui n’est pas exprimé dans ce verset, même s’il est récupérable du contexte.'
  naturalness: « Il sera ressuscité » et « profondément attristés » sont naturels dans un registre biblique français moderne. Une coordination française moins calquée rend le verset plus fluide sans perdre l’enchaînement du grec.
  terminology: « Ressuscité » est le terme français établi et approprié. L’alternative de note « il se relèvera » est moins précise en français contemporain dans ce contexte ; « il ressuscitera » est l’alternative usuelle, tout en signalant que le grec emploie un passif.
  issues:
