id: MAT.17.2
reference: Matthew 17:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν, καὶ ἔλαμψεν τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, τὰ δὲ ἱμάτια αὐτοῦ ⸀ἐγένετο λευκὰ ὡς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/002.yaml
  text: And he was transfigured before them[a], and his face shone like the sun, and his clothes became white as the light.
translation:
  language: fr
  text: Il fut transfiguré devant eux[a] ; son visage resplendit comme le soleil, et ses vêtements devinrent blancs comme la lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fut transformé ».'
    reason: Alternative lexicale légitime pour μετεμορφώθη.
lexical_decisions:
- source_word: μετεμορφώθη
  choice: fut transfiguré
  rationale: L’aoriste passif exprime ici une transformation visible. « Fut transfiguré » est précis dans ce contexte de manifestation glorieuse et reste compréhensible en français biblique moderne.
- source_word: ἔμπροσθεν αὐτῶν
  choice: devant eux
  rationale: Cette expression spatiale indique simplement que l’événement se produit en leur présence, sous leurs yeux.
- source_word: ἔλαμψεν
  choice: resplendit
  rationale: Le verbe λάμπω signifie briller ou répandre de la lumière. « Resplendit » rend naturellement l’éclat intense suggéré par la comparaison avec le soleil, sans ajouter d’élément étranger au texte.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: son visage
  rationale: Dans ce contexte, πρόσωπον désigne le visage physique de Jésus.
- source_word: ὡς ὁ ἥλιος
  choice: comme le soleil
  rationale: ὡς introduit une comparaison directe, rendue idiomatiquement par « comme ».
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: ses vêtements
  rationale: ἱμάτια désigne de manière générale les vêtements ; ce choix est courant, digne et sans précision vestimentaire ajoutée.
- source_word: ἐγένετο λευκὰ
  choice: devinrent blancs
  rationale: La tournure décrit un changement d’état. L’accord français au pluriel rend naturellement le sujet neutre pluriel grec.
- source_word: ὡς τὸ φῶς
  choice: comme la lumière
  rationale: Cette formulation conserve la comparaison explicite ainsi que l’article de τὸ φῶς, sans réduire l’expression au simple adjectif « lumineux ».
theological_decisions:
- issue: Désignation de l’événement de la transfiguration
  choice: fut transfiguré
  alternative: fut transformé
  rationale: « Transfiguré » rend la transformation visible décrite par le contexte immédiat et respecte l’usage chrétien historique, sans préciser la nature métaphysique du changement au-delà de ce qu’affirme le verset.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. Le point-virgule allège la succession des propositions tout en préservant leur étroite unité.
