id: MAT.17.17
reference: Matthew 17:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ⸂μεθ’ ὑμῶν ἔσομαι⸃; ἕως πότε ἀνέξομαι ὑμῶν; φέρετέ μοι αὐτὸν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/017.yaml
  text: But Jesus answered[a], “O unbelieving and perverse generation[c][b], how long will I be with you? How long will I bear with you? Bring him here to me.”
translation:
  language: fr
  text: 'Mais Jésus répondit : « Ô génération incrédule[a] et dévoyée[b], jusqu’à quand serai-je avec vous ? Jusqu’à quand vous supporterai-je ? Amenez-le-moi ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans foi »; le terme grec peut aussi signifier « infidèle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « faussée », « pervertie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Mais Jésus répondit
  rationale: La tournure grecque « ayant répondu, il dit » est idiomatique; « répondit » suffit en français naturel. δέ marque ici une transition légèrement adversative, bien rendue par « Mais ».
- source_word: Ὦ γενεὰ
  choice: Ô génération
  rationale: « Ô » conserve la force solennelle de l’interpellation, tandis que « génération » maintient la portée collective et la résonance prophétique de γενεά.
- source_word: ἄπιστος
  choice: incrédule
  rationale: Dans le contexte immédiat du manque de foi, « incrédule » exprime directement l’absence de foi, tout en laissant en note l’autre valeur possible, « sans fidélité ».
- source_word: διεστραμμένη
  choice: dévoyée
  rationale: Le participe parfait passif décrit une condition faussée ou détournée. « Dévoyée » communique une distorsion morale dans un registre actuel et digne.
- source_word: ἕως πότε μεθ’ ὑμῶν ἔσομαι
  choice: jusqu’à quand serai-je avec vous ?
  rationale: Traduction directe de la question temporelle et du futur grec, sans préciser davantage la portée du reproche.
- source_word: ἕως πότε ἀνέξομαι ὑμῶν
  choice: jusqu’à quand vous supporterai-je ?
  rationale: ἀνέχομαι signifie ici endurer ou supporter. « Supporter » garde la vigueur du reproche sans adopter une tournure trop familière.
- source_word: φέρετέ μοι αὐτὸν ὧδε
  choice: Amenez-le-moi ici
  rationale: L’impératif commande que le garçon soit conduit auprès de Jésus; « amenez » est plus naturel que « apportez » pour une personne.
theological_decisions:
- issue: Sens de ἄπιστος dans le reproche de Jésus
  choice: incrédule
  alternative: sans foi / infidèle
  rationale: Le contexte porte sur un défaut de foi, mais le grec peut aussi évoquer le manque de fidélité. Le texte principal retient le sens contextuellement le plus immédiat et la note préserve l’ambiguïté.
- issue: Portée de διεστραμμένη
  choice: dévoyée
  alternative: faussée / pervertie
  rationale: « Dévoyée » exprime l’état moralement détourné du groupe sans réduire le terme à une catégorie doctrinale précise ni lui donner en français moderne une connotation principalement sexuelle.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. « Ô » est conservé en raison de la solennité de l’apostrophe; l’inversion dans les deux questions maintient un ton digne et incisif.
