id: MAT.17.26
reference: Matthew 17:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂εἰπόντος δέ⸃· Ἀπὸ τῶν ἀλλοτρίων, ἔφη αὐτῷ ὁ Ἰησοῦς· Ἄρα γε ἐλεύθεροί εἰσιν οἱ υἱοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/017/026.yaml
  text: When he said[a], “From strangers,” Jesus said to him[c][b], “Then the sons are free.”
translation:
  language: fr
  text: 'Quand il répondit : « Des autres[a] », Jésus lui dit : « Les fils sont donc libres[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Des étrangers ». Le grec désigne ceux qui ne font pas partie de la maisonnée du souverain, par opposition à ses propres fils.
    reason: lexical_alternative
  - marker: b
    text: Ou « Les fils sont donc exemptés ». Le grec dit plus littéralement « libres » ; dans ce contexte, cela signifie qu’ils ne sont pas tenus de payer l’impôt.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰπόντος δέ
  choice: Quand il répondit
  rationale: Le génitif absolu marque ici la circonstance temporelle; « répondit » convient naturellement puisque Pierre répond à la question du verset précédent.
- source_word: ἀπὸ τῶν ἀλλοτρίων
  choice: De ceux qui ne sont pas de la famille royale
  rationale: Dans l'analogie, le terme désigne ceux qui n'appartiennent pas à la maison du souverain, par opposition à ses fils. Cette formulation française rend le contraste relationnel sans suggérer principalement une nationalité étrangère.
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Formulation narrative française simple et proche du grec.
- source_word: Ἄρα γε
  choice: donc
  rationale: La particule introduit la conclusion logique tirée de la réponse de Pierre.
- source_word: ἐλεύθεροί
  choice: libres
  rationale: Le sens littéral et plus large est conservé; dans le contexte, cette liberté implique l'exemption de l'impôt.
- source_word: οἱ υἱοί
  choice: les fils
  rationale: Le grec dit explicitement « fils » et l'analogie porte sur les fils d'un roi; ce choix préserve aussi la portée de la filiation.
theological_decisions:
- issue: Portée de οἱ υἱοί dans l'analogie royale
  choice: les fils
  alternative: les enfants
  rationale: « Les fils » suit la forme masculine précise du texte et conserve le contraste juridique et familial de l'analogie sans en élargir silencieusement la portée.
- issue: Sens de la liberté dans le contexte de l'impôt
  choice: libres
  alternative: exemptés
  rationale: « Exemptés » expliciterait correctement l'implication immédiate, mais réduirait le champ sémantique de ἐλεύθεροι. « Libres » maintient à la fois l'application fiscale et la tension plus large liée à la filiation.
translation_notes:
  register: Français international moderne, naturel et digne. La périphrase « ceux qui ne sont pas de la famille royale » clarifie le contraste domestique propre à ἀλλότριοι tout en évitant le contresens possible de « étrangers » au sens national.
