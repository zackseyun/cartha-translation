source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῇ· Τί θέλεις; λέγει αὐτῷ· Εἰπὲ ἵνα καθίσωσιν οὗτοι οἱ δύο υἱοί μου εἷς ἐκ δεξιῶν ⸀σου καὶ εἷς ἐξ εὐωνύμων σου ἐν τῇ βασιλείᾳ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/021.yaml
  text: And he said to her[a], “What do you want?” She said to him, “Command that these two sons of mine may sit, one at your right and one at your left[c][b], in your kingdom.”
translation:
  language: fr
  text: 'Il lui dit : « Que veux-tu ? » Elle lui répondit : « Dis[a] que mes deux fils que voici siègent, l’un à ta droite et l’autre à ta gauche, dans ton royaume[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ordonne » ; le grec dit littéralement « Dis ». Dans ce contexte, la demande porte sur une parole qui fixerait cette attribution.
    reason: lexical_alternative
  - marker: b
    text: Ou « sous ton règne » ; le mot grec peut désigner un royaume, un règne ou l’exercice de l’autorité royale.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλεις
  choice: Que veux-tu ?
  rationale: Formulation directe et naturelle qui conserve la simplicité de la question grecque.
- source_word: Εἰπὲ
  choice: Ordonne[a]
  rationale: Le verbe signifie littéralement « dis », mais, devant la proposition introduite par ἵνα, la mère demande ici à Jésus de prononcer une décision ayant valeur d’autorité. « Ordonne » rend naturellement cette force contextuelle, tandis que la note préserve le sens lexical premier.
- source_word: ἵνα καθίσωσιν
  choice: que … siègent
  rationale: Le subjonctif français convient après « ordonne que ». « Siéger » exprime ici le fait d’occuper une place royale et honorifique, sans ajouter de précision eschatologique.
- source_word: οὗτοι οἱ δύο υἱοί μου
  choice: mes deux fils que voici
  rationale: Cette tournure française idiomatique rend à la fois le possessif μου et la valeur démonstrative de οὗτοι.
- source_word: εἷς ἐκ δεξιῶν σου καὶ εἷς ἐξ εὐωνύμων σου
  choice: l’un à ta droite et l’autre à ta gauche
  rationale: Rend clairement le parallélisme spatial et les places d’honneur de part et d’autre de Jésus.
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: dans ton royaume[b]
  rationale: « Royaume » est la traduction française naturelle et traditionnelle de βασιλεία dans ce contexte, tout en laissant ouverte la nuance dynamique de règne ou d’autorité royale.
theological_decisions:
- issue: Nature des places demandées par rapport à la royauté de Jésus
  choice: Présenter la demande comme celle de places d’honneur à la droite et à la gauche de Jésus dans son royaume.
  alternative: Préciser qu’il s’agit soit d’un royaume messianique terrestre, soit du royaume céleste accompli.
  rationale: Le grec ne détermine pas ici la phase ou la forme du royaume envisagée. La traduction conserve donc la portée royale de la demande sans imposer un cadre eschatologique particulier.
translation_notes:
  register: Français international moderne, courant et digne. Le dialogue reste direct ; « mes deux fils que voici » conserve le geste démonstratif implicite, et « siègent » convient au cadre royal sans devenir archaïque.
