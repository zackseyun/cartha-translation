id: MAT.20.30
reference: Matthew 20:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ δύο τυφλοὶ καθήμενοι παρὰ τὴν ὁδόν, ἀκούσαντες ὅτι Ἰησοῦς παράγει, ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/030.yaml
  text: And behold, two blind men sitting by the road, when they heard that Jesus was passing by, cried out, saying, “Lord, have mercy on us, Son of David.”
translation:
  language: fr
  text: 'Et voici que deux aveugles, assis au bord du chemin, entendirent que Jésus passait. Ils crièrent : « Seigneur, aie pitié de nous, Fils de David ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction du marqueur qui attire l’attention et donne de la vivacité au récit, dans un français naturel et digne.
- source_word: δύο τυφλοὶ
  choice: deux aveugles
  rationale: Le masculin pluriel désigne ici deux hommes précis. En français, « deux aveugles » est idiomatique et suffisamment explicite sans alourdir par « deux hommes aveugles ».
- source_word: καθήμενοι παρὰ τὴν ὁδόν
  choice: assis au bord du chemin
  rationale: Rend naturellement la posture et le lieu; « au bord du chemin » correspond bien à la scène narrative.
- source_word: ἀκούσαντες ὅτι Ἰησοῦς παράγει
  choice: entendirent que Jésus passait
  rationale: Le participe aoriste reçoit une valeur temporelle dans la narration. « Passait » exprime simplement le déplacement de Jésus à proximité.
- source_word: ἔκραξαν λέγοντες
  choice: Ils crièrent
  rationale: Le verbe « crier » conserve l’intensité de κράζω; le participe λέγοντες n’a pas besoin d’être reproduit par « en disant », peu naturel ici, puisque les paroles suivent directement.
- source_word: Κύριε
  choice: Seigneur
  rationale: Préserve l’adresse révérencieuse et sa portée potentiellement christologique, particulièrement en association avec le titre « Fils de David ».
- source_word: ἐλέησον ἡμᾶς
  choice: aie pitié de nous
  rationale: Formule française courante, directe et traditionnelle pour une demande pressante de compassion et de secours.
- source_word: υἱὸς Δαυίδ
  choice: Fils de David
  rationale: Conserve le titre davidique et sa résonance messianique plutôt que de le réduire à une simple indication généalogique.
theological_decisions:
- issue: Sens de κύριος dans l’adresse à Jésus
  choice: Seigneur
  alternative: Maître / Monsieur
  rationale: Le contexte associe κύριος à « Fils de David », ce qui donne à l’appel un poids révérencieux et messianique. « Seigneur » préserve cette portée sans préciser davantage la compréhension exacte des deux hommes.
- issue: Portée messianique de υἱὸς Δαυίδ
  choice: Fils de David
  alternative: descendant de David
  rationale: La formulation littérale conserve le titre reconnu dans Matthieu ainsi que ses dimensions dynastique et messianique.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase grecque est répartie en deux phrases françaises pour assurer une lecture fluide, sans perte de contenu. L’exclamation finale restitue l’intensité de l’appel.
