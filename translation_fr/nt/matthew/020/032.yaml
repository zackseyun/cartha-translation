id: MAT.20.32
reference: Matthew 20:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ στὰς ὁ Ἰησοῦς ἐφώνησεν αὐτοὺς καὶ εἶπεν· Τί θέλετε ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/032.yaml
  text: And Jesus stopped[a], called them, and said, “What do you want me to do for you?”
translation:
  language: fr
  text: 'Jésus s’arrêta, les appela et leur dit : « Que voulez-vous[a] que je fasse pour vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans un registre plus soutenu : « Que désirez-vous que je fasse pour vous ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: στὰς
  choice: s’arrêta
  rationale: Le participe aoriste de ἵστημι indique ici que Jésus interrompt sa marche avant d’appeler les deux hommes. « S’arrêta » est naturel et restitue clairement la progression du récit.
- source_word: ἐφώνησεν
  choice: les appela
  rationale: φωνέω signifie ici appeler quelqu’un, éventuellement en l’interpellant. « Les appela » convient au contexte et évite le registre trop administratif de « les convoqua ».
- source_word: αὐτούς
  choice: les
  rationale: Le pronom accusatif pluriel renvoie aux deux aveugles mentionnés dans le contexte immédiat.
- source_word: Τί θέλετε
  choice: Que voulez-vous
  rationale: Cette formulation directe et idiomatique rend fidèlement l’interrogatif Τί et le verbe θέλω, sans donner à la question une solennité absente du grec.
- source_word: ποιήσω ὑμῖν
  choice: que je fasse pour vous
  rationale: Le subjonctif ποιήσω complète θέλετε, tandis que le datif ὑμῖν a ici une valeur bénéficiaire. La construction française conserve naturellement cette relation.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Le nom propre est rendu selon l’usage français courant ; l’article grec devant le nom propre n’est pas reproduit.
theological_decisions:
- issue: Ton et portée de la question de Jésus
  choice: 'Une question directe et personnelle : « Que voulez-vous que je fasse pour vous ? »'
  alternative: 'Une formulation plus soutenue : « Que désirez-vous que je fasse pour vous ? »'
  rationale: Le grec exprime simplement la volonté des interlocuteurs. La formulation retenue préserve l’engagement personnel de Jésus sans ajouter de nuance doctrinale ni de solennité artificielle.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque ; la question reste directe et naturelle.
