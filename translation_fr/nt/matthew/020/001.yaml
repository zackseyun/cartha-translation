id: MAT.20.1
reference: Matthew 20:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁμοία γάρ ἐστιν ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐξῆλθεν ἅμα πρωῒ μισθώσασθαι ἐργάτας εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/001.yaml
  text: For the kingdom of heaven is like a man, a master of a house, who went out early in the morning to hire workers for his vineyard.
translation:
  language: fr
  text: En effet, le royaume des cieux ressemble à un maître de maison qui sortit de bon matin afin d’embaucher des ouvriers pour sa vigne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμοία γάρ ἐστιν
  choice: En effet, … ressemble à
  rationale: « En effet » rend le lien explicatif de γάρ avec le contexte précédent, tandis que « ressemble à » exprime naturellement la comparaison introduite par ὁμοία.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: un maître de maison
  rationale: οἰκοδεσπότης désigne le maître ou propriétaire d’une maisonnée. En français, ajouter « un homme » serait lourd et redondant, puisque ἀνθρώπῳ sert ici à introduire la personne caractérisée comme maître de maison.
- source_word: ἅμα πρωῒ
  choice: de bon matin
  rationale: Expression française naturelle indiquant qu’il sort très tôt le matin.
- source_word: μισθώσασθαι ἐργάτας
  choice: afin d’embaucher des ouvriers
  rationale: Le verbe implique l’engagement de travailleurs contre salaire; « embaucher » le communique clairement.
- source_word: ἀμπελῶνα
  choice: vigne
  rationale: Terme courant et exact pour un terrain planté de ceps, ici la propriété où les ouvriers doivent travailler.
theological_decisions:
- issue: Nature de la comparaison avec le royaume
  choice: « le royaume des cieux ressemble à un maître de maison »
  alternative: « le royaume des cieux est comparable à la situation d’un maître de maison »
  rationale: La formulation conserve la comparaison concise du grec sans préciser indûment si chaque détail du récit correspond directement au royaume.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le lien avec le contexte par « En effet » et évite le calque pesant « un homme, maître de maison ».
