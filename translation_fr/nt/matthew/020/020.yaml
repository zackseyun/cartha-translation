id: MAT.20.20
reference: Matthew 20:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε προσῆλθεν αὐτῷ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου μετὰ τῶν υἱῶν αὐτῆς προσκυνοῦσα καὶ αἰτοῦσά τι ⸀παρ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/020.yaml
  text: Then the mother of the sons of Zebedee came to him with her sons[a], bowing down and asking something from him.
translation:
  language: fr
  text: Alors la mère des fils de Zébédée s’approcha de lui avec ses fils, se prosterna devant lui[a] et lui demanda quelque chose.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi se traduire par « lui rendre hommage » ou « l’adorer » ; selon le contexte, il peut désigner le fait de se prosterner avec révérence, de rendre hommage ou d’adorer.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession des événements dans le récit.
- source_word: προσῆλθεν αὐτῷ
  choice: s’approcha de lui
  rationale: Rend explicitement le mouvement vers Jésus exprimé par προσέρχομαι avec le datif.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: la mère des fils de Zébédée
  rationale: Reproduit clairement l’identification relationnelle de la femme sans ajouter son nom.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: avec ses fils
  rationale: μετά suivi du génitif exprime ici l’accompagnement.
- source_word: προσκυνοῦσα
  choice: se prosterna devant lui
  rationale: Exprime le geste physique et révérencieux sans imposer dans le texte principal le sens théologique plus précis d’adoration.
- source_word: καὶ αἰτοῦσά τι παρ’ αὐτοῦ
  choice: et lui demanda quelque chose
  rationale: Rend αἰτέω et l’objet indéfini τι dans un français naturel; la construction avec le pronom indirect exprime que la demande s’adresse à Jésus.
theological_decisions:
- issue: Sens de προσκυνοῦσα à l’égard de Jésus
  choice: se prosterna devant lui
  alternative: l’adora; lui rendit hommage
  rationale: Le verbe προσκυνέω peut désigner une prosternation révérencieuse, un hommage ou l’adoration. Le contexte immédiat ne contraint pas à choisir exclusivement l’une de ces nuances; le texte principal conserve donc le geste visible et la note signale les lectures plus interprétatives.
translation_notes:
  register: Français international moderne, simple et digne. Les participes grecs ont été rendus par des verbes coordonnés pour assurer une lecture naturelle, tout en conservant la progression de l’action et l’ambiguïté de προσκυνέω.
