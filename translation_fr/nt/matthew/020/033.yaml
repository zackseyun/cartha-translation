lexical_decisions:
- source_word: λέγουσιν
  choice: Ils lui disent
  rationale: Le présent de narration grec est conservé par un présent français naturel et vivant dans le récit.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif marque le destinataire de la réponse et se rend naturellement par « lui ».
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif de κύριος exprime ici une adresse respectueuse à Jésus. « Seigneur » en préserve à la fois la dignité et la possible portée christologique, sans l’imposer pleinement.
- source_word: ἵνα ἀνοιγῶσιν
  choice: que … s’ouvrent
  rationale: Dans ce contexte de demande, la proposition introduite par ἵνα se rend idiomatiquement par « que » avec le subjonctif. La tournure pronominale française exprime naturellement l’ouverture des yeux tout en conservant le fait que les yeux subissent le changement.
- source_word: οἱ ὀφθαλμοὶ ἡμῶν
  choice: nos yeux
  rationale: L’article suivi du nom et du génitif possessif se rend naturellement en français par le déterminant possessif « nos ».
theological_decisions:
- issue: Valeur de κύριος dans l’adresse à Jésus
  choice: Seigneur
  alternative: Maître ; Monsieur
  rationale: « Seigneur » maintient la révérence et la portée potentiellement théologique du titre. Une simple formule de politesse reste lexicalement possible, ce que signale la note, sans réduire d’office le terme à cette seule valeur.
translation_notes:
  register: Français international moderne, digne et direct. Le présent narratif est maintenu. L’exclamation rend la force naturelle de cette demande brève, sans ajouter de contenu.
