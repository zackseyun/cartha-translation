  text: They said to him[a], “Lord, let our eyes be opened.”
translation:
  language: fr
  text: 'Ils lui disent : « Seigneur[a], que nos yeux s’ouvrent ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Maître » ; le terme grec peut aussi servir de formule d’adresse respectueuse.'
