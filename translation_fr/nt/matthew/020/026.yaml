id: MAT.20.26
reference: Matthew 20:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχ οὕτως ⸀ἔσται ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν μέγας γενέσθαι ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/026.yaml
  text: It shall not be so among you[a]. But whoever wants to become great among you shall be your servant,
translation:
  language: fr
  text: Il n’en sera pas ainsi parmi vous[a]. Mais quiconque veut devenir grand parmi vous sera votre serviteur,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il n’en est pas ainsi parmi vous. » Le grec emploie un verbe au futur (« sera »), qui peut exprimer comment les choses ne doivent pas se passer parmi les disciples de Jésus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ οὕτως ἔσται ἐν ὑμῖν
  choice: Il n’en sera pas ainsi parmi vous
  rationale: Le futur « sera » préserve la forme de ἔσται et la portée normative, tournée vers la manière dont la communauté des disciples doit se caractériser. « Parmi vous » rend naturellement ἐν ὑμῖν dans ce contexte relationnel.
- source_word: ἀλλ’ ὃς ἂν θέλῃ
  choice: Mais quiconque veut
  rationale: « Quiconque » exprime la portée indéfinie et générale de ὃς ἂν avec le subjonctif. « Veut » rend clairement la volonté exprimée par θέλῃ en français actuel.
- source_word: μέγας γενέσθαι
  choice: devenir grand
  rationale: « Devenir » conserve la valeur de changement contenue dans γενέσθαι, plutôt que de réduire l’expression à un simple état.
- source_word: ἔσται ὑμῶν διάκονος
  choice: sera votre serviteur
  rationale: Le futur « sera » suit ἔσται. Ici, διάκονος désigne une personne qui se met au service des autres ; « serviteur » évite de suggérer à tort la fonction ecclésiale plus tardive de diacre.
theological_decisions:
- issue: La nature de la grandeur parmi les disciples de Jésus
  choice: Présenter le service comme le renversement normatif des hiérarchies dominatrices, sans introduire une fonction ecclésiale ultérieure
  alternative: Traduire διάκονος par « diacre » ou remplacer l’image concrète du serviteur par une formulation abstraite sur l’humilité
  rationale: Dans le contexte, Jésus oppose le modèle de pouvoir des dirigeants des nations à celui qui doit régir ses disciples. « Serviteur » maintient cette opposition concrète sans institutionnaliser le terme.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur est maintenu dans les deux propositions ; « quiconque » convient au caractère général de la parole, et « serviteur » conserve l’image sociale sans connotation d’un office ecclésial précis.
