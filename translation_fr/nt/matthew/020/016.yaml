id: MAT.20.16
reference: Matthew 20:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως ἔσονται οἱ ἔσχατοι πρῶτοι καὶ οἱ πρῶτοι ⸀ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/016.yaml
  text: So the last will be first[a], and the first last.
translation:
  language: fr
  text: Ainsi[a], les derniers seront les premiers, et les premiers seront les derniers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est ainsi que les derniers seront les premiers, et les premiers seront les derniers. »'
    reason: Alternative rendant plus explicitement la valeur de manière ou de résultat de οὕτως.
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Introduit naturellement en français la conclusion ou l’application de la parabole, tout en conservant la valeur à la fois récapitulative et consécutive du grec.
- source_word: ἔσονται
  choice: seront
  rationale: Le futur de εἰμί se rend directement par le futur du verbe « être ».
- source_word: οἱ ἔσχατοι
  choice: les derniers
  rationale: L’adjectif grec substantivé désigne « ceux qui sont derniers ». La formulation concise préserve le parallélisme et n’impose pas une interprétation en termes de valeur sociale.
- source_word: πρῶτοι
  choice: les premiers
  rationale: Le français exige ici l’article dans cette construction. Le choix conserve l’opposition directe entre « derniers » et « premiers ».
- source_word: καὶ
  choice: et
  rationale: La coordination simple correspond au grec ; « mais » introduirait une nuance adversative qui n’est pas explicitement exprimée.
- source_word: οἱ πρῶτοι
  choice: les premiers
  rationale: L’adjectif substantivé est rendu parallèlement à « les derniers », afin de préserver la structure équilibrée de la sentence.
- source_word: ἔσχατοι
  choice: les derniers
  rationale: Le français emploie naturellement l’article dans cette proposition elliptique coordonnée. La répétition complète le renversement formulé dans la première proposition.
theological_decisions:
- issue: Portée du renversement énoncé
  choice: Conserver une formule brève de renversement sans préciser ce que recouvrent « derniers » et « premiers ».
  alternative: Interpréter explicitement la parole comme un renversement de statut social, de récompense parmi les disciples, d’ordre chronologique ou de salut.
  rationale: Le grec ne détermine pas à lui seul la nature exacte de ce renversement. Une traduction non interprétative préserve l’ambiguïté et la tension théologique de la sentence dans son contexte.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation conserve la concision proverbiale, le parallélisme antithétique et la répétition du texte grec.
