  yaml_path: translation/nt/matthew/020/017.yaml
  text: And as Jesus was going up to Jerusalem, he took the twelve disciples aside by themselves, and on the way he said to them,
translation:
  language: fr
  text: 'Comme Jésus montait à Jérusalem, il prit les douze disciples à part et, en chemin, leur dit :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνων
  choice: montait
  rationale: Le participe présent exprime une action en cours, contemporaine du verbe principal. « Montait » est naturel en français et conserve l’idée traditionnelle et géographique de montée vers Jérusalem.
- source_word: εἰς Ἱεροσόλυμα
  choice: à Jérusalem
  rationale: Avec un nom de ville et un verbe de déplacement, « à Jérusalem » est la formulation française idiomatique.
- source_word: παρέλαβεν
  choice: prit
  rationale: Le verbe signifie prendre avec soi. Avec « à part », « prit » rend naturellement l’action sans ajouter un mouvement absent du texte.
- source_word: τοὺς δώδεκα μαθητὰς
  choice: les douze disciples
  rationale: Cette formulation représente explicitement μαθητάς et conserve la désignation reconnue du groupe des Douze.
- source_word: κατ’ ἰδίαν
  choice: à part
  rationale: L’expression indique que Jésus les sépare des autres pour leur parler en privé. « À part » en restitue sobrement les dimensions spatiale et privée.
- source_word: ἐν τῇ ὁδῷ
  choice: en chemin
  rationale: Expression française naturelle qui maintient le cadre du déplacement.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: Rend directement le verbe ordinaire de parole et introduit naturellement les propos du verset suivant.
