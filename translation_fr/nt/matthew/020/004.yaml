source:
  edition: SBLGNT
  text: καὶ ἐκείνοις εἶπεν· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ἀμπελῶνα, καὶ ὃ ἐὰν ᾖ δίκαιον δώσω ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/004.yaml
  text: And he said to them[a], ‘You also go into the vineyard, and whatever is right I will give you.’
translation:
  language: fr
  text: 'Il leur dit : « Allez, vous aussi, dans la vigne, et je vous donnerai ce qui est juste[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est équitable » ou « ce qui est droit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκείνοις
  choice: leur
  rationale: Le datif pluriel renvoie aux ouvriers qui viennent d’être mentionnés. Le pronom « leur » est naturel et suffit dans le contexte.
- source_word: εἶπεν
  choice: Il dit
  rationale: Rendu narratif courant de λέγω, qui introduit directement les paroles sans en préciser davantage la force.
- source_word: Ὑπάγετε
  choice: Allez
  rationale: L’impératif pluriel exprime ici l’ordre simple de se rendre dans la vigne.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: 'Cette formulation garde l’accent inclusif : ces ouvriers sont envoyés comme les précédents.'
- source_word: ἀμπελῶνα
  choice: vigne
  rationale: « Vigne » est l’équivalent français usuel de ἀμπελών pour un terrain planté de ceps.
- source_word: ὃ ἐὰν ᾖ δίκαιον
  choice: ce qui est juste
  rationale: La proposition signifie « ce qui sera juste ». Cette formulation conserve la portée morale de δίκαιον sans la limiter à une notion juridique ni la réduire au sentiment subjectif d’équité.
- source_word: δώσω ὑμῖν
  choice: je vous donnerai
  rationale: Le grec emploie δίδωμι, « donner ». Malgré le contexte salarial, ce choix évite d’introduire explicitement le verbe « payer », absent du texte source.
theological_decisions:
- issue: Rendu de δίκαιον dans le contexte de la rémunération des ouvriers
  choice: juste
  alternative: équitable ; convenable
  rationale: « Juste » préserve la dimension éthique et objective du terme grec tout en laissant ouverte sa portée exacte dans la parabole. « Équitable » pourrait orienter davantage vers une conception moderne de l’égalité de traitement.
translation_notes:
  register: Français moderne, naturel et digne. L’ordre des mots est adapté à l’usage français tout en conservant l’insistance de « vous aussi ». Le deux-points et les guillemets français signalent clairement le discours direct.
