  source_fidelity: 'Le texte rend fidèlement les éléments grecs : ὄχλος (« la foule »), ἐπετίμησεν (« réprimanda »), la proposition finale ἵνα σιωπήσωσιν (« pour qu’ils se taisent »), l’intensif comparatif μεῖζον (« de plus belle »), et κράζω (« crièrent »). L’opposition marquée par les δύο δέ est bien conservée. « Seigneur », « aie pitié de nous » et « Fils de David » respectent le sens et la fonction des termes grecs, sans surinterprétation.'
