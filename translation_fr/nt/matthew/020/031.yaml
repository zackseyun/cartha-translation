id: MAT.20.31
reference: Matthew 20:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ὄχλος ἐπετίμησεν αὐτοῖς ἵνα σιωπήσωσιν· οἱ δὲ μεῖζον ⸀ἔκραξαν λέγοντες· ⸂Κύριε, ἐλέησον ἡμᾶς⸃, ⸀υἱὸς Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/031.yaml
  text: But the crowd rebuked them so that they would be silent[a]. Yet they cried out all the more, saying, “Lord, have mercy on us[b], Son of David.”
translation:
  language: fr
  text: 'Mais la foule les réprimanda pour qu’ils se taisent. Eux, cependant, crièrent de plus belle[a] : « Seigneur, aie pitié de nous, Fils de David[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « encore plus fort ». Le comparatif grec peut indiquer une intensité accrue en général ou, plus précisément, un volume plus élevé.'
    reason: lexical_alternative
  - marker: b
    text: « Fils de David » est un titre messianique, et non une simple indication d’ascendance.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ὄχλος
  choice: la foule
  rationale: « La foule » est le terme français courant qui correspond naturellement au groupe présent dans la scène.
- source_word: ἐπετίμησεν αὐτοῖς
  choice: les réprimanda
  rationale: Le verbe exprime une réprimande appuyée visant à faire cesser leur cri, sans qu’il soit nécessaire d’ajouter explicitement l’idée d’un ordre.
- source_word: ἵνα σιωπήσωσιν
  choice: pour qu’ils se taisent
  rationale: Cette formulation naturelle conserve la valeur de but de la proposition introduite par ἵνα.
- source_word: μεῖζον
  choice: de plus belle
  rationale: Employé adverbialement, le comparatif intensifie leur action. « De plus belle » exprime cette intensification sans la limiter nécessairement au seul volume sonore.
- source_word: ἔκραξαν
  choice: crièrent
  rationale: Le verbe κράζω désigne un cri puissant ou pressant ; « crièrent » en restitue ici sobrement la force.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve à la fois la valeur d’adresse respectueuse et la possible portée christologique du titre.
- source_word: ἐλέησον ἡμᾶς
  choice: aie pitié de nous
  rationale: Cette tournure française actuelle rend directement l’impératif et l’appel pressant à la compassion.
- source_word: υἱὸς Δαυίδ
  choice: Fils de David
  rationale: La formulation littérale préserve le titre royal et messianique, au lieu de le réduire à une simple indication de descendance.
theological_decisions:
- issue: Titre messianique appliqué à Jésus
  choice: Fils de David
  alternative: descendant de David
  rationale: Dans Matthieu, l’expression porte une valeur royale et messianique. La traduction littérale conserve cette portée sans l’expliciter davantage dans le corps du texte.
- issue: Sens de κύριος dans l’adresse à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » maintient l’ambivalence entre une adresse respectueuse et une confession susceptible d’avoir une portée christologique ; « Maître » restreindrait davantage le sens.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste entre la tentative de la foule de les réduire au silence et l’intensification de leur cri est maintenu. « De plus belle » préserve l’indétermination du comparatif grec, tandis que la note signale la lecture plus spécifiquement sonore.
