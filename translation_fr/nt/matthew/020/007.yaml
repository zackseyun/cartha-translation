  text: λέγουσιν αὐτῷ· Ὅτι οὐδεὶς ἡμᾶς ἐμισθώσατο. λέγει αὐτοῖς· Ὑπάγετε καὶ ὑμεῖς εἰς τὸν ⸀ἀμπελῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/007.yaml
  text: They said to him[a], “Because no one has hired us.” He says to them, “You also go into the vineyard.”
translation:
  language: fr
  text: 'Ils lui répondent : « Parce que personne ne nous a embauchés. » Il leur dit : « Allez, vous aussi, dans la vigne. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσιν
  choice: Ils lui répondent
  rationale: Le présent historique grec est rendu par un présent de narration, naturel en français. « Répondent » explicite la fonction de la parole dans cet échange sans en modifier le sens.
- source_word: Ὅτι
  choice: Parce que
  rationale: Dans ce contexte, ὅτι introduit la raison pour laquelle ils sont restés sans travailler; « parce que » restitue directement cette valeur explicative.
- source_word: οὐδεὶς
  choice: personne
  rationale: Équivalent français courant et exact de la négation portant sur toute personne.
- source_word: ἐμισθώσατο
  choice: ne nous a embauchés
  rationale: Le verbe désigne l'action d'engager des ouvriers contre rémunération. Le passé composé convient à une action passée dont le résultat demeure au moment où ils parlent.
- source_word: λέγει
  choice: Il leur dit
  rationale: Le présent historique grec est conservé par un présent de narration français, ce qui maintient la vivacité du récit.
- source_word: Ὑπάγετε
  choice: Allez
  rationale: Impératif français direct et naturel correspondant à l'ordre de se rendre au lieu de travail.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: Cette formulation conserve l'idée que ce groupe est inclus avec ceux qui ont déjà été envoyés.
- source_word: ἀμπελῶνα
  choice: vigne
  rationale: En français biblique et courant, « la vigne » désigne naturellement le terrain planté de ceps; « vignoble » serait également possible, mais moins directement harmonisé avec l'usage narratif du passage.
