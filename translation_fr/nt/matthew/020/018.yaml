id: MAT.20.18
reference: Matthew 20:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/018.yaml
  text: Look[a], we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and scribes, and they will condemn him to death[c][b],
translation:
  language: fr
  text: '« Voici : nous montons à Jérusalem. Le Fils de l’homme[a] sera livré[b] aux grands prêtres et aux spécialistes de la Loi, et ceux-ci le condamneront à mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Fils de l’homme » est l’expression que Jésus emploie habituellement pour parler de lui-même ; elle peut faire écho à Daniel 7.13-14.
    reason: cross_reference
  - marker: b
    text: Ou « sera remis entre les mains de » ; selon le contexte, le verbe peut aussi signifier « sera trahi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Écoutez
  rationale: Marque naturellement l’appel à l’attention dans ce discours adressé aux disciples; « Voici » serait plus formel et moins idiomatique ici.
- source_word: ἀναβαίνομεν
  choice: nous montons
  rationale: Conserve le présent du déplacement ainsi que l’idée géographique et traditionnelle de la montée vers Jérusalem.
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Rendu français établi de cette auto-désignation de Jésus, qui préserve sa formulation particulière et sa possible résonance avec Daniel 7.
- source_word: παραδοθήσεται
  choice: sera livré
  rationale: Exprime le transfert au pouvoir d’autrui sans limiter le sens à la trahison de Judas.
- source_word: τοῖς ἀρχιερεῦσιν
  choice: aux grands prêtres
  rationale: Désignation française courante des principales autorités sacerdotales; le pluriel ne désigne pas plusieurs titulaires simultanés de la fonction de grand prêtre.
- source_word: γραμματεῦσιν
  choice: aux spécialistes de la Loi
  rationale: Rend la fonction religieuse et juridique des γραμματεῖς de manière immédiatement intelligible en français moderne; « scribes » est plus littéral, mais peut évoquer de simples copistes.
- source_word: κατακρινοῦσιν
  choice: ils le condamneront
  rationale: Restitue directement le sens judiciaire du verbe dans ce contexte.
- source_word: θανάτῳ
  choice: à mort
  rationale: Expression française idiomatique pour la peine prononcée.
theological_decisions:
- issue: Rendu du titre christologique ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: Préserve le titre traditionnel et son éventuelle portée daniélique sans le réduire à une simple désignation générique.
- issue: Portée de παραδοθήσεται
  choice: sera livré
  alternative: sera trahi
  rationale: Le grec décrit ici la remise de Jésus au pouvoir des autorités sans préciser l’auteur ni réduire l’action à la trahison; le rendu choisi conserve cette amplitude.
translation_notes:
  register: Français international moderne, digne et accessible. « Écoutez » rend l’appel à l’attention sans archaïsme; « spécialistes de la Loi » privilégie la compréhension fonctionnelle. La ponctuation divise la longue coordination grecque en deux phrases pour une lecture naturelle, sans modifier les relations logiques.
