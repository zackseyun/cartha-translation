  text: οἱ δὲ ἀπῆλθον. ⸀πάλιν ἐξελθὼν περὶ ἕκτην καὶ ἐνάτην ὥραν ἐποίησεν ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/005.yaml
  text: So they went away. Going out again about the sixth and ninth hour[a], he did likewise.
translation:
  language: fr
  text: Ils partirent. Il sortit de nouveau vers la sixième et la neuvième heure[a], et fit de même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire vers midi et quinze heures, selon le décompte juif des heures.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ ἀπῆλθον
  choice: Ils partirent donc
  rationale: Le pronom renvoie aux ouvriers mentionnés auparavant. « Donc » rend naturellement la légère articulation narrative de δέ, et « partirent » exprime ἀπῆλθον dans un français courant et digne.
- source_word: πάλιν
  choice: de nouveau
  rationale: Cette expression rend clairement la répétition indiquée par πάλιν et s’intègre naturellement à la narration.
- source_word: ἐξελθὼν
  choice: Il sortit
  rationale: Le participe aoriste exprime ici une action liée au verbe principal. Une proposition verbale indépendante est plus naturelle en français et conserve la succession narrative sans préciser excessivement le rapport temporel.
- source_word: περὶ ἕκτην καὶ ἐνάτην ὥραν
  choice: vers la sixième et la neuvième heure
  rationale: « Vers » rend περὶ, tandis que la numérotation des heures préserve l’expression culturelle du texte source. L’équivalent horaire moderne est donné en note.
- source_word: ἐποίησεν ὡσαύτως
  choice: fit de même
  rationale: La locution française concise rend ensemble le verbe sémantiquement léger ποιέω et la comparaison exprimée par ὡσαύτως.
theological_decisions: []
translation_notes:
  register: Français moderne, international et narratif. La structure est légèrement réorganisée pour éviter un participe présent lourd, tout en préservant la répétition de l’action et le système horaire propre au contexte.
