  text: περὶ δὲ τὴν ⸀ἑνδεκάτην ἐξελθὼν εὗρεν ἄλλους ⸀ἑστῶτας, καὶ λέγει αὐτοῖς· Τί ὧδε ἑστήκατε ὅλην τὴν ἡμέραν ἀργοί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/006.yaml
  text: And about the eleventh hour he went out and found others standing there[a], and he says to them[b], ‘Why have you been standing here idle all day?’
translation:
  language: fr
  text: 'Vers la onzième heure[a], il sortit et en trouva d’autres qui se tenaient là. Il leur dit[b] : « Pourquoi êtes-vous restés ici toute la journée sans rien faire ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire vers cinq heures de l’après-midi. Littéralement : « vers la onzième heure ».'
    reason: Le jour était généralement compté à partir d’environ six heures du matin; la note rend l’indication accessible sans remplacer l’expression ancienne dans le texte.
  - marker: b
    text: 'Le grec emploie ici un présent historique : « il leur dit ».'
    reason: La note signale la vivacité narrative du présent λέγει, conservé dans le texte français.
lexical_decisions:
- source_word: περὶ δὲ τὴν ἑνδεκάτην
  choice: Vers la onzième heure
  rationale: περί avec l’accusatif marque l’approximation. La formulation conserve le mode antique de compter les heures et le cadre temporel de la parabole.
- source_word: ἐξελθὼν εὗρεν
  choice: il sortit et en trouva
  rationale: Le participe aoriste exprime une action antérieure ou étroitement liée au verbe principal. Deux verbes coordonnés donnent ici un récit naturel en français tout en gardant l’ordre des actions.
- source_word: ἄλλους
  choice: d’autres
  rationale: L’adjectif substantivé ne précise pas explicitement le sexe; « d’autres » évite une précision absente du grec.
- source_word: ἑστῶτας
  choice: qui se tenaient là
  rationale: Le participe parfait décrit un état durable. « Se tenaient là » rend naturellement cette posture en français; « là » est explicité par le contexte et par ὧδε dans la question suivante.
- source_word: καὶ λέγει αὐτοῖς
  choice: Il leur dit
  rationale: Le présent grec est un présent historique. Le passé simple est la forme narrative française naturelle, tandis qu’une note signale la forme grecque.
- source_word: Τί ὧδε ἑστήκατε
  choice: Pourquoi êtes-vous restés ici
  rationale: τί a ici le sens idiomatique de « pourquoi ». Le parfait ἑστήκατε indique une situation qui s’est prolongée jusqu’au moment de la parole; « êtes-vous restés » l’exprime sans lourdeur.
- source_word: ὅλην τὴν ἡμέραν ἀργοί
  choice: toute la journée sans rien faire
  rationale: L’accusatif exprime la durée, et ἀργοί signifie inactifs ou désœuvrés. « Sans rien faire » est plus courant et moins moralement chargé que « oisifs ».
