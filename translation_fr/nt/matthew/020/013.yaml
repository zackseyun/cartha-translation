  text: ὁ δὲ ἀποκριθεὶς ⸂ἑνὶ αὐτῶν εἶπεν⸃· Ἑταῖρε, οὐκ ἀδικῶ σε· οὐχὶ δηναρίου συνεφώνησάς μοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/013.yaml
  text: But answering[a], he said to one of them, ‘Friend, I am not wronging you[b]. Did you not agree with me for a denarius?’
translation:
  language: fr
  text: 'Mais il répondit à l’un d’eux : « Mon ami, je ne te fais aucun tort. Ne t’étais-tu pas mis d’accord avec moi pour un denier[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le denier était une monnaie romaine d’argent, correspondant couramment au salaire journalier d’un ouvrier.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: il répondit
  rationale: Le participe suivi de « il dit » forme une tournure sémitisante et grecque que le français naturel rend sobrement par « il répondit ».
- source_word: ἑνὶ αὐτῶν
  choice: à l’un d’eux
  rationale: Le datif singulier avec le génitif partitif indique qu’il s’adresse à une personne prise dans le groupe.
- source_word: Ἑταῖρε
  choice: Mon ami
  rationale: Cette interpellation courante en français conserve l’adresse directe sans imposer une intimité chaleureuse que le contexte ne garantit pas.
- source_word: οὐκ ἀδικῶ σε
  choice: je ne te fais aucun tort
  rationale: Cette expression française naturelle traduit l’idée d’agir injustement envers quelqu’un et maintient la force personnelle de σε.
- source_word: οὐχὶ
  choice: Ne ... pas
  rationale: La question négative appelle une réponse affirmative et rappelle l’accord déjà conclu.
- source_word: δηναρίου
  choice: pour un denier
  rationale: Le génitif exprime ici le prix convenu; « denier » conserve la monnaie historique.
- source_word: συνεφώνησάς μοι
  choice: t’étais-tu mis d’accord avec moi
  rationale: Le verbe désigne l’accord conclu antérieurement; le plus-que-parfait français marque naturellement cette antériorité dans le dialogue.
