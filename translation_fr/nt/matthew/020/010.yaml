id: MAT.20.10
reference: Matthew 20:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂καὶ ἐλθόντες⸃ οἱ πρῶτοι ἐνόμισαν ὅτι ⸀πλεῖον λήμψονται· καὶ ἔλαβον ⸂τὸ ἀνὰ δηνάριον καὶ αὐτοί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/010.yaml
  text: When the first ones came[a], they thought they would receive more[b], but they too received a denarius each.
translation:
  language: fr
  text: Quand les premiers[a] arrivèrent, ils pensèrent qu’ils recevraient davantage ; mais eux aussi reçurent chacun un denier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit des ouvriers embauchés les premiers dans la parabole.
    reason: lexical_alternative
  - marker: b
    text: Le denier était une monnaie romaine correspondant couramment au salaire journalier d’un ouvrier.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντες
  choice: arrivèrent
  rationale: Le participe aoriste a ici une valeur temporelle. La tournure « Quand… arrivèrent » restitue naturellement la succession du récit.
- source_word: οἱ πρῶτοι
  choice: les premiers
  rationale: L’expression désigne les ouvriers embauchés les premiers dans la parabole, et non un rang abstrait.
- source_word: ἐνόμισαν
  choice: ils pensèrent
  rationale: νομίζω exprime ici une supposition ou une attente ; « pensèrent » demeure naturel sans présenter leur conclusion comme certaine.
- source_word: πλεῖον
  choice: davantage
  rationale: Le comparatif désigne une rémunération supérieure. « Davantage » est idiomatique et concis.
- source_word: λήμψονται
  choice: ils recevraient
  rationale: Le futur grec se trouve dans un discours indirect dépendant d’un verbe au passé ; le conditionnel français exprime naturellement ce futur dans le passé.
- source_word: τὸ ἀνὰ δηνάριον
  choice: chacun un denier
  rationale: ἀνά suivi de l’accusatif a une valeur distributive. Cette formulation indique clairement qu’un denier fut remis à chacun.
- source_word: καὶ αὐτοί
  choice: eux aussi
  rationale: La tournure conserve l’insistance du grec sur le fait que les premiers reçurent le même salaire que les autres.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le point-virgule fait ressortir le contraste entre l’attente des premiers ouvriers et la somme qu’ils reçurent effectivement.
