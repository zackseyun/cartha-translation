id: MAT.20.27
reference: Matthew 20:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ἐν ὑμῖν εἶναι πρῶτος ⸀ἔσται ὑμῶν δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/027.yaml
  text: And whoever wants to be first among you will be your slave[a].
translation:
  language: fr
  text: Et celui qui veut être le premier parmi vous sera votre esclave[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot grec doulos est plus fort que celui employé au verset précédent et désigne souvent un esclave ou un serviteur lié à un maître.
    reason: Alternative lexicale et précision sur l’intensification par rapport au verset précédent.
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: celui qui veut
  rationale: Le relatif avec ἄν et le subjonctif exprime une condition générale. « Celui qui veut » est naturel en français moderne et conserve la dimension volontaire de θέλω.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Dans ce contexte de rang au sein du groupe, « parmi vous » exprime naturellement la position dans la communauté.
- source_word: εἶναι πρῶτος
  choice: être le premier
  rationale: Cette formulation directe conserve l’idée d’occuper le premier rang, sans ajouter la notion de devenir.
- source_word: ἔσται
  choice: sera
  rationale: Le futur grec est rendu comme un futur. Sa portée normative dans le contexte reste perceptible sans être explicitée par « devra être ».
- source_word: ὑμῶν
  choice: votre
  rationale: 'Le génitif marque ici la relation avec l’ensemble des disciples : cette personne sera leur esclave.'
- source_word: δοῦλος
  choice: esclave
  rationale: δοῦλος est plus fort que διάκονος au verset précédent. « Esclave » préserve l’intensification rhétorique et l’idée d’un statut d’assujettissement, tandis qu’une note signale l’autre traduction courante.
theological_decisions:
- issue: Traduction de δοῦλος dans cet enseignement sur la condition du disciple
  choice: esclave
  alternative: serviteur
  rationale: Le propos renverse l’ambition sociale par une image d’abaissement radical. Traduire δοῦλος par « esclave » maintient la force du terme grec et la progression par rapport au terme désignant le serviteur dans le verset précédent, sans atténuer la tension du texte.
- issue: Valeur du futur ἔσται
  choice: sera
  alternative: devra être
  rationale: Le contexte permet une portée normative, mais la forme grecque demeure un futur. « Sera » conserve cette ambiguïté entre déclaration et exigence implicite.
translation_notes:
  register: Français moderne, simple et digne. La syntaxe reste proche du grec tout en étant idiomatique. « Esclave » est volontairement maintenu dans le texte principal pour préserver la force de l’image.
