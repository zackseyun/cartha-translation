  text: Καὶ ἀκούσαντες οἱ δέκα ἠγανάκτησαν περὶ τῶν δύο ἀδελφῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/024.yaml
  text: And when the ten heard it, they became indignant about the two brothers.
translation:
  language: fr
  text: Quand les dix autres entendirent cela, ils s’indignèrent au sujet des deux frères.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δέκα
  choice: les dix autres
  rationale: « autres » explicite naturellement en français que les dix sont les autres disciples, par contraste avec les deux frères, sans modifier le référent.
- source_word: ἀκούσαντες
  choice: quand … entendirent cela
  rationale: Le participe aoriste circonstanciel est rendu par une proposition temporelle naturelle; « cela » reprend la demande et l’échange précédents.
- source_word: ἠγανάκτησαν
  choice: ils s’indignèrent
  rationale: Correspond directement à la forte réaction de mécontentement exprimée par le verbe grec.
- source_word: περὶ τῶν δύο ἀδελφῶν
  choice: au sujet des deux frères
  rationale: 'Préserve la relation assez ouverte de περί: leur indignation concerne les deux frères, sans préciser davantage s’ils sont simplement la cible ou la cause de celle-ci.'
theological_decisions:
- issue: Objet ou motif de l’indignation
  choice: au sujet des deux frères
  alternative: contre les deux frères
  rationale: Le grec περί avec le génitif signifie ici que l’indignation porte sur les deux frères; « au sujet de » conserve mieux cette latitude que « contre », qui impose plus nettement l’idée d’hostilité dirigée vers eux.
translation_notes:
  register: Français moderne, courant et digne. La phrase reste concise et conserve la tension narrative du grec.
