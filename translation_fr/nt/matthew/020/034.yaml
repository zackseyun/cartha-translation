  to: Pris de compassion, Jésus leur toucha les yeux. Aussitôt, ils se mirent à voir[a] et le suivirent.
  rationale: La révision évite d'affirmer implicitement que les aveugles avaient déjà possédé la vue, tout en conservant l'effet immédiat de la guérison exprimé par εὐθέως et ἀνέβλεψαν. Elle maintient la concision, le registre et l'ambiguïté lexicale résiduelle signalée en note.
