id: MAT.20.34
reference: Matthew 20:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σπλαγχνισθεὶς δὲ ὁ Ἰησοῦς ἥψατο τῶν ⸀ὀμμάτων αὐτῶν, καὶ εὐθέως ⸀ἀνέβλεψαν καὶ ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/034.yaml
  text: And Jesus[a], moved with compassion, touched their eyes, and immediately they received their sight and followed him.
translation:
  language: fr
  text: Pris de compassion, Jésus leur toucha les yeux. Aussitôt, ils se mirent à voir[a] et le suivirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils recouvrèrent la vue ». Le verbe grec peut aussi signifier, plus littéralement, « lever les yeux »; dans ce contexte, il indique qu’ils se sont mis à voir.
    reason: alternative lexicale
lexical_decisions:
- source_word: σπλαγχνισθεὶς
  choice: Pris de compassion
  rationale: Cette tournure française naturelle exprime la profonde compassion indiquée par le participe grec, sans alourdir la phrase.
- source_word: δὲ
  choice: non traduit séparément
  rationale: Dans ce contexte, δέ est un connecteur narratif léger. L’enchaînement français et la mise en tête du participe rendent naturellement la progression sans exiger « et » ou « alors ».
- source_word: ἥψατο τῶν ὀμμάτων αὐτῶν
  choice: leur toucha les yeux
  rationale: Le verbe désigne ici un contact physique; le pronom possessif indirect « leur » est idiomatique en français pour une partie du corps.
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Ce terme conserve la force temporelle et souligne que le résultat fut immédiat.
- source_word: ἀνέβλεψαν
  choice: ils retrouvèrent la vue
  rationale: Dans ce récit de guérison d’aveugles, le verbe désigne le fait de voir ou de recouvrer la vue. La formulation choisie est claire et naturelle, tandis qu’une note conserve l’amplitude lexicale du grec.
- source_word: ἠκολούθησαν αὐτῷ
  choice: le suivirent
  rationale: Cette traduction préserve à la fois le mouvement concret à la suite de Jésus et une éventuelle résonance de disciple, sans expliciter davantage que le texte.
theological_decisions:
- issue: Nature du résultat exprimé par ἀνέβλεψαν
  choice: une restauration réelle et immédiate de la vue
  alternative: une formulation moins précise, telle que « ils se mirent à voir » ou le sens littéral possible « ils levèrent les yeux »
  rationale: Le contexte immédiat d’une guérison d’aveugles, renforcé par εὐθέως, indique que les hommes voient immédiatement. La note signale néanmoins l’étendue sémantique du verbe.
- issue: Portée de ἠκολούθησαν αὐτῷ
  choice: « le suivirent »
  alternative: « devinrent ses disciples »
  rationale: Le texte dit qu’ils suivirent Jésus, ce qui peut évoquer la condition de disciple, mais il ne précise ni la profondeur ni la durée de cet engagement.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est divisée en deux pour donner naturellement à « Aussitôt » sa pleine force narrative. « Leur toucha les yeux » suit l’usage français courant pour les parties du corps.
