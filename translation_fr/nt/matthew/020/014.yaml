id: MAT.20.14
reference: Matthew 20:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἆρον τὸ σὸν καὶ ὕπαγε· θέλω δὲ τούτῳ τῷ ἐσχάτῳ δοῦναι ὡς καὶ σοί·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/014.yaml
  text: Take what is yours and go[a]. But I want to give to this last man the same as to you.
translation:
  language: fr
  text: Prends ce qui est à toi et va-t’en. Mais je veux donner à ce dernier autant qu’à toi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἆρον
  choice: Prends
  rationale: L’impératif aoriste de αἴρω commande ici à l’ouvrier de prendre ce qui lui appartient. « Prends » conserve la brièveté et la fermeté de l’ordre.
- source_word: τὸ σὸν
  choice: ce qui est à toi
  rationale: Cette expression substantivée signifie littéralement « ce qui est tien ». Le contexte permettrait « ton salaire », mais cette précision n’est pas explicitement présente dans la proposition grecque.
- source_word: ὕπαγε
  choice: va-t’en
  rationale: Dans ce contexte, l’impératif exprime un congé donné. « Va-t’en » est une formulation française naturelle qui rend cette valeur sans ajouter d’explication.
- source_word: θέλω δὲ
  choice: Mais je veux
  rationale: θέλω exprime la volonté du maître, tandis que δέ marque ici un contraste léger avec l’ordre précédent.
- source_word: τούτῳ τῷ ἐσχάτῳ
  choice: à ce dernier
  rationale: Le démonstratif et l’adjectif sont au masculin singulier et désignent le dernier ouvrier de la parabole. « Ce dernier » garde cette référence personnelle masculine sans alourdir la phrase.
- source_word: δοῦναι
  choice: donner
  rationale: L’infinitif de δίδωμι signifie simplement « donner ». Bien que le contexte concerne une rémunération, « donner » préserve le choix lexical du grec et souligne la libre décision du maître.
- source_word: ὡς καὶ σοί
  choice: autant qu’à toi
  rationale: Dans ce contexte de somme versée, cette formulation française idiomatique exprime l’égalité impliquée par ὡς καί avec le datif.
theological_decisions:
- issue: Référence masculine singulière au dernier ouvrier
  choice: ce dernier
  alternative: le dernier arrivé
  rationale: Le grec désigne un individu masculin précis, mais ne répète pas le nom « ouvrier ». « Ce dernier » respecte à la fois le genre grammatical et la concision du texte, tandis que « le dernier arrivé » expliciterait davantage le contexte.
translation_notes:
  register: Français international moderne, direct et digne. La formulation conserve le ton ferme du maître ainsi que le contraste entre ce qui revient au premier ouvrier et la volonté déclarée du maître envers le dernier.
