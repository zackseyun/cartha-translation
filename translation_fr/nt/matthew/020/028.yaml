id: MAT.20.28
reference: Matthew 20:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/028.yaml
  text: just as the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: fr
  text: tout comme le Fils de l’homme n’est pas venu pour être servi, mais pour servir et donner sa vie en rançon pour beaucoup[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « donner sa vie en rançon à la place de beaucoup ».'
    reason: Variante lexicale explicitant la nuance substitutive possible de ἀντί.
lexical_decisions:
- source_word: ὥσπερ
  choice: tout comme
  rationale: Introduit naturellement en français la comparaison avec l’enseignement qui précède, tout en conservant la force comparative du grec.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Formulation française consacrée qui préserve à la fois la valeur de titre et les résonances de Daniel.
- source_word: οὐκ ἦλθεν
  choice: n’est pas venu
  rationale: Le passé composé est la manière la plus naturelle de rendre ici l’aoriste grec en français moderne.
- source_word: διακονηθῆναι
  choice: pour être servi
  rationale: Rend clairement l’infinitif passif, sans recourir à un vocabulaire ecclésiastique.
- source_word: ἀλλὰ διακονῆσαι
  choice: mais pour servir
  rationale: Maintient le contraste verbal direct entre être servi et servir.
- source_word: καὶ δοῦναι
  choice: et donner
  rationale: Coordonne simplement le second infinitif avec « servir », sans ajouter une nuance absente du texte.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sa vie
  rationale: Dans ce contexte de mort consentie, ψυχή désigne la vie de la personne plutôt que l’âme considérée séparément.
- source_word: λύτρον
  choice: en rançon
  rationale: Exprime le prix versé pour obtenir une libération et conserve l’image rédemptrice du grec.
- source_word: ἀντὶ πολλῶν
  choice: pour beaucoup
  rationale: Formulation française naturelle et traditionnelle; la nuance plus explicitement substitutive de ἀντί est signalée en note.
theological_decisions:
- issue: Force de ἀντί dans la parole sur la rançon
  choice: « pour beaucoup » dans le texte principal
  alternative: « à la place de beaucoup »
  rationale: Le texte présente la mort de Jésus en termes représentatifs ou substitutifs. La formulation principale reste idiomatique, tandis que la note conserve la valeur d’échange ou de substitution que peut porter ἀντί, sans imposer une systématisation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « être servi / servir » est conservé, ainsi que l’expression biblique reconnue « le Fils de l’homme ».
