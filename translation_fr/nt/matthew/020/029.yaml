  text: Καὶ ἐκπορευομένων αὐτῶν ἀπὸ Ἰεριχὼ ἠκολούθησεν αὐτῷ ὄχλος πολύς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/029.yaml
  text: And as they were going out from Jericho[a], a large crowd followed him.
translation:
  language: fr
  text: Alors qu’ils sortaient de Jéricho[a], une grande foule le suivit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme ils quittaient Jéricho ».'
    reason: Alternative lexicale et syntaxique pour rendre la proposition participiale temporelle.
lexical_decisions:
- source_word: ἐκπορευομένων
  choice: Au moment où ils sortaient
  rationale: Le participe présent au génitif pluriel a une valeur temporelle et présente l’action comme en cours. Cette formulation la restitue clairement et naturellement en français.
- source_word: ἀπὸ Ἰεριχὼ
  choice: de Jéricho
  rationale: La préposition ἀπό indique ici le point de départ ou l’éloignement d’un lieu. Avec « sortaient », « de Jéricho » est la tournure française idiomatique.
- source_word: ἠκολούθησεν
  choice: suivit
  rationale: L’aoriste indicatif de ἀκολουθέω désigne l’action de suivre quelqu’un. Le passé simple convient au registre narratif biblique tout en restant compréhensible.
- source_word: αὐτῷ
  choice: Jésus
  rationale: Le pronom datif masculin singulier renvoie le plus naturellement à Jésus. La répétition du nom en français évite une ambiguïté artificielle après le pluriel « ils » tout en conservant le référent singulier du grec.
- source_word: ὄχλος πολύς
  choice: une foule nombreuse
  rationale: L’expression décrit une foule composée de beaucoup de personnes. « Une foule nombreuse » est naturelle, précise et digne en français moderne.
theological_decisions:
- issue: Référent du pronom singulier αὐτῷ après le participe au pluriel
  choice: La foule suivait Jésus, rendu explicitement par « Jésus ».
  alternative: La foule suivait l’ensemble du groupe, rendu par « les suivit ».
  rationale: Le grec passe délibérément du pluriel « ils sortaient » au singulier « le suivit ». Dans le contexte, ce singulier désigne naturellement Jésus comme personnage central; il ne faut donc pas l’aplanir en un pluriel.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le style narratif soutenu sans archaïsme lexical. Le nom « Jésus » explicite le référent du pronom grec singulier et évite que « le suivit » soit momentanément rattaché à Jéricho.
