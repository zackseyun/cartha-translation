  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀λέγει αὐτοῖς· Τὸ μὲν ποτήριόν μου ⸀πίεσθε, τὸ δὲ καθίσαι ἐκ δεξιῶν μου καὶ ἐξ ⸀εὐωνύμων οὐκ ἔστιν ⸀ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται ὑπὸ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/023.yaml
  text: He said to them[a], “You will indeed drink my cup, but to sit at my right and at my left is not mine to grant[b], but it is for those for whom it has been prepared by my Father.”
translation:
  language: fr
  text: 'Il leur dit : « Vous boirez bien ma coupe[a]. Mais prendre place à ma droite et à ma gauche[b], ce n’est pas à moi de l’accorder, mais c’est pour ceux à qui cela a été préparé par mon Père. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « coupe » représente ici, de manière imagée, la souffrance ou le sort assigné à Jésus, que ses disciples connaîtront eux aussi.
    reason: metaphor_explanation
  - marker: b
    text: 'Ou : « siéger à ma droite et à ma gauche ». Il s’agit de places d’honneur auprès de Jésus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Il leur dit
  rationale: Le présent historique grec est conservé, car il est naturel dans le récit en français et maintient la vivacité de la narration.
- source_word: Τὸ μὲν ποτήριόν μου πίεσθε
  choice: Vous boirez bien ma coupe
  rationale: « Ma coupe » préserve sans l’expliciter l’image de la souffrance ou du destin assigné. « Bien » rend ici la valeur affirmative de μὲν avant le contraste introduit par δέ.
- source_word: καθίσαι ἐκ δεξιῶν μου καὶ ἐξ εὐωνύμων
  choice: siéger à ma droite et à ma gauche
  rationale: « Siéger » convient aux places d’honneur envisagées, tandis que « à ma droite et à ma gauche » restitue naturellement les deux expressions prépositionnelles grecques.
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: ce n’est pas à moi de l’accorder
  rationale: La formulation française exprime directement que l’attribution de ces places n’appartient pas à Jésus dans cet énoncé. « Accorder » convient mieux que « donner » à une place honorifique.
- source_word: ἀλλ’ οἷς ἡτοίμασται
  choice: mais c’est pour ceux à qui cela a été préparé
  rationale: Le grec est elliptique après ἀλλά. La reprise par « cela » garde une certaine indétermination quant à ce qui a été préparé, tout en rendant la phrase compréhensible. Le passé composé passif reflète le parfait grec et son résultat présent.
- source_word: ὑπὸ τοῦ πατρός μου
  choice: par mon Père
  rationale: Traduction directe du complément d’agent, sans ajouter « seul », qui n’est pas exprimé dans le grec.
theological_decisions:
- issue: Portée christologique de « ce n’est pas à moi de l’accorder »
  choice: Conserver l’affirmation sans qualification explicative.
  alternative: Ajouter une précision telle que « indépendamment de mon Père » ou reformuler pour atténuer la tension.
  rationale: Le texte distingue ici l’attribution par le Père sans expliquer davantage le rapport entre l’autorité du Père et celle du Fils. La traduction conserve cette tension théologique au lieu de la résoudre.
- issue: Sens métaphorique de la coupe
  choice: Maintenir l’image de « ma coupe » dans le texte et l’expliquer en note.
  alternative: Remplacer directement l’image par « mes souffrances » ou « le sort qui m’attend ».
  rationale: L’image est intentionnelle et riche de résonances bibliques ; l’expliciter dans le corps du texte réduirait sa portée.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe demeure proche du grec tout en restant naturelle. Le contraste entre l’assurance concernant la coupe et la restriction concernant les places est clairement marqué.
