source:
  edition: SBLGNT
  text: καὶ ἐξελθὼν περὶ τρίτην ὥραν εἶδεν ἄλλους ἑστῶτας ἐν τῇ ἀγορᾷ ἀργούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/003.yaml
  text: And going out about the third hour[b][a], he saw others standing idle in the marketplace.
translation:
  language: fr
  text: Étant sorti vers la troisième heure[a], il vit d’autres personnes debout sur la place du marché, sans travailler[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire vers neuf heures du matin. On comptait les heures du jour à partir du lever du soleil.
    reason: cultural_note
  - marker: b
    text: 'Ou : « sans emploi ». Le grec signifie « inactifs » ou « oisifs » et indique ici qu’ils n’étaient pas en train de travailler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Il sortit de nouveau
  rationale: Le participe aoriste marque une action antérieure ou concomitante dans la séquence narrative. En français, un verbe conjugué est plus naturel. « de nouveau » est explicité par le contexte immédiat du maître déjà sorti auparavant, sans modifier le déroulement.
- source_word: περὶ τρίτην ὥραν
  choice: vers la troisième heure
  rationale: Conserve le mode antique de décompte des heures et l’approximation exprimée par περὶ. Une note donne l’équivalent moderne approximatif.
- source_word: εἶδεν
  choice: vit
  rationale: Équivalent narratif direct et sobre de l’aoriste de ὁράω.
- source_word: ἄλλους
  choice: d’autres personnes
  rationale: Le grec emploie l’adjectif substantivé sans préciser le sexe. « personnes » rend naturellement cette indétermination en français.
- source_word: ἑστῶτας
  choice: qui se tenaient
  rationale: Rend la valeur stative du participe parfait de ἵστημι et s’intègre naturellement à la proposition relative française.
- source_word: ἀγορᾷ
  choice: place du marché
  rationale: L’ἀγορά est la place publique servant notamment aux échanges et au rassemblement des travailleurs; « place du marché » évoque clairement ce cadre antique.
- source_word: ἀργούς
  choice: sans travailler
  rationale: Exprime ici l’absence d’activité de façon claire sans suggérer nécessairement la paresse ni importer la catégorie socio-économique moderne de chômage.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La tournure conserve « la troisième heure » pour refléter le texte source, tout en donnant en note son équivalent culturel. « Sans travailler » évite la connotation potentiellement morale de « oisifs ».
