  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτοὺς εἶπεν· Οἴδατε ὅτι οἱ ἄρχοντες τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/025.yaml
  text: But Jesus[a], calling them to himself, said, “You know that the rulers of the Gentiles lord it over them[b], and their great men exercise authority over them.”
translation:
  language: fr
  text: 'Mais Jésus les appela auprès de lui et leur dit : « Vous savez que les dirigeants des nations[a] les dominent et que les grands[b] exercent leur autorité sur elles. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des non-Juifs ».
    reason: alternative_reading
  - marker: b
    text: Ou « les personnages importants » ou « les puissants ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: les appela auprès de lui
  rationale: Le participe aoriste moyen exprime que Jésus fait venir les disciples à lui avant de parler. Cette formulation restitue naturellement ce mouvement en français.
- source_word: Οἴδατε
  choice: Vous savez
  rationale: Bien que parfait par sa forme, οἶδα a ici un sens présent. « Vous savez » est l’équivalent français idiomatique.
- source_word: ἄρχοντες
  choice: dirigeants
  rationale: Le terme désigne ceux qui gouvernent. « Dirigeants » convient au contexte politique tout en restant courant et suffisamment large.
- source_word: τῶν ἐθνῶν
  choice: des nations
  rationale: ἔθνη peut désigner les nations ou, dans un contexte juif, les non-Juifs. « Nations » conserve cette amplitude sémantique; la note signale l’autre compréhension.
- source_word: κατακυριεύουσιν
  choice: les dominent
  rationale: Le verbe composé évoque une domination exercée d’en haut, avec une nuance défavorable plus forte que le simple fait de gouverner.
- source_word: οἱ μεγάλοι
  choice: leurs hauts dignitaires
  rationale: L’adjectif substantivé désigne les personnages importants ou puissants. « Hauts dignitaires » est naturel en français et indique clairement leur rang politique ou social; le possessif est explicité d’après le contexte.
- source_word: κατεξουσιάζουσιν
  choice: leur imposent leur autorité
  rationale: Le verbe signifie exercer son pouvoir sur quelqu’un, souvent avec une nuance oppressive. « Imposent leur autorité » rend cette force et maintient le parallélisme avec « dominent ».
- source_word: αὐτῶν
  choice: les / leur
  rationale: Les deux pronoms renvoient aux populations des nations gouvernées. Le français emploie naturellement des pronoms objets plutôt que de répéter le groupe nominal.
theological_decisions:
- issue: Sens de ἐθνῶν dans une parole prononcée en contexte juif
  choice: nations
  alternative: non-Juifs
  rationale: Le grec permet les deux lectures. « Nations » reste transparent en français et préserve l’ambiguïté lexicale, tandis qu’une note indique le sens contextuel possible de « non-Juifs ».
- issue: Désignation des οἱ μεγάλοι
  choice: leurs hauts dignitaires
  alternative: les grands
  rationale: Le grec emploie un adjectif masculin pluriel substantivé pour des personnes éminentes. La traduction choisie communique leur statut sans ajouter une fonction officielle trop précise; la note conserve la forme plus littérale.
translation_notes:
  register: Français international moderne, clair et digne. Les verbes « dominent » et « imposent » conservent la critique implicite de l’exercice oppressif du pouvoir. Les deux notes sont placées immédiatement après les expressions auxquelles elles se rapportent.
