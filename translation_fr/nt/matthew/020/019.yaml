  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν εἰς τὸ ἐμπαῖξαι καὶ μαστιγῶσαι καὶ σταυρῶσαι, καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/019.yaml
  text: and they will hand him over to the Gentiles to mock and flog and crucify[a], and on the third day he will be raised.
translation:
  language: fr
  text: Et ils le livreront aux non-Juifs pour se moquer de lui, le fouetter et le crucifier, et le troisième jour, il sera ressuscité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ressuscitera ». Le verbe grec est au passif (« il sera ressuscité »), tournure fréquente pour parler de la résurrection et pouvant sous-entendre l’action de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραδώσουσιν
  choice: ils le livreront
  rationale: « Livrer » exprime naturellement la remise de Jésus au pouvoir d’autorités hostiles, sans introduire ici l’idée plus précise de trahison.
- source_word: τοῖς ἔθνεσιν
  choice: aux non-Juifs
  rationale: Dans cette annonce de la Passion en contexte juif, le terme désigne les personnes appartenant aux autres peuples, en particulier les autorités romaines. « Non-Juifs » est précis et immédiatement compréhensible, contrairement à « nations », et moins chargé que « païens ».
- source_word: εἰς τὸ ἐμπαῖξαι
  choice: pour qu’ils se moquent de lui
  rationale: La tournure avec εἰς et l’infinitif exprime ici le but ou le résultat. La proposition française indique clairement que les non-Juifs sont les auteurs des trois actions.
- source_word: μαστιγῶσαι
  choice: le fouettent
  rationale: « Fouetter » est un terme moderne et clair pour le châtiment corporel judiciaire évoqué, tandis que « flageller » est plus traditionnel et soutenu.
- source_word: σταυρῶσαι
  choice: le crucifient
  rationale: Le verbe signifie directement « crucifier ». Le pronom « le » est repris en français afin que la coordination soit fluide et sans ambiguïté.
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: le troisième jour
  rationale: Cette formulation temporelle est la manière naturelle de rendre le datif grec en français.
- source_word: ἐγερθήσεται
  choice: il sera ressuscité
  rationale: Le futur passif grec est conservé. Dans ce contexte de résurrection, cette formulation peut suggérer l’action de Dieu sans la rendre explicite dans le texte.
theological_decisions:
- issue: Voix du verbe de résurrection
  choice: il sera ressuscité
  alternative: il ressuscitera
  rationale: Le grec emploie un futur passif. Le conserver respecte la forme du texte et sa possible nuance d’action divine, sans exclure ce que d’autres passages disent de l’action propre du Christ.
translation_notes:
  register: Français international moderne, clair et digne. « Non-Juifs » évite à la fois l’ambiguïté de « nations » et la connotation potentiellement péjorative ou strictement religieuse de « païens ». La répétition des pronoms dans « se moquent de lui, le fouettent et le crucifient » assure une syntaxe française naturelle.
