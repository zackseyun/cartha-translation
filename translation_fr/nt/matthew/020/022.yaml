  verdict: revise
  source_fidelity: La formulation conserve correctement l’image de « la coupe », la question sur la capacité et la réponse affirmative. Toutefois, le grec dit littéralement que Jésus « répondit et dit » sans complément (« leur »), et emploie ensuite λέγουσιν, « ils lui dirent », plutôt que le verbe plus interprétatif « ils lui répondirent ».
  naturalness: Le français est naturel, concis et adapté à un registre biblique moderne. « Jésus répondit » rend idiomatiquement la formule grecque sans lourdeur. « Nous le pouvons » est une réponse française fluide et cohérente avec la question.
  terminology: « La coupe » préserve fidèlement la métaphore biblique sans imposer l’interprétation « souffrance » dans le texte. La note explicite avec prudence sa valeur possible. Le repère de note doit être placé sur « coupe », le mot qu’elle éclaire, plutôt qu’après « boire ».
  issues:
