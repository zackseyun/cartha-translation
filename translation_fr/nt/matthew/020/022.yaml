base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/022.yaml
  text: But Jesus answered and said[a], “You do not know what you are asking. Are you able to drink the cup that I am about to drink?” They said to him, “We are able.”
translation:
  language: fr
  text: 'Mais Jésus répondit : « Vous ne savez pas ce que vous demandez. Pouvez-vous boire la coupe[a] que je vais boire ? » Ils lui dirent : « Nous le pouvons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus explicite : « la coupe de souffrance que je vais boire ». En grec, l’image de la « coupe » est conservée ; dans la Bible, elle peut représenter la part destinée à quelqu’un, notamment la souffrance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: Mais Jésus leur répondit
  rationale: « Mais » rend le léger contraste marqué par δέ. En français naturel, « répondit » exprime à lui seul la formule grecque participiale et verbale; reproduire « répondit et dit » serait inutilement lourd. Le pronom « leur » explicite les destinataires déjà présents dans le contexte.
- source_word: Οὐκ οἴδατε
  choice: Vous ne savez pas
  rationale: Rend directement le sens de connaissance porté par οἶδα, sans adopter l'interprétation plus explicative « vous ne comprenez pas ».
- source_word: τί αἰτεῖσθε
  choice: ce que vous demandez
  rationale: Formulation française courante qui conserve la portée actuelle de la demande.
- source_word: δύνασθε πιεῖν
  choice: Pouvez-vous boire
  rationale: « Pouvez-vous » exprime naturellement en français la capacité visée par δύνασθε, tandis que « boire » rend directement πιεῖν.
- source_word: τὸ ποτήριον
  choice: la coupe
  rationale: Conserve la métaphore biblique grecque au lieu de l'expliciter dans le corps du texte comme souffrance ou mort.
- source_word: ὃ ἐγὼ μέλλω πίνειν
  choice: que je vais boire
  rationale: « Je vais boire » rend en français moderne l'orientation future de μέλλω avec l'infinitif, sans exagérer nécessairement l'immédiateté.
- source_word: λέγουσιν αὐτῷ
  choice: Ils lui répondirent
  rationale: Le passé simple convient au registre narratif écrit et rend naturellement le présent historique grec. « Répondirent » explicite la fonction de leur parole dans l'échange.
- source_word: Δυνάμεθα
  choice: Nous le pouvons
  rationale: Reprend avec cohérence le verbe « pouvoir » de la question et restitue la réponse brève et assurée.
theological_decisions:
- issue: Portée métaphorique de « la coupe »
  choice: Maintenir « la coupe » dans le texte principal.
  alternative: « la coupe de souffrance » ou « la souffrance que je vais subir »
  rationale: L'image renvoie, dans le contexte, au sort et aux souffrances qui attendent Jésus, mais le grec ne l'explicite pas ici. Conserver la métaphore préserve sa richesse biblique et sa tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient un registre narratif biblique soigné sans archaïsme lexical. La syntaxe reste concise et orale dans le dialogue.
