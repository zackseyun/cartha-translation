    issue: Le pronom « leur » est ajouté à « Jésus répondit ».
    rationale: Le texte grec ne donne pas de complément à ἀποκριθεὶς… εἶπεν. Le pluriel des paroles suivantes identifie les interlocuteurs sans qu’il soit nécessaire de les expliciter dans la narration française.
  - severity: low
    issue: « Ils lui répondirent » renforce légèrement la relation de réponse.
    rationale: λέγουσιν αὐτῷ signifie plus directement « ils lui dirent ». Dans cet échange, « dirent » reste naturel et reproduit plus précisément le verbe source.
  - severity: low
    issue: L’ancre [a] est placée après « boire » alors que la note porte sur « la coupe ».
    rationale: L’ancre doit suivre immédiatement l’expression expliquée afin que son rattachement soit non ambigu.
