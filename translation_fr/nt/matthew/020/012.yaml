reference: Matthew 20:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὗτοι οἱ ἔσχατοι μίαν ὥραν ἐποίησαν, καὶ ἴσους ⸂αὐτοὺς ἡμῖν⸃ ἐποίησας τοῖς βαστάσασι τὸ βάρος τῆς ἡμέρας καὶ τὸν καύσωνα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/012.yaml
  text: saying[a], ‘These last worked one hour, and you made them equal to us who bore the burden of the day and the scorching heat.’
translation:
  language: fr
  text: 'en disant : « Ces derniers ont travaillé une heure, et tu les as mis à égalité avec nous[a], qui avons supporté le poids de la journée et la chaleur torride. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu les as traités comme nos égaux ».
    reason: Alternative lexicale naturelle pour ἴσους … ἐποίησας, qui peut décrire le fait de rendre égaux ou de traiter en égaux.
lexical_decisions:
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent se rattache à la proposition narrative précédente ; « en disant » en conserve l’enchaînement sans transformer inutilement la syntaxe.
- source_word: Οὗτοι οἱ ἔσχατοι
  choice: Ces derniers
  rationale: L’expression désigne ceux qui ont été embauchés en dernier et garde ici sa force contrastive.
- source_word: μίαν ὥραν ἐποίησαν
  choice: ont travaillé une heure
  rationale: Avec une durée, ποιέω signifie ici accomplir ou fournir ce temps de travail. L’ajout de « seulement » a été évité, car il est implicite dans la plainte mais absent du grec.
- source_word: ἴσους αὐτοὺς ἡμῖν ἐποίησας
  choice: tu les as mis à égalité avec nous
  rationale: Cette formulation française naturelle conserve l’idée explicite d’égalité ainsi que la vigueur de la protestation.
- source_word: τοῖς βαστάσασι
  choice: qui avons supporté
  rationale: βαστάζω évoque à la fois le fait de porter une charge et celui d’endurer une épreuve ; « supporter » convient aux deux dimensions dans ce contexte de travail.
- source_word: τὸ βάρος τῆς ἡμέρας
  choice: le poids de la journée
  rationale: La traduction maintient l’image concrète du poids tout en évoquant la pénibilité d’une journée entière de travail.
- source_word: τὸν καύσωνα
  choice: la chaleur torride
  rationale: καύσων désigne une chaleur brûlante et accablante ; « torride » en exprime clairement l’intensité en français actuel.
theological_decisions:
- issue: La plainte de la parabole concernant l’égalité de traitement
  choice: Rapporter directement la protestation des ouvriers sans qualifier le traitement d’injuste.
  alternative: Employer une formulation interprétative affirmant qu’ils ont été traités injustement.
  rationale: Le verset exprime le point de vue des ouvriers sans trancher lui-même la question plus large de la justice du maître ; la traduction préserve cette tension.
translation_notes:
  register: Français international actuel, digne et accessible. Le tutoiement correspond à l’adresse directe au maître dans la parabole. La formulation évite d’ajouter « seulement » et conserve les images du poids et de la chaleur.
