  source_fidelity: 'Le sens grec est bien rendu : les ouvriers protestent que les derniers arrivés ont travaillé une heure et ont été rendus égaux à ceux qui ont porté le poids de la journée et la chaleur accablante. « Mis à égalité avec nous » restitue adéquatement ἴσους ... ἐποίησας, sans interprétation doctrinale ajoutée.'
