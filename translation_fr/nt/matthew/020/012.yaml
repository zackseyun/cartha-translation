  terminology: « Ces derniers », « ont travaillé une heure », « le poids de la journée » et « la chaleur torride » conviennent au registre et au contexte. Le tutoiement est cohérent avec l’adresse directe dans la parabole. La note propose une alternative lexicale légitime et son ancrage est conservé sur l’expression d’égalité.
