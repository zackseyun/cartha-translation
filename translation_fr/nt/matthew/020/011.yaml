  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: Après l’avoir reçu
  rationale: Le participe aoriste marque ici une action antérieure à celle du verbe principal. Le pronom « l’ » reprend naturellement, dans le contexte, la pièce d’un denier reçue comme salaire.
- source_word: δὲ
  choice: '[non traduit explicitement]'
  rationale: La particule assure une transition narrative légère que l’enchaînement français rend naturellement sans connecteur.
- source_word: ἐγόγγυζον
  choice: ils se mirent à protester
  rationale: L’imparfait peut présenter l’action dans son déroulement ou à son commencement. « Se mirent à protester » exprime ici son déclenchement après la réception du salaire, tout en restant naturel en français moderne.
- source_word: κατὰ
  choice: contre
  rationale: Avec le génitif, κατά indique ici que le mécontentement est dirigé contre quelqu’un.
- source_word: τοῦ οἰκοδεσπότου
  choice: le maître du domaine
  rationale: Dans cette parabole agricole, οἰκοδεσπότης désigne celui qui dirige la maisonnée et le domaine. Cette formulation demeure naturelle tout en conservant l’idée d’autorité domestique portée par le terme grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La formulation conserve la valeur narrative du participe et la nuance inchoative possible de l’imparfait, sans surcharger le verset d’une note.
