  text: ⸂καὶ ἐλθόντες⸃ οἱ περὶ τὴν ἑνδεκάτην ὥραν ἔλαβον ἀνὰ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/009.yaml
  text: And those who came about the eleventh hour received a denarius each[a].
translation:
  language: fr
  text: Ceux qui étaient venus vers la onzième heure reçurent chacun un denier[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le denier était une monnaie romaine en argent, généralement considérée comme le salaire journalier habituel d’un ouvrier.
    reason: cultural_note
lexical_decisions:
- source_word: καὶ
  choice: omis explicitement
  rationale: En français, le lien narratif avec le verset précédent reste naturel sans traduire systématiquement καί par « et »; cela évite une coordination lourde en tête de phrase.
- source_word: ἐλθόντες
  choice: qui étaient venus
  rationale: Le plus-que-parfait rend naturellement en français l’action antérieure exprimée par le participe aoriste, sans ajouter l’idée d’embauche.
- source_word: οἱ περὶ τὴν ἑνδεκάτην ὥραν
  choice: Ceux qui étaient venus vers la onzième heure
  rationale: « Vers » conserve la valeur temporelle approximative de περί. La « onzième heure » maintient le système horaire historique de la parabole.
- source_word: ἔλαβον
  choice: reçurent
  rationale: Dans le contexte du paiement des ouvriers, « reçurent » exprime clairement qu’une somme leur fut remise.
- source_word: ἀνὰ
  choice: chacun
  rationale: Le distributif ἀνά indique que chaque personne reçut la même somme.
- source_word: δηνάριον
  choice: un denier
  rationale: « Denier » est le terme français traditionnel et intelligible pour le denarius romain; la note en précise la valeur approximative.
