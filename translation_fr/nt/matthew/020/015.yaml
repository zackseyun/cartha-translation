  text: Is it not lawful for me to do what I want with what is mine? Or is your eye evil because I am good?[a]
translation:
  language: fr
  text: N’ai-je pas le droit de faire ce que je veux de ce qui m’appartient ? Ou bien ton œil est-il mauvais parce que je suis bon ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Es-tu jaloux parce que je suis bon ? » L’expression « ton œil est mauvais » est un idiome qui évoque ici l’envie ou le ressentiment devant la générosité d’autrui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστίν
  choice: m’est-il permis
  rationale: Le verbe exprime ce qui est permis ou légitime. Cette formulation naturelle conserve la nuance de droit présente dans la question rhétorique.
- source_word: ὃ θέλω ποιῆσαι
  choice: faire ce que je veux
  rationale: Cette expression rend directement et naturellement la volonté personnelle exprimée par θέλω.
- source_word: ἐν τοῖς ἐμοῖς
  choice: de ce qui m’appartient
  rationale: La tournure grecque désigne les biens propres du maître. En français, « faire de ce qui m’appartient » exprime clairement son droit de disposer de ses biens.
- source_word: ὁ ὀφθαλμός σου πονηρός
  choice: ton œil est-il mauvais
  rationale: La traduction conserve l’image grecque de l’« œil mauvais », qui évoque ici l’envie ou le ressentiment devant la générosité d’autrui, sans réduire l’expression à une seule interprétation.
- source_word: ἀγαθός
  choice: bon
  rationale: « Bon » correspond au sens direct de l’adjectif et maintient le contraste explicite entre l’œil « mauvais » de l’ouvrier et la bonté du maître, tout en laissant entendre sa générosité dans le contexte.
theological_decisions:
- issue: Faut-il interpréter dans le texte l’expression ὁ ὀφθαλμός σου πονηρός ?
  choice: Conserver l’image « ton œil est-il mauvais » dans le texte principal.
  alternative: « Es-tu jaloux parce que je suis bon ? » ou « M’en veux-tu parce que je suis généreux ? »
  rationale: L’image source met en contraste l’« œil mauvais » de l’ouvrier et la bonté du maître. La conserver respecte la tension et la portée culturelle de l’expression; une note en explique le sens probable.
translation_notes:
  register: Français moderne, international et digne. La première question emploie une tournure juridique naturelle; la seconde conserve volontairement l’image sémitique transmise par le grec, avec une note explicative.
