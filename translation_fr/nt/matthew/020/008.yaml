  text: ὀψίας δὲ γενομένης λέγει ὁ κύριος τοῦ ἀμπελῶνος τῷ ἐπιτρόπῳ αὐτοῦ· Κάλεσον τοὺς ἐργάτας καὶ ἀπόδος ⸀αὐτοῖς τὸν μισθὸν ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/008.yaml
  text: When evening came, the master of the vineyard says to his steward, ‘Call the workers and pay them their wages, beginning with the last and ending with the first.’
translation:
  language: fr
  text: 'Le soir venu, le maître de la vigne dit à son intendant : « Appelle les ouvriers et verse-leur leur salaire, en commençant par les derniers pour finir par les premiers. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Le soir venu
  rationale: Formulation française naturelle et concise qui conserve la valeur temporelle de la tournure grecque.
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: le maître de la vigne
  rationale: « Maître » exprime ici le propriétaire ou responsable de la vigne sans introduire un titre divin absent du contexte immédiat.
- source_word: τῷ ἐπιτρόπῳ αὐτοῦ
  choice: à son intendant
  rationale: « Intendant » désigne naturellement la personne chargée d'administrer les affaires du maître et de payer les ouvriers.
- source_word: ἀπόδος αὐτοῖς τὸν μισθὸν
  choice: verse-leur leur salaire
  rationale: Le verbe ἀποδίδωμι implique de remettre ce qui est dû ; « verser le salaire » est idiomatique dans ce contexte d'emploi.
- source_word: ἀρξάμενος ἀπὸ τῶν ἐσχάτων ἕως τῶν πρώτων
  choice: en commençant par les derniers pour finir par les premiers
  rationale: Cette formulation restitue clairement l'ordre de paiement indiqué par le grec.
theological_decisions:
- issue: Présent historique λέγει
  choice: dit
  alternative: dit alors / lui dit au présent narratif « dit » identique en français
  rationale: Le présent historique grec anime le récit, mais le passé simple français est ici plus naturel dans une narration au passé et n'altère aucun enjeu théologique.
translation_notes:
  register: Français international moderne, clair et digne. Ponctuation française et dialogue direct conservés ; aucune note n'est nécessaire.
