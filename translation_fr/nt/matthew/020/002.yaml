source:
  edition: SBLGNT
  text: ⸂συμφωνήσας δὲ⸃ μετὰ τῶν ἐργατῶν ἐκ δηναρίου τὴν ἡμέραν ἀπέστειλεν αὐτοὺς εἰς τὸν ἀμπελῶνα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/020/002.yaml
  text: After agreeing with the workers for one denarius for the day[a], he sent them into his vineyard.
translation:
  language: fr
  text: Après s’être mis d’accord avec les ouvriers sur un denier pour la journée[a], il les envoya dans sa vigne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le denier était le salaire journalier habituel d’un ouvrier.
    reason: cultural_note
lexical_decisions:
- source_word: συμφωνήσας
  choice: Après s’être mis d’accord
  rationale: Le participe aoriste exprime ici une action antérieure au verbe principal. Cette formulation est naturelle en français et conserve l’idée d’un accord conclu.
- source_word: δὲ
  choice: —
  rationale: La particule assure une légère liaison narrative qui n’a pas besoin d’être explicitée en français dans cette construction.
- source_word: ἐργατῶν
  choice: ouvriers
  rationale: Terme courant et adapté à des travailleurs embauchés pour une tâche agricole.
- source_word: ἐκ δηναρίου
  choice: sur un denier
  rationale: Avec « se mettre d’accord », la préposition « sur » exprime naturellement le montant convenu, tout en conservant le nom de la monnaie antique.
- source_word: τὴν ἡμέραν
  choice: pour la journée
  rationale: Rend l’accusatif de durée et indique que le denier constitue la rémunération convenue pour la journée, sans ajouter de précision absente du grec.
- source_word: ἀπέστειλεν
  choice: il les envoya
  rationale: Traduction narrative directe et naturelle du verbe.
- source_word: ἀμπελῶνα
  choice: vigne
  rationale: En français, « vigne » désigne naturellement le terrain planté de ceps et convient au contexte.
- source_word: αὐτοῦ
  choice: sa
  rationale: Le possessif renvoie directement au propriétaire de la vigne.
