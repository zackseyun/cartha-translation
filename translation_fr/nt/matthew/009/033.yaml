  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκβληθέντος τοῦ δαιμονίου ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι λέγοντες· Οὐδέποτε ἐφάνη οὕτως ἐν τῷ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/033.yaml
  text: And when the demon had been cast out[a], the mute man spoke. And the crowds were amazed, saying, “Never has anything like this appeared in Israel.”
translation:
  language: fr
  text: 'Et quand le démon eut été chassé, l’homme muet[a] parla. Les foules s’étonnèrent en disant : « Jamais rien de pareil ne s’est vu en Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’homme sourd ». Le mot grec peut signifier « sourd » ou « muet ». Ici, le contexte favorise « muet », puisque le récit souligne qu’il parla.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβληθέντος
  choice: quand le démon eut été chassé
  rationale: Le participe aoriste passif dans une construction absolue marque une action antérieure à celle du verbe principal. Le passé antérieur exprime naturellement cette relation temporelle après « quand ».
- source_word: δαιμονίου
  choice: le démon
  rationale: Dans les récits d’exorcisme des Évangiles, « démon » rend directement et précisément δαιμόνιον.
- source_word: ἐλάλησεν
  choice: parla
  rationale: L’aoriste simple de λαλέω indique ici que l’homme a parlé, sans imposer la nuance supplémentaire « se mit à parler ».
- source_word: ὁ κωφός
  choice: l’homme muet
  rationale: κωφός peut désigner une personne sourde ou muette. Le contexte immédiat met l’accent sur la parole retrouvée; « homme » est explicité naturellement d’après le référent du verset précédent.
- source_word: ἐθαύμασαν
  choice: stupéfaites
  rationale: Le terme exprime un vif étonnement. « Stupéfaites » est actuel, naturel et suffisamment fort dans ce contexte.
- source_word: οἱ ὄχλοι
  choice: les foules
  rationale: Le pluriel grec est conservé par le pluriel français.
- source_word: Οὐδέποτε
  choice: Jamais
  rationale: Équivalent direct et idiomatique de l’adverbe grec.
- source_word: ἐφάνη οὕτως
  choice: rien de pareil ne s’est vu
  rationale: Le passif ἐφάνη peut idiomatiquement signifier « a été vu ». La tournure française rend naturellement l’affirmation d’un fait sans précédent, tandis que « de pareil » correspond à οὕτως.
- source_word: ἐν τῷ Ἰσραήλ
  choice: en Israël
  rationale: Formulation concise qui peut viser Israël comme peuple ou comme cadre national, conformément à l’expression grecque.
theological_decisions:
- issue: Étendue sémantique de κωφός dans ce récit de guérison et d’exorcisme
  choice: Traduire par « l’homme muet »
  alternative: « l’homme sourd »
  rationale: Le mot grec admet les deux sens, mais la proposition « parla » montre que le handicap mis en avant ici est l’incapacité de parler. Une note conserve toutefois l’autre sens possible sans ajouter au texte une seconde affection.
- issue: Sens contextuel de ἐφάνη
  choice: « rien de pareil ne s’est vu »
  alternative: « rien de pareil n’est apparu »
  rationale: Le passif grec permet les deux compréhensions. En français, « ne s’est vu » exprime plus naturellement l’expérience sans précédent dont témoignent les foules, sans modifier la portée théologique de leur réaction.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du déroulement grec tout en évitant les calques. « Stupéfaites » maintient la force de la réaction des foules; le discours direct est formulé de manière idiomatique.
