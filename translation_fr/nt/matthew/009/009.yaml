id: MAT.9.9
reference: Matthew 9:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ παράγων ὁ Ἰησοῦς ἐκεῖθεν εἶδεν ἄνθρωπον καθήμενον ἐπὶ τὸ τελώνιον, Μαθθαῖον λεγόμενον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι· καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/009.yaml
  text: And as Jesus was passing on from there[a], he saw a man called Matthew sitting at the tax booth, and he says to him[c][b], “Follow me.” And he rose and followed him.
translation:
  language: fr
  text: 'En passant de là, Jésus vit un homme appelé Matthieu, assis au poste de perception des taxes. Il lui dit : « Suis-moi. » Matthieu se leva et le suivit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων … ἐκεῖθεν
  choice: En quittant cet endroit
  rationale: Le participe présent décrit Jésus en mouvement à partir du lieu précédent. Cette formulation rend naturellement en français l’action en cours et la provenance exprimée par ἐκεῖθεν.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Dans ce contexte, le nom désigne un individu masculin précis.
- source_word: καθήμενον ἐπὶ τὸ τελώνιον
  choice: assis au poste de perception des taxes
  rationale: L’expression situe Matthieu à l’endroit où les taxes ou droits étaient perçus. « Poste de perception » reste concret sans évoquer à tort une administration fiscale moderne.
- source_word: Μαθθαῖον λεγόμενον
  choice: appelé Matthieu
  rationale: λεγόμενον introduit le nom sous lequel cet homme est connu; « appelé Matthieu » est direct et idiomatique.
- source_word: λέγει αὐτῷ
  choice: Il lui dit
  rationale: Le grec emploie un présent historique pour donner de la vivacité au récit. En français, « dit » est naturel dans la narration et sa forme coïncide avec celle du présent, sans alourdir le texte par une note peu utile.
- source_word: Ἀκολούθει μοι
  choice: Suis-moi
  rationale: L’impératif exprime directement l’appel à suivre Jésus, avec sa portée concrète et son implication de disciple, sans ajout explicatif.
- source_word: ἀναστὰς
  choice: Matthieu se leva
  rationale: Le participe aoriste indique l’action qui précède immédiatement le verbe principal. La reprise du nom évite toute ambiguïté en français sur le sujet.
- source_word: ἠκολούθησεν αὐτῷ
  choice: et le suivit
  rationale: La traduction conserve à la fois l’action concrète et sa portée de réponse à l’appel de Jésus.
theological_decisions:
- issue: Nature de l’appel adressé à Matthieu
  choice: « Suis-moi »
  alternative: « Deviens mon disciple » ou « Viens avec moi »
  rationale: Le contexte implique bien un appel à devenir disciple, mais la traduction garde la formulation sobre du grec sans expliciter davantage que le texte source.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit sans archaïsme marqué. « Poste de perception des taxes » évite le caractère trop moderne de « bureau des impôts » et le sens potentiellement trop étroit de « péage ».
