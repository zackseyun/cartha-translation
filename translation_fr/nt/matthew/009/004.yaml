id: MAT.9.4
reference: Matthew 9:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀εἰδὼς ὁ Ἰησοῦς τὰς ἐνθυμήσεις αὐτῶν εἶπεν· ⸀Ἱνατί ἐνθυμεῖσθε πονηρὰ ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/004.yaml
  text: And Jesus[a], knowing their thoughts, said, “Why are you thinking evil in your hearts?”
translation:
  language: fr
  text: 'Jésus, connaissant leurs pensées[a], dit : « Pourquoi avez-vous de mauvaises pensées dans vos cœurs ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ayant discerné leurs pensées ».'
    reason: Alternative lexicale pour εἰδὼς, qui peut mettre l’accent sur la perception plutôt que sur l’état de connaissance.
lexical_decisions:
- source_word: εἰδὼς
  choice: connaissant
  rationale: Le participe exprime ici la connaissance que Jésus a de leur réflexion intérieure. « Connaissant » reste concis, naturel et n’explicite pas au-delà du texte la manière dont il en a connaissance.
- source_word: ἐνθυμήσεις
  choice: pensées
  rationale: Le nom désigne des pensées ou raisonnements intérieurs. « Pensées » est l’équivalent français moderne le plus direct et convient au contexte.
- source_word: Ἱνατί
  choice: Pourquoi
  rationale: L’interrogatif demande la raison ou le motif ; « Pourquoi » en est l’équivalent naturel.
- source_word: ἐνθυμεῖσθε
  choice: avez-vous … pensées
  rationale: Cette formulation idiomatique en français exprime l’activité intérieure visée par le verbe grec et maintient le lien lexical avec « pensées », sans recourir à une tournure artificielle.
- source_word: πονηρὰ
  choice: de mauvaises
  rationale: L’adjectif neutre pluriel employé substantivement qualifie ici le contenu des pensées. « De mauvaises pensées » transmet naturellement ce jugement moral en français.
- source_word: καρδίαις
  choice: cœurs
  rationale: « Cœurs » conserve la métaphore biblique du siège intérieur de la pensée et de l’intention, au lieu de la réduire à l’intellect seul.
theological_decisions:
- issue: La connaissance par Jésus de pensées non exprimées
  choice: Jésus, connaissant leurs pensées
  alternative: Jésus, ayant discerné leurs pensées
  rationale: Le texte affirme que Jésus connaît leur raisonnement intérieur sans préciser ici par quel moyen. La traduction conserve cette affirmation et sa portée christologique sans la développer en proposition doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve « cœurs », image centrale du texte source, tout en rendant idiomatiquement le mauvais raisonnement intérieur.
