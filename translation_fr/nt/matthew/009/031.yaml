id: MAT.9.31
reference: Matthew 9:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἐξελθόντες διεφήμισαν αὐτὸν ἐν ὅλῃ τῇ γῇ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/031.yaml
  text: But after they went out[a], they spread the news about him throughout that whole region.
translation:
  language: fr
  text: Mais, une fois sortis, ils répandirent la nouvelle à son sujet dans toute cette région[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «dans tout ce pays» ou «sur tout ce territoire». Le mot grec γῆ peut désigner une terre, un pays, un territoire ou une région.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque le léger contraste avec l’ordre de silence donné par Jésus au verset précédent et rend naturellement le tournant du récit.
- source_word: ἐξελθόντες
  choice: une fois sortis
  rationale: Le participe aoriste exprime une action antérieure au verbe principal; cette formulation française conserve clairement la succession temporelle.
- source_word: διεφήμισαν
  choice: ils répandirent la nouvelle
  rationale: Le verbe désigne l’action de diffuser largement une information ou de faire connaître quelqu’un; cette tournure est naturelle en français moderne.
- source_word: αὐτὸν
  choice: à son sujet
  rationale: Avec «répandre la nouvelle», le pronom objet grec se rend idiomatiquement par un complément indiquant que Jésus est le sujet de la nouvelle diffusée.
- source_word: ἐν ὅλῃ τῇ γῇ ἐκείνῃ
  choice: dans toute cette région
  rationale: Dans ce contexte local, γῆ peut désigner une région, un territoire ou un pays; «région» évite d’exagérer l’étendue géographique et convient au récit.
theological_decisions:
- issue: Étendue géographique de γῆ
  choice: région
  alternative: pays; territoire
  rationale: Le contexte décrit une diffusion locale de la renommée de Jésus, sans imposer une portée nationale ou universelle. La note préserve toutefois l’amplitude lexicale du grec.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque; «une fois sortis» maintient la séquence du participe grec.
