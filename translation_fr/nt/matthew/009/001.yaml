id: MAT.9.1
reference: Matthew 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀ἐμβὰς ⸀εἰς πλοῖον διεπέρασεν καὶ ἦλθεν εἰς τὴν ἰδίαν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/001.yaml
  text: And after getting into a boat[a], he crossed over and came to his own city.
translation:
  language: fr
  text: Puis, après être monté dans une barque, il passa sur l’autre rive et se rendit dans sa propre ville[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la ville qui était la sienne ». Le texte grec ne la nomme pas; dans ce contexte du récit, il s’agit vraisemblablement de Capernaüm.
    reason: Préciser l’ambiguïté référentielle de l’expression grecque sans la résoudre dans le texte principal.
lexical_decisions:
- source_word: Καὶ
  choice: Puis
  rationale: Dans ce récit, la conjonction relie cet épisode au précédent. « Puis » rend naturellement cette progression narrative en français moderne.
- source_word: ἐμβὰς
  choice: après être monté dans
  rationale: Le participe aoriste exprime une action antérieure aux verbes principaux. Cette formulation préserve la séquence temporelle sans alourdir la phrase.
- source_word: πλοῖον
  choice: une barque
  rationale: Le terme désigne une embarcation; dans le contexte du lac de Galilée, « barque » est plus naturel et proportionné que « navire ».
- source_word: διεπέρασεν
  choice: il passa sur l’autre rive
  rationale: Le verbe désigne le fait de traverser d’un côté à l’autre, notamment une étendue d’eau. Cette expression française rend la direction implicite sans nommer explicitement le lac.
- source_word: ἦλθεν εἰς
  choice: se rendit dans
  rationale: Cette tournure exprime naturellement en français le déplacement vers la ville, tout en évitant l’ambiguïté déictique entre « venir » et « aller ».
- source_word: τὴν ἰδίαν πόλιν
  choice: sa propre ville
  rationale: La traduction garde l’idée d’appartenance ou d’association portée par ἰδίαν, sans préciser qu’il s’agit de sa ville natale ni nommer la ville.
theological_decisions:
- issue: Identification de « sa propre ville »
  choice: Conserver la formulation générale « sa propre ville »
  alternative: Identifier directement la ville comme Capernaüm ou traduire par « sa ville natale »
  rationale: Le texte grec ne nomme pas la ville et n’affirme pas qu’elle soit le lieu de naissance de Jésus. Le contexte peut orienter vers Capernaüm, mais cette identification ne doit pas être imposée dans le corps du texte.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve la succession des actions du grec tout en évitant un calque maladroit. « Sa propre ville » maintient volontairement l’indétermination du texte source.
