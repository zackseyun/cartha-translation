source:
  edition: SBLGNT
  text: τότε ἥψατο τῶν ὀφθαλμῶν αὐτῶν λέγων· Κατὰ τὴν πίστιν ὑμῶν γενηθήτω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/029.yaml
  text: Then he touched their eyes[a], saying, “According to your faith, let it be done for you.”
translation:
  language: fr
  text: 'Alors il leur toucha les yeux en disant : « Qu’il vous soit fait selon votre foi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qu’il vous soit fait selon votre confiance. » Le mot grec pistis peut aussi se traduire par « confiance » ou, dans certains contextes, par « fidélité ».'
    reason: Alternative lexicale pour πίστις; l’ancrage est placé sur « foi », le terme concerné.
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la progression immédiate du récit.
- source_word: ἥψατο τῶν ὀφθαλμῶν αὐτῶν
  choice: il leur toucha les yeux
  rationale: ἅπτομαι avec le génitif désigne ici un contact physique. Cette construction est idiomatique en français et conserve clairement les yeux comme partie du corps touchée.
- source_word: λέγων
  choice: en disant
  rationale: Rend le participe présent comme une action concomitante au geste de Jésus.
- source_word: Κατὰ τὴν πίστιν ὑμῶν
  choice: selon votre foi
  rationale: κατά avec l’accusatif exprime ici la conformité ou la mesure, sans imposer une causalité plus forte. « Foi » est le terme français usuel; dans ce contexte, il comporte la notion de confiance.
- source_word: γενηθήτω ὑμῖν
  choice: Qu’il vous soit fait
  rationale: Rend l’impératif aoriste à valeur de déclaration performative ainsi que le datif d’intérêt, dans un français digne et naturel.
theological_decisions:
- issue: Sens de πίστις dans une parole de guérison
  choice: foi
  alternative: confiance
  rationale: Le contexte met en avant la confiance des deux aveugles dans la capacité de Jésus à les guérir. « Foi » conserve toutefois le terme théologique courant sans réduire son champ sémantique; « confiance » est signalé en note.
- issue: Rapport entre la foi et l’accomplissement
  choice: selon votre foi
  alternative: sur la base de votre foi
  rationale: La traduction retenue préserve la correspondance exprimée par κατά sans transformer explicitement la foi en cause méritoire de la guérison.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « Qu’il vous soit fait » garde la solennité et la force performative de la parole tout en restant compréhensible.
