  rationale: La révision maintient le sens direct du grec tout en supprimant deux affirmations interprétatives excessives dans les notes. Elle améliore également la restitution du tumulte décrit par θορυβούμενον, sans imposer une lecture émotionnelle ou confessionnelle.
