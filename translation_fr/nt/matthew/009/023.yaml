source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν τοῦ ἄρχοντος καὶ ἰδὼν τοὺς αὐλητὰς καὶ τὸν ὄχλον θορυβούμενον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/023.yaml
  text: And when Jesus came into the ruler's house and saw the flute players and the crowd making a commotion[c][b][a],
translation:
  language: fr
  text: Quand Jésus arriva à la maison du dirigeant[a], il vit les joueurs de flûte[b] et la foule qui s’agitait bruyamment[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du notable ». Par comparaison avec les récits parallèles, il pourrait s’agir du chef de synagogue. Ici, Matthieu dit simplement « le dirigeant ».
    reason: alternative_reading
  - marker: b
    text: La présence de joueurs de flûte était courante lors des funérailles à cette époque.
    reason: cultural_note
  - marker: c
    text: Ou « qui était en plein tumulte ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: Quand Jésus arriva
  rationale: Le participe aoriste marque ici la circonstance temporelle et la succession narrative. Cette tournure est naturelle en français et en conserve la valeur.
- source_word: οἰκίαν
  choice: maison
  rationale: « Maison » est le sens direct et convient au cadre du récit.
- source_word: ἄρχοντος
  choice: dirigeant
  rationale: Le terme grec désigne largement une personne investie d'autorité. « Dirigeant » conserve cette généralité sans importer des récits parallèles l'identification plus précise de chef de synagogue.
- source_word: ἰδὼν
  choice: il vit
  rationale: Cette formulation rend simplement le participe narratif et s'intègre naturellement à la phrase française.
- source_word: αὐλητὰς
  choice: joueurs de flûte
  rationale: Le mot désigne des instrumentistes jouant de la flûte ou du chalumeau, notamment dans le contexte des lamentations funèbres.
- source_word: ὄχλον
  choice: foule
  rationale: Équivalent français courant et direct dans un récit.
- source_word: θορυβούμενον
  choice: qui faisait grand bruit
  rationale: Le participe décrit une foule bruyante et agitée. La formulation restitue le tumulte sans préciser indûment les émotions exprimées.
theological_decisions:
- issue: Identification du maître de maison
  choice: le dirigeant
  alternative: le notable ; le chef de synagogue
  rationale: Matthieu emploie seulement ἄρχων, terme général désignant une personne investie d'autorité. Le texte principal ne doit donc pas introduire l'identification plus précise fournie par les récits parallèles.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase suit la progression narrative grecque sans lourdeur participiale. « Dirigeant » reste volontairement général, tandis que les notes donnent les précisions lexicales et culturelles utiles.
