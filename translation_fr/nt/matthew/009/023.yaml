review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement la progression temporelle de ἐλθών, « maison », la généralité de ἄρχων, les joueurs de flûte, la foule et son tumulte. « Qui s’agitait bruyamment » exprime plus pleinement θορυβούμενον que « faisait grand bruit », en conservant l’idée d’agitation sans préciser la nature des lamentations.
  naturalness: La phrase révisée est naturelle en français international moderne et garde un registre narratif sobre. « Dirigeant » reste compréhensible et suffisamment général dans ce contexte.
  terminology: « Dirigeant » évite d’importer « chef de synagogue » dans le texte. La note correspondante doit présenter cette identification issue des parallèles comme une possibilité comparative, non comme un fait établi par Matthieu. La note culturelle ne doit pas affirmer que les joueurs de flûte étaient eux-mêmes des pleureurs professionnels.
  issues:
  - severity: medium
    issue: 'La note a affirme : « d’après les récits parallèles, il s’agit du chef de synagogue ».'
    rationale: Matthieu emploie ici seulement ἄρχων. Même si les récits parallèles peuvent éclairer l’identification, la formulation catégorique dépasse le texte de ce verset et risque une harmonisation.
  - severity: medium
    issue: La note b identifie les joueurs de flûte à des « pleureurs professionnels ».
    rationale: Le grec mentionne des joueurs de flûte et une foule agitée, sans qualifier les musiciens de pleureurs professionnels. Une note culturelle peut indiquer l’usage funéraire des flûtes sans fusionner ces catégories.
  - severity: low
    issue: « Qui faisait grand bruit » rend surtout l’aspect sonore de θορυβούμενον.
    rationale: Le participe évoque un tumulte ou une agitation bruyante ; « qui s’agitait bruyamment » restitue les deux dimensions.
  revised_text: Quand Jésus arriva à la maison du dirigeant[a], il vit les joueurs de flûte[b] et la foule qui s’agitait bruyamment[c].
