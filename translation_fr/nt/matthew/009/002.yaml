id: MAT.9.2
reference: Matthew 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ προσέφερον αὐτῷ παραλυτικὸν ἐπὶ κλίνης βεβλημένον. καὶ ἰδὼν ὁ Ἰησοῦς τὴν πίστιν αὐτῶν εἶπεν τῷ παραλυτικῷ· Θάρσει, τέκνον· ⸀ἀφίενταί ⸂σου αἱ ἁμαρτίαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/002.yaml
  text: And behold[a], they brought to him a paralytic lying on a bed. And when Jesus saw their faith, he said to the paralytic, “Take courage, child[c][b]; your sins are forgiven.”
translation:
  language: fr
  text: 'Et voici qu’on lui amena un paralysé, couché sur un lit. Voyant leur foi[a], Jésus dit au paralysé : « Courage, mon enfant ! Tes péchés sont pardonnés[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pluriel « leur » peut désigner le paralysé avec ceux qui l’amenaient, ou seulement le groupe de ceux qui le transportaient.
    reason: ambiguïté du référent
  - marker: b
    text: 'Autre traduction possible : « Tes péchés ont été pardonnés. »'
    reason: nuance aspectuelle
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction vive d’introduction et d’appel à l’attention, tout en restant naturelle dans un récit français moderne.
- source_word: προσέφερον
  choice: on lui amena
  rationale: Dans ce contexte narratif, l’imparfait grec présente l’action en cours sans imposer un imparfait français. Le pronom « on » rend naturellement le sujet pluriel indéfini, et « amena » exprime l’action d’approcher quelqu’un de Jésus sans réduire le verbe à la seule manière de le transporter.
- source_word: παραλυτικὸν
  choice: un paralysé
  rationale: Emploi substantivé concis et courant, sans ajouter explicitement « homme », absent du terme grec.
- source_word: ἐπὶ κλίνης βεβλημένον
  choice: couché sur un lit
  rationale: Rend naturellement la position décrite par le participe parfait. « Lit » constitue ici un équivalent sûr de κλίνη, contrairement à « natte », plus spécifique.
- source_word: πίστιν
  choice: foi
  rationale: Équivalent français usuel de πίστις, exprimant ici une confiance manifestée par l’action.
- source_word: Θάρσει
  choice: Courage
  rationale: Formule française directe et idiomatique de réconfort, qui conserve la force de l’impératif.
- source_word: τέκνον
  choice: mon enfant
  rationale: Restitue l’adresse affectueuse. Le possessif est idiomatique en français dans cette apostrophe et ne précise pas le sexe que le nom grec ne marque pas ici.
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Tes péchés sont pardonnés
  rationale: Le présent passif français rend clairement la déclaration au présent et laisse, comme le grec, l’agent du pardon inexprimé.
- source_word: ἁμαρτίαι
  choice: péchés
  rationale: Traduction standard qui conserve le pluriel concret des fautes.
theological_decisions:
- issue: Portée de τὴν πίστιν αὐτῶν
  choice: Conserver « leur foi » sans préciser qui est inclus dans le groupe.
  alternative: Comprendre seulement la foi des porteurs, ou seulement celle du paralysé.
  rationale: Le pluriel grec renvoie naturellement à plusieurs personnes, mais le texte ne permet pas de trancher avec certitude si le paralysé est inclus. La traduction et la note préservent cette ouverture.
- issue: Portée de la déclaration de pardon
  choice: Employer le passif « Tes péchés sont pardonnés ».
  alternative: « Tes péchés ont été pardonnés » ou une formulation nommant explicitement Dieu comme agent.
  rationale: Le grec annonce réellement le pardon tout en laissant son agent grammaticalement inexprimé. Le passif français préserve cette tension et n’ajoute pas d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Et voici que » conserve la vivacité narrative de Matthieu sans archaïsme marqué. « Courage, mon enfant ! » rend l’exhortation et la tendresse de l’adresse de manière idiomatique.
