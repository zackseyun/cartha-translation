id: MAT.9.25
reference: Matthew 9:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐξεβλήθη ὁ ὄχλος, εἰσελθὼν ἐκράτησεν τῆς χειρὸς αὐτῆς, καὶ ἠγέρθη τὸ κοράσιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/025.yaml
  text: But when the crowd had been put outside[a], he went in and took her by the hand, and the girl rose.
translation:
  language: fr
  text: Mais, une fois la foule mise dehors, il entra, prit la jeune fille par la main, et elle se releva.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle fut relevée ». Le verbe grec peut se comprendre dans les deux sens.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mais, une fois
  rationale: ὅτε introduit le cadre temporel et δέ marque une légère transition. « Mais, une fois » rend naturellement les deux éléments dans le récit.
- source_word: ἐξεβλήθη ὁ ὄχλος
  choice: la foule mise dehors
  rationale: Cette formulation conserve le passif de l’aoriste sans suggérer la violence que pourrait évoquer « chassée » dans ce contexte.
- source_word: εἰσελθὼν
  choice: il entra
  rationale: Le participe aoriste exprime ici une action antérieure ou séquentielle; une proposition verbale est plus naturelle en français.
- source_word: ἐκράτησεν τῆς χειρὸς αὐτῆς
  choice: prit la jeune fille par la main
  rationale: κρατέω avec le génitif signifie saisir ou prendre; « prendre par la main » est l’expression française naturelle. La répétition de « la jeune fille » évite une succession de pronoms potentiellement moins claire.
- source_word: ἠγέρθη
  choice: elle se releva
  rationale: L’aoriste passif de ἐγείρω peut décrire le fait de se lever ou d’être relevé. « Elle se releva » exprime naturellement le résultat sans préciser explicitement l’agent.
- source_word: τὸ κοράσιον
  choice: la jeune fille
  rationale: κοράσιον désigne une fille encore jeune; « la jeune fille » est clair, courant et digne en français moderne.
theological_decisions:
- issue: Valeur passive ou intransitive de ἠγέρθη dans un récit de retour à la vie
  choice: elle se releva
  alternative: elle fut relevée
  rationale: Le grec permet de mettre l’accent soit sur le fait qu’elle se releva, soit sur l’action par laquelle elle fut relevée. Le texte principal adopte une tournure française naturelle, tandis que la note conserve la possibilité passive sans imposer une interprétation supplémentaire.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide tout en conservant le passif de l’expulsion de la foule et l’ambiguïté de ἠγέρθη.
