source:
  edition: SBLGNT
  text: πορευθέντες δὲ μάθετε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν· οὐ γὰρ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/013.yaml
  text: 'But go and learn what this means: ‘I desire mercy and not sacrifice.’ For I did not come to call the righteous[c][b][a], but sinners.'
translation:
  language: fr
  text: 'Mais allez apprendre ce que cela signifie : « Je désire la miséricorde, et non le sacrifice. »[a] Car je ne suis pas venu appeler les justes, mais les pécheurs.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citation d’Osée 6.6.
    reason: cross_reference
  - marker: b
    text: « Les justes » peut désigner ici ceux qui se considèrent comme justes ; le grec laisse cette question ouverte.
    reason: alternative_reading
lexical_decisions:
- source_word: πορευθέντες δὲ μάθετε
  choice: Mais allez apprendre
  rationale: Le participe aoriste suivi de l’impératif forme une tournure idiomatique qui se rend naturellement en français par « allez apprendre », tout en conservant le ton de réprimande.
- source_word: τί ἐστιν
  choice: ce que signifie cette parole
  rationale: La formulation explicite naturellement qu’il s’agit de comprendre le sens de la citation; « cette parole » fournit un référent français clair sans développer son interprétation.
- source_word: Ἔλεος
  choice: la compassion
  rationale: Dans ce contexte, « compassion » exprime clairement la sollicitude concrète envers autrui visée par ἔλεος et convient au contraste prophétique avec le sacrifice.
- source_word: θέλω
  choice: Je désire
  rationale: « Désire » conserve la force volitive et le registre digne de la citation scripturaire.
- source_word: θυσίαν
  choice: le sacrifice
  rationale: Équivalent direct et conventionnel qui maintient le singulier ainsi que le contraste prophétique.
- source_word: οὐ γὰρ ἦλθον καλέσαι
  choice: Car je ne suis pas venu appeler
  rationale: Le passé composé est naturel en français pour présenter la mission qui motive l’action présente de Jésus; « appeler » préserve sans la préciser la portée de καλέσαι.
- source_word: δικαίους
  choice: les justes
  rationale: L’adjectif substantivé est rendu directement, sans ajouter que ces personnes seraient réellement justes ou se croiraient telles.
- source_word: ἁμαρτωλούς
  choice: les pécheurs
  rationale: Traduction française courante qui conserve le contraste moral net avec « les justes ».
theological_decisions:
- issue: Portée de la citation d’Osée 6.6
  choice: Conserver le contraste « la compassion, et non le sacrifice » sans l’expliciter.
  alternative: Paraphraser comme un rejet absolu de tout sacrifice, ou comme une simple préférence limitée à cette situation.
  rationale: La formulation prophétique exprime un contraste fort, mais le verset ne développe pas à lui seul une doctrine abolissant tout sacrifice; il faut préserver cette tension.
- issue: Référence de « les justes »
  choice: Traduire littéralement la catégorie sans signaler l’ironie dans le corps du texte.
  alternative: « ceux qui se croient justes » ou « les bien-pensants ».
  rationale: Le contexte peut suggérer une portée ironique, mais le grec dit seulement δικαίους. La traduction ne doit pas imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « allez apprendre » garde la vigueur de l’injonction; la citation conserve son parallélisme et sa tension prophétique.
