id: MAT.9.6
reference: Matthew 9:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— τότε λέγει τῷ παραλυτικῷ· ⸀Ἐγερθεὶς ἆρόν σου τὴν κλίνην καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/006.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins”—then he says to the paralytic[a], “Get up, pick up your bed[b], and go to your house.”
translation:
  language: fr
  text: 'Mais afin que vous sachiez que le Fils de l’homme[a] a sur la terre l’autorité de pardonner les péchés — alors il dit au paralysé : « Lève-toi, prends ton lit[b] et va chez toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Être humain » pour « le Fils de l’homme ». La traduction traditionnelle est retenue parce qu’elle préserve le titre employé par Jésus et sa probable résonance avec Daniel 7.
    reason: lexical_alternative
  - marker: b
    text: Ou « natte » ou « couche ». Le grec κλίνη peut désigner un lit, une couche ou un grabat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: Mais, afin que vous sachiez
  rationale: La formulation conserve à la fois la légère opposition marquée par δέ et la valeur finale de ἵνα, dans un français naturel.
- source_word: ἐξουσίαν ἔχει
  choice: a l’autorité
  rationale: ἐξουσία désigne ici l’autorité ou le droit légitime de pardonner, plutôt que la seule capacité d’accomplir un acte.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette traduction consacrée préserve le titre employé par Jésus ainsi que sa possible résonance avec Daniel 7.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: La locution rend directement la sphère terrestre indiquée par ἐπί avec le génitif.
- source_word: ἀφιέναι ἁμαρτίας
  choice: pardonner les péchés
  rationale: Dans ce contexte, ἀφίημι signifie remettre ou pardonner; cette formulation est claire et courante.
- source_word: τότε λέγει
  choice: Alors il dit
  rationale: Le présent français conserve le présent historique grec et sa vivacité narrative.
- source_word: τῷ παραλυτικῷ
  choice: au paralysé
  rationale: L’adjectif grec est substantivé. « Au paralysé » est concis, actuel et n’ajoute pas explicitement le nom « homme ».
- source_word: Ἐγερθεὶς
  choice: Lève-toi
  rationale: Bien que la forme grecque soit un participe aoriste, elle prend ici la force pratique d’une injonction dans une suite d’ordres.
- source_word: ἆρόν
  choice: prends
  rationale: αἴρω signifie ici soulever et emporter. « Prends » exprime naturellement l’ordre en français sans surtraduire le geste.
- source_word: κλίνην
  choice: lit
  rationale: κλίνη peut désigner un lit, une couche ou un grabat. « Lit » est le terme français le plus large et le moins interprétatif.
- source_word: ὕπαγε εἰς τὸν οἶκόν σου
  choice: rentre chez toi
  rationale: La tournure française exprime naturellement le mouvement vers sa propre maison impliqué par εἰς τὸν οἶκόν σου.
theological_decisions:
- issue: Titre christologique ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Être humain
  rationale: Le titre traditionnel maintient sa fonction de désignation de Jésus et sa probable portée daniélique, sans résoudre son ambiguïté par une paraphrase.
- issue: Nature de ἐξουσία dans le pardon des péchés
  choice: autorité
  alternative: pouvoir
  rationale: Le contexte met en avant l’autorité légitime de pardonner les péchés, et non simplement la puissance ou la capacité d’agir.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent historique est conservé. Les points de suspension avant la fermeture des guillemets signalent l’interruption de la déclaration adressée aux interlocuteurs, avant la parole donnée au paralysé.
