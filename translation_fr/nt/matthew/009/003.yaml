  text: καὶ ἰδού τινες τῶν γραμματέων εἶπαν ἐν ἑαυτοῖς· Οὗτος βλασφημεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/003.yaml
  text: And behold[a], some of the scribes said among themselves, “This man is blaspheming.”
translation:
  language: fr
  text: 'Et voici que quelques scribes se dirent en eux-mêmes[a] : « Cet homme blasphème. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se dirent entre eux ». L’expression grecque peut désigner une réflexion intérieure ou une réaction privée au sein du groupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple, conservée pour maintenir l’enchaînement du texte grec.
- source_word: ἰδού
  choice: voici que
  rationale: Cette tournure française actuelle restitue la fonction de ἰδού, qui attire l’attention et donne de la vivacité au récit.
- source_word: τινες τῶν γραμματέων
  choice: quelques spécialistes de la Loi
  rationale: τινες désigne une partie non précisée du groupe. Dans ce contexte, γραμματεῖς désigne des hommes versés dans l’étude et l’interprétation de la Loi; « spécialistes de la Loi » rend leur fonction plus clairement que le terme traditionnel « scribes ».
- source_word: εἶπαν ἐν ἑαυτοῖς
  choice: se dirent entre eux
  rationale: La formulation conserve le verbe « dire » et le caractère privé de leur réaction collective, sans réduire nécessairement l’expression à une pensée entièrement silencieuse. L’autre possibilité est signalée en note.
- source_word: Οὗτος
  choice: Cet homme
  rationale: Le démonstratif désigne Jésus de façon directe et peut porter ici une nuance de distance ou de mépris; « cet homme » reste naturel sans exagérer cette nuance.
- source_word: βλασφημεῖ
  choice: blasphème
  rationale: Le présent français exprime directement l’accusation formulée pendant la scène. Le verbe « blasphémer » conserve la portée religieuse du terme grec sans ajouter d’explication théologique.
theological_decisions:
- issue: Formulation de l’accusation portée contre Jésus
  choice: Cet homme blasphème
  alternative: Cet homme prononce un blasphème
  rationale: La traduction garde toute la force de l’accusation et la tension du récit, sans anticiper la réponse de Jésus ni expliquer pourquoi les spécialistes de la Loi jugent ses paroles blasphématoires.
translation_notes:
  register: Français international moderne, clair et digne. « Voici que » garde la vivacité narrative de l’original; « spécialistes de la Loi » privilégie la compréhension immédiate du rôle historique de ces hommes.
