  source_fidelity: La phrase conserve la coordination narrative, la fonction d’appel d’attention de ἰδού, le sous-groupe indéfini des γραμματεῖς et l’accusation directe au présent. Toutefois, « se dirent entre eux » présente la réaction comme un échange verbal entre plusieurs personnes, tandis que εἶπαν ἐν ἑαυτοῖς peut aussi—et dans ce contexte vraisemblablement—désigner une parole ou délibération intérieure. « Se dirent en eux-mêmes » reproduit cette formulation sans trancher indûment.
  naturalness: « Et voici que » et « Cet homme blasphème » sont naturels dans un registre biblique moderne et accessible. « Quelques scribes » est idiomatique, historiquement précis et moins explicatif que « spécialistes de la Loi ». « Se dirent en eux-mêmes » est une tournure française claire dans ce contexte; la note explicite l’autre compréhension possible.
  terminology: « Scribes » est le correspondant français usuel et suffisamment précis de γραμματεῖς; « spécialistes de la Loi » interprète leur fonction et peut rétrécir ou moderniser indûment le terme. « Blasphème » préserve exactement l’accusation, sans commentaire doctrinal.
