id: MAT.9.16
reference: Matthew 9:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδεὶς δὲ ἐπιβάλλει ἐπίβλημα ῥάκους ἀγνάφου ἐπὶ ἱματίῳ παλαιῷ· αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/016.yaml
  text: But no one puts a patch of unshrunk cloth on an old garment, for the patch pulls away from the garment, and a worse tear results.
translation:
  language: fr
  text: Mais personne ne pose une pièce d’étoffe non rétrécie[a] sur un vieux vêtement, car la pièce ajoutée arrache une partie du vêtement, et la déchirure devient pire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « d’étoffe non foulée » : le grec désigne une étoffe qui n’a pas encore été traitée et qui peut donc rétrécir et tirer sur le vieux vêtement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δὲ
  choice: Mais personne
  rationale: « Personne » conserve la portée universelle et non genrée de οὐδείς ; « mais » rend la transition légèrement contrastive marquée par δέ.
- source_word: ἐπιβάλλει ἐπίβλημα
  choice: ne pose une pièce
  rationale: ἐπιβάλλει signifie appliquer ou poser sur ; « pose » évite de préciser inutilement le procédé de couture, tandis que « pièce » désigne naturellement une pièce destinée à réparer un vêtement.
- source_word: ῥάκους ἀγνάφου
  choice: d’étoffe non rétrécie
  rationale: Le syntagme désigne une étoffe qui n’a pas encore subi le traitement qui la ferait notamment rétrécir. Cette formulation rend clairement l’élément pratique de l’image.
- source_word: ἐπὶ ἱματίῳ παλαιῷ
  choice: sur un vieux vêtement
  rationale: « Vêtement » garde la portée assez générale de ἱμάτιον, et « vieux » traduit directement παλαιός.
- source_word: αἴρει γὰρ τὸ πλήρωμα αὐτοῦ ἀπὸ τοῦ ἱματίου
  choice: car la pièce tire sur le vêtement
  rationale: Dans cette image, τὸ πλήρωμα désigne la pièce qui comble l’accroc. « Tire sur » exprime la tension exercée sur le vieux tissu sans imposer plus précisément que le grec la manière dont elle l’emporte ou s’en détache.
- source_word: καὶ χεῖρον σχίσμα γίνεται
  choice: et la déchirure s’aggrave
  rationale: Cette formulation française naturelle conserve le comparatif χεῖρον et l’idée de résultat exprimée par γίνεται.
theological_decisions: []
translation_notes:
  register: Français international actuel, simple et digne. L’image concrète est conservée sans expliciter son application théologique ni ajouter que l’étoffe serait « neuve », terme absent du grec.
