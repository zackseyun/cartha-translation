  text: ἔλεγεν γὰρ ἐν ἑαυτῇ· Ἐὰν μόνον ἅψωμαι τοῦ ἱματίου αὐτοῦ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/021.yaml
  text: For she was saying to herself[a], “If only I touch his garment, I will be saved.”
translation:
  language: fr
  text: 'Car elle se disait en elle-même : « Si seulement je touche son vêtement, je serai sauvée[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je serai guérie » ou « je serai rétablie ». Le grec dit littéralement « je serai sauvée », avec un verbe qui peut aussi désigner la guérison dans ce contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: se disait
  rationale: L’imparfait exprime une parole intérieure en cours ou répétée ; « se disait » restitue naturellement cet aspect en français.
- source_word: γὰρ
  choice: Car
  rationale: Le connecteur introduit l’explication de ce qui précède ; « car » en conserve la valeur explicative dans un registre digne et courant.
- source_word: ἐν ἑαυτῇ
  choice: en elle-même
  rationale: L’expression désigne une parole intérieure. « En elle-même » reste idiomatique et conserve plus directement la formulation grecque.
- source_word: Ἐὰν μόνον
  choice: Si seulement
  rationale: Cette tournure exprime à la fois la condition et l’idée que ce seul geste suffira.
- source_word: ἅψωμαι
  choice: je touche
  rationale: Après ἐάν, le subjonctif aoriste présente une éventualité future ; le présent français est naturel dans la proposition conditionnelle. Ici, le verbe signifie simplement « toucher ».
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: son vêtement
  rationale: ἱμάτιον peut désigner un vêtement, notamment extérieur. « Vêtement » évite de préciser sans nécessité qu’il s’agit d’un manteau.
- source_word: σωθήσομαι
  choice: je serai sauvée
  rationale: Le futur passif de σῴζω possède une portée plus large que la seule guérison, bien que le contexte soit celui d’une guérison physique. La traduction conserve cette largeur lexicale, avec une note explicative.
theological_decisions:
- issue: Traduction de σωθήσομαι dans un récit de guérison
  choice: je serai sauvée
  alternative: je serai guérie ; je serai rétablie
  rationale: Le contexte immédiat vise la guérison corporelle, mais le grec emploie σῴζω, verbe pouvant aussi signifier sauver. Garder « sauvée » préserve l’amplitude et la possible résonance théologique du terme sans imposer une interprétation ; la note indique clairement le sens contextuel.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le lien explicatif et la parole intérieure, tandis que la note rend accessible la polysémie de σῴζω.
