id: MAT.9.14
reference: Matthew 9:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε προσέρχονται αὐτῷ οἱ μαθηταὶ Ἰωάννου λέγοντες· Διὰ τί ἡμεῖς καὶ οἱ Φαρισαῖοι νηστεύομεν ⸀πολλά, οἱ δὲ μαθηταί σου οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/014.yaml
  text: Then John's disciples came to him[a], saying, “Why do we and the Pharisees fast often, but your disciples do not fast?”
translation:
  language: fr
  text: 'Alors les disciples de Jean s’approchèrent de Jésus et lui demandèrent : « Pourquoi jeûnons-nous souvent[a], nous et les pharisiens, tandis que tes disciples ne jeûnent pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beaucoup » ou « à de nombreuses reprises » ; le grec πολλά, associé au verbe « jeûner », exprime une pratique fréquente.
    reason: Alternative lexicale rendant la valeur adverbiale de πολλά.
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la progression du récit et introduit l’événement suivant.
- source_word: προσέρχονται αὐτῷ
  choice: s’approchèrent de Jésus
  rationale: Le présent historique grec est rendu par le passé simple, temps courant du récit écrit en français. Le référent du pronom est explicité par « Jésus » pour éviter une formulation française ambiguë.
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: les disciples de Jean
  rationale: Formulation française naturelle du génitif, avec la forme traditionnelle et courante du nom Ἰωάννης.
- source_word: λέγοντες
  choice: et lui demandèrent
  rationale: Dans ce contexte, le participe introduit une question adressée à Jésus. « Lui demandèrent » restitue naturellement sa fonction sans ajouter de contenu.
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et idiomatique.
- source_word: ἡμεῖς καὶ οἱ Φαρισαῖοι
  choice: nous et les pharisiens
  rationale: Conserve le pronom grec emphatique ainsi que l’association explicite des disciples de Jean avec les pharisiens.
- source_word: νηστεύομεν
  choice: jeûnons
  rationale: Terme français usuel et précis pour l’abstention de nourriture pratiquée dans un cadre religieux.
- source_word: πολλά
  choice: souvent
  rationale: Employé adverbialement avec « jeûner », πολλά indique ici une pratique fréquente. « Souvent » est l’équivalent français le plus naturel.
- source_word: οἱ δὲ μαθηταί σου
  choice: tandis que tes disciples
  rationale: « Tandis que » exprime clairement le contraste marqué par δέ sans durcir la question en accusation.
- source_word: οὐ νηστεύουσιν
  choice: ne jeûnent pas
  rationale: Le présent décrit vraisemblablement une pratique habituelle, en contraste avec « jeûnons souvent ».
theological_decisions:
- issue: Nature du reproche concernant le jeûne
  choice: Présenter la question comme une comparaison entre pratiques habituelles de jeûne.
  alternative: Faire entendre que les disciples de Jésus enfreignent une obligation, ou limiter la question à un seul jour de jeûne.
  rationale: Les présents νηστεύομεν et νηστεύουσιν, associés à πολλά, évoquent un comportement habituel. La traduction conserve la tension de la question sans transformer celle-ci en jugement doctrinal explicite.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique écrit sans être archaïque. La reprise détachée « nous et les pharisiens » garde l’emphase du grec tout en produisant une question naturelle.
