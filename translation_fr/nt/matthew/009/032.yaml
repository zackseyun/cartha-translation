id: MAT.9.32
reference: Matthew 9:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Αὐτῶν δὲ ἐξερχομένων ἰδοὺ προσήνεγκαν αὐτῷ ⸀ἄνθρωπον κωφὸν δαιμονιζόμενον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/032.yaml
  text: As they were going out[a], behold, they brought to him a mute[c][b], demon-possessed man.
translation:
  language: fr
  text: Comme ils sortaient, voici qu’on lui amena un homme muet[a], sous l’emprise d’un démon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sourd ». Le mot grec peut signifier « muet » ou « sourd » selon le contexte. Le verset suivant, qui précise que l’homme parla, favorise ici « muet ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « possédé par un démon »; littéralement, « démonisé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτῶν δὲ ἐξερχομένων
  choice: Comme ils sortaient
  rationale: Le génitif absolu exprime la simultanéité, tandis que δέ accompagne la transition narrative. Cette formulation française restitue naturellement le cadre temporel sans alourdir la phrase.
- source_word: ἰδοὺ
  choice: voici que
  rationale: « Voici que » conserve la fonction de mise en relief et la vivacité narrative de ἰδού dans un registre français digne et actuel.
- source_word: προσήνεγκαν αὐτῷ
  choice: on lui amena
  rationale: Le pluriel grec a un sujet non précisé. Le pronom indéfini « on » est naturel en français, et « lui » rend explicitement αὐτῷ.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Dans ce récit, le nom désigne un individu masculin; « homme » en conserve la référence.
- source_word: κωφὸν
  choice: muet
  rationale: κωφός peut désigner une personne sourde ou muette selon le contexte. Le verset suivant, où l’homme se met à parler, favorise ici « muet ».
- source_word: δαιμονιζόμενον
  choice: sous l’emprise d’un démon
  rationale: Cette expression française claire rend l’affliction démoniaque indiquée par le participe sans définir plus précisément que le grec la nature ou le degré de cette emprise.
theological_decisions:
- issue: Description de l’affliction démoniaque
  choice: sous l’emprise d’un démon
  alternative: possédé par un démon; démonisé
  rationale: Le récit présente sans détour une affliction démoniaque réelle. « Sous l’emprise d’un démon » l’affirme tout en évitant d’introduire une théorie particulière sur la distinction entre possession et oppression.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici que » maintient la mise en relief narrative du grec; « sous l’emprise d’un démon » préserve la réalité de l’affliction sans ajouter de précision doctrinale absente du texte.
