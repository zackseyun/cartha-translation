  text: ὁ δὲ Ἰησοῦς ⸀στραφεὶς καὶ ἰδὼν αὐτὴν εἶπεν· Θάρσει, θύγατερ· ἡ πίστις σου σέσωκέν σε. καὶ ἐσώθη ἡ γυνὴ ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/022.yaml
  text: But Jesus[a], turning and seeing her, said, “Take courage, daughter[d][c][b]; your faith has saved you.” And the woman was healed from that hour.
translation:
  language: fr
  text: 'Mais Jésus se retourna, la vit et dit : « Courage, ma fille ! Ta foi t’a sauvée.[a] » Et la femme fut guérie à partir de ce moment-là.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ta foi t’a guérie » ou « Ta foi t’a rétablie ». Le verbe grec peut signifier sauver, guérir ou rétablir ; le texte principal en conserve ici le sens le plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς καὶ ἰδὼν αὐτήν
  choice: se retourna, la vit
  rationale: Les deux participes aoristes décrivent les actions qui précèdent la parole de Jésus. Deux verbes coordonnés donnent en français moderne un récit naturel sans modifier leur enchaînement.
- source_word: Θάρσει
  choice: Courage !
  rationale: Cette formule brève et idiomatique exprime directement l’exhortation à reprendre courage.
- source_word: θύγατερ
  choice: ma fille
  rationale: En français, « ma fille » est l’adresse familiale naturelle qui conserve la tendresse du vocatif grec sans ajouter d’adjectif affectif.
- source_word: ἡ πίστις σου
  choice: ta foi
  rationale: « Foi » conserve le terme religieux large, tout en permettant ici la nuance de confiance personnelle.
- source_word: σέσωκέν σε
  choice: t’a sauvée
  rationale: Le parfait de σῴζω peut désigner le salut aussi bien que la guérison. « T’a sauvée » préserve cette amplitude dans la parole de Jésus.
- source_word: ἐσώθη ἡ γυνή
  choice: la femme fut guérie
  rationale: Dans la conclusion narrative, le contexte physique rend explicite le sens de guérison du même verbe σῴζω.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: dès ce moment
  rationale: Cette tournure française naturelle exprime qu’à partir de cet instant la guérison était acquise, sans imposer le sens moderne d’une heure entière.
theological_decisions:
- issue: Portée de σῴζω dans la parole de Jésus et dans la conclusion narrative
  choice: « t’a sauvée » dans la parole, puis « fut guérie » dans le récit
  alternative: « t’a guérie » ou « t’a rendue bien portante » dans la parole de Jésus
  rationale: La variation française maintient la résonance plus large de la déclaration de Jésus tout en indiquant clairement son résultat physique immédiat. Elle ne réduit donc pas silencieusement σῴζω à la seule guérison.
- issue: Sens de πίστις
  choice: foi
  alternative: confiance
  rationale: « Foi » rend le terme grec de manière stable et garde sa portée théologique, tandis que la confiance est ici une nuance contextuelle possible plutôt qu’un sens à substituer obligatoirement.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le discours direct reste chaleureux et concis. « Dès ce moment » est préféré au littéral « depuis cette heure », peu naturel dans ce contexte.
