  text: καὶ ἐγερθεὶς ὁ Ἰησοῦς ⸀ἠκολούθει αὐτῷ καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/019.yaml
  text: And Jesus rose and followed him, and his disciples did too.
translation:
  language: fr
  text: Jésus se leva et le suivit, ainsi que ses disciples.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθεὶς
  choice: se leva
  rationale: Le participe aoriste passif est employé ici avec un sens intransitif. « Se leva » exprime naturellement en français le mouvement qui précède l’action principale.
- source_word: ἠκολούθει
  choice: suivit
  rationale: L’imparfait grec présente l’action en cours dans le récit, mais le passé simple convient naturellement à la progression narrative en français. Le verbe « suivre » conserve le sens concret de déplacement derrière quelqu’un.
- source_word: αὐτῷ
  choice: le
  rationale: Le datif est régi par ἀκολουθέω. En français, « suivre » est transitif direct; le pronom renvoie au notable mentionné au verset précédent.
- source_word: μαθηταὶ
  choice: disciples
  rationale: « Disciples » est le terme courant et précis dans les Évangiles pour désigner ceux qui suivent Jésus comme maître.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: accompagné de ses disciples
  rationale: Cette formulation française naturelle indique que les disciples de Jésus le suivent eux aussi, sans répéter lourdement le verbe. Le possessif renvoie à Jésus.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase conserve la concision narrative du grec tout en évitant une coordination elliptique peu naturelle en français.
