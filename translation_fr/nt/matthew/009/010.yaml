id: MAT.9.10
reference: Matthew 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο αὐτοῦ ἀνακειμένου ἐν τῇ οἰκίᾳ, ⸀καὶ ἰδοὺ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ ἐλθόντες συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/010.yaml
  text: And as he was reclining at table in the house[a], behold[b], many tax collectors and sinners came and were reclining at table with Jesus and his disciples.
translation:
  language: fr
  text: Pendant que Jésus était à table[a] dans la maison[b], voici que beaucoup de collecteurs d’impôts et de pécheurs vinrent s’installer à table avec lui et ses disciples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « était allongé à table ». Lors des repas, on prenait habituellement place sur des couches autour de la table.
    reason: lexical_alternative
  - marker: b
    text: Le texte dit simplement « dans la maison » sans préciser explicitement, dans ce verset, à qui elle appartenait.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο αὐτοῦ ἀνακειμένου
  choice: Pendant que Jésus était à table
  rationale: La tournure καὶ ἐγένετο introduit ici la scène et sa circonstance temporelle. Cette formulation naturelle en français conserve cette fonction narrative; « était à table » indique le contexte du repas, tandis qu’une note précise la posture exprimée par ἀνάκειμαι.
- source_word: ἐν τῇ οἰκίᾳ
  choice: dans la maison
  rationale: Le grec désigne simplement « la maison » sans préciser dans ce verset à qui elle appartient; la traduction évite donc d’ajouter « chez Matthieu » ou « chez lui ».
- source_word: ἰδοὺ
  choice: voici que
  rationale: Ce marqueur attire vivement l’attention sur l’arrivée inattendue du groupe. « Voici que » en conserve le relief narratif dans un français digne et compréhensible.
- source_word: τελῶναι
  choice: collecteurs d’impôts
  rationale: Expression française actuelle et claire pour les agents chargés de percevoir les taxes, groupe socialement déconsidéré dans le contexte évangélique.
- source_word: ἁμαρτωλοὶ
  choice: pécheurs
  rationale: L’adjectif substantivé désigne des personnes qualifiées de pécheurs; le terme français conserve la portée morale et religieuse sans l’expliciter davantage.
- source_word: ἐλθόντες συνανέκειντο
  choice: vinrent s’installer à table avec
  rationale: La formulation rend naturellement l’arrivée suivie de la participation au repas. « Avec » conserve la valeur du préfixe συν- et donc l’idée de table partagée.
- source_word: τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ
  choice: avec lui et ses disciples
  rationale: Le pronom évite une répétition lourde après la mention explicite de Jésus au début de la phrase; « disciples » reste le terme français établi pour μαθηταί.
theological_decisions:
- issue: Posture au repas et communion de table
  choice: Employer « était à table » et « s’installer à table avec », avec une note sur la posture antique
  alternative: « était allongé à table » et « étaient allongés à table avec »
  rationale: Le texte grec évoque la posture couchée propre aux repas de l’époque et souligne le repas partagé. Le corps du texte reste naturel en français moderne, tandis que la note préserve la précision historique et l’importance de la communion de table.
- issue: Identification de la maison
  choice: Ne pas préciser à qui appartient la maison
  alternative: « dans sa maison » ou « chez Matthieu »
  rationale: Le syntagme grec dit seulement « dans la maison ». Même si le contexte peut orienter l’interprétation, ce verset ne nomme pas explicitement le propriétaire; la traduction conserve cette indétermination.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au récit écrit, tandis que « pendant que » marque clairement l’arrière-plan temporel. « Voici que » maintient le relief du marqueur grec sans recourir à l’archaïque « voici, » isolé.
