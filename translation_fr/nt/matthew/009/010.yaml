review_pass:
  verdict: approve
  source_fidelity: Le texte rend fidèlement la construction narrative καὶ ἐγένετο… ἀνακειμένου par « Pendant que Jésus était à table », sans surcharger l’idiome grec. « Dans la maison » conserve l’absence d’identification du propriétaire. « Voici que » restitue bien ἰδού. Les collecteurs d’impôts et les pécheurs viennent partager la table avec Jésus et ses disciples; « vinrent s’installer à table avec lui et ses disciples » exprime naturellement cette séquence et la commensalité indiquée par συνανέκειντο.
  naturalness: Le français est moderne, fluide et adapté à un récit écrit. Le contraste entre l’imparfait d’arrière-plan (« était ») et le passé simple événementiel (« vinrent ») est idiomatique. « Voici que » est vivant sans être archaïsant, et la reprise pronominale « avec lui » est parfaitement claire après « Jésus ».
  terminology: « Collecteurs d’impôts », « pécheurs » et « disciples » sont des équivalents établis, précis et compréhensibles en français international. Le choix plus idiomatique « à table » est correctement complété par une note qui signale la posture antique plus spécifique de ἀνάκειμαι.
