reference: Matthew 9:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ παράγοντι ἐκεῖθεν τῷ Ἰησοῦ ἠκολούθησαν ⸀αὐτῷ δύο τυφλοὶ κράζοντες καὶ λέγοντες· Ἐλέησον ἡμᾶς, ⸀υἱὲ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/027.yaml
  text: And as Jesus was passing on from there[a], two blind men followed him, crying out and saying, “Have mercy on us, Son of David.”
translation:
  language: fr
  text: 'Comme Jésus s’éloignait de là, deux aveugles le suivirent en criant : « Aie pitié de nous, Fils de David[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Fils de David » est un titre royal et messianique qui présente Jésus comme l’héritier promis de la lignée de David.
    reason: cross_reference
lexical_decisions:
- source_word: παράγοντι ἐκεῖθεν τῷ Ἰησοῦ
  choice: Comme Jésus repartait de là
  rationale: Le participe présent situe l’action pendant que Jésus s’éloigne de cet endroit. « Repartait de là » rend naturellement le mouvement et l’enchaînement du récit sans suggérer qu’il ne faisait que passer près des aveugles.
- source_word: ἠκολούθησαν αὐτῷ
  choice: le suivirent
  rationale: Le verbe désigne ici concrètement le fait d’aller derrière Jésus; le passé simple convient au récit suivi en français.
- source_word: δύο τυφλοὶ
  choice: deux aveugles
  rationale: L’adjectif substantivé masculin pluriel désigne deux hommes aveugles. En français courant, « deux aveugles » est idiomatique et n’exige pas l’ajout de « hommes ».
- source_word: κράζοντες καὶ λέγοντες
  choice: en criant
  rationale: κράζω exprime un appel fort et pressant. En français, les deux participes grecs sont naturellement réunis dans « en criant », suivi directement des paroles; « en criant et en disant » serait lourd et artificiel.
- source_word: Ἐλέησον ἡμᾶς
  choice: Aie pitié de nous
  rationale: Cette formule rend directement l’impératif et l’appel à une intervention compatissante. Elle est naturelle, digne et immédiatement compréhensible.
- source_word: υἱὲ Δαυίδ
  choice: Fils de David
  rationale: La traduction littérale conserve le titre royal et messianique employé par Matthieu, au lieu de le réduire à la simple indication généalogique « descendant de David ».
theological_decisions:
- issue: Portée messianique de « Fils de David »
  choice: Conserver « Fils de David » comme titre dans le texte principal.
  alternative: Expliciter dans le texte « Messie, fils de David » ou rendre simplement « descendant de David ».
  rationale: Le grec emploie le titre traditionnel sans explication ajoutée. Le conserver respecte à la fois sa résonance royale et messianique et la manière dont le récit de Matthieu en déploie le sens.
translation_notes:
  register: Français international moderne, narratif et digne. La tournure grecque participiale est restructurée avec naturel, tandis que l’urgence de l’appel et le titre christologique sont préservés. Le marqueur de note est placé après l’expression qu’il explique.
