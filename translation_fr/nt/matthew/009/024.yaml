base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/024.yaml
  text: He was saying[a], “Go away, for the girl has not died, but is sleeping.” And they were laughing at him.
translation:
  language: fr
  text: 'Il disait : « Retirez-vous, car la jeune fille n’est pas morte, mais elle dort. » Et ils se moquaient de lui[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « riaient de lui ». Le verbe grec désigne un rire moqueur dirigé contre quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: Il disait
  rationale: L’imparfait grec présente la parole comme en cours ou répétée dans la scène. L’imparfait français en rend naturellement l’aspect sans ajouter de complément absent du grec.
- source_word: Ἀναχωρεῖτε
  choice: Retirez-vous
  rationale: L’impératif pluriel demande aux personnes présentes de s’éloigner. « Retirez-vous » est clair, digne et direct en français moderne.
- source_word: οὐ γὰρ ἀπέθανεν
  choice: car … n’est pas morte
  rationale: γάρ introduit la raison de l’ordre. Bien que ἀπέθανεν désigne l’événement de la mort, « n’est pas morte » exprime naturellement en français le constat nié dans ce contexte immédiat.
- source_word: τὸ κοράσιον
  choice: la jeune fille
  rationale: κοράσιον désigne une fille encore jeune. « La jeune fille » reste naturel et indique l’âge sans employer le registre vieilli de « jeune fille » au sens de femme non mariée ni accentuer indûment la petitesse.
- source_word: ἀλλὰ καθεύδει
  choice: mais elle dort
  rationale: Le présent grec décrit l’action ou l’état actuel. « Elle dort » conserve l’image simple et frappante ainsi que son contraste avec la mort.
- source_word: κατεγέλων αὐτοῦ
  choice: ils se moquaient de lui
  rationale: Le verbe exprime un rire dirigé contre quelqu’un, donc moqueur. L’imparfait français conserve l’aspect imperfectif du grec, tandis que « se moquaient » rend explicitement la dérision.
theological_decisions:
- issue: La déclaration selon laquelle la jeune fille « n’est pas morte » mais « dort »
  choice: Conserver littéralement l’opposition entre la mort et le sommeil, sans explication interprétative dans le texte.
  alternative: Ajouter « seulement », ou préciser que « dormir » est ici une métaphore de la mort.
  rationale: Le grec maintient une tension narrative et théologique sans expliquer la portée exacte des paroles de Jésus. La traduction ne doit pas décider à la place du texte si le sommeil est métaphorique, phénoménologique ou anticipatoire.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe reste concise et orale dans les paroles rapportées. « Retirez-vous » garde la fermeté de l’impératif sans lourdeur, et « elle dort » préserve la formulation provocante du grec.
