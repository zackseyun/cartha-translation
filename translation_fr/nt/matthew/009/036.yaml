id: MAT.9.36
reference: Matthew 9:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ τοὺς ὄχλους ἐσπλαγχνίσθη περὶ αὐτῶν ὅτι ἦσαν ἐσκυλμένοι καὶ ἐρριμμένοι ⸀ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/036.yaml
  text: And when he saw the crowds[a], he had compassion on them, because they were harassed and cast down, like sheep without a shepherd.
translation:
  language: fr
  text: En voyant les foules, il fut saisi de compassion pour elles, parce qu’elles étaient malmenées et abattues[a], comme des brebis qui n’ont pas de berger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « épuisées et désemparées ». Les termes grecs peuvent aussi être compris, de manière plus interprétative, comme décrivant des personnes à bout de forces et incapables de prendre soin d’elles-mêmes.
    reason: alternative lexicale
lexical_decisions:
- source_word: Ἰδὼν δὲ τοὺς ὄχλους
  choice: En voyant les foules
  rationale: Le participe aoriste Ἰδών exprime ici naturellement la circonstance temporelle. « En voyant » conserve la relation participiale, tandis que δέ, simple liaison narrative, n’a pas besoin d’être rendu séparément en français.
- source_word: ἐσπλαγχνίσθη περὶ αὐτῶν
  choice: il fut saisi de compassion pour elles
  rationale: Le verbe σπλαγχνίζομαι désigne une compassion profonde. Cette formulation française actuelle en préserve l’intensité sans reproduire littéralement l’image viscérale grecque.
- source_word: ὅτι ἦσαν
  choice: parce qu’elles étaient
  rationale: ὅτι introduit explicitement la cause de la compassion de Jésus ; « parce que » rend clairement ce rapport.
- source_word: ἐσκυλμένοι
  choice: malmenées
  rationale: Le participe peut évoquer des personnes tourmentées, rudoyées ou épuisées par ce qu’elles subissent. « Malmenées » conserve l’idée de mauvais traitements sans imposer un agent précis.
- source_word: καὶ ἐρριμμένοι
  choice: et abattues
  rationale: Le participe de ῥίπτω évoque littéralement le fait d’avoir été jeté à terre. « Abattues » garde en français à la fois l’image de la chute et l’état d’accablement, tout en restant idiomatique.
- source_word: ὡσεὶ πρόβατα μὴ ἔχοντα ποιμένα
  choice: comme des brebis qui n’ont pas de berger
  rationale: La comparaison pastorale est conservée directement. La proposition relative est naturelle en français et maintient l’idée de vulnérabilité faute de berger.
theological_decisions:
- issue: Expression de la compassion de Jésus
  choice: il fut saisi de compassion pour elles
  alternative: il eut compassion d’elles
  rationale: Le choix retenu exprime la profondeur de l’émotion indiquée par le grec sans recourir à une tournure vieillie ni ajouter une interprétation doctrinale.
- issue: État des foules
  choice: malmenées et abattues
  alternative: épuisées et désemparées
  rationale: La formulation principale reste proche des images passives de mauvais traitement et de mise à terre. L’alternative rend plus explicitement l’état de vulnérabilité qui en résulte, mais elle est plus interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Foules », « compassion » et « berger » conservent le registre biblique courant sans archaïsme. L’accord féminin des pronoms et participes reprend grammaticalement « les foules ».
