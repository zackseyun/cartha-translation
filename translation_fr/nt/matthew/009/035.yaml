id: MAT.9.35
reference: Matthew 9:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ περιῆγεν ὁ Ἰησοῦς τὰς πόλεις πάσας καὶ τὰς κώμας, διδάσκων ἐν ταῖς συναγωγαῖς αὐτῶν καὶ κηρύσσων τὸ εὐαγγέλιον τῆς βασιλείας καὶ θεραπεύων πᾶσαν νόσον καὶ πᾶσαν ⸀μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/035.yaml
  text: And Jesus went throughout all the cities and villages[b][a], teaching in their synagogues and proclaiming the good news of the kingdom and healing every disease and every sickness.
translation:
  language: fr
  text: Jésus parcourait toutes les villes et tous les villages. Il enseignait dans leurs synagogues, proclamait la bonne nouvelle du royaume et guérissait toute maladie et toute infirmité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιῆγεν
  choice: parcourait
  rationale: L’imparfait grec présente une activité itinérante en cours ou répétée. « Parcourait » l’exprime naturellement et sans expansion.
- source_word: τὰς πόλεις πάσας καὶ τὰς κώμας
  choice: toutes les villes et tous les villages
  rationale: Cette formulation conserve la distinction entre les centres urbains et les localités plus petites, tout en rendant explicitement en français la portée de πάσας sur l’ensemble coordonné.
- source_word: διδάσκων
  choice: enseignait
  rationale: Le participe exprime une activité simultanée et continue; une forme verbale coordonnée est plus naturelle en français.
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: dans leurs synagogues
  rationale: « Synagogues » conserve le terme historique et religieux, tandis que « leurs » rend explicitement αὐτῶν.
- source_word: κηρύσσων
  choice: proclamait
  rationale: « Proclamait » restitue la dimension publique et déclarative de κηρύσσω sans la connotation ecclésiastique plus étroite que peut avoir « prêchait ».
- source_word: τὸ εὐαγγέλιον τῆς βασιλείας
  choice: la bonne nouvelle du royaume
  rationale: « Bonne nouvelle » communique directement le sens de εὐαγγέλιον en français moderne; le génitif « du royaume » demeure intact sans préciser abusivement sa relation sémantique.
- source_word: θεραπεύων
  choice: guérissait
  rationale: Dans le contexte des guérisons de Jésus, « guérissait » est la formulation française la plus directe et naturelle.
- source_word: πᾶσαν νόσον
  choice: toute maladie
  rationale: « Maladie » est l’équivalent courant de νόσος et convient à l’affirmation de portée générale.
- source_word: πᾶσαν μαλακίαν
  choice: toute infirmité
  rationale: μαλακία peut désigner la faiblesse ou l’affection physique. « Infirmité » maintient une distinction lexicale avec νόσος et reste compréhensible dans ce contexte.
theological_decisions:
- issue: Rendu de εὐαγγέλιον
  choice: bonne nouvelle
  alternative: Évangile
  rationale: Le grec désigne une bonne nouvelle annoncée. Le choix retenu en rend le sens de façon transparente sans effacer la portée théologique de l’expression.
- issue: Portée de πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: toute maladie et toute infirmité
  alternative: toutes sortes de maladies et d’infirmités
  rationale: La répétition de πᾶσαν soutient le rendu distributif « toute… et toute… ». La traduction conserve ainsi la formulation globale du texte sans l’atténuer ni l’interpréter.
translation_notes:
  register: Français international moderne, simple et digne. La longue phrase grecque est divisée en deux phrases pour une lecture naturelle; les trois participes sont rendus par des verbes coordonnés à l’imparfait afin de conserver leur simultanéité et leur aspect continu.
