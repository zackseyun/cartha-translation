id: MAT.9.12
reference: Matthew 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀκούσας ⸀εἶπεν· Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/012.yaml
  text: But when he heard it[a], he said, “Those who are well have no need of a physician, but those who are sick do.”
translation:
  language: fr
  text: 'Mais Jésus, ayant entendu cela, dit : « Ce ne sont pas les bien-portants qui ont besoin d’un médecin, mais les malades. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: ayant entendu cela
  rationale: Le participe aoriste exprime ici une circonstance antérieure ou concomitante à la parole. « Cela » restitue naturellement en français l’objet implicite fourni par le contexte.
- source_word: δὲ
  choice: Mais
  rationale: 'La particule marque une transition légèrement adversative : Jésus réagit aux propos qui précèdent.'
- source_word: εἶπεν
  choice: dit
  rationale: Traduction directe du verbe courant λέγω, sans renforcer indûment le sens en « répondit ».
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Ce ne sont pas … qui ont besoin
  rationale: Cette tournure française naturelle conserve l’idée d’avoir besoin tout en mettant en relief le contraste entre les deux groupes.
- source_word: οἱ ἰσχύοντες
  choice: les bien-portants
  rationale: Dans l’opposition médicale avec οἱ κακῶς ἔχοντες, le participe désigne idiomatiquement les personnes en bonne santé. « Bien-portants » préserve une légère coloration proverbiale.
- source_word: ἰατροῦ
  choice: d’un médecin
  rationale: ἰατρός désigne un médecin; l’article indéfini convient naturellement en français après « avoir besoin de ».
- source_word: οἱ κακῶς ἔχοντες
  choice: les malades
  rationale: L’expression idiomatique signifie ici ceux qui vont mal physiquement, donc « les malades », en contraste net avec « les bien-portants ».
theological_decisions:
- issue: Sens médical littéral et application spirituelle
  choice: Conserver dans le verset la formulation médicale proverbiale.
  alternative: Expliciter que les « malades » représentent les pécheurs ayant besoin de Jésus.
  rationale: Le contexte fournit l’application spirituelle, tandis que cette phrase elle-même reste formulée comme un constat médical. Ne pas expliciter l’image préserve sa force et la tension du texte.
- issue: Sujet implicite de εἶπεν
  choice: Nommer Jésus pour obtenir une reprise française claire.
  alternative: Employer seulement « il dit », au plus près de la forme grecque.
  rationale: Le grec permet aisément un sujet pronominal implicite. En français isolé, « Jésus » identifie sans ambiguïté le locuteur, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La structure antithétique et la tonalité proverbiale sont conservées; « bien-portants » est courant tout en étant légèrement plus soutenu que « ceux qui vont bien ».
