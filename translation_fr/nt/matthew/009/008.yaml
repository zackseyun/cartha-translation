id: MAT.9.8
reference: Matthew 9:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ὄχλοι ⸀ἐφοβήθησαν καὶ ἐδόξασαν τὸν θεὸν τὸν δόντα ἐξουσίαν τοιαύτην τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/008.yaml
  text: But when the crowds saw it[a], they were afraid and glorified God[b], who had given such authority to men.
translation:
  language: fr
  text: Mais quand les foules virent cela, elles eurent peur[a] et glorifièrent Dieu, qui avait donné une telle autorité aux êtres humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elles furent saisies de crainte ». Le verbe grec signifie littéralement « avoir peur », mais cette peur peut comporter ici une dimension de respect émerveillé.
    reason: lexical_alternative
  - marker: b
    text: Ou « aux hommes ». Le terme grec peut désigner les êtres humains en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: quand les foules virent cela
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français. « Cela » explicite sobrement l’objet sous-entendu dans le contexte, à savoir ce qui vient de se produire.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition narrative avec une légère nuance de contraste.
- source_word: οἱ ὄχλοι
  choice: les foules
  rationale: Le pluriel grec est conservé; « foules » est courant et plus actuel que « multitudes ».
- source_word: ἐφοβήθησαν
  choice: elles eurent peur
  rationale: Le sens lexical premier est la peur. Cette formulation préserve la force et l’ambivalence de la réaction, sans la réduire à la seule admiration révérencielle.
- source_word: ἐδόξασαν
  choice: glorifièrent
  rationale: « Glorifier » conserve le poids théologique du verbe δοξάζω ainsi que sa valeur d’action dirigée vers Dieu.
- source_word: τὸν θεὸν
  choice: Dieu
  rationale: Traduction directe et usuelle du complément d’objet.
- source_word: τὸν δόντα
  choice: qui avait donné
  rationale: Le participe aoriste attributif est naturellement rendu par une proposition relative; le plus-que-parfait situe le don avant la réaction des foules.
- source_word: ἐξουσίαν
  choice: autorité
  rationale: ἐξουσία désigne ici une autorité ou prérogative, et non simplement une puissance.
- source_word: τοιαύτην
  choice: une telle
  rationale: Cette expression rend naturellement la qualité ou la nature remarquable de l’autorité évoquée.
- source_word: τοῖς ἀνθρώποις
  choice: aux êtres humains
  rationale: ἄνθρωποι peut désigner les humains en général. Cette formulation moderne évite que « aux hommes » soit compris comme visant exclusivement les personnes de sexe masculin, tout en conservant le pluriel surprenant du grec.
theological_decisions:
- issue: Nature de la réaction des foules
  choice: elles eurent peur
  alternative: elles furent saisies de crainte / d’un profond respect
  rationale: Le verbe grec exprime directement la peur, même si le contexte peut y associer une crainte révérencielle. Le texte principal ne tranche pas cette tension en faveur du seul émerveillement.
- issue: Portée de τοῖς ἀνθρώποις
  choice: aux êtres humains
  alternative: aux hommes
  rationale: Le substantif grec désigne ici naturellement l’humanité ou des êtres humains, sans imposer une référence exclusivement masculine. Le pluriel est maintenu afin de ne pas effacer la tension créée par l’autorité exercée par Jésus mais décrite comme donnée aux humains.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, tandis que « glorifièrent » et « autorité » conservent les termes théologiquement importants. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
