reference: Matthew 9:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἔλεγον· Ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/034.yaml
  text: But the Pharisees were saying[a], “By the ruler of the demons he casts out the demons.”
translation:
  language: fr
  text: 'Mais les pharisiens disaient : « C’est par le chef des démons qu’il chasse les démons. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste entre la réaction positive de la foule au verset précédent et l’interprétation hostile des pharisiens.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française courante du groupe juif, avec l’article défini du grec.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec exprime une parole en cours ou répétée; l’imparfait français en conserve naturellement l’aspect sans trancher entre ces nuances.
- source_word: Ἐν τῷ ἄρχοντι
  choice: C’est par le chef
  rationale: ἐν suivi du datif a ici une valeur instrumentale. La tournure « C’est par… que » rend clairement la source de pouvoir alléguée et reste naturelle en français.
- source_word: ἄρχοντι
  choice: chef
  rationale: « Chef » exprime simplement l’autorité exercée sur les démons. « Prince » serait traditionnel mais risquerait d’évoquer d’abord un titre nobiliaire; « dirigeant » serait moins naturel dans ce contexte.
- source_word: τῶν δαιμονίων
  choice: des démons
  rationale: Le génitif désigne les êtres sur lesquels ce chef exerce son autorité.
- source_word: ἐκβάλλει
  choice: il chasse
  rationale: Dans un contexte d’exorcisme, « chasser » est le verbe français courant et précis pour expulser des démons.
- source_word: τὰ δαιμόνια
  choice: les démons
  rationale: Le terme grec est rendu directement, avec l’article défini, sans atténuer la portée surnaturelle de l’accusation.
theological_decisions:
- issue: Sens instrumental de ἐν τῷ ἄρχοντι
  choice: C’est par le chef des démons qu’il chasse les démons
  alternative: C’est au nom du chef des démons qu’il chasse les démons
  rationale: Le grec indique le moyen ou l’agent invoqué par les accusateurs, sans préciser qu’il s’agirait d’une formule prononcée « au nom de » quelqu’un. La traduction retenue préserve cette accusation sans l’amplifier.
- issue: Traduction de δαιμόνια dans le contexte d’un exorcisme
  choice: démons
  alternative: esprits mauvais
  rationale: Le texte emploie δαιμόνια, et non πνεύματα. « Démons » est l’équivalent lexical direct et conserve toute la portée théologique de l’affirmation.
translation_notes:
  register: Français international moderne, clair et digne. La construction emphatique « C’est par… que » rend idiomatiquement la valeur instrumentale du grec. « Pharisiens » prend une minuscule conformément à l’usage français courant pour les membres d’un groupe religieux ancien.
