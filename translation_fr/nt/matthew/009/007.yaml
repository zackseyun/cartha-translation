  text: Et il se leva et s’en alla chez lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction de coordination simple qui maintient l’enchaînement narratif sans ajouter une nuance temporelle absente du grec.
- source_word: ἐγερθεὶς
  choice: il se leva
  rationale: Le participe aoriste passif de ἐγείρω a ici un sens intransitif. Cette formulation naturelle exprime clairement le fait de se mettre debout.
- source_word: ἀπῆλθεν
  choice: rentra
  rationale: Dans ce contexte, le mouvement de départ aboutit à sa propre demeure. « Rentra » rend naturellement en français l’idée qu’il quitta les lieux pour retourner chez lui.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: chez lui
  rationale: Expression française idiomatique pour un mouvement vers la demeure d’une personne; elle transmet le sens de οἶκος αὐτοῦ sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La coordination répétée reproduit le rythme bref du récit grec, tandis que « rentra chez lui » évite le tour peu naturel « partit vers sa maison ».
