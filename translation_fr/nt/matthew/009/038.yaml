id: MAT.9.38
reference: Matthew 9:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ἐκβάλῃ ἐργάτας εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/038.yaml
  text: Therefore pray earnestly to the Lord of the harvest that he would send out workers into his harvest[a].
translation:
  language: fr
  text: Priez donc avec insistance le Seigneur de la moisson d’envoyer des ouvriers dans sa moisson[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec est plus énergique que le simple « envoyer » et peut aussi évoquer l’idée de « chasser dehors » ; dans ce contexte, il désigne l’envoi d’ouvriers dans la moisson.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεήθητε
  choice: Priez avec insistance
  rationale: L’impératif de δέομαι exprime une demande pressante adressée dans la prière. Cette formulation conserve à la fois le cadre de la prière et son caractère insistant.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence de l’affirmation précédente sur l’abondance de la moisson et le petit nombre d’ouvriers.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » rend l’autorité de celui à qui appartient la moisson tout en conservant le titre biblique sans préciser davantage son identité.
- source_word: θερισμοῦ
  choice: moisson
  rationale: Le sens courant de θερισμός est « moisson ». L’image de la récolte est conservée plutôt que paraphrasée.
- source_word: ὅπως
  choice: de
  rationale: Après « prier quelqu’un », l’infinitif introduit naturellement en français le contenu de la demande et rend ici la construction grecque de manière idiomatique.
- source_word: ἐκβάλῃ
  choice: envoyer
  rationale: Dans ce contexte, le verbe désigne l’action de dépêcher des ouvriers dans la moisson. « Envoyer » est naturel en français, tandis qu’une note signale la force inhabituelle du verbe grec.
- source_word: ἐργάτας
  choice: ouvriers
  rationale: « Ouvriers » désigne clairement ceux qui accomplissent le travail de la moisson et s’accorde naturellement avec cette métaphore.
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: dans sa moisson
  rationale: La préposition εἰς exprime l’entrée dans la sphère ou la tâche de la moisson. Cette traduction conserve le possessif sans ajouter le mot « champs », absent du grec.
theological_decisions:
- issue: Identité du « Seigneur de la moisson »
  choice: Conserver le titre « le Seigneur de la moisson » sans en préciser le référent.
  alternative: Identifier explicitement le Seigneur comme le Père, comme Jésus ou plus généralement comme Dieu.
  rationale: Le verset lui-même ne précise pas davantage l’identité du référent. La traduction préserve donc l’ambiguïté et évite d’imposer une conclusion doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Priez avec insistance » exprime l’urgence sans archaïsme ; « ouvriers » maintient naturellement l’image agricole.
