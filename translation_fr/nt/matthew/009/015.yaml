id: MAT.9.15
reference: Matthew 9:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος πενθεῖν ἐφ’ ὅσον μετ’ αὐτῶν ἐστιν ὁ νυμφίος; ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/015.yaml
  text: And Jesus said to them[a], “The wedding attendants cannot mourn as long as the bridegroom is with them, can they? But days will come when the bridegroom is taken away from them[b], and then they will fast.”
translation:
  language: fr
  text: 'Jésus leur dit : « Les compagnons du marié[a] peuvent-ils être en deuil tant que le marié est avec eux ? Mais des jours viendront où le marié leur sera enlevé[b] ; alors ils jeûneront. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les fils de la salle des noces », expression qui désigne les compagnons du marié ou les participants à la noce.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sera retiré du milieu d’eux ». La formulation passive suggère plus qu’un départ ordinaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱοὶ τοῦ νυμφῶνος
  choice: les compagnons du marié
  rationale: Littéralement « les fils de la salle des noces », cette expression idiomatique désigne ceux qui accompagnent le marié et participent à la célébration. « Les compagnons du marié » restitue clairement ce rôle social en français moderne.
- source_word: πενθεῖν
  choice: être en deuil
  rationale: Le verbe signifie mener deuil, pleurer ou s'affliger. « Être en deuil » convient au contexte nuptial et maintient le contraste avec le jeûne.
- source_word: ἐφ’ ὅσον
  choice: tant que
  rationale: Cette locution rend naturellement la durée exprimée par le grec.
- source_word: νυμφίος
  choice: le marié
  rationale: « Le marié » est le terme courant en français moderne et conserve l'image nuptiale sans explicitation interprétative.
- source_word: ἀπαρθῇ
  choice: leur sera enlevé
  rationale: Le passif suggère qu'il ne s'agit pas d'un simple départ. Cette formulation préserve la possible idée d'un retrait imposé sans préciser davantage son sens.
- source_word: νηστεύσουσιν
  choice: ils jeûneront
  rationale: Traduction directe et naturelle du futur grec.
- source_word: Μὴ δύνανται ... ;
  choice: peuvent-ils ... ?
  rationale: La question introduite par μή appelle une réponse négative. En français, sa formulation interrogative suffit naturellement à faire entendre cette attente dans le contexte.
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: Mais des jours viendront
  rationale: Cette tournure française conserve l'expression temporelle et la légère opposition marquée par δέ.
theological_decisions:
- issue: Portée christologique possible de l'image du marié
  choice: Conserver l'image du marié sans identifier explicitement Jésus au marié messianique.
  alternative: Développer la traduction afin de présenter Jésus comme le marié messianique.
  rationale: Le verset laisse fonctionner la métaphore et permet au lecteur d'en percevoir la portée. Une explicitation doctrinale dépasserait ce que le texte énonce directement.
- issue: Nuance de l'enlèvement du marié
  choice: Employer le passif « leur sera enlevé » sans préciser l'agent ni expliquer l'événement.
  alternative: Paraphraser comme un départ ordinaire ou identifier explicitement cet enlèvement à la mort de Jésus.
  rationale: Le passif grec évoque plus qu'un simple départ et peut annoncer la mort de Jésus, mais le texte laisse l'agent et l'accomplissement implicites.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve la question rhétorique, le contraste temporel et la métaphore nuptiale. Les notes signalent l'idiome grec et la nuance du passif sans alourdir le corps du verset.
