reference: Matthew 9:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε λέγει τοῖς μαθηταῖς αὐτοῦ· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/037.yaml
  text: Then he says to his disciples[a], “The harvest indeed is plentiful[b], but the workers are few.”
translation:
  language: fr
  text: 'Alors il dit[a] à ses disciples : « La moisson est abondante[b], mais les ouvriers sont peu nombreux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie un présent narratif : « il dit ». En français, cette forme peut aussi se comprendre comme un passé simple selon le contexte.'
    reason: lexical_alternative
  - marker: b
    text: Ou « grande ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession dans le récit, sans alourdir par « à ce moment-là ».
- source_word: λέγει
  choice: il dit
  rationale: Conserve le présent narratif grec. En français, la forme écrite « dit » peut aussi correspondre au passé simple, mais le contexte et la note signalent la valeur du grec.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: à ses disciples
  rationale: Rend explicitement le possessif αὐτοῦ et emploie le terme français courant pour μαθηταί.
- source_word: Ὁ μὲν ... οἱ δὲ
  choice: … mais …
  rationale: Le couple μέν…δέ établit ici un contraste. En français naturel, « mais » suffit à en exprimer la force sans recourir à la tournure lourde « d’une part… d’autre part ».
- source_word: θερισμός
  choice: moisson
  rationale: Préserve l’image agricole et constitue l’équivalent biblique et courant adapté au contexte.
- source_word: πολύς
  choice: abondante
  rationale: Dans son association avec « moisson », ce terme exprime clairement la grande quantité indiquée par πολύς. « Grande » reste une traduction possible, plus formelle.
- source_word: ἐργάται
  choice: ouvriers
  rationale: Désigne naturellement ceux qui travaillent à la moisson et préserve le lien avec le travail agricole.
- source_word: ὀλίγοι
  choice: peu nombreux
  rationale: Rend directement le contraste quantitatif avec la moisson abondante, dans un français plus naturel que « sont peu ».
theological_decisions:
- issue: Portée métaphorique de la moisson
  choice: Conserver la métaphore agricole sans en expliciter le référent dans le verset.
  alternative: Paraphraser en précisant que la moisson représente les personnes prêtes à accueillir le ministère de Jésus.
  rationale: Le texte présente l’image sans l’expliquer dans ce verset. L’expliciter dans la traduction introduirait une interprétation qui appartient au contexte.
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et conserve le contraste ainsi que la métaphore du texte grec. Les marqueurs des notes ont été placés sur les mots auxquels les variantes se rapportent.
