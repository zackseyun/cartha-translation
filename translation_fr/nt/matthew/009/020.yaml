source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ γυνὴ αἱμορροοῦσα δώδεκα ἔτη προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/020.yaml
  text: And behold[b][a], a woman who had been suffering from bleeding for twelve years came up behind him and touched the fringe of his garment.
translation:
  language: fr
  text: Et voici qu’une femme qui souffrait de pertes de sang depuis douze ans s’approcha par-derrière et toucha la frange[a][b] de son vêtement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gland », « bordure » ou « ourlet ». Le terme grec peut désigner la frange ou le bord d’un vêtement et peut aussi renvoyer au gland fixé au bord d’un vêtement selon la pratique juive.
    reason: lexical_alternative
  - marker: b
    text: Voir Nombres 15.38 et Deutéronome 22.12 pour l’arrière-plan des franges ou glands prescrits aux Israélites.
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Et voici que
  rationale: Conserve le marqueur narratif qui attire l’attention et introduit un événement frappant, dans une formulation française actuelle et digne.
- source_word: γυνὴ αἱμορροοῦσα
  choice: une femme qui souffrait de pertes de sang
  rationale: Le participe exprime un saignement continu. « Pertes de sang » évoque naturellement une affection chronique sans suggérer, comme pourrait le faire « hémorragie », une crise aiguë.
- source_word: δώδεκα ἔτη
  choice: depuis douze ans
  rationale: Cette tournure française exprime naturellement une situation qui durait encore au moment du récit.
- source_word: προσελθοῦσα ὄπισθεν
  choice: s’approcha par-derrière
  rationale: Rend le mouvement vers Jésus et précise qu’elle venait de derrière, sans alourdir la phrase.
- source_word: ἥψατο
  choice: toucha
  rationale: Dans ce contexte, le moyen ἥψατο désigne un contact; « toucha » n’exagère pas celui-ci en parlant de saisir ou d’agripper.
- source_word: τοῦ κρασπέδου
  choice: la frange
  rationale: κράσπεδον peut désigner la bordure, l’ourlet ou une frange, éventuellement un gland rituel. « Frange » préserve cette amplitude et la possible portée juive sans imposer une reconstruction précise.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: de son vêtement
  rationale: ἱμάτιον désigne ici un vêtement, probablement extérieur; le terme général « vêtement » évite de préciser indûment « manteau » ou « robe ».
theological_decisions:
- issue: Possible portée juive de κράσπεδον comme frange ou gland fixé au bord du vêtement
  choice: Employer « frange » dans le texte principal et signaler les autres possibilités ainsi que l’arrière-plan légal en notes.
  alternative: Employer « gland » pour mettre en avant l’allusion possible aux prescriptions d’Israël, ou « ourlet » pour privilégier le simple bord du vêtement.
  rationale: Le mot grec permet plusieurs nuances et le verset ne développe pas explicitement leur symbolisme. « Frange » maintient la possibilité d’un lien avec le vêtement juif sans transformer cette possibilité en certitude.
translation_notes:
  register: Français international moderne, naturel et digne. « Et voici que » garde la vivacité narrative sans archaïsme marqué; « pertes de sang » reste compréhensible et convient à une affection prolongée.
