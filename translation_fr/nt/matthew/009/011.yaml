source:
  edition: SBLGNT
  text: καὶ ἰδόντες οἱ Φαρισαῖοι ⸀ἔλεγον τοῖς μαθηταῖς αὐτοῦ· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίει ὁ διδάσκαλος ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/011.yaml
  text: And when the Pharisees saw it[a], they were saying to his disciples, “Why does your teacher eat with tax collectors and sinners?”
translation:
  language: fr
  text: 'En voyant cela[a], les pharisiens disaient à ses disciples : « Pourquoi votre maître mange-t-il avec les collecteurs d’impôts et les pécheurs ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Ayant vu, les pharisiens disaient à ses disciples… » Le participe grec ne précise pas ce qu’ils ont vu; le contexte renvoie à la scène du repas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: En voyant cela
  rationale: Le participe aoriste est rendu par une construction temporelle naturelle en français. « Cela » explicite sobrement l’objet implicite, à savoir la scène du repas évoquée par le contexte.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait français préserve naturellement l’aspect imperfectif du verbe grec.
- source_word: μαθηταῖς
  choice: disciples
  rationale: Terme courant dans le récit évangélique, il conserve la relation entre maître et disciples.
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et idiomatique.
- source_word: τελωνῶν
  choice: collecteurs d’impôts
  rationale: Expression actuelle et claire pour désigner cette profession socialement stigmatisée, sans technicité excessive.
- source_word: ἁμαρτωλῶν
  choice: pécheurs
  rationale: Rendu direct du terme grec, qui peut ici désigner une catégorie à la fois morale et sociale sans que la traduction tranche davantage.
- source_word: ἐσθίει
  choice: mange-t-il
  rationale: Le présent grec est conservé dans la question; « manger avec » exprime simplement le partage du repas.
- source_word: διδάσκαλος
  choice: maître
  rationale: Dans la relation pédagogique avec des disciples, « maître » est naturel et dignifié en français, sans introduire le titre plus spécifique de « rabbi ».
theological_decisions:
- issue: Explicitation de l’objet de « voir »
  choice: « cela » est ajouté dans le texte avec une note
  alternative: « En voyant, les pharisiens… »
  rationale: Le grec ne formule aucun objet, mais le français naturel en appelle un ici. « Cela » renvoie à la scène du repas sans ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « disaient » conserve la nuance aspectuelle du grec. La formulation maintient l’accusation sociale contenue dans « collecteurs d’impôts et pécheurs » sans l’expliquer dans le corps du verset.
