source:
  edition: SBLGNT
  text: οὐδὲ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή γε, ῥήγνυνται οἱ ἀσκοί, καὶ ὁ οἶνος ἐκχεῖται καὶ οἱ ἀσκοὶ ⸀ἀπόλλυνται· ἀλλὰ βάλλουσιν οἶνον νέον εἰς ἀσκοὺς καινούς, καὶ ἀμφότεροι συντηροῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/017.yaml
  text: Nor do they put new wine into old wineskins. Otherwise[a], the wineskins burst, and the wine is spilled, and the wineskins are ruined. Rather, they put new wine into fresh wineskins, and both are preserved.
translation:
  language: fr
  text: On ne met pas non plus du vin nouveau dans de vieilles outres. Sinon, les outres éclatent, le vin se répand et les outres sont perdues. Au contraire, on met le vin nouveau dans des outres neuves[a], et le vin comme les outres sont préservés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie deux adjectifs différents : le vin est « nouveau » (νέος), tandis que les outres sont « neuves » (καινός), c’est-à-dire nouvelles par leur état.'
    reason: Préciser une distinction lexicale présente dans le texte grec et difficile à reproduire pleinement en français.
lexical_decisions:
- source_word: οὐδὲ βάλλουσιν
  choice: On ne met pas non plus
  rationale: Cette tournure française naturelle conserve le lien négatif avec l’exemple précédent et rend βάλλουσιν sans suggérer l’idée trop forte de jeter.
- source_word: οἶνον νέον
  choice: du vin nouveau
  rationale: Expression française courante pour du vin récemment produit; elle conserve le contraste avec les vieilles outres.
- source_word: ἀσκοὺς παλαιούς
  choice: de vieilles outres
  rationale: « Outres » désigne précisément les récipients de peau anciens, et « vieilles » rend directement leur âge et leur état.
- source_word: εἰ δὲ μή γε
  choice: Sinon
  rationale: Rend de façon concise et idiomatique la condition négative et les conséquences qui en découlent.
- source_word: ῥήγνυνται
  choice: éclatent
  rationale: Décrit clairement la rupture des outres sous la pression du vin.
- source_word: ἐκχεῖται
  choice: se répand
  rationale: Exprime naturellement l’écoulement involontaire et la perte du vin après la rupture.
- source_word: ἀπόλλυνται
  choice: sont perdues
  rationale: Indique que les outres deviennent inutilisables, sans donner au verbe un sens plus absolu que ne l’exige le contexte.
- source_word: ἀλλὰ
  choice: Au contraire
  rationale: Marque nettement la pratique correcte opposée à celle qui vient d’être décrite.
- source_word: ἀσκοὺς καινούς
  choice: des outres neuves
  rationale: « Neuves » convient à des objets nouveaux ou non usés et permet de nuancer le terme par rapport au « vin nouveau ».
- source_word: ἀμφότεροι συντηροῦνται
  choice: l’un comme les autres sont préservés
  rationale: Désigne explicitement le vin, au singulier, et les outres, au pluriel, tout en conservant l’idée que les deux sont sauvegardés.
theological_decisions:
- issue: Distinction entre νέος et καινός dans le même verset
  choice: Traduire νέος par « nouveau » pour le vin et καινός par « neuves » pour les outres, avec une note
  alternative: Employer « nouveau » dans les deux cas sans signaler la différence lexicale
  rationale: Le grec emploie deux adjectifs distincts. Le français permet une légère nuance idiomatique entre du « vin nouveau » et des « outres neuves », tandis que la note rend la distinction source explicite sans lui imposer une interprétation théologique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite les archaïsmes tout en conservant l’image historique des outres. « L’un comme les autres » clarifie que le vin et les outres sont tous préservés malgré leur différence de nombre grammatical.
