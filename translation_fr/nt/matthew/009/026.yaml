  text: καὶ ἐξῆλθεν ἡ φήμη αὕτη εἰς ὅλην τὴν γῆν ἐκείνην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/026.yaml
  text: And this report went out into all that region[a].
translation:
  language: fr
  text: Et cette nouvelle se répandit dans toute cette région[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans tout ce territoire ». Le grec γῆ peut désigner la terre, un territoire ou une région; ici, il s’agit très probablement des environs plutôt que de la terre entière.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Rend simplement le lien narratif, sans ajouter de nuance temporelle ou causale.
- source_word: ἐξῆλθεν
  choice: se répandit
  rationale: Dans le contexte d’une nouvelle qui circule, cette formulation française exprime naturellement l’image d’une information qui sort et se diffuse.
- source_word: ἡ φήμη αὕτη
  choice: cette nouvelle
  rationale: φήμη désigne ici une information qui circule; « nouvelle » convient sans suggérer l’incertitude que pourrait introduire « rumeur ». Le démonstratif αὕτη est rendu par « cette ».
- source_word: εἰς ὅλην τὴν γῆν ἐκείνην
  choice: dans toute cette région
  rationale: γῆ peut désigner la terre, un territoire ou une région. Le cadre local du récit favorise « région », et ὅλην en marque toute l’étendue.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Se répandit » est idiomatique pour la circulation d’une nouvelle; le passé simple convient au registre narratif biblique sans être archaïque.
