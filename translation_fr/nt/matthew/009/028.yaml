id: MAT.9.28
reference: Matthew 9:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλθόντι δὲ εἰς τὴν οἰκίαν προσῆλθον αὐτῷ οἱ τυφλοί, καὶ λέγει αὐτοῖς ὁ Ἰησοῦς· Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι; λέγουσιν αὐτῷ· Ναί, κύριε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/028.yaml
  text: When he entered the house[a], the blind men approached him, and Jesus said to them, “Do you believe that I am able to do this?” They said to him, “Yes[b], Lord.”
translation:
  language: fr
  text: 'Quand il entra dans la maison, les aveugles s’approchèrent de lui. Jésus leur dit : « Croyez-vous que je suis capable de faire cela ? » Ils lui répondirent : « Oui, Seigneur[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Monsieur ». Le grec peut être une formule de respect, tout en pouvant aussi exprimer ici la reconnaissance de l’autorité de Jésus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλθόντι δὲ εἰς τὴν οἰκίαν
  choice: Quand il entra dans la maison
  rationale: Le participe aoriste introduit la nouvelle étape du récit. Cette formulation française exprime clairement l’entrée dans la maison sans lourdeur.
- source_word: προσῆλθον αὐτῷ οἱ τυφλοί
  choice: les aveugles s’approchèrent de lui
  rationale: Le verbe προσέρχομαι indique qu’ils viennent auprès de Jésus. « S’approchèrent de lui » est précis, naturel et distingue cette action de son entrée dans la maison.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jésus leur dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit écrit en français, sans changement de sens.
- source_word: Πιστεύετε ὅτι δύναμαι τοῦτο ποιῆσαι
  choice: Croyez-vous que je suis capable de faire cela ?
  rationale: « Croyez-vous » rend directement πιστεύετε, tandis que « suis capable » conserve l’accent de δύναμαι sur la capacité de Jésus. L’indicatif après « croire » préserve la présentation directe de l’objet de leur foi.
- source_word: λέγουσιν αὐτῷ· Ναί
  choice: 'Ils lui répondirent : « Oui »'
  rationale: Le présent historique est intégré au récit français au passé simple. « Répondirent » explicite naturellement la fonction de leur parole dans ce dialogue.
- source_word: κύριε
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français habituel de κύριος et conserve à la fois l’adresse respectueuse et la possible reconnaissance de l’autorité de Jésus.
theological_decisions:
- issue: Portée de κύριε dans l’adresse à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: Le contexte permet aussi bien une formule respectueuse qu’une reconnaissance plus forte de l’autorité de Jésus. « Seigneur » maintient cette possibilité sans imposer que les hommes expriment déjà une confession christologique pleinement développée.
- issue: Capacité exprimée par δύναμαι
  choice: je suis capable de faire cela
  alternative: je peux faire cela
  rationale: « Suis capable » garde explicitement l’accent sur la capacité de Jésus, qui constitue l’objet précis de la question, sans préciser à tort la nature de cette capacité.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple assure un récit fluide; le dialogue reste direct et accessible. La ponctuation française et les guillemets sont adaptés à l’usage éditorial francophone.
