source:
  edition: SBLGNT
  text: τί γάρ ἐστιν εὐκοπώτερον, εἰπεῖν· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/005.yaml
  text: 'For which is easier: to say[a], ‘Your sins are forgiven,’ or to say, ‘Get up and walk’?”'
translation:
  language: fr
  text: 'En effet, qu’est-ce qui est le plus facile : dire : « Tes péchés sont pardonnés[a] », ou dire : « Lève-toi et marche » ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tes péchés ont été pardonnés. » Le présent passif grec peut décrire l’état résultant d’une action accomplie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ ἐστιν εὐκοπώτερον
  choice: En effet, qu’est-ce qui est le plus facile
  rationale: Le pronom interrogatif τί associé au comparatif εὐκοπώτερον introduit un choix entre deux possibilités. « En effet » rend γάρ et maintient le lien explicatif avec le verset précédent.
- source_word: εἰπεῖν
  choice: dire
  rationale: L’infinitif désigne ici le simple fait de prononcer une parole. La même traduction dans les deux propositions préserve leur parallélisme.
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: Tes péchés sont pardonnés
  rationale: Le présent passif a pour sujet « tes péchés ». Cette formulation française naturelle conserve la valeur passive et peut exprimer un état résultant sans préciser davantage le moment du pardon.
- source_word: ἁμαρτίαι
  choice: péchés
  rationale: « Péchés » est le sens direct et usuel du terme dans ce contexte.
- source_word: Ἔγειρε
  choice: Lève-toi
  rationale: Dans un récit de guérison, l’impératif commande à l’homme de se relever. « Lève-toi » est actuel, naturel et digne.
- source_word: καὶ περιπάτει
  choice: et marche
  rationale: Le présent impératif appelle l’action de marcher après s’être levé. Le français l’exprime naturellement par « marche ».
- source_word: σου
  choice: tes
  rationale: Le génitif de la deuxième personne du singulier est rendu par le possessif singulier familier « tes », conformément à l’adresse directe en français biblique moderne.
theological_decisions:
- issue: Valeur temporelle et résultative de la déclaration de pardon
  choice: Tes péchés sont pardonnés
  alternative: Tes péchés ont été pardonnés
  rationale: Le présent passif grec permet une compréhension stative ou résultative, mais n’impose pas de préciser en français que l’acte est antérieur. Le présent passif maintient la force immédiate de la déclaration et laisse intacte la tension théologique du contexte.
translation_notes:
  register: Français international moderne, naturel et respectueux. Le tutoiement singulier traduit directement l’adresse à une seule personne. Le parallélisme des deux occurrences de « dire » et des deux paroles citées est conservé.
