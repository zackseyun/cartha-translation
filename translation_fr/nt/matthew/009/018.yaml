source:
  edition: SBLGNT
  text: Ταῦτα αὐτοῦ λαλοῦντος αὐτοῖς ἰδοὺ ἄρχων εἷς ⸀ἐλθὼν προσεκύνει αὐτῷ λέγων ὅτι Ἡ θυγάτηρ μου ἄρτι ἐτελεύτησεν· ἀλλὰ ἐλθὼν ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν, καὶ ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/018.yaml
  text: While he was saying these things to them, look, a ruler came and bowed down before him, saying, “My daughter has just died. But come and lay your hand on her, and she will live.”
translation:
  language: fr
  text: 'Alors qu’il leur disait cela, voici qu’un chef s’approcha et se prosterna devant lui en disant : « Ma fille vient de mourir. Mais viens, pose ta main sur elle, et elle vivra. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: voici que
  rationale: Cette tournure française attire naturellement l’attention sur l’arrivée soudaine du personnage sans alourdir le récit.
- source_word: ἄρχων
  choice: un chef
  rationale: Le terme désigne un dirigeant ou notable sans préciser ici sa fonction; « chef » préserve cette généralité.
- source_word: προσεκύνει
  choice: se prosterna devant lui
  rationale: Le geste est rendu explicitement sans décider à lui seul s’il s’agit d’un hommage ou d’un acte d’adoration.
- source_word: ἄρτι ἐτελεύτησεν
  choice: vient de mourir
  rationale: Cette formulation idiomatique exprime exactement le caractère tout récent du décès.
- source_word: ἐπίθες τὴν χεῖρά σου ἐπ’ αὐτήν
  choice: pose ta main sur elle
  rationale: Rend directement le geste demandé, dans un français naturel et digne.
theological_decisions:
- issue: Portée de προσεκύνει
  choice: se prosterna devant lui
  alternative: l’adora
  rationale: Le verbe peut exprimer la révérence, l’hommage ou l’adoration selon le contexte. La traduction choisie conserve le geste observable sans trancher une question théologique que le mot seul ne résout pas.
translation_notes:
  register: Français international actuel, narratif et digne. « Voici que » conserve l’effet de mise en relief de ἰδού; les paroles du chef restent directes, simples et confiantes.
