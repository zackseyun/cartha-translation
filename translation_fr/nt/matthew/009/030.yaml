  text: καὶ ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί. καὶ ⸀ἐνεβριμήθη αὐτοῖς ὁ Ἰησοῦς λέγων· Ὁρᾶτε μηδεὶς γινωσκέτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/009/030.yaml
  text: And their eyes were opened[a]. And Jesus sternly warned them, saying[b], “See that no one knows.”
translation:
  language: fr
  text: 'Et leurs yeux s’ouvrirent. Jésus les avertit avec fermeté[a] : « Veillez à ce que personne ne le sache[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur donna un ordre sévère ». Le verbe grec exprime une vive émotion et une forte insistance dans l’avertissement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « Veillez à ce que personne ne sache ». Le pronom « le » reprend implicitement la guérison évoquée dans le contexte.
    reason: implicit_object
lexical_decisions:
- source_word: ἠνεῴχθησαν αὐτῶν οἱ ὀφθαλμοί
  choice: leurs yeux s’ouvrirent
  rationale: Cette tournure française naturelle conserve l’image grecque et rend le passif idiomatique qui exprime le rétablissement de la vue, sans préciser l’agent.
- source_word: ἐνεβριμήθη αὐτοῖς
  choice: les avertit avec fermeté
  rationale: Le verbe ἐμβριμάομαι exprime ici une vive insistance accompagnant une interdiction. Cette formulation garde la force émotionnelle et directive du grec sans transformer l’avertissement en réprimande.
- source_word: Ὁρᾶτε
  choice: Veillez à ce que
  rationale: L’impératif présent introduit idiomatiquement une mise en garde pressante. « Veillez à ce que » en restitue la vigilance et la force en français actuel.
- source_word: μηδεὶς γινωσκέτω
  choice: personne ne le sache
  rationale: L’impératif grec à la troisième personne avec μηδείς formule une interdiction. Le pronom « le », nécessaire en français courant, reprend implicitement la guérison sans expliciter davantage son objet.
theological_decisions:
- issue: Force et motif de l’ordre de Jésus après la guérison
  choice: Un avertissement ferme interdisant de faire connaître la guérison
  alternative: Une réprimande adressée aux hommes guéris
  rationale: Le contexte et le verbe indiquent un ordre énergique, mais le verset n’en donne pas le motif. La traduction en préserve la force sans attribuer à Jésus une raison théologique non exprimée.
translation_notes:
  register: Français international moderne, clair et digne. « Leurs yeux s’ouvrirent » conserve l’expression biblique sans lourdeur; « avec fermeté » communique la vigueur du commandement sans suggérer un motif absent du texte.
