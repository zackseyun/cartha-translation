id: MAT.19.10
reference: Matthew 19:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Εἰ οὕτως ἐστὶν ἡ αἰτία τοῦ ἀνθρώπου μετὰ τῆς γυναικός, οὐ συμφέρει γαμῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/010.yaml
  text: His disciples said to him[a], “If that is the case of a man with his wife, it is not beneficial to marry.”
translation:
  language: fr
  text: 'Ses disciples lui dirent : « Si telle est la situation de l’homme avec sa femme[a], il n’est pas avantageux de se marier. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Si tel est le cas de l’homme avec une femme ». L’expression grecque est concise; « la situation » peut aussi se rendre par « le cas » ou « l’état des choses ».
    reason: Alternative lexicale et maintien de l’ambiguïté de l’expression grecque compacte.
lexical_decisions:
- source_word: Λέγουσιν αὐτῷ
  choice: lui dirent
  rationale: Le présent grec fonctionne ici comme un présent historique. Le passé simple convient naturellement au récit biblique français dans un registre digne et actuel.
- source_word: μαθηταί
  choice: disciples
  rationale: C’est le terme français courant dans les Évangiles; il conserve à la fois l’idée d’apprentissage et celle d’attachement à Jésus.
- source_word: Εἰ οὕτως ἐστίν
  choice: Si telle est
  rationale: Cette tournure française rend de façon idiomatique la condition et renvoie à la situation que Jésus vient de décrire.
- source_word: ἡ αἰτία
  choice: la situation
  rationale: Dans ce contexte, αἰτία désigne l’état des choses ou le cas envisagé, non une cause au sens strict.
- source_word: τοῦ ἀνθρώπου
  choice: de l’homme
  rationale: Le masculin singulier est générique mais désigne ici précisément l’homme dans la relation conjugale évoquée.
- source_word: μετὰ τῆς γυναικός
  choice: avec sa femme
  rationale: Dans le contexte matrimonial, γυνή signifie « femme » au sens d’épouse. Le possessif, implicite dans la relation grecque, est nécessaire à l’expression française naturelle.
- source_word: οὐ συμφέρει
  choice: il n’est pas avantageux
  rationale: Cette formulation conserve l’idée d’intérêt ou d’avantage exprimée par συμφέρει, sans transformer explicitement l’énoncé en conseil.
- source_word: γαμῆσαι
  choice: de se marier
  rationale: L’infinitif français rend naturellement l’infinitif aoriste grec et exprime l’entrée dans le mariage.
theological_decisions:
- issue: Langage sexué dans ἀνθρώπου … γυναικός
  choice: de l’homme avec sa femme
  alternative: d’une personne avec son conjoint
  rationale: Le contexte immédiat présente explicitement le mariage sous les termes d’un homme et de sa femme. La traduction conserve ce cadre au lieu de le neutraliser.
- issue: Portée pragmatique de οὐ συμφέρει
  choice: il n’est pas avantageux de se marier
  alternative: mieux vaut ne pas se marier
  rationale: La formulation retenue préserve le jugement d’intérêt exprimé par les disciples sans le reformuler plus fortement comme une recommandation explicite.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme lexical; la parole des disciples reste directe et naturelle.
