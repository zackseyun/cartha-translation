source:
  edition: SBLGNT
  text: Τότε ἀποκριθεὶς ὁ Πέτρος εἶπεν αὐτῷ· Ἰδοὺ ἡμεῖς ἀφήκαμεν πάντα καὶ ἠκολουθήσαμέν σοι· τί ἄρα ἔσται ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/027.yaml
  text: Then Peter answered him, “Look, we have left everything and followed you. What then will there be for us?”
translation:
  language: fr
  text: 'Alors Pierre lui dit : « Regarde, nous avons tout laissé et nous t’avons suivi. Qu’y aura-t-il donc pour nous ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement la progression du récit et la réaction de Pierre à ce qui précède.
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: dit
  rationale: En français actuel, « dit » exprime naturellement la réponse suscitée par le contexte, sans le calque lourd « répondant, il dit ».
- source_word: Ἰδού
  choice: Regarde
  rationale: Conserve l’interpellation qui attire l’attention de Jésus, dans une formulation moderne et directe.
- source_word: ἀφήκαμεν πάντα
  choice: nous avons tout laissé
  rationale: Rend directement l’idée d’avoir abandonné ou quitté toutes choses, sans préciser ce que le grec laisse général.
- source_word: ἠκολουθήσαμέν σοι
  choice: nous t’avons suivi
  rationale: Reproduit le sens concret et disciple de « suivre » sans explicitation doctrinale.
- source_word: τί ἄρα ἔσται ἡμῖν
  choice: Qu’y aura-t-il donc pour nous ?
  rationale: Préserve la formulation existentielle et ouverte du grec, ainsi que la valeur inférentielle de ἄρα.
theological_decisions:
- issue: Nature de ce qui est attendu par les disciples
  choice: Qu’y aura-t-il donc pour nous ?
  alternative: Quelle sera donc notre récompense ?
  rationale: Le texte grec ne nomme pas explicitement une « récompense ». La traduction garde donc ouverte la nature de ce qui reviendra aux disciples.
translation_notes:
  register: Français international moderne, oral mais digne. La parole de Pierre reste directe; aucune note n’est nécessaire.
