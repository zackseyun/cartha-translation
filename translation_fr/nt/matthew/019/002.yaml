  text: And large crowds followed him, and he healed them there.
translation:
  language: fr
  text: De grandes foules le suivirent, et là, il les guérit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠκολούθησαν
  choice: suivirent
  rationale: L’aoriste narratif de ἀκολουθέω décrit ici le fait concret de suivre Jésus. « Suivirent » est naturel et n’ajoute pas à lui seul une nuance particulière de discipulat.
- source_word: αὐτῷ
  choice: le
  rationale: Le pronom au datif désigne la personne suivie. En français, le verbe « suivre » se construit avec un complément d’objet direct, d’où « le ».
- source_word: ὄχλοι πολλοί
  choice: de grandes foules
  rationale: L’expression signifie littéralement « de nombreuses foules ». « De grandes foules » rend de façon idiomatique l’idée d’importants rassemblements de personnes.
- source_word: ἐθεράπευσεν
  choice: il les guérit
  rationale: Dans ce contexte évangélique, θεραπεύω désigne l’action de guérir. Le passé simple convient au récit et rend l’aoriste sans suggérer davantage que le grec.
- source_word: αὐτοὺς
  choice: les
  rationale: Le pronom accusatif pluriel renvoie grammaticalement aux foules et se rend directement par « les ».
- source_word: ἐκεῖ
  choice: là
  rationale: L’adverbe indique simplement le lieu. « Là » en conserve la brièveté et la valeur locative.
- source_word: καὶ ... καὶ
  choice: et ... et
  rationale: Les deux occurrences de καί coordonnent les actions dans le déroulement narratif. La traduction maintient cette structure paratactique, le premier « et » étant naturellement intégré à la continuité du verset précédent dans le contexte éditorial.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le passé simple maintient le registre narratif biblique sans archaïsme lexical. L’antéposition de « là » met clairement en relief le lieu indiqué par ἐκεῖ tout en restant naturelle.
