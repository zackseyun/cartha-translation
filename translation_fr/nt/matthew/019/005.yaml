id: MAT.19.5
reference: Matthew 19:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν· ⸀Ἕνεκα τούτου καταλείψει ἄνθρωπος τὸν πατέρα καὶ τὴν μητέρα καὶ ⸀κολληθήσεται τῇ γυναικὶ αὐτοῦ, καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/005.yaml
  text: and said[a], ‘For this reason a man will leave his father and mother and be joined to his wife, and the two will become one flesh.’
translation:
  language: fr
  text: 'et il dit : « C’est pourquoi l’homme quittera son père et sa mère, s’attachera à sa femme[a], et les deux deviendront une seule chair. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’unira à sa femme » ou « restera étroitement attaché à sa femme ». Le verbe grec exprime une union ou un attachement étroit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕνεκα τούτου
  choice: C’est pourquoi
  rationale: Expression causale et déductive naturelle en français moderne, qui introduit fidèlement la conséquence tirée du récit de la création.
- source_word: καταλείψει
  choice: quittera
  rationale: Le futur simple restitue directement le futur grec et convient au caractère solennel de la citation scripturaire sans archaïsme.
- source_word: ἄνθρωπος
  choice: l’homme
  rationale: Dans cette citation relative au mariage, le masculin singulier désigne spécifiquement l’homme en relation avec « sa femme » ; une formulation neutre atténuerait cette correspondance.
- source_word: κολληθήσεται
  choice: s’attachera à
  rationale: Le verbe exprime une adhésion ou union étroite. « S’attachera à » est idiomatique, digne et conserve la force relationnelle sans préciser indûment le mécanisme de l’union.
- source_word: γυναικὶ αὐτοῦ
  choice: sa femme
  rationale: Dans ce contexte matrimonial, γυνή désigne l’épouse ; « sa femme » est la formulation française courante.
- source_word: οἱ δύο
  choice: les deux
  rationale: La formulation explicite du grec est conservée.
- source_word: εἰς σάρκα μίαν
  choice: deviendront une seule chair
  rationale: Cette formulation française établie rend le mouvement vers une union nouvelle exprimé par ἔσονται εἰς, tout en préservant l’image concrète et relationnelle de σάρξ.
theological_decisions:
- issue: Langage sexué dans la citation sur le mariage
  choice: l’homme … sa femme
  alternative: une personne … son conjoint
  rationale: Le texte reprend une formulation homme-femme de Genèse. Le contexte étant spécifiquement sexué plutôt que générique, la distinction est maintenue sans élargissement interprétatif.
- issue: Expression de l’union conjugale
  choice: les deux deviendront une seule chair
  alternative: les deux seront une seule chair
  rationale: « Deviendront » exprime naturellement en français le résultat ou l’entrée dans l’union indiqué par ἔσονται εἰς, sans réduire la portée relationnelle et théologique de l’image.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le parallélisme de la citation biblique. « Une seule chair » maintient l’expression traditionnelle tout en restant immédiatement compréhensible.
