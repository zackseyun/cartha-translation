id: MAT.19.11
reference: Matthew 19:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐ πάντες χωροῦσι τὸν λόγον ⸀τοῦτον ἀλλ’ οἷς δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/011.yaml
  text: But he said to them[a], “Not everyone can accept this word[b], but only those to whom it has been given.”
translation:
  language: fr
  text: 'Mais il leur dit : « Tous ne peuvent pas accueillir cette parole[a], mais seuls ceux à qui cela a été donné[b] le peuvent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette déclaration » ou « cet enseignement ».
    reason: lexical_alternative
  - marker: b
    text: Le passif « cela a été donné » laisse probablement entendre que Dieu est celui qui donne, mais le grec ne nomme pas explicitement le donateur.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: dit
  rationale: Le verbe narratif λέγω à l’aoriste se rend naturellement ici par « dit », sans ajouter l’idée plus précise de répondre.
- source_word: Οὐ πάντες
  choice: Tous ne peuvent pas
  rationale: 'Cette tournure française exprime clairement la négation non universelle : la capacité évoquée n’appartient pas à tous.'
- source_word: χωροῦσι
  choice: peuvent accueillir
  rationale: Avec λόγον, χωρέω évoque le fait de faire place à une parole, de la recevoir ou de l’accepter. « Peuvent accueillir » conserve cette image tout en restant naturel en français moderne.
- source_word: τὸν λόγον τοῦτον
  choice: cette parole
  rationale: λόγος désigne ici la parole ou l’affirmation en question. « Cette parole » préserve la formulation générale du grec sans trancher entre parole, déclaration et enseignement.
- source_word: ἀλλ’ οἷς
  choice: mais seulement ceux à qui
  rationale: « Seulement » rend explicite en français la restriction portée par le contraste avec ἀλλά et la proposition relative.
- source_word: δέδοται
  choice: cela a été donné
  rationale: Le parfait passif de δίδωμι présente un don accordé dont l’effet demeure. La formulation conserve le passif et ne nomme pas le donateur implicite.
theological_decisions:
- issue: Identité du donateur implicite dans δέδοται
  choice: Conserver le passif sans nommer le donateur
  alternative: « mais seulement ceux à qui Dieu l’a donné »
  rationale: Le contexte peut suggérer que Dieu est le donateur, mais le grec ne l’énonce pas. Le passif maintient cette implication possible sans la rendre explicite.
- issue: Nature exacte de ce qui est donné
  choice: Employer le pronom neutre « cela »
  alternative: « ceux qui en ont reçu la capacité »
  rationale: Le grec omet le sujet du passif et peut évoquer la parole elle-même, son accueil ou la capacité de l’accueillir. « Cela » évite de préciser ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. « Accueillir cette parole » reste accessible tout en conservant l’image de faire place à ce qui est dit. Les deux marqueurs de note figurent immédiatement après les expressions concernées.
