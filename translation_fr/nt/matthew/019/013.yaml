id: MAT.19.13
reference: Matthew 19:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε ⸀προσηνέχθησαν αὐτῷ παιδία ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς καὶ προσεύξηται· οἱ δὲ μαθηταὶ ἐπετίμησαν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/013.yaml
  text: Then children were brought to him so that he might lay his hands on them and pray[a]; but the disciples rebuked them.
translation:
  language: fr
  text: Alors, on lui amena des enfants pour qu’il leur impose les mains et prie ; mais les disciples leur firent des reproches.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « leur » peut désigner soit les enfants, soit les personnes qui les ont amenés.
    reason: alternative_reading
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement la succession du récit en français moderne.
- source_word: προσηνέχθησαν αὐτῷ παιδία
  choice: on lui amena des enfants
  rationale: La tournure active indéfinie « on lui amena » rend naturellement le passif grec sans préciser qui les amenait.
- source_word: ἵνα τὰς χεῖρας ἐπιθῇ αὐτοῖς
  choice: pour qu’il pose les mains sur eux
  rationale: Conserve la valeur de but de ἵνα, le pluriel explicite « les mains » et le complément pronominal.
- source_word: καὶ προσεύξηται
  choice: et prie
  rationale: Rend le verbe sans ajouter le complément implicite « pour eux », absent du grec.
- source_word: οἱ δὲ μαθηταὶ
  choice: mais les disciples
  rationale: « Mais » exprime le contraste introduit par δέ.
- source_word: ἐπετίμησαν αὐτοῖς
  choice: leur firent des reproches
  rationale: Rend la réprimande exprimée par ἐπιτιμάω dans un français actuel et digne, tout en conservant le pronom ambigu.
theological_decisions:
- issue: Référent du dernier αὐτοῖς
  choice: leur
  alternative: aux enfants ; à ceux qui les avaient amenés
  rationale: Le pronom grec peut renvoyer soit aux enfants, soit aux personnes qui les ont amenés. Le français « leur » maintient cette ambiguïté au lieu de la trancher.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation maintient en une phrase la progression et le contraste du grec ; la note explicite l’ambiguïté réelle du dernier pronom.
