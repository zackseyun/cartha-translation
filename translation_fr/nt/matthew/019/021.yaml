  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Εἰ θέλεις τέλειος εἶναι, ὕπαγε πώλησόν σου τὰ ὑπάρχοντα καὶ ⸀δὸς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/021.yaml
  text: Jesus said to him[a], “If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in heaven; then come, follow me.”
translation:
  language: fr
  text: 'Jésus lui dit : « Si tu veux être parfait[a], va, vends ce que tu possèdes et donne aux pauvres ; tu auras un trésor au ciel. Puis viens, suis-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « accompli » ou « arrivé à maturité ». Le mot grec peut exprimer la perfection, l’intégrité ou le plein accomplissement.
    reason: Alternative lexicale permettant de préserver l’étendue de sens de τέλειος.
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Formulation narrative française naturelle qui conserve le verbe de parole simple et son destinataire.
- source_word: τέλειος
  choice: parfait
  rationale: « Parfait » est l’équivalent français direct et traditionnel de τέλειος; une note maintient les nuances possibles d’accomplissement et de maturité sans réduire l’exigence du texte.
- source_word: ὕπαγε
  choice: va
  rationale: Impératif simple de départ, idiomatique en français dans la suite « va vendre ».
- source_word: πώλησόν σου τὰ ὑπάρχοντα
  choice: vendre ce que tu possèdes
  rationale: Rend naturellement l’expression substantivée désignant les biens ou possessions de l’homme.
- source_word: δὸς πτωχοῖς
  choice: donne-le aux pauvres
  rationale: Le pronom reprend collectivement ce qui est vendu ou son produit, tandis que « aux pauvres » rend le datif substantivé πτωχοῖς.
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: Tu auras alors un trésor dans les cieux
  rationale: Conserve le futur, l’image du trésor et le pluriel grec οὐρανοῖς; « alors » explicite sobrement la conséquence indiquée par la coordination.
- source_word: δεῦρο ἀκολούθει μοι
  choice: Puis viens et suis-moi
  rationale: Rend l’appel déictique δεῦρο et l’impératif de la marche à la suite de Jésus, tout en indiquant leur place après les actes précédents.
theological_decisions:
- issue: Portée de τέλειος dans l’appel à devenir disciple
  choice: parfait
  alternative: accompli; arrivé à maturité
  rationale: Le terme peut évoquer la perfection, l’intégrité ou l’accomplissement. Le texte principal garde sa force et sa formulation traditionnelle, tandis que la note préserve l’étendue sémantique sans trancher en faveur d’une doctrine de perfection morale absolue.
- issue: Nature du trésor promis
  choice: un trésor dans les cieux
  alternative: un trésor au ciel
  rationale: Le pluriel respecte la forme grecque et laisse intacte l’image eschatologique, sans préciser davantage la nature de la récompense.
translation_notes:
  register: Français moderne, clair et digne, avec tutoiement conforme au dialogue évangélique. Les impératifs restent directs. La ponctuation répartit les commandements et la promesse en phrases naturelles sans modifier leur enchaînement.
