  to: 'Jésus lui dit : « Si tu veux être parfait[a], va, vends ce que tu possèdes et donne aux pauvres ; tu auras un trésor au ciel. Puis viens, suis-moi. »'
  rationale: La révision retire le pronom non exprimé par le grec et l’adverbe « alors », afin de préserver la formulation concise et la relation non surspécifiée entre vendre et donner. Elle emploie aussi la ponctuation impérative française naturelle et « au ciel », idiome français usuel pour cette expression, tout en maintenant la note sur τέλειος.
