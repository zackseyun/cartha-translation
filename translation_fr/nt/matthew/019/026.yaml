id: MAT.19.26
reference: Matthew 19:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐμβλέψας δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Παρὰ ἀνθρώποις τοῦτο ἀδύνατόν ἐστιν, παρὰ δὲ θεῷ πάντα δυνατά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/026.yaml
  text: But Jesus looked at them and said to them[a], “With men this is impossible, but with God all things are possible.”
translation:
  language: fr
  text: 'Mais Jésus les regarda et leur dit : « Pour les êtres humains, c’est impossible, mais pour Dieu, tout est possible. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: les regarda
  rationale: Le participe aoriste indique que Jésus dirige son regard vers les disciples. « Les regarda » est naturel et conserve ce mouvement narratif sans accentuer indûment l’intensité du regard.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une légère opposition entre la réaction suscitée par les paroles précédentes et la réponse de Jésus.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: Le pronom datif αὐτοῖς est explicitement rendu par « leur », dans une formulation française idiomatique.
- source_word: παρὰ ἀνθρώποις
  choice: Pour les êtres humains
  rationale: Avec le datif, παρά exprime ici ce qui est possible dans la sphère ou du point de vue humain. ἄνθρωποις désigne l’humanité en général ; « les êtres humains » rend clairement cette portée générique en français moderne.
- source_word: τοῦτο
  choice: c’est
  rationale: Le démonstratif renvoie à la possibilité du salut évoquée dans le contexte. La tournure « c’est impossible » est la manière française naturelle de rendre τοῦτο ἀδύνατόν ἐστιν.
- source_word: ἀδύνατόν ἐστιν
  choice: c’est impossible
  rationale: Cette formulation rend directement et naturellement l’adjectif prédicatif accompagné de la copule.
- source_word: παρὰ δὲ θεῷ
  choice: mais pour Dieu
  rationale: La répétition de παρά avec le datif est rendue par la répétition de « pour », ce qui maintient le parallélisme rhétorique entre les êtres humains et Dieu.
- source_word: πάντα δυνατά
  choice: tout est possible
  rationale: Le neutre pluriel πάντα a couramment une valeur globale ; « tout est possible » est idiomatique et conserve la force générale de l’affirmation.
theological_decisions:
- issue: Portée générique de ἀνθρώποις
  choice: les êtres humains
  alternative: les hommes
  rationale: Dans ce contexte, le masculin pluriel grec désigne tous les humains et non les hommes de sexe masculin. « Les êtres humains » exprime cette portée sans ajouter de distinction absente du texte.
- issue: Portée de « tout est possible »
  choice: Conserver l’énoncé général sans explicitation
  alternative: « Dieu peut sauver » ou une autre paraphrase contextuelle
  rationale: Le contexte concerne le salut, mais le grec formule une affirmation générale. La traduction garde cette amplitude et évite de réduire explicitement πάντα à une seule application.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme « pour les êtres humains… pour Dieu » est conservé, ainsi que le contraste introduit par « mais ».
