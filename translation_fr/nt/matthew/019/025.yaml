source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ οἱ ⸀μαθηταὶ ἐξεπλήσσοντο σφόδρα λέγοντες· Τίς ἄρα δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/025.yaml
  text: When the disciples heard this, they were greatly astonished and said, “Who then can be saved?”
translation:
  language: fr
  text: 'En entendant cela, les disciples furent extrêmement étonnés et dirent : « Qui donc peut être sauvé ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: En entendant cela
  rationale: Le participe aoriste exprime la circonstance antérieure ou concomitante à la réaction principale. « Cela » explicite naturellement en français le renvoi aux paroles précédentes de Jésus.
- source_word: δὲ
  choice: '[liaison implicite]'
  rationale: La particule marque ici une transition ou un léger contraste. La construction « En entendant cela » assure déjà cette transition en français naturel.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: C’est le terme courant, précis et consacré dans le récit évangélique pour désigner les disciples de Jésus.
- source_word: ἐξεπλήσσοντο σφόδρα
  choice: furent extrêmement étonnés
  rationale: Le verbe exprime une vive stupéfaction, et σφόδρα en renforce nettement le degré. Le passé simple convient au récit et rend la réaction globale, sans effacer l’aspect duratif possible de l’imparfait grec.
- source_word: λέγοντες
  choice: et dirent
  rationale: Le participe de parole accompagnante se rend naturellement en français narratif par un verbe coordonné.
- source_word: Τίς ἄρα
  choice: Qui donc
  rationale: '« Donc » conserve la valeur inférentielle de ἄρα : les disciples tirent une conclusion déconcertante des paroles précédentes de Jésus.'
- source_word: δύναται
  choice: peut
  rationale: Le présent exprime ici la capacité ou la possibilité; « peut » est direct et idiomatique.
- source_word: σωθῆναι
  choice: être sauvé
  rationale: Dans le contexte de l’entrée dans le royaume, cette formulation garde la portée sotériologique ainsi que la forme passive, sans préciser davantage l’agent ou le processus.
theological_decisions:
- issue: Portée de σωθῆναι dans le contexte
  choice: être sauvé
  alternative: être délivré / être secouru
  rationale: Le contexte immédiat porte sur l’entrée dans le royaume et conduit les disciples à poser une question générale sur le salut. « Être sauvé » en préserve la portée théologique sans imposer une explication confessionnelle de son mode d’accomplissement.
translation_notes:
  register: Français international moderne, clair et digne. « Extrêmement étonnés » restitue la forte intensité de σφόδρα tout en restant accessible; la question conserve sa concision et sa tension théologique.
