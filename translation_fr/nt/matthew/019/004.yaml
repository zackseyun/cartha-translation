  text: ὁ δὲ ἀποκριθεὶς ⸀εἶπεν· Οὐκ ἀνέγνωτε ὅτι ὁ ⸀κτίσας ἀπ’ ἀρχῆς ἄρσεν καὶ θῆλυ ἐποίησεν αὐτοὺς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/004.yaml
  text: He answered, “Have you not read that from the beginning the one who created them made them male and female?”
translation:
  language: fr
  text: 'Il répondit : « N’avez-vous pas lu[a] que celui qui a créé[b], dès le commencement, les a faits mâle et femelle ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous n’avez pas lu… ? »'
    reason: Variante française possible pour rendre la question grecque négative.
  - marker: b
    text: 'Littéralement : « celui qui a créé » ; autre traduction possible : « le Créateur ».'
    reason: Le participe grec substantivé peut être rendu soit par une proposition relative, soit par un titre.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Il répondit
  rationale: Cette tournure grecque associe un participe signifiant « répondre » au verbe « dire ». En français naturel, « Il répondit » en restitue pleinement le sens sans lourdeur.
- source_word: Οὐκ ἀνέγνωτε
  choice: N’avez-vous pas lu
  rationale: Le passé composé convient à cette question qui renvoie à un texte déjà lu et toujours pertinent. La formulation conserve aussi la force du reproche implicite.
- source_word: ὁ κτίσας
  choice: celui qui a créé
  rationale: Cette expression rend directement le participe grec substantivé, sans transformer explicitement la tournure en titre divin.
- source_word: ἀπ’ ἀρχῆς
  choice: dès le commencement
  rationale: « Dès le commencement » exprime naturellement le point de départ et fait écho au récit de la création dans la Genèse.
- source_word: ἄρσεν καὶ θῆλυ
  choice: mâle et femelle
  rationale: Cette formulation suit de près les termes grecs et l’écho à Genèse 1.27. Elle préserve la paire sexuelle exprimée par le texte plutôt que de substituer les noms grecs distincts signifiant « homme » et « femme ».
- source_word: ἐποίησεν αὐτούς
  choice: les a faits
  rationale: « Faire » distingue ce verbe de κτίζω, rendu par « créer », et le pronom « les » représente explicitement αὐτούς.
theological_decisions:
- issue: Formulation de la paire créée en lien avec Genèse 1.27
  choice: mâle et femelle
  alternative: homme et femme
  rationale: Le grec emploie les termes désignant le mâle et la femelle, comme dans la citation de la Genèse, et non les substantifs ordinaires pour « homme » et « femme ». La traduction retenue conserve cette formulation créationnelle sans en tirer de conclusion doctrinale supplémentaire.
- issue: Portée de « dès le commencement »
  choice: Rattacher l’expression à « les a faits »
  alternative: la placer immédiatement après « a créé »
  rationale: Dans le grec, l’expression suit le participe « celui qui a créé » mais précède « mâle et femelle il les fit ». Sa portée syntaxique peut être perçue de plus d’une manière. La place choisie est naturelle en français et souligne que l’acte décrit remonte au commencement, sans exclure le lien étroit avec « a créé ».
translation_notes:
  register: Français international moderne, sobre et digne. « Il répondit » évite le calque lourd « Ayant répondu, il dit ». « Mâle et femelle » est volontairement plus proche du grec et de Genèse 1.27 que « homme et femme », malgré son caractère légèrement moins courant en français contemporain.
