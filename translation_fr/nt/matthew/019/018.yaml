  text: λέγει αὐτῷ· Ποίας; ὁ δὲ Ἰησοῦς ⸀εἶπεν· Τὸ Οὐ φονεύσεις, Οὐ μοιχεύσεις, Οὐ κλέψεις, Οὐ ψευδομαρτυρήσεις,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/018.yaml
  text: 'He says to him, “Which ones?” And Jesus said, “The: You shall not murder, you shall not commit adultery, you shall not steal, you shall not bear false witness,”'
translation:
  language: fr
  text: 'Il lui dit : « Lesquels ? » Jésus dit : « Tu ne commettras pas de meurtre, tu ne commettras pas d’adultère, tu ne voleras pas, tu ne porteras pas de faux témoignage, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποίας
  choice: Lesquels ?
  rationale: Le pronom interrogatif féminin pluriel renvoie naturellement aux commandements sous-entendus.
- source_word: Οὐ φονεύσεις
  choice: Tu ne commettras pas de meurtre
  rationale: φονεύω désigne le fait de tuer illicitement, le meurtre, plutôt que toute mise à mort sans distinction.
- source_word: Οὐ μοιχεύσεις
  choice: tu ne commettras pas d’adultère
  rationale: Rend directement le sens précis de μοιχεύω dans un français courant et digne.
- source_word: Οὐ κλέψεις
  choice: tu ne voleras pas
  rationale: Traduction directe et idiomatique de κλέπτω.
- source_word: Οὐ ψευδομαρτυρήσεις
  choice: tu ne porteras pas de faux témoignage
  rationale: Conserve la notion judiciaire et relationnelle de témoignage exprimée par ψευδομαρτυρέω.
- source_word: Τὸ
  choice: non rendu séparément
  rationale: 'L’article neutre introduit ici la série de commandements cités. Le traduire littéralement par « Le : » serait artificiel et fautif en français ; les deux-points remplissent naturellement sa fonction introductive.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La formulation reprend le registre traditionnel des commandements sans archaïsmes. Le présent de « Il lui dit » reflète λέγει, tandis que le passé simple « répondit » rend εἶπεν de façon naturelle dans le récit.
