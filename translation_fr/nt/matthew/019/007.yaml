source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Τί οὖν Μωϋσῆς ἐνετείλατο δοῦναι βιβλίον ἀποστασίου καὶ ἀπολῦσαι ⸀αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/007.yaml
  text: They said to him[a], “Why then did Moses command to give a certificate of divorce and to send her away?”
translation:
  language: fr
  text: 'Ils lui dirent : « Pourquoi donc Moïse a-t-il commandé de donner un acte de divorce et de la renvoyer[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « divorcer d’avec elle ». Le verbe grec peut signifier « renvoyer » et, dans ce contexte, désigne l’acte de divorcer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Ils lui dirent
  rationale: Le présent historique grec est rendu au passé simple, naturel dans un récit français de registre soutenu.
- source_word: Τί οὖν
  choice: Pourquoi donc
  rationale: Dans le contexte, la formule introduit une objection tirée de la parole précédente de Jésus; « pourquoi donc » en exprime clairement la force argumentative.
- source_word: Μωϋσῆς ἐνετείλατο
  choice: Moïse a-t-il commandé
  rationale: Le verbe signifie bien « commander ». Cette formulation préserve la manière dont les interlocuteurs présentent la prescription, sans anticiper la correction apportée par Jésus au verset suivant.
- source_word: δοῦναι βιβλίον ἀποστασίου
  choice: de lui donner un acte de divorce
  rationale: « Acte de divorce » désigne clairement et naturellement le document juridique remis à l'épouse. Le pronom indirect explicite en français la destinataire déjà impliquée par αὐτήν, sans introduire un « nous » absent du grec.
- source_word: καὶ ἀπολῦσαι αὐτήν
  choice: et de la renvoyer
  rationale: « Renvoyer » conserve le sens concret de ἀπολύω, tout en laissant le contexte juridique indiquer qu'il s'agit de divorcer.
theological_decisions:
- issue: Faut-il harmoniser dès ce verset les propos des interlocuteurs avec la distinction entre commandement et permission donnée au verset suivant ?
  choice: Conserver « commandé »
  alternative: « permis » ou « autorisé »
  rationale: Le grec emploie explicitement ἐνετείλατο, « commander ». La traduction doit préserver la formulation de l'objection sans y importer par anticipation la réponse de Jésus.
- issue: Faut-il rendre ἀπολῦσαι uniquement par le terme juridique « divorcer » ?
  choice: « la renvoyer » dans le texte, avec une note
  alternative: « divorcer d'avec elle »
  rationale: La formulation retenue préserve l'image et la portée lexicale du verbe grec, tandis que la note signale explicitement son sens juridique dans ce contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient à la narration biblique écrite sans être archaïque. « Acte de divorce » est une expression juridique courante; « la renvoyer » maintient la tension entre le sens concret du verbe et sa fonction de terme de divorce dans ce contexte.
