  text: But many who are first will be last[a], and the last first.
translation:
  language: fr
  text: Mais beaucoup de ceux qui sont les premiers seront les derniers[a], et les derniers seront les premiers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Mais beaucoup de premiers seront derniers, et [beaucoup] de derniers seront premiers. » Le grec est particulièrement concis et formulé comme un proverbe.'
    reason: Alternative lexicale et indication de la concision du texte source.
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup de ceux
  rationale: L’adjectif substantivé désigne un groupe nombreux sans en préciser l’identité. « Beaucoup de ceux » permet en français une articulation naturelle avec la relative qui suit.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste avec la discussion précédente sur la récompense et le rang.
- source_word: ἔσονται
  choice: seront
  rationale: Le futur de εἰμί se rend directement et naturellement par « seront ».
- source_word: πρῶτοι
  choice: les premiers
  rationale: Le terme évoque ici le rang ou la position. « Les premiers » conserve sa portée large et son contraste proverbial avec « les derniers ».
- source_word: ἔσχατοι
  choice: les derniers
  rationale: « Les derniers » maintient l’antithèse directe avec « les premiers » sans préciser indûment la nature du classement.
- source_word: πρῶτοι ἔσχατοι
  choice: ceux qui sont les premiers seront les derniers
  rationale: La relative explicite en français la relation prédicative très concise du grec, sans ajouter de contenu interprétatif.
- source_word: καὶ ἔσχατοι πρῶτοι
  choice: et les derniers seront les premiers
  rationale: La répétition de « seront » est plus naturelle et plus claire en français moderne, tout en conservant le parallélisme et la force proverbiale.
theological_decisions:
- issue: Nature du renversement annoncé
  choice: Une affirmation générale sur le renversement du rang ou de la position
  alternative: Une affirmation portant précisément sur l’accès au royaume, les récompenses des disciples ou le statut social
  rationale: Le verset formule le renversement sans en définir précisément la portée. La traduction garde donc l’aphorisme ouvert et ne tranche pas une ambiguïté que le texte conserve.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste accessible, conserve l’opposition symétrique « premiers / derniers » et évite de préciser la nature du renversement.
