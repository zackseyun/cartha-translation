source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε τὰ παιδία καὶ μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/014.yaml
  text: But Jesus said[a], “Let the children come, and do not hinder them from coming to me[b], for the kingdom of heaven belongs to such as these.”
translation:
  language: fr
  text: 'Mais Jésus dit : « Laissez les enfants venir à moi et ne les empêchez pas de venir à moi, car le royaume des cieux appartient à des gens comme eux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car le royaume des cieux est à de tels [êtres] ». Cette expression peut désigner les enfants présents et, plus largement, des personnes de leur sorte, sans préciser en quoi consiste cette ressemblance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφετε
  choice: Laissez
  rationale: Dans ce contexte, l’impératif de ἀφίημι exprime la permission. « Laissez » est direct, naturel et digne en français contemporain.
- source_word: τὰ παιδία
  choice: les enfants
  rationale: παιδία désigne ici des enfants, vraisemblablement jeunes, sans exiger que le français ajoute « petits ».
- source_word: μὴ κωλύετε αὐτὰ ἐλθεῖν πρός με
  choice: ne les en empêchez pas
  rationale: κωλύω avec l’infinitif signifie empêcher quelqu’un de faire quelque chose. Le pronom « en » reprend naturellement en français l’action de venir à Jésus et évite une répétition lourde.
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: car … est à ceux qui sont comme eux
  rationale: 'Cette formulation rend naturellement le génitif possessif tout en conservant la portée représentative de τοιούτων : les enfants présents sont visés, mais aussi des personnes qui leur ressemblent sous un rapport que le texte ne précise pas.'
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: « Le royaume des cieux » est la formulation française établie et rend fidèlement l’expression caractéristique de Matthieu.
theological_decisions:
- issue: Jésus parle-t-il uniquement des enfants présents ou également de personnes qui leur ressemblent ?
  choice: ceux qui sont comme eux
  alternative: ces enfants ; ceux qui ressemblent aux enfants
  rationale: Le grec τοιούτων désigne des personnes de cette sorte, sans définir explicitement la qualité concernée. La traduction garde donc ensemble la référence immédiate aux enfants et sa possible portée plus large, sans imposer une interprétation de ce qui constitue cette ressemblance.
translation_notes:
  register: Français international moderne, simple et digne. « Ne les en empêchez pas » est idiomatique et évite de répéter « venir à moi ». La note conserve la concision et l’ambiguïté de la construction grecque.
