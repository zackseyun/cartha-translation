- from: 'Mais Jésus dit : « Laissez les enfants venir à moi et ne les en empêchez pas, car le royaume des cieux est à ceux qui sont comme eux.[a] »'
  to: 'Mais Jésus dit : « Laissez les enfants venir à moi et ne les empêchez pas de venir à moi, car le royaume des cieux appartient à des gens comme eux[a]. »'
  rationale: La révision remplace une comparaison potentiellement exclusive par « des gens comme eux », qui inclut les enfants présents tout en préservant l’extension possible de τοιούτων. Elle rend aussi explicitement le complément de κωλύω + infinitif et corrige la note afin qu’elle soit naturelle, exacte et non interprétative.
