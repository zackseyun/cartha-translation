review_pass:
  verdict: revise
  source_fidelity: La première injonction et « le royaume des cieux » rendent bien le grec. Toutefois, « ceux qui sont comme eux » présente les enfants comme un groupe de comparaison distinct et risque ainsi d’exclure les enfants eux-mêmes de la catégorie visée par τοιούτων. « Des gens comme eux » conserve à la fois la référence aux enfants présents et la portée représentative non précisée.
  naturalness: La formulation révisée est naturelle en français international moderne. « Ne les empêchez pas de venir à moi » est plus explicite et plus immédiatement idiomatique que « ne les en empêchez pas », sans lourdeur notable.
  terminology: « Jésus », « enfants » et « royaume des cieux » sont appropriés et cohérents avec l’usage biblique français. « Appartient à » exprime clairement la valeur possessive/de destination de la construction grecque, sans ajouter d’interprétation théologique.
  issues:
  - severity: medium
    issue: La formule « ceux qui sont comme eux » établit une comparaison qui peut mettre les enfants présents hors du groupe désigné.
    rationale: 'Le génitif τῶν τοιούτων désigne « de tels [êtres/personnes] » : les enfants présents sont l’exemple immédiat de cette catégorie, non seulement le terme auquel d’autres seraient comparés. La qualité pertinente demeure implicite dans le grec.'
  - severity: low
    issue: La note actuelle propose des équivalents français peu naturels et ne formule pas avec assez de précision la portée de τοιούτων.
    rationale: « De tels êtres » est inutilement générique, tandis que « à leurs pareils qu’est le royaume » est syntaxiquement maladroit. Une note brève doit expliquer la valeur représentative sans définir la ressemblance.
  revised_text: 'Mais Jésus dit : « Laissez les enfants venir à moi et ne les empêchez pas de venir à moi, car le royaume des cieux appartient à des gens comme eux[a]. »'
  revised_footnotes:
