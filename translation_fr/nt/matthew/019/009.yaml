reference: Matthew 19:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ⸀ὅτι ὃς ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ μὴ ἐπὶ πορνείᾳ καὶ γαμήσῃ ἄλλην μοιχᾶται ⸂καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/009.yaml
  text: But I tell you that whoever divorces his wife[a], except for sexual immorality, and marries another, commits adultery[b]; and whoever marries a divorced woman commits adultery.
translation:
  language: fr
  text: Mais je vous dis que quiconque divorce de sa femme, sauf en cas d’immoralité sexuelle[a], et épouse une autre femme commet l’adultère ; et celui qui épouse une femme divorcée commet l’adultère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sauf pour cause d’inconduite sexuelle ». Le grec peut aussi être rendu plus étroitement par « sauf en cas de fornication » ou compris par certains comme « sauf en cas d’infidélité sexuelle ».'
    reason: lexical_alternative
  - marker: b
    text: 'Certains manuscrits omettent : « et celui qui épouse une femme divorcée commet l’adultère ».'
    reason: textual_variant
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mais moi, je vous dis
  rationale: « Mais » rend la nuance adversative de δέ dans le contexte ; le pronom tonique « moi » fait naturellement ressortir en français le contraste et l’autorité de la déclaration.
- source_word: ὃς ἂν
  choice: quiconque
  rationale: Le relatif accompagné de ἄν exprime une condition générale indéfinie ; « quiconque » en conserve la portée générique dans un registre digne et courant.
- source_word: ἀπολύσῃ τὴν γυναῖκα αὐτοῦ
  choice: divorce de sa femme
  rationale: Dans ce contexte matrimonial, ἀπολύω désigne le divorce, et γυνή signifie « femme » au sens d’épouse.
- source_word: μὴ ἐπὶ πορνείᾳ
  choice: sauf en cas d’immoralité sexuelle
  rationale: La tournure exprime une exception. « Immoralité sexuelle » garde à πορνεία une portée plus large que le seul adultère, sans imposer une interprétation confessionnelle étroite.
- source_word: καὶ γαμήσῃ ἄλλην
  choice: et en épouse une autre
  rationale: Le pronom « en » reprend naturellement « sa femme » et ἄλλην, féminin, désigne une autre femme.
- source_word: μοιχᾶται
  choice: commet un adultère
  rationale: Cette formulation française usuelle exprime clairement l’acte moral désigné par le verbe grec.
- source_word: καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: et celui qui épouse une femme divorcée commet un adultère
  rationale: La construction participiale substantivée reçoit une formulation générique naturelle ; le participe parfait passif ἀπολελυμένην désigne une femme qui a été divorcée.
theological_decisions:
- issue: Sens de πορνεία dans la clause d’exception
  choice: immoralité sexuelle
  alternative: inconduite sexuelle ; fornication ; infidélité sexuelle
  rationale: πορνεία possède un champ sémantique plus large que μοιχεία, l’adultère. Une traduction large préserve cette latitude ainsi que la tension interprétative, tandis que la note signale des rendus plus étroits possibles.
- issue: Présence de la proposition finale καὶ ὁ ἀπολελυμένην γαμήσας μοιχᾶται
  choice: Inclure la proposition dans le texte principal
  alternative: L’omettre, conformément à certains manuscrits
  rationale: Le texte source SBLGNT fourni l’inclut tout en signalant sa variation textuelle. Elle est donc traduite, et l’incertitude manuscrite est indiquée en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure grecque tout en étant idiomatique. « Mais moi » marque le contraste contextuel sans archaïsme ; les notes préservent l’étendue lexicale contestée de πορνεία et la variante textuelle.
