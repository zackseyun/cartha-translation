revisions:
- from: Mais moi, je vous dis que quiconque divorce de sa femme, sauf en cas d’immoralité sexuelle[a], et en épouse une autre commet un adultère ; et celui qui épouse une femme divorcée commet un adultère[b].
  to: Mais je vous dis que quiconque divorce de sa femme, sauf en cas d’immoralité sexuelle[a], et épouse une autre femme commet l’adultère ; et celui qui épouse une femme divorcée commet l’adultère[b].
  rationale: La révision retire une emphase non exprimée dans le grec, emploie l’expression française usuelle « commet l’adultère » et explicite « une autre femme » pour refléter ἄλλην. Les deux notes conservent, sans trancher, l’ambiguïté lexicale de πορνεία et la variante manuscrite de la proposition finale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:58:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens essentiel est bien rendu : divorce, exception liée à πορνεία, remariage et proposition finale textuellement discutée. Toutefois, « moi » introduit une emphase explicite qui n’apparaît pas dans λέγω δὲ ὑμῖν, et « en épouse une autre » est moins clair que l’explicitation de la femme désignée par ἄλλην.'
  naturalness: Le français est globalement clair et de registre approprié. En français biblique courant comme en français moderne soigné, « commet l’adultère » est plus idiomatique et plus directement équivalent à μοιχᾶται que « commet un adultère ».
  terminology: « Immoralité sexuelle » préserve utilement l’extension de πορνεία sans la réduire à l’adultère. « Femme divorcée » est fidèle au participe parfait passif ἀπολελυμένην. La note textuelle rend correctement compte de la clause entre crochets dans le texte SBLGNT fourni.
  issues:
  - severity: low
    issue: Ajout de « moi » dans « Mais moi, je vous dis »
    rationale: Le grec comporte δέ, mais non le pronom personnel emphatique ἐγώ. « Mais je vous dis » conserve le contraste sans ajouter cette insistance.
  - severity: medium
    issue: « commet un adultère »
    rationale: La formulation française la plus naturelle pour l’acte désigné par μοιχᾶται est « commet l’adultère ». Elle évite aussi de présenter l’adultère comme un acte indéfini isolé.
  - severity: low
    issue: Ambiguïté potentielle de « en épouse une autre »
    rationale: Le pronom « en » peut alourdir ou obscurcir la reprise après « divorce de sa femme ». « épouse une autre femme » rend explicitement le féminin ἄλλην et reste naturel.
