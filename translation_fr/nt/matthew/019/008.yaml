id: MAT.19.8
reference: Matthew 19:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὅτι Μωϋσῆς πρὸς τὴν σκληροκαρδίαν ὑμῶν ἐπέτρεψεν ὑμῖν ἀπολῦσαι τὰς γυναῖκας ὑμῶν, ἀπ’ ἀρχῆς δὲ οὐ γέγονεν οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/008.yaml
  text: He said to them[a], “Because of your hardness of heart Moses permitted you to divorce your wives[c][b], but from the beginning it has not been so.”
translation:
  language: fr
  text: 'Il leur dit : « C’est à cause de votre dureté de cœur que Moïse vous a permis de divorcer de vos femmes[a]. Mais au commencement, il n’en était pas ainsi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « renvoyer vos femmes »; dans ce contexte, il s’agit du divorce.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Il leur dit
  rationale: Le présent historique grec est conservé, car il est naturel dans le récit français et donne de la vivacité au dialogue.
- source_word: πρὸς τὴν σκληροκαρδίαν ὑμῶν
  choice: C’est à cause de votre dureté de cœur
  rationale: La tournure exprime clairement la cause ou le motif de la concession, tout en conservant l’image biblique concrète du cœur endurci.
- source_word: ἐπέτρεψεν
  choice: a permis
  rationale: Le verbe exprime une permission ou une concession, et non un commandement ni une approbation.
- source_word: ἀπολῦσαι τὰς γυναῖκας ὑμῶν
  choice: de divorcer de vos femmes
  rationale: Dans ce contexte matrimonial, ἀπολύω désigne le divorce; «vos femmes» rend naturellement le sens conjugal de γυναῖκας en français.
- source_word: ἀπ’ ἀρχῆς
  choice: au commencement
  rationale: Cette formulation française courante préserve l’allusion au commencement de la création dans le contexte immédiat.
- source_word: οὐ γέγονεν οὕτως
  choice: il n’en était pas ainsi
  rationale: Cette expression idiomatique rend l’état de fait nié par le parfait grec sans transformer l’allusion contextuelle en explication doctrinale explicite.
theological_decisions:
- issue: Présenter la mesure mosaïque comme un commandement ou comme une concession
  choice: Moïse vous a permis
  alternative: Moïse vous a commandé
  rationale: ἐπέτρεψεν désigne une permission accordée face à la dureté humaine, non un commandement positif ni l’idéal originel.
- issue: Expliciter ou non le dessein créateur dans la dernière proposition
  choice: Mais au commencement, il n’en était pas ainsi
  alternative: Mais au commencement, tel n’était pas le dessein de Dieu
  rationale: La formulation retenue conserve la sobriété et l’ambiguïté référentielle du grec; le contexte fournit l’allusion à l’ordre créé sans qu’elle soit ajoutée au texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent historique « Il leur dit » convient au récit français. La tournure emphatique « C’est à cause de… que » clarifie le lien causal sans ajouter d’interprétation. Une seule note conserve le sens littéral de l’expression juridique grecque.
