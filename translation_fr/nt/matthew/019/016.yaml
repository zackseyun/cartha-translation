id: MAT.19.16
reference: Matthew 19:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ εἷς προσελθὼν ⸂αὐτῷ εἶπεν⸃· ⸀Διδάσκαλε, τί ἀγαθὸν ποιήσω ἵνα ⸀σχῶ ζωὴν αἰώνιον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/016.yaml
  text: And behold[a], one who had come up to him said, “Teacher, what good thing must I do so that I may have eternal life?”
translation:
  language: fr
  text: 'Et voici que quelqu’un, s’étant approché de lui, dit : « Maître, quelle bonne chose[a] dois-je faire afin d’avoir la vie éternelle ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quelle bonne action dois-je accomplir… ? » Le grec τί ἀγαθὸν peut désigner une « bonne chose » ou, avec le verbe « faire », une « bonne action ».'
    reason: Alternative lexicale préservant l’ambiguïté du grec.
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: Et voici que
  rationale: Conserve à la fois la liaison narrative de καί et la fonction de mise en relief de ἰδού, dans une tournure française actuelle et digne.
- source_word: εἷς
  choice: quelqu’un
  rationale: Le grec dit littéralement « un », sans préciser encore qu’il s’agit d’un homme. « Quelqu’un » est naturel en français et n’anticipe pas les renseignements donnés plus loin.
- source_word: προσελθὼν
  choice: s’étant approché de lui
  rationale: Le participe aoriste présente l’approche comme préalable à la parole. Le participe composé en français maintient cette subordination temporelle.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans cette interpellation, « Maître » est le titre français usuel d’un enseignant reconnu; le contexte ne lui attribue pas ici le sens de propriétaire ou de souverain.
- source_word: τί ἀγαθὸν
  choice: quelle bonne chose
  rationale: Cette formulation conserve l’expression grecque ouverte, qui peut désigner une chose bonne à faire ou, par implication, une bonne action.
- source_word: ποιήσω
  choice: dois-je faire
  rationale: Le subjonctif aoriste porte ici une question délibérative. « Dois-je faire » en exprime naturellement la portée pratique sans ajouter de conclusion théologique.
- source_word: ἵνα σχῶ
  choice: afin d’avoir
  rationale: « Afin de » rend explicitement la visée exprimée par ἵνα, tandis que « avoir » correspond directement à ἔχω.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Expression française établie, claire et fidèle dans ce contexte.
theological_decisions:
- issue: Identification de la personne qui s’approche
  choice: quelqu’un
  alternative: un homme; un jeune homme riche
  rationale: Le verset emploie seulement εἷς. La traduction n’importe pas prématurément les précisions fournies par la suite du récit ou par les récits parallèles.
- issue: Rapport exprimé entre l’action bonne et la vie éternelle
  choice: quelle bonne chose dois-je faire afin d’avoir la vie éternelle ?
  alternative: quelle bonne action dois-je accomplir pour obtenir la vie éternelle ?
  rationale: La traduction maintient la formulation orientée vers l’action et sa visée, sans trancher ici les questions doctrinales relatives aux œuvres, au mérite ou au salut.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme excessif. « Et voici que » garde la vivacité narrative; « s’étant approché » conserve la relation participiale du grec, tandis que la ponctuation assure la lisibilité.
