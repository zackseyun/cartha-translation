id: MAT.19.17
reference: Matthew 19:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τί με ⸂ἐρωτᾷς περὶ τοῦ ἀγαθοῦ; εἷς ἐστιν ὁ ἀγαθός⸃· εἰ δὲ θέλεις ⸂εἰς τὴν ζωὴν εἰσελθεῖν⸃, ⸀τήρησον τὰς ἐντολάς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/017.yaml
  text: And he said to him[a], “Why do you ask me about what is good? One is good. But if you want to enter into life[b], keep the commandments.”
translation:
  language: fr
  text: 'Il lui répondit[a] : « Pourquoi m’interroges-tu sur ce qui est bon ? Un seul est bon. Mais si tu veux entrer dans la vie, respecte les commandements. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits, ainsi que les récits parallèles, portent : « Pourquoi m’appelles-tu bon ? Personne n’est bon, sinon Dieu seul. » Le texte du SBLGNT pour Matthieu porte plutôt : « Pourquoi m’interroges-tu sur ce qui est bon ? Un seul est bon. »'
    reason: textual_variant
lexical_decisions:
- source_word: Τί με ἐρωτᾷς περὶ τοῦ ἀγαθοῦ
  choice: Pourquoi m’interroges-tu sur ce qui est bon ?
  rationale: Le neutre singulier τοῦ ἀγαθοῦ désigne ici ce qui est bon, plutôt qu’une personne. Cette formulation suit la syntaxe propre à Matthieu sans l’harmoniser avec les parallèles de Marc et de Luc.
- source_word: εἷς ἐστιν ὁ ἀγαθός
  choice: Un seul est bon
  rationale: Cette tournure française naturelle conserve l’affirmation concise du grec, où εἷς souligne l’unicité et ὁ ἀγαθός désigne celui qui est bon. Elle évite l’expression artificielle « Un est le bon » sans préciser explicitement « Dieu », absent de ce texte grec.
- source_word: εἰ δὲ θέλεις
  choice: Mais si tu veux
  rationale: « Veux » rend naturellement θέλεις en français moderne, tandis que « mais » marque la légère transition adversative portée par δέ.
- source_word: εἰς τὴν ζωὴν εἰσελθεῖν
  choice: entrer dans la vie
  rationale: Cette expression restitue directement le mouvement exprimé par εἰς et n’ajoute pas « éternelle », même si la vie eschatologique est impliquée par le contexte.
- source_word: τήρησον τὰς ἐντολάς
  choice: respecte les commandements
  rationale: Avec des commandements, τηρέω signifie les observer et leur obéir. « Respecte » est clair et idiomatique en français actuel, sans réduire le verbe à la simple connaissance des prescriptions.
theological_decisions:
- issue: Rapport entre la déclaration de Jésus, la bonté divine et la christologie
  choice: Traduire la forme textuelle de Matthieu comme une question portant sur ce qui est bon, suivie de « Un seul est bon », sans y voir ni introduire une négation de la bonté ou de la divinité de Jésus.
  alternative: 'Harmoniser avec Marc et Luc : « Pourquoi m’appelles-tu bon ? Personne n’est bon, sinon Dieu seul. »'
  rationale: Le texte du SBLGNT pour Matthieu se distingue des récits parallèles. La traduction préserve cette différence et la tension théologique du propos sans ajouter « Dieu » au texte principal ni tirer une conclusion christologique non explicitée dans la phrase.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement convient à l’échange direct et au registre narratif biblique courant. « Il lui répondit » évite le calque plus lourd « Et il lui dit ». La formulation « Un seul est bon » préserve l’unicité exprimée par εἷς tout en restant idiomatique.
