id: MAT.19.12
reference: Matthew 19:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ εὐνοῦχοι οἵτινες ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων, καὶ εἰσὶν εὐνοῦχοι οἵτινες εὐνούχισαν ἑαυτοὺς διὰ τὴν βασιλείαν τῶν οὐρανῶν. ὁ δυνάμενος χωρεῖν χωρείτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/012.yaml
  text: For there are eunuchs who were born that way from their mother’s womb[a], and there are eunuchs who were made eunuchs by men, and there are eunuchs who made themselves eunuchs for the sake of the kingdom of heaven[b]. The one able to accept this should accept it.
translation:
  language: fr
  text: Car il y a des eunuques qui sont nés ainsi dès le ventre de leur mère, il y a des eunuques que les hommes ont rendus eunuques, et il y a des eunuques qui se sont eux-mêmes rendus eunuques[a] pour le royaume des cieux. Que celui qui peut accepter cela l’accepte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « se sont eux-mêmes castrés » ; beaucoup comprennent cette expression au sens figuré : ils ont choisi le célibat pour le royaume des cieux.'
    reason: alternative_reading
  - marker: b
    text: Ou « Que celui qui peut recevoir cela le reçoive. »
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνοῦχοι
  choice: eunuques
  rationale: Le terme français correspond directement au grec et permet de conserver sa répétition, sans imposer dans le texte l’interprétation « célibataires ».
- source_word: ἐκ κοιλίας μητρὸς ἐγεννήθησαν οὕτως
  choice: sont nés ainsi du ventre de leur mère
  rationale: Cette formulation conserve l’image concrète du grec ainsi que le verbe « naître », tout en restant compréhensible en français moderne.
- source_word: εὐνουχίσθησαν ὑπὸ τῶν ἀνθρώπων
  choice: que les hommes ont rendus eunuques
  rationale: La formulation préserve le lien lexical avec « eunuques » et la voix passive du grec, sans réduire explicitement la catégorie à l’acte anatomique.
- source_word: εὐνούχισαν ἑαυτοὺς
  choice: se sont eux-mêmes rendus eunuques
  rationale: Cette traduction garde la formulation saisissante et réflexive du grec sans décider si elle doit être comprise littéralement, comme une hyperbole ou comme une image du célibat volontaire.
- source_word: διὰ τὴν βασιλείαν τῶν οὐρανῶν
  choice: pour le royaume des cieux
  rationale: « Pour » exprime naturellement en français le motif ou le but indiqué par διά avec l’accusatif, sans alourdir la phrase.
- source_word: ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Que celui qui peut accepter cela l’accepte
  rationale: Dans ce contexte, χωρέω désigne idiomatiquement la capacité d’accueillir ou d’accepter un enseignement exigeant. La tournure conserve la force exhortative de l’impératif.
theological_decisions:
- issue: Sens littéral ou figuré de εὐνούχισαν ἑαυτοὺς
  choice: Conserver dans le texte « se sont eux-mêmes rendus eunuques » sans l’expliquer.
  alternative: « se sont eux-mêmes castrés » ou « ont choisi le célibat »
  rationale: Le verset ne précise pas s’il s’agit d’un acte littéral, d’une hyperbole ou d’une image du renoncement au mariage. La traduction maintient volontairement cette tension, et la note signale les principales compréhensions.
- issue: Sens de l’exhortation finale ὁ δυνάμενος χωρεῖν χωρείτω
  choice: Employer « accepter » dans le texte.
  alternative: « recevoir » ou « faire une place à »
  rationale: « Accepter » rend clairement l’emploi idiomatique de χωρέω en français contemporain, tandis qu’une note conserve l’équivalent plus formel « recevoir ».
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « eunuques » reproduit celle du grec. La formulation demeure volontairement explicite sans résoudre le caractère littéral ou figuré de la troisième catégorie.
