  text: λέγει αὐτῷ ὁ νεανίσκος· ⸂Πάντα ταῦτα⸃ ⸀ἐφύλαξα· τί ἔτι ὑστερῶ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/020.yaml
  text: The young man says to him[a], “All these I have kept[b]. What do I still lack?”
translation:
  language: fr
  text: 'Le jeune homme lui dit : « J’ai observé tout cela. Que me manque-t-il encore[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « En quoi suis-je encore en défaut ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent de narration français, naturel dans ce dialogue.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif se rend naturellement par « lui » avec le verbe dire.
- source_word: ὁ νεανίσκος
  choice: le jeune homme
  rationale: Cette expression traduit directement νεανίσκος sans importer la qualité de chef mentionnée dans une autre tradition synoptique.
- source_word: Πάντα ταῦτα
  choice: tout cela
  rationale: La formule renvoie naturellement, en français, à l’ensemble des commandements qui viennent d’être cités.
- source_word: ἐφύλαξα
  choice: j’ai observé
  rationale: Dans le contexte des commandements, φυλάσσω signifie les observer ou les garder. Le passé composé exprime naturellement une conduite passée ayant une portée présente.
- source_word: τί ἔτι ὑστερῶ
  choice: Que me manque-t-il encore ?
  rationale: Cette formulation française claire conserve l’idée d’une insuffisance qui subsiste, sans préciser indûment sa nature.
theological_decisions:
- issue: Appréciation que le jeune homme porte sur son obéissance
  choice: Sa déclaration d’avoir observé les commandements est rapportée sans approbation ni ironie ajoutée.
  alternative: Présenter sa déclaration comme sincère mais erronée, ou comme une exagération rhétorique.
  rationale: Le grec rapporte directement son affirmation. La traduction laisse au contexte narratif le soin d’en éclairer la portée théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif « dit » préserve le temps grec; « observé » convient au contexte des commandements. La formulation reste neutre quant à la validité de l’affirmation du jeune homme.
