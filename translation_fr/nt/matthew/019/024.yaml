id: MAT.19.24
reference: Matthew 19:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάλιν δὲ λέγω ὑμῖν, εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸀τρυπήματος ῥαφίδος ⸀εἰσελθεῖν ἢ πλούσιον ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/024.yaml
  text: Again I tell you[b][a], it is easier for a camel to go through the eye of a needle than for a rich man to enter into the kingdom of God.
translation:
  language: fr
  text: 'Je vous le dis encore : il est plus facile à un chameau[a] de passer par le chas d’une aiguille[b] qu’à un riche d’entrer dans le royaume de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains ont proposé « une corde » au lieu de « un chameau », mais le texte grec porte ici « chameau ».
    reason: alternative_reading
  - marker: b
    text: 'Ou : « par le trou d’une aiguille ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δὲ λέγω ὑμῖν
  choice: Je vous le dis encore
  rationale: Cette formulation française naturelle conserve l’idée de répétition portée par πάλιν et la formule d’adresse directe λέγω ὑμῖν. Le δέ est ici une liaison légère qui n’exige pas nécessairement un « mais » explicite.
- source_word: εὐκοπώτερόν ἐστιν
  choice: il est plus facile
  rationale: Le comparatif introduit deux infinitifs mis en parallèle ; « il est plus facile » en restitue clairement et directement la construction.
- source_word: κάμηλον
  choice: un chameau
  rationale: Le texte grec porte κάμηλον, qui signifie « chameau ». Cette traduction préserve l’image hyperbolique sans l’atténuer.
- source_word: διὰ τρυπήματος ῥαφίδος
  choice: par le chas d’une aiguille
  rationale: τρύπημα désigne ici l’ouverture d’une aiguille, et « le chas d’une aiguille » est l’expression française précise et courante.
- source_word: εἰσελθεῖν
  choice: passer / entrer
  rationale: 'Le même infinitif grec est rendu selon ses deux compléments : « passer » convient naturellement au mouvement par le chas d’une aiguille, tandis que « entrer » convient au royaume.'
- source_word: ἢ πλούσιον
  choice: qu’à un riche
  rationale: Le substantif adjectival masculin singulier désigne une personne riche. « Un riche » est concis, naturel et conserve la forme grammaticale du grec.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: d’entrer dans le royaume de Dieu
  rationale: « Entrer dans » rend naturellement εἰς avec le verbe de mouvement et conserve l’expression centrale « le royaume de Dieu ».
theological_decisions:
- issue: Interprétation de l’image du chameau et du chas de l’aiguille
  choice: Conserver la comparaison hyperbolique frappante telle qu’elle apparaît dans le texte grec.
  alternative: Y voir une allusion à une prétendue porte de Jérusalem appelée « le trou de l’aiguille », ou remplacer « chameau » par « corde ».
  rationale: Le grec présente directement un chameau et l’ouverture d’une aiguille. Rien dans le texte ne justifie une allégorisation en porte urbaine ni un adoucissement de l’impossibilité exprimée ; la tension du propos doit donc être préservée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le contraste vigoureux de l’original. « Chas » est le terme français exact et largement compris pour l’ouverture d’une aiguille ; une formulation plus descriptive est fournie en note.
