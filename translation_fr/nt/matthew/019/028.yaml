language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ὑμεῖς οἱ ἀκολουθήσαντές μοι ἐν τῇ παλιγγενεσίᾳ, ὅταν καθίσῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐπὶ θρόνου δόξης αὐτοῦ, ⸀καθήσεσθε καὶ ⸀ὑμεῖς ἐπὶ δώδεκα θρόνους κρίνοντες τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/028.yaml
  text: And Jesus said to them[a], “Truly I say to you, you who have followed me will also sit on twelve thrones in the renewal, when the Son of Man sits on the throne of his glory[b], judging the twelve tribes of Israel.”
translation:
  language: fr
  text: 'Jésus leur dit : « En vérité, je vous le dis, vous qui m’avez suivi, lors du renouvellement[a], quand le Fils de l’homme siégera sur son trône glorieux, vous siégerez vous aussi sur douze trônes, en jugeant[b] les douze tribus d’Israël. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lors de la régénération », « dans le monde nouveau » ou « lors de la renaissance ». Ici, le terme désigne vraisemblablement le renouvellement futur associé au règne du Fils de l’homme, et non la nouvelle naissance individuelle.
    reason: lexical_alternative
  - marker: b
    text: « Juger » peut aussi comporter ici l’idée de gouverner ou d’exercer l’autorité.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν
  choice: En vérité
  rationale: Cette formule française naturelle et solennelle rend l’introduction autoritative de Jésus sans conserver inutilement l’emprunt « amen ».
- source_word: ἀκολουθήσαντές μοι
  choice: vous qui m’avez suivi
  rationale: Le passé composé identifie naturellement en français les destinataires par le fait qu’ils ont suivi Jésus, tout en gardant le complément personnel explicite.
- source_word: παλιγγενεσίᾳ
  choice: lors du renouvellement
  rationale: « Renouvellement » préserve l’idée de renaissance ou de régénération sans l’identifier à la nouvelle naissance individuelle. « Lors de » exprime ici naturellement le cadre temporel futur.
- source_word: ὅταν καθίσῃ
  choice: quand … siégera
  rationale: La proposition grecque vise un événement futur. En français, contrairement à l’anglais, le futur après « quand » est idiomatique et précis.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Formulation française consacrée qui conserve les résonances bibliques et messianiques du titre.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: sur son trône glorieux
  rationale: Cette tournure rend naturellement le génitif qualitatif grec et maintient le registre élevé.
- source_word: καθήσεσθε καὶ ὑμεῖς
  choice: vous siégerez vous aussi
  rationale: « Siéger » convient au contexte des trônes, tandis que « vous aussi » restitue l’emphase de καὶ ὑμεῖς et le parallèle avec le Fils de l’homme.
- source_word: ἐπὶ δώδεκα θρόνους
  choice: sur douze trônes
  rationale: Traduction directe, naturelle et précise de l’expression locative.
- source_word: κρίνοντες
  choice: pour juger
  rationale: L’infinitif de but ou de fonction s’intègre naturellement à la phrase française tout en conservant le sens judiciaire premier du participe grec.
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: les douze tribus d’Israël
  rationale: Traduction conventionnelle, claire et exacte de la désignation biblique.
theological_decisions:
- issue: Sens de παλιγγενεσία dans ce contexte
  choice: le renouvellement eschatologique associé à l’intronisation du Fils de l’homme
  alternative: la régénération individuelle, le monde nouveau ou l’âge nouveau
  rationale: Le contexte immédiat concerne l’intronisation, les trônes et le jugement futurs. La traduction indique donc un renouvellement futur sans préciser un système millénariste ni ajouter « de toutes choses », absent du grec.
- issue: Portée de κρίνοντες
  choice: juger
  alternative: gouverner ou exercer l’autorité
  rationale: Le verbe grec signifie directement « juger », mais peut englober une fonction de gouvernement. Le texte principal conserve son sens lexical premier et la note signale la nuance possible sans résoudre la tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Siéger » évite la lourdeur de « être assis » dans un contexte royal et judiciaire. La syntaxe suit le mouvement du grec tout en plaçant naturellement les compléments en français; tous les marqueurs de notes figurent dans le texte principal.
