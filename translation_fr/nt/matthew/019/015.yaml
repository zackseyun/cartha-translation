id: MAT.19.15
reference: Matthew 19:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπιθεὶς ⸂τὰς χεῖρας αὐτοῖς⸃ ἐπορεύθη ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/015.yaml
  text: And after laying his hands on them[a], he went on from there.
translation:
  language: fr
  text: Puis il posa les mains sur eux et partit de là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Puis
  rationale: Dans la continuité du récit, καί relie naturellement cette action à la scène précédente; « Puis » exprime cette progression sans ajouter de lien causal.
- source_word: ἐπιθεὶς
  choice: il posa
  rationale: Le participe aoriste indique une action accomplie avant le départ. La coordination française « Puis il posa… et partit » restitue clairement et naturellement cette succession.
- source_word: τὰς χεῖρας αὐτοῖς
  choice: les mains sur eux
  rationale: L’expression désigne concrètement l’imposition des mains. Le français emploie naturellement l’article défini avec une partie du corps; il n’est donc pas nécessaire d’ajouter « ses ».
- source_word: ἐπορεύθη
  choice: partit
  rationale: Dans ce contexte narratif, le verbe signifie que Jésus quitta le lieu. « Partit » est courant, digne et plus précis ici que le simple « alla ».
- source_word: ἐκεῖθεν
  choice: de là
  rationale: Cette expression rend directement et idiomatiquement l’adverbe de provenance.
theological_decisions:
- issue: Nature du geste de Jésus
  choice: 'Conserver le geste concret: « posa les mains sur eux »'
  alternative: 'Remplacer le geste par son sens implicite: « les bénit »'
  rationale: Le contexte associe probablement ce geste à une bénédiction, mais le grec nomme explicitement l’imposition des mains. La traduction ne substitue donc pas l’interprétation au geste rapporté.
translation_notes:
  register: Français international moderne, simple et digne. La coordination rend la succession temporelle du participe grec sans alourdir la phrase; aucune terminologie sacramentelle ou ecclésiastique n’est ajoutée.
