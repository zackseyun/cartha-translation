id: MAT.19.3
reference: Matthew 19:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ προσῆλθον ⸀αὐτῷ Φαρισαῖοι πειράζοντες αὐτὸν καὶ ⸀λέγοντες· Εἰ ἔξεστιν ⸀ἀνθρώπῳ ἀπολῦσαι τὴν γυναῖκα αὐτοῦ κατὰ πᾶσαν αἰτίαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/003.yaml
  text: And Pharisees came up to him[a], testing him and saying, “Is it lawful for a man to divorce his wife for any cause?”
translation:
  language: fr
  text: 'Des pharisiens s’approchèrent de lui et, pour le mettre à l’épreuve, lui demandèrent : « Est-il permis à un homme de divorcer de sa femme pour n’importe quel motif[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour n’importe quelle raison » ou « sur n’importe quel fondement ». L’expression grecque formule une question juridique très large sur les motifs permettant le divorce.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον
  choice: s’approchèrent de
  rationale: Le verbe exprime le mouvement vers quelqu’un. « S’approchèrent de lui » est naturel en français et conserve cette nuance directionnelle.
- source_word: πειράζοντες
  choice: pour le mettre à l’épreuve
  rationale: Le verbe peut signifier éprouver, tester ou tenter. Ici, il décrit une démarche hostile visant à éprouver Jésus; cette formulation garde le sens sans suggérer uniquement une incitation au péché.
- source_word: λέγοντες
  choice: lui demandèrent
  rationale: Le participe introduit ici une question directe. « Lui demandèrent » rend naturellement en français la fonction de « disant » dans ce contexte.
- source_word: ἔξεστιν
  choice: est-il permis
  rationale: Dans ce débat de nature juridique et religieuse, le terme porte sur ce qui est autorisé. « Est-il permis » est clair et idiomatique, sans surcharger la formulation.
- source_word: ἀνθρώπῳ
  choice: à un homme
  rationale: Bien que le nom puisse parfois avoir un sens générique, la mention immédiate de « sa femme » désigne concrètement un mari; « un homme » respecte donc le genre et le contexte du grec.
- source_word: ἀπολῦσαι
  choice: de divorcer de
  rationale: ἀπολύω signifie littéralement renvoyer ou libérer, mais constitue ici le terme idiomatique désignant le divorce. La traduction explicite directement le sens matrimonial et juridique.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sa femme
  rationale: γυνή peut signifier « femme » au sens général ou « épouse ». Le possessif et le contexte du divorce imposent ici le sens d’épouse; « sa femme » est l’expression française courante.
- source_word: κατὰ πᾶσαν αἰτίαν
  choice: pour n’importe quel motif
  rationale: La formule porte sur l’étendue des motifs susceptibles de justifier un divorce. Cette traduction conserve la portée très large de πᾶσαν et convient au cadre d’un débat juridique.
theological_decisions:
- issue: Formuler la question sur le divorce sans trancher le débat juridique ancien ni importer une doctrine confessionnelle ultérieure
  choice: Est-il permis à un homme de divorcer de sa femme pour n’importe quel motif ?
  alternative: Est-il permis à un mari de renvoyer sa femme pour quelque raison que ce soit ?
  rationale: Le verset rapporte une mise à l’épreuve sous forme de question et ne donne pas encore la réponse de Jésus. La traduction maintient donc l’ouverture et l’ampleur de la question, tout en employant le terme moderne « divorcer » plutôt qu’une formulation susceptible d’évoquer un simple renvoi informel.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe transforme naturellement le participe « disant » en verbe de parole interrogative (« lui demandèrent »), tout en conservant explicitement l’intention de mise à l’épreuve. Le marqueur de note est placé après la formule qu’il explique.
