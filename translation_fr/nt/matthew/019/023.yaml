id: MAT.19.23
reference: Matthew 19:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Ἀμὴν λέγω ὑμῖν ὅτι ⸂πλούσιος δυσκόλως⸃ εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/023.yaml
  text: Then Jesus said to his disciples[a], “Truly I say to you[b], a rich man will enter the kingdom of heaven with difficulty.”
translation:
  language: fr
  text: 'Alors Jésus dit à ses disciples : « Vraiment, je vous le dis[a], un homme riche entrera difficilement dans le royaume des cieux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Amen, je vous le dis. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Alors
  rationale: Marque ici la transition et la progression du récit ; « Alors » est naturel en français sans alourdir la phrase.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: à ses disciples
  rationale: Conserve le possessif explicite αὐτοῦ et le terme habituel « disciples » dans le contexte des Évangiles.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Vraiment, je vous le dis
  rationale: Rend clairement en français moderne la formule solennelle par laquelle Jésus souligne l’autorité et la véracité de sa déclaration, tout en signalant en note la forme plus littérale avec « Amen ».
- source_word: πλούσιος
  choice: un homme riche
  rationale: L’adjectif substantivé est au masculin singulier et désigne un individu représentatif ; cette formulation conserve le nombre et le genre du grec.
- source_word: δυσκόλως
  choice: difficilement
  rationale: Rend directement l’adverbe de manière sans transformer à lui seul la difficulté en impossibilité ; le verset suivant renforce ensuite le propos.
- source_word: εἰσελεύσεται
  choice: entrera
  rationale: Rend simplement et directement le futur de εἰσέρχομαι.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Expression française consacrée qui conserve la formulation caractéristique de Matthieu ainsi que le pluriel de οὐρανῶν.
theological_decisions:
- issue: Portée de δυσκόλως concernant l’entrée du riche dans le royaume
  choice: entrera difficilement
  alternative: aura du mal à entrer / n’entrera que difficilement
  rationale: Le grec exprime explicitement la difficulté. La traduction ne convertit pas prématurément cette affirmation en impossibilité absolue, tout en laissant le contexte suivant en préciser la force.
- issue: Genre de l’adjectif substantivé πλούσιος
  choice: un homme riche
  alternative: une personne riche
  rationale: Le grec emploie un masculin singulier représentant un individu ; « un homme riche » en conserve la forme sans restreindre la portée générale de l’enseignement.
- issue: Formule solennelle Ἀμὴν λέγω ὑμῖν
  choice: Vraiment, je vous le dis
  alternative: Amen, je vous le dis
  rationale: « Vraiment » communique naturellement la force assertive de la formule en français moderne ; la note conserve la possibilité de reprendre directement le terme sémitique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle à l’oral comme à la lecture publique ; « royaume des cieux » maintient l’expression matthéenne traditionnelle.
