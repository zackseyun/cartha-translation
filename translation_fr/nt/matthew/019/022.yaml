id: MAT.19.22
reference: Matthew 19:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ νεανίσκος τὸν ⸀λόγον ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/022.yaml
  text: But when the young man heard this word[a], he went away grieving[c][b], for he had many possessions.
translation:
  language: fr
  text: Mais, après avoir entendu cette parole[a], le jeune homme s’en alla attristé[b], car il avait beaucoup de biens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette déclaration » ; le grec dit littéralement « la parole » et renvoie à ce que Jésus vient de dire.
    reason: lexical_alternative
  - marker: b
    text: Ou « tout triste » ; le participe grec décrit la tristesse qui accompagne son départ.
    reason: lexical_alternative
  - marker: c
    text: 'Traditionnellement « de grands biens ». Le grec souligne plus littéralement la quantité : « beaucoup de biens ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: après avoir entendu
  rationale: Le participe aoriste marque ici l’antériorité immédiate de l’écoute par rapport au départ; cette tournure est naturelle en français et préserve la succession des actions.
- source_word: δὲ
  choice: Mais
  rationale: La particule introduit un léger contraste entre l’appel de Jésus et la réaction négative du jeune homme.
- source_word: ὁ νεανίσκος
  choice: le jeune homme
  rationale: Le nom désigne un jeune homme; «chef» ou «notable» importerait une précision provenant du récit parallèle de Luc.
- source_word: τὸν λόγον
  choice: cette parole
  rationale: Dans le contexte, λόγος renvoie aux paroles que Jésus vient de prononcer. «Cette parole» reste proche du grec tout en étant idiomatique.
- source_word: ἀπῆλθεν
  choice: s’en alla
  rationale: Cette formulation narrative courante exprime clairement son départ.
- source_word: λυπούμενος
  choice: tout triste
  rationale: Le participe présent décrit l’état de tristesse qui accompagne son départ. «Tout triste» est naturel en français actuel sans exagérer l’intensité.
- source_word: ἦν γὰρ ἔχων
  choice: car il avait
  rationale: La construction périphrastique exprime une possession durable; le français la rend naturellement par l’imparfait «avait».
- source_word: κτήματα πολλά
  choice: beaucoup de biens
  rationale: κτήματα désigne des biens ou propriétés, et πολλά en souligne la quantité. Cette traduction évite de transformer la quantité en grandeur ou en valeur.
theological_decisions:
- issue: Faut-il identifier le jeune homme comme un chef ou un notable d’après les récits parallèles?
  choice: le jeune homme
  alternative: le jeune chef / le jeune notable
  rationale: Le texte grec de Matthieu le qualifie seulement de νεανίσκος, «jeune homme». Ajouter son statut harmoniserait Matthieu avec Luc au lieu de traduire ce verset selon sa formulation propre.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure «s’en alla tout triste» conserve le mouvement narratif et l’état affectif simultané. «Beaucoup de biens» rend explicitement la quantité exprimée par πολλά sans reprendre la formulation traditionnelle ambiguë «de grands biens».
