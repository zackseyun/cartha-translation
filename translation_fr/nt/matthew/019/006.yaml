id: MAT.19.6
reference: Matthew 19:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ σὰρξ μία. ὃ οὖν ὁ θεὸς συνέζευξεν ἄνθρωπος μὴ χωριζέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/006.yaml
  text: So they are no longer two[a], but one flesh. Therefore, what God has joined together, man must not separate.
translation:
  language: fr
  text: Ainsi, ils ne sont plus deux, mais une seule chair. Que personne donc ne sépare ce que Dieu a uni.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi
  rationale: Introduit le résultat de la déclaration précédente sur les deux qui deviennent une seule chair, dans un français naturel tout en gardant la valeur consécutive.
- source_word: οὐκέτι εἰσὶν δύο
  choice: ils ne sont plus deux
  rationale: Rend directement la négation temporelle et le contraste numérique du grec.
- source_word: σὰρξ μία
  choice: une seule chair
  rationale: Conserve l’expression biblique qui fait écho à la Genèse. « Une seule » exprime naturellement en français l’unité opposée aux « deux ».
- source_word: ὃ οὖν
  choice: ce que… donc
  rationale: Le pronom relatif neutre désigne l’union réalisée par Dieu, tandis que « donc » conserve la portée déductive de οὖν sans alourdir la phrase.
- source_word: συνέζευξεν
  choice: a uni
  rationale: Exprime avec naturel l’action d’attacher ensemble dans le contexte du mariage. « A uni » garde l’action accomplie sans imposer en français l’image plus marquée du joug.
- source_word: ἄνθρωπος
  choice: personne
  rationale: 'Dans cette interdiction, le nom singulier a une portée générique : aucun être humain ne doit séparer cette union. La tournure française « que personne ne… » rend cette portée clairement et sans laisser entendre qu’il ne serait question que des hommes.'
- source_word: μὴ χωριζέτω
  choice: Que personne… ne sépare
  rationale: Le présent impératif avec μή formule une interdiction. Cette construction au subjonctif rend en français moderne la force de l’impératif à la troisième personne.
theological_decisions:
- issue: Portée générique de ἄνθρωπος dans l’interdiction
  choice: « personne », au sens d’aucun être humain
  alternative: « l’homme » ou « un être humain »
  rationale: Le contexte exige une référence générique. « Personne » communique directement que nul être humain ne doit défaire ce que Dieu a uni, sans transformer la forme masculine du grec en restriction aux seuls hommes.
- issue: Langage de l’union conjugale faisant écho à la Genèse
  choice: « une seule chair »
  alternative: « un seul corps »
  rationale: La formulation traditionnelle conserve l’écho intertextuel et la tension propre à l’image de la chair, sans l’expliquer ni la réduire à la seule union corporelle.
- issue: Nature de l’action divine exprimée par συνέζευξεν
  choice: « ce que Dieu a uni »
  alternative: « ce que Dieu a joint ensemble » ou « placé sous un même joug »
  rationale: « Uni » exprime fidèlement et sobrement l’action divine dans le mariage, sans développer l’image étymologique du joug ni ajouter une définition doctrinale du lien.
translation_notes:
  register: Français international moderne, clair et digne. La première phrase garde le contraste rhétorique entre « deux » et « une seule chair ». La seconde emploie une tournure exhortative naturelle qui conserve la force de l’interdiction grecque.
