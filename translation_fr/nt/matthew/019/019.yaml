id: MAT.19.19
reference: Matthew 19:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τίμα τὸν πατέρα καὶ τὴν μητέρα, καὶ Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/019.yaml
  text: Honor your father and mother[a], and love your neighbor as yourself.
translation:
  language: fr
  text: Honore ton père et ta mère, et aime ton prochain comme toi-même.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Honore ton père et ta mère, et tu aimeras ton prochain comme toi-même. »'
    reason: La note conserve le futur de l’indicatif grec Ἀγαπήσεις, employé ici avec une valeur prescriptive dans la citation de la Torah.
lexical_decisions:
- source_word: Τίμα
  choice: Honore
  rationale: 'L’impératif rend l’ordre explicite et reprend naturellement en français la formulation traditionnelle du commandement. « Honorer » exprime davantage que le simple respect intérieur : il s’agit d’accorder aux parents l’honneur qui leur est dû.'
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: ton père et ta mère
  rationale: Bien que le grec emploie les articles, le français exige naturellement les possessifs dans cette formulation adressée directement à une personne et héritée du Décalogue.
- source_word: Ἀγαπήσεις
  choice: aime
  rationale: Le futur de l’indicatif grec reprend la forme prescriptive d’une citation de la Torah. L’impératif français s’accorde naturellement avec « Honore » et conserve la force du commandement; la forme plus littérale est signalée en note.
- source_word: τὸν πλησίον σου
  choice: ton prochain
  rationale: « Le prochain » est le terme français précis et consacré dans ce contexte éthique; il désigne l’autre envers qui s’exerce l’amour commandé, sans se limiter à la proximité géographique.
- source_word: ὡς σεαυτόν
  choice: comme toi-même
  rationale: Cette formulation concise reproduit la comparaison grecque sans ajouter un verbe absent du texte.
theological_decisions:
- issue: Forme des commandements dans une citation scripturaire
  choice: 'Employer deux impératifs : « Honore… et aime… »'
  alternative: « Honore ton père et ta mère, et tu aimeras ton prochain comme toi-même. »
  rationale: Le grec associe un impératif à un futur de l’indicatif parce que Jésus cite des formulations de commandements. Deux impératifs donnent en français moderne une liste cohérente d’ordres sans modifier leur portée. La différence formelle du grec est néanmoins préservée dans une note.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement correspond au singulier des formes grecques et à la formulation traditionnelle des commandements. « Honore » et « ton prochain » conservent le registre biblique courant sans être archaïques.
