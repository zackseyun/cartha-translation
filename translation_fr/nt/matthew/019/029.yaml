id: MAT.19.29
reference: Matthew 19:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶς ⸀ὅστις ἀφῆκεν ⸂οἰκίας ἢ⸃ ἀδελφοὺς ἢ ἀδελφὰς ἢ πατέρα ἢ μητέρα ἢ ⸂γυναῖκα ἢ⸃ τέκνα ἢ ⸀ἀγροὺς ἕνεκεν τοῦ ⸂ὀνόματός μου⸃, ⸀ἑκατονταπλασίονα λήμψεται καὶ ζωὴν αἰώνιον κληρονομήσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/029.yaml
  text: And everyone who has left houses or brothers or sisters or father or mother or wife or children or fields for the sake of my name will receive a hundredfold and will inherit eternal life[a].
translation:
  language: fr
  text: Et toute personne qui aura quitté des maisons ou ses frères ou ses sœurs ou son père ou sa mère ou sa femme ou ses enfants ou des champs à cause de mon nom recevra cent fois plus[a] et héritera de la vie éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une formulation plus traditionnelle : « au centuple ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὅστις
  choice: toute personne qui
  rationale: Cette formulation distributive et générique exprime naturellement en français moderne que la promesse concerne chaque personne répondant à la condition.
- source_word: ἀφῆκεν
  choice: aura quitté
  rationale: Le futur antérieur s’accorde naturellement avec le futur « recevra » dans cette relative à valeur conditionnelle et présente l’acte de quitter comme antérieur à la récompense, sans la connotation plus forte d’« abandonner ».
- source_word: οἰκίας
  choice: des maisons
  rationale: Le pluriel concret conserve le sens de biens et de lieux d’habitation, en parallèle avec les champs.
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: des frères, des sœurs
  rationale: Les deux termes de parenté sont explicitement distincts dans le grec et doivent le rester.
- source_word: πατέρα / μητέρα
  choice: son père, sa mère
  rationale: L’ajout idiomatique du possessif en français clarifie la relation familiale sans modifier le sens.
- source_word: γυναῖκα
  choice: sa femme
  rationale: Dans cette liste de relations familiales, γυνή désigne naturellement l’épouse; « sa femme » est courant et non ambigu ici.
- source_word: τέκνα
  choice: ses enfants
  rationale: Terme français usuel pour les descendants dans une liste familiale.
- source_word: ἀγρούς
  choice: des champs
  rationale: Le terme conserve concrètement la dimension foncière et économique sans préciser indûment qu’il s’agit de fermes ou de domaines.
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: à cause de mon nom
  rationale: Cette formulation exprime le motif tout en conservant l’image biblique du « nom », qui renvoie à la personne, à l’autorité et à l’identité de Jésus.
- source_word: ἑκατονταπλασίονα
  choice: cent fois plus
  rationale: Expression française actuelle et immédiatement compréhensible qui transmet la multiplication promise; la formulation traditionnelle figure en note.
- source_word: ζωὴν αἰώνιον κληρονομήσει
  choice: héritera de la vie éternelle
  rationale: La traduction maintient la métaphore successorale de κληρονομέω et l’expression théologique « vie éternelle ».
theological_decisions:
- issue: Sens de γυνή dans la liste du renoncement lié à la condition de disciple
  choice: sa femme
  alternative: une femme
  rationale: Le contexte énumère des liens familiaux précis; le sens d’« épouse » est donc préférable sans suggérer un renoncement général aux femmes.
- issue: Maintien de l’expression « mon nom »
  choice: à cause de mon nom
  alternative: à cause de moi
  rationale: Conserver « mon nom » respecte l’expression grecque et sa portée théologique, sans réduire le nom à une simple périphrase de la personne.
- issue: Portée de la récompense exprimée par ἑκατονταπλασίονα
  choice: cent fois plus
  alternative: au centuple
  rationale: La traduction communique la force quantitative de la promesse sans expliquer si elle doit être comprise matériellement, communautairement ou eschatologiquement; cette tension reste ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination de la liste reste proche du grec, tandis que les possessifs rendent les liens familiaux idiomatiques en français. « Au centuple » est conservé en note comme équivalent plus traditionnel.
