id: MAT.19.1
reference: Matthew 19:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, μετῆρεν ἀπὸ τῆς Γαλιλαίας καὶ ἦλθεν εἰς τὰ ὅρια τῆς Ἰουδαίας πέραν τοῦ Ἰορδάνου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/019/001.yaml
  text: And it happened that when Jesus had finished these words[a], he departed from Galilee and came into the region of Judea beyond the Jordan.
translation:
  language: fr
  text: Quand Jésus eut achevé ces paroles, il quitta la Galilée et se rendit dans le territoire de la Judée, au-delà du Jourdain[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’autre côté du Jourdain ».'
    reason: Alternative lexicale et géographique naturelle pour πέραν τοῦ Ἰορδάνου.
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: Quand
  rationale: La formule grecque sert ici de transition narrative. En français moderne, la subordonnée temporelle rend naturellement cette fonction sans recourir au tour plus lourd « Il arriva que ».
- source_word: ὅτε ἐτέλεσεν
  choice: eut achevé
  rationale: Le passé antérieur marque clairement que le discours de Jésus est terminé avant son départ et convient au registre narratif soutenu.
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: « Paroles » renvoie naturellement au discours qui précède et conserve la portée assez large de λόγοι.
- source_word: μετῆρεν ἀπὸ τῆς Γαλιλαίας
  choice: il quitta la Galilée
  rationale: « Quitter » exprime directement et naturellement le départ hors de la région indiquée.
- source_word: ἦλθεν εἰς
  choice: se rendit dans
  rationale: Ce tour français exprime le déplacement vers l’intérieur d’un territoire sans imposer le point de vue déictique parfois suggéré par « vint ».
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: le territoire de la Judée
  rationale: Dans ce contexte de voyage, ὅρια désigne la région ou le territoire plutôt qu’une simple ligne frontalière.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: au-delà du Jourdain
  rationale: Cette expression conserve le sens spatial de πέραν tout en restant naturelle dans un récit géographique.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé antérieur maintient la succession temporelle du grec, tandis que « se rendit » évite une formulation géographique artificielle. Le marqueur de note est placé après l’expression à laquelle il se rapporte.
