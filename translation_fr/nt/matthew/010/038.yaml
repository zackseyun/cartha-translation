source:
  edition: SBLGNT
  text: καὶ ὃς οὐ λαμβάνει τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθεῖ ὀπίσω μου, οὐκ ἔστιν μου ἄξιος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/038.yaml
  text: And whoever does not take up his cross and follow after me is not worthy of me[a][b].
translation:
  language: fr
  text: Et quiconque ne prend pas sa croix[a] et ne me suit pas[b] n’est pas digne de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le possessif renvoie à la croix propre à chaque personne comprise dans « quiconque ».
    reason: lexical_alternative
  - marker: b
    text: Le grec ajoute l’idée de suivre « derrière moi » ou « à ma suite » ; « me suit » est la tournure française idiomatique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: quiconque
  rationale: « Quiconque » exprime naturellement en français la portée indéfinie et générale du relatif grec, sans limiter l’énoncé à un individu précis.
- source_word: λαμβάνει
  choice: prend
  rationale: Avec « sa croix », « prend » rend directement le verbe grec. En français, l’expression complète porte déjà l’idée d’assumer la croix, sans qu’il soit nécessaire d’ajouter « sur soi ».
- source_word: σταυρὸν αὐτοῦ
  choice: sa croix
  rationale: Cette formulation conserve l’image concrète de la croix ainsi que la référence singulière à la croix propre à chaque disciple. Le possessif français convient à toute personne désignée par « quiconque ».
- source_word: ἀκολουθεῖ ὀπίσω μου
  choice: me suit
  rationale: « Me suit » est la tournure française naturelle pour l’ensemble grec. La nuance plus explicite de ὀπίσω, « derrière moi » ou « à ma suite », est signalée en note.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: n’est pas digne de moi
  rationale: Cette traduction directe préserve le jugement solennel et relationnel exprimé par ἄξιος avec le génitif μου.
theological_decisions:
- issue: L’image de porter sa croix dans l’appel à devenir disciple
  choice: Conserver l’image concrète « prend sa croix »
  alternative: Paraphraser par « accepte de souffrir » ou « renonce à lui-même »
  rationale: Le texte évoque explicitement la croix, avec ses connotations de souffrance, de honte et de mise à mort. Une paraphrase abstraite réduirait la force historique et théologique de l’image.
- issue: La portée générale du masculin singulier grec
  choice: Employer « quiconque » et « sa croix »
  alternative: Employer « celui qui » ou développer « chaque homme ou chaque femme »
  rationale: « Quiconque » conserve la valeur générale du grec dans un français naturel et inclusif, tandis que « sa » maintient la référence singulière à la croix propre à chaque personne.
translation_notes:
  register: Français international moderne, sobre et solennel. « Quiconque » est légèrement soutenu mais courant dans une maxime de cette gravité. La répétition de « ne… pas » rend clairement en français que les deux actes — prendre sa croix et suivre Jésus — sont exigés.
