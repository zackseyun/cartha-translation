  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ φιλῶν πατέρα ἢ μητέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος· καὶ ὁ φιλῶν υἱὸν ἢ θυγατέρα ὑπὲρ ἐμὲ οὐκ ἔστιν μου ἄξιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/037.yaml
  text: The one who loves father or mother more than me is not worthy of me[a], and the one who loves son or daughter more than me is not worthy of me.
translation:
  language: fr
  text: Celui qui aime son père ou sa mère plus que moi[a] n’est pas digne de moi ; et celui qui aime son fils ou sa fille plus que moi n’est pas digne de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au-dessus de moi ». L’expression grecque indique qu’on aime quelqu’un de préférence à Jésus.
    reason: alternative lexicale
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: celui qui aime
  rationale: L’article suivi du participe présent désigne de manière générale une personne caractérisée par cette action. « Celui qui aime » est naturel, digne et conserve le singulier générique.
- source_word: πατέρα ἢ μητέρα
  choice: son père ou sa mère
  rationale: Le grec n’exprime pas le possessif, mais le français courant exige normalement celui-ci avec ces noms de relation dans ce contexte. Son ajout rend explicite une relation clairement implicite sans modifier le sens.
- source_word: ὑπὲρ ἐμέ
  choice: plus que moi
  rationale: Dans cette construction comparative, ὑπέρ marque une préférence ou un degré d’amour supérieur. « Plus que moi » est l’équivalent français le plus clair et le plus idiomatique.
- source_word: οὐκ ἔστιν μου ἄξιος
  choice: n’est pas digne de moi
  rationale: Cette formulation rend directement ἄξιος avec le génitif μου, tout en conservant la force et l’ouverture de l’expression grecque sans ajouter l’idée explicite d’appartenance ou d’aptitude.
- source_word: καὶ
  choice: et
  rationale: La coordination simple respecte le parallélisme des deux propositions.
- source_word: υἱὸν ἢ θυγατέρα
  choice: son fils ou sa fille
  rationale: Comme pour les parents, le possessif est implicite dans les noms relationnels grecs, mais nécessaire à une formulation française naturelle et non ambiguë.
theological_decisions:
- issue: La priorité exigée par Jésus par rapport aux liens familiaux
  choice: Présenter l’amour pour Jésus comme devant primer même sur l’amour des proches, sans nier la valeur de l’amour familial.
  alternative: Atténuer par « ne m’aime pas autant » ou renforcer en parlant de haine envers la famille.
  rationale: Le grec formule une comparaison de priorité au moyen de ὑπὲρ ἐμέ et prononce un jugement d’indignité. La traduction maintient cette exigence radicale sans l’affaiblir ni importer une formulation plus forte provenant d’un autre contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme de l’original est conservé. Les possessifs, absents formellement du grec mais requis par l’usage français avec les noms de parenté, ont été ajoutés. Le point-virgule maintient la structure équilibrée des deux affirmations.
