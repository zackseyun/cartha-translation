  text: μὴ κτήσησθε χρυσὸν μηδὲ ἄργυρον μηδὲ χαλκὸν εἰς τὰς ζώνας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/009.yaml
  text: Do not acquire gold or silver or copper for your belts[b][a],
translation:
  language: fr
  text: Ne vous procurez ni or, ni argent ni cuivre[a] dans vos ceintures[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bronze ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de l’argent que l’on portait dans une ceinture ou dans une bourse attachée à la taille.
    reason: cultural_note
lexical_decisions:
- source_word: μὴ κτήσησθε
  choice: Ne vous procurez
  rationale: Le verbe κτάομαι signifie ici « acquérir, se procurer ». Cette formulation conserve la portée de l’interdiction et évite de réduire le sens à « emporter » ou « porter ».
- source_word: χρυσὸν
  choice: or
  rationale: Terme matériel direct qui, dans cette énumération, désigne de l’argent sous forme d’or.
- source_word: ἄργυρον
  choice: argent
  rationale: Terme direct qui désigne ici à la fois le métal et la monnaie faite de ce métal.
- source_word: χαλκὸν
  choice: monnaie de cuivre
  rationale: χαλκός peut désigner le cuivre ou le bronze. Dans cette liste monétaire, « monnaie de cuivre » rend clairement le sens contextuel tout en conservant la matière mentionnée.
- source_word: εἰς τὰς ζώνας ὑμῶν
  choice: pour vos ceintures
  rationale: La préposition εἰς exprime ici la destination de la monnaie, placée dans les ceintures. La formulation reste proche du grec sans intégrer toute l’explication culturelle au texte principal.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Ne vous procurez » exprime naturellement l’idée d’acquisition; « monnaie de cuivre » évite que le lecteur comprenne qu’il s’agit simplement de métal brut. Les marqueurs suivent immédiatement les expressions qu’ils éclairent.
