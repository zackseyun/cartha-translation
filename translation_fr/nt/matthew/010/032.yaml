source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ὁμολογήσει ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, ὁμολογήσω κἀγὼ ἐν αὐτῷ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/032.yaml
  text: Therefore everyone who confesses me before men[b][a], I also will confess before my Father who is in heaven.
translation:
  language: fr
  text: Ainsi donc, quiconque se déclarera pour moi devant les êtres humains[a], moi aussi, je me déclarerai pour lui[b] devant mon Père qui est dans les cieux[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie un pluriel de ἄνθρωπος, terme qui désigne ici les humains en général. Traduction traditionnelle : « devant les hommes ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit plus littéralement « en lui » ou « à son sujet ». La traduction rend idiomatiquement l’idée d’une reconnaissance publique réciproque.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement, le grec dit « dans les cieux » ; selon l’usage français, on peut aussi traduire : « au ciel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Ainsi donc, quiconque
  rationale: « Quiconque » rend naturellement l’expression généralisante et inclusive Πᾶς… ὅστις. « Ainsi donc » conserve la valeur déductive de οὖν et le lien avec le contexte précédent.
- source_word: ὁμολογήσει ἐν ἐμοὶ
  choice: se déclarera pour moi
  rationale: Avec ὁμολογέω, la tournure ἐν ἐμοί exprime ici une reconnaissance ouverte et une prise de position en faveur de Jésus. « Se déclarer pour » est idiomatique en français et évite le calque obscur « confesser en moi ».
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: devant les êtres humains
  rationale: La préposition indique une déclaration faite en présence d’autrui. ἄνθρωποι désigne ici les humains en général, non les seuls hommes de sexe masculin.
- source_word: ὁμολογήσω κἀγὼ ἐν αὐτῷ
  choice: moi aussi, je me déclarerai pour cette personne
  rationale: La répétition de « se déclarer pour » préserve la réciprocité lexicale de la phrase grecque. « Cette personne » reprend quiconque sans employer un masculin susceptible d’être compris comme restrictif.
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: mon Père qui est dans les cieux
  rationale: Cette formulation conserve le pluriel οὐρανοῖς et la tournure matthéenne tout en restant claire et naturelle en français.
theological_decisions:
- issue: Reconnaissance publique de Jésus et reconnaissance réciproque par Jésus
  choice: Présenter directement la promesse d’une prise de position réciproque devant le Père.
  alternative: Préciser qu’il s’agit exclusivement du jugement dernier ou définir les conditions doctrinales du salut.
  rationale: Le verset affirme la réciprocité de la reconnaissance, mais ne précise pas ici son cadre temporel ni un système doctrinal plus large. La traduction laisse cette tension intacte.
- issue: Sens relationnel de ἐν avec ὁμολογέω
  choice: se déclarer pour
  alternative: confesser en / reconnaître comme disciple
  rationale: « Se déclarer pour » rend l’orientation personnelle et publique sans imposer l’explicitation « comme disciple », absente du texte, ni conserver un calque français peu intelligible.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « se déclarer pour » rend de façon naturelle l’engagement public exprimé par ὁμολογέω avec ἐν, et sa répétition maintient le parallélisme du grec. « Les êtres humains » privilégie une référence générique explicite; « cette personne » évite un masculin potentiellement restrictif.
