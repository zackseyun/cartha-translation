  text: Σίμων ὁ ⸀Καναναῖος καὶ Ἰούδας ⸀ὁ Ἰσκαριώτης ὁ καὶ παραδοὺς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/004.yaml
  text: Simon the Cananaean[a], and Judas Iscariot[b], who also betrayed him.
translation:
  language: fr
  text: Simon le Cananite[a], et Judas l’Iscariote, celui qui l’a aussi livré[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Simon le Zélote ». Le grec porte « Cananite », probablement d’après une désignation araméenne ou hébraïque traditionnellement comprise au sens de « Zélote ».
    reason: lexical_alternative
  - marker: b
    text: Ou « celui qui l’a aussi trahi ». Dans ce contexte, le fait de livrer Jésus constitue une trahison.
    reason: alternative_reading
lexical_decisions:
- source_word: Καναναῖος
  choice: Cananéen
  rationale: Translittération traditionnelle de la forme grecque, qui reflète probablement une désignation d’origine araméenne ou hébraïque. Elle préserve le libellé de Matthieu sans intégrer directement l’interprétation « le Zélote ».
- source_word: Ἰσκαριώτης
  choice: l’Iscariote
  rationale: Forme française traditionnelle et naturelle de cette désignation personnelle, traitée comme un surnom plutôt que traduite.
- source_word: παραδοὺς
  choice: livré
  rationale: Le verbe signifie fondamentalement « remettre, livrer ». Cette traduction conserve sa portée lexicale et laisse le contexte exprimer la trahison de Judas.
- source_word: ὁ καὶ παραδοὺς αὐτόν
  choice: celui qui l’a aussi livré
  rationale: Le participe substantivé identifie Judas par son acte. « Celui qui » restitue clairement la construction attributive, et « aussi » représente καί.
theological_decisions:
- issue: Faut-il rendre παραδοὺς par « a livré » ou par « a trahi » ?
  choice: a livré
  alternative: a trahi
  rationale: « Livrer » correspond plus directement à la portée du verbe grec et préserve la tension entre l’acte de remettre Jésus à ses adversaires et sa nature de trahison. « Trahir » exprime justement le sens narratif, mais de façon plus interprétative; il est donc signalé en note.
translation_notes:
  register: Français moderne, digne et accessible. Les formes traditionnelles « Cananéen » et « l’Iscariote » sont conservées; la syntaxe reste proche du grec tout en étant naturelle en français.
