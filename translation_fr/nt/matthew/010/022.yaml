id: MAT.10.22
reference: Matthew 10:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου· ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/022.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: fr
  text: Et vous serez haïs de tous à cause de mon nom.[a] Mais celui qui tiendra bon[b] jusqu’à la fin sera sauvé.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en raison de mon nom »; le nom représente ici la personne de Jésus et l’attachement à lui.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « celui qui persévérera ».'
    reason: lexical_alternative
  - marker: c
    text: Selon la manière de comprendre le contexte, « sera sauvé » peut aussi avoir le sens de « sera délivré » ou « sera secouru ».
    reason: alternative_reading
  - marker: d
    text: 'On peut rendre plus explicitement l’insistance du grec : « celui qui tiendra bon jusqu’à la fin, celui-là sera sauvé ».'
    reason: source_emphasis
lexical_decisions:
- source_word: μισούμενοι
  choice: serez haïs
  rationale: La construction périphrastique au futur décrit l’état auquel les disciples seront exposés. « Serez haïs » est direct, naturel et fidèle.
- source_word: ὑπὸ πάντων
  choice: de tous
  rationale: Avec le passif, ὑπό introduit les agents et πάντων a une portée générale. « De tous » conserve cette force sans ajouter de référent absent du grec.
- source_word: διὰ τὸ ὄνομά μου
  choice: à cause de mon nom
  rationale: διά suivi de l’accusatif exprime ici la cause. « Mon nom » garde la formulation biblique et peut désigner la personne de Jésus, son autorité et l’attachement à lui.
- source_word: ὁ δὲ ὑπομείνας
  choice: Mais celui qui tiendra bon
  rationale: Le participe aoriste substantivé désigne celui qui demeure ferme sous l’épreuve. « Tiendra bon » est actuel et compréhensible, sans introduire un vocabulaire doctrinal spécialisé.
- source_word: εἰς τέλος
  choice: jusqu’à la fin
  rationale: L’expression indique que l’endurance se poursuit jusqu’au terme, sans préciser ici la nature exacte de ce terme.
- source_word: οὗτος
  choice: implicite dans « celui qui… sera »
  rationale: Le pronom grec reprend et souligne le sujet participial. En français courant, sa reprise explicite par « celui-là » alourdirait la phrase; son emphase est signalée en note.
- source_word: σωθήσεται
  choice: sera sauvé
  rationale: Le passif futur de σῴζω peut évoquer le salut, la délivrance ou le fait d’être arraché au danger. « Sera sauvé » préserve l’ampleur théologique et contextuelle du terme.
theological_decisions:
- issue: Rapport entre l’endurance jusqu’à la fin et le salut
  choice: Conserver « sera sauvé » sans définir davantage la nature du salut ni élaborer un modèle doctrinal de la persévérance.
  alternative: Comprendre exclusivement une délivrance physique, exclusivement le salut eschatologique final, ou formuler une doctrine précise de la persévérance.
  rationale: Le verset lie nettement la fermeté dans la persécution au salut, mais ne tranche pas à lui seul toutes les questions doctrinales ultérieures. La traduction doit laisser subsister cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. « Tiendra bon » rend concrètement la fermeté sous la persécution; « sera sauvé » maintient la portée ouverte du grec. Le pronom emphatique οὗτος est omis du corps de la phrase pour préserver un français naturel, mais son effet est conservé en note.
