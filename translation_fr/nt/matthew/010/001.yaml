id: MAT.10.1
reference: Matthew 10:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τοὺς δώδεκα μαθητὰς αὐτοῦ ἔδωκεν αὐτοῖς ἐξουσίαν πνευμάτων ἀκαθάρτων ὥστε ἐκβάλλειν αὐτὰ καὶ θεραπεύειν πᾶσαν νόσον καὶ πᾶσαν μαλακίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/001.yaml
  text: And calling his twelve disciples to himself[a], he gave them authority over unclean spirits[c][b], to cast them out and to heal every disease and every sickness.
translation:
  language: fr
  text: Puis il appela auprès de lui ses douze disciples et leur donna autorité sur les esprits impurs[a], pour les chasser et pour guérir toute maladie et toute infirmité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des esprits non purs ». Ici, « impurs » traduit le terme grec traditionnellement employé pour les esprits opposés à la sainteté.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie deux termes voisins, que l’on peut aussi traduire par « toute maladie et toute faiblesse » ou « toute affection et toute infirmité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: il appela auprès de lui
  rationale: Le participe aoriste moyen de προσκαλέομαι décrit l’appel adressé aux disciples afin qu’ils viennent auprès de Jésus. La coordination par « Puis » rend naturellement en français le participe circonstanciel sans imposer une nuance causale.
- source_word: τοὺς δώδεκα μαθητὰς αὐτοῦ
  choice: ses douze disciples
  rationale: « Disciples » est le terme français courant et précis dans le contexte évangélique, et « ses » rend naturellement αὐτοῦ.
- source_word: ἔδωκεν
  choice: donna
  rationale: Rend directement le verbe simple δίδωμι sans ajouter la nuance plus interprétative d’« accorder ».
- source_word: ἐξουσίαν
  choice: autorité
  rationale: ἐξουσία désigne ici l’autorité ou le droit d’agir conféré par Jésus, plutôt qu’une simple force impersonnelle.
- source_word: πνευμάτων ἀκαθάρτων
  choice: sur les esprits impurs
  rationale: Le génitif dépendant de ἐξουσία exprime naturellement en français le domaine sur lequel s’exerce l’autorité. « Impurs » conserve le vocabulaire rituel et moral de ἀκάθαρτος.
- source_word: ὥστε ἐκβάλλειν αὐτὰ
  choice: pour les chasser
  rationale: Avec l’infinitif, ὥστε peut exprimer la visée ou le résultat. « Pour » reste naturel tout en laissant ouverte cette proximité sémantique; « les » reprend les esprits.
- source_word: θεραπεύειν
  choice: pour guérir
  rationale: Dans ce contexte, θεραπεύω désigne l’action de rendre la santé.
- source_word: πᾶσαν νόσον καὶ πᾶσαν μαλακίαν
  choice: toute maladie et toute infirmité
  rationale: Cette formulation maintient les deux termes grecs proches sans les fondre. « Maladie » rend νόσος, tandis qu’« infirmité » conserve pour μαλακία l’idée de faiblesse ou d’affection.
theological_decisions:
- issue: Nature de ce que Jésus confère aux douze
  choice: une autorité sur les esprits impurs
  alternative: une puissance sur les esprits impurs
  rationale: Le mot ἐξουσία met principalement l’accent sur l’autorité ou le droit d’agir conféré par Jésus. « Autorité » préserve cette relation de délégation sans nier que son exercice implique une puissance effective.
- issue: Rapport exprimé par ὥστε avec les infinitifs
  choice: pour les chasser et pour guérir
  alternative: de sorte qu’ils puissent les chasser et guérir
  rationale: La construction peut se situer entre visée et résultat. Le français « pour » rend la fonction pratique de l’autorité sans développer explicitement une modalité absente du texte.
translation_notes:
  register: Français international moderne, courant et digne. La phrase suit le mouvement narratif du grec sans lourdeur participiale. « Appela auprès de lui » explicite la nuance du verbe moyen; « chasser » est naturel dans le contexte des esprits, et le doublet « maladie / infirmité » préserve la distinction lexicale grecque.
