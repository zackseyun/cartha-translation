id: MAT.10.35
reference: Matthew 10:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦλθον γὰρ διχάσαι ἄνθρωπον κατὰ τοῦ πατρὸς αὐτοῦ καὶ θυγατέρα κατὰ τῆς μητρὸς αὐτῆς καὶ νύμφην κατὰ τῆς πενθερᾶς αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/035.yaml
  text: For I came to set a man against his father[a], and a daughter against her mother, and a daughter-in-law against her mother-in-law[b],
translation:
  language: fr
  text: Car je suis venu dresser un homme contre son père[a], une fille contre sa mère, et une belle-fille contre sa belle-mère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « diviser »; l’infinitif grec peut se traduire plus littéralement ainsi, mais les expressions répétées avec « contre » rendent ici explicite l’opposition entre les personnes.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut désigner une « jeune mariée » dans certains contextes; ici, il signifie « belle-fille », puisqu’elle est mise en relation avec sa belle-mère.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: je suis venu
  rationale: L’aoriste renvoie ici à la venue et à la mission de Jésus. Le passé composé est la formulation la plus naturelle en français moderne.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication de l’affirmation précédente et conserve clairement le lien logique.
- source_word: διχάσαι
  choice: dresser … contre
  rationale: Le verbe signifie diviser ou causer une division. Avec les trois constructions répétées κατά + génitif, « dresser … contre » exprime naturellement l’opposition relationnelle explicite dans ce contexte.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Bien que ἄνθρωπος puisse être générique, il désigne ici le membre masculin d’une série familiale comprenant ensuite une fille et une belle-fille.
- source_word: κατὰ τοῦ πατρὸς αὐτοῦ
  choice: contre son père
  rationale: κατά avec le génitif marque ici l’opposition; cette expression française en préserve directement la force.
- source_word: θυγατέρα
  choice: une fille
  rationale: Équivalent direct, naturel et précis du nom grec.
- source_word: κατὰ τῆς μητρὸς αὐτῆς
  choice: contre sa mère
  rationale: La formulation maintient le parallélisme et le sens d’opposition de κατά.
- source_word: νύμφην
  choice: une belle-fille
  rationale: νύμφη peut signifier « jeune mariée », mais son association avec πενθερά impose ici le sens familial de « belle-fille ».
- source_word: κατὰ τῆς πενθερᾶς αὐτῆς
  choice: contre sa belle-mère
  rationale: Rend directement le rapport familial et conserve la structure répétée d’opposition.
theological_decisions:
- issue: Nature de la mission de Jésus formulée dans ce passage
  choice: Présenter sans l’atténuer la division familiale liée à la venue de Jésus, sans ajouter qu’il prend plaisir à cette hostilité ni expliquer ici ses causes.
  alternative: Traduire plus littéralement par « diviser » ou paraphraser en précisant que la fidélité à Jésus provoque la persécution.
  rationale: Le grec attribue explicitement à la venue de Jésus une division qui oppose des proches. « Dresser … contre » préserve la force dérangeante de la parole et sa dimension relationnelle, sans importer dans le verset une explication théologique plus large.
translation_notes:
  register: Français international moderne, digne et accessible. « Car » conserve le lien explicatif; « dresser … contre » est idiomatique tout en maintenant la dureté et le parallélisme de l’énoncé grec.
