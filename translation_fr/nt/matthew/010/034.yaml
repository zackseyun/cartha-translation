id: MAT.10.34
reference: Matthew 10:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ νομίσητε ὅτι ἦλθον βαλεῖν εἰρήνην ἐπὶ τὴν γῆν· οὐκ ἦλθον βαλεῖν εἰρήνην ἀλλὰ μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/034.yaml
  text: Do not think that I came to bring peace on the earth[a]; I did not come to bring peace[b], but a sword.
translation:
  language: fr
  text: Ne pensez pas que je sois venu apporter la paix sur la terre. Je ne suis pas venu apporter la paix, mais une épée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, l’image de l’épée évoque la division provoquée par la venue de Jésus ; elle ne recommande pas la violence.
    reason: clarification_metaphor
lexical_decisions:
- source_word: Μὴ νομίσητε
  choice: Ne pensez pas
  rationale: Cette formulation rend directement et naturellement la défense exprimée par μή avec le subjonctif aoriste, sans ajouter de nuance étrangère au texte.
- source_word: ἦλθον
  choice: je sois venu / je suis venu
  rationale: Le passé composé est la manière la plus naturelle en français actuel d’exprimer ici la venue de Jésus en rapport avec sa mission. Le subjonctif « sois venu » est exigé par la construction après « ne pensez pas que ».
- source_word: βαλεῖν
  choice: apporter
  rationale: Bien que βάλλω puisse signifier littéralement « jeter », « apporter » exprime clairement et idiomatiquement le résultat envisagé avec « paix » et « épée ».
- source_word: εἰρήνην
  choice: la paix
  rationale: « La paix » est l’équivalent français usuel et précis de εἰρήνη dans ce contexte.
- source_word: ἐπὶ τὴν γῆν
  choice: sur la terre
  rationale: Cette expression conserve la portée générale de γῆ et correspond de près à la formulation grecque.
- source_word: ἀλλὰ μάχαιραν
  choice: mais une épée
  rationale: La conjonction marque un contraste fort, et « une épée » préserve l’image concrète de μάχαιρα au lieu de la remplacer par son effet interprété.
theological_decisions:
- issue: Faut-il remplacer l’image de l’épée par une paraphrase comme « la division » ?
  choice: Conserver « une épée » dans le texte principal
  alternative: mais la division
  rationale: Le grec emploie explicitement μάχαιραν, « une épée ». Le contexte suivant met en lumière l’effet de division, mais la traduction doit préserver l’image et la tension du propos sans en faire une approbation de la violence.
translation_notes:
  register: Français international moderne, direct et digne. La répétition de « apporter la paix » est maintenue pour reproduire l’insistance du grec. Le passé composé convient naturellement au discours français contemporain.
