review_pass:
  verdict: revise
  source_fidelity: Le sens général et le parallélisme sont bien rendus. Toutefois, « purs » restreint ἀκέραιοι à une pureté morale et peut évoquer en français des connotations étrangères au contexte. « Innocents » rend plus directement l’idée d’absence de malice, de sincérité et d’intégrité. « Voici » est également l’équivalent discursif français le plus direct de ἰδού.
  naturalness: La phrase est fluide et de registre moderne. « Voici » convient encore naturellement dans cette fonction d’annonce solennelle; « avisés » est idiomatique et exprime bien le discernement pratique de φρόνιμοι.
  terminology: « Brebis », « loups », « serpents » et « colombes » sont exacts et conservent l’imagerie du texte. « Innocents » est préférable à « purs » pour ἀκέραιοι, sans introduire d’interprétation doctrinale.
  issues:
  - severity: medium
    issue: « purs » pour ἀκέραιοι
    rationale: Le terme grec désigne ce qui est sans mélange, non corrompu ou sans malice. En français moderne, « purs » peut trop facilement évoquer une pureté rituelle, sexuelle ou abstraitement morale; « innocents » maintient plus nettement le contraste voulu avec la prudence des serpents.
  - severity: low
    issue: « Voyez » pour ἰδού
    rationale: « Voyez » est possible, mais « Voici » reproduit plus précisément la valeur d’interjection démonstrative et introductive de ἰδού, sans imposer un impératif de perception.
  revised_text: Voici, je vous envoie comme des brebis au milieu des loups. Soyez donc avisés comme les serpents et innocents comme les colombes.
  revised_footnotes: []
  revision_rationale: 'Révision limitée à deux choix lexicaux : « Voici » restitue la fonction de ἰδού, et « innocents » rend l’amplitude pratique et morale de ἀκέραιοι plus naturellement que « purs ». Le reste de la formulation conserve fidèlement la syntaxe, les comparaisons et le registre du grec.'
