id: MAT.10.16
reference: Matthew 10:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδοὺ ἐγὼ ἀποστέλλω ὑμᾶς ὡς πρόβατα ἐν μέσῳ λύκων· γίνεσθε οὖν φρόνιμοι ὡς οἱ ὄφεις καὶ ἀκέραιοι ὡς αἱ περιστεραί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/016.yaml
  text: Look, I am sending you out as sheep in the midst of wolves; therefore be wise as the snakes and innocent as the doves.
translation:
  language: fr
  text: Voici, je vous envoie comme des brebis au milieu des loups. Soyez donc avisés comme les serpents et innocents comme les colombes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Voyez
  rationale: Interpellation naturelle et digne qui attire l’attention sur la déclaration qui suit, sans l’archaïsme de « Voici » dans certains usages contemporains.
- source_word: ἀποστέλλω
  choice: j’envoie
  rationale: Rend directement l’action d’envoyer en mission; le contexte fournit la dimension missionnaire sans qu’il soit nécessaire de l’ajouter.
- source_word: πρόβατα
  choice: brebis
  rationale: Terme traditionnel et courant pour l’image d’animaux vulnérables au milieu des loups.
- source_word: φρόνιμοι
  choice: avisés
  rationale: Exprime la prudence intelligente et le discernement pratique, plutôt qu’une simple connaissance théorique.
- source_word: ὄφεις
  choice: serpents
  rationale: Équivalent naturel dans une comparaison proverbiale; conserve l’imagerie biblique sans imposer une nuance péjorative supplémentaire.
- source_word: ἀκέραιοι
  choice: purs
  rationale: Évoque ce qui est sans mélange, sans duplicité ni malice; formulation concise adaptée au contraste avec « avisés ».
- source_word: περιστεραί
  choice: colombes
  rationale: Équivalent français conventionnel et immédiatement intelligible de l’image.
theological_decisions:
- issue: Rapport entre prudence et intégrité
  choice: Conserver la juxtaposition « avisés… et purs » sans expliquer leur articulation.
  alternative: Paraphraser par « prudents, mais sans aucune malice ».
  rationale: Le grec maintient les deux qualités en tension positive; une paraphrase explicative risquerait de réduire la portée de l’énoncé.
- issue: Portée de ἀκέραιοι
  choice: « purs »
  alternative: « innocents » ou « sans malice »
  rationale: « Purs » préserve l’idée fondamentale d’intégrité non mêlée sans trancher exclusivement entre innocence morale, simplicité et absence de duplicité.
translation_notes:
  register: Français moderne international, direct et digne. La structure imagée et le parallélisme du grec sont conservés. « Avisés » évite à la fois l’archaïsme et une connotation de ruse trompeuse; « purs » maintient l’amplitude sémantique de ἀκέραιοι.
