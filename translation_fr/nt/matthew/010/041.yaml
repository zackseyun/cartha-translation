id: MAT.10.41
reference: Matthew 10:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δεχόμενος προφήτην εἰς ὄνομα προφήτου μισθὸν προφήτου λήμψεται, καὶ ὁ δεχόμενος δίκαιον εἰς ὄνομα δικαίου μισθὸν δικαίου λήμψεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/041.yaml
  text: The one who receives a prophet in the name of a prophet will receive a prophet’s reward[b][a], and the one who receives a righteous man in the name of a righteous man will receive a righteous man’s reward.
translation:
  language: fr
  text: Celui qui accueille un prophète en qualité de prophète[a] recevra une récompense de prophète, et celui qui accueille un juste en qualité de juste[b] recevra une récompense de juste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « au nom d’un prophète »; on peut aussi comprendre : « parce qu’il est prophète » ou « comme prophète ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au nom d’un juste »; on peut aussi comprendre : « parce qu’il est juste » ou « comme juste ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δεχόμενος
  choice: celui qui accueille
  rationale: Le participe présent substantivé désigne de manière générale celui qui reçoit ou accueille quelqu’un. « Accueille » convient particulièrement au contexte d’hospitalité et de reconnaissance des envoyés.
- source_word: προφήτην
  choice: un prophète
  rationale: Rendu direct du complément d’objet, sans paraphraser la fonction reconnue.
- source_word: εἰς ὄνομα προφήτου
  choice: en qualité de prophète
  rationale: L’expression indique que l’accueil est accordé en considération de l’identité ou de la fonction de prophète. Cette formulation française est claire tout en conservant l’idée de statut reconnu; la tournure littérale est signalée en note.
- source_word: μισθὸν προφήτου
  choice: une récompense de prophète
  rationale: 'Le génitif reste volontairement ouvert: il peut s’agir de la récompense reçue par un prophète ou de celle qui correspond à l’accueil d’un prophète.'
- source_word: λήμψεται
  choice: recevra
  rationale: Le futur grec est naturellement rendu par le futur simple, dans un registre digne et courant.
- source_word: δίκαιον
  choice: un juste
  rationale: L’adjectif masculin substantivé se rend naturellement en français biblique moderne par « un juste », terme concis qui conserve le genre grammatical et le sens moral ou religieux de δίκαιος.
- source_word: εἰς ὄνομα δικαίου
  choice: en qualité de juste
  rationale: Le parallélisme avec la première proposition est conservé; la formule exprime l’accueil accordé en reconnaissance de l’identité de juste.
- source_word: μισθὸν δικαίου
  choice: une récompense de juste
  rationale: Cette formulation reproduit le parallélisme grec et préserve l’ambiguïté du génitif sans préciser indûment la nature exacte de la récompense.
theological_decisions:
- issue: Sens de εἰς ὄνομα suivi du génitif
  choice: « en qualité de », avec la forme littérale et d’autres nuances en note
  alternative: « au nom de », « parce qu’il est » ou « comme »
  rationale: Dans ce contexte, l’expression concerne l’accueil d’une personne en considération de ce qu’elle est. Le calque « au nom de » risquerait de suggérer en français que l’hôte agit au nom du prophète ou du juste; « en qualité de » communique mieux le rapport à l’identité reconnue, sans exclure les nuances indiquées en note.
- issue: Portée du génitif dans μισθὸν προφήτου / δικαίου
  choice: Conserver « récompense de prophète / de juste »
  alternative: « la même récompense qu’un prophète / qu’un juste » ou « la récompense destinée à un prophète / à un juste »
  rationale: Le texte ne précise pas explicitement la relation exacte entre la personne et la récompense. La traduction évite donc de trancher entre égalité de récompense, destination ou association.
- issue: Rendu du masculin substantivé δίκαιον
  choice: « un juste »
  alternative: « une personne juste » ou « un homme juste »
  rationale: « Un juste » est naturel en français, reproduit le substantif masculin du grec et n’ajoute pas le nom « homme », absent du texte.
translation_notes:
  register: Français international moderne, courant et digne. « Accueille » rend la dimension relationnelle de δέχομαι; « un juste » appartient au registre biblique tout en restant compréhensible. Le parallélisme serré des deux propositions est conservé.
