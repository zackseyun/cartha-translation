id: MAT.10.25
reference: Matthew 10:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀρκετὸν τῷ μαθητῇ ἵνα γένηται ὡς ὁ διδάσκαλος αὐτοῦ, καὶ ὁ δοῦλος ὡς ὁ κύριος αὐτοῦ. εἰ τὸν οἰκοδεσπότην Βεελζεβοὺλ ⸀ἐπεκάλεσαν, πόσῳ μᾶλλον τοὺς οἰκιακοὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/025.yaml
  text: It is enough for the disciple that he become like his teacher[a], and the slave like his master. If they called the master of the house Beelzebul, how much more those of his household.
translation:
  language: fr
  text: Il suffit que le disciple devienne comme son enseignant, et que l’esclave devienne comme son maître. Si l’on a appelé le maître de maison Béelzéboul[a], à combien plus forte raison les membres de sa maisonnée !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Béelzébub », forme variante courante dans la tradition française.
    reason: Signaler la forme traditionnelle familière tout en maintenant dans le texte la forme du grec source.
lexical_decisions:
- source_word: ἀρκετὸν
  choice: Il suffit
  rationale: Cette tournure idiomatique française exprime directement la suffisance indiquée par l’adjectif prédicatif.
- source_word: μαθητῇ
  choice: au disciple
  rationale: « Disciple » conserve l’idée d’apprentissage personnel et d’attachement à un maître, centrale dans le contexte évangélique.
- source_word: ἵνα γένηται
  choice: de devenir
  rationale: Après « il suffit », l’infinitif est la construction française naturelle tout en conservant l’idée de parvenir à être semblable.
- source_word: διδάσκαλος
  choice: enseignant
  rationale: Ce choix exprime clairement la fonction d’enseignement et distingue ce terme de κύριος dans le parallèle suivant.
- source_word: δοῦλος
  choice: esclave
  rationale: Le contraste de statut avec le maître met ici en avant une relation de possession et de subordination, que « serviteur » atténuerait.
- source_word: κύριος
  choice: maître
  rationale: Dans l’analogie sociale entre l’esclave et celui qui a autorité sur lui, « maître » convient mieux que le titre « Seigneur ».
- source_word: οἰκοδεσπότην
  choice: le maître de maison
  rationale: L’expression rend l’autorité exercée par le responsable de la maisonnée et prépare la reprise de l’image domestique.
- source_word: Βεελζεβοὺλ
  choice: Béelzéboul
  rationale: Cette translittération française suit la forme grecque Βεελζεβούλ plutôt que la forme traditionnelle variante « Béelzébub ».
- source_word: ἐπεκάλεσαν
  choice: l’on a appelé
  rationale: Le verbe signifie ici attribuer un nom. Le pronom indéfini « on » rend naturellement en français le sujet pluriel non précisé.
- source_word: πόσῳ μᾶλλον
  choice: à combien plus forte raison
  rationale: Cette expression française courante restitue la progression argumentative a fortiori du grec.
- source_word: οἰκιακοὺς
  choice: ceux de sa maison
  rationale: La formule désigne largement les membres de la maisonnée, sans les réduire aux seuls serviteurs ou esclaves.
theological_decisions:
- issue: Sens de κύριος dans une analogie domestique
  choice: maître
  alternative: Seigneur
  rationale: Le parallèle immédiat avec δοῦλος et le vocabulaire de la maison présente une relation sociale; employer « Seigneur » introduirait ici une valeur titulaire que la formulation ne met pas explicitement au premier plan.
- issue: Rendu de δοῦλος
  choice: esclave
  alternative: serviteur
  rationale: Dans cette opposition hiérarchique avec κύριος, « esclave » préserve plus exactement la condition de dépendance impliquée par le terme grec.
- issue: Forme du nom Βεελζεβούλ
  choice: Béelzéboul
  alternative: Béelzébub
  rationale: Le texte grec porte Βεελζεβούλ. La forme traditionnelle française est signalée en note sans remplacer la forme attestée dans la source.
translation_notes:
  register: Français international actuel, digne et accessible. La première proposition conserve le parallélisme tout en distinguant « enseignant » de « maître ». La seconde garde l’ellipse expressive de la conclusion grecque et son mouvement a fortiori.
