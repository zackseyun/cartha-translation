  source_fidelity: 'Le sens général est fidèlement rendu : la suffisance pour le disciple et l’esclave d’être comme leur supérieur respectif, puis l’argument a fortiori concernant les membres de la maisonnée, sont conservés. La forme grecque Βεελζεβούλ est correctement représentée par « Béelzéboul » et la variante traditionnelle est signalée. Une formulation plus explicite du second membre de la première phrase restitue toutefois plus clairement les deux propositions coordonnées du grec.'
