  rationale: La révision explicite les deux verbes coordonnés afin d’obtenir une phrase française plus fluide tout en conservant la relation de résultat exprimée par ἵνα γένηται. Elle remplace également « ceux de sa maison » par « les membres de sa maisonnée », qui correspond plus exactement à οἰκιακούς et maintient le lien lexical avec « maître de maison ». Aucun changement de sens théologique n’est introduit.
