  terminology: « Disciple », « enseignant », « esclave » et « maître » respectent les contrastes du texte sans confondre διδάσκαλος et κύριος. « Maisonnée » rend bien le champ domestique de οἰκοδεσπότης/οἰκιακοί. La note sur « Béelzébub » préserve adéquatement la forme traditionnelle sans substituer une leçon différente au texte source.
