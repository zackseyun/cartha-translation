  text: μὴ οὖν ⸀φοβεῖσθε· πολλῶν στρουθίων διαφέρετε ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/031.yaml
  text: Therefore[a], do not be afraid; you are worth more than many sparrows.
translation:
  language: fr
  text: 'N’ayez donc pas peur : vous valez plus que beaucoup de moineaux.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν φοβεῖσθε
  choice: N’ayez donc pas peur
  rationale: La négation μὴ avec l’impératif présent exprime l’interdiction, tandis que οὖν tire la conclusion de l’enseignement précédent sur les soins du Père. « N’ayez donc pas peur » est naturel et conserve ce lien logique.
- source_word: πολλῶν στρουθίων
  choice: beaucoup de moineaux
  rationale: Dans le contexte immédiat de Matthieu 10.29, στρουθία désigne des moineaux. Le génitif dépend de la comparaison exprimée par διαφέρετε.
- source_word: διαφέρετε
  choice: valez plus que
  rationale: Ici, διαφέρω signifie surpasser en valeur ou en importance, et non simplement être différent. « Valoir plus que » rend clairement et naturellement cette comparaison.
- source_word: ὑμεῖς
  choice: vous
  rationale: Le pronom explicite met les disciples en relief par contraste avec les moineaux. En français, « vous » placé devant le verbe porte suffisamment cette insistance sans ajout artificiel.
theological_decisions:
- issue: Valeur relative des disciples et des moineaux dans l’enseignement de Jésus
  choice: vous valez plus que beaucoup de moineaux
  alternative: vous avez plus de valeur que beaucoup de moineaux
  rationale: La formulation conserve la comparaison explicite et enseigne que les disciples ont une valeur supérieure, dans un contexte affirmant les soins de Dieu, sans nier pour autant son attention envers les animaux.
translation_notes:
  register: Français international moderne, simple et digne. « N’ayez pas peur » est plus idiomatique que « ne craignez pas » dans l’usage courant, tandis que les deux-points rendent le rapport entre l’exhortation et sa raison.
