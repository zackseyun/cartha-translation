id: MAT.10.2
reference: Matthew 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῶν δὲ δώδεκα ἀποστόλων τὰ ὀνόματά ἐστιν ταῦτα· πρῶτος Σίμων ὁ λεγόμενος Πέτρος καὶ Ἀνδρέας ὁ ἀδελφὸς ⸀αὐτοῦ, Ἰάκωβος ὁ τοῦ Ζεβεδαίου καὶ Ἰωάννης ὁ ἀδελφὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/002.yaml
  text: 'These are the names of the twelve apostles: first[a], Simon who is called Peter, and Andrew his brother; James the son of Zebedee, and John his brother,'
translation:
  language: fr
  text: 'Voici les noms des douze apôtres : en premier[a], Simon, appelé Pierre, et André, son frère ; Jacques, fils de Zébédée, et Jean, son frère.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le premier » ; le terme peut aussi suggérer une place éminente parmi les Douze, et non seulement la première place dans l’énumération.
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: non rendu explicitement
  rationale: La particule marque ici une transition légère. La structure française et le contexte suffisent à assurer l’enchaînement, sans ajouter un « alors » ou un « or » susceptible de surinterpréter la relation.
- source_word: δώδεκα ἀποστόλων
  choice: des douze apôtres
  rationale: « Apôtres » est le terme français consacré et exact dans ce contexte pour le groupe reconnu et envoyé par Jésus.
- source_word: τὰ ὀνόματά ἐστιν ταῦτα
  choice: Voici les noms
  rationale: Cette formulation restitue naturellement en français la construction démonstrative grecque, sans lourdeur.
- source_word: πρῶτος
  choice: d’abord
  rationale: Dans l’énumération, « d’abord » exprime naturellement la première place dans la liste tout en laissant ouverte une éventuelle nuance de prééminence, signalée en note.
- source_word: ὁ λεγόμενος
  choice: appelé
  rationale: La tournure participiale identifie Simon par le nom de Pierre ; la forme condensée est naturelle et fidèle en français moderne.
- source_word: Πέτρος
  choice: Pierre
  rationale: Le nom est rendu selon sa forme française biblique usuelle.
- source_word: ὁ ἀδελφὸς αὐτοῦ
  choice: son frère
  rationale: 'Le grec désigne dans chaque cas un frère au sens familial : André est le frère de Simon, et Jean celui de Jacques.'
- source_word: ὁ τοῦ Ζεβεδαίου
  choice: fils de Zébédée
  rationale: Cette construction génitive identifie idiomatiquement Jacques par sa filiation, implicite en grec et normalement exprimée ainsi en français.
theological_decisions:
- issue: Sens de πρῶτος appliqué à Simon/Pierre
  choice: « d’abord » dans le texte, indiquant directement le début de l’énumération
  alternative: « le premier », pouvant être compris comme une indication de prééminence parmi les Douze
  rationale: Le mot grec peut marquer l’ordre d’une liste et éventuellement suggérer une place éminente. Le texte principal n’impose aucune conclusion doctrinale sur une primauté d’autorité ; la note conserve donc l’autre nuance possible.
translation_notes:
  register: Français moderne, international et digne. « Voici » introduit naturellement la liste ; les noms suivent les formes françaises bibliques usuelles. La ponctuation distingue les deux paires de frères.
