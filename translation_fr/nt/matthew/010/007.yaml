id: MAT.10.7
reference: Matthew 10:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πορευόμενοι δὲ κηρύσσετε λέγοντες ὅτι Ἤγγικεν ἡ βασιλεία τῶν οὐρανῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/007.yaml
  text: And as you go[a], proclaim, saying[c][b], ‘The kingdom of heaven has drawn near.’
translation:
  language: fr
  text: 'En chemin, proclamez[c] : « Le royaume des cieux[b] s’est approché[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est tout proche » ou « s’est fait proche ». Le parfait grec souligne une proximité désormais acquise et qui demeure pertinente.
    reason: lexical_alternative
  - marker: b
    text: Matthieu emploie régulièrement « le royaume des cieux », là où les autres Évangiles disent souvent « le royaume de Dieu ».
    reason: cross_reference
  - marker: c
    text: 'Littéralement : « proclamez en disant ».'
    reason: source_structure
lexical_decisions:
- source_word: πορευόμενοι
  choice: En chemin
  rationale: Le participe présent accompagne l’impératif principal. « En chemin » exprime naturellement l’action concomitante sans en faire un commandement distinct.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: La particule marque ici une liaison légère avec les instructions précédentes. En français, l’enchaînement est naturel sans ajouter « et » ou « alors ».
- source_word: κηρύσσετε
  choice: proclamez
  rationale: L’impératif désigne une annonce publique faite avec autorité. « Proclamez » conserve cette force sans la connotation spécifiquement ecclésiastique que peut avoir « prêchez ».
- source_word: λέγοντες
  choice: rendu par les deux-points
  rationale: Le participe introduit les paroles proclamées. En français moderne, les deux-points rendent cette fonction sans la redondance de « proclamez en disant ».
- source_word: ὅτι
  choice: introduction directe de la citation
  rationale: Après le verbe de proclamation, ὅτι introduit ici le contenu du message. Une citation directe sans « que » est idiomatique et fidèle au sens.
- source_word: Ἤγγικεν
  choice: s’est approché
  rationale: Le parfait exprime une proximité désormais acquise et toujours pertinente. « S’est approché » préserve mieux cette valeur résultative que le simple « est proche ».
- source_word: ἡ βασιλεία
  choice: le royaume
  rationale: « Royaume » peut évoquer à la fois l’exercice de la royauté et le domaine royal, maintenant ainsi l’ampleur sémantique du grec.
- source_word: τῶν οὐρανῶν
  choice: des cieux
  rationale: « Le royaume des cieux » est l’expression française consacrée et reflète directement le pluriel grec propre à la formulation matthéenne.
theological_decisions:
- issue: Sens de « royaume des cieux »
  choice: Conserver « le royaume des cieux »
  alternative: le règne des cieux ; le royaume de Dieu
  rationale: La formulation distinctive de Matthieu est préservée sans être harmonisée avec les autres Évangiles. « Royaume » maintient ouverte la référence au règne comme au domaine royal.
- issue: Valeur aspectuelle de Ἤγγικεν
  choice: s’est approché
  alternative: est proche ; est arrivé tout près
  rationale: Le parfait présente une proximité qui s’est produite et dont le résultat demeure. Cette traduction conserve cette tension sans préciser davantage la manière dont le royaume est déjà présent ou encore attendu.
translation_notes:
  register: Français moderne, clair et digne. La phrase évite une tournure participiale lourde, tout en signalant en note la structure grecque complète. Les guillemets français distinguent nettement le contenu de la proclamation.
