id: MAT.10.29
reference: Matthew 10:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχὶ δύο στρουθία ἀσσαρίου πωλεῖται; καὶ ἓν ἐξ αὐτῶν οὐ πεσεῖται ἐπὶ τὴν γῆν ἄνευ τοῦ πατρὸς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/029.yaml
  text: Are not two sparrows sold for an assarion? Yet not one of them will fall to the ground apart from your Father[a][b].
translation:
  language: fr
  text: Ne vend-on pas deux moineaux pour un assarion[b] ? Pourtant, pas un seul d’entre eux ne tombera à terre indépendamment de votre Père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans votre Père » ; l’expression peut évoquer sa connaissance, sa sollicitude ou sa volonté, mais le grec ne précise pas laquelle.
    reason: alternative_reading
  - marker: b
    text: L’assarion était une petite monnaie romaine en cuivre de très faible valeur.
    reason: cultural_note
lexical_decisions:
- source_word: στρουθία
  choice: moineaux
  rationale: Dans ce contexte, le terme désigne naturellement des moineaux, petits oiseaux communs et de très peu de valeur marchande.
- source_word: ἀσσαρίου
  choice: un assarion
  rationale: Le terme nomme une petite monnaie romaine précise. Le conserver maintient la couleur historique, tandis qu’une note en explique la faible valeur.
- source_word: πωλεῖται
  choice: vend-on
  rationale: La tournure interrogative française « Ne vend-on pas… ? » rend naturellement le présent passif grec et la force rhétorique de οὐχί, qui appelle une réponse affirmative.
- source_word: ἓν ἐξ αὐτῶν
  choice: pas un seul d’entre eux
  rationale: Cette formulation idiomatique rend l’expression partitive et, avec la négation, souligne qu’aucun de ces oiseaux ne fait exception.
- source_word: πεσεῖται ἐπὶ τὴν γῆν
  choice: ne tombera à terre
  rationale: « Tomber à terre » est l’équivalent français naturel de l’expression grecque, sans préciser si la chute désigne la mort ou un simple mouvement.
- source_word: ἄνευ τοῦ πατρὸς ὑμῶν
  choice: indépendamment de votre Père
  rationale: Cette formulation conserve l’idée qu’un tel événement ne se produit pas en dehors du rapport au Père, sans préciser si le texte vise sa connaissance, sa sollicitude, sa permission ou sa volonté.
- source_word: καὶ
  choice: Pourtant
  rationale: Dans le contexte, καί met en relief le contraste entre la très faible valeur des oiseaux et l’attention du Père à chacun d’eux ; « Pourtant » exprime clairement cette relation en français.
theological_decisions:
- issue: Sens de « indépendamment de votre Père » par rapport à la providence divine
  choice: Conserver une formulation large qui n’explicite pas le mode d’intervention du Père.
  alternative: « sans que votre Père le sache » ou « sans la volonté de votre Père »
  rationale: Le verset affirme le rapport providentiel du Père à l’événement, mais le grec ne précise pas s’il s’agit ici de sa connaissance, de sa sollicitude, de sa permission ou de sa volonté. La traduction évite donc de trancher cette ambiguïté théologique.
translation_notes:
  register: Français international moderne, courant et digne. La question rhétorique est rendue de façon idiomatique. « Assarion » préserve la précision historique, et « indépendamment de votre Père » maintient volontairement l’ambiguïté du grec.
