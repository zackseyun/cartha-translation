id: MAT.10.15
reference: Matthew 10:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ἀνεκτότερον ἔσται γῇ Σοδόμων καὶ Γομόρρων ἐν ἡμέρᾳ κρίσεως ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/015.yaml
  text: Truly I say to you[c][b][a], it will be more bearable for the land of Sodom and Gomorrah on the day of judgment than for that town.
translation:
  language: fr
  text: 'En vérité, je vous le dis : au jour du jugement, ce sera plus supportable[a] pour le pays[b] de Sodome et de Gomorrhe que pour cette ville[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plus tolérable ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « la terre de Sodome et de Gomorrhe ».
    reason: lexical_alternative
  - marker: c
    text: Ou « cette localité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: En vérité
  rationale: Dans la formule solennelle ἀμὴν λέγω ὑμῖν, « En vérité » transmet clairement la valeur d’affirmation forte de ἀμήν en français moderne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure française naturelle reste proche du grec et conserve le caractère direct et solennel de la déclaration.
- source_word: ἀνεκτότερον
  choice: plus supportable
  rationale: Le comparatif exprime ce qui sera plus facile à endurer. « Plus supportable » en garde la force sans préciser la nature ou le degré de la peine.
- source_word: γῇ
  choice: pour le pays
  rationale: γῆ désigne ici le territoire associé à Sodome et Gomorrhe, non la planète. « Le pays » conserve cette référence géographique concrète.
- source_word: Σοδόμων καὶ Γομόρρων
  choice: de Sodome et de Gomorrhe
  rationale: Il s’agit des formes françaises usuelles de ces noms de lieux; les génitifs grecs dépendent de γῇ.
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: au jour du jugement
  rationale: La formulation rend naturellement la référence à un jour futur de jugement tout en évitant d’ajouter un système doctrinal que le verset n’explicite pas.
- source_word: πόλει
  choice: ville
  rationale: πόλις peut désigner une ville ou une localité. « Ville » est le correspondant français direct et convient au contexte de la mission.
- source_word: ἐκείνῃ
  choice: cette
  rationale: Le démonstratif renvoie à la ville précise qui a refusé d’accueillir les messagers; « cette » rend ce renvoi sans emphase ajoutée.
theological_decisions:
- issue: Nature du « jour du jugement »
  choice: Une formulation qui évoque un futur jour de jugement sans en développer le cadre doctrinal
  alternative: Une période générale de jugement
  rationale: L’expression grecque évoque naturellement le jugement divin à venir, mais la traduction ne précise ni son déroulement ni sa chronologie au-delà de ce que dit le texte.
- issue: Comparaison entre Sodome et Gomorrhe et la ville qui refuse les messagers
  choice: Conserver la comparaison de ce qui sera « plus supportable » sans expliquer les degrés du jugement
  alternative: Paraphraser par « sera traitée moins sévèrement »
  rationale: La paraphrase alternative rendrait explicite une différence de sévérité, mais le grec formule la comparaison du point de vue de ce qui est supportable. Le texte retenu préserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La structure impersonnelle « ce sera plus supportable pour… que pour… » suit de près la comparaison grecque tout en restant intelligible. La ponctuation met en valeur la formule solennelle d’introduction.
