reference: Matthew 10:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν μὴ δέξηται ὑμᾶς μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν, ἐξερχόμενοι ⸀ἔξω τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης ἐκτινάξατε τὸν κονιορτὸν τῶν ποδῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/014.yaml
  text: And whoever does not receive you or listen to your words[a], as you go out of that house or that town[c][b], shake off the dust from your feet.
translation:
  language: fr
  text: Et si quelqu’un ne vous accueille pas ou n’écoute pas vos paroles[a], en sortant de cette maison ou de cette ville[b], secouez la poussière de vos pieds[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et n’entend pas vos paroles ».
    reason: lexical_alternative
  - marker: b
    text: Ou « cette maison ou cette localité ».
    reason: lexical_alternative
  - marker: c
    text: Ce geste symbolique marquait la rupture avec ceux qui rejetaient le message et signalait un jugement contre eux.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν μὴ
  choice: si quelqu’un ne… pas
  rationale: La construction relative indéfinie avec ἄν a une portée générale et conditionnelle. « Si quelqu’un ne… pas » est naturel en français et prépare clairement l’impératif qui suit.
- source_word: δέξηται ὑμᾶς
  choice: ne vous accueille pas
  rationale: δέχομαι désigne ici l’accueil favorable des messagers, avec sa dimension concrète d’hospitalité. « Accueillir » exprime ce sens plus naturellement que le calque « recevoir ».
- source_word: μηδὲ ἀκούσῃ τοὺς λόγους ὑμῶν
  choice: et n’écoute pas vos paroles
  rationale: ἀκούω peut signifier entendre ou écouter. Dans ce contexte, « écouter » rend l’attention portée au message sans ajouter explicitement l’idée d’obéissance qu’impliquerait « tenir compte ».
- source_word: ἐξερχόμενοι ἔξω
  choice: en sortant de
  rationale: Le participe accompagné de ἔξω décrit la sortie du lieu comme circonstance associée à l’impératif. « En sortant de » conserve cette relation et l’image spatiale.
- source_word: τῆς οἰκίας ἢ τῆς πόλεως ἐκείνης
  choice: cette maison ou cette ville
  rationale: La répétition de l’article et le démonstratif désignent la maison ou la ville concernée. « Ville » est le correspondant courant de πόλις, qui peut aussi désigner une localité de taille modeste.
- source_word: ἐκτινάξατε
  choice: secouez
  rationale: L’impératif exprime l’action énergique d’enlever la poussière en la secouant. Le complément « de vos pieds » rend clairement l’idée de détachement.
- source_word: τὸν κονιορτὸν τῶν ποδῶν ὑμῶν
  choice: la poussière de vos pieds
  rationale: κονιορτός désigne précisément la poussière, et le génitif indique ici celle qui se trouve sur les pieds et doit en être retirée.
theological_decisions:
- issue: Portée symbolique du geste envers ceux qui rejettent les messagers et leur message
  choice: Conserver dans le texte le commandement concret « secouez la poussière de vos pieds »
  alternative: Expliciter dans le texte qu’il s’agit d’un témoignage contre eux ou d’un signe de jugement
  rationale: Le verset commande le geste sans en donner lui-même l’interprétation explicite. La traduction n’importe donc pas les formulations des passages parallèles; une note fournit seulement le contexte culturel général.
translation_notes:
  register: Français international moderne, clair et digne. La phrase garde la structure conditionnelle du grec tout en employant « accueillir » et « écouter », plus naturels dans ce contexte. Le geste symbolique reste concret dans le texte principal, sans ajout provenant des récits parallèles.
