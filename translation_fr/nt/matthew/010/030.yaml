  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμῶν δὲ καὶ αἱ τρίχες τῆς κεφαλῆς πᾶσαι ἠριθμημέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/030.yaml
  text: But even the hairs of your head are all numbered[a].
translation:
  language: fr
  text: Mais même les cheveux de votre tête sont tous comptés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont tous été comptés ». Le parfait passif grec peut souligner une action accomplie dont le résultat demeure.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμῶν
  choice: votre
  rationale: Le génitif de la deuxième personne du pluriel exprime ici la possession; « votre tête » est la tournure française naturelle et peut s’adresser à plusieurs personnes de façon distributive.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque un léger contraste dans la suite de l’enseignement; « Mais » rend clairement cette articulation.
- source_word: καὶ
  choice: même
  rationale: 'Dans cette construction, καὶ a une valeur emphatique: l’affirmation s’étend jusqu’aux cheveux, détail infime.'
- source_word: αἱ τρίχες τῆς κεφαλῆς
  choice: les cheveux de votre tête
  rationale: Cette formulation conserve l’image concrète et la relation génitive tout en restant naturelle en français.
- source_word: πᾶσαι
  choice: tous
  rationale: L’accord masculin suit « cheveux » en français et exprime sans atténuation la totalité indiquée par πᾶσαι.
- source_word: ἠριθμημέναι εἰσίν
  choice: sont comptés
  rationale: Le parfait passif périphrastique décrit un comptage accompli dont le résultat demeure; « sont comptés » en rend naturellement l’état présent.
theological_decisions:
- issue: Portée de la connaissance et de la sollicitude divines sous-entendues
  choice: Conserver l’affirmation concrète selon laquelle tous les cheveux sont comptés.
  alternative: Développer explicitement l’idée de connaissance, de sollicitude ou de maîtrise providentielle de Dieu.
  rationale: Le texte affirme directement que les cheveux sont comptés sans expliciter ici toutes les implications doctrinales; la traduction laisse le contexte les faire ressortir.
translation_notes:
  register: Français international moderne, simple et digne. « Cheveux » est idiomatique pour les poils de la tête; la syntaxe garde l’emphase de « même » et de « tous ».
