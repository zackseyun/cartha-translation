  text: πορεύεσθε δὲ μᾶλλον πρὸς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/006.yaml
  text: but go instead to the lost sheep of the house of Israel[a].
translation:
  language: fr
  text: mais allez plutôt vers les brebis perdues de la maison d’Israël.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύεσθε
  choice: allez
  rationale: Impératif présent à la deuxième personne du pluriel. « Allez » exprime naturellement l’ordre donné dans ce contexte d’envoi.
- source_word: δὲ μᾶλλον
  choice: mais… plutôt
  rationale: L’ensemble marque le contraste et réoriente les disciples par rapport aux destinations interdites au verset précédent.
- source_word: πρὸς
  choice: vers
  rationale: Avec un verbe de mouvement, πρός indique la direction. « Vers » garde cette nuance tout en restant naturel en français.
- source_word: τὰ πρόβατα
  choice: les brebis
  rationale: « Brebis » conserve l’image pastorale explicite et son arrière-plan biblique, sans la remplacer par une paraphrase.
- source_word: τὰ ἀπολωλότα
  choice: perdues
  rationale: Le participe parfait d’ἀπόλλυμι qualifie ici les brebis comme étant dans un état de perdition ou d’égarement. « Perdues » convient à la métaphore pastorale sans la surinterpréter.
- source_word: οἴκου Ἰσραήλ
  choice: de la maison d’Israël
  rationale: Cette formulation préserve l’expression collective et biblique « maison d’Israël », ainsi que la relation génitive du grec.
theological_decisions:
- issue: Description métaphorique d’Israël
  choice: Conserver « les brebis perdues de la maison d’Israël »
  alternative: Paraphraser par « les Israélites qui se sont égarés »
  rationale: Le grec présente explicitement une image pastorale riche d’échos scripturaires. La conserver maintient sa portée littéraire et théologique sans imposer une interprétation explicative.
- issue: Rapport du génitif « de la maison d’Israël »
  choice: Comprendre principalement les brebis comme appartenant à la maison d’Israël
  alternative: Comprendre qu’elles se sont perdues loin de la maison d’Israël
  rationale: La lecture partitive ou associative est la plus directe dans ce contexte, mais la construction grecque permet aussi une nuance de séparation; celle-ci est donc signalée en note plutôt qu’exclue.
translation_notes:
  register: Français moderne, international et digne. La tournure reste concise et conserve l’image biblique traditionnelle. La minuscule initiale reflète la continuité syntaxique avec le verset précédent.
