id: MAT.10.19
reference: Matthew 10:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀παραδῶσιν ὑμᾶς, μὴ μεριμνήσητε πῶς ἢ τί λαλήσητε· δοθήσεται γὰρ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τί ⸀λαλήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/019.yaml
  text: But when they hand you over[a], do not worry about how or what you should speak[b], for what you should speak will be given to you in that hour.
translation:
  language: fr
  text: 'Mais quand on vous livrera, ne vous inquiétez pas de savoir comment parler ni quoi dire : ce que vous aurez à dire vous sera donné à ce moment-là.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La tournure passive « vous sera donné » laisse ici celui qui donne implicite ; le verset suivant précise que c’est l’Esprit de votre Père qui parle en vous.
    reason: cross_reference
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mais quand
  rationale: ὅταν exprime ici une éventualité future attendue, tandis que δέ marque une transition légèrement contrastive avec l’avertissement précédent.
- source_word: παραδῶσιν ὑμᾶς
  choice: on vous livrera
  rationale: « Livrer » rend le transfert hostile aux autorités sans préciser indûment l’idée de trahison.
- source_word: μὴ μεριμνήσητε
  choice: ne vous inquiétez pas
  rationale: Cette expression française courante traduit l’interdiction de se laisser gagner par l’inquiétude devant le témoignage à rendre.
- source_word: πῶς ἢ τί λαλήσητε
  choice: comment parler ni quoi dire
  rationale: La tournure française naturelle après une négation conserve la distinction grecque entre la manière de parler et le contenu des paroles.
- source_word: δοθήσεται γὰρ ὑμῖν
  choice: ce que vous aurez à dire vous sera donné
  rationale: Le futur passif est maintenu, et l’agent reste implicite comme dans le grec.
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: à ce moment-là
  rationale: Cette formulation moderne exprime le temps précis où la parole nécessaire sera accordée, sans le caractère potentiellement artificiel de « en cette heure ».
- source_word: τί λαλήσητε
  choice: ce que vous aurez à dire
  rationale: « Avoir à dire » restitue naturellement en français la parole envisagée dans cette situation future.
theological_decisions:
- issue: Agent implicite du passif δοθήσεται
  choice: Conserver le passif « vous sera donné » sans nommer l’agent dans le texte principal.
  alternative: « Dieu vous donnera » ou « l’Esprit vous donnera »
  rationale: Le verset ne nomme pas explicitement celui qui donne. Le verset suivant précise l’action de l’Esprit; il convient donc de préserver ici la retenue du grec.
translation_notes:
  register: Français international moderne, naturel et digne. « On vous livrera » évite un sujet indéfini lourd; « à ce moment-là » communique clairement l’immédiateté sans archaïsme.
