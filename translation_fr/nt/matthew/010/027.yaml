id: MAT.10.27
reference: Matthew 10:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃ λέγω ὑμῖν ἐν τῇ σκοτίᾳ, εἴπατε ἐν τῷ φωτί· καὶ ὃ εἰς τὸ οὖς ἀκούετε, κηρύξατε ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/027.yaml
  text: What I tell you in the darkness[a], say in the light; and what you hear in the ear[b], proclaim on the housetops.
translation:
  language: fr
  text: Ce que je vous dis dans l’obscurité[a], dites-le dans la lumière ; et ce que vous entendez à l’oreille[b], proclamez-le sur les toits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en secret… ouvertement » ; le grec conserve les images « dans l’obscurité… dans la lumière ».
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de rendre public ce qui a été entendu en privé. Dans l’Antiquité, les maisons avaient généralement des toits plats, qui constituaient des endroits élevés et visibles d’où l’on pouvait faire une annonce publique.
    reason: cultural_note
lexical_decisions:
- source_word: ὃ λέγω ὑμῖν
  choice: Ce que je vous dis
  rationale: Rend naturellement en français le relatif neutre substantivé ὃ et la construction λέγω ὑμῖν, sans alourdir la phrase.
- source_word: ἐν τῇ σκοτίᾳ
  choice: dans l’obscurité
  rationale: Préserve l’image grecque et son opposition directe avec « dans la lumière », plutôt que de l’expliciter par « en secret ».
- source_word: εἴπατε
  choice: dites-le
  rationale: L’impératif « dites » rend simplement εἴπατε ; le pronom « le » reprend naturellement « ce que » en français.
- source_word: ἐν τῷ φωτί
  choice: dans la lumière
  rationale: Conserve l’antithèse imagée σκοτίᾳ / φωτί et suggère la publicité sans remplacer l’image par son interprétation.
- source_word: ὃ εἰς τὸ οὖς ἀκούετε
  choice: ce que vous entendez à l’oreille
  rationale: Reproduit l’expression singulière et imagée du grec, compréhensible comme une communication privée, sans ajouter explicitement l’idée de chuchotement.
- source_word: κηρύξατε
  choice: proclamez-le
  rationale: « Proclamer » exprime l’annonce publique et autorisée portée par κηρύσσω, sans la restreindre à la prédication formelle.
- source_word: ἐπὶ τῶν δωμάτων
  choice: sur les toits
  rationale: Rend directement l’emplacement élevé des toits plats antiques ; cette expression est naturelle et évite le caractère vieilli de « du haut des toits » tout en gardant l’image.
theological_decisions:
- issue: Faut-il conserver les images de l’obscurité, de la lumière, de l’oreille et des toits, ou les remplacer par une paraphrase sur le secret et la publicité ?
  choice: Conserver les images dans le texte principal.
  alternative: Traduire « en secret… ouvertement… ce qui vous est chuchoté… annoncez-le publiquement ».
  rationale: Les antithèses imagées structurent la parole de Jésus et portent elles-mêmes le passage du privé au public. Les expliciter dans le texte principal en réduirait la force rhétorique et résoudrait inutilement leur portée figurée.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en valeur le parallélisme. « L’obscurité » est retenu plutôt que « les ténèbres », plus chargé et plus solennel ; « sur les toits » garde concrètement le cadre culturel sans archaïsme.
