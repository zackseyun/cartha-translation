  source_fidelity: 'Le texte rend fidèlement les deux propositions relatives et les impératifs pluriels : « Ce que je vous dis… dites-le » / « ce que vous entendez… proclamez-le ». « Dans l’obscurité / dans la lumière » conserve l’antithèse imagée de ἐν τῇ σκοτίᾳ / ἐν τῷ φωτί sans la réduire à une paraphrase. « À l’oreille » est une formulation française idiomatique et suffisamment proche de εἰς τὸ οὖς, dont elle maintient l’évocation d’une communication privée. « Sur les toits » rend correctement ἐπὶ τῶν δωμάτων et son image concrète.'
