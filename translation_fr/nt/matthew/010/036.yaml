  text: καὶ ἐχθροὶ τοῦ ἀνθρώπου οἱ οἰκιακοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/036.yaml
  text: And a man's enemies will be those of his own household[a].
translation:
  language: fr
  text: Et l’homme aura pour ennemis les membres de sa maisonnée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une personne aura pour ennemis les membres de son foyer ». Le grec emploie ici le masculin singulier « homme » dans un sens représentatif.'
    reason: Alternative lexicale et précision sur le masculin représentatif.
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction simple qui rattache cette proposition à ce qui précède sans expliciter davantage la relation logique.
- source_word: ἐχθροὶ
  choice: ennemis
  rationale: Le substantif désigne ceux qui se montrent hostiles; « ennemis » est ici naturel et conserve la force du grec.
- source_word: τοῦ ἀνθρώπου
  choice: l’homme aura pour ennemis
  rationale: Cette tournure possessive française rend naturellement le génitif grec. « L’homme » conserve le masculin singulier employé de manière représentative.
- source_word: οἱ οἰκιακοὶ αὐτοῦ
  choice: les membres de sa propre maison
  rationale: Le terme désigne les personnes appartenant à la maisonnée, et non le bâtiment. « Sa propre maison » garde la valeur relationnelle et l’insistance de αὐτοῦ.
theological_decisions:
- issue: Masculin singulier représentatif dans ἀνθρώπου
  choice: l’homme
  alternative: une personne
  rationale: Le grec emploie le masculin singulier dans une maxime de portée générale. Le texte principal en préserve la forme, tandis que la note signale une formulation française explicitant cette portée représentative.
translation_notes:
  register: Français moderne, digne et accessible. « Maisonnée » a été évité dans le texte principal parce qu’il est moins courant; la formulation « les membres de sa propre maison » précise qu’il s’agit des personnes du foyer.
