id: MAT.10.42
reference: Matthew 10:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν ποτίσῃ ἕνα τῶν μικρῶν τούτων ποτήριον ψυχροῦ μόνον εἰς ὄνομα μαθητοῦ, ἀμὴν λέγω ὑμῖν, οὐ μὴ ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/042.yaml
  text: And whoever gives one of these little ones even a cup of cold water in the name of a disciple[a], truly I say to you[b], he will certainly not lose his reward.
translation:
  language: fr
  text: Et quiconque donnera à boire à l’un de ces petits[a], ne serait-ce qu’un verre d’eau fraîche, parce qu’il est disciple[b], vraiment, je vous le dis, il ne perdra certainement pas sa récompense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « ces petits » désigne vraisemblablement des personnes humbles ou peu considérées parmi les disciples de Jésus, et pas nécessairement seulement des enfants.
    reason: clarification_contextuelle
  - marker: b
    text: 'Plus littéralement : « au nom d’un disciple ». La formule grecque indique que le geste est accompli en raison de l’identité du bénéficiaire comme disciple.'
    reason: alternative_de_traduction
lexical_decisions:
- source_word: ὃς ἂν
  choice: quiconque
  rationale: Le relatif accompagné de ἄν exprime une portée générale et indéfinie. « Quiconque » rend cette ouverture avec concision dans un français actuel et digne.
- source_word: ποτίσῃ
  choice: donnera à boire
  rationale: Le verbe signifie faire boire ou donner à boire. Cette formulation française conserve explicitement l’action envers le bénéficiaire.
- source_word: ἕνα τῶν μικρῶν τούτων
  choice: l’un de ces petits
  rationale: « Ces petits » préserve l’expression ouverte du grec, qui peut désigner des personnes humbles ou de peu de considération parmi les disciples, sans la limiter dans le texte principal aux enfants.
- source_word: ποτήριον ψυχροῦ
  choice: un verre d’eau fraîche
  rationale: Le nom « eau » est sous-entendu en grec. « Un verre d’eau fraîche » est l’expression idiomatique moderne qui transmet naturellement ce don élémentaire.
- source_word: μόνον
  choice: ne serait-ce qu’
  rationale: Cette tournure fait ressortir la modestie extrême du don, fonction de μόνον dans la phrase, sans produire le français raide de « seulement ».
- source_word: εἰς ὄνομα μαθητοῦ
  choice: parce que celui-ci est disciple
  rationale: La formule indique que le geste est accompli en considération de l’identité du bénéficiaire comme disciple. « Celui-ci » rattache clairement cette identité au petit qui reçoit à boire; la forme plus littérale est donnée en note.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: vraiment, je vous le dis
  rationale: La formule introduit une déclaration solennelle et assurée. « Vraiment » communique la fonction de ἀμήν dans un français compréhensible sans imposer le calque « amen ».
- source_word: οὐ μὴ ἀπολέσῃ
  choice: il ne perdra certainement pas
  rationale: La double négation οὐ μή est fortement emphatique. « Certainement pas » en conserve l’assurance catégorique.
- source_word: τὸν μισθὸν αὐτοῦ
  choice: sa récompense
  rationale: Dans ce contexte, μισθός désigne la rétribution ou récompense attachée à l’acte; « récompense » est naturel et ne précise pas indûment sa nature.
theological_decisions:
- issue: Référent de « ces petits »
  choice: Maintenir « ces petits » sans le limiter aux enfants.
  alternative: Comprendre exclusivement des enfants, ou seulement des croyants nouveaux ou faibles.
  rationale: Le contexte immédiat porte sur l’accueil des disciples et sur les gestes accomplis à cause de leur lien avec Jésus. La formulation conserve néanmoins l’image et son amplitude au lieu de trancher plus étroitement.
- issue: Sens de εἰς ὄνομα μαθητοῦ
  choice: 'Exprimer la motivation: le bénéficiaire est aidé parce qu’il est disciple.'
  alternative: Traduire formellement « au nom d’un disciple » ou « en qualité de disciple ».
  rationale: Dans ce contexte, la formule grecque présente l’identité de disciple comme le motif de l’acte. La traduction principale rend cette relation intelligible sans lui attribuer une portée rituelle ou sacramentelle; la note conserve la forme plus proche du grec.
translation_notes:
  register: Français international moderne, lisible et digne. « Donner à boire » conserve le geste concret; « ne serait-ce qu’un verre d’eau fraîche » souligne naturellement la petitesse du don. Le tour solennel « vraiment, je vous le dis » évite à la fois l’archaïsme et l’affaiblissement de la formule de Jésus.
