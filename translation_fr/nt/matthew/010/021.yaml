revisions:
- from: Le frère livrera son frère à la mort[a], et le père son enfant. Les enfants se dresseront contre leurs parents et les feront mettre à mort.
  to: Le frère livrera son frère à la mort[a], et le père son enfant. Les enfants se dresseront contre leurs parents et les mettront à mort.
  rationale: La révision remplace uniquement la causative « feront mettre à mort » par l’actif « mettront à mort », qui correspond à θανατώσουσιν sans imposer que les enfants agissent par l’intermédiaire d’autorités. La note est resserrée afin de donner de véritables équivalents lexicaux de παραδίδωμι, tout en conservant l’alternative contextuelle « trahir ».
