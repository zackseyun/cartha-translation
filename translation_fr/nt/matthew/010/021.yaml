id: MAT.10.21
reference: Matthew 10:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παραδώσει δὲ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/021.yaml
  text: And brother will hand over brother to death[a], and a father his child, and children will rise up against parents and put them to death.
translation:
  language: fr
  text: Le frère livrera son frère à la mort[a], et le père son enfant. Les enfants se dresseront contre leurs parents et les mettront à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remettra » ; le verbe peut aussi avoir le sens de « trahir » dans un contexte de déloyauté.
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: livrera
  rationale: Le futur de παραδίδωμι désigne ici le fait de remettre quelqu’un à des adversaires, avec la mort pour issue. « Livrer » conserve cette force concrète sans imposer le sens plus précis de « trahir ».
- source_word: ἀδελφὸς ... ἀδελφὸν
  choice: le frère ... son frère
  rationale: Le singulier grec présente un cas représentatif et emploie un terme masculin. Cette formulation française garde le lien familial explicite et évite l’ambiguïté peu naturelle de « un frère livrera un frère ».
- source_word: εἰς θάνατον
  choice: à la mort
  rationale: 'La préposition εἰς exprime ici l’aboutissement ou la destination du geste : la personne est livrée pour être mise à mort.'
- source_word: πατὴρ τέκνον
  choice: le père son enfant
  rationale: τέκνον signifie « enfant », sans préciser le sexe. L’ellipse du verbe reproduit naturellement la structure parallèle et solennelle du grec.
- source_word: ἐπαναστήσονται
  choice: se dresseront contre
  rationale: Le verbe exprime le fait de se soulever ou de se retourner avec hostilité contre quelqu’un. « Se dresser contre » conserve l’image du grec sans lui donner un sens politique trop étroit.
- source_word: τέκνα
  choice: les enfants
  rationale: Le pluriel τέκνα inclut aussi bien les garçons que les filles ; « enfants » en respecte l’étendue sémantique.
- source_word: ἐπὶ γονεῖς
  choice: contre leurs parents
  rationale: Avec ce verbe hostile, ἐπί suivi de l’accusatif signifie « contre ». Le possessif, implicite dans la relation familiale, rend le français naturel.
- source_word: θανατώσουσιν αὐτούς
  choice: les feront mettre à mort
  rationale: θανατόω signifie causer la mort, souvent par une démarche délibérée ou judiciaire. La tournure causative convient particulièrement puisque les enfants provoquent vraisemblablement l’exécution de leurs parents plutôt qu’ils ne les tuent nécessairement de leurs propres mains.
theological_decisions:
- issue: Termes familiaux genrés et représentatifs
  choice: Conserver « frère » pour ἀδελφός et employer « enfants » et « parents » pour les termes de portée plus large
  alternative: Employer un terme générique tel que « membre de la fratrie » pour ἀδελφός
  rationale: Le texte met en relief des liens familiaux précis. ἀδελφός est masculin dans cette formulation, tandis que τέκνα et γονεῖς ne sont pas limités à un sexe ; la traduction respecte ces différences sans généraliser ni restreindre le texte.
- issue: Mode de participation des enfants à la mort des parents
  choice: « les feront mettre à mort », qui laisse entendre qu’ils en provoquent l’exécution
  alternative: « les mettront à mort » ou « les tueront »
  rationale: Le verbe grec peut exprimer le fait de causer la mort sans préciser qui accomplit matériellement l’acte. La formulation retenue préserve cette latitude et s’accorde avec le contexte de dénonciation aux autorités, sans exclure toute participation directe.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme familial et la progression dramatique du grec sont conservés. La ponctuation en deux phrases allège la longue coordination sans modifier les rapports syntaxiques.
