review_pass:
  verdict: revise
  source_fidelity: La première proposition rend correctement παραδώσει ... εἰς θάνατον par « livrera ... à la mort », et les termes familiaux sont fidèles à leur portée respective. En revanche, « les feront mettre à mort » introduit une médiation causative absente de θανατώσουσιν. Le verbe actif affirme que les enfants mettront leurs parents à mort, sans préciser un mécanisme judiciaire ni une exécution par autrui.
  naturalness: Le français est globalement naturel, sobre et de registre biblique moderne. « Le frère livrera son frère » et l’ellipse « le père son enfant » sont recevables dans ce registre et préservent le parallélisme. « Les mettront à mort » est à la fois plus direct et plus idiomatique que la tournure causative.
  terminology: « Frère », « enfant » et « parents » respectent la précision sémantique du grec. « Se dresseront contre » traduit bien ἐπαναστήσονται. « Mettre à mort » convient à θανατόω sans réduire indûment le sens à une exécution judiciaire ni l’élargir à une simple dénonciation.
  issues:
  - severity: medium
    issue: La tournure « les feront mettre à mort » est causative et médiatise l’action des enfants.
    rationale: 'θανατώσουσιν est un futur actif de θανατόω : les enfants sont présentés comme les agents qui mettent les parents à mort. Le grec ne dit pas explicitement qu’ils feront exécuter leurs parents par une autre instance. « Les mettront à mort » conserve l’ambiguïté quant au moyen sans ajouter cette médiation.'
  revised_text: Le frère livrera son frère à la mort[a], et le père son enfant. Les enfants se dresseront contre leurs parents et les mettront à mort.
