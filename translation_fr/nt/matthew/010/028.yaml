id: MAT.10.28
reference: Matthew 10:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀φοβεῖσθε ἀπὸ τῶν ἀποκτεννόντων τὸ σῶμα τὴν δὲ ψυχὴν μὴ δυναμένων ἀποκτεῖναι· ⸁φοβεῖσθε δὲ μᾶλλον τὸν δυνάμενον ⸀καὶ ψυχὴν ⸁καὶ σῶμα ἀπολέσαι ἐν γεέννῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/028.yaml
  text: And do not fear those who kill the body but are not able to kill the soul. Rather[a], fear the one who is able to destroy both soul and body in Gehenna.
translation:
  language: fr
  text: Et ne craignez pas ceux qui tuent le corps, mais qui ne peuvent pas tuer l’âme. Craignez plutôt celui qui peut faire périr l’âme et le corps dans la géhenne.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en enfer ». Le grec emploie « géhenne », terme dérivé du nom de la vallée de Hinnom et utilisé pour désigner le lieu du jugement final.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβεῖσθε
  choice: ne craignez pas / craignez
  rationale: La répétition du même verbe dans l’antithèse est conservée. « Craindre » est direct, naturel et garde toute la force de l’avertissement.
- source_word: ἀπὸ τῶν ἀποκτεννόντων
  choice: ceux qui tuent
  rationale: Le participe présent substantivé désigne ici une catégorie générale; cette formulation est idiomatique en français.
- source_word: σῶμα
  choice: corps
  rationale: Équivalent français direct du terme désignant le corps physique.
- source_word: ψυχήν
  choice: âme
  rationale: Dans l’opposition explicite avec le corps, « âme » préserve la distinction exprimée par le grec; « vie » la rendrait moins nette.
- source_word: μὴ δυναμένων ἀποκτεῖναι
  choice: qui ne peuvent pas tuer
  rationale: Cette formulation rend clairement l’incapacité indiquée par la construction participiale grecque.
- source_word: μᾶλλον
  choice: plutôt
  rationale: 'Le mot marque ici la correction et le contraste: ne craignez pas les premiers, mais craignez plutôt l’autre.'
- source_word: τὸν δυνάμενον
  choice: celui qui peut
  rationale: La formulation demeure aussi ouverte que le grec sur l’identité du référent, tout en étant naturelle en français.
- source_word: ἀπολέσαι
  choice: faire périr
  rationale: « Faire périr » exprime une destruction décisive sans préciser au-delà du grec la nature métaphysique du jugement. Le contraste lexical avec « tuer » reste perceptible.
- source_word: ἐν γεέννῃ
  choice: dans la géhenne
  rationale: La translittération conserve le terme particulier du grec et son arrière-plan juif; une note fournit l’équivalent traditionnel plus familier.
theological_decisions:
- issue: Identité de « celui qui peut faire périr l’âme et le corps dans la géhenne »
  choice: La traduction dit « celui » sans identifier explicitement le référent.
  alternative: Dieu; Satan
  rationale: Le contexte conduit le plus naturellement à comprendre Dieu, qui détient l’autorité du jugement final, mais le texte grec ne nomme pas ici le référent. La traduction préserve donc cette retenue.
- issue: Traduction de γέεννα
  choice: géhenne
  alternative: enfer
  rationale: « Géhenne » maintient le terme grec et son arrière-plan lié à la vallée de Hinnom, tandis que l’équivalent interprétatif traditionnel est signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe antithétique et la répétition de « craindre » sont conservées; « celui » évite de rendre explicite une identification que le grec laisse implicite.
