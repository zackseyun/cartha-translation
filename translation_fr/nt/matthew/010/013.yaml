  source_fidelity: Le sens et la structure conditionnelle contrastive du grec sont bien rendus. « Que votre paix vienne sur elle » et « que votre paix revienne à vous » conservent fidèlement l’image et les impératifs à la troisième personne. Toutefois, « en est digne / n’en est pas digne » introduit en français un complément implicite (« digne de cela ») qui n’est pas exprimé dans le grec et rend la formulation légèrement moins directe.
  naturalness: Le registre est naturel, moderne et digne. La formulation « est digne / ne l’est pas » est plus fluide ici et évite le pronom partitif « en », dont le référent demeure implicite.
  terminology: « Maison », « digne » et « paix » sont des équivalents justes et cohérents. La note explique sobrement la portée contextuelle de « digne » sans transformer le texte en interprétation doctrinale, et elle signale adéquatement que « maison » peut inclure le foyer.
  issues:
