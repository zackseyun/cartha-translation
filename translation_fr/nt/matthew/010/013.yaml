    issue: « en est digne » / « n’en est pas digne »
    rationale: Le grec dit simplement que la maison est ou n’est pas « digne » (ἀξία), sans complément introduit par « de ». Employer « est digne / ne l’est pas » reproduit plus exactement cette absence de complément tout en restant idiomatique.
