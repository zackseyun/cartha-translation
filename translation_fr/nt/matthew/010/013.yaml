id: MAT.10.13
reference: Matthew 10:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐὰν μὲν ᾖ ἡ οἰκία ἀξία, ἐλθάτω ἡ εἰρήνη ὑμῶν ἐπ’ αὐτήν· ἐὰν δὲ μὴ ᾖ ἀξία, ἡ εἰρήνη ὑμῶν ⸀πρὸς ὑμᾶς ἐπιστραφήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/013.yaml
  text: And if the house is worthy[a], let your peace come upon it; but if it is not worthy[c][b], let your peace return to you.
translation:
  language: fr
  text: Et si la maison est digne[a], que votre paix vienne sur elle ; mais si elle ne l’est pas, que votre paix revienne à vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « digne » signifie apte à recevoir les messagers et leur paix, et non moralement irréprochable. Le mot « maison » peut aussi désigner le foyer, c’est-à-dire ceux qui y vivent.
    reason: Précision contextuelle et alternative lexicale nécessaires pour éviter un contresens moral et rendre l’étendue possible de οἰκία.
lexical_decisions:
- source_word: οἰκία
  choice: maison
  rationale: « Maison » est l’équivalent direct et naturel. Dans ce contexte, le mot peut aussi désigner, par extension, les personnes qui y vivent, possibilité signalée en note.
- source_word: ἀξία
  choice: en est digne
  rationale: Cette formulation conserve l’évaluation exprimée par ἀξία tout en renvoyant naturellement, en français, à l’accueil des messagers évoqué dans le contexte. Elle évite de réduire le sens à la seule réceptivité.
- source_word: ἐλθάτω
  choice: que … vienne
  rationale: Le subjonctif introduit par « que » rend naturellement en français l’impératif grec à la troisième personne.
- source_word: εἰρήνη
  choice: paix
  rationale: « Paix » est l’équivalent normal et préserve la portée plus large de bien-être et de bénédiction que le contexte peut lui donner.
- source_word: ἐπ’ αὐτήν
  choice: sur elle
  rationale: La formulation conserve l’image directionnelle de la paix venant sur la maison ; le pronom féminin reprend naturellement « maison ».
- source_word: πρὸς ὑμᾶς ἐπιστραφήτω
  choice: que … revienne à vous
  rationale: « Revenir à vous » exprime idiomatiquement le mouvement de retour indiqué par ἐπιστραφήτω et la direction marquée par πρός.
- source_word: μὲν … δὲ
  choice: si … ; mais si …
  rationale: Cette construction restitue clairement et naturellement l’opposition entre les deux éventualités.
theological_decisions:
- issue: Nature de « votre paix »
  choice: Maintien de « votre paix » comme bénédiction de paix des disciples, susceptible de venir sur la maison ou de revenir à eux.
  alternative: « votre salutation de paix » ou « la paix que vous prononcez »
  rationale: Le grec présente la paix de manière concrète sans préciser s’il s’agit seulement d’une salutation ou d’une réalité transmise. La traduction conserve cette image et cette tension sans imposer d’explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « digne » et l’image de la paix qui vient puis revient sont conservées afin de respecter la structure et la tension du grec.
