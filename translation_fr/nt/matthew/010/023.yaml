  naturalness: '« Fuyez dans une autre » est elliptique mais peu naturel en français international moderne : après « dans », l’omission de « ville » produit une formulation heurtée. « Fuyez dans une autre ville » est clair et idiomatique. La phrase révisée conserve un registre actuel et digne.'
