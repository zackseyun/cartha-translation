  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν δὲ διώκωσιν ὑμᾶς ἐν τῇ πόλει ταύτῃ, φεύγετε εἰς τὴν ⸀ἑτέραν· ἀμὴν γὰρ λέγω ὑμῖν, οὐ μὴ τελέσητε τὰς πόλεις ⸀τοῦ Ἰσραὴλ ἕως ⸀ἂν ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/023.yaml
  text: But whenever they persecute you in this city[a], flee to the next one. For truly I say to you[c][b], you will certainly not finish going through the cities of Israel until the Son of Man comes.
translation:
  language: fr
  text: Mais quand on vous persécutera dans cette ville, fuyez dans une autre ville[a]. En vérité, je vous le dis, vous n’aurez certainement pas fini de parcourir les villes d’Israël[b] jusqu’à ce que le Fils de l’homme vienne[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fuyez vers l’autre ville ». Le grec dit littéralement « vers l’autre/une autre », le mot « ville » étant sous-entendu d’après la proposition précédente.
    reason: lexical_alternative
  - marker: b
    text: Ou, plus littéralement, « vous n’aurez certainement pas achevé les villes d’Israël ». « Fini de parcourir » explicite l’activité missionnaire sous-entendue dans le contexte.
    reason: lexical_alternative
  - marker: c
    text: L’expression « jusqu’à ce que le Fils de l’homme vienne » reste volontairement ouverte. Elle a été comprise comme une allusion à la justification de Jésus, à une venue en jugement ou à son retour final.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: quand
  rationale: Introduit ici une éventualité temporelle ouverte. En français moderne, « quand » avec le futur exprime naturellement cette situation potentielle sans l’alourdir par « chaque fois que ».
- source_word: διώκωσιν ὑμᾶς
  choice: on vous persécutera
  rationale: Le verbe désigne une persécution hostile dans ce discours missionnaire. Le pronom indéfini « on » rend naturellement le sujet grec non exprimé à la troisième personne du pluriel.
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: dans cette ville
  rationale: Conserve la valeur proximale du démonstratif et le caractère direct de l’instruction.
- source_word: φεύγετε
  choice: fuyez
  rationale: L’impératif exprime un départ urgent devant la persécution; « fuyez » en garde la force et la concision.
- source_word: εἰς τὴν ἑτέραν
  choice: dans une autre
  rationale: Le nom « ville » est sous-entendu en grec d’après la proposition précédente. « Une autre » évite de donner à ἑτέραν un sens séquentiel plus précis que nécessaire.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: En vérité, je vous le dis
  rationale: Formule solennelle et autoritative, rendue dans un français actuel mais digne.
- source_word: οὐ μὴ τελέσητε
  choice: vous n’aurez certainement pas fini de parcourir
  rationale: « Certainement pas » rend la négation grecque emphatique οὐ μή. « De parcourir » explicite avec mesure l’activité sous-entendue par le complément « les villes » dans le contexte de la mission itinérante.
- source_word: τὰς πόλεις τοῦ Ἰσραήλ
  choice: les villes d’Israël
  rationale: Rend directement le groupe génitival grec sans préciser davantage si Israël désigne ici le territoire ou le peuple.
- source_word: ἕως ἂν ἔλθῃ
  choice: avant que … vienne
  rationale: Avec la proposition principale négative, cette tournure française exprime naturellement la limite future indiquée par ἕως ἄν avec le subjonctif.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Expression française consacrée qui conserve la forme littérale du titre ainsi que ses résonances bibliques et théologiques.
theological_decisions:
- issue: Sens de la venue du Fils de l’homme dans ce contexte
  choice: Conserver « avant que le Fils de l’homme vienne » sans identifier l’événement.
  alternative: Préciser qu’il s’agit de la résurrection et de la justification de Jésus, d’une venue en jugement — notamment sur Jérusalem — ou de son retour final.
  rationale: Le grec ne tranche pas entre ces interprétations. La traduction maintient donc l’ouverture et la tension eschatologique du texte au lieu d’y intégrer un schéma doctrinal particulier.
translation_notes:
  register: Français international moderne, clair et digne. Le futur dans « quand on vous persécutera » convient à l’instruction prospective; « on » évite une formulation artificielle avec un sujet indéfini pluriel. La phrase conserve l’affirmation solennelle et la forte négation du grec, tout en laissant ouverte la référence de la venue du Fils de l’homme.
