id: MAT.10.10
reference: Matthew 10:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ πήραν εἰς ὁδὸν μηδὲ δύο χιτῶνας μηδὲ ὑποδήματα μηδὲ ⸀ῥάβδον· ἄξιος γὰρ ὁ ἐργάτης τῆς τροφῆς ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/010.yaml
  text: do not take a traveler's bag for the road[a], or two tunics, or sandals, or a staff; for the worker is worthy of his food.
translation:
  language: fr
  text: ne prenez pour la route ni sac de voyage, ni deux tuniques, ni sandales, ni bâton[a] ; car l’ouvrier mérite sa nourriture.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains comprennent qu’il s’agit de ne pas prendre de bâton supplémentaire, notamment à la lumière de Marc 6.8, qui permet d’emporter un bâton.
    reason: alternative_reading
lexical_decisions:
- source_word: πήραν
  choice: sac de voyage
  rationale: Le terme désigne un sac emporté en déplacement, notamment pour les provisions. « Sac de voyage » explicite naturellement ce contexte sans surinterpréter.
- source_word: εἰς ὁδὸν
  choice: pour la route
  rationale: Cette expression idiomatique indique ce que l’on emporte en chemin. « Pour la route » est concise et naturelle en français.
- source_word: δύο χιτῶνας
  choice: deux tuniques
  rationale: χιτών désigne le vêtement de base porté près du corps. « Tuniques » conserve la précision historique.
- source_word: ὑποδήματα
  choice: sandales
  rationale: Dans ce contexte du premier siècle, « sandales » rend précisément et clairement le type de chaussures désigné.
- source_word: ῥάβδον
  choice: bâton
  rationale: Le mot désigne ici le bâton du voyageur. La traduction reste littérale et ne cherche pas à harmoniser Matthieu avec Marc 6.8.
- source_word: ἄξιος
  choice: mérite
  rationale: Le verbe français « mérite » exprime clairement l’idée d’être digne de recevoir quelque chose, dans une formulation plus naturelle que « est digne de » avec « nourriture ».
- source_word: ὁ ἐργάτης
  choice: l’ouvrier
  rationale: ἐργάτης désigne celui qui travaille. « Ouvrier » est courant, concret et conserve l’image du travail sans introduire de vocabulaire ecclésiastique technique.
- source_word: τῆς τροφῆς αὐτοῦ
  choice: sa nourriture
  rationale: τροφή désigne directement la nourriture ou l’alimentation. Ce choix conserve le sens concret du grec plutôt que de l’élargir à « soutien » ou « entretien ».
theological_decisions:
- issue: Harmonisation éventuelle avec les récits parallèles concernant l’équipement autorisé en voyage
  choice: Maintenir dans le texte principal l’interdiction « ni bâton », conformément à Matthieu.
  alternative: Comprendre qu’il s’agit seulement d’un bâton supplémentaire, notamment à la lumière de Marc 6.8, ou harmoniser plus librement les deux récits.
  rationale: Le grec de Matthieu place explicitement ῥάβδον parmi les objets à ne pas prendre. La traduction préserve cette tension avec Marc 6.8 au lieu de la résoudre silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. La série coordonnée par « ni » restitue la structure prohibitive du grec. « Mérite sa nourriture » privilégie une expression française courante tout en gardant le sens concret du texte source.
