source:
  edition: SBLGNT
  text: Τούτους τοὺς δώδεκα ἀπέστειλεν ὁ Ἰησοῦς παραγγείλας αὐτοῖς λέγων· Εἰς ὁδὸν ἐθνῶν μὴ ἀπέλθητε καὶ εἰς πόλιν Σαμαριτῶν μὴ εἰσέλθητε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/005.yaml
  text: Jesus sent out these twelve, instructing them, saying, “Do not go on the road to the Gentiles, and do not enter a town of the Samaritans.”
translation:
  language: fr
  text: 'Jésus envoya ces douze en leur donnant ces instructions : « N’allez pas chez les non-Juifs[a] et n’entrez dans aucune ville samaritaine[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « ne vous engagez pas sur un chemin des nations ». L’expression grecque emploie l’image du chemin et désigne probablement le fait de se diriger vers un territoire non juif.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « dans une ville de Samaritains ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτους τοὺς δώδεκα
  choice: ces douze
  rationale: Le grec désigne simplement le groupe des douze qui vient d’être nommé. « Disciples » est implicite dans le contexte, mais n’est pas ajouté au texte.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Le verbe exprime l’envoi en mission. En français, « envoya » restitue naturellement cette idée sans introduire la notion plus formelle de mandat.
- source_word: παραγγείλας αὐτοῖς λέγων
  choice: en leur donnant ces instructions
  rationale: Cette formulation française naturelle réunit les deux participes grecs et conserve la force directive de παραγγέλλω sans l’alourdissement de « leur ordonnant en disant ».
- source_word: Εἰς ὁδὸν ἐθνῶν
  choice: le chemin des non-Juifs
  rationale: « Chemin » maintient l’image concrète de ὁδός, tandis que « non-Juifs » explicite le sens contextuel de ἔθνη. La relation exacte du génitif reste quelque peu ambiguë; une note signale la lecture directionnelle probable.
- source_word: μὴ ἀπέλθητε
  choice: Ne prenez pas
  rationale: Avec « chemin », « ne prenez pas » exprime idiomatiquement l’interdiction de partir ou de s’engager dans cette direction.
- source_word: εἰς πόλιν Σαμαριτῶν
  choice: dans aucune ville samaritaine
  rationale: Dans une interdiction française, « aucune ville » rend naturellement la portée indéfinie de πόλιν. « Samaritaine » est l’équivalent idiomatique du génitif pluriel grec.
- source_word: μὴ εἰσέλθητε
  choice: n’entrez
  rationale: Rend directement et sans atténuation l’interdiction d’entrer.
theological_decisions:
- issue: Portée de l’interdiction concernant les non-Juifs et les Samaritains
  choice: Présenter les paroles comme les instructions données aux douze lors de cet envoi précis, sans commentaire sur leur durée.
  alternative: Employer une formulation ou ajouter une explication suggérant soit une exclusion permanente, soit son caractère explicitement provisoire.
  rationale: Le verset formule une interdiction ferme dans cette mission, mais n’en précise pas ici la durée théologique. La traduction conserve cette tension sans la résoudre à partir d’autres passages.
translation_notes:
  register: Français international moderne, sobre et digne. La construction détachée possible du grec est rendue par l’ordre français naturel « Jésus envoya ces douze ». « Non-Juifs » est plus immédiatement compréhensible que « païens » et évite les connotations péjoratives possibles de ce dernier terme.
