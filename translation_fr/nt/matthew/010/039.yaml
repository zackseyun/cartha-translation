id: MAT.10.39
reference: Matthew 10:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ εὑρὼν τὴν ψυχὴν αὐτοῦ ἀπολέσει αὐτήν, καὶ ὁ ἀπολέσας τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/039.yaml
  text: The one who finds his life will lose it[a], and the one who loses his life for my sake will find it.
translation:
  language: fr
  text: Celui qui trouve sa vie la perdra[a], et celui qui perd sa vie à cause de moi la trouvera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme », dans les deux propositions. Le grec ψυχή peut désigner la « vie » ou l’« âme » ; ici, « vie » convient le mieux au contexte où le disciple perd ou retrouve sa vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εὑρὼν
  choice: Celui qui trouve
  rationale: L’article suivi du participe substantivé désigne une personne représentative. « Celui qui » conserve le singulier générique et la structure proverbiale dans un français naturel.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sa vie
  rationale: Dans ce contexte de disciple exposé à perdre ou à préserver son existence, ψυχή désigne principalement la vie, plutôt qu’une âme immatérielle distinguée du corps. Le possessif français évite de marquer inutilement le genre tout en gardant le singulier.
- source_word: ἀπολέσει
  choice: la perdra
  rationale: Ici, ἀπόλλυμι exprime la perte. « Perdra » maintient le contraste intentionnel avec « trouvera » et la forme paradoxale de la parole.
- source_word: ὁ ἀπολέσας
  choice: celui qui perd
  rationale: Malgré l’aspect aoriste du participe grec, le présent français convient à la portée générale de la maxime et s’articule naturellement avec le futur « la trouvera ».
- source_word: ἕνεκεν ἐμοῦ
  choice: à cause de moi
  rationale: ἕνεκεν avec le génitif indique ici la cause ou le motif. « À cause de moi » est direct, idiomatique et conserve l’idée que la perte survient en raison de l’attachement à Jésus.
- source_word: εὑρήσει
  choice: la trouvera
  rationale: « Trouvera » reproduit la correspondance verbale avec εὑρὼν au début du verset, sans expliciter le paradoxe par un terme plus interprétatif comme « gagnera ».
- source_word: αὐτοῦ / αὐτήν
  choice: sa / la
  rationale: Les pronoms renvoient à ψυχή, féminin en grec et en français. La formulation française conserve le référent singulier sans imposer un masculin générique là où la langue cible ne l’exige pas.
theological_decisions:
- issue: Sens de ψυχή dans le paradoxe du disciple
  choice: vie
  alternative: âme
  rationale: Le contexte porte sur le fait de préserver ou d’abandonner sa vie en raison de Jésus. « Vie » rend au mieux ce sens sans réduire ψυχή à une composante immatérielle de la personne. Une note conserve toutefois l’autre possibilité lexicale et la portée potentiellement plus large du terme.
- issue: Valeur de ἕνεκεν ἐμοῦ
  choice: à cause de moi
  alternative: pour moi / par amour pour moi
  rationale: « À cause de moi » préserve la relation causale ou motivante sans préciser davantage si le geste est un sacrifice volontaire, une conséquence de la persécution ou les deux. Les autres formulations pourraient orienter plus fortement l’interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « trouve / trouvera » et « vie / vie » est maintenue pour préserver la symétrie et le paradoxe du grec. « Celui qui » garde la construction représentative au singulier sans lourdeur archaïque.
