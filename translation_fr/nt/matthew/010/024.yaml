id: MAT.10.24
reference: Matthew 10:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/024.yaml
  text: A disciple is not above the teacher[b][a], nor a slave above his master.
translation:
  language: fr
  text: Le disciple n’est pas au-dessus de son maître, ni l’esclave au-dessus de son maître.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pour « esclave », on peut aussi traduire « serviteur »; le mot grec peut désigner l’un ou l’autre selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: μαθητής
  choice: disciple
  rationale: « Disciple » conserve la dimension relationnelle et l’apprentissage auprès d’un maître qui caractérisent le terme dans le contexte de l’Évangile.
- source_word: ὑπέρ + accusatif
  choice: au-dessus de
  rationale: Cette expression rend directement l’idée de supériorité de rang, sans préciser davantage que le grec.
- source_word: διδάσκαλος
  choice: maître
  rationale: Dans la relation maître-disciple, « maître » est naturel en français et exprime à la fois l’enseignement et l’autorité; la répétition avec le second « maître » reflète aussi le parallélisme serré du grec, malgré la différence des deux termes sources.
- source_word: δοῦλος
  choice: esclave
  rationale: Le contraste avec κύριος met ici au premier plan la dépendance et l’infériorité de statut; « esclave » en préserve plus exactement la force que « serviteur ».
- source_word: κύριος
  choice: maître
  rationale: Dans cette analogie sociale, κύριος désigne le maître humain de l’esclave, et non un titre divin.
- source_word: αὐτοῦ
  choice: son
  rationale: Le possessif renvoie au maître de l’esclave; en français, « son maître » restitue naturellement cette relation.
- source_word: οὐδέ
  choice: ni
  rationale: « Ni » relie naturellement la seconde comparaison négative à la première.
theological_decisions:
- issue: Traduction de δοῦλος dans une analogie sociale
  choice: esclave
  alternative: serviteur
  rationale: L’association avec κύριος évoque une relation de dépendance statutaire forte. « Esclave » conserve cette réalité sans l’atténuer; l’autre possibilité contextuelle est signalée en note.
- issue: Traduction de κύριος dans un contexte humain
  choice: maître
  alternative: Seigneur
  rationale: Le parallélisme esclave/maître indique ici un supérieur humain. La majuscule et le titre divin « Seigneur » orienteraient à tort l’interprétation.
- issue: Traduction de διδάσκαλος et κύριος par le même mot français
  choice: maître dans les deux propositions
  alternative: enseignant pour διδάσκαλος et maître pour κύριος
  rationale: Le français « maître » convient traditionnellement et naturellement à la relation du disciple avec celui qui l’enseigne, tout en convenant au propriétaire ou supérieur de l’esclave. La traduction ne nie pas la distinction lexicale grecque, expliquée dans les décisions lexicales.
translation_notes:
  register: Français moderne, sobre et proverbial. Le parallélisme grec est conservé. La répétition de « maître » est idiomatique, même si le grec emploie d’abord διδάσκαλος (« maître qui enseigne »), puis κύριος (« maître, supérieur »).
