id: MAT.10.11
reference: Matthew 10:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην εἰσέλθητε, ἐξετάσατε τίς ἐν αὐτῇ ἄξιός ἐστιν· κἀκεῖ μείνατε ἕως ἂν ἐξέλθητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/011.yaml
  text: Into whatever city or village you enter[a], find out who in it is worthy[b], and stay there until you leave.
translation:
  language: fr
  text: Quelle que soit la ville ou le village où vous entrerez, renseignez-vous[a] pour savoir qui y est digne[b], et restez là jusqu’à votre départ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : faites une enquête pour savoir.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « digne » désigne vraisemblablement une personne apte ou disposée à accueillir les messagers, et non quelqu’un qui aurait mérité la faveur de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν ἢ κώμην
  choice: Quelle que soit la ville ou le village où
  rationale: Cette formulation française naturelle rend la relative indéfinie avec ἄν, tout en conservant la distinction entre πόλις et κώμη. Le mouvement exprimé par εἰς est porté par « entrerez ».
- source_word: εἰσέλθητε
  choice: vous entrerez
  rationale: Le futur convient en français à cette instruction portant sur chaque localité que les disciples pourront rencontrer au cours de leur mission.
- source_word: ἐξετάσατε
  choice: renseignez-vous
  rationale: L’impératif demande une démarche intentionnelle pour obtenir des informations. « Renseignez-vous » est actuel et naturel, sans imposer le ton plus formel ou judiciaire d’« enquêtez ».
- source_word: τίς ἐν αὐτῇ ἄξιός ἐστιν
  choice: qui y est digne
  rationale: « Qui y est » rattache clairement la personne à la localité, tandis que « digne » conserve la portée évaluative de ἄξιος sans préciser dans le texte principal en quoi consiste cette dignité.
- source_word: κἀκεῖ μείνατε
  choice: et restez là
  rationale: « Et » rend καί dans κἀκεῖ, et « restez là » préserve la formulation spatiale du grec sans expliciter davantage le logement ou l’hôte.
- source_word: ἕως ἂν ἐξέλθητε
  choice: jusqu’à votre départ
  rationale: Cette tournure idiomatique exprime la limite temporelle future indiquée par ἕως ἄν avec le subjonctif, sans lourdeur.
theological_decisions:
- issue: Sens de ἄξιος dans les instructions missionnaires
  choice: Conserver « digne » dans le texte principal
  alternative: Traduire explicitement par « disposé à vous accueillir » ou « apte à vous recevoir »
  rationale: Le contexte peut désigner une personne susceptible ou apte à accueillir les messagers, mais le mot grec garde une nuance évaluative plus large. « Digne » préserve cette tension et la note empêche de l’assimiler automatiquement au mérite devant Dieu.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’indétermination de chaque localité et l’ambiguïté contextuelle de « digne », tout en évitant un vocabulaire confessionnel ou excessivement technique.
