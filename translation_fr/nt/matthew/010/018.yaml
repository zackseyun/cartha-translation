  source_fidelity: 'Le texte rend correctement la progression grecque : futur passif (« Vous serez ... conduits »), comparution devant des autorités (« devant des gouverneurs et des rois »), motif personnel (« à cause de moi ») et finalité testimoniale. « Aussi » rend δέ de façon acceptable sans lui attribuer un contraste trop fort. « Aux nations » est une traduction lexiquement défendable de τοῖς ἔθνεσιν et conserve une portée plus large que « aux non-Juifs ».'
  naturalness: Le français est moderne, fluide et d’un registre approprié. « Pour leur servir de témoignage, ainsi qu’aux nations » est compréhensible et naturel dans ce contexte, tout en évitant d’expliciter indûment la nature favorable ou défavorable du témoignage.
  terminology: « Gouverneurs », « rois », « témoignage » et « nations » sont cohérents avec le grec et avec un français biblique international moderne. La formulation principale demeure neutre quant à la valeur possible de μαρτύριον pour les autorités.
