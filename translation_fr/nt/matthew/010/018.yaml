id: MAT.10.18
reference: Matthew 10:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς ἀχθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς καὶ τοῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/018.yaml
  text: And you will be brought before governors and kings because of me[b][a], as a testimony to them and to the Gentiles.
translation:
  language: fr
  text: Vous serez aussi conduits devant des gouverneurs et des rois à cause de moi, pour leur servir de témoignage[a], ainsi qu’aux nations[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi comprendre : « comme témoignage contre eux ». Le datif grec ne précise pas à lui seul si le témoignage leur est simplement adressé ou s’il est à charge contre eux.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « aux non-Juifs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ ἡγεμόνας δὲ καὶ βασιλεῖς
  choice: aussi conduits devant des gouverneurs et des rois
  rationale: Avec ἐπί suivi de l’accusatif après ἄγω, l’expression évoque la comparution devant des autorités. « Gouverneurs » rend naturellement ἡγεμόνας, et « rois » correspond directement à βασιλεῖς. Le δέ est rendu par « aussi », qui assure ici la progression du discours sans contraste excessif.
- source_word: ἀχθήσεσθε
  choice: vous serez conduits
  rationale: Le futur passif de ἄγω signifie qu’ils seront menés devant les autorités. « Conduits » reste naturel en français et n’ajoute pas l’idée de violence qu’impliquerait « traînés ».
- source_word: ἕνεκεν ἐμοῦ
  choice: à cause de moi
  rationale: ἕνεκεν avec le génitif exprime la cause. Cette formulation moderne conserve la référence personnelle à Jésus.
- source_word: εἰς μαρτύριον
  choice: pour servir de témoignage
  rationale: 'La tournure exprime ici la finalité ou le résultat : leur comparution aura valeur de témoignage. « Servir de témoignage » est idiomatique et conserve la forme nominale du grec.'
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif renvoie le plus naturellement aux gouverneurs et aux rois. « Leur servir de témoignage » garde une orientation neutre sans décider si ce témoignage leur est favorable ou se retourne contre eux.
- source_word: τοῖς ἔθνεσιν
  choice: aux nations
  rationale: ἔθνη peut désigner les nations non juives, donc les non-Juifs. « Nations » maintient ici la portée lexicale du terme grec et son possible sens collectif, avec une note donnant l’autre formulation courante.
theological_decisions:
- issue: Valeur de μαρτύριον αὐτοῖς
  choice: 'formulation neutre : « leur servir de témoignage »'
  alternative: « servir de témoignage contre eux »
  rationale: 'Le datif αὐτοῖς ne marque pas explicitement l’opposition. La traduction neutre préserve la tension : le témoignage peut être entendu comme une annonce qui leur est adressée ou, selon leur réponse, comme un témoignage à charge.'
- issue: Portée de τοῖς ἔθνεσιν
  choice: « aux nations »
  alternative: « aux non-Juifs »
  rationale: Dans Matthieu, ἔθνη désigne souvent les peuples autres qu’Israël. « Nations » préserve néanmoins l’expression grecque plus large sans imposer dans le texte principal une explicitation interprétative.
translation_notes:
  register: Français international moderne, clair et digne. La construction « leur servir de témoignage » est naturelle tout en conservant l’ambiguïté du datif grec. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
