source:
  edition: SBLGNT
  text: Φίλιππος καὶ Βαρθολομαῖος, Θωμᾶς καὶ Μαθθαῖος ὁ τελώνης, Ἰάκωβος ὁ τοῦ Ἁλφαίου καὶ ⸀Θαδδαῖος,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/003.yaml
  text: Philip and Bartholomew[a], Thomas and Matthew the tax collector, James the son of Alphaeus and Thaddaeus,
translation:
  language: fr
  text: Philippe et Barthélemy ; Thomas et Matthieu, le collecteur d’impôts ; Jacques, fils d’Alphée, et Thaddée[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « Lebbée » (ou « Lebbée, appelé Thaddée »), tandis que les listes d’apôtres chez Luc donnent à la place « Judas, fils de Jacques ».
    reason: textual_variant
lexical_decisions:
- source_word: Φίλιππος
  choice: Philippe
  rationale: Forme française traditionnelle et actuelle du nom personnel grec.
- source_word: Βαρθολομαῖος
  choice: Barthélemy
  rationale: Forme française conventionnelle du nom personnel.
- source_word: Θωμᾶς
  choice: Thomas
  rationale: Forme française conventionnelle du nom personnel.
- source_word: Μαθθαῖος
  choice: Matthieu
  rationale: Forme française conventionnelle du nom personnel.
- source_word: ὁ τελώνης
  choice: le collecteur d’impôts
  rationale: Désigne une personne chargée de percevoir taxes ou droits; cette formulation moderne est claire et évite l’archaïsme « publicain ».
- source_word: Ἰάκωβος
  choice: Jacques
  rationale: Forme française conventionnelle de ce nom dans les listes apostoliques du Nouveau Testament, bien qu’il corresponde historiquement à Jacob.
- source_word: ὁ τοῦ Ἁλφαίου
  choice: fils d’Alphée
  rationale: Le génitif indique ici la filiation; l’explicitation est naturelle et claire en français.
- source_word: Ἁλφαίου
  choice: Alphée
  rationale: Forme française conventionnelle du nom personnel.
- source_word: Θαδδαῖος
  choice: Thaddée
  rationale: Transcrit directement la leçon Θαδδαῖος du texte grec fourni; les variantes sont signalées en note.
- source_word: καὶ
  choice: et
  rationale: Conserve la coordination simple et répétée de la liste grecque.
theological_decisions:
- issue: Identification du dernier apôtre nommé dans le verset
  choice: Thaddée
  alternative: Lebbée; Judas, fils de Jacques
  rationale: Le texte grec de référence porte Θαδδαῖος. Les autres désignations relèvent de variantes manuscrites ou des listes parallèles et ne sont donc pas intégrées par harmonisation au texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. Les noms suivent les formes bibliques françaises usuelles. La ponctuation met en évidence les groupes de deux présents dans la syntaxe grecque, tout en rattachant clairement les appositions à Matthieu et à Jacques.
