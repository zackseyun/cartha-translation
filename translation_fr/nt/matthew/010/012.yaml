id: MAT.10.12
reference: Matthew 10:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰσερχόμενοι δὲ εἰς τὴν οἰκίαν ἀσπάσασθε αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/012.yaml
  text: As you enter the house[a], greet it.
translation:
  language: fr
  text: En entrant dans la maison[a], saluez-la.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « saluez les gens de la maison ». Le grec dit littéralement « saluez-la », en parlant de la maison, probablement employée pour désigner ceux qui l’habitent.
    reason: alternative lexicale et clarification de la métonymie
lexical_decisions:
- source_word: εἰσερχόμενοι
  choice: En entrant
  rationale: Le participe présent au nominatif pluriel a une valeur circonstancielle et marque une action concomitante à l’impératif. « En entrant » restitue naturellement cette relation en français.
- source_word: δὲ
  choice: non rendu séparément
  rationale: δέ est ici un connecteur léger. En français, l’enchaînement est suffisamment exprimé par la construction participiale, sans qu’il soit nécessaire d’ajouter « et », « or » ou « mais ».
- source_word: οἰκίαν
  choice: la maison
  rationale: οἰκία peut désigner la maison comme bâtiment ou, par métonymie, les personnes qui l’habitent. Le contexte immédiat de l’entrée favorise le sens concret « maison », tout en laissant possible la référence aux habitants.
- source_word: ἀσπάσασθε
  choice: saluez
  rationale: Cet impératif aoriste moyen à la deuxième personne du pluriel donne une instruction directe. « Saluez » est l’équivalent courant, clair et digne en français moderne.
- source_word: αὐτήν
  choice: la
  rationale: Le pronom féminin singulier s’accorde avec οἰκίαν. Le français permet de conserver cette reprise grammaticale et la métonymie du grec par « saluez-la ».
theological_decisions:
- issue: Adresse métonymique à la maison ou mention explicite de ses habitants
  choice: Conserver « saluez-la » dans le texte principal
  alternative: « saluez les gens de la maison » ou « saluez ceux qui l’habitent »
  rationale: Le grec emploie explicitement un pronom féminin singulier renvoyant à « la maison ». La formulation française conserve cette tension entre le bâtiment grammaticalement visé et les habitants probablement concernés, sans intégrer l’explication au texte.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « En entrant » est naturelle, et « saluez-la » préserve volontairement la formulation métonymique du grec, expliquée en note.
