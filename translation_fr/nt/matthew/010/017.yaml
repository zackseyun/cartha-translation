id: MAT.10.17
reference: Matthew 10:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσέχετε δὲ ἀπὸ τῶν ἀνθρώπων· παραδώσουσιν γὰρ ὑμᾶς εἰς συνέδρια, καὶ ἐν ταῖς συναγωγαῖς αὐτῶν μαστιγώσουσιν ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/017.yaml
  text: But beware of people[a], for they will hand you over to councils, and in their synagogues they will flog you.
translation:
  language: fr
  text: Mais méfiez-vous des gens, car ils vous livreront aux tribunaux et vous fouetteront dans leurs synagogues.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: méfiez-vous
  rationale: L’impératif exprime une mise en garde contre un danger venant de personnes hostiles. « Méfiez-vous » est naturel en français moderne et convient à la construction avec ἀπό.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition légèrement contrastive vers l’avertissement.
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: des gens
  rationale: Avec προσέχετε, ἀπό désigne la source du danger. Le pluriel ἀνθρώπων est générique dans ce contexte et ne vise pas exclusivement des hommes de sexe masculin.
- source_word: παραδώσουσιν
  choice: livreront
  rationale: Le verbe désigne ici le fait de remettre quelqu’un à des autorités. « Livrer » conserve le sens judiciaire sans introduire nécessairement l’idée de trahison personnelle.
- source_word: συνέδρια
  choice: tribunaux
  rationale: Le pluriel renvoie à des conseils locaux exerçant une fonction judiciaire. « Tribunaux » rend clairement cette fonction sans identifier à tort chacun d’eux au Sanhédrin de Jérusalem.
- source_word: συναγωγαῖς
  choice: synagogues
  rationale: Le terme désigne les lieux ou cadres communautaires juifs appelés synagogues; le mot français est courant et précis.
- source_word: αὐτῶν
  choice: leurs
  rationale: 'Le pronom au génitif marque naturellement l’association ou l’appartenance: « leurs synagogues ».'
- source_word: μαστιγώσουσιν
  choice: fouetteront
  rationale: Le verbe désigne un châtiment corporel infligé à coups de fouet. « Fouetter » est clair, actuel et moins archaïque que « flageller ».
theological_decisions:
- issue: Portée générique de ἀνθρώπων
  choice: des gens
  alternative: des hommes
  rationale: Bien que le nom grec soit morphologiquement masculin pluriel, il désigne ici des êtres humains hostiles en général, sans restriction explicite au sexe masculin.
- issue: Nature des συνέδρια
  choice: tribunaux
  alternative: conseils
  rationale: Le contexte de remise aux autorités et de châtiment met en avant leur fonction judiciaire. « Tribunaux » évite aussi de faire du pluriel une référence exclusive au grand Sanhédrin.
translation_notes:
  register: Français international moderne, digne et direct. La phrase conserve le contraste initial, la progression judiciaire et le possessif « leurs » sans alourdir le texte.
