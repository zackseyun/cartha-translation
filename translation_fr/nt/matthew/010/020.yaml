id: MAT.10.20
reference: Matthew 10:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ὑμεῖς ἐστε οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τοῦ πατρὸς ὑμῶν τὸ λαλοῦν ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/020.yaml
  text: For it is not you who are speaking[b][a], but the Spirit of your Father speaking in you.
translation:
  language: fr
  text: Car ce n’est pas vous qui parlez, mais l’Esprit de votre Père qui parle en vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par votre intermédiaire ». Le grec dit littéralement « en vous », expression qui peut aussi évoquer une parole transmise par les disciples.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Car ce n’est pas
  rationale: « Car » conserve la valeur explicative de γάρ et relie naturellement cette affirmation à l’assurance donnée au verset précédent.
- source_word: ὑμεῖς ἐστε οἱ λαλοῦντες
  choice: vous qui parlez
  rationale: La tournure clivée « ce n’est pas vous qui… » restitue l’insistance portée par le pronom explicite et par la construction périphrastique grecque, tout en restant naturelle en français.
- source_word: ἀλλὰ
  choice: mais
  rationale: « Mais » exprime directement le contraste fort entre les disciples et l’Esprit comme véritable source de leur parole.
- source_word: τὸ πνεῦμα τοῦ πατρὸς ὑμῶν
  choice: l’Esprit de votre Père
  rationale: Cette formulation suit précisément le grec. La majuscule indique que le contexte désigne l’Esprit divin, sans ajouter « céleste », absent du verset.
- source_word: τὸ λαλοῦν
  choice: qui parle
  rationale: La proposition relative reprend clairement « l’Esprit » et conserve l’aspect actuel du participe présent grec dans un français fluide.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: « En vous » correspond au sens le plus direct de ἐν et préserve l’ouverture du texte entre présence intérieure et parole s’exprimant par l’intermédiaire des disciples.
theological_decisions:
- issue: Faut-il rendre ἐν ὑμῖν par une présence intérieure (« en vous ») ou par une fonction instrumentale (« par votre intermédiaire ») ?
  choice: en vous
  alternative: par votre intermédiaire
  rationale: Le grec emploie ἐν, dont le sens direct est « en ». Le contexte peut suggérer que l’Esprit parle par l’intermédiaire des disciples, mais choisir cette seule interprétation dans le texte principal supprimerait une ambiguïté réelle.
translation_notes:
  register: Français moderne, international et digne. La répétition « parlez / parle » est conservée, car elle reflète le contraste rhétorique du grec et reste naturelle. Le marqueur de note [a] est placé immédiatement après l’expression concernée.
