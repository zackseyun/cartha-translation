id: MAT.10.8
reference: Matthew 10:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀσθενοῦντας θεραπεύετε, ⸂νεκροὺς ἐγείρετε⸃, λεπροὺς καθαρίζετε, δαιμόνια ἐκβάλλετε· δωρεὰν ἐλάβετε, δωρεὰν δότε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/008.yaml
  text: Heal the sick[a], raise the dead, cleanse lepers, cast out demons. Freely you received; freely give.
translation:
  language: fr
  text: Guérissez les malades, ressuscitez les morts[a], purifiez les personnes atteintes de lèpre[b], chassez les démons. Vous avez reçu gratuitement ; donnez gratuitement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits ne comportent pas « ressuscitez les morts ».
    reason: textual_variant
  - marker: b
    text: Le terme traditionnellement traduit par « lèpre » peut désigner, dans la Bible, diverses affections cutanées graves, et non seulement la lèpre au sens médical moderne.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενοῦντας θεραπεύετε
  choice: Guérissez les malades
  rationale: Le participe désigne ici les personnes malades, et θεραπεύω signifie les guérir dans ce contexte de ministère miraculeux. La formulation est directe et naturelle en français.
- source_word: νεκροὺς ἐγείρετε
  choice: ressuscitez les morts
  rationale: Dans ce contexte, ἐγείρω désigne le fait de relever d’entre les morts. « Ressuscitez » exprime clairement ce sens en français.
- source_word: λεπροὺς
  choice: les personnes atteintes de lèpre
  rationale: Cette formulation actuelle évite de réduire les personnes à leur maladie, tout en conservant le terme biblique traditionnel. Une note précise que le mot grec peut couvrir diverses affections cutanées graves.
- source_word: καθαρίζετε
  choice: purifiez
  rationale: « Purifiez » préserve à la fois les dimensions corporelle et rituelle de καθαρίζω, que « guérissez » seul risquerait d’effacer.
- source_word: δαιμόνια ἐκβάλλετε
  choice: chassez les démons
  rationale: « Chasser » rend naturellement l’idée d’expulsion exprimée par ἐκβάλλω dans un contexte d’exorcisme.
- source_word: δωρεὰν ἐλάβετε, δωρεὰν δότε
  choice: Vous avez reçu gratuitement ; donnez gratuitement
  rationale: 'La répétition de « gratuitement » reproduit le parallélisme et l’insistance du grec : ce qui a été reçu sans paiement doit être donné de même.'
theological_decisions:
- issue: Portée des commandements miraculeux
  choice: Conserver les impératifs directs adressés aux Douze dans le discours d’envoi
  alternative: Interpréter certaines actions comme des métaphores ou uniquement comme des pratiques ecclésiales ultérieures
  rationale: Le grec présente une série d’impératifs pluriels concrets. La traduction n’en atténue pas la force et ne tranche pas la question de leur application au-delà de la mission immédiate.
- issue: Dimension de la purification des personnes atteintes de lèpre
  choice: Traduire καθαρίζετε par « purifiez »
  alternative: Traduire simplement par « guérissez »
  rationale: Le choix retenu maintient la tension entre guérison corporelle et restauration de la pureté rituelle, sans réduire le verbe à une seule dimension.
translation_notes:
  register: Français international moderne, direct et digne. La série d’impératifs reste concise et énergique. « Personnes atteintes de lèpre » privilégie une désignation respectueuse, tandis que « purifiez » conserve les résonances rituelles du texte grec.
