  source_fidelity: 'Le texte rend fidèlement les impératifs grecs : θεραπεύετε (« guérissez »), [νεκροὺς ἐγείρετε] (« ressuscitez les morts »), καθαρίζετε (« purifiez ») et ἐκβάλλετε (« chassez »). La répétition et le parallélisme de δωρεὰν ... δωρεὰν sont bien conservés par « gratuitement ». La note a signale de façon appropriée que l’expression encadrée dans l’édition source est textuellement disputée, sans trancher au-delà des données manuscrites.'
