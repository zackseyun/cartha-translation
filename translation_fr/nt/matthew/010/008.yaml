  terminology: « Ressuscitez les morts » rend explicitement l’action de relever les morts à la vie. « Purifiez » préserve utilement la portée de καθαρίζω, qui ne se limite pas à la guérison physique. « Démons » et « chassez » sont les équivalents usuels et appropriés dans ce contexte. La note b évite d’assimiler sans nuance λεπροί à la seule maladie moderne appelée lèpre.
