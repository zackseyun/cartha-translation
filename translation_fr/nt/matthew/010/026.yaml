id: MAT.10.26
reference: Matthew 10:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ οὖν φοβηθῆτε αὐτούς· οὐδὲν γάρ ἐστιν κεκαλυμμένον ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/026.yaml
  text: Therefore, do not fear them, for nothing is covered that will not be revealed, and hidden that will not be made known.
translation:
  language: fr
  text: Ne les craignez donc pas, car il n’y a rien de voilé qui ne sera pas dévoilé, ni rien de caché qui ne sera pas connu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβηθῆτε αὐτούς
  choice: les craignez
  rationale: Le pronom « les » conserve le renvoi contextuel aux personnes évoquées, tandis que « craindre » rend directement le verbe grec.
- source_word: κεκαλυμμένον
  choice: voilé
  rationale: « Voilé » garde l’image de quelque chose recouvert tout en formant un contraste naturel avec « dévoilé ».
- source_word: ἀποκαλυφθήσεται
  choice: sera dévoilé
  rationale: Le futur passif grec est conservé sans préciser l’agent de la révélation.
- source_word: κρυπτὸν
  choice: caché
  rationale: Terme courant et précis, distinct de « voilé », qui préserve le parallélisme grec.
- source_word: γνωσθήσεται
  choice: sera connu
  rationale: Rend littéralement le futur passif et maintient l’absence d’agent explicite.
theological_decisions:
- issue: Agent des passifs futurs
  choice: Conserver les passifs « sera dévoilé » et « sera connu » sans nommer l’agent.
  alternative: Expliciter « Dieu dévoilera » ou « Dieu fera connaître ».
  rationale: Le grec laisse l’agent implicite; l’expliciter résoudrait une ambiguïté que le texte ne tranche pas formellement.
- issue: Portée de l’affirmation
  choice: Employer les formulations universelles « rien… qui ne… » dans les deux membres.
  alternative: Restreindre explicitement l’affirmation aux persécutions ou à l’enseignement des disciples.
  rationale: Le verset formule une maxime générale dans ce contexte, sans restriction explicite dans sa syntaxe.
translation_notes:
  register: Français international moderne, digne et accessible. Le balancement « voilé/dévoilé » restitue le jeu lexical du grec; « ni rien de caché » rend explicite en français l’ellipse du second membre sans en modifier le sens.
