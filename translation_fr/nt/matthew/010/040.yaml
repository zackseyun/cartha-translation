id: MAT.10.40
reference: Matthew 10:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δεχόμενος ὑμᾶς ἐμὲ δέχεται, καὶ ὁ ἐμὲ δεχόμενος δέχεται τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/040.yaml
  text: The one who receives you receives me[a], and the one who receives me receives the one who sent me.
translation:
  language: fr
  text: Celui qui vous accueille m’accueille[a], et celui qui m’accueille accueille celui qui m’a envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reçoit » ou « accepte »; le verbe grec peut désigner l’accueil accordé à une personne, notamment à un messager.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ δεχόμενος
  choice: Celui qui accueille
  rationale: Le participe présent substantivé a une portée générale. « Celui qui accueille » est naturel en français moderne et conserve le singulier générique.
- source_word: δέχομαι / δέχεται
  choice: accueille
  rationale: Dans le contexte de l’accueil réservé à des envoyés, « accueillir » exprime naturellement l’idée de recevoir et d’accepter une personne. La répétition du même verbe dans les trois propositions préserve la chaîne d’identification voulue par le grec.
- source_word: ὑμᾶς
  choice: vous
  rationale: Pronom objet de la deuxième personne du pluriel, désignant les disciples auxquels Jésus s’adresse.
- source_word: ἐμέ / με
  choice: m’ / m’
  rationale: Pronoms objets de la première personne du singulier, renvoyant à Jésus; l’élision est imposée par le français devant une voyelle.
- source_word: τὸν ἀποστείλαντά με
  choice: celui qui m’a envoyé
  rationale: Le participe aoriste substantivé est rendu par une proposition relative claire et naturelle, sans préciser explicitement l’identité de l’envoyeur au-delà du texte grec.
theological_decisions:
- issue: Identité de celui qui a envoyé Jésus
  choice: celui qui m’a envoyé
  alternative: le Père qui m’a envoyé
  rationale: Le contexte et la théologie de Matthieu indiquent le Père, mais le grec dit littéralement « celui qui m’a envoyé ». La traduction conserve cette formulation sans ajouter une identification explicite.
translation_notes:
  register: Français international moderne, simple et digne. « Accueille » est plus idiomatique que « reçoit » pour des personnes dans ce contexte, tout en maintenant exactement la répétition rhétorique du verbe grec.
