id: MAT.10.33
reference: Matthew 10:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅστις ⸂δ’ ἂν⸃ ἀρνήσηταί με ἔμπροσθεν τῶν ἀνθρώπων, ἀρνήσομαι ⸂κἀγὼ αὐτὸν⸃ ἔμπροσθεν τοῦ πατρός μου τοῦ ⸀ἐν οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/010/033.yaml
  text: But whoever denies me before men[b][a], I also will deny him before my Father who is in heaven.
translation:
  language: fr
  text: Mais quiconque me reniera devant les hommes[a], moi aussi, je le renierai devant mon Père qui est dans les cieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant les gens ». Le grec emploie un masculin pluriel avec une portée générique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις δ’ ἂν
  choice: Mais quiconque
  rationale: La proposition relative indéfinie exprime une condition générale, tandis que δέ marque le contraste avec le verset précédent. « Mais quiconque » conserve à la fois cette opposition et la portée générale.
- source_word: ἀρνήσηταί με
  choice: me reniera
  rationale: ἀρνέομαι signifie ici nier publiquement son lien avec Jésus ou le désavouer. Le futur français convient naturellement à la condition générale et permet de reprendre le même verbe dans la proposition principale.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: devant les hommes
  rationale: ἔμπροσθεν indique la présence publique ou le fait d’être face à quelqu’un. Le masculin pluriel grec a ici une portée générique ; « les hommes » en conserve la forme, avec une formulation inclusive signalée en note.
- source_word: ἀρνήσομαι κἀγὼ αὐτὸν
  choice: moi aussi, je le renierai
  rationale: 'κἀγώ souligne la correspondance réciproque : Jésus, lui aussi, reniera cette personne. La reprise de « renier » maintient le parallélisme solennel du grec.'
- source_word: τοῦ πατρός μου
  choice: mon Père
  rationale: Désignation filiale directe employée par Jésus, rendue sans explicitation supplémentaire.
- source_word: τοῦ ἐν οὐρανοῖς
  choice: qui est dans les cieux
  rationale: Le grec emploie le pluriel οὐρανοῖς. « Dans les cieux » est naturel en français biblique moderne et conserve ce pluriel.
theological_decisions:
- issue: Portée générique de ἀνθρώπων et reprise pronominale de αὐτόν
  choice: devant les hommes… je le renierai
  alternative: devant les gens… je renierai cette personne
  rationale: Les formes grecques sont masculines tout en ayant une portée générale. Le texte retient leur forme grammaticale et représentative sans limiter l’énoncé aux seuls hommes ; la note donne une formulation française explicitement inclusive.
- issue: Réciprocité du reniement
  choice: me reniera… je le renierai
  alternative: me désavouera… je le désavouerai
  rationale: Employer le même verbe dans les deux membres préserve la symétrie rhétorique et théologique du texte sans préciser au-delà du grec la nature du reniement.
translation_notes:
  register: Français international actuel, digne et directement compréhensible. « Quiconque » garde la portée générale et la solennité de l’énoncé ; la dislocation « moi aussi, je » restitue naturellement l’emphase de κἀγώ. Le texte principal conserve le pluriel grec « les cieux » ; la note b précise néanmoins la forme littérale en correspondance avec la couche de consultation fournie.
