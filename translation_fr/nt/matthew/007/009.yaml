  text: ἢ τίς ⸀ἐστιν ἐξ ὑμῶν ἄνθρωπος, ὃν ⸀αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον— μὴ λίθον ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/009.yaml
  text: Or what man is there among you whose son asks him for bread[a], and he will give him a stone?
translation:
  language: fr
  text: Ou quel homme[a] parmi vous, à qui son fils demandera du pain, lui donnera-t-il une pierre ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire, dans une formulation plus inclusive : « quelle personne parmi vous » ; le grec dit « homme » dans un sens représentatif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduit une nouvelle comparaison rhétorique dans la continuité du verset précédent.
- source_word: τίς ἐστιν ἐξ ὑμῶν ἄνθρωπος
  choice: quel homme parmi vous
  rationale: Rend naturellement l’expression partitive grecque tout en conservant le singulier masculin représentatif.
- source_word: ὃν αἰτήσει ὁ υἱὸς αὐτοῦ ἄρτον
  choice: à qui son fils demandera du pain
  rationale: Conserve la relation relative, le sujet « son fils », l’objet « du pain » et la valeur future de αἰτήσει.
- source_word: μὴ λίθον ἐπιδώσει αὐτῷ
  choice: lui donnera une pierre ?
  rationale: La question rhétorique française exprime naturellement la réponse négative attendue signalée par μή; le futur de ἐπιδώσει est maintenu.
theological_decisions:
- issue: Masculin à valeur représentative
  choice: quel homme parmi vous
  alternative: quelle personne parmi vous
  rationale: Le grec emploie ἄνθρωπος au masculin singulier dans une construction représentative. « Homme » conserve cette forme sans exclure que l’enseignement s’applique à tous.
translation_notes:
  register: Français moderne, digne et accessible. La structure relative et les deux futurs du grec sont conservés, tandis que la ponctuation fait clairement entendre la question rhétorique qui appelle une réponse négative.
