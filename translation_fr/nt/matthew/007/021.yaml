id: MAT.7.21
reference: Matthew 7:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ πᾶς ὁ λέγων μοι· Κύριε κύριε εἰσελεύσεται εἰς τὴν βασιλείαν τῶν οὐρανῶν, ἀλλ’ ὁ ποιῶν τὸ θέλημα τοῦ πατρός μου τοῦ ἐν ⸀τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/021.yaml
  text: Not everyone who says to me[a], ‘Lord, Lord,’ will enter into the kingdom of heaven[b], but the one who does the will of my Father who is in heaven will enter.
translation:
  language: fr
  text: 'Ce ne sont pas tous ceux qui me disent : « Seigneur, Seigneur ! » qui entreront dans le royaume des cieux[a], mais celui qui fait la volonté de mon Père qui est dans les cieux[b] y entrera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le royaume des cieux ». Cette expression caractéristique de Matthieu correspond, dans d’autres contextes, au « royaume de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie également ici le pluriel : « les cieux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ πᾶς ὁ λέγων μοι
  choice: Ce ne sont pas tous ceux qui me disent
  rationale: La tournure française exprime clairement la négation partielle de Οὐ πᾶς (« pas tous »), sans la transformer en négation totale. Le présent « disent » convient à la portée générale du participe présent λέγων.
- source_word: Κύριε κύριε
  choice: Seigneur, Seigneur !
  rationale: « Seigneur » est l’équivalent français courant et théologiquement non réducteur de κύριος. La répétition vocative est conservée pour rendre l’insistance de l’appel.
- source_word: εἰσελεύσεται
  choice: entreront / y entrera
  rationale: Le futur de εἰσέρχομαι est rendu naturellement par « entrer ». Dans la seconde proposition, le verbe sous-entendu en grec est explicité par « y entrera » afin que le contraste soit complet et naturel en français.
- source_word: εἰς τὴν βασιλείαν τῶν οὐρανῶν
  choice: dans le royaume des cieux
  rationale: « Royaume des cieux » est une expression française naturelle qui conserve le pluriel caractéristique de Matthieu et rend βασιλεία par « royaume ».
- source_word: ἀλλ’ ὁ ποιῶν
  choice: mais celui qui fait
  rationale: Cette formulation rend le participe présent substantivé au singulier et maintient le contraste entre le fait de dire et celui de faire.
- source_word: τὸ θέλημα
  choice: la volonté
  rationale: « Volonté » conserve ici la portée éthique et théologique de θέλημα sans paraphrase interprétative.
- source_word: τοῦ πατρός μου
  choice: de mon Père
  rationale: La traduction directe préserve le langage filial propre à Jésus.
- source_word: τοῦ ἐν τοῖς οὐρανοῖς
  choice: qui est dans les cieux
  rationale: La proposition relative rend clairement la construction attributive grecque et conserve le pluriel τοῖς οὐρανοῖς, idiomatique en français biblique moderne.
theological_decisions:
- issue: Rapport entre la confession verbale de Jésus comme Seigneur, l’accomplissement de la volonté du Père et l’entrée dans le royaume
  choice: Conserver le contraste explicite entre ceux qui disent « Seigneur » et celui qui fait la volonté du Père, sans définir ici un système complet du salut.
  alternative: Lire le verset soit comme l’enseignement d’un salut mérité par les œuvres, soit comme compatible avec une confession verbale qui suffirait à elle seule.
  rationale: Le grec oppose nettement le dire au faire, mais ce seul verset ne formule pas une doctrine exhaustive de la justification ou du salut. La traduction maintient donc la force de l’avertissement et sa tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. La structure emphatique « Ce ne sont pas tous ceux… » rend sans ambiguïté la négation partielle grecque. « Royaume des cieux » et « dans les cieux » conservent le pluriel du texte source; les notes signalent ce trait, même si la première note est surtout explicative plutôt qu’une véritable variante de traduction française.
