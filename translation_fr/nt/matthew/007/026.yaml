id: MAT.7.26
reference: Matthew 7:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ἀκούων μου τοὺς λόγους τούτους καὶ μὴ ποιῶν αὐτοὺς ὁμοιωθήσεται ἀνδρὶ μωρῷ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν ἄμμον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/026.yaml
  text: And everyone who hears these words of mine and does not do them will be like a foolish man[a], who built his house on the sand.
translation:
  language: fr
  text: Et toute personne qui entend mes paroles que voici sans les mettre en pratique sera semblable à un homme insensé[a], qui a construit sa maison sur le sable.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une personne insensée ». Le grec dit « un homme insensé » et emploie ici le masculin dans une comparaison à portée générale.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ ἀκούων
  choice: toute personne qui entend
  rationale: Le participe présent substantivé a une portée générale. Cette formulation est naturelle en français moderne et conserve l’idée de totalité.
- source_word: μου τοὺς λόγους τούτους
  choice: mes paroles que voici
  rationale: Cette formulation conserve à la fois le possessif et la valeur démonstrative de τούτους, en renvoyant aux paroles que Jésus vient de prononcer.
- source_word: καὶ μὴ ποιῶν αὐτούς
  choice: sans les mettre en pratique
  rationale: Dans ce contexte, ποιέω désigne la mise en œuvre des paroles entendues. « Mettre en pratique » exprime clairement ce sens en français courant.
- source_word: ὁμοιωθήσεται
  choice: sera semblable à
  rationale: Le futur passif introduit une comparaison. « Sera semblable à » en préserve la forme sans lourdeur excessive.
- source_word: ἀνδρὶ μωρῷ
  choice: un homme insensé
  rationale: ἀνήρ désigne ici un homme dans une comparaison à portée représentative. « Insensé » rend μωρός avec dignité et sans la brutalité familière de « stupide ».
- source_word: ὅστις ᾠκοδόμησεν
  choice: qui a construit
  rationale: Le relatif introduit l’explication, et l’aoriste décrit simplement l’action accomplie de construire.
- source_word: αὐτοῦ τὴν οἰκίαν
  choice: sa maison
  rationale: οἰκία désigne le bâtiment de l’image, et le possessif se rend naturellement par « sa ».
- source_word: ἐπὶ τὴν ἄμμον
  choice: sur le sable
  rationale: La préposition indique ici le support ou fondement sur lequel la maison a été construite.
theological_decisions:
- issue: Langage masculin représentatif dans la comparaison
  choice: un homme insensé
  alternative: une personne insensée
  rationale: Le grec emploie explicitement le nom masculin ἀνήρ. La traduction le conserve dans l’image comparative, tout en précisant que son application est générale.
translation_notes:
  register: Français international moderne, clair et digne. « Mes paroles que voici » maintient le démonstratif grec; « mettre en pratique » rend explicitement l’obéissance concrète visée par ποιέω.
