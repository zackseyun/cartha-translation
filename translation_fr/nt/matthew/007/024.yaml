id: MAT.7.24
reference: Matthew 7:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πᾶς οὖν ὅστις ἀκούει μου τοὺς λόγους τούτους καὶ ποιεῖ αὐτούς, ⸀ὁμοιωθήσεται ἀνδρὶ φρονίμῳ, ὅστις ᾠκοδόμησεν ⸂αὐτοῦ τὴν οἰκίαν⸃ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/024.yaml
  text: Therefore everyone who hears these words of mine and does them will be like a wise man who built his house on the rock[a][b].
translation:
  language: fr
  text: Ainsi, toute personne qui entend ces paroles que je dis et les met en pratique sera semblable[a] à un homme avisé qui a construit sa maison sur le roc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera comparée à ».'
    reason: Le futur passif grec ὁμοιωθήσεται peut être rendu soit par une expression française de ressemblance, soit par un passif plus formel qui souligne l’acte de comparaison.
lexical_decisions:
- source_word: Πᾶς οὖν ὅστις
  choice: Ainsi, toute personne qui
  rationale: La tournure grecque a une portée distributive et générale. « Toute personne qui » l’exprime naturellement en français, tandis que « ainsi » marque le lien logique avec l’enseignement qui précède.
- source_word: ἀκούει μου τοὺς λόγους τούτους
  choice: entend ces paroles que je dis
  rationale: « Paroles » rend λόγους dans ce contexte d’enseignement. La relative « que je dis » exprime naturellement en français le génitif μου sans alourdir la phrase.
- source_word: καὶ ποιεῖ αὐτούς
  choice: et les met en pratique
  rationale: Ici, ποιεῖ signifie accomplir ce qui a été entendu. « Met en pratique » est idiomatique et rend clairement l’opposition implicite entre entendre et agir.
- source_word: ὁμοιωθήσεται
  choice: sera semblable à
  rationale: Cette formulation conserve le futur et la comparaison du passif grec, tout en restant naturelle en français. Le passif peut aussi être compris plus littéralement comme « sera comparée à ».
- source_word: ἀνδρὶ φρονίμῳ
  choice: à un homme avisé
  rationale: ἀνήρ désigne ici un homme, et φρόνιμος évoque le discernement pratique. « Avisé » convient particulièrement à la décision judicieuse de bâtir sur le roc.
- source_word: ᾠκοδόμησεν αὐτοῦ τὴν οἰκίαν
  choice: qui a construit sa maison
  rationale: La traduction conserve directement l’action de construire et le possessif, éléments essentiels de l’image.
- source_word: ἐπὶ τὴν πέτραν
  choice: sur le roc
  rationale: « Le roc » rend πέτρα comme fondation rocheuse solide sans ajouter au texte la notion explicite de soubassement.
theological_decisions:
- issue: Langage masculin dans la comparaison
  choice: un homme avisé
  alternative: une personne avisée
  rationale: Le propos initial concerne toute personne, mais le personnage de la comparaison est désigné par le grec ἀνήρ, terme explicitement masculin. La traduction maintient cette distinction sans donner une portée exclusivement masculine à l’affirmation générale.
- issue: Portée de l’obéissance aux paroles de Jésus
  choice: les met en pratique
  alternative: les accomplit
  rationale: La formulation indique une réponse concrète aux paroles entendues sans préciser davantage la relation théologique entre cette obéissance et le salut.
translation_notes:
  register: Français international moderne, digne et accessible. « Ainsi » assure une transition naturelle; « homme avisé » préserve le masculin du personnage et met en valeur son discernement pratique. La phrase suit de près la structure grecque tout en évitant des calques peu naturels.
