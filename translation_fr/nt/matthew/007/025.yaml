id: MAT.7.25
reference: Matthew 7:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἔπεσεν, τεθεμελίωτο γὰρ ἐπὶ τὴν πέτραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/025.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it did not fall[b], for it had been founded on the rock.
translation:
  language: fr
  text: La pluie est tombée, les torrents sont arrivés[a], les vents ont soufflé et se sont abattus sur cette maison. Elle n’est pas tombée, car elle avait été fondée sur le roc.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les rivières sont arrivées »; le grec signifie plus littéralement « les rivières ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: La pluie est tombée
  rationale: En français courant, « la pluie est tombée » exprime naturellement le mouvement descendant de καταβαίνω avec βροχή comme sujet.
- source_word: οἱ ποταμοί
  choice: les rivières
  rationale: ποταμοί désigne littéralement des rivières ou des cours d’eau. Ce choix conserve l’image grecque, tandis que « les torrents » ou « les eaux » l’interpréteraient davantage comme une crue.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: les vents ont soufflé
  rationale: Traduction directe et idiomatique de πνέω avec les vents comme sujet.
- source_word: προσέπεσαν τῇ οἰκίᾳ ἐκείνῃ
  choice: se sont abattus sur cette maison
  rationale: προσπίπτω signifie tomber ou se jeter contre/sur. « Se sont abattus sur » restitue naturellement la violence de la tempête sans imposer l’idée d’attaques répétées.
- source_word: οὐκ ἔπεσεν
  choice: Elle n’est pas tombée
  rationale: Traduction directe, qui conserve le lien verbal entre l’assaut de la tempête et la maison qui ne tombe pas; « ne s’est pas écroulée » serait plus explicatif.
- source_word: τεθεμελίωτο
  choice: avait été fondée
  rationale: Le plus-que-parfait passif grec décrit un état résultant d’une action antérieure et conserve explicitement l’image des fondations.
- source_word: ἐπὶ τὴν πέτραν
  choice: sur le roc
  rationale: « Le roc » rend πέτρα de manière naturelle et soutenue dans cette image de fondation, sans préciser davantage sa nature.
theological_decisions:
- issue: Image parabolique de la fondation
  choice: sur le roc
  alternative: sur la roche ferme / sur le socle rocheux
  rationale: Le verset laisse l’image fonctionner sans identifier explicitement le roc. La traduction évite donc d’ajouter une interprétation théologique ou géologique.
translation_notes:
  register: Français international moderne, clair et digne. La coordination grecque est légèrement allégée pour éviter une accumulation pesante, tout en préservant la progression de la tempête et la causalité finale.
