source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ⸀ἐτέλεσεν ὁ Ἰησοῦς τοὺς λόγους τούτους, ἐξεπλήσσοντο οἱ ὄχλοι ἐπὶ τῇ διδαχῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/028.yaml
  text: And it happened that when Jesus had finished these words[b][a], the crowds were astonished at his teaching.
translation:
  language: fr
  text: Et il arriva que, lorsque Jésus eut achevé ces paroles[a], les foules étaient stupéfaites par son enseignement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ces propos ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Quand
  rationale: Cette formule narrative introduit ici la circonstance temporelle et la transition vers la réaction des foules. En français moderne, « Quand » rend naturellement l’ensemble sans reproduire lourdement le calque « Et il arriva que, lorsque ».
- source_word: ἐτέλεσεν
  choice: eut achevé
  rationale: Le passé antérieur marque l’achèvement du discours avant la réaction exprimée dans la proposition principale, tout en conservant un registre narratif digne.
- source_word: τοὺς λόγους τούτους
  choice: ces paroles
  rationale: « Paroles » désigne naturellement le discours que Jésus vient de prononcer, sans ajouter l’étiquette interprétative « sermon ». Le terme grec peut aussi désigner des propos, possibilité signalée en note.
- source_word: ἐξεπλήσσοντο
  choice: étaient frappées d’étonnement
  rationale: L’imparfait grec présente la réaction collective dans son déroulement. Cette formulation conserve la force du verbe tout en restant claire et naturelle.
- source_word: οἱ ὄχλοι
  choice: les foules
  rationale: Le pluriel français préserve le pluriel grec et évite de le réduire à « la foule ».
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: par son enseignement
  rationale: Avec le verbe d’étonnement, ἐπί suivi du datif indique ce qui provoque ou fonde la réaction. « Par » exprime clairement cette relation en français.
theological_decisions:
- issue: Référence des paroles achevées par Jésus
  choice: « ces paroles » renvoie directement à l’enseignement précédent
  alternative: « ces propos » ou l’ajout interprétatif « ce sermon »
  rationale: Le texte conclut le discours qui précède sans lui donner de titre théologique. La traduction garde cette référence directe sans préciser davantage que le grec.
translation_notes:
  register: Français international moderne, clair et digne. Le calque traditionnel « Et il arriva que » est évité, car il serait pesant en français actuel; la transition narrative est intégrée à « Quand ». Le passé antérieur convient au registre écrit du récit biblique sans être archaïque.
