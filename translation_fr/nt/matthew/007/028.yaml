review_pass:
  verdict: revise
  source_fidelity: Le projet rend fidèlement l’achèvement du discours, le pluriel de « les foules », l’imparfait de la réaction et la relation avec l’enseignement. Toutefois, « Quand » absorbe entièrement la formule narrative Καὶ ἐγένετο (« et il arriva que »), y compris sa fonction de transition. Une formulation française sobre peut en conserver la valeur sans calquer lourdement la syntaxe grecque.
  naturalness: « Les foules étaient frappées d’étonnement » est compréhensible et convient à un registre biblique moderne, mais « étaient stupéfaites » est plus idiomatique en français international actuel tout en gardant la force et l’aspect imperfectif du grec. La formule initiale proposée reste littéraire, mais est claire et appropriée au récit.
  terminology: « Ces paroles » rend correctement τοὺς λόγους τούτους et ne surinterprète pas le discours comme un « sermon ». « Enseignement » rend bien διδαχή. La note lexicale « ces propos » demeure recevable.
