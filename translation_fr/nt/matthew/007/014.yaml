id: MAT.7.14
reference: Matthew 7:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὅτι στενὴ ἡ πύλη καὶ τεθλιμμένη ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ζωήν, καὶ ὀλίγοι εἰσὶν οἱ εὑρίσκοντες αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/014.yaml
  text: For the gate is narrow and the way that leads to life is hard, and few are those who find it.
translation:
  language: fr
  text: Car la porte est étroite et le chemin qui mène à la vie est resserré, et peu nombreux sont ceux qui le trouvent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενή
  choice: étroite
  rationale: Rend directement l’idée d’une ouverture de faible largeur et conserve le parallèle entre la porte et le chemin.
- source_word: τεθλιμμένη
  choice: resserré
  rationale: Le participe de θλίβω évoque ce qui est comprimé ou rendu étroit. « Resserré » préserve cette image concrète sans réduire le terme à la seule idée abstraite de difficulté.
- source_word: ἀπάγουσα
  choice: qui mène
  rationale: Expression française naturelle pour décrire un chemin conduisant à une destination.
- source_word: ζωήν
  choice: la vie
  rationale: Correspondance directe qui laisse au contexte sa portée théologique sans l’expliciter davantage.
- source_word: ὀλίγοι
  choice: peu nombreux
  rationale: Reproduit l’accent porté sur le petit nombre de personnes tout en restant naturel en français.
- source_word: εὑρίσκοντες
  choice: trouvent
  rationale: Rend simplement le verbe grec et préserve l’image de la découverte du chemin.
theological_decisions:
- issue: Sens de τεθλιμμένη appliqué au chemin
  choice: resserré
  alternative: difficile
  rationale: « Resserré » conserve la métaphore spatiale du grec et son possible sous-entendu d’épreuve, tandis que « difficile » expliciterait seulement une conséquence possible et atténuerait l’image.
- issue: Portée de « la vie »
  choice: Conserver la formulation non développée « la vie »
  alternative: la vie éternelle
  rationale: Le texte dit simplement « la vie » ; l’ajout de « éternelle » résoudrait une portée que le contexte permet de comprendre sans l’énoncer ici.
translation_notes:
  register: Français international moderne, clair et digne. La tournure conserve le parallélisme de la phrase grecque, avec une syntaxe naturelle et sans vocabulaire confessionnel ajouté.
