id: MAT.7.15
reference: Matthew 7:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Προσέχετε ἀπὸ τῶν ψευδοπροφητῶν, οἵτινες ἔρχονται πρὸς ὑμᾶς ἐν ἐνδύμασι προβάτων ἔσωθεν δέ εἰσιν λύκοι ἅρπαγες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/015.yaml
  text: Beware of false prophets[a], who come to you in sheep’s clothing[c][b], but inwardly are ravenous wolves.
translation:
  language: fr
  text: Méfiez-vous des faux prophètes[a], qui viennent à vous en vêtements de brebis[b], mais qui, au-dedans, sont des loups voraces.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Gardez-vous des faux prophètes. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans des vêtements de brebis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: Méfiez-vous de
  rationale: Le présent impératif pluriel appelle à une vigilance continue, et la construction avec ἀπό désigne ceux contre qui il faut se tenir en garde. « Méfiez-vous de » est naturel et conserve la force de l’avertissement.
- source_word: ψευδοπροφητῶν
  choice: faux prophètes
  rationale: Équivalent français courant et précis pour ceux qui se présentent à tort comme prophètes ou parlent faussement en cette qualité.
- source_word: οἵτινες ἔρχονται πρὸς ὑμᾶς
  choice: Ils viennent à vous
  rationale: La reprise par une nouvelle phrase rend naturellement en français la proposition relative qualitative tout en conservant l’idée qu’ils s’approchent des auditeurs.
- source_word: ἐν ἐνδύμασι προβάτων
  choice: déguisés en brebis
  rationale: Cette formulation idiomatique communique clairement l’apparence trompeuse évoquée par les « vêtements de brebis », sans réduire l’image à la seule matière des habits.
- source_word: ἔσωθεν δέ εἰσιν
  choice: mais au-dedans, ce sont
  rationale: « Au-dedans » maintient le contraste spatial et métaphorique entre l’apparence extérieure et la réalité intérieure; « mais » rend nettement l’opposition marquée par δέ.
- source_word: λύκοι ἅρπαγες
  choice: loups voraces
  rationale: « Voraces » exprime de façon vive et idiomatique le caractère prédateur, avide et destructeur de ἅρπαγες.
theological_decisions:
- issue: Nature de la mise en garde contre des responsables religieux trompeurs
  choice: Conserver directement l’image morale et spirituelle des faux prophètes dont l’apparence dissimule la vraie nature.
  alternative: Préciser qu’il s’agit d’enseignants hérétiques au sens de catégories doctrinales ou ecclésiales ultérieures.
  rationale: Le grec vise explicitement de faux prophètes et oppose leur apparence à leur réalité intérieure. Il ne justifie pas de restreindre la mise en garde à une catégorie confessionnelle ou institutionnelle postérieure.
translation_notes:
  register: Français international moderne, digne et immédiatement compréhensible. « Déguisés en brebis » privilégie une image française naturelle; la note conserve la forme littérale du grec. La ponctuation en deux phrases clarifie le mouvement de l’avertissement sans modifier son sens.
