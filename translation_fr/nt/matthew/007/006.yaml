  naturalness: Le français est moderne, clair et d’un registre approprié. « De peur que… ne » et « se retournant » sont naturels dans ce contexte. « Fouler aux pieds » est idiomatique et évite la légère redondance de « piétiner sous leurs pieds ».
  terminology: « Ce qui est saint », « chiens », « perles » et « porcs » conservent justement l’imagerie et son ambiguïté. « Mettre en pièces » rend adéquatement l’intensité de ῥήξωσιν. L’ancre de la note sur τὸ ἅγιον doit être placée après « saint », plutôt qu’après « chiens ».
  issues:
