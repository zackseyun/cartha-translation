reference: Matthew 7:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ δῶτε τὸ ἅγιον τοῖς κυσίν, μηδὲ βάλητε τοὺς μαργαρίτας ὑμῶν ἔμπροσθεν τῶν χοίρων, μήποτε ⸀καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν καὶ στραφέντες ῥήξωσιν ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/006.yaml
  text: Do not give what is holy to dogs[a], and do not throw your pearls before pigs[d][c][b], lest they trample them under their feet and turn and tear you to pieces.
translation:
  language: fr
  text: Ne donnez pas ce qui est saint[a] aux chiens, et ne jetez pas vos perles devant les porcs, de peur qu’ils ne les foulent aux pieds et que, se retournant, ils ne vous mettent en pièces[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est sacré »; l’expression grecque est générale et ne précise pas ici de quelle réalité sainte il s’agit.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne vous déchirent ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἅγιον
  choice: ce qui est saint
  rationale: L’adjectif neutre substantivé garde ici un référent général. « Ce qui est saint » est naturel en français et évite de préciser indûment s’il s’agit d’un enseignement, d’un objet consacré ou d’une autre réalité sacrée.
- source_word: τοῖς κυσίν
  choice: aux chiens
  rationale: Traduction directe qui conserve sans l’atténuer la force métaphorique et culturellement dépréciative de l’image.
- source_word: βάλητε
  choice: jetez
  rationale: « Jeter » est le verbe courant correspondant à βάλλω et convient au geste décrit.
- source_word: τοὺς μαργαρίτας ὑμῶν
  choice: vos perles
  rationale: Le sens lexical et le pluriel sont conservés sans interprétation ajoutée.
- source_word: ἔμπροσθεν τῶν χοίρων
  choice: devant les porcs
  rationale: « Porcs » est moderne, digne et précis; la préposition « devant » reproduit simplement la relation spatiale exprimée.
- source_word: μήποτε
  choice: de peur que… ne
  rationale: Cette tournure française exprime naturellement la mise en garde contre une conséquence redoutée, tout en maintenant l’ambivalence entre but négatif et résultat possible.
- source_word: καταπατήσουσιν αὐτοὺς ἐν τοῖς ποσὶν αὐτῶν
  choice: ils ne les piétinent
  rationale: « Piétiner » comporte déjà l’idée de fouler avec les pieds; ajouter « sous leurs pieds » produirait en français une redondance peu naturelle.
- source_word: στραφέντες
  choice: se retournant
  rationale: Le participe marque une action liée et probablement successive; le participe présent français préserve ce rapport sans imposer une paraphrase.
- source_word: ῥήξωσιν ὑμᾶς
  choice: ils ne vous mettent en pièces
  rationale: Cette expression restitue la violence de ῥήγνυμι mieux que le terme plus général « attaquer », sans supposer nécessairement une manière précise de blesser.
theological_decisions:
- issue: Interprétation de « ce qui est saint », des « chiens », des « perles » et des « porcs »
  choice: Conserver les métaphores sans les expliquer dans le corps du texte.
  alternative: Identifier explicitement ce qui est saint et les perles à l’enseignement sacré ou au message du Royaume, et les animaux à certaines catégories de personnes.
  rationale: Le verset ne définit pas précisément les correspondances métaphoriques. Une explicitation réduirait une ambiguïté authentique et risquerait d’introduire une interprétation doctrinale particulière.
- issue: Rapport syntaxique entre le piétinement et l’attaque
  choice: Présenter deux conséquences redoutées coordonnées, la seconde comportant le mouvement de se retourner.
  alternative: Rattacher plus étroitement « se retournant » à l’ensemble de la séquence ou reformuler en deux phrases indépendantes.
  rationale: Le grec coordonne καταπατήσουσιν et ῥήξωσιν, avec στραφέντες lié au second verbe. La formulation française conserve cette structure et la succession imagée sans la surinterpréter.
translation_notes:
  register: Français international moderne, courant et digne. L’impératif pluriel « donnez » et « jetez » maintient l’adresse collective. Les images abruptes sont conservées sans atténuation ni explicitation confessionnelle.
