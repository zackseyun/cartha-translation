id: MAT.7.23
reference: Matthew 7:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τότε ὁμολογήσω αὐτοῖς ὅτι Οὐδέποτε ἔγνων ὑμᾶς· ἀποχωρεῖτε ἀπ’ ἐμοῦ οἱ ἐργαζόμενοι τὴν ἀνομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/023.yaml
  text: And then I will declare to them[a], ‘I never knew you; depart from me[b], you who practice lawlessness.’
translation:
  language: fr
  text: 'Et alors, je leur déclarerai : « Je ne vous ai jamais connus[a]. Éloignez-vous de moi, vous qui agissez au mépris de la loi[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnus ». Le verbe grec peut désigner une reconnaissance relationnelle, et non une simple connaissance intellectuelle.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous qui commettez l’iniquité » ou « vous qui pratiquez le mal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ τότε
  choice: Et alors
  rationale: Cette formulation conserve à la fois le lien avec ce qui précède et la progression temporelle.
- source_word: ὁμολογήσω
  choice: je leur déclarerai
  rationale: Dans ce contexte solennel de jugement, le verbe exprime une déclaration ouverte plutôt qu’un aveu.
- source_word: Οὐδέποτε
  choice: jamais
  rationale: Le terme exprime une négation absolue, rendue naturellement et avec force par « jamais ».
- source_word: ἔγνων
  choice: je ne vous ai jamais connus
  rationale: « Connaître » préserve l’expression relationnelle du grec sans la réduire à une simple connaissance intellectuelle ni l’interpréter comme « approuver ».
- source_word: ἀποχωρεῖτε
  choice: Éloignez-vous de moi
  rationale: L’impératif exprime un ordre de renvoi. « Éloignez-vous » est solennel, clair et naturel en français moderne.
- source_word: οἱ ἐργαζόμενοι τὴν ἀνομίαν
  choice: vous qui agissez au mépris de la loi
  rationale: Cette formulation exprime une conduite caractéristique et conserve la dimension de rejet de la loi portée par ἀνομία, sans employer le peu transparent « iniquité ».
theological_decisions:
- issue: Sens de « Je ne vous ai jamais connus »
  choice: Maintien de la formulation relationnelle « Je ne vous ai jamais connus »
  alternative: « Je ne vous ai jamais reconnus » ou « Je ne vous ai jamais approuvés »
  rationale: Le grec parle directement de connaissance relationnelle. Une paraphrase en termes d’approbation ou d’appartenance trancherait une question théologique que le verset laisse implicite.
- issue: Portée de ἀνομία
  choice: « agir au mépris de la loi »
  alternative: « commettre l’iniquité » ou « pratiquer le mal »
  rationale: Le choix conserve la force morale et juridique du terme grec sans préciser dans le texte de quelle loi il s’agit ni introduire une doctrine confessionnelle particulière.
translation_notes:
  register: Français moderne, clair et solennel. La tournure directe conserve la force judiciaire de la déclaration et de l’ordre, tandis que les notes signalent les principales possibilités lexicales sans résoudre l’ambiguïté relationnelle.
