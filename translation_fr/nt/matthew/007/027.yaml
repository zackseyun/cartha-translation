id: MAT.7.27
reference: Matthew 7:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κατέβη ἡ βροχὴ καὶ ἦλθον οἱ ποταμοὶ καὶ ἔπνευσαν οἱ ἄνεμοι καὶ προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ, καὶ ἔπεσεν, καὶ ἦν ἡ πτῶσις αὐτῆς μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/027.yaml
  text: And the rain came down[a], and the rivers came, and the winds blew and beat against that house, and it fell—and its fall was great.
translation:
  language: fr
  text: La pluie est tombée, les torrents[a] sont arrivés, les vents ont soufflé et ont frappé cette maison. Elle est tombée, et sa chute a été grande.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les rivières » ou « les eaux en crue ». Le nom grec désigne littéralement des cours d’eau, mais le contexte évoque des eaux de crue.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη ἡ βροχή
  choice: La pluie est tombée
  rationale: En français courant, « la pluie est tombée » exprime naturellement le mouvement descendant de καταβαίνω avec βροχή, sans calque lourd.
- source_word: ἦλθον οἱ ποταμοί
  choice: les torrents sont arrivés
  rationale: ποταμοί désigne littéralement des rivières ou des cours d’eau, mais, dans cette scène de tempête, « torrents » évoque naturellement les eaux soudainement grossies tout en restant dans le champ lexical des cours d’eau.
- source_word: ἔπνευσαν οἱ ἄνεμοι
  choice: les vents ont soufflé
  rationale: Traduction directe, claire et idiomatique de πνέω avec ἄνεμοι.
- source_word: προσέκοψαν τῇ οἰκίᾳ ἐκείνῃ
  choice: ont frappé cette maison
  rationale: Dans ce contexte, προσκόπτω décrit le choc des vents contre la maison. « Frapper » conserve cette force sans introduire l’idée étrangère de trébucher.
- source_word: ἔπεσεν
  choice: Elle est tombée
  rationale: Le verbe simple πίπτω signifie « tomber ». Cette formulation préserve la sobriété et la répétition lexicale du texte grec plutôt que d’expliciter par « s’est écroulée ».
- source_word: ἡ πτῶσις αὐτῆς μεγάλη
  choice: sa chute a été grande
  rationale: « Chute » reflète le nom πτῶσις, apparenté au verbe précédent, et « grande » conserve l’évaluation sobre mais emphatique du grec.
theological_decisions:
- issue: Portée de l’image finale de destruction et de jugement
  choice: sa chute a été grande
  alternative: son effondrement a été catastrophique
  rationale: Le grec affirme la gravité de la chute sans identifier explicitement celle-ci à un jugement eschatologique ni ajouter un qualificatif comme « catastrophique ». La traduction garde la force de l’avertissement sans en résoudre la portée théologique.
translation_notes:
  register: Français international moderne, clair et digne. La succession des phénomènes est rendue avec une cadence simple; la répétition entre « tombée » et « chute » conserve le lien lexical et rhétorique du grec.
