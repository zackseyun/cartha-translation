id: MAT.7.17
reference: Matthew 7:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως πᾶν δένδρον ἀγαθὸν καρποὺς καλοὺς ποιεῖ, τὸ δὲ σαπρὸν δένδρον καρποὺς πονηροὺς ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/017.yaml
  text: So[a], every good tree produces good fruit[c][b], but the rotten tree produces bad fruit.
translation:
  language: fr
  text: Ainsi[a], tout bon arbre produit de bons fruits, mais l’arbre pourri[b] produit de mauvais fruits[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « De même » ou « C’est ainsi que ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi se traduire par « gâté », « mauvais » ou « corrompu ».
    reason: lexical_alternative
  - marker: c
    text: On pourrait aussi traduire par « des fruits malfaisants »; « mauvais » convient naturellement à l’image agricole tout en gardant sa portée morale possible.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Introduit la conséquence ou la correspondance avec l’image précédente. « Ainsi » conserve cette valeur sans alourdir la phrase.
- source_word: πᾶν δένδρον ἀγαθὸν
  choice: tout bon arbre
  rationale: Avec un nom singulier, πᾶν a ici une valeur distributive et générale. « Tout bon arbre » rend naturellement la portée proverbiale.
- source_word: καρποὺς καλοὺς
  choice: de bons fruits
  rationale: καλός peut signifier « bon », « beau » ou « excellent ». Dans cette image où les fruits sont évalués selon leur qualité, « de bons fruits » est idiomatique et maintient le parallélisme.
- source_word: ποιεῖ
  choice: produit
  rationale: Bien que ποιέω signifie littéralement « faire », « produire des fruits » est naturel en français et reste proche de la formulation grecque.
- source_word: τὸ δὲ σαπρὸν δένδρον
  choice: mais l’arbre pourri
  rationale: δέ marque ici le contraste. σαπρός évoque ce qui est pourri, gâté ou devenu impropre; « pourri » conserve la force concrète de l’image.
- source_word: καρποὺς πονηροὺς
  choice: de mauvais fruits
  rationale: πονηρός peut exprimer ce qui est mauvais, nuisible ou malfaisant. « Mauvais fruits » convient à l’image agricole tout en laissant le contexte porter sa dimension morale.
theological_decisions:
- issue: Portée agricole ou morale de l’image
  choice: Conserver l’image concrète de l’arbre et de ses fruits sans en expliciter l’application morale dans le verset.
  alternative: Employer des termes plus interprétatifs comme « arbre corrompu » et « fruits mauvais au sens moral ».
  rationale: Dans le contexte, Jésus met en garde contre les faux prophètes, mais le texte grec formule une image proverbiale plutôt que son interprétation. La traduction préserve cette tension et laisse le contexte fournir l’application.
translation_notes:
  register: Français international moderne, simple et digne. La structure parallèle du grec est conservée, avec un vocabulaire concret et proverbial.
