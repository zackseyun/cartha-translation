id: MAT.7.20
reference: Matthew 7:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα γε ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/020.yaml
  text: So then[a], you will recognize them by their fruits.
translation:
  language: fr
  text: Ainsi donc[a], vous les reconnaîtrez à leurs fruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Par conséquent, c’est bien à leurs fruits que vous les reconnaîtrez. »'
    reason: Variante lexicale rendant plus explicitement l’inférence et la légère insistance de ἄρα γε.
lexical_decisions:
- source_word: ἄρα γε
  choice: Ainsi donc
  rationale: La locution marque une conclusion avec une légère insistance. « Ainsi donc » en restitue naturellement la valeur déductive en français moderne.
- source_word: ἀπὸ
  choice: à
  rationale: Avec « reconnaître », la préposition introduit ici ce qui permet l’identification. La tournure française idiomatique est « reconnaître à ».
- source_word: καρπῶν
  choice: fruits
  rationale: Le pluriel explicite et la métaphore du grec sont conservés, sans les réduire à « actes » ou « résultats ».
- source_word: αὐτῶν
  choice: leurs
  rationale: Le génitif dépend de « fruits » et se rend naturellement par l’adjectif possessif « leurs ».
- source_word: ἐπιγνώσεσθε
  choice: vous reconnaîtrez
  rationale: Le futur de ἐπιγινώσκω désigne ici l’identification de personnes à partir d’indices observables. « Reconnaître » convient au contexte et préserve la valeur du verbe.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom renvoie aux personnes dont il est question et prend naturellement la forme du complément d’objet direct « les ».
theological_decisions:
- issue: Emploi métaphorique des « fruits » pour évaluer les personnes
  choice: Conserver la métaphore « fruits ».
  alternative: Expliciter par « leurs actes » ou « leurs résultats ».
  rationale: Le contexte associe les fruits à ce qui est observable, mais le texte ne précise pas davantage. Garder la métaphore préserve la continuité avec les versets voisins et évite d’imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. « Ainsi donc » garde la conclusion légèrement appuyée; « reconnaître à leurs fruits » est idiomatique tout en restant proche de la structure et de l’image grecques.
