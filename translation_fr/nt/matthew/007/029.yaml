id: MAT.7.29
reference: Matthew 7:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/029.yaml
  text: for he was teaching them as one having authority[a], and not as their scribes.
translation:
  language: fr
  text: car il les enseignait avec autorité, et non comme leurs scribes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν γὰρ διδάσκων
  choice: car il enseignait
  rationale: L’imparfait français rend naturellement la construction périphrastique à valeur imperfective, tandis que « car » conserve la fonction explicative de γάρ par rapport à l’étonnement mentionné au verset précédent.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom objet renvoie aux foules, c’est-à-dire aux auditeurs de Jésus.
- source_word: ὡς ἐξουσίαν ἔχων
  choice: comme quelqu’un qui avait autorité
  rationale: Cette formulation reproduit la comparaison personnelle du grec et conserve le sens d’ἐξουσία comme autorité ou droit reconnu, sans le réduire à la simple assurance oratoire.
- source_word: καὶ οὐχ ὡς
  choice: et non comme
  rationale: La formulation maintient explicitement le contraste établi par le grec.
- source_word: οἱ γραμματεῖς αὐτῶν
  choice: leurs spécialistes de la Loi
  rationale: Dans ce contexte, γραμματεῖς désigne les experts reconnus de la Loi. Cette expression est plus immédiatement compréhensible en français moderne que « scribes », tout en préservant αὐτῶν par « leurs ».
theological_decisions:
- issue: Nature de l’autorité de Jésus dans son enseignement
  choice: Présenter descriptivement Jésus comme quelqu’un qui avait autorité.
  alternative: Préciser explicitement qu’il s’agit d’une autorité divine, ou réduire cette autorité à de l’assurance et à une force rhétorique.
  rationale: Le verset affirme une autorité réelle et la met en contraste avec la manière d’enseigner des spécialistes de la Loi, mais il n’en expose pas ici le fondement théologique complet. La traduction conserve cette tension sans ajout doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait évite une tournure lourde comme « il était en train de les enseigner ». « Spécialistes de la Loi » rend la fonction historique de γραμματεῖς accessible aux lecteurs contemporains.
