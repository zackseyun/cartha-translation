- from: car il les enseignait comme quelqu’un qui avait autorité[a], et non comme leurs spécialistes de la Loi.
  to: car il les enseignait avec autorité, et non comme leurs scribes.
  rationale: La révision adopte l’expression française idiomatique « avec autorité », qui traduit sans perte le sens de ὡς ἐξουσίαν ἔχων, et rétablit « scribes » pour préserver le lexique source. La note proposant « avec autorité » devient superflue puisque cette formulation est retenue dans le texte.
