id: MAT.7.7
reference: Matthew 7:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/007.yaml
  text: Ask[a], and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: fr
  text: Demandez[a], et l’on vous donnera ; cherchez, et vous trouverez ; frappez, et l’on vous ouvrira.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Les impératifs présents grecs peuvent aussi avoir un sens continu : « Continuez à demander… à chercher… à frapper. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἰτεῖτε
  choice: Demandez
  rationale: Impératif présent actif à la deuxième personne du pluriel. « Demandez » exprime naturellement l’ordre sans imposer dans le texte principal une valeur de continuité qui, bien que possible, n’est pas obligatoire.
- source_word: δοθήσεται
  choice: l’on vous donnera
  rationale: Futur passif de δίδωμι. En français courant, la tournure indéfinie « l’on vous donnera » rend naturellement le passif grec tout en laissant l’agent implicite.
- source_word: ὑμῖν
  choice: vous
  rationale: Le datif pluriel est rendu par le pronom complément « vous » dans « on vous donnera » et « on vous ouvrira ».
- source_word: ζητεῖτε
  choice: cherchez
  rationale: Impératif présent actif. « Cherchez » conserve la force de l’ordre ainsi que la portée littérale ou figurée du verbe.
- source_word: εὑρήσετε
  choice: vous trouverez
  rationale: Futur actif de εὑρίσκω, rendu directement et idiomatiquement au futur simple.
- source_word: κρούετε
  choice: frappez
  rationale: Impératif présent actif. Dans ce contexte, « frapper » signifie naturellement frapper à une porte, sans qu’il soit nécessaire d’ajouter le complément absent du grec.
- source_word: ἀνοιγήσεται
  choice: l’on vous ouvrira
  rationale: Futur passif de ἀνοίγω. La tournure indéfinie française conserve l’agent non exprimé et restitue idiomatiquement l’idée qu’une porte sera ouverte à ceux qui frappent.
- source_word: καὶ
  choice: et
  rationale: La coordination répétée par « et » maintient le parallélisme et le rythme des trois propositions sans ajouter une nuance consécutive.
theological_decisions:
- issue: Valeur aspectuelle des trois impératifs présents
  choice: 'Employer des impératifs simples : « Demandez », « cherchez », « frappez »'
  alternative: 'Expliciter la continuité : « Continuez à demander… à chercher… à frapper »'
  rationale: Le présent impératif grec peut évoquer une action poursuivie ou répétée, mais il ne contraint pas à expliciter cette nuance. Le texte principal reste naturel et concis, tandis que la note signale l’autre compréhension possible.
- issue: Agent des deux futurs passifs
  choice: Conserver un agent indéterminé avec « l’on »
  alternative: Nommer Dieu comme agent ou employer des passifs français plus littéraux
  rationale: Le grec ne nomme pas l’agent. « L’on » évite d’ajouter explicitement « Dieu » tout en produisant une phrase française naturelle ; « il vous sera donné » est possible, mais « il vous sera ouvert » serait peu idiomatique sans antécédent exprimé.
translation_notes:
  register: Français international moderne, simple et digne. Le parallélisme ternaire et la concision du grec sont conservés. « L’on » évite la répétition moins harmonieuse de « on » après « et » et convient au registre biblique courant sans archaïsme marqué.
