id: MAT.7.18
reference: Matthew 7:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ δύναται δένδρον ἀγαθὸν καρποὺς πονηροὺς ⸀ποιεῖν, οὐδὲ δένδρον σαπρὸν καρποὺς καλοὺς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/018.yaml
  text: A good tree cannot produce bad fruit[c][b][a], nor can a rotten tree produce good fruit.
translation:
  language: fr
  text: Un bon arbre ne peut pas produire de mauvais fruits, pas plus qu’un arbre pourri ne peut produire de bons fruits.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δένδρον ἀγαθόν
  choice: un bon arbre
  rationale: « Bon » conserve à la fois l’image concrète et la valeur morale ou qualitative de ἀγαθός, sans préciser de façon interprétative qu’il s’agit seulement d’un arbre sain.
- source_word: οὐ δύναται ... ποιεῖν
  choice: ne peut pas produire
  rationale: La tournure exprime une incapacité catégorique, et « produire des fruits » rend naturellement l’emploi idiomatique de ποιέω avec καρπούς.
- source_word: καρποὺς πονηρούς
  choice: de mauvais fruits
  rationale: « Mauvais » restitue largement πονηρός dans le cadre de l’image, où il s’agit de la mauvaise qualité des fruits tout en laissant subsister la portée morale du contexte.
- source_word: οὐδέ
  choice: et ... ne peut pas
  rationale: Cette coordination négative est naturelle en français et maintient le parallélisme des deux propositions; « ni » serait également possible, mais plus lourd avec la répétition de « ne peut pas ».
- source_word: δένδρον σαπρόν
  choice: un arbre pourri
  rationale: « Pourri » rend directement et vivement σαπρός, qui désigne ce qui est décomposé ou corrompu, plutôt que de l’aplatir en « mauvais ».
- source_word: καρποὺς καλούς
  choice: de bons fruits
  rationale: Dans ce contexte, καλός qualifie les fruits comme étant de bonne qualité; « bons fruits » est idiomatique et fait clairement contraste avec « mauvais fruits ».
theological_decisions:
- issue: Nature de l’impossibilité exprimée par la métaphore
  choice: Conserver l’affirmation catégorique « ne peut pas »
  alternative: « ne produit généralement pas » ou « ne devrait pas produire »
  rationale: δύναται sous négation exprime ici l’incapacité, non une simple tendance ou une obligation. La traduction préserve la force rhétorique et morale de l’image sans en tirer de conclusion doctrinale supplémentaire.
translation_notes:
  register: Français moderne, clair et digne. La structure parallèle de l’original est conservée. Aucun appel de note n’est nécessaire, car les équivalents principaux sont naturels et les variantes lexicales n’apporteraient pas ici une ambiguïté substantielle à préserver.
