id: MAT.7.11
reference: Matthew 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὄντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς δώσει ἀγαθὰ τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/011.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will your Father in the heavens give good things to those who ask him.
translation:
  language: fr
  text: Si donc vous, qui êtes mauvais, savez donner de bons cadeaux à vos enfants, à combien plus forte raison votre Père qui est dans les cieux[a] donnera-t-il de bonnes choses[b] à ceux qui lui demandent !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation française traditionnelle : « au ciel ». Le grec emploie le pluriel : « dans les cieux ».'
    reason: lexical_alternative
  - marker: b
    text: Certaines traductions ont ici « de bons cadeaux », comme dans la première partie de la phrase, mais le grec dit simplement « de bonnes choses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηροὶ ὄντες
  choice: qui êtes mauvais
  rationale: Cette tournure conserve la description morale directe du grec tout en restant naturelle en français. « Méchants » serait possible, mais paraîtrait plus catégorique et plus dur dans ce contexte.
- source_word: οἴδατε ... διδόναι
  choice: savez donner
  rationale: Avec l’infinitif complémentaire, « savoir donner » exprime naturellement la capacité pratique visée par le grec.
- source_word: δόματα ἀγαθὰ
  choice: de bons cadeaux
  rationale: « Cadeaux » rend explicitement δόματα, tandis que « bons » traduit ἀγαθά. Cette formulation distingue la première proposition de la seconde, où le nom n’est pas répété en grec.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: à vos enfants
  rationale: « Enfants » est inclusif et correspond au sens de τέκνα sans le limiter aux fils.
- source_word: πόσῳ μᾶλλον
  choice: à combien plus forte raison
  rationale: Cette expression française idiomatique fait clairement entendre le raisonnement a fortiori du texte.
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: votre Père qui est dans les cieux
  rationale: La formulation garde la structure locative et le pluriel de οὐρανοῖς, plutôt que de les remplacer par l’adjectif traditionnel « céleste ».
- source_word: δώσει ἀγαθὰ
  choice: donnera de bonnes choses
  rationale: Le nom δόματα n’étant pas répété, « de bonnes choses » rend l’adjectif substantivé sans harmoniser artificiellement les deux propositions.
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: à ceux qui lui demandent
  rationale: Cette formulation française exprime une demande adressée au Père et garde la portée générale du participe présent substantivé.
theological_decisions:
- issue: Portée anthropologique de πονηροὶ ὄντες
  choice: Conserver la qualification directe « qui êtes mauvais ».
  alternative: « malgré vos défauts » ou « bien que vous soyez pécheurs »
  rationale: Le premier choix affaiblirait le texte, tandis que le second introduirait un terme doctrinal absent de cette phrase. « Mauvais » maintient la tension entre la condition humaine et la bonté supérieure du Père.
- issue: Expression ὁ ἐν τοῖς οὐρανοῖς
  choice: « qui est dans les cieux »
  alternative: « céleste » ou « qui est au ciel »
  rationale: Le choix retenu reflète le pluriel et la construction locative du grec sans tirer de conclusion cosmologique ni doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le mouvement comparatif de l’argument, le contraste moral et la distinction lexicale entre « cadeaux » dans la première proposition et « choses » dans la seconde.
