id: MAT.7.8
reference: Matthew 7:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει καὶ ὁ ζητῶν εὑρίσκει καὶ τῷ κρούοντι ⸀ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/008.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: fr
  text: Car toute personne qui demande reçoit, toute personne qui cherche trouve, et l’on ouvrira à toute personne qui frappe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et à la personne qui frappe, il sera ouvert ». Le grec ne mentionne pas explicitement une porte; celle-ci est suggérée par l’image.'
    reason: Précision sur la construction passive et sur l’objet implicite.
lexical_decisions:
- source_word: πᾶς
  choice: toute personne
  rationale: Employé substantivement avec le participe, πᾶς désigne ici chaque membre d’une catégorie. « Toute personne » exprime naturellement en français moderne la portée universelle sans marquage de genre.
- source_word: γὰρ
  choice: Car
  rationale: « Car » conserve la valeur explicative qui relie cette assurance à l’exhortation du verset précédent.
- source_word: ὁ αἰτῶν
  choice: qui demande
  rationale: Le participe présent substantivé décrit de manière générale la personne qui demande; la relative française en restitue naturellement le sens.
- source_word: λαμβάνει
  choice: reçoit
  rationale: « Reçoit » est le correspondant courant de λαμβάνει et maintient le contraste simple entre demander et recevoir.
- source_word: ὁ ζητῶν
  choice: toute personne qui cherche
  rationale: La répétition de « toute personne » rend explicite la structure parallèle du grec et maintient la portée générale de chaque proposition.
- source_word: εὑρίσκει
  choice: trouve
  rationale: « Trouve » restitue directement le verbe grec et préserve la simplicité mémorable de la formule.
- source_word: τῷ κρούοντι
  choice: à toute personne qui frappe
  rationale: La préposition « à » rend le datif associé au passif, tandis que « toute personne » évite une formulation inutilement genrée.
- source_word: ἀνοιγήσεται
  choice: l’on ouvrira
  rationale: Cette tournure impersonnelle rend naturellement en français le futur passif grec tout en évitant d’ajouter explicitement « la porte », absent du texte source.
theological_decisions:
- issue: Portée et force de la promesse
  choice: Une assurance générale formulée en termes universels, sans restriction ajoutée ni garantie explicitement détachée de son contexte.
  alternative: Comprendre soit que toute demande précise sera accordée exactement telle quelle, soit que la promesse ne concernerait que certaines demandes spirituelles.
  rationale: Le grec emploie une formulation universelle et directe. La traduction la conserve sans introduire une limitation théologique et sans résoudre la tension interprétative au-delà de ce que dit le verset.
- issue: Agent et objet de l’ouverture
  choice: Employer la tournure impersonnelle « l’on ouvrira » sans nommer l’agent ni ajouter « la porte ».
  alternative: « La porte lui sera ouverte » ou « Dieu lui ouvrira ».
  rationale: Le futur passif ἀνοιγήσεται ne nomme ni l’agent de l’action ni l’objet qui est ouvert. La traduction préserve cette indétermination tout en restant idiomatique.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « toute personne » reproduit le parallélisme et la portée universelle du grec; « l’on ouvrira » évite à la fois un masculin générique et l’ajout du mot « porte ».
