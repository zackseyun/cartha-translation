  naturalness: « Alors que, regarde, » est peu fluide en français moderne et produit une articulation redondante. « Et voici que » rend naturellement la fonction d’appel d’attention de καὶ ἰδού dans cette question rhétorique.
  terminology: « Frère », « laisse-moi retirer », « paille » et « poutre » sont fidèles, naturels et conservent le contraste hyperbolique entre κάρφος et δοκός.
