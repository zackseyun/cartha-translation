  text: ἢ πῶς ἐρεῖς τῷ ἀδελφῷ σου· Ἄφες ἐκβάλω τὸ κάρφος ⸀ἐκ τοῦ ὀφθαλμοῦ σου, καὶ ἰδοὺ ἡ δοκὸς ἐν τῷ ὀφθαλμῷ σοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/004.yaml
  text: Or how will you say to your brother[a], ‘Let me take the speck out of your eye,’ and behold[c][b], the beam is in your own eye?
translation:
  language: fr
  text: 'Ou comment diras-tu à ton frère : « Laisse-moi retirer la paille de ton œil », et voici que la poutre est dans ton œil ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ πῶς ἐρεῖς
  choice: Ou comment peux-tu dire
  rationale: « Ou » poursuit l’alternative rhétorique; le présent modal « peux-tu dire » exprime naturellement en français la mise en cause portée par le futur grec, sans transformer l’énoncé en simple prédiction.
- source_word: τῷ ἀδελφῷ σου
  choice: à ton frère
  rationale: Rend directement le masculin singulier ἀδελφῷ et conserve l’adresse personnelle du cas hypothétique.
- source_word: Ἄφες ἐκβάλω
  choice: Laisse-moi retirer
  rationale: L’impératif Ἄφες suivi du subjonctif fonctionne comme une demande de permission; « retirer » convient naturellement à l’extraction d’un objet de l’œil.
- source_word: τὸ κάρφος
  choice: la paille
  rationale: κάρφος désigne un petit fragment sec, notamment une brindille ou un fétu. « Paille » est idiomatique dans cette image biblique française et maintient nettement le contraste de taille.
- source_word: ἐκ τοῦ ὀφθαλμοῦ σου
  choice: de ton œil
  rationale: Expression française naturelle pour enlever un corps étranger de l’œil.
- source_word: καὶ ἰδοὺ
  choice: alors que, regarde,
  rationale: ἰδού attire vivement l’attention sur la situation contradictoire. Dans ce contexte, καί introduit le fait qui rend la parole inconcevable; « alors que » explicite ce rapport rhétorique sans en modifier le sens.
- source_word: ἡ δοκὸς
  choice: la poutre
  rationale: δοκός désigne une grosse pièce de charpente; « poutre » est précis et préserve l’hyperbole opposée à la paille.
- source_word: ἐν τῷ ὀφθαλμῷ σοῦ
  choice: est dans ton propre œil
  rationale: Conserve la localisation et rend en français l’opposition contextuelle entre l’œil du frère et celui de la personne interpellée.
theological_decisions:
- issue: Portée de ἀδελφῷ
  choice: frère
  alternative: frère ou sœur ; prochain ; compagnon dans la foi
  rationale: Le grec emploie un masculin singulier dans un exemple représentatif. La traduction garde cette forme sans restreindre explicitement ni élargir explicitement sa portée.
- issue: Contraste hyperbolique κάρφος / δοκός
  choice: paille / poutre
  alternative: fétu / poutre ; écharde / poutre
  rationale: Ce couple transmet clairement la disproportion volontaire de l’image sans atténuer sa force ni lui attribuer une signification doctrinale supplémentaire.
- issue: Force de ἐρεῖς
  choice: peux-tu dire
  alternative: diras-tu
  rationale: Le futur grec peut être rendu formellement par « diras-tu », mais la question porte ici sur la possibilité cohérente de tenir ces propos. « Peux-tu dire » restitue cette force rhétorique naturelle en français.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement correspond au singulier grec et au contexte du discours. « Regarde » conserve l’appel d’attention de ἰδού sans l’archaïsme de « voici » ou « vois ». Aucun marqueur de note n’est requis, puisqu’aucune note n’est ajoutée.
