    rationale: Cette formulation ajoute une opposition explicite par « alors que » et demeure syntaxiquement maladroite. Le grec coordonne simplement l’énoncé et attire l’attention sur le fait par ἰδού.
  - severity: low
    issue: « ton propre œil » pour τῷ ὀφθαλμῷ σοῦ
    rationale: Le possessif grec ne comporte pas l’adjectif d’insistance « propre ». Le contraste est suffisamment porté par la situation et les deux possessifs.
  - severity: low
    issue: « peux-tu dire » pour le futur ἐρεῖς
    rationale: La question rhétorique française avec « diras-tu » respecte plus étroitement le futur grec tout en restant idiomatique.
