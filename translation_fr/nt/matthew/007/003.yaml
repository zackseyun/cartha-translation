  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ ἐν τῷ σῷ ὀφθαλμῷ δοκὸν οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/003.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: fr
  text: Mais pourquoi vois-tu la paille dans l’œil de ton frère[a], alors que tu ne remarques pas la poutre[b] dans ton propre œil ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « frère » ; le masculin singulier du texte source est conservé.'
    reason: lexical_alternative
  - marker: b
    text: Pour « paille » (κάρφος), on pourrait aussi traduire « écharde », « brin de paille » ou « fétu » ; pour « poutre » (δοκός), « pièce de bois » conviendrait également.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δὲ
  choice: Mais pourquoi
  rationale: Dans cette question rhétorique, τί avec βλέπεις a le sens idiomatique de « pourquoi »; δέ introduit un léger contraste avec ce qui précède.
- source_word: βλέπεις
  choice: vois-tu
  rationale: « Voir » conserve l’image concrète et permet de distinguer ce verbe de κατανοεῖς.
- source_word: κάρφος
  choice: paille
  rationale: κάρφος désigne un petit fragment sec, tel un brin de paille ou une écharde. « Paille » est naturel dans cette image proverbiale en français et forme un contraste net avec « poutre ».
- source_word: ἀδελφοῦ
  choice: frère
  rationale: Le grec emploie un nom masculin singulier de parenté; « frère » en respecte la forme sans neutraliser le texte.
- source_word: τὴν ... δοκόν
  choice: la poutre
  rationale: δοκός désigne une grosse pièce de bois, notamment une poutre; ce terme préserve l’hyperbole et le contraste architectural avec le petit fragment.
- source_word: ἐν τῷ σῷ ὀφθαλμῷ
  choice: dans ton propre œil
  rationale: « Propre » rend l’insistance du possessif σῷ et souligne le contraste avec l’œil du frère.
- source_word: οὐ κατανοεῖς
  choice: tu ne remarques pas
  rationale: κατανοέω exprime ici l’attention et la prise de conscience. « Ne remarques pas » rend naturellement l’ironie tout en restant distinct de « vois-tu ».
theological_decisions:
- issue: Terme de parenté masculin ἀδελφοῦ
  choice: frère
  alternative: frère ou sœur; prochain
  rationale: Le masculin singulier est conservé conformément à la forme du texte grec. La portée générale de l’enseignement n’exige pas de remplacer ce terme par une formulation neutre.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier suit les formes grecques de deuxième personne. L’opposition proverbiale « paille / poutre », largement intelligible en français, préserve l’hyperbole du texte.
