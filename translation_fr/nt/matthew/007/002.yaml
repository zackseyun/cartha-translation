id: MAT.7.2
reference: Matthew 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ᾧ γὰρ κρίματι κρίνετε κριθήσεσθε, καὶ ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/002.yaml
  text: For with the judgment by which you judge[a], you will be judged, and with the measure by which you measure, it will be measured to you.
translation:
  language: fr
  text: Car vous serez jugés selon le jugement que vous portez, et l’on vous mesurera avec la mesure dont vous vous servez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il vous sera mesuré avec la mesure dont vous mesurez ». Le grec emploie un passif et ne dit pas explicitement « en retour », bien que le sens réciproque soit implicite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματι
  choice: jugement
  rationale: « Jugement » rend le sens judiciaire ou évaluatif de κρίμα et maintient le lien lexical avec « jugez » et « serez jugés ».
- source_word: κρίνετε
  choice: vous jugez
  rationale: Le verbe général « juger » préserve l’étendue de κρίνω sans la restreindre à « condamner ».
- source_word: κριθήσεσθε
  choice: vous serez jugés
  rationale: Le futur passif reprend directement le verbe précédent et laisse l’agent du jugement inexprimé, comme en grec.
- source_word: μέτρῳ
  choice: mesure
  rationale: « Mesure » convient à l’emploi métaphorique et permet de conserver la répétition avec le verbe « mesurer ».
- source_word: μετρεῖτε
  choice: vous mesurez
  rationale: Cette formulation garde le jeu lexical et la symétrie proverbiale du texte grec.
- source_word: μετρηθήσεται ὑμῖν
  choice: l’on mesurera pour vous
  rationale: Le pronom indéfini français rend naturellement le passif grec tout en laissant son agent indéterminé; « pour vous » représente le datif ὑμῖν sans ajouter explicitement l’idée de retour.
- source_word: ἐν ᾧ ... ἐν ᾧ
  choice: selon ... dont / avec ... dont
  rationale: Dans la première proposition, « selon » exprime naturellement le critère du jugement; dans la seconde, « avec » conserve l’image instrumentale de la mesure. La répétition de « dont » maintient le parallélisme.
- source_word: γὰρ
  choice: Car
  rationale: « Car » marque avec dignité et concision le lien explicatif avec l’interdiction du verset précédent.
theological_decisions:
- issue: Nature et agent du jugement réciproque
  choice: La formulation passive et indéfinie laisse ouverte l’identité de celui qui juge et mesure.
  alternative: Préciser que Dieu jugera, ou que les autres jugeront, selon la même norme.
  rationale: Le grec n’exprime pas l’agent des passifs. La traduction évite donc de trancher entre jugement divin et réciprocité humaine.
translation_notes:
  register: Français moderne, clair et digne. La triple répétition « jugement / jugez / jugés » et celle de « mesure / mesurez / mesurera » reproduisent autant que possible les correspondances du grec. Le tour « l’on mesurera » est plus naturel en français que le passif littéral « il sera mesuré pour vous », sans préciser l’agent.
