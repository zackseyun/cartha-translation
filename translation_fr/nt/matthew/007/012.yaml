id: MAT.7.12
reference: Matthew 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πάντα οὖν ὅσα ⸀ἐὰν θέλητε ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι, οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς· οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/012.yaml
  text: Therefore[a], in everything, whatever you want people to do for you, do the same for them; for this is the Law and the Prophets.
translation:
  language: fr
  text: Ainsi donc, tout ce que vous voulez que les autres fassent pour vous, faites-le vous aussi pour eux ; car c’est là la Loi et les Prophètes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάντα οὖν ὅσα
  choice: Ainsi donc, tout ce que
  rationale: La tournure française conserve à la fois le lien logique marqué par οὖν et la portée générale de Πάντα… ὅσα, sans calque peu naturel.
- source_word: ἐὰν θέλητε
  choice: vous voulez
  rationale: Le présent exprime naturellement en français la volonté envisagée de manière générale dans cette maxime.
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: que les autres fassent pour vous
  rationale: « Les autres » rend ici naturellement la référence générique aux êtres humains placés en vis-à-vis des destinataires ; « pour vous » convient au sens relationnel de ποιεῖν avec le datif.
- source_word: οὕτως καὶ ὑμεῖς ποιεῖτε αὐτοῖς
  choice: faites-le vous aussi pour eux
  rationale: L’impératif rend ποιεῖτε, tandis que « vous aussi » préserve l’insistance de καὶ ὑμεῖς et « le » reprend explicitement tout ce qui précède.
- source_word: οὗτος γάρ ἐστιν ὁ νόμος καὶ οἱ προφῆται
  choice: car c’est là ce que disent la Loi et les Prophètes
  rationale: 'Cette formulation française explicite minimalement la valeur idiomatique de la copule : la règle résume l’enseignement scripturaire désigné par la formule consacrée, sans l’identifier matériellement au corpus.'
theological_decisions:
- issue: Portée générique de οἱ ἄνθρωποι
  choice: les autres
  alternative: les hommes ; les gens
  rationale: Le contexte concerne universellement les relations humaines et non les hommes de sexe masculin. « Les autres » est idiomatique et maintient la réciprocité de la maxime.
- issue: Sens de « la Loi et les Prophètes »
  choice: formule scripturaire conservée et légèrement explicitée par « ce que disent »
  alternative: « c’est la Loi et les Prophètes » ; « cela résume la Loi et les Prophètes »
  rationale: La formule traditionnelle demeure visible. « Ce que disent » évite en français une équation obscure, tandis que la note signale la forme grecque plus littérale et préserve sa densité théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Ainsi donc » maintient le lien avec le contexte antérieur. La syntaxe reste mémorable, adaptée à une maxime, sans employer le masculin générique.
