id: MAT.7.16
reference: Matthew 7:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπὸ τῶν καρπῶν αὐτῶν ἐπιγνώσεσθε αὐτούς. μήτι συλλέγουσιν ἀπὸ ἀκανθῶν ⸀σταφυλὰς ἢ ἀπὸ τριβόλων σῦκα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/016.yaml
  text: You will recognize them by their fruits[a]. Do people gather grapes from thorns[b], or figs from thistles?
translation:
  language: fr
  text: Vous les reconnaîtrez à leurs fruits[a]. Cueille-t-on des raisins sur des épines, ou des figues sur des chardons[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous les connaîtrez à leurs fruits. »'
    reason: lexical_alternative
  - marker: b
    text: 'La question appelle une réponse négative : on ne cueille pas de raisins sur des épines, ni de figues sur des chardons.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: καρπῶν
  choice: fruits
  rationale: Le pluriel grec est conservé. Le terme concret maintient la métaphore agricole et sa portée théologique sans l’expliciter par « actes » ou « résultats ».
- source_word: ἐπιγνώσεσθε
  choice: vous reconnaîtrez
  rationale: Dans ce contexte de discernement fondé sur des signes observables, « reconnaître » exprime naturellement l’idée de parvenir à identifier, sans surtraduire par « connaître pleinement ».
- source_word: μήτι συλλέγουσιν
  choice: Cueille-t-on
  rationale: μήτι introduit une question rhétorique appelant une réponse négative. La tournure française impersonnelle avec inversion la rend clairement et naturellement; « cueillir » convient aux raisins et aux figues.
- source_word: ἀκανθῶν
  choice: épines
  rationale: Le mot peut désigner des épines ou des plantes épineuses. « Épines » est concis, traditionnel et préserve le parallélisme.
- source_word: σταφυλάς
  choice: raisins
  rationale: Équivalent français direct du pluriel grec dans cette image agricole.
- source_word: τριβόλων
  choice: chardons
  rationale: Le terme désigne une plante épineuse. « Chardons » est immédiatement compréhensible en français moderne et contraste clairement avec les fruits comestibles.
- source_word: σῦκα
  choice: figues
  rationale: Équivalent français direct du pluriel grec.
- source_word: αὐτῶν / αὐτούς
  choice: leurs / les
  rationale: Les pronoms renvoient aux personnes évoquées dans le contexte. Le français conserve cette référence personnelle.
theological_decisions:
- issue: Portée métaphorique des « fruits » pour discerner les personnes
  choice: Conserver la métaphore « fruits »
  alternative: « actes » ou « résultats »
  rationale: Le texte présente une image agricole qui laisse ouverte la gamme de ses référents observables. L’expliciter réduirait inutilement sa richesse et pourrait imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. « Cueille-t-on » restitue avec naturel la question rhétorique, tandis que « fruits », « épines » et « chardons » préservent l’image et le parallélisme du grec.
