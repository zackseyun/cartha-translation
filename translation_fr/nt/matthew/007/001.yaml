  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ κρίνετε, ἵνα μὴ κριθῆτε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/001.yaml
  text: Do not judge[a], so that you may not be judged.
translation:
  language: fr
  text: Ne jugez pas[a], afin de ne pas être jugés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne condamnez pas, afin de ne pas être condamnés. » Le verbe grec peut, selon le contexte, avoir le sens de condamner ; « juger » est toutefois plus large et conserve la répétition du même verbe dans le verset.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: Ne… pas
  rationale: Avec l’impératif présent κρίνετε, μή introduit une interdiction. La tournure française « Ne… pas » en restitue naturellement la force.
- source_word: κρίνετε
  choice: jugez
  rationale: κρίνω peut signifier juger, évaluer ou condamner selon le contexte. « Jugez » conserve ici l’étendue du terme ainsi que la reprise lexicale avec κριθῆτε, sans réduire l’interdiction à la seule condamnation.
- source_word: ἵνα
  choice: afin de
  rationale: ἵνα suivi du subjonctif exprime ici le but ou le résultat envisagé. « Afin de » rend clairement le lien entre les deux propositions dans un français digne et courant.
- source_word: μὴ
  choice: ne… pas
  rationale: Le second μή nie le subjonctif passif κριθῆτε ; la négation française encadre naturellement l’infinitif passif.
- source_word: κριθῆτε
  choice: être jugés
  rationale: Ce subjonctif aoriste passif de κρίνω est rendu par le même verbe français que κρίνετε, ce qui préserve le parallélisme et la force rhétorique de l’original.
theological_decisions:
- issue: Portée de κρίνω dans l’interdiction de Jésus
  choice: Conserver le terme large « juger » plutôt que le restreindre à « condamner ».
  alternative: Ne condamnez pas, afin de ne pas être condamnés.
  rationale: Le contexte immédiat précise la nature du jugement visé, mais ce verset seul n’en définit pas toutes les limites. « Juger » maintient l’ambiguïté et la tension théologique du grec, sans importer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, concis et digne. Le parallélisme verbal de l’original est conservé. « Afin de » a été retenu pour exprimer clairement la relation de but ou de résultat sans archaïsme.
