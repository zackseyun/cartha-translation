id: MAT.7.19
reference: Matthew 7:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/019.yaml
  text: Every tree not producing good fruit is cut down and thrown into the fire[a][b].
translation:
  language: fr
  text: Tout arbre qui ne produit pas de bons fruits est abattu et jeté au feu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui ne porte pas de bons fruits ».'
    reason: lexical_alternative
  - marker: b
    text: Le « feu » est une image de jugement ; le verset lui-même ne précise pas davantage s’il s’agit surtout d’un jugement dans le temps présent, du jugement à venir, ou des deux.
    reason: cross_reference
lexical_decisions:
- source_word: πᾶν δένδρον
  choice: Tout arbre
  rationale: 'Avec le nom singulier, πᾶν a ici une valeur distributive : chaque arbre considéré individuellement. « Tout arbre » restitue naturellement la portée proverbiale de l’expression.'
- source_word: μὴ ποιοῦν
  choice: qui ne produit pas
  rationale: Le participe présent décrit l’activité caractéristique de l’arbre. « Produit » reste proche de ποιέω tout en étant naturel en français ; « porte » est l’expression idiomatique possible avec des fruits.
- source_word: καρπὸν καλὸν
  choice: de bons fruits
  rationale: καλός qualifie ici le fruit comme bon, sain ou convenable. Le pluriel français « de bons fruits » est idiomatique dans cette image et conserve sa valeur morale dans le contexte.
- source_word: ἐκκόπτεται
  choice: est abattu
  rationale: Pour un arbre entier, « abattre » rend naturellement l’action de couper à la base exprimée par ἐκκόπτω. Le présent passif est conservé.
- source_word: εἰς πῦρ βάλλεται
  choice: est jeté au feu
  rationale: Le présent passif de βάλλω exprime le fait d’être jeté, et εἰς indique le mouvement vers le feu. « Jeter au feu » est la tournure française courante, sans préciser davantage la réalité visée par cette image.
theological_decisions:
- issue: L’image du feu comme jugement
  choice: Conserver sans précision supplémentaire l’image de l’arbre abattu et jeté au feu.
  alternative: Interpréter explicitement le feu comme un jugement temporel, le jugement eschatologique ou l’enfer.
  rationale: Le verset communique clairement une menace de jugement au moyen d’une image agricole, mais il n’en définit pas lui-même avec précision la portée ni le moment. La traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, simple et digne. La formulation garde le parallélisme concret de l’image agricole et évite un vocabulaire confessionnel ou une explicitation doctrinale absente du verset.
