source:
  edition: SBLGNT
  text: ὑποκριτά, ἔκβαλε πρῶτον ⸂ἐκ τοῦ ὀφθαλμοῦ σοῦ τὴν δοκόν⸃, καὶ τότε διαβλέψεις ἐκβαλεῖν τὸ κάρφος ἐκ τοῦ ὀφθαλμοῦ τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/005.yaml
  text: Hypocrite[a], first remove the beam from your eye[b], and then you will see clearly to remove the speck from your brother’s eye.
translation:
  language: fr
  text: Hypocrite, enlève d’abord la poutre[a] de ton œil, et alors tu verras assez clair pour enlever la paille[b] de l’œil de ton frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pièce de bois » ; le mot grec désigne une grosse poutre de construction.
    reason: lexical_alternative
  - marker: b
    text: Ou « fétu », « écharde » ou « petit morceau de paille ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποκριτά
  choice: Hypocrite
  rationale: Vocatif singulier exprimant une interpellation directe et sévère. « Hypocrite » conserve naturellement cette force en français sans qu’il soit nécessaire d’ajouter « toi ».
- source_word: ἔκβαλε / ἐκβαλεῖν
  choice: enlève / pour enlever
  rationale: Dans cette image concrète, « enlever » rend naturellement l’action d’ôter un corps étranger de l’œil tout en conservant la reprise du même verbe grec.
- source_word: πρῶτον
  choice: d’abord
  rationale: Marque la priorité dans la séquence ; « d’abord » est direct et idiomatique en français moderne.
- source_word: δοκόν
  choice: poutre
  rationale: Le terme désigne une grosse pièce de bois de construction. « Poutre » restitue précisément l’exagération et le contraste avec le minuscule κάρφος.
- source_word: ὀφθαλμοῦ
  choice: œil
  rationale: Équivalent français ordinaire dans cette métaphore corporelle.
- source_word: διαβλέψεις
  choice: tu verras clairement
  rationale: Le verbe composé peut exprimer une vision nette ou retrouvée ; cette formulation préserve cette nuance plutôt que de réduire le sens à « tu verras ».
- source_word: κάρφος
  choice: paille
  rationale: Le mot désigne une petite particule sèche, notamment un fétu ou une brindille. « Paille » est naturel et reconnaissable dans cette image, tout en maintenant le contraste avec la poutre.
- source_word: ἀδελφοῦ
  choice: frère
  rationale: Le grec est masculin singulier et signifie littéralement « frère » ; ce choix conserve le terme relationnel et son cadre communautaire sans le neutraliser.
theological_decisions:
- issue: Portée du terme relationnel ἀδελφοῦ
  choice: de ton frère
  alternative: d’une autre personne / de ton prochain
  rationale: Le texte grec emploie explicitement le masculin singulier « frère ». La traduction le conserve, tout en laissant au contexte le soin d’en déterminer la portée communautaire.
- issue: Rapport entre correction de soi et aide apportée au frère
  choice: alors tu verras clairement pour enlever
  alternative: alors tu pourras enlever
  rationale: La formulation maintient l’affirmation du texte sur la vision claire sans transformer explicitement celle-ci en simple capacité. Elle préserve ainsi la tension entre discernement retrouvé et action corrective.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux formes grecques de deuxième personne du singulier. Le point-virgule clarifie la progression entre l’impératif initial et sa conséquence. Les marqueurs de notes sont placés immédiatement après les mots concernés.
