id: MAT.7.13
reference: Matthew 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰσέλθατε διὰ τῆς στενῆς πύλης· ὅτι πλατεῖα ⸂ἡ πύλη⸃ καὶ εὐρύχωρος ἡ ὁδὸς ἡ ἀπάγουσα εἰς τὴν ἀπώλειαν, καὶ πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/013.yaml
  text: Enter through the narrow gate[a]. For wide is the gate and broad is the road that leads to destruction[c][b], and many are those who enter through it.
translation:
  language: fr
  text: Entrez par la porte étroite. En effet, la porte est large et la route spacieuse[a] qui mène à la destruction[b], et nombreux sont ceux qui entrent par elle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « large ». Le mot grec désigne ce qui offre beaucoup d’espace.
    reason: lexical_alternative
  - marker: b
    text: Ou « à la ruine » ou « à la perdition ». Le terme grec peut désigner la destruction, la ruine ou la perdition.
    reason: lexical_alternative
  - marker: c
    text: Le pronom grec peut grammaticalement renvoyer à la porte ou à la route ; le sens favorise probablement la porte.
    reason: referential_ambiguity
lexical_decisions:
- source_word: Εἰσέλθατε
  choice: Entrez
  rationale: L’impératif aoriste à la deuxième personne du pluriel exprime un appel direct. « Entrez » est naturel et conserve pleinement sa force.
- source_word: διὰ τῆς στενῆς πύλης
  choice: par la porte étroite
  rationale: Avec le génitif, διά indique ici le passage par une ouverture. « Par la porte étroite » est l’expression française la plus idiomatique.
- source_word: ὅτι
  choice: En effet
  rationale: La conjonction introduit l’explication qui fonde l’exhortation précédente. « En effet » rend clairement cette relation en français moderne.
- source_word: πλατεῖα ἡ πύλη
  choice: la porte est large
  rationale: « Large » exprime le sens spatial de πλατύς et forme un contraste net avec la porte étroite.
- source_word: εὐρύχωρος ἡ ὁδός
  choice: le chemin spacieux
  rationale: εὐρύχωρος désigne ce qui offre beaucoup d’espace. « Spacieux » conserve cette nuance, tandis que « chemin » maintient l’image concrète de l’itinéraire.
- source_word: ἡ ἀπάγουσα
  choice: qui mène
  rationale: Cette relative française rend naturellement le participe présent qui décrit la destination du chemin.
- source_word: εἰς τὴν ἀπώλειαν
  choice: à la destruction
  rationale: « Destruction » exprime la gravité d’ἀπώλεια sans préciser au-delà du texte la nature exacte de l’issue annoncée.
- source_word: πολλοί εἰσιν οἱ εἰσερχόμενοι δι’ αὐτῆς
  choice: nombreux sont ceux qui entrent par elle
  rationale: La formulation conserve la mise en relief de « nombreux » et rend directement le pronom féminin grec. En contexte, « elle » renvoie très probablement à la porte, tout en laissant perceptible l’ambiguïté grammaticale créée par les deux antécédents féminins.
theological_decisions:
- issue: Portée d’ἀπώλεια dans l’avertissement de Jésus
  choice: destruction
  alternative: ruine ; perdition
  rationale: Le verset annonce une issue désastreuse sans en définir ici toute la portée théologique. « Destruction » maintient la gravité et la tension du texte sans imposer une interprétation confessionnelle plus précise.
- issue: Référent du pronom αὐτῆς
  choice: elle, sans explicitation dans le corps du texte
  alternative: cette porte ; ce chemin
  rationale: Le genre féminin permet grammaticalement un renvoi à « porte » comme à « route/chemin » en grec, même si le verbe « entrer par » favorise nettement la porte. Le pronom et la note préservent cette tension sans ajouter un nom absent du dernier membre de phrase.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe reste fluide tout en conservant la mise en relief de « nombreux » et l’ambiguïté réelle du dernier pronom.
