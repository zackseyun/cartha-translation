  text: ⸀ἢ καὶ ⸂ἰχθὺν αἰτήσει⸃— μὴ ὄφιν ἐπιδώσει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/010.yaml
  text: Or if he asks for a fish—he will not give him a snake[b][a], will he?
translation:
  language: fr
  text: Ou encore, s’il demande un poisson, il ne lui donnera pas un serpent, n’est-ce pas ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: Ou encore
  rationale: Introduit naturellement en français le second exemple parallèle, sans donner à καί un poids excessif.
- source_word: ἰχθὺν
  choice: un poisson
  rationale: Sens courant du nom dans ce contexte alimentaire et familial.
- source_word: αἰτήσει
  choice: s’il demande
  rationale: Le futur grec présente un cas éventuel; une proposition conditionnelle au présent est la formulation idiomatique en français.
- source_word: μὴ
  choice: il ne… pas…, n’est-ce pas ?
  rationale: La tournure négative suivie d’une demande de confirmation rend la question rhétorique qui appelle une réponse négative.
- source_word: ὄφιν
  choice: un serpent
  rationale: « Serpent » est le terme français courant et naturel pour cet animal; il convient au contraste avec le poisson.
- source_word: ἐπιδώσει αὐτῷ
  choice: il ne lui donnera pas
  rationale: « Donner » exprime clairement le sens contextuel du verbe, et le pronom datif se rend naturellement par « lui ».
theological_decisions:
- issue: Force de la question rhétorique
  choice: Formulation négative avec « n’est-ce pas ? », qui attend une réponse négative
  alternative: 'Question neutre : « lui donnera-t-il un serpent ? »'
  rationale: La particule μή indique que le locuteur attend la réponse « non ». Cette force soutient le raisonnement de Jésus sans transformer la question en simple affirmation.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le mouvement du second exemple et la force rhétorique du grec sans explicitation doctrinale.
