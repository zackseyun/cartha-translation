source:
  edition: SBLGNT
  text: πολλοὶ ἐροῦσίν μοι ἐν ἐκείνῃ τῇ ἡμέρᾳ· Κύριε κύριε, οὐ τῷ σῷ ὀνόματι ἐπροφητεύσαμεν, καὶ τῷ σῷ ὀνόματι δαιμόνια ἐξεβάλομεν, καὶ τῷ σῷ ὀνόματι δυνάμεις πολλὰς ἐποιήσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/007/022.yaml
  text: Many will say to me on that day[a], ‘Lord, Lord, did we not prophesy in your name, and cast out demons in your name, and do many mighty works in your name?’
translation:
  language: fr
  text: 'Beaucoup me diront en ce jour-là : « Seigneur, Seigneur, n’avons-nous pas prophétisé en ton nom, chassé des démons en ton nom et accompli de nombreuses œuvres de puissance[a] en ton nom ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beaucoup de miracles » ou « de nombreuses œuvres puissantes ». Le grec parle littéralement de nombreuses « puissances », expression souvent employée dans les Évangiles pour désigner des actes miraculeux.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Beaucoup
  rationale: L’adjectif masculin pluriel sans article est employé comme substantif. « Beaucoup » reste naturel en français et n’ajoute pas un nom absent du grec.
- source_word: ἐροῦσίν μοι
  choice: me diront
  rationale: Le futur de λέγω avec le pronom au datif se rend directement et naturellement par « me diront ».
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: en ce jour-là
  rationale: Cette tournure française conserve l’expression temporelle et sa portée eschatologique sans expliciter « le jour du jugement », que le grec ne formule pas.
- source_word: Κύριε κύριε
  choice: Seigneur, Seigneur
  rationale: Le vocatif répété exprime une supplication insistante. « Seigneur » préserve à la fois le sens courant du titre et sa portée christologique.
- source_word: οὐ ... ἐπροφητεύσαμεν
  choice: n’avons-nous pas prophétisé
  rationale: La question grecque attend une réponse affirmative. Cette formulation française en conserve la force et rend προφητεύω par son équivalent usuel.
- source_word: τῷ σῷ ὀνόματι
  choice: en ton nom
  rationale: L’expression consacrée indique que l’action est accomplie sous l’autorité du Seigneur ou en invoquant son nom. Sa triple répétition est maintenue.
- source_word: δαιμόνια ἐξεβάλομεν
  choice: avons-nous chassé des démons
  rationale: Avec δαιμόνια, ἐκβάλλω désigne l’expulsion des démons. « Chasser des démons » est clair et idiomatique en français moderne.
- source_word: δυνάμεις πολλὰς ἐποιήσαμεν
  choice: avons-nous accompli beaucoup d’actes de puissance
  rationale: Dans les Évangiles, δύναμις peut désigner une manifestation de puissance, souvent miraculeuse. « Actes de puissance » maintient ce lien lexical sans réduire d’emblée l’expression à « miracles ».
theological_decisions:
- issue: Traduction de κύριος dans l’adresse directe à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » conserve le sens du titre grec ainsi que sa possible portée christologique, sans aller au-delà de ce que dit le texte.
- issue: Portée eschatologique de « ce jour-là »
  choice: en ce jour-là
  alternative: au jour du jugement
  rationale: Le contexte évoque le jugement final, mais le grec dit seulement « ce jour-là ». La traduction préserve cette formulation et n’explicite pas l’implicite.
- issue: Valeur de δυνάμεις dans le contexte évangélique
  choice: actes de puissance
  alternative: miracles
  rationale: Le choix principal garde la notion de puissance inhérente au terme grec, tandis que la note signale l’équivalent contextuel plus courant sans imposer une interprétation unique.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement convient à l’adresse directe au singulier et évite l’ambiguïté du possessif « votre ». La répétition de « en ton nom » et celle de « Seigneur » sont conservées pour leur force rhétorique.
