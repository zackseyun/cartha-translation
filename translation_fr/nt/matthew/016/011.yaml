  text: πῶς οὐ νοεῖτε ὅτι οὐ περὶ ⸀ἄρτων εἶπον ὑμῖν; ⸂προσέχετε δὲ⸃ ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/011.yaml
  text: How do you not understand that I did not speak to you about bread? But beware of the leaven of the Pharisees and Sadducees[a][b].
translation:
  language: fr
  text: Comment se fait-il que vous ne compreniez pas que ce n’est pas de pains que je vous ai parlé ? Mais gardez-vous du levain des Pharisiens et des Sadducéens[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prenez garde au levain des Pharisiens et des Sadducéens ».
    reason: lexical_alternative
  - marker: b
    text: Le « levain » est ici une métaphore ; au verset suivant, il est expliqué comme l’enseignement des Pharisiens et des Sadducéens.
    reason: cross_reference
lexical_decisions:
- source_word: πῶς οὐ νοεῖτε
  choice: Comment ne comprenez-vous pas
  rationale: La tournure interrogative exprime un reproche devant leur incapacité à saisir le sens des paroles de Jésus. Cette formulation conserve directement la force rhétorique du grec.
- source_word: ὅτι οὐ περὶ ἄρτων εἶπον ὑμῖν
  choice: que je ne vous ai pas parlé de pains
  rationale: Le passé composé rend naturellement l’aoriste εἶπον en français. Le pluriel « pains » conserve ici le pluriel ἄρτων et rappelle les pains évoqués dans le contexte immédiat.
- source_word: προσέχετε δὲ
  choice: Mais gardez-vous
  rationale: Avec ἀπό, l’impératif προσέχετε constitue une mise en garde. « Gardez-vous » en restitue la force, tandis que « mais » marque le mouvement correctif introduit par δέ.
- source_word: ἀπὸ τῆς ζύμης
  choice: du levain
  rationale: « Levain » préserve la métaphore de ζύμη et reste immédiatement intelligible. Après « gardez-vous », la préposition française « de » traduit naturellement ἀπό.
- source_word: τῶν Φαρισαίων καὶ Σαδδουκαίων
  choice: des pharisiens et des sadducéens
  rationale: Ces formes françaises usuelles désignent les deux groupes juifs; le génitif les associe au levain qui leur est propre ou qui les caractérise.
theological_decisions:
- issue: Portée métaphorique du « levain »
  choice: Conserver « levain » dans le texte sans l’expliciter immédiatement.
  alternative: Remplacer la métaphore par « enseignement ».
  rationale: Le verset emploie lui-même ζύμη de manière figurée, et le verset suivant en donne l’explication. Maintenir la métaphore respecte la progression du récit sans anticiper son interprétation explicite.
translation_notes:
  register: Français international moderne, clair et digne. « Gardez-vous » conserve une tonalité soutenue mais courante dans une mise en garde. Les noms de groupes religieux prennent ici la minuscule conformément à l’usage typographique français.
