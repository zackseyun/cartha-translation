  text: καὶ προσλαβόμενος αὐτὸν ὁ Πέτρος ἤρξατο ἐπιτιμᾶν αὐτῷ λέγων· Ἵλεώς σοι, κύριε· οὐ μὴ ἔσται σοι τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/022.yaml
  text: And Peter took him aside and began to rebuke him[a], saying, “Far be it from you, Lord; this will certainly not happen to you.”
translation:
  language: fr
  text: 'Pierre le prit à part et se mit à le réprimander en disant : « Que cela te soit épargné[a], Seigneur ! Cela ne t’arrivera certainement pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque est idiomatique et elliptique. On pourrait aussi traduire : « Dieu t’en préserve, Seigneur ! » ou « Loin de toi une telle chose, Seigneur ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσλαβόμενος
  choice: le prit à part
  rationale: Dans ce contexte, le participe moyen indique vraisemblablement que Pierre entraîne Jésus à l’écart pour lui parler en privé. « Le prit à part » exprime naturellement cette nuance.
- source_word: ἤρξατο ἐπιτιμᾶν
  choice: se mit à lui faire des reproches
  rationale: La tournure rend la valeur ingressive de ἤρξατο avec l’infinitif. « Faire des reproches » restitue ici la réprimande appuyée de Pierre dans un français naturel, sans suggérer nécessairement une réprimande officielle.
- source_word: Ἵλεώς σοι
  choice: Que cela te soit épargné
  rationale: L’expression grecque est elliptique et idiomatique, littéralement liée à l’idée de faveur ou de miséricorde envers quelqu’un. Cette formulation conserve l’ellipse et le souhait que le sort annoncé soit écarté, sans introduire explicitement Dieu dans le texte principal.
- source_word: κύριε
  choice: Seigneur
  rationale: « Seigneur » rend directement κύριε et préserve à la fois la forme d’adresse respectueuse et la portée christologique possible du titre dans l’Évangile.
- source_word: οὐ μὴ ἔσται σοι τοῦτο
  choice: Cela ne t’arrivera certainement pas
  rationale: La combinaison οὐ μή avec le futur constitue une négation emphatique. « Certainement pas » en restitue clairement la force en français contemporain.
theological_decisions:
- issue: Rendre la protestation elliptique de Pierre sans expliciter indûment l’agent divin
  choice: Que cela te soit épargné, Seigneur !
  alternative: Que Dieu t’en préserve, Seigneur ! / Loin de toi cela, Seigneur !
  rationale: Le grec Ἵλεώς σοι est une formule difficile et elliptique. Le texte principal garde l’idée d’un malheur épargné sans ajouter explicitement « Dieu », absent de la formulation grecque. La note signale les principales manières de comprendre l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation vive rend la protestation énergique de Pierre, tandis que la formulation principale évite aussi bien l’archaïsme « À Dieu ne plaise » que l’ajout non signalé d’un agent divin.
