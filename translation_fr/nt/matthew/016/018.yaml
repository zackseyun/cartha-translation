  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κἀγὼ δέ σοι λέγω ὅτι σὺ εἶ Πέτρος, καὶ ἐπὶ ταύτῃ τῇ πέτρᾳ οἰκοδομήσω μου τὴν ἐκκλησίαν, καὶ πύλαι ᾅδου οὐ κατισχύσουσιν αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/018.yaml
  text: And I also say to you that you are Peter[a], and on this rock I will build my church[b], and the gates of Hades will not prevail against it.
translation:
  language: fr
  text: Et moi, je te dis que tu es Pierre, et sur ce roc[a] je bâtirai mon Église, et les portes du séjour des morts[b] ne l’emporteront pas sur elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « ce roc » peut être comprise comme désignant Pierre, la confession de Pierre, ou Pierre en tant que confesseur et représentant des apôtres.
    reason: alternative_reading
  - marker: b
    text: 'Grec : « Hadès », c’est-à-dire le domaine des morts. Traduction traditionnelle : « enfer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ δέ
  choice: Et moi
  rationale: κἀγώ souligne le sujet (« moi aussi / moi à mon tour »), tandis que δέ assure la reprise avec une légère valeur de contraste. « Et moi » rend naturellement en français la réponse de Jésus à la déclaration de Pierre.
- source_word: σοι λέγω
  choice: je te dis
  rationale: Traduction directe et idiomatique de λέγω avec le datif du destinataire.
- source_word: Πέτρος
  choice: Pierre
  rationale: Forme française traditionnelle du nom, qui conserve le jeu de mots avec « pierre/roc », même si le genre grammatical impose une différence formelle.
- source_word: ἐπὶ ταύτῃ τῇ πέτρᾳ
  choice: sur ce roc
  rationale: « Sur » rend ἐπί avec le datif, et « ce » préserve le démonstratif. « Roc » maintient l’image d’un fondement solide et permet de distinguer le nom propre Pierre sans déterminer le référent de l’expression.
- source_word: οἰκοδομήσω
  choice: je bâtirai
  rationale: « Bâtir » conserve clairement la métaphore de la construction exprimée par οἰκοδομέω, dans un registre digne et courant.
- source_word: μου τὴν ἐκκλησίαν
  choice: mon Église
  rationale: ἐκκλησία désigne ici la communauté appartenant à Jésus. « Église » est le terme français conventionnel et contextuellement naturel; la majuscule signale la communauté dans son ensemble plutôt qu’un bâtiment.
- source_word: πύλαι ᾅδου
  choice: les portes du séjour des morts
  rationale: ᾅδης désigne le domaine des morts plutôt que la destination du châtiment final. La traduction sémantique « séjour des morts » est plus immédiatement compréhensible que le calque « Hadès » et évite l’équivoque doctrinale de « enfer ».
- source_word: οὐ κατισχύσουσιν αὐτῆς
  choice: ne l’emporteront pas sur elle
  rationale: κατισχύω exprime l’idée de prévaloir ou de se montrer plus fort. Cette formulation française conserve le rapport d’opposition, et « elle » reprend clairement « Église ».
theological_decisions:
- issue: Référent de « ce roc » (πέτρᾳ)
  choice: L’expression reste « ce roc », sans identifier explicitement son référent.
  alternative: Pierre lui-même; la confession de Pierre; ou Pierre en tant que confesseur et représentant apostolique.
  rationale: Le grec établit un jeu de mots entre Πέτρος et πέτρα, mais ne développe pas explicitement la nature exacte de leur rapport. La traduction préserve donc l’ambiguïté et la tension interprétative au lieu de privilégier une tradition confessionnelle.
- issue: Sens de ᾅδης
  choice: le séjour des morts
  alternative: Hadès; enfer
  rationale: « Séjour des morts » exprime le domaine de la mort visé par le terme grec sans lui attribuer les connotations de châtiment final souvent associées aujourd’hui à « enfer ».
- issue: Image des « portes »
  choice: Conservation littérale de « les portes » et du verbe adversatif « ne l’emporteront pas ».
  alternative: La puissance de la mort ne la vaincra pas.
  rationale: L’image grecque est conservée sans décider si les portes évoquent surtout la puissance du monde des morts, son enfermement ou une opposition hostile.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près le mouvement du grec tout en restant naturelle. « Roc » maintient la métaphore du fondement; « séjour des morts » privilégie la précision sémantique. Tous les marqueurs de note figurent dans le texte.
