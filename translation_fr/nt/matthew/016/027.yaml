id: MAT.16.27
reference: Matthew 16:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μέλλει γὰρ ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεσθαι ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων αὐτοῦ, καὶ τότε ἀποδώσει ἑκάστῳ κατὰ τὴν πρᾶξιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/027.yaml
  text: For the Son of Man is about to come in the glory of his Father with his angels[b][a], and then he will repay each one according to his deed.
translation:
  language: fr
  text: Car le Fils de l’homme est sur le point de venir[a] dans la gloire de son Père, avec ses anges, et alors il rendra à chacun selon sa conduite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « va venir » ou « viendra ». Le grec dit littéralement qu’il « est sur le point de venir », ce qui conserve une nuance d’imminence.
    reason: lexical_alternative
  - marker: b
    text: Ou « selon ce qu’il aura fait ». Le grec emploie le singulier « action » ou « manière d’agir », de façon distributive pour parler de la conduite de chacun.
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλει … ἔρχεσθαι
  choice: est sur le point de venir
  rationale: Cette tournure conserve la valeur d’imminence ou d’action imminente de μέλλω suivi de l’infinitif, sans la réduire à un simple futur.
- source_word: γὰρ
  choice: Car
  rationale: Le connecteur introduit la raison de l’affirmation précédente; « Car » préserve clairement ce lien argumentatif.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Traduction consacrée qui maintient le titre et ses résonances scripturaires.
- source_word: ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ
  choice: dans la gloire de son Père
  rationale: « Dans » rend naturellement ἐν et présente la gloire du Père comme la sphère ou la manifestation de cette venue.
- source_word: μετὰ τῶν ἀγγέλων αὐτοῦ
  choice: avec ses anges
  rationale: La formulation exprime directement l’accompagnement indiqué par μετά avec le génitif.
- source_word: καὶ τότε
  choice: et alors
  rationale: 'Cette expression conserve à la fois la coordination et la succession temporelle: la venue, puis la rétribution.'
- source_word: ἀποδώσει ἑκάστῳ
  choice: il rendra à chacun
  rationale: ἀποδίδωμι désigne ici le fait de rendre à chacun ce qui lui revient; la formulation garde la portée judiciaire sans préciser d’avance s’il s’agit d’une récompense ou d’un châtiment.
- source_word: κατὰ τὴν πρᾶξιν αὐτοῦ
  choice: selon sa conduite
  rationale: « Conduite » rend naturellement en français le singulier πρᾶξις employé de façon distributive pour l’action ou la manière d’agir propre à chaque personne.
theological_decisions:
- issue: Valeur eschatologique de μέλλει dans l’annonce de la venue du Fils de l’homme
  choice: Conserver la nuance d’imminence avec « est sur le point de venir ».
  alternative: « viendra » ou « va venir »
  rationale: Le grec emploie explicitement μέλλω avec un infinitif. La traduction maintient la tension temporelle du texte sans trancher les débats sur l’accomplissement de cette venue.
- issue: Jugement selon l’action ou la conduite de chacun
  choice: « il rendra à chacun selon sa conduite »
  alternative: « il récompensera chacun selon ce qu’il aura fait » ou « il rendra à chacun selon ses actes »
  rationale: La formulation garde l’idée de rétribution individuelle tout en évitant de limiter celle-ci à une récompense positive ou d’y importer un système doctrinal plus large.
translation_notes:
  register: Français international moderne, clair et digne. « Est sur le point de venir » préserve volontairement la tension du grec; « selon sa conduite » évite l’étrangeté de « selon son action » tout en maintenant le singulier distributif.
