id: MAT.16.23
reference: Matthew 16:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ στραφεὶς εἶπεν τῷ Πέτρῳ· Ὕπαγε ὀπίσω μου, Σατανᾶ· σκάνδαλον ⸂εἶ ἐμοῦ⸃, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/023.yaml
  text: But he turned and said to Peter[a], “Go behind me, Satan! You are a stumbling block to me, because you are not setting your mind on the things of God[b], but on the things of men.”
translation:
  language: fr
  text: 'Mais Jésus se retourna et dit à Pierre : « Passe derrière moi, Satan ! Tu es pour moi une pierre d’achoppement, car tes pensées ne sont pas celles de Dieu, mais celles des êtres humains. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: se retourna
  rationale: Le participe aoriste passif employé intransitivement décrit le mouvement de Jésus avant sa parole; « se retourna » est naturel et précis en français.
- source_word: Ὕπαγε ὀπίσω μου
  choice: Passe derrière moi
  rationale: Cette formulation conserve à la fois l’impératif de mouvement et le sens spatial de ὀπίσω, tout en restant idiomatique en français. Elle peut aussi évoquer la juste place du disciple à la suite de Jésus sans imposer cette interprétation.
- source_word: Σατανᾶ
  choice: Satan
  rationale: Le vocatif est conservé comme désignation reconnue, avec toute la force et l’ambiguïté de la réprimande, plutôt que d’être interprété comme le simple nom commun « adversaire ».
- source_word: σκάνδαλον
  choice: une pierre d’achoppement
  rationale: Cette expression française maintient la métaphore d’un obstacle qui fait trébucher. Elle est plus précise ici que « occasion de chute » et moins abstraite que « scandale » au sens moderne.
- source_word: ἐμοῦ
  choice: pour moi
  rationale: Avec σκάνδαλον, « pour moi » exprime naturellement en français que Pierre constitue un obstacle sur le chemin de Jésus.
- source_word: φρονεῖς
  choice: tes pensées ne sont pas celles de
  rationale: Cette tournure exprime une orientation profonde de la pensée plutôt qu’une réflexion passagère, et rend clairement le parallélisme grec.
- source_word: τὰ τοῦ θεοῦ
  choice: celles de Dieu
  rationale: La reprise pronominale après « tes pensées » rend naturellement l’expression substantivée grecque et préserve le contraste avec ce qui relève des humains.
- source_word: τὰ τῶν ἀνθρώπων
  choice: celles des êtres humains
  rationale: ἄνθρωποι désigne ici l’humanité en contraste avec Dieu, non les hommes de sexe masculin. « Êtres humains » rend explicitement cette portée générique en français moderne.
theological_decisions:
- issue: Portée de l’adresse « Satan » faite à Pierre
  choice: Conserver l’adresse directe « Satan » sans expliquer si Pierre est identifié à Satan ou s’il sert d’instrument à une opposition satanique.
  alternative: Traduire par « adversaire » ou expliciter que Satan agit à travers Pierre.
  rationale: Le grec formule une réprimande directe dont l’interprétation exacte reste ouverte. La traduction doit préserver sa force et sa tension, notamment son écho au récit de la tentation.
- issue: Sens possible de « derrière moi »
  choice: Conserver l’image spatiale avec « Passe derrière moi ».
  alternative: Employer uniquement une formule d’éloignement telle que « Va-t’en » ou la formule traditionnelle « Arrière de moi ».
  rationale: ὀπίσω μου peut exprimer une mise à distance tout en rappelant potentiellement la position du disciple qui suit Jésus. La formulation retenue ne tranche pas entre ces nuances.
- issue: Portée de ἀνθρώπων
  choice: Rendre le terme par « êtres humains » au sens générique.
  alternative: Employer « hommes », qui peut aujourd’hui être compris comme visant seulement les personnes de sexe masculin.
  rationale: Dans l’opposition entre Dieu et ἀνθρώπων, le référent est l’humanité et ses perspectives; le français explicite cette portée sans modifier le contraste théologique.
translation_notes:
  register: Français international moderne, digne et direct. « Pierre d’achoppement » conserve l’image biblique tout en demeurant compréhensible; « Passe derrière moi » évite l’archaïsme de « Arrière de moi » et suit de près la dynamique du grec.
