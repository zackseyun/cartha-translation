source:
  edition: SBLGNT
  text: οὐδὲ τοὺς ἑπτὰ ἄρτους τῶν τετρακισχιλίων καὶ πόσας σπυρίδας ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/010.yaml
  text: Or the seven loaves for the four thousand[a], and how many large baskets you picked up?
translation:
  language: fr
  text: Ni les sept pains pour les quatre mille, et combien de grandes corbeilles avez-vous ramassées ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: Ni
  rationale: Dans cette suite elliptique de questions, « ni » relie naturellement ce second rappel au précédent tout en conservant la valeur négative et additive de οὐδὲ.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: les sept pains
  rationale: Dans le récit du repas, ἄρτοι désigne des pains entiers; « pains » est l’équivalent français naturel.
- source_word: τῶν τετρακισχιλίων
  choice: pour les quatre mille
  rationale: Le génitif renvoie au repas donné aux quatre mille personnes; « pour » explicite naturellement cette relation en français sans en changer le sens.
- source_word: πόσας
  choice: combien de
  rationale: L’adjectif interrogatif porte sur σπυρίδας et se rend directement par « combien de ».
- source_word: σπυρίδας
  choice: grandes corbeilles
  rationale: σπυρίς désigne une corbeille de grande capacité, distincte du κόφινος mentionné pour l’autre multiplication des pains; « grandes corbeilles » préserve cette distinction.
- source_word: ἐλάβετε
  choice: vous avez emportées
  rationale: Dans le contexte du ramassage des restes, « emporter » rend le fait de prendre les corbeilles remplies; l’accord féminin pluriel renvoie à « corbeilles ».
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve le caractère elliptique de la suite de questions et la distinction entre les types de paniers dans les deux récits.
