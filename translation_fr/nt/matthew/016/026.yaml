id: MAT.16.26
reference: Matthew 16:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τί γὰρ ⸀ὠφεληθήσεται ἄνθρωπος ἐὰν τὸν κόσμον ὅλον κερδήσῃ τὴν δὲ ψυχὴν αὐτοῦ ζημιωθῇ; ἢ τί δώσει ἄνθρωπος ἀντάλλαγμα τῆς ψυχῆς αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/026.yaml
  text: For what will it profit a man if he gains the whole world but forfeits his life? Or what will a man give in exchange for his life?[a]
translation:
  language: fr
  text: En effet, quel avantage un homme aura-t-il s’il gagne le monde entier, mais perd sa vie ? Ou que donnera un homme en échange de sa vie ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme » dans les deux occurrences de « sa vie ». Le mot grec ψυχή peut désigner la vie, la personne elle-même ou l’âme, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γὰρ
  choice: En effet, quel avantage
  rationale: « En effet » conserve la valeur explicative de γάρ et rattache la question à l’enseignement précédent ; « quel avantage » rend naturellement l’interrogation introduite par τί avec le verbe ὠφελέω.
- source_word: ὠφεληθήσεται
  choice: aura-t-il
  rationale: Avec « quel avantage » comme complément, cette tournure française exprime naturellement le bénéfice reçu, sans calquer lourdement le passif grec.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Le masculin singulier grec a ici une portée représentative et générique ; « un homme » la conserve dans un registre courant et digne.
- source_word: τὸν κόσμον ὅλον
  choice: le monde entier
  rationale: Cette expression restitue l’étendue totale indiquée par ὅλον et demeure idiomatique en français.
- source_word: κερδήσῃ
  choice: gagne
  rationale: « Gagner » maintient l’image économique qui structure l’opposition entre gain, perte et échange.
- source_word: τὴν δὲ ψυχὴν αὐτοῦ
  choice: mais perd sa vie
  rationale: Dans ce contexte, ψυχή peut désigner la vie ou la personne elle-même dans sa valeur ultime. « Sa vie » est clair en français moderne, tandis que « son âme » est conservé en note.
- source_word: ζημιωθῇ
  choice: perd
  rationale: Le passif grec signifie subir une perte ou être privé de quelque chose. « Perd » rend cette issue avec naturel ; l’opposition avec « gagne » en préserve la force.
- source_word: ἀντάλλαγμα
  choice: en échange de
  rationale: Cette formulation conserve directement la métaphore de l’échange sans lui imposer le sens plus précis de rançon ou de compensation.
theological_decisions:
- issue: Sens de ψυχή dans une parole sur la perte ultime
  choice: vie
  alternative: âme
  rationale: Le contexte n’exige pas de limiter ψυχή à une composante immatérielle distincte du corps ; le mot peut viser la vie ou la personne elle-même. « Vie » maintient cette ampleur, tandis que la note préserve « âme », traduction traditionnelle et lexicalement possible.
translation_notes:
  register: Français international moderne, naturel et digne. La structure en deux questions rhétoriques et l’opposition économique entre gagner, perdre et échanger sont conservées. L’ambiguïté de ψυχή est signalée sans imposer une anthropologie particulière.
