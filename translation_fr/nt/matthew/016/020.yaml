id: MAT.16.20
reference: Matthew 16:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ⸀διεστείλατο τοῖς ⸀μαθηταῖς ἵνα μηδενὶ εἴπωσιν ὅτι αὐτός ⸀ἐστιν ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/020.yaml
  text: Then he strictly instructed the disciples to tell no one that he is the Messiah[a].
translation:
  language: fr
  text: Alors il ordonna strictement aux disciples de ne dire à personne qu’il était le Messie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός est rendu ici par « Messie » afin d’en préserver le sens comme titre.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans le récit.
- source_word: διεστείλατο
  choice: ordonna fermement
  rationale: Rend la force de l’injonction exprimée par le moyen de διαστέλλομαι, sans suggérer principalement une mise en garde contre un danger.
- source_word: τοῖς μαθηταῖς
  choice: aux disciples
  rationale: Le groupe déjà connu est défini dans le contexte; aucun possessif ajouté n’est nécessaire.
- source_word: ἵνα μηδενὶ εἴπωσιν
  choice: de ne dire à personne
  rationale: Formulation française naturelle qui exprime le contenu de l’ordre et l’interdiction absolue.
- source_word: ὅτι αὐτός ἐστιν
  choice: qu’il était
  rationale: Le discours indirect après un verbe au passé appelle naturellement l’imparfait en français, sans changer la portée de l’affirmation grecque au présent.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός est ici un titre messianique; «Messie» en communique le sens plutôt que de le traiter comme un nom propre.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans ce contexte, Χριστός désigne le titre attendu. «Messie» en préserve explicitement la portée issue de l’onction, tandis que «Christ» constitue l’équivalent traditionnel translittéré.
translation_notes:
  register: Français international moderne, sobre et digne. «Ordonna fermement» conserve la vigueur de l’injonction; le discours indirect est formulé selon l’usage naturel du français.
source_grounding:
  english_pob_role: consult_only
