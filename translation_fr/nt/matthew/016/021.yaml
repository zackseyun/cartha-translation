id: MAT.16.21
reference: Matthew 16:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀπὸ τότε ἤρξατο ⸂ὁ Ἰησοῦς⸃ δεικνύειν τοῖς μαθηταῖς αὐτοῦ ὅτι δεῖ αὐτὸν ⸂εἰς Ἱεροσόλυμα ἀπελθεῖν⸃ καὶ πολλὰ παθεῖν ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/021.yaml
  text: From that time Jesus began to show his disciples that he must go to Jerusalem and suffer many things from the elders and chief priests and scribes[a], and be killed[c][b], and on the third day be raised.
translation:
  language: fr
  text: À partir de ce moment-là, Jésus commença à montrer à ses disciples qu’il devait aller à Jérusalem, subir beaucoup de souffrances de la part des anciens, des chefs des prêtres et des spécialistes de la Loi, être tué et, le troisième jour, être ressuscité.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « se relever ». Le grec emploie ici une forme passive : « être ressuscité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ τότε
  choice: À partir de ce moment-là
  rationale: Cette formulation naturelle marque nettement le tournant narratif introduit par l’expression temporelle grecque.
- source_word: ἤρξατο δεικνύειν
  choice: commença à montrer
  rationale: Conserve à la fois l’idée du commencement d’une nouvelle phase et le sens de « montrer, faire connaître », sans préciser davantage la manière d’enseigner.
- source_word: δεῖ αὐτὸν
  choice: il devait
  rationale: Dans le discours indirect dépendant d’un verbe au passé, l’imparfait français exprime naturellement la nécessité qui concerne Jésus, tout en préservant son poids théologique sans en expliciter la source.
- source_word: εἰς Ἱεροσόλυμα ἀπελθεῖν
  choice: aller à Jérusalem
  rationale: Équivalent français idiomatique du mouvement vers Jérusalem; « partir pour Jérusalem » serait possible, mais ferait davantage ressortir l’idée du départ.
- source_word: πολλὰ παθεῖν
  choice: subir beaucoup de souffrances
  rationale: Rend naturellement l’intensité de l’épreuve tout en gardant, grâce au pluriel « souffrances », l’idée des nombreuses choses subies.
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: de la part des anciens, des chefs des prêtres et des spécialistes de la Loi
  rationale: « De la part de » exprime sans lourdeur la provenance ou l’intervention hostile indiquée par ἀπό. Les trois groupes de dirigeants restent distincts. « Spécialistes de la Loi » communique en français courant la fonction des γραμματεῖς.
- source_word: ἀποκτανθῆναι
  choice: être tué
  rationale: Rend directement et clairement l’infinitif passif grec.
- source_word: τῇ τρίτῃ ἡμέρᾳ ἐγερθῆναι
  choice: le troisième jour, être ressuscité
  rationale: Conserve l’indication temporelle et la voix passive de l’infinitif grec.
theological_decisions:
- issue: Nature de la nécessité exprimée par δεῖ
  choice: « il devait » sans préciser l’origine de cette nécessité
  alternative: « il fallait qu’il » ou une explicitation telle que « selon le plan de Dieu »
  rationale: Le grec affirme une nécessité forte, mais cette proposition n’en désigne pas explicitement la source. La traduction conserve donc la tension entre dessein divin, accomplissement des Écritures et déroulement des événements.
- issue: Voix de ἐγερθῆναι
  choice: « être ressuscité »
  alternative: « ressusciter » ou « revenir à la vie »
  rationale: L’infinitif grec est passif. Le français passif respecte cette forme et laisse ouverte l’agentivité implicite, sans ajouter « par Dieu » dans le texte.
- issue: Portée de la mention des autorités
  choice: Rattacher explicitement « de la part de » aux souffrances, sans ajouter un complément d’agent après « être tué »
  alternative: « être tué par les anciens, les chefs des prêtres et les spécialistes de la Loi »
  rationale: La position de ἀπό rattache directement les autorités aux souffrances; elles sont aussi comprises dans la suite comme responsables de la mise à mort, mais le grec ne répète pas un complément d’agent devant ἀποκτανθῆναι. La traduction évite de rendre ce lien plus explicite que la syntaxe source.
translation_notes:
  register: Français international moderne, clair et digne. « Chefs des prêtres » évite de suggérer plusieurs grands prêtres en fonction, tandis que « spécialistes de la Loi » est plus immédiatement compréhensible aujourd’hui que « scribes ». La série d’infinitifs est maintenue afin de préserver la progression solennelle de l’annonce.
