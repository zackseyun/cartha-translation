  text: Quand les disciples arrivèrent sur l’autre rive, ils avaient oublié de prendre du pain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθόντες
  choice: Quand … arrivèrent
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français, qui conserve son rapport avec le verbe principal.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: Traduction usuelle et contextuellement précise de μαθηταί dans les Évangiles.
- source_word: εἰς τὸ πέραν
  choice: sur l’autre rive
  rationale: Dans le contexte d’une traversée du lac, cette expression française est plus naturelle et précise que « de l’autre côté ».
- source_word: ἐπελάθοντο
  choice: ils avaient oublié
  rationale: Le plus-que-parfait indique naturellement que l’oubli était antérieur à leur arrivée, sans modifier le sens narratif du grec.
- source_word: ἄρτους
  choice: du pain
  rationale: Bien que le grec emploie le pluriel « pains », le nom massif « du pain » est idiomatique en français pour désigner cette provision.
- source_word: λαβεῖν
  choice: de prendre
  rationale: L’infinitif complète directement le verbe « oublier » et reflète simplement λαβεῖν.
