id: MAT.16.24
reference: Matthew 16:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε ὁ Ἰησοῦς εἶπεν τοῖς μαθηταῖς αὐτοῦ· Εἴ τις θέλει ὀπίσω μου ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/024.yaml
  text: Then Jesus said to his disciples[a], “If anyone wants to come after me, let him deny himself and take up his cross and follow me.”
translation:
  language: fr
  text: 'Alors Jésus dit à ses disciples : « Si quelqu’un veut venir à ma suite, qu’il renonce à lui-même, qu’il se charge de sa croix et qu’il me suive. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la progression du récit, sans alourdir par « À ce moment-là ».
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: à ses disciples
  rationale: « Disciples » est le terme courant et précis dans le contexte évangélique pour la relation d’apprentissage et d’attachement à Jésus.
- source_word: Εἴ τις θέλει
  choice: Si quelqu’un veut
  rationale: Rend la condition ouverte, la portée indéfinie de τις et la volonté exprimée par θέλει.
- source_word: ὀπίσω μου ἐλθεῖν
  choice: venir à ma suite
  rationale: Préserve l’image de se placer derrière Jésus dans la marche du disciple, tout en restant idiomatique et distinct du dernier impératif « qu’il me suive ».
- source_word: ἀπαρνησάσθω ἑαυτὸν
  choice: qu’il renonce à lui-même
  rationale: Exprime l’acte décisif de ne plus se revendiquer soi-même comme centre ou maître de sa vie. En français, « se renier lui-même » risquerait de suggérer surtout la trahison de sa propre identité.
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: qu’il se charge de sa croix
  rationale: Formulation française consacrée et naturelle pour l’action de prendre sa croix afin de la porter; elle conserve la gravité concrète de σταυρός.
- source_word: ἀκολουθείτω μοι
  choice: qu’il me suive
  rationale: Rend directement l’impératif présent. Le contexte de la vie de disciple laisse entendre la continuité sans devoir ajouter « continuellement ».
theological_decisions:
- issue: Portée de l’appel et masculin grammatical singulier
  choice: « Si quelqu’un… qu’il… lui-même… sa… »
  alternative: Employer une reformulation au pluriel ou répéter « cette personne » pour éviter le masculin grammatical.
  rationale: Le grec présente un individu représentatif au singulier, mais l’appel est ouvert à quiconque. En français standard, « quelqu’un » commande naturellement les reprises masculines singulières sans limiter la portée aux hommes.
- issue: Sens du renoncement à soi
  choice: « qu’il renonce à lui-même »
  alternative: « qu’il se renie lui-même »
  rationale: La formulation choisie conserve l’exigence radicale de ἀπαρνέομαι sans préciser indûment une théorie doctrinale du moi ni laisser entendre que toute identité personnelle devrait être niée.
- issue: Image de la croix
  choice: Conserver littéralement « sa croix »
  alternative: Paraphraser par « accepter la souffrance » ou « supporter ses épreuves ».
  rationale: 'Dans le contexte romain et dans la trajectoire narrative de Jésus, la croix évoque plus largement que des difficultés ordinaires : honte, condamnation, souffrance et mort. L’image ne doit donc pas être réduite à une paraphrase.'
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve le rythme ternaire des impératifs grecs. Aucun marqueur de note n’est requis, puisque le masculin grammatical après « quelqu’un » est naturel en français et n’entraîne pas l’ambiguïté propre à la formulation anglaise.
