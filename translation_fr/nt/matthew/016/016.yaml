id: MAT.16.16
reference: Matthew 16:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Σίμων Πέτρος εἶπεν· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ τοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/016.yaml
  text: Simon Peter answered[a], “You are the Messiah, the Son of the living God.”
translation:
  language: fr
  text: 'Simon Pierre répondit : « Tu es le Messie[a], le Fils du Dieu vivant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Χριστός signifie « Oint » et peut être rendu par « Christ » ; « Messie » met ici en évidence sa valeur de titre et son contexte messianique juif.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: répondit
  rationale: La tournure grecque associe un participe de ἀποκρίνομαι à εἶπεν. En français narratif actuel, « répondit » exprime naturellement l’ensemble sans le calque lourd « ayant répondu, il dit ».
- source_word: δὲ
  choice: —
  rationale: La particule marque ici une légère continuité ou transition du récit. La syntaxe française de « Simon Pierre répondit » suffit à rendre cet enchaînement sans conjonction explicite.
- source_word: Σίμων Πέτρος
  choice: Simon Pierre
  rationale: Les deux noms sont rendus selon leur forme française conventionnelle.
- source_word: Σὺ
  choice: Tu
  rationale: Le pronom grec est explicite et porte une certaine emphase. Le français le maintient nécessairement comme sujet placé en tête de la confession.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre messianique, non comme un nom propre. « Le Messie » en restitue clairement la valeur dans le contexte juif, tandis que « le Christ » est signalé en note.
- source_word: ὁ υἱός
  choice: le Fils
  rationale: L’article et le contexte confèrent à υἱός une valeur définie et titulaire, conservée par « le Fils ».
- source_word: τοῦ θεοῦ τοῦ ζῶντος
  choice: du Dieu vivant
  rationale: Cette formulation française naturelle conserve le génitif et la caractérisation de Dieu par le participe attributif ζῶντος.
theological_decisions:
- issue: 'Valeur de Χριστός : titre messianique ou forme traditionnelle « Christ »'
  choice: le Messie
  alternative: le Christ
  rationale: Dans la confession de Pierre, le terme grec désigne explicitement l’Oint attendu. « Messie » rend cette fonction de titre sans exclure la traduction traditionnelle « Christ », donnée en note.
- issue: Portée de l’expression « Fils du Dieu vivant »
  choice: le Fils du Dieu vivant
  alternative: —
  rationale: La formulation grecque est conservée sans l’élargir au moyen de définitions doctrinales ultérieures ni en atténuer la force confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’usage normal du français dans une adresse individuelle et ne cherche pas à ajouter un degré particulier de familiarité. La ponctuation française introduit directement la déclaration par deux-points.
