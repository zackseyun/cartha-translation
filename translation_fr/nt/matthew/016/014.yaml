id: MAT.16.14
reference: Matthew 16:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Οἱ μὲν Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἕτεροι δὲ Ἰερεμίαν ἢ ἕνα τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/014.yaml
  text: And they said[a], “Some say John the Baptist, others Elijah, and others Jeremiah or one of the prophets.”
translation:
  language: fr
  text: 'Ils répondirent[a] : « Pour les uns, Jean le Baptiste ; pour d’autres, Élie ; pour d’autres encore, Jérémie ou l’un des prophètes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « Les uns disent que tu es Jean le Baptiste, d’autres Élie, et d’autres encore Jérémie ou l’un des prophètes. »'
    reason: Le grec formule la réponse de manière elliptique ; le complément « que tu es » est sous-entendu par la question précédente.
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: Ils répondirent
  rationale: Dans cet échange, « répondirent » exprime naturellement en français la valeur contextuelle de εἶπαν. Le léger lien narratif porté par δέ n’a pas besoin d’être rendu séparément.
- source_word: Οἱ μὲν … ἄλλοι δὲ … ἕτεροι δὲ
  choice: Pour les uns… pour d’autres… pour d’autres encore
  rationale: Cette tournure française restitue clairement et avec naturel la répartition entre plusieurs groupes, sans donner à δέ une force adversative excessive.
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: Jean le Baptiste
  rationale: C’est la désignation traditionnelle et immédiatement compréhensible en français moderne pour Ἰωάννης ὁ βαπτιστής.
- source_word: Ἠλίαν
  choice: Élie
  rationale: Forme française usuelle du nom du prophète.
- source_word: Ἰερεμίαν
  choice: Jérémie
  rationale: Forme française usuelle du nom du prophète.
- source_word: ἢ ἕνα τῶν προφητῶν
  choice: ou l’un des prophètes
  rationale: Cette formulation suit directement le grec. Elle n’ajoute pas « autres », mot qui n’est pas exprimé dans la source.
theological_decisions:
- issue: Objet implicite des identifications
  choice: 'Conserver l’ellipse sous une forme française naturelle : « Pour les uns, Jean le Baptiste… »'
  alternative: « Les uns disent que tu es Jean le Baptiste… »
  rationale: Le grec énumère les réponses sans répéter explicitement l’objet de l’identification. La formulation retenue préserve cette ellipse tout en restant claire grâce à la question précédente ; la note donne l’explicitation possible.
translation_notes:
  register: Français moderne, courant et digne. Les points-virgules rendent lisible l’énumération elliptique, tandis que « pour d’autres encore » marque naturellement le troisième groupe.
