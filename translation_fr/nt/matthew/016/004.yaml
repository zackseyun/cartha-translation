reference: Matthew 16:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ. καὶ καταλιπὼν αὐτοὺς ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/004.yaml
  text: An evil and adulterous generation seeks a sign[a], and no sign will be given to it except the sign of Jonah. And leaving them[b], he went away.
translation:
  language: fr
  text: Une génération mauvaise et adultère[a] réclame un signe ; et aucun signe ne lui sera donné, si ce n’est le signe de Jonas[b]. Et il les quitta et s’en alla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « génération adultère » peut évoquer le langage des prophètes, où l’infidélité envers Dieu est comparée à l’adultère.
    reason: lexical_alternative
  - marker: b
    text: Matthieu 12.39-40 développe le « signe de Jonas » en rapprochant les trois jours et trois nuits de Jonas de ceux du Fils de l’homme.
    reason: cross_reference
lexical_decisions:
- source_word: Γενεὰ
  choice: génération
  rationale: Le terme désigne ici les contemporains incrédules auxquels Jésus s’adresse. « Génération » conserve le motif récurrent de Matthieu sans paraphrase excessive.
- source_word: πονηρὰ
  choice: mauvaise
  rationale: « Mauvaise » exprime naturellement en français la corruption morale visée par πονηρά ; « perverse » serait plus appuyé.
- source_word: μοιχαλὶς
  choice: adultère
  rationale: Le terme maintient l’image forte de l’adultère et ses possibles résonances prophétiques d’infidélité envers Dieu, sans réduire la métaphore à une seule interprétation.
- source_word: σημεῖον
  choice: signe
  rationale: « Signe » est l’équivalent direct et laisse au contexte le caractère extraordinaire ou probant de ce qui est demandé.
- source_word: ἐπιζητεῖ
  choice: réclame
  rationale: Dans ce contexte polémique, ἐπιζητεῖ exprime une recherche insistante. « Réclame » rend cette force plus naturellement que le simple « cherche » en français.
- source_word: δοθήσεται
  choice: sera donné
  rationale: Le futur passif est rendu directement, sans expliciter l’agent sous-entendu.
- source_word: αὐτῇ
  choice: lui
  rationale: Le pronom renvoie naturellement en français au nom féminin « génération ».
- source_word: εἰ μὴ
  choice: sinon
  rationale: Après une négation, « sinon » introduit clairement l’unique exception.
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: le signe de Jonas
  rationale: Cette formulation conserve la concision et l’ambiguïté du génitif grec, sans intégrer au verset son explication christologique donnée ailleurs en Matthieu.
- source_word: καταλιπὼν αὐτοὺς
  choice: il les laissa
  rationale: La proposition coordonnée rend naturellement en français l’antériorité du participe aoriste par rapport au départ.
- source_word: ἀπῆλθεν
  choice: s’en alla
  rationale: Cette expression courante et digne traduit clairement le mouvement de départ.
theological_decisions:
- issue: Sens de « génération adultère »
  choice: Conserver « adultère » dans le texte principal.
  alternative: Traduire de manière interprétative par « infidèle ».
  rationale: Le grec emploie explicitement la métaphore de l’adultère, susceptible d’évoquer l’infidélité envers Dieu dans le langage prophétique. La conserver préserve à la fois sa force et son amplitude théologique.
- issue: Sens du « signe de Jonas »
  choice: Maintenir la formule concise sans en incorporer l’explication au texte principal.
  alternative: Expliciter directement la mort et la résurrection de Jésus.
  rationale: Matthieu 12.39-40 développe cette correspondance, mais le présent verset ne le fait pas. Une note de renvoi informe le lecteur sans résoudre dans le texte ce que la formulation grecque laisse condensé.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore vive « adultère » est conservée, tandis que « réclame » exprime le caractère insistant de la demande. La syntaxe est légèrement restructurée pour une lecture fluide sans modifier les rapports logiques du grec.
