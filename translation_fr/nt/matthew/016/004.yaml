- from: Une génération mauvaise et adultère réclame un signe[a] ; mais aucun signe ne lui sera donné, sinon le signe de Jonas[b]. Puis il les laissa et s’en alla.
  to: Une génération mauvaise et adultère[a] réclame un signe ; et aucun signe ne lui sera donné, si ce n’est le signe de Jonas[b]. Et il les quitta et s’en alla.
  rationale: La révision remplace l’adversatif non marqué « mais » par la coordination « et », replace la note lexicale auprès de « adultère » et rend la phrase finale sans l’ajout temporel « Puis ». Elle conserve la concision, la métaphore et l’ambiguïté du texte grec.
