  verdict: revise
  source_fidelity: Le sens général est fidèle, notamment « génération », « mauvaise et adultère », « signe » et « signe de Jonas ». Toutefois, le καί reliant « aucun signe ne lui sera donné » est additif (« et »), non adversatif (« mais »). La conclusion doit également conserver sans ajout temporel marqué la succession « les ayant laissés, il s’en alla ».
  naturalness: Le français est globalement moderne et naturel. « Il les quitta et s’en alla » rend avec fluidité le participe καταλιπών suivi de ἀπῆλθεν, sans le « Puis » interprétatif.
  terminology: « Adultère » préserve correctement la métaphore grecque μοιχαλίς et ses résonances possibles sans imposer « infidèle ». « Jonas » et « signe » sont les termes établis et appropriés. L’ancre de la note sur « génération adultère » doit être placée sur « adultère », et non sur « signe ».
  issues:
