reference: Matthew 16:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ἀποκριθεὶς δὲ⸃ ὁ Ἰησοῦς εἶπεν αὐτῷ· Μακάριος εἶ, Σίμων Βαριωνᾶ, ὅτι σὰρξ καὶ αἷμα οὐκ ἀπεκάλυψέν σοι ἀλλ’ ὁ πατήρ μου ὁ ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/017.yaml
  text: And Jesus answered him[a], “Blessed are you, Simon Bar-Jonah, because flesh and blood did not reveal this to you[c][b], but my Father who is in heaven did.”
translation:
  language: fr
  text: 'Jésus lui répondit : « Heureux es-tu, Simon Bar-Jona[a], car ce n’est pas la chair et le sang[b] qui t’ont révélé cela, mais mon Père qui est dans les cieux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Simon, fils de Jona ». « Bar-Jona » reproduit une forme patronymique araméenne conservée dans le grec.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « la chair et le sang » : expression désignant les êtres humains ou une source simplement humaine.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ... εἶπεν αὐτῷ
  choice: Jésus lui répondit
  rationale: Le participe suivi du verbe conjugué forme une tournure grecque courante, influencée par l’usage sémitique, qui signifie « répondre et dire ». « Lui répondit » en rend naturellement le sens en français sans redondance.
- source_word: Μακάριος
  choice: Heureux
  rationale: Dans cette déclaration de Jésus, « heureux » exprime l’état favorable de celui qui bénéficie de l’action divine. Cette formulation, naturelle et digne en français, évite le caractère aujourd’hui marqué de « bienheureux » et l’ambiguïté possible de « béni », tout en conservant la portée théologique du terme.
- source_word: Σίμων Βαριωνᾶ
  choice: Simon Bar-Jona
  rationale: La translittération conserve la forme patronymique araméenne préservée par le texte grec. Une note en donne immédiatement le sens.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit ici la raison de la déclaration de bonheur. « Car » marque clairement ce rapport causal dans un registre oral digne.
- source_word: σὰρξ καὶ αἷμα
  choice: la chair et le sang
  rationale: La traduction conserve l’expression idiomatique concrète du grec, qui exclut ici une origine ou une intervention simplement humaine, sans préciser davantage de quel humain il s’agirait.
- source_word: ἀπεκάλυψέν σοι
  choice: t’ont révélé cela
  rationale: « Révéler » garde la portée d’un dévoilement, notamment divin dans le contraste de la phrase. « Cela » explicite en français l’objet sous-entendu, à savoir la confession précédente de Simon.
- source_word: ἀλλ’ ὁ πατήρ μου
  choice: mais mon Père
  rationale: « Mais » maintient l’opposition forte entre toute source humaine et le Père comme source de la révélation.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: qui est dans les cieux
  rationale: Cette formulation rend explicitement la proposition grecque et conserve le pluriel « les cieux », naturel dans le registre biblique français.
theological_decisions:
- issue: Origine de la confession de Simon
  choice: L’expression « la chair et le sang » exclut globalement une source humaine et attribue la révélation au Père.
  alternative: Comprendre l’expression comme visant précisément le raisonnement naturel de Simon, ou au contraire l’enseignement reçu d’autres personnes.
  rationale: Le texte établit nettement le contraste entre origine humaine et révélation du Père, mais ne précise pas si l’origine humaine écartée serait Simon lui-même, un enseignant ou toute autre personne. La traduction maintient cette amplitude.
- issue: Sens de μακάριος
  choice: Heureux
  alternative: Béni ; bienheureux
  rationale: Le terme désigne ici la condition favorable de Simon en raison de la révélation reçue. « Heureux » préserve cette déclaration sans transformer explicitement l’adjectif en formule de bénédiction ni employer un mot devenu spécialisé ou archaïsant.
translation_notes:
  register: Français international moderne, clair et digne. L’inversion « Heureux es-tu » garde la force solennelle de la déclaration sans être obscure. Le tutoiement correspond à l’adresse personnelle de Jésus à Simon. Le pluriel « dans les cieux » reste idiomatique dans ce registre et suit de près le grec.
