  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· ⸂Ὀψίας γενομένης λέγετε· Εὐδία, πυρράζει γὰρ ὁ οὐρανός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/002.yaml
  text: But he answered and said to them[a], “When evening comes, you say, ‘Fair weather, for the sky is red.’
translation:
  language: fr
  text: 'Mais il leur répondit : « Quand vient le soir, vous dites : “Il fera beau, car le ciel[a] est rouge.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi désigner le ciel comme domaine céleste, mais ici le dicton météorologique renvoie clairement au ciel visible.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: il leur répondit
  rationale: La formule grecque littérale « ayant répondu, il dit » est un idiome narratif. « Il leur répondit » en conserve la fonction discursive dans un français naturel, sans redondance artificielle.
- source_word: Ὀψίας γενομένης
  choice: Quand vient le soir
  rationale: Le génitif absolu marque le moment. Cette formulation actuelle et naturelle garde la valeur temporelle du grec.
- source_word: λέγετε
  choice: vous dites
  rationale: Le présent décrit ici une parole habituelle, comme dans un dicton météorologique.
- source_word: Εὐδία
  choice: Il fera beau
  rationale: Le nom grec désigne du beau temps. Dans ce dicton, la tournure française « Il fera beau » exprime naturellement la prévision déduite de la couleur du ciel.
- source_word: πυρράζει
  choice: est rouge
  rationale: Le verbe décrit la teinte rougeâtre du ciel. « Est rouge » est clair, sobre et idiomatique.
- source_word: οὐρανός
  choice: ciel
  rationale: Dans ce contexte météorologique, le mot désigne le ciel visible. Le français « ciel » convient directement, tout en gardant l'étendue sémantique habituelle du terme.
