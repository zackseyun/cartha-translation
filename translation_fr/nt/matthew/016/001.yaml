id: MAT.16.1
reference: Matthew 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ προσελθόντες οἱ Φαρισαῖοι καὶ Σαδδουκαῖοι πειράζοντες ἐπηρώτησαν αὐτὸν σημεῖον ἐκ τοῦ οὐρανοῦ ἐπιδεῖξαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/001.yaml
  text: And the Pharisees and Sadducees came and[a], testing him, asked him to show them a sign from heaven.
translation:
  language: fr
  text: Les pharisiens et les sadducéens s’approchèrent de Jésus et, pour le mettre à l’épreuve[a], lui demandèrent de leur montrer un signe venant du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour le tenter » ou « pour essayer de le piéger ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: s’approchèrent de Jésus
  rationale: Le participe aoriste de προσέρχομαι exprime leur mouvement vers Jésus avant la demande. « S’approchèrent » est naturel en français; le nom de Jésus, implicite dans le pronom grec, clarifie le référent sans changer le sens.
- source_word: Φαρισαῖοι
  choice: les pharisiens
  rationale: Forme française traditionnelle et courante du nom de ce groupe.
- source_word: Σαδδουκαῖοι
  choice: les sadducéens
  rationale: Forme française traditionnelle et courante du nom de ce groupe.
- source_word: πειράζοντες
  choice: pour le mettre à l’épreuve
  rationale: Le participe indique ici le but hostile de leur démarche. Cette formulation conserve l’idée d’épreuve sans préciser excessivement qu’ils cherchaient à le piéger.
- source_word: ἐπηρώτησαν
  choice: lui demandèrent
  rationale: Dans la construction avec l’infinitif ἐπιδεῖξαι, « demander de » rend clairement et naturellement la requête.
- source_word: σημεῖον
  choice: un signe
  rationale: Le grec dit simplement « signe ». Le contexte peut évoquer un prodige attestant l’autorité de Jésus, mais il n’est pas nécessaire d’ajouter « miraculeux ».
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: venant du ciel
  rationale: Cette formulation idiomatique exprime l’origine du signe tout en préservant la portée possible de « ciel ».
- source_word: ἐπιδεῖξαι
  choice: montrer
  rationale: « Montrer » rend directement l’infinitif et convient naturellement avec « un signe ».
theological_decisions:
- issue: Nuance hostile de la demande des pharisiens et des sadducéens
  choice: « pour le mettre à l’épreuve »
  alternative: « pour le tenter » ou « pour essayer de le piéger »
  rationale: « Mettre à l’épreuve » conserve la nuance adversative de πειράζω sans lui donner exclusivement le sens moral de tenter au péché ni expliciter un piège davantage que ne le fait le grec.
translation_notes:
  register: 'Français international moderne, clair et digne. La phrase est restructurée légèrement pour éviter un enchaînement participial lourd, tout en maintenant l’ordre logique: approche, intention d’éprouver Jésus, puis demande.'
