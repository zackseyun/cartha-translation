  variant: modern international French
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς ⸀εἶπεν· Τί διαλογίζεσθε ἐν ἑαυτοῖς, ὀλιγόπιστοι, ὅτι ἄρτους οὐκ ⸀ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/008.yaml
  text: But Jesus[a], knowing this, said, “Why are you discussing among yourselves, you of little faith, that you have no bread?”
translation:
  language: fr
  text: 'Mais Jésus, sachant cela, leur dit : « Pourquoi discutez-vous entre vous, gens de peu de foi, du fait que vous n’avez pas pris de pains ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: s’en étant rendu compte
  rationale: Le participe aoriste exprime la prise de conscience de Jésus avant sa parole; le pronom « en » reprend naturellement la discussion implicite dans le contexte.
- source_word: δὲ
  choice: Mais
  rationale: Marque ici une légère opposition et le passage de la discussion des disciples à la réaction de Jésus.
- source_word: εἶπεν
  choice: leur dit
  rationale: Rendu narratif courant; « leur » explicite en français les destinataires déjà indiqués par le contexte et par la deuxième personne du discours.
- source_word: Τί διαλογίζεσθε
  choice: Pourquoi discutez-vous
  rationale: Τί a ici une valeur adverbiale interrogative et demande la raison de leur délibération; « discuter » convient à un échange entre eux.
- source_word: ἐν ἑαυτοῖς
  choice: entre vous
  rationale: Préserve le sens collectif le plus probable dans la scène, tout en restant naturel en français.
- source_word: ὀλιγόπιστοι
  choice: gens de peu de foi
  rationale: Conserve la réprimande directe et le motif matthéen du manque de foi sans l’étendre en affirmation doctrinale.
- source_word: ὅτι
  choice: du fait que
  rationale: Introduit le contenu autour duquel porte leur discussion, tout en donnant une formulation française fluide.
- source_word: ἄρτους
  choice: pains
  rationale: Le pluriel concret reflète directement le grec et le contexte des pains évoqués dans le récit.
- source_word: οὐκ ἐλάβετε
  choice: vous n’avez pas pris
  rationale: Préserve le sens verbal de λαμβάνω et l’aoriste, sans transformer la proposition en simple état de manque; dans le contexte, il s’agit d’avoir pris ou emporté des pains.
theological_decisions:
- issue: Portée de la réprimande ὀλιγόπιστοι
  choice: « gens de peu de foi », comme reproche visant leur confiance insuffisante dans cette situation
  alternative: Une simple remarque sur leur incompréhension, sans référence explicite à la foi
  rationale: Le terme grec nomme directement une foi insuffisante. La traduction en maintient la force tout en évitant d’en tirer une conclusion doctrinale plus large.
- issue: Relation introduite par ὅτι
  choice: 'Contenu de la discussion : « du fait que vous n’avez pas pris de pains »'
  alternative: 'Cause de la discussion : « parce que vous n’avez pas pris de pains »'
  rationale: Les deux nuances sont proches dans ce contexte; la formulation retenue présente la proposition comme le sujet explicite de leur échange, sans nier sa valeur causale possible.
translation_notes:
  register: Français international moderne, digne et oralement naturel. La formulation garde le pluriel concret « pains » et le verbe « prendre », plus proches du grec que la paraphrase « ne pas avoir de pain ». L’apostrophe est placée en fin de question pour conserver une phrase française fluide tout en maintenant la vigueur du reproche.
