  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ⸀ὅτι εἰσίν τινες ⸂τῶν ὧδε ἑστώτων⸃ οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν τῇ βασιλείᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/028.yaml
  text: Truly I tell you[c][b][a], there are some standing here who will certainly not taste death until they see the Son of Man coming in his kingdom.
translation:
  language: fr
  text: '« En vérité, je vous le dis : quelques-uns de ceux qui se tiennent ici ne goûteront certainement pas[a] la mort avant de voir le Fils de l’homme venir dans son royaume[b]. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne goûteront absolument pas la mort » ; le grec emploie une négation emphatique.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans son règne » ou « dans l’exercice de son autorité royale ».
    reason: lexical_alternative
  - marker: c
    text: L’expression « le Fils de l’homme venir dans son royaume » peut renvoyer à la transfiguration, à la résurrection et à l’exaltation, au jugement sur Jérusalem ou à la venue finale ; le texte lui-même ne précise pas de quel événement il s’agit.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: En vérité
  rationale: Cette formule solennelle rend naturellement l’affirmation qui introduit une parole faisant autorité, sans recourir à une translittération inutile.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formulation française courante et digne, qui conserve l’adresse directe et la solennité de la déclaration.
- source_word: εἰσίν τινες τῶν ὧδε ἑστώτων
  choice: quelques-uns de ceux qui se tiennent ici
  rationale: Cette formulation explicite naturellement la valeur partitive du grec et garde l’image concrète de personnes présentes et debout.
- source_word: οὐ μὴ γεύσωνται
  choice: ne goûteront certainement pas
  rationale: La double négation grecque est fortement emphatique. « Certainement pas » en restitue la force tout en conservant la métaphore du verbe « goûter ».
- source_word: γεύσωνται θανάτου
  choice: goûteront […] la mort
  rationale: Le maintien de l’expression imagée « goûter la mort » respecte le grec et demeure intelligible en français biblique moderne.
- source_word: ἕως ἂν ἴδωσιν
  choice: avant de voir
  rationale: Le français emploie naturellement « avant de » lorsque le sujet reste le même. Cette tournure exprime la limite temporelle future sans ajouter de précision.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation établie conserve les résonances à la fois idiomatiques, titulaires et apocalyptiques de l’expression grecque.
- source_word: ἐρχόμενον
  choice: venir
  rationale: L’infinitif dépend naturellement de « voir » en français et rend directement le participe grec, sans importer l’idée de puissance absente de ce verset.
- source_word: ἐν τῇ βασιλείᾳ αὐτοῦ
  choice: dans son royaume
  rationale: « Royaume » conserve l’image concrète et le terme biblique clé, tout en laissant ouverte la nuance possible de règne ou d’autorité royale.
theological_decisions:
- issue: Référent de la venue du Fils de l’homme dans son royaume
  choice: Traduire l’expression sans identifier l’événement visé
  alternative: Préciser qu’il s’agit de la transfiguration, de la résurrection et de l’exaltation, de la Pentecôte, du jugement sur Jérusalem ou de la venue finale
  rationale: Le grec ne précise pas l’événement. La traduction maintient donc l’ambiguïté et la tension eschatologique du texte au lieu de trancher entre les principales interprétations.
- issue: Portée de βασιλεία
  choice: royaume
  alternative: règne ou autorité royale
  rationale: Le mot grec peut désigner un royaume ou l’exercice de la royauté. « Royaume » préserve ici l’imagerie et la cohérence terminologique sans exclure entièrement la notion dynamique de règne.
translation_notes:
  register: Français international moderne, clair et digne. La formule « En vérité, je vous le dis » et l’image « goûter la mort » conservent la solennité et la force littéraire du texte, tandis que la syntaxe reste accessible à un lectorat général.
