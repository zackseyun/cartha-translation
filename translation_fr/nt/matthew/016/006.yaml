id: MAT.16.6
reference: Matthew 16:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Ὁρᾶτε καὶ προσέχετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/006.yaml
  text: But Jesus said to them[a], “Watch out and beware of the leaven of the Pharisees and Sadducees.”
translation:
  language: fr
  text: 'Mais Jésus leur dit : « Soyez vigilants et gardez-vous du levain[a] des pharisiens et des sadducéens. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « levure ». Le grec emploie une image que Jésus expliquera plus loin en rapport avec l’enseignement des pharisiens et des sadducéens.
    reason: Alternative lexicale et clarification limitée de la métaphore dans son contexte littéraire.
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une légère opposition ou une transition par rapport au contexte précédent ; « Mais » rend naturellement ce mouvement.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: Cette formulation française courante et fidèle exprime le verbe de parole avec son complément indirect.
- source_word: Ὁρᾶτε
  choice: Soyez vigilants
  rationale: L’impératif de ὁράω a ici valeur d’avertissement plutôt que de simple perception visuelle. « Soyez vigilants » en restitue la force dans un registre actuel et digne.
- source_word: προσέχετε
  choice: gardez-vous
  rationale: Le verbe renforce l’avertissement et, avec ἀπό, invite à se tenir en garde contre quelque chose. La coordination préserve le redoublement rhétorique grec.
- source_word: ἀπὸ
  choice: du
  rationale: Après « gardez-vous », le français emploie naturellement « de » ; l’article défini contracté donne « du levain ».
- source_word: ζύμης
  choice: levain
  rationale: « Levain » correspond directement à ζύμη et conserve l’image figurée, ainsi que sa résonance biblique, sans l’expliquer prématurément.
- source_word: Φαρισαίων
  choice: pharisiens
  rationale: Désignation française établie de ce groupe ; la minuscule convient au nom commun désignant ses membres.
- source_word: Σαδδουκαίων
  choice: sadducéens
  rationale: Désignation française établie de ce groupe ; la minuscule convient au nom commun désignant ses membres.
theological_decisions:
- issue: Portée métaphorique de « levain »
  choice: Conserver « levain » comme métaphore sans l’expliciter dans le texte principal.
  alternative: Remplacer l’image par « enseignement » ou « influence ».
  rationale: Dans la suite du passage, Jésus éclaire cette image en rapport avec l’enseignement des pharisiens et des sadducéens, mais le présent verset emploie bien le terme figuré ζύμη. Le conserver respecte la progression narrative et l’ambiguïté initiale.
translation_notes:
  register: Français international moderne, clair et digne. « Soyez vigilants et gardez-vous » reproduit le double avertissement sans calque maladroit. Les noms de groupes religieux sont écrits avec une minuscule selon l’usage français.
