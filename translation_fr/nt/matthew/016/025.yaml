id: MAT.16.25
reference: Matthew 16:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ εὑρήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/025.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will find it.
translation:
  language: fr
  text: En effet, celui qui veut sauver sa vie[a] la perdra, mais celui qui perdra sa vie à cause de moi la trouvera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « âme » dans tout le verset; le mot grec psychē peut désigner la vie, la personne elle-même ou l’âme selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἐὰν / ὃς δ’ ἂν
  choice: En effet, celui qui… mais celui qui
  rationale: Les constructions relatives avec ἐάν/ἄν expriment des conditions générales indéfinies. « Celui qui » est naturel en français et garde le singulier représentatif du grec. « En effet » relie la parole à ce qui précède, tandis que « mais » marque nettement le contraste introduit par δέ.
- source_word: θέλῃ
  choice: veut
  rationale: Le verbe θέλω exprime ici la volonté ou le désir. « Veut » est direct, courant et fidèle.
- source_word: ψυχὴν
  choice: vie
  rationale: Dans ce paradoxe lié au fait de suivre Jésus et de risquer la mort, ψυχή désigne en premier lieu la vie de la personne, tout en pouvant aussi évoquer la personne elle-même ou l’âme. « Vie » s’accorde naturellement avec sauver, perdre et trouver; l’autre possibilité est signalée en note.
- source_word: σῶσαι
  choice: sauver
  rationale: « Sauver » conserve le sens ordinaire de σῴζω ainsi que l’opposition frappante avec « perdre ».
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: perdra / perdra
  rationale: Dans ce contexte, ἀπόλλυμι signifie perdre sa vie. Le futur français convient au futur grec de la première proposition et rend naturellement la condition générale à portée future de la seconde.
- source_word: ἕνεκεν ἐμοῦ
  choice: à cause de moi
  rationale: La préposition ἕνεκεν avec le génitif indique ici que l’attachement à Jésus est la cause de cette perte. « À cause de moi » reste proche du grec sans préciser davantage la manière dont cette perte survient.
- source_word: εὑρήσει
  choice: trouvera
  rationale: « Trouvera » traduit directement εὑρίσκω et maintient le paradoxe verbal du texte sans l’expliciter par « gagnera ».
- source_word: αὐτοῦ / αὐτήν
  choice: sa / la
  rationale: Les pronoms français reprennent naturellement « celui » et « vie ». Le singulier masculin reste représentatif, comme dans la formulation grecque.
theological_decisions:
- issue: Sens de ψυχή dans le paradoxe du disciple
  choice: vie
  alternative: âme; personne elle-même
  rationale: Le contexte de renoncement à soi et de mise en danger de sa vie favorise « vie », sans réduire ψυχή à la seule âme immatérielle. La note conserve l’étendue sémantique et la portée théologique du terme grec.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle et paradoxale est conservée, avec des verbes simples et une syntaxe proche de l’oral soutenu.
