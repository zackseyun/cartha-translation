    reason: alternative_reading
  revision_rationale: La révision restitue explicitement λέγουσιν par « les gens disent-ils », tout en conservant une construction française fluide. Elle maintient les choix établis pour le lieu, les disciples et le titre « Fils de l’homme ». La note est reformulée afin de signaler les rendus alternatifs sans les présenter comme une interprétation imposée par le contexte.
