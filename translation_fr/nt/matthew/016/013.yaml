source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ ὁ Ἰησοῦς εἰς τὰ μέρη Καισαρείας τῆς Φιλίππου ἠρώτα τοὺς μαθητὰς αὐτοῦ λέγων· ⸀Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι τὸν υἱὸν τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/013.yaml
  text: When Jesus came into the region of Caesarea Philippi[a], he was asking his disciples, saying[b], “Who do people say the Son of Man is?”
translation:
  language: fr
  text: 'Quand Jésus arriva dans la région de Césarée de Philippe, il demanda à ses disciples : « Qui les gens disent-ils être le Fils de l’homme[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Fils de l’homme » est la manière caractéristique dont Jésus se désigne lui-même ; certains traduisent aussi « l’Être humain » ou « l’Humain ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐλθὼν δὲ ὁ Ἰησοῦς
  choice: Quand Jésus arriva
  rationale: Le participe aoriste introduit la nouvelle scène avec une valeur temporelle. « Quand Jésus arriva » est naturel en français et n’ajoute pas un « maintenant » absent du grec.
- source_word: εἰς τὰ μέρη
  choice: dans la région
  rationale: Le pluriel idiomatique μέρη désigne ici le territoire ou les environs, et non des « parties » au sens littéral.
- source_word: Καισαρείας τῆς Φιλίππου
  choice: Césarée de Philippe
  rationale: Cette forme française usuelle distingue la ville des autres localités nommées Césarée et rend la construction génitive grecque.
- source_word: ἠρώτα
  choice: il demanda
  rationale: L’imparfait grec peut présenter une action en cours, répétée ou simplement située à l’arrière-plan. Dans cette scène, le passé simple français exprime naturellement la question ponctuelle sans imposer artificiellement une répétition.
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: à ses disciples
  rationale: « Disciples » est le terme français établi et exact dans le contexte des Évangiles.
- source_word: λέγων
  choice: ':'
  rationale: Le participe sémitisant « disant » introduit directement les paroles. En français actuel, les deux-points en rendent naturellement la fonction sans lourdeur.
- source_word: Τίνα λέγουσιν οἱ ἄνθρωποι εἶναι
  choice: D’après les gens, qui est
  rationale: Cette formulation française naturelle conserve l’idée de ce que les gens disent tout en évitant le calque moins fluide « Qui les gens disent-ils être… ? ». « Les gens » est générique et non limité aux hommes.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation traditionnelle de Jésus préserve la formulation, les échos bibliques possibles et sa portée théologique sans trancher toutes ses nuances.
theological_decisions:
- issue: Traduction de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Être humain
  rationale: « Le Fils de l’homme » est la désignation consacrée dans les Évangiles et garde notamment la possible résonance de Daniel 7. L’alternative rend davantage la dimension humaine de l’expression, mais atténue ses liens intertextuels et son caractère distinctif.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe du discours indirect a été idiomatisée. Le participe λέγων n’est pas traduit par le lourd « en disant », mais par une ponctuation introductive. La note est attachée à l’expression qu’elle explique.
