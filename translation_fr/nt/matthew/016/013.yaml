- from: 'Quand Jésus arriva dans la région de Césarée de Philippe, il demanda à ses disciples : « D’après les gens, qui est le Fils de l’homme[a] ? »'
  to: 'Quand Jésus arriva dans la région de Césarée de Philippe, il demanda à ses disciples : « Qui les gens disent-ils être le Fils de l’homme[a] ? »'
  rationale: La révision restitue explicitement λέγουσιν par « les gens disent-ils », tout en conservant une construction française fluide. Elle maintient les choix établis pour le lieu, les disciples et le titre « Fils de l’homme ». La note est reformulée afin de signaler les rendus alternatifs sans les présenter comme une interprétation imposée par le contexte.
