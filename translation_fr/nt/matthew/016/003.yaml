revisions:
- from: 'Et le matin : « Aujourd’hui, il y aura de l’orage, car le ciel est rouge et sombre. » Vous savez discerner l’aspect du ciel[a], mais vous n’êtes pas capables de discerner les signes des temps[b].[c]'
  to: 'Et le matin : « Aujourd’hui, il fera mauvais temps, car le ciel est rouge et sombre. » Vous savez discerner l’aspect du ciel[a], mais vous ne pouvez pas discerner les signes des temps[b].[c]'
  rationale: 'La révision remplace une formulation qui assimilait indûment le mauvais temps à un orage par une expression française météorologique large, fidèle à χειμών. Elle allège aussi l’expression de l’incapacité sans modifier le sens. Les autres choix, y compris les notes et leurs ancres, sont conservés : ils rendent le vocabulaire, l’ambiguïté théologique et la variante textuelle de manière adéquate.'
