id: MAT.16.3
reference: Matthew 16:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πρωΐ· Σήμερον χειμών, πυρράζει γὰρ στυγνάζων ὁ οὐρανός. ⸀τὸ μὲν πρόσωπον τοῦ οὐρανοῦ γινώσκετε διακρίνειν, τὰ δὲ σημεῖα τῶν καιρῶν οὐ δύνασθε.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/003.yaml
  text: And in the morning[a], ‘Today, stormy weather, for the sky is red and overcast.’ You know how to discern the appearance of the sky[b], but you are not able to discern the signs of the times.
translation:
  language: fr
  text: 'Et le matin : « Aujourd’hui, il fera mauvais temps, car le ciel est rouge et sombre. » Vous savez discerner l’aspect du ciel[a], mais vous ne pouvez pas discerner les signes des temps[b].[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le visage du ciel ».'
    reason: lexical_alternative
  - marker: b
    text: Les « signes des temps » peuvent désigner le caractère spirituellement décisif du moment présent, notamment les œuvres messianiques de Jésus, sans que l’expression se limite nécessairement à cette seule nuance.
    reason: alternative_reading
  - marker: c
    text: Certains manuscrits anciens omettent la fin du verset 2 et tout le verset 3.
    reason: textual_variant
lexical_decisions:
- source_word: πρωΐ
  choice: le matin
  rationale: Adverbe temporel rendu par une expression française naturelle, en parallèle avec la formule météorologique précédente du contexte.
- source_word: χειμών
  choice: il y aura de l’orage
  rationale: Dans ce contexte, le nom désigne du mauvais temps ou une tempête, et non la saison d’hiver. La tournure verbale restitue naturellement la phrase nominale grecque.
- source_word: πυρράζει
  choice: est rouge
  rationale: Le verbe décrit la couleur rougeâtre du ciel; cette formulation simple convient au langage météorologique courant.
- source_word: στυγνάζων
  choice: sombre
  rationale: Le participe évoque un ciel assombri, morne ou menaçant. « Sombre » reste proche du sens sans ajouter explicitement une menace absente du mot lui-même.
- source_word: πρόσωπον τοῦ οὐρανοῦ
  choice: l’aspect du ciel
  rationale: Littéralement « le visage du ciel »; « l’aspect du ciel » exprime clairement en français son apparence visible.
- source_word: γινώσκετε διακρίνειν
  choice: vous savez discerner
  rationale: La construction exprime une capacité acquise à évaluer ou interpréter; « savez discerner » conserve ses dimensions cognitive et évaluative.
- source_word: σημεῖα
  choice: signes
  rationale: Terme usuel qui préserve la portée probante et révélatrice du mot dans Matthieu.
- source_word: καιρῶν
  choice: des temps
  rationale: Le mot désigne ici des moments ou périodes significatifs plutôt que des saisons météorologiques; la formule conserve son ampleur et sa tension théologique.
- source_word: οὐ δύνασθε
  choice: vous n’êtes pas capables de discerner
  rationale: Cette formulation rend explicitement l’incapacité exprimée par le verbe grec et reprend l’infinitif sous-entendu dans la seconde proposition.
theological_decisions:
- issue: Sens de « les signes des temps »
  choice: Conserver la formule générale « les signes des temps »
  alternative: « les signes de l’époque présente » ou « les signes messianiques de l’âge »
  rationale: La parole reproche aux interlocuteurs de ne pas reconnaître la portée du moment présent et des œuvres de Jésus. Le grec peut inclure une dimension messianique et eschatologique, sans la limiter explicitement à l’une d’elles.
- issue: Incapacité à discerner
  choice: Conserver l’expression explicite de l’incapacité
  alternative: « mais pas les signes des temps »
  rationale: Le grec οὐ δύνασθε affirme une incapacité, et non simplement une omission; la traduction maintient la force du contraste.
translation_notes:
  register: Français international moderne, clair et digne. La formule météorologique est idiomatique; « l’aspect du ciel » évite le calque peu naturel « le visage du ciel », signalé en note. La répétition de « discerner » préserve le contraste rhétorique du grec.
