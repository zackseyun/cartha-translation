id: MAT.16.7
reference: Matthew 16:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ διελογίζοντο ἐν ἑαυτοῖς λέγοντες ὅτι Ἄρτους οὐκ ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/007.yaml
  text: And they were discussing among themselves[a], saying, “We did not bring bread.”
translation:
  language: fr
  text: 'Ils discutaient entre eux et disaient : « Nous n’avons pas emporté de pain[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est parce que nous n’avons pas pris de pain avec nous. »'
    reason: La tournure grecque peut présenter soit simplement le contenu de leur discussion, soit leur explication causale implicite; « pris avec nous » rend aussi plus littéralement le verbe grec.
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ils
  rationale: Le pronom reprend naturellement les disciples dans le récit. Le faible connecteur δέ n’a pas besoin d’être rendu explicitement en français, où « mais » marquerait un contraste excessif.
- source_word: διελογίζοντο
  choice: discutaient
  rationale: L’imparfait grec décrit une délibération en cours. « Discutaient » exprime naturellement l’échange au sein du groupe sans lui donner nécessairement le sens d’une dispute.
- source_word: ἐν ἑαυτοῖς
  choice: entre eux
  rationale: Cette expression situe la discussion à l’intérieur du groupe; « entre eux » est l’équivalent idiomatique en français moderne.
- source_word: λέγοντες
  choice: et disaient
  rationale: Le participe introduit les paroles qui donnent le contenu de leur discussion. La coordination est plus naturelle en français qu’un calque tel que « disant ».
- source_word: ὅτι
  choice: introduction du discours direct
  rationale: ὅτι peut introduire le contenu des propos. Le deux-points et les guillemets rendent cette fonction clairement sans ajouter une relation causale qui demeure seulement possible dans le grec.
- source_word: Ἄρτους
  choice: de pain
  rationale: Bien que le nom grec soit au pluriel (« pains »), il désigne ici les provisions de pain de manière générique; le singulier collectif est idiomatique en français.
- source_word: οὐκ ἐλάβομεν
  choice: nous n’avons pas emporté
  rationale: Dans ce contexte de déplacement et de provisions, λαμβάνω signifie prendre avec soi. « Emporter » communique ce sens plus clairement que le simple « prendre ».
theological_decisions:
- issue: Valeur de ὅτι et rapport causal implicite
  choice: « Nous n’avons pas emporté de pain » comme contenu direct de la discussion
  alternative: « C’est parce que nous n’avons pas emporté de pain »
  rationale: Le grec permet de comprendre ὅτι comme introduisant simplement le contenu des paroles, sans exprimer explicitement « c’est parce que ». La variante est signalée afin de conserver l’ambiguïté syntaxique et l’inférence contextuelle.
translation_notes:
  register: Français moderne, courant et digne. La formulation évite le calque « raisonnaient en eux-mêmes » et conserve le mouvement narratif ainsi que l’ambiguïté possible de ὅτι.
