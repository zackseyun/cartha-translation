id: MAT.16.12
reference: Matthew 16:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε συνῆκαν ὅτι οὐκ εἶπεν προσέχειν ἀπὸ τῆς ζύμης ⸂τῶν ἄρτων⸃ ἀλλὰ ἀπὸ τῆς διδαχῆς τῶν Φαρισαίων καὶ Σαδδουκαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/012.yaml
  text: Then they understood that he had not said to beware of the leaven of bread[a], but of the teaching of the Pharisees and Sadducees.
translation:
  language: fr
  text: Alors ils comprirent qu’il ne leur avait pas dit de se méfier du levain du pain[a], mais de l’enseignement des pharisiens et des sadducéens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «du levain des pains». Le grec emploie ici un nom au pluriel; les mots «des pains» sont placés entre crochets dans l’édition grecque de référence.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français le moment où les disciples parviennent enfin à comprendre.
- source_word: συνῆκαν
  choice: ils comprirent
  rationale: L’aoriste présente ici l’accès à la compréhension; le passé simple convient au registre narratif écrit et reste clair.
- source_word: οὐκ εἶπεν
  choice: il ne leur avait pas dit
  rationale: Le plus-que-parfait situe la parole antérieure par rapport à leur compréhension; «leur» explicite naturellement en français les destinataires déjà donnés par le contexte.
- source_word: προσέχειν ἀπό
  choice: de se méfier de
  rationale: Dans ce contexte d’avertissement, l’expression signifie être sur ses gardes à l’égard de quelque chose. «Se méfier de» est actuel, naturel et fidèle à cette force.
- source_word: τῆς ζύμης
  choice: du levain
  rationale: «Levain» conserve l’image concrète et sa résonance biblique sans l’interpréter davantage.
- source_word: τῶν ἄρτων
  choice: des pains
  rationale: Le pluriel grec est conservé dans le texte français; dans le contexte immédiat des pains emportés ou oubliés, cette formulation demeure intelligible.
- source_word: διδαχῆς
  choice: l’enseignement
  rationale: Terme moderne et accessible qui désigne le contenu enseigné sans la coloration plus technique ou confessionnelle de «doctrine».
- source_word: Φαρισαίων καὶ Σαδδουκαίων
  choice: des pharisiens et des sadducéens
  rationale: Formes françaises usuelles des noms de ces groupes; les minuscules suivent l’usage typographique français pour les membres de groupes religieux.
theological_decisions:
- issue: Portée métaphorique du levain
  choice: 'Conserver «levain» puis reprendre l’explication donnée par le verset: «l’enseignement des pharisiens et des sadducéens».'
  alternative: Développer l’image en «hypocrisie», «influence corruptrice» ou «enseignement corrompu».
  rationale: Le verset identifie le référent de l’image comme l’enseignement, mais n’en précise pas ici davantage la qualité morale. La traduction évite donc d’importer une interprétation issue d’un passage parallèle ou d’une tradition particulière.
translation_notes:
  register: Français international moderne, digne et narratif. La phrase suit de près la structure contrastive grecque tout en employant une syntaxe française naturelle. Le marqueur [a] figure immédiatement après l’expression concernée.
