  text: λέγει αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/015.yaml
  text: He says to them[a], “But who do you say that I am?”
translation:
  language: fr
  text: 'Il leur dit : « Mais vous, qui dites-vous que je suis ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: Il dit
  rationale: Le présent de narration grec est conservé afin de préserver la vivacité du récit; « il leur dit » reste naturel en français narratif.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom au datif pluriel désigne les destinataires de la parole et se rend naturellement par le pronom indirect « leur ».
- source_word: Ὑμεῖς
  choice: vous
  rationale: Le pronom explicite est emphatique. Sa place après « Mais » — « Mais vous » — fait ressortir le contraste avec les opinions rapportées auparavant.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici le contraste entre ce que disent les autres et la réponse personnelle des disciples.
- source_word: τίνα
  choice: qui
  rationale: Le pronom interrogatif porte sur l'identité de Jésus; « qui » est la formulation française idiomatique.
- source_word: με … εἶναι
  choice: que je suis
  rationale: L'accusatif avec infinitif du grec est transposé en proposition complétive, structure naturelle en français, sans changer le sens.
- source_word: λέγετε
  choice: dites-vous
  rationale: Le présent actif à la deuxième personne du pluriel est rendu par une interrogation avec inversion, claire et digne en français moderne.
theological_decisions:
- issue: Accent mis sur la réponse personnelle des disciples
  choice: « Mais vous, qui dites-vous que je suis ? »
  alternative: « Et vous, qui dites-vous que je suis ? »
  rationale: « Mais vous » préserve l'opposition avec les avis précédents et l'emphase du pronom grec, sans anticiper la confession formulée au verset suivant.
translation_notes:
  register: Français moderne international, naturel et digne. L'inversion « dites-vous » convient au registre biblique courant sans être archaïque. La syntaxe grecque littérale (« qui dites-vous que moi être ») n'appelle pas de note, car sa transposition française est directe et n'entraîne pas d'ambiguïté significative.
