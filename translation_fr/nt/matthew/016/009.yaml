  variant: modern international French
source:
  edition: SBLGNT
  text: οὔπω νοεῖτε, οὐδὲ μνημονεύετε τοὺς πέντε ἄρτους τῶν πεντακισχιλίων καὶ πόσους κοφίνους ἐλάβετε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/009.yaml
  text: Do you still not understand[a], nor do you remember the five loaves for the five thousand[b], and how many baskets you gathered?
translation:
  language: fr
  text: Ne comprenez-vous toujours pas et ne vous souvenez-vous pas des cinq pains pour les cinq mille personnes, et de combien de paniers vous avez recueillis[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que vous avez pris ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: toujours pas
  rationale: 'Dans cette question de reproche, « toujours pas » exprime naturellement en français la valeur temporelle de οὔπω : l’incompréhension persiste jusqu’à présent.'
- source_word: νοεῖτε
  choice: comprenez-vous
  rationale: Le verbe désigne ici la compréhension de la portée des événements antérieurs, plutôt qu’une simple perception.
- source_word: οὐδὲ
  choice: Ne vous souvenez-vous pas
  rationale: Deux questions coordonnées rendent en français naturel la seconde négation, tout en conservant le lien étroit entre comprendre et se souvenir.
- source_word: μνημονεύετε
  choice: vous souvenez-vous
  rationale: « Se souvenir » est l’équivalent courant et direct pour le rappel du miracle précédent.
- source_word: τοὺς πέντε ἄρτους
  choice: des cinq pains
  rationale: Dans ce récit, ἄρτοι désigne des pains concrets; « pains » est idiomatique et précis en français.
- source_word: τῶν πεντακισχιλίων
  choice: pour les cinq mille personnes
  rationale: Le génitif renvoie contextuellement aux cinq mille personnes nourries. « Pour » explicite cette relation sans identifier leur sexe, que le verset ne précise pas ici.
- source_word: πόσους κοφίνους
  choice: du nombre de paniers
  rationale: Cette formulation intègre naturellement l’interrogation indirecte après « vous souvenez-vous » et conserve l’image concrète des paniers.
- source_word: ἐλάβετε
  choice: vous avez emportés
  rationale: λαμβάνω signifie fondamentalement prendre ou recevoir. « Emporter » convient au ramassage des paniers dans ce contexte sans ajouter explicitement les restes, absents de ce verset.
theological_decisions: []
translation_notes:
  register: Français international moderne, courant et digne. La coordination grecque a été rendue par deux questions successives, plus naturelles en français. « Toujours pas » maintient la force du reproche, tandis que « personnes » évite d’ajouter une précision de genre absente de l’expression grecque de ce verset.
