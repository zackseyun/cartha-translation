id: MAT.16.19
reference: Matthew 16:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀δώσω σοι τὰς ⸀κλεῖδας τῆς βασιλείας τῶν οὐρανῶν, καὶ ὃ ⸀ἐὰν δήσῃς ἐπὶ τῆς γῆς ἔσται δεδεμένον ἐν τοῖς οὐρανοῖς, καὶ ὃ ⸁ἐὰν λύσῃς ἐπὶ τῆς γῆς ἔσται λελυμένον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/016/019.yaml
  text: I will give you the keys of the kingdom of heaven[a], and whatever you bind on earth will have been bound in heaven[c][b], and whatever you loose on earth will have been loosed in heaven.
translation:
  language: fr
  text: Je te donnerai les clés du royaume des cieux, et tout ce que tu lieras sur la terre aura été lié dans les cieux[a][b], et tout ce que tu délieras sur la terre aura été délié dans les cieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Lier » et « délier » peuvent notamment évoquer le fait d’interdire et de permettre, ou d’imposer et de lever des obligations. La traduction conserve toutefois la métaphore grecque.
    reason: cultural_note
  - marker: b
    text: 'On traduit traditionnellement : « sera lié… sera délié ». La construction grecque peut être rendue plus précisément par : « aura été lié… aura été délié ».'
    reason: alternative_reading
lexical_decisions:
- source_word: δώσω σοι
  choice: Je te donnerai
  rationale: Le futur actif exprime une promesse directe. La construction française avec le pronom indirect « te » est naturelle et fidèle.
- source_word: τὰς κλεῖδας
  choice: les clés
  rationale: Le nom pluriel et sa métaphore sont conservés sans en imposer une interprétation institutionnelle.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: du royaume des cieux
  rationale: Cette formulation française courante conserve le pluriel grec caractéristique de Matthieu et peut désigner le règne ou le royaume de Dieu sans trancher artificiellement entre ces nuances.
- source_word: ὃ ἐὰν δήσῃς
  choice: tout ce que tu lieras
  rationale: La tournure rend naturellement la construction relative indéfinie et conserve la métaphore de lier.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Formulation française idiomatique dans le contraste entre la terre et les cieux.
- source_word: ἔσται δεδεμένον
  choice: aura été lié
  rationale: Le futur de εἰμί accompagné d’un participe parfait passif est rendu par le futur antérieur passif, qui exprime un état futur résultant d’une action accomplie.
- source_word: ὃ ἐὰν λύσῃς
  choice: tout ce que tu délieras
  rationale: « Délier » maintient la symétrie métaphorique avec « lier » et évite de réduire le sens à une seule application telle que permettre ou libérer.
- source_word: ἔσται λελυμένον
  choice: aura été délié
  rationale: Comme dans la proposition parallèle, le futur antérieur passif reflète la construction grecque avec participe parfait.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: dans les cieux
  rationale: Le pluriel du grec est conservé dans une expression française naturelle et cohérente avec « royaume des cieux ».
theological_decisions:
- issue: Rapport entre les décisions terrestres et célestes dans la formule « lier et délier »
  choice: aura été lié… aura été délié
  alternative: sera lié… sera délié
  rationale: Le futur antérieur reflète la forme grecque et laisse entendre que l’action terrestre correspond à un état déjà établi dans les cieux, sans transformer cette implication grammaticale en doctrine confessionnelle explicite.
- issue: Portée des « clés du royaume des cieux »
  choice: Conserver la métaphore des clés
  alternative: Expliciter par « l’autorité d’admettre ou d’exclure » ou « l’autorité d’intendance »
  rationale: L’image suggère une autorité, mais le verset ne l’explicite pas entièrement. Garder la métaphore préserve l’ouverture du texte et évite d’importer un système ecclésiologique particulier.
- issue: Sens de « lier » et « délier »
  choice: Conserver les verbes métaphoriques
  alternative: Traduire directement par « interdire » et « permettre »
  rationale: Ces verbes peuvent avoir une portée juridique ou enseignante, mais le contexte immédiat ne justifie pas de réduire leur sens à une seule interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle et les métaphores de l’original sont maintenues. « Royaume des cieux » et « dans les cieux » conservent naturellement le pluriel grec propre à ce passage.
