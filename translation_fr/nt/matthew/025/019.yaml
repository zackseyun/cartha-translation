id: MAT.25.19
reference: Matthew 25:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μετὰ δὲ ⸂πολὺν χρόνον⸃ ἔρχεται ὁ κύριος τῶν δούλων ἐκείνων καὶ συναίρει ⸂λόγον μετ’ αὐτῶν⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/019.yaml
  text: After a long time[a], the master of those slaves comes and settles accounts with them.
translation:
  language: fr
  text: Longtemps après, le maître de ces esclaves[a] arrive et règle ses comptes avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le seigneur de ces serviteurs ». Le grec κύριος peut signifier « seigneur » ou « maître », et δοῦλοι peut être rendu par « serviteurs » ou « esclaves » ; le texte retient ici le sens socio-économique le plus manifeste dans la parabole.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ δὲ πολὺν χρόνον
  choice: Longtemps après
  rationale: Cette tournure française exprime naturellement la succession temporelle indiquée par μετά avec l’accusatif. La légère transition marquée par δέ n’exige pas ici l’ajout de « mais » ou de « or ».
- source_word: ἔρχεται
  choice: arrive
  rationale: Le présent conserve le présent historique grec et donne au récit sa vivacité. « Arrive » rend naturellement la venue du personnage en français sans ajouter explicitement l’idée d’un retour.
- source_word: ὁ κύριος
  choice: le maître
  rationale: Dans le cadre économique et domestique de la parabole, κύριος désigne celui qui exerce son autorité sur les esclaves. « Maître » convient mieux ici que le titre théologique « Seigneur ».
- source_word: τῶν δούλων ἐκείνων
  choice: de ces esclaves
  rationale: Le rapport d’autorité et la condition servile sont saillants dans la scène. « Esclaves » préserve plus clairement ce statut que « serviteurs », tandis que le démonstratif français « ces » rend naturellement ἐκείνων dans ce rappel narratif.
- source_word: συναίρει λόγον μετ’ αὐτῶν
  choice: règle ses comptes avec eux
  rationale: Cette expression française courante restitue l’idiome grec qui signifie examiner et solder des comptes avec quelqu’un.
theological_decisions:
- issue: Sens de κύριος dans la parabole
  choice: le maître
  alternative: le seigneur
  rationale: Le mot décrit ici le rôle du propriétaire à l’intérieur du récit. Traduire par « maître » évite de transformer implicitement le terme en titre christologique, sans exclure la portée plus large de la parabole.
- issue: Traduction de δοῦλος
  choice: esclaves
  alternative: serviteurs
  rationale: Le contexte met en évidence une relation de maîtrise et de dépendance juridique et économique. « Esclaves » conserve cette réalité sociale, alors que « serviteurs » pourrait l’atténuer.
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif est maintenu. La formulation reste naturelle tout en conservant le vocabulaire social explicite du texte grec.
