id: MAT.25.41
reference: Matthew 25:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· Πορεύεσθε ἀπ’ ἐμοῦ ⸀οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/041.yaml
  text: Then he will also say to those on the left[a], ‘Go away from me, you cursed, into the eternal fire prepared for the devil and his angels.’
translation:
  language: fr
  text: 'Alors il dira aussi à ceux qui seront à sa gauche : « Éloignez-vous de moi, vous qui êtes maudits, et allez dans le feu éternel préparé pour le diable et ses anges. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la succession des actes dans la scène du jugement.
- source_word: ἐρεῖ
  choice: il dira
  rationale: Rend directement le futur de λέγω sans renforcer la portée de l’acte de parole.
- source_word: τοῖς ἐξ εὐωνύμων
  choice: à ceux qui seront à sa gauche
  rationale: Expression idiomatique désignant le groupe placé à la gauche du roi dans le contexte immédiat; le possessif explicite naturellement la relation en français.
- source_word: Πορεύεσθε ἀπ’ ἐμοῦ
  choice: Éloignez-vous de moi
  rationale: Exprime clairement l’ordre de quitter la présence du locuteur; « éloignez-vous » est actuel, digne et plus naturel ici que « retirez-vous ».
- source_word: οἱ κατηραμένοι
  choice: vous qui êtes maudits
  rationale: Rend le participe parfait passif employé comme adresse directe, tout en conservant son état résultant et sans ambiguïté grammaticale.
- source_word: εἰς τὸ πῦρ
  choice: et allez dans le feu
  rationale: Le français demande une articulation explicite après « éloignez-vous de moi »; « dans » conserve l’idée de mouvement vers une destination portée par εἰς.
- source_word: τὸ αἰώνιον
  choice: éternel
  rationale: Rendu français normal de αἰώνιος dans ce contexte eschatologique, sans paraphrase doctrinale supplémentaire.
- source_word: τὸ ἡτοιμασμένον
  choice: préparé
  rationale: 'Conserve la valeur du participe parfait passif: le feu se trouve dans un état résultant d’une préparation antérieure.'
- source_word: τῷ διαβόλῳ
  choice: pour le diable
  rationale: Dans ce contexte, διάβολος est la désignation personnelle établie de l’adversaire, non un simple nom commun signifiant « calomniateur ».
- source_word: τοῖς ἀγγέλοις αὐτοῦ
  choice: ses anges
  rationale: Le contexte du jugement désigne des êtres célestes associés au diable, et non des messagers humains.
theological_decisions:
- issue: Portée de αἰώνιον dans le contexte du jugement
  choice: éternel
  alternative: durable pour un âge / perpétuel
  rationale: « Éternel » correspond à l’usage français courant et au sens contextuel le plus naturel, tout en laissant au texte lui-même sa gravité théologique sans développer un système doctrinal.
- issue: Référents de διάβολος et ἄγγελοι
  choice: le diable et ses anges
  alternative: le calomniateur et ses messagers
  rationale: La scène eschatologique et l’expression conventionnelle indiquent Satan et les êtres angéliques qui lui sont associés; des termes génériques sous-traduiraient ces référents.
translation_notes:
  register: Français international moderne, direct et solennel. La coordination « et allez » est une explicitation syntaxique minimale nécessaire pour rendre naturellement en français le mouvement vers le feu après « Éloignez-vous de moi », sans modifier le contenu de l’ordre.
