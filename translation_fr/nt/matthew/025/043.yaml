id: MAT.25.43
reference: Matthew 25:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ξένος ἤμην καὶ οὐ συνηγάγετέ με, γυμνὸς καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ καὶ οὐκ ἐπεσκέψασθέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/043.yaml
  text: I was a stranger and you did not welcome me[a], naked and you did not clothe me[b], sick and in prison and you did not visit me.
translation:
  language: fr
  text: J’étais étranger et vous ne m’avez pas accueilli[a] ; j’étais nu et vous ne m’avez pas vêtu ; j’étais malade et en prison, et vous ne m’avez pas rendu visite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reçu chez vous ». Le verbe grec signifie littéralement « rassembler », mais il évoque ici l’accueil hospitalier d’un étranger.
    reason: lexical_alternative
  - marker: b
    text: « Rendre visite » peut aussi avoir ici le sens de « s’occuper de » ou « prendre soin de » ; il ne s’agit pas seulement d’une visite sociale.
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένος
  choice: étranger
  rationale: Dans cette liste d’actes de compassion négligés, le terme désigne une personne extérieure au foyer ou au groupe, ayant besoin d’être reçue. « Étranger » conserve cette vulnérabilité sans réduire le sens à une nationalité étrangère.
- source_word: συνηγάγετέ
  choice: accueilli
  rationale: Bien que συνάγω signifie littéralement « rassembler », son emploi avec ξένος évoque ici le fait de recevoir quelqu’un chez soi avec hospitalité. « Accueillir » est naturel et clair en français moderne.
- source_word: γυμνός
  choice: nu
  rationale: Le mot peut désigner la nudité complète ou le manque de vêtements suffisants. « Nu » garde la force et la concision du grec, tandis que l’action correspondante, vêtir, explicite le besoin.
- source_word: περιεβάλετέ
  choice: vêtu
  rationale: Le verbe signifie littéralement mettre quelque chose autour de quelqu’un, d’où « vêtir ». Cette formulation est concise, digne et directement liée à « nu ».
- source_word: ἀσθενής
  choice: malade
  rationale: Le terme peut aussi signifier « faible », mais dans cette énumération de besoins concrets, la maladie physique est le sens contextuel le plus naturel.
- source_word: ἐν φυλακῇ
  choice: en prison
  rationale: φυλακή désigne ici l’état d’emprisonnement. « En prison » est l’équivalent français courant et suffisamment large.
- source_word: ἐπεσκέψασθέ
  choice: rendu visite
  rationale: ἐπισκέπτομαι désigne une visite empreinte d’attention et de sollicitude, et non une simple visite mondaine. « Rendre visite » préserve l’action concrète, avec une note pour signaler la nuance de soin.
theological_decisions:
- issue: Portée de l’action compatissante exprimée par ἐπεσκέψασθέ με
  choice: vous ne m’avez pas rendu visite
  alternative: vous ne vous êtes pas occupés de moi / vous n’avez pas pris soin de moi
  rationale: La traduction retient l’action concrète nommée par le grec sans la réduire à un soin matériel ni à une simple visite sociale. La note conserve la nuance d’attention compatissante.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « j’étais » devant les différents états clarifie la syntaxe française tout en conservant la structure solennelle de l’énumération grecque. Les marqueurs [a] et [b] figurent immédiatement après les expressions qu’ils expliquent.
