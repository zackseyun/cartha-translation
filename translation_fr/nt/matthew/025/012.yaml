  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀμὴν λέγω ὑμῖν, οὐκ οἶδα ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/012.yaml
  text: But he answered[a], ‘Truly I tell you, I do not know you.’
translation:
  language: fr
  text: 'Mais il leur répondit : « Vraiment, je vous le dis, je ne vous connais pas[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ne vous reconnais pas ». Le grec dit plus littéralement « je ne vous connais pas », expression qui peut, dans ce contexte, évoquer une non-reconnaissance sur le plan relationnel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Mais il leur répondit
  rationale: La tournure participiale suivie d’un verbe conjugué est une formule narrative courante. « Il leur répondit » la rend naturellement en français, tandis que « mais » marque le contraste avec la demande précédente. Le complément « leur » explicite les destinataires déjà présents dans le contexte sans changer le sens.
- source_word: Ἀμὴν
  choice: Vraiment
  rationale: Dans la formule solennelle Ἀμὴν λέγω ὑμῖν, « vraiment » est clair en français moderne et conserve la force d’affirmation. « Amen » serait plus formellement proche, mais moins transparent dans le fil du récit.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette formulation idiomatique française préserve l’adresse directe et la solennité de la déclaration.
- source_word: οὐκ οἶδα
  choice: je ne connais pas
  rationale: οἶδα signifie normalement « connaître ». Cette formulation conserve le sens simple du grec ainsi que sa portée relationnelle implicite, sans la développer dans le texte principal.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom grec est un objet de deuxième personne du pluriel. Le français « vous » rend naturellement cette adresse au groupe.
theological_decisions:
- issue: Portée de « je ne vous connais pas » dans la parabole
  choice: Conserver la formulation sobre et relationnellement forte « je ne vous connais pas »
  alternative: « Je ne vous reconnais pas » ou « je n’ai aucune relation avec vous »
  rationale: Dans ce contexte, la phrase exprime l’exclusion et peut évoquer une non-reconnaissance relationnelle. La traduction ne doit toutefois pas transformer cette implication en une affirmation doctrinale plus développée que le texte grec.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste fluide à l’oral comme à l’écrit, et la formule solennelle est rendue sans archaïsme.
