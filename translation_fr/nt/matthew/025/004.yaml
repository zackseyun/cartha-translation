  text: αἱ δὲ φρόνιμοι ἔλαβον ἔλαιον ἐν τοῖς ⸀ἀγγείοις μετὰ τῶν λαμπάδων ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/004.yaml
  text: But the wise took oil in their containers with their lamps[a].
translation:
  language: fr
  text: Mais les prévoyantes prirent, avec leurs lampes, de l’huile dans des récipients[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « torches » au lieu de « lampes » (grec λαμπάδας) ; selon le contexte, le terme peut désigner une torche ou une lampe.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρόνιμοι
  choice: prévoyantes
  rationale: Le terme désigne ici une sagesse pratique, manifestée par l’anticipation. « Prévoyantes » rend naturellement ce trait dans le contexte sans réduire le mot au seul fait d’être préparées.
- source_word: ἔλαβον
  choice: prirent
  rationale: Dans ce récit, le verbe indique qu’elles emportèrent l’huile; « prirent » est idiomatique et fidèle.
- source_word: ἔλαιον
  choice: de l’huile
  rationale: Le grec désigne de l’huile, vraisemblablement de l’huile d’olive, mais le préciser ajouterait un détail non exprimé.
- source_word: ἀγγείοις
  choice: des récipients
  rationale: Le mot grec est générique et ne précise ni la forme ni la matière; « récipients » préserve cette généralité.
- source_word: λαμπάδων
  choice: lampes
  rationale: λαμπάς peut désigner une lampe ou une torche. « Lampes » convient à la présence d’une réserve d’huile et reste l’expression française la plus familière dans cette parabole; l’autre possibilité est signalée en note.
- source_word: ἑαυτῶν
  choice: leurs
  rationale: Le possessif français rend naturellement le pronom réfléchi grec; « leurs propres » serait possible, mais inutilement appuyé ici.
- source_word: μετὰ τῶν λαμπάδων ἑαυτῶν
  choice: avec leurs lampes
  rationale: μετά suivi du génitif exprime l’accompagnement; cette formulation concise indique que les récipients d’huile furent pris en même temps que les lampes.
