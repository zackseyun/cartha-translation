  text: τότε ἠγέρθησαν πᾶσαι αἱ παρθένοι ἐκεῖναι καὶ ἐκόσμησαν τὰς λαμπάδας ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/007.yaml
  text: Then all those virgins got up and trimmed their lamps[a].
translation:
  language: fr
  text: Alors, toutes ces vierges se levèrent et préparèrent leurs lampes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « torches ». Le grec λαμπás peut désigner une lampe ou une torche ; dans ce contexte, la mention de l’huile permet les deux traductions.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la succession des événements dans le récit.
- source_word: ἠγέρθησαν
  choice: se levèrent
  rationale: Dans ce contexte de sommeil, le verbe indique qu’elles se mettent debout; cette formulation reste naturelle et n’impose pas le sens passif «furent réveillées».
- source_word: πᾶσαι αἱ παρθένοι ἐκεῖναι
  choice: toutes ces jeunes filles
  rationale: Dans le cadre de noces de la parabole, παρθένοι désigne les jeunes filles du cortège. «Vierges» serait lexicalement plus explicite, mais moins naturel en français courant pour désigner leur rôle dans le récit.
- source_word: ἐκόσμησαν
  choice: préparèrent
  rationale: κοσμέω signifie ici mettre en ordre ou rendre prêt. «Préparèrent» convient aux lampes sans ajouter des gestes précis, tels que tailler la mèche, que le grec ne détaille pas.
- source_word: λαμπάδας
  choice: lampes
  rationale: λαμπάς peut désigner une lampe ou une torche. La mention de l’huile et de leur préparation favorise «lampes», tout en laissant «torches» comme possibilité en note.
- source_word: ἑαυτῶν
  choice: leurs
  rationale: Le possessif français exprime naturellement ici le génitif réfléchi, sans l’emphase inutile de «leurs propres».
