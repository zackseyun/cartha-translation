source:
  edition: SBLGNT
  text: μέσης δὲ νυκτὸς κραυγὴ γέγονεν· Ἰδοὺ ὁ ⸀νυμφίος, ἐξέρχεσθε εἰς ἀπάντησιν ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/006.yaml
  text: 'But at midnight a cry rang out: ‘Look[b][a], the bridegroom! Come out to meet him.’'
translation:
  language: fr
  text: 'Mais à minuit, un cri retentit : « Voici le marié ! Sortez à sa rencontre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μέσης δὲ νυκτός
  choice: Mais au milieu de la nuit
  rationale: Le génitif avec μέσης νυκτός exprime le moment où l’événement se produit. « Au milieu de la nuit » garde l’image temporelle du grec, tandis que « mais » rend la transition légèrement contrastive de δέ.
- source_word: κραυγὴ γέγονεν
  choice: un cri retentit
  rationale: La tournure annonce la survenue soudaine d’un cri. « Retentit » est naturel en français narratif et restitue sa force sans calquer littéralement γέγονεν.
- source_word: Ἰδού
  choice: Voici
  rationale: Ἰδού attire vivement l’attention sur une présence qui est annoncée. « Voici » est actuel, concis et idiomatique dans cette exclamation.
- source_word: ὁ νυμφίος
  choice: le marié
  rationale: Dans ce cadre nuptial, νυμφίος désigne l’homme qui se marie. « Le marié » est la désignation naturelle en français moderne et préserve l’image de la parabole.
- source_word: ἐξέρχεσθε
  choice: Sortez
  rationale: L’impératif pluriel commande aux personnes qui attendent de sortir. Le français n’exige pas ici de choisir entre les nuances anglaises de « come out » et « go out ».
- source_word: εἰς ἀπάντησιν αὐτοῦ
  choice: à sa rencontre
  rationale: L’expression idiomatique signifie sortir afin d’accueillir ou de rencontrer quelqu’un. « À sa rencontre » est concise et convient au contexte d’un cortège nuptial.
theological_decisions:
- issue: Référent parabolique de νυμφίος
  choice: Traduire simplement par « le marié », sans majuscule interprétative.
  alternative: « le Marié » ou une explicitation christologique
  rationale: Même si le personnage représente Jésus dans l’interprétation de la parabole, le verset demeure au niveau du récit parabolique. La minuscule et l’absence d’explicitation évitent d’introduire l’interprétation dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la soudaineté de l’annonce et le cadre nuptial, sans archaïsme ni explicitation doctrinale.
