  source_fidelity: Le sens de la liste grecque est globalement conservé, y compris l’accent de « eux aussi » et la portée large de διηκονέω. Toutefois, la construction « t’avons-nous vu avoir faim ou soif, être étranger ou nu, malade ou en prison » manque de parallélisme syntaxique en français et rend moins clairement les états prédicatifs successifs.
  naturalness: La formulation proposée est compréhensible, mais « vu … être étranger ou nu, malade ou en prison » est heurté en français moderne. Une série introduite par « alors que tu étais » est plus idiomatique, claire et conserve la question unique du grec.
  terminology: « Seigneur » est approprié pour Κύριε. « un étranger » rend ξένος sans le réduire à une nationalité précise. « t’avoir rendu service » est une expression française naturelle qui maintient le sens concret et suffisamment large de διακονέω; les alternatives de note restent utiles.
