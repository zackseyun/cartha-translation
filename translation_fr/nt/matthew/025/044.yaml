  rationale: La révision corrige le parallélisme de l’énumération par une construction française idiomatique qui rend les états prédicatifs grecs sans en préciser davantage le sens. « T’avoir rendu service » conserve la référence à une aide concrète apportée à la personne, tout en évitant de restreindre διακονέω à un ministère ou à un simple sentiment de sollicitude.
