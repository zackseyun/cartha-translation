id: MAT.25.44
reference: Matthew 25:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται καὶ αὐτοὶ λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ καὶ οὐ διηκονήσαμέν σοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/044.yaml
  text: Then they too will answer, saying, ‘Lord, when did we see you hungry or thirsty or a stranger or naked or sick or in prison, and not serve you?’
translation:
  language: fr
  text: 'Alors, eux aussi répondront : « Seigneur, quand t’avons-nous vu alors que tu avais faim ou soif, que tu étais un étranger ou nu, malade ou en prison, sans t’avoir rendu service[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « prendre soin de toi » ou « te venir en aide » (grec : διακονέω).'
    reason: Alternative lexicale permettant d’expliciter la dimension d’assistance concrète du verbe.
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession dans la scène du jugement.
- source_word: ἀποκριθήσονται καὶ αὐτοὶ
  choice: eux aussi répondront
  rationale: 'Conserve le futur et l’accent inclusif de καὶ αὐτοὶ : ce groupe répond à son tour.'
- source_word: Κύριε
  choice: Seigneur
  rationale: Titre vocatif courant pour κύριος, qui préserve à la fois l’adresse respectueuse et sa portée christologique.
- source_word: πεινῶντα ἢ διψῶντα
  choice: avoir faim ou soif
  rationale: Expression française naturelle pour les participes prédicatifs décrivant l’état de la personne vue.
- source_word: ξένον
  choice: étranger
  rationale: Préserve le sens social large d’une personne étrangère au cercle habituel, sans préciser indûment sa nationalité.
- source_word: γυμνὸν
  choice: nu
  rationale: Rendu direct qui conserve la force lexicale, laquelle peut inclure le fait d’être insuffisamment vêtu dans ce contexte.
- source_word: ἀσθενῆ
  choice: malade
  rationale: Dans cette liste de détresses corporelles et sociales, le sens de maladie est le plus naturel.
- source_word: ἐν φυλακῇ
  choice: en prison
  rationale: Équivalent français direct et idiomatique.
- source_word: οὐ διηκονήσαμέν σοι
  choice: sans te servir
  rationale: Rend la négation liée aux circonstances précédentes avec naturel et conserve la portée générale de διακονέω, qui désigne ici une aide concrète rendue à quelqu’un.
theological_decisions:
- issue: Titre κύριος adressé à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » maintient la forme d’adresse habituelle et la résonance christologique du passage sans explicitation supplémentaire.
- issue: Portée de διακονέω
  choice: te servir
  alternative: prendre soin de toi / te venir en aide
  rationale: « Servir » préserve le lien entre les actes concrets de miséricorde et le service rendu au roi, sans réduire le verbe à une fonction ecclésiale.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « quand t’avons-nous vu avoir faim… » évite de répéter le pronom tout en gardant l’unité syntaxique de la question grecque.
