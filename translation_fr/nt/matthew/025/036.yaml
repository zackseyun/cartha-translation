id: MAT.25.36
reference: Matthew 25:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γυμνὸς καὶ περιεβάλετέ με, ἠσθένησα καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην καὶ ἤλθατε πρός με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/036.yaml
  text: I was naked and you clothed me[a]; I was sick and you visited me[b]; I was in prison and you came to me.
translation:
  language: fr
  text: J’étais nu et vous m’avez vêtu ; j’étais malade et vous m’avez rendu visite[a] ; j’étais en prison et vous êtes venus vers moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous avez pris soin de moi » ; le verbe grec peut désigner une visite faite avec attention et sollicitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: γυμνὸς
  choice: nu
  rationale: « Nu » rend directement l’adjectif grec. Dans ce contexte, il peut aussi évoquer le manque de vêtements convenables, mais l’action parallèle de vêtir permet de conserver le terme concret sans l’expliciter.
- source_word: περιεβάλετέ
  choice: vous m’avez vêtu
  rationale: Le verbe signifie ici mettre des vêtements sur quelqu’un. « Vêtu » est concis, digne et maintient le lien direct avec « nu ».
- source_word: ἠσθένησα
  choice: j’étais malade
  rationale: Le verbe peut désigner plus largement la faiblesse, mais le sens de maladie convient naturellement au contexte d’assistance concrète.
- source_word: ἐπεσκέψασθέ
  choice: vous m’avez rendu visite
  rationale: Cette formulation traduit clairement l’idée de rendre visite, tout en laissant le contexte exprimer la sollicitude que le verbe grec peut comporter.
- source_word: φυλακῇ
  choice: en prison
  rationale: Le nom désigne ici un lieu de détention ; « prison » est le terme français courant et suffisamment large.
- source_word: ἤλθατε πρός με
  choice: vous êtes venus vers moi
  rationale: La formulation suit de près le grec, qui dit simplement « vous êtes venus vers moi », sans ajouter explicitement l’idée d’une visite.
theological_decisions:
- issue: Degré d’explicitation des actes de compassion
  choice: Conserver les actions concrètes « vêtu », « rendu visite » et « venus vers moi » sans les développer en paraphrases pastorales.
  alternative: Traduire par « vous avez pris soin de moi » ou « vous êtes venus me rendre visite ».
  rationale: Le grec présente des gestes simples et tangibles. Une traduction sobre préserve leur force ainsi que la distinction entre rendre visite au malade et venir vers le prisonnier, sans ajouter une interprétation doctrinale ou pastorale.
translation_notes:
  register: Français international moderne, sobre et digne. La structure parallèle du grec est conservée, de même que la répétition de « j’étais » et de « vous m’avez / vous êtes ».
