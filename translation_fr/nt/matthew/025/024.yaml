  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσελθὼν δὲ καὶ ὁ τὸ ἓν τάλαντον εἰληφὼς εἶπεν· Κύριε, ἔγνων σε ὅτι σκληρὸς εἶ ἄνθρωπος, θερίζων ὅπου οὐκ ἔσπειρας καὶ συνάγων ὅθεν οὐ διεσκόρπισας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/024.yaml
  text: Then the one who had received the one talent also came and said[a], ‘Lord, I knew that you are a hard man[b], reaping where you did not sow and gathering where you did not scatter.’
translation:
  language: fr
  text: 'Puis celui qui avait reçu l’unique talent s’approcha lui aussi et dit : « Seigneur, je savais que tu es un homme dur[a] : tu moissonnes là où tu n’as pas semé et tu ramasses là où tu n’as rien répandu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sévère ». Le grec peut désigner quelqu’un de dur, rude ou sévère.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu rassembles de là où tu n’as pas dispersé ». Le grec ne précise pas ce qui a été dispersé.'
    reason: literal_rendering
lexical_decisions:
- source_word: προσελθὼν
  choice: s’approcha
  rationale: Le participe aoriste de προσέρχομαι indique que le serviteur s’avance avant de parler. « S’approcha » rend précisément ce mouvement et reste naturel dans le récit.
- source_word: δὲ καὶ
  choice: Puis ... lui aussi
  rationale: « Puis » marque la progression narrative portée par δέ, tandis que « lui aussi » rend l’ajout exprimé par καί.
- source_word: ὁ τὸ ἓν τάλαντον εἰληφὼς
  choice: celui qui avait reçu l’unique talent
  rationale: La tournure participiale identifie le serviteur par ce qu’il avait reçu. Le plus-que-parfait rend l’antériorité et la pertinence actuelle du parfait grec; « l’unique talent » souligne qu’il s’agit du seul talent qui lui avait été confié.
- source_word: τάλαντον
  choice: talent
  rationale: « Talent » conserve le terme monétaire de la source et l’écho traditionnel de la parabole sans préciser abusivement sa valeur.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » est le correspondant usuel de κύριε et convient ici comme adresse respectueuse au maître de la parabole.
- source_word: ἔγνων σε ὅτι
  choice: je savais que tu es
  rationale: La construction présente la connaissance revendiquée par le serviteur au sujet du caractère du maître. Cette formulation est naturelle en français et ne surinterprète pas l’aoriste comme une découverte ponctuelle.
- source_word: σκληρὸς ἄνθρωπος
  choice: un homme dur
  rationale: « Dur » conserve l’étendue sémantique de σκληρός, qui peut évoquer la dureté ou la sévérité, sans transformer d’emblée l’accusation en jugement explicite de cruauté.
- source_word: θερίζων ὅπου οὐκ ἔσπειρας
  choice: tu moissonnes là où tu n’as pas semé
  rationale: « Moissonner » et « semer » préservent l’image agricole et le parallélisme verbal de la source.
- source_word: συνάγων ὅθεν οὐ διεσκόρπισας
  choice: tu ramasses là où tu n’as rien répandu
  rationale: « Ramasser » convient à la récolte, tandis que « rien répandu » conserve l’absence d’objet explicite dans le grec tout en donnant une phrase française compréhensible. « Là où » rend ici naturellement la provenance exprimée par ὅθεν dans ce contexte.
theological_decisions:
- issue: Valeur de κύριος dans l’adresse parabolique
  choice: Seigneur
  alternative: Maître
  rationale: Le personnage s’adresse au détenteur de l’autorité dans la parabole. « Seigneur » conserve le terme traditionnel et la possible résonance plus large de κύριος, sans imposer une identification théologique au sein même de la réplique.
- issue: Caractérisation du maître par le serviteur
  choice: L’accusation est rapportée comme la perception du serviteur, avec « un homme dur ».
  alternative: « un homme sévère » ou « un homme impitoyable »
  rationale: 'σκληρός comporte une réelle latitude. « Dur » préserve la tension : la traduction ne doit ni approuver l’accusation du serviteur ni l’atténuer.'
- issue: Objet implicite de διεσκόρπισας
  choice: Ne pas préciser « semence », mais rendre l’absence d’objet par « rien ».
  alternative: « là où tu n’as pas répandu de semence »
  rationale: Le contexte agricole permet de comprendre une semence, mais le grec ne la nomme pas. La formulation retenue évite d’ajouter cette interprétation tout en restant idiomatique.
translation_notes:
  register: Français international moderne, narratif et digne. Le tutoiement correspond à l’adresse directe singulière. Le rythme en deux propositions parallèles conserve la force accusatrice de la parole du serviteur; les notes signalent les deux principales ambiguïtés lexicales sans les résoudre dans le texte.
