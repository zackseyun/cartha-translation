  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/046.yaml
  text: And these will go away into eternal punishment[a], but the righteous into eternal life.
translation:
  language: fr
  text: Et ceux-ci s’en iront au châtiment éternel[a], mais les justes à la vie éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon une autre compréhension lexicale, « châtiment pour l’âge »… « vie pour l’âge ». Le sens précis de l’adjectif grec αἰώνιος est discuté dans certains contextes. Ici, le même mot qualifie à la fois le « châtiment » et la « vie » ; la traduction conserve donc le parallélisme en employant « éternel » dans les deux propositions.
    reason: Alternative lexicale et préservation du parallélisme.
lexical_decisions:
- source_word: ἀπελεύσονται
  choice: iront
  rationale: Le futur de ἀπέρχομαι exprime le fait de s’en aller vers une destination. « Iront » est naturel en français avec les compléments introduits par « à » et n’ajoute aucun détail interprétatif.
- source_word: οὗτοι
  choice: ceux-ci
  rationale: Le démonstratif renvoie au groupe décrit juste auparavant et maintient le contraste concis avec « les justes ».
- source_word: κόλασιν
  choice: châtiment
  rationale: Dans ce contexte de jugement, κόλασις désigne une conséquence punitive. « Châtiment » convient au registre biblique tout en restant compréhensible en français moderne.
- source_word: αἰώνιον
  choice: éternel
  rationale: Le même adjectif qualifie le châtiment et la vie. Employer « éternel » dans les deux propositions préserve le parallélisme grec; l’autre possibilité lexicale est signalée en note.
- source_word: δίκαιοι
  choice: les justes
  rationale: L’adjectif substantivé désigne ceux qui sont caractérisés ou reconnus comme justes. « Les justes » est l’expression française habituelle et conserve la portée morale du terme.
- source_word: ζωὴν
  choice: vie
  rationale: « Vie » est l’équivalent direct et naturel de ζωή dans ce contexte.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque ici le contraste entre les deux groupes et leurs destinations respectives.
theological_decisions:
- issue: Sens de αἰώνιον dans les expressions parallèles κόλασιν αἰώνιον et ζωὴν αἰώνιον
  choice: Traduire αἰώνιον par « éternel » dans les deux propositions
  alternative: « d’une durée d’âge » ou « du monde à venir »
  rationale: La répétition du même adjectif impose de conserver la symétrie entre « châtiment » et « vie », sans attribuer silencieusement une portée différente aux deux occurrences. « Éternel » est la formulation française la plus naturelle dans ce contexte, tandis que le débat lexical est indiqué en note.
translation_notes:
  register: Français moderne, international et digne. La formulation reste concise et conserve la structure antithétique du grec. « Châtiment » a été préféré à « punition » pour son adéquation au contexte solennel de jugement, sans introduire de précision doctrinale supplémentaire.
