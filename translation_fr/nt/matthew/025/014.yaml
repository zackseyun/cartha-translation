id: MAT.25.14
reference: Matthew 25:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὥσπερ γὰρ ἄνθρωπος ἀποδημῶν ἐκάλεσεν τοὺς ἰδίους δούλους καὶ παρέδωκεν αὐτοῖς τὰ ὑπάρχοντα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/014.yaml
  text: For it is like a man going on a journey[a], who called his own slaves and entrusted his possessions to them.
translation:
  language: fr
  text: 'Car ce sera comme un homme qui partait en voyage : il appela ses propres esclaves[a] et leur confia ses biens.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le grec doulos peut désigner un serviteur ou un esclave selon le contexte ; « esclaves » est retenu ici parce que la possession et l’autorité du maître sont mises en avant.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Car ce sera comme
  rationale: La tournure introduit une comparaison explicative liée au contexte précédent. Le futur « ce sera » est suppléé naturellement en français d’après le verbe directeur du verset 1, dont cette comparaison prolonge la construction.
- source_word: ἄνθρωπος ἀποδημῶν
  choice: un homme qui, partant en voyage
  rationale: ἄνθρωπος désigne ici le personnage masculin de la parabole, et ἀποδημῶν son départ vers un autre lieu, sans qu’il soit nécessaire de préciser qu’il va à l’étranger.
- source_word: ἐκάλεσεν
  choice: appela
  rationale: Rend directement l’action de faire venir les esclaves auprès de lui; « convoqua » serait possible, mais plus administratif.
- source_word: τοὺς ἰδίους δούλους
  choice: ses propres esclaves
  rationale: δοῦλος désigne ici des personnes placées sous l’autorité et la possession du maître; ἰδίους renforce le lien d’appartenance. Une note conserve les équivalents français moins explicites.
- source_word: παρέδωκεν αὐτοῖς
  choice: leur confia
  rationale: Dans ce contexte de gestion responsable, « confia » exprime idiomatiquement la remise de biens à administrer, tout en gardant l’idée de transmission portée par παραδίδωμι.
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: ses biens
  rationale: La substantivation désigne ce qui lui appartient. « Ses biens » est naturel, précis et adapté au cadre économique de la parabole.
theological_decisions:
- issue: Traduction de δοῦλος dans le cadre domestique de la parabole
  choice: esclaves
  alternative: serviteurs; serviteurs asservis
  rationale: Le rapport de propriété et l’autorité du maître sont saillants. « Esclaves » ne masque pas le statut social exprimé par δοῦλος, tandis que la note signale l’étendue possible du terme.
- issue: Complément implicite de ὥσπερ
  choice: ce sera comme
  alternative: c’est comme; de même qu’un homme
  rationale: Le grec est elliptique et dépend du contexte antérieur (« le royaume des cieux sera comparable à… », v. 1). Le futur rend ce lien sans identifier explicitement dans ce seul verset le référent théologique de la comparaison.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la liaison explicative avec le contexte et la structure narrative du grec, tout en employant l’idiome naturel « confier ses biens ».
