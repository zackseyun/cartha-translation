id: MAT.25.22
reference: Matthew 25:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσελθὼν ⸀δὲ καὶ ὁ τὰ δύο ⸀τάλαντα εἶπεν· Κύριε, δύο τάλαντά μοι παρέδωκας· ἴδε ἄλλα δύο τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/022.yaml
  text: Then the one who had received the two talents also came forward and said[a], ‘Lord, you handed over to me two talents. Look[b], I gained two more talents.’
translation:
  language: fr
  text: 'Puis celui qui avait reçu les deux talents s’avança lui aussi et dit : « Seigneur[a], tu m’as remis deux talents. Regarde, j’en ai gagné deux autres[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Maître ». Le titre grec kyrios, souvent traduit par « Seigneur », peut aussi servir ici d’adresse respectueuse à un maître.
    reason: alternative_reading
  - marker: b
    text: Un talent était une très grande unité de poids et de valeur monétaire, et non une aptitude naturelle.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: s’avança
  rationale: Le participe aoriste de προσέρχομαι décrit l’approche du serviteur venu présenter son compte; « s’avança » est naturel dans cette scène.
- source_word: δὲ καὶ
  choice: Puis ... lui aussi
  rationale: Cette formulation exprime à la fois la progression du récit et l’ajout de ce serviteur au précédent.
- source_word: ὁ τὰ δύο τάλαντα
  choice: celui qui avait reçu les deux talents
  rationale: La tournure grecque identifie le serviteur par la somme qui lui avait été confiée; « avait reçu » explicite naturellement ce que le contexte indique.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif κύριε signifie couramment « Seigneur »; dans le cadre de la parabole, il peut aussi être une adresse respectueuse au maître.
- source_word: παρέδωκας
  choice: tu m’as remis
  rationale: παραδίδωμι désigne l’action de remettre ou confier quelque chose. « Remis » conserve cette image concrète sans surinterpréter.
- source_word: ἴδε
  choice: Regarde
  rationale: L’interjection attire directement l’attention sur le résultat obtenu; « Regarde » en restitue la force en français moderne.
- source_word: ἄλλα δύο τάλαντα
  choice: deux autres
  rationale: Avec le numéral, ἄλλα indique une quantité supplémentaire égale; le pronom « en » permet une expression française fluide sans répéter « talents ».
- source_word: ἐκέρδησα
  choice: j’en ai gagné
  rationale: κερδαίνω signifie gagner, obtenir un bénéfice. « Gagner » préserve le sens commercial sans préciser la méthode.
- source_word: τάλαντα
  choice: talents
  rationale: Le talent était une très grande unité de poids et de valeur monétaire. Le terme traditionnel est conservé, avec une note pour éviter le sens moderne d’aptitude naturelle.
theological_decisions:
- issue: Traduction de κύριος comme adresse dans une parabole
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » rend directement κύριος et maintient sa portée habituelle, tandis qu’une note préserve la possibilité contextuelle d’une adresse respectueuse à un maître sans imposer une lecture théologique.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe narrative reste simple; « s’avança » rend l’approche formelle, tandis que « Regarde » conserve la vivacité de l’adresse directe.
