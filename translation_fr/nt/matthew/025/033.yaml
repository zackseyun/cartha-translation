  text: καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ τὰ δὲ ἐρίφια ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/033.yaml
  text: And he will place the sheep at his right hand[b][a], but the goats at the left.
translation:
  language: fr
  text: Il placera les moutons à sa droite[b], mais les chevreaux[a] à sa gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les jeunes chèvres ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit littéralement : « du côté droit … du côté gauche », une expression qui désigne le placement à droite et à gauche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στήσει
  choice: placera
  rationale: Le futur actif de ἵστημι est ici transitif et signifie faire tenir à une place déterminée. « Placera » est naturel et précis dans cette scène de jugement.
- source_word: πρόβατα
  choice: les brebis
  rationale: πρόβατα désigne ici les moutons du troupeau. « Les brebis », terme traditionnel mais toujours courant dans cette image pastorale, marque clairement le contraste avec les chevreaux.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: à sa droite
  rationale: Dans ce contexte de placement, ἐκ + génitif constitue un idiome indiquant le côté droit. « À sa droite » rend naturellement la relation spatiale sans expliciter une valeur symbolique.
- source_word: ἐρίφια
  choice: les chevreaux
  rationale: ἐρίφια désigne plus précisément de jeunes chèvres ou des chevreaux. Le français permet de conserver naturellement cette nuance lexicale.
- source_word: ἐξ εὐωνύμων
  choice: à sa gauche
  rationale: L'expression idiomatique désigne le côté gauche. Le possessif, implicite dans le grec par parallélisme avec αὐτοῦ, est explicité en français pour assurer une formulation équilibrée et claire.
- source_word: μὲν ... δὲ
  choice: …, mais …
  rationale: La construction corrélative oppose les deux groupes. Une coordination avec « mais » restitue clairement ce contraste en français moderne.
theological_decisions:
- issue: Faut-il expliciter la portée symbolique de la droite et de la gauche ?
  choice: 'Conserver uniquement le positionnement spatial : « à sa droite … à sa gauche »'
  alternative: Développer en « à la place d'honneur … à la place de défaveur »
  rationale: Le verset décrit directement une disposition spatiale. Sa valeur favorable ou défavorable ressort du contexte du jugement ; l'intégrer au texte traduirait une interprétation plutôt que les mots du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La structure brève et contrastive du grec est conservée. « Chevreaux » maintient la nuance d'âge de ἐρίφια sans ambiguïté en français.
