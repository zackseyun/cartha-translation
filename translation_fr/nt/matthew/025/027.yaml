id: MAT.25.27
reference: Matthew 25:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔδει ⸂σε οὖν⸃ βαλεῖν ⸂τὰ ἀργύριά⸃ μου τοῖς τραπεζίταις, καὶ ἐλθὼν ἐγὼ ἐκομισάμην ἂν τὸ ἐμὸν σὺν τόκῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/027.yaml
  text: Therefore[a], you should have deposited my money with the bankers, and when I came, I would have received what was mine with interest.
translation:
  language: fr
  text: Tu aurais donc dû déposer mon argent[a] chez les banquiers et, à mon retour, j’aurais récupéré ce qui m’appartenait, avec les intérêts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : mes pièces d’argent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδει σε
  choice: Tu aurais dû
  rationale: L’imparfait impersonnel de δέω exprime ici ce qui aurait été requis dans le passé. Cette tournure française naturelle conserve la force du reproche.
- source_word: οὖν
  choice: donc
  rationale: La conjonction introduit la conséquence logique de l’accusation précédente; « donc » est clair et idiomatique.
- source_word: βαλεῖν
  choice: déposer
  rationale: Bien que βάλλω signifie littéralement « mettre », la présence des banquiers et des intérêts indique ici un dépôt d’argent.
- source_word: τὰ ἀργύριά μου
  choice: mon argent
  rationale: ἀργύριον peut désigner l’argent métal, des pièces d’argent ou, plus généralement, de l’argent. Dans ce contexte commercial, « mon argent » communique naturellement le sens fonctionnel tout en laissant une variante plus concrète en note.
- source_word: τοῖς τραπεζίταις
  choice: chez les banquiers
  rationale: τραπεζίτης désigne une personne qui pratique des opérations bancaires ou le change. La mention des intérêts favorise ici « banquiers »; « chez » convient idiomatiquement à l’idée de dépôt.
- source_word: ἐλθὼν ἐγὼ
  choice: à mon retour
  rationale: Le participe aoriste situe le recouvrement au moment de la venue du maître. « À mon retour » exprime naturellement cette relation temporelle dans le cadre de la parabole.
- source_word: ἐκομισάμην ἂν
  choice: j’aurais récupéré
  rationale: Le moyen de κομίζω peut signifier recevoir ou reprendre pour soi. Associé à ἄν, il exprime ici un résultat irréel dans le passé; le conditionnel passé français le rend précisément.
- source_word: τὸ ἐμὸν
  choice: ce qui m’appartenait
  rationale: Le possessif substantivé met l’accent sur le bien propre du maître. Cette formulation est naturelle et conserve cette insistance.
- source_word: σὺν τόκῳ
  choice: avec les intérêts
  rationale: τόκος désigne ici le rendement d’un dépôt monétaire. « Intérêts » est le terme financier moderne neutre, sans la connotation péjorative de « usure ».
theological_decisions:
- issue: Langage financier de la parabole et possible lecture morale de la perception d’intérêts
  choice: Rendre directement et neutralement les termes financiers comme éléments de l’image parabolique.
  alternative: Employer « usure » afin d’évoquer les débats moraux traditionnels sur le prêt à intérêt.
  rationale: Le verset recourt au langage économique pour développer la parabole, sans formuler ici une approbation ni une condamnation générale du prêt à intérêt. Une traduction neutre évite d’importer un débat théologique ultérieur.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse d’un maître à son serviteur dans la parabole. Le conditionnel passé conserve le caractère contrefactuel du reproche.
