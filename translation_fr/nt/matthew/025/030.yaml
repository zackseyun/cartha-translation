id: MAT.25.30
reference: Matthew 25:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸν ἀχρεῖον δοῦλον ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/030.yaml
  text: And throw the worthless slave into the outer darkness[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: fr
  text: Et jetez l’esclave bon à rien dans les ténèbres du dehors[a]. Là, il y aura des pleurs et des grincements de dents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot grec doulos peut désigner un serviteur ou un esclave ; « esclave » est retenu ici parce que la condition de dépendance envers le maître est importante dans le cadre de la parabole.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀχρεῖον
  choice: bon à rien
  rationale: Dans l’évaluation du maître, l’esclave ne s’est montré d’aucune utilité. « Bon à rien » restitue naturellement en français moderne la sévérité de l’expression, sans recourir au plus ancien « inutile » ni introduire l’idée spécifiquement économique de « non rentable ».
- source_word: δοῦλον
  choice: esclave
  rationale: Dans le cadre social de la parabole, il s’agit d’un homme placé sous l’autorité et la possession d’un maître. « Esclave » rend plus précisément cette condition que « serviteur », tout en laissant une note signaler l’autre traduction possible selon le contexte.
- source_word: ἐκβάλετε
  choice: jetez
  rationale: L’impératif aoriste exprime une expulsion énergique. « Jetez » conserve cette force et reste direct et naturel en français.
- source_word: σκότος τὸ ἐξώτερον
  choice: les ténèbres du dehors
  rationale: Cette formulation rend l’obscurité située à l’extérieur et souligne l’exclusion du lieu de faveur ou de fête. Elle conserve aussi le caractère reconnaissable de la formule récurrente chez Matthieu.
- source_word: ἐκεῖ
  choice: Là
  rationale: L’adverbe renvoie directement au lieu qui vient d’être nommé. « Là » est précis, naturel et évite une explicitation absente du grec.
- source_word: κλαυθμὸς
  choice: des pleurs
  rationale: « Pleurs » exprime le chagrin sans préciser excessivement son intensité et correspond à la formule récurrente de Matthieu.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: des grincements de dents
  rationale: Expression française consacrée qui conserve l’image d’angoisse et/ou de rage sans imposer une seule valeur émotionnelle.
theological_decisions:
- issue: Nature de l’image du jugement dans la parabole
  choice: Conserver les images d’exclusion, de pleurs et de grincements de dents sans préciser davantage la nature du châtiment.
  alternative: Identifier explicitement les ténèbres à l’enfer ou, à l’inverse, à une exclusion seulement temporelle ou métaphorique.
  rationale: Le verset emploie le langage matthéen du jugement, mais ne développe pas ici sa nature. La traduction garde donc l’image et la tension théologique du texte sans y insérer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, direct et digne. La phrase conserve la vigueur de l’ordre, la formule imagée propre à Matthieu et le parallélisme de la conclusion. « Bon à rien » est courant et sévère sans être archaïque.
