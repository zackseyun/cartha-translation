  text: ⸀ὡσαύτως ὁ τὰ δύο ⸀ἐκέρδησεν ἄλλα δύο·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/017.yaml
  text: Likewise[a], the one with the two gained two more.
translation:
  language: fr
  text: De même[a], celui qui en avait deux en gagna deux autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pareillement, celui qui avait reçu les deux en gagna deux autres. »'
    reason: Variante lexicale et explicitation possible de l’ellipse grecque.
lexical_decisions:
- source_word: ὡσαύτως
  choice: De même
  rationale: Cet adverbe relie l’action de ce serviteur à celle du précédent et conserve clairement la valeur comparative du grec.
- source_word: ὁ τὰ δύο
  choice: celui qui en avait deux
  rationale: La tournure grecque est elliptique et désigne le serviteur caractérisé par les deux talents mentionnés dans le contexte. Le pronom « en » rend cette ellipse naturellement en français sans ajouter explicitement qu’il les avait reçus.
- source_word: ἐκέρδησεν
  choice: gagna
  rationale: Dans ce contexte financier, « gagna » exprime l’obtention d’une somme supplémentaire sans suggérer aussi fortement un salaire que « mérita » ou « toucha ».
- source_word: ἄλλα δύο
  choice: deux autres
  rationale: Cette expression indique deux unités supplémentaires de même nature et constitue une formulation française claire et courante.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. La formulation conserve l’ellipse du grec tout en restant naturelle dans le contexte de la parabole.
