  verdict: revise
  source_fidelity: La formule « sera semblable à » rend bien, en français idiomatique, le futur passif ὁμοιωθήσεται; la note peut signaler la nuance passive. « Sortirent à la rencontre de l’époux » restitue fidèlement ἐξῆλθον εἰς ὑπάντησιν τοῦ νυμφίου. En revanche, « jeunes filles vierges » ajoute une précision d’âge que παρθένοις n’exprime pas nécessairement et alourdit inutilement le français.
  naturalness: Le texte est globalement clair et de registre biblique moderne. « Dix vierges » est à la fois plus direct, plus naturel dans ce contexte scripturaire et moins redondant que « dix jeunes filles vierges ».
  terminology: « Royaume des cieux », « vierges », « lampes » et « époux » sont des équivalents stables et appropriés. La note a doit éviter de présenter « sera rendu semblable à » comme une littéralité française ou grecque établie.
