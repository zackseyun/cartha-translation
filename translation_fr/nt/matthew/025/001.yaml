  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε ὁμοιωθήσεται ἡ βασιλεία τῶν οὐρανῶν δέκα παρθένοις, αἵτινες λαβοῦσαι τὰς λαμπάδας ⸀ἑαυτῶν ἐξῆλθον εἰς ⸀ὑπάντησιν τοῦ νυμφίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/001.yaml
  text: Then the kingdom of heaven will be like ten virgins[c][b][a], who took their lamps and went out to meet the bridegroom.
translation:
  language: fr
  text: Alors, le royaume des cieux sera semblable[a] à dix vierges qui prirent leurs lampes[b] et sortirent à la rencontre de l’époux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera comparé à ». Le verbe grec est au passif.
    reason: lexical_alternative
  - marker: b
    text: Ou « torches ». Le terme grec peut désigner une source de lumière portative employée dans une procession.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque le lien temporel et discursif avec le contexte précédent dans un français naturel.
- source_word: ὁμοιωθήσεται
  choice: sera semblable
  rationale: Rend naturellement la formule comparative au futur; la forme passive grecque est signalée en note.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Expression matthéenne consacrée qui reproduit le pluriel du grec et reste courante en français biblique.
- source_word: δέκα παρθένοις
  choice: dix jeunes filles vierges
  rationale: Exprime clairement à la fois l’âge et le statut suggérés par παρθένος, sans recourir au substantif isolé « vierges », plus marqué en français actuel.
- source_word: λαβοῦσαι
  choice: qui prirent
  rationale: Le participe aoriste, antérieur au verbe principal, est rendu par une proposition relative fluide en français.
- source_word: τὰς λαμπάδας ἑαυτῶν
  choice: leurs lampes
  rationale: « Lampes » est une équivalence traditionnelle et plausible; « torches » demeure possible dans le cadre d’une procession et figure en note.
- source_word: ἐξῆλθον εἰς ὑπάντησιν
  choice: sortirent à la rencontre
  rationale: Rend le déplacement vers l’extérieur et la tournure grecque exprimant la rencontre intentionnelle.
- source_word: τοῦ νυμφίου
  choice: de l’époux
  rationale: Désigne l’homme qui se marie et préserve le registre nuptial; « époux » est digne et naturel dans ce contexte.
theological_decisions:
- issue: Formule de comparaison parabolique
  choice: le royaume des cieux sera semblable à
  alternative: le royaume des cieux sera comparé à
  rationale: La formulation principale privilégie un français idiomatique tout en gardant le futur. Une note préserve la valeur passive explicite du grec sans déterminer de manière excessive la portée exacte de la comparaison.
- issue: Sens de παρθένοις
  choice: jeunes filles vierges
  alternative: vierges; jeunes filles non mariées
  rationale: La traduction conserve la précision lexicale relative à la virginité dans le cadre nuptial, sans la réduire au seul état matrimonial.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit parabolique écrit; « époux » maintient sobrement l’imagerie nuptiale.
