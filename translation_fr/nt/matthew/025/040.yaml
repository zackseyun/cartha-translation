reference: Matthew 25:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/040.yaml
  text: And the King will answer them[a], ‘Truly I say to you, insofar as you did it to one of the least of these brothers of mine[b], you did it to me.’
translation:
  language: fr
  text: 'Et le Roi leur répondra : « Vraiment[a], je vous le dis, dans la mesure où vous l’avez fait à l’un de ces plus petits de mes frères[b], c’est à moi que vous l’avez fait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Amen, je vous le dis. »'
    reason: lexical_alternative
  - marker: b
    text: « Frères » traduit le terme grec masculin pluriel. L’expression « ces plus petits de mes frères » peut désigner spécifiquement les disciples de Jésus, les croyants en général ou, selon une autre lecture, plus largement les personnes vulnérables. La traduction conserve la formulation sans trancher la question.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἐρεῖ
  choice: leur répondra
  rationale: Le participe aoriste associé au futur de λέγω forme naturellement en français une seule action de réponse, sans reproduire lourdement « répondant, il leur dira ».
- source_word: ὁ βασιλεὺς
  choice: le Roi
  rationale: Le titre explicite est conservé. La majuscule signale ici la figure royale et judiciaire du cadre eschatologique de la parabole, sans remplacer le titre par une interprétation.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Vraiment, je vous le dis
  rationale: Cette formulation actuelle et solennelle rend la force affirmative de Ἀμήν tout en conservant la formule caractéristique de Jésus.
- source_word: ἐφ’ ὅσον
  choice: dans la mesure où
  rationale: Cette expression restitue l’idée d’étendue ou de mesure portée par la locution grecque, sans la transformer en une proposition relative plus libre.
- source_word: ἐποιήσατε
  choice: vous l’avez fait
  rationale: Le pronom reprend les actes décrits dans le contexte. Le passé composé est idiomatique en français et la répétition du verbe préserve le parallélisme grec.
- source_word: ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων
  choice: à l’un des plus petits parmi ces frères qui sont les miens
  rationale: La formulation conserve l’individualisation de ἑνί, le superlatif τῶν ἐλαχίστων, le masculin pluriel ἀδελφῶν et la relation personnelle exprimée par μου, tout en restant intelligible en français.
- source_word: ἐμοὶ
  choice: c’est à moi
  rationale: La tournure détachée met en relief le pronom grec emphatique et maintient l’identification saisissante entre l’acte accompli envers les frères et l’acte accompli envers le Roi.
theological_decisions:
- issue: Référent de « ces frères qui sont les miens »
  choice: Conserver l’expression sans identifier davantage le groupe.
  alternative: Préciser qu’il s’agit des disciples de Jésus, de l’ensemble des croyants, ou plus largement des personnes vulnérables.
  rationale: Le verset ne tranche pas explicitement entre ces lectures. La traduction maintient donc l’ambiguïté et la tension interprétative du texte.
- issue: Genre de ἀδελφῶν
  choice: frères
  alternative: frères et sœurs ; membres de ma famille
  rationale: Le terme source est un masculin pluriel. Comme l’étendue référentielle du groupe demeure discutée, une expansion inclusive introduirait ici une décision que le grec n’explicite pas.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le parallélisme de la déclaration grecque, tandis que « parmi ces frères qui sont les miens » évite une construction française artificielle et préserve l’accent possessif ainsi que l’ambiguïté du référent.
