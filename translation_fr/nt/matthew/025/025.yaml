id: MAT.25.25
reference: Matthew 25:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ φοβηθεὶς ἀπελθὼν ἔκρυψα τὸ τάλαντόν σου ἐν τῇ γῇ· ἴδε ἔχεις τὸ σόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/025.yaml
  text: And being afraid[a], I went away and hid your talent in the ground. Look, you have what is yours.
translation:
  language: fr
  text: 'Pris de peur, je suis allé cacher ton talent[a] dans la terre. Regarde : tu as ce qui est à toi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une forte somme d’argent » ; le talent était une unité de poids et de valeur monétaire élevée, et non une aptitude naturelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: φοβηθεὶς
  choice: Pris de peur
  rationale: Le participe aoriste de φοβέομαι exprime ici la circonstance et le motif invoqué par le serviteur. « Pris de peur » conserve cette valeur participiale sans transformer la peur en crainte révérencielle.
- source_word: ἀπελθὼν
  choice: je suis allé
  rationale: Le participe aoriste précède ἔκρυψα et marque le déplacement antérieur à l’action de cacher. La coordination naturelle en français, « je suis allé cacher », restitue clairement la séquence.
- source_word: ἔκρυψα
  choice: cacher
  rationale: κρύπτω signifie cacher ou dissimuler. La mention de la terre indique le mode de dissimulation sans qu’il soit nécessaire de rendre le verbe lui-même par « enterrer ».
- source_word: τὸ τάλαντόν σου
  choice: ton talent
  rationale: τάλαντον désigne ici une unité de poids et de valeur monétaire élevée. Le terme historique français « talent » convient au cadre de la parabole, mais une note prévient son interprétation moderne comme aptitude naturelle.
- source_word: ἐν τῇ γῇ
  choice: dans la terre
  rationale: γῆ désigne ici la terre comme lieu où la somme a été cachée. « Dans la terre » est clair et naturel dans ce contexte.
- source_word: ἴδε
  choice: Regarde
  rationale: L’impératif sert à attirer l’attention du maître sur ce qui lui est rendu. « Regarde » est direct et actuel, contrairement à l’archaïque « voici » employé comme interjection solennelle.
- source_word: ἔχεις τὸ σόν
  choice: tu as ce qui est à toi
  rationale: L’expression grecque est elliptique et insiste sur la propriété du maître. Cette formulation conserve cette insistance et la prétention du serviteur à rendre simplement ce qui appartenait déjà au maître.
theological_decisions:
- issue: Sens de τάλαντον dans une parabole souvent associée, par extension ultérieure, aux aptitudes naturelles
  choice: Conserver « talent » dans le texte en précisant en note son sens monétaire historique.
  alternative: une forte somme d’argent
  rationale: Le grec désigne une unité de poids et de valeur, non une aptitude innée. Le terme historique maintient la couleur du récit, tandis que la note empêche un contresens théologique ou moral fondé sur le sens français moderne.
translation_notes:
  register: Français international moderne, clair et digne. La construction « Pris de peur » garde la subordination participiale du grec, tandis que « je suis allé cacher » produit une séquence idiomatique. Le deux-points après « Regarde » rend naturellement l’appel d’attention suivi de la déclaration.
