  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀πορευθεὶς ὁ τὰ πέντε τάλαντα λαβὼν ἠργάσατο ἐν αὐτοῖς καὶ ⸀ἐκέρδησεν ἄλλα ⸀πέντε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/016.yaml
  text: The one who had received the five talents went and worked with them[b][a], and gained another five.
translation:
  language: fr
  text: Celui qui avait reçu les cinq talents[a] partit, les fit fructifier[b] et en gagna cinq autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un talent était une importante unité de poids et de monnaie, et non une aptitude naturelle.
    reason: cultural_note
  - marker: b
    text: 'Littéralement : « travailla avec eux »; le grec évoque l’emploi actif de l’argent afin d’en tirer un profit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: partit
  rationale: Le participe aoriste marque ici une action qui précède et accompagne l’action principale. « Partit » est naturel en français et n’ajoute pas l’idée de promptitude, absente du grec.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: Celui qui avait reçu les cinq talents
  rationale: Cette formulation rend naturellement la construction participiale substantivée et situe la réception avant l’action racontée.
- source_word: τάλαντα
  choice: talents
  rationale: Le terme traditionnel est conservé, tandis qu’une note précise qu’il s’agit ici d’une importante unité monétaire et non d’une aptitude naturelle.
- source_word: ἠργάσατο ἐν αὐτοῖς
  choice: les fit fructifier
  rationale: L’expression grecque décrit l’emploi actif de l’argent en vue d’un profit. « Les fit fructifier » est idiomatique en français dans un contexte financier, sans imposer une méthode commerciale précise.
- source_word: ἐκέρδησεν
  choice: gagna
  rationale: Le verbe exprime l’obtention d’un gain ou d’un bénéfice; « gagna » convient naturellement au contexte.
- source_word: ἄλλα πέντε
  choice: cinq autres
  rationale: Cette tournure concise conserve le sens additif de l’expression grecque.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le vocabulaire traditionnel « talents » est maintenu avec une explication culturelle; l’expression financière « les fit fructifier » évite l’ambiguïté peu naturelle de « travailla avec eux » en français.
