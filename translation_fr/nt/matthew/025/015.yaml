id: MAT.25.15
reference: Matthew 25:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ᾧ μὲν ἔδωκεν πέντε τάλαντα ᾧ δὲ δύο ᾧ δὲ ἕν, ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν, καὶ ἀπεδήμησεν. εὐθέως
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/015.yaml
  text: And to one he gave five talents[a], to another two, and to another one, to each according to his own ability[b]; and he went away immediately.
translation:
  language: fr
  text: À l’un, il donna cinq talents[a], à un autre deux, et à un autre un seul, à chacun selon sa propre capacité. Puis il partit en voyage. Aussitôt[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Un talent était une très grande unité de poids ou de valeur monétaire, et non une aptitude naturelle au sens moderne du mot.
    reason: Clarification lexicale nécessaire pour éviter un faux sens courant en français.
  - marker: b
    text: 'On peut aussi rattacher « aussitôt » à ce qui précède : « Puis il partit aussitôt en voyage. »'
    reason: L’absence de ponctuation dans les plus anciens manuscrits permet les deux rattachements syntaxiques.
lexical_decisions:
- source_word: ᾧ μὲν ... ᾧ δὲ ... ᾧ δὲ
  choice: à l’un ... à un autre ... et à un autre
  rationale: Cette tournure distributive française rend naturellement la succession contrastée des bénéficiaires marquée par μέν et δέ.
- source_word: τάλαντα
  choice: talents
  rationale: Le terme historique désigne ici de très importantes unités de poids ou de valeur monétaire. « Talents » préserve le cadre ancien et l’écho traditionnel de la parabole, tandis qu’une note écarte le sens moderne d’aptitude naturelle.
- source_word: ἕν
  choice: un seul
  rationale: Le nom « talent » reste sous-entendu après les deux quantités précédentes. « Un seul » est naturel en français et souligne sans surtraduction la quantité unique.
- source_word: ἑκάστῳ κατὰ τὴν ἰδίαν δύναμιν
  choice: à chacun selon sa propre capacité
  rationale: La formulation conserve la construction distributive au singulier et rend δύναμις par la capacité personnelle, non par une puissance miraculeuse.
- source_word: ἀπεδήμησεν
  choice: il partit en voyage
  rationale: Le verbe exprime un départ impliquant un déplacement ou un séjour au loin. Cette expression française en conserve la nuance sans préciser indûment la destination.
- source_word: εὐθέως
  choice: Aussitôt
  rationale: En accord avec la ponctuation du SBLGNT, l’adverbe est placé après le point et se rattache naturellement à l’action du serviteur au verset suivant. Une note signale son rattachement possible au départ du maître.
theological_decisions:
- issue: Sens de τάλαντα dans la parabole
  choice: unités monétaires appelées « talents »
  alternative: capacités ou dons naturels
  rationale: Le contexte immédiat concerne des biens confiés et leur mise à profit financière. Le sens moderne français de « talent » ne doit donc pas déterminer l’interprétation du mot dans ce passage.
- issue: Rattachement syntaxique de εὐθέως
  choice: au commencement de l’action racontée au verset suivant
  alternative: 'au départ du maître : « puis il partit aussitôt »'
  rationale: Les manuscrits anciens ne portaient pas la ponctuation moderne, ce qui laisse une ambiguïté réelle. La ponctuation de l’édition source place cependant εὐθέως après le point, et l’enchaînement « Aussitôt, celui qui avait reçu… » est naturel. L’autre rattachement demeure possible et est conservé en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe distributive reste au singulier. La fin du verset demeure volontairement ouverte sur le verset suivant, conformément à la ponctuation du SBLGNT et malgré la coupure traditionnelle des versets.
