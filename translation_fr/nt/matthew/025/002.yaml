id: MAT.25.2
reference: Matthew 25:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πέντε δὲ ⸂ἐξ αὐτῶν ἦσαν⸃ ⸂μωραὶ καὶ πέντε φρόνιμοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/002.yaml
  text: And five of them were foolish, and five were wise.
translation:
  language: fr
  text: Cinq d’entre elles étaient insensées, et cinq étaient avisées.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέντε
  choice: cinq
  rationale: Le cardinal est rendu directement par « cinq » et répété afin de conserver l’équilibre et le contraste de la phrase grecque.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Ici, δέ assure une transition narrative légère. En français, le rendre par « et » ou « mais » en tête de phrase alourdirait le texte ou accentuerait indûment l’opposition; l’enchaînement suffit à en communiquer la fonction.
- source_word: ἐξ αὐτῶν
  choice: d’entre elles
  rationale: Cette expression partitive désigne cinq membres du groupe féminin mentionné au verset précédent. « D’entre elles » est naturel et précis en français.
- source_word: ἦσαν
  choice: étaient
  rationale: L’imparfait de εἰμί est une copule descriptive, naturellement rendu par l’imparfait français « étaient ».
- source_word: μωραὶ
  choice: insensées
  rationale: Le terme désigne ici celles qui manquent de jugement. « Insensées » conserve la force du contraste sans introduire une nuance d’ignorance intellectuelle.
- source_word: φρόνιμοι
  choice: avisées
  rationale: φρόνιμος peut signifier sensé, prudent ou avisé. « Avisées » exprime ici le bon jugement pratique qui s’oppose à l’attitude des insensées.
theological_decisions:
- issue: Portée morale du contraste μωραί / φρόνιμοι
  choice: insensées / avisées
  alternative: folles / sages
  rationale: Le choix retenu préserve le contraste portant sur le jugement pratique, sans durcir « μωραί » en diagnostic mental ni charger « φρόνιμοι » d’une notion théologique de sagesse absente de ce seul verset.
translation_notes:
  register: Français international moderne, clair et digne. La structure équilibrée du grec est conservée par la répétition de « cinq », tandis que la copule demeure elliptique dans le second membre, comme elle l’est en grec et comme le permet naturellement le français.
