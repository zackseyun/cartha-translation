id: MAT.25.26
reference: Matthew 25:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ κύριος αὐτοῦ εἶπεν αὐτῷ· Πονηρὲ δοῦλε καὶ ὀκνηρέ, ᾔδεις ὅτι θερίζω ὅπου οὐκ ἔσπειρα καὶ συνάγω ὅθεν οὐ διεσκόρπισα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/026.yaml
  text: But his master answered and said to him[a], ‘Wicked and lazy servant[b], you knew that I reap where I did not sow and gather where I did not scatter?
translation:
  language: fr
  text: 'Mais son maître lui répondit : « Serviteur mauvais et paresseux[a], tu savais que je moissonne là où je n’ai pas semé et que je rassemble là où je n’ai rien dispersé[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclave mauvais et paresseux ». Le mot grec doulos peut désigner un serviteur ou un esclave selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi comprendre ces paroles comme une affirmation : « Tu savais que je moissonne là où je n’ai pas semé et que je rassemble là où je n’ai rien dispersé. »'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: Mais … lui répondit
  rationale: Cette formule narrative exprime une réponse avec une légère transition adversative ; cette tournure est naturelle en français.
- source_word: ὁ κύριος αὐτοῦ
  choice: son maître
  rationale: Dans le cadre de cette parabole, κύριος désigne le maître du serviteur plutôt qu’un titre christologique explicite.
- source_word: Πονηρὲ
  choice: mauvais
  rationale: Le terme porte ici un jugement moral. « Mauvais » restitue cette condamnation dans un français actuel et direct.
- source_word: δοῦλε
  choice: serviteur
  rationale: Dans le récit parabolique, « serviteur » est idiomatique, tandis que « esclave » demeure une possibilité lexicale importante signalée en note.
- source_word: ὀκνηρέ
  choice: paresseux
  rationale: ὀκνηρός qualifie celui qui hésite à agir ou ne fait pas l’effort requis ; « paresseux » en rend clairement le reproche.
- source_word: ᾔδεις
  choice: tu savais
  rationale: La forme de οἶδα exprime ici ce que le serviteur était censé savoir ; l’imparfait français convient au contexte.
- source_word: θερίζω ὅπου οὐκ ἔσπειρα
  choice: je moissonne là où je n’ai pas semé
  rationale: La formulation conserve directement l’image agricole et l’opposition entre moissonner et semer.
- source_word: συνάγω ὅθεν οὐ διεσκόρπισα
  choice: je rassemble là où je n’ai rien dispersé
  rationale: « Rassembler » et « disperser » conservent l’antithèse lexicale du grec sans ajouter explicitement « du grain » ou « de la semence », absents du texte source.
theological_decisions:
- issue: Valeur interrogative ou déclarative des paroles finales du maître
  choice: 'Question rhétorique : « tu savais que… ? »'
  alternative: 'Affirmation : « Tu savais que je moissonne… et que je rassemble… »'
  rationale: Le grec permet les deux ponctuations. La question rhétorique s’accorde avec la réplique par laquelle le maître retourne contre le serviteur son propre raisonnement, mais l’autre lecture est conservée en note afin de ne pas supprimer l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme agricole est maintenu, ainsi que la rudesse de la réprimande. La traduction évite d’ajouter « semence » dans le second membre, puisque cet objet n’est qu’implicite en grec.
