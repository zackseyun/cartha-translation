  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : la transition avec δέ (« Mais »), la relation maître-serviteur, la double réprimande morale, et le parallélisme agricole. « Je rassemble là où je n’ai rien dispersé » conserve l’objet implicite de διεσκόρπισα sans introduire « semence » ou « grain ». La ponctuation interrogative est une lecture recevable, et la note conserve explicitement la possibilité déclarative.'
