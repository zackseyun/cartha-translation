  terminology: « Maître » convient à κύριος dans ce cadre parabolique, sans surinterprétation christologique. « Serviteur » est un choix français idiomatique pour δοῦλος, tandis que la note signale correctement « esclave » comme alternative. « Mauvais » et « paresseux » rendent de façon claire la portée morale de πονηρός et ὀκνηρός. Les ancres [a] et [b] sont placées auprès des unités auxquelles leurs notes se rapportent.
