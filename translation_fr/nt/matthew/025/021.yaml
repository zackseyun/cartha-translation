id: MAT.25.21
reference: Matthew 25:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/021.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will appoint you over many things[b]. Enter into the joy of your master.’
translation:
  language: fr
  text: 'Son maître lui dit : « C’est bien, bon et fidèle serviteur[a]. Tu as été fidèle dans peu de choses ; je te confierai beaucoup. Entre dans la joie de ton maître[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « esclave » : le grec doulos peut désigner un serviteur ou un esclave selon le contexte.'
    reason: alternative_reading
  - marker: b
    text: Le grec kyrios peut aussi être traduit par « Seigneur » ; « maître » convient ici à la relation décrite dans la parabole.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: dit
  rationale: Introduction narrative ordinaire du discours direct, naturelle en français moderne.
- source_word: κύριος
  choice: maître
  rationale: Dans le cadre immédiat de la parabole, le terme désigne le maître du serviteur ; « maître » rend clairement cette relation sans transformer explicitement le personnage en titre christologique.
- source_word: δοῦλε
  choice: serviteur
  rationale: « Serviteur » est naturel dans cette formule d’approbation et maintient la relation hiérarchique avec le maître ; la nuance possible d’esclavage est signalée en note.
- source_word: Εὖ
  choice: C’est bien
  rationale: Formule française idiomatique d’approbation, correspondant à l’adverbe grec sans ajouter un verbe absent du texte.
- source_word: ἀγαθὲ καὶ πιστέ
  choice: bon et fidèle
  rationale: Rend directement les deux qualités attribuées au serviteur et conserve leur association traditionnelle et naturelle.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: Tu as été fidèle dans peu de choses
  rationale: Le français « dans peu de choses » exprime naturellement le domaine restreint dans lequel la fidélité a été démontrée.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: je te confierai beaucoup
  rationale: Exprime idiomatiquement la nomination à une responsabilité plus grande, tout en conservant le contraste quantitatif avec « peu de choses ».
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: Entre dans la joie
  rationale: Conserve l’image grecque d’une entrée dans la joie, sans la réduire à la seule idée de participation.
theological_decisions:
- issue: Traduction de κύριος dans une parabole où le maître peut représenter Dieu ou le Christ
  choice: maître
  alternative: Seigneur
  rationale: « Maître » respecte d’abord le niveau narratif de la relation entre le serviteur et son maître, tout en laissant ouverte la portée théologique de la parabole.
- issue: Traduction de δοῦλος dans ce contexte
  choice: serviteur
  alternative: esclave
  rationale: « Serviteur » convient naturellement à la formule française et à la fonction exercée dans le récit. Comme δοῦλος peut aussi désigner un esclave et que ce statut social ne doit pas être effacé, l’autre rendu est indiqué en note.
- issue: Portée de « la joie de ton maître »
  choice: conserver la formulation métaphorique
  alternative: viens partager la joie de ton maître
  rationale: La traduction garde l’image explicite d’entrer dans la joie et ne précise pas davantage si cette joie est celle éprouvée par le maître, celle qu’il donne, ou une célébration à laquelle le serviteur prend part.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme entre la fidélité dans le peu et la responsabilité plus grande, ainsi que l’image d’entrer dans la joie.
