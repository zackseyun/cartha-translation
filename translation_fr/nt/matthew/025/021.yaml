  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : l’approbation (Εὖ), les qualificatifs « bon et fidèle », le contraste entre le peu et l’extension future des responsabilités, ainsi que l’image d’« entrer dans la joie ». « Maître » convient à κύριος dans le cadre narratif de la parabole, et « serviteur » est défendable pour δοῦλος, avec l’alternative pertinente signalée.'
