id: MAT.25.31
reference: Matthew 25:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες ⸀οἱ ἄγγελοι μετ’ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/031.yaml
  text: But when the Son of Man comes in his glory[a], and all the angels with him, then he will sit on his glorious throne.
translation:
  language: fr
  text: Mais quand le Fils de l’homme viendra dans sa gloire, avec tous les anges, alors il s’assiéra sur son trône glorieux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « le trône de sa gloire ».'
    reason: Alternative lexicale reflétant plus directement la construction au génitif θρόνου δόξης αὐτοῦ.
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Mais quand
  rationale: « Quand » convient à cet événement futur unique, tandis que « mais » marque la transition du discours avec la légère nuance contrastive de δέ.
- source_word: ἔλθῃ
  choice: viendra
  rationale: Après une conjonction temporelle, le français emploie naturellement le futur pour cet événement à venir.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation consacrée préserve le titre christologique ainsi que son écho à Daniel 7, sans le remplacer par une paraphrase interprétative.
- source_word: ἐν τῇ δόξῃ αὐτοῦ
  choice: dans sa gloire
  rationale: « Gloire » rend la majesté manifestée et conserve les résonances bibliques de δόξα.
- source_word: πάντες οἱ ἄγγελοι μετ’ αὐτοῦ
  choice: avec tous les anges
  rationale: Cette formulation exprime naturellement l’accompagnement et conserve « tous les anges » sans ajouter un possessif absent du texte grec.
- source_word: τότε καθίσει
  choice: alors il s’assiéra
  rationale: « Alors » maintient la succession des actions, et « s’assiéra » rend directement le futur actif de καθίζω sans expliciter davantage la portée royale ou judiciaire.
- source_word: ἐπὶ θρόνου δόξης αὐτοῦ
  choice: sur son trône glorieux
  rationale: La tournure attributive est naturelle en français moderne et communique qu’il s’agit d’un trône caractérisé par sa gloire; la construction grecque plus littérale est signalée en note.
theological_decisions:
- issue: Titre christologique ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Être humain
  rationale: Le titre traditionnel garde sa portée messianique et judiciaire ainsi que son arrière-plan daniélique, sans résoudre par paraphrase son identité et sa fonction dans le passage.
- issue: Sens de θρόνου δόξης αὐτοῦ
  choice: son trône glorieux
  alternative: le trône de sa gloire
  rationale: Le texte principal privilégie une expression française idiomatique, tandis que la note conserve la forme plus proche du grec et rend visible l’association entre le trône et sa gloire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le mouvement solennel du discours eschatologique, le titre biblique établi et la séquence temporelle du grec, tout en évitant une syntaxe inutilement calquée.
