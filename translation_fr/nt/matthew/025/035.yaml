id: MAT.25.35
reference: Matthew 25:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπείνασα γὰρ καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα καὶ ἐποτίσατέ με, ξένος ἤμην καὶ συνηγάγετέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/035.yaml
  text: For I was hungry and you gave me something to eat[a]; I was thirsty and you gave me something to drink; I was a stranger and you welcomed me,
translation:
  language: fr
  text: Car j’ai eu faim et vous m’avez donné à manger ; j’ai eu soif et vous m’avez donné à boire ; j’étais étranger et vous m’avez accueilli[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous m’avez recueilli ». Le verbe grec signifie littéralement « rassembler », mais il évoque ici l’accueil hospitalier d’un étranger.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπείνασα
  choice: j’ai eu faim
  rationale: Le passé composé exprime naturellement en français moderne l’expérience passée de la faim portée par l’aoriste.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication de l’affirmation précédente ; « Car » en conserve clairement la valeur logique.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: vous m’avez donné à manger
  rationale: Cette tournure française idiomatique rend directement la construction « donner à quelqu’un de quoi manger » sans ajout inutile.
- source_word: ἐδίψησα
  choice: j’ai eu soif
  rationale: Le passé composé rend naturellement l’expérience passée exprimée par l’aoriste et maintient le parallélisme avec « j’ai eu faim ».
- source_word: ἐποτίσατέ με
  choice: vous m’avez donné à boire
  rationale: Dans ce contexte de secours concret, cette expression française naturelle restitue le sens de ποτίζω et répond à « donné à manger ».
- source_word: ξένος
  choice: étranger
  rationale: Le terme désigne ici une personne sans liens ordinaires d’appartenance ni accueil assuré. « Étranger » préserve cette portée sans la réduire à un statut national ou juridique.
- source_word: συνηγάγετέ με
  choice: vous m’avez accueilli
  rationale: Bien que συνάγω signifie fondamentalement « rassembler », son association avec ξένος évoque ici l’accueil hospitalier. « Accueilli » exprime ce sens en français courant sans ajouter explicitement « chez vous ».
theological_decisions:
- issue: Portée de l’expression ξένος … συνηγάγετέ με
  choice: j’étais étranger et vous m’avez accueilli
  alternative: j’étais étranger et vous m’avez recueilli
  rationale: La formulation retenue met en avant l’accueil personnel et miséricordieux d’une personne vulnérable, sans importer de catégories politiques modernes. La note conserve la nuance possible d’un accueil assorti d’une prise en charge.
translation_notes:
  register: Français international moderne, simple et digne. Le rythme ternaire et les parallélismes sont conservés ; les points-virgules rendent lisible la succession des actes de compassion. La virgule finale est maintenue puisque le verset se poursuit dans son contexte.
