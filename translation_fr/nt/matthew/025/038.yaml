id: MAT.25.38
reference: Matthew 25:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/038.yaml
  text: And when did we see you as a stranger and take you in[c][b][a], or naked and clothe you?
translation:
  language: fr
  text: Et quand t’avons-nous vu étranger[a] et t’avons-nous accueilli[b], ou nu[c] et t’avons-nous vêtu ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « venu d’ailleurs ». Le terme grec peut désigner une personne inconnue ou extérieure au cercle habituel; ici, il s’agit de quelqu’un qui a besoin d’hospitalité.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « rassemblé » ou « fait entrer »; dans ce contexte, il s’agit de recevoir quelqu’un avec hospitalité.
    reason: lexical_alternative
  - marker: c
    text: Ou « insuffisamment vêtu ». Le grec peut désigner une personne entièrement nue ou qui manque de vêtements convenables.
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: quand
  rationale: Adverbe interrogatif temporel, rendu naturellement en français par « quand ».
- source_word: δέ
  choice: et
  rationale: La particule relie légèrement cette question à la précédente; « et » restitue cette continuité sans introduire un contraste trop marqué.
- source_word: σε
  choice: t’ / te
  rationale: Pronom complément désignant le roi dans la parabole; sa répétition en français clarifie les verbes coordonnés.
- source_word: εἴδομεν
  choice: avons-nous vu
  rationale: Le passé composé convient naturellement à cette question portant sur des actes passés.
- source_word: ξένον
  choice: étranger
  rationale: Le mot désigne ici une personne extérieure au cercle familier et ayant besoin d’hospitalité. « Étranger » conserve aussi la possibilité du sens de personne venue d’ailleurs.
- source_word: συνηγάγομεν
  choice: avons-nous accueilli
  rationale: Dans ce contexte d’hospitalité, le verbe exprime le fait de recevoir quelqu’un et de lui donner accueil, plutôt qu’un simple rassemblement.
- source_word: ἢ
  choice: ou
  rationale: Conjonction disjonctive introduisant la seconde situation évoquée.
- source_word: γυμνὸν
  choice: nu
  rationale: Équivalent direct et concis, tout en laissant signaler en note que le grec peut aussi désigner une personne insuffisamment vêtue.
- source_word: περιεβάλομεν
  choice: avons-nous vêtu
  rationale: Le verbe signifie ici mettre des vêtements à quelqu’un; « vêtir » est précis, naturel et digne dans ce contexte.
theological_decisions:
- issue: Sens de ξένος dans le contexte du jugement et des œuvres de compassion
  choice: étranger
  alternative: personne venue d’ailleurs; inconnu
  rationale: « Étranger » préserve la dimension sociale d’une personne qui n’appartient pas au cercle familier et a besoin d’être accueillie, sans réduire le terme à une catégorie ethnique ou nationale.
- issue: Portée de γυμνός
  choice: nu
  alternative: mal vêtu; insuffisamment vêtu
  rationale: Le rendu principal conserve le sens direct du grec, tandis qu’une note maintient son extension possible à l’absence de vêtements convenables.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « t’avons-nous » évite toute ambiguïté syntaxique et conserve la structure interrogative ainsi que le parallélisme du grec.
