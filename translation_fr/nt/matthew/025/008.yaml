id: MAT.25.8
reference: Matthew 25:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αἱ δὲ μωραὶ ταῖς φρονίμοις εἶπαν· Δότε ἡμῖν ἐκ τοῦ ἐλαίου ὑμῶν, ὅτι αἱ λαμπάδες ἡμῶν σβέννυνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/008.yaml
  text: But the foolish said to the wise[a], ‘Give us some of your oil, because our lamps are going out.’
translation:
  language: fr
  text: 'Mais les insensées dirent aux avisées : « Donnez-nous de votre huile, car nos lampes[a] s’éteignent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « torches ». Le mot grec peut désigner une source de lumière portative alimentée par une flamme.
    reason: lexical_alternative
lexical_decisions:
- source_word: μωραὶ
  choice: les insensées
  rationale: L’adjectif substantivé désigne les jeunes filles dépourvues de discernement pratique. « Les insensées » conserve le contraste net du récit sans ajouter d’explication.
- source_word: φρονίμοις
  choice: aux avisées
  rationale: φρόνιμος exprime ici la sagesse pratique, la prévoyance et le bon jugement. « Avisées » est naturel en français et s’oppose clairement à « insensées ».
- source_word: Δότε
  choice: Donnez-nous
  rationale: L’impératif aoriste pluriel formule une demande directe. Le pronom « nous », exprimé séparément par ἡμῖν, est placé avec le verbe selon l’usage français.
- source_word: ἐκ τοῦ ἐλαίου ὑμῶν
  choice: un peu de votre huile
  rationale: 'ἐκ avec le génitif a une valeur partitive : elles demandent une portion de la réserve d’huile des autres. « Un peu de » rend ce sens idiomatiquement.'
- source_word: λαμπάδες
  choice: lampes
  rationale: λαμπάς peut désigner une lampe ou une torche. Dans cette scène où il est question d’huile, « lampes » est clair et traditionnel, tandis que l’autre possibilité est signalée en note.
- source_word: σβέννυνται
  choice: sont en train de s’éteindre
  rationale: Le présent décrit une extinction en cours. Cette formulation française met explicitement en valeur l’aspect progressif.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de la demande. « Car » convient au dialogue tout en gardant une tonalité digne et naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le féminin pluriel reprend les jeunes filles du contexte. Le contraste entre « insensées » et « avisées » exprime le manque ou la présence de discernement pratique sans surinterprétation théologique.
