id: MAT.25.45
reference: Matthew 25:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσεται αὐτοῖς λέγων· Ἀμὴν λέγω ὑμῖν, ἐφ’ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/045.yaml
  text: Then he will answer them[a], saying, ‘Truly I say to you, insofar as you did not do it for one of the least of these[b], neither did you do it for me.’
translation:
  language: fr
  text: 'Alors il leur répondra : « En vérité[a], je vous le dis, dans la mesure où vous ne l’avez pas fait pour l’un de ces plus petits[b], vous ne l’avez pas fait pour moi non plus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Amen, je vous le dis. »'
    reason: Alternative lexicale pour la formule Ἀμὴν λέγω ὑμῖν.
  - marker: b
    text: L’expression « ces plus petits » peut désigner particulièrement les disciples de Jésus ou, plus largement, les personnes humbles et dans le besoin; la traduction conserve la formulation du texte sans trancher.
    reason: Préservation d’une ambiguïté interprétative réelle concernant le référent.
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans la scène du jugement.
- source_word: ἀποκριθήσεται αὐτοῖς λέγων
  choice: il leur répondra
  rationale: Le verbe au futur signifie « répondre »; le participe λέγων introduit les paroles et peut être rendu naturellement en français par les deux-points, sans ajouter « en disant ».
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: En vérité, je vous le dis
  rationale: Rend la formule solennelle caractéristique de Jésus dans un français actuel et digne; une note conserve la possibilité plus formelle de transcrire Ἀμήν par « Amen ».
- source_word: ἐφ’ ὅσον
  choice: dans la mesure où
  rationale: Préserve la nuance de mesure ou d’étendue de la locution grecque sans la réduire au simple rapport causal exprimé par « puisque ».
- source_word: οὐκ ἐποιήσατε
  choice: vous ne l’avez pas fait
  rationale: Le pronom « l’ » reprend naturellement en français les actes évoqués dans le contexte précédent, tout en conservant la négation du grec.
- source_word: ἑνὶ τούτων τῶν ἐλαχίστων
  choice: pour l’un de ces plus petits
  rationale: Conserve le singulier représentatif ἑνί et le superlatif substantivé ἐλαχίστων. « Pour » exprime idiomatiquement en français le bénéficiaire des actes sous-entendus.
- source_word: οὐδὲ ἐμοὶ ἐποιήσατε
  choice: vous ne l’avez pas fait pour moi non plus
  rationale: « Non plus » rend naturellement οὐδέ après une première proposition négative et maintient la répétition emphatique du verbe.
theological_decisions:
- issue: Identification de Jésus aux « plus petits »
  choice: La traduction conserve l’affirmation directe selon laquelle ne pas agir pour l’un de ces plus petits revient à ne pas agir pour Jésus, sans définir davantage le groupe.
  alternative: Comprendre « ces plus petits » soit particulièrement comme les disciples ou messagers de Jésus, soit plus largement comme les personnes humbles et dans le besoin.
  rationale: Le verset établit l’identification avec Jésus, mais ne tranche pas à lui seul l’étendue précise du groupe désigné. La traduction et la note préservent cette tension interprétative.
translation_notes:
  register: Français international moderne, clair et solennel. Les deux-points rendent sans lourdeur le participe λέγων. La formulation « dans la mesure où » est légèrement soutenue, mais elle préserve mieux la nuance du grec que des solutions purement causales.
