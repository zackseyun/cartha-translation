id: MAT.25.29
reference: Matthew 25:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῷ γὰρ ἔχοντι παντὶ δοθήσεται καὶ περισσευθήσεται· ⸂τοῦ δὲ⸃ μὴ ἔχοντος καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/029.yaml
  text: For to everyone who has[a], more will be given, and he will have an abundance; but from the one who does not have, even what he has will be taken away from him.
translation:
  language: fr
  text: Car on donnera à toute personne qui a, et elle sera dans l’abondance ; mais à celle qui n’a pas, on enlèvera même ce qu’elle a.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ γὰρ ἔχοντι παντὶ
  choice: Car on donnera à toute personne qui a
  rationale: La construction au datif avec le participe substantivé et παντί a une portée distributive. « À toute personne qui a » conserve cette généralité et s’intègre naturellement à la forme passive du verbe.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit l’explication qui appuie la déclaration précédente ; « Car » maintient clairement ce lien logique dans un registre digne et courant.
- source_word: δοθήσεται
  choice: on donnera
  rationale: Le futur passif de δίδωμι ne nomme pas l’agent. En français, le tour impersonnel « on donnera » rend naturellement ce passif sans identifier celui qui donne.
- source_word: καὶ περισσευθήσεται
  choice: et elle sera dans l’abondance
  rationale: περισσεύω exprime ici le fait de disposer en abondance, voire au-delà du nécessaire. Cette formulation française restitue le résultat sans préciser ce dont la personne abondera.
- source_word: τοῦ δὲ μὴ ἔχοντος
  choice: mais à celle qui n’a pas
  rationale: Le génitif substantivé désigne, par contraste, la personne qui n’a pas. Avec « enlever », le français idiomatique emploie « à quelqu’un », là où le grec exprime la séparation avec ἀπό plus loin dans la phrase.
- source_word: καὶ ὃ ἔχει
  choice: même ce qu’elle a
  rationale: 'καί a ici une valeur intensive ou ascendante : « même » souligne le paradoxe selon lequel ce que cette personne possède déjà lui sera retiré.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: on enlèvera … à celle-ci
  rationale: Le futur passif d’αἴρω indique le retrait, et ἀπό marque la séparation. La construction française « enlever quelque chose à quelqu’un » rend naturellement l’ensemble sans nommer l’agent.
theological_decisions:
- issue: Référence humaine générique dans les participes masculins singuliers
  choice: Employer « toute personne » puis « celle », avec les pronoms féminins grammaticaux correspondants
  alternative: Employer « tout homme » ou passer au pluriel « ceux qui ont »
  rationale: Le masculin grec est générique et représentatif, non une restriction aux hommes. « Toute personne » garde la portée universelle et le singulier distributif sans importer une limitation sexuelle ; le féminin de « elle/celle » relève uniquement de l’accord avec le nom français « personne ».
- issue: Objet implicite du verbe « avoir »
  choice: Laisser « qui a / qui n’a pas » sans complément explicite
  alternative: Ajouter « ce qui lui a été confié », « des biens » ou « la foi »
  rationale: Le grec laisse l’objet d’ἔχω implicite. Le conserver ainsi préserve la tension de la maxime et évite d’imposer une interprétation théologique ou narrative plus précise que le texte.
- issue: Agent des futurs passifs
  choice: Conserver l’agent indéterminé au moyen de « on »
  alternative: 'Nommer Dieu comme agent : « Dieu donnera / enlèvera »'
  rationale: Le texte grec ne nomme pas l’agent. Bien qu’un passif divin soit possible, l’expliciter résoudrait une ambiguïté que le texte maintient.
translation_notes:
  register: Français international moderne, clair et digne. La structure antithétique et le singulier distributif sont conservés. Aucun complément n’est ajouté après « avoir », et aucun agent divin n’est explicité.
