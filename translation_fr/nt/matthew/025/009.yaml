  text: ἀπεκρίθησαν δὲ αἱ φρόνιμοι λέγουσαι· Μήποτε ⸂οὐ μὴ⸃ ἀρκέσῃ ἡμῖν καὶ ὑμῖν· ⸀πορεύεσθε μᾶλλον πρὸς τοὺς πωλοῦντας καὶ ἀγοράσατε ἑαυταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/009.yaml
  text: But the wise answered[a], saying, ‘No, lest there not be enough for us and for you. Go instead to those who sell, and buy for yourselves.’
translation:
  language: fr
  text: 'Mais les avisées répondirent : « Non, il n’y en aurait peut-être pas assez pour nous et pour vous.[a] Allez plutôt chez les vendeurs et achetez-en pour vous-mêmes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte μήποτε (« peut-être », ou « de peur que » selon le contexte) suivi de οὐ μή, une négation emphatique placée entre crochets dans l’édition utilisée. La construction est difficile; elle exprime la crainte qu’il n’y ait pas assez pour les deux groupes.
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ἀπεκρίθησαν δὲ … λέγουσαι
  choice: Mais les avisées répondirent
  rationale: Le participe « disant » complète en grec le verbe de réponse, mais sa reproduction donnerait en français une tournure inutilement lourde (« répondirent en disant »). « Répondirent » exprime naturellement l’ensemble de la construction, tandis que δέ est rendu par « Mais » pour marquer le contraste.
- source_word: αἱ φρόνιμοι
  choice: les avisées
  rationale: L’adjectif substantivé désigne les jeunes femmes caractérisées auparavant comme φρόνιμοι. « Les avisées » conserve cette forme concise et évoque leur discernement pratique sans ajouter un nom absent de ce verset.
- source_word: Μήποτε οὐ μὴ ἀρκέσῃ
  choice: Non, de peur qu’il n’y en ait vraiment pas assez
  rationale: « Non » explicite le refus impliqué, tandis que « de peur que » conserve la nuance de crainte ou de précaution de μήποτε. « Vraiment pas assez » cherche à rendre la forte négation οὐ μή sans produire une construction française obscure.
- source_word: ἡμῖν καὶ ὑμῖν
  choice: pour nous et pour vous
  rationale: Cette formulation rend naturellement les datifs d’intérêt et maintient le parallélisme des deux groupes.
- source_word: πορεύεσθε μᾶλλον
  choice: Allez plutôt
  rationale: L’impératif reste direct, et « plutôt » présente l’action proposée comme la solution de remplacement.
- source_word: πρὸς τοὺς πωλοῦντας
  choice: chez ceux qui en vendent
  rationale: Le participe substantivé désigne les vendeurs. « Chez » est idiomatique avec un commerçant, et le pronom « en », requis naturellement en français, reprend l’huile mentionnée dans le contexte.
- source_word: ἀγοράσατε ἑαυταῖς
  choice: achetez-en pour vous-mêmes
  rationale: Le pronom « en » reprend l’huile sous-entendue, et « pour vous-mêmes » conserve la force du pronom réfléchi au féminin pluriel sans devoir répéter un nom.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La redondance grecque « répondirent, disant » est allégée conformément à l’équivalence optimale. Les pronoms « en » rendent explicite en français l’huile que le grec laisse sous-entendue par le contexte.
