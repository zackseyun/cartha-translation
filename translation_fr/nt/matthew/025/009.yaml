  naturalness: « Non, il n’y en aurait peut-être pas assez pour nous et pour vous » est idiomatique en français international moderne et exprime clairement la raison du refus. « Chez ceux qui en vendent » et « achetez-en pour vous-mêmes » restent naturels et assurent la reprise contextuelle de l’huile.
