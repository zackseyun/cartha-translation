id: MAT.25.32
reference: Matthew 25:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀συναχθήσονται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφορίσει αὐτοὺς ἀπ’ ἀλλήλων, ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/032.yaml
  text: And all the nations will be gathered before him[a], and he will separate them from one another, just as the shepherd separates the sheep from the goats[b],
translation:
  language: fr
  text: Toutes les nations seront rassemblées devant lui[a], et il les séparera les unes des autres, comme le berger sépare les brebis des boucs[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou «tous les peuples»; grec: «toutes les nations» (πάντα τὰ ἔθνη).'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec ἐρίφων peut désigner plus précisément de jeunes boucs ou des chevreaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: συναχθήσονται
  choice: seront rassemblées
  rationale: Le futur passif est conservé sans préciser l’agent, que le grec laisse implicite.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: devant lui
  rationale: Expression française naturelle qui convient à cette scène de jugement et rend directement la relation spatiale.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Cette traduction conserve la forme et l’étendue lexicale du grec, sans réduire le sens aux seuls non-Juifs ni l’interpréter d’emblée comme tous les individus.
- source_word: ἀφορίσει
  choice: il séparera
  rationale: Le verbe exprime ici la séparation de deux groupes; «séparera» est clair et direct.
- source_word: αὐτοὺς ἀπ’ ἀλλήλων
  choice: il les séparera les unes des autres
  rationale: Le pronom renvoie aux nations, féminin pluriel en français; la tournure conserve l’idée de séparation mutuelle au sein de l’ensemble rassemblé.
- source_word: ὥσπερ
  choice: comme
  rationale: «Comme» introduit naturellement en français la comparaison explicite du grec.
- source_word: ὁ ποιμὴν
  choice: le berger
  rationale: L’article grec est conservé, avec une valeur générique naturelle en français.
- source_word: τὰ πρόβατα
  choice: les brebis
  rationale: «Brebis» est le terme français biblique et pastoral usuel dans le contraste avec les boucs, tout en gardant l’image concrète des ovins.
- source_word: τῶν ἐρίφων
  choice: les boucs
  rationale: «Boucs» donne en français un contraste pastoral naturel avec «brebis»; une note signale que le grec peut désigner plus précisément de jeunes boucs ou des chevreaux.
theological_decisions:
- issue: Portée de πάντα τὰ ἔθνη
  choice: toutes les nations
  alternative: tous les peuples; tous les non-Juifs
  rationale: La formulation garde l’ampleur et l’ambiguïté du grec dans ce contexte eschatologique, sans imposer une identification doctrinale plus étroite des personnes jugées.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit étroitement le mouvement du grec, tout en restant naturelle. «Les unes des autres» s’accorde avec «nations»; «brebis» et «boucs» maintiennent le contraste pastoral traditionnel, avec précision lexicale en note.
