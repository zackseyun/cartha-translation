review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la progression du récit, « l’époux », les femmes prêtes, leur entrée avec lui, le banquet et la fermeture de la porte. Toutefois, « elles allaient en acheter » se comprend couramment comme une intention imminente (« elles allaient acheter ») plutôt que comme le fait de s’éloigner. Le préfixe ἀπ- de ἀπερχομένων et la simultanéité du génitif absolu sont mieux conservés par « elles s’en allaient pour en acheter ».
  naturalness: Le français est globalement naturel, moderne et d’un registre biblique sobre. « Elles s’en allaient pour en acheter » est fluide et restitue plus nettement le déplacement. Le maintien de la coordination par « et » reflète aussi la succession narrative du grec sans alourdir la phrase.
  terminology: « L’époux », « celles qui étaient prêtes », « banquet de noces » et « la porte fut fermée » sont justes et idiomatiques. « Banquet de noces » est une explicitation contextuellement sûre de τοὺς γάμους; la note conserve à bon droit l’alternative plus générale « aux noces ».
  issues:
  - severity: medium
    issue: Valeur de déplacement de ἀπερχομένων insuffisamment explicite
    rationale: Dans « pendant qu’elles allaient en acheter », l’imparfait de aller suivi d’un infinitif peut être lu comme un futur dans le passé ou une intention (« elles étaient sur le point d’en acheter »). Le grec décrit leur départ pour acheter. « Pendant qu’elles s’en allaient pour en acheter » préserve ce mouvement tout en laissant « en » reprendre l’huile du contexte immédiat.
  revised_text: Mais pendant qu’elles s’en allaient pour en acheter, l’époux arriva, et celles qui étaient prêtes entrèrent avec lui au banquet de noces[a], et la porte fut fermée.
