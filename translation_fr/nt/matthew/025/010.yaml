source:
  edition: SBLGNT
  text: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι ἦλθεν ὁ νυμφίος, καὶ αἱ ἕτοιμοι εἰσῆλθον μετ’ αὐτοῦ εἰς τοὺς γάμους, καὶ ἐκλείσθη ἡ θύρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/010.yaml
  text: But while they were going away to buy[a], the bridegroom came, and those who were ready went in with him to the wedding feast, and the door was shut.
translation:
  language: fr
  text: Mais pendant qu’elles s’en allaient pour en acheter, l’époux arriva, et celles qui étaient prêtes entrèrent avec lui au banquet de noces[a], et la porte fut fermée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux noces ». Le pluriel grec peut désigner l’ensemble de la célébration du mariage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπερχομένων δὲ αὐτῶν ἀγοράσαι
  choice: Mais pendant qu’elles allaient en acheter
  rationale: Le génitif absolu exprime une action simultanée. « Pendant qu’elles allaient » rend naturellement cette valeur en français. Le pronom « en » reprend l’huile mentionnée dans le contexte immédiat sans répéter un complément absent du verset grec.
- source_word: ὁ νυμφίος
  choice: l’époux
  rationale: Dans le contexte des noces, « l’époux » est le terme français courant et précis pour l’homme qui se marie; il conserve l’image parabolique sans l’expliciter théologiquement.
- source_word: αἱ ἕτοιμοι
  choice: Celles qui étaient prêtes
  rationale: L’adjectif féminin pluriel substantivé désigne les jeunes filles prêtes. Cette formulation est idiomatique et conserve à la fois le genre grammatical et l’idée de préparation.
- source_word: εἰσῆλθον μετ’ αὐτοῦ
  choice: entrèrent avec lui
  rationale: « Entrèrent avec lui » restitue directement le mouvement narratif de l’aoriste et reste naturel en français.
- source_word: εἰς τοὺς γάμους
  choice: au banquet de noces
  rationale: Le pluriel grec peut désigner l’ensemble de la célébration nuptiale. Dans ce contexte, « banquet de noces » communique clairement la scène festive, tout en signalant en note l’alternative plus générale.
- source_word: ἐκλείσθη ἡ θύρα
  choice: la porte fut fermée
  rationale: Le passé simple passif correspond au mouvement narratif de l’aoriste et exprime sobrement le caractère définitif de l’action.
theological_decisions:
- issue: Image nuptiale dans le cadre de la parabole
  choice: Conserver « l’époux » et « banquet de noces » comme éléments ordinaires du récit
  alternative: Expliciter dans le texte l’identité symbolique de l’époux ou employer une formulation théologiquement interprétative
  rationale: La traduction doit laisser la portée théologique émerger de la parabole et de son contexte, sans introduire dans le verset une identification qui n’y est pas formulée explicitement.
translation_notes:
  register: Français moderne, international et digne. La syntaxe demeure fluide à l’oral comme à l’écrit; le passé simple convient au registre narratif biblique sans être archaïque. La répétition coordonnée par « et » préserve la progression solennelle du grec.
