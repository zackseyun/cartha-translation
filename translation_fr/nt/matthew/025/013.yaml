  text: γρηγορεῖτε οὖν, ὅτι οὐκ οἴδατε τὴν ἡμέραν οὐδὲ τὴν ⸀ὥραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/013.yaml
  text: Therefore[a], stay awake, because you do not know the day or the hour.
translation:
  language: fr
  text: Veillez donc[a], car vous ne savez ni le jour ni l’heure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « restez éveillés » ou « soyez vigilants ». L’impératif grec exprime une vigilance continue.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Restez éveillés
  rationale: L’impératif présent à la deuxième personne du pluriel appelle à une vigilance continue. Cette formulation conserve l’image de l’éveil employée dans le contexte de la parabole, tout en restant naturelle en français moderne.
- source_word: οὖν
  choice: donc
  rationale: La particule marque la conclusion pratique tirée de la parabole précédente. « Donc » exprime clairement et naturellement ce lien logique.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de l’ordre donné. « Car » convient au registre digne du passage sans alourdir la phrase.
- source_word: οὐκ οἴδατε
  choice: vous ne connaissez
  rationale: Rend directement le verbe de connaissance nié à la deuxième personne du pluriel, sans ajouter de nuance de certitude absente du grec.
- source_word: τὴν ἡμέραν
  choice: le jour
  rationale: L’article défini est conservé. Le contexte permet d’identifier ce jour, mais la traduction n’explicite pas davantage que le texte grec.
- source_word: οὐδὲ τὴν ὥραν
  choice: ni l’heure
  rationale: Après la négation du verbe, la coordination française « ni… ni… » rend naturellement les deux éléments inconnus et conserve leur parallélisme.
theological_decisions:
- issue: Image impérative de la vigilance
  choice: Restez éveillés
  alternative: Veillez ; soyez vigilants
  rationale: La formulation maintient l’image parabolique de l’éveil et l’appel à une disponibilité constante, sans réduire celui-ci à un système eschatologique particulier.
- issue: Portée de « le jour » et « l’heure »
  choice: Conserver l’expression sans précision interprétative
  alternative: Le jour et l’heure de la venue du Fils de l’homme ; le moment fixé
  rationale: Même si le discours environnant éclaire l’expression, le verset ne précise pas lui-même l’événement. La traduction évite donc d’ajouter une identification théologique absente de la formulation grecque.
translation_notes:
  register: Français international moderne, simple et digne. « Restez éveillés » préserve la métaphore du texte, tandis que la note signale les rendus français plus abstraits possibles. L’élision typographique et les espaces sont conformes à l’usage français.
