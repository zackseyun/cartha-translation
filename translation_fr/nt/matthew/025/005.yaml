id: MAT.25.5
reference: Matthew 25:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χρονίζοντος δὲ τοῦ νυμφίου ἐνύσταξαν πᾶσαι καὶ ἐκάθευδον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/005.yaml
  text: But while the bridegroom was delayed[b][a], they all became drowsy and fell asleep.
translation:
  language: fr
  text: Mais comme le marié tardait[a], elles eurent toutes sommeil et s’endormirent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme le marié mettait du temps à venir ».
    reason: lexical_alternative
  - marker: b
    text: Ou « elles eurent toutes sommeil et étaient endormies ». Le grec distingue le fait de devenir somnolent (ἐνύσταξαν) de l’état de dormir (ἐκάθευδον).
    reason: lexical_alternative
lexical_decisions:
- source_word: χρονίζοντος
  choice: tardait
  rationale: Le participe présent dans le génitif absolu indique que le marié met plus de temps que prévu. « Comme le marié tardait » rend naturellement en français la durée et le retard implicite.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une légère opposition ou un tournant narratif entre l’attente et l’assoupissement qui suit.
- source_word: νυμφίου
  choice: le marié
  rationale: Dans ce cadre de noces, « le marié » est le terme français moderne, précis et naturel, sans expliciter la portée christologique possible de l’image.
- source_word: ἐνύσταξαν
  choice: eurent sommeil
  rationale: Cette expression rend l’entrée dans la somnolence et la distingue du sommeil effectif exprimé ensuite par ἐκάθευδον.
- source_word: πᾶσαι
  choice: elles… toutes
  rationale: Le féminin pluriel renvoie à toutes les jeunes filles de la parabole et souligne qu’aucune ne fait exception.
- source_word: ἐκάθευδον
  choice: s’endormirent
  rationale: 'Cette formulation française exprime naturellement la progression de la somnolence au sommeil. L’imparfait grec peut aussi décrire l’état qui en résulte : « dormaient ».'
theological_decisions:
- issue: Image parabolique du marié
  choice: Conserver « le marié » comme image narrative sans identifier explicitement celui-ci au Christ dans le texte.
  alternative: Employer « l’époux », terme plus traditionnel et susceptible d’accentuer la résonance théologique.
  rationale: Le contexte matthéen donne à l’image une portée théologique possible, mais le verset lui-même demeure dans le récit de la parabole. La traduction préserve cette image sans ajouter son interprétation.
translation_notes:
  register: Français international moderne, simple et digne. « Le marié » est plus courant aujourd’hui que « l’époux » dans un récit de noces. La phrase conserve la progression entre somnolence et sommeil ainsi que le léger contraste introduit par δέ.
