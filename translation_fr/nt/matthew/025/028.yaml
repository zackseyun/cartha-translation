reference: Matthew 25:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρατε οὖν ἀπ’ αὐτοῦ τὸ τάλαντον καὶ δότε τῷ ἔχοντι τὰ δέκα τάλαντα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/028.yaml
  text: Therefore take the talent from him and give it to the one who has the ten talents[a][b].
translation:
  language: fr
  text: Enlevez-lui donc le talent[a] et donnez-le à celui qui a les dix talents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « talent » était une grande unité de poids et, par extension, de valeur monétaire.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρατε
  choice: Enlevez
  rationale: L’aoriste impératif pluriel de αἴρω exprime ici l’ordre de retirer à quelqu’un ce qu’il possède. « Enlevez-lui » rend naturellement en français la séparation explicitée par ἀπ’ αὐτοῦ.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement et naturellement la conséquence du jugement qui précède.
- source_word: ἀπ’ αὐτοῦ
  choice: -lui
  rationale: Le pronom complément dans « enlevez-lui » exprime idiomatiquement en français que le talent doit être retiré à cet homme.
- source_word: τὸ τάλαντον
  choice: le talent
  rationale: Le terme historique est conservé afin de ne pas remplacer l’image précise de la parabole par une interprétation générale; une note en précise le sens ancien.
- source_word: δότε
  choice: donnez-le
  rationale: L’impératif « donnez » conserve la force directe de l’ordre; « le » reprend explicitement le talent et produit une phrase française naturelle.
- source_word: τῷ ἔχοντι
  choice: à celui qui a
  rationale: Cette formulation rend fidèlement le participe substantivé sans ajouter une désignation absente du grec.
- source_word: τὰ δέκα τάλαντα
  choice: les dix talents
  rationale: L’article défini conserve la référence à la somme précise déjà mentionnée dans le récit.
theological_decisions:
- issue: Sens de τάλαντον dans la parabole
  choice: Conserver le terme historique « talent » en l’expliquant comme une grande unité de poids et, par extension, de valeur monétaire.
  alternative: Traduire directement par « somme d’argent » ou « argent ».
  rationale: Le grec désigne une unité historique concrète dans une parabole portant sur des biens confiés. Le maintien de « talent » préserve l’image du texte sans lui imposer le sens moderne d’aptitude naturelle; la note prévient cette méprise.
translation_notes:
  register: Français moderne, international et digne. « Enlevez-lui » associe naturellement αἴρω et ἀπό, si bien qu’une note sur la variante « retirez-lui » n’est pas nécessaire. Le terme historique « talent » est conservé, avec une note culturelle pour éviter le sens moderne de capacité innée.
