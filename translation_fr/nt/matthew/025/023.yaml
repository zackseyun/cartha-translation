  verdict: revise
  source_fidelity: Le texte rend correctement l'adresse élogieuse, la répétition de « fidèle », l'image d'« entrer dans la joie » et le sens parabolique de κύριος par « maître ». Toutefois, « je te confierai la responsabilité de beaucoup » neutralise trop le parallélisme explicite entre « peu de choses » (ὀλίγα) et « beaucoup de choses » (πολλῶν), et rend moins nettement l'idée d'être établi sur un domaine de responsabilité.
  naturalness: Le français est moderne, fluide et d'un registre approprié. « Je te donnerai la charge de beaucoup de choses » est idiomatique tout en étant plus précis que la formulation proposée.
  terminology: « Maître » convient à κύριος dans le cadre narratif de la parabole. « Serviteur » est un choix français recevable pour δοῦλος, avec une note qui conserve l'alternative « esclave ». « Bon et fidèle » préserve utilement la répétition de πιστός.
  issues:
  - severity: medium
    issue: La seconde responsabilité confiée n'est pas formulée en parallèle explicite avec « peu de choses ».
    rationale: ἐπὶ πολλῶν σε καταστήσω signifie littéralement qu'il sera établi « sur beaucoup [de choses] ». « La responsabilité de beaucoup » peut se comprendre, mais laisse l'objet elliptique et atténue le contraste structurel avec « peu de choses ». « Je te donnerai la charge de beaucoup de choses » conserve à la fois le parallélisme et le sens d'une nomination à une responsabilité accrue.
