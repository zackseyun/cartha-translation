reference: Matthew 25:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ κύριος αὐτοῦ· Εὖ, δοῦλε ἀγαθὲ καὶ πιστέ, ἐπὶ ὀλίγα ἦς πιστός, ἐπὶ πολλῶν σε καταστήσω· εἴσελθε εἰς τὴν χαρὰν τοῦ κυρίου σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/023.yaml
  text: His master said to him[a], ‘Well done, good and faithful servant. You were faithful over a few things; I will put you over many things. Enter into the joy of your master.’
translation:
  language: fr
  text: 'Son maître lui dit : « Très bien, bon et fidèle serviteur[a] ! Tu as été fidèle dans peu de choses ; je te donnerai la charge de beaucoup de choses. Entre dans la joie de ton maître. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclave ». Le mot grec δοῦλος peut désigner un serviteur ou un esclave selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: dit
  rationale: Introduction narrative naturelle et fidèle du discours direct.
- source_word: ὁ κύριος αὐτοῦ / τοῦ κυρίου σου
  choice: son maître / ton maître
  rationale: Dans le cadre interne de la parabole, κύριος désigne le supérieur du serviteur ; « maître » exprime clairement cette relation sans imposer ici le titre divin « Seigneur ».
- source_word: Εὖ
  choice: Très bien
  rationale: Formule française actuelle d'approbation, adaptée à l'emploi évaluatif de l'adverbe grec.
- source_word: δοῦλε
  choice: serviteur[a]
  rationale: « Serviteur » est naturel dans cette parabole de gestion domestique, tandis qu'une note conserve la possibilité lexicale plus forte de « esclave ».
- source_word: ἀγαθὲ καὶ πιστέ
  choice: bon et fidèle
  rationale: Rend directement les deux adjectifs au vocatif et maintient le lien lexical entre πιστέ et πιστός.
- source_word: ἐπὶ ὀλίγα ἦς πιστός
  choice: tu as été fidèle dans peu de choses
  rationale: « Dans » exprime idiomatiquement le domaine où la fidélité a été démontrée, sans préciser plus que le grec la nature des biens confiés.
- source_word: ἐπὶ πολλῶν σε καταστήσω
  choice: je te confierai la responsabilité de beaucoup
  rationale: καθίστημι signifie ici établir ou placer quelqu'un dans une fonction. Cette formulation française rend explicitement la responsabilité accrue, tout en conservant le contraste peu/beaucoup.
- source_word: εἴσελθε εἰς τὴν χαρὰν
  choice: entre dans la joie
  rationale: Conserve l'image grecque d'une entrée dans la joie plutôt que de la réduire à la simple idée de participation.
theological_decisions:
- issue: Sens de κύριος dans la parabole
  choice: maître
  alternative: Seigneur
  rationale: Le référent au niveau du récit est le maître humain du serviteur. La portée théologique de la parabole reste perceptible sans transformer le nom commun en titre explicite.
- issue: Rendu de δοῦλος
  choice: serviteur
  alternative: esclave
  rationale: Le verset met l'accent sur la fidélité dans une responsabilité confiée. « Serviteur » convient au registre de la parabole, mais « esclave » demeure une traduction possible et est signalé en note.
- issue: Nature de la récompense exprimée par καταστήσω
  choice: je te confierai la responsabilité de beaucoup
  alternative: je t'établirai sur beaucoup de choses
  rationale: La formulation choisie exprime une nomination à une responsabilité plus grande sans déterminer si les « nombreuses choses » sont des biens, des tâches ou un domaine d'autorité.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à la relation directe du maître avec son subordonné. Le parallélisme entre « peu de choses » et « beaucoup » est préservé, ainsi que la répétition de « fidèle » et l'image finale de l'entrée dans la joie.
