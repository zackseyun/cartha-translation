  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ τὸ ἓν λαβὼν ἀπελθὼν ὤρυξεν ⸀γῆν καὶ ⸀ἔκρυψεν τὸ ἀργύριον τοῦ κυρίου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/018.yaml
  text: But the one who had received the one talent went away[a], dug in the ground, and hid his master's money.
translation:
  language: fr
  text: Mais celui qui n’avait reçu qu’un talent s’en alla, creusa dans la terre et y cacha l’argent[a] de son maître.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner l’argent métal ou, plus généralement, de l’argent au sens de monnaie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mais celui
  rationale: δέ marque ici le contraste avec les serviteurs précédents, tandis que l’article substantivé désigne le serviteur caractérisé par la suite de la phrase.
- source_word: τὸ ἓν
  choice: qu’un talent
  rationale: Le grec dit elliptiquement « l’unique » ou « le seul »; « talent » est repris du contexte immédiat de Matthieu 25.15. La tournure « ne… que » exprime naturellement en français qu’il en avait reçu un seul.
- source_word: λαβὼν
  choice: n’avait reçu
  rationale: Le participe désigne une action antérieure aux verbes principaux. « Recevoir » convient au serviteur auquel le maître a confié cette somme.
- source_word: ἀπελθὼν
  choice: s’en alla
  rationale: Cette formulation française courante conserve l’idée d’un déplacement au loin et la succession narrative.
- source_word: ὤρυξεν γῆν
  choice: creusa dans la terre
  rationale: La formulation rend l’action de creuser le sol sans ajouter explicitement « un trou », bien que celui-ci soit naturellement impliqué.
- source_word: ἔκρυψεν
  choice: y cacha
  rationale: « Cacher » est l’équivalent direct et naturel; « y » rattache clairement l’action à la terre qui vient d’être creusée.
- source_word: τὸ ἀργύριον
  choice: l’argent
  rationale: ἀργύριον peut désigner l’argent métal ou, par extension, une somme d’argent. Dans cette parabole financière, « l’argent » reste naturel en français et conserve utilement les deux nuances.
- source_word: τοῦ κυρίου αὐτοῦ
  choice: de son maître
  rationale: Dans le cadre narratif de la parabole, κύριος désigne le maître humain du serviteur. « Maître » exprime clairement cette relation sans transformer le mot en titre divin.
theological_decisions:
- issue: Traduction de κύριος dans le cadre humain de la parabole
  choice: maître
  alternative: seigneur
  rationale: Le référent immédiat est le supérieur humain du serviteur dans le récit. « Maître » rend la relation d’autorité en français moderne, tout en évitant d’imposer ici un titre explicitement divin.
- issue: Valeur de ἀργύριον
  choice: argent
  alternative: monnaie ou somme d’argent
  rationale: Le français « argent » convient au contexte financier tout en laissant subsister l’arrière-plan matériel de l’argent métal, sans résoudre inutilement la polysémie grecque.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste fluide, et l’ellipse grecque est explicitée par « talent » à partir du contexte immédiat.
