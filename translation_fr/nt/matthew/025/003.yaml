  text: For the foolish[a], when they took their lamps, did not take oil with them.
translation:
  language: fr
  text: Car les insensées, lorsqu’elles prirent leurs lampes[a], ne prirent pas d’huile avec elles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « torches ».'
