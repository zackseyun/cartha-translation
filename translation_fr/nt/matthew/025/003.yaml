lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: Introduit l’explication de l’affirmation précédente et conserve clairement le lien logique.
- source_word: μωραὶ
  choice: les insensées
  rationale: L’adjectif féminin pluriel renvoie aux jeunes filles mentionnées dans le contexte, sans qu’il soit nécessaire de répéter le nom.
- source_word: λαβοῦσαι
  choice: lorsqu’elles prirent
  rationale: Le participe aoriste est rendu naturellement avec une valeur temporelle, tout en conservant sa relation avec le verbe principal.
- source_word: λαμπάδας
  choice: lampes
  rationale: « Lampes » est le terme traditionnel et convient à la mention immédiate de l’huile; « torches » reste une possibilité lexicale signalée en note.
- source_word: οὐκ ἔλαβον
  choice: ne prirent pas
  rationale: Conserve la répétition du verbe grec λαμβάνω entre le participe et le verbe principal.
- source_word: μεθ’ ἑαυτῶν
  choice: avec elles
  rationale: Équivalent français idiomatique de l’expression réfléchie grecque.
- source_word: ἔλαιον
  choice: d’huile
  rationale: Rend directement le nom grec et le partitif est naturel après la négation en français.
