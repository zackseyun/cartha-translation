source:
  edition: SBLGNT
  text: καὶ προσελθὼν ὁ τὰ πέντε τάλαντα λαβὼν προσήνεγκεν ἄλλα πέντε τάλαντα λέγων· Κύριε, πέντε τάλαντά μοι παρέδωκας· ἴδε ἄλλα πέντε τάλαντα ⸀ἐκέρδησα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/020.yaml
  text: And the one who had received the five talents came forward and brought another five talents[a], saying, ‘Lord, you delivered five talents to me; look[b], I have gained another five talents.’
translation:
  language: fr
  text: 'Celui qui avait reçu les cinq talents[b] s’avança et apporta cinq autres talents, en disant : « Seigneur[a], tu m’as remis cinq talents ; regarde, j’ai gagné cinq autres talents. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Maître ». Grec : kyrios.'
    reason: alternative_reading
  - marker: b
    text: Le talent était une grande unité de poids, employée comme unité monétaire.
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: s’avança
  rationale: Le participe aoriste de προσέρχομαι décrit l’approche du serviteur dans une scène où il vient rendre compte. « S’avança » est naturel et conserve ce mouvement vers le maître.
- source_word: ὁ τὰ πέντε τάλαντα λαβὼν
  choice: celui qui avait reçu les cinq talents
  rationale: La construction participiale substantivée identifie le serviteur par une action antérieure. Le plus-que-parfait français exprime clairement cette antériorité sans ajouter un nom absent du grec.
- source_word: τάλαντα
  choice: talents
  rationale: Le talent était une très grande unité de poids et, par extension, de valeur monétaire. Le terme traditionnel « talent » préserve l’image propre à la parabole, tandis qu’une note en précise le sens ancien.
- source_word: προσήνεγκεν
  choice: apporta
  rationale: Dans ce contexte, προσφέρω désigne le fait d’apporter la somme supplémentaire devant le maître. « Apporta » est direct et n’introduit aucune connotation cultuelle.
- source_word: ἄλλα πέντε τάλαντα
  choice: cinq autres talents
  rationale: ἄλλα accompagné du nombre désigne une seconde somme égale à la première. « Cinq autres talents » rend clairement cette addition.
- source_word: Κύριε
  choice: Seigneur
  rationale: Κύριε est ici une adresse respectueuse au maître de la parabole. « Seigneur » conserve la correspondance lexicale et la résonance narrative possible, tandis qu’une note signale « Maître » comme autre traduction contextuelle.
- source_word: παρέδωκας
  choice: tu m’as remis
  rationale: παραδίδωμι signifie remettre ou livrer quelque chose à quelqu’un. « Tu m’as remis » reste proche du grec et convient naturellement à la remise d’une somme, sans expliciter davantage l’idée implicite de confiance.
- source_word: ἴδε
  choice: regarde
  rationale: L’impératif sert à attirer l’attention sur le résultat présenté. « Regarde » est vivant, courant et moins archaïque que « voici » ou « vois » dans cet emploi.
- source_word: ἐκέρδησα
  choice: j’en ai gagné
  rationale: κερδαίνω signifie gagner ou réaliser un profit. Le passé composé exprime une action achevée dont le résultat est maintenant présenté, et le pronom « en » reprend naturellement les talents.
theological_decisions:
- issue: Traduction de κύριος dans l’adresse parabolique
  choice: Seigneur
  alternative: Maître
  rationale: Dans la situation racontée, le mot désigne le maître du serviteur. « Seigneur » maintient néanmoins la valeur habituelle de κύριος et sa possible portée narrative chez Matthieu, sans imposer à ce verset une identification christologique explicite. La variante contextuelle est donnée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le déroulement du grec sans lourdeur. Les répétitions de « cinq » et de « talents » sont conservées pour maintenir la symétrie du récit ; seul le dernier emploi est repris par « en », conformément à l’usage naturel du français.
