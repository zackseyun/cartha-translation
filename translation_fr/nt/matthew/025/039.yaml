id: MAT.25.39
reference: Matthew 25:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πότε δέ σε εἴδομεν ⸀ἀσθενοῦντα ἢ ἐν φυλακῇ καὶ ἤλθομεν πρός σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/039.yaml
  text: And when did we see you sick or in prison and come to you?[a]
translation:
  language: fr
  text: Et quand t’avons-nous vu malade ou en prison, et sommes-nous venus auprès de toi ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « t’avons-nous rendu visite ? » Le grec dit plus littéralement « sommes-nous venus auprès de toi ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: πότε
  choice: quand
  rationale: Adverbe interrogatif temporel ; « quand » est l’équivalent français naturel dans une question directe.
- source_word: δέ
  choice: et
  rationale: Ici, δέ assure une liaison légère dans une série de questions. « Et » convient mieux qu’un terme fortement adversatif.
- source_word: εἴδομεν
  choice: avons-nous vu
  rationale: L’aoriste de ὁράω renvoie à une action passée ; le passé composé avec inversion est naturel en français dans cette question directe.
- source_word: ἀσθενοῦντα
  choice: malade
  rationale: Dans le contexte des besoins physiques énumérés, le participe décrit l’état de maladie plutôt qu’une faiblesse au sens large.
- source_word: ἐν φυλακῇ
  choice: en prison
  rationale: φυλακή désigne ici un lieu de détention. « En prison » est clair, courant et d’un registre approprié.
- source_word: ἤλθομεν πρός σε
  choice: sommes-nous venus auprès de toi
  rationale: Cette formulation conserve le verbe de mouvement ἔρχομαι et rend πρός σε de façon naturelle, sans introduire directement le sens plus précis de « rendre visite ».
theological_decisions:
- issue: Faut-il rendre ἤλθομεν πρός σε par « sommes-nous venus auprès de toi » ou par « t’avons-nous rendu visite » ?
  choice: sommes-nous venus auprès de toi
  alternative: t’avons-nous rendu visite
  rationale: Le grec exprime littéralement le fait de venir vers quelqu’un, sans employer un verbe signifiant explicitement « rendre visite ». Le texte principal conserve donc cette simplicité, tandis que la note signale l’interprétation idiomatique possible.
translation_notes:
  register: Français international moderne, digne et accessible. L’inversion interrogative maintient le ton soutenu du discours sans archaïsme ; « auprès de toi » reste naturel tout en étant proche de la formulation grecque.
