id: MAT.25.37
reference: Matthew 25:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· Κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/037.yaml
  text: Then the righteous will answer him[a], saying, ‘Lord, when did we see you hungry and feed you, or thirsty and give you drink?’
translation:
  language: fr
  text: 'Alors les justes lui répondront : « Seigneur, quand t’avons-nous vu avoir faim et t’avons-nous donné à manger, ou avoir soif et t’avons-nous donné à boire ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession dans le discours et convient au registre narratif français.
- source_word: ἀποκριθήσονται αὐτῷ
  choice: lui répondront
  rationale: Rend le futur de ἀποκρίνομαι et le datif αὐτῷ dans une construction française idiomatique.
- source_word: οἱ δίκαιοι
  choice: les justes
  rationale: L’adjectif substantivé désigne ceux qui sont reconnus comme justes dans la scène; « les justes » est la formulation française établie et naturelle.
- source_word: λέγοντες
  choice: — introduit directement les paroles après les deux-points
  rationale: En français, le participe introducteur serait redondant après « répondront »; la ponctuation en conserve naturellement la fonction discursive.
- source_word: Κύριε
  choice: Seigneur
  rationale: Conserve à la fois l’adresse respectueuse et la portée christologique possible de κύριος sans la préciser davantage.
- source_word: πότε σε εἴδομεν
  choice: quand t’avons-nous vu
  rationale: Rend directement l’interrogatif temporel et l’aoriste de ὁράω dans une syntaxe française naturelle.
- source_word: πεινῶντα
  choice: avoir faim
  rationale: Après « voir », l’infinitif « avoir faim » exprime naturellement l’état indiqué par le participe présent grec.
- source_word: ἐθρέψαμεν
  choice: t’avons-nous donné à manger
  rationale: Exprime concrètement et idiomatiquement l’action de nourrir dans ce contexte.
- source_word: διψῶντα
  choice: avoir soif
  rationale: Construction française naturelle, parallèle à « avoir faim », pour le participe grec.
- source_word: ἐποτίσαμεν
  choice: t’avons-nous donné à boire
  rationale: Rend précisément et idiomatiquement le causatif concret « faire boire, donner à boire ».
theological_decisions:
- issue: Sens du titre κύριος adressé à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » préserve le titre respectueux ainsi que sa résonance christologique dans Matthieu, sans imposer une interprétation plus étroite.
- issue: Désignation οἱ δίκαιοι
  choice: les justes
  alternative: ceux qui sont justes
  rationale: Le substantif français traditionnel conserve la qualification morale et judiciaire du grec sans expliquer ici le fondement de leur justice.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « t’avons-nous » maintient le parallélisme interrogatif grec tout en restant naturelle. Aucun marqueur de note n’est requis.
