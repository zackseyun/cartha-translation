id: MAT.25.34
reference: Matthew 25:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· Δεῦτε, οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/034.yaml
  text: Then the King will say to those on his right[a], ‘Come, you who are blessed by my Father[b], inherit the kingdom prepared for you from the foundation of the world.’
translation:
  language: fr
  text: 'Alors le Roi dira à ceux qui sont à sa droite : « Venez, vous qui êtes bénis par mon Père[a], recevez en héritage le royaume qui a été préparé pour vous dès la fondation du monde[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « bénis de mon Père »; le sens est que la bénédiction vient du Père.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « depuis la fondation du monde ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans la scène du jugement.
- source_word: ὁ βασιλεὺς
  choice: le Roi
  rationale: Le groupe défini désigne ici le roi précis de la scène; la majuscule signale son emploi comme titre dans ce contexte.
- source_word: τοῖς ἐκ δεξιῶν αὐτοῦ
  choice: à ceux qui sont à sa droite
  rationale: Expression française actuelle qui conserve la position spatiale et sa valeur honorifique implicite.
- source_word: Δεῦτε
  choice: Venez
  rationale: Rend directement et dignement l'appel impératif.
- source_word: οἱ εὐλογημένοι τοῦ πατρός μου
  choice: vous qui êtes bénis par mon Père
  rationale: Le participe parfait passif décrit un état résultant d'une bénédiction reçue; « par mon Père » exprime clairement la source ou l'agent du passif.
- source_word: κληρονομήσατε
  choice: recevez en héritage
  rationale: Conserve la notion d'héritage portée par le verbe, tout en étant plus naturelle ici que l'impératif français « héritez ».
- source_word: τὴν … βασιλείαν
  choice: le royaume
  rationale: Avec l'idée de recevoir en héritage et d'une réalité préparée, « royaume » convient mieux que le seul sens abstrait de « règne ».
- source_word: τὴν ἡτοιμασμένην ὑμῖν βασιλείαν
  choice: le royaume qui a été préparé pour vous
  rationale: La tournure conserve le passif et l'idée d'une préparation accomplie dont le résultat demeure.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: dès la fondation du monde
  rationale: Rend le point de départ indiqué par ἀπό dans un français naturel; « depuis » reste également possible.
theological_decisions:
- issue: Valeur du génitif τοῦ πατρός μου après « bénis »
  choice: bénis par mon Père
  alternative: bénis de mon Père
  rationale: Le génitif désigne naturellement la source ou l'agent de la bénédiction. La formulation retenue est claire en français moderne sans ajouter de précision doctrinale.
- issue: Sens de βασιλεία dans ce contexte eschatologique
  choice: royaume
  alternative: règne
  rationale: L'association avec l'héritage et avec ce qui a été préparé favorise ici le domaine royal reçu, sans nier la notion plus large de règne.
- issue: Rattachement de ἀπὸ καταβολῆς κόσμου
  choice: La locution précise depuis quand le royaume a été préparé.
  alternative: La comprendre plus largement comme portant sur l'ensemble de l'invitation.
  rationale: Son rattachement au participe « préparé » est le plus proche et le plus naturel syntaxiquement, sans développer un système doctrinal au-delà du verset.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Recevez en héritage » préserve la nuance familiale et biblique sans employer l'impératif peu naturel « héritez ». Les guillemets français et la ponctuation suivent l'usage éditorial français.
