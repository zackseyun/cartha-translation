id: MAT.25.11
reference: Matthew 25:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὕστερον δὲ ἔρχονται καὶ αἱ λοιπαὶ παρθένοι λέγουσαι· Κύριε κύριε, ἄνοιξον ἡμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/011.yaml
  text: Later[a], the other virgins also come, saying, ‘Lord, lord[c][b], open to us.’
translation:
  language: fr
  text: 'Plus tard, les autres jeunes filles[a] viennent elles aussi et disent : « Seigneur, Seigneur[b], ouvre-nous[c] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les autres vierges », ou « les jeunes filles restantes ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « Maître, Maître », voire « Monsieur, Monsieur ». Grec : Kyrios, kyrios.'
    reason: alternative_reading
  - marker: c
    text: Le grec dit simplement « ouvre-nous » ; la porte est sous-entendue d’après le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: Plus tard
  rationale: Cette locution marque naturellement en français la suite temporelle du récit, sans préciser davantage l’intervalle.
- source_word: δὲ
  choice: —
  rationale: 'Cette particule de transition légère n’a pas besoin d’un équivalent distinct : « Plus tard » assure déjà l’enchaînement naturel.'
- source_word: ἔρχονται
  choice: viennent
  rationale: Le présent français conserve le présent narratif vivant du grec.
- source_word: καὶ
  choice: elles aussi
  rationale: Cette formulation rend clairement la valeur additive de καί et s’intègre naturellement à la phrase française.
- source_word: αἱ λοιπαὶ παρθένοι
  choice: les autres jeunes filles
  rationale: « Les autres » rend λοιπαί, qui peut aussi signifier « celles qui restent ». Dans le cadre de la parabole, « jeunes filles » est un équivalent français courant et digne de παρθένοι ; la traduction plus formelle « vierges » est signalée en note.
- source_word: λέγουσαι
  choice: et disent
  rationale: La coordination est plus naturelle en français que le participe « disant », tout en conservant l’action simultanée qui introduit les paroles.
- source_word: Κύριε κύριε
  choice: Seigneur, Seigneur
  rationale: La répétition exprime l’insistance de l’appel. « Seigneur » préserve à la fois la possibilité d’un titre respectueux dans la parabole et la résonance théologique du terme chez Matthieu.
- source_word: ἄνοιξον ἡμῖν
  choice: ouvre-nous
  rationale: 'Cette tournure française concise conserve l’objet implicite du verbe grec : le contexte indique qu’il s’agit de la porte, sans que celle-ci soit nommée dans le texte source.'
theological_decisions:
- issue: Sens de κύριος dans l’adresse directe
  choice: Seigneur
  alternative: Maître, ou Monsieur
  rationale: Dans cette parabole, κύριος peut fonctionner comme une adresse respectueuse, mais « Seigneur » maintient aussi l’éventuelle portée théologique du vocabulaire matthéen sans trancher silencieusement entre les deux.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif est conservé. « Jeunes filles » évite en français courant une formulation inutilement marquée tout en laissant « vierges » accessible en note. La ponctuation française et le point d’exclamation rendent l’urgence de l’impératif et de l’appel répété.
