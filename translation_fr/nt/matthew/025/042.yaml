  text: ἐπείνασα γὰρ καὶ οὐκ ἐδώκατέ μοι φαγεῖν, ⸀ἐδίψησα καὶ οὐκ ἐποτίσατέ με,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/025/042.yaml
  text: For I was hungry and you gave me nothing to eat[a]; I was thirsty and you gave me nothing to drink.
translation:
  language: fr
  text: Car j’ai eu faim et vous ne m’avez rien donné à manger[a] ; j’ai eu soif et vous ne m’avez rien donné à boire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « vous ne m’avez pas donné à manger… vous ne m’avez pas donné à boire ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἐπείνασα
  choice: j’ai eu faim
  rationale: L’aoriste décrit ici un état passé. « J’ai eu faim » est l’expression française naturelle et actuelle.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit la raison du jugement énoncé dans le contexte. « Car » en conserve clairement la valeur explicative.
- source_word: ἐδώκατέ μοι φαγεῖν
  choice: vous ne m’avez rien donné à manger
  rationale: Cette formulation idiomatique conserve la négation, le bénéficiaire personnel μοι et l’infinitif verbal φαγεῖν.
- source_word: ἐδίψησα
  choice: j’ai eu soif
  rationale: Cette expression française naturelle respecte le parallélisme avec « j’ai eu faim ».
- source_word: ἐποτίσατέ με
  choice: vous ne m’avez rien donné à boire
  rationale: Dans ce contexte, ποτίζω signifie donner à boire. La formulation retenue est naturelle et reproduit le parallélisme de la première proposition.
theological_decisions:
- issue: Degré d’explicitation des propositions négatives décrivant l’absence de secours
  choice: vous ne m’avez rien donné à manger… vous ne m’avez rien donné à boire
  alternative: vous ne m’avez pas donné à manger… vous ne m’avez pas donné à boire
  rationale: La formulation choisie exprime nettement la privation totale sans ajouter de contenu doctrinal et maintient l’accent du passage sur le secours personnel refusé.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé rend naturellement les aoristes dans ce discours, tandis que le parallélisme entre la faim et la soif est maintenu.
