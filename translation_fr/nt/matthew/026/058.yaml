  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ἠκολούθει αὐτῷ ἀπὸ μακρόθεν ἕως τῆς αὐλῆς τοῦ ἀρχιερέως, καὶ εἰσελθὼν ἔσω ἐκάθητο μετὰ τῶν ὑπηρετῶν ἰδεῖν τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/058.yaml
  text: But Peter was following him from a distance[a], as far as the courtyard of the high priest. And after going inside[b], he sat with the officers to see the outcome.
translation:
  language: fr
  text: Mais Pierre le suivait de loin jusqu’à la cour du grand-prêtre. Une fois entré, il était assis avec les agents[a] pour voir quelle serait l’issue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les serviteurs », « les assistants » ou « les gardes ». Le grec ὑπηρέται peut désigner des subordonnés, des assistants ou des agents ; la nuance exacte dépend du contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « pour voir la fin ». Ici, le grec τὸ τέλος désigne probablement l’issue de ce qui allait arriver à Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: le suivait
  rationale: L’imparfait grec présente l’action comme en cours à l’arrière-plan; l’imparfait français en rend naturellement l’aspect.
- source_word: ἀπὸ μακρόθεν
  choice: de loin
  rationale: Expression française courante qui conserve l’idée de distance physique.
- source_word: ἕως τῆς αὐλῆς
  choice: jusqu’à la cour
  rationale: ἕως exprime ici la limite atteinte, et αὐλή désigne la cour intérieure ou cour fermée de la résidence.
- source_word: τοῦ ἀρχιερέως
  choice: du grand-prêtre
  rationale: Rendu français usuel et précis dans le récit de la Passion.
- source_word: εἰσελθὼν ἔσω
  choice: Une fois entré
  rationale: Le participe aoriste accompagné de ἔσω indique une entrée antérieure à l’action principale; cette tournure restitue clairement la succession sans lourdeur.
- source_word: ἐκάθητο
  choice: il s’assit
  rationale: Bien que l’imparfait grec puisse décrire la position assise comme continue, le passé simple est plus naturel dans cette séquence narrative française et exprime son installation parmi les agents.
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: avec les agents
  rationale: ὑπηρέται désigne ici des subordonnés attachés à l’autorité du grand-prêtre. « Agents » rend leur fonction sans les réduire à des domestiques ni préciser indûment qu’ils étaient tous des gardes armés.
- source_word: ἰδεῖν
  choice: pour voir
  rationale: L’infinitif exprime le but; « pour voir » en conserve directement la formulation.
- source_word: τὸ τέλος
  choice: quelle serait l’issue
  rationale: Dans ce contexte, τέλος vise vraisemblablement le dénouement des événements. La formulation française explicite ce sens contextuel tout en signalant en note le rendu plus littéral.
