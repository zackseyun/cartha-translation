source:
  edition: SBLGNT
  text: τότε λέγει αὐτῷ ὁ Ἰησοῦς· Ἀπόστρεψον ⸂τὴν μάχαιράν σου⸃ εἰς τὸν τόπον αὐτῆς, πάντες γὰρ οἱ λαβόντες μάχαιραν ἐν μαχαίρῃ ⸀ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/052.yaml
  text: Then Jesus said to him[a], “Put your sword back in its place, for all who take up the sword will perish by the sword.”
translation:
  language: fr
  text: 'Alors Jésus lui dit : « Remets ton épée à sa place, car tous ceux qui prennent l’épée[a] périront par l’épée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tous ceux qui se saisissent de l’épée ». L’expression peut évoquer le recours à la violence armée, et non le simple fait de tenir une arme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la succession immédiate des événements dans le récit.
- source_word: λέγει αὐτῷ
  choice: Jésus lui dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel de la narration française écrite.
- source_word: Ἀπόστρεψον τὴν μάχαιράν σου εἰς τὸν τόπον αὐτῆς
  choice: Remets ton épée à sa place
  rationale: L’impératif demande un geste immédiat de retour; « remets » exprime clairement que l’arme doit retrouver sa place. « Épée » est le terme conventionnel et intelligible pour μάχαιρα dans cette scène.
- source_word: πάντες γὰρ οἱ λαβόντες μάχαιραν
  choice: car tous ceux qui prennent l’épée
  rationale: Le participe substantivé a ici une portée générale. La formulation conserve aussi l’ambiguïté entre saisir l’arme et y recourir comme moyen de violence.
- source_word: ἐν μαχαίρῃ ἀπολοῦνται
  choice: périront par l’épée
  rationale: « Par l’épée » rend le datif instrumental, tandis que « périront » conserve la gravité et la portée proverbiale de ἀπολοῦνται sans préciser davantage le mécanisme de la mort.
theological_decisions:
- issue: Portée de la parole de Jésus sur l’épée
  choice: 'Conserver une maxime générale : « tous ceux qui prennent l’épée périront par l’épée ».'
  alternative: La présenter soit comme une interdiction absolue de toute force, soit comme une prédiction limitée au seul disciple dans cette scène.
  rationale: La construction grecque généralise explicitement. La traduction en maintient l’ampleur sans imposer une conclusion confessionnelle sur toute forme de recours à la force.
translation_notes:
  register: Français international moderne, digne et direct. Le parallélisme proverbial « prennent l’épée / périront par l’épée » est conservé. Le passé simple convient au registre narratif biblique courant sans être archaïque.
