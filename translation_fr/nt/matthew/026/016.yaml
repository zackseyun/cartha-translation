  text: καὶ ἀπὸ τότε ἐζήτει εὐκαιρίαν ἵνα αὐτὸν παραδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/016.yaml
  text: And from then on he was seeking an opportunity to hand him over[a].
translation:
  language: fr
  text: Dès lors, il cherchait une occasion de le livrer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le trahir ». Le verbe grec signifie plus littéralement « livrer » ou « remettre entre les mains de quelqu’un ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τότε
  choice: Dès lors
  rationale: Expression française naturelle qui marque le point de départ d’une action se poursuivant à partir de ce moment.
- source_word: ἐζήτει
  choice: il cherchait
  rationale: L’imparfait français rend naturellement l’aspect duratif ou répété de l’imparfait grec.
- source_word: εὐκαιρίαν
  choice: une occasion
  rationale: Rend clairement l’idée d’un moment favorable ou propice sans explicitation excessive.
- source_word: ἵνα
  choice: de
  rationale: Après « chercher une occasion », l’infinitif introduit naturellement le but exprimé par ἵνα.
- source_word: αὐτὸν
  choice: le
  rationale: Pronom objet direct renvoyant à Jésus dans le contexte.
- source_word: παραδῷ
  choice: livrer
  rationale: « Livrer » conserve le sens premier de remettre quelqu’un au pouvoir d’autrui, sans réduire le verbe au seul sens interprétatif de « trahir ».
theological_decisions:
- issue: Rendu de παραδῷ dans le contexte de Judas
  choice: le livrer
  alternative: le trahir
  rationale: Le geste constitue bien une trahison dans le contexte, mais le verbe grec désigne plus largement l’action de livrer ou remettre quelqu’un. Le texte principal préserve cette portée lexicale, et la note signale l’autre rendu possible.
translation_notes:
  register: Français moderne, sobre et digne. « Dès lors » est concis et idiomatique; « il cherchait » garde la durée de l’action; « livrer » préserve l’ambiguïté lexicale pertinente.
