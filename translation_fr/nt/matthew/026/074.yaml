  edition: SBLGNT
  text: τότε ἤρξατο καταθεματίζειν καὶ ὀμνύειν ὅτι Οὐκ οἶδα τὸν ἄνθρωπον. καὶ ⸀εὐθέως ἀλέκτωρ ἐφώνησεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/074.yaml
  text: Then he began to curse and to swear[a], “I do not know the man.” And immediately a rooster crowed.
translation:
  language: fr
  text: 'Alors il se mit à lancer des imprécations et à jurer[a] : « Je ne connais pas cet homme. » Et aussitôt, un coq chanta.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il se mit à appeler des malédictions et à jurer ». Il s’agit probablement d’imprécations contre lui-même pour renforcer son reniement, mais le grec n’en précise pas la cible.'
    reason: Précise la portée de καταθεματίζειν et le sens de ὀμνύειν, tout en conservant l’ambiguïté du texte grec quant à la cible des imprécations.
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la succession immédiate des événements dans le récit.
- source_word: ἤρξατο
  choice: il se mit à
  rationale: Rend l’aspect ingréssif et souligne l’escalade dans le reniement de Pierre.
- source_word: καταθεματίζειν
  choice: invoquer des malédictions
  rationale: Rend l’idée d’appeler une malédiction sans réduire le verbe à l’emploi de paroles grossières ni préciser dans le texte principal qui en est l’objet.
- source_word: ὀμνύειν
  choice: jurer
  rationale: Désigne ici le fait d’affirmer sous serment; le verbe français est concis et naturel dans ce contexte.
- source_word: ὅτι
  choice: deux-points et discours direct
  rationale: Introduit le contenu du serment; le discours direct est la formulation française la plus claire.
- source_word: Οὐκ οἶδα τὸν ἄνθρωπον
  choice: Je ne connais pas cet homme
  rationale: Exprime directement le refus de reconnaître Jésus; « cet homme » est idiomatique en français dans cette situation de désignation distante.
- source_word: καὶ εὐθέως
  choice: Et aussitôt
  rationale: Conserve la coordination narrative et l’immédiateté de l’accomplissement de la prédiction.
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: un coq chanta
  rationale: Expression française habituelle pour le cri du coq; l’article indéfini convient au nom grec sans article.
theological_decisions:
- issue: Sens de καταθεματίζειν dans le reniement de Pierre
  choice: Le texte principal dit qu’il invoque des malédictions, sans en désigner explicitement l’objet.
  alternative: Préciser qu’il appelle des malédictions sur lui-même, ou comprendre qu’il maudit Jésus.
  rationale: Associé à ὀμνύειν, le verbe évoque probablement une imprécation destinée à renforcer son serment, vraisemblablement contre lui-même s’il ment. Toutefois, le complément réfléchi n’est pas exprimé dans le grec; il convient donc de conserver cette nuance dans une note plutôt que de l’imposer au texte, et rien n’indique qu’il maudisse Jésus.
translation_notes:
  register: Français international moderne, sobre et digne. « Il se mit à » restitue l’escalade narrative; « invoquer des malédictions » évite de faire penser à de simples grossièretés. La formulation conserve l’ambiguïté réelle quant à la cible des malédictions.
