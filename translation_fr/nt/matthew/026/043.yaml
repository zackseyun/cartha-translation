  yaml_path: translation/nt/matthew/026/043.yaml
  text: And coming again[a], he found them sleeping, for their eyes were weighed down.
translation:
  language: fr
  text: Puis il revint et les trouva endormis, car leurs yeux étaient lourds.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν πάλιν
  choice: Puis il revint
  rationale: Le participe aoriste suivi de πάλιν exprime ici le retour de Jésus avant l’action principale. « Puis il revint » rend naturellement la progression narrative et l’idée de répétition.
- source_word: εὗρεν αὐτοὺς καθεύδοντας
  choice: il les trouva endormis
  rationale: La construction avec le participe présent décrit l’état dans lequel Jésus les trouve. « Endormis » est idiomatique en français et conserve cette valeur circonstancielle.
- source_word: ἦσαν γὰρ
  choice: car … étaient
  rationale: « Car » maintient la fonction explicative de γάρ sans transformer le lien logique.
- source_word: αὐτῶν οἱ ὀφθαλμοὶ
  choice: leurs yeux
  rationale: Le possessif français rend naturellement la construction grecque.
- source_word: βεβαρημένοι
  choice: étaient lourds
  rationale: Le participe parfait passif indique un état résultant de lourdeur. L’expression française usuelle « avoir les yeux lourds » restitue clairement l’image dans ce contexte de sommeil.
theological_decisions: []
