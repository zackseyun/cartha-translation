source:
  edition: SBLGNT
  text: Οἱ δὲ κρατήσαντες τὸν Ἰησοῦν ἀπήγαγον πρὸς Καϊάφαν τὸν ἀρχιερέα, ὅπου οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι συνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/057.yaml
  text: Those who had seized Jesus led him away to Caiaphas the high priest[a], where the scribes and the elders had gathered.
translation:
  language: fr
  text: Ceux qui s’étaient emparés de Jésus l’emmenèrent chez Caïphe, le grand prêtre, où les scribes et les anciens s’étaient rassemblés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avaient été réunis ». Dans ce contexte, la forme verbale grecque peut indiquer soit qu’ils s’étaient rassemblés, soit qu’ils avaient été réunis par d’autres.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ
  choice: Ceux qui
  rationale: L’article avec le participe forme un groupe substantivé, rendu naturellement par « Ceux qui ». La particule δέ fait avancer le récit sans exiger ici un connecteur français explicite.
- source_word: κρατήσαντες
  choice: s’étaient emparés de
  rationale: L’aoriste participial exprime une action antérieure à celle du verbe principal. « S’étaient emparés de » conserve l’idée de saisir et de détenir sans introduire la précision juridique plus interprétative d’« arrêter ».
- source_word: ἀπήγαγον
  choice: l’emmenèrent
  rationale: Le verbe désigne le fait de conduire quelqu’un ailleurs. « L’emmenèrent » est idiomatique en français et convient au déplacement de Jésus sous escorte.
- source_word: πρὸς Καϊάφαν
  choice: chez Caïphe
  rationale: πρός avec l’accusatif marque le mouvement en direction de Caïphe. Dans ce contexte locatif, « chez Caïphe » est naturel sans préciser explicitement qu’il s’agit de sa maison.
- source_word: τὸν ἀρχιερέα
  choice: le grand prêtre
  rationale: Titre français courant et précis pour ἀρχιερεύς au singulier lorsqu’il désigne Caïphe.
- source_word: ὅπου
  choice: où
  rationale: Rend directement et naturellement l’adverbe relatif de lieu.
- source_word: οἱ γραμματεῖς
  choice: les scribes
  rationale: « Scribes » conserve le titre historique des experts des Écritures et de la Loi dans ce cadre religieux et judiciaire, sans transformer la traduction en explication.
- source_word: οἱ πρεσβύτεροι
  choice: les anciens
  rationale: Désignation établie des dirigeants reconnus du peuple dans ce contexte.
- source_word: συνήχθησαν
  choice: s’étaient rassemblés
  rationale: Le plus-que-parfait indique qu’ils se trouvaient déjà réunis quand Jésus fut amené. La tournure pronominale française rend naturellement le sens événementiel possible de la forme grecque.
