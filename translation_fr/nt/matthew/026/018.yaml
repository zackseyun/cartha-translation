  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑπάγετε εἰς τὴν πόλιν πρὸς τὸν δεῖνα καὶ εἴπατε αὐτῷ· Ὁ διδάσκαλος λέγει· Ὁ καιρός μου ἐγγύς ἐστιν· πρὸς σὲ ποιῶ τὸ πάσχα μετὰ τῶν μαθητῶν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/018.yaml
  text: He said[a], “Go into the city to a certain man and tell him, ‘The Teacher says, “My time is near[c][b]. I am keeping the Passover with you with my disciples.”’”
translation:
  language: fr
  text: 'Il dit : « Allez en ville chez un tel[a] et dites-lui : “Le Maître dit : Mon temps est proche. Je vais célébrer la Pâque chez toi avec mes disciples.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque désigne une personne précise sans la nommer; on pourrait aussi traduire « une certaine personne ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Allez
  rationale: L’impératif exprime ici un déplacement simple; « Allez » est naturel et n’ajoute aucune nuance de départ appuyé.
- source_word: εἰς τὴν πόλιν
  choice: en ville
  rationale: Expression française courante qui rend le mouvement vers la ville dans ce contexte.
- source_word: πρὸς τὸν δεῖνα
  choice: chez un tel
  rationale: δεῖνα désigne une personne précise mais laissée intentionnellement sans nom. « Un tel » conserve cette indétermination, tandis que « chez » convient à la visite demandée.
- source_word: Ὁ διδάσκαλος
  choice: Le Maître
  rationale: Dans ce message adressé à un tiers, « le Maître » fonctionne naturellement comme titre reconnu et peut désigner celui qui enseigne; « l’Enseignant » serait moins idiomatique en français.
- source_word: Ὁ καιρός μου ἐγγύς ἐστιν
  choice: Mon temps est proche
  rationale: καιρός désigne un temps significatif ou fixé. Cette formulation concise conserve l’ambiguïté du texte quant à la portée exacte de ce temps.
- source_word: πρὸς σὲ
  choice: chez toi
  rationale: Littéralement orientée vers la personne (« auprès de toi »), l’expression indique idiomatiquement le lieu où la Pâque sera célébrée. « Chez toi » reste naturel sans préciser explicitement une maison.
- source_word: ποιῶ τὸ πάσχα
  choice: Je vais célébrer la Pâque
  rationale: ποιέω avec πάσχα est un idiome signifiant célébrer ou observer la Pâque. Le présent grec exprime ici une action imminente et arrêtée; « je vais célébrer » le rend naturellement.
- source_word: μετὰ τῶν μαθητῶν μου
  choice: avec mes disciples
  rationale: « Disciples » conserve le sens relationnel établi de μαθηταί dans l’Évangile.
theological_decisions:
- issue: Portée de « mon temps » (ὁ καιρός μου)
  choice: Mon temps est proche
  alternative: Le moment fixé pour moi est proche
  rationale: Le verset annonce une échéance imminente sans préciser à lui seul s’il s’agit du repas pascal, de la mort de Jésus ou plus largement de l’aboutissement de sa mission. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Les paroles imbriquées sont distinguées par des guillemets français puis anglais. « Chez toi » est idiomatique sans ajouter le mot « maison », et « je vais célébrer » exprime naturellement l’intention imminente du présent grec.
