id: MAT.26.1
reference: Matthew 26:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς πάντας τοὺς λόγους τούτους, εἶπεν τοῖς μαθηταῖς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/001.yaml
  text: And when Jesus had finished all these words[a], he said to his disciples,
translation:
  language: fr
  text: 'Quand Jésus eut achevé de prononcer toutes ces paroles[a], il dit à ses disciples :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Et il arriva, quand Jésus eut achevé toutes ces paroles, qu’il dit à ses disciples. »'
    reason: Signale la forme narrative sémitisante de Καὶ ἐγένετο et la formulation plus littérale de ἐτέλεσεν πάντας τοὺς λόγους τούτους.
lexical_decisions:
- source_word: Καὶ ἐγένετο ὅτε
  choice: Quand
  rationale: La formule narrative sémitisante introduit ici une proposition temporelle. En français moderne, « Quand » en conserve naturellement la fonction sans le tour lourd « Et il arriva que, lorsque ».
- source_word: ἐτέλεσεν
  choice: eut achevé de prononcer
  rationale: Le passé antérieur marque l’achèvement antérieur à « il dit ». « Achever de prononcer » rend naturellement l’idée de mener à terme un ensemble de paroles ou un discours.
- source_word: πάντας τοὺς λόγους τούτους
  choice: toutes ces paroles
  rationale: « Paroles » conserve le sens concret de λόγους et la formule matthéenne qui clôt un discours, tandis que « toutes ces choses » serait moins précis.
- source_word: εἶπεν
  choice: il dit
  rationale: Équivalent narratif direct et neutre de εἶπεν.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: à ses disciples
  rationale: La traduction maintient le possessif explicite αὐτοῦ et emploie le terme français usuel pour μαθηταῖς.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et fluide. Le passé antérieur convient au registre narratif soutenu des Évangiles sans être archaïque; la note conserve la structure plus formelle du grec.
