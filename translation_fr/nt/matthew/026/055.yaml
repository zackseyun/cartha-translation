  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ὥρᾳ εἶπεν ὁ Ἰησοῦς τοῖς ὄχλοις· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με; καθ’ ⸀ἡμέραν ⸂ἐν τῷ ἱερῷ ἐκαθεζόμην διδάσκων⸃ καὶ οὐκ ἐκρατήσατέ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/055.yaml
  text: At that hour Jesus said to the crowds[a], “Have you come out with swords and clubs to arrest me, as against a robber? Day after day I was sitting in the temple teaching[b], and you did not seize me.”
translation:
  language: fr
  text: 'À ce moment-là, Jésus dit aux foules : « Êtes-vous venus avec des épées et des bâtons pour m’arrêter, comme si j’étais un bandit[a] ? Jour après jour, j’étais assis dans le temple à enseigner, et vous ne m’avez pas saisi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « brigand » ; le mot grec peut aussi désigner, dans certains contextes, un insurgé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: À ce moment-là
  rationale: Expression temporelle naturelle en français moderne, qui conserve le lien immédiat avec la scène sans le littéralisme potentiellement artificiel de « à cette heure-là ».
- source_word: τοῖς ὄχλοις
  choice: aux foules
  rationale: Le pluriel grec est conservé; « foules » est courant et plus actuel que « multitudes ».
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: comme si j’étais un bandit
  rationale: Cette formulation rend naturellement la comparaison accusatrice. « Bandit » évoque mieux qu’« voleur » un criminel violent contre lequel on vient armé, sans imposer le sens plus précis d’insurgé.
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: avec des épées et des bâtons
  rationale: « Épées » est la désignation traditionnelle et claire; dans ce contexte, « bâtons » désigne naturellement des armes contondantes en bois.
- source_word: συλλαβεῖν με
  choice: pour m’arrêter
  rationale: Dans cette scène, le verbe désigne l’arrestation de Jésus; ce choix est précis et idiomatique.
- source_word: καθ’ ἡμέραν
  choice: Jour après jour
  rationale: Rend la valeur distributive et l’insistance rhétorique de l’expression grecque.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: « Temple » est naturel en français; le terme grec vise ici l’ensemble du domaine du Temple plutôt que le sanctuaire intérieur, précision donnée en note si nécessaire.
- source_word: ἐκαθεζόμην διδάσκων
  choice: j’étais assis dans le temple à enseigner
  rationale: L’imparfait restitue l’action habituelle ou prolongée, tandis que « à enseigner » rend clairement l’action simultanée du participe.
- source_word: οὐκ ἐκρατήσατέ με
  choice: vous ne vous êtes pas emparés de moi
  rationale: Ce choix conserve la nuance de prise physique de κρατέω et le distingue du précédent « m’arrêter ».
theological_decisions:
- issue: Portée de λῃστής dans la question de Jésus
  choice: bandit
  alternative: voleur; brigand; insurgé
  rationale: Le mot peut désigner un voleur violent, un brigand et, selon le contexte, un insurgé. « Bandit » garde ici une portée assez large et convient à la présence d’une troupe armée; une note préserve les autres nuances sans politiser indûment le verset.
translation_notes:
  register: Français international moderne, oral mais digne. La question conserve son caractère de reproche. Le contraste lexical entre « arrêter » et « s’emparer de » reflète les deux verbes grecs distincts.
