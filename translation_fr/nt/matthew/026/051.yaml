id: MAT.26.51
reference: Matthew 26:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἷς τῶν μετὰ Ἰησοῦ ἐκτείνας τὴν χεῖρα ἀπέσπασεν τὴν μάχαιραν αὐτοῦ καὶ πατάξας τὸν δοῦλον τοῦ ἀρχιερέως ἀφεῖλεν αὐτοῦ τὸ ὠτίον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/051.yaml
  text: And behold[a], one of those with Jesus stretched out his hand, drew his sword, and struck the high priest’s slave, and cut off his ear.
translation:
  language: fr
  text: 'Et voici : l’un de ceux qui étaient avec Jésus tendit la main, tira son épée, frappa l’esclave[a] du grand-prêtre et lui trancha l’oreille.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ».
    reason: Alternative lexicale possible pour δοῦλος.
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: Conserve la vivacité et la soudaineté du marqueur narratif grec dans un français actuel et digne.
- source_word: εἷς τῶν μετὰ Ἰησοῦ
  choice: l’un de ceux qui étaient avec Jésus
  rationale: Rend naturellement la construction partitive sans préciser l’identité de l’homme.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: tendit la main
  rationale: Exprime l’action préalable du participe aoriste de façon concise et idiomatique.
- source_word: ἀπέσπασεν τὴν μάχαιραν αὐτοῦ
  choice: tira son épée
  rationale: Formulation française naturelle pour l’action de sortir l’arme; elle ne précise pas indûment le type exact de lame.
- source_word: μάχαιραν
  choice: épée
  rationale: Équivalent courant suffisamment large; « poignard » ou « épée courte » seraient plus spécifiques que le contexte ne l’exige.
- source_word: πατάξας
  choice: frappa
  rationale: Reproduit clairement le coup violent exprimé par le participe grec.
- source_word: δοῦλον
  choice: esclave
  rationale: Reflète directement le statut social désigné par δοῦλος, sans l’atténuer en « serviteur ».
- source_word: ἀρχιερέως
  choice: grand-prêtre
  rationale: Terme français consacré et exact pour le singulier ἀρχιερεύς dans ce contexte.
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτίον
  choice: lui trancha l’oreille
  rationale: Exprime en français naturel le résultat de l’action de l’épée tout en conservant le verbe grec comme action coordonnée distincte.
- source_word: ὠτίον
  choice: oreille
  rationale: Le diminutif grec désigne ici naturellement l’oreille; « lobe » serait trop précis.
theological_decisions:
- issue: Traduction de δοῦλος dans ce contexte social concret
  choice: esclave
  alternative: serviteur
  rationale: Le récit présente cet homme selon son lien de dépendance envers le grand-prêtre. « Esclave » préserve cette réalité sociale et évite de l’adoucir, tandis que la note signale l’autre traduction française possible.
translation_notes:
  register: Français international moderne, narratif et digne. « Et voici » garde l’effet d’irruption de ἰδοὺ; les verbes coordonnés rendent nettement la succession rapide des actions grecques.
