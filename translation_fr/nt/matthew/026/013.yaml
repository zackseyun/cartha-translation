source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὅπου ἐὰν κηρυχθῇ τὸ εὐαγγέλιον τοῦτο ἐν ὅλῳ τῷ κόσμῳ, λαληθήσεται καὶ ὃ ἐποίησεν αὕτη εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/013.yaml
  text: Truly I tell you, wherever this good news is proclaimed in the whole world, what this woman has done will also be spoken of in memory of her.
translation:
  language: fr
  text: 'Vraiment, je vous le dis : partout où cette bonne nouvelle[a] sera proclamée dans le monde entier, on parlera aussi de ce que cette femme a fait, en souvenir d’elle[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cet Évangile ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « comme mémorial en son honneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: Vraiment
  rationale: En tête d’une parole de Jésus, le terme introduit une affirmation solennelle. « Vraiment » en restitue la force dans un français actuel, sans recourir à la translittération « Amen ».
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure française naturelle conserve l’adresse directe et la solennité de la formule.
- source_word: ὅπου ἐὰν
  choice: partout où
  rationale: La combinaison grecque exprime un lieu indéfini. « Partout où » convient bien avec la perspective universelle de la phrase.
- source_word: κηρυχθῇ
  choice: sera proclamée
  rationale: Le futur français rend naturellement la portée éventuelle et future de l’aoriste subjonctif passif dans cette proposition générale. « Proclamée » conserve l’idée d’une annonce publique.
- source_word: τὸ εὐαγγέλιον τοῦτο
  choice: cette bonne nouvelle
  rationale: « Bonne nouvelle » rend directement le sens de εὐαγγέλιον dans un français accessible. Le traditionnel « cet Évangile » demeure possible et figure en note.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: dans le monde entier
  rationale: Formulation française idiomatique qui conserve la portée universelle de l’expression grecque.
- source_word: λαληθήσεται
  choice: on parlera aussi de
  rationale: Le passif grec devient un « on » impersonnel, plus naturel en français. Avec pour objet l’acte accompli, « parler de » rend clairement le sens sans surinterpréter le verbe comme « raconter ».
- source_word: ὃ ἐποίησεν αὕτη
  choice: ce que cette femme a fait
  rationale: Le relatif neutre renvoie à l’acte, tandis que le démonstratif désigne la femme mentionnée dans le contexte. L’explicitation « cette femme » est claire et fidèle.
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: en mémoire d’elle
  rationale: Cette expression française naturelle préserve la valeur commémorative de μνημόσυνον sans préciser davantage la relation exacte entre le récit et le mémorial.
theological_decisions:
- issue: Traduction de εὐαγγέλιον
  choice: bonne nouvelle
  alternative: Évangile
  rationale: Le choix principal rend le sens lexical grec de manière transparente et accessible. L’alternative traditionnelle est conservée en note, car elle porte un registre théologique reconnu sans représenter une différence doctrinale nécessaire.
- issue: Portée de εἰς μνημόσυνον αὐτῆς
  choice: en mémoire d’elle
  alternative: comme mémorial pour elle
  rationale: La formulation retenue conserve la commémoration de la femme sans déterminer si l’expression désigne surtout le but, le résultat ou la fonction mémorielle de ce qui sera dit.
translation_notes:
  register: Français international moderne, digne et aisément compréhensible. La ponctuation met en relief la formule solennelle initiale. Le pronom impersonnel « on » évite un passif lourd tout en maintenant l’agent indéfini du grec.
