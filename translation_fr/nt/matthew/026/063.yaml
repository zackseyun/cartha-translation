id: MAT.26.63
reference: Matthew 26:63
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐσιώπα. ⸀καὶ ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος ἵνα ἡμῖν εἴπῃς εἰ σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/063.yaml
  text: 'But Jesus kept silent[a]. And the high priest said to him, “I put you under oath by the living God: tell us if you are the Messiah[b], the Son of God.”'
translation:
  language: fr
  text: 'Mais Jésus gardait le silence. Alors le grand prêtre lui dit : « Je t’adjure par le Dieu vivant[a] : dis-nous si tu es le Messie[b], le Fils de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Je te somme sous serment devant le Dieu vivant ». Le grec emploie une formule solennelle d’adjuration.
    reason: alternative lexicale
  - marker: b
    text: Ou « le Christ ». Le titre grec Christos signifie « l’Oint »; il est rendu ici par « le Messie » parce qu’il fonctionne comme un titre plutôt que comme un nom.
    reason: traduction alternative du titre
lexical_decisions:
- source_word: ἐσιώπα
  choice: gardait le silence
  rationale: L’imparfait grec présente le silence de Jésus comme continu; l’imparfait français en conserve naturellement l’aspect.
- source_word: ἀρχιερεὺς
  choice: grand prêtre
  rationale: Désignation française courante et précise de la plus haute fonction sacerdotale juive dans ce contexte judiciaire.
- source_word: Ἐξορκίζω σε
  choice: Je t’adjure
  rationale: Ici, le verbe exprime une sommation solennelle sous serment, et non un exorcisme. « Je t’adjure » conserve cette force tout en restant intelligible dans un registre digne.
- source_word: κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: par le Dieu vivant
  rationale: Avec le verbe d’adjuration, la préposition introduit l’autorité divine invoquée pour la sommation solennelle.
- source_word: ἵνα ἡμῖν εἴπῃς
  choice: dis-nous
  rationale: La proposition exprime ce que le grand prêtre exige de Jésus; l’impératif après les deux-points rend cette demande clairement et naturellement.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Le terme fonctionne ici comme le titre de l’oint attendu, et non comme un nom propre; « Messie » fait ressortir cette fonction dans le contexte juif.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: La formulation directe conserve le titre christologique défini sans l’expliquer ni en réduire la portée.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Mais Jésus
  rationale: δέ marque un contraste léger avec les accusations précédentes; « Mais » l’exprime naturellement.
theological_decisions:
- issue: Traduction de Χριστός dans l’interrogatoire christologique
  choice: le Messie
  alternative: le Christ
  rationale: Le mot est employé comme titre de l’oint attendu. La traduction principale le rend par « Messie », tandis que « Christ » est conservé en note comme équivalent traditionnel.
- issue: Force de la formule Ἐξορκίζω σε κατὰ τοῦ θεοῦ τοῦ ζῶντος
  choice: une adjuration solennelle faite en invoquant le Dieu vivant
  alternative: une simple injonction
  rationale: La formule invoque explicitement Dieu et possède une force solennelle dans le cadre judiciaire. « Je t’adjure » préserve cette gravité sans lui imposer une procédure juridique moderne précise.
translation_notes:
  register: Français international moderne, digne et narratif. « Je t’adjure » est volontairement plus solennel que la langue courante afin de refléter la formule judiciaire, tandis que le reste de la phrase demeure direct et accessible. Les marqueurs de notes ont été placés auprès des expressions qu’ils expliquent.
