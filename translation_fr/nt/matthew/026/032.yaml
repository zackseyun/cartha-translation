  text: μετὰ δὲ τὸ ἐγερθῆναί με προάξω ὑμᾶς εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/032.yaml
  text: But after I am raised up[a], I will go ahead of you into Galilee.
translation:
  language: fr
  text: Mais, après que je serai ressuscité[a], je vous précéderai en Galilée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie une forme passive : littéralement, « après que j’aurai été relevé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ δὲ
  choice: Mais après que
  rationale: La construction μετά avec l’infinitif articulé marque l’antériorité temporelle (« après »), tandis que δέ introduit ici un léger contraste avec l’annonce précédente de la défaillance des disciples.
- source_word: τὸ ἐγερθῆναί με
  choice: j’aurai été relevé
  rationale: L’infinitif aoriste passif de ἐγείρω, avec με comme sujet à l’accusatif, est rendu par un passif accompli après « après que ». « Relevé » conserve l’image et la voix passive sans expliciter l’agent.
- source_word: προάξω
  choice: je vous précéderai
  rationale: Le verbe signifie ici aller avant quelqu’un. « Précéder » est naturel, concis et n’impose pas la nuance plus forte de conduire.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom désigne les disciples au pluriel, ce que le contexte rend clair en français.
- source_word: εἰς τὴν Γαλιλαίαν
  choice: en Galilée
  rationale: Dans ce contexte de déplacement vers une région, « en Galilée » est l’expression française idiomatique correspondant à εἰς, sans perte significative du mouvement exprimé.
theological_decisions:
- issue: Formulation de la résurrection dans ἐγερθῆναί
  choice: après que j’aurai été relevé
  alternative: après que je serai ressuscité / après que je me serai relevé
  rationale: Le passif grec est maintenu afin de ne pas effacer sa forme ni l’éventuelle implication d’une action divine, sans toutefois nommer l’agent. La note donne la formulation française consacrée « ressuscité », tandis que le texte conserve plus directement l’image lexicale de « relever ».
translation_notes:
  register: Français international moderne, digne et accessible. Le futur antérieur convient naturellement après « après que » pour une action future accomplie avant celle du verbe principal. Le passif préserve l’ambiguïté concernant l’agent de la résurrection.
