  text: Τῇ δὲ πρώτῃ τῶν ἀζύμων προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ ⸀λέγοντες· Ποῦ θέλεις ⸀ἑτοιμάσωμέν σοι φαγεῖν τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/017.yaml
  text: On the first day of Unleavened Bread[a], the disciples came to Jesus, saying[b], “Where do you want us to prepare for you to eat the Passover?”
translation:
  language: fr
  text: 'Le premier jour des Pains sans levain[a], les disciples s’approchèrent de Jésus et lui dirent : « Où veux-tu que nous te préparions le repas de la Pâque[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression traduit directement le grec « le premier [jour] des Pains sans levain »; la traduction ne cherche pas à trancher les questions relatives à la chronologie de la Pâque.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement : « préparer pour toi, afin que tu manges la Pâque ». Ici, « la Pâque » désigne le repas pascal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ πρώτῃ τῶν ἀζύμων
  choice: Le premier jour des Pains sans levain
  rationale: La construction au datif exprime le moment. « Pains sans levain » désigne ici la période de la fête juive; le léger lien discursif porté par δέ n’exige pas l’ajout d’un connecteur en français.
- source_word: προσῆλθον οἱ μαθηταὶ τῷ Ἰησοῦ
  choice: les disciples s’approchèrent de Jésus
  rationale: προσέρχομαι signifie venir vers quelqu’un ou s’en approcher. « S’approchèrent de » rend clairement le mouvement vers Jésus sans ajouter le possessif « ses », absent du grec.
- source_word: λέγοντες
  choice: et lui dirent
  rationale: Le participe grec accompagne le verbe principal. Une coordination avec un verbe conjugué est plus naturelle en français moderne; « lui » explicite seulement le destinataire déjà exprimé par le contexte.
- source_word: Ποῦ θέλεις ἑτοιμάσωμέν σοι
  choice: Où veux-tu que nous te préparions
  rationale: Le subjonctif délibératif après θέλεις se rend naturellement par « veux-tu que nous… ». Le pronom « te » conserve l’idée de préparation faite pour Jésus.
- source_word: φαγεῖν τὸ πάσχα
  choice: le repas de la Pâque
  rationale: Dans ce contexte, πάσχα désigne ce qui doit être mangé, donc le repas pascal. Cette formulation française naturelle exprime l’acte de manger implicitement contenu dans la notion de repas, tandis qu’une note conserve la forme plus littérale.
theological_decisions:
- issue: Rapport chronologique entre « le premier jour des Pains sans levain » et le repas de la Pâque
  choice: Conserver l’expression festive telle qu’elle se présente dans le grec.
  alternative: Interpréter « le jour précédant la fête des Pains sans levain » ou « le premier jour de la Pâque ».
  rationale: Le texte grec dit explicitement « le premier [jour] des Pains sans levain ». La traduction ne tranche donc pas, par harmonisation ou paraphrase, les débats relatifs à la chronologie des récits évangéliques.
- issue: Sens de τὸ πάσχα dans un contexte de préparation et de repas
  choice: le repas de la Pâque
  alternative: la Pâque
  rationale: πάσχα peut désigner la fête, la victime pascale ou le repas. Puisque le texte parle de préparer afin de manger, le repas est ici le référent contextuel; la note signale cependant la formulation grecque plus directe.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Pains sans levain » conserve l’appellation traditionnelle et intelligible de la fête; « repas de la Pâque » évite l’expression peu naturelle « manger la Pâque » dans le corps du texte.
