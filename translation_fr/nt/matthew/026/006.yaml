  text: Τοῦ δὲ Ἰησοῦ γενομένου ἐν Βηθανίᾳ ἐν οἰκίᾳ Σίμωνος τοῦ λεπροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/006.yaml
  text: While Jesus was in Bethany[a], in the house of Simon the leper[b],
translation:
  language: fr
  text: Pendant que Jésus était à Béthanie[a], dans la maison de Simon le lépreux[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lorsque Jésus était à Béthanie. » Le grec emploie une construction qui établit le cadre temporel de la scène.'
    reason: lexical_alternative
  - marker: b
    text: « Le lépreux » reprend l’épithète grecque qui sert à identifier Simon. Elle ne précise pas à elle seule s’il était alors atteint de cette affection ou s’il l’avait été auparavant.
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦ δὲ Ἰησοῦ γενομένου
  choice: Pendant que Jésus était
  rationale: Le génitif absolu avec γίνομαι établit ici le cadre temporel. Cette formulation française naturelle conserve la valeur circonstancielle sans rendre littéralement « étant devenu ».
- source_word: δὲ
  choice: non rendu séparément
  rationale: δέ marque une transition narrative légère plutôt qu’une opposition nette. En français, l’enchaînement est suffisamment porté par la proposition temporelle, sans ajouter artificiellement « alors » ou « or ».
- source_word: ἐν Βηθανίᾳ
  choice: à Béthanie
  rationale: Pour une ville ou une localité, le français idiomatique emploie « à ».
- source_word: ἐν οἰκίᾳ Σίμωνος
  choice: dans la maison de Simon
  rationale: οἰκία désigne ici le lieu physique, et le génitif Σίμωνος indique la possession.
- source_word: τοῦ λεπροῦ
  choice: le lépreux
  rationale: Cette expression conserve l’épithète identificatrice du grec. Elle reste concise et reconnaissable, sans préciser un diagnostic moderne ni déterminer si l’affection était encore présente.
theological_decisions:
- issue: État de Simon désigné par l’épithète « le lépreux »
  choice: Conserver « Simon le lépreux » sans préciser si Simon était encore atteint ou avait été guéri.
  alternative: Simon, ancien lépreux ; Simon, atteint d’une maladie de peau
  rationale: Le grec fournit seulement une épithète d’identification. Il ne permet ni de situer l’affection dans le passé ni de l’assimiler avec certitude à la maladie de Hansen.
translation_notes:
  register: Français international moderne, naturel et digne. « Pendant que » rend clairement la circonstance temporelle; « le lépreux » conserve l’ambiguïté historique et médicale du texte source. La virgule finale est maintenue puisque le verset se prolonge syntaxiquement au verset suivant.
