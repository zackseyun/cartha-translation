  text: For this could have been sold for a great deal and given to the poor[a].
translation:
  language: fr
  text: Car on aurait pu le vendre très cher et en donner le prix aux pauvres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le vendre pour une forte somme ». Littéralement, le grec dit : « cela pouvait être vendu pour beaucoup et être donné aux pauvres » ; le produit de la vente est implicite dans le second infinitif.'
    reason: alternative de traduction et explicitation d’une ellipse
lexical_decisions:
- source_word: ἐδύνατο
  choice: On aurait pu
  rationale: L’imparfait de δύναμαι suivi des infinitifs exprime ici une possibilité passée non réalisée; le conditionnel passé français la rend naturellement.
- source_word: γὰρ
  choice: omis explicitement
  rationale: La relation explicative avec la plainte précédente demeure perceptible en français sans connecteur; « En effet » alourdirait cette brève réplique. La nuance n’est toutefois pas théologiquement déterminante.
- source_word: τοῦτο
  choice: le
  rationale: Le pronom neutre renvoie au parfum mentionné dans le contexte; le pronom objet « le » est la reprise naturelle en français sans répéter le nom.
- source_word: πραθῆναι
  choice: vendre
  rationale: L’infinitif aoriste passif signifie « être vendu »; dans la construction impersonnelle française « on aurait pu le vendre », le sens passif et la possibilité non réalisée sont rendus idiomatiquement.
- source_word: πολλοῦ
  choice: très cher
  rationale: Le génitif de prix indique une somme élevée. « Très cher » est une expression française actuelle et naturelle qui ne précise pas indûment le montant.
- source_word: δοθῆναι
  choice: donner l’argent
  rationale: L’infinitif passif coordonné signifie littéralement « être donné ». Le complément implicite correspond au produit de la vente; « donner l’argent » évite en français l’ambiguïté selon laquelle le parfum lui-même aurait été donné.
- source_word: πτωχοῖς
  choice: aux pauvres
  rationale: L’adjectif substantivé au datif pluriel désigne collectivement les personnes pauvres; « aux pauvres » est concis, digne et usuel.
theological_decisions: []
translation_notes:
  register: 'Français international moderne, simple et digne. La formulation privilégie une équivalence optimale : elle explicite le produit de la vente pour éviter une ambiguïté artificielle en français, tandis que la note conserve la structure plus littérale du grec.'
