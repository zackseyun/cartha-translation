  yaml_path: translation/nt/matthew/026/004.yaml
  text: and they conspired so that they might seize Jesus by stealth and kill him.
translation:
  language: fr
  text: Ils tinrent conseil pour s’emparer de Jésus par ruse et le tuer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβουλεύσαντο
  choice: ils tinrent conseil
  rationale: Le verbe exprime une délibération concertée; cette tournure française naturelle conserve l’idée qu’ils se consultent et arrêtent ensemble un projet.
- source_word: δόλῳ
  choice: par ruse
  rationale: Le terme désigne la tromperie ou un procédé rusé. « Par ruse » est direct, courant et laisse ouverte la manière précise d’agir.
- source_word: κρατήσωσιν
  choice: s’emparer de
  rationale: Dans ce contexte hostile, le verbe signifie prendre quelqu’un sous son contrôle ou l’arrêter. « S’emparer de » restitue la force du terme sans préciser indûment une procédure officielle.
- source_word: ἀποκτείνωσιν
  choice: le faire mourir
  rationale: Le verbe signifie tuer ou mettre à mort. « Le faire mourir » exprime clairement leur intention homicide dans un registre digne et naturel.
theological_decisions:
- issue: Valeur de la proposition introduite par ἵνα
  choice: pour s’emparer de Jésus par ruse et le faire mourir
  alternative: afin qu’ils puissent s’emparer de Jésus par ruse et le tuer
  rationale: ἵνα indique ici le but de leur concertation. L’infinitif français rend ce rapport final naturellement, sans ajouter une notion de capacité absente du grec.
translation_notes:
  register: 'Français international moderne, sobre et digne. La coordination des deux infinitifs conserve l’unité du projet: capturer Jésus par tromperie, puis provoquer sa mort.'
