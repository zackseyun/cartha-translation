  yaml_path: translation/nt/matthew/026/066.yaml
  text: What do you think? They answered[a], “He is deserving of death.”
translation:
  language: fr
  text: '« Qu’en pensez-vous ? » Ils répondirent : « Il mérite la mort[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il est passible de mort » ou « Il est passible de la peine de mort ». L’expression grecque a ici valeur de verdict judiciaire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ὑμῖν δοκεῖ
  choice: Qu’en pensez-vous ?
  rationale: Cette tournure idiomatique rend naturellement la demande d’avis ou de jugement adressée à plusieurs personnes, tout en conservant la force directe de la question grecque.
- source_word: οἱ δὲ ἀποκριθέντες εἶπαν
  choice: Ils répondirent
  rationale: Le participe suivi de εἶπαν forme une expression narrative courante qu’un verbe conjugué rend naturellement en français. Le léger lien exprimé par δέ n’a pas besoin d’être traduit explicitement ici.
- source_word: Ἔνοχος θανάτου
  choice: Il mérite la mort
  rationale: Dans ce contexte judiciaire, l’expression signifie qu’il est déclaré passible de la mort. « Il mérite la mort » est direct et naturel en français, tandis qu’une note préserve les formulations juridiques plus littérales.
- source_word: ἐστίν
  choice: Il …
  rationale: Le sujet implicite de la copule grecque est exprimé par le pronom « Il », nécessaire à une phrase française complète.
theological_decisions:
- issue: Portée judiciaire du verdict du conseil
  choice: Il mérite la mort
  alternative: Il est passible de mort / Il est coupable et mérite la mort
  rationale: La traduction présente le jugement prononcé par le conseil sans en faire une affirmation sur la culpabilité de Jésus devant Dieu ni y introduire une interprétation théologique ultérieure.
translation_notes:
  register: Français international moderne, direct et digne. Le passé simple convient au registre narratif biblique sans rendre la phrase difficile; le dialogue reste naturel et immédiatement compréhensible.
