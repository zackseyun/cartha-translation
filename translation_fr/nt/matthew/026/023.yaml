id: MAT.26.23
reference: Matthew 26:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ὁ ἐμβάψας μετ’ ἐμοῦ ⸂τὴν χεῖρα ἐν τῷ τρυβλίῳ⸃ οὗτός με παραδώσει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/023.yaml
  text: He answered[b][a], “The one who dipped his hand with me in the bowl—this one will betray me.”
translation:
  language: fr
  text: 'Il répondit : « Celui qui a plongé la main avec moi dans le plat, c’est lui qui me livrera[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « me trahira ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Il répondit
  rationale: Cette tournure grecque, influencée par l’usage sémitique, signifie naturellement « répondre » ; rendre séparément le participe et le verbe serait lourd en français.
- source_word: ἐμβάψας
  choice: a plongé
  rationale: Le participe aoriste présente l’action d’identification comme accomplie. « A plongé » exprime simplement le geste de mettre la main dans le plat.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: Rend directement l’accompagnement exprimé par μετά suivi du génitif.
- source_word: τὴν χεῖρα
  choice: la main
  rationale: Le français emploie naturellement l’article défini avec les parties du corps lorsque le possesseur ressort clairement du contexte.
- source_word: ἐν τῷ τρυβλίῳ
  choice: dans le plat
  rationale: τρύβλιον désigne un récipient dans lequel on sert ou prend de la nourriture ; « plat » est idiomatique et convient à la scène du repas.
- source_word: οὗτός
  choice: c’est lui
  rationale: La construction disloquée conserve l’insistance du démonstratif grec tout en restant naturelle en français.
- source_word: παραδώσει
  choice: me livrera
  rationale: « Livrer » conserve le sens fondamental de remettre quelqu’un aux mains d’autrui ainsi que, dans ce contexte, la portée de trahison, sans réduire le verbe à une seule nuance.
theological_decisions:
- issue: Sens de παραδίδωμι dans le contexte de Judas
  choice: me livrera
  alternative: me trahira
  rationale: Le contexte implique une trahison, mais le verbe décrit plus directement la remise de Jésus aux autorités. « Livrera » préserve cette dimension concrète et la résonance narrative du terme, tandis que la note signale la nuance contextuelle.
translation_notes:
  register: Français moderne, courant et digne. La reprise « c’est lui » garde l’emphase de οὗτός sans produire une formulation artificielle.
