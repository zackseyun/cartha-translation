  text: ἐγείρεσθε ἄγωμεν· ἰδοὺ ἤγγικεν ὁ παραδιδούς με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/046.yaml
  text: Get up, let us go. Look, my betrayer[a] is near.
translation:
  language: fr
  text: Levez-vous, allons-y. Voici, celui qui me livre[a] est proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui me trahit ». Le verbe grec signifie littéralement « remettre » ou « livrer » quelqu’un.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: Levez-vous
  rationale: L’impératif pluriel s’adresse directement aux disciples. « Levez-vous » est naturel en français moderne et conserve l’idée de se relever.
- source_word: ἄγωμεν
  choice: allons-y
  rationale: Le subjonctif exhortatif à la première personne du pluriel invite le groupe, Jésus compris, à se mettre en mouvement. « Allons-y » en rend naturellement la force.
- source_word: ἰδού
  choice: Voici
  rationale: La particule attire vivement l’attention sur l’arrivée imminente. « Voici » garde cette fonction présentative dans un registre courant et digne.
- source_word: ἤγγικεν
  choice: est tout proche
  rationale: Le parfait présente l’approche comme accomplie, avec un résultat actuel. « Est tout proche » exprime clairement cet état présent et l’urgence de la scène.
- source_word: ὁ παραδιδούς με
  choice: celui qui me livre
  rationale: Le participe substantivé désigne celui qui est en train de remettre Jésus aux mains de ses adversaires. Cette formulation conserve l’action concrète du grec ainsi que sa portée de trahison dans le contexte.
theological_decisions:
- issue: Sens de παραδιδούς dans le récit de la Passion
  choice: celui qui me livre
  alternative: celui qui me trahit
  rationale: Le verbe décrit concrètement le fait de remettre Jésus à ses adversaires, acte qui constitue en même temps une trahison. Le texte principal préserve l’image précise du grec; la note signale le sens relationnel impliqué sans réduire le terme à une seule nuance.
translation_notes:
  register: Français moderne, direct et digne. Les impératifs brefs et « tout proche » maintiennent l’urgence de la scène sans tournure archaïque.
