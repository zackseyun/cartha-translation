  text: καὶ ἐσθιόντων αὐτῶν εἶπεν· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/021.yaml
  text: And while they were eating[a], he said, “Truly I tell you, one of you will betray me.”
translation:
  language: fr
  text: 'Pendant qu’ils mangeaient, il dit : « En vérité, je vous le dis, l’un de vous me livrera[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « me trahira ». Le verbe grec signifie littéralement remettre ou livrer quelqu’un ; ici, l’acte constitue une trahison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: pendant qu’ils mangeaient
  rationale: Le génitif absolu exprime une action simultanée. Cette formulation naturelle en français moderne conserve clairement la valeur temporelle.
- source_word: Ἀμὴν
  choice: en vérité
  rationale: Dans les paroles de Jésus, ἀμήν introduit une affirmation solennelle et assurée. « En vérité » en restitue la fonction dans un registre digne et intelligible.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette formule française idiomatique conserve l’adresse directe et la solennité de l’énoncé.
- source_word: εἷς ἐξ ὑμῶν
  choice: l’un de vous
  rationale: Cette expression rend naturellement et précisément la construction partitive grecque.
- source_word: παραδώσει
  choice: me livrera
  rationale: Le verbe παραδίδωμι signifie fondamentalement remettre ou livrer quelqu’un. Dans ce contexte, il implique une trahison, mais « livrera » préserve à la fois l’acte concret et sa portée relationnelle sans réduire l’ambiguïté lexicale.
- source_word: με
  choice: me
  rationale: Le pronom est l’objet direct du verbe et renvoie à Jésus.
theological_decisions:
- issue: Traduction de παραδώσει dans le récit de la Passion
  choice: me livrera
  alternative: me trahira
  rationale: « Me livrera » reste proche de l’étendue sémantique du grec et désigne l’acte par lequel Jésus sera remis à ses adversaires. Le contexte fait clairement de cet acte une trahison, indiquée en note, sans que cette interprétation contextuelle remplace entièrement l’image du verbe source.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la solennité de la déclaration de Jésus tout en restant immédiatement compréhensible.
