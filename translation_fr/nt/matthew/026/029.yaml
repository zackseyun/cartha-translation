id: MAT.26.29
reference: Matthew 26:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω δὲ ⸀ὑμῖν, οὐ μὴ πίω ἀπ’ ἄρτι ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω μεθ’ ὑμῶν καινὸν ἐν τῇ βασιλείᾳ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/029.yaml
  text: But I tell you[a], from now on I will certainly not drink from this fruit of the vine until that day when I drink it new with you in the kingdom of my Father.
translation:
  language: fr
  text: 'Mais je vous le dis : à partir de maintenant, je ne boirai certainement plus de ce fruit de la vigne jusqu’au jour où je le boirai nouveau[a] avec vous dans le royaume de mon Père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nouveau » ou « d’une manière nouvelle » ; l’adjectif grec peut désigner une nouveauté de nature ou de qualité.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mais je vous le dis
  rationale: δέ marque ici une transition légèrement adversative. « Mais je vous le dis » est naturel en français et conserve ce changement de perspective sans accentuer excessivement l’opposition.
- source_word: οὐ μὴ πίω
  choice: je ne boirai certainement plus
  rationale: οὐ μή avec le subjonctif aoriste exprime une négation future emphatique. « Certainement plus » rend cette force tout en s’accordant naturellement avec « à partir de maintenant ».
- source_word: ἀπ’ ἄρτι
  choice: à partir de maintenant
  rationale: L’expression fixe le point de départ au moment présent et porte sur la période qui suit.
- source_word: ἐκ τούτου τοῦ γενήματος τῆς ἀμπέλου
  choice: de ce fruit de la vigne
  rationale: γένημα désigne le produit ou fruit. La formulation conserve l’image et l’idiome de la source plutôt que de les remplacer explicitement par « vin ».
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: jusqu’au jour où
  rationale: La construction française intègre naturellement « ce jour-là » à la relative temporelle ; le jour futur déterminé reste exprimé par l’ensemble « jusqu’au jour où ».
- source_word: ὅταν αὐτὸ πίνω
  choice: où je le boirai
  rationale: ὅταν avec le subjonctif situe l’action dans un avenir attendu. Le pronom « le » reprend le fruit de la vigne, c’est-à-dire ce qui est bu.
- source_word: καινὸν
  choice: nouveau
  rationale: L’adjectif peut évoquer une nouveauté de nature ou de qualité. Le rendu direct « nouveau » préserve cette indétermination, tandis qu’une note signale l’autre compréhension possible.
- source_word: μεθ’ ὑμῶν
  choice: avec vous
  rationale: Cette expression simple et naturelle rend directement l’accompagnement.
- source_word: ἐν τῇ βασιλείᾳ τοῦ πατρός μου
  choice: dans le royaume de mon Père
  rationale: La formulation suit de près l’ordre grec et garde la solennité de l’expression « mon Père ».
theological_decisions:
- issue: Faut-il nommer explicitement le contenu de la coupe comme du vin ?
  choice: Conserver « fruit de la vigne » dans le texte principal.
  alternative: vin
  rationale: Le grec emploie « fruit/produit de la vigne » et non οἶνος, « vin ». Garder l’idiome respecte la formulation source et n’ajoute pas de précision sacramentelle ou symbolique absente du verset.
- issue: Sens de καινὸν dans le repas eschatologique
  choice: Employer « nouveau » sans préciser la nature exacte de la nouveauté.
  alternative: de nouveau ; d’une manière nouvelle
  rationale: Le mot peut indiquer une nouveauté de nature ou de qualité, et la syntaxe peut aussi être comprise dans le sens d’une participation renouvelée. Le texte principal conserve cette tension, et la note présente l’autre possibilité.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « je le boirai nouveau » est volontairement proche de la syntaxe grecque afin de conserver le lien de l’adjectif avec ce qui est bu et de ne pas résoudre l’ambiguïté par une paraphrase.
