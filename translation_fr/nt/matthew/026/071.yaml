- source_word: ἄλλη
  choice: une autre femme
  rationale: Le féminin grec renvoie à une autre servante ou femme; « femme » reste naturel sans préciser davantage que le texte.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu au passé simple, plus naturel dans un récit français au passé, sans modifier la valeur de l'action.
- source_word: ὁ Ναζωραῖος
  choice: le Nazaréen
  rationale: Reproduit le titre géographique appliqué à Jésus, avec sa forme française traditionnelle et intelligible.
