id: MAT.26.27
reference: Matthew 26:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον καὶ εὐχαριστήσας ἔδωκεν αὐτοῖς λέγων· Πίετε ἐξ αὐτοῦ πάντες,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/027.yaml
  text: And having taken a cup and given thanks[a], he gave it to them, saying, “Drink from it[c][b], all of you,”
translation:
  language: fr
  text: 'Puis, après avoir pris une coupe[a] et rendu grâce, il la leur donna en disant : « Buvez-en, vous tous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la coupe ». Le grec emploie « coupe » sans article, mais le contexte du repas peut désigner une coupe déterminée.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: après avoir pris
  rationale: Le participe aoriste exprime une action antérieure au verbe principal. Cette tournure rend naturellement la succession des actions en français.
- source_word: ποτήριον
  choice: une coupe
  rationale: Le nom grec est sans article. « Une coupe » en reflète directement la forme, tout en convenant au contexte du repas.
- source_word: εὐχαριστήσας
  choice: rendu grâce
  rationale: Le verbe signifie remercier ou rendre grâce. Cette formulation conserve son sens sans introduire un vocabulaire sacramentel postérieur.
- source_word: ἔδωκεν αὐτοῖς
  choice: il la leur donna
  rationale: Le pronom féminin « la » reprend naturellement « coupe », tandis que « leur » rend le complément indirect αὐτοῖς.
- source_word: λέγων
  choice: en disant
  rationale: Le gérondif français restitue naturellement le participe présent qui introduit les paroles de Jésus.
- source_word: Πίετε ἐξ αὐτοῦ
  choice: Buvez-en
  rationale: Le pronom « en » exprime idiomatiquement en français l’idée de boire à cette coupe ou de ce qu’elle contient, correspondant à ἐξ αὐτοῦ.
- source_word: πάντες
  choice: vous tous
  rationale: Cette expression indique clairement que l’ordre s’adresse à l’ensemble des personnes présentes, sans laisser croire qu’il porte sur la quantité à boire.
theological_decisions:
- issue: Portée potentiellement eucharistique ou sacramentelle de εὐχαριστήσας
  choice: rendu grâce
  alternative: prononcé la bénédiction
  rationale: Le grec signifie explicitement « rendre grâce ». La traduction évite de préciser l’objet de l’action ou de lui imposer une interprétation doctrinale ultérieure.
- issue: Portée de πάντες dans l’ordre
  choice: vous tous
  alternative: tout
  rationale: πάντες désigne le groupe auquel s’adresse l’impératif pluriel. Il ne signifie pas que chacun doit boire tout le contenu de la coupe.
translation_notes:
  register: Français moderne, clair et digne. La construction « après avoir pris… et rendu grâce » conserve l’antériorité des deux participes grecs sans alourdir excessivement la phrase. « Buvez-en, vous tous » est idiomatique et explicite la portée de πάντες.
