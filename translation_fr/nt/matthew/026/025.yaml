source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ Ἰούδας ὁ παραδιδοὺς αὐτὸν εἶπεν· Μήτι ἐγώ εἰμι, ῥαββί; λέγει αὐτῷ· Σὺ εἶπας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/025.yaml
  text: Then Judas, the one betraying him, answered and said, “Surely I am not the one, Rabbi?” He said to him, “You have said so.”
translation:
  language: fr
  text: 'Judas, celui qui allait le livrer, répondit alors : « Ce n’est tout de même pas moi, Rabbi ? » Jésus lui répondit : « C’est toi qui l’as dit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: celui qui allait le livrer
  rationale: Le participe présent désigne Judas par l’acte de livrer Jésus; l’imparfait prospectif naturel en français situe cet acte imminent sans l’atténuer.
- source_word: Μήτι ἐγώ εἰμι
  choice: Ce n’est tout de même pas moi ?
  rationale: Μήτι introduit une question qui attend une réponse négative. Cette tournure française exprime naturellement l’incrédulité feinte ou l’attente de « non », sans ajouter de certitude psychologique.
- source_word: ῥαββί
  choice: Rabbi
  rationale: Conserve le titre sémitique employé dans le texte grec et son contraste contextuel avec les autres disciples.
- source_word: Σὺ εἶπας
  choice: C’est toi qui l’as dit
  rationale: Reproduit l’expression grecque elliptique et indirecte, sans la transformer en affirmation explicite.
theological_decisions:
- issue: Caractère indirect de la réponse de Jésus
  choice: C’est toi qui l’as dit.
  alternative: Oui, c’est toi.
  rationale: La formulation grecque Σὺ εἶπας attribue la parole à Judas et garde une certaine tension rhétorique; une réponse explicite par « oui » résoudrait ce que le texte laisse indirect.
- issue: Temporalité de la trahison
  choice: allait le livrer
  alternative: le trahissait
  rationale: παραδίδωμι signifie fondamentalement « livrer/remettre ». Dans ce contexte, l’acte est en cours de préparation et imminent; la formulation choisie évite d’importer dans le verbe lui-même toute la portée interprétative de « trahir ».
translation_notes:
  register: Français international moderne, naturel et digne. « Prit alors la parole et dit » rend l’enchaînement narratif sans calquer lourdement le doublet grec. Ponctuation française et tutoiement cohérent avec l’échange direct.
