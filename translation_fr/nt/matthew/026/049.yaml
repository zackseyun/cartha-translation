source:
  edition: SBLGNT
  text: καὶ εὐθέως προσελθὼν τῷ Ἰησοῦ εἶπεν· Χαῖρε, ῥαββί· καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/049.yaml
  text: And immediately he came up to Jesus and said[a], “Greetings[b], Rabbi,” and kissed him.
translation:
  language: fr
  text: 'Aussitôt, il s’approcha de Jésus et lui dit : « Je te salue, Rabbi ! » Et il lui donna un baiser[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec peut évoquer un baiser appuyé ou répété : « il l’embrassa avec insistance » ou « il l’embrassa à plusieurs reprises ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Exprime la promptitude et l’urgence narrative dans un français moderne et naturel.
- source_word: προσελθὼν τῷ Ἰησοῦ
  choice: il s’approcha de Jésus
  rationale: Rend naturellement le mouvement vers Jésus exprimé par le participe aoriste et son complément au datif.
- source_word: εἶπεν
  choice: lui dit
  rationale: Le pronom, implicite dans la construction grecque et évident dans le contexte, est naturel en français.
- source_word: Χαῖρε
  choice: Je te salue
  rationale: Rend la formule de salutation conventionnelle avec dignité, sans l’archaïsme de « Salut à toi » ni la familiarité possible de « Salut ».
- source_word: ῥαββί
  choice: Rabbi
  rationale: Conserve, comme le grec, la translittération du titre sémitique, aisément reconnaissable en français.
- source_word: κατεφίλησεν αὐτόν
  choice: il lui donna un baiser
  rationale: Exprime clairement le geste du baiser en français courant. L’éventuelle valeur intensive ou répétitive du verbe composé est signalée en note plutôt qu’imposée au texte.
theological_decisions:
- issue: Portée de la salutation Χαῖρε
  choice: Je te salue
  alternative: Salut ; Réjouis-toi
  rationale: Dans ce contexte, le mot fonctionne comme une salutation ordinaire, non comme une acclamation théologique. Cette formulation laisse l’ironie de la trahison ressortir du récit lui-même.
- issue: Force du verbe κατεφίλησεν
  choice: il lui donna un baiser
  alternative: il l’embrassa avec insistance ; il l’embrassa à plusieurs reprises
  rationale: Le composé peut suggérer un geste appuyé ou répété, mais cette nuance n’est pas assez certaine pour être explicitée sans réserve dans le texte principal. La note préserve l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. « Je te salue » conserve le caractère conventionnel de l’adresse sans sonner archaïque, tandis que « lui donna un baiser » évite l’ambiguïté possible du verbe français « embrasser ».
