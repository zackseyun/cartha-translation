id: MAT.26.48
reference: Matthew 26:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ παραδιδοὺς αὐτὸν ἔδωκεν αὐτοῖς σημεῖον λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/048.yaml
  text: The one betraying him had given them a sign[a], saying, “The one I kiss is he[b]; seize him.”
translation:
  language: fr
  text: 'Celui qui le trahissait[a] leur avait donné un signe[b] en disant : « Celui que j’embrasserai, c’est lui. Saisissez-le. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui le livrait ». Le verbe grec peut signifier « livrer » ou « remettre », mais il désigne ici la trahison commise par Judas.
    reason: lexical_alternative
  - marker: b
    text: Ou « signal ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδιδοὺς
  choice: qui le trahissait
  rationale: Dans le récit de la Passion, le participe désigne l’acte de Judas envers Jésus et porte ici le sens contextuel de « trahir ». La tournure reste naturelle en français tout en signalant la portée morale de l’acte.
- source_word: σημεῖον
  choice: signe
  rationale: Le mot désigne ici un geste convenu permettant d’identifier Jésus. « Signe » reste proche du grec, tandis que le contexte montre qu’il sert de signal.
- source_word: Ὃν ἂν φιλήσω
  choice: Celui que j’embrasserai
  rationale: Cette formulation française rend naturellement la relative indéfinie avec ἄν et le subjonctif aoriste, ainsi que sa fonction d’identification.
- source_word: φιλήσω
  choice: j’embrasserai
  rationale: Dans ce contexte, φιλέω désigne le fait de donner un baiser. « Embrasser » est l’expression française courante et n’ajoute pas la notion de salutation, que le grec ne précise pas.
- source_word: αὐτός ἐστιν
  choice: c’est lui
  rationale: Cette tournure française brève et idiomatique conserve la force d’identification de l’expression grecque.
- source_word: κρατήσατε
  choice: Saisissez-le
  rationale: Le verbe exprime l’action de prendre fermement quelqu’un. « Saisissez-le » conserve la dimension physique et hostile sans préciser davantage une procédure officielle d’arrestation.
theological_decisions:
- issue: Portée morale de παραδιδοὺς à propos de Judas
  choice: « qui le trahissait »
  alternative: « qui le livrait »
  rationale: Le contexte immédiat présente l’action de Judas comme une trahison. Le texte principal en exprime donc clairement la portée, tandis qu’une note conserve le sens plus littéral possible de « livrer ».
translation_notes:
  register: Français international moderne, clair et digne. Le plus-que-parfait « avait donné » préserve l’antériorité de l’accord conclu avant l’arrivée du groupe. La ponctuation distingue nettement l’identification de Jésus de l’ordre donné à ceux qui accompagnent Judas.
