id: MAT.26.38
reference: Matthew 26:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε λέγει ⸀αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/038.yaml
  text: Then he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch with me.”
translation:
  language: fr
  text: 'Alors il leur dit : « Mon âme est profondément triste[a], jusqu’à la mort[b]. Restez ici et veillez avec moi[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « accablée de tristesse », « très triste » ou « profondément affligée ».
    reason: lexical_alternative
  - marker: b
    text: Ou « au point d’en mourir ».
    reason: lexical_alternative
  - marker: c
    text: Ou « restez éveillés avec moi ». Le grec peut évoquer aussi bien le fait de ne pas dormir que celui de demeurer vigilant.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la progression du récit.
- source_word: λέγει
  choice: il leur dit
  rationale: Le présent historique grec est rendu au présent en français pour conserver la vivacité du récit.
- source_word: Περίλυπός
  choice: profondément triste
  rationale: Exprime une tristesse ou une détresse très intense dans une langue actuelle et digne, sans préciser davantage la nature de l’émotion.
- source_word: ἡ ψυχή μου
  choice: Mon âme
  rationale: Conserve le nom explicite ψυχή et la formulation solennelle du grec, sans imposer une anthropologie technique.
- source_word: ἕως θανάτου
  choice: jusqu’à la mort
  rationale: Reproduit au plus près l’expression grecque et préserve son ambiguïté entre une tristesse mortelle et une tristesse poussée à son extrême limite.
- source_word: μείνατε ὧδε
  choice: Restez ici
  rationale: Rend directement l’impératif et l’adverbe de lieu dans un français naturel.
- source_word: γρηγορεῖτε
  choice: veillez
  rationale: Le verbe peut évoquer à la fois le fait de rester éveillé et celui de demeurer vigilant ; « veillez » conserve ces deux nuances.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: Rend simplement l’idée d’accompagnement exprimée par μετά avec le génitif.
theological_decisions:
- issue: Sens de ψυχή dans la parole de Jésus
  choice: Mon âme
  alternative: Je suis profondément triste
  rationale: Le texte conserve le terme explicite « âme » tout en laissant pleinement apparaître la réalité de l’angoisse humaine de Jésus, sans transformer cette expression en définition doctrinale de la personne humaine.
- issue: Portée de γρηγορεῖτε dans le contexte
  choice: veillez
  alternative: restez éveillés
  rationale: « Veillez » permet d’entendre à la fois l’éveil physique demandé aux disciples et la vigilance qui accompagne Jésus, sans réduire le commandement à une seule de ces dimensions.
translation_notes:
  register: Français international moderne, clair et digne. Le présent historique donne de la vivacité au récit. « Mon âme » maintient la formulation du grec ; « veillez » conserve le double sens contextuel d’éveil et de vigilance.
