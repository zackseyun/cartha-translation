id: MAT.26.10
reference: Matthew 26:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Τί κόπους παρέχετε τῇ γυναικί; ἔργον γὰρ καλὸν ἠργάσατο εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/010.yaml
  text: But Jesus[a], knowing this, said to them[b], “Why are you causing trouble for the woman? For she has done a beautiful work to me.
translation:
  language: fr
  text: 'Mais Jésus, s’en étant rendu compte, leur dit : « Pourquoi causez-vous des ennuis à cette femme[a] ? Elle a accompli une belle action[b] envers moi[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pourquoi faites-vous de la peine à cette femme ? »
    reason: lexical_alternative
  - marker: b
    text: Ou « une bonne œuvre »; ou « une noble action ».
    reason: lexical_alternative
  - marker: c
    text: Ou « pour moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: s’en étant rendu compte
  rationale: Le participe aoriste de γινώσκω exprime ici la prise de conscience qui précède la parole de Jésus. Le pronom « en » reprend naturellement, sans la détailler, la critique formulée dans le contexte.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque une légère opposition entre la réaction des disciples et la réponse corrective de Jésus.
- source_word: Τί κόπους παρέχετε τῇ γυναικί
  choice: Pourquoi causez-vous des ennuis à cette femme ?
  rationale: L’expression associe κόπους, « peines, difficultés, ennuis », à παρέχετε, « causer, procurer ». Cette formulation française conserve l’idée qu’ils lui rendent la situation pénible ainsi que la force du reproche.
- source_word: ἔργον καλὸν
  choice: une belle action
  rationale: καλός peut évoquer à la fois la bonté, la noblesse et la beauté appropriée d’un acte. « Belle action » est naturel en français moderne et garde cette nuance appréciative.
- source_word: ἠργάσατο
  choice: a accompli
  rationale: Le passé composé présente l’acte achevé tout en maintenant sa pertinence immédiate; « accomplir une action » est une tournure française naturelle et digne.
- source_word: εἰς ἐμέ
  choice: envers moi
  rationale: εἰς appliqué à une personne peut exprimer l’orientation ou la relation. « Envers moi » rend cette orientation sans exclure que l’action ait été faite en faveur de Jésus.
theological_decisions:
- issue: Évaluation de l’acte de la femme
  choice: une belle action
  alternative: une bonne action
  rationale: La traduction conserve l’éloge explicite de Jésus ainsi que la portée esthétique et morale possible de καλός, sans introduire de conception particulière du mérite religieux.
- issue: Relation de l’acte à Jésus
  choice: envers moi
  alternative: pour moi
  rationale: « Envers moi » préserve l’orientation exprimée par εἰς, tandis que « pour moi » mettrait davantage en avant le bénéfice ou la destination de l’acte. L’alternative est signalée sans trancher au-delà du grec.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct garde la vigueur du reproche de Jésus. « Belle action » est plus idiomatique aujourd’hui que « belle œuvre » dans ce contexte, tout en préservant la nuance de καλός. Tous les marqueurs de notes sont placés immédiatement après l’expression concernée.
