id: MAT.26.2
reference: Matthew 26:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἴδατε ὅτι μετὰ δύο ἡμέρας τὸ πάσχα γίνεται, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς τὸ σταυρωθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/002.yaml
  text: You know that after two days the Passover is coming[a], and the Son of Man is being handed over to be crucified.
translation:
  language: fr
  text: Vous savez que, dans deux jours, ce sera la Pâque, et que le Fils de l’homme sera livré[a] pour être crucifié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sera trahi ». Le verbe grec peut désigner une trahison, mais signifie plus largement « être livré » ou « être remis ».
    reason: alternative_reading
lexical_decisions:
- source_word: Οἴδατε
  choice: Vous savez
  rationale: Le parfait οἴδατε a ici un sens présent. « Vous savez » est direct, naturel et conserve la deuxième personne du pluriel.
- source_word: μετὰ δύο ἡμέρας
  choice: dans deux jours
  rationale: Avec l’accusatif, μετά exprime un intervalle temporel. En français courant, « dans deux jours » rend naturellement le sens de « après deux jours » sans suggérer une date ultérieure imprécise.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: πάσχα désigne la Pâque juive. Le singulier « la Pâque » est la désignation française traditionnelle et précise, sans ajouter « fête », absent du grec.
- source_word: γίνεται
  choice: ce sera
  rationale: Dans ce contexte temporel, γίνομαι indique que la Pâque aura lieu ou arrivera. « Ce sera la Pâque » est idiomatique en français et exprime clairement son imminence.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation consacrée préserve le titre employé par Jésus ainsi que ses résonances bibliques, sans le paraphraser.
- source_word: παραδίδοται
  choice: sera livré
  rationale: Le présent passif grec décrit ici un événement imminent. Le futur est naturel en français après « dans deux jours », tandis que « livré » conserve le sens large du verbe sans le réduire à la seule trahison de Judas.
- source_word: εἰς τὸ σταυρωθῆναι
  choice: pour être crucifié
  rationale: La construction εἰς suivie de l’infinitif substantivé exprime ici le but ou l’issue. « Pour être crucifié » en donne une traduction claire et directe.
theological_decisions:
- issue: Sens de παραδίδοται dans l’annonce de la Passion
  choice: sera livré
  alternative: sera trahi
  rationale: Le contexte comprend la trahison de Judas, mais παραδίδωμι signifie plus largement remettre ou livrer quelqu’un. « Sera livré » préserve donc la tension entre la trahison humaine, la remise aux autorités et la dimension plus large de la Passion, sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase répète « que » devant la seconde proposition pour assurer une syntaxe naturelle. Le futur rend en français l’imminence exprimée par les présents grecs dans cette annonce.
