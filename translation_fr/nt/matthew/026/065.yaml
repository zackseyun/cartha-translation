  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ὁ ἀρχιερεὺς διέρρηξεν τὰ ἱμάτια αὐτοῦ ⸀λέγων· Ἐβλασφήμησεν· τί ἔτι χρείαν ἔχομεν μαρτύρων; ἴδε νῦν ἠκούσατε τὴν ⸀βλασφημίαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/065.yaml
  text: Then the high priest tore his garments[a], saying, “He has blasphemed! What further need do we have of witnesses? See[b], now you have heard the blasphemy.”
translation:
  language: fr
  text: 'Alors le grand prêtre déchira ses vêtements[a] et dit : « Il a blasphémé ! Avons-nous encore besoin de témoins ? Voyez, vous venez d’entendre le blasphème. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Déchirer ses vêtements était un signe public de consternation, de douleur ou d’indignation.
    reason: cultural_note
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la succession immédiate des événements dans le récit.
- source_word: ὁ ἀρχιερεὺς
  choice: le grand prêtre
  rationale: Désignation française conventionnelle et exacte du titulaire de cette fonction.
- source_word: διέρρηξεν τὰ ἱμάτια αὐτοῦ
  choice: déchira ses vêtements
  rationale: Rend directement le geste public de déchirer ses habits sans préciser indûment qu’il s’agissait de robes officielles.
- source_word: λέγων
  choice: et dit
  rationale: Transformation idiomatique du participe grec en verbe coordonné, naturelle dans un récit français.
- source_word: Ἐβλασφήμησεν
  choice: Il a blasphémé
  rationale: Le passé composé exprime une accusation portant sur les paroles qui viennent d’être prononcées et conserve le terme religieux et juridique.
- source_word: τί ἔτι χρείαν ἔχομεν μαρτύρων;
  choice: Avons-nous encore besoin de témoins ?
  rationale: Formulation française naturelle qui conserve l’idée de besoin et la valeur temporelle de ἔτι.
- source_word: ἴδε νῦν ἠκούσατε
  choice: Vous venez d’entendre
  rationale: En français moderne, « venir de » restitue avec naturel l’appel à constater ce qui a été entendu à l’instant; l’impératif ἴδε est intégré pragmatiquement plutôt que traduit par un peu naturel « Voyez, maintenant ».
- source_word: τὴν βλασφημίαν
  choice: son blasphème
  rationale: Identifie naturellement en français le propos attribué à Jésus comme objet de l’accusation; le possessif explicite un lien contextuel sans valider l’accusation du grand prêtre.
theological_decisions:
- issue: Statut de l’accusation exprimée par βλασφημέω / βλασφημία
  choice: Conserver « blasphémé » et « blasphème » dans les paroles du grand prêtre.
  alternative: « Il a tenu des propos offensants envers Dieu » / « ces propos offensants »
  rationale: Le vocabulaire traditionnel préserve la portée religieuse et judiciaire de l’accusation. Les guillemets montrent qu’il s’agit du jugement du grand prêtre, sans en faire une affirmation du narrateur.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe directe convient à la vivacité de la scène judiciaire. Le marqueur [a] est placé immédiatement après « vêtements ». Aucun second appel de note n’est nécessaire, car « Vous venez d’entendre » rend idiomatiquement ἴδε νῦν ἠκούσατε.
