  text: καὶ ὑμνήσαντες ἐξῆλθον εἰς τὸ Ὄρος τῶν Ἐλαιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/030.yaml
  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: fr
  text: Après avoir chanté des louanges[a], ils sortirent pour aller au mont des Oliviers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « après avoir chanté un hymne ». Le verbe grec peut désigner plus généralement le fait de chanter des louanges.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσαντες
  choice: Après avoir chanté des louanges
  rationale: Le participe aoriste de ὑμνέω exprime une action antérieure au verbe principal et peut désigner le fait de chanter des hymnes ou des louanges. Cette formulation française est naturelle et conserve la portée générale du verbe sans imposer le singulier absent du grec.
- source_word: ἐξῆλθον
  choice: ils partirent
  rationale: Dans ce contexte narratif, ἐξέρχομαι indique qu’ils quittent le lieu du repas et se dirigent ailleurs. « Ils partirent » rend naturellement le mouvement sans lourdeur.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: pour le mont des Oliviers
  rationale: εἰς marque ici la destination. « Le mont des Oliviers » est le nom géographique français consacré et fidèle au grec.
- source_word: καὶ
  choice: Après…
  rationale: La coordination grecque est intégrée naturellement à la construction participiale française. La succession temporelle découle du participe aoriste, sans qu’un « et » initial soit nécessaire.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La formulation évite d’ajouter au grec l’idée précise d’un seul hymne, tout en signalant cette traduction traditionnelle en note.
