id: MAT.26.41
reference: Matthew 26:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ εἰσέλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/041.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: fr
  text: Restez éveillés et priez, afin de ne pas entrer en tentation[a]. L’esprit est bien disposé, mais la chair est faible.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épreuve » ou « la mise à l’épreuve ». Le mot grec peut désigner soit une incitation à pécher, soit une situation qui met quelqu’un à l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: Restez éveillés
  rationale: L’impératif pluriel signifie littéralement « restez éveillés / veillez ». Dans le contexte de Gethsémani, où les disciples se sont endormis, « Restez éveillés » garde le sens concret tout en laissant entendre la vigilance spirituelle.
- source_word: προσεύχεσθε
  choice: priez
  rationale: L’impératif présent pluriel est rendu naturellement par « priez »; le contexte et la coordination avec « restez éveillés » permettent de comprendre une action à poursuivre.
- source_word: ἵνα μὴ εἰσέλθητε
  choice: afin de ne pas entrer
  rationale: Cette formulation conserve le rapport de but ou de prévention exprimé par ἵνα μή ainsi que l’image grecque d’entrer dans une situation d’épreuve, sans l’interpréter par « succomber ».
- source_word: πειρασμόν
  choice: tentation
  rationale: Dans ce contexte de défaillance morale imminente sous la pression, « tentation » convient bien. Le mot grec peut aussi désigner une mise à l’épreuve ou une épreuve; cette ambiguïté est signalée en note.
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: L’esprit est bien disposé
  rationale: « Bien disposé » exprime la volonté et la disponibilité de πρόθυμος. La minuscule à « esprit » favorise ici le sens de l’esprit humain ou de la disposition intérieure, tout en évitant d’expliciter davantage que le grec.
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: mais la chair est faible
  rationale: « Chair » conserve l’image et la tension du grec, qui évoque ici la fragilité humaine incarnée sans imposer le sens plus interprétatif de « nature pécheresse ». « Faible » rend directement ἀσθενής.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: « esprit » avec une minuscule, compris principalement comme l’esprit humain ou la disposition intérieure
  alternative: « Esprit » comme référence au Saint-Esprit
  rationale: Le contraste avec la chair et le contexte — l’intention sincère des disciples face à leur défaillance — favorisent le sens humain. La traduction reste concise et n’ajoute aucune précision doctrinale absente du texte.
- issue: Sens de σάρξ
  choice: « chair »
  alternative: « corps », « faiblesse humaine » ou « nature pécheresse »
  rationale: Ici, σάρξ renvoie surtout à la fragilité humaine et corporelle. « Chair » préserve l’expression biblique et sa tension avec « esprit », sans importer une catégorie paulinienne développée ni réduire le terme au seul corps.
translation_notes:
  register: Français international moderne, naturel et digne. Le pluriel des impératifs est conservé. « Restez éveillés » convient au sommeil concret des disciples tout en portant l’appel à la vigilance; « entrer dans » préserve la métaphore grecque; « esprit » et « chair » maintiennent le contraste sans le surinterpréter.
