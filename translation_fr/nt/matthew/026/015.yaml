id: MAT.26.15
reference: Matthew 26:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν· Τί θέλετέ μοι δοῦναι κἀγὼ ὑμῖν παραδώσω αὐτόν; οἱ δὲ ἔστησαν αὐτῷ τριάκοντα ἀργύρια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/015.yaml
  text: He said[a], “What are you willing to give me, and I will hand him over to you?” And they weighed out for him thirty pieces of silver.
translation:
  language: fr
  text: 'Il leur dit : « Que voulez-vous me donner, et moi, je vous le livrerai[a] ? » Ils lui fixèrent trente pièces d’argent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je vous le remettrai » ou, dans ce contexte, « je le trahirai ». Le verbe grec peut prendre ces différents sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί θέλετέ μοι δοῦναι
  choice: Que voulez-vous me donner
  rationale: Cette formulation conserve directement la nuance de volonté exprimée par θέλετε et convient au contexte d’une négociation.
- source_word: κἀγὼ ὑμῖν παραδώσω αὐτόν
  choice: et moi, je vous le livrerai
  rationale: « Livrer » rend le sens large de παραδίδωμι — remettre quelqu’un au pouvoir d’autrui — sans inscrire directement dans le verbe le jugement moral exprimé par « trahir ».
- source_word: οἱ δὲ
  choice: Ils
  rationale: Dans ce bref enchaînement narratif, le français n’a pas besoin d’un connecteur explicite pour rendre le faible δέ.
- source_word: ἔστησαν αὐτῷ
  choice: Ils lui comptèrent
  rationale: Dans ce contexte de paiement en argent, « compter » exprime naturellement l’action de déterminer et de remettre la somme, tout en gardant une image plus concrète que le simple verbe « payer ».
- source_word: τριάκοντα ἀργύρια
  choice: trente pièces d’argent
  rationale: ἀργύρια désigne de l’argent sous forme de pièces sans préciser leur dénomination. « Pièces d’argent » conserve cette absence de précision.
theological_decisions:
- issue: Traduction de παραδώσω dans la proposition de Judas
  choice: je vous le livrerai
  alternative: je vous le trahirai
  rationale: Le contexte présente bien une trahison, mais παραδίδωμι signifie plus largement « livrer » ou « remettre ». Le texte principal préserve cette largeur sémantique, tandis que la note signale la portée contextuelle.
translation_notes:
  register: Français moderne, courant et digne. La reprise emphatique « et moi » reflète κἀγώ et fait ressortir les deux termes de l’accord proposé. Le marqueur de note est placé immédiatement après le verbe concerné.
