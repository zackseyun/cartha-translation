source:
  edition: SBLGNT
  text: ἔφη αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι ἐν ταύτῃ τῇ νυκτὶ πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/034.yaml
  text: Jesus said to him, “Truly I tell you, in this very night, before a rooster crows, you will deny me three times.”
translation:
  language: fr
  text: 'Jésus lui dit : « Vraiment, je te le dis, cette nuit même[a], avant qu’un coq chante[b], tu me renieras trois fois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « cette nuit ». Le grec souligne « cette » ; la tournure signifie naturellement « cette nuit même ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avant que le coq chante ». En grec, « coq » est sans article, mais le français permet ici l’article indéfini ou défini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Le passé simple convient au récit écrit et rend sobrement le verbe de parole, tandis que « lui » conserve l’adresse à Pierre.
- source_word: Ἀμὴν λέγω σοι
  choice: Vraiment, je te le dis
  rationale: « Vraiment » rend la formule solennelle Ἀμήν sans conserver un hébraïsme opaque; « je te le dis » reste naturel et maintient l’adresse personnelle au singulier.
- source_word: ἐν ταύτῃ τῇ νυκτί
  choice: cette nuit même
  rationale: Cette formulation française naturelle conserve l’insistance du démonstratif ταύτῃ; « ce soir » serait plus étroit et moins fidèle à νύξ.
- source_word: πρὶν ἀλέκτορα φωνῆσαι
  choice: avant qu’un coq chante
  rationale: La proposition française rend naturellement la construction infinitive grecque. L’absence d’article devant ἀλέκτορα permet l’indéfini « un », sans l’imposer absolument.
- source_word: τρὶς
  choice: trois fois
  rationale: C’est l’équivalent moderne, clair et direct de l’adverbe grec.
- source_word: ἀπαρνήσῃ με
  choice: tu me renieras
  rationale: « Renier » exprime ici le refus de reconnaître son lien avec Jésus et correspond à l’usage biblique français établi sans surinterpréter la nature exacte des déclarations de Pierre.
theological_decisions:
- issue: Formule introductive solennelle Ἀμὴν λέγω σοι
  choice: Vraiment, je te le dis
  alternative: Amen, je te le dis
  rationale: Le choix préserve l’autorité et la solennité de la parole de Jésus tout en restant immédiatement compréhensible en français moderne, sans ajouter de portée liturgique.
- issue: Portée de ἀπαρνήσῃ με
  choice: tu me renieras
  alternative: tu diras trois fois que tu ne me connais pas
  rationale: La traduction conserve le verbe général du texte grec et n’explicite pas à l’avance la forme précise que prendra le reniement dans la suite du récit.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple est maintenu comme temps courant du récit biblique écrit. Les deux notes signalent les véritables possibilités lexicales sans alourdir le verset.
