  text: λέγοντες· Προφήτευσον ἡμῖν, χριστέ, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/068.yaml
  text: 'saying[a], “Prophesy to us, Messiah: who is it that struck you?”'
translation:
  language: fr
  text: 'en disant : « Prophétise-nous, Messie[a] ! Qui t’a frappé ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Christ ». Le titre grec Χριστός est rendu ici par « Messie » parce qu’il est employé comme un titre plutôt que comme une forme assimilée à un nom propre.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent introduit les paroles des hommes et se rend naturellement en français par « en disant », tout en conservant le lien syntaxique avec le verset précédent.
- source_word: Προφήτευσον
  choice: Prophétise-nous
  rationale: L’impératif aoriste est rendu par un impératif direct. Dans ce contexte, l’ordre est une raillerie exigeant de Jésus une connaissance prophétique de l’identité de son agresseur.
- source_word: ἡμῖν
  choice: -nous
  rationale: Le pronom au datif désigne les destinataires de la prophétie demandée ; le pronom français postposé à l’impératif exprime naturellement ce rapport.
- source_word: χριστέ
  choice: Messie
  rationale: Χριστός est ici un titre au vocatif, employé sur le ton de la moquerie. « Messie » en communique le sens titulaire plutôt que de le traiter comme un nom propre figé.
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: Qui t’a frappé ?
  rationale: La tournure grecque signifie littéralement « qui est celui qui t’a frappé ? ». La formulation française concise conserve pleinement la demande d’identification et l’acte concret de frapper.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le vocatif χριστέ fonctionne ici clairement comme un titre messianique lancé à Jésus par dérision. « Messie » en rend directement la valeur sémantique, tandis que « Christ » reste une traduction traditionnelle possible.
translation_notes:
  register: Français moderne, direct et digne. L’exclamation après l’impératif fait entendre la raillerie, tandis que la question brève restitue naturellement la demande d’identification. Le verset commence par une minuscule parce que « en disant » dépend syntaxiquement du contexte précédent.
