id: MAT.26.12
reference: Matthew 26:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: βαλοῦσα γὰρ αὕτη τὸ μύρον τοῦτο ἐπὶ τοῦ σώματός μου πρὸς τὸ ἐνταφιάσαι με ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/012.yaml
  text: For when she poured this perfume on my body[b][a], she did it to prepare me for burial.
translation:
  language: fr
  text: Car en versant ce parfum sur mon corps, elle l’a fait pour préparer mon ensevelissement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle l’a fait en vue de mon ensevelissement ». Le verbe grec peut englober la préparation du corps en vue de sa mise au tombeau.
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσα
  choice: en versant
  rationale: Le participe aoriste de βάλλω désigne ici, de façon idiomatique, l’application du parfum sur le corps. « En versant » exprime naturellement en français le rapport entre ce geste et sa finalité.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit l’explication donnée par Jésus au sujet du geste de la femme.
- source_word: μύρον
  choice: parfum
  rationale: μύρον désigne une huile ou préparation parfumée servant notamment à l’onction. « Parfum » est clair et naturel dans ce contexte.
- source_word: ἐπὶ τοῦ σώματός μου
  choice: sur mon corps
  rationale: ἐπί avec le génitif indique ici l’application ou le contact avec le corps.
- source_word: πρὸς τὸ ἐνταφιάσαι με
  choice: pour préparer mon ensevelissement
  rationale: πρός avec l’infinitif substantivé exprime le but, et ἐνταφιάζω peut désigner les soins préparant un corps à l’ensevelissement. Cette formulation garde à la fois l’idée de préparation et celle de mise au tombeau.
- source_word: ἐποίησεν
  choice: elle l’a fait
  rationale: ποιέω reprend globalement l’action qui vient d’être décrite. Le pronom « l’ » évite une répétition pesante.
- source_word: αὕτη
  choice: elle
  rationale: Le référent féminin est déjà clair dans le contexte ; « elle » est donc plus naturel que le démonstratif littéral « celle-ci ».
theological_decisions:
- issue: Sens de ἐνταφιάζω en rapport avec la mort de Jésus
  choice: Le geste de la femme est présenté comme préparant l’ensevelissement de Jésus.
  alternative: Le geste est simplement accompli « pour son ensevelissement », sans expliciter la notion de préparation.
  rationale: Le verbe peut englober la préparation funéraire du corps. La traduction explicite cette nuance sans ajouter d’affirmation doctrinale étrangère au verset.
translation_notes:
  register: Français moderne, digne et accessible. « Ensevelissement » est retenu plutôt que « enterrement », car le contexte concerne les soins funéraires et la mise au tombeau de Jésus.
source_grounding:
  english_pob_role: consult_only
