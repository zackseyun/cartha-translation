  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λυπούμενοι σφόδρα ἤρξαντο λέγειν αὐτῷ ⸂εἷς ἕκαστος⸃· Μήτι ἐγώ εἰμι, κύριε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/022.yaml
  text: And being deeply grieved[a], they began to say to him one by one, “Surely not I[b], Lord?”
translation:
  language: fr
  text: 'Profondément attristés, ils se mirent à lui dire, l’un après l’autre[a] : « Ce n’est tout de même pas moi[b], Seigneur ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chacun à son tour » ou « chacun d’eux ».
    reason: lexical_alternative
  - marker: b
    text: 'Le mot grec qui introduit la question laisse attendre une réponse négative : « Ce n’est sûrement pas moi, n’est-ce pas ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπούμενοι σφόδρα
  choice: Profondément attristés
  rationale: Le participe présent décrit leur état émotionnel, tandis que σφόδρα l’intensifie. Cette formulation naturelle conserve à la fois la tristesse et son intensité.
- source_word: ἤρξαντο λέγειν αὐτῷ
  choice: ils se mirent à lui dire
  rationale: « Se mirent à » rend la valeur ingressive de ἤρξαντο, et « lui dire » suit simplement λέγειν αὐτῷ tout en introduisant naturellement la parole directe.
- source_word: εἷς ἕκαστος
  choice: l’un après l’autre
  rationale: L’expression distributive souligne que chacun prend personnellement la parole. « L’un après l’autre » est idiomatique en français et préserve cette insistance.
- source_word: Μήτι ἐγώ εἰμι
  choice: Ce n’est tout de même pas moi
  rationale: 'Μήτι introduit une question qui appelle normalement une réponse négative. Cette tournure française exprime l’attente inquiète : « Non, ce n’est pas moi, n’est-ce pas ? »'
- source_word: κύριε
  choice: Seigneur
  rationale: Dans cette adresse à Jésus, « Seigneur » conserve la portée narrative et théologique possible du titre κύριος sans la réduire à une simple formule de politesse.
theological_decisions:
- issue: Sens de κύριε dans l’adresse à Jésus
  choice: Seigneur
  alternative: monsieur / maître
  rationale: κύριε peut parfois être une adresse polie, mais « Seigneur » préserve ici sans l’atténuer la portée possible du titre dans le récit de Matthieu.
- issue: Force de la question introduite par μήτι
  choice: Ce n’est tout de même pas moi ?
  alternative: Est-ce moi ?
  rationale: La formulation retenue conserve l’orientation négative de la question grecque et l’attente de chaque disciple que Jésus réponde que non.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec sans devenir raide ; « tout de même » rend explicitement la nuance pragmatique de μήτι.
