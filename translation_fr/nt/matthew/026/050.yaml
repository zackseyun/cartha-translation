  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Ἑταῖρε, ἐφ’ ⸀ὃ πάρει. τότε προσελθόντες ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν καὶ ἐκράτησαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/050.yaml
  text: But Jesus said to him[a], “Friend, do what you came for.” Then they came up, laid hands on Jesus, and seized him.
translation:
  language: fr
  text: 'Mais Jésus lui dit : « Mon ami, fais ce pour quoi tu es venu.[a] » Alors ils s’approchèrent, mirent les mains sur Jésus et le saisirent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon ami, pour quoi es-tu venu ? » L’expression grecque est très concise et peut être comprise comme une question.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Mon ami
  rationale: Interpellation directe adressée à Judas. « Mon ami » est naturel en français et garde ici un ton retenu, sans nécessairement suggérer une amitié intime.
- source_word: ἐφ’ ὃ πάρει
  choice: fais ce pour quoi tu es venu
  rationale: La formule grecque est très condensée et peut se comprendre comme une invitation de type impératif ou comme une question. Le texte principal exprime naturellement en français le premier sens, tandis que la lecture interrogative est conservée en note.
- source_word: προσελθόντες
  choice: ils s’approchèrent
  rationale: Le participe aoriste indique que les hommes avancent vers Jésus avant de le saisir; la coordination française rend clairement cette succession narrative.
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ τὸν Ἰησοῦν
  choice: mirent la main sur Jésus
  rationale: Cette locution française exprime une prise physique hostile et correspond bien à l’idiome grec dans un contexte d’arrestation.
- source_word: ἐκράτησαν αὐτόν
  choice: se saisirent de lui
  rationale: Le verbe désigne ici le fait d’empoigner et de retenir Jésus. Cette formulation conserve l’action physique sans ajouter explicitement la nuance juridique d’une arrestation.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque une légère opposition ou un tournant narratif entre le geste de Judas et la réponse de Jésus.
theological_decisions:
- issue: Interprétation des paroles adressées par Jésus à Judas
  choice: « Mon ami, fais ce pour quoi tu es venu. »
  alternative: « Mon ami, pourquoi es-tu venu ? »
  rationale: Le texte garde le ton sobre de Jésus sans l’adoucir ni le durcir artificiellement. Comme la syntaxe grecque est elliptique et permet réellement une lecture interrogative, celle-ci est signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite aussi bien l’archaïsme que le vocabulaire juridique ajouté; la note préserve l’ambiguïté authentique du grec.
