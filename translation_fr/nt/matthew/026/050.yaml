    issue: La note traduit l’alternative interrogative par « pourquoi es-tu venu ? ».
    rationale: L’expression grecque elliptique ἐφ’ ὃ πάρει se rapproche plus littéralement de « pour quoi es-tu venu ? », c’est-à-dire « dans quel but ». « Pourquoi » est une interprétation possible, mais elle réduit légèrement l’ambiguïté préservée par l’audit anglais.
  - severity: low
    issue: « Mirent la main sur Jésus » emploie le singulier.
    rationale: Le grec porte explicitement « les mains ». Le pluriel français demeure naturel dans cette description et conserve mieux le détail de l’action sans modifier le sens.
