review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle. Toutefois, la note doit rendre plus précisément l’alternative interrogative de ἐφ’ ὃ πάρει (« pour quoi / dans quel but es-tu venu ? »), plutôt que la réduire à « pourquoi ». Dans l’action d’arrestation, le pluriel explicite de τὰς χεῖρας mérite d’être conservé.
  naturalness: Le français est globalement naturel et de registre moderne. « Mirent la main sur Jésus » au singulier est idiomatique, mais « mirent les mains sur Jésus » correspond mieux au texte grec et décrit plus clairement l’action physique collective.
  terminology: « Mon ami » convient comme apostrophe française naturelle pour Ἑταῖρε, sans exagérer l’affection. « Le saisirent » rend bien ἐκράτησαν αὐτόν et évite d’ajouter la nuance juridique de « l’arrêtèrent ».
  issues:
