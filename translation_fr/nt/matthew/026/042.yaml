  text: πάλιν ἐκ δευτέρου ἀπελθὼν προσηύξατο λέγων· Πάτερ μου, εἰ οὐ δύναται ⸀τοῦτο ⸀παρελθεῖν ἐὰν μὴ αὐτὸ πίω, γενηθήτω τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/042.yaml
  text: Again[a], a second time he went away and prayed, saying, “My Father, if this cannot pass unless I drink it[b], your will be done.”
translation:
  language: fr
  text: 'Il s’éloigna de nouveau, pour la deuxième fois, et pria en disant : « Mon Père, s’il n’est pas possible que cela[a] passe sans que je le boive[b], que ta volonté soit faite. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Cela » désigne la coupe évoquée au verset précédent, c’est-à-dire la souffrance à venir. Le grec dit simplement « cela » dans ce verset.
    reason: cross_reference
  - marker: b
    text: 'Autre traduction : « si cela ne peut passer à moins que je ne le boive » ou « si cela ne peut passer sans que je le boive ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐκ δευτέρου
  choice: de nouveau … une deuxième fois
  rationale: Cette formulation naturelle conserve les deux indications grecques de répétition sans les fondre en une seule.
- source_word: ἀπελθὼν προσηύξατο λέγων
  choice: il s’éloigna … et pria … en disant
  rationale: Le participe aoriste est rendu par un verbe conjugué coordonné au verbe principal, conformément au récit français courant, tandis que λέγων introduit directement les paroles de la prière.
- source_word: Πάτερ μου
  choice: Mon Père
  rationale: Rend directement le vocatif accompagné du possessif et conserve l’adresse filiale.
- source_word: εἰ οὐ δύναται τοῦτο παρελθεῖν
  choice: s’il n’est pas possible que ceci passe
  rationale: La tournure exprime l’impossibilité indiquée par οὐ δύναται, tout en gardant le démonstratif neutre τοῦτο sans expliciter son référent dans le texte.
- source_word: ἐὰν μὴ αὐτὸ πίω
  choice: sans que je le boive
  rationale: Dans cette construction française, « sans que » rend naturellement la condition restrictive ἐὰν μή; « le » reprend « ceci » et conserve l’image implicite de boire.
- source_word: γενηθήτω τὸ θέλημά σου
  choice: que ta volonté soit faite
  rationale: Le subjonctif français rend la force volitive de l’impératif grec et maintient l’écho avec Matthieu 6.10.
theological_decisions:
- issue: Faut-il expliciter « la coupe » pour τοῦτο et αὐτό ?
  choice: Conserver « ceci » et « le » dans le texte principal.
  alternative: « cette coupe » et « la boire »
  rationale: Le contexte immédiat identifie clairement la coupe, mais le nom ποτήριον n’est pas répété dans ce verset. La traduction préserve donc la formulation de Matthieu et indique le référent en note.
- issue: Formulation de la soumission de Jésus à la volonté du Père
  choice: « que ta volonté soit faite »
  alternative: « que ta volonté s’accomplisse »
  rationale: Cette formulation garde la force de la demande et l’écho verbal et théologique avec la prière de Matthieu 6.10, sans résoudre la tension du récit.
translation_notes:
  register: Français international moderne, digne et accessible. La légère répétition « de nouveau … une deuxième fois » est maintenue afin de représenter πάλιν et ἐκ δευτέρου. Le tutoiement correspond à l’adresse filiale directe et à l’usage biblique français courant.
