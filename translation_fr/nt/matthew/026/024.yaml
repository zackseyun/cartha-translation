id: MAT.26.24
reference: Matthew 26:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/024.yaml
  text: The Son of Man indeed goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been better for him if that man had not been born.
translation:
  language: fr
  text: Le Fils de l’homme s’en va, comme il est écrit à son sujet ; mais malheur à cet homme par qui le Fils de l’homme est livré[a] ! Il aurait mieux valu pour cet homme ne pas être né.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est trahi ». Le verbe grec peut signifier « livrer, remettre » ou, selon le contexte, « trahir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ μὲν υἱὸς τοῦ ἀνθρώπου
  choice: Le Fils de l’homme
  rationale: Conserve le titre établi « Fils de l’homme ». Le contraste μὲν…δὲ est rendu naturellement par la progression de la phrase et par « mais », sans ajouter un « certes » peu nécessaire.
- source_word: ὑπάγει
  choice: s’en va
  rationale: Rend le présent grec et laisse le contexte préciser que ce départ mène à la mort, sans l’expliciter dans la traduction.
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: comme il est écrit à son sujet
  rationale: Formulation française naturelle et consacrée qui rend le parfait γέγραπται comme un écrit dont l’autorité demeure.
- source_word: οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: mais malheur à l’homme
  rationale: « Malheur à » préserve la force prophétique et judiciaire de οὐαί ; « mais » marque le contraste introduit par δέ.
- source_word: δι’ οὗ
  choice: par qui
  rationale: Expression française idiomatique de l’agent intermédiaire indiqué par διά avec le génitif.
- source_word: παραδίδοται
  choice: est livré
  rationale: « Livré » conserve le sens premier de remise aux autorités tout en pouvant évoquer la trahison de Judas ; l’autre valeur contextuelle est signalée en note.
- source_word: καλὸν ἦν αὐτῷ εἰ οὐκ ἐγεννήθη
  choice: Il aurait mieux valu pour cet homme ne pas être né
  rationale: Rend idiomatiquement en français la préférence contrefactuelle exprimée par cette construction, sans affaiblir la gravité du propos.
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: cet homme
  rationale: Maintient la reprise démonstrative et sa force de désignation.
theological_decisions:
- issue: Rapport entre l’accomplissement des Écritures et la responsabilité humaine
  choice: Conserver ensemble le départ du Fils de l’homme conforme à l’Écriture et le malheur prononcé contre celui qui le livre.
  alternative: Résoudre la tension soit en minimisant la responsabilité de Judas, soit en atténuant l’accomplissement scripturaire.
  rationale: Le grec affirme les deux réalités sans expliquer leur articulation ; la traduction garde cette tension intacte.
- issue: Portée de la déclaration finale sur la non-naissance
  choice: La rendre comme une sévère parole de jugement, sans en tirer une conclusion doctrinale supplémentaire.
  alternative: La réduire à une simple hyperbole ou l’expliciter comme preuve d’une doctrine détaillée du sort final de Judas.
  rationale: Le texte affirme qu’il aurait mieux valu pour cet homme ne pas être né, mais ne développe pas davantage les implications de cette affirmation.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief le contraste et la force de l’exclamation sans alourdir la syntaxe.
