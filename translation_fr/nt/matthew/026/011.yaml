id: MAT.26.11
reference: Matthew 26:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/011.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: fr
  text: En effet, vous avez toujours les pauvres avec vous[a], mais moi, vous ne m’avez pas toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les personnes pauvres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: toujours
  rationale: L’adverbe exprime ici une présence durable ou constamment accessible. « Toujours » est naturel et conserve sa répétition dans les deux propositions.
- source_word: γὰρ
  choice: en effet
  rationale: γάρ introduit la raison de l’affirmation précédente. « En effet » marque clairement ce lien explicatif en français moderne.
- source_word: τοὺς πτωχοὺς
  choice: les pauvres
  rationale: Le pluriel substantivé désigne collectivement les personnes pauvres. « Les pauvres » est une formulation française concise et idiomatique; « les personnes pauvres » reste possible.
- source_word: ἔχετε
  choice: vous aurez
  rationale: Dans ce contexte, ἔχω exprime la présence ou la disponibilité plutôt que la possession. Le futur français est idiomatique pour rendre l’idée générale et prospective de « toujours avoir avec soi », bien que le grec emploie le présent.
- source_word: μεθ’ ἑαυτῶν
  choice: avec vous
  rationale: L’expression indique la présence auprès des disciples. « Avec vous » est naturel et restitue le sens sans le calque lourd « avec vous-mêmes ».
- source_word: ἐμὲ
  choice: moi… m’
  rationale: Le pronom accentué, placé en tête de la seconde proposition grecque, est rendu par « moi » pour préserver le contraste, puis repris comme complément de « aurez ».
- source_word: δὲ
  choice: mais
  rationale: δέ établit le contraste entre la présence constante des pauvres et la présence limitée de Jésus auprès des disciples.
- source_word: οὐ πάντοτε
  choice: pas toujours
  rationale: La négation conserve le contraste temporel direct avec le premier « toujours » sans en préciser davantage la portée.
theological_decisions:
- issue: Portée de la présence de Jésus
  choice: Conserver le contraste temporel entre la présence durable des pauvres et la présence limitée de Jésus auprès des disciples.
  alternative: Comprendre la phrase comme une minimisation du devoir de prendre soin des pauvres.
  rationale: Le grec énonce un contraste de disponibilité dans le temps; il ne dévalorise pas les pauvres et n’explicite pas ici la nature exacte de l’absence prochaine de Jésus.
translation_notes:
  register: Français moderne, courant et digne. « En effet » rend le lien explicatif avec le contexte. La dislocation « mais moi, vous ne m’aurez pas toujours » préserve naturellement l’accent contrastif porté par ἐμέ. Le futur idiomatique évite qu’au présent « vous ne m’avez pas toujours » soit compris comme une fréquence intermittente plutôt que comme une disponibilité à venir limitée.
