id: MAT.26.39
reference: Matthew 26:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀προελθὼν μικρὸν ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ προσευχόμενος καὶ λέγων· Πάτερ μου, εἰ δυνατόν ἐστιν, παρελθάτω ἀπ’ ἐμοῦ τὸ ποτήριον τοῦτο· πλὴν οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/039.yaml
  text: And going a little farther[a], he fell on his face, praying and saying, “My Father, if it is possible, let this cup pass from me; yet not as I will[b], but as you will.”
translation:
  language: fr
  text: 'Puis, s’étant avancé un peu, il tomba face contre terre[a] et pria en disant : « Mon Père, si c’est possible, que cette coupe[b] s’éloigne de moi ! Cependant, non pas comme je veux, mais comme tu veux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il se prosterna, le visage contre terre ».'
    reason: lexical_alternative
  - marker: b
    text: Dans la Bible, la « coupe » peut représenter une part assignée, en particulier une souffrance à subir ; voir Matthieu 20.22 et 26.42.
    reason: cross_reference
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: s’étant avancé un peu
  rationale: Le participe aoriste indique que Jésus parcourt encore une courte distance avant de se prosterner. Cette formulation naturelle conserve la progression du récit.
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτοῦ
  choice: il tomba face contre terre
  rationale: L’expression décrit concrètement une posture de prosternation. « Face contre terre » est clair, actuel et solennel sans atténuer le mouvement exprimé par ἔπεσεν.
- source_word: προσευχόμενος καὶ λέγων
  choice: et pria en disant
  rationale: Les participes présents décrivent la prière et les paroles qui accompagnent la posture. La tournure française évite une coordination pesante tout en conservant les deux idées.
- source_word: Πάτερ μου
  choice: Mon Père
  rationale: Le vocatif accompagné du possessif exprime à la fois la proximité et le respect, sans ajouter de nuance affective absente du grec.
- source_word: εἰ δυνατόν ἐστιν
  choice: si c’est possible
  rationale: Cette formulation rend la proposition complète de façon idiomatique, sans préciser abusivement ce qui serait possible.
- source_word: παρελθάτω ἀπ’ ἐμοῦ
  choice: que … s’éloigne de moi
  rationale: L’impératif aoriste prend ici la forme d’une demande. « S’éloigne de moi » communique naturellement l’idée de la coupe qui passe et n’atteint pas Jésus, tout en conservant l’image.
- source_word: τὸ ποτήριον τοῦτο
  choice: cette coupe
  rationale: Le nom concret est maintenu afin de préserver la métaphore biblique d’une part assignée, notamment d’une souffrance à subir, sans la remplacer par une interprétation explicite.
- source_word: πλὴν
  choice: cependant
  rationale: Le terme introduit une forte réserve qui subordonne la demande précédente à la volonté du Père. « Cependant » convient au registre digne du passage.
- source_word: οὐχ ὡς ἐγὼ θέλω ἀλλ’ ὡς σύ
  choice: non pas comme je veux, mais comme tu veux
  rationale: La répétition de « veux », implicite dans le second membre grec, rend clairement en français le contraste entre la volonté de Jésus et celle du Père sans l’expliquer davantage.
theological_decisions:
- issue: La métaphore de la coupe dans la prière de Jésus
  choice: Conserver « cette coupe » dans le texte principal.
  alternative: Remplacer l’image par « cette souffrance » ou « ce sort ».
  rationale: ποτήριον est employé métaphoriquement, avec de profonds échos bibliques liés à une part assignée, souvent à la souffrance et au jugement. Garder l’image préserve ces résonances et ne réduit pas sa portée à une seule explication.
- issue: La volonté de Jésus par rapport à celle du Père
  choice: Traduire θέλω par « je veux / tu veux ».
  alternative: Employer « je désire / tu désires » ou reformuler par « ma volonté / la tienne ».
  rationale: La formulation verbale conserve le parallélisme grec et présente sans l’atténuer la volonté véritable de Jésus, librement subordonnée à celle du Père.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme narratif reste fluide, tandis que les images concrètes de la prosternation et de la coupe ainsi que le contraste des volontés sont préservés.
