  verdict: approve
  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : « les grands prêtres » pour ἀρχιερεῖς, « le Conseil tout entier » pour τὸ συνέδριον ὅλον, l’imparfait duratif « cherchaient » pour ἐζήτουν, « un faux témoignage contre Jésus » pour ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ, et le but « afin de le mettre à mort » pour ὅπως αὐτὸν θανατώσωσιν. L’absence de rendu explicite de δὲ est naturelle en français et ne supprime pas une opposition déterminante.'
  naturalness: Le français est moderne, clair et d’un registre approprié au récit judiciaire. « Les grands prêtres et le Conseil tout entier cherchaient… » est fluide. « Mettre à mort » conserve la gravité formelle du contexte sans surinterpréter le mode d’exécution.
  terminology: « Grands prêtres » est le terme français biblique et historique usuel pour le pluriel. « Conseil » est accessible, et la note proposant « Sanhédrin » fournit utilement l’identification institutionnelle. « Faux témoignage » convient précisément au contexte judiciaire.
  issues:
