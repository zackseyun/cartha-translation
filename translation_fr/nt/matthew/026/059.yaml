id: MAT.26.59
reference: Matthew 26:59
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς ⸀καὶ τὸ συνέδριον ὅλον ἐζήτουν ψευδομαρτυρίαν κατὰ τοῦ Ἰησοῦ ὅπως ⸂αὐτὸν θανατώσωσιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/059.yaml
  text: The chief priests and the whole council were seeking false testimony against Jesus so that they might put him to death[b][a],
translation:
  language: fr
  text: Les grands prêtres et le Conseil tout entier[a] cherchaient un faux témoignage[b] contre Jésus, afin de le mettre à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Sanhédrin tout entier ». Le terme grec désigne le conseil dirigeant juif.
    reason: cultural_note
  - marker: b
    text: Ou « un faux témoignage à charge ». Le terme grec peut désigner, dans un cadre judiciaire, soit un faux témoignage, soit le fait de porter un faux témoignage.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Cette particule assure ici une transition narrative légère. Le français n’exige pas de connecteur explicite, et « mais » marquerait une opposition trop forte.
- source_word: ἀρχιερεῖς
  choice: les grands prêtres
  rationale: Expression française usuelle pour désigner les principaux membres de la direction sacerdotale, sans laisser entendre que plusieurs personnes exerçaient simultanément la fonction unique de grand prêtre.
- source_word: τὸ συνέδριον ὅλον
  choice: le Conseil tout entier
  rationale: « Conseil » rend le nom de l’institution de façon transparente pour le lecteur, tandis que « tout entier » conserve l’insistance de ὅλον sur l’ensemble du corps dirigeant.
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait français restitue naturellement l’aspect duratif de l’imparfait grec et présente leur démarche comme une recherche en cours.
- source_word: ψευδομαρτυρίαν
  choice: un faux témoignage
  rationale: Cette formulation convient au contexte judiciaire et désigne naturellement le contenu mensonger du témoignage, tout en laissant en note l’autre valeur lexicale possible.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: contre Jésus
  rationale: La préposition κατά avec le génitif exprime ici une action judiciaire hostile dirigée contre Jésus.
- source_word: ὅπως
  choice: afin de
  rationale: La locution française exprime clairement le but poursuivi par les dirigeants.
- source_word: αὐτὸν θανατώσωσιν
  choice: le mettre à mort
  rationale: Cette expression conserve le ton judiciaire et formel du contexte sans préciser davantage le moyen ou la procédure d’exécution.
theological_decisions:
- issue: La dimension judiciaire et intentionnelle de la démarche
  choice: Présenter les dirigeants comme cherchant de manière suivie un faux témoignage dans le but de mettre Jésus à mort.
  alternative: Formuler plus brièvement qu’ils « cherchaient de faux témoins pour tuer Jésus ».
  rationale: L’imparfait ἐζήτουν et la proposition de but introduite par ὅπως décrivent une manœuvre délibérée et continue. La traduction préserve cette portée narrative et morale sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Le Conseil tout entier » reste accessible, avec « Sanhédrin » signalé en note. « Mettre à mort » maintient la gravité et la nuance judiciaire du passage.
