id: MAT.26.67
reference: Matthew 26:67
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ καὶ ἐκολάφισαν αὐτόν, οἱ δὲ ἐράπισαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/067.yaml
  text: Then they spat in his face and struck him with their fists[c][b][a], and others slapped him.
translation:
  language: fr
  text: Alors ils lui crachèrent au visage et le frappèrent à coups de poing[a] ; d’autres le giflèrent[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le frappèrent » ou « lui donnèrent des coups de poing ». Le verbe grec évoque des coups portés du poing.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’autres le frappèrent de la main ouverte ». Le dernier verbe désigne souvent une gifle.
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la progression immédiate du récit.
- source_word: ἐνέπτυσαν εἰς τὸ πρόσωπον αὐτοῦ
  choice: ils lui crachèrent au visage
  rationale: Expression française naturelle qui rend l’action directe et méprisante exprimée par l’idiome grec, littéralement « crachèrent vers/dans son visage ».
- source_word: ἐκολάφισαν αὐτόν
  choice: le frappèrent à coups de poing
  rationale: κολαφίζω désigne ici des coups portés du poing ; cette formulation concrète reste digne et claire.
- source_word: οἱ δὲ ἐράπισαν
  choice: d’autres le giflèrent
  rationale: L’article substantivé οἱ indique un autre groupe, et ῥαπίζω évoque généralement un coup donné de la main ouverte. Le complément « le » est fourni par le contexte.
- source_word: δέ
  choice: d’autres
  rationale: La transition grecque est légère ; en français, la distinction entre les groupes est suffisamment portée par « d’autres », sans imposer un contraste fort.
theological_decisions:
- issue: Description des sévices infligés à Jésus devant le conseil
  choice: Nommer concrètement les crachats, les coups de poing et les gifles.
  alternative: Employer une formulation générale telle que « ils le maltraitèrent » ou « ils le frappèrent ».
  rationale: Le grec décrit distinctement l’humiliation et les violences physiques. Une traduction concrète en préserve la force sans ajouter de commentaire théologique.
translation_notes:
  register: Français international moderne, direct et digne. « Au visage » est plus idiomatique que le calque « dans le visage ». « À coups de poing » et « giflèrent » distinguent clairement les deux verbes grecs sans atténuer la violence du passage.
