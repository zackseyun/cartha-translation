  rationale: La seule correction remplace « trébucher » par « tomber ». Elle améliore l’idiomaticité et reflète plus clairement, sans surinterprétation doctrinale, la défaillance des disciples que le contexte rend manifeste. Le reste du texte et les ancres de notes sont maintenus.
