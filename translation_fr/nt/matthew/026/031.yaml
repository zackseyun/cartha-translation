  source_fidelity: 'Le sens général est fidèle : Jésus annonce la défaillance collective des disciples cette nuit-là et cite Zacharie 13.7. « Trébucher à cause de moi » conserve une possibilité lexicale de σκανδαλίζω, mais, dans ce contexte immédiat de dispersion et d’abandon, il est moins explicite et moins idiomatique en français que « tomber à cause de moi »; cette dernière formule garde l’image sans imposer une apostasie définitive. La citation rend correctement le futur et le passif, ainsi que « les brebis du troupeau ».'
  naturalness: Le français est globalement naturel et de registre approprié. Toutefois, « vous allez tous trébucher à cause de moi » sonne quelque peu littéral et atténue le sens contextuel de défection. « Vous allez tous tomber à cause de moi » est plus courant en français biblique moderne tout en restant suffisamment littéral. L’emplacement de la note sur « Cette nuit » est conservé.
  terminology: '« Berger », « brebis », « troupeau », « il est écrit » et « dispersées » sont justes et cohérents. La note lexicale doit être harmonisée avec le choix révisé : « tomber » plutôt que « trébucher » comme rendu principal, avec les autres nuances signalées. Les renvois sont correctement ancrés : [b] à « cette nuit », [a] à l’expression relative à Jésus, [c] à la citation.'
