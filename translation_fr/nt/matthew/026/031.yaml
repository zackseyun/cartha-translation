id: MAT.26.31
reference: Matthew 26:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε λέγει αὐτοῖς ὁ Ἰησοῦς· Πάντες ὑμεῖς σκανδαλισθήσεσθε ἐν ἐμοὶ ἐν τῇ νυκτὶ ταύτῃ, γέγραπται γάρ· Πατάξω τὸν ποιμένα, καὶ ⸀διασκορπισθήσονται τὰ πρόβατα τῆς ποίμνης·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/031.yaml
  text: 'Then Jesus says to them[a], “You will all fall away because of me this night, for it is written: ‘I will strike the shepherd[c][b], and the sheep of the flock will be scattered.’”'
translation:
  language: fr
  text: 'Alors Jésus leur dit : « Cette nuit[b], vous allez tous tomber à cause de moi[a], car il est écrit : “Je frapperai le berger, et les brebis du troupeau seront dispersées.”[c] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi signifier « trébucher », « être amené à tomber », « se détourner » ou « prendre offense ». Ici, le contexte annonce que les disciples abandonneront Jésus.
    reason: lexical_alternative
  - marker: b
    text: Ou « ce soir », selon le moment où ces paroles sont prononcées.
    reason: lexical_alternative
  - marker: c
    text: Citation de Zacharie 13.7.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la progression du récit.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par la forme française « dit », naturelle dans un récit et identique à l’écrit au présent et au passé simple.
- source_word: Πάντες ὑμεῖς
  choice: vous allez tous
  rationale: Conserve l’insistance du grec sur l’ensemble des disciples, tout en suivant un ordre idiomatique en français.
- source_word: σκανδαλισθήσεσθε
  choice: trébucher
  rationale: Préserve l’image et l’étendue de sens du verbe grec, qui peut désigner le fait de trébucher, de se détourner ou d’abandonner; le contexte indique ici la désertion des disciples sans imposer la notion doctrinale d’une apostasie définitive.
- source_word: ἐν ἐμοὶ
  choice: à cause de moi
  rationale: Exprime la relation causale avec Jésus sans remplacer l’expression par une interprétation plus étroite comme « vous m’abandonnerez ».
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: Cette nuit
  rationale: Formulation française naturelle qui reste proche de la construction grecque.
- source_word: γέγραπται γάρ
  choice: car il est écrit
  rationale: Formule française consacrée et exacte pour introduire une citation de l’Écriture.
- source_word: Πατάξω
  choice: Je frapperai
  rationale: Rend directement le futur grec sans préciser au-delà du texte si le berger sera tué.
- source_word: τὸν ποιμένα
  choice: le berger
  rationale: Conserve directement l’image pastorale de la citation.
- source_word: διασκορπισθήσονται
  choice: seront dispersées
  rationale: Reproduit le futur passif et l’image de la dispersion.
- source_word: τὰ πρόβατα τῆς ποίμνης
  choice: les brebis du troupeau
  rationale: Maintient les deux substantifs présents en grec; « brebis » convient au collectif pastoral dans un registre biblique français actuel.
theological_decisions:
- issue: Portée de σκανδαλισθήσεσθε en relation avec Jésus
  choice: Conserver l’image de la chute avec « trébucher », en signalant que le contexte vise l’abandon de Jésus par les disciples.
  alternative: Traduire directement par « vous m’abandonnerez tous » ou « vous vous détournerez tous de moi ».
  rationale: Le contexte du berger frappé et des brebis dispersées indique une désertion réelle, mais le verbe grec garde une image et une gamme de sens qu’une formulation entièrement explicative effacerait. Cette traduction ne transforme pas non plus l’épisode en affirmation sur une apostasie définitive.
- issue: Valeur de ἐν ἐμοὶ
  choice: à cause de moi
  alternative: à mon sujet; en moi; loin de moi
  rationale: La construction désigne ici Jésus comme la cause ou l’occasion du faux pas. « À cause de moi » respecte cette relation sans faire de Jésus l’auteur moral de la défaillance.
- issue: Sujet implicite de Πατάξω dans la citation
  choice: Je frapperai
  alternative: Dieu frappera
  rationale: Le grec porte la première personne sans nommer explicitement son référent dans ce verset. La traduction conserve cette formulation et la tension propre à la citation.
translation_notes:
  register: Français international moderne, clair et digne. « Trébucher » garde l’image grecque et son ambiguïté réelle; la note en précise le sens contextuel. La citation conserve une cadence légèrement solennelle sans vocabulaire archaïque.
