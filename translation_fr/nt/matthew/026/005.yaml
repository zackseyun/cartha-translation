  text: ἔλεγον δέ· Μὴ ἐν τῇ ἑορτῇ, ἵνα μὴ θόρυβος γένηται ἐν τῷ λαῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/005.yaml
  text: But they were saying[a], “Not during the feast[b], lest there be an uproar among the people.”
translation:
  language: fr
  text: 'Mais ils disaient : « Pas pendant la fête, afin qu’il n’y ait pas de tumulte parmi le peuple. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: ils disaient
  rationale: L’imparfait exprime ici une parole en cours ou répétée dans le cadre de leur délibération.
- source_word: δέ
  choice: Mais
  rationale: La conjonction marque une légère opposition avec le projet formulé au verset précédent.
- source_word: Μὴ ἐν τῇ ἑορτῇ
  choice: Pas pendant la fête
  rationale: La tournure elliptique exprime naturellement une décision négative; ἐν a une valeur temporelle et ἑορτή désigne ici la fête de la Pâque.
- source_word: ἵνα μὴ
  choice: pour qu’il n’y ait pas
  rationale: Cette formulation française naturelle conserve l’idée de résultat intentionnellement évité.
- source_word: θόρυβος
  choice: émeute
  rationale: Dans ce contexte, le terme désigne un désordre collectif ou un soulèvement populaire; « émeute » rend clairement la gravité du risque sans ajouter de précision étrangère au texte.
- source_word: γένηται
  choice: il n’y ait
  rationale: Avec θόρυβος, γίνομαι signifie qu’un trouble survient; la construction existentielle est idiomatique en français.
- source_word: ἐν τῷ λαῷ
  choice: parmi le peuple
  rationale: La préposition situe le désordre au sein de la population rassemblée, tandis que « peuple » correspond directement à λαός.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La phrase conserve l’imparfait délibératif et la brièveté de l’interdiction grecque. « Fête » convient au contexte pascal; « festival », possible lexicalement dans d’autres contextes, serait moins naturel ici.
