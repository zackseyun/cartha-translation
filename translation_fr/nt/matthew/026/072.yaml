  text: 'And again he denied it with an oath: “I do not know the man.”[a]'
translation:
  language: fr
  text: 'Et de nouveau, il nia avec serment : « Je ne connais pas cet homme. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve la coordination narrative simple du grec sans ajouter une nuance temporelle.
- source_word: πάλιν
  choice: de nouveau
  rationale: Exprime clairement la répétition du reniement dans un français naturel et soutenu.
- source_word: ἠρνήσατο
  choice: il nia
  rationale: Le verbe signifie nier ou désavouer. En français, la proposition citée qui suit fournit naturellement le contenu du démenti, sans qu'il soit nécessaire d'ajouter un pronom objet.
- source_word: μετὰ ὅρκου
  choice: avec serment
  rationale: Rend l'accompagnement exprimé par la préposition et évite « sous serment », qui pourrait suggérer un cadre judiciaire officiel.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points suivis du discours direct introduisent naturellement en français le contenu du reniement.
- source_word: Οὐκ οἶδα
  choice: Je ne connais pas
  rationale: Rend directement la négation du verbe de connaissance dans un registre digne et courant.
- source_word: τὸν ἄνθρωπον
  choice: cet homme
  rationale: Dans ce contexte déictique, le français idiomatique emploie « cet homme » pour désigner l'homme dont on parle; cette formulation maintient aussi la distance marquée par Pierre, sans remplacer l'expression par « Jésus ».
theological_decisions:
- issue: Référence de « τὸν ἄνθρωπον » dans le reniement de Pierre
  choice: Conserver l'expression « cet homme » plutôt que la remplacer par « lui » ou « Jésus ».
  alternative: « lui » ou « Jésus »
  rationale: Le grec désigne explicitement Jésus comme « l'homme », formulation qui souligne la prise de distance de Pierre. Nommer Jésus ou employer seulement un pronom atténuerait cette force rhétorique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe brève conserve le rythme narratif et la solennité du serment.
