id: MAT.26.53
reference: Matthew 26:53
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἢ δοκεῖς ὅτι οὐ ⸀δύναμαι παρακαλέσαι τὸν πατέρα μου, καὶ παραστήσει μοι ⸂ἄρτι πλείω⸃ δώδεκα λεγιῶνας ἀγγέλων;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/053.yaml
  text: Or do you think that I cannot appeal to my Father[c][b][a], and he will at once place at my disposal more than twelve legions of angels?
translation:
  language: fr
  text: Ou bien penses-tu que je ne peux pas faire appel à mon Père[a], et qu’il mettra aussitôt à ma disposition[b] plus de douze légions[c] d’anges ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « invoquer mon Père » ou « demander à mon Père ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il placera auprès de moi » ; c’est-à-dire qu’il les rendra disponibles pour me venir en aide.'
    reason: lexical_alternative
  - marker: c
    text: Une légion romaine était une grande unité militaire ; cette expression souligne l’ampleur écrasante de la force céleste disponible.
    reason: cultural_note
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Introduit une autre manière de considérer la situation dans la réprimande de Jésus et assure un enchaînement interrogatif naturel en français.
- source_word: δοκεῖς
  choice: penses-tu
  rationale: Rend directement et naturellement la force de la question rhétorique.
- source_word: οὐ δύναμαι
  choice: je ne peux pas
  rationale: Exprime la capacité, et non la permission ni la volonté.
- source_word: παρακαλέσαι
  choice: faire appel à
  rationale: Convient à une demande pressante de secours tout en préservant la relation entre Jésus et son Père.
- source_word: τὸν πατέρα μου
  choice: mon Père
  rationale: La majuscule signale naturellement en français la référence à Dieu comme Père sans ajouter de contenu.
- source_word: παραστήσει μοι
  choice: Il mettrait à ma disposition
  rationale: Rend l’idée de placer auprès de Jésus, donc de rendre immédiatement disponible pour lui, plutôt que le simple fait d’envoyer.
- source_word: ἄρτι
  choice: aussitôt
  rationale: Marque l’immédiateté de l’aide disponible dans ce contexte.
- source_word: πλείω δώδεκα
  choice: plus de douze
  rationale: Reproduit simplement la comparaison quantitative du grec.
- source_word: λεγιῶνας
  choice: légions
  rationale: Conserve l’image militaire romaine et l’idée d’une force immense.
- source_word: ἀγγέλων
  choice: d’anges
  rationale: Le contexte désigne clairement des êtres célestes plutôt que des messagers humains.
theological_decisions:
- issue: La déclaration de Jésus porte-t-elle sur sa capacité, sa permission ou sa volonté de recevoir une aide divine ?
  choice: « je ne peux pas faire appel à mon Père »
  alternative: Une formulation laissant entendre qu’il ne voudrait pas ou ne serait pas autorisé à le faire.
  rationale: δύναμαι concerne la capacité ou le pouvoir. Le texte affirme que Jésus a pleinement la possibilité de demander une aide céleste écrasante, sans expliquer doctrinalement pourquoi il ne le fait pas.
- issue: Valeur modale de παραστήσει après la question sur un recours possible
  choice: « Il mettrait »
  alternative: « il mettra »
  rationale: Le futur grec énonce le résultat assuré de l’éventuel appel. En français, le conditionnel s’intègre naturellement à l’hypothèse implicite sans diminuer la certitude de la réponse du Père.
translation_notes:
  register: Français international moderne, digne et accessible. L’inversion « penses-tu » convient à la parole solennelle sans archaïsme. La phrase est divisée en une question puis une réponse hypothétique pour éviter une coordination lourde et rendre clairement la force rhétorique du grec.
