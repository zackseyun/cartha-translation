  text: μετὰ μικρὸν δὲ προσελθόντες οἱ ἑστῶτες εἶπον τῷ Πέτρῳ· Ἀληθῶς καὶ σὺ ἐξ αὐτῶν εἶ, καὶ γὰρ ἡ λαλιά σου δῆλόν σε ποιεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/073.yaml
  text: After a little while[a], those standing there came up and said to Peter, “Surely you also are one of them, for even your accent makes you evident.”
translation:
  language: fr
  text: 'Peu après, ceux qui se tenaient là s’approchèrent et dirent à Pierre : « Certainement, toi aussi, tu es l’un d’eux, car ta façon de parler te trahit[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « te rend reconnaissable ». Le grec λαλιά peut désigner la parole, la manière de parler ou l’accent.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ μικρὸν
  choice: Peu après
  rationale: Expression temporelle idiomatique qui indique qu’un bref intervalle s’est écoulé.
- source_word: δὲ
  choice: —
  rationale: Connecteur narratif léger, rendu naturellement en français par l’enchaînement de la phrase sans terme distinct.
- source_word: προσελθόντες
  choice: s’approchèrent
  rationale: Rend clairement le mouvement des personnes vers Pierre tout en intégrant naturellement le participe grec à la narration française.
- source_word: οἱ ἑστῶτες
  choice: ceux qui se tenaient là
  rationale: Conserve la valeur descriptive du participe et le cadre immédiat sans réduire le groupe à de simples « témoins » ou « passants ».
- source_word: εἶπον τῷ Πέτρῳ
  choice: dirent à Pierre
  rationale: Équivalent direct et naturel de la construction grecque.
- source_word: Ἀληθῶς
  choice: Certainement
  rationale: Exprime l’assurance avec laquelle les personnes affirment reconnaître l’appartenance de Pierre au groupe.
- source_word: καὶ σὺ
  choice: toi aussi
  rationale: Préserve l’insistance sur l’inclusion de Pierre parmi les disciples déjà évoqués.
- source_word: ἐξ αὐτῶν
  choice: l’un d’eux
  rationale: Formulation française idiomatique pour exprimer l’appartenance au groupe.
- source_word: καὶ γὰρ
  choice: car
  rationale: γάρ introduit la justification de l’affirmation; dans ce contexte, καί peut renforcer l’argument sans exiger un « même » distinct en français.
- source_word: ἡ λαλιά σου
  choice: ta façon de parler
  rationale: λαλιά peut désigner la parole, la manière de parler ou l’accent. « Façon de parler » préserve cette amplitude sans préciser au-delà du grec qu’il s’agit exclusivement de l’accent.
- source_word: δῆλόν σε ποιεῖ
  choice: te trahit
  rationale: Expression française naturelle indiquant que sa manière de parler rend son identité ou son appartenance manifeste.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. Le dialogue conserve une accusation assurée, tandis que « façon de parler » maintient l’ambiguïté lexicale entre parole, manière de parler et accent.
