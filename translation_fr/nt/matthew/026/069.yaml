  text: Ὁ δὲ Πέτρος ⸂ἐκάθητο ἔξω⸃ ἐν τῇ αὐλῇ· καὶ προσῆλθεν αὐτῷ μία παιδίσκη λέγουσα· Καὶ σὺ ἦσθα μετὰ Ἰησοῦ τοῦ Γαλιλαίου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/069.yaml
  text: Peter was sitting outside in the courtyard[a], and one servant girl came up to him, saying, “You also were with Jesus the Galilean.”
translation:
  language: fr
  text: 'Pierre était assis dehors, dans la cour. Une jeune servante[a] s’approcha de lui et dit : « Toi aussi, tu étais avec Jésus le Galiléen. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une servante » ou « une jeune esclave ». Le grec παιδίσκη désigne une jeune servante, parfois avec le statut d’esclave.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: absence de connecteur explicite
  rationale: La particule marque ici une légère transition narrative. En français, le changement de sujet et la nouvelle phrase suffisent à porter cette transition sans introduire artificiellement une valeur temporelle ou adversative.
- source_word: ἐκάθητο ἔξω
  choice: était assis dehors
  rationale: L’imparfait rend l’état ou l’action en cours exprimé par l’imparfait grec ; « dehors » situe Pierre par rapport à la scène intérieure.
- source_word: ἐν τῇ αὐλῇ
  choice: dans la cour
  rationale: Dans ce contexte, αὐλή désigne la cour intérieure de la résidence du grand-prêtre. « Cour » est naturel et précis en français.
- source_word: προσῆλθεν αὐτῷ
  choice: s’approcha de lui
  rationale: Cette formulation rend directement le mouvement d’approche exprimé par προσέρχομαι.
- source_word: μία παιδίσκη
  choice: une servante
  rationale: παιδίσκη désigne ici une jeune femme ou fille au service d’une maison, éventuellement esclave. « Une servante » exprime clairement son rôle sans imposer un statut juridique que le contexte ne précise pas ; l’article indéfini suffit naturellement à introduire cette personne en français.
- source_word: λέγουσα
  choice: et dit
  rationale: La coordination avec un verbe conjugué est plus naturelle en français narratif que le participe « disant », tout en conservant le rapport entre l’approche et la parole.
- source_word: Καὶ σὺ
  choice: Toi aussi
  rationale: 'Le pronom tonique « toi » et « aussi » préservent l’insistance : Pierre est identifié comme ayant lui aussi été avec Jésus.'
- source_word: ἦσθα μετὰ
  choice: tu étais avec
  rationale: Traduction directe de la relation exprimée, sans développer en « disciple » ou « partisan ».
- source_word: Ἰησοῦ τοῦ Γαλιλαίου
  choice: Jésus le Galiléen
  rationale: La formulation conserve l’épithète géographique employée pour identifier Jésus.
theological_decisions: []
