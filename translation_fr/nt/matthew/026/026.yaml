base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/026.yaml
  text: While they were eating[a], Jesus took bread, and after blessing it, he broke it and gave it to the disciples and said, “Take, eat[d][c][b]; this is my body.”
translation:
  language: fr
  text: 'Pendant qu’ils mangeaient[a], Jésus prit du pain et, après avoir béni[b], il le rompit, le donna aux disciples et dit : « Prenez, mangez[c] : ceci est mon corps[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Comme ils mangeaient. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ayant béni ». Le grec ne précise pas le complément ; l’expression peut se comprendre comme une bénédiction prononcée à propos du pain ou du repas, et certains la comprennent au sens de « rendre grâce ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Prenez et mangez. »'
    reason: lexical_alternative
  - marker: d
    text: 'Le grec dit littéralement : « ceci est mon corps ». Certains comprennent « est » au sens de « signifie » ou « représente » ; la traduction conserve la formulation du texte source.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: Ἐσθιόντων δὲ αὐτῶν
  choice: Pendant qu’ils mangeaient
  rationale: Le génitif absolu situe la scène dans le temps et présente l’action comme en cours. « Pendant qu’ils mangeaient » est naturel en français moderne. La faible valeur connective de δέ n’exige pas ici la traduction par « mais » ou « et ».
- source_word: λαβὼν ὁ Ἰησοῦς ἄρτον
  choice: Jésus prit du pain
  rationale: Le participe aoriste est rendu par un verbe conjugué dans la succession narrative. ἄρτος désigne ici le pain, sans qu’il soit nécessaire de préciser « un pain » ou « une miche ».
- source_word: εὐλογήσας
  choice: après avoir prononcé la bénédiction
  rationale: Cette formulation conserve l’idée de bénédiction et l’antériorité du participe sans l’assimiler directement à εὐχαριστέω (« rendre grâce »). Elle évite aussi d’ajouter un complément d’objet que le grec n’exprime pas.
- source_word: ἔκλασεν
  choice: il le rompit
  rationale: Le pronom « le » reprend naturellement « du pain ». « Rompit » convient au registre biblique digne tout en restant compréhensible et rend précisément l’action de briser le pain.
- source_word: δοὺς τοῖς μαθηταῖς
  choice: le donna aux disciples
  rationale: Le participe est coordonné comme verbe conjugué pour produire une narration française fluide. « Aux disciples » rend l’article grec sans ajouter « ses », absent du texte source.
- source_word: Λάβετε φάγετε
  choice: Prenez, mangez
  rationale: Les deux impératifs successifs, sans conjonction en grec, sont conservés comme deux injonctions juxtaposées. La virgule maintient leur rythme direct.
- source_word: τοῦτό ἐστιν τὸ σῶμά μου
  choice: ceci est mon corps
  rationale: La traduction rend directement la copule ἐστιν et le nom σῶμα, sans remplacer « est » par une interprétation telle que « signifie » ou « représente ».
theological_decisions:
- issue: Formulation eucharistique de la parole de Jésus
  choice: « ceci est mon corps »
  alternative: « ceci signifie/représente mon corps »
  rationale: Le grec emploie la copule simple ἐστιν (« est »). La formulation directe préserve la tension théologique du texte et ne tranche pas entre diverses compréhensions sacramentelles.
- issue: Sens de la bénédiction
  choice: « après avoir prononcé la bénédiction »
  alternative: « après avoir rendu grâce » ou « après avoir béni le pain »
  rationale: Le participe εὐλογήσας ne précise pas explicitement son complément. La traduction retenue ne décide ni que l’objet grammatical sous-entendu est le pain, ni que le verbe équivaut exactement à « rendre grâce ».
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit et permet une formulation concise. « Prononcer la bénédiction » reste accessible tout en évitant d’expliciter ce que le grec laisse sous-entendu. La parole finale conserve sa formulation traditionnelle et sa tension théologique.
