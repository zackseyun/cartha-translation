lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Le soir venu
  rationale: Le génitif absolu situe l’action dans le temps. Cette tournure française est naturelle, concise et conserve le sens de « quand le soir fut venu ».
- source_word: ἀνέκειτο
  choice: il s’allongea pour le repas
  rationale: Le verbe désigne la posture consistant à être allongé à table selon l’usage antique. « Pour le repas » explicite naturellement en français le cadre implicite sans suggérer qu’il se couchait pour dormir.
- source_word: μετὰ
  choice: avec
  rationale: Avec le génitif, μετά exprime ici simplement l’accompagnement.
- source_word: τῶν δώδεκα μαθητῶν
  choice: les douze disciples
  rationale: μαθητῶν figure dans le texte retenu et doit être traduit. « Disciples » est le terme français courant et précis dans le contexte des Évangiles.
