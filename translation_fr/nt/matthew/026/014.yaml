  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε πορευθεὶς εἷς τῶν δώδεκα, ὁ λεγόμενος Ἰούδας Ἰσκαριώτης, πρὸς τοὺς ἀρχιερεῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/014.yaml
  text: Then one of the twelve[a], the one called Judas Iscariot, went to the chief priests,
translation:
  language: fr
  text: Alors, l’un des douze[a], celui qu’on appelait Judas Iscariote, alla trouver les chefs des prêtres,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’un des Douze » avec « Douze » comme désignation du groupe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque la succession narrative de manière naturelle en français moderne.
- source_word: πορευθεὶς
  choice: alla trouver
  rationale: Le participe aoriste indique ici le déplacement vers les destinataires; « alla trouver » exprime naturellement en français une démarche intentionnelle auprès d’eux.
- source_word: εἷς τῶν δώδεκα
  choice: l’un des douze
  rationale: Rend directement l’expression partitive sans imposer par la majuscule un titre de groupe.
- source_word: ὁ λεγόμενος
  choice: celui qu’on appelait
  rationale: Conserve la tournure identificatrice et appositionnelle du grec dans un français fluide.
- source_word: Ἰούδας Ἰσκαριώτης
  choice: Judas Iscariote
  rationale: Suit les formes françaises usuelles du nom et du surnom.
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: trouver les chefs des prêtres
  rationale: Dans la construction « alla trouver », le complément désigne les autorités sacerdotales vers lesquelles Judas se rend; « chefs des prêtres » distingue ces responsables du grand-prêtre au singulier.
theological_decisions:
- issue: Statut de l’expression τῶν δώδεκα
  choice: des douze
  alternative: des Douze
  rationale: La minuscule préserve la sobriété graphique du texte source tout en désignant clairement le cercle des douze disciples; la lecture comme appellation établie demeure signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La virgule finale est conservée puisque le verset se poursuit syntaxiquement au verset suivant.
