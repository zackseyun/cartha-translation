  text: ὁ δὲ ἠρνήσατο ⸀ἔμπροσθεν πάντων λέγων· Οὐκ οἶδα τί λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/070.yaml
  text: But he denied it before them all[a], saying, “I do not know what you are saying.”
translation:
  language: fr
  text: 'Mais il nia devant tous, en disant : « Je ne sais pas ce que tu dis. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρνήσατο
  choice: il le nia
  rationale: Le verbe exprime ici le refus de l’affirmation qui vient d’être faite. Le pronom « le » reprend cette affirmation sans préciser davantage l’objet du déni.
- source_word: ἔμπροσθεν πάντων
  choice: devant tout le monde
  rationale: 'Cette formulation française naturelle rend le caractère public du déni : il a lieu en présence de toutes les personnes rassemblées.'
- source_word: λέγων
  choice: en disant
  rationale: Le gérondif restitue naturellement en français la relation du participe avec le verbe principal.
- source_word: Οὐκ οἶδα
  choice: Je ne sais pas
  rationale: Traduction directe du verbe de connaissance nié, dans un registre actuel et digne.
- source_word: τί λέγεις
  choice: ce que tu dis
  rationale: Cette traduction proche du grec reste naturelle en français et conserve la formulation de Pierre sans l’interpréter comme « ce que tu veux dire » ou « de quoi tu parles ».
theological_decisions:
- issue: Nature du reniement de Pierre
  choice: Pierre nie publiquement l’affirmation qui vient d’être portée contre lui, sans que l’objet soit davantage explicité.
  alternative: Pierre renie directement Jésus, ou nie connaître la servante.
  rationale: Le grec emploie simplement ἠρνήσατο en réponse à l’accusation précédente. Le pronom français « le » renvoie à cette accusation, sans ajouter une précision absente du verset.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond au singulier λέγεις et convient au dialogue direct de la scène.
