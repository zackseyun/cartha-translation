source:
  edition: SBLGNT
  text: καὶ παραλαβὼν τὸν Πέτρον καὶ τοὺς δύο υἱοὺς Ζεβεδαίου ἤρξατο λυπεῖσθαι καὶ ἀδημονεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/037.yaml
  text: And taking Peter and the two sons of Zebedee with him[a], he began to be sorrowful and deeply distressed.
translation:
  language: fr
  text: Il prit avec lui Pierre et les deux fils de Zébédée, et commença à ressentir de la tristesse et une profonde détresse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il commença à être triste et bouleversé ».'
    reason: Alternative lexicale pour λυπεῖσθαι et ἀδημονεῖν ; elle conserve la distinction entre tristesse et trouble profond sans imposer une interprétation doctrinale.
lexical_decisions:
- source_word: παραλαβὼν
  choice: il prit avec lui
  rationale: Le participe aoriste indique que Jésus emmène avec lui certains disciples choisis. Cette formulation est naturelle en français et conserve la dimension d’accompagnement.
- source_word: τοὺς δύο υἱοὺς Ζεβεδαίου
  choice: les deux fils de Zébédée
  rationale: La traduction reprend exactement l’identification donnée par le grec, sans ajouter les noms de Jacques et Jean, absents de ce verset.
- source_word: ἤρξατο
  choice: il commença
  rationale: Le verbe marque explicitement le commencement de l’état décrit par les deux infinitifs qui suivent.
- source_word: λυπεῖσθαι
  choice: à éprouver de la tristesse
  rationale: Le verbe désigne l’expérience du chagrin ou de la tristesse. Cette formulation courante garde ici un registre digne et exprime un état réellement ressenti.
- source_word: ἀδημονεῖν
  choice: une profonde détresse
  rationale: Le verbe exprime un trouble intérieur aigu, une angoisse ou une détresse intense. « Profonde détresse » rend cette force sans introduire l’idée non exprimée de désespoir.
- source_word: καὶ ... καὶ
  choice: et ... et
  rationale: La coordination répétée est conservée afin de respecter l’accumulation du grec, tant pour les compagnons que pour les deux états émotionnels.
theological_decisions:
- issue: Description de l’état émotionnel de Jésus au regard de la christologie
  choice: Exprimer sans atténuation sa tristesse et sa profonde détresse humaines
  alternative: Adoucir sa vulnérabilité émotionnelle, ou renforcer le texte jusqu’à parler de terreur ou de désespoir
  rationale: Les deux verbes décrivent une souffrance émotionnelle réelle et intense. La traduction préserve pleinement l’humanité de Jésus et la tension théologique du passage, sans dépasser les données lexicales.
translation_notes:
  register: Français international moderne, naturel et digne. « Puis » assure une transition narrative fluide; « prit avec lui » est idiomatique; la seconde proposition garde le rythme cumulatif et solennel du grec.
