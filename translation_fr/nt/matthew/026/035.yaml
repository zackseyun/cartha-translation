  text: λέγει αὐτῷ ὁ Πέτρος· Κἂν δέῃ με σὺν σοὶ ἀποθανεῖν, οὐ μή σε ⸀ἀπαρνήσομαι. ⸀ὁμοίως καὶ πάντες οἱ μαθηταὶ εἶπαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/035.yaml
  text: Peter said to him[a], “Even if I must die with you, I will certainly not deny you.” Likewise all the disciples also said the same.
translation:
  language: fr
  text: 'Pierre lui dit : « Même s’il me faut mourir avec toi, je ne te renierai certainement pas[a]. » De même, tous les disciples dirent cela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jamais je ne te renierai ». Le grec emploie une négation très forte (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit écrit en français.
- source_word: Κἂν
  choice: Même si
  rationale: La conjonction introduit ici une concession emphatique.
- source_word: δέῃ με
  choice: il me faut
  rationale: Cette tournure française actuelle et digne exprime clairement la nécessité portée par le verbe grec.
- source_word: σὺν σοὶ ἀποθανεῖν
  choice: mourir avec toi
  rationale: Rend directement l’infinitif et l’idée d’accompagnement, sans alourdir la phrase.
- source_word: οὐ μή
  choice: certainement pas
  rationale: La double négation grecque marque une négation future particulièrement forte.
- source_word: ἀπαρνήσομαι
  choice: je ne te renierai
  rationale: « Renier » est le terme français précis et traditionnel pour le refus déclaré de reconnaître une personne ou son lien avec elle.
- source_word: ὁμοίως
  choice: également la même chose
  rationale: Dans la dernière proposition, cette formulation indique que tous les disciples formulèrent la même affirmation que Pierre.
- source_word: πάντες οἱ μαθηταὶ εἶπαν
  choice: Tous les disciples dirent
  rationale: Le passé simple convient au récit, et « disciples » est l’équivalent courant de μαθηταί dans les Évangiles.
theological_decisions:
- issue: Force de l’affirmation négative de Pierre
  choice: « je ne te renierai certainement pas »
  alternative: « jamais je ne te renierai »
  rationale: La formulation retenue conserve la forte négation οὐ μή et la confiance catégorique de Pierre, sans ajouter d’interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif écrit; le tutoiement correspond aux pronoms grecs singuliers et au contexte relationnel.
