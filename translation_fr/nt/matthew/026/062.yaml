source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἶπεν αὐτῷ· Οὐδὲν ἀποκρίνῃ; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/062.yaml
  text: And the high priest stood up and said to him[b][a], “Do you give no answer? What is it that these men are testifying against you?”
translation:
  language: fr
  text: 'Alors le grand prêtre se leva et lui dit : « Tu ne réponds rien ? De quoi ces hommes témoignent-ils contre toi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς
  choice: se leva
  rationale: Le participe aoriste décrit ici l’action physique du grand prêtre avant sa prise de parole. « Se leva » est naturel et conserve la force dramatique de la scène.
- source_word: ὁ ἀρχιερεὺς
  choice: le grand prêtre
  rationale: C’est l’équivalent français usuel du titre désignant le principal titulaire de la fonction sacerdotale juive dans ce contexte.
- source_word: εἶπεν αὐτῷ
  choice: lui dit
  rationale: Cette formulation concise reproduit le pronom grec sans remplacer son référent par le nom de Jésus.
- source_word: Οὐδὲν ἀποκρίνῃ;
  choice: Tu ne réponds rien ?
  rationale: La formulation est à la fois proche du grec et idiomatique en français moderne; elle exprime la question pressante du grand prêtre.
- source_word: τί οὗτοί σου καταμαρτυροῦσιν;
  choice: Quel témoignage ces hommes portent-ils contre toi ?
  rationale: Le français ne permet guère de reproduire littéralement la construction avec τί sans maladresse. « Quel témoignage » explicite seulement le complément implicite du verbe, tandis que « portent contre toi » conserve sa valeur judiciaire et hostile.
- source_word: οὗτοί
  choice: ces hommes
  rationale: Le démonstratif masculin pluriel désigne les témoins présents; « ces hommes » rend le référent explicite sans ajouter une identité particulière.
- source_word: καταμαρτυροῦσιν
  choice: portent-ils contre toi
  rationale: Dans l’expression « porter témoignage contre », ce choix préserve le sens judiciaire de l’accusation ainsi que la valeur présente du verbe.
