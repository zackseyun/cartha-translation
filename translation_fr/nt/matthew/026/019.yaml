id: MAT.26.19
reference: Matthew 26:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐποίησαν οἱ μαθηταὶ ὡς συνέταξεν αὐτοῖς ὁ Ἰησοῦς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/019.yaml
  text: And the disciples did as Jesus had directed them[a], and they prepared the Passover.
translation:
  language: fr
  text: Les disciples firent ce que Jésus leur avait ordonné et préparèrent la Pâque.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le repas de la Pâque » : le mot grec peut désigner plus largement la célébration de la Pâque, y compris le repas préparé pour l’occasion.'
    reason: Alternative lexicale préservant l’étendue de πάσχα.
lexical_decisions:
- source_word: ἐποίησαν
  choice: firent
  rationale: Avec ὡς συνέταξεν, le verbe courant ποιέω exprime ici l’exécution de ce que Jésus a prescrit; « firent ce que » est naturel en français.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: Traduction française consacrée et claire pour les personnes qui suivent Jésus et reçoivent son enseignement.
- source_word: ὡς
  choice: ce que
  rationale: Dans la tournure française « firent ce que Jésus leur avait ordonné », cette formulation rend idiomatiquement la conformité exprimée par ὡς.
- source_word: συνέταξεν
  choice: avait ordonné
  rationale: συντάσσω désigne ici une directive faisant autorité. Le plus-que-parfait marque naturellement l’antériorité des instructions de Jésus.
- source_word: ἡτοίμασαν
  choice: préparèrent
  rationale: Équivalent direct et idiomatique de ἑτοιμάζω dans le contexte des préparatifs.
- source_word: τὸ πάσχα
  choice: la Pâque
  rationale: « La Pâque » conserve l’étendue référentielle du grec, qui peut viser la célébration et, dans ce contexte, le repas qui lui est associé, sans préciser indûment « repas » ou « agneau ».
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Forme française usuelle du nom propre.
theological_decisions:
- issue: Portée de τὸ πάσχα
  choice: la Pâque
  alternative: le repas de la Pâque; l’agneau pascal
  rationale: Le terme grec peut désigner la fête, le repas ou l’élément sacrificiel selon le contexte. Ici, les préparatifs concernent vraisemblablement le repas, mais le texte ne le précise pas explicitement; la traduction principale préserve donc cette amplitude.
translation_notes:
  register: Français international moderne, fluide et digne. La coordination est resserrée en français sans perdre les deux actions successives. « Ordonné » conserve l’autorité de la directive sans ajouter de tonalité polémique.
source_grounding:
  english_pob_role: consult_only
