id: MAT.26.7
reference: Matthew 26:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσῆλθεν αὐτῷ γυνὴ ⸂ἔχουσα ἀλάβαστρον μύρου⸃ βαρυτίμου καὶ κατέχεεν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ ἀνακειμένου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/007.yaml
  text: a woman came to him holding an alabaster jar of very costly perfume[b][a], and she poured it on his head as he was reclining at the table.
translation:
  language: fr
  text: Une femme s’approcha de lui avec un flacon d’albâtre contenant un parfum de très grand prix[a], et elle le versa sur sa tête pendant qu’il était allongé à table[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un flacon d’albâtre contenant un onguent de très grand prix ». Le mot grec peut désigner une huile parfumée ou un onguent, et non seulement un parfum liquide au sens moderne.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire dans la posture allongée qui était alors habituelle pour prendre un repas.
    reason: cultural_note
lexical_decisions:
- source_word: προσῆλθεν
  choice: s’approcha de
  rationale: Le verbe exprime un mouvement vers quelqu’un. « S’approcha de » est naturel en français et conserve cette orientation.
- source_word: γυνή
  choice: une femme
  rationale: Le nom est indéfini et aucun élément ne précise ici l’identité de la femme.
- source_word: ἔχουσα
  choice: avec
  rationale: Le participe indique qu’elle a le récipient avec elle. La tournure française « avec un flacon » rend naturellement la relation sans le calque pesant « ayant ».
- source_word: ἀλάβαστρον μύρου
  choice: un flacon d’albâtre contenant un parfum
  rationale: ἀλάβαστρον désigne un récipient, souvent associé à l’albâtre, et μύρον une substance parfumée pouvant être une huile ou un onguent. « Flacon » convient au contexte, tandis que « contenant » explicite en français la relation entre le récipient et son contenu.
- source_word: βαρυτίμου
  choice: de très grand prix
  rationale: L’expression rend l’intensité de la valeur indiquée par l’adjectif, dans un registre digne et courant.
- source_word: κατέχεεν
  choice: elle le versa
  rationale: Le verbe signifie verser sur ou répandre sur. Le pronom « le » reprend clairement le parfum, et le complément suivant indique la destination.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: sur sa tête
  rationale: La préposition indique ici le lieu de contact; cette formulation est directe et idiomatique.
- source_word: ἀνακειμένου
  choice: pendant qu’il était allongé à table
  rationale: Le participe décrit la posture inclinée ou allongée habituelle lors d’un repas dans l’Antiquité. La traduction conserve cette posture tout en précisant le cadre du repas.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation évite le calque participial « ayant » et conserve la posture culturelle du repas, éclairée par une note.
