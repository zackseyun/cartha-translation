id: MAT.26.8
reference: Matthew 26:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ ἠγανάκτησαν λέγοντες· Εἰς τί ἡ ἀπώλεια αὕτη;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/008.yaml
  text: But when the disciples saw it[a], they were indignant, saying, “Why this waste?”
translation:
  language: fr
  text: 'Mais en voyant cela, les disciples s’indignèrent et dirent : « Pourquoi ce gaspillage[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À quoi bon ce gaspillage ? »'
    reason: Alternative idiomatique qui fait ressortir plus explicitement la valeur finale de Εἰς τί.
lexical_decisions:
- source_word: ἰδόντες
  choice: en voyant cela
  rationale: Le participe aoriste est rendu par une construction circonstancielle naturelle en français. « Cela » explicite l’objet sous-entendu en grec, à savoir le geste de la femme.
- source_word: δὲ
  choice: Mais
  rationale: δέ signale ici une légère opposition entre le geste qui précède et la réaction négative des disciples.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: Rendu courant et fidèle de μαθηταί ; aucun possessif n’est ajouté puisqu’il n’est pas exprimé dans le grec.
- source_word: ἠγανάκτησαν
  choice: s’indignèrent
  rationale: Le verbe exprime un vif mécontentement teinté de réprobation ; « s’indignèrent » en conserve précisément la force.
- source_word: λέγοντες
  choice: et dirent
  rationale: La coordination est plus naturelle en français narratif que le calque participial « disant », tout en conservant le lien avec leur indignation.
- source_word: Εἰς τί
  choice: Pourquoi
  rationale: Dans cette question, l’expression signifie idiomatiquement « dans quel but ? » ou « à quoi bon ? » ; « pourquoi » rend clairement sa force en français moderne.
- source_word: ἡ ἀπώλεια αὕτη
  choice: ce gaspillage
  rationale: Dans le contexte d’un parfum coûteux répandu, ἀπώλεια désigne une perte jugée inutile. « Gaspillage » est idiomatique et conserve le jugement des disciples.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique sans être archaïque ; le discours direct reste vif et immédiatement compréhensible.
