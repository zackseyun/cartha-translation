id: MAT.26.47
reference: Matthew 26:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἔτι αὐτοῦ λαλοῦντος ἰδοὺ Ἰούδας εἷς τῶν δώδεκα ἦλθεν καὶ μετ’ αὐτοῦ ὄχλος πολὺς μετὰ μαχαιρῶν καὶ ξύλων ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/047.yaml
  text: And while he was still speaking[a], behold, Judas, one of the twelve, came, and with him a large crowd with swords and clubs[b], from the chief priests and elders of the people.
translation:
  language: fr
  text: Tandis qu’il parlait encore, voici que Judas, l’un des douze, arriva. Il était accompagné d’une foule nombreuse, munie d’épées et de gourdins[a], qui venait des grands prêtres et des anciens du peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « bâtons ». Le terme grec désigne littéralement des pièces de bois, employées ici vraisemblablement comme des gourdins.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « envoyée par les grands prêtres et les anciens du peuple ». Le grec dit plus littéralement : « venant des grands prêtres et des anciens du peuple ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: Tandis qu’il parlait encore
  rationale: Le génitif absolu exprime une action simultanée; « tandis que » en rend naturellement la valeur temporelle et « encore » correspond à ἔτι.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Ce marqueur attire l’attention et donne de la vivacité au récit sans lui ajouter l’idée explicite de soudaineté.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: εἷς τῶν δώδεκα
  choice: l’un des douze
  rationale: Rend directement l’expression partitive grecque sans transformer nécessairement « les douze » en titre officiel.
- source_word: ἦλθεν
  choice: arriva
  rationale: Dans cette scène narrative, « arriva » exprime naturellement la venue de Judas sur les lieux.
- source_word: ὄχλος πολὺς
  choice: une foule nombreuse
  rationale: Conserve la valeur quantitative de πολύς sans introduire dans le nom « foule » une hostilité plus explicite que celle du grec.
- source_word: μετὰ μαχαιρῶν
  choice: munie d’épées
  rationale: μάχαιρα peut désigner une épée ou une arme courte apparentée; « épées » reste ici le terme français usuel et suffisamment large.
- source_word: καὶ ξύλων
  choice: et de gourdins
  rationale: ξύλον désigne littéralement du bois ou une pièce de bois; dans cette liste d’armes, « gourdins » communique clairement l’usage visé.
- source_word: ἀπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων τοῦ λαοῦ
  choice: qui venait des grands prêtres et des anciens du peuple
  rationale: La formulation maintient l’idée de provenance portée par ἀπό sans ajouter au texte grec un verbe explicite signifiant « envoyer ».
theological_decisions:
- issue: Faut-il préciser que la foule avait été officiellement envoyée par les chefs religieux ?
  choice: qui venait des grands prêtres et des anciens du peuple
  alternative: envoyée par les grands prêtres et les anciens du peuple
  rationale: Le contexte permet de comprendre que la foule agissait sous leur autorité, mais ἀπό indique directement la provenance ou la source et le grec n’emploie aucun verbe d’envoi. Le texte principal conserve donc cette relative indétermination.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » conserve la vigueur du marqueur grec tout en restant intelligible; la division en deux phrases allège la longue coordination grecque sans modifier les rapports entre les personnages.
