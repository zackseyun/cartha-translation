  to: 'Puis il vient vers les disciples et les trouve endormis. Il dit à Pierre : « Alors, vous n’avez pas pu[b] rester éveillés[a] avec moi pendant une heure ? »'
  rationale: La révision corrige l’explication grammaticale de la note b et allège l’expression française de la capacité. Elle maintient explicitement, dans le texte et la note, la tension du grec entre l’adresse à Pierre et le verbe à la deuxième personne du pluriel, sans l’interpréter ni la résoudre.
