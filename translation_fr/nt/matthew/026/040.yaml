reference: Matthew 26:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔρχεται πρὸς τοὺς μαθητὰς καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Οὕτως οὐκ ἰσχύσατε μίαν ὥραν γρηγορῆσαι μετ’ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/040.yaml
  text: And he comes to the disciples and finds them sleeping[a], and he says to Peter, “So[b], were you not able to stay awake with me for one hour?”
translation:
  language: fr
  text: 'Puis il vient vers les disciples et les trouve endormis. Il dit à Pierre : « Alors, vous n’avez pas pu[b] rester éveillés[a] avec moi pendant une heure ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « veiller avec moi pendant une heure ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec traduit par « vous n’avez pas pu » est au pluriel, bien que Jésus s’adresse à Pierre.
    reason: source_number_clarification
lexical_decisions:
- source_word: ἔρχεται
  choice: il vient
  rationale: Le présent narratif grec est conservé afin de maintenir la vivacité du récit; il reste naturel en français dans cette séquence.
- source_word: πρὸς τοὺς μαθητὰς
  choice: vers les disciples
  rationale: Avec un verbe de mouvement, « vers » rend naturellement πρός sans préciser au-delà du grec le point d’arrivée.
- source_word: εὑρίσκει αὐτοὺς καθεύδοντας
  choice: les trouve endormis
  rationale: Cette formulation française exprime directement l’état constaté et garde le contraste avec l’appel à rester éveillés.
- source_word: λέγει τῷ Πέτρῳ
  choice: Il dit à Pierre
  rationale: Le présent narratif est maintenu et le nom Πέτρος reçoit sa forme française usuelle, « Pierre ».
- source_word: Οὕτως
  choice: Ainsi
  rationale: Dans cette question de reproche étonné, « Ainsi » restitue la valeur exclamative ou déductive de οὕτως sans la réduire à une simple succession temporelle.
- source_word: οὐκ ἰσχύσατε
  choice: vous n’avez pas été capables
  rationale: ἰσχύω exprime ici la capacité ou la force. Le pluriel « capables » rend visible le nombre du verbe grec, alors même que Jésus parle à Pierre.
- source_word: μίαν ὥραν
  choice: pendant une heure
  rationale: L’accusatif indique une durée; « pendant une heure » est idiomatique en français.
- source_word: γρηγορῆσαι
  choice: rester éveillés
  rationale: Le contexte immédiat du sommeil favorise le sens concret « rester éveillés », tandis que la nuance de vigilance demeure signalée en note.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: La formule simple et naturelle rend directement l’accompagnement exprimé par μετά.
theological_decisions:
- issue: Jésus parle à Pierre, mais le verbe ἰσχύσατε est à la deuxième personne du pluriel.
  choice: Conserver Pierre comme destinataire nommé tout en rendant explicitement le pluriel par « capables » et « éveillés ».
  alternative: Mettre toute la question au singulier, comme si elle ne concernait que Pierre.
  rationale: Le grec associe expressément l’adresse à Pierre à une réprimande au pluriel, probablement dirigée vers le groupe à travers lui. La traduction laisse subsister cette tension au lieu de l’expliquer dans le texte.
translation_notes:
  register: Français international actuel, digne et accessible. Les présents narratifs grecs sont conservés. « Ainsi » garde le ton de reproche étonné; le pluriel est rendu visible malgré l’ambiguïté habituelle de « vous » en français.
