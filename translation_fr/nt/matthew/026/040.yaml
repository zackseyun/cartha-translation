review_pass:
  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : les présents narratifs, le sommeil des disciples, l’adresse à Pierre, la durée d’une heure et le pluriel grec de ἰσχύσατε sont conservés. Toutefois, la note b affirme à tort que le mot rendu par « éveillés » est au pluriel en grec : γρηγορῆσαι est un infinitif, sans marque de nombre.'
  naturalness: « N’avez pas été capables de rester éveillés » est compréhensible mais plus lourd que le français actuel « n’avez pas pu rester éveillés ». « Alors » rend plus naturellement ici la réaction de reproche introduite par οὕτως.
  terminology: « Disciples », « Pierre », « endormis », « rester éveillés » et « veiller » sont justes, accessibles et appropriés au registre.
  issues:
  - severity: medium
    issue: La note b attribue un pluriel grec à « éveillés ».
    rationale: Le pluriel se trouve dans ἰσχύσατε (« vous avez pu / n’avez pas pu »), non dans l’infinitif γρηγορῆσαι (« rester éveillé / veiller »). La note doit décrire précisément le décalage entre Pierre, destinataire nommé au singulier, et le verbe grec au pluriel.
  - severity: low
    issue: La formulation « vous n’avez pas été capables » est lourde.
    rationale: « Vous n’avez pas pu » exprime naturellement la capacité en français moderne tout en rendant adéquatement ἰσχύσατε.
