revisions:
- from: 'Alors Jésus arrive avec eux à un endroit appelé Gethsémani et dit aux disciples : « Asseyez-vous ici pendant que je vais prier là-bas.[a] »'
  to: 'Alors Jésus arrive avec eux à un endroit appelé Gethsémani et dit aux disciples : « Asseyez-vous ici pendant que je vais là-bas pour prier.[a] »'
  rationale: La révision rend explicitement le déplacement vers « là-bas » impliqué par ἀπελθών et remplace une alternative de note grammaticalement et aspectuellement moins adéquate. Elle conserve le présent historique, le registre moderne, l’ambiguïté limitée de χωρίον et le sens temporel de ἕως οὗ.
