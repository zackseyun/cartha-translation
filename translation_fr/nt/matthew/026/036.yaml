source:
  edition: SBLGNT
  text: Τότε ἔρχεται μετ’ αὐτῶν ὁ Ἰησοῦς εἰς χωρίον λεγόμενον Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς· Καθίσατε αὐτοῦ ἕως οὗ ἀπελθὼν ⸂ἐκεῖ προσεύξωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/036.yaml
  text: Then Jesus comes with them to a place called Gethsemane[a], and he says to the disciples, “Sit here while I go over there and pray.”
translation:
  language: fr
  text: 'Alors Jésus arrive avec eux à un endroit appelé Gethsémani et dit aux disciples : « Asseyez-vous ici pendant que je vais là-bas pour prier.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Asseyez-vous ici jusqu’à ce que j’aille là-bas prier. » Le grec emploie plus littéralement « jusqu’à ce que »; « pendant que » exprime naturellement ici la durée de l’attente demandée aux disciples.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession des événements dans le récit.
- source_word: ἔρχεται
  choice: arrive
  rationale: Conserve le présent historique grec et exprime naturellement l’arrivée de Jésus au lieu indiqué.
- source_word: μετ’ αὐτῶν
  choice: avec eux
  rationale: Rend directement l’idée d’accompagnement exprimée par μετά avec le génitif.
- source_word: χωρίον
  choice: un endroit
  rationale: Le terme désigne ici un lieu ou terrain sans préciser qu’il s’agit d’un jardin; « endroit » est courant et n’ajoute aucun détail venu d’un autre récit.
- source_word: λεγόμενον Γεθσημανί
  choice: appelé Gethsémani
  rationale: Formule française naturelle pour nommer le lieu, avec la translittération française usuelle du nom propre.
- source_word: λέγει
  choice: dit
  rationale: Le présent français maintient la vivacité du présent historique grec et s’accorde avec « arrive ».
- source_word: Καθίσατε αὐτοῦ
  choice: Asseyez-vous ici
  rationale: Rend simplement l’impératif aoriste et l’adverbe local; « asseyez-vous » est plus idiomatique en français que le seul verbe « asseyez ».
- source_word: ἕως οὗ
  choice: pendant que
  rationale: Dans ce contexte, la locution délimite la période durant laquelle les disciples doivent rester assis; « pendant que » est naturel en français, tandis que « jusqu’à ce que » demeure une possibilité plus littérale signalée en note.
- source_word: ἀπελθὼν ἐκεῖ προσεύξωμαι
  choice: je vais prier là-bas
  rationale: Transforme naturellement le participe suivi du verbe principal en tournure française, tout en conservant le déplacement vers un autre emplacement et le but de prier.
theological_decisions:
- issue: Nature du lieu nommé Gethsémani
  choice: « un endroit »
  alternative: « un jardin »
  rationale: Matthieu emploie χωρίον, qui ne précise pas à lui seul qu’il s’agit d’un jardin. « Jardin » importerait dans ce verset un détail explicitement donné en Jean 18.1.
translation_notes:
  register: Français international moderne, simple et digne. Les présents historiques sont conservés pour la vivacité narrative. La ponctuation française et les guillemets français sont employés.
