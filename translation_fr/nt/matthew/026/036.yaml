review_pass:
  verdict: revise
  source_fidelity: Le texte rend bien la progression narrative, l’accompagnement, le lieu non spécifié autrement que comme Gethsémani, et l’ordre adressé aux disciples. Toutefois, « je vais prier là-bas » peut se comprendre comme un futur proche (« I am going to pray ») et n’exprime pas clairement le déplacement porté par ἀπελθών (« étant allé/parti »).
  naturalness: Le français est globalement naturel, de registre moderne et digne. « Je vais là-bas pour prier » est clair et idiomatique dans ce contexte, tout en distinguant le déplacement de l’acte de prier. La formulation proposée dans la note, « jusqu’à ce que je sois allé prier là-bas », est moins naturelle et modifie la relation des actions.
  terminology: « Alors », « arrive », « un endroit appelé Gethsémani », « Asseyez-vous ici » et « là-bas » conviennent. « Endroit » préserve à juste titre la généralité de χωρίον sans importer « jardin ».
  issues:
  - severity: medium
    issue: Le déplacement exprimé par ἀπελθών n’est pas explicitement rendu dans le texte principal.
    rationale: « Je vais prier là-bas » peut être lu comme une périphrase de futur proche; le grec présente Jésus comme allant vers un autre endroit, puis priant. « Je vais là-bas pour prier » rend ce déplacement sans alourdir la phrase.
  - severity: medium
    issue: L’alternative de note « jusqu’à ce que je sois allé prier là-bas » n’est pas une bonne équivalence française de la construction grecque.
    rationale: Le plus-que-parfait du subjonctif présente le fait d’être allé comme accompli et ne reproduit pas naturellement la portée prospective de ἕως οὗ suivi de προσεύξωμαι. « Jusqu’à ce que j’aille là-bas prier » est une alternative française claire et fidèle.
  revised_text: 'Alors Jésus arrive avec eux à un endroit appelé Gethsémani et dit aux disciples : « Asseyez-vous ici pendant que je vais là-bas pour prier.[a] »'
  revised_footnotes:
  - marker: a
    text: 'Ou : « Asseyez-vous ici jusqu’à ce que j’aille là-bas prier. » Le grec emploie plus littéralement « jusqu’à ce que »; « pendant que » exprime naturellement ici la durée de l’attente demandée aux disciples.'
    reason: lexical_alternative
