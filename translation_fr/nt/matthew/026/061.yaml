  source_fidelity: 'Le texte rend fidèlement la structure de l’accusation : εἶπαν (« Ils dirent »), le démonstratif accusateur Οὗτος (« Cet homme »), la capacité exprimée par Δύναμαι (« Je peux »), puis la destruction et la reconstruction du temple. « En trois jours » rend adéquatement διὰ τριῶν ἡμερῶν sans trancher plus que nécessaire entre « en » et « dans un délai de ». « Le rebâtir » explicite naturellement en français le lien avec le temple qui vient d’être détruit et demeure conforme au sens contextuel de οἰκοδομῆσαι.'
