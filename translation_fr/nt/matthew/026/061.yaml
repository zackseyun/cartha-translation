id: MAT.26.61
reference: Matthew 26:61
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπαν· Οὗτος ἔφη· Δύναμαι καταλῦσαι τὸν ναὸν τοῦ θεοῦ καὶ διὰ τριῶν ἡμερῶν ⸀οἰκοδομῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/061.yaml
  text: They said[a], “This man said[b], ‘I am able to destroy the temple of God and to build it in three days.’”
translation:
  language: fr
  text: 'Ils dirent : « Cet homme a dit : “Je peux détruire le temple de Dieu et le rebâtir en trois jours[a].” »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un délai de trois jours ». L’expression grecque peut désigner l’accomplissement de l’action au cours de cette période.
    reason: lexical_alternative
  - marker: b
    text: Voir Jean 2.19-21, où la parole de Jésus au sujet du temple est comprise comme concernant son corps.
    reason: cross_reference
lexical_decisions:
- source_word: εἶπαν
  choice: Ils dirent
  rationale: L’aoriste présente la déclaration des témoins comme un fait ponctuel du récit. « Ils dirent » convient au registre narratif et soutenu du passage.
- source_word: Οὗτος
  choice: Cet homme
  rationale: Dans cette accusation, le démonstratif a une force déictique qui peut être distante ou dépréciative. « Cet homme » la restitue naturellement en français.
- source_word: ἔφη
  choice: a dit
  rationale: Le verbe introduit simplement les paroles attribuées à Jésus. « A dit » évite de renforcer l’accusation par « a prétendu » ou « a déclaré ».
- source_word: Δύναμαι
  choice: Je peux
  rationale: Cette formulation française exprime directement la capacité indiquée par le verbe grec, sans lourdeur inutile.
- source_word: καταλῦσαι
  choice: détruire
  rationale: Dans le contexte d’un édifice, le verbe peut signifier démolir ou détruire. « Détruire » rend clairement la teneur hostile de l’accusation.
- source_word: τὸν ναὸν τοῦ θεοῦ
  choice: le temple de Dieu
  rationale: Bien que ναός puisse désigner plus précisément le sanctuaire, « temple » est ici le terme français courant et clair pour l’édifice évoqué dans l’accusation. Le complément « de Dieu » est conservé directement.
- source_word: διὰ τριῶν ἡμερῶν
  choice: en trois jours
  rationale: Avec le génitif, διά indique ici une durée au cours de laquelle l’action est menée à son terme. « En trois jours » est la formulation française la plus naturelle tout en laissant ouverte la nuance « dans un délai de trois jours ».
- source_word: οἰκοδομῆσαι
  choice: le rebâtir
  rationale: Le complément renvoie au temple qui vient d’être détruit. En français, « le rebâtir » exprime naturellement le fait de le bâtir de nouveau, sans changer le contenu de l’accusation.
theological_decisions:
- issue: Référent du « temple de Dieu » dans l’accusation
  choice: Traduire l’accusation selon son sens immédiat, comme visant le temple physique, sans introduire dans le texte principal l’identification au corps de Jésus.
  alternative: Faire apparaître directement dans la traduction l’allusion au corps de Jésus et à sa résurrection.
  rationale: Matthieu rapporte ici les paroles de témoins qui formulent une accusation. La traduction doit rendre leur affirmation sans l’harmoniser explicitement avec Jean 2.19-21. Le rapprochement christologique est signalé en note.
translation_notes:
  register: Français moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. « Cet homme » conserve la distance accusatrice du démonstratif, tandis que les verbes restent directs et ordinaires.
