source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ· Εἰ πάντες σκανδαλισθήσονται ἐν σοί, ⸀ἐγὼ οὐδέποτε σκανδαλισθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/033.yaml
  text: But Peter answered him[a], “Even if all fall away because of you, I will never fall away.”
translation:
  language: fr
  text: 'Mais Pierre lui répondit : « Même si tous tombent[a] à cause de toi, moi, je ne tomberai jamais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « trébuchent », « soient amenés à chuter » ou « se détournent ». Le verbe grec peut désigner le fait de trébucher, de trouver une occasion de chute ou d’abandonner sa fidélité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Mais Pierre lui répondit
  rationale: La tournure grecque littérale « ayant répondu, Pierre lui dit » est une formule narrative idiomatique. « Lui répondit » en restitue naturellement le sens, tandis que « mais » marque le contraste avec la parole précédente de Jésus.
- source_word: Εἰ πάντες
  choice: Même si tous
  rationale: Le sens formel est « si tous », mais l’opposition emphatique entre « tous » et « moi » donne ici à la proposition une valeur concessive que « même si » exprime clairement.
- source_word: σκανδαλισθήσονται / σκανδαλισθήσομαι
  choice: tombent / tomberai
  rationale: Le verbe peut évoquer le fait de trébucher, d’être amené à chuter ou de se détourner. « Tomber » conserve l’image et sa portée relationnelle sans préciser à tort s’il s’agit d’une défaillance passagère ou d’un abandon définitif.
- source_word: ἐν σοί
  choice: à cause de toi
  rationale: Avec ce verbe, l’expression désigne ici Jésus comme la personne à l’occasion de laquelle les disciples chuteront; « à cause de toi » est idiomatique en français et préserve ce lien causal ou circonstanciel.
- source_word: ἐγὼ οὐδέποτε
  choice: moi, je ne… jamais
  rationale: Le pronom grec explicite oppose fortement Pierre à « tous ». La dislocation « moi, je » rend cette emphase naturelle en français, et « jamais » traduit la négation temporelle catégorique.
theological_decisions:
- issue: Portée de σκανδαλίζω dans un contexte de défaillance des disciples
  choice: tomber
  alternative: trébucher; être amené à chuter; abandonner Jésus
  rationale: « Tomber » garde la métaphore et permet au contexte d’évoquer une grave défaillance de loyauté, sans transformer le verset en affirmation technique sur une apostasie définitive. La note signale l’étendue sémantique du grec.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « tomber » reproduit celle du même verbe grec, tandis que « moi, je » conserve l’opposition insistante de Pierre avec tous les autres.
