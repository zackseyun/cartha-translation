  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε συνήχθησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως τοῦ λεγομένου Καϊάφα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/003.yaml
  text: Then the chief priests and the elders of the people were gathered in the courtyard of the high priest[a], who was called Caiaphas[b],
translation:
  language: fr
  text: Alors les chefs des prêtres et les anciens du peuple se rassemblèrent dans la cour[a] du grand prêtre appelé Caïphe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec peut aussi désigner la cour d’une grande résidence.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la progression temporelle du récit.
- source_word: συνήχθησαν
  choice: se rassemblèrent
  rationale: Rend idiomatiquement la réunion du groupe. Bien que le verbe grec soit de forme passive, il peut exprimer ici le fait de se réunir sans qu’un agent extérieur soit précisé.
- source_word: ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Désigne les principales autorités sacerdotales, et non plusieurs titulaires simultanés de la fonction unique de grand prêtre.
- source_word: πρεσβύτεροι τοῦ λαοῦ
  choice: les anciens du peuple
  rationale: Reproduit clairement la construction grecque et le titre des responsables reconnus du peuple.
- source_word: εἰς τὴν αὐλὴν
  choice: dans la cour
  rationale: Avec un verbe de rassemblement, le français met naturellement en avant le lieu où le groupe se retrouve. αὐλή peut désigner la cour intérieure d’une grande demeure.
- source_word: τοῦ ἀρχιερέως
  choice: du grand prêtre
  rationale: Rendu français usuel et précis pour le titulaire singulier de cette fonction.
- source_word: τοῦ λεγομένου Καϊάφα
  choice: appelé Caïphe
  rationale: Rend simplement le participe grec d’identification tout en conservant la formulation « appelé ».
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. « Chefs des prêtres » distingue les autorités sacerdotales du « grand prêtre » mentionné au singulier. La ponctuation française évite une virgule inutile avant « appelé Caïphe ».
