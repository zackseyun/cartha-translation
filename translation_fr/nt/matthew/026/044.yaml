  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀφεὶς αὐτοὺς ⸂πάλιν ἀπελθὼν⸃ προσηύξατο ἐκ τρίτου τὸν αὐτὸν λόγον εἰπὼν ⸀πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/044.yaml
  text: And leaving them again[a], he went away and prayed a third time, saying the same thing again.
translation:
  language: fr
  text: Après les avoir laissés, il s’éloigna de nouveau et pria une troisième fois, en disant encore le même propos[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la même parole »; on peut aussi comprendre : « les mêmes paroles » ou « la même chose ».'
    reason: Signaler l’étendue de sens de λόγος au singulier sans réduire le texte à une répétition nécessairement mot pour mot.
lexical_decisions:
- source_word: ἀφεὶς αὐτοὺς
  choice: Après les avoir laissés
  rationale: Le participe aoriste marque l’action préalable de laisser les disciples sur place; cette tournure française restitue naturellement la succession des actions.
- source_word: πάλιν ἀπελθὼν
  choice: il s’éloigna de nouveau
  rationale: « S’éloigner » exprime le mouvement à l’écart des disciples, tandis que « de nouveau » conserve le premier πάλιν.
- source_word: προσηύξατο ἐκ τρίτου
  choice: pria une troisième fois
  rationale: Formulation française claire et idiomatique qui rend explicitement la troisième occurrence de la prière.
- source_word: τὸν αὐτὸν λόγον
  choice: la même chose
  rationale: Dans ce contexte, λόγος désigne le contenu de ce qui est dit. Le singulier français « la même chose » préserve cette valeur sans imposer l’idée d’une répétition verbale mot pour mot.
- source_word: εἰπὼν πάλιν
  choice: en disant encore
  rationale: Le gérondif maintient le lien circonstanciel avec la prière, et « encore » traduit le second πάλιν tout en évitant une répétition française maladroite de « de nouveau ».
theological_decisions:
- issue: Répétition de la prière de Jésus
  choice: La traduction indique à la fois une troisième occasion de prier et la reprise du même contenu.
  alternative: Omettre le dernier « encore » comme redondant, ou parler des « mêmes paroles » et suggérer une répétition verbale exacte.
  rationale: Les deux occurrences de πάλιν doivent rester perceptibles. Toutefois, τὸν αὐτὸν λόγον peut viser le même propos plutôt que nécessairement les mêmes mots exacts; « la même chose » conserve cette ouverture.
translation_notes:
  register: Français international moderne, sobre et narratif. « Après les avoir laissés » clarifie la succession participiale; l’alternance « de nouveau » / « encore » conserve les deux πάλιν sans lourdeur excessive.
