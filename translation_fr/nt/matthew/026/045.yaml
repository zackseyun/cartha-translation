  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἔρχεται πρὸς τοὺς ⸀μαθητὰς καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἰδοὺ ἤγγικεν ἡ ὥρα καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/045.yaml
  text: Then he comes to the disciples and says to them[a], “Sleep on now and take your rest. Look, the hour has drawn near[c][b], and the Son of Man is being handed over into the hands of sinners.”
translation:
  language: fr
  text: 'Puis il s’approche des disciples et leur dit[a] : « Dormez maintenant et reposez-vous. Voici, l’heure est proche[b], et le Fils de l’homme est livré entre les mains des pécheurs[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dormez-vous encore et vous reposez-vous ? » La formulation grecque peut se comprendre comme une question rhétorique, probablement teintée d’ironie.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « l’heure est arrivée » ou « l’heure est toute proche ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « est trahi ». Le verbe grec signifie plus largement « être livré » ou « être remis ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Puis
  rationale: Marque naturellement la succession des événements dans un récit.
- source_word: ἔρχεται ... καὶ λέγει
  choice: il vient ... et leur dit
  rationale: Conserve le présent historique grec, naturel et vivant en français narratif.
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: Dormez donc et reposez-vous
  rationale: Respecte la forme de surface et laisse subsister la nuance possiblement ironique ou rhétorique; « donc » rend ici τὸ λοιπὸν de manière idiomatique sans développer excessivement son sens temporel.
- source_word: ἰδού
  choice: Voici
  rationale: Formule française actuelle et digne qui attire solennellement l’attention.
- source_word: ἤγγικεν ἡ ὥρα
  choice: l’heure approche
  rationale: Rend clairement la proximité exprimée par le parfait de ἐγγίζω; le présent français exprime l’état désormais imminent.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Conserve la désignation établie et théologiquement importante.
- source_word: παραδίδοται
  choice: est livré
  rationale: Préserve le sens large de remise ou de livraison sans le réduire au seul acte de trahison.
- source_word: εἰς χεῖρας ἁμαρτωλῶν
  choice: entre les mains des pécheurs
  rationale: Reproduit l’image grecque dans une expression française claire et idiomatique.
theological_decisions:
- issue: Valeur de Καθεύδετε ... καὶ ἀναπαύεσθε
  choice: Énoncé à valeur impérative, avec ambiguïté signalée en note
  alternative: « Dormez-vous encore et vous reposez-vous ? »
  rationale: La formulation grecque peut être comprise comme une parole ironique ou concessive, ou comme une question rhétorique. Le texte principal garde la forme impérative sans supprimer la tension contextuelle.
- issue: Portée de παραδίδοται
  choice: « est livré »
  alternative: « est trahi »
  rationale: Le verbe grec est plus large que la trahison de Judas et peut englober l’ensemble de la remise de Jésus aux autorités, sans imposer une lecture doctrinale plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent historique est conservé. Les notes maintiennent les ambiguïtés du grec concernant la parole adressée aux disciples et la portée de παραδίδοται.
