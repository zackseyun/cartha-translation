  yaml_path: translation/nt/matthew/026/060.yaml
  text: and they did not find any[a], though many false witnesses had come forward. But later two came forward
translation:
  language: fr
  text: Et ils n’en trouvèrent pas[a], malgré le grand nombre de faux témoins qui s’étaient présentés. Mais, plus tard, deux se présentèrent
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne trouvèrent rien » ; en grec, le complément reste implicite et renvoie au témoignage ou au chef d’accusation recherché.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὗρον
  choice: ils n’en trouvèrent pas
  rationale: Le complément de εὗρον reste implicite en grec et renvoie, d’après le contexte du verset 59, au témoignage ou au chef d’accusation recherché. Le pronom « en » conserve cette dépendance contextuelle sans préciser abusivement l’objet.
- source_word: πολλῶν προσελθόντων ψευδομαρτύρων
  choice: malgré les nombreux faux témoins qui s’étaient présentés
  rationale: Le génitif absolu prend ici une valeur concessive. Le plus-que-parfait situe naturellement leur présentation avant le constat exprimé par le verbe principal, et « faux témoins » convient au cadre judiciaire.
- source_word: ὕστερον δὲ
  choice: Mais plus tard
  rationale: « Plus tard » marque la progression temporelle, tandis que « mais » rend la légère transition adversative introduite par δέ.
- source_word: προσελθόντες δύο
  choice: deux se présentèrent
  rationale: Dans le contexte d’une audience judiciaire, « se présenter » rend naturellement l’idée de témoins qui viennent déposer, tout en maintenant l’accent sur leur nombre.
