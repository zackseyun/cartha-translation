id: MAT.26.56
reference: Matthew 26:56
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δὲ ὅλον γέγονεν ἵνα πληρωθῶσιν αἱ γραφαὶ τῶν προφητῶν. τότε οἱ μαθηταὶ πάντες ἀφέντες αὐτὸν ἔφυγον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/056.yaml
  text: But all this has happened so that the Scriptures of the prophets might be fulfilled[a]. Then all the disciples left him and fled.
translation:
  language: fr
  text: Mais tout cela est arrivé afin que s’accomplissent les Écritures des prophètes. Alors tous les disciples l’abandonnèrent[a] et s’enfuirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le laissèrent ».'
    reason: Le participe ἀφέντες peut désigner simplement le fait de laisser quelqu’un, tout en prenant ici, dans le contexte, la nuance plus forte d’un abandon.
lexical_decisions:
- source_word: τοῦτο δὲ ὅλον
  choice: Mais tout cela
  rationale: Cette formulation naturelle renvoie à l’ensemble des événements précédents et rend δέ par un léger contraste, sans le surcharger.
- source_word: γέγονεν
  choice: est arrivé
  rationale: Le passé composé exprime idiomatiquement en français l’événement accompli dont la portée demeure présente.
- source_word: ἵνα πληρωθῶσιν
  choice: afin que s’accomplissent
  rationale: La tournure finale avec le subjonctif conserve la nuance de but ou de résultat du grec et le vocabulaire caractéristique de l’accomplissement.
- source_word: αἱ γραφαὶ τῶν προφητῶν
  choice: les Écritures des prophètes
  rationale: « Écritures » désigne ici les textes sacrés; le génitif « des prophètes » est maintenu sans préciser davantage s’il indique l’auteur, le contenu ou le rattachement.
- source_word: τότε
  choice: Alors
  rationale: « Alors » marque naturellement l’étape suivante du récit.
- source_word: οἱ μαθηταὶ πάντες
  choice: tous les disciples
  rationale: Cette formulation conserve explicitement la totalité soulignée par πάντες sans ajouter un possessif absent du grec.
- source_word: ἀφέντες αὐτὸν
  choice: l’abandonnèrent
  rationale: 'Dans le contexte de la fuite générale, ἀφίημι peut exprimer davantage qu’un simple éloignement : les disciples le laissent derrière eux. La coordination française rend naturellement le participe grec.'
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: Le verbe rend précisément l’idée d’une fuite et garde le ton narratif soutenu du passage.
theological_decisions:
- issue: L’accomplissement des Écritures prophétiques
  choice: afin que s’accomplissent les Écritures des prophètes
  alternative: afin que ce qu’avaient écrit les prophètes se réalise
  rationale: La traduction conserve le langage explicite de l’accomplissement et l’expression « les Écritures », essentiels au propos de Matthieu, sans transformer le génitif en une paraphrase interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient à la progression narrative (« abandonnèrent », « s’enfuirent »), tandis que le passé composé de « est arrivé » préserve la portée actuelle du parfait grec. Le subjonctif présent après « afin que » évite l’imparfait du subjonctif, devenu archaïque.
