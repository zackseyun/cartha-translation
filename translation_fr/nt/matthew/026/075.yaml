  source_fidelity: 'Le texte français rend fidèlement les principaux éléments du grec : Pierre se souvient de la parole antérieure de Jésus, l’annonce du chant d’un coq avant le triple reniement, puis sa sortie et ses pleurs amers. « Se souvint », « avait dit », « renieras trois fois » et « pleura amèrement » sont exacts. « Il sortit » rend idiomatiquement ἐξελθὼν ἔξω sans reproduire lourdement l’insistance grecque.'
