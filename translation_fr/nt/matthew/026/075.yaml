id: MAT.26.75
reference: Matthew 26:75
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐμνήσθη ὁ Πέτρος τοῦ ⸀ῥήματος Ἰησοῦ ⸀εἰρηκότος ὅτι Πρὶν ἀλέκτορα φωνῆσαι τρὶς ἀπαρνήσῃ με, καὶ ἐξελθὼν ἔξω ἔκλαυσεν πικρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/075.yaml
  text: 'And Peter remembered the word Jesus had spoken: “Before a rooster crows[a], you will deny me three times.” And he went outside and wept bitterly.'
translation:
  language: fr
  text: 'Alors Pierre se souvint de ce que Jésus avait dit : « Avant qu’un coq chante[a], tu me renieras trois fois. » Il sortit et pleura amèrement.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Avant que le coq chante. » Le grec n’emploie pas d’article; en français, la formulation indéfinie ou définie est possible selon la manière de comprendre l’expression.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμνήσθη
  choice: se souvint
  rationale: L’aoriste exprime ici le fait que Pierre se rappelle soudainement la parole de Jésus. « Se souvint » est naturel en français narratif et n’impose pas une nuance causative au passif de forme.
- source_word: τοῦ ῥήματος Ἰησοῦ εἰρηκότος
  choice: de ce que Jésus avait dit
  rationale: ῥῆμα désigne ici une parole prononcée. Cette formulation française rend naturellement l’ensemble nominal avec le participe parfait, tout en marquant l’antériorité et la pertinence persistante de la déclaration.
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: Avant qu’un coq chante
  rationale: La construction infinitive temporelle devient naturellement une proposition au subjonctif en français. L’indéfini « un coq » correspond à l’absence d’article grec et présente le chant du coq comme événement plutôt qu’un animal déjà identifié.
- source_word: τρὶς
  choice: trois fois
  rationale: Équivalent moderne, clair et direct de l’adverbe grec.
- source_word: ἀπαρνήσῃ
  choice: tu me renieras
  rationale: « Renier » exprime clairement, dans ce contexte personnel, le refus de reconnaître son lien avec Jésus et conserve la gravité du verbe grec.
- source_word: ἐξελθὼν ἔξω
  choice: Il sortit
  rationale: Le français « sortir » intègre déjà l’idée d’aller dehors; il rend sans lourdeur le participe accompagné de l’adverbe ἔξω.
- source_word: ἔκλαυσεν πικρῶς
  choice: pleura amèrement
  rationale: Cette expression française digne et idiomatique restitue directement l’intensité douloureuse de l’adverbe πικρῶς sans ajouter une interprétation psychologique explicite.
theological_decisions:
- issue: Désignation de Jésus
  choice: Jésus
  alternative: le Seigneur Jésus
  rationale: Le texte grec porte seulement Ἰησοῦ; aucun titre christologique ne doit être ajouté.
- issue: Nature du reniement de Pierre
  choice: tu me renieras
  alternative: tu diras trois fois que tu ne me connais pas
  rationale: « Renieras » préserve la portée du verbe ἀπαρνέομαι sans expliciter au-delà de ce que dit cette phrase, même si le contexte narratif montre la forme concrète du reniement.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluide sans affaiblir la solennité de la scène. « Alors » marque l’enchaînement narratif de καί; la répétition grecque de l’idée de sortie est rendue idiomatiquement par « Il sortit ».
