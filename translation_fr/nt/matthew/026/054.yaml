id: MAT.26.54
reference: Matthew 26:54
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πῶς οὖν πληρωθῶσιν αἱ γραφαὶ ὅτι οὕτως δεῖ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/054.yaml
  text: How then would the Scriptures be fulfilled[a], that it must happen this way?
translation:
  language: fr
  text: Comment donc les Écritures s’accompliraient-elles, elles qui disent que cela doit arriver ainsi ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς
  choice: Comment
  rationale: Adverbe interrogatif ouvrant une question rhétorique ; « Comment » en conserve naturellement la force.
- source_word: οὖν
  choice: alors
  rationale: La particule marque ici la conséquence logique avec ce qui précède ; « alors » est idiomatique en français.
- source_word: πληρωθῶσιν
  choice: s’accompliraient-elles
  rationale: L’aoriste passif subjonctif, dans cette question rhétorique, envisage ce qui deviendrait impossible si Jésus résistait ; le conditionnel français rend bien cette valeur potentielle liée au contexte.
- source_word: αἱ γραφαὶ
  choice: les Écritures
  rationale: Le pluriel désigne les écrits sacrés d’Israël ; la majuscule signale ce référent reconnu.
- source_word: ὅτι
  choice: puisque
  rationale: Dans cette formulation française, « puisque » relie avec naturel l’accomplissement des Écritures à la nécessité que les événements se déroulent ainsi. La construction grecque peut aussi être comprise comme introduisant leur contenu.
- source_word: οὕτως
  choice: ainsi
  rationale: L’adverbe renvoie à la manière dont l’arrestation et les événements qui suivent doivent se produire ; « ainsi » est concis, actuel et digne.
- source_word: δεῖ
  choice: il faut
  rationale: Cette expression conserve la nécessité affirmée par le grec sans expliciter davantage son fondement divin.
- source_word: γενέσθαι
  choice: que cela arrive
  rationale: L’infinitif de γίνομαι désigne ici la réalisation des événements ; « arriver » est naturel en français moderne.
theological_decisions:
- issue: Nature de la nécessité exprimée par δεῖ
  choice: « il faut », sans ajout explicatif
  alternative: « cela doit arriver selon le dessein de Dieu »
  rationale: Le lien avec l’accomplissement des Écritures suggère une nécessité divine, mais le grec n’en donne pas ici une formulation doctrinale développée. La traduction préserve cette tension.
- issue: Fonction de ὅτι
  choice: Le rendre par « puisque » dans une phrase française qui présente la nécessité comme fondant l’accomplissement
  alternative: '« Comment alors les Écritures s’accompliraient-elles : il faut que cela arrive ainsi ? »'
  rationale: ὅτι peut être causal ou introduire le contenu. Le contexte permet la lecture causale, qui produit une question naturelle sans supprimer le lien étroit entre nécessité et accomplissement scripturaire.
translation_notes:
  register: Français international moderne, clair et digne. Inversion interrogative maintenue pour donner à la question rhétorique une forme soignée sans archaïsme.
