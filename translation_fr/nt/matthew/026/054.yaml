  source_fidelity: La question rhétorique, la particule inférentielle, le passif de « s’accomplir » et la nécessité de δεῖ sont bien rendus. Toutefois, « puisque » impose une lecture causale de ὅτι, alors que, dans cette construction, ὅτι introduit naturellement le contenu de ce que disent les Écritures; cette lecture doit être conservée sans la transformer en justification causale explicite.
  naturalness: La formulation est globalement naturelle et d’un registre moderne soigné. « Donc » rend οὖν avec une inférence légèrement plus directe; « elles qui disent que » permet une phrase française claire sans registre archaïque.
  terminology: « Les Écritures » est le terme consacré et approprié. « Cela doit arriver ainsi » conserve la nécessité sans préciser indûment son fondement théologique.
