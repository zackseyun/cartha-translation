    rationale: Le participe signifie d’abord « être assis / assis ». Dans ce contexte il évoque bien l’intronisation, mais « siéger » peut suggérer l’exercice institutionnel d’une fonction. « Assis » conserve l’image et l’ambiguïté du grec.
