  source_fidelity: La formulation « Jésus lui répondit » est contextuellement recevable, mais λέγει αὐτῷ se rend plus exactement par « Jésus lui dit ». Surtout, καθήμενον est un participe décrivant le Fils de l’homme, coordonné à ἐρχόμενον ; « assis … et venant » reproduit cette structure avec plus de précision que « siéger … et venir ». Le reste rend fidèlement l’affirmation indirecte de Σὺ εἶπας, le changement du singulier au pluriel, ἀπ’ ἄρτι, et les allusions à Daniel et au psaume.
  naturalness: Le français est clair, moderne et de registre biblique accessible. « Assis à la droite de la Puissance et venant sur les nuées du ciel » est naturel dans ce registre et évite la nuance institutionnelle que « siéger » peut prendre en français contemporain.
  terminology: '« Le Fils de l’homme », « la Puissance » et « les nuées du ciel » préservent avec justesse les titres, la périphrase révérencielle et les échos scripturaires. Les notes restent correctement ancrées : a après la réponse idiomatique, b pour les allusions, c pour « la Puissance ».'
