id: MAT.26.64
reference: Matthew 26:64
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Σὺ εἶπας· πλὴν λέγω ὑμῖν, ἀπ’ ἄρτι ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου καθήμενον ἐκ δεξιῶν τῆς δυνάμεως καὶ ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/064.yaml
  text: Jesus said to him[a], “You have said so. But I tell you[c][b], from now on you will see the Son of Man seated at the right hand of Power and coming on the clouds of heaven.”
translation:
  language: fr
  text: 'Jésus lui dit : « Tu l’as dit[a]. Mais je vous le dis[b][c] : désormais, vous verrez le Fils de l’homme assis à la droite de la Puissance et venant sur les nuées du ciel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « C’est toi qui le dis. » La formule grecque constitue ici une réponse affirmative exprimée indirectement.'
    reason: lexical_alternative
  - marker: b
    text: Allusion à Daniel 7.13 et au Psaume 110.1.
    reason: cross_reference
  - marker: c
    text: « La Puissance » est une manière révérencielle de désigner Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: Σὺ εἶπας
  choice: Tu l’as dit
  rationale: Cette formule conserve l’expression grecque tout en rendant son caractère affirmatif sans la réduire à un simple « oui ». Le tutoiement correspond au singulier grec et au cadre d’un échange direct.
- source_word: πλὴν
  choice: Mais
  rationale: Marque naturellement en français la transition forte entre la réponse immédiate et la déclaration solennelle qui suit.
- source_word: ἀπ’ ἄρτι
  choice: désormais
  rationale: Exprime avec concision qu’une nouvelle réalité commence à partir de ce moment, sans imposer l’idée que tout s’accomplit instantanément.
- source_word: ὄψεσθε
  choice: vous verrez
  rationale: Rend directement le futur de ὁράω et maintient le pluriel, Jésus s’adressant désormais à l’ensemble de ses interlocuteurs.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Conserve la désignation biblique traditionnelle et sa résonance avec Daniel 7.
- source_word: καθήμενον
  choice: siéger
  rationale: Dans ce contexte d’exaltation et d’autorité royale, « siéger » rend le participe de façon naturelle et plus évocatrice qu’« être assis », sans ajouter une notion étrangère au texte.
- source_word: ἐκ δεξιῶν
  choice: à la droite de
  rationale: Expression française établie qui préserve l’image de la place d’honneur et d’autorité.
- source_word: τῆς δυνάμεως
  choice: la Puissance
  rationale: Conserve la formulation révérencielle indirecte qui désigne Dieu, plutôt que d’expliciter le référent dans le corps du texte.
- source_word: ἐρχόμενον
  choice: venir
  rationale: Rend directement le participe et maintient l’écho de Daniel 7 ainsi que le mouvement associé à la manifestation et à la vindication.
- source_word: ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: sur les nuées du ciel
  rationale: Rendu transparent de la préposition et de l’image biblique, avec « nuées » pour préserver le registre solennel de l’allusion scripturaire.
theological_decisions:
- issue: Portée de la réponse Σὺ εἶπας au grand-prêtre
  choice: 'Une réponse affirmative formulée indirectement : « Tu l’as dit. »'
  alternative: « Oui » ou une réponse évasive et non affirmative
  rationale: La formule grecque fonctionne comme une affirmation, mais sa forme propre mérite d’être conservée. Un simple « oui » effacerait cette formulation, tandis qu’une lecture évasive minimiserait sa force dans le contexte.
- issue: Référent de « la Puissance »
  choice: Maintenir la périphrase révérencielle désignant Dieu
  alternative: Expliciter par « Dieu » ou traduire par « le Tout-Puissant »
  rationale: Le référent divin est clair dans le contexte, mais l’expliciter irait au-delà de la formulation grecque. « La Puissance » préserve sa retenue et sa portée théologique.
- issue: Rapport temporel entre la session à la droite de la Puissance et la venue sur les nuées
  choice: Conserver ensemble l’exaltation et la venue sans imposer un calendrier interprétatif unique
  alternative: Rapporter toute la déclaration exclusivement à un accomplissement immédiat ou exclusivement au retour final du Christ
  rationale: Le grec coordonne les deux participes comme objets de « vous verrez ». La traduction maintient cette tension et la richesse des allusions sans trancher une question eschatologique débattue.
translation_notes:
  register: Français international moderne, digne et accessible. « Siéger » et « nuées » maintiennent le registre solennel et les échos bibliques sans archaïsme excessif. Le passage du singulier « tu » au pluriel « vous » reproduit le changement de destinataire marqué par le grec.
