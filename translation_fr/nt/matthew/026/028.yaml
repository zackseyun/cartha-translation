id: MAT.26.28
reference: Matthew 26:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο γάρ ἐστιν τὸ αἷμά ⸀μου ⸀τῆς διαθήκης τὸ περὶ πολλῶν ἐκχυννόμενον εἰς ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/026/028.yaml
  text: For this is my blood of the covenant[b][a], which is poured out for many for the forgiveness of sins.
translation:
  language: fr
  text: Car ceci est mon sang, le sang de l’alliance[a], qui est versé pour beaucoup[b], pour le pardon des péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Quelques manuscrits portent : « mon sang, le sang de la nouvelle alliance ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « en faveur de beaucoup ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: ceci
  rationale: Rend directement le pronom démonstratif grec sans ajouter « cette coupe », absent de la proposition.
- source_word: γάρ
  choice: car
  rationale: Conserve le lien explicatif avec l’ordre de boire donné au verset précédent.
- source_word: τὸ αἷμά μου τῆς διαθήκης
  choice: mon sang, le sang de l’alliance
  rationale: La reprise appositive est naturelle en français et préserve les résonances sacrificielles et covenantales de la formulation grecque.
- source_word: περὶ πολλῶν
  choice: pour beaucoup
  rationale: Expression française concise qui rend le sens de bénéfice ou de représentation dans ce contexte sacrificiel sans transformer « beaucoup » en « tous ».
- source_word: ἐκχυννόμενον
  choice: qui est versé
  rationale: La proposition relative rend naturellement le participe présent passif et maintient l’image d’un sang répandu en sacrifice.
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: pour le pardon des péchés
  rationale: Formulation française actuelle et claire qui conserve la relation de finalité ou de résultat exprimée par εἰς.
theological_decisions:
- issue: Faut-il inclure « nouvelle » devant « alliance » ?
  choice: le sang de l’alliance
  alternative: le sang de la nouvelle alliance
  rationale: Le texte du SBLGNT fourni ne contient pas καινῆς (« nouvelle »). La leçon variante est signalée en note plutôt qu’introduite dans le texte principal.
- issue: Portée de l’expression « pour beaucoup » dans le langage de l’expiation
  choice: pour beaucoup
  alternative: pour tous
  rationale: Le grec porte πολλῶν (« beaucoup »). La traduction en conserve la formulation sans trancher par expansion les débats théologiques sur la portée de l’expiation.
- issue: Nuance de περί avec le génitif
  choice: pour beaucoup
  alternative: en faveur de beaucoup
  rationale: « Pour beaucoup » est plus fluide et conserve l’ambiguïté légitime entre référence et bénéfice, tandis que la note explicite l’autre rendu possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Car » maintient le rapport logique; l’apposition « mon sang, le sang de l’alliance » évite une tournure française pesante tout en restant proche du grec. Tous les marqueurs de notes figurent dans le texte principal.
