id: MAT.22.7
reference: Matthew 22:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ βασιλεὺς⸃ ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσεν τοὺς φονεῖς ἐκείνους καὶ τὴν πόλιν αὐτῶν ἐνέπρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/007.yaml
  text: But the king became angry, and he sent his troops, destroyed those murderers, and burned their city.
translation:
  language: fr
  text: Mais le roi se mit en colère. Il envoya ses troupes, fit périr ces meurtriers et incendia leur ville.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθη
  choice: se mit en colère
  rationale: Rend naturellement en français l’aoriste passif à sens intransitif « fut pris de colère / se mit en colère », sans affaiblir la réaction du roi.
- source_word: τὰ στρατεύματα αὐτοῦ
  choice: ses troupes
  rationale: « Troupes » convient au pluriel grec et désigne ici les forces armées envoyées par le roi.
- source_word: ἀπώλεσεν
  choice: fit périr
  rationale: Exprime clairement l’action causative du roi par l’intermédiaire de ses troupes, tout en conservant la force du verbe grec.
- source_word: τοὺς φονεῖς ἐκείνους
  choice: ces meurtriers
  rationale: « Meurtriers » est le terme courant et précis pour ceux qui ont tué les serviteurs mentionnés au verset précédent.
- source_word: ἐνέπρησεν
  choice: incendia
  rationale: Rend précisément l’idée de mettre le feu à une ville; formulation concise et digne.
theological_decisions:
- issue: Portée référentielle de la destruction de la ville
  choice: Conserver simplement « leur ville »
  alternative: Identifier explicitement la ville à Jérusalem ou expliquer l’événement comme une prophétie historique
  rationale: Le texte de la parabole ne nomme pas la ville dans ce verset. La traduction préserve donc la formulation et la tension interprétative sans imposer une identification théologique ou historique.
translation_notes:
  register: Français moderne international, narratif et digne. Deux phrases évitent une coordination lourde tout en conservant la succession nette des actions. Aucun ajout explicatif ni marqueur de note n’est nécessaire.
