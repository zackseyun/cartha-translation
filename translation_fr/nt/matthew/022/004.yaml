reference: Matthew 22:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους λέγων· Εἴπατε τοῖς κεκλημένοις· Ἰδοὺ τὸ ἄριστόν μου ⸀ἡτοίμακα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/004.yaml
  text: Again he sent other slaves[a], saying, ‘Tell those who have been invited, “Look, I have prepared my dinner; my oxen and my fattened cattle have been slaughtered, and everything is ready[c][b]. Come to the wedding feast.”’
translation:
  language: fr
  text: 'Il envoya encore d’autres esclaves[a] avec ces instructions : « Dites aux invités : “Voici, j’ai préparé mon repas[b] ; mes taureaux et mes bêtes engraissées ont été abattus, et tout est prêt. Venez aux noces[c].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec peut désigner des serviteurs ou des esclaves selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « festin ». Le mot grec désigne un repas préparé, souvent pris plus tôt dans la journée.
    reason: lexical_alternative
  - marker: c
    text: Ou « au festin de noces ». Le pluriel grec peut désigner l’ensemble des célébrations du mariage.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἀπέστειλεν ἄλλους δούλους
  choice: Il envoya encore d’autres esclaves
  rationale: « Encore » marque naturellement la répétition de l’envoi. « Esclaves » rend la condition sociale exprimée par δοῦλοι dans la maison d’un roi, tout en signalant en note l’autre traduction contextuellement possible.
- source_word: λέγων
  choice: avec ces instructions
  rationale: Cette formulation française introduit naturellement le contenu du message confié aux envoyés, sans alourdir la narration par un littéral « disant ».
- source_word: Εἴπατε τοῖς κεκλημένοις
  choice: Dites aux invités
  rationale: Le participe parfait passif désigne ceux qui ont déjà reçu l’invitation. En français, « les invités » exprime avec naturel leur statut présent résultant de cette invitation antérieure.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Particule d’attention rendue dans un registre moderne et digne, sans l’archaïsme de « voici que » ou « voyez » employé isolément.
- source_word: τὸ ἄριστόν μου ἡτοίμακα
  choice: j’ai préparé mon repas
  rationale: Le parfait indique une préparation achevée dont le résultat demeure. ἄριστον désigne un repas préparé, souvent pris plus tôt dans la journée, mais le contexte ne justifie pas d’imposer une heure précise.
- source_word: οἱ ταῦροί μου καὶ τὰ σιτιστὰ
  choice: mes taureaux et mes bêtes engraissées
  rationale: « Taureaux » représente directement ταῦροι. Le neutre substantivé σιτιστά désigne des animaux spécialement nourris pour l’abattage ; « bêtes engraissées » évite de préciser sans preuve qu’il s’agit de veaux.
- source_word: τεθυμένα
  choice: ont été abattus
  rationale: Dans ce contexte de repas, θύω désigne l’abattage des animaux. « Sacrifiés » risquerait d’introduire à tort une nuance cultuelle.
- source_word: δεῦτε εἰς τοὺς γάμους
  choice: Venez aux noces
  rationale: « Venez » restitue l’invitation pressante de δεῦτε. Le pluriel γάμοι peut désigner les noces et l’ensemble de leurs réjouissances.
theological_decisions:
- issue: Sens de δοῦλος dans la maison royale de la parabole
  choice: esclaves
  alternative: serviteurs
  rationale: Le cadre met en scène des personnes appartenant à la maison du roi et soumises à son autorité, et non de simples employés. « Esclaves » préserve cette réalité sociale, tandis qu’une note maintient l’alternative lexicale sans lui ajouter de portée doctrinale.
- issue: Portée de γάμοι au pluriel
  choice: noces
  alternative: festin de noces
  rationale: « Noces » conserve l’étendue possible du grec, qui peut viser la célébration du mariage dans son ensemble. « Festin de noces » est contextuellement plausible, mais restreint davantage le sens au banquet.
translation_notes:
  register: Français international moderne, narratif et digne. La ponctuation distingue clairement les paroles du roi, le message transmis et l’invitation citée. Les termes concrets « taureaux » et « bêtes engraissées » gardent l’image du banquet sans précision zoologique indue.
