  text: ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/019.yaml
  text: Show me the coin for the tax[a]. And they brought him a denarius.
translation:
  language: fr
  text: « Montrez-moi la pièce servant à payer l’impôt[a]. » Ils lui apportèrent un denier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’impôt personnel » ou « l’impôt du recensement » ; le terme grec désigne ici un impôt impérial romain.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδείξατέ
  choice: Montrez-moi
  rationale: L’impératif aoriste pluriel demande que l’objet soit produit pour être examiné. « Montrez-moi » restitue naturellement la dimension visuelle du verbe.
- source_word: νόμισμα
  choice: la pièce
  rationale: Le terme désigne une pièce de monnaie en circulation. « La pièce » est clair et prépare la désignation précise du denier dans la proposition suivante.
- source_word: τοῦ κήνσου
  choice: servant à payer l’impôt
  rationale: Le génitif désigne la pièce utilisée pour acquitter le κῆνσος, impôt romain évoqué dans le contexte. Cette formulation française est naturelle sans préciser excessivement la nature exacte de cet impôt.
- source_word: προσήνεγκαν
  choice: apportèrent
  rationale: Dans ce cadre narratif, « apportèrent » rend simplement et directement l’aoriste de προσφέρω.
- source_word: δηνάριον
  choice: un denier
  rationale: « Denier » est le nom français traditionnel et historiquement précis de cette monnaie romaine, préférable à un équivalent monétaire moderne.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La ponctuation distingue clairement la parole de Jésus de la suite du récit.
