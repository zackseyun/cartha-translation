  text: Δευτέρα ⸀δὲ ὁμοία ⸀αὐτῇ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/039.yaml
  text: 'And a second is like it: You shall love your neighbor as yourself[a].'
translation:
  language: fr
  text: 'Et un deuxième commandement lui est semblable : « Tu aimeras ton prochain comme toi-même. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δευτέρα δὲ
  choice: Et voici le deuxième
  rationale: L’adjectif ordinal féminin, employé substantivement sans article, désigne ici le deuxième commandement. Cette formulation française est naturelle et conserve la progression du discours marquée par δέ.
- source_word: ὁμοία αὐτῇ
  choice: qui lui est semblable
  rationale: ὁμοία suivi du datif exprime une comparaison avec le premier commandement. « Semblable » garde un registre digne et n’explicite pas au-delà du grec la nature exacte de cette similitude.
- source_word: Ἀγαπήσεις
  choice: Tu aimeras
  rationale: Le futur de l’indicatif reprend la formulation grecque de Lévitique 19.18 et possède ici une valeur impérative. Le futur français préserve à la fois la forme citationnelle et la force du commandement.
- source_word: τὸν πλησίον σου
  choice: ton prochain
  rationale: L’expression idiomatique désigne autrui dans la relation de proximité humaine; « ton prochain » en est l’équivalent français établi et précis.
- source_word: ὡς σεαυτόν
  choice: comme toi-même
  rationale: ὡς introduit le terme de comparaison et le pronom réfléchi renvoie au destinataire du commandement. La formulation française est directe et idiomatique.
theological_decisions:
- issue: Relation entre le deuxième commandement et le premier
  choice: le deuxième, qui lui est semblable
  alternative: un deuxième lui est semblable
  rationale: Le contexte identifie nettement le commandement placé au deuxième rang, tandis que « semblable » préserve sans la définir davantage la relation affirmée avec le premier. La traduction ne les confond pas et n’ajoute aucune hiérarchie théologique absente de la phrase.
translation_notes:
  register: Français international moderne, naturel et digne. Les guillemets signalent la citation scripturaire; « Tu aimeras » conserve son registre biblique sans devenir archaïque.
