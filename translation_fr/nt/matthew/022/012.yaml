id: MAT.22.12
reference: Matthew 22:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/012.yaml
  text: And he says to him[a], ‘Friend, how did you come in here without a wedding garment?’ But he was speechless.
translation:
  language: fr
  text: 'Il lui dit : « Mon ami, comment es-tu entré ici sans habit de noces ? » Mais l’homme resta sans voix.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « fut réduit au silence ». Le verbe grec peut aussi signifier « fut muselé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑταῖρε
  choice: Mon ami
  rationale: Cette apostrophe peut paraître courtoise tout en marquant ici une certaine distance et un reproche implicite. « Mon ami » est naturel en français et préserve cette tension sans accentuer l’hostilité.
- source_word: πῶς
  choice: comment
  rationale: L’adverbe interroge la manière ou les circonstances de l’entrée, plutôt que sa raison.
- source_word: εἰσῆλθες ὧδε
  choice: es-tu entré ici
  rationale: Cette formulation rend directement l’acte accompli d’entrer dans ce lieu et reste idiomatique en français moderne.
- source_word: μὴ ἔχων
  choice: sans
  rationale: La préposition rend naturellement la construction participiale exprimant l’absence du vêtement requis.
- source_word: ἔνδυμα γάμου
  choice: habit de noces
  rationale: L’expression désigne au singulier une tenue associée aux noces. « Habit de noces » est clair, digne et suffisamment général pour ne pas préciser indûment le type de vêtement.
- source_word: ἐφιμώθη
  choice: resta sans voix
  rationale: Le passif de φιμόω signifie littéralement « museler » et, par extension, réduire au silence. Dans ce contexte, « resta sans voix » exprime naturellement l’incapacité de l’homme à répondre, tandis que le sens plus littéral est signalé en note.
theological_decisions:
- issue: Ton de l’adresse du maître à l’invité qui ne porte pas l’habit requis
  choice: 'Une adresse apparemment courtoise, mais implicitement réprobatrice : « Mon ami »'
  alternative: « Compagnon » ou une interpellation plus sèche
  rationale: Le grec maintient une tension entre la forme d’adresse et le reproche. La traduction ne transforme cette apostrophe ni en marque de réelle intimité ni en expression ouvertement hostile.
- issue: Portée du passif ἐφιμώθη
  choice: 'Exprimer dans le texte le résultat narratif : « resta sans voix »'
  alternative: « fut réduit au silence » ou, littéralement, « fut muselé »
  rationale: La formulation retenue est naturelle en français et traduit l’absence de réponse sans trancher excessivement entre incapacité, honte et silence imposé. La note conserve l’image forte du verbe grec.
translation_notes:
  register: Français moderne, international et digne. Le présent narratif « Il lui dit » conserve la vivacité du grec. « Mon ami » garde la politesse distante de l’apostrophe, et « habit de noces » évite de préciser un vêtement particulier que le texte ne définit pas.
