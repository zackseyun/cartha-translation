id: MAT.22.35
reference: Matthew 22:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικὸς πειράζων ⸀αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/035.yaml
  text: And one of them, a lawyer, asked him a question, testing him.
translation:
  language: fr
  text: Et l’un d’eux, un spécialiste de la Loi[a], lui posa une question pour le mettre à l’épreuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un légiste ». Le terme grec désigne ici un spécialiste de la loi juive.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve le lien narratif simple avec le contexte précédent sans ajouter une nuance temporelle absente du grec.
- source_word: ἐπηρώτησεν
  choice: lui posa une question
  rationale: Expression française naturelle qui restitue explicitement l’acte d’interroger exprimé par le verbe.
- source_word: εἷς ἐξ αὐτῶν
  choice: l’un d’eux
  rationale: Rend naturellement l’expression partitive et indique que l’interlocuteur appartient au groupe déjà mentionné.
- source_word: νομικὸς
  choice: un spécialiste de la Loi
  rationale: Dans ce contexte juif, le terme désigne un connaisseur de la loi mosaïque et non un juriste au sens moderne; la majuscule aide à signaler cette référence religieuse.
- source_word: πειράζων
  choice: pour le mettre à l’épreuve
  rationale: Rend la valeur circonstancielle et probablement intentionnelle du participe, tout en évitant « tenter », qui évoque souvent en français une incitation au péché.
- source_word: αὐτόν
  choice: le
  rationale: Pronom objet renvoyant naturellement à Jésus dans « le mettre à l’épreuve ».
theological_decisions:
- issue: Nuance de πειράζων à l’égard de Jésus
  choice: pour le mettre à l’épreuve
  alternative: en le tentant
  rationale: Le grec peut exprimer l’idée d’éprouver, de tester ou de tenter. Ici, l’examen hostile convient au contexte, sans réduire le terme à une incitation au mal.
translation_notes:
  register: Français international moderne, clair et digne. « Spécialiste de la Loi » évite le sens contemporain potentiellement trompeur d’« avocat »; « poser une question » est idiomatique et « mettre à l’épreuve » conserve la tension du contexte.
