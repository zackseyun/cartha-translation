  naturalness: La phrase est fluide, claire et de registre narratif digne en français international moderne. « Mais lorsque le roi entra pour voir… il aperçut… » restitue naturellement l’enchaînement narratif, sans lourdeur. L’expression « allongés à table » est intelligible dans son contexte et la note culturelle en précise le sens antique.
