id: MAT.22.11
reference: Matthew 22:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/011.yaml
  text: But when the king came in to look at the guests reclining at the table[b][a], he saw there a man not dressed in wedding clothes.
translation:
  language: fr
  text: Mais lorsque le roi entra pour voir les convives allongés à table[a], il aperçut là un homme qui ne portait pas de tenue de noces[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « ceux qui étaient allongés », selon la posture habituelle des convives lors d’un banquet officiel dans l’Antiquité.
    reason: cultural_note
  - marker: b
    text: 'Ou : « un vêtement de noces ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν δὲ
  choice: Mais lorsque le roi entra
  rationale: Le participe aoriste situe l’entrée avant le verbe principal; « lorsque… entra » restitue naturellement cette relation. δέ marque ici une transition narrative teintée de contraste, rendue par « Mais ».
- source_word: θεάσασθαι
  choice: pour voir
  rationale: L’infinitif exprime le but de l’entrée du roi. « Voir » reste naturel et n’impose pas la nuance plus forte d’une inspection officielle.
- source_word: τοὺς ἀνακειμένους
  choice: les convives allongés à table
  rationale: Dans le cadre d’un banquet, ἀνάκειμαι désigne la posture antique consistant à manger allongé. « Convives » explicite leur rôle, tandis que « allongés à table » conserve le détail culturel.
- source_word: εἶδεν ἐκεῖ
  choice: il aperçut là
  rationale: « Aperçut » évite en français la répétition immédiate de « voir » tout en exprimant fidèlement la perception rapportée par εἶδεν; « là » rend ἐκεῖ.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Le nom masculin singulier désigne ici un individu masculin précis du récit, et non l’humanité en général.
- source_word: οὐκ ἐνδεδυμένον ἔνδυμα γάμου
  choice: qui ne portait pas de tenue de noces
  rationale: Le participe parfait décrit l’état vestimentaire présent de l’homme. « Tenue de noces » est une formulation française actuelle et digne pour un vêtement approprié à la célébration.
theological_decisions:
- issue: Posture des convives au banquet
  choice: Conserver l’image des convives allongés à table.
  alternative: Dire simplement « les invités » ou, plus littéralement, « ceux qui étaient allongés ».
  rationale: La formulation retenue garde le cadre historique du banquet antique tout en permettant au lecteur moderne de comprendre immédiatement de qui il s’agit.
- issue: Valeur de ἔνδυμα γάμου
  choice: « tenue de noces », sans préciser davantage sa nature ni son origine.
  alternative: « vêtement de noces » ou « habit de mariage ».
  rationale: Le grec indique un vêtement adapté aux noces, mais le verset ne dit ni qui devait le fournir ni quelle signification symbolique précise il revêt. La traduction préserve cette retenue.
- issue: Genre de ἄνθρωπον
  choice: « un homme ».
  alternative: « quelqu’un » ou « une personne ».
  rationale: Dans ce récit, le masculin singulier renvoie à un personnage individuel; la traduction maintient cette indication sans en tirer de conclusion doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste fluide à l’oral comme à l’écrit; le détail historique de la posture à table est conservé et expliqué en note.
