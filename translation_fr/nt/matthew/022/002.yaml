id: MAT.22.2
reference: Matthew 22:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησεν γάμους τῷ υἱῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/002.yaml
  text: The kingdom of heaven was compared to a king who gave a wedding feast for his son[a][b].
translation:
  language: fr
  text: Le royaume des cieux a été comparé à un roi qui organisa les noces de son fils[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « peut être comparé à ». Le grec dit littéralement « a été comparé à » ou « a été rendu semblable à » ; la variante exprime la formule parabolique courante en français.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « des noces » au pluriel, expression qui désigne les festivités ou le banquet d’un mariage.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡμοιώθη
  choice: a été comparé à
  rationale: L’aoriste passif de ὁμοιόω est rendu sans introduire la nuance modale de « peut être comparé ». Une note signale la formule parabolique française plus courante.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Cette formulation consacrée conserve l’expression propre à Matthieu et sa possible amplitude entre règne et royaume, sans l’harmoniser avec « royaume de Dieu ».
- source_word: ἀνθρώπῳ βασιλεῖ
  choice: un roi
  rationale: En français, ἄνθρωπος accompagné de βασιλεύς désigne naturellement « un roi ». « Un homme, un roi » serait lourd et pourrait suggérer à tort deux référents.
- source_word: ὅστις
  choice: qui
  rationale: Le simple relatif français transmet naturellement la fonction du pronom grec sans en exagérer la nuance.
- source_word: ἐποίησεν γάμους
  choice: organisa les noces
  rationale: Avec γάμους, ποιέω signifie idiomatiquement organiser ou célébrer des festivités nuptiales. « Organisa » convient au rôle du roi comme hôte.
- source_word: γάμους
  choice: les noces
  rationale: Le pluriel grec désigne ici les festivités du mariage. Le français « les noces » conserve naturellement cette valeur collective et festive.
- source_word: τῷ υἱῷ αὐτοῦ
  choice: de son fils
  rationale: Avec « les noces », le complément français « de son fils » exprime naturellement que la célébration est organisée pour lui.
theological_decisions:
- issue: Nature de l’expression « royaume des cieux »
  choice: Conserver « le royaume des cieux »
  alternative: « le royaume de Dieu » ou « le règne des cieux »
  rationale: La formulation de Matthieu est maintenue sans substitution interprétative, ce qui préserve sa particularité littéraire et l’ambivalence possible entre règne et royaume.
translation_notes:
  register: Français international moderne, digne et accessible. « Organisa les noces » est naturel et conserve la dimension festive du pluriel grec. Les deux appels de note figurent dans le texte principal.
