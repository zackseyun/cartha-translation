id: MAT.22.3
reference: Matthew 22:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/003.yaml
  text: And he sent his servants to call those who had been invited to the wedding feast[c][b][a], and they were unwilling to come.
translation:
  language: fr
  text: Il envoya ses serviteurs[a] appeler ceux qui avaient été invités[b] au banquet de noces[c], et ils ne voulurent pas venir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves ». Le mot grec peut désigner des serviteurs ou des esclaves ; ici, le récit souligne surtout leur rôle d’agents du roi.
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui avaient été appelés ». Le grec emploie ici la même famille verbale que pour « appeler », mais, dans ce contexte, il s’agit de personnes déjà invitées.
    reason: lexical_alternative
  - marker: c
    text: Ou « aux noces » ou « au festin de noces ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: L’aoriste de ἀποστέλλω exprime simplement l’envoi; « envoya » est précis et naturel ici.
- source_word: δούλους
  choice: serviteurs
  rationale: δοῦλος peut désigner des esclaves ou des serviteurs. Dans cette parabole, l’accent porte sur leur fonction d’agents du roi plutôt que sur leur statut social; l’autre sens est conservé en note.
- source_word: καλέσαι
  choice: appeler
  rationale: L’infinitif indique le but de l’envoi. « Appeler » garde le sens d’une convocation et reflète, autant que possible, le lien lexical avec κεκλημένους.
- source_word: κεκλημένους
  choice: ceux qui avaient été invités
  rationale: Le participe parfait passif désigne les personnes qui avaient déjà reçu l’invitation. Cette formulation rend clairement l’antériorité et convient au contexte des noces.
- source_word: εἰς τοὺς γάμους
  choice: au banquet de noces
  rationale: Dans ce contexte, le pluriel γάμοι renvoie à la célébration nuptiale, en particulier au banquet, et non au seul acte du mariage.
- source_word: οὐκ ἤθελον ἐλθεῖν
  choice: ils ne voulurent pas venir
  rationale: Cette formulation rend directement la volonté négative exprimée par ἤθελον avec l’infinitif, sans renforcer le texte jusqu’à « ils refusèrent ».
theological_decisions:
- issue: Traduction de δοῦλος dans une parabole royale
  choice: serviteurs
  alternative: esclaves
  rationale: Le récit met ici en avant la mission confiée par le roi à ses agents. « Serviteurs » convient donc au premier plan narratif, tandis que « esclaves », également possible lexicalement, est signalé en note afin de ne pas effacer l’ambiguïté sociale du terme grec.
translation_notes:
  register: Français international moderne, naturel et digne. « Mais » rend la valeur adversative du second καί dans le contexte. La formulation conserve l’accent du grec sur le manque de volonté des invités sans durcir le propos en refus explicite.
