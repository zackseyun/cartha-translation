  text: λέγει αὐτοῖς· Πῶς οὖν Δαυὶδ ἐν πνεύματι ⸂καλεῖ αὐτὸν κύριον⸃ λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/043.yaml
  text: He said to them[a], “How then does David, in the Spirit, call him Lord[b], saying,”
translation:
  language: fr
  text: 'Il leur dit : « Comment donc David l’appelle-t-il Seigneur sous l’inspiration de l’Esprit[a], lorsqu’il dit : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Esprit » ou « par l’Esprit ». L’expression grecque peut indiquer le cadre dans lequel David parle ou l’action par laquelle il est inspiré ; « sous l’inspiration de l’Esprit » exprime cette nuance naturellement en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς
  choice: Il leur dit
  rationale: Le présent grec est un présent historique. Le présent français reste naturel dans le récit et reproduit directement cette vivacité narrative.
- source_word: Πῶς οὖν
  choice: Comment donc
  rationale: Cette formulation conserve la force interrogative de πῶς et la nuance logique ou déductive de οὖν.
- source_word: ἐν πνεύματι
  choice: dans l’Esprit
  rationale: La traduction suit de près ἐν et comprend probablement πνεῦμα comme l’Esprit Saint, tout en maintenant l’expression assez ouverte pour évoquer aussi bien la sphère que l’action inspiratrice.
- source_word: καλεῖ αὐτὸν κύριον
  choice: l’appelle-t-il Seigneur
  rationale: « Seigneur » est le rendu usuel de κύριος et préserve le titre qui est déterminant dans l’argument fondé sur le Psaume 110.
- source_word: λέγων
  choice: lorsqu’il dit
  rationale: Cette tournure française introduit naturellement la citation à venir tout en exprimant le lien du participe avec le verbe principal.
theological_decisions:
- issue: Référent de πνεῦμα dans ἐν πνεύματι
  choice: L’Esprit Saint
  alternative: L’esprit de David ou un état spirituel
  rationale: Dans ce contexte de parole scripturaire inspirée, l’Esprit Saint est le référent le plus probable. La majuscule indique ce choix sans expliciter davantage que le grec.
- issue: Sens de κύριος
  choice: Seigneur
  alternative: maître
  rationale: « Seigneur » conserve le sens titulaire et la portée intertextuelle de la citation du Psaume 110, sans trancher au-delà de l’argument formulé par Jésus.
translation_notes:
  register: Français international moderne, digne et accessible. La structure interrogative est naturelle, le présent historique est conservé, et les deux ambiguïtés lexicales importantes sont signalées en notes.
