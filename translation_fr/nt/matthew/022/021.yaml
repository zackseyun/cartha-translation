id: MAT.22.21
reference: Matthew 22:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγουσιν ⸀αὐτῷ· Καίσαρος. τότε λέγει αὐτοῖς· Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/021.yaml
  text: They said to him[a], “Caesar’s.” Then he said to them, “Therefore render to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: fr
  text: 'Ils lui dirent : « De César. » Alors il leur dit : « Rendez[a] donc à César ce qui est à César, et à Dieu ce qui est à Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi signifier « donnez en retour », « payez » ou « remettez ce qui est dû ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Ils lui dirent
  rationale: Les présents grecs de narration sont rendus au passé simple, naturel dans un récit français soutenu. Le datif αὐτῷ est conservé par « lui ».
- source_word: Καίσαρος
  choice: De César
  rationale: Le génitif répond à la question implicite de l’appartenance de l’effigie et de l’inscription. La réponse elliptique « De César » en conserve la forme et le sens.
- source_word: τότε λέγει αὐτοῖς
  choice: Alors il leur dit
  rationale: « Alors » marque la progression de l’échange, et le présent historique λέγει est rendu au passé simple pour la fluidité du récit français.
- source_word: Ἀπόδοτε
  choice: Rendez
  rationale: Le verbe ἀποδίδωμι peut exprimer l’idée de rendre, de payer ou de remettre ce qui est dû. « Rendez » conserve cette portée sans réduire le commandement au seul paiement de l’impôt.
- source_word: οὖν
  choice: donc
  rationale: La particule introduit la conséquence tirée de leur réponse au sujet de César.
- source_word: τὰ Καίσαρος Καίσαρι
  choice: à César ce qui est à César
  rationale: Cette formulation française naturelle préserve l’appartenance, le destinataire et le parallélisme de la phrase grecque.
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: à Dieu ce qui est à Dieu
  rationale: La construction parallèle est conservée, avec « Dieu » pour θεός dans ce contexte monothéiste.
theological_decisions:
- issue: Portée du commandement concernant les obligations envers César et envers Dieu
  choice: Conserver les deux membres parallèles sans préciser davantage leur étendue
  alternative: Limiter la parole au paiement de l’impôt, ou en faire une approbation générale et absolue de l’autorité politique
  rationale: Le grec distingue ce qui revient à César de ce qui revient à Dieu, sans développer ici une théorie politique. La traduction maintient cette distinction et sa tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La formulation bien établie « à César ce qui est à César » reste naturelle et reproduit le parallélisme rhétorique de l’original.
