  text: καὶ λέγει αὐτοῖς· Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/020.yaml
  text: And he said to them[a], “Whose image is this, and whose inscription?”
translation:
  language: fr
  text: 'Il leur dit : « De qui sont cette image et cette inscription[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À qui appartiennent cette image et cette inscription ? » Le grec emploie un interrogatif au génitif qui peut exprimer l’appartenance ou l’association.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: demanda
  rationale: Le présent historique grec introduit ici une question. En français narratif moderne, le passé simple est naturel, et « demanda » exprime idiomatiquement l'acte de parole sans en modifier le sens.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom au datif pluriel désigne les destinataires de la question ; le pronom indirect français « leur » est l'équivalent naturel.
- source_word: Τίνος
  choice: De qui sont
  rationale: Le génitif interrogatif demande à qui l'image et l'inscription se rattachent ou appartiennent. Cette tournure française conserve cette relation tout en permettant de coordonner naturellement les deux noms.
- source_word: εἰκών
  choice: image
  rationale: « Image » désigne avec précision l'effigie figurant sur la pièce et préserve le vocabulaire biblique courant sans préciser abusivement « portrait ».
- source_word: αὕτη
  choice: cette
  rationale: Le démonstratif féminin singulier détermine directement « image ».
- source_word: ἐπιγραφή
  choice: inscription
  rationale: Le terme désigne les mots gravés sur la pièce ; « inscription » est précis, actuel et naturel.
- source_word: καὶ
  choice: et
  rationale: 'La conjonction coordonne les deux éléments observés sur la pièce : l''image et l''inscription.'
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit. La formulation garde la portée du génitif interrogatif grec sans imposer une distinction artificielle entre le propriétaire de la pièce et la personne représentée.
