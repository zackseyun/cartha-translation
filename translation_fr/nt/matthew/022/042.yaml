id: MAT.22.42
reference: Matthew 22:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγων· Τί ὑμῖν δοκεῖ περὶ τοῦ χριστοῦ; τίνος υἱός ἐστιν; λέγουσιν αὐτῷ· Τοῦ Δαυίδ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/042.yaml
  text: saying[a], “What do you think about the Messiah? Whose son is he?” They said to him, “David’s.”
translation:
  language: fr
  text: 'en disant : « Que pensez-vous du Messie[a] ? De qui est-il le fils ? » Ils lui répondirent : « De David. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du Christ ». Le titre grec est Χριστός (Christos), employé ici dans son sens messianique.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: en disant
  rationale: Le participe présent de λέγω introduit les paroles de Jésus. « En disant » conserve sobrement la forme et le lien narratif avec le verset précédent.
- source_word: Τί ὑμῖν δοκεῖ
  choice: Que pensez-vous
  rationale: Avec le datif ὑμῖν, δοκέω sollicite ici un jugement ou une opinion. Cette tournure est naturelle en français moderne.
- source_word: περὶ τοῦ χριστοῦ
  choice: du Messie
  rationale: Χριστός est ici un titre au cœur d’une discussion sur l’attente messianique juive ; « Messie » en exprime directement le sens, tandis qu’une note signale « Christ ».
- source_word: τίνος υἱός ἐστιν
  choice: De qui est-il le fils ?
  rationale: La question porte sur la filiation et l’ascendance du Messie. La formulation française garde explicitement le terme « fils » sans préciser davantage la nature de cette filiation.
- source_word: λέγουσιν αὐτῷ
  choice: Ils lui répondirent
  rationale: Dans ce dialogue, λέγουσιν introduit la réponse à une question. Le passé simple rend naturellement le présent historique grec dans un récit français de registre soutenu mais accessible.
- source_word: Τοῦ Δαυίδ
  choice: De David
  rationale: Le génitif grec constitue une réponse elliptique dont « fils » est sous-entendu à partir de la question. « De David » préserve cette concision et cette ellipse.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le mot fonctionne ici comme un titre messianique plutôt que comme une désignation devenue quasi nominale. « Messie » convient donc au contexte, sans effacer l’équivalent traditionnel « Christ », donné en note.
- issue: Nature de la filiation davidique
  choice: De qui est-il le fils ? — De David.
  alternative: De qui descend-il ? — De David.
  rationale: La traduction conserve υἱός, « fils », et ne réduit pas d’avance la question à la seule descendance biologique ou dynastique, puisque les versets suivants développent précisément la tension attachée à ce titre.
translation_notes:
  register: Français international moderne, digne et direct. Le passé simple « répondirent » convient au registre narratif biblique sans archaïsme marqué. L’ellipse finale « De David » reproduit celle du grec.
