  text: 'And Jesus answered and again spoke to them in parables[a], saying:'
translation:
  language: fr
  text: 'Jésus répondit et leur parla de nouveau en paraboles[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie la tournure narrative courante « répondit », même lorsqu’aucune question explicite ne précède immédiatement. Autre traduction : « Jésus répondit et leur dit de nouveau en paraboles. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: '[non rendu séparément]'
  rationale: La continuité narrative est exprimée naturellement en français par l’enchaînement direct de la phrase; ajouter « Et » serait possible, mais plus lourd ici.
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς
  choice: Jésus reprit la parole
  rationale: Cette tournure française naturelle conserve la valeur narrative de « répondre/prendre la parole » sans laisser entendre qu’une question explicite vient nécessairement d’être posée.
- source_word: πάλιν
  choice: de nouveau
  rationale: Rend clairement l’idée de répétition dans la suite du discours.
- source_word: εἶπεν
  choice: parla
  rationale: Évite la répétition maladroite de « dit… disant » tout en conservant l’acte de parole.
- source_word: ἐν παραβολαῖς
  choice: en paraboles
  rationale: Rend la manière ou le moyen d’expression indiqué par ἐν avec le datif.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif désigne naturellement les destinataires des paroles de Jésus.
- source_word: λέγων
  choice: ':'
  rationale: En français moderne, les deux-points introduisent naturellement les paroles qui suivent et remplissent la fonction discursive du participe grec.
theological_decisions:
- issue: Valeur idiomatique de ἀποκριθείς en l’absence de question explicite immédiate
  choice: « reprit la parole »
  alternative: « répondit »
  rationale: Le grec emploie une formule narrative courante. « Reprit la parole » préserve la continuité et l’idée de réponse sans imposer l’existence d’une question immédiatement antérieure.
translation_notes:
  register: Français international moderne, naturel et digne. La structure est légèrement réorganisée pour éviter une formulation pesante, tout en conservant la répétition exprimée par πάλιν et la nuance narrative de ἀποκριθείς.
