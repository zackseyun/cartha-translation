id: MAT.22.30
reference: Matthew 22:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ ὡς ἄγγελοι ⸀θεοῦ ἐν ⸀τῷ οὐρανῷ εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/030.yaml
  text: For in the resurrection they neither marry nor are given in marriage[a], but are like the angels of God in heaven.
translation:
  language: fr
  text: Car, à la résurrection[a], on ne se marie pas et on n’est pas donné en mariage, mais on est comme les anges de Dieu dans le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans la vie de résurrection ».'
    reason: La préposition ἐν peut ici évoquer soit le moment de la résurrection, soit la condition propre à la vie ressuscitée.
lexical_decisions:
- source_word: ἐν γὰρ τῇ ἀναστάσει
  choice: Car, à la résurrection
  rationale: « Car » conserve le lien explicatif de γάρ. En français actuel, « à la résurrection » rend naturellement ἐν τῇ ἀναστάσει, qui peut désigner le moment de la résurrection ou la condition de la vie ressuscitée; la note signale cette seconde nuance.
- source_word: γαμοῦσιν
  choice: on ne se marie pas
  rationale: Le tour avec « on » est naturel, inclusif et général. Il exprime l’entrée dans le mariage sans limiter artificiellement le sujet aux hommes.
- source_word: γαμίζονται
  choice: on n’est pas donné en mariage
  rationale: Le passif distinct est conservé plutôt que fondu dans le premier verbe. Cette formulation reflète la pratique ancienne selon laquelle une personne pouvait être donnée en mariage, tout en restant compréhensible aujourd’hui.
- source_word: ὡς
  choice: comme
  rationale: '« Comme » marque une comparaison et non une identité: les ressuscités sont comparés aux anges, sans qu’il soit affirmé qu’ils deviennent des anges.'
- source_word: ἄγγελοι θεοῦ
  choice: les anges de Dieu
  rationale: Cette expression représente explicitement le génitif θεοῦ présent dans le texte grec retenu.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Dans ce contexte, οὐρανός désigne le ciel comme domaine céleste où sont les anges, et non le ciel visible.
theological_decisions:
- issue: Portée de la comparaison avec les anges
  choice: Les ressuscités sont comme les anges quant à l’absence de mariage.
  alternative: Comprendre la comparaison comme l’affirmation d’un mode d’existence angélique plus général, voire comme une transformation en anges.
  rationale: ὡς introduit une similitude, tandis que le contexte immédiat porte sur le mariage. La traduction conserve la comparaison sans transformer la similitude en identité ni préciser au-delà du texte toute sa portée.
- issue: Valeur de ἐν τῇ ἀναστάσει
  choice: « à la résurrection », avec une note indiquant la nuance possible de l’état ressuscité
  alternative: « dans la vie de résurrection »
  rationale: Le syntagme grec peut être compris temporellement ou comme désignant la condition de l’existence ressuscitée. Le texte principal privilégie le français le plus idiomatique, et la note préserve l’autre nuance.
translation_notes:
  register: Français international moderne, simple et digne. L’emploi générique de « on » évite les périphrases genrées et garde le parallélisme des deux verbes grecs. La répétition de « on » clarifie que la comparaison porte sur les personnes ressuscitées.
