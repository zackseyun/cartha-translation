id: MAT.22.25
reference: Matthew 22:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦσαν δὲ παρ’ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος ⸀γήμας ἐτελεύτησεν, καὶ μὴ ἔχων σπέρμα ἀφῆκεν τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/025.yaml
  text: There were seven brothers among us[a]. The first married and died, and having no offspring[b], he left his wife to his brother.
translation:
  language: fr
  text: Il y avait parmi nous sept frères. Le premier s’est marié, puis il est mort sans avoir de descendance[a], laissant sa femme à son frère[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sans avoir de semence ». Ici, « semence » désigne la descendance.'
    reason: lexical_alternative
  - marker: b
    text: 'Il s’agit de la coutume du lévirat : le frère d’un homme mort sans descendance devait épouser sa veuve afin de lui assurer une descendance ; voir Deutéronome 25.5.'
    reason: cultural_note
lexical_decisions:
- source_word: παρ’ ἡμῖν
  choice: parmi nous
  rationale: παρά avec le datif exprime ici la présence ou l’appartenance au groupe évoqué. « Parmi nous » est naturel en français et convient à la présentation du cas par les sadducéens.
- source_word: ἑπτὰ ἀδελφοί
  choice: sept frères
  rationale: Dans ce contexte de mariage léviratique, ἀδελφοί désigne clairement des frères de sexe masculin.
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: πρῶτος indique ici le premier dans la succession des frères, sans affirmer qu’il était l’aîné.
- source_word: γήμας
  choice: s’est marié
  rationale: Le participe aoriste indique que le mariage a précédé la mort. Cette formulation rend naturellement la séquence en français.
- source_word: ἐτελεύτησεν
  choice: il est mort
  rationale: τελευτάω signifie mourir ou arriver au terme de sa vie. La traduction directe évite un euphémisme absent du grec.
- source_word: μὴ ἔχων σπέρμα
  choice: sans avoir de descendance
  rationale: σπέρμα signifie littéralement « semence », mais désigne ici une descendance dans un cadre familial et juridique. « Descendance » conserve mieux cette portée que le seul mot « enfants ».
- source_word: ἀφῆκεν τὴν γυναῖκα αὐτοῦ
  choice: laissant sa femme
  rationale: ἀφίημι signifie ici laisser derrière soi au moment de mourir, et non abandonner ou répudier. Le participe français relie naturellement cette conséquence à sa mort.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: à son frère
  rationale: Le datif désigne le frère survivant auquel la veuve est laissée selon la coutume supposée par le récit, sans ajouter explicitement une action que le grec ne formule pas.
theological_decisions:
- issue: Faut-il expliciter le mariage léviratique dans le corps du texte ?
  choice: 'Conserver la formulation implicite du grec : « laissant sa femme à son frère » et expliquer l’arrière-plan en note.'
  alternative: « laissant à son frère le soin d’épouser sa femme » ou « pour que son frère l’épouse »
  rationale: Le contexte légal de Deutéronome 25.5 est présupposé, mais le grec n’ajoute pas explicitement « pour l’épouser ». L’explication en note éclaire le lecteur sans développer le texte principal au-delà de la source.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé convient à un cas raconté dans un dialogue. « Puis » explicite seulement l’ordre temporel porté par le participe aoriste antérieur, tandis que la tournure participiale « laissant » maintient la concision de la proposition finale.
