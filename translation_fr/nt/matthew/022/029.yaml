id: MAT.22.29
reference: Matthew 22:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/029.yaml
  text: But Jesus answered them[a], “You are mistaken, because you know neither the Scriptures nor the power of God.”
translation:
  language: fr
  text: 'Mais Jésus leur répondit : « Vous êtes dans l’erreur[a], parce que vous ne connaissez ni les Écritures ni la puissance de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Vous vous trompez », « Vous vous égarez » ou « Vous êtes trompés ».
    reason: Πλανᾶσθε peut désigner le fait d’être dans l’erreur, de s’égarer ou d’être trompé.
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Mais Jésus leur répondit
  rationale: La formule participiale grecque signifie idiomatiquement que Jésus prend la parole en réponse. « Mais » rend la transition légèrement adversative de δέ, tandis que « leur répondit » évite le calque lourd « ayant répondu, leur dit ».
- source_word: Πλανᾶσθε
  choice: Vous êtes dans l’erreur
  rationale: Le verbe peut exprimer le fait de se tromper, d’être égaré ou d’être dans l’erreur. Cette formulation naturelle conserve l’état d’erreur sans imposer l’idée qu’un tiers les trompe.
- source_word: μὴ εἰδότες
  choice: parce que vous ne connaissez
  rationale: Le participe circonstanciel indique naturellement la cause de leur erreur. « Parce que » explicite cette relation en français courant.
- source_word: τὰς γραφὰς
  choice: les Écritures
  rationale: Dans ce contexte juif, le pluriel désigne les écrits sacrés reconnus. « Les Écritures » est l’équivalent français usuel et précis.
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: ni la puissance de Dieu
  rationale: La corrélation « ne… ni… ni » rend les deux objets coordonnés de leur ignorance, et « la puissance de Dieu » conserve la force formelle de l’expression grecque.
theological_decisions:
- issue: Cause de l’erreur des sadducéens
  choice: Leur erreur vient de ce qu’ils ne connaissent ni les Écritures ni la puissance de Dieu.
  alternative: Comprendre la proposition comme une simple accusation d’égarement, sans lien causal explicite.
  rationale: Le participe μὴ εἰδότες explique naturellement pourquoi ils sont dans l’erreur. La traduction garde à la fois les deux causes coordonnées et leur relation avec l’affirmation principale.
- issue: Portée de Πλανᾶσθε
  choice: Vous êtes dans l’erreur
  alternative: Vous êtes trompés / Vous vous égarez
  rationale: La forme grecque permet une nuance moyenne ou passive. Le texte principal préserve l’accusation d’erreur sans trancher en faveur d’une tromperie extérieure; la note signale les autres nuances possibles.
translation_notes:
  register: Français international moderne, digne et direct. La formulation reste naturelle à l’oral comme à l’écrit, sans archaïsme; la majuscule à « Écritures » indique les écrits sacrés visés dans le contexte.
