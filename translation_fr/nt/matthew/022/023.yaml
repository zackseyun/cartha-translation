  text: Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, ⸀λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/023.yaml
  text: On that day Sadducees came to him[a], saying there is no resurrection, and they questioned him.
translation:
  language: fr
  text: Ce jour-là, des sadducéens[a], qui disent qu’il n’y a pas de résurrection, vinrent le trouver et l’interrogèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des sadducéens vinrent le trouver, disant qu’il n’y a pas de résurrection ».'
    reason: La construction participiale grecque peut être rendue de façon plus proche par un participe présent; la relative du texte principal exprime plus explicitement sa valeur caractérisante.
lexical_decisions:
- source_word: Ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Ce jour-là
  rationale: Expression temporelle idiomatique en français moderne, qui conserve le lien avec les événements du même jour.
- source_word: προσῆλθον αὐτῷ
  choice: vinrent le trouver
  rationale: Rend naturellement l’idée de venir auprès de quelqu’un pour s’adresser à lui, sans la raideur de « s’approchèrent de lui ».
- source_word: Σαδδουκαῖοι
  choice: sadducéens
  rationale: Forme française consacrée du nom de ce groupe juif.
- source_word: λέγοντες
  choice: disant
  rationale: Le participe présent conserve au plus près la construction grecque et laisse ouverte la nuance entre une déclaration faite à ce moment-là et la caractérisation de leur position habituelle.
- source_word: μὴ εἶναι ἀνάστασιν
  choice: qu’il n’y a pas de résurrection
  rationale: Formulation française claire qui exprime directement le contenu de leur négation.
- source_word: ἀνάστασιν
  choice: résurrection
  rationale: Terme français usuel qui garde la portée théologique du grec sans développement interprétatif.
- source_word: ἐπηρώτησαν αὐτὸν
  choice: l’interrogèrent
  rationale: Traduit l’acte de lui adresser une question, avec la nuance d’un questionnement appuyé adaptée au contexte, sans aller jusqu’à « soumettre à un interrogatoire ».
theological_decisions:
- issue: Présentation de la négation sadducéenne de la résurrection
  choice: disant qu’il n’y a pas de résurrection
  alternative: des sadducéens, qui affirment qu’il n’y a pas de résurrection
  rationale: Le texte principal maintient la forme participiale et ne transforme pas explicitement la proposition en commentaire doctrinal permanent du narrateur. La note donne la lecture caractérisante, bien attestée par le contexte, sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, sobre et digne. « Vinrent le trouver » assure une narration naturelle; « sadducéens » reste en minuscule selon l’usage français pour les membres d’un groupe religieux.
