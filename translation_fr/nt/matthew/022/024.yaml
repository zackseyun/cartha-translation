source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς εἶπεν· Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/024.yaml
  text: saying[a], “Teacher, Moses said, ‘If a man dies without having children, his brother shall marry his wife and raise up offspring for his brother.’”
translation:
  language: fr
  text: 'Ils disaient : « Maître, Moïse a dit : “Si un homme meurt sans avoir d’enfants, son frère épousera sa veuve[a] et suscitera une descendance pour son frère.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « son frère accomplira envers la veuve le devoir de beau-frère ». Le grec désigne précisément le mariage léviratique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans cette interpellation, le terme désigne Jésus comme enseignant. « Maître » est l’appellation française naturelle et digne dans ce contexte, sans exprimer ici une domination personnelle.
- source_word: Ἐάν τις ἀποθάνῃ
  choice: Si un homme meurt
  rationale: Le cas juridique concerne explicitement un homme, comme le confirment les rôles familiaux masculins qui suivent.
- source_word: μὴ ἔχων τέκνα
  choice: sans avoir d’enfants
  rationale: τέκνα désigne les enfants sans se limiter aux fils; cette formulation restitue clairement la construction participiale.
- source_word: ἐπιγαμβρεύσει
  choice: épousera sa veuve
  rationale: Le verbe désigne spécifiquement le mariage léviratique avec la veuve du frère. La formulation rend le sens en français courant, tandis qu’une note conserve la valeur juridique précise.
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: sa veuve
  rationale: Littéralement « sa femme »; dans la situation décrite, elle est devenue la veuve du défunt. « Sa veuve » évite toute ambiguïté sur la personne qu’épouse le frère.
- source_word: ἀναστήσει σπέρμα
  choice: donnera une descendance
  rationale: L’expression idiomatique signifie susciter ou assurer une postérité au défunt. « Donner une descendance » est naturel et conserve la dimension familiale et procréatrice.
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: à son frère
  rationale: Le datif indique que la descendance est juridiquement attribuée au frère défunt; « à son frère » préserve cette relation de manière concise.
theological_decisions:
- issue: Formulation genrée du cas légal
  choice: « un homme » et « son frère »
  alternative: « quelqu’un » et une reformulation neutre
  rationale: Le passage cite la loi du lévirat, structurée ici autour de rôles familiaux masculins précis. La formulation genrée correspond donc au cas envisagé par le texte.
- issue: Attribution de la descendance
  choice: « donnera une descendance à son frère »
  alternative: « aura des enfants pour son frère »
  rationale: La formulation retenue maintient l’idée juridique et familiale selon laquelle la descendance est suscitée au nom du frère défunt, sans préciser au-delà du texte les modalités de cette attribution.
translation_notes:
  register: Français moderne, international et digne. Le discours direct imbriqué est ponctué avec des guillemets français puis anglais courbes. « Sa veuve » clarifie naturellement le référent, et la note signale la portée technique du verbe grec.
