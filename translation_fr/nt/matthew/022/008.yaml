source:
  edition: SBLGNT
  text: τότε λέγει τοῖς δούλοις αὐτοῦ· Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/008.yaml
  text: Then he says to his servants[a], ‘The wedding feast is ready, but those who were invited were not worthy.’
translation:
  language: fr
  text: 'Alors il dit à ses serviteurs : « Le repas de noces est prêt, mais ceux qui avaient été invités[a] n’en étaient pas dignes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui avaient été appelés ». Le participe grec peut se traduire plus littéralement ainsi, mais, dans le contexte de ce banquet, il désigne ceux qui avaient été invités au repas de noces.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la succession narrative.
- source_word: λέγει
  choice: il dit
  rationale: Conserve le présent historique grec et sa vivacité narrative.
- source_word: δούλοις
  choice: serviteurs
  rationale: Convient au cadre de la cour royale dans cette parabole; le statut servile précis n’est pas mis en avant ici.
- source_word: Ὁ μὲν γάμος
  choice: Le repas de noces
  rationale: Dans le contexte, γάμος désigne la célébration nuptiale avec son banquet; cette formulation rend clairement le repas déjà préparé.
- source_word: ἕτοιμός ἐστιν
  choice: est prêt
  rationale: Rend directement et naturellement l’adjectif prédicatif grec.
- source_word: οἱ δὲ κεκλημένοι
  choice: ceux qui avaient été invités
  rationale: Le participe parfait passif renvoie aux personnes précédemment invitées; le plus-que-parfait français exprime naturellement cet état résultant antérieur.
- source_word: οὐκ ἦσαν ἄξιοι
  choice: n’en étaient pas dignes
  rationale: Préserve la portée évaluative de ἄξιοι sans préciser abusivement le fondement de leur indignité; « en » rattache naturellement l’expression au repas de noces.
theological_decisions:
- issue: Éventuelles connotations théologiques de κεκλημένοι (« appelés »)
  choice: ceux qui avaient été invités
  alternative: ceux qui avaient été appelés
  rationale: Le contexte immédiat est celui d’invités à des noces. « Invités » exprime ce sens sans imposer une catégorie théologique, tandis que l’alternative littérale est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent historique est maintenu. La structure contrastive μὲν…δὲ est rendue par « mais ».
