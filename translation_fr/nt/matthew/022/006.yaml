id: MAT.22.6
reference: Matthew 22:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/006.yaml
  text: But the rest[a], seizing his slaves, mistreated them and killed them.
translation:
  language: fr
  text: Mais les autres[a], après s’être saisis de ses esclaves, les maltraitèrent et les tuèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ».
    reason: Alternative lexicale pour le grec δούλους, qui peut désigner des esclaves ou des serviteurs selon le contexte.
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Mais les autres
  rationale: « Les autres » désigne ceux qui restaient parmi les invités déjà mentionnés, tandis que « mais » rend la légère opposition marquée par δέ avec ceux qui avaient simplement négligé l’invitation.
- source_word: κρατήσαντες
  choice: se saisirent de
  rationale: Cette tournure française naturelle exprime la prise violente indiquée par κρατέω. La coordination avec les verbes principaux restitue clairement la succession des actes sans la lourdeur de « s’étant saisis de ».
- source_word: τοὺς δούλους αὐτοῦ
  choice: ses esclaves
  rationale: δοῦλος peut désigner un esclave ou, selon le contexte, un serviteur. Dans la parabole, ces hommes appartiennent au roi et sont envoyés par lui ; « esclaves » préserve cette réalité sociale, tandis que l’alternative idiomatique « serviteurs » est signalée en note.
- source_word: ὕβρισαν
  choice: les maltraitèrent
  rationale: ὑβρίζω désigne ici des traitements outrageants et abusifs, et non une simple insulte verbale. « Maltraitèrent » en rend naturellement l’étendue en français.
- source_word: ἀπέκτειναν
  choice: les tuèrent
  rationale: Traduction directe de ἀποκτείνω, sans ajouter la qualification juridique ou morale que pourrait suggérer « assassinèrent ».
theological_decisions:
- issue: Traduction de δοῦλος dans un contexte parabolique
  choice: esclaves
  alternative: serviteurs
  rationale: « Esclaves » conserve le statut social exprimé par le grec sans lui imposer une portée doctrinale supplémentaire. « Serviteurs » demeure possible en raison de la fonction d’émissaires exercée ici et figure donc en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique écrit. La répétition des pronoms « les » maintient la clarté et le rythme de l’enchaînement violent.
