  text: Συνηγμένων δὲ τῶν Φαρισαίων ἐπηρώτησεν αὐτοὺς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/041.yaml
  text: While the Pharisees were gathered together, Jesus asked them,
translation:
  language: fr
  text: 'Tandis que les pharisiens étaient rassemblés, Jésus leur demanda :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνηγμένων
  choice: étaient rassemblés
  rationale: Le participe aoriste passif au génitif forme avec « les pharisiens » une construction absolue qui donne le cadre circonstanciel. « Étaient rassemblés » en conserve la valeur d’arrière-plan sans alourdir la phrase.
- source_word: δὲ
  choice: Tandis que
  rationale: δὲ marque ici une transition légère, sans opposition forte. En français, la relation discursive est naturellement portée par la proposition circonstancielle introduite par « tandis que » ; un « or » ou « alors » supplémentaire serait inutile.
- source_word: τῶν Φαρισαίων
  choice: les pharisiens
  rationale: Désignation française courante du groupe religieux ; le génitif dépend de la construction absolue.
- source_word: ἐπηρώτησεν
  choice: demanda
  rationale: Dans ce contexte, le verbe introduit une question posée par Jésus. « Demanda » est naturel et n’ajoute pas la nuance potentiellement hostile de « interrogea ».
- source_word: αὐτοὺς
  choice: leur
  rationale: Le pronom renvoie aux pharisiens. Avec « demander » introduisant une question en français, le complément de personne se réalise idiomatiquement par le pronom indirect « leur ».
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Le nom propre est sujet du verbe ; l’article grec n’est pas rendu devant un nom de personne en français.
