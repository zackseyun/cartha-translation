id: MAT.22.13
reference: Matthew 22:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ⸂ὁ βασιλεὺς εἶπεν⸃ τοῖς διακόνοις· Δήσαντες αὐτοῦ πόδας καὶ χεῖρας ⸂ἐκβάλετε αὐτὸν⸃ εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/013.yaml
  text: Then the king said to the attendants[a], ‘Bind his feet and hands and throw him out into the outer darkness. In that place there will be weeping and gnashing of teeth.’
translation:
  language: fr
  text: 'Alors le roi dit aux serviteurs : « Liez-lui les pieds et les mains, et jetez-le dans les ténèbres extérieures. Là, il y aura des pleurs et des grincements de dents. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la progression temporelle du récit.
- source_word: ὁ βασιλεὺς
  choice: le roi
  rationale: Rend directement le titre royal et conserve l’imagerie de la parabole.
- source_word: τοῖς διακόνοις
  choice: aux serviteurs
  rationale: Dans le cadre du banquet royal, le terme désigne ceux qui sont au service du roi; « serviteurs » est clair et n’introduit pas de connotation ecclésiastique.
- source_word: Δήσαντες
  choice: Liez
  rationale: Le participe aoriste associé à l’impératif suivant se rend naturellement en français par deux impératifs coordonnés; « liez » exprime directement l’action de δέω.
- source_word: αὐτοῦ πόδας καὶ χεῖρας
  choice: lui les pieds et les mains
  rationale: La construction française avec pronom datif est idiomatique et conserve l’ordre grec, pieds puis mains.
- source_word: ἐκβάλετε αὐτὸν
  choice: jetez-le dehors
  rationale: Exprime la force de l’expulsion et rend explicite la direction vers l’extérieur portée par le verbe et le contexte.
- source_word: εἰς τὸ σκότος τὸ ἐξώτερον
  choice: dehors, dans les ténèbres
  rationale: Rend concrètement l’opposition spatiale entre la salle du banquet et l’obscurité extérieure, dans un français plus naturel que « les ténèbres extérieures ».
- source_word: ἐκεῖ
  choice: Là
  rationale: Équivalent locatif direct, bref et naturel.
- source_word: ἔσται
  choice: il y aura
  rationale: Rend simplement et exactement le futur existentiel.
- source_word: ὁ κλαυθμὸς
  choice: des pleurs
  rationale: Expression française courante qui conserve l’idée de lamentation sans l’amplifier.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: des grincements de dents
  rationale: Formulation française consacrée et précise de cette expression de détresse ou de rage.
theological_decisions:
- issue: Nature de l’exclusion figurée dans la parabole
  choice: Conserver l’image concrète d’une expulsion dehors, dans les ténèbres, sans l’identifier explicitement à l’enfer ni la réduire à une simple exclusion sociale.
  alternative: Interpréter explicitement l’image comme l’enfer ou, à l’inverse, comme la seule exclusion du banquet.
  rationale: Le grec présente une image de jugement vive mais ne fournit pas ici cette interprétation doctrinale explicite; la traduction en préserve donc la tension.
translation_notes:
  register: Français moderne international, naturel et digne. L’impératif « Liez » garde une certaine solennité sans archaïsme; « jetez-le dehors, dans les ténèbres » privilégie une formulation idiomatique tout en maintenant l’image spatiale du grec.
