review_pass:
  verdict: revise
  source_fidelity: La traduction rend fidèlement la progression narrative, le roi, les serviteurs, l'ordre des membres (« pieds et mains »), l'expulsion, ainsi que les pleurs et les grincements de dents. Cependant, « dans les ténèbres » ne rend pas l'épithète τὸ ἐξώτερον (« extérieures / du dehors »), qui caractérise précisément les ténèbres dans cette formule matthéenne.
  naturalness: Le français est moderne, clair et d'un registre approprié. « Les ténèbres extérieures » est une formulation naturelle et établie dans le registre biblique moderne; elle conserve mieux la désignation grecque que « dehors, dans les ténèbres ».
  terminology: « Roi », « serviteurs », « liez », « jetez-le dehors », « pleurs » et « grincements de dents » conviennent. Il faut conserver « extérieures » pour préserver l'expression imagée sans lui imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: Omission de « extérieur(es) » dans l'expression désignant les ténèbres.
    rationale: Le grec εἰς τὸ σκότος τὸ ἐξώτερον désigne littéralement « dans les ténèbres extérieures ». « Jetez-le dehors, dans les ténèbres » restitue partiellement le mouvement d'expulsion, mais ne traduit pas explicitement l'épithète et affaiblit la formule récurrente de Matthieu.
  revised_text: 'Alors le roi dit aux serviteurs : « Liez-lui les pieds et les mains, et jetez-le dans les ténèbres extérieures. Là, il y aura des pleurs et des grincements de dents. »'
