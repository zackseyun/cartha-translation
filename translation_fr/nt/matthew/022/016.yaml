id: MAT.22.16
reference: Matthew 22:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρῳδιανῶν ⸀λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ τὴν ὁδὸν τοῦ θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/016.yaml
  text: And they send to him their disciples along with the Herodians[a], saying, “Teacher, we know that you are true and teach the way of God in truth, and you do not care about anyone[b], for you do not look at the face of men.”
translation:
  language: fr
  text: 'Ils lui envoient leurs disciples avec les Hérodiens[a] pour lui dire : « Maître, nous savons que tu es véridique et que tu enseignes le chemin de Dieu conformément à la vérité. Tu ne te laisses influencer par personne, car tu ne considères pas les gens selon leur apparence[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les Hérodiens étaient des partisans de la dynastie d’Hérode.
    reason: historical_context
  - marker: b
    text: Littéralement, « tu ne regardes pas au visage des humains » ; l’expression peut aussi signifier « tu ne fais pas de favoritisme entre les gens » ou « tu ne tiens pas compte de leur rang ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: ils lui envoient
  rationale: Le présent narratif grec est conservé; la place du pronom rend la phrase naturelle en français.
- source_word: τοὺς μαθητὰς αὐτῶν
  choice: leurs disciples
  rationale: « Disciples » est le terme évangélique courant et exprime à la fois l’apprentissage et l’attachement à un maître.
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: avec les hérodiens
  rationale: Cette formulation conserve le nom traditionnel du groupe et l’association exprimée par μετά.
- source_word: λέγοντες
  choice: pour lui dire
  rationale: La tournure infinitive exprime naturellement en français l’action liée à l’envoi, sans changer le contenu du participe grec.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans cette adresse directe, « Maître » est naturel en français et désigne ici celui qui enseigne, sans ajouter un titre doctrinal.
- source_word: ἀληθὴς
  choice: véridique
  rationale: Le mot qualifie la personne comme vraie et digne de foi; « véridique » évite l’étrangeté de « tu es vrai » tout en restant proche du grec.
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: le chemin de Dieu
  rationale: La traduction conserve l’image biblique du chemin, qui peut englober l’enseignement et la manière de vivre voulue par Dieu.
- source_word: ἐν ἀληθείᾳ
  choice: conformément à la vérité
  rationale: Cette expression française communique que l’enseignement est donné en accord avec la vérité, tout en conservant le substantif grec.
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: tu ne te laisses influencer par personne
  rationale: Dans ce contexte, l’expression ne reproche pas à Jésus de manquer d’intérêt pour autrui; elle affirme qu’aucune personne ni aucun statut ne dicte son jugement.
- source_word: οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: car tu ne considères pas les gens selon leur apparence
  rationale: La formulation rend intelligiblement l’idiome du visage, qui évoque l’absence de favoritisme fondé sur l’apparence ou le rang.
- source_word: ἀνθρώπων
  choice: les gens
  rationale: Le pluriel grec désigne ici les êtres humains en général; « les gens » est exact et naturel en français moderne.
theological_decisions:
- issue: Portée de l’affirmation sur l’impartialité de Jésus
  choice: Tu ne te laisses influencer par personne, car tu ne considères pas les gens selon leur apparence.
  alternative: Tu ne te préoccupes de personne, car tu ne regardes pas au visage des humains.
  rationale: Le rendu choisi évite de faire dire que Jésus est indifférent aux personnes. Il exprime la liberté à l’égard des pressions humaines et l’impartialité suggérée par l’idiome grec, tandis que la note conserve sa texture littérale et son éventail de sens.
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif est conservé. Les formulations potentiellement trompeuses d’un calque strict sont rendues idiomatiquement, avec la forme littérale signalée en note.
