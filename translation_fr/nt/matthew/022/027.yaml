base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/027.yaml
  text: Last of all[a], the woman died.
translation:
  language: fr
  text: Après eux tous, la femme mourut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Enfin, la femme mourut » ; grec : « Après tous, la femme mourut ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον … πάντων
  choice: Après eux tous
  rationale: L’expression situe la mort de la femme après celle de tous les frères déjà mentionnés. Cette formulation française rend clairement la succession tout en conservant la référence contextuelle.
- source_word: δὲ
  choice: non rendu séparément
  rationale: δέ est ici un connecteur léger dont la valeur est naturellement intégrée à la progression du récit en français.
- source_word: ἀπέθανεν
  choice: mourut
  rationale: Le passé simple exprime directement l’événement ponctuel rapporté par l’aoriste, sans recourir à un euphémisme.
- source_word: ἡ γυνή
  choice: la femme
  rationale: γυνή peut signifier « femme » ou « épouse ». Dans ce scénario où elle a successivement été mariée à plusieurs frères, « la femme » correspond au référent sans la rattacher au point de vue d’un seul mari.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Après eux tous » est plus explicite et naturel que le calque « après tous », tandis que la note conserve l’alternative idiomatique « enfin » et signale la forme grecque.
