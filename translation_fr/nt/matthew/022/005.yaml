id: MAT.22.5
reference: Matthew 22:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἀμελήσαντες ἀπῆλθον, ⸀ὃς μὲν εἰς τὸν ἴδιον ἀγρόν, ⸁ὃς δὲ ⸀ἐπὶ τὴν ἐμπορίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/005.yaml
  text: But they paid no attention and went away[a], one to his own field, another to his business.
translation:
  language: fr
  text: Mais ils n’en tinrent aucun compte[a] et s’en allèrent, l’un à son propre champ, l’autre à ses affaires.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne s’en soucièrent pas » ou « ils négligèrent l’invitation ».'
    reason: Alternative lexicale pour ἀμελήσαντες et explicitation possible de son objet implicite.
lexical_decisions:
- source_word: ἀμελήσαντες
  choice: ils n’en tinrent aucun compte
  rationale: Le participe exprime l’indifférence ou le fait de négliger quelque chose. Cette tournure française naturelle rend la force désinvolte du verbe tout en laissant le référent être fourni par le contexte.
- source_word: ἀπῆλθον
  choice: s’en allèrent
  rationale: Cette expression rend simplement le départ des invités et convient au mouvement narratif sans registre excessivement soutenu.
- source_word: ὃς μὲν ... ὃς δὲ
  choice: l’un… l’autre
  rationale: Cette construction distributive française correspond naturellement au contraste grec entre les différentes personnes du groupe.
- source_word: εἰς τὸν ἴδιον ἀγρόν
  choice: à son propre champ
  rationale: « Champ » est l’équivalent direct de ἀγρός, et « propre » conserve l’insistance de ἴδιον sur ce qui appartient personnellement à chacun.
- source_word: ἐπὶ τὴν ἐμπορίαν αὐτοῦ
  choice: à ses affaires
  rationale: ἐμπορία désigne une activité commerciale. « Ses affaires » est idiomatique en français moderne et maintient le contraste avec le travail agricole.
theological_decisions:
- issue: Objet implicite de ἀμελήσαντες
  choice: Le pronom « en » renvoie sans l’expliciter davantage à l’invitation ou à l’appel du roi dans le contexte.
  alternative: « Ils négligèrent l’invitation » ou « ils ne s’en soucièrent pas ».
  rationale: Le grec ne formule aucun objet, mais le contexte immédiat le rend évident. Le pronom français permet une phrase naturelle sans introduire d’interprétation doctrinale ni préciser plus que le récit.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le contraste narratif et la formulation concise du grec.
