revisions:
- from: Ces esclaves sortirent donc sur les routes et rassemblèrent tous ceux qu’ils trouvèrent, les mauvais comme les bons[a]. La salle des noces[b] fut remplie de convives allongés pour le repas[c].
  to: Ces esclaves sortirent sur les routes et rassemblèrent tous ceux qu’ils trouvèrent, les méchants comme les bons[a]. La salle des noces[b] fut remplie de convives étendus à table[c].
  rationale: La révision supprime une inférence absente du grec, emploie « méchants » pour rendre plus fidèlement πονηρούς dans son opposition à « bons », et formule la posture de banquet de façon plus exacte. Les notes conservent les alternatives lexicales et l’explicitation culturelle sans modifier le sens du passage.
