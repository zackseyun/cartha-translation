source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ⸀οὓς εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ ⸀γάμος ἀνακειμένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/010.yaml
  text: And those slaves went out into the roads and gathered everyone they found[a], both evil and good[c][b]; and the wedding hall was filled with guests reclining at the table.
translation:
  language: fr
  text: Ces esclaves sortirent sur les routes et rassemblèrent tous ceux qu’ils trouvèrent, les méchants comme les bons[a]. La salle des noces[b] fut remplie de convives étendus à table[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les mauvais comme les bons ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les noces » ; le terme peut désigner ici le banquet de noces ou la salle où il a lieu, puisqu’il est dit qu’elle fut remplie de convives.
    reason: lexical_alternative
  - marker: c
    text: Lors des repas solennels, les convives mangeaient habituellement étendus autour de la table.
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le terme désigne ici des personnes soumises à l’autorité du roi. « Esclaves » préserve leur statut social sans l’atténuer en « serviteurs ».
- source_word: ὁδοὺς
  choice: routes
  rationale: Le pluriel désigne largement les voies publiques où les esclaves peuvent rencontrer des gens; « routes » convient mieux que le terme plus strictement urbain « rues ».
- source_word: συνήγαγον
  choice: rassemblèrent
  rationale: Le verbe signifie réunir ou faire venir ensemble; « rassemblèrent » est direct et naturel dans ce récit.
- source_word: πάντας οὓς εὗρον
  choice: tous ceux qu’ils trouvèrent
  rationale: Cette formulation restitue clairement la portée exhaustive et personnelle de l’expression grecque.
- source_word: πονηρούς τε καὶ ἀγαθούς
  choice: les mauvais comme les bons
  rationale: La formule conserve le contraste moral et souligne que les esclaves n’opèrent aucun tri parmi les personnes trouvées. « Mauvais » laisse aussi ouverte la nuance possible de « méchants ».
- source_word: γάμος
  choice: salle des noces
  rationale: Le mot peut désigner les noces ou le banquet nuptial. Puisqu’il est dit qu’il se remplit de personnes attablées, le contexte évoque ici le lieu du repas; cette explicitation est signalée en note.
- source_word: ἐπλήσθη
  choice: fut remplie
  rationale: Cette tournure rend simplement et fidèlement le passif grec.
- source_word: ἀνακειμένων
  choice: de convives allongés pour le repas
  rationale: Le participe désigne des personnes couchées ou allongées à table selon l’usage des banquets antiques. La formulation explicite qu’il s’agit des invités au repas.
theological_decisions:
- issue: Caractérisation morale des personnes rassemblées
  choice: les mauvais comme les bons
  alternative: les méchants comme les bons
  rationale: Le verset insiste sur l’absence de sélection dans le rassemblement, sans trancher la distinction que la suite de la parabole établira entre la présence au banquet et la réponse appropriée. « Mauvais » maintient le contraste moral sans lui donner une portée doctrinale plus précise que le grec.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Esclaves » préserve la réalité sociale du terme grec; « salle des noces » et « allongés pour le repas » rendent l’image immédiatement intelligible, avec des notes signalant l’explicitation.
