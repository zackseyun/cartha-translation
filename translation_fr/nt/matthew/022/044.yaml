id: MAT.22.44
reference: Matthew 22:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/044.yaml
  text: The Lord said to my Lord[a], ‘Sit at my right hand until I put your enemies under your feet’?”
translation:
  language: fr
  text: '« Le Seigneur a dit à mon Seigneur : “Assieds-toi à ma droite jusqu’à ce que je mette tes ennemis sous tes pieds” » ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριος
  choice: Seigneur
  rationale: Le même titre grec désigne d’abord Dieu, puis celui que David appelle « mon Seigneur ». Employer « Seigneur » dans les deux cas conserve la formulation et la tension du texte grec.
- source_word: Εἶπεν
  choice: a dit
  rationale: L’aoriste de λέγω appelle ici la formulation simple et naturelle « a dit ».
- source_word: τῷ κυρίῳ μου
  choice: à mon Seigneur
  rationale: Le datif indique le destinataire. « Mon Seigneur » préserve le titre κύριος et la relation exprimée par le possessif.
- source_word: Κάθου
  choice: Assieds-toi
  rationale: Cet impératif de κάθημαι est rendu naturellement en français par « Assieds-toi », dans ce contexte d’intronisation.
- source_word: ἐκ δεξιῶν μου
  choice: à ma droite
  rationale: Expression française courante et exacte pour la place d’honneur et d’autorité indiquée par l’idiome grec.
- source_word: ἕως ἂν θῶ
  choice: jusqu’à ce que je mette
  rationale: 'La construction avec ἄν et le subjonctif exprime le terme futur de l’action : « jusqu’à ce que je mette ».'
- source_word: τοὺς ἐχθρούς σου
  choice: tes ennemis
  rationale: Traduction directe, claire et usuelle.
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: sous tes pieds
  rationale: Cette traduction suit directement le texte grec de Matthieu, sans lui substituer l’image du marchepied présente dans la formulation hébraïque du Psaume 110.1.
theological_decisions:
- issue: Les deux emplois de κύριος dans la citation du Psaume 110.1
  choice: Le Seigneur a dit à mon Seigneur
  alternative: L’Éternel a dit à mon Seigneur / Le Seigneur a dit à mon maître
  rationale: Le grec emploie κύριος pour les deux référents. Garder « Seigneur » dans les deux cas respecte cette identité lexicale et préserve l’argument de Jésus sur le statut du Messie. « L’Éternel » expliciterait le nom divin sous-jacent dans l’hébreu, mais cette distinction n’est pas exprimée par le texte grec; « maître » affaiblirait la reprise du même titre.
- issue: Image du marchepied dans le Psaume cité
  choice: sous tes pieds
  alternative: comme un marchepied sous tes pieds
  rationale: Le texte grec attesté de Matthieu dit littéralement « sous tes pieds ». La traduction principale suit donc cette formulation plutôt que d’importer celle de l’hébreu du Psaume.
translation_notes:
  register: Français moderne, digne et oralement naturel. La syntaxe demeure proche de la citation grecque. Les guillemets imbriqués distinguent la citation biblique de la parole citée à l’intérieur; le point d’interrogation appartient à la question de Jésus dans son contexte.
