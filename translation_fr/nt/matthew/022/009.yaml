id: MAT.22.9
reference: Matthew 22:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ⸀ἐὰν εὕρητε καλέσατε εἰς τοὺς γάμους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/009.yaml
  text: Therefore go to the street intersections[b][a], and invite to the wedding feast as many as you find.
translation:
  language: fr
  text: Allez donc aux carrefours des routes[a] et invitez au repas de noces[b] tous ceux que vous trouverez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux croisements » ou « aux débouchés des routes » ; le grec désigne des endroits où les routes se séparent ou se rencontrent.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « aux noces » ; dans ce contexte, cette expression désigne la célébration ou le banquet de noces.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορεύεσθε
  choice: Allez
  rationale: L’impératif présent a ici une valeur directive simple. « Allez » est naturel, direct et fidèle au commandement.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence de l’ordre précédent. « Donc » exprime clairement ce lien logique en français courant.
- source_word: ἐπὶ τὰς διεξόδους τῶν ὁδῶν
  choice: aux carrefours des routes
  rationale: Le groupe désigne des endroits où les routes débouchent, se séparent ou se rencontrent. « Aux carrefours des routes » offre un équivalent français clair sans préciser indûment la configuration exacte.
- source_word: ὅσους ἐὰν εὕρητε
  choice: tous ceux que vous trouverez
  rationale: La construction exprime à la fois l’indétermination et l’ampleur de l’invitation. Cette formulation française restitue naturellement l’idée d’inviter toutes les personnes rencontrées.
- source_word: καλέσατε
  choice: invitez
  rationale: Dans le contexte d’un banquet, καλέω signifie inviter plutôt que simplement appeler ou convoquer.
- source_word: εἰς τοὺς γάμους
  choice: au repas de noces
  rationale: Le pluriel grec désigne ici la célébration nuptiale, en particulier le banquet, et non plusieurs mariages. « Repas de noces » rend ce sens clairement et naturellement.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le lien logique marqué par « donc », l’ampleur indéfinie de l’invitation et l’image publique des lieux où les routes se rejoignent ou se séparent.
