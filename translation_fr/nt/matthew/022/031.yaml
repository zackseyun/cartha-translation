source:
  edition: SBLGNT
  text: περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ θεοῦ λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/031.yaml
  text: Concerning the resurrection of the dead[a], have you not read what was spoken to you by God, saying,
translation:
  language: fr
  text: 'Quant à la résurrection des morts, n’avez-vous pas lu ce qui vous a été dit par Dieu :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ
  choice: Quant à
  rationale: περί avec le génitif introduit le sujet, tandis que δέ marque une transition. « Quant à » rend naturellement les deux fonctions sans ajouter une opposition forte ni une valeur temporelle.
- source_word: τῆς ἀναστάσεως τῶν νεκρῶν
  choice: la résurrection des morts
  rationale: Cette formulation directe conserve le génitif grec et désigne les morts comme ceux qui ressuscitent.
- source_word: οὐκ ἀνέγνωτε
  choice: n’avez-vous pas lu
  rationale: Le passé composé convient à cette question rhétorique portant sur la connaissance durable des Écritures par les interlocuteurs.
- source_word: τὸ ῥηθὲν ὑμῖν
  choice: ce qui vous a été dit
  rationale: Le participe substantivé passif est rendu clairement, et le datif ὑμῖν demeure le destinataire de la parole.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: par Dieu
  rationale: ὑπό avec le génitif exprime explicitement l’agent de la parole.
- source_word: λέγοντος
  choice: ':'
  rationale: 'En français, les deux-points introduisent naturellement la citation qui suit et remplissent ici la fonction discursive du participe « disant », sans la tournure lourde « disant : ».'
theological_decisions:
- issue: Dieu comme auteur et l’Écriture comme parole adressée aux auditeurs
  choice: « ce qui vous a été dit par Dieu »
  alternative: « ce que Dieu vous a dit »
  rationale: La formulation retenue conserve la voix passive du grec, l’agent divin explicite et le fait que cette parole scripturaire s’adresse aux interlocuteurs de Jésus, sans développer une théorie de l’inspiration étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Quant à » marque sobrement le changement de sujet. La ponctuation finale suppose que la citation se poursuit au verset suivant.
