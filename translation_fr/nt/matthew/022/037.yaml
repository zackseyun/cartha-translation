source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἔφη αὐτῷ· Ἀγαπήσεις κύριον τὸν θεόν σου ἐν ὅλῃ ⸀τῇ καρδίᾳ σου καὶ ἐν ὅλῃ ⸁τῇ ψυχῇ σου καὶ ἐν ὅλῃ τῇ διανοίᾳ σου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/037.yaml
  text: And he said to him[c][b][a], “You shall love the Lord your God with all your heart and with all your soul and with all your mind.”
translation:
  language: fr
  text: 'Il lui dit : « Tu aimeras le Seigneur ton Dieu de tout ton cœur[a], de toute ton âme[b] et de toute ta pensée[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, la préposition grecque peut se rendre par « dans tout ton cœur »; « de tout ton cœur » est l’expression naturelle en français. Il en va de même pour les deux expressions suivantes.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « âme » peut aussi désigner la vie ou la personne elle-même.
    reason: lexical_alternative
  - marker: c
    text: Ou « intelligence » ou « compréhension ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, δέ est une particule de liaison légère qui fait avancer le dialogue. En français moderne, l’enchaînement est naturel sans « et » ni « mais ».
- source_word: ἔφη
  choice: dit
  rationale: Le verbe φημί introduit simplement une parole directe. « Dit » n’ajoute pas la nuance interprétative de « répondit ».
- source_word: Ἀγαπήσεις
  choice: Tu aimeras
  rationale: Le futur de l’indicatif reprend la formulation du commandement de Deutéronome et possède ici une force prescriptive. « Tu aimeras » en conserve à la fois la forme et la solennité.
- source_word: κύριον τὸν θεόν σου
  choice: le Seigneur ton Dieu
  rationale: Cette formulation française naturelle conserve le titre « Seigneur » et la résonance scripturaire de la citation.
- source_word: ἐν ὅλῃ
  choice: de tout / de toute
  rationale: Dans cette construction, « de tout ton cœur » est l’expression française consacrée et idiomatique de la totalité de l’engagement, bien que ἐν signifie formellement « dans ».
- source_word: καρδίᾳ
  choice: cœur
  rationale: « Cœur » désigne ici l’être intérieur, notamment les dispositions, les affections et la volonté, sans réduire le terme à l’émotion.
- source_word: ψυχῇ
  choice: âme
  rationale: « Âme » préserve le terme distinct de la triade et sa formulation biblique, tout en laissant ouverte la portée plus large de ψυχή comme vie ou personne.
- source_word: διανοίᾳ
  choice: pensée
  rationale: « Pensée » exprime naturellement la faculté de réfléchir et de comprendre. « Intelligence » reste une traduction possible.
theological_decisions:
- issue: Formulation de la citation du grand commandement
  choice: Conserver la triade « cœur… âme… pensée »
  alternative: Fondre les trois termes dans une paraphrase globale, ou rendre διάνοια par « intelligence »
  rationale: La distinction entre καρδία, ψυχή et διάνοια appartient au texte grec. La traduction la maintient sans imposer une anthropologie technique ni définir ces termes comme des parties strictement séparées de la personne.
- issue: Force du futur Ἀγαπήσεις
  choice: « Tu aimeras »
  alternative: « Aime » ou « Tu dois aimer »
  rationale: Le futur français reproduit la forme de la citation et sa force de commandement sans ajouter une modalité étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste concise et conserve la solennité d’une citation scripturaire. Le tutoiement correspond au singulier grec et à l’adresse individuelle du commandement.
