id: MAT.22.28
reference: Matthew 22:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν τῇ ⸂ἀναστάσει οὖν⸃ τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/028.yaml
  text: In the resurrection[a], then, whose wife of the seven will she be? For they all had her.
translation:
  language: fr
  text: À la résurrection, duquel des sept sera-t-elle donc la femme ? En effet, ils l’ont tous épousée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car ils l’ont tous eue ».'
    reason: La note conserve la tournure concise de ἔσχον αὐτήν, tandis que le texte principal en explicite le sens matrimonial naturel en français.
lexical_decisions:
- source_word: ἀναστάσει
  choice: à la résurrection
  rationale: Avec ἐν, le datif situe la question dans le cadre de la résurrection future. « Résurrection » est le terme français naturel et précis dans la controverse avec les sadducéens.
- source_word: οὖν
  choice: donc
  rationale: Le mot marque la conséquence tirée du cas présenté; « donc » conserve clairement ce lien argumentatif dans la question.
- source_word: τίνος τῶν ἑπτὰ
  choice: duquel des sept
  rationale: Le génitif interrogatif demande à quel homme, parmi les sept frères, elle appartiendra comme épouse. Cette formulation reste proche de la structure grecque tout en étant correcte en français.
- source_word: γυνή
  choice: la femme
  rationale: Dans ce contexte matrimonial, γυνή signifie « épouse » ou « femme » au sens conjugal. La construction « être la femme de » est naturelle et restitue directement la question.
- source_word: γὰρ
  choice: en effet
  rationale: γάρ introduit la justification de la question. « En effet » conserve cette valeur explicative dans un registre français actuel et digne.
- source_word: πάντες ἔσχον αὐτήν
  choice: ils l’ont tous épousée
  rationale: Littéralement, le grec dit qu’ils « l’ont tous eue ». Dans le récit, il s’agit sans ambiguïté du fait que chacun l’a eue pour épouse; « épousée » exprime naturellement ce sens en français, tandis qu’une note signale la formulation plus littérale.
theological_decisions:
- issue: Sens de ἀνάστασις dans la question des sadducéens
  choice: La résurrection future des morts
  alternative: Une survie vague après la mort
  rationale: Le contexte porte précisément sur la résurrection contestée par les sadducéens. La traduction « à la résurrection » maintient cette affirmation concrète sans la développer ni l’atténuer.
- issue: Nature successive des unions matrimoniales
  choice: Chacun des sept frères l’a épousée
  alternative: Les sept l’auraient possédée simultanément ou dans un sens seulement sexuel
  rationale: Le contexte immédiat décrit des mariages successifs selon la coutume évoquée. « Ils l’ont tous épousée » transmet ce référent contextuel sans introduire de conclusion sur la condition matrimoniale après la résurrection.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des mots garde l’accent de la question sur l’identité du mari parmi les sept. « En effet » évite le « car » littéraire en tête d’une phrase autonome, et « épousée » prévient l’ambiguïté ou la connotation possessive que pourrait avoir « l’ont eue » sans contexte explicatif.
