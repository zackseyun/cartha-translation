  verdict: approve
  source_fidelity: Le texte rend correctement la structure et le sens de ἐν τῇ ἀναστάσει οὖν, τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν. « À la résurrection » désigne bien la résurrection future en contexte. « Duquel des sept sera-t-elle donc la femme ? » restitue la question sur l’identité de l’époux parmi les sept. « Ils l’ont tous épousée » explicite de manière légitime le sens matrimonial contextuel de ἔσχον αὐτήν, et la note préserve la formulation littérale.
  naturalness: Le français est moderne, clair et d’un registre biblique sobre. L’ordre des mots dans la question est légèrement soutenu, mais il est pleinement idiomatique et conserve l’accent interrogatif de l’original. « En effet » introduit naturellement l’explication en français contemporain.
  terminology: « Résurrection » et « femme » sont appropriés dans ce contexte. « Femme » signifie naturellement « épouse » dans la construction « être la femme de ». Le choix de « épousée » dans le texte, accompagné d’une note sur « eue », évite une connotation possessive inutile tout en maintenant la transparence lexicale.
