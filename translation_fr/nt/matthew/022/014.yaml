  variant: modern international French
source:
  edition: SBLGNT
  text: πολλοὶ γάρ εἰσιν κλητοὶ ὀλίγοι δὲ ἐκλεκτοί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/014.yaml
  text: For many are called[b][a], but few are chosen.
translation:
  language: fr
  text: Car beaucoup sont appelés[a], mais peu sont choisis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « invités » ; dans ce contexte, le mot peut évoquer une invitation à un banquet.
    reason: lexical_alternative
  - marker: b
    text: Ou « élus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: beaucoup
  rationale: L’adjectif grec est employé comme substantif et s’oppose directement à ὀλίγοι. « Beaucoup » restitue cette formulation concise et proverbiale.
- source_word: γάρ
  choice: car
  rationale: La conjonction introduit l’explication ou le fondement de ce qui précède. « Car » en conserve clairement la valeur logique.
- source_word: εἰσιν
  choice: sont
  rationale: Il s’agit du présent simple du verbe εἰμί ; « sont » en est l’équivalent direct.
- source_word: κλητοὶ
  choice: appelés
  rationale: Le terme peut signifier « appelés » ou, dans le cadre d’un banquet, « invités ». « Appelés » préserve à la fois le sens lexical général et la tension avec ἐκλεκτοί ; la nuance contextuelle « invités » est signalée en note.
- source_word: ὀλίγοι
  choice: peu
  rationale: « Peu » forme en français le pendant naturel et concis de « beaucoup ».
- source_word: δὲ
  choice: mais
  rationale: La particule marque ici un contraste net entre les deux membres de la phrase.
- source_word: ἐκλεκτοί
  choice: choisis
  rationale: « Choisis » exprime directement le sens de l’adjectif grec sans imposer dans le texte principal le terme théologique plus spécialisé « élus », qui reste indiqué en note.
theological_decisions:
- issue: Traduction de ἐκλεκτοί dans un passage associé aux débats sur l’élection
  choice: choisis
  alternative: élus
  rationale: Les deux rendus sont lexicalement possibles. « Choisis » conserve le sens transparent du grec et la tension théologique sans faire trancher la traduction en faveur d’une formulation doctrinale plus spécialisée ; « élus » est conservé en note.
- issue: Traduction de κλητοί à la conclusion de la parabole du banquet
  choice: appelés
  alternative: invités
  rationale: « Invités » convient particulièrement à l’image du banquet, mais « appelés » préserve la portée plus large du terme et son contraste traditionnel avec « choisis ». La note maintient ouverte la lecture contextuelle.
translation_notes:
  register: Français international moderne, concis et digne. La structure équilibrée de la maxime grecque est conservée, ainsi que son opposition entre « beaucoup » et « peu », puis entre « appelés » et « choisis ».
