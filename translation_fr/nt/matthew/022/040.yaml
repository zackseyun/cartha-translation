  text: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος ⸂κρέμαται καὶ οἱ προφῆται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/040.yaml
  text: On these two commandments hang the whole Law and the Prophets[a][b].
translation:
  language: fr
  text: Toute la Loi et les Prophètes dépendent de ces deux commandements[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « En ces deux commandements sont suspendus toute la Loi et les Prophètes. » Le grec emploie la préposition ἐν (« en / dans ») avec l’image de ce qui est suspendu.'
    reason: lexical_alternative
  - marker: b
    text: « La Loi et les Prophètes » est une manière de désigner l’ensemble du témoignage des Écritures.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν ταύταις ταῖς δυσὶν ἐντολαῖς
  choice: De ces deux commandements
  rationale: Avec κρέμαται, le français exprime naturellement le rapport d’appui ou de dépendance par « dépendre de ». Cette formulation rend le sens de ἐν dans la métaphore sans reproduire mécaniquement la préposition grecque.
- source_word: ὅλος ὁ νόμος
  choice: toute la Loi
  rationale: ὅλος souligne ici la totalité. « Toute la Loi » est une formulation française naturelle; la majuscule signale que « la Loi » désigne la Torah, et non la loi au sens abstrait.
- source_word: κρέμαται
  choice: dépendent
  rationale: Le verbe signifie littéralement « être suspendu, pendre ». « Dépendent » restitue en français courant la relation exprimée par cette image, tout en évitant l’expression peu naturelle « sont suspendus à » dans ce contexte.
- source_word: καὶ οἱ προφῆται
  choice: et les Prophètes
  rationale: L’expression appartient à la formule consacrée « la Loi et les Prophètes », qui renvoie aux Écritures. La majuscule indique cette portée littéraire et canonique.
theological_decisions:
- issue: Portée de la formule « la Loi et les Prophètes »
  choice: Conserver la formule comme référence globale au témoignage des Écritures, présenté comme dépendant des deux commandements précédents
  alternative: Y voir seulement l’enseignement moral contenu dans les textes juridiques et prophétiques
  rationale: Chez Matthieu, « la Loi et les Prophètes » constitue une formule reconnue pour désigner les Écritures ou l’ensemble de leur enseignement. La traduction la conserve sans la remplacer par une paraphrase qui trancherait davantage.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « dépendent de » est immédiatement compréhensible, tandis que la note conserve l’image concrète du grec. La formule traditionnelle « la Loi et les Prophètes » est maintenue.
