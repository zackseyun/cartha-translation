  text: εἰ οὖν Δαυὶδ καλεῖ αὐτὸν κύριον, πῶς υἱὸς αὐτοῦ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/045.yaml
  text: If[a], then, David calls him Lord, how is he his son?
translation:
  language: fr
  text: Si donc David l’appelle « Seigneur », comment est-il son fils ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en explicitant le contexte : « Si donc David appelle le Messie “Seigneur”, comment est-il son fils ? »'
    reason: Explicite le référent contextuel du pronom sans l’ajouter au texte principal.
lexical_decisions:
- source_word: εἰ οὖν
  choice: Si donc
  rationale: Conserve à la fois la valeur conditionnelle de εἰ et la progression argumentative de οὖν, dans une formulation française naturelle et digne.
- source_word: Δαυὶδ
  choice: David
  rationale: Forme française standard du nom propre biblique.
- source_word: καλεῖ
  choice: appelle
  rationale: Rend directement le sens de « appeler, nommer » et maintient la valeur prédicative de « Seigneur ».
- source_word: αὐτὸν
  choice: l’
  rationale: Pronom objet renvoyant au référent établi par le contexte précédent, sans ajouter explicitement « le Messie » au texte principal.
- source_word: κύριον
  choice: « Seigneur »
  rationale: Préserve le titre honorifique et sa portée christologique dans l’écho au Psaume 110. Les guillemets signalent le titre attribué par David.
- source_word: πῶς
  choice: comment
  rationale: Introduit naturellement en français la question portant sur la relation logique entre la seigneurie et la filiation davidique.
- source_word: υἱὸς αὐτοῦ
  choice: son fils
  rationale: Conserve l’expression familiale et royale du grec ainsi que la tension du raisonnement, sans l’élargir en « descendant ».
- source_word: ἐστιν
  choice: est-il
  rationale: Rend simplement la copule au présent dans la forme interrogative française.
theological_decisions:
- issue: Portée messianique et christologique du fait que David l’appelle « Seigneur »
  choice: Maintenir « Seigneur » et « son fils » sans résoudre leur tension dans le texte principal.
  alternative: « Si donc David appelle le Messie “Seigneur”, comment le Messie est-il son fils ? »
  rationale: Le grec emploie un pronom dont le référent vient du contexte. L’ajout de « le Messie » clarifierait ce référent, mais expliciterait dans le texte principal ce que ce verset ne répète pas. La formulation retenue préserve ensemble la filiation davidique et la seigneurie supérieure sans imposer d’explication doctrinale.
translation_notes:
  register: Français international moderne, clair et soutenu. L’inversion « comment est-il » convient à une question rhétorique digne. « Si donc » garde la structure argumentative du grec; la note explicite seulement le référent contextuel.
