  text: Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/036.yaml
  text: Teacher[a], which commandment is greatest in the Law?
translation:
  language: fr
  text: Maître, quel est le plus grand commandement de la Loi[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « quel commandement est grand dans la Loi ? »'
    reason: La formulation grecque emploie l’adjectif positif « grand », et non une forme superlative explicite.
lexical_decisions:
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Vocatif employé pour s’adresser à Jésus en tant qu’enseignant. « Maître » est la forme d’adresse française naturelle et consacrée dans ce contexte, sans imposer ici le sens de « Seigneur ».
- source_word: ποία
  choice: quel
  rationale: L’adjectif interrogatif demande d’identifier un commandement parmi ceux de la Loi.
- source_word: ἐντολὴ
  choice: commandement
  rationale: Dans ce contexte scripturaire et juridique juif, « commandement » restitue précisément ἐντολή et son lien avec la Loi de Moïse.
- source_word: μεγάλη
  choice: le plus grand
  rationale: Bien que le grec emploie formellement l’adjectif positif « grand », la question a ici une valeur de classement. Le superlatif est la formulation française naturelle; la forme plus littérale est signalée en note.
- source_word: ἐν τῷ νόμῳ
  choice: de la Loi
  rationale: L’expression désigne la Loi juive, c’est-à-dire la Torah. En français, « le plus grand commandement de la Loi » exprime naturellement l’appartenance au corpus concerné; la majuscule précise le référent scripturaire.
theological_decisions:
- issue: Faut-il rendre μεγάλη par un positif ou par un superlatif ?
  choice: le plus grand
  alternative: grand
  rationale: Le grec présente l’adjectif positif μεγάλη, ce qui permet une traduction formelle par « grand ». Toutefois, dans cette interrogation portant sur le rang des commandements, le français demande naturellement « le plus grand ». La note conserve la forme grecque et son éventuelle nuance.
translation_notes:
  register: Français international moderne, naturel et digne. « Maître » fonctionne comme titre d’adresse à un enseignant; « Loi » porte une majuscule parce qu’il s’agit ici de la Loi de Moïse.
