  text: καὶ ἀκούσαντες ἐθαύμασαν, καὶ ἀφέντες αὐτὸν ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/022.yaml
  text: And hearing this[a], they were amazed, and leaving him, they went away.
translation:
  language: fr
  text: Après avoir entendu cela, ils furent étonnés et, le laissant, s’en allèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Après avoir entendu cela
  rationale: Le participe aoriste actif exprime ici une action antérieure à celle du verbe principal. « Cela » explicite naturellement en français l’objet sous-entendu, à savoir la réponse de Jésus.
- source_word: ἐθαύμασαν
  choice: ils furent dans l’étonnement
  rationale: Le verbe θαυμάζω exprime l’étonnement admiratif ou la stupeur. Cette formulation moderne conserve la nuance sans imposer une appréciation favorable.
- source_word: ἀφέντες αὐτὸν
  choice: ils le laissèrent
  rationale: Dans ce contexte, ἀφίημι indique qu’ils quittent Jésus. La traduction reste directe et n’ajoute pas l’idée non exprimée de le laisser seul.
- source_word: ἀπῆλθαν
  choice: s’en allèrent
  rationale: ἀπέρχομαι désigne le fait de partir ou de s’éloigner. « S’en allèrent » convient au registre narratif et rend clairement le mouvement de départ.
- source_word: καὶ ... καὶ
  choice: Puis ... et
  rationale: Le premier καί relance la succession narrative après la réaction des interlocuteurs; « Puis » rend naturellement cette progression en français, tandis que « et » conserve la coordination finale.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et narratif. La construction grecque participiale est déployée en propositions successives pour une lecture naturelle, sans modifier l’ordre des événements.
