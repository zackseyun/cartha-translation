  text: And when the crowds heard it[a], they were astonished at his teaching.
translation:
  language: fr
  text: Et après avoir entendu cela[a], les foules étaient stupéfaites de son enseignement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant entendu »; plus littéralement, « après avoir entendu ». « Cela » n’est pas exprimé en grec et est fourni par le contexte.
    reason: Précise la valeur temporelle du participe et signale que son objet est implicite dans le grec.
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve le lien narratif simple avec l’échange précédent.
- source_word: ἀκούσαντες
  choice: en entendant cela
  rationale: Le participe aoriste actif, qui se rapporte aux foules, est rendu par une construction temporelle naturelle en français. « Cela » explicite l’objet sous-entendu, à savoir la réponse précédente de Jésus.
- source_word: οἱ ὄχλοι
  choice: les foules
  rationale: Le pluriel grec est conservé; « les foules » est naturel en français moderne dans ce contexte narratif.
- source_word: ἐξεπλήσσοντο
  choice: étaient stupéfaites
  rationale: L’imparfait grec décrit leur vive réaction; l’imparfait français en préserve l’aspect sans atténuer la force du verbe.
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: de son enseignement
  rationale: La préposition ἐπί avec le datif indique ici ce qui provoque l’étonnement. « Son enseignement » rend διδαχή sans la nuance plus technique de « doctrine ».
