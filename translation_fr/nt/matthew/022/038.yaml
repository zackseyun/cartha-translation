  yaml_path: translation/nt/matthew/022/038.yaml
  text: This is the great and first commandment[a].
translation:
  language: fr
  text: C’est le grand et premier commandement[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est le commandement primordial. » Le grec comporte plus littéralement deux qualificatifs : « le grand et premier commandement ».'
    reason: Alternative lexicale permettant de signaler une formulation française plus fluide tout en explicitant la structure du grec.
lexical_decisions:
- source_word: αὕτη
  choice: C’est
  rationale: Le démonstratif renvoie au commandement cité au verset 37. La tournure « C’est » est naturelle en français et conserve cette reprise anaphorique.
- source_word: ἐστὶν
  choice: est
  rationale: La copule au présent se rend directement par « est ».
- source_word: μεγάλη
  choice: grand
  rationale: L’adjectif exprime ici l’importance ou le rang. « Grand » respecte la forme positive sans la transformer en superlatif.
- source_word: πρώτη
  choice: premier
  rationale: Dans ce contexte de classement des commandements, « premier » rend directement l’idée de primauté et maintient un adjectif distinct de « grand ».
- source_word: ἐντολή
  choice: commandement
  rationale: « Commandement » convient au contexte biblique et juridique et maintient le lien avec la discussion sur la Loi.
theological_decisions:
- issue: Rapport entre μεγάλη et πρώτη dans la description du commandement
  choice: 'Conserver les deux adjectifs coordonnés : « le grand et premier commandement »'
  alternative: « le plus grand commandement » ou « le commandement primordial »
  rationale: Le grec emploie deux adjectifs positifs coordonnés, μεγάλη et πρώτη. Les rendre séparément préserve la tension entre grandeur et primauté sans les fondre dans un unique superlatif interprétatif.
translation_notes:
  register: Français international moderne, simple et digne. La formulation principale reste volontairement proche de la coordination grecque, malgré son caractère légèrement marqué en français.
