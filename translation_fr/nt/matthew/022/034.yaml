  text: Οἱ δὲ Φαρισαῖοι ἀκούσαντες ὅτι ἐφίμωσεν τοὺς Σαδδουκαίους συνήχθησαν ἐπὶ τὸ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/034.yaml
  text: But when the Pharisees heard that he had silenced the Sadducees[a], they gathered together.
translation:
  language: fr
  text: Mais les Pharisiens, ayant appris qu’il avait réduit les Sadducéens au silence[a], se rassemblèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « avait muselé les Sadducéens ». Le verbe grec peut signifier « museler »; il est employé ici au sens figuré pour dire qu’il les avait réduits au silence dans le débat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque une transition avec une légère valeur contrastive par rapport à l’échange précédent.
- source_word: Φαρισαῖοι
  choice: les Pharisiens
  rationale: Désignation française traditionnelle et immédiatement reconnaissable de ce groupe juif.
- source_word: ἀκούσαντες
  choice: ayant appris
  rationale: Le participe aoriste exprime ici une circonstance antérieure; « apprendre » convient naturellement lorsqu’une nouvelle parvient au groupe.
- source_word: ἐφίμωσεν
  choice: avait réduit ... au silence
  rationale: Rend le sens figuré du verbe dans un débat, tout en signalant en note son image littérale, « museler ».
- source_word: Σαδδουκαίους
  choice: les Sadducéens
  rationale: Désignation française traditionnelle de ce groupe juif.
- source_word: συνήχθησαν
  choice: se rassemblèrent
  rationale: Rend naturellement en français la valeur intransitive du passif grec dans ce contexte.
- source_word: ἐπὶ τὸ αὐτό
  choice: se rassemblèrent
  rationale: L’idée de réunion exprimée par la locution est intégrée au verbe français; ajouter « ensemble » serait redondant.
