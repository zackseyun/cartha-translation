id: MAT.22.46
reference: Matthew 22:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ⸂ἀποκριθῆναι αὐτῷ⸃ λόγον, οὐδὲ ἐτόλμησέν τις ἀπ’ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/046.yaml
  text: And no one was able to answer him a word[a], nor did anyone dare from that day on to question him any longer.
translation:
  language: fr
  text: Et personne ne pouvait lui répondre un mot[a] ; depuis ce jour-là, personne n’osa plus l’interroger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui répondre un seul mot ». L’expression grecque dit littéralement : « lui répondre un mot ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: personne
  rationale: Le pronom négatif exclut toute personne ; « personne » est l’équivalent français naturel et direct.
- source_word: ἐδύνατο
  choice: ne pouvait
  rationale: L’imparfait de δύναμαι exprime ici l’incapacité dans la scène racontée ; l’imparfait français en conserve l’aspect sans alourdir la phrase.
- source_word: ἀποκριθῆναι αὐτῷ λόγον
  choice: lui répondre un mot
  rationale: Cette formulation conserve la présence explicite de λόγον et l’expression grecque emphatique, tout en restant intelligible en français. La note signale la possibilité de rendre le sens par « un seul mot ».
- source_word: οὐδὲ
  choice: ; depuis ce jour-là, personne ne…
  rationale: La seconde négation coordonnée est rendue naturellement en français par une nouvelle proposition négative ; le point-virgule maintient son lien étroit avec la première.
- source_word: ἐτόλμησέν τις
  choice: personne n’osa
  rationale: L’aoriste de τολμάω indique que nul ne se risqua à agir ; « n’osa » est concis, courant et fidèle.
- source_word: ἀπ’ ἐκείνης τῆς ἡμέρας
  choice: depuis ce jour-là
  rationale: La locution marque le point de départ d’une situation qui se prolonge ; « depuis ce jour-là » exprime clairement cette continuité.
- source_word: ἐπερωτῆσαι
  choice: l’interroger
  rationale: Dans ce contexte de controverse, le verbe désigne le fait d’adresser à Jésus des questions susceptibles de le mettre à l’épreuve. « Interroger » conserve cette nuance mieux que le plus neutre « demander », sans imposer l’idée formelle d’un interrogatoire.
- source_word: οὐκέτι
  choice: ne… plus
  rationale: La négation française discontinue rend naturellement la cessation exprimée par οὐκέτι à partir du moment indiqué.
theological_decisions:
- issue: Portée narrative du silence des interlocuteurs après la réponse de Jésus
  choice: Présenter sobrement leur incapacité à répondre et le fait qu’ils n’osèrent plus l’interroger.
  alternative: Expliciter dans la traduction la supériorité de la sagesse ou de l’autorité de Jésus.
  rationale: Le contexte fait ressortir la victoire de Jésus dans la controverse, mais ce verset affirme directement seulement que personne ne pouvait lui répondre et que personne n’osa plus l’interroger. La formulation évite d’ajouter une conclusion théologique au récit.
translation_notes:
  register: Français international moderne, sobre et digne. « Lui répondre un mot » conserve volontairement l’expression grecque, légèrement marquée mais claire ; la note donne la formulation française plus explicite. Le point-virgule évite une coordination lourde tout en maintenant l’unité des deux constats.
