  text: Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/015.yaml
  text: Then the Pharisees went and took counsel how they might trap him in his words[a].
translation:
  language: fr
  text: Alors les pharisiens allèrent se concerter sur la manière de le prendre au piège par ses paroles[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « complotèrent pour le prendre au piège par ce qu’il dirait ».'
    reason: 'Variante lexicale et syntaxique : « complotèrent » explicite l’hostilité de la délibération, et « par ce qu’il dirait » développe la relation instrumentale de ἐν λόγῳ.'
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession narrative exprimée par l’adverbe temporel grec.
- source_word: πορευθέντες
  choice: allèrent
  rationale: Le participe aoriste antérieur au verbe principal s’intègre naturellement à la narration française sous la forme d’un verbe conjugué.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française courante de ce groupe; la minuscule convient aux noms de groupes religieux en français moderne.
- source_word: συμβούλιον ἔλαβον
  choice: se concerter
  rationale: Rend l’idée de délibérer ensemble et de former un plan, sans ajouter à cette expression seule une hostilité déjà explicitée par le but poursuivi.
- source_word: ὅπως
  choice: sur la manière de
  rationale: Introduit ici à la fois le contenu de la délibération et son but; cette tournure est idiomatique après « se concerter ».
- source_word: αὐτὸν
  choice: le
  rationale: Pronom objet renvoyant à Jésus, conformément au contexte.
- source_word: παγιδεύσωσιν
  choice: prendre au piège
  rationale: Conserve clairement et naturellement en français l’image d’un piège contenue dans le verbe grec.
- source_word: ἐν λόγῳ
  choice: dans ses paroles
  rationale: λόγος désigne ici la parole ou le discours. La tournure française exprime qu’ils veulent exploiter ce que Jésus dira, tout en gardant l’image d’être pris dans ses propres paroles.
theological_decisions:
- issue: Degré d’hostilité exprimé par συμβούλιον ἔλαβον
  choice: Employer la formulation relativement neutre « se concerter » et laisser « prendre au piège » exprimer l’intention hostile.
  alternative: Traduire plus explicitement par « complotèrent ».
  rationale: Le projet malveillant est indéniable, mais il est porté explicitement par la proposition de but. Une formulation neutre pour la délibération évite de charger deux fois le texte tout en préservant pleinement son sens.
- issue: Relation exprimée par ἐν λόγῳ
  choice: « dans ses paroles », qui maintient l’image d’un piège lié à la parole de Jésus.
  alternative: « par ce qu’il dirait », formulation plus explicite et dynamique.
  rationale: Le grec est concis et peut désigner la parole comme domaine ou moyen du piège. La traduction principale conserve cette densité sans résoudre plus précisément la relation.
translation_notes:
  register: Français international moderne, clair et digne. « Allèrent se concerter » préserve le mouvement du participe grec et le caractère collectif de la délibération; « prendre au piège » est courant sans être familier.
