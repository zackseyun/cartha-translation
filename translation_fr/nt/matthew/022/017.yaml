  text: εἰπὸν οὖν ἡμῖν τί σοι δοκεῖ· ἔξεστιν δοῦναι κῆνσον Καίσαρι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/017.yaml
  text: Tell us, then, what do you think? Is it lawful to give the poll tax to Caesar, or not?
translation:
  language: fr
  text: 'Dis-nous donc ce que tu en penses : est-il permis de payer l’impôt par tête à César, ou non ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί σοι δοκεῖ
  choice: ce que tu en penses
  rationale: Rend naturellement la demande d’avis personnel tout en conservant le tutoiement singulier adressé à Jésus.
- source_word: ἔξεστιν
  choice: est-il permis
  rationale: Exprime la question de légitimité ou de conformité à la loi sans préciser artificiellement s’il s’agit uniquement de la loi romaine ou de la loi religieuse.
- source_word: δοῦναι
  choice: donner
  rationale: Conserve le verbe grec, plus littéral que « payer », ainsi que la formulation chargée de la question.
- source_word: κῆνσον
  choice: l’impôt
  rationale: Désigne ici le tribut romain imposé aux personnes; « impôt » est clair en français moderne, tandis que « capitation » serait plus technique.
- source_word: Καίσαρι
  choice: à César
  rationale: Conserve le titre impérial traditionnel et la construction avec le destinataire.
theological_decisions:
- issue: Nature de ce qui est « permis »
  choice: Maintenir la formulation ouverte « est-il permis »
  alternative: « La Loi permet-elle » ou « est-ce légal »
  rationale: Le grec ne nomme pas explicitement la norme en cause; la traduction préserve donc l’ambiguïté entre légitimité religieuse et légalité politique.
- issue: Verbe employé pour l’impôt
  choice: « donner l’impôt »
  alternative: « payer l’impôt »
  rationale: « Donner » suit δοῦναι et préserve la nuance rhétorique du texte sans interpréter davantage l’obligation fiscale.
translation_notes:
  register: Français international moderne, direct et digne. La ponctuation relie naturellement la demande d’avis à la question posée. Aucun terme technique n’est nécessaire dans le corps du verset.
