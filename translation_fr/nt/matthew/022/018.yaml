id: MAT.22.18
reference: Matthew 22:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπεν· Τί με πειράζετε, ὑποκριταί;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/018.yaml
  text: But Jesus[a], knowing their evil intent, said, “Why are you testing me[b], hypocrites?”
translation:
  language: fr
  text: 'Mais Jésus, connaissant leur malveillance[a], leur dit : « Pourquoi me mettez-vous à l’épreuve[b], hypocrites ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur méchanceté », « leur malice » ou « leurs mauvaises intentions ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Pourquoi me tentez-vous ? » Le verbe grec peut signifier « mettre à l’épreuve », « éprouver » ou « tenter », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: connaissant
  rationale: Le participe aoriste de γινώσκω exprime ici la connaissance que Jésus a de leur disposition avant de parler. « Connaissant » reste proche de la forme grecque tout en étant naturel en français.
- source_word: δὲ
  choice: Mais
  rationale: 'δέ marque une transition légèrement adversative : Jésus répond à leur démarche trompeuse. « Mais » rend clairement ce contraste.'
- source_word: πονηρίαν
  choice: mauvaises intentions
  rationale: πονηρία peut désigner la méchanceté, la malignité ou une intention mauvaise. Dans ce contexte de question-piège, le pluriel français « mauvaises intentions » exprime naturellement le mobile hostile sans réduire le mot à une qualité abstraite.
- source_word: εἶπεν
  choice: leur dit
  rationale: Le verbe λέγω à l’aoriste est rendu par la formule narrative courante « dit ». Le pronom « leur » explicite naturellement en français les destinataires déjà indiqués par le contexte.
- source_word: Τί
  choice: Pourquoi
  rationale: Dans cette construction interrogative, τί a le sens idiomatique de « pourquoi ».
- source_word: πειράζετε
  choice: mettez-vous à l’épreuve
  rationale: πειράζω peut signifier mettre à l’épreuve, éprouver ou tenter. Ici, les interlocuteurs cherchent à piéger Jésus ; « mettre à l’épreuve » conserve la portée du verbe sans imposer exclusivement l’idée de tentation morale.
- source_word: ὑποκριταί
  choice: hypocrites
  rationale: « Hypocrites » est l’équivalent français établi et exact pour ceux qui affichent une sincérité qu’ils n’ont pas.
theological_decisions:
- issue: La connaissance par Jésus du mobile intérieur de ses adversaires
  choice: Jésus est présenté comme connaissant leurs mauvaises intentions.
  alternative: Jésus perçoit leur méchanceté ou connaît leur malignité.
  rationale: Le texte affirme que Jésus discerne exactement le caractère mauvais de leur démarche, sans développer ici une affirmation doctrinale plus large sur la nature ou l’étendue de sa connaissance.
- issue: La portée de πειράζω dans la question de Jésus
  choice: « mettre à l’épreuve »
  alternative: « tenter »
  rationale: Le contexte décrit une tentative de prendre Jésus au piège. La traduction retenue préserve cette dimension d’épreuve hostile, tandis qu’une note maintient l’autre valeur lexicale possible.
translation_notes:
  register: Français international moderne, digne et directement intelligible. La syntaxe conserve le mouvement du grec tout en évitant une formulation artificielle. « Mauvaises intentions » et « mettre à l’épreuve » rendent le contexte du piège sans effacer les autres possibilités lexicales, signalées en notes.
