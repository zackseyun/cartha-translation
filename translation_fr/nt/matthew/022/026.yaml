  text: Likewise also the second and the third[a], up to the seven.
translation:
  language: fr
  text: Il en fut de même pour le deuxième et le troisième, et ainsi de suite jusqu’aux sept[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « jusqu’aux sept »; c’est-à-dire jusqu’à l’ensemble des sept.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: Il en fut de même
  rationale: Cette tournure française naturelle reprend clairement ce qui est arrivé au premier frère dans le verset précédent et marque que la même chose s’est produite ensuite.
- source_word: καὶ ὁ δεύτερος καὶ ὁ τρίτος
  choice: pour le deuxième, puis pour le troisième
  rationale: Les ordinaux grecs sont substantivés. Le français conserve cette ellipse sans ajouter « frère », tandis que « puis » rend naturellement la succession exprimée par les conjonctions répétées.
- source_word: ἕως τῶν ἑπτά
  choice: et ainsi jusqu’au septième
  rationale: Dans ce contexte, l’expression indique que la même suite d’événements s’est poursuivie à travers les sept frères. « Jusqu’au septième » est la formulation française la plus naturelle; la note signale la forme plus littérale du grec.
