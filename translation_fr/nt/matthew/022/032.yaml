  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ; οὐκ ἔστιν ⸂ὁ θεὸς⸃ νεκρῶν ἀλλὰ ζώντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/022/032.yaml
  text: I am the God of Abraham and the God of Isaac and the God of Jacob. He is not the God of the dead[a], but of the living.
translation:
  language: fr
  text: Je suis le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob. Dieu n’est pas le Dieu des morts, mais celui des vivants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Je suis
  rationale: Cette identification directe au présent respecte la forme grecque et conserve le temps verbal sur lequel repose l’argument de Jésus.
- source_word: ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: le Dieu d’Abraham, le Dieu d’Isaac et le Dieu de Jacob
  rationale: La répétition de « le Dieu de » conserve le relief rhétorique du grec, tandis que la coordination suit l’usage naturel du français moderne.
- source_word: οὐκ ἔστιν ὁ θεὸς
  choice: Dieu n’est pas le Dieu
  rationale: Le grec nomme explicitement Dieu comme sujet. La répétition reste claire et naturelle en français et évite de remplacer sans nécessité le nom par un pronom.
- source_word: νεκρῶν
  choice: des morts
  rationale: L’adjectif pluriel substantivé désigne les personnes mortes; « les morts » est l’équivalent français concis et naturel.
- source_word: ζώντων
  choice: des vivants
  rationale: Le participe présent substantivé s’oppose directement aux morts. « Les vivants » préserve cette antithèse concise.
theological_decisions:
- issue: Portée de l’argument concernant la vie des patriarches devant Dieu et la résurrection
  choice: Traduire l’affirmation sans expliciter davantage la manière dont les patriarches sont vivants.
  alternative: Dieu n’est pas le Dieu des morts, mais de ceux qui vivent encore pour lui.
  rationale: Le contexte relie cette déclaration à l’argument de Jésus sur la résurrection, mais le verset ne précise pas ici l’état intermédiaire ni la manière exacte de cette vie. La traduction conserve donc la tension théologique sans ajouter d’explication doctrinale.
translation_notes:
  register: Français moderne, digne et accessible. La répétition de « Dieu » et de « le Dieu de » est volontaire afin de préserver la force du texte grec; « celui des vivants » complète naturellement en français le contraste elliptique du grec.
