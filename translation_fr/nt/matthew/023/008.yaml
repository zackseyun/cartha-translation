id: MAT.23.8
reference: Matthew 23:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ μὴ κληθῆτε· Ῥαββί, εἷς γάρ ἐστιν ὑμῶν ὁ ⸀διδάσκαλος, πάντες δὲ ὑμεῖς ἀδελφοί ἐστε·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/008.yaml
  text: But you are not to be called ‘Rabbi,’ for one is your teacher[b][a], and you are all brothers.
translation:
  language: fr
  text: Mais vous, ne vous faites pas appeler « Rabbi »[a], car un seul est votre maître, et vous êtes tous frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Maître ». Le titre sémitique « Rabbi », translittéré dans le grec, désigne un enseignant ; sa translittération conserve toutefois le cadre juif et évite de le confondre avec le mot « maître » qui suit dans le verset.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « frères » est un pluriel masculin. Dans ce contexte, il peut désigner collectivement les autres disciples.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ κληθῆτε
  choice: ne vous faites pas appeler
  rationale: Cette tournure française exprime naturellement l’interdiction portée par μή avec le subjonctif passif aoriste, tout en conservant l’idée de recevoir ou d’accepter une appellation.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: La translittération conserve le titre présent dans le texte grec ainsi que son cadre juif, sans le confondre avec διδάσκαλος dans la proposition suivante.
- source_word: εἷς
  choice: un seul
  rationale: En français, « un seul » rend clairement la singularité emphatique de εἷς dans cette construction, sans développer davantage la portée de l’affirmation.
- source_word: ὑμῶν ὁ διδάσκαλος
  choice: votre maître
  rationale: « Votre maître » exprime naturellement la relation indiquée par le génitif ὑμῶν. « Maître » convient ici au rôle d’enseignement et permet de distinguer ce nom du titre « Rabbi ».
- source_word: πάντες δὲ ὑμεῖς
  choice: vous êtes tous
  rationale: 'Cette formulation idiomatique maintient l’accent collectif : chacun des disciples partage le même statut.'
- source_word: ἀδελφοί
  choice: frères
  rationale: « Frères » conserve le pluriel masculin du grec et la métaphore familiale. Une note précise qu’en contexte le terme peut désigner collectivement les autres disciples.
theological_decisions:
- issue: L’interdiction vise-t-elle absolument tout titre humain, ou plus précisément la recherche d’un statut dans la communauté des disciples ?
  choice: Conserver l’interdiction directe sans en élargir ni en restreindre explicitement l’application.
  alternative: Formuler soit une interdiction absolue de tout titre analogue, soit une critique limitée à l’ambition hypocrite.
  rationale: Le grec énonce une interdiction et la justifie par l’unicité du maître et la fraternité des disciples, mais il ne précise pas ici toutes les applications ultérieures. La traduction laisse donc subsister cette tension interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « Mais vous » conserve le contraste initial ; « ne vous faites pas appeler » est idiomatique sans atténuer la prohibition. « Un seul est votre maître » garde une légère solennité et suit de près la structure emphatique du grec.
