  text: καὶ ὑμεῖς πληρώσατε τὸ μέτρον τῶν πατέρων ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/032.yaml
  text: And you[a], fill up the measure of your fathers.
translation:
  language: fr
  text: Et vous, comblez la mesure de vos pères.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « portez à son comble la mesure des péchés de vos pères ». Le grec dit littéralement « comblez la mesure de vos pères » : c’est l’image d’une culpabilité qui s’accumule jusqu’à atteindre sa limite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve la coordination grecque et la continuité rhétorique avec la dénonciation précédente.
- source_word: ὑμεῖς
  choice: vous
  rationale: Le pronom explicite porte une emphase en grec; sa présence après « Et » la maintient naturellement en français.
- source_word: πληρώσατε
  choice: comblez
  rationale: Impératif aoriste actif, deuxième personne du pluriel. « Comblez » conserve à la fois l'ordre et l'image d'une mesure amenée à son plein niveau.
- source_word: τὸ μέτρον
  choice: la mesure
  rationale: Traduction directe qui préserve la métaphore d'une quantité accumulée atteignant sa limite sans expliciter dans le texte principal qu'il s'agit de culpabilité.
- source_word: τῶν πατέρων ὑμῶν
  choice: de vos pères
  rationale: Conserve le terme source et le lien rhétorique avec les pères évoqués dans le contexte; « ancêtres » serait plus explicite, mais moins littéral.
theological_decisions:
- issue: 'Valeur de la parole de Jésus : ordre impératif ou prédiction ironique'
  choice: 'Impératif à portée ironique et judiciaire : « comblez la mesure de vos pères »'
  alternative: « vous comblez » ou « vous comblerez la mesure de vos pères »
  rationale: La forme πληρώσατε est un impératif aoriste actif à la deuxième personne du pluriel. La traduction garde donc la forme grammaticale de l'ordre tout en laissant au contexte sa force de dénonciation ironique, plutôt que de la réduire à une prédiction.
translation_notes:
  register: Français moderne, digne et direct. « Comblez la mesure » est une tournure métaphorique légèrement soutenue, choisie pour préserver l'image grecque; la note en explicite le sens contextuel sans l'imposer au texte principal.
