id: MAT.23.19
reference: Matthew 23:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀τυφλοί, τί γὰρ μεῖζον, τὸ δῶρον ἢ τὸ θυσιαστήριον τὸ ἁγιάζον τὸ δῶρον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/019.yaml
  text: Blind men[a], for which is greater[b], the gift or the altar that sanctifies the gift?
translation:
  language: fr
  text: 'Aveugles ! En effet, qu’est-ce qui est le plus grand : l’offrande[a] ou l’autel qui la sanctifie[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le don ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui la rend sainte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοί
  choice: Aveugles !
  rationale: Adjectif masculin pluriel employé comme nom dans une apostrophe directe. « Aveugles ! » est naturel en français et conserve la vigueur du reproche sans ajouter « insensés », absent du texte grec de ce verset.
- source_word: τί γὰρ μεῖζον
  choice: En effet, qu’est-ce qui est le plus grand
  rationale: « En effet » rend la valeur explicative de γάρ, tandis que la question comparative conserve le sens direct de μεῖζον sans le réduire à « plus important ».
- source_word: τὸ δῶρον
  choice: l’offrande
  rationale: Dans le contexte du Temple et de l’autel, « offrande » exprime naturellement la valeur cultuelle de δῶρον. Le sens plus littéral « don » est signalé en note.
- source_word: θυσιαστήριον
  choice: l’autel
  rationale: Équivalent français courant et précis du terme cultuel θυσιαστήριον.
- source_word: τὸ ἁγιάζον
  choice: qui la sanctifie
  rationale: Le présent « sanctifie » préserve le vocabulaire de la sainteté et la relation affirmée entre l’autel et l’offrande. Le pronom « la » évite une répétition lourde sans ambiguïté.
theological_decisions:
- issue: Le rôle de l’autel dans la sanctification de l’offrande
  choice: l’autel qui la sanctifie
  alternative: l’autel qui la rend sainte
  rationale: « Sanctifie » maintient la portée cultuelle et théologique de ἁγιάζω sans expliquer davantage le mécanisme ni atténuer l’affirmation du texte.
translation_notes:
  register: Français moderne, international et digne. L’apostrophe brève « Aveugles ! » garde la force rhétorique de l’original. « Offrande » rend immédiatement clair le cadre du culte, tandis que la note conserve le sens lexical littéral.
