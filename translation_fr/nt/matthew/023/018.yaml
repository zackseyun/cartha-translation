  - severity: medium
    issue: « il est engagé » pour ὀφείλει
    rationale: Cette expression peut évoquer le fait d’avoir pris un engagement plutôt que le fait d’être tenu par une obligation. « Il est tenu » rend plus directement la force obligationnelle, tout en gardant l’objet non exprimé.
  - severity: low
    issue: « qui est dessus »
    rationale: La formulation est possible, mais « qui est sur l’autel » est plus idiomatique et identifie explicitement l’antécédent imposé par le grec (l’autel).
