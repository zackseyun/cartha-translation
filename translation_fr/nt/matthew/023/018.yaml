reference: Matthew 23:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καί· Ὃς ⸀ἂν ὀμόσῃ ἐν τῷ θυσιαστηρίῳ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ δώρῳ τῷ ἐπάνω αὐτοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/018.yaml
  text: And[a], ‘Whoever swears by the altar, it is nothing[b]; but whoever swears by the gift on top of it is obligated.’
translation:
  language: fr
  text: 'Et : « Si quelqu’un jure par l’autel, cela ne compte pas[a] ; mais si quelqu’un jure par le don[b] qui est sur l’autel, il est tenu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Selon l’enseignement que Jésus condamne ici, un serment fait par l’autel « ne compte pas », tandis qu’un serment fait par le don placé sur l’autel est considéré comme contraignant.
    reason: cultural_note
  - marker: b
    text: Ou « l’offrande ». Le mot grec peut désigner un don présenté à Dieu dans le temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: Et encore
  rationale: Introduit un nouvel élément dans la série des enseignements cités et condamnés. Cette formulation rend naturellement en français la valeur connective et additive de καί.
- source_word: Ὃς ἂν ... ὀμόσῃ / ὃς δ’ ἂν ... ὀμόσῃ
  choice: Si quelqu’un jure… mais si quelqu’un jure
  rationale: La construction ὅς + ἄν avec le subjonctif aoriste exprime un cas général indéfini. « Si quelqu’un » est idiomatique en français et en conserve la portée générale.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: par l’autel
  rationale: Avec le verbe « jurer », ἐν désigne ici ce par quoi l’on jure ; « jurer par » est la tournure française naturelle.
- source_word: θυσιαστήριον
  choice: autel
  rationale: Équivalent français précis et usuel pour l’autel sacrificiel dans le contexte du temple.
- source_word: οὐδέν ἐστιν
  choice: cela ne compte pas
  rationale: Rend le sens pragmatique de l’affirmation selon laquelle ce serment serait sans valeur, tout en évitant le calque peu naturel « ce n’est rien ».
- source_word: ἐν τῷ δώρῳ
  choice: par le don
  rationale: δῶρον désigne littéralement un don et, dans ce contexte cultuel, un don présenté à Dieu ; la note signale l’équivalent contextuel « offrande ».
- source_word: τῷ ἐπάνω αὐτοῦ
  choice: qui est dessus
  rationale: Exprime simplement la position du don sur l’autel, auquel renvoie αὐτοῦ.
- source_word: ὀφείλει
  choice: il est engagé
  rationale: Dans le contexte d’un serment, le verbe indique que la personne est tenue par une obligation. « Il est engagé » est naturel en français et conserve l’absence de complément explicite dans le grec.
theological_decisions:
- issue: Objet implicite de l’obligation créée par le serment
  choice: il est engagé
  alternative: il est tenu de respecter son serment
  rationale: Le grec n’exprime pas l’objet de l’obligation. La traduction principale garde cette concision et n’ajoute pas explicitement ce que la personne doit accomplir, même si le contexte montre qu’il s’agit du serment.
translation_notes:
  register: Français international moderne, clair et digne. « Cela ne compte pas » rend l’idée sans lourdeur littérale ; « il est engagé » conserve la brièveté et l’objet implicite du texte grec.
