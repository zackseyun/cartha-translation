revisions:
- from: 'Et encore : « Si quelqu’un jure par l’autel, cela ne compte pas[a] ; mais si quelqu’un jure par le don[b] qui est dessus, il est engagé. »'
  to: 'Et : « Si quelqu’un jure par l’autel, cela ne compte pas[a] ; mais si quelqu’un jure par le don[b] qui est sur l’autel, il est tenu. »'
  rationale: La révision retire l’ajout interprétatif léger « encore », emploie une formulation plus précise pour l’obligation implicite, et rend plus naturellement la position du don sur l’autel. Elle conserve la concision et l’ambiguïté de l’objet de ὀφείλει, sans ajouter « respecter son serment » ou une formulation doctrinalement plus explicite.
