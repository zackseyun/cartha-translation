id: MAT.23.20
reference: Matthew 23:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ οὖν ὀμόσας ἐν τῷ θυσιαστηρίῳ ὀμνύει ἐν αὐτῷ καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/020.yaml
  text: Therefore[a], the one who swears by the altar swears by it and by everything on it.
translation:
  language: fr
  text: Donc, celui qui jure par l’autel jure par l’autel et par tout ce qui est sur l’autel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὖν ὀμόσας
  choice: Ainsi, celui qui jure
  rationale: Le participe aoriste substantivé a une portée générale. En français, le présent exprime naturellement cette vérité générale, tandis que « ainsi » rend la conclusion introduite par οὖν.
- source_word: ἐν τῷ θυσιαστηρίῳ
  choice: par l’autel
  rationale: Avec ὀμνύω, ἐν introduit ici ce par quoi l’on jure; « par » est la formulation idiomatique française.
- source_word: ὀμνύει
  choice: jure
  rationale: Le présent français restitue la portée générale de l’énoncé et conserve la répétition du verbe.
- source_word: ἐν αὐτῷ
  choice: par l’autel
  rationale: Le pronom renvoie à l’autel. La répétition du nom lève sans lourdeur l’ambiguïté possible du pronom français « lui » et maintient la formule de serment.
- source_word: καὶ ἐν πᾶσι τοῖς ἐπάνω αὐτοῦ
  choice: et par tout ce qui est dessus
  rationale: La formulation conserve la portée générale de πᾶσι et le rapport spatial de ἐπάνω, sans réduire l’expression aux seuls dons ou sacrifices.
theological_decisions:
- issue: Référent de « tout ce qui est dessus »
  choice: Référence générale à tout ce qui se trouve sur l’autel
  alternative: toutes les offrandes qui sont dessus
  rationale: Le contexte évoque le don placé sur l’autel, mais le grec de ce verset emploie une expression plus large. La traduction ne la restreint donc pas aux offrandes.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « l’autel » est retenue pour éviter l’expression potentiellement équivoque « jure par lui ». « Dessus » est ici un adverbe renvoyant explicitement à l’autel.
