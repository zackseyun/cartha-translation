id: MAT.23.16
reference: Matthew 23:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, ὁδηγοὶ τυφλοὶ οἱ λέγοντες· Ὃς ἂν ὀμόσῃ ἐν τῷ ναῷ, οὐδέν ἐστιν, ὃς δ’ ἂν ὀμόσῃ ἐν τῷ χρυσῷ τοῦ ναοῦ ὀφείλει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/016.yaml
  text: Woe to you[a], blind guides, who say, ‘Whoever swears by the temple, it is nothing[b]; but whoever swears by the gold of the temple is bound.’
translation:
  language: fr
  text: 'Malheur à vous, guides aveugles, qui dites : « Si quelqu’un jure par le sanctuaire, cela ne compte pas[a] ; mais s’il jure par l’or du sanctuaire, il est tenu par son serment. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cela n’est rien » ; autrement dit, ce serment est considéré comme non contraignant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Malheur à vous
  rationale: Formule française traditionnelle et toujours intelligible qui conserve la force prophétique de dénonciation et de jugement.
- source_word: ὁδηγοὶ τυφλοὶ
  choice: guides aveugles
  rationale: Rend directement la métaphore de personnes qui prétendent en conduire d’autres tout en étant elles-mêmes aveugles.
- source_word: οἱ λέγοντες
  choice: qui dites
  rationale: Le participe grec substantivé est naturellement rendu par une proposition relative en français.
- source_word: Ὃς ἂν ὀμόσῃ
  choice: Si quelqu’un jure
  rationale: La relative indéfinie avec ἄν et le subjonctif exprime un cas général ; cette tournure est naturelle en français et se prête au parallélisme des deux propositions.
- source_word: ἐν τῷ ναῷ
  choice: par le sanctuaire
  rationale: Dans cette formule de serment, ἐν désigne ce qui est invoqué. « Par » exprime cet usage en français ; « sanctuaire » distingue précisément le ναός du complexe du Temple.
- source_word: οὐδέν ἐστιν
  choice: cela ne compte pas
  rationale: Cette formulation française restitue l’ellipse grecque « cela n’est rien » en indiquant naturellement que le serment est tenu pour sans effet, sans développer davantage l’implication.
- source_word: χρυσῷ τοῦ ναοῦ
  choice: l’or du sanctuaire
  rationale: Rend simplement le génitif et maintient l’opposition entre le sanctuaire et son or.
- source_word: ὀφείλει
  choice: il est tenu par son serment
  rationale: Le verbe signifie être redevable ou obligé. Le contexte des serments permet d’expliciter en français l’obligation sous-entendue, tout en conservant la force juridique et morale de l’expression.
theological_decisions:
- issue: Caractère obligatoire des serments dans les deux propositions elliptiques
  choice: La première ellipse est rendue par « cela ne compte pas », et la seconde par « il est tenu par son serment ».
  alternative: 'Traduire plus littéralement : « ce n’est rien… il est redevable », ou conserver « cela n’est rien » avec une note explicative.'
  rationale: Le propos dénonce une distinction casuistique entre serments prétendument non contraignants et contraignants. La formulation choisie rend ce contraste compréhensible sans ajouter de conclusion doctrinale sur les serments en général.
- issue: Sens de ναός
  choice: sanctuaire
  alternative: Temple
  rationale: ναός vise plus précisément le sanctuaire que l’ensemble du site du Temple ; ce choix préserve la précision lexicale et le contraste avec l’or qui lui appartient.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formule « Malheur à vous » conserve la solennité prophétique. « Sanctuaire » traduit précisément ναός, tandis que le discours direct reste fluide et immédiatement compréhensible.
