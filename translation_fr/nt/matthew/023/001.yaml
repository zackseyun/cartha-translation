  text: Τότε ὁ Ἰησοῦς ἐλάλησεν τοῖς ὄχλοις καὶ τοῖς μαθηταῖς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/001.yaml
  text: Then Jesus spoke to the crowds and to his disciples,
translation:
  language: fr
  text: 'Alors Jésus parla aux foules et à ses disciples :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: L’adverbe temporel marque la progression du récit. « Alors » est naturel en français et conserve la transition narrative concise du grec.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: L’article devant le nom propre relève de l’usage narratif grec et ne se traduit pas en français courant.
- source_word: ἐλάλησεν
  choice: parla
  rationale: L’aoriste de λαλέω désigne ici simplement l’acte de parler. « Parla » reste proche du grec sans ajouter l’idée plus précise de s’adresser solennellement à quelqu’un.
- source_word: τοῖς ὄχλοις
  choice: aux foules
  rationale: Le pluriel grec est conservé. « Foules » est moderne et plus exact que le singulier collectif possible.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux groupes auxquels Jésus parle.
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: à ses disciples
  rationale: Cette formulation rend naturellement en français le datif pluriel accompagné du génitif possessif. « Disciples » est l’équivalent usuel et précis de μαθηταί dans les Évangiles.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. Le passé simple convient au registre narratif biblique écrit sans être archaïque. Les deux groupes destinataires et le pluriel de « foules » sont maintenus. Les deux-points signalent naturellement que les paroles rapportées commencent au verset suivant.
