id: MAT.23.15
reference: Matthew 23:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι περιάγετε τὴν θάλασσαν καὶ τὴν ξηρὰν ποιῆσαι ἕνα προσήλυτον, καὶ ὅταν γένηται ποιεῖτε αὐτὸν υἱὸν γεέννης διπλότερον ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/015.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! Because you travel over sea and land to make one convert, and when he becomes one[b], you make him twice as much a son of Gehenna as yourselves.
translation:
  language: fr
  text: Malheur à vous, scribes et pharisiens, hypocrites ! Car vous parcourez mer et terre pour faire un seul converti[a] et, quand il le devient, vous en faites un fils de la géhenne[b], deux fois plus fils de la géhenne que vous ne l’êtes vous-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prosélyte ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « un fils de l’enfer » ; grec : « un fils de la géhenne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ
  choice: Malheur à vous
  rationale: Conserve la force de dénonciation prophétique de οὐαί, plutôt que de l’atténuer en simple lamentation.
- source_word: γραμματεῖς
  choice: scribes
  rationale: Désigne avec précision le groupe de spécialistes religieux et juridiques auquel Jésus s’adresse, sans remplacer ce titre historique par une explication interprétative.
- source_word: Φαρισαῖοι
  choice: pharisiens
  rationale: Dénomination française courante de ce mouvement juif.
- source_word: ὑποκριταί
  choice: hypocrites
  rationale: Équivalent français établi qui exprime ici la discordance entre l’apparence religieuse et la réalité.
- source_word: περιάγετε τὴν θάλασσαν καὶ τὴν ξηράν
  choice: vous parcourez mer et terre
  rationale: Formulation française naturelle qui rend l’idée d’efforts et de déplacements considérables dans les deux domaines évoqués.
- source_word: ποιῆσαι ἕνα προσήλυτον
  choice: pour faire un seul converti
  rationale: « Converti » est immédiatement compréhensible en français moderne; le terme historique plus proche du grec, « prosélyte », est signalé en note.
- source_word: ὅταν γένηται
  choice: lorsqu’il l’est devenu
  rationale: Reprend naturellement en français le fait de devenir converti, tout en conservant le singulier masculin du grec.
- source_word: υἱὸν γεέννης
  choice: un fils de la géhenne
  rationale: Préserve à la fois le terme géhenne et l’expression sémitique « fils de », sans les réduire silencieusement à une paraphrase théologique.
- source_word: διπλότερον ὑμῶν
  choice: deux fois plus que vous-mêmes
  rationale: Rend directement la comparaison du grec et maintient son caractère saisissant, sans ajouter un qualificatif absent tel que « pire ».
theological_decisions:
- issue: Traduction de γεέννα
  choice: géhenne
  alternative: enfer
  rationale: Le grec emploie le terme géhenne, chargé d’un arrière-plan juif historique et eschatologique. Le conserver évite de l’assimiler sans explication à toutes les acceptions françaises du mot « enfer ».
- issue: Expression υἱὸν γεέννης
  choice: fils de la géhenne
  alternative: voué à la géhenne
  rationale: La traduction formelle conserve l’image relationnelle sémitique du texte. La paraphrase exprimerait une interprétation plausible, mais supprimerait l’image originale.
- issue: Référence masculine singulière après προσήλυτον
  choice: un seul converti… lorsqu’il l’est devenu… de lui
  alternative: une seule personne convertie… lorsque cette personne l’est devenue
  rationale: Le grec présente un référent masculin singulier. Le français retenu le reproduit naturellement, sans faire de déclaration sur le sexe de toutes les personnes susceptibles d’être converties.
translation_notes:
  register: Français international moderne, direct et solennel. Les titres historiques « scribes » et « pharisiens » sont conservés. La syntaxe finale maintient la comparaison abrupte du grec plutôt que d’ajouter « pire », absent du texte source.
