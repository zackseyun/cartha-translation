  text: καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ καλεῖσθαι ὑπὸ τῶν ἀνθρώπων· ⸀Ῥαββί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/007.yaml
  text: and greetings in the marketplaces, and to be called by men, ‘Rabbi.’
translation:
  language: fr
  text: les salutations sur les places publiques et le fait d’être appelés « Rabbi » par les gens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμούς
  choice: salutations
  rationale: Le terme désigne ici les marques publiques de salutation ou d’hommage recherchées par les personnages religieux.
- source_word: ἀγοραῖς
  choice: places publiques
  rationale: L’agora était le lieu public central de la vie sociale et commerciale; « places publiques » est naturel et historiquement adéquat.
- source_word: ὑπὸ τῶν ἀνθρώπων
  choice: par les gens
  rationale: Dans ce contexte générique, ἄνθρωποι désigne les personnes en général, non spécifiquement les hommes de sexe masculin.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Conserve le titre sémitique présent dans le grec, connu en français et repris dans l’explication du verset 8.
theological_decisions:
- issue: Portée du titre « Rabbi »
  choice: Conserver « Rabbi » sans explicitation dans le corps du verset.
  alternative: Traduire par « Maître » ou « mon maître ».
  rationale: La translittération préserve le titre historique et son lien verbal avec le verset suivant, sans interpréter au-delà du texte.
translation_notes:
  register: Fragment coordonné à Matthew 23:6; formulation française moderne et digne. L’article défini de l’expression grecque est rendu naturellement sans suggérer qu’ils recherchaient toutes les salutations indistinctement.
