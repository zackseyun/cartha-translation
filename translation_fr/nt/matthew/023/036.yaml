id: MAT.23.36
reference: Matthew 23:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ⸀ἥξει ⸂ταῦτα πάντα⸃ ἐπὶ τὴν γενεὰν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/036.yaml
  text: Truly I say to you[b][a], all these things will come upon this generation.
translation:
  language: fr
  text: En vérité, je vous le dis, toutes ces choses[a] viendront sur cette génération[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « tout cela ». Le grec emploie le pluriel : « toutes ces choses ».'
    reason: lexical_alternative
  - marker: b
    text: 'Certains comprennent aussi « cette génération » au sens de « ces gens » ou d’une catégorie plus large de personnes incrédules, mais le grec se lit le plus directement : « cette génération ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν
  choice: En vérité
  rationale: Dans la formule synoptique ἀμὴν λέγω ὑμῖν, ἀμήν introduit solennellement une déclaration faisant autorité. « En vérité » en restitue la force dans un français actuel et digne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure française naturelle conserve la solennité de la formule grecque. Le pronom « le » est idiomatique en français et renvoie à la déclaration qui suit.
- source_word: ἥξει
  choice: viendront
  rationale: Le futur de ἥκω exprime ici la venue des réalités ou conséquences annoncées. En français, l’accord au pluriel est requis avec « toutes ces choses », même si le grec emploie un verbe au singulier avec un sujet neutre pluriel.
- source_word: ταῦτα πάντα
  choice: toutes ces choses
  rationale: Le démonstratif neutre pluriel accompagné de πᾶς renvoie à l’ensemble des réalités évoquées dans le contexte précédent. Cette traduction conserve explicitement le pluriel grec, tout en signalant en note l’équivalent français plus idiomatique « tout cela ».
- source_word: ἐπὶ
  choice: sur
  rationale: Avec l’accusatif, ἐπί peut exprimer ce qui vient sur quelqu’un. « Sur » préserve l’image et la tonalité judiciaire sans renforcer le texte par « contre ».
- source_word: γενεὰν ταύτην
  choice: cette génération
  rationale: « Cette génération » est l’équivalent lexical le plus direct. Il maintient la portée temporelle possible du grec sans imposer une interprétation eschatologique particulière.
theological_decisions:
- issue: Référent de « cette génération » (γενεὰν ταύτην)
  choice: Traduire directement par « cette génération », sans explicitation interprétative.
  alternative: « ces gens », une catégorie plus large de personnes incrédules, le peuple juif à travers le temps, ou l’époque présente
  rationale: Le grec désigne le plus directement « cette génération », mais la portée exacte de l’expression fait l’objet de lectures différentes. La traduction conserve donc la formulation et la tension du texte au lieu de trancher selon un système théologique.
translation_notes:
  register: Français international moderne, clair et digne. La cadence solennelle de la parole est conservée par « En vérité, je vous le dis ». « Viendront sur » maintient l’image grecque et la tonalité de jugement, malgré son caractère légèrement plus soutenu que « arriveront à ».
