id: MAT.23.28
reference: Matthew 23:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς ἔξωθεν μὲν φαίνεσθε τοῖς ἀνθρώποις δίκαιοι, ἔσωθεν δέ ⸂ἐστε μεστοὶ⸃ ὑποκρίσεως καὶ ἀνομίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/028.yaml
  text: In the same way[a], you also outwardly appear righteous to people, but inwardly you are full of hypocrisy and lawlessness.
translation:
  language: fr
  text: De même, vous aussi, extérieurement, vous paraissez justes aux yeux des gens, mais intérieurement, vous êtes pleins d’hypocrisie et de mépris de la loi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: De même
  rationale: Cette expression relie naturellement le verset à la comparaison précédente avec les tombeaux blanchis et en conserve la force comparative.
- source_word: ἔξωθεν … ἔσωθεν
  choice: extérieurement … intérieurement
  rationale: Ce couple symétrique préserve clairement l’opposition entre l’apparence visible et la réalité intérieure.
- source_word: φαίνεσθε
  choice: vous paraissez
  rationale: Le verbe décrit l’impression donnée aux observateurs sans affirmer que la justice soit réelle.
- source_word: τοῖς ἀνθρώποις
  choice: aux yeux des gens
  rationale: Cette formulation française exprime naturellement le datif de référence et emploie un terme générique pour les êtres humains.
- source_word: δίκαιοι
  choice: justes
  rationale: Dans ce contexte moral et religieux, « justes » est le terme français biblique courant, tandis que « paraissez » indique qu’il s’agit d’une apparence.
- source_word: μεστοὶ
  choice: pleins de
  rationale: Équivalent direct et idiomatique de l’adjectif grec signifiant « remplis, pleins ».
- source_word: ὑποκρίσεως
  choice: hypocrisie
  rationale: Le mot désigne ici la duplicité entre la présentation extérieure et la réalité intérieure.
- source_word: ἀνομίας
  choice: mépris de la loi
  rationale: Cette expression conserve le rapport étymologique et conceptuel à la loi tout en étant plus naturelle et explicite en français moderne que « illégalité » ou « non-respect de la loi ».
theological_decisions:
- issue: La justice est-elle réelle ou seulement apparente ?
  choice: Une justice apparente aux yeux des autres
  alternative: Une justice morale réelle
  rationale: Le verbe « paraissez » et l’opposition avec l’hypocrisie et le mépris de la loi à l’intérieur indiquent que Jésus dénonce une apparence, et non une justice authentique.
- issue: Portée de ἀνομία
  choice: mépris de la loi
  alternative: iniquité / mal
  rationale: Le choix retenu préserve la référence à la loi sans réduire le terme au seul statut juridique ni préciser au-delà du grec la manière exacte dont cette loi est transgressée.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation souligne l’opposition extérieurement/intérieurement. Aucun marqueur de note n’est nécessaire puisque « gens » rend déjà naturellement le caractère générique de ἀνθρώποις.
