  source_fidelity: 'Le texte rend fidèlement tous les éléments du grec : οὕτως est correctement relié à la comparaison précédente par « De même » ; le contraste ἔξωθεν/ἔσωθεν est conservé ; « vous paraissez » exprime bien l’apparence impliquée par φαίνεσθε ; et « aux yeux des gens » restitue naturellement le datif de référence τοῖς ἀνθρώποις. « Pleins d’hypocrisie et de mépris de la loi » correspond adéquatement à μεστοὶ ὑποκρίσεως καὶ ἀνομίας. « Mépris de la loi » explicite de manière acceptable la nuance de refus ou de transgression de la loi portée par ἀνομία, sans identifier indûment une loi ou une application particulière.'
  naturalness: Le français est fluide, moderne et d’un registre biblique digne sans archaïsme. La symétrie « extérieurement… intérieurement » est claire et naturelle. Les virgules après ces adverbes sont facultatives mais ne gênent ni la lecture ni le sens.
  terminology: « Justes », « hypocrisie » et « mépris de la loi » sont cohérents avec le registre et le sens contextuel. « Gens » est générique et naturel en français international ; aucune note n’est requise pour signaler l’inclusivité de ἀνθρώποις.
