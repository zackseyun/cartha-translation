id: MAT.23.29
reference: Matthew 23:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι οἰκοδομεῖτε τοὺς τάφους τῶν προφητῶν καὶ κοσμεῖτε τὰ μνημεῖα τῶν δικαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/029.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites, because you build the tombs of the prophets and decorate the monuments of the righteous[b],
translation:
  language: fr
  text: Quel malheur pour vous, spécialistes de la Loi et pharisiens, hypocrites, parce que vous construisez les tombeaux des prophètes et décorez les monuments funéraires[a] des justes !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tombeaux ». Le mot grec peut désigner un tombeau ou un monument commémoratif associé à une sépulture; « monuments funéraires » permet ici de le distinguer du mot traduit par « tombeaux » plus tôt dans le verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: Quel malheur pour vous
  rationale: Formule française naturelle de dénonciation prophétique, qui conserve à la fois la menace du jugement et la dimension de lamentation.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Dans ce contexte, le terme désigne des experts juifs des Écritures et de la Loi; cette formulation moderne évite que « scribes » soit compris comme de simples copistes.
- source_word: Φαρισαῖοι
  choice: pharisiens
  rationale: Désignation française établie de ce groupe religieux juif.
- source_word: ὑποκριταί
  choice: hypocrites
  rationale: Équivalent français direct et traditionnel, exprimant ici la discordance entre l’apparence religieuse et la conduite.
- source_word: ὅτι
  choice: parce que
  rationale: Introduit explicitement la raison de la dénonciation.
- source_word: οἰκοδομεῖτε
  choice: vous construisez
  rationale: Rend le présent sans préciser indûment qu’il s’agirait de reconstruire ou restaurer.
- source_word: τάφους
  choice: tombeaux
  rationale: Convient à des sépultures bâties et s’accorde avec le verbe « construire ».
- source_word: κοσμεῖτε
  choice: décorez
  rationale: Expression actuelle et claire de l’action d’orner ou d’embellir.
- source_word: μνημεῖα
  choice: monuments funéraires
  rationale: Préserve la nuance commémorative tout en distinguant ce terme de τάφους, rendu par « tombeaux ».
- source_word: δικαίων
  choice: des justes
  rationale: Rend sobrement l’adjectif substantivé et conserve sa portée morale et théologique.
theological_decisions:
- issue: Portée de δικαίων
  choice: les justes
  alternative: les personnes justes
  rationale: « Les justes » conserve la catégorie morale et théologique du grec sans développer ni importer une doctrine particulière.
- issue: Force de Οὐαί
  choice: Quel malheur pour vous
  alternative: Malheur à vous
  rationale: La formulation choisie reste une déclaration prophétique de jugement tout en étant immédiatement intelligible en français moderne; elle ne réduit pas l’expression à une simple marque de tristesse.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Spécialistes de la Loi » privilégie la compréhension actuelle; la ponctuation rattache directement la cause à la déclaration de malheur, conformément à la syntaxe grecque.
