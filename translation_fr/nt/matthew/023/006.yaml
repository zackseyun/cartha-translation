id: MAT.23.6
reference: Matthew 23:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: φιλοῦσι ⸀δὲ τὴν πρωτοκλισίαν ἐν τοῖς δείπνοις καὶ τὰς πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/006.yaml
  text: And they love the places of honor at banquets and the best seats in the synagogues[c][b][a],
translation:
  language: fr
  text: Ils aiment la place d’honneur dans les banquets[a][b] et les sièges d’honneur dans les synagogues[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la première place à table ». Dans l’Antiquité, les convives étaient souvent allongés pour les repas officiels, et certaines positions étaient considérées comme plus honorables.
    reason: lexical_alternative
  - marker: b
    text: Dans les banquets du monde méditerranéen antique, la disposition des convives rendait leur rang social visible; il est donc question de prestige public, et non simplement de confort.
    reason: cultural_note
  - marker: c
    text: Ou « les premiers sièges ». Le grec désigne les sièges correspondant au rang ou à la préséance les plus élevés.
    reason: lexical_alternative
lexical_decisions:
- source_word: φιλοῦσι
  choice: Ils aiment
  rationale: Le présent de φιλέω exprime ici un goût marqué ou une prédilection. « Ils aiment » est naturel, direct et conserve la force critique du propos.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule δέ assure ici une liaison légère avec le contexte précédent. En français, la juxtaposition suffit et évite un « et » initial peu naturel sans perdre le lien discursif.
- source_word: τὴν πρωτοκλισίαν
  choice: la place d’honneur
  rationale: Le singulier grec désigne la place de premier rang occupée à table, dans un contexte où les convives étaient généralement allongés. « La place d’honneur » en transmet clairement la valeur sociale.
- source_word: ἐν τοῖς δείπνοις
  choice: dans les banquets
  rationale: δεῖπνον peut désigner le repas principal ou un dîner; dans ce contexte public et hiérarchisé, « banquets » rend bien le cadre social solennel.
- source_word: τὰς πρωτοκαθεδρίας
  choice: les sièges d’honneur
  rationale: Le terme désigne les sièges associés au rang le plus élevé ou à la préséance. « Sièges d’honneur » exprime mieux le statut recherché que le simple confort suggéré par « meilleures places ».
- source_word: ἐν ταῖς συναγωγαῖς
  choice: dans les synagogues
  rationale: Traduction locative directe et naturelle du cadre institutionnel indiqué par le grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre les deux lieux est conservé, tandis que « place d’honneur » au singulier respecte le nombre de πρωτοκλισία et « sièges d’honneur » celui de πρωτοκαθεδρίας.
