id: MAT.23.38
reference: Matthew 23:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ὑμῶν ⸀ἔρημος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/038.yaml
  text: Look[a], your house is left to you desolate.
translation:
  language: fr
  text: Voici, votre maison[a] vous est laissée déserte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « votre temple » ; l’expression « votre maison » peut désigner plus précisément le temple, bien que le grec ait un sens plus large.
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: « Voici » introduit naturellement en français une déclaration solennelle et attire l’attention, tout en conservant la force prophétique du grec.
- source_word: ἀφίεται
  choice: est laissée
  rationale: Le présent passif est conservé sans préciser l’agent ni renforcer le verbe jusqu’à « abandonnée », qui serait légèrement plus interprétatif.
- source_word: ὑμῖν
  choice: vous
  rationale: Dans « vous est laissée », le pronom rend le datif grec et préserve l’idée que cette maison leur est laissée, sans expliciter davantage la relation.
- source_word: ὁ οἶκος ὑμῶν
  choice: votre maison
  rationale: La traduction littérale maintient l’étendue possible de l’expression grecque, qui peut évoquer le temple, Jérusalem ou plus largement la maison du peuple, sans en fixer le référent dans le texte principal.
- source_word: ἔρημος
  choice: déserte
  rationale: « Déserte » exprime l’abandon et la désolation dans ce contexte de jugement, tout en s’accordant naturellement avec « maison ».
theological_decisions:
- issue: Référent de « votre maison »
  choice: Conserver « votre maison » dans le texte principal.
  alternative: Préciser « votre temple », « Jérusalem » ou « la maison d’Israël ».
  rationale: Le contexte oriente fortement vers Jérusalem et particulièrement le temple, mais le grec reste plus large. La formulation retenue préserve cette ambiguïté et la tension prophétique.
- issue: Agent implicite du passif « est laissée »
  choice: Ne pas identifier l’agent.
  alternative: Traduire explicitement que Dieu abandonne leur maison.
  rationale: Le passif grec n’exprime pas l’agent. L’expliciter introduirait dans la traduction une conclusion interprétative, même si le contexte peut la suggérer.
translation_notes:
  register: Français international moderne, sobre et solennel. « Voici » conserve la portée d’annonce prophétique ; la syntaxe reste claire et proche de la structure grecque sans devenir artificielle.
