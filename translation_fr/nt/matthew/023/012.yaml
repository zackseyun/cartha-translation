id: MAT.23.12
reference: Matthew 23:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅστις δὲ ὑψώσει ἑαυτὸν ταπεινωθήσεται, καὶ ὅστις ταπεινώσει ἑαυτὸν ⸀ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/012.yaml
  text: But whoever exalts himself will be humbled[b][a], and whoever humbles himself will be exalted.
translation:
  language: fr
  text: Mais quiconque s’élève sera abaissé[a], et quiconque s’abaisse sera élevé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sera humilié […] sera exalté ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: quiconque
  rationale: Le pronom relatif indéfini introduit une maxime générale; « quiconque » en conserve la portée universelle et proverbiale.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque ici un léger contraste avec le contexte précédent; « mais » rend naturellement cette nuance.
- source_word: ὑψώσει ἑαυτόν
  choice: s’élèvera lui-même
  rationale: La construction réflexive exprime le fait de chercher à s’élever en rang ou en honneur. Cette formulation conserve l’image verticale et le futur grec.
- source_word: ταπεινωθήσεται
  choice: sera abaissé
  rationale: Le futur passif est conservé sans préciser l’agent; « abaissé » maintient aussi le contraste lexical avec « élevé ».
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne les deux membres parallèles de la maxime.
- source_word: ταπεινώσει ἑαυτόν
  choice: s’abaissera lui-même
  rationale: Le verbe actif avec pronom réfléchi décrit un abaissement volontaire et forme un parallèle antithétique naturel avec « s’élèvera lui-même ».
- source_word: ὑψωθήσεται
  choice: sera élevé
  rationale: Le futur passif est rendu directement, sans nommer l’agent, et reprend le même champ lexical que le premier membre.
theological_decisions:
- issue: Agent des verbes passifs
  choice: Conserver les formes passives sans nommer l’agent
  alternative: 'Expliciter Dieu comme sujet : « Dieu l’abaissera / l’élèvera »'
  rationale: Le grec ne désigne pas explicitement l’agent. Le passif français préserve cette retenue tout en laissant possible l’idée implicite d’une action divine.
- issue: Forme masculine singulière à valeur générale
  choice: Employer « quiconque » avec la construction réfléchie « lui-même »
  alternative: Employer une formulation plurielle ou épicène évitant « lui-même »
  rationale: Le grec présente une déclaration générale au masculin singulier. « Quiconque » indique clairement que toute personne est concernée, tandis que « lui-même » conserve la forme réfléchie et l’insistance de l’original.
- issue: Valeur de l’image verticale
  choice: Traduire par « s’élever / être abaissé » et « s’abaisser / être élevé »
  alternative: Traduire par « s’exalter / être humilié » et « s’humilier / être exalté »
  rationale: Le choix retenu préserve la symétrie lexicale des deux verbes grecs et leur image d’élévation et d’abaissement, sans réduire le sens à un état psychologique.
translation_notes:
  register: Français international moderne, sobre et proverbial. La structure équilibrée des deux propositions et les futurs de l’original sont conservés. L’ajout de « lui-même » rend l’insistance réflexive explicite et évite que « s’élever » ou « s’abaisser » soit compris comme purement involontaire.
