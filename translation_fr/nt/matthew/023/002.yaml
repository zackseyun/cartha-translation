  text: λέγων· Ἐπὶ τῆς Μωϋσέως καθέδρας ἐκάθισαν οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/002.yaml
  text: saying[a], “The scribes and the Pharisees sit in Moses’ seat.”
translation:
  language: fr
  text: 'disant : « Les spécialistes de la Loi et les pharisiens se sont assis[a] sur la chaire de Moïse. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « siègent dans la chaire de Moïse ». Le verbe grec peut aussi être compris dans un sens plus neutre, « siéger » ; « se sont assis » peut évoquer le fait d’avoir pris place dans cette position d’autorité.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: disant
  rationale: Le participe présent rattache directement l’introduction du discours au verset précédent; « disant » conserve ce lien syntaxique.
- source_word: Ἐπὶ τῆς Μωϋσέως καθέδρας
  choice: dans la chaire de Moïse
  rationale: Dans ce contexte, καθέδρα désigne le siège symbolique de l’autorité enseignante associée à Moïse. « Chaire » exprime naturellement cette fonction en français.
- source_word: ἐκάθισαν
  choice: se sont assis
  rationale: L’aoriste de καθίζω peut décrire le fait de prendre place ou d’occuper un siège. Cette formulation conserve la possibilité d’une prise de position d’autorité sans affirmer explicitement une nomination ni une usurpation.
- source_word: οἱ γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Dans les Évangiles, le terme désigne principalement des experts reconnus des Écritures et de la Loi; cette traduction est plus immédiatement compréhensible que « scribes » pour un lectorat moderne.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Translittération française traditionnelle et claire du nom de ce groupe.
theological_decisions:
- issue: 'La portée de ἐκάθισαν : simple occupation actuelle ou fait d’avoir pris une position d’autorité'
  choice: se sont assis
  alternative: siègent
  rationale: Le parfait français rend la forme passée grecque et laisse entendre qu’ils ont pris place dans cette fonction, tout en évitant d’ajouter que cette autorité serait soit divinement conférée, soit illégitimement usurpée.
translation_notes:
  register: Français moderne, digne et accessible. « Spécialistes de la Loi » explicite la fonction des γραμματεῖς; « chaire de Moïse » conserve la métaphore historique de l’autorité enseignante.
