id: MAT.23.33
reference: Matthew 23:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὄφεις γεννήματα ἐχιδνῶν, πῶς φύγητε ἀπὸ τῆς κρίσεως τῆς γεέννης;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/033.yaml
  text: You snakes[a], offspring of vipers! How will you escape from the judgment of Gehenna?
translation:
  language: fr
  text: Serpents, progéniture de vipères ! Comment échapperez-vous au jugement de la géhenne[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au jugement de l’enfer ». Grec : « géhenne ».'
    reason: Signaler l’équivalent français courant tout en conservant dans le texte le terme spécifique de l’original.
lexical_decisions:
- source_word: ὄφεις
  choice: Serpents
  rationale: Vocatif injurieux direct. « Serpents » est naturel en français, conserve l’image animale et s’accorde au registre solennel de la dénonciation.
- source_word: γεννήματα
  choice: progéniture
  rationale: Rend ce qui est engendré ou produit et préserve la construction avec le complément « de vipères ». Le terme est plus transparent que l’expression traditionnelle « race de vipères », qui peut suggérer une catégorie ethnique.
- source_word: ἐχιδνῶν
  choice: vipères
  rationale: Désigne spécifiquement des vipères et renforce l’image menaçante au-delà du terme général « serpents ».
- source_word: πῶς
  choice: Comment
  rationale: Introduit une question rhétorique portant sur la perspective ou la possibilité d’échapper au jugement, sans réduire explicitement le sens à la seule capacité.
- source_word: φύγητε
  choice: échapperez-vous
  rationale: Le verbe peut signifier fuir ou échapper. Avec ἀπό et « jugement », « échapper à » est l’expression française naturelle; le futur convient à la portée prospective de la question.
- source_word: κρίσεως
  choice: jugement
  rationale: Conserve le sens judiciaire général sans préciser davantage « condamnation » ou « sentence » que ne le fait le grec.
- source_word: γεέννης
  choice: géhenne
  rationale: Translittère le terme grec et préserve sa spécificité historique et eschatologique, au lieu de l’assimiler sans indication au concept français plus large d’« enfer ».
theological_decisions:
- issue: Traduction de γέεννα
  choice: géhenne
  alternative: enfer
  rationale: « Géhenne » maintient le terme particulier employé dans le texte et son arrière-plan juif. « Enfer », équivalent courant, est signalé en note afin d’aider les lecteurs sans imposer toutes ses associations ultérieures.
- issue: Force de la question πῶς φύγητε
  choice: Comment échapperez-vous
  alternative: Comment pourriez-vous échapper
  rationale: Le futur français garde l’orientation vers le jugement à venir et la force rhétorique, sans transformer explicitement la question en affirmation d’impossibilité absolue.
translation_notes:
  register: Français international moderne, direct et digne. L’exclamation conserve la violence de l’apostrophe; la question reste concise et solennelle. Le marqueur [a] est placé immédiatement après « géhenne », le terme concerné.
