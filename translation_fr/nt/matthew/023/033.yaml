  source_fidelity: « Serpents, progéniture de vipères ! » rend fidèlement les deux vocatifs ὄφεις γεννήματα ἐχιδνῶν, en conservant la distinction entre les serpents en général et les vipères. « Comment échapperez-vous » exprime naturellement la question rhétorique prospective de πῶς φύγητε, sans renforcer indûment le texte en « ne pourrez-vous pas ». « jugement » rend κρίσις sans anticiper « condamnation », et « géhenne » conserve la précision du grec γεέννα.
  naturalness: Le français est clair, moderne et digne. « Progéniture de vipères » est un collectif recevable dans cette apostrophe solennelle; il évite une formulation ethnique tout en gardant la force de l’injure. La ponctuation et le placement du marqueur sont naturels.
  terminology: « Géhenne » en minuscules est l’usage français approprié pour le terme eschatologique. La note offre utilement « enfer » comme équivalent courant sans substituer ce terme, aux associations plus larges, au mot du texte. Aucun ancrage ni terme théologique ne pose problème.
