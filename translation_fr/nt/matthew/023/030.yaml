  text: καὶ λέγετε· Εἰ ⸀ἤμεθα ἐν ταῖς ἡμέραις τῶν πατέρων ἡμῶν, οὐκ ἂν ⸁ἤμεθα ⸂αὐτῶν κοινωνοὶ⸃ ἐν τῷ αἵματι τῶν προφητῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/030.yaml
  text: and you say[a], ‘If we had been living in the days of our fathers[b], we would not have been partners with them in the blood of the prophets.’
translation:
  language: fr
  text: 'et vous dites : « Si nous avions vécu à l’époque de nos ancêtres, nous n’aurions pas participé avec eux[a] à l’effusion du sang des prophètes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « nous n’aurions pas été leurs associés dans le sang des prophètes » ; le terme grec désigne des personnes qui partagent une action ou y prennent part et peut, dans ce contexte, impliquer la complicité.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγετε
  choice: vous dites
  rationale: Le présent de l’indicatif, à la deuxième personne du pluriel, est rendu directement et naturellement dans l’interpellation de Jésus.
- source_word: Εἰ ἤμεθα ἐν ταῖς ἡμέραις
  choice: Si nous avions vécu au temps de
  rationale: L’imparfait dans cette condition irréelle évoque une situation passée hypothétique. Cette formulation française exprime clairement cette valeur tout en rendant l’expression temporelle grecque de façon idiomatique.
- source_word: τῶν πατέρων ἡμῶν
  choice: nos ancêtres
  rationale: Dans ce contexte historique et généalogique, πατέρες désigne les générations antérieures. « Ancêtres » est plus clair en français moderne que le littéral « pères », qui pourrait évoquer les pères immédiats.
- source_word: οὐκ ἂν ἤμεθα
  choice: nous ne nous serions pas
  rationale: Le conditionnel passé rend l’apodose d’une condition contraire aux faits portant sur le passé.
- source_word: αὐτῶν κοινωνοὶ
  choice: associés à eux
  rationale: κοινωνοί désigne des personnes qui partagent une action ou y prennent part. « Associés à eux » conserve cette idée sans imposer dans le texte principal le terme plus fort « complices ».
- source_word: ἐν τῷ αἵματι τῶν προφητῶν
  choice: pour verser le sang des prophètes
  rationale: L’expression grecque « dans le sang des prophètes » désigne ici la participation à leur mise à mort. La formulation choisie conserve l’image concrète du sang tout en étant naturelle et intelligible en français.
theological_decisions:
- issue: Degré de complicité exprimé par κοινωνοὶ ἐν τῷ αἵματι
  choice: associés à eux pour verser le sang des prophètes
  alternative: leurs complices dans le meurtre des prophètes
  rationale: Le propos nie une participation à la violence meurtrière des ancêtres contre les prophètes. La traduction garde à la fois la relation de participation exprimée par κοινωνοί et l’image du sang, sans réduire l’expression à une formulation doctrinale abstraite ni accentuer indûment le degré juridique de culpabilité.
translation_notes:
  register: Français moderne, digne et accessible. « Au temps de nos ancêtres » évite l’ambiguïté contemporaine de « aux jours de nos pères ». La proposition finale explicite sobrement le sens meurtrier de l’image grecque tout en conservant « le sang des prophètes ».
