id: MAT.23.35
reference: Matthew 23:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπως ἔλθῃ ἐφ’ ὑμᾶς πᾶν αἷμα δίκαιον ἐκχυννόμενον ἐπὶ τῆς γῆς ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου, ὃν ἐφονεύσατε μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/035.yaml
  text: so that upon you may come all the righteous blood being poured out on the earth[a], from the blood of righteous Abel to the blood of Zechariah son of Berechiah[b], whom you murdered between the sanctuary and the altar.
translation:
  language: fr
  text: afin que tout le sang des justes répandu sur la terre[a], depuis le sang d’Abel le juste jusqu’au sang de Zacharie, fils de Barachie[b], que vous avez assassiné entre le sanctuaire et l’autel, vienne sur vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur le pays ». Le mot grec peut désigner soit la terre, soit le pays.
    reason: lexical_alternative
  - marker: b
    text: L’identité de « Zacharie, fils de Barachie » est débattue. Certains l’identifient au prophète Zacharie, d’autres à Zacharie, fils de Jehojada (2 Ch 24.20-22). La traduction suit ici le texte grec tel qu’il est écrit.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit le but ou le résultat lié à la dénonciation précédente, tout en conservant la force finale de la construction.
- source_word: ἔλθῃ ἐφ’ ὑμᾶς
  choice: retombe sur vous
  rationale: Expression française naturelle qui conserve l’idée d’une culpabilité judiciaire venant peser sur les destinataires.
- source_word: πᾶν αἷμα δίκαιον
  choice: tout le sang innocent
  rationale: 'Le sang est qualifié de δίκαιον par métonymie : il s’agit du sang de personnes justes, donc injustement versé. « Sang innocent » exprime naturellement cette valeur en français.'
- source_word: ἐκχυννόμενον
  choice: versé
  rationale: Rend idiomatiquement le participe présent passif dans la proposition nominale, sans imposer en français une tournure progressive lourde.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: γῆ peut désigner la terre entière ou un pays. Le cadre allant d’Abel à Zacharie favorise ici « terre », tandis que l’autre possibilité est signalée en note.
- source_word: ἀπὸ τοῦ αἵματος Ἅβελ τοῦ δικαίου
  choice: depuis le sang d’Abel le juste
  rationale: Conserve l’expression avec « sang » ainsi que l’épithète substantielle τοῦ δικαίου dans une formulation française digne et claire.
- source_word: ἕως τοῦ αἵματος Ζαχαρίου υἱοῦ Βαραχίου
  choice: jusqu’au sang de Zacharie, fils de Barachie
  rationale: Rend directement la limite de la construction ἀπό…ἕως et translittère les noms selon leur forme française biblique usuelle.
- source_word: ὃν ἐφονεύσατε
  choice: que vous avez assassiné
  rationale: φονεύω désigne un homicide coupable et porte une accusation morale plus forte que le simple verbe « tuer ».
- source_word: μεταξὺ τοῦ ναοῦ καὶ τοῦ θυσιαστηρίου
  choice: entre le sanctuaire et l’autel
  rationale: ναός vise plus précisément le sanctuaire ou bâtiment sacré, plutôt que l’ensemble de l’enceinte du Temple.
theological_decisions:
- issue: Identification de Zacharie, fils de Barachie
  choice: Conserver le nom tel qu’il figure dans le texte grec, sans harmonisation.
  alternative: L’identifier soit au prophète Zacharie, soit à Zacharie fils de Jehojada en considérant « fils de Barachie » comme une difficulté textuelle ou traditionnelle.
  rationale: La traduction doit refléter le texte grec transmis sans résoudre silencieusement une identification historique débattue.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le ton judiciaire et accusateur du passage, tout en évitant une syntaxe artificiellement calquée sur le grec.
