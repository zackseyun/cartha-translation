  terminology: « Justes », « répandu », « sanctuaire » et « autel » correspondent bien au grec et au registre biblique. Les noms Zacharie, Barachie et Jehojada sont conservés. La note sur γῆ est ajustée de « dans le pays » à « sur le pays », conformément à ἐπί.
