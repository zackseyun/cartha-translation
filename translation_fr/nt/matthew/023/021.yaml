id: MAT.23.21
reference: Matthew 23:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ ναῷ ὀμνύει ἐν αὐτῷ καὶ ἐν τῷ ⸀κατοικοῦντι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/021.yaml
  text: And whoever swears by the temple swears by it and by the One dwelling in it[a].
translation:
  language: fr
  text: Et quiconque jure par le temple jure par lui et par Celui qui y habite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le temple… en lui »; la préposition grecque signifie littéralement « dans », mais, dans cette formule de serment, elle a le sens de « par ».
    reason: alternative lexicale
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: quiconque jure
  rationale: Le participe aoriste substantivé a une portée générale. « Quiconque jure » exprime naturellement cette valeur sans introduire de masculin inutile.
- source_word: ἐν τῷ ναῷ
  choice: par le temple
  rationale: Dans cette formule de serment, ἐν désigne ce qui est invoqué pour garantir le serment. En français, l’expression idiomatique est « jurer par ».
- source_word: ναῷ
  choice: temple
  rationale: ναός désigne ici le temple, plus précisément le sanctuaire. « Temple » reste le terme courant et correspond au contexte immédiat.
- source_word: ὀμνύει
  choice: jure
  rationale: Le présent énonce une vérité générale découlant du serment formulé.
- source_word: ἐν αὐτῷ
  choice: par lui
  rationale: La même préposition conserve ici sa valeur dans la formule de serment; le pronom masculin renvoie grammaticalement au « temple » en français.
- source_word: τῷ κατοικοῦντι αὐτόν
  choice: Celui qui y habite
  rationale: Le participe substantivé désigne la personne qui demeure dans le temple. « Y habite » rend naturellement en français la relation exprimée par κατοικεῖν avec son complément.
theological_decisions:
- issue: Identification de celui qui habite dans le temple
  choice: « Celui » avec une majuscule, renvoyant à Dieu
  alternative: « celui qui y habite » sans majuscule
  rationale: Dans le contexte, l’habitant du temple est Dieu. La majuscule signale ce référent sans ajouter de titre ni préciser davantage la relation théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Quiconque » convient à la portée générale et au ton proverbial; « jurer par » est l’expression française naturelle pour une formule de serment.
