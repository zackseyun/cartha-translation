id: MAT.23.31
reference: Matthew 23:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε μαρτυρεῖτε ἑαυτοῖς ὅτι υἱοί ἐστε τῶν φονευσάντων τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/031.yaml
  text: So you testify against yourselves that you are sons of those who murdered the prophets[a].
translation:
  language: fr
  text: 'Ainsi, vous portez témoignage contre vous-mêmes : vous êtes les fils de ceux qui ont assassiné les prophètes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « vous vous rendez témoignage ». L’expression grecque peut se comprendre ainsi ; dans ce contexte, leur témoignage les incrimine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi
  rationale: Introduit la conséquence ou la déduction tirée de ce qui précède, dans un français naturel et soutenu sans être archaïque.
- source_word: μαρτυρεῖτε ἑαυτοῖς
  choice: vous témoignez contre vous-mêmes
  rationale: Le grec signifie littéralement « vous témoignez à vous-mêmes », mais le contexte donne à ce témoignage une portée accusatrice; la formulation française exprime clairement cette auto-incrimination tout en signalant l'autre possibilité en note.
- source_word: ὅτι
  choice: que
  rationale: Introduit le contenu du témoignage, et non sa cause.
- source_word: υἱοί
  choice: les fils
  rationale: Préserve l'image familiale masculine du grec ainsi que la double idée de filiation et de solidarité morale.
- source_word: τῶν φονευσάντων
  choice: de ceux qui ont assassiné
  rationale: Le participe désigne ces personnes par leur acte accompli; « assassiné » rend le caractère injuste et condamnable de la mise à mort.
- source_word: τοὺς προφήτας
  choice: les prophètes
  rationale: Rend directement le groupe reconnu des messagers prophétiques mis à mort.
theological_decisions:
- issue: 'La portée de υἱοί : filiation littérale ou solidarité morale avec les meurtriers des prophètes.'
  choice: les fils
  alternative: les enfants / les descendants
  rationale: « Les fils » conserve la métaphore familiale et la force rhétorique du texte sans trancher entre ascendance généalogique et ressemblance morale; le contexte permet aux deux dimensions de rester présentes.
- issue: La valeur de ἑαυτοῖς dans l'expression μαρτυρεῖτε ἑαυτοῖς.
  choice: contre vous-mêmes
  alternative: à vous-mêmes / pour vous-mêmes
  rationale: Le contexte fait de leur aveu un témoignage qui les incrimine. La traduction principale explicite cette portée, tandis que la note préserve la construction grecque plus littérale.
translation_notes:
  register: Français international moderne, naturel et digne. « Ainsi » maintient le lien déductif avec les versets précédents; « assassiné » conserve la forte condamnation implicite de φονεύω.
