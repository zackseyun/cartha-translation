id: MAT.23.22
reference: Matthew 23:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ ὀμόσας ἐν τῷ οὐρανῷ ὀμνύει ἐν τῷ θρόνῳ τοῦ θεοῦ καὶ ἐν τῷ καθημένῳ ἐπάνω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/022.yaml
  text: And whoever swears by heaven swears by the throne of God and by the one seated upon it[a].
translation:
  language: fr
  text: Et celui qui jure par le ciel jure par le trône de Dieu et par celui qui y siège[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui est assis sur le trône ».
    reason: Variante lexicale pour τῷ καθημένῳ ἐπάνω αὐτοῦ, formulée dans un registre plus naturel et soutenu en français.
lexical_decisions:
- source_word: ὁ ὀμόσας
  choice: celui qui jure
  rationale: Le participe aoriste substantivé a ici une valeur générale. Le présent français exprime naturellement cette règle générale sans imposer un sens passé.
- source_word: ἐν
  choice: par
  rationale: Dans une formule de serment, ἐν suivi du datif se rend idiomatiquement en français par « par ».
- source_word: οὐρανῷ
  choice: le ciel
  rationale: Dans ce contexte religieux, οὐρανός désigne le ciel comme demeure divine, immédiatement associé au trône de Dieu, et non simplement le ciel visible.
- source_word: ὀμνύει
  choice: jure
  rationale: Le présent de l'indicatif énonce une vérité générale; le présent français convient directement.
- source_word: θρόνῳ τοῦ θεοῦ
  choice: le trône de Dieu
  rationale: Cette formulation conserve le génitif explicite et la cadence solennelle du grec.
- source_word: τῷ καθημένῳ
  choice: celui qui y siège
  rationale: Le participe de κάθημαι désigne celui qui est assis sur le trône. « Siège » est naturel et digne en français, tout en renforçant justement l'image royale sans expliciter le nom de Dieu.
- source_word: ἐπάνω αὐτοῦ
  choice: y
  rationale: Le pronom adverbial renvoie naturellement en français au trône et exprime la position de celui qui y siège, sans suggérer qu'il se trouverait séparé au-dessus du trône.
theological_decisions:
- issue: Référent de « celui qui y siège »
  choice: Conserver la périphrase révérencielle désignant Dieu assis sur son trône
  alternative: Remplacer la périphrase par « Dieu » ou garder une désignation plus indéfinie
  rationale: La mention immédiate du « trône de Dieu » rend le référent clair, mais le grec maintient une périphrase. La traduction la conserve afin de ne pas expliciter davantage que le texte.
translation_notes:
  register: Français international moderne, clair et digne. « Celui qui y siège » convient à l'image du trône et évite la lourdeur de « celui qui est assis sur lui », ambiguë en français.
