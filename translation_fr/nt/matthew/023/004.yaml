id: MAT.23.4
reference: Matthew 23:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δεσμεύουσιν ⸀δὲ φορτία ⸀βαρέα καὶ ἐπιτιθέασιν ἐπὶ τοὺς ὤμους τῶν ἀνθρώπων, ⸂αὐτοὶ δὲ τῷ⸃ δακτύλῳ αὐτῶν οὐ θέλουσιν κινῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/004.yaml
  text: They tie up heavy burdens and lay them on the shoulders of men[a], but they themselves are unwilling to move them with their finger.
translation:
  language: fr
  text: Ils lient de lourds fardeaux et les mettent sur les épaules des gens, mais eux-mêmes ne veulent pas les remuer du doigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεσμεύουσιν
  choice: attachent
  rationale: Le verbe évoque l’action de lier ou d’attacher ensemble. « Attachent » est naturel en français et conserve l’image concrète de fardeaux préparés pour être imposés.
- source_word: φορτία βαρέα
  choice: de lourds fardeaux
  rationale: Cette expression garde à la fois l’image physique d’une charge pesante et sa possible portée métaphorique oppressive.
- source_word: ἐπιτιθέασιν ἐπὶ τοὺς ὤμους
  choice: les mettent sur les épaules
  rationale: Cette formulation actuelle et claire reproduit directement l’image corporelle du grec sans ajouter d’interprétation.
- source_word: τῶν ἀνθρώπων
  choice: des gens
  rationale: ἄνθρωποι désigne ici les êtres humains en général. « Les gens » exprime naturellement en français moderne cette portée représentative sans restriction de sexe.
- source_word: αὐτοὶ δὲ
  choice: mais eux-mêmes
  rationale: Le pronom renforcé préserve le contraste emphatique entre les charges imposées aux autres et leur propre refus d’agir.
- source_word: τῷ δακτύλῳ αὐτῶν
  choice: du doigt
  rationale: L’expression française idiomatique « remuer du doigt » conserve le singulier et souligne l’effort infime qu’ils refusent même de fournir.
- source_word: οὐ θέλουσιν κινῆσαι αὐτά
  choice: ne veulent pas les remuer
  rationale: « Ne veulent pas » rend explicitement la volonté négative exprimée par θέλω, tandis que « remuer » correspond directement à κινέω sans introduire l’idée plus précise de soulever.
theological_decisions:
- issue: Nature littérale ou métaphorique des fardeaux
  choice: Conserver l’image concrète de « lourds fardeaux » sans en préciser le référent.
  alternative: Expliciter les fardeaux comme des exigences légales ou des prescriptions religieuses.
  rationale: Le contexte vise les obligations oppressantes imposées par les spécialistes de la Loi et les pharisiens, mais le verset lui-même ne nomme pas ces obligations. Maintenir la métaphore préserve l’ouverture du texte et évite une précision doctrinale importée.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le contraste rhétorique, l’image physique des épaules et le refus volontaire du moindre effort. Aucun marqueur de note n’est requis.
