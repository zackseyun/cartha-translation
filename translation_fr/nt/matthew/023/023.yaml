  terminology: « Scribes », « pharisiens », « Loi », « justice », « foi » et « dîme » sont cohérents avec l’usage biblique français. La note sur πίστις doit conserver l’alternative « fidélité » sans développer de façon interprétative « fidélité à l’alliance », notion plausible mais non explicitée par le grec.
