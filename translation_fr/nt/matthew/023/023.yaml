id: MAT.23.23
reference: Matthew 23:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ ἄνηθον καὶ τὸ κύμινον, καὶ ἀφήκατε τὰ βαρύτερα τοῦ νόμου, τὴν κρίσιν καὶ ⸂τὸ ἔλεος⸃ καὶ τὴν πίστιν· ⸀ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀ἀφιέναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/023.yaml
  text: 'Woe to you[a], scribes and Pharisees, hypocrites! For you tithe mint and dill and cumin, and have neglected the weightier matters of the law: justice and mercy and faith. These you ought to have done, without neglecting the others.'
translation:
  language: fr
  text: '« Malheur à vous, scribes et pharisiens, hypocrites ! Car vous donnez la dîme de la menthe, de l’aneth et du cumin, mais vous avez négligé ce qui a le plus de poids dans la Loi : la justice, la miséricorde et la foi[a]. C’est cela qu’il fallait pratiquer, sans négliger le reste. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fidélité ». Le mot grec peut désigner la foi, la confiance ou la fidélité ; dans ce contexte éthique, beaucoup comprennent « fidélité ».
    reason: Le terme grec πίστις est ambigu dans ce contexte ; « foi » est conservé dans le texte et « fidélité » est signalé comme lecture possible.
lexical_decisions:
- source_word: Οὐαὶ
  choice: Malheur à vous
  rationale: Formule prophétique française consacrée qui conserve la force de dénonciation et d’annonce du jugement.
- source_word: γραμματεῖς
  choice: scribes
  rationale: Équivalent direct et bien établi dans le contexte des Évangiles, sans élargir le terme à tous les enseignants de la Loi.
- source_word: ὑποκριταί
  choice: hypocrites
  rationale: Rend naturellement en français le sens moral et métaphorique du terme dans cette accusation.
- source_word: ἀποδεκατοῦτε
  choice: vous donnez la dîme de
  rationale: Exprime clairement l’action de prélever ou verser le dixième, tout en conservant la nuance religieuse et légale.
- source_word: ἡδύοσμον, ἄνηθον, κύμινον
  choice: la menthe, l’aneth et le cumin
  rationale: Noms français courants des trois plantes aromatiques mentionnées.
- source_word: ἀφήκατε
  choice: vous avez négligé
  rationale: Dans ce contexte, le verbe signifie laisser de côté ou omettre d’accomplir, plutôt qu’abandonner formellement.
- source_word: τὰ βαρύτερα τοῦ νόμου
  choice: ce qui a le plus de poids dans la Loi
  rationale: Préserve la métaphore du poids tout en exprimant clairement l’importance supérieure de ces exigences.
- source_word: κρίσιν
  choice: la justice
  rationale: Dans cette série de devoirs moraux, le terme désigne le juste jugement et la pratique de la justice, non simplement l’acte de juger.
- source_word: ἔλεος
  choice: la compassion
  rationale: Terme français naturel qui exprime ici la disposition miséricordieuse concrète envers autrui.
- source_word: πίστιν
  choice: la foi
  rationale: Conserve le sens lexical courant et l’ambiguïté théologique du grec; le sens possible de fidélité est signalé en note.
- source_word: ταῦτα ἔδει ποιῆσαι κἀκεῖνα μὴ ἀφιέναι
  choice: C’est cela qu’il fallait pratiquer, sans négliger le reste
  rationale: Reproduit le contraste entre les devoirs majeurs et les pratiques de dîme, sans laisser entendre que Jésus rejette ces dernières.
theological_decisions:
- issue: Sens de πίστις dans la série éthique justice–compassion–foi
  choice: foi
  alternative: fidélité
  rationale: Le grec peut désigner la foi, la confiance ou la fidélité. Le contexte éthique favorise pour certains lecteurs « fidélité », mais ne contraint pas assez le sens pour éliminer « foi »; l’alternative est donc conservée en note.
- issue: Rapport entre les devoirs majeurs de la Loi et la dîme des herbes
  choice: Les premiers devaient être pratiqués sans négliger la seconde
  alternative: Opposer les devoirs moraux aux pratiques de dîme
  rationale: La dernière proposition affirme explicitement qu’il ne fallait pas laisser de côté les autres pratiques; la traduction maintient cette tension plutôt que de présenter une abolition.
translation_notes:
  register: Français international moderne, digne et accessible. « Scribes » conserve le terme historique établi; la structure a été légèrement idiomatisée pour éviter une formulation lourde, tout en gardant la métaphore du poids et le contraste final du grec.
