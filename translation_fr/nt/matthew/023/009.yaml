source:
  edition: SBLGNT
  text: καὶ πατέρα μὴ καλέσητε ὑμῶν ἐπὶ τῆς γῆς, εἷς γάρ ἐστιν ⸂ὑμῶν ὁ πατὴρ⸃ ὁ ⸀οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/009.yaml
  text: And call no man on earth your father[a], for one is your Father[b], the heavenly One.
translation:
  language: fr
  text: Et n’appelez personne sur la terre votre père[a], car vous n’avez qu’un seul Père[b], le Père céleste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et ne donnez à personne sur la terre le titre de “père”. »'
    reason: Cette formulation explicite la valeur possible de « appeler », mais elle est plus interprétative que le grec.
  - marker: b
    text: 'Ou : « car vous n’avez qu’un seul Père, votre Père céleste » ; ou : « car vous n’avez qu’un seul Père, celui qui est au ciel ».'
    reason: Ces formulations rendent autrement l’adjectif substantivé ὁ οὐράνιος, sans modifier l’affirmation de l’unicité du Père.
lexical_decisions:
- source_word: πατέρα μὴ καλέσητε ὑμῶν
  choice: n’appelez personne […] votre père
  rationale: Le subjonctif aoriste avec μή exprime une interdiction. Cette formulation conserve le verbe « appeler » et le possessif ὑμῶν, sans expliciter davantage la portée du titre.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Expression française naturelle qui rend la sphère terrestre et maintient son contraste avec le Père céleste.
- source_word: εἷς γάρ ἐστιν ὑμῶν ὁ πατήρ
  choice: car un seul est votre Père
  rationale: La tournure garde l’accent du grec sur l’unicité tout en restant claire en français. La majuscule distingue ici la désignation divine sans ajouter d’interprétation doctrinale.
- source_word: ὁ οὐράνιος
  choice: le Père céleste
  rationale: L’adjectif substantivé identifie le Père comme céleste. Répéter « Père » donne une apposition naturelle en français, tandis qu’une note conserve les autres analyses possibles.
theological_decisions:
- issue: Portée de l’interdiction prononcée par Jésus
  choice: Conserver l’interdiction directe sans préciser dans le texte qu’elle viserait exclusivement un titre spirituel.
  alternative: La reformuler soit comme une interdiction absolue de tout emploi humain du mot « père », soit comme une simple hyperbole visant les titres religieux.
  rationale: Le grec formule une interdiction saisissante, mais le verset seul n’explicite pas ses limites. La traduction préserve donc cette tension et laisse le contexte guider l’interprétation.
- issue: Rapport entre « votre Père » et « le céleste »
  choice: Rendre l’expression par l’apposition « votre Père, le Père céleste ».
  alternative: « votre Père, le Céleste » ou « votre Père, celui qui est au ciel ».
  rationale: Cette lecture respecte la valeur adjectivale de οὐράνιος tout en évitant en français une désignation artificielle ou une transformation injustifiée en proposition relative.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe légèrement solennelle « un seul est votre Père » reproduit l’accent du grec sans devenir obscure. Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
