id: MAT.23.17
reference: Matthew 23:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μωροὶ καὶ τυφλοί, τίς γὰρ μείζων ἐστίν, ὁ χρυσὸς ἢ ὁ ναὸς ὁ ⸀ἁγιάσας τὸν χρυσόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/017.yaml
  text: 'You fools and blind men, for which is greater: the gold, or the temple that sanctified the gold?'
translation:
  language: fr
  text: 'Insensés et aveugles ! Car lequel est le plus grand : l’or ou le sanctuaire[a] qui a sanctifié l’or[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec ναός peut désigner plus précisément le sanctuaire du Temple; il peut aussi être rendu plus généralement par « temple ».
    reason: Précision culturelle et alternative lexicale pour ναός.
  - marker: b
    text: 'Ou : « qui a rendu l’or saint ».'
    reason: Alternative lexicale pour ἁγιάζω.
lexical_decisions:
- source_word: μωροὶ καὶ τυφλοί
  choice: Insensés et aveugles !
  rationale: Les deux adjectifs au vocatif sont rendus comme une interpellation directe et vigoureuse. « Insensés » exprime ici le manque de discernement sans recourir à une insulte familière.
- source_word: τίς γὰρ μείζων ἐστίν
  choice: Qu’est-ce qui est donc le plus important
  rationale: La question compare deux réalités déterminées. « Donc » conserve la valeur explicative de γάρ, tandis que « le plus important » exprime naturellement la supériorité envisagée dans l’argument.
- source_word: ὁ χρυσὸς
  choice: l’or
  rationale: L’article défini renvoie à l’or précis dont il est question dans le contexte des serments.
- source_word: ὁ ναὸς
  choice: le sanctuaire
  rationale: Dans ce contexte cultuel, ναός désigne plus précisément le sanctuaire du Temple et non l’ensemble du complexe du temple.
- source_word: ὁ ἁγιάσας τὸν χρυσόν
  choice: qui a sanctifié l’or
  rationale: Le participe aoriste est rendu par un passé composé qui conserve son aspect rétrospectif sans exclure la portée générale de l’argument. « Sanctifié » maintient le registre sacré et cultuel de ἁγιάζω.
theological_decisions:
- issue: Sens cultuel de ἁγιάζω
  choice: a sanctifié
  alternative: a rendu saint
  rationale: « Sanctifier » préserve le registre cultuel et l’idée que le sanctuaire confère à l’or son caractère sacré, sans préciser davantage le mécanisme.
- issue: Référent de ναός
  choice: sanctuaire
  alternative: temple
  rationale: « Sanctuaire » représente avec plus de précision le ναός, c’est-à-dire l’édifice sacré proprement dit. Une note signale la traduction plus générale et familière « temple ».
translation_notes:
  register: Français international moderne, digne et direct. La vigueur de la réprimande est conservée, ainsi que la question rhétorique et son vocabulaire cultuel.
