id: MAT.23.13
reference: Matthew 23:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐαὶ ⸀δὲ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι κλείετε τὴν βασιλείαν τῶν οὐρανῶν ἔμπροσθεν τῶν ἀνθρώπων· ὑμεῖς γὰρ οὐκ εἰσέρχεσθε, οὐδὲ τοὺς εἰσερχομένους ἀφίετε ⸀εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/013.yaml
  text: But woe to you[a], scribes and Pharisees, hypocrites! For you shut the kingdom of heaven before people; for you do not enter[c][b], nor do you allow those who are entering to enter.
translation:
  language: fr
  text: 'Mais malheur à vous, scribes et pharisiens hypocrites ! Car vous fermez devant les gens le royaume des cieux[a] : vous-mêmes, vous n’y entrez pas, et vous ne laissez pas entrer ceux qui sont en train d’y entrer[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le royaume du ciel ». Matthieu emploie régulièrement cette expression là où d’autres contextes parlent du « royaume de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ceux qui cherchent à y entrer ». Le participe grec peut désigner ceux qui sont en train d’entrer ou qui s’efforcent d’entrer.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαὶ δὲ ὑμῖν
  choice: Mais quel malheur pour vous
  rationale: « Quel malheur pour vous » restitue la force de la dénonciation prophétique sans réduire οὐαί à une simple exclamation de tristesse ; « mais » marque la transition portée par δέ.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Dans le contexte évangélique, le terme désigne des experts et interprètes des Écritures et de la Loi ; cette formulation est plus immédiatement intelligible en français moderne que « scribes ».
- source_word: Φαρισαῖοι ὑποκριταί
  choice: pharisiens, hypocrites
  rationale: Le nom du groupe est rendu selon l’usage français établi, et « hypocrites » conserve l’accusation de duplicité religieuse.
- source_word: κλείετε
  choice: vous fermez
  rationale: Le verbe préserve l’image d’un accès fermé, sans ajouter explicitement l’idée de verrouillage.
- source_word: τὴν βασιλείαν τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Expression française consacrée qui conserve le pluriel de οὐρανῶν et la tournure caractéristique de Matthieu.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: devant les gens
  rationale: Rend la métaphore spatiale et le caractère générique de ἀνθρώπων dans un français naturel et inclusif.
- source_word: οὐκ εἰσέρχεσθε
  choice: vous n’y entrez pas
  rationale: Le pronom « y » explicite naturellement en français que l’entrée concerne le royaume déjà mentionné.
- source_word: τοὺς εἰσερχομένους
  choice: ceux qui sont en train d’y entrer
  rationale: Cette formulation préserve l’aspect progressif du participe présent et évite de décider qu’ils essaient seulement d’entrer.
- source_word: οὐδὲ … ἀφίετε εἰσελθεῖν
  choice: et vous ne laissez pas entrer
  rationale: « Laisser entrer » rend naturellement en français la construction permission + infinitif, tout en conservant explicitement l’idée d’entrée.
theological_decisions:
- issue: Sens de βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  alternative: le royaume du ciel
  rationale: Le pluriel français reflète directement οὐρανῶν et correspond à l’expression matthéenne traditionnelle, sans lui imposer une différence doctrinale avec « royaume de Dieu ».
- issue: Portée de τοὺς εἰσερχομένους
  choice: ceux qui sont en train d’y entrer
  alternative: ceux qui cherchent à y entrer
  rationale: Le participe grec présente ces personnes comme engagées dans l’entrée ; la traduction principale n’ajoute pas explicitement la notion de tentative, mais la note signale cette nuance contextuellement possible.
- issue: Référent générique de ἀνθρώπων
  choice: les gens
  alternative: les êtres humains
  rationale: « Les gens » exprime naturellement la portée humaine générale du grec, sans la restreindre aux hommes de sexe masculin.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « Spécialistes de la Loi » privilégie la clarté fonctionnelle ; « quel malheur pour vous » garde la vigueur prophétique. La répétition grecque liée au verbe « entrer » est allégée selon l’usage naturel du français, sans perte de contenu.
