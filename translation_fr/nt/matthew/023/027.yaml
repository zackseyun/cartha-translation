id: MAT.23.27
reference: Matthew 23:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι ⸀παρομοιάζετε τάφοις κεκονιαμένοις, οἵτινες ἔξωθεν μὲν φαίνονται ὡραῖοι ἔσωθεν δὲ γέμουσιν ὀστέων νεκρῶν καὶ πάσης ἀκαθαρσίας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/027.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you are like whitewashed tombs, which outwardly appear beautiful[b], but inwardly are full of dead people's bones and every kind of uncleanness.
translation:
  language: fr
  text: 'Malheur à vous, scribes et pharisiens, hypocrites ! En effet, vous ressemblez à des tombeaux blanchis à la chaux[a] : de l’extérieur, ils paraissent beaux, mais à l’intérieur, ils sont pleins d’ossements de morts et de toute impureté[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des tombeaux enduits de chaux ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, l’« impureté » peut évoquer à la fois l’impureté rituelle liée aux morts et la corruption morale.
    reason: cultural_note
lexical_decisions:
- source_word: Οὐαὶ
  choice: Malheur à vous
  rationale: Formule prophétique française qui conserve la force de dénonciation et de jugement de l’interjection grecque.
- source_word: γραμματεῖς
  choice: scribes
  rationale: Désignation historique précise et bien établie en français pour cette classe de spécialistes juifs des Écritures et de la Loi.
- source_word: Φαρισαῖοι
  choice: pharisiens
  rationale: Translittération française usuelle du nom de ce groupe.
- source_word: ὑποκριταί
  choice: hypocrites
  rationale: Rend directement l’accusation de duplicité religieuse et morale portée dans ce contexte.
- source_word: παρομοιάζετε
  choice: vous ressemblez à
  rationale: Expression française naturelle qui rend explicitement la comparaison sans imposer un passif maladroit.
- source_word: τάφοις κεκονιαμένοις
  choice: des tombeaux blanchis à la chaux
  rationale: Conserve l’image concrète de sépultures enduites de chaux et demeure immédiatement compréhensible.
- source_word: ἔξωθεν μὲν ... ἔσωθεν δὲ
  choice: de l’extérieur ... mais à l’intérieur
  rationale: Reproduit clairement et avec naturel l’opposition rhétorique entre apparence extérieure et réalité intérieure.
- source_word: φαίνονται ὡραῖοι
  choice: ils paraissent beaux
  rationale: Préserve à la fois la dimension visuelle et l’accent mis sur l’apparence.
- source_word: γέμουσιν
  choice: ils sont pleins de
  rationale: Rendu idiomatique du présent grec exprimant le contenu des tombeaux.
- source_word: ὀστέων νεκρῶν
  choice: ossements de morts
  rationale: Formulation française naturelle et précise, qui désigne les ossements de personnes décédées.
- source_word: πάσης ἀκαθαρσίας
  choice: toute sorte d’impureté
  rationale: Le singulier grec avec πάσης peut exprimer l’impureté sous toutes ses formes; ce rendu garde ouverte sa portée rituelle et morale.
theological_decisions:
- issue: Portée de ἀκαθαρσία dans la métaphore
  choice: impureté
  alternative: souillure rituelle ou corruption morale
  rationale: L’image des tombeaux évoque l’impureté rituelle dans le contexte juif, tandis que la dénonciation vise aussi la corruption intérieure. Le terme général « impureté » préserve cette double résonance sans la trancher.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’adresse solennelle, l’image concrète des tombeaux et le contraste marqué entre l’extérieur et l’intérieur. Les marqueurs de notes ont été placés auprès des expressions qu’ils expliquent.
