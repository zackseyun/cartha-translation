base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/014.yaml
  text: Woe[a] to you, scribes and Pharisees, hypocrites! For you devour widows' houses, and as a pretext make long prayers; therefore you will receive greater condemnation.
translation:
  language: fr
  text: Malheur à vous, scribes et pharisiens, hypocrites ! Vous dévorez les maisons des veuves et, pour la forme, vous faites de longues prières. C’est pourquoi vous recevrez une condamnation plus sévère.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ce verset est absent des plus anciens manuscrits grecs, notamment le Sinaïticus et le Vaticanus du IVe siècle, ainsi que des anciennes traductions coptes. Il est toutefois conservé dans la tradition byzantine majoritaire, l’ancienne version latine, la Vulgate et les versions syriaques. Il a probablement été ajouté plus tard par des copistes pour harmoniser ce passage avec Marc 12.40 et Luc 20.47. Dans les manuscrits qui le contiennent, sa place varie : avant ou après le verset 13.'
    reason: textual_critical
lexical_decisions:
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Dans ce contexte, le terme désigne des experts et enseignants de la loi religieuse, et non de simples copistes ; cette formulation moderne rend leur fonction intelligible.
- source_word: κατεσθίετε τὰς οἰκίας τῶν χηρῶν
  choice: vous dévorez les biens des veuves
  rationale: « Dévorer » conserve la métaphore énergique de l’exploitation impitoyable ; « les biens » exprime ici le sens probable de οἰκίας, c’est-à-dire le patrimoine ou les ressources du foyer.
- source_word: προφάσει
  choice: pour sauver les apparences
  rationale: Le datif adverbial indique que les longues prières servent de prétexte ou de façade. La formule française naturelle souligne leur fonction dissimulatrice sans préciser au-delà du grec ce qu’elles cachent.
- source_word: περισσότερον
  choice: plus sévère
  rationale: Associé à une condamnation, le comparatif désigne naturellement un degré accru de sévérité plutôt qu’une quantité matérielle.
- source_word: κρίμα
  choice: condamnation
  rationale: Le contexte punitif appelle « condamnation », tout en laissant entendre le jugement ou la sentence prononcée.
theological_decisions:
- issue: Rapport entre les longues prières et l’exploitation des veuves
  choice: Présenter les prières comme une façade sans définir précisément leur lien causal avec l’exploitation
  alternative: Comprendre qu’ils exploitent les veuves directement au moyen de longues prières
  rationale: La syntaxe grecque affirme la fonction de prétexte ou d’apparence, mais ne précise pas exactement le mécanisme de l’exploitation ; la traduction préserve cette ouverture.
- issue: Degré du jugement
  choice: une condamnation plus sévère
  alternative: une plus grande condamnation
  rationale: Cette formulation rend l’idée comparative de περισσότερον κρίμα en français idiomatique, sans expliquer sur quelle base exacte les degrés de condamnation sont établis.
translation_notes:
  register: Français international moderne, digne et direct. « Spécialistes de la Loi » évite le contresens contemporain de « scribes ». Le rythme accusateur du grec est conservé, tandis que « pour sauver les apparences » rend πρόφασις dans une langue courante et claire.
