  source_fidelity: La structure et le sens général sont fidèles au texte byzantin. Toutefois, « les biens des veuves » interprète οἰκίας (« maisons ») comme patrimoine et réduit l’image concrète conservée par le grec. « Pour sauver les apparences » rend l’idée de prétexte, mais l’expression française introduit plus explicitement le souci de réputation; « pour la forme » conserve mieux la valeur de façade sans préciser le mobile.
  naturalness: La formulation révisée reste naturelle en français international moderne tout en conservant le ton prophétique et accusateur. « Scribes » est le terme biblique usuel et identifiable; il est moins paraphrastique que « spécialistes de la Loi ».
  terminology: « Scribes », « pharisiens », « veuves », « prières », et « condamnation plus sévère » rendent adéquatement les termes et le registre du passage. La note textuelle est équilibrée et doit rester ancrée au verset entier.
