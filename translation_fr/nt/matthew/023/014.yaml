    rationale: Προφάσει désigne un prétexte, une couverture ou une apparence. « Pour sauver les apparences » est idiomatique, mais évoque plus particulièrement le maintien d’une réputation; « pour la forme » est plus proche de la valeur de façade.
  - severity: low
    issue: « spécialistes de la Loi » est une paraphrase de γραμματεῖς
    rationale: Le terme traditionnel « scribes » correspond directement au grec et est largement compris dans le français biblique moderne. La paraphrase ajoute une définition fonctionnelle qui n’est pas exprimée dans ce verset.
