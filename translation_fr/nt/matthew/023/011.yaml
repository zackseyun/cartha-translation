  text: ὁ δὲ μείζων ὑμῶν ἔσται ὑμῶν διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/011.yaml
  text: But the greatest among you will be your servant[a].
translation:
  language: fr
  text: Mais le plus grand parmi vous sera votre serviteur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « celui qui est plus grand parmi vous sera votre serviteur ». Le comparatif grec peut désigner ici, de manière idiomatique, la personne qui occupe le rang le plus élevé dans le groupe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec la recherche de titres et de rang évoquée dans le contexte précédent.
- source_word: μείζων
  choice: le plus grand
  rationale: Bien qu’il s’agisse morphologiquement d’un comparatif, le grec peut désigner idiomatiquement la personne qui occupe le rang le plus élevé au sein du groupe.
- source_word: ὑμῶν (première occurrence)
  choice: parmi vous
  rationale: 'Le génitif est partitif : il désigne celui qui est le plus grand à l’intérieur du groupe auquel Jésus s’adresse.'
- source_word: ἔσται
  choice: sera
  rationale: Le futur simple rend naturellement le futur grec en français moderne.
- source_word: ὑμῶν (deuxième occurrence)
  choice: votre
  rationale: Le génitif exprime la relation du serviteur avec les personnes auxquelles il rend service.
- source_word: διάκονος
  choice: serviteur
  rationale: Dans ce contexte, le terme désigne une personne qui se met au service des autres, sans renvoyer nécessairement à une fonction ecclésiale technique.
theological_decisions:
- issue: Le rapport entre grandeur et service dans l’enseignement de Jésus
  choice: « le plus grand parmi vous sera votre serviteur »
  alternative: « le plus grand parmi vous sera celui qui vous sert »
  rationale: La formulation conserve le renversement saisissant entre rang et service sans introduire une fonction ecclésiastique ultérieure ni atténuer la tension du propos.
translation_notes:
  register: Français international moderne, naturel et digne. « Serviteur » préserve l’image sociale et éthique du texte; « ministre » ou « diacre » donnerait ici une coloration institutionnelle injustifiée.
