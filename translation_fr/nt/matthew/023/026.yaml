id: MAT.23.26
reference: Matthew 23:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Φαρισαῖε τυφλέ, καθάρισον πρῶτον τὸ ἐντὸς τοῦ ποτηρίου ⸂καὶ τῆς παροψίδος⸃, ἵνα γένηται καὶ τὸ ἐκτὸς ⸀αὐτοῦ καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/026.yaml
  text: Blind Pharisee[a], first clean the inside of the cup and the dish, so that its outside also may become clean.
translation:
  language: fr
  text: Pharisien aveugle, nettoie d’abord l’intérieur de la coupe et du plat[a], afin que l’extérieur aussi devienne propre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’assiette », « du bol » ou « du plateau »; le mot grec désigne un récipient servant à présenter des aliments.
    reason: Alternative lexicale pour παροψίς, dont la forme précise n’est pas déterminée.
lexical_decisions:
- source_word: Φαρισαῖε τυφλέ
  choice: Pharisien aveugle
  rationale: Le vocatif singulier est rendu comme une interpellation directe et vigoureuse; l’adjectif conserve la métaphore de l’aveuglement sans l’expliciter.
- source_word: καθάρισον
  choice: nettoie
  rationale: L’impératif appelle une action décisive. « Nettoie » convient naturellement aux récipients tout en maintenant la portée morale implicite.
- source_word: πρῶτον
  choice: d’abord
  rationale: Exprime naturellement en français la priorité logique et temporelle marquée par le grec.
- source_word: τὸ ἐντὸς τοῦ ποτηρίου
  choice: l’intérieur de la coupe
  rationale: Rend directement l’opposition spatiale entre l’intérieur et l’extérieur; « coupe » est le terme courant dans ce contexte évangélique.
- source_word: καὶ τῆς παροψίδος
  choice: et du plat
  rationale: παροψίς désigne un récipient servant à présenter des aliments; « plat » reste naturel et suffisamment général.
- source_word: ἵνα γένηται
  choice: afin que … devienne
  rationale: Conserve à la fois la relation de but ou de résultat et la valeur dynamique de γίνομαι, plutôt qu’un simple état.
- source_word: καὶ τὸ ἐκτὸς αὐτοῦ
  choice: l’extérieur aussi
  rationale: Préserve le parallélisme intérieur/extérieur et la valeur additive de καί. Comme αὐτοῦ est singulier malgré deux récipients mentionnés, le français évite un possessif qui résoudrait artificiellement cette difficulté.
- source_word: καθαρόν
  choice: propre
  rationale: Maintient l’image concrète du nettoyage tout en laissant subsister sa portée morale.
theological_decisions:
- issue: Image concrète des récipients ou explicitation morale
  choice: Conserver l’image littérale du nettoyage intérieur et extérieur.
  alternative: Expliciter par une formulation telle que « purifie d’abord ta vie intérieure ».
  rationale: Le texte grec transmet sa réprimande morale par une métaphore concrète; l’expliciter dans le corps du verset réduirait sa force et dépasserait ce qui est formulé.
- issue: Rapport exprimé par ἵνα
  choice: « afin que », en conservant une nuance de but ou de résultat.
  alternative: « alors … sera », qui présenterait une conséquence plus catégorique.
  rationale: La construction grecque permet une relation téléologique ou résultative; la traduction choisie préserve cette tension sans imposer une explication théologique.
- issue: Référent singulier de αὐτοῦ après « la coupe et le plat »
  choice: Employer « l’extérieur » sans possessif explicite.
  alternative: « leur extérieur » ou « son extérieur ».
  rationale: Le grec porte un pronom singulier, dont l’accord après deux objets crée une difficulté réelle. « Leur » corrigerait le nombre, tandis que « son » privilégierait un seul antécédent; l’ellipse française préserve le sens sans trancher artificiellement.
translation_notes:
  register: Français international moderne, direct et digne. L’ordre « Pharisien aveugle » garde la force du vocatif grec. Le vocabulaire concret reste simple, et la construction « afin que … devienne » conserve la dynamique et l’ambiguïté relative du texte source.
