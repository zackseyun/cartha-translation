id: MAT.23.39
reference: Matthew 23:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, οὐ μή με ἴδητε ἀπ’ ἄρτι ἕως ἂν εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/039.yaml
  text: For I tell you[a], from now on you will certainly not see me until you say[b], ‘Blessed is he who comes in the name of the Lord.’
translation:
  language: fr
  text: 'Car, je vous le dis, désormais, vous ne me verrez certainement plus jusqu’à ce que vous disiez[a] : « Béni soit celui qui vient au nom du Seigneur ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citation ou allusion au Psaume 118.26.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: Car, je vous le dis
  rationale: La formule rend naturellement λέγω avec le datif ὑμῖν, tandis que « car » conserve la valeur explicative de γάρ et le lien avec la lamentation précédente.
- source_word: οὐ μή με ἴδητε
  choice: vous ne me verrez certainement plus
  rationale: οὐ μή suivi du subjonctif aoriste exprime une négation future fortement appuyée. « certainement » en garde l’intensité, et « plus », avec « désormais », indique la cessation à partir du moment présent sans transformer la phrase en négation absolue.
- source_word: ἀπ’ ἄρτι
  choice: désormais
  rationale: Ce terme marque le point de départ temporel présent. « Désormais » est actuel, digne et concis.
- source_word: ἕως ἂν εἴπητε
  choice: jusqu’à ce que vous disiez
  rationale: La tournure française avec le subjonctif rend naturellement la limite future et éventuelle exprimée par ἕως ἄν avec le subjonctif grec.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Béni soit celui qui vient
  rationale: « Béni soit » restitue la formule d’acclamation et sa résonance scripturaire; « celui qui vient » rend l’article avec le participe sans imposer un titre messianique plus explicite que le grec.
- source_word: ἐν ὀνόματι κυρίου
  choice: au nom du Seigneur
  rationale: Cette formulation française idiomatique conserve le sens et la cadence scripturaire; κύριος est rendu par « Seigneur ».
theological_decisions:
- issue: Moment et portée de la vision future et de l’acclamation
  choice: Conserver une déclaration solennelle d’absence jusqu’à une future acclamation, sans préciser l’événement visé.
  alternative: Identifier explicitement ce moment à l’entrée triomphale, au retour du Christ ou à une repentance future d’Israël.
  rationale: Le grec fixe une limite par « jusqu’à ce que », mais ne définit pas ici le moment historique ou eschatologique exact. La traduction préserve donc cette tension interprétative.
- issue: Valeur de ὁ ἐρχόμενος
  choice: celui qui vient
  alternative: le Messie qui vient
  rationale: L’expression peut avoir une portée messianique dans son contexte, mais le texte cité ne contient pas le mot « Messie »; l’ajouter résoudrait une implication théologique au niveau de la traduction.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. L’ordre de la phrase reste proche du grec, avec une ponctuation française fluide. La forte négation est rendue explicitement, tandis que la référence temporelle et la portée eschatologique demeurent ouvertes.
