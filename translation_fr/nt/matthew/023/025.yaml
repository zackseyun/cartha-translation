id: MAT.23.25
reference: Matthew 23:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐαὶ ὑμῖν, γραμματεῖς καὶ Φαρισαῖοι ὑποκριταί, ὅτι καθαρίζετε τὸ ἔξωθεν τοῦ ποτηρίου καὶ τῆς παροψίδος, ἔσωθεν δὲ γέμουσιν ἐξ ἁρπαγῆς καὶ ⸀ἀκρασίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/025.yaml
  text: Woe to you[a], scribes and Pharisees, hypocrites! For you clean the outside of the cup and the dish, but inside they are full of greed and self-indulgence.
translation:
  language: fr
  text: Malheur à vous, spécialistes de la Loi et pharisiens, hypocrites ! En effet, vous nettoyez l’extérieur de la coupe et du plat, mais à l’intérieur, ils sont pleins de rapacité et de manque de maîtrise de soi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de rapine (ou d’extorsion) et d’intempérance ». Les termes grecs peuvent désigner une appropriation violente ou abusive et le manque de maîtrise des désirs.'
    reason: Alternative lexicale préservant les sens plus concrets ou plus soutenus de ἁρπαγή et ἀκρασία.
lexical_decisions:
- source_word: Οὐαὶ ὑμῖν
  choice: Malheur à vous
  rationale: Conserve la force de la dénonciation prophétique, plutôt que de réduire l’expression à une simple lamentation.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Rend la fonction de ces experts des Écritures et de la Loi dans un français moderne plus transparent que le terme traditionnel « scribes ».
- source_word: Φαρισαῖοι
  choice: pharisiens
  rationale: Désignation française habituelle de ce groupe religieux.
- source_word: ὑποκριταί
  choice: hypocrites
  rationale: Terme établi qui exprime ici le décalage entre l’apparence religieuse et la réalité morale.
- source_word: καθαρίζετε
  choice: vous nettoyez
  rationale: Formulation courante qui convient au geste concret appliqué aux récipients.
- source_word: τὸ ἔξωθεν
  choice: l’extérieur
  rationale: Préserve clairement l’opposition spatiale avec « à l’intérieur ».
- source_word: ποτηρίου
  choice: coupe
  rationale: Équivalent naturel dans ce contexte de vaisselle de table.
- source_word: παροψίδος
  choice: plat
  rationale: Terme général et idiomatique pour un récipient ou plat de service, sans imposer la forme précise d’une assiette ou d’un bol.
- source_word: ἔσωθεν
  choice: à l’intérieur
  rationale: Maintient l’image concrète et son contraste avec l’extérieur.
- source_word: γέμουσιν
  choice: ils sont pleins
  rationale: Le verbe grec est au pluriel et renvoie naturellement à la coupe et au plat, tous deux masculins en français.
- source_word: ἁρπαγῆς
  choice: avidité
  rationale: Exprime le désir prédateur de s’emparer des biens d’autrui, tout en restant naturel en français ; la note conserve les sens plus concrets de vol et d’extorsion.
- source_word: ἀκρασίας
  choice: excès
  rationale: Rend de façon concise le dérèglement des désirs et la complaisance envers soi-même ; la note signale le sens explicite d’absence de maîtrise de soi.
theological_decisions:
- issue: Référent métaphorique de l’impureté intérieure
  choice: 'Conserver comme sujet la coupe et le plat : « ils sont pleins »'
  alternative: « mais intérieurement, vous êtes pleins d’avidité et d’excès »
  rationale: Le pluriel grec maintient grammaticalement l’image des deux récipients, même si ceux-ci représentent manifestement les responsables religieux. La traduction évite d’expliciter dans le corps du texte une interprétation que la métaphore laisse implicite.
translation_notes:
  register: Français international moderne, direct et digne. « Spécialistes de la Loi » évite le caractère technique ou ancien de « scribes ». L’opposition entre l’extérieur et l’intérieur ainsi que le pluriel de la métaphore sont conservés.
