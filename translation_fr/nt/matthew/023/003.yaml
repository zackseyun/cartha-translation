id: MAT.23.3
reference: Matthew 23:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντα οὖν ὅσα ⸀ἐὰν εἴπωσιν ὑμῖν ⸂ποιήσατε καὶ τηρεῖτε⸃, κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, λέγουσιν γὰρ καὶ οὐ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/003.yaml
  text: Therefore[a], do and keep everything they tell you, but do not do according to their works, for they say and do not do.
translation:
  language: fr
  text: Faites donc et observez tout ce qu’ils vous disent, mais n’agissez pas selon leurs œuvres[a], car ils disent et ne font pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais ne faites pas comme eux ».'
    reason: Alternative idiomatique pour κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε, qui exprime la conformité à leur conduite.
lexical_decisions:
- source_word: πάντα οὖν ὅσα ἐὰν
  choice: Faites donc… tout ce que
  rationale: « Tout ce que » restitue naturellement en français la portée globale de πάντα ὅσα ἐὰν, tandis que « donc » conserve la valeur inférentielle de οὖν.
- source_word: εἴπωσιν ὑμῖν
  choice: ils vous disent
  rationale: Cette formulation directe reste proche de λέγω sans préciser davantage la nature de leur parole.
- source_word: ποιήσατε καὶ τηρεῖτε
  choice: Faites… et observez
  rationale: « Faites » rend ποιέω directement; « observez » convient à τηρέω dans le contexte de prescriptions et maintient la distinction entre les deux impératifs.
- source_word: κατὰ δὲ τὰ ἔργα αὐτῶν μὴ ποιεῖτε
  choice: mais n’agissez pas selon leurs œuvres
  rationale: « Selon » conserve l’idée de conformité exprimée par κατά, et « œuvres » traduit ἔργα sans réduire le sens à un simple exemple comportemental. « N’agissez pas » évite en français la lourdeur de « ne faites pas selon ».
- source_word: λέγουσιν γὰρ καὶ οὐ ποιοῦσιν
  choice: car ils disent et ne font pas
  rationale: La formulation concise préserve l’opposition frappante entre leurs paroles et leurs actes, ainsi que l’écho de ποιέω.
theological_decisions:
- issue: Faut-il expliciter ici l’autorité enseignante des spécialistes de la Loi et des pharisiens mentionnés dans le contexte précédent?
  choice: Ne pas ajouter d’objet ou de précision absents du verset.
  alternative: « tout ce qu’ils vous enseignent » ou « tout ce qu’ils vous disent depuis le siège de Moïse »
  rationale: Le contexte immédiat identifie les personnes visées, mais le verset lui-même dit simplement « tout ce qu’ils vous disent ». L’explicitation risquerait d’interpréter au-delà du texte.
- issue: Faut-il atténuer la répétition de ποιέω?
  choice: Conserver l’écho par « Faites… n’agissez pas… ne font pas ».
  alternative: Varier davantage, par exemple « pratiquez… ne les imitez pas… ne mettent pas en pratique ».
  rationale: La répétition grecque souligne la contradiction entre parole et conduite. Le français la conserve autant que possible sans devenir artificiel.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant l’expression peu naturelle « ne faites pas selon leurs œuvres ». Le terme « œuvres » préserve le vocabulaire concret des actes; la note donne l’équivalent français plus idiomatique.
