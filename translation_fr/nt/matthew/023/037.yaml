  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ⸀ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυναγαγεῖν τὰ τέκνα σου, ὃν τρόπον ⸂ὄρνις ἐπισυνάγει⸃ τὰ νοσσία ⸀αὐτῆς ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/037.yaml
  text: Jerusalem[a], Jerusalem, the one who kills the prophets and stones those sent to her—how often I wanted to gather your children together, the way a hen gathers her chicks under her wings[b], and you were not willing!
translation:
  language: fr
  text: Jérusalem, Jérusalem, toi qui tues les prophètes et lapides ceux qui te sont envoyés — combien de fois ai-je voulu rassembler tes enfants, comme une poule[a] rassemble ses poussins sous ses ailes, et vous ne l’avez pas voulu !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi désigner un « oiseau » de façon plus générale ; l’image de petits rassemblés sous les ailes indique ici une poule.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: Jérusalem, Jérusalem
  rationale: Conserve le nom usuel en français ainsi que la répétition emphatique propre à la lamentation.
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: toi qui tues les prophètes et lapides
  rationale: La tournure « toi qui » rend naturellement en français les participes substantivés au présent et maintient leur valeur caractéristique ainsi que leur parallélisme.
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: ceux qui te sont envoyés
  rationale: Rend le participe passif et conserve la personnification de Jérusalem en adaptant naturellement la troisième personne grecque à l’adresse directe française.
- source_word: ποσάκις ἠθέλησα
  choice: Combien de fois ai-je voulu
  rationale: Expression française idiomatique qui conserve à la fois la lamentation et le sens de volonté ou de désir de θέλω.
- source_word: ἐπισυναγαγεῖν τὰ τέκνα σου
  choice: rassembler tes enfants
  rationale: « Rassembler » exprime la réunion indiquée par le verbe composé, tandis que « tes enfants » préserve la métaphore relationnelle sans en préciser excessivement le référent.
- source_word: ὄρνις
  choice: une poule
  rationale: Le mot grec peut désigner un oiseau plus généralement, mais l’image maternelle des petits abrités sous les ailes désigne naturellement une poule dans ce contexte.
- source_word: τὰ νοσσία αὐτῆς ὑπὸ τὰς πτέρυγας
  choice: ses poussins sous ses ailes
  rationale: « Poussins » convient à l’image de la poule et « sous ses ailes » reproduit fidèlement l’image protectrice.
- source_word: καὶ οὐκ ἠθελήσατε
  choice: mais vous ne l’avez pas voulu
  rationale: Le contraste appelle naturellement « mais » en français. Le pluriel « vous » conserve le passage remarquable de la ville personnifiée à la collectivité interpellée, et « voulu » maintient le lien lexical avec ἠθέλησα.
theological_decisions:
- issue: Contraste de volonté entre Jésus et les destinataires
  choice: Employer « ai-je voulu » puis « vous ne l’avez pas voulu »
  alternative: Renforcer le premier verbe par « j’avais décidé » ou réduire la phrase à un simple sentiment
  rationale: Le texte oppose réellement deux volontés sans expliquer ici leur articulation théologique. La traduction conserve cette tension sans la résoudre.
- issue: Référent de « tes enfants »
  choice: Conserver « tes enfants »
  alternative: Expliciter par « tes habitants » ou « ton peuple »
  rationale: La métaphore présente Jérusalem comme une ville personnifiée liée à ses enfants. L’expliciter davantage restreindrait inutilement le référent.
- issue: Passage du singulier au pluriel
  choice: « te sont envoyés » puis « vous ne l’avez pas voulu »
  alternative: Uniformiser au singulier ou au pluriel
  rationale: Le grec passe de la ville personnifiée au singulier à un verbe pluriel visant les personnes concernées. Ce changement significatif est préservé.
translation_notes:
  register: Français international moderne, courant et digne. L’adresse « toi qui » est naturelle dans une apostrophe solennelle. « Lapides » conserve avec précision le mode de mise à mort. La ponctuation souligne la lamentation sans atténuer le contraste final.
