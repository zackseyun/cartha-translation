  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἰδοὺ ἐγὼ ἀποστέλλω πρὸς ὑμᾶς προφήτας καὶ σοφοὺς καὶ γραμματεῖς· ⸀ἐξ αὐτῶν ἀποκτενεῖτε καὶ σταυρώσετε, καὶ ἐξ αὐτῶν μαστιγώσετε ἐν ταῖς συναγωγαῖς ὑμῶν καὶ διώξετε ἀπὸ πόλεως εἰς πόλιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/034.yaml
  text: Therefore, look, I am sending to you prophets and wise men and scribes. Some of them you will kill and crucify, and some of them you will flog in your synagogues and persecute from city to city.
translation:
  language: fr
  text: C’est pourquoi, voici que moi, je vous envoie des prophètes, des sages et des scribes[a]. Certains d’entre eux, vous les tuerez et les crucifierez ; certains d’entre eux, vous les fouetterez dans vos synagogues et vous les persécuterez de ville en ville.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les scribes étaient des personnes instruites qui enseignaient et interprétaient les Écritures et la Loi.
    reason: Explique le sens historique de γραμματεῖς sans substituer une paraphrase interprétative au terme du texte.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Exprime naturellement en français le lien logique avec ce qui précède.
- source_word: ἰδοὺ ἐγώ
  choice: voici, moi, je
  rationale: Conserve à la fois l’appel solennel à l’attention porté par ἰδού et l’insistance du pronom ἐγώ.
- source_word: γραμματεῖς
  choice: spécialistes des Écritures
  rationale: Dans ce contexte, le terme désigne des personnes instruites dans les Écritures plutôt que de simples copistes ; cette formulation moderne rend leur fonction intelligible.
- source_word: μαστιγώσετε
  choice: fouetterez
  rationale: Rend directement le châtiment corporel exprimé par le verbe grec.
- source_word: διώξετε ἀπὸ πόλεως εἰς πόλιν
  choice: vous les persécuterez de ville en ville
  rationale: Reproduit le mouvement continu de poursuite d’une ville à l’autre.
theological_decisions:
- issue: Identité de celui qui envoie les prophètes, les sages et les spécialistes des Écritures
  choice: Maintien de l’insistance « moi, je vous envoie »
  alternative: « je vais vous envoyer » sans mise en relief du sujet
  rationale: Le grec exprime explicitement ἐγώ et présente l’envoi au présent ; la traduction conserve cette affirmation forte sans en expliciter davantage la portée christologique.
- issue: Répartition des violences entre les envoyés
  choice: « certains d’entre eux » puis « d’autres »
  alternative: Répéter « certains d’entre eux » dans les deux propositions
  rationale: Le double ἐξ αὐτῶν indique des groupes pris parmi les envoyés, sans imposer que chaque supplice soit réservé à un groupe totalement distinct ; la formulation française reste naturelle sans résoudre excessivement leur répartition.
translation_notes:
  register: Français international moderne, digne et oralement fluide. « Voici » garde la solennité biblique de ἰδού, tandis que « spécialistes des Écritures » évite le sens moderne trompeur de « scribes ». La ponctuation distingue clairement les deux séries de persécutions.
