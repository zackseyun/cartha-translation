  to: C’est pourquoi, voici que moi, je vous envoie des prophètes, des sages et des scribes[a]. Certains d’entre eux, vous les tuerez et les crucifierez ; certains d’entre eux, vous les fouetterez dans vos synagogues et vous les persécuterez de ville en ville.
  rationale: La révision améliore l’idiomaticité tout en gardant l’emphase de « voici » et de « moi ». Elle restitue γραμματεῖς par son équivalent direct, avec une note explicative, et répète « certains d’entre eux » afin de ne pas trancher la question de savoir si les deux séries de violences concernent des groupes distincts.
