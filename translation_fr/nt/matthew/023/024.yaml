  text: ὁδηγοὶ τυφλοί, ⸀οἱ διϋλίζοντες τὸν κώνωπα τὴν δὲ κάμηλον καταπίνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/024.yaml
  text: Blind guides[a], straining out the gnat but swallowing the camel!
translation:
  language: fr
  text: Guides aveugles, vous filtrez pour retirer le moucheron[a], mais vous avalez le chameau !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec évoque le filtrage d’un liquide afin d’en retirer une impureté.
    reason: Précision lexicale et culturelle sur l’action décrite.
lexical_decisions:
- source_word: ὁδηγοὶ τυφλοί
  choice: Guides aveugles
  rationale: Cette traduction directe conserve l’apostrophe et l’image frappante de personnes qui prétendent conduire les autres tout en étant elles-mêmes aveugles.
- source_word: διϋλίζοντες
  choice: vous filtrez pour retirer
  rationale: Le verbe désigne l’action de passer un liquide au filtre afin d’en ôter un élément indésirable. Cette formulation explicite en français naturel que le moucheron est retiré, et non utilisé comme filtre.
- source_word: τὸν κώνωπα
  choice: le moucheron
  rationale: « Moucheron » désigne clairement un insecte minuscule et maintient le contraste proverbial avec le chameau.
- source_word: τὴν δὲ κάμηλον
  choice: mais […] le chameau
  rationale: « Mais » rend la valeur contrastive de δέ et souligne la disproportion absurde entre les deux actions.
- source_word: καταπίνοντες
  choice: vous avalez
  rationale: « Avalez » restitue directement l’image hyperbolique sans lui ajouter une nuance familière absente du grec.
theological_decisions:
- issue: Portée métaphorique de l’image liée à l’impureté
  choice: Conserver l’image concrète du minuscule moucheron retiré par filtrage et du chameau avalé.
  alternative: Expliciter l’opposition entre fautes mineures et fautes majeures.
  rationale: La force de la réprimande repose sur l’image délibérément absurde et disproportionnée. La conserver évite de réduire le texte à une explication morale et préserve ses possibles résonances liées à l’impureté.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. Le passage des participes grecs à des verbes conjugués avec « vous » rend l’apostrophe naturelle en français tout en conservant son intensité.
