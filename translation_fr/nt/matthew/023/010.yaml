  text: μηδὲ κληθῆτε καθηγηταί, ⸂ὅτι καθηγητὴς ὑμῶν ἐστιν εἷς⸃ ὁ χριστός·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/010.yaml
  text: Do not be called instructors, for you have one instructor, the Messiah[a].
translation:
  language: fr
  text: 'Ne vous faites pas appeler « guides » non plus, car vous n’avez qu’un seul guide[a] : le Messie[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec de « car vous n’avez qu’un seul guide » est incertain.
    reason: textual_uncertainty
  - marker: b
    text: Ou « le Christ ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδὲ
  choice: non plus
  rationale: Le terme rattache cette interdiction aux précédentes. « Non plus » conserve ce lien sans imposer un « et » peu naturel au début d’un verset isolé.
- source_word: κληθῆτε
  choice: vous faites appeler
  rationale: Cette tournure française naturelle exprime le fait de recevoir ou de revendiquer une appellation, tout en conservant le sens passif du grec dans ce contexte.
- source_word: καθηγηταί / καθηγητὴς
  choice: guides / guide
  rationale: καθηγητής désigne une personne qui conduit ou instruit. « Guide » est clair en français, convient à une appellation et évite de confondre ce terme avec διδάσκαλος, employé dans le contexte proche.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de l’interdiction ; « car » est concis et soutenu sans être archaïque.
- source_word: ὑμῶν ἐστιν εἷς
  choice: vous n’avez qu’un seul
  rationale: Cette reformulation idiomatique exprime naturellement en français l’unicité fortement affirmée par εἷς dans la construction grecque.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Avec l’article, Χριστός fonctionne ici clairement comme un titre. « Le Messie » en transmet le sens et le cadre juif, tandis que « le Christ » reste signalé en note.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le grec présente ici Χριστός comme un titre défini. « Le Messie » en rend directement le sens sans trancher davantage la portée christologique de l’affirmation.
- issue: Portée de l’unicité du καθηγητής
  choice: vous n’avez qu’un seul guide
  alternative: votre guide est un seul
  rationale: La formulation retenue conserve l’affirmation exclusive du grec tout en restant naturelle en français ; elle ne précise pas au-delà du texte la nature ou l’étendue de cette fonction.
translation_notes:
  register: Français international moderne, direct et digne. Les guillemets signalent que « guides » est ici une appellation. Le deux-points met naturellement en apposition l’identité de l’unique guide.
