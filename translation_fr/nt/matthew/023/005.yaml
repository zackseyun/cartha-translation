id: MAT.23.5
reference: Matthew 23:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντα δὲ τὰ ἔργα αὐτῶν ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις· πλατύνουσι ⸀γὰρ τὰ φυλακτήρια αὐτῶν καὶ μεγαλύνουσι τὰ ⸀κράσπεδα,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/023/005.yaml
  text: But they do all their works to be seen by people[b][a], for they widen their phylacteries and enlarge their tassels.
translation:
  language: fr
  text: Mais toutes leurs actions, ils les font pour être vus par les autres. En effet, ils élargissent leurs phylactères[a] et agrandissent les franges[b] de leurs vêtements.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les phylactères étaient de petits étuis en cuir contenant des passages de l’Écriture. Certains Juifs les portaient en application de textes tels que Deutéronome 6.8.
    reason: cultural_note
  - marker: b
    text: Ou « houppes ». Voir Nombres 15.38-39 au sujet des franges portées aux vêtements.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα δὲ τὰ ἔργα αὐτῶν
  choice: Mais toutes leurs actions
  rationale: « Mais » marque le contraste contextuel de δέ. « Toutes leurs actions » rend naturellement en français la totalité exprimée par πάντα avec ἔργα, sans la connotation particulière que pourrait avoir « œuvres ».
- source_word: ποιοῦσιν πρὸς τὸ θεαθῆναι τοῖς ἀνθρώποις
  choice: ils les font pour être vus des gens
  rationale: La tournure avec πρὸς τό et l’infinitif exprime le but. « Des gens » désigne ici les observateurs humains en général et évite un masculin inutilement restrictif.
- source_word: γὰρ
  choice: En effet
  rationale: Le connecteur introduit l’explication concrète de l’accusation précédente. « En effet » assure un enchaînement naturel en français moderne.
- source_word: πλατύνουσι τὰ φυλακτήρια αὐτῶν
  choice: ils élargissent leurs phylactères
  rationale: « Élargissent » conserve l’image physique de πλατύνουσι. « Phylactères » est le terme français précis pour ces étuis contenant des passages de l’Écriture; une note l’explique.
- source_word: μεγαλύνουσι τὰ κράσπεδα
  choice: agrandissent les franges de leurs vêtements
  rationale: Dans ce contexte juif, κράσπεδα désigne les franges rituelles portées au vêtement. L’ajout explicatif « de leurs vêtements » rend le référent immédiatement compréhensible sans modifier le sens.
theological_decisions:
- issue: Présenter les objets religieux juifs sans leur attribuer une valeur polémique intrinsèque
  choice: Employer « phylactères » et « franges de leurs vêtements », avec des notes culturelles
  alternative: Employer « boîtes de prière » et « houppes »
  rationale: Le reproche porte sur l’ostentation — l’élargissement et l’agrandissement destinés à attirer les regards — et non sur l’existence même de pratiques liées à l’observance de la Torah. Des termes précis accompagnés d’explications préservent cette distinction.
translation_notes:
  register: Français international moderne, digne et accessible. La dislocation « toutes leurs actions, ils les font » conserve l’accent placé par le grec sur la totalité de leurs actes. Les termes culturels précis sont expliqués en notes plutôt que remplacés par des paraphrases susceptibles d’être imprécises.
