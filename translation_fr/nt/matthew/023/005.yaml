- from: Mais toutes leurs actions, ils les font pour être vus des gens. En effet, ils élargissent leurs phylactères[a] et agrandissent les franges[b] de leurs vêtements.
  to: Mais toutes leurs actions, ils les font pour être vus par les autres. En effet, ils élargissent leurs phylactères[a] et agrandissent les franges[b] de leurs vêtements.
  rationale: Une correction limitée remplace la construction non idiomatique « vus des gens » par « vus par les autres ». « Les autres » exprime naturellement τοῖς ἀνθρώποις comme ensemble des observateurs humains, sans restriction de genre. Le reste du texte et les notes préservent fidèlement le sens et le cadre culturel du grec.
