source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος· Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου, ἐρεύξομαι κεκρυμμένα ἀπὸ ⸀καταβολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/035.yaml
  text: 'so that what was spoken through the prophet might be fulfilled[a], saying: “I will open my mouth in parables; I will utter things hidden from the foundation of the world.”'
translation:
  language: fr
  text: 'afin que s’accomplisse ce qui avait été dit par l’intermédiaire du prophète : « J’ouvrirai la bouche pour parler en paraboles ; je proclamerai des choses cachées depuis la fondation[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « depuis la fondation du monde ».'
    reason: textual_variant
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit ici le but ou le résultat dans la formule d’accomplissement de Matthieu ; « afin que » conserve cette valeur tout en restant naturel.
- source_word: πληρωθῇ
  choice: s’accomplisse
  rationale: Rend naturellement en français l’aoriste passif subjonctif et la formule matthéenne d’accomplissement.
- source_word: τὸ ῥηθὲν
  choice: ce qui avait été dit
  rationale: Expression idiomatique qui rend le participe substantivé et marque que la parole prophétique précède son accomplissement.
- source_word: διὰ τοῦ προφήτου
  choice: par l’intermédiaire du prophète
  rationale: Préserve la médiation exprimée par διά avec le génitif, sans réduire la formule à une simple attribution d’auteur.
- source_word: λέγοντος
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement la citation et évitent le lourd « disant » sans perdre la fonction du participe.
- source_word: Ἀνοίξω ἐν παραβολαῖς τὸ στόμα μου
  choice: J’ouvrirai la bouche pour parler en paraboles
  rationale: Conserve l’image poétique de l’ouverture de la bouche tout en explicitant naturellement en français la fonction de ἐν παραβολαῖς.
- source_word: ἐρεύξομαι
  choice: je proclamerai
  rationale: Le verbe évoque ce qui jaillit de la bouche ; « proclamerai » communique une parole exprimée ouvertement dans un registre digne, sans l’étrangeté de « éructerai ».
- source_word: κεκρυμμένα
  choice: des choses cachées
  rationale: Conserve la forme passive et l’état résultant du participe parfait, sans interpréter ces réalités comme des « secrets ».
- source_word: ἀπὸ καταβολῆς
  choice: depuis la fondation
  rationale: Suit le texte SBLGNT, qui ne comporte pas κόσμου (« du monde »), et maintient l’ellipse présente en grec.
theological_decisions:
- issue: Identification du prophète cité
  choice: le prophète
  alternative: Asaph le prophète
  rationale: Le texte grec fourni dit seulement « le prophète ». La traduction n’ajoute donc aucun nom, même si la citation vient du Psaume 78.2.
- issue: Portée de l’expression ἀπὸ καταβολῆς
  choice: depuis la fondation
  alternative: depuis la fondation du monde
  rationale: Le texte principal suit la forme courte du SBLGNT et préserve son ellipse. La forme longue, bien attestée dans la tradition manuscrite et plus explicite en français, est signalée en note plutôt qu’introduite silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour poétique de la citation est conservé, mais « disant » est remplacé par une ponctuation française idiomatique. L’ellipse « depuis la fondation » demeure volontairement dans le texte principal et est éclairée par la note.
