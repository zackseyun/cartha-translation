  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν δὲ τῷ καθεύδειν τοὺς ἀνθρώπους ἦλθεν αὐτοῦ ὁ ἐχθρὸς καὶ ⸀ἐπέσπειρεν ζιζάνια ἀνὰ μέσον τοῦ σίτου καὶ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/025.yaml
  text: But while the men were sleeping, his enemy came and sowed weeds among the wheat and went away.
translation:
  language: fr
  text: Mais pendant que les gens dormaient, son ennemi vint semer des mauvaises herbes parmi le blé, puis s’en alla.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους
  choice: les hommes
  rationale: Le contexte désigne les personnes chargées du champ; « les hommes » conserve ici la valeur humaine et plurielle du grec, sans remplacer le référent par une formulation plus générale.
- source_word: ζιζάνια
  choice: de la mauvaise herbe
  rationale: Le terme désigne probablement l’ivraie, plante nuisible ressemblant au blé dans sa jeunesse. « Mauvaise herbe » reste immédiatement compréhensible et préserve une certaine généralité lexicale.
- source_word: ἀνὰ μέσον τοῦ σίτου
  choice: au milieu du blé
  rationale: Rend naturellement l’idée que la mauvaise herbe a été semée parmi et à travers la culture de blé.
- source_word: ἐπέσπειρεν
  choice: sema
  rationale: Dans ce contexte, le préverbe peut suggérer un ensemencement par-dessus ou après le semis initial, mais le français « sema » exprime clairement l’action sans surinterprétation.
theological_decisions:
- issue: Identité de l’ennemi
  choice: son ennemi
  alternative: l’ennemi de celui-ci
  rationale: Le possessif grec αὐτοῦ renvoie naturellement au propriétaire ou maître mentionné dans la parabole; la traduction conserve ce lien sans anticiper l’explication symbolique ultérieure.
translation_notes:
  register: Français moderne, simple et digne. Le passé simple convient au récit parabolique écrit; la coordination brève reproduit la progression discrète et délibérée des actions de l’ennemi.
