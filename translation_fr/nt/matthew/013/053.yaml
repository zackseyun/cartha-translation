  text: καὶ ἐγένετο ὅτε ἐτέλεσεν ὁ Ἰησοῦς τὰς παραβολὰς ταύτας, μετῆρεν ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/053.yaml
  text: And when Jesus had finished these parables[a], he departed from there.
translation:
  language: fr
  text: Quand Jésus eut fini ces paraboles, il partit de là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἐγένετο ὅτε
  choice: Quand
  rationale: La tournure sémitisante sert ici de transition narrative et introduit une proposition temporelle. « Quand » en restitue naturellement la fonction en français moderne, sans alourdir le récit par « et il arriva que ».
- source_word: ἐτέλεσεν
  choice: eut fini de raconter
  rationale: Le verbe signifie mener à son terme. Le passé antérieur marque clairement que l'enseignement est achevé avant le départ; « raconter » explicite de façon naturelle l'action associée aux paraboles dans ce contexte.
- source_word: παραβολὰς ταύτας
  choice: ces paraboles
  rationale: « Paraboles » conserve le terme reconnu pour ce genre d'enseignement, tandis que « ces » renvoie à la série qui précède immédiatement.
- source_word: μετῆρεν
  choice: il partit
  rationale: Le verbe exprime le fait de quitter un lieu pour aller ailleurs. « Partit » est précis, naturel et dignifié, sans préciser une destination absente du texte.
- source_word: ἐκεῖθεν
  choice: de là
  rationale: Cette expression rend directement et idiomatiquement l'adverbe indiquant le lieu d'où Jésus part.
