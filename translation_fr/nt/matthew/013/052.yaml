id: MAT.13.52
reference: Matthew 13:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Διὰ τοῦτο πᾶς γραμματεὺς μαθητευθεὶς ⸂τῇ βασιλείᾳ⸃ τῶν οὐρανῶν ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδεσπότῃ ὅστις ἐκβάλλει ἐκ τοῦ θησαυροῦ αὐτοῦ καινὰ καὶ παλαιά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/052.yaml
  text: Then he said to them[c][b][a], “Therefore every scribe who has been trained for the kingdom of heaven is like a master of a house who brings out of his treasure new things and old.”
translation:
  language: fr
  text: 'Il leur dit alors : « C’est pourquoi tout scribe formé pour le royaume des cieux[a] est semblable à un maître de maison[b] qui tire de son trésor[c] du neuf et de l’ancien. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devenu disciple du royaume des cieux ». Le participe grec peut évoquer le fait d’être fait disciple aussi bien que celui d’être instruit ou formé.
    reason: alternative_reading
  - marker: b
    text: Ou « chef de maisonnée » ou « chef de famille ».
    reason: lexical_alternative
  - marker: c
    text: Le mot traduit par « trésor » peut aussi désigner une réserve ou un dépôt d’où l’on tire des biens précieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette tournure française naturelle marque l’inférence et maintient le lien avec l’échange précédent.
- source_word: πᾶς γραμματεὺς
  choice: tout scribe
  rationale: « Scribe » conserve le terme et le rôle du grec sans le réduire explicitement à celui de spécialiste de la Loi.
- source_word: μαθητευθεὶς
  choice: formé
  rationale: Le participe passif exprime une formation reçue et peut aussi évoquer le fait d’être fait disciple; « formé » reste idiomatique tout en laissant cette nuance être signalée en note.
- source_word: τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: pour le royaume des cieux
  rationale: Le datif inhabituel indique ici une orientation ou un rapport au royaume; « pour » préserve cette relation sans la préciser excessivement.
- source_word: ὅμοιός ἐστιν
  choice: est semblable à
  rationale: Formule claire et digne qui introduit naturellement la comparaison.
- source_word: ἀνθρώπῳ οἰκοδεσπότῃ
  choice: un maître de maison
  rationale: Cette expression rend le rôle d’autorité au sein de la maisonnée sans le réduire à la seule propriété du logement.
- source_word: ἐκβάλλει
  choice: tire
  rationale: Dans ce contexte, le verbe désigne l’action de faire sortir quelque chose d’une réserve; « tire de » est naturel en français.
- source_word: ἐκ τοῦ θησαυροῦ αὐτοῦ
  choice: de son trésor
  rationale: « Trésor » conserve à la fois l’idée de choses précieuses et, par métonymie, celle d’une réserve où elles sont gardées.
- source_word: καινὰ καὶ παλαιά
  choice: du neuf et de l’ancien
  rationale: La nominalisation française rend naturellement les adjectifs neutres substantivés et respecte leur ordre dans le grec.
theological_decisions:
- issue: Sens de μαθητευθεὶς en rapport avec le scribe et le royaume
  choice: Un scribe formé pour le royaume des cieux
  alternative: Un scribe devenu disciple du royaume des cieux
  rationale: Le grec permet d’entendre aussi bien une formation reçue que l’entrée dans la condition de disciple. Le texte principal exprime la dimension formative sans réduire l’image à une conversion ni à une instruction purement scolaire; la note conserve l’autre possibilité.
- issue: Portée de οἰκοδεσπότης
  choice: maître de maison
  alternative: chef de famille ou maître de maisonnée
  rationale: Ce choix maintient la fonction domestique et l’autorité impliquées par la métaphore, sans en tirer de conclusion doctrinale ou sociale étrangère au verset.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. « Scribe » conserve la désignation historique; « du neuf et de l’ancien » donne à la conclusion une formulation française concise et mémorable.
