id: MAT.13.19
reference: Matthew 13:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παντὸς ἀκούοντος τὸν λόγον τῆς βασιλείας καὶ μὴ συνιέντος, ἔρχεται ὁ πονηρὸς καὶ ἁρπάζει τὸ ἐσπαρμένον ἐν τῇ καρδίᾳ αὐτοῦ· οὗτός ἐστιν ὁ παρὰ τὴν ὁδὸν σπαρείς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/019.yaml
  text: When anyone hears the word of the kingdom and does not understand it[a], the evil one comes and snatches away what has been sown in his heart[b]. This is the one sown beside the road.
translation:
  language: fr
  text: Quand quelqu’un entend la parole du royaume sans la comprendre, le Mauvais vient et arrache ce qui a été semé dans son cœur. C’est celui qui a été semé au bord du chemin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le long du chemin » ou « près du chemin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παντὸς ἀκούοντος
  choice: Quand quelqu’un entend
  rationale: La construction grecque au génitif exprime ici un cas général. Cette formulation est naturelle en français et conserve la portée distributive de πᾶς.
- source_word: λόγον τῆς βασιλείας
  choice: la parole du royaume
  rationale: « Parole » préserve le lien imagé entre la parole et la semence, tandis que le complément « du royaume » garde la concision et l’ambiguïté relationnelle du grec.
- source_word: μὴ συνιέντος
  choice: sans la comprendre
  rationale: Le participe coordonné décrit l’absence de compréhension de la parole entendue. Le pronom « la » renvoie clairement à « la parole ».
- source_word: ὁ πονηρὸς
  choice: le Mauvais
  rationale: L’adjectif substantivé avec article désigne très probablement ici un agent personnel. « Le Mauvais » est clair, digne et n’ajoute pas une identification absente du verset.
- source_word: ἁρπάζει
  choice: arrache
  rationale: Le verbe exprime une saisie brusque et énergique. « Arrache » conserve cette force et convient à l’image de ce qui a été semé.
- source_word: τὸ ἐσπαρμένον
  choice: ce qui a été semé
  rationale: Cette formulation rend naturellement le participe parfait passif substantivé et maintient l’état résultant de l’ensemencement.
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: dans son cœur
  rationale: La traduction directe conserve le terme anthropologique biblique « cœur » ainsi que le singulier représentatif du grec.
- source_word: ὁ παρὰ τὴν ὁδὸν σπαρείς
  choice: celui qui a été semé au bord du chemin
  rationale: La formulation maintient l’identification métaphorique étonnante entre l’auditeur et ce qui est semé, sans la normaliser en « terrain ». « Au bord du chemin » rend naturellement παρά avec l’accusatif dans ce contexte.
theological_decisions:
- issue: Identité de ὁ πονηρὸς
  choice: un agent personnel désigné comme « le Mauvais »
  alternative: le mal comme réalité abstraite
  rationale: L’action de venir et d’arracher favorise une lecture personnelle, mais la traduction n’identifie pas explicitement cet agent à Satan puisque le verset ne le nomme pas.
- issue: Identification du semé dans la dernière proposition
  choice: « celui qui a été semé »
  alternative: « ce qui a été semé » ou une reformulation désignant le terrain
  rationale: Le masculin singulier grec désigne l’auditeur en l’identifiant par métaphore à l’élément semé. La traduction conserve cette tension dans l’image plutôt que de l’expliquer.
- issue: Genre du pronom αὐτοῦ
  choice: « son cœur »
  alternative: « leur cœur » ou « le cœur »
  rationale: Le possessif français singulier convient au référent générique « quelqu’un » et reflète le nombre du grec sans rendre le masculin visible, puisque la forme française « son » est commandée par le nom masculin « cœur ».
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure accessible tout en conservant les images de la parole-semence, du cœur et de la personne « semée ». Le marqueur [a] est placé après « chemin », auquel porte la variante.
