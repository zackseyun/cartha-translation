id: MAT.13.28
reference: Matthew 13:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἔφη αὐτοῖς· Ἐχθρὸς ἄνθρωπος τοῦτο ἐποίησεν. οἱ δὲ ⸂δοῦλοι αὐτῷ λέγουσιν⸃· Θέλεις οὖν ἀπελθόντες ⸀συλλέξωμεν αὐτά;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/028.yaml
  text: He said to them[a], “An enemy did this.” Then the slaves said to him, “Do you want us to go and gather them up?”
translation:
  language: fr
  text: 'Il leur dit : « Un ennemi a fait cela. » Les esclaves[a] lui disent alors : « Veux-tu donc que nous allions les ramasser ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le grec peut désigner des esclaves ou des serviteurs selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: Il leur dit
  rationale: Le verbe courant de parole est rendu directement et naturellement, sans ajouter explicitement l’idée de réponse.
- source_word: Ἐχθρὸς ἄνθρωπος
  choice: Un ennemi
  rationale: En français idiomatique, ἄνθρωπος individualise ici l’ennemi sans exiger une traduction distincte telle que « un homme ennemi ».
- source_word: τοῦτο ἐποίησεν
  choice: a fait cela
  rationale: Le passé composé convient au dialogue en français moderne et restitue clairement le démonstratif τοῦτο.
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le terme conserve la condition de dépendance et la hiérarchie sociale indiquées par δοῦλοι dans le cadre de la maisonnée; « serviteurs » reste une possibilité contextuelle signalée en note.
- source_word: λέγουσιν
  choice: lui disent
  rationale: Le présent narratif grec est conservé par un présent français, possible et vivant dans ce récit.
- source_word: Θέλεις
  choice: Veux-tu
  rationale: Traduction claire et actuelle de la volonté ou du désir exprimé par θέλω.
- source_word: οὖν
  choice: donc
  rationale: Le mot marque ici la conséquence pratique tirée de l’explication du maître.
- source_word: ἀπελθόντες
  choice: que nous allions
  rationale: La construction française avec « aller » subordonnée à « veux-tu » restitue naturellement le déplacement préalable exprimé par le participe.
- source_word: συλλέξωμεν αὐτά
  choice: les ramasser
  rationale: « Ramasser » exprime l’action de réunir et d’enlever les mauvaises herbes sans introduire explicitement l’idée d’arrachage, absente du verbe grec.
theological_decisions:
- issue: Traduction de δοῦλοι dans le cadre de la parabole
  choice: esclaves
  alternative: serviteurs
  rationale: « Esclaves » rend plus explicitement le statut social de dépendance. Comme « serviteurs » peut convenir au rôle exercé dans cette maisonnée et est fréquent dans la tradition française, cette possibilité est conservée en note sans faire dépendre l’interprétation théologique de l’un ou l’autre terme.
translation_notes:
  register: Français international moderne, simple et digne. Le dialogue reste direct; le présent narratif de λέγουσιν est conservé, tandis que « donc » maintient le lien logique de la question avec l’explication précédente.
