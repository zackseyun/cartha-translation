  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰς ἀκάνθας, καὶ ἀνέβησαν αἱ ἄκανθαι καὶ ⸀ἔπνιξαν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/007.yaml
  text: Other seeds fell among the thorns[a], and the thorns came up and choked them.
translation:
  language: fr
  text: D’autres graines tombèrent parmi les épines[a], et les épines poussèrent et les étouffèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur les épines ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: D’autres graines
  rationale: L’adjectif neutre pluriel est employé substantivement et renvoie implicitement aux graines mentionnées dans le contexte. Le nom « graines » est explicité pour produire un français clair et naturel.
- source_word: δὲ
  choice: et
  rationale: Ici, δέ assure une transition légère dans la suite du récit plutôt qu’une opposition marquée.
- source_word: ἔπεσεν
  choice: tombèrent
  rationale: Le verbe πίπτω signifie directement « tomber ». Le pluriel français s’accorde avec « graines », malgré la forme verbale grecque au singulier avec un sujet neutre pluriel.
- source_word: ἐπὶ τὰς ἀκάνθας
  choice: parmi les épines
  rationale: ἐπί avec l’accusatif signifie littéralement « sur », mais, dans ce contexte agricole, « parmi les épines » exprime naturellement que les graines sont tombées dans un endroit où poussaient des plantes épineuses.
- source_word: ἀκάνθας / ἄκανθαι
  choice: épines
  rationale: « Épines » est une désignation française courante qui peut évoquer ici les plantes épineuses aussi bien que le terrain qu’elles occupent.
- source_word: ἀνέβησαν
  choice: poussèrent
  rationale: Dans le contexte de plantes, « poussèrent » rend naturellement l’idée de monter ou de sortir de terre portée par ἀναβαίνω.
- source_word: ἔπνιξαν
  choice: étouffèrent
  rationale: Le verbe πνίγω signifie « étouffer » ou « étrangler ». « Étouffèrent » conserve l’image vive de plantes qui privent les jeunes pousses d’espace et de ressources.
- source_word: αὐτά
  choice: les
  rationale: Le pronom neutre pluriel renvoie aux graines ou aux pousses qui en proviennent. Le pronom français « les » préserve cette référence sans l’expliciter davantage.
