  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὴν γῆν τὴν καλὴν καὶ ἐδίδου καρπόν, ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/008.yaml
  text: But other seed fell on the good soil and was producing fruit—one a hundredfold, another sixty, and another thirty.
translation:
  language: fr
  text: 'Mais d’autres grains tombèrent sur la bonne terre et donnaient du fruit : l’un cent fois autant, un autre soixante, un autre trente.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « certains cent fois autant, certains soixante, certains trente ». La construction grecque est distributive et permet les deux formulations.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: d’autres grains
  rationale: L’adjectif neutre pluriel substantivé renvoie, dans le contexte de la parabole, aux grains semés; « grains » est explicité pour obtenir un français naturel.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec les grains tombés sur des terrains improductifs.
- source_word: ἔπεσεν
  choice: tombèrent
  rationale: Le verbe signifie littéralement « tomber »; le pluriel français s’accorde avec « d’autres grains » sans remplacer l’image par « furent semés ».
- source_word: ἐπὶ τὴν γῆν τὴν καλὴν
  choice: sur la bonne terre
  rationale: Dans ce contexte agricole, « bonne terre » désigne un sol fertile et reste une formulation française naturelle et traditionnelle.
- source_word: ἐδίδου καρπόν
  choice: donnaient du fruit
  rationale: L’imparfait grec présente une production en cours ou caractéristique; l’imparfait français en conserve l’aspect, tandis que « fruit » maintient l’image du texte.
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: l’un cent fois autant, un autre soixante, un autre trente
  rationale: La tournure distributive distingue les divers rendements. « Fois autant » explicite le rapport de multiplication sous-entendu par les nombres, sans ajouter une unité étrangère au contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait « donnaient » rend la valeur durative de ἐδίδου; la série distributive conserve la variation des rendements sans interprétation théologique ajoutée.
