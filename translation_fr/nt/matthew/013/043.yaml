source:
  edition: SBLGNT
  text: Τότε οἱ δίκαιοι ἐκλάμψουσιν ὡς ὁ ἥλιος ἐν τῇ βασιλείᾳ τοῦ πατρὸς αὐτῶν. ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/043.yaml
  text: Then the righteous will shine like the sun in the kingdom of their Father. The one who has ears, let him hear.
translation:
  language: fr
  text: Alors les justes resplendiront comme le soleil dans le royaume de leur Père. Que celui qui a des oreilles entende !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement la suite temporelle et eschatologique de l’explication précédente.
- source_word: οἱ δίκαιοι
  choice: les justes
  rationale: Équivalent français courant et traditionnel qui conserve les dimensions morale et relationnelle du terme sans les préciser excessivement.
- source_word: ἐκλάμψουσιν
  choice: resplendiront
  rationale: Rend la lumière éclatante exprimée par ἐκλάμπω et s’accorde naturellement avec la comparaison au soleil.
- source_word: ὡς ὁ ἥλιος
  choice: comme le soleil
  rationale: Formulation française directe et naturelle de la comparaison.
- source_word: ἐν τῇ βασιλείᾳ
  choice: dans le royaume
  rationale: La construction est ici naturellement locative; « royaume » préserve aussi l’idée de la souveraineté royale.
- source_word: τοῦ πατρὸς αὐτῶν
  choice: de leur Père
  rationale: Suit étroitement le grec sans ajouter « céleste », absent du verset.
- source_word: ὁ ἔχων ὦτα
  choice: celui qui a des oreilles
  rationale: Conserve le singulier représentatif masculin du grec dans une tournure française actuelle et naturelle.
- source_word: ἀκουέτω
  choice: entende
  rationale: Le subjonctif dans « Que… entende » rend l’impératif grec à la troisième personne et maintient le jeu entre l’audition et l’accueil véritable du message.
theological_decisions:
- issue: Singulier masculin représentatif dans l’exhortation finale
  choice: « Que celui qui a des oreilles entende ! »
  alternative: « Que quiconque a des oreilles entende ! » ou une formulation au pluriel
  rationale: La formulation choisie préserve le singulier grammatical et sa portée représentative sans limiter l’appel aux hommes.
- issue: Sens de βασιλεία dans ce contexte
  choice: « royaume »
  alternative: « règne »
  rationale: La préposition et l’image décrivent naturellement la sphère eschatologique où resplendissent les justes; « royaume » convient à cette dimension sans exclure l’exercice de la royauté divine.
translation_notes:
  register: Français international moderne, digne et accessible. « Resplendiront » maintient l’intensité lumineuse du verbe grec sans exiger de note lexicale. La clausule conserve la forme solennelle de l’appel à entendre.
