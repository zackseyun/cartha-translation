  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/042.yaml
  text: and they will throw them into the furnace of fire[b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: fr
  text: et ils les jetteront dans la fournaise de feu. Là, il y aura des pleurs et des grincements de dents.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Le connecteur simple est conservé pour maintenir la continuité avec le verset précédent.
- source_word: βαλοῦσιν αὐτοὺς
  choice: ils les jetteront
  rationale: « Jeter » exprime naturellement en français moderne l’action énergique de βάλλω, tandis que « les » reprend sans explicitation le groupe mentionné auparavant.
- source_word: κάμινον τοῦ πυρός
  choice: la fournaise de feu
  rationale: Cette formulation reproduit clairement la construction génitive grecque et conserve l’image concrète du jugement sans la remplacer par un terme doctrinal plus précis.
- source_word: ἐκεῖ
  choice: Là
  rationale: « Là » restitue directement la valeur locative et désigne avec force le lieu qui vient d’être mentionné.
- source_word: κλαυθμός
  choice: des pleurs
  rationale: « Pleurs » est une formulation française naturelle et traditionnelle qui exprime l’affliction sans en préciser excessivement la nature.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: des grincements de dents
  rationale: Cette expression française idiomatique et bien établie conserve l’image du grec sans décider si elle traduit surtout la douleur, le désespoir ou la rage.
theological_decisions:
- issue: Nature de l’image de la fournaise de feu
  choice: Conserver littéralement la métaphore concrète du jugement.
  alternative: Paraphraser par « le feu de l’enfer » ou intensifier par « la fournaise ardente ».
  rationale: Le texte présente une image vive sans employer ici un terme doctrinal technique; la traduction ne doit ni l’atténuer ni en préciser davantage la portée.
- issue: Portée des pleurs et des grincements de dents
  choice: Conserver la formule sans expliquer l’état intérieur qu’elle représente.
  alternative: L’interpréter exclusivement comme du chagrin, de la douleur ou de la rage.
  rationale: La formule évoque une détresse extrême dans le contexte du jugement, mais son éventail émotionnel ne doit pas être artificiellement réduit.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle; « Là » placé en tête de la seconde phrase conserve l’insistance locative de ἐκεῖ.
