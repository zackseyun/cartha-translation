  text: ὁ δὲ ἀγρός ἐστιν ὁ κόσμος· τὸ δὲ καλὸν σπέρμα, οὗτοί εἰσιν οἱ υἱοὶ τῆς βασιλείας· τὰ δὲ ζιζάνιά εἰσιν οἱ υἱοὶ τοῦ πονηροῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/038.yaml
  text: The field is the world[a], and the good seed—these are the sons of the kingdom. And the weeds are the sons of the evil one[c][b],
translation:
  language: fr
  text: Le champ, c’est le monde ; la bonne semence, ce sont les fils du royaume. Quant aux mauvaises herbes[a], ce sont les fils du Mauvais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément, « l’ivraie ».
    reason: lexical_alternative
  - marker: b
    text: 'Ici, « fils » est une expression relationnelle : elle désigne ceux qui appartiennent respectivement au royaume et au Mauvais.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀγρός
  choice: champ
  rationale: Terme naturel dans le cadre agricole de la parabole, qui en conserve clairement l’image.
- source_word: κόσμος
  choice: monde
  rationale: Rend le sens large du domaine où se déroule l’action, sans le restreindre.
- source_word: καλὸν σπέρμα
  choice: bonne semence
  rationale: Expression agricole courante qui maintient le contraste entre ce qui est semé et la mauvaise herbe.
- source_word: οὗτοί εἰσιν
  choice: ce sont
  rationale: Le pluriel masculin grec désigne les personnes représentées par le nom collectif singulier « semence » ; « ce sont » rend naturellement ce passage de l’image à ses référents.
- source_word: υἱοὶ τῆς βασιλείας
  choice: fils du royaume
  rationale: Conserve l’expression relationnelle du grec et le vocabulaire matthéen du royaume, sans effacer sa forme masculine.
- source_word: ζιζάνια
  choice: mauvaise herbe
  rationale: Formulation moderne et accessible ; dans le contexte, le terme peut désigner plus précisément l’ivraie, précision gardée en note.
- source_word: τοῦ πονηροῦ
  choice: du Mauvais
  rationale: L’article et le masculin singulier favorisent un référent personnel. « le Mauvais » préserve le lien lexical avec πονηρός sans ajouter explicitement un nom absent du grec.
theological_decisions:
- issue: Sens personnel ou abstrait de τοῦ πονηροῦ
  choice: du Mauvais
  alternative: du mal
  rationale: La construction grecque avec l’article au masculin singulier, après « fils », appuie une désignation personnelle. La traduction ne précise toutefois pas davantage l’identité que ne le fait ce verset.
- issue: Portée de υἱοὶ
  choice: fils
  alternative: enfants
  rationale: « Fils » correspond formellement au masculin pluriel grec et conserve l’idiome d’appartenance ; une note précise que l’expression désigne ceux qui appartiennent au groupe, sans limiter nécessairement le propos aux hommes.
translation_notes:
  register: Français international moderne, digne et oralement naturel. La structure en trois identifications parallèles est conservée ; « quant à » rend le dernier δέ avec clarté. Le point-virgule évite une coordination française pesante tout en maintenant le parallélisme.
