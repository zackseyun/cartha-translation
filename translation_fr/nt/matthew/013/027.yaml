id: MAT.13.27
reference: Matthew 13:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: προσελθόντες δὲ οἱ δοῦλοι τοῦ οἰκοδεσπότου εἶπον αὐτῷ· Κύριε, οὐχὶ καλὸν σπέρμα ⸀ἔσπειρας ἐν τῷ σῷ ἀγρῷ; πόθεν οὖν ἔχει ζιζάνια;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/027.yaml
  text: So the slaves of the master of the house came to him and said[a], ‘Lord, did you not sow good seed in your field? Where then do the weeds come from?’
translation:
  language: fr
  text: 'Alors, les esclaves du maître de maison vinrent lui dire : « Seigneur, n’as-tu pas semé de la bonne semence dans ton champ ? D’où viennent donc les mauvaises herbes[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ivraie » ; le terme grec désigne probablement une plante nuisible qui ressemble au blé durant les premiers stades de sa croissance.
    reason: Précision lexicale et botanique concernant ζιζάνια.
lexical_decisions:
- source_word: προσελθόντες … εἶπον αὐτῷ
  choice: vinrent lui dire
  rationale: Cette tournure française naturelle rend le participe aoriste comme une action accompagnant et précédant le verbe principal, tout en conservant le mouvement vers le maître.
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le terme désigne ici des personnes placées sous l’autorité et dans la dépendance du maître de maison. « Esclaves » préserve ce statut social sans l’atténuer en « serviteurs ».
- source_word: οἰκοδεσπότου
  choice: maître de maison
  rationale: Cette expression conserve à la fois la dimension domestique du composé grec et la relation d’autorité envers les esclaves.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif est un titre respectueux adressé au maître. « Seigneur » maintient le rendu usuel de κύριος et laisse subsister la résonance possible du récit sans imposer une interprétation.
- source_word: οὐχὶ καλὸν σπέρμα ἔσπειρας
  choice: n’as-tu pas semé de la bonne semence
  rationale: La question grecque appelle une réponse affirmative. La formulation française en conserve la force et le vocabulaire agricole précis.
- source_word: ἐν τῷ σῷ ἀγρῷ
  choice: dans ton champ
  rationale: Le possessif français exprime clairement la possession marquée par σῷ, sans ajout inutile.
- source_word: πόθεν οὖν ἔχει ζιζάνια
  choice: D’où viennent donc les mauvaises herbes
  rationale: Le grec interroge leur origine. Cette restructuration idiomatique rend clairement πόθεν et οὖν, alors qu’une traduction littérale de ἔχει serait maladroite en français.
- source_word: ζιζάνια
  choice: mauvaises herbes
  rationale: Expression immédiatement compréhensible en français moderne. Le terme grec désigne probablement l’ivraie, précision conservée en note.
theological_decisions:
- issue: Statut des δοῦλοι dans le cadre domestique de la parabole
  choice: esclaves
  alternative: serviteurs
  rationale: Le passage ne formule pas un enseignement sur l’esclavage, mais le mot grec indique une condition de dépendance qu’il convient de ne pas neutraliser.
- issue: Valeur du vocatif Κύριε
  choice: Seigneur
  alternative: Maître
  rationale: Dans le dialogue, le mot sert d’adresse respectueuse au maître de maison. « Seigneur » conserve toutefois la valeur habituelle de κύριος et l’éventuelle portée narrative, sans la transformer en affirmation christologique explicite.
translation_notes:
  register: Français international moderne, naturel et digne. « Vinrent lui dire » évite une construction participiale lourde ; « mauvaises herbes » privilégie la compréhension immédiate, tandis que la note conserve le terme traditionnel et plus précis « ivraie ».
