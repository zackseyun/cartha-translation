  text: ⸀Συνήκατε ταῦτα πάντα; λέγουσιν αὐτῷ· ⸀Ναί.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/051.yaml
  text: Have you understood all these things? They said to him[a], “Yes.”
translation:
  language: fr
  text: '« Avez-vous compris tout cela ? » Ils lui répondirent : « Oui. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνήκατε
  choice: Avez-vous compris
  rationale: L’aoriste indicatif à la deuxième personne du pluriel envisage ici la compréhension acquise à l’issue de l’enseignement qui précède. Le passé composé rend naturellement cette perspective en français.
- source_word: ταῦτα πάντα
  choice: tout cela
  rationale: Le neutre pluriel grec désigne l’ensemble des enseignements et paraboles précédents. « Tout cela » est l’expression française naturelle et conserve la portée globale de la formule.
- source_word: λέγουσιν αὐτῷ
  choice: Ils lui répondirent
  rationale: Le présent historique grec est rendu au passé simple, conformément au registre narratif français. Dans ce dialogue, « répondre » exprime naturellement la fonction de leur parole, même si λέγω signifie littéralement « dire ».
- source_word: Ναί
  choice: Oui
  rationale: La réponse grecque se limite à l’affirmation ναί. Aucun titre ou terme d’adresse n’est ajouté.
theological_decisions:
- issue: Faut-il ajouter un titre de respect à la réponse des disciples ?
  choice: Conserver la simple réponse « Oui. »
  alternative: « Oui, Seigneur. »
  rationale: Le texte grec de la SBLGNT ne contient que ναί. Ajouter « Seigneur » introduirait un élément dévotionnel absent du texte source.
translation_notes:
  register: Français moderne, clair et digne. Le passé composé dans la question rend l’accompli grec avec naturel ; le passé simple maintient un registre narratif écrit sans lourdeur. Aucune note n’est nécessaire, car « Avez-vous compris » transmet directement la nuance aspectuelle pertinente.
