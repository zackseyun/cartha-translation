  source_fidelity: La traduction rend correctement le repère temporel, la sortie de la maison et la proximité de la mer. Toutefois, ἐκάθητο est un imparfait, qui présente Jésus dans la posture de quelqu’un qui est assis; « s’assit » privilégie une entrée dans cette posture et affaiblit cet aspect imperfectif.
  naturalness: « Ce jour-là, Jésus sortit de la maison et était assis près de la mer » est grammaticalement possible mais peu naturel en français narratif. Une formulation participiale permet de conserver naturellement la relation entre la sortie et l’état décrit.
