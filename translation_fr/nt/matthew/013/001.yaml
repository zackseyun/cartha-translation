source:
  edition: SBLGNT
  text: ⸀Ἐν τῇ ἡμέρᾳ ἐκείνῃ ἐξελθὼν ὁ Ἰησοῦς ⸀τῆς οἰκίας ἐκάθητο παρὰ τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/001.yaml
  text: On that day Jesus went out of the house and sat beside the sea[a][b].
translation:
  language: fr
  text: Ce jour-là[a], Jésus, sorti de la maison, était assis près de la mer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ce même jour », si l’expression souligne la continuité avec le contexte précédent plutôt qu’un simple repère temporel.
    reason: alternative_reading
  - marker: b
    text: Ou « au bord de la mer ». L’expression grecque indique une position près de la mer sans préciser la distance exacte par rapport à la rive.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: Ce jour-là
  rationale: Expression temporelle idiomatique en français moderne. Elle renvoie au jour en question sans ajouter explicitement l’idée de « même », qui reste toutefois possible selon le contexte.
- source_word: ἐξελθὼν … τῆς οἰκίας
  choice: sortit de la maison
  rationale: Le participe aoriste indique une sortie antérieure ou étroitement liée à la scène principale. La coordination française rend naturellement le mouvement hors de la maison.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Translittération française traditionnelle et courante du nom propre.
- source_word: ἐκάθητο
  choice: s’assit
  rationale: Dans cette suite narrative, le passé simple exprime naturellement le fait que Jésus prend place. L’imparfait grec peut aussi présenter la posture comme une situation en cours, mais « était assis » s’articule moins naturellement avec sa sortie de la maison.
- source_word: παρὰ τὴν θάλασσαν
  choice: près de la mer
  rationale: παρά avec l’accusatif situe Jésus à proximité de la mer sans préciser qu’il se trouve exactement sur la rive. « Mer » conserve le terme grec θάλασσα sans l’interpréter ici comme « lac ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient au registre narratif biblique sans être archaïque; « près de la mer » évite de préciser davantage que le grec la position exacte de Jésus.
