  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ βαλοῦσιν αὐτοὺς εἰς τὴν κάμινον τοῦ πυρός· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/050.yaml
  text: and they will throw them into the furnace of fire[a]. In that place there will be weeping and gnashing of teeth.
translation:
  language: fr
  text: Et ils les jetteront dans la fournaise ardente[a]. Là, il y aura des pleurs et des grincements de dents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, littéralement : « la fournaise de feu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαλοῦσιν
  choice: ils les jetteront
  rationale: Le futur de βάλλω exprime ici l’action de jeter avec force. « Jetteront » est naturel en français moderne et conserve la vigueur de l’image.
- source_word: αὐτοὺς
  choice: les
  rationale: Le pronom accusatif masculin pluriel renvoie aux mauvais mentionnés dans le contexte précédent; le pronom objet français suffit.
- source_word: κάμινον τοῦ πυρός
  choice: la fournaise de feu
  rationale: Cette formulation reproduit de près la construction grecque et conserve l’image biblique concrète, tout en restant compréhensible en français.
- source_word: ἐκεῖ
  choice: Là
  rationale: L’adverbe indique avec insistance le lieu évoqué. « Là » est direct, naturel et suffisamment solennel dans ce contexte.
- source_word: ἔσται
  choice: il y aura
  rationale: La tournure existentielle française rend naturellement le futur de εἰμί suivi des deux noms désignant ce qui se produira.
- source_word: ὁ κλαυθμὸς
  choice: des pleurs
  rationale: κλαυθμός désigne les pleurs ou les lamentations. « Des pleurs » est clair et n’accentue pas indûment l’idée de cris.
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: des grincements de dents
  rationale: « Grincements de dents » est l’expression française consacrée et exacte pour cette formule récurrente chez Matthieu.
theological_decisions:
- issue: Rendu des images du jugement dans le contexte eschatologique
  choice: Conserver les images concrètes de « la fournaise de feu », des « pleurs » et des « grincements de dents » sans les atténuer ni les expliquer dans le corps du texte.
  alternative: Employer « la fournaise ardente » ou paraphraser la dernière proposition en explicitant l’angoisse.
  rationale: Le grec présente directement ces images sévères. La traduction doit préserver leur force et leur tension théologique sans préciser au-delà du texte leur nature ou leur portée.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination initiale « et » est conservée pour respecter le lien avec le verset précédent; la formule matthéenne traditionnelle demeure concrète sans archaïsme marqué.
