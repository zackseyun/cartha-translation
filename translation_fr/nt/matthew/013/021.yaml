source:
  edition: SBLGNT
  text: οὐκ ἔχει δὲ ῥίζαν ἐν ἑαυτῷ ἀλλὰ πρόσκαιρός ἐστιν, γενομένης δὲ θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον εὐθὺς σκανδαλίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/021.yaml
  text: Yet he has no root in himself[a], but is temporary. When affliction or persecution arises because of the word[b], he immediately falls away.
translation:
  language: fr
  text: 'Mais il n’a pas de racine en lui-même : il ne dure qu’un temps. Lorsque survient la détresse ou la persécution à cause de la parole, il trébuche aussitôt[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il tombe » ou « il se détourne ». Le verbe grec évoque littéralement le fait de trébucher; dans ce contexte, il peut désigner le fait de céder sous l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτῷ
  choice: de racine en lui-même
  rationale: Conserve l’image agricole de la racine et la valeur réflexive de l’expression grecque, sans explicitation interprétative.
- source_word: πρόσκαιρός
  choice: ne tient qu’un temps
  rationale: Expression française naturelle qui indique une durée limitée et prépare le contraste avec l’épreuve qui suit.
- source_word: γενομένης ... θλίψεως ἢ διωγμοῦ
  choice: dès que survient la détresse ou la persécution
  rationale: La proposition participiale au génitif a ici une valeur temporelle. « Survient » restitue l’apparition de l’épreuve, tandis que « détresse » exprime la pression pénible de θλῖψις.
- source_word: διὰ τὸν λόγον
  choice: à cause de la parole
  rationale: Préserve le lien lexical avec λόγος dans la parabole; « la parole » désigne naturellement le message proclamé dans ce contexte.
- source_word: εὐθὺς
  choice: dès que
  rationale: L’immédiateté est exprimée idiomatiquement par la construction « Dès que… », sans qu’il soit nécessaire d’ajouter « aussitôt ».
- source_word: σκανδαλίζεται
  choice: il abandonne
  rationale: Dans ce contexte, le verbe décrit la défection provoquée par la détresse ou la persécution. « Abandonne » communique ce résultat tout en évitant de préciser indûment l’objet ou un système doctrinal.
theological_decisions:
- issue: Portée de σκανδαλίζεται dans un contexte de mise à l’épreuve du disciple
  choice: il abandonne
  alternative: il trébuche; il tombe; il se détourne
  rationale: Le contexte décrit quelqu’un qui accueille d’abord la parole, mais ne persévère pas sous la pression. « Il abandonne » rend la défection effective sans trancher les questions doctrinales relatives à l’apostasie; une note conserve l’étendue métaphorique du grec.
translation_notes:
  register: Français international moderne, simple et digne. La métaphore de la racine et l’expression évangélique « la parole » sont conservées. La phrase est structurée naturellement en français, et l’immédiateté de εὐθὺς est intégrée à « Dès que ».
