review_pass:
  verdict: revise
  source_fidelity: La structure et les termes principaux sont bien rendus. Toutefois, « Dès que » porte à la fois la valeur temporelle de γενομένης et l’immédiateté de εὐθύς; il est préférable de rendre explicitement ce dernier par « aussitôt ». « Il abandonne », sans complément, est moins idiomatique et restreint davantage σκανδαλίζεται que ne le fait nécessairement le grec.
  naturalness: « Il ne tient qu’un temps » est compréhensible, mais « il ne dure qu’un temps » correspond plus directement à πρόσκαιρός. « Il trébuche aussitôt » conserve l’image verbale grecque et reste naturel dans le registre évangélique; la note explicite les sens contextuels possibles.
  terminology: « Racine », « détresse », « persécution » et « la parole » sont fidèles et appropriés. La note doit présenter « se détourne » comme effet contextuel possible, sans présenter le verbe grec comme signifiant de façon univoque « être amené à chuter ».
  issues:
  - severity: medium
    issue: L’immédiateté de εὐθύς n’est pas explicitement rendue.
    rationale: « Dès que survient » exprime le moment où l’épreuve apparaît, mais ne dit pas clairement qu’il trébuche immédiatement. Ajouter « aussitôt » préserve les deux éléments du grec.
  - severity: medium
    issue: « Il abandonne » est elliptique et trop déterminé pour σκανδαλίζεται.
    rationale: En français, l’objet de « abandonner » demeure implicite, tandis que σκανδαλίζεται garde l’image de l’achoppement et peut désigner, contextuellement, une défection. « Il trébuche » préserve cette ouverture; une note indique les autres possibilités.
