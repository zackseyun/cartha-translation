id: MAT.13.54
reference: Matthew 13:54
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὴν πατρίδα αὐτοῦ ἐδίδασκεν αὐτοὺς ἐν τῇ συναγωγῇ αὐτῶν, ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν· Πόθεν τούτῳ ἡ σοφία αὕτη καὶ αἱ δυνάμεις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/054.yaml
  text: And coming to his hometown[a], he was teaching them in their synagogue, so that they were astonished and said, “Where did this man get this wisdom and these powers?”
translation:
  language: fr
  text: 'Il se rendit dans sa ville d’origine et les enseignait dans leur synagogue. Ils en étaient si stupéfaits qu’ils disaient : « D’où lui viennent cette sagesse et ces actes de puissance[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « miracles » ; littéralement « puissances », c’est-à-dire des actes manifestant une puissance extraordinaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρίδα
  choice: ville d’origine
  rationale: Dans ce contexte, le mot désigne l’endroit où Jésus avait grandi et où il était connu, plutôt qu’une patrie au sens national. « Ville d’origine » exprime clairement ce sens local en français moderne.
- source_word: ἐδίδασκεν
  choice: enseignait
  rationale: L’imparfait grec présente l’enseignement comme une action en cours ; l’imparfait français en conserve naturellement l’aspect.
- source_word: συναγωγῇ
  choice: synagogue
  rationale: Dans ce cadre juif, « synagogue » est le terme institutionnel et concret le plus clair.
- source_word: ὥστε ἐκπλήσσεσθαι αὐτοὺς καὶ λέγειν
  choice: Ils en étaient si stupéfaits qu’ils disaient
  rationale: Cette tournure française naturelle exprime le résultat introduit par ὥστε et conserve la forte réaction indiquée par ἐκπλήσσομαι.
- source_word: Πόθεν τούτῳ
  choice: D’où lui viennent
  rationale: Πόθεν interroge l’origine ou la source. La construction avec « lui » reste idiomatique et laisse entendre la mise à distance exprimée par le démonstratif τούτῳ sans alourdir la phrase par « cet homme ».
- source_word: σοφία
  choice: sagesse
  rationale: Équivalent français direct et courant, désignant ici la sagesse remarquable reconnue dans l’enseignement de Jésus.
- source_word: δυνάμεις
  choice: actes de puissance
  rationale: Le pluriel peut désigner des œuvres extraordinaires ou miraculeuses. « Actes de puissance » conserve à la fois l’idée de puissance et la référence contextuelle à des actes, sans imposer le terme plus interprétatif « miracles ».
theological_decisions:
- issue: Sens de δυνάμεις à propos des œuvres extraordinaires de Jésus
  choice: actes de puissance
  alternative: miracles
  rationale: Le texte évoque l’activité extraordinaire de Jésus sans employer le terme grec habituellement traduit directement par « miracle ». « Actes de puissance » préserve la force lexicale et la légère ouverture de l’expression grecque, tandis qu’une note signale l’interprétation courante.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase grecque participiale est restructurée en deux phrases pour la clarté. « Ville d’origine » évite le sens national que « patrie » pourrait suggérer, et « actes de puissance » maintient l’ambiguïté lexicale de δυνάμεις.
