  yaml_path: translation/nt/matthew/013/003.yaml
  text: 'And he spoke many things to them in parables, saying: “Look, the sower went out to sow.”'
translation:
  language: fr
  text: 'Il leur dit beaucoup de choses en paraboles, en disant : « Voici, le semeur est sorti pour semer. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  choice: longuement
  rationale: Dans l’expression ἐλάλησεν αὐτοῖς πολλὰ, le pluriel neutre signifie qu’il leur dit beaucoup de choses; « parla longuement » l’exprime naturellement en français sans alourdir la phrase.
- source_word: ἐν παραβολαῖς
  choice: en paraboles
  rationale: Expression française consacrée et fidèle au pluriel grec, qui désigne le mode d’enseignement employé.
- source_word: Ἰδού
  choice: Écoutez !
  rationale: Interjection attirant vivement l’attention sur ce qui suit. Dans ce contexte oral, « Écoutez ! » est plus naturel que le littéral et vieilli « Voici ! », tout en conservant sa fonction discursive.
- source_word: ὁ σπείρων
  choice: le semeur
  rationale: Le participe substantivé désigne celui qui sème; « le semeur » est précis, courant et approprié à la parabole.
- source_word: ἐξῆλθεν ... τοῦ σπείρειν
  choice: sortit pour semer
  rationale: L’infinitif au génitif exprime ici le but; la formulation française conserve simplement le mouvement et sa finalité.
