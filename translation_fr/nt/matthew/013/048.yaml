  text: ἣν ὅτε ἐπληρώθη ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλὸν καὶ καθίσαντες συνέλεξαν τὰ καλὰ εἰς ⸀ἄγγη, τὰ δὲ σαπρὰ ἔξω ἔβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/048.yaml
  text: When it was filled[a], they pulled it up onto the shore, sat down, and gathered the good fish into containers[b], but threw the rotten ones out.
translation:
  language: fr
  text: Quand il fut plein, ils le tirèrent sur le rivage, puis s’assirent. Ils recueillirent les bons poissons dans des récipients[a], mais jetèrent dehors les mauvais poissons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des contenants ». Le mot grec est général et ne désigne pas nécessairement des paniers.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi signifier « pourris », « gâtés » ou « sans valeur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἣν ὅτε ἐπληρώθη
  choice: Quand il fut plein
  rationale: Le pronom relatif renvoie au filet mentionné au verset précédent. Cette formulation naturelle en français conserve l’idée que le filet est arrivé à pleine capacité.
- source_word: ἀναβιβάσαντες ἐπὶ τὸν αἰγιαλόν
  choice: ils le tirèrent sur le rivage
  rationale: Le participe décrit l’action de remonter le filet hors de l’eau jusqu’à la rive. « Tirèrent » convient au contexte sans préciser davantage la méthode.
- source_word: καθίσαντες
  choice: puis s’assirent
  rationale: Le participe aoriste marque ici l’action suivante dans la séquence; « puis » rend clairement cette progression narrative.
- source_word: συνέλεξαν τὰ καλά
  choice: Ils recueillirent les bons poissons
  rationale: « Recueillirent » exprime l’action de rassembler lors du tri. Le nom « poissons », implicite en grec, est explicité en français pour rendre le référent naturel et clair.
- source_word: εἰς ἄγγη
  choice: dans des récipients
  rationale: ἄγγη est un terme général désignant des contenants; « récipients » évite de préciser sans preuve qu’il s’agissait de paniers.
- source_word: τὰ δὲ σαπρά
  choice: mais les mauvais
  rationale: σαπρά peut évoquer ce qui est pourri, gâté ou sans valeur. « Les mauvais » reste naturel dans la scène de tri et préserve l’étendue du sens, explicitée en note.
- source_word: ἔξω ἔβαλον
  choice: jetèrent
  rationale: Le complément « les mauvais » et le contraste avec la mise dans les récipients rendent déjà l’exclusion évidente; « jetèrent » conserve la force du rejet sans lourdeur.
theological_decisions:
- issue: Interprétation du tri dans la parabole
  choice: Présenter concrètement la scène de pêche et de tri
  alternative: Employer des termes anticipant explicitement le jugement final
  rationale: Ce verset expose encore l’image parabolique; son interprétation théologique vient dans les versets suivants. La traduction n’importe donc pas cette explication dans la scène elle-même.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est divisée en deux phrases pour préserver un déroulement naturel sans perdre la succession des participes grecs. Les acteurs restent exprimés par « ils », comme l’implique la forme plurielle du grec, sans ajouter dans le texte principal qu’il s’agit de pêcheurs.
