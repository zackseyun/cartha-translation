  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔσπειρεν ἐν τῷ ἀγρῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/031.yaml
  text: He set another parable before them, saying, “The kingdom of heaven is like a mustard seed, which a man took and sowed in his field.”
translation:
  language: fr
  text: 'Il leur présenta une autre parabole en disant : « Le royaume des cieux est semblable à une graine de moutarde qu’un homme a prise et semée dans son champ. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέθηκεν
  choice: proposa
  rationale: Dans ce contexte, παρατίθημι signifie présenter ou soumettre une parabole à un auditoire. « Proposa » est naturel en français et conserve l’idée de mettre la parabole devant eux.
- source_word: παραβολὴν
  choice: parabole
  rationale: « Parabole » est le terme usuel et précis pour ce genre d’enseignement dans les Évangiles synoptiques.
- source_word: Ὁμοία ἐστὶν
  choice: est semblable à
  rationale: Cette formule française, claire et digne, reproduit directement la formule comparative grecque sans expliciter davantage l’objet précis de la comparaison.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Cette traduction consacrée conserve l’expression caractéristique de Matthieu et laisse au terme « royaume » sa portée à la fois royale et territoriale.
- source_word: κόκκῳ σινάπεως
  choice: une graine de moutarde
  rationale: κόκκος désigne ici une graine. « Graine de moutarde » est l’expression moderne la plus immédiatement compréhensible en français.
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: qu’un homme a prise
  rationale: La proposition participiale grecque est rendue naturellement par une relative coordonnée. « Un homme » conserve l’acteur masculin singulier du récit, et l’accord « prise » se fait avec « graine ».
- source_word: ἔσπειρεν
  choice: semée
  rationale: σπείρω signifie précisément semer ; ce choix préserve l’image agricole mieux que « planter ».
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: dans son champ
  rationale: « Champ » est l’équivalent simple et exact de ἀγρός dans ce contexte agricole, et le possessif est maintenu.
theological_decisions:
- issue: Traduction de l’expression matthéenne βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  alternative: le règne des cieux
  rationale: « Le royaume des cieux » maintient la formulation caractéristique de Matthieu et ne réduit pas βασιλεία à la seule notion abstraite d’exercice du pouvoir. La formulation conserve ainsi l’étendue possible du grec.
- issue: Portée de la comparaison introduite par Ὁμοία ἐστὶν
  choice: est semblable à une graine de moutarde
  alternative: peut être comparé à ce qui arrive lorsqu’un homme prend une graine de moutarde
  rationale: La traduction conserve la formulation concise et potentiellement ouverte du grec, sans décider si le royaume est comparé exclusivement à la graine ou à l’ensemble de la scène parabolique.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation avec deux-points introduit naturellement les paroles rapportées. Aucun archaïsme ni terme confessionnel ajouté.
