id: MAT.13.15
reference: Matthew 13:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπαχύνθη γὰρ ἡ καρδία τοῦ λαοῦ τούτου, καὶ τοῖς ὠσὶν βαρέως ἤκουσαν, καὶ τοὺς ὀφθαλμοὺς αὐτῶν ἐκάμμυσαν· μήποτε ἴδωσιν τοῖς ὀφθαλμοῖς καὶ τοῖς ὠσὶν ἀκούσωσιν καὶ τῇ καρδίᾳ συνῶσιν καὶ ἐπιστρέψωσιν, καὶ ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/015.yaml
  text: For this people's heart has grown dull[a], and with their ears they hear heavily, and they have closed their eyes, lest they should see with their eyes and hear with their ears and understand with their heart and turn back[c][b], and I will heal them.
translation:
  language: fr
  text: En effet, le cœur de ce peuple est devenu insensible[a] ; ils ont eu du mal à entendre et ils ont fermé les yeux, de peur qu’ils voient de leurs yeux, entendent de leurs oreilles, comprennent avec leur cœur, reviennent[b], et que je les guérisse.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’est épaissi » ou « est devenu gras » ; ici, l’expression évoque un cœur devenu insensible.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « se tourner » ou « retourner ».'
    reason: lexical_alternative
  - marker: c
    text: Citation d’Ésaïe 6.9–10.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαχύνθη
  choice: est devenu insensible
  rationale: Le verbe signifie littéralement « s’est épaissi/engraissé » ; appliqué au cœur, il décrit l’insensibilité ou l’engourdissement intérieur. La formulation française est naturelle tout en conservant le sens de la métaphore.
- source_word: καρδία
  choice: cœur
  rationale: Rendu biblique courant pour le centre de la compréhension et des dispositions intérieures ; le lien explicite avec « comprendre » invite à conserver ce terme.
- source_word: λαοῦ τούτου
  choice: de ce peuple
  rationale: Reproduit naturellement le génitif et maintient l’accent démonstratif de τούτου.
- source_word: βαρέως ἤκουσαν
  choice: ils ont entendu difficilement
  rationale: Conserve l’aoriste et rend idiomatiquement l’idée littérale d’une écoute « lourde », donc pénible ou déficiente, sans préciser indûment si elle est physique ou volontaire.
- source_word: ἐκάμμυσαν
  choice: ils ont fermé
  rationale: Préserve l’aoriste actif et donc la responsabilité explicite du peuple dans l’action de fermer les yeux.
- source_word: μήποτε
  choice: de peur de
  rationale: Expression française actuelle qui garde la force négative de crainte, de but ou de résultat, sans dissiper la tension du passage.
- source_word: ἴδωσιν ... ἀκούσωσιν ... συνῶσιν
  choice: voir ... entendre ... comprendre
  rationale: Les infinitifs coordonnés après « de peur de » rendent avec fluidité les subjonctifs grecs et préservent leur progression rhétorique.
- source_word: ἐπιστρέψωσιν
  choice: revenir
  rationale: Le verbe exprime un retournement ou un retour, souvent avec une portée spirituelle. « Revenir » conserve cette direction sans introduire le vocabulaire confessionnel de la conversion.
- source_word: ἰάσομαι
  choice: que je les guérisse
  rationale: Dans la construction française régie par « de peur de », le subjonctif exprime naturellement l’aboutissement redouté. Le sens lexical de guérison et l’action divine sont conservés.
theological_decisions:
- issue: Tension entre jugement divin et responsabilité humaine dans la proposition introduite par μήποτε
  choice: de peur de voir ... de revenir, et que je les guérisse
  alternative: sinon ils verraient ... reviendraient, et je les guérirais
  rationale: La traduction garde la force de surface de μήποτε et le rôle actif du peuple, qui ferme ses propres yeux. Elle ne tranche pas entre une nuance stricte de but, de résultat ou une description judiciaire ironique.
- issue: Portée de ἐπιστρέφω
  choice: revenir
  alternative: se tourner / retourner
  rationale: « Revenir » permet la lecture relationnelle et spirituelle du contexte sans imposer une terminologie doctrinale plus développée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’accumulation solennelle de la citation prophétique. « Entendu difficilement » reste volontairement proche de l’expression grecque inhabituelle, tandis que les répétitions « yeux », « oreilles » et « cœur » sont maintenues.
