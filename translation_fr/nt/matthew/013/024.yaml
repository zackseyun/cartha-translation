id: MAT.13.24
reference: Matthew 13:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν παρέθηκεν αὐτοῖς λέγων· Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ ⸀σπείραντι καλὸν σπέρμα ἐν τῷ ἀγρῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/024.yaml
  text: He set another parable before them[a], saying, “The kingdom of heaven is like a man who sowed good seed in his field.”
translation:
  language: fr
  text: 'Il leur proposa une autre parabole : « Le royaume des cieux est comparable à un homme qui a semé de la bonne semence dans son champ. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλην παραβολὴν
  choice: une autre parabole
  rationale: Cette expression introduit naturellement une parabole supplémentaire dans la suite du récit.
- source_word: παρέθηκεν αὐτοῖς
  choice: Il leur proposa
  rationale: Le verbe signifie ici présenter ou soumettre un enseignement. « Proposer une parabole » est idiomatique en français et conserve l'idée de la placer devant les auditeurs.
- source_word: λέγων
  choice: en disant
  rationale: Le participe relie directement l'introduction narrative aux paroles citées.
- source_word: Ὡμοιώθη
  choice: est comparable à
  rationale: Dans cette formule parabolique, cette tournure française rend naturellement l'aoriste passif sans suggérer que le royaume aurait subi un changement d'état.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Expression française consacrée qui conserve le pluriel caractéristique de la formule matthéenne.
- source_word: ἀνθρώπῳ
  choice: un homme
  rationale: Le personnage masculin de la parabole est désigné avec précision.
- source_word: σπείραντι
  choice: qui avait semé
  rationale: Le plus-que-parfait marque naturellement en français l'action accomplie qui caractérise l'homme au moment de la comparaison.
- source_word: καλὸν σπέρμα
  choice: de la bonne semence
  rationale: La formulation agricole naturelle exprime la bonne qualité de ce qui a été semé et prépare le contraste avec la mauvaise herbe.
- source_word: ἐν τῷ ἀγρῷ αὐτοῦ
  choice: dans son champ
  rationale: Traduction directe et idiomatique, le possessif renvoyant à l'homme.
theological_decisions:
- issue: Formule matthéenne du royaume
  choice: le royaume des cieux
  alternative: le règne des cieux
  rationale: « Royaume des cieux » préserve la terminologie caractéristique de Matthieu et reste immédiatement compréhensible, sans réduire βασιλεία au seul territoire ni imposer ici une interprétation particulière.
- issue: Valeur de Ὡμοιώθη dans l'introduction de la parabole
  choice: est comparable à
  alternative: a été rendu semblable à
  rationale: La formulation retenue conserve explicitement le rapport de comparaison et évite le caractère artificiel d'un passif littéral. Elle ne prétend pas que chaque détail du royaume correspond directement à l'homme seul plutôt qu'à l'ensemble de la scène parabolique.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde la structure d'introduction de la parabole tout en évitant un calque lourd du grec.
