id: MAT.13.2
reference: Matthew 13:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ συνήχθησαν πρὸς αὐτὸν ὄχλοι πολλοί, ὥστε αὐτὸν ⸀εἰς πλοῖον ἐμβάντα καθῆσθαι, καὶ πᾶς ὁ ὄχλος ἐπὶ τὸν αἰγιαλὸν εἱστήκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/002.yaml
  text: And large crowds gathered to him[a], so that he got into a boat and sat down[b], and the whole crowd stood on the shore.
translation:
  language: fr
  text: De grandes foules se rassemblèrent auprès de lui, si bien qu’il monta dans une barque et s’assit, tandis que toute la foule se tenait sur le rivage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήχθησαν πρὸς αὐτόν
  choice: se rassemblèrent auprès de lui
  rationale: Le passif aoriste se rend naturellement en français par le pronominal « se rassemblèrent ». « Auprès de lui » exprime le mouvement vers Jésus et la proximité qui en résulte sans imposer l’image plus précise d’un cercle autour de lui.
- source_word: ὄχλοι πολλοί
  choice: de grandes foules
  rationale: Cette formulation française naturelle conserve le pluriel de ὄχλοι et rend l’ampleur exprimée par πολλοί.
- source_word: ὥστε
  choice: si bien que
  rationale: « Si bien que » introduit clairement la conséquence produite par l’affluence, conformément à la valeur résultative de ὥστε.
- source_word: εἰς πλοῖον ἐμβάντα
  choice: il monta dans une barque
  rationale: Dans ce contexte, « monter dans une barque » est une expression française courante et fidèle au mouvement d’entrée exprimé par ἐμβαίνω avec εἰς.
- source_word: καθῆσθαι
  choice: s’assit
  rationale: Le passé simple convient au récit et exprime naturellement le fait que Jésus prend place dans la barque.
- source_word: πᾶς ὁ ὄχλος
  choice: toute la foule
  rationale: Le singulier collectif du grec est conservé, malgré le pluriel précédent, pour présenter désormais l’ensemble comme une seule foule.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: sur le rivage
  rationale: « Rivage » est un terme neutre et digne qui peut désigner le bord de la mer ou d’un lac, sans la connotation récréative que peut avoir « plage ».
- source_word: εἱστήκει
  choice: se tenait
  rationale: L’expression décrit la position continue de la foule. « Se tenait » rend cet état plus naturellement que le simple « était debout » dans ce récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La phrase conserve la relation de conséquence entre l’affluence et l’installation de Jésus dans la barque, ainsi que le contraste spatial entre Jésus assis et la foule sur le rivage.
