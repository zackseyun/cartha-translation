  source_fidelity: 'Le texte rend fidèlement l’opposition de la bonne terre, l’audition et la compréhension de la parole, l’emphase légère de δή, ainsi que la double expression καρποφορεῖ καὶ ποιεῖ et la diversité des rendements. Toutefois, la note b va au-delà du grec en définissant les nombres comme des multiplicateurs explicites (« fois ce qui a été semé ») : le texte énonce des quantités de rendement sans employer le terme « fois ».'
  naturalness: Le français est moderne, clair et d’un registre biblique accessible. « Celui qui a été semé » conserve de façon intelligible la métaphore surprenante du grec. « Porte bel et bien du fruit et produit » est acceptable, mais « en produit » rend plus naturellement le lien entre produire et les quantités qui suivent.
  terminology: « La bonne terre », « la parole », « comprend » et « porte du fruit » sont des choix établis et naturels. Ils préservent l’imagerie agricole et le vocabulaire du passage sans surcharge doctrinale.
