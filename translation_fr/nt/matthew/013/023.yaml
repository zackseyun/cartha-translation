source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὴν ⸂καλὴν γῆν⸃ σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ ⸀συνιείς, ὃς δὴ καρποφορεῖ καὶ ποιεῖ ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/023.yaml
  text: But the one sown on the good soil—this is the one who hears the word and understands it[a], who indeed bears fruit and produces, in one case a hundred, in another sixty[b], and in another thirty.
translation:
  language: fr
  text: 'Mais celui qui a été semé sur la bonne terre[a], c’est celui qui entend la parole et la comprend. Il porte bel et bien du fruit et en produit : l’un cent, l’autre soixante et l’autre trente[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur le bon sol ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’un cent, l’autre soixante et l’autre trente » ; il s’agit de rendements variables.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τὴν καλὴν γῆν
  choice: sur la bonne terre
  rationale: Dans le cadre agricole de la parabole, γῆ désigne la terre qui reçoit la semence. « Bonne » indique ici une terre favorable ou fertile, sans attribuer à celle-ci une qualité morale.
- source_word: σπαρείς
  choice: celui qui a été semé
  rationale: Le participe aoriste passif masculin désigne la personne représentée par ce qui est semé. Cette formulation conserve le passage métaphorique, volontairement frappant, de la semence à l’auditeur.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: celui qui entend la parole
  rationale: Le participe présent décrit l’action caractéristique de cet auditeur. « La parole » préserve le vocabulaire biblique et le lien avec l’explication de la parabole.
- source_word: συνιείς
  choice: la comprend
  rationale: Le verbe exprime ici la compréhension de la parole entendue. Le pronom objet français reprend naturellement « la parole ».
- source_word: δὴ
  choice: bel et bien
  rationale: La locution rend l’insistance apportée par δή dans un français actuel et naturel, sans donner à la particule une portée doctrinale supplémentaire.
- source_word: καρποφορεῖ
  choice: porte du fruit
  rationale: Cette expression française courante conserve l’image agricole et sa portée figurée dans la parabole.
- source_word: ποιεῖ
  choice: produit
  rationale: Dans ce contexte, ποιεῖ renvoie à la production d’une récolte. Le traduire séparément permet de conserver les deux verbes grecs, « porter du fruit » et « produire ».
- source_word: ὃ μὲν ἑκατὸν ὃ δὲ ἑξήκοντα ὃ δὲ τριάκοντα
  choice: l’un cent, l’autre soixante et l’autre trente
  rationale: La construction distributive distingue plusieurs niveaux de rendement. La formulation conserve la concision du grec, tandis que la note explicite qu’il s’agit de rendements agricoles.
theological_decisions:
- issue: Nature de la réponse à la parole dans la parabole
  choice: Décrire l’auditeur de la bonne terre comme celui qui entend, comprend et porte du fruit en quantité variable.
  alternative: Expliciter la persévérance, la conversion véritable ou la régénération.
  rationale: Le texte grec affirme l’écoute, la compréhension et la fécondité, mais ne formule pas explicitement ces catégories doctrinales ultérieures. La traduction conserve donc les catégories propres au verset sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la métaphore inhabituelle de la personne « semée », présente dans le grec, tout en rendant clairement l’enchaînement entre écoute, compréhension et fécondité.
