source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν σαγήνῃ βληθείσῃ εἰς τὴν θάλασσαν καὶ ἐκ παντὸς γένους συναγαγούσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/047.yaml
  text: Again[b][a], the kingdom of heaven is like a dragnet cast into the sea and gathering from every kind.
translation:
  language: fr
  text: Encore une fois, le royaume des cieux ressemble à un grand filet[a] jeté dans la mer, qui recueille des poissons de toute espèce[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une senne » : le mot grec désigne un grand filet que l’on déploie et tire dans l’eau.'
    reason: lexical_alternative
  - marker: b
    text: Littéralement « qui recueille de toute espèce » ; le grec ne précise pas l’objet, mais « poissons » est sous-entendu par l’image de la pêche.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν
  choice: Encore une fois
  rationale: L’adverbe introduit une nouvelle comparaison dans la série des paraboles; cette tournure est naturelle en français et marque clairement la reprise.
- source_word: ὁμοία ἐστὶν
  choice: ressemble à
  rationale: Formulation comparative idiomatique en français, qui conserve explicitement la valeur de similitude.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Conserve l’expression caractéristique de Matthieu sans la remplacer par « royaume de Dieu » ni réduire βασιλεία à la seule idée de règne.
- source_word: σαγήνῃ
  choice: un grand filet
  rationale: Le terme désigne précisément une senne, c’est-à-dire un vaste filet de pêche. « Grand filet » reste exact tout en étant immédiatement compréhensible; la précision technique figure en note.
- source_word: βληθείσῃ εἰς τὴν θάλασσαν
  choice: jeté dans la mer
  rationale: Reproduit simplement le participe passif et garde « mer », conformément au grec θάλασσα.
- source_word: καὶ ἐκ παντὸς γένους συναγαγούσῃ
  choice: et qui rassemble des poissons de toute espèce
  rationale: La relative donne une phrase française fluide. « Poissons » explicite l’objet nécessairement sous-entendu par l’image, tandis que « de toute espèce » traduit étroitement ἐκ παντὸς γένους.
theological_decisions:
- issue: Sens de « royaume des cieux »
  choice: Maintenir l’expression matthéenne « royaume des cieux ».
  alternative: royaume de Dieu; règne des cieux
  rationale: La formulation propre au texte est conservée sans harmonisation théologique ni réduction du champ sémantique de βασιλεία.
- issue: Portée de « toute espèce »
  choice: Ne pas préciser ici si les diverses espèces représentent des catégories humaines particulières.
  alternative: Interpréter explicitement les poissons comme les justes et les méchants ou comme toutes les nations.
  rationale: Le verset présente l’image sans en donner encore toute l’interprétation; la traduction ne doit pas anticiper ni imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Grand filet » est préféré au terme technique « senne » dans le texte courant; la note conserve la précision lexicale. La structure reste proche du grec sans produire une formulation artificielle.
