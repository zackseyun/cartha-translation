    issue: Référent grammatical de « où elles n’avaient pas beaucoup de terre »
    rationale: Cette construction fait des graines le sujet qui « avait » de la terre. Dans le grec, ὅπου situe l’énoncé dans les endroits rocheux; le manque de terre caractérise donc le terrain.
  - severity: low
    issue: « Pierreux » est moins exact que « rocheux »
    rationale: πεζρώδη désigne des endroits rocheux/stériles, et le contexte explique une couche de terre peu profonde sur la roche. « Pierreux » peut suggérer des pierres mêlées au sol plutôt qu’un substrat rocheux.
  revised_text: D’autres graines tombèrent sur des endroits rocheux[a], où il n’y avait pas beaucoup de terre ; elles levèrent aussitôt, parce que la terre y était peu profonde.
