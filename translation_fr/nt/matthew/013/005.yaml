  text: ἄλλα δὲ ἔπεσεν ἐπὶ τὰ πετρώδη ὅπου οὐκ εἶχεν γῆν πολλήν, καὶ εὐθέως ἐξανέτειλεν διὰ τὸ μὴ ἔχειν βάθος γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/005.yaml
  text: Other seed fell on rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil,
translation:
  language: fr
  text: D’autres graines tombèrent sur des endroits rocheux[a], où il n’y avait pas beaucoup de terre ; elles levèrent aussitôt, parce que la terre y était peu profonde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur les endroits rocheux » ; il s’agit d’une mince couche de terre recouvrant la roche.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα δὲ
  choice: D’autres graines
  rationale: L’adjectif neutre pluriel renvoie implicitement aux graines de la phrase précédente. Le nom « graines » est explicité en français pour assurer la clarté, et le pluriel est maintenu dans toute la phrase.
- source_word: ἔπεσεν
  choice: tombèrent
  rationale: Le verbe signifie simplement « tomber » dans l’image de la parabole; « furent semées » ajouterait une précision absente du grec.
- source_word: ἐπὶ τὰ πετρώδη
  choice: sur les endroits pierreux
  rationale: Le pluriel substantivé désigne des zones pierreuses. Cette formulation reste proche du grec tout en étant naturelle; le contexte indique une mince couche de terre recouvrant la roche.
- source_word: ὅπου οὐκ εἶχεν γῆν πολλήν
  choice: où elles n’avaient pas beaucoup de terre
  rationale: La construction grecque emploie un singulier collectif ou elliptique, mais le français reprend naturellement le sujet explicité au pluriel. « Terre » convient au contexte agricole et évite de confondre la roche sous-jacente avec de simples cailloux.
- source_word: καὶ εὐθέως
  choice: Elles levèrent aussitôt
  rationale: « Aussitôt » conserve pleinement la valeur temporelle d’immédiateté et s’intègre avec naturel au récit.
- source_word: ἐξανέτειλεν
  choice: levèrent
  rationale: En français agricole, « lever » décrit précisément la sortie de terre des graines ou des jeunes pousses, sans ajouter l’idée d’une croissance complète.
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: parce que la terre n’était pas profonde
  rationale: 'διά suivi de l’infinitif substantivé exprime ici la cause. La reformulation française rend clairement l’absence de profondeur de terre tout en préservant le paradoxe narratif: la faible profondeur explique la levée rapide.'
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le vocabulaire agricole « graines », « terre » et « lever » rend naturellement l’image. La note explicite la nature du terrain sans l’insérer dans le corps du verset.
