base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/037.yaml
  text: He answered[a], “The one who sows the good seed is the Son of Man.”
translation:
  language: fr
  text: 'Il répondit : « Celui qui sème la bonne semence, c’est le Fils de l’homme[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Humain ». Le titre grec « le Fils de l’homme » fait écho à Daniel 7 ; il est conservé ici en raison de son emploi bien établi dans les Évangiles et de sa portée théologique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: Il répondit
  rationale: Le participe aoriste ἀποκριθείς et le verbe εἶπεν forment une introduction de réponse idiomatique. « Il répondit » restitue naturellement leur fonction sans reproduire la redondance peu naturelle « ayant répondu, il dit ».
- source_word: Ὁ σπείρων
  choice: Celui qui sème
  rationale: Le participe présent substantivé désigne la personne par son action. Cette formulation moderne conserve la valeur descriptive du grec.
- source_word: τὸ καλὸν σπέρμα
  choice: la bonne semence
  rationale: Dans ce contexte, καλός qualifie ce qui est bon, de qualité ou conforme à sa destination. « Semence » garde le singulier collectif du grec et convient au registre de la parabole.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation bien établie dans les Évangiles conserve l’écho de Daniel 7 ainsi que sa portée christologique, sans la réduire à une simple expression générique désignant un être humain.
theological_decisions:
- issue: Traduction du titre christologique υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: « Le Fils de l’homme » demeure intelligible en français biblique moderne et préserve les résonances évangéliques, apocalyptiques et messianiques du titre. L’autre traduction possible est signalée sans imposer une interprétation qui effacerait ces échos.
translation_notes:
  register: Français international actuel, clair et digne. La construction présentative « c’est » rend naturellement l’identification exprimée par ἐστίν, tandis que « semence » maintient le vocabulaire traditionnel de la parabole sans devenir archaïque.
