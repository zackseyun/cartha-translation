id: MAT.13.17
reference: Matthew 13:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν γὰρ λέγω ὑμῖν ὅτι πολλοὶ προφῆται καὶ δίκαιοι ἐπεθύμησαν ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/017.yaml
  text: For truly I say to you that many prophets and righteous people longed to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: fr
  text: 'Car, en vérité, je vous le dis : beaucoup de prophètes et de justes ont désiré voir ce que vous voyez et ne l’ont pas vu, et entendre ce que vous entendez et ne l’ont pas entendu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν
  choice: en vérité
  rationale: Dans la formule solennelle ἀμὴν λέγω ὑμῖν, « en vérité » exprime naturellement la force de l’affirmation en français moderne, sans recourir à une translittération susceptible d’être comprise comme une conclusion liturgique.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication qui appuie la déclaration précédente ; « car » en conserve clairement la valeur logique.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure française courante garde le caractère direct et solennel de la formule grecque.
- source_word: πολλοὶ προφῆται καὶ δίκαιοι
  choice: beaucoup de prophètes et de justes
  rationale: « Beaucoup de » rend simplement πολλοί. L’adjectif substantivé δίκαιοι est conservé par « des justes », expression concise qui désigne des personnes caractérisées par leur justice.
- source_word: ἐπεθύμησαν
  choice: ont désiré
  rationale: Le verbe exprime ici un désir profond. « Ont désiré » est clair, digne et n’ajoute aucune nuance étrangère au contexte.
- source_word: ἰδεῖν ἃ βλέπετε καὶ οὐκ εἶδαν
  choice: voir ce que vous voyez, mais ne l’ont pas vu
  rationale: La formulation maintient le contraste entre l’expérience présente des disciples et celle des générations antérieures. « Mais » explicite naturellement en français la valeur contrastive de καὶ dans cette coordination négative.
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: entendre ce que vous entendez, mais ne l’ont pas entendu
  rationale: Le parallélisme avec la proposition sur la vue est conservé, ainsi que l’objet implicite exprimé seulement par la proposition relative.
theological_decisions:
- issue: Portée de δίκαιοι
  choice: « des justes », comme groupe distinct mais associé aux prophètes
  alternative: « des personnes justes » ou « les justes »
  rationale: Le grec emploie un adjectif substantivé pluriel. « Des justes » en respecte la forme et laisse au terme sa portée biblique générale, sans limiter le groupe à une catégorie doctrinale plus précise.
- issue: Objet de la vue et de l’ouïe
  choice: Conserver « ce que vous voyez » et « ce que vous entendez » sans préciser davantage
  alternative: Expliciter par « le Messie », « les œuvres de Jésus » ou « les secrets du royaume »
  rationale: Le contexte éclaire les paroles, mais le verset lui-même laisse l’objet sous forme de propositions relatives. La traduction préserve cette retenue et n’impose pas une identification interprétative unique.
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle du grec est maintenue sans lourdeur ; les deux « mais » rendent clairement le contraste en français. Aucun ajout explicatif n’est nécessaire dans le texte ou en note.
