  text: ὁ δὲ ἐχθρὸς ὁ σπείρας αὐτά ἐστιν ὁ διάβολος· ὁ δὲ θερισμὸς συντέλεια ⸀αἰῶνός ἐστιν, οἱ δὲ θερισταὶ ἄγγελοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/039.yaml
  text: And the enemy who sowed them is the devil; the harvest is the end of the age[a], and the harvesters are angels.
translation:
  language: fr
  text: L’ennemi qui les a semées, c’est le diable ; la moisson, c’est la fin de l’âge[a], et les moissonneurs sont les anges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’achèvement de l’âge » ; traditionnellement, « la fin du monde ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχθρὸς
  choice: l’ennemi
  rationale: Équivalent français courant qui conserve l’opposition personnelle exprimée dans l’explication de la parabole.
- source_word: ὁ σπείρας
  choice: qui les a semées
  rationale: Le participe aoriste désigne l’ennemi par son action accomplie ; « semer » maintient précisément l’image agricole.
- source_word: αὐτά
  choice: les
  rationale: Le pronom renvoie aux mauvaises herbes mentionnées auparavant ; le féminin pluriel rend ce renvoi naturel en français.
- source_word: διάβολος
  choice: le diable
  rationale: Dans ce contexte, le terme fonctionne comme une désignation personnelle reconnue ; une traduction étymologique telle que « le calomniateur » obscurcirait le référent.
- source_word: θερισμός
  choice: la moisson
  rationale: Terme naturel et immédiatement compréhensible, qui préserve l’image agricole de la parabole.
- source_word: συντέλεια αἰῶνος
  choice: la fin de l’époque présente
  rationale: « Époque » exprime la valeur temporelle de αἰών sans suggérer la destruction matérielle du monde ; « présente » explicite en français naturel l’époque envisagée dans ce cadre eschatologique.
- source_word: θερισταί
  choice: les moissonneurs
  rationale: Le terme est transparent en français moderne et maintient la correspondance avec « la moisson ».
- source_word: ἄγγελοι
  choice: les anges
  rationale: Le contexte eschatologique désigne des êtres célestes plutôt que de simples messagers humains.
- source_word: δέ
  choice: ponctuation et coordination
  rationale: Les δέ successifs structurent la progression de l’explication ; en français, le point-virgule et la coordination rendent cette fonction sans répétition lourde de « mais » ou « quant à ».
theological_decisions:
- issue: Sens de αἰών dans l’expression eschatologique συντέλεια αἰῶνος
  choice: la fin de l’époque présente
  alternative: l’achèvement de l’époque ; la fin du monde
  rationale: Le choix conserve le sens temporel de αἰών et évite d’imposer l’idée de l’anéantissement du cosmos. La note maintient la nuance d’accomplissement portée par συντέλεια ainsi que la formulation française traditionnelle.
translation_notes:
  register: Français international moderne, clair et digne. La structure identificatrice « c’est » restitue naturellement les propositions nominales grecques. « Époque présente » évite l’ambiguïté courante de « âge » en français tout en conservant la portée temporelle et eschatologique.
