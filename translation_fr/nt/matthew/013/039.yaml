  source_fidelity: La traduction rend correctement l’ennemi, l’action de semer, le diable, la moisson et les anges. Cependant, « l’époque présente » ajoute « présente », qui n’est exprimé ni par αἰών ni par le contexte immédiat. La formule grecque désigne « l’achèvement / la fin de l’âge », sans qualifier cet âge de « présent ».
  naturalness: La formulation est naturelle en français moderne. « La fin de l’âge » est une expression claire et établie dans ce contexte; elle est plus fidèle que « la fin de l’époque présente ».
  terminology: « Le diable », « la moisson », « les moissonneurs » et « les anges » conviennent. « Âge » est ici préférable à « époque présente », car il traduit αἰών sans ajout interprétatif et conserve la terminologie eschatologique de manière sobre.
