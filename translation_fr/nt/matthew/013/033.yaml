  verdict: revise
  source_fidelity: La traduction rend fidèlement la comparaison, « royaume des cieux », le levain, l’action de prendre et de cacher, ainsi que les trois mesures. Toutefois, « jusqu’à ce que le tout ait levé » ne rend pas avec assez de précision le passif ἐζυμώθη (« ait été levé / soit levé » au sens de levain) et son référent demeure peu idiomatique en français.
  naturalness: Le français est globalement naturel et d’un registre approprié. « Toute la pâte soit levée » est plus idiomatique que « le tout ait levé » dans le contexte de la boulangerie.
  terminology: « Royaume des cieux », « levain », « caché » et « mesures de farine » conviennent. Les notes préservent correctement les alternatives lexicales et la donnée culturelle du séah.
  issues:
  - severity: medium
    issue: « jusqu’à ce que le tout ait levé »
    rationale: Le grec ἐζυμώθη est passif et décrit le fait que la totalité soit levée par le levain. En français, « le tout ait levé » est moins naturel et évoque surtout l’action intransitive de monter. « Toute la pâte soit levée » rend naturellement le résultat tout en explicitant le référent culinaire impliqué par la farine et le levain.
