source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς· Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἐνέκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/033.yaml
  text: 'He told them another parable: “The kingdom of heaven is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.”'
translation:
  language: fr
  text: 'Il leur dit une autre parabole : « Le royaume des cieux ressemble à du levain[a] qu’une femme a pris et caché[b] dans trois mesures de farine[c], jusqu’à ce que toute la pâte soit levée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « levure ». Le mot grec désigne un agent qui fait lever la pâte.
    reason: lexical_alternative
  - marker: b
    text: Ou « incorporé » ou « mélangé ». Le grec signifie littéralement « caché ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « trois séahs de farine », soit une grande quantité.
    reason: cultural_note
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἐλάλησεν αὐτοῖς
  choice: Il leur dit une autre parabole
  rationale: Cette formulation naturelle conserve le caractère additionnel de ἄλλην et rend λαλέω de façon idiomatique dans l’introduction d’une parabole.
- source_word: Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν
  choice: Le royaume des cieux ressemble à
  rationale: « Ressemble à » exprime clairement la comparaison parabolique, tandis que « royaume des cieux » conserve l’expression caractéristique de Matthieu.
- source_word: ζύμῃ
  choice: du levain
  rationale: « Levain » désigne naturellement en français un agent de fermentation de la pâte et préserve la portée métaphorique du terme sans lui imposer une valeur positive ou négative.
- source_word: ἣν λαβοῦσα γυνὴ
  choice: qu’une femme a pris
  rationale: Le passé composé restitue naturellement l’enchaînement des actions exprimé par le participe aoriste et convient au français moderne.
- source_word: ἐνέκρυψεν εἰς
  choice: caché dans
  rationale: Ce choix conserve le sens concret et surprenant de ἐγκρύπτω, « cacher dans », au lieu de le remplacer silencieusement par l’interprétation culinaire « incorporer ».
- source_word: ἀλεύρου σάτα τρία
  choice: trois mesures de farine
  rationale: « Mesures » reste compréhensible dans le texte courant; une note précise qu’il s’agit de trois séahs et d’une grande quantité.
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: jusqu’à ce que le tout ait levé
  rationale: La tournure conserve la totalité exprimée par ὅλον et l’effet du levain sans ajouter explicitement « pâte » ou « fournée », absents du grec.
theological_decisions:
- issue: Valeur symbolique du levain dans la parabole du royaume
  choice: Employer le terme neutre « levain » sans préciser si son symbolisme est positif ou négatif.
  alternative: Choisir une formulation qui ferait du levain un symbole explicitement bénéfique ou nuisible.
  rationale: Le verset met en scène l’action cachée et pénétrante du levain, mais ne formule pas lui-même un jugement moral. La traduction doit laisser ouverte la tension interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé rend le récit accessible sans effacer la succession des actions. « Caché » maintient l’image grecque, expliquée par une note, et « le tout » évite d’ajouter un référent plus précis que le texte source.
