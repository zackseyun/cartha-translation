id: MAT.13.14
reference: Matthew 13:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀναπληροῦται αὐτοῖς ἡ προφητεία Ἠσαΐου ἡ λέγουσα· Ἀκοῇ ἀκούσετε καὶ οὐ μὴ συνῆτε, καὶ βλέποντες βλέψετε καὶ οὐ μὴ ἴδητε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/014.yaml
  text: 'And in them the prophecy of Isaiah is fulfilled[a], which says: ‘You will indeed hear, but never understand, and seeing you will see, but never perceive.’'
translation:
  language: fr
  text: 'Et, en eux, s’accomplit la prophétie d’Ésaïe, qui dit : « Vous entendrez bel et bien, mais vous ne comprendrez jamais ; vous regarderez bel et bien, mais vous ne verrez jamais.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « En entendant, vous entendrez… et, en regardant, vous regarderez » ; c’est une tournure d’insistance sémitique reprise en grec.'
    reason: alternative_lexicale
lexical_decisions:
- source_word: ἀναπληροῦται
  choice: s’accomplit
  rationale: Le présent passif est rendu naturellement en français par le présent pronominal. « S’accomplit » conserve le langage d’accomplissement prophétique sans imposer l’idée plus forte d’un achèvement exhaustif.
- source_word: αὐτοῖς
  choice: en eux
  rationale: Le datif désigne les personnes dans le cas desquelles la prophétie trouve son accomplissement. « En eux » reste proche du grec et convient au registre biblique moderne.
- source_word: προφητεία Ἠσαΐου
  choice: la prophétie d’Ésaïe
  rationale: Cette formulation reproduit naturellement le rapport génitif du grec.
- source_word: ἡ λέγουσα
  choice: qui dit
  rationale: Le participe attributif introduit la citation ; « qui dit » est direct et idiomatique.
- source_word: Ἀκοῇ ἀκούσετε
  choice: Vous aurez beau entendre
  rationale: La tournure rend en français courant l’insistance de la construction sémitique, tout en préparant le contraste avec l’absence de compréhension.
- source_word: οὐ μὴ συνῆτε
  choice: vous ne comprendrez jamais
  rationale: « Jamais » restitue la négation grecque fortement emphatique οὐ μή sans alourdir la phrase.
- source_word: βλέποντες βλέψετε
  choice: vous aurez beau regarder
  rationale: Cette formulation fait écho à la première construction emphatique et distingue l’acte extérieur de regarder de la perception intérieure exprimée ensuite.
- source_word: οὐ μὴ ἴδητε
  choice: vous ne discernerez jamais
  rationale: « Discerner » exprime ici la perception effective ou pénétrante, par contraste avec le simple fait de regarder, et « jamais » conserve la force de οὐ μή.
theological_decisions:
- issue: Nature de l’accomplissement prophétique
  choice: La prophétie s’accomplit en ces personnes.
  alternative: La prophétie ne ferait que s’illustrer dans leur cas, ou y trouverait son accomplissement total et définitif.
  rationale: La traduction maintient l’affirmation d’accomplissement du texte sans préciser le mécanisme théologique de l’endurcissement ni affirmer un achèvement exhaustif.
- issue: Rapport entre perception extérieure et compréhension intérieure
  choice: « entendre » s’oppose à « comprendre », et « regarder » à « discerner ».
  alternative: Employer le même verbe « voir » dans les deux membres.
  rationale: La distinction lexicale reflète les verbes grecs et rend intelligible la tension entre l’expérience sensorielle et la véritable perception, sans ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Vous aurez beau » restitue naturellement la répétition emphatique et son résultat négatif ; la note conserve la forme plus littérale. Le nom « Ésaïe » suit l’usage biblique français traditionnel tout en restant largement intelligible.
