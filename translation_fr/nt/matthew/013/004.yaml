source:
  edition: SBLGNT
  text: καὶ ἐν τῷ σπείρειν αὐτὸν ἃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ ⸂ἐλθόντα τὰ πετεινὰ⸃ κατέφαγεν αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/004.yaml
  text: And as he was sowing[a], some seeds fell beside the path, and the birds came and devoured them.
translation:
  language: fr
  text: Pendant qu’il semait[a], des graines tombèrent au bord du chemin. Les oiseaux vinrent et les dévorèrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « certaines choses tombèrent au bord du chemin » ; « graines » est précisé d’après le contexte du semeur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ σπείρειν αὐτὸν
  choice: Pendant qu’il semait
  rationale: La construction ἐν avec l’infinitif articularisé exprime ici la simultanéité. « Pendant qu’il semait » est naturel en français et conserve clairement la valeur temporelle.
- source_word: ἃ μὲν
  choice: des graines
  rationale: Le relatif neutre pluriel signifie littéralement « certaines choses » et renvoie, dans le contexte, à ce que le semeur répand. Le nom « graines » est explicité pour produire une phrase française intelligible.
- source_word: ἔπεσεν
  choice: tombèrent
  rationale: L’aoriste indicatif marque l’événement dans le récit. Le pluriel français s’accorde avec « des graines », bien que le grec emploie un verbe au singulier avec un sujet neutre pluriel.
- source_word: παρὰ τὴν ὁδόν
  choice: au bord du chemin
  rationale: παρά avec l’accusatif situe les graines à côté du passage. « Au bord du chemin » est idiomatique dans un cadre rural et garde l’idée de proximité latérale.
- source_word: ἐλθόντα τὰ πετεινὰ
  choice: Les oiseaux vinrent
  rationale: Le participe aoriste est rendu naturellement en français par un verbe conjugué indiquant l’action suivante. πετεινά désigne ici les oiseaux, sans complément équivalent à « du ciel ».
- source_word: κατέφαγεν
  choice: dévorèrent
  rationale: Le verbe κατεσθίω exprime l’idée de manger entièrement ou avec avidité. « Dévorèrent » en restitue la force sans lourdeur.
- source_word: αὐτά
  choice: les
  rationale: Le pronom reprend les graines tombées et se rend simplement par le pronom objet français « les ».
theological_decisions: []
