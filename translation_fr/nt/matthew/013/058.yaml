id: MAT.13.58
reference: Matthew 13:58
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐποίησεν ἐκεῖ δυνάμεις πολλὰς διὰ τὴν ἀπιστίαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/058.yaml
  text: And he did not do many mighty works there because of their unbelief[a].
translation:
  language: fr
  text: Et il ne fit pas là beaucoup d’actes de puissance, à cause de leur incrédulité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beaucoup de miracles » ou « beaucoup d’œuvres puissantes ». Le terme grec désigne des actes de puissance et, dans ce contexte, des actes miraculeux.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐκ ἐποίησεν
  choice: Et il ne fit pas
  rationale: καί poursuit le récit sans imposer une nuance déductive, tandis que l’aoriste négatif οὐκ ἐποίησεν énonce ce qu’il ne fit pas, sans exprimer une incapacité.
- source_word: ἐκεῖ
  choice: là
  rationale: Adverbe de lieu naturel en français, renvoyant à l’endroit évoqué dans le contexte, sa patrie.
- source_word: δυνάμεις πολλὰς
  choice: beaucoup d’actes de puissance
  rationale: Dans ce contexte évangélique, δυνάμεις désigne des manifestations concrètes de puissance, c’est-à-dire des actes miraculeux. Cette formulation conserve le lien lexical avec la puissance sans réduire d’emblée le terme à « miracles ».
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: à cause de leur manque de foi
  rationale: διά avec l’accusatif indique ici la cause. ἀπιστία peut désigner l’incrédulité ou le manque de foi; cette dernière expression est claire et naturelle dans le contexte du refus de croire.
theological_decisions:
- issue: Le verset exprime-t-il une incapacité ou le fait que Jésus n’a pas accompli beaucoup d’actes de puissance en réponse à leur manque de foi ?
  choice: « il ne fit pas là beaucoup d’actes de puissance »
  alternative: « il ne put pas faire là beaucoup de miracles »
  rationale: Le grec dit οὐκ ἐποίησεν (« il ne fit pas ») et n’emploie aucun verbe d’incapacité. La traduction reste donc au niveau de l’action rapportée et ne renforce pas l’énoncé théologique.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique écrit. « Actes de puissance » demeure intelligible tout en préservant la valeur de δύναμις; la note offre les équivalents plus usuels.
