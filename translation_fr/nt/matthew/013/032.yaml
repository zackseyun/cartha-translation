id: MAT.13.32
reference: Matthew 13:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃ μικρότερον μέν ἐστιν πάντων τῶν σπερμάτων, ὅταν δὲ αὐξηθῇ μεῖζον τῶν λαχάνων ἐστὶν καὶ γίνεται δένδρον, ὥστε ἐλθεῖν τὰ πετεινὰ τοῦ οὐρανοῦ καὶ κατασκηνοῦν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/032.yaml
  text: It is indeed smaller than all the seeds[a], but when it has grown, it is larger than the garden plants and becomes a tree[b], so that the birds of the sky come and nest in its branches.
translation:
  language: fr
  text: Elle est certes plus petite que toutes les graines, mais, quand elle a grandi, elle est plus grande que les plantes du jardin et devient un arbre, de sorte que les oiseaux du ciel[a] viennent nicher dans ses branches[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les oiseaux de l’air », traduction traditionnelle de l’expression grecque.
    reason: lexical_alternative
  - marker: b
    text: L’image des oiseaux qui viennent nicher dans les branches peut rappeler les représentations, dans l’Ancien Testament, d’un grand arbre figurant un royaume (par exemple Ézéchiel 17.23 ; Daniel 4.12), mais le verset n’explicite pas ce symbolisme.
    reason: cross_reference
lexical_decisions:
- source_word: μικρότερον
  choice: plus petite
  rationale: Le comparatif grec est conservé, plutôt que transformé grammaticalement en superlatif (« la plus petite »).
- source_word: πάντων τῶν σπερμάτων
  choice: que toutes les graines
  rationale: Le génitif de comparaison est rendu explicitement. « Graines » est naturel en français et ne restreint pas indûment le champ du terme grec.
- source_word: μέν ... δέ
  choice: certes ... mais
  rationale: Cette tournure française exprime naturellement le contraste entre la petitesse initiale et la croissance ultérieure.
- source_word: ὅταν ... αὐξηθῇ
  choice: une fois qu’elle a poussé
  rationale: L’expression présente la croissance comme accomplie avant la comparaison qui suit, tout en employant une formulation naturelle pour une plante.
- source_word: μεῖζον
  choice: plus grande
  rationale: Le comparatif répond directement à « plus petite » et convient aux dimensions de la plante.
- source_word: τῶν λαχάνων
  choice: que les plantes du jardin
  rationale: Le terme désigne largement des plantes cultivées au jardin; ce choix évite les sens modernes trop étroits de « légumes » ou « herbes ».
- source_word: γίνεται δένδρον
  choice: devient un arbre
  rationale: La formulation conserve sans l’atténuer l’image explicite et frappante du texte grec.
- source_word: ὥστε ἐλθεῖν
  choice: Ainsi, ... viennent
  rationale: La construction exprime ici le résultat. « Ainsi » relie naturellement en français la croissance de l’arbre à la venue des oiseaux.
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: les oiseaux du ciel
  rationale: Cette traduction proche du grec reste idiomatique en français; la variante traditionnelle « oiseaux de l’air » est signalée en note.
- source_word: κατασκηνοῦν
  choice: nicher
  rationale: Dans le contexte d’oiseaux et de branches, le verbe exprime naturellement l’idée de s’établir ou de faire son nid.
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: dans ses branches
  rationale: Traduction locative directe; le possessif renvoie naturellement à l’arbre.
theological_decisions:
- issue: Possible évocation de l’image biblique d’un grand arbre abritant des oiseaux
  choice: Conserver littéralement l’image sans l’interpréter dans le corps du texte.
  alternative: Présenter les oiseaux comme symbolisant explicitement les nations ou les peuples accueillis dans le royaume de Dieu.
  rationale: Le verset peut évoquer des images de l’Ancien Testament, mais il n’en donne pas lui-même l’interprétation. La traduction préserve donc cette résonance et l’ambiguïté théologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le féminin « elle » suppose l’antécédent « graine » dans le contexte immédiat. La structure comparative et le contraste du grec sont conservés sans rendre la phrase artificielle.
