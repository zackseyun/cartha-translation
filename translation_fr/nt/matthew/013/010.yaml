  text: Καὶ προσελθόντες οἱ μαθηταὶ εἶπαν αὐτῷ· Διὰ τί ἐν παραβολαῖς λαλεῖς αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/010.yaml
  text: Then the disciples came up and said to him[a], “Why do you speak to them in parables?”
translation:
  language: fr
  text: 'Alors les disciples s’approchèrent de Jésus et lui dirent[a] : « Pourquoi leur parles-tu en paraboles ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « s’étant approchés, les disciples lui dirent ». Le grec souligne qu’ils se sont d’abord approchés de Jésus avant de parler.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Alors
  rationale: Dans ce contexte narratif, καί fait progresser le récit. « Alors » assure un enchaînement naturel en français sans ajouter de contenu.
- source_word: προσελθόντες
  choice: s’approchèrent de Jésus
  rationale: Le participe aoriste de προσέρχομαι indique que les disciples se sont avancés vers Jésus avant de parler. La coordination française rend naturellement cette succession; « de Jésus » explicite la cible déjà indiquée par αὐτῷ.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: L’article désigne le groupe déjà connu. Le grec ne dit pas explicitement « ses disciples ».
- source_word: εἶπαν αὐτῷ
  choice: lui dirent
  rationale: La formulation conserve le verbe « dire » du grec, même s’il introduit ici une question directe.
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: Équivalent interrogatif français direct et naturel.
- source_word: ἐν παραβολαῖς
  choice: en paraboles
  rationale: ἐν avec le datif exprime ici la manière ou le moyen. « En paraboles » est la tournure française consacrée et précise.
- source_word: λαλεῖς
  choice: parles-tu
  rationale: Le présent actif à la deuxième personne du singulier est rendu par un présent français naturel dans une interrogation directe.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif désigne les personnes auxquelles Jésus parle; le pronom français « leur » rend cette relation sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase reste proche de la structure grecque tout en transformant naturellement le participe initial en deux verbes coordonnés. Le nom « Jésus » est explicité pour éviter l’enchaînement français peu naturel de deux pronoms renvoyant à la même personne.
