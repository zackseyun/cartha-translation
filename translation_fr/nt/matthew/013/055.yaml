id: MAT.13.55
reference: Matthew 13:55
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τοῦ τέκτονος υἱός; ⸀οὐχ ἡ μήτηρ αὐτοῦ λέγεται Μαριὰμ καὶ οἱ ἀδελφοὶ αὐτοῦ Ἰάκωβος καὶ ⸀Ἰωσὴφ καὶ Σίμων καὶ Ἰούδας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/055.yaml
  text: Is this not the carpenter’s son? Is not his mother called Mary[b][a], and his brothers James and Joseph and Simon and Judas?
translation:
  language: fr
  text: N’est-ce pas le fils du charpentier ? Sa mère ne s’appelle-t-elle pas Marie, et ses frères[a] ne sont-ils pas Jacques, Joseph[b], Simon et Judas ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « proches parents » ou « membres de sa famille » pour « frères » ; le mot grec signifie ordinairement « frères », mais certains lui donnent ici un sens familial plus large.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent « Josès » au lieu de « Joseph ».
    reason: textual_variant
lexical_decisions:
- source_word: τέκτονος
  choice: charpentier
  rationale: Le terme désigne un artisan travaillant notamment le bois ou dans la construction. « Charpentier » est ici la formulation française traditionnelle et naturelle, tout en restant dans son champ sémantique probable.
- source_word: υἱός
  choice: fils
  rationale: Le contexte familial impose le sens filial ordinaire.
- source_word: λέγεται
  choice: s’appelle
  rationale: Dans cette tournure au passif, le verbe signifie naturellement « être appelé » ou « se nommer » ; « s’appelle » est idiomatique en français moderne.
- source_word: Μαριὰμ
  choice: Marie
  rationale: Forme française conventionnelle du nom dans le Nouveau Testament.
- source_word: ἀδελφοὶ
  choice: frères
  rationale: « Frères » est le sens lexical ordinaire. La traduction principale conserve ce sens de surface sans trancher la discussion sur le lien familial exact ; une note signale le sens familial plus large parfois retenu.
- source_word: Ἰάκωβος
  choice: Jacques
  rationale: Forme française conventionnelle de ce nom dans le Nouveau Testament.
- source_word: Ἰωσὴφ
  choice: Joseph
  rationale: Le texte du SBLGNT porte Ἰωσήφ, rendu normalement par « Joseph ». La variante « Josès » est indiquée en note.
- source_word: Σίμων
  choice: Simon
  rationale: Transcription française conventionnelle du nom.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forme française conventionnelle correspondant au grec Ἰούδας dans ce contexte.
- source_word: οὐχ ... ;
  choice: N’est-ce pas… ? … ne …-t-elle pas… ? … ne sont-ils pas… ?
  rationale: La particule introduit des questions rhétoriques qui attendent une réponse affirmative. Les formes négatives françaises en rendent naturellement la force.
theological_decisions:
- issue: Sens de ἀδελφοὶ αὐτοῦ concernant la famille de Jésus
  choice: « ses frères » dans le texte principal
  alternative: « ses proches parents » ou « les hommes de sa parenté »
  rationale: Le sens ordinaire du grec est « frères ». Le texte principal ne doit pas résoudre le débat doctrinal ultérieur sur la relation biologique exacte de ces hommes avec Jésus ; la note conserve la possibilité d’un emploi familial plus large.
translation_notes:
  register: Français international moderne, naturel et digne. Les questions coordonnées ont été légèrement redistribuées afin d’éviter une structure lourde, tout en conservant leur caractère rhétorique. Tous les marqueurs de notes figurent immédiatement après les mots concernés.
