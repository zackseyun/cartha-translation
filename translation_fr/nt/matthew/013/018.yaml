lexical_decisions:
- source_word: Ὑμεῖς
  choice: Vous
  rationale: Le pronom est explicite et emphatique en grec. « Vous » conserve cette mise en relief et indique naturellement le pluriel.
- source_word: οὖν
  choice: donc
  rationale: La particule marque ici la conséquence ou la transition à partir de ce qui précède ; « donc » préserve clairement ce lien discursif.
- source_word: ἀκούσατε
  choice: écoutez
  rationale: L’impératif aoriste actif à la deuxième personne du pluriel appelle les disciples à prêter attention. « Écoutez » est plus idiomatique en français que « entendez » sans ajouter l’idée plus interprétative de « comprenez ».
- source_word: παραβολὴν
  choice: parabole
  rationale: « Parabole » est le terme français courant et précis dans ce contexte d’enseignement.
- source_word: τοῦ σπείραντος
  choice: de celui qui a semé
  rationale: Cette formulation rend directement le participe aoriste substantivé, « celui qui a semé », sans en faire nécessairement un titre fixe comme « le semeur ».
