  text: ⸂εὑρὼν δὲ⸃ ἕνα πολύτιμον μαργαρίτην ἀπελθὼν πέπρακεν πάντα ὅσα εἶχεν καὶ ἠγόρασεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/046.yaml
  text: and having found one pearl of great value[a], he went away, sold all that he had, and bought it.
translation:
  language: fr
  text: Ayant trouvé une perle de grande valeur[a], il est parti, a vendu tout ce qu’il avait et l’a achetée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une perle précieuse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν δὲ
  choice: Ayant trouvé
  rationale: Le participe aoriste exprime une action antérieure aux verbes principaux. Ici, δέ assure une transition légère que le français rend naturellement sans conjonction explicite.
- source_word: ἕνα
  choice: une perle
  rationale: Le grec emploie explicitement le numéral « une ». En français, l’article indéfini en conserve naturellement la valeur dans ce contexte, tandis que « une seule perle » introduirait une insistance plus forte que le texte ne l’exige.
- source_word: πολύτιμον
  choice: de grande valeur
  rationale: Cette expression française actuelle rend clairement la valeur exceptionnelle de la perle sans recourir à une formulation vieillie.
- source_word: μαργαρίτην
  choice: perle
  rationale: Équivalent français standard du terme grec.
- source_word: ἀπελθὼν
  choice: il est allé
  rationale: Le participe indique le déplacement qui précède la vente. La tournure française « aller vendre » restitue naturellement l’enchaînement des actions.
- source_word: πέπρακεν
  choice: vendre
  rationale: L’infinitif dépend de « est allé » en français et traduit idiomatiquement l’action accomplie exprimée par le parfait grec dans cette séquence narrative.
- source_word: πάντα ὅσα εἶχεν
  choice: tout ce qu’il avait
  rationale: Formulation française naturelle qui préserve explicitement la totalité exprimée par πάντα.
- source_word: ἠγόρασεν
  choice: l’a achetée
  rationale: « Acheter » est l’équivalent courant et précis; le pronom féminin renvoie grammaticalement à « perle ».
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom reprend μαργαρίτην. En français, son genre suit celui du nom « perle », d’où l’accord féminin du participe passé « achetée ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La succession des actions est rendue naturellement par « il est allé vendre… et l’a achetée », sans ajouter d’interprétation théologique.
