id: MAT.13.40
reference: Matthew 13:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ οὖν συλλέγεται τὰ ζιζάνια καὶ πυρὶ ⸀καίεται, οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ ⸀αἰῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/040.yaml
  text: Therefore[a], just as the weeds are gathered and burned with fire[b], so it will be at the end of the age.
translation:
  language: fr
  text: Ainsi donc, tout comme les mauvaises herbes[a] sont rassemblées et brûlées au feu, ainsi en sera-t-il à la fin de l’âge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, selon la formulation traditionnelle, « l’ivraie ». Le terme grec désigne des mauvaises herbes nuisibles, probablement de l’ivraie.
    reason: lexical_alternative
  - marker: b
    text: Traditionnellement, « à la fin du monde » ; le grec dit « de l’âge ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ οὖν
  choice: Ainsi donc, tout comme
  rationale: « Tout comme » introduit explicitement la comparaison, tandis que « ainsi donc » conserve la valeur de conséquence ou de reprise de οὖν.
- source_word: συλλέγεται
  choice: sont ramassées
  rationale: Le passif convient à l’image agricole et s’accorde naturellement au pluriel en français avec « les mauvaises herbes ».
- source_word: τὰ ζιζάνια
  choice: les mauvaises herbes
  rationale: Le terme désigne des plantes nuisibles, probablement de l’ivraie. « Mauvaises herbes » est clair en français moderne, tandis que « ivraie » est traditionnel mais moins immédiatement compris et peut paraître plus précis que ne l’exige le texte.
- source_word: πυρὶ καίεται
  choice: brûlées au feu
  rationale: Cette formulation garde la mention explicite du feu et rend simplement le verbe καίω sans ajouter l’idée plus forte de destruction totale.
- source_word: οὕτως ἔσται
  choice: ainsi en sera-t-il
  rationale: Cette tournure française naturelle reprend exactement la comparaison et conserve la valeur future.
- source_word: ἐν τῇ συντελείᾳ
  choice: à la fin
  rationale: « À la fin » exprime clairement l’aboutissement visé par συντέλεια dans un registre accessible; « à l’achèvement » serait plus formel.
- source_word: τοῦ αἰῶνος
  choice: de l’ère
  rationale: « Ère » conserve le sens temporel de αἰών et évite de l’identifier sans nuance au monde physique. L’absence de démonstratif dans le grec déconseille d’ajouter « cette ».
theological_decisions:
- issue: La portée eschatologique de τοῦ αἰῶνος
  choice: à la fin de l’ère
  alternative: à la fin du monde
  rationale: Le grec parle de l’aboutissement d’un αἰών, une ère ou un âge, plutôt que d’employer le terme ordinaire pour le monde ou le cosmos. La traduction retenue préserve cette nuance temporelle sans imposer un scénario eschatologique particulier.
translation_notes:
  register: Français international moderne, clair et digne. La structure comparative du grec est conservée sans lourdeur excessive. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils expliquent.
