id: MAT.13.30
reference: Matthew 13:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄφετε συναυξάνεσθαι ἀμφότερα ⸀μέχρι τοῦ θερισμοῦ· καὶ ἐν καιρῷ τοῦ θερισμοῦ ἐρῶ τοῖς θερισταῖς· Συλλέξατε πρῶτον τὰ ζιζάνια καὶ δήσατε αὐτὰ εἰς δέσμας πρὸς τὸ κατακαῦσαι αὐτά, τὸν δὲ σῖτον ⸀συναγάγετε εἰς τὴν ἀποθήκην μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/030.yaml
  text: Let both grow together until the harvest[a], and at the time of harvest I will tell the reapers, ‘First collect the weeds and tie them into bundles to burn them, but gather the wheat into my storehouse.’
translation:
  language: fr
  text: 'Laissez-les tous deux pousser ensemble jusqu’à la moisson[a]. Au temps de la moisson, je dirai aux moissonneurs : « Ramassez d’abord les mauvaises herbes et liez-les en bottes pour les brûler ; mais rassemblez le blé dans mon grenier. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’ivraie » ; plante nuisible qui ressemble au blé pendant sa croissance.'
    reason: Précision lexicale concernant ζιζάνια, sans imposer dans le texte principal une identification botanique trop technique.
lexical_decisions:
- source_word: ἄφετε
  choice: Laissez
  rationale: 'L’impératif a ici une valeur permissive : il ordonne de laisser faire plutôt que d’intervenir.'
- source_word: συναυξάνεσθαι ἀμφότερα
  choice: pousser ensemble tous les deux
  rationale: Cette formulation conserve à la fois l’idée exprimée par le préfixe συν-, « ensemble », et la référence explicite aux deux sortes de plantes.
- source_word: μέχρι τοῦ θερισμοῦ
  choice: jusqu’à la moisson
  rationale: « La moisson » désigne naturellement en français l’événement déterminé auquel aboutit la croissance.
- source_word: ἐν καιρῷ τοῦ θερισμοῦ
  choice: Au temps de la moisson
  rationale: Cette expression rend la notion de moment approprié ou fixé portée par καιρός, tout en restant naturelle et digne.
- source_word: θερισταῖς
  choice: aux moissonneurs
  rationale: « Moissonneurs » est le terme agricole précis et courant correspondant aux ouvriers chargés de la récolte.
- source_word: Συλλέξατε πρῶτον
  choice: Ramassez d’abord
  rationale: « Ramasser » convient à la collecte de plantes arrachées, tandis que « d’abord » marque clairement l’ordre des opérations.
- source_word: τὰ ζιζάνια
  choice: la mauvaise herbe
  rationale: Le singulier collectif est idiomatique en français et accessible ; l’identification botanique plus précise reste signalée en note.
- source_word: δήσατε αὐτὰ εἰς δέσμας
  choice: liez-la en bottes
  rationale: Le pronom suit le collectif « mauvaise herbe » ; « lier en bottes » restitue concrètement le regroupement en faisceaux.
- source_word: πρὸς τὸ κατακαῦσαι αὐτά
  choice: pour la brûler
  rationale: La construction exprime le but. « Brûler » transmet l’action sans accentuer au-delà du contexte l’idée de destruction totale.
- source_word: τὸν δὲ σῖτον συναγάγετε
  choice: mais rassemblez le blé
  rationale: « Mais » marque le contraste, et « rassemblez » distingue ce second verbe de « ramassez » tout en conservant l’idée de réunion.
- source_word: εἰς τὴν ἀποθήκην μου
  choice: dans mon grenier
  rationale: Dans ce contexte agricole, « grenier » désigne naturellement le lieu où le grain est entreposé.
theological_decisions:
- issue: Image parabolique de la séparation finale
  choice: Conserver exclusivement l’image agricole dans le verset.
  alternative: Expliciter ici le jugement final ou traduire la combustion comme une destruction eschatologique.
  rationale: L’interprétation de la parabole vient plus loin dans le chapitre. La traduction ne doit pas introduire cette explication dans les paroles imagées elles-mêmes.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct garde une tonalité concrète et agricole. Le collectif « la mauvaise herbe » évite une formulation botanique obscure, tandis que la note préserve la précision traditionnelle.
