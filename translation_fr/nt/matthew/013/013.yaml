id: MAT.13.13
reference: Matthew 13:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν παραβολαῖς αὐτοῖς λαλῶ, ὅτι βλέποντες οὐ βλέπουσιν καὶ ἀκούοντες οὐκ ἀκούουσιν οὐδὲ συνίουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/013.yaml
  text: For this reason I speak to them in parables[a], because seeing they do not see, and hearing they do not hear, nor do they understand.
translation:
  language: fr
  text: 'C’est pour cette raison que je leur parle en paraboles : en voyant, ils ne voient pas ; en entendant, ils n’entendent pas et ne comprennent pas.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pour cette raison que
  rationale: Cette tournure conserve la valeur causale de l’expression grecque tout en restant naturelle et claire en français moderne.
- source_word: ἐν παραβολαῖς
  choice: en paraboles
  rationale: Expression française traditionnelle et toujours compréhensible, qui rend directement le moyen ou le mode de parole.
- source_word: αὐτοῖς λαλῶ
  choice: je leur parle
  rationale: Le pronom datif est naturellement intégré au verbe français « parler à », et le présent simple correspond au présent grec.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français la raison annoncée par « pour cette raison », sans alourdir la phrase par la répétition « pour cette raison… parce que ».
- source_word: βλέποντες οὐ βλέπουσιν
  choice: en voyant, ils ne voient pas
  rationale: Le participe est conservé sans imposer explicitement une valeur concessive ; la formulation maintient le paradoxe du grec.
- source_word: ἀκούοντες οὐκ ἀκούουσιν
  choice: en entendant, ils n’entendent pas
  rationale: Le parallélisme avec la proposition précédente reproduit la structure rhétorique grecque et préserve son ambiguïté.
- source_word: οὐδὲ συνίουσιν
  choice: et ne comprennent pas
  rationale: « Comprendre » rend clairement συνίημι dans ce contexte, tandis que « et ne… pas » poursuit naturellement la série négative.
theological_decisions:
- issue: Valeur des participes βλέποντες et ἀκούοντες
  choice: « en voyant » et « en entendant », sans explicitation concessive
  alternative: « bien qu’ils voient » et « bien qu’ils entendent »
  rationale: Le contexte permet une nuance concessive, mais elle n’est pas grammaticalement imposée. La formulation retenue préserve le paradoxe et la tension entre perception extérieure et compréhension sans trancher davantage que le grec.
- issue: Portée de συνίουσιν
  choice: « comprennent »
  alternative: « saisissent » ou « discernent »
  rationale: « Comprennent » exprime l’absence de saisie du sens sans ajouter une qualification doctrinale sur la nature ou la cause de cette incompréhension.
translation_notes:
  register: Français moderne, digne et accessible. Le parallélisme et la répétition volontaire de « voir » et « entendre » sont maintenus afin de conserver la force rhétorique de l’original. Les deux-points rendent explicitement le rapport explicatif porté par ὅτι sans produire une construction française pesante.
