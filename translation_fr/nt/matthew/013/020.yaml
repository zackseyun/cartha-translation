id: MAT.13.20
reference: Matthew 13:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων καὶ εὐθὺς μετὰ χαρᾶς λαμβάνων αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/020.yaml
  text: As for the one sown on the rocky ground[a], this is the one who hears the word and immediately receives it with joy,
translation:
  language: fr
  text: Quant à celui qui a été semé sur le sol pierreux[a], c’est celui qui entend la parole et la reçoit aussitôt avec joie,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « sur les endroits pierreux » (voir 13.5).'
    reason: La forme substantivée τὰ πετρώδη peut se rendre formellement par « les endroits pierreux » ; « le sol pierreux » exprime plus naturellement l’image agricole en français. « Sur » rend ἐπί dans cette construction.
lexical_decisions:
- source_word: ὁ δὲ ἐπὶ τὰ πετρώδη σπαρείς
  choice: Quant à celui qui a été semé sur le sol pierreux
  rationale: « Quant à » rend δέ comme une transition légère. La tournure conserve la métaphore grecque condensée, dans laquelle « celui qui a été semé » désigne ensuite la personne représentée.
- source_word: πετρώδη
  choice: sol pierreux
  rationale: Cette expression française naturelle désigne un terrain où la roche affleure et maintient l’image agricole de la parabole.
- source_word: σπαρείς
  choice: qui a été semé
  rationale: Le participe aoriste passif est rendu explicitement au passif afin de préserver l’image des semailles.
- source_word: οὗτός ἐστιν
  choice: c’est celui
  rationale: Cette formulation identificatrice reste proche du grec sans développer le sens en « représente ».
- source_word: ὁ τὸν λόγον ἀκούων
  choice: celui qui entend la parole
  rationale: Le participe présent grec devient une proposition relative idiomatique. « La parole » conserve le vocabulaire et la résonance thématique du passage.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: « Aussitôt » exprime clairement l’immédiateté dans un registre moderne et digne.
- source_word: μετὰ χαρᾶς
  choice: avec joie
  rationale: La locution prépositionnelle conserve le nom χαρά et se lit naturellement en français.
- source_word: λαμβάνων αὐτόν
  choice: la reçoit
  rationale: « Recevoir » préserve le sens direct de λαμβάνω; le pronom féminin reprend naturellement « la parole » en français.
theological_decisions:
- issue: Référent de celui qui est semé dans l’explication de la parabole
  choice: Conserver « celui qui a été semé sur le sol pierreux », puis l’identifier à celui qui entend la parole.
  alternative: 'Expliciter : « La semence tombée sur le sol pierreux représente la personne qui… »'
  rationale: Le grec comprime volontairement l’image en parlant de « celui qui a été semé », avant de l’identifier à l’auditeur. La traduction maintient cette tension métaphorique au lieu de la résoudre par une paraphrase.
translation_notes:
  register: Français international moderne, clair et digne. La structure reste proche du grec tout en employant des relatives et un ordre des mots naturels en français. La virgule finale est conservée puisque le verset se poursuit grammaticalement au verset 21.
