source:
  edition: SBLGNT
  text: Τότε ἀφεὶς τοὺς ὄχλους ἦλθεν εἰς τὴν ⸀οἰκίαν. καὶ προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ λέγοντες· ⸀Διασάφησον ἡμῖν τὴν παραβολὴν τῶν ζιζανίων τοῦ ἀγροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/036.yaml
  text: Then[a], after leaving the crowds, he went into the house. And his disciples came to him, saying, “Explain to us the parable of the weeds of the field.”
translation:
  language: fr
  text: 'Alors, après avoir laissé les foules, il entra dans la maison. Ses disciples s’approchèrent de lui et dirent : « Explique-nous la parabole des mauvaises herbes du champ[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’ivraie du champ » ; le terme grec peut désigner plus précisément l’ivraie, une mauvaise herbe qui ressemble au blé.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession narrative introduite par l’adverbe temporel grec.
- source_word: ἀφεὶς τοὺς ὄχλους
  choice: après avoir laissé les foules
  rationale: Rend clairement l’antériorité du participe aoriste et conserve le pluriel de ὄχλοι.
- source_word: ἦλθεν εἰς τὴν οἰκίαν
  choice: il entra dans la maison
  rationale: Exprime de façon idiomatique le déplacement vers l’intérieur; l’article défini grec justifie « la maison ».
- source_word: προσῆλθον αὐτῷ οἱ μαθηταὶ αὐτοῦ
  choice: Ses disciples s’approchèrent de lui
  rationale: « S’approcher de » rend précisément προσέρχομαι, tandis que le possessif français traduit naturellement αὐτοῦ.
- source_word: λέγοντες
  choice: et dirent
  rationale: La coordination avec un verbe conjugué est plus naturelle en français narratif que le calque participial « en disant ».
- source_word: Διασάφησον ἡμῖν
  choice: Explique-nous
  rationale: Rend directement l’impératif demandant de rendre le sens clair ainsi que le datif du destinataire.
- source_word: τὴν παραβολὴν
  choice: la parabole
  rationale: Terme courant et consacré qui préserve le genre littéraire désigné par παραβολή.
- source_word: τῶν ζιζανίων τοῦ ἀγροῦ
  choice: des mauvaises herbes dans le champ
  rationale: « Mauvaises herbes » est accessible en français moderne; « dans le champ » explicite naturellement le rapport des génitifs sans changer le référent.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative est idiomatique; le vocabulaire botanique plus précis est conservé en note sans alourdir le texte principal.
