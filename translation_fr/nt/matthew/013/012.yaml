id: MAT.13.12
reference: Matthew 13:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἔχει, δοθήσεται αὐτῷ καὶ περισσευθήσεται· ὅστις δὲ οὐκ ἔχει, καὶ ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/012.yaml
  text: For whoever has[a], more will be given to him, and he will have an abundance; but whoever does not have[b], even what he has will be taken from him.
translation:
  language: fr
  text: Car on donnera à celui qui a[a], et il sera dans l’abondance ; mais à celui qui n’a pas, même ce qu’il a lui sera enlevé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’objet du verbe « avoir » reste sous-entendu en grec.
    reason: ambiguïté lexicale
  - marker: b
    text: Le masculin singulier (« celui », « il ») a ici une valeur générale et concerne toute personne.
    reason: note linguistique et culturelle
lexical_decisions:
- source_word: ὅστις
  choice: celui qui
  rationale: Le pronom relatif indéfini énonce un principe général. « Celui qui » est naturel en français et conserve la construction au singulier du grec.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication de l’affirmation précédente ; « car » en maintient clairement le lien logique.
- source_word: ἔχει / οὐκ ἔχει
  choice: a / n’a pas
  rationale: Le grec laisse l’objet de « avoir » sous-entendu. La traduction fait de même afin de ne pas réduire le sens à la compréhension, à la réceptivité ou à la connaissance du Royaume.
- source_word: δοθήσεται αὐτῷ
  choice: on donnera à celui qui
  rationale: Cette tournure française naturelle rend le passif grec sans nommer l’agent et sans ajouter explicitement « davantage », absent du texte source.
- source_word: περισσευθήσεται
  choice: il sera dans l’abondance
  rationale: La formule exprime le résultat d’une profusion ou d’un accroissement. Elle est idiomatique et conserve l’idée d’abondance sans préciser indûment ce qui abonde.
- source_word: καὶ ὃ ἔχει
  choice: même ce qu’il a
  rationale: 'Ici, καί a une valeur intensive : « même » met en relief le caractère paradoxal de la perte.'
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: lui sera enlevé
  rationale: Le passif futur avec ἀπό exprime le retrait de ce qu’il possède ; cette formulation française est directe et conserve le passif.
theological_decisions:
- issue: Objet implicite de « avoir » et de « donner »
  choice: L’objet demeure sous-entendu dans le texte principal.
  alternative: Préciser « la compréhension », « la réceptivité », « la connaissance du Royaume » ou ajouter explicitement « davantage ».
  rationale: Le contexte concerne l’accueil de l’enseignement de Jésus et les mystères du Royaume, mais la formulation grecque reste ouverte. La traduction ne tranche donc pas ce que le texte laisse implicite.
- issue: Masculin singulier à valeur générale
  choice: Conserver « celui » et « il » tout en signalant leur portée générique.
  alternative: Employer une formulation plurielle ou reformuler avec « toute personne ».
  rationale: Le grec emploie le masculin singulier dans une maxime de portée générale. Le français peut conserver cette forme représentative, avec une note qui empêche de la comprendre comme limitée aux hommes.
translation_notes:
  register: Français international moderne, sobre et proverbial. La syntaxe reste proche du grec tout en étant naturelle ; le contraste entre possession, abondance et retrait est maintenu sans explicitation doctrinale.
