id: MAT.13.56
reference: Matthew 13:56
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αἱ ἀδελφαὶ αὐτοῦ οὐχὶ πᾶσαι πρὸς ἡμᾶς εἰσιν; πόθεν οὖν τούτῳ ταῦτα πάντα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/056.yaml
  text: And are not all his sisters with us? Where then did this man get all these things?[a]
translation:
  language: fr
  text: Et ses sœurs ne sont-elles pas toutes parmi nous ? D’où vient donc à cet homme tout cela ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parentes ». Le mot grec signifie normalement « sœurs » ici, mais certains lui donnent un sens plus large en raison de débats théologiques ultérieurs.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφαὶ
  choice: sœurs
  rationale: C’est le sens familial ordinaire du terme grec, et le contexte évoque les membres de la famille de Jésus connus dans son milieu d’origine.
- source_word: οὐχὶ πᾶσαι
  choice: ne sont-elles pas toutes
  rationale: La tournure rend la question rhétorique qui appelle une réponse affirmative, tout en conservant l’accent sur la totalité.
- source_word: πρὸς ἡμᾶς
  choice: parmi nous
  rationale: Dans ce contexte, l’expression indique que ses sœurs vivent ou se trouvent au sein de la communauté des locuteurs. « Parmi nous » est naturel en français et préserve cette portée.
- source_word: πόθεν
  choice: D’où
  rationale: Le mot interroge la source ou l’origine de ce que Jésus possède ou manifeste.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque naturellement en français la conclusion tirée par les habitants à partir de ce qu’ils savent de la famille de Jésus.
- source_word: τούτῳ
  choice: lui
  rationale: Le datif indique ici la possession ou l’attribution dans la tournure française « lui viennent ». Le contexte identifie clairement Jésus; une formulation comme « cet homme » rendrait le déictique plus explicitement, mais serait moins naturelle dans cette phrase.
- source_word: ταῦτα πάντα
  choice: toutes ces choses
  rationale: Cette traduction conserve le pluriel et renvoie largement à la sagesse et aux œuvres puissantes mentionnées dans le contexte immédiat.
theological_decisions:
- issue: Nature de la référence aux sœurs de Jésus
  choice: Traduire ἀδελφαὶ selon son sens lexical ordinaire par « sœurs », sans ajouter d’explication doctrinale dans le corps du texte.
  alternative: « parentes » ou « cousines »
  rationale: Le grec désigne normalement des sœurs dans ce contexte familial. Employer un terme de parenté plus large dans le texte principal trancherait la question sous l’influence de débats théologiques ultérieurs plutôt que sur la seule base de la formulation grecque.
translation_notes:
  register: Français moderne, international et digne. La première question garde sa force rhétorique; la seconde demeure concise et exprime l’étonnement sceptique des habitants. Le marqueur [a] figure bien dans le texte principal.
