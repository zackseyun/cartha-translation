  source_fidelity: La première question rend correctement ἀδελφαὶ, οὐχὶ πᾶσαι et πρὸς ἡμᾶς. « D’où lui viennent » exprime bien l’idée de provenance, mais neutralise le démonstratif τούτῳ, dont la formulation marque Jésus comme « cet homme » dans la question des habitants. « D’où vient donc à cet homme tout cela ? » conserve cette nuance sans lourdeur et rend naturellement ταῦτα πάντα en français.
  naturalness: « Parmi nous » et la question rhétorique sont naturels en français moderne. La formulation révisée est idiomatique, garde le mouvement inférentiel de λοιπόν/οὖν par « donc », et évite une tournure trop littérale.
  terminology: « Sœurs » est le sens lexical ordinaire et contextuellement approprié de ἀδελφαὶ. La note conserve prudemment l’existence d’une lecture élargie sans l’introduire dans le texte ni résoudre un débat théologique ultérieur.
