id: MAT.13.26
reference: Matthew 13:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε δὲ ἐβλάστησεν ὁ χόρτος καὶ καρπὸν ἐποίησεν, τότε ἐφάνη καὶ τὰ ζιζάνια.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/026.yaml
  text: But when the plants had sprouted and produced grain[a], then the weeds also appeared.
translation:
  language: fr
  text: Mais quand les plantes eurent poussé et produit du grain, alors les mauvaises herbes[a] apparurent elles aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ivraie » ; peut-être une mauvaise herbe particulière, telle que l’ivraie enivrante.
    reason: Alternative lexicale traditionnelle et identification botanique possible, mais non certaine, de ζιζάνια.
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Mais quand
  rationale: ὅτε introduit la proposition temporelle, tandis que δέ assure la progression du récit avec une légère nuance de contraste.
- source_word: ἐβλάστησεν
  choice: eurent poussé
  rationale: Le verbe βλαστάνω désigne le fait de germer ou de pousser. Le passé antérieur marque naturellement en français littéraire courant l’action achevée avant l’apparition des mauvaises herbes.
- source_word: ὁ χόρτος
  choice: les plantes
  rationale: χόρτος peut désigner l’herbe ou la végétation. Dans ce contexte agricole, « les plantes » évoque la culture qui pousse sans introduire ici une précision botanique absente du terme lui-même.
- source_word: καρπὸν ἐποίησεν
  choice: produit du grain
  rationale: L’expression signifie littéralement « produire du fruit ». Dans le contexte d’un champ de céréales, « produire du grain » rend clairement le sens agricole.
- source_word: τότε
  choice: à leur tour
  rationale: La succession temporelle exprimée par τότε est rendue avec l’idée d’apparition subséquente; la tournure française évite la répétition lourde de « alors » après « quand ».
- source_word: ἐφάνη
  choice: apparurent
  rationale: Le verbe indique que les mauvaises herbes devinrent visibles ou manifestes; « apparurent » est direct et naturel.
- source_word: καὶ τὰ ζιζάνια
  choice: les mauvaises herbes… à leur tour
  rationale: ζιζάνια désigne des plantes adventices, traditionnellement l’ivraie et peut-être précisément l’ivraie enivrante. Le sens additif de καί est exprimé par « à leur tour ».
theological_decisions:
- issue: Identification précise de ζιζάνια
  choice: « mauvaises herbes » dans le texte principal
  alternative: « ivraie » ou, plus précisément, « ivraie enivrante »
  rationale: Le mot peut viser une mauvaise herbe particulière, mais son identification botanique n’est pas absolument certaine. Le terme générique reste immédiatement compréhensible, tandis que la note conserve la traduction traditionnelle et l’identification possible.
translation_notes:
  register: Français moderne, clair et digne. Le passé antérieur convient à la narration écrite et rend nettement l’antériorité de la pousse et de la production du grain.
