id: MAT.13.57
reference: Matthew 13:57
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐσκανδαλίζοντο ἐν αὐτῷ. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ ⸀πατρίδι καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/057.yaml
  text: And they took offense at him[a]. But Jesus said to them[c][b], “A prophet is not without honor except in his hometown and in his own household.”
translation:
  language: fr
  text: 'Et ils étaient scandalisés à son sujet[a]. Mais Jésus leur dit : « Un prophète n’est privé d’honneur que dans son pays natal[b] et dans sa propre famille[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils prenaient offense à son sujet » ; littéralement, « ils trébuchaient en lui » ou « trouvaient en lui une occasion d’achoppement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « sa ville d’origine » ou « sa patrie ».
    reason: lexical_alternative
  - marker: c
    text: Ou « sa propre maison » ou « son propre foyer ». Le mot grec peut désigner une maison ou les personnes qui la composent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: ils étaient choqués à cause de lui
  rationale: Cette formulation française naturelle exprime leur réaction négative envers Jésus sans donner à σκάνδαλον le sens d’une chute littérale. La note conserve l’image grecque et une autre nuance possible.
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Mais Jésus leur dit
  rationale: « Mais » rend le léger contraste introduit par δέ entre leur réaction et la réponse de Jésus.
- source_word: προφήτης
  choice: prophète
  rationale: Équivalent français direct, traditionnel et toujours courant.
- source_word: ἄτιμος
  choice: privé d’honneur
  rationale: Ce choix préserve le vocabulaire de l’honneur et la forme proverbiale, sans réduire le terme à un simple manque de popularité.
- source_word: εἰ μὴ
  choice: ne… que
  rationale: Dans cette construction d’exception, la tournure française « ne… que » rend naturellement « sauf » ou « excepté ».
- source_word: πατρίδι
  choice: pays natal
  rationale: πατρίς désigne ici le lieu d’origine de Jésus. « Pays natal » garde une certaine amplitude sémantique, tandis que la note signale les possibilités plus locales ou plus larges.
- source_word: οἰκίᾳ αὐτοῦ
  choice: sa propre famille
  rationale: Dans ce proverbe, οἰκία peut désigner non seulement la maison, mais les personnes du cercle domestique. « Sa propre famille » exprime clairement ce sens social en français courant.
theological_decisions:
- issue: Portée du proverbe de Jésus sur le rejet d’un prophète
  choice: Présenter le propos comme un proverbe général sur le manque d’honneur subi par un prophète dans son milieu d’origine.
  alternative: Expliciter le propos comme une affirmation visant spécialement l’incrédulité de la famille de Jésus.
  rationale: Le grec énonce un proverbe appliqué à la situation présente, sans développer ici une doctrine générale du rejet de Jésus ni limiter explicitement le second membre à l’incrédulité familiale.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la structure proverbiale et le contraste discursif, tout en signalant en notes les ambiguïtés réelles de πατρίς et οἰκία.
