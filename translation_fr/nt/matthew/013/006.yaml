  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡλίου δὲ ἀνατείλαντος ἐκαυματίσθη καὶ διὰ τὸ μὴ ἔχειν ῥίζαν ἐξηράνθη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/006.yaml
  text: But when the sun rose[a], it was scorched, and because it had no root, it withered away.
translation:
  language: fr
  text: Mais quand le soleil se leva, elle fut brûlée par la chaleur et, faute de racines, elle se dessécha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλίου δὲ ἀνατείλαντος
  choice: Mais quand le soleil se leva
  rationale: Le génitif absolu exprime une circonstance temporelle. « Mais » rend le léger contraste introduit par δέ, et le passé simple convient au registre narratif biblique sans être archaïque.
- source_word: ἐκαυματίσθη
  choice: elle fut brûlée par la chaleur
  rationale: Le passif de καυματίζω décrit l’effet brûlant de la chaleur sur la jeune pousse. Cette formulation est naturelle en français et évite de suggérer qu’elle a été consumée par le feu.
- source_word: διὰ τὸ μὴ ἔχειν
  choice: faute de
  rationale: διά suivi de l’infinitif substantivé exprime ici la cause. « Faute de » restitue cette relation de manière concise et idiomatique.
- source_word: ῥίζαν
  choice: racines
  rationale: Bien que le grec emploie le singulier collectif, le pluriel « racines » est plus naturel en français pour parler d’une plante insuffisamment enracinée.
- source_word: ἐξηράνθη
  choice: elle se dessécha
  rationale: Dans ce contexte végétal, ξηραίνω signifie se dessécher ou dépérir. « Se dessécha » conserve précisément l’image du manque d’humidité et la succession des événements.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le féminin « elle » reprend naturellement la plante ou la jeune pousse sous-entendue par le contexte immédiat.
