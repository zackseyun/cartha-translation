id: MAT.13.16
reference: Matthew 13:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμῶν δὲ μακάριοι οἱ ὀφθαλμοὶ ὅτι βλέπουσιν, καὶ τὰ ὦτα ὑμῶν ὅτι ⸀ἀκούουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/016.yaml
  text: But blessed are your eyes[a], because they see, and your ears, because they hear.
translation:
  language: fr
  text: Mais heureux sont vos yeux, parce qu’ils voient, et vos oreilles, parce qu’elles entendent.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « car ils voient… car elles entendent ». La conjonction grecque peut être rendue des deux manières ici.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste avec ceux qui regardent sans voir et entendent sans entendre dans le contexte précédent.
- source_word: μακάριοι
  choice: heureux
  rationale: Rendu français naturel et traditionnel dans les déclarations de béatitude; il exprime une condition favorable reconnue par Dieu, sans se limiter ici à une émotion passagère.
- source_word: οἱ ὀφθαλμοὶ ὑμῶν
  choice: vos yeux
  rationale: Formulation française idiomatique qui conserve l’accent mis sur les yeux des disciples.
- source_word: ὅτι βλέπουσιν
  choice: parce qu’ils voient
  rationale: ὅτι est compris comme causal; le verbe simple « voient » préserve à la fois le sens sensoriel et sa portée contextuelle implicite.
- source_word: τὰ ὦτα ὑμῶν
  choice: vos oreilles
  rationale: Formulation française naturelle, parallèle à « vos yeux ».
- source_word: ὅτι ἀκούουσιν
  choice: parce qu’elles entendent
  rationale: ὅτι est compris comme causal; « entendent » conserve le vocabulaire sensoriel direct du grec et l’accord grammatical français avec « oreilles ».
theological_decisions:
- issue: Faut-il expliciter une perception spirituelle dans les verbes voir et entendre?
  choice: Conserver les verbes sensoriels « voient » et « entendent » sans ajouter « comprennent » ou « discernent ».
  alternative: « perçoivent » et « comprennent »
  rationale: Le contexte donne à ces verbes une portée dépassant la simple perception physique, mais le verset lui-même maintient le langage concret. L’expliciter supprimerait une tension voulue par le texte.
- issue: Valeur de ὅτι dans les deux propositions
  choice: 'Le comprendre comme causal: « parce que ».'
  alternative: Le rendre par « car » dans les deux propositions.
  rationale: Les deux lectures expriment ici la raison pour laquelle les yeux et les oreilles sont dits heureux; « parce que » rend directement le lien causal, tandis que « car » demeure une possibilité stylistique réelle.
translation_notes:
  register: Français moderne, international et digne. Le parallélisme grec est conservé. Les pronoms sujets diffèrent en genre (« ils » pour les yeux, « elles » pour les oreilles) conformément à la grammaire française.
