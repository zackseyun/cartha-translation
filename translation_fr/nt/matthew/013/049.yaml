  text: οὕτως ἔσται ἐν τῇ συντελείᾳ τοῦ αἰῶνος· ἐξελεύσονται οἱ ἄγγελοι καὶ ἀφοριοῦσιν τοὺς πονηροὺς ἐκ μέσου τῶν δικαίων
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/049.yaml
  text: 'So it will be at the end of the age: the angels will go out and separate the wicked from among the righteous,[a]'
translation:
  language: fr
  text: 'Ainsi en sera-t-il à la fin de l’époque[a] : les anges sortiront et sépareront les méchants d’entre les justes.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’achèvement de l’époque ». Le grec parle d’une époque (αἰών), et non du « monde » au sens de la création physique.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως ἔσται
  choice: Il en sera de même
  rationale: Cette tournure française naturelle relie explicitement l’explication à l’image de la parabole et conserve la valeur comparative et prospective du grec.
- source_word: ἐν τῇ συντελείᾳ τοῦ αἰῶνος
  choice: à la fin de l’époque présente
  rationale: « Fin » rend clairement συντέλεια dans ce contexte, tandis que « époque présente » exprime le sens temporel et eschatologique de αἰών sans le confondre avec le monde physique.
- source_word: ἐξελεύσονται οἱ ἄγγελοι
  choice: les anges sortiront
  rationale: Le futur simple reproduit le mouvement annoncé par ἐξελεύσονται; dans ce contexte de jugement final, ἄγγελοι désigne les anges célestes.
- source_word: ἀφοριοῦσιν
  choice: sépareront
  rationale: Le verbe indique l’action de distinguer et de retirer un groupe du milieu d’un autre; « sépareront » est précis et naturel.
- source_word: τοὺς πονηροὺς
  choice: les méchants
  rationale: L’adjectif substantivé désigne ici les personnes mauvaises; « les méchants » est courant, clair et adapté au contexte judiciaire.
- source_word: ἐκ μέσου τῶν δικαίων
  choice: d’avec les justes
  rationale: Cette expression indique que les méchants seront séparés du groupe au milieu duquel ils se trouvent; « les justes » rend naturellement l’adjectif substantivé δικαίων.
theological_decisions:
- issue: Sens eschatologique de αἰών
  choice: l’époque présente
  alternative: le monde; l’âge
  rationale: Le grec désigne une époque ou un ordre temporel, non nécessairement l’univers physique. L’ajout de « présente » explicite le contraste eschatologique sous-entendu sans affirmer la destruction du cosmos.
- issue: Identité des ἄγγελοι
  choice: les anges célestes
  alternative: les messagers
  rationale: Dans l’explication de la parabole concernant le jugement final, le contexte désigne des êtres célestes plutôt que des envoyés humains.
translation_notes:
  register: Français international moderne, digne et accessible. « Il en sera de même » assure une transition idiomatique avec la parabole. « Époque présente » évite l’ambiguïté moderne de « l’âge » tout en conservant la portée temporelle de αἰών.
