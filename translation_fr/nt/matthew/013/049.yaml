  verdict: revise
  source_fidelity: La traduction rend correctement le futur, les anges, la séparation et les catégories morales. Toutefois, « présente » n’est pas exprimé dans τoῦ αἰῶνος et restreint/interprète inutilement le référent. « D’avec les justes » exprime une séparation, mais rend moins nettement ἐκ μέσου (« d’entre / du milieu de »), qui présente les méchants comme retirés d’un ensemble mixte.
  naturalness: « Ainsi en sera-t-il » est une formulation moderne, sobre et idiomatique qui rend plus directement οὕτως ἔσται que « Il en sera de même ». « Sépareront les méchants d’entre les justes » est naturel et reflète bien le mouvement de séparation.
  terminology: « Époque » constitue un rendu français recevable de αἰών dans ce cadre; sans l’ajout de « présente », il conserve l’ouverture du grec. « Anges », « méchants » et « justes » sont appropriés au registre et aux substantifs grecs.
