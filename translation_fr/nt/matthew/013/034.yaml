source:
  edition: SBLGNT
  text: Ταῦτα πάντα ἐλάλησεν ὁ Ἰησοῦς ἐν παραβολαῖς τοῖς ὄχλοις, καὶ χωρὶς παραβολῆς ⸀οὐδὲν ἐλάλει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/034.yaml
  text: Jesus spoke all these things to the crowds in parables[a], and apart from a parable he said nothing to them.
translation:
  language: fr
  text: Tout cela, Jésus le dit aux foules en paraboles ; sans parabole, il ne leur disait rien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans parabole, il ne leur dit rien ». L’imparfait grec peut présenter l’action comme habituelle ou continue ; selon le contexte, il peut aussi se rendre par un passé simple en français.'
    reason: alternative_aspectuelle
lexical_decisions:
- source_word: Ταῦτα πάντα
  choice: Tout cela
  rationale: Cette tournure française naturelle conserve à la fois la valeur démonstrative et l’idée de totalité.
- source_word: ἐλάλησεν
  choice: dit
  rationale: L’aoriste résume ici la prise de parole de Jésus. Le passé simple convient au récit et permet de garder « tout cela » comme objet direct.
- source_word: ἐν παραβολαῖς
  choice: en paraboles
  rationale: La préposition ἐν indique ici la manière ou le moyen ; « en paraboles » est idiomatique et fidèle au pluriel grec.
- source_word: τοῖς ὄχλοις
  choice: aux foules
  rationale: Le pluriel grec est conservé ; « foules » est plus actuel que « multitudes ».
- source_word: χωρὶς παραβολῆς
  choice: sans parabole
  rationale: La traduction conserve le sens de χωρίς et le singulier παραβολῆς sans le généraliser artificiellement.
- source_word: οὐδὲν ἐλάλει
  choice: il ne disait rien
  rationale: L’imparfait français rend naturellement la valeur durative ou habituelle de l’imparfait grec, tout en restant fluide.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom renvoie clairement aux foules et évite une répétition inutile.
theological_decisions:
- issue: Portée narrative de l’imparfait ἐλάλει
  choice: « il ne leur disait rien », qui présente cette manière de parler comme habituelle dans ce contexte
  alternative: « il ne leur dit rien », comme simple constat ponctuel au passé
  rationale: L’imparfait grec peut exprimer une action continue ou habituelle. L’imparfait français préserve cette nuance sans en faire une affirmation universelle sur tout l’enseignement de Jésus.
translation_notes:
  register: Français international moderne, clair et digne. La dislocation « Tout cela, Jésus le dit » est naturelle en français narratif et garde l’accent initial du grec. Le point-virgule marque nettement les deux propositions étroitement liées.
