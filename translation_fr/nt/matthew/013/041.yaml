  terminology: « Le Fils de l’homme », « ses anges » et « iniquité » conviennent au registre et préservent les termes théologiquement importants sans les surinterpréter. « Causes de chute » rend σκάνδαλα avec une portée large; la note précise utilement l’éventuel sens causatif.
