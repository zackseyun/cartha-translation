    rationale: Le contexte implique bien l’enlèvement hors du royaume, mais le grec emploie le verbe « rassembler ». « Rassembleront pour les enlever » conserve les deux aspects sans calque maladroit.
  - severity: low
    issue: La note a emploie « Le grec » sans identifier le terme, et « abandonner la foi » explicite davantage que nécessaire.
    rationale: Nommer σκάνδαλα améliore l’ancrage lexical; « s’égarer » ou « tomber » conserve l’ambiguïté du terme sans préciser une formulation confessionnelle de l’apostasie.
