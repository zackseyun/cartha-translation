id: MAT.13.41
reference: Matthew 13:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποστελεῖ ὁ υἱὸς τοῦ ἀνθρώπου τοὺς ἀγγέλους αὐτοῦ, καὶ συλλέξουσιν ἐκ τῆς βασιλείας αὐτοῦ πάντα τὰ σκάνδαλα καὶ τοὺς ποιοῦντας τὴν ἀνομίαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/041.yaml
  text: The Son of Man will send out his angels[a], and they will gather out of his kingdom all causes of stumbling and those who practice lawlessness[b],
translation:
  language: fr
  text: Le Fils de l’homme enverra ses anges, et ils rassembleront, pour les enlever de son royaume, toutes les causes de chute[a] et ceux qui pratiquent l’iniquité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout ce qui fait tomber dans le péché ». Le grec σκάνδαλα peut désigner ce qui pousse quelqu’un à pécher ou à s’égarer.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ceux qui font l’iniquité ». La tournure grecque présente l’iniquité comme leur conduite caractéristique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστελεῖ
  choice: enverra
  rationale: Le futur « enverra » exprime naturellement la mission confiée aux anges; un ajout comme « au loin » ou « en mission » serait inutilement explicatif en français.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Le Fils de l’homme
  rationale: Cette traduction consacrée préserve le titre employé par Jésus ainsi que sa résonance avec Daniel 7.
- source_word: τοὺς ἀγγέλους αὐτοῦ
  choice: ses anges
  rationale: Dans cette scène de jugement eschatologique, ἄγγελοι désigne des êtres célestes, non de simples messagers humains.
- source_word: συλλέξουσιν ἐκ
  choice: ils retireront de
  rationale: Le verbe signifie littéralement « rassembleront », mais avec ἐκ il décrit ici un rassemblement qui enlève des éléments hors du royaume. « Retireront de » rend clairement ce mouvement en français naturel tout en maintenant l’image de tri de la parabole.
- source_word: πάντα τὰ σκάνδαλα
  choice: tout ce qui fait tomber dans le péché
  rationale: σκάνδαλα désigne ce qui provoque la chute morale ou détourne de Dieu. Cette formulation compréhensible conserve la portée causative du terme sans la réduire à une offense ressentie.
- source_word: τοὺς ποιοῦντας τὴν ἀνομίαν
  choice: ceux qui pratiquent l’iniquité
  rationale: Le participe présent décrit une conduite caractéristique. « Pratiquent » en garde l’aspect habituel, tandis qu’« iniquité » exprime la rébellion morale impliquée par ἀνομία sans la réduire à une simple infraction civile.
theological_decisions:
- issue: Sens du titre ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Le Fils de l’homme
  alternative: l’Être humain
  rationale: La formulation traditionnelle conserve le caractère titulaire de l’expression et son arrière-plan apocalyptique probable, sans imposer une paraphrase interprétative.
- issue: Étendue de πάντα τὰ σκάνδαλα
  choice: tout ce qui fait tomber dans le péché
  alternative: toutes les causes de chute
  rationale: Le neutre pluriel peut englober des réalités, des influences ou des personnes qui entraînent au péché. La traduction garde cette portée large plutôt que de préciser arbitrairement leur nature.
- issue: Portée de ἀνομία
  choice: l’iniquité
  alternative: le mépris de la loi
  rationale: « Iniquité » conserve la dimension morale et théologique du terme sans décider explicitement quelle formulation de la loi est visée.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation évite le calque peu naturel « rassembler hors de » tout en préservant l’idée d’une élimination depuis l’intérieur du royaume. Les deux notes sont placées sur les expressions grecques qu’elles expliquent.
