revisions:
- from: Le Fils de l’homme enverra ses anges. Ils retireront de son royaume tout ce qui fait tomber dans le péché[a] et ceux qui pratiquent l’iniquité[b].
  to: Le Fils de l’homme enverra ses anges, et ils rassembleront, pour les enlever de son royaume, toutes les causes de chute[a] et ceux qui pratiquent l’iniquité[b].
  rationale: La révision rétablit l’idée de collecte exprimée par συλλέξουσιν tout en explicitant, de manière sobre, le mouvement d’enlèvement indiqué par ἐκ (« de son royaume »). Elle conserve le titre traditionnel, la distinction entre les causes de chute et les auteurs de l’iniquité, ainsi que l’aspect caractéristique du participe présent. Les notes restent ancrées aux expressions concernées et évitent une précision doctrinale non requise par le texte.
