  source_fidelity: 'Le sens général est bien rendu : le Fils de l’homme envoie ses anges, qui ôtent de son royaume les réalités causant la chute et les personnes dont la conduite est l’ἀνομία. Toutefois, « retireront » ne reflète pas explicitement συλλέξουσιν (« rassembleront/recueilleront »), élément qui maintient l’image de collecte de la parabole. Une formulation française naturelle peut conserver à la fois le rassemblement et l’éloignement hors du royaume.'
