id: MAT.13.45
reference: Matthew 13:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πάλιν ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν ⸀ἀνθρώπῳ ἐμπόρῳ ζητοῦντι καλοὺς μαργαρίτας·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/045.yaml
  text: Again[a], the kingdom of heaven is like a merchant seeking fine pearls.
translation:
  language: fr
  text: De nouveau, le royaume des cieux est semblable à un marchand[a] qui cherche de belles perles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « à un homme, un marchand, qui cherche de belles perles ».'
    reason: alternative_lexicale
lexical_decisions:
- source_word: Πάλιν
  choice: De nouveau
  rationale: Introduit une nouvelle comparaison dans la série des paraboles du royaume et préserve naturellement la progression du discours.
- source_word: ὁμοία ἐστὶν
  choice: est semblable à
  rationale: Formulation française naturelle et digne qui conserve explicitement la comparaison parabolique.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Expression caractéristique de Matthieu, consacrée en français et fidèle au pluriel grec οὐρανῶν.
- source_word: ἀνθρώπῳ ἐμπόρῳ
  choice: un marchand
  rationale: Le nom ἔμπορος précise déjà la qualité de la personne; omettre la répétition littérale «un homme, un marchand» produit un français plus naturel sans perdre l'information essentielle.
- source_word: ζητοῦντι
  choice: qui cherche
  rationale: La proposition relative restitue naturellement le participe présent et présente la recherche comme l'activité du marchand.
- source_word: καλοὺς μαργαρίτας
  choice: de belles perles
  rationale: Dans ce contexte commercial, καλός exprime la beauté et la qualité; «de belles perles» reste naturel sans ajouter explicitement la notion de valeur.
theological_decisions:
- issue: Portée de la comparaison dans la formule parabolique
  choice: Le royaume est immédiatement comparé à un marchand.
  alternative: Le royaume est comparable à toute la situation d'un marchand à la recherche de belles perles.
  rationale: La construction grecque ὁμοία ἐστὶν … ἀνθρώπῳ ἐμπόρῳ désigne naturellement le marchand comme terme immédiat de la comparaison. La traduction ne précise pas davantage la portée théologique de l'image, qui se déploie avec la suite de la parabole.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en évitant une apposition lourde dans le texte principal.
