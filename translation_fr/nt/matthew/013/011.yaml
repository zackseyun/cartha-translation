id: MAT.13.11
reference: Matthew 13:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν ⸀αὐτοῖς· Ὅτι ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τῶν οὐρανῶν, ἐκείνοις δὲ οὐ δέδοται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/011.yaml
  text: He answered them[a], “To you it has been given to know the mysteries of the kingdom of heaven[b], but to them it has not been given.”
translation:
  language: fr
  text: 'Il leur répondit : « Parce qu’il vous a été donné[b] de connaître les mystères[a] du royaume des cieux, mais que cela ne leur a pas été donné. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les secrets ».
    reason: lexical_alternative
  - marker: b
    text: Le passif « il a été donné » laisse implicite celui qui donne ; dans le contexte, il peut s’agir de Dieu, sans que le texte le nomme.
    reason: theological_clarification
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Il leur répondit
  rationale: La construction participiale suivie d’un verbe conjugué est un idiome grec que le français rend naturellement par le seul verbe « répondre » ; « leur » exprime le datif αὐτοῖς.
- source_word: Ὅτι
  choice: Parce que
  rationale: Dans le contexte, ὅτι introduit la raison donnée en réponse à la question des disciples sur l’emploi des paraboles. « Parce que » conserve explicitement ce lien causal.
- source_word: ὑμῖν δέδοται
  choice: à vous, il a été donné
  rationale: Cette formulation maintient le contraste porté par le datif placé en tête et conserve le parfait passif sans nommer celui qui donne.
- source_word: γνῶναι
  choice: connaître
  rationale: « Connaître » correspond directement au sens de γινώσκω et évite de réduire le propos à la seule compréhension intellectuelle.
- source_word: τὰ μυστήρια
  choice: les mystères
  rationale: « Mystères » désigne ici des réalités divines cachées puis révélées ; le terme conserve cette portée sans la réduire à de simples énigmes.
- source_word: τῆς βασιλείας τῶν οὐρανῶν
  choice: du royaume des cieux
  rationale: Cette expression française consacrée et naturelle reproduit aussi le pluriel de οὐρανῶν.
- source_word: ἐκείνοις δὲ οὐ δέδοται
  choice: mais à eux, cela n’a pas été donné
  rationale: « À eux » maintient l’opposition explicite avec « à vous », tandis que la répétition du passif préserve le parallélisme du grec.
theological_decisions:
- issue: Agent implicite du passif δέδοται
  choice: Conserver le passif sans nommer Dieu
  alternative: Dieu vous a donné de connaître
  rationale: Le grec laisse l’auteur du don implicite. Même si le contexte suggère Dieu, l’expliciter résoudrait une donnée que le texte maintient sous forme de passif.
- issue: Portée de μυστήρια
  choice: mystères
  alternative: secrets
  rationale: « Mystères » préserve la catégorie biblique de réalités divines cachées et révélées, sans suggérer seulement des renseignements tenus confidentiels.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure légèrement marquée « à vous… mais à eux » conserve le contraste rhétorique du grec, et « royaume des cieux » suit l’usage biblique français courant.
