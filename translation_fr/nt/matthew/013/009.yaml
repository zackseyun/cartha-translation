  text: ὁ ἔχων ⸀ὦτα ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/009.yaml
  text: The one who has ears[a], let him hear.
translation:
  language: fr
  text: Que celui qui a des oreilles entende !
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: celui qui a
  rationale: L’article suivi du participe présent est substantivé et désigne de manière générale toute personne concernée. « Celui qui a » conserve le singulier et la structure grecque dans un français naturel.
- source_word: ὦτα
  choice: des oreilles
  rationale: Le grec emploie le pluriel de οὖς. « Des oreilles » en respecte le nombre et forme en français l’expression idiomatique attendue.
- source_word: ἀκουέτω
  choice: entende
  rationale: Le présent impératif actif à la troisième personne du singulier est naturellement rendu par le subjonctif dans la tournure exhortative « que… entende ». « Entendre » maintient le lien lexical avec ἀκούω tout en suggérant ici l’accueil attentif du message.
theological_decisions:
- issue: Portée générique du masculin singulier
  choice: Que celui qui a des oreilles entende !
  alternative: Que quiconque a des oreilles entende !
  rationale: Le masculin singulier grec a une portée générique. En français, « celui qui » peut également viser toute personne sans limiter le propos aux hommes et conserve mieux la forme substantivée singulière de l’original. « Quiconque » explicite davantage l’universalité, mais modifie légèrement la structure.
translation_notes:
  register: Formulation actuelle, concise et digne. L’inversion exhortative « Que celui qui… entende ! » rend naturellement l’impératif grec à la troisième personne et conserve la force proverbiale de la parole.
