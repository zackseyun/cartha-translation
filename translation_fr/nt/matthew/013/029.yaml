source:
  edition: SBLGNT
  text: ὁ δέ ⸀φησιν· Οὔ, μήποτε συλλέγοντες τὰ ζιζάνια ἐκριζώσητε ἅμα αὐτοῖς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/029.yaml
  text: But he said[a], ‘No, lest while gathering the weeds you uproot the wheat along with them.’
translation:
  language: fr
  text: 'Mais il dit : « Non, de peur qu’en arrachant la mauvaise herbe[a], vous ne déraciniez le blé en même temps qu’elle. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ivraie » ; il s’agit peut-être plus précisément d’une plante adventice qui ressemble au blé pendant les premiers stades de sa croissance.
    reason: Alternative lexicale et précision botanique possible pour ζιζάνια.
lexical_decisions:
- source_word: φησιν
  choice: il répondit
  rationale: Le présent historique grec est rendu au passé, comme il est naturel dans un récit français. « Répondit » explicite sobrement la valeur de réplique dans le dialogue.
- source_word: Οὔ
  choice: Non
  rationale: Cette négation constitue une réponse directe et catégorique.
- source_word: μήποτε
  choice: de peur que… ne
  rationale: Cette tournure française naturelle exprime la crainte d’une conséquence indésirable, sans présenter celle-ci comme certaine.
- source_word: συλλέγοντες τὰ ζιζάνια
  choice: en arrachant la mauvaise herbe
  rationale: Le participe indique une action concomitante. Dans ce contexte, « arracher » rend naturellement l’action de ramasser les plantes indésirables, tandis que le singulier collectif « la mauvaise herbe » convient bien en français.
- source_word: ζιζάνια
  choice: la mauvaise herbe
  rationale: Cette expression est claire en français moderne. Le terme grec peut désigner plus précisément l’ivraie, plante ressemblant au blé durant sa croissance; cette précision est conservée en note.
- source_word: ἐκριζώσητε
  choice: vous ne déraciniez
  rationale: Le verbe signifie enlever avec les racines; « déraciner » en conserve précisément l’image.
- source_word: ἅμα αὐτοῖς
  choice: aussi… avec elle
  rationale: La formulation indique que le blé risquerait d’être enlevé en même temps que la mauvaise herbe et s’accorde avec le collectif singulier français.
- source_word: τὸν σῖτον
  choice: le blé
  rationale: Dans cette scène agricole et par contraste avec ζιζάνια, le terme désigne naturellement le blé plutôt que les céréales en général.
theological_decisions:
- issue: Traduction de ζιζάνια dans cette parabole bien connue
  choice: la mauvaise herbe
  alternative: l’ivraie
  rationale: Le texte principal privilégie une expression immédiatement compréhensible, tandis que la note préserve le terme traditionnel et la précision botanique possible. Aucun sens doctrinal supplémentaire n’est imposé.
translation_notes:
  register: Français international moderne, naturel et digne. La construction « de peur que… ne » conserve la nuance préventive de μήποτε; le « ne » est explétif et ne crée pas de double négation. Le discours direct garde la brièveté de la réponse grecque.
