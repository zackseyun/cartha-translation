id: MAT.13.44
reference: Matthew 13:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Ὁμοία ἐστὶν ἡ βασιλεία τῶν οὐρανῶν θησαυρῷ κεκρυμμένῳ ἐν τῷ ἀγρῷ, ὃν εὑρὼν ἄνθρωπος ἔκρυψεν, καὶ ἀπὸ τῆς χαρᾶς αὐτοῦ ὑπάγει καὶ ⸂πωλεῖ πάντα ὅσα ἔχει⸃ καὶ ἀγοράζει τὸν ἀγρὸν ἐκεῖνον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/044.yaml
  text: The kingdom of heaven is like a treasure hidden in a field[a], which a man found and hid[b]; and in his joy he goes and sells all that he has and buys that field.
translation:
  language: fr
  text: Le royaume des cieux est comparable à un trésor caché dans un champ[a]. Après l’avoir trouvé, un homme l’a caché ; dans sa joie[b], il s’en va, vend tout ce qu’il possède et achète ce champ-là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Le royaume des cieux est comme un trésor caché dans un champ. »'
    reason: Variante française naturelle de la formule comparative grecque.
  - marker: b
    text: 'Ou : « à cause de sa joie ».'
    reason: ἀπό peut marquer explicitement la cause ; « dans sa joie » conserve aussi la nuance d’état affectif.
lexical_decisions:
- source_word: Ὁμοία ἐστὶν
  choice: est comparable à
  rationale: Cette formule française exprime clairement la comparaison parabolique et s’accorde naturellement avec « le royaume », tout en évitant de suggérer une identité terme à terme.
- source_word: ἡ βασιλεία τῶν οὐρανῶν
  choice: le royaume des cieux
  rationale: Rend l’expression caractéristique de Matthieu dans sa forme française établie, sans réduire βασιλεία au seul territoire ni l’expliciter uniquement comme règne.
- source_word: θησαυρῷ
  choice: un trésor
  rationale: Le datif sans article introduit naturellement en français le terme de la comparaison avec l’article indéfini.
- source_word: κεκρυμμένῳ ἐν τῷ ἀγρῷ
  choice: caché dans un champ
  rationale: Le participe parfait passif décrit l’état durable du trésor. L’article grec ne contraint pas ici le français à employer « le champ » lors de sa première mention.
- source_word: ὃν εὑρὼν ἄνθρωπος ἔκρυψεν
  choice: Après l’avoir trouvé, un homme le cache
  rationale: La tournure rend l’antériorité du participe εὑρών et donne à ἔκρυψεν son objet explicite en français. Le présent narratif s’intègre au récit parabolique et prépare les présents grecs qui suivent.
- source_word: ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: dans sa joie
  rationale: Expression française naturelle qui conserve à la fois l’état affectif de l’homme et la nuance causale de ἀπό.
- source_word: ὑπάγει καὶ πωλεῖ πάντα ὅσα ἔχει
  choice: il s’en va, vend tout ce qu’il possède
  rationale: Les présents narratifs sont conservés. « Tout ce qu’il possède » exprime sans atténuation la totalité indiquée par πάντα ὅσα ἔχει.
- source_word: ἀγοράζει τὸν ἀγρὸν ἐκεῖνον
  choice: achète ce champ-là
  rationale: « Ce champ-là » restitue la force démonstrative de ἐκεῖνον et renvoie au champ précis où se trouve le trésor.
theological_decisions:
- issue: Sens de βασιλεία
  choice: le royaume
  alternative: le règne
  rationale: βασιλεία peut désigner la royauté, le règne ou le royaume. La formulation française traditionnelle demeure ouverte à la dimension dynamique de l’autorité divine sans trancher artificiellement entre règne et domaine.
- issue: Genre de ἄνθρωπος
  choice: un homme
  alternative: une personne
  rationale: Le récit grec emploie ici un nom masculin singulier pour son personnage. « Un homme » le représente directement, sans transformer ce détail narratif en affirmation doctrinale.
- issue: Motivation exprimée par ἀπὸ τῆς χαρᾶς αὐτοῦ
  choice: dans sa joie
  alternative: à cause de sa joie
  rationale: Le texte présente la joie comme le contexte affectif et la motivation de l’action. La traduction principale préserve cette richesse plutôt que de limiter la phrase à une relation causale abstraite.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée pour éviter une longue relative peu naturelle, tout en maintenant la succession du grec et ses présents narratifs. Les marqueurs de notes [a] et [b] figurent dans le texte.
