  naturalness: Le français est globalement naturel, accessible et de registre approprié. Employer le passé composé pour la découverte et l’action de cacher, puis le présent narratif pour les actions suivantes, produit une progression claire et idiomatique.
  terminology: « Le royaume des cieux », « un trésor », « un homme » et « tout ce qu’il possède » sont des choix fidèles et naturels. « Ce champ-là » rend utilement le démonstratif grec ἐκεῖνον.
