id: MAT.13.22
reference: Matthew 13:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς, οὗτός ἐστιν ὁ τὸν λόγον ἀκούων, καὶ ἡ μέριμνα τοῦ αἰῶνος ⸀τούτου καὶ ἡ ἀπάτη τοῦ πλούτου συμπνίγει τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/013/022.yaml
  text: And the one sown among the thorns—this is the one who hears the word[a], but the चिंता of this age and the deceitfulness of wealth choke the word[b], and he becomes unfruitful.
translation:
  language: fr
  text: Quant à celui qui a été semé parmi les épines, c’est celui qui entend la parole, mais les soucis de l’époque présente[a] et la tromperie de la richesse[b] étouffent la parole, et il devient infructueux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les soucis de ce monde ». Le grec dit plus littéralement « le souci de cet âge ».
    reason: alternative_reading
  - marker: b
    text: Ou « la séduction des richesses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰς τὰς ἀκάνθας σπαρείς
  choice: Quant à celui qui a été semé parmi les épines
  rationale: Le participe masculin singulier désigne la personne représentée par ce qui a été semé. « Parmi les épines » rend naturellement l’image agricole exprimée par εἰς τὰς ἀκάνθας.
- source_word: ὁ τὸν λόγον ἀκούων
  choice: celui qui entend la parole
  rationale: La proposition relative est naturelle en français et conserve λόγος sous la forme « la parole », c’est-à-dire le message proclamé dans le contexte de la parabole.
- source_word: ἡ μέριμνα τοῦ αἰῶνος τούτου
  choice: les préoccupations de l’époque présente
  rationale: μέριμνα désigne des soucis ou préoccupations qui accaparent l’esprit. « L’époque présente » conserve la valeur temporelle et morale de αἰών sans le confondre avec le monde physique.
- source_word: ἡ ἀπάτη τοῦ πλούτου
  choice: le caractère trompeur de la richesse
  rationale: Cette formulation française explicite naturellement le génitif grec et exprime la capacité de la richesse à induire en erreur, sans ajouter l’idée qu’elle serait mauvaise en elle-même.
- source_word: συμπνίγει
  choice: étouffent
  rationale: Le verbe prolonge directement l’image des épines qui privent une plante d’espace et de vie. Le pluriel français s’accorde avec les deux sujets coordonnés.
- source_word: ἄκαρπος γίνεται
  choice: il finit par ne porter aucun fruit
  rationale: La formulation maintient le référent personnel et restitue le résultat exprimé par γίνεται, tout en conservant la métaphore du fruit dans un français idiomatique.
theological_decisions:
- issue: Sens de αἰών
  choice: l’époque présente
  alternative: ce monde
  rationale: αἰών désigne d’abord un âge ou une époque. Le choix principal préserve cette nuance temporelle, tandis que « ce monde », traditionnel et contextuellement possible, est signalé en note.
- issue: Référent personnel ou impersonnel de la dernière proposition
  choice: il finit par ne porter aucun fruit
  alternative: cela devient infructueux
  rationale: L’explication identifie explicitement ce qui a été semé à « celui qui entend la parole ». Le pronom personnel suit ce déplacement interprétatif et évite de laisser entendre que la parole elle-même deviendrait stérile.
- issue: Portée de la richesse dans ἀπάτη τοῦ πλούτου
  choice: le caractère trompeur de la richesse
  alternative: la séduction des richesses
  rationale: Le texte décrit la richesse comme trompeuse, sans préciser exactement le mécanisme de cette tromperie. La formulation retenue préserve cette ouverture et évite de réduire ἀπάτη au seul attrait séduisant.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases allège la longue construction grecque sans modifier sa progression. « Quant à » marque le passage à ce cas de figure, et la métaphore agricole demeure visible jusqu’à « porter aucun fruit ».
