id: MAT.12.50
reference: Matthew 12:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅστις γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ πατρός μου τοῦ ἐν οὐρανοῖς, αὐτός μου ἀδελφὸς καὶ ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/050.yaml
  text: For whoever does the will of my Father in heaven[a], he is my brother and sister and mother.
translation:
  language: fr
  text: Car quiconque fait la volonté de mon Père qui est dans les cieux, celui-là[a] est mon frère, ma sœur et ma mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette personne est mon frère, ma sœur et ma mère ». Le grec emploie ici une forme masculine singulière dans un sens général.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις ... ἂν
  choice: quiconque
  rationale: La construction relative indéfinie avec ἄν énonce une condition générale et ouverte. « Quiconque » en rend la portée avec concision et dignité.
- source_word: γὰρ
  choice: car
  rationale: « Car » maintient le lien explicatif avec ce qui précède, sans alourdir la phrase.
- source_word: ποιήσῃ
  choice: fait
  rationale: Avec θέλημα, ποιέω signifie naturellement « faire la volonté ». « Obéit » serait plus interprétatif et réduirait légèrement le champ de l’expression.
- source_word: τὸ θέλημα
  choice: la volonté
  rationale: Cette formulation conserve le sens théologique et relationnel du terme sans le paraphraser par « ce que … veut ».
- source_word: τοῦ πατρός μου τοῦ ἐν οὐρανοῖς
  choice: de mon Père qui est dans les cieux
  rationale: Cette traduction suit étroitement la construction attributive grecque et conserve le pluriel « les cieux », tout en restant naturelle en français biblique moderne.
- source_word: αὐτός
  choice: celui-là
  rationale: Le pronom grec est emphatique. « Celui-là » fait ressortir l’identification de la personne qui accomplit la volonté du Père comme membre de la véritable famille de Jésus.
- source_word: ἀδελφὸς
  choice: mon frère
  rationale: Équivalent direct au singulier, avec le possessif requis naturellement en français.
- source_word: ἀδελφὴ
  choice: ma sœur
  rationale: Équivalent direct au singulier; le terme est conservé séparément puisque le grec énumère explicitement les rôles familiaux.
- source_word: μήτηρ
  choice: ma mère
  rationale: Équivalent direct au singulier, qui préserve le troisième élément de l’énumération familiale.
- source_word: ἐστίν
  choice: est
  rationale: Le présent simple du verbe copule est conservé.
theological_decisions:
- issue: Masculin grammatical dans une déclaration de portée générale
  choice: quiconque … celui-là est mon frère, ma sœur et ma mère
  alternative: quiconque … cette personne est mon frère, ma sœur et ma mère
  rationale: Le grec emploie des formes masculines singulières de manière générique. « Celui-là » préserve cette forme et l’emphase de αὐτός, tandis que la mention immédiate de « sœur » et de « mère » manifeste que l’énoncé englobe aussi bien les femmes que les hommes.
translation_notes:
  register: Français international moderne, digne et accessible. « Père » prend une majuscule en raison de son emploi comme désignation de Dieu. La tournure « dans les cieux » conserve l’expression matthéenne et le pluriel du grec; l’énumération frappante « frère, sœur et mère » est maintenue sans l’aplanir.
