id: MAT.12.8
reference: Matthew 12:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κύριος γάρ ἐστιν τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/008.yaml
  text: For the Son of Man is Lord of the Sabbath[a][b].
translation:
  language: fr
  text: Car le Fils de l’homme est Seigneur du sabbat[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Fils de l’homme est maître du sabbat ».'
    reason: lexical_alternative
  - marker: b
    text: « Fils de l’homme » est l’auto-désignation caractéristique de Jésus dans les Évangiles. L’expression peut aussi, plus littéralement, évoquer « l’être humain », mais cette formulation affaiblirait ici sa probable valeur de titre.
    reason: alternative_reading
lexical_decisions:
- source_word: γάρ
  choice: Car
  rationale: Conserve la valeur explicative de la conjonction, qui rattache cette affirmation au raisonnement précédent.
- source_word: κύριος
  choice: Seigneur
  rationale: Préserve à la fois l’idée d’autorité et la portée christologique du terme, sans l’affaiblir en simple fonction de maîtrise.
- source_word: τοῦ σαββάτου
  choice: du sabbat
  rationale: Rend directement le génitif dépendant de κύριος. En français courant, « sabbat » s’écrit normalement avec une minuscule.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Conserve l’auto-désignation caractéristique de Jésus dans les Évangiles ainsi que sa probable résonance avec Daniel 7.
- source_word: ἐστιν
  choice: est
  rationale: Rend simplement la copule au présent, sans ajout interprétatif.
theological_decisions:
- issue: Portée christologique de κύριος ... τοῦ σαββάτου
  choice: « le Fils de l’homme est Seigneur du sabbat »
  alternative: « le Fils de l’homme est maître du sabbat »
  rationale: « Seigneur » maintient la forte affirmation d’autorité portée par le grec et sa tension théologique, sans préciser au-delà du texte la manière dont cette autorité s’exerce.
- issue: Sens de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: Le traiter comme le titre « le Fils de l’homme ».
  alternative: « l’être humain » ou « l’homme »
  rationale: Dans le contexte évangélique, l’expression fonctionne comme l’auto-désignation reconnue de Jésus et possède vraisemblablement une résonance apocalyptique; une formulation générique atténuerait cette dimension.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe concise suit étroitement le grec tout en restant naturelle; les titres christologiques sont conservés sans explicitation confessionnelle.
