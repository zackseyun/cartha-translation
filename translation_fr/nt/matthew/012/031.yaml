id: MAT.12.31
reference: Matthew 12:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν, πᾶσα ἁμαρτία καὶ βλασφημία ἀφεθήσεται τοῖς ἀνθρώποις, ἡ δὲ τοῦ πνεύματος βλασφημία οὐκ ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/031.yaml
  text: Therefore I tell you[a], every sin and blasphemy will be forgiven people[b], but blasphemy against the Spirit will not be forgiven.
translation:
  language: fr
  text: 'C’est pourquoi je vous le dis : tout péché et tout blasphème seront pardonnés aux êtres humains, mais le blasphème contre l’Esprit[a] ne sera pas pardonné.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le blasphème contre l’Esprit Saint ». Le contexte montre qu’il s’agit de l’Esprit Saint, bien que ce verset dise simplement « l’Esprit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée du contexte précédent.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule idiomatique et solennelle qui conserve l’adresse directe.
- source_word: πᾶσα ἁμαρτία καὶ βλασφημία
  choice: toute faute et tout blasphème
  rationale: Le distributif πᾶσα porte sur les deux noms singuliers. « Faute » rend ici ἁμαρτία dans une langue courante et digne, tandis que « blasphème » conserve le terme religieux précis.
- source_word: ἀφεθήσεται τοῖς ἀνθρώποις
  choice: seront pardonnés aux êtres humains
  rationale: Conserve le passif futur et rend explicitement le datif des bénéficiaires; « êtres humains » exprime sans ambiguïté la portée générique de ἄνθρωποι.
- source_word: ἡ δὲ τοῦ πνεύματος βλασφημία
  choice: mais le blasphème contre l’Esprit
  rationale: Le génitif désigne naturellement l’objet du blasphème. « Esprit » respecte l’absence de ἁγίου dans ce verset.
- source_word: οὐκ ἀφεθήσεται
  choice: ne sera pas pardonné
  rationale: Rend directement le futur passif et maintient le contraste avec la première proposition.
theological_decisions:
- issue: Faut-il traduire πνεύματος par « Esprit » ou par « Esprit Saint » ?
  choice: Esprit
  alternative: Esprit Saint
  rationale: Le texte grec de ce verset porte seulement « l’Esprit ». Le contexte identifie clairement le référent comme l’Esprit Saint, mais le texte principal conserve la formulation exacte du verset; la précision interprétative figure en note.
- issue: Valeur du génitif τοῦ πνεύματος
  choice: contre l’Esprit
  alternative: de l’Esprit
  rationale: Dans ce contexte, l’Esprit est l’objet du blasphème, et non son auteur ou son possesseur. « Contre » lève en français une ambiguïté grammaticale qui ne correspond pas au sens contextuel.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme des deux passifs et la tension absolue de l’énoncé. « Êtres humains » évite que le masculin « hommes » soit compris comme excluant les femmes.
