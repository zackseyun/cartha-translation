id: MAT.12.29
reference: Matthew 12:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἢ πῶς δύναταί τις εἰσελθεῖν εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ καὶ τὰ σκεύη αὐτοῦ ⸀ἁρπάσαι, ἐὰν μὴ πρῶτον δήσῃ τὸν ἰσχυρόν; καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/029.yaml
  text: Or how can someone enter the strong man's house and seize his goods[b][a], unless he first binds the strong man? And then he will plunder his house.
translation:
  language: fr
  text: Ou comment quelqu’un peut-il entrer dans la maison de l’homme fort et s’emparer de ses biens[a], s’il n’attache pas d’abord l’homme fort[b] ? Et alors il pillera sa maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses objets » ou « ses possessions » ; le terme grec peut désigner des récipients ou des objets, et plus largement des biens.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne lie pas d’abord l’homme fort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou encore
  rationale: Introduit une autre manière d’exposer l’argument précédent; cette tournure est naturelle en français dans une question rhétorique.
- source_word: πῶς δύναταί τις
  choice: comment quelqu’un peut-il
  rationale: Conserve la structure interrogative et le caractère indéfini et général de τις dans un français idiomatique.
- source_word: εἰσελθεῖν εἰς τὴν οἰκίαν
  choice: entrer dans la maison
  rationale: Rend directement l’image concrète d’une entrée dans une maison.
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: de l’homme fort / l’homme fort
  rationale: L’adjectif substantivé masculin désigne le propriétaire puissant dans la comparaison; « l’homme fort » préserve cette image concrète.
- source_word: τὰ σκεύη αὐτοῦ
  choice: ses biens
  rationale: Dans le contexte du pillage d’une maison, σκεύη désigne plus largement ce qui s’y trouve, les objets ou possessions, plutôt que seulement des récipients.
- source_word: ἁρπάσαι
  choice: s’emparer de
  rationale: Exprime une prise énergique sans l’assimiler entièrement au verbe intensif διαρπάσει employé ensuite.
- source_word: ἐὰν μὴ πρῶτον δήσῃ
  choice: s’il ne ligote pas d’abord
  rationale: « Ligoter » exprime clairement l’action concrète d’attacher et d’immobiliser; « d’abord » conserve l’ordre indiqué par πρῶτον.
- source_word: καὶ τότε
  choice: Alors seulement
  rationale: 'Rend la progression logique et temporelle: le pillage devient possible une fois l’homme fort maîtrisé. « Seulement » explicite naturellement en français la condition déjà formulée par ἐὰν μή.'
- source_word: διαρπάσει
  choice: il pillera
  rationale: Le composé exprime le pillage ou la mise à sac, avec une force supérieure à ἁρπάσαι.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: sa maison
  rationale: Maintient l’image concrète sans lui substituer une interprétation allégorique.
theological_decisions:
- issue: Portée de la métaphore de l’homme fort
  choice: Conserver « l’homme fort », « sa maison » et « ses biens » comme éléments de la comparaison
  alternative: Remplacer ces éléments par une explication directe du domaine de Satan et de ceux qui sont sous son pouvoir
  rationale: Le contexte éclaire la métaphore, mais le verset lui-même la formule comme une scène de cambriolage; la traduction ne doit pas intégrer dans le texte une interprétation allégorique complète.
- issue: Masculin représentatif dans la comparaison
  choice: « quelqu’un » pour τις et « l’homme fort » pour ὁ ἰσχυρός
  alternative: « une personne » et « l’être fort »
  rationale: « Quelqu’un » demeure générique, tandis que « l’homme fort » respecte la forme masculine et le personnage concret de la comparaison grecque.
- issue: Force logique de καὶ τότε après la condition
  choice: « Alors seulement »
  alternative: « Et alors »
  rationale: La condition préalable est explicite dans le grec. La formulation française met nettement en relief cette séquence sans ajouter d’identification doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique et la métaphore concrète sont préservées. « Ligoter » est courant et précis; la note offre l’équivalent plus formel « attacher ».
