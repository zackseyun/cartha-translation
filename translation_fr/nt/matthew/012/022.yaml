id: MAT.12.22
reference: Matthew 12:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε ⸂προσηνέχθη αὐτῷ δαιμονιζόμενος τυφλὸς καὶ κωφός⸃· καὶ ἐθεράπευσεν αὐτόν, ὥστε τὸν ⸀κωφὸν λαλεῖν καὶ βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/022.yaml
  text: Then a demon-possessed man[a], blind and mute, was brought to him; and he healed him, so that the mute man spoke and saw.
translation:
  language: fr
  text: Alors on lui amena un homme possédé par un démon, aveugle et muet[a]. Il le guérit, si bien que l’homme muet put parler et voir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sourd ». Le mot grec peut désigner une personne sourde ou incapable de parler; ici, le contexte favorise « muet », puisque la guérison lui permet de parler et de voir.
    reason: alternative lexicale
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession narrative introduite par l’adverbe grec.
- source_word: προσηνέχθη αὐτῷ
  choice: on lui amena
  rationale: Le pronom indéfini « on » conserve l’agent non précisé du passif grec tout en donnant une tournure française fluide.
- source_word: δαιμονιζόμενος
  choice: possédé par un démon
  rationale: Rend explicitement l’affliction démoniaque exprimée par le grec, sans la remplacer par une catégorie clinique ou un terme vague.
- source_word: τυφλὸς
  choice: aveugle
  rationale: Équivalent lexical direct et naturel.
- source_word: κωφός
  choice: muet
  rationale: Le terme grec peut désigner une personne sourde ou incapable de parler; la proposition de résultat, qui mentionne la parole et la vue, favorise ici « muet ».
- source_word: ἐθεράπευσεν αὐτόν
  choice: Il le guérit
  rationale: Rend directement le verbe de guérison et son complément pronominal, sans ajouter de précision absente du grec.
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit clairement le résultat effectif de la guérison.
- source_word: τὸν κωφὸν λαλεῖν καὶ βλέπειν
  choice: l’homme muet put parler et voir
  rationale: La formulation française exprime naturellement le rétablissement des capacités de parler et de voir; elle évite aussi l’ambiguïté graphique du passé simple « vit ».
theological_decisions:
- issue: Nature de l’affliction démoniaque
  choice: Conserver explicitement « possédé par un démon »
  alternative: « affligé » ou une désignation clinique moderne
  rationale: Le texte grec attribue explicitement l’état de l’homme à une puissance démoniaque; la traduction ne doit ni neutraliser ni réinterpréter cette affirmation.
- issue: Sens de κωφός dans ce contexte
  choice: « muet »
  alternative: « sourd »
  rationale: L’ambiguïté lexicale est réelle, mais le résultat décrit le rétablissement de la parole, et non de l’ouïe. La variante possible est néanmoins conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative est fluide, l’affliction démoniaque reste explicite et l’ambiguïté de κωφός est signalée en note.
