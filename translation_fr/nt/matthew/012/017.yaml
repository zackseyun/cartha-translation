id: MAT.12.17
reference: Matthew 12:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἵνα πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[a], saying:'
translation:
  language: fr
  text: 'afin que s’accomplisse ce qui avait été dit par l’intermédiaire du prophète Ésaïe[a] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le prophète Ésaïe ». Le grec dit plus littéralement « par l’intermédiaire de », soulignant le rôle du prophète comme médiateur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit une proposition de but ou de résultat. « Afin que » conserve le lien explicite avec ce qui précède sans trancher davantage la nuance.
- source_word: πληρωθῇ
  choice: s’accomplisse
  rationale: Le subjonctif passif aoriste après ἵνα est naturellement rendu par le subjonctif français. « S’accomplir » correspond à la formule d’accomplissement caractéristique de Matthieu.
- source_word: τὸ ῥηθὲν
  choice: ce qui avait été dit
  rationale: Le participe substantivé désigne la parole prononcée. Le plus-que-parfait situe naturellement cette parole antérieure par rapport à son accomplissement, tout en conservant le passif.
- source_word: διὰ
  choice: par l’intermédiaire de
  rationale: 'Avec le génitif, διά marque ici l’agence intermédiaire : la formulation présente Ésaïe comme le médiateur humain de la parole, sans faire de lui sa source ultime.'
- source_word: Ἠσαΐου
  choice: Ésaïe
  rationale: Forme française traditionnelle et largement reconnue du nom du prophète.
- source_word: τοῦ προφήτου
  choice: du prophète
  rationale: Conserve l’identification appositionnelle explicitement présente dans le grec.
- source_word: λέγοντος
  choice: ':'
  rationale: Le participe introduit directement la citation qui suit. En français courant, les deux-points rendent ce lien avec plus de naturel qu’un participe tel que « disant ».
theological_decisions:
- issue: Rôle du prophète dans la transmission de la parole
  choice: par l’intermédiaire du prophète Ésaïe
  alternative: par le prophète Ésaïe
  rationale: Cette formulation préserve la valeur instrumentale de διά avec le génitif et laisse entendre que le prophète transmet une parole dont il n’est pas nécessairement la source ultime.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « par l’intermédiaire de » est légèrement plus développée, mais elle rend clairement l’agence intermédiaire exprimée par le grec. Les deux-points introduisent naturellement la citation du verset suivant.
