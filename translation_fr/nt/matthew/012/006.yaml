id: MAT.12.6
reference: Matthew 12:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι τοῦ ἱεροῦ μεῖζόν ἐστιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/006.yaml
  text: But I tell you that something greater than the temple is here[a][b].
translation:
  language: fr
  text: 'Mais je vous le dis : il y a ici plus grand que le temple[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quelqu’un de plus grand que le temple est ici » ou « quelque chose de plus grand que le temple est ici ». Le grec emploie une forme neutre (« plus grand ») et ne précise pas formellement le référent.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « en ce lieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mais je vous le dis
  rationale: La formule introduit une parole directe. δέ marque ici un contraste modéré avec l’argument précédent ; « Mais » le rend naturellement, tandis que la dislocation « je vous le dis » convient au français courant et solennel.
- source_word: ὅτι
  choice: ':'
  rationale: Le deux-points introduit idiomatiquement en français le contenu de la déclaration là où le grec emploie ὅτι, sans ajouter un lourd « que ».
- source_word: τοῦ ἱεροῦ
  choice: que le temple
  rationale: ἱερόν désigne normalement l’ensemble du temple plutôt que le sanctuaire intérieur, plus précisément désigné par ναός. « Le temple » est donc à la fois naturel et exact ici.
- source_word: μεῖζόν
  choice: plus grand
  rationale: Le comparatif neutre singulier est employé substantivement sans référent exprimé. La tournure française « il y a ici plus grand » préserve mieux cette indétermination que « quelque chose de plus grand », qui impose explicitement une chose.
- source_word: ἐστιν
  choice: il y a
  rationale: Avec le comparatif substantivé et l’adverbe locatif, cette tournure existentielle est naturelle en français et rend la présence affirmée par ἐστιν.
- source_word: ὧδε
  choice: ici
  rationale: L’adverbe locatif signifie « ici » ou « en ce lieu ». « Ici » est concis et naturel.
theological_decisions:
- issue: Identité du référent non exprimé du comparatif neutre μεῖζόν
  choice: 'Conserver une formulation sans nommer le référent : « il y a ici plus grand que le temple »'
  alternative: « quelqu’un de plus grand que le temple est ici » ou « quelque chose de plus grand que le temple est ici »
  rationale: Le grec emploie le neutre singulier μεῖζόν et laisse formellement le référent non exprimé. Le contexte peut orienter vers Jésus et son autorité, mais le texte principal ne doit ni imposer « quelqu’un » ni réduire le sens à une « chose ».
translation_notes:
  register: Français international moderne, digne et accessible. La formulation légèrement solennelle « il y a ici plus grand » demeure idiomatique et permet de préserver l’ambiguïté grammaticale et théologique du grec.
