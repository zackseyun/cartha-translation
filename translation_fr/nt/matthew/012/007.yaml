id: MAT.12.7
reference: Matthew 12:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγνώκειτε τί ἐστιν· Ἔλεος θέλω καὶ οὐ θυσίαν, οὐκ ἂν κατεδικάσατε τοὺς ἀναιτίους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/007.yaml
  text: But if you had known what this means[b][a], ‘I desire mercy and not sacrifice,’ you would not have condemned the guiltless.
translation:
  language: fr
  text: 'Mais si vous aviez compris ce que cela signifie[b] : « Je veux la miséricorde, et non le sacrifice », vous n’auriez pas condamné des innocents[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui sont sans faute ».'
    reason: lexical_alternative
  - marker: b
    text: Jésus cite Osée 6.6.
    reason: cross_reference
lexical_decisions:
- source_word: ἐγνώκειτε
  choice: vous aviez compris
  rationale: Dans cette condition contraire aux faits, le plus-que-parfait français convient. « Compris » exprime naturellement la saisie du sens de l’Écriture évoquée ici.
- source_word: τί ἐστιν
  choice: ce que signifie cette parole
  rationale: Cette formulation idiomatique introduit le sens de la citation. L’ajout léger de « cette parole » explicite le référent sans interpréter le contenu.
- source_word: Ἔλεος
  choice: la compassion
  rationale: « Compassion » rend ici ἔλεος dans son orientation concrète envers autrui et s’accorde naturellement avec l’enseignement de Jésus dans le contexte. « Miséricorde » demeure une traduction traditionnelle possible, mais son registre est moins courant.
- source_word: θέλω
  choice: je veux
  rationale: « Je veux » rend directement θέλω en français actuel tout en gardant la force de la déclaration prophétique.
- source_word: θυσίαν
  choice: le sacrifice
  rationale: Le singulier défini est la manière naturelle de rendre le nom grec dans cette maxime prophétique et conserve le contraste avec la compassion.
- source_word: κατεδικάσατε
  choice: vous n’auriez pas condamné
  rationale: Le conditionnel passé traduit l’apodose irréelle avec ἄν, tandis que « condamné » conserve la portée judiciaire du verbe.
- source_word: ἀναιτίους
  choice: des innocents
  rationale: Le français exige ici naturellement l’article indéfini pluriel. « Innocents » exprime clairement l’absence de faute reprochable et convient au cadre judiciaire créé par « condamné ».
theological_decisions:
- issue: Préserver la force du contraste dans la citation d’Osée 6.6 sans en faire une négation générale de tout sacrifice
  choice: « Je veux la compassion, et non le sacrifice »
  alternative: « C’est la miséricorde que je désire, et non le sacrifice »
  rationale: La formulation conserve le contraste tranché du grec et la priorité prophétique accordée à la compassion, sans ajouter une explication qui abolirait le sacrifice au-delà de ce qu’affirme la citation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conditionnelle reste proche du grec tout en étant naturelle. La citation prophétique conserve une formulation concise et solennelle; « compassion » évite un archaïsme inutile, tandis que la note maintient la nuance médico-judiciaire possible de ἀναίτιος.
