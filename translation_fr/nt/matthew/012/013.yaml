id: MAT.12.13
reference: Matthew 12:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε λέγει τῷ ἀνθρώπῳ· Ἔκτεινόν ⸂σου τὴν χεῖρα⸃· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ὑγιὴς ὡς ἡ ἄλλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/013.yaml
  text: Then he says to the man[a], “Stretch out your hand.” And he stretched it out, and it was restored[b], healthy like the other one.
translation:
  language: fr
  text: 'Alors il dit à l’homme : « Étends ta main[c]. » Il l’étendit, et elle redevint saine[a] comme l’autre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle fut rétablie »; le verbe grec souligne le retour à un état normal.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « comme l’autre »; « l’autre » désigne l’autre main de l’homme.
    reason: lexical_alternative
  - marker: c
    text: Certains manuscrits omettent « ta main ».
    reason: textual_variant
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession des événements dans le récit.
- source_word: λέγει
  choice: il dit
  rationale: Conserve le présent historique grec, possible et vivant dans un récit français.
- source_word: τῷ ἀνθρώπῳ
  choice: à l’homme
  rationale: Le contexte désigne un homme précis, et non une personne indéterminée.
- source_word: Ἔκτεινόν
  choice: Tends
  rationale: Rend directement l’impératif de ἐκτείνω dans un français naturel.
- source_word: σου τὴν χεῖρα
  choice: ta main
  rationale: χείρ désigne ici la main, comme le confirme la comparaison finale avec l’autre.
- source_word: ἐξέτεινεν
  choice: Il la tendit
  rationale: Reproduit la répétition entre l’ordre et son exécution, avec le pronom requis en français.
- source_word: ἀπεκατεστάθη
  choice: elle fut rétablie
  rationale: Le verbe exprime le retour à un état normal ou antérieur; « rétablie » préserve cette nuance mieux que le seul verbe « guérir ».
- source_word: ὑγιὴς
  choice: saine
  rationale: Exprime l’état de santé et de bon fonctionnement de la main sans ajouter d’interprétation.
- source_word: ὡς ἡ ἄλλη
  choice: comme l’autre
  rationale: Le féminin grec renvoie implicitement à l’autre main; le français peut conserver cette référence implicite.
theological_decisions:
- issue: Nature de la guérison décrite
  choice: La main est dite rétablie et saine, sans interprétation doctrinale supplémentaire.
  alternative: La main fut guérie ou rendue intacte.
  rationale: Cette formulation suit les deux termes grecs, ἀπεκατεστάθη et ὑγιής, et décrit sobrement le miracle sans en développer la portée théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le présent historique « il dit » conserve la vivacité du grec, tandis que le passé simple exprime naturellement l’action ponctuelle qui suit. La construction « rétablie, saine comme l’autre » reste proche de la formulation grecque tout en demeurant intelligible.
