  naturalness: La formulation révisée améliore la fluidité sans amoindrir le parallélisme ni la gravité de l’avertissement. « Cela lui sera pardonné » demeure compréhensible et conserve utilement le passif impersonnel centré sur la parole ou la faute.
  terminology: « Fils de l’homme », « Esprit Saint » et « âge » sont appropriés au français international moderne et restent proches du grec. « Âge présent » / « âge à venir » rend le contraste temporel αἰών / μέλλων sans importer d’interprétation doctrinale.
