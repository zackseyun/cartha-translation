  to: Et quiconque prononcera une parole contre le Fils de l’homme, cela lui sera pardonné ; mais quiconque parlera contre l’Esprit Saint, cela ne lui sera pardonné ni dans l’âge présent ni dans l’âge à venir.[a]
  rationale: 'Une seule correction stylistique sûre est nécessaire : « prononcera une parole » est plus idiomatique que « dira une parole », tout en conservant la distinction du grec entre εἴπῃ λόγον dans la première proposition et εἴπῃ sans objet exprimé dans la seconde. Le reste du texte transmet adéquatement le sens et l’ambiguïté du verset.'
