id: MAT.12.32
reference: Matthew 12:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὃς ἐὰν εἴπῃ λόγον κατὰ τοῦ υἱοῦ τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ· ὃς δ’ ἂν εἴπῃ κατὰ τοῦ πνεύματος τοῦ ἁγίου, οὐκ ἀφεθήσεται αὐτῷ οὔτε ἐν ⸂τούτῳ τῷ⸃ αἰῶνι οὔτε ἐν τῷ μέλλοντι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/032.yaml
  text: And whoever speaks a word against the Son of Man[a], it will be forgiven him; but whoever speaks against the Holy Spirit, it will not be forgiven him[c][b], neither in this age nor in the coming one.
translation:
  language: fr
  text: Et quiconque prononcera une parole contre le Fils de l’homme, cela lui sera pardonné ; mais quiconque parlera contre l’Esprit Saint, cela ne lui sera pardonné ni dans l’âge présent ni dans l’âge à venir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ni dans celui qui vient », le mot « âge » étant sous-entendu d’après l’expression précédente.'
    reason: La note signale l’ellipse de τῷ μέλλοντι et explique pourquoi le texte français explicite « âge ».
lexical_decisions:
- source_word: ὃς ἐὰν / ὃς δ’ ἂν
  choice: quiconque… mais quiconque
  rationale: Les constructions indéfinies expriment une condition générale. « Quiconque » en conserve la portée ouverte et solennelle.
- source_word: εἴπῃ λόγον
  choice: dira une parole
  rationale: Cette formulation maintient la présence explicite de λόγον tout en restant idiomatique en français.
- source_word: κατὰ
  choice: contre
  rationale: Avec le génitif, κατά désigne ici une parole hostile dirigée contre quelqu’un ; « contre » convient naturellement dans les deux propositions.
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette traduction consacrée préserve la forme du titre et ses résonances messianiques et apocalyptiques.
- source_word: ἀφεθήσεται αὐτῷ / οὐκ ἀφεθήσεται αὐτῷ
  choice: cela lui sera pardonné / cela ne lui sera pardonné
  rationale: Le tour passif est conservé dans les deux propositions, tandis que « cela » renvoie naturellement à la parole ou à l’acte de parler contre.
- source_word: τοῦ πνεύματος τοῦ ἁγίου
  choice: l’Esprit Saint
  rationale: C’est la désignation courante et digne en français moderne.
- source_word: οὔτε ἐν τούτῳ τῷ αἰῶνι οὔτε ἐν τῷ μέλλοντι
  choice: ni dans l’âge présent ni dans l’âge à venir
  rationale: αἰών désigne ici un âge ou une époque, et non d’abord le monde comme espace. La seconde expression développe en français l’ellipse grecque afin d’être immédiatement claire.
theological_decisions:
- issue: Contraste temporel entre αἰών et μέλλων
  choice: ni dans l’âge présent ni dans l’âge à venir
  alternative: ni dans ce monde ni dans le monde à venir
  rationale: Le grec oppose deux âges dans une perspective temporelle et eschatologique. « Âge » évite de transformer cette opposition en contraste entre deux mondes spatiaux, sans imposer un système doctrinal particulier.
- issue: Nature de la faute qui ne sera pas pardonnée
  choice: Conserver l’avertissement sans définir davantage l’acte de parler contre l’Esprit Saint
  alternative: Préciser dans la traduction qu’il s’agit soit d’une accusation historique particulière, soit de l’impénitence finale
  rationale: Ce verset énonce la gravité et la conséquence de cette parole, mais n’en fournit pas ici une définition théologique exhaustive. La traduction n’ajoute donc aucune interprétation confessionnelle.
translation_notes:
  register: Français international moderne, clair et solennel. « Quiconque » convient au caractère général de l’avertissement sans être archaïque. La répétition de « cela lui sera pardonné » maintient le parallélisme et la tension du texte grec.
