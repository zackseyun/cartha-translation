id: MAT.12.28
reference: Matthew 12:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν πνεύματι θεοῦ ἐγὼ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/028.yaml
  text: But if I cast out the demons by the Spirit of God[b][a], then the kingdom of God has come upon you.
translation:
  language: fr
  text: Mais si, moi, je chasse les démons par l’Esprit de Dieu[a], alors le royaume de Dieu est arrivé jusqu’à vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Esprit de Dieu ». La tournure grecque peut exprimer ici le moyen ou la sphère d’action.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous a atteints ». Le verbe grec souligne que le royaume de Dieu est parvenu jusqu’à eux dans les œuvres de Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: Rend la condition tout en conservant la légère opposition introduite par δέ dans l’argumentation.
- source_word: ἐν πνεύματι θεοῦ
  choice: par l’Esprit de Dieu
  rationale: ἐν avec le datif peut ici exprimer le moyen ou l’agent. « Par » indique naturellement que l’expulsion des démons s’accomplit grâce à l’action de l’Esprit, sans effacer l’autre nuance possible.
- source_word: ἐγὼ
  choice: moi, je
  rationale: Le pronom grec est explicite et emphatique. La dislocation française « moi, je » en préserve l’accent sans alourdir excessivement la phrase.
- source_word: ἐκβάλλω
  choice: je chasse
  rationale: Dans ce contexte, « chasser les démons » est une expression française actuelle et claire qui restitue l’idée de les expulser.
- source_word: τὰ δαιμόνια
  choice: les démons
  rationale: Équivalent direct, précis et immédiatement compréhensible de δαιμόνια.
- source_word: ἄρα
  choice: alors
  rationale: Marque clairement la conclusion logique tirée de la condition précédente.
- source_word: ἔφθασεν
  choice: est arrivé
  rationale: Le verbe exprime ici le fait d’atteindre ou d’arriver. Le passé composé communique à la fois l’arrivée effective et sa portée présente.
- source_word: ἐφ’ ὑμᾶς
  choice: jusqu’à vous
  rationale: Exprime le mouvement qui atteint les interlocuteurs, tout en conservant la force de l’expression grecque sans imposer le sens plus interprétatif d’« au milieu de vous ».
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation française établie qui peut désigner à la fois l’exercice de la royauté divine et le domaine soumis à cette royauté, sans réduire le sens au seul concept abstrait de règne.
theological_decisions:
- issue: Rapport entre le royaume de Dieu et les expulsions de démons accomplies par Jésus
  choice: Le royaume de Dieu est présenté comme ayant réellement atteint les interlocuteurs dans les œuvres présentes de Jésus.
  alternative: Le royaume se serait seulement approché, ou la formule ne concernerait que son accomplissement futur.
  rationale: ἔφθασεν indique une arrivée effective. La traduction conserve cette affirmation présente sans se prononcer sur les dimensions futures du royaume.
- issue: Référence de « l’Esprit de Dieu »
  choice: La majuscule signale une référence personnelle à l’Esprit de Dieu.
  alternative: Comprendre l’expression comme une simple puissance divine impersonnelle.
  rationale: Dans ce contexte, πνεύματι θεοῦ désigne l’agent divin par lequel Jésus chasse les démons. La traduction n’ajoute toutefois aucune précision qui ne figure pas dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Moi, je » conserve l’insistance du pronom grec; « est arrivé jusqu’à vous » maintient l’image d’une réalité qui atteint les auditeurs, sans remplacer « royaume » par une interprétation plus étroite.
