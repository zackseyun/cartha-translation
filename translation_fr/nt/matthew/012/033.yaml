id: MAT.12.33
reference: Matthew 12:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἢ ποιήσατε τὸ δένδρον καλὸν καὶ τὸν καρπὸν αὐτοῦ καλόν, ἢ ποιήσατε τὸ δένδρον σαπρὸν καὶ τὸν καρπὸν αὐτοῦ σαπρόν· ἐκ γὰρ τοῦ καρποῦ τὸ δένδρον γινώσκεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/033.yaml
  text: Either make the tree good and its fruit good[a], or make the tree rotten and its fruit rotten[b]; for the tree is known by its fruit.
translation:
  language: fr
  text: Ou bien faites[a] que l’arbre soit bon et que son fruit soit bon, ou bien faites que l’arbre soit pourri[b] et que son fruit soit pourri ; car on reconnaît l’arbre à son fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « faites » peut aussi avoir le sens rhétorique de « considérez » ou « montrez comme étant » ; la forme grecque est toutefois un impératif.
    reason: alternative_reading
  - marker: b
    text: Le mot grec peut aussi être rendu par « mauvais » ; il désigne ce qui est gâté, corrompu ou sans valeur.
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: faites que… soit
  rationale: L’impératif aoriste pluriel est conservé sous une forme française naturelle. Dans ce raisonnement, le verbe peut avoir la force rhétorique de « considérez » ou « montrez comme étant », mais la traduction garde l’impératif sans en fixer davantage le sens.
- source_word: δένδρον
  choice: arbre
  rationale: Équivalent français direct et naturel, qui maintient l’image centrale.
- source_word: καλός
  choice: bon
  rationale: « Bon » conserve à la fois l’idée de bonne qualité et la portée morale possible de la métaphore, sans réduire le sens à « sain ».
- source_word: καρπός
  choice: fruit
  rationale: Équivalent direct, courant et traditionnel, qui préserve l’image grecque.
- source_word: σαπρός
  choice: pourri
  rationale: Le mot désigne ce qui est gâté, corrompu ou sans valeur. « Pourri » maintient la vigueur concrète de l’image et peut qualifier ici l’arbre comme son fruit.
- source_word: ἐκ γὰρ τοῦ καρποῦ
  choice: car… à son fruit
  rationale: « Car » exprime la relation explicative marquée par γάρ, tandis que « reconnaître à son fruit » rend idiomatiquement en français l’idée de provenance ou de critère portée par ἐκ.
- source_word: γινώσκεται
  choice: on reconnaît
  rationale: Le passif grec est rendu par la tournure française indéfinie « on reconnaît », plus naturelle ici que « est connu », sans préciser l’identité de ceux qui reconnaissent.
theological_decisions:
- issue: Valeur des impératifs dans la métaphore de Jésus
  choice: 'Conserver les impératifs directs : « faites que… soit »'
  alternative: « Considérez l’arbre comme bon… » ou une reformulation déclarative
  rationale: Le grec emploie deux impératifs aoristes parallèles. Même s’ils ont probablement une fonction rhétorique, les maintenir évite de résoudre implicitement la tension entre action, appréciation et manifestation, et conserve la vigueur de l’argument.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « bon » et de « pourri » ainsi que le parallélisme des deux propositions sont volontairement conservés. La conclusion emploie la formulation idiomatique « on reconnaît l’arbre à son fruit ».
