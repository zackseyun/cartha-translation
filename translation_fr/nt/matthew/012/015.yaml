source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς γνοὺς ἀνεχώρησεν ἐκεῖθεν. καὶ ἠκολούθησαν ⸀αὐτῷ πολλοί, καὶ ἐθεράπευσεν αὐτοὺς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/015.yaml
  text: But Jesus[a], knowing this, withdrew from there. And many followed him, and he healed them all,
translation:
  language: fr
  text: Mais Jésus, sachant cela[a], se retira de là. Beaucoup le suivirent, et il les guérit tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec ne précise pas ce que Jésus savait; le contexte renvoie au verset précédent. Ou : « Jésus, l’ayant appris, se retira de là. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: sachant cela
  rationale: Le participe aoriste de γινώσκω exprime ici une connaissance qui motive le retrait de Jésus. « Cela » explicite sobrement l’objet sous-entendu, fourni par le verset précédent, sans préciser davantage la nature du complot.
- source_word: ἀνεχώρησεν
  choice: se retira
  rationale: Dans ce contexte d’hostilité, ἀναχωρέω désigne un départ délibéré. « Se retira » conserve cette nuance mieux que le plus neutre « partit ».
- source_word: ἐκεῖθεν
  choice: de là
  rationale: Équivalent français naturel et concis indiquant l’éloignement du lieu où Jésus se trouvait.
- source_word: ἠκολούθησαν αὐτῷ πολλοί
  choice: Beaucoup le suivirent
  rationale: πολλοί signifie simplement « beaucoup » ou « de nombreuses personnes », sans employer explicitement le mot « foules ». La formulation retenue est concise et naturelle.
- source_word: ἐθεράπευσεν
  choice: il guérit
  rationale: Dans les récits évangéliques, θεραπεύω désigne couramment l’action de guérir; « guérit » en est l’équivalent français direct.
- source_word: αὐτοὺς πάντας
  choice: il les guérit tous
  rationale: Cette formulation rend clairement la portée inclusive de πάντας tout en restant idiomatique en français.
theological_decisions:
- issue: Objet implicite de γνοὺς
  choice: L’objet contextuel est rendu par « cela » et renvoie à ce qui vient d’être rapporté au verset précédent.
  alternative: « en ayant eu connaissance » ou une formulation laissant l’objet non exprimé
  rationale: Le grec ne nomme pas l’objet de la connaissance de Jésus. « Cela » maintient le lien narratif avec le verset précédent sans transformer l’allusion en explication doctrinale.
- issue: Nuance du départ de Jésus
  choice: « se retira »
  alternative: « partit » ou « s’en alla »
  rationale: Le choix préserve l’idée d’un retrait délibéré face à l’opposition, sans suggérer la peur ni attribuer au geste une motivation que le texte n’énonce pas explicitement.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Beaucoup » évite d’introduire l’idée explicite de foules, absente du terme grec.
