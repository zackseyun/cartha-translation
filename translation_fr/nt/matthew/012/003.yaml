  text: ὁ δὲ εἶπεν αὐτοῖς· Οὐκ ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε ⸀ἐπείνασεν καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/003.yaml
  text: But he said to them[a], “Have you not read what David did when he was hungry, and those with him were hungry?”
translation:
  language: fr
  text: 'Mais il leur dit : « N’avez-vous pas lu ce que David a fait quand lui et ceux qui l’accompagnaient ont eu faim[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand il a eu faim, ainsi que ceux qui étaient avec lui ». En grec, le verbe est au singulier et se rapporte explicitement à David; l’ajout « ceux qui étaient avec lui » peut aussi être compris comme étendant la faim à ses compagnons.'
    reason: ambiguïté grammaticale et alternative de traduction
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mais il
  rationale: δέ marque ici une transition légère et introduit la réponse de Jésus à l’accusation précédente ; « Mais il » restitue naturellement ce contraste en français.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: Rendu direct et idiomatique de λέγω suivi du datif αὐτοῖς, sans ajouter la nuance plus interprétative de « répondit ».
- source_word: Οὐκ ἀνέγνωτε
  choice: N’avez-vous pas lu
  rationale: Le passé composé convient à cette question rhétorique qui fait appel à la connaissance présente d’un texte déjà lu.
- source_word: τί ἐποίησεν
  choice: ce que … a fait
  rationale: 'ποιέω garde ici son sens historique simple : « faire ».'
- source_word: Δαυὶδ
  choice: David
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ὅτε ἐπείνασεν
  choice: quand … ont eu faim
  rationale: πεινάω signifie « avoir faim ». Le français emploie naturellement le pluriel lorsque David et ses compagnons sont présentés comme sujets coordonnés ; une note signale que le grec porte explicitement un verbe singulier renvoyant à David.
- source_word: καὶ οἱ μετ’ αὐτοῦ
  choice: lui et ceux qui l’accompagnaient
  rationale: La tournure exprime naturellement en français les personnes qui étaient avec David. « Ceux qui l’accompagnaient » reste proche du grec sans préciser davantage la nature de leur relation.
theological_decisions:
- issue: 'Portée de la faim : David seul grammaticalement, ou David et ses compagnons'
  choice: Le texte principal comprend David et ceux qui l’accompagnaient comme ayant tous faim.
  alternative: « quand il a eu faim, ainsi que ceux qui étaient avec lui » ou une formulation limitant explicitement le verbe singulier à David
  rationale: Le grec emploie le singulier ἐπείνασεν, qui renvoie explicitement à David, puis ajoute καὶ οἱ μετ’ αὐτοῦ. Cette coordination peut étendre implicitement la faim aux compagnons. Le pluriel donne une phrase française naturelle, tandis que la note conserve la particularité grammaticale et l’ambiguïté de la source.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique garde sa force directe. « Ceux qui l’accompagnaient » est plus naturel que le calque « ceux avec lui », tandis que la note préserve la tension entre le verbe grec au singulier et le groupe coordonné qui suit.
