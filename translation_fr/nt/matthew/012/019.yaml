id: MAT.12.19
reference: Matthew 12:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἐρίσει οὐδὲ κραυγάσει, οὐδὲ ἀκούσει τις ἐν ταῖς πλατείαις τὴν φωνὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/019.yaml
  text: He will not quarrel or cry out[a], and no one will hear his voice in the streets.
translation:
  language: fr
  text: Il ne cherchera pas querelle et ne criera pas[a] ; personne n’entendra sa voix dans les rues.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il ne contestera pas et ne poussera pas de cris ; personne n’entendra sa voix sur les places publiques. »'
    reason: Alternative lexicale pour ἐρίσει, κραυγάσει et πλατείαις.
lexical_decisions:
- source_word: ἐρίσει
  choice: ne cherchera pas querelle
  rationale: Le futur de ἐρίζω évoque le fait de se livrer à la dispute ou à la querelle. Cette expression française naturelle décrit une attitude non conflictuelle sans suggérer une passivité absolue.
- source_word: κραυγάσει
  choice: ne criera pas
  rationale: κραυγάζω désigne un cri poussé à haute voix. « Crier » conserve la sobriété et le parallélisme du grec, tandis que « vociférer » serait trop chargé.
- source_word: ἀκούσει τις
  choice: personne n’entendra
  rationale: L’indéfini τις placé sous la portée de la négation se rend naturellement en français par « personne ».
- source_word: ἐν ταῖς πλατείαις
  choice: dans les rues
  rationale: πλατεῖαι désigne les voies larges et publiques d’une ville. « Dans les rues » est idiomatique et conserve l’idée d’un espace public ; « sur les places publiques » reste possible.
- source_word: τὴν φωνὴν αὐτοῦ
  choice: sa voix
  rationale: φωνή signifie ici la voix humaine, dans une affirmation portant sur une expression publique.
- source_word: οὐκ…οὐδὲ…οὐδὲ
  choice: ne… pas et ne… pas ; personne ne…
  rationale: Cette structure française préserve l’accumulation des trois négations grecques tout en restant fluide.
theological_decisions:
- issue: Rapport avec la citation du serviteur d’Ésaïe et portrait du Messie
  choice: Le verset présente le Messie comme non conflictuel et dépourvu d’ostentation publique.
  alternative: Une formulation plus littérale ou traditionnelle pourrait employer « ne contestera pas » et « n’élèvera pas la voix ».
  rationale: Le grec caractérise l’attitude douce et non tapageuse de Jésus dans l’accomplissement d’Ésaïe 42. Il ne faut pas en déduire qu’il ne parle jamais en public ni qu’il demeure toujours passif.
translation_notes:
  register: Français international moderne, clair et digne. « Chercher querelle » rend naturellement l’attitude décrite ; le point-virgule fait entendre la progression des négations sans alourdir la phrase.
