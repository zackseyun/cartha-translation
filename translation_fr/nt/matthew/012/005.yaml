id: MAT.12.5
reference: Matthew 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἢ οὐκ ἀνέγνωτε ἐν τῷ νόμῳ ὅτι τοῖς σάββασιν οἱ ἱερεῖς ἐν τῷ ἱερῷ τὸ σάββατον βεβηλοῦσιν καὶ ἀναίτιοί εἰσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/005.yaml
  text: Or have you not read in the Law that on the Sabbaths the priests in the temple profane the Sabbath and are guiltless?[a][b][c]
translation:
  language: fr
  text: Ou bien, n’avez-vous pas lu dans la Loi[c] que, les jours de sabbat[a], les prêtres profanent le sabbat[b] dans le temple et ne sont pas coupables ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie le pluriel, littéralement « aux sabbats », probablement pour évoquer ce qui se produit de façon répétée chaque jour de sabbat.
    reason: lexical_alternative
  - marker: b
    text: Ou « violent le sabbat » ou « enfreignent le sabbat ». Le verbe grec signifie traiter comme commun ou profane.
    reason: lexical_alternative
  - marker: c
    text: La « Loi » désigne ici la Loi mosaïque et peut notamment inclure les prescriptions concernant le service sacerdotal le jour du sabbat (voir Nombres 28.9-10).
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Introduit un autre argument tiré des Écritures et maintient naturellement la progression rhétorique en français.
- source_word: οὐκ ἀνέγνωτε
  choice: n’avez-vous pas lu
  rationale: Formule interrogative rhétorique naturelle en français, qui souligne la connaissance attendue des Écritures.
- source_word: ἐν τῷ νόμῳ
  choice: dans la Loi
  rationale: La majuscule indique qu’il s’agit de la Loi mosaïque en tant que corpus scripturaire, non de la loi au sens abstrait.
- source_word: τοῖς σάββασιν
  choice: les jours de sabbat
  rationale: Rend le pluriel grec et son idée probable d’occasions répétées, tout en restant idiomatique en français.
- source_word: οἱ ἱερεῖς
  choice: les prêtres
  rationale: Désigne directement les prêtres chargés du service du temple.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: Rendu naturel de ἱερόν, qui peut désigner l’ensemble du complexe du temple.
- source_word: τὸ σάββατον
  choice: le sabbat
  rationale: Conserve le singulier grec qui présente ici le sabbat comme jour ou institution.
- source_word: βεβηλοῦσιν
  choice: profanent
  rationale: Préserve le sens fort de traiter comme profane ou commun, ainsi que la tension provocatrice de l’argument.
- source_word: ἀναίτιοί εἰσιν
  choice: sans pour autant être coupables
  rationale: Exprime clairement l’absence de culpabilité tout en faisant ressortir le contraste avec « profanent ».
theological_decisions:
- issue: Faut-il atténuer l’énoncé pour éviter de laisser entendre que les prêtres transgressent réellement le sabbat ?
  choice: Conserver la formulation forte « profanent le sabbat » et affirmer simultanément qu’ils ne sont pas coupables.
  alternative: « enfreignent le sabbat et sont innocents » ou une paraphrase expliquant que leur service sacerdotal est permis
  rationale: 'Le grec maintient délibérément une tension : l’activité sacerdotale peut être qualifiée de profanation du sabbat, tandis que les prêtres demeurent exempts de culpabilité. La traduction ne doit pas résoudre silencieusement cette tension.'
translation_notes:
  register: Français international moderne, naturel et digne. « Ou bien » soutient le mouvement argumentatif; « les jours de sabbat » rend le pluriel sans lourdeur; la construction « sans pour autant » fait ressortir nettement la tension entre profanation apparente et absence de culpabilité.
