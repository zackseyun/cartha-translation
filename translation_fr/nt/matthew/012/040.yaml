id: MAT.12.40
reference: Matthew 12:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἦν Ἰωνᾶς ἐν τῇ κοιλίᾳ τοῦ κήτους τρεῖς ἡμέρας καὶ τρεῖς νύκτας, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ καρδίᾳ τῆς γῆς τρεῖς ἡμέρας καὶ τρεῖς νύκτας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/040.yaml
  text: For just as Jonah was in the belly of the sea creature three days and three nights[c][b][a], so the Son of Man will be in the heart of the earth three days and three nights.
translation:
  language: fr
  text: En effet, de même que Jonas fut dans le ventre d’un grand animal marin[a] pendant trois jours et trois nuits[c], de même le Fils de l’homme sera au cœur de la terre[b] pendant trois jours et trois nuits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grand poisson ». Le mot grec désigne un grand animal marin et ne correspond pas nécessairement à une espèce zoologique précise.
    reason: lexical_alternative
  - marker: b
    text: L’expression « au cœur de la terre » peut évoquer l’ensevelissement, le tombeau, les profondeurs de la terre ou le séjour des morts; la métaphore grecque est conservée dans le texte.
    reason: alternative_reading
  - marker: c
    text: L’expression « trois jours et trois nuits » est parfois comprise comme une tournure pouvant inclure des portions de trois jours; d’autres la prennent dans un sens plus strict.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: En effet, de même que
  rationale: « De même que » exprime clairement la comparaison introduite par ὥσπερ, tandis que « en effet » rend la valeur explicative et connective de γάρ dans un français naturel.
- source_word: Ἰωνᾶς
  choice: Jonas
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: ἐν τῇ κοιλίᾳ
  choice: dans le ventre
  rationale: κοιλία désigne ici naturellement le ventre; cette formulation reste concrète, claire et fidèle à l’allusion au récit de Jonas.
- source_word: τοῦ κήτους
  choice: d’un grand animal marin
  rationale: κῆτος désigne un grand être ou animal marin sans imposer une espèce zoologique précise. Cette traduction évite le terme trop spécifique « baleine » tout en restant naturelle en français.
- source_word: τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: pendant trois jours et trois nuits
  rationale: La durée explicitement répétée dans le grec est conservée sans en trancher la portée chronologique; « pendant » rend naturellement l’emploi temporel de ἐν en français.
- source_word: οὕτως
  choice: de même
  rationale: Reprend explicitement la structure comparative et relie naturellement les deux membres de la phrase.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Formulation française consacrée qui préserve le titre biblique et ses résonances sans le réduire à une simple désignation générique.
- source_word: ἔσται
  choice: sera
  rationale: Rend directement le futur du verbe εἰμί, sans ajouter l’idée de demeurer ou de rester.
- source_word: ἐν τῇ καρδίᾳ τῆς γῆς
  choice: au cœur de la terre
  rationale: Conserve la métaphore de καρδία et l’ambiguïté du grec, au lieu de préciser dans le texte principal s’il s’agit du tombeau, des profondeurs ou du séjour des morts.
theological_decisions:
- issue: Sens de « au cœur de la terre »
  choice: Conserver la métaphore « au cœur de la terre » sans l’expliciter.
  alternative: Le tombeau, les profondeurs de la terre ou le séjour des morts.
  rationale: L’expression grecque est métaphorique et ne détermine pas à elle seule une seule de ces interprétations; la traduction préserve donc cette tension.
- issue: Portée de « trois jours et trois nuits »
  choice: Conserver intégralement l’expression temporelle.
  alternative: Une expression sémitique pouvant inclure des portions de trois jours, ou une durée stricte de soixante-douze heures.
  rationale: Le verset énonce expressément « trois jours et trois nuits ». La traduction ne doit pas résoudre dans le texte principal le débat chronologique qui entoure cette formule.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple « fut » donne à l’allusion narrative une concision soutenue sans obscurcir le sens. La répétition de « trois jours et trois nuits » et la métaphore « au cœur de la terre » sont maintenues conformément au grec.
