id: MAT.12.18
reference: Matthew 12:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδοὺ ὁ παῖς μου ὃν ᾑρέτισα, ὁ ἀγαπητός μου ⸂εἰς ὃν⸃ εὐδόκησεν ἡ ψυχή μου· θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν, καὶ κρίσιν τοῖς ἔθνεσιν ἀπαγγελεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/018.yaml
  text: Behold[a], my servant whom I have chosen, my beloved in whom my soul has delighted. I will put my Spirit upon him[c][b], and he will proclaim justice to the nations.
translation:
  language: fr
  text: 'Voici mon serviteur que j’ai choisi,

    mon bien-aimé en qui mon âme a pris plaisir.

    Je mettrai mon Esprit sur lui,

    et il annoncera la justice[a] aux nations[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jugement ».
    reason: Alternative lexicale pour κρίσις, qui peut désigner la justice ou le jugement.
  - marker: b
    text: Ou « aux non-Juifs ».
    reason: ἔθνη peut désigner les nations en général ou, selon la perspective juive du contexte, les non-Juifs.
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Voici
  rationale: « Voici » conserve la fonction d’appel à l’attention et le ton prophétique de la citation, dans un français digne et naturel.
- source_word: παῖς
  choice: serviteur
  rationale: Dans le contexte de la citation d’Ésaïe, le mot désigne le serviteur de Dieu. Ce choix préserve l’arrière-plan du chant du Serviteur sans introduire ici le sens de « fils ».
- source_word: ᾑρέτισα
  choice: j’ai choisi
  rationale: Le passé composé exprime naturellement en français le choix divin accompli évoqué par l’aoriste grec.
- source_word: ὁ ἀγαπητός μου
  choice: mon bien-aimé
  rationale: Cette formulation conserve à la fois l’affection exprimée et la dignité du titre substantivé.
- source_word: εἰς ὃν εὐδόκησεν ἡ ψυχή μου
  choice: en qui mon âme a pris plaisir
  rationale: La formulation garde le sujet explicite « mon âme » et rend l’approbation affective de εὐδοκέω sans l’aplanir en un simple « qui me plaît ».
- source_word: θήσω τὸ πνεῦμά μου ἐπ’ αὐτόν
  choice: Je mettrai mon Esprit sur lui
  rationale: La traduction suit de près l’image grecque de l’Esprit placé sur le serviteur et conserve le langage de la mission prophétique.
- source_word: κρίσιν
  choice: la justice
  rationale: Dans cette citation prophétique, « justice » exprime l’ordre juste de Dieu que le serviteur fait connaître. La possibilité de traduire par « jugement » est signalée en note.
- source_word: τοῖς ἔθνεσιν
  choice: aux nations
  rationale: « Nations » rend la portée collective et universelle du terme dans la citation d’Ésaïe; « non-Juifs » reste une possibilité contextuelle indiquée en note.
- source_word: ἀπαγγελεῖ
  choice: annoncera
  rationale: « Annoncera » rend clairement la déclaration publique exprimée par le verbe, sans ajouter une nuance technique absente du texte.
theological_decisions:
- issue: Identité messianique du παῖς
  choice: Traduire par « serviteur » conformément au contexte isaïen.
  alternative: « enfant » ou « fils »
  rationale: Matthieu présente ici Jésus dans le rôle du Serviteur annoncé par Ésaïe. « Serviteur » maintient cet intertexte sans importer dans ce mot précis une nuance filiale qu’il n’impose pas.
- issue: Sens de κρίσις dans la mission du Serviteur
  choice: Employer « justice » dans le texte principal.
  alternative: « jugement »
  rationale: Le contexte décrit ce que le Serviteur annonce aux nations; « justice » met en avant l’ordre juste de Dieu, tandis que « jugement », sens lexical réel, est conservé en note afin de ne pas éliminer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La disposition en lignes fait ressortir le caractère poétique et prophétique de la citation. « Mon âme a pris plaisir » conserve l’expression sémitisante présente dans le grec tout en restant intelligible; la majuscule à « Esprit » indique qu’il s’agit de l’Esprit de Dieu.
