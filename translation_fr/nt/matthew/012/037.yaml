id: MAT.12.37
reference: Matthew 12:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῶν λόγων σου δικαιωθήσῃ, καὶ ἐκ τῶν λόγων σου καταδικασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/037.yaml
  text: For by your words you will be justified[a], and by your words you will be condemned.
translation:
  language: fr
  text: Car c’est d’après tes paroles que tu seras déclaré juste[a], et c’est d’après tes paroles que tu seras condamné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu seras reconnu juste » ou « tu seras acquitté ». Le verbe grec peut avoir le sens judiciaire d’être déclaré dans son droit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: d’après
  rationale: Avec le génitif, ἐκ indique ici le fondement ou les éléments sur lesquels repose le jugement. « D’après » exprime naturellement en français que les paroles servent de base ou de preuve.
- source_word: γάρ
  choice: Car
  rationale: γάρ introduit l’explication de l’avertissement précédent concernant les paroles. « Car » conserve clairement ce lien logique dans un registre digne.
- source_word: λόγων
  choice: paroles
  rationale: Le pluriel λόγων désigne ici les propos prononcés. « Paroles » est direct, naturel et permet de conserver la répétition parallèle du grec.
- source_word: σου
  choice: tes
  rationale: Le pronom au génitif exprime la possession et qualifie « paroles » dans les deux propositions.
- source_word: δικαιωθήσῃ
  choice: tu seras déclaré juste
  rationale: Le futur passif de δικαιόω a, dans ce contexte de jugement et en contraste avec καταδικασθήσῃ, un sens judiciaire. « Déclaré juste » rend ce caractère forensique sans suggérer que la personne devient moralement juste.
- source_word: καταδικασθήσῃ
  choice: tu seras condamné
  rationale: Le futur passif de καταδικάζω est judiciaire et forme l’antithèse voulue avec δικαιωθήσῃ. « Condamné » en donne l’équivalent français le plus direct.
theological_decisions:
- issue: Sens judiciaire de δικαιόω en rapport avec les paroles et le jugement
  choice: « tu seras déclaré juste », les paroles constituant le fondement probant du verdict
  alternative: « tu seras acquitté » ou « tu seras reconnu juste »
  rationale: Le parallélisme explicite avec « tu seras condamné » impose un cadre judiciaire. La formulation retenue préserve le lien avec le vocabulaire biblique de la justification, sans introduire une construction doctrinale plus large que l’énoncé du verset.
translation_notes:
  register: Français international moderne, clair et digne. La reprise de « c’est d’après tes paroles » dans les deux membres conserve l’insistance et le parallélisme du grec. Le tutoiement singulier correspond à σου et s’inscrit dans l’adresse directe du contexte.
