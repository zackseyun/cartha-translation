  text: ⸂εἶπεν δέ τις αὐτῷ· Ἰδοὺ ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἔξω ἑστήκασιν, ζητοῦντές σοι λαλῆσαι.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/047.yaml
  text: Then someone said to him[a], “Look, your mother and your brothers are standing outside, seeking to speak to you.”
translation:
  language: fr
  text: 'Alors quelqu’un lui dit[a] : « Voici, ta mère et tes frères se tiennent dehors et cherchent à te parler. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent ce verset.
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δέ τις αὐτῷ
  choice: Alors quelqu’un lui dit
  rationale: δέ assure ici une transition narrative légère; « Alors » rend naturellement la progression du récit sans marquer une opposition excessive. τις reste indéfini avec « quelqu’un ».
- source_word: Ἰδοὺ
  choice: Regarde
  rationale: L’impératif attire l’attention sur la présence des personnes mentionnées. « Regarde » est actuel et conserve cette fonction déictique, contrairement à l’archaïque « Voici » employé comme interjection dans certains registres.
- source_word: ἡ μήτηρ σου
  choice: ta mère
  rationale: Traduction directe et naturelle du groupe nominal possessif.
- source_word: οἱ ἀδελφοί σου
  choice: tes frères
  rationale: Dans ce cadre narratif, le pluriel masculin désigne les frères de Jésus; « frères » correspond plus précisément au grec que le terme générique « frères et sœurs ».
- source_word: ἔξω ἑστήκασιν
  choice: sont dehors
  rationale: Le parfait exprime un état présent résultant du fait de s’être placés là. En français, « sont dehors » restitue naturellement cet état; « se tiennent dehors » serait plus formel et moins idiomatique.
- source_word: ζητοῦντές σοι λαλῆσαι
  choice: cherchent à te parler
  rationale: « cherchent à » conserve la valeur de ζητέω et la construction participiale, tandis que « te parler » rend naturellement le datif σοι avec l’infinitif λαλῆσαι.
theological_decisions:
- issue: Statut textuel de Matthieu 12.47
  choice: Inclure le verset dans le texte principal, conformément au texte SBLGNT fourni, avec une note signalant son omission dans certains manuscrits.
  alternative: Omettre entièrement le verset selon les témoins qui ne le contiennent pas.
  rationale: Le passage est délimité comme textuellement incertain dans la source critique. Son inclusion accompagnée d’une note rend les données manuscrites transparentes sans trancher silencieusement la question.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement correspond au singulier grec et convient au dialogue familial. « Regarde » conserve l’appel à l’attention; « sont dehors » évite une tournure artificiellement littérale.
