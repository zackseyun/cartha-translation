review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la structure et les référents du grec. Toutefois, « sont dehors » ne restitue pas explicitement ἑστήκασιν (« se tiennent / sont debout »), dont le parfait décrit leur présence stationnée à l’extérieur. Une formulation française naturelle peut conserver cette nuance.
  naturalness: Le registre est moderne et clair. « Voici » est une interjection française actuelle et naturelle dans ce contexte narratif; elle rend plus directement ἰδού que l’impératif conversationnel « Regarde ». « Se tiennent dehors » est idiomatique dans une narration biblique moderne, sans être archaïsant.
  terminology: « mère », « frères », « dehors » et « te parler » sont appropriés. « Frères » respecte le masculin pluriel οἱ ἀδελφοί sans élargir indûment le sens. La note textuelle est exacte, sobre et correctement ancrée.
  issues:
  - severity: low
    issue: La notion de station debout est absente de « sont dehors ».
    rationale: ἔξω ἑστήκασιν exprime littéralement qu’ils se tiennent à l’extérieur; « sont dehors » indique le lieu mais neutralise l’état exprimé par le parfait de ἵστημι.
  - severity: low
    issue: « Regarde » est moins directement équivalent à l’interjection ἰδού.
    rationale: Dans cette annonce, « Voici » est un équivalent français moderne et idiomatique qui conserve la fonction présentative sans transformer l’expression en ordre adressé à Jésus.
  revised_text: 'Alors quelqu’un lui dit[a] : « Voici, ta mère et tes frères se tiennent dehors et cherchent à te parler. »'
  revised_footnotes:
