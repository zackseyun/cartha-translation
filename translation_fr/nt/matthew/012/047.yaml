  revision_rationale: Révision limitée afin de rendre explicitement ἑστήκασιν par « se tiennent » et de traduire ἰδού par l’interjection présentative naturelle « Voici ». Le reste de la formulation conserve fidèlement l’indéfini τις, les liens familiaux, le lieu, et la nuance non interprétative de ζητοῦντες (« cherchent à »).
