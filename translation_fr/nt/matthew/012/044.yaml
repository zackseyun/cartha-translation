  text: τότε λέγει· ⸂Εἰς τὸν οἶκόν μου ἐπιστρέψω⸃ ὅθεν ἐξῆλθον· καὶ ἐλθὸν ⸀εὑρίσκει ⸀σχολάζοντα σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/044.yaml
  text: Then it says[a], ‘I will return to my house from which I came out,’ and when it comes, it finds it unoccupied, swept[b], and put in order.
translation:
  language: fr
  text: 'Alors il dit : « Je retournerai dans ma maison, d’où je suis sorti. » Quand il arrive, il la trouve inoccupée[a], balayée et mise en ordre[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vide ».
    reason: lexical_alternative
  - marker: b
    text: Ou « décorée » ou « ornée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français la progression temporelle du récit.
- source_word: λέγει
  choice: il dit
  rationale: Le présent de narration est conservé. Le pronom renvoie à l’esprit impur mentionné dans le contexte précédent.
- source_word: Εἰς τὸν οἶκόν μου ἐπιστρέψω
  choice: Je retournerai dans ma maison
  rationale: Préserve le mouvement de retour ainsi que la revendication exprimée par le possessif « ma ».
- source_word: ὅθεν ἐξῆλθον
  choice: d’où je suis sorti
  rationale: Rend directement l’origine du mouvement et l’image concrète de la sortie.
- source_word: ἐλθὸν
  choice: À son arrivée
  rationale: Exprime de manière idiomatique la valeur temporelle du participe aoriste et la succession des actions.
- source_word: εὑρίσκει
  choice: il la trouve
  rationale: Conserve le présent de narration; « la » reprend clairement « maison », objet sous-entendu en grec.
- source_word: σχολάζοντα
  choice: inoccupée
  rationale: Dans l’image de la maison, le terme indique qu’elle est libre ou sans occupant; « inoccupée » préserve mieux cette nuance que le seul état matériel de vacuité.
- source_word: σεσαρωμένον
  choice: balayée
  rationale: Rend simplement le participe parfait passif, qui décrit l’état résultant d’un nettoyage accompli.
- source_word: κεκοσμημένον
  choice: mise en ordre
  rationale: κοσμέω peut désigner le fait d’arranger, de mettre en ordre ou d’orner. Ici, « mise en ordre » convient au contexte sans imposer l’idée plus précise de décoration.
theological_decisions:
- issue: Portée métaphorique de « maison » dans la parole sur le retour de l’esprit impur
  choice: Conserver littéralement « maison » sans expliciter la métaphore.
  alternative: Remplacer l’image par « la personne que j’ai quittée » ou « sa vie ».
  rationale: Le texte emploie l’image de la maison; l’expliciter dans la traduction résoudrait une dimension rhétorique et interprétative que le verset laisse au lecteur.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent de narration grec est maintenu. Les notes sont placées après les termes auxquels elles se rapportent afin d’éviter toute ambiguïté.
