id: MAT.12.41
reference: Matthew 12:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄνδρες Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/041.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the preaching of Jonah, and behold[b], something greater than Jonah is here.
translation:
  language: fr
  text: 'Les hommes de Ninive se lèveront lors du jugement avec cette génération et la condamneront, parce qu’ils se sont repentis en réponse à la proclamation de Jonas[a]. Et voici : il y a ici quelque chose de plus grand que Jonas[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la prédication de Jonas ».
    reason: lexical_alternative
  - marker: b
    text: Ou « quelqu’un de plus grand que Jonas est ici ». Le grec emploie une expression neutre, littéralement « quelque chose de plus grand que Jonas », qui peut mettre l’accent sur la réalité supérieure présente en Jésus, et pas seulement sur une comparaison entre personnes.
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: Les hommes de Ninive
  rationale: ἄνδρες désigne explicitement des hommes, tandis que Νινευῖται les identifie comme habitants de Ninive. Cette formulation est naturelle en français et conserve la précision masculine du grec.
- source_word: ἀναστήσονται
  choice: se lèveront
  rationale: Le futur de ἀνίστημι évoque le fait de se lever dans le cadre du jugement, avec une possible résonance de résurrection, sans que celle-ci soit explicitée davantage.
- source_word: ἐν τῇ κρίσει
  choice: lors du jugement
  rationale: κρίσις désigne ici l’événement judiciaire eschatologique. « Lors du jugement » est idiomatique et conserve ce sens.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: avec cette génération
  rationale: μετά avec le génitif signifie normalement « avec ». L’opposition est exprimée par le verbe suivant, « condamneront ».
- source_word: κατακρινοῦσιν αὐτήν
  choice: la condamneront
  rationale: κατακρίνω signifie « condamner » et le pronom féminin αὐτήν renvoie naturellement en français à « cette génération ».
- source_word: μετενόησαν
  choice: se sont repentis
  rationale: Dans ce contexte prophétique, μετανοέω exprime la repentance, et non un simple changement d’opinion.
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: en réponse à la proclamation de Jonas
  rationale: κήρυγμα désigne une proclamation publique. Avec εἰς après μετανοέω, l’expression indique la réponse suscitée par le message de Jonas.
- source_word: ἰδοὺ
  choice: Et voici
  rationale: ἰδού attire solennellement l’attention sur l’affirmation qui suit. « Et voici » en conserve la force rhétorique dans un registre biblique encore compréhensible.
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: qu’ici se trouve quelque chose de plus grand que Jonas
  rationale: πλεῖον est un comparatif neutre. « Quelque chose de plus grand » préserve cette forme et laisse ouverte la portée exacte de la réalité supérieure présente en Jésus, tandis que la tournure « qu’ici se trouve » rend naturellement ὧδε en français.
theological_decisions:
- issue: La référence de πλεῖον Ἰωνᾶ à Jésus et à son œuvre
  choice: quelque chose de plus grand que Jonas
  alternative: quelqu’un de plus grand que Jonas
  rationale: Le grec emploie le neutre πλεῖον plutôt qu’une désignation masculine explicite. Le texte français conserve cette tension et peut ainsi évoquer la réalité plus grande présente dans la personne et l’œuvre de Jésus sans réduire l’expression à une simple comparaison entre deux individus.
- issue: La précision de genre dans ἄνδρες
  choice: les hommes
  alternative: les habitants
  rationale: Le substantif grec ἄνδρες est explicitement masculin. Le rendre par « hommes » conserve cette donnée sans la généraliser.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement du grec tout en évitant les calques maladroits. « Et voici » maintient la solennité rhétorique, tandis que « qu’ici se trouve » rend l’énoncé naturel malgré l’expression neutre volontairement conservée.
