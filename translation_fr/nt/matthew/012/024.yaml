id: MAT.12.24
reference: Matthew 12:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἀκούσαντες εἶπον· Οὗτος οὐκ ἐκβάλλει τὰ δαιμόνια εἰ μὴ ἐν τῷ Βεελζεβοὺλ ἄρχοντι τῶν δαιμονίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/024.yaml
  text: But when the Pharisees heard it[a], they said, “This man does not cast out demons except by Beelzebul, the ruler of the demons.”
translation:
  language: fr
  text: 'Mais quand les pharisiens entendirent cela, ils dirent : « Cet homme ne chasse les démons que par Béelzébul[a], le chef des démons. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Béelzébul : forme traditionnelle « Béelzébub ».'
    reason: Signaler la forme traditionnelle familière tout en conservant dans le texte la translittération correspondant au grec Βεελζεβούλ.
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste entre la réaction positive de la foule au verset précédent et l’accusation des pharisiens.
- source_word: ἀκούσαντες
  choice: quand les pharisiens entendirent cela
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français; « cela » explicite l’objet sous-entendu par le contexte.
- source_word: Οὗτος
  choice: Cet homme
  rationale: Cette formulation conserve la nuance distante, voire méprisante, du démonstratif dans la bouche des pharisiens.
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: chasse les démons
  rationale: « Chasser les démons » est une expression française claire et consacrée qui correspond directement au contexte d’exorcisme.
- source_word: εἰ μὴ
  choice: ne… que
  rationale: La tournure restrictive française exprime naturellement l’unique moyen allégué par les pharisiens.
- source_word: ἐν τῷ Βεελζεβοὺλ
  choice: par Béelzébul
  rationale: Dans ce contexte, ἐν indique le moyen ou l’agent supposé; « par » rend l’accusation sans ajouter explicitement « par la puissance de ».
- source_word: ἄρχοντι τῶν δαιμονίων
  choice: le chef des démons
  rationale: « Chef » exprime l’autorité désignée par ἄρχων dans un français moderne, courant et naturel.
theological_decisions:
- issue: Nuance hostile du démonstratif Οὗτος
  choice: Cet homme
  alternative: Celui-ci / Il
  rationale: « Cet homme » préserve la distance méprisante de l’accusation sans introduire d’interprétation doctrinale.
- issue: Forme du nom Βεελζεβούλ
  choice: Béelzébul
  alternative: Béelzébub
  rationale: Le texte principal suit la forme grecque de la source, tandis que la forme française traditionnelle est signalée en note.
- issue: Nature de l’accusation exprimée par ἐν
  choice: par Béelzébul
  alternative: par la puissance de Béelzébul
  rationale: La préposition a ici une valeur instrumentale ou d’agence. La formulation retenue maintient une légère ouverture sur la relation exacte alléguée, sans sur-expliciter le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La structure est fluide à l’oral comme à l’écrit; « cet homme » conserve le ton hostile, et « ne… que par » restitue clairement l’accusation restrictive.
