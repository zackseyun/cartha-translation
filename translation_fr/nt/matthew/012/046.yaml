id: MAT.12.46
reference: Matthew 12:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔτι ⸀δὲ αὐτοῦ λαλοῦντος τοῖς ὄχλοις ἰδοὺ ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ εἱστήκεισαν ἔξω ζητοῦντες αὐτῷ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/046.yaml
  text: While he was still speaking to the crowds[a], behold, his mother and his brothers were standing outside, seeking to speak to him.
translation:
  language: fr
  text: Comme il parlait encore aux foules, voici que sa mère et ses frères se tenaient dehors et cherchaient à lui parler.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « frères » peut parfois désigner plus largement de proches parents; ici, il est au masculin pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι δὲ αὐτοῦ λαλοῦντος
  choice: Comme il parlait encore
  rationale: La tournure rend l’action simultanée du génitif absolu, tandis que « encore » exprime sa continuité. Le δέ, transition narrative légère, n’exige pas ici de conjonction explicite en français.
- source_word: τοῖς ὄχλοις
  choice: aux foules
  rationale: Le pluriel grec est conservé dans un français naturel.
- source_word: ἰδοὺ
  choice: voici que
  rationale: Cette formule actuelle et digne conserve la fonction de ἰδού, qui attire l’attention sur un nouveau développement du récit.
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: sa mère et ses frères
  rationale: Le possessif est naturellement appliqué aux deux groupes en français. « Frères » respecte le masculin pluriel grec sans trancher la nature exacte de la parenté.
- source_word: εἱστήκεισαν ἔξω
  choice: se tenaient dehors
  rationale: Le plus-que-parfait grec a ici une valeur résultative et stative; l’imparfait français décrit naturellement leur position continue. « Dehors » n’ajoute aucun lieu non précisé par le verset.
- source_word: ζητοῦντες αὐτῷ λαλῆσαι
  choice: cherchaient à lui parler
  rationale: « Cherchaient à » conserve l’idée d’une démarche intentionnelle portée par ζητέω, et « lui parler » rend naturellement le datif avec l’infinitif.
theological_decisions:
- issue: Sens de ἀδελφοί à propos de la famille de Jésus
  choice: ses frères
  alternative: ses proches parents; ses frères et sœurs
  rationale: La forme grecque est un masculin pluriel et se rend directement par « frères ». La traduction ne décide pas si ces hommes étaient des frères germains, des demi-frères ou d’autres proches parents, préservant ainsi la tension interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici que » maintient la vivacité narrative sans l’archaïsme de « voici ». La phrase suit de près la structure grecque tout en restant fluide.
