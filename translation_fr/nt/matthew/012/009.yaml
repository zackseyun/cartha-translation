  text: Καὶ μεταβὰς ἐκεῖθεν ἦλθεν εἰς τὴν συναγωγὴν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/009.yaml
  text: And departing from there, he went into their synagogue.
translation:
  language: fr
  text: Puis il partit de là et entra dans leur synagogue.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Puis
  rationale: Dans ce récit, le connecteur simple relie naturellement cet épisode au précédent. « Puis » exprime la progression narrative sans surcharger le lien logique.
- source_word: μεταβὰς ἐκεῖθεν
  choice: il partit de là
  rationale: Le participe aoriste et l’adverbe de lieu indiquent ensemble le départ du lieu précédent. Une proposition coordonnée est plus naturelle en français qu’un participe tel que « étant parti ».
- source_word: ἦλθεν εἰς
  choice: entra dans
  rationale: Le verbe de mouvement suivi de εἰς décrit ici l’arrivée à l’intérieur du lieu. « Entra dans » rend clairement cette direction et convient à l’usage français.
- source_word: συναγωγὴν
  choice: synagogue
  rationale: « Synagogue » est le terme français établi pour le lieu juif de rassemblement et de culte dans ce contexte.
- source_word: αὐτῶν
  choice: leur
  rationale: Le possessif pluriel traduit directement le génitif sans préciser davantage son référent.
theological_decisions:
- issue: Référent de « leur synagogue »
  choice: Conserver « leur synagogue » sans identifier explicitement le groupe visé.
  alternative: Préciser « la synagogue des gens de cet endroit » ou donner au possessif une valeur polémique.
  rationale: Le grec emploie simplement αὐτῶν. Le contexte ne justifie pas d’ajouter une identification ou une nuance d’hostilité absente de la formulation.
translation_notes:
  register: Français moderne, fluide et digne. La structure participiale grecque est transformée en deux verbes coordonnés pour éviter une tournure pesante, tout en conservant la succession du départ et de l’entrée.
