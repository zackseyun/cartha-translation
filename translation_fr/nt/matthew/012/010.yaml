source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀ἄνθρωπος χεῖρα ἔχων ξηράν. καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Εἰ ἔξεστι τοῖς σάββασιν ⸀θεραπεύειν; ἵνα κατηγορήσωσιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/010.yaml
  text: And behold[a], there was a man with a withered hand. And they asked him, saying, “Is it lawful to heal on the Sabbaths?” so that they might accuse him.
translation:
  language: fr
  text: 'Et voici qu’il y avait là un homme dont une main était desséchée. Ils lui demandèrent : « Est-il permis de guérir les jours de sabbat[a] ? » afin de l’accuser.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « le jour du sabbat ». Le grec porte le pluriel, littéralement « les sabbats », emploi courant pour parler des jours de sabbat.'
    reason: Précision sur le nombre grammatical et variante idiomatique française.
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: « Voici » conserve la fonction de marqueur discursif qui attire l’attention sur la scène, tout en restant naturel dans un récit français digne et actuel.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Dans ce contexte, le nom masculin singulier désigne un individu de sexe masculin, et non l’humanité en général.
- source_word: χεῖρα ἔχων ξηράν
  choice: dont une main était desséchée
  rationale: Cette formulation française rend naturellement la construction participiale et conserve l’image de ξηράν, qui décrit une main desséchée, atrophiée ou privée de sa fonction, sans préciser abusivement le diagnostic.
- source_word: ἐπηρώτησαν αὐτόν
  choice: ils lui demandèrent
  rationale: Rend directement le verbe et son complément. L’intention hostile n’est pas imposée au verbe lui-même, puisqu’elle est explicitée à la fin du verset.
- source_word: ἔξεστι
  choice: est-il permis
  rationale: Dans cette controverse sur le sabbat, la question porte sur ce que la Loi autorise. « Est-il permis » exprime clairement cette dimension juridico-religieuse en français moderne.
- source_word: τοῖς σάββασιν
  choice: les jours de sabbat
  rationale: Cette expression conserve le pluriel grec tout en évitant le tour peu idiomatique « les sabbats » dans le corps du texte.
- source_word: θεραπεύειν
  choice: guérir
  rationale: « Guérir » est le verbe français naturel dans les récits de guérison et ne précise ni méthode ni diagnostic.
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: ils cherchaient ainsi un motif pour l’accuser
  rationale: Le tour français explicite naturellement la finalité hostile exprimée par ἵνα et conserve la portée accusatoire de κατηγορέω.
theological_decisions:
- issue: Expression du sabbat dans une controverse juridique
  choice: les jours de sabbat
  alternative: le jour du sabbat
  rationale: Le grec emploie le pluriel τοῖς σάββασιν. Le texte principal le conserve sous une forme française naturelle, tandis que la note signale que le singulier collectif est également possible en français.
- issue: Valeur finale de ἵνα
  choice: ils cherchaient ainsi un motif pour l’accuser
  alternative: afin de l’accuser
  rationale: Le contexte indique que la question est posée dans le but de produire une accusation. La formulation retenue exprime cette finalité sans préciser la nature exacte de la charge.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici » maintient la vivacité du récit; « main desséchée » préserve l’image du grec sans imposer un diagnostic médical; « les jours de sabbat » allie transparence formelle et lisibilité.
