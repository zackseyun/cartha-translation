reference: Matthew 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸂ἔφαγον, ὃ⸃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν οὐδὲ τοῖς μετ’ αὐτοῦ, εἰ μὴ τοῖς ἱερεῦσιν μόνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/004.yaml
  text: how he entered into the house of God and ate the bread of the Presence[a], which it was not lawful for him to eat, nor for those with him[b], but only for the priests?
translation:
  language: fr
  text: comment il est entré dans la maison de Dieu et comment ils ont mangé[a] les pains déposés devant Dieu[b], qu’il n’était permis ni à lui ni à ceux qui l’accompagnaient de manger, mais aux prêtres seuls ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « il a mangé » au lieu de « ils ont mangé ».
    reason: textual_variant
  - marker: b
    text: Littéralement « les pains de la présentation »; on les appelle traditionnellement « les pains de proposition ». Il s’agissait de pains consacrés déposés devant Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς
  choice: comment
  rationale: Introduit naturellement en français le contenu du récit invoqué par Jésus.
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: il est entré dans la maison de Dieu
  rationale: Reproduit fidèlement le mouvement exprimé par εἰσέρχομαι avec εἰς et conserve « maison de Dieu » sans préciser à la place du texte le sanctuaire concerné.
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: les pains présentés à Dieu
  rationale: Rend en français courant l’expression cultuelle désignant les pains consacrés placés devant Dieu, tout en évitant l’ancien terme peu transparent « pains de proposition ».
- source_word: ἔφαγον
  choice: ils ont mangé
  rationale: Suit la forme verbale plurielle du texte fourni. Le sujet collectif implicite est David avec ceux qui l’accompagnaient; la variante au singulier est signalée en note.
- source_word: ὃ οὐκ ἐξὸν ἦν αὐτῷ φαγεῖν
  choice: alors que […] il […] n’avait le droit d’en manger
  rationale: « Avoir le droit » conserve la portée légale et cultuelle de ἐξὸν tout en restant naturel en français moderne; « en » reprend les pains sans lourdeur.
- source_word: οὐδὲ τοῖς μετ’ αὐτοῦ
  choice: ni […] ceux qui l’accompagnaient
  rationale: Expression claire et idiomatique pour les personnes qui étaient avec David, sans leur attribuer un statut plus précis que le grec.
- source_word: εἰ μὴ τοῖς ἱερεῦσιν μόνοις
  choice: mais seulement les prêtres
  rationale: Exprime l’exception et l’exclusivité de εἰ μή et μόνοις dans une tournure française concise.
theological_decisions:
- issue: Portée cultuelle et légale de ἐξὸν
  choice: n’avaient le droit d’en manger
  alternative: il ne leur était pas permis d’en manger
  rationale: Le choix maintient l’idée d’une restriction reconnue par la Loi, et non d’une simple convenance sociale, sans ajouter d’explication doctrinale.
- issue: Sujet textuel de ἔφαγον
  choice: ils ont mangé
  alternative: il a mangé
  rationale: Le texte grec fourni porte le pluriel ἔφαγον. La leçon au singulier, qui modifie le sujet immédiat du verbe, est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé composé convient au récit cité dans le discours. La reprise de « comment » clarifie le changement du sujet singulier au sujet pluriel. La formulation conserve « maison de Dieu » et la portée juridique de l’interdiction, tout en explicitant avec sobriété le sens de l’expression cultuelle.
