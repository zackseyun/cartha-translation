id: MAT.12.30
reference: Matthew 12:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/030.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: fr
  text: Celui qui n’est pas avec moi est contre moi, et celui qui ne rassemble pas avec moi disperse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: celui qui n’est pas
  rationale: L’article suivi du participe a une valeur substantive et désigne de manière générale toute personne qui n’est pas avec Jésus. « Celui qui » conserve le singulier générique et reste naturel en français moderne.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: μετά avec le génitif exprime ici l’association ou l’accompagnement. « Avec moi » est direct et préserve la notion d’alignement relationnel sans la surinterpréter.
- source_word: κατ’ ἐμοῦ
  choice: contre moi
  rationale: κατά avec le génitif marque ici l’opposition. « Contre moi » rend clairement et sobrement cette opposition.
- source_word: συνάγων
  choice: rassemble
  rationale: Le participe désigne l’action de réunir ou de rassembler. « Rassemble » maintient l’image ouverte du grec sans préciser indûment s’il s’agit d’un troupeau, d’une récolte ou de personnes.
- source_word: σκορπίζει
  choice: disperse
  rationale: Le verbe signifie disperser ou éparpiller. « Disperse » forme avec « rassemble » une antithèse naturelle et digne en français.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne deux affirmations parallèles. « Et » reproduit ce lien additif sans introduire un contraste absent du grec.
theological_decisions:
- issue: Portée de l’antithèse absolue formulée par Jésus
  choice: Conserver sans atténuation l’opposition entre être avec Jésus et être contre lui, ainsi qu’entre rassembler et disperser.
  alternative: Employer une paraphrase plus souple qui affaiblirait la polarité de l’énoncé.
  rationale: Le grec présente deux propositions parallèles et tranchées, sans nuance restrictive. La traduction préserve cette tension théologique sans en tirer de conclusions doctrinales supplémentaires.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « celui qui » et de « avec moi » conserve le parallélisme rhétorique du grec. Aucun marqueur de note n’est requis, car la formulation française rend naturellement le substantif participial générique sans alternative importante à signaler.
