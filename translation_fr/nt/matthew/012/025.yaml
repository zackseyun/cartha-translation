  text: εἰδὼς ⸀δὲ τὰς ἐνθυμήσεις αὐτῶν εἶπεν αὐτοῖς· Πᾶσα βασιλεία μερισθεῖσα καθ’ ἑαυτῆς ἐρημοῦται, καὶ πᾶσα πόλις ἢ οἰκία μερισθεῖσα καθ’ ἑαυτῆς οὐ σταθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/025.yaml
  text: But knowing their thoughts[a], he said to them, “Every kingdom divided against itself is laid waste[c][b], and every city or house divided against itself will not stand.”
translation:
  language: fr
  text: 'Mais, connaissant leurs pensées[a], il leur dit : « Tout royaume divisé contre lui-même est dévasté[b], et toute ville ou maison[c] divisée contre elle-même ne tiendra pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs raisonnements » ou « leurs intentions ».
    reason: lexical_alternative
  - marker: b
    text: Ou « devient désert » ou « est réduit à la ruine ».
    reason: lexical_alternative
  - marker: c
    text: Ici, « maison » peut aussi désigner une maisonnée, c’est-à-dire les personnes qui la composent.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: connaissant
  rationale: Le participe aoriste de ὁράω exprime ici la connaissance ou la perception mentale. « Connaissant » maintient le lien participial avec le verbe principal sans préciser comment Jésus a eu cette connaissance.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque une transition avec une légère valeur de contraste dans l’enchaînement argumentatif.
- source_word: ἐνθυμήσεις
  choice: pensées
  rationale: Le nom peut désigner les pensées, les raisonnements ou les intentions intérieures. « Pensées » est clair, naturel et suffisamment large en français moderne.
- source_word: Πᾶσα βασιλεία
  choice: Tout royaume
  rationale: πᾶσα avec un substantif singulier formule ici une vérité générale. « Tout royaume » rend naturellement cette portée universelle.
- source_word: μερισθεῖσα καθ’ ἑαυτῆς
  choice: divisé contre lui-même / divisée contre elle-même
  rationale: La formule décrit une division interne devenue opposition. L’accord français varie selon le genre de « royaume », « ville » et « maison ».
- source_word: ἐρημοῦται
  choice: est dévasté
  rationale: Le verbe évoque la désolation et la ruine. « Est dévasté » conserve la force de l’image et la forme passive, tout en restant idiomatique.
- source_word: πόλις ἢ οἰκία
  choice: ville ou maison
  rationale: πόλις signifie « ville »; οἰκία peut désigner une maison ou les personnes qui la composent. « Maison » conserve l’image grecque, avec une note signalant le sens possible de « maisonnée ».
- source_word: οὐ σταθήσεται
  choice: ne tiendra pas
  rationale: Dans cet emploi, le futur passif de ἵστημι signifie demeurer établi ou subsister. « Ne tiendra pas » est concis et naturel.
theological_decisions:
- issue: Nature de la connaissance que Jésus a de leurs pensées
  choice: Dire simplement que Jésus connaît leurs pensées, sans préciser le mode de cette connaissance.
  alternative: Présenter explicitement cette connaissance comme surnaturelle, prophétique ou issue d’un discernement humain.
  rationale: Le verset affirme cette connaissance sans en expliquer le mécanisme; la traduction préserve donc cette indétermination.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation proverbiale demeure concise; les répétitions et le parallélisme du grec sont conservés autant que le permet l’accord grammatical français.
