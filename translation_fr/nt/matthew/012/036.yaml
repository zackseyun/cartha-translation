id: MAT.12.36
reference: Matthew 12:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πᾶν ῥῆμα ἀργὸν ὃ ⸀λαλήσουσιν οἱ ἄνθρωποι, ἀποδώσουσιν περὶ αὐτοῦ λόγον ἐν ἡμέρᾳ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/036.yaml
  text: But I tell you that for every careless word that people speak[b][a], they will give an account on the day of judgment.
translation:
  language: fr
  text: 'Mais je vous le dis : au jour du jugement, les êtres humains rendront compte de toute parole vaine[a] qu’ils auront prononcée.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parole inutile », « improductive » ou « inconsidérée ». Le terme grec désigne littéralement ce qui est inactif ou sans fruit et peut, dans ce contexte, qualifier une parole dite sans le sérieux nécessaire.
    reason: alternative lexicale préservant l’étendue sémantique de ἀργός
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mais je vous le dis
  rationale: Le présent λέγω et l’adresse ὑμῖν sont rendus directement. δέ marque ici une transition légèrement adversative avec l’avertissement précédent ; « Mais » convient au contexte.
- source_word: πᾶν ῥῆμα
  choice: toute parole
  rationale: Avec un nom singulier, πᾶν a une valeur distributive. Dans ce contexte, ῥῆμα désigne une parole prononcée.
- source_word: ἀργὸν
  choice: vaine
  rationale: ἀργός peut désigner ce qui est inactif, improductif, inutile ou inconsidéré. « Vaine » reste naturelle et digne en français, tout en conservant l’étendue du terme grec sans limiter le sens à une simple maladresse.
- source_word: ὃ λαλήσουσιν οἱ ἄνθρωποι
  choice: que les êtres humains auront prononcée
  rationale: οἱ ἄνθρωποι désigne les humains en général, sans référence particulière aux hommes de sexe masculin. Le futur grec est naturellement rendu par le futur antérieur français, puisque la parole aura été prononcée avant qu’il en soit rendu compte au jour du jugement.
- source_word: ἀποδώσουσιν περὶ αὐτοῦ λόγον
  choice: rendront compte de
  rationale: ἀποδίδωμι avec λόγον forme l’expression « rendre compte ». Le complément introduit par περὶ est intégré naturellement en français par « rendre compte de ».
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: au jour du jugement
  rationale: La préposition ἐν a ici une valeur temporelle. κρίσις désigne le jugement au sens judiciaire ; « au jour du jugement » est précis et idiomatique.
theological_decisions:
- issue: Portée morale de ἀργόν
  choice: « vaine », avec une note signalant les nuances « inutile », « improductive » et « inconsidérée »
  alternative: « inconsidérée » ou « inutile » dans le texte principal
  rationale: Le contexte du jugement donne à cette parole une portée morale réelle, mais le grec ne précise pas à lui seul s’il faut insister sur l’insouciance, l’inutilité ou l’absence de fruit. « Vaine » préserve cette tension sans réduire le propos aux seules paroles ouvertement malveillantes.
- issue: Valeur générique de οἱ ἄνθρωποι
  choice: « les êtres humains »
  alternative: « les hommes » ou « les gens »
  rationale: Le groupe grec désigne ici l’humanité en général. « Les êtres humains » rend cette portée inclusive avec clarté et dignité.
- issue: Relation entre chaque parole et le compte rendu final
  choice: « rendront compte de toute parole »
  alternative: « rendront un compte à son sujet »
  rationale: La formulation française conserve la portée distributive de πᾶν et le lien explicite de περὶ αὐτοῦ avec chaque parole, sans ajouter de précision sur la forme exacte du jugement.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des éléments a été légèrement réorganisé pour éviter une reprise pronominale maladroite et rendre immédiatement lisible le lien entre le jour du jugement, les êtres humains et chaque parole prononcée.
