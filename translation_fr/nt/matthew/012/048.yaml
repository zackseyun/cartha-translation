  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ ⸀λέγοντι αὐτῷ· Τίς ἐστιν ἡ μήτηρ μου, καὶ τίνες εἰσὶν οἱ ἀδελφοί μου;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/048.yaml
  text: But he answered the one speaking to him[a], “Who is my mother, and who are my brothers?”
translation:
  language: fr
  text: 'Mais il répondit à celui qui lui parlait[a] : « Qui est ma mère, et qui sont mes frères ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Mais, ayant répondu, il dit à celui qui lui parlait. »'
    reason: La note signale la construction participiale grecque ἀποκριθεὶς εἶπεν, rendue plus naturellement dans le texte principal par « il répondit ».
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Mais il répondit
  rationale: La tournure grecque, influencée par l’usage sémitique, signifie littéralement « ayant répondu, il dit ». En français naturel, « il répondit » en exprime pleinement le sens, tandis que « Mais » rend le changement de direction marqué par δέ.
- source_word: τῷ λέγοντι αὐτῷ
  choice: à celui qui lui parlait
  rationale: Le participe présent substantivé désigne l’homme qui s’adresse alors à Jésus. L’imparfait français rend naturellement l’action en cours dans le cadre narratif.
- source_word: Τίς ἐστιν ἡ μήτηρ μου
  choice: Qui est ma mère
  rationale: Cette traduction directe conserve la question rhétorique et le terme précis de parenté sans en expliciter prématurément la portée.
- source_word: καὶ τίνες εἰσὶν οἱ ἀδελφοί μου
  choice: et qui sont mes frères
  rationale: Le pluriel français « qui sont » rend naturellement τίνες εἰσὶν, et « mes frères » respecte le masculin pluriel ἀδελφοί dans cette scène familiale.
theological_decisions:
- issue: Portée de la question rhétorique de Jésus sur l’identité de sa famille
  choice: Conserver les questions littérales sans ajout explicatif
  alternative: « Qui peut être considéré comme ma mère, et qui comme mes frères ? »
  rationale: Le contexte suivant développera la redéfinition de la parenté. Ce verset doit préserver à lui seul la force et la tension des questions de Jésus, sans anticiper leur explication.
- issue: Rendu de ἀδελφοί
  choice: « frères »
  alternative: « frères et sœurs » ou « membres de ma famille »
  rationale: Dans le contexte immédiat, le récit parle des frères de Jésus en tant que membres masculins de sa famille. Élargir le terme introduirait une précision absente de cette formulation.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste naturelle tout en conservant la structure interrogative, le contraste discursif et les termes familiaux du grec.
