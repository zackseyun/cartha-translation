id: MAT.12.49
reference: Matthew 12:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα αὐτοῦ ἐπὶ τοὺς μαθητὰς αὐτοῦ εἶπεν· Ἰδοὺ ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/049.yaml
  text: And stretching out his hand toward his disciples[a], he said, “Behold[b], my mother and my brothers.”
translation:
  language: fr
  text: 'Puis, tendant la main vers ses disciples, il dit : « Voici ma mère et mes frères[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec porte « frères », au masculin pluriel; il n’est pas développé ici en « frères et sœurs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκτείνας
  choice: tendant
  rationale: Le participe aoriste exprime un geste qui accompagne et précède immédiatement la parole. « Tendant » restitue naturellement cette action sans alourdir la phrase.
- source_word: χεῖρα
  choice: la main
  rationale: Le sens concret ordinaire est « main »; il s’agit du geste visible de Jésus en direction des disciples.
- source_word: ἐπὶ
  choice: vers
  rationale: Avec l’accusatif, dans ce contexte gestuel, la préposition marque la direction.
- source_word: μαθητὰς
  choice: disciples
  rationale: « Disciples » est le terme français précis et usuel pour désigner ceux qui suivent Jésus comme maître.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: « Voici » attire l’attention sur les personnes désignées tout en gardant une expression naturelle, concise et digne en français moderne.
- source_word: μήτηρ
  choice: mère
  rationale: Traduction directe du terme familial, sans raison contextuelle de le paraphraser.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le grec emploie ici un pluriel masculin dans une formule qui reprend explicitement le vocabulaire de la famille; « frères » en conserve la forme et la force rhétorique.
theological_decisions:
- issue: Le langage familial par lequel Jésus redéfinit les liens de parenté
  choice: Conserver les termes concrets « mère » et « frères »
  alternative: Employer une formulation inclusive ou générale telle que « famille », « frères et sœurs » ou « proches »
  rationale: Jésus désigne ses disciples au moyen de termes familiaux précis. Une généralisation atténuerait le contraste rhétorique et expliciterait davantage que ne le fait le grec.
translation_notes:
  register: Français international moderne, naturel et digne. « Puis » rend la progression narrative de καί sans produire l’enchaînement plus raide « Et, tendant… ». « Voici » garde la fonction démonstrative et emphatique de ἰδού.
