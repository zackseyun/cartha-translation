  text: καὶ ἐπετίμησεν αὐτοῖς ἵνα μὴ φανερὸν αὐτὸν ποιήσωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/016.yaml
  text: And he warned them not to make him known,[a]
translation:
  language: fr
  text: Et il leur recommanda sévèrement de ne pas le faire connaître.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur ordonna de ne pas le faire connaître » ou « les avertit sévèrement de ne pas le faire connaître ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple, conservée sans ajouter de nuance temporelle ou causale.
- source_word: ἐπετίμησεν
  choice: ordonna sévèrement
  rationale: Dans ce contexte, le verbe exprime une directive ferme. Cette formulation française rend mieux sa force que « avertit », qui pourrait suggérer l’annonce d’un danger, tout en évitant « réprimanda », qui impliquerait plus nettement une faute préalable.
- source_word: αὐτοῖς
  choice: leur
  rationale: Pronom datif pluriel renvoyant aux personnes mentionnées dans le contexte immédiat.
- source_word: ἵνα μὴ
  choice: de ne pas
  rationale: Après un verbe exprimant une directive, cette construction infinitive rend naturellement en français le contenu négatif de l’ordre.
- source_word: φανερὸν αὐτὸν ποιήσωσιν
  choice: le faire connaître
  rationale: Rend l’expression idiomatique signifiant divulguer ou rendre public, tout en conservant Jésus comme objet personnel.
theological_decisions:
- issue: Nature de la directive de Jésus concernant sa divulgation publique
  choice: Une interdiction ferme de le faire connaître
  alternative: Une réprimande adressée aux personnes présentes, ou un simple avertissement
  rationale: Le grec marque une directive énergique, mais le verset n’en précise pas la raison théologique. La traduction conserve cette force sans expliquer pourquoi Jésus interdit cette publicité.
translation_notes:
  register: Français moderne, digne et accessible. « Ordonna sévèrement » exprime la fermeté du grec sans donner à entendre nécessairement que les destinataires avaient déjà commis une faute.
