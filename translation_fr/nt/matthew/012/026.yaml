id: MAT.12.26
reference: Matthew 12:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ Σατανᾶς τὸν Σατανᾶν ἐκβάλλει, ἐφ’ ἑαυτὸν ἐμερίσθη· πῶς οὖν σταθήσεται ἡ βασιλεία αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/026.yaml
  text: And if Satan casts out Satan[a], he is divided against himself[c][b]. How then will his kingdom stand?
translation:
  language: fr
  text: Et si Satan chasse Satan[a], il est divisé contre lui-même[b]. Comment donc son royaume tiendra-t-il[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « expulse Satan ».
    reason: lexical_alternative
  - marker: b
    text: Ou « il s’est trouvé divisé contre lui-même ».
    reason: lexical_alternative
  - marker: c
    text: Ou « pourra-t-il subsister ? ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἰ
  choice: Et si
  rationale: Conserve à la fois le lien argumentatif exprimé par καί et la condition introduite par εἰ.
- source_word: ὁ Σατανᾶς / τὸν Σατανᾶν
  choice: Satan
  rationale: Reprend en français la forme traditionnelle du nom ou titre personnel Σατανᾶς, sans la remplacer par une interprétation comme « l’Adversaire ».
- source_word: ἐκβάλλει
  choice: chasse
  rationale: Dans ce contexte d’expulsion des démons, « chasse » exprime naturellement l’action de faire sortir par force; « expulse » reste une possibilité plus formelle.
- source_word: ἐφ’ ἑαυτόν
  choice: contre lui-même
  rationale: Rend directement l’idée d’opposition interne portée par ἐπί avec le pronom réfléchi.
- source_word: ἐμερίσθη
  choice: il est divisé
  rationale: Le parfait d’état français rend clairement le résultat logique de l’aoriste passif dans cette hypothèse, sans préciser indûment l’agent de la division.
- source_word: πῶς οὖν
  choice: Comment donc
  rationale: Préserve l’interrogation de πῶς et la conclusion logique signalée par οὖν.
- source_word: σταθήσεται
  choice: tiendra-t-il
  rationale: Conserve au futur l’image de ce qui tient debout ou demeure établi, tout en étant idiomatique en français.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: son royaume
  rationale: « Royaume » convient à l’image d’un domaine divisé et laisse intacte la portée possible de βασιλεία comme royaume ou pouvoir royal.
theological_decisions:
- issue: Portée de la division de Satan contre lui-même
  choice: 'Présenter l’énoncé comme un raisonnement par l’absurde : si Satan chasse Satan, il se trouve divisé contre lui-même et son royaume ne peut tenir.'
  alternative: Développer explicitement l’image d’une maison divisée à partir du contexte précédent.
  rationale: Le grec formule ici la division interne et la conséquence pour le royaume de Satan sans répéter l’image de la maison; la traduction n’ajoute donc pas cette explication contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la structure serrée du raisonnement grec, le futur de la question finale et la métaphore du royaume qui « tient ».
