id: MAT.12.34
reference: Matthew 12:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γεννήματα ἐχιδνῶν, πῶς δύνασθε ἀγαθὰ λαλεῖν πονηροὶ ὄντες; ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας τὸ στόμα λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/034.yaml
  text: Offspring of vipers[b][a], how can you speak good things when you are evil? For out of the overflow of the heart the mouth speaks.
translation:
  language: fr
  text: Engeance de vipères[a], comment pouvez-vous dire de bonnes choses alors que vous êtes mauvais ? Car la bouche parle du trop-plein du cœur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Progéniture de vipères ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Car la bouche parle de l’abondance du cœur. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεννήματα ἐχιδνῶν
  choice: Engeance de vipères
  rationale: « Engeance » désigne collectivement ce qui est engendré et conserve la métaphore mordante d’une filiation caractérisée par les vipères. L’expression est idiomatique, actuelle et forte en français.
- source_word: πῶς δύνασθε
  choice: comment pouvez-vous
  rationale: Cette formulation française naturelle conserve la question rhétorique portant sur la capacité morale des interlocuteurs.
- source_word: ἀγαθὰ λαλεῖν
  choice: dire de bonnes choses
  rationale: Le neutre pluriel substantivé ἀγαθά désigne des choses bonnes, et λαλεῖν signifie ici parler ou dire. La traduction reste proche du grec sans être artificielle.
- source_word: πονηροὶ ὄντες
  choice: alors que vous êtes mauvais
  rationale: « Alors que » rend la circonstance exprimée par le participe sans imposer exclusivement une valeur causale. « Mauvais » conserve ici le jugement moral porté par πονηροί.
- source_word: ἐκ γὰρ τοῦ περισσεύματος τῆς καρδίας
  choice: Car la bouche parle du trop-plein du cœur
  rationale: « Trop-plein » évoque ce qui, par abondance, déborde de l’intérieur. La syntaxe française demeure concise tout en conservant l’image de la source intérieure de la parole.
- source_word: τῆς καρδίας
  choice: du cœur
  rationale: « Cœur » maintient le terme biblique désignant le centre intérieur de la personne, sans le réduire aux seules émotions.
- source_word: τὸ στόμα λαλεῖ
  choice: la bouche parle
  rationale: Cette traduction directe et idiomatique conserve la personnification du bouche comme organe de la parole.
theological_decisions:
- issue: Portée métaphorique de καρδία
  choice: Conserver « cœur » comme désignation du centre intérieur de la personne.
  alternative: for intérieur ; pensée
  rationale: Le grec ne limite pas le cœur aux émotions ni à l’intellect. Le terme biblique préserve toute l’étendue anthropologique de l’image.
- issue: Caractérisation morale exprimée par πονηροὶ ὄντες
  choice: Traduire par « alors que vous êtes mauvais ».
  alternative: puisque vous êtes mauvais ; vous qui êtes méchants
  rationale: « Mauvais » exprime un jugement moral réel, tandis que « alors que » laisse ouverte la nuance circonstancielle ou causale du participe grec au lieu de la trancher.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. « Engeance de vipères » garde la vigueur de l’apostrophe, tandis que « trop-plein du cœur » restitue concrètement l’image de l’abondance intérieure qui se manifeste dans la parole.
