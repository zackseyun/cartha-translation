  naturalness: Le texte est globalement naturel et de registre moderne. « Nous voulons voir un signe de ta part » est à la fois idiomatique en français international et plus proche de la construction grecque.
  terminology: « Spécialistes de la Loi », « pharisiens », « Maître » et « signe » conviennent. « Maître » rend naturellement Διδάσκαλε dans cette adresse sans imposer une interprétation doctrinale.
