id: MAT.12.38
reference: Matthew 12:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε ἀπεκρίθησαν ⸀αὐτῷ τινες τῶν γραμματέων καὶ Φαρισαίων λέγοντες· Διδάσκαλε, θέλομεν ἀπὸ σοῦ σημεῖον ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/038.yaml
  text: Then some of the scribes and Pharisees answered him[a], saying, “Teacher, we want to see a sign from you.”
translation:
  language: fr
  text: 'Alors quelques-uns des spécialistes de la Loi et des pharisiens lui répondirent : « Maître, nous voulons voir un signe de ta part[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un signe miraculeux ». Le mot grec peut désigner un signe ayant une portée miraculeuse, mais le texte conserve le terme plus général « signe ».
    reason: Alternative lexicale
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Introduit naturellement en français la suite du récit et correspond à la valeur temporelle de l’adverbe.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: lui répondirent
  rationale: Préserve l’idiome narratif grec tout en employant une tournure française naturelle.
- source_word: τινες τῶν γραμματέων
  choice: quelques-uns des spécialistes de la Loi
  rationale: τινες désigne une partie du groupe. Dans ce contexte, γραμματεῖς désigne des spécialistes des Écritures et de la Loi; cette formulation moderne évite que « scribes » soit compris comme de simples copistes.
- source_word: καὶ Φαρισαίων
  choice: et des pharisiens
  rationale: Désignation habituelle et transparente de ce groupe religieux juif.
- source_word: λέγοντες
  choice: — ponctuation introduisant le discours direct
  rationale: Le participe est rendu implicitement par l’introduction française du discours direct, ce qui évite le lourd « en disant ».
- source_word: Διδάσκαλε
  choice: Maître
  rationale: En français biblique courant, « Maître » est une adresse naturelle à un enseignant; le contexte pédagogique demeure clair sans donner ici au terme un sens doctrinal supplémentaire.
- source_word: θέλομεν
  choice: nous voulons
  rationale: Rend directement la volonté exprimée, dans un français actuel.
- source_word: ἀπὸ σοῦ σημεῖον ἰδεῖν
  choice: te voir accomplir un signe
  rationale: Cette formulation française naturelle exprime le désir de voir un signe provenant de Jésus. Elle explicite l’agent impliqué par ἀπὸ σοῦ sans ajouter la qualification « miraculeux » au texte principal.
theological_decisions:
- issue: Nature de σημεῖον
  choice: signe
  alternative: signe miraculeux
  rationale: Le contexte implique un acte extraordinaire servant de preuve, mais le grec dit simplement σημεῖον. Le texte principal conserve donc le terme plus large et la note signale la nuance possible.
translation_notes:
  register: Français international moderne, digne et accessible. « Spécialistes de la Loi » privilégie la compréhension fonctionnelle; « pharisiens » reste le nom traditionnel du groupe. La syntaxe du discours direct est allégée conformément à l’usage français.
