id: MAT.12.42
reference: Matthew 12:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτήν· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/042.yaml
  text: The queen of the South will rise up in the judgment with this generation and will condemn it[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: fr
  text: 'La reine du Sud[a] se lèvera lors du jugement avec cette génération et la condamnera, car elle est venue des extrémités de la terre pour écouter la sagesse de Salomon ; et voici : quelque chose de plus grand que Salomon est ici[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « reine du Sud » renvoie à la reine de Saba (1 Rois 10.1-13 ; 2 Chroniques 9.1-12), bien que le texte grec ne nomme pas explicitement Saba.
    reason: cross_reference
  - marker: b
    text: 'Ou : « quelqu’un de plus grand que Salomon ». Le grec emploie une forme neutre (« quelque chose de plus grand »), qui peut mettre en relief la réalité supérieure présente en Jésus et dans son œuvre.'
    reason: alternative_reading
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: la reine du Sud
  rationale: Cette formulation traduit directement le génitif géographique sans introduire dans le texte principal l’identification implicite à la reine de Saba.
- source_word: ἐγερθήσεται
  choice: se lèvera
  rationale: Le futur « se lèvera » reste naturel en français et conserve à la fois la scène judiciaire et la possible résonance de résurrection.
- source_word: ἐν τῇ κρίσει
  choice: lors du jugement
  rationale: Cette expression française désigne clairement le jugement défini évoqué par le grec, sans alourdir la phrase.
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: avec cette génération
  rationale: « Avec » respecte le sens ordinaire de μετά avec le génitif; l’opposition est exprimée ensuite par « la condamnera ».
- source_word: κατακρινεῖ αὐτήν
  choice: la condamnera
  rationale: Le pronom féminin reprend naturellement « cette génération » en français, tandis que « condamnera » rend directement κατακρίνω.
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: des extrémités de la terre
  rationale: Cette tournure idiomatique conserve l’image d’une provenance extrêmement lointaine.
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: pour écouter la sagesse de Salomon
  rationale: « Pour écouter » exprime le but de sa venue et convient mieux que le simple « entendre » à une démarche volontaire d’attention à la sagesse.
- source_word: ἰδοὺ
  choice: or voici
  rationale: « Voici » garde la fonction emphatique du marqueur grec; « or » assure une transition soutenue et naturelle.
- source_word: πλεῖον Σολομῶνος
  choice: quelque chose de plus grand que Salomon
  rationale: Le syntagme conserve la forme neutre du comparatif grec et évite de la résoudre d’emblée en référent personnel masculin.
- source_word: ὧδε
  choice: il y a ici
  rationale: Cette construction rend explicitement et naturellement en français la présence signalée par l’adverbe « ici ».
theological_decisions:
- issue: Valeur du comparatif neutre πλεῖον par rapport à Jésus
  choice: quelque chose de plus grand que Salomon
  alternative: quelqu’un de plus grand que Salomon
  rationale: Le neutre grec peut mettre en relief une réalité supérieure présente en Jésus et dans son œuvre, sans exclure que Jésus lui-même soit visé. La traduction principale maintient cette tension grammaticale et théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du grec tout en étant fluide; les formulations interprétatives non explicites, notamment « reine de Saba » et « quelqu’un », sont réservées aux notes.
