    reason: alternative_reading
  revision_rationale: La révision remplace « froissé » par « meurtri », qui correspond mieux à l’état décrit par συντετριμμένον et à l’image prophétique. Elle remplace « ait mené la justice à la victoire » par une tournure française plus idiomatique, tout en conservant le mouvement vers l’issue victorieuse. La note demeure correctement ancrée après la proposition qu’elle éclaire et préserve « jugement » comme alternative à « justice ».
