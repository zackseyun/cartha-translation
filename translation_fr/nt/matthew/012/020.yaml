review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle au grec : les deux images de fragilité sont conservées, et « justice » rend de façon défendable τὴν κρίσιν dans le cadre de la citation d’Ésaïe. Toutefois, « froissé » ne rend pas bien συντετριμμένον pour un roseau : le mot évoque surtout un objet chiffonné ou plissé, plutôt qu’endommagé par écrasement. « Meurtri » rend mieux l’image et son contraste avec « briser ».'
  naturalness: « Il ne brisera pas » et « la mèche qui fume » sont naturels. En revanche, « mener la justice à la victoire » est moins idiomatique en français et suggère que la justice est conduite comme un groupe. « Faire triompher la justice » exprime naturellement l’aboutissement victorieux de ἐκβάλῃ εἰς νῖκος.
  terminology: « Roseau », « mèche », « éteindre » et « justice » conviennent au registre biblique moderne international. La note conserve utilement « jugement » comme autre sens possible de κρίσις, sans trancher indûment le débat lexical.
  issues:
  - severity: medium
    issue: « roseau froissé »
    rationale: « Froissé » est peu approprié à un roseau et affaiblit le sens de συντετριμμένον (« écrasé, brisé, meurtri »). « Roseau meurtri » est à la fois plus exact et plus idiomatique dans cette image.
  - severity: low
    issue: « mené la justice à la victoire »
    rationale: La formulation est compréhensible mais peu naturelle. « Fasse triompher la justice » rend clairement l’orientation vers la victoire de εἰς νῖκος.
  revised_text: Il ne brisera pas le roseau meurtri et n’éteindra pas la mèche qui fume, jusqu’à ce qu’il fasse triompher la justice.[a]
