id: MAT.12.20
reference: Matthew 12:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κάλαμον συντετριμμένον οὐ κατεάξει καὶ λίνον τυφόμενον οὐ σβέσει, ἕως ἂν ἐκβάλῃ εἰς νῖκος τὴν κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/020.yaml
  text: He will not break a bruised reed[a], and he will not extinguish a smoldering wick[b], until he brings justice to victory.
translation:
  language: fr
  text: Il ne brisera pas le roseau meurtri et n’éteindra pas la mèche qui fume, jusqu’à ce qu’il fasse triompher la justice.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « jusqu’à ce qu’il fasse triompher le jugement ».'
    reason: alternative_reading
lexical_decisions:
- source_word: κάλαμον συντετριμμένον
  choice: le roseau froissé
  rationale: « Roseau » rend naturellement κάλαμος dans cette image prophétique. « Froissé » exprime un roseau endommagé, mais pas encore entièrement brisé, ce qui prépare sans redondance l’action qu’il ne fera pas.
- source_word: οὐ κατεάξει
  choice: il ne brisera pas
  rationale: Rend directement l’idée de casser ou rompre le roseau, dans un français naturel et digne.
- source_word: λίνον τυφόμενον
  choice: la mèche qui fume
  rationale: λίνον désigne littéralement le lin, ici employé comme mèche de lampe. « La mèche qui fume » rend clairement l’objet et l’état d’une flamme près de s’éteindre.
- source_word: οὐ σβέσει
  choice: n’éteindra pas
  rationale: Équivalent français direct et idiomatique de σβέννυμι dans l’image d’une mèche de lampe.
- source_word: ἕως ἂν ἐκβάλῃ
  choice: jusqu’à ce qu’il ait mené
  rationale: La tournure exprime le terme futur auquel aboutit l’action. « Mener » communique ici l’idée de conduire la justice à son plein résultat, sans reproduire maladroitement le sens concret habituel d’ἐκβάλλω.
- source_word: εἰς νῖκος
  choice: à la victoire
  rationale: Conserve la visée et l’issue victorieuse exprimées par la préposition εἰς et le nom νῖκος.
- source_word: τὴν κρίσιν
  choice: la justice
  rationale: Dans le contexte du Serviteur d’Ésaïe, κρίσις évoque l’établissement de l’ordre juste, plutôt qu’un verdict seulement. « Justice » garde cette portée, tandis que « jugement » reste une possibilité lexicale signalée en note.
theological_decisions:
- issue: Sens de κρίσις dans la citation du Serviteur d’Ésaïe
  choice: la justice
  alternative: le jugement
  rationale: « Justice » reflète la mission du Serviteur qui fait triompher l’ordre juste de Dieu. « Jugement » est possible, mais peut suggérer trop étroitement une sentence judiciaire.
- issue: Degré de littéralité dans l’image de la lampe
  choice: la mèche qui fume ... n’éteindra pas
  alternative: le lin fumant ... n’étouffera pas
  rationale: Le grec nomme le lin, mais celui-ci fonctionne ici comme mèche. Le rendu choisi permet au lecteur moderne de saisir immédiatement l’image sans lui ajouter une interprétation doctrinale.
- issue: Portée de ἕως ἂν après les deux négations
  choice: jusqu’à ce qu’il ait mené la justice à la victoire
  alternative: jusqu’à ce qu’il fasse triompher la justice
  rationale: La traduction maintient la structure temporelle du grec et son orientation vers l’aboutissement victorieux, sans laisser entendre que la douceur du Serviteur cesserait ensuite.
translation_notes:
  register: Français international moderne, naturel et digne. Les deux images parallèles restent concrètes; « mèche » explicite la fonction du lin sans alourdir le verset. L’inversion poétique ou le vocabulaire archaïque ont été évités.
