id: MAT.12.2
reference: Matthew 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι ἰδόντες εἶπαν αὐτῷ· Ἰδοὺ οἱ μαθηταί σου ποιοῦσιν ὃ οὐκ ἔξεστιν ποιεῖν ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/002.yaml
  text: But when the Pharisees saw it[a], they said to him, “Look, your disciples are doing what is not lawful to do on the Sabbath.”
translation:
  language: fr
  text: 'Mais les pharisiens, voyant cela, lui dirent : « Regarde ! Tes disciples font ce qu’il n’est pas permis de faire le jour du sabbat. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque le contraste avec l’action précédente, dans un français narratif naturel.
- source_word: ἰδόντες
  choice: voyant cela
  rationale: Le participe aoriste est rendu par un participe présent de valeur circonstancielle; « cela » explicite sobrement l’action des disciples indiquée par le contexte.
- source_word: εἶπαν αὐτῷ
  choice: lui dirent
  rationale: Formule de parole directe, neutre et idiomatique en français.
- source_word: Ἰδοὺ
  choice: Regarde !
  rationale: Conserve la force déictique de l’interjection et attire directement l’attention de Jésus sur l’accusation.
- source_word: μαθηταί
  choice: disciples
  rationale: Terme établi qui préserve la relation entre maître et élèves dans le contexte évangélique.
- source_word: ποιοῦσιν ... ποιεῖν
  choice: font ... de faire
  rationale: Préserve autant que possible la répétition de ποιέω sans alourdir la phrase française.
- source_word: ὃ οὐκ ἔξεστιν
  choice: ce qu’il n’est pas permis
  rationale: Exprime directement l’idée d’autorisation ou de permission, sans déterminer si l’interdit allégué vient de la Loi biblique ou d’une interprétation traditionnelle.
- source_word: ἐν σαββάτῳ
  choice: le jour du sabbat
  rationale: Formulation française claire et courante pour situer l’action pendant le sabbat.
theological_decisions:
- issue: Nature de l’objection des pharisiens
  choice: « ce qu’il n’est pas permis »
  alternative: « ce qui n’est pas légal » ou « ce que la Loi interdit »
  rationale: La formulation retenue garde la portée juridico-religieuse de ἔξεστιν sans identifier la source précise de l’interdiction ni valider l’accusation des pharisiens.
translation_notes:
  register: Français moderne, international et digne. « Pharisiens » prend une minuscule selon l’usage courant pour les noms de groupes religieux; le discours direct reste vif sans archaïsme.
