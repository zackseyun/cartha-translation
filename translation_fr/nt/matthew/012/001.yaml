id: MAT.12.1
reference: Matthew 12:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν ἐκείνῳ τῷ καιρῷ ἐπορεύθη ὁ Ἰησοῦς τοῖς σάββασιν διὰ τῶν σπορίμων· οἱ δὲ μαθηταὶ αὐτοῦ ἐπείνασαν καὶ ἤρξαντο τίλλειν στάχυας καὶ ἐσθίειν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/001.yaml
  text: At that time Jesus went through the grainfields on the Sabbath[a], and his disciples became hungry and began to pluck heads of grain and eat.
translation:
  language: fr
  text: À ce moment-là, Jésus traversa des champs de céréales un jour de sabbat[a]. Ses disciples eurent faim et se mirent à cueillir des épis et à les manger.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les sabbats » ; ce pluriel grec est une tournure idiomatique qui signifie ici « un jour de sabbat ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: À ce moment-là
  rationale: Cette expression marque une occasion dans le déroulement du récit plutôt qu’une heure précise. « À ce moment-là » est naturel en français moderne.
- source_word: ἐπορεύθη
  choice: traversa
  rationale: Le verbe signifie ici aller ou se déplacer; avec le complément « à travers les champs », « traversa » rend naturellement le mouvement décrit.
- source_word: τοῖς σάββασιν
  choice: un jour de sabbat
  rationale: Le pluriel grec est idiomatique et désigne ici le jour du sabbat. Cette formulation française claire conserve la référence temporelle sans suggérer plusieurs sabbats.
- source_word: διὰ τῶν σπορίμων
  choice: des champs de céréales
  rationale: σπόριμος désigne des terres ensemencées, notamment des champs de céréales. La formulation est précise et compréhensible à l’échelle internationale.
- source_word: οἱ δὲ μαθηταὶ αὐτοῦ
  choice: Ses disciples
  rationale: δέ assure ici une transition narrative légère, sans opposition marquée. Une nouvelle phrase sans connecteur lourd convient au français.
- source_word: ἐπείνασαν
  choice: eurent faim
  rationale: L’aoriste peut présenter la survenue de la faim. « Eurent faim » l’exprime avec concision et naturel.
- source_word: ἤρξαντο
  choice: se mirent à
  rationale: Cette tournure française exprime clairement le commencement de l’action et s’accorde au registre narratif courant.
- source_word: τίλλειν
  choice: arracher
  rationale: τίλλω indique que les épis sont détachés à la main. « Arracher » est précis ici, sans ajouter l’idée de moissonner.
- source_word: στάχυας
  choice: des épis
  rationale: στάχυς désigne l’épi d’une céréale. En français, « épis » suffit naturellement dans le contexte des champs de céréales.
- source_word: καὶ ἐσθίειν
  choice: et à les manger
  rationale: Le second infinitif dépend lui aussi de ἤρξαντο. Le pronom « les » explicite naturellement en français que les disciples mangent les épis ou leurs grains.
theological_decisions:
- issue: Sens du pluriel σάββασιν
  choice: un jour de sabbat
  alternative: les jours de sabbat
  rationale: Le pluriel grec est une tournure idiomatique pouvant désigner un seul sabbat. Le singulier contextuel évite de faire croire que l’épisode se déroule sur plusieurs sabbats; cette décision est grammaticale, non doctrinale.
translation_notes:
  register: Français international moderne, digne et narratif. « Champs de céréales » évite les régionalismes; « un jour de sabbat » est plus naturel que « le sabbat » après le verbe de déplacement tout en préservant le sens idiomatique du grec.
