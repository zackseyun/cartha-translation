  naturalness: Le français est clair et de registre approprié. La formulation révisée garde une syntaxe française naturelle tout en explicitant, comme le contexte l’impose, que la brebis est retirée de la fosse.
  terminology: « Homme », « brebis », « fosse » et « sabbat » conviennent. Le masculin représentatif de ἄνθρωπος est conservé sans ajout interprétatif. La note sur σάββασιν conserve l’information utile sur le pluriel grec idiomatique.
