id: MAT.12.11
reference: Matthew 12:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Τίς ⸀ἔσται ἐξ ὑμῶν ἄνθρωπος ὃς ἕξει πρόβατον ἕν, καὶ ἐὰν ἐμπέσῃ τοῦτο τοῖς σάββασιν εἰς βόθυνον, οὐχὶ κρατήσει αὐτὸ καὶ ἐγερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/011.yaml
  text: But he said to them[a], “Which man among you, if he has one sheep and it falls into a pit on the Sabbath[b], will not take hold of it and lift it out?”
translation:
  language: fr
  text: 'Mais il leur dit : « Quel homme parmi vous, s’il a une seule brebis et qu’elle tombe dans une fosse le jour du sabbat[a], ne la saisira-t-il pas et ne l’en retirera-t-il pas[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « pendant les sabbats » ; le pluriel grec peut désigner idiomatiquement le jour du sabbat.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne la saisira-t-il pas et ne la relèvera-t-il pas ? » Dans ce contexte, il s’agit de la faire remonter hors de la fosse.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἔσται ἐξ ὑμῶν ἄνθρωπος
  choice: Quel homme parmi vous
  rationale: Cette formulation rend naturellement la question rhétorique tout en conservant le singulier masculin représentatif du grec.
- source_word: ἕξει
  choice: s’il a
  rationale: Bien que le verbe grec soit au futur, la construction hypothétique se rend naturellement au présent en français.
- source_word: πρόβατον ἕν
  choice: une seule brebis
  rationale: « Une seule » maintient l’accent porté par le numéral, tandis que « brebis » est le terme français courant dans ce type d’image biblique.
- source_word: ἐὰν ἐμπέσῃ τοῦτο
  choice: et qu’elle tombe
  rationale: Le subjonctif après « et que » s’intègre naturellement à la condition introduite par « si »; le pronom reprend clairement la brebis.
- source_word: τοῖς σάββασιν
  choice: un jour de sabbat
  rationale: Le pluriel grec est idiomatique. « Un jour de sabbat » convient à cette situation hypothétique et exprime clairement qu’il s’agit du jour concerné par la règle sabbatique.
- source_word: εἰς βόθυνον
  choice: dans une fosse
  rationale: « Fosse » rend le sens général d’un trou ou d’une cavité sans préciser indûment sa nature.
- source_word: οὐχὶ
  choice: ne… pas ?
  rationale: La négation introduit une question qui appelle une réponse affirmative; la tournure française conserve cette attente.
- source_word: κρατήσει
  choice: la saisira
  rationale: « Saisir » exprime ici l’action de prendre fermement la brebis, dans un registre actuel et digne.
- source_word: ἐγερεῖ
  choice: la relèvera
  rationale: Le verbe signifie faire lever ou relever. Le contexte de la fosse implique que l’animal est ainsi remonté, sans qu’il soit nécessaire d’ajouter explicitement « hors de la fosse » dans le texte principal.
theological_decisions:
- issue: Langage représentatif masculin
  choice: Quel homme parmi vous
  alternative: Qui parmi vous
  rationale: Le grec emploie explicitement ἄνθρωπος au masculin singulier dans cet exemple représentatif. La traduction conserve cette forme sans lui attribuer une portée doctrinale supplémentaire.
- issue: Forme plurielle de σάββασιν
  choice: un jour de sabbat
  alternative: les jours de sabbat
  rationale: Le pluriel grec est une tournure idiomatique pouvant désigner le sabbat. Dans cette hypothèse portant sur un incident particulier, le singulier français transmet le sens sans suggérer plusieurs sabbats.
- issue: Portée de ἐγερεῖ
  choice: la relèvera
  alternative: la remontera de la fosse
  rationale: « Relèvera » conserve le sens lexical du verbe grec et une légère ouverture sémantique, tandis que le contexte indique suffisamment qu’il s’agit de sortir la brebis de sa position dans la fosse.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique reste directe, et le parallélisme des deux verbes grecs est conservé.
