id: MAT.12.39
reference: Matthew 12:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Γενεὰ πονηρὰ καὶ μοιχαλὶς σημεῖον ἐπιζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/039.yaml
  text: But he answered and said to them[a], “An evil and adulterous generation seeks a sign[b], and no sign will be given to it except the sign of Jonah the prophet.”
translation:
  language: fr
  text: 'Mais il leur répondit : « Une génération mauvaise et adultère[a] cherche à obtenir un signe, mais aucun signe ne lui sera donné, sinon le signe du prophète Jonas[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot « adultère » peut évoquer l’infidélité envers Dieu, selon l’image employée par les prophètes, aussi bien que l’immoralité sexuelle au sens littéral.
    reason: cross_reference
  - marker: b
    text: 'Ou : « le signe de Jonas, le prophète ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: il leur répondit
  rationale: La tournure grecque, littéralement « ayant répondu, il leur dit », est une formule narrative courante. « Il leur répondit » en restitue naturellement le sens en français moderne sans lourdeur redondante.
- source_word: Γενεὰ
  choice: une génération
  rationale: « Génération » conserve la portée collective du singulier et désigne ici les contemporains de Jésus caractérisés sur le plan moral.
- source_word: πονηρὰ
  choice: mauvaise
  rationale: « Mauvaise » exprime clairement le jugement moral porté par πονηρά et forme en français une association naturelle avec « génération ».
- source_word: μοιχαλὶς
  choice: adultère
  rationale: Le terme garde la force de l’image liée à l’adultère et peut évoquer, dans le langage biblique et prophétique, l’infidélité envers Dieu. Le rendre simplement par « infidèle » résoudrait trop vite cette tension.
- source_word: σημεῖον
  choice: un signe
  rationale: « Signe » est le correspondant direct et laisse ouverte la nature précise du signe demandé, sans ajouter l’idée explicite de miracle absente du terme lui-même.
- source_word: ἐπιζητεῖ
  choice: cherche à obtenir
  rationale: Le verbe exprime une recherche insistante. « Cherche à obtenir » reste naturel tout en rendant mieux cette nuance que le simple « cherche » en français.
- source_word: δοθήσεται
  choice: sera donné
  rationale: Cette forme passive au futur est rendue directement et naturellement par le futur passif français.
- source_word: αὐτῇ
  choice: lui
  rationale: Le pronom renvoie à « génération », féminin singulier en grec comme en français. « Lui » maintient ce lien sans répéter inutilement le nom.
- source_word: εἰ μὴ
  choice: sinon
  rationale: Après la négation, « sinon » exprime naturellement l’exception introduite par εἰ μή.
- source_word: τὸ σημεῖον Ἰωνᾶ τοῦ προφήτου
  choice: le signe du prophète Jonas
  rationale: Cette formulation française naturelle conserve la relation génitive sans préciser prématurément en quoi consiste le signe.
theological_decisions:
- issue: Sens de « adultère » dans l’accusation de Jésus
  choice: Conserver « adultère » dans le texte principal.
  alternative: « infidèle »
  rationale: Le grec peut évoquer à la fois l’adultère au sens moral et l’image prophétique de l’infidélité envers Dieu. La traduction retenue préserve cette richesse et cette tension au lieu de privilégier une seule interprétation.
- issue: Nature du « signe du prophète Jonas »
  choice: Conserver l’expression sans en expliquer la nature dans le texte principal.
  alternative: « un signe semblable à ce qui est arrivé à Jonas »
  rationale: Le verset introduit l’expression, dont le contexte immédiat précise ensuite la portée. Une explicitation ici importerait une interprétation avant que le texte ne la développe.
translation_notes:
  register: Français international moderne, digne et accessible. La formule narrative grecque est allégée conformément à l’usage naturel du français, tandis que les termes théologiquement chargés « adultère » et « signe » sont conservés sans paraphrase interprétative.
