  text: καὶ τῷ ὀνόματι αὐτοῦ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/021.yaml
  text: and in his name the nations will hope[a].
translation:
  language: fr
  text: et les nations espéreront en son nom[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les non-Juifs espéreront en son nom ».'
    reason: ἔθνη peut signifier « les nations » ou « les non-Juifs ».
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction de coordination ordinaire, conservée pour relier cette proposition à la citation qui précède.
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: en son nom
  rationale: Avec ἐλπίζω, le datif désigne ici ce en quoi l'espérance est placée. « En son nom » reste naturel en français biblique actuel et conserve les notions de personne, d'autorité et de réputation associées au nom.
- source_word: ἔθνη
  choice: les nations
  rationale: Le terme peut désigner les nations ou, selon la perspective juive, les non-Juifs. Dans cette citation d'Ésaïe, « les nations » préserve au mieux la portée universelle sans effacer l'autre nuance.
- source_word: ἐλπιοῦσιν
  choice: espéreront
  rationale: Le futur actif de ἐλπίζω est rendu directement par le futur simple. « Espéreront » conserve la valeur lexicale et la tonalité de promesse.
theological_decisions:
- issue: Sens de ἔθνη dans une citation messianique
  choice: les nations
  alternative: les non-Juifs
  rationale: « Les nations » maintient l'horizon collectif et universel de la citation d'Ésaïe, tandis que « les non-Juifs » explicite une nuance contextuellement possible. La variante est signalée sans trancher davantage.
translation_notes:
  register: Français international moderne, simple et digne. L'ordre « espéreront en son nom » est idiomatique et permet de conserver l'accent final de la citation sur le nom.
