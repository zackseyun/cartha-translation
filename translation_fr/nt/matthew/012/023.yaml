  text: καὶ ἐξίσταντο πάντες οἱ ὄχλοι καὶ ἔλεγον· Μήτι οὗτός ἐστιν ὁ υἱὸς Δαυίδ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/023.yaml
  text: And all the crowds were astonished and said[b][a], “Can this be the Son of David?”
translation:
  language: fr
  text: 'Toutes les foules étaient stupéfaites et disaient : « Serait-ce le Fils de David[a] ? »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Le Fils de David » est un titre messianique qui désigne le libérateur royal promis, issu de la lignée de David.
    reason: cross_reference
  - marker: b
    text: 'Ou, en rendant plus littéralement l’orientation de la question : « Ce ne serait tout de même pas le Fils de David ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: étaient stupéfaites
  rationale: L’imparfait exprime une réaction durable d’étonnement intense. « Étaient stupéfaites » est naturel en français moderne et conserve la force du verbe sans suggérer une perte de raison.
- source_word: πάντες οἱ ὄχλοι
  choice: toutes les foules
  rationale: Cette formulation conserve explicitement le pluriel ὄχλοι et la totalité exprimée par πάντες, même si « toute la foule » serait plus idiomatique.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait français rend naturellement la parole collective et continue ou répétée indiquée par l’imparfait grec.
- source_word: Μήτι
  choice: Serait-ce
  rationale: Μήτι oriente normalement vers une réponse négative tout en exprimant ici une interrogation hésitante. « Serait-ce » préserve l’étonnement et la réserve sans transformer la question en refus catégorique.
- source_word: ὁ υἱὸς Δαυίδ
  choice: le Fils de David
  rationale: La traduction littérale maintient ce titre messianique chargé de sens dans Matthieu, au lieu de le remplacer par une interprétation comme « le Messie ».
theological_decisions:
- issue: Portée messianique de « le Fils de David »
  choice: Conserver « le Fils de David » dans le texte principal.
  alternative: « le Messie » ou « l’héritier promis de David »
  rationale: Le grec emploie le titre lui-même. Le conserver respecte sa forme historique, sa portée royale et son ambiguïté dans la bouche des foules, tandis qu’une note en explicite le sens messianique.
- issue: Orientation négative possible de Μήτι
  choice: Employer la question hésitante « Serait-ce… ? »
  alternative: « Ce ne serait tout de même pas… ? » ou « Ce n’est quand même pas… ? »
  rationale: La particule laisse entendre qu’une réponse négative est attendue ou envisagée, mais le contexte manifeste aussi l’étonnement et la possibilité naissante d’une reconnaissance. Le texte principal garde cette tension, et la note signale la formulation plus littéralement négative.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait soutient la scène narrative; « Serait-ce » convient à une réaction collective mêlant stupéfaction, hésitation et attente messianique.
