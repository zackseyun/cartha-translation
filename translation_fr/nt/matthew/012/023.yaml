  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : le pluriel collectif de πάντες οἱ ὄχλοι (« Toutes les foules »), l’étonnement durable à l’imparfait (« étaient stupéfaites »), la parole collective à l’imparfait (« disaient ») et le titre ὁ υἱὸς Δαυίδ (« le Fils de David »). « Serait-ce » conserve l’interrogation hésitante de Μήτι; la note signale avec justesse son orientation négative possible sans l’imposer au texte principal.'
  naturalness: Le français est moderne, clair et d’un registre biblique digne. « Toutes les foules » est légèrement plus littéral que l’expression plus idiomatique « toutes les personnes » ou un singulier collectif, mais c’est grammatical et défendable puisqu’il préserve le pluriel explicite du grec. « Serait-ce le Fils de David ? » est naturel et exprime bien la stupeur interrogative.
  terminology: « Le Fils de David » maintient correctement un titre messianique important sans le réduire interprétativement à « le Messie ». La note a est sobre, historiquement appropriée et non confessionnelle. La note b expose une possibilité lexicale réelle de Μήτι et ne prétend pas éliminer l’ambiguïté contextuelle.
