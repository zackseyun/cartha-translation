source:
  edition: SBLGNT
  text: ⸂ἐξελθόντες δὲ οἱ Φαρισαῖοι συμβούλιον ἔλαβον κατ’ αὐτοῦ⸃ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/014.yaml
  text: But the Pharisees went out and conspired against him, how they might destroy him.
translation:
  language: fr
  text: Mais les Pharisiens sortirent et se concertèrent contre lui afin de causer sa perte[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le faire périr », « le tuer » ou « le mettre à mort ». Le verbe grec peut signifier « perdre » ou « détruire » et peut, dans ce contexte, exprimer une intention meurtrière.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: sortirent
  rationale: Le participe aoriste exprime ici une action antérieure ou successive. Une forme verbale coordonnée rend naturellement en français leur départ avant leur concertation.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque le tournant contrasté entre l’action de Jésus et la réaction hostile des pharisiens.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française courante de ce groupe juif; la minuscule correspond à l’usage moderne pour les membres d’un courant religieux.
- source_word: συμβούλιον ἔλαβον
  choice: se concertèrent
  rationale: Cette expression idiomatique signifie qu’ils tinrent conseil et élaborèrent ensemble un projet. « Se concertèrent » est naturel, digne et conserve l’idée de délibération commune sans ajouter une structure institutionnelle.
- source_word: κατ’ αὐτοῦ
  choice: contre lui
  rationale: La préposition κατά avec le génitif a ici une valeur hostile ou adversative.
- source_word: ὅπως
  choice: afin de
  rationale: La conjonction introduit le but, étroitement lié au contenu de leur concertation. « Afin de » restitue clairement ce rapport en français soutenu mais courant.
- source_word: ἀπολέσωσιν
  choice: causer sa perte
  rationale: Le verbe peut signifier détruire, faire périr ou tuer. « Causer sa perte » conserve une certaine ampleur lexicale tout en exprimant nettement l’intention hostile; la portée probablement létale est signalée en note.
theological_decisions:
- issue: Degré de précision dans la traduction de ἀπολέσωσιν
  choice: causer sa perte
  alternative: le faire périr; le tuer; le mettre à mort
  rationale: Le contexte laisse fortement entendre une intention meurtrière, mais le verbe grec est plus large qu’un verbe signifiant explicitement « tuer ». Le texte principal préserve cette amplitude, tandis que la note indique les lectures plus explicites permises par le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. « Se concertèrent » évite le calque peu idiomatique « prirent conseil »; « causer sa perte » maintient l’ambiguïté lexicale sans atténuer l’hostilité du projet.
