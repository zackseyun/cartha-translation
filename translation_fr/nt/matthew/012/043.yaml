id: MAT.12.43
reference: Matthew 12:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅταν δὲ τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ οὐχ εὑρίσκει.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/043.yaml
  text: When the unclean spirit goes out from the man[a], it passes through waterless places seeking rest, and does not find it.
translation:
  language: fr
  text: Quand l’esprit impur sort d’un homme, il traverse des lieux sans eau[a] à la recherche de repos, et il n’en trouve pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des lieux arides ». Le grec signifie littéralement « des lieux sans eau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: Quand
  rationale: Ὅταν introduit une situation générale. En français, « Quand » rend naturellement cette valeur temporelle; la légère transition marquée par δέ peut rester implicite sans alourdir la phrase.
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: l’esprit impur
  rationale: Cette expression conserve le terme « esprit » du grec et sa connotation d’impureté, sans le remplacer par le terme plus interprétatif « démon ».
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: sort d’un homme
  rationale: Le présent français convient à la portée générale de la construction avec ὅταν. Dans cette comparaison, l’article grec désigne le cas type; l’indéfini français « un homme » exprime naturellement cette valeur.
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: il traverse des lieux sans eau
  rationale: « Traverse » rend le mouvement à travers ces lieux, et « sans eau » préserve l’image concrète de ἄνυδρος plus directement que « arides ».
- source_word: ζητοῦν ἀνάπαυσιν
  choice: à la recherche de repos
  rationale: Cette tournure française exprime la recherche intentionnelle indiquée par le participe ζητοῦν tout en gardant le sens non précisé de ἀνάπαυσις.
- source_word: καὶ οὐχ εὑρίσκει
  choice: mais il n’en trouve pas
  rationale: Le contraste implicite entre la recherche et son échec se rend naturellement par « mais » en français; « en » reprend « repos » sans ajout de contenu.
theological_decisions:
- issue: Sens de πνεῦμα dans un contexte d’exorcisme
  choice: esprit
  alternative: démon
  rationale: Bien que le référent soit un esprit mauvais personnel, le texte grec dit « esprit impur » et non « démon ». La traduction conserve donc la formulation de la source.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’image concrète du grec et la portée générale de l’énoncé.
