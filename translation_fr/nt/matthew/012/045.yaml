id: MAT.12.45
reference: Matthew 12:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει μεθ’ ἑαυτοῦ ἑπτὰ ἕτερα πνεύματα πονηρότερα ἑαυτοῦ, καὶ εἰσελθόντα κατοικεῖ ἐκεῖ· καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων. οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/045.yaml
  text: Then it goes and brings with itself seven other spirits more evil than itself[a], and they enter and live there; and the last state of that man becomes worse than the first[b]. So it will be also with this evil generation.
translation:
  language: fr
  text: Alors il s’en va et prend avec lui sept autres esprits plus mauvais que lui[a]. Ils entrent et s’installent là. L’état final de cet homme devient pire que son état initial[b]. Il en sera de même pour cette génération mauvaise.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sept esprits différents, plus mauvais que lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « les dernières choses de cet homme deviennent pires que les premières » ; cette expression signifie que sa condition finale est pire que sa condition antérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε πορεύεται
  choice: Alors il s’en va
  rationale: « Alors » marque naturellement l’étape suivante du récit; le présent conserve la vivacité de la formulation grecque.
- source_word: παραλαμβάνει μεθ’ ἑαυτοῦ
  choice: prend avec lui
  rationale: Cette expression rend directement l’idée de prendre des compagnons avec soi, sans lourdeur.
- source_word: ἑπτὰ ἕτερα πνεύματα
  choice: sept autres esprits
  rationale: ἕτερα désigne ici des esprits supplémentaires; « autres » n’impose pas une différence de nature.
- source_word: πονηρότερα ἑαυτοῦ
  choice: plus mauvais que lui
  rationale: Le comparatif exprime un degré supérieur de mal; « mauvais » est courant et naturel, tandis que le pronom reprend « esprit ».
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: Ils entrent et s’installent là
  rationale: Le participe aoriste est rendu par un verbe coordonné pour respecter la séquence. « S’installent » exprime la prise de résidence portée par κατοικέω, tout en rendant le sens collectif malgré le singulier formel κατοικεῖ.
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: L’état final de cet homme
  rationale: La tournure grecque, littéralement « les dernières choses de cet homme », désigne idiomatiquement sa condition finale.
- source_word: χείρονα τῶν πρώτων
  choice: pire que son état initial
  rationale: La formulation explicite en français le contraste idiomatique entre la condition finale et la condition antérieure.
- source_word: οὕτως ἔσται καὶ τῇ γενεᾷ ταύτῃ τῇ πονηρᾷ
  choice: Il en sera de même pour cette génération mauvaise
  rationale: Cette tournure française exprime clairement l’application analogique à la génération visée, sans atténuer πονηρᾷ.
theological_decisions:
- issue: Désignation des êtres mauvais par πνεύματα
  choice: esprits
  alternative: démons
  rationale: Le grec emploie « esprits »; le contexte précise déjà qu’il s’agit d’esprits impurs. Le terme source est donc conservé sans le remplacer par une désignation plus spécifique.
- issue: Rendu de ἀνθρώπου dans l’exemple singulier
  choice: cet homme
  alternative: cette personne
  rationale: Le substantif grec est ici singulier masculin dans un exemple représentatif; « cet homme » préserve cette forme sans généralisation ajoutée.
- issue: Application à « cette génération mauvaise »
  choice: génération mauvaise
  alternative: génération méchante
  rationale: « Mauvaise » garde la portée morale de πονηρά et le lien lexical avec les esprits « plus mauvais », sans préciser davantage la nature du jugement.
translation_notes:
  register: Français international moderne, clair et digne. Les phrases sont légèrement segmentées pour éviter une coordination trop lourde, tout en préservant l’enchaînement des actions et la conclusion solennelle.
