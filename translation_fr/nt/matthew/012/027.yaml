id: MAT.12.27
reference: Matthew 12:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο αὐτοὶ ⸂κριταὶ ἔσονται ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/027.yaml
  text: And if I cast out demons by Beelzebul[a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: fr
  text: Et si moi, je chasse les démons par Béelzéboul[a], par qui vos fils les chassent-ils ? C’est pourquoi ils seront eux-mêmes vos juges.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Béelzéboul » ; certaines traductions ont « Béelzébub ».'
    reason: Signaler la forme grecque suivie et la variante traditionnelle connue.
lexical_decisions:
- source_word: ἐν Βεελζεβοὺλ
  choice: par Béelzéboul
  rationale: Dans ce contexte, ἐν a une valeur instrumentale et indique le moyen ou la puissance invoquée. « Par » est donc naturel en français. La forme grecque Βεελζεβούλ est transcrite « Béelzéboul ».
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: je chasse les démons
  rationale: Dans un contexte d’exorcisme, ἐκβάλλω signifie expulser ou chasser. « Chasser les démons » est clair, courant et conserve l’idée d’expulsion.
- source_word: οἱ υἱοὶ ὑμῶν
  choice: vos fils
  rationale: La traduction conserve le terme de parenté υἱοί et la formulation rhétorique du grec, sans préciser s’il désigne ici des disciples, des membres de leur groupe ou leurs descendants.
- source_word: ἐν τίνι
  choice: par qui
  rationale: Comme le premier ἐν, cette expression a ici un sens instrumental. « Par qui » maintient le parallèle avec « par Béelzéboul » et convient à une puissance personnelle.
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette locution exprime naturellement en français la conclusion tirée de la question rhétorique.
- source_word: αὐτοὶ κριταὶ ἔσονται ὑμῶν
  choice: ils seront eux-mêmes vos juges
  rationale: « Eux-mêmes » rend l’emphase de αὐτοί, tandis que « seront vos juges » conserve le nom prédicatif κριταί et le futur.
theological_decisions:
- issue: Identité et graphie de Βεελζεβούλ
  choice: Béelzéboul
  alternative: Béelzébub
  rationale: La traduction suit la forme du texte grec fourni au lieu de l’harmoniser avec une forme traditionnelle plus familière. Il s’agit d’une décision de transcription, sans identification doctrinale supplémentaire.
- issue: Référent de « vos fils »
  choice: Conserver l’expression « vos fils »
  alternative: « vos disciples » ou « les gens de votre groupe »
  rationale: Le grec laisse au contexte le soin de déterminer le groupe visé. La traduction préserve cette relative ambiguïté plutôt que d’imposer une interprétation.
translation_notes:
  register: Français moderne, international et digne. La dislocation « si moi, je » rend l’emphase de ἐγώ sans alourdir excessivement la phrase. La question et sa conclusion gardent leur force polémique et leur parallélisme.
