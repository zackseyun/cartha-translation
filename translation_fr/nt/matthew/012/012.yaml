id: MAT.12.12
reference: Matthew 12:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πόσῳ οὖν διαφέρει ἄνθρωπος προβάτου. ὥστε ἔξεστιν τοῖς σάββασιν καλῶς ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/012.yaml
  text: How much more valuable[a], then, is a man than a sheep! So it is lawful to do good on the Sabbaths.
translation:
  language: fr
  text: Un être humain vaut donc bien plus qu’une brebis ! Par conséquent, il est permis de faire le bien les jours de sabbat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « le jour du sabbat ». Le grec emploie le pluriel « les sabbats », tournure courante pour parler de l’observance du sabbat.'
    reason: alternative lexicale et précision sur l’idiome grec
lexical_decisions:
- source_word: πόσῳ οὖν διαφέρει
  choice: vaut donc bien plus
  rationale: Cette formulation française naturelle restitue la comparaison de valeur et la force rhétorique du raisonnement allant du moindre au plus important.
- source_word: ἄνθρωπος
  choice: un être humain
  rationale: Dans ce contraste général avec une brebis, le nom désigne une personne humaine sans préciser son sexe ; « un être humain » en rend clairement la portée représentative.
- source_word: προβάτου
  choice: qu’une brebis
  rationale: Le génitif marque ici le second terme de la comparaison ; « brebis » est le terme français courant pour πρόβατον dans ce contexte.
- source_word: ὥστε
  choice: Par conséquent
  rationale: L’expression introduit explicitement la conclusion tirée de la comparaison précédente.
- source_word: ἔξεστιν
  choice: il est permis
  rationale: Le contexte porte sur ce que la Loi autorise le jour du sabbat ; cette tournure conserve la nuance juridique sans être excessivement technique.
- source_word: τοῖς σάββασιν
  choice: les jours de sabbat
  rationale: Le pluriel grec est conservé sous une forme française naturelle, tout en signalant en note l’équivalent idiomatique au singulier.
- source_word: καλῶς ποιεῖν
  choice: faire le bien
  rationale: Cette expression française courante traduit directement l’action bonne ou bienfaisante visée par le grec.
theological_decisions:
- issue: Portée de ἄνθρωπος
  choice: un être humain
  alternative: un homme
  rationale: Le propos énonce la valeur générale de la personne humaine par contraste avec une brebis. Le grec ἄνθρωπος peut désigner l’être humain sans distinction de sexe ; la traduction ne restreint donc pas artificiellement cette portée.
- issue: Forme plurielle de « sabbats »
  choice: les jours de sabbat
  alternative: le jour du sabbat
  rationale: Le texte grec emploie le pluriel, idiomatique dans ce type d’expression. Le français au pluriel reste clair et permet de conserver cette forme sans modifier le sens.
translation_notes:
  register: Français moderne, courant et digne. L’exclamation conserve la vigueur rhétorique de la comparaison, tandis que « Par conséquent » rend nettement la conclusion sans effacer les deux articulations logiques du grec.
