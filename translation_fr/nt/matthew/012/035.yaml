  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ ἐκβάλλει ἀγαθά, καὶ ὁ πονηρὸς ἄνθρωπος ἐκ τοῦ πονηροῦ θησαυροῦ ἐκβάλλει πονηρά.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/012/035.yaml
  text: The good man brings out good things from his good treasure[b][a], and the evil man brings out evil things from his evil treasure.
translation:
  language: fr
  text: L’homme[a] bon tire de son bon trésor de bonnes choses[b], et l’homme mauvais tire de son mauvais trésor de mauvaises choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la personne » : le grec emploie ici ἄνθρωπος (« homme ») au singulier masculin dans un sens représentatif.'
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte immédiat, les « bonnes choses » et les « mauvaises choses » désignent notamment les paroles.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγαθὸς / ἀγαθά
  choice: bon / de bonnes choses
  rationale: Conserve la répétition grecque et le contraste moral, tout en rendant naturellement en français l’adjectif neutre pluriel employé comme nom.
- source_word: ἄνθρωπος
  choice: l’homme
  rationale: Le masculin singulier grec désigne ici un individu représentatif dans une formule proverbiale parallèle. En français, « l’homme » préserve cette forme, avec une note signalant le sens générique possible.
- source_word: θησαυροῦ
  choice: trésor
  rationale: Préserve l’image d’une réserve intérieure d’où sort ce que la personne manifeste; « réserve » serait possible mais affaiblirait la métaphore.
- source_word: ἐκβάλλει
  choice: tire
  rationale: « Tirer de » exprime idiomatiquement le mouvement depuis une réserve sans la force excessive de « jeter dehors ».
- source_word: πονηρὸς / πονηρά
  choice: mauvais / de mauvaises choses
  rationale: Rend le contraste moral avec ἀγαθός dans un français naturel et symétrique. « Méchant » ou « mauvais » sont possibles; « mauvais » convient mieux à la répétition entre la personne, le trésor et ce qui en sort.
theological_decisions:
- issue: Portée de « bonnes choses » et « mauvaises choses »
  choice: Conserver l’expression générale du grec.
  alternative: Préciser qu’il s’agit de bonnes ou de mauvaises paroles.
  rationale: Le contexte immédiat concerne la parole, mais les adjectifs substantivés grecs ne nomment pas explicitement des paroles. La traduction maintient donc cette largeur de sens, tandis que la note indique l’accent contextuel.
translation_notes:
  register: Français moderne, clair et digne. Le parallélisme serré et les répétitions de l’original sont maintenus. « L’homme » a ici une valeur représentative et générique.
