id: MAT.8.20
reference: Matthew 8:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/020.yaml
  text: And Jesus says to him[a], “Foxes have dens, and the birds of the sky have nests[d][c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: fr
  text: 'Jésus lui dit : « Les renards ont des tanières et les oiseaux du ciel ont des abris[a], mais le Fils de l’homme n’a nulle part où poser la tête. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lieux où se reposer »; traditionnellement « nids ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent français, naturel dans un récit vivant.
- source_word: ἀλώπεκες
  choice: renards
  rationale: Équivalent direct et courant du pluriel grec.
- source_word: φωλεοὺς
  choice: tanières
  rationale: Désigne naturellement en français les refuges ou terriers d’animaux, particulièrement dans cette comparaison.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: les oiseaux du ciel
  rationale: Formulation naturelle qui conserve l’image et la référence à οὐρανός.
- source_word: κατασκηνώσεις
  choice: abris
  rationale: Le terme grec désigne des lieux où séjourner ou se reposer; « abris » préserve cette portée sans imposer l’idée plus précise de nids.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Rend le titre traditionnel de Jésus tout en préservant ses résonances scripturaires et son ambiguïté interprétative.
- source_word: οὐκ ἔχει ποῦ
  choice: n’a nulle part où
  rationale: Équivalent idiomatique français de la construction grecque négative.
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: poser la tête
  rationale: Expression française naturelle qui conserve l’image concrète du grec.
theological_decisions:
- issue: Traduction de l’auto-désignation ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: « Le Fils de l’homme » conserve la forme du titre, son enracinement biblique et ses possibles résonances messianiques sans les résoudre. « L’Humain » serait plus interprétatif et effacerait une partie de ces échos.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le présent narratif et le parallélisme entre les refuges des animaux et l’absence de lieu où Jésus puisse poser la tête.
