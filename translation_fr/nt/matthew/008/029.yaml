  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔκραξαν λέγοντες· Τί ἡμῖν καὶ ⸀σοί, υἱὲ τοῦ θεοῦ; ἦλθες ὧδε πρὸ καιροῦ βασανίσαι ἡμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/029.yaml
  text: And behold[a], they cried out, saying, “What have we to do with you[b], Son of God? Have you come here before the appointed time to torment us?”
translation:
  language: fr
  text: 'Et voici, ils crièrent : « Que nous veux-tu[a], Fils de Dieu ? Es-tu venu ici avant le temps fixé[b] pour nous tourmenter ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Qu’y a-t-il entre nous et toi ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avant le temps ». Le grec peut désigner un moment fixé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Et voici
  rationale: Conserve le marqueur discursif qui attire vivement l’attention et souligne la soudaineté de la scène.
- source_word: ἔκραξαν λέγοντες
  choice: ils se mirent à crier
  rationale: Rend l’intensité de κράζω dans un français naturel; les deux verbes grecs n’exigent pas la tournure plus lourde « crièrent en disant ».
- source_word: Τί ἡμῖν καὶ σοί
  choice: Que nous veux-tu
  rationale: Exprime naturellement l’idiome de dissociation ou de contestation, tout en signalant en note sa formulation plus littérale.
- source_word: υἱὲ τοῦ θεοῦ
  choice: Fils de Dieu
  rationale: Traduit directement le titre christologique employé dans l’adresse à Jésus.
- source_word: ἦλθες ὧδε
  choice: Es-tu venu ici
  rationale: Conserve la venue et la valeur locative précise de ὧδε.
- source_word: πρὸ καιροῦ
  choice: avant le temps fixé
  rationale: καιρός peut désigner le moment déterminé ou approprié; « fixé » laisse percevoir l’arrière-plan du jugement sans le développer.
- source_word: βασανίσαι ἡμᾶς
  choice: pour nous tourmenter
  rationale: Rend l’infinitif de but et le tourment sévère associé ici au jugement, sans limiter le sens à la torture physique.
theological_decisions:
- issue: Reconnaissance de l’identité de Jésus par les démons
  choice: Fils de Dieu
  alternative: fils de Dieu
  rationale: Le texte présente une adresse directe portant un titre christologique explicite; la majuscule convient en français sans ajouter au contenu du grec.
- issue: Nuance eschatologique de καιρός
  choice: avant le temps fixé
  alternative: avant le temps
  rationale: La formulation suggère un moment déterminé pour leur tourment, mais ne précise ni calendrier ni système doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. « Et voici » conserve la vivacité narrative biblique; le dialogue demeure direct et confrontant sans archaïsme excessif.
