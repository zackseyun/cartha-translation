reference: Matthew 8:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἄνθρωποι ἐθαύμασαν λέγοντες· Ποταπός ἐστιν οὗτος ὅτι καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα ⸂αὐτῷ ὑπακούουσιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/027.yaml
  text: And the men marveled[a], saying, “What sort of man is this, that even the winds and the sea obey him?”
translation:
  language: fr
  text: 'Les hommes furent saisis d’étonnement et dirent : « Quel genre d’homme[a] est-ce donc, puisque même les vents et la mer lui obéissent ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Quelle sorte d’homme ». Le grec interroge sur la nature ou la qualité de la personne.'
    reason: Alternative lexicale pour ποταπός.
lexical_decisions:
- source_word: οἱ δὲ ἄνθρωποι
  choice: Les hommes
  rationale: Dans ce contexte, le pluriel masculin désigne les hommes présents dans la barque. « Les hommes » reste précis sans généraliser à l’humanité entière.
- source_word: ἐθαύμασαν
  choice: furent saisis d’étonnement
  rationale: Cette formulation exprime une vive stupéfaction sans suggérer nécessairement l’admiration positive que peut évoquer « émerveillés » en français moderne.
- source_word: λέγοντες
  choice: et dirent
  rationale: La coordination est plus naturelle dans le récit français que le participe « en disant », tout en conservant le lien immédiat entre leur étonnement et leurs paroles.
- source_word: Ποταπός
  choice: Quel genre d’homme
  rationale: ποταπός porte sur la nature ou la qualité de la personne. « Quel genre d’homme » restitue cette nuance dans un français actuel.
- source_word: οὗτος
  choice: est-ce donc
  rationale: La construction française intègre le démonstratif dans la question et « donc » en rend le caractère immédiat et étonné, sans expliciter davantage l’identité de Jésus.
- source_word: ὅτι
  choice: pour que
  rationale: Dans cette question d’étonnement, « pour que » relie naturellement la qualité de cet homme au fait extraordinaire qui la motive.
- source_word: καὶ οἱ ἄνεμοι καὶ ἡ θάλασσα
  choice: même les vents et la mer
  rationale: '« Même » fait ressortir la portée emphatique du premier καί : jusqu’aux forces naturelles sont soumises à son autorité.'
- source_word: αὐτῷ ὑπακούουσιν
  choice: lui obéissent
  rationale: ὑπακούω exprime ici l’obéissance à une autorité personnelle. « Lui obéissent » en conserve directement la force.
theological_decisions:
- issue: Portée christologique de la question
  choice: Conserver la question ouverte tout en laissant paraître l’autorité extraordinaire de Jésus sur la création.
  alternative: Expliciter l’identité divine de Jésus ou réduire la scène à la seule surprise provoquée par un miracle.
  rationale: Le verset suscite une interrogation sur l’identité de Jésus sans y répondre explicitement. La traduction préserve cette tension narrative et théologique.
translation_notes:
  register: Français moderne, international et digne. « Furent saisis d’étonnement » garde un ton narratif soutenu mais accessible ; la question demeure naturelle et conserve sa force.
