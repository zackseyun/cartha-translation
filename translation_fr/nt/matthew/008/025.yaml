id: MAT.8.25
reference: Matthew 8:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀προσελθόντες ἤγειραν αὐτὸν λέγοντες· Κύριε, ⸀σῶσον, ἀπολλύμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/025.yaml
  text: And they came and woke him[a], saying, “Lord, save us! We are perishing!”
translation:
  language: fr
  text: 'Ils s’approchèrent de lui et le réveillèrent en disant : « Seigneur, sauve-nous[a] ! Nous périssons ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « délivre-nous ». Le verbe grec peut désigner le fait d’arracher quelqu’un à un danger immédiat aussi bien que le salut dans un sens plus large.'
    reason: Alternative lexicale qui préserve l’étendue sémantique de σῴζω dans ce contexte de péril immédiat.
lexical_decisions:
- source_word: προσελθόντες
  choice: ils s’approchèrent de lui
  rationale: Le participe aoriste de προσέρχομαι exprime leur mouvement vers Jésus avant qu’ils le réveillent. « S’approchèrent de lui » rend ce mouvement explicitement et naturellement en français.
- source_word: ἤγειραν
  choice: le réveillèrent
  rationale: Dans ce contexte, ἐγείρω désigne le fait de tirer quelqu’un de son sommeil, sans connotation de résurrection.
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent introduit directement leurs paroles. « En disant » conserve cette relation sans ajouter l’idée d’un cri, absente du verbe lui-même.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif de κύριος est rendu par le titre traditionnel et actuel « Seigneur », qui préserve aussi bien la valeur d’adresse respectueuse que sa possible portée christologique.
- source_word: σῶσον
  choice: sauve-nous
  rationale: L’impératif aoriste de σῴζω exprime ici une demande pressante de salut face à un danger immédiat. Le complément « nous », implicite en grec mais évident d’après la suite et le contexte, est nécessaire en français.
- source_word: ἀπολλύμεθα
  choice: nous périssons
  rationale: Le présent de ἀπόλλυμι exprime leur perte imminente ou déjà engagée. « Nous périssons » conserve l’aspect présent, l’urgence et la force du verbe sans le réduire à la seule idée de mourir.
theological_decisions:
- issue: Valeur du titre κύριος adressé à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » laisse intacte la tension entre une adresse respectueuse et une portée christologique plus profonde, sans trancher artificiellement entre les deux.
- issue: Expression du complément de σῶσον
  choice: sauve-nous
  alternative: sauve [complément implicite]
  rationale: Le grec n’exprime pas séparément le complément, mais le contexte et le « nous » de ἀπολλύμεθα l’identifient sans ambiguïté. Le français exige ici son explicitation pour rester naturel.
translation_notes:
  register: Français moderne, digne et direct. La coordination et la succession des actions restent proches du grec, tandis que « s’approchèrent de lui » et « en disant » assurent une syntaxe naturelle. « Nous périssons » conserve volontairement l’urgence et la tension du présent grec.
