source:
  edition: SBLGNT
  text: καὶ λέγων· Κύριε, ὁ παῖς μου βέβληται ἐν τῇ οἰκίᾳ παραλυτικός, δεινῶς βασανιζόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/006.yaml
  text: and saying[a], “Lord, my servant is lying paralyzed at home[b], suffering terribly.”
translation:
  language: fr
  text: 'et dit : « Seigneur, mon serviteur[a] est couché à la maison, paralysé et souffre terriblement. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon garçon » ou « mon enfant » ; le mot grec peut désigner un serviteur, un garçon ou un enfant, même si « serviteur » convient le mieux au contexte du centurion.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγων
  choice: et dit
  rationale: Le participe présent poursuit la prise de parole introduite au verset précédent. En français narratif, « et dit » restitue naturellement ce lien sans le calque pesant « et disant ».
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve à la fois la valeur possible d'une adresse respectueuse et celle d'un titre plus élevé, sans trancher entre elles.
- source_word: ὁ παῖς μου
  choice: mon serviteur
  rationale: παῖς peut désigner un enfant, un garçon ou un serviteur. Dans la bouche d'un centurion et compte tenu du récit parallèle de Luc 7, « serviteur » convient le mieux au contexte, tandis qu'une note préserve l'ambiguïté lexicale.
- source_word: βέβληται ἐν τῇ οἰκίᾳ
  choice: est couché à la maison
  rationale: Le parfait passif décrit ici l'état résultant dans lequel se trouve le serviteur. « Est couché à la maison » est idiomatique et rend cet état sans reproduire littéralement l'idée d'avoir été jeté ou déposé.
- source_word: παραλυτικός
  choice: paralysé
  rationale: L'adjectif est rendu naturellement comme l'état du serviteur, plutôt que par le substantif aujourd'hui moins approprié « un paralytique ».
- source_word: δεινῶς βασανιζόμενος
  choice: terriblement tourmenté
  rationale: Cette formulation maintient la force de δεινῶς et de βασανίζω, qui évoquent une souffrance ou un tourment intense, tout en restant claire en français moderne.
theological_decisions:
- issue: Portée de κύριε lorsque le centurion s'adresse à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: Le contexte permet d'entendre soit une marque de respect, soit un titre exprimant une reconnaissance plus profonde. « Seigneur » maintient cette ouverture théologique, alors que « Monsieur » imposerait une lecture seulement courtoise.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe narrative est lissée naturellement, tandis que l'intensité de la souffrance et l'ambiguïté de παῖς sont conservées.
