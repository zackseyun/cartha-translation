id: MAT.8.31
reference: Matthew 8:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ δαίμονες παρεκάλουν αὐτὸν λέγοντες· Εἰ ἐκβάλλεις ἡμᾶς, ⸂ἀπόστειλον ἡμᾶς⸃ εἰς τὴν ἀγέλην τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/031.yaml
  text: And the demons kept begging him[a], saying, “If you cast us out[b], send us into the herd of pigs.”
translation:
  language: fr
  text: 'Les démons le suppliaient[a] en disant : « Si tu nous chasses, envoie-nous dans le troupeau de porcs. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne cessaient de le supplier » ; l’imparfait grec peut suggérer une action prolongée ou répétée.
    reason: lexical_alternative
lexical_decisions:
- source_word: δαίμονες
  choice: démons
  rationale: Équivalent français courant et précis, qui conserve la présentation de ces êtres comme des esprits mauvais personnels sans ajouter d’explication doctrinale.
- source_word: παρεκάλουν
  choice: le suppliaient
  rationale: L’imparfait français rend naturellement l’aspect continu ou répété de l’imparfait grec, tout en gardant la force de la demande.
- source_word: λέγοντες
  choice: en disant
  rationale: Cette tournure restitue simplement le participe grec qui introduit le discours direct.
- source_word: Εἰ
  choice: Si
  rationale: Conserve la formulation conditionnelle du grec sans la réinterpréter comme une certitude exprimée par « puisque ».
- source_word: ἐκβάλλεις
  choice: tu nous chasses
  rationale: « Chasser » est naturel en français dans un contexte d’exorcisme et exprime bien l’idée d’expulsion portée par ἐκβάλλω.
- source_word: ἀπόστειλον
  choice: envoie-nous
  rationale: Rend directement l’impératif aoriste et la demande d’une action immédiate.
- source_word: ἀγέλην
  choice: troupeau
  rationale: Terme français ordinaire pour un groupe d’animaux dans ce récit.
- source_word: χοίρων
  choice: porcs
  rationale: Terme moderne, clair et digne; « cochons » serait plus familier.
- source_word: οἱ δὲ
  choice: Les
  rationale: En français, le simple début de phrase assure ici une transition narrative naturelle; traduire mécaniquement δέ par « et » ou « alors » alourdirait ou préciserait excessivement le lien.
theological_decisions:
- issue: Désignation des esprits mauvais
  choice: démons
  alternative: esprits démoniaques
  rationale: « Démons » préserve l’affirmation narrative concernant des êtres mauvais personnels qui parlent à Jésus, sans développer ni atténuer cette présentation.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait « suppliaient » porte déjà la valeur durative du grec; la note signale néanmoins la nuance possible sans surcharger le texte. « Porcs » est retenu plutôt que le plus familier « cochons ».
