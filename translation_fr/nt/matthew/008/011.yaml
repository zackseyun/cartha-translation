id: MAT.8.11
reference: Matthew 8:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι πολλοὶ ἀπὸ ἀνατολῶν καὶ δυσμῶν ἥξουσιν καὶ ἀνακλιθήσονται μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ ἐν τῇ βασιλείᾳ τῶν οὐρανῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/011.yaml
  text: But I tell you that many will come from east and west and will recline at table with Abraham and Isaac and Jacob in the kingdom of heaven[a][b].
translation:
  language: fr
  text: 'Mais je vous le dis : beaucoup viendront de l’est et de l’ouest[b] et prendront place à table[a] avec Abraham, Isaac et Jacob dans le royaume des cieux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Plus littéralement, « s’allongeront » ; dans l’Antiquité, on prenait ainsi place pour manger lors d’un banquet.
    reason: cultural_note
  - marker: b
    text: L’expression « de l’est et de l’ouest » évoque probablement des personnes venant de régions lointaines, notamment de l’extérieur d’Israël.
    reason: cross_reference
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mais je vous le dis
  rationale: δέ marque ici une légère opposition ou une progression par rapport à ce qui précède. « Mais je vous le dis » rend naturellement cette articulation en français.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: L’adjectif est employé comme substantif. « Beaucoup » reste concis et ne précise pas l’identité de ces personnes au-delà du grec.
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: de l’est et de l’ouest
  rationale: Les pluriels grecs désignent idiomatiquement les régions ou directions orientales et occidentales. Cette formulation française conserve la vaste portée géographique.
- source_word: ἥξουσιν
  choice: viendront
  rationale: Le verbe signifie venir ou arriver. « Viendront » est ici le choix le plus direct et naturel.
- source_word: ἀνακλιθήσονται
  choice: prendront place à table
  rationale: Le verbe évoque le fait de s’allonger pour manger selon l’usage antique. Cette expression française conserve clairement le contexte du repas sans produire une image trompeuse pour le lecteur moderne.
- source_word: μετὰ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: avec Abraham, Isaac et Jacob
  rationale: μετά avec le génitif exprime l’association, ici la communion de table. L’énumération française emploie une ponctuation naturelle sans modifier le sens.
- source_word: ἐν τῇ βασιλείᾳ τῶν οὐρανῶν
  choice: dans le royaume des cieux
  rationale: « Royaume des cieux » est la formulation française consacrée et idiomatique de l’expression caractéristique de Matthieu, tout en conservant le pluriel de οὐρανῶν.
theological_decisions:
- issue: Image du banquet et communion eschatologique
  choice: Conserver explicitement le cadre du repas par « prendront place à table ».
  alternative: s’allongeront avec Abraham, Isaac et Jacob
  rationale: Le passage évoque une communion de banquet et non une simple présence dans le royaume. La formulation retenue préserve cette portée sans ajouter de détail doctrinal.
- issue: Identité de ceux qui viennent de l’est et de l’ouest
  choice: Traduire l’indication géographique sans identifier explicitement ces personnes comme non-Juives.
  alternative: beaucoup de non-Juifs viendront de l’est et de l’ouest
  rationale: Le contexte peut suggérer l’inclusion de personnes étrangères à Israël, mais le grec dit seulement « beaucoup ». La traduction conserve cette implication sans résoudre ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. « Prendront place à table » rend accessible l’usage antique tout en maintenant l’image du banquet ; « royaume des cieux » conserve le vocabulaire propre à Matthieu.
