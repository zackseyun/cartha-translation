id: MAT.8.21
reference: Matthew 8:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἕτερος δὲ τῶν ⸀μαθητῶν εἶπεν αὐτῷ· Κύριε, ἐπίτρεψόν μοι πρῶτον ἀπελθεῖν καὶ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/021.yaml
  text: Then another of the disciples said to him[a], “Lord[b], permit me first to go away and bury my father.”
translation:
  language: fr
  text: 'Un autre de ses disciples lui dit : « Seigneur, permets-moi d’abord d’aller enterrer mon père.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette demande peut concerner soit l’enterrement immédiat de son père, soit, plus largement, l’accomplissement de ses devoirs envers lui jusqu’à sa mort ; le grec ne le précise pas.
    reason: cultural_note
lexical_decisions:
- source_word: ἕτερος δὲ τῶν μαθητῶν
  choice: Un autre de ses disciples
  rationale: La formulation identifie le locuteur comme un disciple supplémentaire, distinct du précédent. En français, « un autre de ses disciples » est naturel et rend le lien avec Jésus exprimé par le contexte.
- source_word: εἶπεν αὐτῷ
  choice: lui dit
  rationale: Traduction directe et idiomatique du verbe de parole et de son complément.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve à la fois la déférence de l’adresse et sa possible portée théologique, sans la réduire à « Maître ».
- source_word: ἐπίτρεψόν μοι
  choice: permets-moi
  rationale: Cette tournure exprime clairement et dignement une demande de permission, avec le registre respectueux de l’original.
- source_word: πρῶτον ἀπελθεῖν
  choice: d’abord d’aller
  rationale: « D’abord » préserve la priorité demandée; « aller » est plus naturel ici que « m’en aller », le déplacement étant suffisamment clair en français.
- source_word: θάψαι τὸν πατέρα μου
  choice: enterrer mon père
  rationale: « Enterrer » est l’équivalent français courant et direct de l’action funéraire désignée.
theological_decisions:
- issue: Sens et moment de la demande d’enterrer le père
  choice: Conserver la demande telle quelle sans préciser si le père vient de mourir.
  alternative: Comprendre l’expression comme le devoir de rester auprès du père jusqu’à sa mort future.
  rationale: Le grec ne précise ni que le décès vient d’avoir lieu ni que le locuteur demande un long délai. La traduction maintient donc cette ambiguïté, explicitée en note.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre de la phrase est légèrement adapté à l’usage français, sans effacer la priorité exprimée par « d’abord ». Le marqueur [a] figure dans le texte principal.
