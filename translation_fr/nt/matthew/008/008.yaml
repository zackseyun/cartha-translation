id: MAT.8.8
reference: Matthew 8:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂καὶ ἀποκριθεὶς⸃ ὁ ἑκατόνταρχος ἔφη· Κύριε, οὐκ εἰμὶ ἱκανὸς ἵνα μου ὑπὸ τὴν στέγην εἰσέλθῃς· ἀλλὰ μόνον εἰπὲ λόγῳ, καὶ ἰαθήσεται ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/008.yaml
  text: And the centurion answered[a], “Lord, I am not worthy that you should come under my roof. But only speak a word[b], and my servant will be healed.”
translation:
  language: fr
  text: 'Le centurion répondit : « Seigneur, je ne suis pas digne que tu entres sous mon toit. Mais dis seulement un mot[a], et mon serviteur[b] sera guéri. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il suffit que tu dises un mot ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « garçon » ou « enfant ». Le mot grec peut désigner un enfant, un jeune garçon ou un serviteur selon le contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς … ἔφη
  choice: répondit
  rationale: Les deux formes constituent ensemble une introduction idiomatique à la parole rapportée. « Répondit » en restitue naturellement la valeur sans la lourdeur de « répondit et dit ».
- source_word: ἑκατόνταρχος
  choice: centurion
  rationale: Terme français précis et bien établi pour un officier commandant traditionnellement une centaine de soldats.
- source_word: Κύριε
  choice: Seigneur
  rationale: Conserve la valeur habituelle de κύριος et sa possible portée christologique, tout en convenant à une adresse respectueuse à Jésus.
- source_word: ἱκανός
  choice: digne
  rationale: Dans cette construction, le mot exprime le fait de ne pas se juger digne de recevoir Jésus, plutôt qu’une simple incapacité pratique.
- source_word: ὑπὸ τὴν στέγην
  choice: sous mon toit
  rationale: Conserve l’image concrète du grec dans une expression française naturelle.
- source_word: εἰπὲ λόγῳ
  choice: dis seulement un mot
  rationale: Formulation française naturelle qui garde l’idée qu’une seule parole de Jésus suffit. La nuance plus idiomatique d’un ordre est signalée en note.
- source_word: ἰαθήσεται
  choice: sera guéri
  rationale: Rend directement le futur passif de ἰάομαι dans ce récit de guérison.
- source_word: παῖς
  choice: serviteur
  rationale: Le contexte social du centurion et le récit parallèle favorisent « serviteur », sans supprimer l’ambiguïté lexicale, indiquée en note.
theological_decisions:
- issue: Sens de κύριος dans l’adresse à Jésus
  choice: Seigneur
  alternative: Monsieur ; maître
  rationale: « Seigneur » préserve à la fois le respect exprimé dans la scène et l’éventuelle résonance christologique, sans décider jusqu’où le centurion comprend l’identité de Jésus.
- issue: Identification du παῖς
  choice: serviteur
  alternative: garçon ; enfant
  rationale: « Serviteur » convient le mieux au contexte, mais le grec peut aussi désigner un garçon ou un enfant ; la note maintient cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au singulier et évite d’introduire dans le texte une distinction française de politesse absente du grec. L’image « sous mon toit » est conservée.
