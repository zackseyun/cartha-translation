  variant: modern international French
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης προσήνεγκαν αὐτῷ δαιμονιζομένους πολλούς· καὶ ἐξέβαλεν τὰ πνεύματα λόγῳ, καὶ πάντας τοὺς κακῶς ἔχοντας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/016.yaml
  text: When evening came[a], they brought to him many who were demon-possessed; and he cast out the spirits with a word, and healed all who were sick.
translation:
  language: fr
  text: Le soir venu, on lui amena beaucoup de personnes possédées par des démons[a]. Il chassa les esprits d’une parole et guérit tous les malades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous l’emprise de démons ». Le participe grec désigne des personnes soumises à une influence démoniaque ; « possédées par des démons » est une traduction conventionnelle et concise.
    reason: Alternative lexicale préservant l’étendue sémantique du participe grec.
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Quand le soir fut venu
  rationale: Le génitif absolu marque le moment de l’action. Cette formulation est naturelle et digne en français, tout en conservant explicitement l’arrivée du soir.
- source_word: προσήνεγκαν αὐτῷ
  choice: on lui amena
  rationale: Le sujet n’étant pas exprimé en grec, « on » évite d’introduire un groupe précis. « Amener » convient à des personnes conduites auprès de Jésus.
- source_word: δαιμονιζομένους πολλούς
  choice: beaucoup de personnes possédées par des démons
  rationale: Cette formulation conventionnelle exprime clairement l’affliction démoniaque décrite par le participe, sans la réduire à une catégorie psychologique moderne. La note signale une traduction moins interprétative de la nature exacte de cette emprise.
- source_word: ἐξέβαλεν τὰ πνεύματα
  choice: Il chassa les esprits
  rationale: « Chasser » rend naturellement ἐκβάλλω dans un contexte d’exorcisme, tandis que « les esprits » conserve directement l’objet grec sans ajouter « mauvais », que le contexte laisse comprendre.
- source_word: λόγῳ
  choice: par une parole
  rationale: Le datif a une valeur instrumentale. « Par une parole » souligne l’autorité immédiate de Jésus sans ajouter le possessif « sa », absent du grec.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: tous les malades
  rationale: L’expression idiomatique signifie les personnes qui vont mal physiquement, donc les malades. La formulation française est claire et concise.
- source_word: ἐθεράπευσεν
  choice: guérit
  rationale: Dans les récits évangéliques, θεραπεύω désigne couramment l’action de guérir. « Guérit » garde la force narrative et le sens concret du verbe.
theological_decisions:
- issue: Nature de δαιμονιζομένους et de τὰ πνεύματα
  choice: 'Conserver les catégories du récit : des personnes possédées par des démons et des esprits chassés'
  alternative: Des personnes sous l’emprise de démons ; ou une interprétation en termes de maladie mentale
  rationale: Le verset distingue l’expulsion des esprits de la guérison des malades. La traduction respecte cette distinction et ne la remplace pas par une explication psychologique moderne, tout en signalant dans une note que le participe grec ne définit pas avec précision le degré de domination démoniaque.
- issue: Valeur de λόγῳ
  choice: par une parole
  alternative: par sa parole ; en parlant
  rationale: La traduction instrumentale préserve l’accent narratif sur l’autorité de la parole de Jésus sans ajouter un possessif ni développer une formulation doctrinale absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste fluide pour la lecture publique. Le vocabulaire traditionnel de l’exorcisme est conservé là où il reflète les catégories explicites du texte, avec une note pour éviter de donner au terme « possédées » une précision supérieure à celle du grec.
