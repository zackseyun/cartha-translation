id: MAT.8.2
reference: Matthew 8:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ λεπρὸς ⸀προσελθὼν προσεκύνει αὐτῷ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/002.yaml
  text: And behold[a], a leper came and bowed down before him, saying, “Lord, if you are willing, you are able to cleanse me.”
translation:
  language: fr
  text: 'Et voici qu’un homme atteint de lèpre s’approcha et se prosterna devant lui[a], en disant : « Seigneur, si tu le veux, tu peux me purifier. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui rendit hommage » ou « l’adora » ; le verbe grec peut désigner une prosternation révérencieuse, un hommage ou l’adoration, selon le contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction du marqueur qui attire l’attention et donne de la vivacité au récit, dans un français actuel et naturel.
- source_word: λεπρὸς
  choice: un homme atteint de lèpre
  rationale: L’adjectif substantivé désigne une personne souffrant d’une affection cutanée traditionnellement appelée lèpre. Cette formulation reste fidèle sans réduire la personne à sa maladie.
- source_word: προσελθὼν
  choice: s’approcha
  rationale: Le participe exprime un mouvement vers Jésus ; « s’approcha » rend clairement cette orientation.
- source_word: προσεκύνει
  choice: se prosterna devant lui
  rationale: Le verbe peut désigner une prosternation respectueuse, un hommage ou l’adoration. La formulation retenue exprime le geste visible sans trancher à elle seule toute sa portée théologique.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » préserve à la fois l’adresse respectueuse, la reconnaissance d’autorité et l’éventuelle portée christologique du titre.
- source_word: ἐὰν θέλῃς
  choice: si tu le veux
  rationale: Formulation française naturelle qui conserve la condition portant sur la volonté de Jésus.
- source_word: δύνασαί
  choice: tu peux
  rationale: Rend directement la capacité ou la puissance affirmée par l’homme, avec une expression idiomatique en français moderne.
- source_word: καθαρίσαι
  choice: me purifier
  rationale: Le verbe évoque non seulement la guérison physique, mais aussi la purification liée au statut rituel de la personne atteinte de lèpre.
theological_decisions:
- issue: Sens de προσκυνέω à l’égard de Jésus
  choice: se prosterna devant lui
  alternative: l’adora ; lui rendit hommage
  rationale: Le contexte indique clairement une attitude corporelle de profonde révérence, mais le verbe peut aller de l’hommage à l’adoration. Le texte principal conserve cette ouverture sémantique, et la note signale les autres lectures possibles.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici que » maintient la vivacité narrative ; « homme atteint de lèpre » privilégie une désignation respectueuse de la personne ; « se prosterna » conserve l’ambiguïté théologique du geste.
