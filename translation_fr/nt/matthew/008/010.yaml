id: MAT.8.10
reference: Matthew 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς ἐθαύμασεν καὶ εἶπεν τοῖς ἀκολουθοῦσιν· Ἀμὴν λέγω ὑμῖν, ⸂παρ’ οὐδενὶ τοσαύτην πίστιν ἐν τῷ Ἰσραὴλ⸃ εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/010.yaml
  text: When Jesus heard this[a], he marveled and said to those following him, “Truly I tell you[b], with no one in Israel have I found such faith.”
translation:
  language: fr
  text: 'En entendant cela, Jésus s’étonna et dit à ceux qui le suivaient : « Vraiment, je vous le dis, je n’ai trouvé chez personne en Israël une foi aussi grande. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας
  choice: En entendant cela
  rationale: Le participe aoriste indique la circonstance qui provoque la réaction de Jésus. « Cela » explicite naturellement en français la référence aux paroles précédentes du centurion.
- source_word: ἐθαύμασεν
  choice: s’étonna
  rationale: Le verbe exprime l’étonnement ou l’admiration devant ce qui vient d’être entendu. « S’étonna » est naturel, actuel et conserve la force narrative sans ajouter d’explication théologique.
- source_word: τοῖς ἀκολουθοῦσιν
  choice: à ceux qui le suivaient
  rationale: Le participe présent désigne les personnes qui accompagnaient Jésus à ce moment-là, sans nécessairement en faire une catégorie institutionnelle de disciples.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Vraiment, je vous le dis
  rationale: Cette formulation française rend la force solennelle et affirmative de la formule sémitique tout en restant immédiatement compréhensible.
- source_word: παρ’ οὐδενὶ
  choice: chez personne
  rationale: παρά avec le datif exprime ici l’idée de trouver quelque chose chez quelqu’un, c’est-à-dire dans le cas d’une personne. « Chez personne » est idiomatique et précis en français.
- source_word: τοσαύτην πίστιν
  choice: une foi aussi grande
  rationale: τοσαύτην souligne le degré exceptionnel de la foi. Cette formulation rend explicitement cette intensité en français naturel.
- source_word: ἐν τῷ Ἰσραήλ
  choice: en Israël
  rationale: La formulation conserve la portée à la fois collective et située de l’expression grecque, qui renvoie au peuple d’Israël.
- source_word: εὗρον
  choice: je n’ai trouvé
  rationale: Le passé composé est la manière naturelle de présenter en français le constat tiré par Jésus de son expérience jusqu’à ce moment.
theological_decisions:
- issue: Sens de πίστις
  choice: foi
  alternative: confiance
  rationale: Dans ce contexte, le mot désigne la confiance du centurion dans l’autorité de Jésus. « Foi » conserve toutefois le terme biblique général et la portée théologique du grec sans exclure cette nuance de confiance.
- issue: Étonnement de Jésus
  choice: s’étonna
  alternative: fut dans l’admiration
  rationale: Le texte affirme directement la réaction de Jésus. La traduction la conserve sans chercher à la résoudre ou à l’atténuer au moyen d’une précision doctrinale absente du grec.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du grec tout en étant fluide à l’oral comme à l’écrit. Aucun appel de note n’est nécessaire, les variantes de formulation possibles n’affectant pas sensiblement le sens du verset.
