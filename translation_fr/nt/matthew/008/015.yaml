source:
  edition: SBLGNT
  text: καὶ ἥψατο τῆς χειρὸς αὐτῆς, καὶ ἀφῆκεν αὐτὴν ὁ πυρετός, καὶ ἠγέρθη καὶ διηκόνει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/015.yaml
  text: And he touched her hand, and the fever left her, and she got up and began serving him.
translation:
  language: fr
  text: Il toucha sa main, et la fièvre la quitta. Elle se leva et le servait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle se mit à le servir ». L’imparfait grec peut décrire une action en cours; dans ce contexte, il peut aussi suggérer le commencement de cette action.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥψατο
  choice: toucha
  rationale: Le moyen de ἅπτω signifie ici entrer en contact avec, « toucher ». Ce choix est simple et naturel sans renforcer le geste en « saisir ».
- source_word: τῆς χειρὸς αὐτῆς
  choice: sa main
  rationale: χείρ désigne normalement la main. Le génitif régi par ἅπτομαι se rend naturellement en français par un complément d’objet direct.
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: la fièvre la quitta
  rationale: ἀφίημι signifie ici quitter ou partir. La formulation conserve la personnification du grec tout en restant idiomatique.
- source_word: πυρετός
  choice: fièvre
  rationale: Le nom désigne directement la fièvre, sans qu’il soit nécessaire d’expliciter « maladie fébrile ».
- source_word: ἠγέρθη
  choice: elle se leva
  rationale: 'La forme passive de ἐγείρω a ici un sens intransitif courant : elle se remet debout après sa guérison. Cette formulation évite une coloration résurrectionnelle indue.'
- source_word: διηκόνει αὐτῷ
  choice: se mit à le servir
  rationale: διακονέω signifie servir, notamment dans ce cadre domestique. L’imparfait peut être compris comme ingressif ou comme décrivant une action en cours ; la traduction retient naturellement la nuance de commencement tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Risque de surinterprétation théologique de ἠγέρθη
  choice: elle se leva
  alternative: elle fut relevée
  rationale: Bien que ἐγείρω puisse évoquer la résurrection ailleurs, le contexte immédiat décrit simplement son lever après la guérison.
- issue: Valeur de l’imparfait διηκόνει
  choice: se mit à le servir
  alternative: le servait
  rationale: L’imparfait permet une lecture ingressive, mais peut aussi simplement présenter l’action comme en cours. Le texte retient une formulation naturelle et la note préserve l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, courant et digne. La coordination grecque répétée est légèrement allégée par la ponctuation et « alors », sans modifier la succession narrative.
