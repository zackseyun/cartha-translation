    issue: La traduction principale impose une valeur ingressive à διηκόνει.
    rationale: L’imparfait grec peut suggérer le commencement de l’action dans ce contexte, mais il peut aussi la présenter simplement comme en cours. Puisque cette nuance est discutée, le texte principal devrait préserver l’ambiguïté plutôt que choisir « se mit à »; la possibilité ingressive peut être signalée en note.
  - severity: low
    issue: « Alors » n’est pas exprimé dans le grec.
    rationale: Le grec coordonne simplement les événements par καί. La succession est déjà claire sans cet ajout; le supprimer rend plus sobrement la structure narrative.
  revised_text: Il toucha sa main, et la fièvre la quitta. Elle se leva et le servait.[a]
