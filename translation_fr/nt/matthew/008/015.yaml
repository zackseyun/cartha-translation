review_pass:
  verdict: revise
  source_fidelity: 'Le texte grec enchaîne les actions par καί : Jésus touche sa main, la fièvre la quitte, elle se lève, puis διηκόνει αὐτῷ. « Il toucha sa main » et « la fièvre la quitta » rendent fidèlement le sens. En revanche, « se mit à le servir » fixe comme ingressive une valeur possible, mais non certaine, de l’imparfait διηκόνει.'
  naturalness: La formulation proposée est naturelle en français moderne. « Elle le servait » conserve plus directement l’aspect imperfectif grec et reste idiomatique après le récit des actions ponctuelles.
  terminology: « Fièvre », « se leva » et « servir » sont précis, naturels et adaptés au registre narratif. « Se leva » ne surcharge pas ἠγέρθη d’une connotation résurrectionnelle.
  issues:
