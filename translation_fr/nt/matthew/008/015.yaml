    reason: lexical_alternative
  revision_rationale: La révision retire l’adverbe non exprimé « Alors » et rend διηκόνει par l’imparfait français « le servait », qui préserve la valeur aspectuelle non tranchée du grec. La note conserve explicitement la lecture ingressive possible sans l’imposer au texte principal.
