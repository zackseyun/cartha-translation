id: MAT.8.19
reference: Matthew 8:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσελθὼν εἷς γραμματεὺς εἶπεν αὐτῷ· Διδάσκαλε, ἀκολουθήσω σοι ὅπου ἐὰν ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/019.yaml
  text: And one scribe came up and said to him[a], “Teacher, I will follow you wherever you go.”
translation:
  language: fr
  text: 'Un scribe s’approcha et lui dit : « Maître, je te suivrai partout où tu iras[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « partout où tu partiras » ou « partout où tu t’en iras ». Le verbe grec peut désigner plus précisément le fait de partir ou de s’en aller; ici, il peut naturellement se traduire par « aller ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: s’approcha
  rationale: Le participe aoriste exprime le mouvement du scribe vers Jésus avant sa prise de parole. « S’approcha » restitue directement ce mouvement dans un français naturel.
- source_word: εἷς
  choice: un
  rationale: Le numéral introduit ici un individu. En français, « un scribe » conserve naturellement cette individualisation sans suggérer, comme « l’un des scribes », un groupe explicitement mentionné.
- source_word: γραμματεὺς
  choice: scribe
  rationale: « Scribe » est le terme traditionnel et précis pour ce spécialiste juif des Écritures et de la Loi, sans développer dans le texte ce que le grec laisse sous forme de titre.
- source_word: Διδάσκαλε
  choice: Maître
  rationale: Dans l’adresse directe, « Maître » est le rendu français idiomatique de διδάσκαλος au sens d’enseignant reconnu. « Enseignant » serait peu naturel comme titre, et « rabbi » ajouterait une translittération absente du grec.
- source_word: ἀκολουθήσω
  choice: je te suivrai
  rationale: Le futur exprime l’engagement déclaré du scribe. Cette formulation préserve à la fois le sens concret de suivre Jésus et sa portée possible de disciple.
- source_word: ὅπου ἐὰν
  choice: partout où
  rationale: La tournure grecque a une valeur relative indéfinie. « Partout où » exprime naturellement en français l’étendue sans restriction de la déclaration.
- source_word: ἀπέρχῃ
  choice: tu iras
  rationale: Bien que le verbe puisse plus précisément signifier partir ou s’en aller, « aller » convient naturellement ici au déplacement vers toute destination choisie par Jésus; la nuance plus précise est signalée en note.
theological_decisions:
- issue: Rendu de διδάσκαλος comme titre adressé à Jésus
  choice: Maître
  alternative: Enseignant; Rabbi
  rationale: « Maître » est en français le titre d’adresse usuel pour un enseignant reconnu dans ce contexte. Il marque le respect sans imposer à lui seul une affirmation christologique plus forte que celle du grec.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe narrative reste concise. « Scribe » conserve le terme historique, tandis que « Maître » évite le vocatif peu idiomatique « Enseignant ». Le tutoiement correspond à l’usage courant des traductions bibliques françaises dans les dialogues adressés à une seule personne.
