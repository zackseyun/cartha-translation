source:
  edition: SBLGNT
  text: Καὶ ἐμβάντι αὐτῷ ⸀εἰς πλοῖον ἠκολούθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/023.yaml
  text: And when he got into the boat[b][a], his disciples followed him.
translation:
  language: fr
  text: Quand il monta dans un bateau, ses disciples le suivirent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβάντι
  choice: il monta dans
  rationale: Le participe aoriste exprime ici l’action qui précède celle du verbe principal. En français narratif, « il monta dans » rend naturellement l’entrée dans une embarcation; « après qu’il fut monté » serait plus formel et plus lourd.
- source_word: πλοῖον
  choice: la barque
  rationale: Dans le cadre du lac de Galilée, « barque » est le terme français le plus naturel. Bien que le grec n’emploie pas d’article, le contexte narratif permet l’article défini en français; l’indéfini reste possible.
- source_word: ἠκολούθησαν
  choice: suivirent
  rationale: « Suivre » exprime le déplacement concret tout en conservant, sans l’expliciter, la résonance liée à la condition de disciple chez Matthieu.
- source_word: μαθηταὶ
  choice: disciples
  rationale: « Disciples » est le terme français établi qui conserve la dimension relationnelle et formative de μαθηταί.
- source_word: αὐτῷ ... αὐτῷ ... αὐτοῦ
  choice: il / le / ses
  rationale: Les trois pronoms renvoient à Jésus dans le contexte. La syntaxe française demande de rendre le premier par le sujet « il », puis les autres par « le » et « ses ».
theological_decisions:
- issue: Résonance possible de la condition de disciple dans ἀκολουθέω
  choice: Conserver « suivirent » sans paraphrase théologique explicite.
  alternative: « l’accompagnèrent » ou « devinrent ses disciples »
  rationale: Le récit décrit d’abord un déplacement physique, mais le vocabulaire matthéen peut aussi évoquer la relation du disciple à Jésus. « Suivirent » préserve cette tension sans la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Puis » marque sobrement la progression du récit; la coordination grecque est conservée par « et ».
