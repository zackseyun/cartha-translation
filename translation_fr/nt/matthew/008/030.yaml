  text: A large herd of pigs was feeding some distance away from them[a].
translation:
  language: fr
  text: Un grand troupeau de porcs se nourrissait à quelque distance d’eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « loin d’eux ».'
