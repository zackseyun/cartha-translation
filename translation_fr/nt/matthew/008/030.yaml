lexical_decisions:
- source_word: ἦν δὲ
  choice: Un grand troupeau… cherchait
  rationale: ἦν construit avec le participe βοσκομένη forme une périphrase décrivant une action en cours. δέ est un connecteur narratif léger qu’il n’est pas nécessaire de rendre par un mot distinct dans cette phrase française.
- source_word: μακρὰν ἀπ’ αὐτῶν
  choice: à quelque distance d’eux
  rationale: Cette expression indique un éloignement spatial. La formulation française est naturelle et laisse ouverte la possibilité d’un éloignement plus marqué, signalée en note.
- source_word: ἀγέλη
  choice: troupeau
  rationale: « Troupeau » est le terme français courant pour un groupe d’animaux de ce type.
- source_word: χοίρων
  choice: de porcs
  rationale: « Porcs » est précis, actuel et d’un registre digne, sans l’éventuelle nuance péjorative de « cochons ».
- source_word: πολλῶν
  choice: grand
  rationale: Avec le nom collectif « troupeau », « un grand troupeau » rend naturellement l’idée de nombreux porcs.
- source_word: βοσκομένη
  choice: cherchait sa nourriture
  rationale: Le participe moyen décrit les animaux occupés à se nourrir. Pour des porcs, « cherchait sa nourriture » est plus naturel et plus précis que « paissait », généralement associé aux herbivores.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la description d’une action en cours sans ajouter de marqueur temporel explicite.
