id: MAT.8.22
reference: Matthew 8:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀λέγει αὐτῷ· Ἀκολούθει μοι, καὶ ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/022.yaml
  text: But Jesus says to him[a], “Follow me, and leave the dead to bury their own dead.”
translation:
  language: fr
  text: 'Mais Jésus lui dit : « Suis-moi, et laisse les morts ensevelir leurs propres morts[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le premier emploi de « morts » est souvent compris au sens figuré : les personnes spirituellement insensibles peuvent ensevelir les morts au sens physique.'
    reason: Signaler une interprétation métaphorique fréquente sans résoudre, dans le texte principal, l’ambiguïté voulue de la parole.
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque ici un léger contraste avec la demande précédente et introduit la réponse corrective de Jésus sans durcir excessivement l’opposition.
- source_word: λέγει
  choice: dit
  rationale: Le présent grec est un présent historique. En français narratif courant, « dit » rend naturellement l’action dans son contexte passé, sans perte substantielle de vivacité.
- source_word: Ἀκολούθει μοι
  choice: Suis-moi
  rationale: Impératif direct exprimant à la fois le fait de marcher à la suite de Jésus et l’engagement du disciple.
- source_word: ἄφες
  choice: laisse
  rationale: Exprime directement le renoncement à prendre en charge cette obligation; « laisse » conserve aussi la construction concise et percutante de la parole.
- source_word: νεκρούς ... νεκρούς
  choice: les morts ... leurs propres morts
  rationale: La répétition du même terme est conservée afin de préserver le jeu de mots, l’ambiguïté et la tension théologique du grec.
- source_word: θάψαι
  choice: ensevelir
  rationale: Rend clairement l’action funéraire et convient au registre digne du passage; l’infinitif français suit naturellement « laisse ».
- source_word: τοὺς ἑαυτῶν νεκρούς
  choice: leurs propres morts
  rationale: « propres » restitue la valeur réflexive et emphatique de ἑαυτῶν.
theological_decisions:
- issue: Sens du premier emploi de « morts »
  choice: Le texte principal conserve « les morts » sans ajouter « spirituellement ».
  alternative: 'Expliciter : « ceux qui sont morts spirituellement » ou « les morts spirituels ».'
  rationale: Le grec emploie exactement le même mot dans les deux occurrences. L’explicitation éliminerait le jeu de mots provocateur et imposerait dans le texte une interprétation qui doit plutôt être signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise et frappante. « Ensevelir » est choisi plutôt que « enterrer » pour son adéquation au contexte funéraire et au registre biblique actuel, sans archaïsme marqué.
