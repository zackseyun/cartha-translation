id: MAT.8.12
reference: Matthew 8:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ υἱοὶ τῆς βασιλείας ἐκβληθήσονται εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/012.yaml
  text: But the sons of the kingdom will be cast out into the outer darkness[c][b][a]. There will be weeping and gnashing of teeth there.
translation:
  language: fr
  text: Mais les fils du royaume seront jetés dans les ténèbres du dehors[a]. Là, il y aura des pleurs et des grincements de dents.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement « les fils du royaume » : expression désignant ceux que l’on considérait comme les héritiers légitimes ou les membres attendus du royaume.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ τῆς βασιλείας
  choice: les fils du royaume
  rationale: 'Cette traduction formellement proche conserve l’expression sémitique et son ironie : ceux que l’on tenait pour les héritiers ou membres attendus du royaume en sont exclus. Une note explicite la portée idiomatique.'
- source_word: ἐκβληθήσονται
  choice: seront jetés
  rationale: Le futur passif d’ἐκβάλλω exprime une expulsion énergique. « Seront jetés » est naturel, digne et plus vigoureux que « seront mis dehors ».
- source_word: τὸ σκότος τὸ ἐξώτερον
  choice: les ténèbres du dehors
  rationale: Cette formulation française établie préserve l’image spatiale de ténèbres situées à l’extérieur, sans la remplacer par une interprétation doctrinale.
- source_word: κλαυθμός
  choice: pleurs
  rationale: « Pleurs » rend sobrement la lamentation sans en accentuer indûment l’intensité.
- source_word: βρυγμὸς τῶν ὀδόντων
  choice: grincements de dents
  rationale: Expression française consacrée et fidèle à la construction grecque.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec les nombreux venus de l’est et de l’ouest mentionnés au verset précédent.
- source_word: ἐκεῖ
  choice: Là
  rationale: Placé en tête de la seconde phrase, « Là » reproduit l’accent initial du grec sur le lieu de cette scène de jugement.
theological_decisions:
- issue: Imagerie de l’exclusion et du jugement
  choice: Conserver les images concrètes de l’expulsion, des ténèbres du dehors, des pleurs et des grincements de dents.
  alternative: Les expliciter par « enfer » ou « châtiment éternel ».
  rationale: Le verset décrit une exclusion eschatologique sévère, mais il le fait par ces images précises. Les conserver évite d’introduire une systématisation qui dépasse sa formulation.
- issue: Portée de υἱοὶ dans l’expression υἱοὶ τῆς βασιλείας
  choice: les fils du royaume
  alternative: les enfants du royaume ; les héritiers du royaume
  rationale: « Fils » respecte la forme masculine du grec et conserve l’idiome. La note en éclaire le sens représentatif sans effacer l’expression source.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste concise et l’imagerie traditionnelle est conservée sans archaïsme excessif.
