id: MAT.8.4
reference: Matthew 8:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ὅρα μηδενὶ εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ, καὶ προσένεγκον τὸ δῶρον ὃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/004.yaml
  text: And Jesus said to him[a], “See that you tell no one, but go, show yourself to the priest, and offer the gift that Moses commanded[b], as a testimony to them.”
translation:
  language: fr
  text: 'Jésus lui dit : « Ne dis rien à personne. Mais va te montrer au prêtre et présente l’offrande que Moïse a prescrite[b], afin que ce soit un témoignage pour eux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en témoignage pour eux ». Il peut s’agir d’une preuve présentée aux prêtres ; certains comprennent aussi cette expression comme un témoignage implicite contre ceux qui refuseraient de croire.
    reason: alternative_reading
  - marker: b
    text: Cette consigne renvoie à la procédure prescrite par la loi de Moïse pour une personne purifiée d’une maladie de peau ; voir Lévitique 14.
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μηδενὶ εἴπῃς
  choice: Veille à ne le dire à personne
  rationale: L’impératif Ὅρα introduit ici une consigne ferme, suivie d’une défense au subjonctif. Cette formulation française en restitue naturellement la force sans l’alourdir.
- source_word: ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: va te montrer au prêtre
  rationale: La formulation conserve le mouvement et la construction réfléchie du grec, ainsi que l’allusion à l’examen sacerdotal prévu par la Loi.
- source_word: προσένεγκον τὸ δῶρον
  choice: présente l’offrande
  rationale: Dans ce contexte cultuel, « offrande » exprime clairement le sens de δῶρον, tandis que « présente » rend l’acte rituel sans suggérer plus précisément que le texte la nature du sacrifice.
- source_word: ὃ προσέταξεν Μωϋσῆς
  choice: que Moïse a prescrite
  rationale: « Prescrire » rend naturellement l’idée d’un ordre normatif dans le cadre d’une procédure rituelle mosaïque.
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: pour que cela leur serve de témoignage
  rationale: Cette tournure exprime la visée indiquée par εἰς et conserve le caractère ouvert de μαρτύριον ainsi que le référent non précisé de αὐτοῖς.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel d’un récit français suivi.
theological_decisions:
- issue: Référent et portée de εἰς μαρτύριον αὐτοῖς
  choice: pour que cela leur serve de témoignage
  alternative: comme preuve pour les prêtres ; en témoignage contre eux
  rationale: Le grec ne précise ni le groupe désigné par « leur », ni si le témoignage est favorable, probatoire ou accusateur. La traduction maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le discours reste direct et ferme. « Maladie de peau » dans la note évite d’identifier automatiquement le terme biblique traditionnel à la lèpre moderne.
