id: MAT.8.24
reference: Matthew 8:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ σεισμὸς μέγας ἐγένετο ἐν τῇ θαλάσσῃ, ὥστε τὸ πλοῖον καλύπτεσθαι ὑπὸ τῶν κυμάτων, αὐτὸς δὲ ἐκάθευδεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/024.yaml
  text: And behold[a], a great storm arose on the sea, so that the boat was being swamped by the waves[b]; but he was sleeping.
translation:
  language: fr
  text: Et voici qu’une violente tempête se leva sur la mer[a], si bien que les vagues recouvraient la barque[b] ; mais lui dormait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « tempête » signifie littéralement « secousse » ou « bouleversement » et désigne souvent un tremblement de terre ; ici, le contexte maritime indique une violente agitation de la mer.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « la barque était recouverte par les vagues ».'
    reason: formal_equivalent
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction vive de ce marqueur discursif, qui attire l’attention sur un événement soudain, dans une tournure française naturelle et digne.
- source_word: σεισμὸς μέγας
  choice: une violente tempête
  rationale: σεισμός désigne littéralement une forte secousse ou agitation et souvent un tremblement de terre ; dans ce contexte maritime dominé par les vagues et la barque, « violente tempête » exprime clairement le phénomène visé.
- source_word: ἐγένετο ἐν τῇ θαλάσσῃ
  choice: se leva sur la mer
  rationale: « Se lever » convient naturellement à l’apparition d’une tempête, tandis que « sur la mer » respecte le terme θάλασσα sans le remplacer par « lac ».
- source_word: ὥστε
  choice: si bien que
  rationale: Introduit clairement le résultat produit par la violence de la tempête.
- source_word: τὸ πλοῖον
  choice: la barque
  rationale: Dans le cadre du lac de Galilée, « barque » désigne naturellement cette embarcation sans suggérer un grand navire.
- source_word: καλύπτεσθαι ὑπὸ τῶν κυμάτων
  choice: les vagues recouvraient la barque
  rationale: 'La formulation active est naturelle en français et garde l’idée d’une action en cours : les vagues couvraient progressivement l’embarcation.'
- source_word: αὐτὸς δὲ ἐκάθευδεν
  choice: mais lui dormait
  rationale: « Mais lui » rend le contraste marqué entre le tumulte environnant et Jésus, tandis que l’imparfait traduit l’action continue de ἐκάθευδεν.
theological_decisions:
- issue: Nature du phénomène désigné par σεισμός
  choice: Traduire contextuellement par « violente tempête »
  alternative: « grande secousse », « violent bouleversement » ou, plus littéralement dans d’autres contextes, « grand tremblement de terre »
  rationale: Il s’agit d’une décision lexicale et contextuelle, non doctrinale. Les vagues qui recouvrent la barque montrent qu’il est ici question d’un violent bouleversement de la mer ; « tremblement de terre » créerait en français une image terrestre que le passage n’impose pas.
translation_notes:
  register: Français international moderne, clair et digne. « Voici que » maintient la vivacité narrative sans archaïsme excessif. « Mais lui dormait » préserve le contraste emphatique du grec.
