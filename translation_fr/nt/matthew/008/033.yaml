source:
  edition: SBLGNT
  text: οἱ δὲ βόσκοντες ἔφυγον, καὶ ἀπελθόντες εἰς τὴν πόλιν ἀπήγγειλαν πάντα καὶ τὰ τῶν δαιμονιζομένων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/033.yaml
  text: Then the herdsmen fled[a], and going away into the city, they reported everything, including what had happened to the demon-possessed men.
translation:
  language: fr
  text: Les gardiens du troupeau s’enfuirent et se rendirent dans la ville, où ils racontèrent tout, y compris ce qui concernait les hommes sous l’emprise de démons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « et les choses concernant ceux qui étaient sous l’emprise de démons ».'
    reason: La note conserve la construction grecque elliptique, tandis que le texte principal l’exprime en français naturel et fournit « les hommes » d’après le contexte.
lexical_decisions:
- source_word: οἱ δὲ βόσκοντες
  choice: Les gardiens du troupeau
  rationale: Le participe désigne ceux qui faisaient paître les porcs. « Les gardiens du troupeau » exprime naturellement leur fonction en français, tandis que δέ assure ici une simple progression narrative, rendue sans connecteur explicite.
- source_word: ἔφυγον
  choice: s’enfuirent
  rationale: Le verbe φεύγω indique une fuite; « s’enfuirent » en donne un équivalent direct et vivant.
- source_word: ἀπελθόντες εἰς τὴν πόλιν
  choice: Ils se rendirent à la ville
  rationale: Le participe aoriste décrit l’action préalable au récit fait en ville. Deux propositions successives sont plus naturelles en français qu’une construction participiale lourde.
- source_word: ἀπήγγειλαν πάντα
  choice: racontèrent tout
  rationale: ἀπαγγέλλω signifie rapporter ou annoncer. Dans ce récit, « racontèrent tout » est courant, clair et conserve la portée globale de πάντα.
- source_word: καὶ τὰ τῶν δαιμονιζομένων
  choice: notamment ce qui concernait les hommes sous l’emprise de démons
  rationale: La tournure grecque signifie littéralement « et les choses concernant ceux qui étaient sous l’action de démons ». « Notamment » explicite la valeur additive du second καί après πάντα sans présenter ces faits comme extérieurs à « tout ». « Les hommes » est fourni par le contexte immédiat, où Matthieu en mentionne deux.
- source_word: δαιμονιζομένων
  choice: sous l’emprise de démons
  rationale: Cette formulation exprime une réelle domination démoniaque tout en évitant de préciser davantage que le verbe grec la nature exacte de cette emprise.
theological_decisions:
- issue: Rendre δαιμονιζομένων sans atténuer la réalité de l’affliction démoniaque ni imposer une définition doctrinale plus précise que le texte
  choice: les hommes sous l’emprise de démons
  alternative: les hommes possédés par des démons
  rationale: « Sous l’emprise de démons » affirme clairement l’action et la domination démoniaques décrites dans le récit, tout en préservant l’étendue sémantique du verbe grec et en évitant d’importer des distinctions systématiques absentes du verset.
translation_notes:
  register: Français international moderne, narratif et digne. Les phrases brèves maintiennent le rythme du récit. « Gardiens du troupeau » et « racontèrent » sont accessibles sans être familiers; la formulation finale préserve l’ambiguïté lexicale du grec.
