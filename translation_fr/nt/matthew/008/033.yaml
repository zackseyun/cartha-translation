    rationale: Le grec coordonne explicitement la fuite et le départ vers la ville. Deux phrases autonomes atténuent ce lien; « à la ville » est en outre moins idiomatique en français international que « dans la ville » dans ce contexte.
  - severity: low
    issue: Valeur de notamment
    rationale: Après πάντα (« tout »), καὶ τὰ τῶν δαιμονιζομένων introduit les faits concernant les hommes affectés. « Y compris » conserve plus directement cette relation inclusive.
  - severity: low
    issue: Ponctuation de la note
    rationale: La ponctuation française dans la citation doit être normalisée; il ne faut pas d’espace avant le point placé après le guillemet fermant.
