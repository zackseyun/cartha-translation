id: MAT.8.34
reference: Matthew 8:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πᾶσα ἡ πόλις ἐξῆλθεν εἰς ⸀ὑπάντησιν τῷ Ἰησοῦ, καὶ ἰδόντες αὐτὸν παρεκάλεσαν ὅπως μεταβῇ ἀπὸ τῶν ὁρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/034.yaml
  text: And behold[a], the whole city went out to meet Jesus, and when they saw him, they begged him to depart from their region.
translation:
  language: fr
  text: Et voici que toute la ville sortit à la rencontre de Jésus. Quand les habitants le virent, ils le supplièrent de quitter leur territoire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur région » ; plus littéralement, « leurs frontières » ou « leurs limites ».
    reason: Signale l’étendue sémantique de ὅρια, qui peut désigner les limites elles-mêmes ou le territoire qu’elles délimitent.
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction de marqueur discursif qui attire l’attention et donne de la vivacité au récit, dans un français naturel et digne.
- source_word: πᾶσα ἡ πόλις
  choice: toute la ville
  rationale: 'Préserve la métonymie grecque : la ville désigne collectivement sa population, sans nécessairement affirmer que chaque individu était présent.'
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Rend directement l’aoriste de ἐξέρχομαι et le mouvement depuis la ville.
- source_word: εἰς ὑπάντησιν τῷ Ἰησοῦ
  choice: à la rencontre de Jésus
  rationale: Expression française idiomatique qui restitue le but du déplacement.
- source_word: ἰδόντες αὐτὸν
  choice: Quand les habitants le virent
  rationale: Rend le participe aoriste par une proposition temporelle. « Les habitants » explicite naturellement le référent pluriel implicite de la métonymie « toute la ville ».
- source_word: παρεκάλεσαν
  choice: ils le supplièrent
  rationale: Exprime une demande pressante, plus forte qu’une simple requête, sans préciser le motif.
- source_word: ὅπως μεταβῇ
  choice: de quitter
  rationale: Rend avec concision le contenu de leur supplication et l’idée de passer hors du lieu où il se trouve.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: leur territoire
  rationale: Dans ce contexte, le pluriel ὅρια désigne l’étendue territoriale délimitée plutôt que les seules lignes frontalières.
theological_decisions:
- issue: Motif de la demande des habitants
  choice: Le texte indique seulement qu’ils supplient Jésus de quitter leur territoire.
  alternative: Préciser qu’ils agissent par peur de sa puissance, par colère à cause de la perte des porcs ou sous l’effet d’un trouble général.
  rationale: Le grec ne donne pas explicitement leur motif ; la traduction préserve donc l’ambiguïté narrative et théologique.
translation_notes:
  register: Français international moderne, narratif et digne. « Voici que » maintient la vivacité de ἰδού sans recourir à l’archaïque « voici ». Le passage de « toute la ville » à « les habitants » clarifie en français l’accord sémantique entre le collectif singulier grec et le participe pluriel.
