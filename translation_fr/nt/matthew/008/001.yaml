base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/001.yaml
  text: When he came down from the mountain[a], large crowds followed him.
translation:
  language: fr
  text: Lorsqu’il descendit de la montagne, de grandes foules le suivirent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταβάντος δὲ αὐτοῦ
  choice: Quand il fut descendu
  rationale: Le génitif absolu avec participe aoriste exprime ici une circonstance temporelle antérieure au verbe principal. « Quand il fut descendu » restitue naturellement la succession narrative; δέ assure une transition légère qui n’exige pas nécessairement un « et » distinct en français.
- source_word: ἀπὸ τοῦ ὄρους
  choice: de la montagne
  rationale: ὄρος peut désigner une montagne ou une hauteur. « La montagne » reprend avec naturel le cadre du discours précédent et conserve l’article défini grec.
- source_word: ἠκολούθησαν αὐτῷ
  choice: le suivirent
  rationale: ἀκολουθέω avec le datif signifie ici suivre quelqu’un. Le passé simple convient au registre narratif biblique moderne et marque l’événement qui suit la descente.
- source_word: ὄχλοι πολλοί
  choice: de grandes foules
  rationale: Cette formulation française naturelle conserve le pluriel de ὄχλοι et rend πολλοί comme une indication de l’importance numérique des foules.
