id: MAT.8.26
reference: Matthew 8:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Τί δειλοί ἐστε, ὀλιγόπιστοι; τότε ἐγερθεὶς ἐπετίμησεν τοῖς ἀνέμοις καὶ τῇ θαλάσσῃ, καὶ ἐγένετο γαλήνη μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/026.yaml
  text: And he said to them, “Why are you fearful, you of little faith?” Then, having risen, he rebuked the winds and the sea, and there was a great calm.
translation:
  language: fr
  text: 'Il leur dit : « Pourquoi avez-vous peur, vous qui avez peu de foi ? » Alors il se leva, réprimanda les vents et la mer, et un grand calme s’établit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δειλοί
  choice: si craintifs
  rationale: Le terme désigne des personnes dominées par la peur, avec une nuance de manque de courage. « Craintifs » conserve cette nuance mieux que le simple « effrayés » ; « si » rend naturellement l’interrogation française sans ajouter un degré absent du contexte.
- source_word: ὀλιγόπιστοι
  choice: gens de peu de foi
  rationale: Cette adresse rend l’idée de foi insuffisante ou faible sans transformer le mot en jugement sur une absence totale de foi.
- source_word: ἐγερθεὶς
  choice: il se leva
  rationale: Le participe aoriste indique ici l’action préalable de se lever ; une proposition conjuguée est plus naturelle en français.
- source_word: ἐπετίμησεν
  choice: parla sévèrement à
  rationale: Le verbe signifie réprimander ou adresser un ordre sévère. Avec les vents et la mer comme destinataires, cette formulation reste naturelle tout en conservant la personnification du récit.
- source_word: γαλήνη μεγάλη
  choice: un grand calme
  rationale: Traduction directe qui préserve l’intensité de l’adjectif μεγάλη et contraste avec la tempête.
theological_decisions:
- issue: Lien entre la peur des disciples et leur foi
  choice: Conserver l’adresse « gens de peu de foi » sans l’expliquer.
  alternative: Paraphraser par « vous manquez de foi » ou « vous n’avez pas assez de foi ».
  rationale: Le grec qualifie les disciples sans préciser exactement la nature ou la mesure de leur déficience ; la traduction préserve cette tension.
- issue: Autorité de Jésus sur les éléments
  choice: Maintenir les vents et la mer comme destinataires directs de la parole sévère.
  alternative: Paraphraser en disant qu’il ordonna simplement au vent et à la mer de se calmer.
  rationale: La formulation grecque met en relief son autorité par le verbe ἐπιτιμάω et la personnification des éléments, sans donner ici le contenu exact de l’ordre.
translation_notes:
  register: Français international moderne, clair et digne. Le discours direct est naturel, tandis que « gens de peu de foi » garde la force et la concision de l’adresse grecque.
