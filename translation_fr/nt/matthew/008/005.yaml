  yaml_path: translation/nt/matthew/008/005.yaml
  text: When he entered Capernaum[a], a centurion came to him, pleading with him[b],
translation:
  language: fr
  text: 'Quand Jésus entra dans Capharnaüm, un centurion s’approcha de lui et le supplia :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσελθόντος δὲ αὐτοῦ
  choice: Quand Jésus entra
  rationale: Le génitif absolu avec participe aoriste est rendu par une proposition temporelle naturelle. Le nom « Jésus », fourni par le contexte, clarifie le référent du pronom sans modifier le sens.
- source_word: εἰς Καφαρναοὺμ
  choice: dans Capharnaüm
  rationale: « Capharnaüm » est la forme française traditionnelle et courante du nom de lieu; avec « entra », la préposition « dans » restitue naturellement εἰς.
- source_word: προσῆλθεν αὐτῷ
  choice: s’approcha de lui
  rationale: προσέρχομαι indique ici le mouvement vers Jésus. « S’approcha de lui » est précis, idiomatique et évite la formulation plus vague « vint à lui ».
- source_word: ἑκατόνταρχος
  choice: un centurion
  rationale: « Centurion » est le terme français établi pour cet officier commandant traditionnellement une centurie; il conserve la précision du titre militaire grec.
- source_word: παρακαλῶν αὐτὸν
  choice: et le supplia
  rationale: Dans ce contexte de requête urgente, παρακαλέω signifie adresser une demande pressante. La coordination rend naturellement en français le participe de manière ou d’action concomitante, et les deux-points annoncent les paroles du verset suivant.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit biblique écrit sans être archaïque. « Supplia » exprime l’insistance de la demande sans ajouter de contenu confessionnel.
