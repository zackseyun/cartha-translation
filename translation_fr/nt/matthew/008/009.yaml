id: MAT.8.9
reference: Matthew 8:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ⸀ἐξουσίαν, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/009.yaml
  text: For I also am a man under authority[a], having soldiers under me. And I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: fr
  text: 'Car moi aussi, je suis un homme placé sous une autorité, et j’ai des soldats sous mes ordres. Je dis à l’un : « Va ! » et il va ; à un autre : « Viens ! » et il vient ; et à mon serviteur[a] : « Fais ceci ! » et il le fait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « esclave » (grec : doulos).'
    reason: Alternative lexicale qui préserve la gamme de sens et le statut social potentiellement exprimé par δοῦλος.
lexical_decisions:
- source_word: καὶ γὰρ
  choice: Car
  rationale: Introduit l’explication donnée par le centurion et conserve naturellement la valeur justificative de γάρ en français.
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: moi aussi, je suis un homme
  rationale: L’expression « moi aussi » rend l’emphase du pronom explicite et la portée analogique de καὶ, tandis que « un homme » convient au locuteur masculin et reste naturel.
- source_word: ὑπὸ ἐξουσίαν
  choice: placé sous une autorité
  rationale: Exprime clairement la subordination dans une chaîne de commandement sans préciser abusivement l’identité du supérieur.
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: j’ai des soldats sous mes ordres
  rationale: Formulation française idiomatique qui conserve le contraste entre l’autorité à laquelle le centurion est soumis et celle qu’il exerce.
- source_word: λέγω τούτῳ … καὶ ἄλλῳ
  choice: Je dis à l’un … à un autre
  rationale: Rend naturellement la répartition entre deux subordonnés sans le tour peu idiomatique « à celui-ci » dans ce contexte.
- source_word: Πορεύθητι / Ἔρχου / Ποίησον τοῦτο
  choice: Va ! / Viens ! / Fais ceci !
  rationale: Impératifs directs et simples qui reproduisent le rythme des ordres grecs.
- source_word: δοῦλος
  choice: serviteur
  rationale: Dans cet exemple centré sur l’exercice de l’autorité, « serviteur » est lisible et approprié ; « esclave », qui explicite davantage le statut social possible, est signalé en note.
theological_decisions:
- issue: Rapport entre l’autorité reçue par le centurion et l’autorité de Jésus
  choice: Conserver l’analogie sans l’expliciter
  alternative: Ajouter que Jésus agit lui aussi dans une chaîne d’autorité
  rationale: Le verset laisse au lecteur le soin de saisir l’analogie. La traduction ne doit pas décider ici si l’accent porte surtout sur l’autorité déléguée, l’autorité exercée ou les deux.
- issue: Sens social de δοῦλος
  choice: serviteur dans le texte, avec « esclave » en note
  alternative: esclave dans le texte principal
  rationale: Les deux valeurs sont lexicalement possibles selon le contexte. Le choix principal favorise une lecture française naturelle, tandis que la note préserve la réalité sociale potentiellement plus forte du terme grec.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du mouvement argumentatif grec, tout en employant les expressions idiomatiques « sous une autorité » et « sous mes ordres ». Les impératifs et leurs accomplissements conservent le parallélisme net de l’original.
