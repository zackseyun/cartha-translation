source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς τῷ ἑκατοντάρχῃ· Ὕπαγε, ⸀ὡς ἐπίστευσας γενηθήτω σοι· καὶ ἰάθη ὁ ⸀παῖς ἐν τῇ ὥρᾳ ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/013.yaml
  text: And Jesus said to the centurion[a], “Go; as you have believed, let it be done for you.” And the servant was healed in that hour.
translation:
  language: fr
  text: 'Et Jésus dit au centurion : « Va ! Qu’il te soit fait comme tu as cru. » Et son serviteur[a] fut guéri à cette heure-là.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « garçon » ou « enfant » ; le grec παῖς peut désigner un serviteur ou une personne jeune. Dans ce contexte, « serviteur » convient le mieux pour parler du subordonné du centurion.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑκατοντάρχῃ
  choice: centurion
  rationale: Terme français précis et courant dans le contexte des Évangiles pour cet officier romain.
- source_word: Ὕπαγε
  choice: Va !
  rationale: Impératif bref et direct qui rend naturellement l’ordre de partir.
- source_word: ὡς ἐπίστευσας
  choice: comme tu as cru
  rationale: Conserve la construction verbale personnelle et l’aoriste, sans la transformer en l’expression nominale plus interprétative « selon ta foi ».
- source_word: γενηθήτω σοι
  choice: Qu’il t’arrive
  rationale: Rend naturellement en français l’impératif passif à valeur jussive de γίνομαι et son orientation vers le centurion.
- source_word: παῖς
  choice: serviteur
  rationale: Le contexte militaire et l’emploi de δοῦλος dans le passage favorisent le sens de subordonné ou serviteur, tout en laissant subsister l’ambiguïté lexicale signalée en note.
- source_word: ἰάθη
  choice: fut guéri
  rationale: Rend directement le passif de ἰάομαι et convient au registre narratif digne.
- source_word: ἐν τῇ ὥρᾳ ἐκείνῃ
  choice: à cette heure-là
  rationale: Préserve l’expression temporelle grecque sans la préciser excessivement comme un instant exact.
theological_decisions:
- issue: Rendu du langage de πιστεύω
  choice: tu as cru
  alternative: tu as eu foi / tu as fait confiance
  rationale: Le verbe « croire » conserve la forme verbale du grec et son lien personnel avec le centurion, sans imposer une reformulation doctrinale.
- issue: Rapport entre la foi du centurion et l’accomplissement demandé
  choice: Qu’il t’arrive comme tu as cru
  alternative: Qu’il te soit fait selon ta foi
  rationale: Cette formulation maintient le lien comparatif exprimé par ὡς sans expliciter davantage la nature de ce rapport ni faire de la foi une quantité ou une cause mécanique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit biblique écrit ; le discours direct demeure bref et énergique. La tournure « à cette heure-là » conserve l’expression source et son possible effet d’immédiateté sans la convertir en « à l’instant même ».
