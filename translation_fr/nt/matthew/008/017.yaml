id: MAT.8.17
reference: Matthew 8:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπως πληρωθῇ τὸ ῥηθὲν διὰ Ἠσαΐου τοῦ προφήτου λέγοντος· Αὐτὸς τὰς ἀσθενείας ἡμῶν ἔλαβεν καὶ τὰς νόσους ἐβάστασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/017.yaml
  text: 'so that what was spoken through Isaiah the prophet might be fulfilled[b][a], saying: “He himself took our sicknesses and carried our diseases.”'
translation:
  language: fr
  text: 'afin que s’accomplisse ce qui avait été dit par l’intermédiaire du prophète Ésaïe : « C’est lui qui a pris nos infirmités[a] et qui a porté[b] nos maladies. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « faiblesses » ou « maladies ». Le mot grec peut désigner des faiblesses, des infirmités ou des affections physiques.
    reason: lexical_alternative
  - marker: b
    text: Ou « supporté ». Le verbe grec signifie porter ou supporter et fait écho à Ésaïe 53.4.
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπως πληρωθῇ
  choice: afin que s’accomplisse
  rationale: Rend naturellement la construction de but ou de résultat avec le subjonctif, tout en conservant le thème matthéen de l’accomplissement.
- source_word: τὸ ῥηθὲν
  choice: ce qui avait été dit
  rationale: Tour idiomatique français pour le participe substantivé; le plus-que-parfait situe clairement la parole prophétique avant son accomplissement.
- source_word: διὰ Ἠσαΐου τοῦ προφήτου
  choice: par l’intermédiaire du prophète Ésaïe
  rationale: 'Préserve la valeur instrumentale de διά avec le génitif: la parole a été communiquée au moyen du prophète.'
- source_word: λέγοντος
  choice: ':'
  rationale: En français, les deux-points introduisent plus naturellement la citation directe qu’un participe calqué comme « disant ».
- source_word: Αὐτὸς
  choice: C’est lui qui
  rationale: Restitue l’emphase portée par le pronom grec sans produire une formulation française raide.
- source_word: ἀσθενείας
  choice: faiblesses
  rationale: Conserve l’étendue sémantique du terme grec, qui peut désigner des faiblesses, des infirmités ou des maladies, tout en laissant le contexte de guérison orienter sa compréhension.
- source_word: ἔλαβεν
  choice: a pris
  rationale: Rendu direct de λαμβάνω, sans ajouter « sur lui » ou « enlevé », idées que le verbe seul n’explicite pas.
- source_word: νόσους
  choice: maladies
  rationale: Terme français précis et naturel pour les affections physiques désignées par νόσος.
- source_word: ἐβάστασεν
  choice: a porté
  rationale: Reproduit le sens concret de porter ou supporter et maintient l’écho possible d’Ésaïe 53 sans en imposer une interprétation particulière.
theological_decisions:
- issue: Portée de la citation d’Ésaïe 53.4 dans le contexte des guérisons
  choice: Employer « faiblesses » et « maladies », avec les verbes distincts « pris » et « porté ».
  alternative: Employer « infirmités » et « maladies », ou « s’est chargé de nos maladies ».
  rationale: Le contexte immédiat concerne les guérisons physiques, mais ἀσθένεια possède une portée plus large que la seule maladie. Le texte conserve donc cette amplitude et l’image du portage, sans réduire le verset à une formulation doctrinale particulière ni effacer sa résonance avec Ésaïe 53.
translation_notes:
  register: Français international moderne, digne et accessible. « Par l’intermédiaire de » explicite naturellement l’agence prophétique; les deux-points évitent le calque peu idiomatique « disant ». L’emphase de Αὐτός est rendue par « C’est lui qui ».
