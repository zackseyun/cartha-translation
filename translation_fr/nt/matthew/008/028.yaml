id: MAT.8.28
reference: Matthew 8:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ πέραν εἰς τὴν χώραν τῶν ⸀Γαδαρηνῶν ὑπήντησαν αὐτῷ δύο δαιμονιζόμενοι ἐκ τῶν μνημείων ἐξερχόμενοι, χαλεποὶ λίαν ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/028.yaml
  text: And when he came to the other side[a], into the region of the Gadarenes, two demon-possessed men met him, coming out of the tombs[c][b], so extremely fierce that no one was able to pass along that road.
translation:
  language: fr
  text: Quand il fut arrivé sur l’autre rive, dans la région des Gadaréniens[a], deux hommes sous l’emprise de démons vinrent à sa rencontre. Ils sortaient des tombeaux et étaient si redoutables que personne ne pouvait passer par ce chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « Géraséniens » ou « Gergéséniens » au lieu de « Gadaréniens ».
    reason: textual_variant
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: Quand il fut arrivé
  rationale: Le génitif absolu exprime ici la circonstance temporelle; cette tournure française naturelle conserve l’antériorité de l’arrivée.
- source_word: τὸ πέραν
  choice: l’autre rive
  rationale: Dans le contexte de la traversée du lac, « rive » explicite naturellement le sens contextuel de « l’autre côté » sans ajout interprétatif important.
- source_word: χώραν τῶν Γαδαρηνῶν
  choice: la région des Gadaréniens
  rationale: χώρα désigne une région ou un territoire; « région » est courant et Γαδαρηνῶν est suivi selon le texte grec retenu.
- source_word: δύο δαιμονιζόμενοι
  choice: deux hommes sous l’emprise de démons
  rationale: Cette formulation rend la domination démoniaque indiquée par le participe, dans un français clair, sans imposer une théorie technique sur la nature exacte de cette emprise.
- source_word: ἐκ τῶν μνημείων ἐξερχόμενοι
  choice: Ils sortaient des tombeaux
  rationale: La proposition autonome évite l’empilement de participes et rend clairement leur provenance; « tombeaux » correspond au contexte funéraire.
- source_word: χαλεποὶ λίαν
  choice: si redoutables
  rationale: χαλεπός peut évoquer des êtres dangereux, farouches ou violents; « redoutables » préserve cette amplitude, tandis que « si » s’articule naturellement avec la conséquence introduite par ὥστε.
- source_word: ὥστε μὴ ἰσχύειν τινὰ παρελθεῖν διὰ τῆς ὁδοῦ ἐκείνης
  choice: que personne ne pouvait passer par ce chemin
  rationale: La construction exprime le résultat; ἰσχύω indique ici la capacité, et διά avec ὁδός désigne l’itinéraire emprunté.
theological_decisions:
- issue: Expression de l’affliction démoniaque
  choice: sous l’emprise de démons
  alternative: possédés par des démons
  rationale: Le choix affirme l’action réelle de démons telle que la présente le texte, tout en évitant que le mot français « possédés » suggère à lui seul une définition doctrinale plus précise que δαιμονίζομαι.
- issue: Variante textuelle du nom de lieu
  choice: Gadaréniens
  alternative: Géraséniens ou Gergéséniens
  rationale: Le texte principal suit Γαδαρηνῶν dans le SBLGNT; les autres formes manuscrites importantes sont signalées en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été allégée en deux phrases afin d’éviter une longue chaîne participiale, sans modifier les rapports logiques du grec.
