source:
  edition: SBLGNT
  text: Καὶ ἐλθὼν ὁ Ἰησοῦς εἰς τὴν οἰκίαν Πέτρου εἶδεν τὴν πενθερὰν αὐτοῦ βεβλημένην καὶ πυρέσσουσαν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/014.yaml
  text: And when Jesus came into Peter’s house[b][a], he saw his mother-in-law lying down and having a fever.
translation:
  language: fr
  text: Jésus entra dans la maison de Pierre. Il vit la belle-mère de Pierre, couchée et fiévreuse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: se rendit ensuite
  rationale: Le participe aoriste marque ici la progression du récit. Cette formulation française naturelle rend le déplacement et l’enchaînement temporel sans calquer la syntaxe grecque.
- source_word: οἰκίαν Πέτρου
  choice: dans la maison de Pierre
  rationale: Le génitif exprime simplement l’appartenance. « Maison » reste proche de οἰκία et convient au registre narratif.
- source_word: πενθερὰν αὐτοῦ
  choice: la belle-mère de Pierre
  rationale: πενθερά désigne précisément la belle-mère. La répétition de « Pierre » lève en français toute ambiguïté possible sur le référent de αὐτοῦ.
- source_word: βεβλημένην
  choice: couchée
  rationale: Le participe parfait passif décrit l’état dans lequel elle se trouvait. « Couchée » est idiomatique et n’ajoute pas explicitement un lit, absent du grec.
- source_word: πυρέσσουσαν
  choice: avec de la fièvre
  rationale: Cette expression française courante rend directement l’état fébrile continu exprimé par le participe présent, sans amplifier la souffrance.
theological_decisions:
- issue: Référent de αὐτοῦ dans πενθερὰν αὐτοῦ
  choice: La femme est présentée explicitement comme la belle-mère de Pierre.
  alternative: Employer « sa belle-mère », grammaticalement possible mais susceptible d’être momentanément rapporté à Jésus en français.
  rationale: La syntaxe et le contexte rattachent αὐτοῦ à Pierre. Répéter son nom clarifie le référent sans tirer de conclusion doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, simple et digne. La phrase grecque unique est répartie en deux phrases pour éviter une accumulation lourde et clarifier le référent du possessif. Aucun élément contextuel comme « au lit » n’est ajouté.
