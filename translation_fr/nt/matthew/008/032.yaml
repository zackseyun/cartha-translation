revisions:
- from: 'Il leur dit : « Allez ! » Ils sortirent alors et entrèrent dans les porcs. Et voici que tout le troupeau se précipita le long de l’escarpement[a] dans la mer, et ils moururent dans les eaux[b].'
  to: 'Il leur dit : « Allez ! » Ils sortirent alors et entrèrent dans les porcs. Et voici que tout le troupeau dévala l’escarpement jusque dans la mer, et les porcs moururent dans les eaux[b].'
  rationale: La révision explicite la descente de l’escarpement, élément porté par la construction grecque, tout en conservant le caractère collectif de la ruée. Elle maintient la formulation non interprétative concernant la mort des porcs. La note a est conservée mais son alternative est ajustée afin de ne pas reproduire exactement le verbe principal et de refléter la portée topographique du grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:42:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend avec justesse l’impératif bref, la sortie puis l’entrée dans les porcs, la mise en relief de ἰδού, « mer » pour θάλασσα, et « moururent dans les eaux » sans imposer « se noyèrent ». Une correction est souhaitable pour κατὰ τοῦ κρημνοῦ : « le long de l’escarpement » ne marque pas clairement le mouvement descendant exprimé dans le grec et peut évoquer un déplacement latéral.'
  naturalness: Le français est moderne, narratif et naturel. « Dévala l’escarpement jusque dans la mer » exprime plus idiomatiquement la descente rapide de l’ensemble du troupeau. La reprise explicite « les porcs » avant « moururent » évite une référence pronominale moins nette après le singulier collectif « tout le troupeau ».
  terminology: « Porcs », « troupeau », « escarpement », « mer » et « eaux » conviennent au registre et aux termes source. La note conserve l’alternative légitime entre pente raide, escarpement et précipice, sans trancher indûment la topographie.
  issues:
  - severity: medium
    issue: Direction descendante de κατὰ τοῦ κρημνοῦ insuffisamment explicite
    rationale: « Le long de l’escarpement » peut décrire un déplacement parallèle à celui-ci. Dans ce contexte, κατά avec le génitif décrit la course vers le bas de la pente ou de l’escarpement. « Dévala l’escarpement jusque dans la mer » rend cette direction sans exiger une falaise verticale.
  - severity: low
    issue: Référent de « ils moururent » après le collectif singulier « tout le troupeau »
    rationale: Le pluriel est fidèle au grec et peut renvoyer aux porcs, mais la reprise nominale rend le français plus immédiat et ne change pas le sens.
  revised_text: 'Il leur dit : « Allez ! » Ils sortirent alors et entrèrent dans les porcs. Et voici que tout le troupeau dévala l’escarpement jusque dans la mer, et les porcs moururent dans les eaux[b].'
  revised_footnotes:
  - marker: a
    text: Ou « se précipita le long de la pente abrupte ». Le terme grec peut désigner une pente raide, un escarpement ou un précipice.
    reason: lexical_alternative
  - marker: b
    text: Ou « se noyèrent ». Le grec dit plus littéralement « moururent dans les eaux ».
    reason: alternative_reading
  revision_rationale: La révision explicite la descente de l’escarpement, élément porté par la construction grecque, tout en conservant le caractère collectif de la ruée. Elle maintient la formulation non interprétative concernant la mort des porcs. La note a est conservée mais son alternative est ajustée afin de ne pas reproduire exactement le verbe principal et de refléter la portée topographique du grec.
