  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑπάγετε. οἱ δὲ ἐξελθόντες ἀπῆλθον εἰς ⸂τοὺς χοίρους⸃· καὶ ἰδοὺ ὥρμησεν πᾶσα ἡ ⸀ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, καὶ ἀπέθανον ἐν τοῖς ὕδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/032.yaml
  text: And he said to them[a], “Go.” Then they came out and went into the pigs; and behold[c][b], the whole herd rushed down the steep bank into the sea and died in the waters.
translation:
  language: fr
  text: 'Il leur dit : « Allez ! » Ils sortirent alors et entrèrent dans les porcs. Et voici que tout le troupeau dévala l’escarpement jusque dans la mer, et les porcs moururent dans les eaux[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Ou « se noyèrent ». Le grec dit plus littéralement « moururent dans les eaux ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑπάγετε
  choice: Allez !
  rationale: Cet impératif bref et naturel conserve la concision et la force de l’ordre de Jésus, sans lui ajouter la nuance plus marquée de « Partez ! ».
- source_word: ἐξελθόντες
  choice: Ils sortirent alors
  rationale: Le participe indique que les démons sortent des hommes possédés. Une proposition conjuguée convient au récit français; « alors » exprime l’enchaînement sans modifier le contenu.
- source_word: ἀπῆλθον εἰς τοὺς χοίρους
  choice: entrèrent dans les porcs
  rationale: Dans ce contexte, le mouvement vers les animaux aboutit à leur entrée en eux. Cette formulation est naturelle en français et n’ajoute aucune explication sur la nature de la possession.
- source_word: χοίρους
  choice: porcs
  rationale: « Porcs » est un équivalent français actuel, clair et digne. « Cochons » serait également compréhensible, mais d’un registre légèrement plus familier.
- source_word: ἰδοὺ
  choice: Et voici que
  rationale: Cette tournure française maintient la fonction de mise en relief et la vivacité narrative du marqueur grec.
- source_word: πᾶσα ἡ ἀγέλη
  choice: tout le troupeau
  rationale: La formulation rend naturellement le nom collectif et la totalité exprimée par πᾶσα.
- source_word: ὥρμησεν
  choice: se précipita
  rationale: Le verbe exprime un mouvement soudain et impétueux. « Se précipita » en restitue la force sans préciser indûment la cause du mouvement.
- source_word: κατὰ τοῦ κρημνοῦ
  choice: le long de l’escarpement
  rationale: « Escarpement » désigne un terrain à forte pente sans imposer l’image d’une paroi strictement verticale; « le long de » rend ici le mouvement descendant suggéré par κατά dans le contexte.
- source_word: θάλασσαν
  choice: mer
  rationale: Le grec dit explicitement « mer ». Ce choix respecte la désignation du texte sans la remplacer par l’explication géographique « lac ».
- source_word: ἀπέθανον ἐν τοῖς ὕδασιν
  choice: ils moururent dans les eaux
  rationale: Cette traduction suit de près l’énoncé grec, qui parle de mourir dans les eaux. Le pluriel « ils » reprend les porcs et reflète le passage du nom collectif singulier au verbe grec pluriel.
theological_decisions:
- issue: Degré de précision dans la description de la mort des porcs
  choice: moururent dans les eaux
  alternative: se noyèrent
  rationale: Le récit implique fortement une noyade, mais le grec emploie simplement le verbe « mourir ». La formulation retenue préserve ce que le texte affirme sans transformer l’inférence contextuelle en affirmation explicite.
translation_notes:
  register: Français international moderne, narratif et digne. La ponctuation donne à l’ordre de Jésus sa brièveté énergique. « Et voici que » conserve la mise en relief du grec; « porcs » évite le registre plus familier de « cochons ». Le texte garde « mer » et l’expression littérale « moururent dans les eaux » afin de rester proche de la formulation source.
