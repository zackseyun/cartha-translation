id: MAT.8.7
reference: Matthew 8:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει ⸀αὐτῷ· Ἐγὼ ἐλθὼν θεραπεύσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/007.yaml
  text: And he says to him[a], “I will come and heal him.”
translation:
  language: fr
  text: 'Et il lui dit[a] : « Je viendrai le guérir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Dois-je venir le guérir ? » Certains comprennent les paroles de Jésus comme une question en raison du contexte, mais la formulation grecque se lit naturellement comme une déclaration.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction narrative simple, sans ajout d’une valeur temporelle ou déductive absente du grec.
- source_word: λέγει
  choice: il dit
  rationale: Le présent historique grec est conservé, usage naturel dans une narration française vive.
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif désignant le destinataire de la parole se rend naturellement par le pronom indirect « lui ».
- source_word: Ἐγὼ
  choice: Je
  rationale: Le pronom explicite peut avoir une légère valeur emphatique, mais le simple « je » la laisse suffisamment percevoir sans la surcharger.
- source_word: ἐλθὼν
  choice: viendrai
  rationale: Le participe aoriste associé au futur exprime ici une action préalable ou concomitante; en français naturel, la venue est intégrée au premier verbe coordonné.
- source_word: θεραπεύσω
  choice: guérir
  rationale: Dans ce contexte de maladie, « guérir » rend directement et naturellement θεραπεύω.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom masculin renvoie au serviteur malade et se rend idiomatiquement par le pronom objet « le ».
theological_decisions:
- issue: Faut-il rendre les paroles de Jésus comme une déclaration ou comme une question ?
  choice: 'Déclaration : « Je viendrai le guérir. »'
  alternative: 'Question : « Dois-je venir le guérir ? » ou « Est-ce que je viendrai le guérir ? »'
  rationale: Le grec ne comporte aucune particule interrogative et se lit naturellement comme une déclaration. La lecture interrogative est possible d’après le contexte selon certains interprètes; elle est donc signalée en note plutôt qu’introduite dans le texte principal.
translation_notes:
  register: Français moderne, international et digne. Le présent historique « il dit » préserve la vivacité du récit; « Je viendrai le guérir » est fluide tout en maintenant l’ordre logique de la venue puis de la guérison.
