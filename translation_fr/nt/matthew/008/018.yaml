source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ Ἰησοῦς ⸂πολλοὺς ὄχλους⸃ περὶ αὐτὸν ἐκέλευσεν ἀπελθεῖν εἰς τὸ πέραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/018.yaml
  text: When Jesus saw many crowds around him, he gave orders to go to the other side.
translation:
  language: fr
  text: Voyant les foules nombreuses autour de lui, Jésus ordonna de passer sur l’autre rive.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὺς ὄχλους
  choice: les foules nombreuses
  rationale: Conserve le pluriel inhabituel « foules » ainsi que l’idée de grand nombre, sans le réduire à une seule foule.
- source_word: ἐκέλευσεν
  choice: ordonna
  rationale: Rend directement la force du verbe, qui exprime un ordre plutôt qu’une simple suggestion.
- source_word: ἀπελθεῖν εἰς τὸ πέραν
  choice: de passer sur l’autre rive
  rationale: Expression française naturelle dans le contexte d’une traversée du lac; « l’autre rive » rend l’expression substantivée τὸ πέραν.
theological_decisions:
- issue: Sujet implicite de l’infinitif ἀπελθεῖν
  choice: Ne pas préciser explicitement à qui Jésus donne l’ordre ni qui doit passer.
  alternative: « ordonna à ses disciples de passer » ou « leur ordonna de passer »
  rationale: Le grec ne nomme pas le destinataire dans ce verset. La formulation française maintient cette sous-détermination au lieu d’importer le contexte du verset suivant.
translation_notes:
  register: Français moderne, sobre et digne. La proposition participiale grecque est rendue naturellement par « Voyant… ». Le connecteur δέ n’est pas traduit par un adverbe temporel artificiel; l’enchaînement narratif suffit.
