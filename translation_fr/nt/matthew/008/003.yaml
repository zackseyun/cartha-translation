source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο ⸀αὐτοῦ λέγων· Θέλω, καθαρίσθητι· καὶ εὐθέως ἐκαθαρίσθη αὐτοῦ ἡ λέπρα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/008/003.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing[c][b]; be cleansed.” And immediately his leprosy was cleansed.
translation:
  language: fr
  text: 'Jésus tendit la main, le toucha et dit : « Je le veux : sois purifié ! » Aussitôt, il fut purifié de sa lèpre[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « lèpre » peut désigner diverses affections de la peau et ne correspond pas nécessairement à la maladie de Hansen.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: tendit la main
  rationale: Cette formulation française naturelle conserve le geste concret exprimé par le participe aoriste, présenté comme une action précédant immédiatement le toucher.
- source_word: ἥψατο αὐτοῦ
  choice: le toucha
  rationale: Le moyen ἅπτομαι suivi du génitif signifie ici simplement « toucher » ; le pronom reprend sans ambiguïté l’homme atteint.
- source_word: Θέλω
  choice: Je le veux
  rationale: La réponse reprend directement la question de la volonté formulée au verset précédent. « Je le veux » exprime clairement le consentement de Jésus sans introduire une valeur de futur.
- source_word: καθαρίσθητι
  choice: sois purifié
  rationale: Le passif impératif est conservé. « Purifié » maintient à la fois la dimension physique et celle de pureté, que le seul verbe « guérir » atténuerait.
- source_word: εὐθέως
  choice: Aussitôt
  rationale: « Aussitôt » rend avec naturel l’immédiateté fortement exprimée par εὐθέως.
- source_word: ἐκαθαρίσθη
  choice: fut purifié
  rationale: La répétition de « purifié » fait écho à l’ordre précédent et préserve le vocabulaire de la purification plutôt que de le réduire à une simple guérison.
- source_word: αὐτοῦ ἡ λέπρα
  choice: de sa lèpre
  rationale: La tournure « il fut purifié de sa lèpre » est idiomatique en français. Elle conserve la possession exprimée par αὐτοῦ, tout en déplaçant le sujet grammatical pour éviter l’expression peu naturelle « sa lèpre fut purifiée ».
theological_decisions:
- issue: Valeur physique et rituelle de καθαρίζω
  choice: Employer « purifier » dans l’ordre et dans son accomplissement
  alternative: Employer « guérir » ou « rendre pur »
  rationale: Le grec présente la guérison comme une purification. Répéter ce champ lexical respecte la portée physique et cultuelle du récit sans imposer une interprétation confessionnelle.
- issue: Sens de Θέλω dans la réponse de Jésus
  choice: « Je le veux »
  alternative: « Je suis disposé à le faire » ou « Oui, je le veux bien »
  rationale: La formule brève répond précisément à la demande précédente et conserve la force volontaire de Θέλω, sans ajouter une nuance émotionnelle absente du texte.
- issue: Sujet grammatical de la proposition finale
  choice: « il fut purifié de sa lèpre »
  alternative: « sa lèpre fut purifiée »
  rationale: Le grec fait de « sa lèpre » le sujet grammatical, mais cette construction est peu naturelle en français moderne. Le changement syntaxique conserve le sens, la purification et la maladie explicitement nommée.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste concise, suit le mouvement narratif du grec et emploie « purifier » pour préserver la tension entre guérison physique et pureté rituelle.
