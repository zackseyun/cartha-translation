  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς πᾶς ὁ λαὸς εἶπεν· Τὸ αἷμα αὐτοῦ ἐφ’ ἡμᾶς καὶ ἐπὶ τὰ τέκνα ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/025.yaml
  text: And all the people answered[a], “His blood be on us and on our children.”
translation:
  language: fr
  text: 'Et tout le peuple répondit[a] : « Que son sang retombe sur nous et sur nos enfants ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit ici des personnes rassemblées qui prennent la parole dans cette scène ; cette formulation ne doit pas être comprise comme attribuant une culpabilité perpétuelle à tous les Juifs de toutes les générations.
    reason: Note culturelle destinée à prévenir une généralisation antijuive sans modifier la formulation du texte.
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: répondit
  rationale: Le participe aoriste avec εἶπεν forme une tournure idiomatique introduisant une réponse. En français naturel, le verbe simple « répondit » en rend clairement le sens.
- source_word: πᾶς ὁ λαὸς
  choice: tout le peuple
  rationale: La construction désigne collectivement l’ensemble des personnes présentes qui prennent la parole dans la scène. « Tout le peuple » conserve le terme λαός et sa force collective sans le transformer en affirmation transhistorique.
- source_word: Τὸ αἷμα αὐτοῦ
  choice: son sang
  rationale: Cette formulation concise conserve l’image du sang et laisse implicite, comme en grec, l’idée de responsabilité liée à sa mort.
- source_word: ἐφ’ ἡμᾶς
  choice: retombe sur nous
  rationale: La phrase grecque est sans verbe exprimé. « Que … retombe sur nous » restitue naturellement en français la valeur d’acceptation ou d’imprécation de la formule, tout en conservant son image judiciaire.
- source_word: ἐπὶ τὰ τέκνα ἡμῶν
  choice: et sur nos enfants
  rationale: « Enfants » est le sens direct de τέκνα. La préposition répétée est maintenue afin de préserver le parallélisme et l’insistance de la phrase.
theological_decisions:
- issue: Risque d’une lecture antijuive de πᾶς ὁ λαὸς
  choice: Conserver « tout le peuple » en précisant par une note qu’il s’agit des personnes rassemblées dans la scène.
  alternative: « toute la foule » ou une interprétation étendue à tous les Juifs de toutes les générations
  rationale: Le grec rapporte une déclaration collective faite dans la scène immédiate. Il ne faut ni atténuer cette formulation ni lui faire porter une affirmation de culpabilité ethnique perpétuelle que le verset n’énonce pas.
translation_notes:
  register: Français moderne, courant et digne. La tournure « Que son sang retombe sur nous » est idiomatique et conserve la solennité ainsi que la portée judiciaire de l’énoncé grec.
