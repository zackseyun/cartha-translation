  text: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα· Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ, πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/019.yaml
  text: While he was sitting on the judgment seat[a], his wife sent word to him, saying, “Have nothing to do with that righteous man[b], for I have suffered greatly today in a dream because of him.”
translation:
  language: fr
  text: 'Tandis qu’il siégeait au tribunal, sa femme lui envoya ce message : « Ne te mêle pas de l’affaire de cet homme juste[a], car j’ai beaucoup souffert aujourd’hui dans un rêve à cause de lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cet homme innocent ». Dans ce contexte judiciaire, le mot grec traduit par « juste » peut aussi exprimer l’innocence.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθημένου δὲ αὐτοῦ ἐπὶ τοῦ βήματος
  choice: Tandis qu’il siégeait au tribunal
  rationale: Le génitif absolu marque une circonstance simultanée. Dans ce cadre judiciaire, βῆμα désigne le siège ou lieu officiel où le gouverneur rend justice ; « siégeait au tribunal » exprime naturellement en français à la fois la posture et la fonction.
- source_word: ἀπέστειλεν πρὸς αὐτὸν ἡ γυνὴ αὐτοῦ λέγουσα
  choice: sa femme lui fit transmettre ce message
  rationale: La formulation indique qu’elle lui envoie une communication, vraisemblablement par messager. Cette tournure française restitue le sens sans préciser davantage le moyen employé.
- source_word: Μηδὲν σοὶ καὶ τῷ δικαίῳ ἐκείνῳ
  choice: Ne te mêle pas de l’affaire de cet homme juste
  rationale: L’expression elliptique grecque appelle Pilate à ne pas intervenir contre cet homme. « Ne te mêle pas de l’affaire de » convient au contexte judiciaire tout en évitant de donner à l’avertissement un sens artificiellement absolu.
- source_word: τῷ δικαίῳ ἐκείνῳ
  choice: cet homme juste
  rationale: δίκαιος signifie fondamentalement « juste » et peut, dans un procès, évoquer l’innocence. Le texte principal conserve la portée morale du mot, tandis que l’alternative juridique figure en note.
- source_word: πολλὰ γὰρ ἔπαθον σήμερον κατ’ ὄναρ δι’ αὐτόν
  choice: car j’ai beaucoup souffert aujourd’hui dans un rêve à cause de lui
  rationale: πολλὰ ἔπαθον exprime une souffrance intense. Le passé composé convient au français actuel pour une expérience survenue ce jour-là et motivant encore l’avertissement ; κατ’ ὄναρ et δι’ αὐτόν sont rendus directement.
theological_decisions:
- issue: Sens de δίκαιος appliqué à Jésus
  choice: homme juste
  alternative: homme innocent
  rationale: « Juste » préserve la portée morale et narrative de δίκαιος chez Matthieu sans réduire la déclaration à un verdict strictement juridique. « Innocent » demeure toutefois plausible dans le contexte du procès et est signalé en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse conjugale et évite une solennité étrangère à la scène. « Siégeait au tribunal » est plus idiomatique que le calque « était assis sur le siège du jugement ».
