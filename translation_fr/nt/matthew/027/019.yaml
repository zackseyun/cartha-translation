  to: 'Tandis qu’il siégeait au tribunal, sa femme lui envoya ce message : « Ne te mêle pas de l’affaire de cet homme juste[a], car j’ai beaucoup souffert aujourd’hui dans un rêve à cause de lui. »'
  rationale: 'La révision limitée de « lui fit transmettre » en « lui envoya » évite de présenter comme explicite une médiation que le grec ne détaille pas. Le reste du texte est conservé : il est fidèle à la syntaxe et au sens du grec, naturel en français international moderne et correctement nuancé pour δίκαιος.'
