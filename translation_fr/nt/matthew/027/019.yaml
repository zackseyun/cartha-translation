  naturalness: Le français est moderne, clair et d’un registre approprié. « Sa femme lui envoya ce message » est plus direct et idiomatique que « lui fit transmettre ce message », tout en restant non spécifique sur le canal de communication.
  terminology: « Tribunal », « homme juste » et la note proposant « homme innocent » conviennent. « Juste » conserve la portée morale et possiblement judiciaire de δίκαιος sans imposer l’interprétation exclusivement légale d’« innocent ».
