  text: λέγοντες· Κύριε, ἐμνήσθημεν ὅτι ἐκεῖνος ὁ πλάνος εἶπεν ἔτι ζῶν· Μετὰ τρεῖς ἡμέρας ἐγείρομαι·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/063.yaml
  text: saying[a], “Lord, we remember that that deceiver said while he was still alive[b], ‘After three days I rise.’”
translation:
  language: fr
  text: 'en disant : « Seigneur, nous nous souvenons que cet imposteur a dit de son vivant[b] : “Après trois jours, je ressuscite[a].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ressusciterai » ou « je serai ressuscité ». Le grec emploie ici un verbe au présent, de forme moyenne ou passive.
    reason: alternative_reading
  - marker: b
    text: Littéralement « étant encore vivant ».
    reason: literal_rendering
lexical_decisions:
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent rattache directement cette prise de parole au verset précédent ; « en disant » conserve ce lien syntaxique.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif κύριε est ici un titre de respect adressé à Pilate. « Seigneur » conserve la forme lexicale sans attribuer nécessairement une portée divine au titre dans ce contexte.
- source_word: ἐμνήσθημεν
  choice: nous nous sommes souvenus
  rationale: L’aoriste est rendu par un passé composé naturel en français, tout en exprimant un souvenir qui motive la demande présente.
- source_word: ἐκεῖνος ὁ πλάνος
  choice: cet imposteur
  rationale: Le démonstratif garde la mise à distance hostile. « Imposteur » exprime ici une personne accusée de tromper ou d’égarer, dans un français courant et digne.
- source_word: ἔτι ζῶν
  choice: de son vivant
  rationale: Cette formulation française concise indique naturellement que la déclaration a précédé sa mort.
- source_word: Μετὰ τρεῖς ἡμέρας
  choice: Après trois jours
  rationale: μετά suivi de l’accusatif signifie normalement « après ». La traduction évite d’harmoniser cette expression avec « le troisième jour ».
- source_word: ἐγείρομαι
  choice: je me relève
  rationale: Le présent grec de forme moyenne ou passive est conservé par un présent français. Le verbe « se relever » maintient l’image de l’action de relever et une part de l’ambiguïté, sans ajouter explicitement un auxiliaire futur.
theological_decisions:
- issue: Forme de la prédiction de la résurrection citée
  choice: Après trois jours, je me relève
  alternative: Après trois jours, je ressusciterai / je serai ressuscité
  rationale: Le grec emploie un présent de forme moyenne ou passive, ἐγείρομαι. Le texte principal conserve le présent et évite de trancher silencieusement entre une nuance intransitive et passive ; la note donne les formulations futures naturelles qu’autorise le contexte.
translation_notes:
  register: Français international moderne, lisible et digne. « Cet imposteur » restitue l’hostilité des locuteurs ; « de son vivant » évite une tournure pesante. Les guillemets emboîtés distinguent la parole adressée à Pilate de la citation attribuée à Jésus.
