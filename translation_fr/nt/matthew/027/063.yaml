  source_fidelity: Le participe λέγοντες est bien rendu par « en disant », et « Seigneur », « cet imposteur », « de son vivant » et « après trois jours » transmettent correctement le grec et le ton hostile des interlocuteurs. En revanche, « je me relève » tend à décrire le fait ordinaire de se remettre debout et ne rend pas assez explicitement, en français moderne, la prédiction de résurrection portée par ἐγείρομαι dans ce contexte. « Je ressuscite » conserve le présent grec tout en exprimant sans équivoque le sens requis.
  naturalness: La phrase est fluide et d’un registre approprié. « Nous nous sommes souvenus » est grammatical et naturel, mais « nous nous souvenons » est plus idiomatique dans une requête directe où le souvenir est immédiatement pertinent. La citation intérieure avec des guillemets français est bien présentée.
  terminology: « Imposteur » est une bonne restitution contextuelle de ὁ πλάνος. « Seigneur » conserve le titre de respect sans décider de sa portée théologique. « Ressuscite » est préférable à « me relève » pour le lexique de la résurrection, tout en laissant ouverte en note l’interprétation passive de la forme grecque.
