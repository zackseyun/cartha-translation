source:
  edition: SBLGNT
  text: Ἀπὸ δὲ ἕκτης ὥρας σκότος ἐγένετο ἐπὶ πᾶσαν τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/045.yaml
  text: From the sixth hour darkness came over all the land until the ninth hour[a][b].
translation:
  language: fr
  text: À partir de la sixième heure, il y eut des ténèbres sur tout le pays jusqu’à la neuvième heure[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La sixième heure correspond approximativement à midi, et la neuvième, à quinze heures.
    reason: cultural_note
  - marker: b
    text: Ou « toute la terre ». Le mot grec peut désigner soit le pays, soit la terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ
  choice: À partir de
  rationale: Ἀπό indique le point de départ temporel. Le connecteur δέ est léger et n’exige pas ici un « mais » contrastif en français.
- source_word: ἕκτης ὥρας
  choice: la sixième heure
  rationale: Cette formulation conserve le mode antique de compter les heures; son équivalent moderne approximatif est donné en note.
- source_word: σκότος
  choice: les ténèbres
  rationale: Le terme désigne ici l’obscurité. « Les ténèbres » est une expression française naturelle et digne qui préserve la force saisissante du récit.
- source_word: ἐγένετο
  choice: couvrirent
  rationale: Dans ce contexte, le verbe marque la survenue de l’obscurité. Avec « les ténèbres », « couvrirent » donne en français une formulation naturelle sans expliquer la cause du phénomène.
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: tout le pays
  rationale: γῆ peut désigner le pays ou la terre. « Tout le pays » retient la portée géographique immédiate sans exclure l’autre sens, signalé en note.
- source_word: ἕως ὥρας ἐνάτης
  choice: jusqu’à la neuvième heure
  rationale: La formulation conserve l’expression temporelle du texte grec; l’équivalent moderne approximatif figure en note.
theological_decisions:
- issue: Étendue de γῆ dans le récit des ténèbres
  choice: le pays
  alternative: la terre entière
  rationale: Le nom grec γῆ admet les deux sens. Le choix principal reste contextuellement mesuré, tandis que la note conserve explicitement la lecture de portée universelle afin de ne pas trancher une ambiguïté réelle.
translation_notes:
  register: Français international moderne, clair et digne. Le mode antique de compter les heures est conservé dans le texte, avec une explication en note; l’ambiguïté géographique de γῆ est également préservée.
