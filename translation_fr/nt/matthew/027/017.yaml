id: MAT.27.17
reference: Matthew 27:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνηγμένων οὖν αὐτῶν εἶπεν αὐτοῖς ὁ Πιλᾶτος· Τίνα θέλετε ἀπολύσω ὑμῖν, ⸂Ἰησοῦν τὸν⸃ Βαραββᾶν ἢ Ἰησοῦν τὸν λεγόμενον χριστόν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/017.yaml
  text: 'So when they had gathered together[a], Pilate said to them, “Which one do you want me to release to you: Jesus Barabbas[b], or Jesus who is called Messiah?”'
translation:
  language: fr
  text: 'Comme ils étaient donc rassemblés, Pilate leur dit : « Lequel voulez-vous que je vous relâche : Jésus Barabbas[a], ou Jésus, celui qu’on appelle le Messie[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent simplement « Barabbas » au lieu de « Jésus Barabbas ».
    reason: textual_variant
  - marker: b
    text: Ou « le Christ ». Le titre grec est Christos; il est rendu ici par « le Messie » parce qu’il fonctionne comme un titre.
    reason: alternative_reading
lexical_decisions:
- source_word: συνηγμένων
  choice: comme ils étaient rassemblés
  rationale: Le génitif absolu a une valeur temporelle. Cette formulation naturelle exprime l’état du groupe déjà réuni au moment où Pilate prend la parole.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la progression logique et narrative du récit; « donc » en conserve explicitement la force.
- source_word: Τίνα
  choice: lequel
  rationale: L’interrogatif porte sur un choix précis entre les deux hommes nommés.
- source_word: θέλετε
  choice: voulez-vous
  rationale: Dans ce contexte, θέλω exprime le désir ou la préférence; « voulez-vous » est direct et idiomatique.
- source_word: ἀπολύσω
  choice: que je vous relâche
  rationale: Dans ce cadre judiciaire, ἀπολύω signifie remettre un prisonnier en liberté. « Relâcher » préserve cette nuance sans introduire l’idée distincte de grâce ou de pardon.
- source_word: Ἰησοῦν τὸν Βαραββᾶν
  choice: Jésus Barabbas
  rationale: Le texte grec fourni contient Ἰησοῦν. La traduction maintient donc les deux noms et le contraste rhétorique entre deux hommes appelés Jésus.
- source_word: Ἰησοῦν τὸν λεγόμενον χριστόν
  choice: Jésus, celui qu’on appelle le Messie
  rationale: « Celui qu’on appelle » rend λεγόμενον sans la nuance péjorative de « soi-disant ». Ici, χριστός fonctionne comme un titre et est donc traduit par « Messie ».
theological_decisions:
- issue: Traduction de χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans l’expression « celui qu’on appelle χριστός », le terme fonctionne clairement comme un titre. « Messie » en communique le sens tout en préservant la portée christologique du passage.
- issue: Présence de « Jésus » devant Barabbas
  choice: Jésus Barabbas dans le texte principal
  alternative: Barabbas
  rationale: Le texte de la SBLGNT fourni lit Ἰησοῦν τὸν Βαραββᾶν. La variante plus courte est signalée en note plutôt que substituée au texte source.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle; « relâcher » conserve le cadre judiciaire, et « le Messie » traduit le titre plutôt que de le traiter comme un nom propre.
