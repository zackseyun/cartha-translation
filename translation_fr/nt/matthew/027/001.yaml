  source_fidelity: Le texte rend correctement la transition temporelle (Πρωΐας δὲ γενομένης), la participation exhaustive des deux groupes (« tous »), l’orientation hostile de la délibération (« contre Jésus ») et son but létal (« afin de le mettre à mort »). « Tinrent conseil » restitue bien συμβούλιον ἔλαβον sans renforcer indûment le sens en « complotèrent ».
  naturalness: La phrase est fluide, sobre et adaptée au français international moderne. « Le matin venu » et « tinrent conseil » conviennent au registre narratif solennel. En revanche, « chefs des prêtres » est moins idiomatique que la désignation française biblique établie « grands prêtres ».
  terminology: « Grands prêtres » est le terme français usuel pour οἱ ἀρχιερεῖς dans les évangiles. Au pluriel, il désigne la classe des responsables sacerdotaux et ne requiert pas l’idée que plusieurs titulaires du souverain sacerdoce exerçaient simultanément cette fonction. « Anciens du peuple » est approprié.
