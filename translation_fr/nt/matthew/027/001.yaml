id: MAT.27.1
reference: Matthew 27:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πρωΐας δὲ γενομένης συμβούλιον ἔλαβον πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ κατὰ τοῦ Ἰησοῦ ὥστε θανατῶσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/001.yaml
  text: When morning came[b][a], all the chief priests and the elders of the people took counsel against Jesus so as to put him to death.
translation:
  language: fr
  text: Le matin venu[a], tous les grands prêtres et les anciens du peuple tinrent conseil contre Jésus afin de le mettre à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Dès l’aube ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ γενομένης
  choice: Le matin venu
  rationale: Le génitif absolu marque une transition temporelle. Cette formulation française est naturelle et digne; δέ est rendu implicitement par la progression du récit.
- source_word: συμβούλιον ἔλαβον
  choice: tinrent conseil
  rationale: Cette tournure restitue l’idée d’une délibération commune sans préciser indûment qu’une décision formelle aurait alors été prise.
- source_word: πάντες
  choice: tous
  rationale: Le terme souligne que l’ensemble des membres des deux groupes dirigeants mentionnés participa à la délibération.
- source_word: οἱ ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Désignation française claire du groupe dirigeant du sacerdoce à Jérusalem; elle évite de suggérer qu’il y aurait eu plusieurs grands prêtres en fonction simultanément.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: les anciens du peuple
  rationale: Rend directement le titre collectif et son complément au génitif dans une formulation française consacrée et compréhensible.
- source_word: κατὰ τοῦ Ἰησοῦ
  choice: contre Jésus
  rationale: Dans ce contexte hostile, κατά suivi du génitif exprime l’opposition, et non une simple consultation au sujet de Jésus.
- source_word: ὥστε
  choice: afin de
  rationale: Avec l’infinitif, le mot indique ici le but visé ou le résultat recherché; « afin de » exprime clairement cette intention.
- source_word: θανατῶσαι αὐτόν
  choice: le mettre à mort
  rationale: Cette expression correspond au registre judiciaire et solennel du passage, sans ajouter une modalité précise d’exécution.
theological_decisions:
- issue: Nature de l’action des dirigeants contre Jésus
  choice: Présenter leur délibération comme hostile et orientée vers la mise à mort de Jésus.
  alternative: Traduire plus faiblement par « se concertèrent au sujet de Jésus », ou plus fortement par « complotèrent contre Jésus ».
  rationale: Le grec exprime explicitement l’opposition par κατὰ τοῦ Ἰησοῦ et l’intention meurtrière par ὥστε θανατῶσαι αὐτόν. « Tinrent conseil contre Jésus » conserve ces deux éléments sans ajouter la nuance plus particulière d’un complot secret.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du mouvement de la phrase grecque tout en étant naturelle en français; le vocabulaire conserve le cadre officiel et judiciaire de la scène.
