  text: Therefore that field has been called Field of Blood to this day.
translation:
  language: fr
  text: C’est pourquoi ce champ a été appelé « Champ du Sang » jusqu’à aujourd’hui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Exprime clairement et naturellement le lien de conséquence avec l’explication précédente concernant l’achat et le nom du champ.
- source_word: ἐκλήθη
  choice: a été appelé
  rationale: Rend l’aoriste passif de καλέω sans surinterpréter l’aspect; avec « jusqu’à aujourd’hui », la phrase indique que cette appellation est restée en usage.
- source_word: ὁ ἀγρὸς ἐκεῖνος
  choice: ce champ
  rationale: « Champ » est le sens courant de ἀγρός et permet de conserver la répétition avec le nom du lieu; en français narratif, « ce champ » reprend naturellement le terrain déjà mentionné.
- source_word: Ἀγρὸς Αἵματος
  choice: Champ du Sang
  rationale: Conserve la structure génitive et la force narrative du nom donné au lieu. Les majuscules signalent ici un nom propre.
- source_word: αἵματος
  choice: Sang
  rationale: Rend directement le génitif singulier de αἷμα dans le nom du lieu.
- source_word: ἕως τῆς σήμερον
  choice: jusqu’à aujourd’hui
  rationale: Expression française actuelle et transparente indiquant que le nom demeurait en usage au moment où le récit a été rédigé.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve la répétition de « champ » et le lien explicite de conséquence, sans ajouter d’explication absente du grec.
