  text: Καὶ ἐλθόντες εἰς τόπον λεγόμενον Γολγοθᾶ, ὅ ἐστιν ⸂Κρανίου Τόπος λεγόμενος⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/033.yaml
  text: And when they came to a place called Golgotha (which means Place of a Skull),[a]
translation:
  language: fr
  text: Lorsqu’ils arrivèrent à un endroit appelé Golgotha — ce qui signifie « Lieu du Crâne » —,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « qui est appelé Lieu du Crâne ». Le grec donne une explication du nom Golgotha.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες
  choice: lorsqu’ils arrivèrent
  rationale: Le participe aoriste prend naturellement ici une valeur temporelle; cette formulation conserve la progression du récit en français courant.
- source_word: τόπον
  choice: un endroit
  rationale: Le nom τόπος désigne un lieu; « un endroit » rend naturellement la construction grecque sans article.
- source_word: λεγόμενον
  choice: appelé
  rationale: Dans cette tournure, le participe de λέγω indique le nom donné au lieu.
- source_word: Γολγοθᾶ
  choice: Golgotha
  rationale: Le nom propre du lieu est translittéré selon son usage français établi.
- source_word: ὅ ἐστιν
  choice: ce qui signifie
  rationale: La formule introduit une explication du nom Golgotha pour le lecteur; « signifie » en exprime clairement la fonction, tout en signalant en note la formulation plus littérale.
- source_word: Κρανίου Τόπος
  choice: Lieu du Crâne
  rationale: Cette formulation française naturelle et traditionnelle rend la relation génitive entre κρανίου et τόπος sans prétendre préciser pourquoi le lieu portait ce nom.
- source_word: λεγόμενος
  choice: appelé
  rationale: Le grec répète l’idée de désignation; dans la traduction principale, la tournure explicative avec « signifie » évite une répétition peu naturelle, tandis que la note conserve l’alternative formelle.
