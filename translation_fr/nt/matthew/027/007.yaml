id: MAT.27.7
reference: Matthew 27:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συμβούλιον δὲ λαβόντες ἠγόρασαν ἐξ αὐτῶν τὸν Ἀγρὸν τοῦ Κεραμέως εἰς ταφὴν τοῖς ξένοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/007.yaml
  text: So after taking counsel[b][a], they bought the Potter’s Field with them as a burial place for foreigners.
translation:
  language: fr
  text: Après s’être consultés, ils achetèrent avec cet argent le Champ du Potier, pour en faire un lieu de sépulture destiné aux étrangers[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux gens venus d’ailleurs »; le terme grec peut désigner des étrangers ou des personnes qui ne sont pas du lieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβούλιον δὲ λαβόντες
  choice: Après s’être consultés
  rationale: La tournure idiomatique signifie littéralement « ayant pris conseil ». Cette formulation française exprime naturellement une délibération commune et rend le participe antérieur à l’achat; δέ assure ici la continuation du récit sans contraste marqué.
- source_word: ἠγόρασαν
  choice: ils achetèrent
  rationale: L’aoriste narratif de ἀγοράζω désigne simplement l’acte ponctuel d’acheter; le passé simple convient au registre narratif biblique digne et reste clair.
- source_word: ἐξ αὐτῶν
  choice: avec cet argent
  rationale: Le pronom grec neutre pluriel renvoie aux pièces d’argent du contexte précédent. Une reprise littérale par « avec elles » serait possible mais moins naturelle en français; « avec cet argent » explicite sobrement le référent.
- source_word: τὸν Ἀγρὸν τοῦ Κεραμέως
  choice: le Champ du Potier
  rationale: Cette formulation rend naturellement le génitif grec et traite l’expression comme la désignation reconnue d’un lieu dans le récit.
- source_word: εἰς ταφὴν
  choice: pour en faire un lieu de sépulture
  rationale: εἰς avec ταφή indique ici la destination ou l’usage prévu du champ. La formulation française rend cette finalité clairement.
- source_word: τοῖς ξένοις
  choice: destiné aux étrangers
  rationale: ξένοις désigne des personnes étrangères ou venues d’ailleurs. « Étrangers » est précis et actuel, tandis qu’« inconnus » ou « gens de passage » réduiraient ou préciseraient indûment le sens.
theological_decisions:
- issue: Référent de αὐτῶν
  choice: Le pronom renvoie aux pièces d’argent rapportées par Judas, rendu par « avec cet argent ».
  alternative: « avec elles », en reprenant directement les pièces d’argent.
  rationale: Le contexte immédiat identifie clairement le référent. L’explicitation française facilite la compréhension sans ajouter de conclusion théologique.
- issue: Identité des ξένοι
  choice: Conserver la catégorie générale « étrangers ».
  alternative: « gens de passage » ou « non-Juifs ».
  rationale: Le grec ne précise ni que ces personnes ne faisaient que passer ni qu’elles étaient nécessairement non juives; la traduction préserve donc cette ouverture.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple soutient le récit écrit sans archaïsme lexical. La syntaxe clarifie la destination du champ tout en restant proche de la structure et du sens grecs.
