id: MAT.27.66
reference: Matthew 27:66
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ πορευθέντες ἠσφαλίσαντο τὸν τάφον σφραγίσαντες τὸν λίθον μετὰ τῆς κουστωδίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/066.yaml
  text: So they went and secured the tomb by sealing the stone with the guard.
translation:
  language: fr
  text: Ils allèrent donc mettre le tombeau en sûreté en scellant la pierre avec la garde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « en scellant la pierre et en y postant la garde ». L’expression grecque est concise et peut indiquer que la garde accompagnait l’opération plutôt qu’une action distincte.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ πορευθέντες
  choice: Ils allèrent donc
  rationale: Le participe aoriste accompagne naturellement le verbe principal et se rend en français par un verbe conjugué. « Donc » assure la progression du récit sans donner à δέ une valeur fortement adversative.
- source_word: ἠσφαλίσαντο
  choice: mettre … en sûreté
  rationale: Le moyen ἠσφαλίσαντο signifie qu’ils prirent des mesures pour rendre le tombeau sûr. Cette tournure est naturelle et dignifiée en français courant.
- source_word: τὸν τάφον
  choice: le tombeau
  rationale: Dans ce contexte, τάφος désigne le lieu où Jésus a été enseveli. « Tombeau » est clair et usuel dans le récit.
- source_word: σφραγίσαντες
  choice: en scellant
  rationale: Le participe aoriste précise ici le moyen ou l’action concomitante par laquelle le tombeau fut mis en sûreté. « En scellant » conserve cette relation sans l’alourdir.
- source_word: τὸν λίθον
  choice: la pierre
  rationale: Le grec désigne simplement la pierre du tombeau; préciser « de l’entrée » ajouterait une information implicite mais non exprimée.
- source_word: μετὰ τῆς κουστωδίας
  choice: avec la garde
  rationale: κουστωδία est un emprunt latin désignant un détachement de garde, et μετά avec le génitif exprime normalement l’accompagnement. La formulation garde ouverte la nature exacte de la participation de la garde.
theological_decisions:
- issue: Rapport entre μετὰ τῆς κουστωδίας et la mise en sûreté du tombeau
  choice: La pierre est scellée avec la garde présente ou associée à l’action.
  alternative: La pierre est scellée et une garde est postée séparément.
  rationale: Le grec est concis et n’énonce pas explicitement deux actions distinctes. Le texte principal conserve l’accompagnement exprimé par μετά, tandis que la note signale l’autre compréhension possible sans imposer une procédure absente du texte.
translation_notes:
  register: Français international moderne, sobre et narratif. « Mettre en sûreté » évite le caractère parfois technique de « sécuriser », tandis que « la garde » rend le nom collectif sans préciser s’il s’agissait de soldats romains ou d’une autre force.
