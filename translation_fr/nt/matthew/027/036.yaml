  text: καὶ καθήμενοι ἐτήρουν αὐτὸν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/036.yaml
  text: And sitting there[a], they kept watch over him.
translation:
  language: fr
  text: Et, assis là, ils le gardaient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Puis
  rationale: Dans ce récit, le connecteur coordonne l’action tout en faisant avancer la scène; « Puis » est naturel en français sans imposer une relation logique forte.
- source_word: καθήμενοι
  choice: ils s’assirent
  rationale: Le participe de κάθημαι peut décrire la position assise ou l’entrée dans cette position. Une proposition coordonnée rend naturellement en français cette circonstance accompagnant le verbe principal.
- source_word: ἐτήρουν
  choice: montèrent la garde autour de
  rationale: L’imparfait grec présente une surveillance prolongée. L’expression française « monter la garde autour de quelqu’un » convient au contexte des soldats chargés de surveiller Jésus et conserve l’idée de durée.
- source_word: αὐτὸν
  choice: lui
  rationale: Le pronom accusatif renvoie à Jésus; après la locution « autour de », le pronom tonique « lui » est requis en français.
- source_word: ἐκεῖ
  choice: là
  rationale: L’adverbe locatif situe les soldats sur les lieux; sa place après « s’assirent » produit une phrase française fluide.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation reste simple et concrète, tout en rendant l’aspect duratif de l’imparfait grec par l’expression idiomatique « monter la garde ».
