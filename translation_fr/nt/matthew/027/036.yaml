review_pass:
  verdict: revise
  source_fidelity: La proposition coordonnée « Puis ils s’assirent » transforme le participe présent καθήμενοι (« étant assis / assis ») en action ponctuelle et ajoute une succession temporelle plus marquée que le simple καί. Le passé simple « montèrent » ne rend pas l’imparfait ἐτήρουν, qui présente une surveillance en cours.
  naturalness: La phrase est compréhensible et de registre approprié, mais « monter la garde autour de lui » est moins direct et naturel ici que « le gardaient ». La formulation révisée est concise et idiomatique en français moderne.
  terminology: « Garder » rend naturellement τηρέω dans ce contexte de surveillance par les soldats, sans surinterpréter l’action. Le pronom objet direct « le » correspond à αὐτόν. Aucun terme théologique ni nom propre n’est en jeu.
  issues:
  - severity: medium
    issue: « Puis ils s’assirent » rend καθήμενοι comme une action ponctuelle et introduit une progression temporelle.
    rationale: καί est une simple coordination et καθήμενοι est un participe décrivant la position ou la circonstance simultanée, non nécessairement le fait de s’asseoir à ce moment-là.
  - severity: medium
    issue: « montèrent la garde » emploie un passé simple ponctuel.
    rationale: 'ἐτήρουν est à l’imparfait et dépeint une action continue : ils gardaient ou surveillaient Jésus.'
  - severity: low
    issue: « autour de lui » explicite une localisation qui n’est pas exprimée par le complément direct αὐτόν.
    rationale: Le grec dit littéralement qu’ils le gardaient/surveillaient; ἐκεῖ (« là ») situe l’ensemble de la scène.
  revised_text: Et, assis là, ils le gardaient.
