  text: πέποιθεν ἐπὶ τὸν θεόν, ῥυσάσθω ⸀νῦν εἰ θέλει αὐτόν· εἶπεν γὰρ ὅτι Θεοῦ εἰμι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/043.yaml
  text: He has trusted in God[a]; let God rescue him now, if he wants him, for he said[b], ‘I am the Son of God.’
translation:
  language: fr
  text: 'Il a placé sa confiance en Dieu[a] ; que Dieu le délivre maintenant, s’il le veut, car il a dit[b] : « Je suis le Fils de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Il s’est confié en Dieu. »'
    reason: Variante idiomatique pour rendre la confiance placée en Dieu; le texte principal exprime naturellement en français l’état qui résulte de cette confiance.
  - marker: b
    text: Cette raillerie reprend de très près le Psaume 22.9 (22.8 dans certaines numérotations), associant Jésus au juste souffrant de ce psaume. Dans cet écho, « s’il prend plaisir en lui » est aussi possible.
    reason: La note indique l’allusion scripturaire et la nuance possible de θέλει αὐτόν dans l’écho au psaume, sans l’imposer au texte principal.
lexical_decisions:
- source_word: πέποιθεν ἐπὶ τὸν θεόν
  choice: Il a placé sa confiance en Dieu
  rationale: Le parfait exprime une confiance établie qui demeure. Cette tournure française naturelle en conserve la portée résultative sans l’ambiguïté possible de « se confier ».
- source_word: ῥυσάσθω νῦν
  choice: que Dieu le délivre maintenant
  rationale: L’impératif à la troisième personne prend ici la forme française « que… ». « Délivrer » exprime le fait d’arracher au danger, tandis que « maintenant » maintient l’urgence moqueuse. Le sujet implicite est explicité par « Dieu » pour éviter deux pronoms masculins ambigus.
- source_word: εἰ θέλει αὐτόν
  choice: s’il tient à lui
  rationale: La formule rend en français courant l’idée que Dieu veut cet homme, l’approuve ou lui accorde sa faveur. Elle reste compatible avec l’écho au Psaume 22 sans imposer dans le texte principal la formulation plus interprétative « prend plaisir en lui ».
- source_word: εἶπεν γὰρ
  choice: puisqu’il a dit
  rationale: L’aoriste est rendu par le passé composé. « Puisque » introduit naturellement la justification donnée par les moqueurs.
- source_word: Θεοῦ εἰμι υἱός
  choice: Je suis le Fils de Dieu
  rationale: Malgré l’absence d’article en grec, le contexte matthéen donne à l’expression une valeur qualitative et titulaire. « Le Fils de Dieu » restitue cette portée mieux que l’indéfini « un fils de Dieu ».
theological_decisions:
- issue: Portée christologique de Θεοῦ εἰμι υἱός
  choice: Je suis le Fils de Dieu
  alternative: Je suis un fils de Dieu ; je suis Fils de Dieu
  rationale: Dans le récit de Matthieu, les adversaires reprennent une prétention christologique identifiée. L’article français convient au titre contextuel sans ajouter de formulation doctrinale étrangère au verset.
- issue: Nuance de θέλει αὐτόν dans l’écho au Psaume 22
  choice: s’il tient à lui
  alternative: s’il le veut ; s’il prend plaisir en lui
  rationale: « S’il tient à lui » est naturel et conserve la tension entre volonté, attachement et faveur divine. La note signale la nuance plus explicite du psaume sans la substituer silencieusement au grec de Matthieu.
translation_notes:
  register: Français international moderne, digne et directement intelligible. La ponctuation conserve le rythme incisif de la raillerie ; « Dieu » est répété pour clarifier le sujet de « délivre ».
