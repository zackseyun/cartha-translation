source:
  edition: SBLGNT
  text: τότε ἐπληρώθη τὸ ῥηθὲν διὰ Ἰερεμίου τοῦ προφήτου λέγοντος· Καὶ ἔλαβον τὰ τριάκοντα ἀργύρια, τὴν τιμὴν τοῦ τετιμημένου ὃν ἐτιμήσαντο ἀπὸ υἱῶν Ἰσραήλ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/009.yaml
  text: Then what was spoken through Jeremiah the prophet was fulfilled[a], saying, ‘And they took the thirty pieces of silver, the price of the one who had been valued[b], whom they valued from among the sons of Israel,’
translation:
  language: fr
  text: 'Alors s’accomplit ce qui avait été annoncé par l’intermédiaire du prophète Jérémie[a] : « Ils prirent les trente pièces d’argent, le prix de celui qu’on avait estimé, celui qu’ils avaient estimé parmi les fils d’Israël[b], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Matthieu attribue cette parole prophétique à Jérémie. Sa formulation se rapproche surtout de Zacharie 11.12-13. Cette attribution est diversement expliquée : citation composite, renvoi à un recueil prophétique, ou problème survenu dans la transmission du texte.'
    reason: textual_variant
  - marker: b
    text: L’expression grecque est difficile. Littéralement, elle comporte « des fils d’Israël » après « ils avaient estimé ». Elle peut aussi se comprendre comme « celui que certains fils d’Israël avaient estimé » ou « celui qu’ils avaient estimé, provenant des fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la succession narrative en français.
- source_word: ἐπληρώθη τὸ ῥηθὲν
  choice: s’accomplit ce qui avait été annoncé
  rationale: Conserve la formule d’accomplissement propre à Matthieu; « annoncé » convient à une parole prophétique sans alourdir la phrase.
- source_word: διὰ Ἰερεμίου τοῦ προφήτου
  choice: par l’intermédiaire du prophète Jérémie
  rationale: Rend la médiation exprimée par διά avec le génitif et maintient explicitement l’attribution à Jérémie.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: les trente pièces d’argent
  rationale: Expression française claire et traditionnelle pour une somme constituée de pièces en argent.
- source_word: τὴν τιμὴν τοῦ τετιμημένου
  choice: le prix de celui qu’on avait estimé
  rationale: « Prix » préserve le contexte marchand, tandis que « estimé » maintient le lien lexical avec la forme suivante de τιμάω et son possible double sens.
- source_word: ὃν ἐτιμήσαντο
  choice: celui que … avaient estimé
  rationale: Reprend « estimé » afin de reproduire la répétition grecque de τιμάω.
- source_word: ἀπὸ υἱῶν Ἰσραήλ
  choice: des fils d’Israël
  rationale: Préserve la formulation génitive/partitive difficile sans imposer dans le corps du texte une résolution causale certaine.
theological_decisions:
- issue: Attribution à Jérémie alors que la formulation rappelle surtout Zacharie 11.12-13
  choice: Conserver « le prophète Jérémie » dans le texte principal
  alternative: Remplacer Jérémie par Zacharie ou harmoniser implicitement la citation
  rationale: Le texte grec de la SBLGNT nomme explicitement Jérémie; la traduction ne doit ni corriger ni résoudre cette tension ancienne.
- issue: Sens précis de ἀπὸ υἱῶν Ἰσραήλ
  choice: « des fils d’Israël » avec une note signalant l’ambiguïté
  alternative: « parmi les fils d’Israël » ou « par les fils d’Israël »
  rationale: La construction grecque est difficile; une formulation française concise accompagnée d’une note évite de trancher silencieusement entre les lectures partitive et agentive.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition d’« estimé » reflète celle du verbe grec; elle conserve à la fois l’idée d’évaluation monétaire et l’ironie possible du vocabulaire de l’honneur.
