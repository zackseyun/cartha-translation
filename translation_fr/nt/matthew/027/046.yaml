id: MAT.27.46
reference: Matthew 27:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: περὶ δὲ τὴν ἐνάτην ὥραν ⸀ἀνεβόησεν ὁ Ἰησοῦς φωνῇ μεγάλῃ λέγων· ⸂Ἠλὶ ἠλὶ⸃ λεμὰ σαβαχθάνι; τοῦτ’ ἔστιν· Θεέ μου θεέ μου, ἱνατί με ἐγκατέλιπες;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/046.yaml
  text: About the ninth hour Jesus cried out with a loud voice[a], saying, “Eli, Eli, lema sabachthani?” that is, “My God, my God[b], why have you forsaken me?”
translation:
  language: fr
  text: 'Vers la neuvième heure, Jésus cria d’une voix forte : « Éli, Éli, lema sabachthani ? »[a], c’est-à-dire : « Mon Dieu, mon Dieu, pourquoi m’as-tu abandonné[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ces paroles font écho au Psaume 22.1.
    reason: cross_reference
  - marker: b
    text: 'Ou : « pourquoi m’as-tu délaissé ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τὴν ἐνάτην ὥραν
  choice: Vers la neuvième heure
  rationale: περί avec l’accusatif temporel indique l’approximation. « Vers » est naturel en français et δέ reste ici un lien discursif léger qu’il n’est pas nécessaire d’expliciter.
- source_word: ἀνεβόησεν … φωνῇ μεγάλῃ
  choice: cria d’une voix forte
  rationale: Cette formulation conserve à la fois l’intensité du verbe et l’expression concrète de la voix forte, dans un registre digne et courant.
- source_word: λέγων
  choice: ponctuation par deux-points
  rationale: En français, les deux-points introduisent naturellement les paroles et évitent le tour plus lourd « en disant » sans perdre la fonction du participe.
- source_word: Ἠλὶ ἠλὶ λεμὰ σαβαχθάνι
  choice: Éli, Éli, lema sabachthani ?
  rationale: Matthieu conserve les mots sémitiques avant d’en donner le sens. Ils sont donc maintenus et translittérés; les accents sur « Éli » facilitent la lecture française.
- source_word: τοῦτ’ ἔστιν
  choice: c’est-à-dire
  rationale: Équivalent français direct et naturel de la formule explicative.
- source_word: Θεέ μου θεέ μου
  choice: Mon Dieu, mon Dieu
  rationale: La répétition vocative est conservée, de même que l’écho verbal au Psaume 22.1.
- source_word: ἱνατί
  choice: pourquoi
  rationale: Traduction directe et idiomatique de l’adverbe interrogatif.
- source_word: ἐγκατέλιπες
  choice: m’as-tu abandonné
  rationale: Le passé composé rend naturellement en français le cri portant sur un abandon subi dont l’effet est présent. « Abandonner » est le terme courant, fort et digne correspondant au verbe grec.
theological_decisions:
- issue: Rapport du cri de Jésus au Psaume 22.1
  choice: Traduire le cri directement, en préservant sa force et son écho au psaume, sans en expliquer la portée doctrinale dans le texte.
  alternative: Présenter surtout les mots comme une citation allusive, ou atténuer par paraphrase la notion d’abandon.
  rationale: Le grec rapporte le cri et sa traduction sans qualification interprétative. La formulation conserve donc la tension théologique sans la résoudre.
- issue: Maintien du cri sémitique
  choice: Conserver les mots sémitiques translittérés, puis leur traduction.
  alternative: Ne donner que leur sens en français.
  rationale: Cette double présentation reproduit celle de Matthieu et garde un détail narratif important pour la suite du passage.
- issue: Valeur temporelle de l’aoriste ἐγκατέλιπες
  choice: 'Employer le passé composé français : « m’as-tu abandonné ».'
  alternative: Employer un passé simple ou une formulation qui ferait porter l’accent sur un abandon strictement ponctuel.
  rationale: Le passé composé est la forme naturelle du français moderne dans ce discours direct et ne tranche pas au-delà du grec la portée temporelle et théologique du cri.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme solennel du cri est maintenu sans archaïsme; l’indication horaire antique est conservée plutôt que convertie dans le corps du verset.
