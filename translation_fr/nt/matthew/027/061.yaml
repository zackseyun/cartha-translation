  text: ἦν δὲ ἐκεῖ ⸀Μαριὰμ ἡ Μαγδαληνὴ καὶ ἡ ἄλλη Μαρία καθήμεναι ἀπέναντι τοῦ τάφου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/061.yaml
  text: Mary Magdalene and the other Mary were there, sitting opposite the tomb.
translation:
  language: fr
  text: Marie de Magdala et l’autre Marie étaient là, assises en face du tombeau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν ... ἐκεῖ
  choice: étaient là
  rationale: Bien que ἦν soit au singulier, il introduit ici deux sujets coordonnés nommés ensuite. Le pluriel est requis en français naturel et restitue le sens de leur présence.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: δέ marque ici une transition narrative légère, sans contraste marqué. En français, l’enchaînement du récit suffit et évite d’ajouter artificiellement « or » ou « mais ».
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Marie de Magdala
  rationale: Cette forme française moderne rend explicitement le gentilé Μαγδαληνή, c’est-à-dire l’origine ou l’association avec Magdala, sans employer la forme traditionnelle moins transparente « Madeleine ».
- source_word: ἡ ἄλλη Μαρία
  choice: l’autre Marie
  rationale: ἄλλη distingue cette Marie de Marie de Magdala déjà mentionnée; la formulation française est directe et claire.
- source_word: καθήμεναι
  choice: assises
  rationale: Le participe présent décrit la posture des deux femmes. « Assises » est naturel, concis et s’accorde avec les deux sujets féminins.
- source_word: ἀπέναντι
  choice: en face de
  rationale: L’expression indique une position opposée ou faisant face au tombeau. « En face de » est idiomatique en français moderne.
- source_word: τοῦ τάφου
  choice: du tombeau
  rationale: Dans ce contexte funéraire, τάφος désigne le tombeau où le corps a été déposé; « tombeau » est plus précis que « tombe » et non archaïque.
