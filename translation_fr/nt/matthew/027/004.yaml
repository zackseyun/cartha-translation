  text: λέγων· Ἥμαρτον παραδοὺς αἷμα ⸀ἀθῷον. οἱ δὲ εἶπαν· Τί πρὸς ἡμᾶς; σὺ ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/004.yaml
  text: saying, “I have sinned by betraying innocent blood.” But they said, “What is that to us? You will see to it.”
translation:
  language: fr
  text: 'en disant : « J’ai péché en livrant le sang innocent.[a] » Mais ils dirent : « Que nous importe ? À toi de voir.[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « ayant livré le sang innocent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « toi, tu verras » ; expression signifiant ici : « C’est ta responsabilité. »'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἥμαρτον
  choice: J’ai péché
  rationale: Le passé composé convient naturellement à une confession en français et exprime la culpabilité présente découlant de l’acte commis.
- source_word: παραδοὺς
  choice: en livrant
  rationale: Le participe aoriste précise ici l’acte constitutif du péché. « Livrer » conserve le sens narratif de παραδίδωμι sans imposer le terme plus interprétatif « trahir ».
- source_word: αἷμα ἀθῷον
  choice: un sang innocent
  rationale: Cette formulation garde l’image biblique et juridique du grec ainsi que son référent implicite, sans ajouter « Jésus » ni « un innocent ».
- source_word: Τί πρὸς ἡμᾶς;
  choice: Que nous importe ?
  rationale: Expression française concise et naturelle qui rend le refus méprisant de toute préoccupation ou responsabilité.
- source_word: σὺ ὄψῃ
  choice: À toi de voir
  rationale: 'Cette tournure idiomatique française rend le futur grec employé comme une fin de non-recevoir : l’affaire relève désormais de Judas.'
theological_decisions:
- issue: Faut-il expliciter que le sang innocent est celui de Jésus ?
  choice: Maintenir le référent implicite avec « un sang innocent »
  alternative: le sang d’un innocent / le sang innocent de Jésus
  rationale: Le grec ne nomme pas explicitement Jésus et conserve l’expression condensée « sang innocent » ; l’explicitation dépasserait le texte.
- issue: Force de σὺ ὄψῃ
  choice: À toi de voir
  alternative: Tu verras / Occupe-t’en toi-même
  rationale: Le futur a ici une valeur idiomatique proche d’un impératif brusque. La traduction préserve le rejet de responsabilité sans en faire une simple prédiction.
translation_notes:
  register: Français international moderne, digne et direct. Le discours conserve la brièveté de la confession et la réponse sèche des chefs religieux. Les marqueurs [a] et [b] figurent dans le texte principal.
