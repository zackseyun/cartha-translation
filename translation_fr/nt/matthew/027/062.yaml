source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον, ἥτις ἐστὶν μετὰ τὴν παρασκευήν, συνήχθησαν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι πρὸς Πιλᾶτον
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/062.yaml
  text: On the next day[a], which is after the day of Preparation, the chief priests and the Pharisees gathered before Pilate
translation:
  language: fr
  text: Le lendemain[a], c’est-à-dire après le jour de la Préparation, les grands prêtres et les pharisiens se réunirent auprès de Pilate.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jour suivant celui de la Préparation ». Le terme grec peut désigner le jour où l’on se prépare pour le sabbat ; traduire par « vendredi » serait plus interprétatif que ne l’exige le texte source.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: Le lendemain
  rationale: Cette expression situe simplement l’événement au jour suivant. Le léger lien marqué par δέ n’a pas besoin d’être rendu par un mot distinct en français.
- source_word: ἥτις ἐστὶν μετὰ τὴν παρασκευήν
  choice: c’est-à-dire après le jour de la Préparation
  rationale: La relative a une valeur explicative. « C’est-à-dire » la rend clairement et naturellement, tandis que « le jour de la Préparation » conserve l’expression calendaire juive.
- source_word: παρασκευήν
  choice: le jour de la Préparation
  rationale: Dans ce contexte juif, le terme désigne vraisemblablement le jour précédant le sabbat. Cette traduction reste proche du grec sans préciser de manière interprétative « vendredi ».
- source_word: συνήχθησαν
  choice: se réunirent
  rationale: La forme passive grecque a ici un sens intransitif. « Se réunirent » est naturel, précis et adapté à un récit au passé simple.
- source_word: οἱ ἀρχιερεῖς
  choice: les grands prêtres
  rationale: Expression française usuelle pour les principales autorités sacerdotales, sans suggérer qu’il y avait simultanément plusieurs titulaires de la charge de grand prêtre.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française standard de ce groupe juif.
- source_word: πρὸς Πιλᾶτον
  choice: auprès de Pilate
  rationale: Avec un verbe de rassemblement, πρός peut indiquer que les personnes se rendent auprès de quelqu’un. « Auprès de Pilate » préserve cette nuance sans imposer une scène judiciaire plus précise.
- source_word: Πιλᾶτον
  choice: Pilate
  rationale: Forme française traditionnelle et standard du nom propre.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. La majuscule à « Préparation » signale ici le nom traditionnel d’un jour particulier.
