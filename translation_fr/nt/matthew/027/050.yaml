id: MAT.27.50
reference: Matthew 27:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς πάλιν κράξας φωνῇ μεγάλῃ ἀφῆκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/050.yaml
  text: But Jesus cried out again with a loud voice and gave up his spirit[a].
translation:
  language: fr
  text: Mais Jésus poussa de nouveau un grand cri et rendit l’esprit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « expira ». Le grec dit littéralement « laissa aller l’esprit », expression qui désigne ici la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: δέ assure la progression du récit avec une légère nuance de contraste. « Mais » convient ici à la transition narrative et reste naturel en français.
- source_word: πάλιν
  choice: de nouveau
  rationale: πάλιν indique clairement la répétition. « De nouveau » est naturel dans ce registre et s’intègre bien à la phrase.
- source_word: κράξας φωνῇ μεγάλῃ
  choice: poussa […] un grand cri
  rationale: Cette formulation française rend de façon idiomatique l’intensité de κράζω et de φωνῇ μεγάλῃ, sans le calque moins naturel « cria d’une voix forte ».
- source_word: ἀφῆκεν
  choice: rendit
  rationale: Avec τὸ πνεῦμα, ἀφίημι forme ici une expression de la mort. « Rendit l’esprit » préserve l’image du grec tout en étant une expression française digne et intelligible.
- source_word: τὸ πνεῦμα
  choice: l’esprit
  rationale: Le français emploie naturellement l’article dans l’expression « rendre l’esprit ». Ce choix conserve le sens de πνεῦμα plutôt que de le réduire explicitement au souffle.
theological_decisions:
- issue: Interprétation de l’expression ἀφῆκεν τὸ πνεῦμα
  choice: rendit l’esprit
  alternative: expira
  rationale: « Expira » exprime directement le fait de mourir, mais efface l’image lexicale de πνεῦμα. « Rendit l’esprit » conserve la formulation et la possible portée théologique du grec sans préciser à qui l’esprit serait rendu.
translation_notes:
  register: Français moderne, solennel et accessible. « Poussa un grand cri » évite un calque tout en conservant la force sonore du grec; « rendit l’esprit » maintient la tension entre idiome de mort et sens lexical de « esprit ».
