  rationale: La révision rétablit le futur de la conséquence annoncée, évite l’explicitation de « corps » là où le grec emploie un pronom personnel, et déplace l’appel de note au lieu exact de la variante. Elle conserve le passif de l’affirmation de résurrection ainsi que l’ambiguïté de « la première ».
