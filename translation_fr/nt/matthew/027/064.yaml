  source_fidelity: 'Le sens du grec est globalement bien rendu : l’impératif officiel, la sécurisation du tombeau, l’éventualité redoutée, le passif de Ἠγέρθη et l’ambiguïté de « la première » sont conservés. « Son corps » explicite un référent contextuellement certain, mais ajoute un nom absent du grec ; « le dérober » permet de conserver le pronom personnel sans lourdeur. Le futur ἔσται doit être rendu par un futur français plutôt que par le conditionnel.'
  naturalness: Le français est fluide et d’un registre approprié. « Soit mis en sûreté » est intelligible, quoique légèrement administratif ; il demeure acceptable et préserve la généralité de ἀσφαλισθῆναι. La principale amélioration nécessaire est « sera pire », qui exprime directement la conséquence future annoncée.
  terminology: « Tombeau », « au peuple », « ressuscité d’entre les morts » et « tromperie » conviennent. Le passif de « Il a été ressuscité » est correctement maintenu, sans rendre explicite l’agent implicite. « Cette dernière tromperie » rend naturellement ἡ ἐσχάτη πλάνη dans ce discours polémique.
