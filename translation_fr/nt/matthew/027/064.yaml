  - severity: low
    issue: « Son corps » explicite davantage que αὐτόν.
    rationale: Le référent est assurément le corps de Jésus dans le contexte funéraire, mais le grec conserve le pronom personnel. « Le dérober » est naturel dans ce contexte et évite cet ajout.
