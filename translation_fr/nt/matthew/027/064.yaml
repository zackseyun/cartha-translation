reference: Matthew 27:64
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κέλευσον οὖν ἀσφαλισθῆναι τὸν τάφον ἕως τῆς τρίτης ἡμέρας, μήποτε ἐλθόντες οἱ μαθηταὶ ⸀αὐτοῦ κλέψωσιν αὐτὸν καὶ εἴπωσιν τῷ λαῷ· Ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ ἔσται ἡ ἐσχάτη πλάνη χείρων τῆς πρώτης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/064.yaml
  text: Therefore[a], order the tomb to be secured until the third day, lest his disciples come and steal him and say to the people[b], ‘He has been raised from the dead,’ and the last deception will be worse than the first.
translation:
  language: fr
  text: 'Ordonne donc que le tombeau soit mis en sûreté jusqu’au troisième jour, de peur que ses disciples ne viennent[a] le dérober et ne disent au peuple : « Il a été ressuscité d’entre les morts. » Cette dernière tromperie sera pire que la première.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ajoutent « de nuit » après « viennent » : « de peur que ses disciples ne viennent de nuit le dérober ». Le texte plus court est retenu ici.'
    reason: textual_variant
lexical_decisions:
- source_word: κέλευσον
  choice: Ordonne
  rationale: L’impératif aoriste appelle une décision officielle de Pilate ; « Ordonne » est direct et naturel.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée de la prédiction de Jésus rappelée au verset précédent.
- source_word: ἀσφαλισθῆναι τὸν τάφον
  choice: que le tombeau soit mis en sûreté
  rationale: Préserve le passif et l’idée générale de sécurisation sans réduire celle-ci à la seule garde.
- source_word: ἕως τῆς τρίτης ἡμέρας
  choice: jusqu’au troisième jour
  rationale: Expression temporelle naturelle qui maintient le lien avec la prédiction de la résurrection.
- source_word: μήποτε
  choice: de peur que
  rationale: Exprime clairement en français moderne l’éventualité redoutée et le motif préventif.
- source_word: κλέψωσιν αὐτόν
  choice: voler son corps
  rationale: Le grec dit littéralement « le voler », mais, en français, cette formulation pourrait suggérer un enlèvement de personne vivante ; « son corps » explicite le référent contextuel sans changer le sens.
- source_word: τῷ λαῷ
  choice: au peuple
  rationale: λαός désigne ici le peuple en général, et non simplement une foule présente.
- source_word: Ἠγέρθη ἀπὸ τῶν νεκρῶν
  choice: Il a été ressuscité d’entre les morts
  rationale: Conserve la voix passive de l’aoriste grec et rend le pluriel substantivé par la tournure française consacrée et précise « d’entre les morts ».
- source_word: ἡ ἐσχάτη πλάνη
  choice: Cette dernière tromperie
  rationale: πλάνη peut désigner l’égarement ou la tromperie ; dans la bouche des chefs qui redoutent une affirmation fabriquée, « tromperie » convient au contexte. Le démonstratif relie naturellement cette tromperie projetée à ce qui vient d’être décrit.
- source_word: χείρων τῆς πρώτης
  choice: serait pire que la première
  rationale: Le conditionnel français exprime naturellement la conséquence redoutée, là où le grec emploie le futur dans cette proposition anticipée.
theological_decisions:
- issue: Voix du verbe dans l’affirmation de résurrection
  choice: Il a été ressuscité d’entre les morts
  alternative: Il est ressuscité d’entre les morts
  rationale: Le grec Ἠγέρθη est passif. La traduction retenue préserve cette voix et ne transforme pas silencieusement l’énoncé en verbe pronominal ou intransitif.
- issue: Sens de « la première » tromperie
  choice: 'Maintenir la référence implicite : « la première »'
  alternative: Expliciter qu’il s’agit des affirmations ou de l’influence antérieures de Jésus
  rationale: Le texte ne précise pas explicitement ce que désigne « la première ». L’expliciter résoudrait une ambiguïté réelle du discours des interlocuteurs.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton d’une requête officielle adressée à Pilate. Le passif de la résurrection et l’ambiguïté de « la première » sont maintenus.
