  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Πιλᾶτος ὅτι οὐδὲν ὠφελεῖ ἀλλὰ μᾶλλον θόρυβος γίνεται λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας ⸀ἀπέναντι τοῦ ὄχλου λέγων· Ἀθῷός εἰμι ἀπὸ τοῦ ⸀αἵματος τούτου· ὑμεῖς ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/024.yaml
  text: So when Pilate saw that he was gaining nothing[a], but rather that a riot was developing, he took water and washed his hands before the crowd, saying, “I am innocent of this blood[c][b]; you yourselves will see to it.”
translation:
  language: fr
  text: 'Voyant qu’il n’obtenait rien, mais qu’au contraire un tumulte se produisait, Pilate prit de l’eau et se lava les mains devant la foule, en disant : « Je suis innocent de ce sang[a]. Vous verrez[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « innocent de ce sang ». L’expression signifie que Pilate se déclare dégagé de toute responsabilité dans cette mort.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon un emploi idiomatique : « C’est à vous d’y veiller » ou « Vous vous en chargerez » ; littéralement : « vous verrez ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Πιλᾶτος
  choice: Voyant… Pilate
  rationale: Le participe aoriste introduit l’action qui motive les gestes suivants de Pilate. La construction participiale reste naturelle en français et δέ n’exige pas ici un connecteur explicite.
- source_word: ὅτι οὐδὲν ὠφελεῖ
  choice: qu’il n’obtenait rien
  rationale: Le présent historique décrit l’inefficacité des efforts de Pilate. Cette formulation française exprime naturellement qu’il ne parvenait à aucun résultat.
- source_word: ἀλλὰ μᾶλλον θόρυβος γίνεται
  choice: et que, au contraire, une émeute commençait
  rationale: θόρυβος désigne une agitation publique pouvant aller jusqu’à l’émeute; γίνεται marque ici son apparition ou son développement. « Commençait » rend ce processus sans présenter l’émeute comme déjà pleinement constituée.
- source_word: λαβὼν ὕδωρ ἀπενίψατο τὰς χεῖρας
  choice: prit de l’eau et se lava les mains
  rationale: Les participes et le verbe principal sont coordonnés pour une narration française fluide, tout en conservant le geste public et symbolique.
- source_word: ἀπέναντι τοῦ ὄχλου
  choice: devant la foule
  rationale: La préposition souligne que le geste est accompli publiquement, sous les yeux de la foule.
- source_word: Ἀθῷός εἰμι ἀπὸ τοῦ αἵματος τούτου
  choice: Je suis innocent de ce sang
  rationale: La formulation conserve l’image grecque du sang et la déclaration de non-responsabilité de Pilate, sans ajouter « de cet homme », absent du texte source.
- source_word: ὑμεῖς ὄψεσθε
  choice: À vous de voir !
  rationale: Cette expression française garde le verbe « voir », l’emphase portée par ὑμεῖς et la valeur idiomatique par laquelle Pilate renvoie l’affaire et la responsabilité à ses interlocuteurs.
theological_decisions:
- issue: La déclaration d’innocence de Pilate
  choice: La présenter comme la parole revendiquée par Pilate, sans la valider narrativement ou théologiquement.
  alternative: 'Expliciter : « Je ne suis pas responsable de sa mort. »'
  rationale: 'Le discours direct préserve la tension morale du récit : Pilate affirme son innocence, mais la traduction ne statue pas sur la vérité de cette affirmation.'
- issue: Le transfert de responsabilité dans ὑμεῖς ὄψεσθε
  choice: « À vous de voir ! »
  alternative: « C’est votre affaire ! » ou, littéralement, « Vous verrez. »
  rationale: La tournure retenue laisse entendre que Pilate renvoie la décision et ses conséquences à la foule, sans préciser davantage que le grec la portée exacte de cette responsabilité.
translation_notes:
  register: Français international actuel, narratif et digne. « Émeute commençait » exprime l’escalade en cours; « À vous de voir ! » est idiomatique sans être familier et conserve l’ambiguïté concise de la formule grecque.
