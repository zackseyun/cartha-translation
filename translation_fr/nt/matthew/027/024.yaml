revisions:
- from: 'Voyant qu’il n’obtenait rien et que, au contraire, une émeute commençait, Pilate prit de l’eau et se lava les mains devant la foule en disant : « Je suis innocent de ce sang[a]. À vous de voir[b] ! »'
  to: 'Voyant qu’il n’obtenait rien, mais qu’au contraire un tumulte se produisait, Pilate prit de l’eau et se lava les mains devant la foule, en disant : « Je suis innocent de ce sang[a]. Vous verrez[b]. »'
  rationale: La révision rétablit le contraste explicite du grec, choisit « tumulte » pour ne pas restreindre θόρυβος à une émeute constituée, et rend ὑμεῖς ὄψεσθε littéralement dans le texte. La note conserve les interprétations idiomatiques responsables sans imposer l’une d’elles. Aucun ajout christologique n’est introduit dans la déclaration de Pilate.
