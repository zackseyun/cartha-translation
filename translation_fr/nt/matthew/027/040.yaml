id: MAT.27.40
reference: Matthew 27:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγοντες· Ὁ καταλύων τὸν ναὸν καὶ ἐν τρισὶν ἡμέραις οἰκοδομῶν, σῶσον σεαυτόν· εἰ υἱὸς εἶ τοῦ θεοῦ, ⸀κατάβηθι ἀπὸ τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/040.yaml
  text: and saying[a], “You who would destroy the temple and build it in three days, save yourself! If you are the Son of God, come down from the cross.”
translation:
  language: fr
  text: 'et disaient : « Toi qui détruis le temple et le bâtis[a] en trois jours, sauve-toi toi-même ! Si tu es le Fils de Dieu, descends de la croix ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le rebâtis ». Le verbe grec signifie simplement « bâtir », mais le contexte de la raillerie peut impliquer une reconstruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: et disaient
  rationale: Le participe présent prolonge la scène précédente. Une forme verbale conjuguée est plus naturelle en français tout en conservant la coordination narrative.
- source_word: Ὁ καταλύων
  choice: Toi qui détruis
  rationale: L’article suivi du participe a ici une valeur d’interpellation. Cette tournure française restitue directement la raillerie sans ajouter une nuance hypothétique absente de la forme grecque.
- source_word: καταλύω
  choice: détruis
  rationale: Dans le contexte du temple, « détruire » exprime clairement l’idée de démolition et reprend naturellement l’accusation évoquée.
- source_word: ναός
  choice: temple
  rationale: Bien que ναός puisse désigner plus précisément le sanctuaire, « temple » est ici le terme courant et contextuellement clair.
- source_word: ἐν τρισὶν ἡμέραις
  choice: en trois jours
  rationale: Cette expression temporelle directe et idiomatique préserve la formulation de la provocation.
- source_word: οἰκοδομῶν
  choice: le bâtis
  rationale: Le verbe grec signifie littéralement « bâtir ». Le pronom « le » reprend naturellement « le temple »; « rebâtir » reste une possibilité contextuelle signalée en note.
- source_word: σῶσον σεαυτόν
  choice: sauve-toi toi-même
  rationale: Cette formulation restitue l’impératif et souligne le pronom réfléchi emphatique σεαυτόν, essentiel à la raillerie.
- source_word: εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: Si tu es le Fils de Dieu
  rationale: La traduction conserve sans l’atténuer la condition provocatrice ainsi que le titre christologique familier en français.
- source_word: κατάβηθι
  choice: descends
  rationale: L’impératif « descends » rend directement le mouvement vers le bas demandé à Jésus crucifié.
- source_word: σταυρός
  choice: croix
  rationale: « Croix » est l’équivalent français standard et contextuellement approprié dans le récit de la Passion.
theological_decisions:
- issue: Rendu du titre christologique υἱὸς τοῦ θεοῦ dans une parole de moquerie
  choice: le Fils de Dieu
  alternative: Fils de Dieu
  rationale: L’article français convient à la désignation titulaire et familière. La traduction maintient la portée de la provocation concernant l’identité de Jésus sans confirmer ni affaiblir la parole des moqueurs au-delà du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct garde la vigueur de la raillerie; « sauve-toi toi-même » conserve l’insistance du grec, et « bâtis » évite d’intégrer silencieusement l’interprétation « rebâtis ».
