  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε οἱ στρατιῶται τοῦ ἡγεμόνος παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον συνήγαγον ἐπ’ αὐτὸν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/027.yaml
  text: Then the governor’s soldiers took Jesus into the praetorium and gathered the whole cohort around him[a][b].
translation:
  language: fr
  text: Alors les soldats du gouverneur emmenèrent Jésus dans le prétoire[a] et rassemblèrent autour de lui toute la cohorte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le quartier général du gouverneur ». Le terme grec désigne la résidence officielle ou le quartier général militaire du gouverneur romain.
    reason: lexical_alternative
  - marker: b
    text: « Cohorte » traduit un terme militaire romain. Il peut désigner une unité de soldats, sans impliquer nécessairement que chaque soldat d’une cohorte au complet était physiquement présent.
    reason: cultural_note
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession immédiate des événements.
- source_word: οἱ στρατιῶται τοῦ ἡγεμόνος
  choice: les soldats du gouverneur
  rationale: Rend de façon idiomatique le génitif d’association et situe les soldats sous l’autorité du gouverneur romain.
- source_word: παραλαβόντες τὸν Ἰησοῦν εἰς τὸ πραιτώριον
  choice: emmenèrent Jésus dans le prétoire
  rationale: Intègre naturellement le participe grec à la proposition principale; « emmenèrent » exprime la prise en charge et le déplacement de Jésus vers l’intérieur du lieu.
- source_word: τὸ πραιτώριον
  choice: le prétoire
  rationale: Conserve le terme historique désignant la résidence officielle ou le quartier général du gouverneur, avec explication en note.
- source_word: συνήγαγον ἐπ’ αὐτὸν
  choice: rassemblèrent autour de lui
  rationale: Dans ce contexte, le verbe avec ἐπί et l’accusatif décrit le rassemblement convergeant vers Jésus; « autour de lui » restitue naturellement la scène.
- source_word: ὅλην τὴν σπεῖραν
  choice: toute la cohorte
  rationale: « Cohorte » conserve le sens militaire romain de σπεῖρα, tandis que « toute » traduit explicitement ὅλην.
