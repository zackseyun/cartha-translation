  text: σταυρώσαντες δὲ αὐτὸν διεμερίσαντο τὰ ἱμάτια αὐτοῦ βάλλοντες κλῆρον,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/035.yaml
  text: And after they crucified him[a], they divided his garments by casting lots.
translation:
  language: fr
  text: Après l’avoir crucifié, ils se partagèrent ses vêtements en tirant au sort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυρώσαντες
  choice: Après l’avoir crucifié
  rationale: Le participe aoriste exprime ici une action antérieure au verbe principal. Cette formulation française naturelle conserve clairement la succession des actions.
- source_word: δὲ
  choice: non traduit séparément
  rationale: La particule marque une légère progression narrative. En français, l’enchaînement est suffisamment exprimé par la phrase elle-même; ajouter « et » ou « puis » alourdirait inutilement le récit.
- source_word: διεμερίσαντο
  choice: ils se partagèrent
  rationale: Le verbe désigne le fait de diviser ou de répartir entre plusieurs personnes. « Se partager » rend naturellement l’action concrète portant sur les vêtements.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: ses vêtements
  rationale: Ἱμάτια désigne ici les vêtements sans imposer la précision « vêtements de dessus ». « Vêtements » est courant, digne et exact.
- source_word: βάλλοντες κλῆρον
  choice: en tirant au sort
  rationale: Cette expression idiomatique française rend le procédé par lequel les vêtements furent répartis. Elle restitue naturellement le singulier grec κλῆρον dans l’usage français.
theological_decisions:
- issue: Rapport de βάλλοντες κλῆρον avec διεμερίσαντο
  choice: « ils se partagèrent ses vêtements en tirant au sort »
  alternative: « ils se partagèrent ses vêtements, tirant au sort »
  rationale: Le participe précise naturellement la manière dont le partage s’est effectué. « En tirant au sort » rend ce rapport sans ajouter de contenu théologique.
translation_notes:
  register: Français moderne international, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Aucun marqueur de note n’est requis, car la relation temporelle et la valeur du participe sont rendues directement et sans perte notable.
