revisions:
- from: 'Mais il dit : « Quel mal a-t-il donc fait ? » Eux, cependant, criaient de plus en plus fort : « Qu’il soit crucifié ! »'
  to: 'Mais il dit : « Quel mal a-t-il donc fait ? » Mais eux criaient davantage : « Qu’il soit crucifié ! »'
  rationale: Révision limitée de la seconde proposition afin d’éviter l’ajout d’une progression et d’une précision de volume absentes du grec. « Mais eux » rend clairement l’opposition οἱ δὲ sans l’alourdissement de « cependant ». La formulation conserve l’imparfait par « criaient » et l’impératif passif par « Qu’il soit crucifié ! ».
  reviewer_model: gpt-5.6-terra
