base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/023.yaml
  text: But he said[a], “What evil has he done?” But they cried out all the more, saying[b], “Let him be crucified.”
translation:
  language: fr
  text: 'Mais il dit : « Quel mal a-t-il donc fait ? » Mais eux criaient davantage : « Qu’il soit crucifié ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἔφη
  choice: Mais il dit
  rationale: Le δέ marque ici le contraste avec la demande de la foule, et l’aoriste ἔφη introduit simplement la parole de Pilate.
- source_word: Τί γὰρ κακὸν ἐποίησεν;
  choice: Quel mal a-t-il donc fait ?
  rationale: « Donc » rend naturellement la nuance argumentative de γάρ dans cette question, tandis que « mal » conserve la portée morale de κακόν.
- source_word: περισσῶς ἔκραζον
  choice: criaient de plus en plus fort
  rationale: L’imparfait ἔκραζον présente un cri qui se prolonge, et περισσῶς en marque l’intensification. « Fort » explicite ici la force vocale naturellement impliquée par le verbe crier.
- source_word: λέγοντες
  choice: '[non rendu séparément]'
  rationale: En français, le contenu placé directement après les deux-points exprime naturellement ce que la foule criait; ajouter « en disant » serait lourd et redondant.
- source_word: Σταυρωθήτω
  choice: Qu’il soit crucifié !
  rationale: Cette formulation conserve à la fois la valeur impérative et la voix passive du troisième impératif aoriste grec.
theological_decisions:
- issue: Forme de la demande de crucifixion
  choice: Qu’il soit crucifié !
  alternative: Crucifiez-le !
  rationale: La formulation passive reflète précisément σταυρωθήτω sans désigner plus explicitement les exécutants ni introduire d’interprétation supplémentaire.
translation_notes:
  register: Français moderne, courant et digne. Le contraste entre Pilate et la foule reste net sans répétition artificielle de « mais »; la parole de la foule est rendue directement, conformément à l’usage naturel du français.
