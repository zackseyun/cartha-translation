source:
  edition: SBLGNT
  text: ἐν αἷς ἦν Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ἡ τοῦ Ἰακώβου καὶ ⸀Ἰωσὴφ μήτηρ καὶ ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/056.yaml
  text: among whom were Mary Magdalene[a], and Mary the mother of James and Joseph, and the mother of the sons of Zebedee.
translation:
  language: fr
  text: Parmi elles se trouvaient Marie de Magdala, Marie, mère de Jacques et de Joseph[a], et la mère des fils de Zébédée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « Josès » au lieu de « Joseph ».
    reason: textual_variant
lexical_decisions:
- source_word: ἐν αἷς
  choice: Parmi elles
  rationale: Le relatif féminin pluriel renvoie aux femmes du verset précédent. « Parmi elles » est naturel en français et exprime clairement l’appartenance à ce groupe.
- source_word: ἦν
  choice: se trouvaient
  rationale: Le singulier grec introduit ici une liste de personnes. Le français emploie naturellement le pluriel avec le sujet composé qui suit.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Marie de Magdala
  rationale: Cette formulation française courante rend l’épithète géographique sans suggérer un nom de famille moderne.
- source_word: Μαρία ἡ τοῦ Ἰακώβου καὶ Ἰωσὴφ μήτηρ
  choice: Marie, mère de Jacques et de Joseph
  rationale: Les génitifs identifient Marie par ses fils. L’apposition concise reste claire et fidèle.
- source_word: Ἰακώβου
  choice: Jacques
  rationale: « Jacques » est la forme française traditionnelle et reconnue du nom Ἰάκωβος dans le Nouveau Testament.
- source_word: Ἰωσὴφ
  choice: Joseph
  rationale: Le texte SBLGNT porte Ἰωσήφ, normalement rendu par « Joseph »; la variante « Josès » est signalée en note.
- source_word: ἡ μήτηρ τῶν υἱῶν Ζεβεδαίου
  choice: la mère des fils de Zébédée
  rationale: La formulation reproduit clairement la relation génitivale et conserve la manière dont la femme est identifiée dans le grec.
- source_word: Ζεβεδαίου
  choice: Zébédée
  rationale: Forme française établie du nom propre Ζεβεδαῖος.
