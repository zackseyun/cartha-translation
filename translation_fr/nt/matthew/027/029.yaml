id: MAT.27.29
reference: Matthew 27:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν ἐπὶ ⸂τῆς κεφαλῆς⸃ αὐτοῦ καὶ κάλαμον ⸂ἐν τῇ δεξιᾷ⸃ αὐτοῦ, καὶ γονυπετήσαντες ἔμπροσθεν αὐτοῦ ⸀ἐνέπαιξαν αὐτῷ λέγοντες· Χαῖρε, ⸀βασιλεῦ τῶν Ἰουδαίων,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/029.yaml
  text: And after weaving a crown of thorns[a], they put it on his head, and a reed in his right hand; and kneeling before him, they mocked him, saying, “Hail, King of the Jews!”
translation:
  language: fr
  text: 'Après avoir tressé une couronne d’épines, ils la posèrent sur sa tête et lui mirent un roseau dans sa main droite. Puis ils s’agenouillèrent devant lui et se moquèrent de lui en disant : « Salut, roi des Juifs[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « roi des Judéens ». Le grec Ἰουδαίων peut désigner les Judéens ou les Juifs ; ici, le terme figure dans le titre royal employé pour se moquer de Jésus.
    reason: Alternative lexicale permettant de préserver l’étendue sémantique du terme grec.
lexical_decisions:
- source_word: πλέξαντες
  choice: Après avoir tressé
  rationale: Le participe aoriste exprime une action accomplie avant le verbe principal ; cette formulation rend naturellement la succession des gestes.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: une couronne d’épines
  rationale: « Couronne » convient à la parodie de royauté, tandis que « d’épines » exprime idiomatiquement la matière dont elle est faite.
- source_word: ἐπέθηκαν ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: ils la posèrent sur sa tête
  rationale: Rendu direct et naturel du geste, avec le pronom reprenant clairement la couronne.
- source_word: κάλαμον
  choice: un roseau
  rationale: Le terme désigne littéralement un roseau, probablement employé comme sceptre dérisoire ; la traduction conserve l’image sans explicitation interprétative.
- source_word: ἐν τῇ δεξιᾷ αὐτοῦ
  choice: dans la main droite
  rationale: Le français exige ici « main » pour exprimer naturellement ce que le grec indique par « dans sa droite ».
- source_word: γονυπετήσαντες ἔμπροσθεν αὐτοῦ
  choice: ils s’agenouillèrent devant lui
  rationale: Cette formulation restitue clairement le geste de révérence feinte et sa position devant Jésus.
- source_word: ἐνέπαιξαν αὐτῷ
  choice: se moquèrent de lui
  rationale: Expression française courante qui rend la dérision hostile sans atténuer la scène.
- source_word: Χαῖρε
  choice: Salut
  rationale: Dans cette acclamation sarcastique, « Salut » conserve la forme d’une salutation solennelle adressée au prétendu roi.
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: roi des Juifs
  rationale: Cette formule rend le titre royal accusateur et dérisoire dans le récit de la Passion, tout en maintenant en note l’autre valeur possible du terme grec.
theological_decisions:
- issue: Préserver l’ironie de l’acclamation royale
  choice: « Salut, roi des Juifs ! »
  alternative: « Bonjour, roi des Juifs ! » ou « Vive le roi des Juifs ! »
  rationale: « Salut » traduit la salutation Χαῖρε avec une tonalité assez solennelle pour faire entendre la parodie d’hommage royal, sans ajouter la formule d’acclamation « Vive » qui n’est pas explicitement présente.
- issue: Portée de Ἰουδαίων dans le titre
  choice: « Juifs »
  alternative: « Judéens »
  rationale: Le grec peut désigner les Juifs ou les Judéens. Dans cette formule de la Passion, « roi des Juifs » rend le plus naturellement le titre politico-ethnique attribué à Jésus, tandis qu’une note préserve l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe répartit les gestes en deux phrases pour faciliter la lecture sans modifier leur ordre. Le marqueur de note est placé après « Juifs », le terme auquel la note se rapporte.
