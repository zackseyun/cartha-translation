  text: καὶ εὐθέως δραμὼν εἷς ἐξ αὐτῶν καὶ λαβὼν σπόγγον πλήσας τε ὄξους καὶ περιθεὶς καλάμῳ ἐπότιζεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/048.yaml
  text: And immediately one of them ran[a], took a sponge, filled it with sour wine, put it on a reed[b], and gave him a drink.
translation:
  language: fr
  text: Aussitôt, l’un d’eux courut, prit une éponge, la remplit de vin aigre[a], la fixa à un roseau et lui donnait à boire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vinaigre de vin ». Le mot grec désigne du vin aigre ou du vinaigre de vin.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « lui donna à boire ». Le verbe grec est à l’imparfait et peut présenter l’action dans son déroulement.'
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Rend clairement l’immédiateté de l’action dans un récit en français moderne.
- source_word: δραμὼν
  choice: courut
  rationale: Le participe aoriste est intégré naturellement à la chaîne narrative sous la forme d’un verbe conjugué.
- source_word: εἷς ἐξ αὐτῶν
  choice: l’un d’eux
  rationale: Équivalent français idiomatique de l’expression partitive grecque.
- source_word: λαβὼν σπόγγον
  choice: prendre une éponge
  rationale: Après « courut », l’infinitif exprime naturellement le but immédiat sans obscurcir la succession des gestes.
- source_word: πλήσας τε ὄξους
  choice: la remplit de vin aigre
  rationale: ὄξος désigne du vin devenu aigre ou un vinaigre de vin; « vin aigre » évoque mieux ici une boisson acide que le français moderne « vinaigre ».
- source_word: περιθεὶς καλάμῳ
  choice: la fixa à un roseau
  rationale: Exprime de façon naturelle le fait de placer ou monter l’éponge sur un roseau, sans préciser davantage le dispositif.
- source_word: ἐπότιζεν αὐτόν
  choice: lui donna à boire
  rationale: Rend idiomatiquement l’action de faire boire. L’imparfait grec laisse toutefois ouverte une nuance progressive ou répétée, signalée en note.
theological_decisions:
- issue: Nature de la boisson offerte à Jésus
  choice: vin aigre
  alternative: vinaigre de vin
  rationale: Le grec ὄξος permet les deux formulations. « Vin aigre » reste proche du référent antique et évite l’idée moderne d’un simple condiment.
- issue: Valeur aspectuelle de ἐπότιζεν
  choice: lui donna à boire
  alternative: lui donnait à boire
  rationale: Le passé simple est naturel dans la suite narrative française, tandis que l’imparfait grec peut présenter l’action dans son déroulement; cette nuance est conservée en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif biblique sans archaïsmes lexicaux; les notes préservent les principales ambiguïtés du grec.
