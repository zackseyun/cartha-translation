id: MAT.27.51
reference: Matthew 27:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ τὸ καταπέτασμα τοῦ ναοῦ ἐσχίσθη ⸂ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο⸃, καὶ ἡ γῆ ἐσείσθη, καὶ αἱ πέτραι ἐσχίσθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/051.yaml
  text: And behold[a], the curtain of the temple was torn in two from top to bottom, and the earth shook, and the rocks were split.
translation:
  language: fr
  text: Et voici que le rideau du sanctuaire[a] se déchira en deux, du haut jusqu’en bas. La terre trembla et les rochers se fendirent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le voile du Temple ». Le grec désigne le rideau situé dans le sanctuaire du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Cette tournure française naturelle conserve la fonction de mise en relief soudaine et solennelle du marqueur narratif.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: le rideau du sanctuaire
  rationale: καταπέτασμα désigne une tenture ou un rideau, tandis que ναός vise ici le sanctuaire du temple plutôt que l’ensemble de son enceinte. Cette formulation est précise et compréhensible en français moderne.
- source_word: ἐσχίσθη
  choice: se déchira
  rationale: Le verbe convient naturellement à un tissu et restitue l’événement sans nommer d’agent, comme le passif grec.
- source_word: ἀπ’ ἄνωθεν ἕως κάτω εἰς δύο
  choice: en deux, du haut jusqu’en bas
  rationale: La formulation idiomatique conserve à la fois le résultat de la déchirure et l’insistance sur sa direction.
- source_word: ἡ γῆ ἐσείσθη
  choice: la terre trembla
  rationale: « La terre » préserve la portée potentiellement large de γῆ, et « trembla » rend naturellement l’événement en français sans alourdir la phrase par un passif formel.
- source_word: αἱ πέτραι ἐσχίσθησαν
  choice: les rochers se fendirent
  rationale: « Rochers » évoque les masses rocheuses appropriées au contexte, et « se fendirent » est l’équivalent français naturel de σχίζω appliqué à la roche.
theological_decisions:
- issue: Signification du rideau déchiré
  choice: Rapporter simplement la déchirure du rideau du sanctuaire, sans en expliciter la portée théologique dans le texte.
  alternative: Présenter explicitement l’événement comme l’ouverture de l’accès à Dieu ou comme un jugement porté sur le système du temple.
  rationale: Le verset décrit le signe sans en donner lui-même l’interprétation. Une traduction descriptive préserve donc la tension théologique et évite d’introduire un commentaire confessionnel.
- issue: Portée de γῆ
  choice: la terre
  alternative: le sol ou le pays
  rationale: Le contexte de signes extraordinaires permet une portée large, mais le terme grec demeure polysémique. « La terre » conserve cette ampleur sans préciser au-delà du texte l’étendue géographique du tremblement.
translation_notes:
  register: Français international moderne, digne et narratif. « Voici que » garde l’effet dramatique sans archaïsme marqué. Le point après « en bas » allège la succession des propositions grecques tout en conservant leur ordre.
