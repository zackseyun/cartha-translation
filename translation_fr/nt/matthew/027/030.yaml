id: MAT.27.30
reference: Matthew 27:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐμπτύσαντες εἰς αὐτὸν ἔλαβον τὸν κάλαμον καὶ ἔτυπτον εἰς τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/030.yaml
  text: And after spitting on him[b][a], they took the reed and kept striking his head.
translation:
  language: fr
  text: Après lui avoir craché dessus, ils prirent le roseau et le frappaient à la tête.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils le frappaient sur la tête ». L’imparfait grec peut mettre en relief une action répétée ou en cours.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπτύσαντες εἰς αὐτόν
  choice: Après lui avoir craché dessus
  rationale: Le participe aoriste exprime une action antérieure aux verbes principaux. Cette tournure française rend naturellement la succession et le sens idiomatique de ἐμπτύω avec εἰς.
- source_word: ἔλαβον
  choice: ils prirent
  rationale: Équivalent direct de l’aoriste de λαμβάνω dans ce contexte narratif.
- source_word: τὸν κάλαμον
  choice: le roseau
  rationale: « Roseau » conserve le sens courant de κάλαμος ainsi que le lien avec l’objet placé auparavant dans la main de Jésus; « bâton » serait plus interprétatif.
- source_word: ἔτυπτον
  choice: se mirent à le frapper
  rationale: L’imparfait grec présente ici les coups comme une action prolongée ou répétée. La tournure choisie l’exprime en français courant sans préciser plus que le texte.
- source_word: εἰς τὴν κεφαλὴν αὐτοῦ
  choice: à la tête
  rationale: Avec τύπτω, la préposition désigne la cible des coups. « Le frapper à la tête » est idiomatique et garde explicitement Jésus comme objet du verbe.
theological_decisions:
- issue: Présentation des mauvais traitements infligés à Jésus
  choice: Décrire concrètement les actes, sans les atténuer ni les amplifier.
  alternative: 'Employer une formulation plus littérale et soutenue: « lui ayant craché dessus, ils prirent le roseau et le frappaient à la tête ».'
  rationale: Le récit souligne l’humiliation et la violence répétée. La traduction conserve cette force tout en restant naturelle et sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Cracher dessus » est idiomatique sans être familier; « se mirent à le frapper » rend lisiblement l’aspect de l’imparfait grec.
