  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἀρχιερεῖς λαβόντες τὰ ἀργύρια εἶπαν· Οὐκ ἔξεστιν βαλεῖν αὐτὰ εἰς τὸν κορβανᾶν, ἐπεὶ τιμὴ αἵματός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/006.yaml
  text: But the chief priests[a], taking the silver pieces, said, “It is not lawful to put them into the temple treasury[b], since they are the price of blood.”
translation:
  language: fr
  text: 'Mais les chefs des prêtres, ayant pris les pièces d’argent, dirent : « Il n’est pas permis de les mettre dans le trésor du temple[a], puisque c’est le prix du sang[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « le corban », terme désignant ici le trésor du temple ou les fonds sacrés.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de l’argent du sang ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεῖς
  choice: chefs des prêtres
  rationale: Désigne les principales autorités sacerdotales; cette formulation française naturelle évite le contresens « grands prêtres », qui pourrait suggérer plusieurs titulaires simultanés de la charge suprême.
- source_word: λαβόντες
  choice: ramassèrent
  rationale: Dans le contexte immédiat, Judas a jeté les pièces dans le sanctuaire; « ramassèrent » exprime naturellement le geste de les prendre là où elles sont tombées.
- source_word: τὰ ἀργύρια
  choice: les pièces d’argent
  rationale: Renvoie au paiement en argent déjà mentionné, sans préciser indûment le type exact de monnaie.
- source_word: Οὐκ ἔξεστιν
  choice: Il n’est pas permis
  rationale: Rend clairement une interdiction fondée sur ce qui est légalement ou religieusement admissible.
- source_word: βαλεῖν
  choice: mettre
  rationale: Dans le contexte d’un dépôt au trésor, « mettre » est plus naturel que le sens littéral « jeter ».
- source_word: κορβανᾶν
  choice: le trésor du temple
  rationale: Communique directement la fonction du terme araméen emprunté par le grec, tout en conservant le terme traditionnel dans une note.
- source_word: ἐπεὶ
  choice: puisque
  rationale: Introduit explicitement la raison donnée par les prêtres.
- source_word: τιμὴ αἵματός
  choice: le prix du sang
  rationale: Préserve l’expression concrète et solennelle du grec ainsi que sa tension morale, sans la réduire d’emblée à l’expression idiomatique « argent du sang ».
theological_decisions:
- issue: Traduction de κορβανᾶν et caractère sacré des fonds
  choice: le trésor du temple
  alternative: le Corban / le trésor
  rationale: Le contexte vise les fonds sacrés du temple. La traduction explicite leur destination sans faire du terme une notion doctrinale technique; la note préserve la forme source.
- issue: Portée de τιμὴ αἵματός
  choice: le prix du sang
  alternative: l’argent du sang / le prix d’une vie
  rationale: La formulation retenue reste proche du grec et laisse subsister l’ambiguïté expressive entre le prix versé en rapport avec la mort de Jésus et une somme souillée par le sang, sans imposer une explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. La phrase conserve le contraste introduit par δέ et le raisonnement légal-religieux des prêtres.
