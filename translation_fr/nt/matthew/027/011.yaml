id: MAT.27.11
reference: Matthew 27:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς ⸀ἐστάθη ἔμπροσθεν τοῦ ἡγεμόνος· καὶ ἐπηρώτησεν αὐτὸν ὁ ἡγεμὼν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ Ἰησοῦς ⸀ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/011.yaml
  text: Jesus stood before the governor[a], and the governor questioned him, saying, “Are you the King of the Jews?” And Jesus said[b], “You say so.”
translation:
  language: fr
  text: 'Jésus se tint devant le gouverneur. Celui-ci l’interrogea : « Es-tu le roi des Juifs[a] ? » Jésus dit : « C’est toi qui le dis[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens ». Le terme grec peut désigner les Juifs en général ou, selon le contexte, les habitants de la Judée.
    reason: lexical_alternative
  - marker: b
    text: Ou « Tu le dis » ou « C’est comme tu le dis ». En grec, la réponse de Jésus est concise et quelque peu elliptique.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐστάθη
  choice: se tint
  rationale: Le passé simple rend l’aoriste narratif sans introduire l’idée que Jésus aurait été contraint de se tenir là. Cette formulation conserve aussi la scène où il se tient devant l’autorité romaine.
- source_word: ἔμπροσθεν
  choice: devant
  rationale: Équivalent français direct, naturel et adapté au cadre judiciaire.
- source_word: ἡγεμών / ἡγεμόνος
  choice: gouverneur
  rationale: Terme clair et usuel pour le représentant romain dans ce contexte; « préfet » serait historiquement plus technique et « dirigeant » trop général.
- source_word: ἐπηρώτησεν
  choice: interrogea
  rationale: Le verbe convient à une question posée dans un cadre officiel, sans la force excessive que pourrait suggérer un interrogatoire prolongé.
- source_word: λέγων
  choice: introduit par les deux-points
  rationale: En français, les deux-points rendent naturellement la fonction du participe avant le discours direct, sans le calque pesant « en disant ».
- source_word: βασιλεὺς
  choice: roi
  rationale: Équivalent direct du titre royal. La minuscule suit l’usage typographique normal du français.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Dans l’accusation politique du récit de la Passion, cette traduction est la plus naturelle et la plus largement comprise. « Judéens » reste lexicalement possible et est signalé en note.
- source_word: ἔφη
  choice: dit
  rationale: Rend directement le verbe introducteur sans ajouter une nuance absente; le contexte indique déjà qu’il s’agit d’une réponse.
- source_word: Σὺ λέγεις
  choice: C’est toi qui le dis
  rationale: Cette formule française concise conserve l’accent porté sur « toi » ainsi que le caractère elliptique et mesuré de la réponse, sans la transformer en affirmation entièrement explicite.
theological_decisions:
- issue: Nuance de la réponse de Jésus Σὺ λέγεις
  choice: 'Une réponse indirecte et mesurée : « C’est toi qui le dis. »'
  alternative: 'Une affirmation plus explicite : « C’est comme tu le dis. »; ou une formulation plus littérale : « Tu le dis. »'
  rationale: Le grec ne constitue ni un simple démenti ni une affirmation développée dans les termes politiques du gouverneur. La traduction maintient cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition grecque de « gouverneur » est allégée par « Celui-ci », sans ambiguïté sur le référent. Les marqueurs de note sont placés sur les expressions auxquelles leurs notes se rapportent.
