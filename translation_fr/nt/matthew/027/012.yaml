id: MAT.27.12
reference: Matthew 27:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ κατηγορεῖσθαι αὐτὸν ὑπὸ τῶν ἀρχιερέων ⸀καὶ πρεσβυτέρων οὐδὲν ἀπεκρίνατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/012.yaml
  text: And while he was being accused by the chief priests and elders[a], he answered nothing.
translation:
  language: fr
  text: Et pendant que les grands prêtres et les anciens l’accusaient, il ne répondit rien.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne donna aucune réponse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ κατηγορεῖσθαι
  choice: pendant que … l’accusaient
  rationale: La construction ἐν + infinitif substantivé exprime ici la simultanéité. L’imparfait français rend naturellement le déroulement de l’accusation et le passif grec peut être idiomatiquement exprimé à l’actif en nommant les agents.
- source_word: κατηγορεῖσθαι
  choice: l’accusaient
  rationale: Le verbe désigne le fait de porter des accusations contre quelqu’un. « Accusaient » convient au contexte judiciaire et reste courant en français moderne.
- source_word: ὑπὸ τῶν ἀρχιερέων καὶ πρεσβυτέρων
  choice: les chefs des prêtres et les anciens
  rationale: Dans les Évangiles, ἀρχιερεῖς désigne les principaux responsables sacerdotaux, non plusieurs titulaires simultanés de la fonction unique de grand prêtre. « Les chefs des prêtres » est clair et précis; « les anciens » conserve le titre collectif πρεσβύτεροι.
- source_word: οὐδὲν
  choice: rien
  rationale: Employé avec ἀπεκρίνατο, οὐδέν signifie directement « rien ». Cette formulation conserve la concision du grec.
- source_word: ἀπεκρίνατο
  choice: il ne répondit
  rationale: L’aoriste déponent est rendu naturellement par le passé simple narratif. Avec οὐδέν, « il ne répondit rien » reproduit directement la construction grecque sans l’expliciter davantage.
- source_word: καὶ
  choice: Et
  rationale: La conjonction poursuit simplement le récit, sans imposer un contraste absent du grec.
theological_decisions:
- issue: Le silence de Jésus devant ses accusateurs
  choice: 'Présenter sobrement le fait narratif : « il ne répondit rien »'
  alternative: Employer une formulation interprétative évoquant plus explicitement Ésaïe 53, telle que « il garda le silence »
  rationale: Le verset décrit le silence de Jésus sous l’accusation sans déclarer explicitement qu’il accomplit une prophétie. La traduction ne doit pas ajouter cette interprétation théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique soutenu tout en restant compréhensible. La phrase conserve l’ouverture par « Et » ainsi que la sobriété du texte grec.
