id: MAT.27.22
reference: Matthew 27:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Πιλᾶτος· Τί οὖν ποιήσω Ἰησοῦν τὸν λεγόμενον χριστόν; ⸀λέγουσιν πάντες· Σταυρωθήτω.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/022.yaml
  text: Pilate said to them[a], “What then should I do with Jesus who is called Messiah?” They all said, “Let him be crucified.”
translation:
  language: fr
  text: 'Pilate leur dit : « Que ferai-je donc de Jésus, celui qu’on appelle le Messie[a] ? » Tous répondirent : « Qu’il soit crucifié ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ».'
    reason: Signale l’autre traduction française traditionnelle du titre grec Χριστός sans effacer son sens messianique.
lexical_decisions:
- source_word: Τί οὖν ποιήσω
  choice: Que ferai-je donc
  rationale: Le subjonctif aoriste ποιήσω est employé dans une question délibérative. En français, le futur interrogatif « Que ferai-je donc ? » exprime naturellement cette délibération, tandis que « donc » rend la valeur inférentielle de οὖν.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: τὸν λεγόμενον χριστόν
  choice: celui qu’on appelle le Messie[a]
  rationale: Le participe passif attributif λεγόμενον est rendu par « qu’on appelle ». Ici, χριστόν fonctionne comme un titre ; « le Messie » en communique le sens et conserve le cadre juif du passage.
- source_word: λέγει αὐτοῖς ὁ Πιλᾶτος
  choice: Pilate leur dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit écrit en français. L’ordre des mots est adapté à l’usage français.
- source_word: λέγουσιν πάντες
  choice: Tous répondirent
  rationale: Le présent historique est rendu au passé simple. Dans ce dialogue, « répondirent » explicite naturellement la fonction de leur prise de parole, et « Tous » préserve la portée collective de πάντες.
- source_word: Σταυρωθήτω
  choice: Qu’il soit crucifié !
  rationale: Cette formulation conserve à la fois la force injonctive et la voix passive de l’impératif aoriste grec à la troisième personne.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans l’expression « celui qu’on appelle… », Χριστός fonctionne clairement comme un titre plutôt que comme un élément du nom de Jésus. « Messie » en rend le sens ; « Christ », forme traditionnelle issue du grec, est signalé en note comme autre traduction possible.
translation_notes:
  register: Français international moderne, digne et fluide. Le passé simple convient au registre narratif biblique sans être archaïque. L’exclamation finale restitue la vigueur de l’ordre collectif.
