id: MAT.27.57
reference: Matthew 27:57
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὀψίας δὲ γενομένης ἦλθεν ἄνθρωπος πλούσιος ἀπὸ Ἁριμαθαίας, τοὔνομα Ἰωσήφ, ὃς καὶ αὐτὸς ⸀ἐμαθητεύθη τῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/057.yaml
  text: When evening had come[a], a rich man from Arimathea came, named Joseph[b], who himself also had become a disciple of Jesus.
translation:
  language: fr
  text: Le soir venu, un homme riche d’Arimathée arriva, du nom de Joseph ; lui aussi était devenu disciple de Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avait été fait disciple par Jésus » ; ou : « était lui aussi disciple de Jésus ».'
    reason: Le passif ἐμαθητεύθη peut exprimer le fait de devenir disciple, d’être fait disciple, ou, selon le contexte, simplement l’état de disciple.
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: Le soir venu
  rationale: Le génitif absolu marque le moment et la transition narrative. Cette tournure française, naturelle et concise, garde l’idée que le soir était arrivé sans ajouter un adverbe temporel absent du grec.
- source_word: ἦλθεν
  choice: arriva
  rationale: Dans ce contexte de déplacement et d’entrée en scène, « arriva » rend naturellement l’aoriste de ἔρχομαι.
- source_word: ἄνθρωπος πλούσιος
  choice: un homme riche
  rationale: Équivalent direct, courant et fidèle du groupe nominal grec.
- source_word: ἀπὸ Ἁριμαθαίας
  choice: d’Arimathée
  rationale: La préposition ἀπό exprime ici l’origine géographique ; en français, « d’Arimathée » est plus naturel que « venant d’Arimathée » dans cette construction.
- source_word: τοὔνομα Ἰωσήφ
  choice: du nom de Joseph
  rationale: Rend de façon idiomatique l’expression grecque qui présente le nom de l’homme.
- source_word: ὃς καὶ αὐτὸς
  choice: lui aussi
  rationale: 'Conserve l’insistance conjointe de καί et αὐτός : Joseph appartenait lui aussi au groupe des disciples.'
- source_word: ἐμαθητεύθη τῷ Ἰησοῦ
  choice: était devenu disciple de Jésus
  rationale: Le passif de μαθητεύω peut désigner l’entrée dans l’état de disciple ou le fait d’avoir été fait disciple. La formulation retenue est claire en français, garde la valeur résultative et n’impose pas le mécanisme de cette entrée dans la condition de disciple.
theological_decisions:
- issue: Sens du passif ἐμαθητεύθη dans son rapport à Jésus
  choice: était devenu disciple de Jésus
  alternative: avait été fait disciple par Jésus ; était lui aussi disciple de Jésus
  rationale: Le grec peut mettre l’accent soit sur l’entrée de Joseph dans la condition de disciple, soit sur le fait d’avoir été formé ou fait disciple. Le texte principal exprime son nouvel état sans trancher la manière dont il y est entré ; la note conserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, sobre et narratif. Le point-virgule évite une longue proposition relative peu naturelle tout en maintenant l’unité de la phrase grecque et en faisant ressortir « lui aussi ». Le marqueur [a] est placé immédiatement après l’expression concernée.
