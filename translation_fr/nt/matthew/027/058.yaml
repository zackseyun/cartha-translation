  text: οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ. τότε ὁ Πιλᾶτος ἐκέλευσεν ⸀ἀποδοθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/058.yaml
  text: He went to Pilate and asked for the body of Jesus[a]. Then Pilate ordered it to be given to him.
translation:
  language: fr
  text: Il alla trouver Pilate et demanda le corps de Jésus. Alors Pilate ordonna qu’on le lui remette[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que le corps lui soit remis ». Le grec emploie ici un infinitif passif qui peut aussi se rendre par « qu’il lui soit livré ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Il
  rationale: Le démonstratif renvoie à Joseph d’Arimathée, nommé au verset précédent. En français narratif, le pronom « Il » est naturel lorsque le référent est clair.
- source_word: προσελθὼν
  choice: alla trouver
  rationale: Le participe aoriste exprime une démarche préalable auprès de Pilate. « Alla trouver » rend naturellement le mouvement vers lui et l’idée de se présenter à lui.
- source_word: ᾐτήσατο
  choice: demanda
  rationale: Dans cette construction avec un objet direct, le verbe signifie demander à recevoir quelque chose. « Demanda le corps » est idiomatique et précis en français.
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: le corps de Jésus
  rationale: « Corps » correspond directement à σῶμα et convient au registre digne du récit, sans la connotation plus clinique de « cadavre ».
- source_word: τότε
  choice: Alors
  rationale: Le terme marque ici l’étape suivante du récit. « Alors » assure un enchaînement narratif naturel.
- source_word: ἐκέλευσεν
  choice: ordonna
  rationale: Le verbe désigne le fait de donner un ordre, notamment dans un cadre d’autorité administrative.
- source_word: ἀποδοθῆναι
  choice: qu’on le lui remette
  rationale: L’infinitif passif exprime la remise du corps. La tournure française active indéfinie est naturelle, tandis que « lui » explicite le destinataire clairement impliqué par la demande de Joseph.
