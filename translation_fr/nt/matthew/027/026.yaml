source:
  edition: SBLGNT
  text: τότε ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, τὸν δὲ Ἰησοῦν φραγελλώσας παρέδωκεν ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/026.yaml
  text: Then he released Barabbas to them[a], but after flogging Jesus, he handed him over to be crucified.
translation:
  language: fr
  text: Alors il leur relâcha Barabbas ; mais, après avoir fait flageller Jésus, il le livra pour qu’il soit crucifié.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec désigne ici le châtiment romain de la flagellation ; on peut aussi traduire : « après avoir fait fouetter Jésus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement la progression du récit en français moderne.
- source_word: ἀπέλυσεν αὐτοῖς
  choice: il leur relâcha
  rationale: Dans ce contexte judiciaire, le verbe désigne la remise en liberté d’un prisonnier ; le pronom datif est rendu directement par « leur ».
- source_word: τὸν Βαραββᾶν
  choice: Barabbas
  rationale: Translittération française traditionnelle du nom propre.
- source_word: τὸν δὲ Ἰησοῦν
  choice: mais… Jésus
  rationale: « Mais » fait ressortir le contraste entre la libération de Barabbas et le traitement infligé à Jésus.
- source_word: φραγελλώσας
  choice: après avoir fait fouetter
  rationale: Le participe aoriste indique ici une action antérieure à celle du verbe principal. La tournure causative rend probable l’exécution de la peine par les soldats sous l’autorité de Pilate.
- source_word: παρέδωκεν
  choice: il le livra
  rationale: « Livrer » exprime de manière concise le fait de remettre Jésus en vue du sort indiqué ensuite.
- source_word: ἵνα σταυρωθῇ
  choice: pour qu’il soit crucifié
  rationale: Rend explicitement la construction de but avec ἵνα et le passif, sans préciser au-delà du texte l’identité des exécutants.
theological_decisions:
- issue: Ordre des actes et responsabilité dans la condamnation de Jésus
  choice: Pilate fait fouetter Jésus avant de le livrer pour qu’il soit crucifié.
  alternative: Pilate livre Jésus, qui est ensuite fouetté.
  rationale: Le participe aoriste φραγελλώσας se rapporte au sujet de παρέδωκεν et présente normalement le fouet comme antérieur à la remise de Jésus. La traduction conserve cet ordre sans développer la procédure romaine.
translation_notes:
  register: Français international moderne, clair et digne. « Fouetter » est plus immédiatement compréhensible que « flageller », tandis que la note conserve le terme traditionnel et précise le contexte romain. Le passé simple convient au registre narratif biblique écrit sans être archaïque.
