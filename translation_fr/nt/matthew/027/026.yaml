  naturalness: La phrase est fluide et convient au français biblique moderne. « Relâcha » est correct dans un contexte judiciaire narratif, bien qu’un peu soutenu ; il reste clair et naturel ici. Le remplacement de « fouetter » par « flageller » conserve un registre digne sans devenir archaïque.
  terminology: Les noms propres et « crucifié » sont conformes aux usages français. « Flageller » est le terme le plus précis pour le châtiment romain évoqué par φραγελλόω. La note propose correctement « fouetter » comme formulation plus générale, sans imposer de détail historique ou doctrinal.
