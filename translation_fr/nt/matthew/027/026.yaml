  rationale: La révision remplace « faire fouetter » par « faire flageller » afin de mieux refléter la précision du grec φραγελλώσας. La construction causative française exprime naturellement l’acte accompli sous l’autorité de Pilate sans prétendre qu’il a exécuté lui-même le supplice. La note conserve l’alternative plus courante « fouetter » et donne le contexte lexical nécessaire.
