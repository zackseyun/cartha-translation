reference: Matthew 27:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπέθηκαν ἐπάνω τῆς κεφαλῆς αὐτοῦ τὴν αἰτίαν αὐτοῦ γεγραμμένην· Οὗτός ἐστιν Ἰησοῦς ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/037.yaml
  text: 'And they placed above his head the charge against him[a], written: “This is Jesus[b], the King of the Jews.”'
translation:
  language: fr
  text: 'Ils placèrent au-dessus de sa tête l’accusation portée contre lui[a], ainsi rédigée : « Celui-ci est Jésus, le roi des Juifs[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le chef d’accusation retenu contre lui ». Le mot grec a ici un sens judiciaire.
    reason: lexical_alternative
  - marker: b
    text: Ou « le roi des Judéens ». Le terme grec peut désigner les Juifs ou les Judéens selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπέθηκαν
  choice: ils placèrent
  rationale: L’aoriste décrit l’action concrète de placer l’écriteau; « placèrent » est naturel et précis.
- source_word: ἐπάνω τῆς κεφαλῆς αὐτοῦ
  choice: au-dessus de sa tête
  rationale: ἐπάνω suivi du génitif exprime ici une position au-dessus de la tête, et non un contact avec elle.
- source_word: τὴν αἰτίαν αὐτοῦ
  choice: le motif de sa condamnation
  rationale: Dans ce contexte judiciaire, αἰτία désigne le motif ou chef retenu contre Jésus. Cette formulation française évoque clairement la raison officielle de son exécution sans surinterpréter le terme.
- source_word: γεγραμμένην
  choice: ainsi rédigé
  rationale: Le participe parfait passif indique que le motif figurait sous forme écrite; « ainsi rédigé » introduit naturellement le texte de l’écriteau.
- source_word: Οὗτός ἐστιν Ἰησοῦς
  choice: Celui-ci est Jésus
  rationale: Cette formulation conserve le démonstratif explicite et la tournure directe de l’inscription grecque.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: le roi des Juifs
  rationale: La formulation garde le titre royal et le sens traditionnel de Ἰουδαίων dans l’accusation politique portée lors de la Passion.
theological_decisions:
- issue: Sens judiciaire de αἰτία
  choice: le motif de sa condamnation
  alternative: l’accusation portée contre lui
  rationale: Le contexte présente l’écriteau comme indiquant le fondement officiel de l’exécution. Le choix principal est idiomatique en français et conserve la portée judiciaire; la note maintient l’autre traduction directe possible.
- issue: Sens de Ἰουδαίων dans le titre
  choice: les Juifs
  alternative: les Judéens
  rationale: Dans la formule royale et politique de l’inscription, « les Juifs » demeure le rendu français établi et contextuellement adéquat. « Les Judéens » reste lexicalement possible et est signalé sans imposer cette lecture.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans archaïsme excessif. Les notes préservent les ambiguïtés lexicales réelles de αἰτία et Ἰουδαίων.
