id: MAT.27.10
reference: Matthew 27:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔδωκαν αὐτὰ εἰς τὸν ἀγρὸν τοῦ κεραμέως, καθὰ συνέταξέν μοι κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/010.yaml
  text: and they gave them for the potter's field[b][a], just as the Lord directed me.
translation:
  language: fr
  text: et ils les donnèrent pour le champ du potier, comme le Seigneur me l’avait ordonné.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « me l’avait prescrit » ou « me l’avait commandé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν
  choice: ils les donnèrent
  rationale: L’aoriste de δίδωμι signifie simplement « donner ». Dans ce contexte, l’expression désigne l’affectation des pièces d’argent au paiement du champ sans remplacer le verbe grec par un terme plus interprétatif comme « acheter ».
- source_word: αὐτὰ
  choice: les
  rationale: Le pronom neutre pluriel renvoie aux pièces d’argent du contexte. Le pronom français pluriel en conserve clairement le référent.
- source_word: εἰς τὸν ἀγρὸν
  choice: pour le champ
  rationale: Avec δίδωμι dans ce contexte de transaction, εἰς exprime la destination ou l’emploi de l’argent. « Pour le champ » est idiomatique en français tout en restant proche du sens.
- source_word: τοῦ κεραμέως
  choice: du potier
  rationale: 'Le génitif indique ici l’association ou la possession : « le champ du potier ».'
- source_word: καθὰ
  choice: comme
  rationale: Le terme introduit la conformité à ce que le Seigneur avait prescrit. « Comme » rend naturellement cette valeur comparative.
- source_word: συνέταξέν
  choice: avait ordonné
  rationale: συντάσσω peut signifier « ordonner, prescrire, donner des instructions ». « Ordonner » conserve la force de l’instruction autoritative et convient à l’antériorité exprimée naturellement en français dans ce récit.
- source_word: μοι
  choice: me
  rationale: Le datif de la première personne est explicitement conservé, malgré la tension qu’il crée avec le cadre narratif de la citation.
- source_word: κύριος
  choice: le Seigneur
  rationale: κύριος désigne ici le Seigneur et porte l’article dans le texte grec ; « le Seigneur » est donc approprié.
theological_decisions:
- issue: Référence du locuteur dans la citation ou l’allusion prophétique
  choice: Conserver la première personne « me » telle qu’elle figure dans le grec.
  alternative: Adapter la formulation au contexte narratif ou à la formulation de la source vétérotestamentaire.
  rationale: Le texte grec porte μοι (« me »). Le conserver évite d’harmoniser la citation et maintient la tension liée à l’usage que Matthieu fait du texte prophétique.
translation_notes:
  register: Français moderne, courant et digne. Le plus-que-parfait « avait ordonné » explicite naturellement en français que l’ordre du Seigneur précède l’action rapportée. La première personne « me » est maintenue sans harmonisation.
