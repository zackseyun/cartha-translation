  yaml_path: translation/nt/matthew/027/059.yaml
  text: And Joseph took the body and wrapped it in a clean linen cloth[b][a],
translation:
  language: fr
  text: Joseph prit le corps et l’enveloppa dans une toile de lin propre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans un linceul propre ». Le terme grec peut désigner une toile de lin utilisée comme étoffe funéraire.'
