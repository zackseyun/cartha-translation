lexical_decisions:
- source_word: λαβὼν
  choice: prit
  rationale: Le participe aoriste exprime une action antérieure au verbe principal. En français narratif, deux verbes coordonnés rendent naturellement la succession des actions.
- source_word: τὸ σῶμα
  choice: le corps
  rationale: Le grec porte l’article défini sans possessif explicite. « Le corps » suit directement la formulation grecque, le contexte identifiant clairement le corps comme celui de Jésus.
- source_word: ἐνετύλιξεν
  choice: l’enveloppa
  rationale: Le verbe signifie envelopper ou entourer d’une étoffe. « Enveloppa » est naturel et précis dans ce contexte funéraire.
- source_word: αὐτό
  choice: l’
  rationale: Le pronom grec neutre reprend grammaticalement σῶμα. En français, « corps » est masculin et le pronom élidé « l’ » convient aussi bien au référent grammatical qu’à la personne de Jésus, sans qu’une variante soit nécessaire.
- source_word: σινδόνι
  choice: dans une toile de lin
  rationale: Le terme désigne une étoffe de lin, notamment susceptible de servir de tissu funéraire. « Toile de lin » conserve le sens concret sans imposer la précision contextuelle de « linceul ».
- source_word: καθαρᾷ
  choice: propre
  rationale: Dans ce contexte, l’adjectif qualifie naturellement la toile comme propre. « Pure » serait possible lexicalement, mais moins idiomatique ici.
- source_word: καὶ ... ὁ Ἰωσὴφ
  choice: Joseph
  rationale: La conjonction relie cette action au récit précédent. En français moderne, son omission en tête de phrase produit un enchaînement plus naturel sans perdre la relation narrative.
