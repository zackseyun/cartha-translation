id: MAT.27.34
reference: Matthew 27:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔδωκαν αὐτῷ πιεῖν ⸀οἶνον μετὰ χολῆς μεμιγμένον· καὶ γευσάμενος οὐκ ⸀ἠθέλησεν πιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/034.yaml
  text: They gave him wine mixed with gall to drink[a], but after tasting it, he was unwilling to drink.
translation:
  language: fr
  text: Ils lui donnèrent à boire du vin mêlé de fiel[a] ; mais, après l’avoir goûté, il ne voulut pas en boire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner le « fiel » ou, plus généralement, une substance amère. « Fiel » conserve la formulation de Matthieu ; voir le récit parallèle en Marc 15.23, qui mentionne de la myrrhe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκαν αὐτῷ πιεῖν
  choice: Ils lui donnèrent à boire
  rationale: Rend directement le verbe « donner », son complément indirect et l’infinitif, dans une tournure française naturelle.
- source_word: οἶνον
  choice: du vin
  rationale: Correspond au sens ordinaire du terme grec, sans le généraliser en « boisson ».
- source_word: μετὰ χολῆς μεμιγμένον
  choice: mêlé de fiel
  rationale: « Mêlé » exprime clairement le participe passif ; « fiel » conserve la portée concrète ou amère de χολή ainsi que l’écho scripturaire possible.
- source_word: καὶ γευσάμενος
  choice: mais, après l’avoir goûté
  rationale: Le participe marque l’antériorité. « Mais » explicite naturellement le contraste narratif introduit ici par καί.
- source_word: οὐκ ἠθέλησεν πιεῖν
  choice: il ne voulut pas en boire
  rationale: Préserve la nuance de volonté de θέλω sans renforcer le texte jusqu’à « il refusa » ; « en » reprend naturellement le vin en français.
theological_decisions:
- issue: Sens de χολή dans le récit de la Passion et possible résonance scripturaire
  choice: fiel
  alternative: substance amère
  rationale: χόλη peut désigner le fiel ou, plus largement, une substance amère. « Fiel » maintient la formulation propre à Matthieu et sa possible résonance scripturaire, sans harmoniser le passage avec Marc 15.23.
translation_notes:
  register: Français moderne, courant et digne. La formulation reste proche de la syntaxe grecque tout en évitant une tournure artificielle ; « ne voulut pas » conserve la nuance volitive du texte.
