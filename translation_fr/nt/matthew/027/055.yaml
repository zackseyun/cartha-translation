id: MAT.27.55
reference: Matthew 27:55
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐκεῖ γυναῖκες πολλαὶ ἀπὸ μακρόθεν θεωροῦσαι, αἵτινες ἠκολούθησαν τῷ Ἰησοῦ ἀπὸ τῆς Γαλιλαίας διακονοῦσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/055.yaml
  text: There were many women there[a], watching from a distance, who had followed Jesus from Galilee[b], serving him.
translation:
  language: fr
  text: Il y avait là beaucoup de femmes qui regardaient de loin[a] ; elles avaient suivi Jésus depuis la Galilée en le servant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « observaient à distance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le verbe grec peut désigner un service concret ou le soutien apporté à quelqu’un ; autre traduction : « en prenant soin de lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ ἐκεῖ
  choice: Il y avait là
  rationale: L’imparfait rend l’existence et la présence des femmes dans la scène. « Là » traduit simplement ἐκεῖ, tandis que le léger lien discursif de δέ n’exige pas nécessairement un connecteur explicite en français.
- source_word: γυναῖκες πολλαὶ
  choice: beaucoup de femmes
  rationale: Rendu direct et naturel qui conserve le nombre indéfini important et le genre du groupe.
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: qui regardaient de loin
  rationale: L’imparfait exprime l’observation continue indiquée par le participe présent ; « de loin » conserve nettement la séparation spatiale.
- source_word: αἵτινες ἠκολούθησαν τῷ Ἰησοῦ
  choice: elles avaient suivi Jésus
  rationale: Une nouvelle proposition évite une longue accumulation de relatives. Le plus-que-parfait situe leur accompagnement avant la scène présente, et « suivre Jésus » rend naturellement la construction grecque au datif.
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: depuis la Galilée
  rationale: Cette expression indique la Galilée comme point de départ de leur accompagnement, sans ajouter qu’elles en étaient nécessairement originaires.
- source_word: διακονοῦσαι αὐτῷ
  choice: en le servant
  rationale: Le gérondif maintient le lien avec leur accompagnement de Jésus. « Servir » reste assez large pour inclure aide concrète et soutien, sans suggérer à tort une fonction ecclésiastique officielle.
theological_decisions:
- issue: Nature du service rendu par les femmes
  choice: en le servant
  alternative: en prenant soin de lui
  rationale: διακονέω peut couvrir diverses formes de service concret et de soutien. Le texte ne précise ni les tâches accomplies ni un office institutionnel ; la traduction conserve donc cette largeur de sens.
- issue: Rapport temporel entre leur accompagnement et la scène de la crucifixion
  choice: elles avaient suivi Jésus depuis la Galilée
  alternative: elles suivaient Jésus depuis la Galilée
  rationale: Le plus-que-parfait marque naturellement que le parcours commencé en Galilée précède leur présence à la crucifixion, sans nier que leur attachement à Jésus se prolonge dans la scène.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est divisée par un point-virgule afin d’éviter une relative lourde tout en maintenant l’unité de la scène. Le vocabulaire reste courant, sans coloration ecclésiastique ajoutée.
