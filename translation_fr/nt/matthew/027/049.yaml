  text: οἱ δὲ λοιποὶ ⸀ἔλεγον· Ἄφες ἴδωμεν εἰ ἔρχεται Ἠλίας σώσων ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/049.yaml
  text: But the rest said[a], “Leave him alone[b]. Let us see whether Elijah is coming to save him.”
translation:
  language: fr
  text: 'Mais les autres disaient[a] : « Laisse[b]. Voyons si Élie vient le sauver. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ceux qui restaient disaient ».'
    reason: lexical_alternative
  - marker: b
    text: Litt. « Laisse ». L’objet n’est pas exprimé en grec ; dans le contexte, on peut comprendre « Laisse-le » ou « Laisse faire ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ
  choice: Mais les autres
  rationale: « Les autres » est naturel en français et exprime le groupe restant en contraste avec la personne qui vient d’agir; δέ est rendu par « mais ».
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec est naturellement rendu par l’imparfait français, qui préserve l’arrière-plan duratif ou éventuellement répété sans le préciser davantage.
- source_word: Ἄφες
  choice: Laisse-le
  rationale: L’impératif singulier signifie littéralement « laisse ». Le pronom « le », fourni par le contexte, peut viser Jésus et donne une formulation française concise, tout en laissant la note signaler une autre compréhension possible.
- source_word: ἴδωμεν
  choice: Voyons
  rationale: Le subjonctif exhortatif à la première personne du pluriel se rend idiomatiquement par « Voyons ».
- source_word: εἰ ἔρχεται
  choice: si Élie vient
  rationale: Dans cette interrogation indirecte, εἰ correspond naturellement à « si ». Le présent « vient » conserve l’immédiateté du grec sans imposer explicitement un futur.
- source_word: Ἠλίας
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: σώσων αὐτόν
  choice: le sauver
  rationale: Le participe futur exprime ici le but associé au verbe de mouvement. « Sauver » conserve le lien lexical avec σῴζω et l’ironie narrative, tout en désignant dans le contexte une délivrance physique.
theological_decisions:
- issue: Portée théologique possible de σῴζω dans le récit de la crucifixion
  choice: « le sauver », au sens immédiat de le délivrer de la mort
  alternative: « le secourir » ou « le délivrer »
  rationale: Les locuteurs envisagent une intervention visible d’Élie. « Sauver » respecte néanmoins le terme grec et préserve l’ironie théologique du récit sans la développer ni la résoudre.
- issue: Référent implicite de l’impératif Ἄφες
  choice: « Laisse-le »
  alternative: « Laisse faire »
  rationale: Le grec ne formule pas l’objet. Le contexte permet de comprendre soit qu’il faut laisser Jésus tranquille, soit qu’il faut laisser l’action se poursuivre. Le texte principal adopte une formulation directe et la note conserve l’ambiguïté pertinente.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait « disaient » reflète l’aspect du récit grec; la phrase brève « Voyons » maintient le ton immédiat et moqueur de la scène.
