  text: Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι· ⸀βασιλεὺς Ἰσραήλ ἐστιν, καταβάτω νῦν ἀπὸ τοῦ σταυροῦ καὶ πιστεύσομεν ἐπ’ ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/042.yaml
  text: He saved others; he cannot save himself. He is the King of Israel; let him come down now from the cross[a], and we will believe in him.
translation:
  language: fr
  text: 'Il a sauvé d’autres personnes, mais il ne peut pas se sauver lui-même ! Il est le roi d’Israël : qu’il descende maintenant de la croix[a], et nous croirons en lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « S’il est le roi d’Israël, qu’il descende maintenant de la croix, et nous croirons en lui. » Certaines traductions explicitent la moquerie en donnant à la phrase une valeur conditionnelle, mais le grec énonce ici directement le titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄλλους ἔσωσεν
  choice: Il en a sauvé d’autres
  rationale: Le pronom « en » rend la tournure française naturelle tout en conservant le contraste entre les autres personnes sauvées et Jésus lui-même. « Sauvé » préserve l’étendue de sens de σῴζω, qui peut évoquer délivrance, guérison ou salut.
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: il ne peut pas se sauver lui-même
  rationale: Cette formulation courante conserve l’incapacité que les moqueurs attribuent à Jésus ainsi que l’insistance du pronom réfléchi.
- source_word: βασιλεὺς Ἰσραήλ ἐστιν
  choice: Il est le roi d’Israël
  rationale: Le grec énonce directement le titre, sans particule conditionnelle. La traduction garde cette assertion sarcastique au lieu d’ajouter « si ».
- source_word: καταβάτω νῦν
  choice: qu’il descende maintenant
  rationale: Le subjonctif français à valeur injonctive rend naturellement l’impératif grec de troisième personne; « maintenant » maintient l’urgence provocatrice de νῦν.
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: de la croix
  rationale: Équivalent français direct et traditionnel de la préposition ἀπό et du nom σταυρός dans ce contexte.
- source_word: πιστεύσομεν ἐπ’ αὐτόν
  choice: nous croirons en lui
  rationale: « Croire en » exprime naturellement en français une foi dirigée vers une personne et correspond à πιστεύω avec ἐπί suivi de l’accusatif.
theological_decisions:
- issue: Formulation de la prétention royale tournée en dérision
  choice: Il est le roi d’Israël
  alternative: S’il est le roi d’Israël
  rationale: Le texte grec présente une proposition nominale directe et non une condition explicite. L’assertion peut porter naturellement une valeur sarcastique dans son contexte; introduire « si » expliciterait une nuance seulement implicite.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation souligne la vigueur de la raillerie sans ajouter d’élément absent du grec. « Roi » reste en minuscule selon l’usage français ordinaire pour les titres et fonctions.
