  to: 'Il a sauvé d’autres personnes, mais il ne peut pas se sauver lui-même ! Il est le roi d’Israël : qu’il descende maintenant de la croix[a], et nous croirons en lui.'
  rationale: La révision supprime « en », qui n’est pas requis par le grec et manque d’antécédent en français. « D’autres personnes » conserve clairement l’indéfini pluriel et le contraste voulu, sans laisser entendre que Jésus aurait sauvé « d’autres parmi » un groupe déjà défini. Le reste du texte et la note préservent correctement l’ambiguïté pragmatique de l’assertion grecque, sans ajouter une condition au texte principal.
