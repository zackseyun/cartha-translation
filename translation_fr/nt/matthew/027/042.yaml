  verdict: revise
  source_fidelity: 'Le sens grec est bien rendu : le contraste entre ceux qu’il a sauvés et lui-même, l’assertion moqueuse « il est le roi d’Israël », l’injonction « qu’il descende », et la promesse de croire en lui sont conservés. Toutefois, « Il en a sauvé d’autres » introduit un pronom partitif sans antécédent explicite et peut suggérer « d’autres parmi eux » plutôt que le complément direct indéfini du grec.'
