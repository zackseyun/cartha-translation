reference: Matthew 27:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ δὲ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι ἔπεισαν τοὺς ὄχλους ἵνα αἰτήσωνται τὸν Βαραββᾶν τὸν δὲ Ἰησοῦν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/020.yaml
  text: But the chief priests and the elders persuaded the crowds to ask for Barabbas[a], but to destroy Jesus.
translation:
  language: fr
  text: Mais les chefs des prêtres et les anciens persuadèrent les foules de demander Barabbas, mais de faire périr Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mettre Jésus à mort ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un contraste avec la suite du récit précédent ; « Mais » le rend naturellement.
- source_word: ἀρχιερεῖς
  choice: chefs des prêtres
  rationale: L’expression désigne les membres dirigeants du sacerdoce de Jérusalem, et non plusieurs grands prêtres en exercice.
- source_word: πρεσβύτεροι
  choice: anciens
  rationale: Dans ce contexte, le terme désigne des responsables reconnus du peuple et conserve sa valeur institutionnelle et historique.
- source_word: ἔπεισαν
  choice: persuadèrent
  rationale: L’aoriste présente comme accomplie l’action d’amener les foules à adopter cette demande.
- source_word: τοὺς ὄχλους
  choice: les foules
  rationale: Le pluriel grec est conservé et évoque les groupes de personnes rassemblées.
- source_word: ἵνα
  choice: de
  rationale: Après « persuader », la proposition grecque exprimant le contenu ou le but se rend idiomatiquement en français par un infinitif introduit par « de ».
- source_word: αἰτήσωνται
  choice: réclamer
  rationale: Le verbe signifie demander ou solliciter ; « réclamer Barabbas » est naturel dans ce contexte public et conserve l’objet personnel sans expliciter sa libération.
- source_word: Βαραββᾶν
  choice: Barabbas
  rationale: Le nom propre suit sa forme française traditionnelle.
- source_word: τὸν δὲ Ἰησοῦν
  choice: mais de faire périr Jésus
  rationale: Le second δέ oppose explicitement le sort demandé pour Jésus au choix de Barabbas.
- source_word: ἀπολέσωσιν
  choice: faire périr
  rationale: Le verbe signifie causer la perte ou la mort de quelqu’un. « Faire périr » conserve cette portée lexicale tout en étant clair dans le contexte.
theological_decisions:
- issue: Sens de ἀπολέσωσιν dans un contexte d’exécution judiciaire
  choice: faire périr Jésus
  alternative: mettre Jésus à mort
  rationale: Le grec emploie un verbe plus large qu’un terme technique d’exécution. « Faire périr » en préserve la force, tandis que la note donne l’interprétation contextuelle plus explicite sans la substituer au texte.
translation_notes:
  register: Français moderne, digne et accessible. La structure contrastive répétée du grec est conservée par les deux occurrences de « mais ». « Réclamer Barabbas » évite d’ajouter explicitement « la libération de », absent du texte grec, tandis que « faire périr » préserve la portée de ἀπόλλυμι.
