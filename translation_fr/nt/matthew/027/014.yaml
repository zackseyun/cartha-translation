revisions:
- from: Mais il ne lui répondit pas, pas même un mot, si bien que le gouverneur fut très étonné.
  to: Il ne lui répondit pas un seul mot, si bien que le gouverneur fut très étonné.
  rationale: La révision retire l’opposition ajoutée par « Mais » et resserre la formulation française de manière idiomatique, sans modifier le sens ni résoudre de façon interprétative la portée de « parole/mot » (ῥῆμα). « Si bien que », « gouverneur », « fut très étonné » conservent correctement le résultat, la fonction de Pilate et l’intensité de sa réaction.
