    issue: « Mais » traduit καί.
    rationale: Le grec porte καί (« et ») et n’exprime pas lui-même un contraste. En français, l’omission de la conjonction est naturelle ; « Mais » introduit une opposition interprétative non marquée dans le texte source.
  - severity: low
    issue: Formulation de l’absence de réponse.
    rationale: « Il ne lui répondit pas un seul mot » est une formulation française plus intégrée qui rend à la fois ἀπεκρίθη αὐτῷ et l’emphase πρὸς οὐδὲ ἓν ῥῆμα, sans en préciser indûment le référent.
  revised_text: Il ne lui répondit pas un seul mot, si bien que le gouverneur fut très étonné.
