id: MAT.27.14
reference: Matthew 27:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκ ἀπεκρίθη αὐτῷ πρὸς οὐδὲ ἓν ῥῆμα, ὥστε θαυμάζειν τὸν ἡγεμόνα λίαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/014.yaml
  text: And he did not answer him with even one word[b][a], so that the governor was greatly amazed.
translation:
  language: fr
  text: Il ne lui répondit pas un seul mot, si bien que le gouverneur fut très étonné.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: L’aoriste de forme passive à sens déponent signifie couramment « répondre ». Le passé simple convient au registre narratif biblique moderne.
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif désigne la personne à qui Jésus ne répond pas, ici Pilate.
- source_word: πρὸς οὐδὲ ἓν ῥῆμα
  choice: pas même un mot
  rationale: Cette formulation naturelle conserve l’insistance de οὐδὲ ἓν et prend ῥῆμα dans son sens courant de « mot » ou « parole », sans le préciser comme une accusation.
- source_word: ὥστε
  choice: si bien que
  rationale: Cette locution introduit clairement le résultat produit par le silence de Jésus.
- source_word: θαυμάζειν
  choice: fut étonné
  rationale: L’infinitif présent dépendant de ὥστε est restructuré en verbe conjugué. « Être étonné » exprime naturellement la vive réaction du gouverneur.
- source_word: τὸν ἡγεμόνα
  choice: le gouverneur
  rationale: Dans le contexte provincial romain, ἡγεμών désigne précisément le gouverneur, Pilate.
- source_word: λίαν
  choice: très
  rationale: L’adverbe marque un degré élevé; « très » le rend simplement et naturellement en français contemporain.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient la fluidité du récit; la reprise « pas même un mot » restitue l’emphase grecque sans lourdeur.
