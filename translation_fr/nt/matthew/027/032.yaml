id: MAT.27.32
reference: Matthew 27:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐξερχόμενοι δὲ εὗρον ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα· τοῦτον ἠγγάρευσαν ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/032.yaml
  text: And as they were going out[a], they found a man of Cyrene named Simon[b]. They compelled him to carry his cross.
translation:
  language: fr
  text: Comme ils sortaient, ils trouvèrent un homme de Cyrène nommé Simon. Ils le réquisitionnèrent pour qu’il porte la croix de Jésus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sa croix »; le pronom renvoie à Jésus.'
    reason: clarification_du_référent
lexical_decisions:
- source_word: Ἐξερχόμενοι δὲ
  choice: Comme ils sortaient
  rationale: Le participe présent a une valeur temporelle et présente la sortie comme contemporaine de l’action principale. Le δέ, simple marque de progression narrative, n’exige pas ici de connecteur explicite en français.
- source_word: εὗρον
  choice: ils trouvèrent
  rationale: L’aoriste narratif est rendu naturellement par le passé simple dans ce registre écrit et digne.
- source_word: ἄνθρωπον Κυρηναῖον ὀνόματι Σίμωνα
  choice: un homme de Cyrène nommé Simon
  rationale: Cette formulation française naturelle conserve l’origine géographique et l’expression idiomatique du nom.
- source_word: τοῦτον ἠγγάρευσαν
  choice: ils le réquisitionnèrent
  rationale: ἀγγαρεύω désigne une contrainte de service imposée par une autorité. « Réquisitionner » exprime avec précision cette contrainte officielle, sans lourde périphrase.
- source_word: ἵνα ἄρῃ
  choice: pour qu’il porte
  rationale: La proposition avec ἵνα exprime le but. Dans le contexte de la marche vers la crucifixion, « porter » rend clairement αἴρω.
- source_word: τὸν σταυρὸν αὐτοῦ
  choice: la croix de Jésus
  rationale: Le pronom αὐτοῦ renvoie contextuellement à Jésus. Le français « sa croix » risquerait de faire de Simon le possesseur à cause du sujet de la proposition; expliciter le référent transmet donc plus sûrement le sens du grec.
theological_decisions:
- issue: Référent de αὐτοῦ (« sa/de lui »)
  choice: Expliciter « la croix de Jésus »
  alternative: « sa croix »
  rationale: Dans le récit, la croix est celle de Jésus, et Simon est contraint de la porter. En français, « pour qu’il porte sa croix » rattacherait spontanément le possessif à Simon; l’explicitation évite une ambiguïté créée par la langue cible plutôt que présente dans le contexte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit biblique écrit. « Réquisitionnèrent » conserve la nuance de service obligatoire imposé par l’autorité.
