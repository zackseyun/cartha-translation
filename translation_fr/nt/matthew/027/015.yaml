id: MAT.27.15
reference: Matthew 27:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κατὰ δὲ ἑορτὴν εἰώθει ὁ ἡγεμὼν ἀπολύειν ἕνα τῷ ὄχλῳ δέσμιον ὃν ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/015.yaml
  text: At the feast the governor was accustomed to release to the crowd one prisoner[a], whom they wanted.
translation:
  language: fr
  text: Lors de la fête, le gouverneur avait coutume de relâcher pour la foule un prisonnier, celui qu’elle voulait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: À chaque fête
  rationale: κατά avec l’accusatif a ici une valeur temporelle. Dans ce contexte de pratique habituelle, « à chaque fête » rend naturellement la récurrence impliquée par εἰώθει. La légère articulation de δέ n’a pas besoin d’être exprimée séparément en français.
- source_word: εἰώθει
  choice: avait coutume de
  rationale: L’imparfait exprime une pratique habituelle passée. « Avait coutume de » est clair, digne et explicite sans être archaïque.
- source_word: ὁ ἡγεμὼν
  choice: le gouverneur
  rationale: Dans ce contexte, ἡγεμών désigne le gouverneur romain; « gouverneur » est le terme français courant et précis.
- source_word: ἀπολύειν
  choice: relâcher
  rationale: Le verbe désigne ici la remise en liberté d’une personne détenue. « Relâcher » convient naturellement au contexte judiciaire.
- source_word: ἕνα ... δέσμιον
  choice: un prisonnier
  rationale: Le numéral souligne qu’un seul prisonnier était relâché. En français, l’article indéfini « un » exprime à la fois ce nombre et l’indétermination sans lourdeur.
- source_word: τῷ ὄχλῳ
  choice: pour la foule
  rationale: Le datif indique la foule comme bénéficiaire ou partie à la demande de laquelle la libération est accordée. « Pour la foule » est plus idiomatique en français que « à la foule », qui pourrait suggérer une remise physique.
- source_word: ὃν ἤθελον
  choice: celui qu’elle voulait
  rationale: Le relatif singulier renvoie au prisonnier choisi. « Celui qu’elle voulait » conserve ce lien et emploie le singulier grammatical correspondant à « la foule ».
theological_decisions: []
translation_notes:
  register: 'Français international moderne, narratif et digne. La formulation conserve la notion de coutume et le rôle de la foule dans le choix, sans ajouter d’explication historique. Aucune note n’est nécessaire: « fête » rend directement ἑορτή, et l’alternative anglaise signalée ne correspond pas à une ambiguïté distincte en français.'
