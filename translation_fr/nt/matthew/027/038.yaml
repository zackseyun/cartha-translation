id: MAT.27.38
reference: Matthew 27:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε σταυροῦνται σὺν αὐτῷ δύο λῃσταί, εἷς ἐκ δεξιῶν καὶ εἷς ἐξ εὐωνύμων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/038.yaml
  text: Then two robbers are crucified with him[a], one on the right and one on the left.
translation:
  language: fr
  text: Alors, deux brigands sont crucifiés avec lui[a], l’un à sa droite et l’autre à sa gauche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bandits »; le terme grec désigne souvent des brigands violents et peut, dans certains contextes, recouvrir une activité insurrectionnelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque l’étape suivante du récit; « Alors » est naturel et concis en français narratif.
- source_word: σταυροῦνται
  choice: sont crucifiés
  rationale: Le présent passif grec produit un effet narratif vivant. Le présent historique français convient ici et conserve le sens passif ainsi que le terme usuel pour la crucifixion.
- source_word: σὺν αὐτῷ
  choice: avec lui
  rationale: Rend directement l’accompagnement exprimé par σύν avec le datif.
- source_word: δύο λῃσταί
  choice: deux brigands
  rationale: « Brigands » peut désigner des malfaiteurs violents et conserve mieux que « voleurs » l’étendue possible du grec, sans imposer l’interprétation plus précise d’« insurgés ».
- source_word: εἷς ἐκ δεξιῶν
  choice: l’un à sa droite
  rationale: Expression spatiale idiomatique en français; le possessif explicite naturellement la position par rapport à Jésus.
- source_word: καὶ εἷς ἐξ εὐωνύμων
  choice: et l’autre à sa gauche
  rationale: Le grec répète « un », mais la tournure corrélative française « l’un… l’autre » exprime clairement et naturellement le contraste spatial.
theological_decisions:
- issue: Identité des λῃσταί
  choice: brigands
  alternative: voleurs; bandits; insurgés
  rationale: Le terme grec peut désigner des brigands ou des bandits violents et parfois recouper une activité insurrectionnelle. Le verset ne permet toutefois pas d’imposer une identité politique précise; « brigands » préserve cette latitude.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent historique conserve la vivacité du récit grec; la formulation évite à la fois l’archaïsme et une précision politique non établie par le verset.
