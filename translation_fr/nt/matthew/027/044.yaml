id: MAT.27.44
reference: Matthew 27:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ δ’ αὐτὸ καὶ οἱ λῃσταὶ οἱ συσταυρωθέντες ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/044.yaml
  text: In the same way[b][a], even the robbers who had been crucified with him were insulting him.
translation:
  language: fr
  text: De la même manière[a], même les bandits crucifiés avec lui l’insultaient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils faisaient la même chose ». L’expression grecque signifie qu’eux aussi le traitaient de la même manière.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’injuriaient » ou « l’accablaient d’insultes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δ’ αὐτὸ
  choice: De la même manière
  rationale: L’expression fonctionne ici de manière adverbiale et renvoie aux moqueries qui viennent d’être rapportées. Cette formulation est naturelle en français tout en gardant l’idée qu’ils agissaient pareillement.
- source_word: καὶ
  choice: même
  rationale: Dans ce contexte, καί a une valeur intensive et souligne que les bandits eux aussi se joignaient aux insultes.
- source_word: λῃσταὶ
  choice: bandits
  rationale: Le terme désigne des brigands ou des bandits. « Bandits » reste clair et évite le terme plus général « criminels », sans imposer une interprétation politique.
- source_word: οἱ συσταυρωθέντες σὺν αὐτῷ
  choice: crucifiés avec lui
  rationale: Le participe passif substantivé identifie les bandits comme ceux qui avaient été crucifiés aux côtés de Jésus. La formulation française concise conserve ce sens.
- source_word: ὠνείδιζον
  choice: l’insultaient
  rationale: L’imparfait grec présente une action en cours ou répétée. L’imparfait français en rend naturellement l’aspect, dans un langage actuel et accessible.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom objet renvoie à Jésus et se traduit directement par le pronom élidé français.
theological_decisions:
- issue: Faut-il harmoniser ce verset avec le récit de Luc, où l’un des malfaiteurs parle ensuite autrement ?
  choice: 'Conserver sans atténuation le pluriel de Matthieu : « les bandits… l’insultaient ».'
  alternative: Employer une formulation vague ou atténuée afin d’éviter la tension apparente entre les récits.
  rationale: Le grec emploie explicitement le pluriel et l’imparfait. La traduction doit préserver la présentation propre à Matthieu sans la modifier pour l’harmoniser avec un autre Évangile.
translation_notes:
  register: Français international moderne, naturel et digne. « Bandits » rend λῃσταί plus précisément que « malfaiteurs » ou « criminels » ; « insultaient » est courant et conserve, grâce à l’imparfait, le caractère continu de l’action.
