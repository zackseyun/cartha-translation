id: MAT.27.54
reference: Matthew 27:54
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δὲ ἑκατόνταρχος καὶ οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν ἰδόντες τὸν σεισμὸν καὶ τὰ ⸀γενόμενα ἐφοβήθησαν σφόδρα λέγοντες· Ἀληθῶς ⸂θεοῦ υἱὸς⸃ ἦν οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/054.yaml
  text: When the centurion and those with him who were guarding Jesus saw the earthquake and the things that had happened[a], they were greatly afraid and said[c][b], “Truly this was the Son of God.”
translation:
  language: fr
  text: 'Quand le centurion et ceux qui, avec lui, gardaient Jésus virent le tremblement de terre et ce qui s’était passé, ils furent saisis d’une très grande peur et dirent : « Vraiment, celui-ci était le Fils de Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un fils de Dieu ». L’expression grecque n’a pas d’article ; dans ce contexte, elle est comprise comme un titre conforme à la manière dont Matthieu présente Jésus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἑκατόνταρχος
  choice: centurion
  rationale: Terme français courant et précis pour cet officier de l’armée romaine.
- source_word: οἱ μετ’ αὐτοῦ τηροῦντες τὸν Ἰησοῦν
  choice: ceux qui étaient avec lui pour garder Jésus
  rationale: Rend à la fois leur présence auprès du centurion et leur fonction de garde, sans réduire τηρέω à une simple observation.
- source_word: ἰδόντες
  choice: quand … virent
  rationale: Le participe aoriste a ici une valeur temporelle, exprimée naturellement en français par une subordonnée introduite par « quand ».
- source_word: τὸν σεισμόν
  choice: le tremblement de terre
  rationale: Sens ordinaire de σεισμός dans ce contexte narratif.
- source_word: τὰ γενόμενα
  choice: ce qui s’était passé
  rationale: Expression française naturelle qui conserve la portée générale de la formule grecque, au-delà du seul tremblement de terre.
- source_word: ἐφοβήθησαν σφόδρα
  choice: ils furent saisis d’une très grande peur
  rationale: Formulation idiomatique qui restitue la forte intensité marquée par σφόδρα.
- source_word: Ἀληθῶς
  choice: Vraiment
  rationale: Conserve la force affirmative et solennelle sans préciser davantage le degré de compréhension théologique des locuteurs.
- source_word: θεοῦ υἱὸς
  choice: le Fils de Dieu
  rationale: Malgré l’absence d’article dans la construction grecque, le contexte christologique de Matthieu favorise le sens défini et titulaire en français.
- source_word: οὗτος
  choice: celui-ci
  rationale: Reproduit le démonstratif grec et l’immédiateté de la déclaration.
theological_decisions:
- issue: Sens de θεοῦ υἱὸς dans la déclaration du centurion et de ses compagnons
  choice: le Fils de Dieu
  alternative: un fils de Dieu
  rationale: La construction sans article peut susciter une lecture indéfinie, mais elle n’impose pas cette lecture. Dans le cadre narratif et christologique de Matthieu, « le Fils de Dieu » rend mieux la valeur qualitative et définie du titre. L’autre possibilité est signalée en note afin de préserver la transparence interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Le récit reste direct ; « centurion » est conservé comme terme historique largement compris. La formulation évite d’ajouter un connecteur temporel absent du grec.
