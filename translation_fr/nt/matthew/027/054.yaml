review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement les principaux éléments : le centurion, le tremblement de terre, les événements survenus, la peur intense, l’affirmation « Vraiment » et le démonstratif « celui-ci ». Toutefois, « ceux qui étaient avec lui pour garder Jésus » donne à « pour garder » une nuance de but (« afin de garder ») plutôt que l’action concomitante exprimée par le participe τηροῦντες (« qui gardaient »).'
  naturalness: Le français est globalement clair, moderne et d’un registre approprié. « Ceux qui, avec lui, gardaient Jésus » est à la fois plus direct et plus proche de la syntaxe et de la valeur du grec.
  terminology: « Centurion », « tremblement de terre » et « le Fils de Dieu » sont appropriés. La note préserve de façon utile la possibilité de comprendre la formule grecque sans article dans un sens indéfini, sans imposer cette lecture.
  issues:
  - severity: medium
    issue: Nuance de « pour garder Jésus »
    rationale: La préposition « pour » présente facilement la garde comme une finalité ou une mission envisagée. Le grec οἱ ... τηροῦντες désigne ceux qui étaient effectivement en train de garder Jésus. Employer « qui ... gardaient Jésus » restitue mieux cette action.
  revised_text: 'Quand le centurion et ceux qui, avec lui, gardaient Jésus virent le tremblement de terre et ce qui s’était passé, ils furent saisis d’une très grande peur et dirent : « Vraiment, celui-ci était le Fils de Dieu[a]. »'
  revised_footnotes:
