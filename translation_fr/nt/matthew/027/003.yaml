id: MAT.27.3
reference: Matthew 27:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τότε ἰδὼν Ἰούδας ὁ ⸀παραδιδοὺς αὐτὸν ὅτι κατεκρίθη μεταμεληθεὶς ⸀ἔστρεψεν τὰ τριάκοντα ἀργύρια τοῖς ἀρχιερεῦσιν ⸀καὶ πρεσβυτέροις
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/003.yaml
  text: Then Judas[a], who had betrayed him, seeing that he had been condemned[b], regretted it and returned the thirty pieces of silver to the chief priests and elders.
translation:
  language: fr
  text: Alors Judas, celui qui l’avait livré, voyant que Jésus avait été condamné, fut pris de remords et rapporta les trente pièces d’argent aux grands prêtres et aux anciens.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession narrative.
- source_word: ἰδὼν
  choice: voyant
  rationale: Conserve avec concision le participe aoriste et son rapport temporel avec l’action principale.
- source_word: Ἰούδας
  choice: Judas
  rationale: Forme française traditionnelle du nom propre.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: celui qui l’avait livré
  rationale: Rend la construction participiale substantivée et le sens contextuel de παραδίδωμι sans imposer le terme plus interprétatif « trahir ».
- source_word: ὅτι κατεκρίθη
  choice: qu’il avait été condamné
  rationale: Le plus-que-parfait passif clarifie que la condamnation de Jésus précède la réaction de Judas.
- source_word: μεταμεληθεὶς
  choice: fut pris de remords
  rationale: Exprime le regret moral ou le remords sans affirmer la pleine repentance que pourrait suggérer « se repentit ».
- source_word: ἔστρεψεν
  choice: rapporta
  rationale: Dans le contexte d’une somme remise à ses anciens détenteurs, « rapporta » est idiomatique et précis.
- source_word: τὰ τριάκοντα ἀργύρια
  choice: les trente pièces d’argent
  rationale: Formulation française claire et consacrée, qui conserve la référence générale à de la monnaie d’argent sans préciser indûment le type de pièces.
- source_word: τοῖς ἀρχιερεῦσιν καὶ πρεσβυτέροις
  choice: aux grands prêtres et aux anciens
  rationale: Désignations françaises usuelles des deux groupes de responsables juifs chez Matthieu.
theological_decisions:
- issue: Portée de μεταμεληθεὶς dans la réaction de Judas
  choice: fut pris de remords
  alternative: se repentit / changea d’avis
  rationale: Le verbe μεταμέλομαι indique ici regret ou remords. La traduction évite de trancher la question théologique de la repentance de Judas au-delà de ce qu’énonce le texte.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure participiale du grec sans devenir artificielle; « celui qui l’avait livré » maintient le lien narratif tout en restant proche du lexique source.
