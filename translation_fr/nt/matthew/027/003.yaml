    issue: Ambiguïté référentielle de « qu’il avait été condamné »
    rationale: Dans la syntaxe française, « il » peut être compris comme renvoyant à Judas, sujet de la proposition principale. Le grec αὐτόν et le contexte visent Jésus. Employer son nom préserve explicitement le référent source.
