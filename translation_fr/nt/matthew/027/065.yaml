id: MAT.27.65
reference: Matthew 27:65
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἔφη αὐτοῖς ὁ Πιλᾶτος· Ἔχετε κουστωδίαν· ὑπάγετε ἀσφαλίσασθε ὡς οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/065.yaml
  text: Pilate said to them[a], “You have a guard. Go[b], make it secure as you know how.”
translation:
  language: fr
  text: 'Pilate leur dit : « Vous avez une garde[a]. Allez, mettez-le en sûreté comme vous savez le faire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Prenez une garde », ou peut-être : « Vous avez votre propre garde. » Le grec peut signifier que Pilate leur accorde une garde ou qu’il évoque une garde déjà à leur disposition.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη αὐτοῖς
  choice: leur dit
  rationale: Formulation narrative française naturelle qui rend le verbe de parole et son complément indirect.
- source_word: Ἔχετε
  choice: Vous avez
  rationale: Le présent de ἔχω est rendu selon son sens lexical direct, sans trancher entre la constatation qu’une garde est déjà disponible et l’autorisation d’en prendre une.
- source_word: κουστωδίαν
  choice: une garde
  rationale: Ce terme emprunté au latin custodia désigne ici un détachement chargé de monter la garde; « une garde » conserve la valeur collective du singulier grec.
- source_word: ὑπάγετε
  choice: Allez
  rationale: Impératif bref et idiomatique exprimant le départ.
- source_word: ἀσφαλίσασθε
  choice: assurez-en la sécurité
  rationale: Cette tournure rend l’idée de mettre le tombeau en sûreté tout en respectant l’absence de complément explicite dans cette proposition grecque; le pronom « en » renvoie naturellement au tombeau mentionné dans le contexte immédiat.
- source_word: ὡς οἴδατε
  choice: comme vous savez le faire
  rationale: Rend la manière conforme à leur savoir pratique, sans transformer explicitement la formule en superlatif de capacité comme « du mieux que vous pouvez ».
theological_decisions:
- issue: La garde est-elle accordée par Pilate ou déjà à la disposition des chefs juifs ?
  choice: Vous avez une garde
  alternative: « Prenez une garde » ou « Vous avez votre propre garde »
  rationale: La forme grecque Ἔχετε peut être comprise comme une affirmation ou, dans le contexte, comme une autorisation. Le texte principal conserve cette ambiguïté historique et narrative, tandis que la note présente les principales possibilités.
translation_notes:
  register: Français international moderne, sobre et digne. « Une garde » est employé au sens collectif d’un détachement. La formulation évite de préciser si cette garde est romaine ou rattachée aux autorités juives, puisque le grec ne tranche pas clairement la question.
