lexical_decisions:
- source_word: οἱ δὲ παραπορευόμενοι
  choice: Et ceux qui passaient par là
  rationale: L’article avec le participe désigne les personnes qui passaient devant le lieu. L’imparfait français rend naturellement l’action en cours, tandis que « Et » traduit δέ comme une liaison narrative légère sans accentuer un contraste.
- source_word: ἐβλασφήμουν αὐτόν
  choice: blasphémaient contre lui
  rationale: L’imparfait restitue l’action répétée ou prolongée. « Blasphémaient contre lui » conserve la force du verbe grec et sa possible portée théologique, tout en signalant en note le sens plus large d’injure ou d’outrage verbal.
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: en secouant la tête
  rationale: Le gérondif exprime la simultanéité du geste avec les paroles. En français, le singulier distributif « la tête » est plus naturel lorsque chaque personne secoue la sienne.
theological_decisions:
- issue: Sens de βλασφημέω lorsqu’il vise Jésus dans le récit de la Passion
  choice: Conserver « blasphémaient contre lui » dans le texte principal
  alternative: « l’injuriaient » ou « l’outrageaient »
  rationale: Le verbe grec peut désigner des paroles injurieuses ou diffamatoires adressées à une personne, mais il est plus fort qu’un simple verbe de moquerie. Le choix principal préserve la diction de Matthieu et sa tension théologique sans déclarer que ce terme prouve à lui seul une conclusion doctrinale; la note prévient une compréhension française trop étroite de « blasphémer ».
translation_notes:
  register: Français international moderne, clair et digne. « Ceux qui passaient par là » reste concret et narratif; « blasphémaient contre lui » conserve volontairement la force et l’ambiguïté théologique du grec. Le singulier distributif « la tête » est idiomatique en français.
