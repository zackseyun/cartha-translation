  text: Et ceux qui passaient par là l’injuriaient[a] en secouant la tête[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « blasphémaient contre lui ». Le verbe grec peut désigner des paroles injurieuses ou diffamatoires, et pas seulement le blasphème au sens étroit de paroles contre Dieu.'
