  text: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς· Τίνα θέλετε ἀπὸ τῶν δύο ἀπολύσω ὑμῖν; οἱ δὲ εἶπαν· ⸀Τὸν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/021.yaml
  text: But the governor answered them, “Which of the two do you want me to release for you?” And they said, “Barabbas.”
translation:
  language: fr
  text: 'Mais le gouverneur leur demanda : « Lequel des deux voulez-vous que je vous relâche ? » Ils répondirent : « Barabbas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἡγεμὼν εἶπεν αὐτοῖς
  choice: Mais le gouverneur leur demanda
  rationale: La construction sémitisante « ayant répondu, il dit » introduit ici la prise de parole du gouverneur. Comme sa phrase est une question, « leur demanda » restitue naturellement en français la fonction de l’ensemble sans la lourdeur de « répondit et dit ».
- source_word: Τίνα ... ἀπὸ τῶν δύο
  choice: Lequel des deux
  rationale: L’interrogatif porte sur un choix entre deux personnes déjà désignées. « Lequel des deux » est précis et idiomatique en français moderne.
- source_word: θέλετε
  choice: voulez-vous
  rationale: Le verbe exprime ici le désir ou la préférence de la foule ; « voulez-vous » conserve la formulation directe.
- source_word: ἀπολύσω ὑμῖν
  choice: que je vous relâche
  rationale: Dans ce contexte judiciaire, ἀπολύω signifie remettre en liberté. Le subjonctif grec dépendant de θέλετε se rend naturellement par « voulez-vous que je… ». Le pronom « vous » représente le datif d’intérêt ὑμῖν.
- source_word: οἱ δὲ εἶπαν
  choice: Ils répondirent
  rationale: Le second δέ assure la progression narrative, sans exiger un connecteur français. Puisque la réplique répond directement à la question, « répondirent » est naturel et fidèle.
- source_word: Τὸν Βαραββᾶν
  choice: Barabbas
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante ; l’article accusatif grec n’a pas besoin d’être reproduit.
theological_decisions: []
translation_notes:
  register: Français international moderne, direct et digne. Le passé simple convient au registre narratif biblique tout en restant clair. La syntaxe évite le calque grec « répondit et dit » et conserve le contraste léger marqué par le premier δέ grâce à « Mais ».
