id: MAT.27.2
reference: Matthew 27:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ δήσαντες αὐτὸν ἀπήγαγον καὶ ⸀παρέδωκαν Πιλάτῳ τῷ ἡγεμόνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/002.yaml
  text: And after binding him[b][a], they led him away and handed him over to Pilate the governor.
translation:
  language: fr
  text: Après l’avoir lié, ils l’emmenèrent et le livrèrent à Pilate, le gouverneur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le préfet ».
    reason: Précision historique possible du titre de Pilate, bien que le grec emploie le terme plus général ἡγεμών.
lexical_decisions:
- source_word: δήσαντες
  choice: Après l’avoir lié
  rationale: Le participe aoriste exprime ici une action antérieure aux verbes principaux. Cette formulation naturelle en français conserve le sens concret d’attacher quelqu’un.
- source_word: ἀπήγαγον
  choice: ils l’emmenèrent
  rationale: ἀπάγω désigne le fait de conduire ou d’emmener quelqu’un. « Ils l’emmenèrent » convient au contexte de transfert sous garde.
- source_word: παρέδωκαν
  choice: le livrèrent
  rationale: παραδίδωμι signifie ici remettre quelqu’un à l’autorité ou à la garde d’un autre. « Livrer » est idiomatique, digne et conserve à la fois la portée judiciaire immédiate et la résonance du terme dans le récit de la Passion.
- source_word: Πιλάτῳ
  choice: à Pilate
  rationale: Le nom propre est rendu selon sa forme française usuelle, avec le datif exprimé par « à ».
- source_word: τῷ ἡγεμόνι
  choice: le gouverneur
  rationale: ἡγεμών désigne un haut responsable politique. « Gouverneur » reflète la portée générale du terme grec sans préciser excessivement le titre historique de Pilate.
- source_word: καὶ … καὶ
  choice: Après… ils… et
  rationale: Le premier καί n’est pas rendu mécaniquement, car l’enchaînement narratif reste clair en français; le second coordonne naturellement les deux verbes principaux.
theological_decisions:
- issue: Portée de παραδίδωμι dans le récit de la Passion
  choice: le livrèrent
  alternative: le remirent
  rationale: « Livrer » préserve la force judiciaire du transfert de Jésus à Pilate ainsi que la possible résonance théologique du verbe, sans expliciter ni résoudre cette tension.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme marqué. La formulation reste concise et accessible.
