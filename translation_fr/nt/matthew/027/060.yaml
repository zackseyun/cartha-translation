id: MAT.27.60
reference: Matthew 27:60
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔθηκεν αὐτὸ ἐν τῷ καινῷ αὐτοῦ μνημείῳ ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ, καὶ προσκυλίσας λίθον μέγαν τῇ θύρᾳ τοῦ μνημείου ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/060.yaml
  text: and placed it in his own new tomb[a], which he had cut into the rock. And after rolling a large stone to the entrance of the tomb, he went away.
translation:
  language: fr
  text: et le déposa dans son tombeau neuf, qu’il avait taillé dans le rocher. Puis il roula une grosse pierre devant l’entrée[a] du tombeau et s’en alla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant la porte » du tombeau.
    reason: Alternative lexicale pour θύρα, qui peut désigner une porte ou une entrée.
lexical_decisions:
- source_word: ἔθηκεν αὐτό
  choice: le déposa
  rationale: Le pronom grec renvoie au corps de Jésus mentionné dans le contexte. « Le déposa » exprime avec naturel et dignité l’action de placer le corps dans le tombeau.
- source_word: ἐν τῷ καινῷ αὐτοῦ μνημείῳ
  choice: dans son tombeau neuf
  rationale: μνημεῖον désigne ici un tombeau creusé dans le roc. καινός est rendu littéralement par « neuf », sans expliciter l’idée possible, mais non énoncée, qu’il n’avait jamais servi. αὐτοῦ indique que le tombeau appartenait à Joseph.
- source_word: ὃ ἐλατόμησεν ἐν τῇ πέτρᾳ
  choice: qu’il avait taillé dans le rocher
  rationale: λατομέω décrit l’action de tailler ou creuser la roche. Le plus-que-parfait français situe naturellement cette préparation avant l’ensevelissement.
- source_word: προσκυλίσας λίθον μέγαν
  choice: Puis il roula une grosse pierre
  rationale: Le participe aoriste indique une action antérieure au départ. « Puis » restitue clairement la succession narrative; « grosse pierre » est courant et fidèle à λίθον μέγαν.
- source_word: τῇ θύρᾳ τοῦ μνημείου
  choice: devant l’entrée du tombeau
  rationale: θύρα peut désigner une porte ou une entrée. Dans le contexte d’un tombeau creusé dans le roc, « entrée » évite de suggérer une porte à battants; « devant » rend idiomatiquement la position de la pierre qui ferme l’ouverture.
- source_word: ἀπῆλθεν
  choice: s’en alla
  rationale: Cette expression française simple et naturelle rend le départ indiqué par ἀπέρχομαι et conserve le mouvement du récit.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du grec tout en employant des enchaînements naturels en français.
