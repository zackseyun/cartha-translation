id: MAT.27.31
reference: Matthew 27:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν χλαμύδα καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ καὶ ἀπήγαγον αὐτὸν εἰς τὸ σταυρῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/031.yaml
  text: And when they had mocked him[a], they stripped the cloak off him and put his own clothes on him, and led him away to crucify him.
translation:
  language: fr
  text: Après s’être moqués de lui, ils lui enlevèrent le manteau[a], lui remirent ses propres vêtements et l’emmenèrent pour le crucifier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la cape ». Le grec χλαμύς désigne un vêtement de dessus, souvent une cape militaire ou officielle ; dans ce contexte, il s’agit du vêtement dont on avait affublé Jésus pour le tourner en dérision.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: s’être moqués
  rationale: Le verbe exprime une raillerie méprisante et cruelle. La tournure « Après s’être moqués de lui » rend naturellement en français la relation temporelle introduite par ὅτε et l’antériorité de l’action.
- source_word: χλαμύδα
  choice: le manteau
  rationale: χλαμύς désigne un vêtement de dessus, souvent une cape militaire ou officielle. « Manteau » reste clair et ne précise pas davantage que le grec la nature exacte du vêtement utilisé ici pour tourner Jésus en dérision.
- source_word: ἐξέδυσαν αὐτὸν τὴν χλαμύδα
  choice: ils lui enlevèrent le manteau
  rationale: ἐκδύω indique qu’on déshabille quelqu’un ou qu’on lui retire un vêtement. Cette formulation française exprime clairement l’enlèvement du manteau sans lourdeur.
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια αὐτοῦ
  choice: lui remirent ses propres vêtements
  rationale: ἐνδύω signifie vêtir ou habiller. « Remirent » convient au contexte, puisque ces vêtements avaient été retirés auparavant, et « ses propres » fait ressortir le possessif et le contraste avec le manteau de dérision.
- source_word: ἱμάτια
  choice: vêtements
  rationale: Terme français courant et suffisamment large pour rendre le pluriel ἱμάτια sans archaïsme.
- source_word: ἀπήγαγον
  choice: l’emmenèrent
  rationale: ἀπάγω signifie conduire ou emmener quelqu’un. Dans ce contexte de détention, « l’emmenèrent » est naturel et conserve l’idée d’un déplacement imposé.
- source_word: εἰς τὸ σταυρῶσαι
  choice: pour le crucifier
  rationale: La construction εἰς τό suivie de l’infinitif exprime ici le but. « Pour le crucifier » en est une traduction directe et idiomatique.
