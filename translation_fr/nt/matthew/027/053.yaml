id: MAT.27.53
reference: Matthew 27:53
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξελθόντες ἐκ τῶν μνημείων μετὰ τὴν ἔγερσιν αὐτοῦ εἰσῆλθον εἰς τὴν ἁγίαν πόλιν καὶ ἐνεφανίσθησαν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/053.yaml
  text: And coming out of the tombs after his resurrection[c][b][a], they entered the holy city and appeared to many.
translation:
  language: fr
  text: Et, sortis des tombeaux après sa résurrection[a], ils entrèrent dans la ville sainte[b] et apparurent à beaucoup de gens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec place « après sa résurrection » entre « des tombeaux » et « ils entrèrent ». On pourrait traduire plus librement : « Après sa résurrection, ils sortirent des tombeaux, entrèrent dans la ville sainte et apparurent à beaucoup de gens. »'
    reason: alternative_reading
  - marker: b
    text: « La ville sainte » désigne Jérusalem.
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθόντες
  choice: sortis
  rationale: Le participe aoriste exprime une action antérieure ou circonstancielle par rapport au verbe principal. « Sortis » conserve cette relation avec une formulation française concise et naturelle.
- source_word: μνημείων
  choice: tombeaux
  rationale: Le terme désigne ici des lieux de sépulture ouverts, comme au verset précédent. « Tombeaux » convient mieux au contexte que le terme plus général « tombes ».
- source_word: μετὰ τὴν ἔγερσιν αὐτοῦ
  choice: après sa résurrection
  rationale: μετά suivi de l’accusatif a un sens temporel. Dans le contexte, αὐτοῦ renvoie à Jésus, et « résurrection » rend naturellement ἔγερσις sans préciser au-delà du grec le mode de l’action.
- source_word: εἰσῆλθον
  choice: ils entrèrent
  rationale: Le verbe narratif à l’aoriste est rendu par un passé simple, registre naturel et digne pour un récit biblique écrit.
- source_word: τὴν ἁγίαν πόλιν
  choice: la ville sainte
  rationale: Cette traduction conserve l’expression biblique qui désigne Jérusalem sans remplacer dans le texte l’appellation par son référent.
- source_word: ἐνεφανίσθησαν
  choice: apparurent
  rationale: Dans ce contexte, la forme signifie qu’ils devinrent visibles ou se montrèrent. « Apparurent » est concis et respecte la construction avec le datif.
- source_word: πολλοῖς
  choice: à beaucoup de gens
  rationale: Le grec substantivé reste indéfini. L’ajout explicatif de « gens » est nécessaire en français courant pour éviter l’expression maladroite « apparurent à beaucoup ».
theological_decisions:
- issue: Rapport entre la sortie des tombeaux et l’expression temporelle « après sa résurrection »
  choice: 'La proposition participiale est rendue dans l’ordre grec : « sortis des tombeaux après sa résurrection » ; la sortie et l’entrée dans la ville sont ainsi situées après la résurrection de Jésus.'
  alternative: 'On peut restructurer plus librement : « Après sa résurrection, ils sortirent des tombeaux, entrèrent dans la ville sainte… » ; certains rapprochent aussi l’ouverture des tombeaux, mentionnée au verset précédent, de la mort de Jésus tout en situant la sortie après sa résurrection.'
  rationale: Le grec place μετὰ τὴν ἔγερσιν αὐτοῦ à l’intérieur de la proposition participiale, après « des tombeaux » et avant le verbe principal. La traduction en conserve l’enchaînement sans harmoniser explicitement les événements avec le verset précédent.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique. La construction participiale conserve l’ordre et la tension syntaxique du grec tout en restant lisible.
