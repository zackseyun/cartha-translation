id: MAT.27.41
reference: Matthew 27:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁμοίως ⸀καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες μετὰ τῶν γραμματέων καὶ ⸀πρεσβυτέρων ἔλεγον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/041.yaml
  text: Likewise[a], the chief priests also, mocking him with the scribes and elders, were saying,
translation:
  language: fr
  text: 'De même[a], les chefs des prêtres se moquaient eux aussi de lui, avec les spécialistes de la Loi et les anciens, et disaient :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De la même manière ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: De même
  rationale: L’adverbe relie cette scène aux moqueries précédentes et conserve clairement la valeur comparative.
- source_word: καὶ
  choice: eux aussi
  rationale: καί ajoute les chefs des prêtres et leurs associés aux personnes qui viennent d’être décrites comme se moquant de Jésus.
- source_word: ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Cette expression désigne les principales autorités sacerdotales, et non plusieurs titulaires simultanés de la fonction de grand-prêtre.
- source_word: ἐμπαίζοντες
  choice: se moquaient de lui
  rationale: Le participe exprime une raillerie méprisante; le pronom « lui », implicite en grec, désigne clairement Jésus dans le contexte.
- source_word: μετὰ
  choice: avec
  rationale: Avec le génitif, la préposition marque ici l’association des trois groupes dans l’action.
- source_word: γραμματέων
  choice: les spécialistes de la Loi
  rationale: Dans ce contexte, γραμματεῖς désigne des experts de la Loi; cette formulation actuelle communique leur fonction plus clairement que le terme devenu moins transparent « scribes ».
- source_word: πρεσβυτέρων
  choice: les anciens
  rationale: Le terme renvoie ici à des responsables reconnus du peuple, et non simplement à des hommes âgés.
- source_word: ἔλεγον
  choice: en disant
  rationale: La tournure française associe naturellement l’action continue de se moquer au contenu des paroles qui suit, tout en reflétant l’imparfait grec.
theological_decisions:
- issue: Identification des participants aux moqueries
  choice: Les chefs des prêtres, les spécialistes de la Loi et les anciens participent ensemble aux moqueries contre Jésus.
  alternative: Les chefs des prêtres se moquent de Jésus en présence des spécialistes de la Loi et des anciens.
  rationale: μετὰ suivi du génitif indique le plus naturellement une association dans l’action plutôt qu’une simple présence.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste ouverte par les deux-points, puisque les paroles annoncées se trouvent au verset suivant. « Spécialistes de la Loi » privilégie la compréhension immédiate tout en conservant la fonction historique du groupe.
