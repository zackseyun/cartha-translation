id: MAT.27.5
reference: Matthew 27:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ῥίψας τὰ ἀργύρια ⸂εἰς τὸν ναὸν⸃ ἀνεχώρησεν, καὶ ἀπελθὼν ἀπήγξατο.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/005.yaml
  text: And throwing the silver into the temple[a], he departed[b], and went and hanged himself.
translation:
  language: fr
  text: Après avoir jeté les pièces d’argent dans le Temple[a], il se retira, puis s’en alla se pendre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le sanctuaire du Temple » ; le grec emploie naos, qui désigne souvent le bâtiment du sanctuaire plutôt que l’ensemble de l’enceinte du Temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίψας
  choice: après avoir jeté
  rationale: Le participe aoriste exprime une action antérieure au verbe principal ; cette tournure restitue clairement et naturellement la succession des actions en français.
- source_word: τὰ ἀργύρια
  choice: les pièces d’argent
  rationale: Le pluriel substantivé désigne ici les pièces d’argent reçues comme paiement. Cette formulation est plus claire en français que le littéral « les argents » et plus précise que « l’argent ».
- source_word: εἰς τὸν ναόν
  choice: dans le Temple[a]
  rationale: « Le Temple » est immédiatement compréhensible et désigne ici le Temple de Jérusalem. La note conserve la nuance de ναός, qui vise plus précisément le bâtiment du sanctuaire que l’ensemble de l’enceinte du Temple.
- source_word: ἀνεχώρησεν
  choice: il se retira
  rationale: Le verbe signifie partir ou se retirer ; « se retira » convient au ton solennel du récit et prépare sans l’effacer le second verbe de mouvement.
- source_word: ἀπελθών
  choice: s’en alla
  rationale: Cette tournure française naturelle préserve le second mouvement exprimé par le participe grec sans créer une répétition trop lourde.
- source_word: ἀπήγξατο
  choice: se pendre
  rationale: La forme moyenne indique une action exercée sur soi-même et, dans ce contexte, le sens usuel est le suicide par pendaison.
theological_decisions:
- issue: Portée de ναός par rapport à l’ensemble du Temple
  choice: « Temple » dans le texte, avec la nuance architecturale précisée en note
  alternative: « sanctuaire » ou « bâtiment du sanctuaire »
  rationale: ναός désigne généralement le bâtiment sacré proprement dit, par opposition à l’ensemble plus vaste de l’enceinte. Le texte principal privilégie une expression courante sans supprimer cette précision, conservée dans la note.
translation_notes:
  register: Français moderne, digne et narratif. « Puis s’en alla se pendre » conserve les deux verbes successifs de départ tout en restant idiomatique. La majuscule à « Temple » indique le Temple de Jérusalem.
