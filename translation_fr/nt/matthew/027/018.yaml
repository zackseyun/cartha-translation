source:
  edition: SBLGNT
  text: ᾔδει γὰρ ὅτι διὰ φθόνον παρέδωκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/018.yaml
  text: For he knew that they had handed him over because of envy[a].
translation:
  language: fr
  text: Car il savait que c’était par jalousie[a] qu’ils le lui avaient livré.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par envie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: il savait
  rationale: Le verbe οἶδα exprime ici une connaissance certaine. « Il savait » est direct, naturel et conserve le point de vue de Pilate.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit l’explication de ce qui précède. « Car » maintient clairement ce lien logique.
- source_word: ὅτι
  choice: que
  rationale: ὅτι introduit le contenu de ce que Pilate savait, et non une nouvelle proposition causale.
- source_word: διὰ φθόνον
  choice: par jalousie
  rationale: διά suivi de l’accusatif exprime la cause ou le motif. Dans ce contexte, φθόνος désigne le ressentiment suscité par la position ou le succès d’autrui ; « par jalousie » est idiomatique en français, tandis que « par envie » reste possible.
- source_word: παρέδωκαν
  choice: ils le lui avaient livré
  rationale: παραδίδωμι désigne ici l’action de remettre Jésus à l’autorité de Pilate. Le plus-que-parfait marque naturellement en français l’antériorité de cette remise par rapport au fait que Pilate en connaissait le motif. Le pronom « lui » explicite le destinataire imposé par le contexte sans transformer le verbe en « trahir ».
- source_word: αὐτόν
  choice: le
  rationale: Le pronom accusatif renvoie à Jésus.
theological_decisions:
- issue: Le motif des accusateurs de Jésus
  choice: Pilate savait qu’ils avaient livré Jésus par jalousie.
  alternative: Pilate savait qu’ils avaient livré Jésus par envie.
  rationale: Le texte attribue leur action à φθόνος sans développer davantage leur motivation. « Jalousie » en préserve la portée morale et psychologique sans ajouter d’explication théologique.
translation_notes:
  register: Français moderne, international et digne. La tournure clivée « c’était par jalousie que » met naturellement en relief le motif, comme le groupe grec διὰ φθόνον placé avant le verbe.
