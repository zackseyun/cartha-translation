  text: τότε λέγει αὐτῷ ὁ Πιλᾶτος· Οὐκ ἀκούεις πόσα σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/013.yaml
  text: Then Pilate says to him[a], “Do you not hear how many things they are testifying against you?”
translation:
  language: fr
  text: 'Alors Pilate lui dit : « N’entends-tu pas tout ce dont ils témoignent contre toi ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque la progression du récit de manière naturelle en français.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps narratif naturel et digne en français écrit; « lui dit » conserve la vivacité de la scène.
- source_word: αὐτῷ
  choice: lui
  rationale: Conserve le pronom grec sans expliciter inutilement le nom de Jésus.
- source_word: ὁ Πιλᾶτος
  choice: Pilate
  rationale: Le français omet normalement l’article grec devant ce nom propre.
- source_word: Οὐκ ἀκούεις
  choice: N’entends-tu pas
  rationale: Préserve la forme interrogative négative et le sens premier d’ἀκούω.
- source_word: πόσα
  choice: tout ce dont
  rationale: Exprime idiomatiquement en français la pluralité et l’ampleur des éléments avancés, sans ajouter le nom interprétatif « accusations ».
- source_word: σου … καταμαρτυροῦσιν
  choice: ils témoignent contre toi
  rationale: Rend explicitement la valeur adversative du génitif avec le verbe judiciaire καταμαρτυρέω et conserve son sens de témoignage à charge.
