id: MAT.27.28
reference: Matthew 27:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκδύσαντες αὐτὸν ⸂χλαμύδα κοκκίνην περιέθηκαν αὐτῷ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/028.yaml
  text: And after stripping him[a], they put a scarlet cloak on him,
translation:
  language: fr
  text: Et après l’avoir déshabillé, ils lui mirent un manteau écarlate[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une chlamyde écarlate ». Il s’agissait d’un vêtement de dessus, souvent un manteau court porté notamment par des soldats ou des dignitaires.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Rend directement le lien narratif exprimé par καί, sans renforcer artificiellement la succession temporelle.
- source_word: ἐκδύσαντες αὐτόν
  choice: après l’avoir déshabillé
  rationale: Le participe aoriste exprime une action antérieure au verbe principal. Cette formulation est naturelle en français et conserve l’idée qu’ils lui retirent ses vêtements.
- source_word: χλαμύδα
  choice: manteau
  rationale: χλαμύς désigne un vêtement de dessus, souvent un manteau court porté notamment par des soldats ou des dignitaires. « Manteau » est précis, courant et n’ajoute pas de connotation royale absente du terme lui-même.
- source_word: κοκκίνην
  choice: écarlate
  rationale: κόκκινος désigne un rouge vif, écarlate. « Écarlate » conserve la précision chromatique du grec.
- source_word: περιέθηκαν αὐτῷ
  choice: ils lui mirent
  rationale: Avec le datif, περιτίθημι signifie placer un vêtement sur quelqu’un ou autour de lui. « Ils lui mirent » est idiomatique en français et rend clairement l’action.
theological_decisions:
- issue: Nature du vêtement dans la scène de dérision
  choice: un manteau écarlate
  alternative: une chlamyde écarlate / un vêtement écarlate
  rationale: « Manteau » restitue le sens concret de χλαμύς tout en évitant d’introduire, par « robe royale », une interprétation plus explicite que le grec. La scène évoque bien une parodie d’investiture, mais cette portée vient du contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve l’enchaînement du grec tout en évitant un participe présent peu idiomatique. Le pronom « lui » rend naturellement le datif αὐτῷ.
