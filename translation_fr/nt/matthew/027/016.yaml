  text: εἶχον δὲ τότε δέσμιον ἐπίσημον λεγόμενον ⸀Ἰησοῦν Βαραββᾶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/016.yaml
  text: At that time they had a notorious prisoner called Jesus Barabbas[a].
translation:
  language: fr
  text: À ce moment-là, ils avaient un prisonnier tristement célèbre appelé Jésus Barabbas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent simplement « Barabbas » et omettent « Jésus ».
    reason: textual_variant
lexical_decisions:
- source_word: εἶχον
  choice: ils avaient
  rationale: L’imparfait de ἔχω avec un sujet pluriel non exprimé indique que des personnes, vraisemblablement les autorités, détenaient ce prisonnier. « Ils avaient » conserve cette idée de garde sans préciser indûment le référent.
- source_word: δὲ
  choice: non rendu séparément
  rationale: Cette particule assure ici une légère transition narrative. En français moderne, le lien avec le contexte reste naturel sans connecteur explicite, et l’ajout de « or » alourdirait la phrase.
- source_word: τότε
  choice: à cette époque
  rationale: Cette expression rend la valeur temporelle explicite de τότε. « À ce moment-là » serait également possible, mais pourrait suggérer un instant plus ponctuel.
- source_word: δέσμιον
  choice: prisonnier
  rationale: Le terme désigne une personne détenue; « prisonnier » est l’équivalent courant et adapté au contexte judiciaire.
- source_word: ἐπίσημον
  choice: tristement célèbre
  rationale: ἐπίσημος signifie que cet homme était particulièrement connu ou remarquable. Dans ce contexte criminel, « tristement célèbre » exprime naturellement la notoriété défavorable, tout en évitant l’ambiguïté positive de « célèbre » seul.
- source_word: λεγόμενον
  choice: appelé
  rationale: Le participe introduit le nom sous lequel le prisonnier était désigné; « appelé » est direct et idiomatique.
- source_word: Ἰησοῦν Βαραββᾶν
  choice: Jésus Barabbas
  rationale: Le texte du SBLGNT comporte les deux noms. La traduction les maintient dans le texte principal, tandis que la forme manuscrite plus courte est signalée en note.
theological_decisions:
- issue: Forme textuelle du nom complet de Barabbas
  choice: 'Inclure « Jésus » dans le texte principal : « Jésus Barabbas »'
  alternative: Lire simplement « Barabbas »
  rationale: Le texte grec fourni lit Ἰησοῦν Βαραββᾶν. La variante plus courte, bien attestée dans la tradition manuscrite et familière à de nombreux lecteurs, est préservée dans une note sans remplacer le texte source retenu.
translation_notes:
  register: Français international moderne, clair et digne. « Tristement célèbre » communique la notoriété défavorable sans recourir à un terme soutenu comme « insigne ». Le sujet indéfini de εἶχον est conservé par « ils », sans identifier explicitement les autorités.
