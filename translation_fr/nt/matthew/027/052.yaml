id: MAT.27.52
reference: Matthew 27:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ μνημεῖα ἀνεῴχθησαν καὶ πολλὰ σώματα τῶν κεκοιμημένων ἁγίων ⸀ἠγέρθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/052.yaml
  text: And the tombs were opened[a], and many bodies of the saints who had fallen asleep were raised,
translation:
  language: fr
  text: Les tombeaux s’ouvrirent, et beaucoup de corps des saints qui s’étaient endormis[a] furent relevés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « S’étaient endormis » est une manière courante de dire « étaient morts ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Conjonction narrative courante qui maintient la coordination du grec sans lui imposer une valeur temporelle plus précise.
- source_word: τὰ μνημεῖα
  choice: les tombeaux
  rationale: Désigne ici des lieux de sépulture; «tombeaux» est naturel, digne et adapté au contexte.
- source_word: ἀνεῴχθησαν
  choice: s’ouvrirent
  rationale: Le passif grec peut se rendre naturellement en français par la forme pronominale, sans préciser l’agent ni le mécanisme.
- source_word: πολλὰ σώματα
  choice: beaucoup de corps
  rationale: Rend littéralement et sans dureté le substantif neutre σῶμα ainsi que la pluralité exprimée par πολλά.
- source_word: τῶν κεκοιμημένων
  choice: qui s’étaient endormis
  rationale: Préserve l’image biblique du sommeil employée comme euphémisme de la mort; le plus-que-parfait situe cet état avant l’action principale.
- source_word: ἁγίων
  choice: des saints
  rationale: Équivalent français traditionnel et encore intelligible du substantif désignant ceux qui appartiennent au peuple saint de Dieu, sans préciser davantage leur identité.
- source_word: ἠγέρθησαν
  choice: furent relevés
  rationale: Conserve la voix passive et le champ sémantique de ἐγείρω sans préciser à lui seul la nature exacte du retour à la vie.
theological_decisions:
- issue: Nature de l’événement exprimé par ἠγέρθησαν
  choice: furent relevés
  alternative: ressuscitèrent / furent ressuscités
  rationale: «Furent relevés» reste proche du verbe grec et préserve la tension quant à la nature précise de l’événement, que ce verset seul ne systématise pas.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de la coordination grecque tout en étant naturelle. L’idiome du sommeil est conservé et expliqué; «furent relevés» évite de résoudre plus que le texte la nature de l’événement.
