  variant: modern international French
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν ἐκεῖ ⸀ἑστηκότων ἀκούσαντες ἔλεγον ὅτι Ἠλίαν φωνεῖ οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/027/047.yaml
  text: But some of those standing there[a], when they heard it, were saying[b], “This man is calling Elijah.”
translation:
  language: fr
  text: 'Mais quelques-uns de ceux qui se tenaient là, après avoir entendu cela, disaient : « Cet homme[a] appelle Élie. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Celui-ci appelle Élie. »'
    reason: lexical_alternative
  - marker: b
    text: Les personnes présentes comprennent vraisemblablement le cri de Jésus au verset précédent comme un appel adressé à Élie.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: quelques-uns
  rationale: Désigne une partie indéterminée des personnes présentes, sans préciser leur nombre.
- source_word: δὲ
  choice: Mais
  rationale: Marque une légère opposition ou un nouveau développement dans le récit, lorsque certains témoins réagissent au cri de Jésus.
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: de ceux qui se tenaient là
  rationale: Rend le participe parfait substantivé en conservant à la fois la présence sur les lieux et la posture décrite.
- source_word: ἀκούσαντες
  choice: après l’avoir entendu
  rationale: Exprime l’antériorité du participe aoriste par rapport au verbe principal. Le pronom « l’ » renvoie au cri de Jésus, implicite en grec mais clair dans le contexte.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait français restitue naturellement l’aspect imperfectif du verbe grec sans imposer l’idée plus forte d’une répétition insistante.
- source_word: ὅτι
  choice: ponctuation de discours direct
  rationale: Le grec introduit le contenu des paroles avec ὅτι ; en français naturel, les deux-points et les guillemets rendent clairement cette fonction.
- source_word: Ἠλίαν
  choice: Élie
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: φωνεῖ
  choice: appelle
  rationale: Conserve le sens direct de « appeler » avec un complément de personne, sans préciser davantage s’il s’agit de l’interpeller, de l’invoquer ou de le faire venir.
- source_word: οὗτος
  choice: Cet homme
  rationale: Formulation française naturelle qui garde la valeur démonstrative de οὗτος ; « celui-ci » serait plus littéral, mais moins idiomatique ici.
theological_decisions:
- issue: La déclaration des témoins décrit-elle une réalité ou leur interprétation du cri de Jésus ?
  choice: 'Présenter simplement leurs paroles : « Cet homme appelle Élie. »'
  alternative: Expliciter dans le texte qu’ils croient, à tort, que Jésus appelle Élie.
  rationale: Le grec rapporte leur réaction sans commenter explicitement sa justesse dans ce verset. La traduction préserve donc l’ironie narrative et laisse l’explication au contexte et à la note.
- issue: Nature exacte de l’appel adressé à Élie
  choice: appelle Élie
  alternative: appelle Élie à son secours / fait appel à Élie
  rationale: Ces variantes préciseraient la finalité de l’appel au-delà de ce qu’énonce directement φωνεῖ avec son complément. La formulation retenue conserve l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, narratif et digne. « Se tenaient là » garde la précision visuelle du grec ; « après l’avoir entendu » évite la lourdeur de « l’ayant entendu ». Le discours direct demeure simple et oral sans devenir familier.
