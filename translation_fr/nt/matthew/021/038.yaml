id: MAT.21.38
reference: Matthew 21:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ γεωργοὶ ἰδόντες τὸν υἱὸν εἶπον ἐν ἑαυτοῖς· Οὗτός ἐστιν ὁ κληρονόμος· δεῦτε ἀποκτείνωμεν αὐτὸν καὶ ⸀σχῶμεν τὴν κληρονομίαν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/038.yaml
  text: But when the tenant farmers saw the son[a], they said among themselves, ‘This is the heir. Come, let us kill him and seize his inheritance.’
translation:
  language: fr
  text: 'Mais quand les vignerons virent le fils, ils se dirent entre eux : « C’est lui, l’héritier. Venez, tuons-le et emparons-nous de son héritage[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ayons son héritage »; dans ce contexte, il s’agit d’en prendre possession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: les vignerons
  rationale: Dans le contexte de la parabole, il s’agit des exploitants auxquels la vigne a été confiée. « Vignerons » est naturel en français et maintient clairement le cadre viticole; leur statut de locataires ressort du contexte immédiat.
- source_word: ἰδόντες
  choice: quand ... virent
  rationale: Le participe aoriste est rendu par une proposition temporelle idiomatique, qui conserve l’enchaînement des actions.
- source_word: τὸν υἱόν
  choice: le fils
  rationale: Le grec emploie l’article sans possessif explicite. « Le fils » en est le rendu direct, le lien avec le propriétaire étant déjà établi par le contexte.
- source_word: ἐν ἑαυτοῖς
  choice: entre eux
  rationale: L’expression désigne une délibération au sein du groupe; « entre eux » est le tour français le plus naturel ici.
- source_word: κληρονόμος
  choice: l’héritier
  rationale: C’est l’équivalent français courant qui conserve pleinement le sens juridique et successoral.
- source_word: δεῦτε
  choice: Venez
  rationale: L’impératif sert à lancer une exhortation collective. « Venez » garde cette impulsion sans ajouter d’élément interprétatif.
- source_word: ἀποκτείνωμεν
  choice: tuons-le
  rationale: Le subjonctif d’exhortation est rendu naturellement par l’impératif français à la première personne du pluriel. « Tuer » reste direct sans introduire la nuance judiciaire de « mettre à mort ».
- source_word: σχῶμεν
  choice: emparons-nous de
  rationale: Le verbe signifie littéralement « avoir », mais le projet de tuer l’héritier implique ici une prise de possession hostile. « S’emparer de » exprime naturellement cette valeur contextuelle, tandis qu’une note conserve le sens littéral.
- source_word: κληρονομίαν αὐτοῦ
  choice: son héritage
  rationale: « Héritage » correspond directement à κληρονομία, et le possessif rend explicitement αὐτοῦ tout en maintenant le lien lexical avec « héritier ».
theological_decisions:
- issue: Référence parabolique au fils
  choice: Conserver simplement « le fils » sans expliciter son identification christologique.
  alternative: Rendre le texte de manière plus interprétative afin de signaler que le fils représente Jésus.
  rationale: Dans l’ensemble du récit matthéen, la parabole renvoie clairement à Jésus, mais ce verset demeure formulé au niveau de l’histoire racontée. Le rendu choisi préserve cette distinction et n’insère pas l’interprétation dans le texte même.
translation_notes:
  register: Français international moderne, courant et digne. La ponctuation du discours direct suit l’usage français. « Vignerons » évite la lourdeur de « fermiers locataires » tout en restant précis dans le cadre explicite de la vigne.
