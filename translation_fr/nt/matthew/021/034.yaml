id: MAT.21.34
reference: Matthew 21:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε δὲ ἤγγισεν ὁ καιρὸς τῶν καρπῶν, ἀπέστειλεν τοὺς δούλους αὐτοῦ πρὸς τοὺς γεωργοὺς λαβεῖν τοὺς καρποὺς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/034.yaml
  text: But when the season for the fruits had drawn near[b][a], he sent his servants to the tenant farmers to collect his fruits.
translation:
  language: fr
  text: Quand le temps de la récolte approcha, il envoya ses serviteurs[a] auprès des vignerons[b] pour recevoir les fruits qui lui revenaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses esclaves ». Le mot grec peut désigner des serviteurs ou des esclaves.
    reason: lexical_alternative
  - marker: b
    text: Ou « cultivateurs » ou « fermiers ». Il s’agit ici des locataires qui exploitaient la vigne d’un autre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Quand
  rationale: ὅτε introduit la proposition temporelle. Le δέ marque ici une transition narrative légère que le français naturel peut laisser implicite.
- source_word: ἤγγισεν ὁ καιρὸς τῶν καρπῶν
  choice: le temps de la récolte approcha
  rationale: καιρός désigne le moment approprié ou la saison, et le génitif τῶν καρπῶν précise qu’il s’agit du temps où les fruits doivent être récoltés. Cette formulation française est naturelle tout en conservant l’idée d’un moment qui approche.
- source_word: ἀπέστειλεν
  choice: il envoya
  rationale: Équivalent narratif direct et courant du verbe ἀποστέλλω.
- source_word: τοὺς δούλους αὐτοῦ
  choice: ses serviteurs
  rationale: δοῦλος peut désigner un esclave ou un serviteur. Dans cette scène, leur fonction d’agents du propriétaire est au premier plan; une note conserve l’autre sens lexical.
- source_word: πρὸς τοὺς γεωργοὺς
  choice: auprès des vignerons
  rationale: γεωργός désigne des cultivateurs; le contexte immédiat d’une vigne permet le terme français « vignerons ». La note précise qu’ils exploitent la vigne comme locataires.
- source_word: λαβεῖν
  choice: pour recevoir
  rationale: λαμβάνω signifie prendre ou recevoir. « Recevoir » préserve la valeur large du verbe sans ajouter explicitement l’idée plus précise de recouvrer une dette.
- source_word: τοὺς καρποὺς αὐτοῦ
  choice: les fruits qui lui revenaient
  rationale: La tournure rend à la fois le pluriel καρπούς et le possessif αὐτοῦ. En contexte, les fruits sont la part appartenant au propriétaire, sans qu’il soit nécessaire d’en préciser le régime contractuel.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Le temps de la récolte » est plus idiomatique que « le temps des fruits »; « les fruits qui lui revenaient » maintient le possessif grec tout en explicitant sobrement son sens contextuel.
