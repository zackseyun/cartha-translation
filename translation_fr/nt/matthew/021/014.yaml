source:
  edition: SBLGNT
  text: Καὶ προσῆλθον αὐτῷ ⸂τυφλοὶ καὶ χωλοὶ⸃ ἐν τῷ ἱερῷ, καὶ ἐθεράπευσεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/014.yaml
  text: And the blind and the lame came to him in the temple[a], and he healed them.
translation:
  language: fr
  text: Des aveugles et des personnes qui avaient du mal à marcher s’approchèrent de lui dans l’enceinte du Temple, et il les guérit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσῆλθον
  choice: s’approchèrent
  rationale: Le verbe exprime un mouvement vers Jésus. « S’approchèrent de lui » est naturel en français et rend plus précisément cette orientation que le simple « vinrent ».
- source_word: τυφλοὶ
  choice: des aveugles
  rationale: L’adjectif substantivé au pluriel désigne des personnes aveugles. Cette formulation concise reste courante et digne en français.
- source_word: χωλοὶ
  choice: des personnes qui avaient du mal à marcher
  rationale: χωλός désigne des personnes dont la marche est entravée. Cette expression moderne évite le caractère potentiellement péjoratif de « boiteux » tout en conservant le sens fonctionnel du terme grec.
- source_word: ἐν τῷ ἱερῷ
  choice: dans l’enceinte du Temple
  rationale: ἱερόν désigne ici l’ensemble du domaine ou complexe du Temple, et non spécifiquement le sanctuaire intérieur. « L’enceinte du Temple » communique cette distinction directement sans nécessiter de note.
- source_word: ἐθεράπευσεν
  choice: il les guérit
  rationale: Dans les récits évangéliques, θεραπεύω désigne normalement l’acte de guérir. Le pronom « les » reprend clairement les deux groupes.
theological_decisions:
- issue: Lieu des guérisons désigné par ἱερόν
  choice: dans l’enceinte du Temple
  alternative: dans le Temple
  rationale: Le grec désigne le complexe du Temple au sens large, plutôt que le sanctuaire intérieur. La formulation retenue préserve cette précision spatiale sans laisser entendre que ces personnes seraient entrées dans le sanctuaire proprement dit.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve la coordination narrative du grec. « Temple » prend une majuscule pour désigner l’institution et le complexe cultuel de Jérusalem.
