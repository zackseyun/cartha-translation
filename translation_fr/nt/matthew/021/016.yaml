    issue: λέγει est rendu par « Jésus leur répond »
    rationale: Le grec emploie le présent historique « Jésus leur dit ». « Répond » convient au contexte mais ajoute une caractérisation absente du verbe et atténue la correspondance formelle.
  - severity: low
    issue: οὗτοι est rendu par le simple pronom « ils »
    rationale: Le démonstratif grec conserve une distance envers les personnes désignées. « Ces gens-là » préserve cette nuance sans identifier ou qualifier davantage le groupe.
