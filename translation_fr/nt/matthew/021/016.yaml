  verdict: revise
  source_fidelity: La traduction rend correctement la question, l’affirmation, la question rhétorique et la citation grecque du Psaume. Toutefois, « Jésus leur répond » remplace le présent historique λέγει (« Jésus leur dit ») par un verbe plus interprétatif, et « ils » ne restitue pas la nuance démonstrative, possiblement dépréciative, de οὗτοι.
  naturalness: Le français est moderne, clair et d’un registre biblique accessible. « Ce que ces gens-là disent » est naturel dans cette confrontation et rend mieux le démonstratif grec que le simple pronom personnel.
  terminology: « Tout-petits », « nourrissons », « tu as préparé une louange » et « force » dans la note sont appropriés. La note distingue correctement la formulation grecque citée par Matthieu de la formulation hébraïque couramment traduite.
  issues:
