source:
  edition: SBLGNT
  text: καὶ εἶπαν αὐτῷ· Ἀκούεις τί οὗτοι λέγουσιν; ὁ δὲ Ἰησοῦς λέγει αὐτοῖς· Ναί. οὐδέποτε ἀνέγνωτε ὅτι Ἐκ στόματος νηπίων καὶ θηλαζόντων κατηρτίσω αἶνον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/016.yaml
  text: And they said to him[a], “Do you hear what these are saying?” But Jesus says to them, “Yes. Have you never read, ‘Out of the mouth of infants and nursing babies you have prepared praise’?”
translation:
  language: fr
  text: 'Ils lui dirent : « Entends-tu ce que ces gens-là disent ? » Jésus leur dit : « Oui. N’avez-vous jamais lu : “De la bouche des tout-petits et des nourrissons, tu as préparé une louange” ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jésus cite le Psaume 8.3 selon la tradition scripturaire grecque. Le texte hébreu est souvent traduit : « De la bouche des tout-petits et des nourrissons, tu as établi une force. »'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούεις
  choice: Entends-tu
  rationale: Le présent de l’indicatif dans cette question directe est rendu simplement et naturellement, tout en conservant le défi adressé à Jésus.
- source_word: τί οὗτοι λέγουσιν
  choice: ce qu’ils disent
  rationale: Le pronom français renvoie naturellement aux personnes présentes; le présent exprime leur parole en cours sans alourdir la phrase.
- source_word: λέγει
  choice: Jésus leur répond
  rationale: Le présent historique est maintenu. « Répond » explicite naturellement la fonction de la parole dans cet échange sans en modifier le contenu.
- source_word: Ναί
  choice: Oui
  rationale: Réponse affirmative directe et sans emphase ajoutée.
- source_word: οὐδέποτε ἀνέγνωτε
  choice: N’avez-vous jamais lu
  rationale: Cette formulation idiomatique conserve la question rhétorique et sa nuance de reproche concernant leur connaissance des Écritures.
- source_word: Ἐκ στόματος
  choice: De la bouche
  rationale: Rendu français naturel et proche de la construction grecque de la citation.
- source_word: νηπίων
  choice: tout-petits
  rationale: Le terme désigne de très jeunes enfants; « tout-petits » est actuel, clair et reste distinct de ceux qui sont encore allaités.
- source_word: θηλαζόντων
  choice: nourrissons
  rationale: Le terme français désigne naturellement les bébés encore nourris au sein et préserve l’image sans archaïsme.
- source_word: κατηρτίσω
  choice: tu as préparé
  rationale: Ce choix rend directement le grec cité par Matthieu, avec l’idée de disposer ou de produire, sans l’harmoniser avec le texte hébreu du psaume.
- source_word: αἶνον
  choice: une louange
  rationale: Le nom signifie « louange ». L’article indéfini convient ici à la syntaxe française tout en conservant le singulier grec.
theological_decisions:
- issue: Formulation de la citation du Psaume 8.3 selon la numérotation française courante
  choice: « tu as préparé une louange » dans le texte principal
  alternative: « tu as établi une force » selon le texte hébreu
  rationale: Matthieu cite ici la formulation de la tradition scripturaire grecque. La traduction rend donc le texte grec de Matthieu sans l’harmoniser avec l’hébreu, tout en signalant la différence en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le dialogue reste direct, la question rhétorique conserve sa force, et la citation biblique garde une légère solennité sans vocabulaire archaïque.
