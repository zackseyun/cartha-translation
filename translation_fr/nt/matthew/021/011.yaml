id: MAT.21.11
reference: Matthew 21:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι ἔλεγον· Οὗτός ἐστιν ⸂ὁ προφήτης Ἰησοῦς⸃ ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/011.yaml
  text: And the crowds were saying[a], “This is the prophet Jesus, from Nazareth in Galilee.”
translation:
  language: fr
  text: 'Et les foules disaient : « C’est le prophète[a] Jésus, de Nazareth en Galilée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un prophète ». Le grec dit littéralement « le prophète » ; cette expression peut indiquer que la foule reconnaissait en Jésus une figure prophétique bien définie.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: Et les foules
  rationale: Le pluriel οἱ ὄχλοι désigne les groupes de personnes rassemblées. « Les foules » le rend directement, tandis que « Et » restitue sobrement la liaison narrative marquée par δέ.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente la parole comme en cours ou répétée. L’imparfait français « disaient » en conserve naturellement l’aspect sans renforcer l’idée de répétition.
- source_word: Οὗτός ἐστιν
  choice: C’est
  rationale: Cette tournure française courante rend naturellement la proposition d’identification formée du démonstratif et du verbe être.
- source_word: ὁ προφήτης
  choice: le prophète
  rationale: L’article grec est conservé. Cette formulation peut identifier Jésus comme la figure prophétique reconnue ou attendue, sans expliciter davantage cette résonance possible.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Le nom propre est rendu selon sa forme française consacrée.
- source_word: ὁ ἀπὸ Ναζαρὲθ τῆς Γαλιλαίας
  choice: de Nazareth en Galilée
  rationale: La formule identifie Jésus par son lieu d’origine. « En Galilée » exprime naturellement en français la relation géographique du génitif τῆς Γαλιλαίας.
theological_decisions:
- issue: Valeur définie ou indéfinie de ὁ προφήτης
  choice: le prophète
  alternative: un prophète
  rationale: Le grec porte l’article défini, qui peut évoquer une figure prophétique reconnue ou attendue dans ce contexte. Le texte principal préserve cette possibilité, tandis que la note signale l’interprétation indéfinie sans trancher silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste simple et orale pour refléter la réponse des foules, tout en conservant l’imparfait grec et l’ambiguïté théologique de l’article devant « prophète ».
