id: MAT.21.32
reference: Matthew 21:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦλθεν γὰρ ⸂Ἰωάννης πρὸς ὑμᾶς⸃ ἐν ὁδῷ δικαιοσύνης, καὶ οὐκ ἐπιστεύσατε αὐτῷ· οἱ δὲ τελῶναι καὶ αἱ πόρναι ἐπίστευσαν αὐτῷ· ὑμεῖς δὲ ἰδόντες ⸀οὐδὲ μετεμελήθητε ὕστερον τοῦ πιστεῦσαι αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/032.yaml
  text: For John came to you in the way of righteousness[a], and you did not believe him; but the tax collectors and the prostitutes believed him. But even after seeing this[c][b], you did not afterward change your minds so as to believe him.
translation:
  language: fr
  text: Car Jean est venu à vous dans la voie de la justice[a], et vous ne l’avez pas cru[b] ; mais les collecteurs d’impôts et les prostituées l’ont cru. Vous, pourtant, après avoir vu cela, vous n’avez même pas changé d’avis par la suite pour en venir à le croire[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’une manière juste » ou « sur le chemin de la justice ». L’expression grecque peut désigner soit la manière dont Jean a vécu et exercé son ministère, soit la voie juste qu’il proclamait.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous ne lui avez pas fait confiance ». Le verbe grec peut signifier croire une personne ou lui faire confiance.
    reason: lexical_alternative
  - marker: c
    text: Ou « vous n’avez même pas regretté par la suite au point d’en venir à le croire », ou « vous ne vous êtes même pas repentis par la suite pour en venir à le croire ». Le verbe grec employé ici est μεταμέλομαι, qui évoque plus précisément le regret ou un changement d’avis, et non le verbe μετανοέω, plus courant pour exprimer la repentance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν γὰρ
  choice: Car … est venu
  rationale: « Car » conserve le lien explicatif avec le contexte précédent, et le passé composé convient naturellement au discours direct en français.
- source_word: πρὸς ὑμᾶς
  choice: à vous
  rationale: Rend directement le mouvement et la mission de Jean auprès de ses interlocuteurs.
- source_word: ἐν ὁδῷ δικαιοσύνης
  choice: sur le chemin de la justice
  rationale: Conserve la métaphore de ὁδός tout en employant une expression française naturelle ; la note maintient l’ambiguïté entre la conduite de Jean et la voie juste qu’il proclamait.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ / ἐπίστευσαν αὐτῷ
  choice: vous ne l’avez pas cru / l’ont cru
  rationale: πιστεύω avec le datif désigne ici le fait d’accorder foi à Jean. La formulation reste uniforme dans les deux propositions et n’importe pas la notion plus spécifique de « croire en ».
- source_word: τελῶναι
  choice: collecteurs d’impôts
  rationale: Équivalent moderne, précis et largement compréhensible de τελῶναι.
- source_word: πόρναι
  choice: prostituées
  rationale: Équivalent lexical direct qui conserve la portée sociale et morale du terme dans le contexte.
- source_word: ἰδόντες
  choice: après avoir vu cela
  rationale: Rend naturellement la valeur temporelle du participe aoriste ; « cela » explicite sans ambiguïté qu’ils ont vu la réponse des collecteurs d’impôts et des prostituées.
- source_word: οὐδὲ μετεμελήθητε ὕστερον
  choice: vous ne vous êtes même pas ravisés par la suite
  rationale: « Se raviser » exprime un changement de décision ou de disposition, tandis que « même pas » rend οὐδέ et « par la suite » rend ὕστερον.
- source_word: τοῦ πιστεῦσαι αὐτῷ
  choice: pour le croire
  rationale: Exprime le changement attendu conduisant à accorder foi à Jean, sans surdéterminer la nuance syntaxique.
theological_decisions:
- issue: Sens de δικαιοσύνη dans ἐν ὁδῷ δικαιοσύνης
  choice: justice
  alternative: droiture
  rationale: En français moderne, « justice » est le terme biblique naturel pour δικαιοσύνη et peut désigner ici la conformité à ce qui est juste devant Dieu. La note préserve les différentes lectures possibles de toute l’expression.
- issue: Sens de πιστεύω avec le datif αὐτῷ
  choice: le croire
  alternative: lui faire confiance
  rationale: Le contexte porte d’abord sur l’accueil du témoignage et du message de Jean. « Le croire » conserve ce sens sans transformer l’expression en « croire en lui », formulation théologiquement plus chargée.
- issue: Distinction entre μεταμέλομαι et μετανοέω
  choice: se raviser
  alternative: se repentir
  rationale: « Se raviser » préserve l’idée propre à μεταμέλομαι d’un changement d’avis ou de disposition, sans l’assimiler silencieusement au verbe plus habituel pour « se repentir ».
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le contraste appuyé entre les responsables interpellés et les personnes marginalisées, ainsi que la progression « voir — se raviser — croire ». Le point-virgule maintient le parallélisme argumentatif du grec.
