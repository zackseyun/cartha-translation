revisions:
- from: Car Jean est venu à vous sur le chemin de la justice[a], et vous ne l’avez pas cru[b] ; mais les collecteurs d’impôts et les prostituées l’ont cru. Et vous, après avoir vu cela, vous ne vous êtes même pas ravisés par la suite[c] pour le croire.
  to: Car Jean est venu à vous dans la voie de la justice[a], et vous ne l’avez pas cru[b] ; mais les collecteurs d’impôts et les prostituées l’ont cru. Vous, pourtant, après avoir vu cela, vous n’avez même pas changé d’avis par la suite pour en venir à le croire[c].
  rationale: 'La révision rend explicitement le contraste rhétorique de la dernière proposition et améliore la fluidité de la conclusion, tout en conservant la progression du grec : voir, changer d’avis ultérieurement, puis croire Jean. Les notes maintiennent les alternatives interprétatives sans résoudre l’ambiguïté de l’expression « voie de la justice » ni confondre les deux verbes grecs de changement moral ou mental.'
