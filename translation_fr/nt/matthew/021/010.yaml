id: MAT.21.10
reference: Matthew 21:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἰσελθόντος αὐτοῦ εἰς Ἱεροσόλυμα ἐσείσθη πᾶσα ἡ πόλις λέγουσα· Τίς ἐστιν οὗτος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/010.yaml
  text: And when he entered Jerusalem[a], the whole city was stirred up, saying, “Who is this?”
translation:
  language: fr
  text: 'Quand il entra dans Jérusalem, toute la ville fut bouleversée[a] et disait : « Qui est-ce ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « secouée ». Le verbe grec peut désigner un ébranlement physique ou, comme ici, une vive agitation collective.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: quand il entra
  rationale: Le génitif absolu exprime ici la circonstance temporelle. Cette tournure française est naturelle et ne précise pas indûment si la réaction eut lieu pendant ou immédiatement après l’entrée.
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française traditionnelle et actuelle du nom de lieu.
- source_word: ἐσείσθη
  choice: fut bouleversée
  rationale: Le verbe signifie littéralement « secouer » et décrit ici l’agitation collective provoquée par l’arrivée de Jésus. « Fut bouleversée » conserve l’image d’un profond ébranlement tout en étant naturel en français.
- source_word: πᾶσα ἡ πόλις
  choice: toute la ville
  rationale: Rendu idiomatique de l’expression grecque désignant collectivement les habitants de la ville.
- source_word: λέγουσα
  choice: demandait
  rationale: Le participe introduit une question directe. « Demandait » rend naturellement en français la fonction de cette parole, sans modifier son contenu.
- source_word: Τίς ἐστιν οὗτος;
  choice: Qui est cet homme ?
  rationale: Le démonstratif οὗτος désigne ici la personne qui vient d’entrer. « Cet homme » est la formulation française naturelle dans ce contexte, même si le nom « homme » reste implicite en grec.
theological_decisions:
- issue: Valeur littérale ou figurée de la réaction de la ville
  choice: Rendre ἐσείσθη au sens figuré par « fut bouleversée »
  alternative: « fut secouée » ou « fut en émoi »
  rationale: Le contexte décrit la vive agitation de la population à l’entrée de Jésus, sans affirmer qu’un tremblement de terre physique se soit produit. La note conserve toutefois la métaphore littérale possible.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La personnification collective de « toute la ville » est allégée par « demandait », plus naturel que le littéral « disait » devant une question.
