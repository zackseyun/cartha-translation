id: MAT.21.1
reference: Matthew 21:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤγγισαν εἰς Ἱεροσόλυμα καὶ ἦλθον εἰς Βηθφαγὴ ⸀εἰς τὸ Ὄρος τῶν Ἐλαιῶν, τότε ⸀Ἰησοῦς ἀπέστειλεν δύο μαθητὰς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/001.yaml
  text: And when they came near to Jerusalem and came to Bethphage[a], to the Mount of Olives, then Jesus sent two disciples
translation:
  language: fr
  text: Lorsqu’ils approchèrent de Jérusalem et arrivèrent à Bethphagé[a], vers le mont des Oliviers, Jésus envoya alors deux disciples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Lorsqu’ils approchèrent de Jérusalem et arrivèrent à Bethphagé, au mont des Oliviers ». Le grec peut soit exprimer une direction (« vers le mont des Oliviers »), soit situer Bethphagé par rapport au mont.'
    reason: La seconde occurrence de εἰς dans la séquence géographique admet plus d’une analyse; la note conserve cette ambiguïté sans imposer une localisation précise.
lexical_decisions:
- source_word: ἤγγισαν
  choice: approchèrent
  rationale: Le verbe exprime ici un mouvement spatial vers Jérusalem. « Approchèrent » en garde le sens direct sans ajouter qu’ils y entrèrent.
- source_word: ἦλθον
  choice: arrivèrent
  rationale: Dans ce contexte, le verbe indique qu’ils parvinrent à Bethphagé. « Arrivèrent » distingue naturellement ce second mouvement de l’approche de Jérusalem.
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
- source_word: Βηθφαγὴ
  choice: Bethphagé
  rationale: Forme française traditionnelle et courante du nom de lieu grec.
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: sur le mont des Oliviers
  rationale: Dans la suite géographique, le groupe situe Bethphagé par rapport au mont des Oliviers. « Sur » donne en français une localisation naturelle, tandis que la note conserve la valeur directionnelle plus littérale de εἰς.
- source_word: τότε
  choice: alors
  rationale: « Alors », placé après le verbe, marque naturellement la transition temporelle du récit.
- source_word: ἀπέστειλεν
  choice: envoya
  rationale: Rend directement l’action de charger les disciples d’une mission.
- source_word: δύο μαθητὰς
  choice: deux disciples
  rationale: Équivalent direct et usuel dans le récit évangélique.
theological_decisions:
- issue: Sujet implicite des verbes au pluriel avant la mention de Jésus
  choice: Conserver le pronom pluriel « ils », puis nommer Jésus au moment où le grec le fait.
  alternative: 'Expliciter : « Jésus et ses disciples approchèrent… »'
  rationale: Le contexte permet d’identifier le groupe, mais le verset ne le nomme pas explicitement. La traduction préserve ainsi l’économie narrative et n’ajoute pas de sujet développé.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit et permet de conserver la succession des actions. La formulation évite d’expliciter le groupe sujet au-delà du texte grec.
