    issue: « sur le mont des Oliviers » impose une localisation plus précise que le grec.
    rationale: εἰς est formellement directionnel, même si, dans cette construction, il peut servir à situer Bethphagé par rapport au mont. « Sur » élimine cette ambiguïté et ne correspond pas à la valeur première de la préposition.
  - severity: low
    issue: La note actuelle qualifie « vers le mont des Oliviers » de littéral alors que le texte principal porte « sur le mont des Oliviers ».
    rationale: La note signale utilement la difficulté, mais sa formulation devient incohérente avec le choix du texte principal. Elle doit présenter l’autre analyse syntaxique comme une possibilité plutôt que comme un littéral opposé.
