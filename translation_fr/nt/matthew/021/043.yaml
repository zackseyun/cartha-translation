id: MAT.21.43
reference: Matthew 21:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο λέγω ὑμῖν ὅτι ἀρθήσεται ἀφ’ ὑμῶν ἡ βασιλεία τοῦ θεοῦ καὶ δοθήσεται ἔθνει ποιοῦντι τοὺς καρποὺς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/043.yaml
  text: Therefore I tell you[a], the kingdom of God will be taken away from you and given to a nation producing its fruits.
translation:
  language: fr
  text: 'C’est pourquoi je vous le dis : le royaume de Dieu vous sera enlevé et sera donné à un peuple[a] qui en produira les fruits.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à une nation ». Le grec ἔθνει peut désigner une nation ou un peuple. Ici, le terme présente collectivement les bénéficiaires en les caractérisant par les fruits qu’ils produisent, sans préciser davantage leur identité.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette expression introduit la conclusion tirée de la parabole et de la citation précédentes, tout en restant naturelle en français moderne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule directe et idiomatique qui conserve l’adresse personnelle et solennelle de Jésus.
- source_word: ἀρθήσεται ἀφ’ ὑμῶν
  choice: vous sera enlevé
  rationale: Le futur passif exprime le retrait de ce qui était jusque-là associé aux destinataires. Cette formulation française conserve à la fois le passif et l’idée de séparation.
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Traduction consacrée qui laisse subsister les dimensions conjointes de règne et de domaine, sans réduire l’expression à une seule interprétation.
- source_word: δοθήσεται
  choice: sera donné
  rationale: Le futur passif est explicitement repris en français afin de préserver le parallélisme avec « sera enlevé ».
- source_word: ἔθνει
  choice: à un peuple
  rationale: Au singulier, ἔθνος désigne ici un corps collectif caractérisé par ses fruits. « Peuple » est naturel en français et évite que « nation » soit compris trop étroitement comme un État politique, tout en signalant l’autre traduction possible en note.
- source_word: ποιοῦντι
  choice: qui produira
  rationale: Le participe présent caractérise le peuple par la production des fruits du royaume. Le futur français s’accorde naturellement avec « sera donné » et présente cette production comme la caractéristique attendue du bénéficiaire.
- source_word: τοὺς καρποὺς αὐτῆς
  choice: en produira les fruits
  rationale: Le pronom « en » renvoie au royaume de Dieu, antécédent naturel du féminin αὐτῆς, et le pluriel « les fruits » préserve l’image grecque.
theological_decisions:
- issue: Référent de ἔθνει
  choice: Traduction générique par « un peuple », sans identifier explicitement ce peuple à l’Église, aux non-Juifs ou à un reste renouvelé d’Israël.
  alternative: « une nation », ou une désignation interprétative telle que « l’Église » ou « les non-Juifs »
  rationale: Le grec désigne un bénéficiaire collectif reconnu à sa fécondité, mais ne tranche pas à lui seul entre les diverses identifications théologiques proposées. La traduction préserve donc cette ouverture.
- issue: Sens de « royaume de Dieu » dans cette parole de jugement
  choice: Maintien de l’expression « le royaume de Dieu ».
  alternative: « le règne de Dieu » ou une paraphrase comme « les privilèges liés au royaume »
  rationale: L’expression grecque possède une portée théologique plus large que chacune de ces paraphrases; la conserver évite de préciser au-delà du texte la nature exacte de ce qui est retiré et donné.
translation_notes:
  register: Français international moderne, clair et digne. Le deux-points rend naturellement l’introduction solennelle de la déclaration. Le parallélisme passif « sera enlevé… sera donné » conserve la structure du grec, tandis que « un peuple » évite une lecture exclusivement politique du nom collectif.
