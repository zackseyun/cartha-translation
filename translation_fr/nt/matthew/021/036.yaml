id: MAT.21.36
reference: Matthew 21:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάλιν ἀπέστειλεν ἄλλους δούλους πλείονας τῶν πρώτων, καὶ ἐποίησαν αὐτοῖς ὡσαύτως.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/036.yaml
  text: Again he sent other servants[a], more than the first ones, and they did the same to them.
translation:
  language: fr
  text: De nouveau, il envoya d’autres serviteurs[a], plus nombreux que les premiers, et les vignerons les traitèrent de la même manière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves ». Le mot grec doulous peut désigner des serviteurs ou des esclaves, selon le contexte.
    reason: Alternative lexicale pour δοῦλος.
lexical_decisions:
- source_word: πάλιν
  choice: De nouveau
  rationale: Marque clairement la répétition de l’envoi et convient à un récit en français moderne.
- source_word: ἀπέστειλεν
  choice: il envoya
  rationale: Équivalent narratif simple et direct de l’aoriste de ἀποστέλλω.
- source_word: ἄλλους δούλους
  choice: d’autres serviteurs
  rationale: Dans cette parabole, le rôle d’émissaires du maître est au premier plan. « Serviteurs » est naturel en français, tandis que « esclaves » reste une possibilité lexicale signalée en note.
- source_word: πλείονας τῶν πρώτων
  choice: plus nombreux que les premiers
  rationale: Le comparatif indique que le second groupe compte davantage de personnes que le premier.
- source_word: ἐποίησαν αὐτοῖς ὡσαύτως
  choice: les vignerons les traitèrent de la même manière
  rationale: Rend idiomatiquement l’action exercée envers eux et renvoie au traitement décrit au verset précédent. Le sujet explicite « les vignerons » évite l’ambiguïté des pronoms en français.
theological_decisions:
- issue: Traduction de δοῦλος dans la parabole
  choice: serviteurs
  alternative: esclaves
  rationale: Le contexte met surtout en avant des agents envoyés par leur maître plutôt que leur statut juridique. « Serviteurs » convient donc au texte principal, sans effacer l’autre valeur possible du terme grec, conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. L’ajout explicatif de « les vignerons » reprend le sujet du contexte immédiat afin d’éviter que « ils » puisse sembler désigner les serviteurs; « mais » exprime le contraste narratif implicite sans modifier le contenu de l’action.
