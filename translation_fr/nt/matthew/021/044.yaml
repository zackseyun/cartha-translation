  text: ⸂Καὶ ὁ πεσὼν ἐπὶ τὸν λίθον τοῦτον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ λικμήσει αὐτόν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/044.yaml
  text: And the one who falls on this stone will be broken to pieces[a]; but on whomever it falls[b], it will crush him.
translation:
  language: fr
  text: Celui qui tombera sur cette pierre sera brisé en morceaux ; mais celui sur qui elle tombera, elle l’écrasera[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus imagée : « elle le réduira en poussière » ou « elle le dispersera comme de la paille ».'
    reason: lexical_alternative
  - marker: b
    text: Ce verset est absent de certains manuscrits de Matthieu, mais on trouve un passage parallèle en Luc 20.18.
    reason: textual_variant
lexical_decisions:
- source_word: ὁ πεσὼν
  choice: celui qui tombera
  rationale: Le participe substantivé désigne de façon générale une personne au singulier. Le futur français s’accorde naturellement avec les deux futurs du verset et conserve sa portée proverbiale.
- source_word: ἐπὶ τὸν λίθον τοῦτον
  choice: sur cette pierre
  rationale: Traduction spatiale directe qui maintient λίθος comme « pierre » et le lien avec l’image de la pierre dans le contexte immédiat.
- source_word: συνθλασθήσεται
  choice: sera brisé en morceaux
  rationale: Le futur passif exprime une destruction violente subie par la personne. Cette formulation reste distincte du verbe plus appuyé de la seconde proposition.
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: mais celui sur qui elle tombera
  rationale: 'La construction relative indéfinie est rendue par une tournure française naturelle qui conserve l’inversion du mouvement : c’est désormais la pierre qui tombe sur la personne.'
- source_word: λικμήσει
  choice: elle l’écrasera
  rationale: Le verbe évoque une destruction complète, allant jusqu’à pulvériser ou disperser. « Écrasera » est clair et énergique, tandis que l’image plus précise est signalée en note.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin singulier renvoie à « celui ». La reprise pronominale française conserve cette référence singulière sans lourdeur.
theological_decisions:
- issue: Image de la pierre et jugement
  choice: Conserver l’image concrète de la pierre et les deux mouvements destructeurs sans identifier explicitement la pierre dans le texte du verset.
  alternative: Ajouter que la pierre représente Jésus ou le Messie, ou uniformiser les deux verbes en une seule notion générale de destruction.
  rationale: Le contexte éclaire l’identité et la portée de la pierre, mais ce verset garde une forme proverbiale. La traduction maintient la force du jugement ainsi que la distinction entre les deux verbes sans ajouter d’interprétation.
- issue: Référence générique au masculin singulier
  choice: Employer « celui » et le pronom singulier correspondant.
  alternative: Employer une formulation plurielle ou impersonnelle.
  rationale: Le grec présente une personne représentative au masculin singulier. Le français peut conserver naturellement ce nombre et cette forme.
- issue: Présence du verset dans la tradition manuscrite
  choice: Imprimer le verset et signaler son absence dans certains manuscrits par une note textuelle.
  alternative: Omettre le verset du corps du texte.
  rationale: Le SBLGNT imprime le passage tout en le marquant comme textuellement incertain. Une note rend cette donnée transparente et mentionne le parallèle synoptique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme du grec et le contraste entre la personne qui tombe sur la pierre et la pierre qui tombe sur la personne.
