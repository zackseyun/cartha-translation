  text: καὶ λαβόντες αὐτὸν ἐξέβαλον ἔξω τοῦ ἀμπελῶνος καὶ ἀπέκτειναν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/039.yaml
  text: And they took him[a], threw him out of the vineyard, and killed him.
translation:
  language: fr
  text: Ils le prirent, le jetèrent hors de la vigne et le tuèrent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: se saisirent de lui
  rationale: Le participe aoriste de λαμβάνω introduit l’action préalable. Dans ce contexte hostile, « se saisirent de lui » exprime naturellement la prise de la personne sans alourdir la phrase par « après l’avoir pris ».
- source_word: ἐξέβαλον
  choice: le jetèrent hors
  rationale: ἐκβάλλω désigne ici une expulsion physique. « Jetèrent hors » conserve la force concrète du verbe et s’accorde directement avec le complément de lieu.
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: hors de la vigne
  rationale: La locution indique un mouvement vers l’extérieur de la vigne. « Hors de » rend précisément cette relation spatiale.
- source_word: ἀμπελῶνος
  choice: vigne
  rationale: ἀμπελών désigne un terrain planté de vignes. Dans le français biblique courant et dans cette parabole, « vigne » est naturel, précis et plus idiomatique que « vignoble ».
- source_word: ἀπέκτειναν
  choice: le tuèrent
  rationale: ἀποκτείνω signifie directement « tuer » ou « mettre à mort ». « Le tuèrent » reste sobre et n’ajoute pas la qualification interprétative de « assassinèrent ».
theological_decisions:
- issue: Ordre narratif de l’expulsion et de la mise à mort par rapport aux récits parallèles
  choice: 'Conserver l’ordre explicite de Matthieu : ils jettent le fils hors de la vigne, puis le tuent.'
  alternative: Harmoniser avec Marc et Luc en laissant entendre qu’ils le tuent avant de le jeter hors de la vigne.
  rationale: Le grec de Matthieu enchaîne clairement ἐξέβαλον puis ἀπέκτειναν. La traduction respecte cet ordre propre au récit sans le modifier d’après les passages parallèles.
translation_notes:
  register: Français international moderne, clair et digne. La coordination brève reproduit le rythme narratif du grec. Aucun marqueur de note n’est requis, car aucune variante essentielle ne doit être signalée dans ce verset.
