source:
  edition: SBLGNT
  text: ἤγαγον τὴν ὄνον καὶ τὸν πῶλον, καὶ ἐπέθηκαν ⸀ἐπ’ αὐτῶν τὰ ⸀ἱμάτια, καὶ ἐπεκάθισεν ἐπάνω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/007.yaml
  text: They brought the donkey and the colt[a], and put their cloaks on them, and he sat on them.
translation:
  language: fr
  text: Ils amenèrent l’ânesse et l’ânon, posèrent leurs manteaux sur eux, et il s’assit sur eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre possibilité : « il s’assit sur les manteaux posés sur les animaux ».'
    reason: Le pronom grec pluriel peut renvoyer aux manteaux plutôt qu’aux deux animaux.
lexical_decisions:
- source_word: ἤγαγον
  choice: Ils amenèrent
  rationale: L’aoriste de ἄγω peut signifier « conduire » ou « amener ». Ici, « amenèrent » exprime naturellement que les disciples conduisent les animaux jusqu’à Jésus.
- source_word: τὴν ὄνον
  choice: l’ânesse
  rationale: Le nom ὄνος peut désigner un âne en général, mais l’article féminin et la présence de son petit justifient ici le terme précis et naturel « ânesse ».
- source_word: τὸν πῶλον
  choice: l’ânon
  rationale: πῶλος désigne un jeune animal ; dans ce contexte, il s’agit du petit de l’ânesse. « Ânon » est précis et idiomatique en français.
- source_word: ἐπέθηκαν ἐπ’ αὐτῶν τὰ ἱμάτια
  choice: posèrent sur eux leurs manteaux
  rationale: ἱμάτια désigne ici les vêtements de dessus des disciples. « Manteaux » convient à la scène, et « leurs » explicite naturellement en français l’appartenance indiquée par le contexte.
- source_word: ἐπεκάθισεν ἐπάνω αὐτῶν
  choice: il s’assit dessus
  rationale: Le pronom grec final est pluriel et son antécédent peut être les animaux ou les manteaux. « Dessus » conserve en français un renvoi non résolu, tandis que la note présente l’interprétation courante selon laquelle Jésus s’assit sur les manteaux.
theological_decisions:
- issue: Référent du pronom pluriel final αὐτῶν
  choice: Conserver l’ambiguïté par « il s’assit dessus »
  alternative: « il s’assit sur les manteaux » ou « il monta sur l’un des animaux »
  rationale: L’ambiguïté est syntaxique et narrative plutôt que doctrinale. La formulation principale ne tranche pas entre les animaux et les manteaux ; la note signale l’interprétation contextuelle courante sans l’imposer au texte.
translation_notes:
  register: Français international moderne, clair et digne. « Ânesse » et « ânon » rendent explicitement le lien entre les deux animaux. La tournure « s’assit dessus » préserve avec naturel l’ambiguïté du grec ; le marqueur de note est placé immédiatement après la proposition concernée.
