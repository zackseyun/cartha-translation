id: MAT.21.27
reference: Matthew 21:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες τῷ Ἰησοῦ εἶπαν· Οὐκ οἴδαμεν. ἔφη αὐτοῖς καὶ αὐτός· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/027.yaml
  text: And answering Jesus, they said, “We do not know.” He also said to them, “Neither will I tell you by what authority I do these things.”
translation:
  language: fr
  text: 'Ils répondirent à Jésus : « Nous ne savons pas. » Alors, lui aussi leur dit : « Moi non plus, je ne vous dis pas par quelle autorité je fais ces choses. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες τῷ Ἰησοῦ εἶπαν
  choice: Ils répondirent à Jésus
  rationale: Le participe suivi du verbe de parole introduit leur réponse. En français actuel, « ils répondirent à Jésus » restitue naturellement l’ensemble sans la lourdeur de « ayant répondu, ils dirent ».
- source_word: Οὐκ οἴδαμεν
  choice: Nous ne savons pas
  rationale: Traduction directe de la négation portant sur le savoir, dans un registre sobre et digne.
- source_word: ἔφη αὐτοῖς καὶ αὐτός
  choice: Alors, lui aussi leur dit
  rationale: '« Lui aussi » conserve la réciprocité marquée par καὶ αὐτός : Jésus répond à leur refus par un refus correspondant. « Alors » rend fluide l’enchaînement sans ajouter de causalité forte.'
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: Moi non plus, je ne vous dis pas
  rationale: Le présent « je ne vous dis pas » suit le temps de λέγω et exprime naturellement en français un refus immédiat de révéler l’information. « Moi non plus » met en relief la réponse réciproque.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: par quelle autorité
  rationale: La préposition introduit ici le fondement autorisant l’action. « Par quelle autorité » est l’expression française claire et usuelle dans ce contexte de contestation de légitimité.
- source_word: ταῦτα ποιῶ
  choice: je fais ces choses
  rationale: Le démonstratif pluriel est conservé et renvoie aux actes de Jésus qui font l’objet de la controverse.
theological_decisions:
- issue: Sens de ἐξουσία dans la réponse de Jésus
  choice: autorité
  alternative: droit ou pouvoir
  rationale: Dans cette controverse, la question porte sur la légitimité et la source de l’action de Jésus, non simplement sur sa capacité. « Autorité » conserve cette portée juridique et théologique sans préciser indûment l’origine de cette autorité.
- issue: Valeur temporelle et pragmatique de λέγω
  choice: 'présent de refus : « je ne vous dis pas »'
  alternative: 'futur volitif : « je ne vous dirai pas »'
  rationale: Le grec emploie le présent. Le français au présent reste idiomatique et préserve plus directement la forme du texte, tout en laissant entendre le refus contextuel sans le convertir explicitement en promesse portant sur l’avenir.
translation_notes:
  register: Français moderne international, naturel et digne. Le passé simple convient à la narration biblique écrite, tandis que le dialogue reste direct et courant. Aucun terme confessionnel propre n’est introduit.
