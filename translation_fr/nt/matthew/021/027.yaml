  verdict: approve
  source_fidelity: Le texte rend correctement la réponse des interlocuteurs, leur aveu d’ignorance, puis la réplique réciproque de Jésus. « Par quelle autorité » restitue bien ἐν ποίᾳ ἐξουσίᾳ, et le pluriel de ταῦτα est conservé dans « ces choses ». Le présent français « je ne vous dis pas » est une restitution défendable du présent λέγω dans ce refus dialogué immédiat, sans imposer une nuance future absente de la forme grecque.
  naturalness: Le français est naturel, clair et d’un registre biblique narratif moderne approprié. Le passé simple de narration et le discours direct s’enchaînent avec fluidité. « Lui aussi » et « moi non plus » rendent l’effet de réciprocité, même si cela le souligne légèrement, sans produire de lourdeur notable.
  terminology: « Autorité » est le terme juste et usuel pour ἐξουσία dans ce contexte de légitimité contestée. Aucun terme théologique ou confessionnel indû n’est introduit. Les noms et les pronoms sont correctement employés.
