id: MAT.21.28
reference: Matthew 21:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τί δὲ ὑμῖν δοκεῖ; ἄνθρωπος εἶχεν τέκνα δύο. ⸀προσελθὼν τῷ πρώτῳ εἶπεν· Τέκνον, ὕπαγε σήμερον ἐργάζου ἐν τῷ ⸀ἀμπελῶνι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/028.yaml
  text: But what do you think? A man had two children. Going to the first[a], he said, ‘Child, go work today in the vineyard.’
translation:
  language: fr
  text: '«Qu’en pensez-vous? Un homme avait deux enfants[a]. Il s’approcha du premier et lui dit: “Mon enfant, va travailler aujourd’hui dans la vigne.”»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On traduit aussi «deux fils», mais le grec emploie ici le terme général signifiant «enfants» (τέκνα).
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί δὲ ὑμῖν δοκεῖ;
  choice: Qu’en pensez-vous?
  rationale: Cette tournure rend naturellement l’appel adressé aux auditeurs pour qu’ils portent un jugement. La légère valeur connective de δέ est suffisamment portée par le contexte et n’exige pas ici un «mais» peu naturel en français.
- source_word: ἄνθρωπος
  choice: Un homme
  rationale: Dans ce récit, le nom désigne naturellement un homme présenté comme père et propriétaire de la vigne.
- source_word: τέκνα δύο
  choice: deux enfants
  rationale: τέκνα est le terme général pour des enfants, non le terme grec propre à «fils». Le français permet de conserver cette portée sans lourdeur.
- source_word: προσελθὼν τῷ πρώτῳ εἶπεν
  choice: Il s’approcha du premier et lui dit
  rationale: Le participe aoriste exprime une action qui précède immédiatement la parole; une proposition coordonnée est idiomatique en français et conserve cet enchaînement.
- source_word: Τέκνον
  choice: Mon enfant
  rationale: Le vocatif désigne l’enfant de manière affectueuse. En français, «Mon enfant» est l’interpellation naturelle; le possessif explicite une relation déjà inhérente au contexte plutôt qu’une information nouvelle.
- source_word: ὕπαγε σήμερον ἐργάζου
  choice: va travailler aujourd’hui
  rationale: Cette formulation claire conserve les impératifs et l’indication temporelle, avec un ordre naturel en français moderne.
- source_word: ἐν τῷ ἀμπελῶνι
  choice: dans la vigne
  rationale: «La vigne» est l’équivalent français courant d’un terrain planté de vignes dans le registre biblique et agricole; «dans» maintient la valeur locative de ἐν.
theological_decisions:
- issue: Faut-il rendre τέκνα/τέκνον par «fils» conformément à une tradition de traduction répandue?
  choice: deux enfants / Mon enfant
  alternative: deux fils / Mon fils
  rationale: Le grec emploie τέκνα et τέκνον, termes plus généraux que υἱοί et υἱέ. La traduction conserve cette généralité sans préciser le sexe des enfants au-delà de ce que dit ce verset.
translation_notes:
  register: Français international moderne, clair et digne. Les guillemets français encadrent la parole principale et les guillemets anglais doubles la citation interne. «Qu’en pensez-vous?» est direct et oral sans être familier; «Mon enfant» rend l’adresse paternelle avec naturel.
