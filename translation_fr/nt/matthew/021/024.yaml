  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἐρωτήσω ὑμᾶς κἀγὼ λόγον ἕνα, ὃν ἐὰν εἴπητέ μοι κἀγὼ ὑμῖν ἐρῶ ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/024.yaml
  text: But Jesus answered them[a], “I also will ask you one question, which if you tell me, I also will tell you by what authority I do these things.”
translation:
  language: fr
  text: 'Mais Jésus leur répondit : « Moi aussi, je vous poserai une question[a]. Si vous me donnez la réponse, moi aussi, je vous dirai par quelle autorité je fais cela. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une affaire » ; plus littéralement, « une parole ». Le grec λόγον ἕνα peut désigner une question ou un sujet de discussion.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Mais Jésus leur répondit
  rationale: La tournure grecque associe un participe de réponse à un verbe de parole. Le français naturel les réunit en « répondit », tandis que « mais » rend le léger contraste introduit par δέ dans cet échange.
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: Moi aussi, je vais vous poser
  rationale: « Moi aussi » conserve l'insistance réciproque de κἀγώ. Le futur proche est naturel en français contemporain pour une question que Jésus va poser immédiatement.
- source_word: λόγον ἕνα
  choice: une question
  rationale: Dans ce contexte interrogatif, λόγος désigne le point précis sur lequel Jésus demande une réponse. « Une question » transmet clairement cette valeur, bien que le grec puisse littéralement évoquer une parole ou une affaire.
- source_word: ὃν ἐὰν εἴπητέ μοι
  choice: Si vous me répondez
  rationale: Le relatif grec reprend λόγον ἕνα, mais une subordonnée conditionnelle indépendante est plus naturelle en français. Ici, λέγω signifie donner la réponse demandée.
- source_word: κἀγὼ ὑμῖν ἐρῶ
  choice: je vous dirai moi aussi
  rationale: Cette formulation préserve la réciprocité marquée par le second κἀγώ et rend naturellement le futur ἐρῶ.
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: par quelle autorité
  rationale: La préposition ἐν indique ici l'autorité en vertu de laquelle l'action est accomplie. « Par quelle autorité » est l'expression française idiomatique correspondante.
- source_word: ταῦτα ποιῶ
  choice: je fais cela
  rationale: Le démonstratif neutre pluriel grec renvoie collectivement aux actes contestés de Jésus. En français, le singulier collectif « cela » est plus naturel que « ces choses » sans réduire la portée de la référence.
