  variant: modern international French
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ· Κακοὺς κακῶς ἀπολέσει αὐτούς, καὶ τὸν ἀμπελῶνα ἐκδώσεται ἄλλοις γεωργοῖς, οἵτινες ἀποδώσουσιν αὐτῷ τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/041.yaml
  text: They said to him[a], “He will miserably destroy those wretches, and he will lease the vineyard to other farmers[c][b], who will give him the fruits in their seasons.”
translation:
  language: fr
  text: 'Ils lui répondent : « Il fera périr misérablement ces méchants[a] et donnera la vigne en location à d’autres cultivateurs[b], qui lui en remettront les fruits au moment voulu[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie un jeu de mots entre des termes apparentés, que l’on pourrait rendre plus littéralement : « Il fera misérablement périr ces misérables. »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à d’autres vignerons » ou « à d’autres cultivateurs locataires ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « en leur saison » ou « aux temps fixés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν αὐτῷ
  choice: Ils lui répondent
  rationale: Le présent grec fonctionne dans le récit comme un présent historique. Le présent narratif est naturel en français et « répondent » explicite la relation avec la question précédente sans ajouter de contenu.
- source_word: Κακοὺς κακῶς ἀπολέσει αὐτούς
  choice: Il fera périr misérablement ces misérables
  rationale: La répétition « misérablement / misérables » reproduit autant que possible le jeu emphatique entre l’adjectif κακούς et l’adverbe κακῶς. « Faire périr » exprime la gravité du jugement sans préciser indûment son mode.
- source_word: τὸν ἀμπελῶνα
  choice: la vigne
  rationale: « Vigne » est le terme français naturel pour le terrain planté de ceps et conserve l’imagerie biblique de la parabole.
- source_word: ἐκδώσεται
  choice: donnera … en location
  rationale: Dans ce contexte agricole, le verbe désigne la mise en location du domaine. Cette tournure évite l’ambiguïté possible du seul verbe français « louer ».
- source_word: ἄλλοις γεωργοῖς
  choice: à d’autres vignerons
  rationale: Dans le cadre précis d’une vigne, « vignerons » désigne naturellement ceux qui la cultivent; la mise en location indique qu’ils en sont aussi les exploitants locataires.
- source_word: ἀποδώσουσιν αὐτῷ
  choice: lui en remettront
  rationale: Le verbe grec évoque ce qui est rendu ou versé comme dû. « Remettront » conserve cette idée, tandis que « en » rattache clairement les fruits à la vigne.
- source_word: τοὺς καρποὺς ἐν τοῖς καιροῖς αὐτῶν
  choice: les fruits en leur saison
  rationale: Cette formulation garde à la fois l’image concrète des fruits et la notion des moments appropriés ou fixés pour leur remise.
theological_decisions:
- issue: Force et nature du jugement annoncé contre les vignerons
  choice: Il fera périr misérablement ces misérables
  alternative: Il fera subir à ces hommes mauvais une fin terrible
  rationale: Le texte formule un jugement sévère au moyen d’un jeu de mots emphatique, sans définir techniquement la forme ultime du châtiment. La traduction en conserve la force et l’écho lexical sans ajouter de précision doctrinale.
translation_notes:
  register: Français international actuel, digne et lisible. Le présent narratif maintient la vivacité du récit. Le jeu de mots volontairement marqué « misérablement / misérables » reflète l’emphase grecque; les notes signalent des formulations françaises plus idiomatiques et les nuances du bail agricole et du moment dû.
