revisions:
- from: 'Ils lui répondent : « Il fera périr misérablement ces misérables[a] et donnera la vigne en location à d’autres vignerons[b], qui lui en remettront les fruits en leur saison[c]. »'
  to: 'Ils lui répondent : « Il fera périr misérablement ces méchants[a] et donnera la vigne en location à d’autres cultivateurs[b], qui lui en remettront les fruits au moment voulu[c]. »'
  rationale: La révision distingue plus nettement le jugement moral porté par κακούς (« ces méchants ») de l’adverbe κακῶς (« misérablement »), sans prétendre reproduire pleinement un jeu de mots grec difficile à transposer. Elle remplace « vignerons » par le terme plus large « cultivateurs » et rend ἐν τοῖς καιροῖς αὐτῶν par une expression française naturelle indiquant la remise due au temps approprié. Les trois ancres de note sont conservées et chacune est placée sur l’élément pertinent.
