id: MAT.21.35
reference: Matthew 21:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λαβόντες οἱ γεωργοὶ τοὺς δούλους αὐτοῦ ὃν μὲν ἔδειραν, ὃν δὲ ἀπέκτειναν, ὃν δὲ ἐλιθοβόλησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/035.yaml
  text: And the tenant farmers took his slaves; one they beat[a], another they killed, and another they stoned.
translation:
  language: fr
  text: 'Les vignerons se saisirent de ses esclaves[a] : ils battirent l’un, tuèrent un autre et en lapidèrent un troisième.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec peut désigner des esclaves ou, selon le contexte, des serviteurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: vignerons
  rationale: Dans le contexte immédiat de la parabole de la vigne, le terme désigne ceux qui exploitent la vigne confiée par le propriétaire. « Vignerons » est la désignation française naturelle, sans les réduire à de simples ouvriers agricoles.
- source_word: λαβόντες
  choice: se saisirent de
  rationale: Le participe aoriste exprime une action antérieure aux violences qui suivent. « Se saisirent de » rend naturellement la prise hostile impliquée par le contexte.
- source_word: δούλους
  choice: esclaves
  rationale: Le terme grec désigne des personnes placées sous l’autorité du propriétaire. « Esclaves » conserve ici le statut de dépendance exprimé par δοῦλοι, tandis que « serviteurs » reste une possibilité contextuelle signalée en note.
- source_word: ἔδειραν
  choice: battirent
  rationale: Le verbe signifie battre ou frapper rudement. « Battirent » est précis et naturel sans imposer une méthode particulière comme la flagellation.
- source_word: ἀπέκτειναν
  choice: tuèrent
  rationale: Rend directement le sens du verbe sans ajouter la qualification juridique et morale de « assassinèrent ».
- source_word: ἐλιθοβόλησαν
  choice: lapidèrent
  rationale: Le verbe désigne explicitement l’action d’attaquer ou de mettre à mort à coups de pierres; « lapidèrent » en est l’équivalent français concis.
- source_word: ὃν μὲν ... ὃν δὲ ... ὃν δὲ
  choice: l’un ... un autre ... un troisième
  rationale: Cette formulation française fait clairement comprendre que trois esclaves subissent des traitements différents et reproduit la distribution marquée par la construction grecque.
theological_decisions:
- issue: Traduction de δοῦλος dans le récit parabolique
  choice: esclaves
  alternative: serviteurs
  rationale: « Esclaves » maintient la réalité du statut de dépendance portée par le terme grec et évite de l’adoucir. Comme « serviteurs » peut convenir lorsque la fonction d’émissaire est mise au premier plan, cette possibilité est conservée en note plutôt que substituée dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. La coordination resserrée conserve le rythme brutal de la triple action. « Vignerons » convient au cadre explicite de la vigne, et « se saisirent de » rend idiomatiquement le passage du participe grec aux verbes principaux.
