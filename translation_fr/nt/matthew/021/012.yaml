id: MAT.21.12
reference: Matthew 21:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν ⸀Ἰησοῦς εἰς τὸ ⸀ἱερόν, καὶ ἐξέβαλεν πάντας τοὺς πωλοῦντας καὶ ἀγοράζοντας ἐν τῷ ἱερῷ καὶ τὰς τραπέζας τῶν κολλυβιστῶν κατέστρεψεν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστεράς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/012.yaml
  text: And Jesus entered the temple courts and drove out all those selling and buying in the temple courts[a], and he overturned the tables of the money changers and the seats of those selling doves.
translation:
  language: fr
  text: Puis Jésus entra dans l’enceinte du Temple et chassa tous ceux qui y vendaient et y achetaient[a]. Il renversa les tables des changeurs et les sièges des vendeurs de colombes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Temple » ou « dans les cours du Temple » ; le mot grec désigne l’ensemble du complexe du Temple plutôt que spécifiquement le sanctuaire intérieur.
    reason: Alternative lexicale précisant la portée spatiale de ἱερόν.
lexical_decisions:
- source_word: ἱερόν
  choice: enceinte du Temple
  rationale: Le terme désigne ici l’ensemble du domaine du Temple, et non spécifiquement le sanctuaire intérieur (ναός). « Enceinte du Temple » situe naturellement l’activité commerciale dans les espaces accessibles du complexe.
- source_word: ἐξέβαλεν
  choice: chassa
  rationale: Le verbe exprime une expulsion énergique et décidée. « Chassa » est naturel, vif et fidèle au contexte.
- source_word: πάντας
  choice: tous
  rationale: Le terme marque explicitement l’étendue de l’action et doit être conservé.
- source_word: τοὺς πωλοῦντας καὶ ἀγοράζοντας
  choice: ceux qui y vendaient et y achetaient
  rationale: Cette formulation française naturelle conserve les deux participes et l’activité en cours, tandis que « y » renvoie sans lourdeur à l’enceinte du Temple.
- source_word: τράπεζας
  choice: tables
  rationale: Le sens ordinaire convient au mobilier utilisé par les changeurs et ne précise pas au-delà du grec.
- source_word: κολλυβιστῶν
  choice: changeurs
  rationale: Dans ce contexte, le terme désigne ceux qui changeaient des monnaies. « Changeurs » est l’équivalent français traditionnel, clair et concis.
- source_word: κατέστρεψεν
  choice: renversa
  rationale: Dans ce contexte, le verbe décrit le fait de retourner ou renverser les tables, sans nécessairement évoquer leur destruction.
- source_word: καθέδρας
  choice: sièges
  rationale: « Sièges » rend le terme de façon exacte et suffisamment large, dans un registre narratif digne.
- source_word: περιστεράς
  choice: colombes
  rationale: Le mot peut désigner des colombes ou des pigeons; « colombes » est naturel dans le contexte des offrandes sacrificielles et reste l’équivalent français établi.
theological_decisions:
- issue: Portée de ἱερόν par rapport au lieu où Jésus agit
  choice: Jésus entre dans l’enceinte du Temple, c’est-à-dire dans le complexe du Temple plutôt que dans le sanctuaire intérieur.
  alternative: Employer simplement « le Temple », sans expliciter la distinction spatiale.
  rationale: Cette précision respecte la distinction lexicale entre ἱερόν et ναός et évite de laisser entendre que Jésus pénètre dans le lieu saint proprement dit, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase grecque longue est divisée en deux pour améliorer la lisibilité sans modifier la progression des actions. La majuscule à « Temple » distingue ici le complexe de Jérusalem comme lieu particulier.
