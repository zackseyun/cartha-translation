id: MAT.21.4
reference: Matthew 21:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τοῦτο ⸀δὲ γέγονεν ἵνα πληρωθῇ τὸ ῥηθὲν διὰ τοῦ προφήτου λέγοντος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/004.yaml
  text: 'This happened so that what was spoken through the prophet might be fulfilled[a], saying:'
translation:
  language: fr
  text: 'Cela est arrivé afin que s’accomplisse ce qui avait été dit par l’intermédiaire du prophète[a], en ces termes :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par le prophète ». Le grec dit plus littéralement « par l’intermédiaire du prophète », ce qui souligne la médiation prophétique.
    reason: alternative lexicale
lexical_decisions:
- source_word: Τοῦτο
  choice: Cela
  rationale: Le démonstratif neutre singulier renvoie à l’événement qui vient d’être raconté dans son ensemble. « Cela » est naturel en français et respecte le singulier grec.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, δέ assure une liaison narrative légère, sans opposition marquée. Le français enchaîne naturellement la phrase sans ajouter « or » ou « mais », qui risqueraient de surcharger la transition.
- source_word: γέγονεν
  choice: est arrivé
  rationale: Le parfait de γίνομαι désigne ici l’événement qui s’est produit dans une formule d’accomplissement. « Est arrivé » est idiomatique et garde la valeur événementielle.
- source_word: ἵνα πληρωθῇ
  choice: afin que s’accomplisse
  rationale: Cette formulation rend la construction finale avec le subjonctif passif, tout en restant naturelle et digne en français.
- source_word: τὸ ῥηθὲν
  choice: ce qui avait été dit
  rationale: Le participe substantivé passif désigne la parole prononcée auparavant. Le plus-que-parfait explicite naturellement son antériorité par rapport au récit.
- source_word: διὰ τοῦ προφήτου
  choice: par l’intermédiaire du prophète
  rationale: διά avec le génitif exprime ici la médiation ou l’agent intermédiaire. Cette tournure préserve plus nettement cette nuance que le simple « par le prophète ».
- source_word: λέγοντος
  choice: en ces termes
  rationale: Le participe introduit la citation qui suit. « En ces termes » remplit cette fonction de façon idiomatique en français sans imposer artificiellement « disant ».
theological_decisions:
- issue: Accomplissement et médiation prophétique
  choice: « ce qui avait été dit par l’intermédiaire du prophète »
  alternative: « ce que le prophète avait dit » ou « ce qui avait été dit par le prophète »
  rationale: Le texte présente la parole antérieure comme transmise au moyen du prophète. La formulation retenue conserve cette médiation sans préciser explicitement un locuteur divin que le verset ne nomme pas.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la formule d’accomplissement biblique sans archaïsme. « En ces termes » introduit naturellement la citation du verset suivant.
