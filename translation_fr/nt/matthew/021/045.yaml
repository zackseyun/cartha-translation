id: MAT.21.45
reference: Matthew 21:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀκούσαντες οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι τὰς παραβολὰς αὐτοῦ ἔγνωσαν ὅτι περὶ αὐτῶν λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/045.yaml
  text: And when the chief priests and the Pharisees heard his parables[a], they knew that he was speaking about them.
translation:
  language: fr
  text: Quand les chefs des prêtres et les pharisiens entendirent ses paraboles, ils comprirent qu’il parlait d’eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à leur sujet ». Ils comprirent que les paraboles les visaient. Certaines traductions rendent, de manière plus interprétative : « contre eux ».'
    reason: Alternative lexicale pour περὶ αὐτῶν et clarification du sens contextuel sans renforcer le texte principal.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: quand … entendirent
  rationale: Le participe aoriste antérieur au verbe principal exprime ici naturellement une circonstance temporelle. Cette tournure est fluide en français moderne et conserve la succession des faits.
- source_word: ἀρχιερεῖς
  choice: chefs des prêtres
  rationale: Le pluriel désigne les principaux responsables du sacerdoce, et non plusieurs titulaires simultanés de la fonction unique de grand prêtre. « Chefs des prêtres » rend ce sens clairement pour le lecteur moderne.
- source_word: Φαρισαῖοι
  choice: pharisiens
  rationale: Désignation française conventionnelle de ce groupe juif; la minuscule suit l’usage courant pour les membres d’un mouvement religieux.
- source_word: παραβολὰς
  choice: paraboles
  rationale: Terme français établi et précis pour cette catégorie de récits et de paroles figurées de Jésus dans les Évangiles synoptiques.
- source_word: ἔγνωσαν
  choice: ils comprirent
  rationale: Dans ce contexte, l’aoriste de γινώσκω indique qu’ils saisirent ou reconnurent que les paraboles les concernaient. « Comprirent » exprime clairement cette prise de conscience.
- source_word: περὶ αὐτῶν
  choice: d’eux
  rationale: περί avec le génitif signifie normalement « au sujet de, concernant ». « D’eux » reste proche du grec sans renforcer indûment le sens en « contre eux ».
- source_word: λέγει
  choice: il parlait
  rationale: Le présent grec dans le discours indirect se rend naturellement par l’imparfait français après « ils comprirent », tout en conservant l’idée que les propos de Jésus les concernaient.
theological_decisions:
- issue: Faut-il expliciter que les paraboles de Jésus condamnaient les responsables religieux?
  choice: il parlait d’eux
  alternative: il parlait contre eux
  rationale: Le contexte montre que les paraboles sont critiques, mais le grec dit littéralement qu’il parle « à leur sujet ». La traduction conserve cette formulation sans introduire dans le texte principal une valeur adversative plus forte.
translation_notes:
  register: Français moderne, naturel et digne. La phrase suit la progression du grec tout en évitant une construction participiale lourde. « Chefs des prêtres » privilégie la clarté fonctionnelle pour un lectorat international.
