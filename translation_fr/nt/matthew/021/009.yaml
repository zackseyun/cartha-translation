id: MAT.21.9
reference: Matthew 21:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι οἱ προάγοντες ⸀αὐτὸν καὶ οἱ ἀκολουθοῦντες ἔκραζον λέγοντες· Ὡσαννὰ τῷ υἱῷ Δαυίδ· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου· Ὡσαννὰ ἐν τοῖς ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/009.yaml
  text: And the crowds going ahead of him and those following were crying out[a], saying[c][b], “Hosanna to the Son of David! Blessed is the one who comes in the name of the Lord! Hosanna in the highest!”
translation:
  language: fr
  text: 'Les foules qui marchaient devant lui et celles qui le suivaient criaient : « Hosanna[a] au Fils de David[b] ! Béni soit celui qui vient au nom du Seigneur[c] ! Hosanna au plus haut des cieux ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Hosanna » est une acclamation issue de l’hébreu, qui signifie à l’origine quelque chose comme « sauve, de grâce » ou « sauve maintenant »; ici, elle sert aussi de cri de louange.
    reason: lexical_alternative
  - marker: b
    text: « Fils de David » est un titre royal et messianique.
    reason: cultural_note
  - marker: c
    text: Cette parole reprend le Psaume 118.26, où « le Seigneur » correspond au nom divin YHWH dans le texte hébreu.
    reason: cross_reference
lexical_decisions:
- source_word: ὄχλοι
  choice: foules
  rationale: « Foules » rend naturellement le pluriel grec et évoque les groupes nombreux rassemblés autour de Jésus.
- source_word: προάγοντες αὐτὸν
  choice: qui marchaient devant lui
  rationale: Cette formulation décrit clairement leur position dans le cortège sans laisser entendre qu’ils dirigeaient officiellement Jésus.
- source_word: ἀκολουθοῦντες
  choice: celles qui le suivaient
  rationale: Le démonstratif reprend « les foules » et conserve le parallélisme entre les personnes placées devant et derrière Jésus.
- source_word: ἔκραζον λέγοντες
  choice: 'criaient :'
  rationale: L’imparfait « criaient » restitue l’action prolongée. En français, les deux-points introduisent naturellement les paroles et rendent inutile le calque pesant « criaient en disant ».
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: La translittération conserve cette acclamation liturgique reconnue et sa résonance scripturaire; son sens hébraïque sous-jacent est précisé en note.
- source_word: τῷ υἱῷ Δαυίδ
  choice: au Fils de David
  rationale: Le datif est naturellement rendu par « au ». La formule conserve le titre royal et messianique employé par le texte grec.
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: Béni soit celui qui vient
  rationale: Cette tournure française naturelle convient à une acclamation et conserve le participe substantivé singulier sans en expliciter davantage l’identité.
- source_word: ἐν ὀνόματι κυρίου
  choice: au nom du Seigneur
  rationale: Cette expression française établie préserve à la fois la formulation grecque, l’idée d’autorisation et l’écho au Psaume 118.
- source_word: ἐν τοῖς ὑψίστοις
  choice: dans les hauteurs
  rationale: Cette formulation concise conserve la référence spatiale élevée du pluriel grec sans préciser explicitement « les cieux », qui reste une interprétation plausible.
theological_decisions:
- issue: Le titre royal et messianique τῷ υἱῷ Δαυίδ
  choice: Conserver « au Fils de David » dans le texte.
  alternative: « au Messie »
  rationale: Le grec emploie expressément le titre davidique. Le remplacer par son interprétation messianique effacerait une composante historique et scripturaire du passage.
- issue: La valeur de Ὡσαννά
  choice: Garder « Hosanna » dans le texte et en expliquer le sens sous-jacent en note.
  alternative: « Sauve-nous, de grâce » ou « Sauve maintenant »
  rationale: Ici, le terme fonctionne comme une acclamation liturgique chargée d’une dimension de louange, tout en gardant à l’arrière-plan son origine suppliante.
- issue: La référence de κυρίου dans la citation du Psaume
  choice: Traduire κύριος par « Seigneur » et signaler en note l’arrière-plan hébreu.
  alternative: Employer directement le nom divin YHWH dans le texte.
  rationale: Le texte grec porte κύριος. La note préserve son lien avec le nom divin dans le texte hébreu du Psaume sans substituer celui-ci au mot grec.
- issue: La localisation exprimée par ἐν τοῖς ὑψίστοις
  choice: Employer « dans les hauteurs » sans expliciter davantage.
  alternative: « au plus haut des cieux »
  rationale: La seconde formulation exprime probablement le référent visé, mais ajoute explicitement « cieux ». « Dans les hauteurs » préserve mieux la légère indétermination de l’expression grecque.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme exclamatif de l’acclamation est conservé; les formulations inutilement archaïques et les calques grecs pesants sont évités.
