id: MAT.21.19
reference: Matthew 21:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν μίαν ἐπὶ τῆς ὁδοῦ ἦλθεν ἐπ’ αὐτήν, καὶ οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον, καὶ λέγει αὐτῇ· ⸀Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα· καὶ ἐξηράνθη παραχρῆμα ἡ συκῆ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/019.yaml
  text: And seeing a fig tree by the road[a], he came up to it and found nothing on it except leaves alone. And he said to it, “May there no longer ever be fruit from you.” And the fig tree withered at once.
translation:
  language: fr
  text: 'Voyant un figuier au bord du chemin, il s’en approcha et n’y trouva que des feuilles. Il lui dit : « Que plus jamais aucun fruit ne vienne de toi ! » Et aussitôt, le figuier se dessécha.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συκῆν μίαν
  choice: un figuier
  rationale: Dans ce contexte, μίαν introduit naturellement un individu sans qu’il soit nécessaire d’appuyer « un seul ».
- source_word: ἐπὶ τῆς ὁδοῦ
  choice: au bord du chemin
  rationale: Cette expression locative convient à un arbre situé à côté du chemin et sonne naturellement en français.
- source_word: ἦλθεν ἐπ’ αὐτήν
  choice: il s’en approcha
  rationale: Rend clairement le mouvement de Jésus vers l’arbre.
- source_word: οὐδὲν εὗρεν ἐν αὐτῇ εἰ μὴ φύλλα μόνον
  choice: n’y trouva que des feuilles
  rationale: La tournure restrictive française « ne… que » rend idiomatiquement l’idée qu’il n’y avait rien d’autre que des feuilles; μόνον renforce cette exclusivité.
- source_word: λέγει αὐτῇ
  choice: il lui dit
  rationale: Le présent historique grec est rendu au passé simple, conformément à la narration française courante.
- source_word: Μηκέτι ἐκ σοῦ καρπὸς γένηται εἰς τὸν αἰῶνα
  choice: Que plus jamais aucun fruit ne vienne de toi !
  rationale: La formulation conserve le tour jussif, l’image d’un fruit venant de l’arbre et la permanence exprimée conjointement par Μηκέτι et εἰς τὸν αἰῶνα.
- source_word: ἐξηράνθη παραχρῆμα
  choice: aussitôt, le figuier se dessécha
  rationale: « Se dessécha » rend le dépérissement de l’arbre, et « aussitôt » préserve l’immédiateté de παραχρῆμα.
theological_decisions:
- issue: Portée de la parole adressée au figuier
  choice: 'Une déclaration jussive solennelle : « Que plus jamais aucun fruit ne vienne de toi ! »'
  alternative: 'Une prédiction déclarative, par exemple : « Tu ne porteras plus jamais de fruit. »'
  rationale: Le subjonctif γένηται avec Μηκέτι soutient une parole prohibitive ou imprécatoire. La traduction maintient cette force sans ajouter d’interprétation symbolique ni préciser le mécanisme.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination grecque est légèrement lissée par « mais » pour expliciter le contraste déjà présent entre l’approche et la découverte. Aucun marqueur de note n’est requis.
