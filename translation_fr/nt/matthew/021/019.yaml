  naturalness: Le français est moderne, fluide et d’un registre narratif approprié. « Que plus jamais aucun fruit ne vienne de toi ! » est naturel tout en conservant l’image grecque du fruit venant de l’arbre.
  terminology: « Figuier », « chemin », « fruit » et « se dessécha » conviennent au sens et au registre. La tournure jussive évite d’imposer une interprétation doctrinale ou symbolique.
