id: MAT.21.46
reference: Matthew 21:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ζητοῦντες αὐτὸν κρατῆσαι ἐφοβήθησαν τοὺς ὄχλους, ⸂ἐπεὶ εἰς⸃ προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/046.yaml
  text: And although they were seeking to arrest him[a], they feared the crowds, because they regarded him as a prophet.
translation:
  language: fr
  text: Ils cherchaient à l’arrêter, mais ils eurent peur des foules, car celles-ci le tenaient pour un prophète[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le considéraient comme un prophète ».
    reason: Variante lexicale naturelle pour l’expression idiomatique εἰς προφήτην αὐτὸν εἶχον.
lexical_decisions:
- source_word: ζητοῦντες
  choice: Ils cherchaient
  rationale: Le participe présent exprime une intention persistante. La coordination avec « mais » rend naturellement en français le contraste contextuel entre leur projet et la peur qui les retient.
- source_word: κρατῆσαι
  choice: à l’arrêter
  rationale: Dans ce contexte hostile, le verbe désigne le fait de se saisir de Jésus pour le mettre sous contrôle; « arrêter » exprime clairement cette action en français actuel.
- source_word: ἐφοβήθησαν
  choice: ils eurent peur
  rationale: Cette formulation directe rend l’aoriste sans lui imposer une nuance supplémentaire et conserve la peur éprouvée devant les foules.
- source_word: τοὺς ὄχλους
  choice: des foules
  rationale: Le pluriel du texte grec est conservé; il désigne les groupes de gens présents.
- source_word: ἐπεὶ εἰς
  choice: car
  rationale: La conjonction introduit la raison de leur peur. « Car » relie clairement cette explication à la proposition précédente dans un registre narratif digne.
- source_word: εἰς προφήτην αὐτὸν εἶχον
  choice: celles-ci le tenaient pour un prophète
  rationale: « Tenir quelqu’un pour » rend l’expression idiomatique grecque et rapporte l’opinion des foules. « Celles-ci » explicite le sujet logique afin d’éviter que le lecteur français l’attribue aux chefs religieux.
- source_word: προφήτην
  choice: un prophète
  rationale: 'L’indéfini français convient ici: les foules plaçaient Jésus dans la catégorie des prophètes.'
theological_decisions:
- issue: Rendre l’évaluation de Jésus comme προφήτην sans importer ni nier des affirmations christologiques dépassant le verset
  choice: elles le tenaient pour un prophète
  alternative: elles le considéraient comme un prophète
  rationale: Le verset rapporte le regard des foules plutôt qu’une définition exhaustive de l’identité de Jésus. Cette formulation préserve ce point de vue narratif sans suggérer qu’il n’était qu’un prophète.
translation_notes:
  register: Français international moderne, clair et digne. « Mais » explicite le contraste porté par le contexte, tandis que « celles-ci » lève une ambiguïté référentielle qui serait gênante en français. Le marqueur de note est placé sur l’expression à laquelle la variante se rapporte.
