id: MAT.21.21
reference: Matthew 21:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν, ἐὰν ἔχητε πίστιν καὶ μὴ διακριθῆτε, οὐ μόνον τὸ τῆς συκῆς ποιήσετε, ἀλλὰ κἂν τῷ ὄρει τούτῳ εἴπητε· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, γενήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/021.yaml
  text: But Jesus answered them[a], “Truly I say to you, if you have faith and do not doubt, you will not only do what was done to the fig tree, but even if you say to this mountain, ‘Be taken up and thrown into the sea,’ it will happen.”
translation:
  language: fr
  text: 'Mais Jésus leur répondit : « Vraiment, je vous le dis, si vous avez la foi et ne doutez pas[a], non seulement vous ferez ce qui a été fait au figuier, mais même si vous dites à cette montagne : “Sois soulevée et jetée dans la mer”, cela arrivera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne vacillez pas » ou « ne soyez pas partagés intérieurement ».
    reason: Alternative lexicale reflétant les nuances possibles de διακρίνω dans ce contexte.
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: Mais Jésus leur répondit
  rationale: La tournure française rend naturellement le participe de réponse suivi du verbe de parole, tandis que « mais » conserve la légère transition marquée par δέ.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Vraiment, je vous le dis
  rationale: Cette formule française actuelle conserve la solennité et l'autorité de l'amen introductif sans employer une tournure archaïque.
- source_word: ἐὰν ἔχητε πίστιν
  choice: si vous avez la foi
  rationale: Dans ce contexte, πίστις désigne une confiance placée en Dieu plutôt que la fidélité comme qualité morale.
- source_word: μὴ διακριθῆτε
  choice: ne doutez pas
  rationale: Le verbe exprime ici l'hésitation intérieure ou le doute. La formulation principale est claire et idiomatique; la nuance de vacillement est signalée en note.
- source_word: οὐ μόνον τὸ τῆς συκῆς ποιήσετε
  choice: non seulement vous ferez ce qui a été fait au figuier
  rationale: L'expression grecque est elliptique et renvoie à l'événement qui vient de toucher le figuier. Cette formulation explicite sobrement l'ellipse.
- source_word: κἂν τῷ ὄρει τούτῳ εἴπητε
  choice: même si vous dites à cette montagne
  rationale: « Même si » restitue la progression emphatique de κἄν, et le démonstratif conserve la référence à une montagne présente ou visible.
- source_word: Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν
  choice: Sois soulevée et jetée dans la mer
  rationale: Les deux passifs et l'image physique du grec sont conservés dans une expression française naturelle et vive.
- source_word: γενήσεται
  choice: cela arrivera
  rationale: Cette formulation rend directement l'idée que l'événement annoncé se produira, sans archaïsme.
theological_decisions:
- issue: Sens de πίστις dans une parole concernant une action extraordinaire
  choice: foi
  alternative: confiance; fidélité
  rationale: Le contexte met en avant la confiance assurée plutôt que la fidélité comme trait de caractère; « foi » demeure toutefois assez large pour ne pas surdéfinir son objet.
- issue: Portée de l'image de la montagne déplacée
  choice: Conserver l'image telle quelle, sans en imposer une lecture exclusivement littérale ou métaphorique
  alternative: Promesse strictement littérale; simple métaphore des obstacles surmontés
  rationale: La formulation imagée du texte doit garder toute sa force et son ouverture interprétative, sans résoudre artificiellement la tension.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de la phrase grecque, tout en évitant les calques lourds et les tournures archaïques.
