source:
  edition: SBLGNT
  text: ὕστερον δὲ ἀπέστειλεν πρὸς αὐτοὺς τὸν υἱὸν αὐτοῦ λέγων· Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/037.yaml
  text: But later he sent his son to them[a], saying, ‘They will respect my son.’
translation:
  language: fr
  text: 'Mais plus tard, il leur envoya son fils en disant : « Ils respecteront mon fils. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils auront des égards pour mon fils. » Le verbe grec peut exprimer le respect ou la déférence ; dans d’autres contextes, il peut aussi signifier « avoir honte » ou « éprouver de la honte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: plus tard
  rationale: Cette expression temporelle rend naturellement l’idée de postériorité, sans ajouter la nuance plus forte de « finalement ».
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une transition légèrement contrastive entre l’envoi des serviteurs et celui du fils.
- source_word: ἀπέστειλεν πρὸς αὐτοὺς
  choice: il leur envoya
  rationale: Cette formulation française exprime simplement l’envoi dirigé vers les vignerons, sans donner au verbe un sens technique.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: son fils
  rationale: Le possessif est naturel en français et n’ajoute ni « bien-aimé » ni une insistance absente du grec.
- source_word: λέγων
  choice: en se disant
  rationale: Dans ce récit, le participe introduit les paroles délibératives du propriétaire. « En se disant » est naturel en français et indique qu’il formule cette attente pour lui-même, sans changer le contenu cité.
- source_word: Ἐντραπήσονται
  choice: Ils respecteront
  rationale: Avec « mon fils » comme complément direct, le verbe exprime ici le respect ou la déférence. « Respecteront » est clair et actuel, tout en laissant une autre nuance lexicale en note.
- source_word: τὸν υἱόν μου
  choice: mon fils
  rationale: Cette traduction conserve la force personnelle et relationnelle de l’expression grecque.
theological_decisions:
- issue: Présenter le fils de la parabole sans expliciter excessivement sa portée christologique
  choice: son fils / mon fils
  alternative: son Fils / son fils bien-aimé
  rationale: Le grec emploie ici le nom ordinaire υἱός, sans ἀγαπητός. La traduction préserve donc la forme narrative et laisse le contexte faire ressortir la portée christologique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque ; « en se disant » évite la tournure plus lourde « disant » et rend naturellement la délibération du personnage.
