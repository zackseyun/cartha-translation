id: MAT.21.25
reference: Matthew 21:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ βάπτισμα ⸀τὸ Ἰωάννου πόθεν ἦν; ἐξ οὐρανοῦ ἢ ἐξ ἀνθρώπων; οἱ δὲ διελογίζοντο ⸀ἐν ἑαυτοῖς λέγοντες· Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ ἡμῖν· Διὰ τί οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/025.yaml
  text: The baptism of John—from where was it? From heaven or from men? And they were reasoning among themselves[a], saying, “If we say, ‘From heaven,’ he will say to us[b], ‘Why then did you not believe him?’”
translation:
  language: fr
  text: '« Le baptême de Jean, d’où venait-il ? Du ciel[a] ou des êtres humains[b] ? » Ils raisonnaient entre eux : « Si nous disons : “Du ciel”, il nous dira : “Pourquoi donc ne l’avez-vous pas cru ?” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de Dieu » ; littéralement « du ciel », expression révérencielle indiquant une origine divine.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « des humains » : il s’agit d’une origine purement humaine, opposée à l’origine céleste.'
    reason: lexical_clarification
lexical_decisions:
- source_word: βάπτισμα
  choice: baptême
  rationale: Le terme désigne ici le baptême associé au ministère de Jean, et non simplement une ablution ou une action en cours.
- source_word: τὸ Ἰωάννου
  choice: de Jean
  rationale: Le génitif associe le baptême à Jean; cette formulation française est naturelle et conserve sans la préciser davantage la nature exacte de cette association.
- source_word: πόθεν ἦν
  choice: d’où venait-il
  rationale: La question porte sur l’origine ou la source. Cette tournure est idiomatique en français moderne tout en gardant cette orientation.
- source_word: ἐξ οὐρανοῦ
  choice: du ciel
  rationale: La traduction littérale préserve la manière révérencielle de désigner une origine divine et le contraste rhétorique du texte.
- source_word: ἐξ ἀνθρώπων
  choice: des êtres humains
  rationale: ἄνθρωποι désigne ici les humains en général, sans référence particulière au sexe masculin; cette formulation explicite correctement l’opposition entre origine divine et origine purement humaine.
- source_word: διελογίζοντο ἐν ἑαυτοῖς
  choice: ils raisonnaient entre eux
  rationale: L’imparfait exprime une délibération en cours, et « entre eux » rend la dimension collective de leur réflexion.
- source_word: λέγοντες
  choice: deux-points introduisant le discours direct
  rationale: En français, le contenu de leur délibération est naturellement introduit par deux-points; la valeur du participe est ainsi conservée sans lourdeur.
- source_word: Ἐὰν εἴπωμεν
  choice: si nous disons
  rationale: Cette formulation rend directement et naturellement la condition éventuelle exprimée par le grec.
- source_word: ἐρεῖ ἡμῖν
  choice: il nous dira
  rationale: Cette traduction conserve le verbe de parole et introduit naturellement la citation directe.
- source_word: Διὰ τί οὖν
  choice: pourquoi donc
  rationale: « Donc » maintient la force déductive et argumentative de οὖν.
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: ne l’avez-vous pas cru
  rationale: Avec le datif de personne, πιστεύω signifie ici croire Jean, c’est-à-dire accueillir comme vrai son témoignage et son message.
theological_decisions:
- issue: Sens de « du ciel »
  choice: Conserver « du ciel » dans le texte principal.
  alternative: « de Dieu »
  rationale: L’expression grecque désigne révérencieusement une origine ou une autorisation divine. La conserver évite de remplacer l’image du texte par son interprétation explicite.
- issue: Portée de ἀνθρώπων
  choice: Employer « des êtres humains » au sens générique.
  alternative: « des hommes » ou « des gens »
  rationale: L’opposition concerne l’origine humaine par contraste avec l’origine céleste, non les hommes de sexe masculin. « Êtres humains » est précis et garde la portée générale.
- issue: Portée de « croire Jean »
  choice: Conserver la formulation personnelle « ne l’avez-vous pas cru ? »
  alternative: « n’avez-vous pas cru en lui ? » ou « n’avez-vous pas accepté son message ? »
  rationale: Le datif αὐτῷ permet de comprendre qu’ils n’ont pas tenu Jean et son témoignage pour dignes de foi. La traduction retenue préserve cette tension sans transformer l’expression en formule confessionnelle ni la réduire au seul contenu de son message.
translation_notes:
  register: Français international moderne, naturel et digne. La question initiale garde sa vigueur orale; les deux-points évitent le lourd « en disant » tout en introduisant fidèlement le contenu de la délibération. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
