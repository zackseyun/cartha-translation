id: MAT.21.18
reference: Matthew 21:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Πρωῒ δὲ ⸀ἐπανάγων εἰς τὴν πόλιν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/018.yaml
  text: Early in the morning, as he was returning to the city, he became hungry.
translation:
  language: fr
  text: De bon matin, tandis qu’il retournait vers la ville, il eut faim.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρωῒ
  choice: De bon matin
  rationale: Cette expression rend naturellement l’idée du début de la journée et conserve l’accent temporel du grec.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, δέ sert de liaison narrative légère. Le français enchaîne naturellement la phrase sans ajouter « mais » ni un marqueur discursif appuyé.
- source_word: ἐπανάγων
  choice: tandis qu’il retournait
  rationale: Le participe présent décrit une action en cours, contemporaine du verbe principal. Cette formulation en restitue clairement la valeur circonstancielle.
- source_word: εἰς τὴν πόλιν
  choice: à la ville
  rationale: Dans ce contexte, εἰς indique le mouvement en direction de la ville, c’est-à-dire Jérusalem, sans qu’il soit nécessaire d’expliciter son nom.
- source_word: ἐπείνασεν
  choice: il eut faim
  rationale: Le passé simple convient au récit et présente la faim comme un événement survenu à ce moment-là, sans la tournure plus lourde « il commença à avoir faim ».
theological_decisions:
- issue: Portée christologique de la faim de Jésus
  choice: Présenter sans atténuation la faim comme une expérience réelle de Jésus.
  alternative: Reformuler ou commenter la faim de manière à en réduire la réalité humaine.
  rationale: Le récit affirme simplement que Jésus eut faim. Une traduction directe préserve ce témoignage à son humanité véritable sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple « il eut faim » s’accorde au registre narratif biblique sans être archaïque; « tandis que » évite une succession heurtée de participes.
