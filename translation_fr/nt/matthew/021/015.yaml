id: MAT.21.15
reference: Matthew 21:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὰ θαυμάσια ἃ ἐποίησεν καὶ τοὺς παῖδας ⸀τοὺς κράζοντας ἐν τῷ ἱερῷ καὶ λέγοντας· Ὡσαννὰ τῷ υἱῷ Δαυίδ ἠγανάκτησαν
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/015.yaml
  text: But when the chief priests and the scribes saw the wonderful things that he did[a], and the children crying out in the temple and saying[b], “Hosanna to the Son of David,” they were indignant.
translation:
  language: fr
  text: 'Mais lorsque les grands prêtres et les spécialistes de la Loi virent les merveilles qu’il avait accomplies, ainsi que les enfants qui criaient dans le temple[a] : « Hosanna[b] au Fils de David ! », ils s’indignèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici l’ensemble du temple et de ses cours, et non uniquement le sanctuaire intérieur.
    reason: cultural_note
  - marker: b
    text: « Hosanna » est une acclamation issue de l’hébreu, qui signifie approximativement « Sauve, de grâce » ou « Sauve maintenant » ; à cette époque, elle servait aussi de cri de louange.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: lorsque ... virent
  rationale: Le participe aoriste exprime ici la circonstance temporelle liée au verbe principal ; cette tournure est naturelle en français et conserve cette relation.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque un léger contraste avec la scène précédente et introduit la réaction hostile des responsables.
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: Au pluriel, l’expression désigne les principaux responsables sacerdotaux, et non plusieurs titulaires simultanés de la charge de grand prêtre.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Cette expression moderne rend clairement la fonction de ces experts des Écritures et de la Loi, là où « scribes » risquerait d’évoquer de simples copistes.
- source_word: τὰ θαυμάσια
  choice: les choses merveilleuses
  rationale: L’adjectif substantivé désigne largement des actes remarquables sans les définir exclusivement comme des miracles.
- source_word: ἐποίησεν
  choice: qu’il avait faites
  rationale: Le plus-que-parfait français rend naturellement l’action accomplie avant le moment où les responsables la constatent, sans modifier son sens lexical général.
- source_word: παῖδας
  choice: les enfants
  rationale: Dans ce contexte, le mot désigne très probablement des enfants ; « serviteurs » est improbable et « garçons » serait inutilement restrictif.
- source_word: κράζοντας
  choice: qui criaient
  rationale: Le verbe évoque une proclamation forte et publique, sans connotation nécessairement hostile.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: Cette formulation est naturelle en français ; une note précise que ἱερόν désigne ici l’ensemble du domaine du temple.
- source_word: λέγοντας
  choice: deux-points avant la citation
  rationale: En français, le contenu de ce que les enfants criaient s’intègre naturellement comme une citation directe après « criaient » ; le sens de « disant » reste pleinement exprimé.
- source_word: Ὡσαννὰ
  choice: Hosanna
  rationale: La translittération conserve à la fois la forme liturgique reconnue, son origine comme appel au salut et sa fonction d’acclamation de louange.
- source_word: τῷ υἱῷ Δαυίδ
  choice: au Fils de David
  rationale: Le datif se rend naturellement par « au » après l’acclamation, et le titre messianique est conservé littéralement.
- source_word: ἠγανάκτησαν
  choice: ils s’indignèrent
  rationale: Le passé simple exprime avec concision leur vive réaction dans le récit et reflète l’aspect événementiel de l’aoriste.
theological_decisions:
- issue: Portée messianique de « Fils de David »
  choice: Conserver le titre littéral « Fils de David ».
  alternative: « héritier de David » ou « descendant de David »
  rationale: Dans Matthieu, cette expression fonctionne comme un titre messianique reconnu. Une paraphrase affaiblirait son poids narratif et théologique.
- issue: Sens de Ὡσαννά
  choice: Conserver « Hosanna » dans le texte principal et expliquer le terme en note.
  alternative: « Sauve, de grâce » ou « Sauve maintenant »
  rationale: L’expression garde l’arrière-plan d’un appel au salut tout en fonctionnant ici comme une acclamation de louange. La translittération préserve cette tension sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Spécialistes de la Loi » privilégie l’intelligibilité actuelle, tandis que « Hosanna » et « Fils de David » conservent la résonance liturgique et messianique du texte.
