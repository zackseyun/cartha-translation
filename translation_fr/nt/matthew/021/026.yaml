  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, φοβούμεθα τὸν ὄχλον, πάντες γὰρ ⸂ὡς προφήτην ἔχουσιν τὸν Ἰωάννην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/026.yaml
  text: But if we say[a], ‘From men,’ we fear the crowd, for they all regard John as a prophet.
translation:
  language: fr
  text: 'Mais si nous répondons : « D’origine humaine[a] », nous craignons la foule, car tous tiennent Jean pour un prophète.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Des êtres humains. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: Mais si nous répondons
  rationale: La construction ἐὰν avec le subjonctif aoriste exprime une éventualité envisagée. « Si nous répondons » est naturel dans cette délibération et rappelle qu’il s’agit de répondre à la question posée.
- source_word: Ἐξ ἀνθρώπων
  choice: Des êtres humains
  rationale: La formule elliptique désigne la source humaine du baptême de Jean, par opposition à sa provenance « du ciel » au verset précédent. « Êtres humains » rend ἀνθρώπων de façon générique, sans connotation exclusivement masculine.
- source_word: φοβούμεθα τὸν ὄχλον
  choice: nous avons peur de la foule
  rationale: Le présent φοβούμεθα exprime directement leur crainte, et ὄχλος désigne la foule rassemblée. Cette formulation est actuelle et idiomatique.
- source_word: πάντες
  choice: tous
  rationale: Le masculin pluriel renvoie collectivement aux membres de la foule; « tous » en conserve la portée générale.
- source_word: ὡς προφήτην ἔχουσιν τὸν Ἰωάννην
  choice: considèrent Jean comme un prophète
  rationale: La construction ἔχω avec ὡς et un attribut signifie tenir ou considérer quelqu’un comme tel. La formulation française restitue clairement ce jugement collectif.
- source_word: Ἰωάννην
  choice: Jean
  rationale: Le nom propre reçoit sa forme française traditionnelle et immédiatement reconnaissable.
theological_decisions:
- issue: Contraste entre provenance céleste et provenance humaine
  choice: Des êtres humains
  alternative: D’origine humaine
  rationale: Le texte garde la réponse elliptique qui fait écho à « Du ciel » dans le contexte. La note explicite l’autre manière naturelle de comprendre et de formuler cette provenance, sans réduire ἀνθρώπων aux hommes de sexe masculin.
- issue: Statut de Jean aux yeux de la foule
  choice: tous considèrent Jean comme un prophète
  alternative: tous tiennent Jean pour un prophète
  rationale: La traduction rapporte la conviction de la foule telle que le récit la présente, sans ajouter ici une appréciation théologique extérieure.
translation_notes:
  register: Français international moderne, clair et digne. « Nous répondons » convient au contexte d’une réponse envisagée; « nous avons peur de » est plus naturel en français courant que le plus littéraire « nous craignons ». La réponse elliptique du grec est conservée.
