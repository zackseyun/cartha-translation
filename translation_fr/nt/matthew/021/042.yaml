reference: Matthew 21:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λέγει αὐτοῖς ὁ Ἰησοῦς· Οὐδέποτε ἀνέγνωτε ἐν ταῖς γραφαῖς· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας· παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/042.yaml
  text: 'Jesus said to them[a], “Have you never read in the Scriptures: ‘The stone that the builders rejected—this one has become the cornerstone. This came from the Lord[b], and it is marvelous in our eyes’?”'
translation:
  language: fr
  text: 'Jésus leur dit : « N’avez-vous jamais lu dans les Écritures : “La pierre qu’ont rejetée les bâtisseurs, c’est elle qui est devenue la pierre d’angle[a]. C’est du Seigneur[b] que cela est venu, et c’est merveilleux à nos yeux” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pierre de faîte »; littéralement « tête de l’angle ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « du Seigneur »; le texte hébreu à l’origine de cette citation porte le nom divin YHWH.
    reason: source_language_background
lexical_decisions:
- source_word: Λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent narratif français, naturel dans ce contexte et proche de la forme du texte source.
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: N’avez-vous jamais lu
  rationale: Le passé composé dans cette question rhétorique exprime naturellement en français l’appel à une lecture antérieure des Écritures, tandis que « jamais » conserve l’insistance de Οὐδέποτε.
- source_word: γραφαῖς
  choice: les Écritures
  rationale: Dans ce contexte, le terme désigne les écrits sacrés d’Israël; « les Écritures » est la formulation française claire et consacrée.
- source_word: Λίθον
  choice: La pierre
  rationale: Malgré l’absence d’article en grec, la citation vise une pierre déterminée; l’article défini convient au sens et à l’usage français.
- source_word: ἀπεδοκίμασαν
  choice: ont rejetée
  rationale: Le verbe exprime le rejet d’une chose jugée impropre; « rejeter » en donne le sens avec concision.
- source_word: οἱ οἰκοδομοῦντες
  choice: ceux qui bâtissaient
  rationale: Cette formulation reproduit la valeur substantivée du participe tout en restant naturelle; elle garde également l’action de bâtir au premier plan.
- source_word: οὗτος
  choice: c’est elle
  rationale: La tournure disloquée française conserve l’insistance du démonstratif grec sur cette pierre précise.
- source_word: ἐγενήθη εἰς
  choice: est devenue
  rationale: La formulation indique naturellement le changement aboutissant au statut de pierre d’angle.
- source_word: κεφαλὴν γωνίας
  choice: la pierre d’angle
  rationale: Cette expression française conserve l’image architecturale sans décider avec une précision injustifiée si la pierre se situe à la base ou au sommet de l’édifice.
- source_word: παρὰ κυρίου
  choice: du Seigneur
  rationale: Avec le génitif, παρά marque ici la provenance; « du Seigneur » exprime cette origine de façon concise.
- source_word: θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν
  choice: c’est merveilleux à nos yeux
  rationale: La tournure française rend le caractère admirable de l’événement et conserve l’image de l’évaluation « à nos yeux ».
theological_decisions:
- issue: Traduction de κύριος dans la citation du Psaume
  choice: Seigneur
  alternative: ÉTERNEL
  rationale: Le texte grec porte κυρίου, normalement rendu par « Seigneur ». La source hébraïque de la citation emploie le nom divin YHWH; cette donnée est signalée en note sans remplacer dans le texte principal la forme effectivement présente en grec.
- issue: Application messianique de l’image de la pierre
  choice: Conserver l’image sans explicitation interprétative
  alternative: Identifier explicitement la pierre au Messie ou à Jésus
  rationale: Le contexte applique la citation à Jésus, mais la citation elle-même ne formule pas cette identification. La traduction préserve donc la métaphore sans ajouter de commentaire doctrinal.
- issue: Localisation architecturale de κεφαλὴ γωνίας
  choice: pierre d’angle
  alternative: pierre de faîte
  rationale: L’expression grecque, littéralement « tête de l’angle », peut être comprise de plusieurs manières. Le choix principal reste suffisamment ouvert, et l’autre possibilité est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de la citation reste légèrement élevée sans devenir archaïque. Les marqueurs de note sont placés immédiatement après les expressions qu’ils éclairent.
