revisions:
- from: 'Jésus leur dit : « N’avez-vous jamais lu dans les Écritures : “La pierre qu’ont rejetée ceux qui bâtissaient, c’est elle qui est devenue la pierre d’angle[a]. Cela est venu du Seigneur[b], et c’est merveilleux à nos yeux” ? »'
  to: 'Jésus leur dit : « N’avez-vous jamais lu dans les Écritures : “La pierre qu’ont rejetée les bâtisseurs, c’est elle qui est devenue la pierre d’angle[a]. C’est du Seigneur[b] que cela est venu, et c’est merveilleux à nos yeux” ? »'
  rationale: La révision remplace l’imparfait interprétatif « bâtissaient » par le substantif générique « bâtisseurs », plus proche de la valeur du participe grec et plus naturel en français. Elle ajuste aussi l’ordre des mots dans la seconde proposition de la citation afin d’exprimer plus nettement la provenance sans modifier le sens. Les notes, leurs ancres et l’ambiguïté de l’image architecturale sont conservées.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:58:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement le grec dans son ensemble : question rhétorique, référence aux Écritures, image de la pierre, provenance « du Seigneur » et caractère merveilleux sont bien rendus. Toutefois, « ceux qui bâtissaient » introduit un imparfait français qui suggère une action passée en cours, alors que le participe présent grec οἱ οἰκοδομοῦντες a ici une valeur substantive et générique (« les bâtisseurs »).'
  naturalness: Le français est clair et d’un registre approprié. « Les bâtisseurs » est plus idiomatique et plus concis que « ceux qui bâtissaient ». La formulation révisée conserve l’emphase sur la pierre et rend plus naturellement la provenance par « C’est du Seigneur que cela est venu ».
  terminology: « Écritures », « Seigneur » et « pierre d’angle » conviennent. « Pierre d’angle » préserve utilement l’ambiguïté architecturale de κεφαλὴ γωνίας; l’alternative « pierre de faîte » demeure signalée. La note sur YHWH est exacte et ne remplace pas indûment le grec κύριος dans le texte.
  issues:
  - severity: low
    issue: Valeur temporelle de « ceux qui bâtissaient »
    rationale: Le grec οἱ οἰκοδομοῦντες est un participe présent substantivé. L’imparfait français peut donner à entendre un procès passé, alors que « les bâtisseurs » rend naturellement la désignation générique sans imposer cette nuance.
  - severity: low
    issue: Mise en relief de la provenance
    rationale: « Cela est venu du Seigneur » est compréhensible, mais « C’est du Seigneur que cela est venu » rend plus naturellement en français l’origine exprimée par παρὰ κυρίου tout en conservant l’emphase de la citation.
