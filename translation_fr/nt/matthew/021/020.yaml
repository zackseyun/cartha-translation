  text: καὶ ἰδόντες οἱ μαθηταὶ ἐθαύμασαν λέγοντες· Πῶς παραχρῆμα ἐξηράνθη ἡ συκῆ;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/020.yaml
  text: And when the disciples saw it[a], they marveled, saying, “How did the fig tree wither immediately?”
translation:
  language: fr
  text: 'En voyant cela, les disciples furent étonnés et dirent : « Comment le figuier s’est-il desséché si vite ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: En voyant cela
  rationale: Le participe aoriste est rendu par une tournure circonstancielle naturelle. « Cela » renvoie à l’état soudain du figuier constaté par les disciples, sans limiter artificiellement leur regard au seul arbre.
- source_word: ἐθαύμασαν
  choice: furent étonnés
  rationale: Le verbe exprime ici l’étonnement émerveillé des disciples. Cette formulation est naturelle en français moderne et conserve la dignité du récit.
- source_word: λέγοντες
  choice: et dirent
  rationale: La coordination rend naturellement en français la parole concomitante introduite par le participe grec, sans en modifier la relation avec le verbe principal.
- source_word: Πῶς
  choice: Comment
  rationale: L’adverbe interrogatif porte sur la manière ou la possibilité du dessèchement soudain.
- source_word: παραχρῆμα
  choice: immédiatement
  rationale: 'Ce choix traduit directement la valeur temporelle de l’adverbe : « sur-le-champ », « aussitôt ».'
- source_word: ἐξηράνθη
  choice: a-t-il pu se dessécher
  rationale: « Se dessécher » convient à un arbre et rend l’état résultant du verbe grec. L’auxiliaire modal « a-t-il pu » exprime en français naturel l’étonnement implicite dans la question, sans attribuer explicitement un agent.
- source_word: ἡ συκῆ
  choice: le figuier
  rationale: Traduction française précise et usuelle de συκῆ.
theological_decisions: []
