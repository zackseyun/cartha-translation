id: MAT.21.3
reference: Matthew 21:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ τι, ἐρεῖτε ὅτι Ὁ κύριος αὐτῶν χρείαν ἔχει· ⸀εὐθὺς δὲ ⸀ἀποστελεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/003.yaml
  text: And if anyone says anything to you[a], you shall say[b], ‘The Lord has need of them,’ and he will send them at once.
translation:
  language: fr
  text: 'Et si quelqu’un vous dit quoi que ce soit, vous direz : « Le Seigneur[a] en a besoin », et il les enverra aussitôt.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur maître ».'
    reason: alternative_reading
  - marker: b
    text: Le sujet de « enverra » est sous-entendu en grec. Il désigne très probablement la personne qui aura parlé aux disciples, mais peut grammaticalement être compris comme « le Seigneur ».
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ἐάν τις
  choice: si quelqu’un
  rationale: Cette tournure conditionnelle indéfinie conserve l’éventualité ouverte exprimée par le grec.
- source_word: ὑμῖν εἴπῃ τι
  choice: vous dit quoi que ce soit
  rationale: La formulation garde le sens large de λέγω et de l’indéfini τι, sans réduire la parole à une question précise.
- source_word: ἐρεῖτε
  choice: vous direz
  rationale: Le futur français reproduit naturellement le futur grec employé ici comme instruction.
- source_word: Ὁ κύριος
  choice: Le Seigneur
  rationale: « Seigneur » préserve le titre et sa portée narrative et christologique, tout en laissant en note le sens contextuel possible de « maître ».
- source_word: αὐτῶν χρείαν ἔχει
  choice: en a besoin
  rationale: Cette expression française idiomatique reprend clairement les animaux comme référent du pronom pluriel.
- source_word: εὐθὺς
  choice: aussitôt
  rationale: « Aussitôt » exprime avec concision l’immédiateté indiquée par εὐθύς.
- source_word: ἀποστελεῖ αὐτούς
  choice: il les enverra
  rationale: Cette traduction reste proche du verbe grec et ne lui ajoute ni l’idée explicite d’un retour ni celle d’une simple permission.
theological_decisions:
- issue: Portée de Ὁ κύριος
  choice: Le Seigneur
  alternative: leur maître
  rationale: Le texte peut être entendu comme un titre par lequel Jésus parle de lui-même, tandis que κύριος peut aussi désigner un maître dans le contexte concret des animaux. Le texte principal conserve « Seigneur » et la note signale l’autre possibilité.
- issue: Sujet sous-entendu de ἀποστελεῖ
  choice: Le pronom « il » est conservé sans explicitation
  alternative: La personne interpellant les disciples les enverra aussitôt
  rationale: Le grec ne nomme pas le sujet du verbe. La personne qui aura parlé est le référent contextuel le plus naturel, mais rendre ce sujet explicite supprimerait une ambiguïté grammaticale réelle.
translation_notes:
  register: Français international actuel, clair et digne. Le futur « vous direz » garde la forme directive du grec, tandis que « quoi que ce soit » préserve l’étendue de l’objection éventuelle. Les guillemets français marquent le discours direct introduit par ὅτι.
