id: MAT.21.13
reference: Matthew 21:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Γέγραπται· Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται, ὑμεῖς δὲ αὐτὸν ⸀ποιεῖτε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/013.yaml
  text: And he says to them[a], “It is written[b], ‘My house will be called a house of prayer,’ but you are making it a den of robbers.”
translation:
  language: fr
  text: 'Et il leur dit : « Il est écrit[a] : “Ma maison sera appelée une maison de prière”, mais vous, vous en faites une caverne de bandits[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jésus associe ici Ésaïe 56,7 à Jérémie 7,11.
    reason: cross_reference
  - marker: b
    text: Ou « voleurs ». Le terme grec peut désigner des voleurs ou des brigands violents.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: il leur dit
  rationale: Le présent historique grec est rendu par le présent français, naturel dans un récit et fidèle à la vivacité de Matthieu.
- source_word: Γέγραπται
  choice: Il est écrit
  rationale: Formule française consacrée pour le parfait passif introduisant une citation de l’Écriture; elle en suggère aussi la validité durable.
- source_word: οἶκός μου
  choice: Ma maison
  rationale: Conserve l’image scripturaire de la maison de Dieu sans la réduire explicitement au mot « temple ».
- source_word: οἶκος προσευχῆς
  choice: une maison de prière
  rationale: Expression française claire qui reproduit le génitif grec et maintient l’écho d’Ésaïe 56.7.
- source_word: κληθήσεται
  choice: sera appelée
  rationale: Rend directement le futur passif grec dans un français contemporain.
- source_word: ποιεῖτε
  choice: vous en faites
  rationale: Rend le présent grec et l’idée que les destinataires donnent actuellement à la maison cet usage; « en » reprend naturellement « ma maison ».
- source_word: σπήλαιον
  choice: caverne
  rationale: Rend l’abri ou le repaire évoqué par le terme grec tout en conservant la formulation biblique traditionnelle et l’écho de Jérémie 7.11.
- source_word: λῃστῶν
  choice: bandits
  rationale: Le terme grec peut désigner des brigands violents, et non seulement des voleurs; « bandits » préserve cette portée sans imposer le sens plus étroit de simples voleurs.
theological_decisions:
- issue: Citation et allusion à l’Ancien Testament
  choice: Conserver les formulations « Ma maison sera appelée une maison de prière » et « une caverne de bandits » afin de rendre reconnaissables Ésaïe 56.7 et Jérémie 7.11.
  alternative: Employer une paraphrase moderne qui expliciterait le temple ou l’activité commerciale, mais affaiblirait les liens intertextuels.
  rationale: La parole de Jésus associe une citation explicite d’Ésaïe à une allusion à Jérémie; préserver les deux échos laisse apparaître son argument scripturaire sans ajouter d’interprétation.
- issue: Portée de λῃστῶν
  choice: bandits
  alternative: voleurs
  rationale: « Bandits » garde ouverte la possibilité de brigands violents incluse dans le grec, tandis que « voleurs » pourrait être compris de manière plus étroite; une note signale l’autre traduction légitime.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent narratif est conservé. La répétition contrastive « mais vous, vous » reproduit l’emphase de ὑμεῖς δὲ sans paraître artificielle en français.
