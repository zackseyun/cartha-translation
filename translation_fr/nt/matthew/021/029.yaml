  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Οὐ θέλω· ὕστερον δὲ μεταμεληθεὶς⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/029.yaml
  text: But he answered[b][a], ‘I do not want to.’ But later he changed his mind and went.
translation:
  language: fr
  text: 'Il répondit : « Je ne veux pas. » Mais plus tard, il changea d’avis[a] et y alla.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il regretta son refus » ou « il se ravisa ». Le verbe grec peut exprimer un regret qui conduit à changer de conduite.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: Il répondit
  rationale: Cette formule participiale narrative se rend naturellement en français par un verbe conjugué, sans perte de sens.
- source_word: Οὐ θέλω
  choice: Je ne veux pas
  rationale: Cette formulation directe et actuelle exprime la volonté personnelle du fils sans donner au refus un caractère plus absolu que le grec.
- source_word: ὕστερον
  choice: plus tard
  rationale: L’adverbe marque simplement une action postérieure.
- source_word: μεταμεληθεὶς
  choice: il changea d’avis
  rationale: Le verbe peut évoquer le regret, mais le contexte met surtout en relief un revirement qui conduit le fils à agir. Cette traduction n’impose pas le vocabulaire théologique de la repentance.
- source_word: ἀπῆλθεν
  choice: y alla
  rationale: Dans le contexte, il ne s’agit pas seulement de partir, mais d’aller accomplir ce qui lui avait été demandé. Le pronom « y » rend cette orientation implicite de façon naturelle en français.
theological_decisions:
- issue: Portée de μεταμεληθεὶς dans la parabole
  choice: il changea d’avis
  alternative: il regretta son refus ; il se ravisa ; il se repentit
  rationale: « Il changea d’avis » préserve le revirement concret décrit par le récit. « Il se repentit » préciserait excessivement la portée théologique, tandis que le grec peut aussi comporter une nuance de regret.
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient au registre narratif biblique écrit sans être archaïque. La coordination reproduit clairement le contraste entre le refus initial et l’action ultérieure.
