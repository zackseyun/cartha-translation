  text: καὶ πάντα ὅσα ⸀ἂν αἰτήσητε ἐν τῇ προσευχῇ πιστεύοντες λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/022.yaml
  text: And whatever you ask in prayer[a], believing[b], you will receive.
translation:
  language: fr
  text: Et tout ce que vous demanderez dans vos prières avec foi, vous le recevrez.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα ὅσα
  choice: tout ce que
  rationale: Cette tournure française naturelle rend l’expression grecque globale et indéfinie, sans en restreindre la portée.
- source_word: ἂν αἰτήσητε
  choice: vous demanderez
  rationale: Avec πάντα ὅσα, ἄν et le subjonctif forment une relative indéfinie. Le futur français convient naturellement après « tout ce que » et ne transforme pas la phrase en simple prédiction temporelle.
- source_word: ἐν τῇ προσευχῇ
  choice: dans la prière
  rationale: Cette formulation conserve le nom grec προσευχή et exprime idiomatiquement le cadre dans lequel la demande est faite.
- source_word: πιστεύοντες
  choice: en croyant
  rationale: Le gérondif représente le participe présent grec et maintient son lien simultané avec l’acte de demander, sans le reformuler en condition explicite.
- source_word: λήμψεσθε
  choice: vous le recevrez
  rationale: Le futur de λαμβάνω est rendu directement par « vous recevrez » ; le pronom « le » reprend naturellement « tout ce que » en français.
theological_decisions:
- issue: Rapport entre la foi et l’exaucement de la prière
  choice: en croyant
  alternative: si vous croyez
  rationale: Le grec emploie un participe circonstanciel plutôt qu’une proposition conditionnelle explicite. « En croyant » préserve ce lien sans trancher davantage la nature ni la portée de la promesse.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche de la structure grecque tout en étant naturelle ; aucune note n’est nécessaire, les variantes lexicales pertinentes étant suffisamment représentées par le texte.
