  source_fidelity: Le sens général est fidèlement rendu, y compris le contraste aspectuel entre l’aoriste (« étendirent ») et les imparfaits (« coupaient », « étendaient »). Toutefois, « tandis que » explicite une relation temporelle de simultanéité que le simple δέ ne marque pas nécessairement. « Des branches aux arbres » est possible, mais moins direct et moins international que « des branches des arbres » pour ἀπὸ τῶν δένδρων.
  naturalness: « La plupart des gens dans la foule » est compréhensible mais lourd et quelque peu redondant. « La plupart des gens de la foule » est plus idiomatique. La coordination par « et d’autres » reproduit plus sobrement le mouvement narratif grec.
  terminology: « Vêtements » rend bien ἱμάτια, avec une note appropriée pour « manteaux ». « Chemin » convient à ὁδός dans ce contexte physique. Les ancres de notes sont conservées et placées auprès des termes concernés.
