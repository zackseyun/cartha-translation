  text: ὁ δὲ πλεῖστος ὄχλος ἔστρωσαν ἑαυτῶν τὰ ἱμάτια ἐν τῇ ὁδῷ, ἄλλοι δὲ ἔκοπτον κλάδους ἀπὸ τῶν δένδρων καὶ ἐστρώννυον ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/008.yaml
  text: Most of the crowd spread their garments on the road[b][a], and others were cutting branches from the trees and spreading them on the road.
translation:
  language: fr
  text: La plupart des gens de la foule[a] étendirent leurs vêtements[b] sur le chemin, et d’autres coupaient des branches des arbres et les étendaient sur le chemin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la plus grande partie de la foule ».
    reason: lexical_alternative
  - marker: b
    text: Le terme peut aussi désigner plus précisément des manteaux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλεῖστος ὄχλος
  choice: La plupart des gens dans la foule
  rationale: Cette formulation rend naturellement πλεῖστος avec le nom collectif ὄχλος, tout en conservant l’idée de la foule. La valeur légère de transition de δέ ressort du déroulement de la phrase sans ajout artificiel de « alors » ou de « or ».
- source_word: ἔστρωσαν
  choice: étendirent
  rationale: Le verbe exprime ici l’action d’étendre ou de disposer quelque chose sur le sol. Le passé simple convient au récit écrit et distingue cet acte global des actions en cours exprimées ensuite à l’imparfait.
- source_word: ἑαυτῶν τὰ ἱμάτια
  choice: leurs vêtements
  rationale: « Vêtements » garde la portée générale de ἱμάτια. Le possessif « leurs » rend naturellement ἑαυτῶν en français, sans l’insistance peu naturelle de « leurs propres vêtements ».
- source_word: ἐν τῇ ὁδῷ
  choice: sur le chemin
  rationale: En français, des objets disposés sur la surface où l’on passe sont mis « sur le chemin ». « Chemin » convient au cadre sans donner à ὁδός un sens métaphorique.
- source_word: ἄλλοι δὲ
  choice: tandis que d’autres
  rationale: La tournure introduit un autre groupe et enchaîne les actions simultanées de la scène. Elle rend la transition portée par δέ sans lui donner une opposition trop forte.
- source_word: ἔκοπτον
  choice: coupaient
  rationale: L’imparfait français conserve l’aspect imperfectif de l’imparfait grec et présente l’action comme en cours.
- source_word: κλάδους ἀπὸ τῶν δένδρων
  choice: des branches aux arbres
  rationale: Cette expression française signifie que les branches étaient coupées sur les arbres et rend explicitement leur provenance.
- source_word: καὶ ἐστρώννυον
  choice: et les étendaient
  rationale: L’imparfait maintient l’action en cours, le pronom « les » reprend clairement les branches, et « étendaient » fait entendre la répétition lexicale du verbe employé pour les vêtements.
- source_word: ἐν τῇ ὁδῷ
  choice: sur le chemin
  rationale: La répétition de la même expression française préserve celle du texte grec et relie visuellement les deux gestes.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient le registre narratif biblique sans archaïsme lexical, tandis que les imparfaits rendent les actions en cours. La répétition de « sur le chemin » et d’« étendre » est conservée pour refléter la structure du grec.
