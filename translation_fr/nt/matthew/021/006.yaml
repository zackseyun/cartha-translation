  text: πορευθέντες δὲ οἱ μαθηταὶ καὶ ποιήσαντες καθὼς ⸀συνέταξεν αὐτοῖς ὁ Ἰησοῦς
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/006.yaml
  text: So the disciples went and did just as Jesus had instructed them[a].
translation:
  language: fr
  text: Les disciples partirent donc et firent exactement ce que Jésus leur avait ordonné[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur avait donné comme instructions ». Le verbe grec peut désigner le fait de donner des ordres ou des instructions ; le contexte renvoie aux directives précises de Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθέντες
  choice: partirent
  rationale: Le participe aoriste décrit le déplacement qui précède l’action suivante. En français narratif, un verbe conjugué coordonné est plus naturel que « étant partis ».
- source_word: δὲ
  choice: donc
  rationale: La particule assure la transition narrative tout en reliant la réaction des disciples aux instructions données précédemment.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: C’est le terme français usuel et contextuellement précis pour désigner les disciples de Jésus dans les Évangiles.
- source_word: ποιήσαντες
  choice: firent
  rationale: Le second participe aoriste est rendu par un verbe coordonné, conformément au fonctionnement naturel du récit français.
- source_word: καθὼς
  choice: exactement ce que
  rationale: Dans la tournure française « faire ce que », l’adverbe « exactement » exprime clairement la conformité indiquée par καθώς, sans calque maladroit.
- source_word: συνέταξεν
  choice: avait demandé
  rationale: Le verbe συντάσσω peut désigner le fait de donner des instructions ou des ordres. Ici, « avait demandé » convient au contexte immédiat et reste naturel, tandis qu’une note conserve l’alternative plus forte.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif est naturellement rendu comme complément indirect du verbe « demander ».
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Le nom propre précédé de l’article grec se rend normalement sans article en français.
