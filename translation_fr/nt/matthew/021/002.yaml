id: MAT.21.2
reference: Matthew 21:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· ⸀Πορεύεσθε εἰς τὴν κώμην τὴν ⸀κατέναντι ὑμῶν, καὶ ⸀εὐθέως εὑρήσετε ὄνον δεδεμένην καὶ πῶλον μετ’ αὐτῆς· λύσαντες ⸀ἀγάγετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/002.yaml
  text: saying to them[a], “Go into the village opposite you, and immediately you will find a donkey tied, and a colt with her[c][b]. Untie them and bring them to me.”
translation:
  language: fr
  text: 'en leur disant : « Allez au village qui est en face de vous[a]. Vous y trouverez aussitôt une ânesse attachée et, avec elle, un ânon. Détachez-les et amenez-les-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui est devant vous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: en leur disant
  rationale: Le participe présent introduit les paroles de Jésus et se rattache naturellement à l’action du verset précédent. Cette formulation conserve la structure narrative grecque dans un français fluide.
- source_word: Πορεύεσθε
  choice: Allez
  rationale: Dans cet ordre adressé aux disciples, « Allez » est l’équivalent français direct, naturel et actuel.
- source_word: κώμην
  choice: village
  rationale: κώμη désigne normalement une petite localité, par opposition à une ville ; « village » en rend clairement le sens.
- source_word: κατέναντι ὑμῶν
  choice: qui est en face de vous
  rationale: La locution indique la position du village par rapport aux disciples. « En face de vous » préserve le rapport spatial sans préciser indûment la configuration exacte.
- source_word: εὐθέως
  choice: aussitôt
  rationale: « Aussitôt » exprime pleinement l’immédiateté de εὐθέως tout en convenant au registre narratif.
- source_word: ὄνον δεδεμένην
  choice: une ânesse attachée
  rationale: Le participe féminin δεδεμένην montre que ὄνον désigne ici un animal femelle. « Ânesse » rend explicitement cette information grammaticale, et « attachée » décrit naturellement son état résultant.
- source_word: πῶλον
  choice: un ânon
  rationale: πῶλος désigne un jeune animal ; dans le contexte, il s’agit sans ambiguïté du petit d’une ânesse. « Ânon » est donc plus précis et plus naturel en français que le terme générique « petit ».
- source_word: μετ’ αὐτῆς
  choice: avec elle
  rationale: Le pronom féminin singulier renvoie à l’ânesse. La formulation maintient clairement le lien entre les deux animaux.
- source_word: λύσαντες
  choice: Détachez-les
  rationale: Le participe aoriste exprime une action préalable étroitement liée à l’impératif suivant. Deux impératifs coordonnés ou successifs constituent en français la manière la plus naturelle de rendre cette séquence d’ordres.
- source_word: ἀγάγετέ μοι
  choice: amenez-les-moi
  rationale: ἄγω peut signifier conduire ou amener. Ici, « amenez-les-moi » exprime idiomatiquement le déplacement des deux animaux jusqu’à Jésus et conserve le bénéficiaire μοι.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. « Ânesse » explicite le féminin marqué par le grec, tandis que « ânon » identifie naturellement le jeune animal. La ponctuation en deux phrases allège la longue instruction grecque sans modifier l’enchaînement des actions.
