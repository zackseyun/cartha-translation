id: MAT.21.40
reference: Matthew 21:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν οὖν ἔλθῃ ὁ κύριος τοῦ ἀμπελῶνος, τί ποιήσει τοῖς γεωργοῖς ἐκείνοις;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/040.yaml
  text: Therefore[a], when the owner of the vineyard comes[b], what will he do to those farmers?
translation:
  language: fr
  text: Donc, lorsque le propriétaire de la vigne[a] viendra, que fera-t-il à ces vignerons[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « maître de la vigne ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi se traduire par « cultivateurs ». Le contexte montre qu’ils exploitent la vigne pour son propriétaire, mais le terme lui-même ne précise pas leur statut.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: lorsque
  rationale: Avec le subjonctif ἔλθῃ, le terme introduit ici un événement futur attendu dans le récit. « Lorsque » est naturel et plus précis que l’itératif « chaque fois que ».
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée du récit précédent et introduit la question de Jésus avec une force logique claire.
- source_word: ἔλθῃ
  choice: viendra
  rationale: L’aoriste du subjonctif après ὅταν désigne ici une venue future envisagée comme certaine; en français, le futur après « lorsque » est idiomatique.
- source_word: κύριος
  choice: propriétaire
  rationale: Dans le cadre de la parabole, κύριος désigne celui à qui appartient la vigne. « Propriétaire » exprime ce rôle sans introduire ici le titre théologique « Seigneur ».
- source_word: ἀμπελῶνος
  choice: vigne
  rationale: Rendu français courant de ἀμπελών dans ce contexte agricole et parabolique.
- source_word: τί ποιήσει
  choice: que fera-t-il
  rationale: La tournure interrogative au futur demande quelle action le propriétaire exercera envers les vignerons.
- source_word: γεωργοῖς
  choice: vignerons
  rationale: γεωργός désigne un cultivateur; puisque le domaine cultivé est une vigne, « vignerons » est précis et naturel. Le contexte indique qu’ils exploitent la vigne pour le propriétaire, sans que le mot grec exprime à lui seul leur statut locatif.
- source_word: ἐκείνοις
  choice: ces
  rationale: Le démonstratif identifie avec une certaine distance les vignerons dont il vient d’être question; « ces » le rend naturellement en français.
theological_decisions:
- issue: Sens de κύριος dans la parabole
  choice: propriétaire
  alternative: maître
  rationale: Le mot désigne le propriétaire humain de la vigne dans le monde du récit. Ce choix évite de transformer prématurément le terme en titre divin, tout en laissant intacte la portée symbolique de la parabole.
translation_notes:
  register: Français international moderne, courant et digne. La structure interrogative reste proche du grec, tandis que le futur après « lorsque » respecte l’usage français.
