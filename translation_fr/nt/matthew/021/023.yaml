  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸂ἐλθόντος αὐτοῦ⸃ εἰς τὸ ἱερὸν προσῆλθον αὐτῷ διδάσκοντι οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι τοῦ λαοῦ λέγοντες· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; καὶ τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/023.yaml
  text: And when he came into the temple[a], the chief priests and the elders of the people came up to him while he was teaching and said, “By what authority are you doing these things? And who gave you this authority?”
translation:
  language: fr
  text: 'Lorsqu’il entra dans le Temple[a], les chefs des prêtres et les anciens du peuple s’approchèrent de lui alors qu’il enseignait et lui dirent : « Par quelle autorité fais-tu tout cela ? Et qui t’a donné cette autorité ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici l’ensemble du Temple et de ses cours, et non spécifiquement le sanctuaire intérieur.
    reason: cultural_note
lexical_decisions:
- source_word: ἐλθόντος αὐτοῦ
  choice: quand il fut entré
  rationale: Le génitif absolu a ici une valeur temporelle. Cette formulation française marque naturellement l’entrée de Jésus avant l’approche des responsables, sans préciser davantage le délai.
- source_word: ἱερὸν
  choice: le Temple
  rationale: Ἱερόν désigne l’ensemble du complexe ou de l’enceinte du Temple, et non spécifiquement le sanctuaire intérieur, qui serait plutôt désigné par ναός. « Le Temple » reste la formulation française la plus naturelle, avec une note explicative.
- source_word: προσῆλθον αὐτῷ
  choice: s’approchèrent de lui
  rationale: Le verbe exprime un mouvement vers Jésus. « S’approchèrent de lui » est idiomatique et conserve cette dimension narrative.
- source_word: διδάσκοντι
  choice: alors qu’il enseignait
  rationale: Le participe présent indique que l’enseignement se déroule en même temps que l’approche des responsables.
- source_word: οἱ ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Au pluriel, l’expression désigne les principaux responsables sacerdotaux, et non plusieurs titulaires simultanés de la charge de grand prêtre. Cette traduction est claire en français moderne.
- source_word: οἱ πρεσβύτεροι τοῦ λαοῦ
  choice: les anciens du peuple
  rationale: L’expression désigne les responsables reconnus parmi le peuple et se traduit directement et naturellement ainsi.
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: De quelle autorité
  rationale: La préposition ἐν avec ἐξουσία introduit ici le fondement autorisant l’action. La question conteste la légitimité de Jésus plutôt que sa simple capacité d’agir.
- source_word: ταῦτα ποιεῖς
  choice: fais-tu tout cela
  rationale: Le démonstratif pluriel renvoie collectivement aux actes de Jésus dans ce contexte. « Tout cela » est plus naturel en français que « ces choses » tout en gardant la portée globale de l’expression.
- source_word: τίς σοι ἔδωκεν τὴν ἐξουσίαν ταύτην
  choice: qui t’a donné cette autorité
  rationale: Le passé composé rend naturellement en français l’acte antérieur par lequel cette autorité aurait été conférée.
theological_decisions:
- issue: Sens de ἐξουσία dans la contestation des responsables
  choice: autorité
  alternative: droit, pouvoir
  rationale: Le contexte porte sur la légitimité et l’habilitation de Jésus à agir et à enseigner dans le Temple, et non seulement sur sa puissance. « Autorité » préserve à la fois la dimension institutionnelle et la tension théologique sans la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue conserve la forme directe et incisive de la contestation. La majuscule à « Temple » aide à identifier le complexe cultuel de Jérusalem.
