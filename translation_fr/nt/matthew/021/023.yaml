  source_fidelity: 'Le sens général est fidèle au grec : l’entrée au Temple, l’approche des chefs des prêtres et des anciens pendant l’enseignement, ainsi que les deux questions portant sur l’autorité, sont bien rendus. « Tout cela » restitue convenablement le pluriel ταῦτα dans un français naturel.'
