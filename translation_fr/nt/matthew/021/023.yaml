  to: 'Lorsqu’il entra dans le Temple[a], les chefs des prêtres et les anciens du peuple s’approchèrent de lui alors qu’il enseignait et lui dirent : « Par quelle autorité fais-tu tout cela ? Et qui t’a donné cette autorité ? »'
