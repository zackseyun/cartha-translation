  text: καὶ καταλιπὼν αὐτοὺς ἐξῆλθεν ἔξω τῆς πόλεως εἰς Βηθανίαν, καὶ ηὐλίσθη ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/017.yaml
  text: And leaving them[a], he went out of the city to Bethany and stayed there overnight.
translation:
  language: fr
  text: Il les laissa, sortit de la ville pour se rendre à Béthanie et y passa la nuit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « y logea ». Le verbe grec désigne le fait de passer la nuit dans un lieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλιπὼν αὐτοὺς
  choice: Il les laissa
  rationale: Le participe aoriste exprime une action accomplie avant le départ. La coordination en français est naturelle et conserve le référent pronominal sans l’expliciter davantage.
- source_word: ἐξῆλθεν ἔξω τῆς πόλεως
  choice: sortit de la ville
  rationale: Cette formulation française rend clairement le mouvement vers l’extérieur exprimé conjointement par le verbe et la locution grecque, sans redondance artificielle.
- source_word: εἰς Βηθανίαν
  choice: pour se rendre à Béthanie
  rationale: La tournure exprime naturellement la destination indiquée par εἰς, sans suggérer plus précisément que le grec les modalités du trajet.
- source_word: ηὐλίσθη ἐκεῖ
  choice: y passa la nuit
  rationale: Le verbe αὐλίζομαι désigne ici le fait de séjourner quelque part pour la nuit. Le pronom « y » reprend naturellement Béthanie et rend aussi ἐκεῖ.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe coordonnée évite la lourdeur de « les ayant laissés » tout en maintenant l’ordre des actions du grec.
