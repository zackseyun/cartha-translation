id: MAT.21.5
reference: Matthew 21:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἴπατε τῇ θυγατρὶ Σιών· Ἰδοὺ ὁ βασιλεύς σου ἔρχεταί σοι πραῢς καὶ ἐπιβεβηκὼς ἐπὶ ὄνον καὶ ⸀ἐπὶ πῶλον υἱὸν ὑποζυγίου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/005.yaml
  text: Tell the daughter of Zion[a], ‘Look, your king is coming to you, gentle and mounted on a donkey, and on a colt[b], the foal of a beast of burden.’
translation:
  language: fr
  text: 'Dites à la fille de Sion : « Voici, ton roi vient à toi, doux[a] et monté sur un âne, et sur un ânon[b], le petit d’une bête de somme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « humble ». Le grec πραΰς peut exprimer la douceur, la mansuétude ou l’humilité et fait écho à Zacharie 9.9.
    reason: lexical_alternative
  - marker: b
    text: 'Matthieu conserve les deux expressions coordonnées de la citation prophétique : « sur un âne, et sur un ânon, le petit d’une bête de somme ».'
    reason: cross_reference
lexical_decisions:
- source_word: Εἴπατε
  choice: Dites
  rationale: L’impératif aoriste pluriel introduit la citation prophétique. « Dites » en conserve directement la force directive.
- source_word: τῇ θυγατρὶ Σιών
  choice: à la fille de Sion
  rationale: Cette formulation maintient la personnification prophétique de Sion sans la réduire explicitement à Jérusalem ou à ses habitants.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: « Voici » attire solennellement l’attention tout en restant naturel dans une citation prophétique en français moderne.
- source_word: ὁ βασιλεύς σου
  choice: ton roi
  rationale: La construction possessive et la portée royale, notamment messianique dans ce contexte, sont conservées sans explicitation ajoutée.
- source_word: ἔρχεταί σοι
  choice: vient à toi
  rationale: Le présent grec présente l’arrivée avec vivacité. « Vient à toi » garde le mouvement orienté vers Sion.
- source_word: πραῢς
  choice: doux
  rationale: « Doux » exprime ici la disposition non violente et sans dureté du roi. Le mot grec peut aussi évoquer l’humilité, possibilité signalée en note.
- source_word: ἐπιβεβηκὼς
  choice: monté
  rationale: Le participe parfait décrit le roi comme ayant pris place sur l’animal et s’y trouvant monté.
- source_word: ἐπὶ ὄνον
  choice: sur un âne
  rationale: « Âne » rend naturellement ὄνος sans imposer un sexe que la forme grecque ne précise pas ici.
- source_word: πῶλον
  choice: un ânon
  rationale: Dans ce contexte, πῶλος désigne un jeune équidé; « ânon » est plus précis et naturel que le terme générique « petit ».
- source_word: υἱὸν ὑποζυγίου
  choice: le petit d’une bête de somme
  rationale: Cette formulation rend l’expression sémitisante littéralement proche de « fils d’une bête de somme » dans un français intelligible, sans réduire explicitement ὑποζύγιον à « ânesse ».
theological_decisions:
- issue: Citation messianique de Zacharie 9.9 et risque d’harmonisation avec une autre forme du texte prophétique
  choice: 'Conserver la formulation propre au grec de Matthieu : « doux » et les deux expressions coordonnées concernant les animaux.'
  alternative: Employer « humble » ou fondre les deux expressions en une seule description de l’animal.
  rationale: La traduction suit le texte grec de Matthieu plutôt qu’une harmonisation avec l’hébreu de Zacharie ou avec une tradition de traduction. Elle maintient ainsi la tension et le parallélisme interprétatif du libellé matthéen.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure prophétique « fille de Sion » et l’appel « Voici » sont conservés, tandis que « le petit » évite le calque peu naturel « le fils » pour un animal.
