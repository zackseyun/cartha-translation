id: MAT.21.31
reference: Matthew 21:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς ἐκ τῶν δύο ἐποίησεν τὸ θέλημα τοῦ πατρός; ⸀λέγουσιν· Ὁ ⸀πρῶτος. λέγει αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν λέγω ὑμῖν ὅτι οἱ τελῶναι καὶ αἱ πόρναι προάγουσιν ὑμᾶς εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/031.yaml
  text: Which of the two did the will of the father? They said[a], “The first.” Jesus said to them, “Truly I say to you, the tax collectors and the prostitutes are going ahead of you into the kingdom of God.”
translation:
  language: fr
  text: 'Lequel des deux a fait la volonté du père ? Ils répondirent : « Le premier. » Jésus leur dit : « Amen, je vous le dis, les collecteurs d’impôts et les prostituées vous devancent pour entrer dans le royaume de Dieu.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « entrent avant vous dans le royaume de Dieu ». Le grec exprime le fait de vous précéder, sans nécessairement affirmer votre exclusion définitive.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐκ τῶν δύο
  choice: Lequel des deux
  rationale: Formulation interrogative naturelle qui conserve le sens partitif de ἐκ avec δύο.
- source_word: ἐποίησεν τὸ θέλημα τοῦ πατρός
  choice: a fait la volonté du père
  rationale: Expression française claire et proche du grec. « Du père » renvoie ici au père de la parabole, sans identifier directement ce personnage à Dieu.
- source_word: Ὁ πρῶτος
  choice: Le premier
  rationale: Réponse elliptique, concise et naturelle, correspondant exactement à la structure grecque.
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: Amen, je vous le dis
  rationale: Conserve la formule solennelle caractéristique de Jésus tout en restant immédiatement compréhensible en français moderne.
- source_word: τελῶναι
  choice: les collecteurs d’impôts
  rationale: Équivalent moderne et précis des agents chargés de percevoir les taxes, socialement méprisés dans le contexte évangélique.
- source_word: πόρναι
  choice: les prostituées
  rationale: Rend le terme grec spécifique sans employer un mot archaïque ni l’élargir à toute forme d’immoralité sexuelle.
- source_word: προάγουσιν ὑμᾶς
  choice: vous devancent
  rationale: Préserve l’image de personnes qui passent devant d’autres et la valeur présente du verbe, sans affirmer à elle seule l’exclusion définitive des interlocuteurs.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: pour entrer dans le royaume de Dieu
  rationale: Exprime naturellement en français le mouvement orienté par εἰς, en lien avec le verbe de précédence.
theological_decisions:
- issue: Portée de προάγουσιν ὑμᾶς quant à l’entrée dans le royaume
  choice: vous devancent pour entrer dans le royaume de Dieu
  alternative: entrent avant vous dans le royaume de Dieu
  rationale: Le verbe προάγω exprime le fait de précéder ou de passer devant. La formulation retenue maintient l’idée de priorité et la force de l’avertissement, sans transformer cette priorité en déclaration explicite d’exclusion définitive.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation française et le discours direct rendent clairement l’échange. « Amen » est conservé comme formule solennelle biblique, sans archaïsme dans le reste de la phrase.
