id: MAT.21.33
reference: Matthew 21:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄλλην παραβολὴν ἀκούσατε. ⸀Ἄνθρωπος ἦν οἰκοδεσπότης ὅστις ἐφύτευσεν ἀμπελῶνα καὶ φραγμὸν αὐτῷ περιέθηκεν καὶ ὤρυξεν ἐν αὐτῷ ληνὸν καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/033.yaml
  text: 'Listen to another parable: There was a landowner who planted a vineyard and put a fence around it and dug a winepress in it and built a tower[a], and leased it to tenant farmers[c][b], and went away.'
translation:
  language: fr
  text: « Écoutez une autre parabole. Il y avait un propriétaire qui planta une vigne, l’entoura d’une clôture[b], y creusa un pressoir et construisit une tour[a]. Puis il la loua à des vignerons[c] et partit en voyage. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image de la vigne plantée, entourée, munie d’un pressoir et d’une tour fait écho à Ésaïe 5.1-2.
    reason: cross_reference
  - marker: b
    text: Ou « d’une haie ». Le terme grec peut désigner différents types de barrières entourant un terrain, notamment une clôture ou une haie.
    reason: lexical_alternative
  - marker: c
    text: Ou « à des cultivateurs ». Il s’agit de personnes auxquelles le propriétaire confie l’exploitation de la vigne en la leur louant.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄλλην παραβολὴν ἀκούσατε
  choice: Écoutez une autre parabole
  rationale: L’impératif aoriste pluriel ἀκούσατε est rendu naturellement par « Écoutez », tandis que « parabole » est le terme précis et usuel pour παραβολή dans l’enseignement de Jésus.
- source_word: Ἄνθρωπος ἦν οἰκοδεσπότης
  choice: Il y avait un propriétaire
  rationale: Dans ce cadre agricole, οἰκοδεσπότης désigne le maître ou propriétaire du domaine. La tournure « Il y avait » restitue idiomatiquement l’introduction grecque.
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: planta une vigne
  rationale: Cette traduction concrète rend directement φυτεύω et ἀμπελών, tout en conservant l’imagerie qui fait écho à Ésaïe 5.
- source_word: φραγμὸν αὐτῷ περιέθηκεν
  choice: l’entoura d’une clôture
  rationale: φραγμός désigne une barrière entourant un terrain, qui peut être une clôture ou une haie. « Clôture » reste naturel et ne précise pas indûment le matériau.
- source_word: ὤρυξεν ἐν αὐτῷ ληνὸν
  choice: y creusa un pressoir
  rationale: ληνός désigne un pressoir à vin et ὀρύσσω signifie creuser. En contexte viticole, « pressoir » est suffisamment clair sans ajout explicatif dans le texte.
- source_word: ᾠκοδόμησεν πύργον
  choice: construisit une tour
  rationale: πύργος signifie « tour ». Même si elle pouvait servir à la surveillance, le grec n’explicite pas cette fonction.
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: la loua à des vignerons
  rationale: La forme moyenne de ἐκδίδωμι exprime ici la mise en location. Dans le contexte d’une vigne, γεωργοί désigne les cultivateurs chargés de l’exploiter; « vignerons » est naturel en français, tandis que « loua » indique leur statut de preneurs plutôt que de simples ouvriers.
- source_word: ἀπεδήμησεν
  choice: partit en voyage
  rationale: ἀποδημέω indique le départ loin de chez soi, sans que la destination soit précisée. « Partit en voyage » conserve cette idée sans ajouter un pays étranger.
theological_decisions:
- issue: Écho de l’image de la vigne à Ésaïe 5
  choice: Conserver dans le texte les éléments agricoles concrets et signaler l’écho dans une note.
  alternative: Employer dans le texte une formulation plus traditionnelle afin de rendre l’allusion plus manifeste.
  rationale: L’allusion est forte, mais elle ne doit pas devenir une explication insérée dans les paroles de Jésus. La note permet de la signaler sans résoudre ou amplifier le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le récit conserve des verbes concrets et une syntaxe fluide. « Pressoir » et « tour » maintiennent l’imagerie agricole sans explicitation interprétative dans le corps du texte.
