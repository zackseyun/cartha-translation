reference: Matthew 21:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂προσελθὼν δὲ⸃ τῷ ⸀δευτέρῳ εἶπεν ὡσαύτως· ὁ δὲ ἀποκριθεὶς εἶπεν· ⸂Ἐγώ, κύριε· καὶ οὐκ⸃ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/021/030.yaml
  text: Then he came to the second and said the same[a]. And he answered, ‘I will[b], sir,’ but he did not go.
translation:
  language: fr
  text: 'Puis il s’approcha du second et lui dit la même chose. Celui-ci répondit : « Oui, monsieur[a] », mais il n’y alla pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Moi, monsieur. » Cette réponse elliptique peut se comprendre comme « Moi, j’y vais » ou simplement « Oui ». Le mot traduit par « monsieur » peut aussi signifier « seigneur » ou « maître » ; il sert ici d’adresse respectueuse au père.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν δὲ
  choice: Puis il s’approcha
  rationale: Le participe aoriste introduit le mouvement du père vers le second fils, tandis que δέ marque ici la progression du récit. « Puis il s’approcha » est naturel et conserve cette nuance.
- source_word: τῷ δευτέρῳ
  choice: du second
  rationale: Le grec dit simplement « le second » ; « fils » est clairement sous-entendu par le contexte immédiat, sans devoir être répété.
- source_word: εἶπεν ὡσαύτως
  choice: lui dit la même chose
  rationale: ὡσαύτως renvoie au même ordre donné au premier fils. Cette formulation française est concise et explicite.
- source_word: ἀποκριθεὶς εἶπεν
  choice: répondit
  rationale: La tournure grecque, littéralement « ayant répondu, il dit », se rend naturellement en français par le seul verbe « répondre ».
- source_word: Ἐγώ
  choice: Oui
  rationale: Le grec porte seulement le pronom emphatique « moi », réponse elliptique qui signifie ici l’acceptation de l’ordre, soit « moi, j’y vais » ou « oui ». « Oui » produit une réponse naturelle en français tout en laissant l’ellipse littérale dans la note.
- source_word: κύριε
  choice: monsieur
  rationale: Dans cette scène familiale, le vocatif exprime une adresse respectueuse à un père humain. « Monsieur » évite d’introduire à tort un titre divin, même si cette politesse envers un père paraît plus marquée en français contemporain.
- source_word: καὶ οὐκ ἀπῆλθεν
  choice: mais il n’y alla pas
  rationale: Bien que καί signifie normalement « et », le contraste entre la parole et l’action appelle naturellement « mais » en français. Le pronom « y » reprend le lieu où le père avait envoyé son fils.
theological_decisions:
- issue: Valeur de κύριε dans l’adresse au père
  choice: monsieur
  alternative: Seigneur ; maître
  rationale: 'Le contexte ne présente pas ici un titre christologique ou divin : un fils répond respectueusement à son père. « Seigneur » risquerait une surinterprétation théologique, tandis que « maître » suggérerait une relation de servitude absente du passage.'
- issue: Interprétation de la réponse elliptique Ἐγώ
  choice: Oui
  alternative: Moi, monsieur ; J’y vais, monsieur
  rationale: Le pronom isolé exprime l’engagement du fils sans énoncer le verbe. « Oui » rend cet assentiment en français courant, tandis que la note conserve la forme grecque et ses deux développements possibles.
translation_notes:
  register: Français moderne, narratif et digne. La syntaxe reste simple et accessible. « Monsieur » signale le respect sans connotation divine ; une note explique à la fois l’ellipse inhabituelle de Ἐγώ et l’éventail de sens de κύριε.
