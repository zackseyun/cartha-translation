  source_fidelity: La question sur l’inquiétude et l’habillement est fidèlement rendue. « Lis des champs » conserve le sens lexical de κρίνα tout en maintenant l’incertitude botanique en note. Toutefois, « voyez » introduit un second impératif qui n’est pas explicite dans le grec, et « peiner » est moins naturel ici pour κοπιάω, qui évoque le travail ou le labeur.
  naturalness: 'Le français est globalement clair et de registre approprié. « Considérez comment poussent les lis des champs » est plus fluide que « Observez les lis des champs : voyez comment ils poussent » et évite l’ajout d’un impératif. « Ils ne travaillent pas et ne filent pas » est plus idiomatique que « Ils ne peinent pas » dans cette image végétale.'
