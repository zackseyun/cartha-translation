source:
  edition: SBLGNT
  text: καὶ περὶ ἐνδύματος τί μεριμνᾶτε; καταμάθετε τὰ κρίνα τοῦ ἀγροῦ πῶς ⸂αὐξάνουσιν· οὐ κοπιῶσιν οὐδὲ νήθουσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/028.yaml
  text: 'And why are you anxious about clothing? Consider the lilies of the field[a], how they grow: they do not labor[c][b], nor do they spin.'
translation:
  language: fr
  text: 'Et pourquoi vous inquiétez-vous au sujet des vêtements ? Considérez comment poussent les lis des champs[a] : ils ne travaillent pas et ne filent pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les fleurs sauvages des champs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ ἐνδύματος
  choice: au sujet des vêtements
  rationale: Le singulier grec désigne ici l’habillement comme catégorie générale; le pluriel « vêtements » est naturel en français.
- source_word: τί μεριμνᾶτε
  choice: pourquoi vous inquiétez-vous
  rationale: Dans ce contexte, μεριμνάω exprime une inquiétude anxieuse concernant les besoins matériels; la tournure interrogative rend naturellement τί.
- source_word: καταμάθετε
  choice: observez
  rationale: L’impératif invite à regarder attentivement afin d’en tirer un enseignement. « Observez » conserve cette dimension concrète sans surtraduire.
- source_word: τὰ κρίνα τοῦ ἀγροῦ
  choice: les lis des champs
  rationale: κρίνα désigne directement les lis, tandis que τοῦ ἀγροῦ évoque les espaces non cultivés ou les champs; l’expression française est claire et traditionnelle.
- source_word: πῶς αὐξάνουσιν
  choice: voyez comment ils poussent
  rationale: αὐξάνω décrit ici la croissance naturelle. L’ajout idiomatique de « voyez » rattache clairement la proposition à l’invitation à observer.
- source_word: οὐ κοπιῶσιν
  choice: ils ne peinent pas
  rationale: κοπιάω désigne un travail pénible ou fatigant; « peiner » préserve cette nuance mieux que le simple « travailler ».
- source_word: οὐδὲ νήθουσιν
  choice: et ne filent pas
  rationale: νήθω signifie filer du fil ou de la laine. La formulation concise maintient le parallélisme grec.
theological_decisions:
- issue: Portée de μεριμνάω dans l’enseignement de Jésus sur la providence
  choice: vous inquiétez-vous
  alternative: vous faites-vous du souci
  rationale: « S’inquiéter » exprime clairement l’anxiété visée sans transformer le verset en interdiction de toute prévoyance responsable.
- issue: Identification botanique de κρίνα
  choice: lis
  alternative: fleurs sauvages
  rationale: « Lis » est l’équivalent lexical direct, mais l’identification botanique exacte peut être plus large; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme reste bref et oral, avec un parallélisme naturel dans la dernière phrase.
