id: MAT.6.18
reference: Matthew 6:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπως μὴ φανῇς τοῖς ἀνθρώποις νηστεύων ἀλλὰ τῷ πατρί σου τῷ ἐν τῷ ⸀κρυφαίῳ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸁κρυφαίῳ ἀποδώσει σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/018.yaml
  text: so that you may not appear to men to be fasting[a], but to your Father who is in secret[b]; and your Father who sees in secret will reward you.
translation:
  language: fr
  text: afin que tu ne paraisses pas jeûner devant les gens, mais devant ton Père, qui est dans le secret[a] ; et ton Père, qui voit dans le secret, te récompensera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin que tu ne paraisses pas aux gens jeûnant, mais à ton Père qui est dans le secret ». Le grec exprime le contraste de manière elliptique.'
    reason: La note signale la construction elliptique et le parallélisme de la phrase grecque.
  - marker: b
    text: 'Ou : « te rendra » ou « te rétribuera ».'
    reason: ἀποδίδωμι peut désigner le fait de rendre ou de rétribuer; « te récompensera » est retenu ici pour la clarté contextuelle.
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit le but et conserve naturellement la valeur finale de la conjonction grecque.
- source_word: μὴ φανῇς τοῖς ἀνθρώποις νηστεύων
  choice: que les gens ne voient pas que tu jeûnes
  rationale: Rend le passif de φαίνω par une tournure active idiomatique en français, tout en maintenant les observateurs humains et le jeûne comme éléments explicites.
- source_word: τοῖς ἀνθρώποις
  choice: les gens
  rationale: ἄνθρωποι désigne ici les observateurs humains en général, sans restriction aux hommes de sexe masculin.
- source_word: τῷ πατρί σου τῷ ἐν τῷ κρυφαίῳ
  choice: que ton Père, qui est dans le secret, le voie
  rationale: 'Explicite l''ellipse après ἀλλά sans changer le contraste : le jeûne ne doit pas être exhibé devant les humains, mais perçu par le Père. « Dans le secret » préserve le motif répété.'
- source_word: ὁ βλέπων ἐν τῷ κρυφαίῳ
  choice: qui voit dans le secret
  rationale: Suit de près le grec sans ajouter « ce qui se fait », absent du texte, et maintient la répétition de ἐν τῷ κρυφαίῳ.
- source_word: ἀποδώσει σοι
  choice: te le rendra
  rationale: Conserve la valeur de rétribution de ἀποδίδωμι tout en évitant d'imposer plus que nécessaire la notion de récompense méritée.
theological_decisions:
- issue: Portée générique de ἀνθρώποις
  choice: les gens
  alternative: les hommes
  rationale: Dans ce contexte, le masculin pluriel grec englobe tous les observateurs humains ; le français moderne « les gens » transmet directement cette portée générique.
- issue: Ellipse après ἀλλά
  choice: que ton Père, qui est dans le secret, le voie
  alternative: mais à ton Père qui est dans le secret
  rationale: Le grec oppose littéralement le fait d'apparaître aux humains et le Père. La formulation française explicite seulement le verbe sous-entendu pour obtenir une phrase claire, sans faire du Père le destinataire du jeûne.
- issue: Sens de ἐν τῷ κρυφαίῳ
  choice: dans le secret dans les deux occurrences
  alternative: dans le lieu secret / en privé
  rationale: La répétition volontaire relie la présence cachée du Père à son regard ; une traduction identique conserve ce lien sans préciser indûment un lieu physique.
- issue: Valeur de ἀποδώσει
  choice: te le rendra
  alternative: te récompensera
  rationale: « Rendre » préserve la notion ouverte de rétribution contenue dans le verbe grec et la tension théologique du passage, sans nier que le contexte puisse évoquer une récompense.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l'adresse individuelle au singulier. La répétition « dans le secret » est intentionnellement conservée, et la ponctuation met en relief les deux propositions coordonnées.
