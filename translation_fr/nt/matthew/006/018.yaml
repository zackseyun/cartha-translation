  terminology: « Les gens » transmet bien la portée générique de τοῖς ἀνθρώποις. « Père » conserve le terme relationnel du texte. La répétition exacte de « dans le secret » maintient le lien rhétorique entre les deux occurrences de ἐν τῷ κρυφαίῳ, sans en imposer une interprétation spatiale détaillée.
