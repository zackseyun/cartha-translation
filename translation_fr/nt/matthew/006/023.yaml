id: MAT.6.23
reference: Matthew 6:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ ὁ ὀφθαλμός σου πονηρὸς ᾖ, ὅλον τὸ σῶμά σου σκοτεινὸν ἔσται. εἰ οὖν τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν, τὸ σκότος πόσον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/023.yaml
  text: But if your eye is bad[a], your whole body will be dark. If then the light in you is darkness, how great is the darkness!
translation:
  language: fr
  text: Mais si ton œil est mauvais[a], tout ton corps sera dans l’obscurité. Si donc la lumière qui est en toi est ténèbres, combien grandes seront les ténèbres !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « malveillant », « malade », ou peut-être « envieux » ou « peu généreux », selon l’idiome de l’« œil » et le contexte.
    reason: Alternative lexicale préservant les diverses nuances possibles de πονηρός.
lexical_decisions:
- source_word: πονηρός
  choice: mauvais
  rationale: '« Mauvais » conserve l’étendue du terme grec : il peut évoquer un œil défectueux, moralement mauvais ou, selon l’idiome et le contexte, envieux ou peu généreux, sans imposer une seule interprétation.'
- source_word: σκοτεινός
  choice: dans l’obscurité
  rationale: Cette formulation française naturelle exprime l’état qualifié par l’adjectif grec tout en maintenant l’image de la lumière et des ténèbres.
- source_word: φῶς
  choice: lumière
  rationale: Le sens concret est conservé afin de ne pas expliciter prématurément la portée intérieure, morale ou spirituelle de la métaphore.
- source_word: σκότος
  choice: ténèbres
  rationale: « Ténèbres » maintient le contraste marqué avec « lumière » et la reprise culminante de la dernière proposition.
- source_word: πόσον
  choice: combien grandes
  rationale: Dans cette proposition exclamative elliptique, le terme exprime le degré. L’ajout de « seront », requis par le français, reprend naturellement le futur de la phrase précédente.
- source_word: ὀφθαλμός
  choice: œil
  rationale: La traduction littérale préserve la métaphore corporelle portant sur la perception, l’intention et l’orientation morale.
- source_word: ὅλον τὸ σῶμά σου
  choice: tout ton corps
  rationale: Rendu direct et idiomatique qui conserve l’insistance totalisante de ὅλον.
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: la lumière qui est en toi
  rationale: Cette traduction reste proche de la construction grecque et évite l’interprétation plus appuyée que constituerait « ta lumière intérieure ».
theological_decisions:
- issue: Sens de la métaphore de l’« œil mauvais »
  choice: Conserver la métaphore large avec « mauvais » dans le texte principal.
  alternative: « œil malveillant », « œil malade » ou « œil envieux/peu généreux »
  rationale: 'Le contexte de Matthieu 6.19-24 permet plusieurs nuances qui peuvent se recouvrir : corruption morale, perception faussée et possible idiome sémitique désignant l’envie ou le manque de générosité. La traduction ne tranche pas entre elles.'
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier grec. La formulation conserve le parallélisme lumière/ténèbres et l’exclamation finale, sans expliciter la métaphore.
