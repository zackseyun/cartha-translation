id: MAT.6.6
reference: Matthew 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σὺ δὲ ὅταν προσεύχῃ, εἴσελθε εἰς τὸ ταμεῖόν σου καὶ κλείσας τὴν θύραν σου πρόσευξαι τῷ πατρί σου τῷ ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/006.yaml
  text: But when you pray[a], go into your inner room, and after shutting your door, pray to your Father who is in secret; and your Father, who sees in secret[b], will reward you.
translation:
  language: fr
  text: Mais toi, quand tu pries, entre dans ta pièce retirée[a] et, après avoir fermé ta porte, prie ton Père qui est dans le secret ; et ton Père, qui voit dans le secret, te récompensera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pièce intérieure », « pièce privée » ou « réserve ». Le mot grec désigne une pièce intérieure utilisée pour s’isoler ou pour entreposer des biens.
    reason: lexical_alternative
  - marker: b
    text: Ou « te rendra » ou « te donnera ce qui t’est dû ». Le verbe grec peut signifier « rendre », « donner en retour » ou « récompenser », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mais toi
  rationale: Le pronom exprimé est emphatique et marque le contraste avec les hypocrites du verset précédent. « Mais toi » conserve naturellement cette mise en relief en français.
- source_word: ὅταν προσεύχῃ
  choice: quand tu pries
  rationale: ὅταν suivi du subjonctif exprime ici une circonstance générale ou répétée. « Quand tu pries » est naturel et n’implique pas une seule occasion.
- source_word: εἴσελθε εἰς τὸ ταμεῖόν σου
  choice: entre dans ta pièce retirée
  rationale: ταμεῖον désigne une pièce intérieure pouvant servir au rangement ou permettre de s’isoler. « Pièce retirée » rend l’idée de lieu intérieur et discret sans les connotations modernes trompeuses de « placard ».
- source_word: κλείσας τὴν θύραν σου
  choice: ferme ta porte
  rationale: 'Le participe aoriste indique une action accomplie avant la prière. La coordination impérative est idiomatique en français et laisse clairement entendre la séquence : entrer, fermer, puis prier.'
- source_word: πρόσευξαι τῷ πατρί σου
  choice: prie ton Père
  rationale: La formulation directe respecte l’impératif et conserve la désignation relationnelle de Dieu sans ajouter « céleste », absent du texte.
- source_word: τῷ ἐν τῷ κρυπτῷ
  choice: qui est dans le secret
  rationale: Cette formulation proche du grec préserve l’ambiguïté entre le secret comme domaine caché et comme lieu retiré, tout en maintenant le parallèle avec la proposition suivante.
- source_word: ὁ βλέπων ἐν τῷ κρυπτῷ
  choice: qui voit dans le secret
  rationale: La reprise de « dans le secret » reproduit la répétition rhétorique grecque sans expliciter indûment « ce qui se fait ».
- source_word: ἀποδώσει σοι
  choice: te récompensera
  rationale: Dans ce contexte de contraste entre ostentation et prière sincère, ἀποδίδωμι a naturellement le sens positif de récompenser, tout en gardant en note la possibilité lexicale de rendre ou de donner en retour.
theological_decisions:
- issue: Sens de la répétition ἐν τῷ κρυπτῷ
  choice: « dans le secret » dans les deux occurrences
  alternative: « dans le lieu secret », « en privé » ou « ce qui se fait en secret »
  rationale: La répétition met en contraste la prière cachée et l’ostentation publique. La même expression française conserve à la fois l’écho rhétorique et la tension entre valeur locative et valeur adverbiale.
- issue: Désignation de Dieu comme πατήρ
  choice: « Père »
  alternative: « Père céleste »
  rationale: Le texte dit simplement « ton Père ». La traduction conserve cette appellation relationnelle sans importer une précision provenant du contexte plus large.
- issue: Nature de la réponse divine exprimée par ἀποδώσει
  choice: « te récompensera »
  alternative: « te le rendra » ou « te donnera en retour »
  rationale: « Récompensera » convient au contexte, mais la note maintient l’étendue sémantique du verbe et évite de préciser la forme que prendra cette réponse.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes grecques à la deuxième personne du singulier. La ponctuation garde les deux volets de la phrase et met en valeur la répétition « dans le secret ».
