  text: ὅπου γάρ ἐστιν ὁ θησαυρός ⸀σου, ἐκεῖ ἔσται καὶ ἡ καρδία ⸁σου.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/021.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: fr
  text: Car là où est ton trésor, là aussi sera ton cœur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On traduit parfois : « là aussi est ton cœur ». Le grec emploie toutefois le futur : « sera ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: là où
  rationale: Introduit une proposition relative de lieu et forme avec ἐκεῖ la corrélation naturelle en français « là où… là… ».
- source_word: γάρ
  choice: car
  rationale: Conserve le lien explicatif avec l’enseignement précédent sur les trésors.
- source_word: θησαυρός
  choice: trésor
  rationale: Équivalent direct et naturel, qui garde à la fois la portée concrète et la portée figurée du terme dans ce contexte.
- source_word: σου
  choice: ton
  rationale: Le pronom au singulier marque la possession pour « trésor » et « cœur »; le tutoiement correspond à l’adresse individuelle du grec.
- source_word: ἐκεῖ
  choice: là
  rationale: Reprend « là où » et préserve le parallélisme concis de la phrase grecque.
- source_word: ἔσται
  choice: sera
  rationale: Rend explicitement le futur de εἰμί sans le transformer en présent proverbial.
- source_word: καρδία
  choice: cœur
  rationale: Terme français établi qui conserve l’étendue de sens liée aux désirs, à l’attachement et à l’orientation intérieure.
- source_word: καὶ
  choice: aussi
  rationale: Exprime la relation additive entre le lieu du trésor et celui du cœur.
theological_decisions:
- issue: Valeur temporelle de ἔσται dans une maxime de sagesse
  choice: Maintenir le futur « sera »
  alternative: Employer le présent « est » pour formuler une vérité générale intemporelle
  rationale: Le texte grec porte un futur. Le conserver maintient la tension entre une correspondance générale et l’idée dynamique que le cœur en vient à se fixer là où se trouve le trésor, sans imposer une interprétation doctrinale particulière.
translation_notes:
  register: Français moderne, international et digne. La structure brève « là où… là aussi… » garde le parallélisme et la force mémorable de l’énoncé grec.
