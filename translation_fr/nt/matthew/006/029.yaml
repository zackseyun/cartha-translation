id: MAT.6.29
reference: Matthew 6:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ὅτι οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/029.yaml
  text: But I tell you that not even Solomon in all his glory was clothed like one of these[a].
translation:
  language: fr
  text: 'Mais je vous le dis : pas même Salomon, dans toute sa splendeur, n’a été vêtu comme l’une de ces fleurs.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν
  choice: Mais je vous le dis
  rationale: λέγω avec le datif ὑμῖν signifie naturellement « je vous le dis ». Ici, δέ introduit un léger contraste avec l’observation précédente.
- source_word: οὐδὲ
  choice: même … ne … pas
  rationale: 'Cette tournure française exprime naturellement la négation renforcée de οὐδέ : pas même Salomon ne soutient la comparaison.'
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: dans toute sa splendeur
  rationale: Dans ce contexte, δόξα désigne la magnificence royale et l’éclat extérieur de Salomon. « Splendeur » rend ce sens clairement sans suggérer ici la gloire divine.
- source_word: περιεβάλετο
  choice: n’était pas vêtu
  rationale: La forme moyenne/passive de περιβάλλω décrit la manière dont Salomon était habillé. « Être vêtu » convient au registre digne de la comparaison.
- source_word: ὡς ἓν τούτων
  choice: comme l’une de ces fleurs
  rationale: Le grec dit littéralement « comme une de celles-ci ». L’ajout explicite de « fleurs » reprend le référent du contexte immédiat et évite en français une formulation isolée ambiguë; le féminin s’accorde avec ce référent.
theological_decisions:
- issue: Sens de δόξα à propos de Salomon
  choice: splendeur
  alternative: gloire
  rationale: Le contexte porte sur la magnificence terrestre et royale de Salomon face à la beauté dont Dieu revêt les fleurs. « Splendeur » transmet ce sens sans importer une connotation de gloire divine.
- issue: Référent de τούτων
  choice: ces fleurs
  alternative: celles-ci
  rationale: Le démonstratif renvoie aux fleurs mentionnées au verset précédent. Les nommer rend le français autonome et limpide sans modifier la comparaison théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La structure contrastive et l’insistance de οὐδέ sont conservées; « vêtu » maintient le lien avec l’image de l’habillement dans le contexte.
