id: MAT.6.34
reference: Matthew 6:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε εἰς τὴν αὔριον, ἡ γὰρ αὔριον μεριμνήσει ⸀αὑτῆς· ἀρκετὸν τῇ ἡμέρᾳ ἡ κακία αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/034.yaml
  text: Therefore do not worry about tomorrow[a], for tomorrow will worry about itself. Each day has enough trouble of its own.
translation:
  language: fr
  text: Ne vous inquiétez donc pas du lendemain, car le lendemain s’inquiétera de lui-même. À chaque jour suffit sa peine[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son mal ». Le mot grec peut désigner le mal, mais il évoque probablement ici la peine, la difficulté ou l’épreuve propre à chaque jour.
    reason: alternative lexicale
lexical_decisions:
- source_word: μεριμνήσητε
  choice: ne vous inquiétez pas
  rationale: Dans Matthieu 6.25-34, le verbe désigne l’inquiétude anxieuse. Cette tournure est naturelle en français moderne et maintient le lien avec le thème répété du passage.
- source_word: εἰς τὴν αὔριον
  choice: du lendemain
  rationale: Avec μεριμνάω, la préposition exprime ce vers quoi se porte l’inquiétude. « Du lendemain » rend idiomatiquement cette préoccupation pour le jour à venir.
- source_word: ἡ αὔριον
  choice: le lendemain
  rationale: Le substantif grec est personnifié comme sujet de la proposition suivante. « Le lendemain » conserve naturellement cette personnification en français.
- source_word: μεριμνήσει αὑτῆς
  choice: s’inquiétera de lui-même
  rationale: La traduction reprend le même verbe que dans l’interdiction précédente, représente le réfléchi αὑτῆς et préserve l’effet rhétorique de la personnification.
- source_word: ἀρκετὸν τῇ ἡμέρᾳ
  choice: À chaque jour suffit
  rationale: Cette formulation française claire et proverbiale restitue la suffisance exprimée par ἀρκετόν ainsi que la portée distributive du datif τῇ ἡμέρᾳ.
- source_word: ἡ κακία αὐτῆς
  choice: sa peine
  rationale: Dans ce contexte consacré à l’inquiétude, κακία désigne vraisemblablement l’adversité ou la difficulté propre à chaque jour. « Sa peine » garde le singulier collectif et convient à la forme sentencieuse, sans effacer l’autre sens possible, signalé en note.
theological_decisions:
- issue: Sens de κακία dans la maxime finale
  choice: peine
  alternative: mal
  rationale: Le contexte porte sur les soucis et les épreuves quotidiennes plutôt que sur la méchanceté morale. « Peine » communique cette charge journalière en français naturel, tandis que la note conserve l’ambiguïté lexicale réelle du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure proverbiale « À chaque jour suffit sa peine » est largement compréhensible, respecte le caractère sentencieux de l’original et maintient la personnification du lendemain.
