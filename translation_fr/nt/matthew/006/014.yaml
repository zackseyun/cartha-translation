id: MAT.6.14
reference: Matthew 6:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν γὰρ ἀφῆτε τοῖς ἀνθρώποις τὰ παραπτώματα αὐτῶν, ἀφήσει καὶ ὑμῖν ὁ πατὴρ ὑμῶν ὁ οὐράνιος·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/014.yaml
  text: For if you forgive people their trespasses[b][a], your heavenly Father will also forgive you.
translation:
  language: fr
  text: Car si vous pardonnez aux autres leurs fautes[a], votre Père céleste vous pardonnera aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leurs transgressions », « leurs offenses » ou « leurs manquements ». Le terme grec désigne des faux pas ou des fautes d’ordre moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν γὰρ
  choice: Car si
  rationale: γάρ relie explicitement ce verset à la prière précédente avec une valeur explicative; ἐάν suivi du subjonctif aoriste introduit ici une condition, rendue naturellement par « si ».
- source_word: ἀφῆτε … ἀφήσει
  choice: vous pardonnez … vous pardonnera
  rationale: Dans ce contexte de fautes morales et relationnelles, ἀφίημι signifie « pardonner ». Le même verbe français est conservé dans les deux propositions afin de reproduire le lien verbal grec.
- source_word: τοῖς ἀνθρώποις
  choice: aux autres
  rationale: Le grec désigne les êtres humains en général, sans limitation masculine. Dans cette phrase adressée aux disciples, « aux autres » est idiomatique et exprime clairement les personnes envers lesquelles le pardon s’exerce.
- source_word: τὰ παραπτώματα αὐτῶν
  choice: leurs fautes
  rationale: παράπτωμα évoque un faux pas ou une faute morale. « Fautes » est naturel, digne et suffisamment précis en français moderne; une note conserve les principales nuances possibles.
- source_word: καὶ ὑμῖν
  choice: vous … aussi
  rationale: καί marque la correspondance entre le pardon accordé par les disciples et celui du Père; « aussi » en restitue naturellement la portée. Le datif ὑμῖν devient le complément direct de « pardonner » en français.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: votre Père céleste
  rationale: Cette formulation rend naturellement la construction attributive grecque et conserve la désignation révérencielle caractéristique de Matthieu.
theological_decisions:
- issue: Rapport conditionnel entre le pardon accordé aux autres et le pardon divin
  choice: Présenter directement la proposition comme une condition réelle.
  alternative: Préciser que le pardon humain mérite le pardon divin, ou qu’il ne fait que prouver qu’un pardon divin antérieur a déjà été reçu.
  rationale: Le grec énonce simplement une condition. La traduction en préserve la force et la tension théologique sans lui imposer une explication causale ou purement probatoire.
translation_notes:
  register: Français international moderne, clair et digne. « Aux autres » évite le masculin générique de « aux hommes » et sonne plus naturellement dans ce contexte. « Père céleste » conserve la concision et le registre révérenciel du grec.
