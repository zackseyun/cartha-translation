id: MAT.6.19
reference: Matthew 6:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ θησαυρίζετε ὑμῖν θησαυροὺς ἐπὶ τῆς γῆς, ὅπου σὴς καὶ βρῶσις ἀφανίζει, καὶ ὅπου κλέπται διορύσσουσιν καὶ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/019.yaml
  text: Do not store up for yourselves treasures on earth[a], where moth and decay destroy[b], and where thieves break in and steal.
translation:
  language: fr
  text: Ne vous amassez pas de trésors sur la terre, où les mites et ce qui ronge[a] détruisent, et où les voleurs percent les murs[b] et volent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec évoque ce qui mange ou consume; selon le contexte, il peut aussi être rendu par « détérioration » ou « rouille ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « creusent à travers », probablement en perçant les murs en terre des maisons.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ θησαυρίζετε
  choice: Ne vous amassez pas
  rationale: Le présent impératif avec μή exprime l’interdiction. « S’amasser » rend naturellement en français l’idée d’accumuler des biens pour soi.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom datif a ici une valeur réflexive; la construction française « vous amasser » exprime clairement que l’accumulation se fait pour soi-même.
- source_word: θησαυροὺς
  choice: des trésors
  rationale: Ce choix conserve le terme concret et le lien lexical avec le verbe θησαυρίζετε, tout en couvrant plus largement les richesses auxquelles on accorde de la valeur.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Formulation française courante qui préserve le contraste spatial avec le ciel au verset suivant.
- source_word: σὴς
  choice: les mites
  rationale: Le mot désigne les insectes qui détériorent notamment les vêtements entreposés; « mites » est l’équivalent français direct et usuel.
- source_word: βρῶσις
  choice: ce qui ronge
  rationale: Le nom évoque l’action de manger ou de consumer. Cette formulation conserve son sens assez large sans le limiter à la corrosion des métaux; l’ambiguïté est explicitée en note.
- source_word: ἀφανίζει
  choice: détruisent
  rationale: Le verbe signifie faire disparaître, ruiner ou détruire. Le pluriel français s’accorde naturellement avec les deux causes coordonnées.
- source_word: κλέπται
  choice: les voleurs
  rationale: Équivalent lexical direct et courant.
- source_word: διορύσσουσιν
  choice: percent les murs
  rationale: Le verbe signifie littéralement creuser ou percer à travers. La mention des murs explicite sobrement l’objet implicite dans le contexte des habitations anciennes.
- source_word: κλέπτουσιν
  choice: volent
  rationale: Équivalent français direct du verbe désignant le fait de dérober.
theological_decisions:
- issue: Portée de ἐπὶ τῆς γῆς
  choice: sur la terre
  alternative: sur terre
  rationale: « Sur la terre » maintient concrètement le domaine terrestre opposé au ciel dans le contexte immédiat, sans ajouter de distinction doctrinale.
- issue: Sens de βρῶσις
  choice: ce qui ronge
  alternative: la rouille; la vermine; la détérioration
  rationale: Le terme grec peut désigner l’action de manger ou, par extension, ce qui consume et détériore. Le rendu choisi préserve cette largeur sémantique plutôt que d’imposer la seule corrosion métallique.
- issue: Image évoquée par διορύσσουσιν
  choice: percent les murs
  alternative: s’introduisent par effraction; creusent une ouverture
  rationale: Le rendu garde l’image concrète du verbe grec, probablement liée au percement des murs en terre, tout en restant intelligible pour le lecteur moderne.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve le parallélisme du grec et son image concrète, tout en évitant le terme traditionnel « rouille », trop étroit sans note explicative.
