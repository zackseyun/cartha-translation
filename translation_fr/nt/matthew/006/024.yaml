id: MAT.6.24
reference: Matthew 6:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐδεὶς δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/024.yaml
  text: No one is able to serve two masters[a], for either he will hate the one and love the other, or he will be devoted to one and despise the other. You are not able to serve God and mammon.
translation:
  language: fr
  text: 'Personne ne peut servir deux maîtres : car ou bien il haïra l’un et aimera l’autre, ou bien il s’attachera à l’un et méprisera l’autre. Vous ne pouvez pas servir Dieu et Mammon[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les richesses » ou « l’argent ». Le grec emploie le mot emprunté « Mammon », qui peut personnifier les richesses comme un maître rival.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: Personne ne
  rationale: 'Rend naturellement en français le pronom négatif universel : « personne ne peut ».'
- source_word: δύναται / δύνασθε
  choice: peut / ne pouvez pas
  rationale: Le verbe exprime la capacité ou la possibilité. La répétition de « pouvoir » conserve l’insistance du grec tout en restant idiomatique.
- source_word: δυσὶ κυρίοις
  choice: deux maîtres
  rationale: Dans le cadre du service servile évoqué par δουλεύειν, « maîtres » exprime la relation d’autorité sans confondre κύριοις avec le titre divin « Seigneur ».
- source_word: δουλεύειν
  choice: servir
  rationale: « Servir deux maîtres » est naturel en français et, grâce au mot « maîtres », garde la nuance de service soumis ou servile du verbe grec.
- source_word: μισήσει
  choice: haïra
  rationale: Traduction directe qui préserve la force de l’antithèse avec « aimera », sans atténuer le contraste en « aimera moins ».
- source_word: ἀγαπήσει
  choice: aimera
  rationale: Rend directement le verbe grec et maintient son opposition explicite avec « haïra ».
- source_word: ἑνὸς ἀνθέξεται
  choice: s’attachera à l’un
  rationale: Le verbe exprime le fait de tenir fermement à quelqu’un, de lui rester attaché ou dévoué. « S’attachera » est précis, relationnel et naturel.
- source_word: καταφρονήσει
  choice: méprisera
  rationale: Conserve l’idée forte de considérer l’autre avec mépris et répond bien au verbe « s’attachera ».
- source_word: θεῷ
  choice: Dieu
  rationale: Traduction française usuelle du datif employé comme complément de δουλεύειν.
- source_word: μαμωνᾷ
  choice: Mammon
  rationale: Le maintien du terme emprunté conserve la personnification rhétorique des richesses comme maître rival de Dieu. Son sens est expliqué en note.
theological_decisions:
- issue: Traduction de κύριος dans un contexte social non divin
  choice: maîtres
  alternative: seigneurs
  rationale: Le pluriel et l’image du service soumis imposent ici le sens social de « maîtres ». « Seigneurs » risquerait d’introduire à tort le titre divin.
- issue: Traduction de μαμωνᾶς
  choice: Mammon
  alternative: l’argent / les richesses
  rationale: Le mot emprunté place Mammon en parallèle avec Dieu comme maître rival et préserve ainsi la personnification du propos. Les équivalents sémantiques sont indiqués en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure antithétique du grec est conservée par « ou bien… ou bien… ». Les futurs simples maintiennent la netteté proverbiale de l’énoncé, et « Mammon » porte une majuscule pour rendre visible sa fonction personnifiée dans ce contexte.
