id: MAT.6.22
reference: Matthew 6:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός. ἐὰν οὖν ⸂ᾖ ὁ ὀφθαλμός σου ἁπλοῦς⸃, ὅλον τὸ σῶμά σου φωτεινὸν ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/022.yaml
  text: The eye is the lamp of the body. Therefore[a], if your eye is healthy, your whole body will be full of light.
translation:
  language: fr
  text: L’œil est la lampe du corps. Ainsi, si ton œil est sain[a], tout ton corps sera lumineux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « simple », « sans partage », « clair » ou « en bon état » ; le mot grec peut aussi évoquer la générosité dans certains contextes.
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: lampe
  rationale: Le mot grec désigne normalement une lampe concrète plutôt que la lumière au sens abstrait. « Lampe » préserve donc l’image de l’œil comme moyen d’éclairage du corps.
- source_word: σῶμα
  choice: corps
  rationale: Équivalent français direct et naturel, qui conserve l’image corporelle du verset.
- source_word: ὀφθαλμός
  choice: œil
  rationale: La traduction littérale convient aussi bien à l’image physique qu’à sa portée morale.
- source_word: ἐὰν οὖν
  choice: Ainsi, si
  rationale: οὖν introduit une conséquence tirée de la première affirmation. « Ainsi, si » exprime ce lien logique dans un français naturel.
- source_word: ἁπλοῦς
  choice: sain
  rationale: Dans le contraste entre un œil qui éclaire et un œil mauvais, « sain » évoque naturellement un œil qui fonctionne correctement. Les autres nuances possibles sont conservées en note.
- source_word: ὅλον
  choice: tout
  rationale: « Tout ton corps » rend simplement et naturellement le caractère global exprimé par ὅλον.
- source_word: φωτεινὸν
  choice: lumineux
  rationale: L’adjectif français correspond directement au prédicat grec et conserve l’image de l’illumination de tout le corps.
- source_word: ἔσται
  choice: sera
  rationale: Le futur grec est explicitement conservé.
theological_decisions:
- issue: Sens de ἁπλοῦς dans la métaphore de l’œil
  choice: Traduire par « sain » dans le texte principal
  alternative: « simple », « sans partage », « clair », « en bon état » ou, dans certains contextes, « généreux »
  rationale: Le contexte immédiat présente l’œil comme la lampe du corps et l’oppose, au verset suivant, à un œil mauvais. « Sain » maintient donc clairement l’image d’un œil qui remplit bien sa fonction, sans exclure les nuances de simplicité, d’intégrité ou de générosité possibles ailleurs, lesquelles sont signalées en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement singulier correspond au pronom grec σου et s’inscrit naturellement dans l’adresse directe du discours. « Lumineux » évite une périphrase tout en restant immédiatement compréhensible.
