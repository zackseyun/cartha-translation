id: MAT.6.4
reference: Matthew 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπως ᾖ σου ἡ ἐλεημοσύνη ἐν τῷ κρυπτῷ· καὶ ὁ πατήρ σου ὁ βλέπων ἐν τῷ ⸀κρυπτῷ ἀποδώσει ⸀σοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/004.yaml
  text: so that your giving to the poor may be in secret[b][a]; and your Father who sees in secret will reward you.
translation:
  language: fr
  text: afin que ton don aux pauvres reste secret[a] ; et ton Père, qui voit en secret, te récompensera[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton aumône reste secrète ». Le terme grec désigne précisément un don fait aux pauvres.
    reason: lexical_alternative
  - marker: b
    text: Ou « te rétribuera » ou « te rendra en retour ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως
  choice: afin que
  rationale: Introduit le but et relie naturellement le verset à l’instruction précédente.
- source_word: ᾖ
  choice: se fasse
  rationale: Rend naturellement en français le subjonctif présent après ὅπως, appliqué à l’acte de donner.
- source_word: ἐλεημοσύνη
  choice: don aux pauvres
  rationale: Exprime le sens concret d’un don fait aux personnes pauvres, sans employer le terme plus ancien « aumône ».
- source_word: ἐν τῷ κρυπτῷ
  choice: en secret / dans le secret
  rationale: 'Le grec répète la même expression. La légère variation française évite une tournure pesante tout en conservant le motif du secret : l’acte est caché et le Père voit dans ce domaine caché.'
- source_word: ὁ πατήρ σου
  choice: ton Père
  rationale: Respecte le texte, qui ne comporte pas ici l’adjectif « céleste ».
- source_word: ὁ βλέπων
  choice: qui voit
  rationale: Rend simplement et naturellement le participe substantivé grec.
- source_word: ἀποδώσει σοι
  choice: te le rendra
  rationale: Conserve l’idée fondamentale de rendre en retour sans préciser la nature, le moment ni la forme de la rétribution divine.
theological_decisions:
- issue: Nature de la rétribution divine exprimée par ἀποδώσει
  choice: te le rendra
  alternative: te récompensera
  rationale: « Te le rendra » préserve l’idée de retour ou de rétribution et laisse ouverte la nature de celle-ci. « Te récompensera » exprime clairement le sens favorable en contexte, mais interprète un peu davantage.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement suit l’adresse au singulier du grec. La formulation conserve la relation de but, la mention précise du don aux pauvres et l’indétermination de la rétribution.
