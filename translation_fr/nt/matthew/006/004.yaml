review_pass:
  verdict: revise
  source_fidelity: La relation de but introduite par ὅπως, le sens précis d’ἐλεημοσύνη (« don aux pauvres »), et l’absence de « céleste » après « Père » sont bien rendus. En revanche, « te le rendra » introduit un pronom objet absent du grec et risque de faire comprendre que le don lui-même sera rendu. ἀποδώσει σοι exprime ici la rétribution divine sans en préciser la forme.
  naturalness: « Afin que ton don aux pauvres reste secret » est moderne, idiomatique et rend plus naturellement l’état visé que « se fasse en secret ». La répétition de « en secret » dans les deux membres reproduit le motif lexical grec sans lourdeur excessive.
  terminology: « Don aux pauvres » est exact et accessible; « aumône » convient comme alternative lexicale. « Te récompensera » est le rendu français le plus naturel en contexte pour ἀποδώσει, sans définir la nature de la récompense.
  issues:
