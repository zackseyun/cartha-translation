    issue: « te le rendra » ajoute un objet implicite susceptible d’être identifié au don.
    rationale: Le grec porte seulement ἀποδώσει σοι, « te récompensera / te rendra en retour », sans pronom objet. En français, « le » oriente le lecteur vers le don mentionné et peut suggérer son retour matériel.
  - severity: low
    issue: La variation « en secret / dans le secret » ne reproduit pas la répétition grecque.
    rationale: Le grec répète ἐν τῷ κρυπτῷ. Une répétition française identique est naturelle ici et maintient le lien entre l’acte caché et la vision du Père.
