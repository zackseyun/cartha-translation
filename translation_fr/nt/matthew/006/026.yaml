id: MAT.6.26
reference: Matthew 6:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐμβλέψατε εἰς τὰ πετεινὰ τοῦ οὐρανοῦ ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν οὐδὲ συνάγουσιν εἰς ἀποθήκας, καὶ ὁ πατὴρ ὑμῶν ὁ οὐράνιος τρέφει αὐτά· οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/026.yaml
  text: Look at the birds of the sky[a], that they do not sow or reap or gather into barns, and your heavenly Father feeds them[b]. Are you not of much more value than they are?
translation:
  language: fr
  text: 'Regardez les oiseaux du ciel[a] : ils ne sèment ni ne moissonnent ni ne font de réserves dans des greniers, et votre Père céleste les nourrit. N’avez-vous pas plus de valeur qu’eux[b] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les oiseaux des cieux » ; traditionnellement, « les oiseaux de l’air ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Ne valez-vous pas davantage qu’eux ? »
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψατε
  choice: Regardez
  rationale: L’impératif aoriste appelle les auditeurs à diriger leur attention vers les oiseaux. « Regardez » est direct, naturel et n’accentue pas indûment l’idée d’examen attentif.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: les oiseaux du ciel
  rationale: « Oiseaux » rend naturellement πετεινά, et « du ciel » correspond directement à τοῦ οὐρανοῦ dans le cadre du monde visible.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français ce qu’il faut observer chez les oiseaux, sans trancher rigidement entre une nuance explicative (« car ») et une construction de contenu (« qu’ils… »).
- source_word: σπείρουσιν … θερίζουσιν … συνάγουσιν εἰς ἀποθήκας
  choice: ils ne sèment ni ne moissonnent et n’amassent rien dans des greniers
  rationale: Cette formulation conserve la série d’activités agricoles et l’image des lieux où l’on stocke les récoltes. « Rien » est ajouté pour obtenir une négation française naturelle avec « amasser », sans ajouter de contenu concret au texte.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: votre Père céleste
  rationale: Formulation française compacte et courante qui maintient à la fois la relation exprimée par « Père » et la qualification οὐράνιος.
- source_word: τρέφει
  choice: nourrit
  rationale: « Nourrit » exprime directement le fait de procurer la nourriture et convient au registre digne du passage.
- source_word: οὐχ ὑμεῖς μᾶλλον διαφέρετε αὐτῶν;
  choice: N’avez-vous pas bien plus de valeur qu’eux ?
  rationale: La question rhétorique attend une réponse affirmative. « Avoir bien plus de valeur » rend la supériorité comparative exprimée par μᾶλλον διαφέρετε dans ce contexte, sans en fournir le fondement théologique.
theological_decisions:
- issue: La valeur relative des humains et des oiseaux dans l’argument de Jésus
  choice: Le texte affirme que les auditeurs ont bien plus de valeur que les oiseaux aux yeux de la sollicitude divine, sans expliquer le fondement doctrinal de cette valeur.
  alternative: Expliciter que cette valeur supérieure vient de l’image de Dieu ou, plus étroitement, d’une relation d’alliance.
  rationale: Le verset établit clairement une comparaison, mais n’en donne pas ici la raison théologique. La traduction évite donc d’importer une explication absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation évite le tour peu naturel « regardez… qu’ils ne… » tout en préservant l’ouverture sémantique de ὅτι. Le parallélisme agricole reste perceptible, et la question finale garde sa force rhétorique.
