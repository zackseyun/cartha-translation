id: MAT.6.33
reference: Matthew 6:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ζητεῖτε δὲ πρῶτον τὴν ⸀βασιλείαν καὶ τὴν δικαιοσύνην αὐτοῦ, καὶ ταῦτα πάντα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/033.yaml
  text: But seek first his kingdom and his righteousness[a], and all these things will be added to you.
translation:
  language: fr
  text: Mais cherchez d’abord son royaume et sa justice[a], et tout cela vous sera donné en plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sa droiture ». Le mot grec peut désigner la justice ou la droiture, c’est-à-dire ce qui est conforme à la volonté de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖτε
  choice: cherchez
  rationale: L’impératif présent appelle à une recherche active et continue; « cherchez » reste naturel et concis en français.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec la recherche inquiète des besoins matériels évoquée auparavant.
- source_word: πρῶτον
  choice: d’abord
  rationale: « D’abord » exprime clairement la priorité sans transformer le texte en paraphrase.
- source_word: βασιλείαν
  choice: royaume
  rationale: « Royaume » est le rendu français établi dans Matthieu et peut désigner à la fois le règne royal de Dieu et l’ordre qui en découle.
- source_word: δικαιοσύνην
  choice: justice
  rationale: En français biblique moderne, « justice » conserve mieux que « droiture » l’étendue de δικαιοσύνη, qui englobe la conformité à la volonté de Dieu, la juste relation avec lui et la conduite juste.
- source_word: αὐτοῦ
  choice: son
  rationale: Le possessif conserve le pronom grec; son référent, Dieu, ressort du contexte.
- source_word: ταῦτα πάντα
  choice: tout cela
  rationale: Cette expression française naturelle reprend collectivement les besoins matériels mentionnés dans le contexte immédiat.
- source_word: προστεθήσεται
  choice: sera donné en plus
  rationale: Le futur passif exprime l’ajout de ces choses à la recherche prioritaire du royaume; « donné en plus » rend naturellement en français l’idée de προστίθημι sans suggérer qu’elles seraient méritées.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom indirect est intégré naturellement à la tournure passive « vous sera donné ».
theological_decisions:
- issue: Rendu de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: Le français « justice » possède une portée morale, relationnelle et sociale assez large pour ce contexte. La note préserve « droiture », qui peut mieux faire entendre la conformité personnelle à la volonté de Dieu, mais risquerait de rétrécir la dimension plus large du terme.
- issue: Référent de αὐτοῦ
  choice: son
  alternative: de Dieu
  rationale: Le possessif reflète directement le grec et laisse le contexte identifier le référent comme Dieu, sans explicitation inutile.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la structure contrastive et l’ordre des priorités du grec, tout en employant l’expression idiomatique « donné en plus ». Le tutoiement collectif n’étant pas marqué en français, « vous » correspond naturellement au pluriel grec.
