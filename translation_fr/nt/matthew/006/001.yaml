id: MAT.6.1
reference: Matthew 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Προσέχετε ⸀δὲ τὴν ⸀δικαιοσύνην ὑμῶν μὴ ποιεῖν ἔμπροσθεν τῶν ἀνθρώπων πρὸς τὸ θεαθῆναι αὐτοῖς· εἰ δὲ μή γε, μισθὸν οὐκ ἔχετε παρὰ τῷ πατρὶ ὑμῶν τῷ ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/001.yaml
  text: But be careful not to practice your righteousness before people in order to be seen by them[a]; otherwise[b], you have no reward from your Father in the heavens.
translation:
  language: fr
  text: Mais gardez-vous de pratiquer votre justice devant les gens pour être vus par eux[a] ; sinon, vous n’avez pas de récompense auprès de votre Père qui est dans les cieux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi rendre : « vos actes de justice ». Certains manuscrits portent : « votre aumône ».'
    reason: La note signale la portée concrète possible de δικαιοσύνην ainsi que la variante textuelle ἐλεημοσύνην, sans restreindre le texte principal à l’aumône.
lexical_decisions:
- source_word: Προσέχετε
  choice: gardez-vous
  rationale: L’impératif présent pluriel appelle à une vigilance continue. « Gardez-vous de » restitue naturellement en français la force de l’avertissement.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une transition à valeur contrastive vers une mise en garde.
- source_word: δικαιοσύνην
  choice: justice
  rationale: « Justice » est l’équivalent français traditionnel et suffisamment large de δικαιοσύνη ; dans ce contexte, le mot désigne la conduite juste ou les actes qui l’expriment, sans se limiter nécessairement à l’aumône.
- source_word: μὴ ποιεῖν
  choice: de pratiquer
  rationale: Avec « gardez-vous », l’infinitif français exprime clairement l’action à éviter. « Pratiquer votre justice » évoque une conduite religieuse concrète et suivie.
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: devant les gens
  rationale: Le terme désigne les êtres humains en général. « Les gens » est courant, inclusif et naturel dans ce contexte d’observation publique.
- source_word: πρὸς τὸ θεαθῆναι αὐτοῖς
  choice: pour être vus d’eux
  rationale: La construction grecque exprime explicitement le but. Le pluriel « vus » renvoie naturellement aux destinataires sous-entendus par l’impératif pluriel.
- source_word: εἰ δὲ μή γε
  choice: sinon
  rationale: « Sinon » rend de façon concise et idiomatique la conséquence conditionnelle de l’avertissement.
- source_word: μισθὸν
  choice: récompense
  rationale: Dans le cadre de la rétribution divine, « récompense » est plus naturel que « salaire » et n’impose pas une idée de rémunération contractuelle.
- source_word: παρὰ τῷ πατρὶ ὑμῶν
  choice: auprès de votre Père
  rationale: παρά avec le datif indique ici naturellement la sphère ou la présence auprès du Père. « Auprès de » préserve cette nuance sans exclure que le Père soit la source de la récompense.
- source_word: τῷ ἐν τοῖς οὐρανοῖς
  choice: qui est dans les cieux
  rationale: Le pluriel « les cieux » respecte la forme grecque et le style matthéen tout en restant idiomatique en français biblique moderne.
theological_decisions:
- issue: Portée de δικαιοσύνην
  choice: Le texte principal conserve le terme large « justice », compris comme une conduite juste mise en pratique.
  alternative: « vos actes de justice » ; selon une variante textuelle, « votre aumône »
  rationale: Le texte SBLGNT porte δικαιοσύνην, dont la portée est plus large que l’aumône. Le contexte immédiat développe ensuite l’aumône, la prière et le jeûne ; la note préserve donc les lectures plus concrètes sans les imposer au texte principal.
- issue: Sens de παρά avec le datif dans παρὰ τῷ πατρὶ ὑμῶν
  choice: « auprès de votre Père »
  alternative: « de la part de votre Père »
  rationale: La construction peut mettre l’accent sur la présence auprès du Père ou, contextuellement, sur lui comme source de la récompense. « Auprès de » conserve mieux la forme grecque et son ambiguïté réelle.
- issue: Nombre de τοῖς οὐρανοῖς
  choice: « dans les cieux »
  alternative: « au ciel »
  rationale: Le pluriel grec est conservé afin de refléter l’expression caractéristique de Matthieu, sans lui attribuer une construction cosmologique particulière.
translation_notes:
  register: Français international moderne, digne et accessible. « Gardez-vous de » maintient la force solennelle de l’avertissement ; « les gens » évite un masculin faussement restrictif. La ponctuation française emploie une espace avant le point-virgule.
