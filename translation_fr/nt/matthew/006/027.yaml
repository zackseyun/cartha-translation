id: MAT.6.27
reference: Matthew 6:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται προσθεῖναι ἐπὶ τὴν ἡλικίαν αὐτοῦ πῆχυν ἕνα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/027.yaml
  text: And which of you[a], by being anxious, can add one cubit to his stature?
translation:
  language: fr
  text: Et qui parmi vous peut, par son inquiétude, ajouter une seule coudée à la durée de sa vie[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à sa taille ». Le mot grec peut désigner soit l’âge ou la durée de la vie, soit la taille.
    reason: alternative_reading
lexical_decisions:
- source_word: τίς δὲ ἐξ ὑμῶν
  choice: Et qui parmi vous
  rationale: La tournure grecque signifie idiomatiquement « qui parmi vous ». δέ assure ici une liaison légère avec ce qui précède ; « Et » préserve naturellement cette continuité.
- source_word: μεριμνῶν
  choice: par son inquiétude
  rationale: Le participe de μεριμνάω désigne le fait de s’inquiéter. Cette formulation rend sa valeur circonstancielle de moyen et s’accorde avec le contexte immédiat.
- source_word: δύναται προσθεῖναι
  choice: peut […] ajouter
  rationale: Cette expression traduit directement l’idée de capacité exprimée par δύναμαι et l’action d’ajouter ou d’accroître exprimée par προστίθημι.
- source_word: ἐπὶ τὴν ἡλικίαν αὐτοῦ
  choice: à la durée de sa vie
  rationale: ἡλικία peut désigner l’âge ou la durée de la vie, mais aussi la taille. Dans le contexte de l’inquiétude concernant la vie, « durée de sa vie » offre un sens cohérent sans supprimer l’autre possibilité, signalée en note.
- source_word: πῆχυν ἕνα
  choice: une seule coudée
  rationale: πῆχυς est une mesure de longueur appelée « coudée ». La conserver maintient l’image concrète et volontairement frappante du grec ; ἕνα est rendu par « une seule ».
- source_word: αὐτοῦ
  choice: sa
  rationale: Le pronom masculin singulier grec a ici une valeur représentative. En français, le possessif « sa » s’accorde grammaticalement avec « vie » tout en renvoyant naturellement à chaque personne interrogée.
theological_decisions:
- issue: Sens de ἡλικία dans cette parole
  choice: durée de sa vie
  alternative: taille
  rationale: Le sens « durée de la vie » s’intègre bien à l’enseignement sur l’inquiétude et la préservation de la vie. Toutefois, « taille » demeure lexicalement possible, notamment avec la mesure « coudée » ; cette ambiguïté réelle est donc explicitement conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique reste directe, et l’image ancienne de la coudée est conservée plutôt que convertie en unité moderne.
