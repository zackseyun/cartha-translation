  text: Οὕτως οὖν προσεύχεσθε ὑμεῖς· Πάτερ ἡμῶν ὁ ἐν τοῖς οὐρανοῖς· ἁγιασθήτω τὸ ὄνομά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/009.yaml
  text: 'Therefore[a], you should pray like this: Our Father in the heavens, may your name be treated as holy[b],'
translation:
  language: fr
  text: 'Priez donc ainsi : « Notre Père qui es dans les cieux[a], que ton nom soit reconnu comme saint[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « au ciel ». Le grec porte le pluriel : « dans les cieux ».'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « que ton nom soit sanctifié ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: ainsi
  rationale: Introduit la manière ou le modèle de prière. « Ainsi » est naturel en français moderne et conserve la force directive de l’expression grecque.
- source_word: οὖν
  choice: donc
  rationale: Marque le lien logique avec l’enseignement précédent. Sa place après l’impératif est idiomatique en français.
- source_word: προσεύχεσθε ὑμεῖς
  choice: Priez
  rationale: L’impératif présent à la deuxième personne du pluriel est rendu directement. Le français exprime déjà le sujet « vous » dans la forme verbale; ajouter « vous » alourdirait la phrase, sauf contraste explicite.
- source_word: Πάτερ ἡμῶν
  choice: Notre Père
  rationale: Rend naturellement le vocatif et conserve la dimension communautaire du possessif pluriel.
- source_word: ὁ ἐν τοῖς οὐρανοῖς
  choice: qui es dans les cieux
  rationale: La proposition relative explicite naturellement en français la construction grecque, et « les cieux » conserve le pluriel du texte source.
- source_word: ἁγιασθήτω
  choice: que … soit reconnu comme saint
  rationale: 'Rend l’impératif passif employé comme demande : il est demandé que le nom de Dieu soit tenu et honoré comme saint. Cette formulation actuelle évite de laisser entendre que son nom manquerait en lui-même de sainteté.'
- source_word: τὸ ὄνομά σου
  choice: ton nom
  rationale: Traduction directe qui conserve le terme « nom », avec ses résonances possibles de réputation, de caractère révélé et de personne, sans les expliciter dans le texte.
theological_decisions:
- issue: Adresse à Dieu comme Père et mention de sa demeure transcendante
  choice: Notre Père qui es dans les cieux
  alternative: Notre Père qui es au ciel
  rationale: Le grec emploie le pluriel τοῖς οὐρανοῖς. Le conserver maintient la forme du texte source et associe l’intimité de « Père » à la transcendance divine sans reformulation doctrinale supplémentaire.
- issue: Sens de la demande ἁγιασθήτω τὸ ὄνομά σου
  choice: que ton nom soit reconnu comme saint
  alternative: que ton nom soit sanctifié
  rationale: La formulation retenue exprime clairement la demande que le nom de Dieu soit considéré et honoré comme saint. « Soit sanctifié » est fidèle et traditionnel, mais peut être moins transparent ou suggérer à tort que le nom doit devenir saint.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit l’adresse traditionnelle et naturelle à Dieu dans la prière chrétienne francophone. La structure reste proche du grec tout en évitant une syntaxe artificielle.
