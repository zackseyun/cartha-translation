id: MAT.6.20
reference: Matthew 6:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: θησαυρίζετε δὲ ὑμῖν θησαυροὺς ἐν οὐρανῷ, ὅπου οὔτε σὴς οὔτε βρῶσις ἀφανίζει, καὶ ὅπου κλέπται οὐ διορύσσουσιν οὐδὲ κλέπτουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/020.yaml
  text: But store up for yourselves treasures in heaven[a], where neither moth nor decay destroys[b], and where thieves do not break in and steal.
translation:
  language: fr
  text: Mais amassez-vous des trésors dans le ciel, où ni les mites ni ce qui ronge[a] ne les détruisent, et où les voleurs ne s’introduisent pas par effraction[b] et ne volent pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la rouille ». Le mot grec peut désigner plus largement ce qui consume, ronge ou détériore.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « ne creusent pas à travers ». Il s’agit probablement de voleurs qui percent le mur d’une maison pour y entrer.
    reason: cultural_note
lexical_decisions:
- source_word: θησαυρίζετε
  choice: amassez
  rationale: L’impératif présent appelle à une pratique continue. « Amasser » est naturel en français et conserve l’image d’une accumulation de biens précieux.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec l’interdiction formulée au verset précédent.
- source_word: ὑμῖν
  choice: pour vous-mêmes
  rationale: Le datif exprime l’intérêt personnel des destinataires; la tournure française est rendue idiomatiquement par le pronom dans « amassez-vous ».
- source_word: θησαυροὺς
  choice: des trésors
  rationale: Le pluriel grec est conservé ainsi que le motif du trésor repris dans le contexte.
- source_word: ἐν οὐρανῷ
  choice: dans le ciel
  rationale: Rendu locatif direct et idiomatique du singulier grec, sans développer la métaphore.
- source_word: σὴς
  choice: les mites
  rationale: Le terme désigne les insectes qui détruisent notamment les vêtements entreposés.
- source_word: βρῶσις
  choice: ce qui ronge
  rationale: Cette formulation conserve le sens large de consommation ou de détérioration sans réduire le mot à la seule rouille des métaux.
- source_word: ἀφανίζει
  choice: détruisent
  rationale: Le verbe indique le fait de faire disparaître ou de ruiner; « détruire » convient aux deux sujets et reste clair.
- source_word: κλέπται
  choice: les voleurs
  rationale: Équivalent français direct du nom grec au pluriel.
- source_word: διορύσσουσιν
  choice: s’introduisent par effraction
  rationale: Formulation française actuelle qui exprime naturellement l’entrée forcée; l’image littérale du percement des murs est signalée en note.
- source_word: κλέπτουσιν
  choice: volent
  rationale: Équivalent simple et direct du verbe grec.
theological_decisions:
- issue: Nature des « trésors dans le ciel »
  choice: Maintien de la métaphore « des trésors dans le ciel »
  alternative: « des récompenses célestes » ou « des richesses spirituelles »
  rationale: Le texte ne précise pas la nature de ces trésors. Conserver la métaphore évite d’imposer une doctrine particulière du mérite ou des récompenses.
- issue: Portée de βρῶσις dans le contraste avec les trésors célestes
  choice: « ce qui ronge »
  alternative: « la rouille », « la corrosion » ou « la détérioration »
  rationale: Le choix garde ouverte la portée du terme grec, qui évoque ce qui mange ou consume, et préserve le contraste entre les biens périssables et les trésors célestes.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la métaphore centrale et la répétition des actions, tout en rendant idiomatiquement l’effraction et en plaçant chaque appel de note sur l’expression correspondante.
