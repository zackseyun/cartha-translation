  rationale: La révision conserve la portée générale et récurrente de « Quand vous jeûnez », la nuance dynamique de l'injonction et le registre solennel de « Amen, je vous le dis ». Elle rend plus naturellement l'altération ostentatoire du visage et préserve la focalisation grecque sur le fait d'être vus en train de jeûner. Aucun renvoi de note n'est requis.
