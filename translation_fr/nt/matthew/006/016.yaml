  source_fidelity: 'Révision légère nécessaire : « pour montrer aux gens » explicite correctement l''intention, mais la construction grecque dit plus précisément qu''ils cherchent à être vus des autres comme jeûnant. « Ils défigurent leur visage » est également moins idiomatique et peut évoquer une mutilation physique, plutôt que l''altération ostentatoire de l''apparence visée ici.'
  naturalness: Le français est globalement clair et digne. « Ils se donnent un air défait » est plus naturel dans ce contexte, et « ils ont reçu toute leur récompense » rend plus idiomatiquement la notion de paiement intégral.
  terminology: « Jeûnez », « hypocrites », « Amen » et « récompense » conviennent au registre biblique moderne. « Les autres » rend naturellement τοῖς ἀνθρώποις dans son sens générique, sans marquage de genre indu.
  issues:
  - severity: medium
    issue: « ils défigurent leur visage »
    rationale: La formule est grammaticalement possible, mais elle est peu naturelle et peut suggérer une défiguration corporelle. Le grec décrit l'apparence volontairement rendue sombre ou négligée pour afficher le jeûne.
  - severity: low
    issue: « pour montrer aux gens qu’ils jeûnent »
    rationale: Cette formulation rend l'intention, mais elle déplace légèrement l'expression grecque, qui met l'accent sur le fait d'être vus par les autres comme jeûnant. « afin qu’on les voie jeûner » conserve plus directement cette construction.
  - severity: low
    issue: « leur récompense en entier »
    rationale: Le sens est juste, mais « toute leur récompense » est plus idiomatique en français et exprime clairement l'idée de réception complète portée par ἀπέχουσιν.
