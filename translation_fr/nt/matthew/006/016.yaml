source:
  edition: SBLGNT
  text: Ὅταν δὲ νηστεύητε, μὴ γίνεσθε ⸀ὡς οἱ ὑποκριταὶ σκυθρωποί, ἀφανίζουσιν γὰρ τὰ πρόσωπα αὐτῶν ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/016.yaml
  text: And whenever you fast[a], do not become gloomy like the hypocrites, for they disfigure their faces so that they may appear to people to be fasting. Truly I say to you, they have received their reward in full.
translation:
  language: fr
  text: Quand vous jeûnez, ne prenez pas un air sombre comme les hypocrites, car ils se donnent un air défait afin qu’on les voie jeûner. Amen, je vous le dis, ils ont reçu toute leur récompense.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅταν δὲ νηστεύητε
  choice: Quand vous jeûnez
  rationale: La conjonction temporelle avec le subjonctif présente une pratique récurrente. En français, « quand » exprime naturellement cette valeur générale; δέ assure ici une transition souple avec les enseignements précédents.
- source_word: μὴ γίνεσθε ... σκυθρωποί
  choice: ne prenez pas un air sombre
  rationale: Cette formulation française naturelle conserve la nuance dynamique de γίνεσθε et rattache clairement σκυθρωποί à l’expression visible qu’ils adoptent.
- source_word: ὡς οἱ ὑποκριταί
  choice: comme les hypocrites
  rationale: Rend directement la comparaison, dans un registre courant et digne.
- source_word: ἀφανίζουσιν ... τὰ πρόσωπα αὐτῶν
  choice: ils défigurent leur visage
  rationale: « Défigurent » préserve l’image forte du verbe, qui désigne ici une altération volontaire de l’apparence; le singulier distributif « leur visage » est idiomatique en français.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις νηστεύοντες
  choice: pour montrer aux gens qu’ils jeûnent
  rationale: Rend le but et le caractère public de la mise en scène. « Aux gens » exprime naturellement la portée générique de ἀνθρώποις; « montrer » traduit ici la valeur contextuelle de « paraître visiblement » sans suggérer que le jeûne serait fictif.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, je vous le dis
  rationale: Conserve le terme sémitique solennel ἀμήν et rend la formule d’autorité dans un français clair.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: ils ont reçu leur récompense en entier
  rationale: Le verbe relève d’un idiome commercial indiquant que le paiement a été intégralement reçu et qu’aucune autre créance ne subsiste.
theological_decisions:
- issue: Portée de τοῖς ἀνθρώποις
  choice: aux gens
  alternative: aux hommes
  rationale: Le pluriel ἄνθρωποι désigne ici les êtres humains en général, non les hommes de sexe masculin. « Aux gens » conserve cette portée sans ajouter de distinction de genre.
- issue: Force idiomatique de ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: ils ont reçu leur récompense en entier
  alternative: ils ont leur récompense
  rationale: La traduction explicite la notion de règlement complet portée par ἀπέχω, essentielle au contraste implicite entre reconnaissance humaine immédiate et récompense ultérieure.
- issue: Nature du jeûne des hypocrites
  choice: montrer aux gens qu’ils jeûnent
  alternative: paraître aux gens en train de jeûner
  rationale: Le texte critique leur ostentation, mais ne dit pas explicitement que leur jeûne est faux. La formulation retenue préserve cette tension et n’accuse pas les hypocrites de seulement feindre le jeûne.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « prendre un air sombre » restitue naturellement l’expression faciale affectée. « Amen, je vous le dis » conserve la solennité distinctive de la formule de Jésus.
