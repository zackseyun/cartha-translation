  text: καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν, ἀλλὰ ῥῦσαι ἡμᾶς ἀπὸ τοῦ ⸀πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/013.yaml
  text: And do not lead us into temptation[b][a], but deliver us from evil.
translation:
  language: fr
  text: Et ne nous conduis pas dans la tentation[a], mais délivre-nous du Mauvais[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’épreuve » ou « dans la mise à l’épreuve ». Le mot grec peut désigner une tentation ou une épreuve.
    reason: lexical_alternative
  - marker: b
    text: Ou « du mal ». L’expression grecque peut désigner soit personnellement « le Mauvais », soit impersonnellement « le mal ».
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εἰσενέγκῃς
  choice: ne nous conduis pas
  rationale: Cette formulation rend directement la demande exprimée par μή avec le subjonctif aoriste, sans l'interpréter par une paraphrase telle que « ne permets pas que nous soyons conduits ».
- source_word: πειρασμόν
  choice: tentation
  rationale: « Tentation » est naturel et bien établi dans ce contexte, tandis qu'une note conserve les sens possibles d'épreuve et de mise à l'épreuve.
- source_word: ῥῦσαι
  choice: délivre-nous
  rationale: Le verbe exprime un secours actif. « Délivre-nous » convient au registre digne d'une prière et demeure courant.
- source_word: τοῦ πονηροῦ
  choice: du Mauvais
  rationale: La forme grecque avec l'article peut être masculine (« le Mauvais ») ou neutre (« le mal »). Le texte principal retient le sens personnel tout en signalant l'autre possibilité en note.
theological_decisions:
- issue: Sens de τοῦ πονηροῦ
  choice: du Mauvais
  alternative: du mal
  rationale: Le grec présente une ambiguïté réelle entre une désignation personnelle de l'adversaire et le mal compris impersonnellement. Le sens personnel est retenu dans le texte, mais la note préserve explicitement l'autre lecture sans trancher absolument.
- issue: Portée de πειρασμός
  choice: tentation
  alternative: épreuve ou mise à l'épreuve
  rationale: Le terme peut désigner aussi bien l'incitation au péché qu'une situation éprouvante. La traduction principale reste idiomatique, tandis que la note maintient cette amplitude sémantique.
translation_notes:
  register: Français international moderne, naturel et digne. La cadence traditionnelle de la prière est conservée sans tournure archaïque; les ambiguïtés lexicales et théologiques du grec sont maintenues au moyen de notes.
