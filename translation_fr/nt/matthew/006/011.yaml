  variant: modern international French
source:
  edition: SBLGNT
  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δὸς ἡμῖν σήμερον·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/011.yaml
  text: Give us today our daily bread[a].
translation:
  language: fr
  text: Donne-nous aujourd’hui notre pain quotidien[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le pain qu’il nous faut pour aujourd’hui », « notre pain pour le jour qui vient » ou « le pain dont nous avons besoin ». L’adjectif grec ἐπιούσιον est rare, et son sens précis fait débat.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: pain
  rationale: Ἄρτος désigne littéralement le pain et peut, par extension, évoquer la nourriture ou la subsistance. Le terme concret « pain » doit être conservé dans le texte principal.
- source_word: ἡμῶν
  choice: notre
  rationale: Génitif possessif qui détermine « pain » ; « notre » en est l’équivalent français direct et naturel.
- source_word: ἐπιούσιον
  choice: quotidien
  rationale: Cet adjectif grec très rare est de sens discuté. « Quotidien » est la formulation française la mieux établie dans cette prière et exprime clairement la dépendance jour après jour, sans exclure les autres interprétations signalées en note.
- source_word: δὸς
  choice: Donne
  rationale: L’impératif aoriste de δίδωμι appelle une demande directe. « Donne » est naturel, simple et fidèle ; « accorde » serait moins concret.
- source_word: ἡμῖν
  choice: nous
  rationale: Pronom au datif indiquant les bénéficiaires du don ; il se rend directement par « nous ».
- source_word: σήμερον
  choice: aujourd’hui
  rationale: Σήμερον signifie « aujourd’hui ». Cette formulation actuelle conserve clairement la portée temporelle du grec.
theological_decisions:
- issue: Sens de ἐπιούσιον dans la prière du Seigneur
  choice: quotidien
  alternative: pour aujourd’hui ; pour le jour qui vient ; nécessaire à notre subsistance
  rationale: 'Le sens précis de ἐπιούσιος demeure incertain : le mot peut désigner le pain du jour présent, celui du jour à venir ou le pain nécessaire à la vie. « Quotidien » convient au texte principal par son caractère naturel et traditionnel, tandis que la note préserve l’ambiguïté réelle sans imposer une reconstruction particulière.'
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve l’image concrète du pain et la cadence brève d’une prière collective. « Aujourd’hui » est préféré à « en ce jour », moins courant, et la note rend compte de l’incertitude lexicale sans alourdir le verset.
