id: MAT.6.8
reference: Matthew 6:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ οὖν ὁμοιωθῆτε αὐτοῖς, οἶδεν γὰρ ⸀ὁ πατὴρ ὑμῶν ὧν χρείαν ἔχετε πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/008.yaml
  text: Therefore[a], do not become like them, for your Father knows what you need before you ask him.
translation:
  language: fr
  text: Ne devenez donc pas comme eux[a], car votre Père sait ce dont vous avez besoin avant que vous le lui demandiez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne soyez donc pas comme eux. » Plus littéralement, la forme grecque est passive : « Ne soyez pas rendus semblables à eux. »'
    reason: alternative lexicale et précision grammaticale
lexical_decisions:
- source_word: μὴ οὖν
  choice: Ne… donc pas
  rationale: La négation prohibitive μή et la conjonction déductive οὖν sont rendues naturellement en français tout en maintenant le lien logique avec l’avertissement précédent.
- source_word: ὁμοιωθῆτε
  choice: devenez… comme
  rationale: Cette formulation naturelle exprime l’idée d’adopter leur manière d’agir. Elle convient à l’interdiction à l’aoriste subjonctif passif sans imposer au français une tournure passive pesante.
- source_word: αὐτοῖς
  choice: eux
  rationale: Le pronom renvoie aux païens mentionnés dans le contexte immédiat ; il n’est pas nécessaire d’expliciter davantage le référent.
- source_word: οἶδεν
  choice: sait
  rationale: Bien que οἶδα ait historiquement une forme de parfait, il a ici le sens présent courant de « savoir ».
- source_word: ὁ πατὴρ ὑμῶν
  choice: votre Père
  rationale: Le grec dit simplement « votre Père ». L’ajout de « céleste » aurait importé un élément absent de ce verset.
- source_word: ὧν χρείαν ἔχετε
  choice: ce dont vous avez besoin
  rationale: Cette tournure idiomatique et précise exprime le contenu des besoins des disciples.
- source_word: πρὸ τοῦ ὑμᾶς αἰτῆσαι αὐτόν
  choice: avant que vous le lui demandiez
  rationale: « Avant que » marque clairement l’antériorité. Le pronom « le » reprend ce dont les disciples ont besoin, et « lui » désigne le Père, conformément à la syntaxe naturelle du verbe français « demander ».
theological_decisions:
- issue: La connaissance préalable de Dieu en rapport avec la prière
  choice: Affirmer simplement que le Père connaît les besoins des disciples avant leur demande.
  alternative: Ajouter une explication selon laquelle la prière serait relationnelle plutôt qu’informative, ou formuler le verset de manière à soutenir explicitement une doctrine particulière de la prescience divine.
  rationale: Le texte affirme la connaissance préalable du Père sans expliquer pourquoi la prière demeure nécessaire. La traduction conserve cette tension théologique sans la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. « Ne devenez donc pas comme eux » reste accessible tout en conservant l’idée d’une conformité à leur conduite ; la note signale l’ambiguïté de la forme passive grecque.
