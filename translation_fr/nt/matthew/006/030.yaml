id: MAT.6.30
reference: Matthew 6:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ τὸν χόρτον τοῦ ἀγροῦ σήμερον ὄντα καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ἀμφιέννυσιν, οὐ πολλῷ μᾶλλον ὑμᾶς, ὀλιγόπιστοι;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/030.yaml
  text: But if God so clothes the grass of the field[a], which is here today and tomorrow is thrown into an oven, will he not much more clothe you[b], you of little faith?
translation:
  language: fr
  text: Mais si Dieu revêt ainsi l’herbe des champs, qui est là aujourd’hui et qui demain sera jetée dans un four[a], ne vous revêtira-t-il pas à bien plus forte raison, vous qui avez peu de foi[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « four » est un four servant notamment à cuire le pain ; de l’herbe sèche et d’autres plantes des champs pouvaient être utilisées comme combustible.
    reason: cultural_note
  - marker: b
    text: 'Ou : « gens de peu de foi ». Le grec emploie ici un vocatif direct qui reproche aux auditeurs leur manque de confiance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: δέ marque ici une légère opposition ou une progression dans l’argument. « Mais si » restitue naturellement cette transition.
- source_word: τὸν χόρτον τοῦ ἀγροῦ
  choice: l’herbe des champs
  rationale: χόρτος désigne l’herbe ou la végétation herbacée. Cette formulation naturelle conserve l’image d’une végétation sauvage et éphémère sans préciser indûment qu’il s’agit de fleurs.
- source_word: σήμερον ὄντα
  choice: qui est là aujourd’hui
  rationale: Le participe ὄντα signifie littéralement « étant ». « Qui est là aujourd’hui » exprime idiomatiquement son existence présente et passagère sans ajouter l’idée d’être vivant.
- source_word: αὔριον εἰς κλίβανον βαλλόμενον
  choice: qui demain sera jetée dans un four
  rationale: κλίβανος désigne ici un four, vraisemblablement un four à pain, plutôt qu’une fournaise métallurgique. Le futur français rend naturellement l’opposition entre « aujourd’hui » et « demain » portée par le participe passif.
- source_word: οὕτως ἀμφιέννυσιν
  choice: revêt ainsi
  rationale: ἀμφιέννυμι signifie habiller ou revêtir. « Revêt » est clair et digne, et convient à l’image de la végétation parée par Dieu sans accentuer excessivement l’ornement.
- source_word: οὐ πολλῷ μᾶλλον
  choice: ne… pas à bien plus forte raison
  rationale: Cette tournure française exprime clairement l’argument du moindre au plus grand et conserve la force de la question rhétorique.
- source_word: ὑμᾶς
  choice: vous revêtira
  rationale: ὑμᾶς est l’objet du verbe sous-entendu repris de la proposition précédente. La répétition de « revêtira » est nécessaire à la clarté en français.
- source_word: ὀλιγόπιστοι
  choice: vous qui avez peu de foi
  rationale: Le vocatif pluriel interpelle directement les auditeurs et leur reproche une confiance insuffisante. Cette formulation moderne conserve la réprimande sans employer une tournure archaïque.
theological_decisions:
- issue: Argument relatif à la sollicitude divine, du moindre au plus grand
  choice: Conserver une question rhétorique affirmant que Dieu prendra à plus forte raison soin des disciples.
  alternative: Transformer la question en affirmation déclarative.
  rationale: La syntaxe grecque et le vocatif final soutiennent une question rhétorique. Cette forme préserve la force de l’exhortation de Jésus sans ajouter de précision doctrinale.
- issue: Portée de ὀλιγόπιστοι
  choice: Traduire par « vous qui avez peu de foi », comme un reproche portant sur l’insuffisance de leur confiance.
  alternative: Traduire par une expression pouvant signifier qu’ils sont totalement dépourvus de foi.
  rationale: L’adjectif composé indique une foi faible ou insuffisante dans la situation évoquée, non nécessairement une absence absolue de foi.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « revêt » maintient le lien verbal de l’argument, tandis que « à bien plus forte raison » restitue clairement le raisonnement du moindre au plus grand.
