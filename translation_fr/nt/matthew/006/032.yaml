source:
  edition: SBLGNT
  text: πάντα γὰρ ταῦτα τὰ ἔθνη ⸀ἐπιζητοῦσιν· οἶδεν γὰρ ὁ πατὴρ ὑμῶν ὁ οὐράνιος ὅτι χρῄζετε τούτων ἁπάντων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/032.yaml
  text: For the Gentiles eagerly seek all these things; for your heavenly Father knows that you need all these things.
translation:
  language: fr
  text: Car les non-Juifs[a] recherchent toutes ces choses ; votre Père céleste sait, en effet, que vous avez besoin de toutes ces choses.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nations » ou « les païens ». Le terme grec peut désigner les nations en général, mais il renvoie probablement ici aux personnes extérieures au peuple de l’alliance.
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: les non-Juifs
  rationale: Dans ce contexte, le terme désigne les peuples autres qu’Israël, en contraste avec les disciples. « Les non-Juifs » exprime clairement cette distinction historique sans la connotation péjorative que peut prendre « les païens ».
- source_word: ἐπιζητοῦσιν
  choice: recherchent ardemment
  rationale: Le verbe ἐπιζητέω peut exprimer une recherche soutenue ou insistante. Cette formulation en restitue la force tout en restant naturelle en français.
- source_word: ὁ πατὴρ ὑμῶν ὁ οὐράνιος
  choice: votre Père céleste
  rationale: Formulation française naturelle qui conserve à la fois le possessif et la qualification céleste.
- source_word: οἶδεν
  choice: sait
  rationale: Bien que la forme grecque soit historiquement un parfait, οἶδα a ici une valeur de présent.
- source_word: χρῄζετε
  choice: vous avez besoin de
  rationale: Rendu idiomatique et exact en français moderne.
- source_word: πάντα γὰρ ταῦτα ... τούτων ἁπάντων
  choice: toutes ces choses ... toutes ces choses
  rationale: La répétition du grec est maintenue, car elle souligne que le Père connaît l’ensemble des besoins évoqués.
- source_word: γὰρ ... γὰρ
  choice: car ... en effet
  rationale: Les deux articulations explicatives sont conservées, avec une légère variation idiomatique afin d’éviter une répétition pesante en français.
theological_decisions:
- issue: Référent de τὰ ἔθνη dans l’enseignement de Jésus
  choice: les non-Juifs
  alternative: les nations ; les païens
  rationale: Le contexte établit une distinction entre les disciples et ceux qui sont extérieurs au peuple de l’alliance. « Les non-Juifs » préserve cette distinction sans transformer le verset en jugement moral absolu ni accentuer artificiellement l’opposition religieuse.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation rend les deux propositions explicatives du grec. « Père » prend la majuscule comme désignation de Dieu.
