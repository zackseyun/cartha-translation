source:
  edition: SBLGNT
  text: σοῦ δὲ ποιοῦντος ἐλεημοσύνην μὴ γνώτω ἡ ἀριστερά σου τί ποιεῖ ἡ δεξιά σου,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/003.yaml
  text: But when you give to the needy[a], do not let your left hand know what your right hand is doing,
translation:
  language: fr
  text: Mais toi, quand tu fais l’aumône[a], que ta main gauche ne sache pas ce que fait ta main droite,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand tu fais un don aux pauvres »; le terme grec désigne l’aide charitable apportée aux personnes dans le besoin.
    reason: lexical_alternative
lexical_decisions:
- source_word: σοῦ δὲ ποιοῦντος
  choice: Mais toi, quand tu fais
  rationale: Le génitif absolu avec δέ marque le contraste avec l’instruction précédente. « Mais toi, quand tu fais » conserve cette opposition et l’accent porté sur le destinataire, tout en restant naturel en français.
- source_word: ἐλεημοσύνην
  choice: l’aumône
  rationale: Le terme grec désigne ici le don charitable destiné aux pauvres. « Faire l’aumône » est une expression française précise et idiomatique; une note explicite son sens pour éviter une compréhension trop étroite ou vieillie.
- source_word: μὴ γνώτω
  choice: que … ne sache pas
  rationale: Cette tournure rend naturellement l’impératif grec à la troisième personne et préserve la personnification frappante des mains.
- source_word: ἡ ἀριστερά σου
  choice: ta main gauche
  rationale: La traduction directe conserve l’image, le parallélisme et la force mémorable de la parole.
- source_word: τί ποιεῖ ἡ δεξιά σου
  choice: ce que fait ta main droite
  rationale: Le présent français convient à la maxime et rend clairement l’action simultanée sans alourdir la phrase.
theological_decisions:
- issue: Sens de l’image de la main gauche et de la main droite
  choice: Conserver sans l’expliquer dans le corps du texte l’image hyperbolique qui appelle à une générosité exempte d’ostentation.
  alternative: Transformer l’image en précepte général d’humilité, ou en interdiction absolue de toute aide visible.
  rationale: Le grec formule une image vive plutôt qu’une règle abstraite. La conserver respecte sa force rhétorique et évite de trancher au-delà de ce que dit le verset.
translation_notes:
  register: Français moderne, digne et accessible. « Faire l’aumône » maintient la formulation concrète du grec, tandis que la note en précise le sens actuel. Le tutoiement correspond au singulier σοῦ et à l’adresse directe.
