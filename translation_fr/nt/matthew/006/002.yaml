id: MAT.6.2
reference: Matthew 6:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅταν οὖν ποιῇς ἐλεημοσύνην, μὴ σαλπίσῃς ἔμπροσθέν σου, ὥσπερ οἱ ὑποκριταὶ ποιοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς ῥύμαις, ὅπως δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων· ἀμὴν λέγω ὑμῖν, ἀπέχουσιν τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/002.yaml
  text: Therefore[a], whenever you give alms, do not sound a trumpet before you, as the hypocrites do in the synagogues and in the streets, so that they may be glorified by people. Truly I say to you[e][d][c][b], they have received their reward in full.
translation:
  language: fr
  text: Donc, quand tu fais l’aumône[a], ne sonne pas de la trompette devant toi[b], comme le font les hypocrites dans les synagogues et dans les rues, afin d’être glorifiés par les gens[c]. Amen, je vous le dis, ils ont déjà reçu toute leur récompense[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand tu donnes aux personnes dans le besoin » ou « quand tu accomplis un acte de compassion ». L’expression grecque désigne le don charitable.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne fais pas annoncer ton geste au son de la trompette ». Le grec dit littéralement « ne sonne pas de la trompette devant toi » ; l’image peut être comprise comme une hyperbole ou une métaphore.
    reason: lexical_alternative
  - marker: c
    text: Ou « afin d’être loués » ou « honorés par les gens ». Le verbe grec signifie littéralement « être glorifiés ».
    reason: lexical_alternative
  - marker: d
    text: 'L’expression traduit un idiome commercial : ils ont déjà reçu la totalité de leur récompense.'
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν οὖν
  choice: Ainsi, quand
  rationale: « Quand » introduit naturellement en français une situation générale ou répétée, tandis que « ainsi » maintient le lien logique avec l’enseignement précédent sans alourdir la phrase.
- source_word: ποιῇς ἐλεημοσύνην
  choice: tu fais l’aumône
  rationale: Cette expression française courante correspond à l’idiome grec désignant un don charitable fait aux personnes dans le besoin.
- source_word: μὴ σαλπίσῃς ἔμπροσθέν σου
  choice: ne sonne pas de la trompette devant toi
  rationale: La formulation conserve l’image explicite et frappante de la trompette ainsi que le sens spatial de ἔμπροσθέν σου, sans décider si l’image est littérale, métaphorique ou hyperbolique.
- source_word: ὑποκριταὶ
  choice: hypocrites
  rationale: Terme français établi et approprié pour des personnes qui affichent leur piété afin d’être vues.
- source_word: συναγωγαῖς καὶ ῥύμαις
  choice: synagogues et rues
  rationale: « Synagogues » désigne précisément le cadre juif, et « rues » rend naturellement les lieux publics évoqués par ῥύμαις.
- source_word: δοξασθῶσιν ὑπὸ τῶν ἀνθρώπων
  choice: être glorifiés par les gens
  rationale: « Glorifiés » conserve la force de δοξάζω, tandis que « les gens » exprime ici la portée générique de ἀνθρώπων.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, je vous le dis
  rationale: Cette formulation garde le mot solennel ἀμήν et la déclaration directe de Jésus. Le passage du « tu » au « vous » reproduit le changement du singulier au pluriel dans le grec.
- source_word: ἀπέχουσιν τὸν μισθὸν αὐτῶν
  choice: ils ont reçu leur récompense en entier
  rationale: Le parfait français et « en entier » rendent l’idiome commercial indiquant que la récompense a déjà été intégralement perçue.
theological_decisions:
- issue: Portée de ἀνθρώπων
  choice: les gens
  alternative: les hommes ; les autres
  rationale: Le terme grec vise les observateurs humains en général, et non exclusivement les personnes de sexe masculin.
- issue: Force de δοξασθῶσιν
  choice: être glorifiés
  alternative: être loués ; être honorés
  rationale: Le choix conserve la force rhétorique du verbe grec et la tension entre la gloire accordée par les humains et la récompense divine évoquée dans le contexte.
- issue: Caractère épuisé de la récompense
  choice: ont reçu leur récompense en entier
  alternative: ont leur récompense
  rationale: L’idiome ἀπέχουσιν indique qu’ils ont déjà obtenu intégralement la récompense recherchée, sans ajouter explicitement une conclusion doctrinale sur tout autre jugement ou toute autre récompense.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement au singulier dans l’instruction personnelle, puis le pluriel dans « je vous le dis », suivent les nombres grammaticaux du grec. « Faire l’aumône » reste courant et compréhensible, avec une note explicitant son sens. L’image de la trompette et le verbe fort « glorifier » sont conservés afin de ne pas aplanir la rhétorique du texte.
