  text: Προσευχόμενοι δὲ μὴ βατταλογήσητε ὥσπερ οἱ ἐθνικοί, δοκοῦσιν γὰρ ὅτι ἐν τῇ πολυλογίᾳ αὐτῶν εἰσακουσθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/007.yaml
  text: And when you pray[a], do not heap up empty words like the Gentiles[b], for they think that they will be heard because of their many words.
translation:
  language: fr
  text: Quand vous priez, ne multipliez pas les paroles vides[a], comme les non-Juifs[b], car ils pensent qu’ils seront entendus grâce à leurs nombreuses paroles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne rabâchez pas » ou « ne bavardez pas ». Le verbe grec, rare, évoque probablement un flot de paroles creuses, mécaniques ou excessivement abondantes, plutôt que toute répétition sincère dans la prière.
    reason: lexical_alternative
  - marker: b
    text: Ou « comme les païens » ou « comme les gens des autres nations ». Le terme grec désigne ici les personnes des nations autres qu’Israël, c’est-à-dire les non-Juifs dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσευχόμενοι δὲ
  choice: Quand vous priez
  rationale: Le participe a une valeur circonstancielle et introduit naturellement la situation dans laquelle s’applique l’interdiction. En français, « Quand vous priez » est clair et idiomatique; δέ assure ici la continuité du discours sans exiger un connecteur explicite.
- source_word: μὴ βατταλογήσητε
  choice: ne débitez pas de paroles vides
  rationale: Le verbe rare βατταλογέω évoque vraisemblablement un flot de paroles creuses, mécanique ou verbeux. Cette formulation conserve à la fois l’idée d’abondance verbale et celle d’absence de contenu, sans condamner toute répétition sincère dans la prière.
- source_word: ὥσπερ οἱ ἐθνικοί
  choice: comme les non-Juifs
  rationale: Dans ce contexte juif, ἐθνικοί désigne les personnes appartenant aux nations autres qu’Israël. « Non-Juifs » rend ce référent de manière immédiatement compréhensible en français moderne, tandis que la note signale l’alternative traditionnelle et l’interprétation religieuse possible.
- source_word: δοκοῦσιν
  choice: ils pensent
  rationale: Le verbe exprime ici leur conviction ou supposition; « ils pensent » est naturel et précis.
- source_word: ἐν τῇ πολυλογίᾳ αὐτῶν
  choice: à force de parler
  rationale: πολυλογία désigne l’abondance de paroles ou la prolixité. « À force de parler » exprime naturellement en français le moyen ou le fondement supposé de l’efficacité de leur prière.
- source_word: εἰσακουσθήσονται
  choice: ils seront entendus
  rationale: Le passif signifie obtenir une écoute favorable. « Seront entendus » conserve cette formulation sans préciser davantage qu’ils recevraient nécessairement la réponse désirée.
theological_decisions:
- issue: Jésus interdit-il toute répétition dans la prière ou les paroles creuses et prolixes?
  choice: Le texte vise un flot de paroles vides employé comme moyen d’obtenir l’écoute divine.
  alternative: « Ne répétez pas sans cesse les mêmes paroles » ou « ne rabâchez pas » pourrait être compris comme une interdiction générale de toute répétition.
  rationale: Le verbe grec est rare et son sens exact demeure discuté. La traduction retient les notions plausibles de verbosité et de vacuité, tout en évitant d’affirmer que toute prière répétée serait condamnée.
translation_notes:
  register: Français international moderne, digne et accessible. « Débiter des paroles vides » est plus naturel que des calques tels que « multiplier de vaines paroles » et garde la nuance d’un discours abondant mais creux. La phrase reste concise et adaptée au registre d’un enseignement direct.
