id: MAT.6.31
reference: Matthew 6:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ οὖν μεριμνήσητε λέγοντες· Τί φάγωμεν; ἤ· Τί πίωμεν; ἤ· Τί περιβαλώμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/031.yaml
  text: Therefore do not worry[a], saying, ‘What will we eat?’ or ‘What will we drink?’ or ‘What will we wear?’
translation:
  language: fr
  text: 'Ne vous inquiétez donc pas en disant : « Qu’allons-nous manger ? » ou : « Qu’allons-nous boire ? » ou : « De quoi allons-nous nous habiller ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ οὖν μεριμνήσητε
  choice: Ne vous inquiétez donc pas
  rationale: Dans ce contexte, μεριμνάω désigne l’inquiétude anxieuse au sujet des besoins matériels. « Ne vous inquiétez pas » est naturel en français moderne, conserve la force de l’interdiction et, avec « donc », rend l’inférence marquée par οὖν.
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe exprime ici la manière dont l’inquiétude se formule; « en disant » rend clairement et naturellement ce rapport.
- source_word: Τί φάγωμεν;
  choice: Qu’allons-nous manger ?
  rationale: Le subjonctif délibératif porte sur l’approvisionnement à venir. Le futur proche est idiomatique en français et exprime naturellement la préoccupation des locuteurs.
- source_word: Τί πίωμεν;
  choice: Qu’allons-nous boire ?
  rationale: Cette question délibérative, parallèle à la précédente, est rendue par le futur proche pour un français courant et fidèle au souci d’un besoin futur.
- source_word: Τί περιβαλώμεθα;
  choice: De quoi allons-nous nous habiller ?
  rationale: Le moyen περιβάλλομαι évoque le fait de se vêtir. « De quoi allons-nous nous habiller ? » garde l’idée de la matière ou des vêtements dont on disposera et reflète davantage la forme réfléchie grecque que le simple « Qu’allons-nous porter ? ».
- source_word: ἤ ... ἤ ... ἤ
  choice: ou ... ou ... ou
  rationale: La répétition de la disjonction est conservée afin de reproduire la série ternaire du grec.
theological_decisions:
- issue: Portée de l’interdiction de Jésus concernant les besoins matériels
  choice: Comprendre μεριμνήσητε comme l’interdiction de se laisser gagner par l’inquiétude, non comme une condamnation générale de toute prévoyance.
  alternative: « Ne vous faites aucun souci » ou une formulation pouvant exclure toute préoccupation pratique.
  rationale: Le contexte immédiat vise l’anxiété relative à la nourriture, à la boisson et au vêtement. « Ne vous inquiétez donc pas » maintient cette portée sans introduire une interdiction absolue de planifier.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « ou » et des trois questions est maintenue pour préserver le rythme de l’énoncé. Aucun marqueur de note n’est nécessaire, puisque la nuance principale de μεριμνάω est directement exprimée par « s’inquiéter ».
