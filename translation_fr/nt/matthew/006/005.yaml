id: MAT.6.5
reference: Matthew 6:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅταν ⸂προσεύχησθε, οὐκ ἔσεσθε ὡς⸃ οἱ ὑποκριταί· ὅτι φιλοῦσιν ἐν ταῖς συναγωγαῖς καὶ ἐν ταῖς γωνίαις τῶν πλατειῶν ἑστῶτες προσεύχεσθαι, ⸀ὅπως φανῶσιν τοῖς ἀνθρώποις· ἀμὴν λέγω ⸀ὑμῖν, ἀπέχουσι τὸν μισθὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/005.yaml
  text: And whenever you pray[a], you shall not be like the hypocrites, because they love to stand and pray in the synagogues and on the corners of the broad streets, so that they may be seen by people. Truly I say to you[c][b], they have received their reward.
translation:
  language: fr
  text: Quand vous priez, vous ne serez pas comme les hypocrites, car ils aiment prier debout dans les synagogues et aux angles des grandes rues[a], afin d’être vus par les gens[b]. Amen, je vous le dis, ils ont reçu leur récompense[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux coins des rues ». Le grec dit plus littéralement : « aux angles des larges rues » ou des voies publiques.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des humains ». Le terme grec désigne ici les gens en général.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils ont reçu toute leur récompense ». Le verbe grec peut évoquer le fait de recevoir un paiement intégral.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν προσεύχησθε
  choice: Quand vous priez
  rationale: Le présent français exprime naturellement une situation générale et répétée; « quand » conserve ici la valeur indéfinie de ὅταν sans alourdir la phrase.
- source_word: οὐκ ἔσεσθε ὡς
  choice: vous ne serez pas comme
  rationale: Cette formulation garde le futur grec employé avec une force prescriptive et le ton solennel de l’enseignement.
- source_word: ὑποκριταί
  choice: hypocrites
  rationale: Terme français courant et précis pour ceux qui mettent leur piété en scène afin de produire une impression.
- source_word: φιλοῦσιν
  choice: ils aiment
  rationale: Rend la disposition volontaire et le plaisir qu’ils trouvent dans cette pratique publique.
- source_word: ἐν ταῖς συναγωγαῖς
  choice: dans les synagogues
  rationale: Conserve la réalité historique propre au contexte juif.
- source_word: ἐν ταῖς γωνίαις τῶν πλατειῶν
  choice: aux angles des grandes rues
  rationale: Reproduit les deux éléments de l’expression grecque, les angles et les larges voies publiques, tout en restant intelligible en français.
- source_word: ἑστῶτες προσεύχεσθαι
  choice: prier debout
  rationale: Le participe indique la posture adoptée pendant la prière; cette formulation est naturelle et ne suggère pas que la posture elle-même serait condamnée.
- source_word: ὅπως φανῶσιν τοῖς ἀνθρώποις
  choice: afin d’être vus des gens
  rationale: Exprime clairement le but recherché; « gens » rend la référence générique aux observateurs humains.
- source_word: ἀμὴν λέγω ὑμῖν
  choice: Amen, je vous le dis
  rationale: Conserve le terme sémitique solennel et sa fonction d’introduction autoritative, dans un français actuel.
- source_word: ἀπέχουσι τὸν μισθὸν αὐτῶν
  choice: ils ont reçu leur récompense
  rationale: Rend l’idiome commercial possible de ἀπέχω sans imposer dans le texte principal la nuance interprétative « intégralement ».
theological_decisions:
- issue: Portée générique de ἀνθρώποις
  choice: des gens
  alternative: des hommes
  rationale: Dans ce contexte, le substantif grec désigne les observateurs humains en général et non exclusivement les personnes de sexe masculin.
- issue: Portée de l’avertissement concernant la récompense
  choice: ils ont reçu leur récompense
  alternative: ils ont reçu toute leur récompense
  rationale: Le texte principal préserve la sobriété du grec et sa tension morale; la note signale la nuance commerciale possible selon laquelle la récompense a déjà été payée en totalité.
- issue: Objet de la critique
  choice: prier debout
  alternative: se tenir debout pour prier
  rationale: La traduction conserve la posture décrite sans faire de celle-ci, à elle seule, la faute dénoncée; le contexte indique que la critique porte sur le désir d’être vu.
translation_notes:
  register: Français international moderne, digne et accessible. Le futur prescriptif maintient la solennité de la forme grecque. « Amen, je vous le dis » préserve la formule caractéristique de Jésus. Les notes rendent visibles les principales possibilités lexicales sans résoudre abusivement l’ambiguïté de ἀπέχουσι.
