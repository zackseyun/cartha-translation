id: MAT.6.10
reference: Matthew 6:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλθέτω ἡ βασιλεία σου, γενηθήτω τὸ θέλημά σου, ὡς ἐν οὐρανῷ καὶ ⸀ἐπὶ γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/010.yaml
  text: May your kingdom come; may your will be done[a], as in heaven, so also on earth.
translation:
  language: fr
  text: Que ton règne vienne ; que ta volonté soit faite[a], comme au ciel, aussi sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, peut-être : « Que ton règne vienne ; que ta volonté soit faite, comme au ciel, aussi sur la terre », l’expression « comme au ciel, aussi sur la terre » se rapportant alors aux deux demandes.'
    reason: Lecture possible quant à la portée de l’expression comparative.
lexical_decisions:
- source_word: ἐλθέτω
  choice: Que… vienne
  rationale: L’impératif aoriste actif à la troisième personne exprime ici une demande adressée à Dieu. « Que ton règne vienne » est naturel et digne dans la langue française de la prière.
- source_word: βασιλεία
  choice: règne
  rationale: Le terme peut désigner l’exercice de la royauté ou le royaume. « Règne » met ici naturellement l’accent sur l’autorité royale de Dieu, sans exclure la réalité de son royaume.
- source_word: γενηθήτω
  choice: Que… soit faite
  rationale: Avec θέλημα, l’impératif aoriste passif de γίνομαι se rend idiomatiquement par « que ta volonté soit faite », c’est-à-dire qu’elle se réalise.
- source_word: θέλημα
  choice: volonté
  rationale: « Volonté » conserve les sens de désir, décision et dessein sans préciser plus que le grec.
- source_word: ὡς
  choice: comme
  rationale: « Comme » introduit simplement la comparaison et en préserve l’ouverture.
- source_word: ἐν οὐρανῷ
  choice: au ciel
  rationale: « Au ciel » est l’expression française naturelle pour désigner la sphère céleste dans ce contraste.
- source_word: ἐπὶ γῆς
  choice: sur la terre
  rationale: « Sur la terre » rend directement ἐπί avec le génitif et marque clairement l’opposition avec le ciel.
- source_word: καὶ
  choice: ainsi aussi
  rationale: Dans cette construction comparative, καί complète idiomatiquement le rapport entre ciel et terre. « Ainsi aussi » conserve explicitement la correspondance exprimée par le grec.
theological_decisions:
- issue: Portée de l’expression comparative ὡς ἐν οὐρανῷ καὶ ἐπὶ γῆς
  choice: 'Dans le texte principal, l’expression est rattachée à la seconde demande : « que ta volonté soit faite… »'
  alternative: Comprendre « comme au ciel, ainsi aussi sur la terre » comme se rapportant aux deux demandes précédentes, celle du règne et celle de la volonté.
  rationale: La proximité syntaxique favorise le rattachement à « que ta volonté soit faite », mais la ponctuation des éditions grecques est éditoriale et une portée sur les deux demandes reste possible. La note préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La structure traditionnelle de la prière est conservée sans archaïsmes. « Règne » est retenu plutôt que « royaume » pour exprimer naturellement l’action royale de Dieu dans cette demande.
