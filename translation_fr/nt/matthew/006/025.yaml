  variant: modern international French
source:
  edition: SBLGNT
  text: Διὰ τοῦτο λέγω ὑμῖν· μὴ μεριμνᾶτε τῇ ψυχῇ ὑμῶν τί ⸀φάγητε, μηδὲ τῷ σώματι ὑμῶν τί ἐνδύσησθε· οὐχὶ ἡ ψυχὴ πλεῖόν ἐστι τῆς τροφῆς καὶ τὸ σῶμα τοῦ ἐνδύματος;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/025.yaml
  text: Therefore I tell you[a], do not worry about your life, what you will eat, or about your body, what you will wear. Is not life more than food, and the body than clothing?
translation:
  language: fr
  text: 'C’est pourquoi je vous le dis : ne vous inquiétez pas de ce que vous mangerez pour vivre, ni de ce que vous mettrez pour votre corps. La vie n’est-elle pas plus que la nourriture, et le corps plus que le vêtement ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée de l’enseignement précédent et conserve le lien logique.
- source_word: μεριμνᾶτε
  choice: ne vous inquiétez pas
  rationale: Exprime la préoccupation anxieuse visée par le verbe, dans une formulation courante et accessible.
- source_word: ψυχῇ / ψυχή
  choice: vie
  rationale: Dans ce contexte de nourriture et de besoins corporels, ψυχή désigne la vie ou la personne vivante plutôt que spécifiquement une âme immatérielle.
- source_word: τί φάγητε
  choice: de ce que vous mangerez
  rationale: Rend l’objet futur de l’inquiétude tout en conservant la relation syntaxique avec « pour votre vie ».
- source_word: σώματι
  choice: corps
  rationale: Désigne directement le corps physique, mis en parallèle avec ce qui le vêt.
- source_word: τί ἐνδύσησθε
  choice: de ce que vous porterez
  rationale: Formulation française idiomatique pour les vêtements dont on se vêtira.
- source_word: οὐχὶ
  choice: n’est-elle pas
  rationale: Introduit une question rhétorique qui attend une réponse affirmative.
- source_word: πλεῖόν
  choice: plus que
  rationale: Préserve la comparaison sans préciser indûment s’il s’agit de valeur, d’importance ou de portée.
- source_word: τροφῆς
  choice: nourriture
  rationale: Terme général, clair et naturel pour ce qui nourrit.
- source_word: ἐνδύματος
  choice: vêtement
  rationale: Le singulier collectif français correspond au terme grec général et forme un parallèle naturel avec « nourriture ».
theological_decisions:
- issue: Sens de ψυχή dans l’enseignement de Jésus
  choice: Traduction par « vie »
  alternative: « âme »
  rationale: Le contexte immédiat porte sur le fait de manger, le corps et le vêtement. « Vie » rend donc le sens contextuel sans imposer une opposition entre âme immatérielle et corps que le verset n’explicite pas.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La reprise « pour votre vie… pour votre corps » conserve le parallélisme grec. « Le vêtement » est employé au singulier générique, comme dans le texte source.
