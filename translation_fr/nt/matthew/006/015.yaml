id: MAT.6.15
reference: Matthew 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δὲ μὴ ἀφῆτε τοῖς ⸀ἀνθρώποις, οὐδὲ ὁ πατὴρ ὑμῶν ἀφήσει τὰ παραπτώματα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/015.yaml
  text: But if you do not forgive people[a], neither will your Father forgive your trespasses.
translation:
  language: fr
  text: Mais si vous ne pardonnez pas aux autres, votre Père non plus ne vous pardonnera pas vos fautes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos transgressions » ou « vos offenses ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ μὴ
  choice: Mais si vous ne… pas
  rationale: ἐάν introduit la condition, δέ marque ici le contraste avec le verset précédent, et μή la négation. Cette formulation est naturelle en français tout en conservant la structure conditionnelle.
- source_word: ἀφῆτε
  choice: pardonnez
  rationale: Dans ce contexte de torts entre personnes, ἀφίημι signifie « pardonner ». Le même verbe français est repris pour ἀφήσει afin de préserver le parallélisme lexical.
- source_word: τοῖς ἀνθρώποις
  choice: aux autres
  rationale: Le grec désigne les êtres humains de manière générique. « Aux autres » exprime naturellement en français moderne les personnes envers lesquelles le pardon doit s’exercer, sans restriction de genre.
- source_word: οὐδὲ
  choice: non plus
  rationale: Dans une proposition négative, « non plus » rend idiomatiquement la correspondance négative et emphatique de οὐδέ avec la condition précédente.
- source_word: ὁ πατὴρ ὑμῶν
  choice: votre Père
  rationale: Le texte grec dit simplement « votre Père » ; aucun qualificatif tel que « céleste » n’est ajouté.
- source_word: ἀφήσει
  choice: pardonnera
  rationale: Le futur de ἀφίημι est rendu par « pardonnera », en répétant le verbe de la première proposition et en maintenant la réciprocité de l’énoncé.
- source_word: τὰ παραπτώματα ὑμῶν
  choice: vos fautes
  rationale: παραπτώματα désigne des faux pas, offenses ou transgressions. « Fautes » est actuel, digne et largement compréhensible, tout en gardant la portée morale du terme.
theological_decisions:
- issue: Rapport conditionnel entre le pardon accordé par les humains et le pardon de Dieu
  choice: Conserver sans l’atténuer la formulation conditionnelle directe.
  alternative: Présenter le pardon humain comme un simple signe du pardon divin, ou limiter le propos à une perte de communion plutôt qu’au pardon lui-même.
  rationale: Le grec énonce directement une condition et sa conséquence. La traduction préserve cette tension théologique sans la résoudre par une paraphrase doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « Aux autres » évite le masculin générique peu naturel ici ; « votre Père non plus » restitue clairement οὐδέ. Le marqueur de note est placé immédiatement après le terme annoté.
