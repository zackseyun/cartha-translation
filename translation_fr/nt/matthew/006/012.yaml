  text: καὶ ἄφες ἡμῖν τὰ ὀφειλήματα ἡμῶν, ὡς καὶ ἡμεῖς ⸀ἀφήκαμεν τοῖς ὀφειλέταις ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/012.yaml
  text: And forgive us our debts[b][a], as we also have forgiven our debtors.
translation:
  language: fr
  text: Et remets-nous nos dettes[a], comme nous aussi nous les avons remises[b] à nos débiteurs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, les « dettes » peuvent désigner les péchés ou les offenses ; le grec conserve l’image de ce qui est dû.
    reason: lexical_alternative
  - marker: b
    text: 'Quelques manuscrits lisent : « comme nous aussi nous les remettons à nos débiteurs ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἄφες
  choice: remets
  rationale: Dans le contexte de la dette, « remettre » exprime naturellement l’annulation de ce qui est dû tout en gardant la portée morale du verbe ἀφίημι.
- source_word: τὰ ὀφειλήματα
  choice: nos dettes
  rationale: « Dettes » conserve la métaphore grecque de ce qui est dû et maintient le lien lexical avec « débiteurs ».
- source_word: ὡς
  choice: comme
  rationale: « Comme » rend directement la comparaison introduite par ὡς sans préciser davantage la nature du rapport entre les deux pardons.
- source_word: καὶ ἡμεῖς
  choice: nous aussi
  rationale: Cette formulation restitue l’insistance explicite du grec sur ceux qui prient.
- source_word: ἀφήκαμεν
  choice: nous les avons remises
  rationale: Le passé composé rend naturellement en français l’aoriste indiquant ici une action accomplie. Le pronom « les » reprend les dettes et rend la phrase idiomatique sans changer le sens.
- source_word: τοῖς ὀφειλέταις ἡμῶν
  choice: à nos débiteurs
  rationale: « Débiteurs » conserve le terme apparenté à « dettes » et donc la cohérence de la métaphore dans les deux membres de la demande.
theological_decisions:
- issue: Métaphore morale des dettes
  choice: Conserver « dettes » et « débiteurs » dans le texte principal.
  alternative: Employer « fautes », « offenses » ou « ceux qui nous ont offensés ».
  rationale: Le grec formule le pardon des péchés au moyen d’une métaphore financière cohérente. La conserver évite de remplacer l’image du texte par son interprétation, tout en signalant sa portée morale en note.
- issue: Rapport entre le pardon demandé et le pardon accordé
  choice: Traduire simplement ὡς par « comme ».
  alternative: Expliciter par « parce que », « dans la mesure où » ou « de la même manière que ».
  rationale: « Comme » préserve la tension du texte sans déterminer si le pardon humain est présenté comme condition, preuve, modèle ou accompagnement du pardon demandé.
- issue: Aspect temporel de ἀφήκαμεν
  choice: « nous les avons remises »
  alternative: « nous les remettons » selon une variante manuscrite, ou « nous les remîmes » comme passé simple.
  rationale: Le passé composé est le moyen courant de rendre en français moderne une action passée accomplie ayant une pertinence présente; il n’ajoute pas une théorie théologique du mérite.
translation_notes:
  register: Français moderne, digne et adapté à la prière. « Remets-nous nos dettes » conserve l’image source et son écho traditionnel sans employer un vocabulaire archaïque. Le pronom « les » est ajouté pour que le second membre soit naturel et non ambigu en français.
