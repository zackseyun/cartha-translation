  variant: modern international French
source:
  edition: SBLGNT
  text: σὺ δὲ νηστεύων ἄλειψαί σου τὴν κεφαλὴν καὶ τὸ πρόσωπόν σου νίψαι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/006/017.yaml
  text: But you[a], when you fast, anoint your head and wash your face[b],
translation:
  language: fr
  text: Mais toi, quand tu jeûnes, mets de l’huile sur ta tête[a] et lave-toi le visage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Oins-toi la tête ». Le verbe désigne l’application d’huile, ici comme soin ordinaire.'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, garde une apparence normale au lieu de rendre ton jeûne évident aux yeux des autres.
    reason: cultural_note
lexical_decisions:
- source_word: σὺ δὲ
  choice: Mais toi
  rationale: Le pronom explicite σὺ est emphatique et, avec δέ, marque le contraste avec les hypocrites mentionnés auparavant. « Mais toi » conserve cette adresse contrastive sans la développer excessivement.
- source_word: νηστεύων
  choice: quand tu jeûnes
  rationale: Le participe présent a ici une valeur circonstancielle temporelle. Cette proposition est naturelle en français et convient au caractère général de l’instruction.
- source_word: ἄλειψαί σου τὴν κεφαλήν
  choice: mets de l’huile sur ta tête
  rationale: Dans ce contexte, ἀλείφω désigne l’application d’huile, notamment comme geste courant de soin. Cette formulation moderne rend l’action plus clairement que « oins-toi la tête », qui pourrait suggérer à tort un rite religieux.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement les deux impératifs.
- source_word: τὸ πρόσωπόν σου νίψαι
  choice: lave-toi le visage
  rationale: νίπτω désigne couramment le lavage d’une partie du corps. La tournure pronominale est idiomatique en français et restitue naturellement l’instruction.
theological_decisions:
- issue: Nature de l’instruction concernant l’apparence pendant le jeûne
  choice: Jésus demande au disciple de conserver une apparence normalement soignée pendant le jeûne, plutôt que d’afficher celui-ci devant les autres.
  alternative: Le verset prescrirait une onction rituelle, ou interdirait en soi tout jeûne visible ou public.
  rationale: Le contexte immédiat oppose cette conduite au visage défait des hypocrites. La traduction conserve les gestes concrets du grec sans transformer l’application d’huile en rite ni expliciter dans le corps du texte une intention que le contexte permet de comprendre.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier rend l’adresse emphatique σὺ et s’inscrit naturellement dans le discours. « Mets de l’huile » évite la coloration religieuse aujourd’hui souvent associée au verbe « oindre », tout en préservant le geste culturel concret.
