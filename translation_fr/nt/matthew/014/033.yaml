id: MAT.14.33
reference: Matthew 14:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν τῷ ⸀πλοίῳ προσεκύνησαν αὐτῷ λέγοντες· Ἀληθῶς θεοῦ υἱὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/033.yaml
  text: Then those in the boat worshiped him[a], saying[b], “Truly you are the Son of God.”
translation:
  language: fr
  text: 'Alors, ceux qui étaient dans la barque se prosternèrent devant lui[a] en disant : « Tu es vraiment le Fils de Dieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adorèrent » ou « lui rendirent hommage ». Le verbe grec peut désigner la révérence exprimée par l’agenouillement ou la prosternation ; ici, le contexte lui donne une forte portée d’adoration.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « Fils de Dieu », sans article en grec ; dans ce contexte, l’expression fonctionne comme un titre et ne signifie pas simplement « un fils de Dieu ».
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ ἐν τῷ πλοίῳ
  choice: Alors, ceux qui étaient dans la barque
  rationale: δέ marque ici une transition narrative légère, rendue naturellement par « Alors ». L'expression substantivée οἱ ἐν τῷ πλοίῳ désigne les personnes qui se trouvaient dans la barque.
- source_word: προσεκύνησαν αὐτῷ
  choice: se prosternèrent devant lui
  rationale: προσκυνέω désigne un geste de profonde révérence, souvent l'agenouillement ou la prosternation, et peut aussi exprimer l'adoration. « Se prosternèrent devant lui » conserve à la fois le geste concret et sa portée cultuelle possible sans trancher plus que le grec.
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe présent exprime l'action accompagnant la prosternation. « En disant » en conserve simplement le rapport syntaxique.
- source_word: Ἀληθῶς
  choice: vraiment
  rationale: L'adverbe affirme avec force la vérité de la confession. « Vraiment » est naturel en français moderne tout en gardant sa solennité.
- source_word: θεοῦ υἱὸς
  choice: le Fils de Dieu
  rationale: Malgré l'absence d'article devant θεοῦ, la construction prédicative et le contexte soutiennent une valeur titulaire et définie. « Le Fils de Dieu » correspond à l'usage christologique de Matthieu, plutôt qu'à l'indéfini « un fils de Dieu ».
- source_word: εἶ
  choice: Tu es
  rationale: Le pronom est explicité conformément à la syntaxe française; l'ordre naturel place le verbe et le sujet au début de la déclaration.
theological_decisions:
- issue: Portée de προσκυνέω appliqué à Jésus
  choice: se prosternèrent devant lui
  alternative: l'adorèrent
  rationale: Le contexte — autorité de Jésus sur la mer et confession qui suit — donne au geste une forte portée d'adoration. Toutefois, le verbe grec désigne aussi concrètement la prosternation ou l'hommage; la traduction principale préserve cette amplitude sémantique, tandis que la note explicite la possibilité d'« adorer ».
- issue: Détermination de θεοῦ υἱὸς
  choice: le Fils de Dieu
  alternative: un fils de Dieu
  rationale: L'absence d'article en grec n'impose pas un sens indéfini. Dans cette confession matthéenne, l'expression fonctionne comme un titre et présente une valeur qualitative et définie; « un fils de Dieu » en affaiblirait indûment la portée.
translation_notes:
  register: Français international moderne, digne et accessible. « Barque » convient au cadre narratif. La formulation garde le mouvement du récit et la solennité de la confession, tout en préservant dans le texte et la note l'étendue de sens de προσκυνέω.
