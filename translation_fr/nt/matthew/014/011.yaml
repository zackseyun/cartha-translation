source:
  edition: SBLGNT
  text: καὶ ἠνέχθη ἡ κεφαλὴ αὐτοῦ ἐπὶ πίνακι καὶ ἐδόθη τῷ κορασίῳ, καὶ ἤνεγκεν τῇ μητρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/011.yaml
  text: And his head was brought on a platter and given to the girl[a], and she brought it to her mother.
translation:
  language: fr
  text: Sa tête fut apportée sur un plat[a] et donnée à la jeune fille, qui l’apporta à sa mère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur un plateau ». Le grec πίναξ désigne un plat ou un plateau utilisé pour servir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνέχθη
  choice: fut apportée
  rationale: L’aoriste passif de φέρω est rendu par un passé simple passif, naturel dans un récit soutenu, tout en conservant la voix passive du grec.
- source_word: ἡ κεφαλὴ αὐτοῦ
  choice: sa tête
  rationale: Traduction directe de l’expression grecque, sans atténuer la violence de la scène.
- source_word: ἐπὶ πίνακι
  choice: sur un plat
  rationale: πίναξ désigne ici un plat ou plateau de service. « Sur un plat » est clair, naturel et adapté au contexte.
- source_word: ἐδόθη
  choice: donnée
  rationale: Le participe coordonné à « fut apportée » reproduit avec concision le second aoriste passif du grec.
- source_word: τῷ κορασίῳ
  choice: à la jeune fille
  rationale: κοράσιον désigne une fille ou une jeune fille. Cette formulation moderne exprime naturellement l’indication d’âge portée par le terme grec.
- source_word: ἤνεγκεν
  choice: qui l’apporta
  rationale: Le même verbe φέρω est rendu de nouveau par « apporter ». Le pronom « l’ » reprend sans ambiguïté la tête, et la relative évite une coordination française pesante.
- source_word: τῇ μητρὶ αὐτῆς
  choice: à sa mère
  rationale: Traduction directe du datif; le possessif renvoie naturellement à la mère de la jeune fille.
