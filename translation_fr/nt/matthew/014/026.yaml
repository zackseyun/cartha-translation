- from: 'Mais quand les disciples le virent marcher sur la mer, ils furent terrifiés et dirent : « C’est un fantôme[a] ! » Puis ils poussèrent des cris de peur.'
  to: 'Mais quand les disciples le virent marcher sur la mer, ils furent terrifiés et dirent : « C’est un fantôme[a] ! » Et ils crièrent de peur.'
  rationale: La révision supprime l’indication temporelle ajoutée par « Puis » et rend κράζω par le verbe direct « crièrent ». Elle conserve le registre narratif, la force de la peur et l’ambiguïté lexicale de φάντασμα signalée en note.
