id: MAT.14.26
reference: Matthew 14:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂οἱ δὲ μαθηταὶ ἰδόντες αὐτὸν⸃ ἐπὶ ⸂τῆς θαλάσσης⸃ περιπατοῦντα ἐταράχθησαν λέγοντες ὅτι Φάντασμά ἐστιν, καὶ ἀπὸ τοῦ φόβου ἔκραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/026.yaml
  text: But when the disciples saw him walking on the sea[a], they were terrified, saying, “It is a ghost!” And they cried out from fear.
translation:
  language: fr
  text: 'Mais quand les disciples le virent marcher sur la mer, ils furent terrifiés et dirent : « C’est un fantôme[a] ! » Et ils crièrent de peur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une apparition » ou « un spectre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: 'Marque ici une légère opposition ou une nouvelle étape du récit : la réaction effrayée des disciples contraste avec ce qu’ils voient.'
- source_word: μαθηταὶ
  choice: les disciples
  rationale: L’article grec désigne un groupe défini, clairement identifié dans le contexte comme les disciples de Jésus.
- source_word: ἰδόντες αὐτὸν
  choice: quand les disciples le virent
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français, qui conserve l’ordre narratif.
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: marcher sur la mer
  rationale: L’expression décrit Jésus se déplaçant à la surface de la mer. « Sur la mer » reste proche du grec tout en étant idiomatique.
- source_word: ἐταράχθησαν
  choice: ils furent terrifiés
  rationale: Dans ce contexte, le verbe exprime un profond bouleversement causé par la peur, comme le confirme leur cri.
- source_word: λέγοντες
  choice: et dirent
  rationale: Le participe simultané introduit leur exclamation ; une coordination avec un verbe conjugué est plus naturelle en français.
- source_word: Φάντασμά ἐστιν
  choice: C’est un fantôme !
  rationale: « Fantôme » exprime clairement, en français courant, l’interprétation effrayée et erronée des disciples sans en faire une affirmation du narrateur.
- source_word: ἀπὸ τοῦ φόβου
  choice: de peur
  rationale: La préposition indique ici la cause ou la source de leurs cris.
- source_word: ἔκραξαν
  choice: ils poussèrent des cris
  rationale: Cette formulation rend la force de κράζω, qui désigne un cri poussé à haute voix, sans préciser davantage sa tonalité.
theological_decisions:
- issue: Nature de φάντασμα dans l’exclamation des disciples
  choice: « fantôme » dans le texte principal
  alternative: « apparition » ou « spectre »
  rationale: Le verset rapporte la conclusion des disciples sous l’effet de la peur, et non une affirmation ontologique du narrateur au sujet des esprits. « Fantôme » transmet cette perception de manière claire sans ajouter de conclusion doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La note est placée après « fantôme », le terme auquel elle se rapporte.
