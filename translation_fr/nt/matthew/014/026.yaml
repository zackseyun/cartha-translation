  source_fidelity: 'La formulation rend fidèlement les éléments essentiels : les disciples voient Jésus marcher sur la mer, sont saisis de peur, l’identifient à tort comme un « fantôme » et crient à cause de leur peur. Toutefois, « Puis » introduit une succession explicite qui n’est pas marquée par le καί grec, lequel relie simplement le cri à leur réaction de peur.'
  naturalness: Le français est moderne, naturel et adapté à un récit biblique. « Ils crièrent de peur » est plus direct et idiomatique que « Puis ils poussèrent des cris de peur », tout en évitant l’ajout temporel.
  terminology: « Fantôme » est un équivalent courant et approprié de φάντασμα dans cette exclamation rapportée. La note « apparition » / « spectre » préserve utilement les autres possibilités lexicales sans imposer une lecture doctrinale.
