    rationale: Le grec coordonne la proposition par καί sans indiquer explicitement que le cri a eu lieu après leur exclamation. En français, « Puis » peut créer une séquence plus nette que le texte source ne l’exprime.
  revised_text: 'Mais quand les disciples le virent marcher sur la mer, ils furent terrifiés et dirent : « C’est un fantôme[a] ! » Et ils crièrent de peur.'
