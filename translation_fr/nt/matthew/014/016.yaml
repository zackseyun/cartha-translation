  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐ χρείαν ἔχουσιν ἀπελθεῖν· δότε αὐτοῖς ὑμεῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/016.yaml
  text: But Jesus said to them[a], “They have no need to go away; you yourselves give them something to eat.”
translation:
  language: fr
  text: 'Mais Jésus leur dit : « Ils n’ont pas besoin de partir. Donnez-leur vous-mêmes à manger. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un léger contraste avec la proposition des disciples de renvoyer la foule ; « Mais » le rend naturellement.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: Formulation narrative française courante et fidèle au verbe λέγω accompagné de son complément indirect.
- source_word: Οὐ χρείαν ἔχουσιν
  choice: Ils n’ont pas besoin
  rationale: Rend directement et naturellement l’expression ἔχω χρείαν, qui indique l’absence de nécessité.
- source_word: ἀπελθεῖν
  choice: de partir
  rationale: Dans ce contexte, « partir » exprime clairement le fait de quitter le lieu, sans la nuance potentiellement brusque de « s’en aller ».
- source_word: δότε αὐτοῖς
  choice: Donnez-leur
  rationale: Conserve la force simple de l’impératif aoriste et le pronom désignant la foule.
- source_word: ὑμεῖς
  choice: vous-mêmes
  rationale: Le pronom sujet explicite est emphatique en grec ; « vous-mêmes » maintient l’accent placé sur les disciples.
- source_word: φαγεῖν
  choice: à manger
  rationale: Après « donner », l’infinitif se rend idiomatiquement en français par « donner à manger », sans qu’il soit nécessaire d’ajouter un objet indéfini.
theological_decisions:
- issue: Accent mis sur le rôle des disciples dans l’ordre de Jésus
  choice: Rendre ὑμεῖς par « vous-mêmes »
  alternative: Employer simplement « vous »
  rationale: Le choix conserve l’insistance grammaticale du grec sur les disciples comme agents, sans préciser davantage la portée théologique de l’ordre.
translation_notes:
  register: Français moderne, clair et digne. La syntaxe reste concise et orale, adaptée au discours direct. Aucun appel de note n’est nécessaire, car les nuances lexicales sont suffisamment représentées dans le texte principal.
