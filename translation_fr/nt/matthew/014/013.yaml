id: MAT.14.13
reference: Matthew 14:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Ἀκούσας δὲ⸃ ὁ Ἰησοῦς ἀνεχώρησεν ἐκεῖθεν ἐν πλοίῳ εἰς ἔρημον τόπον κατ’ ἰδίαν· καὶ ἀκούσαντες οἱ ὄχλοι ἠκολούθησαν αὐτῷ πεζῇ ἀπὸ τῶν πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/013.yaml
  text: When Jesus heard this[a], he withdrew from there by boat to a desolate place by himself. But when the crowds heard[b], they followed him on foot from the towns.
translation:
  language: fr
  text: Quand Jésus apprit cela, il se retira de là en bateau dans un endroit isolé[a], à l’écart. Mais les foules, l’ayant appris, le suivirent à pied depuis les villes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un endroit désert » ou « un lieu retiré ». Le grec désigne un endroit isolé ou inhabité, pas nécessairement un désert de sable.
    reason: lexical_alternative
  - marker: b
    text: Ou « les localités ». Le mot grec peut désigner des villes ou des agglomérations plus modestes selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούσας δὲ
  choice: Quand Jésus apprit cela
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle en français. « Cela » explicite sobrement l’objet fourni par le contexte, sans ajouter de motif au retrait de Jésus; δέ marque ici la progression du récit.
- source_word: ἀνεχώρησεν ἐκεῖθεν
  choice: il se retira de là
  rationale: « Se retira » conserve la nuance de retrait souvent portée par ἀναχωρέω chez Matthieu, tandis que « de là » traduit directement ἐκεῖθεν.
- source_word: ἐν πλοίῳ
  choice: en bateau
  rationale: Formulation idiomatique en français moderne pour indiquer le moyen de déplacement.
- source_word: εἰς ἔρημον τόπον
  choice: vers un endroit isolé
  rationale: ἔρημος désigne ici un lieu inhabité ou à l’écart, sans impliquer nécessairement un désert de sable. « Isolé » évite cette surinterprétation géographique.
- source_word: κατ’ ἰδίαν
  choice: à l’écart
  rationale: Cette expression indique que Jésus se met à part, en privé. « À l’écart » est naturel et évite de préciser plus que le texte s’il était absolument seul.
- source_word: ἀκούσαντες οἱ ὄχλοι
  choice: les foules, l’ayant appris
  rationale: Le participe aoriste est rendu par une tournure temporelle concise; « les foules » conserve le pluriel grec.
- source_word: ἠκολούθησαν αὐτῷ πεζῇ
  choice: le suivirent à pied
  rationale: Traduction directe et idiomatique de l’action concrète de suivre Jésus par voie terrestre.
- source_word: ἀπὸ τῶν πόλεων
  choice: depuis les villes
  rationale: « Villes » est l’équivalent courant de πόλεις; une note signale que le mot peut aussi désigner des localités de taille plus modeste.
theological_decisions:
- issue: Motif du retrait de Jésus
  choice: Décrire simplement son retrait sans en préciser la raison
  alternative: Présenter ce retrait comme une fuite, un temps de deuil ou une recherche explicite de prière
  rationale: Le verset relie le retrait de Jésus à ce qu’il vient d’apprendre, mais n’en énonce pas explicitement le motif. La traduction maintient cette ouverture interprétative.
- issue: Portée de κατ’ ἰδίαν
  choice: à l’écart
  alternative: tout seul
  rationale: « À l’écart » exprime la mise à part ou le caractère privé sans imposer l’idée que personne ne l’accompagnait dans le bateau.
translation_notes:
  register: Français international moderne, narratif et digne. Les participes grecs sont rendus par des tournures françaises fluides. Les marqueurs de notes sont placés sur les expressions auxquelles les variantes lexicales se rapportent.
