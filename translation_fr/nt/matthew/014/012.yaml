source:
  edition: SBLGNT
  text: καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ἦραν τὸ ⸀πτῶμα καὶ ἔθαψαν ⸀αὐτόν, καὶ ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/012.yaml
  text: And his disciples came[a], took the body, and buried him; then they went and reported it to Jesus.
translation:
  language: fr
  text: Ses disciples s’approchèrent, prirent le corps[a] et l’ensevelirent. Puis ils vinrent en informer Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le cadavre ». Le mot grec désigne un corps sans vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: s’approchèrent
  rationale: Le participe aoriste de προσέρχομαι exprime ici le fait de venir auprès du corps. « S’approchèrent » rend le mouvement sans lourdeur.
- source_word: μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: Le contexte immédiat désigne les disciples de Jean le Baptiste. La formulation conserve néanmoins le pronom du grec sans expliciter davantage.
- source_word: ἦραν
  choice: emportèrent
  rationale: Dans le contexte de l’ensevelissement, αἴρω implique qu’ils prennent le corps pour le déplacer. « Emportèrent » est naturel en français et évite l’ambiguïté de « prirent le corps ».
- source_word: πτῶμα
  choice: le corps
  rationale: πτῶμα désigne explicitement un corps sans vie. « Le corps » convient au registre narratif français; la précision « cadavre » est donnée en note.
- source_word: ἔθαψαν αὐτόν
  choice: l’ensevelirent
  rationale: θάπτω signifie enterrer ou ensevelir. « L’ensevelirent » est précis, digne et n’ajoute aucun détail concernant un tombeau.
- source_word: ἐλθόντες
  choice: Puis ils allèrent
  rationale: Le participe aoriste introduit l’action suivante et comporte une idée de déplacement. Une proposition finie rend naturellement cette succession en français.
- source_word: ἀπήγγειλαν
  choice: l’annoncer
  rationale: ἀπαγγέλλω signifie rapporter ou annoncer une nouvelle. Le pronom « l’ » reprend implicitement ce qui venait d’arriver, comme le permet le contexte.
- source_word: τῷ Ἰησοῦ
  choice: à Jésus
  rationale: « Jésus » est la forme française traditionnelle et standard de Ἰησοῦς.
theological_decisions:
- issue: Référent de « ses disciples »
  choice: Les disciples de Jean le Baptiste
  alternative: Les disciples de Jésus
  rationale: Le récit immédiatement précédent porte sur l’exécution de Jean; le référent naturel de αὐτοῦ est donc Jean. La traduction conserve toutefois la formulation pronominale du grec.
translation_notes:
  register: Français international moderne, narratif et digne. « Ensevelir » reste courant dans le contexte funéraire et évite d’introduire le détail non exprimé d’une mise au tombeau.
