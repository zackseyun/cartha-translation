revisions:
- from: Ses disciples s’approchèrent, emportèrent le corps[a] et l’ensevelirent. Puis ils allèrent l’annoncer à Jésus.
  to: Ses disciples s’approchèrent, prirent le corps[a] et l’ensevelirent. Puis ils vinrent en informer Jésus.
  rationale: 'Révision limitée à deux formulations : « prirent » ne surinterprète pas αἴρω, et « vinrent en informer Jésus » rend ensemble le second participe de mouvement et le verbe de rapport, dans un français naturel. La note lexicale demeure justifiée et son ancrage est conservé.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T01:57:18Z'
review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, et « ses disciples » conserve correctement le pronom possessif dont le référent contextuel est Jean. Toutefois, « emportèrent » explicite un éloignement que αἴρω n’impose pas; « prirent » est plus direct. Dans la seconde proposition, « l’annoncer » est moins précis et son pronom peut être momentanément ambigu en français; « en informer Jésus » rend naturellement ἀπήγγειλαν tout en conservant l’objet implicite. « Puis ils vinrent » restitue le mouvement exprimé par ἐλθόντες.
  naturalness: La version révisée conserve un récit fluide et moderne. « S’approchèrent » convient au premier participe dans ce contexte, tandis que « vinrent ensuite en informer Jésus » est idiomatique et évite la reprise pronominale ambiguë de « l’annoncer ».
  terminology: « Corps » est un choix approprié pour πτῶμα dans le registre narratif; la note indique utilement l’alternative plus explicite « cadavre ». « Ensevelir » convient à θάπτω sans ajouter le détail d’un tombeau. Les noms et le terme « disciples » sont cohérents avec l’usage biblique français.
  issues:
  - severity: low
    issue: « emportèrent » pour ἦραν
    rationale: Le verbe αἴρω signifie ici prendre/lever le corps. « Emporter » est possible en contexte, mais ajoute plus nettement l’idée de l’emporter ailleurs; « prirent » reste plus proche du degré de précision du grec.
  - severity: medium
    issue: « Puis ils allèrent l’annoncer à Jésus » pour ἐλθόντες ἀπήγγειλαν τῷ Ἰησοῦ
    rationale: Le français « l’annoncer » est moins naturel pour un rapport adressé à une personne et le pronom peut renvoyer formellement au corps. « Vinrent ensuite en informer Jésus » exprime clairement le déplacement et le compte rendu, avec l’événement sous-entendu comme dans le grec.
  revised_text: Ses disciples s’approchèrent, prirent le corps[a] et l’ensevelirent. Puis ils vinrent en informer Jésus.
  revised_footnotes:
  - marker: a
    text: Ou « le cadavre ». Le mot grec désigne un corps sans vie.
    reason: lexical_alternative
  revision_rationale: 'Révision limitée à deux formulations : « prirent » ne surinterprète pas αἴρω, et « vinrent en informer Jésus » rend ensemble le second participe de mouvement et le verbe de rapport, dans un français naturel. La note lexicale demeure justifiée et son ancrage est conservé.'
