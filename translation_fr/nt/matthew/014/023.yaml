source:
  edition: SBLGNT
  text: καὶ ἀπολύσας τοὺς ὄχλους ἀνέβη εἰς τὸ ὄρος κατ’ ἰδίαν προσεύξασθαι. ὀψίας δὲ γενομένης μόνος ἦν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/023.yaml
  text: And after dismissing the crowds[a], he went up on the mountain by himself to pray. When evening came, he was there alone.
translation:
  language: fr
  text: Après avoir renvoyé les foules, il monta sur la montagne, à l’écart[a], pour prier. Le soir venu, il était là, seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en privé » (κατ’ ἰδίαν).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσας
  choice: Après avoir renvoyé
  rationale: Le participe aoriste exprime ici une action antérieure à la montée. « Renvoyer » rend naturellement l’idée de faire partir les foules.
- source_word: τοὺς ὄχλους
  choice: les foules
  rationale: Le pluriel grec est conservé et désigne les groupes de personnes rassemblées.
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: il monta sur la montagne
  rationale: Cette formulation rend le mouvement ascendant vers la montagne dans un français naturel et digne.
- source_word: κατ’ ἰδίαν
  choice: à l’écart
  rationale: L’expression indique un retrait hors de la présence des autres. « À l’écart » préserve cette nuance sans faire double emploi avec μόνος dans la seconde phrase.
- source_word: προσεύξασθαι
  choice: pour prier
  rationale: L’infinitif exprime le but de la montée.
- source_word: ὀψίας δὲ γενομένης
  choice: Le soir venu
  rationale: Cette tournure concise rend le génitif absolu temporel et marque naturellement la transition.
- source_word: μόνος ἦν ἐκεῖ
  choice: il était là, seul
  rationale: La formulation conserve à la fois l’indication de lieu et l’accent final porté sur la solitude de Jésus.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La répétition conceptuelle entre le retrait à l’écart et la solitude finale est conservée, tout en distinguant les deux expressions grecques.
