id: MAT.14.22
reference: Matthew 14:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εὐθέως ⸀ἠνάγκασεν τοὺς μαθητὰς ἐμβῆναι ⸀εἰς πλοῖον καὶ προάγειν αὐτὸν εἰς τὸ πέραν, ἕως οὗ ἀπολύσῃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/022.yaml
  text: And immediately he compelled the disciples to get into the boat and go on ahead of him to the other side[a], until he should dismiss the crowds.
translation:
  language: fr
  text: Aussitôt, Jésus obligea les disciples à monter dans la barque et à le précéder sur l’autre rive, jusqu’à ce qu’il renvoie les foules.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Rend clairement la promptitude et la transition rapide du récit.
- source_word: ἠνάγκασεν
  choice: obligea
  rationale: Conserve l’idée d’une forte contrainte ou insistance sans suggérer nécessairement une violence physique; plus naturel ici que « contraignit ».
- source_word: τοὺς μαθητάς
  choice: les disciples
  rationale: Respecte l’article grec et n’ajoute pas le possessif « ses », bien que le contexte identifie les disciples de Jésus.
- source_word: ἐμβῆναι εἰς πλοῖον
  choice: à monter dans la barque
  rationale: Expression française idiomatique pour l’action d’embarquer; la barque est identifiable dans le contexte narratif malgré l’absence d’article grec.
- source_word: προάγειν αὐτόν
  choice: à le précéder
  rationale: Exprime directement que les disciples doivent partir avant Jésus, avec αὐτόν comme complément.
- source_word: εἰς τὸ πέραν
  choice: sur l’autre rive
  rationale: Équivalent naturel en français pour le côté opposé de l’étendue d’eau.
- source_word: ἕως οὗ ἀπολύσῃ
  choice: pendant qu’il renverrait
  rationale: Dans ce contexte, la limite temporelle correspond à l’action que Jésus accomplira après leur départ; le conditionnel dans le discours narratif conserve la perspective future par rapport au verbe principal.
- source_word: ἀπολύσῃ τοὺς ὄχλους
  choice: renverrait les foules
  rationale: « Renvoyer » restitue naturellement le sens contextuel de faire partir, et le pluriel « foules » maintient celui du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le nom « Jésus » explicite une fois le sujet pronominal grec afin d’éviter une ouverture française ambiguë, le référent étant clair dans le contexte immédiat. Aucun appel de note n’est nécessaire.
