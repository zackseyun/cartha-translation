id: MAT.14.14
reference: Matthew 14:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἐξελθὼν εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ αὐτοῖς καὶ ἐθεράπευσεν τοὺς ἀρρώστους αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/014.yaml
  text: And when he went ashore[a], he saw a large crowd[b], and he had compassion on them and healed their sick.
translation:
  language: fr
  text: Quand il débarqua[a], il vit une grande foule. Il fut saisi de compassion pour eux et guérit leurs malades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « quand il sortit ». Dans ce contexte, il s’agit vraisemblablement de sa sortie du bateau, donc de son débarquement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: Quand il débarqua
  rationale: Le participe signifie littéralement « étant sorti ». Dans le contexte immédiat d’une arrivée en bateau, « débarqua » exprime naturellement l’action implicite sans alourdir le texte; une note conserve le sens plus littéral.
- source_word: εἶδεν
  choice: il vit
  rationale: Traduction directe et naturelle de l’aoriste de ὁράω.
- source_word: πολὺν ὄχλον
  choice: une grande foule
  rationale: Cette formulation courante rend à la fois ὄχλος, « foule », et la valeur quantitative de πολύς.
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοῖς
  choice: Il fut saisi de compassion pour eux
  rationale: σπλαγχνίζομαι exprime une compassion profonde. « Fut saisi de compassion » en restitue la force tout en restant naturel et digne; « pour eux » reprend les personnes formant la foule plutôt que le nom collectif grammaticalement féminin.
- source_word: ἐθεράπευσεν
  choice: guérit
  rationale: Dans ce contexte, θεραπεύω désigne sans ambiguïté l’action de guérir les personnes malades.
- source_word: τοὺς ἀρρώστους αὐτῶν
  choice: leurs malades
  rationale: La formulation concise reproduit l’adjectif substantivé grec et désigne naturellement les malades qui se trouvaient parmi eux.
theological_decisions:
- issue: Expression de la réaction émotionnelle de Jésus
  choice: Il fut saisi de compassion pour eux
  alternative: Il eut compassion d’eux
  rationale: La formulation retenue préserve l’intensité de σπλαγχνίζομαι et le lien narratif entre la compassion de Jésus et les guérisons, sans ajouter de motif doctrinal absent du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passage du collectif féminin « foule » au pluriel humain « eux » suit le grec et vise les personnes qui composent la foule. La division en deux phrases allège la succession des καί sans modifier les rapports narratifs.
