id: MAT.14.27
reference: Matthew 14:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀εὐθὺς δὲ ἐλάλησεν ⸂αὐτοῖς ὁ Ἰησοῦς⸃ λέγων· Θαρσεῖτε, ἐγώ εἰμι· μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/027.yaml
  text: But immediately Jesus spoke to them[a], saying, “Take courage; it is I. Do not be afraid.”
translation:
  language: fr
  text: 'Mais aussitôt, Jésus leur parla : « Prenez courage ! C’est moi[a]. N’ayez pas peur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Je suis. » Ici, le grec peut servir simplement à s’identifier, mais certains y entendent aussi un possible écho à l’auto-désignation divine.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: aussitôt
  rationale: Rend clairement la valeur temporelle immédiate dans un français moderne et naturel.
- source_word: δὲ
  choice: Mais
  rationale: Marque la légère opposition avec la peur des disciples exprimée au verset précédent.
- source_word: ἐλάλησεν αὐτοῖς ὁ Ἰησοῦς λέγων
  choice: Jésus leur parla
  rationale: La formulation française exprime naturellement l’acte de parole et introduit directement les paroles de Jésus sans reproduire lourdement le participe λέγων.
- source_word: Θαρσεῖτε
  choice: Prenez courage !
  rationale: L’impératif pluriel appelle les disciples à reprendre courage; cette expression est claire, actuelle et exhortative.
- source_word: ἐγώ εἰμι
  choice: C’est moi
  rationale: Dans la situation immédiate, Jésus se fait reconnaître par les disciples effrayés. La traduction littérale « Je suis » et sa possible résonance théologique sont conservées en note.
- source_word: μὴ φοβεῖσθε
  choice: N’ayez pas peur
  rationale: Expression française courante qui rend l’interdiction ou l’exhortation négative sans surinterpréter l’aspect verbal.
theological_decisions:
- issue: Faut-il comprendre ἐγώ εἰμι comme une simple formule d’identification ou comme un écho explicite à l’auto-désignation divine ?
  choice: Le texte principal porte « C’est moi », selon le sens immédiat d’identification dans le récit.
  alternative: « Je suis »; éventuellement « C’est bien moi » pour la seule identification.
  rationale: Le contexte montre Jésus rassurant les disciples en se faisant reconnaître. La note préserve cependant la forme grecque plus littérale et la possible résonance de l’auto-désignation divine, sans imposer ni exclure cette lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation vive rend les trois brèves paroles rassurantes de Jésus; la syntaxe narrative est allégée naturellement sans perte de contenu.
