  text: τετάρτῃ δὲ φυλακῇ τῆς νυκτὸς ⸀ἦλθεν πρὸς ⸀αὐτοὺς περιπατῶν ἐπὶ ⸂τὴν θάλασσαν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/025.yaml
  text: And in the fourth watch of the night he came to them[b][a], walking on the sea.
translation:
  language: fr
  text: À la quatrième veille de la nuit[b], il vint vers eux en marchant sur la mer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains comprennent : « en marchant au bord de la mer » ; mais le contexte indique fortement qu’il marchait sur l’eau elle-même.'
    reason: alternative_reading
  - marker: b
    text: La « quatrième veille de la nuit » était la dernière période de garde nocturne, approximativement entre 3 heures et 6 heures du matin selon le système romain.
    reason: cultural_note
lexical_decisions:
- source_word: τετάρτῃ ... φυλακῇ τῆς νυκτός
  choice: À la quatrième veille de la nuit
  rationale: Le datif a une valeur temporelle. « Veille » conserve le cadre historique du découpage de la nuit, tandis que la note en précise l’horaire approximatif.
- source_word: δὲ
  choice: '[non exprimé séparément]'
  rationale: La particule marque ici une transition narrative légère. En français, l’enchaînement est naturel sans conjonction explicite.
- source_word: ἦλθεν πρὸς αὐτούς
  choice: il vint vers eux
  rationale: La construction exprime un déplacement en direction des disciples. « Vint vers eux » garde cette orientation tout en restant naturel dans un récit au registre digne.
- source_word: περιπατῶν
  choice: en marchant
  rationale: Le participe présent décrit une action simultanée à celle du verbe principal.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: sur la mer
  rationale: Avec « marcher » et dans ce contexte, la préposition désigne le déplacement sur la surface de l’eau. « Mer » rend directement θάλασσα sans remplacer le terme par l’identification géographique « lac ».
theological_decisions:
- issue: Description miraculeuse du déplacement de Jésus sur l’eau
  choice: en marchant sur la mer
  alternative: en marchant au bord de la mer
  rationale: La syntaxe et le contexte indiquent fortement un déplacement sur l’eau elle-même. La formulation conserve le sens manifeste du récit sans atténuer son caractère miraculeux ni l’amplifier.
translation_notes:
  register: Français international moderne, clair et digne. « Vint » maintient une tonalité narrative soutenue sans archaïsme excessif ; « veille » conserve le repère culturel ancien, expliqué en note.
