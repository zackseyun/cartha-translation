  text: βλέπων δὲ τὸν ἄνεμον ⸀ἰσχυρὸν ἐφοβήθη, καὶ ἀρξάμενος καταποντίζεσθαι ἔκραξεν λέγων· Κύριε, σῶσόν με.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/030.yaml
  text: But seeing the strong wind[a], he became afraid, and beginning to sink, he cried out, saying, “Lord[b], save me.”
translation:
  language: fr
  text: 'Mais, voyant que le vent était fort[a], il prit peur et, comme il commençait à s’enfoncer, il cria : « Seigneur, sauve-moi[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le vent violent ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « viens à mon secours ». Le verbe grec peut désigner la délivrance d’un danger immédiat aussi bien que le salut dans un sens plus large.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπων δὲ
  choice: Mais, voyant
  rationale: Le participe présent exprime une perception simultanée, tandis que δὲ marque le contraste avec la marche de Pierre qui précédait.
- source_word: τὸν ἄνεμον ἰσχυρόν
  choice: que le vent était fort
  rationale: Cette tournure prédicative est naturelle en français et rend directement la force du vent sans en exagérer la violence.
- source_word: ἐφοβήθη
  choice: il prit peur
  rationale: La formulation exprime naturellement l’apparition soudaine de la peur suggérée ici par l’aoriste.
- source_word: ἀρξάμενος καταποντίζεσθαι
  choice: comme il commençait à s’enfoncer
  rationale: Le rendu conserve l’idée d’un processus qui débute. « S’enfoncer » convient à la scène sans anticiper une noyade accomplie.
- source_word: ἔκραξεν λέγων
  choice: il cria
  rationale: En français, les deux formes grecques sont rendues avec naturel par un seul verbe suivi du discours direct; « cria » maintient l’intensité et l’urgence.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » est le rendu français normal de κύριε dans cette adresse directe à Jésus et en préserve la portée sans la préciser davantage.
- source_word: σῶσόν με
  choice: sauve-moi
  rationale: L’impératif exprime un appel urgent. « Sauve-moi » convient au danger physique immédiat tout en conservant l’étendue sémantique possible de σῴζω.
theological_decisions:
- issue: Traduction de κύριος dans une adresse directe à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » conserve la formulation habituelle et la portée christologique possible de l’adresse, sans imposer une interprétation allant au-delà du texte.
- issue: Traduction de σῴζω face à un danger immédiat
  choice: sauve-moi
  alternative: viens à mon secours
  rationale: Le contexte concerne bien un péril physique, mais « sauve-moi » demeure direct, idiomatique et préserve la résonance plus large du verbe grec.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe participiale grecque est légèrement restructurée pour assurer un récit naturel, sans supprimer la simultanéité des actions ni l’urgence de l’appel.
