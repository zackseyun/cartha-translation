    rationale: Le grec τοῦ βαπτιστοῦ est un titre descriptif, mais l’équivalent français établi et naturel est « le Baptiste ». Ce rendu ne réduit pas la valeur titulale du grec.
  - severity: low
    issue: « Poussée par sa mère » risque de surcharger l’idée d’incitation.
    rationale: προβιβασθεῖσα décrit une influence ou une suggestion antérieure. « Conseillée par sa mère » préserve cette relation sans impliquer nécessairement une contrainte.
