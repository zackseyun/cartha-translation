source:
  edition: SBLGNT
  text: ἡ δὲ προβιβασθεῖσα ὑπὸ τῆς μητρὸς αὐτῆς· Δός μοι, φησίν, ὧδε ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/008.yaml
  text: And she, having been prompted by her mother, says, “Give me here on a platter the head of John the Baptizer.”
translation:
  language: fr
  text: 'Conseillée par sa mère, elle dit : « Donne-moi ici, sur un plat, la tête de Jean le Baptiste[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la forme traditionnelle : « Jean-Baptiste ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προβιβασθεῖσα
  choice: Poussée
  rationale: Le participe passif exprime l’influence préalable de la mère. « Poussée » rend naturellement cette incitation sans préciser indûment s’il s’agissait d’un ordre ou d’un conseil.
- source_word: ὑπὸ τῆς μητρὸς αὐτῆς
  choice: par sa mère
  rationale: Avec le génitif, ὑπό indique ici l’agent de la construction passive.
- source_word: Δός μοι
  choice: Donne-moi
  rationale: L’impératif aoriste est rendu par un ordre direct et idiomatique en français.
- source_word: φησίν
  choice: elle dit
  rationale: Le présent historique grec est conservé afin de maintenir la vivacité du récit.
- source_word: ὧδε
  choice: ici
  rationale: Ce déictique désigne directement le lieu où se tient la jeune fille et peut aussi suggérer l’exécution immédiate de la demande.
- source_word: ἐπὶ πίνακι
  choice: sur un plat
  rationale: Dans le cadre du banquet, πίναξ désigne un plat ou plateau de service. « Plat » est clair, naturel et précis en français international.
- source_word: τὴν κεφαλὴν
  choice: la tête
  rationale: La formulation directe conserve la précision macabre du récit.
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: Jean le Baptiseur
  rationale: « Baptiseur » conserve la valeur descriptive du nom d’agent grec βαπτιστής; la forme française traditionnelle est signalée en note.
theological_decisions:
- issue: Traduction du titre βαπτιστής donné à Jean
  choice: Jean le Baptiseur
  alternative: Jean-Baptiste
  rationale: Le grec présente un titre décrivant l’activité de Jean. « Le Baptiseur » en garde la valeur descriptive, tandis que « Jean-Baptiste », forme traditionnelle très familière, est conservé en note sans imposer une distinction doctrinale.
translation_notes:
  register: Français moderne, digne et direct. La phrase place le participe en tête pour éviter une tournure lourde, tout en conservant sa relation temporelle et causale avec la parole de la jeune fille. Le présent narratif « elle dit » reflète le présent historique grec.
