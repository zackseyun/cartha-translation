  text: But he said[a], “Bring them here to me.”
translation:
  language: fr
  text: 'Mais il dit[a] : « Apportez-les-moi ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les pains et les poissons mentionnés au verset précédent.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule δέ marque ici une légère opposition entre l’objection des disciples et la réponse de Jésus ; « Mais » l’exprime naturellement sans accentuer excessivement le contraste.
- source_word: εἶπεν
  choice: il dit
  rationale: L’aoriste de λέγω signifie simplement « dire ». Le présent de narration français « il dit » convient naturellement à cette réplique directe.
- source_word: Φέρετέ
  choice: Apportez
  rationale: L’impératif présent actif, deuxième personne du pluriel, demande aux disciples de faire venir les aliments jusqu’à Jésus ; « Apportez » est précis et idiomatique.
- source_word: μοι
  choice: -moi
  rationale: Le datif μοι indique le destinataire. En français, le pronom conjoint dans « Apportez-les-moi » rend cette relation avec naturel.
- source_word: ὧδε
  choice: ici
  rationale: L’adverbe de lieu ὧδε signifie « ici » et conserve l’indication spatiale du texte grec.
- source_word: αὐτούς
  choice: les
  rationale: Le pronom masculin pluriel renvoie, dans le contexte, aux pains et aux poissons du verset précédent. Le pronom français « les » préserve cette reprise sans alourdir le texte.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation concise conserve l’ordre et la force simple de la réponse de Jésus ; le référent du pronom est précisé en note.
