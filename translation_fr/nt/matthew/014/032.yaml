id: MAT.14.32
reference: Matthew 14:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἀναβάντων αὐτῶν εἰς τὸ πλοῖον ἐκόπασεν ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/032.yaml
  text: And when they got into the boat[a], the wind ceased.
translation:
  language: fr
  text: Et quand ils furent montés dans la barque[a], le vent tomba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « après qu’ils furent montés dans la barque ».'
    reason: Le génitif absolu grec peut être rendu par une proposition temporelle introduite par « quand » ou par « après que ».
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conserve la continuité narrative exprimée par καί sans ajouter une valeur temporelle plus précise.
- source_word: ἀναβάντων αὐτῶν
  choice: quand ils furent montés
  rationale: Le génitif absolu a une valeur temporelle. Cette formulation française naturelle conserve aussi l’idée littérale de monter, couramment employée avec une embarcation.
- source_word: εἰς τὸ πλοῖον
  choice: dans la barque
  rationale: Dans ce contexte galiléen, πλοῖον désigne l’embarcation des disciples. « Barque » est courant, précis et mieux adapté que « navire ».
- source_word: ἐκόπασεν
  choice: tomba
  rationale: Pour le vent, « tomber » exprime idiomatiquement le fait de cesser ou de s’apaiser, sans introduire un processus graduel absent de l’aoriste grec.
- source_word: ὁ ἄνεμος
  choice: le vent
  rationale: Équivalent direct et naturel du sujet grec articulé.
theological_decisions:
- issue: Portée narrative de l’autorité de Jésus sur la nature
  choice: Rapporter sobrement que le vent tomba une fois qu’ils furent montés dans la barque.
  alternative: Expliciter dans la traduction que Jésus fit miraculeusement cesser le vent.
  rationale: Le contexte fait ressortir la portée théologique de l’événement, mais le grec de ce verset n’en donne pas d’explication causale explicite. La traduction ne doit donc pas l’ajouter.
translation_notes:
  register: Français international moderne, digne et accessible. « Furent montés » maintient un ton narratif soutenu sans archaïsme marqué; « le vent tomba » est idiomatique et concis.
source_grounding:
  english_pob_role: consult_only
