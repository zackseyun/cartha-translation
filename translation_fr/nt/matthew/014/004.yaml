  text: ἔλεγεν γὰρ ⸂αὐτῷ ὁ Ἰωάννης⸃· Οὐκ ἔξεστίν σοι ἔχειν αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/004.yaml
  text: For John had been saying to him[a], “It is not lawful for you to have her.”
translation:
  language: fr
  text: 'Car Jean lui disait : « Il ne t’est pas permis de l’avoir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: disait
  rationale: L’imparfait grec présente une parole passée dans son déroulement ou sa répétition. L’imparfait français « disait » en conserve naturellement l’aspect sans imposer l’idée plus marquée de répétition que donnerait « répétait ».
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication de ce qui précède. « Car » préserve clairement ce lien explicatif dans un registre narratif digne.
- source_word: αὐτῷ
  choice: lui
  rationale: Le datif désigne le destinataire des paroles de Jean et se rend idiomatiquement par le pronom indirect « lui ».
- source_word: ὁ Ἰωάννης
  choice: Jean
  rationale: Le grec nomme simplement Jean; le contexte immédiat suffit à l’identifier, sans qu’il soit nécessaire d’ajouter « le Baptiste ».
- source_word: Οὐκ ἔξεστίν σοι
  choice: Tu n’as pas le droit
  rationale: ἔξεστιν exprime ce qui est permis ou autorisé. « Tu n’as pas le droit » restitue en français moderne la force juridique et morale de l’interdiction, plus naturellement que « Il ne t’est pas permis ».
- source_word: ἔχειν
  choice: de l’avoir
  rationale: Le verbe signifie littéralement « avoir »; dans ce contexte, il désigne le fait d’avoir cette femme comme épouse ou compagne. La formulation retenue préserve la concision et l’implicite du grec.
- source_word: αὐτήν
  choice: l’
  rationale: Le pronom féminin renvoie directement à Hérodiade. Le français emploie naturellement le pronom élidé devant « avoir », sans expliciter « pour femme ».
theological_decisions:
- issue: Nature de la réprimande de Jean
  choice: « Tu n’as pas le droit de l’avoir »
  alternative: « Il ne t’est pas permis de l’avoir » ou « Ce n’est pas bien que tu l’aies »
  rationale: Le texte porte sur la permission ou la légitimité, et non seulement sur une appréciation générale du bien et du mal. La traduction retenue garde cette force juridico-morale sans préciser explicitement la loi invoquée.
translation_notes:
  register: Français international moderne, direct et digne. La syntaxe reste naturelle à l’oral comme à la lecture publique. Aucun ajout explicatif tel que « pour femme » n’est introduit, afin de préserver l’implicite de l’original.
