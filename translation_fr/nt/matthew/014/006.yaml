source:
  edition: SBLGNT
  text: ⸂γενεσίοις δὲ γενομένοις⸃ τοῦ Ἡρῴδου ὠρχήσατο ἡ θυγάτηρ τῆς Ἡρῳδιάδος ἐν τῷ μέσῳ καὶ ἤρεσεν τῷ Ἡρῴδῃ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/006.yaml
  text: But when Herod’s birthday came[a], the daughter of Herodias danced in the midst and pleased Herod[b],
translation:
  language: fr
  text: Mais lors de la célébration de l’anniversaire d’Hérode[a], la fille d’Hérodiade dansa au milieu[b] et plut à Hérode,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autres traductions possibles : « quand arriva l’anniversaire d’Hérode » ou « pendant le banquet d’anniversaire d’Hérode ». Le grec désigne l’occasion où son anniversaire était célébré.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « au milieu ». Il s’agit probablement du milieu des personnes rassemblées.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενεσίοις ... γενομένοις
  choice: lors de la célébration de l’anniversaire d’Hérode
  rationale: Le datif γενεσίοις, associé à γενομένοις, situe l’action au moment où l’anniversaire est célébré. Cette formulation française exprime naturellement l’occasion festive plutôt que la seule date anniversaire.
- source_word: δὲ
  choice: Mais
  rationale: δέ assure ici la progression du récit tout en marquant un léger contraste avec ce qui précède; « Mais » convient au contexte.
- source_word: ὠρχήσατο
  choice: dansa
  rationale: Le verbe ὀρχέομαι signifie simplement « danser »; aucun détail supplémentaire sur la nature de la danse n’est exprimé.
- source_word: ἡ θυγάτηρ τῆς Ἡρῳδιάδος
  choice: la fille d’Hérodiade
  rationale: Cette traduction rend directement le rapport génitif sans identifier la fille par un nom absent du texte grec.
- source_word: ἐν τῷ μέσῳ
  choice: au milieu
  rationale: La formulation conserve le sens spatial littéral et l’ambiguïté du grec, sans préciser explicitement de qui ou de quoi elle se trouvait au milieu.
- source_word: ἤρεσεν τῷ Ἡρῴδῃ
  choice: plut à Hérode
  rationale: ἀρέσκω avec le datif signifie « plaire à »; cette tournure est exacte, naturelle et sans embellissement.
- source_word: Ἡρῴδου / Ἡρῴδῃ
  choice: Hérode
  rationale: Forme française traditionnelle et courante du nom propre grec.
theological_decisions: []
