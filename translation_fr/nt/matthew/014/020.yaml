    issue: Construction « paniers pleins des morceaux qui restaient »
    rationale: Après « plein », le français emploie normalement « de » pour indiquer le contenu. « Pleins de morceaux restés » rend clairement πλήρεις avec les κλάσματα restants.
  - severity: low
    issue: La note ajoute « probablement »
    rationale: Cette qualification ne correspond pas à une ambiguïté lexicale du grec. Une note peut expliquer que κλάσματα désigne des morceaux brisés restés après le repas, sans ajouter cette réserve.
