  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ἦραν τὸ περισσεῦον τῶν κλασμάτων δώδεκα κοφίνους πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/020.yaml
  text: And they all ate and were satisfied[a], and they picked up twelve full baskets of the leftover pieces.
translation:
  language: fr
  text: Tous mangèrent et furent rassasiés. Puis on ramassa douze paniers pleins de morceaux restés[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fragments ». Le grec désigne des morceaux brisés restés après le repas.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον πάντες
  choice: Tous mangèrent
  rationale: Le passé simple convient à la succession narrative et πάντες garde sa portée universelle sur l’ensemble des personnes présentes.
- source_word: ἐχορτάσθησαν
  choice: furent rassasiés
  rationale: Le passif de χορτάζω exprime qu’ils mangèrent pleinement, jusqu’à satiété; «furent rassasiés» est précis, naturel et digne.
- source_word: ἦραν
  choice: on ramassa
  rationale: Dans le contexte de la collecte des restes, «ramassa» rend naturellement l’action de prendre et recueillir; le pronom indéfini évite d’identifier un sujet que le grec laisse implicite.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: des morceaux qui restaient
  rationale: Cette formulation rend le participe substantivé περισσεῦον et le génitif τῶν κλασμάτων sans lourdeur, tout en conservant l’idée de morceaux subsistant après le repas.
- source_word: δώδεκα κοφίνους πλήρεις
  choice: douze paniers pleins
  rationale: Rendu direct du nombre, du nom κόφινος et de l’adjectif πλήρεις, dans un ordre français naturel.
theological_decisions:
- issue: La pleine suffisance de la nourriture miraculeusement fournie
  choice: furent rassasiés
  alternative: mangèrent à leur faim
  rationale: «Furent rassasiés» préserve le passif grec et affirme simplement la satiété complète, sans ajouter d’interprétation théologique au récit.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. Le passé simple maintient le registre narratif biblique naturel. «Puis» explicite légèrement la progression marquée par καί sans modifier le contenu.
