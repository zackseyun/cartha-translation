  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ἐλθέ. καὶ καταβὰς ἀπὸ τοῦ ⸀πλοίου Πέτρος περιεπάτησεν ἐπὶ τὰ ὕδατα ⸂καὶ ἦλθεν⸃ πρὸς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/029.yaml
  text: And he said[a], “Come.” So Peter got down from the boat, walked on the water, and came toward Jesus.
translation:
  language: fr
  text: 'Il dit : « Viens ! » Pierre descendit alors de la barque, marcha sur l’eau et vint vers Jésus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « et vint jusqu’à Jésus ». Le grec souligne le mouvement dans sa direction, sans nécessairement préciser que Pierre l’a atteint.
    reason: Préserver la nuance directionnelle de πρὸς et signaler l’autre rendu possible du verbe de mouvement.
lexical_decisions:
- source_word: Ἐλθέ
  choice: Viens !
  rationale: L’impératif aoriste de ἔρχομαι exprime ici une invitation ou un ordre direct. « Viens ! » est la formulation française la plus naturelle et la plus concise.
- source_word: καταβὰς ἀπὸ τοῦ πλοίου
  choice: descendit de la barque
  rationale: Le participe aoriste καταβάς indique une action antérieure aux verbes principaux. La coordination française rend naturellement la succession des actions sans alourdir la phrase par « étant descendu ».
- source_word: πλοίου
  choice: barque
  rationale: Dans le cadre du lac de Galilée, « barque » est un équivalent français courant et contextuellement approprié de πλοῖον.
- source_word: περιεπάτησεν
  choice: marcha
  rationale: Dans ce contexte, περιπατέω désigne simplement l’action de marcher, sans qu’il soit nécessaire d’ajouter « se mit à ».
- source_word: ἐπὶ τὰ ὕδατα
  choice: sur l’eau
  rationale: Avec l’accusatif, ἐπί décrit ici le déplacement sur la surface. Le singulier collectif « l’eau » est idiomatique en français moderne.
- source_word: καὶ ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: et vint vers Jésus
  rationale: « Vint » rend ἦλθεν, tandis que « vers » conserve la valeur directionnelle de πρός sans affirmer explicitement que Pierre atteignit Jésus.
- source_word: δὲ
  choice: alors
  rationale: δέ assure une transition narrative légère. Placé dans la seconde phrase, « alors » maintient l’enchaînement sans introduire un contraste absent du contexte.
theological_decisions:
- issue: Le mouvement de Pierre en direction de Jésus
  choice: vint vers Jésus
  alternative: vint jusqu’à Jésus
  rationale: La préposition πρός indique le mouvement en direction de Jésus, mais n’impose pas à elle seule l’idée d’une arrivée accomplie. La traduction conserve ainsi la progression et la tension du récit.
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient à la narration biblique écrite tout en restant immédiatement compréhensible. La ponctuation de « Viens ! » restitue la force naturelle de l’impératif.
