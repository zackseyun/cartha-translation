id: MAT.14.35
reference: Matthew 14:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπιγνόντες αὐτὸν οἱ ἄνδρες τοῦ τόπου ἐκείνου ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην, καὶ προσήνεγκαν αὐτῷ πάντας τοὺς κακῶς ἔχοντας,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/035.yaml
  text: And when the men of that place recognized him[a], they sent into that whole surrounding region and brought to him all who were sick[b],
translation:
  language: fr
  text: Quand les hommes de cet endroit l’eurent reconnu, ils envoyèrent[a] dans toute la région environnante et lui amenèrent tous les malades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « ils envoyèrent dans toute cette région environnante » ; le grec ne précise pas ce qui est envoyé (un message ou des messagers).
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνόντες αὐτόν
  choice: Après l’avoir reconnu
  rationale: Le participe aoriste exprime ici la reconnaissance de Jésus par les habitants; la tournure temporelle française rend naturellement le rapport avec l’action principale.
- source_word: οἱ ἄνδρες τοῦ τόπου ἐκείνου
  choice: les hommes de cet endroit
  rationale: ἄνδρες désigne explicitement des hommes, tandis que τόπος renvoie à la localité où Jésus vient d’arriver.
- source_word: ἀπέστειλαν εἰς ὅλην τὴν περίχωρον ἐκείνην
  choice: envoyèrent des messagers dans toute la région environnante
  rationale: Le grec laisse l’objet de «envoyèrent» implicite. En français, «des messagers» explicite sobrement ce qui est envoyé et s’accorde avec la suite, où les malades sont amenés à Jésus.
- source_word: προσήνεγκαν αὐτῷ
  choice: lui amenèrent
  rationale: Dans ce contexte, προσφέρω signifie amener des personnes auprès de Jésus, sans connotation sacrificielle.
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: tous les malades
  rationale: κακῶς ἔχειν est une expression idiomatique signifiant être malade ou souffrant; «tous les malades» est précis, concis et naturel.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La phrase reste proche de la structure grecque, tout en explicitant l’objet sous-entendu de ἀπέστειλαν afin d’éviter en français une construction obscure ou incomplète.
