  rationale: La révision supprime les causatifs non requis afin de suivre plus directement les trois verbes actifs grecs, tout en gardant le plus-que-parfait explicatif, le sens concret de « lier », la cause indiquée par διά et la désignation neutre d’Hérodiade.
