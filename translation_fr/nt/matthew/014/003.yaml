review_pass:
  verdict: revise
  source_fidelity: 'Le sens global est bien rendu : l’explication introduite par γάρ, l’arrestation, les liens, l’emprisonnement, le motif lié à Hérodiade et l’identification de Philippe comme frère d’Hérode sont tous conservés. Toutefois, la triple formulation causative (« avait fait arrêter… avait fait attacher et mettre ») interprète les verbes grecs actifs directs comme des ordres donnés. Cette interprétation est possible dans le cadre de l’autorité d’Hérode, mais elle n’est pas nécessaire et s’éloigne légèrement de la formulation source.'
  naturalness: Le français est globalement clair et d’un registre convenable. Néanmoins, « l’avait fait attacher et mettre en prison » est moins fluide et crée une accumulation de causatifs. Une formulation active simple est à la fois plus naturelle et plus proche du grec.
  terminology: Les noms propres, « Hérodiade » et « Philippe », sont corrects. « à cause d’Hérodiade » rend bien διά avec l’accusatif. « la femme de son frère Philippe » restitue sans ajout moral la relation exprimée dans le texte. « lier » maintient le sens de δέω sans préciser des chaînes ou des cordes.
  issues:
  - severity: low
    issue: Causatifs superflus dans la chaîne des actions d’Hérode
    rationale: κρατήσας, ἔδησεν et ἀπέθετο présentent Hérode comme sujet des actions. Le français peut employer un causatif pour un souverain, mais le grec ne l’exige pas; le maintien d’actions actives évite cette interprétation additionnelle et améliore la fluidité.
  revised_text: En effet, Hérode avait arrêté Jean, l’avait lié et l’avait mis en prison à cause d’Hérodiade, la femme de son frère Philippe.
