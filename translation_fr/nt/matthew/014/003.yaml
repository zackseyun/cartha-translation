id: MAT.14.3
reference: Matthew 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ γὰρ Ἡρῴδης κρατήσας τὸν Ἰωάννην ἔδησεν ⸀αὐτὸν καὶ ⸂ἐν φυλακῇ ἀπέθετο⸃ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/003.yaml
  text: For Herod had arrested John[a], bound him, and put him in prison because of Herodias, the wife of Philip his brother,
translation:
  language: fr
  text: En effet, Hérode avait arrêté Jean, l’avait lié et l’avait mis en prison à cause d’Hérodiade, la femme de son frère Philippe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Rend la fonction explicative du verset par rapport au contexte précédent, dans un français naturel.
- source_word: κρατήσας
  choice: avait fait arrêter
  rationale: Le participe aoriste exprime ici une action antérieure aux verbes principaux; dans ce contexte de détention officielle, « faire arrêter » est plus idiomatique que « saisir ».
- source_word: ἔδησεν
  choice: l’avait fait attacher
  rationale: Conserve le sens concret de δέω sans préciser indûment s’il s’agissait de cordes ou de chaînes; la tournure causative convient à l’action d’un dirigeant.
- source_word: ἐν φυλακῇ ἀπέθετο
  choice: mettre en prison
  rationale: Expression française courante qui communique clairement l’incarcération désignée par la locution grecque.
- source_word: διὰ Ἡρῳδιάδα
  choice: à cause d’Hérodiade
  rationale: διά avec l’accusatif indique ici la cause ou le motif.
- source_word: γυναῖκα
  choice: la femme
  rationale: Dans cette relation génitivale, γυνή désigne l’épouse; « la femme de » est une formulation française naturelle.
- source_word: Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: de son frère Philippe
  rationale: Rend clairement l’apposition grecque et indique que Philippe est le frère d’Hérode, sans lourdeur.
theological_decisions:
- issue: Présentation historico-morale de la relation d’Hérodiade avec Philippe
  choice: Identifier sobrement Hérodiade comme « la femme de son frère Philippe ».
  alternative: Expliciter dès ce verset que son union avec Hérode était illégitime.
  rationale: Le verset identifie Hérodiade par sa relation avec Philippe, mais ne formule pas encore le jugement explicite donné au verset suivant; la traduction ne doit pas l’anticiper.
translation_notes:
  register: Français international moderne, clair et digne. La succession des causatifs (« avait fait arrêter… fait attacher et mettre ») reflète naturellement des actes accomplis sous l’autorité d’Hérode, tout en gardant la séquence du grec.
