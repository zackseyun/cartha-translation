source:
  edition: SBLGNT
  text: ὀψίας δὲ γενομένης προσῆλθον αὐτῷ οἱ ⸀μαθηταὶ λέγοντες· Ἔρημός ἐστιν ὁ τόπος καὶ ἡ ὥρα ἤδη παρῆλθεν· ἀπόλυσον τοὺς ὄχλους, ἵνα ἀπελθόντες εἰς τὰς κώμας ἀγοράσωσιν ἑαυτοῖς βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/015.yaml
  text: When evening came[a], the disciples came to him and said, “The place is deserted, and the hour is already late. Send the crowds away[b], so that they may go into the villages and buy food for themselves.”
translation:
  language: fr
  text: 'Le soir venu, les disciples s’approchèrent de lui et dirent : « L’endroit est désert[a], et il est déjà tard[b]. Renvoie les foules, pour qu’elles aillent dans les villages s’acheter de quoi manger. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « isolé ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’heure est déjà passée ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας δὲ γενομένης
  choice: Le soir venu
  rationale: Le génitif absolu marque une transition temporelle. Cette tournure française est naturelle et concise; la nuance de progression narrative portée par δέ ressort de l’enchaînement sans ajout d’un adverbe explicite.
- source_word: προσῆλθον αὐτῷ
  choice: s’approchèrent de lui
  rationale: προσέρχομαι signifie ici venir auprès de quelqu’un ou s’en approcher. « S’approchèrent de lui » convient au registre narratif et reste précis.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: L’article désigne le groupe déjà connu. Aucun possessif, absent du grec, n’est ajouté.
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: L’endroit est désert
  rationale: ἔρημος décrit ici un lieu inhabité ou éloigné des localités, non nécessairement un désert géographique. « L’endroit est désert » préserve cette portée.
- source_word: ἡ ὥρα ἤδη παρῆλθεν
  choice: il se fait déjà tard
  rationale: Littéralement, « l’heure est déjà passée ». Le français idiomatique exprime ici l’avancement de la journée par « il se fait déjà tard », tandis qu’une note conserve la formulation littérale.
- source_word: ἀπόλυσον τοὺς ὄχλους
  choice: Renvoie les foules
  rationale: Dans ce contexte, ἀπολύω signifie congédier ou faire partir. L’impératif « Renvoie » restitue directement la demande.
- source_word: ἵνα ἀπελθόντες εἰς τὰς κώμας
  choice: pour qu’elles aillent dans les villages
  rationale: La proposition introduite par ἵνα exprime le but. Le participe ἀπελθόντες est intégré naturellement au verbe « aillent » sans perdre l’idée de déplacement.
- source_word: ἀγοράσωσιν ἑαυτοῖς βρώματα
  choice: s’acheter de quoi manger
  rationale: Cette formulation courante rend à la fois l’achat, le réfléchi ἑαυτοῖς et le sens alimentaire de βρώματα.
