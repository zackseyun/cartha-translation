id: MAT.14.24
reference: Matthew 14:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ δὲ πλοῖον ἤδη ⸂σταδίους πολλοὺς ἀπὸ τῆς γῆς ἀπεῖχεν⸃, βασανιζόμενον ὑπὸ τῶν κυμάτων, ἦν γὰρ ἐναντίος ὁ ἄνεμος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/024.yaml
  text: But the boat was already many stadia from the land[a], being battered by the waves[c][b], for the wind was against it.
translation:
  language: fr
  text: Mais la barque était déjà à de nombreux stades de la terre ferme[a] et se trouvait malmenée par les vagues, car le vent était contraire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la rive ». Le grec dit littéralement « de la terre ». Un stade était une ancienne unité de longueur d’environ 185 mètres.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: πλοῖον
  choice: barque
  rationale: Dans le contexte d’une traversée du lac de Galilée, « barque » est le terme français naturel et n’exagère pas la taille de l’embarcation.
- source_word: ἤδη
  choice: déjà
  rationale: Le mot indique que cette situation s’était installée à ce point du récit.
- source_word: σταδίους πολλοὺς
  choice: à de nombreux stades
  rationale: La mesure ancienne est conservée pour refléter précisément le grec; sa valeur approximative est expliquée en note.
- source_word: ἀπὸ τῆς γῆς
  choice: de la terre ferme
  rationale: γῆ désigne ici la terre par opposition à l’eau. « La terre ferme » est naturel en français, tandis que « la rive » demeure une possibilité contextuelle signalée en note.
- source_word: ἀπεῖχεν
  choice: était ... à ... de
  rationale: Cette restructuration idiomatique exprime en français la distance spatiale indiquée par ἀπέχω.
- source_word: βασανιζόμενον
  choice: se trouvait malmenée
  rationale: Dans ce contexte maritime, le participe décrit l’embarcation rudement éprouvée par les vagues. « Malmenée » conserve la force de l’image sans suggérer une souffrance psychologique littérale de la barque.
- source_word: ὑπὸ τῶν κυμάτων
  choice: par les vagues
  rationale: Traduction directe et naturelle de l’agent ou de la cause du mauvais traitement subi par la barque.
- source_word: ἐναντίος
  choice: contraire
  rationale: L’expression française « le vent était contraire » rend naturellement l’idée d’un vent opposé à la progression de la barque, sans ajouter de complément absent du grec.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une transition avec un léger contraste entre Jésus resté à terre et la situation difficile de la barque.
- source_word: γάρ
  choice: car
  rationale: « Car » préserve clairement et avec concision la relation explicative introduite par γάρ.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La mesure antique est maintenue afin de préserver la forme précise du texte source, avec une explication en note. L’expression idiomatique « vent contraire » évite d’ajouter le pronom explicite présent dans la consultation anglaise mais absent du grec.
