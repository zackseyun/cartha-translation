  text: καὶ ⸂λυπηθεὶς ὁ βασιλεὺς διὰ⸃ τοὺς ὅρκους καὶ τοὺς συνανακειμένους ἐκέλευσεν δοθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/009.yaml
  text: And the king[a], though grieved, because of his oaths and those dining with him[b], commanded it to be given.
translation:
  language: fr
  text: Bien qu’attristé, le roi, à cause de ses serments et de ceux qui étaient à table avec lui[a], ordonna que ce qui avait été demandé soit donné[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui étaient allongés à table avec lui ». C’était la posture habituelle lors des repas dans ce contexte culturel.'
    reason: cultural_note
  - marker: b
    text: Le grec dit littéralement « être donné » et laisse le complément implicite ; il renvoie à ce qui a été demandé dans le contexte précédent.
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπηθεὶς
  choice: Bien qu’attristé
  rationale: Le participe aoriste passif exprime la peine éprouvée par le roi. La tournure concessive rend la tension contextuelle entre son chagrin et l’ordre qu’il donne néanmoins.
- source_word: ὁ βασιλεὺς
  choice: le roi
  rationale: Traduction directe de βασιλεύς, qui conserve le titre employé par le récit.
- source_word: διὰ τοὺς ὅρκους
  choice: à cause de ses serments
  rationale: διά avec l’accusatif indique ici la cause. Le possessif « ses » est explicité naturellement d’après le contexte.
- source_word: τοὺς συνανακειμένους
  choice: ceux qui étaient à table avec lui
  rationale: L’expression désigne les personnes allongées à table avec lui selon l’usage antique. Cette formulation française actuelle rend clairement la situation sans imposer dans le corps du texte le détail culturel de la posture.
- source_word: ἐκέλευσεν
  choice: ordonna
  rationale: κελεύω exprime un ordre donné avec autorité; « ordonna » convient au registre narratif et au statut du roi.
- source_word: δοθῆναι
  choice: qu’on la lui donne
  rationale: L’infinitif passif signifie littéralement « être donné ». Le français exige ici d’expliciter grammaticalement le référent et le bénéficiaire, tous deux immédiatement identifiables dans le contexte précédent, sans préciser davantage la nature de la demande.
