- from: Bien qu’attristé, le roi, à cause de ses serments et de ceux qui étaient à table avec lui[a], ordonna qu’on la lui donne[b].
  to: Bien qu’attristé, le roi, à cause de ses serments et de ceux qui étaient à table avec lui[a], ordonna que ce qui avait été demandé soit donné[b].
  rationale: La révision maintient la valeur concessive, la causalité liée aux serments et aux convives, ainsi que la voix passive de δοθῆναι. « Ce qui avait été demandé » rend l’implicite intelligible en français sans imposer le terme précis de la demande ni le représenter par un pronom genré. La note b est corrigée pour décrire exactement la construction grecque.
