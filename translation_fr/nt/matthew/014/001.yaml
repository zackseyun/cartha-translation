lexical_decisions:
- source_word: Ἐν ἐκείνῳ τῷ καιρῷ
  choice: À cette époque-là
  rationale: Cette tournure rend naturellement le repère temporel grec en français moderne, sans reproduire servilement sa structure.
- source_word: ἤκουσεν
  choice: entendit parler
  rationale: Avec le complément τὴν ἀκοὴν Ἰησοῦ, cette expression idiomatique exprime le fait qu’Hérode reçut des informations au sujet de Jésus, tout en restant proche du sens d’ἀκούω.
- source_word: Ἡρῴδης
  choice: Hérode
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: ὁ τετραάρχης
  choice: le tétrarque
  rationale: Le titre historique précis est bien établi en français et évite une paraphrase approximative de la fonction.
- source_word: τὴν ἀκοὴν Ἰησοῦ
  choice: parler de Jésus
  rationale: Dans ce contexte, ἀκοή désigne ce qui est entendu, c’est-à-dire les nouvelles ou la renommée concernant Jésus. La locution française « entendre parler de » rend l’ensemble de façon claire et naturelle.
