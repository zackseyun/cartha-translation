  text: ὅθεν μετὰ ὅρκου ὡμολόγησεν αὐτῇ δοῦναι ὃ ⸀ἐὰν αἰτήσηται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/007.yaml
  text: Therefore he promised with an oath to give her whatever she might ask[a].
translation:
  language: fr
  text: C’est pourquoi il lui promit sous serment de lui donner tout ce qu’elle demanderait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quoi qu’elle demande ». Le grec emploie une proposition relative indéfinie (ὃ ἐὰν αἰτήσηται), qui présente la demande future comme ouverte quant à son objet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: C’est pourquoi
  rationale: Marque la conséquence tirée du contexte narratif précédent, dans un français naturel tout en conservant la force causale et résultative.
- source_word: μετὰ ὅρκου
  choice: sous serment
  rationale: Exprime de façon idiomatique que la promesse est confirmée par un serment.
- source_word: ὡμολόγησεν
  choice: il promit
  rationale: Dans ce contexte, le verbe désigne un engagement ferme plutôt qu’un aveu ou une confession.
- source_word: αὐτῇ
  choice: lui
  rationale: Pronom personnel au datif désignant la jeune fille comme bénéficiaire de la promesse.
- source_word: δοῦναι
  choice: de lui donner
  rationale: L’infinitif précise le contenu de la promesse; la reprise de « lui » produit une formulation française claire et naturelle.
- source_word: ὃ ἐὰν αἰτήσηται
  choice: tout ce qu’elle demanderait
  rationale: La relative indéfinie avec ἐάν et le subjonctif envisage une demande future dont l’objet reste entièrement ouvert; le conditionnel français rend naturellement cette éventualité dans le discours narratif.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Sous serment » est idiomatique; « tout ce qu’elle demanderait » conserve le caractère ouvert et éventuel de la demande.
