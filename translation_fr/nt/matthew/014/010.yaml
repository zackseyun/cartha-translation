  text: καὶ πέμψας ἀπεκεφάλισεν ⸀τὸν Ἰωάννην ἐν τῇ φυλακῇ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/010.yaml
  text: And he sent and beheaded John in the prison[a].
translation:
  language: fr
  text: Il envoya décapiter Jean dans la prison.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Et, ayant envoyé, il décapita Jean dans la prison. » Le grec emploie un participe aoriste suivi du verbe principal ; le complément de « ayant envoyé » n’est pas exprimé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: donc
  rationale: Dans ce contexte, καί poursuit le récit en reliant l’exécution à l’ordre évoqué au verset précédent. « Donc » exprime naturellement cette continuité consécutive en français, sans ajouter une nouvelle motivation.
- source_word: πέμψας
  choice: envoya quelqu’un
  rationale: Le participe aoriste de πέμπω indique qu’Hérode dépêche un agent avant l’action principale. En français, l’ajout explicite mais minimal de « quelqu’un » évite de suggérer qu’Hérode se déplace lui-même, tout en préservant la médiation impliquée par le grec.
- source_word: ἀπεκεφάλισεν
  choice: décapiter
  rationale: ἀποκεφαλίζω signifie précisément « décapiter ». La construction causative française « envoya quelqu’un décapiter » attribue l’acte à Hérode tout en indiquant qu’il fut accompli par l’agent envoyé.
- source_word: τὸν Ἰωάννην
  choice: Jean
  rationale: Le texte donne seulement le nom propre, et le contexte immédiat identifie clairement Jean. Ajouter « le Baptiste » introduirait ici un élément absent du verset.
- source_word: ἐν τῇ φυλακῇ
  choice: dans la prison
  rationale: φυλακή désigne ici le lieu concret de détention. « Dans la prison » conserve la précision locative et l’article du grec.
theological_decisions:
- issue: Responsabilité d’Hérode et exécution par un intermédiaire
  choice: « Il envoya donc quelqu’un décapiter Jean »
  alternative: « Il fit décapiter Jean »
  rationale: Le grec attribue grammaticalement la décapitation au sujet tout en mentionnant d’abord l’envoi d’un agent. La formulation choisie conserve à la fois la responsabilité d’Hérode et la médiation, sans réduire le texte à un simple ordre ni faire croire qu’il exécuta Jean personnellement.
translation_notes:
  register: Français moderne, clair et digne. La construction « envoya quelqu’un décapiter » est idiomatique et restitue la séquence ainsi que l’exécution par un agent. Le pronom sujet renvoie à Hérode dans le contexte.
