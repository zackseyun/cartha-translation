  text: καὶ θέλων αὐτὸν ἀποκτεῖναι ἐφοβήθη τὸν ὄχλον, ὅτι ὡς προφήτην αὐτὸν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/005.yaml
  text: And wanting to kill him[a], he feared the crowd[b], because they regarded him as a prophet.
translation:
  language: fr
  text: Voulant le tuer[a], il eut peur de la foule, car elle le tenait pour un prophète[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon concessive : « Bien qu’il veuille le tuer ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la foule le considérait comme un prophète ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλων
  choice: bien qu’il veuille
  rationale: Le participe exprime ici une volonté contrariée par la crainte indiquée par le verbe principal. La tournure concessive rend ce rapport naturellement en français tout en signalant en note la construction plus littérale.
- source_word: ἀποκτεῖναι
  choice: tuer
  rationale: Le verbe signifie directement « tuer » ou « mettre à mort ». « Tuer » est clair et n’ajoute pas la qualification morale qu’impliquerait « assassiner ».
- source_word: ἐφοβήθη
  choice: il eut peur de
  rationale: L’aoriste de φοβέομαι désigne ici la crainte éprouvée envers la foule. Le passé simple convient au récit et « avoir peur de » est plus naturel en français actuel que « craindre » dans cette construction.
- source_word: τὸν ὄχλον
  choice: la foule
  rationale: ὄχλος désigne le groupe nombreux présent dans la scène ; « la foule » est l’équivalent moderne le plus direct.
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison de sa peur. « Car » préserve clairement ce lien causal dans un registre narratif digne.
- source_word: ὡς προφήτην αὐτὸν εἶχον
  choice: elle le tenait pour un prophète
  rationale: La construction ἔχω avec ὡς et un attribut à l’accusatif exprime l’opinion que la foule avait de lui. « Tenir quelqu’un pour » reproduit précisément cette estimation sans affirmer directement qu’il était prophète.
theological_decisions:
- issue: Identité du sujet et de l’objet laissée implicite dans le grec
  choice: Conserver les pronoms « il » et « le » sans ajouter les noms d’Hérode et de Jean
  alternative: « Bien qu’Hérode veuille tuer Jean… »
  rationale: Le contexte immédiat identifie les personnes, mais le verset grec emploie des pronoms. Les conserver évite d’introduire dans le texte des précisions absentes de la formulation source.
- issue: Statut prophétique de Jean
  choice: « le tenait pour un prophète »
  alternative: « savait qu’il était prophète »
  rationale: Le grec rapporte l’opinion de la foule plutôt qu’une affirmation directe du narrateur ; la traduction maintient cette distinction.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le ton narratif. Le singulier « elle » reprend grammaticalement « la foule », conformément au sujet pluriel implicite du grec envisagé collectivement en français.
