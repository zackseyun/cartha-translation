revisions:
- from: Bien qu’il veuille le tuer[a], il eut peur de la foule, car elle le tenait pour un prophète[b].
  to: Voulant le tuer[a], il eut peur de la foule, car elle le tenait pour un prophète[b].
  rationale: La révision restitue le participe grec sans imposer dans le texte une relation concessive qui reste contextuelle. Elle conserve le registre narratif, les pronoms implicites et l’évaluation attribuée à la foule. La note a signale explicitement la lecture concessive possible ; la note b est corrigée pour être grammaticalement et sémantiquement cohérente.
