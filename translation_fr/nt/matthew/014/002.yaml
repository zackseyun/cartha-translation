source:
  edition: SBLGNT
  text: καὶ εἶπεν τοῖς παισὶν αὐτοῦ· Οὗτός ἐστιν Ἰωάννης ὁ βαπτιστής· αὐτὸς ἠγέρθη ἀπὸ τῶν νεκρῶν, καὶ διὰ τοῦτο αἱ δυνάμεις ἐνεργοῦσιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/002.yaml
  text: And he said to his servants[a], “This is John the Baptist. He has been raised from the dead, and for this reason these powers are at work in him.”
translation:
  language: fr
  text: 'Il dit à ses serviteurs : « Celui-ci est Jean le Baptiste. Il a été ressuscité d’entre les morts, et c’est pour cela que ces puissances[a] sont à l’œuvre en lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ces puissances miraculeuses » ; de manière plus interprétative, « ces miracles ». Le grec dit « les puissances » (αἱ δυνάμεις) et désigne des puissances surnaturelles qui se manifestent par des actes puissants.
    reason: alternative lexicale
lexical_decisions:
- source_word: παισὶν
  choice: serviteurs
  rationale: παῖς peut désigner un enfant, un serviteur ou un membre de l’entourage. Dans le contexte de la cour d’Hérode, « serviteurs » exprime naturellement la relation sociale sans préciser indûment leur rang.
- source_word: ὁ βαπτιστής
  choice: Jean le Baptiste
  rationale: C’est en français l’appellation établie et naturelle de Jean, tout en rendant correctement son rôle de baptiseur.
- source_word: ἠγέρθη
  choice: a été ressuscité
  rationale: Cette formulation conserve la voix passive de l’aoriste grec et évite de suggérer que Jean se serait ressuscité lui-même.
- source_word: ἀπὸ τῶν νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression française naturelle rend explicitement l’idée d’un retour depuis le domaine ou le groupe des morts.
- source_word: διὰ τοῦτο
  choice: c’est pour cela que
  rationale: La tournure exprime clairement et naturellement le lien causal formulé par Hérode.
- source_word: αἱ δυνάμεις
  choice: ces puissances
  rationale: « Puissances » maintient le nom grec et son ambiguïté entre forces surnaturelles et manifestations puissantes. Le démonstratif « ces » renvoie naturellement aux œuvres rapportées dans le contexte.
- source_word: ἐνεργοῦσιν
  choice: agissent
  rationale: Le verbe rend de façon idiomatique l’activité effective et continue exprimée par ἐνεργέω.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Cette traduction suit directement la préposition ἐν et conserve l’idée que ces puissances sont actives en Jean, sans la reformuler plus interprétativement par « à travers lui ».
theological_decisions:
- issue: Nature du retour de Jean
  choice: Il a été ressuscité d’entre les morts
  alternative: Il est ressuscité d’entre les morts
  rationale: Le passif grec est préservé. La traduction rapporte l’explication d’Hérode sans affirmer davantage sur l’agent ou la nature de cette résurrection supposée.
- issue: Sens de δυνάμεις dans ce contexte
  choice: ces puissances agissent en lui
  alternative: ces puissances miraculeuses agissent en lui / ces miracles s’accomplissent par lui
  rationale: Le contexte évoque vraisemblablement une puissance surnaturelle manifestée par des actes puissants, mais le texte principal conserve le terme plus ouvert « puissances » et la préposition « en » afin de ne pas réduire la formulation grecque à ses effets visibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans devenir artificielle. Le marqueur de note est placé après « puissances », le terme auquel la note se rapporte.
