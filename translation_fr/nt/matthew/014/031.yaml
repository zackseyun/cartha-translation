id: MAT.14.31
reference: Matthew 14:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὐθέως δὲ ὁ Ἰησοῦς ἐκτείνας τὴν χεῖρα ἐπελάβετο αὐτοῦ καὶ λέγει αὐτῷ· Ὀλιγόπιστε, εἰς τί ἐδίστασας;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/031.yaml
  text: Immediately Jesus stretched out his hand[a], took hold of him, and said to him, “You of little faith, why did you doubt?”
translation:
  language: fr
  text: 'Aussitôt, Jésus tendit la main, le saisit et lui dit : « Homme de peu de foi, pourquoi as-tu douté[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pourquoi as-tu hésité ? » ou « pourquoi as-tu vacillé ? ». Le verbe grec peut exprimer l’hésitation ou le vacillement aussi bien que le doute.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Rend l’immédiateté de l’action dans un français narratif naturel et vif.
- source_word: δὲ
  choice: —
  rationale: La particule assure ici une transition légèrement contrastive; le français n’a pas besoin de la rendre explicitement.
- source_word: ἐκτείνας τὴν χεῖρα
  choice: tendit la main
  rationale: Expression française idiomatique qui conserve le geste concret et la succession des actions portée par le participe grec.
- source_word: ἐπελάβετο αὐτοῦ
  choice: le saisit
  rationale: Rend de manière concise l’idée de prendre fermement quelqu’un pour le retenir, sans ajouter qu’il l’aurait déjà entièrement sauvé.
- source_word: λέγει αὐτῷ
  choice: lui dit
  rationale: Le passé simple convient au récit français et restitue naturellement le présent historique grec sans produire une rupture de temps artificielle.
- source_word: Ὀλιγόπιστε
  choice: Homme de peu de foi
  rationale: Conserve l’adresse directe et l’idée d’une foi insuffisante, sans transformer le reproche en accusation d’absence totale de foi.
- source_word: εἰς τί
  choice: pourquoi
  rationale: Équivalent interrogatif naturel en français dans ce contexte.
- source_word: ἐδίστασας
  choice: as-tu douté
  rationale: « Douter » est clair et usuel; une note conserve la nuance possible d’hésitation ou de vacillement.
theological_decisions:
- issue: Portée de Ὀλιγόπιστε en rapport avec πίστις
  choice: Homme de peu de foi
  alternative: Toi qui as peu de foi
  rationale: La formulation présente la foi comme faible ou insuffisante, et non comme totalement absente; elle préserve ainsi la teneur précise du reproche.
- issue: Nuance de ἐδίστασας
  choice: as-tu douté
  alternative: as-tu hésité / vacillé
  rationale: Le verbe peut désigner le doute aussi bien que l’hésitation ou le vacillement. Le texte retient le terme français le plus immédiatement intelligible et signale l’autre nuance en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient un registre narratif biblique naturel sans archaïsme marqué; l’interpellation « Homme de peu de foi » reste solennelle tout en étant immédiatement compréhensible.
