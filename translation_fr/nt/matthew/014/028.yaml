  text: Ἀποκριθεὶς δὲ ⸂αὐτῷ ὁ Πέτρος εἶπεν⸃· Κύριε, εἰ σὺ εἶ, κέλευσόν με ⸂ἐλθεῖν πρὸς σὲ⸃ ἐπὶ τὰ ὕδατα·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/028.yaml
  text: And Peter answered him[a], “Lord, if it is you, command me to come to you on the waters.”
translation:
  language: fr
  text: 'Pierre lui répondit : « Seigneur, si c’est bien toi, ordonne-moi de venir vers toi sur les eaux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ αὐτῷ ὁ Πέτρος εἶπεν
  choice: Pierre lui répondit
  rationale: La tournure grecque associe le participe « ayant répondu », δέ et « dit ». En français narratif actuel, « lui répondit » rend naturellement l’ensemble sans reproduire lourdement « répondit et dit ».
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve à la fois l’adresse respectueuse et la portée christologique possible de κύριε dans Matthieu.
- source_word: εἰ σὺ εἶ
  choice: si c’est bien toi
  rationale: Cette formulation française naturelle exprime l’identification personnelle mise en relief par σὺ, sans suggérer nécessairement le doute. « Bien » explicite ici la valeur idiomatique de confirmation.
- source_word: κέλευσόν με
  choice: ordonne-moi
  rationale: κελεύω exprime une directive donnée avec autorité. « Ordonne-moi » en garde la force et convient naturellement à la construction infinitive qui suit.
- source_word: ἐλθεῖν πρὸς σὲ
  choice: de venir vers toi
  rationale: « Venir » adopte le point de vue du destinataire, Jésus, tandis que « vers toi » conserve explicitement l’idée de mouvement portée par πρός.
- source_word: ἐπὶ τὰ ὕδατα
  choice: sur les eaux
  rationale: Cette traduction conserve le pluriel grec τὰ ὕδατα et reste dignifiée et compréhensible en français.
theological_decisions:
- issue: Portée de κύριε dans l’adresse de Pierre à Jésus
  choice: Seigneur
  alternative: Maître ; Monsieur
  rationale: « Seigneur » préserve la possibilité d’une portée christologique sans imposer que Pierre formule ici une confession pleinement développée.
- issue: Valeur de εἰ dans « εἰ σὺ εἶ »
  choice: si c’est bien toi
  alternative: puisque c’est toi ; si tu es celui que tu dis
  rationale: Le texte peut relever d’une demande de confirmation plutôt que d’un doute incrédule. La traduction garde la forme conditionnelle et ne tranche pas davantage.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre des mots est adapté à la narration française, et le pluriel imagé « les eaux » est conservé.
