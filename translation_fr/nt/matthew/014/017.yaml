  text: 'Mais ils lui dirent : « Nous n’avons ici que cinq pains et deux poissons. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Mais ils
  rationale: L’article renvoie aux disciples, tandis que δέ marque un léger contraste avec l’ordre précédent de Jésus.
- source_word: λέγουσιν αὐτῷ
  choice: lui répondirent
  rationale: Le présent historique grec est rendu par un passé simple naturel dans un récit français. « Répondirent » convient à la prise de parole suscitée par l’instruction précédente.
- source_word: Οὐκ ἔχομεν ὧδε εἰ μὴ
  choice: Nous n’avons ici que
  rationale: Après une négation, εἰ μή introduit l’unique exception. La tournure restrictive française « ne… que » exprime naturellement l’ensemble de la construction sans en modifier le sens.
- source_word: πέντε ἄρτους
  choice: cinq pains
  rationale: ἄρτος désigne ici des pains individuels; « cinq pains » est clair, courant et adapté au contexte.
- source_word: δύο ἰχθύας
  choice: deux poissons
  rationale: Traduction directe et idiomatique du pluriel ἰχθύας.
