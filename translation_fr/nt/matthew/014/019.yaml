id: MAT.14.19
reference: Matthew 14:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κελεύσας τοὺς ὄχλους ἀνακλιθῆναι ἐπὶ ⸂τοῦ χόρτου⸃, λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας, ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κλάσας ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους οἱ δὲ μαθηταὶ τοῖς ὄχλοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/019.yaml
  text: And after ordering the crowds to recline on the grass[a], he took the five loaves and the two fish, looked up to heaven, blessed, and after breaking the loaves he gave them to the disciples, and the disciples to the crowds.
translation:
  language: fr
  text: Après avoir ordonné aux foules de prendre place sur l’herbe, il prit les cinq pains et les deux poissons, leva les yeux vers le ciel et bénit[a]. Puis il rompit les pains et les donna aux disciples, et les disciples les donnèrent aux foules.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit simplement « bénit », sans préciser l’objet. On peut aussi comprendre : « bénit Dieu » ou « prononça la bénédiction ».'
    reason: Préserver l’ambiguïté grammaticale et théologique du texte source.
lexical_decisions:
- source_word: κελεύσας
  choice: après avoir ordonné
  rationale: Rend la force de la directive et l’antériorité du participe aoriste dans un français narratif naturel.
- source_word: τοὺς ὄχλους
  choice: les foules
  rationale: Conserve le pluriel grec et désigne naturellement les groupes rassemblés.
- source_word: ἀνακλιθῆναι
  choice: prendre place
  rationale: Expression française naturelle dans ce contexte de repas; elle évite l’image trompeuse de personnes entièrement allongées, tout en indiquant qu’elles s’installent.
- source_word: ἐπὶ τοῦ χόρτου
  choice: sur l’herbe
  rationale: Rend directement le lieu sans ajouter l’adjectif « verte », absent de Matthieu.
- source_word: λαβὼν
  choice: il prit
  rationale: Le participe est transformé en verbe conjugué pour assurer la fluidité du récit sans modifier la succession des actions.
- source_word: τοὺς πέντε ἄρτους
  choice: les cinq pains
  rationale: « Pains » est le terme français courant pour les unités de pain dans ce récit.
- source_word: τοὺς δύο ἰχθύας
  choice: les deux poissons
  rationale: Équivalent direct et naturel du pluriel grec.
- source_word: ἀναβλέψας εἰς τὸν οὐρανόν
  choice: leva les yeux vers le ciel
  rationale: Formulation idiomatique qui conserve le geste et sa direction.
- source_word: εὐλόγησεν
  choice: bénit
  rationale: Rend directement le verbe grec sans lui fournir un complément que le texte ne précise pas; la note expose les interprétations possibles.
- source_word: κλάσας
  choice: puis il rompit les pains
  rationale: Le verbe conjugué exprime clairement l’action antérieure au don; « les pains » explicite l’objet évident dans le contexte.
- source_word: ἔδωκεν τοῖς μαθηταῖς τοὺς ἄρτους
  choice: les donna aux disciples
  rationale: Le pronom renvoie sans ambiguïté aux pains qui viennent d’être rompus.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: et les disciples les donnèrent aux foules
  rationale: Le grec sous-entend le verbe repris de la proposition précédente; le français le rétablit pour obtenir une phrase complète et claire.
theological_decisions:
- issue: Objet implicite de εὐλόγησεν
  choice: 'Ne pas préciser l’objet dans le texte principal : « bénit »'
  alternative: « bénit Dieu », « prononça la bénédiction » ou « bénit les pains et les poissons »
  rationale: Le grec ne nomme aucun objet. L’ajout de Dieu ou des aliments trancherait une ambiguïté réelle liée à l’usage de la bénédiction avant un repas. La formulation concise maintient cette tension, et la note présente les principales possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit clairement la progression narrative. « Prendre place » communique naturellement l’installation des foules dans le cadre du repas, tandis que « bénit » conserve volontairement la concision inhabituelle du grec.
