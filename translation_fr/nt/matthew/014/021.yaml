  text: οἱ δὲ ἐσθίοντες ἦσαν ἄνδρες ὡσεὶ πεντακισχίλιοι χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/021.yaml
  text: Those who ate were about five thousand men[a], besides women and children.
translation:
  language: fr
  text: Ceux qui avaient mangé étaient environ cinq mille hommes, sans compter les femmes et les enfants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ἐσθίοντες
  choice: Ceux qui avaient mangé
  rationale: Le participe présent substantivé désigne les personnes ayant pris part au repas. Le plus-que-parfait est naturel en français dans ce bilan narratif, sans chercher à préciser davantage l’aspect grec. La légère transition marquée par δέ reste implicite, comme le permet le contexte.
- source_word: ἦσαν
  choice: étaient
  rationale: L’imparfait de εἰμί forme ici une simple proposition copulative indiquant le nombre.
- source_word: ἄνδρες
  choice: hommes
  rationale: ἀνήρ désigne ici spécifiquement des personnes de sexe masculin, distinguées ensuite des femmes et des enfants.
- source_word: ὡσεὶ πεντακισχίλιοι
  choice: environ cinq mille
  rationale: ὡσεί signale une approximation, rendue naturellement par « environ ».
- source_word: χωρὶς γυναικῶν καὶ παιδίων
  choice: sans compter les femmes et les enfants
  rationale: χωρίς avec le génitif indique que les femmes et les enfants ne sont pas inclus dans le nombre annoncé. Cette formulation française est claire et idiomatique.
theological_decisions:
- issue: Terme de comptage propre aux hommes au sein d’une foule mixte
  choice: Conserver « hommes » et préciser « sans compter les femmes et les enfants »
  alternative: Employer « personnes » ou « gens »
  rationale: Le grec compte explicitement les hommes, puis indique séparément les femmes et les enfants. Un terme générique effacerait cette distinction du texte source.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste concise et conserve la distinction explicite entre hommes, femmes et enfants.
