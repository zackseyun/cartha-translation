  yaml_path: translation/nt/matthew/014/034.yaml
  text: And after crossing over[a], they came to the land of Gennesaret.
translation:
  language: fr
  text: Après avoir traversé, ils arrivèrent sur la terre de Génésareth.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαπεράσαντες
  choice: Après avoir traversé le lac
  rationale: Le participe aoriste exprime une action antérieure à l’arrivée. Le contexte immédiat est une traversée en barque; « le lac » rend naturellement en français le complément implicite sans préciser davantage le moyen.
- source_word: ἦλθον
  choice: ils abordèrent
  rationale: Dans ce contexte nautique, « aborder » exprime idiomatiquement l’arrivée depuis l’eau et permet de rendre avec naturel la construction associée à ἐπὶ τὴν γῆν.
- source_word: ἐπὶ τὴν γῆν εἰς Γεννησαρέτ
  choice: dans la région de Génésareth
  rationale: La tournure grecque combine littéralement l’arrivée « sur la terre » et le mouvement « vers/dans Génésareth ». La formulation française indique le lieu où ils ont abordé tout en évitant de décider si Génésareth désigne précisément une localité ou le territoire environnant.
- source_word: Γεννησαρέτ
  choice: Génésareth
  rationale: Forme française traditionnelle et intelligible du nom propre grec.
