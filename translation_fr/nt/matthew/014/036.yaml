  rationale: La révision remplace la construction permissive « les laisser toucher » par une formulation qui rend plus directement le contenu de la demande grecque, sans ajouter une action de permission. Les notes conservent les alternatives lexicales pertinentes et leurs ancres demeurent correctement associées à « frange » et à « furent guéris ».
