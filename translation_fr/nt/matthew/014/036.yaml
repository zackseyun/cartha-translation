    issue: « de les laisser seulement toucher » suggère une permission de Jésus.
    rationale: ἵνα μόνον ἅψωνται exprime l’objet de la supplication — qu’ils puissent seulement toucher — sans verbe correspondant explicitement à « laisser » ou à « permettre ». La correction évite cet ajout interprétatif.
  - severity: low
    issue: La note sur κράσπεδον emploie « gland », terme susceptible d’être compris autrement ou de paraître peu naturel sans contexte.
    rationale: « Houppe » décrit plus clairement l’éventuelle garniture/tassel tout en maintenant la réserve indiquée par le grec.
