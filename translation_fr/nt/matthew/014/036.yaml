reference: Matthew 14:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ παρεκάλουν αὐτὸν ἵνα μόνον ἅψωνται τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ· καὶ ὅσοι ἥψαντο διεσώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/014/036.yaml
  text: And they begged him that they might only touch the fringe of his garment[b][a], and as many as touched it were healed.
translation:
  language: fr
  text: Ils le suppliaient de pouvoir seulement toucher la frange de son vêtement[a]. Et tous ceux qui la touchèrent furent guéris[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le bord » ou « le pan » ; le terme grec peut désigner la bordure ou la frange d’un vêtement, éventuellement une houppe.
    reason: lexical_alternative
  - marker: b
    text: Ou « furent rétablis » ; le verbe grec peut aussi signifier, plus largement, « furent sauvés » ou « furent délivrés », mais le contexte concerne ici la guérison physique.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: suppliaient
  rationale: L’imparfait évoque une demande insistante ou répétée; « suppliaient » en exprime naturellement l’intensité.
- source_word: ἵνα μόνον ἅψωνται
  choice: de les laisser seulement toucher
  rationale: Cette formulation française rend le contenu de la requête exprimé par ἵνα avec le subjonctif, tandis que « seulement » souligne que le simple contact leur paraissait suffisant.
- source_word: τοῦ κρασπέδου
  choice: la frange
  rationale: κράσπεδον peut désigner la bordure, le pan ou la frange d’un vêtement, éventuellement son gland; « frange » conserve cette portée sans imposer une précision excessive.
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: de son vêtement
  rationale: ἱμάτιον désigne ici un vêtement, vraisemblablement extérieur; le terme général « vêtement » évite de préciser sans nécessité « manteau » ou « robe ».
- source_word: ὅσοι
  choice: tous ceux qui
  rationale: Cette tournure idiomatique française restitue la valeur englobante et distributive de ὅσοι.
- source_word: ἥψαντο
  choice: la touchèrent
  rationale: Le pronom féminin renvoie naturellement à « la frange », objet explicite du contact dans la phrase précédente.
- source_word: διεσώθησαν
  choice: furent guéris
  rationale: Dans ce contexte de guérisons corporelles, διασῴζω signifie être pleinement rétabli ou guéri, même si le verbe peut ailleurs avoir le sens plus large d’être sauvé ou délivré.
theological_decisions:
- issue: Portée de διεσώθησαν dans le récit de guérison
  choice: guérison physique (« furent guéris »)
  alternative: « furent sauvés » ou « furent rétablis »
  rationale: Le contexte immédiat concerne les malades et leur guérison corporelle. « Furent guéris » communique ce sens contextuel sans transformer le verset en affirmation explicite sur le salut, tandis qu’une note préserve la portée lexicale plus large du verbe.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste fluide tout en conservant l’insistance de la demande, l’ambiguïté lexicale de κράσπεδον et, en note, la portée plus large de διασῴζω.
