review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : l’imparfait de παρεκάλουν (« suppliaient »), la restriction μόνον (« seulement »), le contact de κράσπεδον et la guérison exprimée par διεσώθησαν sont conservés. Toutefois, « de les laisser toucher » introduit l’idée que Jésus devait leur accorder une permission, alors que le grec exprime simplement le contenu de leur demande : qu’ils puissent ne serait-ce que toucher.'
  naturalness: La formulation proposée est globalement naturelle, mais « le supplier de les laisser toucher » est légèrement plus lourd et plus interprétatif que « le supplier de pouvoir seulement toucher ». La révision reste idiomatique en français international moderne.
  terminology: « Frange de son vêtement » est un choix prudent pour κράσπεδον et conserve l’absence de spécification excessive. Dans la note, « houppe » est plus précis et moins ambigu que « gland » pour évoquer, comme possibilité, un élément pendant/tassel du bord du vêtement. « Furent guéris » convient contextuellement pour διεσώθησαν, avec la portée lexicale plus large préservée en note.
  issues:
