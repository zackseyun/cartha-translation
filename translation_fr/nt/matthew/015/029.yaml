id: MAT.15.29
reference: Matthew 15:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ μεταβὰς ἐκεῖθεν ὁ Ἰησοῦς ἦλθεν παρὰ τὴν θάλασσαν τῆς Γαλιλαίας, καὶ ἀναβὰς εἰς τὸ ὄρος ἐκάθητο ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/029.yaml
  text: And departing from there[a], Jesus came along the Sea of Galilee, and after going up on the mountain[b], he sat there.
translation:
  language: fr
  text: Après être parti de là, Jésus se rendit le long de la mer de Galilée et, après être monté sur la montagne, il était assis là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: Après être parti de là
  rationale: Le participe aoriste marque une action antérieure au verbe principal; cette tournure exprime naturellement la succession en français.
- source_word: ἦλθεν
  choice: se rendit
  rationale: Dans ce récit de déplacement, «se rendit» traduit naturellement ἔρχομαι sans imposer le point de vue déictique parfois associé à «vint».
- source_word: παρὰ τὴν θάλασσαν τῆς Γαλιλαίας
  choice: le long de la mer de Galilée
  rationale: παρά avec l’accusatif et un verbe de mouvement peut indiquer un déplacement le long du rivage; «le long de» conserve cette nuance.
- source_word: ἀναβὰς εἰς τὸ ὄρος
  choice: il monta sur la montagne
  rationale: Le participe aoriste indique ici une action préalable; avec ἀναβαίνω, εἰς τὸ ὄρος se rend idiomatiquement par «sur la montagne».
- source_word: ἐκάθητο ἐκεῖ
  choice: s’assit là
  rationale: Bien que l’imparfait grec puisse présenter une situation en cours, le français narratif rend naturellement l’entrée dans la posture par «s’assit»; «était assis» risquerait de suggérer qu’il se trouvait déjà ainsi.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Forme française traditionnelle et standard du nom propre.
theological_decisions: []
translation_notes:
  register: 'Français moderne, clair et digne. Deux phrases évitent une coordination lourde tout en conservant l’ordre des actions du grec. Aucune note n’est nécessaire: les ambiguïtés lexicales n’affectent pas sensiblement l’interprétation du verset.'
