source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἔστιν καλὸν λαβεῖν τὸν ἄρτον τῶν τέκνων καὶ βαλεῖν τοῖς κυναρίοις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/026.yaml
  text: But he answered[a], “It is not right to take the children's bread and throw it to the little dogs.”
translation:
  language: fr
  text: 'Mais il répondit : « Il ne convient pas de prendre le pain des enfants et de le jeter aux petits chiens[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chiens domestiques » ou « chiots » ; le grec emploie un diminutif qui peut suggérer de petits chiens ou des chiens vivant dans la maison, plutôt que des chiens errants.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: il répondit
  rationale: Cette tournure grecque, littéralement « ayant répondu, il dit », se rend naturellement en français par « il répondit », tout en conservant la valeur de réponse.
- source_word: καλὸν
  choice: juste
  rationale: Dans cette construction, καλόν exprime ce qui convient ou ce qu’il est juste de faire, plutôt qu’une simple qualité morale abstraite.
- source_word: λαβεῖν
  choice: prendre
  rationale: Le verbe désigne ici l’action de prendre le pain; « prendre » est l’équivalent français direct et naturel.
- source_word: τὸν ἄρτον τῶν τέκνων
  choice: le pain des enfants
  rationale: Cette formulation conserve directement l’image du pain ainsi que le rapport génitif avec les enfants, sans expliciter les référents de la métaphore.
- source_word: βαλεῖν
  choice: jeter
  rationale: « Jeter » préserve la force concrète de βάλλω et évite l’adoucissement interprétatif qu’introduirait « donner ».
- source_word: κυναρίοις
  choice: petits chiens
  rationale: Le diminutif κυνάρια peut évoquer de petits chiens ou des chiens domestiques. « Petits chiens » en conserve la nuance sans imposer l’idée plus précise de chiots.
theological_decisions:
- issue: Préserver la force et la tension de la métaphore des enfants et des chiens sans préciser ses référents ni attribuer un ton absent du verset.
  choice: Conserver directement « le pain des enfants » et « les petits chiens ».
  alternative: Expliciter les groupes visés par l’image, ou rendre κυναρίοις simplement par « chiens » ou plus précisément par « chiens domestiques ».
  rationale: Le verset n’identifie pas explicitement les référents de chaque élément de la métaphore. La traduction maintient donc l’image et sa tension, laissant le contexte éclairer son sens.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste concise, et le contraste imagé du grec est conservé sans ajout explicatif dans le corps du texte.
