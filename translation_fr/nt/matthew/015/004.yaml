  text: ὁ γὰρ θεὸς ⸀εἶπεν· Τίμα τὸν πατέρα καὶ τὴν μητέρα, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/004.yaml
  text: For God said[a], ‘Honor your father and your mother,’ and, ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: fr
  text: 'Car Dieu a dit : « Honore ton père et ta mère », et : « Celui qui maudit son père ou sa mère devra mourir. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ γὰρ θεὸς
  choice: Car Dieu
  rationale: γάρ introduit la justification de l’argument de Jésus. « Car Dieu » en conserve naturellement la valeur explicative.
- source_word: εἶπεν
  choice: a dit
  rationale: Le verbe introduit ici une citation de l’Écriture. « A dit » en rend le sens direct sans renforcer le texte par « a commandé ».
- source_word: Τίμα
  choice: Honore
  rationale: τιμάω exprime l’honneur dû aux parents. « Honore » garde la force éthique et la forme impérative du commandement.
- source_word: τὸν πατέρα καὶ τὴν μητέρα
  choice: ton père et ta mère
  rationale: Le possessif, présent dans la formulation vétérotestamentaire citée, est naturel et nécessaire en français courant.
- source_word: Ὁ κακολογῶν
  choice: Celui qui maudit
  rationale: κακολογέω peut désigner le fait de dire du mal, d’injurier ou de maudire. Dans cette citation juridique relative aux parents, « maudit » restitue avec concision la gravité du terme.
- source_word: πατέρα ἢ μητέρα
  choice: son père ou sa mère
  rationale: Le possessif rend explicite en français la relation familiale impliquée par la tournure grecque générique.
- source_word: θανάτῳ τελευτάτω
  choice: sera puni de mort
  rationale: Cette formule solennelle énonce une peine capitale. « Sera puni de mort » conserve sa valeur juridique sans introduire un agent d’exécution absent de l’expression grecque.
theological_decisions:
- issue: Formulation de la peine prévue par la loi citée
  choice: sera puni de mort
  alternative: devra mourir
  rationale: La citation exprime une sanction juridique et non une simple prédiction de décès. La formulation retenue garde cette portée tout en évitant de préciser indûment qui exécute la peine.
translation_notes:
  register: Français international moderne, clair et digne. Les citations conservent leur solennité biblique sans archaïsmes; le tutoiement singulier convient à la formulation personnelle du commandement.
