  text: καὶ ἔφαγον πάντες καὶ ἐχορτάσθησαν, καὶ ⸂τὸ περισσεῦον τῶν κλασμάτων ἦραν⸃ ἑπτὰ σπυρίδας πλήρεις.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/037.yaml
  text: And they all ate and were satisfied[a], and they picked up seven full baskets of the leftover pieces.
translation:
  language: fr
  text: Tous mangèrent et furent rassasiés. Puis on ramassa sept corbeilles[a] pleines des morceaux qui restaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « sept grandes corbeilles pleines » : le mot grec employé ici (spyris) peut désigner une corbeille plus grande que celles mentionnées dans certains autres récits de multiplication des pains.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφαγον
  choice: mangèrent
  rationale: L’aoriste de ἐσθίω signifie simplement « manger » ; aucun complément d’objet n’est exprimé dans le grec.
- source_word: πάντες
  choice: Tous
  rationale: Le pluriel désigne l’ensemble de la foule et conserve explicitement la portée universelle.
- source_word: ἐχορτάσθησαν
  choice: furent rassasiés
  rationale: χορτάζω exprime ici le fait d’avoir mangé jusqu’à satiété ; « furent rassasiés » est direct, digne et naturel.
- source_word: τὸ περισσεῦον τῶν κλασμάτων
  choice: des morceaux qui restaient
  rationale: Cette formulation rend naturellement le participe substantivé τὸ περισσεῦον et le génitif κλασμάτων, qui désigne les morceaux demeurés après le repas.
- source_word: ἦραν
  choice: on ramassa
  rationale: Dans ce contexte de collecte, αἴρω signifie prendre ou ramasser. Le pronom indéfini français évite d’attribuer aux seuls convives un sujet que le grec ne précise pas au-delà de la troisième personne du pluriel.
- source_word: ἑπτὰ σπυρίδας πλήρεις
  choice: sept corbeilles pleines
  rationale: La traduction conserve le nombre, le type général de contenant et l’adjectif prédicatif « pleines ». « Corbeilles » est courant et permet de signaler en note la possible nuance de grande taille de σπυρίς.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La première phrase suit étroitement la structure grecque ; la seconde emploie une tournure française naturelle tout en préservant le sens et l’ordre des éléments. Le marqueur de note est placé après « corbeilles », terme auquel porte la variante lexicale.
