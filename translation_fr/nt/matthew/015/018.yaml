id: MAT.15.18
reference: Matthew 15:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὰ δὲ ἐκπορευόμενα ἐκ τοῦ στόματος ἐκ τῆς καρδίας ἐξέρχεται, κἀκεῖνα κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/018.yaml
  text: But the things that come out of the mouth come from the heart[a], and those defile the man.
translation:
  language: fr
  text: Mais ce qui sort de la bouche vient du cœur, et c’est cela qui rend l’être humain[a] impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’homme » ; le singulier grec a ici une valeur représentative et désigne tout être humain.'
    reason: Précision sur la forme littérale et la portée générique de τὸν ἄνθρωπον.
lexical_decisions:
- source_word: τὰ … ἐκπορευόμενα
  choice: ce qui sort
  rationale: Le participe neutre pluriel substantivé désigne collectivement les paroles ou autres productions de la bouche. « Ce qui sort » restitue naturellement cette portée générale en français tout en conservant l’image concrète.
- source_word: στόματος
  choice: bouche
  rationale: Ce terme direct préserve l’image corporelle et convient au contexte, où ce qui sort de la bouche renvoie notamment aux paroles.
- source_word: καρδίας
  choice: cœur
  rationale: Dans l’anthropologie biblique, le cœur désigne le centre intérieur de la pensée, de la volonté et des intentions morales. Le terme français conserve cette richesse sans l’expliciter excessivement.
- source_word: ἐξέρχεται
  choice: vient
  rationale: Avec « du cœur », « vient » exprime clairement et naturellement l’origine. Le singulier français s’accorde avec le collectif « ce qui ».
- source_word: κἀκεῖνα
  choice: et c’est cela
  rationale: La contraction grecque signifie « et ces choses-là ». La formulation française reprend collectivement ce qui sort de la bouche et maintient l’accent démonstratif.
- source_word: κοινοῖ
  choice: rend … impur
  rationale: Dans ce contexte de pureté, κοινόω signifie rendre commun au sens cultuel, donc impur. « Rend impur » est intelligible en français moderne et conserve explicitement le contraste avec la pureté.
- source_word: τὸν ἄνθρωπον
  choice: l’être humain
  rationale: Le singulier grec est représentatif et vise tout être humain, non un homme de sexe masculin en particulier. « L’être humain » en restitue la portée générique sans perdre le singulier.
theological_decisions:
- issue: Origine intérieure de l’impureté morale
  choice: Le cœur est présenté comme la source intérieure de ce qui sort par la bouche et rend l’être humain impur.
  alternative: Limiter le propos à une impureté rituelle produite par certaines paroles.
  rationale: Le contexte oppose ce qui entre de l’extérieur à ce qui procède de l’intérieur. « Cœur » et « rend impur » préservent à la fois la dimension morale et le langage de pureté sans réduire ni élargir indûment l’affirmation.
- issue: Portée générique de ἄνθρωπος
  choice: Employer « l’être humain » dans le texte principal.
  alternative: Employer littéralement « l’homme ».
  rationale: Ici, l’article et le singulier ont une valeur représentative. En français contemporain, « l’être humain » communique sans ambiguïté cette portée universelle, tandis qu’une note signale la forme littérale grecque.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure collective « ce qui sort » évite le peu naturel « les choses qui sortent » tout en conservant le mouvement de la bouche vers l’extérieur et l’origine dans le cœur.
