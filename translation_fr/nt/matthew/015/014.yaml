id: MAT.15.14
reference: Matthew 15:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄφετε αὐτούς· ⸂τυφλοί εἰσιν ὁδηγοὶ τυφλῶν⸃· τυφλὸς δὲ τυφλὸν ἐὰν ὁδηγῇ, ἀμφότεροι εἰς βόθυνον πεσοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/014.yaml
  text: Leave them alone[a]; they are blind guides of the blind. But if a blind man guides a blind man[c][b], both will fall into a pit.
translation:
  language: fr
  text: 'Laissez-les : ce sont des aveugles qui guident des aveugles. Mais si un aveugle guide un aveugle[a], tous deux tomberont dans une fosse[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le masculin singulier a ici une valeur représentative : le proverbe énonce une vérité générale, qui ne concerne pas seulement les hommes.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « un fossé » ; « un trou ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφετε αὐτούς
  choice: Laissez-les
  rationale: L’impératif de ἀφίημι signifie ici « laisser, ne pas s’occuper de », et non « pardonner ». « Laissez-les » reste concis et conserve la force du commandement.
- source_word: τυφλοί
  choice: aveugles
  rationale: L’adjectif est employé métaphoriquement. La traduction garde l’image sans l’expliciter ni la réduire à une interprétation comme « ignorants ».
- source_word: ὁδηγοὶ τυφλῶν
  choice: des guides aveugles pour des aveugles
  rationale: Cette formulation naturelle en français conserve à la fois le nom « guides » et la relation exprimée par le génitif τυφλῶν, sans remplacer l’image par le terme plus interprétatif « chefs ».
- source_word: τυφλὸς ... τυφλὸν
  choice: un aveugle ... un aveugle
  rationale: Le singulier indéfini reproduit la forme proverbiale grecque. En français, le masculin singulier a ici une valeur représentative et générale.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque une légère opposition ou un développement qui introduit l’avertissement proverbial.
- source_word: ἐὰν ὁδηγῇ
  choice: si ... guide
  rationale: ἐάν suivi du subjonctif exprime ici une condition générale. Le présent français est naturel et maintient le lien lexical avec « guides ».
- source_word: ἀμφότεροι
  choice: tous deux
  rationale: « Tous deux » rend clairement l’idée que le guide et celui qu’il guide subiront ensemble la conséquence.
- source_word: εἰς βόθυνον
  choice: dans une fosse
  rationale: βόθυνος peut désigner une fosse, un trou ou un fossé. « Fosse » préserve l’image générale d’une cavité profonde sans préciser indûment sa forme.
- source_word: πεσοῦνται
  choice: tomberont
  rationale: Le futur français exprime directement le résultat annoncé dans la proposition conditionnelle.
theological_decisions:
- issue: Portée métaphorique de « aveugles »
  choice: Conserver « aveugles » sans ajouter d’explication dans le texte principal.
  alternative: « aveugles spirituellement » ou « chefs sans discernement »
  rationale: Le grec présente une métaphore vive sans en expliciter le domaine. La traduction préserve cette image et sa tension plutôt que d’imposer une interprétation.
- issue: Genre grammatical dans le proverbe
  choice: Employer « un aveugle ... un aveugle » au masculin singulier représentatif.
  alternative: « une personne aveugle ... une personne aveugle »
  rationale: Le grec emploie deux formes masculines singulières dans une maxime de portée générale. Le français peut reproduire naturellement cette construction, tandis qu’une note en précise la portée inclusive.
- issue: Relation entre les guides et les aveugles
  choice: « des guides aveugles pour des aveugles »
  alternative: « des aveugles qui guident des aveugles »
  rationale: Le choix retenu conserve explicitement le substantif « guides » et la structure dense de la formule grecque, sans décider si l’accent porte davantage sur leur fonction ou sur leur action.
translation_notes:
  register: 'Français international moderne, sobre et proverbial. La répétition de « aveugle(s) » et de « guide(s) » est volontaire : elle reproduit la force rhétorique et les correspondances lexicales du grec. Le deux-points rend le lien explicatif entre le commandement initial et la description qui suit.'
