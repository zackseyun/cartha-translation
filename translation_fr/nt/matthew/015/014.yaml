    issue: Ambiguïté de « des guides aveugles pour des aveugles »
    rationale: En français, « pour des aveugles » peut marquer la destination ou le bénéfice (« des guides destinés aux aveugles »), et ne rend pas avec assez de netteté que les guides eux-mêmes sont aveugles et qu’ils guident d’autres aveugles.
  - severity: low
    issue: Ponctuation de la note sur βόθυνος
    rationale: '« Ou : “un fossé” ou “un trou” » enchaîne deux alternatives de façon peu naturelle. Un point-virgule distingue clairement les deux possibilités.'
