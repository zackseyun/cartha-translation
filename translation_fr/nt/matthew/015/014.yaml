revisions:
- from: 'Laissez-les : ce sont des guides aveugles pour des aveugles. Mais si un aveugle guide un aveugle[a], tous deux tomberont dans une fosse[b].'
  to: 'Laissez-les : ce sont des aveugles qui guident des aveugles. Mais si un aveugle guide un aveugle[a], tous deux tomberont dans une fosse[b].'
  rationale: 'La révision clarifie la construction métaphorique sans ajouter d’interprétation : les personnes décrites sont aveugles et elles guident elles-mêmes des aveugles. Elle conserve la répétition lexicale du grec, la forme proverbiale au singulier dans la seconde proposition et l’ambiguïté légitime de βόθυνος, rendu au texte par « fosse » et signalé en note.'
