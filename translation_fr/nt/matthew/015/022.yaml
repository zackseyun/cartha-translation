reference: Matthew 15:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ Χαναναία ἀπὸ τῶν ὁρίων ἐκείνων ἐξελθοῦσα ⸀ἔκραζεν λέγουσα· Ἐλέησόν με, κύριε ⸀υἱὸς Δαυίδ· ἡ θυγάτηρ μου κακῶς δαιμονίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/022.yaml
  text: And behold[a], a Canaanite woman from those regions came out and was crying out, saying, “Have mercy on me, Lord, Son of David; my daughter is badly demon-possessed.”
translation:
  language: fr
  text: 'Et voici qu’une femme cananéenne, sortie de ces régions, criait en disant : « Aie pitié de moi, Seigneur, Fils de David ! Ma fille est cruellement tourmentée par un démon[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est gravement possédée par un démon » ; le verbe grec indique qu’elle subit une emprise démoniaque sans en préciser exactement la nature.'
    reason: alternative lexicale préservant l’ambiguïté de δαιμονίζεται
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici que
  rationale: Conserve la fonction de mise en relief et la vivacité narrative de la particule, dans un français actuel et digne.
- source_word: Χαναναία
  choice: cananéenne
  rationale: Reproduit le terme propre à Matthieu et ses résonances historiques, sans lui substituer le terme « syro-phénicienne » du récit parallèle de Marc.
- source_word: ἀπὸ τῶν ὁρίων ἐκείνων
  choice: de cette région
  rationale: Rend naturellement l’idée du territoire ou des environs concernés; le pluriel grec n’exige pas ici un pluriel français.
- source_word: ἐξελθοῦσα
  choice: venue
  rationale: Intègre naturellement le participe aoriste à la phrase française tout en conservant le mouvement de la femme depuis cette région.
- source_word: ἔκραζεν
  choice: criait
  rationale: L’imparfait français préserve l’aspect continu ou répété de l’imparfait grec.
- source_word: Ἐλέησόν με
  choice: Aie pitié de moi
  rationale: Formulation française idiomatique qui conserve l’appel pressant à la compassion.
- source_word: κύριε
  choice: Seigneur
  rationale: Dans l’adresse associée au titre « Fils de David », « Seigneur » garde la portée révérencielle et messianique possible du terme.
- source_word: υἱὸς Δαυίδ
  choice: Fils de David
  rationale: Traduction directe du titre davidique reconnu, qui en préserve la portée royale et messianique.
- source_word: κακῶς
  choice: cruellement
  rationale: Exprime avec naturel l’intensité de la souffrance indiquée par l’adverbe dans ce contexte.
- source_word: δαιμονίζεται
  choice: est tourmentée par un démon
  rationale: Exprime clairement l’action démoniaque sans imposer au verbe grec la précision phénoménologique que pourrait suggérer « possédée ».
theological_decisions:
- issue: Portée de κύριε dans une adresse messianique
  choice: Seigneur
  alternative: Monsieur / maître
  rationale: L’association avec « Fils de David » rend vraisemblable une adresse dépassant la simple politesse. « Seigneur » préserve cette portée possible sans affirmer que la femme formule ici une confession christologique pleinement développée.
- issue: Nature de la condition exprimée par δαιμονίζεται
  choice: tourmentée par un démon
  alternative: possédée par un démon
  rationale: Le texte attribue sans ambiguïté la détresse à une puissance démoniaque, mais le verbe ne définit pas précisément la nature de son emprise. Le texte principal évite donc de trancher inutilement, tandis que la note conserve la traduction traditionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait « criait » conserve la durée ou la répétition de l’appel. La ponctuation directe donne à la supplication son urgence sans archaïsme.
