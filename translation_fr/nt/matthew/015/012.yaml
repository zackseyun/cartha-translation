review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : les disciples s’approchent de Jésus et l’avertissent de la réaction des Pharisiens à ses paroles. Toutefois, « en entendant » affaiblit légèrement l’antériorité de l’aoriste participial ἀκούσαντες (« après avoir entendu / lorsqu’ils ont entendu »), et « offensés » évoque en français surtout une offense personnelle. Dans ce contexte, σκανδαλίζω désigne plus naturellement une réaction de heurt ou de scandale.'
  naturalness: La phrase est claire et de registre convenable. « Les Pharisiens » avec majuscule est la graphie biblique française usuelle pour ce groupe. « Se sont scandalisés » est plus idiomatique et plus proche du champ sémantique de σκανδαλίζω que « ont été offensés », sans imposer une interprétation doctrinale.
  terminology: « Disciples », « Pharisiens » et « cette parole » sont appropriés. La note lexicale doit présenter l’image de trébuchement comme une valeur plus littérale, sans suggérer indûment une causalité externe que le passif grec ne spécifie pas nécessairement.
  issues:
  - severity: medium
    issue: Rendu de ἐσκανδαλίσθησαν par « ont été offensés »
    rationale: Le français « être offensé » tend à signifier se sentir personnellement insulté. « Se sont scandalisés » conserve mieux le lien lexical et conceptuel avec σκανδαλίζω et convient à leur réaction à l’enseignement de Jésus.
  - severity: low
    issue: « en entendant » pour ἀκούσαντες
    rationale: Le gérondif français suggère volontiers la simultanéité. « après avoir entendu » rend plus précisément l’action antérieure exprimée par le participe aoriste.
  - severity: low
    issue: Minuscule à « pharisiens »
    rationale: La majuscule est la convention biblique française la plus courante lorsqu’il s’agit du groupe historique et religieux identifié.
  revised_text: 'Alors les disciples s’approchèrent et lui dirent : « Sais-tu que les Pharisiens se sont scandalisés[a] après avoir entendu cette parole[b] ? »'
  revised_footnotes:
