  text: Τότε προσελθόντες οἱ ⸀μαθηταὶ ⸀λέγουσιν αὐτῷ· Οἶδας ὅτι οἱ Φαρισαῖοι ἀκούσαντες τὸν λόγον ἐσκανδαλίσθησαν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/012.yaml
  text: Then the disciples came and said to him[b][a], “Do you know that the Pharisees were offended when they heard this word?”
translation:
  language: fr
  text: 'Alors les disciples s’approchèrent et lui dirent : « Sais-tu que les Pharisiens se sont scandalisés[a] après avoir entendu cette parole[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ont été choqués ». Plus littéralement, « ont trébuché » ou « ont été amenés à trébucher ».
    reason: lexical_alternative
  - marker: b
    text: « Cette parole » désigne ce que Jésus vient de dire.
    reason: cross_reference
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession narrative introduite par l’adverbe temporel grec.
- source_word: προσελθόντες
  choice: s’approchèrent
  rationale: Rend explicitement le mouvement vers Jésus exprimé par προσέρχομαι, dans une coordination française naturelle avec le verbe principal.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: Suit le groupe nominal défini grec sans ajouter le possessif « ses ».
- source_word: λέγουσιν αὐτῷ
  choice: lui dirent
  rationale: Le présent historique grec est rendu par le passé simple, adapté à une narration française écrite et digne.
- source_word: Οἶδας
  choice: Sais-tu
  rationale: Traduction directe de la question, sans la nuance plus interprétative de « Te rends-tu compte ».
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française courante de ce groupe religieux.
- source_word: ἀκούσαντες τὸν λόγον
  choice: en entendant cette parole
  rationale: La construction participiale est rendue naturellement; « cette parole » conserve λόγος tout en signalant son renvoi aux propos précédents de Jésus.
- source_word: ἐσκανδαλίσθησαν
  choice: ont été offensés
  rationale: Exprime ici la réaction négative des pharisiens tout en conservant la forme passive du grec; une note maintient le sens plus littéral lié à l’idée de chute.
theological_decisions:
- issue: Sens de σκανδαλίζω dans la réaction des pharisiens
  choice: ont été offensés
  alternative: ont trébuché / ont été poussés à trébucher
  rationale: Le contexte immédiat décrit leur réaction aux propos de Jésus. La traduction principale reste idiomatique, tandis que la note préserve l’image grecque et l’éventuelle portée plus forte du verbe sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit écrit; la formulation évite à la fois l’archaïsme et la paraphrase excessive.
