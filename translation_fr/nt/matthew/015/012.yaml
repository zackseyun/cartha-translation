revisions:
- from: 'Alors les disciples s’approchèrent et lui dirent : « Sais-tu que les pharisiens ont été offensés[a] en entendant cette parole[b] ? »'
  to: 'Alors les disciples s’approchèrent et lui dirent : « Sais-tu que les Pharisiens se sont scandalisés[a] après avoir entendu cette parole[b] ? »'
  rationale: La révision remplace un terme français potentiellement réducteur par « se sont scandalisés », qui reflète plus justement la réaction exprimée par ἐσκανδαλίσθησαν tout en laissant ouverte sa portée exacte. Elle rend aussi l’antériorité du participe ἀκούσαντες par « après avoir entendu » et applique la capitalisation biblique usuelle à « Pharisiens ». Les deux ancres de notes restent attachées aux éléments qu’elles expliquent.
