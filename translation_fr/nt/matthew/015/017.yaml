source:
  edition: SBLGNT
  text: ⸀οὐ νοεῖτε ὅτι πᾶν τὸ εἰσπορευόμενον εἰς τὸ στόμα εἰς τὴν κοιλίαν χωρεῖ καὶ εἰς ἀφεδρῶνα ἐκβάλλεται;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/017.yaml
  text: Do you not understand that everything entering into the mouth goes into the stomach and is expelled into the latrine?[a]
translation:
  language: fr
  text: Ne comprenez-vous pas que tout ce qui entre dans la bouche passe dans l’estomac, puis est évacué dans les latrines ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce qui entre dans la bouche… est expulsé dans les toilettes ».'
    reason: Alternative lexicale pour ἀφεδρών et ἐκβάλλεται.
lexical_decisions:
- source_word: νοεῖτε
  choice: comprenez
  rationale: Le verbe désigne ici la compréhension intellectuelle de l’enseignement de Jésus. « Comprenez » est naturel et conserve la forme de question qui exprime un reproche.
- source_word: πᾶν τὸ εἰσπορευόμενον
  choice: tout ce qui entre
  rationale: Cette tournure rend naturellement en français la construction participiale générique au neutre singulier et en préserve la portée générale.
- source_word: εἰς τὸ στόμα
  choice: dans la bouche
  rationale: La préposition indique un mouvement vers l’intérieur ; « dans la bouche » restitue directement l’image physique.
- source_word: κοιλίαν
  choice: estomac
  rationale: Dans ce contexte digestif, « estomac » est plus précis et plus naturel en français moderne que « ventre ».
- source_word: χωρεῖ
  choice: passe dans
  rationale: Le verbe décrit ici le trajet de la nourriture vers l’estomac. « Passe dans » exprime clairement ce mouvement sans littéralisme maladroit.
- source_word: ἀφεδρῶνα
  choice: latrines
  rationale: Le terme désigne le lieu où sont évacués les excréments. « Latrines » est exact, digne et adapté au cadre ancien ; le pluriel lexical est idiomatique en français.
- source_word: ἐκβάλλεται
  choice: est évacué
  rationale: Le passif décrit l’expulsion hors du corps. « Est évacué » est clair et naturel dans ce contexte physiologique, tout en évitant une formulation inutilement crue.
theological_decisions:
- issue: Rapport entre cette parole de Jésus et les lois de pureté rituelle
  choice: Traduire simplement l’énoncé physiologique sans ajouter une formule explicite d’abrogation.
  alternative: Ajouter une expansion interprétative selon laquelle tous les aliments sont ainsi déclarés purs.
  rationale: Le verset décrit le processus digestif dans le cadre de l’argument de Jésus sur ce qui souille réellement, mais il ne contient pas le commentaire interprétatif explicite de Marc 7.19. La traduction préserve donc la formulation et la tension propres à Matthieu.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du raisonnement grec, tandis que « puis » explicite naturellement la succession déjà portée par les deux propositions coordonnées. Le terme « latrines » maintient le caractère concret de l’image sans registre vulgaire.
