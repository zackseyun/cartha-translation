id: MAT.15.8
reference: Matthew 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Ὁ λαὸς οὗτος⸃ τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/008.yaml
  text: This people honors me with their lips[a], but their heart is far from me.
translation:
  language: fr
  text: Ce peuple m’honore des lèvres, mais son cœur est loin de moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ λαὸς οὗτος
  choice: Ce peuple
  rationale: « Peuple » conserve le sens collectif de λαός, tandis que « ce » rend naturellement le démonstratif οὗτος et maintient l’écho de la citation prophétique.
- source_word: τοῖς χείλεσίν
  choice: des lèvres
  rationale: Le datif est instrumental. La tournure française « honorer des lèvres » conserve l’image corporelle concrète sans la réduire aux paroles.
- source_word: με
  choice: m’
  rationale: Le pronom est le complément direct de τιμᾷ et se rend naturellement par le pronom élidé devant « honore ».
- source_word: τιμᾷ
  choice: honore
  rationale: Le verbe τιμάω exprime ici le fait de rendre honneur; « honore » est précis, courant et digne.
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: mais son cœur
  rationale: Le grec emploie καρδία au singulier avec un possesseur pluriel. En français, puisque « ce peuple » est un collectif singulier, « son cœur » préserve à la fois le singulier grec et la représentation corporative. δέ marque ici le contraste et se rend par « mais ».
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: est loin de moi
  rationale: Cette expression française naturelle traduit directement l’éloignement indiqué par πόρρω et ἀπέχει ἀπό, tout en conservant sa portée relationnelle.
theological_decisions:
- issue: Singulier collectif « cœur » ou pluriel distributif
  choice: 'Conserver le singulier : « son cœur »'
  alternative: « leurs cœurs »
  rationale: Le singulier καρδία présente le peuple comme un corps collectif caractérisé par une même disposition intérieure. Le français permet de préserver cette force en reprenant « ce peuple » par le possessif singulier « son ».
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme entre l’honneur extérieur rendu « des lèvres » et l’éloignement intérieur du « cœur », sans expliciter davantage la tension du texte.
