  text: And calling the crowd to him[a], he said to them, “Listen and understand.”
translation:
  language: fr
  text: 'Et, ayant appelé la foule auprès de lui, il leur dit : « Écoutez et comprenez. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Puis
  rationale: Dans ce contexte narratif, καί fait progresser le récit. « Puis » rend naturellement cet enchaînement en français sans lui donner une portée théologique.
- source_word: προσκαλεσάμενος
  choice: il appela
  rationale: Le participe aoriste moyen exprime une action liée et logiquement antérieure au verbe principal. La coordination française « il appela… et lui dit » restitue clairement la séquence sans lourdeur.
- source_word: τὸν ὄχλον
  choice: la foule
  rationale: « La foule » est l’équivalent moderne et usuel de ὄχλος dans ce cadre narratif.
- source_word: εἶπεν αὐτοῖς
  choice: lui dit
  rationale: Le pronom singulier collectif reprend naturellement « la foule » en français et rend αὐτοῖς sans ambiguïté.
- source_word: Ἀκούετε
  choice: Écoutez
  rationale: L’impératif présent pluriel appelle une écoute attentive. « Écoutez » est naturel en français moderne et conserve la force impérative.
- source_word: συνίετε
  choice: comprenez
  rationale: Le verbe demande de saisir le sens de ce qui est entendu. « Comprenez » préserve la distinction entre écouter et comprendre.
