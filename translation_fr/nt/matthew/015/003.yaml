id: MAT.15.3
reference: Matthew 15:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Διὰ τί καὶ ὑμεῖς παραβαίνετε τὴν ἐντολὴν τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/003.yaml
  text: But he answered and said to them[a], “Why do you also transgress the commandment of God for the sake of your tradition?”
translation:
  language: fr
  text: 'Mais il leur répondit : « Pourquoi transgressez-vous, vous aussi, le commandement de Dieu à cause de votre tradition ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: Mais il leur répondit
  rationale: La tournure grecque « ayant répondu, il leur dit », marquée par une influence sémitique, se rend naturellement en français par « il leur répondit ». « Mais » conserve la valeur contrastive de δέ.
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et idiomatique en français moderne.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: 'Cette formulation conserve le renvoi à l’accusation précédente : Jésus retourne la question à ses interlocuteurs sans donner à καί une emphase excessive.'
- source_word: παραβαίνετε
  choice: transgressez-vous
  rationale: « Transgresser » exprime précisément le fait d’enfreindre une prescription et convient au registre solennel du contexte, tout en restant compréhensible.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: le commandement de Dieu
  rationale: « Commandement » maintient le registre biblique et l’opposition explicite entre l’autorité divine et la tradition des interlocuteurs.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: à cause de votre tradition
  rationale: διά avec l’accusatif exprime ici la cause ou le motif. « À cause de » rend cette relation sans suggérer nécessairement qu’ils agissent consciemment dans le but de servir leur tradition.
theological_decisions:
- issue: Opposition entre le commandement divin et la tradition humaine
  choice: Conserver « le commandement de Dieu » et « votre tradition »
  alternative: Employer « l’ordre de Dieu » et « votre enseignement » ou « vos coutumes »
  rationale: Le texte vise la tradition particulière invoquée par les interlocuteurs et son conflit avec le commandement de Dieu. Cette formulation préserve cette tension sans transformer le verset en condamnation générale de toute tradition.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La formule grecque redondante ἀποκριθεὶς εἶπεν est condensée selon l’usage naturel du français, tandis que « transgresser » et « commandement » préservent la force juridique et biblique de la réplique.
