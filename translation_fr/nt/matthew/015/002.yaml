id: MAT.15.2
reference: Matthew 15:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὰ τί οἱ μαθηταί σου παραβαίνουσιν τὴν παράδοσιν τῶν πρεσβυτέρων; οὐ γὰρ νίπτονται τὰς χεῖρας ⸀αὐτῶν ὅταν ἄρτον ἐσθίωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/002.yaml
  text: Why do your disciples break the tradition of the elders? For they do not wash their hands when they eat bread[a][b].
translation:
  language: fr
  text: « Pourquoi tes disciples enfreignent-ils la tradition des anciens ? En effet, ils ne se lavent pas les mains[a] quand ils mangent du pain[b]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit du lavage des mains prescrit par la tradition des anciens, et non simplement d’une question d’hygiène ordinaire.
    reason: cultural_note
  - marker: b
    text: Ou « quand ils prennent un repas » ; en grec, le mot « pain » peut parfois désigner plus largement la nourriture ou un repas.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: Formulation interrogative naturelle en français moderne pour demander la raison.
- source_word: παραβαίνουσιν
  choice: enfreignent
  rationale: Le verbe désigne le fait de contrevenir à une norme reçue. « Enfreindre » conserve ici la force normative de la tradition sans la présenter comme une loi divine.
- source_word: τὴν παράδοσιν
  choice: la tradition
  rationale: Le terme désigne un enseignement ou un usage transmis. « Tradition » en restitue précisément le caractère reçu et transmis.
- source_word: τῶν πρεσβυτέρων
  choice: des anciens
  rationale: Dans ce contexte, il s’agit des autorités ou prédécesseurs reconnus auxquels cette tradition est rattachée, et non simplement de personnes âgées.
- source_word: οὐ γὰρ
  choice: En effet, … ne … pas
  rationale: γάρ introduit l’explication concrète de l’accusation précédente ; « en effet » rend clairement ce lien.
- source_word: νίπτονται τὰς χεῖρας αὐτῶν
  choice: ils ne se lavent pas les mains
  rationale: νίπτω désigne couramment le lavage d’une partie du corps. La tournure pronominale est idiomatique en français, où l’article défini remplace naturellement le possessif avec les parties du corps.
- source_word: ὅταν
  choice: quand
  rationale: Avec le présent du subjonctif grec, le mot exprime ici une situation habituelle ; « quand » est naturel et laisse le contexte porter cette nuance.
- source_word: ἄρτον
  choice: du pain
  rationale: Le sens premier est « pain ». Il est conservé dans le texte, tout en signalant en note l’emploi possible du pain comme désignation plus générale de la nourriture ou du repas.
- source_word: ἐσθίωσιν
  choice: ils mangent
  rationale: Le présent français convient à l’action habituelle exprimée par la proposition temporelle grecque.
theological_decisions:
- issue: Nature du lavage des mains
  choice: Présenter le geste comme une pratique exigée par la tradition des anciens, sans le qualifier dans le texte principal.
  alternative: Préciser directement qu’il s’agit d’un lavage rituel, ou comprendre le reproche comme une question d’hygiène ordinaire.
  rationale: Le verset rattache explicitement le reproche à la tradition des anciens, mais ne qualifie pas lui-même le lavage. La note fournit le contexte nécessaire sans résoudre plus que ne le fait le texte.
- issue: Autorité de la tradition des anciens
  choice: Employer « enfreignent » pour exprimer la violation d’une norme traditionnelle sans l’assimiler à un commandement divin.
  alternative: Employer « désobéissent », qui pourrait suggérer plus directement une autorité personnelle ou divine, ou « transgressent », plus marqué religieusement.
  rationale: Le grec donne à la tradition une force normative dans la bouche des interlocuteurs, tout en laissant ouverte la question de sa véritable autorité théologique.
translation_notes:
  register: Français international moderne, clair et digne. « Tes disciples » maintient le tutoiement singulier adressé à Jésus. « Enfreignent » exprime la portée normative de la tradition sans employer le terme plus religieux « transgressent ». Les marqueurs [a] et [b] sont placés immédiatement après « pain », auquel les deux notes se rapportent.
