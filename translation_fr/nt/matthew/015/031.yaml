  source_fidelity: La traduction rend correctement la liste des guérisons et « le Dieu d’Israël ». Toutefois, « fut donc émerveillée » affaiblit la construction consécutive active ὥστε … θαυμάσαι et « ceux qui avaient des membres estropiés être rétablis » est syntaxiquement lourd et explicite inutilement l’atteinte par « membres ».
  naturalness: La phrase est globalement compréhensible, mais l’enchaînement « La foule fut donc émerveillée » est moins naturel et moins précis que « si bien que la foule s’émerveilla ». La périphrase relative suivie de l’infinitif passif rompt aussi le parallélisme de la série.
  terminology: « Muets » est justifié contextuellement par « parler », avec une note qui conserve l’alternative « sourds ». « Des personnes estropiées » conserve la référence à κυλλούς dans un français actuel plus respectueux et plus fluide; « rétablies » rend de manière recevable l’état de santé exprimé par ὑγιεῖς. « Rendre gloire au Dieu d’Israël » est exact.
