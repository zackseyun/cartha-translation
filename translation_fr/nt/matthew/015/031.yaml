source:
  edition: SBLGNT
  text: ὥστε ⸂τὸν ὄχλον⸃ θαυμάσαι βλέποντας κωφοὺς λαλοῦντας ⸂κυλλοὺς ὑγιεῖς⸃ ⸀καὶ χωλοὺς περιπατοῦντας καὶ τυφλοὺς βλέποντας· καὶ ἐδόξασαν τὸν θεὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/031.yaml
  text: so that the crowd marveled as they saw the mute speaking, the crippled made well, the lame walking, and the blind seeing; and they glorified the God of Israel.
translation:
  language: fr
  text: si bien que la foule s’émerveilla en voyant les muets parler[a], des personnes estropiées rétablies[b], les boiteux marcher et les aveugles voir; et elle rendit gloire au Dieu d’Israël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les sourds parler ». Le mot grec peut désigner des personnes sourdes ou muettes; ici, « muets » est retenu parce que l’accent immédiat porte sur le fait qu’elles parlent.
    reason: lexical_alternative
  - marker: b
    text: Ou « les estropiés guéris » ou « les mutilés redevenus entiers ». Le grec décrit des personnes estropiées, mutilées ou ayant des membres déformés, désormais rétablies.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: fut donc émerveillée
  rationale: La tournure avec « donc » exprime naturellement en français le résultat des guérisons précédentes sans alourdir la phrase.
- source_word: τὸν ὄχλον
  choice: la foule
  rationale: Équivalent moderne, clair et naturel de ὄχλος dans ce cadre narratif.
- source_word: θαυμάσαι
  choice: fut émerveillée
  rationale: Rend l’étonnement admiratif exprimé par θαυμάζω et s’accorde avec le singulier collectif « la foule ».
- source_word: βλέποντας
  choice: en voyant
  rationale: Le participe indique ce qui provoque l’émerveillement de la foule.
- source_word: κωφοὺς
  choice: les muets
  rationale: κωφός peut désigner des personnes sourdes ou muettes; la mention immédiate de leur parole favorise ici « muets ».
- source_word: λαλοῦντας
  choice: parler
  rationale: Rend directement l’activité retrouvée, en contraste avec « les muets ».
- source_word: κυλλοὺς
  choice: ceux qui avaient des membres estropiés
  rationale: Cette formulation explicite avec précision que κυλλός concerne des membres mutilés, déformés ou invalides, tout en évitant d’employer un nom potentiellement dépréciatif pour les personnes.
- source_word: ὑγιεῖς
  choice: être rétablis
  rationale: L’adjectif prédicatif décrit leur état restauré; « être rétablis » exprime naturellement en français le résultat visible de la guérison.
- source_word: χωλοὺς
  choice: les boiteux
  rationale: Équivalent traditionnel encore intelligible de χωλός dans un récit de guérison.
- source_word: περιπατοῦντας
  choice: marcher
  rationale: Le sens littéral de la marche est requis par le contraste avec « les boiteux ».
- source_word: τυφλοὺς
  choice: les aveugles
  rationale: Équivalent direct et usuel de τυφλός.
- source_word: ἐδόξασαν
  choice: rendirent gloire
  rationale: Conserve le sens cultuel et théologique de δοξάζω tout en étant idiomatique en français.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: au Dieu d’Israël
  rationale: Reproduit fidèlement l’identification biblique de Dieu par son lien avec Israël.
theological_decisions:
- issue: Sens de κωφούς dans κωφοὺς λαλοῦντας
  choice: les muets parler
  alternative: les sourds parler
  rationale: Le mot grec peut signifier « sourds » ou « muets ». Le contraste immédiat avec « parler » favorise « muets », mais l’autre sens réel est conservé en note.
- issue: Portée de δοξάζω à propos de Dieu
  choice: ils rendirent gloire au Dieu d’Israël
  alternative: ils louèrent le Dieu d’Israël
  rationale: « Rendre gloire » conserve plus directement l’idée d’attribuer à Dieu l’honneur suscité par ses œuvres, sans réduire le verbe à la seule louange verbale.
- issue: Description de la restauration des κυλλοί
  choice: ceux qui avaient des membres estropiés être rétablis
  alternative: les estropiés être guéris / les mutilés redevenir entiers
  rationale: La formulation choisie garde l’accent sur la restauration corporelle tout en évitant de préciser au-delà du grec la nature exacte de l’atteinte ou le mécanisme de la guérison.
translation_notes:
  register: Français international moderne, narratif et digne. La phrase privilégie des verbes concrets et une syntaxe fluide. Les termes pouvant désigner un handicap sont employés dans le cadre historique du récit; la périphrase pour κυλλοί vise la précision et le respect des personnes. Les deux ambiguïtés lexicales importantes sont signalées par des notes dont les marqueurs figurent dans le texte.
