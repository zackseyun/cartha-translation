id: MAT.15.21
reference: Matthew 15:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐκεῖθεν ὁ Ἰησοῦς ἀνεχώρησεν εἰς τὰ μέρη Τύρου καὶ Σιδῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/021.yaml
  text: And Jesus went out from there and withdrew to the region of Tyre and Sidon[a].
translation:
  language: fr
  text: Jésus partit de là et se retira dans la région de Tyr et de Sidon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’en alla dans le territoire de Tyr et de Sidon ». Le verbe grec peut être rendu plus simplement, mais « se retira » reflète son emploi récurrent dans Matthieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: '[non rendu séparément]'
  rationale: Le lien narratif est rendu naturellement en français par la continuité de la phrase; commencer par « Et » serait possible, mais moins fluide ici.
- source_word: ἐξελθὼν ἐκεῖθεν
  choice: partit de là
  rationale: Le participe aoriste indique une action précédant le verbe principal. « Partit de là » exprime idiomatiquement la sortie et le point de départ sans ajouter de motif.
- source_word: ἀνεχώρησεν
  choice: se retira
  rationale: Dans Matthieu, le verbe peut désigner le fait de s'éloigner ou de se retirer. « Se retira » conserve cette nuance récurrente sans suggérer nécessairement une fuite.
- source_word: εἰς τὰ μέρη
  choice: dans la région
  rationale: L'expression désigne le territoire ou les environs associés aux villes, sans affirmer que Jésus entra dans les villes elles-mêmes.
- source_word: Τύρου καὶ Σιδῶνος
  choice: de Tyr et de Sidon
  rationale: Forme française usuelle des noms géographiques, dépendant de « région ».
theological_decisions:
- issue: Nuance du déplacement de Jésus vers un territoire associé aux non-Juifs
  choice: Traduire ἀνεχώρησεν par « se retira » sans préciser le motif.
  alternative: « s'en alla » ou « se rendit »
  rationale: Le verbe peut suggérer un retrait délibéré dans le récit matthéen, mais le verset n'en donne pas la raison. La formulation préserve cette nuance et l'ambiguïté du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Partit de là » évite le calque lourd « étant sorti de là », tandis que « se retira » maintient la nuance narrative du verbe principal.
