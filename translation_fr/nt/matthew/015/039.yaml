  text: καὶ ἀπολύσας τοὺς ὄχλους ἐνέβη εἰς τὸ πλοῖον, καὶ ἦλθεν εἰς τὰ ὅρια ⸀Μαγαδάν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/039.yaml
  text: And after dismissing the crowds[a], he got into the boat and came to the region of Magadan.
translation:
  language: fr
  text: Après avoir renvoyé les foules, il monta dans le bateau et se rendit dans la région de Magadan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « Magdala » au lieu de « Magadan ».
    reason: textual_variant
lexical_decisions:
- source_word: ἀπολύσας
  choice: Après avoir renvoyé
  rationale: Le participe aoriste exprime ici une action antérieure au verbe principal. Cette tournure française rend naturellement la succession des actions sans ajouter de nuance.
- source_word: τοὺς ὄχλους
  choice: les foules
  rationale: Le pluriel grec est conservé; « les foules » est clair et naturel en français contemporain.
- source_word: ἐνέβη εἰς τὸ πλοῖον
  choice: il monta dans le bateau
  rationale: La formule grecque désigne l’action d’embarquer. « Monter dans le bateau » en donne une expression concrète et courante.
- source_word: ἦλθεν
  choice: se rendit
  rationale: Dans ce récit de déplacement, « se rendit » exprime idiomatiquement l’arrivée vers la région indiquée, sans alourdir la phrase.
- source_word: τὰ ὅρια
  choice: la région
  rationale: Le pluriel grec « limites/frontières » désigne idiomatiquement un territoire ou une zone géographique; « région » transmet ce sens en français naturel.
- source_word: Μαγαδάν
  choice: Magadan
  rationale: Le texte du SBLGNT porte Μαγαδάν; le nom propre est donc translittéré sous la forme « Magadan », tandis que la variante est signalée en note.
theological_decisions:
- issue: Forme textuelle du nom de lieu à la fin du verset
  choice: Magadan
  alternative: Magdala
  rationale: Il s’agit d’une question textuelle et géographique plutôt que théologique. Le texte principal suit directement la leçon Μαγαδάν du SBLGNT, et la variante connue est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe narrative reste fluide, et le marqueur de note est placé après le nom de lieu auquel la variante se rapporte.
