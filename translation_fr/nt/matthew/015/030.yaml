id: MAT.15.30
reference: Matthew 15:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσῆλθον αὐτῷ ὄχλοι πολλοὶ ἔχοντες μεθ’ ἑαυτῶν ⸂κωφούς, τυφλούς, χωλούς, κυλλούς⸃, καὶ ἑτέρους πολλούς, καὶ ἔρριψαν αὐτοὺς παρὰ τοὺς πόδας ⸀αὐτοῦ, καὶ ἐθεράπευσεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/030.yaml
  text: And large crowds came to him[a], bringing with them the mute, the blind, the lame, the crippled, and many others, and they laid them at his feet[b], and he healed them.
translation:
  language: fr
  text: De grandes foules s’approchèrent de lui, amenant avec elles des personnes muettes[a], aveugles, boiteuses, aux membres infirmes[b], ainsi que beaucoup d’autres. Elles les déposèrent aux pieds de Jésus, et il les guérit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sourdes » ; le mot grec peut désigner des personnes sourdes, muettes, ou atteintes des deux handicaps, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « estropiées » ; le mot grec désigne des personnes dont les membres sont diminués, déformés ou mutilés.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθον αὐτῷ
  choice: s’approchèrent de lui
  rationale: Le verbe προσέρχομαι exprime ici le mouvement vers Jésus. « S’approchèrent de lui » est naturel en français narratif et légèrement plus précis que « vinrent à lui ».
- source_word: ὄχλοι πολλοὶ
  choice: de grandes foules
  rationale: Cette formulation idiomatique rend à la fois la pluralité des foules et leur importance numérique.
- source_word: ἔχοντες μεθ’ ἑαυτῶν
  choice: amenant avec elles
  rationale: Littéralement « ayant avec elles » ; dans ce contexte de déplacement, le participe indique naturellement que les foules amènent ces personnes auprès de Jésus.
- source_word: κωφούς
  choice: des personnes muettes
  rationale: κωφός peut désigner une personne sourde, muette, ou atteinte des deux handicaps. « Personnes muettes » convient au contexte, tandis que l’autre sens principal est conservé en note.
- source_word: τυφλούς
  choice: aveugles
  rationale: Équivalent français direct et usuel de τυφλούς dans une liste de personnes malades ou handicapées.
- source_word: χωλούς
  choice: boiteuses
  rationale: χωλός désigne une personne dont la marche est entravée. « Boiteuses » est concis, courant et distinct de la catégorie suivante.
- source_word: κυλλούς
  choice: aux membres infirmes
  rationale: κυλλός évoque des membres diminués, déformés ou privés de leur intégrité. Cette expression reste précise et digne sans employer un terme aujourd’hui souvent perçu comme dévalorisant.
- source_word: ἑτέρους πολλούς
  choice: beaucoup d’autres
  rationale: Rend simplement les nombreuses autres personnes non détaillées dans l’énumération.
- source_word: ἔρριψαν
  choice: déposèrent
  rationale: Bien que ῥίπτω puisse signifier « jeter », le contexte permet le sens de poser ou déposer. « Déposèrent » conserve une certaine vigueur sans suggérer nécessairement un traitement brutal.
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: aux pieds de Jésus
  rationale: « Aux pieds de » est l’expression française idiomatique. La reprise de « Jésus » à la place du pronom évite l’ambiguïté créée en français par le sujet pluriel immédiatement précédent.
- source_word: ἐθεράπευσεν αὐτούς
  choice: il les guérit
  rationale: Traduction directe et habituelle de θεραπεύω dans les récits évangéliques de guérison.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La formulation privilégie des désignations respectueuses (« personnes muettes », « aux membres infirmes ») tout en gardant une énumération concise. Les ambiguïtés lexicales réelles de κωφούς et κυλλούς sont signalées en notes.
