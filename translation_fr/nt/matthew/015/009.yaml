  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/009.yaml
  text: But they worship me in vain[b][a], teaching as doctrines the commandments of men.
translation:
  language: fr
  text: Mais c’est en vain qu’ils m’adorent, en enseignant comme doctrines des commandements humains.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils enseignent des commandements humains comme doctrines ».'
    reason: La construction grecque, reprise d’Ésaïe, est concise et permet de mettre en avant soit « doctrines », soit « commandements humains », sans modifier leur rapport.
lexical_decisions:
- source_word: μάτην
  choice: en vain
  rationale: Cette expression naturelle conserve le sens de « sans résultat, inutilement » ainsi que la force du reproche prophétique.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque ici une légère opposition dans la continuité de la citation; « mais » convient au ton de réprimande.
- source_word: σέβονταί
  choice: ils m’adorent
  rationale: Le verbe exprime la vénération ou le culte rendu à Dieu; « adorer » est idiomatique et adapté à l’objet « moi ».
- source_word: διδάσκοντες
  choice: car ils enseignent
  rationale: Le participe indique la circonstance qui explique en quoi leur culte est vain. « Car » rend clairement ce rapport en français sans imposer une nuance temporelle.
- source_word: διδασκαλίας
  choice: comme doctrines
  rationale: Dans la formulation grecque condensée, le terme qualifie ce sous quoi les commandements humains sont enseignés; cette tournure rend le rapport intelligible sans en changer le sens.
- source_word: ἐντάλματα
  choice: des commandements
  rationale: Le mot désigne des prescriptions ou ordres et « commandements » maintient le registre religieux et l’écho scripturaire.
- source_word: ἀνθρώπων
  choice: humains
  rationale: Le génitif est générique et oppose l’origine humaine à l’origine divine. « Humains » exprime cette opposition exactement, sans suggérer qu’il s’agit seulement d’hommes de sexe masculin.
theological_decisions:
- issue: Rapport syntaxique dans διδασκαλίας ἐντάλματα ἀνθρώπων
  choice: ils enseignent comme doctrines des commandements humains
  alternative: ils enseignent des doctrines qui ne sont que des commandements humains
  rationale: Le grec, qui reprend la formulation de la Septante, est condensé. La traduction retenue exprime que des prescriptions d’origine humaine reçoivent le statut de doctrines, tout en préservant la tension entre autorité humaine et autorité divine.
- issue: Valeur générique de ἀνθρώπων
  choice: humains
  alternative: des hommes
  rationale: Le terme désigne ici les êtres humains en général et non les personnes de sexe masculin. L’adjectif « humains » restitue directement le contraste théologique avec ce qui vient de Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le ton prophétique de la citation et emploie « commandements humains » pour rendre clairement l’opposition entre l’origine humaine et l’autorité divine.
