  text: But Peter answered and said to him[a], “Explain this parable to us.”
translation:
  language: fr
  text: 'Pierre lui répondit : « Explique-nous cette parabole. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ ὁ Πέτρος εἶπεν αὐτῷ
  choice: Pierre lui répondit
  rationale: La tournure grecque littérale « ayant répondu, Pierre lui dit » est un idiome narratif. « Pierre lui répondit » en restitue naturellement le sens en français moderne; le léger enchaînement marqué par δέ ressort suffisamment du contexte sans imposer « mais ».
- source_word: Φράσον
  choice: Explique
  rationale: L’impératif de φράζω demande ici de faire comprendre ou de clarifier le propos figuré; « explique » est précis et idiomatique.
- source_word: ἡμῖν
  choice: -nous
  rationale: Le pronom datif désigne les bénéficiaires de l’explication et se rend naturellement par le pronom complément « nous ».
- source_word: τὴν παραβολὴν ταύτην
  choice: cette parabole
  rationale: « Parabole » conserve le terme évangélique habituel, tandis que « cette » renvoie au propos immédiatement précédent.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. La formule sémitisante « répondit et dit » est allégée en « répondit » pour une lecture naturelle, sans perte de contenu. Aucun marqueur de note n’est requis.
