id: MAT.15.5
reference: Matthew 15:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ὃς ἂν εἴπῃ τῷ πατρὶ ἢ τῇ μητρί· Δῶρον ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/005.yaml
  text: But you say[a], ‘Whoever says to his father or his mother, “Whatever you would have benefited from me is a gift,”’
translation:
  language: fr
  text: 'Mais vous, vous dites : « Si quelqu’un dit à son père ou à sa mère : “Ce dont tu aurais pu bénéficier de ma part est un don[a]”, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une offrande ». Il s’agit de déclarer consacré à Dieu ce qui aurait pu servir à soutenir ses parents ; voir Marc 7.11, où figure le terme « korban ».
    reason: Alternative lexicale et clarification du contexte cultuel.
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: Mais vous, vous dites
  rationale: δὲ marque le contraste avec le commandement cité précédemment, tandis que le pronom explicite ὑμεῖς porte une valeur contrastive. La reprise « vous, vous » est naturelle en français et conserve cette insistance.
- source_word: Ὃς ἂν εἴπῃ
  choice: Si quelqu’un dit
  rationale: Le relatif avec ἄν et le subjonctif aoriste exprime un cas général indéfini. « Si quelqu’un dit » rend clairement cette valeur conditionnelle sans alourdir la phrase.
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: à son père ou à sa mère
  rationale: Le datif désigne les destinataires de la parole. Le possessif est requis par l’usage français et correspond au référent singulier indéfini.
- source_word: Δῶρον
  choice: un don
  rationale: δῶρον signifie « don » ou « offrande ». « Don » conserve le sens lexical direct de Matthieu sans introduire dans le texte le terme technique « korban » employé dans le parallèle de Marc.
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: Ce dont tu aurais pu bénéficier de ma part
  rationale: La formulation conserve l’orientation de ἐξ ἐμοῦ (« de ma part ») et la valeur passive de ὠφεληθῇς. « Aurais pu bénéficier » exprime naturellement en français le bénéfice éventuel désormais soustrait au parent.
theological_decisions:
- issue: Faut-il introduire le terme technique « korban » dans le texte de Matthieu ?
  choice: Conserver « un don » dans le texte et expliquer l’idée d’offrande consacrée en note.
  alternative: Traduire « une offrande » ou insérer « korban ».
  rationale: Matthieu emploie δῶρον, et non κορβᾶν comme Marc 7.11. La traduction respecte donc le lexique propre à Matthieu tout en signalant en note la portée cultuelle du propos.
translation_notes:
  register: Français moderne, international et digne. Le discours direct imbriqué est conservé. « Mais vous, vous dites » maintient l’opposition emphatique du grec ; « de ma part » reste compréhensible tout en reflétant la structure de la source.
