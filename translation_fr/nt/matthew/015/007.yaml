  text: ὑποκριταί, καλῶς ἐπροφήτευσεν περὶ ὑμῶν Ἠσαΐας λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/007.yaml
  text: 'Hypocrites[a], Isaiah rightly prophesied about you, saying:'
translation:
  language: fr
  text: 'Hypocrites ! Ésaïe a prophétisé avec justesse[a] à votre sujet en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a bien prophétisé à votre sujet ».'
    reason: Alternative lexicale pour καλῶς, qui peut être rendu plus littéralement par « bien ».
lexical_decisions:
- source_word: ὑποκριταί
  choice: Hypocrites !
  rationale: Le vocatif pluriel constitue une interpellation directe et sévère. Le terme français « hypocrites » conserve la force morale et religieuse du grec, tandis que le point d’exclamation rend naturellement l’apostrophe en français.
- source_word: καλῶς
  choice: avec justesse
  rationale: L’adverbe qualifie l’acte de prophétiser comme juste, pertinent ou bien appliqué aux interlocuteurs de Jésus. « Avec justesse » exprime ce sens sans laisser entendre que Jésus commente seulement la qualité stylistique de la prophétie.
- source_word: ἐπροφήτευσεν
  choice: a prophétisé
  rationale: Cette formulation directe conserve le registre prophétique et le lien explicite avec Ésaïe.
- source_word: περὶ ὑμῶν
  choice: à votre sujet
  rationale: Cette expression française naturelle rend περί avec le génitif au sens de « au sujet de, concernant ».
- source_word: Ἠσαΐας
  choice: Ésaïe
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: λέγων
  choice: 'quand il a dit :'
  rationale: Le participe présent introduit la citation qui suit. La tournure « quand il a dit » est naturelle en français et explicite sobrement cette fonction.
theological_decisions:
- issue: Force de l’interpellation adressée aux pharisiens et aux spécialistes de la Loi
  choice: 'Une condamnation directe : « Hypocrites ! »'
  alternative: Une formulation atténuée comme « Comédiens ! » ou « Vous qui faites semblant ! »
  rationale: Dans ce contexte, ὑποκριταί porte une accusation morale et religieuse forte. L’atténuer affaiblirait le jugement de Jésus et le lien avec la citation d’Ésaïe.
- issue: Portée de καλῶς sur la prophétie d’Ésaïe
  choice: « a prophétisé avec justesse »
  alternative: « a bien prophétisé »
  rationale: Le grec peut exprimer que la prophétie est juste ou qu’elle s’applique pertinemment aux interlocuteurs. La traduction principale privilégie cette portée contextuelle tout en signalant en note la formulation plus littérale.
translation_notes:
  register: Français international moderne, digne et direct. L’ordre de la phrase reste naturel en français tout en conservant l’interpellation vigoureuse, la référence explicite à Ésaïe et l’introduction de la citation suivante.
