id: MAT.15.38
reference: Matthew 15:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἐσθίοντες ἦσαν τετρακισχίλιοι ἄνδρες χωρὶς γυναικῶν καὶ παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/038.yaml
  text: Those who had eaten were four thousand men[a], besides women and children.
translation:
  language: fr
  text: Ceux qui avaient mangé étaient quatre mille hommes, sans compter les femmes et les enfants.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: Ceux
  rationale: L’article avec le participe est rendu substantivement par « Ceux ». δέ est ici un connecteur léger que le français peut laisser implicite sans créer un contraste artificiel.
- source_word: ἐσθίοντες
  choice: qui avaient mangé
  rationale: Bien que le participe soit au présent en grec, le contexte désigne les personnes ayant pris part au repas qui vient de s’achever; le plus-que-parfait est naturel en français.
- source_word: ἦσαν
  choice: étaient
  rationale: La copule introduit directement le nombre; « étaient » en conserve la simplicité.
- source_word: τετρακισχίλιοι
  choice: quatre mille
  rationale: Traduction directe du nombre cardinal.
- source_word: ἄνδρες
  choice: hommes
  rationale: ἀνήρ désigne ici spécifiquement des hommes, distingués ensuite des femmes et des enfants; « personnes » effacerait cette distinction.
- source_word: χωρὶς
  choice: sans compter
  rationale: Dans cette formule de dénombrement, χωρίς indique que les femmes et les enfants ne sont pas inclus dans le total annoncé; « sans compter » l’exprime clairement et naturellement.
- source_word: γυναικῶν
  choice: les femmes
  rationale: Le sens générique « femmes » convient ici mieux que le sens plus restreint « épouses ».
- source_word: καὶ παιδίων
  choice: et les enfants
  rationale: « Enfants » rend naturellement παιδίων sans imposer une tranche d’âge plus étroite.
theological_decisions:
- issue: Formule de dénombrement distinguant les sexes et les âges
  choice: Conserver « hommes » et mentionner séparément les femmes et les enfants.
  alternative: Employer « personnes » pour désigner l’ensemble du groupe.
  rationale: Le grec précise ἄνδρες et distingue expressément les femmes et les enfants. « Personnes » supprimerait une distinction présente dans le texte source.
translation_notes:
  register: Français international moderne, clair et digne. La formulation concise suit la structure grecque tout en employant l’expression idiomatique « sans compter ». Aucun appel de note n’est nécessaire, puisque cette valeur de χωρίς est donnée directement dans le texte.
