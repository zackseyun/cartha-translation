  text: ⸀ἔλαβεν τοὺς ἑπτὰ ἄρτους καὶ τοὺς ἰχθύας ⸀καὶ εὐχαριστήσας ἔκλασεν καὶ ⸀ἐδίδου τοῖς ⸀μαθηταῖς οἱ δὲ μαθηταὶ ⸂τοῖς ὄχλοις⸃.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/036.yaml
  text: He took the seven loaves and the fish[a], and after giving thanks he broke them and kept giving them to the disciples, and the disciples to the crowds.
translation:
  language: fr
  text: Il prit les sept pains et les poissons. Après avoir rendu grâce, il rompit les pains et les donnait aux disciples, et les disciples les donnaient aux foules.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβεν
  choice: Il prit
  rationale: Dans cette séquence narrative, « prendre » exprime naturellement le geste par lequel Jésus saisit la nourriture avant de rendre grâce et de la distribuer.
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: les sept pains
  rationale: Dans ce récit, ἄρτος désigne des pains concrets. En français courant, « pains » est naturel et suffisamment précis.
- source_word: τοὺς ἰχθύας
  choice: les poissons
  rationale: Le pluriel français rend explicitement la forme grecque et désigne les poissons servant de nourriture.
- source_word: εὐχαριστήσας
  choice: après avoir rendu grâce
  rationale: Cette formulation naturelle conserve l'antériorité du participe aoriste par rapport à « il les rompit », sans ajouter explicitement un destinataire absent du grec.
- source_word: ἔκλασεν
  choice: il les rompit
  rationale: « Rompre » convient au geste effectué sur les pains et garde la dignité narrative. Le pronom « les », implicite en grec, est requis par l'usage français et renvoie naturellement aux aliments.
- source_word: ἐδίδου
  choice: continua à les donner
  rationale: L'imparfait grec présente une distribution en cours ou répétée. « Continua à les donner » en restitue l'aspect sans suggérer un geste unique.
- source_word: τοῖς μαθηταῖς
  choice: aux disciples
  rationale: Le datif indique les destinataires. Aucun possessif n'est ajouté, puisqu'il n'est pas exprimé dans le grec.
- source_word: οἱ δὲ μαθηταὶ τοῖς ὄχλοις
  choice: qui les donnaient aux foules
  rationale: Le grec sous-entend le verbe dans la seconde proposition. Le français le rétablit pour la clarté; l'imparfait « donnaient » maintient l'idée de distribution en cours. « Foules » conserve le pluriel de ὄχλοις.
theological_decisions:
- issue: Résonance eucharistique possible de εὐχαριστήσας
  choice: Traduire l'action narrative ordinaire par « après avoir rendu grâce » sans développement sacramentel.
  alternative: Employer une formulation plus liturgique qui mettrait au premier plan une lecture eucharistique.
  rationale: Le vocabulaire peut évoquer des traditions liées au repas du Seigneur, mais le verset décrit directement Jésus rendant grâce pour la nourriture dans le récit de la multiplication. La traduction ne doit pas transformer cette possible résonance en affirmation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement explicitée pour éviter l'ellipse peu naturelle en français, tout en conservant la progression des gestes et l'aspect continu de la distribution.
