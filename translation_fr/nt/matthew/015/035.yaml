  text: And after instructing the crowd to recline on the ground,[a]
translation:
  language: fr
  text: Et, après avoir ordonné à la foule de prendre place par terre,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Puis
  rationale: Dans la continuité narrative, « Puis » rend naturellement la coordination grecque et la succession des actions.
- source_word: παραγγείλας
  choice: il ordonna
  rationale: Le participe aoriste exprime une directive donnée par Jésus avant l’action du verset suivant. La tournure française avec un verbe conjugué est naturelle, tandis que « ordonna » conserve la force directive du grec.
- source_word: τῷ ὄχλῳ
  choice: à la foule
  rationale: Le datif désigne les destinataires de l’ordre; « la foule » est précis et courant en français moderne.
- source_word: ἀναπεσεῖν
  choice: de s’installer
  rationale: Dans le contexte d’un repas, le verbe indique que chacun prend place, normalement dans une posture allongée ou semi-allongée. « S’installer » reste naturel en français et ne donne pas l’impression moderne d’un simple acte de s’asseoir.
- source_word: ἐπὶ τὴν γῆν
  choice: par terre
  rationale: Ici, γῆ désigne le sol sur lequel la foule prend place. « Par terre » est l’expression française la plus idiomatique dans ce contexte.
theological_decisions: []
translation_notes:
  register: Français moderne, narratif et digne. La formulation privilégie une expression immédiatement compréhensible tout en signalant en note la posture de repas plus précise portée par le verbe grec.
