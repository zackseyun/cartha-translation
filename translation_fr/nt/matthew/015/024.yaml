source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Οὐκ ἀπεστάλην εἰ μὴ εἰς τὰ πρόβατα τὰ ἀπολωλότα οἴκου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/024.yaml
  text: But he answered[a], “I was sent only to the lost sheep of the house of Israel.”
translation:
  language: fr
  text: 'Mais il répondit : « Je n’ai été envoyé qu’aux brebis perdues de la maison d’Israël. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν
  choice: Mais il répondit
  rationale: La tournure participiale suivie de « dit » s’exprime naturellement en français par le seul verbe « répondit » ; « Mais » rend le léger contraste marqué par δέ.
- source_word: Οὐκ ἀπεστάλην εἰ μὴ
  choice: Je n’ai été envoyé qu’aux
  rationale: La construction restrictive οὐκ… εἰ μή trouve son équivalent idiomatique exact dans « ne… que ». Le passé composé convient au discours direct en français moderne et conserve le passif de mission.
- source_word: τὰ πρόβατα τὰ ἀπολωλότα
  choice: les brebis perdues
  rationale: Cette expression préserve l’image pastorale. « Perdues » convient mieux que « mortes » ou « vouées à la perdition » dans l’image de brebis égarées.
- source_word: οἴκου Ἰσραήλ
  choice: de la maison d’Israël
  rationale: Cette formulation conserve l’expression biblique nationale et collective, sans la réduire à la famille ou à la maisonnée au sens domestique.
theological_decisions:
- issue: Portée de la mission déclarée par Jésus
  choice: 'Conserver la restriction explicite : « Je n’ai été envoyé qu’aux… »'
  alternative: Reformuler comme une simple priorité accordée à Israël ou intégrer ici la mission ultérieure auprès des nations.
  rationale: Le grec οὐκ… εἰ μή énonce une restriction nette dans ce contexte narratif. La traduction préserve cette tension sans l’atténuer ni la résoudre à partir d’autres passages.
translation_notes:
  register: Français moderne, naturel et digne. Le passé composé est plus idiomatique que le passé simple dans une parole citée. L’expression traditionnelle « maison d’Israël » est maintenue pour sa portée biblique.
