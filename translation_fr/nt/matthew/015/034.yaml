  text: And Jesus said to them[a], “How many loaves do you have?” And they said, “Seven, and a few small fish.”
translation:
  language: fr
  text: 'Jésus leur dit : « Combien de pains avez-vous ? » Ils répondirent : « Sept, et quelques petits poissons[a]. »'
