lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, naturel dans une narration française écrite et digne.
- source_word: Πόσους ἄρτους
  choice: Combien de pains
  rationale: Dans ce contexte, ἄρτοι désigne des pains comptables; « pains » est l’équivalent français naturel.
- source_word: ἔχετε
  choice: avez-vous
  rationale: Formulation interrogative directe, idiomatique en français moderne.
- source_word: οἱ δὲ εἶπαν
  choice: Ils répondirent
  rationale: Le verbe « répondre » restitue naturellement la prise de parole suscitée par la question; δέ marque ici la progression narrative sans opposition forte.
- source_word: Ἑπτά
  choice: Sept
  rationale: Traduction directe du nombre.
- source_word: ὀλίγα
  choice: quelques
  rationale: Équivalent français courant exprimant une petite quantité indéterminée.
- source_word: ἰχθύδια
  choice: petits poissons
  rationale: Le diminutif grec est explicitement conservé dans le texte français, tout en signalant en note que le contexte peut aussi permettre le simple mot « poissons ».
