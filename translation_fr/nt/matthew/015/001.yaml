  source_fidelity: 'Le texte rend fidèlement tous les éléments grecs : τότε (« Alors »), le présent narratif προσέρχονται (« s’approchent »), le datif de personne (« de Jésus »), la provenance ἀπὸ Ἱεροσολύμων (« venus de Jérusalem »), les deux groupes coordonnés, et le participe λέγοντες introduisant la parole qui suit. « Venus de Jérusalem » est une transposition française naturelle de l’origine, sans inférer une mission officielle.'
