  text: Τότε προσέρχονται τῷ ⸀Ἰησοῦ ἀπὸ Ἱεροσολύμων ⸂Φαρισαῖοι καὶ γραμματεῖς⸃ λέγοντες
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/001.yaml
  text: Then Pharisees and scribes from Jerusalem come to Jesus[a], saying[b],
translation:
  language: fr
  text: 'Alors des pharisiens et des spécialistes de la Loi venus de Jérusalem s’approchent de Jésus et lui disent :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français l’enchaînement temporel et narratif avec l’épisode précédent.
- source_word: προσέρχονται
  choice: s’approchent de
  rationale: Rend directement le mouvement vers Jésus et conserve le présent historique du grec.
- source_word: τῷ Ἰησοῦ
  choice: de Jésus
  rationale: Le complément requis par « s’approchent » désigne sans ambiguïté la personne vers laquelle ils vont.
- source_word: ἀπὸ Ἱεροσολύμων
  choice: venus de Jérusalem
  rationale: Exprime clairement leur provenance tout en s’intégrant avec naturel au groupe nominal français.
- source_word: Φαρισαῖοι
  choice: pharisiens
  rationale: Désignation historique traditionnelle et largement reconnue de ce groupe juif.
- source_word: γραμματεῖς
  choice: spécialistes de la Loi
  rationale: Dans ce contexte, le terme désigne des hommes versés dans l’interprétation de la Loi; cette formulation moderne évite que « scribes » soit compris comme de simples copistes.
- source_word: καὶ
  choice: et
  rationale: Coordonne simplement les deux groupes mentionnés.
- source_word: λέγοντες
  choice: et lui disent
  rationale: Introduit naturellement en français le discours direct du verset suivant, tout en conservant le présent narratif; le pronom « lui » explicite le destinataire déjà indiqué.
theological_decisions:
- issue: Présent historique dans le récit
  choice: Conserver le présent (« s’approchent », « disent »)
  alternative: Employer le passé (« s’approchèrent », « dirent »)
  rationale: Le grec emploie un présent historique qui donne de l’immédiateté à la scène; le présent narratif est également naturel en français.
- issue: Sens contextuel de γραμματεῖς
  choice: « spécialistes de la Loi »
  alternative: « scribes » ou « enseignants de la Loi »
  rationale: Le choix met en évidence leur fonction d’experts religieux et juridiques sans leur attribuer un statut doctrinal plus précis que ne le fait le texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste ouverte par les deux-points afin d’introduire la question du verset suivant. Aucun appel de note n’est nécessaire, puisque les choix lexicaux sont exprimés clairement dans le corps du texte.
