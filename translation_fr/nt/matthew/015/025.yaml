  text: ἡ δὲ ἐλθοῦσα ⸀προσεκύνει αὐτῷ λέγουσα· Κύριε, βοήθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/025.yaml
  text: But she came and knelt before him[a], saying, “Lord, help me.”
translation:
  language: fr
  text: 'Mais elle vint se mettre à genoux devant lui[a] et dit : « Seigneur, aide-moi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’adora ». Le verbe grec peut désigner le fait de se prosterner avec révérence, de rendre hommage ou d’adorer, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un léger contraste avec l’échange précédent et souligne la persistance de la femme.
- source_word: ἐλθοῦσα
  choice: elle vint
  rationale: Le participe aoriste est rendu naturellement par un verbe conjugué, tout en conservant le mouvement de la femme vers Jésus.
- source_word: προσεκύνει αὐτῷ
  choice: se mettre à genoux devant lui
  rationale: Le verbe peut désigner une prosternation respectueuse, un hommage ou l’adoration. Cette formulation exprime le geste corporel de révérence sans préciser davantage que le contexte la compréhension théologique de la femme.
- source_word: λέγουσα
  choice: et dit
  rationale: Le participe introduisant les paroles est rendu par une coordination idiomatique en français.
- source_word: Κύριε
  choice: Seigneur
  rationale: Cette appellation respectueuse et forte adressée à Jésus correspond à l’usage de κύριος dans ce contexte.
- source_word: βοήθει μοι
  choice: aide-moi
  rationale: Cette formule brève et directe restitue l’impératif présent et l’urgence de la supplication.
theological_decisions:
- issue: Sens de προσκυνέω à l’égard de Jésus
  choice: se mettre à genoux devant lui
  alternative: l’adorer
  rationale: Le verbe peut exprimer aussi bien un geste de révérence ou d’hommage que l’adoration. Le texte principal conserve le geste visible sans trancher la portée théologique, tandis que la note signale l’autre traduction légitime.
translation_notes:
  register: Français moderne, naturel et digne. Le passé simple convient au registre narratif biblique soutenu sans être archaïque; l’exclamation rend la force de la supplication très brève.
