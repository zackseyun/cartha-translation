  yaml_path: translation/nt/matthew/015/016.yaml
  text: But he said[a], “Are you also still without understanding?”
translation:
  language: fr
  text: 'Mais il dit : « Vous aussi, vous ne comprenez toujours pas ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici une légère opposition ou la reprise de parole de Jésus en réponse aux disciples.
- source_word: ὁ … εἶπεν
  choice: il dit
  rationale: L’article substantivé renvoie à Jésus, déjà identifié dans le contexte; le présent de narration est naturel en français biblique moderne.
- source_word: Ἀκμὴν
  choice: toujours
  rationale: Dans cette question, l’adverbe exprime la persistance jusqu’à maintenant du manque de compréhension.
- source_word: καὶ ὑμεῖς
  choice: vous aussi, vous
  rationale: 'La dislocation française rend l’insistance du pronom explicite ὑμεῖς et la valeur inclusive de καί : même les disciples sont concernés.'
- source_word: ἀσύνετοί ἐστε
  choice: vous ne comprenez pas
  rationale: Cette formulation idiomatique exprime le défaut de compréhension visé dans le contexte sans durcir le reproche en jugement moral de folie.
theological_decisions:
- issue: Tonalité du reproche adressé aux disciples
  choice: Une question directe sur leur incompréhension persistante
  alternative: « Êtes-vous aussi encore dépourvus d’intelligence ? »
  rationale: Le grec contient un reproche réel, mais le contexte porte sur l’incapacité à saisir l’enseignement. La formulation choisie conserve cette tension sans amplifier la sévérité.
translation_notes:
  register: Français international moderne, direct et digne. La reprise « Vous aussi, vous » est idiomatique et restitue l’emphase grecque; « toujours » porte à lui seul la valeur temporelle de Ἀκμήν.
