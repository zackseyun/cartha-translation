id: MAT.15.28
reference: Matthew 15:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῇ· Ὦ γύναι, μεγάλη σου ἡ πίστις· γενηθήτω σοι ὡς θέλεις. καὶ ἰάθη ἡ θυγάτηρ αὐτῆς ἀπὸ τῆς ὥρας ἐκείνης.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/028.yaml
  text: Then Jesus answered her[a], “O woman, great is your faith[b]; let it be done for you as you desire.” And her daughter was healed from that hour.
translation:
  language: fr
  text: 'Alors Jésus lui répondit : « Femme, ta foi[a] est grande ! Qu’il en soit pour toi comme tu le veux. » Et dès ce moment[b], sa fille fut guérie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « confiance ». Le grec πίστις peut désigner la foi, la confiance ou la fidélité; ici, il souligne la confiance de cette femme en Jésus.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à partir de cette heure-là ».
    reason: literal_rendering
lexical_decisions:
- source_word: τότε
  choice: Alors
  rationale: Marque naturellement en français l’enchaînement temporel et narratif avec l’échange précédent.
- source_word: ἀποκριθεὶς … εἶπεν αὐτῇ
  choice: Jésus lui répondit
  rationale: Le participe et le verbe de parole forment une introduction idiomatique au discours; cette formulation évite une répétition artificielle tout en conservant αὐτῇ (« lui »).
- source_word: Ὦ γύναι
  choice: Femme
  rationale: Rend directement le vocatif γύναι. L’omission de « Ô » donne un français plus actuel sans ajouter la nuance mondaine de « Madame »; dans ce contexte, l’adresse n’est pas méprisante.
- source_word: μεγάλη σου ἡ πίστις
  choice: ta foi est grande
  rationale: Formulation française naturelle qui conserve l’éloge appuyé de Jésus. « Foi » demeure l’équivalent principal de πίστις dans ce contexte de confiance placée en Jésus.
- source_word: γενηθήτω σοι ὡς θέλεις
  choice: Qu’il en soit pour toi comme tu le veux
  rationale: Conserve la force performative de l’impératif passif et le bénéficiaire exprimé par σοι, dans une tournure française digne et intelligible.
- source_word: ἰάθη
  choice: fut guérie
  rationale: Rend l’aoriste passif de ἰάομαι et présente la guérison comme un événement accompli.
- source_word: ἀπὸ τῆς ὥρας ἐκείνης
  choice: dès ce moment
  rationale: Exprime naturellement en français le point de départ immédiat indiqué par la locution grecque, dont la forme littérale est signalée en note.
theological_decisions:
- issue: Sens de πίστις dans l’éloge prononcé par Jésus
  choice: foi
  alternative: confiance
  rationale: Le contexte met en avant la confiance persévérante de la femme envers Jésus. « Foi » préserve à la fois le terme théologique usuel et cette dimension relationnelle, tandis que la note maintient l’autre nuance possible.
translation_notes:
  register: Français international moderne, narratif et digne. L’adresse « Femme » reste directe comme le grec sans être rendue volontairement rude. Le discours de Jésus conserve une certaine solennité, tandis que « dès ce moment » évite une tournure inutilement littérale dans le corps du texte.
