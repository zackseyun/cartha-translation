id: MAT.15.20
reference: Matthew 15:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτά ἐστιν τὰ κοινοῦντα τὸν ἄνθρωπον, τὸ δὲ ἀνίπτοις χερσὶν φαγεῖν οὐ κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/020.yaml
  text: These are the things that defile the man[b][a], but to eat with unwashed hands does not defile the man.
translation:
  language: fr
  text: Voilà ce qui rend l’être humain impur[a] ; mais manger sans s’être lavé les mains ne rend pas l’être humain impur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « souille l’être humain ». Le verbe grec peut désigner le fait de rendre quelqu’un impur dans un cadre rituel ; ici, il évoque aussi l’impureté morale dont Jésus vient de parler.
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῦντα / κοινοῖ
  choice: rend impur / ne rend pas impur
  rationale: Dans ce contexte de pureté, κοινόω signifie rendre impur, avec une portée à la fois rituelle et morale. Cette formulation française est naturelle et maintient le lien lexical entre les deux propositions.
- source_word: ἄνθρωπον
  choice: l’être humain
  rationale: Le singulier grec a une valeur générique. « L’être humain » conserve le singulier représentatif sans donner à tort au référent un sexe masculin particulier.
- source_word: ἀνίπτοις χερσὶν φαγεῖν
  choice: manger sans s’être lavé les mains
  rationale: Cette formulation idiomatique rend clairement l’action de manger avec des mains non lavées et fait comprendre que le lavage attendu précède le repas.
- source_word: ταῦτά ἐστιν τὰ
  choice: Voilà ce qui
  rationale: Formulation française naturelle qui conserve la force récapitulative et démonstrative du grec.
- source_word: δέ
  choice: mais
  rationale: « Mais » exprime nettement le contraste entre ce qui rend réellement impur et le fait de manger sans lavage préalable des mains.
theological_decisions:
- issue: Portée de κοινόω dans la controverse sur la pureté
  choice: « rendre impur » pour conserver le cadre rituel tout en permettant la portée morale du propos
  alternative: « souiller »
  rationale: « Rendre impur » correspond directement au langage de la pureté, tandis que le contexte précédent montre que cette impureté comporte aussi une dimension morale. La traduction évite de réduire le terme à l’un ou l’autre domaine.
- issue: Valeur générique de ἄνθρωπον
  choice: « l’être humain » au singulier
  alternative: « la personne » ou « les gens »
  rationale: Le choix préserve le singulier générique du texte source et exprime une vérité concernant tout humain, sans transformer le singulier en pluriel.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « rend l’être humain impur » reproduit le contraste lexical du grec. « Voilà ce qui » convient à la conclusion récapitulative du discours.
