id: MAT.15.19
reference: Matthew 15:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκ γὰρ τῆς καρδίας ἐξέρχονται διαλογισμοὶ πονηροί, φόνοι, μοιχεῖαι, πορνεῖαι, κλοπαί, ψευδομαρτυρίαι, βλασφημίαι.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/019.yaml
  text: For out of the heart come evil thoughts[a], murders, adulteries, sexual immoralities, thefts, false testimonies, and blasphemies.
translation:
  language: fr
  text: Car c’est du cœur que viennent les mauvaises pensées, les meurtres, les adultères, les actes d’immoralité sexuelle, les vols, les faux témoignages et les calomnies[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les blasphèmes ». Le terme grec peut désigner soit des paroles calomnieuses contre des personnes, soit des paroles blasphématoires contre Dieu, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ γὰρ τῆς καρδίας
  choice: Car c’est du cœur que
  rationale: « Car » conserve la valeur explicative de γάρ, tandis que « du cœur » exprime l’origine marquée par ἐκ et maintient la métaphore biblique du cœur comme centre de la personne intérieure.
- source_word: ἐξέρχονται
  choice: viennent
  rationale: Avec « du cœur », ce verbe rend naturellement en français l’idée de sortir ou de provenir d’une source intérieure.
- source_word: διαλογισμοὶ πονηροί
  choice: les mauvaises pensées
  rationale: Cette formulation courante conserve le sens moral de πονηροί sans réduire διαλογισμοί à des raisonnements argumentatifs ni le préciser excessivement comme des complots.
- source_word: φόνοι
  choice: les meurtres
  rationale: « Meurtres » rend directement la portée criminelle et morale du nom grec au pluriel.
- source_word: μοιχεῖαι
  choice: les adultères
  rationale: Le pluriel français préserve la forme de l’énumération grecque et désigne des actes d’adultère.
- source_word: πορνεῖαι
  choice: les actes d’immoralité sexuelle
  rationale: Cette expression rend la largeur sémantique du terme, qui désigne diverses conduites sexuelles illicites, tout en évitant l’étroitesse et le caractère vieilli de « fornications ».
- source_word: κλοπαί
  choice: les vols
  rationale: Équivalent français direct, naturel et pluriel du nom grec.
- source_word: ψευδομαρτυρίαι
  choice: les faux témoignages
  rationale: La traduction conserve le pluriel ainsi que la nuance testimoniale, éventuellement judiciaire, du terme.
- source_word: βλασφημίαι
  choice: les calomnies
  rationale: Dans cette liste générale de fautes, « calomnies » rend naturellement les paroles diffamatoires dirigées contre autrui. Le terme grec peut aussi désigner des blasphèmes contre Dieu; cette possibilité est conservée en note.
theological_decisions:
- issue: Portée de βλασφημίαι dans l’énumération
  choice: calomnies
  alternative: blasphèmes
  rationale: Le contexte n’indique pas explicitement que les paroles visent Dieu. Le texte principal retient donc le sens général de paroles diffamatoires, sans exclure le sens religieux possible, signalé en note afin de préserver l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. La structure en liste et les pluriels du grec sont conservés. La tournure « c’est du cœur que viennent » garde l’image de l’origine intérieure tout en restant idiomatique.
