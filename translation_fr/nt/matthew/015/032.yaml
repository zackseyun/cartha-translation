id: MAT.15.32
reference: Matthew 15:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ δὲ Ἰησοῦς προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ εἶπεν· Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον, ὅτι ἤδη ἡμέραι τρεῖς προσμένουσίν μοι καὶ οὐκ ἔχουσιν τί φάγωσιν· καὶ ἀπολῦσαι αὐτοὺς νήστεις οὐ θέλω, μήποτε ἐκλυθῶσιν ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/032.yaml
  text: Then Jesus called his disciples to him and said[a], “I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat. And I do not want to send them away hungry[d][c][b], lest they collapse on the way.”
translation:
  language: fr
  text: 'Alors Jésus appela ses disciples auprès de lui et leur dit : « J’ai compassion de la foule, car voilà déjà trois jours qu’ils restent avec moi et ils n’ont rien à manger. Je ne veux pas les renvoyer à jeun[a], de peur qu’ils ne défaillent en chemin[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à jeun » ou « sans nourriture ». Il ne s’agit pas nécessairement ici d’un jeûne religieux.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qu’ils ne s’évanouissent en chemin » ; le verbe peut évoquer l’épuisement ou la défaillance physique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: appela ses disciples auprès de lui
  rationale: Le participe moyen exprime l’appel des disciples vers Jésus lui-même ; « auprès de lui » conserve cette nuance directionnelle dans un français naturel.
- source_word: Σπλαγχνίζομαι ἐπὶ τὸν ὄχλον
  choice: J’ai compassion de cette foule
  rationale: Le verbe désigne une compassion profonde. Cette formulation est claire, digne et proche de la force du grec ; « cette foule » convient à la foule présente dont Jésus parle.
- source_word: ἤδη ἡμέραι τρεῖς προσμένουσίν μοι
  choice: voilà déjà trois jours qu’ils restent avec moi
  rationale: Cette tournure française exprime naturellement la durée déjà écoulée et la présence continue auprès de Jésus.
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: ils n’ont rien à manger
  rationale: Équivalent idiomatique direct de l’expression grecque indiquant l’absence de nourriture.
- source_word: ἀπολῦσαι αὐτοὺς
  choice: les renvoyer
  rationale: Dans le contexte d’une foule rassemblée, « renvoyer » rend naturellement l’idée de congédier les personnes présentes.
- source_word: νήστεις
  choice: sans qu’ils aient mangé
  rationale: Le terme signifie ici qu’ils sont privés de nourriture, non qu’ils pratiquent nécessairement un jeûne religieux. La formulation évite aussi de réduire le sens au seul sentiment de faim.
- source_word: μήποτε ἐκλυθῶσιν
  choice: de peur qu’ils ne défaillent
  rationale: « De peur que » rend le résultat redouté, et « défaillir » exprime l’épuisement physique ou l’évanouissement possible sans imposer l’idée plus forte d’un effondrement complet.
- source_word: ἐν τῇ ὁδῷ
  choice: en chemin
  rationale: Expression française idiomatique désignant le trajet qu’ils devront parcourir.
theological_decisions:
- issue: Sens de νήστεις
  choice: sans qu’ils aient mangé
  alternative: à jeun
  rationale: Le contexte concerne un manque de nourriture et non un jeûne cultuel. Le choix conserve le sens concret sans introduire une pratique religieuse absente du passage.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche du grec tout en étant fluide à l’oral comme à l’écrit. Les marqueurs de note [a] et [b] figurent dans le texte principal.
