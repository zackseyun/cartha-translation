  text: ⸀οὐ μὴ ⸀τιμήσει τὸν πατέρα ⸀αὐτοῦ· καὶ ἠκυρώσατε ⸂τὸν λόγον⸃ τοῦ θεοῦ διὰ τὴν παράδοσιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/006.yaml
  text: he certainly need not honor his father[b][a]. And you have nullified the word of God for the sake of your tradition.
translation:
  language: fr
  text: il n’est certainement pas tenu d’honorer son père[b]. Et vous avez annulé la parole de Dieu[a] à cause de votre tradition.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « le commandement de Dieu » au lieu de « la parole de Dieu ».
    reason: textual_variant
  - marker: b
    text: Ici, « honorer » comprend vraisemblablement le devoir concret de subvenir aux besoins de ses parents, et non pas seulement de leur témoigner du respect.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: n’est certainement pas tenu de
  rationale: La double négation est fortement emphatique. Dans le contexte, elle exprime la suppression d’une obligation plutôt qu’une simple prédiction; cette formulation française conserve ces deux éléments sans signifier « ne doit surtout pas ».
- source_word: τιμήσει
  choice: honorer
  rationale: Le verbe signifie couramment « honorer ». Le contexte implique une aide concrète aux parents, mais le terme général maintient le lien avec le commandement cité sans en réduire le sens au seul soutien matériel.
- source_word: πατέρα αὐτοῦ
  choice: son père
  rationale: Le texte grec donné emploie explicitement le singulier « son père »; la traduction ne l’élargit donc pas à « son père ou sa mère ».
- source_word: ἠκυρώσατε
  choice: avez annulé
  rationale: Le verbe désigne l’action d’invalider ou de priver d’effet. « Avez annulé » exprime clairement et fortement l’accusation en français moderne.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: La traduction suit la leçon λόγον imprimée dans le SBLGNT. La variante « le commandement de Dieu » est signalée en note.
- source_word: διὰ τὴν παράδοσιν ὑμῶν
  choice: à cause de votre tradition
  rationale: Avec l’accusatif, διά indique ici naturellement la cause ou le motif. Cette formulation montre que leur tradition est ce qui conduit à annuler la parole de Dieu.
theological_decisions:
- issue: Expliciter ou non le soutien matériel compris dans « honorer »
  choice: Conserver « honorer » dans le texte et expliquer sa portée pratique en note.
  alternative: Traduire par « soutenir » ou « prendre soin de ».
  rationale: Le différend concerne concrètement l’aide due aux parents, mais le grec emploie le verbe général τιμάω. « Honorer » préserve le lien verbal avec le commandement et évite de restreindre indûment son sens.
- issue: Harmoniser le verset avec son contexte ou avec des leçons parallèles
  choice: Traduire « son père » et « la parole de Dieu » conformément au texte grec fourni.
  alternative: Écrire « son père ou sa mère » et/ou « le commandement de Dieu ».
  rationale: La traduction suit directement la leçon du SBLGNT sans intégrer au texte principal une expansion contextuelle ou une variante manuscrite.
translation_notes:
  register: Français international moderne, clair et digne. « N’est certainement pas tenu de » restitue l’idée d’une obligation prétendument levée tout en conservant l’emphase de οὐ μή. Les marqueurs sont placés auprès des expressions qu’ils expliquent.
