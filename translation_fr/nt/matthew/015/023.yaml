reference: Matthew 15:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ οὐκ ἀπεκρίθη αὐτῇ λόγον. καὶ προσελθόντες οἱ μαθηταὶ αὐτοῦ ⸀ἠρώτουν αὐτὸν λέγοντες· Ἀπόλυσον αὐτήν, ὅτι κράζει ὄπισθεν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/023.yaml
  text: But he did not answer her a word[a]. And his disciples came and kept asking him, saying, “Send her away[b], because she is crying out behind us.”
translation:
  language: fr
  text: 'Mais il ne lui répondit pas un mot. Ses disciples s’approchèrent de lui et se mirent à lui demander : « Renvoie-la[a], car elle crie derrière nous[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Congédie-la ». Les paroles des disciples ne précisent pas s’ils veulent dire : « Accorde-lui ce qu’elle demande, puis renvoie-la », ou simplement : « Fais-la partir ».'
    reason: alternative_reading
  - marker: b
    text: Ou « après nous ». Le grec peut indiquer soit la position de la femme derrière eux, soit le fait qu’elle les suit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῇ λόγον
  choice: il ne lui répondit pas un mot
  rationale: 'Cette formulation française naturelle conserve l’expression grecque emphatique : Jésus ne lui adresse aucune réponse.'
- source_word: προσελθόντες
  choice: s’approchèrent
  rationale: Le participe indique que les disciples se dirigent vers Jésus; « s’approchèrent » exprime clairement ce mouvement dans le récit.
- source_word: ἠρώτουν
  choice: lui demandèrent avec insistance
  rationale: L’imparfait grec peut exprimer une demande prolongée ou répétée. « Avec insistance » en rend la valeur sans renforcer indûment le verbe jusqu’à « supplier ».
- source_word: Ἀπόλυσον αὐτήν
  choice: Renvoie-la
  rationale: Le verbe signifie ici faire partir ou congédier quelqu’un. « Renvoie-la » reste bref et ne précise pas si les disciples souhaitent que Jésus accède d’abord à sa demande.
- source_word: κράζει
  choice: elle crie
  rationale: Le présent et le sens de κράζω évoquent un appel poussé à haute voix; le présent français convient au discours direct et à l’action en cours.
- source_word: ὄπισθεν ἡμῶν
  choice: derrière nous
  rationale: La formulation rend directement le sens spatial, tout en laissant possible dans le contexte l’idée qu’elle les suit.
theological_decisions:
- issue: Intention des disciples dans Ἀπόλυσον αὐτήν
  choice: Traduire de manière ouverte par « Renvoie-la »
  alternative: « Accorde-lui ce qu’elle demande et renvoie-la » ou « Fais-la partir loin de nous »
  rationale: Le grec ne dit pas si les disciples veulent que Jésus exauce la femme avant son départ ou qu’il la congédie simplement. La traduction préserve cette tension narrative.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement du grec sans être raide; « avec insistance » rend l’aspect imperfectif de ἠρώτουν. Les deux ambiguïtés réelles du verset sont conservées et signalées.
