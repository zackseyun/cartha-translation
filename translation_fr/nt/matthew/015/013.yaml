id: MAT.15.13
reference: Matthew 15:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Πᾶσα φυτεία ἣν οὐκ ἐφύτευσεν ὁ πατήρ μου ὁ οὐράνιος ἐκριζωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/013.yaml
  text: But he answered and said[a], “Every plant that my heavenly Father did not plant will be uprooted.”
translation:
  language: fr
  text: 'Mais il répondit : « Toute plante que mon Père céleste n’a pas plantée sera déracinée.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tout ce que mon Père céleste n’a pas planté sera déraciné. »
    reason: Alternative lexicale permettant à φυτεία de désigner plus largement ce qui a été planté, plutôt qu’une plante individuelle.
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: il répondit
  rationale: En français actuel, « il répondit » rend naturellement la formule narrative grecque sans reproduire lourdement le doublet littéral « ayant répondu, il dit ».
- source_word: Πᾶσα
  choice: Toute
  rationale: Le singulier distributif est fidèlement rendu par « toute », en accord avec le nom singulier qui suit.
- source_word: φυτεία
  choice: plante
  rationale: Le nom peut désigner une plante ou ce qui a été planté. « Plante » est naturel et maintient clairement l’image de ce qui sera ensuite déraciné.
- source_word: ἐφύτευσεν
  choice: n’a pas plantée
  rationale: Le verbe agricole est conservé directement, avec l’accord du participe passé requis en français lorsque le complément d’objet direct précède.
- source_word: ὁ πατήρ μου ὁ οὐράνιος
  choice: mon Père céleste
  rationale: Cette formulation française, concise et idiomatique, préserve à la fois la relation exprimée par « mon » et la qualification céleste.
- source_word: ἐκριζωθήσεται
  choice: sera déracinée
  rationale: Le futur passif est conservé, et « déracinée » exprime précisément l’action d’arracher avec les racines tout en maintenant l’image agricole et judiciaire.
theological_decisions:
- issue: Référent métaphorique de « toute plante »
  choice: Conserver la métaphore sous la forme « Toute plante » sans préciser son référent.
  alternative: Toute doctrine, toute tradition, ou toute personne que le Père n’a pas plantée.
  rationale: Le grec ne détermine pas explicitement si l’image vise des enseignements, des traditions ou des personnes. La traduction préserve donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le doublet narratif grec est allégé conformément à l’usage français, tandis que la métaphore agricole, le futur passif et l’ambiguïté du référent sont conservés.
