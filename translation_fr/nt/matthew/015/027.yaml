id: MAT.15.27
reference: Matthew 15:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ δὲ εἶπεν· Ναί, κύριε, καὶ γὰρ τὰ κυνάρια ἐσθίει ἀπὸ τῶν ψιχίων τῶν πιπτόντων ἀπὸ τῆς τραπέζης τῶν κυρίων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/027.yaml
  text: She said[a], “Yes, Lord[b], for even the little dogs eat from the crumbs that fall from their masters’ table.”
translation:
  language: fr
  text: 'Elle répondit : « Oui, Seigneur[a], car même les petits chiens[b] mangent les miettes qui tombent de la table de leurs maîtres. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Seigneur » peut aussi être compris ici comme une formule respectueuse équivalant à « monsieur »; la traduction retient le rendu habituel de κύριος dans les Évangiles.
    reason: alternative_reading
  - marker: b
    text: Ou « chiens », « chiens domestiques » ou « chiots »; le grec emploie un diminutif qui évoque de petits chiens vivant dans la maison.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ναί
  choice: Oui
  rationale: Réponse affirmative directe et naturelle, qui marque l’accord de la femme avec l’image employée par Jésus.
- source_word: κύριε
  choice: Seigneur
  rationale: « Seigneur » est la traduction habituelle de κύριος lorsqu’il s’agit d’une adresse à Jésus; elle conserve à la fois la nuance de respect et la possible portée théologique du titre.
- source_word: καὶ γὰρ
  choice: car même
  rationale: « Car » exprime la justification apportée par la femme, tandis que « même » rend la nuance additive et intensive de καί.
- source_word: κυνάρια
  choice: petits chiens
  rationale: Le diminutif grec évoque de petits chiens, probablement domestiques. « Petits chiens » conserve cette nuance sans transformer le terme en « chiots ».
- source_word: ἐσθίει
  choice: mangent
  rationale: Le verbe a son sens courant. Bien qu’il soit au singulier en grec avec un sujet neutre pluriel, l’accord au pluriel est requis en français.
- source_word: ψιχίων
  choice: miettes
  rationale: « Miettes » rend précisément les petits morceaux de nourriture tombant de la table.
- source_word: τῶν πιπτόντων
  choice: qui tombent
  rationale: La proposition relative restitue naturellement en français le participe présent grec et sa valeur générale.
- source_word: τραπέζης
  choice: table
  rationale: Sens ordinaire du mot grec, essentiel à l’image domestique.
- source_word: τῶν κυρίων αὐτῶν
  choice: de leurs maîtres
  rationale: Dans la métaphore, κύριοι désigne les personnes auxquelles appartiennent les chiens. « Maîtres » est idiomatique en français et conserve le rapport d’autorité.
theological_decisions:
- issue: Traduction de κύριε dans l’adresse à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: Le contexte permet d’entendre une adresse respectueuse, mais « Seigneur » préserve aussi la reconnaissance possible de l’autorité de Jésus, sans imposer une interprétation plus précise.
- issue: Valeur diminutive de κυνάρια
  choice: petits chiens
  alternative: chiens; chiens domestiques; chiots
  rationale: Le choix maintient la force diminutive du grec et n’accentue pas inutilement la dureté de la métaphore, sans toutefois l’effacer.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du raisonnement grec tout en évitant une tournure artificielle. Le vocabulaire domestique (« petits chiens », « miettes », « table », « maîtres ») conserve la cohérence de l’image.
