id: MAT.15.11
reference: Matthew 15:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ τὸ εἰσερχόμενον εἰς τὸ στόμα κοινοῖ τὸν ἄνθρωπον, ἀλλὰ τὸ ἐκπορευόμενον ἐκ τοῦ στόματος τοῦτο κοινοῖ τὸν ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/011.yaml
  text: It is not what enters into the mouth that defiles the man[b][a], but what comes out of the mouth—this defiles the man.
translation:
  language: fr
  text: 'Ce n’est pas ce qui entre dans la bouche qui rend l’être humain impur[a], mais ce qui sort de la bouche : voilà ce qui rend l’être humain impur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui souille l’être humain ». Le verbe grec désigne ici le fait de rendre quelqu’un impur, notamment au regard des règles de pureté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κοινοῖ
  choice: rend … impur
  rationale: Dans ce contexte de pureté, κοινόω signifie rendre impur ou profaner. « Rend impur » est naturel en français et conserve la portée cultuelle et morale du terme sans évoquer seulement la saleté physique.
- source_word: τὸ εἰσερχόμενον εἰς τὸ στόμα
  choice: ce qui entre dans la bouche
  rationale: Le participe substantivé est rendu idiomatiquement par « ce qui entre », tandis que « dans la bouche » préserve l’image concrète et la direction exprimée par εἰς.
- source_word: τὸ ἐκπορευόμενον ἐκ τοῦ στόματος
  choice: ce qui sort de la bouche
  rationale: Cette formulation française courante restitue le participe substantivé et le mouvement hors de la bouche exprimé par ἐκπορευόμενον et ἐκ.
- source_word: ἄνθρωπον
  choice: l’être humain
  rationale: ἄνθρωπος désigne ici, au singulier représentatif, toute personne humaine. « L’être humain » conserve le singulier générique et la portée universelle sans introduire en français moderne une restriction masculine absente du sens contextuel.
- source_word: τοῦτο
  choice: voilà ce qui
  rationale: 'Cette formulation rend explicitement l’insistance du démonstratif : c’est bien ce qui sort de la bouche, et non ce qui y entre, qui rend impur.'
- source_word: οὐ ... ἀλλὰ
  choice: Ce n’est pas … mais …
  rationale: Cette structure française naturelle reproduit clairement l’opposition marquée en grec.
theological_decisions:
- issue: Portée de la notion d’impureté dans κοινόω
  choice: « rend impur » afin de conserver la résonance de pureté cultuelle tout en permettant la portée morale du propos
  alternative: « souille » ou « profane »
  rationale: Le contexte concerne la pureté, mais la déclaration de Jésus ne doit être réduite ni à l’hygiène ni à une catégorie exclusivement rituelle. « Rend impur » maintient cette tension.
- issue: Valeur générique de ἄνθρωπον
  choice: « l’être humain » au singulier générique
  alternative: « l’homme » ou « la personne »
  rationale: Le nom grec ἄνθρωπος vise ici un humain en général. « L’être humain » exprime naturellement cette portée représentative en français international moderne, tout en gardant le singulier du texte source.
translation_notes:
  register: Français moderne, international et digne. La répétition de « rend l’être humain impur » préserve le parallélisme grec; les deux-points et « voilà ce qui » rendent l’emphase de τοῦτο sans alourdir la phrase.
