source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῷ οἱ ⸀μαθηταί· Πόθεν ἡμῖν ἐν ἐρημίᾳ ἄρτοι τοσοῦτοι ὥστε χορτάσαι ὄχλον τοσοῦτον;
base_translation:
  language: en
  yaml_path: translation/nt/matthew/015/033.yaml
  text: And the disciples said to him[c][b][a], “Where could we get enough bread in this desolate place to satisfy so large a crowd?”
translation:
  language: fr
  text: 'Les disciples lui dirent : « Où trouverions-nous, dans cet endroit désert[a], assez de pains[b] pour rassasier[c] une foule aussi nombreuse ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le désert » ou « dans un lieu inhabité ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tant de pains ».
    reason: lexical_alternative
  - marker: c
    text: Ou « nourrir pleinement »; le verbe grec évoque le fait de donner à manger jusqu’à satiété.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγουσιν
  choice: dirent
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit écrit en français, sans changer la fonction narrative.
- source_word: οἱ μαθηταί
  choice: les disciples
  rationale: L’article désigne le groupe déjà connu dans le contexte; le possessif « ses » n’est pas explicite dans le grec.
- source_word: Πόθεν ἡμῖν
  choice: Où trouverions-nous
  rationale: Cette formulation française exprime naturellement la question portant sur la provenance et intègre le datif ἡμῖν dans le sujet « nous ».
- source_word: ἐν ἐρημίᾳ
  choice: dans cet endroit désert
  rationale: ἐρημία désigne ici une région isolée ou inhabitée. « Cet » explicite naturellement la situation immédiate sans imposer l’image d’un désert aride.
- source_word: ἄρτοι τοσοῦτοι
  choice: assez de pains
  rationale: Le pluriel ἄρτοι désigne concrètement des pains; « assez » restitue dans la question la quantité requise exprimée par τοσοῦτοι.
- source_word: ὥστε χορτάσαι
  choice: pour rassasier
  rationale: La construction indique le résultat ou le but envisagé; « rassasier » conserve l’idée de nourrir jusqu’à satiété.
- source_word: ὄχλον τοσοῦτον
  choice: une foule aussi nombreuse
  rationale: Cette expression rend de manière idiomatique l’ampleur soulignée par τοσοῦτον.
theological_decisions: []
