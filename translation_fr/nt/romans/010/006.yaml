language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: fr
  text: 'Mais la justice qui vient de la foi[a] parle ainsi : « Ne dis pas dans ton cœur : “Qui montera au ciel ?” »[c] (c’est-à-dire faire descendre le Messie[b]).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « la droiture qui vient de la foi ». Le mot grec δικαιοσύνη peut, selon le contexte, évoquer la justice ou la droiture.'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « Christ » ; « Messie » est employé ici parce que Χριστός fonctionne comme un titre.
    reason: lexical_alternative
  - marker: c
    text: Paul reprend Deutéronome 30.12 et l’applique au Messie.
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Justice » est l’équivalent français naturel qui peut désigner ici la qualité ou le statut conforme à ce qui est juste. La note signale une autre formulation possible afin de ne pas réduire la richesse du terme paulinien.
- source_word: ἐκ πίστεως
  choice: qui vient de la foi
  rationale: Cette formulation rend la valeur d’origine ou de source de ἐκ tout en restant naturelle en français et en préservant le contraste avec la justice fondée sur la Loi au verset précédent.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est le rendu direct et usuel de πίστις dans ce contexte, où il ne s’agit pas de la construction controversée πίστις Χριστοῦ.
- source_word: οὕτως λέγει
  choice: parle ainsi
  rationale: Ce rendu conserve le présent, la manière indiquée par οὕτως et surtout la personnification de la justice.
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: Ne dis pas dans ton cœur
  rationale: Traduction proche de la formulation deutéronomique, où le cœur représente le lieu de la pensée et de l’intention.
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: Qui montera au ciel ?
  rationale: « Monter au ciel » est idiomatique en français et reproduit clairement le mouvement exprimé par ἀναβαίνω et εἰς.
- source_word: Χριστόν
  choice: le Messie
  rationale: Dans cette explication scripturaire, Χριστός fonctionne comme un titre. « Le Messie » en exprime le sens plutôt que de le traiter comme un simple nom propre.
- source_word: καταγαγεῖν
  choice: faire descendre
  rationale: L’infinitif français rend naturellement l’idée causative de « faire venir d’en haut vers le bas » et conserve la formulation elliptique de Paul.
theological_decisions:
- issue: Personnification de la justice qui vient de la foi
  choice: Conserver « la justice qui vient de la foi … parle »
  alternative: Employer une tournure moins personnifiée, comme « voici ce que dit la justice qui vient de la foi »
  rationale: δικαιοσύνη est explicitement le sujet grammatical de λέγει. La personnification appartient à l’argument et au style rhétorique de Paul.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme est employé comme un titre dans l’interprétation messianique d’un passage de l’Écriture. « Messie » en rend ici la valeur titulaire, tandis que la note indique la forme grecque traditionnelle.
- issue: Portée explicative de τοῦτ’ ἔστιν
  choice: Conserver l’explication entre parenthèses sans en préciser davantage la logique
  alternative: 'Développer : « ce serait vouloir faire descendre le Messie »'
  rationale: Le grec donne une glose infinitive concise. La traduction préserve cette tension et évite d’ajouter une intention ou un jugement qui ne sont pas exprimés explicitement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la personnification paulinienne et l’écho scripturaire, tandis que « parle ainsi », « dans ton cœur » et « montera au ciel » maintiennent un registre biblique naturel sans archaïsme.
