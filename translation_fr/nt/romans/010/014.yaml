id: ROM.10.14
reference: Romans 10:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: fr
  text: Comment donc invoqueront-ils celui en qui ils n’ont pas cru ? Et comment croiront-ils en celui dont ils n’ont pas entendu parler[a] ? Et comment entendront-ils sans quelqu’un qui proclame ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qu’ils n’ont pas entendu ».
    reason: Préserve la possibilité que le génitif avec ἀκούω renvoie à l’audition directe de la personne plutôt qu’à un message à son sujet.
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Comment donc
  rationale: Conserve la force déductive de οὖν et l’enchaînement des questions rhétoriques dans un français naturel.
- source_word: ἐπικαλέσωνται
  choice: invoqueront-ils
  rationale: « Invoquer » exprime l’appel adressé au Seigneur et maintient le lien avec la citation du contexte immédiat, sans réduire le verbe à une simple demande d’aide.
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: celui en qui ils n’ont pas cru
  rationale: Rend explicitement l’objet personnel de la foi et conserve l’antériorité logique du fait de croire par rapport au fait d’invoquer.
- source_word: πιστεύσωσιν
  choice: croiront-ils
  rationale: « Croire » est ici l’équivalent français direct et courant de πιστεύω; le futur convient à la valeur prospective des subjonctifs dans cette série de questions.
- source_word: οὗ οὐκ ἤκουσαν
  choice: dont ils n’ont pas entendu parler
  rationale: Cette formulation française exprime naturellement le sens probable d’avoir entendu parler de quelqu’un; une note conserve l’autre lecture possible, selon laquelle ils ne l’ont pas lui-même entendu.
- source_word: ἀκούσωσιν
  choice: entendront-ils
  rationale: « Entendre » préserve la répétition lexicale et le raisonnement de Paul fondé sur l’écoute de la proclamation.
- source_word: χωρὶς κηρύσσοντος
  choice: si personne ne proclame le message
  rationale: La tournure française garde l’accent du participe sur l’action accomplie par quelqu’un plutôt que sur une fonction officielle. « Le message » explicite seulement l’objet implicite de κηρύσσω dans ce contexte.
theological_decisions:
- issue: Vocabulaire de πιστεύω
  choice: croire / avoir cru
  alternative: mettre sa confiance en / faire confiance à
  rationale: « Croire » maintient le vocabulaire paulinien de la foi sans substituer une interprétation particulière du type de confiance en vue.
- issue: Objet de l’écoute dans οὗ οὐκ ἤκουσαν
  choice: entendre parler de lui
  alternative: l’entendre lui-même
  rationale: Le génitif avec ἀκούω permet de comprendre soit l’écoute d’un message concernant le Christ, soit l’écoute du Christ comme celui qui parle. Le texte principal retient la formulation française la plus naturelle dans le contexte de la proclamation, tandis que la note préserve l’autre possibilité.
- issue: Participe κηρύσσοντος
  choice: quelqu’un qui proclame le message
  alternative: un prédicateur
  rationale: La traduction retenue évite d’introduire nécessairement une charge ecclésiale déterminée là où le grec désigne avant tout une personne en train de proclamer.
translation_notes:
  register: Français international moderne, digne et accessible. La triple structure interrogative et la répétition de « comment » sont conservées. « Invoquer » maintient le registre biblique sans archaïsme marqué; « proclamer le message » reste compréhensible tout en évitant de transformer le participe grec en titre de fonction.
