id: ROM.10.2
reference: Romans 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν· ἀλλ’ οὐ κατ’ ἐπίγνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: fr
  text: En effet, je témoigne à leur sujet qu’ils ont du zèle pour Dieu[a], mais pas selon la connaissance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du zèle de Dieu »; le génitif grec peut se traduire plus littéralement ainsi, mais il désigne probablement ici un zèle dirigé vers Dieu.
    reason: lexical_alternative
  - marker: b
    text: Ou « mais non selon la connaissance », « mais sans pleine connaissance » ou « mais sans se fonder sur la connaissance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: je témoigne
  rationale: Le présent de l’indicatif garde la force directe du témoignage de Paul; «je témoigne» est clair et digne en français moderne.
- source_word: γὰρ
  choice: En effet
  rationale: Cette expression marque naturellement le lien explicatif avec le verset précédent.
- source_word: αὐτοῖς
  choice: à leur sujet
  rationale: Dans cette construction, le datif désigne les personnes au sujet desquelles Paul témoigne, et non les destinataires de son témoignage.
- source_word: ζῆλον θεοῦ
  choice: du zèle pour Dieu
  rationale: 'Le génitif est probablement objectif: leur zèle est dirigé vers Dieu. Cette formulation évite de suggérer qu’il s’agit du zèle propre de Dieu, tout en signalant l’ambiguïté dans une note.'
- source_word: ἔχουσιν
  choice: ils ont
  rationale: Rendu direct et naturel du présent grec.
- source_word: ἀλλ’ οὐ κατ’ ἐπίγνωσιν
  choice: mais que ce zèle ne repose pas sur une juste connaissance
  rationale: La reprise de «ce zèle» rend explicite en français le contraste elliptique du grec. «Ne repose pas sur» traduit κατά dans son sens normatif ou fondatif, tandis que «juste connaissance» exprime ici une connaissance adéquate sans imposer l’idée plus forte de connaissance exhaustive.
theological_decisions:
- issue: Nature du zèle d’Israël
  choice: Un zèle dirigé vers Dieu, mais qui ne repose pas sur une connaissance adéquate
  alternative: Le zèle propre de Dieu; ou un zèle religieux dont l’objet n’est pas précisé
  rationale: 'Le contexte favorise un génitif objectif: Paul reconnaît la ferveur de ses compatriotes envers Dieu tout en contestant qu’elle soit guidée par une connaissance juste. La traduction maintient ainsi la tension entre sincérité et erreur.'
- issue: Portée de ἐπίγνωσις
  choice: juste connaissance
  alternative: pleine connaissance; connaissance véritable; simplement connaissance
  rationale: «Juste connaissance» indique une connaissance adéquate au contexte sans affirmer qu’ἐπίγνωσις signifie nécessairement une connaissance complète, ni définir d’avance toute la nature théologique de leur défaut.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le ton argumentatif de Paul. «En effet» est plus naturel que «car» en ouverture isolée, et la seconde occurrence de «ce zèle» clarifie l’ellipse grecque sans en modifier le sens.
