  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: fr
  text: 'Mais je demande : Israël n’a-t-il pas compris[a] ? Moïse dit le premier : « Je vous rendrai jaloux par ce qui n’est pas une nation[b] ; par une nation dépourvue de discernement, je provoquerai votre colère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Israël n’a-t-il pas su ? » Le verbe grec peut signifier « savoir », « connaître » ou « comprendre » ; ici, il peut désigner le fait de saisir la portée de ce qui a été entendu.
    reason: lexical_alternative
  - marker: b
    text: Citation de Deutéronome 32.21. « Ce qui n’est pas une nation » peut désigner un peuple tenu pour n’être pas une véritable nation ; cette expression est souvent comprise comme visant les non-Juifs.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: Israël n’a-t-il pas compris ?
  rationale: Dans le contexte de l’écoute et de la réponse au message, γινώσκω peut exprimer le fait d’en saisir le sens. La question rhétorique et sa tension sont conservées.
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: Moïse est le premier à dire
  rationale: Cette formulation française naturelle conserve la valeur de πρῶτος, qui présente Moïse comme le premier témoin scripturaire cité dans la série.
- source_word: παραζηλώσω
  choice: Je vous rendrai jaloux
  rationale: 'Rend naturellement le sens causatif du verbe : susciter la jalousie.'
- source_word: ἐπ’ οὐκ ἔθνει
  choice: par ce qui n’est pas une nation
  rationale: Conserve la formulation paradoxale et le singulier de la citation de Deutéronome 32.21 sans expliciter son référent dans le corps du texte.
- source_word: ἐπ’ ἔθνει ἀσυνέτῳ
  choice: par une nation sans intelligence
  rationale: Reproduit l’idée d’un manque d’intelligence ou de discernement tout en restant clair et digne en français moderne.
- source_word: παροργιῶ ὑμᾶς
  choice: je provoquerai votre colère
  rationale: Exprime la valeur causative du verbe et maintient le parallélisme avec « je vous rendrai jaloux ».
theological_decisions:
- issue: Référent de « ce qui n’est pas une nation » et de « nation sans intelligence »
  choice: Conserver les termes de la citation sans identifier explicitement le référent dans le texte principal.
  alternative: Traduire ou gloser par « les non-Juifs » ou « un peuple qu’Israël ne considère pas comme une véritable nation ».
  rationale: Paul cite Deutéronome 32.21. La formulation scripturaire garde sa force rhétorique et son ouverture interprétative sans introduire une identification confessionnelle dans la traduction.
- issue: Sens de ἔγνω
  choice: compris
  alternative: connu / su
  rationale: Le contexte porte sur le fait d’entendre le message et d’en saisir la portée. « Compris » exprime bien cette nuance, tandis qu’une note signale l’autre sens lexical possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe rhétorique est conservée ; la citation garde son parallélisme ainsi que ses formulations volontairement paradoxales.
