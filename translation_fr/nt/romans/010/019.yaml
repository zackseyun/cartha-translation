  to: 'Mais je demande : Israël n’a-t-il pas compris[a] ? Moïse dit le premier : « Je vous rendrai jaloux par ce qui n’est pas une nation[b] ; par une nation dépourvue de discernement, je provoquerai votre colère. »'
