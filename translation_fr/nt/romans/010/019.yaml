  naturalness: « Moïse est le premier à dire » est compréhensible, mais « Moïse dit le premier » est plus direct et idiomatique dans une citation argumentative. « Une nation sans intelligence » peut évoquer, en français actuel, une absence d’intelligence au sens technologique plutôt qu’un manque de discernement ; « une nation dépourvue de discernement » est plus naturel sans affaiblir le sens.
