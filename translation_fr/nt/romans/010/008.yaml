  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: fr
  text: Mais que dit-elle ? « La parole est près de toi, dans ta bouche et dans ton cœur » — c’est-à-dire la parole de la foi que nous proclamons.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul reprend ici les mots de Deutéronome 30.14 et les applique à la parole de la foi que nous proclamons. « Parole de la foi » peut aussi se comprendre comme « message de la foi » ou « message qui appelle à la foi » ; le mot grec traduit par « foi » peut, selon le contexte, exprimer aussi la confiance ou la fidélité.
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque naturellement en français le contraste avec le développement précédent.
- source_word: τί λέγει
  choice: que dit-elle ?
  rationale: Le pronom féminin renvoie implicitement à l’Écriture ou à la justice fondée sur la foi évoquée au verset précédent, sans expliciter le référent que le grec laisse sous-entendu.
- source_word: Ἐγγύς σου
  choice: est près de toi
  rationale: Rend directement la proximité exprimée dans la citation de Deutéronome 30.14.
- source_word: τὸ ῥῆμα
  choice: la parole
  rationale: Préserve la répétition de ῥῆμα et la formulation de la citation, tout en permettant à l’explication de Paul d’en préciser le sens de message proclamé.
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: dans ta bouche et dans ton cœur
  rationale: Conserve les images corporelle et intérieure de la source et de la citation scripturaire.
- source_word: τοῦτ’ ἔστιν
  choice: c’est-à-dire
  rationale: Introduit clairement l’explication que Paul donne de la citation.
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: la parole de la foi
  rationale: Maintient le lien lexical avec le premier emploi de ῥῆμα et conserve la formulation compacte du génitif sans décider s’il indique principalement le contenu, le caractère ou l’appel à la foi.
- source_word: ὃ κηρύσσομεν
  choice: que nous proclamons
  rationale: Exprime l’annonce publique portée par κηρύσσω dans un français actuel et digne.
theological_decisions:
- issue: Sens de πίστις dans τὸ ῥῆμα τῆς πίστεως
  choice: foi
  alternative: confiance ; fidélité
  rationale: « Foi » correspond à l’usage paulinien le plus probable ici et laisse ouverte la relation exacte entre la parole proclamée et la foi, sans imposer un système doctrinal plus étroit.
- issue: Référent implicite de λέγει
  choice: pronom « elle » sans antécédent ajouté dans le verset
  alternative: « que dit l’Écriture ? » ou « que dit la justice fondée sur la foi ? »
  rationale: Le grec n’exprime pas le sujet. Le contexte immédiat peut orienter vers la justice fondée sur la foi, tandis que la formule introduit aussi une citation scripturaire ; le texte français préserve cette légère ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme de la citation ainsi que la répétition de « parole ». Le tiret distingue la citation de l’explication paulinienne. Le marqueur [a] est placé après l’ensemble de la proposition concernée.
