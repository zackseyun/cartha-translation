id: ROM.10.13
reference: Romans 10:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: fr
  text: En effet, toute personne qui fera appel au nom du Seigneur sera sauvée[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul cite Joël 3.5 (2.32 dans certaines numérotations). Dans Joël, « le Seigneur » désigne YHWH; ici, dans le contexte, Paul applique ce texte à Jésus.
    reason: cross_reference
  - marker: b
    text: Ou « invoquera le nom du Seigneur ». L’expression grecque signifie invoquer le Seigneur par son nom ou faire appel à lui.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς … ὃς ἂν
  choice: toute personne qui
  rationale: Cette tournure exprime naturellement en français la portée universelle et indéfinie de la construction grecque, sans restriction de genre.
- source_word: γὰρ
  choice: En effet
  rationale: γάρ introduit ici l’appui scripturaire de l’affirmation précédente. « En effet » rend clairement ce lien explicatif en français moderne.
- source_word: ἐπικαλέσηται
  choice: fera appel à
  rationale: Avec « le nom », le verbe signifie invoquer le Seigneur, s’adresser à lui ou recourir à lui. « Faire appel à » est naturel et conserve l’idée d’invocation et de recours.
- source_word: τὸ ὄνομα
  choice: le nom
  rationale: La traduction littérale préserve l’expression biblique qui renvoie à l’identité révélée et à l’autorité de celui qui est invoqué.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Le grec porte κύριος. « Seigneur » respecte le texte sans expliciter dans le corps du verset le référent christologique indiqué par le contexte.
- source_word: σωθήσεται
  choice: sera sauvée
  rationale: Le futur passif exprime ici le salut au sens paulinien; « sera sauvée » en est la formulation française la plus claire.
theological_decisions:
- issue: Référent du « Seigneur » dans la citation de Joël employée par Paul
  choice: Conserver « Seigneur » dans le texte principal, tout en signalant en note que Paul applique dans ce contexte le passage à Jésus.
  alternative: « l’Éternel » ou « le Seigneur Jésus »
  rationale: Le texte grec dit κυρίου. Dans Joël, le référent est YHWH, tandis que le contexte de Romains 10 oriente l’application vers Jésus. La traduction maintient le libellé grec et laisse la note exposer la portée intertextuelle sans résoudre silencieusement la tension.
translation_notes:
  register: Français international moderne, courant et digne. « Toute personne qui » évite un masculin potentiellement restrictif; le futur « fera appel… sera sauvée » suit la forme de la citation. Les deux marqueurs de note figurent dans le texte principal.
