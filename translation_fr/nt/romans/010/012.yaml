source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: fr
  text: En effet, il n’y a aucune distinction entre Juif et Grec[a], car le même Seigneur est Seigneur de tous[b] et il est généreux envers tous ceux qui font appel à lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit « Grec » ; ici, l’association « Juif et Grec » fonctionne comme un contraste entre Juifs et non-Juifs. On peut aussi traduire « non-Juif ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « le même Seigneur est au-dessus de tous ».'
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: distinction
  rationale: « Distinction » rend directement la différenciation entre les deux groupes sans introduire l’idée d’une différence de valeur.
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: Juif ... Grec
  rationale: Le texte grec nomme explicitement le Juif et le Grec. Dans ce contexte, cette paire représente le contraste entre Juifs et non-Juifs, précision conservée en note plutôt que substituée au texte.
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: tous ont le même Seigneur
  rationale: Cette formulation française naturelle conserve l’identité du Seigneur pour tous et la portée de πάντων. Une autre analyse possible, « le même Seigneur règne sur tous », est signalée en note.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » préserve la portée christologique du titre dans Romains 10 et son écho scripturaire, sans expliciter davantage le référent dans la traduction.
- source_word: πλουτῶν εἰς πάντας
  choice: qui répand ses richesses sur tous
  rationale: Cette expression idiomatique conserve la métaphore de la richesse ainsi que son déploiement généreux en direction des bénéficiaires.
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: ceux qui font appel à lui
  rationale: « Faire appel à » exprime clairement l’invocation adressée au Seigneur et convient au registre courant et digne recherché.
theological_decisions:
- issue: Référent de « Seigneur »
  choice: Conserver le seul titre « Seigneur », dont le contexte immédiat oriente le référent vers Jésus.
  alternative: Comprendre le terme comme une référence générale à Dieu sans identification christologique explicite.
  rationale: Romains 10.9-13 relie la confession de Jésus comme Seigneur à l’invocation scripturaire du Seigneur. La traduction ne rajoute pas « Jésus » et laisse le contexte porter cette tension christologique.
- issue: Portée de « tous »
  choice: Faire porter l’universalité sur tous ceux qui font appel au Seigneur.
  alternative: Lire « tous » comme une affirmation universelle sans qualification.
  rationale: Le participe substantivé τοὺς ἐπικαλουμένους αὐτόν qualifie explicitement les bénéficiaires. La traduction maintient à la fois l’absence de distinction entre groupes et cette qualification.
- issue: Relation exprimée par πάντων
  choice: « Tous ont le même Seigneur », relation d’appartenance ou de seigneurie commune.
  alternative: « Le même Seigneur règne sur tous », relation de souveraineté.
  rationale: Le génitif πάντων permet une formulation avec « de tous » ou l’idée de domination sur tous. Le texte principal privilégie le français idiomatique, tandis que la note conserve l’autre lecture.
translation_notes:
  register: Français international moderne, clair et digne. La répétition peu naturelle de « Seigneur » a été évitée grâce à « tous ont le même Seigneur ». « Répand ses richesses » rend le participe πλουτῶν de manière idiomatique tout en conservant sa métaphore.
