  to: En effet, il n’y a aucune distinction entre Juif et Grec[a], car le même Seigneur est Seigneur de tous[b] et il est généreux envers tous ceux qui font appel à lui.
  rationale: La révision rétablit la construction « le même Seigneur est Seigneur de tous », plus proche du grec et théologiquement non interprétative. Elle remplace l’alternative « règne sur tous », qui ajoutait une notion absente de la formulation, et clarifie la note lexicale sur « Grec ».
