  terminology: « Seigneur » convient pour κύριος. « Juif » et « Grec » doivent être conservés dans le texte; la fonction contextuelle de contraste avec les non-Juifs relève utilement de la note. « Faire appel à lui » est une formulation naturelle pour l’invocation, sans expliciter indûment son contenu.
