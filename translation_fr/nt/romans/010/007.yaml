id: ROM.10.7
reference: Romans 10:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἤ· Τίς καταβήσεται εἰς τὴν ἄβυσσον; τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: fr
  text: 'ou : « Qui descendra dans l’abîme[a] ? » (c’est-à-dire : faire remonter le Messie[b] d’entre les morts).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « les profondeurs ». Paul fait écho à Deutéronome 30.13, mais emploie ici « l’abîme » et applique cette image au fait de faire remonter le Messie d’entre les morts.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « Christ ». Le terme est rendu ici par « Messie » parce que Χριστός fonctionne comme un titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: ou
  rationale: Introduit simplement le second volet de l’alternative rhétorique et respecte le caractère continu du verset.
- source_word: καταβήσεται
  choice: descendra
  rationale: Le futur de « descendre » conserve le mouvement spatial et le registre soutenu du grec.
- source_word: εἰς τὴν ἄβυσσον
  choice: dans l’abîme
  rationale: « Abîme » correspond précisément à ἄβυσσος et préserve l’image ainsi que son ambiguïté, sans la réduire au tombeau ou au séjour des morts.
- source_word: τοῦτ’ ἔστιν
  choice: c’est-à-dire
  rationale: Formule explicative française naturelle et proche de la tournure grecque.
- source_word: Χριστόν
  choice: le Messie
  rationale: Χριστός a ici valeur de titre; « le Messie » en exprime le sens plutôt que de le traiter comme un simple nom propre.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette formulation française rend clairement l’idée d’une remontée hors du groupe ou du domaine des morts.
- source_word: ἀναγαγεῖν
  choice: faire remonter
  rationale: Conserve l’image spatiale qui répond à « descendra », sans remplacer le verbe par une formulation explicitement résurrectionnelle.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette explication théologique, le mot grec fonctionne comme un titre. « Messie » en garde le contenu sémantique.
- issue: Sens de ἄβυσσος dans l’explication de Paul
  choice: Conserver « l’abîme » sans l’expliciter davantage dans le texte principal.
  alternative: les profondeurs; le séjour des morts; l’Hadès
  rationale: Paul adapte l’écho de Deutéronome 30 et l’applique à la remontée du Messie d’entre les morts. « Abîme » préserve l’image et la tension interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme spatial entre « descendre » et « faire remonter », ainsi que la structure explicative parenthétique de Paul.
