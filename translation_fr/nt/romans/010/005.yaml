id: ROM.10.5
reference: Romans 10:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: fr
  text: 'En effet, Moïse écrit au sujet de la justice[a] qui vient de la Loi : « L’homme[b] qui la pratique vivra en elle[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « justice » peut désigner le fait ou la condition d’être juste.
    reason: lexical_clarification
  - marker: b
    text: 'Le grec emploie un masculin singulier à valeur représentative : il s’agit de toute personne qui agit ainsi.'
    reason: cultural_note
  - marker: c
    text: 'Ou : « vivra par elle ». Paul fait écho à Lévitique 18.5, où la vie est liée à la mise en pratique des prescriptions.'
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Introduit l’explication qui appuie l’argument précédent; « en effet » exprime naturellement ce lien en français.
- source_word: γράφει
  choice: écrit
  rationale: Conserve le présent de la formule de citation scripturaire.
- source_word: δικαιοσύνην
  choice: justice
  rationale: « Justice » est l’équivalent français usuel de δικαιοσύνη et maintient le lien terminologique avec le contraste paulinien entre la justice venant de la Loi et celle qui relève de la foi.
- source_word: τὴν ἐκ τοῦ νόμου
  choice: qui vient de la Loi
  rationale: Rend la valeur de source de ἐκ et préserve le contraste entre deux manières dont la justice est caractérisée.
- source_word: νόμου
  choice: la Loi
  rationale: L’article et le contexte renvoient à la Loi mosaïque comme réalité connue; la majuscule clarifie ce référent en français.
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: L’homme qui la met en pratique
  rationale: Le participe aoriste décrit ici celui qui accomplit la justice liée à la Loi. « Met en pratique » est idiomatique et évite de faire du participe un acte ponctuel passé, tandis que « l’homme » conserve la forme représentative masculine du grec.
- source_word: ζήσεται
  choice: vivra
  rationale: Rend directement le futur et maintient la formulation solennelle de la citation de Lévitique 18.5.
- source_word: ἐν αὐτῇ
  choice: par elle
  rationale: Respecte le pronom féminin singulier du texte grec, dont l’antécédent grammatical est « justice », tout en donnant à ἐν une valeur instrumentale possible. La note conserve la lecture plus littérale « en elle » et signale l’écho au Lévitique.
theological_decisions:
- issue: Sens de δικαιοσύνη dans le contraste paulinien
  choice: justice
  alternative: condition juste; manière d’être juste
  rationale: Le français « justice » garde l’ampleur juridique, relationnelle et morale du terme sans imposer une seule analyse théologique.
- issue: Référent et valeur de ἐν αὐτῇ
  choice: vivra par elle
  alternative: vivra en elle; dans l’écho de Lévitique 18.5, vivra par ces commandements
  rationale: Le texte grec de Romains emploie un pronom féminin singulier, vraisemblablement rattaché à « justice ». La traduction principale en conserve le nombre, tandis que la note expose l’expression plus formelle et l’arrière-plan vétérotestamentaire sans les confondre.
- issue: Portée représentative de ἄνθρωπος
  choice: L’homme
  alternative: la personne; l’être humain
  rationale: Le grec présente un masculin singulier représentatif. Le texte principal en garde la forme, et une note précise que l’énoncé concerne toute personne.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure argumentative et le présent de citation, tout en rendant idiomatiquement le participe par « met en pratique ». Les majuscules à « Loi » signalent la Loi mosaïque.
