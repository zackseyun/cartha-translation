id: ROM.10.3
reference: Romans 10:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: fr
  text: En effet, ne connaissant pas la justice de Dieu[a] et cherchant à établir leur propre justice, ils ne se sont pas soumis à la justice de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « justice » peut désigner la rectitude de Dieu, la juste condition qu’il accorde ou son action par laquelle il rend juste. « La justice de Dieu » peut aussi se comprendre comme la justice propre à Dieu ou celle qui vient de lui. Cela vaut pour les deux occurrences de l’expression dans ce verset.
    reason: ambiguïté lexicale et grammaticale
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: ne connaissant pas
  rationale: Cette tournure rend naturellement le participe présent et exprime un défaut de connaissance ou de reconnaissance sans affirmer explicitement une ignorance innocente ni un rejet délibéré.
- source_word: γὰρ
  choice: En effet
  rationale: Le connecteur introduit l’explication de l’affirmation précédente; « En effet » est naturel en français tout en maintenant ce lien argumentatif.
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: justice
  rationale: Dans ce contexte paulinien, δικαιοσύνη peut englober la rectitude de Dieu, le statut juste qu’il accorde et son action par laquelle il rend juste. « Justice » est le terme français biblique et théologique le plus apte à conserver cette amplitude.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif grec permet notamment les nuances de justice propre à Dieu et de justice venant de Dieu. La construction française « de Dieu » préserve cette ambiguïté.
- source_word: ἰδίαν
  choice: leur propre justice
  rationale: L’adjectif grec est elliptique et reprend δικαιοσύνη. Répéter « justice » en français rend le sens immédiatement clair et souligne naturellement le contraste.
- source_word: ζητοῦντες στῆσαι
  choice: cherchant à établir
  rationale: Cette formulation conserve le participe présent parallèle et rend le sens idiomatique de στῆσαι sans préciser indûment la méthode ou le degré de réussite.
- source_word: οὐχ ὑπετάγησαν
  choice: ils ne se sont pas soumis
  rationale: Le verbe passif a ici un sens proche du moyen; la forme pronominale française exprime naturellement le fait de se placer sous l’autorité ou l’ordre de la justice divine.
theological_decisions:
- issue: Sens de « la justice de Dieu » chez Paul
  choice: Conserver « la justice de Dieu » sans trancher entre la justice qui caractérise Dieu, celle qui vient de lui et son action salvatrice par laquelle il rend juste.
  alternative: Expliciter « la justice venant de Dieu » ou « la propre justice de Dieu ».
  rationale: Le génitif grec peut porter plusieurs nuances complémentaires. En choisir une seule dans le texte réduirait une tension théologique authentique de l’expression paulinienne.
- issue: Nature de « leur propre justice »
  choice: Reprendre explicitement le nom sous-entendu par ἰδίαν sans expliquer comment cette justice est recherchée.
  alternative: Paraphraser par « leur manière à eux d’être justes » ou l’identifier explicitement à une justice fondée sur les œuvres.
  rationale: Le grec établit le contraste entre la justice de Dieu et la leur, mais ce verset seul ne développe pas entièrement la nature de cette dernière. La traduction évite donc d’importer une interprétation doctrinale plus précise.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux participes grecs sont rendus par des participes présents coordonnés, et « En effet » assure clairement le lien explicatif avec le contexte. La répétition finale de « la justice de Dieu » conserve l’insistance du grec.
