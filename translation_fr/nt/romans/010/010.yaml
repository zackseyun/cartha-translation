id: ROM.10.10
reference: Romans 10:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: fr
  text: Car c’est avec le cœur que l’on croit pour la justice[a], et avec la bouche que l’on confesse pour le salut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aboutissant à la justice ». La préposition grecque peut indiquer le but ou l’aboutissement.'
    reason: Préserver l’ambiguïté de εἰς entre orientation et résultat.
  - marker: b
    text: 'Ou : « aboutissant au salut ». Même construction grecque que dans la proposition précédente.'
    reason: Signaler le parallélisme et la même ambiguïté de but ou de résultat.
lexical_decisions:
- source_word: καρδίᾳ
  choice: avec le cœur
  rationale: Le datif désigne ici le cœur comme siège ou moyen de la foi. « Avec le cœur » est naturel en français et maintient l’opposition entre l’intériorité de la foi et l’expression publique par la bouche.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication de l’affirmation précédente ; « car » en conserve clairement la fonction argumentative.
- source_word: πιστεύεται
  choice: on croit
  rationale: Cette forme passive ou moyenne a ici une portée générale. Le pronom « on » rend naturellement cette généralisation en français sans préciser indûment le sujet.
- source_word: εἰς δικαιοσύνην
  choice: en vue de la justice
  rationale: La préposition εἰς peut exprimer le but ou l’aboutissement. « En vue de » conserve cette ouverture mieux qu’une formulation qui imposerait exclusivement une relation causale ou chronologique.
- source_word: δικαιοσύνην
  choice: justice
  rationale: « Justice » est le correspondant français usuel de δικαιοσύνη et peut désigner, selon le contexte paulinien, la qualité d’être juste, la juste relation avec Dieu ou son action juste, sans réduire ici cette richesse sémantique.
- source_word: στόματι
  choice: avec la bouche
  rationale: Le datif est parallèle à καρδίᾳ. Cette traduction garde à la fois le parallélisme formel et le contraste entre réalité intérieure et expression verbale.
- source_word: δὲ
  choice: et
  rationale: Ici, δέ relie deux propositions complémentaires avec une légère mise en contraste. « Et » évite de présenter la foi et la confession comme opposées.
- source_word: ὁμολογεῖται
  choice: on confesse
  rationale: Le verbe a une portée générale parallèle à πιστεύεται. « Confesser » convient au contexte immédiat, où il s’agit de reconnaître verbalement Jésus comme Seigneur, tout en laissant ce complément implicite comme dans le grec.
- source_word: εἰς σωτηρίαν
  choice: en vue du salut
  rationale: La même traduction de εἰς préserve le parallélisme avec « en vue de la justice » et maintient la possibilité d’une nuance de but ou d’aboutissement.
- source_word: σωτηρίαν
  choice: salut
  rationale: « Salut » est le terme français courant dans ce contexte paulinien et conserve les dimensions présente et future de la délivrance divine.
theological_decisions:
- issue: Rapport entre la foi et la confession, d’une part, et la justice et le salut, d’autre part
  choice: Conserver les deux propositions parallèles et rendre εἰς par « en vue de », sans définir un ordre mécanique ni une causalité méritoire.
  alternative: Préciser que la confession n’est qu’un signe du salut, ou qu’elle constitue une œuvre supplémentaire permettant de mériter le salut.
  rationale: Le grec associe directement la foi à la justice et la confession au salut au moyen de deux constructions parallèles. La traduction doit préserver cette tension théologique sans trancher ce que le verset ne précise pas.
- issue: Sens de δικαιοσύνη
  choice: Employer « justice » en maintenant sa portée paulinienne ouverte.
  alternative: Rendre explicitement par « justification », « rectitude morale » ou « justice sociale ».
  rationale: Chacune de ces solutions explicites sélectionnerait une seule dimension possible du terme grec. « Justice » laisse subsister sa densité relationnelle, judiciaire et éthique.
translation_notes:
  register: Français international moderne, clair et digne. La tournure générale avec « on » est idiomatique ; la répétition de « avec » et de « en vue de » reproduit le parallélisme serré du grec. Le verbe « confesser », employé absolument, conserve la coloration biblique et renvoie naturellement au contenu explicité au verset précédent.
