id: ROM.10.11
reference: Romans 10:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: fr
  text: 'En effet, l’Écriture dit : « Quiconque croit en lui ne sera pas couvert de honte. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne sera pas déçu » ou « n’aura pas à rougir » ; le verbe grec peut évoquer la honte, la disgrâce ou la déception liée à une confiance qui se révèle vaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: 'Le présent grec convient à la formule de citation au présent : « l’Écriture dit ». Cette tournure est naturelle et garde à la parole citée sa valeur actuelle.'
- source_word: γὰρ
  choice: En effet
  rationale: γάρ justifie l’affirmation précédente. « En effet » marque clairement ce lien argumentatif en français moderne sans suggérer nécessairement une causalité plus étroite.
- source_word: ἡ γραφή
  choice: l’Écriture
  rationale: Dans cette formule paulinienne, γραφή désigne l’Écriture sacrée, et non un écrit quelconque.
- source_word: Πᾶς ὁ πιστεύων
  choice: Quiconque croit
  rationale: La construction substantivée a une portée générale et universelle. « Quiconque croit » est idiomatique, inclusif et fidèle à cette portée.
- source_word: πιστεύων
  choice: croit
  rationale: Le verbe πιστεύω désigne ici la foi dirigée vers une personne. « Croire en » est la formulation française naturelle dans ce contexte.
- source_word: ἐπ’ αὐτῷ
  choice: en lui
  rationale: Avec πιστεύω, ἐπί suivi du datif exprime ici la confiance placée en quelqu’un. « Croire en lui » rend naturellement cette relation en français.
- source_word: οὐ καταισχυνθήσεται
  choice: ne sera pas couvert de honte
  rationale: Cette formulation conserve la valeur passive du futur grec et évoque une honte objective ou publique, plutôt qu’un simple sentiment intérieur.
theological_decisions:
- issue: Portée du masculin grammatical dans Πᾶς ὁ πιστεύων
  choice: Quiconque croit
  alternative: Tout homme qui croit
  rationale: Le masculin singulier grec est générique et ne limite pas l’énoncé aux hommes. La traduction garde donc la portée universelle sans introduire une restriction sexuelle absente du sens.
- issue: Référent de αὐτῷ
  choice: lui
  alternative: le Seigneur / le Messie
  rationale: Le contexte permet d’identifier le référent, mais le pronom est conservé afin de respecter la forme de la citation et de ne pas ajouter une explicitation interprétative dans le texte.
- issue: Nature de la honte dans καταισχυνθήσεται
  choice: sera couvert de honte
  alternative: aura honte
  rationale: Le passif grec et l’arrière-plan de la citation favorisent l’idée de ne pas subir la honte ou la disgrâce lors du dénouement, sans exclure entièrement la dimension subjective.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » assure la continuité argumentative ; « quiconque » maintient la portée universelle ; « couvert de honte » conserve le passif et la force publique de καταισχυνθήσεται.
