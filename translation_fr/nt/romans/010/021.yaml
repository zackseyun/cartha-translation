id: ROM.10.21
reference: Romans 10:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: fr
  text: 'Mais au sujet d’Israël, il dit[a] : « Tout au long du jour, j’ai tendu les mains vers un peuple qui refuse d’obéir[b] et qui s’oppose[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais à Israël, il dit. » La construction grecque peut désigner soit une parole adressée à Israël, soit une parole dite à son sujet.'
    reason: alternative_reading
  - marker: b
    text: Le terme grec peut aussi signifier « qui refuse de croire » ou « qui refuse de se laisser convaincre ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « qui contredit », « qui parle contre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: Mais au sujet d’Israël
  rationale: Avec λέγει, πρός peut introduire ce qui est dit au sujet d’Israël, tout en permettant aussi l’idée d’une parole adressée à Israël. La formulation principale est naturelle en français et l’autre possibilité est conservée en note.
- source_word: λέγει
  choice: il dit
  rationale: Le présent du verbe introducteur est maintenu. Le sujet implicite, Dieu dans le contexte de la citation d’Ésaïe, n’est pas explicité dans le corps du verset.
- source_word: Ὅλην τὴν ἡμέραν
  choice: Tout au long du jour
  rationale: Cette tournure française rend naturellement l’accusatif de durée et souligne la persistance de l’action.
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: j’ai tendu les mains
  rationale: Le passé composé convient à la citation prophétique en français moderne, tandis que « tendre les mains » conserve l’image concrète d’un appel ou d’un accueil.
- source_word: πρὸς λαὸν
  choice: vers un peuple
  rationale: « Vers » rend la direction du geste sans effacer l’image des mains tendues.
- source_word: ἀπειθοῦντα
  choice: qui refuse d’obéir
  rationale: Cette formulation exprime la résistance volontaire comprise dans ἀπειθέω, tout en laissant en note sa nuance possible de refus de croire ou de se laisser convaincre.
- source_word: ἀντιλέγοντα
  choice: qui s’oppose
  rationale: Le verbe français exprime naturellement l’opposition active. Une note conserve la nuance plus précise de contradiction ou de parole hostile présente dans ἀντιλέγω.
theological_decisions:
- issue: Caractérisation de la réponse d’Israël à Dieu
  choice: qui refuse d’obéir et qui s’oppose
  alternative: qui refuse de croire et qui contredit
  rationale: Les deux participes décrivent à la fois le refus et l’opposition active à l’initiative divine. La traduction ne réduit pas ἀπειθοῦντα à une incrédulité purement intellectuelle et ne tire aucune conclusion supplémentaire sur le statut d’Israël au-delà de la citation.
- issue: Sujet de « il dit »
  choice: Maintien du sujet implicite
  alternative: Dieu dit
  rationale: Le contexte désigne Dieu comme locuteur de la citation, mais le grec n’exprime pas ici le sujet. Le laisser implicite préserve la forme du texte et évite une explicitation inutile.
translation_notes:
  register: Français international moderne, naturel et digne. La structure de la citation et l’image des mains tendues sont conservées. Les relatives évitent les adjectifs rares ou artificiels tout en distinguant le refus d’obéir de l’opposition active.
