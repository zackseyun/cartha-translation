  source_fidelity: 'Le texte rend fidèlement la chaîne rhétorique de Paul : le subjonctif délibératif grec est naturellement exprimé par « comment proclameront-ils », et le passif « sont envoyés » conserve l’idée qu’un autre envoie les messagers. La citation préserve l’image des pieds et des messagers qui annoncent. « De bonnes nouvelles » interprète idiomatiquement τὰ ἀγαθά dans le cadre d’εὐαγγελιζομένων, tandis que la note indique correctement le sens littéral plus concret, « les bonnes choses ».'
  naturalness: Français international moderne, fluide et de registre biblique sobre. « Qu’ils sont beaux, les pieds de ceux qui… » est une tournure exclamative poétique naturelle et conserve l’effet de la citation. « Comme il est écrit » est une formule de citation pleinement idiomatique.
  terminology: « Proclamer » évite de restreindre κηρύσσω à un cadre ecclésial; « envoyés » rend directement ἀποσταλῶσιν; « annoncent de bonnes nouvelles » convient au vocabulaire des messagers sans imposer le jargon « évangéliser ». La note traite adéquatement la nuance de ὡραῖοι ainsi que la littéralité de τὰ ἀγαθά.
