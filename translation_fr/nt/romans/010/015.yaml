id: ROM.10.15
reference: Romans 10:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: fr
  text: 'Et comment proclameront-ils s’ils ne sont pas envoyés ? Comme il est écrit : « Qu’ils sont beaux, les pieds de ceux qui annoncent de bonnes nouvelles[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui annoncent les bonnes choses ». Le mot traduit par « beaux » peut aussi évoquer une arrivée agréable, bienvenue ou opportune.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: proclameront-ils
  rationale: Le verbe désigne une proclamation publique. « Proclamer » garde ce sens large sans le limiter à la prédication dans un cadre cultuel.
- source_word: ἀποσταλῶσιν
  choice: sont envoyés
  rationale: Le passif exprime l’envoi par une autre personne; cette formulation directe conserve la dépendance envers celui qui envoie.
- source_word: καθὼς γέγραπται
  choice: Comme il est écrit
  rationale: Formule française courante et digne pour introduire une citation de l’Écriture.
- source_word: ὡραῖοι
  choice: beaux
  rationale: Le terme évoque la beauté ou le caractère agréable de l’arrivée; « beaux » préserve l’image frappante des pieds du messager.
- source_word: πόδες
  choice: les pieds
  rationale: L’image corporelle de la citation est conservée plutôt que remplacée par une explication abstraite.
- source_word: εὐαγγελιζομένων
  choice: ceux qui annoncent de bonnes nouvelles
  rationale: Le participe désigne ceux qui communiquent une bonne nouvelle; « annoncent » convient naturellement à l’image des messagers.
- source_word: τὰ ἀγαθά
  choice: de bonnes nouvelles
  rationale: Littéralement, l’expression signifie « les bonnes choses ». En français, « annoncer de bonnes choses » serait maladroit; dans cette construction, « de bonnes nouvelles » restitue naturellement l’annonce d’événements bénéfiques, avec la nuance littérale signalée en note.
theological_decisions:
- issue: Rapport entre la citation concernant les messagers et la proclamation de l’Évangile
  choice: Conserver l’image générale de messagers envoyés dont l’arrivée est célébrée.
  alternative: Employer « prêcher » et une formulation explicitement ecclésiale, pouvant suggérer exclusivement un ministère ordonné.
  rationale: Le raisonnement de Paul porte sur l’envoi et la proclamation, mais ni le verbe ni la citation n’imposent ici un office ecclésial particulier.
translation_notes:
  register: Français international moderne, clair et digne. L’inversion interrogative soutient le rythme rhétorique de la série de questions. La tournure exclamative « Qu’ils sont beaux » conserve l’image poétique de la citation.
