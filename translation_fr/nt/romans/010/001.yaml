source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: fr
  text: Frères[a], le désir de mon cœur et ma prière à Dieu pour eux sont en vue de leur salut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Frères et sœurs » ; le masculin pluriel grec peut s’adresser à un groupe comprenant des hommes et des femmes.'
    reason: alternative_lexicale_et_précision_grammaticale
lexical_decisions:
- source_word: Ἀδελφοί
  choice: Frères et sœurs
  rationale: Le vocatif masculin pluriel peut désigner l’ensemble de la communauté, composée d’hommes et de femmes. En français moderne, « Frères et sœurs » rend naturellement cette portée inclusive sans effacer l’image familiale.
- source_word: εὐδοκία τῆς ἐμῆς καρδίας
  choice: le désir de mon cœur
  rationale: Dans ce contexte, εὐδοκία exprime ce que Paul souhaite vivement. Cette formulation française conserve la relation génitive et le registre affectif de καρδία.
- source_word: δέησις
  choice: ma prière
  rationale: Le terme désigne une demande adressée à Dieu, souvent pressante. « Prière » est ici naturel, tandis que le contexte fait entendre qu’il s’agit d’une requête.
- source_word: πρὸς τὸν θεόν
  choice: à Dieu
  rationale: πρός avec l’accusatif indique ici la direction de la prière ; « à Dieu » est l’équivalent français idiomatique.
- source_word: ὑπὲρ αὐτῶν
  choice: pour eux
  rationale: ὑπέρ exprime ici l’intérêt ou le bénéfice des personnes concernées. Le pronom est conservé, son référent étant donné par le contexte précédent.
- source_word: εἰς σωτηρίαν
  choice: qu’ils soient sauvés
  rationale: εἰς σωτηρίαν indique le but visé par le désir et la prière. La proposition française exprime clairement et naturellement que ce salut concerne « eux ».
- source_word: μὲν
  choice: non rendu explicitement
  rationale: La particule a ici une fonction discursive légère et ne reçoit pas de répondant explicite en δέ dans le verset. Une traduction littérale alourdirait inutilement le français.
theological_decisions:
- issue: Portée de l’adresse Ἀδελφοί
  choice: Frères et sœurs
  alternative: Frères
  rationale: Bien que la forme grecque soit grammaticalement masculine, elle peut s’adresser à toute l’assemblée. Le texte principal explicite cette portée probable ; la note signale la forme littérale afin de préserver la donnée linguistique.
- issue: Rapport syntaxique de εἰς σωτηρίαν
  choice: qu’ils soient sauvés
  alternative: en vue du salut
  rationale: La formule grecque peut se rattacher au désir et à la prière comme leur objectif. La traduction retient ce sens final sans préciser davantage la manière dont le salut s’accomplit.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’intensité personnelle de Paul et le pronom « eux », dont le référent ressort du contexte. La tournure « c’est qu’ils soient sauvés » évite le calque lourd « est pour leur salut ».
