id: ROM.10.16
reference: Romans 10:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: fr
  text: 'Mais tous n’ont pas obéi à la bonne nouvelle[a]. En effet, Ésaïe dit : « Seigneur, qui a cru à notre message[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à l’Évangile ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à notre annonce » ; littéralement « à notre écoute ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque naturellement le contraste avec l’argument précédent.
- source_word: οὐ πάντες
  choice: tous n’ont pas
  rationale: 'Conserve la négation partielle du grec : il ne s’agit pas de dire que personne n’a obéi, mais que tous ne l’ont pas fait.'
- source_word: ὑπήκουσαν
  choice: ont obéi
  rationale: Le verbe ὑπακούω exprime l’obéissance, et non la simple audition. Cette traduction préserve la force de la réponse attendue à la bonne nouvelle.
- source_word: τῷ εὐαγγελίῳ
  choice: à la bonne nouvelle
  rationale: Rend de façon transparente le sens de εὐαγγέλιον en français moderne. Le terme traditionnel « Évangile » est indiqué en note.
- source_word: Ἠσαΐας
  choice: Ésaïe
  rationale: Forme française biblique courante du nom du prophète.
- source_word: γὰρ
  choice: En effet
  rationale: Introduit l’appui scripturaire donné à l’affirmation précédente et exprime clairement ce lien explicatif en français.
- source_word: λέγει
  choice: dit
  rationale: Conserve le présent du grec, qui présente l’Écriture comme une parole toujours actuelle.
- source_word: Κύριε
  choice: Seigneur
  rationale: Rend directement le vocatif κύριε dans un registre digne et naturel.
- source_word: τίς
  choice: qui
  rationale: Équivalent direct du pronom interrogatif grec.
- source_word: ἐπίστευσεν
  choice: a cru
  rationale: Le passé composé rend naturellement en français l’aoriste dans cette question rhétorique.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: à notre message
  rationale: Dans cette citation, ἀκοή désigne naturellement le contenu communiqué et entendu, c’est-à-dire le message ou l’annonce. Une traduction plus littérale est signalée en note.
theological_decisions:
- issue: Nature de la réponse exprimée par ὑπήκουσαν τῷ εὐαγγελίῳ
  choice: « ont obéi à la bonne nouvelle »
  alternative: « ont écouté la bonne nouvelle » ou « ont accueilli la bonne nouvelle »
  rationale: Le grec emploie explicitement un verbe d’obéissance. La traduction ne réduit donc pas la réponse à une simple écoute, tout en évitant d’ajouter un système doctrinal sur les rapports entre foi, obéissance et salut.
- issue: Sens de ἀκοή dans la citation d’Ésaïe
  choice: « message »
  alternative: « annonce », « ce que nous avons fait entendre » ou, littéralement, « audition »
  rationale: Le mot peut désigner l’acte d’entendre ou ce qui est entendu. Ici, le sens de message annoncé est le plus naturel, mais la note préserve la polysémie de l’expression grecque.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la relation inhabituelle mais importante entre « obéir » et « la bonne nouvelle ». Les marqueurs de note sont placés immédiatement après les expressions concernées.
