source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: fr
  text: 'Mais Ésaïe ose même dire : « J’ai été trouvé par ceux qui ne me cherchaient pas[a] ; je me suis manifesté[b] à ceux qui ne s’enquéraient pas de moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi ceux qui ne me cherchaient pas ».
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « je me suis fait connaître de ceux qui ne s’enquéraient pas de moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: va jusqu’à dire avec audace
  rationale: Le verbe exprime la hardiesse, voire l’audace, avec laquelle Ésaïe prononce cette déclaration frappante. Cette tournure française restitue naturellement sa force et s’articule avec « et dit ».
- source_word: Εὑρέθην
  choice: J’ai été trouvé
  rationale: Le passif aoriste est conservé sans expliciter davantage la manière dont Dieu a été trouvé.
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: par ceux qui ne me cherchaient pas
  rationale: Avec le passif « j’ai été trouvé », ἐν désigne idiomatiquement les personnes qui ont trouvé Dieu. La possibilité plus formelle « parmi ceux » est signalée en note.
- source_word: ζητοῦσιν
  choice: cherchaient
  rationale: « Chercher » garde le parallélisme et la portée biblique de ζητέω dans un français courant.
- source_word: ἐμφανὴς ἐγενόμην
  choice: je me suis manifesté
  rationale: Cette expression naturelle conserve l’idée de devenir manifeste sans réduire le propos à une simple visibilité physique. Elle ne précise pas au-delà du grec la modalité de cette manifestation.
- source_word: ἐπερωτῶσιν
  choice: me demandaient rien
  rationale: Dans la tournure française « ne me demandaient rien », le verbe rend l’idée de ne pas s’enquérir de Dieu et maintient la distinction avec « chercher », sans importer le sens plus spécifique d’« invoquer ».
- source_word: δὲ
  choice: Mais
  rationale: « Mais » marque le contraste avec l’argument et la citation précédents.
- source_word: Ἠσαΐας
  choice: Ésaïe
  rationale: Forme française traditionnelle et largement reconnue du nom du prophète.
theological_decisions:
- issue: La manifestation divine dans la citation d’Ésaïe
  choice: je me suis manifesté à ceux qui ne me demandaient rien
  alternative: je suis devenu visible pour ceux qui ne s’enquéraient pas de moi
  rationale: « Se manifester » rend directement ἐμφανὴς ἐγενόμην dans un français naturel, tout en préservant l’affirmation d’une révélation divine sans en définir le mécanisme.
- issue: Le rôle des personnes qui trouvent Dieu
  choice: par ceux qui ne me cherchaient pas
  alternative: parmi ceux qui ne me cherchaient pas
  rationale: La formulation principale exprime le rapport idiomatique entre ἐν et le passif, tandis que la note maintient visible l’ambiguïté prépositionnelle.
translation_notes:
  register: Français international moderne, digne et accessible. « Va jusqu’à dire avec audace » évite une formulation raide tout en rendant la force de ἀποτολμᾷ. Les deux marqueurs de note figurent dans le texte principal.
