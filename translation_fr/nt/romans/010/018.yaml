id: ROM.10.18
reference: Romans 10:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: fr
  text: 'Mais je demande : n’ont-ils donc pas entendu ? Bien sûr que si : « Leur voix[a] s’est répandue sur toute la terre, et leurs paroles jusqu’aux extrémités du monde habité[b]. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur son ».
    reason: lexical_alternative
  - marker: b
    text: Ou simplement « monde » ; le grec désigne littéralement le monde habité.
    reason: lexical_alternative
  - marker: c
    text: Paul cite le Psaume 19.5 et applique son langage à la diffusion du message proclamé.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: n’ont-ils donc pas entendu ?
  rationale: La double négation introduit une question rhétorique qui attend une réponse affirmative. Le passé composé rend naturellement l’aoriste dans ce contexte et « donc » fait sentir la force argumentative.
- source_word: μενοῦνγε
  choice: Bien sûr que si
  rationale: Cette réponse idiomatique française exprime l’affirmation énergique qui réfute la formulation négative de la question.
- source_word: φθόγγος
  choice: voix
  rationale: « Voix » convient à la proclamation audible évoquée dans la citation et forme un parallélisme naturel avec « paroles » ; « son » reste possible.
- source_word: ἐξῆλθεν
  choice: s’est répandue
  rationale: Cette tournure française exprime naturellement la diffusion universelle de la voix tout en conservant la portée durable de l’action citée.
- source_word: γῆ
  choice: terre
  rationale: Dans cette citation poétique à portée universelle, « terre » convient mieux qu’un territoire particulier.
- source_word: πέρατα
  choice: extrémités
  rationale: « Jusqu’aux extrémités de » restitue l’image spatiale et le registre poétique du grec.
- source_word: οἰκουμένης
  choice: monde habité
  rationale: Cette expression conserve la nuance propre de οἰκουμένη, qui désigne le monde où vivent les humains, même si « monde » serait plus fluide.
- source_word: ῥήματα
  choice: paroles
  rationale: « Paroles » est l’équivalent direct et maintient le parallélisme avec « voix » sans interpréter le terme comme « message ».
theological_decisions:
- issue: Référent du possessif « leur » dans la citation du Psaume
  choice: Conserver le pronom sans en préciser le référent
  alternative: Identifier explicitement le référent soit aux cieux dans le Psaume 19, soit aux prédicateurs de la bonne nouvelle dans l’application de Paul
  rationale: Paul reprend le langage du Psaume et l’intègre à son argument. Préciser le référent dans le texte principal trancherait une tension intertextuelle que le grec laisse ouverte.
translation_notes:
  register: Français international actuel, digne et accessible. La question et sa réponse sont rendues de manière idiomatique, tandis que la citation conserve son parallélisme poétique et son ambiguïté référentielle.
