  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: fr
  text: Ainsi, la foi vient de ce qu’on entend, et ce qu’on entend vient par la parole du Messie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la parole au sujet du Messie » ou « par le message concernant le Messie ». Le génitif grec peut être compris de plusieurs manières.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα
  choice: Ainsi
  rationale: Marque la conclusion tirée de l’argument précédent, dans un français naturel et soutenu.
- source_word: πίστις
  choice: la foi
  rationale: Dans ce contexte, le terme désigne la réponse croyante à la proclamation entendue, plutôt que la fidélité.
- source_word: ἐξ ἀκοῆς
  choice: vient de ce qu’on entend
  rationale: ἐκ exprime la source; cette formulation française rend naturellement la proposition grecque sans verbe et laisse ἀκοή évoquer à la fois l’écoute et ce qui est entendu.
- source_word: ἡ δὲ ἀκοὴ
  choice: et ce qu’on entend
  rationale: δέ assure ici une liaison progressive plutôt qu’une opposition forte. La reprise conserve le lien lexical avec la première occurrence de ἀκοή.
- source_word: διὰ ῥήματος
  choice: par la parole
  rationale: διά avec le génitif exprime le moyen; « parole » conserve la portée d’une parole prononcée ou d’un message communiqué.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός fonctionne ici comme un titre. Le génitif est rendu formellement par « du Messie », tandis que son éventuel sens objectif est signalé en note.
theological_decisions:
- issue: Sens de πίστις dans ce contexte paulinien
  choice: la foi
  alternative: la confiance; la fidélité
  rationale: Le contexte immédiat, centré sur l’annonce entendue et la réponse humaine, favorise « foi » sans imposer un sens plus spécialisé.
- issue: Rapport du génitif Χριστοῦ avec ῥήματος
  choice: la parole du Messie
  alternative: la parole au sujet du Messie; le message concernant le Messie
  rationale: Le grec permet de comprendre le génitif comme indiquant l’origine ou l’appartenance, mais aussi l’objet du message. Le texte principal reste proche de la forme grecque et la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « ce qu’on entend » conserve le mouvement de l’original tout en évitant le tour plus abstrait et moins naturel « vient de l’écoute ».
