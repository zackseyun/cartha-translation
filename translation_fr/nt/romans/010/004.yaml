  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: fr
  text: Car le Messie est la fin[a] de la Loi, pour la justice de toute personne qui croit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le but », « l’aboutissement » ou « l’accomplissement » : le mot grec traduit par « fin » peut désigner le terme d’une chose aussi bien que son but ou son plein aboutissement.'
    reason: alternative_reading
  - marker: b
    text: Le mot grec traduit par « justice » peut aussi évoquer la droiture ou le fait d’être reconnu juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: fin
  rationale: « Fin » conserve l’ambiguïté du grec, qui peut désigner aussi bien le terme que le but, l’aboutissement ou l’accomplissement.
- source_word: νόμου
  choice: de la loi
  rationale: Dans ce contexte paulinien, le nom sans article renvoie à la Loi mosaïque comme réalité connue ; l’article défini est naturel en français.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Le titre messianique est actif ici, puisque Paul situe Jésus par rapport à la Loi et à l’histoire d’Israël.
- source_word: εἰς δικαιοσύνην
  choice: en vue de la justice
  rationale: Cette formulation garde la valeur directionnelle de εἰς, qui peut exprimer le but ou le résultat, sans préciser davantage le mécanisme envisagé.
- source_word: δικαιοσύνην
  choice: justice
  rationale: « Justice » est le correspondant français courant de δικαιοσύνη et préserve la portée théologique du terme chez Paul ; une nuance possible est signalée en note.
- source_word: παντὶ τῷ πιστεύοντι
  choice: pour toute personne qui croit
  rationale: Cette formulation inclusive et naturelle conserve le participe grec et désigne les personnes auxquelles cette justice se rapporte.
- source_word: γὰρ
  choice: Car
  rationale: « Car » rend la fonction explicative de γάρ et relie le verset au raisonnement précédent.
theological_decisions:
- issue: Sens de τέλος νόμου par rapport à la Loi mosaïque
  choice: « fin de la loi » dans le texte principal
  alternative: « but », « aboutissement » ou « accomplissement de la loi »
  rationale: Le grec permet un sens terminatif aussi bien que téléologique. Le texte principal et la note préservent cette tension au lieu de trancher.
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte met au premier plan la fonction de Jésus dans l’histoire de la Loi et des promesses faites à Israël ; le sens du titre est donc rendu explicitement.
- issue: Portée de δικαιοσύνη
  choice: justice
  alternative: droiture ou fait d’être reconnu juste
  rationale: Le terme paulinien peut évoquer la justice comme qualité, statut ou action divine. La traduction principale reste concise et la note signale cette étendue sémantique.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation légèrement condensée reflète celle du grec et conserve ses ambiguïtés concernant « fin » ainsi que le rapport entre la foi et la justice.
