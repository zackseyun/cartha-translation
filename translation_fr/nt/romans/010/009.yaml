id: ROM.10.9
reference: Romans 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: fr
  text: Car si tu reconnais de ta bouche que Jésus est Seigneur[a], et si tu crois dans ton cœur que Dieu l’a ressuscité d’entre les morts, tu seras sauvé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu reconnais Jésus comme Seigneur ».'
    reason: La construction grecque κύριον Ἰησοῦν peut être comprise et rendue plus compactement sans modifier substantiellement le contenu de la confession.
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit ici l’explication de l’affirmation précédente; « Car » exprime naturellement ce lien logique dans un registre biblique moderne et digne.
- source_word: ἐὰν
  choice: si
  rationale: Rend directement la particule conditionnelle construite avec les deux subjonctifs.
- source_word: ὁμολογήσῃς
  choice: reconnais
  rationale: Dans ce contexte de déclaration orale, « reconnaître » exprime l’aveu public et assumé; « confesser » reste possible, mais peut sembler plus technique ou évoquer en français l’aveu de fautes.
- source_word: ἐν τῷ στόματί σου
  choice: de ta bouche
  rationale: Formulation française naturelle qui conserve l’image concrète de la parole prononcée.
- source_word: κύριον Ἰησοῦν
  choice: que Jésus est Seigneur
  rationale: Explicite la valeur prédicative probable de l’accusatif après ὁμολογέω et présente clairement le contenu de la reconnaissance.
- source_word: πιστεύσῃς
  choice: crois
  rationale: Équivalent direct et naturel du verbe πιστεύω devant une proposition de contenu.
- source_word: ἐν τῇ καρδίᾳ σου
  choice: dans ton cœur
  rationale: Conserve l’anthropologie biblique du cœur comme lieu de la conviction intérieure, sans la réduire au seul sentiment.
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: Dieu l’a ressuscité
  rationale: Le passé composé convient au français actuel pour cet événement passé dont la portée demeure; « ressusciter » rend ici précisément ἐγείρω dans son contexte.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Rend la nuance de sortie du milieu des morts tout en employant une expression française consacrée et intelligible.
- source_word: σωθήσῃ
  choice: tu seras sauvé
  rationale: Conserve le futur passif et la portée sotériologique du verbe dans le contexte de Romains 10.
theological_decisions:
- issue: Sens de κύριος dans la formule de reconnaissance
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » conserve à la fois l’autorité attribuée à Jésus et la forte résonance scripturaire de κύριος dans le contexte, sans réduire le titre à la seule relation maître-disciple.
- issue: Construction de κύριον Ἰησοῦν
  choice: que Jésus est Seigneur
  alternative: Jésus comme Seigneur
  rationale: La formulation principale rend explicite le contenu propositionnel de la reconnaissance. L’alternative demeure grammaticalement possible et est signalée en note afin de préserver la légère ambiguïté de la construction grecque.
- issue: Portée de σωθήσῃ
  choice: tu seras sauvé
  alternative: tu seras délivré
  rationale: Le contexte traite du salut; « sauvé » en conserve la portée sans préciser davantage la nature ou les étapes du salut.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes grecques de deuxième personne du singulier. La structure parallèle « si tu… et si tu… » rend explicites en français les deux verbes conditionnels grecs, tandis que la formulation conserve les images de la bouche et du cœur.
