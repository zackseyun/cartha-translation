id: ROM.12.10
reference: Romans 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: fr
  text: Par amour fraternel, ayez une tendre affection les uns pour les autres ; pour ce qui est de l’honneur, rivalisez d’égards les uns envers les autres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: amour fraternel
  rationale: Rend directement l’affection qui unit les membres d’une même famille, ici la communauté croyante, dans une expression française courante et digne.
- source_word: φιλόστοργοι
  choice: ayez une tendre affection
  rationale: Conserve la nuance d’attachement chaleureux propre aux liens familiaux, plus forte qu’une simple bienveillance.
- source_word: τιμῇ
  choice: pour ce qui est de l’honneur
  rationale: Préserve le champ sémantique de l’honneur, ici compris comme l’honneur témoigné à autrui.
- source_word: προηγούμενοι
  choice: rivalisez d’égards
  rationale: Le verbe peut évoquer le fait de prendre les devants ou de surpasser. Cette formulation garde l’idée d’émulation positive sans suggérer une compétition pour recevoir soi-même des honneurs.
theological_decisions:
- issue: Sens de προηγούμενοι dans l’exhortation relative à l’honneur
  choice: rivalisez d’égards les uns envers les autres
  alternative: prenez les devants pour vous honorer les uns les autres
  rationale: Le grec permet une nuance de priorité comme d’émulation. Le choix retenu reste proche du relief rhétorique de « outdo one another » tout en précisant que l’émulation consiste à témoigner des égards à autrui.
translation_notes:
  register: Français international moderne, exhortatif et digne. Le parallélisme des deux groupes introduits par le datif grec est conservé autant que possible, avec une formulation naturelle.
