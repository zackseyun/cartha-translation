  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: fr
  text: Car, de même que dans un seul corps nous avons de nombreux membres[a], mais tous les membres n’ont pas la même fonction[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beaucoup de parties ».
    reason: lexical_alternative
  - marker: b
    text: Ou « la même activité ». Le terme grec peut désigner une activité ou une fonction ; ici, « fonction » convient à l’image du corps et au contexte des rôles différents.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: de même que
  rationale: Introduit naturellement en français la comparaison qui sera complétée au verset suivant.
- source_word: γὰρ
  choice: en effet
  rationale: Conserve le lien explicatif avec l’exhortation précédente, dans un français actuel et soutenu.
- source_word: ἐν ἑνὶ σώματι
  choice: dans un seul corps
  rationale: Rend directement la valeur locative et souligne l’unité du corps sans expliciter prématurément son référent ecclésial.
- source_word: πολλὰ μέλη
  choice: beaucoup de membres
  rationale: « Membres » préserve l’image anatomique paulinienne ainsi que son application collective; « parties » reste une possibilité plus générale.
- source_word: ἔχομεν
  choice: nous avons
  rationale: Traduction directe du présent de l’indicatif.
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: mais que tous les membres n’ont pas
  rationale: Cette formulation française exprime clairement que la négation porte sur l’identité de fonction entre tous les membres, et non que chacun serait privé de fonction.
- source_word: τὴν αὐτὴν ἔχει πρᾶξιν
  choice: la même fonction
  rationale: πρᾶξις peut désigner une activité ou une fonction; dans la métaphore du corps et le contexte des dons différents, « fonction » convient naturellement sans imposer un vocabulaire doctrinal technique.
theological_decisions:
- issue: Portée ecclésiologique de la métaphore du corps
  choice: Conserver simplement « un seul corps » et « beaucoup de membres » sans nommer l’Église dans ce verset.
  alternative: Paraphraser par « un seul corps, l’Église ».
  rationale: Le verset énonce l’analogie, tandis que son application collective se précise au verset suivant. La traduction respecte cette progression et n’ajoute pas au texte une identification encore implicite.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » maintient l’articulation argumentative; la virgule finale respecte la continuité syntaxique avec le verset suivant. Les marqueurs [a] et [b] figurent dans le texte principal.
