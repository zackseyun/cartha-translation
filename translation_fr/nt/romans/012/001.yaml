id: ROM.12.1
reference: Romans 12:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: fr
  text: 'Je vous exhorte donc, frères[a], par les compassions de Dieu, à présenter vos corps comme un sacrifice vivant, saint et agréable à Dieu : c''est là votre culte raisonnable[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit littéralement « frères » et emploie souvent le masculin pour s'adresser à un groupe mixte.
    reason: alternative_reading
  - marker: b
    text: Ou « votre culte spirituel », « votre service raisonnable » ou « votre service rationnel » ; l'expression grecque peut évoquer un culte raisonné, approprié ou spirituel.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: je vous encourage
  rationale: Le verbe introduit ici une exhortation pressante. « Je vous encourage » est naturel en français moderne et conserve une force pastorale sans prendre le ton archaïque de « je vous exhorte ».
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque naturellement la conséquence pratique de l'argument développé dans Romains 1–11.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel du texte grec est conservé dans le corps du verset; une note précise qu'il peut désigner l'ensemble de la communauté, femmes comprises.
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: par les compassions de Dieu
  rationale: Cette formulation conserve le pluriel οἰκτιρμῶν et laisse à διά sa valeur d'appui ou de moyen dans l'appel de Paul. « Compassions » reste digne et intelligible, tout en faisant entendre les multiples manifestations de la miséricorde divine.
- source_word: παραστῆσαι
  choice: présenter
  rationale: « Présenter » restitue le geste d'offrande et maintient l'écho sacrificiel du contexte.
- source_word: τὰ σώματα ὑμῶν
  choice: vos corps
  rationale: Le terme concret σώματα est rendu directement plutôt que généralisé en « vous-mêmes ».
- source_word: θυσίαν ζῶσαν
  choice: comme un sacrifice vivant
  rationale: La tournure française explicite l'apposition et préserve le paradoxe de l'image sacrificielle.
- source_word: ἁγίαν
  choice: saint
  rationale: « Saint » exprime la consécration à Dieu et s'accorde avec « sacrifice ».
- source_word: εὐάρεστον τῷ θεῷ
  choice: agréable à Dieu
  rationale: Cette expression française courante traduit ce qui plaît à Dieu, sans suggérer une simple acceptabilité minimale.
- source_word: λογικὴν
  choice: qui convient à des êtres doués de raison
  rationale: Cette formulation garde le lien avec λόγος et la notion d'un culte raisonné ou approprié, tout en évitant l'ambiguïté moderne de « culte raisonnable », qui peut évoquer seulement la modération. Une note conserve les autres sens possibles.
- source_word: λατρείαν
  choice: culte
  rationale: Dans ce cadre sacrificiel, « culte » rend clairement le service religieux offert à Dieu et conserve la coloration cultuelle de λατρεία.
theological_decisions:
- issue: Portée de l'adresse ἀδελφοί dans une communauté mixte
  choice: frères
  alternative: frères et sœurs
  rationale: Le texte principal garde la forme masculine du grec, tandis qu'une note signale sa portée collective probable sans effacer la forme source.
- issue: Sens de λογικὴν λατρείαν
  choice: le culte qui convient à des êtres doués de raison
  alternative: votre culte spirituel; votre service raisonnable ou rationnel
  rationale: L'expression grecque peut qualifier le culte de rationnel, conforme à la raison, approprié, voire spirituel. Le texte retient une formulation compréhensible qui conserve l'ancrage dans la raison, et la note maintient ouvert l'éventail interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement exhortatif de la phrase grecque et son imagerie sacrificielle. Les deux notes rendent explicites l'inclusion probable de toute la communauté et l'ambiguïté réelle de λογικὴ λατρεία.
