id: ROM.12.17
reference: Romans 12:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες· προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: fr
  text: Ne rendez à personne le mal pour le mal ; veillez à faire ce qui est bien[a] aux yeux de tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui est honorable » ou « ce qui est noble ».'
    reason: Alternative lexicale permettant de conserver les nuances possibles de καλά.
lexical_decisions:
- source_word: μηδενὶ
  choice: à personne
  rationale: Le datif est le complément indirect de ἀποδιδόντες. « À personne » exprime naturellement en français la portée universelle de l’interdiction.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: le mal pour le mal
  rationale: Cette formulation conserve la force morale de κακόν et exprime clairement l’idée de représailles contenue ici dans ἀντί.
- source_word: ἀποδιδόντες
  choice: rendez
  rationale: Le participe présent a une valeur exhortative dans le contexte. « Rendre le mal pour le mal » est une tournure française naturelle qui traduit l’idée de donner en retour.
- source_word: προνοούμενοι
  choice: veillez à faire
  rationale: Le verbe évoque une attention réfléchie et prévoyante. « Veillez à faire » rend cette disposition active dans un français courant, sans limiter le sens à une provision matérielle.
- source_word: καλὰ
  choice: ce qui est bien
  rationale: Le neutre pluriel substantivé désigne ce qui est bon, beau au sens moral, honorable ou noble. « Ce qui est bien » garde le sens éthique large ; les autres nuances sont signalées en note.
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: aux yeux de tous
  rationale: Cette expression idiomatique conserve l’idée de visibilité et d’appréciation publiques. « Tous » rend inclusivement le générique ἀνθρώπων.
theological_decisions:
- issue: Nuance éthique et publique de καλά
  choice: ce qui est bien
  alternative: ce qui est honorable ; ce qui est noble
  rationale: Dans ce contexte public, καλά peut évoquer à la fois la bonté morale et une conduite reconnue comme honorable. Le texte principal retient le sens le plus large sans réduire l’exhortation à la seule réputation sociale.
translation_notes:
  register: Français international moderne, clair et digne. Le point-virgule maintient le lien étroit entre les deux exhortations. La formulation évite le masculin générique tout en préservant la portée universelle du grec.
