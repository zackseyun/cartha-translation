  - marker: b
    text: 'Ou : « l’enseignant ». Le grec dit littéralement : « celui qui enseigne ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: si
  rationale: Dans cette énumération elliptique de dons et de fonctions, « si » conserve la structure conditionnelle et le parallélisme du grec, tout en s’insérant naturellement dans la continuité du verset précédent.
- source_word: διακονίαν
  choice: le service
  rationale: διακονία peut désigner le service, le ministère ou une aide concrète. « Le service » garde ici toute l’étendue du terme sans suggérer nécessairement une fonction ecclésiale officielle.
- source_word: ἐν τῇ διακονίᾳ
  choice: qu’on se consacre au service
  rationale: Le grec, très elliptique, répète le nom avec ἐν. La formulation française explicite l’exhortation sous-entendue tout en conservant la répétition de « service ».
- source_word: ὁ διδάσκων
  choice: si l’on enseigne
  rationale: Le participe substantivé présent désigne la personne qui exerce l’activité d’enseigner. Cette tournure garde l’accent sur la fonction exercée sans en faire un titre officiel.
- source_word: διδασκαλίᾳ
  choice: l’enseignement
  rationale: διδασκαλία renvoie ici à l’activité d’enseigner. « L’enseignement » est direct, courant et moins étroit ou technique que « la doctrine ».
theological_decisions:
- issue: Faut-il rendre διακονία par un terme ecclésial ?
  choice: le service
  alternative: le ministère
  rationale: Le passage énumère des dons ou fonctions accordés par grâce. « Service » préserve la portée générale du terme et n’impose pas une conception particulière des ministères ou des charges dans l’Église.
- issue: Faut-il présenter ὁ διδάσκων comme le titulaire d’une fonction officielle ?
  choice: si l’on enseigne
  alternative: celui qui enseigne / l’enseignant
  rationale: Le grec emploie un participe qui met en avant l’activité de la personne. La traduction évite donc d’introduire un titre institutionnel que le texte n’affirme pas explicitement.
- issue: Comment rendre les expressions elliptiques ἐν τῇ διακονίᾳ et ἐν τῇ διδασκαλίᾳ ?
  choice: expliciter l’exhortation par « qu’on se consacre à »
  alternative: conserver littéralement « dans le service » et « dans l’enseignement »
  rationale: Le grec dépend du cadre exhortatif des versets 6 à 8 et omet le verbe. L’explicitation rend ce mouvement intelligible en français sans déterminer davantage la nature des dons.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe grecque elliptique est légèrement explicitée pour produire une exhortation naturelle en français, tandis que le parallélisme et la répétition des termes principaux sont conservés.
