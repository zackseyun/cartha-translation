  text: εἴτε διακονίαν ἐν τῇ διακονίᾳ, εἴτε ὁ διδάσκων ἐν τῇ διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/007.yaml
  text: if service[a], in service; if the one teaching, in teaching[b];
translation:
  language: fr
  text: si c’est le service[a], qu’on se consacre au service ; si c’est l’enseignement, que celui qui enseigne se consacre à l’enseignement[b] ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le ministère ». Le mot grec peut désigner le service ou le ministère, selon le contexte.'
