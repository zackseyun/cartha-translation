  verdict: revise
  source_fidelity: Le premier membre grec appelle à participer concrètement à la réponse aux besoins des saints. « Partagez avec les saints qui sont dans le besoin » peut se comprendre comme un partage effectué avec eux et restreint indûment le groupe aux seuls saints nécessiteux. Dans le second membre, διώκοντες exprime une recherche active; la formulation révisée rend cette dynamique sans suggérer que l'on cherche à recevoir soi-même l'hospitalité.
  naturalness: « Subvenez aux besoins » et « cherchez activement à exercer l’hospitalité » sont naturels en français international moderne, dans un registre exhortatif soutenu mais non archaïque.
  terminology: « Saints » conserve le terme paulinien collectif. « Hospitalité » est l'équivalent établi de φιλοξενία; la note maintient sa dimension d'accueil des étrangers et indique l'article grec.
  issues:
  - severity: medium
    issue: Ambiguïté de « Partagez avec les saints qui sont dans le besoin ».
    rationale: Cette expression ne rend pas clairement la contribution aux besoins des saints et peut laisser entendre que seuls les saints déjà dans le besoin sont concernés comme partenaires du partage.
  - severity: medium
    issue: Ambiguïté pragmatique de « recherchez avec empressement l’hospitalité ».
    rationale: En français, on peut comprendre qu'il s'agit de chercher l'hospitalité pour soi. Le grec exhorte plutôt à la pratiquer activement envers autrui.
