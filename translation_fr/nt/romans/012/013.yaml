  text: ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/013.yaml
  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: fr
  text: Subvenez aux besoins des saints[a] ; cherchez activement à exercer l’hospitalité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Participez à la réponse aux besoins des saints » ; le verbe grec peut exprimer la participation ou la contribution.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’hospitalité » ; le terme grec désigne particulièrement l’accueil des étrangers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: dans le besoin
  rationale: Dans ce contexte d’exhortations pratiques, χρεία désigne les besoins concrets ou les nécessités. La tournure française est naturelle et garde la portée générale du terme.
- source_word: ἁγίων
  choice: saints
  rationale: Chez Paul, ἅγιοι désigne collectivement les croyants, le peuple que Dieu a mis à part. « Saints » conserve ce terme paulinien sans le limiter au sens ecclésiastique plus tardif de personnes canonisées.
- source_word: κοινωνοῦντες
  choice: partagez avec
  rationale: κοινωνέω exprime la participation et le partage. Avec les besoins comme complément au datif, il appelle à prendre une part active à l’aide apportée. « Partagez avec » reste idiomatique en français et ne réduit pas nécessairement l’aide à un don financier.
- source_word: φιλοξενίαν
  choice: hospitalité
  rationale: φιλοξενία désigne l’accueil généreux, notamment celui des étrangers. « Hospitalité » est l’équivalent français courant et digne ; une note en explicite la dimension d’accueil des étrangers.
- source_word: διώκοντες
  choice: recherchez avec empressement
  rationale: διώκω évoque une poursuite active et résolue. Cette formulation conserve davantage cette force que le simple verbe « pratiquez ».
theological_decisions:
- issue: Référent des « saints »
  choice: les croyants, considérés comme le peuple saint de Dieu
  alternative: des saints canonisés au sens ecclésiastique ultérieur
  rationale: Dans l’usage paulinien, « les saints » désigne généralement les chrétiens, et non une catégorie restreinte de croyants officiellement reconnus après leur mort.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. Les participes grecs sont rendus par des impératifs, conformément à la série d’exhortations du contexte. Le point-virgule préserve la structure brève et parallèle du verset.
