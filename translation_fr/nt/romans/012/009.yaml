id: ROM.12.9
reference: Romans 12:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: fr
  text: Que l’amour soit sans hypocrisie[a]. Ayez le mal en horreur ; attachez-vous au bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que l’amour soit sincère. » Littéralement : « L’amour sans hypocrisie. »'
    reason: Alternative lexicale et indication de la construction grecque sans verbe.
lexical_decisions:
- source_word: ἀγάπη
  choice: l’amour
  rationale: « Amour » est l’équivalent français moderne et naturel de ἀγάπη dans ce contexte éthique.
- source_word: ἀνυπόκριτος
  choice: sans hypocrisie
  rationale: Cette formulation conserve l’image concrète d’un amour qui n’est ni feint ni joué, plutôt que de la réduire au seul adjectif « sincère ».
- source_word: ἀποστυγοῦντες
  choice: ayez en horreur
  rationale: Le verbe exprime une aversion très forte. « Avoir en horreur » en restitue l’intensité dans un français courant et digne.
- source_word: τὸ πονηρόν
  choice: le mal
  rationale: L’adjectif neutre substantivé désigne largement ce qui est mauvais. « Le mal » est ici naturel et maintient la symétrie avec « le bien ».
- source_word: κολλώμενοι
  choice: attachez-vous à
  rationale: Le verbe évoque une adhésion étroite et persistante. « S’attacher à » exprime clairement cette force sans archaïsme.
- source_word: τῷ ἀγαθῷ
  choice: au bien
  rationale: L’adjectif neutre substantivé désigne ce qui est bon. « Au bien » forme en français un parallèle net avec « le mal ».
theological_decisions:
- issue: Valeur de la proposition sans verbe et des participes dans ce contexte d’exhortations
  choice: 'Rendre l’ensemble comme une suite d’exhortations : « Que l’amour soit… Ayez… attachez-vous… »'
  alternative: 'Conserver une formulation fragmentaire plus littérale : « L’amour sans hypocrisie, ayant le mal en horreur, vous attachant au bien. »'
  rationale: Le grec commence par une proposition nominale, puis emploie des participes. Dans la série d’exhortations de Romains 12, ceux-ci ont une portée exhortative ; des formes injonctives naturelles en français transmettent cette fonction sans modifier le contenu.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « sans hypocrisie » préserve la formulation concrète du grec ; « ayez en horreur » garde la forte intensité de ἀποστυγοῦντες.
