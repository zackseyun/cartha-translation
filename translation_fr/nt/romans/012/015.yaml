  text: χαίρειν μετὰ ⸀χαιρόντων, κλαίειν μετὰ κλαιόντων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: fr
  text: Réjouissez-vous avec ceux qui se réjouissent ; pleurez avec ceux qui pleurent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: Réjouissez-vous
  rationale: L’infinitif présent actif a ici une valeur exhortative dans la série d’instructions de Romains 12. L’impératif français en restitue naturellement la force, tandis que « se réjouir » conserve le sens affectif et le parallélisme du grec.
- source_word: μετὰ
  choice: avec
  rationale: Avec le génitif, μετά exprime ici l’association ou l’accompagnement. « Avec » est l’équivalent français naturel et précis.
- source_word: χαιρόντων
  choice: ceux qui se réjouissent
  rationale: Le participe présent actif au génitif pluriel est substantivé après μετά. Cette formulation idiomatique conserve le sens générique et l’aspect verbal.
- source_word: κλαίειν
  choice: pleurez
  rationale: Comme χαίρειν, cet infinitif a une valeur exhortative. « Pleurer » rend directement κλαίω et forme en français un parallèle clair avec « se réjouir ».
- source_word: κλαιόντων
  choice: ceux qui pleurent
  rationale: Le participe présent actif substantivé désigne les personnes en train de pleurer ou caractérisées ici par leurs pleurs. La formulation maintient le parallélisme du texte grec.
theological_decisions:
- issue: Valeur impérative des infinitifs dans une série d’exhortations
  choice: 'Rendre les deux infinitifs par des impératifs : « Réjouissez-vous… ; pleurez… »'
  alternative: « Se réjouir avec ceux qui se réjouissent ; pleurer avec ceux qui pleurent. »
  rationale: Bien que le grec emploie des infinitifs, le contexte parénétique de Romains 12.9-21 leur donne une force exhortative. Les impératifs transmettent cette fonction en français naturel sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme très concis de l’original est conservé, sans note nécessaire puisque la traduction directe ne masque aucune ambiguïté substantielle.
