id: ROM.12.18
reference: Romans 12:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δυνατόν, τὸ ἐξ ὑμῶν μετὰ πάντων ἀνθρώπων εἰρηνεύοντες·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: fr
  text: S'il est possible[a], dans la mesure où cela dépend de vous, vivez en paix avec tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si cela est possible, pour ce qui dépend de vous, soyez en paix avec tous. »'
    reason: Variante de traduction qui rend plus littéralement la construction grecque tout en conservant sa qualification.
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: Si possible
  rationale: Cette formulation idiomatique conserve la condition réaliste exprimée par le grec sans transformer l’exhortation en commandement absolu.
- source_word: τὸ ἐξ ὑμῶν
  choice: autant que cela dépend de vous
  rationale: Cette expression naturelle indique la part de responsabilité qui relève effectivement des destinataires, tout en maintenant la limite posée par Paul.
- source_word: μετὰ πάντων ἀνθρώπων
  choice: avec tous
  rationale: Dans ce contexte, ἀνθρώπων désigne les êtres humains sans distinction de sexe. « Avec tous » rend clairement la portée universelle de l’expression en français courant.
- source_word: εἰρηνεύοντες
  choice: vivez en paix
  rationale: Le participe présent a ici une valeur exhortative dans la suite du passage. « Vivez en paix » exprime une conduite durable plutôt qu’un état ponctuel.
theological_decisions:
- issue: Portée et limite de l’exhortation
  choice: L’exhortation appelle à rechercher la paix avec tous, tout en limitant explicitement la responsabilité des croyants à ce qui dépend réellement d’eux.
  alternative: Comprendre que la paix doit toujours être obtenue dès lors que les croyants agissent correctement, ou lire l’appel comme un commandement sans réserve.
  rationale: Les deux expressions εἰ δυνατόν et τὸ ἐξ ὑμῶν maintiennent ensemble l’étendue universelle de l’appel et la possibilité que la paix ne puisse pas être obtenue malgré les efforts des destinataires.
translation_notes:
  register: Français international moderne, simple et digne. L’impératif « vivez » communique le caractère continu de l’exhortation, tandis que les deux propositions initiales en préservent les nuances et la tension.
