id: ROM.12.3
reference: Romans 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: fr
  text: En effet, par la grâce qui m’a été donnée, je dis à chacun de vous de ne pas avoir de lui-même une opinion plus haute qu’il ne le faut, mais de se faire une juste opinion de lui-même, selon ce que Dieu a attribué à chacun comme mesure de foi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mais de penser de manière raisonnable » ; littéralement, l’expression peut aussi évoquer le fait de penser de façon à garder un jugement sobre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: par la grâce qui m’a été donnée
  rationale: διά avec le génitif exprime ici le moyen ou le fondement de la parole de Paul; cette formulation naturelle conserve le lien avec la grâce reçue.
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: à chacun de vous
  rationale: Rend de façon idiomatique et distributive chaque personne au sein de la communauté.
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: de ne pas avoir de lui-même une opinion plus haute qu’il ne le faut
  rationale: Conserve l’idée d’une estime excessive et le contraste fondé sur les verbes de pensée, tout en étant naturel en français.
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: mais de se faire une juste opinion de lui-même
  rationale: σωφρονεῖν évoque un jugement sensé, mesuré et lucide. Cette formulation maintient le jeu sémantique sur l’évaluation de soi sans réduire le terme à la seule sobriété.
- source_word: ἐμέρισεν
  choice: a accordée
  rationale: Dans ce contexte distributif, « accorder » exprime naturellement la part attribuée par Dieu, même si « répartir » serait plus formellement concordant.
- source_word: μέτρον πίστεως
  choice: la mesure de foi
  rationale: Le français emploie naturellement l’article défini après « selon » pour une mesure attribuée à chacun. La formulation laisse ouverte la nuance exacte du génitif πίστεως.
theological_decisions:
- issue: Sens de μέτρον πίστεως
  choice: la mesure de foi
  alternative: une mesure de foi; la mesure de confiance ou de fidélité
  rationale: Le contexte des dons peut suggérer une capacité ou une sphère de service attribuée par Dieu, mais le grec ne tranche pas entre ces nuances. Le texte principal conserve donc l’expression ouverte et la note signale les principales possibilités.
- issue: Portée de σωφρονεῖν
  choice: se faire une juste opinion de lui-même
  alternative: penser de manière raisonnable; penser de façon à garder un jugement sobre
  rationale: Le choix principal rend le contraste immédiat avec la surestimation de soi; la note préserve la portée plus générale de lucidité et de maîtrise du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition grecque autour de φρονεῖν est rendue par le vocabulaire de l’opinion et du jugement. Le masculin singulier a valeur générique dans « lui-même », en correspondance avec la construction distributive « chacun ».
