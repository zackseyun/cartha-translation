  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: fr
  text: Ayez les uns envers les autres une même attitude. Ne visez pas ce qui est élevé[a], mais associez-vous aux humbles[b]. Ne devenez pas sages à vos propres yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne recherchez pas les grandeurs » ou « Ne soyez pas orgueilleux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « laissez-vous entraîner vers ce qui est humble » ; le grec peut désigner soit des personnes humbles ou de condition modeste, soit des choses ou des réalités modestes.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: Ayez une même attitude les uns envers les autres
  rationale: L’expression appelle à une disposition commune et à l’harmonie mutuelle, plutôt qu’à une stricte identité d’opinions. « Attitude » rend naturellement la portée de φρονεῖν dans ce contexte relationnel.
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: Ne portez pas vos pensées vers ce qui est élevé
  rationale: Cette formulation conserve l’image grecque et laisse ouverte la référence à l’orgueil, aux ambitions élevées ou à ce qui jouit d’un statut supérieur.
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: associez-vous aux humbles
  rationale: Dans ce contexte communautaire, συναπαγόμενοι exprime le fait de se joindre à d’autres sans rechercher un statut supérieur. « Aux humbles » retient la lecture personnelle la plus naturelle, tout en signalant en note l’ambiguïté grammaticale de τοῖς ταπεινοῖς.
- source_word: μὴ γίνεσθε
  choice: Ne devenez pas
  rationale: Le verbe γίνομαι présente ici l’acquisition d’une attitude; « devenez » conserve cette valeur de processus plutôt que de la réduire à un simple état.
- source_word: φρόνιμοι παρ’ ἑαυτοῖς
  choice: sages à vos propres yeux
  rationale: Cette expression française idiomatique rend le jugement favorable que l’on porte sur sa propre sagesse et préserve l’image du texte grec.
theological_decisions:
- issue: Portée de τὰ ὑψηλά et identification de τοῖς ταπεινοῖς
  choice: Le texte principal oppose l’orientation vers ce qui est élevé à la solidarité avec les personnes humbles ou de condition modeste.
  alternative: L’exhortation peut aussi viser les ambitions orgueilleuses et inviter à accepter des tâches ou des réalités modestes.
  rationale: Le grec permet à la fois une lecture sociale et une lecture portant sur les aspirations ou les attitudes. La traduction principale reste large pour τὰ ὑψηλά et la note conserve l’ambiguïté de τοῖς ταπεινοῖς.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve le parallélisme de l’exhortation, évite un vocabulaire confessionnel et explicite en note les ambiguïtés réelles du grec.
