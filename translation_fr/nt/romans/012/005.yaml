id: ROM.12.5
reference: Romans 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: fr
  text: Ainsi, nous qui sommes nombreux, nous sommes un seul corps dans le Messie[a] et, individuellement, membres les uns des autres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en Christ ». Le titre grec Χριστός peut être rendu par « Messie » ou par « Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Introduit naturellement en français l’application de la comparaison du corps développée au verset précédent, tout en gardant sa force comparative et déductive.
- source_word: οἱ πολλοὶ
  choice: nous qui sommes nombreux
  rationale: Le contexte rend explicite la référence inclusive à Paul et aux croyants. Cette formulation française conserve l’idée de pluralité sans ajouter une opposition absente du grec.
- source_word: ἓν σῶμά
  choice: un seul corps
  rationale: Préserve directement la métaphore corporelle et souligne l’unité exprimée par ἓν.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Rend la préposition ἐν sans expliciter davantage la nature de la relation, et traduit Χριστός comme un titre tout en conservant en note la formulation française traditionnelle.
- source_word: τὸ δὲ καθ’ εἷς
  choice: et, individuellement
  rationale: Exprime de manière concise et naturelle la valeur distributive de l’expression grecque, qui envisage chaque personne séparément.
- source_word: ἀλλήλων
  choice: les uns des autres
  rationale: Rend la réciprocité du pronom grec dans une expression française idiomatique.
- source_word: μέλη
  choice: membres
  rationale: Conserve à la fois l’image des parties du corps et son application à la communauté.
theological_decisions:
- issue: Traduction de Χριστῷ dans ἐν Χριστῷ
  choice: dans le Messie
  alternative: en Christ
  rationale: Χριστός demeure ici un titre messianique. « Dans le Messie » en préserve le sens titulaire et ne réduit pas l’expression paulinienne à une simple appartenance; la formulation traditionnelle « en Christ » est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en évitant une tournure artificielle; « individuellement » maintient le contraste entre l’unité du corps et la relation réciproque de chaque membre.
