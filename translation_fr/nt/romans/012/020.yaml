id: ROM.12.20
reference: Romans 12:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: fr
  text: Mais si ton ennemi a faim, donne-lui à manger ; s’il a soif, donne-lui à boire. En agissant ainsi, en effet, tu amasseras des charbons ardents sur sa tête.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « des charbons de feu ». L’image peut évoquer la honte qui conduit à la repentance, une douloureuse prise de conscience morale ou le jugement à venir ; la métaphore grecque est conservée dans le texte.'
    reason: Alternative lexicale et ambiguïté interprétative de la métaphore.
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: Mais si
  rationale: « Mais » conserve le contraste avec l’interdiction de se venger au verset précédent, tandis que « si » rend naturellement la condition introduite par ἐάν.
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: ton ennemi a faim
  rationale: Cette formulation idiomatique conserve le singulier et l’adresse directe au « tu ».
- source_word: ψώμιζε αὐτόν
  choice: donne-lui à manger
  rationale: L’impératif ψώμιζε demande concrètement de fournir de la nourriture ; cette tournure est plus naturelle en français actuel que « nourris-le » dans ce contexte.
- source_word: ἐὰν διψᾷ, πότιζε αὐτόν
  choice: s’il a soif, donne-lui à boire
  rationale: La formulation rend clairement la seconde condition et l’ordre de fournir à boire, sans préciser une boisson que le grec ne nomme pas.
- source_word: τοῦτο γὰρ ποιῶν
  choice: En agissant ainsi, en effet
  rationale: Le participe exprime le moyen ou la circonstance, et γάρ introduit l’explication. La formulation française préserve ces deux rapports sans lourdeur excessive.
- source_word: ἄνθρακας πυρὸς
  choice: des charbons ardents
  rationale: L’expression signifie littéralement « des charbons de feu ». « Charbons ardents » est une expression française claire qui conserve intacte l’image concrète.
- source_word: σωρεύσεις
  choice: tu amasseras
  rationale: Le futur est conservé, et « amasser » rend l’idée d’accumuler en tas sans atténuer la métaphore.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: sur sa tête
  rationale: Traduction directe et naturelle de la préposition et du groupe nominal, maintenant l’image du texte grec.
theological_decisions:
- issue: Sens de la métaphore des charbons ardents amassés sur la tête
  choice: Conserver la métaphore sans l’interpréter dans le texte principal.
  alternative: L’expliciter comme la honte conduisant à la repentance, une douloureuse prise de conscience morale, ou le jugement à venir.
  rationale: La portée précise de l’image est discutée. Le grec ne tranche pas explicitement entre ces interprétations ; la traduction maintient donc l’ambiguïté et la tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement conserve le singulier de l’adresse grecque. Les impératifs sont rendus par des tournures courantes et concrètes. Le marqueur de note est placé après la métaphore qu’il explique.
