  text: εὐλογεῖτε τοὺς ⸀διώκοντας, εὐλογεῖτε καὶ μὴ καταρᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: fr
  text: Bénissez ceux qui vous persécutent[a] ; bénissez et ne maudissez pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui vous poursuivent ». Le verbe grec peut signifier « poursuivre », mais il désigne probablement ici une persécution hostile.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Bénissez
  rationale: L’impératif présent pluriel de εὐλογέω appelle à bénir, c’est-à-dire à vouloir et à exprimer le bien pour autrui. « Bénissez » est naturel, concis, et sa répétition conserve l’insistance de Paul.
- source_word: τοὺς διώκοντας
  choice: ceux qui vous persécutent
  rationale: Le participe substantivé désigne littéralement « ceux qui poursuivent ». Dans ce contexte d’hostilité subie, διώκω prend très probablement le sens de « persécuter ». Le complément « vous », implicite en grec, est nécessaire à la clarté idiomatique en français.
- source_word: καὶ
  choice: et
  rationale: La conjonction relie simplement la répétition du commandement positif à l’interdiction qui le précise par contraste.
- source_word: μὴ καταρᾶσθε
  choice: ne maudissez pas
  rationale: L’impératif avec μή exprime une interdiction. « Ne maudissez pas » rend directement καταράομαι et maintient le contraste lexical et moral avec « bénissez ».
theological_decisions:
- issue: Portée de διώκω dans le contexte
  choice: Compris comme une persécution hostile
  alternative: ceux qui vous poursuivent
  rationale: Bien que διώκω puisse signifier plus largement « poursuivre », son emploi dans les exhortations chrétiennes anciennes ainsi que l’opposition entre bénir et maudire favorisent ici le sens de « persécuter ». La note conserve néanmoins l’alternative lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « bénissez » et la coordination simple sont conservées pour respecter l’insistance et la structure du grec.
