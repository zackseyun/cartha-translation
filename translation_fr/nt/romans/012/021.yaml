id: ROM.12.21
reference: Romans 12:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: fr
  text: Ne te laisse pas vaincre par le mal[a], mais vaincs le mal par le bien.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne te laisse pas vaincre par ce qui est mal, mais vaincs ce qui est mal par ce qui est bien. » Le grec emploie des adjectifs neutres substantivés, qui peuvent désigner « le mal » et « le bien » ou « ce qui est mal » et « ce qui est bien ».'
    reason: Alternative lexicale préservant l’ambiguïté des adjectifs neutres substantivés.
lexical_decisions:
- source_word: μὴ νικῶ
  choice: Ne te laisse pas vaincre
  rationale: Le présent impératif passif avec μή exprime une défense adressée à une seule personne. Cette tournure française restitue naturellement le passif et l’idée de défaite portée par νικάω.
- source_word: ὑπὸ τοῦ κακοῦ
  choice: par le mal
  rationale: Ὑπό avec le génitif indique ici l’agent. Le neutre substantivé peut désigner abstraitement « le mal » ou, plus explicitement, « ce qui est mal ».
- source_word: ἀλλὰ νίκα
  choice: mais sois vainqueur
  rationale: Ἀλλά marque une opposition forte, et νίκα est un impératif présent actif. « Sois vainqueur » conserve l’image de victoire tout en distinguant clairement l’action demandée de la forme passive de la première proposition.
- source_word: ἐν τῷ ἀγαθῷ
  choice: par le bien
  rationale: 'Ἐν avec le datif a ici une valeur instrumentale : le bien est le moyen par lequel le mal doit être vaincu.'
- source_word: τὸ κακόν
  choice: du mal
  rationale: Le neutre substantivé est rendu comme une catégorie morale générale. Sa répétition maintient l’antithèse concise entre le mal et le bien.
theological_decisions:
- issue: Faut-il personnaliser κακός et ἀγαθός ou les comprendre comme des catégories morales ?
  choice: Les rendre par « le mal » et « le bien » comme catégories morales.
  alternative: Employer « ce qui est mal » et « ce qui est bien », ou comprendre « le mal » comme une puissance personnifiée.
  rationale: Les adjectifs neutres substantivés permettent une valeur abstraite ou qualitative, et rien dans la syntaxe n’impose un référent personnel tel que le diable. Le contexte porte sur la réponse éthique au tort subi.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète les impératifs grecs à la deuxième personne du singulier. La formulation conserve le parallélisme et le vocabulaire de victoire du texte source.
