source:
  edition: SBLGNT
  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: fr
  text: Réjouissez-vous dans l’espérance, tenez bon dans la détresse[a], persévérez dans la prière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’affliction » ou « dans la tribulation » ; le terme grec évoque une forte pression, l’épreuve ou la détresse.
    reason: lexical_alternative
  - marker: b
    text: Ou « consacrez-vous assidûment à la prière » ; le verbe grec souligne une persévérance fidèle et soutenue.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίδι
  choice: dans l’espérance
  rationale: Le datif articulé exprime ici le domaine ou le fondement de la joie. « Dans l’espérance » est idiomatique, concis et conserve la formulation paulinienne sans préciser indûment l’objet de l’espérance.
- source_word: χαίροντες
  choice: Réjouissez-vous
  rationale: Le participe présent a ici une valeur exhortative au sein d’une série parénétique. L’impératif français rend naturellement cette force et l’aspect continu est porté par l’ensemble de l’exhortation.
- source_word: θλίψει
  choice: dans la détresse
  rationale: θλῖψις évoque la pression, l’épreuve et l’affliction. « Détresse » est actuel, intelligible et suffisamment fort, sans la coloration parfois technique ou ancienne de « tribulation ».
- source_word: ὑπομένοντες
  choice: tenez bon
  rationale: ὑπομένω désigne le fait de demeurer ferme sous l’épreuve. « Tenez bon » exprime cette endurance active dans un français naturel et direct.
- source_word: προσευχῇ
  choice: dans la prière
  rationale: Le nom désigne ici la prière de manière générale. L’article grec n’exige pas l’article défini en français dans cette tournure.
- source_word: προσκαρτεροῦντες
  choice: persévérez
  rationale: προσκαρτερέω exprime une continuité assidue et résolue. « Persévérez » conserve cette idée tout en maintenant la brièveté et le parallélisme des trois exhortations.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. Les trois participes grecs à valeur exhortative sont rendus par trois impératifs parallèles. « Tenez bon » apporte une vivacité naturelle sans affaiblir l’idée d’endurance ferme.
