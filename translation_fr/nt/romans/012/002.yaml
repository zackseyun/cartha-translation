  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: fr
  text: 'Ne vous conformez pas à l’époque présente[a], mais soyez transformés par le renouvellement de votre manière de penser, afin que vous discerniez[b] quelle est la volonté de Dieu : ce qui est bon, agréable[c] et parfait.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au monde présent ». Le grec aiōn signifie plus précisément « ère » ou « époque » et renvoie ici à l’ordre présent.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que vous éprouviez et reconnaissiez quelle est la volonté de Dieu ». Le verbe grec peut désigner à la fois l’examen et la reconnaissance de ce qui est approuvé.'
    reason: lexical_alternative
  - marker: c
    text: « Agréable » peut signifier « agréable à Dieu » ; on peut aussi traduire par « acceptable ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: vous conformez
  rationale: Le verbe évoque le fait de prendre pour modèle une forme ou un schéma extérieur. « Vous conformez » préserve son contraste avec la transformation profonde exprimée par μεταμορφοῦσθε.
- source_word: αἰῶνι τούτῳ
  choice: à l’époque présente
  rationale: αἰών désigne ici l’ère ou l’ordre présent plutôt que le monde créé. « Époque présente » est plus naturel en français moderne que « siècle présent », devenu ambigu ou archaïque.
- source_word: μεταμορφοῦσθε
  choice: soyez transformés
  rationale: Le passif rend l’idée d’un changement profond de forme ou d’état et conserve le contraste avec « vous conformez ».
- source_word: τῇ ἀνακαινώσει
  choice: par le renouvellement
  rationale: 'Le datif est compris comme instrumental : la transformation s’opère par un renouvellement. Le nom français garde le caractère progressif du processus.'
- source_word: τοῦ νοός
  choice: de votre manière de penser
  rationale: νοῦς désigne ici la faculté de comprendre, d’évaluer et de discerner. « Manière de penser » est clair en français courant et évite de réduire le sens à l’intelligence intellectuelle.
- source_word: εἰς τὸ δοκιμάζειν
  choice: afin que vous discerniez
  rationale: La construction exprime le but ou le résultat. δοκιμάζω comprend l’examen menant à la reconnaissance de ce qui est approuvé ; « discerner » en communique naturellement l’aboutissement sans exclure l’idée d’évaluation.
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: quelle est la volonté de Dieu
  rationale: Cette formulation conserve l’interrogatif τί et le génitif explicite tout en étant idiomatique en français.
- source_word: τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον
  choice: ce qui est bon, agréable et parfait
  rationale: La formulation rend l’apposition grecque et ses trois adjectifs neutres sans répéter artificiellement « volonté », tout en gardant leur portée sur ce que Dieu veut.
theological_decisions:
- issue: Valeur éthique et temporelle de αἰών
  choice: l’époque présente
  alternative: le monde présent ; l’ordre présent
  rationale: Ce choix évite de faire du monde créé lui-même l’objet du contraste. Il maintient le cadre temporel et éthique de Paul, tout en signalant en note l’alternative traditionnelle.
- issue: Portée de δοκιμάζειν à l’égard de la volonté de Dieu
  choice: discerner
  alternative: examiner ; éprouver et reconnaître comme bonne
  rationale: Le texte ne présente pas les humains comme juges de la volonté divine. Leur pensée renouvelée les rend capables de l’évaluer pour la reconnaître et l’approuver ; « discerner » garde cette portée sans la surdéterminer.
- issue: Référent de εὐάρεστον
  choice: agréable
  alternative: agréable à Dieu ; acceptable
  rationale: Le grec ne précise pas expressément à qui cette volonté est agréable. Le texte principal conserve cette ouverture, tandis que la note indique l’interprétation contextuelle probable.
translation_notes:
  register: Français international moderne, naturel et digne. « Époque présente » évite l’archaïsme de « siècle présent » ; « manière de penser » rend νοῦς de façon accessible sans suggérer seulement les capacités intellectuelles. Les impératifs au pluriel et la structure antithétique du grec sont conservés.
