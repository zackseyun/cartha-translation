id: ROM.12.6
reference: Romans 12:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: fr
  text: 'Nous avons des dons différents selon la grâce qui nous a été accordée : si c’est la prophétie, qu’elle s’exerce en proportion de la foi[a] ;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « en proportion de sa foi » ; autre possibilité : « en accord avec la foi ». L’expression grecque peut désigner soit la mesure de foi accordée à la personne qui prophétise, soit la conformité du message au contenu de la foi chrétienne.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: Puisque nous avons
  rationale: Le participe présent reprend le fil de l’exhortation. En français, une proposition causale rend naturellement le lien syntaxique implicite, tandis que δέ marque ici une transition légère qu’il n’est pas nécessaire de traduire séparément.
- source_word: χαρίσματα ... διάφορα
  choice: des dons différents
  rationale: « Dons » est le terme paulinien courant et clair pour χαρίσματα ; l’adjectif « différents » restitue directement διάφορα.
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: selon la grâce qui nous a été accordée
  rationale: « Selon » exprime la correspondance indiquée par κατά. « Accordée » convient idiomatiquement à la grâce reçue sans affaiblir l’idée de don.
- source_word: εἴτε προφητείαν
  choice: si c’est la prophétie
  rationale: La tournure française explicite sobrement la construction elliptique qui introduit le premier élément d’une série.
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: qu’elle s’exerce en proportion de la foi
  rationale: Le verbe ajouté rend en français l’exhortation sous-entendue sans préciser la nature de l’exercice prophétique. « En proportion de la foi » conserve la formulation concise et l’ambiguïté du grec.
theological_decisions:
- issue: Sens de κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: en proportion de la foi
  alternative: en proportion de sa foi ; en accord avec la foi
  rationale: Le grec peut viser la mesure de foi de la personne qui prophétise ou la conformité du message au contenu de la foi chrétienne. Le texte principal reste volontairement large, et la note conserve les deux interprétations majeures.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe elliptique est légèrement explicitée pour être intelligible, sans résoudre l’ambiguïté théologique de la dernière expression.
