  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: fr
  text: 'Ne vous vengez pas vous-mêmes, bien-aimés, mais laissez place à la colère[a], car il est écrit : « C’est à moi qu’appartient la vengeance ; c’est moi qui rétribuerai[b], dit le Seigneur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « donnez place à la colère ». Dans ce contexte, il s’agit probablement de la colère de Dieu, comme l’indique la citation qui suit.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « moi, je rendrai en retour ».'
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: Ne vous vengez pas vous-mêmes
  rationale: Le participe présent avec μή a ici une valeur impérative. Cette formulation naturelle conserve la force réfléchie de ἑαυτούς et le sens de vengeance exprimé par ἐκδικέω.
- source_word: ἀγαπητοί
  choice: bien-aimés
  rationale: Le vocatif affectueux est conservé dans un registre biblique digne et encore compréhensible en français moderne.
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: mais laissez place à la colère
  rationale: « Laisser place à » rend naturellement l’expression idiomatique δότε τόπον tout en conservant « la colère » sans en préciser explicitement le détenteur, comme le grec.
- source_word: γέγραπται γάρ
  choice: car il est écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture, correspondant au parfait passif grec.
- source_word: Ἐμοὶ ἐκδίκησις
  choice: C’est à moi qu’appartient la vengeance
  rationale: La construction française explicite la possession exprimée par le datif ἐμοί, tout en gardant l’accent mis sur Dieu par la position emphatique du pronom.
- source_word: ἐγὼ ἀνταποδώσω
  choice: c’est moi qui rendrai à chacun ce qui lui revient
  rationale: Cette formulation rend la valeur de rétribution de ἀνταποδίδωμι et l’emphase du pronom ἐγώ dans un français actuel. Le complément « à chacun ce qui lui revient » explicite le sens idiomatique sans déterminer si la rétribution est favorable ou défavorable.
- source_word: λέγει κύριος
  choice: dit le Seigneur
  rationale: « Le Seigneur » est l’équivalent français habituel de κύριος dans cette formule scripturaire.
theological_decisions:
- issue: Référent de « la colère » dans τῇ ὀργῇ
  choice: Conserver « la colère » sans ajouter « de Dieu » dans le texte principal.
  alternative: Traduire explicitement « laissez agir la colère de Dieu ».
  rationale: La citation qui suit indique fortement qu’il s’agit de la colère et du jugement de Dieu. Toutefois, le grec ne dit pas explicitement « de Dieu » ; la formulation retenue préserve donc cette concision et cette légère ambiguïté.
- issue: Nature de la rétribution dans ἐγὼ ἀνταποδώσω
  choice: 'Employer une formulation générale de juste rétribution : « je rendrai à chacun ce qui lui revient ».'
  alternative: 'Traduire plus littéralement et traditionnellement : « je rétribuerai » ou « je rendrai ».'
  rationale: Le contexte concerne la prérogative divine de juger, mais le verbe exprime fondamentalement le fait de rendre en retour. La traduction évite d’ajouter une description doctrinale plus précise du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. « Bien-aimés » maintient la chaleur du vocatif apostolique. La ponctuation française est utilisée, et la citation conserve un ton scripturaire sans archaïsme excessif.
