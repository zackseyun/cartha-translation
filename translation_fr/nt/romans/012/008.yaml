  naturalness: Le français est globalement naturel et de registre moderne et digne. La répétition de « le fasse » dans les trois derniers membres rend explicitement et fluidement l’ellipse grecque. « Avec joie » convient à ἐν ἱλαρότητι dans ce contexte.
  terminology: « Encouragement », « partage », « générosité », « dirige », « zèle » et « fait preuve de compassion » sont appropriés. « Celui qui dirige » préserve utilement la portée générale de προϊστάμενος sans en faire un titre ecclésial. Les notes lexicales conservent les principales alternatives sans imposer d’interprétation confessionnelle.
