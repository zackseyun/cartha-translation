id: ROM.12.8
reference: Romans 12:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: fr
  text: si c’est l’encouragement[a], qu’il encourage ; que celui qui partage le fasse avec générosité[b] ; que celui qui dirige le fasse avec zèle[c] ; que celui qui fait preuve de compassion le fasse avec joie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’exhortation ». Les mots grecs apparentés peuvent désigner aussi bien l’encouragement que l’exhortation pressante.
    reason: lexical_alternative
  - marker: b
    text: Ou « avec simplicité » ou « avec sincérité ». Le terme grec peut exprimer une disposition sans duplicité aussi bien que la générosité.
    reason: lexical_alternative
  - marker: c
    text: Ou « avec empressement » ou « avec application ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει
  choice: si c’est le don d’encourager, qu’il serve à encourager
  rationale: La formulation grecque poursuit de manière elliptique l’énumération du verset précédent. Le français explicite sobrement « le don » à partir du contexte et conserve la répétition de la même famille de sens dans παρακαλῶν / παρακλήσει.
- source_word: ὁ μεταδιδοὺς
  choice: celui qui partage
  rationale: Le verbe désigne le fait de donner une part de ce que l’on possède. « Partage » garde cette nuance participative sans réduire l’action à une forme précise de contribution.
- source_word: ἐν ἁπλότητι
  choice: avec générosité
  rationale: Après l’idée de partager, le sens de libéralité ou de générosité convient le mieux, tout en laissant en note les nuances possibles de simplicité et de sincérité.
- source_word: ὁ προϊστάμενος
  choice: celui qui dirige
  rationale: « Dirige » exprime la conduite ou la responsabilité sans transformer ce participe général en titre ecclésiastique technique.
- source_word: ἐν σπουδῇ
  choice: avec zèle
  rationale: σπουδή évoque l’empressement, l’application et le sérieux. « Avec zèle » est bref, naturel et convient à l’exercice d’une responsabilité.
- source_word: ὁ ἐλεῶν
  choice: celui qui fait preuve de compassion
  rationale: Cette expression rend l’action concrète d’exercer la miséricorde dans un français courant et digne.
- source_word: ἐν ἱλαρότητι
  choice: avec joie
  rationale: ἱλαρότης désigne une disposition joyeuse et volontaire. « Avec joie » est plus naturel en français contemporain que « avec gaieté » dans le contexte d’une action compatissante.
theological_decisions:
- issue: Portée de ὁ προϊστάμενος
  choice: celui qui dirige
  alternative: celui qui préside, gouverne ou administre
  rationale: Le texte parle largement de dons exercés dans la communauté sans nommer ici une fonction officielle précise. La traduction évite donc d’imposer une organisation ecclésiale particulière.
- issue: Sens de ἁπλότης dans le partage
  choice: avec générosité
  alternative: avec simplicité ou avec sincérité
  rationale: Le lien immédiat avec le partage favorise le sens de générosité, mais la note préserve l’étendue sémantique du terme grec.
- issue: Explicitation de l’ellipse
  choice: ajout contextuel de « le don »
  alternative: 'traduction fragmentaire et plus littérale : « celui qui encourage, dans l’encouragement »'
  rationale: 'L’ajout ne définit pas la nature du don : il reprend seulement le cadre explicite de Romains 12.6 et permet à la phrase de rester intelligible en français moderne.'
translation_notes:
  register: Français international moderne, fluide et digne. La ponctuation maintient le rythme serré de l’énumération grecque. L’explicitation « le don » dépend du contexte immédiat et évite une tournure française obscure, tandis que les notes conservent les principales ambiguïtés lexicales.
