id: ROM.12.11
reference: Romans 12:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: fr
  text: Ne vous relâchez pas dans votre zèle ; ayez l’esprit fervent[a] ; servez le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « soyez fervents dans l’Esprit », si πνεύματι désigne l’Esprit Saint plutôt que l’esprit humain.
    reason: alternative_reading
lexical_decisions:
- source_word: σπουδῇ
  choice: zèle
  rationale: Le nom désigne ici l’empressement et l’ardeur dans l’action. « Zèle » s’oppose naturellement à ὀκνηροί et évite une tournure peu idiomatique avec « diligence ».
- source_word: ὀκνηροί
  choice: ne manquez pas
  rationale: L’adjectif exprime la lenteur, la nonchalance ou le manque d’empressement. Avec « de zèle », cette formulation française naturelle rend l’opposition sans introduire l’idée plus générale d’une paresse caractérisée.
- source_word: πνεύματι
  choice: d’esprit
  rationale: La formulation conserve en français la référence la plus probable à l’esprit ou à la disposition intérieure du croyant, sans ajouter un possessif absent du grec. La possible référence à l’Esprit Saint est signalée en note.
- source_word: ζέοντες
  choice: soyez fervents
  rationale: Le participe signifie littéralement « bouillants » et évoque métaphoriquement une vive ardeur. « Fervents » en garde la force dans un registre digne et naturel.
- source_word: κυρίῳ
  choice: le Seigneur
  rationale: Ce titre rend naturellement κύριος dans le contexte paulinien et laisse intacte sa portée théologique.
- source_word: δουλεύοντες
  choice: servez
  rationale: Même si le verbe appartient au vocabulaire de l’esclavage, « servez » exprime ici de manière idiomatique la consécration et l’obéissance demandées envers le Seigneur.
theological_decisions:
- issue: Référent de πνεύματι dans τῷ πνεύματι ζέοντες
  choice: l’esprit humain ou la disposition intérieure
  alternative: l’Esprit Saint
  rationale: L’absence d’article et la série d’exhortations favorisent la lecture relative à l’ardeur intérieure du croyant, mais le grec ne tranche pas explicitement. La note préserve donc l’autre lecture sans résoudre la tension.
translation_notes:
  register: Français international moderne, concis et digne. Les trois exhortations parallèles sont séparées par des points-virgules afin de conserver le rythme du grec.
