review_pass:
  verdict: revise
  source_fidelity: La structure ternaire et les principaux termes sont bien rendus. Toutefois, « ne manquez pas de zèle » exprime surtout une absence de zèle, là où μὴ ὀκνηροί avec τῇ σπουδῇ exhorte à ne pas se relâcher dans l’empressement. « Fervents d’esprit » est également une collocation moins nette en français moderne et peut évoquer la vivacité intellectuelle plutôt que l’ardeur intérieure.
  naturalness: La révision conserve un français international concis, avec un parallélisme clair. « Ne vous relâchez pas dans votre zèle » et « ayez l’esprit fervent » sont plus idiomatiques et précis dans ce contexte exhortatif.
  terminology: « Zèle », « esprit », « Seigneur » et « servez » sont appropriés. La note doit formuler l’alternative pneumatologique comme une lecture « dans l’Esprit » plutôt que « par l’Esprit », car le datif grec ne prescrit pas l’instrumentalité.
  issues:
  - severity: medium
    issue: Nuance de μὴ ὀκνηροί atténuée
    rationale: « Ne manquez pas de zèle » peut signifier simplement ne pas être dépourvu de zèle. « Ne vous relâchez pas dans votre zèle » préserve mieux l’appel à ne pas être indolent ou négligent dans l’empressement.
  - severity: medium
    issue: « Fervents d’esprit » est ambigu et peu naturel
    rationale: Cette formulation peut être comprise comme « spirituellement fervents », voire comme une qualité intellectuelle. « Ayez l’esprit fervent » rend plus clairement l’ardeur de la disposition intérieure.
  - severity: low
    issue: La note traduit l’alternative par une instrumentalité trop définie
    rationale: « Par l’Esprit » impose une valeur instrumentale à τῷ πνεύματι. « Dans l’Esprit » laisse davantage ouverte la valeur du datif et correspond à la lecture alternative traditionnelle.
  revised_text: Ne vous relâchez pas dans votre zèle ; ayez l’esprit fervent[a] ; servez le Seigneur.
  revised_footnotes:
