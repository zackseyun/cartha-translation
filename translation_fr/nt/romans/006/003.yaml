id: ROM.6.3
reference: Romans 6:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: fr
  text: Ou bien ne savez-vous pas que nous tous qui avons été baptisés en Jésus le Messie avons été baptisés en sa mort ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Christ Jésus ». Grec : Christos Iēsous.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Conserve la transition argumentative et la légère réprimande qui relient la question au raisonnement précédent.
- source_word: ἀγνοεῖτε
  choice: ignorez-vous
  rationale: Rend naturellement en français la question rhétorique au présent et l’appel de Paul à un savoir partagé.
- source_word: ὅσοι
  choice: nous tous qui
  rationale: Exprime la portée inclusive de la tournure grecque avec le verbe à la première personne du pluriel.
- source_word: ἐβαπτίσθημεν
  choice: avons été baptisés
  rationale: Rend directement l’aoriste passif comme un événement accompli, sans ajouter d’explication confessionnelle sur le baptême.
- source_word: εἰς
  choice: en
  rationale: Dans la construction française « baptiser en », ce choix reste concis et conserve l’idée d’entrée ou d’incorporation sans préciser son mécanisme théologique.
- source_word: Χριστὸν Ἰησοῦν
  choice: Jésus le Messie
  rationale: Présente Χριστός comme un titre tout en employant un ordre naturel en français moderne.
- source_word: θάνατον
  choice: mort
  rationale: Équivalent direct et suffisant de θάνατος.
- source_word: αὐτοῦ
  choice: sa
  rationale: Rend naturellement le génitif possessif et renvoie sans ambiguïté à Jésus le Messie.
theological_decisions:
- issue: 'La portée de εἰς dans le langage du baptême : efficacité sacramentelle, identification symbolique ou union avec le Messie.'
  choice: Les deux occurrences sont rendues par « en » dans la construction « être baptisé en ».
  alternative: « pour être unis à » ; « en union avec » ; « dans »
  rationale: « En » préserve en français l’idée relationnelle et incorporative du grec sans trancher entre les différentes explications théologiques du baptême.
- issue: Le statut de Χριστός comme titre ou comme désignation devenue quasi nominale.
  choice: « Jésus le Messie »
  alternative: « Christ Jésus »
  rationale: Le texte principal explicite le sens titulaire de Χριστός dans un français naturel, tandis que la note conserve la formulation ecclésiale traditionnelle comme possibilité lexicale.
translation_notes:
  register: Français international moderne, clair et digne. La reprise exacte de « avons été baptisés » et de la préposition « en » maintient le parallélisme rhétorique du grec. « Ou bien ignorez-vous » conserve le ton interrogatif et légèrement réprobateur de Paul.
