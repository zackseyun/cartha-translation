id: ROM.6.19
reference: Romans 6:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: fr
  text: Je parle en termes humains à cause de la faiblesse de votre chair[a]. De même que vous avez livré les membres de votre corps comme esclaves à l’impureté et à la transgression de la loi, ce qui mène à la transgression de la loi, de même, maintenant, livrez les membres de votre corps comme esclaves à la justice[b], en vue de la sainteté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Chair » peut aussi être compris ici, de manière plus interprétative, comme « nature pécheresse » ; l’expression grecque a toutefois un sens plus large.
    reason: lexical_alternative
  - marker: b
    text: Ou « droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: Je parle en termes humains
  rationale: Cette formulation française naturelle conserve l’idée que Paul adapte son langage aux catégories ordinaires de l’expérience humaine, sans préciser qu’il s’agit nécessairement d’une simple analogie.
- source_word: ἀσθένειαν
  choice: faiblesse
  rationale: « Faiblesse » garde la portée générale du grec, qui peut évoquer la fragilité ou les limites humaines sans les réduire à une seule dimension.
- source_word: σαρκὸς
  choice: chair
  rationale: « Chair » préserve l’étendue et la tension théologique du terme grec. « Nature pécheresse » serait ici une interprétation plus étroite.
- source_word: παρεστήσατε / παραστήσατε
  choice: avez livré / livrez
  rationale: Le même verbe français est répété afin de préserver le parallèle entre la conduite passée et l’exhortation présente. « Livrer » exprime naturellement la mise à disposition sous une autorité.
- source_word: μέλη
  choice: les membres de votre corps
  rationale: L’ajout explicatif « de votre corps » rend le sens corporel de μέλη immédiatement compréhensible en français moderne sans modifier le référent.
- source_word: δοῦλα
  choice: comme esclaves
  rationale: « Esclaves » conserve la force de l’image de domination et d’appartenance qui structure Romains 6; « serviteurs » l’atténuerait.
- source_word: ἀκαθαρσίᾳ
  choice: impureté
  rationale: « Impureté » est clair en français actuel et convient au sens moral du contexte.
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: mépris de la loi / mépris de la loi
  rationale: Cette expression rend la transgression volontaire impliquée par ἀνομία dans un français plus immédiatement accessible que « iniquité », tout en conservant la répétition rhétorique des deux occurrences.
- source_word: εἰς τὴν ἀνομίαν
  choice: ce qui aboutit au mépris de la loi
  rationale: « Aboutit à » exprime la direction ou le résultat marqué par εἰς sans ajouter explicitement une gradation absente du texte.
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: « Justice » est le rendu français naturel de δικαιοσύνη et forme ici le contraste éthique avec l’impureté et le mépris de la loi. « Droiture » demeure une possibilité contextuelle.
- source_word: εἰς ἁγιασμόν
  choice: pour parvenir à la sainteté
  rationale: Cette formulation traduit le mouvement ou le résultat exprimé par εἰς et rend ἁγιασμός dans une langue accessible. Elle conserve l’idée d’une progression vers une vie sainte sans imposer un vocabulaire technique.
theological_decisions:
- issue: Sens de σάρξ dans « la faiblesse de votre chair »
  choice: chair
  alternative: nature pécheresse
  rationale: Le contexte concerne la faiblesse humaine dans l’existence corporelle marquée par le péché, mais le grec ne contraint pas à l’interprétation doctrinale plus étroite « nature pécheresse ». Le terme « chair » maintient cette amplitude.
- issue: Rendu de δικαιοσύνη dans ce contexte paulinien
  choice: justice
  alternative: droiture
  rationale: En français, « justice » est le correspondant principal et naturel de δικαιοσύνη. Dans ce contraste moral, « droiture » est également possible et est donc signalé en note.
- issue: Sens de ἁγιασμός comme but ou résultat
  choice: sainteté
  alternative: sanctification
  rationale: « Sainteté » communique clairement le résultat visé, tandis que « sanctification » mettrait davantage en avant le processus. La construction avec εἰς permet cette nuance directionnelle sans obliger à trancher entre état et processus.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe parallèle et la répétition des termes clés ont été conservées. « Membres de votre corps » explicite un emploi paulinien qui pourrait autrement sembler archaïque; « sainteté » évite un terme technique inutile tout en gardant la direction exprimée par le grec.
