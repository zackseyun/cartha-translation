id: ROM.6.2
reference: Romans 6:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ γένοιτο· οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: fr
  text: Absolument pas ! Nous qui sommes morts au péché, comment pourrions-nous encore vivre dans le péché ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que cela n’arrive jamais ! » Cette expression marque un rejet catégorique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Absolument pas !
  rationale: Cette formule idiomatique exprime chez Paul un rejet énergique. « Absolument pas ! » en restitue la force dans un français moderne et naturel.
- source_word: οἵτινες
  choice: Nous qui
  rationale: Le pronom relatif caractérise les croyants dont Paul fait partie. « Nous qui » conserve directement cette inclusion à la première personne.
- source_word: ἀπεθάνομεν
  choice: sommes morts
  rationale: L’aoriste présente ici la mort comme un fait décisif. Le passé composé est la tournure française naturelle dans ce contexte argumentatif.
- source_word: τῇ ἁμαρτίᾳ
  choice: au péché
  rationale: Le datif avec ἀποθνῄσκω indique la relation dans laquelle la mort est intervenue. « Mourir au péché » conserve la métaphore sans l’expliquer ni la réduire.
- source_word: πῶς ἔτι
  choice: comment pourrions-nous encore
  rationale: La combinaison exprime l’incrédulité devant la possibilité de continuer ainsi. Le conditionnel français rend naturellement la force de la question rhétorique, tandis que « encore » préserve la valeur temporelle.
- source_word: ζήσομεν
  choice: vivre
  rationale: Le futur grec appartient à une question rhétorique. Après « pourrions-nous », l’infinitif est exigé par le français et en transmet naturellement le sens.
- source_word: ἐν αὐτῇ
  choice: dans le péché
  rationale: Le pronom grec renvoie au péché envisagé comme une sphère de vie. La répétition du nom évite en français l’ambiguïté ou l’étrangeté de « vivre en lui » tout en préservant cette image spatiale.
theological_decisions:
- issue: La mort au péché désigne-t-elle une amélioration morale progressive ou une rupture décisive avec son pouvoir ?
  choice: Conserver directement la formule « sommes morts au péché » comme métaphore relationnelle décisive, sans en préciser le mécanisme.
  alternative: Paraphraser par « sommes devenus insensibles au péché » ou « nous sommes détournés du péché ».
  rationale: Le grec énonce la métaphore sans l’expliciter. La conserver maintient la tension théologique du passage et n’impose aucune conception particulière de la sanctification.
translation_notes:
  register: Français international moderne, clair et digne. « Absolument pas ! » donne à l’ouverture sa vigueur polémique ; la question qui suit reste concise. La répétition de « péché » est plus naturelle et plus claire que le pronom masculin « lui » dans ce contexte.
