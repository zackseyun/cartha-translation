id: ROM.6.11
reference: Romans 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: fr
  text: De même, vous aussi, considérez-vous comme morts au péché, mais vivants pour Dieu dans le Messie Jésus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Traditionnellement : « dans le Christ Jésus ». Le grec Χριστός signifie « Messie » ou « Christ »; il s’agit d’un titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: De même, vous aussi
  rationale: Exprime naturellement le lien avec ce qui précède et conserve l’inclusion explicite portée par καὶ ὑμεῖς.
- source_word: λογίζεσθε ἑαυτοὺς εἶναι
  choice: considérez-vous comme
  rationale: Rend l’idée de tenir quelque chose pour vrai à son propre sujet. La construction française avec « comme » exprime naturellement l’infinitif εἶναι sans l’alourdir.
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: morts au péché
  rationale: Formulation française idiomatique qui conserve le rapport exprimé par le datif; le contraste μέν…δέ est porté par « mais ».
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: mais vivants pour Dieu
  rationale: « Vivants » maintient l’antithèse directe avec « morts »; « pour Dieu » rend naturellement le datif relationnel sans préciser davantage sa nuance.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Dans » préserve la formulation paulinienne et son amplitude théologique; « Messie » rend Χριστός comme titre.
theological_decisions:
- issue: Valeur de Χριστῷ
  choice: le Messie
  alternative: le Christ
  rationale: Le titre garde ici son contenu messianique; sa traduction évite de le traiter silencieusement comme un simple nom propre.
- issue: Portée de ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  alternative: par le Messie Jésus
  rationale: La traduction littérale de ἐν préserve l’ambiguïté entre sphère, appartenance et union, au lieu de réduire le rapport à un moyen instrumental.
translation_notes:
  register: Français international moderne, sobre et digne. La structure antithétique « morts… mais vivants » est conservée, ainsi que la formule paulinienne « dans le Messie Jésus ».
