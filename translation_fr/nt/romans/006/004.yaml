id: ROM.6.4
reference: Romans 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: fr
  text: Nous avons donc été ensevelis avec lui par le baptême dans la mort, afin que, tout comme le Messie[a] a été ressuscité d’entre les morts par la gloire du Père, nous aussi, nous marchions dans une vie nouvelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : Christ.'
    reason: Rend compte de l’autre traduction usuelle de Χριστός, conformément à la note de l’audit anglais.
lexical_decisions:
- source_word: συνετάφημεν
  choice: nous avons été ensevelis avec lui
  rationale: Le passif aoriste présente l’action comme accomplie; le préfixe συν- est rendu naturellement par «avec lui», sans recourir à un composé artificiel.
- source_word: οὖν
  choice: donc
  rationale: «Donc» marque clairement et naturellement la conséquence tirée de l’argument précédent.
- source_word: διὰ τοῦ βαπτίσματος
  choice: par le baptême
  rationale: διά avec le génitif exprime ici le moyen; cette formulation conserve cette valeur instrumentale sans préciser davantage la relation théologique entre baptême et union avec le Messie.
- source_word: εἰς τὸν θάνατον
  choice: dans la mort
  rationale: «Dans» conserve le mouvement d’entrée ou d’incorporation exprimé par εἰς et s’accorde naturellement avec l’image de l’ensevelissement.
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure conserve nettement la valeur de but de la proposition grecque dans un registre français digne et courant.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Le titre grec est rendu par «le Messie» conformément à sa portée titulaire dans ce contexte; l’article est requis par l’usage naturel du français.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression idiomatique conserve la nuance d’une résurrection hors du nombre ou du domaine des morts.
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: par la gloire du Père
  rationale: La traduction maintient la valeur instrumentale de διά et la richesse de δόξα sans la réduire à la seule notion de puissance.
- source_word: περιπατήσωμεν
  choice: nous marchions
  rationale: Le subjonctif après «afin que» rend le subjonctif grec, tandis que «marchions» préserve la métaphore paulinienne de la conduite de vie.
- source_word: ἐν καινότητι ζωῆς
  choice: dans une vie nouvelle
  rationale: Cette formulation française naturelle communique la nouveauté de la vie tout en s’intégrant à la métaphore de la marche.
theological_decisions:
- issue: La manière de rendre διὰ τοῦ βαπτίσματος sans imposer une doctrine sacramentelle particulière
  choice: par le baptême
  alternative: au moyen du baptême
  rationale: «Par le baptême» respecte l’instrumentalité grammaticale du grec, mais ne définit pas à elle seule le mode précis selon lequel le baptême se rapporte à l’union avec le Messie.
- issue: La voix passive de ἠγέρθη et l’agent de la résurrection
  choice: a été ressuscité
  alternative: est ressuscité
  rationale: Le passif français préserve le passif grec et laisse intacte la formulation selon laquelle la résurrection s’est opérée «par la gloire du Père», sans convertir le verbe en action réfléchie ou autonome.
- issue: La métaphore éthique de περιπατέω
  choice: nous marchions dans une vie nouvelle
  alternative: nous menions une vie nouvelle
  rationale: Le choix retenu conserve l’image biblique de la marche comme manière de vivre, sans réduire la proposition à une simple paraphrase.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit le mouvement logique du grec tout en évitant le calque peu naturel «en nouveauté de vie». La répétition «nous aussi, nous» met en relief καὶ ἡμεῖς de façon idiomatique.
