  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: fr
  text: Or, si nous sommes morts avec le Messie[a], nous croyons que nous vivrons aussi avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le Christ » : grec Χριστῷ (Christō).'
    reason: Alternative lexicale pour le titre Χριστός.
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: εἰ introduit la condition et δέ marque ici une transition légèrement contrastive avec l’argument précédent. « Mais si » conserve ces deux valeurs sans ajouter de marqueur temporel.
- source_word: ἀπεθάνομεν
  choice: nous sommes morts
  rationale: L’aoriste renvoie à la mort avec le Messie déjà exposée dans le contexte. Le passé composé est la manière naturelle de présenter en français cet événement passé dont la portée demeure actuelle.
- source_word: σὺν Χριστῷ
  choice: avec le Messie
  rationale: σύν exprime l’association ou l’union. Χριστός est ici compris comme un titre; en français, « le Messie » restitue ce sens naturellement et exige l’article défini.
- source_word: πιστεύομεν
  choice: nous croyons
  rationale: Rendu direct et courant de πιστεύομεν dans cette affirmation de foi.
- source_word: ὅτι
  choice: que
  rationale: ὅτι introduit explicitement le contenu de ce que nous croyons.
- source_word: καὶ
  choice: aussi
  rationale: καί met en correspondance la vie future avec la mort préalable vécue avec le Messie.
- source_word: συζήσομεν αὐτῷ
  choice: nous vivrons aussi avec lui
  rationale: Le verbe composé συζάω exprime le fait de vivre avec quelqu’un; le futur français et le complément « avec lui » rendent clairement le sens sans préciser indûment la nature de cette vie.
theological_decisions:
- issue: Traduction de Χριστῷ
  choice: le Messie
  alternative: le Christ
  rationale: Le terme fonctionne comme un titre dans cet argument sur l’union avec Jésus. « Le Messie » rend explicitement sa valeur titulaire, tandis qu’une note conserve l’autre traduction française traditionnelle.
- issue: Nature de la vie future exprimée par συζήσομεν αὐτῷ
  choice: nous vivrons aussi avec lui
  alternative: nous partagerons avec lui la vie de résurrection
  rationale: La formulation retenue préserve l’ampleur de l’affirmation grecque sans limiter cette vie à une explication doctrinale plus précise que le texte.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve la structure conditionnelle et le contraste discret du grec; « le Messie » est idiomatiquement accompagné de l’article défini.
