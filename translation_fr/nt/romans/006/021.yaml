  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: fr
  text: Quel fruit retiriez-vous donc alors de ces choses dont vous avez honte maintenant ? Car l’aboutissement[a] de ces choses, c’est la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fin » ou « l’issue ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: Quel
  rationale: Introduit naturellement en français la question rhétorique portant sur le fruit produit par leur conduite passée.
- source_word: καρπὸν
  choice: fruit
  rationale: Conserve la métaphore paulinienne plutôt que de la réduire à « avantage » ou « résultat ».
- source_word: εἴχετε
  choice: retiriez-vous
  rationale: Rend idiomatiquement l’idée d’un fruit obtenu de pratiques passées et reflète la valeur durative de l’imparfait.
- source_word: τότε
  choice: alors
  rationale: Maintient le contraste temporel net avec « maintenant ».
- source_word: ἐφ’ οἷς
  choice: de ces choses dont
  rationale: Explicite l’antécédent sous-entendu et relie naturellement le fruit aux anciennes pratiques, tout en permettant la reprise « dont vous avez honte ».
- source_word: νῦν
  choice: maintenant
  rationale: Préserve le contraste avec « alors » dans un français courant.
- source_word: ἐπαισχύνεσθε
  choice: avez honte
  rationale: Exprime la force morale du verbe sans l’affaiblir en simple gêne.
- source_word: τέλος
  choice: aboutissement
  rationale: Conserve à la fois l’idée de terme et celle d’issue ou de conséquence, dans un français plus naturel ici que « fin ».
- source_word: ἐκείνων
  choice: de ces choses
  rationale: Reprend clairement les pratiques évoquées dans la question précédente.
- source_word: θάνατος
  choice: la mort
  rationale: Rendu direct et traditionnel qui préserve toute la gravité théologique du terme.
theological_decisions:
- issue: Faut-il rendre τέλος par « fin » ou par un terme exprimant l’issue ?
  choice: aboutissement
  alternative: fin ; issue ; résultat
  rationale: « Aboutissement » laisse entendre à la fois le terme auquel ces pratiques conduisent et leur conséquence, sans préciser davantage la nature de la mort.
translation_notes:
  register: Français moderne, international et digne. La métaphore du fruit est conservée, tandis que « retiriez-vous » rend la relation avec les anciennes pratiques de façon naturelle. Le contraste « alors / maintenant » demeure explicite.
