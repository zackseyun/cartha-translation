    text: 'Ou, plus littéralement : « a été justifié du péché ». Le verbe grec a habituellement une nuance judiciaire, mais le contexte peut aussi exprimer la libération de la domination du péché.'
    reason: 'Variante lexicale : δικαιόω possède normalement une nuance judiciaire, tandis que le contexte souligne la libération de la domination du péché.'
  revision_rationale: La révision remplace une expression française juridiquement possible mais sémantiquement trompeuse par « a été libéré du péché », qui rend le sens contextuel de la séparation d’avec le péché. La note conserve explicitement la valeur lexicale plus directe de δικαιόω et ne force donc pas une résolution doctrinale de l’ambiguïté.
