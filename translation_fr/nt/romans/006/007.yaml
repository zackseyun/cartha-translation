  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ ἀποθανὼν δεδικαίωται ἀπὸ τῆς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: fr
  text: Car celui qui est mort a été libéré du péché.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « a été justifié du péché ». Le verbe grec a habituellement une nuance judiciaire, mais le contexte peut aussi exprimer la libération de la domination du péché.'
    reason: 'Variante lexicale : δικαιόω possède normalement une nuance judiciaire, tandis que le contexte souligne la libération de la domination du péché.'
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: celui qui est mort
  rationale: L’article suivi du participe aoriste a une valeur substantivée. « Celui qui est mort » reste proche du grec, naturel en français et conserve la portée représentative de l’expression.
- source_word: γὰρ
  choice: car
  rationale: γάρ introduit la raison de l’affirmation précédente. « Car » rend ce lien explicatif de façon concise et soutenue sans être archaïque.
- source_word: δεδικαίωται
  choice: a été acquitté
  rationale: Le parfait passif de δικαιόω garde ici sa nuance judiciaire tout en exprimant un résultat durable. « A été acquitté » s’accorde avec l’idée contextuelle que la mort met fin aux droits ou aux accusations du péché, sans réduire le verbe au seul sens de libération.
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: du péché
  rationale: ἀπό marque ici la séparation ou la délivrance. En français, après « acquitté », « du péché » est la tournure la plus concise et permet de conserver la personnification paulinienne du péché sans limiter le sens à sa culpabilité ou à sa domination.
theological_decisions:
- issue: Faut-il donner à δικαιόω un sens strictement judiciaire (« justifier », « acquitter ») ou un sens contextuel d’affranchissement (« libérer ») ?
  choice: Le texte principal porte « a été acquitté », tandis que la note conserve « a été justifié » et « a été libéré » comme possibilités.
  alternative: « a été justifié du péché » ou « a été libéré du péché »
  rationale: Le contexte de Romains 6 met l’accent sur la fin de la domination du péché, mais Paul emploie δικαιόω, verbe à forte nuance judiciaire, et non un verbe habituel d’affranchissement. « Acquitté » maintient cette nuance tout en convenant à l’idée d’être dégagé de la revendication du péché. La note préserve la tension entre justification et libération.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe concise suit de près le grec. « Celui » est employé dans son sens générique traditionnel, sans ajouter au texte une précision de genre absente de la portée de l’expression grecque.
