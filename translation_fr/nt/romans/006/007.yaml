review_pass:
  verdict: revise
  source_fidelity: Le grec porte un parfait passif de δικαιόω (« a été/est justifié ») avec ἀπό marquant la séparation d’avec le péché. Dans le contexte immédiat de Romains 6, où le péché est présenté comme une puissance dominatrice, « libéré du péché » exprime naturellement le résultat contextuel sans trancher la question du rapport exact entre l’image judiciaire et l’émancipation.
  naturalness: « Acquitté du péché » est possible dans une lecture judiciaire, mais il sonne peu idiomatique et suggère surtout une innocence face à l’accusation de péché. « Libéré du péché » est une formulation française moderne, claire et bien adaptée au contexte. Le lien explicatif de « Car » est naturel.
  terminology: La note doit signaler que « justifié » représente plus directement δικαιόω, tout en indiquant que « libéré » rend son effet contextuel. « Du péché » convient et conserve le singulier à valeur collective/personnifiée.
  issues:
  - severity: medium
    issue: « a été acquitté du péché » risque de réduire le sens à une déclaration d’innocence.
    rationale: En français moderne, on est normalement acquitté d’une accusation ou d’une infraction. La construction peut ainsi faire entendre que le défunt n’est pas coupable de péché, alors que le contexte de Romains 6 souligne sa délivrance de la domination du péché. La note ne suffit pas entièrement à lever cette impression dans le texte principal.
  revised_text: Car celui qui est mort a été libéré du péché.[a]
  revised_footnotes:
