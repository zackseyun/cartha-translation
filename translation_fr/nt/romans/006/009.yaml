id: ROM.6.9
reference: Romans 6:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: fr
  text: 'Sachant que le Messie[a], ressuscité d’entre les morts, ne meurt plus : la mort n’exerce plus son pouvoir sur lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: sachant
  rationale: Le participe conserve le lien avec l’argument environnant sans préciser davantage une valeur causale telle que « puisque nous savons ».
- source_word: Χριστὸς
  choice: le Messie
  rationale: Dans ce contexte, Χριστός garde sa valeur de titre; « le Messie » en exprime le sens, tandis que « Christ » demeure une traduction traditionnelle possible.
- source_word: ἐγερθεὶς
  choice: ressuscité
  rationale: Le participe aoriste passif désigne une action accomplie antérieure à « ne meurt plus ». En français biblique courant, « ressuscité » exprime naturellement ce relèvement passif sans alourdir la phrase.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette tournure française idiomatique rend l’idée d’un relèvement hors du nombre des morts.
- source_word: οὐκέτι
  choice: ne… plus
  rationale: La même expression est conservée dans les deux propositions afin de rendre la cessation définitive indiquée par οὐκέτι.
- source_word: ἀποθνῄσκει
  choice: meurt
  rationale: Le présent simple exprime naturellement la réalité durable selon laquelle le Messie n’est désormais plus sujet à la mort.
- source_word: θάνατος
  choice: la mort
  rationale: Le nom est rendu directement et demeure personnifié comme sujet exerçant un pouvoir.
- source_word: κυριεύει
  choice: exerce… son pouvoir sur
  rationale: Cette formulation moderne et naturelle exprime la domination ou la maîtrise impliquée par κυριεύω, tout en préservant l’image du pouvoir de la mort.
theological_decisions:
- issue: Traduction de Χριστός dans le discours paulinien
  choice: le Messie
  alternative: le Christ
  rationale: Le terme est compris ici comme un titre porteur de sens plutôt que comme un simple élément de nom propre. La note conserve l’équivalent traditionnel sans imposer une lecture confessionnelle particulière.
- issue: Agent implicite de la résurrection dans ἐγερθεὶς
  choice: ressuscité
  alternative: Dieu l’ayant ressuscité
  rationale: Le grec emploie un passif sans nommer explicitement l’agent. La traduction maintient cette indétermination au lieu d’ajouter « Dieu » dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le deux-points conserve la forte articulation entre les deux propositions. La répétition de « plus » reproduit l’insistance du grec, et « exerce son pouvoir » évite le caractère archaïque de « domine » ou « a autorité » tout en gardant la personnification de la mort.
