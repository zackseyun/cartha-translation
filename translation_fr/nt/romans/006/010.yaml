    text: 'Litt. : « ce qu’il est mort … ce qu’il vit ». Le relatif neutre grec peut désigner le fait de mourir et le fait de vivre.'
    reason: La construction grecque avec le relatif neutre est idiomatique ; la traduction la rend par une formulation française naturelle qui conserve le parallélisme.
