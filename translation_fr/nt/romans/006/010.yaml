revisions:
- from: Car la mort qu’il est mort[a], il est mort au péché une fois pour toutes ; mais la vie qu’il vit, il la vit pour Dieu.
  to: Car, en ce qui concerne sa mort, il est mort au péché une fois pour toutes ; mais, en ce qui concerne sa vie, il vit pour Dieu[a].
  rationale: La révision remplace le calque agrammatical par une mise en relief française naturelle. Elle conserve l’explication introduite par « Car », l’opposition mort/vie, les expressions « au péché » et « pour Dieu », ainsi que la portée définitive de « une fois pour toutes ». La note maintient l’information pertinente sur l’idiome grec sans proposer de pseudo-littéral français fautif.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:17:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est bien rendu : la mort du Christ est rapportée au péché de manière définitive, et sa vie à Dieu. Cependant, « la mort qu’il est mort » n’est pas une construction française recevable, car « mourir » ne prend pas ici de complément d’objet direct. La note proposée contient également l’expression non française « ce qu’il est mort ».'
  naturalness: « Car, en ce qui concerne sa mort… mais, en ce qui concerne sa vie… » est un français moderne, clair et suffisamment proche de la mise en relief grecque. Il maintient le parallélisme sans reproduire de façon artificielle l’accusatif apparenté grec.
  terminology: « Mourir au péché » et « vivre pour Dieu » sont des formulations pauliniennes naturelles en français et préservent l’opposition des datifs sans suggérer une faute personnelle du Christ. « Une fois pour toutes » rend bien ἐφάπαξ.
  issues:
  - severity: medium
    issue: 'Construction française agrammaticale : « la mort qu’il est mort »'
    rationale: Le grec emploie idiomatiquement un relatif neutre avec le verbe répété, mais le français ne permet pas de faire de « mort » le complément direct de « est mort ». Une reformulation est nécessaire pour que le texte soit publiable.
  - severity: medium
    issue: Note contenant « ce qu’il est mort »
    rationale: Cette proposition n’est pas idiomatique ni grammaticalement exploitable en français. La note doit expliquer la fonction du relatif grec sans la calquer sous une forme défectueuse.
  revised_text: Car, en ce qui concerne sa mort, il est mort au péché une fois pour toutes ; mais, en ce qui concerne sa vie, il vit pour Dieu[a].
  revised_footnotes:
