reference: Romans 6:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: fr
  text: Car, en ce qui concerne sa mort, il est mort au péché une fois pour toutes ; mais, en ce qui concerne sa vie, il vit pour Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « ce qu’il est mort … ce qu’il vit ». Le relatif neutre grec peut désigner le fait de mourir et le fait de vivre.'
    reason: La construction grecque avec le relatif neutre est idiomatique ; la traduction la rend par une formulation française naturelle qui conserve le parallélisme.
lexical_decisions:
- source_word: ὃ
  choice: la mort qu’il est mort
  rationale: Le pronom relatif neutre, repris avec le même verbe, désigne idiomatiquement le fait ou l’événement de sa mort. Cette formulation conserve l’insistance et le parallélisme du grec, malgré une tournure française volontairement marquée.
- source_word: γάρ
  choice: Car
  rationale: La conjonction introduit l’explication de l’affirmation précédente et « Car » rend clairement ce lien logique.
- source_word: ἀπέθανεν
  choice: il est mort
  rationale: Le passé composé exprime naturellement en français moderne l’acte historique achevé de sa mort.
- source_word: τῇ ἁμαρτίᾳ
  choice: au péché
  rationale: Le datif exprime ici le rapport au péché. « Mourir au péché » maintient l’antithèse paulinienne avec la vie orientée vers Dieu sans préciser indûment s’il faut comprendre « pour le péché » ou « par rapport au péché ».
- source_word: ἐφάπαξ
  choice: une fois pour toutes
  rationale: Cette expression rend l’idée d’un acte unique, non répétable et durablement décisif.
- source_word: ὃ δὲ ζῇ
  choice: mais la vie qu’il vit
  rationale: Cette tournure reproduit le parallélisme avec la première proposition et explicite naturellement en français la valeur idiomatique du relatif neutre.
- source_word: δὲ
  choice: mais
  rationale: La conjonction marque ici le contraste entre la mort et la vie.
- source_word: τῷ θεῷ
  choice: pour Dieu
  rationale: En français, « vivre pour Dieu » exprime naturellement l’orientation de la vie vers Dieu tout en correspondant au datif grec et en restant proche du contraste avec « au péché ».
theological_decisions:
- issue: Le sens de τῇ ἁμαρτίᾳ et le risque de suggérer que Christ aurait eu un péché personnel
  choice: il est mort au péché
  alternative: il est mort pour le péché ; il est mort par rapport au péché
  rationale: « Au péché » préserve l’antithèse de Paul et la tension du texte sans attribuer de péché personnel à Christ ni intégrer au texte principal une explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « la mort qu’il est mort » est plus marquée que l’usage courant, mais elle conserve la structure emphatique et le parallélisme de l’original ; la note signale l’ambiguïté syntaxique réelle.
