id: ROM.6.23
reference: Romans 6:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: fr
  text: Car le salaire du péché, c’est la mort ; mais le don[a] de Dieu, c’est la vie éternelle en Jésus le Messie, notre Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « don gratuit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψώνια
  choice: le salaire
  rationale: Bien que le grec emploie un pluriel, le singulier « salaire » est l’expression française naturelle pour désigner ce que le péché paie ou fait gagner. Il maintient le contraste entre ce qui est mérité et ce qui est donné.
- source_word: ἁμαρτίας
  choice: du péché
  rationale: 'Le génitif est conservé de façon compacte : il peut évoquer le salaire qui appartient au péché ou que le péché verse.'
- source_word: θάνατος
  choice: la mort
  rationale: Traduction directe qui conserve toute la portée littérale et théologique du terme sans préciser indûment la nature de cette mort.
- source_word: χάρισμα
  choice: le don
  rationale: « Don » est naturel en français et fait clairement ressortir l’opposition avec le salaire mérité. Une note signale la nuance de grâce contenue dans le mot grec.
- source_word: ζωὴ αἰώνιος
  choice: la vie éternelle
  rationale: Formulation française consacrée et exacte, qui exprime la durée sans réduire la richesse théologique de l’expression.
- source_word: ἐν
  choice: dans
  rationale: « Dans » préserve l’idée paulinienne de sphère ou d’union avec le Messie, au lieu de réduire la préposition à un simple moyen.
- source_word: Χριστῷ Ἰησοῦ
  choice: le Messie Jésus
  rationale: « Messie » rend le sens titulaire de Χριστός, tandis que l’ordre grec « Messie Jésus » est conservé malgré son caractère moins habituel en français.
- source_word: κυρίῳ
  choice: Seigneur
  rationale: « Seigneur » respecte l’usage confessionnel du Nouveau Testament et la portée théologique de κύριος.
theological_decisions:
- issue: Portée de ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  alternative: par le Messie Jésus
  rationale: Le grec exprime plus naturellement la sphère ou l’union que la seule instrumentalité. La traduction conserve donc cette tension paulinienne sans la résoudre en simple causalité.
translation_notes:
  register: Français moderne, digne et accessible. La structure équilibrée « c’est… mais… c’est… » rend la construction nominale grecque de manière claire. Le point-virgule souligne le contraste central entre salaire et don.
