  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: fr
  text: Que dirons-nous donc ? Allons-nous persister dans le péché pour que la grâce se multiplie ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Devrions-nous continuer dans le péché… ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pour que la grâce abonde ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Que dirons-nous donc ?
  rationale: Conserve la transition déductive et la tournure rhétorique de Paul dans un français naturel et soutenu.
- source_word: ἐροῦμεν
  choice: dirons-nous
  rationale: Le futur a ici une valeur délibérative; cette formulation française introduit naturellement la question rhétorique.
- source_word: ἐπιμένωμεν
  choice: Allons-nous persister
  rationale: Le subjonctif présent délibératif envisage la poursuite d'une conduite. « Persister » exprime clairement la continuité volontaire sans ajouter une idée étrangère au texte.
- source_word: τῇ ἁμαρτίᾳ
  choice: dans le péché
  rationale: Le datif régi par ἐπιμένω exprime ici ce dans quoi l'on demeure ou persiste; « dans le péché » est idiomatique et garde la formulation théologique de Paul.
- source_word: ἵνα
  choice: pour que
  rationale: Rend explicitement le but ou le résultat recherché dans le raisonnement hypothétique.
- source_word: ἡ χάρις
  choice: la grâce
  rationale: Équivalent français établi de χάρις dans ce contexte, où il s'agit de la faveur gracieuse de Dieu.
- source_word: πλεονάσῃ
  choice: se multiplie
  rationale: Exprime l'accroissement en mesure ou en abondance dans une langue actuelle, tout en faisant écho au raisonnement précédent de Paul.
theological_decisions:
- issue: Présenter la question comme une permission, une obligation ou une conduite envisagée
  choice: '« Allons-nous persister dans le péché » : question délibérative portant sur une conduite proposée'
  alternative: « Devrions-nous persister dans le péché » ou « Persisterons-nous dans le péché »
  rationale: Le subjonctif grec formule une question rhétorique délibérative. « Allons-nous » en restitue la force sans transformer explicitement la question en demande de permission ni résoudre d'avance la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les deux questions rhétoriques ainsi que le lien final exprimé par ἵνα. « Persister » est retenu dans le texte, tandis que « continuer » figure en note comme possibilité plus courante; « abonde » est également signalé comme équivalent traditionnel de πλεονάσῃ.
