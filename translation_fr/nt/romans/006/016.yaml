id: ROM.6.16
reference: Romans 6:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: fr
  text: 'Ne savez-vous pas que, si vous vous présentez à quelqu’un comme esclaves pour lui obéir, vous êtes esclaves de celui à qui vous obéissez : soit du péché, qui conduit à la mort, soit de l’obéissance, qui conduit à la justice ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: vous vous présentez à quelqu’un
  rationale: Cette formulation conserve l’image concrète de personnes qui se placent elles-mêmes à la disposition d’un maître, sans recourir à une tournure archaïque.
- source_word: δούλους / δοῦλοί
  choice: esclaves
  rationale: Le terme exprime ici l’assujettissement à un maître; « esclaves » préserve la force de l’image développée par Paul.
- source_word: εἰς ὑπακοήν
  choice: pour lui obéir
  rationale: La tournure exprime naturellement en français la finalité indiquée par εἰς, même si elle transforme le nom grec en verbe.
- source_word: ᾧ ὑπακούετε
  choice: celui à qui vous obéissez
  rationale: Cette formulation rend le rapport au maître suggéré par l’image de l’esclavage sans introduire explicitement le nom « maître », absent du grec.
- source_word: ἁμαρτίας
  choice: péché
  rationale: Le texte personnifie le péché dans le cadre de l’image de l’esclavage; la traduction garde le terme direct sans expliciter cette personnification.
- source_word: εἰς θάνατον
  choice: qui conduit à la mort
  rationale: Cette expression rend clairement la valeur directionnelle ou résultative de εἰς en français courant.
- source_word: ὑπακοῆς
  choice: obéissance
  rationale: Le nom est conservé afin de maintenir le contraste rhétorique entre le péché et l’obéissance.
- source_word: δικαιοσύνην
  choice: justice
  rationale: En français biblique moderne, « justice » peut désigner à la fois la conformité à ce qui est juste et la réalité théologique paulinienne, sans réduire le terme à la seule justice sociale.
theological_decisions:
- issue: Sens de δικαιοσύνη dans le contraste paulinien
  choice: justice
  alternative: justification; état conforme à la volonté de Dieu
  rationale: « Justice » est le correspondant français établi et suffisamment large de δικαιοσύνη. « Justification » préciserait indûment ici un processus ou un statut, tandis qu’une périphrase résoudrait une amplitude que le grec laisse ouverte.
- issue: Rapport exprimé par εἰς devant θάνατον et δικαιοσύνην
  choice: conséquence ou aboutissement, rendu par « qui conduit à »
  alternative: but, rendu par « en vue de »
  rationale: Dans ce contraste, la lecture résultative est la plus naturelle, mais la formulation « conduit à » conserve une orientation sans définir de manière trop rigide le rapport logique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure interrogative et le parallélisme de l’original. « Esclaves » maintient volontairement la dureté de la métaphore, tandis que « pour lui obéir » évite la lourdeur de « en vue de l’obéissance ».
