  rationale: La révision remplace l’expression interprétative « une mort semblable à la sienne » par « la ressemblance de sa mort », plus proche de ὁμοίωμα tout en restant idiomatique. Elle garde l’union au Christ et la portée future sans préciser le mode de participation. La note b est corrigée pour refléter plus exactement l’ellipse et l’insistance de la seconde proposition grecque.
