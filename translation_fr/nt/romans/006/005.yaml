id: ROM.6.5
reference: Romans 6:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: fr
  text: Car si nous avons été unis à lui[a] dans la ressemblance de sa mort, nous le serons certainement aussi dans celle de sa résurrection[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avons grandi avec lui » ; le mot grec peut évoquer des êtres qui ont grandi ensemble.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit littéralement : « mais aussi de la résurrection nous serons » ; « unis » et « dans la ressemblance » sont sous-entendus à partir de la première proposition.'
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: unis à lui
  rationale: L’adjectif exprime une union étroite, avec une possible image de croissance commune. « Unis à lui » rend clairement la relation impliquée dans le contexte sans imposer une métaphore particulière.
- source_word: γεγόναμεν
  choice: avons été unis
  rationale: Le parfait décrit une union établie dans le passé et dont le résultat demeure. Cette tournure est plus naturelle en français que le calque « sommes devenus unis ».
- source_word: τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ
  choice: dans une mort semblable à la sienne
  rationale: Cette formulation française naturelle conserve l’idée de ressemblance sans définir plus précisément la manière dont les croyants participent à la mort du Christ.
- source_word: ἀλλὰ καὶ
  choice: certainement aussi
  rationale: La tournure grecque relie avec insistance la résurrection à la mort; « certainement aussi » en restitue la force affirmative dans un français clair.
- source_word: τῆς ἀναστάσεως
  choice: dans une résurrection semblable à la sienne
  rationale: Le grec abrège la seconde proposition. La ressemblance et la référence au Christ sont reprises de la première proposition afin de rendre le parallélisme intelligible en français.
- source_word: ἐσόμεθα
  choice: nous serons … unis à lui
  rationale: Le grec dit littéralement « nous serons » et sous-entend le prédicat de la première proposition. Celui-ci est répété en français pour éviter une construction obscure.
theological_decisions:
- issue: Nature de l’union à la mort et à la résurrection du Christ
  choice: Maintenir le langage d’union tout en conservant la qualification de ressemblance
  alternative: Préciser une union exclusivement sacramentelle, mystique ou métaphorique
  rationale: Paul affirme une participation réelle tout en parlant de ressemblance. La traduction ne tranche pas le mode exact de cette participation et n’importe aucune lecture confessionnelle particulière.
- issue: Portée future de ἐσόμεθα
  choice: « nous serons certainement aussi unis à lui »
  alternative: Identifier explicitement cette résurrection soit à la vie nouvelle présente, soit uniquement à la résurrection corporelle future
  rationale: Le futur grec est conservé sans résoudre ici la portée temporelle et théologique que le contexte peut laisser en tension.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « unis à lui » et de « semblable à la sienne » explicite l’ellipse grecque sans ajouter d’explication doctrinale.
