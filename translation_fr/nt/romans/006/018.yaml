revisions:
- from: Mais, libérés du péché, vous avez été réduits en esclavage au service de la justice.[a]
  to: Mais, libérés du péché, vous avez été faits esclaves de la justice.
  rationale: 'La révision supprime l’ajout interprétatif « au service de » et rend directement les deux passifs grecs ainsi que le transfert d’esclavage du péché à la justice. Aucune note n’est nécessaire : « justice » demeure volontairement assez large pour préserver la portée de δικαιοσύνη.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:16:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure essentielle est bien rendue : le participe aoriste passif (« libérés ») précède le verbe principal passif, et « péché » conserve la portée de puissance dominatrice. Toutefois, « au service de » ajoute une notion qui n’est pas exprimée par le datif grec et transforme la relation directe d’asservissement à la justice en une relation de service.'
  naturalness: La phrase révisée est naturelle en français moderne et garde un registre sobre et direct. « Vous avez été faits esclaves de » est plus fidèle à la métaphore et à la construction passive que « réduits en esclavage au service de ».
  terminology: « Justice » est un rendu français recevable de δικαιοσύνη dans ce contexte et laisse ouvertes ses résonances éthiques et relationnelles. « Esclaves » rend explicitement la force de δουλόω sans l’atténuer. La note proposée (« à ce qui est juste ») est plus explicative qu’une véritable alternative lexicale et restreint indûment le terme ; elle n’est pas nécessaire.
  issues:
  - severity: medium
    issue: Ajout de « au service de »
    rationale: Le grec ἐδουλώθητε τῇ δικαιοσύνῃ signifie directement « vous avez été faits esclaves de/asservis à la justice ». « Au service de » introduit une médiation absente du texte et atténue quelque peu l’image d’esclavage.
  - severity: low
    issue: Note lexicale sur « à ce qui est juste »
    rationale: Cette formulation réduit δικαιοσύνη à une explicitation morale et ne constitue pas une alternative lexicale équivalente suffisamment précise dans ce verset.
  revised_text: Mais, libérés du péché, vous avez été faits esclaves de la justice.
  revised_footnotes: []
  revision_rationale: 'La révision supprime l’ajout interprétatif « au service de » et rend directement les deux passifs grecs ainsi que le transfert d’esclavage du péché à la justice. Aucune note n’est nécessaire : « justice » demeure volontairement assez large pour préserver la portée de δικαιοσύνη.'
