  variant: modern international French
source:
  edition: SBLGNT
  text: ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: fr
  text: Mais, libérés du péché, vous avez été faits esclaves de la justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: libérés
  rationale: Le participe aoriste passif exprime une libération reçue et antérieure au verbe principal. La tournure française détachée « libérés » conserve ce rapport sans lourdeur.
- source_word: δὲ
  choice: Mais
  rationale: Dans le raisonnement, δέ marque ici une transition légèrement contrastive avec l’ancien esclavage évoqué au verset précédent; « mais » rend naturellement cette articulation.
- source_word: ἁμαρτίας
  choice: du péché
  rationale: Le singulier défini conserve à la fois le sens moral et la personnification paulinienne du péché comme puissance dominatrice.
- source_word: ἐδουλώθητε
  choice: vous avez été réduits en esclavage au service de
  rationale: L’aoriste passif et la métaphore forte de δουλόω sont maintenus. « Au service de » précise idiomatiquement en français la relation exprimée par le datif, sans adoucir l’idée d’esclavage.
- source_word: δικαιοσύνῃ
  choice: la justice
  rationale: « Justice » est le correspondant français naturel de δικαιοσύνη et peut porter ici ses dimensions morale, relationnelle et judiciaire sans les dissocier artificiellement.
theological_decisions:
- issue: Force de la métaphore de δουλόω
  choice: vous avez été réduits en esclavage au service de la justice
  alternative: vous êtes devenus serviteurs de la justice
  rationale: Paul décrit un transfert radical de domination. La formulation retenue préserve le caractère choquant de l’esclavage, tandis que « serviteurs » affaiblirait la métaphore.
- issue: Valeur de δικαιοσύνη
  choice: justice
  alternative: juste conduite
  rationale: Le terme grec possède une portée plus large qu’un simple comportement moral. « Justice » laisse subsister ses résonances éthiques, relationnelles et judiciaires.
translation_notes:
  register: Français international moderne, digne et direct. La phrase garde le parallélisme entre la libération hors du péché et l’asservissement à la justice, ainsi que les deux passifs du grec.
