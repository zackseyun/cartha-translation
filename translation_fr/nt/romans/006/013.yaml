revisions:
- from: Ne mettez pas non plus les parties de votre corps à la disposition du péché comme des armes[a] au service de l’injustice. Au contraire, mettez-vous à la disposition de Dieu comme des vivants revenus d’entre les morts, et mettez les parties de votre corps à la disposition de Dieu comme des armes au service de la justice[b].
  to: Ne mettez pas non plus les parties de votre corps à la disposition du péché comme des armes[a] de l’injustice. Au contraire, mettez-vous à la disposition de Dieu comme des vivants revenus d’entre les morts, et mettez les parties de votre corps à la disposition de Dieu comme des armes de la justice[b].
  rationale: La révision remplace seulement « au service de l’injustice/de la justice » par « de l’injustice/de la justice », afin de refléter les génitifs grecs et de ne pas ajouter une relation explicative. Elle conserve la répétition, le contraste entre péché et Dieu, l’ambiguïté sobre de « revenus d’entre les morts » et les deux notes lexicales avec leurs ancres appropriées.
