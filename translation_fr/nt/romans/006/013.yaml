  source_fidelity: 'La structure fondamentale et les destinataires opposés (« le péché » / « Dieu ») sont bien rendus. Toutefois, ὅπλα ἀδικίας et ὅπλα δικαιοσύνης sont des groupes génitivaux : « armes de l’injustice/de la justice » les reproduit plus directement que « armes au service de… », qui introduit une relation de service non exprimée dans ces groupes.'
  naturalness: « Livrez » est naturel et concis dans ce contexte d’allégeance, et sa répétition reproduit efficacement celle de παριστάνετε / παραστήσατε. « Les parties de votre corps » demeure clair en français international moderne.
  terminology: « Péché », « Dieu », « armes », « injustice » et « justice » sont cohérents avec le grec et avec le registre paulinien. La note sur « instruments » est correctement ancrée à « armes » et s’applique aux deux occurrences ; « droiture » est une alternative recevable à « justice ».
  issues:
