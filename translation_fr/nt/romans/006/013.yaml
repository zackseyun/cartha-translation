id: ROM.6.13
reference: Romans 6:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: fr
  text: Ne mettez pas non plus les parties de votre corps à la disposition du péché comme des armes[a] de l’injustice. Au contraire, mettez-vous à la disposition de Dieu comme des vivants revenus d’entre les morts, et mettez les parties de votre corps à la disposition de Dieu comme des armes de la justice[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des instruments » ; de même à la fin du verset.
    reason: lexical_alternative
  - marker: b
    text: Ou « de la droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: mettez… à la disposition de
  rationale: Cette formulation française naturelle conserve la répétition du verbe grec et exprime l’idée de se placer, soi-même ou son corps, à la disposition d’un maître. « Présentez » serait plus littéral, mais peu idiomatique avec les parties du corps.
- source_word: μέλη
  choice: les parties de votre corps
  rationale: Le grec désigne ici les différentes parties du corps engagées dans l’action. « Membres » serait plus traditionnel, mais peut être ambigu en français moderne.
- source_word: ὅπλα
  choice: armes
  rationale: « Armes » préserve l’image de combat portée par le terme grec; « instruments » reste une possibilité plus large, signalée en note.
- source_word: ἀδικίας
  choice: injustice
  rationale: « Injustice » rend le contraste lexical avec δικαιοσύνη et couvre ici la conduite contraire à ce qui est juste. « Mal » ou « perversité » seraient possibles, mais atténueraient ce parallélisme.
- source_word: ἁμαρτίᾳ
  choice: péché
  rationale: Le rendu direct laisse perceptible la personnification du péché dans le contexte sans l’expliciter par « puissance du péché ».
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: comme des vivants revenus d’entre les morts
  rationale: Cette formulation conserve la comparaison introduite par ὡσεὶ ainsi que le contraste entre les morts et les vivants. « Revenus » rend idiomatique en français le mouvement exprimé par ἐκ sans préciser davantage la manière dont ils ont reçu la vie.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » est le correspondant français naturel de δικαιοσύνη et forme un contraste net avec « injustice ». « Droiture » mettrait davantage l’accent sur la rectitude morale et demeure une possibilité lexicale.
theological_decisions:
- issue: Le péché et Dieu présentés comme deux destinataires opposés
  choice: Conserver les rapports directs avec « le péché » et « Dieu » grâce à « à la disposition de », sans nommer explicitement un service ou une domination.
  alternative: « au service du péché… au service de Dieu »
  rationale: Le contexte implique une question d’allégeance et de maîtrise, mais le texte grec ne développe pas lui-même cette relation. Le rendu choisi en exprime la direction sans en faire une paraphrase doctrinale.
- issue: La portée de « revenus d’entre les morts »
  choice: Maintenir l’image de personnes vivantes issues d’entre les morts, sans décider si Paul vise uniquement une réalité spirituelle présente ou aussi l’espérance de la résurrection.
  alternative: « comme si Dieu vous avait ramenés de la mort à la vie »
  rationale: L’alternative explicite un agent et transforme la comparaison en paraphrase. Le texte retenu préserve la concision et la tension de l’expression grecque.
translation_notes:
  register: Français international moderne, clair et digne. « Les parties de votre corps » évite l’ambiguïté contemporaine de « vos membres ». La répétition de « mettez… à la disposition de » reproduit la structure insistante du grec, tandis que « armes » maintient son image vigoureuse de combat.
