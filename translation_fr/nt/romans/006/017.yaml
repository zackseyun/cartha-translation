id: ROM.6.17
reference: Romans 6:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: fr
  text: Mais grâce soit rendue à Dieu ! Vous étiez esclaves du péché, mais vous avez obéi de tout cœur au modèle d’enseignement[a] auquel[b] vous avez été livrés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à la forme d’enseignement » ou « à la norme d’enseignement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « dans lequel ».
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: Mais grâce soit rendue à Dieu !
  rationale: Dans cette formule idiomatique, χάρις exprime la reconnaissance adressée à Dieu. La tournure française conserve le ton de louange et le contraste introduit par δέ.
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: esclaves du péché
  rationale: « Esclaves » préserve l’image forte de domination et d’appartenance développée dans Romains 6, plutôt que de l’atténuer par « serviteurs ».
- source_word: ὑπηκούσατε
  choice: vous avez obéi
  rationale: Le verbe désigne une obéissance effective, et non une simple écoute.
- source_word: ἐκ καρδίας
  choice: de tout cœur
  rationale: Cette expression française naturelle rend l’idée d’une obéissance intérieure et sincère portée par l’image du cœur.
- source_word: τύπον διδαχῆς
  choice: modèle d’enseignement
  rationale: τύπος peut désigner un modèle, une forme ou une norme, tandis que διδαχή désigne un enseignement. « Modèle d’enseignement » reste clair tout en conservant l’image structurante.
- source_word: παρεδόθητε
  choice: vous avez été livrés
  rationale: 'Le passif et l’image frappante du texte grec sont maintenus : ce sont les croyants qui ont été remis ou livrés à ce modèle d’enseignement.'
- source_word: εἰς ὃν
  choice: auquel
  rationale: « Auquel » exprime naturellement en français la direction ou le transfert marqués par εἰς, sans exclure l’image plus concrète d’une entrée dans un moule.
theological_decisions:
- issue: Faut-il atténuer δοῦλοι en le traduisant par « serviteurs » ?
  choice: esclaves du péché
  alternative: serviteurs du péché
  rationale: Le contexte développe explicitement la domination exercée par le péché et le contraste entre deux formes d’esclavage. « Esclaves » conserve cette tension théologique.
- issue: Faut-il présenter l’enseignement comme remis aux croyants plutôt que les croyants comme livrés à l’enseignement ?
  choice: auquel vous avez été livrés
  alternative: qui vous a été transmis
  rationale: Le grec présente les destinataires comme sujets passifs d’un transfert vers le modèle d’enseignement. Conserver cette construction évite d’effacer l’image inhabituelle du texte.
- issue: Comment éviter de laisser entendre que Paul remercie Dieu du fait même qu’ils étaient esclaves du péché ?
  choice: 'Deux propositions contrastées : « Vous étiez…, mais vous avez obéi… »'
  alternative: « grâce soit rendue à Dieu de ce que vous étiez esclaves… »
  rationale: 'La ponctuation et la reprise du contraste rendent clairement la portée globale de ὅτι et δέ : l’action de grâce vise leur passage de l’ancien esclavage à l’obéissance, non leur esclavage passé en lui-même.'
translation_notes:
  register: Français international moderne, digne et accessible. « Grâce soit rendue à Dieu » conserve le ton doxologique de Paul; « de tout cœur » est idiomatique sans perdre l’accent sur l’intériorité. Les marqueurs de notes sont placés exactement sur les expressions concernées.
