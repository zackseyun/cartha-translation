id: ROM.6.14
reference: Romans 6:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: fr
  text: Car le péché ne dominera pas sur vous[a], puisque vous n’êtes pas sous la loi[b], mais sous la grâce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’exercera pas sa domination sur vous »; littéralement, le verbe évoque l’exercice d’une seigneurie.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « sous loi »; expression qui désigne le fait d’être sous l’autorité ou le régime de la loi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: le péché
  rationale: Le terme français courant conserve ici la personnification implicite du péché comme puissance dominatrice, sans lui ajouter une majuscule interprétative.
- source_word: κυριεύσει
  choice: ne dominera pas sur
  rationale: « Dominer sur » exprime naturellement l’exercice de la seigneurie ou de l’autorité porté par le verbe grec et maintient l’image du péché comme maître.
- source_word: ὑπὸ νόμον
  choice: sous la loi
  rationale: Cette formulation française rend l’expression paulinienne désignant la condition de ceux qui se trouvent sous l’autorité ou le régime de la loi. L’article est nécessaire en français idiomatique.
- source_word: χάριν
  choice: la grâce
  rationale: « Grâce » est le terme établi et contextuellement approprié dans l’opposition paulinienne entre loi et grâce; « faveur » affaiblirait ici la portée du contraste.
- source_word: γὰρ … γάρ
  choice: Car … puisque
  rationale: « Car » relie l’affirmation au contexte précédent; « puisque » introduit naturellement en français le motif explicatif de la seconde proposition.
theological_decisions:
- issue: Rendre explicitement ou non la personnification du péché
  choice: Garder « péché » en minuscule et employer « ne dominera pas sur vous ».
  alternative: « Le Péché ne sera pas votre maître » ou « le péché n’exercera pas sa domination sur vous »
  rationale: Le grec présente le péché comme une puissance qui règne, mais n’impose ni majuscule ni explicitation supplémentaire. La formulation choisie préserve l’image et sa tension théologique sans ajouter un cadre doctrinal.
- issue: Portée de l’expression « sous la loi »
  choice: Conserver « sous la loi » dans le texte et expliciter en note la notion d’autorité ou de régime.
  alternative: « soumis au régime de la loi »
  rationale: La formulation littérale reste claire et reconnaissable tout en préservant la densité de l’expression paulinienne; la paraphrase risquerait d’en fixer trop étroitement le sens.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme « sous la loi… sous la grâce » et la personnification discrète du péché. Les deux marqueurs de note figurent dans le texte.
