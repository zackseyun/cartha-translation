source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: fr
  text: Mais maintenant, libérés du péché et devenus esclaves de Dieu[a], vous portez un fruit qui conduit à la sanctification[b], et son aboutissement, c’est la vie éternelle[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ayant été faits esclaves de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « à la sainteté ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « la fin ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: Mais maintenant
  rationale: Conserve le contraste marqué avec la condition antérieure et reste naturel en français.
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: libérés du péché
  rationale: Le participe aoriste passif exprime une libération reçue et accomplie; le singulier « péché » préserve l’idée paulinienne d’une puissance ou d’un domaine.
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: devenus esclaves de Dieu
  rationale: Préserve la force de δουλόω et le contraste volontairement saisissant entre l’esclavage du péché et l’appartenance à Dieu.
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: vous portez un fruit
  rationale: Maintient la métaphore agricole de καρπός tout en rendant idiomatiquement l’idée présente de ἔχετε en français.
- source_word: εἰς ἁγιασμόν
  choice: qui conduit à la sanctification
  rationale: « Conduit à » rend l’orientation ou le résultat exprimé par εἰς; « sanctification » garde la portée théologique de ἁγιασμός.
- source_word: τὸ δὲ τέλος
  choice: et son aboutissement
  rationale: Dans ce contexte, τέλος désigne l’issue ou le résultat final du fruit évoqué, sans réduire le terme à une simple cessation.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Formulation française consacrée, exacte et immédiatement compréhensible.
theological_decisions:
- issue: Métaphore de l’esclavage par rapport à Dieu
  choice: Conserver « devenus esclaves de Dieu » dans le texte principal.
  alternative: devenus serviteurs de Dieu
  rationale: Paul construit son argument sur un changement de maître; adoucir la métaphore en « serviteurs » ferait perdre la force du parallèle avec l’esclavage du péché.
- issue: Sens de ἁγιασμός
  choice: Employer « sanctification ».
  alternative: sainteté
  rationale: Les deux sens sont possibles. « Sanctification » préserve mieux ici la nuance de processus ou de résultat vers lequel le fruit conduit, tandis que « sainteté » est signalé en note.
- issue: Sens de τέλος
  choice: Employer « aboutissement ».
  alternative: fin
  rationale: « Aboutissement » exprime clairement l’issue finale dans le mouvement de la phrase, mais « fin » demeure une traduction formellement plus proche et est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve les métaphores du péché comme puissance, de l’esclavage et du fruit, tout en évitant une syntaxe artificiellement calquée sur le grec.
