id: ROM.6.15
reference: Romans 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: fr
  text: Quoi donc ? Pécherions-nous parce que nous ne sommes pas sous la loi, mais sous la grâce ? Loin de là ![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Allons-nous pécher ? »'
    reason: Alternative de traduction du subjonctif délibératif ἁμαρτήσωμεν.
  - marker: b
    text: 'Ou : « Absolument pas ! »'
    reason: Autre manière de rendre la forte négation idiomatique μὴ γένοιτο.
lexical_decisions:
- source_word: Τί οὖν
  choice: Quoi donc ?
  rationale: Cette formule concise conserve la transition logique et interrogative de Paul sans ajouter l’idée de « dire », absente du grec.
- source_word: ἁμαρτήσωμεν
  choice: Pécherions-nous
  rationale: Le subjonctif aoriste est délibératif. Le conditionnel interrogatif français exprime naturellement l’éventualité proposée, sans en faire une affirmation ni une permission.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici le motif invoqué pour justifier la possibilité de pécher.
- source_word: ὑπὸ νόμον
  choice: sous la loi
  rationale: Cette tournure française naturelle maintient l’image d’être sous l’autorité de la loi. L’article est requis par l’usage français et ne vise pas à préciser davantage la portée de νόμος.
- source_word: ὑπὸ χάριν
  choice: sous la grâce
  rationale: « Grâce » est le terme français établi pour χάρις dans ce contraste paulinien, et la construction parallèle préserve l’opposition avec la loi.
- source_word: μὴ γένοιτο
  choice: Loin de là !
  rationale: Cette expression française actuelle et digne rend la vive répudiation de l’idée proposée, sans reproduire littéralement un idiome grec peu naturel en français.
theological_decisions:
- issue: Portée de νόμος dans le contraste paulinien
  choice: « sous la loi » sans préciser « loi de Moïse »
  alternative: « sous la loi de Moïse »
  rationale: Bien que le français exige normalement l’article dans cette expression, le texte ne précise pas ici explicitement « de Moïse ». La traduction conserve donc la tension et laisse le contexte déterminer la portée exacte du terme.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concise, suit le mouvement rhétorique du grec et évite de préciser au-delà du texte la nature de la loi.
source_grounding:
  english_pob_role: consult_only
