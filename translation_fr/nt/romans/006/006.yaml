id: ROM.6.6
reference: Romans 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: fr
  text: 'Nous le savons : l’être humain que nous étions autrefois a été crucifié avec lui, afin que le corps du péché soit réduit à l’impuissance[a] et que nous ne soyons plus esclaves du péché[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « soit rendu inopérant », « soit aboli » ou « soit réduit à rien ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « afin que nous ne servions plus le péché ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: Nous le savons
  rationale: Rend naturellement le participe circonstanciel et son lien avec le contexte précédent, sans trancher explicitement entre une valeur causale et une simple reprise de ce qui est connu.
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: l’être humain que nous étions autrefois
  rationale: Exprime l’ancienne condition humaine visée par l’idiome paulinien tout en évitant que « notre vieil homme » soit compris comme désignant un homme âgé ou seulement les personnes de sexe masculin.
- source_word: συνεσταυρώθη
  choice: a été crucifié avec lui
  rationale: Le complément « avec lui » restitue le préfixe συν- et le lien de participation à la crucifixion du Christ, implicite dans le contexte.
- source_word: καταργηθῇ
  choice: soit réduit à l’impuissance
  rationale: Exprime la neutralisation de la puissance opérante sans imposer l’idée plus forte d’une destruction ou d’une disparition totale.
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: le corps du péché
  rationale: Conserve le génitif compact et l’ambiguïté de l’expression grecque, plutôt que de préciser d’emblée « le corps pécheur » ou « le corps dominé par le péché ».
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: que nous ne soyons plus esclaves du péché
  rationale: Préserve l’image forte de l’asservissement contenue dans δουλεύειν et s’intègre naturellement à la proposition de but.
theological_decisions:
- issue: Portée anthropologique de ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: l’être humain que nous étions autrefois
  alternative: notre vieil homme
  rationale: Le choix principal rend le référent collectif et personnel de l’expression sans lui donner un sens exclusivement masculin. L’alternative plus formelle risque d’être opaque ou trompeuse en français moderne.
- issue: Force de καταργηθῇ appliqué au corps du péché
  choice: soit réduit à l’impuissance
  alternative: soit aboli / anéanti
  rationale: Cette formulation indique que son efficacité est neutralisée, sans affirmer plus que le grec quant à une éventuelle destruction ontologique.
- issue: Relation entre le corps et le péché dans τὸ σῶμα τῆς ἁμαρτίας
  choice: le corps du péché
  alternative: le corps dominé par le péché
  rationale: La formulation conserve la tension du génitif grec et n’identifie pas simplement le corps matériel au mal.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase évite l’archaïsme potentiellement trompeur « notre vieil homme », tout en conservant littéralement « le corps du péché » afin de ne pas résoudre l’ambiguïté paulinienne.
