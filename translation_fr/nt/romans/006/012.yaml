id: ROM.6.12
reference: Romans 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: fr
  text: Ne laissez donc pas le péché régner dans votre corps mortel, de sorte que vous obéissiez aux désirs de ce corps[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « de sorte que vous obéissiez aux désirs du péché » au lieu de « aux désirs de ce corps ».'
    reason: Lecture alternative possible de l’antécédent conceptuel de αὐτοῦ.
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement en français la conséquence tirée de l’argument précédent, sans alourdir la phrase.
- source_word: βασιλευέτω
  choice: ne laissez pas … régner
  rationale: Rend la défense à valeur continue tout en conservant l’image royale qui personnifie le péché comme une puissance dominatrice.
- source_word: ἡ ἁμαρτία
  choice: le péché
  rationale: Équivalent direct qui, associé au verbe « régner », préserve la personnification paulinienne sans ajout doctrinal.
- source_word: ἐν τῷ θνητῷ ὑμῶν σώματι
  choice: dans votre corps mortel
  rationale: Formulation concise et naturelle qui conserve à la fois le caractère corporel et la condition présente, soumise à la mort.
- source_word: εἰς τὸ ὑπακούειν
  choice: de sorte que vous obéissiez
  rationale: Préserve la nuance de conséquence ou de visée de la construction grecque sans trancher plus qu’elle ne le permet.
- source_word: ταῖς ἐπιθυμίαις
  choice: aux désirs
  rationale: « Désirs » garde l’étendue du terme grec et évite de le limiter indûment aux convoitises sexuelles.
- source_word: αὐτοῦ
  choice: de ce corps
  rationale: Explicite en français l’antécédent grammatical le plus naturel du pronom grec, σώματι, tout en signalant en note l’autre compréhension contextuelle possible.
theological_decisions:
- issue: Le péché est-il présenté seulement comme des actes ou comme une puissance régnante ?
  choice: 'Conserver la personnification : « le péché régner ».'
  alternative: Paraphraser comme le fait de se laisser dominer par des comportements pécheurs.
  rationale: Le vocabulaire royal du grec présente le péché comme une puissance dominatrice. L’image doit être maintenue sans recevoir d’explication doctrinale ajoutée.
- issue: Antécédent de αὐτοῦ
  choice: 'Comprendre le pronom comme renvoyant au « corps mortel » : « les désirs de ce corps ».'
  alternative: Comprendre contextuellement les désirs comme ceux du péché.
  rationale: La forme masculine ou neutre du pronom grec s’accorde naturellement avec le neutre singulier σῶμα et non avec le féminin ἁμαρτία. Le contexte permet néanmoins une association conceptuelle avec le péché, conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif « Ne laissez donc pas » est idiomatique tout en conservant la force exhortative et l’image du règne. La répétition de « corps » évite l’ambiguïté que créerait le possessif français « ses », puisque « péché » et « corps » sont tous deux masculins.
