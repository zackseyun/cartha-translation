  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: fr
  text: Car, lorsque vous étiez esclaves du péché, vous étiez libres à l’égard de la justice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « libres de la justice ».'
    reason: lecture alternative du datif τῇ δικαιοσύνῃ
lexical_decisions:
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le terme exprime ici un état d’asservissement et soutient le contraste de Romains 6 entre deux maîtrises rivales.
- source_word: ἁμαρτίας
  choice: du péché
  rationale: Le génitif présente le péché comme le maître ou le domaine auquel les personnes étaient asservies.
- source_word: ἐλεύθεροι
  choice: libres
  rationale: 'Ce choix conserve l’ironie tranchante de Paul : l’asservissement au péché correspondait à une liberté par rapport à la justice.'
- source_word: τῇ δικαιοσύνῃ
  choice: à l’égard de la justice
  rationale: Cette formulation rend naturellement le datif de relation ou de référence sans faire de la justice un maître oppressif.
- source_word: δικαιοσύνῃ
  choice: justice
  rationale: En français, « justice » est le terme courant et théologiquement adapté pour δικαιοσύνη dans ce contexte paulinien; il peut désigner la conformité à ce qui est juste.
- source_word: γὰρ
  choice: Car
  rationale: « Car » maintient le lien explicatif avec l’argument précédent dans un registre digne et naturel.
theological_decisions:
- issue: Expression du rapport à la justice dans le contraste de Paul
  choice: vous étiez libres à l’égard de la justice
  alternative: vous étiez libres de toute justice
  rationale: Le texte principal préserve le datif de relation et la tension rhétorique sans suggérer trop directement que la justice serait elle-même une puissance oppressive; la note conserve l’autre compréhension possible.
translation_notes:
  register: Français international moderne, clair et digne. « Esclaves » garde la force de la métaphore de Paul; « à l’égard de » préserve avec précision la relation ambiguë exprimée par le datif.
