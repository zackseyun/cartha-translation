id: ROM.1.8
reference: Romans 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: fr
  text: Tout d’abord, je remercie mon Dieu par Jésus le Messie[a] pour vous tous, parce que votre foi[b] est proclamée dans le monde entier.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus-Christ ».
    reason: alternative_reading
  - marker: b
    text: Ou « fidélité »; éventuellement « confiance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: Tout d’abord
  rationale: Cette tournure introduit naturellement en français le premier élément du propos de Paul; la particule μὲν est intégrée sans équivalent distinct.
- source_word: εὐχαριστῶ τῷ θεῷ μου
  choice: je remercie mon Dieu
  rationale: Rend directement l’action de grâce et conserve le ton personnel du possessif.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: par Jésus le Messie
  rationale: διά suivi du génitif exprime ici la médiation. « Messie » traduit le sens du titre Χριστός, avec l’article requis par l’usage français.
- source_word: περὶ πάντων ὑμῶν
  choice: pour vous tous
  rationale: Dans une formule d’action de grâce, « pour » est l’expression française naturelle de περί, tandis que « vous tous » préserve l’insistance inclusive.
- source_word: ἡ πίστις ὑμῶν
  choice: votre foi
  rationale: « Foi » est le sens le plus probable dans ce contexte, sans exclure les nuances de fidélité ou de confiance signalées en note.
- source_word: καταγγέλλεται
  choice: est proclamée
  rationale: Conserve la voix passive et la portée publique du verbe, tout en restant intelligible en français courant.
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: dans le monde entier
  rationale: Expression française idiomatique qui garde l’ampleur rhétorique de la formulation grecque.
theological_decisions:
- issue: Traduction de Χριστοῦ dans διὰ Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: « Messie » rend explicitement la valeur titulaire de Χριστός; la forme traditionnelle « Jésus-Christ » reste indiquée en note.
- issue: Sens de πίστις dans ἡ πίστις ὑμῶν
  choice: foi
  alternative: fidélité; éventuellement confiance
  rationale: Dans le contexte, « foi » désigne le plus naturellement la réponse croyante des destinataires, mais le champ sémantique grec permet aussi les nuances signalées.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la médiation exprimée par διά, la voix passive de καταγγέλλεται et la portée rhétorique de « dans le monde entier ».
