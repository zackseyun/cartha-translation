  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: fr
  text: médisants, ceux qui haïssent Dieu[a], insolents, orgueilleux, vantards, inventeurs de mauvaises actions, désobéissants à leurs parents,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « détestés de Dieu ». Le grec θεοστυγεῖς peut être compris activement, comme désignant ceux qui haïssent Dieu, ou passivement, comme désignant ceux que Dieu déteste.
    reason: alternative_reading
lexical_decisions:
- source_word: καταλάλους
  choice: médisants
  rationale: Le terme désigne ceux qui parlent contre autrui pour lui nuire. « Médisants » est naturel, concis et convient à cette liste de vices.
- source_word: θεοστυγεῖς
  choice: ennemis de Dieu
  rationale: Cette formulation exprime naturellement en français le sens actif probable, celui de personnes hostiles à Dieu, sans employer le peu idiomatique « haïsseurs de Dieu ».
- source_word: ὑβριστάς
  choice: insolents
  rationale: Le mot évoque une arrogance outrageante qui peut se manifester par des mauvais traitements. « Insolents » conserve cette attitude sans limiter le sens à la violence physique.
- source_word: ὑπερηφάνους
  choice: orgueilleux
  rationale: « Orgueilleux » rend clairement l'idée d'une haute opinion de soi et reste distinct du terme voisin décrivant la vantardise.
- source_word: ἀλαζόνας
  choice: vantards
  rationale: Le terme désigne des personnes qui se glorifient avec prétention. « Vantards » est bref, actuel et adapté à la série nominale.
- source_word: ἐφευρετὰς κακῶν
  choice: ingénieux à faire le mal
  rationale: La formule grecque décrit ceux qui imaginent ou inventent de nouvelles manières de faire le mal. Cette traduction est naturelle et conserve l'idée d'inventivité mauvaise.
- source_word: γονεῦσιν ἀπειθεῖς
  choice: désobéissants à leurs parents
  rationale: Cette formulation rend directement l'adjectif accompagné du datif et explicite naturellement la relation en français.
theological_decisions:
- issue: Sens de θεοστυγεῖς
  choice: 'sens actif : « ennemis de Dieu »'
  alternative: 'sens passif : « détestés de Dieu »'
  rationale: Dans cette liste, le sens actif décrit plus naturellement une disposition humaine envers Dieu. La forme ayant aussi été comprise passivement, cette possibilité réelle est conservée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. La structure brève de la liste grecque est conservée. « Ennemis de Dieu » évite une tournure artificielle tout en préservant le sens actif retenu; la lecture passive figure en note.
