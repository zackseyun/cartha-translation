  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: fr
  text: 'En effet, en lui se révèle la justice de Dieu[a], de foi en foi[b], comme il est écrit : « Le juste vivra par la foi[c]. »[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la droiture de Dieu ». On pourrait aussi comprendre : « la justice qui vient de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque traduite par « de foi en foi » est particulièrement difficile à interpréter. Elle peut aussi être comprise comme « par la foi, en vue de la foi » ou « par la foi du début à la fin ». La formulation du texte conserve les deux prépositions et la répétition du mot « foi » sans trancher entre les différentes interprétations.
    reason: alternative_reading
  - marker: c
    text: Ou « celui qui est juste par la foi vivra ».
    reason: alternative_reading
  - marker: d
    text: 'Le grec peut aussi être rendu : « Mais le juste vivra par la foi. »'
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Justice » est le terme français naturel et traditionnel dans l’expression paulinienne « justice de Dieu ». Il peut désigner à la fois la qualité ou l’action juste de Dieu et la justice liée à Dieu, sans imposer ici une interprétation unique.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le complément du nom reproduit sobrement le génitif grec et maintient ouverte la question de savoir s’il s’agit de la justice propre à Dieu, de son action juste ou d’une justice venant de lui.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Le pronom grec est neutre et renvoie le plus naturellement à l’Évangile mentionné au verset précédent. En français, « Évangile » étant masculin, « en lui » assure cette reprise grammaticale.
- source_word: ἀποκαλύπτεται
  choice: se révèle
  rationale: Cette tournure rend naturellement le présent passif grec sans préciser indûment si l’action est ponctuelle ou progressive.
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: de foi en foi
  rationale: Cette formulation conserve les deux prépositions, la répétition de πίστις et l’ambiguïté reconnue de l’expression, sans choisir entre progression, origine et but, fidélité et foi.
- source_word: δίκαιος
  choice: le juste
  rationale: L’adjectif substantivé singulier est rendu par une expression française concise, traditionnelle et représentative, sans ajout explicatif.
- source_word: ἐκ πίστεως
  choice: par la foi
  rationale: Dans la citation d’Habacuc, « par la foi » est idiomatique et permet de rattacher naturellement l’expression au verbe « vivra », tout en signalant en note l’autre rattachement syntaxique possible.
- source_word: ζήσεται
  choice: vivra
  rationale: Le futur simple restitue directement le futur grec et convient au registre élevé mais actuel d’une citation scripturaire.
theological_decisions:
- issue: Sens de δικαιοσύνη θεοῦ
  choice: la justice de Dieu
  alternative: la justice venant de Dieu ; la droiture de Dieu
  rationale: Le génitif grec est théologiquement discuté. La formulation retenue reste proche de la structure grecque et n’impose ni un génitif subjectif ni un génitif d’origine.
- issue: Sens de ἐκ πίστεως εἰς πίστιν
  choice: de foi en foi
  alternative: par la foi, en vue de la foi ; par la foi du début à la fin
  rationale: L’expression constitue une difficulté d’interprétation bien connue. Le texte principal en conserve le mouvement prépositionnel et la répétition plutôt que de trancher entre plusieurs explications plausibles.
- issue: Rattachement de ἐκ πίστεως dans la citation d’Habacuc
  choice: Le juste vivra par la foi
  alternative: Celui qui est juste par la foi vivra
  rationale: Le grec permet de rattacher « par la foi » soit à « juste », soit à « vivra ». Le texte principal suit la lecture française la plus naturelle, tandis que la note conserve l’autre possibilité.
- issue: Valeur de δὲ dans la citation
  choice: conjonction non exprimée dans le texte principal
  alternative: Mais le juste vivra par la foi
  rationale: Dans ce contexte, δὲ n’exprime pas nécessairement une opposition marquée. Omettre « mais » évite de créer en français un contraste trompeur, tout en signalant en note la formulation plus formelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec sans devenir artificielle. « En lui » renvoie à « l’Évangile » du verset précédent, nom masculin en français. La citation conserve une formulation brève et solennelle, mais emploie le futur courant « vivra » plutôt qu’une tournure archaïsante.
