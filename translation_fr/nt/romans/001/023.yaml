  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: fr
  text: Et ils ont échangé la gloire du Dieu impérissable[a] contre une image représentant[b] un être humain périssable[c], des oiseaux, des quadrupèdes et des animaux rampants[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « incorruptible ».
    reason: lexical_alternative
  - marker: b
    text: Litt. « dans la ressemblance d’une image de ».
    reason: lexical_alternative
  - marker: c
    text: Ou « un être humain mortel ».
    reason: lexical_alternative
  - marker: d
    text: Ou « des reptiles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: ont échangé… contre
  rationale: Cette tournure exprime clairement la substitution délibérée et rend naturellement en français la construction grecque avec ἐν.
- source_word: δόξαν
  choice: gloire
  rationale: « Gloire » est le terme français usuel et conserve ici l’idée de majesté divine opposée aux représentations idolâtres.
- source_word: ἀφθάρτου
  choice: impérissable
  rationale: Le mot indique que Dieu n’est pas sujet à la dégradation ni à la disparition; il forme aussi un contraste direct avec φθαρτοῦ.
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: contre une image représentant
  rationale: Cette formulation française naturelle conserve les deux idées grecques de représentation et de ressemblance, sans reproduire lourdement leur chevauchement lexical.
- source_word: φθαρτοῦ ἀνθρώπου
  choice: un être humain périssable
  rationale: « Être humain » rend le singulier générique ἄνθρωπος sans restriction de sexe, tandis que « périssable » maintient le contraste avec le Dieu impérissable.
- source_word: πετεινῶν
  choice: des oiseaux
  rationale: Équivalent français direct, clair et naturel.
- source_word: τετραπόδων
  choice: des quadrupèdes
  rationale: Terme français courant qui conserve précisément le sens d’animaux à quatre pattes.
- source_word: ἑρπετῶν
  choice: des animaux rampants
  rationale: Le grec désigne plus largement ce qui rampe et ne se limite pas nécessairement à la catégorie zoologique moderne des reptiles.
theological_decisions:
- issue: Contraste entre Dieu et les créatures représentées
  choice: « Dieu impérissable » / « être humain périssable »
  alternative: « Dieu incorruptible » / « être humain mortel »
  rationale: La répétition de la même famille sémantique en français préserve l’antithèse explicite du grec sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formulation privilégie une syntaxe naturelle tout en conservant le singulier « une image », le contraste impérissable/périssable et l’étendue possible de ἑρπετά.
