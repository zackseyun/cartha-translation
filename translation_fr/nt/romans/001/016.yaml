  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: fr
  text: 'Car je n’ai pas honte de la bonne nouvelle[a] : elle est en effet la puissance de Dieu pour le salut de toute personne qui croit, du Juif d’abord, et aussi du Grec[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’Évangile ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « Grec » peut désigner plus largement un non-Juif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: je n’ai pas honte
  rationale: Cette tournure française naturelle exprime le refus d’éprouver de la honte ou de reculer publiquement devant le message.
- source_word: εὐαγγέλιον
  choice: la bonne nouvelle
  rationale: « Bonne nouvelle » rend directement le sens lexical dans un français courant; « Évangile » demeure une possibilité traditionnelle signalée en note.
- source_word: δύναμις
  choice: la puissance
  rationale: « Puissance » exprime ici l’action efficace de Dieu en vue du salut et convient au registre digne du passage.
- source_word: εἰς σωτηρίαν
  choice: pour le salut
  rationale: Cette formulation claire conserve la valeur orientée vers le résultat de εἰς.
- source_word: παντὶ τῷ πιστεύοντι
  choice: de toute personne qui croit
  rationale: Après « puissance de Dieu », la construction avec « de » est idiomatique en français; elle conserve la portée distributive de παντί et la force verbale du participe πιστεύοντι.
- source_word: Ἰουδαίῳ
  choice: du Juif
  rationale: Dans l’opposition historico-religieuse avec Ἕλληνι, « Juif » convient mieux que le terme géographique « Judéen ».
- source_word: πρῶτον
  choice: d’abord
  rationale: « D’abord » conserve avec concision l’ordre exprimé par le grec sans en préciser artificiellement la nature.
- source_word: Ἕλληνι
  choice: du Grec
  rationale: Le texte nomme littéralement le « Grec »; ce choix maintient la transparence lexicale tandis qu’une note indique la portée non juive potentiellement plus large.
- source_word: τε ... καί
  choice: mais aussi
  rationale: Dans la corrélation « d’abord… mais aussi », cette formulation française marque naturellement l’ajout sans faire du contraste une opposition absolue.
theological_decisions:
- issue: Portée de Ἕλληνι dans « du Juif d’abord, mais aussi du Grec »
  choice: « Grec » dans le texte, avec en note son possible sens élargi de non-Juif
  alternative: « non-Juif » dans le texte principal
  rationale: Le choix retenu préserve le terme historique employé par Paul sans nier son emploi représentatif possible pour les peuples non juifs.
- issue: Nature de la priorité exprimée par πρῶτον
  choice: Conserver simplement « d’abord »
  alternative: Expliciter une priorité historique, missionnaire ou théologique
  rationale: Le verset affirme un ordre sans en développer ici toutes les dimensions; la traduction évite donc de résoudre cette tension par une précision ajoutée.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation rend visible le lien explicatif entre les deux propositions. « Toute personne » évite un masculin générique pesant tout en conservant l’universalité distributive; les marqueurs [a] et [b] figurent tous deux dans le texte.
