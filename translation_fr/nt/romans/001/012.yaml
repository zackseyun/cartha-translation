reference: Romans 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/012.yaml
  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: fr
  text: c’est-à-dire que je sois encouragé avec vous, parmi vous, par la foi partagée entre nous, la vôtre comme la mienne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: c’est-à-dire que
  rationale: Introduit naturellement en français la précision explicative apportée à l’énoncé précédent.
- source_word: συμπαρακληθῆναι
  choice: nous soyons encouragés ensemble
  rationale: Le verbe composé exprime un encouragement partagé. Le pluriel explicite en français la réciprocité ensuite précisée par « la vôtre comme la mienne », sans réduire l’action à un ministère à sens unique.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: 'Rend la valeur locale et sociale de l’expression : cet encouragement doit avoir lieu au milieu des croyants de Rome.'
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: par la foi que nous avons les uns et les autres
  rationale: Préserve à la fois le moyen exprimé par διά et la réciprocité de ἐν ἀλλήλοις dans un français idiomatique.
- source_word: πίστεως
  choice: foi
  rationale: Dans ce contexte, πίστις désigne la foi croyante de Paul et des destinataires plutôt que leur fidélité.
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: la vôtre comme la mienne
  rationale: Conserve l’équilibre entre la foi des destinataires et celle de Paul, tout en évitant une répétition pesante du mot « foi ».
theological_decisions:
- issue: Encouragement apostolique à sens unique ou encouragement réciproque
  choice: un encouragement réciproque entre Paul et les croyants de Rome
  alternative: principalement l’affermissement des croyants par Paul
  rationale: Le préfixe συν- de συμπαρακληθῆναι, la mention de la foi « les uns des autres » et la conclusion « la vôtre comme la mienne » indiquent une action partagée.
- issue: Sujet implicite de l’infinitif συμπαρακληθῆναι
  choice: un « nous » inclusif explicité en français
  alternative: 'Paul comme sujet singulier : « que je sois encouragé avec vous »'
  rationale: L’infinitif grec ne marque pas lui-même le nombre de son sujet. Le contexte immédiat part de Paul, mais la forme composée et la foi des deux parties rendent possible et naturel un sujet inclusif. Le français « nous soyons encouragés ensemble » exprime clairement cette mutualité sans nier la perspective de Paul.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste liée au verset précédent par « c’est-à-dire que » et privilégie une syntaxe naturelle sans atténuer la réciprocité du grec.
