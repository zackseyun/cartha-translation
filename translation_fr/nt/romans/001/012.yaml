  to: c’est-à-dire que je sois encouragé avec vous, parmi vous, par la foi partagée entre nous, la vôtre comme la mienne.
  rationale: La révision remplace le sujet inclusif explicite par le singulier contextuel de Paul. « Avec vous » rend la force conjointe de συμπαρακληθῆναι, tandis que « parmi vous » conserve ἐν ὑμῖν. La foi est présentée comme partagée entre Paul et les destinataires, puis précisée par « la vôtre comme la mienne ».
  reviewer_model: gpt-5.6-terra
