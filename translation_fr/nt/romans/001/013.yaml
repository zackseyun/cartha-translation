  to: 'Je ne veux pas que vous l’ignoriez, frères[a] : j’ai souvent projeté de venir chez vous, mais j’en ai été empêché jusqu’à présent, afin de recueillir quelque fruit parmi vous aussi[b], comme parmi les autres non-Juifs[c].'
  rationale: La révision rétablit la proposition de but, conserve le singulier indéfini de la métaphore du fruit et traduit ἀδελφοί de manière formelle tout en conservant en note l’éventuelle portée inclusive. Les ancres de notes restent correctement placées après les expressions qu’elles éclairent.
