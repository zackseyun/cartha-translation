    rationale: « Je voulais ainsi obtenir » ne traduit pas avec assez de précision ἵνα ... σχῶ, qui exprime le but des visites projetées. « Afin de recueillir » préserve ce rapport final.
  - severity: low
    issue: Le nom « fruits » est au pluriel.
    rationale: Le grec porte τινὰ καρπόν, un singulier indéfini. « Quelque fruit » est à la fois plus proche du texte et idiomatique.
  - severity: low
    issue: Le texte principal explicite « frères et sœurs » alors que le grec emploie le masculin ἀδελφοί.
    rationale: Une note peut signaler l’inclusion contextuelle sans remplacer dans le texte l’adresse formellement masculine.
