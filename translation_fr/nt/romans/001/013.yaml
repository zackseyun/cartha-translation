id: ROM.1.13
reference: Romans 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: fr
  text: 'Je ne veux pas que vous l’ignoriez, frères[a] : j’ai souvent projeté de venir chez vous, mais j’en ai été empêché jusqu’à présent, afin de recueillir quelque fruit parmi vous aussi[b], comme parmi les autres non-Juifs[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « frères » ; dans ce contexte, le terme grec peut désigner l’ensemble des croyants, hommes et femmes.'
    reason: lexical_alternative
  - marker: b
    text: Les « fruits » peuvent désigner ici les résultats du ministère de Paul parmi eux.
    reason: cultural_note
  - marker: c
    text: 'Ou : « les autres nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: Je ne veux pas que vous l’ignoriez
  rationale: Cette formulation française naturelle conserve la structure négative de la formule grecque sans ajouter de marqueur temporel absent du texte source.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans cette adresse à l’ensemble de la communauté chrétienne de Rome, le masculin pluriel grec inclut vraisemblablement les croyants des deux sexes ; la formulation explicite ce sens collectif en français moderne.
- source_word: πολλάκις προεθέμην
  choice: j’ai souvent projeté
  rationale: « Projeter » exprime une intention arrêtée et répétée, tandis que le passé composé convient à des projets antérieurs ayant encore une incidence au moment où Paul écrit.
- source_word: ἐκωλύθην
  choice: j’en ai été empêché
  rationale: Le passif est conservé et laisse, comme le grec, l’origine de l’empêchement indéterminée.
- source_word: ἄχρι τοῦ δεῦρο
  choice: jusqu’à présent
  rationale: Équivalent idiomatique et précis de l’expression temporelle grecque.
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: Je voulais ainsi obtenir quelques fruits
  rationale: La formulation conserve la métaphore agricole de Paul et rend la finalité de sa venue en français naturel.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Le contexte collectif favorise le sens relationnel « parmi vous », sans exclure les effets du ministère dans la communauté.
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: les autres non-Juifs
  rationale: Dans ce contexte missionnaire paulinien, ἔθνη désigne naturellement les peuples non juifs ; « autres » implique que les destinataires romains appartiennent eux aussi à ce champ de mission.
theological_decisions:
- issue: Portée de ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: L’adresse vise vraisemblablement toute l’assemblée, composée d’hommes et de femmes. Le français explicite cette portée inclusive sans modifier le référent communautaire.
- issue: Sens de ἔθνη
  choice: non-Juifs
  alternative: nations
  rationale: Le contexte de l’apostolat de Paul et la comparaison avec les croyants de Rome rendent ici le sens ethnoreligieux plus probable que le sens géopolitique, tout en signalant l’alternative en note.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore des fruits et le passif indéterminé sont préservés. La ponctuation répartit la longue phrase grecque en deux phrases pour faciliter la lecture sans rompre le lien logique.
