id: ROM.1.25
reference: Romans 1:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: fr
  text: eux qui ont échangé la vérité de Dieu contre le mensonge, et qui ont vénéré et servi la création plutôt que le Créateur, qui est béni pour toujours. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν
  choice: ont échangé
  rationale: Rend directement l’idée d’un remplacement volontaire, en continuité avec le contraste entre vérité et mensonge.
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: la vérité de Dieu
  rationale: Conserve le génitif grec, qui peut désigner la vérité concernant Dieu ou celle qui vient de lui, sans trancher inutilement.
- source_word: ἐν τῷ ψεύδει
  choice: contre le mensonge
  rationale: Dans cette construction avec μεταλλάσσω, « contre » exprime naturellement en français ce qui est reçu en échange; l’article défini est conservé.
- source_word: ἐσεβάσθησαν
  choice: ont vénéré
  rationale: Distingue l’attitude de révérence religieuse du service cultuel exprimé ensuite par ἐλάτρευσαν.
- source_word: ἐλάτρευσαν
  choice: servi
  rationale: Traduit le service religieux ou cultuel sans alourdir le texte; la coordination avec « vénéré » préserve les deux verbes grecs.
- source_word: τῇ κτίσει
  choice: la création
  rationale: Rend le contraste lexical direct avec « le Créateur »; le terme peut englober les choses créées.
- source_word: παρὰ τὸν κτίσαντα
  choice: plutôt que le Créateur
  rationale: Dans ce contexte comparatif, exprime clairement que la création reçoit l’honneur et le service dus au Créateur.
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: béni pour toujours
  rationale: Formule française naturelle et digne pour la doxologie, gardant sa portée sans fin.
theological_decisions:
- issue: Sens du génitif « vérité de Dieu »
  choice: Conserver « de Dieu »
  alternative: « la vérité concernant Dieu »
  rationale: Le grec permet plusieurs nuances; la formulation retenue préserve cette densité théologique.
- issue: Rapport entre création et Créateur
  choice: « plutôt que le Créateur »
  alternative: « au lieu du Créateur » ou « plus que le Créateur »
  rationale: Le contexte décrit une substitution idolâtre; « plutôt que » la communique sans introduire une théorie plus précise sur la valeur comparative de παρά.
- issue: Doxologie appliquée au Créateur
  choice: « qui est béni pour toujours »
  alternative: « lui qui est béni éternellement »
  rationale: Suit explicitement le relatif grec et conserve l’affirmation doxologique sans amplification.
translation_notes:
  register: Français international moderne, clair et digne. La paire « vénéré et servi » maintient la distinction entre révérence et service cultuel. La phrase reste proche de la structure grecque tout en étant idiomatique.
