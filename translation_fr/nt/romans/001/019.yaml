id: ROM.1.19
reference: Romans 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: fr
  text: car ce qu’on peut connaître de Dieu est manifeste parmi eux[a], puisque Dieu le leur a manifesté.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en eux » ou « au-dedans d’eux ».
    reason: Le grec ἐν αὐτοῖς peut désigner ce qui se trouve parmi un groupe ou ce qui est intérieurement présent en ses membres.
lexical_decisions:
- source_word: διότι
  choice: car
  rationale: Introduit la raison de l’affirmation précédente et assure une liaison causale naturelle en français.
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: ce qu’on peut connaître de Dieu
  rationale: L’adjectif neutre substantivé désigne ici ce qui est connaissable au sujet de Dieu; cette formulation française garde cette portée sans réduire le sens à ce qui est déjà effectivement connu.
- source_word: φανερόν
  choice: manifeste
  rationale: Exprime ce qui est rendu évident ou accessible et permet de conserver le lien lexical avec le verbe ἐφανέρωσεν.
- source_word: ἐν αὐτοῖς
  choice: parmi eux
  rationale: Rend naturellement le sens collectif ou public possible de la préposition ἐν; le sens intérieur, également possible, est signalé en note.
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: puisque Dieu le leur a manifesté
  rationale: Conserve le sujet explicite, le destinataire et la correspondance entre φανερόν et ἐφανέρωσεν; « puisque » exprime ici la justification donnée par γάρ sans répétition lourde de « car ».
theological_decisions:
- issue: Sens de ἐν αὐτοῖς
  choice: parmi eux
  alternative: en eux / au-dedans d’eux
  rationale: Le grec permet une compréhension collective aussi bien qu’intérieure. Le texte principal retient la lecture collective, compatible avec la révélation publiquement accessible évoquée dans le contexte, tout en préservant l’autre possibilité dans une note.
- issue: Portée de τὸ γνωστὸν
  choice: ce qu’on peut connaître
  alternative: ce qui est connu
  rationale: La formulation retenue exprime le domaine de la connaissance de Dieu accessible aux humains, sans affirmer plus précisément que tout ce domaine est déjà subjectivement connu de chacun.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition « manifeste / manifesté » est volontaire: elle reflète le lien lexical du grec et souligne que l’évidence résulte de l’action révélatrice de Dieu.'
