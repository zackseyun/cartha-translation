  text: φάσκοντες εἶναι σοφοὶ ἐμωράνθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/022.yaml
  text: Claiming to be wise[a], they became fools[b],
translation:
  language: fr
  text: Se prétendant sages[a], ils sont devenus fous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Affirmant être sages ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « ils sont devenus insensés » ; autre traduction possible : « ils ont été rendus fous ».'
    reason: lexical_and_voice_alternative
lexical_decisions:
- source_word: φάσκοντες
  choice: Se prétendant
  rationale: Le participe présent exprime l’affirmation qu’ils font à leur propre sujet. « Se prétendant » est naturel en français moderne et conserve la nuance ironique du contexte.
- source_word: εἶναι
  choice: être
  rationale: L’infinitif introduit directement le contenu de leur prétention.
- source_word: σοφοὶ
  choice: sages
  rationale: L’adjectif prédicatif est rendu simplement et garde l’opposition concise avec « fous ».
- source_word: ἐμωράνθησαν
  choice: ils sont devenus fous
  rationale: Cette formulation rend la valeur résultative du verbe et préserve la vigueur de l’antithèse entre la sagesse revendiquée et la folie qui en résulte, sans préciser une cause que le grec laisse implicite.
theological_decisions:
- issue: Faut-il rendre ἐμωράνθησαν par une qualité (« sont devenus insensés »), par une désignation plus forte (« sont devenus fous ») ou par un passif causatif (« ont été rendus fous ») ?
  choice: ils sont devenus fous
  alternative: ils sont devenus insensés ; ils ont été rendus fous
  rationale: « Ils sont devenus fous » restitue l’antithèse incisive de Paul et la valeur ingressive ou résultative du verbe. Cette traduction ne tranche pas explicitement la question de l’agent éventuel, que la forme grecque ne nomme pas.
translation_notes:
  register: Français international moderne, concis et digne. « Se prétendant » conserve l’ironie sans lourdeur, tandis que « fous » maintient la force rhétorique du contraste grec. Les variantes signalent à la fois l’alternative lexicale et l’ambiguïté de voix de ἐμωράνθησαν.
