id: ROM.1.21
reference: Romans 1:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: fr
  text: En effet, bien qu’ils aient connu Dieu, ils ne l’ont pas glorifié comme Dieu ni ne lui ont rendu grâce ; mais ils se sont égarés dans leurs raisonnements[a], et leur cœur[b] sans intelligence a été obscurci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pensées », « réflexions » ou « spéculations ».
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie « cœur » au singulier.
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: En effet
  rationale: Introduit l’explication de l’affirmation précédente tout en conservant un enchaînement naturel en français.
- source_word: γνόντες τὸν θεόν
  choice: bien qu’ils aient connu Dieu
  rationale: 'Rend la valeur concessive du participe dans ce contexte : malgré leur connaissance de Dieu, ils n’ont pas réagi comme il convenait.'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: ils ne l’ont pas glorifié comme Dieu
  rationale: Conserve le poids de δοξάζω et l’idée qu’ils n’ont pas reconnu à Dieu la gloire qui lui revient en tant que Dieu.
- source_word: ἢ ηὐχαρίστησαν
  choice: et ne lui ont pas rendu grâce
  rationale: « Rendre grâce » exprime naturellement en français l’action de manifester sa reconnaissance à Dieu. La coordination négative française emploie ici « et ne… pas » sans modifier le sens du grec ἢ.
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: leurs raisonnements sont devenus vains
  rationale: La restructuration syntaxique produit un français naturel tout en conservant le devenir exprimé par le passif et la notion de vanité ou de futilité attachée à leurs raisonnements.
- source_word: ἐσκοτίσθη
  choice: a été obscurci
  rationale: Maintient la voix passive et la métaphore de l’obscurcissement moral et intellectuel.
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: leur cœur dépourvu d’intelligence
  rationale: ἀσύνετος désigne ici l’absence de compréhension ou de discernement, non un simple déficit intellectuel. Le singulier collectif « cœur » est conservé.
theological_decisions:
- issue: Valeur circonstancielle de γνόντες
  choice: bien qu’ils aient connu Dieu
  alternative: ayant connu Dieu ; lorsqu’ils ont connu Dieu
  rationale: Le contexte favorise une lecture concessive qui souligne leur responsabilité malgré leur connaissance de Dieu, sans préciser davantage la nature ou l’étendue de cette connaissance.
- issue: Agent implicite des passifs ἐματαιώθησαν et ἐσκοτίσθη
  choice: conserver le résultat passif sans nommer d’agent
  alternative: présenter explicitement Dieu comme l’agent, ou employer uniquement des formulations actives et réfléchies
  rationale: Le grec ne nomme pas l’agent. La traduction évite donc de trancher si le phénomène est présenté comme jugement divin, conséquence interne, ou les deux.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve le contraste logique et les métaphores de la vanité et de l’obscurcissement, tout en restructurant légèrement la première tournure passive pour éviter un calque peu naturel.
