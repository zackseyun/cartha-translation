    rationale: « et ne lui ont pas rendu grâce » est possible en français, mais « ni ne lui ont rendu grâce » reflète plus précisément la coordination négative « ne… ni… ni… » correspondant à οὐχ … ἢ ….
  - severity: low
    issue: Intensité de « au contraire » pour ἀλλά
    rationale: ἀλλά marque un contraste fort, mais « mais » le rend sans ajouter la nuance plus explicitement antithétique de « au contraire ».
  - severity: low
    issue: Rendu de ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
    rationale: La version actuelle inverse sujet et verbe et ne conserve plus la forme passive. « Ils se sont égarés dans leurs raisonnements » est un rendu français naturel qui maintient l’absence d’agent explicite et le caractère de dérive ou de vanité exprimé par le verbe.
