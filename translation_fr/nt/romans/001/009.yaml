id: ROM.1.9
reference: Romans 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: fr
  text: Car Dieu, que je sers dans mon esprit dans la bonne nouvelle de son Fils, m’est témoin que je fais continuellement mention de vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς
  choice: témoin
  rationale: Dans cette formule solennelle, Paul prend Dieu à témoin de la véracité de son affirmation.
- source_word: λατρεύω
  choice: je rends un culte
  rationale: Le verbe désigne un service rendu à Dieu et comporte ici une dimension cultuelle; cette formulation la conserve mieux que le simple « servir ».
- source_word: ἐν τῷ πνεύματί μου
  choice: dans mon esprit
  rationale: Cette traduction préserve la construction grecque et son ambiguïté entre sphère intérieure et manière de servir.
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: en annonçant la bonne nouvelle de son Fils
  rationale: Dans ce contexte de ministère, la tournure française explicite naturellement l’activité liée à l’Évangile, tout en conservant le génitif « de son Fils » sans décider s’il indique principalement le contenu ou l’origine.
- source_word: ἀδιαλείπτως
  choice: continuellement
  rationale: Le terme exprime la constance ou la régularité soutenue, sans nécessairement signifier une action ininterrompue à chaque instant.
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: je fais mention de vous
  rationale: Cette formulation reste proche de l’idiome grec et évite de préciser implicitement « dans mes prières », qui n’apparaît qu’au verset suivant.
theological_decisions:
- issue: Sens de λατρεύω dans le service de Paul
  choice: je rends un culte
  alternative: je sers
  rationale: Le contexte concerne le ministère de Paul, mais le verbe possède une forte nuance religieuse. « Rendre un culte » garde cette nuance sans réduire le propos à une activité ordinaire.
- issue: Rapport de « la bonne nouvelle » au Fils
  choice: la bonne nouvelle de son Fils
  alternative: la bonne nouvelle concernant son Fils
  rationale: Le génitif grec peut désigner notamment le contenu ou le rapport au Fils. La formulation retenue préserve cette ouverture au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure solennelle de l’appel à Dieu comme témoin, tout en plaçant les compléments de manière naturelle en français.
