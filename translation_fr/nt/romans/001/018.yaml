id: ROM.1.18
reference: Romans 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: fr
  text: En effet, la colère de Dieu se révèle[a] du ciel contre toute impiété et toute injustice des êtres humains[b] qui étouffent[d] la vérité par l’injustice[c][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est révélée ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec désigne ici les êtres humains en général.
    reason: lexical_clarification
  - marker: c
    text: 'Ou : « dans l’injustice ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « retiennent », « maintiennent captive » ou « répriment ».'
    reason: lexical_alternative
  - marker: e
    text: 'Autre traduction possible : « contre toute impiété et toute injustice des êtres humains qui étouffent la vérité dans l’injustice ».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: se révèle
  rationale: Le présent « se révèle » rend naturellement en français le présent passif grec et peut exprimer une manifestation en cours, sans alourdir la phrase par « est en train d’être révélée ».
- source_word: γὰρ
  choice: En effet
  rationale: Cette locution introduit naturellement en français l’explication qui fonde l’affirmation précédente.
- source_word: ὀργὴ θεοῦ
  choice: la colère de Dieu
  rationale: Rend directement le génitif et conserve la force personnelle et judiciaire de ὀργή, sans la réduire à une conséquence impersonnelle.
- source_word: ἀπ’ οὐρανοῦ
  choice: du ciel
  rationale: Expression française concise indiquant l’origine céleste de la révélation.
- source_word: πᾶσαν ἀσέβειαν
  choice: toute impiété
  rationale: « Impiété » exprime le refus de l’honneur dû à Dieu et convient au registre digne du passage.
- source_word: ἀδικίαν
  choice: toute injustice
  rationale: « Injustice » conserve ici la portée morale et relationnelle de ἀδικία, sans la restreindre à la seule injustice sociale ou judiciaire.
- source_word: ἀνθρώπων
  choice: des êtres humains
  rationale: Le grec désigne ici les humains en général, et non les hommes de sexe masculin seulement.
- source_word: τῶν ... κατεχόντων
  choice: qui étouffent
  rationale: Dans ce contexte, κατέχω évoque l’action d’empêcher la vérité de se manifester ou d’exercer son effet. « Étouffent » est actuel et idiomatique, tandis que « retiennent » reste signalé en note.
- source_word: τὴν ἀλήθειαν
  choice: la vérité
  rationale: Équivalent direct, sans restriction interprétative ajoutée.
- source_word: ἐν ἀδικίᾳ
  choice: par l’injustice
  rationale: 'Le syntagme peut exprimer le moyen ou la manière : l’injustice sert à étouffer la vérité. La lecture locative ou sphérique « dans l’injustice » demeure possible et est conservée en note.'
theological_decisions:
- issue: Faut-il atténuer ὀργὴ θεοῦ en une conséquence morale impersonnelle ?
  choice: « la colère de Dieu », comprise comme la réaction judiciaire propre à Dieu
  alternative: une conséquence impersonnelle inhérente au mal
  rationale: Le génitif θεοῦ et l’argumentation de Paul présentent la colère comme venant de Dieu. La traduction garde cette portée sans développer davantage sa nature.
- issue: Valeur de ἐν dans ἐν ἀδικίᾳ
  choice: 'valeur instrumentale ou modale : « par l’injustice »'
  alternative: 'valeur sphérique : « dans l’injustice »'
  rationale: Les deux analyses sont grammaticalement possibles. Le texte principal retient la formulation française la plus claire, tandis que la note préserve l’ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. « En effet » garde le lien argumentatif sans archaïsme. « Impiété » est un terme soutenu mais courant dans le registre biblique; « étouffent la vérité » rend l’image avec netteté. La répétition d’« injustice », présente deux fois dans le grec, est volontairement conservée.
