  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: fr
  text: Je suis redevable envers les Grecs comme envers les barbares[a], envers les sages comme envers les insensés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étrangers » ou « non-Grecs ». Ici, « barbares » reprend le contraste culturel courant dans le monde grec entre les Grecs et les autres peuples, sans nécessairement suggérer la sauvagerie.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: Grecs
  rationale: Le datif pluriel désigne les Grecs comme catégorie ethnique et culturelle et forme le premier terme du contraste conventionnel avec βαρβάροις.
- source_word: βαρβάροις
  choice: barbares
  rationale: Ce terme conserve le contraste culturel grec ancien entre les Grecs et les peuples non grecs. Une note prévient le lecteur que le mot n’évoque pas nécessairement ici la sauvagerie au sens moral moderne.
- source_word: σοφοῖς
  choice: sages
  rationale: Équivalent direct et naturel, qui maintient le contraste symétrique avec ἀνοήτοις.
- source_word: ἀνοήτοις
  choice: insensés
  rationale: « Insensés » exprime le manque de discernement impliqué par le terme et s’oppose naturellement à « sages », sans le réduire au seul manque d’instruction.
- source_word: ὀφειλέτης
  choice: je me dois
  rationale: Cette tournure française rend l’idée d’une dette ou obligation personnelle envers les groupes nommés, tout en évitant de suggérer une dette financière.
- source_word: τε ... καὶ / τε ... καὶ
  choice: aussi bien ... que ... / aussi bien ... que ...
  rationale: La répétition préserve les deux constructions corrélatives et la cadence équilibrée du grec.
