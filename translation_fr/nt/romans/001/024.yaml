- from: C’est pourquoi Dieu les a livrés, dans les désirs de leur cœur, à l’impureté, de sorte que leurs corps soient déshonorés entre eux.[a]
  to: C’est pourquoi Dieu les a livrés, selon les désirs de leur cœur, à l’impureté, pour le déshonneur de leurs corps entre eux.[a]
  rationale: La révision conserve tous les éléments lexicaux et la réserve interprétative du projet, mais remplace une conséquence finie stylistiquement maladroite par une construction nominale plus proche de l’infinitif grec. Elle améliore également l’idiomaticité de la première expression prépositionnelle.
