review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement la chaîne argumentative (Διὸ), l’action forte de παρέδωκεν (« les a livrés »), l’impureté, les corps et l’ambiguïté de ἐν αὐτοῖς. Toutefois, « de sorte que leurs corps soient déshonorés » transforme l’infinitif articulé en proposition de conséquence et introduit une formulation temporellement et stylistiquement moins heureuse après le passé composé. Une formulation nominale rend plus directement τοῦ ἀτιμάζεσθαι.
  naturalness: « Dans les désirs de leur cœur » est compréhensible mais peu idiomatique en français moderne dans cette construction. « Selon les désirs de leur cœur » conserve l’idée de cadre/opération des désirs tout en étant plus naturel. « Pour le déshonneur de leurs corps entre eux » est soutenu mais clair et convient au registre biblique moderne.
  terminology: « Dieu les a livrés », « désirs », « cœur », « impureté » et « corps » sont justes et ne surinterprètent pas le texte. « Entre eux » est un rendu défendable de ἐν αὐτοῖς, à condition que les autres possibilités demeurent signalées en note.
  issues:
