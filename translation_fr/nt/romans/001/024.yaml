    issue: La proposition « de sorte que leurs corps soient déshonorés » est une reformulation moins fidèle et moins naturelle de τοῦ ἀτιμάζεσθαι.
    rationale: Le grec emploie un infinitif passif articulé. Le groupe nominal « pour le déshonneur de » le reflète de plus près et évite le subjonctif après une conséquence introduite par « de sorte que ».
  - severity: low
    issue: « Dans les désirs de leur cœur » est trop calqué sur le grec pour un français international fluide.
    rationale: « Selon les désirs de leur cœur » exprime naturellement le cadre ou l’influence des désirs sans réduire ἐν à une interprétation doctrinale.
  revised_text: C’est pourquoi Dieu les a livrés, selon les désirs de leur cœur, à l’impureté, pour le déshonneur de leurs corps entre eux.[a]
