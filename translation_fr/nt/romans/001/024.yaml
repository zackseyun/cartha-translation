id: ROM.1.24
reference: Romans 1:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: fr
  text: C’est pourquoi Dieu les a livrés, selon les désirs de leur cœur, à l’impureté, pour le déshonneur de leurs corps entre eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi eux »; peut-être « en eux-mêmes ».
    reason: La formule grecque ἐν αὐτοῖς est concise et peut recevoir une interprétation réciproque, collective ou réflexive.
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Marque la conséquence tirée de l’argument précédent et rend naturellement le lien logique en français moderne.
- source_word: παρέδωκεν
  choice: les a livrés
  rationale: Conserve l’idée forte de remettre des personnes au pouvoir d’une réalité, sans ajouter une interprétation doctrinale telle que « les a abandonnés ».
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: dans les désirs de leur cœur
  rationale: Préserve la préposition et présente les désirs intérieurs comme la sphère dans laquelle cette remise s’opère.
- source_word: ἐπιθυμίαις
  choice: désirs
  rationale: Terme assez large pour ne pas réduire d’emblée le grec aux seuls désirs sexuels.
- source_word: καρδιῶν
  choice: cœur
  rationale: Maintient l’anthropologie biblique tout en restant idiomatique en français; le singulier distributif convient après « leur ».
- source_word: ἀκαθαρσίαν
  choice: impureté
  rationale: Équivalent moderne et naturel qui garde la portée morale du terme.
- source_word: τοῦ ἀτιμάζεσθαι
  choice: de sorte que … soient déshonorés
  rationale: Rend lisiblement l’infinitif passif articulé et sa valeur de conséquence ou de résultat, sans en faire une simple coordination.
- source_word: τὰ σώματα αὐτῶν
  choice: leurs corps
  rationale: Reproduit directement l’accent concret du texte sur les corps.
- source_word: ἐν αὐτοῖς
  choice: entre eux
  rationale: Rend le sens réciproque ou relationnel le plus probable dans le contexte, tout en signalant en note l’ambiguïté réelle de la formule.
theological_decisions:
- issue: Faut-il expliciter παρέδωκεν comme un abandon ou un jugement divin?
  choice: Dieu les a livrés
  alternative: Dieu les a abandonnés; Dieu les a jugés en les livrant
  rationale: Le texte affirme une action divine de remise, mais n’explicite pas ici toutes ses catégories doctrinales. La formulation retenue conserve sa force et sa tension sans ajouter de systématisation.
- issue: Valeur de τοῦ ἀτιμάζεσθαι
  choice: conséquence exprimée par « de sorte que »
  alternative: but exprimé par « afin que »; formulation nominale « pour le déshonneur de »
  rationale: La construction peut toucher au but ou au résultat. En contexte, « de sorte que » donne un français naturel et préserve la conséquence sans attribuer trop explicitement à Dieu l’intention de déshonorer.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le vocabulaire biblique de « cœur », « impureté » et « corps », tout en évitant les archaïsmes et les gloses confessionnelles.
