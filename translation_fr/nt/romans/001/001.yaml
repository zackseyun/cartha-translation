id: ROM.1.1
reference: Romans 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: fr
  text: Paul, esclave[a] de Jésus le Messie[b], appelé à être apôtre[c], mis à part pour la bonne nouvelle de Dieu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur »; le grec désigne une personne placée sous l’autorité et appartenant à un maître.
    reason: lexical_alternative
  - marker: b
    text: Ou « Christ Jésus ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « apôtre appelé »; on peut aussi comprendre « appelé comme apôtre ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: Paul
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: δοῦλος
  choice: esclave
  rationale: Rend explicitement la dépendance et l’appartenance impliquées par le grec, plus fortement que « serviteur ».
- source_word: Χριστοῦ Ἰησοῦ
  choice: de Jésus le Messie
  rationale: « Messie » traduit la valeur titulaire de Χριστός; l’ordre est adapté pour produire une désignation naturelle en français.
- source_word: κλητὸς ἀπόστολος
  choice: appelé à être apôtre
  rationale: Formulation française naturelle qui exprime la vocation apostolique, tout en signalant en note la construction grecque plus compacte.
- source_word: ἀφωρισμένος
  choice: mis à part
  rationale: Conserve le sens passif du participe ainsi que l’idée de séparation en vue d’une mission.
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: pour la bonne nouvelle de Dieu
  rationale: « Pour » exprime ici la destination ou le but; « bonne nouvelle » restitue le sens lexical de εὐαγγέλιον dans une langue moderne et accessible.
theological_decisions:
- issue: Valeur de Χριστός dans l’identification de Jésus
  choice: Jésus le Messie
  alternative: Jésus-Christ / Christ Jésus
  rationale: Le terme garde ici sa valeur de titre messianique; le traduire évite d’en faire silencieusement un simple élément de nom.
- issue: Force de δοῦλος
  choice: esclave
  alternative: serviteur
  rationale: « Esclave » préserve la relation d’appartenance exprimée par le terme grec, sans l’atténuer; « serviteur » reste une possibilité de registre indiquée en note.
- issue: Construction κλητὸς ἀπόστολος
  choice: appelé à être apôtre
  alternative: apôtre appelé
  rationale: La formulation retenue est idiomatique en français, mais l’ajout syntaxique de « à être » explicite le rapport entre les deux mots; la note conserve la formulation plus proche de la structure grecque.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve la structure d’ouverture épistolaire et sa virgule finale, puisque le verset se poursuit. Les termes à forte portée théologique sont rendus sans surcharge confessionnelle, avec les principales ambiguïtés signalées en notes.
