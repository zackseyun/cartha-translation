id: ROM.1.2
reference: Romans 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃ προεπηγγείλατο διὰ τῶν προφητῶν αὐτοῦ ἐν γραφαῖς ἁγίαις
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/002.yaml
  text: which he promised beforehand through his prophets in the holy Scriptures,[a]
translation:
  language: fr
  text: qu’il avait promise d’avance par ses prophètes dans les saintes Écritures,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans des écrits saints » (ou « sacrés »).'
    reason: Alternative lexicale reflétant plus littéralement l’absence d’article et les sens possibles de γραφαῖς ἁγίαις.
lexical_decisions:
- source_word: ὃ
  choice: qu’
  rationale: Pronom relatif neutre singulier renvoyant à « la bonne nouvelle » au verset précédent; l’élision devant « il » assure une liaison naturelle en français.
- source_word: προεπηγγείλατο
  choice: avait promise d’avance
  rationale: Le plus-que-parfait situe cette promesse avant l’action évoquée dans la phrase, tandis que « d’avance » restitue la valeur temporelle du préverbe προ- et « promise » la force promissoire du verbe.
- source_word: διὰ
  choice: par
  rationale: Avec le génitif, la préposition indique ici l’intermédiaire par lequel Dieu a fait connaître sa promesse; « par » est idiomatique et précis en français.
- source_word: τῶν προφητῶν αὐτοῦ
  choice: ses prophètes
  rationale: Cette formulation rend naturellement le possessif et identifie les prophètes comme ceux de Dieu, sans ajouter d’interprétation.
- source_word: ἐν
  choice: dans
  rationale: 'Conserve le sens locatif probable: la promesse se trouve consignée dans les écrits sacrés.'
- source_word: γραφαῖς ἁγίαις
  choice: les saintes Écritures
  rationale: Dans ce contexte paulinien, γραφαί désigne les écrits reconnus comme Écriture; l’expression française consacrée est claire et digne, tout en laissant « écrits saints » en note comme possibilité plus littérale.
theological_decisions:
- issue: Rendre γραφαῖς ἁγίαις par « les saintes Écritures » ou par « des écrits saints »
  choice: les saintes Écritures
  alternative: des écrits saints
  rationale: Le contexte et l’usage paulinien de γραφαί favorisent la référence aux Écritures reconnues. La variante plus littérale est conservée en note afin de ne pas masquer la forme indéfinie du grec, qui ne comporte pas d’article.
translation_notes:
  register: Français international moderne, naturel et digne. Le verset demeure syntaxiquement lié à Romains 1.1. L’accord féminin de « promise » reprend « la bonne nouvelle ».
