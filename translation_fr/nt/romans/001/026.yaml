revisions:
- from: Voilà pourquoi Dieu les a livrés à des passions déshonorantes. En effet, même leurs femmes[a] ont échangé les relations naturelles[b] contre ce qui est contraire à la nature[c].
  to: 'C’est pourquoi Dieu les a livrés à des passions déshonorantes : les femmes parmi eux[a], en effet, ont échangé les relations naturelles[b] contre ce qui est contraire à la nature[c].'
  rationale: La révision évite l’ambiguïté conjugale possible de « leurs femmes » tout en préservant la référence aux femmes appartenant au groupe évoqué par αὐτῶν. Elle adopte aussi un connecteur causal plus neutre. Le reste du texte et l’ensemble des ancres de notes sont maintenus, car ils rendent fidèlement le grec et correspondent aux choix contrôlés dans la piste d’audit anglaise.
