  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: fr
  text: 'C’est pourquoi Dieu les a livrés à des passions déshonorantes : les femmes parmi eux[a], en effet, ont échangé les relations naturelles[b] contre ce qui est contraire à la nature[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « leurs femelles ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’usage naturel ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ce qui va contre la nature ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Cette tournure française naturelle conserve le lien causal et conclusif avec l’argument précédent.
- source_word: παρέδωκεν
  choice: a livrés
  rationale: « Livrer à » rend le mouvement de remise au pouvoir de quelque chose et préserve ici la portée judiciaire du verbe sans ajouter d’explication.
- source_word: πάθη ἀτιμίας
  choice: des passions déshonorantes
  rationale: Cette formulation conserve l’évaluation explicite liée à ἀτιμία tout en restant digne et compréhensible.
- source_word: θήλειαι αὐτῶν
  choice: leurs femmes
  rationale: « Femmes » est naturel pour des êtres humains en français moderne; la valeur plus littérale de θήλειαι est signalée en note.
- source_word: μετήλλαξαν
  choice: ont échangé
  rationale: Le verbe exprime directement la substitution délibérée d’une chose à une autre.
- source_word: τὴν φυσικὴν χρῆσιν
  choice: les relations naturelles
  rationale: Dans ce contexte, « relations » transmet clairement le sens sexuel de χρῆσις sans l’étrangeté ni les connotations potentiellement objectivantes de « usage ».
- source_word: τὴν παρὰ φύσιν
  choice: ce qui est contraire à la nature
  rationale: La formulation reproduit clairement l’expression grecque et en conserve la force évaluative sans la développer.
theological_decisions:
- issue: Faut-il atténuer ou accentuer le jugement moral exprimé par Paul?
  choice: Conserver « passions déshonorantes » et « contraire à la nature » sans paraphrase explicative.
  alternative: Employer des expressions plus faibles, ou préciser des catégories contemporaines que le verset ne nomme pas.
  rationale: Le texte grec porte lui-même une appréciation morale; la traduction doit la préserver sans l’amplifier ni la reformuler selon une grille doctrinale ou culturelle ultérieure.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche du grec tout en évitant en français courant l’ambiguïté ou la rudesse excessive de traductions strictement littérales comme « femelles » et « usage naturel ».
