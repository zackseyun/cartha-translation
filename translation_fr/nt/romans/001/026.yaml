review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est bien rendu : le lien causal (Διὰ τοῦτο), l’action de Dieu (παρέδωκεν), l’évaluation de πάθη ἀτιμίας, l’échange (μετήλλαξαν) et l’opposition entre le naturel et ce qui est παρὰ φύσιν sont préservés. « Relations naturelles » est une explicitation contextuelle raisonnable de χρῆσις, conforme à la piste anglaise, et les notes conservent les alternatives plus littérales.'
  naturalness: Le français est globalement clair et digne. Toutefois, « leurs femmes » peut couramment vouloir dire « leurs épouses », alors que θήλειαι désigne ici les personnes de sexe féminin en parallèle avec les mâles du verset suivant, non nécessairement des épouses. « Les femmes parmi eux » évite cette ambiguïté sans durcir le registre. « C’est pourquoi » est légèrement plus neutre et international que « Voilà pourquoi ».
  terminology: « Dieu les a livrés à », « passions déshonorantes », « relations naturelles » et « ce qui est contraire à la nature » sont des choix justes et cohérents avec l’audit anglais. La note sur « femelles » signale utilement la valeur lexicale plus littérale, sans employer dans le texte courant un terme potentiellement réducteur.
  issues:
  - severity: medium
    issue: « leurs femmes » peut être compris comme « leurs épouses ».
    rationale: Le grec αἵ τε γὰρ θήλειαι αὐτῶν emploie le terme sexué « femelles »/« femmes » et non le mot pour « épouses ». Dans le contexte immédiat, le parallèle avec les mâles indique un groupe de femmes, pas seulement les conjointes des personnes visées. « Les femmes parmi eux » rend cette portée sans ajouter d’interprétation.
  - severity: low
    issue: « Voilà pourquoi » est plus conversationnel que nécessaire.
    rationale: « C’est pourquoi » garde avec naturel la force inférentielle de Διὰ τοῦτο dans un registre biblique international moderne.
