source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: fr
  text: Par lui, nous avons reçu la grâce et l’apostolat en vue de l’obéissance de la foi[a] parmi tous les peuples[b], pour son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’obéissance qui vient de la foi », ou « l’obéissance qui consiste dans la foi ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « parmi tous les non-Juifs ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: Par lui
  rationale: διά avec le génitif indique ici la médiation. « Par lui » reprend naturellement en français la référence précédente à Jésus-Christ.
- source_word: ἐλάβομεν
  choice: nous avons reçu
  rationale: La traduction conserve la première personne du pluriel du grec sans décider si Paul parle de lui-même de manière rhétorique ou d’un groupe plus large.
- source_word: χάριν καὶ ἀποστολήν
  choice: la grâce et l’apostolat
  rationale: Les deux substantifs coordonnés sont maintenus, sans les fondre en une seule notion. « Apostolat » désigne ici la charge ou mission d’apôtre.
- source_word: εἰς ὑπακοὴν πίστεως
  choice: afin d’amener … à l’obéissance de la foi
  rationale: εἰς exprime le but. Cette formulation rend le mouvement vers le résultat recherché tout en conservant l’ambiguïté du génitif πίστεως.
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: tous les peuples
  rationale: Dans ce contexte missionnaire, ἔθνη désigne les peuples ou nations. « Tous les peuples » est naturel en français et peut inclure la nuance des non-Juifs.
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: pour l’honneur de son nom
  rationale: ὑπέρ exprime ici le motif ou l’intérêt visé. La formulation française explicite avec naturel la renommée et l’honneur attachés au nom de Jésus.
theological_decisions:
- issue: Sens de ὑπακοὴν πίστεως
  choice: l’obéissance de la foi
  alternative: l’obéissance qui vient de la foi ; l’obéissance qui consiste dans la foi
  rationale: 'Le génitif grec reste ouvert : la foi peut être la source de l’obéissance ou caractériser l’obéissance elle-même. Le texte principal préserve cette tension.'
- issue: Portée de ἔθνη
  choice: tous les peuples
  alternative: tous les non-Juifs
  rationale: Le terme peut désigner les nations en général ou, selon la perspective juive, les non-Juifs. Le texte principal retient le sens large et la note signale l’autre nuance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est légèrement restructurée autour de « amener » afin d’exprimer naturellement le but de la mission apostolique, tout en maintenant l’ambiguïté théologique de « l’obéissance de la foi ».
