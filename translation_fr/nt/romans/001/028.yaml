id: ROM.1.28
reference: Romans 1:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: fr
  text: Et comme ils n’ont pas jugé bon de garder Dieu dans leur connaissance[a], Dieu les a livrés à une intelligence dégradée[b], pour faire ce qui ne convient pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de reconnaître Dieu ». Littéralement : « d’avoir Dieu dans leur connaissance ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « une intelligence qui ne résiste pas à l’épreuve » ou « non approuvée ». Le grec fait écho à « n’ont pas jugé bon » plus haut dans le verset.'
    reason: wordplay
lexical_decisions:
- source_word: καθὼς
  choice: comme
  rationale: « Comme » conserve la comparaison qui peut aussi prendre ici une nuance causale, sans trancher artificiellement entre « de même que » et « puisque ».
- source_word: ἐδοκίμασαν
  choice: n’ont pas jugé bon
  rationale: Le verbe exprime une appréciation suivie d’une approbation ou d’un refus. Cette formulation française est naturelle et garde une partie de l’écho avec ἀδόκιμον.
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: garder la connaissance de Dieu
  rationale: Cette expression rend naturellement l’idée d’avoir ou de maintenir Dieu dans sa connaissance, sans la réduire au seul fait intellectuel de savoir qu’il existe.
- source_word: παρέδωκεν
  choice: les a livrés
  rationale: « Livrer » exprime directement l’action judiciaire de Dieu et correspond au verbe répété dans le contexte.
- source_word: ἀδόκιμον νοῦν
  choice: une intelligence dévoyée
  rationale: « Intelligence » rend νοῦς comme faculté de comprendre et de juger. « Dévoyée » indique son état impropre sans recourir au terme théologiquement chargé « réprouvée »; une note signale l’image de l’épreuve et le jeu verbal.
- source_word: ποιεῖν
  choice: pour qu’ils fassent
  rationale: La proposition finale exprime naturellement en français la conséquence ou la visée du fait d’être livrés à cette intelligence.
- source_word: τὰ μὴ καθήκοντα
  choice: ce qui ne convient pas
  rationale: La formule traduit simplement ce qui n’est ni approprié ni moralement convenable, sans surinterprétation.
theological_decisions:
- issue: Force doctrinale de ἀδόκιμον νοῦν
  choice: une intelligence dévoyée
  alternative: un esprit réprouvé / une intelligence dépravée
  rationale: Le grec décrit une intelligence qui échoue à l’épreuve ou se révèle impropre. La traduction choisie maintient le jugement moral et l’action judiciaire de Dieu sans importer le vocabulaire doctrinal plus tardif de la réprobation.
- issue: Relation exprimée par καθὼς
  choice: comme
  alternative: puisque
  rationale: 'Le contexte permet une nuance causale, mais καθὼς conserve aussi une structure de correspondance: leur refus d’approuver la connaissance de Dieu répond au fait que Dieu les livre à une intelligence non approuvée. « Comme » préserve cette tension.'
translation_notes:
  register: Français international moderne, clair et digne. « Intelligence dévoyée » reste compréhensible sans être familier; les notes conservent la formulation plus littérale et le jeu de mots grec.
