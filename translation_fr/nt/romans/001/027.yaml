  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: fr
  text: 'De même, les hommes[a], ayant abandonné l’usage naturel de la femme[b], se sont enflammés de désir les uns pour les autres[c] : des hommes commettant avec des hommes l’indécence[d] et recevant en eux-mêmes la rétribution appropriée à leur égarement[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les mâles » ; le grec emploie ici, comme pour « la femme » dans la suite, des termes qui marquent le sexe biologique.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « les relations naturelles avec une femme ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ont brûlé de convoitise les uns pour les autres ».'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « commettant ce qui est honteux ».'
    reason: lexical_alternative
  - marker: e
    text: 'Ou : « la juste contrepartie » ou « la rétribution qui convenait à leur égarement ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: les hommes / la femme
  rationale: Le grec emploie des termes désignant explicitement le sexe mâle et le sexe femelle. En français courant et digne, « hommes / femme » évite l’étrangeté de substantifs comme « les mâles / la femelle »; une note signale toutefois la nuance biologique du texte source.
- source_word: ἀφέντες
  choice: délaissant
  rationale: Le participe exprime l’abandon préalable de ce qui est décrit comme l’usage naturel; « délaissant » conserve cette idée sans alourdir la phrase.
- source_word: φυσικὴν χρῆσιν
  choice: l’usage naturel
  rationale: Cette formulation suit de près χρῆσις et préserve l’euphémisme sexuel du grec, sans expliciter davantage que le texte.
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: se sont enflammés de désir
  rationale: « Se sont enflammés » restitue l’image verbale intense, tandis que « désir » rend ὄρεξις sans imposer la nuance plus interprétative de « convoitise ».
- source_word: εἰς ἀλλήλους
  choice: les uns pour les autres
  rationale: Tour réciproque naturel en français, qui conserve l’orientation mutuelle du désir.
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: des hommes avec des hommes
  rationale: La répétition est maintenue afin de préserver l’insistance rhétorique du grec; la note [a] rend compte de la désignation biologique sous-jacente.
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: commettant ce qui est honteux
  rationale: Cette traduction garde la qualification morale de ἀσχημοσύνη sans ajouter une désignation technique ou préciser l’acte au-delà du texte.
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: la rétribution que méritait
  rationale: ἀντιμισθία évoque un retour correspondant, et ἔδει ce qui était nécessaire ou approprié. « Que méritait » exprime ce rapport dans un français fluide, sans déterminer la nature de la rétribution.
- source_word: τῆς πλάνης αὐτῶν
  choice: leur égarement
  rationale: « Égarement » conserve à la fois l’idée d’erreur et celle d’un éloignement impliquées par πλάνη.
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: recevant en eux-mêmes
  rationale: La formulation garde la valeur réflexive de ἑαυτοῖς et n’explicite pas le mode précis de cette réception.
theological_decisions:
- issue: Rendre les termes biologiquement marqués ἄρσενες et θηλείας
  choice: les hommes / la femme, avec une note indiquant littéralement « les mâles / la femelle »
  alternative: les mâles / la femelle
  rationale: Le corps du texte reste naturel et digne en français moderne, tandis que la note préserve la distinction lexicale réelle du grec et empêche de la confondre avec les termes relationnels ordinaires.
- issue: Préciser ou non la nature de l’acte qualifié par ἀσχημοσύνη
  choice: ce qui est honteux
  alternative: des actes homosexuels
  rationale: Le grec porte déjà un jugement moral, mais ne fournit pas ici d’étiquette technique. La traduction maintient cette force sans ajouter une catégorie absente du texte.
- issue: Identifier la rétribution reçue « en eux-mêmes »
  choice: ne pas en préciser la nature
  alternative: l’interpréter explicitement comme une conséquence physique, psychologique ou eschatologique
  rationale: Le verset ne définit pas cette rétribution. La formulation conserve donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La phrase conserve le parallélisme, la répétition et l’euphémisme du grec. Les notes rendent visibles les principales possibilités lexicales et la formulation biologiquement marquée de l’original.
