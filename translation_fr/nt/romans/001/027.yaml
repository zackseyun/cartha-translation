revisions:
- from: 'De même, les hommes[a], délaissant l’usage naturel de la femme[b], se sont enflammés de désir les uns pour les autres[c] : des hommes avec des hommes, commettant ce qui est honteux[d] et recevant en eux-mêmes la rétribution que méritait leur égarement[e].'
  to: 'De même, les hommes[a], ayant abandonné l’usage naturel de la femme[b], se sont enflammés de désir les uns pour les autres[c] : des hommes commettant avec des hommes l’indécence[d] et recevant en eux-mêmes la rétribution appropriée à leur égarement[e].'
  rationale: La révision rend explicitement l’antériorité du participe grec par « ayant abandonné », emploie « l’indécence » comme équivalent nominal direct de ἀσχημοσύνη et remplace « que méritait » par « appropriée à », qui restitue ἣν ἔδει sans renforcer l’idée de mérite. La réorganisation de la dernière proposition améliore la lisibilité française tout en conservant la répétition « hommes … hommes », la qualification morale du texte et l’ambiguïté de la rétribution reçue « en eux-mêmes ».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:18:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général et la structure argumentative sont fidèlement rendus. « Hommes / femme », accompagné d’une note, est un compromis français recevable pour les termes biologiquement marqués ἄρσενες / θηλείας. Une correction est toutefois indiquée : « délaissant » ne rend pas aussi clairement l’antériorité du participe aoriste ἀφέντες, et « que méritait » accentue indûment l’idée de mérite là où ἣν ἔδει exprime ce qui était approprié ou requis.'
  naturalness: Le français est globalement soutenu et naturel. « Des hommes avec des hommes, commettant ce qui est honteux » reste quelque peu heurté. « Des hommes commettant avec des hommes l’indécence » conserve la répétition et le parallélisme du grec dans une syntaxe française plus fluide.
  terminology: « Usage naturel », « désir », « égarement » et « en eux-mêmes » sont appropriés et évitent de surinterpréter le texte. « L’indécence » rend directement ἀσχημοσύνη, sans l’explicitation paraphrastique de « ce qui est honteux ». « La rétribution appropriée à leur égarement » maintient l’ambiguïté quant à la nature de cette rétribution et rend mieux la convenance indiquée par ἔδει.
  issues:
  - severity: medium
    issue: Valeur temporelle de ἀφέντες
    rationale: Le participe aoriste marque l’abandon comme préalable à l’action principale. « Ayant abandonné » le rend plus nettement que « délaissant », qui suggère plus volontiers une action simultanée.
  - severity: low
    issue: Rendu de ἣν ἔδει
    rationale: « Que méritait » introduit une notion de mérite plus marquée que le grec, qui indique ce qui était nécessaire, dû ou approprié. « Appropriée à » conserve mieux cette nuance.
  - severity: low
    issue: Fluidité de la séquence participiale finale
    rationale: Le groupe détaché « des hommes avec des hommes, commettant… » est calqué sur le grec et peu idiomatique. Une légère réorganisation française préserve sans ajout le sens et la répétition.
