  text: ἀσυνέτους, ἀσυνθέτους, ⸀ἀστόργους, ἀνελεήμονας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/031.yaml
  text: senseless[a], faithless, heartless[b], merciless.
translation:
  language: fr
  text: dépourvus de discernement, déloyaux[a], sans affection familiale[b], sans pitié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « indignes de confiance » ou « ne respectant pas leurs engagements ».
    reason: lexical_alternative
  - marker: b
    text: L'expression désigne notamment l'absence de l'affection naturelle qui devrait unir les membres d'une famille.
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: dépourvus de discernement
  rationale: Le terme exprime un manque de compréhension ou de discernement moral. Cette formulation naturelle évite d'évoquer une simple faiblesse intellectuelle.
- source_word: ἀσυνθέτους
  choice: déloyaux
  rationale: Le mot désigne ceux qui ne respectent pas leurs engagements ou se montrent indignes de confiance. « Déloyaux » rend de façon concise cette infidélité relationnelle, tandis que le sens plus explicite figure en note.
- source_word: ἀστόργους
  choice: sans affection familiale
  rationale: Le terme nie la στοργή, l'affection naturelle qui unit notamment les membres d'une famille. Une traduction explicite préserve cette nuance lexicale.
- source_word: ἀνελεήμονας
  choice: sans pitié
  rationale: L'adjectif désigne l'absence de miséricorde ou de compassion. « Sans pitié » est clair, courant et conserve la force du grec.
theological_decisions: []
