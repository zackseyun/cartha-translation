lexical_decisions:
- source_word: περὶ
  choice: au sujet de
  rationale: Cette expression introduit naturellement en français le contenu de la bonne nouvelle mentionnée au verset précédent.
- source_word: υἱοῦ
  choice: Fils
  rationale: La majuscule clarifie que le terme désigne ici le Fils de Dieu, sans ajouter de contenu lexical au grec.
- source_word: γενομένου
  choice: issu de
  rationale: Le participe de γίνομαι exprime ici l’origine ou l’appartenance à une lignée. « Issu de » est naturel en français et évite de réduire le terme au seul fait de la naissance.
- source_word: σπέρματος
  choice: descendance
  rationale: Littéralement « semence », le mot désigne ici la lignée davidique. « Descendance » communique clairement ce sens en français moderne tout en conservant l’idée généalogique.
- source_word: Δαυὶδ
  choice: David
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Cette traduction conserve l’expression paulinienne, concise et théologiquement chargée, sans la remplacer dans le texte par une explication interprétative.
theological_decisions:
- issue: Le rapport entre la qualité de Fils de Dieu et l’ascendance davidique
  choice: Maintenir côte à côte « son Fils » et « issu de la descendance de David selon la chair »
  alternative: Expliciter par « quant à sa nature humaine » ou réduire l’expression à « descendant de David »
  rationale: Le grec affirme à la fois la filiation divine et l’ascendance humaine davidique sans expliquer leur articulation. La traduction préserve cette tension et n’introduit pas de formulation doctrinale ultérieure.
- issue: Le sens de « selon la chair » dans ce contexte
  choice: Conserver la formulation littérale dans le texte et en préciser le sens en note
  alternative: Traduire directement par « selon son ascendance humaine »
  rationale: Ici, « chair » renvoie à l’existence humaine et à la lignée terrestre du Christ, non à une nature pécheresse. Garder l’expression dans le texte respecte le vocabulaire de Paul et sa portée potentielle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste volontairement liée au verset précédent. « Issu de la descendance » est intelligible dans l’usage courant tout en conservant la densité généalogique de l’original.
