  text: περὶ τοῦ υἱοῦ αὐτοῦ, τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/003.yaml
  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: fr
  text: au sujet de son Fils, issu de la lignée[a] de David selon la chair[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la semence de David ».'
    reason: lexical_alternative
  - marker: b
    text: Ici, « selon la chair » renvoie à la lignée humaine ou à l’ascendance terrestre, et non à une nature pécheresse.
