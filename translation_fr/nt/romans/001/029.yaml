  variant: modern international French
source:
  edition: SBLGNT
  text: πεπληρωμένους πάσῃ ⸀ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/029.yaml
  text: filled with every kind of unrighteousness[a], evil, greed, and malice; full of envy, murder, strife, deceit, and maliciousness; whisperers[b],
translation:
  language: fr
  text: remplis de toute injustice[a], de perversité, d’avidité et de méchanceté ; pleins d’envie, de meurtre, de discorde, de tromperie et de malveillance ; colporteurs de médisances[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « remplis de toutes sortes d’injustices » ; l’expression grecque marque une portée globale.
    reason: lexical_alternative
  - marker: b
    text: On peut aussi traduire par « médisants » ou « calomniateurs en secret ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένους
  choice: remplis
  rationale: Le participe parfait passif décrit un état présent résultant d’une action antérieure. « Remplis » conserve cette valeur résultative et s’intègre naturellement à l’énumération.
- source_word: πάσῃ
  choice: toute sorte de
  rationale: Avec le nom abstrait singulier ἀδικίᾳ, cette expression rend de manière idiomatique la portée globale de πάσῃ sans imposer une analyse trop étroite.
- source_word: ἀδικίᾳ
  choice: injustice
  rationale: « Injustice » couvre ici le tort moral et l’absence de droiture, tout en restant courant en français. Une note signale l’alternative plus générale « toute injustice ».
- source_word: πονηρίᾳ
  choice: perversité
  rationale: Le terme désigne une disposition moralement mauvaise. « Perversité » le distingue de κακία tout en gardant la force éthique de l’original.
- source_word: πλεονεξίᾳ
  choice: avidité
  rationale: « Avidité » exprime clairement le désir insatiable d’avoir davantage et convient au registre contemporain.
- source_word: κακίᾳ
  choice: méchanceté
  rationale: « Méchanceté » est naturel et conserve une nuance de volonté nuisible, distincte de la perversité plus générale exprimée juste avant.
- source_word: μεστοὺς
  choice: pleins de
  rationale: Cette formulation reproduit la variation grecque par rapport à πεπληρωμένους, rendu par « remplis », sans alourdir le français.
- source_word: φθόνου
  choice: envie
  rationale: « Envie » est le terme moral précis pour le ressentiment devant le bien d’autrui.
- source_word: φόνου
  choice: meurtre
  rationale: Dans cette liste de vices, « meurtre » rend mieux la portée moralement condamnable que le terme plus neutre « mise à mort ».
- source_word: ἔριδος
  choice: discorde
  rationale: « Discorde » désigne clairement les conflits et rivalités qui divisent, dans un registre digne mais actuel.
- source_word: δόλου
  choice: tromperie
  rationale: « Tromperie » communique directement l’idée de fraude ou de duplicité intentionnelle.
- source_word: κακοηθείας
  choice: malveillance
  rationale: Le mot évoque une disposition foncièrement hostile et nuisible. Il maintient une distinction utile avec κακία, rendu par « méchanceté ».
- source_word: ψιθυριστάς
  choice: colporteurs de médisances
  rationale: Le grec désigne ceux qui parlent à voix basse contre autrui, donc des médisants discrets ou clandestins. Cette formulation naturelle explicite l’action sans la confondre avec la simple conversation à voix basse.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La structure en deux séries est conservée, ainsi que la variation entre « remplis » et « pleins ». Le verset étant syntaxiquement rattaché au contexte, la ponctuation finale reste ouverte avec une virgule.
