id: ROM.1.20
reference: Romans 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: fr
  text: En effet, depuis la création du monde, ses réalités invisibles — sa puissance éternelle et sa divinité — se voient clairement, car elles sont comprises à travers ce qui a été fait, de sorte qu’ils sont sans excuse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: ce qui est invisible en lui
  rationale: Le neutre pluriel grec désigne largement les réalités invisibles concernant Dieu. Cette formulation naturelle conserve cette largeur sans imposer le vocabulaire plus technique d’« attributs ».
- source_word: ἀπὸ κτίσεως κόσμου
  choice: depuis la création du monde
  rationale: « Depuis » rend naturellement la valeur temporelle de ἀπό et indique une réalité qui se poursuit à partir de la création.
- source_word: τοῖς ποιήμασιν
  choice: à partir de ce qu’il a fait
  rationale: Le datif indique ici le moyen ou le fondement à partir duquel la compréhension se forme. La formulation rend le sens des œuvres produites tout en identifiant naturellement Dieu comme leur auteur.
- source_word: νοούμενα
  choice: on le comprend
  rationale: 'Le participe exprime une perception intellectuelle : l’invisible est discerné par la pensée à partir des œuvres créées.'
- source_word: καθορᾶται
  choice: se voit clairement
  rationale: Le présent rend une réalité continue, et « clairement » traduit la force intensive du verbe.
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: sa puissance éternelle
  rationale: L’expression précise par apposition ce qui est invisible en Dieu. « Éternelle » rend fidèlement ἀΐδιος dans un français actuel.
- source_word: θειότης
  choice: divinité
  rationale: « Divinité » exprime la qualité divine désignée par θειότης sans la confondre avec le terme plus fort θεότης.
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: Ils sont donc sans excuse
  rationale: La proposition exprime ici le résultat. « Donc » le marque clairement, tandis que « sans excuse » conserve le sens juridique et rhétorique de ἀναπολογήτους.
theological_decisions:
- issue: Rendre θειότης sans renforcer indûment la formulation de Paul
  choice: divinité
  alternative: nature divine
  rationale: « Divinité » affirme qu’une réalité authentiquement divine est perceptible dans la création, tout en préservant la distinction lexicale entre θειότης et θεότης.
- issue: Rapport entre révélation dans la création et responsabilité humaine
  choice: Ils sont donc sans excuse
  alternative: de sorte qu’ils sont inexcusables
  rationale: La traduction conserve le résultat affirmé par le texte sans développer une théorie particulière sur l’étendue ou les modalités de cette connaissance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase a été légèrement restructurée pour éviter une chaîne participiale lourde, tout en conservant l’apposition qui identifie la puissance éternelle et la divinité comme les réalités invisibles dont il est question.
