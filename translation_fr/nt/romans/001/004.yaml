id: ROM.1.4
reference: Romans 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: fr
  text: 'et qui a été déclaré[a] Fils de Dieu en puissance, selon l’Esprit de sainteté[b], par la résurrection d’entre les morts : Jésus le Messie, notre Seigneur,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « établi » ou « désigné » Fils de Dieu en puissance.
    reason: lexical_alternative
  - marker: b
    text: 'Ou « selon le Saint-Esprit » ; autre possibilité : « selon son esprit saint ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: a été déclaré
  rationale: Le participe de ὁρίζω peut exprimer le fait de déterminer, désigner ou déclarer. « A été déclaré » rend naturellement ici la manifestation publique liée à la résurrection, tandis que la note conserve les principales possibilités lexicales sans trancher la tension christologique.
- source_word: υἱοῦ θεοῦ
  choice: Fils de Dieu
  rationale: Rendu direct du titre christologique, avec les majuscules usuelles en français.
- source_word: ἐν δυνάμει
  choice: avec puissance
  rationale: Cette formulation française naturelle conserve le lien de la puissance avec la déclaration ou avec la condition de Fils, sans le réduire à un simple adverbe.
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: selon l’Esprit de sainteté
  rationale: Le calque intelligible maintient le caractère inhabituel de l’expression grecque et ne décide pas prématurément s’il s’agit explicitement du Saint-Esprit ou d’un contraste avec « selon la chair » au verset 3.
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: par sa résurrection d’entre les morts
  rationale: « Par » exprime naturellement le fondement ou le moyen de la déclaration. Le possessif, implicite dans le contexte, évite que le français évoque la résurrection générale, et « d’entre les morts » conserve la nuance de ἐκ/ἐξ.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Χριστός fonctionne ici comme le titre de Jésus; « le Messie » en restitue le sens dans un français idiomatique.
- source_word: κυρίου
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent français établi et conserve les résonances christologiques de κύριος.
theological_decisions:
- issue: ὁρισθέντος implique-t-il que Jésus est devenu Fils de Dieu seulement lors de la résurrection ?
  choice: La formulation « a été déclaré Fils de Dieu avec puissance » présente la résurrection comme la manifestation décisive de sa filiation sans affirmer qu’elle a commencé alors.
  alternative: « a été établi » ou « a été désigné Fils de Dieu avec puissance »
  rationale: Le grec laisse une tension entre déclaration, désignation et établissement. Le texte principal reste proche de cette tension et la note signale les autres sens possibles sans imposer une lecture adoptionniste ni résoudre davantage la syntaxe.
- issue: πνεῦμα ἁγιωσύνης désigne-t-il précisément le Saint-Esprit ?
  choice: « l’Esprit de sainteté » laisse le référent partiellement ouvert.
  alternative: « le Saint-Esprit » ou « son esprit saint »
  rationale: L’expression grecque est rare et peut désigner le Saint-Esprit ou participer au contraste avec « selon la chair ». Une traduction transparente préserve cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase demeure un fragment coordonné avec le verset précédent. « Esprit de sainteté » conserve volontairement l’étrangeté de l’expression grecque; « Jésus le Messie, notre Seigneur » rend clairement les titres sans surcharge confessionnelle.
