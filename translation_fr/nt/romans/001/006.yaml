  text: ἐν οἷς ἐστε καὶ ὑμεῖς κλητοὶ Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/006.yaml
  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: fr
  text: parmi lesquels vous êtes, vous aussi, appelés à appartenir à Jésus le Messie[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « appelés par Jésus le Messie » ; plus littéralement, « appelés de Jésus le Messie ».
    reason: La construction grecque au génitif est condensée et peut exprimer l’appartenance ou, éventuellement, l’auteur de l’appel.
lexical_decisions:
- source_word: ἐν οἷς
  choice: parmi lesquels
  rationale: Le pronom relatif au datif pluriel renvoie aux nations mentionnées au verset précédent. « Parmi lesquels » exprime naturellement l’inclusion des destinataires dans cet ensemble.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: Cette formulation conserve l’insistance du pronom exprimé ὑμεῖς ainsi que la valeur inclusive de καί, dans un ordre naturel en français.
- source_word: κλητοὶ
  choice: appelés
  rationale: « Appelés » rend directement κλητοί sans réduire l’appel à une simple invitation ni préciser son efficacité.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Ἰησοῦ est rendu par le nom « Jésus » et Χριστοῦ par le titre « le Messie », conformément à son sens de titre royal et messianique.
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: appelés à appartenir à Jésus le Messie
  rationale: Le génitif grec est très condensé. Cette traduction exprime en français naturel une relation d’appartenance, bien adaptée au contexte, tout en signalant en note les autres analyses possibles.
theological_decisions:
- issue: La relation exprimée par le génitif dans κλητοὶ Ἰησοῦ Χριστοῦ
  choice: appelés à appartenir à Jésus le Messie
  alternative: appelés par Jésus le Messie ; littéralement, appelés de Jésus le Messie
  rationale: Le génitif peut indiquer l’appartenance ou une relation étroite, mais il pourrait aussi être compris comme désignant l’auteur de l’appel. Le texte principal adopte une formulation française intelligible sans dissimuler l’ambiguïté de la construction grecque, conservée dans la note.
translation_notes:
  register: Français moderne, digne et accessible. La reprise « vous êtes, vous aussi » maintient l’accent inclusif du grec. La virgule finale respecte le fait que le verset s’insère dans la phrase commencée auparavant et poursuivie ensuite.
