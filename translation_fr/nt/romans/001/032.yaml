id: ROM.1.32
reference: Romans 1:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: fr
  text: Bien qu’ils connaissent le juste décret[a] de Dieu, à savoir que ceux qui pratiquent de telles choses méritent la mort, non seulement ils les commettent, mais ils approuvent aussi ceux qui les pratiquent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prescription », « exigence » ou « jugement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: ils
  rationale: Le pronom relatif reprend les personnes décrites dans le contexte précédent. En français, une nouvelle phrase avec « ils », intégrée à la construction concessive, est plus naturelle qu’un calque tel que « lesquels ».
- source_word: τὸ δικαίωμα τοῦ θεοῦ
  choice: le juste décret de Dieu
  rationale: « Décret » conserve la portée juridique et normative de δικαίωμα, tandis que « juste » exprime ici son rapport à la justice divine. La proposition qui suit en précise le contenu.
- source_word: ἐπιγνόντες
  choice: bien qu’ils connaissent
  rationale: 'Le participe a ici une valeur concessive implicite : leur conduite et leur approbation ont lieu malgré leur connaissance du décret divin.'
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ceux qui se livrent à de tels actes
  rationale: Cette formulation naturelle suggère une conduite caractérisée ou répétée, conformément au participe présent πράσσοντες.
- source_word: ἄξιοι θανάτου
  choice: méritent la mort
  rationale: Cette expression française directe préserve la force judiciaire de l’énoncé sans définir davantage la nature ou la portée de la mort.
- source_word: αὐτὰ ποιοῦσιν
  choice: ils les commettent
  rationale: « Commettre » convient aux actes moralement condamnés évoqués dans le contexte et reprend clairement « de tels actes ».
- source_word: συνευδοκοῦσιν
  choice: ils approuvent aussi
  rationale: Le verbe désigne le fait de consentir à la conduite d’autrui ou de lui donner son approbation, et non une simple connaissance passive.
- source_word: τοῖς πράσσουσιν
  choice: ceux qui s’y livrent
  rationale: Cette reprise maintient le sens d’une conduite pratiquée tout en évitant une répétition française pesante.
theological_decisions:
- issue: Portée de « méritent la mort »
  choice: Conserver l’énoncé comme verdict judiciaire divin sans préciser la nature de la mort.
  alternative: L’interpréter explicitement comme la peine capitale civile ou comme la mort eschatologique.
  rationale: Le verset affirme que ces personnes méritent la mort, mais ne définit pas ici toute la portée du terme. La traduction préserve cette tension sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. Les tirets mettent en relief la proposition explicative introduite par ὅτι sans alourdir la phrase. Le vocabulaire juridique demeure intelligible pour un lectorat général.
