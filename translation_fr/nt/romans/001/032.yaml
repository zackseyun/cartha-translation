revisions:
- from: Bien qu’ils connaissent le juste décret[a] de Dieu — à savoir que ceux qui se livrent à de tels actes méritent la mort —, non seulement ils les commettent, mais ils approuvent aussi ceux qui s’y livrent.
  to: Bien qu’ils connaissent le juste décret[a] de Dieu, à savoir que ceux qui pratiquent de telles choses méritent la mort, non seulement ils les commettent, mais ils approuvent aussi ceux qui les pratiquent.
  rationale: Révision limitée à la formulation de πράσσω et à la ponctuation. Elle évite une nuance interprétative superflue tout en conservant la connaissance concessive, le langage judiciaire et l’ambiguïté théologique du texte source.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:16:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est bien rendu : la connaissance du δικαίωμα divin est concessive, le verdict « méritent la mort » demeure non précisé, et la dernière proposition exprime l’approbation donnée à d’autres qui accomplissent les mêmes choses. La révision proposée conserve ces éléments et le parallélisme entre πράσσοντες et πράσσουσιν.'
  naturalness: Le texte est globalement naturel, mais « se livrent à de tels actes » puis « s’y livrent » ajoute une nuance d’engagement ou d’abandon qui n’est pas nécessairement portée par πράσσω. « Pratiquent de telles choses / les pratiquent » est à la fois plus proche du grec et plus net. La ponctuation est également simplifiée pour une lecture française plus fluide.
  terminology: « Juste décret de Dieu » rend de manière recevable la portée juridique et morale de τὸ δικαίωμα τοῦ θεοῦ. « Méritent la mort » préserve l’ambiguïté voulue quant à la nature de cette mort. La note conserve utilement les principales possibilités lexicales de δικαίωμα.
  issues:
  - severity: low
    issue: Nuance légèrement renforcée par « se livrent à de tels actes » / « s’y livrent ».
    rationale: πράσσω désigne le fait de faire ou pratiquer ces choses ; la tournure française peut suggérer plus spécifiquement une conduite d’abandon ou d’adonnement. Une reprise par « pratiquer » maintient mieux le parallèle grec sans ajouter cette nuance.
  - severity: low
    issue: Encadrement typographique de la proposition explicative un peu lourd.
    rationale: La construction avec deux tirets et la virgule de reprise reste compréhensible, mais « à savoir que » après une virgule donne une phrase plus fluide en français international moderne.
  revised_text: Bien qu’ils connaissent le juste décret[a] de Dieu, à savoir que ceux qui pratiquent de telles choses méritent la mort, non seulement ils les commettent, mais ils approuvent aussi ceux qui les pratiquent.
