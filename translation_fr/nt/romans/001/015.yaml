id: ROM.1.15
reference: Romans 1:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: fr
  text: Ainsi, pour ma part, je désire vivement vous annoncer, à vous aussi qui êtes à Rome, la bonne nouvelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous proclamer l’Évangile ».
    reason: Alternative lexicale pour εὐαγγελίσασθαι, qui peut être rendu soit par l’expression transparente « annoncer la bonne nouvelle », soit par la formulation chrétienne traditionnelle « proclamer l’Évangile ».
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Le terme relie cette déclaration à ce qui précède et introduit naturellement la conclusion que Paul en tire, sans préciser davantage une nuance causale que le grec laisse implicite.
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: pour ma part, je désire vivement
  rationale: Cette tournure grecque elliptique exprime la disposition empressée de Paul. La formulation française restitue à la fois son implication personnelle et son empressement, plutôt qu’une simple disponibilité.
- source_word: καὶ ὑμῖν
  choice: à vous aussi
  rationale: La place de καί inclut les destinataires de Rome parmi ceux auxquels Paul veut annoncer la bonne nouvelle. La reprise détachée « à vous aussi » conserve cette mise en relief en français naturel.
- source_word: τοῖς ἐν Ῥώμῃ
  choice: qui êtes à Rome
  rationale: Le groupe désigne les destinataires selon leur présence à Rome; la proposition relative s’intègre clairement à l’adresse directe.
- source_word: εὐαγγελίσασθαι
  choice: vous annoncer […] la bonne nouvelle
  rationale: Le verbe signifie annoncer une bonne nouvelle, en particulier l’Évangile. Cette expression française courante conserve l’image verbale du grec sans limiter l’action à une prédication formelle.
theological_decisions:
- issue: Annonce de la bonne nouvelle à des destinataires déjà liés à la communauté chrétienne de Rome
  choice: Conserver simplement « vous annoncer […] la bonne nouvelle »
  alternative: Reformuler comme un enseignement ou un approfondissement de la foi
  rationale: Le grec emploie sans restriction εὐαγγελίσασθαι à propos des destinataires romains. La traduction ne précise donc ni leur statut spirituel individuel ni la nature exacte de l’annonce envisagée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase détachée « à vous aussi qui êtes à Rome » souligne l’inclusion portée par καὶ ὑμῖν tout en évitant une tournure artificielle.
