  naturalness: La phrase est compréhensible et de registre approprié. « Vous transmettre quelque don spirituel » est plus idiomatique dans cette construction et rend mieux la direction de l’action. « J’ai le vif désir de vous voir » est également plus fluide que « je désire vivement vous voir », sans perdre l’intensité du verbe.
