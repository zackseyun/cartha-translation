id: ROM.1.11
reference: Romans 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: fr
  text: Car j’ai le vif désir de vous voir, afin de vous transmettre quelque don spirituel, pour que vous soyez affermis,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: je désire vivement
  rationale: Exprime le désir personnel intense du verbe grec dans un français actuel et digne.
- source_word: γὰρ
  choice: car
  rationale: Conserve le lien explicatif avec le contexte précédent.
- source_word: ἰδεῖν
  choice: vous voir
  rationale: Rend directement le sens du verbe grec sans expliciter la visite seulement implicite.
- source_word: ἵνα
  choice: afin de
  rationale: Marque naturellement le but en français.
- source_word: τι
  choice: quelque
  rationale: Préserve le caractère indéfini de l’expression grecque.
- source_word: μεταδῶ
  choice: partager avec vous
  rationale: Le verbe désigne le fait de faire part ou de donner quelque chose à autrui; cette formulation est naturelle et évite la raideur de « communiquer ».
- source_word: χάρισμα
  choice: don
  rationale: Traduction concise et usuelle qui n’impose pas ici un sens technique étroit.
- source_word: πνευματικὸν
  choice: spirituel
  rationale: Préserve l’ambiguïté entre un don relevant de la réalité spirituelle et un don venant de l’Esprit.
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: pour que vous soyez affermis
  rationale: Respecte la forme passive du grec et exprime le résultat ou but visé sans identifier explicitement l’agent.
theological_decisions:
- issue: Le « don spirituel » désigne-t-il un charisme miraculeux précis ou un bienfait spirituel plus large ?
  choice: quelque don spirituel
  alternative: quelque don de l’Esprit
  rationale: Le grec ne commande pas un sens technique étroit et n’explicite pas davantage la relation à l’Esprit; la traduction conserve donc cette ouverture.
- issue: Qui affermit les destinataires ?
  choice: pour que vous soyez affermis
  alternative: pour vous affermir
  rationale: Le passif grec laisse l’agent non exprimé et prépare la nuance réciproque du verset suivant; le conserver évite d’attribuer à Paul seul l’action d’affermir.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure explicative et finale du grec ainsi que le passif théologiquement ouvert de στηριχθῆναι.
