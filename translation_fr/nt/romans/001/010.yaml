source:
  edition: SBLGNT
  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: fr
  text: sans cesse, dans mes prières, je prie pour que, d’une manière ou d’une autre, il me soit enfin donné, par la volonté de Dieu, de venir jusqu’à vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de réussir à venir jusqu’à vous » ou « d’avoir un voyage favorable pour venir jusqu’à vous ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: sans cesse
  rationale: Rend l’idée d’une pratique constante dans un français naturel, sans prétendre que la prière est littéralement ininterrompue.
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: dans mes prières
  rationale: Expression française idiomatique correspondant au cadre dans lequel Paul formule sa demande.
- source_word: δεόμενος
  choice: je demande
  rationale: Le participe exprime ici une requête adressée à Dieu; la forme verbale française s’intègre clairement à la phrase commencée au verset précédent.
- source_word: εἴ πως
  choice: si, … d’une manière ou d’une autre
  rationale: Préserve à la fois l’incertitude concernant les circonstances et le vif désir de Paul.
- source_word: ἤδη ποτὲ
  choice: enfin
  rationale: Exprime l’espoir longtemps différé d’une occasion qui se présenterait désormais.
- source_word: εὐοδωθήσομαι
  choice: il me sera donné
  rationale: Rend naturellement le passif et le succès espéré sans suggérer une prospérité financière; la note conserve les nuances de réussite et de voyage favorable.
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: par la volonté de Dieu
  rationale: Présente la volonté divine comme la condition et le moyen déterminants de la venue espérée.
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: de venir jusqu’à vous
  rationale: Traduit explicitement le mouvement vers les destinataires sans ajouter l’idée plus précise de visite.
theological_decisions:
- issue: Rapport entre le projet de Paul et la volonté divine
  choice: par la volonté de Dieu
  alternative: dans la volonté de Dieu
  rationale: La formulation retenue laisse la venue dépendre de l’action et de la décision de Dieu, sans résoudre davantage la relation entre providence divine et projet humain.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la dépendance syntaxique au contexte précédent tout en restant intelligible isolément. L’ordre de « enfin » et « d’une manière ou d’une autre » reflète les deux nuances de ἤδη ποτὲ et εἴ πως.
