  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: fr
  text: 'À tous ceux qui sont à Rome, aimés de Dieu et appelés à être saints[a] : Que la grâce et la paix vous soient accordées de la part de Dieu notre Père et du Seigneur Jésus le Messie[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « appelés saints » ; on peut aussi comprendre « saints par appel ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « Christ ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: À tous ceux qui sont à Rome
  rationale: Rend directement l’adresse au datif, en conservant sa portée universelle et son indication de lieu dans un français naturel.
- source_word: ἀγαπητοῖς θεοῦ
  choice: aimés de Dieu
  rationale: Préserve la valeur adjectivale et relationnelle de l’expression sans recourir au plus soutenu « bien-aimés de Dieu ».
- source_word: κλητοῖς ἁγίοις
  choice: appelés à être saints
  rationale: Expression française claire qui rend l’appel divin et la qualité de saints, tout en signalant en note que le grec ne comporte pas d’équivalent explicite de « à être ».
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Que la grâce et la paix vous soient accordées
  rationale: Transpose la formule de salutation sans verbe en une tournure française naturelle et digne, tout en maintenant « grâce » et « paix » comme ses deux éléments centraux.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: de la part de Dieu notre Père
  rationale: Rend explicitement la provenance exprimée par ἀπό et conserve la formulation paulinienne usuelle.
- source_word: κυρίου Ἰησοῦ Χριστοῦ
  choice: du Seigneur Jésus le Messie
  rationale: Conserve le titre « Seigneur » et traduit Χριστός selon son sens de titre, « Messie », plutôt que de le laisser sous sa forme traditionnelle translittérée.
theological_decisions:
- issue: Valeur de κλητοῖς ἁγίοις
  choice: appelés à être saints
  alternative: appelés saints ; saints par appel
  rationale: Le grec juxtapose deux adjectifs et ne contient pas d’infinitif correspondant à « être ». Toutefois, « appelés saints » suggérerait facilement en français qu’ils portent simplement ce nom. Le texte principal privilégie donc la clarté idiomatique, tandis que la note préserve la forme plus resserrée et l’ambiguïté de l’original.
- issue: Traduction de Χριστοῦ
  choice: le Messie
  alternative: Christ
  rationale: Χριστός garde ici sa valeur titulaire. « Le Messie » en communique le sens en français, et la forme traditionnelle « Christ » est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la salutation paulinienne, mais la formule nominale grecque « grâce à vous et paix » est rendue par une proposition souhaitative naturelle en français. Les notes maintiennent visibles les principales possibilités lexicales et la tension grammaticale de κλητοῖς ἁγίοις.
