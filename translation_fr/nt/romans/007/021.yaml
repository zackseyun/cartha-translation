id: ROM.7.21
reference: Romans 7:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: fr
  text: 'Je constate donc cette loi[a] : quand je veux faire le bien, le mal est là, tout près de moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « principe » ou « règle ».
    reason: 'La portée de νόμος est ambiguë : le mot peut désigner ici une loi au sens de principe ou de règle à l’œuvre, plutôt que spécifiquement la Loi mosaïque.'
lexical_decisions:
- source_word: Εὑρίσκω
  choice: Je constate
  rationale: Le présent exprime une reconnaissance actuelle et continue. « Constater » rend naturellement l’idée de découvrir, à partir de l’expérience décrite, une réalité qui s’impose.
- source_word: ἄρα
  choice: donc
  rationale: Le terme introduit la conclusion tirée du raisonnement précédent.
- source_word: τὸν νόμον
  choice: cette loi
  rationale: « Loi » conserve le terme νόμος et sa résonance dans le contexte. Le démonstratif français présente naturellement la loi que Paul formule ensuite, sans trancher s’il s’agit de la Loi mosaïque ou d’un principe à l’œuvre.
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: quand je veux faire le bien
  rationale: Cette formulation idiomatique restitue la construction au datif, la volonté exprimée par θέλω et l’action bonne visée, sans reproduire lourdement la syntaxe grecque.
- source_word: τὸ καλὸν
  choice: le bien
  rationale: En français, « faire le bien » est l’expression naturelle correspondant à l’adjectif substantivé grec.
- source_word: τὸ κακὸν
  choice: le mal
  rationale: L’adjectif substantivé est rendu directement par « le mal », en parallèle avec « le bien ».
- source_word: παράκειται
  choice: est là, tout près de moi
  rationale: Cette expression rend la présence immédiate et la proximité suggérées par le verbe, tout en restant claire et naturelle en français moderne.
theological_decisions:
- issue: νόμον désigne-t-il la Loi mosaïque ou un principe, une règle à l’œuvre ?
  choice: « loi » dans le texte principal, avec les sens possibles « principe » et « règle » en note
  alternative: Traduire directement par « principe » ou « règle »
  rationale: Le maintien de « loi » préserve le vocabulaire de Paul et la tension interprétative du passage, sans identifier automatiquement cette loi à la Loi mosaïque. La note signale le sens contextuel possible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’opposition nette entre « le bien » et « le mal » ainsi que la proximité personnelle exprimée par ἐμοὶ et παράκειται.
