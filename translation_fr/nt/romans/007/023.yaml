id: ROM.7.23
reference: Romans 7:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: fr
  text: Mais je vois dans les parties de mon corps une autre loi[a], qui fait la guerre à la loi de mon esprit et me fait prisonnier de[b] la loi du péché, présente dans les parties de mon corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « principe » ou « puissance » pour les emplois répétés de « loi ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans la loi du péché » ; « prisonnier de » exprime naturellement en français la soumission à son pouvoir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: je vois
  rationale: Le présent simple conserve la perception directe et vive exprimée par Paul.
- source_word: ἕτερον νόμον
  choice: une autre loi
  rationale: Cette formulation préserve le contraste avec la loi mentionnée dans le contexte et maintient la répétition rhétorique de νόμος.
- source_word: ἐν τοῖς μέλεσίν μου
  choice: dans les parties de mon corps
  rationale: En français moderne, cette expression rend clairement les « membres » corporels sans employer le mot « membres », qui pourrait être compris comme des personnes appartenant à un groupe.
- source_word: ἀντιστρατευόμενον
  choice: qui fait la guerre à
  rationale: La formulation conserve l'image militaire forte du grec tout en restant naturelle en français.
- source_word: τῷ νόμῳ τοῦ νοός μου
  choice: à la loi de mon intelligence
  rationale: « Intelligence » désigne ici la faculté intérieure de comprendre et de vouloir, sans réduire νοῦς au seul cerveau ni l'élargir en « être intérieur ».
- source_word: αἰχμαλωτίζοντά με
  choice: me fait prisonnier
  rationale: Cette expression prolonge naturellement l'image de guerre et de captivité.
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: de la loi du péché
  rationale: Avec « faire prisonnier de », le français exprime idiomatiquement la soumission à la puissance de cette loi; une note signale la formulation grecque plus littérale.
- source_word: ἁμαρτίας
  choice: péché
  rationale: Il s'agit de l'équivalent français courant et précis du terme grec.
theological_decisions:
- issue: Faut-il traduire νόμος par « loi » ou l'interpréter comme « principe » ou « puissance » ?
  choice: Conserver « loi » dans les trois occurrences.
  alternative: Employer « principe » ou « puissance » pour une ou plusieurs occurrences.
  rationale: La répétition de νόμος est délibérée et met en tension la loi de l'intelligence et la loi du péché. La conserver évite de trancher silencieusement le sens métaphorique.
- issue: Sens de νοῦς dans « la loi de mon intelligence »
  choice: Traduire par « intelligence ».
  alternative: « pensée », « entendement » ou « être intérieur ».
  rationale: « Intelligence » conserve l'idée de la faculté intérieure qui comprend et juge, sans importer une anthropologie théologique plus précise que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore militaire est conservée par « fait la guerre » et « fait prisonnier ». « Les parties de mon corps » privilégie la compréhension immédiate tout en maintenant la dimension corporelle de μέλη.
