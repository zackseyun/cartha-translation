  text: ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: fr
  text: Malheureux que je suis ! Qui me délivrera de ce corps de mort[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « du corps de cette mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: malheureux
  rationale: Exprime ici la détresse profonde et l’état misérable de Paul dans une exclamation naturelle en français, sans suggérer simplement la malchance.
- source_word: ἐγὼ ἄνθρωπος
  choice: que je suis
  rationale: La tournure française « Malheureux que je suis ! » rend naturellement l’exclamation grecque tout en gardant l’accent sur le locuteur; traduire explicitement ἄνθρωπος par « homme » alourdirait la phrase.
- source_word: τίς
  choice: qui
  rationale: L’interrogatif vise une personne capable d’opérer la délivrance.
- source_word: ῥύσεται
  choice: délivrera
  rationale: Le verbe exprime l’arrachement à une situation de péril ou d’asservissement. « Délivrer » convient au contexte et préserve sa portée sans la réduire à une simple aide.
- source_word: ἐκ
  choice: de
  rationale: Après « délivrer », le français emploie naturellement « de » pour marquer ce dont le locuteur veut être arraché.
- source_word: σώματος
  choice: corps
  rationale: Conserve l’image concrète du texte grec sans la paraphraser.
- source_word: τοῦ θανάτου τούτου
  choice: de mort
  rationale: Dans l’ensemble « ce corps de mort », cette formulation française naturelle maintient l’association étroite entre le corps désigné et la mort, tandis que la note signale la construction plus littérale.
theological_decisions:
- issue: Rapport syntaxique du démonstratif τούτου dans l’expression finale
  choice: ce corps de mort
  alternative: le corps de cette mort
  rationale: Grammaticalement, τούτου détermine « mort », mais « le corps de cette mort » est peu naturel et obscur en français. « Ce corps de mort » conserve l’image et la force de l’appel sans préciser doctrinalement la nature exacte du corps ou de la mort; la note préserve la forme grecque plus littérale.
translation_notes:
  register: Français moderne, international et digne. L’exclamation « Malheureux que je suis ! » garde la vigueur rhétorique de l’original. « Délivrera » est courant dans un registre soutenu accessible et correspond directement à l’idée d’arrachement exprimée par ῥύομαι.
