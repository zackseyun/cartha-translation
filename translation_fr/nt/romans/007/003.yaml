id: ROM.7.3
reference: Romans 7:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: fr
  text: Ainsi donc, tant que son mari est vivant, elle sera considérée comme adultère si elle devient la femme d’un autre homme[a]. Mais si son mari meurt, elle est libérée de la loi[b], de sorte qu’elle n’est pas adultère si elle devient la femme d’un autre homme.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’unit à un autre homme » ou « appartient à un autre homme ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « la loi » désigne immédiatement le lien juridique qui régit la relation conjugale.
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ainsi donc
  rationale: Les deux particules introduisent la conclusion tirée de l’analogie précédente. « Ainsi donc » en conserve la force déductive dans un français naturel et soutenu.
- source_word: ζῶντος τοῦ ἀνδρός
  choice: tant que son mari est en vie
  rationale: Le génitif absolu exprime une circonstance temporelle concomitante. Le possessif est fourni par le contexte matrimonial.
- source_word: μοιχαλὶς
  choice: adultère
  rationale: Le nom désigne précisément une femme qui commet l’adultère. En français, « adultère » peut qualifier ou désigner une personne sans recourir au terme vieilli « adultéresse ».
- source_word: χρηματίσει
  choice: elle sera appelée
  rationale: Dans ce contexte, le verbe signifie être appelé ou reconnu comme tel. Le futur passif français restitue clairement cette désignation.
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: si elle s’unit à un autre homme
  rationale: La tournure γίνομαι avec le datif indique l’entrée dans une relation avec un autre homme. « S’unit à » garde le cadre conjugal sans ajouter explicitement qu’elle devient son épouse ni suggérer la simple possession.
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: elle est libérée de la loi
  rationale: « Libérée » exprime naturellement la cessation de l’obligation contraignante, tandis que « de la loi » conserve la formulation générale du grec.
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: de sorte qu’elle n’est pas adultère
  rationale: L’infinitif articulé exprime ici le résultat ou la conséquence. « De sorte que » préserve ce rapport logique.
theological_decisions:
- issue: Portée de νόμος dans l’analogie
  choice: la loi
  alternative: la loi du mariage
  rationale: Le contexte immédiat renvoie à la règle qui lie la femme à son mari tant qu’il vit. La formulation littérale « la loi » préserve toutefois le vocabulaire de Paul sans réduire explicitement sa portée dans le corps du texte.
- issue: Nature exacte de la relation avec ἀνδρὶ ἑτέρῳ
  choice: s’unit à un autre homme
  alternative: devient la femme d’un autre homme
  rationale: Le contexte est clairement conjugal, mais le grec n’emploie pas explicitement le mot « épouse ». La traduction retenue préserve cette légère indétermination tout en restant compréhensible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le raisonnement juridique de Paul. « Adultère » est employé comme nom commun de personne, usage actuel et moins marqué que « adultéresse ».
