review_pass:
  verdict: revise
  source_fidelity: Le sens juridique et matrimonial de l’ensemble est bien rendu. Toutefois, γένηται/γενομένην ἀνδρὶ ἑτέρῳ désigne, dans ce contexte, l’entrée dans une relation matrimoniale avec un autre homme; « s’unit à » peut évoquer une simple union sexuelle et affaiblit cette précision contextuelle.
  naturalness: « Elle sera appelée adultère » est compréhensible, mais « elle sera considérée comme adultère » est plus idiomatique en français moderne tout en conservant l’idée de désignation sociale ou juridique. « Tant que son mari est vivant » est également plus naturel que « est en vie » dans cette formulation.
  terminology: « Adultère » comme attribut de la femme est un usage actuel et approprié. « La loi » doit être conservé dans le texte, avec la note qui précise son référent immédiat sans imposer une interprétation doctrinale plus large.
  issues:
  - severity: medium
    issue: « s’unit à un autre homme » sous-spécifie la relation visée.
    rationale: Dans l’analogie matrimoniale, γίνομαι avec ἀνδρί renvoie à devenir la femme d’un autre homme. « S’unir à » peut se comprendre comme un rapport ou une relation sexuelle sans mariage, ce qui est moins fidèle au cadre légal développé par Paul.
  - severity: low
    issue: « elle sera appelée adultère » est légèrement calqué et moins naturel.
    rationale: Le verbe χρηματίσει exprime bien le fait d’être désignée ainsi; « sera considérée comme adultère » est plus fluide en français contemporain et maintient cette valeur.
  revised_text: Ainsi donc, tant que son mari est vivant, elle sera considérée comme adultère si elle devient la femme d’un autre homme[a]. Mais si son mari meurt, elle est libérée de la loi[b], de sorte qu’elle n’est pas adultère si elle devient la femme d’un autre homme.
