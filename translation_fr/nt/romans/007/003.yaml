revisions:
- from: Ainsi donc, tant que son mari est en vie, elle sera appelée adultère si elle s’unit à un autre homme[a]. Mais si son mari meurt, elle est libérée de la loi[b], de sorte qu’elle n’est pas adultère si elle s’unit à un autre homme.
  to: Ainsi donc, tant que son mari est vivant, elle sera considérée comme adultère si elle devient la femme d’un autre homme[a]. Mais si son mari meurt, elle est libérée de la loi[b], de sorte qu’elle n’est pas adultère si elle devient la femme d’un autre homme.
  rationale: La révision rend explicite la relation matrimoniale impliquée par l’expression grecque dans son contexte immédiat, sans attribuer au texte une doctrine supplémentaire. Elle améliore aussi l’idiomaticité de la désignation « adultère ». Les deux notes demeurent correctement ancrées et la note sur « la loi » conserve la prudence interprétative requise.
