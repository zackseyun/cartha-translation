id: ROM.7.18
reference: Romans 7:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: fr
  text: Car je sais que rien de bon n’habite en moi, c’est-à-dire dans ma chair.[a] En effet, vouloir est à ma portée, mais accomplir le bien ne l’est pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans ma nature pécheresse » pour « dans ma chair ».
    reason: Alternative lexicale indiquant le sens métaphorique possible de σάρξ sans remplacer le terme grec dans le texte principal.
lexical_decisions:
- source_word: οἶδα
  choice: je sais
  rationale: Le parfait grec a ici un sens présent ; « je sais » est l’équivalent français naturel et direct.
- source_word: οἰκεῖ
  choice: n’habite
  rationale: « Habiter » conserve la métaphore paulinienne de la présence intérieure.
- source_word: ἀγαθόν
  choice: rien de bon
  rationale: L’adjectif neutre substantivé, nié par οὐκ, se rend idiomatiquement en français par « rien de bon ».
- source_word: σάρξ
  choice: chair
  rationale: Le terme littéral préserve la formulation de Paul et sa tension théologique sans la réduire d’emblée à une interprétation comme « nature pécheresse ».
- source_word: θέλειν
  choice: vouloir
  rationale: L’infinitif substantivé désigne l’acte de vouloir ; l’infinitif français garde la concision et le parallélisme de la phrase grecque.
- source_word: παράκειταί μοι
  choice: est à ma portée
  rationale: Cette expression française rend l’idée de proximité ou de disponibilité exprimée par le verbe et le datif μοι.
- source_word: κατεργάζεσθαι
  choice: accomplir
  rationale: « Accomplir » exprime la mise en œuvre effective et convient naturellement au contraste avec « vouloir ».
- source_word: τὸ καλόν
  choice: le bien
  rationale: L’adjectif substantivé désigne ici ce qui est moralement bon ; « le bien » en préserve la concision.
- source_word: οὔ
  choice: ne l’est pas
  rationale: Le grec se termine par une négation elliptique. La reprise « ne l’est pas » complète naturellement la phrase en français tout en gardant sa brièveté.
theological_decisions:
- issue: Sens de σάρξ dans ce contexte moral chez Paul
  choice: chair
  alternative: nature pécheresse
  rationale: « Chair » laisse intacte la formulation explicative de Paul (« en moi, c’est-à-dire dans ma chair ») et évite d’inscrire dans le texte une interprétation doctrinale plus précise que le grec.
translation_notes:
  register: Français international moderne, naturel et digne. La première proposition conserve la métaphore de l’habitation ; la seconde privilégie une formulation idiomatique qui maintient le parallélisme entre vouloir et accomplir.
