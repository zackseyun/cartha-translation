source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: fr
  text: Mais le péché, se servant du commandement pour saisir une occasion[a], a produit en moi toutes sortes de convoitises[b]. En effet, sans la loi, le péché est mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Litt. « ayant saisi une occasion par le commandement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « toutes sortes de désirs ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμὴν … λαβοῦσα
  choice: saisissant l’occasion
  rationale: Cette formulation française naturelle conserve l’image du péché personnifié qui exploite activement une occasion ou un point de départ.
- source_word: ἡ ἁμαρτία
  choice: le péché
  rationale: Le péché demeure le sujet agissant de la phrase, ce qui préserve la personnification présente dans le grec.
- source_word: διὰ τῆς ἐντολῆς
  choice: par le moyen du commandement
  rationale: La tournure exprime la valeur instrumentale de διά et maintient le singulier, qui renvoie au commandement cité dans le contexte immédiat.
- source_word: κατειργάσατο
  choice: a produit
  rationale: Le verbe indique qu’un résultat a été provoqué ou produit; ce choix est direct et idiomatique en français actuel.
- source_word: πᾶσαν ἐπιθυμίαν
  choice: toutes sortes de convoitises
  rationale: Dans le contexte du commandement « Tu ne convoiteras pas », « convoitises » rend le sens contextuel de ἐπιθυμία, tandis que « toutes sortes de » exprime naturellement la portée de πᾶσαν.
- source_word: χωρὶς γὰρ νόμου
  choice: En effet, sans la loi
  rationale: « En effet » marque la fonction explicative de γάρ, et « sans la loi » rend χωρὶς νόμου de façon concise et naturelle.
- source_word: νεκρά
  choice: mort
  rationale: La métaphore forte de la mort est conservée plutôt que remplacée par une interprétation telle qu’« inactif ».
theological_decisions:
- issue: Personnification du péché et sens métaphorique de « mort »
  choice: Conserver le péché comme puissance agissante et traduire νεκρά littéralement par « mort ».
  alternative: Présenter le péché de manière abstraite ou traduire νεκρά par « inactif ».
  rationale: Le grec attribue au péché des actions intentionnelles et emploie une métaphore frappante. La traduction préserve cette tension sans l’expliquer ni l’atténuer.
- issue: Portée de ἐπιθυμία dans le contexte
  choice: Employer « convoitises » dans le texte principal.
  alternative: Employer le terme plus général « désirs ».
  rationale: Le contexte immédiat cite l’interdiction de convoiter; « convoitises » reflète donc le sens local tout en signalant en note l’étendue lexicale possible.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la personnification paulinienne et la relation instrumentale entre le commandement et l’action du péché, sans ajouter d’explication doctrinale.
