- from: Ainsi donc, ce qui est bon est-il devenu la mort pour moi ? Certainement pas ! Mais c’est le péché, afin qu’il se révèle comme péché[a] en produisant la mort en moi au moyen de ce qui est bon, afin que, par le commandement, le péché devienne pécheur au-delà de toute mesure[b].
  to: Ainsi donc, ce qui est bon est-il devenu pour moi la mort ? Certainement pas ! Mais c’est le péché, afin qu’il se révèle comme péché[a], produisant pour moi la mort au moyen de ce qui est bon, afin que, par le commandement, le péché devienne péché au plus haut point[b].
  rationale: La révision ne modifie pas la structure argumentative ni les ambiguïtés du grec. Elle améliore seulement l’expression française du datif personnel et de l’intensification finale, sans attribuer à ce qui est bon ou au commandement la responsabilité morale de la mort.
