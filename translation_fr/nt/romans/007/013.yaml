id: ROM.7.13
reference: Romans 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: fr
  text: Ainsi donc, ce qui est bon est-il devenu pour moi la mort ? Certainement pas ! Mais c’est le péché, afin qu’il se révèle comme péché[a], produisant pour moi la mort au moyen de ce qui est bon, afin que, par le commandement, le péché devienne péché au plus haut point[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de sorte qu’il apparaisse comme péché ».'
    reason: La construction ἵνα φανῇ peut être rendue avec une nuance de but ou de résultat, et φανῇ peut se traduire par « se révèle » ou « apparaisse ».
  - marker: b
    text: 'Ou : « devienne excessivement pécheur ».'
    reason: L’expression καθ’ ὑπερβολὴν intensifie fortement l’adjectif ἁμαρτωλός. La traduction du texte principal privilégie une formulation française plus naturelle; cette variante conserve plus explicitement la personnification adjectivale.
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: ce qui est bon
  rationale: Le neutre substantivé désigne « ce qui est bon »; cette formulation naturelle conserve sa portée abstraite et renvoie au commandement qualifié de bon dans le contexte.
- source_word: ἐμοὶ
  choice: pour moi
  rationale: Le datif marque ici la personne concernée; « pour moi » convient naturellement à la question rhétorique.
- source_word: ἐγένετο θάνατος
  choice: est-il devenu la mort
  rationale: Cette formulation conserve l’attribut θάνατος avec γίνομαι, sans transformer explicitement le bien en simple « cause de mort ».
- source_word: μὴ γένοιτο
  choice: Certainement pas !
  rationale: Expression française actuelle et énergique du rejet catégorique exprimé par la formule paulinienne.
- source_word: ἡ ἁμαρτία
  choice: le péché
  rationale: Le nom abstrait est conservé tout en laissant apparaître sa personnification dans l’action de produire la mort.
- source_word: ἵνα φανῇ ἁμαρτία
  choice: afin qu’il se révèle comme péché
  rationale: La répétition prédicative est rendue explicitement sans effacer la première proposition finale ni la mise en évidence de la véritable nature du péché.
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: au moyen de ce qui est bon
  rationale: La locution exprime clairement la valeur instrumentale de διά et reprend le même substantif neutre que dans la question initiale.
- source_word: μοι κατεργαζομένη θάνατον
  choice: en produisant la mort en moi
  rationale: κατεργάζομαι exprime l’obtention effective d’un résultat; « en moi » rend naturellement la portée personnelle du datif dans ce contexte.
- source_word: ἵνα γένηται
  choice: afin que ... devienne
  rationale: La seconde proposition en ἵνα est conservée distinctement, avec la valeur de γίνομαι.
- source_word: καθ’ ὑπερβολὴν
  choice: au-delà de toute mesure
  rationale: Cette locution française restitue l’idée d’excès extrême avec force et dignité.
- source_word: ἁμαρτωλὸς
  choice: pécheur
  rationale: Le choix conserve le lien lexical délibéré entre « péché » et « pécheur », même si cette personnification est plus frappante en français.
- source_word: διὰ τῆς ἐντολῆς
  choice: par le commandement
  rationale: « Commandement » convient au contexte de la Loi et préserve la construction instrumentale.
theological_decisions:
- issue: Responsabilité respective de ce qui est bon et du péché dans la production de la mort
  choice: La traduction nie que ce qui est bon soit devenu la mort et attribue au péché l’action de produire la mort au moyen de ce qui est bon.
  alternative: Une paraphrase pourrait présenter directement le commandement comme la cause moralement responsable de la mort.
  rationale: Le contraste introduit après μὴ γένοιτο met le péché en position de sujet responsable, tandis que le bien ou le commandement sert de moyen. La traduction maintient cette structure sans supprimer la tension créée par l’emploi instrumental du commandement.
- issue: Valeur des deux propositions introduites par ἵνα
  choice: Les rendre comme des propositions finales avec « afin que ».
  alternative: 'Les comprendre principalement comme des conséquences : « de sorte que ».'
  rationale: ἵνα exprime normalement ici une visée, mais la nuance de résultat demeure possible dans le contexte; elle est donc signalée en note plutôt qu’imposée dans le texte.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La formulation conserve la question rhétorique, le rejet énergique, la personnification du péché et la répétition volontaire entre « péché » et « pécheur ». Les deux propositions finales restent visibles et distinctes.
