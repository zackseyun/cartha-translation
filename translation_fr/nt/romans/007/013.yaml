  terminology: « Ce qui est bon », « péché », « mort » et « commandement » sont appropriés et cohérents avec le contexte paulinien. « Certainement pas ! » rend avec force μὴ γένοιτο. Le terme « péché » est maintenu dans ses répétitions rhétoriques.
