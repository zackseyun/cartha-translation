  source_fidelity: 'Le sens et l’architecture de l’original sont globalement bien préservés : la question rhétorique, le refus catégorique, l’action mortifère du péché par ce qui est bon, et les deux propositions en ἵνα demeurent distincts. Une légère révision rend plus idiomatique en français le datif μοι avec κατεργαζομένη θάνατον et l’intensification finale de ἁμαρτωλός.'
