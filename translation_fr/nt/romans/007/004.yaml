id: ROM.7.4
reference: Romans 7:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: fr
  text: Ainsi donc, mes frères et sœurs[a], vous aussi, vous avez été mis à mort à l’égard de la Loi par le corps du Messie[b], afin d’appartenir à un autre[c], à celui qui a été ressuscité d’entre les morts, pour que nous portions du fruit pour Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « mes frères »; ce pluriel peut s’adresser à un groupe comprenant des hommes et des femmes.
    reason: lexical_alternative
  - marker: b
    text: Ou « Christ ». Le mot grec Christos signifie « Messie », c’est-à-dire « celui qui a reçu l’onction ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « afin de devenir à un autre »; cette expression prolonge l’analogie du mariage développée dans les versets précédents.
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: Ainsi donc
  rationale: Marque naturellement en français la conséquence tirée de l’analogie précédente.
- source_word: ἀδελφοί μου
  choice: mes frères et sœurs
  rationale: Dans cette adresse collective, le masculin pluriel grec peut inclure les femmes; la formulation française explicite cette portée sans changer la fonction de l’apostrophe.
- source_word: ἐθανατώθητε τῷ νόμῳ
  choice: vous avez été mis à mort à l’égard de la Loi
  rationale: Le passif est conservé. « À l’égard de » rend le datif de relation avec clarté sans l’interpréter comme une simple délivrance « de » la Loi.
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: par le corps du Messie
  rationale: διά avec le génitif exprime ici le moyen ou la médiation; « Messie » conserve la valeur titulaire de Χριστός.
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: afin d’appartenir à un autre
  rationale: Rend le but et le transfert relationnel tout en maintenant l’analogie conjugale du contexte.
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: à celui qui a été ressuscité d’entre les morts
  rationale: Conserve la forme passive et rend précisément ἐκ νεκρῶν, sans préciser l’agent implicite.
- source_word: ἵνα καρποφορήσωμεν τῷ θεῷ
  choice: pour que nous portions du fruit pour Dieu
  rationale: Préserve la métaphore du fruit, la valeur finale de ἵνα et le passage textuel de « vous » à « nous ».
theological_decisions:
- issue: Valeur de Χριστοῦ dans le discours paulinien
  choice: Messie
  alternative: Christ
  rationale: Le terme garde ici sa force de titre; « Messie » en rend explicitement le sens sans ajouter de contenu doctrinal.
- issue: Sens de la mort par rapport à la Loi
  choice: mis à mort à l’égard de la Loi
  alternative: morts à la Loi
  rationale: La formulation retenue conserve à la fois le passif grec et le lien relationnel exprimé par le datif, sans trancher davantage la manière exacte dont ce lien a pris fin.
- issue: Maintien de l’analogie conjugale
  choice: afin d’appartenir à un autre
  alternative: afin d’être unis à un autre
  rationale: « Appartenir à un autre » reflète γενέσθαι ἑτέρῳ et la relation conjugale du contexte, tandis que « être unis » expliciterait davantage que le grec.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « vous aussi, vous » sert l’emphase de καὶ ὑμεῖς. La majuscule à « Loi » signale ici la Loi évoquée dans l’argument paulinien. Les deux propositions de but sont distinguées par « afin de » puis « pour que », et le changement de personne de « vous » à « nous » est conservé.
