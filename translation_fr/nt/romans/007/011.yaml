id: ROM.7.11
reference: Romans 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: fr
  text: Car le péché, ayant saisi une occasion au moyen du commandement[a], m’a trompé et, par lui[b], m’a tué.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ayant profité d’une occasion par le moyen du commandement ».'
    reason: lexical_alternative
  - marker: b
    text: Le pronom « lui » renvoie au « commandement ».
    reason: referent_clarification
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: Rend la valeur explicative qui relie ce verset à l’affirmation précédente, dans un français naturel et soutenu.
- source_word: ἡ ἁμαρτία
  choice: le péché
  rationale: Conserve le sens paulinien courant ainsi que la personnification du péché, présenté ici comme l’auteur de plusieurs actions.
- source_word: ἀφορμὴν λαβοῦσα
  choice: ayant saisi une occasion
  rationale: Exprime l’idée de prendre et d’exploiter une occasion, tout en maintenant l’action énergique attribuée au péché.
- source_word: διὰ τῆς ἐντολῆς
  choice: au moyen du commandement
  rationale: Marque clairement la valeur instrumentale de διά et maintient le singulier du grec.
- source_word: ἐξηπάτησέν με
  choice: m’a trompé
  rationale: Traduction directe et idiomatique; le contexte suffit à porter la force du verbe sans ajouter artificiellement un intensif.
- source_word: δι’ αὐτῆς
  choice: par lui
  rationale: Le pronom grec reprend « le commandement »; le masculin français résulte du genre grammatical du nom traduit.
- source_word: ἀπέκτεινεν
  choice: m’a tué
  rationale: Préserve la vigueur du verbe et l’agence meurtrière attribuée au péché, sans l’atténuer par une périphrase.
theological_decisions:
- issue: Degré de personnification du péché
  choice: Présenter le péché comme l’agent actif qui saisit l’occasion, trompe et tue.
  alternative: Atténuer cette personnification en décrivant abstraitement les effets du péché.
  rationale: La syntaxe grecque fait explicitement du péché le sujet de ces actions successives; la traduction conserve cette tension rhétorique et théologique sans l’expliquer ni la résoudre.
- issue: Rôle du commandement
  choice: Conserver son rôle instrumental avec « au moyen du commandement » et « par lui ».
  alternative: Paraphraser le commandement comme la cause morale ou la source directe de la mort.
  rationale: Le texte affirme que le péché agit par le commandement, sans identifier simplement le commandement au mal ni préciser davantage le rapport causal.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation reste proche de la structure grecque tout en évitant les tours archaïques; « m’a tué » conserve la force rhétorique de la personnification.
