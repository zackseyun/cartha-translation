id: ROM.7.5
reference: Romans 7:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: fr
  text: Car, lorsque nous étions dans la chair[a], les passions pécheresses[b], par l’intermédiaire de la Loi, étaient à l’œuvre dans les membres de notre corps[c], en vue de porter du fruit pour la mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sous l’emprise de la nature pécheresse » ou « dans notre condition humaine déchue ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « les passions des péchés ».'
    reason: lexical_alternative
  - marker: c
    text: Les « membres » désignent ici les parties ou les facultés du corps considérées comme des instruments de l’action.
    reason: cultural_note
lexical_decisions:
- source_word: σάρξ
  choice: chair
  rationale: « Chair » conserve le terme paulinien et la tension de l’expression ἐν τῇ σαρκί, sans la réduire d’emblée à une définition doctrinale telle que « nature pécheresse ».
- source_word: παθήματα τῶν ἁμαρτιῶν
  choice: passions pécheresses
  rationale: 'Dans ce contexte, παθήματα désigne des impulsions affectives plutôt que des souffrances. Le génitif τῶν ἁμαρτιῶν est rendu de façon qualificative : les passions sont caractérisées par le péché.'
- source_word: διὰ τοῦ νόμου
  choice: par l’intermédiaire de la Loi
  rationale: Cette formulation conserve la valeur médiatrice ou instrumentale de διά sans préciser excessivement si la Loi suscite, révèle ou fournit l’occasion à ces passions.
- source_word: ἐνηργεῖτο
  choice: étaient à l’œuvre
  rationale: L’imparfait exprime une activité continue dans le passé ; « étaient à l’œuvre » en rend naturellement l’aspect duratif.
- source_word: μέλεσιν
  choice: membres de notre corps
  rationale: Le complément « de notre corps » évite en français moderne l’ambiguïté de « nos membres », tout en conservant l’image des parties corporelles servant d’instruments à l’action.
- source_word: καρποφορῆσαι
  choice: porter du fruit
  rationale: Cette expression naturelle conserve la métaphore organique de Paul et son lien avec le contraste du contexte immédiat.
- source_word: τῷ θανάτῳ
  choice: pour la mort
  rationale: La traduction préserve la formulation abrupte et la direction du fruit produit, sans expliciter davantage la relation comme une simple conséquence.
theological_decisions:
- issue: Sens de ἐν τῇ σαρκί
  choice: dans la chair
  alternative: sous l’emprise de la nature pécheresse / dans notre condition humaine déchue
  rationale: L’expression participe au contraste paulinien entre chair et Esprit. Garder « chair » préserve l’ambiguïté anthropologique et théologique au lieu d’imposer une seule explication.
- issue: Rapport entre les passions pécheresses et la Loi
  choice: qui se manifestaient par l’intermédiaire de la Loi
  alternative: suscitées par la Loi
  rationale: Le grec affirme que ces passions étaient διὰ τοῦ νόμου, mais ne donne pas ici un verbe équivalant explicitement à « susciter ». La formulation retenue exprime leur opération liée à la Loi sans faire de la Loi leur cause morale directe.
- issue: Finalité exprimée par εἰς τὸ καρποφορῆσαι
  choice: afin que nous portions du fruit pour la mort
  alternative: avec pour résultat de produire du fruit pour la mort
  rationale: La construction peut porter une nuance de but ou de résultat. « Afin que » conserve la force téléologique de εἰς τό, tandis que la note théologique reconnaît que le contexte permet aussi une lecture résultative.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de la progression grecque tout en évitant les tournures opaques. « Loi » porte une majuscule pour signaler dans ce contexte la Loi mosaïque ; « chair » et « fruit pour la mort » sont maintenus afin de préserver les images et la tension du texte paulinien.
