revisions:
- from: Car, lorsque nous étions dans la chair[a], les passions pécheresses[b] qui se manifestaient par l’intermédiaire de la Loi étaient à l’œuvre dans les membres de notre corps[c], afin que nous portions du fruit pour la mort.
  to: Car, lorsque nous étions dans la chair[a], les passions pécheresses[b], par l’intermédiaire de la Loi, étaient à l’œuvre dans les membres de notre corps[c], en vue de porter du fruit pour la mort.
  rationale: La révision remplace « qui se manifestaient par l’intermédiaire de la Loi » par l’incise « par l’intermédiaire de la Loi », qui correspond directement à διὰ τοῦ νόμου sans ajouter un procès de manifestation. Elle remplace aussi « afin que nous portions » par « en vue de porter », afin de conserver la finalité/résultat exprimée par εἰς τό tout en ne sur-explicitant pas le sujet de l’infinitif. Toutes les ancres et notes sont conservées et restent correctement associées à leurs termes.
