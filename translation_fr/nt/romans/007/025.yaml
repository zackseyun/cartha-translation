id: ROM.7.25
reference: Romans 7:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: fr
  text: Grâce soit rendue à Dieu par Jésus le Messie, notre Seigneur ! Ainsi donc, moi-même, par l’intelligence, je suis au service de la loi de Dieu, mais, par la chair[a], de la loi du péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la nature pécheresse ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du principe du péché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: Grâce soit rendue à Dieu
  rationale: Dans cette exclamation suivie du datif, χάρις exprime idiomatiquement la reconnaissance adressée à Dieu. Cette tournure française, naturelle dans un registre biblique digne, rend l’action de grâce plutôt que la grâce comme don.
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: par Jésus le Messie, notre Seigneur
  rationale: διά avec le génitif indique ici la médiation. « Le Messie » conserve la valeur de titre de Χριστός, tandis que l’apposition française rend clairement τοῦ κυρίου ἡμῶν.
- source_word: Ἄρα οὖν
  choice: Ainsi donc
  rationale: La combinaison des particules introduit une conclusion récapitulative; « Ainsi donc » en préserve les deux nuances sans lourdeur.
- source_word: αὐτὸς ἐγώ
  choice: moi-même
  rationale: La forme emphatique souligne la personne du locuteur; « moi-même » maintient cette insistance.
- source_word: τῷ μὲν νοῒ … τῇ δὲ σαρκὶ
  choice: par l’intelligence … par la chair
  rationale: Les datifs désignent les facultés ou domaines au moyen desquels le service s’exerce. La construction parallèle en français conserve l’opposition μὲν…δέ.
- source_word: δουλεύω
  choice: je suis au service de
  rationale: Le verbe comporte une idée de sujétion ou de service servile. Cette formulation française reste naturelle tout en étant plus forte que le simple verbe « servir ».
- source_word: νόμῳ θεοῦ
  choice: la loi de Dieu
  rationale: « Loi » maintient le vocabulaire et le fil argumentatif de Romains 7; le génitif est rendu directement.
- source_word: σαρκὶ
  choice: la chair
  rationale: « Chair » préserve le terme paulinien et son ambiguïté anthropologique et morale, sans l’expliciter comme « nature pécheresse ».
- source_word: νόμῳ ἁμαρτίας
  choice: la loi du péché
  rationale: La répétition de « loi » conserve le parallélisme volontaire avec « la loi de Dieu » et évite d’imposer l’interprétation « principe ».
theological_decisions:
- issue: Valeur de σάρξ dans ce contraste moral
  choice: la chair
  alternative: la nature pécheresse
  rationale: Le grec nomme la chair sans définir explicitement une « nature pécheresse ». La traduction retenue conserve donc la tension du texte au lieu de la résoudre doctrinalement.
- issue: Sens de νόμος dans « νόμῳ ἁμαρτίας »
  choice: la loi du péché
  alternative: le principe du péché
  rationale: « Loi » reproduit le même mot grec que dans « loi de Dieu » et maintient le contraste rhétorique; « principe » est explicatif et moins formel.
- issue: Valeur titulaire de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Le rendu par le titre « le Messie » rend explicite le sens de Χριστός sans ajouter de contenu doctrinal.
translation_notes:
  register: Français international moderne, digne et lisible. Le parallélisme entre l’intelligence et la chair, ainsi qu’entre la loi de Dieu et la loi du péché, est maintenu. La ponctuation souligne l’exclamation initiale puis la conclusion récapitulative.
