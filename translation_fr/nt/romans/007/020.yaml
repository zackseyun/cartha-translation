source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: fr
  text: Mais si je fais ce que je ne veux pas, ce n’est plus moi qui l’accomplis, mais le péché qui habite en moi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: Introduit la condition en maintenant le léger contraste avec l’argument précédent.
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: je fais ce que je ne veux pas
  rationale: Formulation naturelle qui conserve la structure relative-corrélative et le sens direct de ποιῶ.
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: ce n’est plus moi qui l’accomplis
  rationale: « Ce n’est plus moi » rend l’emphase du pronom explicite ἐγώ; « accomplis » distingue κατεργάζομαι de ποιῶ et exprime l’idée de produire ou d’effectuer.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: le péché qui habite en moi
  rationale: Conserve le substantif « péché » et la métaphore d’une présence qui demeure en Paul, sans la remplacer par une interprétation telle que « nature pécheresse ».
theological_decisions:
- issue: La distinction rhétorique entre « moi » et « le péché qui habite en moi » peut sembler atténuer la responsabilité personnelle.
  choice: Conserver directement cette distinction et la personnification du péché.
  alternative: Paraphraser afin de préciser la responsabilité humaine ou traduire « péché » par « nature pécheresse ».
  rationale: Le grec maintient délibérément la tension entre le « moi » et le péché résident; la traduction ne doit ni l’expliquer ni la résoudre doctrinalement.
translation_notes:
  register: Français international moderne, clair et digne. « Habite » est courant tout en préservant l’image paulinienne; « accomplis » apporte une légère distinction lexicale sans rendre la phrase artificielle.
