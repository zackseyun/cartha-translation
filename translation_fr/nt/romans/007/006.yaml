revisions:
- from: Mais maintenant, nous avons été libérés de la loi, puisque nous sommes morts à ce qui nous retenait, afin que nous servions dans la nouveauté de l’Esprit[a], et non dans la vétusté de la lettre[b].
  to: Mais maintenant, nous avons été libérés de la loi, étant morts à ce qui nous retenait, afin que nous servions dans la nouveauté de l’Esprit[a], et non dans l’ancien régime de la lettre[b].
  rationale: La révision remplace la conjonction causale par un participe français qui reflète plus directement ἀποθανόντες et substitue à « vétusté » une expression idiomatique qui rend le contraste paulinien entre nouveauté et ancienneté sans introduire l’idée de délabrement. Les deux notes restent correctement ancrées et préservent les alternatives pertinentes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:17:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens central est bien rendu : le sujet implicite est « nous », qui sommes libérés de la loi parce que nous sommes morts à ce qui nous retenait. Le but exprimé par ὥστε est correctement conservé. Toutefois, « puisque » tend à expliciter une causalité là où le participe aoriste garde une relation circonstancielle plus sobre ; « étant morts » est plus proche de la construction grecque.'
  naturalness: La phrase est globalement fluide. « Vétusté » est cependant peu naturel dans ce contexte et suggère surtout la dégradation matérielle due à l’âge, nuance absente de παλαιότης. « Ancien régime de la lettre » est français courant, conserve le contraste avec la nouveauté et reste suffisamment proche du sens contextuel.
  terminology: « la loi », « l’Esprit », « la lettre » et « servir » sont appropriés. La majuscule à « Esprit » adopte la lecture la plus probable sans supprimer l’alternative en note. La note sur « esprit » demeure nécessaire ; l’alternative « code écrit » est également recevable.
  issues:
  - severity: medium
    issue: « puisque nous sommes morts » explicite la relation du participe ἀποθανόντες.
    rationale: Le grec emploie un participe aoriste nominatif pluriel, sans conjonction causale explicite. « Étant morts » conserve mieux son lien circonstanciel avec la proposition principale et maintient clairement que les croyants sont ceux qui meurent.
  - severity: medium
    issue: « vétusté » est un faux ami contextuel pour παλαιότης.
    rationale: En français moderne, le mot évoque communément un état de délabrement ou d’usure. Paul oppose ici le caractère nouveau à l’ancien régime de la lettre, non une détérioration matérielle.
  revised_text: Mais maintenant, nous avons été libérés de la loi, étant morts à ce qui nous retenait, afin que nous servions dans la nouveauté de l’Esprit[a], et non dans l’ancien régime de la lettre[b].
  revised_footnotes:
  - marker: a
    text: Ou « dans la nouveauté de l’esprit ».
    reason: alternative_reading
  - marker: b
    text: Ou « dans l’ancien régime du code écrit ».
    reason: lexical_alternative
  revision_rationale: La révision remplace la conjonction causale par un participe français qui reflète plus directement ἀποθανόντες et substitue à « vétusté » une expression idiomatique qui rend le contraste paulinien entre nouveauté et ancienneté sans introduire l’idée de délabrement. Les deux notes restent correctement ancrées et préservent les alternatives pertinentes.
