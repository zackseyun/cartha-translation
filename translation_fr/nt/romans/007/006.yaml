id: ROM.7.6
reference: Romans 7:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: fr
  text: Mais maintenant, nous avons été libérés de la loi, étant morts à ce qui nous retenait, afin que nous servions dans la nouveauté de l’Esprit[a], et non dans l’ancien régime de la lettre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans la nouveauté de l’esprit ».
    reason: alternative_reading
  - marker: b
    text: Ou « dans l’ancien régime du code écrit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: nous avons été libérés de la loi
  rationale: Dans cette construction avec ἀπό, le passif exprime la libération par rapport à l’emprise de la loi, sans laisser entendre que la loi aurait cessé d’exister.
- source_word: ἀποθανόντες
  choice: puisque nous sommes morts
  rationale: Le participe aoriste se rapporte au sujet « nous ». « Puisque » rend naturellement ici la circonstance qui fonde la libération, tout en maintenant que ce sont les croyants qui sont morts.
- source_word: ἐν ᾧ κατειχόμεθα
  choice: à ce qui nous retenait
  rationale: Cette formulation française naturelle conserve l’indétermination du relatif grec et l’idée d’une emprise antérieure exprimée par κατέχω.
- source_word: δουλεύειν
  choice: servions
  rationale: Le verbe peut évoquer le service d’un esclave, mais « servir » convient au contraste portant ici sur la manière nouvelle ou ancienne d’accomplir ce service.
- source_word: καινότητι
  choice: dans la nouveauté
  rationale: Le nom abstrait préserve la symétrie rhétorique avec παλαιότητι et reste intelligible dans un registre biblique digne.
- source_word: πνεύματος
  choice: de l’Esprit
  rationale: Le contraste paulinien entre πνεῦμα et γράμμα favorise une référence à l’Esprit saint, sans rendre impossible le sens plus général « esprit », signalé en note.
- source_word: παλαιότητι
  choice: dans la vétusté
  rationale: « Vétusté » rend le nom abstrait et son opposition formelle à « nouveauté » ; le terme décrit ici le caractère ancien du régime de la lettre.
- source_word: γράμματος
  choice: de la lettre
  rationale: La traduction directe conserve l’expression et la tension propres à Paul plutôt que de l’expliciter d’emblée comme « code écrit ».
theological_decisions:
- issue: 'Qui est mort : la loi ou les croyants ?'
  choice: Les croyants sont morts à ce qui les retenait.
  alternative: La loi serait morte ou rendue inopérante à leur égard.
  rationale: ἀποθανόντες est un participe nominatif pluriel qui renvoie grammaticalement au sujet implicite « nous » ; la traduction ne transfère donc pas la mort à la loi.
- issue: Référent de πνεύματος
  choice: l’Esprit saint
  alternative: l’esprit, au sens d’une disposition ou d’une réalité spirituelle nouvelle
  rationale: Le contraste paulinien entre l’Esprit et la lettre, dans le cadre de la nouvelle alliance, rend la référence à l’Esprit saint plus probable, mais l’absence d’article en grec permet de conserver l’autre compréhension en note.
- issue: Sens de γράμματος
  choice: la lettre
  alternative: le code écrit
  rationale: « La lettre » préserve l’idiome et sa portée théologique sans réduire le terme au seul texte écrit ; l’explicitation possible est donnée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase maintient les noms abstraits « nouveauté » et « vétusté » afin de préserver le parallélisme grec, tout en employant une syntaxe fluide. Les marqueurs [a] et [b] figurent dans le texte principal.
