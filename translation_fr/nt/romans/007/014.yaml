id: ROM.7.14
reference: Romans 7:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: fr
  text: Nous savons, en effet, que la loi est spirituelle, mais moi, je suis charnel[a], vendu au péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fait de chair ».
    reason: lexical_alternative
  - marker: b
    text: Ou « vendu comme esclave sous le pouvoir du péché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: Nous savons
  rationale: Rend directement la connaissance établie que Paul partage avec ses destinataires.
- source_word: ὁ νόμος
  choice: la loi
  rationale: Conserve la formulation grecque sans préciser davantage dans le texte principal, même si le contexte de Romains renvoie souvent à la loi de Moïse.
- source_word: πνευματικός
  choice: spirituelle
  rationale: Équivalent français naturel qui maintient le contraste explicite avec σάρκινος, sans imposer « donnée par l’Esprit » ou une autre interprétation plus précise.
- source_word: σάρκινός
  choice: charnel
  rationale: Préserve le vocabulaire de la chair et le contraste avec « spirituelle », sans développer en « de nature pécheresse », formulation plus interprétative.
- source_word: πεπραμένος
  choice: vendu
  rationale: Le participe parfait passif décrit l’état résultant d’une vente; « vendu » conserve avec concision cette métaphore.
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: au péché
  rationale: Dans le cadre de la métaphore de la vente et de l’esclavage, « vendu au péché » est idiomatique en français tout en exprimant la sujétion indiquée par le grec.
theological_decisions:
- issue: Portée du langage paulinien de la chair
  choice: Employer « charnel » dans le texte principal.
  alternative: « fait de chair », « non spirituel » ou « de nature pécheresse »
  rationale: « Charnel » maintient la tension entre la loi spirituelle et le moi marqué par la chair, sans réduire l’anthropologie de Paul à une formule doctrinale ultérieure.
- issue: Force de la métaphore de la vente sous le péché
  choice: Traduire « vendu au péché » et expliciter en note la nuance d’esclavage et de domination.
  alternative: « vendu comme esclave sous le pouvoir du péché » dans le texte principal
  rationale: Le texte principal reste proche et naturel, tandis que la note rend perceptible la sujétion impliquée sans surcharger la phrase.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « mais moi, je suis » conserve l’opposition appuyée de ἐγὼ δέ. « Charnel » est un terme biblique encore intelligible; la note en précise le sens concret. Tous les appels de note figurent dans le texte.
