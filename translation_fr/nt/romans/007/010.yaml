reference: Romans 7:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: fr
  text: Moi, je suis mort, et ce commandement, qui était pour la vie, s’est avéré être, pour moi, pour la mort.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus naturellement : « ce commandement, qui devait mener à la vie, s’est avéré pour moi mener à la mort ». Le grec répète littéralement la construction « pour la vie / pour la mort » et souligne « ce commandement » par un démonstratif.'
    reason: Préserve le parallélisme des deux expressions introduites par εἰς et signale la valeur emphatique de αὕτη, tout en proposant une formulation française plus idiomatique.
lexical_decisions:
- source_word: ἀπέθανον
  choice: je suis mort
  rationale: L’aoriste actif énonce directement l’événement ou le résultat passé, sans suggérer un processus.
- source_word: εὑρέθη μοι
  choice: il s’est avéré … pour moi
  rationale: Cette tournure française rend naturellement le passif grec avec le datif μοι, en conservant l’idée d’un résultat constaté dans l’expérience de Paul.
- source_word: ἐντολή
  choice: le commandement
  rationale: Ce terme courant et digne correspond au singulier grec sans ajouter explicitement « de la Loi ».
- source_word: ἡ εἰς ζωὴν
  choice: qui devait conduire à la vie
  rationale: La formulation exprime la direction ou le résultat associé au commandement tout en restant naturelle en français; elle ne prétend pas que le commandement aurait échoué dans une intention divine.
- source_word: αὕτη
  choice: repris implicitement comme sujet de « conduisait »
  rationale: Le démonstratif souligne que ce même commandement se trouve associé à la mort; la reprise verbale française transmet ce contraste sans lourdeur.
- source_word: εἰς θάνατον
  choice: conduisait, pour moi, à la mort
  rationale: Le parallèle « conduire à la vie / conduire à la mort » préserve l’opposition rhétorique des deux groupes introduits par εἰς, sans expliciter davantage la causalité.
theological_decisions:
- issue: Faut-il dire que le commandement a « causé » ou « apporté » la mort ?
  choice: conduisait, pour moi, à la mort
  alternative: m’a apporté la mort
  rationale: La traduction retenue maintient le résultat paradoxal constaté par Paul sans attribuer au commandement une causalité plus précise que ne le fait le grec.
- issue: Valeur de l’expression ἡ εἰς ζωὴν
  choice: qui devait conduire à la vie
  alternative: destiné à donner la vie
  rationale: « Devait conduire » conserve la tension entre la vie associée au commandement et son issue mortelle pour Paul, sans définir plus précisément s’il s’agit d’une intention, d’une fonction ou d’un résultat attendu.
translation_notes:
  register: Français moderne, international et digne. « Moi, en revanche » rend le contraste de ἐγὼ δέ; le parallélisme verbal rend le verset accessible tout en conservant son paradoxe théologique.
