reference: Romans 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: fr
  text: En effet, une femme mariée est liée par la loi à son mari tant qu’il est en vie ; mais si son mari meurt, elle est dégagée de la loi de son mari[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de la loi du mari ». L’expression grecque désigne probablement la règle juridique qui la liait à son mari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: une femme mariée
  rationale: L’expression désigne une femme engagée dans le lien du mariage. « Une femme mariée » est naturel en français moderne et conserve la portée juridique et conjugale.
- source_word: τῷ ζῶντι ἀνδρί
  choice: à son mari tant qu’il est en vie
  rationale: Cette formulation rend clairement la condition exprimée par « vivant » et restitue de façon idiomatique la relation conjugale implicite dans le grec.
- source_word: δέδεται
  choice: est liée
  rationale: Le parfait passif décrit un état présent résultant d’un engagement antérieur. « Est liée » exprime cet état continu sans alourdir la phrase.
- source_word: νόμῳ
  choice: par la loi
  rationale: Dans ce cadre matrimonial, le terme renvoie au principe juridique qui régit le lien conjugal, sans imposer ici une identification explicite à la seule loi mosaïque.
- source_word: κατήργηται
  choice: est dégagée
  rationale: Le verbe indique que l’obligation ou l’autorité juridique ne s’exerce plus sur elle. « Est dégagée » convient à l’image d’un lien légal devenu inopérant.
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: de la loi qui la liait à lui
  rationale: Le génitif grec est condensé et peut sembler faire du mari le législateur s’il est rendu mot à mot. Cette formulation exprime le lien juridique relatif au mari tout en signalant la traduction littérale en note.
theological_decisions:
- issue: νόμῳ et τοῦ νόμου désignent-ils précisément la loi mosaïque ou, plus généralement, la règle juridique du mariage ?
  choice: la règle juridique qui établit le lien conjugal
  alternative: la loi mosaïque dans son application au mariage
  rationale: Le cadre immédiat est celui du mariage, et l’absence d’article devant le premier νόμῳ favorise une valeur générale ou qualitative. Paul emploie ici ce principe juridique comme analogie, sans identifier explicitement dans ce verset la règle matrimoniale à toute la loi mosaïque.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le raisonnement juridique de Paul, tandis que la note préserve la formulation grecque condensée et son ambiguïté.
