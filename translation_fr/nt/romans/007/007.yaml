  variant: modern international French
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: fr
  text: 'Que dirons-nous donc ? La loi est-elle péché ? Certainement pas ! Au contraire, je n’aurais pas connu le péché sans la loi. En effet, je n’aurais pas connu la convoitise[a] si la loi n’avait pas dit : « Tu ne convoiteras pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « désir » ; toutefois, la citation immédiate du commandement favorise ici le sens plus précis de « convoitise ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Que dirons-nous donc ?
  rationale: Conserve la formule de transition rhétorique de Paul dans un français naturel et soutenu.
- source_word: ὁ νόμος
  choice: la loi
  rationale: Équivalent usuel de νόμος dans l’argumentation paulinienne ; l’article grec et le contexte renvoient à la loi mosaïque.
- source_word: ἁμαρτία
  choice: péché
  rationale: Le nom attribut pose une question d’identification entre la loi et le péché, plutôt qu’une simple qualification morale de la loi.
- source_word: μὴ γένοιτο
  choice: Certainement pas !
  rationale: Rend la répudiation énergique de Paul en français moderne sans recourir à une tournure archaïque.
- source_word: ἀλλὰ
  choice: Au contraire
  rationale: Marque nettement la correction argumentative qui suit le refus catégorique.
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: je n’aurais pas connu le péché si ce n’est par la loi
  rationale: Exprime naturellement la valeur conditionnelle du propos tout en conservant l’idée que la connaissance du péché vient par l’intermédiaire de la loi.
- source_word: ἐπιθυμίαν
  choice: convoitise
  rationale: Le sens large peut être « désir », mais la citation immédiate du commandement Οὐκ ἐπιθυμήσεις favorise ici le sens précis de convoitise.
- source_word: οὐκ ᾔδειν
  choice: je n’aurais pas connu
  rationale: Maintient en français le parallélisme avec la proposition précédente, malgré l’emploi de deux verbes grecs différents.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Tu ne convoiteras pas
  rationale: Formulation claire et traditionnelle de l’interdiction, qui conserve la force légale du futur prohibitif.
theological_decisions:
- issue: Rapport entre la loi et le péché
  choice: La loi est-elle péché ? Certainement pas !
  alternative: La loi est-elle pécheresse ?
  rationale: Le grec emploie le nom attribut ἁμαρτία et demande si la loi doit être identifiée au péché ; « pécheresse » atténuerait et modifierait cette formulation théologique volontairement abrupte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe rhétorique de Paul est conservée, ainsi que la formulation abrupte « la loi est-elle péché ? ». Le vocabulaire reste accessible, avec une note pour préserver l’étendue sémantique de ἐπιθυμία.
