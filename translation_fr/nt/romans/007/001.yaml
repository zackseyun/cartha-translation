    rationale: ἀδελφοί est grammaticalement masculin pluriel. Son adresse peut inclure des femmes, mais cette inclusion contextuelle ne requiert pas l’ajout de « sœurs » dans le texte; une note permet de conserver à la fois la forme source et l’information contextuelle.
  - severity: low
    issue: « à des gens qui connaissent la loi »
    rationale: « Des gens » est légèrement familier et moins adapté au registre de l’argumentation épistolaire; « ceux qui connaissent la loi » est plus fluide et plus soutenu.
  revised_text: Ou bien ignorez-vous, frères[a] — car je m’adresse à ceux qui connaissent la loi — que la loi a autorité sur une personne tant qu’elle vit ?
