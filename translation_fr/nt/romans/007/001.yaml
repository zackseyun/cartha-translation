id: ROM.7.1
reference: Romans 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: fr
  text: Ou bien ignorez-vous, frères[a] — car je m’adresse à ceux qui connaissent la loi — que la loi a autorité sur une personne tant qu’elle vit ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Frères » traduit le pluriel masculin grec adelphoi. Dans ce contexte, l’adresse de Paul comprend probablement aussi les femmes parmi ses destinataires.
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: Ou bien
  rationale: Marque naturellement en français la transition argumentative et l’alternative rhétorique avec ce qui précède.
- source_word: ἀγνοεῖτε
  choice: ignorez-vous
  rationale: Conserve la question rhétorique au présent et l’appel de Paul à un savoir partagé.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans l’adresse à l’assemblée chrétienne mixte de Rome, le pluriel masculin grec a une portée inclusive; la formulation explicite cette portée en français moderne sans suggérer que seules les personnes de sexe masculin sont visées.
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: car je parle à des gens qui connaissent la loi
  rationale: Rend la valeur explicative de γάρ et le participe substantivé dans un français clair et naturel.
- source_word: νόμον / ὁ νόμος
  choice: la loi
  rationale: Maintient le même terme dans les deux occurrences sans préciser dans la traduction s’il s’agit exclusivement de la loi de Moïse ou de la loi envisagée plus généralement.
- source_word: κυριεύει
  choice: exerce son autorité sur
  rationale: Exprime la domination ou l’autorité indiquée par le verbe, dans un registre digne et idiomatique.
- source_word: τοῦ ἀνθρώπου
  choice: une personne
  rationale: ἄνθρωπος est générique ici et ne désigne pas spécifiquement un homme.
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: aussi longtemps qu’elle vit
  rationale: Rend directement la durée exprimée par l’idiome grec; le pronom féminin reprend grammaticalement « une personne » sans attribuer de sexe au référent générique.
theological_decisions:
- issue: Portée de νόμος dans l’affirmation de Paul
  choice: Traduire simplement par « la loi » sans en restreindre explicitement la portée.
  alternative: Préciser « la loi de Moïse » ou comprendre « la loi » comme un principe juridique général.
  rationale: Le contexte fait particulièrement penser à la loi mosaïque, mais la formulation grecque reste assez générale. La traduction préserve cette ouverture et laisse l’argument des versets suivants la préciser.
translation_notes:
  register: Français international moderne, clair et digne. Les tirets isolent l’explication parenthétique de Paul. L’inclusif « frères et sœurs » communique directement la portée pragmatique de l’adresse grecque; aucune note n’est donc nécessaire.
