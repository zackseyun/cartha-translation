  to: Ou bien ignorez-vous, frères[a] — car je m’adresse à ceux qui connaissent la loi — que la loi a autorité sur une personne tant qu’elle vit ?
  rationale: La révision conserve les choix lexicaux essentiels et l’ambiguïté de νόμος, tout en rétablissant la forme masculine de ἀδελφοί dans le texte principal et en reportant sa portée inclusive probable dans une note. Elle améliore également le registre de la parenthèse explicative.
