id: ROM.7.17
reference: Romans 7:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: fr
  text: Mais maintenant, ce n’est plus moi qui l’accomplis[a], mais le péché qui habite en moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce n’est plus moi qui le fais, mais le péché qui habite en moi ».'
    reason: Alternative lexicale et syntaxique naturelle pour κατεργάζομαι et l’ensemble de la proposition.
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: Cette expression marque à la fois la transition et le contraste avec l’argument précédent; « Mais maintenant » les rend naturellement en français.
- source_word: οὐκέτι ἐγὼ
  choice: ce n’est plus moi
  rationale: La tournure met en relief le pronom explicite et emphatique ἐγώ tout en restant idiomatique en français.
- source_word: κατεργάζομαι
  choice: j’accomplis
  rationale: Dans ce contexte, le verbe désigne le fait de réaliser ou de commettre l’acte évoqué. « Accomplir » conserve davantage que « faire » la force de mise à exécution du grec.
- source_word: αὐτό
  choice: le
  rationale: Le pronom reprend l’acte mentionné dans le contexte précédent; le pronom objet français « le » constitue la reprise la plus naturelle.
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: le péché qui habite en moi
  rationale: Cette formulation conserve l’article, la proposition participiale et la personnification frappante du péché, dans un français naturel et digne.
- source_word: οἰκοῦσα
  choice: qui habite
  rationale: « Habiter » préserve l’image d’une présence établie exprimée par le grec, avec un registre courant mais soutenu.
theological_decisions:
- issue: La distinction entre « moi » et « le péché qui habite en moi » pourrait être comprise comme une manière d’esquiver la responsabilité personnelle.
  choice: Conserver sans l’atténuer la distinction tranchée formulée dans le texte.
  alternative: Paraphraser en termes de conflit intérieur ou ajouter une précision sur la responsabilité.
  rationale: Le grec énonce directement cette tension entre le « moi » et le péché qui l’habite. La traduction ne doit ni la résoudre ni lui ajouter une explication doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde le contraste appuyé du grec et sa personnification du péché, sans explicitation théologique ajoutée.
