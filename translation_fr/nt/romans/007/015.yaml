  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: fr
  text: En effet, je ne comprends pas ce que je fais, car je ne fais pas ce que je veux, mais je fais ce que je déteste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: j’accomplis
  rationale: Le verbe désigne ici ce que le sujet produit ou accomplit effectivement. « J’accomplis » le distingue de πράσσω et ποιῶ tout en restant naturel en français.
- source_word: οὐ γινώσκω
  choice: je ne comprends pas
  rationale: Dans ce contexte, γινώσκω ne signifie probablement pas une absence de connaissance factuelle, mais l’incapacité à saisir ou à reconnaître pleinement sa propre conduite.
- source_word: πράσσω
  choice: je ne pratique pas
  rationale: « Pratiquer » rend l’idée d’une conduite effectivement mise en œuvre et préserve une légère distinction avec ποιῶ.
- source_word: ποιῶ
  choice: je fais
  rationale: Le français courant « faire » rend simplement l’acte commis et reproduit le contraste final.
theological_decisions:
- issue: Valeur explicative du second γάρ
  choice: Ponctuation par deux-points, sans ajouter « parce que »
  alternative: « car » ou « parce que »
  rationale: Le second γάρ introduit l’explication de l’affirmation précédente. Les deux-points expriment clairement ce rapport sans surcharger la phrase ni trancher plus qu’il ne faut entre justification et explicitation.
- issue: Identité et condition spirituelle du « je »
  choice: Ne pas expliciter le référent ni son état spirituel
  alternative: Identifier le « je » comme Paul croyant, Paul avant sa conversion, Adam, Israël ou l’humanité
  rationale: Le verset seul ne résout pas ce débat. La traduction conserve donc la première personne et la tension du texte sans importer une interprétation doctrinale.
translation_notes:
  register: Français moderne, international et digne. La formulation reste directe et accessible, avec une distinction lexicale mesurée entre « accomplir », « pratiquer » et « faire », sans rendre le français artificiel.
