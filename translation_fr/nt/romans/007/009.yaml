id: ROM.7.9
reference: Romans 7:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: fr
  text: Autrefois, j’étais en vie sans la loi ; mais quand le commandement est venu, le péché a repris vie[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a pris vie ».'
    reason: Alternative lexicale possible pour ἀνέζησεν, dont le préfixe peut suggérer une reprise de vie sans que cette nuance soit obligatoire.
lexical_decisions:
- source_word: ἔζων
  choice: je vivais
  rationale: Le verbe est rendu naturellement en français tout en conservant, avec « a pris vie » dans la suite, le contraste entre vie et mort développé dans le contexte.
- source_word: χωρὶς νόμου
  choice: sans la loi
  rationale: « Sans » exprime clairement la séparation marquée par χωρίς ; l'article convient à la référence probable à la Loi dans ce contexte paulinien.
- source_word: ποτέ
  choice: autrefois
  rationale: Ce terme temporel rend clairement le regard rétrospectif de Paul en français courant.
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: quand le commandement est venu
  rationale: La construction absolue grecque est transformée en proposition temporelle naturelle, sans perdre son caractère événementiel.
- source_word: ἐντολῆς
  choice: le commandement
  rationale: « Commandement » correspond au vocabulaire biblique du contexte et maintient son lien avec la loi.
- source_word: ἁμαρτία
  choice: le péché
  rationale: Le singulier avec article conserve la personnification du péché chez Paul.
- source_word: ἀνέζησεν
  choice: a pris vie
  rationale: Cette expression préserve l'image d'un péché personnifié qui s'anime, tout en restant naturelle en français ; le sens « a repris vie » demeure lexicalement possible.
theological_decisions:
- issue: Faut-il présenter la déclaration de Paul comme strictement autobiographique, représentative ou liée à l'histoire du salut ?
  choice: Conserver simplement la première personne sans explicitation interprétative.
  alternative: Préciser qu'il s'agit soit de l'expérience personnelle de Paul, soit d'une parole représentative d'Israël ou de l'humanité sous la loi.
  rationale: Le grec de ce verset ne tranche pas à lui seul cette question ; la traduction maintient donc l'ambiguïté et la tension théologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Autrefois » évite un ordre des mots lourd ; « je vivais » est idiomatique, tandis que la note préserve la nuance possible de reprise exprimée par ἀνέζησεν.
