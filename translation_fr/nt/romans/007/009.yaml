    issue: « je vivais » peut signifier simplement « je menais ma vie » plutôt que « j’étais vivant ».
    rationale: ἔζων est mis en regard de ἀνέζησεν et de la mort mentionnée au verset suivant; « j’étais en vie » préserve plus nettement ce contraste sans trancher son interprétation.
  - severity: low
    issue: La traduction principale de ἀνέζησεν ne reflète pas aussi clairement que possible la nuance de reprise portée par ἀνά.
    rationale: « A repris vie » est une option française naturelle et proche du sens lexical possible; la note conserve « a pris vie », qui reste également défendable selon le contexte.
