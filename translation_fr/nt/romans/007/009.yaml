  verdict: revise
  source_fidelity: La structure temporelle, la première personne et la personnification de « le péché » sont fidèlement rendues. Toutefois, « je vivais » affaiblit légèrement le contraste explicite entre être vivant et mourir qui encadre la phrase dans le contexte immédiat; « j’étais en vie » le rend plus directement. Pour ἀνέζησεν, « a repris vie » rend bien la nuance possible du préfixe ἀνά, tout en laissant en note l’alternative moins marquée « a pris vie ».
  naturalness: « Autrefois, j’étais en vie sans la loi » est naturel en français international moderne et conserve un registre biblique sobre. La ponctuation avec point-virgule et l’enchaînement « mais quand » sont fluides.
  terminology: « la loi », « le commandement » et « le péché » sont cohérents avec le vocabulaire paulinien. « Le péché » au singulier maintient sans explicitation la personnification du grec.
  issues:
