id: ROM.7.19
reference: Romans 7:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: fr
  text: Car je ne fais pas le bien que je veux, mais le mal que je ne veux pas, voilà ce que je pratique.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « c’est cela que je fais ». Le grec emploie ici un autre verbe que dans la première partie du verset, mais leurs sens se recoupent largement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: je veux
  rationale: « Vouloir » exprime naturellement la volonté dans ce contexte, sans connotation philosophique excessive.
- source_word: ποιῶ
  choice: je fais
  rationale: « Faire » est le rendu français le plus direct et courant; il convient au premier membre tout en permettant de distinguer πράσσω dans le second.
- source_word: ἀγαθόν
  choice: le bien
  rationale: « Le bien » conserve la force morale de l’adjectif substantivé et forme un parallèle net avec « le mal ».
- source_word: κακὸν
  choice: le mal
  rationale: « Le mal » rend directement la catégorie morale exprimée et préserve l’opposition avec « le bien ».
- source_word: πράσσω
  choice: je pratique
  rationale: « Pratiquer » maintient une distinction possible avec ποιῶ et évoque la conduite effectivement accomplie, sans nier le large chevauchement sémantique des deux verbes.
- source_word: τοῦτο
  choice: voilà ce que
  rationale: Cette tournure française naturelle conserve la reprise emphatique du démonstratif grec.
- source_word: οὐ γὰρ
  choice: Car je ne… pas
  rationale: « Car » garde la fonction explicative de γάρ et relie le verset au raisonnement précédent.
theological_decisions:
- issue: Faut-il atténuer l’opposition morale de Paul?
  choice: Conserver « le bien » et « le mal » comme catégories morales directes.
  alternative: « ce qui est juste » / « ce qui est mauvais », ou « le bon » / « le mauvais »
  rationale: Les termes grecs portent ici une opposition morale forte; la traduction ne doit ni l’affaiblir ni résoudre la tension du propos.
- issue: Faut-il imposer une nette différence entre ποιῶ et πράσσω?
  choice: Employer « faire » puis « pratiquer », avec une note signalant leur recoupement.
  alternative: Traduire les deux verbes par « faire ».
  rationale: Le changement de verbe dans le grec mérite d’être perceptible, mais il ne faut pas transformer cette variation en distinction théologique certaine.
translation_notes:
  register: Français international moderne, naturel et digne. La construction parallèle et l’opposition « le bien / le mal » sont conservées; « voilà ce que » restitue l’emphase de τοῦτο sans lourdeur.
