id: ROM.7.12
reference: Romans 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: fr
  text: Ainsi donc, la loi est sainte, et le commandement est saint, juste et bon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi donc
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent tout en conservant la force déductive du grec.
- source_word: νόμος
  choice: la loi
  rationale: Préserve la formulation de Paul sans préciser davantage dans le texte qu’il s’agit de la loi de Moïse, bien que le contexte l’indique.
- source_word: ἅγιος / ἁγία
  choice: saint / sainte
  rationale: Rend le terme théologique courant qui exprime ici la sainteté de la loi et du commandement; l’accord grammatical français exige les deux formes.
- source_word: ἐντολή
  choice: le commandement
  rationale: Désigne naturellement un commandement particulier au sein de la loi et conserve la portée morale formelle du grec.
- source_word: δικαία
  choice: juste
  rationale: « Juste » est idiomatique en français pour qualifier un commandement conforme à la justice et évite le tour moins naturel « droit » dans cette série d’adjectifs.
- source_word: ἀγαθή
  choice: bon
  rationale: Traduction simple qui conserve à la fois la valeur morale et la qualité bénéfique du commandement sans ajouter d’interprétation.
- source_word: μὲν
  choice: non exprimé explicitement
  rationale: La particule apporte une légère mise en relief, mais, en l’absence d’un δέ correspondant, la rendre alourdirait inutilement la phrase française.
theological_decisions:
- issue: Portée de νόμος
  choice: Maintenir « la loi » sans explicitation
  alternative: « la loi de Moïse »
  rationale: Le contexte de Romains éclaire le référent, mais le verset lui-même emploie simplement νόμος; la traduction évite donc de résoudre dans le texte ce qui reste implicite.
translation_notes:
  register: Français international moderne, digne et accessible. La structure coordonnée et la triple qualification du commandement sont conservées; aucun marqueur de note n’est nécessaire.
