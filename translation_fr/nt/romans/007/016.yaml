id: ROM.7.16
reference: Romans 7:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: fr
  text: Mais si je fais ce que je ne veux pas, je reconnais que la loi est bonne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: Conserve la valeur conditionnelle de εἰ et la nuance légèrement contrastive de δέ dans un français naturel.
- source_word: ὃ … τοῦτο
  choice: ce que
  rationale: Rend naturellement en français la construction corrélative grecque sans en alourdir la forme.
- source_word: θέλω
  choice: je veux
  rationale: Exprime directement la volonté intérieure mise en contraste avec l’action accomplie.
- source_word: ποιῶ
  choice: je fais
  rationale: Reproduit simplement le présent et le vocabulaire courant du grec.
- source_word: σύμφημι
  choice: je reconnais avec
  rationale: Exprime l’assentiment donné au jugement de la loi tout en gardant le complément datif τῷ νόμῳ; cette tournure évite l’éventuelle impression que Paul et la loi seraient deux interlocuteurs débattant entre eux.
- source_word: τῷ νόμῳ
  choice: avec la loi
  rationale: Le groupe défini renvoie à la loi déjà connue dans le raisonnement; la minuscule évite d’en faire artificiellement un titre.
- source_word: καλός
  choice: bonne
  rationale: Rend directement l’évaluation morale positive de la loi; le féminin s’accorde avec « loi ».
theological_decisions:
- issue: L’affirmation positive concernant la loi
  choice: « je reconnais avec la loi qu’elle est bonne »
  alternative: « je reconnais que la loi est bonne »
  rationale: La formulation retenue conserve la construction grecque selon laquelle Paul donne son assentiment à la loi et reconnaît sa bonté, sans atténuer la tension avec son incapacité à faire ce qu’il veut.
- issue: Référent du pronom dans ὅτι καλός
  choice: « qu’elle est bonne », où « elle » renvoie à la loi
  alternative: « qu’il est bon », pouvant grammaticalement suggérer que le contenu ou le commandement est bon
  rationale: L’adjectif grec καλός s’accorde naturellement avec νόμος sous-entendu; le français exige ici un pronom genré, et « elle » rend ce lien de façon claire.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste concise et suit de près la progression logique de Paul. « Je reconnais avec la loi » est légèrement plus soutenu que « je suis d’accord avec la loi », mais convient mieux au registre biblique sans devenir archaïque.
