  text: συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/022.yaml
  text: For I delight in the law of God in my inner man,[a]
translation:
  language: fr
  text: Car, je prends plaisir à la loi de Dieu selon mon être intérieur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « selon l’homme intérieur » ; ou « selon l’être intérieur ».'
    reason: Préserve la métaphore grecque et le sens de κατά, tout en signalant une alternative française inclusive et sans imposer de modèle anthropologique technique.
lexical_decisions:
- source_word: συνήδομαι
  choice: je prends plaisir à
  rationale: Le verbe exprime une approbation joyeuse, et non un simple accord intellectuel. Cette tournure est naturelle en français et conserve la dimension affective.
- source_word: τῷ νόμῳ τοῦ θεοῦ
  choice: à la loi de Dieu
  rationale: Le datif dépend du verbe συνήδομαι. « La loi de Dieu » maintient le vocabulaire paulinien établi et son poids théologique.
- source_word: κατὰ τὸν ἔσω ἄνθρωπον
  choice: au plus profond de moi-même
  rationale: Dans ce contexte à la première personne, l’expression rend naturellement la sphère intérieure désignée par la métaphore grecque, sans proposer un modèle technique de la composition humaine.
theological_decisions:
- issue: Portée anthropologique de τὸν ἔσω ἄνθρωπον
  choice: au plus profond de moi-même
  alternative: selon l’être intérieur / selon l’homme intérieur
  rationale: La formulation désigne la personne dans sa dimension intérieure sans trancher les débats sur l’anthropologie paulinienne. Le français littéral « homme intérieur » peut être compris à tort comme une désignation sexuée, tandis que « être intérieur » conserve davantage la forme source mais paraît moins naturel ici.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le lien explicatif de γάρ par « Car » et évite tout vocabulaire confessionnel technique.
