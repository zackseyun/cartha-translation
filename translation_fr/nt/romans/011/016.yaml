  source_fidelity: 'Le parallélisme conditionnel et l’ellipse verbale du grec sont bien rendus. « Sainte », « racine » et « branches » sont fidèles et ne tranchent pas la nature de la sainteté. Toutefois, « la part offerte en prémices » est une explicitation lourde et peu idiomatique : en français biblique et courant, « les prémices » est l’expression naturelle, même si ἀπαρχή est au singulier grec.'
  naturalness: La formulation proposée est globalement claire et de registre approprié, mais « part offerte en prémices » sonne administratif et redondant. « Les prémices » rend l’image cultuelle avec davantage de concision et de naturel. « Toute la pâte » exprime clairement la totalité impliquée par l’analogie.
  terminology: « Les prémices » conserve le champ cultuel sans le réduire à une simple première portion. « Saintes » préserve le terme théologique grec sans interprétation confessionnelle. La note maintient utilement l’alternative lexicale pour φύραμα.
