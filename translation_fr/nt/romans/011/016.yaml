id: ROM.11.16
reference: Romans 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: fr
  text: Si les prémices sont saintes, toute la pâte[a] l’est aussi ; et si la racine est sainte, les branches le sont aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : toute la masse de pâte. Le mot grec désigne une masse ou un mélange de pâte.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: la part offerte en prémices
  rationale: Cette formulation conserve l’idée cultuelle de la première part consacrée à Dieu tout en rendant clairement le singulier grec et son rapport avec la pâte.
- source_word: ἁγία
  choice: sainte
  rationale: « Sainte » préserve la catégorie biblique et le parallélisme, sans préciser si cette sainteté est cultuelle, représentative, liée à l’alliance ou salvifique.
- source_word: φύραμα
  choice: la pâte tout entière
  rationale: Le terme désigne une masse de pâte pétrie. Cette expression rend l’image immédiatement compréhensible et fait ressortir le contraste entre la part offerte et l’ensemble.
- source_word: ῥίζα
  choice: racine
  rationale: Équivalent naturel et précis, cohérent avec la métaphore de l’olivier développée dans le contexte.
- source_word: κλάδοι
  choice: branches
  rationale: Terme botanique courant et adapté à la métaphore environnante.
- source_word: εἰ δὲ ... καὶ ...· καὶ εἰ ... καὶ ...
  choice: Si… l’est aussi ; et si… le sont aussi
  rationale: Le grec sous-entend le verbe dans les deux conclusions. Le reprendre en français exprime naturellement la logique parallèle sans ajouter d’interprétation.
theological_decisions:
- issue: Nature de la sainteté transmise dans les métaphores des prémices et de la racine
  choice: Conserver « sainte » sans définir le mode de cette sainteté
  alternative: Préciser « consacrée », ou interpréter cette sainteté comme salvifique
  rationale: Le verset affirme un rapport entre la première part et l’ensemble, puis entre la racine et les branches, mais il ne précise pas si la sainteté est cultuelle, représentative, liée à l’alliance ou salvifique. La traduction maintient cette tension.
translation_notes:
  register: Français moderne, international et digne. « La part offerte en prémices » rend l’image cultuelle accessible sans employer un pluriel pouvant masquer le singulier grec. Le parallélisme bref de l’original est conservé.
