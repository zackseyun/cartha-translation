id: ROM.11.5
reference: Romans 11:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: fr
  text: Ainsi donc, dans le temps présent aussi, il existe un reste selon l’élection de la grâce.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon une élection due à la grâce » ou « selon une élection par grâce ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: Ainsi donc ... aussi
  rationale: « Ainsi donc » exprime la conclusion tirée de l’exemple d’Élie, tandis que « aussi » maintient le parallèle avec le temps présent.
- source_word: ἐν τῷ νῦν καιρῷ
  choice: dans le temps présent
  rationale: Cette formulation conserve l’idée d’une époque déterminée et le contraste entre le temps d’Élie et la situation actuelle de Paul.
- source_word: λεῖμμα
  choice: un reste
  rationale: « Reste » est le terme biblique français établi pour désigner la minorité subsistante dans ce contexte paulinien et vétérotestamentaire.
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: selon l’élection de la grâce
  rationale: Cette traduction formelle maintient les deux notions, « élection » et « grâce », ainsi que la relation génitivale volontairement compacte entre elles.
- source_word: γέγονεν
  choice: il existe
  rationale: Le parfait de γίνομαι décrit ici un état présent résultant de ce qui s’est produit. « Il existe » donne un français naturel sans introduire l’idée non exprimée que ce reste aurait simplement survécu.
theological_decisions:
- issue: Rendu de ἐκλογή dans un contexte paulinien doctrinalement débattu
  choice: élection
  alternative: choix
  rationale: « Élection » conserve le poids théologique et le vocabulaire paulinien traditionnel sans imposer à lui seul un système doctrinal particulier.
- issue: Rapport entre la grâce et l’élection dans κατ’ ἐκλογὴν χάριτος
  choice: selon l’élection de la grâce
  alternative: selon une élection par grâce
  rationale: Le génitif est conservé afin de ne pas trancher indûment entre la source, le fondement ou la qualité de l’élection.
- issue: Valeur du parfait γέγονεν
  choice: il existe
  alternative: un reste est apparu
  rationale: Le choix met en avant l’état présent découlant d’un événement antérieur, tout en évitant le calque français peu naturel « est venu à l’existence ».
translation_notes:
  register: Français international moderne, digne et accessible. La structure logique de Paul et la densité théologique de l’expression finale sont préservées, avec une syntaxe française naturelle.
