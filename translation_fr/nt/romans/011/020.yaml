  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: fr
  text: 'C’est juste[a] : ils ont été retranchés à cause de leur incrédulité, mais toi, tu tiens debout par la foi[b]. Ne sois pas orgueilleux[c], mais crains[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Bien » ou « C’est vrai ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « grâce à la foi » ou « par la confiance ».'
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « Ne pense pas à des choses élevées » ; autrement dit, ne nourris pas une haute opinion de toi-même.'
    reason: lexical_alternative
  - marker: d
    text: Il s’agit de craindre avec humilité et vigilance devant Dieu, plutôt que de se laisser aller à une assurance présomptueuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: C’est juste
  rationale: Dans ce dialogue, l’adverbe approuve l’affirmation du verset précédent. « C’est juste » en restitue naturellement la valeur affirmative.
- source_word: τῇ ἀπιστίᾳ
  choice: à cause de leur incrédulité
  rationale: Le datif a ici une valeur causale ou instrumentale. « À cause de » exprime clairement la cause de leur retranchement, et « incrédulité » maintient le contraste avec πίστις.
- source_word: ἐξεκλάσθησαν
  choice: ils ont été retranchés
  rationale: Ce choix conserve l’image des branches de l’olivier tout en étant idiomatique en français.
- source_word: τῇ πίστει
  choice: par la foi
  rationale: Le datif exprime le moyen ou le fondement de cette position. « Foi » conserve le terme paulinien usuel et son opposition à « incrédulité ».
- source_word: ἕστηκας
  choice: tu restes debout
  rationale: Le parfait décrit une position présente résultant d’une action antérieure. Cette formulation garde l’image concrète de « se tenir debout » sans surinterpréter.
- source_word: ὑψηλὰ φρόνει
  choice: Ne sois pas orgueilleux
  rationale: L’expression idiomatique interdit une haute opinion de soi. Cette formulation moderne et directe en transmet clairement le sens.
- source_word: φοβοῦ
  choice: crains
  rationale: L’impératif conserve toute la force de l’avertissement et sa tension théologique, sans le réduire au simple respect ni l’intensifier en panique.
theological_decisions:
- issue: Sens de πίστις en opposition à ἀπιστία
  choice: foi
  alternative: confiance ; fidélité
  rationale: Le contraste direct avec l’incrédulité favorise ici la réponse humaine de foi ou de confiance. « Foi » garde toutefois l’ambiguïté et le vocabulaire théologique courant sans imposer une lecture confessionnelle particulière.
- issue: Portée de φοβοῦ
  choice: crains
  alternative: aie peur ; demeure dans une crainte respectueuse
  rationale: Le contexte avertit contre la présomption devant la sévérité et la bonté de Dieu. Le verbe simple « crains » préserve cette tension au lieu de l’atténuer en simple respect.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier rend explicitement σὺ et maintient le contraste avec « ils ». La formulation conserve les images du retranchement et de la position debout, ainsi que la brièveté incisive de l’impératif final.
