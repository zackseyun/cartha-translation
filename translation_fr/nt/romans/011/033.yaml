  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: fr
  text: Oh ! quelle profondeur que celle de la richesse, de la sagesse et de la connaissance de Dieu[a] ! Que ses jugements sont insondables et ses voies impossibles à retracer[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « Oh ! quelle profondeur que celle de la richesse de la sagesse et de la connaissance de Dieu ! » La syntaxe grecque permet de rattacher plus étroitement « richesse » aux deux termes qui suivent.'
    reason: alternative_reading
  - marker: b
    text: L’expression grecque évoque ce dont on ne peut suivre les traces ni reconstituer le parcours.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: Oh !
  rationale: Cette interjection naturelle en français moderne conserve l’élan d’émerveillement qui ouvre la doxologie.
- source_word: βάθος
  choice: profondeur
  rationale: Le nom garde l’image de ce qui dépasse toute mesure et toute compréhension.
- source_word: πλούτου
  choice: richesse
  rationale: « Richesse » préserve la métaphore paulinienne de l’abondance divine sans la réduire aux biens matériels.
- source_word: σοφίας
  choice: sagesse
  rationale: Équivalent français direct, distinct de la connaissance.
- source_word: γνώσεως
  choice: connaissance
  rationale: Équivalent direct qui maintient ce terme séparé de la sagesse.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le génitif est compris dans le texte principal comme se rapportant à l’ensemble formé par la richesse, la sagesse et la connaissance.
- source_word: ὡς
  choice: Que… sont
  rationale: Cette tournure exclamative est idiomatique en français et restitue la force de ὡς.
- source_word: ἀνεξεραύνητα
  choice: insondables
  rationale: Le mot exprime l’impossibilité d’examiner pleinement ou d’épuiser par la recherche les jugements de Dieu.
- source_word: κρίματα
  choice: jugements
  rationale: Le terme conserve l’étendue de κρίματα, qui peut désigner les jugements, décisions ou déterminations de Dieu.
- source_word: ἀνεξιχνίαστοι
  choice: impossibles à retracer
  rationale: Cette expression garde l’image de traces que l’on ne peut suivre et distingue ce terme d’ἀνεξεραύνητα.
- source_word: ὁδοὶ
  choice: voies
  rationale: « Voies » conserve la métaphore biblique des manières d’agir et des chemins suivis par Dieu.
theological_decisions:
- issue: Rapport du génitif « de Dieu » avec « richesse, sagesse et connaissance »
  choice: Comprendre « de Dieu » comme se rapportant aux trois noms coordonnés.
  alternative: Comprendre « richesse » comme la richesse constituée par la sagesse et la connaissance de Dieu.
  rationale: La syntaxe grecque permet les deux constructions. Le texte principal adopte la lecture coordonnée, naturelle dans cette accumulation doxologique, tandis qu’une note conserve l’autre possibilité.
- issue: Distinction entre ἀνεξεραύνητα et ἀνεξιχνίαστοι
  choice: Employer « insondables » puis « impossibles à retracer ».
  alternative: Employer deux synonymes plus généraux, par exemple « insondables » et « impénétrables ».
  rationale: 'Les deux adjectifs sont proches mais non identiques : le premier évoque ce qui ne peut être pleinement exploré, le second ce dont on ne peut suivre les traces. La traduction préserve cette nuance sans en faire une distinction doctrinale technique.'
translation_notes:
  register: Français international moderne, naturel et digne. La double exclamation restitue l’émerveillement doxologique. « Impossible à retracer » est volontairement plus explicite que « impénétrable » afin de préserver l’image propre au second adjectif grec.
