  naturalness: Le registre est globalement moderne, digne et compréhensible. « Que ses jugements sont insondables » est très naturel. « Ses voies impossibles à retracer » est clair et conserve utilement l’image de la trace ; l’ellipse du verbe est recevable dans cette exclamation. La première exclamation gagne en idiomaticité et en précision avec une légère reformulation.
  terminology: « Richesse », « sagesse », « connaissance », « jugements » et « voies » sont des équivalents appropriés. La distinction entre « insondables » (ἀνεξεραύνητα) et « impossibles à retracer » (ἀνεξιχνίαστοι) est bien préservée. La note a conserve avec justesse l’ambiguïté syntaxique du grec.
