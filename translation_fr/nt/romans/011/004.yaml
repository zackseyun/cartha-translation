id: ROM.11.4
reference: Romans 11:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: fr
  text: Mais que lui dit la réponse divine[a] ? « J’ai gardé pour moi[b] sept mille hommes qui n’ont pas fléchi le genou devant Baal. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la réponse de Dieu » ou « l’oracle ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Je me suis réservé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: la réponse divine
  rationale: Dans ce contexte, le nom désigne la réponse faisant autorité que Dieu adresse à Élie, en écho à 1 Rois 19. « Réponse divine » exprime naturellement en français la provenance de cette réponse sans réduire le terme à une réponse humaine ordinaire.
- source_word: Κατέλιπον
  choice: J’ai gardé
  rationale: 'L’aoriste présente l’action accomplie par Dieu, dont le résultat subsiste : un reste demeure. « J’ai gardé » rend clairement cette action et sa portée continue, tandis que la note conserve l’alternative plus traditionnelle « réservé ».'
- source_word: ἐμαυτῷ
  choice: pour moi
  rationale: Le datif réfléchi indique que Dieu a gardé ce reste pour lui-même. « Pour moi » est direct et naturel dans cette parole à la première personne.
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: sept mille hommes
  rationale: Le grec emploie explicitement le nom masculin ἄνδρας. « Hommes » conserve cette précision au lieu de la neutraliser en « personnes ».
- source_word: οἵτινες
  choice: qui
  rationale: Le pronom relatif caractérise les sept mille hommes. Le simple « qui » restitue cette fonction sans alourdir la phrase.
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: n’ont pas fléchi le genou
  rationale: Cette expression évoque la soumission cultuelle. La formulation française conserve l’image concrète du genou et reste immédiatement compréhensible.
- source_word: τῇ Βάαλ
  choice: devant Baal
  rationale: Avec « fléchir le genou », « devant Baal » exprime idiomatiquement en français l’hommage ou l’adoration adressés à cette divinité. Le nom propre est conservé sans article.
theological_decisions:
- issue: Faut-il expliciter que la réponse citée vient de Dieu ?
  choice: « la réponse divine », avec la citation à la première personne
  alternative: « la réponse » ou « l’oracle »
  rationale: Le contexte et la source vétérotestamentaire identifient Dieu comme celui qui répond à Élie. « Divine » exprime le sens contextuel de χρηματισμός sans ajouter une affirmation doctrinale étrangère au texte.
- issue: Rendu du genre de ἄνδρας
  choice: « hommes »
  alternative: « personnes »
  rationale: Le texte source emploie un terme spécifiquement masculin ; la traduction en conserve la forme plutôt que de la neutraliser.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la question rhétorique, la parole divine directe et l’image biblique de « fléchir le genou », tout en évitant un tour inutilement archaïque.
