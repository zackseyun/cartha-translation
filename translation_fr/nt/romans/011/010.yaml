  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: fr
  text: Que leurs yeux soient obscurcis, afin qu’ils ne voient pas[a], et courbe continuellement[b] leur dos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de sorte qu’ils ne voient pas ». La construction grecque peut exprimer le but ou le résultat. « Soient aveuglés » est aussi possible pour « soient obscurcis », mais le grec emploie littéralement l’image de l’obscurité.
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: Ou « toujours ». L’expression grecque évoque une durée continue ou constante.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: Que … soient obscurcis
  rationale: Le passif à valeur impérative ou jussive est conservé. « Obscurcis » maintient l’image des ténèbres présente dans le grec et dans la citation scripturaire, sans l’expliciter d’emblée par « aveuglés ».
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: leurs yeux
  rationale: Traduction directe qui conserve l’image corporelle centrale.
- source_word: τοῦ μὴ βλέπειν
  choice: afin qu’ils ne voient pas
  rationale: L’infinitif substantivé avec μή peut exprimer le but ou le résultat. Cette formulation française garde la relation avec l’obscurcissement sans ajouter d’explication.
- source_word: τὸν νῶτον αὐτῶν
  choice: leur dos
  rationale: Le singulier distributif est naturel en français et correspond au singulier grec.
- source_word: διὰ παντός
  choice: sans cesse
  rationale: L’expression indique une continuité ou une constance. « Sans cesse » est naturel et n’impose pas le sens plus fort de « pour toujours ».
- source_word: σύγκαμψον
  choice: courbe
  rationale: L’impératif actif adressé à Dieu est rendu directement. « Courbe » conserve la métaphore physique et s’accorde naturellement avec « leur dos ».
theological_decisions:
- issue: Imprécation scripturaire et action divine
  choice: 'Conserver la force impérative de la citation : « Que leurs yeux soient obscurcis… et courbe… »'
  alternative: Transformer la citation en prédiction ou en conséquence impersonnelle.
  rationale: Le texte grec garde la forme sévère d’une imprécation adressée à Dieu. La traduction ne l’atténue pas, tout en n’ajoutant aucune interprétation théologique.
- issue: But ou résultat dans τοῦ μὴ βλέπειν
  choice: « afin qu’ils ne voient pas »
  alternative: « de sorte qu’ils ne voient pas »
  rationale: La construction grecque permet une nuance de but ou de résultat. Le texte principal adopte une formulation idiomatique, tandis que l’ambiguïté réelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le ton solennel de la citation sans archaïsme marqué. Le singulier distributif « leur dos » est idiomatique et proche du grec.
