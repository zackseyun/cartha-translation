  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: fr
  text: 'Et c’est ainsi que tout Israël sera sauvé[a][b], comme il est écrit : « Le Libérateur viendra de Sion[c] ; il éloignera de Jacob l’impiété. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et ainsi, tout Israël sera sauvé. » Le grec οὕτως peut être rendu par « ainsi » ; ici, il peut plus précisément indiquer la manière dont cela se produira, en renvoyant à ce qui vient d’être décrit.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « tout Israël » fait l’objet de plusieurs interprétations. La traduction conserve la formulation grecque sans décider si Paul désigne l’ensemble de l’Israël ethnique, le reste croyant d’Israël ou la totalité du peuple de Dieu.
    reason: alternative_reading
  - marker: c
    text: Le grec ἐκ Σιὼν peut aussi être rendu par « hors de Sion ». « De Sion » exprime naturellement en français l’origine indiquée par l’expression grecque.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: de cette manière
  rationale: Cette formulation française exprime naturellement la manière et renvoie au processus décrit dans le contexte, sans imposer une conclusion théologique particulière.
- source_word: πᾶς Ἰσραήλ
  choice: tout Israël
  rationale: Rendu direct et idiomatique qui conserve l’ouverture interprétative de l’expression grecque.
- source_word: σωθήσεται
  choice: sera sauvé
  rationale: Le futur passif de σῴζω a ici sa pleine portée sotériologique ; « sera sauvé » la préserve clairement.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture.
- source_word: Ἥξει
  choice: viendra
  rationale: Équivalent simple et naturel, adapté au registre prophétique de la citation.
- source_word: ἐκ Σιὼν
  choice: de Sion
  rationale: Rend naturellement en français le point d’origine marqué par ἐκ, sans alourdir la phrase.
- source_word: ὁ ῥυόμενος
  choice: le Libérateur
  rationale: Le participe substantivé désigne celui qui délivre ; « le Libérateur » conserve sa force de désignation et le ton solennel de la citation.
- source_word: ἀποστρέψει
  choice: il écartera
  rationale: « Écartera » préserve l’idée de détourner ou d’éloigner tout en produisant une formulation française compréhensible avec pour objet les impiétés.
- source_word: ἀσεβείας
  choice: les impiétés
  rationale: Le pluriel reproduit celui du grec et garde la dimension morale et religieuse du terme.
- source_word: ἀπὸ Ἰακώβ
  choice: de Jacob
  rationale: La traduction conserve le nom Jacob et le parallélisme scripturaire avec Israël, sans harmonisation interprétative.
theological_decisions:
- issue: Référent de « tout Israël »
  choice: Conserver « tout Israël » sans explicitation.
  alternative: L’ensemble de l’Israël ethnique ; le reste croyant d’Israël ; la totalité du peuple de Dieu comprenant les non-Juifs.
  rationale: Le grec ne tranche pas explicitement entre ces lectures débattues. La traduction maintient donc la tension théologique au lieu de la résoudre.
- issue: Valeur titulaire de ὁ ῥυόμενος
  choice: « le Libérateur », avec une majuscule.
  alternative: « le libérateur » ou « celui qui délivre ».
  rationale: Dans cette citation prophétique employée par Paul, la formulation a une portée titulaire et messianique ; la majuscule française le signale sans ajouter une identification absente des mots eux-mêmes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle ; la citation conserve un ton prophétique et solennel.
