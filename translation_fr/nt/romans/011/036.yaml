id: ROM.11.36
reference: Romans 11:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: fr
  text: Car tout vient de lui, tout existe par lui et tout est orienté vers lui[a]. À lui la gloire pour toujours[b]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en soulignant davantage la finalité : « tout est pour lui ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour les siècles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit la raison de la doxologie qui précède. « Car » conserve naturellement cette valeur causale en français.
- source_word: ἐξ αὐτοῦ
  choice: tout vient de lui
  rationale: ἐξ exprime ici la source ou l’origine. Le verbe « vient », suppléé pour rendre la proposition française naturelle, explicite sobrement cette relation.
- source_word: δι’ αὐτοῦ
  choice: tout est par lui
  rationale: διά avec le génitif exprime l’intermédiaire, le moyen ou l’agent. « Par lui » maintient cette amplitude sans réduire le sens à une formulation exclusivement instrumentale.
- source_word: εἰς αὐτὸν
  choice: tout va vers lui
  rationale: εἰς exprime la direction, le but ou l’aboutissement. « Vers lui » préserve cette orientation tout en évitant de trancher entre destination et finalité.
- source_word: τὰ πάντα
  choice: tout
  rationale: Le neutre pluriel substantivé a une portée globale. En français moderne, « tout » exprime naturellement cette totalité cosmique; sa reprise dans les trois membres rend explicite la structure sous-entendue en grec.
- source_word: αὐτῷ ἡ δόξα
  choice: À lui la gloire
  rationale: La proposition grecque est sans verbe et constitue une attribution doxologique. La formulation française conserve cette concision solennelle sans ajouter de verbe interprétatif.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: L’expression signifie littéralement « pour les siècles » et désigne ici une durée sans fin. « Pour toujours » est clair, actuel et digne.
- source_word: ἀμήν
  choice: Amen
  rationale: Le terme liturgique traditionnel est conservé sous sa forme française usuelle.
theological_decisions:
- issue: Référent des pronoms répétés αὐτοῦ / αὐτόν / αὐτῷ
  choice: Conserver « lui » dans chaque membre
  alternative: Remplacer les pronoms par « Dieu »
  rationale: Le contexte immédiat de Romains 11.33-35 indique Dieu comme référent, mais le maintien des pronoms respecte la forme rhétorique du texte et n’explicite pas davantage que le grec.
- issue: Valeur de εἰς αὐτόν
  choice: « vers lui », rendu dans la phrase par « tout va vers lui »
  alternative: « pour lui »
  rationale: « Vers lui » maintient la tension entre direction, destination et finalité, tandis que « pour lui » privilégierait plus nettement l’idée de but ou d’intérêt.
- issue: Force de αὐτῷ ἡ δόξα
  choice: « À lui la gloire »
  alternative: « À lui soit la gloire » ou « La gloire lui appartient »
  rationale: La formulation sans verbe reste proche de la syntaxe grecque et permet de l’entendre comme une acclamation doxologique sans imposer soit un souhait, soit une affirmation de possession.
translation_notes:
  register: 'Français international moderne, clair et solennel. La triple reprise de « tout » donne une phrase naturelle et fait entendre le mouvement ternaire du grec : origine, médiation et aboutissement. L’exclamation marque la force doxologique sans recourir à une tournure archaïque.'
