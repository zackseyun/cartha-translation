    issue: « tout va vers lui »
    rationale: Cette formulation peut suggérer que toutes choses sont actuellement en marche vers Dieu. εἰς αὐτόν marque ici l’orientation, le but ou l’aboutissement, sans imposer cette image processuelle.
  - severity: low
    issue: « tout est par lui »
    rationale: Le rendu reproduit utilement le parallélisme, mais il demeure elliptique et légèrement heurté en français international moderne. « Tout existe par lui » reste fidèle à la médiation exprimée par διά tout en donnant une proposition française complète.
  - severity: low
    issue: Point d’exclamation après la doxologie
    rationale: Il n’est pas requis par le grec, dont la ponctuation est déclarative. Un point conserve la dignité doxologique sans renforcer stylistiquement l’énoncé.
