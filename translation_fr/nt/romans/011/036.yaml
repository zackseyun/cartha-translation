review_pass:
  verdict: revise
  source_fidelity: 'Le mouvement ternaire est bien reconnu : source (ἐξ), médiation (διά) et orientation/but (εἰς). Toutefois, « tout va vers lui » transforme plus nettement εἰς αὐτόν en mouvement en cours et peut évoquer un processus eschatologique que le grec n’énonce pas. « Tout est orienté vers lui » rend l’orientation téléologique sans cette implication supplémentaire.'
  naturalness: La phrase est globalement claire et solennelle. « Tout est par lui » est toutefois elliptique et moins idiomatique en français moderne ; « tout existe par lui » explicite sobrement le prédicat nécessaire en français. L’absence de point d’exclamation suit aussi plus exactement la ponctuation sobre du grec.
  terminology: '« Car », « vient de lui », « par lui », « À lui la gloire », « pour toujours » et « Amen » conviennent au registre doxologique moderne. Les pronoms doivent être conservés : le contexte en identifie le référent sans que la traduction le remplace par « Dieu ».'
