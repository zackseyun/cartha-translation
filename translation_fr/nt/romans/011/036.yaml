- from: Car tout vient de lui, tout est par lui et tout va vers lui[a]. À lui la gloire pour toujours[b] ! Amen.
  to: Car tout vient de lui, tout existe par lui et tout est orienté vers lui[a]. À lui la gloire pour toujours[b]. Amen.
  rationale: La révision conserve la structure ternaire et les pronoms du grec, mais remplace l’image dynamique de « va vers » par une formulation qui exprime l’orientation de εἰς sans surinterpréter le verset. Elle rend aussi le membre avec διά plus naturel en français, sans modifier son sens de médiation.
