  terminology: « Frères », « mystère », « endurcissement », « plénitude » et « non-Juifs » sont appropriés. Les notes conservent correctement l’inclusivité possible de ἀδελφοί et l’ambiguïté de πλήρωμα, sans imposer d’interprétation théologique.
