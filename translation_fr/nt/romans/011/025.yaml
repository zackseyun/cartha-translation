reference: Romans 11:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: fr
  text: 'Car je ne veux pas, frères[a], que vous ignoriez ce mystère, afin que vous ne vous croyiez pas sages : un endurcissement partiel a atteint Israël jusqu’à ce que la plénitude des non-Juifs entre[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères » et peut s’adresser à un groupe mixte.
    reason: lexical_alternative
  - marker: b
    text: Ou « le nombre complet des non-Juifs entre ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: que vous ignoriez
  rationale: Dans la formule paulinienne οὐ θέλω ὑμᾶς ἀγνοεῖν, « je ne veux pas que vous ignoriez » signifie naturellement que Paul ne veut pas laisser ses destinataires sans information, sans donner à « ignoriez » une valeur péjorative.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif grec est au masculin pluriel. « Frères » en conserve la forme, tandis qu’une note précise que l’adresse peut inclure les femmes de l’assemblée.
- source_word: μυστήριον
  choice: mystère
  rationale: Chez Paul, le terme désigne souvent un dessein divin auparavant caché et maintenant révélé. « Mystère » garde ce registre théologique sans le réduire à un simple secret.
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: afin que vous ne vous croyiez pas sages
  rationale: Cette formulation française actuelle exprime clairement le but de l’explication et l’avertissement contre la sagesse que les destinataires s’attribueraient eux-mêmes.
- source_word: πώρωσις
  choice: endurcissement
  rationale: Le mot évoque ici une insensibilité spirituelle. « Endurcissement » est clair, traditionnel et adapté au contexte sans préciser abusivement sa cause.
- source_word: ἀπὸ μέρους
  choice: partiel
  rationale: L’adjectif qualifie naturellement l’étendue de l’endurcissement et n’en fait pas nécessairement une simple phase temporaire.
- source_word: τῷ Ἰσραήλ γέγονεν
  choice: Israël a connu
  rationale: 'Cette tournure française rend naturellement le datif et le parfait grec : l’endurcissement est survenu et constitue désormais une réalité pour Israël.'
- source_word: πλήρωμα
  choice: plénitude
  rationale: « Plénitude » préserve l’ouverture sémantique du grec, qui peut évoquer la totalité, le nombre complet ou l’accomplissement, sans trancher la question dans le texte principal.
- source_word: τῶν ἐθνῶν
  choice: des non-Juifs
  rationale: Dans le contraste avec Israël, le terme désigne les peuples autres que le peuple juif. « Non-Juifs » est immédiatement compréhensible en français international et plus précis ici que « nations ».
- source_word: εἰσέλθῃ
  choice: soit entrée
  rationale: Le passé du subjonctif après « jusqu’à ce que » présente l’entrée comme le seuil dont l’accomplissement marque le terme indiqué, tout en conservant la métaphore de l’entrée.
theological_decisions:
- issue: Sens de « la plénitude des non-Juifs »
  choice: La formulation « la plénitude des non-Juifs » est conservée sans préciser s’il s’agit de leur nombre complet, de leur pleine inclusion ou d’un accomplissement eschatologique.
  alternative: le nombre complet des non-Juifs
  rationale: Le sens exact de πλήρωμα est débattu. La traduction principale maintient l’ambiguïté réelle du texte, et la note donne une interprétation courante sans l’imposer.
- issue: Portée de l’adresse « frères »
  choice: Le masculin pluriel du grec est conservé par « frères » dans le texte principal.
  alternative: frères et sœurs
  rationale: La forme grecque est masculine, mais elle peut s’adresser à une assemblée mixte. La note rend cette portée possible explicite sans remplacer la forme lexicale du texte.
- issue: Étendue de l’endurcissement d’Israël
  choice: « un endurcissement partiel » laisse entendre une limitation d’étendue sans définir exactement si elle porte sur les personnes concernées ou sur le degré de l’endurcissement.
  alternative: Israël a été endurci en partie
  rationale: ἀπὸ μέρους indique une limitation, mais le verset ne l’explicite pas davantage. La traduction évite de préciser arbitrairement qu’il s’agit seulement d’une partie numérique d’Israël.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche de l’enchaînement argumentatif grec tout en étant naturelle. « Non-Juifs » privilégie la compréhension immédiate, tandis que « plénitude » et « soit entrée » conservent l’ambiguïté et l’image du texte source.
