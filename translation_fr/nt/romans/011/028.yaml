  source_fidelity: Le parallélisme de κατά μέν…κατά δέ est fidèlement rendu par « En ce qui concerne… mais en ce qui concerne… ». « Ennemis », « aimés », « élection » et les deux emplois causaux de διά avec l’accusatif sont exacts et conservent la tension du grec sans en préciser indûment l’agent ou le mécanisme.
  naturalness: Le français est moderne, clair et d’un registre approprié. La répétition de « en ce qui concerne » reproduit utilement la symétrie argumentative de Paul. « À cause de vous » et « à cause des pères » sont naturels, même si le contexte précisera leur portée.
  terminology: « Évangile » et « élection » sont les équivalents pauliniens usuels. « Aimés » est idiomatique en français contemporain et ne transforme pas l’adjectif prédicatif en formule d’adresse. La note sur les « pères » éclaire correctement le raccourci sans l’introduire dans le texte principal.
