language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: fr
  text: En ce qui concerne l’Évangile[a], ils sont ennemis à cause de vous ; mais en ce qui concerne l’élection, ils sont aimés à cause des pères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Pour ce qui est de l’Évangile, ils sont ennemis à cause de vous… mais pour ce qui est de l’élection, ils sont aimés à cause des pères. »'
    reason: lexical_alternative
  - marker: b
    text: Les « pères » sont les patriarches d’Israël, en particulier Abraham, Isaac et Jacob.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: En ce qui concerne l’Évangile
  rationale: κατά avec l’accusatif indique ici le domaine sous lequel Israël est considéré. La tournure française rend clairement la structure contrastive μέν…δέ sans suggérer un mouvement.
- source_word: εὐαγγέλιον
  choice: Évangile
  rationale: « Évangile » est le terme paulinien établi pour la bonne nouvelle proclamée au sujet du Messie ; il convient ici mieux que l’explicitation « bonne nouvelle ».
- source_word: ἐχθροὶ
  choice: ennemis
  rationale: L’adjectif pluriel est employé comme attribut. « Ennemis » conserve sa force relationnelle, tandis que « hostiles » décrirait plus étroitement une attitude et que « haïs » déplacerait le sens vers l’attitude de Dieu.
- source_word: δι’ ὑμᾶς
  choice: à cause de vous
  rationale: διά avec l’accusatif peut exprimer la cause ou ce en vue de quoi une situation existe. « À cause de vous » reste naturel et proche du grec sans expliciter davantage le bénéfice des non-Juifs.
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: mais en ce qui concerne l’élection
  rationale: La reprise symétrique rend le second domaine de considération et maintient l’opposition formelle entre les deux propositions.
- source_word: ἐκλογὴν
  choice: élection
  rationale: Dans Romains 9–11, ἐκλογή renvoie au choix souverain de Dieu. Le terme théologique « élection » est concis et évite l’explicitation interprétative « choix de Dieu ».
- source_word: ἀγαπητοὶ
  choice: aimés
  rationale: « Aimés » rend naturellement en français moderne l’adjectif attribut et conserve le contraste avec « ennemis ». « Bien-aimés » serait possible, mais son registre est plus marqué et peut être entendu comme une appellation.
- source_word: διὰ τοὺς πατέρας
  choice: à cause des pères
  rationale: La traduction directe préserve le motif donné par Paul ainsi que son raccourci covenantal. « Patriarches » serait plus explicite, mais ajouterait cette interprétation au corps du texte.
theological_decisions:
- issue: Référent du sujet implicite de ἐχθροὶ et ἀγαπητοὶ
  choice: Le pronom « ils » renvoie collectivement à Israël, au peuple juif, dans l’argument de Romains 9–11.
  alternative: Le limiter aux seuls Juifs non croyants contemporains de Paul.
  rationale: Le contexte immédiat traite d’Israël collectivement, tout en décrivant la situation présente d’un grand nombre de ses membres. Le pronom n’est pas davantage précisé, afin de ne pas réduire la portée du grec.
- issue: Sens d’« ennemis »
  choice: Le terme décrit leur situation sous le rapport de l’Évangile, tout en maintenant qu’ils sont aimés sous le rapport de l’élection.
  alternative: Comprendre que Dieu les hait absolument, ou réduire le mot à une simple opposition sociale.
  rationale: Le verset juxtapose délibérément « ennemis » et « aimés ». La traduction conserve cette tension sans identifier explicitement l’agent de l’inimitié ou de l’amour là où le grec le laisse implicite.
- issue: Sens de « l’élection »
  choice: L’élection désigne ici le choix de Dieu dans son dessein envers Israël.
  alternative: Comprendre une sélection humaine ou une simple préférence générale.
  rationale: L’usage de ἐκλογή dans l’ensemble de Romains 9–11 soutient le sens théologique, mais le texte traduit garde le nom abstrait du grec sans développer son mécanisme ni sa portée.
- issue: Référent des « pères »
  choice: Les « pères » évoquent les patriarches d’Israël, notamment Abraham, Isaac et Jacob.
  alternative: Les ancêtres ethniques au sens le plus général.
  rationale: Dans Romains 9–11, cette expression rappelle naturellement les patriarches et les promesses qui leur ont été faites. Le corps du texte conserve néanmoins la formulation littérale et concise.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle du grec est conservée. « Évangile » et « élection » maintiennent le vocabulaire paulinien établi, tandis que « aimés » évite un archaïsme inutile. La ponctuation met en relief le contraste sans ajouter d’explication au texte.
