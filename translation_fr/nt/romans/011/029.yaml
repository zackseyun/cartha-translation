id: ROM.11.29
reference: Romans 11:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: fr
  text: En effet, les dons et l’appel de Dieu sont irrévocables[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ne sont pas regrettés » ou « ne sont pas repris ». Certaines traductions anciennes rendent : « sont sans repentance ».'
    reason: Alternative lexicale pour ἀμεταμέλητα, dont le sens peut être formulé en termes d’absence de regret ou de non-rétractation.
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: sont irrévocables
  rationale: L’adjectif qualifie au pluriel « les dons » et « l’appel » et signifie qu’ils ne donnent pas lieu à un changement de décision ou ne sont pas repris. « Irrévocables » exprime naturellement en français que Dieu ne les révoque pas, sans élargir le sens jusqu’à « immuables ».
- source_word: γὰρ
  choice: En effet
  rationale: La particule introduit la justification de l’affirmation précédente. « En effet » conserve clairement cette valeur explicative dans un français actuel et fluide.
- source_word: τὰ χαρίσματα
  choice: les dons
  rationale: Le terme désigne des dons accordés par grâce. « Les dons » est naturel, maintient le pluriel et n’ajoute pas de précision absente du grec.
- source_word: ἡ κλῆσις
  choice: l’appel
  rationale: Dans l’usage paulinien, κλῆσις désigne l’appel venant de Dieu. « L’appel » en conserve la portée théologique sans préciser ici ses destinataires ou son mode d’action.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif rattache à Dieu les dons comme l’appel, possiblement comme leur source. « De Dieu » préserve cette amplitude sans trancher plus précisément la relation.
theological_decisions:
- issue: Portée des « dons » et de « l’appel » de Dieu
  choice: Conserver la formulation sans préciser les destinataires ni limiter explicitement sa portée.
  alternative: Expliciter soit les privilèges et l’appel d’Israël dans le contexte de Romains 9–11, soit un principe général applicable à tous les dons et appels divins.
  rationale: Le contexte immédiat concerne fortement Israël, mais la phrase grecque ne répète pas explicitement son objet. La traduction préserve donc la formulation et la tension du texte.
- issue: Nuance de ἀμεταμέλητα appliqué à Dieu
  choice: Traduire par « irrévocables » et signaler en note les nuances littérales possibles.
  alternative: « Ne donnent pas lieu au regret », « ne sont pas repris » ou, selon une formulation ancienne, « sont sans repentance ».
  rationale: « Irrévocables » rend de façon concise l’idée contextuelle que les dons et l’appel ne sont pas retirés. La note conserve toutefois la nuance lexicale liée au regret ou au changement d’avis sans attribuer au texte une théorie plus développée de l’immutabilité divine.
translation_notes:
  register: Français international moderne, concis et digne. « En effet » marque naturellement le lien explicatif avec le contexte. Le vocabulaire théologique courant (« dons », « appel ») demeure accessible, et la note évite l’expression ancienne potentiellement ambiguë dans le texte principal.
