reference: Romans 11:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: fr
  text: De même, eux aussi ont maintenant désobéi, afin que, par la miséricorde qui vous a été accordée[a], eux aussi reçoivent maintenant miséricorde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par votre miséricorde ». La tournure grecque peut se comprendre plus littéralement ainsi, mais le contexte renvoie très probablement à la miséricorde que Dieu vous a accordée.'
    reason: alternative_reading
  - marker: b
    text: Certains témoins anciens omettent « maintenant » à cet endroit.
    reason: textual_variant
lexical_decisions:
- source_word: οὕτως καὶ οὗτοι
  choice: De même, eux aussi
  rationale: Cette formulation naturelle conserve à la fois l’analogie avec le verset précédent, la valeur démonstrative contextuelle de οὗτοι — qui renvoie à Israël — et l’idée d’inclusion portée par καί.
- source_word: νῦν ἠπείθησαν
  choice: ont désobéi maintenant
  rationale: Le verbe ἀπειθέω peut évoquer aussi bien l’incrédulité que la désobéissance. « Désobéir » préserve cette portée relationnelle et covenantale sans réduire le sens à une opinion intellectuelle; « maintenant » maintient le contraste temporel de Paul.
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: par la miséricorde qui vous a été accordée
  rationale: Le datif grec est condensé et peut se lire littéralement « par votre miséricorde ». Dans l’enchaînement des versets 30 à 32, il désigne très probablement la miséricorde de Dieu reçue par les destinataires non juifs. La formulation choisie rend ce sens probable tout en signalant l’ambiguïté en note.
- source_word: ἵνα
  choice: afin que
  rationale: Conserve clairement le rapport de but ou de résultat exprimé par ἵνα, dans un registre français digne et courant.
- source_word: καὶ αὐτοὶ νῦν ἐλεηθῶσιν
  choice: ils reçoivent eux aussi maintenant miséricorde
  rationale: « Eux aussi » garde l’accent inclusif de καὶ αὐτοί. « Reçoivent miséricorde » exprime naturellement le passif divin de ἐλεηθῶσιν sans nommer explicitement l’agent, et le second « maintenant » est conservé selon le texte retenu du SBLGNT.
theological_decisions:
- issue: La miséricorde est-elle exercée par les destinataires non juifs ou leur est-elle accordée par Dieu?
  choice: la miséricorde qui vous a été accordée
  alternative: votre miséricorde
  rationale: Le mouvement de Romains 11.30-32 met en parallèle la désobéissance des deux groupes et la miséricorde divine qu’ils reçoivent. Le contexte favorise donc la miséricorde accordée aux destinataires, mais la construction grecque permet une lecture plus littérale, conservée en note.
- issue: Le sens de ἀπειθέω doit-il être limité à l’incrédulité?
  choice: ont désobéi
  alternative: n’ont pas cru
  rationale: Dans ce contexte, le terme associe le refus de croire et le refus d’obéir. « Désobéi » maintient la portée plus large du grec et évite de résoudre artificiellement cette tension.
translation_notes:
  register: 'Français international moderne, clair et digne. La répétition de « maintenant » est volontaire : elle reflète les deux occurrences de νῦν dans le texte grec retenu, malgré une variante textuelle portant sur la seconde. La syntaxe conserve le parallélisme de Paul sans expliciter davantage l’identité des groupes que ne le fait ce verset isolé.'
