id: ROM.11.15
reference: Romans 11:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: fr
  text: Car si leur rejet a été la réconciliation du monde, que sera leur accueil[a], sinon la vie d’entre les morts[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur réception ». Le terme grec s’oppose à « rejet » et peut désigner le fait d’être reçu ou accueilli de nouveau.
    reason: lexical_alternative
  - marker: b
    text: « La vie d’entre les morts » peut évoquer un renouvellement spirituel extraordinaire ou, plus précisément, la résurrection. Paul conserve ici une expression brève et suggestive.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: rejet
  rationale: « Rejet » exprime naturellement l’idée relationnelle d’une mise à l’écart et forme une antithèse claire avec « accueil ».
- source_word: καταλλαγὴ
  choice: réconciliation
  rationale: Terme paulinien usuel pour le rétablissement d’une relation; il reste précis et naturel en français.
- source_word: κόσμου
  choice: du monde
  rationale: Cette formulation conserve l’ampleur de κόσμος sans la réduire explicitement aux non-Juifs, même si ceux-ci sont présents dans le contexte.
- source_word: πρόσλημψις
  choice: accueil
  rationale: « Accueil » rend le contraste avec « rejet » et peut désigner le fait d’être reçu de nouveau, sans préciser davantage l’agent ou les modalités.
- source_word: ζωὴ ἐκ νεκρῶν
  choice: la vie d’entre les morts
  rationale: Formulation française biblique mais intelligible, proche du grec et assez ouverte pour évoquer soit un renouvellement extraordinaire, soit la résurrection, sans trancher.
- source_word: εἰ μὴ
  choice: sinon
  rationale: Dans cette question rhétorique, « sinon » introduit naturellement la réponse attendue avec une force emphatique.
- source_word: γὰρ
  choice: Car
  rationale: « Car » maintient explicitement le lien explicatif avec l’argument précédent.
theological_decisions:
- issue: Sens de « la vie d’entre les morts »
  choice: Conserver une expression eschatologique ouverte, sans préciser s’il s’agit d’un renouvellement spirituel, de la résurrection finale ou d’une réalité englobant les deux.
  alternative: Traduire explicitement par « résurrection » ou par « renouveau spirituel ».
  rationale: La formule grecque est brève et évocatrice; la préciser dans le texte principal résoudrait une tension que Paul laisse ouverte.
- issue: Sens et agent de « leur accueil »
  choice: Employer le nom « accueil » sans ajouter « par Dieu » ni « de nouveau ».
  alternative: « Leur réintégration », « le fait qu’ils soient reçus de nouveau » ou « leur acceptation ».
  rationale: Le grec établit surtout l’opposition avec le rejet; il ne formule pas explicitement l’agent ni l’idée de retour, même si le contexte peut les suggérer.
translation_notes:
  register: Français moderne, international et digne. La structure interrogative et l’antithèse « rejet / accueil » sont préservées. Le passé composé « a été » rend la proposition de manière idiomatique sans modifier sa logique.
