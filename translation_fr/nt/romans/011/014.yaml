source:
  edition: SBLGNT
  text: εἴ πως παραζηλώσω μου τὴν σάρκα καὶ σώσω τινὰς ἐξ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/014.yaml
  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: fr
  text: si, d’une manière ou d’une autre, je pouvais rendre jaloux ceux de ma propre chair[a] et en sauver quelques-uns.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire les membres de son peuple, ses compatriotes juifs ; littéralement « ma chair ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: si, d’une manière ou d’une autre
  rationale: Cette tournure exprime l’espoir ou le dessein incertain de Paul sans suggérer qu’il en garantit l’issue.
- source_word: παραζηλώσω
  choice: je peux rendre jaloux
  rationale: Le verbe désigne le fait d’éveiller la jalousie et reprend le thème contextuel de la jalousie d’Israël devant l’intégration des non-Juifs.
- source_word: μου τὴν σάρκα
  choice: ceux de ma propre chair
  rationale: La formulation conserve l’image grecque de la chair tout en rendant explicite en français qu’elle désigne ici des personnes unies à Paul par une parenté ethnique.
- source_word: σώσω
  choice: sauver
  rationale: Le verbe garde ici sa portée sotériologique paulinienne habituelle.
- source_word: τινὰς ἐξ αὐτῶν
  choice: en sauver quelques-uns
  rationale: Le pronom « en » indique naturellement en français qu’il s’agit de quelques personnes prises parmi le groupe qui vient d’être mentionné.
theological_decisions:
- issue: Sens de σάρξ lorsque Paul parle de son groupe ethnique
  choice: ceux de ma propre chair
  alternative: les gens de mon peuple / mes compatriotes juifs
  rationale: Dans ce contexte, « chair » renvoie à la parenté naturelle et ethnique de Paul, non à une nature pécheresse. Le texte conserve la métaphore, tandis que la note en précise le référent.
translation_notes:
  register: Français international moderne, naturel et digne. La construction « rendre jaloux » est plus idiomatique que « provoquer à la jalousie », tandis que « ceux de ma propre chair » préserve l’image de l’original sans devenir obscure.
