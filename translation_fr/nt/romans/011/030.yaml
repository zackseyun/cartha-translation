  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: fr
  text: En effet, de même que vous avez autrefois désobéi à Dieu[a], mais que vous avez maintenant obtenu miséricorde à cause de leur désobéissance,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, pour « avez désobéi » et, plus loin, « leur désobéissance » : « n’avez pas cru Dieu » et « leur incrédulité » ; dans ce contexte, les termes grecs peuvent exprimer à la fois la désobéissance et le refus de croire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: En effet, de même que
  rationale: « En effet » rend la valeur explicative de γάρ, tandis que « de même que » conserve la comparaison introduite par ὥσπερ et prépare sa suite au verset suivant.
- source_word: ὑμεῖς
  choice: vous
  rationale: Le pronom grec est à la deuxième personne du pluriel. Le contexte désigne les non-Juifs, mais le préciser dans le texte ajouterait une information qui n’est pas exprimée dans ce verset.
- source_word: ποτε
  choice: autrefois
  rationale: Ce terme exprime clairement l’état passé mis en contraste avec νῦν, « maintenant ».
- source_word: ἠπειθήσατε
  choice: avez désobéi
  rationale: Le verbe ἀπειθέω peut évoquer à la fois la désobéissance et le refus de croire. « Désobéi » conserve ici sa dimension morale et relationnelle ainsi que son lien lexical avec ἀπείθεια dans la suite du verset.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Le datif désigne naturellement la personne envers qui s’exerce la désobéissance.
- source_word: νῦν δὲ
  choice: mais que vous avez maintenant
  rationale: « Mais » marque le contraste avec la situation passée, et « maintenant » rend l’opposition temporelle avec ποτε.
- source_word: ἠλεήθητε
  choice: avez obtenu miséricorde
  rationale: Cette formulation française rend le passif grec sans nommer explicitement son auteur et souligne la miséricorde accordée aux destinataires.
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: à cause de leur désobéissance
  rationale: Le datif peut exprimer ici le moyen ou la cause. « À cause de » communique clairement le rapport établi par Paul sans définir trop précisément son mécanisme. « Leur » renvoie, dans le contexte, aux Israélites actuellement désobéissants.
theological_decisions:
- issue: Sens de ἀπειθέω et ἀπείθεια dans le contexte du salut
  choice: désobéir / désobéissance
  alternative: refuser de croire / incrédulité
  rationale: Les termes grecs peuvent associer le refus de croire à la désobéissance. Le choix retenu préserve leur correspondance dans le verset et évite de réduire leur portée à une dimension purement intellectuelle; une note signale toutefois l’autre sens possible.
translation_notes:
  register: Français international moderne, digne et accessible. La construction comparative reste volontairement ouverte, puisque sa conclusion se trouve au verset suivant. La répétition de « désobéi / désobéissance » reflète le lien lexical du grec.
