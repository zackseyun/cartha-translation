id: ROM.11.17
reference: Romans 11:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: fr
  text: Mais si quelques-unes des branches ont été retranchées, et si toi, qui es un olivier sauvage, tu as été greffé parmi elles[a] et es devenu, avec elles, participant à la racine et à la richesse de l’olivier[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au milieu de ces branches ».'
    reason: Précise le référent probable du pronom grec, à savoir les branches demeurées sur l’olivier.
  - marker: b
    text: 'Ou : « à la racine riche en sève de l’olivier » ; traditionnellement : « à la racine et à la graisse de l’olivier ».'
    reason: La suite condensée de génitifs grecs permet de comprendre la « richesse » comme une qualité nourricière de la racine ; « graisse » est plus littéral, mais peu naturel en français actuel.
lexical_decisions:
- source_word: Εἰ δέ
  choice: Mais si
  rationale: Rend naturellement la condition introduite par εἰ et la légère opposition marquée par δέ.
- source_word: τινες τῶν κλάδων
  choice: quelques-unes des branches
  rationale: Conserve la valeur indéfinie de τινες et le génitif partitif τῶν κλάδων.
- source_word: ἐξεκλάσθησαν
  choice: ont été arrachées
  rationale: Dans l’image de l’arbre, « arrachées » exprime la séparation violente des branches sans suggérer nécessairement qu’elles ont été coupées avec un outil.
- source_word: σὺ δὲ ἀγριέλαιος ὢν
  choice: et si toi, qui étais un olivier sauvage
  rationale: Maintient le contraste avec les branches arrachées et conserve l’image horticole sans l’expliciter comme une désignation des non-Juifs.
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: tu as été greffé parmi elles
  rationale: Emploie le terme horticole usuel et comprend αὐτοῖς comme renvoyant aux branches demeurées sur l’olivier.
- source_word: συγκοινωνὸς
  choice: as eu part avec elles
  rationale: Exprime à la fois la participation et sa dimension commune, dans un français plus naturel que « coparticipant ».
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: à la racine et à la richesse de l’olivier
  rationale: Préserve autant que possible la construction grecque dense et la distinction entre la racine et la richesse nourricière de l’olivier, tout en restant intelligible en français moderne.
- source_word: ἐγένου
  choice: as eu part
  rationale: La tournure française exprime l’entrée dans un nouvel état indiquée par l’aoriste de γίνομαι, en lien direct avec συγκοινωνός.
theological_decisions:
- issue: Identité métaphorique de ἀγριέλαιος
  choice: olivier sauvage
  alternative: rameau d’olivier sauvage ; non-Juif
  rationale: La traduction conserve l’image de Paul et ne remplace pas la métaphore par son interprétation théologique.
- issue: Rapport entre la racine et la richesse de l’olivier
  choice: avoir part avec les autres branches à la racine et à la richesse de l’olivier
  alternative: avoir part à la racine riche en sève de l’olivier
  rationale: La série de génitifs permet une formulation où la richesse qualifie la racine, mais elle demeure syntaxiquement resserrée. Le texte principal préserve la tension entre les deux notions et la note signale l’autre analyse plausible.
- issue: Référent de ἐν αὐτοῖς
  choice: parmi elles, c’est-à-dire parmi les branches
  alternative: sur l’olivier, à leur place
  rationale: Le pluriel renvoie le plus naturellement aux branches déjà mentionnées, sans exclure l’idée plus large de l’intégration au même arbre.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore horticole est maintenue sans paraphrase doctrinale. La virgule finale signale que la phrase se poursuit au verset suivant.
