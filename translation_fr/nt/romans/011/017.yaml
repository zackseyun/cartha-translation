revisions:
- from: Mais si quelques-unes des branches ont été arrachées, et si toi, qui étais un olivier sauvage, tu as été greffé parmi elles[a] et as eu part avec elles à la racine et à la richesse de l’olivier[b],
  to: Mais si quelques-unes des branches ont été retranchées, et si toi, qui es un olivier sauvage, tu as été greffé parmi elles[a] et es devenu, avec elles, participant à la racine et à la richesse de l’olivier[b],
  rationale: La formulation corrige la structure conditionnelle et conserve la simultanéité de l’état d’« olivier sauvage ». Elle maintient sans interprétation doctrinale la métaphore de Paul, la greffe parmi les branches et la participation commune à la racine et à la richesse de l’olivier. La virgule finale est conservée, la phrase se poursuivant au verset 18.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:18:15Z'
review_pass:
  verdict: revise
  source_fidelity: La structure conditionnelle, l’image de la greffe et les deux réalités « racine » et « richesse » sont globalement bien rendues. Toutefois, « et si toi » introduit à tort une seconde protase conditionnelle, alors que σὺ δέ poursuit la première condition par contraste. « Qui étais » affaiblit aussi la valeur simultanée et concessive de ὢν.
  naturalness: 'La correction proposée est plus idiomatique et syntaxiquement nette en français moderne : « toi qui es..., tu as été... et tu es devenu... ». « Devenu, avec elles, participant » rend naturellement la participation commune sans faire de « avec elles » un ajout à l’objet de la participation.'
  terminology: « Olivier sauvage », « greffé », « racine » et « richesse de l’olivier » maintiennent la métaphore et les termes importants. « Retranchées » est un rendu français courant de l’enlèvement de branches dans ce contexte; il évite l’idée plus forte d’un déracinement que peut suggérer « arrachées ».
  issues:
  - severity: medium
    issue: Double condition introduite par « et si toi »
    rationale: Le grec a une seule condition, Εἰ δέ..., suivie de σὺ δέ (« mais/toi, en revanche »). La seconde occurrence française de « si » modifie la structure logique de la phrase.
  - severity: low
    issue: « qui étais » pour ὢν
    rationale: Le participe présent décrit l’état du destinataire au moment de la greffe; « qui es » (avec une nuance concessive portée par le contexte) le conserve mieux.
  - severity: low
    issue: « arrachées »
    rationale: ἐξεκλάσθησαν évoque des branches rompues ou retranchées. « Arrachées » peut suggérer qu’elles ont été déracinées; « retranchées » convient mieux à des branches.
