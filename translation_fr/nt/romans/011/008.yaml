id: ROM.11.8
reference: Romans 11:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: fr
  text: 'comme il est écrit : « Dieu leur a donné un esprit de torpeur[a], des yeux pour ne pas voir et des oreilles pour ne pas entendre, jusqu’à ce jour même. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit de profond sommeil ». L’expression fait écho à Ésaïe 29.10, bien que le terme grec employé ici désigne la torpeur, l’engourdissement ou l’hébétude.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture; « comme » rend suffisamment καθώς dans ce contexte.
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Dieu leur a donné
  rationale: Le passé composé convient à la citation en français moderne et conserve explicitement Dieu comme sujet du verbe.
- source_word: πνεῦμα κατανύξεως
  choice: un esprit de torpeur
  rationale: « Torpeur » exprime l’état d’insensibilité, d’engourdissement ou d’hébétude indiqué par κατάνυξις, sans réduire l’expression au seul arrière-plan du profond sommeil d’Ésaïe 29.10.
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: des yeux pour ne pas voir
  rationale: Cette formulation compacte conserve la construction infinitive grecque et sa possible nuance de résultat ou de finalité, tout en gardant la cadence solennelle de la citation.
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: des oreilles pour ne pas entendre
  rationale: Le parallélisme avec les yeux est maintenu; « entendre » rend directement ἀκούειν sans ajouter l’idée plus volontaire d’écouter.
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: jusqu’à ce jour même
  rationale: La formulation préserve l’emphase de σήμερον et le ton scripturaire, tout en rattachant la citation au présent de Paul.
theological_decisions:
- issue: Action divine dans l’endurcissement ou l’insensibilité judiciaire
  choice: Dieu leur a donné un esprit de torpeur
  alternative: Dieu a permis qu’ils aient un esprit de torpeur
  rationale: Le grec fait explicitement de Dieu le sujet de ἔδωκεν. La traduction ne transforme donc pas son action en simple permission, mais n’ajoute pas non plus de système doctrinal destiné à résoudre la tension entre jugement divin et responsabilité humaine.
- issue: Valeur de τοῦ μὴ avec les infinitifs
  choice: pour ne pas voir… pour ne pas entendre
  alternative: qui ne voient pas… qui n’entendent pas
  rationale: « Pour ne pas » laisse perceptible la nuance de finalité ou de résultat de la construction grecque, tandis qu’une proposition relative tendrait à n’exprimer qu’un état de fait.
translation_notes:
  register: Français international moderne, digne et de tonalité scripturaire. Le parallélisme et la concision de la citation sont conservés; « torpeur » reste compréhensible tout en rendant précisément l’insensibilité évoquée.
