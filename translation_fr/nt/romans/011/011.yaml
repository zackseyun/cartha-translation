  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: fr
  text: 'Je demande donc : ont-ils trébuché pour tomber[a] ? Certainement pas ! Mais, par leur faute[b], le salut est parvenu aux non-Juifs[c], afin de les rendre jaloux[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour tomber ». Le grec distingue « trébucher » de « tomber » ; la question appelle une réponse négative.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par leur transgression » ; le mot grec peut aussi évoquer un faux pas.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « aux nations » ; dans ce contexte, il s’agit des peuples non juifs.'
    reason: lexical_alternative
  - marker: d
    text: 'Ou : « afin de les pousser à la jalousie ». Cette jalousie peut comporter le désir de rechercher le même salut.'
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Je demande donc
  rationale: Dans ce contexte argumentatif, λέγω introduit une question rhétorique, tandis que οὖν marque la conséquence logique. Cette formulation est naturelle en français.
- source_word: μὴ ἔπταισαν
  choice: ont-ils trébuché
  rationale: La question introduite par μή appelle une réponse négative. Le passé composé convient au discours français et conserve l’image de l’action de trébucher.
- source_word: ἵνα πέσωσιν
  choice: pour tomber définitivement
  rationale: Le tour avec ἵνα peut exprimer le but ou le résultat. « Tomber » reste distinct de « trébucher » ; « définitivement » explicite ici l’opposition contextuelle, tout en étant signalé par une note afin de ne pas masquer que ce terme n’est pas exprimé séparément en grec.
- source_word: μὴ γένοιτο
  choice: Certainement pas !
  rationale: Cette exclamation française actuelle et énergique rend le rejet catégorique exprimé par l’optatif grec.
- source_word: τῷ αὐτῶν παραπτώματι
  choice: par leur faute
  rationale: παράπτωμα désigne un faux pas ou une transgression. « Faute » est clair, moralement significatif et naturel, et la préposition « par » rend la valeur instrumentale du datif.
- source_word: ἡ σωτηρία
  choice: le salut
  rationale: « Salut » est le terme français usuel qui conserve toute la portée sotériologique de σωτηρία dans Romains.
- source_word: τοῖς ἔθνεσιν
  choice: aux non-Juifs
  rationale: Dans le contraste de Romains 9–11, ἔθνη désigne les peuples autres que le peuple juif. « Non-Juifs » est immédiatement compréhensible en français moderne ; « nations » est conservé en note comme rendu plus littéral.
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: afin de provoquer leur jalousie
  rationale: εἰς τό suivi de l’infinitif exprime ici le but ou le résultat. παραζηλόω évoque une jalousie susceptible de pousser à désirer la même bénédiction, sans que cette nuance positive soit imposée au texte principal.
theological_decisions:
- issue: Le caractère final ou irréversible de la chute d’Israël
  choice: La question nie que le faux pas d’Israël aboutisse à une chute définitive.
  alternative: La question pourrait simplement opposer le fait de trébucher à celui de tomber, sans qualifier explicitement cette chute de définitive.
  rationale: Le grec distingue πταίω, « trébucher », de πίπτω, « tomber ». Le contexte du chapitre soutient l’idée d’une issue non terminale, mais la note précise que « définitivement » explicite cette portée contextuelle plutôt que de traduire un mot grec distinct.
- issue: La portée de la jalousie dans l’histoire du salut
  choice: Le salut accordé aux non-Juifs doit provoquer la jalousie d’Israël.
  alternative: Il peut s’agir soit d’une envie négative, soit d’une émulation poussant Israël à désirer le même salut.
  rationale: παραζηλόω permet ces nuances. Le texte principal conserve le langage ouvert de la jalousie, tandis que la note mentionne la possibilité d’un désir d’obtenir le même salut.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la question rhétorique, l’opposition imagée entre trébucher et tomber, ainsi que l’ambiguïté entre jalousie négative et émulation.
