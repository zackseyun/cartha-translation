  rationale: La révision retire « définitivement », ajout interprétatif non lexicalisé dans le grec, tout en maintenant l’opposition voulue entre trébucher et tomber. Elle remplace également la tournure possessive finale par une formulation plus idiomatique qui représente directement le complément αὐτούς et conserve la nuance ouverte de la jalousie.
