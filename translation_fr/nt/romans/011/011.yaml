  source_fidelity: La distinction grecque entre πταίω (« trébucher ») et πίπτω (« tomber ») est bien préservée, de même que la question rhétorique négative, la médiation du faux pas, le salut destiné aux non-Juifs et le but de susciter la jalousie. Toutefois, « définitivement » ajoute au texte une qualification qui n’est pas exprimée par πέσωσιν. Le contexte peut éclairer l’interprétation, mais ne justifie pas cet ajout dans le texte principal.
  naturalness: Le français est moderne, clair et d’un registre approprié. « Je demande donc » et « Certainement pas ! » conviennent à l’argumentation rhétorique. La reformulation finale par « les rendre jaloux » est plus directe et évite l’ambiguïté possible de « leur jalousie », dont l’antécédent pourrait être compris comme les non-Juifs immédiatement mentionnés.
  terminology: « Salut », « non-Juifs » et « faute » sont recevables dans ce contexte. La note sur « nations » rend compte utilement de ἔθνη. Le terme « jaloux » conserve l’ambivalence de παραζηλόω sans imposer l’idée d’une émulation salvatrice dans le texte.
