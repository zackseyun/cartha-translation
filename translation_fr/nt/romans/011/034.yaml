id: ROM.11.34
reference: Romans 11:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: fr
  text: Car qui a connu la pensée du Seigneur ? Ou qui est devenu son conseiller ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul fait écho à Ésaïe 40.13, où le texte grec demande de manière semblable qui a connu la pensée du Seigneur ou est devenu son conseiller.
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: qui
  rationale: Pronom interrogatif introduisant une question rhétorique ; « qui » est direct et naturel en français.
- source_word: γὰρ
  choice: car
  rationale: Marque le lien explicatif avec ce qui précède et conserve la progression de l’argument de Paul.
- source_word: ἔγνω
  choice: a connu
  rationale: Rend directement l’aoriste de γινώσκω. Dans cette question rhétorique à portée générale, le passé composé est idiomatique en français.
- source_word: νοῦν
  choice: la pensée
  rationale: Ici, νοῦς désigne la pensée, l’intelligence ou les desseins. « La pensée » est naturel en français et préserve l’ampleur du terme sans le réduire à une faculté intellectuelle.
- source_word: κυρίου
  choice: du Seigneur
  rationale: Rend directement κυρίου et maintient la formulation néotestamentaire de l’écho à Ésaïe 40.13 sans substituer le nom divin au texte grec de Romains.
- source_word: ἢ
  choice: ou
  rationale: Conserve la coordination disjonctive et le parallélisme des deux questions rhétoriques.
- source_word: σύμβουλος
  choice: conseiller
  rationale: Équivalent direct du nom désignant celui qui donne conseil ; le terme convient au registre digne de la citation.
- source_word: αὐτοῦ
  choice: son
  rationale: Le possessif français exprime naturellement le rapport au Seigneur.
- source_word: ἐγένετο
  choice: est devenu
  rationale: Rend le sens de γίνομαι, « devenir ». La formulation évite d’ajouter explicitement « jamais », idée impliquée par la question mais absente du texte.
theological_decisions:
- issue: Référent de « Seigneur » dans la citation issue d’Ésaïe
  choice: Conserver « le Seigneur » sans préciser davantage le référent dans le texte principal.
  alternative: Employer une forme renvoyant explicitement au nom divin de l’arrière-plan d’Ésaïe 40.13.
  rationale: Le texte grec de Romains porte κυρίου. La traduction respecte cette formulation tout en laissant la note signaler l’écho scripturaire ; elle n’importe donc pas dans le texte principal une précision absente de la forme citée par Paul.
translation_notes:
  register: Français international moderne, clair et digne. La structure parallèle des deux questions et la cadence scripturaire sont conservées ; aucune réponse explicite n’est ajoutée à ces questions rhétoriques.
