id: ROM.11.27
reference: Romans 11:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: fr
  text: Et voici quelle sera mon alliance avec eux[a], lorsque j’enlèverai leurs péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « l’alliance venant de moi pour eux ».'
    reason: La note conserve la construction grecque παρ’ ἐμοῦ avec le datif αὐτοῖς, plus explicite quant à l’origine divine de l’alliance, mais moins naturelle dans le texte courant.
lexical_decisions:
- source_word: διαθήκη
  choice: alliance
  rationale: Dans cette citation scripturaire chez Paul, le mot désigne l’engagement souverain de Dieu et son cadre relationnel; « alliance » en conserve la portée biblique, contrairement à « testament ».
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: mon alliance
  rationale: L’expression signifie littéralement « l’alliance venant de moi ». « Mon alliance » est idiomatique en français et exprime naturellement que cette alliance a Dieu pour auteur.
- source_word: αὐτοῖς
  choice: avec eux
  rationale: Le datif peut formellement signifier « à eux » ou « pour eux », mais le français construit naturellement « alliance » avec « avec » lorsqu’il désigne les bénéficiaires engagés dans cette relation.
- source_word: ὅταν
  choice: lorsque
  rationale: Dans cette promesse prophétique, la conjonction introduit le moment de l’accomplissement plutôt qu’une action indéfiniment répétée. « Lorsque » maintient cette valeur temporelle.
- source_word: ἀφέλωμαι
  choice: j’enlèverai
  rationale: Le verbe signifie ici ôter ou faire disparaître les péchés. Le futur français s’accorde avec la perspective prophétique et donne une formulation naturelle.
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: leurs péchés
  rationale: Cette traduction directe conserve le pluriel et la portée morale et théologique du terme grec.
- source_word: καὶ αὕτη
  choice: Et voici quelle sera
  rationale: Le grec dit littéralement « et celle-ci », avec une copule sous-entendue. La formulation française complète naturellement l’ellipse tout en rendant l’orientation future de la promesse.
theological_decisions:
- issue: Nature de διαθήκη dans la citation prophétique reprise par Paul
  choice: alliance
  alternative: testament
  rationale: « Alliance » préserve l’arrière-plan scripturaire de la promesse rédemptrice de Dieu sans introduire l’idée juridique d’un testament.
- issue: Valeur temporelle de ὅταν ἀφέλωμαι
  choice: lorsque j’enlèverai leurs péchés
  alternative: chaque fois que j’enlève leurs péchés
  rationale: Le contexte présente un accomplissement prophétique certain, non une situation générale ou répétée. La traduction ne précise toutefois pas davantage le calendrier de cet accomplissement.
translation_notes:
  register: Français international moderne, sobre et digne. « Voici quelle sera » rend l’ellipse grecque sans lourdeur; « lorsque » convient au registre prophétique. L’élision dans « j’enlèverai » assure une lecture fluide.
