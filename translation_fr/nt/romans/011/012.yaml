  naturalness: Le registre est clair et moderne. « À combien plus forte raison » est idiomatique, mais la phrase finale est plus naturelle et plus transparente avec « sera-t-elle une richesse », qui reprend explicitement le prédicat implicite sans préciser la nature de cette richesse.
  terminology: « Faute », « richesse », « monde », « non-Juifs », « défaite » et « plénitude » sont des choix recevables. Les notes conservent utilement les nuances de ἥττημα et de πλήρωμα. Pour πλήρωμα, « pleine intégration » rend plus naturellement en français l’option interprétative de la pleine inclusion, sans l’imposer au texte.
