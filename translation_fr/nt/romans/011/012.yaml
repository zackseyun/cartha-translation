id: ROM.11.12
reference: Romans 11:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: fr
  text: Mais si leur faute est une richesse pour le monde, et leur défaite[a] une richesse pour les non-Juifs, à combien plus forte raison leur plénitude[b] sera-t-elle une richesse !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « leur perte » ou « leur amoindrissement ».
    reason: lexical_alternative
  - marker: b
    text: Ou « leur nombre complet » ou « leur pleine intégration ».
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: faute
  rationale: « Faute » exprime naturellement le faux pas et la transgression morale, sans préciser davantage la nature de l’offense.
- source_word: πλοῦτος
  choice: richesse
  rationale: Le terme conserve la métaphore paulinienne de l’abondance des bienfaits accordés.
- source_word: κόσμου
  choice: le monde
  rationale: Cette formulation large et naturelle correspond à κόσμος et désigne ici le monde qui bénéficie de la faute d’Israël.
- source_word: ἥττημα
  choice: défaite
  rationale: Ce nom rare peut évoquer une défaite, une perte ou un amoindrissement. « Défaite » reste intelligible et maintient le contraste avec la future plénitude, tandis que les autres nuances sont signalées en note.
- source_word: ἐθνῶν
  choice: les non-Juifs
  rationale: Dans ce contexte de contraste avec Israël, « les non-Juifs » rend clairement le sens relationnel de ἔθνη en français courant, sans laisser entendre qu’il s’agit seulement d’entités politiques.
- source_word: πόσῳ μᾶλλον
  choice: à combien plus forte raison
  rationale: Cette tournure française idiomatique restitue l’argument a fortiori du grec.
- source_word: πλήρωμα
  choice: plénitude
  rationale: « Plénitude » préserve l’ampleur sémantique du grec, qui peut évoquer un nombre complet, une pleine participation ou un plein accomplissement, sans trancher entre ces lectures.
theological_decisions:
- issue: Sens et référent de τὸ πλήρωμα αὐτῶν
  choice: leur plénitude
  alternative: leur nombre complet ; leur pleine participation ; leur plein rétablissement
  rationale: La formulation grecque est concise et ouverte. Le texte principal conserve cette tension au lieu de décider si Paul parle surtout d’un nombre, d’une inclusion ou d’un rétablissement eschatologique.
- issue: Verbe sous-entendu dans la dernière proposition
  choice: le sera-t-elle
  alternative: combien plus leur plénitude
  rationale: Le grec laisse le prédicat sous-entendu. Le français exige ici de le reprendre pour former une phrase naturelle ; le pronom « le » renvoie à « une richesse », sans ajouter le contenu précis de cette richesse.
translation_notes:
  register: Français international moderne, clair et digne. « Mais si » rend explicitement δέ sans introduire un marqueur temporel absent. La phrase conserve le parallélisme et l’intensification de l’argument grec.
