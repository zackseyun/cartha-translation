reference: Romans 11:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: fr
  text: En effet, si tu as été coupé d’un olivier sauvage par nature et greffé, contrairement à la nature, sur un olivier cultivé, à combien plus forte raison ceux-ci, qui sont des branches naturelles[a], seront-ils greffés sur leur propre olivier[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux-ci, ceux qui sont selon la nature » ; l’expression « branches naturelles » explicite la métaphore de l’olivier dans le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi comprendre : « seront de nouveau greffés sur leur propre olivier ». L’idée du retour ressort du contexte, mais « de nouveau » n’est pas exprimé dans le verbe grec.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: tu as été coupé
  rationale: Le verbe ἐκκόπτω signifie couper ou retrancher. « Coupé » conserve ici précisément l’image horticole sans l’assimiler au verbe « briser » employé dans le contexte voisin.
- source_word: ἀγριελαίου
  choice: d’un olivier sauvage
  rationale: Le nom désigne un olivier sauvage. Cette formulation française est naturelle et maintient le contraste avec l’olivier cultivé.
- source_word: παρὰ φύσιν
  choice: contrairement à la nature
  rationale: La formule rend directement l’opposition rhétorique avec κατὰ φύσιν et demeure claire en français moderne.
- source_word: ἐνεκεντρίσθης
  choice: greffé ... sur
  rationale: ἐγκεντρίζω est le verbe horticole « greffer ». En français, on greffe normalement une branche « sur » un arbre ou un porte-greffe, même si le grec emploie εἰς, littéralement orienté vers l’intérieur.
- source_word: καλλιέλαιον
  choice: un olivier cultivé
  rationale: Le terme désigne l’olivier cultivé, par opposition à l’olivier sauvage. « Cultivé » est plus précis et moins évaluatif que « bon ».
- source_word: πόσῳ μᾶλλον
  choice: à combien plus forte raison
  rationale: Cette tournure française idiomatique exprime clairement l’argument a fortiori du grec.
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: ceux-ci, les branches naturelles
  rationale: Le grec dit littéralement « ceux-ci, ceux selon la nature ». « Branches » est fourni à partir de la métaphore explicite du contexte afin d’obtenir une phrase française intelligible, sans nommer directement Israël dans le verset.
- source_word: ἐγκεντρισθήσονται
  choice: seront greffés
  rationale: Le futur passif est rendu sans ajouter « de nouveau », idée suggérée par le contexte mais non exprimée lexicalement par le verbe.
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: sur leur propre olivier
  rationale: « Leur propre » préserve l’accent de ἰδίᾳ sur l’appartenance. « Sur » est la construction horticole française naturelle avec « greffer ».
theological_decisions:
- issue: Faut-il préciser que « ceux-ci » désigne Israël ou les Juifs ?
  choice: 'Conserver le démonstratif et la métaphore : « ceux-ci, les branches naturelles ».'
  alternative: « ces Juifs » ou « ces Israélites »
  rationale: Le contexte de Romains 11 établit le référent, mais le grec de ce verset n’emploie aucun nom ethnique. La traduction préserve donc la formulation métaphorique et ne rend pas plus explicite que le texte source.
- issue: Faut-il fournir le nom « branches », absent du grec de ce verset ?
  choice: Fournir « branches » dans le texte principal, avec une note.
  alternative: « ceux-ci, qui le sont par nature » ou « ceux qui sont selon la nature »
  rationale: La métaphore des branches et de la greffe domine le contexte immédiat. Fournir « branches » constitue une explicitation minimale qui rend le français naturel tout en signalant dans une note que le mot n’est pas exprimé ici.
- issue: Faut-il ajouter l’idée de retour dans « seront greffés » ?
  choice: Ne pas ajouter « de nouveau » dans le texte principal.
  alternative: « seront de nouveau greffés »
  rationale: Le retour est fortement impliqué par le contexte des branches retranchées, mais il n’est pas explicitement encodé dans ἐγκεντρισθήσονται. Une note conserve cette nuance sans l’imposer au texte.
translation_notes:
  register: 'Français international moderne, courant et digne. Le tutoiement singulier reflète le σύ adressé au lecteur non juif représentatif. L’exclamation finale restitue la force rhétorique de l’argument a fortiori. Les termes horticoles restent accessibles et cohérents : olivier sauvage, olivier cultivé, greffer sur.'
