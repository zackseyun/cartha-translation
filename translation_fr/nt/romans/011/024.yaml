  terminology: « Olivier sauvage », « olivier cultivé », « greffé » et « à combien plus forte raison » sont justes, cohérents et d’un registre moderne digne. La note sur « de nouveau » préserve correctement le fait que l’idée est contextuelle, non lexicale.
