id: ROM.11.7
reference: Romans 11:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: fr
  text: Qu’en est-il donc ? Israël n’a pas obtenu ce qu’il recherche ; ceux qui ont été choisis[a], eux, l’ont obtenu, tandis que les autres ont été endurcis[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le choix » ou « l’élection » ; ici, le terme grec désigne vraisemblablement les personnes choisies.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ont été rendus insensibles ». Le verbe grec évoque un durcissement, comme celui d’une callosité, et peut désigner une insensibilité spirituelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: Qu’en est-il donc ?
  rationale: Cette formule interrogative rend naturellement la transition logique et rhétorique de Paul sans développer explicitement la conclusion.
- source_word: ὃ ἐπιζητεῖ
  choice: ce qu’il recherche
  rationale: Le présent français exprime la poursuite en cours, et le pronom « il » reprend naturellement le nom collectif « Israël ».
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Le nom propre est conservé ; dans ce contexte, il désigne collectivement Israël.
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: n’a pas obtenu
  rationale: Le verbe signifie ici parvenir à obtenir ce qui est recherché. Le passé composé convient au constat formulé par Paul.
- source_word: ἡ δὲ ἐκλογὴ
  choice: ceux qui ont été choisis
  rationale: Le nom abstrait « choix » désigne ici, par métonymie, les personnes choisies, mises en contraste avec « les autres ». Cette formulation est claire en français courant sans transformer le groupe en concept abstrait.
- source_word: ἐπέτυχεν
  choice: l’ont obtenu
  rationale: La répétition d’« obtenu » reproduit le contraste fondé sur le même verbe grec ; « l’ » reprend ce qu’Israël recherche.
- source_word: οἱ δὲ λοιποὶ
  choice: les autres
  rationale: L’expression désigne tous ceux qui restent par contraste avec les personnes choisies. « Les autres » est naturel et précis dans cette phrase.
- source_word: ἐπωρώθησαν
  choice: ont été endurcis
  rationale: Le passif et la métaphore de l’endurcissement sont conservés, sans préciser un agent que le grec ne nomme pas.
theological_decisions:
- issue: Sens de ἡ ἐκλογὴ
  choice: ceux qui ont été choisis
  alternative: le choix / les élus
  rationale: Le contraste avec « les autres » montre que le nom abstrait représente ici des personnes. La traduction garde ce sens sans développer une doctrine particulière de l’élection.
- issue: Agent de l’endurcissement dans ἐπωρώθησαν
  choice: ont été endurcis
  alternative: Dieu les a endurcis / ils se sont endurcis
  rationale: Le grec emploie un passif et ne nomme pas l’agent. La traduction préserve donc l’ambiguïté entre l’action judiciaire divine, la responsabilité humaine ou leur articulation.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation met en relief le contraste entre Israël dans son ensemble, ceux qui ont été choisis et les autres. Les deux passifs ne reçoivent aucun agent ajouté.
