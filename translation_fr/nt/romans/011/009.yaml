review_pass:
  verdict: revise
  source_fidelity: 'La tournure jussive « Que leur table devienne » rend fidèlement Γενηθήτω, et « David dit » respecte le présent λέγει. L’accumulation des quatre effets est conservée. En revanche, « juste » n’est exprimé par aucun élément du grec : ἀνταπόδομα désigne une rétribution/contrepartie, sans qualifier explicitement celle-ci de juste. Cet ajout interprétatif doit être retiré.'
  naturalness: Le français proposé est globalement clair et de registre biblique moderne. « Traquenard » est un équivalent naturel dans cette série d’images d’enfermement et distingue θήραν de « piège » sans imposer le sens plus spécifique de « filet ». « Une rétribution pour eux » rend naturellement la construction finale.
  terminology: « Pierre d’achoppement » est une expression française établie qui préserve la métaphore de σκάνδαλον. « Rétribution » convient à ἀνταπόδομα dans ce contexte imprécatoire, à condition de ne pas lui ajouter « juste ».
  issues:
  - severity: medium
    issue: Ajout de « juste » dans « une juste rétribution »
    rationale: ἀνταπόδομα signifie rétribution, retour ou contrepartie, mais le texte grec ne contient aucun qualificatif correspondant à « juste ». L’ajout explicite une appréciation morale qui doit rester implicite dans le contexte.
  - severity: low
    issue: « Filet » pour θήραν est trop spécifique
    rationale: θήραν évoque la chasse ou un moyen de capturer, sans désigner nécessairement un filet. « Traquenard » conserve l’idée de piège tendu tout en distinguant les deux termes de la série.
  revised_text: 'Et David dit : « Que leur table devienne un piège, un traquenard, une pierre d’achoppement et une rétribution pour eux[a]. »'
  revised_footnotes:
