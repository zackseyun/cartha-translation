  rationale: La révision retire l’adjectif interprétatif « juste », absent du grec, et remplace « filet » par « traquenard », terme français plus général pour l’image cynégétique de θήραν. Elle conserve le jussif, l’image concrète de la table, la série rhétorique et l’ambiguïté de la rétribution.
