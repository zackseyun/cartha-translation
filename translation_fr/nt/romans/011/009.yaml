id: ROM.11.9
reference: Romans 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: fr
  text: 'Et David dit : « Que leur table devienne un piège, un traquenard, une pierre d’achoppement et une rétribution pour eux[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un retour » ou « une contrepartie »; le terme grec désigne ce qui est rendu en retour à quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ λέγει
  choice: David dit
  rationale: Le présent grec introduit la citation comme une parole scripturaire toujours actuelle; le présent français convient naturellement.
- source_word: Γενηθήτω
  choice: Que ... devienne
  rationale: Cette tournure rend directement la valeur impérative/jussive de l’aoriste grec, sans transformer l’imprécation en simple prédiction.
- source_word: ἡ τράπεζα αὐτῶν
  choice: leur table
  rationale: Conserve l’image concrète de la table sans expliciter abusivement le repas, les biens ou la communion de table.
- source_word: παγίδα
  choice: un piège
  rationale: Terme français courant qui exprime l’idée de capture et permet de maintenir l’accumulation des images.
- source_word: θήραν
  choice: un filet
  rationale: Dans cette série de moyens de capture, « filet » distingue ce terme du précédent tout en rendant naturellement son association avec la chasse.
- source_word: σκάνδαλον
  choice: une pierre d’achoppement
  rationale: Expression biblique française intelligible qui conserve l’image d’un obstacle causant la chute, plutôt que de la réduire à une offense subjective.
- source_word: ἀνταπόδομα αὐτοῖς
  choice: une juste rétribution pour eux
  rationale: « Rétribution » exprime le retour reçu en conséquence de leurs actes; « juste » rend explicite la nuance de rétribution légitime portée par le contexte imprécatoire, tandis que « pour eux » rattache naturellement le syntagme à toute la série.
theological_decisions:
- issue: Force de l’imprécation citée du Psaume 69.23 (LXX 68.23)
  choice: 'Conserver le jussif direct : « Que leur table devienne... »'
  alternative: « Leur table deviendra... » ou « Puisse leur table devenir... »
  rationale: L’impératif grec présente une demande de jugement, non une simple annonce. La traduction en conserve la sévérité sans l’adoucir.
- issue: Nature de ἀνταπόδομα
  choice: « juste rétribution »
  alternative: « remboursement », « retour » ou « châtiment »
  rationale: Le mot désigne ce qui est rendu en retour. Dans cette imprécation, « rétribution » laisse entendre la dimension judiciaire sans préciser davantage la forme du jugement.
translation_notes:
  register: Français international moderne, digne et oralement fluide. L’accumulation de quatre compléments est conservée pour respecter la vigueur rhétorique du grec. Le marqueur [a] figure dans le texte après l’expression concernée.
