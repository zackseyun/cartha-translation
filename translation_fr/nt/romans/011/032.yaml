  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: fr
  text: Car Dieu a enfermé tous dans la désobéissance[a][b], afin de faire miséricorde à tous[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a tenu tous enfermés » ou « a soumis tous à la désobéissance ».'
    reason: lexical_alternative
  - marker: b
    text: Selon le contexte, le mot grec peut aussi évoquer l’incrédulité ; il désigne plus largement le refus d’obéir.
    reason: lexical_alternative
  - marker: c
    text: Le grec répète « tous » dans les deux propositions. Dans le contexte, Paul parle des Juifs et des non-Juifs ensemble ; la traduction conserve néanmoins toute l’ampleur de sa formulation.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: a enfermé
  rationale: Le verbe συγκλείω évoque le fait d’enfermer ou de tenir ensemble sous une même condition. « A enfermé » conserve cette image concrète sans accentuer indûment l’idée pénale de l’emprisonnement.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit l’explication de l’argument précédent ; « Car » en restitue sobrement la fonction logique.
- source_word: τοὺς πάντας
  choice: tous les êtres humains / tous
  rationale: La même expression est répétée dans les deux propositions. L’ajout de « les êtres humains » à la première occurrence rend le français naturel et explicite le référent personnel ; « tous » à la seconde évite une répétition pesante tout en maintenant la symétrie de portée.
- source_word: εἰς ἀπείθειαν
  choice: dans la désobéissance
  rationale: ἀπείθεια désigne ici la désobéissance, avec une possible nuance d’incrédulité. « Dans » suit le mouvement ou l’aboutissement exprimé par εἰς et s’accorde naturellement avec l’image d’enfermement.
- source_word: ἵνα
  choice: afin de
  rationale: ἵνα exprime ici le dessein de l’action divine. « Afin de » en conserve clairement la force finale dans un registre digne et courant.
- source_word: ἐλεήσῃ
  choice: faire miséricorde
  rationale: ἐλεέω signifie exercer ou manifester la miséricorde. « Faire miséricorde à » est une tournure française biblique encore intelligible et permet de préserver le caractère théologique du terme.
theological_decisions:
- issue: Portée de τοὺς πάντας dans les deux propositions
  choice: Conserver « tous » dans les deux propositions sans en réduire explicitement la portée.
  alternative: Préciser « les Juifs et les non-Juifs » ou interpréter le verset comme affirmant explicitement le salut final de chaque individu.
  rationale: Paul emploie deux fois la même expression générale. Le contexte concerne ensemble les Juifs et les non-Juifs, mais la traduction ne doit ni restreindre prématurément cette formulation ni en tirer à elle seule une conclusion sur le salut universel.
- issue: Rapport exprimé par ἵνα
  choice: Traduire par « afin de », qui marque le dessein.
  alternative: « De sorte qu’il fasse miséricorde », qui mettrait davantage l’accent sur le résultat.
  rationale: La conjonction peut toucher au but et au résultat, mais, dans cette affirmation sur l’action de Dieu, la valeur finale est naturelle. La traduction laisse toutefois intacte la tension entre souveraineté divine, désobéissance humaine et miséricorde.
translation_notes:
  register: Français international moderne, clair et digne. « Faire miséricorde » maintient un léger registre biblique sans devenir archaïque. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
