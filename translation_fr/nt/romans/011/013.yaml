  naturalness: La formulation actuelle est globalement lisible, mais « à vous qui êtes issus des autres peuples » est lourde et peu idiomatique dans cette adresse directe. « Je m’adresse à vous, les non-Juifs » est naturel en français international moderne. Deux phrases reproduisent également la ponctuation du texte source.
  terminology: « Non-Juifs » transmet clairement l’opposition contextuelle entre Israël et les ἔθνη, sans les connotations variables de « païens » ni l’opacité possible de « Gentils ». « Ministère » et « apôtre » sont appropriés. « Auprès des non-Juifs » rend sobrement la mission exprimée par le génitif ἐθνῶν.
