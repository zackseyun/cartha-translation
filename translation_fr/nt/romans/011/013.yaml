source:
  edition: SBLGNT
  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: fr
  text: Or, je m’adresse à vous, les non-Juifs[a]. Dans la mesure où je suis, moi, apôtre auprès des non-Juifs, je mets mon ministère à l’honneur[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les nations » ; ici, les peuples autres qu’Israël, c’est-à-dire les non-Juifs. De même dans la suite du verset.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « je glorifie mon ministère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: Mais je vous le dis, à vous qui êtes issus des autres peuples
  rationale: Le pronom et le groupe nominal désignent ensemble les destinataires. « Mais » marque la transition légèrement contrastive de δέ, tandis que « issus des autres peuples » exprime naturellement en français moderne les non-Juifs visés dans le contraste avec Israël.
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: puisque
  rationale: Dans ce contexte, la locution introduit le fondement de l’affirmation de Paul. « Puisque » restitue clairement ce lien sans calquer lourdement l’enchaînement des particules.
- source_word: εἰμι ἐγὼ ἐθνῶν ἀπόστολος
  choice: je suis apôtre auprès des autres peuples
  rationale: « Apôtre » conserve le sens établi du terme, et « auprès de » rend la mission orientée vers les non-Juifs sans transformer le génitif en appartenance.
- source_word: τὴν διακονίαν μου
  choice: mon ministère
  rationale: Ici, διακονία désigne le service ou la mission apostolique de Paul. « Ministère » est précis, courant dans le contexte biblique et conserve l’idée d’une charge de service.
- source_word: δοξάζω
  choice: je mets … à l’honneur
  rationale: Cette expression française rend l’idée d’honorer et de faire ressortir la valeur du ministère, sans suggérer que Paul se glorifie lui-même.
theological_decisions:
- issue: Sens de l’affirmation de Paul au sujet de son ministère
  choice: Paul met son ministère à l’honneur.
  alternative: Paul glorifie son ministère.
  rationale: Le ministère, non la personne de Paul, est l’objet de δοξάζω. La formulation retenue conserve cette distinction et n’impose pas l’idée d’une autosatisfaction.
- issue: Référent de ἔθνη / ἐθνῶν
  choice: les autres peuples, c’est-à-dire les non-Juifs
  alternative: les nations
  rationale: Dans Romains 9–11, le terme désigne les peuples autres qu’Israël. La formulation explicite ce contraste ethnique sans employer le mot « païens », qui peut aujourd’hui suggérer avant tout une conviction religieuse ou porter une nuance péjorative.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure évite « Gentils », terme souvent opaque hors du vocabulaire ecclésial, ainsi que « païens », potentiellement péjoratif. La ponctuation respecte le fait que la phrase se poursuit au verset suivant.
