  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: fr
  text: Mais si c’est par grâce, ce n’est plus sur la base des œuvres ; autrement, la grâce ne devient plus grâce.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: par grâce
  rationale: 'Le datif exprime ici le fondement ou le moyen : l’élection mentionnée dans le contexte repose sur la grâce.'
- source_word: ἐξ ἔργων
  choice: sur la base des œuvres
  rationale: La préposition ἐκ indique ici la source ou le fondement. Cette formulation française rend le contraste logique avec « par grâce » plus nettement que le littéral « venant des œuvres ».
- source_word: γίνεται
  choice: devient
  rationale: Conserve la valeur propre de γίνομαι et la formulation paradoxale de Paul, sans l’aplanir en simple copule (« n’est plus »).
theological_decisions:
- issue: Rapport entre grâce et œuvres
  choice: Maintenir leur opposition comme deux fondements incompatibles dans cette proposition.
  alternative: Paraphraser en précisant un système doctrinal particulier du salut ou du mérite.
  rationale: Le verset affirme que ce qui est fondé sur la grâce ne l’est plus sur les œuvres, mais il ne définit pas ici toute la portée de « œuvres » ; la traduction évite donc d’ajouter une précision confessionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « grâce… grâce » et le verbe « devient » sont volontairement conservés pour reproduire la force logique et rhétorique du grec.
