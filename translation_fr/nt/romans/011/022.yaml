  source_fidelity: 'Le texte rend fidèlement les contrastes et la syntaxe du grec : l’appel impératif (« Considère donc »), la bonté et la sévérité de Dieu, la sévérité envers ceux qui sont tombés, la condition de demeurer dans cette bonté, et l’avertissement final au passif sont tous conservés. « Retranché » transmet convenablement ἐκκοπήσῃ dans le cadre de l’image de l’olivier, sans interprétation doctrinale supplémentaire.'
  naturalness: Le français est fluide, moderne et d’un registre biblique sobre. La répétition de « bonté » et de « sévérité » respecte le parallélisme rhétorique du grec. Le tutoiement est cohérent avec le singulier σέ et fonctionne ici pour l’interpellation représentative de Paul.
