id: ROM.11.22
reference: Romans 11:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: fr
  text: 'Considère donc la bonté et la sévérité de Dieu : sévérité envers ceux qui sont tombés, mais bonté de Dieu envers toi, si tu demeures dans cette bonté ; sinon, toi aussi tu seras retranché.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « coupé ». « Retranché » s’accorde avec l’image de l’olivier développée dans le passage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: Considère
  rationale: L’impératif appelle le lecteur à porter une attention réfléchie à ce qui suit. « Considère » restitue naturellement cette force exhortative en français moderne.
- source_word: χρηστότητα / χρηστότης
  choice: bonté
  rationale: Le terme désigne ici la disposition bienveillante de Dieu. « Bonté » est naturel, digne et permet de conserver la même expression lors des trois occurrences, notamment dans « demeures dans cette bonté ».
- source_word: ἀποτομίαν / ἀποτομία
  choice: sévérité
  rationale: Le nom exprime la rigueur tranchante du jugement et forme un contraste net avec la bonté, sans ajouter une idée étrangère au texte.
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: envers ceux qui sont tombés
  rationale: « Envers » rend la direction ou la relation exprimée par ἐπί, tandis que le passé composé présente naturellement l’état résultant de leur chute.
- source_word: ἐπὶ δὲ σὲ
  choice: envers toi
  rationale: Cette formulation maintient le parallélisme avec « envers ceux qui sont tombés » et le contraste direct établi par le grec.
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: si tu demeures dans cette bonté
  rationale: Le verbe exprime la continuité ou la persévérance. « Demeurer dans » conserve la construction imagée sans préciser au-delà du texte comment cette continuité doit être comprise.
- source_word: ἐπεὶ
  choice: sinon
  rationale: Dans ce contexte conditionnel, le mot introduit la conséquence négative au cas où la condition précédente ne serait pas remplie.
- source_word: ἐκκοπήσῃ
  choice: tu seras retranché
  rationale: Le futur passif signifie être coupé ou retranché. « Retranché » convient à l’image de l’olivier et garde la force de l’avertissement.
theological_decisions:
- issue: Avertissement conditionnel concernant la bonté et le jugement de Dieu
  choice: 'Maintenir l’avertissement dans sa forme conditionnelle directe : « si tu demeures… sinon… tu seras retranché »'
  alternative: Atténuer l’avertissement en le présentant comme purement hypothétique, ou préciser qu’il vise exclusivement des individus ou exclusivement des groupes.
  rationale: Le grec formule une véritable condition suivie d’une conséquence, mais ne tranche pas ici les débats doctrinaux sur la persévérance, l’apostasie ou l’application individuelle et collective. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète le σέ adressé directement au lecteur païen représentatif. La répétition de « bonté » et de « sévérité » conserve le parallélisme rhétorique du grec.
