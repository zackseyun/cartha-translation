id: ROM.11.23
reference: Romans 11:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: fr
  text: Et eux aussi, s’ils ne persistent pas dans l’incrédulité, seront greffés ; car Dieu est capable de les greffer de nouveau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι δέ
  choice: Et eux aussi
  rationale: Rend à la fois la progression portée par δέ et la valeur additive de καί dans κἀκεῖνοι, tout en renvoyant naturellement aux branches retranchées évoquées dans le contexte.
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: s’ils ne persistent pas
  rationale: Le présent du subjonctif exprime ici la continuation dans un état. « Persister » conserve cette valeur durative et convient naturellement avec « dans l’incrédulité ».
- source_word: τῇ ἀπιστίᾳ
  choice: dans l’incrédulité
  rationale: Dans l’argument de Romains 11, ἀπιστία s’oppose directement à la foi et désigne avant tout le refus de croire. « Incrédulité » préserve ce contraste immédiat.
- source_word: ἐγκεντρισθήσονται
  choice: seront greffés
  rationale: Le futur passif maintient la métaphore de l’olivier et laisse l’agent implicite dans la première proposition, comme en grec. L’idée de retour n’est pas ajoutée ici, puisque πάλιν apparaît seulement ensuite.
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: car Dieu est capable
  rationale: Cette formulation rend clairement l’adjectif prédicatif δυνατός et l’affirmation de la capacité divine, sans surinterpréter le degré de puissance.
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: de les greffer de nouveau
  rationale: « De nouveau » rend explicitement πάλιν et exprime la restauration à l’endroit précis où le grec la marque, tout en répétant le verbe de la métaphore.
theological_decisions:
- issue: Sens de ἀπιστία dans ce contexte
  choice: incrédulité
  alternative: infidélité
  rationale: Le contexte immédiat oppose foi et incrédulité en rapport avec les branches maintenues ou retranchées. « Incrédulité » restitue cette opposition sans élargir le terme à une catégorie générale d’infidélité.
- issue: Expression du retour dans la première occurrence du verbe greffer
  choice: seront greffés
  alternative: seront greffés de nouveau / seront réintégrés par greffe
  rationale: Le grec n’emploie πάλιν que dans la seconde proposition. La traduction conserve cette répartition et évite d’expliciter trop tôt ce que le texte marque ensuite.
- issue: Portée de la capacité divine
  choice: Dieu est capable de les greffer de nouveau
  alternative: Dieu est assez puissant pour les greffer de nouveau
  rationale: La traduction affirme la capacité de Dieu comme le fait δυνατός, sans transformer cette affirmation en commentaire sur un degré de puissance ni résoudre les tensions théologiques du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « greffer » conserve l’image directrice de l’olivier. « Persister dans l’incrédulité » est légèrement soutenu mais naturel dans un registre biblique contemporain.
