id: ROM.11.2
reference: Romans 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: fr
  text: Dieu n’a pas rejeté son peuple, qu’il a connu d’avance[a]. Ou bien, ne savez-vous pas ce que dit l’Écriture dans le passage consacré à Élie[b], comment il en appelle à Dieu contre Israël[c] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il connaissait d’avance ». Certains comprennent ici une connaissance impliquant un choix ou un amour préalable ; le grec ne précise pas explicitement cette nuance.
    reason: alternative_reading
  - marker: b
    text: Littéralement « en Élie », idiome qui désigne le passage de l’Écriture où il est question d’Élie.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « comment il adresse une plainte à Dieu contre Israël » ; autre traduction possible : « comment il supplie Dieu contre Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: n’a pas rejeté
  rationale: Dans ce contexte, l’aoriste moyen de ἀπωθέομαι exprime l’idée de repousser ou de rejeter. « N’a pas rejeté » est clair, actuel et convient à la négation par Paul d’une répudiation du peuple de Dieu.
- source_word: τὸν λαὸν αὐτοῦ
  choice: son peuple
  rationale: λαός désigne ici le peuple appartenant à Dieu, avec sa portée d’alliance. La traduction n’ajoute pas « Israël » dans la première proposition, puisque ce nom apparaît explicitement à la fin du verset.
- source_word: ὃν προέγνω
  choice: qu’il a connu d’avance
  rationale: Cette formulation rend directement le sens temporel de προγινώσκω sans imposer dans le texte la glose plus interprétative « choisi d’avance ». Elle préserve ainsi la tension théologique du terme.
- source_word: ἢ οὐκ οἴδατε
  choice: Ou bien, ne savez-vous pas
  rationale: La formule introduit une question rhétorique. « Ou bien » marque naturellement en français le lien argumentatif avec ce qui précède.
- source_word: ἐν Ἠλίᾳ
  choice: dans le passage consacré à Élie
  rationale: L’expression grecque signifie ici « dans la section de l’Écriture qui concerne Élie ». Traduire l’idiome évite l’expression française obscure « en Élie ».
- source_word: ἡ γραφή
  choice: l’Écriture
  rationale: Chez Paul, le singulier γραφή renvoie au texte sacré faisant autorité. « L’Écriture » est la désignation française usuelle.
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: lorsqu’il en appelle à Dieu
  rationale: ἐντυγχάνω peut exprimer une démarche, une requête ou un appel adressé à quelqu’un. Avec « contre Israël », « en appelle à Dieu » restitue la démarche hostile sans suggérer une intercession favorable.
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: contre Israël
  rationale: κατά suivi du génitif a ici un sens adversatif. Le nom propre « Israël » est conservé sans explicitation ajoutée.
theological_decisions:
- issue: Portée de προέγνω dans son rapport à l’élection divine
  choice: a connu d’avance
  alternative: a choisi d’avance ; a aimé d’avance
  rationale: Le verbe participe au débat paulinien sur l’élection, mais sa traduction ne doit pas trancher au-delà des données lexicales. « A connu d’avance » conserve la formulation grecque et laisse ouverte la question de savoir si cette connaissance implique ici un choix ou un amour préalable.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique et le mouvement argumentatif de Paul sont conservés. L’idiome « en Élie » est explicité dans le corps du texte, tandis que la formulation littérale figure en note. La traduction de προέγνω demeure volontairement proche du grec afin de ne pas résoudre une tension théologique réelle.
