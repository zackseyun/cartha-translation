  variant: modern international French
source:
  edition: SBLGNT
  text: ἢ τίς προέδωκεν αὐτῷ, καὶ ἀνταποδοθήσεται αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/035.yaml
  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: fr
  text: Ou qui lui a donné le premier[a], et cela lui sera-t-il rendu[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui a donné d’avance ».'
    reason: lexical_alternative
  - marker: b
    text: Autrement dit, personne n’a donné à Dieu de façon à mettre Dieu dans l’obligation de lui rendre ce qu’il a donné.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ou
  rationale: Introduit naturellement en français la question rhétorique suivante dans la série.
- source_word: τίς
  choice: qui
  rationale: Pronom interrogatif personnel, rendu directement et idiomatiquement.
- source_word: προέδωκεν
  choice: a donné le premier
  rationale: Conserve l’idée de priorité exprimée par le préverbe προ-, essentielle à l’image d’un don qui aurait précédé celui de Dieu et pourrait l’obliger.
- source_word: αὐτῷ
  choice: lui
  rationale: Maintient le pronom grec; dans le contexte, son référent est Dieu.
- source_word: καὶ
  choice: et
  rationale: Préserve la coordination simple et la progression de la question rhétorique.
- source_word: ἀνταποδοθήσεται
  choice: cela lui sera rendu en retour
  rationale: Rend le futur passif et l’idée de restitution ou de contrepartie. « Cela » fournit en français le sujet grammatical requis sans préciser davantage ce que le grec laisse implicite.
- source_word: αὐτῷ
  choice: lui
  rationale: Reproduit le pronom répété et le parallélisme de la formulation grecque.
theological_decisions:
- issue: Référent du pronom αὐτῷ
  choice: Employer « lui », avec Dieu comme référent contextuel.
  alternative: Remplacer explicitement le pronom par « Dieu ».
  rationale: Le grec emploie un pronom, et le contexte permet d’identifier clairement Dieu sans explicitation dans le corps du texte.
- issue: Portée de προέδωκεν et dette supposée de Dieu
  choice: Conserver la priorité avec « a donné le premier ».
  alternative: Traduire simplement par « a donné » ou reformuler par « pour que Dieu lui doive quelque chose ».
  rationale: 'La formulation retenue garde la force de la question: personne ne peut précéder Dieu par un don qui placerait Dieu dans l’obligation de rendre. Elle exprime cette portée sans intégrer l’explication théologique au texte même.'
- issue: Sujet implicite du passif ἀνταποδοθήσεται
  choice: Employer le démonstratif neutre « cela » comme sujet grammatical.
  alternative: Traduire par « il sera remboursé » ou « Dieu le lui rendra ».
  rationale: « Cela » renvoie sans précision excessive à ce qui aurait été donné et conserve le passif, tandis que les autres solutions introduiraient soit un bénéficiaire comme sujet, soit Dieu comme sujet explicite.
translation_notes:
  register: Français international moderne, sobre et digne. La construction reste proche de la question rhétorique grecque; « rendu en retour » est légèrement formel, mais clair et approprié au registre biblique.
