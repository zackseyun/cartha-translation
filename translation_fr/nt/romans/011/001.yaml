  variant: modern international French
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: fr
  text: 'Je demande donc : Dieu a-t-il rejeté son peuple[a] ? Absolument pas[b] ! Car moi aussi, je suis Israélite, de la descendance d’Abraham[c], de la tribu de Benjamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « repoussé son peuple » ou « écarté son peuple ».'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression grecque marque un rejet catégorique ; on pourrait aussi traduire : « Certainement pas ! » ou « Loin de là ! »'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « de la semence d’Abraham ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Je demande donc
  rationale: Dans ce contexte, λέγω introduit une question rhétorique, tandis que οὖν marque le lien logique avec ce qui précède. Cette formulation est naturelle en français et conserve les deux éléments.
- source_word: μὴ ἀπώσατο
  choice: a-t-il rejeté
  rationale: Le verbe exprime l’idée de repousser ou de rejeter. La question introduite par μή appelle une réponse négative, sans qu’il soit nécessaire de l’expliciter dans la formulation française.
- source_word: τὸν λαὸν αὐτοῦ
  choice: son peuple
  rationale: Cette expression simple préserve à la fois le sens collectif de λαός et la relation d’appartenance exprimée par αὐτοῦ.
- source_word: μὴ γένοιτο
  choice: Absolument pas !
  rationale: Cette formule française actuelle rend la vive répudiation exprimée par l’optatif grec, plus forte qu’un simple « non ».
- source_word: καὶ γὰρ ἐγὼ
  choice: Car moi aussi
  rationale: γάρ introduit la justification; καί et le pronom ἐγώ mis en relief présentent Paul lui-même comme un cas venant étayer sa réponse.
- source_word: Ἰσραηλίτης
  choice: Israélite
  rationale: Équivalent français usuel de cette désignation ethnique et liée au peuple de l’alliance.
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: de la descendance d’Abraham
  rationale: σπέρμα signifie littéralement « semence », mais désigne ici la postérité. « Descendance » est idiomatique en français tout en conservant la portée généalogique.
- source_word: φυλῆς Βενιαμίν
  choice: de la tribu de Benjamin
  rationale: Traduction directe, claire et traditionnelle de l’appartenance tribale indiquée par φυλή.
theological_decisions:
- issue: Portée du rejet du peuple d’Israël dans la question de Paul
  choice: Dieu a-t-il rejeté son peuple ?
  alternative: Dieu a-t-il rejeté définitivement ou entièrement son peuple ?
  rationale: Aucun adverbe signifiant « définitivement », « entièrement » ou « pour toujours » ne figure dans le grec. La traduction laisse donc le contexte préciser la portée de la question et ne tranche pas d’avance la tension théologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation suit étroitement la progression rhétorique du grec tout en employant des expressions françaises naturelles. Les marqueurs de notes sont placés immédiatement après les segments concernés.
