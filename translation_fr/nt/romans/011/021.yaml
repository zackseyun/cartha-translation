id: ROM.11.21
reference: Romans 11:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: fr
  text: Car si Dieu n’a pas épargné les branches naturelles[a], il ne t’épargnera pas non plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : «les branches selon la nature».'
    reason: La note signale la forme plus littérale de κατὰ φύσιν tout en gardant dans le texte une formulation française naturelle.
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Car si
  rationale: Le lien explicatif γάρ et la condition εἰ sont rendus naturellement tout en maintenant l’enchaînement argumentatif.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Rendu français standard du sujet θεός.
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: les branches naturelles
  rationale: Expression concise et idiomatique qui conserve l’image de l’olivier et le sens de «branches selon la nature», sans expliciter leur référent.
- source_word: οὐκ ἐφείσατο
  choice: n’a pas épargné
  rationale: Préserve le sens de φείδομαι et le parallélisme verbal entre les deux propositions.
- source_word: οὐδὲ σοῦ φείσεται
  choice: il ne t’épargnera pas non plus
  rationale: Rend naturellement la continuation négative marquée par οὐδέ et conserve le pronom singulier σοῦ.
theological_decisions:
- issue: Référent des «branches naturelles» dans l’image de l’olivier
  choice: Conserver la métaphore sans identifier explicitement les branches dans le texte principal.
  alternative: Traduire en explicitant qu’il s’agit d’Israël selon la chair.
  rationale: Le contexte indique le référent, mais le grec conserve ici la formulation métaphorique; la traduction ne doit pas remplacer l’image par son interprétation.
- issue: Portée de l’avertissement adressé à «toi»
  choice: Formuler directement l’avertissement au singulier sans ajout doctrinal.
  alternative: Préciser s’il s’agit d’un individu, d’un groupe, ou interpréter l’avertissement selon un système sotériologique particulier.
  rationale: Le grec emploie le singulier σοῦ et énonce un véritable avertissement, sans trancher à lui seul les débats doctrinaux plus larges.
translation_notes:
  register: Français international moderne, sobre et digne. «Car si» maintient l’argumentation; «il ne t’épargnera pas non plus» est plus idiomatique en français que le calque «ni ne t’épargnera-t-il».
