  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: fr
  text: « Seigneur, ils ont tué tes prophètes, ils ont démoli tes autels ; et moi seul, je suis resté, et ils cherchent à m’ôter la vie[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « ils cherchent mon âme » ; ici, cette expression grecque signifie qu’ils cherchent à m’ôter la vie.'
    reason: Préciser le sens idiomatique de ψυχή tout en signalant sa formulation littérale.
lexical_decisions:
- source_word: Κύριε
  choice: Seigneur
  rationale: Vocatif de κύριος adressé directement à Dieu ; « Seigneur » est la formulation française naturelle et consacrée dans ce contexte néotestamentaire.
- source_word: ἀπέκτειναν
  choice: ont tué
  rationale: Le verbe signifie mettre à mort ou tuer. « Ont tué » reste direct et n’ajoute pas la nuance juridique ou morale que pourraient introduire « ont exécuté » ou « ont assassiné ».
- source_word: τὰ θυσιαστήριά σου
  choice: tes autels
  rationale: θυσιαστήριον désigne un autel, particulièrement un autel sacrificiel. En français, « autels » suffit dans ce contexte sans alourdir le texte.
- source_word: κατέσκαψαν
  choice: ont démoli
  rationale: Le verbe évoque l’action de raser ou d’abattre une construction. « Ont démoli » exprime concrètement la destruction des autels en français courant.
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: moi seul, je suis resté
  rationale: Cette formulation conserve le sens passif résultatif et surtout l’insistance de μόνος sur le fait qu’Élie se considère comme l’unique survivant, plutôt qu’une simple solitude affective.
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: ils cherchent à prendre ma vie
  rationale: Dans cette formule de menace, ψυχή désigne la vie de la personne. « Cherchent à prendre ma vie » demeure proche de l’image grecque tout en indiquant clairement qu’ils veulent le tuer.
theological_decisions:
- issue: Sens de ψυχή dans une formule exprimant une menace de mort
  choice: ma vie
  alternative: mon âme
  rationale: Le contexte concerne une tentative de mise à mort, non une affirmation sur la nature immatérielle de l’être humain. « Ma vie » restitue donc le sens contextuel sans importer une question d’anthropologie théologique étrangère au passage.
translation_notes:
  register: Français international moderne, direct et digne. La ponctuation distingue les trois accusations tout en conservant leur enchaînement. Le redoublement « moi seul, je » est idiomatique en français et maintient l’accent porté par μόνος.
