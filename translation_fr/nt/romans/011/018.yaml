id: ROM.11.18
reference: Romans 11:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: fr
  text: ne te vante pas aux dépens des branches[a]. Mais si tu te vantes, ce n’est pas toi qui portes la racine, c’est la racine qui te porte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne te vante pas contre les branches ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce n’est pas toi qui soutiens la racine, c’est la racine qui te soutient ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: te vante pas aux dépens de / si tu te vantes
  rationale: Le verbe exprime le fait de se glorifier avec une attitude de supériorité envers quelqu’un. « Aux dépens de » restitue naturellement la nuance relationnelle de κατά en français moderne; la seconde occurrence conserve la structure conditionnelle.
- source_word: κλάδων
  choice: des branches
  rationale: L’article grec désigne les branches précises de la métaphore de l’olivier développée dans le contexte.
- source_word: ῥίζαν / ῥίζα
  choice: la racine
  rationale: Le même terme est conservé aux deux occurrences afin de maintenir avec netteté la métaphore et le contraste.
- source_word: βαστάζεις
  choice: portes
  rationale: « Porter » reste proche de l’image physique de l’arbre tout en pouvant exprimer le soutien et l’entretien dont dépend le rameau.
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: ce n’est pas toi qui portes la racine, c’est la racine qui te porte
  rationale: Cette tournure française préserve l’opposition emphatique entre « toi » et « la racine », ainsi que le renversement de la relation de dépendance.
- source_word: μὴ
  choice: ne te vante pas
  rationale: Cette interdiction directe est naturelle en français et n’impose pas au présent grec une valeur aspectuelle plus précise que le contexte.
theological_decisions:
- issue: Portée métaphorique de la racine et des branches dans l’image paulinienne de l’olivier
  choice: Conserver la métaphore sans identifier explicitement la racine ni les branches dans le texte principal.
  alternative: Identifier la racine comme les patriarches, Abraham ou les promesses de l’alliance.
  rationale: Le grec énonce la métaphore sans en préciser ici les référents. Une identification explicite transformerait une interprétation contextuelle en contenu traduit et réduirait l’ouverture théologique du passage.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète les formes grecques de deuxième personne du singulier, qui s’adressent au rameau pris individuellement. La répétition de « racine » et de « porte » maintient la force rhétorique et l’unité de l’image.
