  source_fidelity: Le futur dialogué (« Tu diras donc »), le passif, la proposition introduite par ἵνα et l’emphase de ἐγώ sont bien rendus. Toutefois, « arrachées » évoque plutôt l’action de tirer ou d’extirper que celle de rompre/détacher des branches exprimée par ἐξεκλάσθησαν. « Retranchées » rend mieux, dans la métaphore de l’olivier, la séparation des branches sans préciser indûment le procédé.
  naturalness: La formulation est claire et d’un registre moderne. « Pour que moi, je sois greffé » est grammatical et restitue naturellement l’emphase du pronom explicite.
  terminology: « Greffé » est le terme horticole approprié pour ἐγκεντρισθῶ. « Retranchées » est ici préférable à « arrachées » pour les branches séparées de l’olivier.
