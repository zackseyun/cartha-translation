    issue: « ont été arrachées » pour ἐξεκλάσθησαν
    rationale: Le verbe grec signifie que les branches ont été rompues ou détachées. « Arrachées » suggère plus spécifiquement qu’elles ont été tirées hors de l’arbre; cette nuance n’est pas exprimée par le grec.
