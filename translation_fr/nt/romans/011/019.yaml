  variant: modern international French
source:
  edition: SBLGNT
  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: fr
  text: 'Tu diras donc : « Des branches ont été retranchées pour que moi, je sois greffé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: Tu diras
  rationale: Futur actif de λέγω, à la deuxième personne du singulier. Le futur est conservé dans le cadre du dialogue argumentatif où Paul s’adresse à un interlocuteur imaginé.
- source_word: οὖν
  choice: donc
  rationale: Connecteur inférentiel qui marque la progression logique de l’argument. « Donc » est naturel et précis en français moderne.
- source_word: Ἐξεκλάσθησαν
  choice: ont été arrachées
  rationale: Aoriste passif de ἐκκλάω. Dans l’image de l’olivier, « arrachées » exprime qu’on a détaché des branches de l’arbre et préserve mieux l’image horticole que l’expression abstraite « retranchées ».
- source_word: κλάδοι
  choice: Des branches
  rationale: Rendu littéral et courant du nom dans la métaphore de l’olivier.
- source_word: ἵνα
  choice: pour que
  rationale: Introduit ici le but présenté par l’interlocuteur. « Pour que » conserve cette relation sans déterminer si Paul approuve son raisonnement.
- source_word: ἐγὼ
  choice: moi, je
  rationale: Le pronom grec est explicite et emphatique. La dislocation « moi, je » restitue naturellement cette insistance en français.
- source_word: ἐγκεντρισθῶ
  choice: je sois greffé
  rationale: Aoriste passif subjonctif de ἐγκεντρίζω. « Être greffé » est le terme horticole naturel; aucun complément absent du verset, tel que « à leur place » ou « parmi elles », n’est ajouté.
theological_decisions:
- issue: Rendre explicite ou non le caractère imaginaire de l’interlocuteur
  choice: 'Conserver l’adresse directe au singulier : « Tu diras donc »'
  alternative: « Quelqu’un dira donc » ou « Tu pourrais donc dire »
  rationale: Le style dialogué ressort du contexte, mais le grec dit directement « tu diras ». La traduction n’ajoute donc pas d’explication interprétative.
- issue: Présenter la proposition finale comme une affirmation théologique approuvée par Paul
  choice: 'Rendre simplement la parole rapportée : « pour que moi, je sois greffé »'
  alternative: Reformuler en explicitant une intention divine ou en atténuant le rapport de but
  rationale: Le verset formule l’inférence de l’interlocuteur. La traduction préserve sa portée et sa tension sans indiquer prématurément que Paul l’approuve ou la désapprouve.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde le futur de la diatribe, l’image de l’olivier et l’emphase du pronom ἐγώ, sans ajout doctrinal ni contextualisation étrangère au verset.
