lexical_decisions:
- source_word: σύντριμμα
  choice: ruine
  rationale: « Ruine » exprime naturellement en français le résultat d’un brisement ou d’une dévastation, tout en gardant la formulation concise du grec.
- source_word: ταλαιπωρία
  choice: détresse
  rationale: « Détresse » rend une souffrance accablante dans un français moderne et digne; « misère » reste une autre possibilité valable.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: jalonnent leurs chemins
  rationale: Cette formulation française naturelle conserve l’image concrète des chemins et indique que ruine et détresse caractérisent le parcours de ces personnes. Plus littéralement, le grec dit « sont sur leurs chemins ».
- source_word: καὶ
  choice: et
  rationale: Conjonction française habituelle reliant les deux noms coordonnés.
