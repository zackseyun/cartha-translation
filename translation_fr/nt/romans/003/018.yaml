  text: There is no fear of God before their eyes[a][b].
translation:
  language: fr
  text: Il n’y a aucune crainte de Dieu devant leurs yeux[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ils n’éprouvent aucun respect pour Dieu ».
