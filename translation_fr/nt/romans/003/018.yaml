lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: Il n’y a aucune
  rationale: Cette tournure existentielle est naturelle en français et rend avec force la négation grecque.
- source_word: φόβος
  choice: crainte
  rationale: « Crainte » conserve le sens premier du grec et l’expression biblique, tout en pouvant évoquer, dans ce contexte, le respect mêlé de révérence dû à Dieu.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le complément « de Dieu » rend directement le génitif grec sans préciser davantage la nuance relationnelle.
- source_word: ἀπέναντι
  choice: devant
  rationale: « Devant » préserve la métaphore spatiale du texte source et s’intègre naturellement à l’expression française.
- source_word: τῶν ὀφθαλμῶν αὐτῶν
  choice: leurs yeux
  rationale: Ce choix garde l’image concrète des yeux et sa portée morale liée à la perception et à l’orientation intérieure.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. La formulation conserve l’image biblique « devant leurs yeux » ainsi que le terme traditionnel « crainte », sans réduire celui-ci à la seule peur ni le remplacer silencieusement par une interprétation.
