id: ROM.3.29
reference: Romans 3:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: fr
  text: Ou bien Dieu est-il le Dieu des Juifs seulement ? N’est-il pas aussi celui des non-Juifs ? Oui, il est aussi celui des non-Juifs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des nations », traduction plus littérale de ἐθνῶν.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Introduit une nouvelle possibilité rhétorique dans l’argument de Paul ; « Ou bien » rend clairement l’enchaînement en français naturel.
- source_word: Ἰουδαίων
  choice: des Juifs
  rationale: Le génitif dépend de θεός et se rend idiomatiquement par « le Dieu des Juifs ».
- source_word: ὁ θεὸς
  choice: Dieu / le Dieu
  rationale: « Dieu » est l’équivalent français courant de θεός ; dans la construction possessive, le français demande naturellement « le Dieu des Juifs ».
- source_word: μόνον
  choice: seulement
  rationale: Exprime directement l’exclusivité mise en cause par la question rhétorique.
- source_word: οὐχὶ καὶ
  choice: N’est-il pas aussi
  rationale: οὐχί introduit une question qui appelle une réponse affirmative, tandis que καί inclut les non-Juifs aux côtés des Juifs.
- source_word: ἐθνῶν
  choice: des non-Juifs
  rationale: Dans le contraste explicite avec Ἰουδαίων, le terme désigne les peuples autres que le peuple juif. « Non-Juifs » est actuel, clair et moins chargé historiquement que « païens ».
- source_word: ναὶ
  choice: Oui
  rationale: Réponse affirmative concise qui conserve la forme dialoguée et la force rhétorique du grec.
- source_word: καὶ ἐθνῶν
  choice: aussi celui des non-Juifs
  rationale: Le français explicite naturellement l’ellipse grecque tout en conservant l’inclusion exprimée par καί.
theological_decisions:
- issue: Sens de ἐθνῶν dans le contraste entre Juifs et autres peuples
  choice: non-Juifs
  alternative: nations
  rationale: Le contexte oppose les Juifs à tous ceux qui ne sont pas juifs, plutôt qu’à des États ou nations au sens géopolitique. La note conserve toutefois la possibilité d’une traduction plus littérale.
- issue: Explicitation de l’ellipse dans ναὶ καὶ ἐθνῶν
  choice: Oui, il est aussi celui des non-Juifs
  alternative: Oui, aussi des non-Juifs
  rationale: 'L’explicitation rend la phrase idiomatique et immédiatement compréhensible sans ajouter de contenu théologique : elle reprend simplement « Dieu » comme référent sous-entendu.'
translation_notes:
  register: Français international moderne, digne et accessible. Les questions rhétoriques et leur réponse affirmative sont préservées. « Non-Juifs » évite l’ambiguïté géopolitique de « nations » et les connotations possibles de « païens ».
