id: ROM.3.8
reference: Romans 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: fr
  text: 'Et pourquoi ne pas dire — comme on nous calomnie et comme certains prétendent que nous le disons — : « Faisons le mal pour qu’il en sorte du bien » ? Leur condamnation est juste.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom grec traduit par « leur » renvoie vraisemblablement à ceux qui diffusent cette accusation ; le texte principal conserve cette référence sans la préciser davantage.
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: on nous calomnie
  rationale: Dans ce contexte, le verbe désigne la présentation mensongère et hostile de l’enseignement de Paul, non un blasphème directement dirigé contre Dieu.
- source_word: φασίν τινες
  choice: certains prétendent
  rationale: Cette formulation naturelle rend l’idée d’une affirmation rapportée tout en conservant la nuance accusatrice du contexte.
- source_word: λέγειν
  choice: que nous le disons
  rationale: Le verbe « dire » traduit directement l’infinitif sans introduire l’idée plus interprétative d’un enseignement formel.
- source_word: Ποιήσωμεν
  choice: Faisons
  rationale: Le subjonctif aoriste à la première personne du pluriel a ici une valeur exhortative, rendue naturellement par l’impératif français.
- source_word: τὰ κακὰ
  choice: le mal
  rationale: L’adjectif substantivé au pluriel est rendu idiomatiquement par le nom collectif français « le mal ».
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: pour qu’il en sorte du bien
  rationale: Cette expression française naturelle conserve la relation de finalité ou de résultat portée par ἵνα et fait ressortir le contraste entre le mal et le bien.
- source_word: κρίμα
  choice: condamnation
  rationale: Le terme désigne ici un jugement défavorable; « condamnation » en exprime clairement la portée judiciaire.
- source_word: ἔνδικόν
  choice: juste
  rationale: « Juste » préserve à la fois la dimension judiciaire et la légitimité morale du verdict.
- source_word: καὶ μὴ
  choice: Et pourquoi ne pas dire
  rationale: Le grec est elliptique et prolonge la question du verset précédent. Cette formulation explicite sobrement le sens implicite nécessaire en français.
theological_decisions:
- issue: Référent de ὧν dans « leur condamnation »
  choice: Le pronom est conservé dans le texte, avec une note indiquant son référent contextuel probable.
  alternative: Rapporter explicitement la condamnation au raisonnement lui-même ou à ceux qui feraient effectivement le mal.
  rationale: Le relatif pluriel ὧν renvoie grammaticalement le plus naturellement aux personnes mentionnées, mais le texte principal ne doit pas développer davantage que le grec.
translation_notes:
  register: Français international moderne, naturel et digne. Les incises rendent la syntaxe accusatrice du grec sans l’alourdir. Le contraste proverbial entre « le mal » et « du bien » reste immédiatement compréhensible.
