revisions:
- from: 'Certainement pas ! Que Dieu soit reconnu comme véridique, même si tout être humain se révèle menteur, comme il est écrit : « Ainsi, tu seras reconnu juste[a] dans tes paroles et tu l’emporteras lorsqu’on te jugera[b]. »'
  to: 'Certainement pas ! Que Dieu soit véridique et tout être humain menteur, comme il est écrit : « Afin que tu sois reconnu juste[a] dans tes paroles et que tu l’emportes quand on te juge[b]. »'
  rationale: La révision retire la concession et les explicitations ajoutées afin de conserver l’antithèse concise du grec. Elle rend ὅπως ἂν par « afin que », tout en gardant le sens judiciaire de δικαιωθῇς et la lecture passive la plus naturelle de κρίνεσθαι. Les notes maintiennent les alternatives pertinentes et leurs ancres.
