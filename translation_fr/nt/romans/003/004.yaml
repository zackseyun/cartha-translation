id: ROM.3.4
reference: Romans 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: fr
  text: 'Certainement pas ! Que Dieu soit véridique et tout être humain menteur, comme il est écrit : « Afin que tu sois reconnu juste[a] dans tes paroles et que tu l’emportes quand on te juge[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu sois justifié » ou « il soit montré que tu es dans ton droit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « quand tu juges » ; cette formulation reflète plus directement l’hébreu du Psaume 51.6, tandis que le grec de Romains se lit naturellement « quand on te juge ».
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Certainement pas !
  rationale: Rend avec naturel et vigueur le rejet catégorique exprimé par cette formule idiomatique, sans l’affaiblir en une simple négation.
- source_word: γινέσθω δὲ ὁ θεὸς ἀληθής
  choice: Que Dieu soit reconnu comme véridique
  rationale: Conserve la force injonctive de γινέσθω et exprime ici que la véracité de Dieu doit être tenue pour établie, plutôt que de suggérer que Dieu deviendrait véridique.
- source_word: πᾶς δὲ ἄνθρωπος ψεύστης
  choice: même si tout être humain se révèle menteur
  rationale: Rend ἄνθρωπος de manière générique et inclusive. « Se révèle » fait ressortir l’opposition entre la véracité constante de Dieu et la fausseté humaine, tandis que « même si » communique naturellement la portée argumentative de l’antithèse.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture.
- source_word: δικαιωθῇς
  choice: tu seras reconnu juste
  rationale: 'Dans cette parole adressée à Dieu, le passif a un sens déclaratif et judiciaire : Dieu est manifesté comme étant dans son droit, non rendu moralement juste.'
- source_word: ἐν τοῖς λόγοις σου
  choice: dans tes paroles
  rationale: Équivalent direct qui garde le pluriel et convient au contexte de la citation du psaume.
- source_word: νικήσεις
  choice: tu l’emporteras
  rationale: Exprime l’idée de victoire dans un contexte judiciaire sans introduire une image excessivement militaire.
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: lorsqu’on te jugera
  rationale: Rend naturellement en français la lecture passive la plus immédiate de l’infinitif grec κρίνεσθαι, avec Dieu comme objet du jugement.
theological_decisions:
- issue: Sens de δικαιωθῇς appliqué à Dieu
  choice: tu seras reconnu juste
  alternative: tu seras justifié
  rationale: Le passage ne laisse pas entendre que Dieu acquiert la justice, mais que ses paroles démontrent qu’il est juste et dans son droit. La formulation retenue explicite ce sens judiciaire sans supprimer l’alternative plus formelle.
- issue: Voix de κρίνεσθαι dans la citation du Psaume 51.6 (LXX 50.6)
  choice: lorsqu’on te jugera
  alternative: lorsque tu jugeras
  rationale: Le grec de Romains se lit le plus naturellement au passif. La formulation active reflète plus directement le texte hébreu du psaume et mérite donc d’être signalée sans remplacer la lecture grecque dans le corps du texte.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le contraste est formulé avec vigueur, et la citation conserve son registre judiciaire. « Être humain » évite de donner à ἄνθρωπος un sens exclusivement masculin.
