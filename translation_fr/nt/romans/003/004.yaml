  timestamp: '2026-07-14T11:18:09Z'
review_pass:
  verdict: revise
  source_fidelity: La formulation concessive « même si » n’est pas exprimée par le grec, où δέ pose une antithèse. Dans la citation, ὅπως ἂν introduit un but (« afin que ») ; « Ainsi, tu seras » atténue ce lien. La lecture passive de κρίνεσθαι (« quand on te juge ») est bien rendue.
  naturalness: Le français est globalement naturel et le registre est approprié. « Que Dieu soit véridique et tout être humain menteur » est concis, moderne et conserve mieux le parallélisme de l’original que « soit reconnu comme » / « se révèle ».
  terminology: « Véridique », « menteur », « reconnu juste », « paroles » et « l’emportes » conviennent au contraste et au cadre judiciaire. La note sur l’alternative active est utile et doit rester ancrée à « te juge ».
  issues:
  - severity: medium
    issue: Ajout de la concession « même si »
    rationale: δέ marque ici le contraste (« mais/et »), non une concession. « Même si » introduit une relation argumentative qui n’est pas dans le texte grec.
  - severity: medium
    issue: « Ainsi, tu seras reconnu juste » ne rend pas explicitement la construction de but ὅπως ἂν
    rationale: La citation présente « afin que tu sois reconnu juste », puis l’issue judiciaire. Employer « afin que » et le subjonctif restitue plus fidèlement la syntaxe et le lien logique.
  - severity: low
    issue: « reconnu comme véridique » et « se révèle menteur » explicitent des notions de reconnaissance ou de manifestation absentes du texte
    rationale: Ces verbes sont interprétatifs. Le parallélisme direct « Dieu soit véridique, tout être humain menteur » est à la fois plus proche de l’original et naturel en français biblique moderne.
