id: ROM.3.27
reference: Romans 3:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: fr
  text: Où donc est le sujet de se vanter ? Il a été exclu. Par quelle loi ? Celle des œuvres ? Non, mais par la loi de la foi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ καύχησις
  choice: la raison de se vanter
  rationale: Dans ce contexte, le nom désigne le motif ou la possibilité de tirer gloire de soi. Cette formulation est naturelle en français et conserve la force de la question.
- source_word: ἐξεκλείσθη
  choice: elle est exclue
  rationale: Le passif aoriste est rendu directement, sans préciser un agent que le grec ne nomme pas.
- source_word: διὰ ποίου νόμου
  choice: par quelle loi
  rationale: Avec le génitif, διά exprime ici le moyen. « Par » est idiomatique et maintient le jeu rhétorique sur νόμος.
- source_word: τῶν ἔργων
  choice: celle des œuvres
  rationale: L'ellipse grecque est explicitée minimalement en reprenant « loi » par le pronom « celle », tout en conservant le contraste entre œuvres et foi.
- source_word: διὰ νόμου πίστεως
  choice: par la loi de la foi
  rationale: La traduction garde volontairement l'expression paradoxale « loi de la foi » et ne réduit pas νόμος à un simple « principe ».
theological_decisions:
- issue: Sens de νόμος dans « loi de la foi »
  choice: Conserver « loi »
  alternative: « principe de la foi »
  rationale: Le même terme grec structure les deux membres du contraste. Le traduire de la même manière préserve la tension et le jeu verbal de Paul sans imposer une interprétation.
- issue: Portée du génitif πίστεως
  choice: « de la foi »
  alternative: « qui exige la foi » ou « fondée sur la fidélité »
  rationale: Le génitif grec reste ouvert quant à sa relation exacte avec « loi » ; la formulation française conserve cette ambiguïté.
translation_notes:
  register: Français moderne, clair et digne. Le rythme interrogatif serré du grec est conservé. « La raison de se vanter » évite le caractère plus littéraire de « vantardise » tout en exprimant ici l'idée d'un motif de fierté personnelle.
