source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: fr
  text: Quoi donc ? Sommes-nous supérieurs ? Pas du tout[a] ! En effet, nous avons déjà accusé aussi bien les Juifs que les Grecs d’être tous sous le pouvoir du péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Avons-nous un avantage ? »'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « sous le péché ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Quoi donc ?
  rationale: Formulation concise qui conserve la transition logique οὖν et le style argumentatif de Paul sans ajouter d’éléments absents du grec.
- source_word: προεχόμεθα
  choice: Sommes-nous supérieurs ?
  rationale: Le moyen est discuté. Dans ce contexte, la question porte vraisemblablement sur une éventuelle supériorité des Juifs. Cette formulation française est naturelle et préserve la comparaison, tandis que l’idée d’un avantage est signalée en note.
- source_word: οὐ πάντως
  choice: Pas du tout !
  rationale: Cette réponse exprime clairement la forte négation du texte grec dans un français moderne et direct.
- source_word: προῃτιασάμεθα
  choice: nous avons déjà accusé
  rationale: Le verbe désigne l’action d’avoir formulé auparavant une accusation. « Accusé » conserve la tonalité judiciaire de l’argumentation tout en restant courant.
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: aussi bien les Juifs que les Grecs
  rationale: Cette tournure restitue naturellement la construction corrélative τε καὶ et garde « Grecs », terme explicite du texte source.
- source_word: πάντας
  choice: tous
  rationale: Le mot souligne que les membres des deux groupes sont concernés sans exception.
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: être tous sous l’emprise du péché
  rationale: « Sous l’emprise du péché » rend explicitement l’idée de sujétion portée par ὑπό avec l’accusatif. La formulation plus littérale « sous le péché » est conservée en note afin de préserver la métaphore condensée de Paul.
theological_decisions:
- issue: Sens de la première personne du pluriel dans προεχόμεθα
  choice: 'La question est comprise comme portant sur une supériorité comparative : « Sommes-nous supérieurs ? »'
  alternative: « Avons-nous un avantage ? »
  rationale: Le contexte de Romains 3.1-9 traite à la fois du privilège juif et de la responsabilité devant Dieu. Le texte principal exprime le refus d’une supériorité morale, mais la possibilité lexicale d’une question sur l’avantage demeure explicitement ouverte dans la note.
- issue: Portée de ὑφ’ ἁμαρτίαν
  choice: « sous l’emprise du péché »
  alternative: « sous le péché »
  rationale: Le choix principal rend intelligible la relation de domination ou de sujétion sans transformer le péché en simple faute individuelle. La note conserve néanmoins la formulation grecque plus compacte et sa tension métaphorique.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme interrogatif de l’argumentation paulinienne est conservé. « Aussi bien… que… » évite une coordination lourde, et les deux notes maintiennent les ambiguïtés réelles du grec sans les résoudre silencieusement.
