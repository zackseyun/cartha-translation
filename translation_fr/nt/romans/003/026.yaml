source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: fr
  text: dans la patience de Dieu, en vue de manifester sa justice en ce temps présent, afin qu’il soit juste et qu’il déclare juste celui qui a foi en Jésus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui est de la foi (ou de la fidélité) de Jésus ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνοχῇ
  choice: patience
  rationale: « Patience » exprime ici le fait que Dieu retient son jugement au lieu de l’exécuter immédiatement. La tournure garde aussi le lien syntaxique avec le contexte précédent.
- source_word: ἔνδειξιν
  choice: manifester
  rationale: Le nom grec désigne une démonstration ou une mise en évidence. La forme verbale « manifester » est naturelle en français dans la construction « en vue de ».
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » est le terme français naturel qui couvre ici à la fois la rectitude de Dieu et la dimension judiciaire de l’argument.
- source_word: νῦν καιρῷ
  choice: dans le temps présent
  rationale: Cette expression idiomatique conserve l’accent temporel de νῦν et de καιρός.
- source_word: δίκαιον
  choice: juste
  rationale: « Juste » convient au cadre judiciaire et maintient le lien lexical avec l’action de déclarer juste.
- source_word: δικαιοῦντα
  choice: déclarer juste
  rationale: Cette formulation rend clairement la valeur judiciaire du participe sans employer seul le verbe français « justifier », qui peut évoquer le fait de fournir des excuses.
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: celui qui met sa foi en Jésus
  rationale: Le texte principal adopte la lecture objective courante du génitif et l’exprime dans un français naturel. La lecture selon laquelle πίστις désigne la fidélité de Jésus est conservée en note.
theological_decisions:
- issue: Sens de ἐκ πίστεως Ἰησοῦ
  choice: celui qui met sa foi en Jésus
  alternative: celui qui relève de la fidélité de Jésus
  rationale: La construction au génitif permet réellement les deux lectures. Le texte principal retient la compréhension objective la plus immédiatement intelligible, tandis que la note préserve la possibilité que l’expression renvoie à la fidélité de Jésus.
translation_notes:
  register: Français international moderne, sobre et digne. Le début en minuscule et la tournure « dans la patience de Dieu » conservent le caractère syntaxiquement continu de l’extrait, qui se rattache à la proposition précédente.
