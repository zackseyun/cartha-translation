    text: 'Ou : « celui qui est de la foi (ou de la fidélité) de Jésus ».'
    reason: alternative_reading
  revision_rationale: La révision explicite le sujet divin de la proposition finale, améliore l’idiome temporel et remplace la note par une formulation qui signale de manière plus fidèle la lecture alternative du génitif, sans décider entre foi en Jésus et foi/fidélité de Jésus.
