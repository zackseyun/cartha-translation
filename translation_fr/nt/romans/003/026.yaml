revisions:
- from: dans la patience de Dieu, en vue de manifester sa justice dans le temps présent, afin d’être juste et de déclarer juste celui qui met sa foi en Jésus.[a]
  to: dans la patience de Dieu, en vue de manifester sa justice en ce temps présent, afin qu’il soit juste et qu’il déclare juste celui qui a foi en Jésus.[a]
  rationale: La révision explicite le sujet divin de la proposition finale, améliore l’idiome temporel et remplace la note par une formulation qui signale de manière plus fidèle la lecture alternative du génitif, sans décider entre foi en Jésus et foi/fidélité de Jésus.
  reviewer_model: gpt-5.6-terra
