  text: et ils n’ont pas connu le chemin de la paix[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la voie de la paix ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: La conjonction simple conserve l’enchaînement cumulatif des accusations dans la série de citations de Paul.
- source_word: ὁδὸν
  choice: le chemin
  rationale: « Chemin » rend naturellement l’image concrète d’une voie tout en gardant le sens figuré d’une manière de vivre ou d’agir.
- source_word: εἰρήνης
  choice: de la paix
  rationale: « Paix » est l’équivalent français direct et clair; le complément caractérise le chemin comme celui qui mène à la paix ou qui est marqué par elle, sans trancher entre ces nuances.
- source_word: οὐκ ἔγνωσαν
  choice: ils n’ont pas connu
  rationale: Le passé composé rend naturellement l’aoriste dans ce constat général et conserve l’idée qu’ils n’ont ni reconnu ni expérimenté cette voie.
