id: ROM.3.5
reference: Romans 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: fr
  text: Mais si notre injustice met en évidence la justice de Dieu[a], que dirons-nous ? Dieu est-il injuste lorsqu’il déchaîne sa colère ? (Je parle d’un point de vue humain.)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre injustice manifeste la justice de Dieu ».
    reason: Alternative lexicale pour συνίστησιν, tout en conservant l’ambiguïté de « la justice de Dieu ».
lexical_decisions:
- source_word: ἀδικία
  choice: injustice
  rationale: « Injustice » exprime naturellement en français la conduite contraire à ce qui est juste et maintient le contraste lexical avec la justice de Dieu.
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Justice » est le correspondant français naturel dans ce contraste avec ἀδικία. Le français réunit ici les nuances de rectitude morale et de justice, sans obliger à choisir artificiellement entre elles.
- source_word: συνίστησιν
  choice: met en évidence
  rationale: Cette expression rend l’idée que l’injustice humaine fait ressortir ou manifeste la justice de Dieu, sans suggérer qu’elle la crée.
- source_word: μὴ ἄδικος
  choice: Dieu est-il injuste
  rationale: La question directe conserve l’objection rhétorique de Paul. La particule μή laisse attendre une réponse négative, mais cette attente n’est pas développée dans la traduction.
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: lorsqu’il fait tomber sa colère
  rationale: Formulation française naturelle qui conserve l’action de faire venir la colère comme jugement. Le possessif explicite naturellement que la colère mentionnée est celle de Dieu.
- source_word: κατὰ ἄνθρωπον λέγω
  choice: Je parle d’un point de vue humain
  rationale: 'Cette formulation claire et actuelle rend l’avertissement de Paul : il formule l’objection selon une manière humaine de voir.'
theological_decisions:
- issue: La question rhétorique concernant la justice de Dieu dans le jugement
  choice: « Dieu est-il injuste lorsqu’il fait tomber sa colère ? »
  alternative: « Dieu ne serait tout de même pas injuste lorsqu’il fait tomber sa colère ? »
  rationale: La question simple préserve toute la force de l’objection et reste proche de la formulation grecque. Elle n’explicite pas excessivement la réponse négative attendue par μή.
- issue: La portée de δικαιοσύνη θεοῦ
  choice: « la justice de Dieu »
  alternative: « le fait que Dieu est juste »
  rationale: Le groupe nominal préserve l’ambiguïté entre la qualité de Dieu, son action juste et la manifestation de sa justice, au lieu de la réduire à une seule explication.
translation_notes:
  register: Français international moderne, digne et accessible. Le contraste « injustice / justice » reprend la structure du grec. La parenthèse est conservée, ainsi que la tension de la question rhétorique.
