id: ROM.3.20
reference: Romans 3:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: fr
  text: Car personne ne sera déclaré juste devant lui par les œuvres de la Loi, puisque c’est par la Loi que vient la connaissance du péché.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: par les œuvres de la Loi
  rationale: Rend l’expression grecque de façon directe et naturelle. La majuscule à « Loi » indique ici la Loi dans son sens biblique, sans préciser davantage ce que le contexte laisse ouvert.
- source_word: οὐ δικαιωθήσεται
  choice: ne sera déclaré juste
  rationale: Exprime la valeur judiciaire du passif de δικαιόω sans réduire le terme à une simple innocence morale.
- source_word: πᾶσα σὰρξ
  choice: personne
  rationale: Littéralement « toute chair » dans une proposition négative; l’expression idiomatique désigne ici aucun être humain. « Personne » communique clairement ce sens en français moderne.
- source_word: ἐνώπιον αὐτοῦ
  choice: devant lui
  rationale: Conserve l’image judiciaire et relationnelle du grec; le référent divin du pronom ressort du contexte.
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: la connaissance du péché
  rationale: Traduction formellement proche qui préserve l’idée d’une prise de conscience ou reconnaissance du péché sans en préciser artificiellement le mécanisme.
theological_decisions:
- issue: Sens de la justification
  choice: déclaré juste
  alternative: rendu juste / justifié
  rationale: « Déclaré juste » rend clairement la dimension de verdict portée par le contexte. Cette formulation n’exclut pas les autres dimensions de l’œuvre divine, mais ne les introduit pas dans ce verset.
- issue: Portée de « œuvres de la Loi »
  choice: les œuvres de la Loi
  alternative: la pratique de ce qu’ordonne la Loi
  rationale: La formulation concise préserve l’expression paulinienne et son éventuelle portée débattue, sans la limiter aux seules pratiques identitaires ni l’étendre explicitement à toute œuvre humaine.
- issue: Relation entre la Loi et la connaissance du péché
  choice: puisque c’est par la Loi que vient la connaissance du péché
  alternative: car la Loi donne seulement la connaissance du péché
  rationale: Le texte affirme la fonction révélatrice de la Loi, mais ne contient pas « seulement »; cet ajout théologique est donc évité.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de l’argument grec tout en évitant le calque peu idiomatique « aucune chair ». « Car » relie le verset à l’argument précédent, et « puisque » rend le second γάρ comme justification de l’affirmation principale.
