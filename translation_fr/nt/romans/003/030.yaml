source:
  edition: SBLGNT
  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: fr
  text: puisque Dieu est un[a], qui justifiera les circoncis et les non-circoncis[b], les premiers par la foi et les seconds au moyen de la foi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si vraiment Dieu est un » — ou « s’il est vrai que Dieu est un ».'
    reason: alternative_reading
  - marker: b
    text: Le grec dit littéralement « la circoncision » et « l’incirconcision », pour désigner les circoncis et les non-circoncis.
    reason: cultural_note
  - marker: c
    text: Paul emploie deux expressions différentes, rendues ici par « par la foi » et « au moyen de la foi » ; cette variation est peut-être stylistique plutôt que l’expression d’un contraste net.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: puisque
  rationale: Dans le raisonnement, Paul s’appuie sur la conviction monothéiste partagée plutôt qu’il n’exprime une incertitude. La valeur conditionnelle possible est néanmoins signalée en note.
- source_word: εἷς ὁ θεός
  choice: il y a un seul Dieu
  rationale: Cette formulation française naturelle conserve l’affirmation monothéiste emphatique et son rôle de fondement dans l’argument.
- source_word: δικαιώσει
  choice: justifiera
  rationale: « Justifier » est le terme paulinien précis et traditionnel pour δικαιόω; le futur grec est conservé.
- source_word: περιτομήν
  choice: les circoncis
  rationale: Le nom abstrait « circoncision » désigne ici, par métonymie, les personnes circoncises. Cette traduction évite de l’identifier explicitement aux Juifs.
- source_word: ἐκ πίστεως
  choice: par la foi
  rationale: Cette expression concise et idiomatique présente la foi comme base ou moyen, sans imposer une précision absente du contexte.
- source_word: ἀκροβυστίαν
  choice: les non-circoncis
  rationale: Le nom abstrait grec désigne ici les personnes non circoncises. « Non-circoncis » est naturel en français moderne et moins interprétatif que « non-Juifs ».
- source_word: διὰ τῆς πίστεως
  choice: au moyen de la foi
  rationale: Cette formulation distingue διά de ἐκ dans le texte français sans transformer cette variation en opposition doctrinale.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est le rendu français normal de πίστις dans ce contexte; le verset ne contient pas de construction génitive contestée qui imposerait une autre solution.
theological_decisions:
- issue: La portée de la différence entre ἐκ πίστεως et διὰ τῆς πίστεως
  choice: Conserver la variation par « par la foi » et « au moyen de la foi », sans affirmer de contraste doctrinal.
  alternative: Traduire les deux expressions de manière identique par « par la foi », ou y voir une distinction précise entre fondement et moyen.
  rationale: Le grec emploie deux prépositions différentes, mais le contexte ne permet pas d’assurer que Paul établit entre elles une distinction théologique nette.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le lien avec le verset précédent. « Non-circoncis » est préféré à « incirconcis », plus rare aujourd’hui, et à « non-Juifs », plus interprétatif.
