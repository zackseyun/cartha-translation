  variant: modern international French
source:
  edition: SBLGNT
  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: fr
  text: Tous se sont détournés ; ensemble, ils sont devenus inutiles[a]. Il n’y en a aucun qui fasse le bien[b], pas même un seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils sont devenus sans valeur » ou « ils se sont corrompus ».
    reason: lexical_alternative
  - marker: b
    text: Ou « qui pratique la bonté » ; χρηστότητα peut aussi désigner la bienveillance.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: Tous
  rationale: Conserve la portée universelle du pluriel grec sans ajouter un nom absent du texte.
- source_word: ἐξέκλιναν
  choice: se sont détournés
  rationale: Exprime naturellement l’idée d’un écart ou d’un abandon de la bonne voie, tout en gardant l’aspect accompli de l’aoriste.
- source_word: ἅμα
  choice: ensemble
  rationale: 'Rend la dimension collective : tous partagent la même condition.'
- source_word: ἠχρεώθησαν
  choice: sont devenus inutiles
  rationale: Respecte le sens résultatif du verbe grec, qui évoque ce qui ne sert plus à rien ou ne vaut plus rien, sans introduire explicitement l’idée de corruption.
- source_word: οὐκ ἔστιν ποιῶν χρηστότητα
  choice: Il n’y en a aucun qui fasse le bien
  rationale: Formulation française actuelle et naturelle qui conserve la négation absolue ainsi que la portée morale de χρηστότητα.
- source_word: ἕως ἑνός
  choice: pas même un seul
  rationale: Restitue l’expression grecque idiomatique comme une insistance finale excluant toute exception.
theological_decisions: []
