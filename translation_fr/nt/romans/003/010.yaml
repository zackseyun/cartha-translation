  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: fr
  text: 'Comme il est écrit : « Il n’y a pas de juste, pas même un seul. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: comme
  rationale: Avec « il est écrit », « comme » introduit naturellement en français une citation scripturaire et correspond directement au grec.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée pour le parfait passif grec; elle exprime un écrit dont la validité demeure.
- source_word: ὅτι
  choice: ':'
  rationale: Après la formule de citation, les deux-points introduisent plus naturellement les paroles citées en français qu’un « que » explicite.
- source_word: Οὐκ ἔστιν
  choice: Il n’y a pas
  rationale: Cette tournure existentielle française rend clairement et idiomatiquement la négation grecque.
- source_word: δίκαιος
  choice: de juste
  rationale: « Juste » conserve ici la portée morale et théologique de δίκαιος dans le raisonnement de Paul, sans explicitation doctrinale ajoutée.
- source_word: οὐδὲ εἷς
  choice: pas même un seul
  rationale: Cette formulation restitue l’insistance du grec et souligne l’universalité de l’affirmation.
theological_decisions:
- issue: Faut-il expliciter δίκαιος par « personne juste » ou conserver la formulation absolue et elliptique du grec?
  choice: Il n’y a pas de juste
  alternative: Personne n’est juste
  rationale: La formulation retenue reste proche de la structure grecque, garde sa portée générale et absolue, et évite d’ajouter un nom absent du texte.
translation_notes:
  register: Français international moderne, digne et immédiatement compréhensible. La tournure biblique « comme il est écrit » est conservée parce qu’elle demeure naturelle; aucune note n’est nécessaire pour ce verset.
