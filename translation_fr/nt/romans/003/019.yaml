  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: fr
  text: Nous savons que tout ce que la Loi dit, elle le dit à ceux qui relèvent de la Loi[a], afin que toute bouche soit réduite au silence et que le monde entier soit tenu de rendre compte à Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « à ceux qui sont dans la Loi » ; on peut aussi traduire : « à ceux qui sont sous l’autorité de la Loi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que le monde entier soit passible du jugement de Dieu » ; autre traduction possible : « soit reconnu coupable devant Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: Nous savons
  rationale: Le présent exprime un savoir partagé. Le léger lien discursif de δέ n’a pas besoin d’être explicité ici par « Or » ou « Mais », qui risqueraient de marquer un contraste excessif.
- source_word: ὁ νόμος
  choice: la Loi
  rationale: La majuscule signale en français la Loi reconnue comme autorité dans l’argument de Paul, sans préciser davantage son étendue.
- source_word: ὅσα … λέγει … λαλεῖ
  choice: tout ce que dit … elle l’adresse
  rationale: Cette formulation française naturelle conserve autant que possible la variation entre λέγει et λαλεῖ et fait ressortir les destinataires du discours de la Loi.
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: à ceux qui relèvent de la Loi
  rationale: « Relever de » exprime naturellement l’appartenance au domaine d’autorité de la Loi, tout en évitant que « dans la Loi », plus littéral, soit compris comme une localisation matérielle.
- source_word: ἵνα
  choice: afin que
  rationale: Rend clairement la valeur finale de la conjonction grecque dans un registre digne et courant.
- source_word: πᾶν στόμα φραγῇ
  choice: que toute bouche soit réduite au silence
  rationale: 'Conserve l’image concrète de la bouche tout en exprimant son effet judiciaire : aucune défense ne peut plus être avancée.'
- source_word: ὑπόδικος γένηται
  choice: se trouve tenu de rendre compte
  rationale: La tournure exprime l’entrée dans une situation d’obligation judiciaire envers Dieu sans transformer explicitement ὑπόδικος en verdict de culpabilité déjà prononcé.
- source_word: πᾶς ὁ κόσμος
  choice: le monde entier
  rationale: Préserve la portée universelle de l’expression grecque.
- source_word: τῷ θεῷ
  choice: à Dieu
  rationale: Avec « rendre compte », le complément indirect français traduit naturellement le datif et désigne Dieu comme celui devant qui le monde est responsable.
theological_decisions:
- issue: Portée judiciaire de ὑπόδικος devant Dieu
  choice: tenu de rendre compte à Dieu
  alternative: reconnu coupable devant Dieu ; passible du jugement de Dieu
  rationale: Le choix retenu conserve la force juridique et la responsabilité universelle affirmées par Paul, sans imposer à l’adjectif grec le sens plus précis d’un verdict de culpabilité déjà rendu.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’image judiciaire de la bouche réduite au silence ainsi que la tension entre responsabilité, exposition au jugement et culpabilité, sans surinterpréter le terme grec.
