revisions:
- from: Nous savons que tout ce que dit la Loi, elle l’adresse à ceux qui relèvent de la Loi[a], afin que toute bouche soit réduite au silence et que le monde entier se trouve tenu de rendre compte à Dieu[b].
  to: Nous savons que tout ce que la Loi dit, elle le dit à ceux qui relèvent de la Loi[a], afin que toute bouche soit réduite au silence et que le monde entier soit tenu de rendre compte à Dieu[b].
  rationale: La révision corrige une construction française malaisée tout en préservant le parallélisme de l’original (« ce que la Loi dit » / « elle le dit à »), le registre juridique et l’ambiguïté mesurée de ὑπόδικος. Les ancres de notes restent correctement rattachées à l’expression sur les personnes relevant de la Loi et à la responsabilité du monde devant Dieu.
