  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: fr
  text: Il est grand à tous égards. D’abord, parce que les paroles de Dieu[a] leur ont été confiées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les oracles de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺ κατὰ πάντα τρόπον
  choice: À tous égards, il est grand
  rationale: 'Dans le contexte de la question sur l’avantage du Juif, πολὺ est pris comme réponse elliptique (« il est grand »), tandis que κατὰ πάντα τρόπον exprime l’étendue complète : « à tous égards ».'
- source_word: πρῶτον μὲν γὰρ
  choice: Tout d’abord, en effet
  rationale: « Tout d’abord » introduit le premier avantage mentionné, même si la suite de l’énumération n’est pas immédiate; « en effet » rend la valeur explicative de γάρ.
- source_word: ἐπιστεύθησαν
  choice: leur ont été confiées
  rationale: Le passif de πιστεύω signifie ici que quelque chose a été confié à leur garde ou responsabilité, et non qu’ils ont cru.
- source_word: τὰ λόγια τοῦ θεοῦ
  choice: les paroles de Dieu
  rationale: λόγια désigne ici des déclarations ou révélations divines. « Paroles de Dieu » reste naturel et accessible, tandis que la nuance plus technique est signalée en note.
theological_decisions:
- issue: Identité du référent de la troisième personne du pluriel dans ἐπιστεύθησαν
  choice: les paroles de Dieu leur ont été confiées
  alternative: ils ont reçu la garde des paroles de Dieu
  rationale: Le pronom « leur » reprend naturellement les Juifs mentionnés au verset précédent sans préciser davantage le groupe ni développer une doctrine particulière de sa responsabilité.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la réponse elliptique de Paul tout en la rendant intelligible en français; « oracles » est évité dans le corps du texte parce qu’il est moins courant aujourd’hui, mais conservé en note comme équivalent plus formel de λόγια.
