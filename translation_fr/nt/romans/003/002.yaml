  terminology: « Les paroles de Dieu » exprime les déclarations révélées de Dieu sans imposer une terminologie confessionnelle. « Oracles de Dieu » convient comme alternative formelle en note. Le déplacement de l’ancre la rattache directement au syntagme concerné.
