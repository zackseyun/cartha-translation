  variant: modern international French
source:
  edition: SBLGNT
  text: λογιζόμεθα ⸀γὰρ ⸂δικαιοῦσθαι πίστει⸃ ἄνθρωπον χωρὶς ἔργων νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: fr
  text: Car nous concluons qu’une personne est justifiée par la foi, sans les œuvres de la loi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est déclarée juste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: nous estimons
  rationale: Le verbe exprime ici le jugement raisonné auquel Paul aboutit. « Nous estimons » est naturel en français et conserve la nuance de conclusion réfléchie.
- source_word: γάρ
  choice: En effet
  rationale: La conjonction rattache cette affirmation à l’argument précédent en l’expliquant; « En effet » rend clairement ce lien discursif.
- source_word: δικαιοῦσθαι
  choice: est déclarée juste
  rationale: Cette formulation rend explicitement la valeur déclarative et judiciaire du passif grec, tout en conservant en note le terme théologique traditionnel « est justifiée ».
- source_word: πίστει
  choice: par la foi
  rationale: « Par la foi » est l’expression française naturelle et traditionnelle qui conserve ici la fonction instrumentale du datif.
- source_word: ἄνθρωπον
  choice: une personne
  rationale: Bien que le nom grec soit grammaticalement masculin, il désigne ici l’être humain de manière générique; « une personne » évite de suggérer un référent exclusivement masculin.
- source_word: χωρὶς
  choice: indépendamment de
  rationale: Cette expression marque nettement l’exclusion des œuvres de la loi comme fondement ou moyen de la déclaration de justice.
- source_word: ἔργων νόμου
  choice: des œuvres de la loi
  rationale: La formulation conserve l’expression paulinienne et son lien explicite avec la loi, sans la réduire à de simples bonnes actions ni préciser prématurément la portée de « loi ».
theological_decisions:
- issue: Nuance de δικαιοῦσθαι dans l’usage paulinien
  choice: est déclarée juste
  alternative: est justifiée
  rationale: Le texte principal explicite la dimension déclarative ou judiciaire du verbe, tandis que la note maintient la traduction théologique traditionnelle sans trancher davantage les débats liés à la justification.
- issue: Portée générique de ἄνθρωπον
  choice: une personne
  alternative: un être humain; un homme
  rationale: Dans ce contexte, le masculin grec a une portée représentative et générique. La traduction communique cette portée sans faire du sexe masculin un élément du sens.
- issue: Portée de ἔργων νόμου
  choice: des œuvres de la loi
  alternative: des œuvres prescrites par la loi
  rationale: La formulation littérale préserve la tension exégétique concernant la portée exacte de l’expression paulinienne et n’enferme pas le texte dans une interprétation particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la densité argumentative de Paul tout en évitant un calque maladroit. « En effet » assure une liaison naturelle avec le contexte précédent.
