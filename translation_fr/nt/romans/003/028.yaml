  naturalness: La phrase révisée est naturelle en français international moderne. « Car nous concluons » maintient le lien explicatif de γάρ, et « sans les œuvres de la loi » est une formulation claire et idiomatique pour χωρὶς ἔργων νόμου.
  terminology: « Justifiée » est le rendu français usuel et précis de δικαιοῦσθαι dans ce contexte; l’alternative explicative « est déclarée juste » est conservée en note. « Une personne » restitue correctement la valeur générique de ἄνθρωπον. « Œuvres de la loi » préserve l’expression paulinienne sans en décider la portée.
