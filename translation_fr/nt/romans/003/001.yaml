id: ROM.3.1
reference: Romans 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: fr
  text: Quel est donc l’avantage du Juif[a] ? Ou quel est le bénéfice de la circoncision[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '« Le Juif » est un singulier représentatif : il désigne ici la personne juive en général.'
    reason: cultural_note
  - marker: b
    text: 'Ou : « quel est l’avantage de la circoncision ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: Quel est donc
  rationale: Conserve la transition déductive et la forme interrogative rhétorique de Paul dans un français naturel.
- source_word: τὸ περισσὸν
  choice: l’avantage
  rationale: Dans ce contexte, le terme désigne ce qui constitue un privilège ou un avantage distinctif, sans suggérer une supériorité ethnique absolue.
- source_word: τοῦ Ἰουδαίου
  choice: du Juif
  rationale: Reproduit le singulier générique avec article employé par Paul et préserve sa formulation représentative.
- source_word: ἢ τίς
  choice: Ou quelle est
  rationale: Maintient le parallélisme des deux questions, tout en accordant naturellement l’interrogatif au nom féminin « utilité ».
- source_word: ἡ ὠφέλεια
  choice: l’utilité
  rationale: Rend l’idée d’usage profitable ou de valeur pratique et conserve une légère distinction lexicale avec « avantage ».
- source_word: τῆς περιτομῆς
  choice: de la circoncision
  rationale: Traduit directement le nom du rite qui, dans le contexte, sert de signe d’identité de l’alliance.
theological_decisions:
- issue: Rendre Ἰουδαίου comme singulier générique ou par une reformulation inclusive
  choice: du Juif
  alternative: de la personne juive / des Juifs
  rationale: Le grec emploie un masculin singulier représentatif. Le conserver respecte la forme rhétorique de Paul sans introduire une abstraction absente du texte.
- issue: Rapport entre περισσόν et ὠφέλεια
  choice: avantage / utilité
  alternative: avantage / bénéfice ; supériorité / profit
  rationale: Deux termes français distincts préservent le parallélisme sans les confondre. « Avantage » évite de surinterpréter περισσόν comme une supériorité intrinsèque, tandis que « utilité » rend la portée pratique de ὠφέλεια.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve les deux questions rhétoriques parallèles du grec. Le terme « Juif » prend la majuscule conformément à l’usage français lorsqu’il désigne une personne appartenant au peuple juif.
