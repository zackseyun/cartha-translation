lexical_decisions:
- source_word: ὧν
  choice: leur
  rationale: Le pronom relatif au génitif renvoie aux personnes décrites dans le contexte précédent. En français, « leur » produit une formulation naturelle tout en conservant ce lien.
- source_word: τὸ στόμα
  choice: bouche
  rationale: Le singulier grec a une valeur distributive ou collective. Le français emploie naturellement « leur bouche » dans cette citation poétique.
- source_word: ἀρᾶς
  choice: malédiction
  rationale: Le nom désigne ici la parole qui maudit ou appelle le malheur. « Malédiction » conserve le sens lexical et la force morale du grec.
- source_word: πικρίας
  choice: amertume
  rationale: « Amertume » est l’équivalent direct et transparent, sans réduire le terme à la seule dureté verbale.
- source_word: γέμει
  choice: est pleine
  rationale: Cette tournure idiomatique rend le présent grec et s’accorde naturellement avec « bouche ».
