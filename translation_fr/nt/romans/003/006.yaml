id: ROM.3.6
reference: Romans 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: fr
  text: Certainement pas ! Autrement, comment Dieu jugera-t-il le monde ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: Certainement pas !
  rationale: Cette formule grecque exprime un rejet énergique. « Certainement pas ! » en restitue naturellement la force en français moderne, sans conserver artificiellement la forme optative.
- source_word: ἐπεὶ
  choice: Autrement
  rationale: Dans ce raisonnement, la conjonction introduit la conséquence qu’aurait la prémisse rejetée. « Autrement » rend clairement cet enchaînement argumentatif.
- source_word: κρινεῖ
  choice: jugera-t-il
  rationale: Le futur de l’indicatif grec est rendu directement par le futur français, sans lui substituer une nuance modale telle que « pourrait-il juger ».
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: L’article grec accompagne naturellement le nom divin et ne se traduit pas devant le nom propre « Dieu » en français.
- source_word: τὸν κόσμον
  choice: le monde
  rationale: « Le monde » est l’équivalent français courant et suffisamment large de κόσμος dans ce contexte de jugement divin.
theological_decisions:
- issue: Force de la formule de rejet μὴ γένοιτο
  choice: 'Une négation énergique et idiomatique : « Certainement pas ! »'
  alternative: 'Une formulation plus littérale : « Que cela n’arrive jamais ! »'
  rationale: La formule paulinienne rejette vigoureusement l’idée précédente. Une tournure idiomatique transmet mieux sa fonction en français actuel sans ajouter de contenu doctrinal.
- issue: Nature de la question sur le jugement divin
  choice: 'Conserver le futur direct : « comment Dieu jugera-t-il le monde ? »'
  alternative: 'Rendre une nuance modale : « comment Dieu pourrait-il juger le monde ? »'
  rationale: Le grec emploie le futur κρινεῖ. La traduction directe préserve la forme du texte et laisse au contexte la portée rhétorique de la question.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste concise et énergique, conformément au caractère rhétorique du grec. Aucun marqueur de note n’est requis puisqu’aucune note n’est proposée.
