id: ROM.3.3
reference: Romans 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: fr
  text: Que dire alors ? Si certains ont été infidèles, leur infidélité annulera-t-elle la fidélité de Dieu[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la foi de Dieu » ; ici, l’expression désigne probablement la fidélité de Dieu.'
    reason: Variante lexicale préservant l'ambiguïté de πίστιν τοῦ θεοῦ.
lexical_decisions:
- source_word: τί γάρ
  choice: Que dire alors ?
  rationale: Cette formule brève introduit la suite du raisonnement sous forme de question. « Que dire alors ? » est naturel en français moderne et conserve le mouvement argumentatif.
- source_word: ἠπίστησάν
  choice: ont été infidèles
  rationale: Le verbe peut désigner le fait de ne pas croire, mais son rapprochement avec ἀπιστία et son opposition à la πίστις de Dieu favorisent ici le champ lexical de la fidélité.
- source_word: τινες
  choice: certains
  rationale: Le pronom désigne un nombre indéterminé de personnes. « Certains » convient au registre argumentatif de ce passage.
- source_word: ἀπιστία
  choice: infidélité
  rationale: Ce choix maintient le parallèle lexical avec « ont été infidèles » et l'opposition avec la fidélité de Dieu, sans exclure entièrement la nuance d'incrédulité.
- source_word: πίστιν τοῦ θεοῦ
  choice: la fidélité de Dieu
  rationale: La construction signifie littéralement « la foi de Dieu », mais, dans l'opposition à l'infidélité humaine, elle désigne très probablement la fidélité ou la fiabilité de Dieu. L'autre lecture est signalée en note.
- source_word: καταργήσει
  choice: annulera-t-elle
  rationale: Le verbe exprime ici l'idée de rendre sans effet ou d'invalider. « Annuler » formule clairement la question rhétorique en français.
theological_decisions:
- issue: Sens de πίστιν τοῦ θεοῦ dans une formule paulinienne discutée
  choice: la fidélité de Dieu
  alternative: la foi de Dieu
  rationale: Le contraste entre l'ἀπιστία humaine et la πίστις divine favorise le sens de fidélité. La traduction principale reste naturelle tout en préservant l'ambiguïté formelle du grec dans une note.
- issue: Nuance de ἀπιστέω et ἀπιστία
  choice: être infidèle / infidélité
  alternative: ne pas croire / incrédulité
  rationale: Le contexte immédiat met en regard le manquement humain et la constance de Dieu. Le choix retenu préserve cette symétrie, tandis que la nuance d'incrédulité demeure lexicalement possible.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique et le contraste répété entre infidélité humaine et fidélité divine sont conservés.
