  text: δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: fr
  text: étant justifiés gratuitement[a] par sa grâce, au moyen de la rédemption qui est dans le Messie Jésus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « déclarés justes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « Christ Jésus ».'
