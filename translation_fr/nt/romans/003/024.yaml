lexical_decisions:
- source_word: δικαιούμενοι
  choice: étant gratuitement justifiés
  rationale: Le participe présent passif est conservé afin de maintenir le lien syntaxique avec le verset précédent. « Justifiés » est le terme paulinien concis et usuel; « déclarés justes » reste une autre formulation valable.
- source_word: δωρεὰν
  choice: gratuitement
  rationale: L’adverbe exprime que la justification est accordée comme un don, sans être méritée. « Gratuitement » rend ce sens avec concision en français moderne.
- source_word: τῇ αὐτοῦ χάριτι
  choice: par sa grâce
  rationale: Cette formulation naturelle conserve à la fois le moyen exprimé par le datif et le vocabulaire paulinien établi de la grâce divine.
- source_word: ἀπολυτρώσεως
  choice: rédemption
  rationale: « Rédemption » conserve l’idée de libération associée au paiement d’un prix et demeure clair dans ce contexte théologique.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: qui est dans le Messie Jésus
  rationale: La proposition relative reproduit clairement le rattachement du groupe prépositionnel à « rédemption ». « Messie » traduit Χριστός comme titre, sans effacer son sens.
theological_decisions:
- issue: Langage paulinien de la justification
  choice: Conserver « justifiés » dans le texte principal.
  alternative: « déclarés justes »
  rationale: « Justifiés » préserve la densité et la portée juridico-relationnelle du verbe sans imposer une paraphrase explicative comme seul sens possible.
- issue: Valeur de Χριστός
  choice: Traduire le titre par « Messie » dans « le Messie Jésus ».
  alternative: « Christ Jésus »
  rationale: Le grec conserve ici le titre Χριστός. « Messie » en rend directement le sens, tandis que la formulation traditionnelle est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La structure participiale est maintenue pour respecter la continuité avec Romains 3.23; « au moyen de » explicite naturellement διά sans alourdir le texte.
