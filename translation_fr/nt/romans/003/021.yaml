  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : « Mais maintenant » conserve la force transitionnelle de Νυνὶ δέ ; « indépendamment de la Loi » exprime χωρὶς νόμου sans le réduire à une simple absence de loi ; « la justice de Dieu » maintient l''ouverture du génitif θεοῦ ; « a été manifestée » rend adéquatement le parfait passif πεφανέρωται ; et « attestée par la Loi et les Prophètes » reproduit naturellement le participe passif présent μαρτυρουμένη et son agent. La majuscule à « Loi » et « Prophètes » convient à la désignation scripturaire.'
