id: ROM.3.21
reference: Romans 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: fr
  text: Mais maintenant, indépendamment de la Loi, la justice de Dieu[a] a été manifestée, attestée par la Loi et les Prophètes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la justice qui vient de Dieu ».'
    reason: alternative_reading
  - marker: b
    text: « La Loi et les Prophètes » désigne ici les Écritures.
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: Mais maintenant
  rationale: Rend à la fois la transition temporelle et le contraste marqué dans l’argumentation de Paul.
- source_word: χωρὶς νόμου
  choice: indépendamment de la Loi
  rationale: Exprime la séparation indiquée par χωρίς sans suggérer l’inexistence de toute loi; la majuscule signale ici la Loi mosaïque.
- source_word: δικαιοσύνη θεοῦ
  choice: la justice de Dieu
  rationale: « Justice » est le terme français naturel pour δικαιοσύνη. La construction « de Dieu » conserve autant que possible l’ouverture du génitif grec, sans trancher entre la justice propre à Dieu et celle qui vient de lui.
- source_word: πεφανέρωται
  choice: a été manifestée
  rationale: Le passé composé passif rend l’état présent issu d’une manifestation accomplie, porté par le parfait grec. « Manifestée » maintient aussi l’idée d’une réalité rendue visible ou connue.
- source_word: μαρτυρουμένη
  choice: attestée
  rationale: Le participe passé passif restitue avec concision le témoignage continu apporté à cette justice et garde son lien syntaxique avec celle-ci.
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: par la Loi et les Prophètes
  rationale: Cette formule désigne vraisemblablement les Écritures reconnues sous leurs grandes divisions; les majuscules rendent cette valeur de désignation.
theological_decisions:
- issue: Sens du génitif dans δικαιοσύνη θεοῦ
  choice: la justice de Dieu
  alternative: la justice qui vient de Dieu
  rationale: La formulation principale préserve la tension entre le caractère et l’action justes de Dieu et la justice qu’il accorde; la note présente explicitement la lecture de provenance sans l’imposer.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit étroitement la structure grecque tout en restant naturelle; « attestée » évite une tournure participiale lourde, et les majuscules à « Loi » et « Prophètes » indiquent la désignation scripturaire.
