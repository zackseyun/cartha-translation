  terminology: « Justice de Dieu » est un choix français établi pour δικαιοσύνη θεοῦ et la note conserve avec justesse l'alternative de provenance, sans résoudre le génitif en faveur d'une lecture doctrinale particulière. « Loi et Prophètes » est correctement capitalisé et la note explicative est appropriée.
