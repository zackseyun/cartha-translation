  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: fr
  text: Il n’y a personne qui comprenne ; il n’y a personne qui recherche[a] Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cherche Dieu avec insistance ».
    reason: Le verbe grec composé peut souligner l’intensité ou l’insistance de la recherche.
lexical_decisions:
- source_word: συνίων
  choice: qui comprenne
  rationale: Le participe substantivé désigne une personne qui comprend ou saisit avec discernement. La proposition relative au subjonctif est naturelle en français après « il n’y a personne » et conserve ce sens.
- source_word: ἐκζητῶν
  choice: qui recherche
  rationale: Le verbe composé peut évoquer une recherche active ou soutenue. « Rechercher » rend cette nuance avec naturel, sans ajouter une qualification absente du grec.
- source_word: οὐκ ἔστιν
  choice: il n’y a personne
  rationale: Cette tournure idiomatique française conserve la négation catégorique et universelle. Sa répétition reproduit l’insistance du texte grec.
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: qui comprenne / qui recherche
  rationale: Les participes substantivés sont rendus par des propositions relatives, formulation claire et naturelle en français moderne.
- source_word: τὸν θεόν
  choice: Dieu
  rationale: En français, le nom « Dieu » s’emploie ici sans article, conformément à l’usage tout en préservant clairement le référent.
theological_decisions:
- issue: Portée de la négation dans la citation en chaîne de Paul
  choice: Conserver deux fois la formulation absolue « il n’y a personne » sans l’atténuer.
  alternative: « Personne ne comprend vraiment ; personne ne recherche véritablement Dieu. »
  rationale: Le grec exprime une négation catégorique. Ajouter « vraiment » ou « véritablement » introduirait une interprétation qui n’est pas explicitement formulée.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « il n’y a personne » préserve l’insistance rhétorique du grec ; le point-virgule maintient le parallélisme des deux propositions.
