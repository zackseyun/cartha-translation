  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: fr
  text: Car tous ont péché et manquent de la gloire de Dieu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’atteignent pas la gloire de Dieu » ou « sont privés de la gloire de Dieu ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « la gloire de Dieu » peut désigner la gloire propre à Dieu, la gloire que les êtres humains étaient destinés à refléter, ou la gloire accordée par Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: tous
  rationale: Le pluriel nominatif a une portée universelle dans le contexte. « Tous » est concis et conserve l’affirmation générale de Paul sans explicitation ajoutée.
- source_word: γὰρ
  choice: car
  rationale: « Car » rend naturellement la valeur explicative de γάρ et relie ce verset au raisonnement précédent.
- source_word: ἥμαρτον
  choice: ont péché
  rationale: L’aoriste résume le fait du péché de tous. Le passé composé est naturel en français moderne et exprime un fait accompli dont la portée demeure actuelle.
- source_word: ὑστεροῦνται
  choice: sont privés de
  rationale: Le présent décrit une condition actuelle. « Sont privés de » exprime ici le manque ou la non-possession, tout en évitant le calque moins naturel « restent en deçà de ».
- source_word: δόξης
  choice: gloire
  rationale: « Gloire » est l’équivalent français établi de δόξα et conserve la richesse théologique ainsi que l’ouverture sémantique du terme.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif est rendu directement par « de Dieu », sans décider dans le texte principal s’il désigne la gloire propre à Dieu, celle que l’être humain devait refléter ou celle que Dieu accorde.
theological_decisions:
- issue: Sens de « la gloire de Dieu »
  choice: 'Formulation neutre : « la gloire de Dieu »'
  alternative: « la gloire qui vient de Dieu », « le glorieux idéal fixé par Dieu » ou « la participation à la gloire de Dieu »
  rationale: L’expression grecque est dense et laisse ouvertes plusieurs nuances. La traduction conserve cette tension au lieu d’imposer une interprétation doctrinale dans le texte principal.
- issue: Nuance de ὑστεροῦνται
  choice: « sont privés de » dans le texte, avec variantes en note
  alternative: « n’atteignent pas » ou « manquent de »
  rationale: Le verbe peut évoquer un manque, une déficience ou le fait de ne pas atteindre. Le choix principal est idiomatique, tandis que la note préserve les autres nuances possibles.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve la brièveté et la structure explicative du grec. Les notes rendent visibles l’étendue lexicale de ὑστεροῦνται et l’ambiguïté théologique du génitif.
