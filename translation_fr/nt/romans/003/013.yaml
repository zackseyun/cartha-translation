  text: τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν, ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/013.yaml
  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: fr
  text: Leur gorge est un tombeau ouvert ; avec leur langue, ils trompaient[a] ; du venin d’aspics est sous leurs lèvres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils trompent avec leur langue ». Le grec emploie un imparfait, qui peut évoquer une action en cours ou habituelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « du venin de vipères ». Le terme grec est traditionnellement rendu par « aspics » ; l’identification précise du serpent reste incertaine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: tombeau
  rationale: « Tombeau » rend naturellement l’image funèbre et correspond bien au registre biblique sans être obscur en français moderne.
- source_word: ἀνεῳγμένος
  choice: ouvert
  rationale: 'Le participe parfait passif exprime l’état résultant : le tombeau a été ouvert et demeure ouvert. « Un tombeau ouvert » le restitue idiomatiquement.'
- source_word: λάρυγξ
  choice: gorge
  rationale: « Gorge » est l’équivalent français courant et précis dans cette image liée à la parole.
- source_word: ἐδολιοῦσαν
  choice: ils ne cessent de tromper
  rationale: L’imparfait grec présente la tromperie comme une activité continue ou répétée ; cette formulation en fait entendre la valeur durative.
- source_word: ἰὸς
  choice: venin
  rationale: Avec un serpent venimeux, « venin » est plus précis que le terme général « poison ».
- source_word: ἀσπίδων
  choice: vipère
  rationale: Le nom grec désigne un serpent venimeux, traditionnellement l’aspic. « Vipère » est clair en français international et conserve l’image sans imposer une identification zoologique trop précise.
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: sous leurs lèvres
  rationale: Traduction directe qui conserve l’image corporelle vive du grec.
