revisions:
- from: C’est lui que Dieu a présenté comme sacrifice d’expiation[a], par la foi en son sang[b], afin de montrer sa justice[c], puisqu’il avait laissé impunis les péchés commis auparavant.
  to: C’est lui que Dieu a présenté comme sacrifice d’expiation[a], par la foi en son sang[b], afin de montrer sa justice[c], du fait qu’il avait laissé passer les péchés commis auparavant.
  rationale: La révision remplace une explicitation potentiellement excessive de πάρεσις par « avait laissé passer », qui maintient la distinction avec le pardon ou la rémission et respecte l’ambiguïté du grec. Elle harmonise la note b avec la lecture du texte principal et précise sobrement l’allusion au propitiatoire dans la note a, sans imposer une interprétation théologique particulière.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:17:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend correctement la structure et les termes essentiels : Dieu est sujet de προέθετο, ἱλαστήριον garde une expression sacrificielle, la foi et le sang sont conservés, et la démonstration de la δικαιοσύνη divine est explicite. Toutefois, « avait laissé impunis » explicite la non-punition de manière plus catégorique que πάρεσις, qui désigne le fait de laisser passer ou de ne pas traiter immédiatement les péchés; « avait laissé passer » est plus fidèle et conserve la nuance de patience antérieure.'
  naturalness: Le français est moderne, clair et d’un registre biblique accessible. « C’est lui que Dieu a présenté » est naturel dans la continuité du verset précédent. « Par la foi en son sang » est compréhensible, tandis que la note doit présenter l’autre analyse syntaxique sans répéter comme variante ce qui figure déjà dans le texte.
  terminology: « Sacrifice d’expiation » est un rendu français recevable et accessible de ἱλαστήριον; les alternatives « sacrifice propitiatoire » et « propitiatoire » préservent utilement le débat lexical et l’allusion cultuelle. « Justice » convient pour δικαιοσύνη; « droiture » peut être maintenu comme nuance. La note sur le propitiatoire doit désigner plus précisément le couvercle de l’arche et le sang qui y était aspergé.
  issues:
