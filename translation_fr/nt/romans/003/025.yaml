  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: fr
  text: C’est lui que Dieu a présenté comme sacrifice d’expiation[a], par la foi en son sang[b], afin de montrer sa justice[c], du fait qu’il avait laissé passer les péchés commis auparavant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sacrifice propitiatoire » ; ou encore : « propitiatoire », c’est-à-dire le couvercle d’or de l’arche sur lequel le sang expiatoire était aspergé.'
    reason: Alternative lexicale et allusion cultuelle possibles pour ἱλαστήριον.
  - marker: b
    text: 'Ou : « par la foi, au moyen de son sang ». Le rattachement de « en son sang » dans la construction grecque est discuté.'
    reason: Le rattachement syntaxique de « en son sang » est discuté.
  - marker: c
    text: 'Ou : « sa droiture ».'
    reason: δικαιοσύνη peut mettre l’accent sur la justice de Dieu ou sur sa droiture.
lexical_decisions:
- source_word: προέθετο
  choice: a présenté
  rationale: Dans ce contexte, le verbe évoque l’action de placer publiquement devant tous. « A présenté » est naturel en français et n’impose pas le sens moins contextuel de « avait décidé d’avance ».
- source_word: ἱλαστήριον
  choice: sacrifice d’expiation
  rationale: Cette expression accessible conserve la portée sacrificielle et réparatrice du terme sans trancher exclusivement entre expiation, propitiation et allusion au couvercle de l’arche.
- source_word: διὰ πίστεως
  choice: par la foi
  rationale: « Foi » est le rendu courant de πίστις et convient naturellement à la construction instrumentale introduite par διά.
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: en son sang
  rationale: Ce rendu formel permet la lecture « la foi en son sang », tout en signalant en note l’autre rattachement syntaxique possible.
- source_word: εἰς ἔνδειξιν
  choice: afin de montrer
  rationale: Cette formulation française actuelle exprime clairement la valeur de but ou de résultat de la locution grecque.
- source_word: δικαιοσύνης
  choice: justice
  rationale: En français, « justice » exprime naturellement ici le caractère juste de Dieu et son action conforme au droit. Une note conserve la possibilité du terme théologique « justice de Dieu » comprise comme « droiture ».
- source_word: πάρεσιν
  choice: avait laissé impunis
  rationale: Le choix exprime la non-sanction temporaire ou le fait de laisser passer, sans assimiler πάρεσις au pardon définitif.
- source_word: προγεγονότων ἁμαρτημάτων
  choice: les péchés commis auparavant
  rationale: La formulation restitue clairement l’antériorité portée par le participe grec dans un français naturel.
theological_decisions:
- issue: Sens de ἱλαστήριον
  choice: sacrifice d’expiation
  alternative: sacrifice propitiatoire ; propitiatoire, c’est-à-dire le couvercle de l’arche
  rationale: Le texte principal conserve la dimension sacrificielle sans réduire le mot à l’apaisement de la colère divine ni exclure son arrière-plan cultuel. Les deux grandes autres lectures figurent en note.
- issue: Rattachement de διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι
  choice: par la foi en son sang
  alternative: par la foi, au moyen de son sang
  rationale: La lecture principale comprend le sang, c’est-à-dire la mort sacrificielle du Christ, comme objet de la foi. La note préserve l’analyse selon laquelle le sang indique plutôt le moyen par lequel Dieu a accompli l’expiation.
- issue: Portée de δικαιοσύνη appliquée à Dieu
  choice: justice
  alternative: droiture
  rationale: « Justice » est le terme français le plus naturel dans ce contexte où Dieu montre qu’il agit justement, tandis que « droiture » conserve une autre nuance possible sans introduire une lecture confessionnelle particulière.
- issue: Portée de πάρεσις
  choice: avait laissé impunis
  alternative: avait laissé passer
  rationale: Le rendu distingue la patience antérieure de Dieu d’une déclaration explicite de pardon complet et maintient ainsi la tension de l’argument de Paul.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est lui que » reprend naturellement le pronom relatif grec et suppose l’antécédent du verset précédent. La formulation évite le jargon technique dans le texte principal, tandis que les notes conservent les principales ambiguïtés lexicales et syntaxiques.
