    issue: « puisqu’il avait laissé impunis » surinterprète πάρεσις.
    rationale: πάρεσις évoque le fait de laisser passer les péchés antérieurs, dans le cadre de la patience divine; « impunis » peut suggérer de façon trop arrêtée qu’aucune sanction n’était en cause. « Du fait qu’il avait laissé passer » reflète mieux le lexème et l’argument de Paul.
  - severity: low
