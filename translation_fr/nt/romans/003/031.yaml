id: ROM.3.31
reference: Romans 3:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: fr
  text: Annulons-nous donc la Loi par la foi ? Loin de là ! Au contraire, nous confirmons[a] la Loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous établissons la Loi ».'
    reason: Alternative lexicale pour ἱστάνομεν, dont le sens peut être « confirmer, maintenir » ou « établir ».
lexical_decisions:
- source_word: νόμον
  choice: la Loi
  rationale: Dans l’argument de Romains, le nom sans article renvoie à la réalité déterminée de la Loi, comprise dans son cadre juif et scripturaire. La majuscule aide à signaler ce référent sans ajouter d’explication au texte.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque naturellement l’inférence rhétorique tirée de l’argument précédent.
- source_word: καταργοῦμεν
  choice: annulons-nous
  rationale: « Annuler » exprime ici l’idée de priver la Loi de sa validité ou de son effet. Le terme forme un contraste clair avec « confirmer » sans suggérer uniquement une abolition législative.
- source_word: διὰ τῆς πίστεως
  choice: par la foi
  rationale: « Par » rend naturellement la valeur instrumentale de διά avec le génitif, et « foi » demeure le terme français courant pour πίστις dans ce contexte.
- source_word: μὴ γένοιτο
  choice: Loin de là !
  rationale: Cette formule française idiomatique conserve la répudiation énergique de Paul sans donner à l’expression grecque la forme artificielle d’un souhait littéral.
- source_word: ἀλλὰ
  choice: Au contraire
  rationale: La locution fait ressortir le contraste correctif et vigoureux introduit par Paul.
- source_word: ἱστάνομεν
  choice: nous confirmons
  rationale: Dans ce contraste avec « annuler », « confirmer » indique que la foi atteste et maintient la validité de la Loi. Cette formulation reste naturelle en français et évite de laisser entendre que Paul institue la Loi pour la première fois.
theological_decisions:
- issue: Rapport entre la foi et la Loi
  choice: « nous confirmons la Loi »
  alternative: « nous établissons la Loi »
  rationale: Le grec permet le sens d’« établir », mais cette expression pourrait suggérer en français que la Loi est nouvellement instituée. « Confirmer » conserve l’affirmation selon laquelle la foi ne prive pas la Loi de sa validité, sans préciser par quel système théologique cette affirmation doit être expliquée.
translation_notes:
  register: Français international moderne, clair et digne. La question et la réponse conservent le rythme serré de l’argumentation de Paul. « Loin de là ! » rend avec force une formule grecque idiomatique, tandis que « la Loi » maintient le cadre théologique sans l’expliciter au-delà du texte.
