lexical_decisions:
- source_word: ὀξεῖς
  choice: prompts
  rationale: L’adjectif signifie littéralement « aigus » ou « rapides ». Appliqué aux pieds dans ce contexte de violence, « prompts » exprime naturellement en français leur empressement et leur rapidité à agir, sans affaiblir l’image.
- source_word: οἱ πόδες
  choice: les pieds
  rationale: Traduction directe qui conserve l’image corporelle du texte source.
- source_word: αὐτῶν
  choice: leurs
  rationale: Le génitif marque ici naturellement la possession; en français, « leurs pieds » est la formulation idiomatique.
- source_word: ἐκχέαι
  choice: à verser
  rationale: Avec « le sang », « verser » est l’équivalent idiomatique courant en français et conserve le sens violent du verbe, littéralement « répandre » ou « déverser ».
- source_word: αἷμα
  choice: le sang
  rationale: Traduction française habituelle; l’article défini convient à l’expression idiomatique « verser le sang ».
