id: ROM.3.22
reference: Romans 3:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: fr
  text: Mais la justice de Dieu est manifestée par la foi en Jésus le Messie[a], pour tous ceux qui croient[b] ; en effet, il n’y a pas de distinction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la fidélité de Jésus le Messie ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « vers tous ceux qui croient ».'
    reason: source_form
lexical_decisions:
- source_word: δικαιοσύνη
  choice: justice
  rationale: En français biblique moderne, « justice » rend naturellement δικαιοσύνη et peut évoquer à la fois le caractère et l’action justes de Dieu ainsi que le statut juste qu’il accorde.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Le génitif est conservé sans trancher entre la justice qui appartient à Dieu, celle qu’il manifeste et celle qui vient de lui.
- source_word: διὰ πίστεως
  choice: par la foi
  rationale: « Foi » est le correspondant français usuel de πίστις ; la construction controversée avec Ἰησοῦ Χριστοῦ est explicitée dans les notes.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός est rendu comme le titre « Messie », avec l’article requis par le français idiomatique.
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: pour tous ceux qui croient
  rationale: Cette formulation naturelle conserve la portée inclusive de πάντας et la valeur verbale du participe πιστεύοντας.
- source_word: διαστολή
  choice: distinction
  rationale: « Distinction » reproduit précisément l’idée d’une différence de traitement ou de condition dans ce contexte.
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: la foi en Jésus le Messie
  alternative: la fidélité de Jésus le Messie
  rationale: Le génitif peut être compris objectivement, comme la foi ayant Jésus pour objet, ou subjectivement, comme la fidélité propre à Jésus. Le texte principal retient la lecture courante, tandis que la note préserve l’autre lecture authentiquement possible.
- issue: δικαιοσύνη θεοῦ
  choice: la justice de Dieu
  alternative: la justice qui vient de Dieu
  rationale: La formulation avec génitif préserve l’ampleur du grec et évite de décider si l’accent porte sur l’attribut, l’action ou le don de Dieu.
- issue: Relation syntaxique avec Romains 3:21
  choice: est manifestée
  alternative: 'ellipse de la copule : « mais la justice de Dieu… »'
  rationale: Le grec du verset 22 poursuit la phrase commencée au verset 21 et n’exprime pas de nouveau verbe. Pour que le verset isolé soit intelligible en français, « est manifestée » est repris du contexte immédiat, sans ajouter une nouvelle affirmation.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation garde le mouvement argumentatif de Paul. « En effet » rend γάρ plus naturellement que « car » après le point-virgule. Le verbe « est manifestée », sous-entendu dans ce segment grec, est repris de Romains 3:21 afin que le verset présenté seul forme une phrase française complète.
