id: ROM.3.7
reference: Romans 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: fr
  text: Mais si la vérité de Dieu[a] a surabondé par mon mensonge[b] pour sa gloire[c], pourquoi moi aussi suis-je encore jugé comme un pécheur ?[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la véracité de Dieu » ; littéralement, « la vérité de Dieu ».'
    reason: Préserve l’ambiguïté du génitif et le sens contextuellement possible de la qualité de Dieu opposée au mensonge humain.
  - marker: b
    text: 'Ou : « par ma fausseté ».'
    reason: Alternative lexicale pour ψεύσματι.
  - marker: c
    text: 'Littéralement : « vers sa gloire » ou « à sa gloire ».'
    reason: εἰς peut marquer la direction, le résultat ou la finalité ; « pour » est idiomatique sans trancher indûment.
  - marker: d
    text: Le grec souligne « moi aussi ».
    reason: κἀγώ comporte une nuance additive explicitement rendue dans le texte.
lexical_decisions:
- source_word: ἡ ἀλήθεια τοῦ θεοῦ
  choice: la fidélité de Dieu à la vérité
  rationale: Dans le contexte immédiat (Rm 3.4-7), l’expression désigne la véracité de Dieu, opposée au mensonge humain. Cette formulation française rend ce sens moral et relationnel sans réduire ἀλήθεια à une notion abstraite.
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: par mon mensonge
  rationale: 'ἐν a ici une valeur instrumentale : le mensonge humain devient, dans l’argument rapporté, le moyen ou l’occasion par lequel la véracité divine ressort davantage.'
- source_word: ἐπερίσσευσεν
  choice: a surabondé
  rationale: Le verbe exprime une augmentation jusqu’à l’abondance. « A surabondé » conserve cette intensité ainsi que la valeur rétrospective du parfait français adaptée à l’aoriste dans ce raisonnement.
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: pour sa gloire
  rationale: Cette tournure française naturelle peut exprimer le résultat ou la finalité de εἰς sans trancher excessivement entre les deux.
- source_word: τί ἔτι κἀγὼ
  choice: pourquoi suis-je encore
  rationale: « Encore » rend ἔτι. Le pronom « je » suffit normalement en français à porter κἀγώ dans cette question, tandis que la variante en note conserve sa nuance additive possible.
- source_word: ὡς ἁμαρτωλὸς κρίνομαι
  choice: suis-je encore jugé comme pécheur
  rationale: Le présent passif est conservé, sans le préciser prématurément comme une condamnation finale. « Comme pécheur » rend directement le statut exprimé par ὡς ἁμαρτωλός.
theological_decisions:
- issue: 'Sens de ἀλήθεια τοῦ θεοῦ : vérité appartenant à Dieu ou véracité de Dieu'
  choice: la fidélité de Dieu à la vérité
  alternative: la vérité de Dieu
  rationale: Le contraste avec le mensonge humain et avec « Dieu est vrai » au verset 4 favorise la véracité divine. Une note maintient toutefois l’ambiguïté réelle du génitif et la traduction plus formelle.
- issue: Statut rhétorique du « je »
  choice: maintenir la première personne sans identifier explicitement le locuteur
  alternative: présenter la phrase comme l’affirmation personnelle de Paul
  rationale: Le verset formule une objection dans le mouvement argumentatif, mais le texte seul n’autorise pas à résoudre dans la traduction l’identité ou le statut exact de la voix rhétorique.
translation_notes:
  register: Français international moderne, digne et lisible. « Fidélité de Dieu à la vérité » est plus explicite que « véracité », terme exact mais moins courant. « Surabondé » garde la force de περισσεύω et convient au registre paulinien. Le marqueur de note est placé après l’ensemble du verset puisqu’elle propose une variante complète.
