revisions:
- from: Mais si la fidélité de Dieu à la vérité a surabondé par mon mensonge, pour sa gloire, pourquoi suis-je encore jugé comme pécheur ?[a]
  to: Mais si la vérité de Dieu[a] a surabondé par mon mensonge[b] pour sa gloire[c], pourquoi moi aussi suis-je encore jugé comme un pécheur ?[d]
  rationale: La révision remplace une paraphrase interprétative et maladroite par un rendu lexicalement direct de ἀλήθεια τοῦ θεοῦ, tout en signalant en note la lecture « véracité ». Elle restitue aussi dans le texte la nuance additive de κἀγώ et sépare les notes selon leurs ancres respectives. Le sens rhétorique du verset, sans identification doctrinale du locuteur ni résolution de son argument, demeure inchangé.
