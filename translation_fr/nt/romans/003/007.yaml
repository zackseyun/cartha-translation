  naturalness: « La vérité de Dieu » et « pourquoi moi aussi suis-je encore jugé comme un pécheur ? » sont naturels dans un français international moderne et gardent le registre soutenu de l’argument. L’article dans « un pécheur » est idiomatique en français sans modifier le sens.
  terminology: « Vérité » est le rendu français direct et non surinterprétatif de ἀλήθεια. La note « véracité de Dieu » explicite l’option contextuellement plausible sans imposer un choix théologique. « Mensonge », « surabondé », « gloire » et « pécheur » correspondent au lexique source et au registre paulinien.
