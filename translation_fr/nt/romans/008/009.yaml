id: ROM.8.9
reference: Romans 8:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: fr
  text: Mais vous, vous n’êtes pas dans la chair[a], mais dans l’Esprit, si du moins l’Esprit de Dieu habite en vous. Mais si quelqu’un n’a pas l’Esprit du Messie[b], il ne lui appartient pas[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On traduit aussi : « sous l’emprise de la nature pécheresse ». Le grec dit littéralement : « dans la chair ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’Esprit du Christ ».'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « celui-ci n’est pas à lui ».'
    reason: literal_rendering
lexical_decisions:
- source_word: σάρξ
  choice: chair
  rationale: Le terme paulinien « chair » est conservé afin de préserver le contraste entre deux sphères d’existence, sans le réduire au corps physique ni le remplacer par la paraphrase interprétative « nature pécheresse ».
- source_word: πνεῦμα
  choice: Esprit
  rationale: La majuscule s’impose dans ce contexte, puisque Paul précise « l’Esprit de Dieu » puis « l’Esprit du Messie ».
- source_word: οἰκεῖ
  choice: habite
  rationale: « Habite » exprime naturellement en français l’idée d’une présence intérieure durable.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός est rendu comme un titre, « le Messie », plutôt que comme une forme assimilée à un nom propre.
- source_word: εἴπερ
  choice: si du moins
  rationale: Cette formulation conserve la forme conditionnelle tout en laissant entendre que Paul tient la réalité évoquée pour acquise chez ses destinataires.
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: il ne lui appartient pas
  rationale: Cette formulation idiomatique rend clairement la relation de possession exprimée en grec, tout en laissant le pronom sans explicitation supplémentaire.
- source_word: Ὑμεῖς δὲ
  choice: Mais vous, vous
  rationale: La dislocation naturelle en français restitue l’insistance du pronom grec explicite et le contraste avec ce qui précède.
- source_word: τις … οὗτος
  choice: quelqu’un … il
  rationale: Le singulier générique du grec est conservé dans une tournure française courante et compréhensible.
theological_decisions:
- issue: Le contraste entre « dans la chair » et « dans l’Esprit »
  choice: Conserver le langage de sphère ou de condition d’existence employé par Paul.
  alternative: Paraphraser par « sous l’emprise de la nature pécheresse » et « sous la conduite de l’Esprit ».
  rationale: Le texte relie explicitement cette condition à la présence intérieure de l’Esprit. Garder « chair » et « Esprit » préserve les catégories et la tension théologiques de Paul sans les enfermer dans une explication particulière.
- issue: Le référent de « lui » dans la dernière proposition
  choice: Conserver le pronom, dont l’antécédent immédiat est le Messie.
  alternative: Expliciter « il n’appartient pas au Messie » ou rattacher le pronom à Dieu selon le contexte plus large.
  rationale: Le grec emploie simplement un pronom possessif. Le conserver évite de préciser davantage que le texte, même si « le Messie » est l’antécédent grammatical le plus proche.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « vous, vous » est idiomatique et rend l’emphase grecque. Les termes théologiques clés « chair », « Esprit » et « Messie » sont maintenus sans paraphrase doctrinale.
