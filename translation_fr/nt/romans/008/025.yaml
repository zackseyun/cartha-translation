id: ROM.8.25
reference: Romans 8:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: fr
  text: Mais si nous espérons ce que nous ne voyons pas, nous l’attendons avec persévérance[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec patience » ou « avec endurance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: Conserve la valeur conditionnelle de εἰ et la légère nuance de contraste ou de continuité portée par δέ, tout en s’insérant naturellement dans le raisonnement.
- source_word: ὃ οὐ βλέπομεν
  choice: ce que nous ne voyons pas
  rationale: Rend naturellement le relatif neutre ὃ et respecte le présent de βλέπομεν, sans ajouter l’idée que la chose serait par nature invisible.
- source_word: ἐλπίζομεν
  choice: nous espérons
  rationale: En français, « espérer ce que » accepte directement le complément et exprime ici l’attente confiante orientée vers un accomplissement futur.
- source_word: δι’ ὑπομονῆς
  choice: avec persévérance
  rationale: ὑπομονή désigne la constance qui tient ferme dans l’attente ou l’épreuve. « Persévérance » en préserve mieux la force active que la seule « patience ».
- source_word: ἀπεκδεχόμεθα
  choice: nous l’attendons
  rationale: Le pronom reprend naturellement « ce que nous ne voyons pas ». Le verbe exprime une attente soutenue et orientée vers l’avenir; cette nuance est portée conjointement par le contexte et « avec persévérance ».
theological_decisions:
- issue: Objet de l’espérance chrétienne et de l’attente
  choice: Maintenir l’expression générale « ce que nous ne voyons pas »
  alternative: Préciser « le salut », « la rédemption » ou « la résurrection » d’après le contexte
  rationale: Bien que le contexte éclaire le référent, le verset lui-même ne le nomme pas. La traduction conserve donc la retenue et l’ouverture de la formulation grecque.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la structure grecque sans devenir raide. « Persévérance » exprime une attente active et constante; une note conserve les principales nuances possibles de ὑπομονή.
