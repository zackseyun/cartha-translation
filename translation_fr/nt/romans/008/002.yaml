id: ROM.8.2
reference: Romans 8:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: fr
  text: En effet, la loi[a] de l’Esprit de vie, dans le Messie Jésus[c], t’a libéré de la loi du péché et de la mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « principe » : « le principe de l’Esprit de vie ».'
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits portent « m’a libéré » au lieu de « t’a libéré ».
    reason: textual_variant
  - marker: c
    text: 'Traduction traditionnelle : « dans le Christ Jésus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: loi
  rationale: Le même mot est conservé dans les deux occurrences afin de préserver la répétition de Paul et la tension de sa métaphore; « principe » reste possible mais interprète plus étroitement.
- source_word: πνεύματος
  choice: Esprit
  rationale: La majuscule indique qu’en contexte il s’agit très probablement de l’Esprit Saint, source ou médiateur de la vie.
- source_word: ζωῆς
  choice: vie
  rationale: Traduction directe qui conserve la formulation concise « l’Esprit de vie ».
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Dans » préserve le langage paulinien de l’union au Messie; Χριστός est rendu comme le titre « Messie ».
- source_word: ἠλευθέρωσέν
  choice: t’a libéré
  rationale: Le passé composé exprime naturellement en français un acte accompli dont l’effet demeure.
- source_word: σε
  choice: te / t’
  rationale: Suit le texte imprimé du SBLGNT, à la deuxième personne du singulier; la variante « me » est signalée en note.
- source_word: ἁμαρτίας
  choice: péché
  rationale: Traduction usuelle qui permet aussi de percevoir le péché comme puissance asservissante dans le contexte paulinien.
- source_word: θανάτου
  choice: mort
  rationale: Traduction directe, maintenue en coordination compacte avec « péché ».
- source_word: γὰρ
  choice: En effet
  rationale: Rend la valeur explicative du connecteur et relie naturellement le verset à l’affirmation précédente.
theological_decisions:
- issue: Référent de πνεύματος
  choice: l’Esprit Saint (« Esprit » avec majuscule)
  alternative: l’esprit humain ou un principe spirituel
  rationale: Dans Romains 8, l’opposition entre la chair, le péché, la mort et l’Esprit qui donne la vie favorise nettement une référence à l’Esprit Saint.
- issue: Sens de νόμος dans les deux occurrences
  choice: « loi » dans les deux cas
  alternative: « principe », « puissance » ou une combinaison interprétative
  rationale: La répétition lexicale et l’ambivalence de la métaphore sont conservées sans décider prématurément s’il s’agit d’une règle, d’un principe opérant ou d’une puissance.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier rend précisément σε. Les marqueurs sont placés immédiatement après les éléments concernés; la note textuelle [b] suit la proposition afin de ne pas interrompre le verbe.
