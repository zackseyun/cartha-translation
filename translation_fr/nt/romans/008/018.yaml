  terminology: « Souffrances », « temps présent », « gloire à venir » et « révélée » conviennent au vocabulaire paulinien et au français biblique moderne. La note « Ou “en nous”. » préserve avec justesse la lecture participative possible sans la privilégier doctrinalement.
