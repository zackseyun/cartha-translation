id: ROM.8.18
reference: Romans 8:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: fr
  text: J’estime, en effet, que les souffrances du temps présent ne sont pas comparables à la gloire à venir qui doit nous être révélée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en nous ».
    reason: alternative_reading
lexical_decisions:
- source_word: Λογίζομαι
  choice: J’estime
  rationale: Exprime un jugement réfléchi et raisonné, dans un français actuel et digne.
- source_word: γὰρ
  choice: en effet
  rationale: Marque le lien explicatif avec ce qui précède sans donner artificiellement à la phrase une tournure causale.
- source_word: οὐκ ἄξια … πρὸς
  choice: ne sont pas comparables à
  rationale: Rend naturellement la disproportion exprimée par ἄξια avec πρὸς, sans suggérer que les souffrances seraient moralement indignes.
- source_word: τὰ παθήματα
  choice: les souffrances
  rationale: Désigne les souffrances vécues et correspond à l’usage paulinien courant.
- source_word: τοῦ νῦν καιροῦ
  choice: du temps présent
  rationale: Conserve la référence temporelle sans ajouter explicitement la notion d’« âge ».
- source_word: τὴν μέλλουσαν δόξαν
  choice: la gloire à venir
  rationale: Préserve distinctement l’orientation future portée par μέλλουσαν.
- source_word: ἀποκαλυφθῆναι
  choice: qui doit être révélée
  rationale: Conserve la révélation future et la voix passive de l’infinitif grec.
- source_word: εἰς ἡμᾶς
  choice: pour nous
  rationale: Le français « pour nous » maintient une certaine ouverture quant au rapport entre la gloire et les croyants; l’autre compréhension importante est signalée en note.
theological_decisions:
- issue: Sens de εἰς ἡμᾶς dans la révélation de la gloire
  choice: pour nous
  alternative: en nous
  rationale: La préposition peut ici exprimer une orientation vers les croyants ou leur participation à la gloire. Le texte principal adopte une formulation française souple et la note préserve explicitement la lecture intérieure ou participative.
translation_notes:
  register: Français international moderne, naturel et digne. « J’estime » garde le caractère raisonné de l’affirmation; « ne sont pas comparables à » exprime clairement la disproportion; la construction « gloire à venir qui doit être révélée » conserve les deux éléments futurs distincts du grec.
