  verdict: revise
  source_fidelity: 'La phrase rend fidèlement le jugement comparatif de λογίζομαι, γάρ, οὐκ ἄξια … πρὸς, les souffrances présentes et la gloire future révélée. Toutefois, « pour nous » affaiblit et déplace l’orientation de εἰς ἡμᾶς : cette formulation suggère plus spontanément le bénéfice ou la destination que la révélation adressée aux croyants. « Nous être révélée » rend mieux la lecture principale retenue dans l’audit anglais, tout en laissant l’autre possibilité en note.'
