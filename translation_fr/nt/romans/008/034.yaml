    issue: Ajout de « Jésus » dans le texte traduit.
    rationale: Le texte grec SBLGNT transmis porte Χριστός, sans Ἰησοῦς. La justification du brouillon reconnaît elle-même cet écart et ne fournit pas de note textuelle étayée. Il faut donc omettre « Jésus » du texte.
  - severity: low
    issue: Construction et ponctuation pesantes après « ressuscité ».
    rationale: « —, lui qui est aussi… » après une incise déjà encadrée de tirets est peu fluide. Une reprise par « il est aussi » rend clairement les deux relatives grecques coordonnées.
