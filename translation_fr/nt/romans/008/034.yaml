- from: Qui condamnera ? Le Messie Jésus est celui qui est mort — bien plus, il a été ressuscité —, lui qui est aussi à la droite de Dieu[a] et qui intercède aussi pour nous[b].
  to: Qui condamnera ? C’est le Messie qui est mort — bien plus, qui a été ressuscité —; il est aussi à la droite de Dieu[a] et il intercède aussi pour nous[b].
  rationale: La révision retire « Jésus », ajout absent du texte source fourni. Elle maintient la progression mort–résurrection, le passif de « a été ressuscité », l’image de la droite de Dieu et l’intercession. Le point-virgule et la reprise pronominale rendent la syntaxe plus nette en français moderne sans modifier le sens.
