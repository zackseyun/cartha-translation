id: ROM.8.34
reference: Romans 8:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: fr
  text: Qui condamnera ? C’est le Messie qui est mort — bien plus, qui a été ressuscité —; il est aussi à la droite de Dieu[a] et il intercède aussi pour nous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « À la droite de Dieu » est une expression biblique désignant la place suprême d’honneur et d’autorité.
    reason: cultural_note
  - marker: b
    text: Ou « intervient en notre faveur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: condamnera
  rationale: Dans la série de questions rhétoriques du contexte (Rm 8.33-35), le futur français exprime naturellement le défi implicite, tout en rendant le participe présent substantivé grec sans suggérer qu’une personne est effectivement en train de condamner les élus.
- source_word: Χριστός
  choice: le Messie
  rationale: Χριστός garde ici sa valeur de titre. « Le Messie Jésus » rend cette valeur tout en conservant le nom Jésus attesté par une variante textuelle importante, bien que « Jésus » ne figure pas dans le texte principal du SBLGNT fourni.
- source_word: ἀποθανών
  choice: celui qui est mort
  rationale: Le participe aoriste désigne l’acte historique de sa mort; cette relative substantivée reste naturelle et soutient la réponse à la question initiale.
- source_word: μᾶλλον δὲ
  choice: bien plus
  rationale: Cette expression marque une progression emphatique de la mort à la résurrection, sans présenter la première affirmation comme erronée.
- source_word: ἐγερθείς
  choice: il a été ressuscité
  rationale: Le passif grec est conservé, laissant entendre que Dieu est l’auteur de la résurrection sans l’ajouter explicitement.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: à la droite de Dieu
  rationale: Formule biblique française reconnue, fidèle à l’image grecque de la place d’honneur et d’autorité.
- source_word: ἐντυγχάνει
  choice: intercède
  rationale: « Intercède » exprime précisément l’intervention en faveur d’autrui et convient au registre théologique sans être inutilement technique.
- source_word: ὑπὲρ ἡμῶν
  choice: pour nous
  rationale: Formulation française directe et naturelle qui conserve le sens représentatif et bénéfique de ὑπέρ.
theological_decisions:
- issue: Valeur titulaire de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le titre est rendu selon son sens plutôt que seulement translittéré; la note signale la formulation traditionnelle légitime.
- issue: Voix de ἐγερθείς
  choice: a été ressuscité
  alternative: est ressuscité
  rationale: Le passif grammatical est maintenu afin de ne pas effacer la présentation de la résurrection comme un acte accompli envers le Messie.
- issue: Présence de Ἰησοῦς après Χριστός
  choice: Jésus dans le texte, avec signalement textuel
  alternative: omettre Jésus
  rationale: Le texte principal SBLGNT fourni lit seulement Χριστός, tandis que les signes critiques et la couche anglaise indiquent une variation. La note préserve cette donnée sans la dissimuler.
translation_notes:
  register: 'Français international moderne, digne et oralement fluide. La ponctuation met en relief la progression mort-résurrection, puis l’exaltation et l’intercession. Remarque éditoriale : puisque le texte principal du SBLGNT fourni omet Ἰησοῦς, une note textuelle sur « Jésus » serait normalement requise; elle n’a pas été ajoutée aux notes balisées faute de formulation suffisamment étayée par l’apparat critique complet.'
