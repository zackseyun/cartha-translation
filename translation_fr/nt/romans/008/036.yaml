id: ROM.8.36
reference: Romans 8:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: fr
  text: 'Comme il est écrit : « À cause de toi, nous sommes mis à mort tout au long du jour ; nous avons été considérés comme des brebis destinées à l’abattage.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous avons été regardés comme des brebis destinées à l’abattage ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: Comme
  rationale: Introduit naturellement en français la citation scripturaire et conserve son lien comparatif avec ce qui précède.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée pour introduire l’Écriture, qui rend la portée durable du parfait grec.
- source_word: Ἕνεκεν σοῦ
  choice: À cause de toi
  rationale: Rend directement la valeur causale tout en maintenant l’adresse à Dieu ; dans ce contexte de souffrance, la formulation conserve la tension du grec.
- source_word: θανατούμεθα
  choice: nous sommes mis à mort
  rationale: Le présent passif exprime un traitement létal subi et continu ; cette formulation est claire et garde la gravité du verbe.
- source_word: ὅλην τὴν ἡμέραν
  choice: tout au long du jour
  rationale: Expression française naturelle qui marque toute l’étendue de la journée et l’exposition continuelle.
- source_word: ἐλογίσθημεν
  choice: nous avons été considérés
  rationale: Rend le passif de λογίζομαι au sens d’être regardés ou tenus pour, sans suggérer un calcul numérique.
- source_word: ὡς
  choice: comme
  rationale: Introduit simplement et fidèlement la comparaison.
- source_word: πρόβατα σφαγῆς
  choice: des brebis destinées à l’abattage
  rationale: Explicite naturellement en français le génitif de destination tout en préservant l’image violente du troupeau voué à être abattu.
theological_decisions:
- issue: Citation du Psaume 44.23 (LXX 43.23) dans un contexte de souffrance
  choice: Conserver le sens collectif et continu de personnes traitées comme vouées à la mort, sans préciser qu’il s’agit exclusivement du martyre.
  alternative: Interpréter explicitement la citation comme une référence particulière au martyre.
  rationale: Le grec reprend la lamentation sans en réduire la portée à une seule application doctrinale ; la traduction maintient donc l’image et la tension du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence de la citation reste solennelle sans archaïsmes. Le marqueur [a] est placé immédiatement après l’ensemble de la proposition qu’il éclaire.
