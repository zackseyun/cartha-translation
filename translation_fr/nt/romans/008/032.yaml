id: ROM.8.32
reference: Romans 8:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: fr
  text: Lui qui n’a pas épargné son propre Fils, mais l’a livré pour nous tous[a], comment ne nous donnera-t-il pas aussi, avec lui, toutes choses par grâce[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en faveur de nous tous ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « nous accordera-t-il pas aussi gratuitement toutes choses avec lui ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: Lui qui
  rationale: La tournure reprend Dieu, mentionné dans le contexte précédent, et rend naturellement en français la relative emphatique; l’insistance de γε ressort de la construction détachée sans ajout lourd comme « vraiment ».
- source_word: τοῦ ἰδίου υἱοῦ
  choice: son propre Fils
  rationale: « Propre » conserve l’intensité relationnelle et possessive de ἴδιος. La majuscule indique que le référent est Jésus.
- source_word: οὐκ ἐφείσατο
  choice: n’a pas épargné
  rationale: Équivalent français direct et idiomatique de φείδομαι, qui garde la gravité du contexte de souffrance et de mort.
- source_word: ἀλλὰ
  choice: mais
  rationale: Rend simplement l’opposition marquée par ἀλλά.
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: pour nous tous
  rationale: Formulation naturelle qui exprime le bénéfice et peut aussi porter la nuance de représentation, sans imposer une définition technique de l’expiation.
- source_word: παρέδωκεν αὐτόν
  choice: l’a livré
  rationale: « Livrer » exprime ici le fait de remettre le Fils à la souffrance et à la mort, avec la force voulue dans ce contexte.
- source_word: πῶς οὐχὶ καὶ
  choice: comment ne… pas aussi
  rationale: Conserve la question rhétorique et l’inférence du don suprême vers tous les autres dons.
- source_word: σὺν αὐτῷ
  choice: avec lui
  rationale: Rend directement σύν et maintient l’association de tous les dons avec celui du Fils.
- source_word: τὰ πάντα
  choice: toutes choses
  rationale: Préserve l’ampleur de l’expression grecque sans la restreindre à une catégorie particulière.
- source_word: ἡμῖν
  choice: nous
  rationale: Le pronom complément placé avant le verbe rend naturellement en français le datif de bénéficiaire.
- source_word: χαρίσεται
  choice: donnera… par grâce
  rationale: La formulation rend à la fois l’acte de donner et la nuance gracieuse de χαρίζομαι, que « donnera » seul risquerait d’atténuer.
theological_decisions:
- issue: Portée de ὑπὲρ ἡμῶν πάντων
  choice: pour nous tous
  alternative: en faveur de nous tous
  rationale: Le grec affirme clairement une action accomplie pour le bénéfice de tous ceux que « nous » désigne, avec des résonances sacrificielles, mais sans exiger ici une formulation technique plus précise.
- issue: Portée de τὰ πάντα
  choice: toutes choses
  alternative: tout
  rationale: La traduction conserve l’expression générale de Paul et laisse le contexte en déterminer la portée, sans promettre explicitement chaque bien concevable ni restreindre arbitrairement les dons.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression rhétorique de l’argument et place « par grâce » en fin de proposition pour rendre la nuance de χαρίσεται sans alourdir le verbe.
