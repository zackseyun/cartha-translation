id: ROM.8.5
reference: Romans 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: fr
  text: En effet, ceux qui vivent selon la chair orientent leur pensée vers ce qui relève de la chair, tandis que ceux qui vivent selon l’Esprit l’orientent vers ce qui relève de l’Esprit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: ceux qui vivent selon la chair
  rationale: Littéralement « ceux qui sont selon la chair ». Dans ce contexte, « vivent selon » exprime naturellement en français l’orientation durable de l’existence sans réduire σάρξ au seul corps physique.
- source_word: φρονοῦσιν
  choice: portent leurs pensées sur
  rationale: Le verbe désigne l’orientation de la pensée, des préoccupations et des dispositions, et non un simple acte intellectuel ponctuel.
- source_word: τὰ τῆς σαρκὸς
  choice: ce qui relève de la chair
  rationale: Cette formulation restitue l’expression grecque elliptique « les choses de la chair » dans un français naturel tout en conservant sa portée générale.
- source_word: κατὰ πνεῦμα
  choice: selon l’Esprit
  rationale: La majuscule rend l’allusion au Saint-Esprit très probable dans le contexte immédiat de Romains 8, sans ajouter son nom au texte.
- source_word: τὰ τοῦ πνεύματος
  choice: ce qui relève de l’Esprit
  rationale: Le parallélisme avec la chair est conservé, ainsi que l’étendue volontairement générale de l’expression grecque.
theological_decisions:
- issue: Sens de σάρξ
  choice: chair
  alternative: nature humaine pécheresse
  rationale: « Chair » conserve le terme théologique et l’opposition structurante du passage sans imposer une paraphrase interprétative plus étroite.
- issue: Référent de πνεῦμα
  choice: l’Esprit
  alternative: l’esprit
  rationale: Dans Romains 8, le contexte présente principalement l’Esprit de Dieu comme puissance et sphère de vie; la majuscule signale ce référent probable, tout en conservant le substantif non développé.
- issue: Portée de κατὰ ... ὄντες
  choice: vivent selon
  alternative: sont selon
  rationale: « Vivent selon » communique en français idiomatique une orientation existentielle; cela ne doit pas être compris comme désignant seulement des actes isolés.
translation_notes:
  register: Français international moderne, courant et digne. Le parallélisme grec est maintenu par la répétition de « portent leurs pensées » et de « ce qui relève de ». Aucun marqueur de note n’est requis.
