id: ROM.8.19
reference: Romans 8:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀποκαραδοκία τῆς κτίσεως τὴν ἀποκάλυψιν τῶν υἱῶν τοῦ θεοῦ ἀπεκδέχεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: fr
  text: Car la création attend avec un ardent désir la révélation des fils de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants de Dieu ». Le grec dit « fils », terme qui peut aussi souligner le statut filial et leur statut d’héritiers.
    reason: Alternative lexicale et conservation de la possible nuance de statut filial et d’héritage.
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: « Car » préserve le lien explicatif avec l’affirmation précédente tout en restant naturel dans un registre biblique moderne.
- source_word: ἀποκαραδοκία
  choice: avec un ardent désir
  rationale: Le nom exprime une attente intense et tendue vers ce qui vient. Une tournure adverbiale liée à « attend » donne en français une phrase naturelle sans en affaiblir la force.
- source_word: κτίσεως
  choice: la création
  rationale: Le terme est compris collectivement et désigne ici l’ordre créé, conformément à la portée cosmique du contexte.
- source_word: ἀποκάλυψιν
  choice: la révélation
  rationale: « Révélation » conserve l’idée de manifestation publique de ce qui est encore caché.
- source_word: υἱῶν
  choice: fils
  rationale: Le grec emploie le masculin pluriel « fils »; ce choix conserve aussi la possible résonance de statut filial et d’héritage dans l’argument de Paul.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Cette formulation rend directement le génitif de relation.
- source_word: ἀπεκδέχεται
  choice: attend
  rationale: Le sens d’attente tournée vers l’avenir est exprimé par « attend », tandis que son intensité est portée par « avec un ardent désir », ce qui évite une répétition lourde.
theological_decisions:
- issue: Faut-il rendre υἱῶν θεοῦ par « fils de Dieu » ou par la formulation inclusive « enfants de Dieu »?
  choice: fils de Dieu
  alternative: enfants de Dieu
  rationale: « Fils » correspond au masculin explicite du grec et peut préserver la nuance paulinienne de statut filial et d’héritage. La note indique l’autre traduction possible sans effacer l’ambiguïté de portée.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la relation explicative introduite par γὰρ et restitue l’intensité de l’attente sans reproduire la construction nominale grecque, peu naturelle en français.
