  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: fr
  text: 'Car vous n’avez pas reçu un esprit d’esclavage qui vous ramène à la peur[a], mais vous avez reçu un esprit d’adoption filiale[b], par qui nous crions[c] : « Abba ! Père ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de nouveau vers la peur » ; on pourrait aussi traduire : « qui vous fait retomber dans la peur ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’Esprit d’adoption filiale ». Le contexte favorise une référence au Saint-Esprit, mais le grec n’emploie pas d’article et maintient un parallélisme avec « un esprit d’esclavage ».'
    reason: alternative_reading
  - marker: c
    text: 'Plus littéralement : « en qui nous crions » ; le pronom grec, de genre neutre, s’accorde avec le mot « esprit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: un esprit d’esclavage
  rationale: Conserve l’image forte de l’esclavage et le parallélisme avec πνεῦμα υἱοθεσίας. L’article indéfini correspond naturellement à l’absence d’article grec sans imposer ici une identification personnelle.
- source_word: πάλιν εἰς φόβον
  choice: qui vous ramène à la peur
  rationale: Rend explicitement et naturellement πάλιν (« de nouveau, en arrière ») et εἰς φόβον (« vers/dans la peur »). Le pronom « vous » explicite seulement le sujet déjà présent dans « vous avez reçu ».
- source_word: πνεῦμα υἱοθεσίας
  choice: l’Esprit d’adoption filiale
  rationale: Le contexte immédiat de Romains 8 favorise une référence au Saint-Esprit, tandis que « d’adoption filiale » conserve la formulation nominale et la dimension de statut familial de υἱοθεσία. Une note préserve la possibilité formelle de lire « un esprit ».
- source_word: υἱοθεσίας
  choice: adoption filiale
  rationale: Cette expression française exprime à la fois l’adoption et l’accès au statut de fils, avec ses implications familiales et successorales, sans réduire le terme à un simple sentiment d’appartenance.
- source_word: ἐν ᾧ
  choice: par qui
  rationale: Rend le sens instrumental probable dans un français naturel lorsque l’antécédent est l’Esprit personnel. La traduction plus littérale « en qui » est signalée en note.
- source_word: κράζομεν
  choice: nous crions
  rationale: Préserve la force vive et pressante du verbe, sans l’affaiblir en « nous disons ».
- source_word: Αββα ὁ πατήρ
  choice: Abba ! Père !
  rationale: Transcrit le terme araméen et traduit son apposition grecque. Les points d’exclamation rendent la vigueur de l’invocation introduite par κράζομεν.
theological_decisions:
- issue: πνεῦμα υἱοθεσίας désigne-t-il explicitement le Saint-Esprit ou une disposition liée à l’adoption ?
  choice: « l’Esprit d’adoption filiale » dans le texte principal
  alternative: « un esprit d’adoption filiale »
  rationale: Le contexte de Romains 8, l’action attribuée à l’Esprit et l’invocation adressée au Père favorisent la référence personnelle au Saint-Esprit. Toutefois, l’absence d’article et le parallélisme avec « un esprit d’esclavage » permettent formellement l’autre lecture, conservée en note.
- issue: Valeur de ἐν ᾧ
  choice: « par qui » avec une valeur instrumentale et personnelle
  alternative: « en qui » ou « dans lequel »
  rationale: « Par qui » est idiomatique et cohérent avec la référence contextuelle au Saint-Esprit, mais la note maintient la construction grecque plus littérale et l’ambiguïté grammaticale.
- issue: Portée masculine de υἱοθεσία
  choice: « adoption filiale »
  alternative: « adoption » ou « statut de fils »
  rationale: La formulation retenue préserve l’idée juridique et familiale de l’accès au statut de fils — notamment sa dimension successorale dans le contexte — sans suggérer que la promesse exclut les femmes.
translation_notes:
  register: Français international moderne, digne et accessible. « Adoption filiale » conserve la nuance juridique et familiale sans recourir à une périphrase trop lourde. La majuscule à « Esprit » suit la lecture contextuellement la plus probable, tandis que les notes préservent les ambiguïtés grammaticale et interprétative du grec.
