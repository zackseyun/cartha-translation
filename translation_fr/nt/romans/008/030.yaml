  variant: modern international French
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: fr
  text: Et ceux qu’il a prédestinés[a], il les a aussi appelés ; ceux qu’il a appelés, il les a aussi justifiés ; et ceux qu’il a justifiés, il les a aussi glorifiés[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « destinés d’avance ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « glorifiés » au passé ; certains comprennent que Paul parle ici d’une gloire future si certaine qu’il la présente comme déjà accomplie.
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: a prédestinés
  rationale: Le verbe exprime une détermination préalable. « Prédestiner » en est l’équivalent français établi et conserve la formulation concise de Paul sans préciser un système doctrinal particulier.
- source_word: ἐκάλεσεν
  choice: a appelés
  rationale: « Appeler » est l’équivalent naturel et traditionnel ici ; il maintient le lien verbal dans la chaîne argumentative sans préciser la nature de l’appel.
- source_word: ἐδικαίωσεν
  choice: a déclarés justes
  rationale: Dans cet emploi paulinien, le verbe possède couramment une portée judiciaire. « Déclarer justes » rend ce sens de façon transparente pour le lecteur moderne, sans exiger la maîtrise du terme technique « justifier ».
- source_word: ἐδόξασεν
  choice: a glorifiés
  rationale: L’aoriste indicatif grec est conservé par un passé composé français. Cela respecte la forme du texte et sa progression rhétorique, même si la glorification peut être comprise comme future mais tenue pour certaine.
- source_word: οὓς ... τούτους
  choice: ceux que… il les
  rationale: Cette tournure française naturelle conserve l’insistance de la structure corrélative grecque et indique que le même groupe parcourt chaque étape.
- source_word: καὶ
  choice: aussi
  rationale: « Aussi » restitue la valeur additive de καί dans chaque proposition et souligne la progression répétée.
- source_word: δὲ
  choice: et
  rationale: δέ sert ici de liaison légère plutôt que d’opposition forte ; « et » convient au mouvement de la phrase.
theological_decisions:
- issue: Faut-il atténuer προώρισεν afin d’éviter ses implications confessionnelles ?
  choice: prédestinés
  alternative: destinés d’avance / déterminés d’avance
  rationale: Le grec affirme bien une détermination préalable. La traduction la conserve sans expliquer son mode, sa base ou sa portée au-delà de ce que dit le verset.
- issue: Faut-il traduire ἐδόξασεν au passé ou au futur ?
  choice: a glorifiés
  alternative: glorifiera
  rationale: Le texte grec emploie un aoriste indicatif. Le corps du texte en garde donc la forme passée ; la compréhension proleptique, selon laquelle une gloire future certaine est décrite comme déjà accomplie, est signalée en note.
- issue: Faut-il rendre ἐδικαίωσεν par un terme technique ou explicatif ?
  choice: a déclarés justes
  alternative: a justifiés
  rationale: « Déclarer justes » exprime clairement la portée judiciaire courante du verbe chez Paul, tandis que « justifier » demeure une traduction traditionnelle possible. Ce choix ne tranche pas les débats plus larges sur la justification.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition voulue de « ceux qu’il a… il les a aussi… » reproduit la chaîne rhétorique de Paul. Le passé composé est plus naturel que le passé simple dans ce registre tout en correspondant aux aoristes grecs.
