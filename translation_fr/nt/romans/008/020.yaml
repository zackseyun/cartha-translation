source:
  edition: SBLGNT
  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: fr
  text: Car la création a été soumise à la futilité[a], non de son plein gré, mais à cause de celui qui l’a soumise[b], dans l’espérance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vanité » ou « frustration ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec ne précise pas qui est « celui qui l’a soumise ».
    reason: alternative_reading
  - marker: c
    text: 'Ou : « avec espérance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: futilité
  rationale: Le terme désigne ici l’état décevant et privé d’aboutissement auquel la création est assujettie, plutôt qu’un mal moral. « Futilité » conserve la force du mot grec, tandis que la note indique des équivalents possibles.
- source_word: κτίσις
  choice: création
  rationale: Dans le contexte de Romains 8.19-22, le mot désigne collectivement l’ordre créé plutôt qu’une créature particulière.
- source_word: ὑπετάγη
  choice: a été soumise
  rationale: Cette formulation naturelle conserve la voix passive et exprime une condition imposée à la création.
- source_word: οὐχ ἑκοῦσα
  choice: non de son plein gré
  rationale: L’expression indique que la création n’a pas choisi elle-même cette condition. La formulation française est claire et idiomatique.
- source_word: διὰ τὸν ὑποτάξαντα
  choice: à cause de celui qui l’y a soumise
  rationale: Avec l’accusatif, διά a ici une valeur causale. « Celui qui » préserve l’indétermination du référent, et « l’y » renvoie sans lourdeur à la futilité.
- source_word: ἐφ’ ἑλπίδι
  choice: dans l’espérance
  rationale: Cette expression concise garde l’orientation vers l’avenir et le lien étroit entre la soumission de la création et l’espérance, sans préciser davantage le rapport logique.
theological_decisions:
- issue: Identité de « celui qui » a soumis la création
  choice: Le référent demeure non identifié dans le texte principal.
  alternative: On peut comprendre qu’il s’agit de Dieu, ou considérer que la chute d’Adam a occasionné cette soumission ; certains ont aussi proposé Satan, interprétation moins probable dans le contexte.
  rationale: Le grec ne nomme pas explicitement l’auteur de la soumission. La traduction conserve donc cette retenue et ne tranche pas la question théologique.
- issue: Lien de « dans l’espérance » avec la proposition précédente
  choice: L’expression reste placée à la fin, conformément à la structure grecque, sans explicitation.
  alternative: On peut rendre l’expression par « avec espérance » ou l’associer plus explicitement à l’action de soumettre.
  rationale: La formulation grecque est compacte et peut laisser ouverte la nuance exacte du rapport entre la soumission et l’espérance.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le passif, l’indétermination de l’auteur de la soumission et la formulation dense de la dernière expression.
