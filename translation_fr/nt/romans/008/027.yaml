reference: Romans 8:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: fr
  text: Or, celui qui sonde les cœurs sait quelle est la pensée de l’Esprit, car l’Esprit intercède pour les saints selon Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « conformément à la volonté de Dieu »; littéralement « selon Dieu ».
    reason: La variante explicite le sens probable de κατὰ θεόν tout en signalant que le grec n’emploie pas le mot « volonté ».
lexical_decisions:
- source_word: ἐραυνῶν
  choice: sonde
  rationale: « Sonder » exprime l’examen profond et pénétrant suggéré par ἐραυνάω, tout en convenant naturellement au complément « les cœurs ».
- source_word: καρδίας
  choice: les cœurs
  rationale: Cette traduction conserve la métaphore anthropologique biblique sans la réduire aux seules émotions ni la paraphraser.
- source_word: τί τὸ φρόνημα
  choice: la pensée
  rationale: Dans ce contexte, φρόνημα désigne l’orientation intérieure ou la manière de penser. « La pensée » est naturel en français et maintient le lien lexical avec le contexte de Romains 8.
- source_word: τοῦ πνεύματος
  choice: de l’Esprit
  rationale: Le contexte immédiat parle du Saint-Esprit; la majuscule rend cette référence explicite sans ajouter de désignation absente du grec.
- source_word: ἐντυγχάνει
  choice: intercède
  rationale: Le verbe a ici le sens de présenter une requête en faveur de quelqu’un, dans la continuité de l’action de l’Esprit décrite au verset précédent.
- source_word: ὑπὲρ ἁγίων
  choice: pour les saints
  rationale: « Pour » rend naturellement ὑπέρ avec le génitif, et « les saints » conserve le terme paulinien habituel pour les membres du peuple de Dieu.
- source_word: κατὰ θεὸν
  choice: selon Dieu
  rationale: Cette formulation volontairement concise suit le grec sans introduire explicitement le mot « volonté », absent du texte source.
theological_decisions:
- issue: Faut-il expliciter κατὰ θεὸν par « selon la volonté de Dieu » ?
  choice: Maintien de « selon Dieu » dans le texte principal.
  alternative: « conformément à la volonté de Dieu »
  rationale: Le contexte suggère une intercession conforme à la volonté divine, mais le grec ne contient pas le mot « volonté ». La formulation principale préserve donc la concision et la tension du texte, tandis que la note fournit l’explicitation courante.
- issue: Référent du sujet implicite de ἐντυγχάνει
  choice: « celui-ci » renvoie à l’Esprit.
  alternative: Répéter « l’Esprit »
  rationale: Le contexte immédiat, notamment le verset précédent, présente l’Esprit comme celui qui intercède. Le pronom évite une répétition lourde tout en clarifiant le référent en français.
translation_notes:
  register: Français international moderne, digne et accessible. « Sonde les cœurs » et « les saints » conservent les images et le vocabulaire bibliques usuels. « Selon Dieu » demeure volontairement compact et quelque peu marqué afin de ne pas résoudre silencieusement l’ambiguïté du grec.
