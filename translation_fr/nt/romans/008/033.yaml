  yaml_path: translation/nt/romans/008/033.yaml
  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: fr
  text: Qui portera une accusation contre ceux que Dieu a choisis[a] ? C’est Dieu qui les déclare justes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les élus de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « C’est Dieu qui les justifie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: Qui
  rationale: Le pronom interrogatif introduit une question rhétorique; « Qui » est direct et naturel.
- source_word: ἐγκαλέσει
  choice: portera une accusation
  rationale: Le verbe appartient au registre judiciaire et désigne l’action d’intenter une accusation.
- source_word: κατὰ
  choice: contre
  rationale: Avec un verbe d’accusation, la préposition exprime naturellement l’hostilité judiciaire dirigée contre quelqu’un.
- source_word: ἐκλεκτῶν θεοῦ
  choice: ceux que Dieu a choisis
  rationale: L’adjectif substantivé désigne les personnes choisies par Dieu; cette formulation reste claire sans imposer un terme théologique technique.
- source_word: θεὸς ὁ δικαιῶν
  choice: C’est Dieu qui les déclare justes
  rationale: La tournure clivée restitue l’emphase sur Dieu; « déclare justes » rend explicitement le sens judiciaire de δικαιόω dans ce contexte.
theological_decisions:
- issue: Rendre ἐκλεκτῶν sans importer un système doctrinal ultérieur
  choice: ceux que Dieu a choisis
  alternative: les élus de Dieu
  rationale: La formulation choisie exprime directement l’élection divine tout en évitant que le terme technique « élus » détermine à lui seul son interprétation.
- issue: Rendre la force judiciaire de ὁ δικαιῶν
  choice: qui les déclare justes
  alternative: qui les justifie
  rationale: Dans ce contexte d’accusation, l’expression indique un verdict favorable rendu par Dieu. « Déclare justes » rend ce sens accessible sans expliquer davantage les fondements ou les modalités de ce verdict.
- issue: Interpréter l’ellipse θεὸς ὁ δικαιῶν
  choice: 'une affirmation emphatique : « C’est Dieu qui… »'
  alternative: 'une question : « Dieu, qui les déclare justes ? »'
  rationale: La ponctuation n’appartient pas au texte grec ancien, mais la lecture affirmative s’accorde naturellement avec le contraste entre l’accusateur éventuel et Dieu qui prononce le verdict. L’ambiguïté de ponctuation mérite toutefois d’être signalée.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire judiciaire est conservé par « accusation » et « déclare justes ». La répétition explicite du pronom « les » est idiomatique en français et reprend ceux que Dieu a choisis.
