id: ROM.8.16
reference: Romans 8:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: fr
  text: L’Esprit lui-même témoigne avec notre esprit que nous sommes enfants de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rend témoignage à notre esprit » ; le grec peut être compris comme un témoignage rendu avec notre esprit ou comme un témoignage qui lui est adressé.
    reason: ambiguïté_syntaxique
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: L’Esprit lui-même
  rationale: La construction avec αὐτό est emphatique. « Lui-même » restitue naturellement cette insistance en français et convient à l’action personnelle attribuée ici à l’Esprit.
- source_word: συμμαρτυρεῖ
  choice: témoigne avec
  rationale: Le verbe exprime un témoignage rendu conjointement ou aux côtés de quelqu’un. « Témoigne avec » est clair et conserve la valeur associative du préfixe συν-.
- source_word: τῷ πνεύματι ἡμῶν
  choice: avec notre esprit
  rationale: 'Le datif est compris comme un datif d’association régi par συμμαρτυρεῖ : l’Esprit témoigne conjointement avec notre esprit. L’autre analyse possible, « à notre esprit », est signalée en note.'
- source_word: ὅτι ἐσμὲν
  choice: que nous sommes
  rationale: Cette formulation rend directement la proposition de contenu introduite par ὅτι, sans ajouter d’emphase absente du grec.
- source_word: τέκνα θεοῦ
  choice: enfants de Dieu
  rationale: τέκνα désigne les enfants sans distinction de sexe. « Enfants de Dieu » est une expression française naturelle, digne et fidèle au lien familial exprimé.
theological_decisions:
- issue: Relation entre le témoignage de l’Esprit et notre esprit
  choice: témoigne avec notre esprit
  alternative: rend témoignage à notre esprit
  rationale: Le composé συμμαρτυρεῖ favorise l’idée d’un témoignage conjoint, sans exclure totalement l’interprétation selon laquelle l’Esprit adresse ou confirme ce témoignage à l’esprit humain. La traduction principale suit la valeur associative la plus explicite et la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, simple et digne. « L’Esprit » et « notre esprit » maintiennent la distinction du grec entre l’Esprit de Dieu et l’esprit humain. La formulation conserve l’emphase de αὐτό sans alourdir la phrase.
