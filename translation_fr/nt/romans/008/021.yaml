id: ROM.8.21
reference: Romans 8:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: fr
  text: car la création elle-même sera, elle aussi, libérée de l’esclavage de la corruption pour entrer dans la liberté glorieuse des enfants de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « dans la liberté de la gloire des enfants de Dieu ».'
    reason: La note préserve la chaîne de génitifs du grec, dont la formulation littérale laisse ouverte la relation précise entre la liberté, la gloire et les enfants de Dieu.
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Dans le contexte, la conjonction donne la raison de l’espérance mentionnée au verset précédent; « car » exprime naturellement cette valeur causale.
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: la création elle-même sera, elle aussi
  rationale: '« Elle-même » conserve l’insistance portée par αὐτή, tandis que « elle aussi » rend la valeur additive de καί: la création participe également à la libération à venir.'
- source_word: ἐλευθερωθήσεται
  choice: sera […] libérée
  rationale: Le futur passif annonce une libération future dont la création est bénéficiaire, sans préciser ici l’agent.
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: de l’esclavage de la corruption
  rationale: « Esclavage » maintient la force de δουλεία. Dans ce contexte cosmique, « corruption » désigne principalement la dégradation, la périssabilité et la mortalité auxquelles la création est soumise.
- source_word: εἰς τὴν ἐλευθερίαν
  choice: pour entrer dans la liberté
  rationale: La formulation française exprime le passage vers un nouvel état marqué par εἰς, tout en restant fluide.
- source_word: τῆς δόξης
  choice: glorieuse
  rationale: L’adjectif offre un français naturel et fait de la gloire la caractéristique de cette liberté. La construction génitive plus littérale est conservée en note.
- source_word: τῶν τέκνων τοῦ θεοῦ
  choice: des enfants de Dieu
  rationale: « Enfants » rend le terme inclusif τέκνα et conserve l’expression familiale familière au langage biblique.
theological_decisions:
- issue: Sens de la chaîne génitive τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: la liberté glorieuse des enfants de Dieu
  alternative: la liberté de la gloire des enfants de Dieu
  rationale: La formulation retenue est naturelle en français et associe étroitement liberté et gloire sans définir davantage leur relation. La note préserve la construction grecque et son ambiguïté.
- issue: Portée de φθορά
  choice: corruption au sens de dégradation et de périssabilité
  alternative: corruption morale
  rationale: Le sujet est ici la création soumise à la vanité et appelée à être libérée; la dégradation physique et la périssabilité dominent donc, sans exclure toute la richesse du terme.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la métaphore forte de l’esclavage, le futur passif et la double insistance de καὶ αὐτή, tout en rendant idiomatiquement le mouvement exprimé par εἰς.
