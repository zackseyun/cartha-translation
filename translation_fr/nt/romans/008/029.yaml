id: ROM.8.29
reference: Romans 8:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: fr
  text: Car ceux qu’il a connus d’avance[a], il les a aussi prédestinés à être conformes à l’image de son Fils, afin que celui-ci soit le premier-né parmi beaucoup de frères[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « connus par avance » ; certains comprennent ici « connaître » dans un sens relationnel, c’est-à-dire « porter d’avance son regard sur eux ».
    reason: alternative_reading
  - marker: b
    text: Le mot grec traduit par « frères » est grammaticalement masculin ; il peut ici désigner aussi bien des hommes que des femmes appartenant à la famille de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit ici l’explication de l’affirmation précédente ; « Car » conserve ce lien logique avec concision.
- source_word: προέγνω
  choice: a connus d’avance
  rationale: Cette formulation rend directement le sens temporel du verbe grec tout en laissant ouverte sa portée précise, cognitive ou relationnelle.
- source_word: προώρισεν
  choice: a prédestinés
  rationale: « Prédestiner » correspond précisément au verbe grec et en conserve à la fois l’antériorité et l’orientation vers un dessein.
- source_word: συμμόρφους
  choice: à être conformes
  rationale: Le terme exprime une conformité de forme ou une ressemblance profonde ; cette traduction reste naturelle en français et conserve la nuance de transformation.
- source_word: τῆς εἰκόνος
  choice: à l’image
  rationale: « Image » est l’équivalent direct et préserve les résonances bibliques du terme.
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: de son Fils
  rationale: Le titre filial explicite est maintenu, avec la majuscule française usuelle lorsqu’il désigne le Christ.
- source_word: εἰς τὸ εἶναι
  choice: afin que celui-ci soit
  rationale: La construction indique ici le but, sans exclure entièrement la nuance de résultat. « Celui-ci » désigne clairement le Fils.
- source_word: πρωτότοκον
  choice: le premier-né
  rationale: Cette traduction conserve la métaphore familiale et sa portée de rang ou de primauté sans la remplacer par une interprétation.
- source_word: ἐν πολλοῖς ἀδελφοῖς
  choice: parmi beaucoup de frères
  rationale: La formulation rend directement la préposition, l’adjectif quantitatif et le pluriel masculin du grec.
theological_decisions:
- issue: La portée de προέγνω dans le rapport entre connaissance préalable et prédestination.
  choice: « connus d’avance », sans préciser le mécanisme ou la nature de cette connaissance.
  alternative: « choisis d’avance » ou « aimés d’avance » dans un sens explicitement relationnel et électif.
  rationale: Le grec peut porter une densité relationnelle, mais le verset ne l’explicite pas. La traduction ne tranche donc pas un débat doctrinal que le texte laisse ouvert.
- issue: 'La force de εἰς τὸ εἶναι : but ou résultat.'
  choice: « afin que », qui met en avant le but.
  alternative: « de sorte que », qui soulignerait davantage le résultat.
  rationale: Dans ce contexte, la visée du dessein divin est saillante, tout en reconnaissant que la construction grecque peut associer but et résultat.
- issue: La portée de ἀδελφοῖς quant au genre des personnes désignées.
  choice: Conserver « frères » dans le texte et préciser en note que le groupe peut inclure des femmes.
  alternative: « frères et sœurs » dans le texte principal.
  rationale: Le nom grec est grammaticalement masculin, tandis que son emploi collectif peut viser l’ensemble de la famille de Dieu. La note préserve ces deux données.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde le mouvement argumentatif et la densité théologique du grec, tout en évitant les tournures inutilement archaïques.
