    rationale: Le connecteur introduit une conséquence explicite qui n’est pas marquée dans le grec. Le participe « en envoyant » suffit à exprimer le moyen de l’action divine.
  - severity: medium
    issue: « Condition semblable » affaiblit l’image de ὁμοίωμα
    rationale: Le grec parle de « ressemblance » en rapport avec une « chair de péché ». Une formulation centrée sur la chair conserve mieux cette construction et son équilibre christologique sans surinterprétation.
