id: ROM.8.3
reference: Romans 8:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: fr
  text: 'Car ce que la Loi ne pouvait accomplir, parce qu’elle était sans force à cause de la chair[a], Dieu l’a fait : en envoyant son propre Fils dans une chair semblable à celle marquée par le péché[b] et pour le péché[c], il a condamné le péché dans la chair[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « l’incapacité de la Loi ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression grecque, très condensée, signifie littéralement « dans la ressemblance d’une chair de péché ». Elle affirme la réelle humanité du Fils tout en évitant de lui attribuer le péché.
    reason: cultural_note
  - marker: c
    text: 'Ou : « en sacrifice pour le péché ». L’expression grecque « pour le péché » peut souvent avoir ce sens sacrificiel dans les Écritures grecques.'
    reason: alternative_reading
  - marker: d
    text: Le grec dit « dans la chair », sans préciser explicitement « dans sa chair ».
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: ce que la loi était incapable de faire
  rationale: Cette formulation française naturelle restitue l’expression neutre désignant l’incapacité de la loi, sans transformer la loi elle-même en chose impossible.
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: parce que la chair la rendait impuissante
  rationale: Le tour explicite le lien causal et conserve la chair comme ce par quoi la loi se trouvait sans force, tout en évitant le calque peu naturel « elle était faible par la chair ».
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: son propre Fils
  rationale: « Propre » rend l’insistance de ἑαυτοῦ sur la relation personnelle du Fils à Dieu.
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: dans une condition semblable à celle de la chair marquée par le péché
  rationale: Cette formulation préserve à la fois ὁμοίωμα et le génitif compact σαρκὸς ἁμαρτίας, sans attribuer directement le péché au Fils ni réduire σάρξ à « nature pécheresse ».
- source_word: περὶ ἁμαρτίας
  choice: pour le péché
  rationale: Le rendu large et formel conserve l’ambiguïté entre une référence générale au péché et la nuance sacrificielle bien attestée par l’usage scripturaire.
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: il a condamné le péché
  rationale: « Condamné » conserve directement la force judiciaire du verbe.
- source_word: ἐν τῇ σαρκί
  choice: dans la chair
  rationale: L’absence de pronom dans le grec est respectée, afin de ne pas préciser silencieusement « dans sa chair ».
theological_decisions:
- issue: Sens de σάρξ dans les deux occurrences
  choice: Conserver « chair » et ne pas employer « nature pécheresse ».
  alternative: « nature pécheresse » ou « faiblesse humaine »
  rationale: « Chair » maintient la continuité lexicale et la tension paulinienne entre la faiblesse humaine par laquelle la loi est impuissante et la sphère incarnée où le péché est condamné.
- issue: Sens de περὶ ἁμαρτίας
  choice: « pour le péché » dans le texte principal
  alternative: « en sacrifice pour le péché »
  rationale: Le sens sacrificiel est plausible, notamment à la lumière de la Septante, mais le grec peut rester plus général. Le texte principal préserve donc cette amplitude, et la note signale l’interprétation sacrificielle.
- issue: Portée christologique de ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: Affirmer une condition réellement comparable à la chair humaine marquée par le péché, sans dire que le Fils était pécheur.
  alternative: « dans une chair pécheresse » ou une reformulation niant la pleine humanité
  rationale: 'La formulation conserve la distinction soigneuse opérée par ὁμοίωμα : elle n’efface ni la véritable venue du Fils dans la condition humaine ni sa distinction d’avec le péché.'
- issue: Référent de « dans la chair »
  choice: Ne pas ajouter « sa ».
  alternative: « dans sa chair »
  rationale: Le contexte peut orienter vers la chair du Fils, mais l’expression grecque demeure compacte et sans possessif ; la traduction laisse donc subsister cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit la progression argumentative grecque, tout en ajoutant « Dieu l’a fait », complément implicite nécessaire en français. Les deux occurrences de « chair » sont maintenues, et les ambiguïtés de περὶ ἁμαρτίας ainsi que de ἐν τῇ σαρκί sont signalées sans être résolues dans le texte principal.
