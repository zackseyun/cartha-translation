revisions:
- from: 'Car ce que la loi était incapable de faire[a], parce que la chair la rendait impuissante, Dieu l’a fait : il a envoyé son propre Fils dans une condition semblable à celle de la chair marquée par le péché[b] et pour le péché[c] ; ainsi, il a condamné le péché dans la chair[d].'
  to: 'Car ce que la Loi ne pouvait accomplir, parce qu’elle était sans force à cause de la chair[a], Dieu l’a fait : en envoyant son propre Fils dans une chair semblable à celle marquée par le péché[b] et pour le péché[c], il a condamné le péché dans la chair[d].'
  rationale: 'La révision resserre le texte sur la syntaxe et les images du grec : la Loi est dite sans force à cause de la chair, plutôt que rendue impuissante par elle; l’envoi du Fils est présenté comme le moyen de l’action divine; et ὁμοίωμα est rendu par une formulation directement liée à « chair ». Les ambiguïtés de περὶ ἁμαρτίας et de ἐν τῇ σαρκί sont conservées et documentées en notes.'
