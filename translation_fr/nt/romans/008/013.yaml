id: ROM.8.13
reference: Romans 8:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: fr
  text: En effet, si vous vivez selon la chair[a], vous allez mourir ; mais si, par l’Esprit, vous faites mourir les actes du corps, vous vivrez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « la chair » désigne l’existence humaine dirigée par ses tendances pécheresses, en opposition à la vie conduite par l’Esprit.
    reason: Clarification du sens métaphorique et éthique de σάρξ tout en conservant « chair » dans le texte.
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Rend naturellement la fonction explicative qui relie ce verset au raisonnement précédent.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Conserve la métaphore paulinienne et l’ambiguïté lexicale de σάρξ sans la réduire d’emblée à « nature pécheresse ».
- source_word: ζῆτε
  choice: vous vivez
  rationale: Le présent français correspond au présent grec dans cette proposition conditionnelle.
- source_word: μέλλετε ἀποθνῄσκειν
  choice: vous allez mourir
  rationale: Exprime naturellement la perspective indiquée par μέλλω avec l’infinitif, sans imposer une imminence excessive.
- source_word: πνεύματι
  choice: par l’Esprit
  rationale: Le datif est compris comme instrumental ; dans le contexte de Romains 8, la majuscule signale que l’Esprit Saint est le référent le plus probable.
- source_word: τὰς πράξεις τοῦ σώματος
  choice: les actes du corps
  rationale: « Actes » garde le sens concret de πράξεις et « du corps » reproduit explicitement le génitif.
- source_word: θανατοῦτε
  choice: vous faites mourir
  rationale: Rend la valeur causative et énergique du verbe dans un français actuel, sans recourir au terme archaïque « mortifier ».
- source_word: ζήσεσθε
  choice: vous vivrez
  rationale: Le futur simple rend directement et naturellement le futur grec.
theological_decisions:
- issue: Référent de πνεύματι
  choice: l’Esprit Saint, indiqué par la majuscule
  alternative: l’esprit humain, ou une formulation volontairement indéterminée
  rationale: Les références répétées à l’Esprit dans Romains 8 favorisent nettement l’Esprit Saint comme agent par lequel les actes du corps sont mis à mort.
- issue: Sens éthique de σάρξ
  choice: conserver « la chair » dans le texte
  alternative: « la nature pécheresse »
  rationale: « Chair » préserve l’image et la tension du vocabulaire de Paul ; la note indique le sens contextuel sans remplacer le terme source par une interprétation unique.
translation_notes:
  register: Français international moderne, digne et accessible. La structure conditionnelle parallèle est maintenue ; « vous allez mourir » reste idiomatique tout en reflétant μέλλετε, et « faites mourir » conserve la force de l’exhortation.
