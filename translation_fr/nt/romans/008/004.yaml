id: ROM.8.4
reference: Romans 8:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: fr
  text: afin que la juste exigence de la loi soit accomplie en nous, qui ne marchons pas selon la chair[b], mais selon l’Esprit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’esprit » ; dans le contexte de Romains 8, il s’agit probablement du Saint-Esprit.
    reason: alternative_reading
  - marker: b
    text: Ici, la « chair » désigne l’être humain dans sa condition déchue ou une vie orientée loin de Dieu ; certains traduisent par « nature pécheresse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Exprime naturellement en français la visée ou le résultat du dessein évoqué, tout en gardant la force finale de la proposition grecque.
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: la juste exigence de la loi
  rationale: δικαίωμα désigne ici ce que la loi exige à juste titre; cette formulation conserve à la fois la dimension juridique et la valeur morale du terme.
- source_word: πληρωθῇ
  choice: soit accomplie
  rationale: Le subjonctif passif français correspond à l’aoriste passif subjonctif grec après ἵνα et préserve l’idée d’accomplissement sans préciser l’agent.
- source_word: ἐν ἡμῖν
  choice: en nous
  rationale: Rend directement la préposition ἐν et évite d’introduire l’idée plus forte que l’exigence serait accomplie « par nous ».
- source_word: περιπατοῦσιν
  choice: marchons
  rationale: Conserve la métaphore paulinienne de la marche pour désigner la manière de vivre, métaphore qui demeure intelligible en français biblique moderne.
- source_word: σάρκα
  choice: chair
  rationale: Préserve le terme paulinien et son réseau de sens sans le réduire dans le texte principal à la seule notion de « nature pécheresse ».
- source_word: πνεῦμα
  choice: Esprit
  rationale: Dans le contexte immédiat de Romains 8, le Saint-Esprit est le référent le plus probable; une note maintient toutefois l’ambiguïté formelle du grec.
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: selon la chair… selon l’Esprit
  rationale: « Selon » rend clairement κατά dans ce contraste éthique et conserve la répétition structurante de Paul.
theological_decisions:
- issue: 'Référent de πνεῦμα : esprit humain ou Saint-Esprit'
  choice: l’Esprit
  alternative: l’esprit
  rationale: Le contexte de Romains 8 met fortement en avant l’action et la sphère du Saint-Esprit. La majuscule reflète ce jugement contextuel, tandis que la note signale l’autre lecture permise par la forme grecque.
- issue: 'Portée de ἐν ἡμῖν : accomplissement en nous ou par nous'
  choice: accomplie en nous
  alternative: accomplie par nous / parmi nous
  rationale: La traduction directe « en nous » respecte ἐν et laisse ouverte la relation exacte entre l’action divine et la vie des croyants, sans attribuer explicitement l’accomplissement à leur propre action.
- issue: Sens de δικαίωμα dans le rapport à la loi
  choice: la juste exigence de la loi
  alternative: l’exigence de la loi / la prescription juste de la loi
  rationale: La formulation retenue exprime que l’exigence est juste sans décider au-delà du texte de la manière précise dont elle est accomplie.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore « marcher » et le terme paulinien « chair » sont conservés pour leur portée intertextuelle; les ambiguïtés de πνεῦμα et de ἐν ἡμῖν ne sont pas résolues au-delà de ce que permet le contexte.
