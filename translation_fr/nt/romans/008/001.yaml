id: ROM.8.1
reference: Romans 8:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: fr
  text: Il n’y a donc maintenant aucune condamnation pour ceux qui sont dans le Messie[b] Jésus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits plus tardifs ajoutent : « qui ne marchent pas selon la chair ». Les témoins grecs les plus anciens appuient ici le texte plus court.'
    reason: textual_variant
  - marker: b
    text: Ou « Christ Jésus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: aucune
  rationale: Associé à κατάκριμα, ce terme forme en français la tournure naturelle et catégorique « aucune condamnation », qui conserve la négation emphatique du grec.
- source_word: ἄρα
  choice: donc
  rationale: « Donc » marque naturellement la conclusion que Paul tire de l’argument précédent.
- source_word: νῦν
  choice: maintenant
  rationale: Le terme est maintenu explicitement, car il souligne la réalité présente qui découle de l’œuvre de Dieu dans le Messie.
- source_word: κατάκριμα
  choice: condamnation
  rationale: « Condamnation » conserve le sens judiciaire d’un verdict défavorable, plutôt que celui d’un simple sentiment de culpabilité.
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: pour ceux qui sont dans le Messie Jésus
  rationale: Cette formulation est naturelle en français tout en préservant l’expression paulinienne « dans », porteuse de l’idée d’appartenance et d’union sans la réduire à une paraphrase explicative.
- source_word: Χριστῷ
  choice: Messie
  rationale: Le titre grec Χριστός est traduit par son sens, « Messie »; la variante traditionnelle « Christ » est signalée en note.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Forme française usuelle du nom personnel grec Ἰησοῦς.
theological_decisions:
- issue: Sens de l’expression « dans le Messie Jésus »
  choice: Une expression d’union et d’appartenance désignant ceux qui sont incorporés au Messie Jésus.
  alternative: Un sens plus lâche, tel que « à cause du Messie Jésus ».
  rationale: Le grec ἐν est rendu par « dans » afin de conserver la richesse et la tension théologiques de la participation ou de l’union au Messie, sans les ramener à une seule explication.
translation_notes:
  register: Français international moderne, clair et digne. La construction « Il n’y a donc maintenant » restitue de façon idiomatique l’ordre logique du grec, tandis que « dans le Messie Jésus » en préserve volontairement la formulation théologiquement dense.
