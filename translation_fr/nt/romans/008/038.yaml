  variant: modern international French
source:
  edition: SBLGNT
  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: fr
  text: Car je suis convaincu que ni la mort ni la vie, ni les anges ni les autorités[a], ni le présent ni l’avenir, ni les puissances,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dominations » ou « principautés »; il peut s’agir d’autorités cosmiques ou spirituelles.
    reason: Alternative lexicale préservant l’étendue possible de ἀρχαί.
lexical_decisions:
- source_word: πέπεισμαι
  choice: j’ai la conviction
  rationale: Le parfait exprime une conviction acquise qui demeure; cette formulation est naturelle en français moderne et met en valeur son caractère ferme.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit la justification ou l’appui de l’affirmation précédente; « Car » en conserve clairement la fonction logique.
- source_word: οὔτε ... οὔτε
  choice: ni ... ni
  rationale: La répétition de « ni » reproduit la structure corrélative et le rythme cumulatif du grec.
- source_word: θάνατος
  choice: la mort
  rationale: Équivalent direct et usuel, en opposition à « la vie ».
- source_word: ζωή
  choice: la vie
  rationale: Équivalent direct et usuel, en opposition à « la mort ».
- source_word: ἄγγελοι
  choice: les anges
  rationale: Bien que le mot puisse désigner des messagers, l’énumération de réalités cosmiques ou suprahumaines favorise ici « anges ».
- source_word: ἀρχαὶ
  choice: les dominations
  rationale: Le terme peut désigner des autorités dirigeantes ou des puissances cosmiques. « Dominations » conserve cette portée possible sans l’identifier à une catégorie doctrinale précisément définie.
- source_word: ἐνεστῶτα
  choice: le présent
  rationale: Le participe substantivé désigne les réalités présentes; « le présent » est concis, naturel et parallèle à « l’avenir ».
- source_word: μέλλοντα
  choice: l’avenir
  rationale: Le participe substantivé désigne ce qui doit venir; « l’avenir » rend naturellement l’opposition temporelle avec « le présent ».
- source_word: δυνάμεις
  choice: les puissances
  rationale: Ce rendu direct préserve l’ambiguïté entre êtres ou autorités spirituels et forces puissantes.
theological_decisions:
- issue: Faut-il rendre ἀρχαὶ et δυνάμεις comme des noms techniques désignant des êtres spirituels?
  choice: « dominations » et « puissances » dans le texte principal
  alternative: « autorités » et « puissances »; « principautés » et « puissances »
  rationale: Le contexte peut viser des puissances cosmiques ou spirituelles, mais les termes grecs gardent une certaine largeur sémantique. Le texte principal évite donc de fixer une hiérarchie spirituelle propre à un système doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence de l’énumération grecque est conservée par la répétition de « ni ». La phrase reste ouverte par une virgule, puisque le verset se poursuit en Romains 8.39.
