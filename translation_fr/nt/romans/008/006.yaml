id: ROM.8.6
reference: Romans 8:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: fr
  text: En effet, la manière de penser de la chair[a], c’est la mort, tandis que la manière de penser de l’Esprit[b], c’est la vie et la paix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la nature pécheresse ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de l’esprit ».
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Marque naturellement en français la valeur explicative qui relie cette affirmation au raisonnement précédent.
- source_word: φρόνημα
  choice: manière de penser
  rationale: Exprime une orientation durable de la pensée, et non la seule activité intellectuelle; cette formulation reste claire pour le lecteur moderne.
- source_word: σάρξ
  choice: chair
  rationale: Conserve le terme clé de Paul et sa tension théologique sans le réduire d’emblée à une interprétation comme « nature pécheresse ».
- source_word: θάνατος
  choice: mort
  rationale: Rendu direct qui préserve toute la portée littérale et théologique de l’antithèse.
- source_word: πνεῦμα
  choice: Esprit
  rationale: Dans le contexte de Romains 8, le mot désigne très probablement l’Esprit Saint; la majuscule rend ce choix tout en signalant l’autre possibilité en note.
- source_word: ζωή
  choice: vie
  rationale: Rendu direct qui maintient l’opposition concise avec « mort ».
- source_word: εἰρήνη
  choice: paix
  rationale: Équivalent français courant qui conserve l’ampleur du terme et son association avec la vie.
theological_decisions:
- issue: πνεῦμα désigne-t-il l’Esprit Saint ou l’esprit humain ?
  choice: Esprit Saint (« Esprit »)
  alternative: esprit humain, ou esprit au sens plus général (« esprit »)
  rationale: Le contexte immédiat de Romains 8 présente à plusieurs reprises l’Esprit comme l’agent divin de la vie, mais la graphie grecque ne tranche pas à elle seule; l’autre lecture est donc conservée en note.
- issue: Sens métaphorique de σάρξ
  choice: chair
  alternative: nature pécheresse
  rationale: « Chair » maintient le vocabulaire et la tension propres à Paul, tandis que « nature pécheresse » explicite une interprétation possible mais plus étroite.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « la manière de penser » reproduit le parallélisme grec et évite de masquer l’opposition entre la chair et l’Esprit.
