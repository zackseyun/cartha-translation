id: ROM.8.22
reference: Romans 8:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: fr
  text: Car nous savons que la création tout entière gémit ensemble et souffre ensemble les douleurs de l’accouchement jusqu’à maintenant[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute la création » ; on pourrait aussi comprendre « toute chose créée », mais le sens cosmique collectif est plus probable ici.
    reason: lexical_alternative
  - marker: b
    text: 'L’expression grecque évoque les douleurs de l’accouchement : elle suggère non seulement la souffrance, mais aussi une souffrance tendue vers une naissance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: nous savons
  rationale: Le parfait grec οἶδα a couramment un sens présent et exprime ici un savoir partagé et établi.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication qui rattache ce verset au raisonnement précédent.
- source_word: πᾶσα ἡ κτίσις
  choice: la création tout entière
  rationale: Avec l’article, l’expression a naturellement un sens collectif. Dans le contexte de Romains 8.19-23, elle désigne largement l’ordre créé plutôt que chaque créature prise séparément.
- source_word: συστενάζει
  choice: gémit ensemble
  rationale: Cette formulation conserve le préfixe συν-, qui exprime un gémissement partagé, tout en restant intelligible en français.
- source_word: συνωδίνει
  choice: souffre ensemble les douleurs de l’accouchement
  rationale: Le verbe évoque précisément les douleurs de l’enfantement et son préfixe συν- souligne leur caractère partagé.
- source_word: ἄχρι τοῦ νῦν
  choice: jusqu’à maintenant
  rationale: Rendu direct qui conserve l’idée d’une situation se prolongeant jusqu’au présent.
theological_decisions:
- issue: Faut-il rendre κτίσις par « création » ou par « créature/chose créée » ?
  choice: la création tout entière
  alternative: toute créature ; toute chose créée
  rationale: Dans Romains 8.19-23, Paul personnifie l’ordre créé non humain, soumis à la précarité et dans l’attente de sa libération. « La création tout entière » préserve cette portée cosmique sans réduire le référent à des êtres individuels.
- issue: L’image des douleurs indique-t-elle seulement la souffrance ou une souffrance orientée vers une naissance ?
  choice: conserver explicitement l’image des douleurs de l’accouchement
  alternative: souffre ensemble ; est dans la détresse
  rationale: Le grec συνωδίνει appartient au champ de l’enfantement. La traduction garde donc l’image, sans préciser au-delà du texte la nature exacte de la vie nouvelle attendue.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « ensemble » reflète les deux verbes grecs formés avec συν-, malgré une légère lourdeur stylistique, afin de préserver leur dimension collective. « Douleurs de l’accouchement » est plus courant et immédiatement compréhensible que « douleurs de l’enfantement ».
