id: ROM.8.26
reference: Romans 8:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: fr
  text: De même, l’Esprit aussi nous vient en aide dans notre faiblesse. En effet, nous ne savons pas quoi demander dans nos prières comme il convient, mais l’Esprit lui-même intercède par des gémissements inexprimables[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par des gémissements sans paroles ».'
    reason: Le terme ἀλαλήτοις peut désigner ce qui ne peut être exprimé ou ce qui n’est pas formulé en paroles.
lexical_decisions:
- source_word: Ὡσαύτως
  choice: De même
  rationale: Relie naturellement cette action de l’Esprit à ce qui précède, sans préciser davantage la comparaison.
- source_word: συναντιλαμβάνεται
  choice: nous vient en aide
  rationale: Exprime une assistance active dans la faiblesse tout en restant idiomatique en français moderne.
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: dans notre faiblesse
  rationale: Conserve le singulier collectif et ne réduit pas la faiblesse à une incapacité exclusivement physique ou spirituelle.
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: nous ne savons pas quoi demander dans nos prières comme il convient
  rationale: Préserve à la fois l’objet de la prière, introduit par τί, et l’idée de convenance exprimée par καθὸ δεῖ, sans trancher plus précisément la nature du besoin.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: l’Esprit lui-même
  rationale: Rend l’emphase grecque et l’action personnelle attribuée à l’Esprit; le masculin est en outre grammaticalement naturel en français.
- source_word: ὑπερεντυγχάνει
  choice: intercède
  rationale: Équivalent français concis et précis pour l’intervention de l’Esprit en faveur des croyants.
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: par des gémissements inexprimables
  rationale: Conserve l’ambiguïté entre des gémissements impossibles à formuler et des gémissements qui ne passent pas par des paroles; une autre possibilité est signalée en note.
theological_decisions:
- issue: La relation entre l’Esprit et les gémissements
  choice: l’Esprit lui-même intercède par des gémissements
  alternative: l’Esprit intercède au moyen de nos gémissements
  rationale: La syntaxe attribue directement l’intercession à l’Esprit sans identifier explicitement les gémissements comme ceux des croyants; la traduction évite donc d’ajouter un possesseur.
- issue: Le caractère personnel de l’action de l’Esprit
  choice: l’Esprit lui-même
  alternative: l’Esprit en personne
  rationale: L’emphase de αὐτὸ et les verbes d’aide et d’intercession présentent l’Esprit comme agent; « lui-même » le rend sans ajouter de formulation doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Nous vient en aide » est plus naturel que le calque du verbe composé grec, tandis que « comme il convient » maintient la tension entre ce qu’il faut demander et la manière appropriée de prier.
