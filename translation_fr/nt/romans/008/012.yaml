source:
  edition: SBLGNT
  text: Ἄρα οὖν, ἀδελφοί, ὀφειλέται ἐσμέν, οὐ τῇ σαρκὶ τοῦ κατὰ σάρκα ζῆν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: fr
  text: Ainsi donc, frères[a], nous ne sommes pas redevables envers la chair[b], au point de vivre selon la chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères » comme terme d’adresse à l’ensemble de la communauté croyante.
    reason: lexical_alternative
  - marker: b
    text: 'Ici, la « chair » désigne la condition humaine marquée par le péché ; autre traduction possible : « nature pécheresse ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Ainsi donc
  rationale: L’expression marque la conclusion tirée du raisonnement précédent tout en assurant la transition. « Ainsi donc » en conserve les deux nuances dans un français soutenu mais courant.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le grec emploie le masculin pluriel comme terme d’adresse à la communauté croyante. « Frères » en préserve la forme, tandis qu’une note précise sa portée collective.
- source_word: ὀφειλέται ἐσμέν
  choice: nous sommes débiteurs
  rationale: Le substantif signifie littéralement « débiteurs » et exprime ici une obligation plutôt qu’une dette financière. Cette formulation conserve l’image de la dette présente dans le grec.
- source_word: τῇ σαρκί
  choice: envers la chair
  rationale: La préposition sous-entendue par le datif désigne ce à quoi une dette serait due. « Envers » rend cette relation naturellement en français, tandis que « chair » maintient le vocabulaire théologique de Paul.
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: pour vivre selon la chair
  rationale: 'L’infinitif articulé précise l’obligation exclue : vivre suivant la norme ou l’orientation de la chair. « Selon la chair » reprend l’expression paulinienne sans en résoudre l’ambiguïté.'
theological_decisions:
- issue: Sens de σάρξ dans le contraste paulinien entre la chair et l’Esprit
  choice: chair
  alternative: nature pécheresse
  rationale: « Chair » préserve le terme et la tension propres au raisonnement de Paul, sans réduire celui-ci au seul corps physique ni imposer une paraphrase doctrinale. La note signale le sens métaphorique contextuel et l’autre traduction possible.
translation_notes:
  register: Français international moderne, digne et accessible. La structure garde l’image des débiteurs ainsi que la répétition de « chair », importante dans le contexte immédiat. « Mais » explicite naturellement en français l’opposition portée par οὐ, sans modifier le contenu de la phrase.
