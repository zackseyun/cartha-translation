  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἐν σαρκὶ ὄντες θεῷ ἀρέσαι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/008.yaml
  text: Those who are in the flesh cannot please God[a].
translation:
  language: fr
  text: Or, ceux qui sont dans la chair ne peuvent pas plaire à Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sous l’emprise de la nature pécheresse ». Le grec dit littéralement « dans la chair », expression clé chez Paul dans ce contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: ceux qui sont
  rationale: L’article suivi du participe désigne ici une catégorie de personnes. « Ceux qui sont » est naturel en français et conserve l’idée d’un état présent.
- source_word: δὲ
  choice: or
  rationale: δέ assure la continuité tout en marquant un léger contraste avec ce qui précède. « Or » restitue cette articulation dans un registre français courant et digne.
- source_word: ἐν σαρκὶ
  choice: dans la chair
  rationale: Dans Romains 8, σάρξ est un terme paulinien majeur. La traduction conserve « chair » afin de préserver les liens conceptuels du passage et de ne pas imposer une interprétation dans le texte principal.
- source_word: ἀρέσαι
  choice: plaire à
  rationale: Après δύνανται, l’infinitif exprime ce dont ces personnes sont incapables. « Plaire à Dieu » est l’équivalent français direct et idiomatique.
- source_word: θεῷ
  choice: à Dieu
  rationale: Le datif grec désigne celui à qui l’on cherche à plaire ; le français l’exprime naturellement avec la préposition « à ».
- source_word: οὐ δύνανται
  choice: ne peuvent pas
  rationale: Cette formulation concise et naturelle rend directement la négation de la capacité exprimée en grec.
theological_decisions:
- issue: Traduction de σάρξ dans ce contexte paulinien controversé
  choice: dans la chair
  alternative: sous l’emprise de la nature pécheresse
  rationale: « Chair » maintient le terme source et sa tension théologique sans réduire sa portée au corps physique ni la résoudre entièrement en « nature pécheresse ». L’interprétation plus explicite est signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve le terme théologiquement chargé « chair » et rend explicitement le léger lien contrastif de δέ par « Or ».
