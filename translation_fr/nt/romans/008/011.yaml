id: ROM.8.11
reference: Romans 8:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: fr
  text: Et si l’Esprit de celui qui a ressuscité Jésus d’entre les morts habite en vous, celui qui a ressuscité Jésus le Messie[b] d’entre les morts donnera aussi la vie à vos corps mortels à cause de son Esprit qui habite en vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par son Esprit qui habite en vous »; cette formulation correspond à une lecture instrumentale.'
    reason: alternative_reading
  - marker: b
    text: 'Grec : « Christ Jésus »; « Jésus le Messie » rend ici à Χριστός sa valeur de titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: Esprit
  rationale: La majuscule indique que, dans l’argument de Paul, il s’agit de l’Esprit de Dieu. Le même choix est conservé dans les deux occurrences.
- source_word: ἐγείραντος / ἐγείρας
  choice: a ressuscité
  rationale: Dans ce contexte, « ressusciter » exprime clairement et naturellement en français l’action de relever Jésus d’entre les morts.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette formulation française garde l’idée d’une résurrection hors du nombre ou du domaine des morts.
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: habite / qui habite
  rationale: « Habiter » est naturel en français contemporain et maintient la continuité lexicale entre les deux expressions de la présence intérieure de l’Esprit.
- source_word: Χριστὸν Ἰησοῦν
  choice: Jésus le Messie
  rationale: « Messie » conserve la valeur de titre de Χριστός. L’ordre est adapté pour produire une expression française naturelle tout en identifiant Jésus comme le Messie.
- source_word: ζῳοποιήσει
  choice: donnera aussi la vie
  rationale: Cette expression rend clairement le futur et l’action vivifiante, sans archaïsme.
- source_word: θνητὰ σώματα
  choice: vos corps mortels
  rationale: Traduction directe qui préserve à la fois la réalité corporelle et la condition mortelle.
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: à cause de son Esprit qui habite en vous
  rationale: Dans le texte imprimé du SBLGNT, διά est suivi de l’accusatif, ce qui soutient naturellement une valeur causale. Une lecture instrumentale est signalée en note.
theological_decisions:
- issue: Valeur causale ou instrumentale de διὰ dans la proposition finale
  choice: à cause de son Esprit qui habite en vous
  alternative: par son Esprit qui habite en vous
  rationale: Le texte principal suit la construction de διά avec l’accusatif dans le SBLGNT et préserve sa valeur causale la plus directe. La note maintient ouverte la lecture instrumentale connue, sans trancher silencieusement la tension.
- issue: Valeur de Χριστός dans Χριστὸν Ἰησοῦν
  choice: Jésus le Messie
  alternative: Christ Jésus
  rationale: Le rendu choisi conserve la force titulaire de Χριστός plutôt que de le traiter comme un simple nom propre, tout en restant idiomatique en français.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme des deux mentions de la résurrection ainsi que la répétition du verbe « habiter ». « Jésus le Messie » évite l’expression peu naturelle « le Messie Jésus ».
