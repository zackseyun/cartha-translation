id: ROM.8.14
reference: Romans 8:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: fr
  text: En effet, tous ceux qui sont conduits par l’Esprit de Dieu sont fils de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants de Dieu ». Le grec dit littéralement « fils »; dans ce contexte d’adoption et d’héritage, ce terme englobe les femmes comme les hommes.
    reason: Alternative lexicale et clarification de la portée inclusive du masculin grec.
lexical_decisions:
- source_word: ὅσοι
  choice: tous ceux qui
  rationale: Rend naturellement la construction corrélative au pluriel et conserve l’idée de totalité de la catégorie visée.
- source_word: γὰρ
  choice: en effet
  rationale: Marque en français courant et soutenu le lien explicatif avec l’argument précédent.
- source_word: πνεύματι θεοῦ
  choice: par l’Esprit de Dieu
  rationale: Interprète le datif comme instrumental avec ἄγονται, tout en conservant la formulation paulinienne « Esprit de Dieu ».
- source_word: ἄγονται
  choice: sont conduits
  rationale: Reproduit le présent passif sans forcer l’aspect progressif; « conduire » convient ici mieux que « guider » pour préserver l’image du verbe grec.
- source_word: οὗτοι
  choice: sont
  rationale: La reprise démonstrative grecque est déjà portée idiomatiquement par la construction française « tous ceux qui… sont »; ajouter « ceux-là » alourdirait la phrase, mais son effet d’identification demeure.
- source_word: υἱοί
  choice: fils
  rationale: Conserve le terme masculin explicite du grec et sa résonance d’adoption et d’héritage dans le contexte de Romains 8, sans exclure les femmes concernées, comme l’indique la note.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Rend directement le génitif dans ses deux occurrences et maintient la répétition de Dieu dans le verset.
theological_decisions:
- issue: Rendre υἱοί θεοῦ par « fils de Dieu » ou par une expression explicitement inclusive.
  choice: fils de Dieu
  alternative: enfants de Dieu; fils et filles de Dieu
  rationale: « Fils » correspond au mot grec et préserve, dans ce contexte, le lien avec l’adoption et l’héritage. La note précise que la catégorie comprend tous les croyants conduits par l’Esprit, femmes comme hommes.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » assure une transition explicative fluide. La syntaxe évite le calque lourd « ceux-là sont » tout en conservant la force identificatrice de l’original.
