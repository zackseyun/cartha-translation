  text: ἀλλ’ ἐν τούτοις πᾶσιν ὑπερνικῶμεν διὰ τοῦ ἀγαπήσαντος ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: fr
  text: Mais dans tout cela, nous remportons une victoire éclatante par celui qui nous a aimés[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous sommes plus que vainqueurs ».'
    reason: lexical_alternative
  - marker: b
    text: Dans le contexte immédiat, « celui qui nous a aimés » désigne probablement le Christ.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque nettement le contraste avec les détresses et les menaces évoquées juste avant, dans un français naturel.
- source_word: ἐν τούτοις πᾶσιν
  choice: dans tout cela
  rationale: Reprend collectivement les réalités énumérées au verset précédent tout en restant proche de la formulation grecque.
- source_word: ὑπερνικῶμεν
  choice: nous remportons une victoire éclatante
  rationale: Rend la forme verbale et la valeur intensive de ὑπερ- sans réduire l’expression au simple fait de vaincre. La note conserve la tournure française traditionnelle possible.
- source_word: διὰ
  choice: par
  rationale: Avec le génitif, exprime ici le moyen ou l’intervention personnelle grâce auxquels la victoire est remportée.
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: celui qui nous a aimés
  rationale: Conserve le participe substantivé sans introduire dans le texte principal un nom que le grec ne donne pas explicitement; le passé composé rend naturellement l’aoriste en français.
theological_decisions:
- issue: Identité de « celui qui nous a aimés »
  choice: La désignation reste non explicitée dans le texte principal.
  alternative: Préciser « le Christ » ou comprendre plus largement Dieu agissant en Christ.
  rationale: Le contexte immédiat oriente probablement vers le Christ, notamment Romains 8.35, mais le grec de ce verset ne nomme pas expressément le référent; une note informe le lecteur sans lever artificiellement l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Victoire éclatante » communique l’intensité exceptionnelle du verbe grec; « par celui » conserve l’idée de médiation, tandis que les deux notes signalent l’alternative lexicale connue et l’identification contextuelle probable sans les imposer au texte.
