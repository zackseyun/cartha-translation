id: ROM.8.35
reference: Romans 8:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: fr
  text: Qui nous séparera de l’amour du Messie ? La détresse, ou l’angoisse, ou la persécution, ou la famine, ou le dénuement, ou le danger, ou l’épée ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de notre amour pour le Messie ». Le génitif grec peut recevoir ce sens, bien que le contexte favorise « l’amour du Messie » envers nous.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: Qui
  rationale: Le pronom interrogatif personnel introduit naturellement la question rhétorique par « Qui ».
- source_word: χωρίσει
  choice: séparera
  rationale: Le futur actif exprime ici une séparation envisagée; « séparera » est direct et idiomatique.
- source_word: ἀγάπης τοῦ Χριστοῦ
  choice: de l’amour du Messie
  rationale: Cette formulation naturelle conserve la construction au génitif et retient, selon le contexte, l’amour que le Messie porte aux croyants, tout en signalant l’autre lecture en note.
- source_word: θλῖψις
  choice: détresse
  rationale: Le terme désigne l’épreuve ou l’oppression; « détresse » en restitue la gravité dans un français actuel.
- source_word: στενοχωρία
  choice: angoisse
  rationale: « Angoisse » rend l’idée de resserrement et de situation sans issue, tout en distinguant ce terme de θλῖψις.
- source_word: διωγμός
  choice: persécution
  rationale: Équivalent français précis et usuel dans ce contexte.
- source_word: λιμός
  choice: famine
  rationale: Le mot évoque une grave pénurie de nourriture plutôt que la simple faim individuelle.
- source_word: γυμνότης
  choice: dénuement
  rationale: Dans cette liste d’épreuves, le terme évoque concrètement le manque de vêtements et, par extension immédiate, la privation extrême; « dénuement » est naturel et digne en français moderne.
- source_word: κίνδυνος
  choice: danger
  rationale: Équivalent direct, clair et contemporain.
- source_word: μάχαιρα
  choice: épée
  rationale: La traduction littérale préserve l’image de l’arme et la menace de mort violente.
theological_decisions:
- issue: Valeur du génitif dans τοῦ Χριστοῦ
  choice: l’amour que le Messie porte aux croyants (« l’amour du Messie »)
  alternative: l’amour que les croyants portent au Messie
  rationale: Le génitif grec permet formellement les deux lectures. Le contexte de Romains 8.31-39 favorise fortement l’amour du Messie envers les croyants; l’autre possibilité est néanmoins conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La série nominale brève conserve la force cumulative de la question rhétorique grecque. « Messie » traduit le titre Χριστός conformément à l’orientation du projet.
