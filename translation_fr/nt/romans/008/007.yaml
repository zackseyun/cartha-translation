id: ROM.8.7
reference: Romans 8:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: fr
  text: 'car l’état d’esprit de la chair[a], c’est l’hostilité envers Dieu[b] : en effet, il ne se soumet pas à la loi de Dieu, puisqu’il n’en est même pas capable.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la nature pécheresse ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’inimitié contre Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: car
  rationale: Introduit la raison de l’affirmation précédente et conserve naturellement la valeur causale du grec.
- source_word: φρόνημα
  choice: état d’esprit
  rationale: Désigne l’orientation ou la disposition de la pensée, et non la seule faculté intellectuelle.
- source_word: σάρξ
  choice: chair
  rationale: Conserve le terme métaphorique paulinien sans en imposer l’interprétation dans le texte principal; l’alternative explicative figure en note.
- source_word: ἔχθρα εἰς θεόν
  choice: l’hostilité envers Dieu
  rationale: Préserve le substantif grec et exprime clairement une opposition dirigée contre Dieu.
- source_word: ὑποτάσσεται
  choice: ne se soumet pas
  rationale: Rend de façon idiomatique la non-soumission exprimée par la forme médio-passive.
- source_word: νόμῳ τοῦ θεοῦ
  choice: à la loi de Dieu
  rationale: Reproduit directement la construction grecque et son poids formel.
- source_word: οὐδὲ γὰρ δύναται
  choice: puisqu’il n’en est même pas capable
  rationale: Exprime l’incapacité, et non la seule mauvaise volonté, tout en conservant l’intensification portée par οὐδέ.
theological_decisions:
- issue: Sens métaphorique de σάρξ
  choice: « chair » dans le texte principal
  alternative: « nature pécheresse »
  rationale: Le contexte vise l’orientation humaine opposée à Dieu, mais « chair » préserve le vocabulaire paulinien et évite de fixer silencieusement une interprétation.
- issue: Portée de la dernière proposition
  choice: Affirmation explicite d’une incapacité
  alternative: « il ne veut pas s’y soumettre »
  rationale: δύναται concerne directement la capacité. La traduction maintient cette tension théologique sans l’intégrer à un système doctrinal plus large.
- issue: Forme nominale de ἔχθρα
  choice: « c’est l’hostilité envers Dieu »
  alternative: « est hostile à Dieu »
  rationale: La tournure française avec détachement reste naturelle tout en préservant l’affirmation nominale, plus forte que le simple adjectif.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise par « il » renvoie à « l’état d’esprit ». Les deux articulations causales du grec sont rendues par « en effet » et « puisque », afin d’éviter une répétition pesante de « car ».
