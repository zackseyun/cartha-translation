id: ROM.8.17
reference: Romans 8:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: fr
  text: 'Or, si nous sommes enfants, nous sommes aussi héritiers : héritiers de Dieu et cohéritiers avec le Messie, si du moins nous souffrons avec lui afin d’être aussi glorifiés avec lui.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: enfants
  rationale: Le pluriel neutre exprime le statut filial sans distinction de sexe ; « enfants » est précis, inclusif et naturel dans l’argument sur l’héritage.
- source_word: κληρονόμοι
  choice: héritiers
  rationale: Terme juridique et familial courant qui désigne ceux qui reçoivent un héritage.
- source_word: θεοῦ
  choice: de Dieu
  rationale: Rend directement le génitif dans l’expression « héritiers de Dieu », sans préciser davantage la relation que ne le fait le grec.
- source_word: συγκληρονόμοι
  choice: cohéritiers
  rationale: Le préfixe συν- indique un héritage partagé ; « cohéritiers » conserve cette idée avec concision.
- source_word: Χριστοῦ
  choice: avec le Messie
  rationale: Dans cette construction, le génitif désigne celui avec qui l’héritage est partagé. « Avec » explicite naturellement en français la relation portée par le préfixe συν-, tandis que « Messie » conserve la valeur du titre Χριστός.
- source_word: εἴπερ
  choice: si du moins
  rationale: Cette expression maintient la véritable force conditionnelle ainsi que la nuance rhétorique et expectative du grec.
- source_word: συμπάσχομεν
  choice: nous souffrons avec lui
  rationale: Le préfixe συν- marque la participation aux souffrances du Messie ; le pronom est fourni par le contexte immédiat.
- source_word: ἵνα
  choice: afin de
  rationale: Exprime ici le but ou l’aboutissement visé d’une manière idiomatique en français.
- source_word: συνδοξασθῶμεν
  choice: être aussi glorifiés avec lui
  rationale: Le passif indique une gloire reçue, et le préfixe συν- une glorification partagée avec le Messie.
theological_decisions:
- issue: La souffrance commune exprimée par εἴπερ συμπάσχομεν est-elle une condition méritoire ou le schéma attendu de l’union avec le Messie ?
  choice: 'Conserver une condition réelle : « si du moins nous souffrons avec lui », sans laisser entendre que la souffrance mérite la glorification.'
  alternative: Affaiblir la condition en traduisant « puisque nous souffrons avec lui », ou présenter la souffrance comme le fondement méritoire de l’héritage.
  rationale: εἴπερ garde une force conditionnelle authentique. Le contexte décrit toutefois une participation au parcours du Messie et ne dit pas que la souffrance acquiert la gloire par mérite.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase elliptique grecque est légèrement complétée par « nous sommes » pour être naturelle. « Or » relie le verset au raisonnement précédent sans alourdir la transition.
