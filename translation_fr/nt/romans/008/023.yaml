id: ROM.8.23
reference: Romans 8:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: fr
  text: Et non seulement elle, mais nous aussi, qui avons les prémices de l’Esprit[a], nous gémissons en nous-mêmes, attendant avec ardeur l’adoption filiale[b] — la rédemption de notre corps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « l’Esprit comme prémices ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « l’adoption comme fils ». Le terme grec évoque le statut filial et successoral ; il concerne ici tous les croyants, femmes et hommes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: Et non seulement elle, mais
  rationale: La tournure reprend le contraste avec la création mentionnée dans le contexte précédent. Le pronom « elle » rend explicite en français l’ellipse grecque sans en modifier le référent contextuel.
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: nous aussi … nous-mêmes
  rationale: Cette formulation conserve la double insistance du grec tout en restant intelligible en français courant.
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: les prémices de l’Esprit
  rationale: « Prémices » maintient l’image biblique de la première part annonçant la récolte entière. Le génitif français préserve l’ambiguïté entre ce qui vient de l’Esprit et l’Esprit lui-même considéré comme prémices.
- source_word: ἔχοντες
  choice: qui avons
  rationale: Une proposition relative rend naturellement en français la valeur du participe grec.
- source_word: ἐν ἑαυτοῖς στενάζομεν
  choice: nous gémissons nous-mêmes intérieurement
  rationale: « Gémissons » maintient le lien verbal avec les gémissements de la création dans le contexte; « intérieurement » exprime clairement la localisation indiquée par ἐν ἑαυτοῖς.
- source_word: υἱοθεσίαν
  choice: l’adoption filiale
  rationale: Cette expression française naturelle désigne l’entrée dans le statut d’enfant et d’héritier, tout en gardant la dimension de filiation portée par le terme grec.
- source_word: ἀπεκδεχόμενοι
  choice: attendant avec ardeur
  rationale: La formulation exprime l’attente soutenue et intense du verbe grec sans suggérer une impatience fautive.
- source_word: τὴν ἀπολύτρωσιν
  choice: la rédemption
  rationale: « Rédemption » conserve le vocabulaire théologique paulinien ainsi que sa portée eschatologique de délivrance complète.
- source_word: τοῦ σώματος ἡμῶν
  choice: de notre corps
  rationale: Le singulier collectif du grec est naturel en français et peut désigner distributivement le corps de chacun des croyants.
theological_decisions:
- issue: Rendre υἱοθεσίαν sans effacer l’image paulinienne de la filiation et de l’héritage, ni limiter le référent aux hommes
  choice: l’adoption filiale
  alternative: l’adoption comme fils
  rationale: « Adoption filiale » conserve la notion explicite de filiation dans un français naturel et inclut tous les croyants. Une note signale la formulation plus littérale afin de ne pas masquer l’image juridique antique du statut de fils héritier.
- issue: Déterminer si les prémices sont un don de l’Esprit ou l’Esprit lui-même
  choice: les prémices de l’Esprit
  alternative: l’Esprit comme prémices
  rationale: La construction grecque permet les deux compréhensions. Le texte principal conserve cette formulation ouverte, et la note explicite la lecture appositionnelle possible.
- issue: Rapport entre l’adoption filiale et la rédemption du corps
  choice: un tiret présentant la rédemption du corps en apposition à l’adoption filiale
  alternative: attendre l’adoption filiale et la rédemption du corps comme deux réalités distinctes
  rationale: L’apposition grecque identifie ici l’accomplissement attendu de l’adoption à la rédemption du corps; le tiret préserve ce rapport sans ajouter de connecteur interprétatif.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase garde l’insistance rhétorique de Paul sans reproduire mécaniquement l’ordre grec. « Prémices », « adoption filiale » et « rédemption » préservent les images et le vocabulaire théologique du passage; les notes maintiennent les ambiguïtés réelles.
