id: ROM.8.39
reference: Romans 8:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: fr
  text: ni la hauteur, ni la profondeur, ni aucune autre chose créée ne pourra nous séparer de l’amour de Dieu qui est en Jésus le Messie, notre Seigneur[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aucune autre créature » ou « rien d’autre dans la création ».
    reason: lexical_alternative
  - marker: b
    text: « Jésus le Messie » est traditionnellement rendu par « Jésus-Christ » ou, selon l’ordre des mots grecs, « Christ Jésus ».
    reason: lexical_alternative
  - marker: c
    text: Dans ce contexte, « l’amour de Dieu » désigne très probablement l’amour que Dieu nous porte.
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: hauteur
  rationale: Avec βάθος, le terme a naturellement un sens spatial et forme un contraste rhétorique entre les extrêmes.
- source_word: βάθος
  choice: profondeur
  rationale: Ce choix direct et idiomatique conserve le parallélisme avec « hauteur ».
- source_word: κτίσις ἑτέρα
  choice: aucune autre créature
  rationale: κτίσις peut désigner la création ou une réalité créée. « Créature » est ici naturel en français et englobe toute chose appartenant à l’ordre créé; « autre » rend ἑτέρα et la tournure négative avec τις devient « aucune ».
- source_word: δυνήσεται
  choice: ne pourra
  rationale: Le futur exprime une incapacité à venir; « ne pourra » restitue clairement le temps et la capacité.
- source_word: χωρίσαι
  choice: séparer
  rationale: Le verbe français correspond directement au sens contextuel de couper quelqu’un d’une relation ou d’un amour.
- source_word: ἀγάπης
  choice: amour
  rationale: « Amour » est le terme français courant et digne pour ἀγάπη.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: La formulation conserve le génitif grec sans trancher dans le texte principal, bien que le contexte favorise l’amour que Dieu porte aux croyants.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: en Jésus le Messie
  rationale: Χριστός est rendu comme un titre, « le Messie ». L’ordre français « Jésus le Messie » est naturel tout en conservant l’identité et le titre; ἐν est rendu par « en ».
- source_word: κυρίῳ
  choice: Seigneur
  rationale: « Seigneur » est l’équivalent établi de κύριος dans ce contexte christologique.
theological_decisions:
- issue: Sens du génitif dans « l’amour de Dieu »
  choice: Conserver « l’amour de Dieu » dans le texte, avec une note indiquant que le contexte désigne probablement l’amour de Dieu pour nous.
  alternative: L’amour des croyants pour Dieu, ou un génitif volontairement large permettant les deux sens.
  rationale: Romains 8.31-39 met surtout en avant l’action et la fidélité de Dieu envers les siens. La formulation française préserve néanmoins la structure et une part de l’ambiguïté du grec.
- issue: Valeur de Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ / Christ Jésus
  rationale: Le mot grec est un titre signifiant « oint » et désignant le Messie. Le traduire rend ce titre intelligible, tandis qu’une note donne la formulation traditionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme cumulatif de la phrase grecque est conservé, ainsi que le contraste « hauteur / profondeur ». Les notes limitent les explications aux ambiguïtés lexicales et théologiques pertinentes.
