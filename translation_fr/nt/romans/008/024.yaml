  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: fr
  text: 'Car c’est en espérance que nous avons été sauvés[a]. Or, une espérance que l’on voit n’est pas une espérance[b] : qui, en effet, espère ce qu’il voit ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « car c’est par l’espérance que nous avons été sauvés ».'
    reason: alternative_reading
  - marker: b
    text: Autrement dit, l’espérance porte sur ce que l’on ne voit pas encore.
    reason: cross_reference
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: en espérance
  rationale: 'Le datif exprime vraisemblablement ici la sphère ou la manière : le salut est déjà reçu, mais demeure orienté vers son accomplissement encore invisible. « En espérance » évite de présenter l’espérance comme la cause efficace du salut.'
- source_word: ἐσώθημεν
  choice: nous avons été sauvés
  rationale: Le passé composé passif est la formulation française naturelle pour l’aoriste dans ce contexte et maintient explicitement la voix passive.
- source_word: ἐλπὶς δὲ βλεπομένη
  choice: une espérance que l’on voit
  rationale: La proposition relative rend naturellement le participe présent passif et conserve le contraste entre espérance et vue.
- source_word: οὐκ ἔστιν ἐλπίς
  choice: n’est plus une espérance
  rationale: « Plus » explicite en français naturel que, dès lors que son objet est vu, l’espérance perd sa qualité d’espérance, sans modifier le raisonnement de Paul.
- source_word: ὃ γὰρ βλέπει τίς ἐλπίζει;
  choice: qui, en effet, espère ce qu’il voit ?
  rationale: La question rhétorique et la relation entre τίς et le neutre ὃ sont conservées dans une syntaxe française idiomatique. Le pronom « il » est générique.
theological_decisions:
- issue: Rapport entre le salut et l’espérance dans τῇ ἐλπίδι ἐσώθημεν
  choice: « en espérance » dans le texte principal
  alternative: « par l’espérance »
  rationale: Le choix principal préserve la tension eschatologique entre un salut réellement reçu et son plein accomplissement encore attendu, sans faire de l’espérance l’agent ou la cause du salut.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « c’est en espérance que » met en relief le syntagme grec placé en tête. Les marqueurs [a] et [b] figurent dans le texte principal.
