source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: fr
  text: Et nous savons que, pour ceux qui aiment Dieu, tout concourt au bien[a], pour ceux qui sont appelés selon le dessein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « Dieu fait tout concourir au bien. »'
    reason: textual_variant
  - marker: b
    text: 'Ou : « selon son dessein ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: nous savons
  rationale: Le présent français exprime naturellement un savoir établi, conformément à la valeur contextuelle du parfait grec.
- source_word: δὲ
  choice: Et
  rationale: La particule assure ici une transition légère dans l’argumentation, sans marquer une opposition forte.
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: pour ceux qui aiment Dieu
  rationale: « Pour » rend naturellement le datif bénéficiaire ou de relation et conserve la désignation du groupe.
- source_word: πάντα
  choice: tout
  rationale: Le singulier collectif français exprime avec naturel l’étendue du neutre pluriel grec sans en restreindre la portée.
- source_word: συνεργεῖ
  choice: concourt
  rationale: « Concourir au bien » rend l’idée d’une action conjointe orientée vers un résultat, sans introduire Dieu comme sujet explicite dans le texte principal.
- source_word: εἰς ἀγαθόν
  choice: au bien
  rationale: Cette tournure française exprime de manière concise l’orientation vers un résultat bon.
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: eux qui sont appelés selon le dessein
  rationale: « Eux qui » reprend naturellement ceux qui aiment Dieu. La formulation conserve le participe « appelés » et n’ajoute pas de possessif absent du texte grec.
- source_word: πρόθεσιν
  choice: dessein
  rationale: Dans ce contexte, « dessein » exprime une intention arrêtée ou un projet délibéré avec un registre biblique digne mais compréhensible.
- source_word: κλητοῖς
  choice: appelés
  rationale: « Appelés » est le terme paulinien usuel et préserve la continuité théologique sans préciser indûment les modalités de l’appel.
theological_decisions:
- issue: Sujet implicite de συνεργεῖ
  choice: Le texte principal dit que « tout concourt au bien » sans faire de Dieu le sujet grammatical explicite.
  alternative: « Dieu fait tout concourir au bien. »
  rationale: Le texte du SBLGNT fourni porte πάντα συνεργεῖ sans θεός comme sujet explicite. La variante qui nomme Dieu est signalée en note afin de préserver la donnée textuelle et l’ambiguïté.
- issue: Possessif sous-entendu avec κατὰ πρόθεσιν
  choice: « selon le dessein » sans possessif explicite
  alternative: « selon son dessein »
  rationale: Le contexte renvoie vraisemblablement au dessein de Dieu, mais le grec fourni ne comporte aucun possessif. Le texte principal ne l’ajoute donc pas, tandis que la lecture idiomatique est donnée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Tout concourt au bien » est une tournure concise et naturelle; « eux qui » évite une répétition lourde tout en montrant que la seconde désignation reprend le même groupe. Les deux notes sont appelées dans le texte principal.
