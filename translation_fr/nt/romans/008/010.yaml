id: ROM.8.10
reference: Romans 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: fr
  text: Mais si le Messie est en vous, le corps, lui, est mort[b] à cause du péché, tandis que l’esprit[a], lui, est vie à cause de la justice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Esprit ». Le terme grec peut désigner soit l’esprit humain auquel Dieu donne la vie, soit l’Esprit Saint.
    reason: alternative_reading
  - marker: b
    text: Ou « le corps est voué à la mort » ou « le corps est mortel ».
    reason: lexical_alternative
  - marker: c
    text: Ou « droiture ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: le Messie
  rationale: Χριστός garde ici sa valeur de titre. « Le Messie » la rend clairement en français moderne.
- source_word: σῶμα
  choice: le corps
  rationale: σῶμα désigne le corps et forme le contraste concret avec πνεῦμα; « chair » traduirait plutôt σάρξ.
- source_word: νεκρὸν
  choice: est mort
  rationale: La formulation conserve le sens direct et saisissant de l’adjectif grec, sans transformer dans le texte principal la mort en simple mortalité.
- source_word: διὰ ἁμαρτίαν
  choice: à cause du péché
  rationale: διά suivi de l’accusatif exprime ici la cause; cette tournure est claire et naturelle en français.
- source_word: πνεῦμα
  choice: l’esprit
  rationale: La minuscule préserve d’abord le contraste entre le corps et l’esprit humain, tout en laissant ouverte, par une note, la possibilité d’une référence directe à l’Esprit Saint.
- source_word: ζωὴ
  choice: est vie
  rationale: Le grec emploie le nom « vie », non l’adjectif « vivant ». La formulation française conserve cette expression dense et théologiquement chargée.
- source_word: διὰ δικαιοσύνην
  choice: à cause de la justice
  rationale: « Justice » est l’équivalent français large et courant de δικαιοσύνη; il permet de ne pas trancher entre ses dimensions déclarative, relationnelle et morale.
theological_decisions:
- issue: Référent de πνεῦμα
  choice: l’esprit
  alternative: l’Esprit
  rationale: Le contraste avec le corps favorise « l’esprit », mais le contexte immédiat consacré à l’Esprit de Dieu permet aussi de comprendre « l’Esprit ». La note conserve cette tension.
- issue: Portée de νεκρὸν appliqué au corps
  choice: le corps est mort
  alternative: le corps est voué à la mort / mortel
  rationale: Le grec dit littéralement « mort ». Cette expression est conservée dans le texte, tandis que la note signale qu’elle peut décrire la condition mortelle du corps.
- issue: Portée de δικαιοσύνη
  choice: la justice
  alternative: le fait d’être juste / la justification
  rationale: Le terme grec est assez large pour évoquer la justice accordée par Dieu, le statut de juste ou la conduite juste. Le texte principal ne choisit pas entre ces nuances.
translation_notes:
  register: Français international moderne, digne et accessible. Les reprises « lui » rendent l’opposition μὲν… δὲ sans alourdir la phrase. L’expression volontairement dense « est vie » conserve la forme nominale du grec.
