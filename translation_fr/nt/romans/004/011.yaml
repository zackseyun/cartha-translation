revisions:
- from: Et il reçut le signe de la circoncision comme sceau de la justice liée à la foi qu’il avait alors qu’il était incirconcis[a]. Il devait ainsi devenir le père de tous ceux qui croient sans être circoncis[b], afin que la justice leur soit comptée, à eux aussi[c].
  to: Et il reçut le signe de la circoncision comme sceau de la justice de la foi qu’il avait alors qu’il était incirconcis[a], afin qu’il soit le père de tous ceux qui croient sans être circoncis[b], afin que la justice leur soit comptée, à eux aussi[c].
  rationale: 'La révision conserve le sens et les ambiguïtés de la phrase grecque tout en améliorant la précision du génitif « de la foi » et de la première proposition finale. Les appels de notes restent correctement ancrés : [a] à l’état d’Abraham, [b] à celui des croyants incirconcis, et [c] au verbe de comptabilisation.'
