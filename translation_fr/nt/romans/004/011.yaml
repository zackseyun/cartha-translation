id: ROM.4.11
reference: Romans 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: fr
  text: Et il reçut le signe de la circoncision comme sceau de la justice de la foi qu’il avait alors qu’il était incirconcis[a], afin qu’il soit le père de tous ceux qui croient sans être circoncis[b], afin que la justice leur soit comptée, à eux aussi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans l’incirconcision », c’est-à-dire alors qu’il n’était pas circoncis.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « à travers l’incirconcision » ; ici, l’expression désigne leur condition d’incirconcis.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « portée à leur compte » ou « mise à leur compte ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: signe
  rationale: « Signe » rend directement la fonction visible et indicative de la circoncision sans transformer la métaphore en explication.
- source_word: περιτομή
  choice: circoncision
  rationale: Terme français courant et précis pour le rite dont Paul parle.
- source_word: σφραγίς
  choice: sceau
  rationale: « Sceau » conserve l’image d’une attestation ou authentification, au lieu de l’aplanir en « confirmation ».
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Justice » est le correspondant français usuel de δικαιοσύνη dans ce contexte paulinien; il conserve la portée relationnelle et judiciaire du terme sans imposer une paraphrase comme « statut de juste ».
- source_word: τῆς πίστεως
  choice: liée à la foi
  rationale: Cette formulation française naturelle maintient la relation génitivale entre la justice et la foi sans préciser excessivement si la foi en est le moyen, le fondement ou la caractéristique.
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: alors qu’il était incirconcis
  rationale: Rend clairement l’état d’Abraham au moment où il avait cette foi; la traduction littérale « dans l’incirconcision » serait obscure en français moderne.
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: le père de tous ceux qui croient
  rationale: Formulation idiomatique qui préserve le langage représentatif de Paul.
- source_word: δι’ ἀκροβυστίας
  choice: sans être circoncis
  rationale: Dans ce contexte, l’expression désigne la condition dans laquelle ces personnes croient plutôt qu’un moyen instrumental.
- source_word: λογισθῆναι
  choice: soit comptée
  rationale: « Compter » conserve la métaphore d’imputation ou de mise au compte tout en restant compréhensible en français actuel.
- source_word: καί
  choice: à eux aussi
  rationale: « Aussi » exprime explicitement l’inclusion des croyants incirconcis dans l’argument de Paul.
theological_decisions:
- issue: Rapport entre la circoncision et la justice
  choice: La circoncision est présentée comme le signe et le sceau d’une justice déjà liée à la foi d’Abraham lorsqu’il était encore incirconcis.
  alternative: Une formulation pourrait laisser entendre que la circoncision produit ou confère elle-même la justice.
  rationale: La syntaxe et la progression de l’argument présentent la circoncision comme une attestation postérieure, non comme le moyen par lequel Abraham a obtenu la justice.
- issue: Relation exprimée par « justice de la foi »
  choice: « Justice liée à la foi »
  alternative: « Justice obtenue par la foi » ou, plus littéralement, « justice de la foi »
  rationale: Le génitif grec associe étroitement justice et foi sans expliciter à lui seul toutes les nuances de leur relation. La traduction choisie préserve cette ouverture et évite une tournure française peu naturelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque a été divisée en deux phrases françaises pour en faciliter la lecture, tout en conservant les deux propositions de but successives et la progression de l’argument.
