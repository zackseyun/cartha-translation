    rationale: La formule est possible comme explication, mais elle ne rend pas directement la relation génitivale et peut affaiblir la terminologie paulinienne. « Justice de la foi » est suffisamment naturel dans ce registre et conserve l’ambiguïté de la source.
  - severity: low
    issue: « Il devait ainsi devenir » rend trop fortement la première proposition en εἰς τὸ.
    rationale: La construction exprime ici le but ou le résultat visé. « Afin qu’il soit » le rend sans introduire la nuance de devoir.
