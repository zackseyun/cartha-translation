id: ROM.4.2
reference: Romans 4:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: fr
  text: En effet, si Abraham a été déclaré juste en raison de ses œuvres[a], il a de quoi se vanter[b] — mais pas devant Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « a été justifié en raison de ses œuvres ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il a un sujet de fierté » ou « un motif de se vanter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: En effet, si
  rationale: « En effet » maintient le lien argumentatif marqué par γάρ, et « si » rend directement la condition introduite par εἰ sans en préciser d’avance le caractère réel ou hypothétique.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ἐξ ἔργων
  choice: en raison de ses œuvres
  rationale: Cette formulation exprime naturellement en français le fondement ou le motif indiqué par ἐκ. Le possessif explicite le rapport implicite entre Abraham et les œuvres sans en modifier le sens.
- source_word: ἐδικαιώθη
  choice: a été déclaré juste
  rationale: Rend la valeur judiciaire de δικαιόω et la voix passive, dans une langue actuelle. Le terme théologique traditionnel « justifié » est conservé en note comme équivalent possible.
- source_word: ἔχει καύχημα
  choice: il a de quoi se vanter
  rationale: Expression française idiomatique qui conserve l’idée nominale d’un motif ou d’un sujet de fierté attachée à καύχημα.
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: mais pas devant Dieu
  rationale: « Devant Dieu » rend naturellement πρὸς θεόν dans ce contexte d’évaluation divine, tout en préservant la formulation brève et quelque peu tendue de Paul.
theological_decisions:
- issue: Caractère réel ou hypothétique de la condition
  choice: « si Abraham a été déclaré juste »
  alternative: « si Abraham avait été déclaré juste » ou « si Abraham a effectivement été déclaré juste »
  rationale: Le grec pose directement une condition sans l’assortir d’un qualificatif. La traduction ne doit ni déclarer la prémisse irréelle ni la présenter comme avérée, même si la suite de l’argument de Paul en précise la portée.
- issue: Portée de « mais pas devant Dieu »
  choice: Conserver la proposition elliptique sans expliciter ce qui est nié
  alternative: « mais il ne peut pas s’en vanter devant Dieu » ou « mais il n’a pas de quoi se vanter devant Dieu »
  rationale: L’ellipse grecque permet plusieurs rattachements précis. La conserver évite de résoudre silencieusement la tension entre l’existence éventuelle d’un motif de fierté et son absence de validité devant Dieu.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la concision argumentative de Paul. « Œuvres » et « devant Dieu » maintiennent le vocabulaire biblique courant, tandis que « a été déclaré juste » et « a de quoi se vanter » rendent le sens de façon naturelle.
