id: ROM.4.12
reference: Romans 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: fr
  text: et le père des circoncis[a], de ceux qui ne sont pas seulement circoncis, mais qui marchent aussi sur les traces de la foi qu’avait notre père Abraham alors qu’il était incirconcis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le père de la circoncision ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: le père des circoncis
  rationale: Le grec dit littéralement « père de la circoncision ». Dans ce contexte, l’expression désigne naturellement les membres circoncis du peuple, et non le rite lui-même; la note conserve toutefois la formulation littérale.
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: qui ne sont pas seulement circoncis
  rationale: Cette formulation française idiomatique rend l’appartenance exprimée par ἐκ et maintient le contraste entre la seule circoncision et la foi vécue à l’exemple d’Abraham.
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: marchent sur les traces
  rationale: L’expression conserve à la fois l’idée d’une conduite réglée exprimée par στοιχέω et l’image concrète des empreintes ou des pas exprimée par ἴχνη.
- source_word: πίστεως
  choice: foi
  rationale: Dans l’argument de Romains 4, le mot renvoie à la confiance croyante d’Abraham; « foi » est ici le terme français le plus juste et le plus naturel.
- source_word: ἐν ἀκροβυστίᾳ
  choice: alors qu’il était incirconcis
  rationale: La tournure explicite naturellement en français l’état dans lequel Abraham avait cette foi, avant sa circoncision.
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: qu’avait notre père Abraham
  rationale: Le génitif grec est déplié en une relative naturelle, sans perdre le titre communautaire important « notre père Abraham ».
theological_decisions:
- issue: La portée de la paternité d’Abraham parmi les circoncis
  choice: 'La proposition qualifie les circoncis dont Abraham est le père: ils ne possèdent pas seulement la circoncision, mais suivent aussi l’exemple de sa foi.'
  alternative: Comprendre qu’Abraham est sans condition le père de toute personne circoncise.
  rationale: La construction οὐκ… μόνον ἀλλὰ καί rattache à ce groupe la double caractéristique de la circoncision et d’une marche conforme à la foi d’Abraham.
translation_notes:
  register: Français moderne, digne et accessible. « Marchent sur les traces » maintient la métaphore biblique sans raideur; « incirconcis » est précis et convient au registre du passage.
