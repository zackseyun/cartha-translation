id: ROM.4.16
reference: Romans 4:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: fr
  text: 'C’est donc par la foi[a], afin que ce soit selon la grâce, pour que la promesse soit assurée à toute la descendance[b] : non seulement à ceux qui relèvent de la Loi, mais aussi à ceux qui relèvent de la foi d’Abraham[c], lui qui est le père de nous tous.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: On pourrait aussi traduire « confiance ». Le sens de « fidélité » est moins probable dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « semence » ; le mot est employé collectivement pour désigner la descendance ou les descendants d’Abraham.
    reason: lexical_alternative
  - marker: c
    text: 'Ou, plus explicitement, « à ceux qui partagent la foi d’Abraham ». Le grec emploie une tournure singulière et condensée : « à celui qui relève de la foi d’Abraham ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est donc
  rationale: Cette formulation naturelle conserve la valeur déductive de l’expression grecque et son lien avec l’argument précédent.
- source_word: ἐκ πίστεως
  choice: par la foi
  rationale: Le grec exprime ici la base ou le moyen. « Par la foi » est idiomatique en français et n’explicite pas le sujet sous-entendu par Paul.
- source_word: ἵνα κατὰ χάριν
  choice: afin que ce soit selon la grâce
  rationale: Cette formulation maintient la proposition de but et la correspondance explicite avec la grâce, sans ajouter l’idée plus interprétative de « reposer sur ».
- source_word: βεβαίαν
  choice: assurée
  rationale: « Assurée » exprime la fiabilité et la fermeté de la promesse dans un français actuel.
- source_word: ἐπαγγελίαν
  choice: promesse
  rationale: Équivalent français usuel et précis du vocabulaire paulinien de la promesse.
- source_word: σπέρματι
  choice: descendance
  rationale: Le nom grec signifie littéralement « semence », mais il désigne collectivement ici les descendants d’Abraham. « Descendance » rend clairement cette valeur collective.
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: non seulement à celle qui relève de la Loi
  rationale: Le singulier grec a une portée collective. Le pronom « celle » reprend naturellement « descendance », tandis que « relève de » conserve la relation exprimée par ἐκ sans la définir davantage.
- source_word: τῷ ἐκ πίστεως Ἀβραάμ
  choice: à celle qui relève de la foi d’Abraham
  rationale: Cette traduction garde la construction condensée et le génitif « d’Abraham », sans ajouter explicitement « qui partage », tout en restant intelligible en français.
- source_word: πατὴρ πάντων ἡμῶν
  choice: notre père à tous
  rationale: Formulation française naturelle qui conserve l’affirmation inclusive et familiale du grec.
theological_decisions:
- issue: Le sujet sous-entendu dans ἐκ πίστεως
  choice: C’est donc par la foi
  alternative: La promesse dépend donc de la foi
  rationale: Le grec ne nomme pas ici le sujet. La traduction conserve cette ellipse au lieu de décider explicitement s’il faut suppléer la promesse, l’héritage ou les héritiers à partir du contexte.
- issue: Le sens de τῷ ἐκ πίστεως Ἀβραάμ
  choice: à celle qui relève de la foi d’Abraham
  alternative: à ceux qui partagent la foi d’Abraham
  rationale: La formulation choisie suit de près la construction grecque et préserve la relation condensée entre la descendance, la foi et Abraham, sans imposer une paraphrase explicative.
- issue: La valeur de πίστις
  choice: foi
  alternative: confiance
  rationale: « Foi » convient au raisonnement de Paul et maintient la continuité lexicale du passage. « Confiance » demeure possible, tandis que « fidélité » est moins probable ici.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les deux articulations de but (« afin que », « pour que ») et l’ellipse initiale du grec. « Loi » porte une majuscule pour signaler la Loi mosaïque dans ce contexte, sans ajout confessionnel.
