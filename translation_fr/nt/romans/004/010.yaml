source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: fr
  text: 'Comment donc cela lui a-t-il été compté[a] : alors qu’il était circoncis ou incirconcis ? Non pas alors qu’il était circoncis, mais alors qu’il était incirconcis.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « crédité » ou « imputé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν ἐλογίσθη
  choice: Comment cela lui a-t-il donc été compté
  rationale: « Comment… donc » conserve la question rhétorique et son lien logique avec l’argument précédent. Le pronom « lui » explicite le bénéficiaire déjà présent dans le contexte de Romains 4, tandis que « compté » rend le passif de λογίζομαι sans imposer une métaphore strictement financière.
- source_word: ἐν περιτομῇ ὄντι
  choice: Était-il alors circoncis
  rationale: La tournure nominale grecque désigne l’état d’Abraham au moment où cela lui fut compté. Une formulation adjectivale et interrogative est naturelle en français et garde la valeur circonstancielle.
- source_word: ἐν ἀκροβυστίᾳ
  choice: incirconcis
  rationale: Dans cette opposition, ἀκροβυστία désigne l’état de celui qui n’est pas circoncis. « Incirconcis » est précis, actuel et parallèle à « circoncis ».
- source_word: οὐκ ... ἀλλ’
  choice: Il n’était pas… mais…
  rationale: Cette construction maintient la correction contrastive et emphatique de Paul dans un français idiomatique.
theological_decisions:
- issue: Moment où la justice fut comptée à Abraham par rapport à sa circoncision
  choice: Le texte affirme qu’Abraham était incirconcis à ce moment-là.
  alternative: Traduire littéralement par « dans la circoncision » et « dans l’incirconcision ».
  rationale: La formulation française exprime clairement le contraste temporel et statutaire du grec, sans ajouter de conclusion doctrinale au-delà de l’affirmation du verset.
translation_notes:
  register: Français moderne, clair et digne. La reprise « Était-il alors… ? » rend explicitement la circonstance visée par le grec, et le contraste final conserve le rythme argumentatif de Paul.
