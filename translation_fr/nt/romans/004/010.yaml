  rationale: La révision conserve l’ellipse contextuelle selon laquelle cela est compté à Abraham (« lui »), tout en rattachant directement les états de circoncision et d’incirconcision au moment du compte, comme le fait le grec. La note est corrigée afin de fournir des alternatives lexicalement pertinentes.
