id: ROM.4.7
reference: Romans 4:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: fr
  text: Heureux ceux dont les actes contraires à la loi ont été pardonnés[a] et dont les péchés ont été couverts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux dont les fautes contre la loi ont été pardonnées ».
    reason: Alternative lexicale pour ἀνομίαι, qui peut désigner les transgressions ou fautes commises contre la loi.
lexical_decisions:
- source_word: Μακάριοι
  choice: Heureux
  rationale: Dans la forme française traditionnelle et naturelle d’une béatitude, « Heureux » exprime une condition déclarée favorable sans réduire le sens à une émotion passagère.
- source_word: ἀφέθησαν
  choice: ont été pardonnés
  rationale: Le passif de ἀφίημι désigne ici la remise des fautes. Le passé composé rend naturellement en français l’acte accompli dont l’effet demeure.
- source_word: ἀνομίαι
  choice: actes contraires à la loi
  rationale: Cette formulation accessible conserve l’idée de transgression de la loi portée par ἀνομία et la distingue du terme plus général rendu par « péchés ».
- source_word: ἐπεκαλύφθησαν
  choice: ont été couverts
  rationale: La traduction conserve la métaphore du texte grec et de la citation du Psaume, sans l’expliciter comme simple pardon ou dissimulation.
- source_word: ἁμαρτίαι
  choice: péchés
  rationale: « Péchés » est l’équivalent français courant et précis dans ce contexte.
theological_decisions:
- issue: Rapport entre ἀνομίαι et ἁμαρτίαι
  choice: Rendre les deux termes distinctement par « actes contraires à la loi » et « péchés »
  alternative: Employer « péchés » dans les deux membres ou rendre ἀνομίαι par « fautes »
  rationale: Le parallélisme rapproche les deux notions sans les identifier lexicalement. La traduction préserve cette distinction sans lui imposer une portée doctrinale plus précise que celle du verset.
- issue: Métaphore des péchés « couverts »
  choice: Conserver « couverts »
  alternative: Expliciter par « pardonnés » ou « effacés »
  rationale: Le grec emploie une image distincte de celle du pardon dans le premier membre. La maintenir respecte la tension poétique et théologique de la citation.
translation_notes:
  register: Français international moderne, clair et digne. La tournure de béatitude « Heureux ceux dont… » reste naturelle dans le registre biblique courant. Le parallélisme et la métaphore du texte source sont conservés.
