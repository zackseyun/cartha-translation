id: ROM.4.8
reference: Romans 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριος ἀνὴρ ⸀οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: fr
  text: Heureux l’homme à qui le Seigneur ne comptera jamais le péché[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Heureuse la personne ». Ici, « l’homme » a une valeur représentative et ne désigne pas exclusivement une personne de sexe masculin.
    reason: lexical_alternative
  - marker: b
    text: Ou « à qui le Seigneur ne comptera certainement pas le péché ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Heureux
  rationale: « Heureux » est la formulation française consacrée des béatitudes et exprime ici l’état favorable accordé par Dieu, plutôt qu’un simple sentiment passager.
- source_word: ἀνήρ
  choice: l’homme
  rationale: Le masculin singulier du grec est conservé avec sa valeur représentative et générique; une note précise qu’il ne désigne pas exclusivement les hommes.
- source_word: οὗ
  choice: à qui
  rationale: Cette tournure rend naturellement en français le génitif relatif dans la construction comptable « compter le péché à quelqu’un ».
- source_word: οὐ μὴ
  choice: ne… jamais
  rationale: La négation renforcée οὐ μή avec le subjonctif est rendue par « ne… jamais », formulation française naturelle qui en conserve la force catégorique.
- source_word: λογίσηται
  choice: comptera
  rationale: « Compter » préserve la métaphore comptable importante dans Romains 4 sans introduire le vocabulaire théologique plus technique d’« imputer ».
- source_word: κύριος
  choice: le Seigneur
  rationale: Traduction française habituelle de κύριος, particulièrement appropriée dans cette citation de l’Écriture.
- source_word: ἁμαρτίαν
  choice: le péché
  rationale: Le singulier grec est conservé comme désignation générale du péché; l’article défini est requis par l’usage naturel du français dans cette construction.
theological_decisions:
- issue: Masculin singulier représentatif
  choice: Conserver « l’homme » dans le texte principal avec une valeur générique.
  alternative: « la personne » ou « celui à qui »
  rationale: Le grec emploie ἀνήρ au masculin singulier, mais la béatitude énoncée n’est pas limitée au sexe masculin. La note maintient ensemble la forme du texte source et la portée inclusive de l’énoncé.
- issue: Force de la négation οὐ μή
  choice: Rendre l’assurance catégorique par « ne… jamais ».
  alternative: « ne comptera certainement pas »
  rationale: Les deux formulations rendent la négation grecque renforcée. « Jamais » est plus fluide dans le texte principal, sans transformer l’énoncé en affirmation doctrinale plus précise que le grec.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve le langage traditionnel de la béatitude et la métaphore comptable du contexte, tout en évitant le terme théologique spécialisé « imputer ».
