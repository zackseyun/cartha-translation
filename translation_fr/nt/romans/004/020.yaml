  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: fr
  text: Mais, devant la promesse de Dieu, il ne vacilla pas dans l’incrédulité[a] ; au contraire, il fut fortifié dans la foi[b], rendant gloire à Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne douta pas par incrédulité ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « il fut fortifié par la foi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: Mais, face à la promesse de Dieu
  rationale: εἰς avec l’accusatif a ici un sens référentiel plutôt que spatial, tandis que δέ marque le contraste. « Face à » exprime naturellement en français la manière dont Abraham se situe par rapport à la promesse, sans suggérer un mouvement.
- source_word: οὐ διεκρίθη
  choice: il ne vacilla pas
  rationale: Dans ce contexte, διακρίνω évoque une hésitation intérieure ou un partage plutôt qu’un simple questionnement intellectuel. « Ne vacilla pas » conserve cette portée et prépare le contraste avec l’affermissement dans la foi.
- source_word: τῇ ἀπιστίᾳ
  choice: dans l’incrédulité
  rationale: Le datif peut désigner la sphère ou la manière. « Dans l’incrédulité » maintient le parallélisme étroit avec « dans la foi », tout en laissant ouverte une lecture instrumentale ou causale signalée en note.
- source_word: ἀλλὰ ἐνεδυναμώθη
  choice: au contraire, il fut fortifié
  rationale: ἀλλά introduit un contraste marqué. Le passif « fut fortifié » respecte la forme grecque sans préciser explicitement l’agent que le texte ne nomme pas.
- source_word: τῇ πίστει
  choice: dans la foi
  rationale: Cette formulation conserve le parallélisme antithétique avec « dans l’incrédulité ». Le datif pourrait aussi être instrumental, possibilité conservée en note.
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: rendant ainsi gloire à Dieu
  rationale: Le participe aoriste décrit une action liée à son affermissement. La tournure participiale préserve le mouvement de la phrase ; « ainsi » rend le lien contextuel sans imposer une causalité précise.
theological_decisions:
- issue: Comprendre la réaction d’Abraham comme un simple doute intellectuel ou comme une vacillation plus large devant la promesse
  choice: il ne vacilla pas dans l’incrédulité
  alternative: il ne douta pas à cause de l’incrédulité
  rationale: « Vacilla » reflète la portée contextuelle plus large de διακρίνω et son opposition rhétorique à l’affermissement dans la foi, sans réduire l’enjeu à une incertitude purement intellectuelle.
- issue: Valeur du datif dans τῇ πίστει
  choice: dans la foi
  alternative: par la foi
  rationale: La lecture comme sphère met en valeur le parallélisme avec τῇ ἀπιστίᾳ, mais la lecture instrumentale demeure grammaticalement possible et est donc indiquée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Vacilla » reste courant dans un registre biblique sobre ; la structure contrastive et les deux datifs parallèles sont préservés sans trancher leurs nuances grammaticales au-delà de ce qu’autorise le grec.
