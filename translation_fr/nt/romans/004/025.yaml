id: ROM.4.25
reference: Romans 4:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς παρεδόθη διὰ τὰ παραπτώματα ἡμῶν καὶ ἠγέρθη διὰ τὴν δικαίωσιν ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/025.yaml
  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: fr
  text: lui qui a été livré à cause de nos fautes et qui a été ressuscité pour notre justification[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à cause de notre justification ».'
    reason: alternative_reading
  - marker: b
    text: Le mot « justification » peut aussi être rendu par « acquittement » ou par « fait d’être déclaré juste ».
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: a été livré
  rationale: Le passif grec est conservé, y compris sa possible portée de passif divin. « Livré » est naturel en français biblique moderne et n’explicite pas l’agent.
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: à cause de nos fautes
  rationale: Avec l’accusatif, διά a ici très naturellement un sens causal. « À cause de » l’exprime clairement sans préciser davantage le rapport entre les fautes et la mort du Christ.
- source_word: παραπτώματα
  choice: fautes
  rationale: « Fautes » rend de façon claire les actes moralement répréhensibles désignés par παράπτωμα, sans les fondre simplement dans le terme plus général « péchés ».
- source_word: ἠγέρθη
  choice: a été ressuscité
  rationale: Le passif est conservé et rend naturellement en français l’action de Dieu implicite dans le texte grec.
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: pour notre justification
  rationale: « Pour » maintient dans le texte principal la lecture prospective, de but ou de résultat, tout en laissant la lecture causale possible dans une note.
- source_word: δικαίωσιν
  choice: justification
  rationale: « Justification » conserve la portée juridique et sotériologique du terme paulinien δικαίωσις. Une note en donne des formulations plus courantes.
theological_decisions:
- issue: διὰ τὴν δικαίωσιν ἡμῶν exprime-t-il le but ou le résultat (« pour notre justification »), ou la cause (« à cause de notre justification ») ?
  choice: pour notre justification
  alternative: à cause de notre justification
  rationale: La lecture prospective exprime naturellement que la résurrection du Christ est liée à l’accomplissement de notre justification. Puisque la construction grecque permet aussi une lecture causale, celle-ci est conservée explicitement en note plutôt que tranchée silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure relative « lui qui » maintient le lien syntaxique avec le verset précédent. La répétition de « qui a été » assure une lecture fluide et préserve les deux passifs grecs. Tous les marqueurs de notes figurent dans le texte.
