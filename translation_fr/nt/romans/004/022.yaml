  text: ⸀διὸ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/022.yaml
  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: fr
  text: C’est pourquoi cela lui a été compté comme justice[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porté à son compte » ou « imputé ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conclusion tirée de l’argument précédent.
- source_word: ἐλογίσθη
  choice: a été compté
  rationale: Conserve la forme passive et la métaphore de mise en compte qui structure Romains 4; « porté à son compte » reste une possibilité explicative.
- source_word: αὐτῷ
  choice: lui
  rationale: Rend simplement le datif personnel, qui renvoie à Abraham.
- source_word: εἰς
  choice: comme
  rationale: Dans cette construction, « comme » exprime naturellement le statut attribué sans développer davantage l’interprétation.
- source_word: δικαιοσύνην
  choice: justice
  rationale: « Justice » est le correspondant français courant de δικαιοσύνη dans le registre biblique et paulinien, tout en laissant au contexte sa portée morale, relationnelle et déclarative.
theological_decisions:
- issue: Rendre le langage paulinien de mise en compte sans ajouter une formulation doctrinale
  choice: cela lui a été compté comme justice
  alternative: cela a été porté à son compte comme justice
  rationale: La formulation retient la métaphore comptable et le passif du grec, sans préciser ce que le texte ne précise pas ici quant au mécanisme théologique.
translation_notes:
  register: Français moderne, sobre et digne. « C’est pourquoi » marque clairement l’inférence; « a été compté » demeure compréhensible tout en préservant le vocabulaire clé de Romains 4.
