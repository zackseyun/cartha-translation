source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: fr
  text: 'Contre toute espérance, il a cru dans l’espérance[a], afin de devenir le père de nombreuses nations[b], conformément à ce qui avait été dit : « Ainsi sera ta descendance[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au-delà de toute espérance » ou « contrairement à toute espérance ».'
    reason: lexical_alternative
  - marker: b
    text: Citation de Genèse 15.5 ; voir aussi Genèse 17.5.
    reason: cross_reference
  - marker: c
    text: 'Littéralement : « ta semence » ; le terme grec est au singulier avec un sens collectif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρ’ ἐλπίδα ἐπ’ ἐλπίδι
  choice: contre toute espérance… en s’appuyant sur l’espérance
  rationale: Cette formulation conserve le paradoxe entre une situation qui ne laisse humainement aucun espoir et l’espérance sur laquelle repose la foi d’Abraham. « Toute » explicite ici la portée idiomatique de l’expression française sans transformer l’espérance en simple optimisme.
- source_word: ἐπίστευσεν
  choice: il a cru
  rationale: Le verbe « croire » correspond directement au vocabulaire paulinien de la foi et évite d’ajouter un objet ou une nuance absents du grec.
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: pour devenir
  rationale: La tournure française reste prospective et laisse entendre à la fois la visée et l’aboutissement possible de la foi, sans développer davantage le rapport entre but et résultat.
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: le père d’un grand nombre de nations
  rationale: « Nations » reprend le cadre de la promesse faite à Abraham sans imposer ici le sens plus étroit de « non-Juifs ». L’article défini convient au rôle précis annoncé par la promesse.
- source_word: κατὰ τὸ εἰρημένον
  choice: conformément à ce qui avait été dit
  rationale: Le plus-que-parfait rend l’antériorité de la parole citée, tandis que « conformément à » exprime son rôle normatif dans l’accomplissement annoncé.
- source_word: Οὕτως ἔσται
  choice: Ainsi sera
  rationale: Cette formulation concise conserve le ton solennel de la citation biblique sans archaïsme excessif.
- source_word: τὸ σπέρμα σου
  choice: ta descendance
  rationale: « Descendance » est naturel en français moderne et exprime le sens collectif de σπέρμα; une note signale l’image littérale au singulier.
theological_decisions:
- issue: Portée de πολλῶν ἐθνῶν dans la promesse à Abraham
  choice: « un grand nombre de nations »
  alternative: « beaucoup de non-Juifs » ou « de nombreux peuples »
  rationale: Le contexte reprend la promesse de la Genèse concernant les nations issues d’Abraham ou comprises dans la promesse. « Non-Juifs » importerait trop directement une opposition ultérieure, tandis que « nations » préserve l’écho scripturaire.
- issue: Rapport exprimé par εἰς τὸ γενέσθαι
  choice: « pour devenir »
  alternative: « de sorte qu’il est devenu »
  rationale: Le grec peut exprimer une visée ou un résultat. La traduction retenue maintient la perspective de la promesse sans présenter exclusivement la construction comme un résultat déjà accompli.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme paradoxal autour de l’espérance est conservé sous une forme idiomatique; la citation garde une cadence légèrement solennelle.
