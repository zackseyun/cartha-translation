review_pass:
  verdict: revise
  source_fidelity: Le sens général est bien rendu, y compris l’objet implicite de λογίζεσθαι par « cela ». Toutefois, διὰ ἡμᾶς signifie ici « pour nous / à notre intention », non « à cause de nous », qui suggère une causalité absente du contexte. La relation entre οἷς et τοῖς πιστεύουσιν est mieux exprimée par une apposition claire.
  naturalness: « Porté au compte » est compréhensible, mais « porté à notre compte » est plus idiomatique et rend plus explicitement le datif (« à qui »). La reprise « nous qui » peut être conservée, avec une ponctuation qui clarifie l’apposition.
  terminology: « Ressuscité d’entre les morts Jésus notre Seigneur » rend correctement ἐκ νεκρῶν et le titre κύριος. « Jésus, notre Seigneur » est la ponctuation française naturelle pour l’apposition. Aucun ajout doctrinal n’est nécessaire.
  issues:
  - severity: medium
    issue: « à cause de nous » pour δι’ ἡμᾶς
    rationale: Dans cette phrase, Paul affirme que l’Écriture a été écrite aussi en vue de nous (cf. v. 23), et non qu’elle l’a été causée par nous. « Pour nous » préserve la portée référentielle de διά avec l’accusatif.
  - severity: low
    issue: Formulation comptable légèrement incomplète
    rationale: « Cela sera porté au compte » est grammatical, mais « porté à notre compte » est plus naturel en français et clarifie que le crédit est attribué aux croyants, sans expliciter indûment « la justice ».
  - severity: low
    issue: Ponctuation de l’apposition « Jésus notre Seigneur »
    rationale: La virgule dans « Jésus, notre Seigneur » rend l’apposition naturelle en français moderne sans modifier le sens.
  revised_text: 'mais aussi pour nous, à qui cela sera porté à notre compte : nous qui croyons en celui qui a ressuscité d’entre les morts Jésus, notre Seigneur,'
  revised_footnotes: []
