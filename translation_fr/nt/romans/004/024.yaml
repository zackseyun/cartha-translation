  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: fr
  text: 'mais aussi pour nous, à qui cela sera porté à notre compte : nous qui croyons en celui qui a ressuscité d’entre les morts Jésus, notre Seigneur,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: mais aussi
  rationale: Conserve la force à la fois adversative et additive, en reliant la proposition à ce qui précède tout en l’étendant aux croyants.
- source_word: δι’ ἡμᾶς
  choice: à cause de nous
  rationale: διά avec l’accusatif exprime ici que l’Écriture avait aussi les croyants en vue; « à cause de nous » reste proche de la formulation grecque.
- source_word: οἷς μέλλει λογίζεσθαι
  choice: à qui cela sera porté au compte
  rationale: La tournure garde l’orientation future de μέλλει et la métaphore comptable de λογίζεσθαι. « Cela » reprend implicitement ce qui est porté au compte dans le contexte précédent.
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: nous qui croyons en
  rationale: La reprise par « nous » explicite naturellement l’apposition au pronom relatif; « croire en » exprime en français actuel une foi dirigée vers une personne.
- source_word: τὸν ἐγείραντα
  choice: celui qui a ressuscité
  rationale: Rend le participe substantivé par une formulation française naturelle tout en identifiant Dieu par son action.
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: Jésus notre Seigneur
  rationale: Suit l’ordre et la relation appositive du grec dans une expression française claire et traditionnelle sans archaïsme.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Expression française idiomatique qui conserve l’idée de sortie du milieu des morts.
theological_decisions:
- issue: Objet implicite de λογίζεσθαι
  choice: « cela sera porté au compte »
  alternative: « la justice sera portée au compte »
  rationale: Le grec omet l’objet, récupérable dans le contexte précédent. Le pronom « cela » préserve cette ellipse plutôt que d’introduire explicitement « la justice » dans ce verset.
- issue: Valeur de πιστεύειν ἐπί
  choice: « croire en »
  alternative: « mettre sa confiance en »
  rationale: « Croire en » conserve la formulation concise et théologiquement ouverte du grec, tout en incluant naturellement la notion de confiance personnelle.
translation_notes:
  register: Français international moderne, digne et lisible. La métaphore comptable est conservée par « porter au compte ». Aucun marqueur de note n’est requis puisque le texte ne comporte aucune note.
