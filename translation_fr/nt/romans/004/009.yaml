source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: fr
  text: 'Le bonheur est-il donc pour les circoncis, ou aussi pour les incirconcis ? Car nous disons : « La foi a été comptée à Abraham comme justice[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme droiture » ; le terme grec peut désigner la justice, la droiture ou le fait d’être juste.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρισμός
  choice: bonheur
  rationale: Le terme renvoie à l’état heureux proclamé en Romains 4.6-8. « Bonheur » restitue naturellement ce renvoi en français moderne sans ajouter l’idée d’une bénédiction matérielle.
- source_word: περιτομή
  choice: les circoncis
  rationale: Le nom « circoncision » désigne ici, par métonymie, les personnes circoncises. L’expression rend le référent explicite et idiomatique.
- source_word: ἀκροβυστία
  choice: les incirconcis
  rationale: Le nom désigne ici, par métonymie, les personnes qui ne sont pas circoncises et forme un contraste direct avec « les circoncis ».
- source_word: πίστις
  choice: foi
  rationale: « Foi » est le rendu français courant dans ce contexte paulinien et convient à la citation concernant Abraham.
- source_word: ἐλογίσθη
  choice: a été comptée
  rationale: Ce passif conserve la métaphore d’évaluation ou de mise en compte portée par λογίζομαι, sans développer le mécanisme théologique au-delà du texte.
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Justice » est un équivalent français naturel de δικαιοσύνη et exprime ici la qualité ou le statut juste dans l’argument de Paul.
- source_word: εἰς δικαιοσύνην
  choice: comme justice
  rationale: Cette formulation restitue l’expression grecque de manière concise tout en préservant la relation exacte, non explicitée davantage, entre la foi d’Abraham et la justice.
theological_decisions:
- issue: La relation entre la foi d’Abraham et la justice
  choice: « La foi d’Abraham lui a été comptée comme justice. »
  alternative: « La foi d’Abraham lui a été portée au compte de la justice. »
  rationale: La formulation retenue conserve le langage comptable de Paul et son ambiguïté théologique sans introduire une explication doctrinale absente du verset.
- issue: La portée du bonheur proclamé
  choice: « réservé aux circoncis, ou s’étend-il aussi aux incirconcis ? »
  alternative: « concerne-t-il la circoncision, ou aussi l’incirconcision ? »
  rationale: Le grec emploie des noms collectifs par métonymie. Le rendu choisi explicite qu’il s’agit de groupes humains, sans modifier la question théologique de Paul.
translation_notes:
  register: Français international moderne, digne et accessible. La structure interrogative et le « Car nous disons » conservent la progression argumentative de Paul. « Incirconcis » est retenu comme terme biblique précis et immédiatement opposable à « circoncis ».
