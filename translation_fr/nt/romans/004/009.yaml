  - severity: low
    issue: La citation reformule « la foi » en « la foi d’Abraham » et déplace Abraham en pronom datif.
    rationale: Le sens demeure proche, mais une formulation qui garde « la foi » comme sujet et nomme Abraham après le verbe reflète plus exactement la citation grecque et évite une précision possessive non exprimée dans cette phrase.
