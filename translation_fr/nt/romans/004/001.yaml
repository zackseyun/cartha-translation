  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: fr
  text: Que dirons-nous donc qu’Abraham, notre ancêtre selon la chair[a], a trouvé[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une formulation plus idiomatique : « notre ancêtre par filiation humaine ».'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi rattacher « selon la chair » à « a trouvé » : la question porterait alors sur ce qu’Abraham a trouvé « selon la chair », c’est-à-dire par des moyens humains ou d’un point de vue purement humain.'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Que dirons-nous donc
  rationale: Conserve la transition rhétorique de Paul et la valeur délibérative du futur, dans une formulation française soutenue mais actuelle.
- source_word: εὑρηκέναι
  choice: a trouvé
  rationale: Le passé composé rend naturellement en français le parfait infinitif grec et son résultat présent, sans ajouter l’idée plus interprétative de découverte.
- source_word: προπάτορα
  choice: ancêtre
  rationale: « Ancêtre » exprime clairement le lien de filiation évoqué par le substantif grec et sonne plus naturel en français moderne que « aïeul » ou « père ancestral ».
- source_word: ἡμῶν
  choice: notre
  rationale: Le possessif est maintenu afin de préserver l’identification commune de Paul et de ses interlocuteurs à Abraham.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Cette formulation conserve le vocabulaire paulinien et la possibilité syntaxique du grec. Ici, dans la lecture principale, elle désigne le lien d’ascendance physique; une reformulation idiomatique est donnée en note.
theological_decisions:
- issue: Portée syntaxique de κατὰ σάρκα
  choice: La locution qualifie Abraham comme « notre ancêtre selon la chair » et renvoie à l’ascendance physique.
  alternative: 'La locution peut être rattachée à « a trouvé » : ce qu’Abraham aurait trouvé par des moyens humains ou du point de vue humain.'
  rationale: L’apposition « Abraham, notre ancêtre » favorise naturellement le rattachement à Abraham, en accord avec le thème de la filiation dans Romains. Toutefois, la syntaxe grecque permet l’autre rattachement; la note le signale afin de ne pas supprimer cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et lisible. La structure interrogative demeure volontairement proche de celle du grec. « Selon la chair » conserve une expression paulinienne importante, tandis que la note en explicite ici le sens généalogique et documente l’autre analyse syntaxique possible.
