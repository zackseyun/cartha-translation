  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: fr
  text: En effet, la loi[a] produit la colère ; mais là où il n’y a pas de loi, il n’y a pas non plus de transgression[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la Loi ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « violation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: la loi
  rationale: Le français exige naturellement l’article défini. La minuscule préserve la portée potentiellement générale du terme sans le limiter d’emblée à la Loi de Moïse.
- source_word: ὀργή
  choice: la colère
  rationale: « Colère » est le terme français courant et digne qui conserve ici la forte portée judiciaire et théologique possible du mot grec, sans préciser explicitement son sujet, que le texte laisse implicite.
- source_word: κατεργάζεται
  choice: produit
  rationale: « Produit » rend clairement la valeur causative du verbe dans un français moderne et naturel.
- source_word: οὗ δὲ
  choice: mais là où
  rationale: Cette formulation restitue à la fois la construction locative et le léger contraste introduit par δέ.
- source_word: παράβασις
  choice: transgression
  rationale: « Transgression » exprime le franchissement ou la violation d’une limite prescrite et convient à l’argument selon lequel il n’y a pas de transgression là où aucune loi n’existe.
theological_decisions:
- issue: Portée de νόμος dans l’argument de Paul
  choice: la loi
  alternative: la Loi
  rationale: La minuscule laisse ouverte la portée du principe énoncé et évite de restreindre prématurément νόμος à la seule Loi mosaïque, tout en permettant que celle-ci demeure à l’arrière-plan.
- issue: Sujet implicite de la colère
  choice: la colère
  alternative: la colère de Dieu
  rationale: Le grec ne nomme pas explicitement celui dont il s’agit. La traduction conserve cette formulation et sa tension théologique au lieu d’ajouter « de Dieu » dans le texte.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La répétition de « loi » et la structure contrastive de l’original sont conservées.
