id: ROM.4.3
reference: Romans 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: fr
  text: Car que dit l’Écriture ? « Abraham crut Dieu, et cela lui fut compté comme justice[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « lui fut attribué comme justice » ; autre possibilité : « fut porté à son compte comme justice ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: l’Écriture
  rationale: Avec l’article et dans cet emploi paulinien, le terme désigne le texte sacré cité, et non un écrit quelconque.
- source_word: Ἐπίστευσεν
  choice: crut
  rationale: Le passé simple rend sobrement l’aoriste et conserve le sens direct de πιστεύω sans ajouter une explicitation interprétative.
- source_word: τῷ θεῷ
  choice: Dieu
  rationale: Le datif après πιστεύω indique ici qu’Abraham a cru Dieu, c’est-à-dire qu’il a tenu sa parole pour vraie. « Crut en Dieu » déplacerait légèrement l’accent vers une affirmation générale de foi.
- source_word: ἐλογίσθη
  choice: fut compté
  rationale: Cette formulation conserve le passif et le sens d’évaluation ou d’imputation de λογίζομαι. Elle reste compréhensible en français actuel tout en laissant ouvertes ses nuances comptables et déclaratives.
- source_word: εἰς δικαιοσύνην
  choice: comme justice
  rationale: 'Dans cette tournure, εἰς exprime le résultat ou la valeur attribuée : cela fut compté « comme justice ». « Justice » est le correspondant français naturel de δικαιοσύνη dans ce contexte paulinien.'
theological_decisions:
- issue: Sens de δικαιοσύνη dans le contexte paulinien de la justification
  choice: justice
  alternative: rectitude
  rationale: « Justice » est le terme français établi et suffisamment large pour préserver les dimensions morale, relationnelle et déclarative de δικαιοσύνη, sans imposer à lui seul une théorie particulière de la justification.
- issue: Objet de la foi d’Abraham
  choice: Abraham crut Dieu
  alternative: Abraham crut en Dieu
  rationale: Le grec emploie le datif τῷ θεῷ après πιστεύω et met ainsi l’accent sur le fait de croire Dieu et sa parole. La traduction retenue préserve cette construction, même si « croire en Dieu » serait plus idiomatique dans d’autres contextes.
translation_notes:
  register: Français moderne, sobre et digne. Le passé simple convient au registre scripturaire narratif sans être archaïque. Les guillemets signalent explicitement la citation de Genèse 15.6. « Crut Dieu » est moins courant que « crut en Dieu », mais demeure clair et permet de respecter la construction grecque et son accent contextuel.
