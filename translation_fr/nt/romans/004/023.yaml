  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐκ ἐγράφη δὲ δι’ αὐτὸν μόνον ὅτι ἐλογίσθη αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/023.yaml
  text: It was not written for his sake alone that it was credited to him,[a]
translation:
  language: fr
  text: 'Or, ce n’est pas pour lui seul qu’il a été écrit : « Cela lui a été compté »,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porté à son compte » ou « attribué ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγράφη
  choice: il a été écrit
  rationale: Le passif est conservé et renvoie naturellement au témoignage écrit de l’Écriture.
- source_word: δὲ
  choice: Or
  rationale: Ici, δέ fait progresser l’argument plutôt qu’il n’exprime une opposition marquée. « Or » assure cette transition en français sans introduire une valeur temporelle.
- source_word: δι’ αὐτὸν μόνον
  choice: pour lui seul
  rationale: Cette formulation idiomatique conserve l’idée que les paroles citées n’ont pas été écrites uniquement en vue d’Abraham.
- source_word: ὅτι
  choice: deux-points introduisant la citation
  rationale: Dans ce contexte, ὅτι introduit le contenu de ce qui a été écrit. En français, les deux-points et les guillemets rendent cette relation plus naturellement qu’une subordonnée lourde.
- source_word: ἐλογίσθη
  choice: a été compté
  rationale: « Compter » conserve le champ sémantique d’évaluation ou de mise au compte présent dans λογίζομαι, sans imposer une explication doctrinale supplémentaire.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif est rendu directement par le pronom français complément indirect.
theological_decisions:
- issue: Sens de λογίζομαι dans l’argument paulinien sur la justification
  choice: a été compté
  alternative: a été porté à son compte / a été attribué
  rationale: « A été compté » maintient l’image comptable et le lien verbal avec l’argument du chapitre, tout en laissant le contexte préciser ce qui est compté et en quel sens.
- issue: Référent du sujet sous-entendu de ἐλογίσθη
  choice: Cela
  alternative: elle lui a été comptée
  rationale: Le grec n’exprime pas ici le sujet. Le neutre « Cela » évite de trancher explicitement entre « la foi » et « la justice », tout en donnant une phrase française naturelle.
translation_notes:
  register: Français moderne, sobre et digne. « Or » marque la progression du raisonnement. La citation directe allège la syntaxe, tandis que « Cela » préserve autant que possible l’implicite du grec.
