id: ROM.4.5
reference: Romans 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: fr
  text: En revanche, à celui qui ne fait pas d’œuvres, mais qui croit[a] en celui qui justifie[b] l’impie, sa foi est comptée[c] comme justice[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui met sa confiance » en celui qui justifie.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui déclare juste ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « créditée » ou « considérée ».'
    reason: lexical_alternative
  - marker: d
    text: Le mot grec peut aussi désigner la « droiture » ou le fait d’être juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: à celui qui n’accomplit pas d’œuvres
  rationale: Le participe substantivé désigne celui qui n’agit pas ou n’accomplit pas d’œuvre dans le contraste immédiat avec la foi. Cette formulation évite que « ne travaille pas » soit compris comme une simple absence d’emploi, sans ajouter l’idée plus interprétative de mérite.
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: mais qui croit en
  rationale: « Croire en » est naturel en français moderne et rend la confiance dirigée vers une personne qu’exprime πιστεύω avec ἐπί. « Mettre sa confiance en » reste une possibilité explicitée en note.
- source_word: τὸν δικαιοῦντα
  choice: celui qui justifie
  rationale: « Justifier » conserve un terme central de l’argumentation paulinienne et son lien avec δικαιοσύνη, sans préciser à lui seul le mécanisme théologique envisagé.
- source_word: τὸν ἀσεβῆ
  choice: l’impie
  rationale: « L’impie » rend sobrement le substantif adjectival et met en avant l’absence de respect envers Dieu, sans élargir le sens à toute forme de méchanceté.
- source_word: λογίζεται
  choice: est comptée
  rationale: Le passif « est comptée » exprime la valeur attribuée à la foi dans le langage d’évaluation ou de mise en compte du verbe λογίζομαι. « Est portée au compte » serait trop explicitement financier.
- source_word: ἡ πίστις αὐτοῦ
  choice: sa foi
  rationale: « Sa foi » correspond au nom πίστις et reprend naturellement le participe « qui croit ». Ici, « fidélité » convient moins bien au contraste syntaxique entre ne pas accomplir d’œuvres et croire.
- source_word: εἰς δικαιοσύνην
  choice: comme justice
  rationale: Avec λογίζομαι, εἰς indique ici ce comme quoi la foi est comptée. « Comme justice » est clair en français et maintient le lien lexical avec le champ de δικαιόω.
theological_decisions:
- issue: Sens de δικαιοῦντα dans un passage paulinien doctrinalement chargé
  choice: celui qui justifie
  alternative: celui qui déclare juste
  rationale: Le verbe « justifier » préserve la densité judiciaire et relationnelle du terme grec ainsi que son rôle dans le raisonnement de Paul, sans imposer une théorie confessionnelle particulière. La lecture plus explicitement déclarative est conservée en note.
- issue: Rapport entre πίστις et πιστεύω
  choice: foi / croire
  alternative: confiance / mettre sa confiance
  rationale: Le couple « foi / croire » maintient la cohérence lexicale et théologique du passage. La construction avec ἐπί comporte néanmoins une nuance réelle de confiance ou d’appui, signalée en note sans remplacer le terme principal.
- issue: Portée de λογίζεται εἰς δικαιοσύνην
  choice: sa foi est comptée comme justice
  alternative: sa foi lui est créditée comme justice
  rationale: La formulation choisie conserve la métaphore d’évaluation de λογίζομαι et l’ambiguïté sur la manière exacte dont cette mise en compte doit être comprise. Elle évite de renforcer indûment une image bancaire.
- issue: Traduction de δικαιοσύνη
  choice: justice
  alternative: justesse devant Dieu
  rationale: « Justice » est le terme français établi qui peut porter à la fois les dimensions morale, judiciaire et relationnelle de δικαιοσύνη. Une paraphrase telle que « justesse devant Dieu » préciserait excessivement le sens.
translation_notes:
  register: Français international moderne, clair et digne. « N’accomplit pas d’œuvres » évite le sens professionnel de « ne travaille pas » tout en gardant le contraste paulinien. Les termes théologiques « foi », « justifie » et « justice » sont maintenus sans développement confessionnel.
