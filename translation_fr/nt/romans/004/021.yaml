  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: fr
  text: pleinement convaincu que ce qu’il avait promis[a], il était aussi capable de l’accomplir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « il » implicite désigne Dieu, d’après le contexte.
    reason: cross_reference
  - marker: b
    text: 'Le grec emploie ici le présent : « il est aussi capable de le faire ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: pleinement convaincu
  rationale: Le participe exprime une conviction entière et ferme. Cette formulation est naturelle en français moderne et conserve la force du grec.
- source_word: ὅτι
  choice: que
  rationale: Introduit directement le contenu de la conviction d’Abraham.
- source_word: ὃ
  choice: ce que
  rationale: Rend naturellement le pronom relatif neutre dans la construction française.
- source_word: ἐπήγγελται
  choice: avait promis
  rationale: Le plus-que-parfait convient au récit passé et présente la promesse comme antérieure, tout en laissant au contexte la portée durable du parfait grec.
- source_word: δυνατός ἐστιν
  choice: était capable
  rationale: Le grec emploie littéralement le présent « est capable ». L’imparfait s’intègre naturellement au cadre narratif passé sans modifier l’affirmation de la puissance divine.
- source_word: καὶ
  choice: aussi
  rationale: Marque que celui qui a promis possède également la capacité d’accomplir sa promesse.
- source_word: ποιῆσαι
  choice: de l’accomplir
  rationale: Dans le contexte d’une promesse, « accomplir » exprime naturellement l’idée de faire effectivement ce qui a été promis; le pronom « l’ » reprend le contenu de la promesse.
theological_decisions:
- issue: Sujet implicite de la promesse et de la capacité
  choice: Conserver le pronom « il » dans le texte principal.
  alternative: 'Expliciter : « Dieu était aussi capable d’accomplir ce qu’il avait promis. »'
  rationale: Le contexte identifie clairement Dieu, mais le verset grec ne le nomme pas explicitement. Le pronom préserve cette caractéristique sans créer d’ambiguïté réelle en contexte.
- issue: Temps présent de δυνατός ἐστιν
  choice: Employer « était capable » dans le cadre narratif passé.
  alternative: Traduire littéralement « est capable » pour souligner la validité permanente de la capacité divine.
  rationale: Le français appelle naturellement la concordance au passé dans cette phrase. Une note conserve toutefois la forme exacte et la possible portée du présent grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le fragment participial est maintenu afin de respecter la continuité syntaxique avec le verset précédent. « Pleinement convaincu » évite les tournures vieillies comme « pleinement persuadé » tout en gardant l’intensité du grec.
