id: ROM.4.13
reference: Romans 4:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: fr
  text: Car ce n’est pas par la loi que la promesse selon laquelle Abraham serait héritier du monde a été faite à Abraham ou à sa descendance[a], mais par la justice de la foi[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « semence ». Le mot grec est au singulier, mais il peut avoir un sens collectif et désigner la descendance ou les descendants.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « par la justice de la foi »; on peut aussi comprendre « par la justice fondée sur la foi » ou « par la justice qui vient de la foi ».
    reason: alternative_reading
  - marker: c
    text: Le mot grec traduit par « foi » peut aussi signifier « fidélité » ou « confiance », selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: promesse
  rationale: « Promesse » est le terme français naturel pour l’engagement divin évoqué par Paul et en conserve la portée.
- source_word: σπέρματι
  choice: descendance
  rationale: Le nom grec est au singulier mais peut avoir un sens collectif. « Descendance » rend naturellement cette valeur en français.
- source_word: κληρονόμον αὐτὸν εἶναι κόσμου
  choice: d’hériter du monde
  rationale: Cette formulation française exprime clairement l’idée d’être héritier sans restreindre la portée générale de κόσμος.
- source_word: διὰ νόμου
  choice: par la loi
  rationale: Dans l’argument de Paul, la référence à la Loi est naturelle; la minuscule évite toutefois d’imposer typographiquement une identification plus précise que le grec anarthre.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » est le correspondant français courant de δικαιοσύνη dans ce contexte paulinien et peut désigner la qualité ou le statut de ce qui est juste devant Dieu.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est ici le choix contextuel le plus naturel dans le contraste avec la loi, tout en laissant « fidélité » comme possibilité lexicale en note.
- source_word: διὰ δικαιοσύνης πίστεως
  choice: par la justice qui vient de la foi
  rationale: Cette expression est claire en français moderne et rend la relation génitive probable, tout en signalant en note la formulation plus littérale et son ambiguïté.
theological_decisions:
- issue: Relation exprimée par δικαιοσύνης πίστεως
  choice: « la justice qui vient de la foi »
  alternative: « la justice de la foi » ou « la justice fondée sur la foi »
  rationale: Le génitif grec est condensé et peut être développé de plusieurs manières. Le texte principal adopte une formulation française intelligible sans préciser davantage le mécanisme théologique; la note conserve l’expression plus formelle.
- issue: Référent de αὐτόν dans « héritier du monde »
  choice: Reformulation infinitive « faite à Abraham ou à sa descendance d’hériter du monde »
  alternative: « selon laquelle il serait héritier du monde »
  rationale: Le masculin singulier peut renvoyer à Abraham, tandis que la promesse inclut aussi sa descendance. La reformulation française évite une reprise pronominale maladroite sans résoudre abusivement l’articulation entre Abraham et sa descendance.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase suit le mouvement argumentatif grec tout en évitant le tour peu naturel « être héritier du monde ». Les notes préservent le singulier collectif de σπέρμα et l’ambiguïté de la construction δικαιοσύνης πίστεως.
