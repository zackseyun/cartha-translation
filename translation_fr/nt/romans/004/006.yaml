revisions:
- from: 'De même, David proclame lui aussi le bonheur de la personne à qui Dieu compte la justice indépendamment des œuvres[a][b] :'
  to: 'Ainsi, David aussi parle du bonheur de la personne à qui Dieu attribue la justice indépendamment des œuvres[a][b] :'
  rationale: La révision maintient la portée représentative de ἀνθρώπου avec « la personne », le sens abstrait de δικαιοσύνη avec « justice » et le contraste de χωρὶς ἔργων. Elle remplace une formulation légèrement interprétative et une construction française maladroite par des équivalents plus fidèles et naturels. Les deux appels de note restent correctement ancrés après l’expression qu’ils éclairent.
