reference: Romans 4:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: fr
  text: 'Ainsi, David aussi parle du bonheur de la personne à qui Dieu attribue la justice indépendamment des œuvres[a][b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « porte la justice à son compte »; littéralement, Dieu « compte » la justice.
    reason: lexical_alternative
  - marker: b
    text: Ou « sans œuvres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: De même
  rationale: Introduit naturellement en français la comparaison avec l’argument précédent.
- source_word: καὶ
  choice: lui aussi
  rationale: 'Rend la valeur additive : David vient appuyer le raisonnement comme témoin supplémentaire.'
- source_word: λέγει τὸν μακαρισμόν
  choice: proclame le bonheur
  rationale: Le grec associe le verbe « dire » au nom μακαρισμός. Cette formulation française naturelle conserve l’idée d’une déclaration concernant l’état heureux de quelqu’un.
- source_word: τοῦ ἀνθρώπου
  choice: de la personne
  rationale: Dans ce contexte, le masculin grec singulier a une portée représentative et désigne tout être humain concerné, sans restriction aux hommes.
- source_word: λογίζεται
  choice: compte
  rationale: Préserve la métaphore d’évaluation ou de comptabilité tout en restant clair et actuel; « met au compte » est signalé en note.
- source_word: δικαιοσύνην
  choice: la justice
  rationale: « Justice » est l’équivalent français courant de δικαιοσύνη et peut désigner ici la qualité ou le statut juste compté par Dieu.
- source_word: χωρὶς ἔργων
  choice: indépendamment des œuvres
  rationale: Exprime que les œuvres ne constituent pas le fondement de ce que Dieu compte, tout en conservant le contraste paulinien.
theological_decisions:
- issue: Portée de ἀνθρώπου
  choice: la personne
  alternative: l’homme
  rationale: Le substantif grec est grammaticalement masculin et singulier, mais son emploi est représentatif. « La personne » communique cette portée universelle sans ajouter de restriction sexuelle.
- issue: Sens de λογίζεται
  choice: compte
  alternative: met au compte
  rationale: « Compte » garde ouverte la nuance d’estimation ou d’imputation du verbe grec sans imposer un jargon théologique spécialisé.
- issue: Rendu de δικαιοσύνη
  choice: la justice
  alternative: le fait d’être juste
  rationale: Le nom abstrait grec est conservé par un nom abstrait français. La formulation ne tranche pas à elle seule entre qualité morale, statut juste et don divinement accordé.
- issue: Rapport entre la justice et les œuvres
  choice: indépendamment des œuvres
  alternative: sans œuvres
  rationale: Cette formulation maintient l’affirmation que le calcul divin ne dépend pas des œuvres, sans développer au-delà de ce que dit le verset.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste proche de la structure grecque tout en évitant le calque « dit le bonheur ». Le deux-points final convient puisque le verset introduit la citation de David qui suit.
