id: ROM.4.17
reference: Romans 4:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: fr
  text: 'comme il est écrit : « Je t’ai établi père d’un grand nombre de nations[a] » — devant le Dieu en qui il a cru, celui qui donne la vie aux morts et qui appelle ce qui n’existe pas comme si cela existait[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot traduit par « nations » peut aussi désigner les non-Juifs ; dans cette citation de la Genèse, le sens plus large est toutefois plus probable.
    reason: lexical_alternative
  - marker: b
    text: 'Ou, dans un sens plus interprétatif : « appelle à l’existence ce qui n’existe pas ».'
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule courante d’introduction d’une citation de l’Écriture; le présent français rend naturellement la valeur durable du parfait grec.
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: père d’un grand nombre de nations
  rationale: Dans la citation de la Genèse, ἐθνῶν désigne largement des nations ou des peuples, plutôt que spécifiquement les non-Juifs par opposition aux Juifs.
- source_word: τέθεικά σε
  choice: je t’ai établi
  rationale: « Établi » exprime ici l’action souveraine de Dieu qui confère à Abraham une vocation et un statut durables, tout en restant idiomatique dans une citation solennelle.
- source_word: κατέναντι οὗ ἐπίστευσεν θεοῦ
  choice: C’est devant Dieu, en qui il a cru
  rationale: La reprise française en « C’est devant Dieu » rend clairement le rapport de κατέναντι avec θεοῦ sans produire une construction obscure; « croire en » exprime naturellement la confiance placée en Dieu.
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: qui donne la vie aux morts
  rationale: Formulation française naturelle qui conserve l’idée de Dieu caractérisé par sa puissance vivifiante.
- source_word: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα
  choice: qui appelle ce qui n’existe pas comme si cela existait
  rationale: Cette formulation reste proche de l’expression grecque condensée et en préserve l’ouverture interprétative, sans expliciter dans le texte principal une création à partir du néant.
theological_decisions:
- issue: Faut-il rendre la dernière proposition comme une affirmation explicite de la création à partir du néant?
  choice: appelle ce qui n’existe pas comme si cela existait
  alternative: appelle à l’existence ce qui n’existe pas
  rationale: Le grec peut évoquer la puissance créatrice de Dieu, mais sa formulation demeure concise et susceptible de plusieurs nuances. Le texte principal conserve cette tension; la note donne l’interprétation plus explicite.
translation_notes:
  register: Français international moderne, digne et accessible. La structure « C’est devant Dieu… devant celui qui… » explicite le lien syntaxique du grec tout en gardant la continuité avec le contexte précédent. La citation conserve une tonalité scripturaire sans archaïsme.
