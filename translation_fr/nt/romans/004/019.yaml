revisions:
- from: Et sans faiblir dans la foi, il considéra son propre corps comme déjà frappé de mort — puisqu’il avait environ cent ans — ainsi que l’état de mort du ventre de Sara.[a][b]
  to: Et, sans faiblir dans la foi, il considéra[a] son propre corps, déjà comme mort — puisqu’il avait environ cent ans —, et l’état de mort du ventre de Sara[b].
  rationale: La révision conserve la lecture du SBLGNT et les deux images apparentées de mort. Elle remplace une expression française plus ambiguë par « déjà comme mort » et rétablit les ancres de notes à l’endroit précis où la variante textuelle et l’alternative lexicale sont pertinentes.
