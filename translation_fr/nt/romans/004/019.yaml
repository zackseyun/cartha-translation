  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: fr
  text: Et, sans faiblir dans la foi, il considéra[a] son propre corps, déjà comme mort — puisqu’il avait environ cent ans —, et l’état de mort du ventre de Sara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Selon une autre tradition textuelle : « il ne considéra pas son propre corps, déjà comme mort ».'
    reason: textual_variant
  - marker: b
    text: Ou « la stérilité du ventre de Sara ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: sans faiblir
  rationale: Cette formulation verbale naturelle conserve la valeur du participe aoriste et exprime qu’Abraham ne perdit pas sa force dans la foi.
- source_word: πίστει
  choice: dans la foi
  rationale: Dans ce contexte, le terme désigne la confiance d’Abraham dans la promesse de Dieu; « foi » demeure le rendu français courant et théologiquement non restrictif.
- source_word: κατενόησεν
  choice: il considéra
  rationale: Le verbe indique qu’il prit délibérément en compte la réalité de sa situation, sans suggérer qu’il doutait de la promesse.
- source_word: νενεκρωμένον
  choice: comme déjà frappé de mort
  rationale: Le participe parfait décrit un état d’impuissance quant à la procréation, non la mort physique; ce choix conserve l’image de la mort et la nuance résultative.
- source_word: ἑκατονταετής που ὑπάρχων
  choice: puisqu’il avait environ cent ans
  rationale: « Environ » rend πού, tandis que « puisqu’il avait » intègre naturellement la proposition participiale à son rôle explicatif.
- source_word: νέκρωσιν
  choice: l’état de mort
  rationale: Ce rendu préserve le vocabulaire de la mort et son parallélisme avec le corps d’Abraham, tout en restant intelligible en français moderne.
- source_word: μήτρας Σάρρας
  choice: du ventre de Sara
  rationale: « Ventre » rend concrètement μήτρα dans un registre biblique digne et courant; la construction avec « de Sara » est naturelle en français.
theological_decisions:
- issue: Faut-il atténuer l’image de mort reproductive en parlant de stérilité ?
  choice: Conserver l’image explicite de la mort dans les deux propositions.
  alternative: Parler du corps impuissant d’Abraham et de la stérilité de Sara.
  rationale: Paul associe intentionnellement, par des termes apparentés, le corps d’Abraham et le ventre de Sara à la mort. Cette tension souligne l’impossibilité humaine surmontée par la promesse de Dieu.
- issue: Variante textuelle concernant la négation devant κατενόησεν
  choice: 'Suivre le texte du SBLGNT : « il considéra son propre corps ».'
  alternative: 'Selon une autre tradition textuelle : « il ne considéra pas son propre corps ».'
  rationale: Le texte fourni comporte κατενόησεν sans négation, mais l’autre tradition est suffisamment importante et modifie assez nettement le sens immédiat pour être signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le parallélisme des images de mort sans employer un langage médical trop technique. Les tirets rendent lisible l’explication liée à l’âge d’Abraham.
