    issue: Ancre de la note textuelle mal placée
    rationale: La note a porte sur la présence ou l’absence de négation avec « il considéra » ; elle ne doit pas être ancrée à la fin du verset.
  - severity: medium
    issue: Ancre de l’alternative lexicale mal placée
    rationale: La note b explique νέκρωσιν (« état de mort ») ; elle doit suivre cette expression, non être regroupée avec la note textuelle en fin de verset.
  - severity: low
    issue: « déjà frappé de mort » est une formulation moins idiomatique et légèrement moins exacte
    rationale: L’expression française peut suggérer une action subie ou la mort elle-même. « déjà comme mort » exprime plus directement l’état d’impuissance décrit par le parfait grec, sans affirmer une mort physique.
