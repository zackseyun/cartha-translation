reference: Romans 4:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: fr
  text: Or, à celui qui travaille, le salaire n’est pas compté comme une faveur[a], mais comme un dû[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par grâce » ou « selon la grâce ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme une dette » ou « comme ce qui est dû ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: à celui qui travaille
  rationale: Le participe présent substantivé désigne de manière générale la personne qui accomplit un travail; cette formulation est naturelle et conserve cette portée.
- source_word: μισθὸς
  choice: le salaire
  rationale: Dans ce contexte de travail et de rémunération, « salaire » exprime précisément la contrepartie acquise par le travail.
- source_word: λογίζεται
  choice: est porté à son compte
  rationale: Cette expression française restitue clairement la métaphore comptable de λογίζομαι et convient au singulier « salaire ».
- source_word: κατὰ χάριν
  choice: comme une faveur
  rationale: Dans l’opposition avec un salaire dû, « comme une faveur » exprime le caractère non acquis de χάρις tout en conservant sa nuance de faveur; « par grâce » reste possible.
- source_word: ὀφείλημα
  choice: un dû
  rationale: Le nom désigne ce qui est dû, une dette ou une obligation. « Un dû » rend directement le contraste avec une faveur.
- source_word: δὲ
  choice: Or
  rationale: δέ assure ici une transition légèrement contrastive avec l’énoncé précédent; « Or » rend ce lien sans introduire une valeur temporelle.
theological_decisions:
- issue: Traduction de χάρις dans l’opposition entre salaire et dette
  choice: comme une faveur
  alternative: par grâce / selon la grâce
  rationale: Le contexte oppose une rémunération acquise à ce qui relève d’une faveur non due. « Comme une faveur » rend cette opposition en français courant sans nier la portée théologique plus large du terme « grâce ».
- issue: Traduction de ὀφείλημα
  choice: comme un dû
  alternative: comme une dette / selon ce qui est dû
  rationale: « Un dû » maintient l’idée d’une créance exigible et l’opposition exacte entre faveur et obligation, sans préciser davantage la relation juridique.
translation_notes:
  register: Français international moderne, clair et digne. La tournure comptable « porté à son compte » conserve l’image paulinienne; « faveur » et « dû » rendent l’opposition économique sans surcharge confessionnelle.
