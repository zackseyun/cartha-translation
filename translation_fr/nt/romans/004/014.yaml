id: ROM.4.14
reference: Romans 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: fr
  text: En effet, si ceux qui relèvent de la Loi[a] sont héritiers, la foi est vidée de son contenu[b] et la promesse est rendue sans effet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ceux qui sont de la Loi » ; autre traduction possible : « ceux qui vivent selon la Loi ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « la foi est rendue vaine ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « la promesse est annulée » ou « privée d’efficacité ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: ceux qui relèvent de la Loi
  rationale: Rend naturellement en français la relation définissante exprimée par ἐκ νόμου, sans la réduire explicitement à la seule observance de la Loi.
- source_word: κληρονόμοι
  choice: les héritiers
  rationale: Terme français courant et précis dans le contexte de la promesse et de l’héritage.
- source_word: κεκένωται
  choice: est vidée de son contenu
  rationale: Conserve l’image de κενόω tout en exprimant clairement que la foi perd sa substance ou sa portée; le parfait grec décrit un état résultant.
- source_word: πίστις
  choice: la foi
  rationale: Dans l’argument de Romains 4, le terme désigne naturellement la foi, mise en contraste avec la Loi comme fondement de l’héritage.
- source_word: κατήργηται
  choice: est rendue sans effet
  rationale: Exprime la mise hors d’effet sans suggérer nécessairement une destruction ou une abolition; le parfait grec est rendu comme un état résultant.
- source_word: ἐπαγγελία
  choice: la promesse
  rationale: Traduction directe et idiomatique de la promesse précise dont Paul traite dans le contexte.
theological_decisions:
- issue: Sens de πίστις dans le contraste paulinien avec νόμος
  choice: la foi
  alternative: la confiance; la fidélité
  rationale: Le contexte oppose l’héritage fondé sur la Loi à celui reçu par la foi. « La foi » préserve cette ligne argumentative sans préciser indûment s’il faut souligner l’acte de croire ou la confiance.
- issue: Portée de οἱ ἐκ νόμου
  choice: ceux qui relèvent de la Loi
  alternative: ceux qui sont de la Loi; ceux qui vivent selon la Loi
  rationale: La formulation choisie conserve l’ambiguïté de l’expression quant à la manière exacte dont ces personnes sont définies par leur rapport à la Loi, plutôt que de l’identifier exclusivement à l’observance.
translation_notes:
  register: Français international moderne, digne et accessible. « La Loi » prend une majuscule pour signaler ici la Loi dans l’argument paulinien. La structure conditionnelle et les deux parfaits à valeur résultative sont conservés.
