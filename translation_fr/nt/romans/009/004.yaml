id: ROM.9.4
reference: Romans 9:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: fr
  text: eux qui sont Israélites, à qui appartiennent l’adoption filiale[a], la gloire[b], les alliances, le don de la Loi, le culte[c] et les promesses,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la condition de fils ». Il s’agit ici du statut filial accordé à Israël comme peuple.
    reason: lexical_alternative
  - marker: b
    text: La « gloire » désigne probablement la présence de Dieu manifestée au milieu d’Israël.
    reason: cultural_note
  - marker: c
    text: C’est-à-dire le service cultuel rendu à Dieu selon les dispositions confiées à Israël.
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: eux qui sont Israélites
  rationale: La tournure reprend les proches de Paul mentionnés au verset précédent et introduit leur identité historique. « Israélites » conserve la désignation ethnique et liée à l’alliance.
- source_word: ὧν
  choice: à qui appartiennent
  rationale: Le génitif relatif exprime ici la possession. Cette formulation est naturelle en français moderne et évite le tour lourd « dont sont ».
- source_word: υἱοθεσία
  choice: l’adoption filiale
  rationale: Le terme désigne l’établissement dans la condition de fils. « Adoption filiale » conserve la métaphore tout en indiquant clairement sa dimension familiale.
- source_word: δόξα
  choice: la gloire
  rationale: La traduction littérale préserve la densité du terme et son probable rapport à la présence manifestée de Dieu sans expliciter ce rapport dans le texte principal.
- source_word: διαθῆκαι
  choice: les alliances
  rationale: Le pluriel du texte grec est conservé.
- source_word: νομοθεσία
  choice: le don de la Loi
  rationale: Le nom désigne l’acte par lequel la Loi a été donnée ou établie, et non simplement la Loi elle-même.
- source_word: λατρεία
  choice: le culte
  rationale: Dans ce contexte, le terme renvoie au service cultuel rendu à Dieu selon les dispositions données à Israël. « Le culte » est précis sans le limiter au seul Temple ou au seul sacerdoce.
- source_word: ἐπαγγελίαι
  choice: les promesses
  rationale: Le pluriel est maintenu et désigne les promesses de Dieu confiées à Israël.
theological_decisions:
- issue: Sens de υἱοθεσία appliqué à Israël
  choice: l’adoption filiale
  alternative: la condition de fils
  rationale: Le contexte énumère les privilèges historiques d’Israël en tant que peuple. La traduction garde la métaphore de l’adoption sans la réduire à son emploi individuel dans d’autres contextes pauliniens.
- issue: Référent de ἡ δόξα
  choice: la gloire
  alternative: la présence glorieuse de Dieu
  rationale: Il s’agit probablement de la manifestation de la présence divine au milieu d’Israël, mais le grec dit seulement « la gloire » ; le texte principal conserve donc cette concision et cette ouverture.
- issue: Portée de λατρεία
  choice: le culte
  alternative: le service sacré
  rationale: Le contexte favorise le culte institué d’Israël, mais le terme ne doit pas être limité sans nécessité au service sacerdotal ou au Temple.
translation_notes:
  register: Français international moderne, digne et accessible. L’énumération serrée du grec est conservée, ainsi que les articles définis et les pluriels. La majuscule à « Loi » signale ici la Loi donnée à Israël, sans ajouter d’explication confessionnelle.
