  text: Τί οὖν ἐροῦμεν; μὴ ἀδικία παρὰ τῷ θεῷ; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/014.yaml
  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: fr
  text: Que dirons-nous donc ? Y a-t-il de l’injustice de la part de Dieu[a] ? Certainement pas ![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Y a-t-il de l’injustice chez Dieu ? » Littéralement, la préposition peut évoquer ce qui se trouve auprès de Dieu ou ce qui vient de sa part.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « Que cela n’arrive pas ! » Formule grecque exprimant un refus catégorique ; on peut aussi traduire : « Absolument pas ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Que dirons-nous donc ?
  rationale: Cette formule de transition fréquente chez Paul introduit une déduction ou une objection. Le futur français conserve naturellement la valeur délibérative de ἐροῦμεν.
- source_word: μὴ
  choice: Y a-t-il
  rationale: Dans une question directe, μή signale ici qu’une réponse négative est attendue. La formulation interrogative française rend cette orientation sans alourdir le texte.
- source_word: ἀδικία
  choice: injustice
  rationale: Dans ce contexte, le terme désigne une injustice ou un manque de droiture dans la manière d’agir. « Injustice » exprime clairement sa portée morale et judiciaire.
- source_word: παρὰ τῷ θεῷ
  choice: en Dieu
  rationale: La préposition παρά avec le datif peut ici désigner ce qui se trouve chez quelqu’un ou caractérise sa conduite. « En Dieu » est une tournure française naturelle, concise, et laisse intacte la question de savoir si une injustice pourrait être attribuée à Dieu.
- source_word: μὴ γένοιτο
  choice: Certainement pas !
  rationale: Cette formule constitue une réfutation grecque fortement emphatique. « Certainement pas ! » en restitue la vigueur dans un français actuel sans reproduire littéralement une tournure optative peu idiomatique.
theological_decisions:
- issue: Préserver l’objection rhétorique concernant une éventuelle injustice divine sans imposer un système théologique à Romains 9.
  choice: Le texte pose brièvement la question d’une injustice en Dieu, puis la rejette avec force.
  alternative: « Dieu serait-il injuste ? Jamais de la vie ! » serait plus interprétatif et plus familier ; « Y a-t-il de l’injustice de la part de Dieu ? Que cela n’arrive jamais ! » serait plus formel.
  rationale: Le grec énonce sobrement l’objection et son rejet catégorique, sans ajouter d’explication sur l’élection, la réprobation ou la justice divine. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation demeure concise et rhétorique. « Certainement pas ! » rend l’intensité de la négation sans archaïsme ni registre excessivement familier.
