  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: fr
  text: Cependant, ce n’est pas comme si la parole de Dieu avait échoué. En effet, ce ne sont pas tous ceux qui descendent d’Israël[a] qui sont Israël[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque indique ici l’origine ou la descendance.
    reason: lexical_alternative
  - marker: b
    text: 'Le second emploi d’« Israël » a un sens plus restreint que le premier : Paul distingue la descendance physique d’Israël d’« Israël » au sens où il l’emploie ici.'
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: Cependant, ce n’est pas comme si
  rationale: Cette tournure française naturelle conserve la correction introduite par δέ et présente comme irréelle l’idée que la parole de Dieu aurait échoué.
- source_word: ἐκπέπτωκεν
  choice: avait échoué
  rationale: Dans ce contexte, le verbe signifie que la parole n’a pas manqué son effet ni failli. « Échoué » rend cet emploi idiomatique; le plus-que-parfait s’accorde naturellement avec « comme si ».
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette traduction formelle maintient la portée assez large de λόγος sans la réduire explicitement à la seule promesse.
- source_word: οὐ γὰρ πάντες
  choice: En effet, tous … ne … pas
  rationale: « En effet » exprime la fonction explicative de γάρ. La négation partielle « tous … ne … pas » signifie ici « ce ne sont pas tous », conformément au grec.
- source_word: οἱ ἐξ Ἰσραήλ
  choice: ceux qui descendent d’Israël
  rationale: ἐξ indique ici l’origine ou la filiation. Cette formulation est plus claire en français que le calque « ceux qui sont d’Israël ».
- source_word: οὗτοι Ἰσραήλ
  choice: ne sont pas Israël
  rationale: La proposition nominale grecque est rendue par une formulation concise qui préserve le contraste frappant entre les deux emplois d’« Israël ».
theological_decisions:
- issue: Sens du second emploi d’« Israël »
  choice: Conserver « Israël » sans expliciter davantage dans le corps du texte
  alternative: Préciser « le véritable Israël », « l’Israël élu » ou « le peuple de Dieu »
  rationale: Paul emploie le même nom avec une portée plus étroite dans la seconde occurrence, mais le verset seul ne définit pas entièrement cette portée. La traduction préserve donc la tension entre descendance physique et appartenance à Israël au sens de l’accomplissement du dessein de Dieu, sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Cependant » et « En effet » rendent clairement l’enchaînement logique. La répétition d’« Israël » est maintenue afin de préserver la formulation et la tension théologique du grec.
