id: ROM.9.22
reference: Romans 9:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: fr
  text: Mais si Dieu[a], voulant manifester sa colère et faire connaître sa puissance[b], a supporté avec une grande patience des vases de colère préparés pour la destruction[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mais qu’en est-il si Dieu ». Le grec ouvre ici une phrase conditionnelle rhétorique qui se poursuit au verset suivant.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « ce qui est puissant en lui » ou « ce dont il est capable »; ici, l’expression désigne sa puissance.'
    reason: lexical_alternative
  - marker: c
    text: Le passif « préparés pour la destruction » ne précise pas qui a préparé ces vases. On comprend diversement cette formulation comme évoquant l’action de Dieu, l’endurcissement des personnes elles-mêmes ou simplement leur état de préparation pour le jugement.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: Introduit la proposition conditionnelle rhétorique dont la construction se poursuit au verset suivant. Cette formulation conserve la suspension syntaxique du grec sans transformer le verset en affirmation indépendante.
- source_word: θέλων
  choice: voulant
  rationale: Reproduit naturellement le participe présent et laisse ouverte la relation exacte avec le verbe principal, sans imposer une valeur concessive ou causale.
- source_word: ἐνδείξασθαι
  choice: manifester
  rationale: Exprime l'idée de rendre visible ou de montrer de manière probante; le terme convient au registre digne du passage.
- source_word: τὴν ὀργήν
  choice: sa colère
  rationale: « Colère » est le terme français courant et bibliquement approprié pour la réaction judiciaire de Dieu; le possessif explicite le référent déjà présent dans le grec.
- source_word: γνωρίσαι
  choice: faire connaître
  rationale: Rend directement la valeur causative du verbe grec.
- source_word: τὸ δυνατὸν αὐτοῦ
  choice: sa puissance
  rationale: Dans ce contexte, le substantif neutre désigne ce dont Dieu est capable, c'est-à-dire sa puissance. Une note conserve la possibilité d'une traduction plus littérale.
- source_word: ἤνεγκεν
  choice: a supporté
  rationale: Avec le complément indiquant une grande patience, le verbe signifie ici endurer ou tolérer. « A supporté » est naturel et conserve l'idée de porter avec patience.
- source_word: ἐν πολλῇ μακροθυμίᾳ
  choice: avec une grande patience
  rationale: Formulation moderne et claire qui exprime la manière et l'intensité sans recourir à l'archaïsme « longanimité ».
- source_word: σκεύη
  choice: vases
  rationale: Préserve l'image du potier et des récipients dans le contexte immédiat, plutôt que de l'aplatir en « objets ».
- source_word: σκεύη ὀργῆς
  choice: des vases de colère
  rationale: Conserve le génitif compact et son ambiguïté sémantique sans ajouter « destinés à » ou « objets de ».
- source_word: κατηρτισμένα
  choice: préparés
  rationale: Le participe parfait passif décrit un état de préparation sans nommer l'agent; la traduction maintient cette absence d'agent.
- source_word: εἰς ἀπώλειαν
  choice: pour la destruction
  rationale: Rend clairement l'orientation vers une issue de ruine ou de destruction, tout en restant proche de la formulation grecque.
theological_decisions:
- issue: Agent implicite du passif κατηρτισμένα (« préparés »)
  choice: Conserver le passif « préparés » sans préciser qui a préparé les vases.
  alternative: « préparés par Dieu », « devenus propres à la destruction » ou « s'étant eux-mêmes préparés »
  rationale: Le grec ne nomme pas l'agent. Le préciser dans le texte trancherait une question théologique que la formulation de Paul laisse ouverte.
- issue: Portée de la condition inachevée introduite par εἰ
  choice: Traduire par « Mais si » et laisser la phrase se poursuivre au verset 23.
  alternative: « Mais qu'en est-il si » ou reformulation en affirmation complète
  rationale: La syntaxe grecque est suspendue et se prolonge dans le verset suivant. La conserver évite de donner à ce seul verset une autonomie ou une force assertive qu'il n'a pas explicitement.
- issue: Relation logique du participe θέλων au verbe principal
  choice: Employer le participe neutre « voulant » sans préciser « bien que » ou « parce que ».
  alternative: « bien qu'il ait voulu » ou « parce qu'il voulait »
  rationale: Le grec ne marque pas explicitement une valeur concessive ou causale; la traduction préserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le choix de « vases » maintient l'image de la poterie présente dans le contexte. La virgule finale signale que la construction conditionnelle demeure inachevée et se poursuit au verset suivant.
