reference: Romans 9:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: fr
  text: 'Car l’Écriture dit au pharaon : « C’est précisément dans ce but que je t’ai suscité[a] : pour montrer en toi ma puissance et pour que mon nom[b] soit proclamé sur toute la terre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je t’ai maintenu en vie » ou « je t’ai fait tenir debout » ; dans le contexte de la citation de l’Exode, le verbe peut avoir une portée plus large.
    reason: lexical_alternative
  - marker: b
    text: Ici, le « nom » de Dieu désigne sa renommée et ce qu’il révèle de lui-même, et non pas seulement une appellation.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφὴ τῷ Φαραώ
  choice: Car l’Écriture dit au pharaon
  rationale: Le présent « dit » conserve le présent littéraire et la personnification de l’Écriture. « Car » maintient le lien explicatif avec l’argument précédent.
- source_word: Εἰς αὐτὸ τοῦτο
  choice: C’est précisément dans ce but
  rationale: Cette formulation française naturelle rend à la fois la finalité et l’insistance de l’expression grecque.
- source_word: ἐξήγειρά σε
  choice: je t’ai suscité
  rationale: '« Susciter » garde une portée suffisamment large : Dieu a fait surgir ou placé le pharaon dans ce rôle, sans préciser abusivement s’il s’agit de son élévation, de son maintien en vie ou de son établissement.'
- source_word: ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου
  choice: pour montrer en toi ma puissance
  rationale: « Montrer » exprime la manifestation publique visée par ἐνδείξωμαι, tandis que « en toi » conserve sans l’interpréter la préposition ἐν.
- source_word: καὶ ὅπως διαγγελῇ τὸ ὄνομά μου
  choice: et pour que mon nom soit proclamé
  rationale: Le passif français préserve la forme et le sens de proclamation étendue du grec, sans nommer un agent absent du texte.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: sur toute la terre
  rationale: Cette tournure idiomatique conserve la portée universelle de γῆ dans ce contexte.
theological_decisions:
- issue: Sens de ἐξήγειρά σε et souveraineté divine à l’égard du pharaon
  choice: je t’ai suscité
  alternative: je t’ai maintenu en vie ; je t’ai fait tenir debout ; je t’ai fait paraître
  rationale: Le choix affirme l’action souveraine de Dieu tout en maintenant l’amplitude du verbe et la tension avec la responsabilité humaine, sans imposer une explication doctrinale plus étroite que le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche de l’argumentation de Paul, avec une ponctuation qui rend clairement les deux propositions de but. Les deux marqueurs de notes figurent dans le texte principal.
