- from: 'Car il dit à Moïse : « Je ferai miséricorde à qui je fais miséricorde, et j’aurai compassion de qui j’ai compassion. »[a]'
  to: 'Car il dit à Moïse : « Je ferai grâce à qui je ferai grâce, et j’aurai compassion de qui j’aurai compassion. »[a]'
  rationale: La révision remplace une expression vieillie par une formulation française moderne et idiomatique. Elle maintient le lien argumentatif de « Car », le présent de citation « il dit », l’attribution implicite à Dieu, le parallélisme des deux membres et l’absence de toute explicitation doctrinale concernant le choix divin. L’ancre de renvoi et son contenu restent correctement placés.
