source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: fr
  text: 'Car il dit à Moïse : « Je ferai grâce à qui je ferai grâce, et j’aurai compassion de qui j’aurai compassion. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citation d’Exode 33.19.
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: à Moïse
  rationale: Le datif désigne naturellement le destinataire de λέγει ; « Moïse » est la forme française usuelle du nom.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication de l’affirmation précédente et conserve clairement le lien argumentatif.
- source_word: λέγει
  choice: il dit
  rationale: Le présent de la formule de citation est conservé. Le sujet implicite est Dieu, qui parle directement à Moïse dans le contexte d’Exode 33.19.
- source_word: Ἐλεήσω … ἐλεῶ
  choice: Je ferai miséricorde … je fais miséricorde
  rationale: La répétition du même verbe est maintenue, ainsi que l’articulation entre futur et présent. « Faire miséricorde » exprime la faveur compatissante sans introduire l’idée explicite de choix, absente du grec.
- source_word: ὃν ἂν
  choice: à qui / de qui
  rationale: La tournure relative indéfinie est rendue naturellement en français ; les prépositions varient selon les constructions françaises « faire miséricorde à » et « avoir compassion de ».
- source_word: οἰκτιρήσω … οἰκτίρω
  choice: j’aurai compassion … j’ai compassion
  rationale: Cette formulation distingue οἰκτίρω de ἐλεέω tout en reproduisant le parallélisme et la répétition du texte grec.
theological_decisions:
- issue: Identification du sujet de la formule de citation
  choice: « il dit », avec Dieu comme sujet implicite
  alternative: « l’Écriture dit à Moïse »
  rationale: Le grec n’exprime pas le sujet, mais la citation reprend la parole directe de Dieu en Exode 33.19. La formulation personnelle respecte ce contexte sans ajouter « l’Écriture », absent du verset.
- issue: Liberté divine dans la miséricorde et la compassion
  choice: Conserver la formulation répétitive sans l’expliciter
  alternative: « Je ferai miséricorde à qui je choisirai de faire miséricorde »
  rationale: Le verbe « choisir » n’est pas présent dans le grec. La répétition préserve l’ambiguïté et la tension théologique du texte sans trancher les débats sur l’élection.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition volontaire, quelque peu solennelle, reflète le parallélisme de la citation et évite une paraphrase doctrinale.
