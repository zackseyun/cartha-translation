base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: fr
  text: 'Et à l’endroit même où il leur fut dit : « Vous n’êtes pas mon peuple », là ils seront appelés fils[a] du Dieu vivant.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « enfants du Dieu vivant ». Le grec dit littéralement « fils », expression conservée dans le texte pour préserver le vocabulaire de la filiation et ses possibles résonances d’héritage.
    reason: lexical_alternative
  - marker: b
    text: Citation d’Osée 2.1 selon la numérotation française courante (Osée 1.10 dans d’autres traditions de numérotation), dans un contexte de restauration du peuple de Dieu.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui relie cette citation à la précédente sans lui ajouter une valeur déductive.
- source_word: ἔσται ἐν τῷ τόπῳ οὗ
  choice: à l’endroit même où
  rationale: Cette tournure française naturelle exprime le lieu et souligne la correspondance emphatique entre le rejet annoncé et le rétablissement.
- source_word: ἐρρέθη αὐτοῖς
  choice: il leur avait été dit
  rationale: Le plus-que-parfait passif rend naturellement en français une parole antérieure à l’événement futur, tout en conservant le passif impersonnel du grec.
- source_word: Οὐ λαός μου ὑμεῖς
  choice: Vous n’êtes pas mon peuple
  rationale: Formulation claire qui conserve la formule d’identité d’alliance reprise d’Osée.
- source_word: ἐκεῖ
  choice: là
  rationale: L’adverbe maintient l’insistance sur le renversement qui se produit au même endroit.
- source_word: κληθήσονται
  choice: ils seront appelés
  rationale: Le futur passif préserve la forme grecque et laisse implicite l’agent divin.
- source_word: υἱοὶ
  choice: fils
  rationale: Le grec emploie explicitement le masculin pluriel υἱοί; « fils » en conserve la forme ainsi que les possibles résonances de filiation et d’héritage.
- source_word: θεοῦ ζῶντος
  choice: du Dieu vivant
  rationale: Expression biblique établie et naturelle en français, qui conserve le contraste théologique implicite avec les divinités sans vie.
theological_decisions:
- issue: Sens représentatif du pluriel υἱοὶ
  choice: fils
  alternative: enfants
  rationale: « Fils » suit la forme lexicale du grec et préserve les résonances possibles de filiation et d’héritage. Une note indique que, dans ce contexte collectif, l’expression peut désigner les enfants de Dieu sans distinction de sexe.
- issue: Identité d’alliance exprimée par λαός μου
  choice: mon peuple
  alternative: le peuple qui m’appartient
  rationale: « Mon peuple » conserve la formule concise d’alliance et le langage de restauration provenant d’Osée, sans l’expliciter davantage.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’opposition emphatique entre « à l’endroit même » et « là ». Les marqueurs de note suivent la proposition entière afin de ne pas interrompre la citation.
