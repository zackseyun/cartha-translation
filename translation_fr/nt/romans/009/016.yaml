id: ROM.9.16
reference: Romans 9:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: fr
  text: Ainsi donc[a], cela ne dépend ni de celui qui veut ni de celui qui court[b], mais de Dieu qui fait miséricorde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Ainsi donc, ce n’est ni de celui qui veut ni de celui qui court, mais de Dieu qui fait miséricorde. » Le grec est elliptique ; le contexte du dessein et de la miséricorde de Dieu permet de comprendre ce qui est sous-entendu.'
    reason: lexical_alternative
  - marker: b
    text: « Court » évoque probablement ici, de manière imagée, l’effort ou la détermination humaine, mais le verbe grec signifie littéralement « courir ».
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ainsi donc
  rationale: Les deux particules introduisent avec force la conclusion tirée de l’argument précédent. « Ainsi donc » en conserve la valeur déductive dans un français naturel et digne.
- source_word: οὐ ... οὐδὲ
  choice: ne dépend ni ... ni
  rationale: La construction française « ne... ni... ni » rend clairement la double négation grecque tout en s’accordant avec le prédicat implicite explicité.
- source_word: τοῦ θέλοντος
  choice: de celui qui veut
  rationale: Le participe substantivé désigne la personne qui exerce sa volonté. « Veut » préserve directement la nuance volitive sans l’adoucir en simple désir.
- source_word: τοῦ τρέχοντος
  choice: de celui qui court
  rationale: τρέχω signifie littéralement « courir ». L’image concrète est maintenue dans le texte, tandis qu’une note signale sa probable valeur métaphorique d’effort soutenu.
- source_word: ἀλλὰ
  choice: mais
  rationale: « Mais » marque simplement et fortement le contraste introduit par ἀλλά.
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: de Dieu qui fait miséricorde
  rationale: Cette formulation conserve la construction participiale et présente la miséricorde comme une action de Dieu. « Faire miséricorde » est une expression française intelligible, digne et théologiquement non réductrice.
- source_word: prédicat implicite / expression elliptique
  choice: cela ne dépend ... de
  rationale: Le grec omet le prédicat ou le substantif directeur. « Cela dépend de » restitue idiomatiquement la relation sans préciser de façon indue s’il s’agit ici du salut, de l’élection ou du dessein de Dieu.
theological_decisions:
- issue: Sujet elliptique et portée de la dépendance
  choice: Employer le démonstratif général « cela » dans « cela ne dépend... » sans nommer explicitement le salut, l’élection ou le choix de Dieu.
  alternative: « Ce n’est ni de celui qui veut ni de celui qui court, mais de Dieu qui fait miséricorde » ; ou expliciter « le salut » / « le choix de Dieu ».
  rationale: Le grec est elliptique, et le contexte immédiat porte sur le dessein et la miséricorde de Dieu. La formulation retenue demeure claire en français tout en laissant le contexte déterminer le référent et en préservant la tension théologique du passage.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe explicite l’ellipse grecque juste assez pour être naturelle, sans restreindre son référent théologique. L’image de la course et la formulation active de la miséricorde divine sont conservées.
