  source_fidelity: Le texte rend fidèlement l’opposition οὐκ ἐξ ἔργων ἀλλ’ ἐκ τοῦ καλοῦντος, sans expliciter indûment son implication théologique. « Il lui fut dit » conserve utilement le passif impersonnel ἐρρέθη αὐτῇ. « L’aîné » et « le plus jeune » sont justifiés par le contexte de Jacob et Ésaü, tandis que la note préserve les comparatifs grecs plus larges (« le plus grand / le plus petit »).
  naturalness: Le français est moderne et d’un registre biblique sobre. La construction initiale est volontairement elliptique, comme dans le grec et dans la phrase paulinienne en continuité avec le contexte précédent; elle reste intelligible dans ce cadre. « Il lui fut dit » est un peu soutenu, mais naturel dans une formule de citation scripturaire.
  terminology: « Œuvres », « celui qui appelle », « aîné », « plus jeune » et « servira » sont cohérents, précis et non confessionnellement surinterprétés. L’absence de majuscule à « celui » est acceptable en français et ne diminue pas la référence contextuelle à Dieu.
