  text: οὐκ ἐξ ἔργων ἀλλ’ ἐκ τοῦ καλοῦντος, ἐρρέθη αὐτῇ ὅτι Ὁ μείζων δουλεύσει τῷ ἐλάσσονι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: fr
  text: 'non pas à partir des œuvres, mais de celui qui appelle[a], il lui fut dit : « L’aîné servira le plus jeune. »[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « non pas sur la base des œuvres, mais sur celle de celui qui appelle ».'
    reason: lexical_alternative
  - marker: b
    text: Citation de Genèse 25.23.
    reason: cross_reference
  - marker: c
    text: 'Littéralement : « Le plus grand servira le plus petit » ; « l’aîné » et « le plus jeune » correspondent au contexte de Jacob et Ésaü.'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: non pas à partir des œuvres
  rationale: ἐκ avec le génitif peut exprimer ici la source ou le fondement. Cette formulation conserve le contraste compact de Paul sans expliciter davantage sa portée doctrinale.
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: mais de celui qui appelle
  rationale: Le participe présent substantivé désigne Dieu sans le nommer explicitement. « Celui qui appelle » préserve sa valeur présente et évite une majuscule interprétative peu naturelle en français courant.
- source_word: ἐρρέθη αὐτῇ
  choice: il lui fut dit
  rationale: Le passif impersonnel rend fidèlement l’aoriste passif et maintient la formule d’introduction de la citation sans ajouter de sujet explicite.
- source_word: ὅτι
  choice: deux-points et guillemets
  rationale: ὅτι introduit ici le discours direct; la ponctuation française en communique naturellement la fonction.
- source_word: Ὁ μείζων
  choice: L’aîné
  rationale: Dans le contexte de Jacob et Ésaü, le comparatif renvoie à l’âge. « L’aîné » est naturel et précis, tout en signalant en note le sens plus littéral « le plus grand ».
- source_word: δουλεύσει
  choice: servira
  rationale: Le futur « servira » conserve l’idée de subordination sans imposer le sens plus marqué d’un esclavage juridique.
- source_word: τῷ ἐλάσσονι
  choice: le plus jeune
  rationale: Dans le contexte des deux frères, le comparatif s’entend naturellement de l’âge; la note conserve l’alternative littérale « le plus petit ».
theological_decisions:
- issue: Faut-il développer le contraste entre les œuvres et celui qui appelle en une affirmation doctrinale explicite sur l’élection ?
  choice: 'Conserver la formulation compacte : « non pas à partir des œuvres, mais de celui qui appelle »'
  alternative: « non pas à cause des œuvres, mais à cause de Dieu qui appelle »
  rationale: Le grec oppose les œuvres à l’action de celui qui appelle, mais ne nomme pas Dieu dans cette proposition et n’explicite pas ici toutes les conclusions doctrinales du contexte. La traduction préserve cette tension.
translation_notes:
  register: Français moderne, international et digne. La syntaxe légèrement soutenue « il lui fut dit » respecte la formule citationnelle grecque. Tous les marqueurs de notes figurent dans le texte principal.
