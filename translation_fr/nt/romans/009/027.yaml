source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: fr
  text: 'Mais Ésaïe s’écrie au sujet d’Israël : « Même si le nombre des fils d’Israël[a] est comme le sable de la mer[b], seul le reste sera sauvé[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « des enfants d’Israël » ou « des Israélites ». Le grec dit littéralement « des fils d’Israël », désignation collective traditionnelle du peuple de l’alliance.'
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire plus littéralement : « Si le nombre des fils d’Israël est comme le sable de la mer ». La tournure conditionnelle grecque prend ici vraisemblablement une valeur concessive.'
    reason: alternative_reading
  - marker: c
    text: 'Ou : « sera délivré ». Cette formulation fait écho à la prophétie d’Ésaïe concernant un reste qui subsiste.'
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque une légère opposition ou transition dans l’argumentation de Paul ; « Mais » rend naturellement ce tournant rhétorique.
- source_word: κράζει
  choice: s’écrie
  rationale: Conserve la force du verbe et le présent vivant de la citation prophétique.
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: au sujet d’Israël
  rationale: Dans ce contexte de citation prophétique, ὑπέρ signifie le plus naturellement « au sujet de » plutôt que « en faveur de ».
- source_word: Ἐὰν ᾖ
  choice: Même si … est
  rationale: Rend la valeur concessive probable de la proposition tout en gardant visible sa forme conditionnelle.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: des fils d’Israël
  rationale: Préserve la formulation traditionnelle et collective de la citation ; une note signale des équivalents français plus idiomatiques.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: comme le sable de la mer
  rationale: Conserve l’image biblique reconnaissable dans un français naturel.
- source_word: τὸ ὑπόλειμμα
  choice: seul le reste
  rationale: « Le reste » exprime le groupe subsistant de la prophétie ; « seul » explicite en français le contraste implicite entre la multitude et ce reste.
- source_word: σωθήσεται
  choice: sera sauvé
  rationale: Préserve le poids sotériologique du terme dans Romains, sans exclure la nuance prophétique de délivrance.
theological_decisions:
- issue: Valeur de la proposition Ἐὰν ᾖ dans la citation prophétique
  choice: 'Valeur concessive : « Même si le nombre… est… »'
  alternative: 'Valeur conditionnelle plus formelle : « Si le nombre… est… »'
  rationale: Le contexte oppose la multitude d’Israël au reste qui sera sauvé. « Même si » exprime clairement cette tension sans transformer la phrase en affirmation doctrinale supplémentaire.
- issue: Portée de σωθήσεται
  choice: « sera sauvé »
  alternative: « sera délivré »
  rationale: Dans le contexte de Romains 9–11, « sauvé » conserve la portée théologique du verbe, tandis que la note maintient visible la nuance de délivrance issue du cadre prophétique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le caractère solennel de la citation prophétique sans archaïsme. Les termes « fils d’Israël » et « le reste » maintiennent les échos scripturaires, avec des variantes explicatives en notes.
