  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: fr
  text: 'Mais ce n’est pas tout : Rébecca avait conçu d’un seul homme, Isaac, notre père.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant une couche d’un seul, Isaac, notre père » ; cette expression idiomatique évoque ici la conception issue de l’union avec un seul homme.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: 'Et ce n’est pas tout : … aussi'
  rationale: Rend naturellement la construction corrélative et conserve la progression de l’argument de Paul.
- source_word: Ῥεβέκκα
  choice: Rébecca
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: ἐξ ἑνός
  choice: d’un seul homme
  rationale: Explicite le référent masculin sous-entendu tout en soulignant que les deux descendants avaient le même père.
- source_word: κοίτην ἔχουσα
  choice: conçut
  rationale: Rend en français naturel l’expression grecque liée au lit conjugal et à la conception, sans introduire explicitement les enfants, absents de la formulation grecque.
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: Isaac, notre père
  rationale: Conserve l’apposition et le langage ancestral direct du grec.
theological_decisions:
- issue: Degré d’explicitation de l’expression relative à l’union sexuelle et à la conception dans l’argument sur l’élection
  choice: Rébecca conçut d’un seul homme
  alternative: Rébecca partagea la couche d’un seul homme, Isaac, notre père
  rationale: La formulation retenue communique le sens contextuel de l’idiome et le fait que les enfants de Rébecca avaient le même père, sans ajouter une interprétation doctrinale ni employer une tournure française obscure.
translation_notes:
  register: Français international moderne, digne et accessible. Le deux-points marque clairement l’ajout argumentatif. « Notre père » conserve la portée ancestrale de l’expression paulinienne.
