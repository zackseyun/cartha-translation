lexical_decisions:
- source_word: ὅτι
  choice: '[implicite dans la continuation syntaxique : « j’éprouve »]'
  rationale: Le verset poursuit la déclaration solennelle du verset précédent. En français, une conjonction telle que « que » dépendrait nécessairement du contexte antérieur; l’omettre dans cet extrait produit une phrase naturelle sans introduire la nuance causale de « car ».
- source_word: λύπη μοί ἐστιν
  choice: j’éprouve une grande tristesse
  rationale: La construction au datif avec εἰμί exprime ici l’expérience personnelle. « J’éprouve » est plus naturel que le calque « il y a pour moi » et convient mieux à un état affectif que « j’ai ».
- source_word: μεγάλη
  choice: grande
  rationale: « Grande » conserve directement l’intensité qualitative de l’adjectif grec.
- source_word: ἀδιάλειπτος
  choice: incessante
  rationale: Le terme indique une douleur qui ne cesse pas; « incessante » en préserve la force et reste idiomatique.
- source_word: ὀδύνη
  choice: douleur
  rationale: « Douleur » exprime directement la souffrance intérieure intense, tandis qu’« angoisse » constitue une autre traduction possible, un peu plus interprétative.
- source_word: τῇ καρδίᾳ μου
  choice: dans mon cœur
  rationale: Le datif grec se rend naturellement par « dans mon cœur » en français, tout en conservant l’image biblique concrète du cœur comme siège de la vie intérieure.
