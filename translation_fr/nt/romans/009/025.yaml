reference: Romans 9:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: fr
  text: 'Comme il le dit aussi dans Osée : « J’appellerai “mon peuple” celui qui n’était pas mon peuple, et “bien-aimée” celle qui n’était pas aimée. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citation d’Osée 2.25 selon la numérotation courante de la Bible hébraïque ; la numérotation diffère dans certaines traditions. Paul reprend ici la promesse par laquelle Dieu appelle de nouveau un peuple à lui appartenir.
    reason: cross_reference
lexical_decisions:
- source_word: ὡς καὶ
  choice: Comme… aussi
  rationale: Introduit une citation scripturaire qui vient confirmer l’argument de Paul, tout en conservant la valeur comparative et corroborative de l’expression grecque.
- source_word: ἐν τῷ Ὡσηὲ
  choice: dans Osée
  rationale: Formule française naturelle pour renvoyer au livre du prophète Osée sans explicitation inutile.
- source_word: λέγει
  choice: il le dit
  rationale: Conserve la forme personnelle du grec, dont le sujet implicite est Dieu parlant dans l’Écriture.
- source_word: Καλέσω
  choice: J’appellerai
  rationale: Rend directement le futur de καλέω et garde l’idée de désignation et de reconnaissance comme peuple de Dieu.
- source_word: τὸν οὐ λαόν μου
  choice: celui qui n’était pas mon peuple
  rationale: Préserve le singulier grammatical du grec tout en laissant à « peuple » sa portée collective.
- source_word: λαόν μου
  choice: mon peuple
  rationale: Expression biblique et relationnelle directe, conforme au langage d’alliance du passage.
- source_word: τὴν οὐκ ἠγαπημένην
  choice: celle qui n’était pas aimée
  rationale: Maintient explicitement le féminin singulier du texte grec et le sens verbal passif du participe.
- source_word: ἠγαπημένην
  choice: bien-aimée
  rationale: Rend la désignation résultante de manière idiomatique et digne, tout en conservant le contraste avec « n’était pas aimée ».
theological_decisions:
- issue: Portée collective ou individuelle de la citation d’Osée
  choice: Conserver les deux expressions au singulier, avec « celui » puis « celle », tout en laissant « peuple » porter naturellement un sens collectif.
  alternative: 'Rendre la première expression au pluriel : « ceux qui n’étaient pas mon peuple » ; ou employer les noms symboliques « Pas-mon-peuple » et « Non-aimée ».'
  rationale: Le grec emploie des formes singulières, dont une explicitement féminine. Le français permet de les conserver sans perdre la portée collective du mot « peuple » ni effacer l’arrière-plan d’Osée.
- issue: Valeur de ἠγαπημένην
  choice: « bien-aimée »
  alternative: « aimée »
  rationale: « Bien-aimée » fonctionne naturellement comme une désignation mise en contraste avec l’état antérieur « celle qui n’était pas aimée », sans préciser indûment la nature de l’amour.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme de la citation ainsi que le contraste entre « pas mon peuple » et « mon peuple », puis entre « pas aimée » et « bien-aimée ».
