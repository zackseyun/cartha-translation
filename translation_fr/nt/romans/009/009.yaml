id: ROM.9.9
reference: Romans 9:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: fr
  text: 'Car voici la parole de la promesse : « À ce moment-là, je viendrai[a], et Sara aura un fils. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je reviendrai ». Le grec dit ici littéralement « je viendrai », tandis que certaines traductions rendent « je reviendrai » en raison de la formulation du récit de la Genèse.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: de la promesse
  rationale: Le génitif qualifie λόγος et désigne la parole par laquelle Dieu formule sa promesse. « La parole de la promesse » reste naturel en français biblique actuel et maintient l'accent de Paul sur la promesse divine.
- source_word: λόγος
  choice: parole
  rationale: Le terme renvoie ici à l'énoncé cité. « Parole » convient à une déclaration divine sans développer le sens en « message ».
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l'explication de l'affirmation précédente et en conserve clairement le lien logique.
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: À ce moment-là
  rationale: La formule désigne le moment annoncé pour l'accomplissement. Cette traduction est idiomatique et évite de préciser « fixé » ou « l'année prochaine », éléments que le texte grec de Romains n'exprime pas directement.
- source_word: ἐλεύσομαι
  choice: je viendrai
  rationale: Le futur de ἔρχομαι signifie directement « je viendrai ». « Je reviendrai » peut refléter l'arrière-plan de la Genèse, mais ajoute au verbe grec de Romains l'idée explicite d'un retour.
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: Sara aura un fils
  rationale: La construction grecque, littéralement « il y aura un fils pour Sara », exprime idiomatiquement la possession. « Sara aura un fils » en restitue naturellement le sens.
- source_word: Σάρρᾳ
  choice: Sara
  rationale: La forme française traditionnelle et courante du nom biblique est « Sara ».
- source_word: υἱός
  choice: fils
  rationale: Le nom désigne spécifiquement un fils, donnée pertinente dans la promesse faite à Abraham et Sara.
theological_decisions:
- issue: Citation de la promesse faite à Abraham et agent divin
  choice: 'Présenter sans expansion la promesse comme une parole divine directe : « je viendrai »'
  alternative: Employer « je reviendrai » pour suivre plus explicitement certaines traductions du récit de la Genèse
  rationale: L'argument de Paul repose sur la promesse divine qui fonde la naissance du fils. La formulation retenue préserve cette portée tout en donnant la priorité au grec effectivement cité en Romains, sans harmonisation silencieuse avec une tradition de traduction de la Genèse.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Car voici » conserve le lien argumentatif et introduit naturellement la citation. « La parole de la promesse » maintient la texture théologique du passage sans lourdeur excessive.
