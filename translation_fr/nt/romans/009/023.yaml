id: ROM.9.23
reference: Romans 9:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: fr
  text: et afin de faire connaître la richesse de sa gloire envers des vases de miséricorde, qu’il a préparés d’avance pour la gloire,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: la richesse de sa gloire
  rationale: Conserve le singulier grec πλοῦτον et le rapport génitif, dans une formulation française naturelle et solennelle.
- source_word: ἐπὶ σκεύη ἐλέους
  choice: envers des vases de miséricorde
  rationale: « Envers » exprime ici l’orientation de la manifestation divine vers ces vases sans réduire ἐπί à un simple bénéficiaire; « vases » maintient la métaphore du contexte.
- source_word: ἃ προητοίμασεν
  choice: qu’il a préparés d’avance
  rationale: Rend explicitement le préfixe προ- de προητοίμασεν; le pronom relatif neutre pluriel reprend σκεύη et exige le masculin pluriel en français avec « vases ».
- source_word: εἰς δόξαν
  choice: pour la gloire
  rationale: « Pour » rend naturellement la destination ou le but exprimé par εἰς, tout en laissant ouverte la portée exacte de « gloire ».
theological_decisions:
- issue: Lien syntaxique de καὶ ἵνα avec le verset précédent
  choice: et afin de faire connaître
  alternative: et pour faire connaître
  rationale: La traduction conserve la coordination et la proposition finale grecques, même si le fragment dépend syntaxiquement du contexte antérieur.
- issue: Agent de la préparation préalable
  choice: qu’il a préparés d’avance
  alternative: qui avaient été préparés d’avance
  rationale: Le grec emploie l’actif προητοίμασεν avec Dieu comme sujet implicite dans le contexte; la traduction ne transforme donc pas la proposition en passif.
- issue: Portée de la préparation préalable
  choice: préparés d’avance pour la gloire
  alternative: destinés d’avance à la gloire
  rationale: « Préparés » traduit le verbe sans l’assimiler à un terme technique de prédestination et préserve ainsi la formulation propre du texte.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase reste volontairement dépendante du contexte précédent, comme en grec. La métaphore « vases de miséricorde » est conservée en raison de son rôle structurant dans Romains 9.
