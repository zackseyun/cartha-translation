id: ROM.9.20
reference: Romans 9:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: fr
  text: 'Mais toi, être humain[a], qui es-tu donc pour répliquer à Dieu ? Ce qui est façonné dira-t-il[b] à celui qui l’a façonné : « Pourquoi m’as-tu fait ainsi ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Au contraire, être humain ». La particule grecque peut marquer plus explicitement une vive correction.'
    reason: lexical_alternative
  - marker: b
    text: 'La question grecque appelle une réponse négative : ce qui est façonné ne dira pas cela à celui qui l’a façonné.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: Mais … donc
  rationale: La combinaison rend en français naturel la reprise à la fois adversative et appuyée de la particule, sans imposer le sens plus fortement correctif de « au contraire ».
- source_word: ὦ ἄνθρωπε
  choice: toi, être humain
  rationale: Le vocatif interpelle une personne représentative de l’humanité. Cette formulation actuelle conserve l’adresse directe et évite que « homme » soit compris comme désignant seulement un individu masculin.
- source_word: σὺ τίς εἶ
  choice: qui es-tu donc
  rationale: Cette tournure restitue le défi rhétorique et l’emphase portée par σὺ, plutôt qu’une simple demande d’identité.
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: pour contester Dieu
  rationale: Le participe désigne une réplique opposée ou contradictoire, non une réponse neutre. « Contester » préserve cette nuance dans un français idiomatique.
- source_word: μὴ ἐρεῖ
  choice: dira-t-il
  rationale: La question rhétorique introduite par μή attend une réponse négative. En français, la forme interrogative simple la laisse naturellement entendre.
- source_word: τὸ πλάσμα
  choice: ce qui est façonné
  rationale: Cette expression conserve l’image d’un objet modelé et son lien verbal avec celui qui le façonne.
- source_word: τῷ πλάσαντι
  choice: à celui qui l’a façonné
  rationale: Le participe aoriste désigne l’auteur du façonnage; la répétition de « façonné » maintient le parallélisme lexical du grec.
- source_word: Τί με ἐποίησας οὕτως;
  choice: Pourquoi m’as-tu fait ainsi ?
  rationale: Traduction proche et naturelle de la question grecque, qui conserve l’ambiguïté de οὕτως sans préciser s’il s’agit de la manière ou de l’état résultant.
theological_decisions:
- issue: Portée représentative de ἄνθρωπε
  choice: « être humain » au singulier
  alternative: « homme »
  rationale: Paul interpelle rhétoriquement un individu en tant que représentant de l’humanité devant Dieu. « Être humain » exprime clairement cette portée générique en français international moderne.
- issue: Force de la réprimande de Paul
  choice: « contester Dieu »
  alternative: « répondre à Dieu »
  rationale: Le grec implique une réplique contradictoire et souligne l’asymétrie entre la créature et Dieu; une formulation neutre affaiblirait cette tension.
- issue: Attente négative de la question avec μή
  choice: Question affirmative de forme, avec réponse négative implicite
  alternative: « Ce qui est façonné ne dira tout de même pas… »
  rationale: La formulation retenue préserve la rhétorique vive du texte tout en laissant le contexte communiquer la réponse attendue, sans rendre la négation plus explicite que le grec.
translation_notes:
  register: Français international moderne, digne et direct. L’adresse « toi, être humain » garde la vigueur du vocatif sans archaïsme; « façonné » maintient l’image concrète du potier et le lien lexical entre l’objet formé et son auteur.
