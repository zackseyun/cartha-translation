  source_fidelity: 'Le sens général est bien rendu : l’interpellation rhétorique, le contraste entre la chose façonnée et son auteur, ainsi que la question attendant une réponse négative sont préservés. Toutefois, « contester Dieu » peut évoquer le fait de mettre Dieu en cause ou de nier son autorité, plutôt que l’acte verbal de répondre avec opposition exprimé par ἀνταποκρινόμενος. « Répliquer à Dieu » restitue plus exactement cette nuance.'
  naturalness: Le français est moderne, clair et de registre approprié. « Mais toi, être humain » fonctionne comme apostrophe représentative. « Répliquer à Dieu » est idiomatique dans cette question rhétorique et conserve une vigueur directe.
  terminology: « Être humain », « façonné » et « celui qui l’a façonné » sont cohérents et maintiennent l’image lexicale du grec. Le déplacement de l’ancre de note rend son rattachement à μὴ ἐρεῖ (« dira-t-il ») précis.
