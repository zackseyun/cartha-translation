  - severity: low
    issue: L’ancre de la note sur la question négative est placée après la citation entière plutôt qu’auprès de « dira-t-il ».
    rationale: La note explique spécifiquement la particule μή qui introduit le verbe ἐρεῖ. La placer immédiatement après « dira-t-il » améliore la précision de l’ancrage.
