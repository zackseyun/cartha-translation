id: ROM.9.18
reference: Romans 9:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: fr
  text: Ainsi donc, il fait miséricorde à qui il veut[a], et il endurcit qui il veut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il a compassion de qui il veut ».'
    reason: lexical_alternative
  - marker: b
    text: « Endurcit » peut aussi se traduire par « rend obstiné » ou « rend insensible ». Le grec emploie un verbe actif, qu’il ne faut pas atténuer en une simple permission.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ainsi donc
  rationale: Les deux particules introduisent avec insistance la conclusion tirée de l’argument précédent. « Ainsi donc » en conserve la force déductive dans un français naturel et soutenu.
- source_word: ὃν θέλει
  choice: à qui il veut
  rationale: Cette formulation idiomatique conserve la volonté explicite du sujet ainsi que le parallélisme solennel des deux propositions.
- source_word: ἐλεεῖ
  choice: il fait miséricorde
  rationale: Le verbe désigne l’acte d’accorder miséricorde ou compassion. « Faire miséricorde » reste clair, digne et précis dans ce contexte biblique.
- source_word: ὃν δὲ θέλει
  choice: et … qui il veut
  rationale: δέ introduit ici le second volet contrasté. « Et » relie naturellement les deux propositions, tandis que la répétition de « qui il veut » maintient leur symétrie.
- source_word: σκληρύνει
  choice: il endurcit
  rationale: Le verbe grec est actif et signifie rendre dur ou obstiné. « Endurcit » préserve à la fois cette valeur active et l’écho au récit du pharaon.
theological_decisions:
- issue: La volonté divine exprimée par θέλει
  choice: Conserver l’affirmation directe « à qui il veut » et « qui il veut ».
  alternative: Employer une paraphrase mettant l’accent sur une simple permission.
  rationale: Le grec attribue explicitement la volonté au sujet dans les deux propositions. La traduction ne tranche pas le débat sur la prédestination et la responsabilité humaine, mais maintient la tension du texte.
- issue: L’action exprimée par σκληρύνει
  choice: Traduire activement par « il endurcit ».
  alternative: « il permet qu’il s’endurcisse » ou « il l’abandonne à son endurcissement »
  rationale: La forme grecque est active et attribue directement l’action au sujet. Une formulation uniquement permissive atténuerait ce que dit le texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le parallélisme du grec est conservé, ainsi que la force active de « il endurcit », sans ajouter d’explication doctrinale au corps du verset.
