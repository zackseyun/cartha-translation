id: ROM.9.31
reference: Romans 9:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: fr
  text: Mais Israël, qui poursuivait une loi de justice[a], n’est pas parvenu à cette loi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une loi de droiture ». L’expression grecque peut aussi être comprise comme « une loi qui mène à la justice ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « n’a pas atteint cette loi ». La tournure grecque est concise et difficile; on peut aussi traduire plus littéralement: « n’est pas parvenu à la loi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραήλ
  choice: Israël
  rationale: Forme française traditionnelle du nom propre; dans l’argument de Paul, le nom désigne ici Israël comme peuple.
- source_word: δέ
  choice: Mais
  rationale: Marque le contraste avec les non-Juifs mentionnés au verset précédent.
- source_word: διώκων
  choice: qui poursuivait
  rationale: Rend l’idée d’une recherche active et persistante sans ajouter explicitement une valeur concessive absente du participe grec.
- source_word: νόμον δικαιοσύνης
  choice: une loi de justice
  rationale: Conserve l’absence d’article devant νόμον ainsi que la relation volontairement concise entre « loi » et « justice », sans préciser si la loi produit, exige ou caractérise la justice.
- source_word: δικαιοσύνης
  choice: justice
  rationale: Dans ce contexte paulinien, « justice » est le terme français naturel et traditionnel, capable d’évoquer à la fois la qualité d’être juste et la juste relation avec Dieu.
- source_word: εἰς νόμον
  choice: à cette loi
  rationale: La reprise de « loi » est comprise comme renvoyant à celle qu’Israël poursuivait; le démonstratif rend cette reprise clairement en français tout en évitant d’introduire « le but de la loi ».
- source_word: οὐκ ἔφθασεν
  choice: n’est pas parvenu
  rationale: Exprime le fait de ne pas atteindre le point ou l’objectif visé et s’emploie naturellement avec « à » en français.
theological_decisions:
- issue: Sens de δικαιοσύνη dans l’argument de Paul
  choice: justice
  alternative: droiture
  rationale: « Justice » maintient la terminologie paulinienne usuelle en français sans réduire le mot à la seule conduite morale; « droiture » demeure une possibilité lexicale mais serait plus étroite ici.
- issue: Rapport entre la loi et la justice
  choice: une loi de justice
  alternative: une loi qui mène à la justice
  rationale: 'Le génitif grec reste ouvert: il peut caractériser la loi ou indiquer son rapport à la justice. La formulation retenue préserve cette tension, tandis que l’alternative explicite une relation de résultat que le grec ne formule pas directement.'
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « loi » est conservée parce qu’elle structure la formulation grecque. « Qui poursuivait » évite le tour plus lourd « tout en poursuivant » et n’impose pas explicitement une nuance concessive.
