  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: fr
  text: 'comme il est écrit : « J’ai aimé Jacob, mais j’ai détesté Ésaü[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Citation de Malachie 1.2–3. Pour « j’ai détesté », autres traductions possibles : « j’ai rejeté » ou « j’ai moins aimé ». Certains comprennent ici ce terme comme un rejet dans le cadre de l’alliance ou comme une préférence comparative, plutôt que comme l’expression d’une hostilité affective.'
    reason: Référence croisée et alternatives lexicales.
lexical_decisions:
- source_word: καθὼς
  choice: comme
  rationale: Introduit naturellement en français la citation scripturaire et conserve la valeur comparative du grec.
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française consacrée pour le parfait passif grec employé afin d’introduire une citation de l’Écriture.
- source_word: Ἰακώβ
  choice: Jacob
  rationale: Forme française usuelle du nom propre biblique.
- source_word: ἠγάπησα
  choice: j’ai aimé
  rationale: Le passé composé rend ici naturellement l’aoriste grec et conserve le sens direct du verbe « aimer ».
- source_word: δὲ
  choice: mais
  rationale: Exprime clairement le contraste établi entre Jacob et Ésaü.
- source_word: Ἠσαῦ
  choice: Ésaü
  rationale: Forme française usuelle du nom propre biblique.
- source_word: ἐμίσησα
  choice: j’ai détesté
  rationale: Conserve le sens lexical fort de μισέω sans résoudre dans le corps du texte la tension théologique; les nuances possibles sont signalées en note.
theological_decisions:
- issue: Faut-il atténuer « j’ai détesté » en raison des débats sur l’élection divine et la portée relationnelle ou comparative du langage?
  choice: Maintenir « j’ai détesté » dans le texte principal.
  alternative: « j’ai rejeté » ou « j’ai moins aimé »
  rationale: Le grec cite le verbe ordinaire μισέω. Une formulation atténuée imposerait une interprétation; le texte principal garde donc la force de l’énoncé, tandis que la note préserve les autres compréhensions possibles.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation traditionnelle « il est écrit » convient au registre scripturaire. Le verbe fort « détester » préserve la tension du texte source, avec une note explicative non confessionnelle.
