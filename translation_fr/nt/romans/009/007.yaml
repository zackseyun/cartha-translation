reference: Romans 9:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: fr
  text: 'Ce n’est pas non plus parce qu’ils constituent la descendance d’Abraham[a] qu’ils sont tous ses enfants. Au contraire : « C’est en Isaac que ta descendance sera appelée[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « semence ». Le mot grec est au singulier, mais il peut désigner collectivement la descendance ou les descendants.
    reason: lexical_alternative
  - marker: b
    text: Ou « sera nommée » ; dans ce contexte, le verbe peut aussi évoquer une descendance reconnue ou désignée comme telle. La formulation reprend Genèse 21.12.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: Ce n’est pas non plus parce que
  rationale: Cette tournure française explicite naturellement le lien négatif de οὐδέ avec l’argument précédent et la valeur causale de ὅτι.
- source_word: σπέρμα Ἀβραάμ
  choice: la descendance d’Abraham
  rationale: « Descendance » rend le nom collectif singulier σπέρμα dans un français actuel et convient au contexte généalogique.
- source_word: πάντες τέκνα
  choice: ils sont tous ses enfants
  rationale: « Enfants » rend le pluriel inclusif τέκνα. Le possessif « ses », implicite dans le contexte, précise en français qu’il s’agit des enfants d’Abraham sans définir davantage la nature de cette filiation.
- source_word: ἀλλ’
  choice: Au contraire
  rationale: Cette expression marque nettement la correction opposée à l’affirmation précédente.
- source_word: Ἐν Ἰσαὰκ
  choice: C’est en Isaac que
  rationale: La construction clivée est idiomatique en français tout en conservant formellement ἐν par « en », sans imposer l’interprétation plus explicite « par l’intermédiaire d’Isaac ».
- source_word: κληθήσεταί
  choice: sera appelée
  rationale: Le futur passif de καλέω est rendu au plus près. « Appelée » conserve l’ambiguïté entre nomination et désignation reconnue dans ce contexte.
- source_word: σοι σπέρμα
  choice: ta descendance
  rationale: Le datif σοι est naturellement exprimé par le possessif « ta »; « descendance » maintient le même équivalent de σπέρμα dans les deux occurrences.
theological_decisions:
- issue: Rapport entre descendance physique et qualité d’enfant d’Abraham
  choice: Le texte distingue l’appartenance à la descendance d’Abraham du fait d’être son enfant au sens pertinent dans l’argument de Paul, sans préciser ici tout le mécanisme de cette distinction.
  alternative: Expliciter « enfants de la promesse », « enfants de l’alliance » ou une doctrine complète de l’élection.
  rationale: Le verset établit la distinction, tandis que son développement vient dans le contexte suivant. La traduction ne doit pas anticiper cette explication.
- issue: Portée de la citation de Genèse 21.12
  choice: Conserver « en Isaac » et « sera appelée ».
  alternative: « C’est par Isaac que ta descendance sera constituée/reconnue » ou « tes descendants viendront d’Isaac ».
  rationale: La formulation retenue reste proche du grec cité et préserve la tension entre l’acte de nommer, d’appeler et de désigner une lignée, au lieu de choisir silencieusement une interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe rend explicite le raisonnement sans l’alourdir. La citation conserve volontairement la formulation « en Isaac » et l’ambiguïté de « appelée ».
