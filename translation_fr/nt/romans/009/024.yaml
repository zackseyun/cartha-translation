id: ROM.9.24
reference: Romans 9:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: fr
  text: nous qu’il a aussi appelés, non seulement d’entre les Juifs, mais aussi d’entre les non-Juifs[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les nations »; ici, ce terme désigne les peuples non juifs, par contraste avec les Juifs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: nous qu’il a aussi appelés
  rationale: Le pronom relatif οὓς, repris en apposition par ἡμᾶς, rattache « nous » aux objets de compassion du verset précédent. Cette formulation française conserve ce lien syntaxique sans ajouter une interprétation.
- source_word: καὶ ἐκάλεσεν
  choice: a aussi appelés
  rationale: « Aussi » rend la valeur additive de καί, tandis qu’« appelés » conserve le sens paulinien établi de καλέω. Le passé composé est naturel en français actuel pour l’aoriste dans ce contexte.
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: non seulement ... mais aussi
  rationale: Cette tournure reproduit clairement la construction corrélative et son équilibre rhétorique.
- source_word: ἐξ Ἰουδαίων
  choice: d’entre les Juifs
  rationale: ἐξ marque ici l’origine ou le prélèvement au sein d’un groupe. « D’entre » exprime cette nuance plus précisément que le simple « parmi ».
- source_word: ἐξ ἐθνῶν
  choice: d’entre les non-Juifs
  rationale: Dans le contraste explicite avec les Juifs, ἔθνη désigne les peuples non juifs. « Non-Juifs » est transparent en français international moderne; la note signale la formulation grecque plus littérale.
theological_decisions:
- issue: Lien avec les objets de compassion mentionnés au verset précédent
  choice: nous qu’il a aussi appelés
  alternative: ceux qu’il a aussi appelés, c’est-à-dire nous
  rationale: La formulation retenue maintient la dépendance syntaxique envers le verset précédent et l’identification avec « nous », sans développer une doctrine de l’appel au-delà de ce que dit le texte.
- issue: Sens de ἐθνῶν dans le contraste historique entre Juifs et autres peuples
  choice: les non-Juifs
  alternative: les nations
  rationale: Le contraste immédiat avec Ἰουδαίων montre qu’il s’agit des peuples autres que le peuple juif. Ce choix préserve la portée historique et théologique sans employer un terme ecclésiastique moins courant.
translation_notes:
  register: Français moderne, international et digne. La phrase demeure ouverte par un tiret, conformément à la continuité argumentative du texte source. « Non-Juifs » privilégie la compréhension immédiate tout en conservant en note l’expression grecque littérale.
