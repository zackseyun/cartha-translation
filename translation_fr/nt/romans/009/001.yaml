id: ROM.9.1
reference: Romans 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: fr
  text: Je dis la vérité dans le Messie[a], je ne mens pas, ma conscience en témoigne avec moi dans l’Esprit saint[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le Christ ». Le titre grec Χριστός peut se rendre par « Messie » ou « Christ »; ici, il est rendu comme un titre.
    reason: lexical_alternative
  - marker: b
    text: Ou « tandis que ma conscience témoigne avec moi »; le grec présente ce témoignage comme une circonstance accompagnant l’affirmation de Paul.
    reason: lexical_alternative
  - marker: c
    text: Ou, éventuellement, « dans un esprit saint ». Chez Paul, l’expression désigne toutefois le plus naturellement l’Esprit saint.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: Je dis la vérité
  rationale: L’expression idiomatique signifie parler conformément à la vérité. Cette formulation est directe, naturelle et solennelle en français.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: Χριστός conserve ici sa valeur de titre, « l’Oint » ou « le Messie ». « Dans » maintient la préposition ἐν et l’expression paulinienne d’union ou de relation au Messie.
- source_word: οὐ ψεύδομαι
  choice: je ne mens pas
  rationale: Traduction française courante et directe du verbe déponent, qui renforce l’affirmation précédente.
- source_word: συμμαρτυρούσης μοι
  choice: en témoigne avec moi
  rationale: Le composé συμμαρτυρέω comporte l’idée de rendre témoignage conjointement. La tournure française garde cette nuance sans alourdir la phrase.
- source_word: τῆς συνειδήσεώς μου
  choice: ma conscience
  rationale: Équivalent usuel de συνείδησις dans le vocabulaire paulinien.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dans l’Esprit saint
  rationale: La lecture la plus naturelle chez Paul renvoie à l’Esprit divin. « Dans » préserve ἐν sans imposer une valeur strictement instrumentale.
theological_decisions:
- issue: Valeur de Χριστός
  choice: Messie, comme titre
  alternative: Christ, comme titre devenu désignation quasi nominale
  rationale: Le grec peut fonctionner comme titre ou comme désignation proche d’un nom propre. Le texte retient « Messie » conformément à la valeur titulaire, tout en signalant l’autre rendu possible.
- issue: Référent de πνεύματι ἁγίῳ
  choice: L’Esprit saint, c’est-à-dire l’Esprit divin
  alternative: un esprit saint, éventuellement l’esprit humain de Paul qualifié de saint
  rationale: Dans l’usage paulinien et dans cette affirmation solennelle, la référence à l’Esprit saint est la plus probable, mais l’absence d’article en grec permet de signaler l’autre analyse sans l’introduire dans le texte principal.
- issue: Rapport exprimé par συμμαρτυρούσης
  choice: La conscience témoigne avec Paul
  alternative: La conscience rend témoignage à Paul ou confirme intérieurement son affirmation
  rationale: Le préverbe συν- favorise l’idée de témoignage conjoint; la traduction conserve cette tension plutôt que de réduire la conscience à un simple témoin intérieur.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La répétition « Je dis… je ne mens pas » conserve l’insistance solennelle du grec. La ponctuation maintient la phrase comme une seule déclaration, appelée à se poursuivre au verset suivant.
