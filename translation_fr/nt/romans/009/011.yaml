id: ROM.9.11
reference: Romans 9:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: fr
  text: Car, avant même qu’ils soient nés et qu’ils aient fait quoi que ce soit de bien ou de mal[a], afin que le dessein de Dieu selon l’élection[b] demeure[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quoi que ce soit de bon ou de mauvais ». Le mot grec peut désigner ce qui est mauvais, vil ou moralement mauvais.
    reason: lexical_alternative
  - marker: b
    text: Ou « le dessein électif de Dieu » ; littéralement « le dessein de Dieu selon l’élection ».
    reason: lexical_alternative
  - marker: c
    text: Ou « subsiste » ou « reste ferme ». Le verbe grec signifie « demeurer » ou « continuer » et peut ici évoquer un dessein qui reste établi.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω γὰρ γεννηθέντων
  choice: En effet, avant même qu’ils soient nés
  rationale: La tournure exprime naturellement en français la valeur temporelle de μήπω avec le participe, tandis que «En effet» maintient le lien explicatif marqué par γάρ.
- source_word: μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον
  choice: ou qu’ils aient fait quoi que ce soit de bien ou de mal
  rationale: Cette formulation conserve la négation coordonnée et rend idiomatiquement l’opposition entre ἀγαθόν et φαῦλον, sans renforcer indûment la portée morale de φαῦλον.
- source_word: ἵνα
  choice: afin que
  rationale: Rend clairement la proposition de but tout en laissant intacte la tension théologique du passage.
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: le dessein de Dieu conforme à l’élection
  rationale: «Dessein» convient à πρόθεσις dans ce contexte, et «conforme à l’élection» garde visible la construction κατ’ ἐκλογήν sans la réduire à une paraphrase doctrinale.
- source_word: μένῃ
  choice: demeure
  rationale: «Demeure» correspond directement au sens de rester ou continuer et convient au registre digne du passage.
theological_decisions:
- issue: Valeur de ἵνα dans un contexte lié à la prédestination
  choice: afin que le dessein de Dieu conforme à l’élection demeure
  alternative: de sorte que le dessein de Dieu conforme à l’élection demeure
  rationale: La construction est rendue comme une proposition de but, lecture syntaxiquement naturelle, sans tirer de conclusion supplémentaire concernant les débats doctrinaux sur l’élection.
- issue: Traduction de ἐκλογή
  choice: élection
  alternative: choix
  rationale: «Élection» préserve le poids du terme paulinien et sa portée théologique reconnue, sans préciser ici la nature ou le mécanisme de cette élection.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase reste ouverte, comme dans le texte grec, puisqu’elle se poursuit au verset suivant. Les termes «dessein» et «élection» conservent la densité paulinienne sans imposer une lecture confessionnelle particulière.
