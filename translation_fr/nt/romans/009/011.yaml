  source_fidelity: 'La phrase rend fidèlement le génitif absolu temporel, la finalité introduite par ἵνα, ainsi que μένῃ. Toutefois, μηδέ coordonne les deux propositions sous la négation (« et/ne… ni ») plutôt qu’une alternative : « et qu’ils aient fait… » reflète mieux cette relation que « ou qu’ils aient fait… ». « Selon l’élection » conserve plus exactement la valeur de κατὰ ἐκλογήν que « conforme à l’élection ».'
  naturalness: La formulation révisée reste fluide en français international moderne et conserve volontairement la phrase en suspens, puisque le grec se poursuit au verset suivant. « Car » est un lien explicatif naturel et direct pour γάρ dans ce registre.
  terminology: '« Dessein », « Dieu », « élection » et « demeure » sont appropriés et préservent le vocabulaire paulinien sans trancher les implications doctrinales. La note a est légèrement corrigée : « moralement mauvais » est idiomatique, contrairement à « moralement mal ».'
