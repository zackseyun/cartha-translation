    rationale: Le grec μηδὲ πραξάντων coordonne négativement l’action au fait de ne pas être encore nés. En français, « et qu’ils aient fait quoi que ce soit… » maintient mieux les deux conditions conjointes visées par le génitif absolu.
  - severity: low
    issue: « conforme à l’élection » est moins exact que « selon l’élection »
    rationale: κατὰ ἐκλογήν signifie littéralement et contextuellement « selon l’élection ». « Conforme à » peut suggérer une conformité normative et affaiblit la transparence de la construction grecque.
  - severity: low
    issue: Formulation maladroite dans la note a
    rationale: En français, « moralement mal » n’est pas idiomatique ; « moralement mauvais » exprime correctement l’une des nuances possibles de φαῦλον.
