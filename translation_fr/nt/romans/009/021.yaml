id: ROM.9.21
reference: Romans 9:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: fr
  text: Ou bien le potier n’a-t-il pas autorité sur l’argile[a] pour faire, à partir de la même masse[b], un vase destiné à l’honneur et un autre destiné au déshonneur[c][d] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’a-t-il pas le droit de disposer de l’argile » ?'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à partir de la même motte » ou « de la même matière » lorsqu’il s’agit d’argile.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « un vase pour un usage honorable et un autre pour un usage ordinaire » ; cette formulation explicite une interprétation fonctionnelle de l’image.'
    reason: alternative_reading
  - marker: d
    text: Cette image fait écho à plusieurs passages de l’Ancien Testament sur le potier et l’argile, notamment Ésaïe 29.16 ; 45.9 et Jérémie 18.1-6.
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: Ou bien
  rationale: Introduit naturellement en français la nouvelle question rhétorique qui prolonge l’argument de Paul, sans ajouter d’insistance étrangère au grec.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: n’a-t-il pas autorité
  rationale: ἐξουσία désigne ici une autorité ou une prérogative légitime, et non la simple capacité matérielle d’agir.
- source_word: ὁ κεραμεὺς
  choice: le potier
  rationale: Équivalent précis et courant, qui conserve aussi l’écho des images prophétiques du potier et de l’argile.
- source_word: τοῦ πηλοῦ
  choice: sur l’argile
  rationale: Le complément du nom ἐξουσία se rend idiomatiquement en français par « autorité sur ».
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: à partir de la même masse
  rationale: φύραμα désigne une matière pétrie ou mélangée formant une masse. « Masse » convient naturellement à l’argile et reste proche du grec.
- source_word: ποιῆσαι
  choice: pour faire
  rationale: Rend simplement l’infinitif de production, sans donner au verbe une nuance plus élaborée que celle du texte.
- source_word: ὃ μὲν ... ὃ δὲ
  choice: un ... et un autre
  rationale: Reproduit clairement la corrélation contrastive μέν…δέ dans un français naturel.
- source_word: εἰς τιμὴν
  choice: destiné à l’honneur
  rationale: Conserve le vocabulaire d’honneur du grec tout en exprimant naturellement la destination marquée par εἰς.
- source_word: σκεῦος
  choice: un vase
  rationale: Dans l’image du potier, « vase » est le terme français naturel et traditionnel pour un objet façonné en argile.
- source_word: εἰς ἀτιμίαν
  choice: au déshonneur
  rationale: Maintient l’opposition lexicale directe entre τιμή et ἀτιμία, sans réduire celle-ci à un usage simplement ordinaire.
theological_decisions:
- issue: Rendre ἐξουσία dans un passage lié aux débats sur la souveraineté divine et la responsabilité humaine
  choice: autorité
  alternative: droit ; pouvoir
  rationale: « Autorité » exprime la prérogative légitime du potier sans transformer le verset en formulation doctrinale plus développée ni résoudre la tension de l’argument.
- issue: Interpréter ou non εἰς τιμὴν / εἰς ἀτιμίαν comme des catégories fonctionnelles
  choice: destiné à l’honneur ... au déshonneur
  alternative: pour un usage honorable ... pour un usage ordinaire
  rationale: Le grec formule directement une opposition entre honneur et déshonneur. La conserver évite de limiter l’image à des fonctions domestiques qui ne sont pas explicitement nommées.
translation_notes:
  register: Français international moderne, clair et digne. La formulation garde la structure interrogative et l’opposition honneur-déshonneur du grec, tout en évitant un tour inutilement archaïque.
