  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: fr
  text: Pourquoi ? Parce que ce n’était pas sur la base de la foi[a], mais comme si c’était sur la base des œuvres[b]. Ils ont trébuché sur la pierre qui fait trébucher[c][d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la foi » ou « à partir de la foi ». Le grec dit littéralement « à partir de la foi ».
    reason: lexical_alternative
  - marker: b
    text: Ou « mais comme si c’était sur la base des œuvres ». La formulation conserve la nuance de « comme » ou « comme si ».
    reason: lexical_alternative
  - marker: c
    text: Ou « la pierre d’achoppement » ou « la pierre qui fait tomber ».
    reason: lexical_alternative
  - marker: d
    text: Allusion à Ésaïe 8.14 ; voir aussi Ésaïe 28.16 au verset suivant.
    reason: cross_reference
lexical_decisions:
- source_word: διὰ τί;
  choice: Pourquoi ?
  rationale: Formulation interrogative brève et naturelle qui conserve la force rhétorique de Paul.
- source_word: ὅτι
  choice: Parce que
  rationale: La conjonction introduit ici la cause qui répond directement à la question précédente.
- source_word: οὐκ ἐκ πίστεως
  choice: ce n’était pas à partir de la foi
  rationale: « À partir de » rend explicitement ἐκ sans réduire la relation à un simple moyen; « foi » demeure le terme paulinien usuel.
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: mais comme à partir des œuvres
  rationale: Cette formulation conserve ὡς, qui présente la démarche comme fondée, pour ainsi dire, sur les œuvres, sans l’aplatir en « par les œuvres ».
- source_word: προσέκοψαν
  choice: Ils ont buté contre
  rationale: Expression française courante qui garde l’image concrète d’un heurt entraînant un faux pas.
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: la pierre qui fait trébucher
  rationale: Rend naturellement le génitif et maintient le lien lexical avec le verbe précédent ainsi que l’image d’Ésaïe.
theological_decisions:
- issue: Sens de πίστις dans l’opposition entre foi et œuvres
  choice: foi
  alternative: confiance; fidélité
  rationale: Dans ce contexte, πίστις s’oppose aux œuvres comme principe ou fondement de la recherche de la justice. « Foi » préserve la catégorie paulinienne sans imposer une interprétation plus étroite.
- issue: Portée de ὡς devant ἐξ ἔργων
  choice: comme à partir des œuvres
  alternative: comme si cela venait des œuvres; par les œuvres
  rationale: Le choix retenu préserve la nuance comparative de ὡς et évite de transformer silencieusement l’expression en affirmation non nuancée.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure légèrement elliptique « ce n’était pas » respecte l’ellipse grecque et son lien avec le verset précédent. La virgule finale signale que la phrase se poursuit au verset suivant.
