  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : la réponse causale, l’opposition foi/œuvres avec la nuance de ὡς, et l’image de la pierre sont conservés. Toutefois, « Ils ont buté contre » évoque plus naturellement en français le fait de heurter un obstacle que de trébucher ; « trébuché sur » restitue plus directement προσέκοψαν et le lien avec πρόσκομμα.'
