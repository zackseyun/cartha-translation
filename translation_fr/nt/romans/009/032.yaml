  terminology: « Foi » et « œuvres » conviennent au vocabulaire paulinien. « Pierre qui fait trébucher » est un rendu moderne adéquat de λίθος τοῦ προσκόμματος, sans imposer le terme traditionnel « pierre d’achoppement ».
