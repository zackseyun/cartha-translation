source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: fr
  text: Que dirons-nous donc ? Que les non-Juifs[a], qui ne recherchaient pas la justice[b], ont atteint la justice — à savoir la justice qui vient de la foi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nations ». Ici, le terme grec désigne les peuples non juifs, par contraste avec Israël.
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « justice », ici et dans ses autres occurrences dans ce verset, peut évoquer ce qui est juste ou droit, notamment dans un cadre moral, judiciaire ou relationnel.
    reason: lexical_range
  - marker: c
    text: Ou « la justice qui s’obtient par la foi » ; moins probablement ici, « la justice qui vient de la fidélité ».
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: Que dirons-nous donc ?
  rationale: Cette formulation française naturelle conserve le futur délibératif et la fonction de transition caractéristique chez Paul.
- source_word: ἔθνη
  choice: les non-Juifs
  rationale: Dans l’opposition contextuelle avec Israël, le terme désigne les peuples autres que le peuple juif. « Non-Juifs » est immédiatement compréhensible en français moderne, tandis que « nations » reste signalé en note.
- source_word: τὰ μὴ διώκοντα
  choice: qui ne recherchaient pas
  rationale: L’imparfait rend la valeur durative ou caractéristique du participe présent. « Rechercher » exprime ici naturellement l’effort dirigé vers un but.
- source_word: δικαιοσύνην
  choice: la justice
  rationale: « Justice » est le terme théologique français courant pour δικαιοσύνη et garde une portée morale, judiciaire et relationnelle sans réduire le sens à un seul modèle doctrinal.
- source_word: κατέλαβεν
  choice: sont parvenus à
  rationale: Dans ce contexte, le verbe exprime le fait d’atteindre ou d’obtenir ce qui n’était pas recherché. « Parvenir à » rend ce résultat en français idiomatique tout en maintenant le contraste avec « rechercher ».
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: mais à la justice qui vient de la foi
  rationale: La répétition de « justice » préserve l’insistance grecque. « Mais » rend δέ comme une précision à nuance contrastive sur la nature de cette justice, et « qui vient de » conserve la valeur de provenance de ἐκ sans ajouter de formule doctrinale.
- source_word: πίστεως
  choice: foi
  rationale: « Foi » est le correspondant français usuel de πίστις. Ici, le contexte favorise la foi ou la confiance, sans exclure par traduction une discussion sur la gamme sémantique du terme.
theological_decisions:
- issue: Portée de δικαιοσύνη dans l’argument de Paul
  choice: Traduire par « justice » sans définir davantage son mécanisme théologique.
  alternative: droiture ; juste statut devant Dieu ; appartenance à l’alliance
  rationale: Le verset affirme que les non-Juifs sont parvenus à la justice, mais n’en donne pas ici une définition doctrinale exhaustive. Le terme français « justice » préserve cette ampleur.
- issue: Sens de ἐκ πίστεως
  choice: « qui vient de la foi »
  alternative: par la foi ; sur la base de la foi ; qui vient de la fidélité
  rationale: Cette formulation garde l’idée de provenance exprimée par ἐκ et évite d’introduire une précision confessionnelle absente du grec. La possibilité lexicale de « fidélité » est indiquée en note, tout en étant moins probable ici.
- issue: Fonction de δέ dans la reprise de δικαιοσύνην
  choice: « mais à la justice »
  alternative: « à savoir la justice » ; « plus précisément, à la justice »
  rationale: Le δέ précise la sorte de justice atteinte tout en produisant une nuance contrastive. « Mais » conserve cette tension plutôt que de réduire la phrase à une simple apposition explicative.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la question rhétorique, la répétition insistante de « justice » et le contraste entre l’absence de recherche et le fait de parvenir au but. « Non-Juifs » privilégie la clarté contemporaine ; l’alternative plus littérale figure en note.
