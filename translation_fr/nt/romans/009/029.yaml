id: ROM.9.29
reference: Romans 9:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: fr
  text: 'Et comme Ésaïe l’a déjà dit : « Si le Seigneur des armées[a] ne nous avait pas laissé une descendance[b], nous serions devenus comme Sodome et nous aurions été rendus semblables à Gomorrhe. »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Seigneur Sabaoth ». Le grec Σαβαώθ translittère un titre divin hébreu souvent traduit par « des armées » ou « des armées célestes ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « une semence » ; il s’agit ici d’une descendance laissée en vie.
    reason: lexical_alternative
  - marker: c
    text: Citation d’Ésaïe 1.9.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: Et comme
  rationale: Introduit naturellement en français la conformité entre cette citation et ce qui précède, tout en conservant la valeur comparative.
- source_word: προείρηκεν
  choice: l’avait dit auparavant
  rationale: Le plus-que-parfait situe la parole d’Ésaïe avant l’argument présent de Paul; « auparavant » rend explicitement le préverbe προ- sans donner au verbe le sens plus étroit de prédire.
- source_word: κύριος Σαβαὼθ
  choice: le Seigneur des armées
  rationale: Σαβαώθ translittère un titre hébreu désignant les armées ou puissances placées sous l’autorité divine. « Seigneur des armées » en communique le sens en français actuel.
- source_word: ἐγκατέλιπεν
  choice: avait laissé
  rationale: Conserve le sens premier de laisser subsister ou laisser derrière soi, sans expliciter davantage l’idée de préservation.
- source_word: σπέρμα
  choice: une descendance
  rationale: Le mot signifie littéralement « semence », mais désigne ici une postérité survivante. « Descendance » est naturel et évite d’introduire directement le terme théologique « reste ».
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: nous serions devenus comme Sodome
  rationale: Le conditionnel passé rend la conséquence irréelle marquée par ἄν, tandis que « devenus » conserve la valeur de γίνομαι.
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: nous aurions été rendus semblables à Gomorrhe
  rationale: La tournure passive distingue ὁμοιόω du verbe précédent et préserve le parallélisme sans les rendre de façon identique.
theological_decisions:
- issue: Rendu du titre divin κύριος Σαβαώθ dans une citation d’Ésaïe
  choice: le Seigneur des armées
  alternative: le Seigneur Sabaoth; le Seigneur des puissances
  rationale: Paul emploie κύριος avec la translittération grecque du titre hébreu. Traduire le titre en restitue le sens, tandis que « Seigneur » suit directement κύριος sans imposer dans le corps du texte la typographie « l’Éternel » ou « le SEIGNEUR » issue de la source hébraïque.
- issue: Interprétation de σπέρμα dans le contexte du reste
  choice: une descendance
  alternative: une semence; un reste
  rationale: Le contexte évoque bien des survivants, mais le terme grec est σπέρμα. « Descendance » maintient cette image de postérité sans remplacer le mot par l’interprétation théologique « reste ».
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. La syntaxe conditionnelle reste claire et le parallélisme des deux résultats est conservé. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
