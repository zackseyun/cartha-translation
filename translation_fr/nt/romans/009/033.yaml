  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: fr
  text: 'Comme il est écrit[a] : « Voici, je pose en Sion une pierre qui fait trébucher et un rocher qui fait tomber[b] ; et celui qui croit en lui[c] ne sera pas couvert de honte[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul réunit ici des formulations d’Ésaïe 8.14 et 28.16.
    reason: cross_reference
  - marker: b
    text: Le terme grec peut désigner ce qui fait tomber, un piège ou une cause de scandale.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « croit sur lui ». Le pronom grec est masculin et peut renvoyer à la pierre de l’image ; dans le contexte, Paul applique cette image au Messie.'
    reason: alternative_reading
  - marker: d
    text: 'Ou : « ne sera pas déçu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: Comme il est écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture ; elle rend la valeur résultative du parfait grec.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Conserve la force présentative et l’appel à l’attention, sans recourir à l’archaïsant « voici que » ou à une interjection artificielle.
- source_word: τίθημι
  choice: je pose
  rationale: Respecte le présent grec et convient naturellement à l’image d’une pierre placée pour une construction.
- source_word: ἐν Σιὼν
  choice: en Sion
  rationale: Rend directement la valeur locative de ἐν et correspond à l’expression biblique française usuelle.
- source_word: λίθον προσκόμματος
  choice: une pierre qui fait trébucher
  rationale: Exprime clairement pour un lectorat moderne la fonction indiquée par le génitif προσκόμματος, sans l’opacité possible de « pierre d’achoppement ».
- source_word: πέτραν σκανδάλου
  choice: un rocher qui cause la chute
  rationale: Préserve le parallélisme tout en distinguant légèrement cette expression de la précédente ; σκάνδαλον désigne ici ce qui fait tomber ou constitue un piège.
- source_word: ὁ πιστεύων
  choice: celui qui croit
  rationale: Rend le participe substantivé au singulier de façon naturelle et générique.
- source_word: ἐπ’ αὐτῷ
  choice: en lui
  rationale: Avec croire, « en lui » est l’expression française idiomatique. Le masculin personnel convient à l’application messianique du passage dans le contexte, tout en laissant l’image de la pierre perceptible.
- source_word: οὐ καταισχυνθήσεται
  choice: ne sera pas couvert de honte
  rationale: Conserve le futur passif et la dimension publique de honte ou de déshonneur, plus précisément que le plus interprétatif « ne sera pas déçu ».
theological_decisions:
- issue: Référent de αὐτῷ dans la citation composite d’Ésaïe
  choice: « en lui », avec une référence personnelle dans l’application de Paul au Messie
  alternative: « en elle », en faisant grammaticalement référence à la pierre de l’image
  rationale: L’image citée permet de comprendre le pronom comme renvoyant à la pierre, mais le contexte de Romains 9.32-33 et 10.11 applique cette pierre au Messie. Le texte principal rend donc la lecture personnelle sans effacer l’autre possibilité, signalée en note.
- issue: Portée de καταισχυνθήσεται
  choice: « ne sera pas couvert de honte »
  alternative: « ne sera pas déçu »
  rationale: La formulation retenue préserve le langage d’honneur et de honte du verbe grec. « Ne sera pas déçu » exprime une conséquence possible, mais réduit sa portée sémantique.
translation_notes:
  register: Français international moderne, clair et digne. Les expressions concrètes « fait trébucher » et « cause la chute » ont été préférées aux tournures plus traditionnelles mais moins immédiatement accessibles « pierre d’achoppement » et « rocher de scandale ». La ponctuation conserve l’unité de la citation composite.
