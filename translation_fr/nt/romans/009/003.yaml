id: ROM.9.3
reference: Romans 9:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: fr
  text: Car je souhaiterais être moi-même maudit et séparé du Messie[a] pour mes frères[b], les membres de ma parenté selon la chair[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « maudit, loin du Messie » ou « sous la malédiction, séparé du Messie ». L’expression grecque associe l’idée de malédiction à celle de séparation d’avec le Messie.'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « mes frères ». Dans ce contexte, Paul parle de ses frères israélites, membres de son peuple.
    reason: cultural_note
  - marker: c
    text: Ici, « selon la chair » signifie par ascendance physique ou ethnique, et non « selon la nature pécheresse ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: je souhaiterais
  rationale: L’imparfait de εὔχομαι exprime ici un souhait potentiel ou irréalisable plutôt qu’une simple action passée. Le conditionnel français en restitue naturellement la force.
- source_word: γὰρ
  choice: Car
  rationale: Marque le lien explicatif avec l’affirmation précédente et conserve le mouvement argumentatif de Paul.
- source_word: ἀνάθεμα
  choice: maudit
  rationale: Le terme désigne ce qui est voué à la destruction ou placé sous une malédiction. « Maudit » est clair, fort et accessible en français moderne.
- source_word: αὐτὸς ἐγώ
  choice: moi-même
  rationale: Conserve l’insistance personnelle produite par le pronom emphatique et le sujet explicite.
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: séparé du Messie
  rationale: ἀπό exprime l’éloignement ou la séparation. « Séparé du Messie » rend explicitement cette valeur, tandis que « Messie » conserve ici la portée du titre Χριστός.
- source_word: ὑπὲρ
  choice: pour
  rationale: 'Exprime sobrement la valeur bénéficiaire : Paul envisage cette situation en faveur des personnes dont il parle.'
- source_word: τῶν ἀδελφῶν μου
  choice: mes frères
  rationale: Rend directement le masculin pluriel ἀδελφῶν. Le contexte précise qu’il s’agit des compatriotes israélites de Paul, et non seulement de frères au sens familial immédiat.
- source_word: τῶν συγγενῶν μου
  choice: ceux de ma parenté
  rationale: Formulation collective et naturelle qui exprime le lien d’origine commune sans limiter le groupe à la famille proche.
- source_word: κατὰ σάρκα
  choice: selon la chair
  rationale: Conserve l’expression paulinienne et son sens physique ou ethnique dans ce contexte, sans lui attribuer à tort le sens de « nature pécheresse ».
theological_decisions:
- issue: Le propos de Paul est-il une prière effective ou un souhait hypothétique ?
  choice: « je souhaiterais », qui exprime un souhait potentiel ou irréalisable
  alternative: « je souhaitais » ou « je priais »
  rationale: Le conditionnel évite d’affirmer que Paul aurait effectivement demandé à être séparé du Messie, tout en préservant l’intensité de ses paroles.
- issue: Rapport entre ἀνάθεμα et ἀπὸ τοῦ Χριστοῦ
  choice: « maudit et séparé du Messie »
  alternative: « maudit loin du Messie » ou « sous la malédiction, séparé du Messie »
  rationale: La formulation française associe la malédiction à la séparation sans définir de manière trop étroite leur rapport exact; la note signale l’ambiguïté réelle de la construction grecque.
- issue: Valeur de Χριστός
  choice: « le Messie »
  alternative: « le Christ »
  rationale: Le titre messianique reste pleinement perceptible dans ce contexte et ne doit pas être réduit silencieusement à un nom propre.
- issue: Sens de σάρξ dans κατὰ σάρκα
  choice: ascendance physique ou ethnique, exprimée littéralement par « selon la chair »
  alternative: « selon la nature pécheresse »
  rationale: Paul désigne ici son lien de parenté avec les Israélites; il ne traite pas de la propension humaine au péché.
translation_notes:
  register: Français international moderne, digne et lisible. Le conditionnel « souhaiterais » restitue l’intensité d’un souhait difficile ou irréalisable. « Ceux de ma parenté » évite le caractère vieilli de « mes compatriotes de race » et le sens trop étroit que pourrait prendre « mes parents ». La formulation conserve « selon la chair » afin de maintenir le vocabulaire paulinien, avec une note explicative.
