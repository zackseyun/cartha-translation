  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: fr
  text: 'Tu me diras donc : « Pourquoi alors fait-il encore des reproches ? En effet, qui a résisté à sa volonté[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à son dessein » ou « à son intention ». Le mot grec βούλημα peut désigner la volonté, l’intention ou le dessein.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: Tu me diras
  rationale: Le futur introduit naturellement l’objection anticipée d’un interlocuteur; « diras » reste proche de λέγω sans transformer la parole en simple demande.
- source_word: μοι
  choice: me
  rationale: Le pronom datif est rendu explicitement comme complément indirect.
- source_word: οὖν ... οὖν
  choice: donc ... alors
  rationale: Les deux particules inférentielles sont conservées sans la lourdeur d’une répétition identique en français.
- source_word: Τί ... ἔτι μέμφεται
  choice: Pourquoi ... fait-il encore des reproches ?
  rationale: Dans ce contexte, τί a une valeur causale (« pourquoi »); ἔτι est rendu par « encore », et μέμφεται par l’expression française naturelle « faire des reproches ».
- source_word: τῷ βουλήματι αὐτοῦ
  choice: à sa volonté
  rationale: βούλημα désigne ici ce qui est voulu, l’intention ou le dessein arrêté. « Volonté » est naturel en français et laisse la portée exacte ouverte; les autres nuances sont signalées en note.
- source_word: τίς ἀνθέστηκεν
  choice: qui a résisté
  rationale: Le parfait est rendu par le passé composé, naturel en français et pertinent pour une résistance envisagée jusqu’au présent de l’argument.
theological_decisions:
- issue: Sens de βούλημα dans le contexte de la souveraineté divine
  choice: sa volonté
  alternative: son dessein; son intention
  rationale: « Volonté » exprime le vouloir divin sans préciser à lui seul la relation entre souveraineté et responsabilité humaine. La note conserve les nuances possibles du terme grec et le texte maintient intacte la tension de l’objection.
- issue: Référent implicite du sujet de μέμφεται
  choice: fait-il encore des reproches
  alternative: Dieu fait-il encore des reproches
  rationale: Le grec garde le sujet implicite, identifiable par le contexte. Ne pas ajouter « Dieu » respecte la formulation serrée de l’objection et évite une explicitation inutile.
translation_notes:
  register: Français international moderne, digne et oralement naturel. Le tutoiement singulier correspond à l’interlocuteur rhétorique individuel de Paul. La ponctuation rend clairement l’objection anticipée et ses deux questions.
