id: ROM.9.8
reference: Romans 9:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: fr
  text: C’est-à-dire que ce ne sont pas les enfants de la chair[a] qui sont les enfants de Dieu, mais les enfants de la promesse qui sont comptés comme descendance[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants selon la descendance naturelle ». Le grec dit littéralement « les enfants de la chair ».
    reason: lexical_alternative
  - marker: b
    text: Ou « considérés comme la postérité » ou, plus littéralement, « comptés comme semence ». Ici, le mot grec désigne les descendants.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: C’est-à-dire que
  rationale: Cette formule introduit naturellement en français l’explication que Paul donne de son affirmation précédente.
- source_word: τέκνα
  choice: enfants
  rationale: Le terme est inclusif et désigne ici des enfants ou descendants, sans se limiter aux fils de sexe masculin; sa répétition maintient le contraste de Paul.
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: les enfants de la chair
  rationale: La formulation conserve l’image paulinienne de la chair tout en laissant le contexte indiquer qu’il s’agit de la filiation naturelle.
- source_word: τέκνα τοῦ θεοῦ
  choice: les enfants de Dieu
  rationale: Cette traduction directe préserve le parallélisme entre les différents groupes appelés « enfants ».
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: les enfants de la promesse
  rationale: La formulation garde le lien explicite avec la promesse divine sans préciser davantage, dans la traduction, comment cette relation doit être comprise.
- source_word: λογίζεται
  choice: sont comptés
  rationale: Le passif français exprime l’idée d’être reconnu ou tenu pour, sans ajouter explicitement un sujet qui n’apparaît pas dans le grec.
- source_word: εἰς σπέρμα
  choice: comme descendance
  rationale: Dans le contexte abrahamique, σπέρμα désigne la postérité ou les descendants; « descendance » est clair en français moderne et conserve la valeur collective du singulier grec.
theological_decisions:
- issue: Le contraste entre la descendance naturelle et les enfants définis par la promesse
  choice: Conserver le contraste entre « enfants de la chair » et « enfants de la promesse » sans préciser dans la traduction un système théologique particulier.
  alternative: Expliciter soit une lecture exclusivement collective et historique, soit une lecture explicitement centrée sur la prédestination individuelle.
  rationale: Le grec énonce le contraste et affirme que les enfants de la promesse sont reconnus comme descendance, mais ce verset seul ne tranche pas toutes les questions théologiques plus larges soulevées par Romains 9.
translation_notes:
  register: Français international moderne, clair et digne. La structure répétitive de Paul est conservée, ainsi que les expressions théologiquement chargées « enfants de la chair » et « enfants de la promesse »; les notes éclairent leur portée généalogique sans effacer leur formulation.
