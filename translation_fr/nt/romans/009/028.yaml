  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λόγον γὰρ συντελῶν καὶ ⸀συντέμνων ποιήσει κύριος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: fr
  text: Car le Seigneur accomplira sa parole[a] sur la terre[c], en la menant à son terme et en l’abrégeant[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la décision » ou « la sentence ».'
    reason: lexical_alternative
  - marker: b
    text: « En l’abrégeant » peut aussi se comprendre comme « en la raccourcissant » ou, par implication, « en l’exécutant rapidement ».
    reason: lexical_alternative
  - marker: c
    text: 'Certains traduisent : « dans le pays », conformément au contexte originel d’Ésaïe ; le texte grec de Romains porte ici plus naturellement : « sur la terre ».'
    reason: cross_reference
lexical_decisions:
- source_word: λόγον
  choice: sa parole
  rationale: Dans cette citation d’Ésaïe, λόγον désigne ce que le Seigneur a déclaré et qu’il réalisera. « Sa parole » conserve la dimension verbale et déclarative du terme, tandis que le possessif, implicite dans le contexte, rend la phrase naturelle en français.
- source_word: γὰρ
  choice: Car
  rationale: γάρ introduit l’explication de l’affirmation précédente. « Car » restitue avec concision le lien argumentatif.
- source_word: συντελῶν
  choice: en la menant à son terme
  rationale: Le participe exprime l’accomplissement complet de la parole annoncée. Cette formulation française est naturelle et conserve l’idée d’aboutissement.
- source_word: καὶ συντέμνων
  choice: et en l’abrégeant
  rationale: συντέμνω signifie raccourcir ou abréger. « En l’abrégeant » préserve l’image vigoureuse du grec sans imposer l’interprétation plus explicite d’une exécution rapide.
- source_word: ποιήσει
  choice: accomplira
  rationale: Avec λόγον pour complément, ποιήσει indique que le Seigneur réalisera ce qu’il a déclaré. « Accomplira » est idiomatique et garde le rapport étroit entre parole et réalisation.
- source_word: κύριος
  choice: le Seigneur
  rationale: Rend directement le titre divin κύριος dans la citation scripturaire.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: La formulation grecque transmise en Romains se comprend naturellement au sens large de « sur la terre ». « Dans le pays » reste possible à la lumière du contexte originel d’Ésaïe, mais serait ici plus restrictif.
theological_decisions:
- issue: Nature de l’action divine dans la citation d’Ésaïe
  choice: Le Seigneur mène à son plein accomplissement la parole qu’il a prononcée, dans l’histoire et avec une possible portée judiciaire, sans préciser davantage la nature doctrinale de cette action.
  alternative: Le Seigneur exécute rapidement et définitivement une sentence judiciaire.
  rationale: Les deux participes peuvent avoir des résonances judiciaires et suggérer une action décisive, mais le grec ne requiert pas que la traduction explicite une doctrine particulière. La formulation retenue conserve la tension entre parole, accomplissement et abrègement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement de la phrase grecque, tout en évitant une tournure artificielle. « Abréger sa parole » est une image inhabituelle mais intelligible, conservée pour ne pas effacer l’ambiguïté et la vigueur de συντέμνων.
