id: ROM.9.5
reference: Romans 9:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: fr
  text: À eux appartiennent les pères, et c’est d’eux que, selon la chair[a], est issu le Messie, lui qui est au-dessus de tout, Dieu béni pour toujours[b]. Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quant à son ascendance humaine ». Littéralement : « selon la chair ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, si l’on comprend la dernière proposition comme une doxologie distincte : « Que Dieu, qui est au-dessus de tout, soit béni pour toujours! Amen. » plutôt que comme une description du Messie.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: les pères
  rationale: Rend étroitement l’expression grecque et conserve le langage de l’histoire de l’alliance; « les patriarches » serait plus explicite mais aussi plus restrictif.
- source_word: ἐξ ὧν
  choice: c’est d’eux que … est issu
  rationale: Formulation française naturelle exprimant l’origine du Messie au sein d’Israël.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre lié aux privilèges d’Israël, plutôt que comme un nom propre.
- source_word: τὸ κατὰ σάρκα
  choice: selon la chair
  rationale: Conserve l’expression paulinienne et son contraste implicite, tout en désignant ici l’ascendance humaine plutôt qu’une nature pécheresse.
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: lui qui est au-dessus de tout
  rationale: Le participe grec reprend naturellement « le Messie »; « lui qui » rend clairement cette apposition en français.
- source_word: θεὸς εὐλογητὸς
  choice: Dieu béni
  rationale: Suit de près la formulation grecque et permet de lire le groupe comme une désignation apposée au Messie, sans développer davantage l’énoncé.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Équivalent idiomatique et digne de la formule doxologique grecque.
- source_word: ἀμήν
  choice: Amen
  rationale: Translittération liturgique consacrée en français.
theological_decisions:
- issue: La proposition « ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας » décrit-elle le Messie ou constitue-t-elle une doxologie distincte adressée à Dieu?
  choice: 'Le texte principal poursuit la description du Messie : « lui qui est au-dessus de tout, Dieu béni pour toujours »。'
  alternative: 'Comprendre la fin comme une doxologie distincte : « Que Dieu, qui est au-dessus de tout, soit béni pour toujours! Amen. »'
  rationale: L’enchaînement syntaxique rattache naturellement le participe articulé ὁ ὢν à ὁ χριστός. Toutefois, les plus anciens manuscrits ne fournissant pas une ponctuation décisive et l’interprétation doxologique étant ancienne et grammaticalement défendable, celle-ci est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec sans devenir obscure. « Les pères » préserve le vocabulaire biblique de Paul; la note explique l’idiome « selon la chair ». La ponctuation principale retient la lecture christologique tout en conservant l’autre lecture en note.
