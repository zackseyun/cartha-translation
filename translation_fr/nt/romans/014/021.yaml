source:
  edition: SBLGNT
  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: fr
  text: Il est bon de ne pas manger de viande, de ne pas boire de vin, ni de faire quoi que ce soit qui fasse trébucher ton frère, qui le scandalise ou l’affaiblisse[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, « ton frère » peut aussi se comprendre au sens de « ton frère ou ta sœur », c’est-à-dire un autre croyant.
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: Il est bon
  rationale: 'Exprime naturellement en français le jugement moral porté sur cette conduite : elle est bonne et recommandable.'
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: de ne pas manger de viande
  rationale: Conserve simplement la construction infinitive et rend κρέα selon son sens alimentaire dans le contexte.
- source_word: μηδὲ πιεῖν οἶνον
  choice: de ne pas boire de vin
  rationale: La répétition de « de ne pas » rend clairement l’abstention coordonnée par μηδέ dans un français naturel.
- source_word: μηδὲ ἐν ᾧ
  choice: ni de faire quoi que ce soit qui
  rationale: Le grec est elliptique; « faire » explicite le verbe sous-entendu, tandis que « quoi que ce soit » conserve la portée générale de la dernière proposition.
- source_word: ὁ ἀδελφός σου
  choice: ton frère
  rationale: Respecte le masculin singulier du grec; dans le contexte, le terme peut désigner de façon représentative un autre croyant, ce que précise la note.
- source_word: προσκόπτει
  choice: amène ... à trébucher
  rationale: Préserve la métaphore d’un obstacle qui provoque une faute ou une chute morale, tout en rattachant clairement l’effet à la conduite évoquée.
- source_word: σκανδαλίζεται
  choice: à tomber dans un piège
  rationale: Rend la forme passive et l’image du piège ou de l’occasion de chute, tout en distinguant ce verbe de προσκόπτει sans le réduire au sens français moderne d’« être scandalisé ».
- source_word: ἀσθενεῖ
  choice: à s’affaiblir
  rationale: Conserve le sens figuré de devenir faible dans la foi ou la conscience sans ajouter explicitement une interprétation absente du texte.
theological_decisions:
- issue: Valeur représentative de ἀδελφός
  choice: ton frère
  alternative: ton frère ou ta sœur; l’autre croyant
  rationale: Le texte principal conserve le masculin singulier de l’original. Une note indique que, dans ce contexte communautaire, il peut inclure tout compagnon ou toute compagne dans la foi.
- issue: Distinction entre προσκόπτει, σκανδαλίζεται et ἀσθενεῖ
  choice: trébucher, tomber dans un piège, s’affaiblir
  alternative: trébucher, être scandalisé, être affaibli
  rationale: La formulation retenue maintient trois effets proches mais distincts et évite le contresens possible du français moderne « scandalisé », souvent limité au sentiment d’indignation.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond à σου et s’inscrit dans l’exhortation adressée personnellement au lecteur. La coordination est légèrement explicitée pour rendre en français l’ellipse grecque.
