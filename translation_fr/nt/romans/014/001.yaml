  source_fidelity: '« Accueillez celui qui est faible dans la foi » rend fidèlement Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε. La dernière expression, μὴ εἰς διακρίσεις διαλογισμῶν, est concise et son rapport génitif demeure discuté : elle peut évoquer des controverses, des jugements ou des différenciations au sujet de raisonnements/opinions. Le possessif « ses » dans le projet restreint indûment ces raisonnements à ceux de la personne accueillie, ce que le grec ne dit pas.'
  naturalness: « Accueillez » et le pluriel impératif sont naturels en français international moderne. « Sans entrer dans des débats sur des opinions » est idiomatique, mais « sans vous lancer dans des débats sur des opinions » exprime plus clairement l’idée polémique à éviter sans attribuer les opinions à la personne accueillie.
  terminology: « Faible dans la foi » conserve πίστις sans imposer « conscience » ou « doctrine ». « Opinions » est une représentation française naturelle de διαλογισμοί dans ce contexte; la note maintient « raisonnements » et les possibilités « jugements »/« querelles » pour préserver l’ambiguïté de διακρίσεις διαλογισμῶν.
