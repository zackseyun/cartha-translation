id: ROM.14.1
reference: Romans 14:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: fr
  text: Accueillez celui qui est faible dans la foi, sans vous lancer dans des débats sur des opinions.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans porter de jugement sur des opinions »; ou : « sans provoquer de querelles à propos de raisonnements ». L’expression grecque peut décrire des jugements, des débats ou des différends portant sur des pensées, des opinions ou des raisonnements.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: celui qui est faible
  rationale: Le participe présent substantivé désigne une personne caractérisée ici par sa faiblesse, sans préciser qu’il s’agit de la conscience.
- source_word: τῇ πίστει
  choice: dans la foi
  rationale: Le datif indique le domaine dans lequel la personne est faible. « La foi » conserve le terme grec sans en faire explicitement un corps de doctrine.
- source_word: προσλαμβάνεσθε
  choice: accueillez
  rationale: L’impératif appelle la communauté à recevoir cette personne auprès d’elle et à l’intégrer dans ses relations; « accueillez » exprime naturellement cette portée en français.
- source_word: μὴ εἰς
  choice: sans entrer dans
  rationale: La construction indique le but ou le résultat à éviter. Cette formulation française relie clairement l’accueil demandé au comportement interdit.
- source_word: διακρίσεις
  choice: débats
  rationale: Dans ce contexte, le nom évoque des évaluations divergentes susceptibles de devenir des controverses, plutôt que de simples distinctions neutres.
- source_word: διαλογισμῶν
  choice: raisonnements
  rationale: Le mot peut désigner des pensées, réflexions ou raisonnements. « Raisonnements » préserve mieux que « opinions » le caractère intérieur et délibératif du terme grec.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: La particule assure une transition légère. En français, le début direct de l’exhortation suffit dans ce verset isolé; « mais » donnerait un contraste trop marqué et « maintenant » introduirait une nuance temporelle absente.
theological_decisions:
- issue: Sens de πίστις
  choice: foi
  alternative: confiance; fidélité
  rationale: Le contexte porte sur la faiblesse d’un croyant quant à ses convictions pratiques. « Foi » maintient la polysémie du terme et évite de préciser abusivement « conscience » ou « doctrine ».
- issue: Portée de διακρίσεις διαλογισμῶν
  choice: sans entrer dans des débats sur ses raisonnements
  alternative: sans juger ses opinions contestées; sans provoquer de querelles à propos de ses réflexions
  rationale: La relation exacte entre les deux noms grecs admet plusieurs analyses. Le texte principal retient une lecture naturelle où les raisonnements de la personne deviennent l’objet de débats, tandis que la note conserve les autres possibilités.
translation_notes:
  register: Français international moderne, simple et digne. « Accueillez » convient mieux à l’usage courant que « recevez » pour l’intégration d’une personne dans la communauté. Le pluriel s’adresse collectivement aux lecteurs.
