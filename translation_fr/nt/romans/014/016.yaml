  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: fr
  text: Que le bien qui est le vôtre ne soit donc pas décrié.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dénigré », « insulté » ou « présenté comme mauvais ». Le verbe grec désigne des paroles injurieuses ou diffamatoires ; « blasphémé » serait plus littéral, mais peut sembler ici trop exclusivement religieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ … βλασφημείσθω
  choice: ne soit pas calomnié
  rationale: Avec l’impératif présent passif, μή exprime une défense. « Ne soit pas calomnié » conserve la voix passive et rend naturellement l’idée de paroles diffamatoires ou injurieuses sans employer « blasphémé », qui évoquerait trop exclusivement une offense religieuse en français.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence tirée de l’argument précédent ; « donc » exprime clairement ce lien logique dans un français actuel.
- source_word: ὑμῶν
  choice: qui est le vôtre
  rationale: Le génitif indique ici la possession ou l’association. Cette tournure française relie sans ambiguïté le bien aux destinataires.
- source_word: τὸ ἀγαθόν
  choice: le bien
  rationale: L’adjectif neutre substantivé signifie littéralement « le bien » ou « ce qui est bon ». « Le bien » garde la formulation concise et ne réduit pas son référent à la liberté, au privilège ou à un avantage précis.
theological_decisions:
- issue: Référent de « le bien qui est le vôtre » (τὸ ἀγαθόν)
  choice: Conserver une désignation large sans préciser le référent.
  alternative: « votre liberté », « votre privilège » ou « ce qui est bon pour vous »
  rationale: La formulation grecque reste concise et peut viser le bien lié aux convictions, à la liberté ou à la situation des croyants dans les questions discutées. Préciser davantage résoudrait une ambiguïté que le texte maintient.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure « le bien qui est le vôtre » préserve le sens large du grec tout en étant plus claire que le calque ambigu « votre bien ».
