  source_fidelity: « Calomnié » restreint indûment βλασφημείσθω à l’accusation mensongère. Dans ce contexte, le verbe désigne plus largement le fait d’être décrié, vilipendé ou présenté de façon déshonorante. « Décrié » conserve cette portée sans donner à « blasphémé » une coloration religieuse trop étroite. La défense, la voix passive, l’inférence de οὖν et l’ambiguïté de τὸ ἀγαθόν sont préservées.
