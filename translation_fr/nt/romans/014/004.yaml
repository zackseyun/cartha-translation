- from: Qui es-tu pour juger le serviteur de maison d’un autre ? C’est devant son propre maître qu’il tient debout ou qu’il tombe. Mais il tiendra debout[a], car le Seigneur a le pouvoir de le faire tenir debout.
  to: Qui es-tu, toi, pour juger l’esclave domestique[a] d’un autre ? Il reste debout ou tombe devant son propre maître. Mais il sera maintenu debout, car le Seigneur[b] peut le faire tenir debout.
  rationale: La révision rétablit la valeur passive de σταθήσεται par « il sera maintenu debout », tout en gardant la reprise verbale avec « le faire tenir debout ». Elle rend οἰκέτης de manière socialement explicite et ajoute les notes nécessaires pour les alternatives lexicales et référentielles.
