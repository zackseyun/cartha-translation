source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: fr
  text: Qui es-tu, toi, pour juger l’esclave domestique[a] d’un autre ? Il reste debout ou tombe devant son propre maître. Mais il sera maintenu debout, car le Seigneur[b] peut le faire tenir debout.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec οἰκέτης désigne une personne attachée au service d’une maison ; selon le contexte, il peut être rendu par « serviteur domestique » ou « esclave domestique ».
    reason: lexical_alternative
  - marker: b
    text: Le grec κύριος, rendu plus haut par « maître », peut aussi être compris ici comme désignant le maître dans l’image domestique. Le contexte favorise toutefois la référence au Seigneur.
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: Qui es-tu pour juger
  rationale: Cette formulation française naturelle conserve la force de l’interpellation rhétorique et la valeur du participe substantivé.
- source_word: ἀλλότριον οἰκέτην
  choice: le serviteur de maison d’un autre
  rationale: « Serviteur de maison » précise l’appartenance au personnel domestique sans employer « esclave domestique », formulation aujourd’hui susceptible de suggérer à tort un type particulier de travail plutôt que le statut social évoqué par οἰκέτης.
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: devant son propre maître
  rationale: Dans l’image sociale, « maître » est le terme français naturel pour κύριος; « devant » exprime clairement la relation de responsabilité indiquée par le datif.
- source_word: στήκει ἢ πίπτει
  choice: il tient debout ou il tombe
  rationale: La traduction maintient l’opposition métaphorique et prépare la reprise du même champ verbal dans la phrase suivante.
- source_word: σταθήσεται
  choice: il tiendra debout
  rationale: Le futur passif grec peut avoir ici une valeur intransitive; la proposition causative suivante explicite que sa stabilité dépend de la puissance du Seigneur. Cette formulation évite le français lourd « il sera fait tenir debout ».
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: car le Seigneur a le pouvoir de le faire tenir debout
  rationale: « A le pouvoir » rend δυνατεῖ, tandis que « faire tenir debout » conserve la valeur causative et la répétition voulue de la racine de ἵστημι.
theological_decisions:
- issue: Référent de ὁ κύριος dans la proposition finale
  choice: « le Seigneur », au sens théologique
  alternative: « son maître », dans le prolongement strict de l’image domestique
  rationale: L’article, l’usage paulinien et surtout le pouvoir attribué à κύριος favorisent la référence au Seigneur divin, tout en laissant l’écho avec le maître de l’image perceptible grâce aux termes voisins.
- issue: Valeur de σταθήσεται
  choice: « il tiendra debout », avec l’action divine explicitée dans la proposition suivante
  alternative: « il sera maintenu debout » ou « il sera fait tenir debout »
  rationale: Le passif peut suggérer l’action divine, mais le grec futur passif de ἵστημι peut aussi se rendre naturellement par un intransitif. La suite préserve sans ambiguïté la dépendance envers la puissance du Seigneur.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « tenir debout » est volontaire afin de reproduire le lien verbal grec. « Serviteur de maison » garde la précision d’οἰκέτης; « maître » convient à l’image sociale, tandis que « Seigneur » signale le référent théologique probable dans la dernière proposition.
