id: ROM.14.3
reference: Romans 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: fr
  text: Que celui qui mange ne méprise pas celui qui ne mange pas[a], et que celui qui ne mange pas ne juge pas celui qui mange[b], car Dieu l’a accueilli[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne traite pas avec mépris celui qui ne mange pas ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ne porte pas de jugement sur celui qui mange ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « l’a accepté » ou « l’a reçu ». Le verbe peut évoquer l’accueil de quelqu’un dans la communion.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: celui qui mange
  rationale: Le participe présent substantivé désigne la personne caractérisée ici par le fait de manger. Cette formulation naturelle conserve le parallélisme grec.
- source_word: τὸν μὴ ἐσθίοντα
  choice: celui qui ne mange pas
  rationale: La formulation reste proche du grec et n’explicite pas davantage l’objet ou la nature de l’abstinence.
- source_word: ἐξουθενείτω
  choice: ne méprise pas
  rationale: Le verbe exprime le fait de tenir quelqu’un pour négligeable ou de le traiter avec mépris. « Mépriser » en restitue clairement la force morale.
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: et que celui qui ne mange pas
  rationale: La coordination française avec « et » soutient le parallélisme des deux interdictions; leur opposition réciproque rend déjà la valeur contrastive de δέ.
- source_word: κρινέτω
  choice: ne juge pas
  rationale: « Juger » conserve l’étendue sémantique de κρίνω sans la réduire à une condamnation formelle.
- source_word: γὰρ
  choice: car
  rationale: « Car » marque naturellement la justification des deux exhortations précédentes.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom objet singulier conserve la formulation grecque sans remplacer explicitement son référent par une paraphrase.
- source_word: προσελάβετο
  choice: a accueilli
  rationale: Dans ce contexte communautaire, le verbe évoque le fait de recevoir favorablement quelqu’un et de l’admettre dans la communion.
theological_decisions:
- issue: Portée de l’opposition entre manger et ne pas manger
  choice: Conserver la formulation générale « mange / ne mange pas ».
  alternative: Préciser qu’il s’agit de manger de tout ou de s’abstenir de certains aliments.
  rationale: Le contexte traite des pratiques alimentaires, mais ce verset n’en précise pas lui-même la nature. La traduction évite donc d’ajouter une interprétation contextuelle au texte principal.
- issue: Référent de αὐτόν dans « Dieu l’a accueilli »
  choice: Conserver le pronom singulier « l’ » sans expliciter davantage son référent.
  alternative: Traduire « Dieu a accueilli cette personne » ou rattacher explicitement le pronom à celui qui mange.
  rationale: L’antécédent grammatical immédiat est celui qui mange, tandis que l’argument réciproque peut s’appliquer plus largement au croyant que Dieu a accueilli. Le pronom préserve cette tension sans la résoudre artificiellement.
translation_notes:
  register: Français international moderne, naturel et digne. La construction exhortative « Que celui qui… » maintient le parallélisme et la force des impératifs grecs. Le vocabulaire reste accessible sans expliciter les pratiques alimentaires au-delà du texte.
