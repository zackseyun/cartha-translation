id: ROM.14.7
reference: Romans 14:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: fr
  text: En effet, aucun de nous ne vit pour lui-même[a], et aucun ne meurt pour lui-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à lui-même ». Le datif réfléchi grec peut se traduire plus littéralement ainsi, mais il désigne probablement ici le fait de vivre ou de mourir en prenant sa propre personne comme finalité ultime.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: aucun
  rationale: Employé comme sujet dans les deux propositions, « aucun » conserve la négation universelle et le parallélisme concis du grec.
- source_word: γὰρ
  choice: En effet
  rationale: Introduit l’explication de l’affirmation précédente. « En effet » rend naturellement en français la valeur explicative de γάρ.
- source_word: ἡμῶν
  choice: de nous
  rationale: 'Génitif partitif avec οὐδείς : « aucun de nous » est l’équivalent français direct et naturel.'
- source_word: ἑαυτῷ
  choice: pour lui-même
  rationale: Le datif réfléchi indique ici vraisemblablement l’orientation ou la finalité de la vie et de la mort; cette formulation française reste naturelle tout en laissant ouverte la nuance plus littérale « à lui-même ».
- source_word: ζῇ
  choice: vit
  rationale: Le présent simple convient à cette affirmation générale et sentencieuse.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne directement les deux propositions parallèles.
- source_word: ἀποθνῄσκει
  choice: meurt
  rationale: Le présent simple exprime la vérité générale et maintient le parallélisme avec « vit ».
theological_decisions:
- issue: Sens du datif réfléchi ἑαυτῷ dans les deux propositions
  choice: pour lui-même
  alternative: à lui-même; pour son propre compte
  rationale: Dans le contexte, Paul oppose une vie et une mort centrées sur soi à une vie et une mort orientées vers le Seigneur, explicitées au verset 8. « Pour lui-même » transmet cette orientation sans ajouter de formulation doctrinale.
- issue: Valeur générique du masculin singulier
  choice: lui-même
  alternative: soi-même
  rationale: Le grec emploie un réfléchi masculin singulier de portée générique. « Lui-même » en garde le nombre et la forme, tandis que le contexte indique qu’il s’agit de chacun parmi « nous ».
translation_notes:
  register: Français international moderne, sobre et digne. « En effet » assure une liaison explicative naturelle; la répétition de « pour lui-même » préserve le parallélisme rhétorique du grec.
