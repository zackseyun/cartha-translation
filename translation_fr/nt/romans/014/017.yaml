id: ROM.14.17
reference: Romans 14:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: fr
  text: Car le royaume de Dieu n’est pas une question de manger et de boire, mais de justice[a], de paix et de joie dans l’Esprit Saint.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « droiture ». Le mot grec peut désigner ce qui est juste, tant comme qualité morale que dans les relations.
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεία
  choice: royaume
  rationale: « Royaume » est l’équivalent français traditionnel et naturel ici; il conserve l’ampleur de la réalité désignée, sans la réduire au seul exercice du règne.
- source_word: βρῶσις καὶ πόσις
  choice: manger et boire
  rationale: Les deux noms d’action grecs sont rendus symétriquement par des infinitifs, formulation naturelle en français et adaptée au contexte des pratiques alimentaires discutées.
- source_word: δικαιοσύνη
  choice: justice
  rationale: « Justice » couvre ici la conformité à ce qui est juste devant Dieu ainsi que sa dimension éthique et relationnelle. « Droiture » demeure une possibilité réelle, signalée en note.
- source_word: εἰρήνη
  choice: paix
  rationale: Équivalent direct et naturel, qui convient à l’harmonie communautaire visée dans le contexte.
- source_word: χαρά
  choice: joie
  rationale: Équivalent français courant qui conserve la force positive du terme paulinien.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: dans l’Esprit saint
  rationale: La préposition « dans » préserve la nuance grecque de sphère sans trancher en faveur d’une simple causalité instrumentale; l’expression désigne naturellement l’Esprit saint.
- source_word: γάρ
  choice: Car
  rationale: « Car » maintient explicitement le lien explicatif avec l’argument précédent.
theological_decisions:
- issue: Portée de δικαιοσύνη dans ce passage paulinien
  choice: justice
  alternative: droiture
  rationale: Le français « justice » est l’équivalent principal le plus large et le plus naturel, tandis que « droiture » explicite davantage la qualité morale. La note conserve cette nuance sans imposer une interprétation confessionnelle.
- issue: Valeur de ἐν devant πνεύματι ἁγίῳ
  choice: dans l’Esprit saint
  alternative: par l’Esprit saint
  rationale: « Dans » laisse ouvertes les nuances de sphère et de moyen présentes dans la construction grecque, alors que « par » privilégierait la valeur instrumentale.
translation_notes:
  register: Français international moderne, sobre et digne. « Ne consiste pas à… mais en… » rend idiomatiquement la structure grecque tout en conservant son contraste. La répétition de « en » devant les trois termes clarifie leur coordination.
