  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: fr
  text: 'Car c’est pour cela que le Messie est mort et a repris vie[a] : afin qu’il règne sur les morts comme sur les vivants.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « a vécu »; on peut aussi traduire : « est revenu à la vie ». Dans ce contexte, il s’agit de la vie après la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: c’est pour cela
  rationale: Cette tournure française exprime naturellement le but visé dans le contexte, plutôt qu’une simple cause rétrospective.
- source_word: γὰρ
  choice: car
  rationale: Le connecteur introduit l’explication qui appuie l’affirmation précédente.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre désignant Jésus; « le Messie » en restitue le sens en français courant.
- source_word: ἀπέθανεν
  choice: est mort
  rationale: Rendu direct de l’aoriste de ἀποθνῄσκω.
- source_word: ἔζησεν
  choice: a repris vie
  rationale: Associé à « est mort », le verbe désigne ici la vie après la mort. « A repris vie » rend cette implication contextuelle sans employer directement le vocabulaire plus explicite de la résurrection.
- source_word: ἵνα
  choice: afin de
  rationale: La construction exprime clairement le but et s’enchaîne naturellement avec l’infinitif français.
- source_word: νεκρῶν
  choice: les morts
  rationale: Le substantif pluriel désigne les personnes mortes et forme un contraste idiomatique avec « les vivants ».
- source_word: ζώντων
  choice: les vivants
  rationale: Le participe substantivé désigne ceux qui vivent et conserve le parallélisme avec « les morts ».
- source_word: κυριεύσῃ
  choice: exercer sa seigneurie sur
  rationale: Cette formulation verbale rend l’idée de domination propre à κυριεύω tout en préservant son lien lexical avec κύριος, sans transformer le verbe en simple titre.
theological_decisions:
- issue: Portée de ἔζησεν après ἀπέθανεν
  choice: « a repris vie », avec une note signalant le rendu littéral
  alternative: « a vécu » ou « est revenu à la vie »
  rationale: La succession « est mort et a vécu » et la domination sur les morts et les vivants orientent nettement vers la vie de résurrection. La note maintient toutefois visible la sobriété lexicale du grec.
- issue: Valeur christologique de κυριεύσῃ
  choice: « exercer sa seigneurie sur »
  alternative: « régner sur » ou « être le Seigneur des »
  rationale: Le choix conserve la forme verbale du grec et son idée d’autorité, tout en laissant entendre son rapport à « Seigneur » sans substituer au verbe une formulation nominale plus interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le raisonnement explicatif de Paul et son expression de but. « Sur les morts comme sur les vivants » rend naturellement en français la coordination grecque καὶ…καί.
