id: ROM.14.22
reference: Romans 14:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: fr
  text: La foi que tu as[a], garde-la pour toi devant Dieu. Heureux celui qui ne se condamne pas lui-même[b] par ce qu’il approuve.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « La conviction que tu as ». Ici, le mot grec rendu par « foi » peut désigner une conviction personnelle au sujet des questions discutées.
    reason: lexical_alternative
  - marker: b
    text: Ou « ne se juge pas lui-même ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: la foi
  rationale: Conserve le terme théologique habituel pour πίστις, tout en laissant la note préciser qu’il désigne ici la conviction personnelle concernant les questions discutées.
- source_word: κατὰ σεαυτὸν ἔχε
  choice: garde-la pour toi
  rationale: Rend naturellement l’exhortation à ne pas imposer aux autres sa conviction personnelle, sans suggérer qu’elle serait cachée à Dieu.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Expression française claire et traditionnelle qui maintient l’idée de présence et de responsabilité devant Dieu.
- source_word: μακάριος
  choice: Heureux
  rationale: Formule idiomatique des déclarations de béatitude en français biblique moderne, avec une portée plus large qu’un simple sentiment passager.
- source_word: κρίνων ἑαυτὸν
  choice: se condamne pas lui-même
  rationale: Dans ce contexte de conscience morale, κρίνω exprime le jugement défavorable que l’on attire sur soi; « condamner » explicite ce sens tout en signalant l’alternative plus formelle en note.
- source_word: ἐν ᾧ δοκιμάζει
  choice: par ce qu’il approuve
  rationale: Rend la valeur instrumentale ou circonstancielle de ἐν et le sens de δοκιμάζω comme approbation donnée après examen.
theological_decisions:
- issue: Sens de πίστις dans le contexte des pratiques discutées
  choice: foi comprise ici comme conviction personnelle devant Dieu
  alternative: conviction; confiance générale en Dieu; fidélité
  rationale: Le contexte immédiat traite de la conduite guidée par la conscience dans des questions disputées. Le texte principal conserve « foi », sans l’identifier exclusivement à la foi qui sauve, et la note expose la nuance contextuelle.
- issue: Portée de κρίνων ἑαυτόν
  choice: se condamner soi-même
  alternative: se juger soi-même
  rationale: Le contexte vise le verdict défavorable que la conscience fait peser sur une personne lorsqu’elle agit de manière incohérente avec ce qu’elle reconnaît comme juste. La note préserve toutefois l’étendue lexicale de κρίνω.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète le σὺ emphatique et l’adresse individuelle. La formulation distingue « pour toi » de « devant Dieu » et conserve la tension entre liberté personnelle, conscience et responsabilité envers Dieu.
