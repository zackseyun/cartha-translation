  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: fr
  text: L’un considère un jour comme plus important qu’un autre[a], tandis que l’autre considère tous les jours de la même manière[b]. Que chacun soit pleinement convaincu[c] dans son propre esprit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’un fait une distinction entre un jour et un autre. »'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « l’autre considère chaque jour » ; dans ce contraste, le sens est qu’il accorde la même considération à tous les jours.'
    reason: implicit_contextual_sense
  - marker: c
    text: 'Ou : « soit pleinement assuré » ou « soit entièrement persuadé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: considère
  rationale: Dans ce contexte, κρίνω désigne une appréciation qui établit ou non une distinction entre les jours, et non une condamnation. « Considère » exprime naturellement cette évaluation en français, tout en étant répété dans les deux membres du contraste.
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: un jour comme plus important qu’un autre
  rationale: La construction avec παρά marque ici une comparaison entre les jours. Cette formulation rend le sens comparatif sans préciser s’il s’agit de sabbats, de fêtes ou de jours de jeûne.
- source_word: πᾶσαν ἡμέραν
  choice: tous les jours de la même manière
  rationale: Le grec dit littéralement « chaque jour » ou « tout jour ». Le contexte contrastif implique que la seconde personne ne fait pas de distinction entre les jours; « de la même manière » explicite sobrement cette relation.
- source_word: ἕκαστος
  choice: chacun
  rationale: « Chacun » conserve la valeur singulière et distributive du grec et s’emploie naturellement avec une portée inclusive en français.
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: dans son propre esprit
  rationale: νοῦς désigne ici la faculté de comprendre et de juger. « Dans son propre esprit » reste proche du grec et souligne que la conviction doit être personnellement réfléchie.
- source_word: πληροφορείσθω
  choice: soit pleinement convaincu
  rationale: L’impératif présent passif exprime une conviction entière et assurée. Cette tournure est claire en français moderne et ne transforme pas la conviction personnelle en simple préférence.
theological_decisions:
- issue: Nature des jours mentionnés
  choice: Conserver la référence générale aux « jours »
  alternative: Préciser qu’il s’agit de sabbats, de fêtes juives, de jours de jeûne ou de pratiques dévotionnelles
  rationale: Paul ne précise pas quels jours sont concernés. La traduction maintient donc l’ouverture du texte sans imposer une interprétation historique ou confessionnelle.
- issue: Portée de la conviction personnelle
  choice: Rendre l’exigence d’une pleine conviction dans son propre esprit
  alternative: Paraphraser comme une permission de suivre une simple préférence personnelle
  rationale: πληροφορείσθω évoque une assurance réfléchie et entière. La formulation préserve à la fois la responsabilité individuelle et la tension du contexte communautaire, sans présenter toute préférence comme automatiquement valable.
- issue: Genre du singulier représentatif
  choice: Employer « chacun » et « son propre esprit »
  alternative: Employer une formulation explicitement masculine ou un pluriel neutralisant
  rationale: En français, « chacun » avec le possessif singulier rend naturellement la portée distributive et inclusive du masculin grammatical grec sans alourdir le texte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « considère » reflète celle de κρίνει. Aucun type particulier de jour n’est introduit. Les ajouts explicatifs nécessaires à l’intelligibilité du contraste sont signalés en note.
