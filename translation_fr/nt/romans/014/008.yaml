id: ROM.14.8
reference: Romans 14:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: fr
  text: Car, si nous vivons[a], nous vivons pour le Seigneur, et si nous mourons, nous mourons pour le Seigneur. Ainsi donc, que nous vivions ou que nous mourions, nous appartenons au Seigneur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi comprendre : « nous vivons en relation avec le Seigneur »; de même pour « nous mourons en relation avec le Seigneur ». Le datif grec peut exprimer la relation, l’orientation ou l’avantage.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « nous sommes au Seigneur » ou « nous sommes du Seigneur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: Car si
  rationale: « Car » conserve la valeur explicative de γάρ et relie le verset au raisonnement précédent. « Si » introduit naturellement en français chacune des deux éventualités exprimées par ἐάν τε.
- source_word: ζῶμεν / ζῶμεν
  choice: nous vivons / nous vivons
  rationale: La répétition rend fidèlement ζάω et préserve le parallélisme entre la condition et sa conséquence.
- source_word: τῷ κυρίῳ
  choice: c’est pour le Seigneur que
  rationale: Cette tournure française naturelle exprime l’orientation de la vie et de la mort vers le Seigneur et maintient l’insistance de la structure répétée. Une note conserve la portée plus large possible du datif grec.
- source_word: κύριος
  choice: Seigneur
  rationale: « Seigneur » conserve le titre théologiquement chargé sans préciser davantage son référent que ne le fait le texte grec.
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: nous mourons / nous mourons
  rationale: Le présent grec décrit ici l’éventualité de la mort de manière générale; le présent français est donc naturel et exact.
- source_word: οὖν
  choice: Ainsi donc
  rationale: Cette expression marque clairement la conclusion tirée des deux propositions précédentes.
- source_word: τοῦ κυρίου ἐσμέν
  choice: nous appartenons au Seigneur
  rationale: Le génitif est possessif. Cette formulation est plus naturelle en français moderne que le calque « nous sommes au Seigneur », tout en exprimant nettement l’appartenance.
theological_decisions:
- issue: Référent et portée de κύριος
  choice: Conserver le titre « Seigneur » sans ajouter « Jésus » ou « Dieu ».
  alternative: Préciser « le Seigneur Jésus » ou rendre le terme par « Maître ».
  rationale: Le contexte immédiat oriente vers le Christ, notamment au verset suivant, mais κύριος seul doit rester « Seigneur » afin de ne pas surspécifier le texte et d’en préserver les résonances théologiques.
- issue: Nuance relationnelle du datif τῷ κυρίῳ
  choice: Employer « pour le Seigneur » tout en signalant en note que le datif peut exprimer plus largement la relation ou l’orientation.
  alternative: Traduire par « en relation avec le Seigneur », « sous l’autorité du Seigneur » ou « au Seigneur ».
  rationale: « Pour le Seigneur » est idiomatique et conserve l’idée d’une existence orientée vers lui, mais la note évite de réduire le datif à la seule idée de service ou d’avantage.
- issue: Force de τοῦ κυρίου ἐσμέν
  choice: 'Exprimer explicitement l’appartenance: « nous appartenons au Seigneur ».'
  alternative: Employer le calque plus formel « nous sommes au Seigneur ».
  rationale: La construction génitive indique naturellement la possession ou l’appartenance. La formulation retenue est claire pour le lecteur moderne sans ajouter une idée étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme du grec est maintenu par la répétition de « c’est pour le Seigneur que », tandis que la conclusion emploie une formulation immédiatement compréhensible. Les deux marqueurs de note [a] et [b] figurent dans le texte principal.
