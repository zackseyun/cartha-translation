id: ROM.14.13
reference: Romans 14:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: fr
  text: Ainsi donc, ne nous jugeons plus les uns les autres ; décidez plutôt de ne pas mettre sur le chemin d’un frère[a] une pierre d’achoppement ou une occasion de chute[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur le chemin d’un frère ou d’une sœur » ; le grec emploie « frère » au singulier et désigne ici un autre croyant.
    reason: alternative_reading
  - marker: b
    text: Ou « une cause de chute » ou « un piège ». Il s’agit de ce qui risque d’entraîner l’autre à tomber dans le péché, et non simplement de ce qui blesse ses sentiments.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: Ainsi donc… ne… plus
  rationale: « Ainsi donc » marque l’inférence avec ce qui précède, tandis que « ne… plus » exprime la cessation demandée par Μηκέτι.
- source_word: ἀλλήλους κρίνωμεν
  choice: ne nous jugeons plus les uns les autres
  rationale: Le subjonctif exhortatif est rendu naturellement par « ne nous… plus ». « Juger » conserve le lien lexical avec κρίνατε dans la proposition suivante.
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: Décidez plutôt de ceci
  rationale: Le passage de « juger » autrui à « décider » de sa propre conduite restitue le jeu rhétorique sur κρίνω tout en restant idiomatique en français. « Plutôt » rend μᾶλλον.
- source_word: τὸ μὴ τιθέναι
  choice: ne pas placer
  rationale: L’infinitif exprime le contenu de la décision. « Placer » garde l’image concrète sans lourdeur.
- source_word: πρόσκομμα
  choice: une pierre d’achoppement
  rationale: Cette expression française conserve l’image d’un objet contre lequel on trébuche et son application morale ou spirituelle.
- source_word: τῷ ἀδελφῷ
  choice: devant un frère
  rationale: Le datif désigne la personne sur le chemin de laquelle l’obstacle est placé. Le singulier masculin du grec est conservé, avec une note précisant sa portée contextuelle.
- source_word: ἢ σκάνδαλον
  choice: ou un piège
  rationale: « Piège » restitue le sens ancien de σκάνδαλον comme mécanisme ou cause de chute, sans suggérer simplement une offense aux sentiments. « Ou » préserve la coordination disjonctive du grec.
theological_decisions:
- issue: Portée de ἀδελφῷ au masculin singulier
  choice: un frère
  alternative: un frère ou une sœur ; un autre croyant
  rationale: Le texte principal respecte la forme singulière masculine du grec. Dans ce contexte communautaire, le terme désigne cependant un membre de la communauté croyante sans exclure les femmes, ce que précise la note.
- issue: Sens éthique de σκάνδαλον
  choice: un piège
  alternative: une cause de chute ; un scandale
  rationale: « Piège » indique quelque chose qui entraîne autrui à tomber ou à pécher. Le français moderne « scandale » risquerait d’évoquer surtout l’indignation publique, et « offense » une simple blessure des sentiments.
- issue: Répétition de κρίνω / κρίνατε
  choice: juger… Décidez
  alternative: juger… jugez
  rationale: La variation française rend intelligible le contraste entre porter un jugement sur autrui et arrêter une ligne de conduite pour soi-même, tout en laissant perceptible le retournement rhétorique.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La ponctuation en deux phrases allège l’exhortation. « Pierre d’achoppement » conserve la métaphore biblique, tandis que « piège » évite le faux sens moderne de « scandale ».
