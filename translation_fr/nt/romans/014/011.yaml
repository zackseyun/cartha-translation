id: ROM.14.11
reference: Romans 14:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: fr
  text: 'Car il est écrit : « Aussi vrai que je suis vivant, dit le Seigneur, tout genou fléchira devant moi, et toute langue reconnaîtra publiquement Dieu[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reconnaîtra Dieu » ou « rendra gloire à Dieu ». Le verbe grec peut exprimer la confession, la reconnaissance publique ou la louange selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: il est écrit
  rationale: Formule française traditionnelle et naturelle qui introduit une citation de l’Écriture tout en conservant la valeur résultative du parfait grec.
- source_word: Ζῶ ἐγώ
  choice: Aussi vrai que je suis vivant
  rationale: Rend la force solennelle, proche du serment, de cette formule divine plus clairement que le simple « Je suis vivant ».
- source_word: κύριος
  choice: Seigneur
  rationale: Équivalent normal de κύριος; la traduction suit le texte grec sans substituer le nom divin.
- source_word: ἐμοὶ κάμψει πᾶν γόνυ
  choice: tout genou fléchira devant moi
  rationale: Expression française naturelle qui conserve l’image corporelle et exprime l’hommage ou la soumission impliqués par le datif grec.
- source_word: πᾶσα γλῶσσα
  choice: toute langue
  rationale: Conserve la métaphore biblique au lieu de la remplacer par une paraphrase telle que « toute personne ».
- source_word: ἐξομολογήσεται
  choice: reconnaîtra
  rationale: Dans ce contexte, le verbe exprime une reconnaissance publique adressée à Dieu. « Reconnaîtra » est naturel en français moderne, tandis que « confessera Dieu » est moins courant; les nuances de confession et de louange sont signalées en note.
- source_word: τῷ θεῷ
  choice: Dieu
  rationale: Avec « reconnaître », le complément français se construit directement, même si le grec emploie le datif. La référence explicite à Dieu est conservée.
theological_decisions:
- issue: Rapport entre « le Seigneur », « devant moi » et « Dieu » dans la citation
  choice: Conserver la progression « dit le Seigneur… devant moi… reconnaîtra Dieu » sans harmoniser les désignations.
  alternative: Remplacer « Dieu » par « moi », ou expliciter dans la traduction une identification christologique.
  rationale: Le texte grec passe délibérément de la parole divine à la première personne à la mention de Dieu. La traduction préserve cette forme et sa tension théologique sans imposer une conclusion interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde les images scripturaires de chaque genou et de chaque langue; « Aussi vrai que je suis vivant » restitue la solennité de la déclaration.
