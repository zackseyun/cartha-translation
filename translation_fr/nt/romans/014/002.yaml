id: ROM.14.2
reference: Romans 14:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: fr
  text: L’un croit pouvoir manger de tout[a], mais celui qui est faible[b] mange des légumes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « est convaincu de pouvoir tout manger ».'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, la faiblesse concerne la foi ou la conscience à propos des pratiques alimentaires (voir 14.1).
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: L’un
  rationale: Cette formulation naturelle introduit le premier terme du contraste corrélatif, sans préciser un genre que le contexte n’exige pas.
- source_word: πιστεύει
  choice: croit
  rationale: Avec l’infinitif qui suit, le verbe exprime ici une conviction personnelle concernant ce qu’il est permis de manger, tout en conservant le lien lexical avec le champ de la foi.
- source_word: φαγεῖν πάντα
  choice: pouvoir manger de tout
  rationale: « Manger de tout » rend naturellement l’absence de restriction alimentaire; « pouvoir » explicite en français la valeur de permission impliquée par le contexte.
- source_word: ὁ δὲ
  choice: tandis que celui qui
  rationale: Cette tournure marque clairement le second terme du contraste et préserve le parallèle entre les deux personnes.
- source_word: ἀσθενῶν
  choice: est faible
  rationale: Le participe substantivé désigne la personne caractérisée comme faible. La traduction n’ajoute pas ici « dans la foi », puisque ces mots ne figurent pas dans ce verset.
- source_word: λάχανα
  choice: des légumes
  rationale: Le terme désigne des produits cultivés du jardin; « légumes » est l’équivalent moderne le plus clair et le moins étroit.
- source_word: ἐσθίει
  choice: mange
  rationale: Le verbe est rendu sans ajouter « seulement », car l’exclusivité est suggérée par le contraste mais n’est pas exprimée explicitement en grec.
theological_decisions:
- issue: Nature de la faiblesse exprimée par ἀσθενῶν
  choice: « celui qui est faible », sans complément dans le corps du texte
  alternative: « celui dont la foi est faible » ou « celui qui est faible dans la foi »
  rationale: Romains 14.1 situe cette faiblesse dans le domaine de la foi ou de la conscience face aux pratiques alimentaires, mais le verset 2 dit simplement « celui qui est faible ». La formulation retenue préserve cette concision et laisse le contexte préciser la catégorie.
- issue: Portée de πιστεύει φαγεῖν πάντα
  choice: « croit pouvoir manger de tout »
  alternative: « est convaincu de pouvoir tout manger »
  rationale: Le texte décrit une conviction quant à la liberté alimentaire, non une affirmation générale sur la foi salvatrice. « Croit pouvoir » reste proche du grec tout en étant idiomatique.
translation_notes:
  register: Français international moderne, simple et digne. Le contraste est formulé naturellement; aucune restriction exclusive n’est ajoutée à « mange des légumes », et le sens contextuel de la faiblesse est expliqué en note plutôt qu’inséré dans le verset.
