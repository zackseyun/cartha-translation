id: ROM.14.10
reference: Romans 14:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: fr
  text: Mais toi, pourquoi juges-tu ton frère[b] ? Ou toi aussi, pourquoi méprises-tu ton frère ? En effet, nous comparaîtrons tous devant le tribunal de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « le tribunal du Christ ».'
    reason: textual_variant
  - marker: b
    text: 'Ou « ton frère ou ta sœur » ; grec : « ton frère ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δὲ
  choice: Mais toi
  rationale: Rend à la fois la valeur adversative de δέ et l’insistance produite par le pronom σύ placé en tête.
- source_word: τί κρίνεις
  choice: pourquoi juges-tu
  rationale: Dans cette question rhétorique, τί se rend naturellement par « pourquoi » ; « juger » conserve la portée de κρίνω sans préciser indûment « condamner ».
- source_word: τὸν ἀδελφόν σου
  choice: ton frère
  rationale: Conserve le masculin singulier du grec ; une note indique que, dans ce contexte communautaire, le terme peut désigner un frère ou une sœur dans la foi.
- source_word: ἢ καὶ σὺ
  choice: Et toi
  rationale: En français, « Et toi » exprime naturellement le contraste entre les deux attitudes blâmées et maintient l’insistance sur le second interlocuteur ; traduire littéralement ἤ par « ou » serait ici moins idiomatique.
- source_word: τί ἐξουθενεῖς
  choice: pourquoi méprises-tu
  rationale: « Mépriser » exprime avec concision l’idée de considérer quelqu’un comme sans valeur ou de le traiter avec dédain.
- source_word: πάντες γὰρ
  choice: En effet, nous… tous
  rationale: « En effet » rend la fonction explicative de γάρ, tandis que « nous… tous » explicite correctement que Paul s’inclut avec ses destinataires.
- source_word: παραστησόμεθα
  choice: nous comparaîtrons
  rationale: Dans le cadre judiciaire créé par βῆμα, « comparaître » est naturel en français et exprime le fait de se présenter devant un tribunal.
- source_word: τῷ βήματι
  choice: devant le tribunal
  rationale: βῆμα désigne ici le siège judiciaire et, par extension, le tribunal ; « devant le tribunal » restitue clairement l’image juridique en français courant.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Traduit directement le génitif de la leçon du SBLGNT.
theological_decisions:
- issue: Identité de celui devant le tribunal duquel tous comparaîtront
  choice: de Dieu
  alternative: du Christ
  rationale: Le texte grec fourni porte τοῦ θεοῦ. La variante « du Christ », attestée dans certains manuscrits, est signalée en note plutôt que substituée au texte ou harmonisée avec 2 Corinthiens 5.10.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier préserve l’interpellation personnelle répétée du grec. La formulation conserve les deux reproches parallèles et l’image judiciaire sans ajouter d’interprétation confessionnelle.
