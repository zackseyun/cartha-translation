id: ROM.14.18
reference: Romans 14:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: fr
  text: En effet, celui qui sert le Christ de cette manière est agréable à Dieu et approuvé par les hommes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: de cette manière
  rationale: Dans le contexte, l’expression renvoie à la manière de servir décrite au verset précédent; cette formulation française conserve cette référence sans la préciser davantage.
- source_word: δουλεύων
  choice: sert
  rationale: Le verbe exprime le service rendu au Christ, avec l’idée de lui appartenir comme serviteur; «sert» est naturel et fidèle dans ce contexte.
- source_word: τῷ Χριστῷ
  choice: le Christ
  rationale: «Christ» rend le titre grec Χριστός de manière consacrée et immédiatement compréhensible en français.
- source_word: εὐάρεστος
  choice: agréable
  rationale: Le terme signifie que ce service reçoit la faveur ou l’approbation de Dieu; «agréable à Dieu» est une expression française claire et traditionnelle.
- source_word: δόκιμος
  choice: estimé
  rationale: Le mot désigne quelqu’un qui a fait ses preuves et reçoit l’approbation. «Estimé» exprime naturellement ici la reconnaissance humaine sans suggérer une approbation absolue de chaque personne.
- source_word: τοῖς ἀνθρώποις
  choice: des hommes
  rationale: Le pluriel générique ἄνθρωποι désigne les êtres humains en général. «Des hommes» maintient la formulation collective et digne du texte.
theological_decisions:
- issue: Portée de l’expression ἐν τούτῳ
  choice: «de cette manière», renvoyant au service conforme au règne de Dieu décrit dans le contexte
  alternative: «en cela» ou «dans ces choses»
  rationale: Le singulier τούτῳ est textuellement retenu et peut viser la manière de vivre exposée au verset 17. La traduction préserve ce renvoi contextuel sans imposer une liste précise.
- issue: Nature de l’approbation humaine
  choice: «estimé des hommes»
  alternative: «approuvé par les hommes»
  rationale: δόκιμος peut évoquer une personne éprouvée et reconnue. «Estimé» évite de faire de l’opinion humaine un verdict théologique tout en conservant le contraste avec ce qui est agréable à Dieu.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve le parallélisme entre l’accueil favorable de Dieu et la reconnaissance humaine, sans ajouter d’explication doctrinale.
