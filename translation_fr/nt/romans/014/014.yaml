  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: fr
  text: 'Je sais, et je suis convaincu dans le Seigneur Jésus, que rien n’est impur en soi ; sauf pour la personne qui considère quelque chose comme impur[a] : pour elle, cela est impur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « commun ». Le mot grec peut aussi évoquer ce qui est considéré comme profane ou rituellement souillé.
    reason: 'Alternative lexicale : κοινός signifie littéralement « commun » et, dans ce contexte, renvoie à ce qui est tenu pour rituellement impur ou profane.'
lexical_decisions:
- source_word: οἶδα
  choice: Je sais
  rationale: Équivalent direct et naturel du verbe exprimant ici une connaissance assurée.
- source_word: πέπεισμαι
  choice: je suis convaincu
  rationale: Le parfait exprime une conviction acquise et durable; cette tournure est naturelle en français moderne.
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: dans le Seigneur Jésus
  rationale: Conserve la préposition et l’ambiguïté relationnelle du grec sans préciser indûment «par» ou «en union avec».
- source_word: κοινόν
  choice: impur
  rationale: Dans le contexte des aliments et de la pureté, le terme désigne ce qui est tenu pour profane ou rituellement souillé, et non simplement ce qui est ordinaire ou partagé.
- source_word: δι’ ἑαυτοῦ
  choice: en soi
  rationale: Expression française idiomatique indiquant qu’une chose n’est pas intrinsèquement impure.
- source_word: τῷ λογιζομένῳ
  choice: si quelqu’un considère
  rationale: Rend le jugement personnel exprimé par λογίζομαι dans une syntaxe française claire.
- source_word: τι
  choice: une chose
  rationale: L’indéfini convient à l’énoncé général et évite une formulation française pesante.
- source_word: ἐκείνῳ κοινόν
  choice: alors, pour cette personne, elle est impure
  rationale: Restitue l’application personnelle marquée par le datif tout en évitant une restriction masculine inutile.
theological_decisions:
- issue: Sens de κοινός dans le cadre des aliments et de la pureté
  choice: «impur», sans attribuer d’impureté intrinsèque à la chose
  alternative: «commun» ou «profane»
  rationale: Paul oppose explicitement l’absence d’impureté en soi au jugement de conscience d’une personne. «Impur» communique clairement ce cadre en français moderne, tandis que la note conserve le sens plus littéral et culturel du terme.
- issue: Portée de ἐν κυρίῳ Ἰησοῦ
  choice: «dans le Seigneur Jésus»
  alternative: «par le Seigneur Jésus»
  rationale: La traduction formelle préserve la tension entre conviction fondée sur le Seigneur et conviction vécue dans la relation avec lui, sans choisir un rapport causal non explicite.
translation_notes:
  register: Français international moderne, clair et digne. La coordination initiale et la répétition finale conservent l’assurance puis l’application individualisée du grec; «Mais» rend εἰ μή selon sa valeur exceptive et corrective dans ce contexte.
