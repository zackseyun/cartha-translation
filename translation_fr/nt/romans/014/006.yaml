  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: fr
  text: Celui qui observe le jour[a] l’observe pour le Seigneur. Celui qui mange mange pour le Seigneur, car il rend grâce à Dieu ; et celui qui ne mange pas ne mange pas pour le Seigneur, et il rend grâce à Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tient compte du jour » ou « porte son attention sur le jour » ; le verbe grec peut exprimer le fait de fixer sa pensée sur quelque chose ou d’y avoir égard. Ici, il désigne probablement l’observance ou l’importance pratique accordée à un jour.
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: accorde de l’importance à / le fait
  rationale: Dans ce contexte, φρονέω exprime le fait d’avoir égard à un jour et de lui accorder une importance pratique. La seconde occurrence est rendue naturellement par « le fait », qui reprend l’action sans lourdeur.
- source_word: τὴν ἡμέραν
  choice: ce jour
  rationale: L’article grec désigne le jour dont il est question dans le contexte. « Ce jour » est naturel en français et n’identifie pas indûment un sabbat, une fête ou un jour de jeûne.
- source_word: κυρίῳ
  choice: pour le Seigneur
  rationale: Le datif indique ici l’orientation de la pratique vers le Seigneur ou son accomplissement en son honneur. « Pour le Seigneur » préserve ce sens dans un français courant.
- source_word: ἐσθίων / ἐσθίει
  choice: celui qui mange / mange
  rationale: Le présent décrit une pratique habituelle dans le débat relatif aux aliments. Le présent simple français conserve directement ce caractère général.
- source_word: εὐχαριστεῖ
  choice: remercie
  rationale: « Remercier Dieu » exprime naturellement en français l’acte explicite d’action de grâce indiqué par le verbe grec.
- source_word: τῷ θεῷ
  choice: Dieu
  rationale: En français, le complément direct de « remercier » rend naturellement le destinataire exprimé par le datif grec.
- source_word: ὁ μὴ ἐσθίων
  choice: celui qui ne mange pas
  rationale: Cette formulation reproduit clairement la construction négative grecque et maintient le parallélisme avec « celui qui mange ».
theological_decisions:
- issue: Sens de l’attention accordée à « ce jour »
  choice: Référence générale au fait d’accorder une importance particulière à un jour dans la pratique discutée en Romains 14.
  alternative: Référence précise au sabbat, à une fête juive ou à un jour de jeûne.
  rationale: Le texte reste général et ne précise pas de quel jour il s’agit ; la traduction conserve donc cette ouverture sans imposer une identification confessionnelle ou historique.
- issue: Référent de κύριος
  choice: le Seigneur
  alternative: Dieu
  rationale: Dans ce contexte paulinien, κύριος renvoie très probablement au Seigneur Jésus, tandis que l’action de grâce est explicitement adressée à Dieu. La traduction maintient la distinction lexicale du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme du grec est conservé, tout en évitant une répétition française trop pesante de « accorde de l’importance ». Le texte ne précise ni la nature du jour ni celle des aliments concernés.
