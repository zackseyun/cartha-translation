review_pass:
  verdict: revise
  source_fidelity: 'Révision nécessaire : la dernière proposition du projet (« celui qui ne mange pas le fait pour le Seigneur ») inverse la négation du grec. Le texte dit explicitement que celui qui ne mange pas ne mange pas pour le Seigneur. La révision rétablit aussi le parallélisme formel des verbes sans ajouter « le fait ».'
  naturalness: '« Observer le jour » est une formulation française naturelle et concise dans ce contexte, tout en restant suffisamment générale. La répétition de « mange » et « ne mange pas » est voulue : elle reproduit le parallélisme argumentatif du grec et demeure fluide en français moderne.'
  terminology: « Le Seigneur » conserve κύριος, distinct de « Dieu » (θεῷ). « Rend grâce à Dieu » est un équivalent français idiomatique et légèrement plus précis de εὐχαριστεῖ que « remercie Dieu », sans modifier le sens. La note préserve les possibilités sémantiques de φρονέω sans identifier le jour à une observance particulière.
  issues:
