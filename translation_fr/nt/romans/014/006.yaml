    issue: La négation de la dernière proposition est omise.
    rationale: ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει signifie littéralement « celui qui ne mange pas ne mange pas pour le Seigneur ». Le projet dit au contraire qu'il « le fait pour le Seigneur », ce qui contredit οὐκ ἐσθίει et altère le sens du verset.
  - severity: low
    issue: « Ce jour » est plus démonstratif que nécessaire.
    rationale: τὴν ἡμέραν emploie l'article défini. « Le jour » préserve plus directement cette référence contextuelle sans désigner de jour particulier.
  revised_text: Celui qui observe le jour[a] l’observe pour le Seigneur. Celui qui mange mange pour le Seigneur, car il rend grâce à Dieu ; et celui qui ne mange pas ne mange pas pour le Seigneur, et il rend grâce à Dieu.
