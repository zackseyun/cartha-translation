revisions:
- from: Celui qui accorde de l’importance à ce jour[a] le fait pour le Seigneur. Celui qui mange le fait pour le Seigneur, car il remercie Dieu ; et celui qui ne mange pas le fait pour le Seigneur, et il remercie Dieu.
  to: Celui qui observe le jour[a] l’observe pour le Seigneur. Celui qui mange mange pour le Seigneur, car il rend grâce à Dieu ; et celui qui ne mange pas ne mange pas pour le Seigneur, et il rend grâce à Dieu.
  rationale: 'La révision corrige l’omission déterminante de la négation dans la seconde moitié du verset. Elle conserve l''ambiguïté du « jour » et la distinction entre le Seigneur et Dieu, tout en suivant plus étroitement le parallélisme grec : « observe / observe », « mange / mange », « ne mange pas / ne mange pas ».'
