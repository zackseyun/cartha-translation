id: ROM.14.23
reference: Romans 14:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: fr
  text: Mais celui qui doute est condamné s’il mange[a], parce qu’il n’agit pas par la foi ; or tout ce qui ne vient pas de la foi est péché.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parce que son acte ne procède pas d’une conviction assurée ». Le grec dit littéralement « par la foi » ; dans ce contexte, l’expression peut inclure le fait d’agir avec une conviction ferme devant Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: celui qui doute
  rationale: Dans ce contexte de scrupules alimentaires, le participe désigne une hésitation intérieure plutôt qu’une dispute avec autrui. Cette formulation est naturelle et conserve l’idée d’une conscience partagée.
- source_word: ἐὰν φάγῃ
  choice: s’il mange
  rationale: La construction avec ἐάν et le subjonctif exprime une éventualité conditionnelle, rendue naturellement en français par « s’il mange ».
- source_word: κατακέκριται
  choice: est condamné
  rationale: Le parfait passif présente un état de condamnation résultant de l’acte. Le passif est conservé sans préciser un agent que le grec ne nomme pas.
- source_word: ὅτι οὐκ ἐκ πίστεως
  choice: parce qu’il n’agit pas par la foi
  rationale: Le grec dit littéralement « parce que ce n’est pas à partir de la foi ». L’ajout minimal du verbe « agit » explicite en français que l’acte de manger ne procède pas de la foi, sans réduire πίστις à la seule conviction subjective.
- source_word: πᾶν ... ὃ
  choice: tout ce qui
  rationale: Cette tournure française rend naturellement la construction neutre et sa portée générale.
- source_word: ἁμαρτία ἐστίν
  choice: est péché
  rationale: La construction nominale et la force catégorique de l’énoncé sont préservées, plutôt que d’employer l’adjectif plus atténué « est mauvais » ou « est pécheur ».
theological_decisions:
- issue: Sens de πίστις dans ce contexte moral paulinien
  choice: foi
  alternative: conviction, confiance
  rationale: « Foi » préserve le vocabulaire théologique de Paul et la formulation grecque ἐκ πίστεως. Le contexte comprend aussi l’idée d’une conviction assurée devant Dieu ; cette nuance est signalée en note sans enfermer le mot dans un sens seulement subjectif.
- issue: Portée de la condamnation dans κατακέκριται
  choice: est condamné
  alternative: se condamne lui-même ; est condamné devant Dieu
  rationale: Le passif grec ne nomme pas l’agent. La traduction ne tranche donc pas entre le jugement de Dieu, celui de la conscience, ou leur relation.
- issue: Portée de « tout ce qui ne vient pas de la foi »
  choice: énoncé général conservé
  alternative: restriction explicite aux seuls choix alimentaires discutés dans le contexte
  rationale: La phrase grecque est formulée de manière générale, bien qu’elle découle du cas concret de l’alimentation. La traduction conserve cette tension sans ajouter de limitation absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Or » marque avec sobriété la transition vers la maxime générale. La formulation évite à la fois le calque opaque et une paraphrase qui réduirait « foi » à « conviction ».
