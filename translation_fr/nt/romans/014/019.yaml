source:
  edition: SBLGNT
  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: fr
  text: Ainsi donc[a], recherchons ce qui contribue à la paix et à l’édification mutuelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « les choses de la paix et celles de l’édification mutuelle ».'
    reason: Alternative lexicale reflétant la structure grecque répétée τὰ τῆς… καὶ τὰ τῆς…
lexical_decisions:
- source_word: ἄρα οὖν
  choice: Ainsi donc
  rationale: Les deux particules introduisent ensemble une conclusion tirée du raisonnement précédent. « Ainsi donc » en conserve la force déductive dans un français naturel et soutenu.
- source_word: τὰ τῆς εἰρήνης
  choice: ce qui contribue à la paix
  rationale: Le pluriel neutre substantivé suivi du génitif désigne ce qui relève de la paix ou la favorise. Cette formulation idiomatique exprime clairement l'idée sans calquer lourdement « les choses de la paix ».
- source_word: διώκωμεν
  choice: recherchons
  rationale: Le subjonctif présent a ici une valeur d'exhortation collective et appelle une démarche continue. « Recherchons » est naturel en français et exprime une poursuite résolue.
- source_word: τὰ τῆς οἰκοδομῆς
  choice: ce qui … édifie
  rationale: οἰκοδομή évoque littéralement la construction, mais désigne ici métaphoriquement le développement et l'affermissement de la communauté. « Édifie » conserve cette métaphore biblique tout en restant compréhensible.
- source_word: τῆς εἰς ἀλλήλους
  choice: nous … les uns les autres
  rationale: La construction exprime une édification orientée réciproquement vers les membres de la communauté. L'ajout idiomatique de « nous » rend explicite en français que les croyants s'édifient mutuellement, sans modifier la portée du grec.
theological_decisions:
- issue: Portée de l'édification communautaire
  choice: Une exhortation collective à rechercher la paix et l'édification mutuelle au sein de la communauté.
  alternative: Une exhortation centrée uniquement sur le progrès moral individuel.
  rationale: Le subjonctif exhortatif à la première personne du pluriel et le pronom réciproque ἀλλήλους indiquent une action communautaire et mutuelle. La traduction préserve cette orientation sans préciser davantage la nature de l'édification.
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase privilégie une équivalence optimale : elle conserve la conclusion logique, l''exhortation collective, le parallélisme sémantique entre paix et édification, ainsi que la réciprocité.'
