  source_fidelity: Le projet rend correctement l’inférence de ἄρα οὖν, l’exhortation collective de διώκωμεν et l’orientation vers la paix. Toutefois, « ce qui nous édifie les uns les autres » ne rend pas idiomatiquement ni clairement l’édification réciproque exprimée par τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
  naturalness: « Ce qui nous édifie les uns les autres » est syntaxiquement maladroit et peut se comprendre comme si « les uns les autres » était le complément direct d’« édifie ». « L’édification mutuelle » est naturel, clair et conserve la réciprocité.
  terminology: « Paix », « recherchons » et « édification » conviennent au registre biblique moderne. « Édification mutuelle » préserve le terme métaphorique sans imposer d’interprétation confessionnelle.
