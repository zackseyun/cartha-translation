id: ROM.14.15
reference: Romans 14:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: fr
  text: Car si ton frère[a] est attristé à cause d’un aliment, tu ne marches plus selon l’amour. Ne détruis pas[b], par ce que tu manges, celui pour qui le Messie[c] est mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ton frère ou ta sœur » : en grec, « frère » peut désigner de manière représentative un autre croyant.'
    reason: lexical_alternative
  - marker: b
    text: Ou « ne cause pas sa ruine » ou « ne le fais pas périr ». Le verbe grec est fort et peut désigner un grave dommage spirituel ; le verset ne précise pas la portée doctrinale exacte de cette destruction.
    reason: alternative_reading
  - marker: c
    text: Grec « Christ » ; le terme est rendu ici par « le Messie » parce que Χριστός fonctionne comme un titre.
    reason: lexical_alternative
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: un aliment / par ce que tu manges
  rationale: βρῶμα désigne la nourriture en général, sans se limiter à la viande. « Un aliment » convient dans la première proposition; « par ce que tu manges » exprime naturellement en français le moyen ou l’occasion indiqué par le datif τῷ βρώματί σου.
- source_word: ἀδελφός
  choice: frère
  rationale: Le grec porte un masculin singulier. « Frère » le reproduit directement, tandis qu’une note précise que le mot peut représenter tout membre de la communauté croyante.
- source_word: λυπεῖται
  choice: est attristé
  rationale: Le verbe exprime la peine ou l’affliction causée à quelqu’un. « Est attristé » conserve cette portée affective sans préciser indûment la nature du tort.
- source_word: κατὰ ἀγάπην
  choice: selon l’amour
  rationale: Cette formulation suit de près κατὰ et présente l’amour comme la norme de conduite, sans atténuer le lien explicite avec ἀγάπη.
- source_word: περιπατεῖς
  choice: tu marches
  rationale: Le choix conserve la métaphore éthique paulinienne de la marche plutôt que de la réduire simplement à « vivre » ou « se conduire ».
- source_word: ἀπόλλυε
  choice: ne détruis pas
  rationale: ἀπόλλυμι est un verbe fort pouvant évoquer la destruction, la perte ou la ruine. « Ne détruis pas » en maintient la gravité sans trancher la nature exacte ni la portée ultime de cette destruction.
- source_word: ὑπὲρ οὗ
  choice: pour qui
  rationale: Avec le génitif, ὑπέρ signifie ici « pour » ou « en faveur de ». « Pour qui » est naturel et conserve la portée représentative et sacrificielle.
- source_word: Χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre. « Le Messie » en rend le sens de façon transparente en français moderne.
- source_word: ἀπέθανεν
  choice: est mort
  rationale: Le verbe aoriste désigne directement la mort du Messie; « est mort » est la formulation française naturelle.
- source_word: ἐκεῖνον
  choice: celui
  rationale: Le démonstratif attire l’attention sur la personne concernée. « Celui » préserve cette mise en relief dans une construction française naturelle.
- source_word: εἰ γὰρ
  choice: Car si
  rationale: « Car » maintient le lien explicatif avec l’argument précédent et « si » conserve la forme conditionnelle du grec.
theological_decisions:
- issue: Portée de ἀπόλλυε pour le croyant considéré comme faible
  choice: Ne détruis pas
  alternative: Ne cause pas sa ruine / Ne le fais pas périr
  rationale: Le verbe impose un avertissement grave, mais le verset ne précise pas s’il s’agit d’une ruine spirituelle temporelle ou de la perdition finale. La traduction conserve cette tension sans imposer une doctrine de l’apostasie ou de la sécurité du salut.
- issue: Référent de ἀδελφός
  choice: frère dans le texte principal
  alternative: frère ou sœur / autre croyant
  rationale: La forme grecque est masculine singulière. Le texte principal la respecte, tandis que la note signale son possible emploi représentatif dans la communauté.
- issue: Rendu du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme est ici un titre théologique. « Le Messie » en communique directement le sens sans le traiter comme un simple nom propre.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore paulinienne de la marche est conservée. « Par ce que tu manges » évite le tour peu naturel « avec ta nourriture » tout en exprimant le moyen ou l’occasion. Les notes maintiennent les ambiguïtés lexicales et théologiques pertinentes.
