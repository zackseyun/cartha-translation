id: ROM.14.20
reference: Romans 14:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: fr
  text: Ne détruis pas l’œuvre de Dieu pour une question de nourriture. Tout est certes pur[a], mais il est mal de manger d’une manière qui fait trébucher quelqu’un[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dans le contexte, « tout » désigne avant tout les aliments; on pourrait traduire : « Tous les aliments sont certes purs. »'
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « pour la personne qui mange par une occasion de chute ». L’expression peut désigner une manière de manger qui devient une occasion de chute pour autrui.
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: pour une question de nourriture
  rationale: ἕνεκεν avec le génitif indique ici le motif. Cette tournure française naturelle souligne qu’une question de nourriture ne doit pas devenir la cause d’un dommage spirituel.
- source_word: κατάλυε
  choice: ne détruis pas
  rationale: L’impératif présent précédé de μή exprime une interdiction. « Détruire » conserve la force de κατάλυε et son contraste avec l’œuvre accomplie par Dieu.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: l’œuvre de Dieu
  rationale: La formulation garde l’ampleur du génitif grec sans préciser abusivement si l’œuvre désigne le croyant, la communauté ou l’action divine parmi eux.
- source_word: πάντα μὲν καθαρά
  choice: Tout est certes pur
  rationale: « Tout » préserve la portée formellement large de πάντα, tandis que le contexte l’applique à la nourriture. « Pur » maintient le vocabulaire de pureté de καθαρά, et « certes » rend légèrement μέν.
- source_word: κακὸν
  choice: il est mal
  rationale: Dans cette construction impersonnelle, « il est mal de » exprime naturellement en français le jugement moral porté par κακόν sans le réduire à une simple inopportunité.
- source_word: τῷ ἀνθρώπῳ τῷ ... ἐσθίοντι
  choice: de manger
  rationale: La restructuration impersonnelle est idiomatique en français et conserve la portée générale de ἄνθρωπος sans introduire une distinction de sexe absente de l’intention référentielle.
- source_word: διὰ προσκόμματος
  choice: d’une manière qui fait trébucher quelqu’un
  rationale: La tournure conserve l’image de la chute associée à πρόσκομμα et explicite naturellement l’effet de cette manière de manger sur autrui.
theological_decisions:
- issue: Portée de l’affirmation « tout est pur » dans le contexte des aliments
  choice: Conserver « Tout est certes pur » dans le texte principal.
  alternative: « Tous les aliments sont certes purs. »
  rationale: Le grec emploie πάντα sans nom explicite. Le contexte porte nettement sur la nourriture, mais la traduction principale préserve la formulation large et le langage de pureté sans transformer l’implicite en explicite.
- issue: Sens de διὰ προσκόμματος
  choice: Comprendre l’expression comme une manière de manger qui fait trébucher autrui.
  alternative: « mais manger malgré un obstacle de conscience est mal pour la personne »
  rationale: La construction grecque permet une certaine tension entre le fait de manger au moyen d’une occasion de chute et celui de manger de façon à causer une chute. Le contexte de Romains 14 favorise l’effet produit sur autrui, tout en justifiant une note signalant l’ambiguïté.
- issue: Valeur représentative de ἄνθρωπος
  choice: 'Employer une construction générale et naturelle : « il est mal de manger ».'
  alternative: « mais c’est un mal pour l’homme qui mange »
  rationale: ἄνθρωπος désigne ici toute personne concernée, non spécifiquement un homme. La formulation française générale transmet cette portée sans surinterprétation anthropologique.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase évite le calque lourd « à cause d’un aliment » et privilégie une formulation immédiatement compréhensible. « Fait trébucher » conserve l’image paulinienne traditionnelle tout en explicitant que la conduite peut entraîner la chute d’autrui.
