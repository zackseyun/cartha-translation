  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: fr
  text: Et je sais que, lorsque je viendrai chez vous, je viendrai dans la plénitude de la bénédiction du Messie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: je sais
  rationale: Rend directement l’affirmation assurée de Paul, sans l’atténuer en simple conviction.
- source_word: δὲ
  choice: Et
  rationale: Marque ici une transition légère dans le discours plutôt qu’une opposition forte.
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: lorsque je viendrai chez vous
  rationale: Le participe a une valeur temporelle par rapport au futur ἐλεύσομαι; « chez vous » est naturel en français pour une visite aux destinataires.
- source_word: ἐλεύσομαι
  choice: je viendrai
  rationale: Traduction directe du futur de ἔρχομαι.
- source_word: ἐν πληρώματι
  choice: dans la plénitude
  rationale: Conserve l’image d’abondance et d’accomplissement portée par πλήρωμα.
- source_word: εὐλογίας
  choice: de la bénédiction
  rationale: Le génitif précise la réalité dont la plénitude est constituée ou caractérisée.
- source_word: Χριστοῦ
  choice: du Messie
  rationale: Χριστός conserve ici sa valeur de titre; « Messie » en exprime le sens en français.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le grec emploie le titre Χριστός. « Messie » en préserve explicitement le sens sans introduire d’interprétation confessionnelle supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « je viendrai » est maintenue parce qu’elle reflète la structure et l’insistance du grec. Aucun marqueur de note n’est requis, puisque la variante signalée dans la couche anglaise concerne un choix de traduction plutôt qu’une ambiguïté textuelle du verset fourni.
