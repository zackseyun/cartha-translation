  terminology: « Comblé de votre présence » rend de façon idiomatique l’image de plénitude de ἐμπλησθῶ sans imposer une lecture confessionnelle. « En partie » conserve l’ambiguïté de ἀπὸ μέρους quant au degré ou au caractère limité de la satisfaction.
