source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: fr
  text: Quand je me rendrai en Espagne, j’espère en effet vous voir en passant et être aidé par vous à poursuivre mon voyage jusque-là[a], si j’ai d’abord été en partie comblé de votre présence[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « être envoyé en avant par vous jusque-là » ou « être accompagné jusque-là par vous ». Le verbe grec peut évoquer diverses formes d’aide permettant à un voyageur de poursuivre sa route.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « si d’abord j’ai été rempli de vous, en partie ». L’expression évoque la satisfaction de leur présence, tout en laissant ouverte la nuance exacte de « en partie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι εἰς τὴν Σπανίαν
  choice: quand je me rendrai en Espagne
  rationale: ὡς ἄν avec le subjonctif situe le déplacement dans un avenir encore indéterminé. En français courant, « quand je me rendrai » garde cette orientation future sans suggérer des voyages répétés, comme pourrait le faire « chaque fois que ».
- source_word: ἐλπίζω γὰρ
  choice: J’espère en effet
  rationale: « En effet » rend la valeur explicative de γάρ, tandis que « j’espère » exprime l’attente désirée portée par ἐλπίζω.
- source_word: διαπορευόμενος
  choice: en passant
  rationale: Cette formulation concise et naturelle indique que Rome se trouve sur l’itinéraire vers une autre destination.
- source_word: θεάσασθαι ὑμᾶς
  choice: vous voir
  rationale: La traduction directe conserve l’idée d’une rencontre personnelle sans renforcer le verbe en « vous rendre visite ».
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: que vous m’aiderez à poursuivre mon voyage jusque-là
  rationale: προπέμπω peut désigner le fait d’accompagner, d’équiper ou d’aider quelqu’un à continuer sa route. Cette formulation préserve l’idée générale de soutien sans en préciser abusivement la forme.
- source_word: ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ
  choice: après que j’aurai d’abord, au moins en partie, goûté la joie d’être avec vous
  rationale: Le tour français exprime la condition préalable envisagée par ἐάν et restitue de manière naturelle la métaphore de plénitude impliquée par ἐμπλησθῶ. « Au moins en partie » maintient la limitation de ἀπὸ μέρους sans décider si elle concerne surtout la durée ou le degré de satisfaction.
theological_decisions:
- issue: Nature de l’aide attendue des croyants de Rome
  choice: « que vous m’aiderez à poursuivre mon voyage jusque-là »
  alternative: « que vous me ferez accompagner jusque-là »
  rationale: Le verbe peut inclure accompagnement, provisions ou autre soutien pratique, mais le texte n’en précise pas la forme. La traduction laisse cette portée ouverte.
- issue: Sens de la plénitude espérée auprès des Romains
  choice: « au moins en partie, goûté la joie d’être avec vous »
  alternative: « me serai en partie rassasié de votre présence »
  rationale: La solution retenue communique l’épanouissement relationnel suggéré par ἐμπλησθῶ sans employer en français une image de rassasiement qui pourrait paraître étrange ou négative. La limitation demeure explicitement marquée.
translation_notes:
  register: Français international moderne, fluide et digne. La phrase conserve le mouvement syntaxique inachevé du texte grec au moyen du tiret final. Les formulations évitent de préciser la nature du soutien missionnaire et gardent ouverte la nuance exacte de ἀπὸ μέρους.
