  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: fr
  text: C’est aussi pour cela que j’ai souvent été empêché de venir chez vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bien des fois » ou « à maintes reprises » ; l’expression grecque indique une répétition fréquente.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Exprime naturellement en français la conséquence tirée de l’argument précédent.
- source_word: καὶ
  choice: non traduit séparément
  rationale: Dans ce contexte, la valeur additive est suffisamment portée par l’enchaînement logique; traduire par « aussi » alourdirait ou rendrait la phrase ambiguë en français.
- source_word: ἐνεκοπτόμην
  choice: j’ai été empêché
  rationale: Rend l’idée d’un obstacle sans préciser son agent; avec « souvent », le passé composé exprime naturellement les empêchements répétés.
- source_word: τὰ πολλὰ
  choice: souvent
  rationale: Cette expression adverbiale idiomatique indique ici la répétition fréquente.
- source_word: τοῦ ἐλθεῖν
  choice: de venir
  rationale: Après « empêcher », l’infinitif français précédé de « de » rend directement l’action entravée.
- source_word: πρὸς ὑμᾶς
  choice: chez vous
  rationale: Avec un verbe de mouvement, « venir chez vous » désigne naturellement le déplacement de Paul auprès des croyants de Rome.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le lien logique avec le contexte et ne précise pas la cause des empêchements.
