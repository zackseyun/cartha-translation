review_pass:
  verdict: revise
  source_fidelity: 'La structure essentielle est bien rendue : obligation morale, contraste entre les forts et les faibles, image de « porter », et refus de l’autosatisfaction. Toutefois, « ceux qui ne le sont pas » affaiblit la désignation explicite τῶν ἀδυνάτων (« des faibles »), et « au lieu de » reformule la coordination négative καὶ μὴ de manière moins directe.'
  naturalness: La phrase est naturelle en français moderne. « Ne pas chercher à nous plaire à nous-mêmes » est plus direct, plus concis et plus proche du grec que « au lieu de chercher à nous faire plaisir à nous-mêmes ».
  terminology: « Forts », « faibles », « faiblesses » et « porter » préservent le réseau lexical et métaphorique du texte ainsi que son contexte de conscience en Romains 14. La note conserve avec justesse l’alternative « défaillances » sans l’imposer dans le texte.
  issues:
  - severity: medium
    issue: « ceux qui ne le sont pas » ne rend pas explicitement « les faibles »
    rationale: τῶν ἀδυνάτων désigne directement « les faibles » en contraste avec οἱ δυνατοί. La périphrase française est compréhensible, mais elle atténue le parallélisme lexical et peut se lire comme une simple absence de force plutôt que comme le groupe contextuel désigné par Paul.
  - severity: low
    issue: « au lieu de » remplace la coordination négative par une opposition reformulée
    rationale: 'καὶ μὴ coordonne deux infinitifs : porter les faiblesses et ne pas se plaire à soi-même. « Et ne pas » reproduit plus exactement cette construction, sans ajouter une relation comparative explicite.'
