id: ROM.15.1
reference: Romans 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: fr
  text: Nous qui sommes forts, nous devons porter les faiblesses des faibles[a] et ne pas chercher à nous plaire à nous-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les défaillances des faibles ». Le terme grec peut désigner des faiblesses, des limites ou des défaillances ; ici, il renvoie probablement aux scrupules ou aux limites de conscience dont il est question au chapitre précédent.
    reason: Alternative lexicale et clarification contextuelle de ἀσθενήματα et τῶν ἀδυνάτων.
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: nous devons
  rationale: Exprime clairement l’obligation morale portée par l’indicatif grec, dans un français naturel, sans transformer la phrase en impératif direct.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Particule de transition légère; en français, l’enchaînement avec le contexte reste naturel sans connecteur ajouté. « Mais » suggérerait un contraste trop marqué.
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: nous qui sommes forts
  rationale: Conserve l’insistance du pronom et le contraste contextuel entre les forts et les faibles, ici en matière de conscience.
- source_word: τὰ ἀσθενήματα
  choice: les faiblesses
  rationale: Terme assez large pour inclure faiblesses, limites et scrupules, sans la condamnation morale que pourrait suggérer « défaillances ».
- source_word: τῶν ἀδυνάτων
  choice: de ceux qui ne le sont pas
  rationale: Renvoie naturellement à « forts » tout en évitant de substantiver et d’étiqueter les personnes comme « les faibles »; le contraste grec demeure explicite.
- source_word: βαστάζειν
  choice: porter
  rationale: Préserve l’image de prendre en charge un poids, au-delà de la simple tolérance exprimée par « supporter ».
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: au lieu de chercher à nous faire plaisir à nous-mêmes
  rationale: Rend idiomatiquement le contraste éthique et la valeur réflexive; « chercher à » explicite le fait d’agir en vue de sa propre satisfaction sans ajouter une idée doctrinale.
theological_decisions:
- issue: Sens des « forts » et de ceux qui ne le sont pas
  choice: Des croyants dont la conscience permet une plus grande liberté, opposés à ceux dont la conscience est plus restrictive dans le contexte de Romains 14.
  alternative: Des personnes socialement puissantes face aux faibles, ou physiquement robustes face aux fragiles.
  rationale: Le contexte immédiat porte sur les aliments, les jours et les scrupules de conscience. La formulation française conserve néanmoins le vocabulaire métaphorique du texte.
- issue: Nature des « faiblesses »
  choice: Le terme reste large et peut désigner des limites, scrupules ou défaillances.
  alternative: Le réduire soit à des péchés moraux, soit exclusivement à des scrupules de conscience.
  rationale: Le grec ἀσθενήματα possède une certaine amplitude sémantique. Le contexte oriente vers les limites de conscience, mais la traduction ne doit pas effacer cette largeur.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « nous… nous » reflète l’emphase grecque. « Porter » maintient la métaphore de la charge, et « ceux qui ne le sont pas » évite une désignation figée tout en gardant le contraste avec les forts.
