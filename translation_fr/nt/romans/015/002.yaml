source:
  edition: SBLGNT
  text: ἕκαστος ἡμῶν τῷ πλησίον ἀρεσκέτω εἰς τὸ ἀγαθὸν πρὸς οἰκοδομήν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: fr
  text: Que chacun de nous plaise à son prochain, pour son bien[a], afin de l’édifier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vue du bien » ou « pour ce qui est bon ». L’expression grecque désigne ce qui est bénéfique, et non la simple satisfaction des désirs d’autrui.
    reason: lexical_alternative
  - marker: b
    text: Ou « afin de le faire grandir ». Le grec évoque littéralement la construction; il s’agit ici, au figuré, de fortifier ou de développer une personne.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: chacun de nous
  rationale: Rend naturellement le singulier distributif suivi du génitif partitif et maintient l’exhortation individuelle adressée à toute la communauté.
- source_word: τῷ πλησίον
  choice: à son prochain
  rationale: « Prochain » exprime ici la personne avec laquelle on est en relation et convient à la portée éthique du terme grec.
- source_word: ἀρεσκέτω
  choice: cherche à plaire
  rationale: Le présent impératif appelle à une conduite suivie. « Cherche à plaire » restitue en français naturel la force exhortative sans suggérer une simple complaisance, le sens étant aussitôt qualifié par les compléments de but.
- source_word: εἰς τὸ ἀγαθὸν
  choice: pour son bien
  rationale: Exprime clairement la visée bénéfique de l’action. Le possessif renvoie naturellement au prochain sans transformer le commandement en recherche générale d’approbation.
- source_word: πρὸς οἰκοδομήν
  choice: afin de le faire grandir
  rationale: Rend de façon courante la métaphore d’οἰκοδομή appliquée au développement et à l’affermissement d’une personne; le pronom reprend « son prochain ».
theological_decisions:
- issue: Portée éthique du fait de plaire au prochain
  choice: Le fait de plaire est limité par le bien du prochain et par ce qui le fait grandir.
  alternative: Comprendre le commandement comme une accommodation générale ou une recherche sans réserve de l’approbation d’autrui.
  rationale: Les deux expressions de but du texte grec encadrent ἀρεσκέτω et excluent une complaisance qui ne servirait pas réellement le prochain.
- issue: Sens de οἰκοδομή
  choice: Conserver l’idée métaphorique de développement personnel par « faire grandir ».
  alternative: Employer « édification », terme plus formel qui peut évoquer spécifiquement une croissance spirituelle ou communautaire.
  rationale: Le grec conserve une métaphore de construction sans préciser ici toutes les dimensions de cette croissance. La formulation choisie reste compréhensible et ne restreint pas indûment le sens.
translation_notes:
  register: Français international moderne, naturel et digne. « Cherche à plaire » évite la raideur de « que chacun plaise » tout en gardant la valeur impérative. « Faire grandir » rend la métaphore dans une langue accessible; la note conserve l’équivalent plus formel « édifier ».
