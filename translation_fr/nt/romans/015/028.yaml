  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: fr
  text: Donc, après avoir mené cette tâche à bien et leur avoir remis officiellement le fruit de cette collecte[a], je partirai pour l’Espagne en passant par chez vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leur avoir scellé ce fruit ». Le verbe peut évoquer ici la remise officielle, garantie ou sûre de la contribution recueillie auprès des croyants non juifs pour ceux de Jérusalem.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en passant par vous ». Paul prévoit de passer par Rome en se rendant en Espagne.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: Après avoir mené cette tâche à bien
  rationale: Le participe aoriste exprime une action qui sera achevée avant le départ. « Cette tâche » explicite sobrement le référent de τοῦτο, à savoir l’acheminement de la collecte, tandis que « mener à bien » rend naturellement ἐπιτελέω. οὖν marque ici la suite logique; la construction française avec « après » suffit à porter cette transition sans un lourd « donc ».
- source_word: σφραγισάμενος αὐτοῖς
  choice: leur avoir remis officiellement
  rationale: Le sens littéral est « avoir scellé pour eux », mais cette tournure serait obscure en français actuel. Dans le contexte, le verbe évoque vraisemblablement une remise dûment accomplie, garantie ou officialisée. La note conserve l’image littérale et son ambiguïté.
- source_word: τὸν καρπὸν τοῦτον
  choice: le fruit de cette collecte
  rationale: « Fruit » préserve la métaphore paulinienne, tandis que « de cette collecte » en indique le référent contextuel sans remplacer l’image par « don » ou « contribution ».
- source_word: ἀπελεύσομαι
  choice: je partirai
  rationale: Le futur annonce le départ de Paul une fois sa mission achevée. « Je partirai » est direct et idiomatique.
- source_word: δι’ ὑμῶν
  choice: en passant par chez vous
  rationale: διά avec le génitif indique ici un trajet passant par les destinataires, c’est-à-dire par Rome. « Par chez vous » garde la référence personnelle du grec sans substituer directement le nom de la ville.
- source_word: εἰς Σπανίαν
  choice: pour l’Espagne
  rationale: Rend naturellement la destination exprimée par εἰς.
theological_decisions:
- issue: Sens de l’image « sceller ce fruit » appliquée à la collecte destinée aux croyants de Jérusalem
  choice: Rendre dans le texte « remis officiellement » et signaler en note le sens littéral « scellé » ainsi que les nuances possibles
  alternative: « leur avoir scellé ce fruit » ou « leur avoir remis ce don en toute sécurité »
  rationale: Un calque de « sceller » serait peu intelligible en français et pourrait suggérer une action sans rapport avec le contexte. « Remis officiellement » exprime la remise dûment accomplie sans trancher entièrement entre certification, garantie et livraison sûre; la note préserve la métaphore originale et l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe évite le calque obscur de σφραγίζω tout en conservant dans le texte la métaphore du « fruit » et en documentant littéralement le verbe dans une note.
