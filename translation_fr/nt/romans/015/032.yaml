  text: ἵνα ἐν χαρᾷ ⸀ἐλθὼν πρὸς ὑμᾶς διὰ θελήματος ⸀θεοῦ συναναπαύσωμαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: fr
  text: afin que, par la volonté de Dieu, je vienne chez vous avec joie et que je me repose avec vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que je trouve avec vous du réconfort » ou « que je sois réconforté avec vous ». Le verbe grec évoque un repos ou un réconfort vécu en commun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit naturellement en français la proposition de but liée à la demande qui précède.
- source_word: ἐν χαρᾷ
  choice: avec joie
  rationale: Expression française idiomatique qui conserve le nom « joie » et indique la disposition accompagnant la venue de Paul.
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: je vienne chez vous
  rationale: Le participe aoriste est intégré à la proposition de but; « chez vous » exprime naturellement le déplacement vers les croyants de Rome.
- source_word: διὰ θελήματος θεοῦ
  choice: si Dieu le veut
  rationale: Formulation française courante exprimant que la venue dépend de la volonté de Dieu, sans alourdir la phrase.
- source_word: συναναπαύσωμαι
  choice: je trouve auprès de vous un repos partagé
  rationale: Rend à la fois l'idée de repos et la dimension commune portée par le préfixe συν-, dans une formulation naturelle et digne.
theological_decisions:
- issue: La réciprocité de la communion que Paul espère vivre avec les croyants de Rome
  choice: un repos partagé
  alternative: que je me repose avec vous; que nous trouvions ensemble du réconfort
  rationale: Cette formulation maintient l'idée que Paul ne vient pas seulement apporter quelque chose, mais aussi prendre part avec eux à un repos ou à un réconfort commun, sans imposer une notion théologique technique.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « si Dieu le veut » privilégie l'idiome français tout en conservant la dépendance de la venue de Paul envers la volonté divine; la note préserve l'étendue sémantique du verbe grec.
