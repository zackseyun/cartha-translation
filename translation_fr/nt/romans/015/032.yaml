  source_fidelity: La proposition de but, la joie accompagnant la venue et la dimension commune de συναναπαύσωμαι sont globalement bien perçues. Toutefois, « si Dieu le veut » transforme légèrement la formulation instrumentale « par/à travers la volonté de Dieu » en une condition explicite. « Un repos partagé » est interprétatif et moins directement fidèle à la forme verbale personnelle.
