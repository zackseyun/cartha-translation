id: ROM.15.3
reference: Romans 15:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: fr
  text: 'En effet, même le Messie[a] n’a pas fait ce qui lui plaisait, mais, comme il est écrit : « Les insultes de ceux qui t’insultent sont tombées sur moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ».
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ γὰρ
  choice: En effet, même
  rationale: Cette tournure exprime à la fois le lien explicatif avec l’exhortation précédente et l’accent porté sur le Messie comme exemple.
- source_word: ὁ Χριστός
  choice: le Messie
  rationale: L’article et la fonction exemplaire du titre favorisent ici « le Messie » plutôt que l’emploi quasi nominal de « Christ ».
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: n’a pas cherché à se plaire à lui-même
  rationale: Cette formulation française naturelle conserve l’idée de plaire et la référence réflexive, sans réduire le sens à la seule recherche du plaisir.
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: mais, comme il est écrit
  rationale: Formule française consacrée pour introduire une citation de l’Écriture, elle rend naturellement le parfait grec.
- source_word: ὀνειδισμοί
  choice: insultes
  rationale: « Insultes » exprime clairement en français moderne les outrages verbaux et l’opprobre visés par le terme grec.
- source_word: τῶν ὀνειδιζόντων σε
  choice: de ceux qui t’insultent
  rationale: La proposition relative substantivée est naturelle et maintient la répétition du même champ lexical que le nom « insultes ».
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: sont tombées sur moi
  rationale: Cette traduction directe conserve l’image du grec et rend l’aoriste de la citation par un passé composé idiomatique en français.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte présente Jésus dans son rôle messianique comme modèle des croyants, et l’article grec favorise la valeur de titre. L’autre traduction courante est signalée en note.
- issue: Identité de la voix dans la citation scripturaire
  choice: Conserver la première personne de la citation sans identifier explicitement le locuteur
  alternative: Ajouter dans le texte que le « moi » désigne le Messie
  rationale: Paul applique la citation du Psaume 69 au Messie, mais la traduction ne doit pas préciser davantage que le texte grec ni effacer la tension propre à cette application.
translation_notes:
  register: Français international moderne, clair et digne. « Insultes » est plus courant que « outrages » ou « opprobres », tandis que la structure de la citation et l’image « tombées sur moi » préservent la tonalité scripturaire.
