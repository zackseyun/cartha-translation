id: ROM.15.4
reference: Romans 15:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: fr
  text: En effet, tout ce qui a été écrit auparavant a été écrit pour notre instruction, afin que, par la persévérance et par l’encouragement des Écritures[a], nous ayons l’espérance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la consolation des Écritures » ou « l’exhortation des Écritures » ; le mot grec peut exprimer l’encouragement, la consolation ou l’exhortation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: tout ce qui
  rationale: Le relatif neutre pluriel a ici une portée globale. « Tout ce qui » restitue naturellement cette valeur en français.
- source_word: προεγράφη
  choice: a été écrit auparavant
  rationale: Le verbe renvoie ici à ce qui a été écrit antérieurement. « Auparavant » conserve la valeur temporelle du préfixe προ- sans suggérer un affichage public.
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: pour notre instruction
  rationale: La préposition εἰς exprime ici la finalité, et διδασκαλία désigne l’enseignement ou l’instruction. Cette formulation est claire et garde le substantif grec.
- source_word: ἐγράφη
  choice: a été écrit
  rationale: La répétition de « a été écrit » reproduit l’insistance rhétorique du grec.
- source_word: ἵνα
  choice: afin que
  rationale: Cette locution introduit clairement la finalité et appelle naturellement le subjonctif en français.
- source_word: διὰ τῆς ὑπομονῆς
  choice: par la persévérance
  rationale: Ὑπομονή évoque l’endurance patiente dans l’épreuve. « Persévérance » est naturel en français et souligne la constance dans la durée.
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: par l’encouragement des Écritures
  rationale: Παράκλησις peut désigner l’encouragement, la consolation ou l’exhortation. « Encouragement » convient au contexte de l’espérance, tandis que la construction « des Écritures » conserve la relation génitive sans l’expliciter excessivement.
- source_word: τῶν γραφῶν
  choice: des Écritures
  rationale: Dans ce contexte paulinien, γραφαί désigne les écrits sacrés reconnus. La majuscule rend ce référent conventionnel en français.
- source_word: τὴν ἐλπίδα ἔχωμεν
  choice: nous ayons l’espérance
  rationale: Le subjonctif après « afin que » rend directement ἔχωμεν. L’article est conservé, car « avoir l’espérance » demeure idiomatique et peut évoquer l’espérance déterminée par le contexte chrétien.
theological_decisions:
- issue: Rapport entre la persévérance, l’encouragement et les Écritures
  choice: Conserver « par la persévérance et par l’encouragement des Écritures »
  alternative: Expliciter que la persévérance et l’encouragement sont tous deux produits ou communiqués par les Écritures
  rationale: Dans l’ordre grec, « des Écritures » dépend directement de « l’encouragement », même si le sens global peut associer les Écritures aux deux moyens. La formulation retenue préserve cette structure et n’impose pas une explication théologique plus étroite.
- issue: Nature de l’espérance
  choice: l’espérance
  alternative: de l’espérance
  rationale: Le grec emploie l’article défini. Le conserver laisse ouverte la possibilité d’une espérance déterminée par le contexte, sans ajouter de précision doctrinale absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « a été écrit » et celle de « par » sont maintenues pour refléter la structure et l’insistance du grec.
