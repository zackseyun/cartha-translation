id: ROM.15.33
reference: Romans 15:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: fr
  text: Que le Dieu de paix soit avec vous tous. Amen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: non rendu explicitement
  rationale: Ici, δέ marque une transition légère vers la bénédiction finale, sans opposition forte. En français, la transition se comprend naturellement sans ajouter « maintenant », qui risquerait d’introduire une nuance temporelle absente du grec.
- source_word: θεὸς τῆς εἰρήνης
  choice: le Dieu de paix
  rationale: Cette formulation directe conserve le titre paulinien et le rapport génitif du grec, dans un français naturel et traditionnel.
- source_word: εἰρήνης
  choice: paix
  rationale: « Paix » rend naturellement εἰρήνη et peut porter ici les idées de réconciliation, de bien-être et de plénitude sans les expliciter indûment.
- source_word: μετὰ πάντων ὑμῶν
  choice: soit avec vous tous
  rationale: Le grec ne comporte pas de verbe exprimé. « Soit » restitue en français la valeur de souhait ou de bénédiction, tandis que « vous tous » préserve la portée inclusive de πάντων ὑμῶν.
- source_word: ἀμήν
  choice: Amen
  rationale: Le terme liturgique consacré est conservé, conformément à son emploi conclusif solennel.
theological_decisions:
- issue: Valeur de la proposition grecque sans verbe explicite
  choice: 'Bénédiction formulée comme un souhait : « Que le Dieu de paix soit avec vous tous. »'
  alternative: 'Affirmation indicative : « Le Dieu de paix est avec vous tous. »'
  rationale: Dans une conclusion épistolaire, cette construction nominale fonctionne naturellement comme une prière ou une bénédiction. La tournure française avec « Que… soit » rend cette fonction sans transformer le souhait en affirmation.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « Que… soit » convient à une bénédiction tout en restant immédiatement compréhensible. Aucun marqueur de note n’est nécessaire.
