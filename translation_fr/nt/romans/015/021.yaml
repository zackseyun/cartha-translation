  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: fr
  text: 'mais, comme il est écrit : « Ceux à qui rien n’a été annoncé à son sujet[a] verront, et ceux qui n’ont pas entendu comprendront. »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « son » renvoie, dans le contexte d’Ésaïe, à la figure du serviteur ; Paul applique ici cette citation à sa proclamation de l’Évangile.
    reason: cross_reference
  - marker: b
    text: Paul cite Ésaïe 52.15.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: mais
  rationale: Marque le contraste avec l’affirmation précédente de Paul au sujet de son ambition missionnaire.
- source_word: καθὼς γέγραπται
  choice: conformément à ce qui est écrit
  rationale: Rend naturellement la formule de citation et souligne que la pratique de Paul correspond au texte cité; le parfait passif grec s’exprime idiomatiquement par « ce qui est écrit ».
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: Ceux à qui rien n’a été annoncé à son sujet
  rationale: La tournure conserve le datif personnel, le passif du verbe « annoncer » et la référence pronominale αὐτοῦ, tout en restant naturelle en français moderne.
- source_word: ὄψονται
  choice: verront
  rationale: Traduction directe du futur de ὁράω; elle préserve l’image de la vision sans l’interpréter prématurément comme une simple perception intellectuelle.
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: ceux qui n’ont pas entendu
  rationale: Le passé composé français exprime naturellement l’état présent résultant indiqué par le parfait grec.
- source_word: συνήσουσιν
  choice: comprendront
  rationale: Rend clairement le futur de συνίημι et maintient le parallélisme avec « verront ».
theological_decisions:
- issue: Référent de αὐτοῦ dans la citation d’Ésaïe
  choice: Conserver le pronom « son » dans « à son sujet »
  alternative: Expliciter par « au sujet du Messie » ou « au sujet du Christ »
  rationale: Le grec garde un pronom dont le référent provient du contexte d’Ésaïe et que Paul applique à sa proclamation de l’Évangile. L’expliciter dans le corps du texte trancherait une question que la formulation citée laisse implicite.
- issue: Portée de « verront »
  choice: Conserver le sens concret et métaphorique ouvert de « verront »
  alternative: Traduire par « découvriront » ou « percevront »
  rationale: Le texte grec emploie ὁράω. Le parallèle avec « comprendront » suggère une portée cognitive, mais ne justifie pas de supprimer l’image de la vision.
translation_notes:
  register: Français international moderne, digne et accessible. La citation conserve son parallélisme prophétique. « Conformément à ce qui est écrit » est légèrement plus explicite que « comme il est écrit », mais rend bien καθὼς dans ce contexte argumentatif.
