id: ROM.15.20
reference: Romans 15:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: fr
  text: Ainsi, mon ambition est d’annoncer la bonne nouvelle, non pas là où le nom du Messie[a] avait déjà été proclamé[b], afin de ne pas bâtir sur le fondement d’un autre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le grec Χριστός est ici rendu par « le Messie » en tant que titre.
    reason: alternative_reading
  - marker: b
    text: Littéralement, « là où le Messie avait été nommé ». Dans ce contexte, cela peut désigner un lieu où son nom avait déjà été mentionné ou proclamé.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως δὲ
  choice: Ainsi
  rationale: « Ainsi » relie naturellement cette déclaration à la description précédente du ministère de Paul. La particule δέ marque ici une transition légère plutôt qu’une forte opposition.
- source_word: φιλοτιμούμενον
  choice: mon ambition est
  rationale: Cette tournure rend l’aspiration volontaire et soutenue exprimée par le participe, dans un français courant et digne.
- source_word: εὐαγγελίζεσθαι
  choice: annoncer la bonne nouvelle
  rationale: Cette formulation conserve la valeur verbale de la proclamation tout en restant accessible, sans recourir au vocabulaire religieux plus spécialisé d’« évangéliser ».
- source_word: οὐχ ὅπου ὠνομάσθη
  choice: non pas là où … avait déjà été nommé
  rationale: La formulation préserve la négation locative et le passif de ὀνομάζω. « Déjà » explicite sobrement l’antériorité impliquée par la stratégie missionnaire décrite.
- source_word: Χριστός
  choice: le Messie
  rationale: Ici, Χριστός désigne celui qui est annoncé et garde nettement sa valeur de titre; « le Messie » rend cette fonction en français.
- source_word: ἵνα μὴ
  choice: afin de ne pas
  rationale: Cette tournure exprime clairement le but négatif sans alourdir la phrase.
- source_word: ἐπ’ ἀλλότριον θεμέλιον
  choice: sur le fondement d’un autre
  rationale: La formulation conserve littéralement la métaphore de construction et l’idée d’un fondement appartenant à quelqu’un d’autre, sans ajouter un référent masculin absent du grec.
- source_word: οἰκοδομῶ
  choice: bâtir
  rationale: « Bâtir » s’accorde naturellement avec « fondement » et maintient l’image du travail apostolique comme construction.
theological_decisions:
- issue: Traduction de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme fonctionne ici comme un titre de celui qui est proclamé. Une note conserve l’équivalent traditionnel « le Christ » sans imposer une distinction théologique absente du texte.
- issue: Portée du principe missionnaire de Paul
  choice: présenter cette pratique comme l’ambition personnelle de Paul
  alternative: la formuler comme une interdiction universelle de servir là où le Messie est déjà connu
  rationale: La syntaxe exprime l’aspiration propre de Paul et son but; la traduction n’en fait pas un commandement général.
- issue: Sens de ὠνομάσθη
  choice: avait déjà été nommé
  alternative: avait déjà été annoncé
  rationale: Le rendu principal conserve le verbe grec et son passif, tandis que la note indique la portée contextuelle possible sans éliminer l’ambiguïté.
translation_notes:
  register: Français international moderne, clair et soutenu sans archaïsme. La phrase conserve la métaphore du fondement et le caractère personnel de l’ambition missionnaire de Paul.
