id: ROM.15.31
reference: Romans 15:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: fr
  text: afin que je sois délivré de ceux qui désobéissent en Judée[a], et que mon service pour Jérusalem soit bien accueilli par les saints.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ceux qui refusent de croire en Judée ». Le participe grec peut évoquer le refus de croire et, par conséquent, la désobéissance.
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: afin que… et que
  rationale: Introduit les deux buts coordonnés de la demande de prière de Paul; cette tournure restitue naturellement en français les deux subjonctifs régis par un seul ἵνα.
- source_word: ῥυσθῶ
  choice: je sois délivré
  rationale: Le passif «être délivré» exprime clairement le fait d’être soustrait à un danger, sans préciser un moyen absent du texte.
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: de ceux qui refusent d’obéir
  rationale: Cette formulation garde ensemble l’idée de refus et celle de désobéissance portée par ἀπειθέω, sans la réduire à une simple disposition intellectuelle. L’autre sens contextuellement possible, «ceux qui refusent de croire», figure en note.
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: en Judée
  rationale: Forme géographique française courante.
- source_word: διακονία
  choice: le service que j’accomplis
  rationale: «Service» conserve la portée large de διακονία tout en convenant à l’action concrète de Paul envers Jérusalem; l’ajout verbal rend naturelle en français la construction possessive grecque.
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: pour Jérusalem
  rationale: Exprime idiomatiquement l’orientation du service vers Jérusalem sans réduire explicitement διακονία à l’aide financière, même si le contexte l’évoque.
- source_word: εὐπρόσδεκτος
  choice: bien accueilli
  rationale: Rend le sens d’un service reçu favorablement et convient mieux ici en français courant que le calque plus abstrait «acceptable».
- source_word: τοῖς ἁγίοις
  choice: par les saints
  rationale: Conserve l’appellation paulinienne établie des croyants; «par» correspond naturellement en français à la personne auprès de qui le service trouve bon accueil.
- source_word: γένηται
  choice: soit
  rationale: Avec «bien accueilli», le subjonctif français exprime naturellement le résultat espéré; traduire séparément la nuance de «devenir» produirait ici une formulation lourde.
theological_decisions:
- issue: Sens de ἀπειθούντων à propos des opposants de Paul en Judée
  choice: ceux qui refusent d’obéir
  alternative: ceux qui refusent de croire
  rationale: Le participe grec peut désigner le refus de croire aussi bien que la désobéissance qui en découle. Le texte principal conserve la notion de refus et d’obéissance, tandis que la note maintient ouverte l’interprétation liée à l’incrédulité.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde la structure de but et le parallélisme des deux demandes. «Les saints» préserve le vocabulaire paulinien traditionnel sans ajout confessionnel.
