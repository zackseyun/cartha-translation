- from: afin que je sois délivré de ceux qui refusent d’obéir en Judée[a], et que le service que j’accomplis pour Jérusalem soit bien accueilli par les saints.
  to: afin que je sois délivré de ceux qui désobéissent en Judée[a], et que mon service pour Jérusalem soit bien accueilli par les saints.
  rationale: La révision remplace une formulation qui explicitait le refus par « ceux qui désobéissent », plus proche de l’ambiguïté lexicale de ἀπειθούντων. Elle simplifie également « le service que j’accomplis » en « mon service », qui correspond directement à ἡ διακονία μου, tout en gardant l’orientation vers Jérusalem et le bon accueil par les saints. La note préserve l’interprétation contextuellement possible liée à l’incrédulité.
