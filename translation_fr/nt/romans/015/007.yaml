id: ROM.15.7
reference: Romans 15:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: fr
  text: C’est pourquoi, accueillez-vous les uns les autres, tout comme le Christ lui-même vous a accueillis, pour la gloire de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée de l’argument précédent.
- source_word: προσλαμβάνεσθε ἀλλήλους
  choice: accueillez-vous les uns les autres
  rationale: Exprime l’impératif et la réciprocité, avec la dimension relationnelle de l’accueil mutuel dans la communauté.
- source_word: καθὼς καὶ
  choice: tout comme
  rationale: Rend clairement la comparaison; en français, l’idée additive de καί est suffisamment portée par la construction sans ajouter un « aussi » lourd ou ambigu.
- source_word: ὁ Χριστὸς
  choice: le Christ
  rationale: En français courant, « le Christ » conserve naturellement la valeur de titre de Χριστός tout en restant immédiatement intelligible.
- source_word: προσελάβετο ὑμᾶς
  choice: vous a accueillis
  rationale: Reprend le même verbe français que dans l’impératif afin de préserver le parallèle voulu par Paul; l’accord au pluriel reflète ὑμᾶς.
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: pour la gloire de Dieu
  rationale: Formulation française naturelle qui laisse à εἰς sa nuance possible de but ou de résultat sans la préciser excessivement.
theological_decisions:
- issue: Valeur de Χριστός
  choice: le Christ
  alternative: le Messie
  rationale: L’article grec soutient la valeur titulaire. En français, « le Christ » est lui-même un titre établi et transparent; « le Messie » serait également possible, mais n’est pas nécessaire pour préserver cette valeur.
- issue: Nuance communautaire de προσλαμβάνομαι
  choice: accueillez-vous les uns les autres
  alternative: acceptez-vous les uns les autres / recevez-vous les uns les autres
  rationale: « Accueillir » rend l’acceptation relationnelle et concrète demandée dans le contexte de Romains 14–15, sans réduire le verbe à une simple tolérance.
- issue: Portée de εἰς δόξαν τοῦ θεοῦ
  choice: pour la gloire de Dieu
  alternative: à la gloire de Dieu
  rationale: Le syntagme grec peut exprimer le but ou le résultat. « Pour la gloire de Dieu » conserve cette souplesse en français naturel.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition d’« accueillir » préserve le parallélisme grec entre l’exhortation adressée aux croyants et l’action du Christ.
