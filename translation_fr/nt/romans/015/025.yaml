reference: Romans 15:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: fr
  text: Mais maintenant, je vais à Jérusalem pour servir[a] les saints.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en me mettant au service des saints » ou « pour apporter de l’aide aux saints ». Le participe grec peut désigner un service pratique ; ici, il s’agit probablement de remettre aux croyants de Jérusalem la collecte mentionnée au verset 26.
    reason: alternative lexicale et précision contextuelle
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: νυνί souligne le moment présent, tandis que δέ marque une transition légèrement contrastive. « Mais maintenant » rend naturellement ces deux valeurs.
- source_word: πορεύομαι
  choice: je vais
  rationale: Le présent indique ici le déplacement en cours ou projeté de Paul. « Je vais » est direct et naturel, sans ajouter l’idée qu’il serait déjà en route.
- source_word: εἰς Ἰερουσαλὴμ
  choice: à Jérusalem
  rationale: Avec un nom de ville, εἰς indique normalement la destination. En français, le mouvement vers cette ville se dit idiomatiquement « aller à Jérusalem ».
- source_word: διακονῶν
  choice: pour servir
  rationale: Le participe présent exprime le service qui motive ou accompagne le voyage. La tournure finale « pour servir » est naturelle en français et conserve le sens large de service pratique, sans lui imposer une fonction ecclésiastique officielle.
- source_word: τοῖς ἁγίοις
  choice: les saints
  rationale: Chez Paul, οἱ ἅγιοι désigne couramment les croyants consacrés à Dieu. « Les saints » maintient le lien lexical avec la sainteté et évite de remplacer l’expression source par une explication contextuelle.
theological_decisions:
- issue: Référent des « saints »
  choice: Conserver « les saints » dans le texte, avec pour référent contextuel les croyants de Jérusalem, notamment les pauvres parmi eux.
  alternative: Expliciter dans le texte « les croyants de Jérusalem » ou « le peuple de Dieu ».
  rationale: Le contexte immédiat, surtout le verset 26, identifie les bénéficiaires de l’aide, mais le verset lui-même emploie le terme général « saints ». La traduction préserve donc la formulation de la source sans réduire sa portée lexicale.
- issue: Rapport du participe διακονῶν au voyage
  choice: Le rendre par « pour servir », qui présente le service comme le but du voyage.
  alternative: « en servant », qui pourrait présenter le service comme une action concomitante, ou « pour apporter de l’aide », qui explicite sa forme concrète.
  rationale: Dans ce contexte, la collecte mentionnée au verset suivant montre que le voyage vise un service concret envers les croyants. La formulation choisie exprime cette orientation tout en laissant le contenu précis du service au contexte.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste concise. Le terme biblique « saints » est conservé malgré son possible sens spécialisé en français courant, car le contexte paulinien désigne l’ensemble des croyants consacrés à Dieu et la note éclaire la nature pratique du service.
