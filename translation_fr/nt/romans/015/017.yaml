  text: ἔχω οὖν ⸀τὴν καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: fr
  text: J’ai donc, dans le Messie Jésus, de quoi me glorifier[a] en ce qui concerne Dieu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « J’ai donc un motif de fierté » ou « J’ai donc matière à me glorifier ».
    reason: lexical_alternative
  - marker: c
    text: Ou « dans les choses qui concernent Dieu » ou « pour les affaires relatives à Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: J’ai
  rationale: Le présent actif à la première personne appelle une affirmation directe au présent. Avec « de quoi me glorifier », « j’ai » rend naturellement l’idée de posséder un motif légitime.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence de l’argument précédent ; « donc » exprime clairement ce lien logique en français courant.
- source_word: τὴν καύχησιν
  choice: de quoi me glorifier
  rationale: Cette tournure idiomatique exprime à la fois l’acte de se glorifier et l’existence d’un motif pour le faire. Elle conserve le vocabulaire paulinien de la glorification sans le réduire à une simple joie intérieure.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « Dans » préserve la valeur de sphère ou d’union de ἐν sans la transformer en moyen instrumental. « Messie » traduit Χριστός comme titre, tandis que Jésus demeure le nom personnel.
- source_word: τὰ πρὸς τὸν θεόν
  choice: pour ce qui concerne Dieu
  rationale: La formule conserve l’étendue de l’expression grecque, qui désigne les réalités ou affaires relatives à Dieu, sans la limiter explicitement au service sacerdotal ou missionnaire.
- source_word: θεόν
  choice: Dieu
  rationale: Équivalent français normal de θεός dans ce contexte.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Χριστός reste ici un titre christologique associé au nom Jésus. Le traduire par « Messie » en rend le sens plutôt que de le traiter comme un simple élément du nom.
- issue: Portée de la glorification de Paul
  choice: Conserver une glorification réelle, mais située dans le Messie Jésus et limitée à ce qui concerne Dieu
  alternative: Parler seulement de confiance personnelle ou de joie
  rationale: Le texte maintient la tension du mot καύχησις tout en encadrant cette glorification par « dans le Messie Jésus » et « ce qui concerne Dieu ». La traduction n’ajoute pas que Paul s’attribue personnellement le mérite.
- issue: Valeur de ἐν
  choice: dans
  alternative: par
  rationale: « Dans » conserve l’ambiguïté possible entre sphère, union et relation, tandis que « par » imposerait une lecture principalement instrumentale.
translation_notes:
  register: Français international moderne, digne et lisible. « De quoi me glorifier » est idiomatique sans effacer la tension du vocabulaire paulinien. La formulation plus inhabituelle « dans le Messie Jésus » est maintenue pour refléter ἐν et rendre Χριστός comme titre.
