  source_fidelity: Le projet rend correctement la proposition finale ἵνα, les deux expressions complémentaires d’unité (ὁμοθυμαδόν et ἐν ἑνὶ στόματι), le subjonctif δοξάζητε et le titre Χριστός par « le Messie ». « D’une seule bouche » conserve volontairement l’image grecque; la note offre à juste titre l’équivalent idiomatique « d’une seule voix ».
