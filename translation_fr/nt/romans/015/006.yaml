id: ROM.15.6
reference: Romans 15:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: fr
  text: afin que, d’un commun accord et d’une seule bouche[a], vous glorifiiez Dieu, le Père de notre Seigneur Jésus le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus idiomatique : « d’une seule voix ». Le grec dit littéralement « d’une seule bouche », image qui souligne l’unité de la louange.'
    reason: lexical_alternative
  - marker: b
    text: 'Traditionnellement : « Jésus-Christ ». Le titre grec Χριστός signifie « Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat découlant de l’exhortation précédente et commande naturellement le subjonctif en français.
- source_word: ὁμοθυμαδόν
  choice: d’un commun accord
  rationale: Exprime l’unité de disposition et d’intention du groupe, sans se confondre avec l’image vocale de l’expression suivante.
- source_word: ἐν ἑνὶ στόματι
  choice: d’une seule bouche
  rationale: Conserve l’image corporelle précise du grec, même si « d’une seule voix » serait plus idiomatique en français.
- source_word: δοξάζητε
  choice: vous glorifiiez
  rationale: Le subjonctif présent après « afin que » rend la construction grecque de but et garde le vocabulaire doxologique traditionnel, encore compréhensible aujourd’hui.
- source_word: τὸν θεὸν καὶ πατέρα
  choice: le Dieu et Père
  rationale: Le même article grec lie étroitement les deux noms; cette formulation française préserve leur unité sans trancher davantage leur relation syntaxique.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de notre Seigneur
  rationale: Rend directement le titre κύριος et conserve le possessif collectif.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Traduit Χριστός comme un titre porteur de sens plutôt que comme une simple translittération; l’article rend la construction naturelle en français.
theological_decisions:
- issue: Sens de Χριστοῦ dans la séquence Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Χριστός désigne le titre messianique. « Le Messie » en explicite le sens tout en conservant son caractère de titre après le nom personnel.
- issue: Relation entre θεὸν et πατέρα
  choice: le Dieu et Père
  alternative: Dieu, qui est le Père
  rationale: La traduction retenue suit la coordination grecque sous un article unique et évite de transformer l’expression en proposition explicative qui résoudrait sa syntaxe.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase conserve l’image marquante de la « seule bouche » et le parallélisme entre l’unité intérieure (« d’un commun accord ») et son expression commune. Les marqueurs [a] et [b] figurent dans le texte.
