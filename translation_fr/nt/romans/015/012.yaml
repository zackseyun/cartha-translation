source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: fr
  text: 'Et Ésaïe dit encore : « Il y aura la racine de Jessé, et celui qui se lèvera pour gouverner les nations ; en lui les nations mettront leur espérance. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσται
  choice: Il y aura
  rationale: Rend directement le futur de εἰμί tout en donnant en français une formulation naturelle à l’annonce prophétique, sans expliciter par « viendra » ce que le grec laisse sous la forme « sera ».
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: la racine de Jessé
  rationale: Conserve l’image métaphorique et le nom traditionnel français de Jessé.
- source_word: ὁ ἀνιστάμενος
  choice: celui qui se lèvera
  rationale: Préserve l’idée d’un personnage qui se dresse ou se lève, sans préciser ici s’il s’agit de son apparition, de son établissement ou d’une résurrection.
- source_word: ἄρχειν ἐθνῶν
  choice: pour gouverner les nations
  rationale: ἄρχω avec le génitif exprime l’exercice de l’autorité sur des peuples ; « gouverner » est naturel et digne. Dans ce contexte biblique, ἔθνη désigne les nations non juives, mais « les nations » conserve le même terme dans les deux propositions.
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: en lui ... mettront leur espérance
  rationale: « Mettre son espérance en » rend idiomatiquement la confiance orientée vers une personne exprimée par ἐπί avec le datif.
theological_decisions:
- issue: Rapport entre « la racine de Jessé » et « celui qui se lèvera »
  choice: 'Conserver la juxtaposition appositive : « la racine de Jessé, celui qui se lèvera »'
  alternative: « la racine de Jessé, c’est-à-dire celui qui se lèvera » ou « la racine de Jessé se lèvera »
  rationale: Le grec coordonne ἡ ῥίζα et ὁ ἀνιστάμενος par καί. La formulation retenue garde leur identification probable sans ajouter une explication absente du texte ni effacer sa syntaxe inhabituelle.
- issue: Sens possible de ἀνιστάμενος
  choice: « se lèvera »
  alternative: « surgira », « se dressera » ou « ressuscitera »
  rationale: Le contexte vise l’établissement du souverain messianique, mais le lexème peut porter plusieurs nuances. « Se lèvera » conserve cette ouverture et évite d’imposer une référence explicite à la résurrection.
- issue: Identité des ἔθνη
  choice: « les nations » aux deux occurrences
  alternative: « les non-Juifs » ou « les païens »
  rationale: « Les nations » maintient le vocabulaire de la citation et évite la connotation moderne parfois péjorative de « païens », tout en laissant le contexte de Romains préciser qu’il s’agit des peuples autres qu’Israël.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La ponctuation rend la citation prophétique lisible tout en conservant sa construction solennelle et légèrement inhabituelle. Aucun marqueur de note n’est requis.
