  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: fr
  text: 'et que les non-Juifs glorifient Dieu pour sa miséricorde[a], comme il est écrit : « C’est pourquoi je te louerai parmi les nations et je chanterai en l’honneur de ton nom. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même mot grec est rendu ici par « non-Juifs » et, dans la citation, par « nations ». Dans son argument, Paul vise particulièrement les peuples non juifs, tandis que la citation conserve aussi le sens plus large de « nations ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: les non-Juifs
  rationale: Dans l’argument de Romains, le terme désigne ici les peuples autres que les Juifs. « Les non-Juifs » est clair en français moderne et évite la tonalité parfois archaïque de « païens ».
- source_word: ὑπὲρ ἐλέους
  choice: pour sa compassion
  rationale: ὑπέρ avec le génitif exprime ici le motif. Le possessif explicite naturellement que la compassion est celle de Dieu; « compassion » rend la bienveillance miséricordieuse de ἔλεος dans une langue courante et digne.
- source_word: δοξάσαι
  choice: glorifient
  rationale: L’infinitif dépend de la syntaxe du verset précédent. La coordination française « et que » conserve cette dépendance et la valeur de résultat ou de visée sans transformer le fragment en phrase autonome.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule française naturelle et consacrée pour introduire une citation scripturaire.
- source_word: ἐξομολογήσομαί
  choice: je te louerai
  rationale: Dans cette citation, le verbe exprime une proclamation publique de louange ou d’action de grâce, non l’aveu d’une faute. Le complément « te » conserve σοι.
- source_word: ἐν ἔθνεσι
  choice: parmi les nations
  rationale: Dans le texte cité, « nations » préserve le sens large et le vocabulaire du psaume, tandis que le contexte paulinien applique ces nations aux non-Juifs.
- source_word: ψαλῶ
  choice: je chanterai les louanges
  rationale: Cette formulation exprime clairement le chant adressé à Dieu sans limiter le sens au chant des seuls psaumes canoniques.
- source_word: τῷ ὀνόματί σου
  choice: de ton nom
  rationale: En français, « chanter les louanges de ton nom » rend naturellement le datif grec et conserve l’idiome biblique du nom divin.
theological_decisions:
- issue: Dépendance et portée de la proposition infinitive initiale
  choice: « et que les non-Juifs glorifient Dieu » poursuit la construction commencée au verset 8.
  alternative: 'Faire de ces mots un fragment littéral : « et les nations de glorifier Dieu ».'
  rationale: Le grec de ce verset dépend syntaxiquement de ce qui précède. La tournure « et que » rend cette continuité intelligible tout en conservant la valeur de visée ou de résultat, sans ajouter une affirmation doctrinale étrangère au texte.
- issue: Rapport entre ἔθνη dans l’argument et dans la citation
  choice: Employer « non-Juifs » dans l’affirmation de Paul, puis « nations » dans la citation.
  alternative: Employer uniformément « non-Juifs » ou uniformément « nations » dans les deux occurrences.
  rationale: Cette variation reproduit la tension réelle entre l’application ethnique précise qu’en fait Paul et la portée plus large du terme dans la citation. La note signale que le même mot grec sous-tend les deux formulations.
translation_notes:
  register: Français international moderne, clair et digne. « Non-Juifs » est préféré à « Gentils » et « païens » pour l’intelligibilité et la neutralité; la citation garde une cadence poétique sobre.
