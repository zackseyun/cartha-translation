id: ROM.15.26
reference: Romans 15:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: fr
  text: En effet, la Macédoine et l’Achaïe ont jugé bon de faire une contribution en faveur des pauvres parmi les saints qui sont à Jérusalem[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « manifester une solidarité » ; le terme grec souligne un partage fraternel qui se concrétise ici par une aide matérielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: ont bien voulu
  rationale: Cette expression rend à la fois la décision volontaire et la disposition favorable exprimées par εὐδοκέω, dans un français naturel.
- source_word: γὰρ
  choice: En effet
  rationale: Le connecteur introduit l’explication de l’affirmation précédente; « En effet » convient naturellement en français moderne.
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: la Macédoine et l’Achaïe
  rationale: Les noms des régions sont conservés comme sujets, selon la métonymie du grec, sans ajouter explicitement « les Églises » ou « les croyants ».
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: faire une contribution
  rationale: Dans le contexte de la collecte, l’expression désigne un partage concret sous forme d’aide matérielle. « Une contribution » rend clairement ce sens; l’article indéfini reflète τινά sans suggérer une contribution précise déjà identifiée.
- source_word: εἰς τοὺς πτωχοὺς
  choice: en faveur des pauvres
  rationale: εἰς indique ici les bénéficiaires ou la destination de l’aide; cette formulation est idiomatique et précise.
- source_word: τῶν ἁγίων
  choice: parmi les saints
  rationale: Le génitif situe les pauvres au sein du groupe désigné comme les saints, sans affirmer que tous les saints de Jérusalem étaient pauvres.
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: qui sont à Jérusalem
  rationale: La relative rattache clairement le complément de lieu aux saints et reproduit la structure qualificative du grec dans un français naturel.
theological_decisions:
- issue: Traduction de ἅγιοι dans l’usage paulinien
  choice: les saints
  alternative: ceux qui appartiennent à Dieu / le peuple saint de Dieu
  rationale: « Les saints » conserve le terme ecclésial habituel de Paul pour les croyants, sans introduire l’idée ultérieure d’une catégorie de personnes canonisées.
- issue: Rapport entre les pauvres et les saints de Jérusalem
  choice: les pauvres parmi les saints qui sont à Jérusalem
  alternative: les pauvres des saints qui sont à Jérusalem
  rationale: La formulation retenue exprime naturellement que les bénéficiaires pauvres appartiennent au groupe des saints de Jérusalem, tout en évitant de faire de tous ces saints des pauvres.
translation_notes:
  register: Français international moderne, digne et accessible. « Ont bien voulu » préserve la volonté favorable du sujet; « contribution » communique clairement la portée matérielle de κοινωνία, tandis que la note en maintient la dimension de communion et de partage.
