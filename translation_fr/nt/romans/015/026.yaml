  source_fidelity: 'Le sens de l’ensemble est bien rendu : γάρ est explicatif, les régions sont conservées comme sujets métonymiques, et les bénéficiaires sont les pauvres appartenant aux saints de Jérusalem. « Ont bien voulu » peut toutefois suggérer en français une permission accordée, voire une volonté un peu réticente, nuance qui n’est pas portée par εὐδόκησαν. « Ont jugé bon de » rend plus exactement l’approbation volontaire.'
