id: ROM.15.30
reference: Romans 15:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: fr
  text: 'Je vous en prie, frères et sœurs[a], par notre Seigneur Jésus le Messie[b] et par l’amour de l’Esprit[c] : luttez avec moi par vos prières à Dieu en ma faveur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « frères », forme masculine qui peut s’adresser à toute la communauté croyante, hommes et femmes.
    reason: lexical_alternative
  - marker: b
    text: Ou « le Christ ». Le grec Christos est un titre qui signifie « Oint » ou « Messie ».
    reason: alternative_reading
  - marker: c
    text: L’expression peut désigner l’amour de l’Esprit lui-même ou l’amour produit par l’Esprit.
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Je vous en prie
  rationale: Exprime ici un appel pressant et personnel, dans un français naturel et digne.
- source_word: δὲ
  choice: donc
  rationale: Marque une transition liée à ce qui précède sans introduire un contraste fort.
- source_word: ἀδελφοί
  choice: frères et sœurs
  rationale: Dans l’adresse communautaire paulinienne, le masculin pluriel grec englobe vraisemblablement l’ensemble des croyants; cette formulation communique naturellement cette portée en français moderne, avec une note sur la forme grecque.
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: par notre Seigneur Jésus le Messie
  rationale: « Par » convient à l’appel fondé sur le Seigneur Jésus; « le Messie » rend Χριστός comme titre en français idiomatique.
- source_word: τῆς ἀγάπης τοῦ πνεύματος
  choice: l’amour de l’Esprit
  rationale: Conserve l’ambiguïté du génitif grec entre l’amour propre à l’Esprit et l’amour produit par lui.
- source_word: συναγωνίσασθαί μοι
  choice: luttez avec moi
  rationale: Rend la vigueur du verbe composé et sa dimension d’effort partagé, sans tournure artificielle.
- source_word: ἐν ταῖς προσευχαῖς
  choice: en priant
  rationale: Exprime idiomatiquement en français le moyen ou la sphère de cette lutte commune, sans ajouter de possessif absent du grec.
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: Dieu pour moi
  rationale: Rend clairement la direction de la prière vers Dieu et son caractère d’intercession en faveur de Paul.
theological_decisions:
- issue: Référence de « l’Esprit »
  choice: Le Saint-Esprit
  alternative: L’esprit humain ou un sens impersonnel
  rationale: L’usage paulinien et le contexte rendent la référence au Saint-Esprit la plus probable; la majuscule l’indique sans développer le titre dans le texte.
- issue: Sens du génitif dans « l’amour de l’Esprit »
  choice: Conserver la formulation ambiguë
  alternative: « l’amour que donne l’Esprit » ou « l’amour que l’Esprit éprouve »
  rationale: Le grec permet plusieurs relations sémantiques; le texte principal ne doit pas en imposer une.
- issue: Rendu de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme grec est un titre signifiant « oint »; « le Messie » en rend directement la valeur, tandis que la forme traditionnelle est signalée en note.
- issue: Portée de ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: Le vocatif masculin pluriel peut désigner toute la communauté croyante; le français explicite cette portée probable tout en documentant la forme source.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde le caractère pressant de l’appel et l’image d’un effort commun dans la prière. Les trois marqueurs de note figurent dans le texte principal.
