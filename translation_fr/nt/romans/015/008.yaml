id: ROM.15.8
reference: Romans 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: fr
  text: Car je dis que le Messie est devenu serviteur des circoncis pour la vérité de Dieu[a], afin de confirmer les promesses faites aux pères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la véracité de Dieu » ; dans ce contexte, cette expression peut souligner sa fidélité à tenir ses promesses.
    reason: Préserve l’autre nuance possible de ἀλήθεια θεοῦ, éclairée par la mention immédiate des promesses.
lexical_decisions:
- source_word: λέγω γὰρ
  choice: Car je dis
  rationale: γάρ introduit l’explication de ce qui précède, tandis que λέγω garde ici son sens discursif simple.
- source_word: Χριστόν
  choice: le Messie
  rationale: Dans cet argument centré sur Israël, la circoncision et les promesses ancestrales, Χριστός fonctionne comme un titre.
- source_word: διάκονον γεγενῆσθαι
  choice: est devenu serviteur
  rationale: διάκονος désigne ici celui qui se met au service d’autres, sans référence nécessaire à une fonction ecclésiale; le parfait de γίνομαι exprime un état résultant.
- source_word: περιτομῆς
  choice: des circoncis
  rationale: Le génitif désigne collectivement le peuple circoncis, c’est-à-dire ici les Juifs; cette formulation reste concise et intelligible.
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: pour manifester la vérité de Dieu
  rationale: ὑπέρ indique ici la cause défendue ou le but poursuivi. L’ajout verbal « manifester » rend la relation idiomatique en français sans réduire ἀλήθεια à la seule fidélité.
- source_word: εἰς τὸ βεβαιῶσαι
  choice: afin de confirmer
  rationale: La construction exprime le but, et βεβαιόω signifie rendre ferme ou confirmer.
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: les promesses faites aux pères
  rationale: 'Le génitif est compris comme objectif: les promesses avaient été adressées aux ancêtres d’Israël. « Pères » préserve la formulation historique et théologique de la source.'
theological_decisions:
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte historico-salvifique favorise la valeur titulaire, tout en reconnaissant que « Christ » est lexicalement possible.
- issue: Nuance de ἀλήθεια θεοῦ
  choice: la vérité de Dieu
  alternative: la véracité de Dieu / la fidélité de Dieu
  rationale: La formulation principale conserve l’amplitude de ἀλήθεια; la note signale la nuance de fidélité aux engagements, particulièrement forte à cause des promesses mentionnées ensuite.
- issue: Rapport entre διάκονον et περιτομῆς
  choice: serviteur des circoncis
  alternative: serviteur de la circoncision / au service des circoncis
  rationale: Le génitif grec est conservé autant que possible sans faire de « circoncision » une abstraction; la relation exacte de service demeure légèrement ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. « Car » maintient le lien argumentatif; « circoncis » et « pères » conservent le vocabulaire historique de Paul. La phrase évite le terme ecclésial « ministre » et explicite sobrement la relation exprimée par ὑπέρ.
