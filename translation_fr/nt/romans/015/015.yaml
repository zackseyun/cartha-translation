  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: fr
  text: Toutefois, je vous ai écrit plus hardiment sur certains points[a], comme pour vous les rappeler, à cause de la grâce que Dieu m’a accordée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « je vous ai écrit plus hardiment, du moins en partie ». L’expression grecque peut porter soit sur le degré de hardiesse, soit sur certains points abordés.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, la « grâce » accordée à Paul désigne notamment la mission et la capacité que Dieu lui a données pour son ministère auprès des non-Juifs.
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: avec une certaine hardiesse
  rationale: Le comparatif adverbial indique que Paul reconnaît le caractère relativement hardi de certains passages. Cette formulation est naturelle en français et évite une comparaison artificielle avec un degré de hardiesse non précisé.
- source_word: δὲ
  choice: Toutefois
  rationale: La particule marque ici une légère opposition ou une reprise après les propos favorables des versets précédents.
- source_word: ἔγραψα
  choice: je vous ai écrit
  rationale: Le passé composé convient naturellement à l’aoriste épistolaire dans une lettre et présente l’acte d’écrire comme pertinent pour les destinataires.
- source_word: ἀπὸ μέρους
  choice: sur quelques points
  rationale: Dans ce contexte, l’expression peut limiter la portée de l’écrit à certaines questions. La note conserve l’autre rattachement possible, selon lequel elle nuance plutôt le degré de hardiesse.
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: comme pour vous les rappeler
  rationale: La tournure rend la valeur explicative ou intentionnelle du participe et le sens de rappel porté par le verbe composé; le pronom renvoie naturellement aux points déjà connus des lecteurs.
- source_word: διὰ τὴν χάριν
  choice: à cause de la grâce
  rationale: διά suivi de l’accusatif exprime ici le motif ou le fondement. Le mot « grâce » préserve le vocabulaire paulinien sans réduire le sens dans le texte principal.
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: que Dieu m’a accordée
  rationale: La formulation active est idiomatique en français et conserve Dieu comme agent personnel du don.
theological_decisions:
- issue: Sens de χάρις dans le contexte
  choice: Conserver « grâce » dans le texte, avec une note indiquant sa portée ministérielle
  alternative: Traduire directement par « mission » ou « charge »
  rationale: Les versets 15–16 associent cette grâce au ministère de Paul auprès des non-Juifs. Toutefois, χάρις reste plus large que « mission »; le texte principal préserve donc le terme théologique et la note explicite sa nuance contextuelle.
translation_notes:
  register: Français international moderne, clair et digne. « Toutefois » assure une transition souple; « avec une certaine hardiesse » évite un calque raide du comparatif grec. Les notes préservent l’ambiguïté syntaxique de τολμηρότερον… ἀπὸ μέρους et la portée ministérielle de χάρις.
