id: ROM.15.23
reference: Romans 15:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: fr
  text: Mais maintenant, je n’ai plus de champ d’action dans ces régions[a], mais j’ai, depuis bien des années, le vif désir de venir chez vous,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je n’ai plus de place — ou de possibilité d’agir — dans ces régions ». L’expression grecque peut désigner l’absence de champ missionnaire restant, et non simplement l’absence d’un lieu physique.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Mais maintenant
  rationale: Rend naturellement la transition temporelle et adversative marquée par νυνί et δέ.
- source_word: μηκέτι τόπον ἔχων
  choice: je n’ai plus de champ d’action
  rationale: L’expression désigne ici, dans le contexte missionnaire, l’absence de territoire ou de possibilité restante pour poursuivre l’œuvre; «champ d’action» exprime ce sens métaphorique sans suggérer une simple absence de lieu physique.
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: dans ces régions
  rationale: κλίμα désigne une région ou une zone géographique; «régions» est précis et courant.
- source_word: ἐπιποθίαν δὲ ἔχων
  choice: et ... j’ai le vif désir
  rationale: ἐπιποθία exprime un désir intense. Le second δέ assure ici la progression; «et» est plus naturel en français après «Mais maintenant» tout en conservant la relation entre les propositions.
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: de venir chez vous
  rationale: Rend directement le contenu du désir. «Chez vous» est idiomatique pour un déplacement vers la communauté romaine.
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: depuis bien des années
  rationale: Rend la durée commencée dans le passé et encore actuelle; ἱκανῶν indique un nombre considérable d’années.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La phrase reste suspendue par une virgule, conformément à la syntaxe du passage qui se poursuit au verset suivant. La construction participiale grecque est transformée en propositions personnelles, plus naturelles en français.
