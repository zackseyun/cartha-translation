id: ROM.15.27
reference: Romans 15:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: fr
  text: Car ils l’ont fait de bon gré, et ils ont une dette envers eux. En effet, si les non-Juifs[a] ont eu part à leurs biens spirituels[b], ils doivent aussi se mettre à leur service sur le plan matériel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les nations » ; ici, le terme grec désigne les non-Juifs.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « leurs choses spirituelles ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « dans les choses charnelles » ; dans ce contexte, il s’agit d’un soutien matériel ou corporel, par contraste avec les biens spirituels.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: ils l’ont fait de bon gré
  rationale: L’aoriste exprime ici leur libre et heureuse volonté concernant la contribution évoquée au verset précédent. Cette formulation française rend à la fois l’assentiment volontaire et l’action implicite sans lourdeur.
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: ils ont une dette envers eux
  rationale: Cette tournure naturelle conserve l’idée d’une obligation morale réelle envers les bénéficiaires de Jérusalem.
- source_word: τὰ ἔθνη
  choice: les non-Juifs
  rationale: Dans ce contraste paulinien, le terme désigne les peuples autres que le peuple juif. « Non-Juifs » est clair en français international et évite l’ambiguïté de « nations ».
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: leurs biens spirituels
  rationale: L’adjectif substantivé désigne ce qui est de nature spirituelle. « Biens spirituels » demeure proche du grec tout en étant plus idiomatique que « choses spirituelles ».
- source_word: ἐκοινώνησαν
  choice: ont eu part à
  rationale: La formule rend naturellement l’idée de participation exprimée par κοινωνέω et sa construction au datif.
- source_word: ἐν τοῖς σαρκικοῖς
  choice: sur le plan matériel
  rationale: Dans le contexte de la collecte, σαρκικός concerne les besoins corporels et matériels, non une qualité morale pécheresse. La formulation fait ressortir le contraste avec les biens spirituels.
- source_word: λειτουργῆσαι
  choice: se mettre à leur service
  rationale: λειτουργέω exprime un service rendu, avec une nuance digne, voire cultuelle. Cette traduction conserve l’idée de service sans suggérer un ministère réservé au clergé.
theological_decisions:
- issue: Sens de σαρκικοῖς en contraste avec πνευματικοῖς
  choice: sur le plan matériel
  alternative: dans les choses de la chair
  rationale: La collecte destinée aux croyants de Jérusalem montre qu’il s’agit ici d’un soutien matériel ou corporel, et non de la chair comprise comme puissance du péché.
- issue: Référent de αὐτῶν et αὐτοῖς
  choice: les croyants de Jérusalem mentionnés dans le contexte immédiat
  alternative: Israël ou le peuple juif dans un sens plus large
  rationale: Romains 15.25-26 parle directement des saints de Jérusalem qui recevront la collecte. L’argument peut s’inscrire dans une dette plus large envers le peuple juif, mais les pronoms renvoient le plus immédiatement à ces croyants.
translation_notes:
  register: Français international moderne, naturel et digne. « Non-Juifs » privilégie la clarté contemporaine ; « se mettre à leur service » conserve la valeur honorable de λειτουργέω. Les trois marqueurs de notes figurent dans le texte principal et suivent les expressions qu’ils expliquent.
