  naturalness: Le français est clair et de registre approprié. « Assurant le service sacerdotal de la bonne nouvelle de Dieu » rend plus naturellement le rapport syntaxique et sémantique entre le verbe cultuel et « la bonne nouvelle ». « Esprit Saint » est la graphie internationale usuelle lorsqu’il s’agit du nom propre théologique.
  terminology: « Messie Jésus », « non-Juifs », « bonne nouvelle », « offrande », « agréée » et « sanctifiée » sont des choix cohérents et fidèles. Le vocabulaire sacerdotal doit demeurer explicite. La majuscule à « Saint » dans « Esprit Saint » améliore la cohérence terminologique sans ajouter de sens.
