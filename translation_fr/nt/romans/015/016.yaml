source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: fr
  text: afin que je sois ministre du Messie Jésus auprès des non-Juifs[a], assurant le service sacerdotal de la bonne nouvelle de Dieu[b], afin que l’offrande des non-Juifs[c] soit agréée, sanctifiée par l’Esprit Saint[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auprès des nations ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « accomplissant un service sacerdotal de la bonne nouvelle de Dieu » ; ou « officiant comme prêtre pour la bonne nouvelle de Dieu ».
    reason: lexical_alternative
  - marker: c
    text: 'Il s’agit probablement des non-Juifs eux-mêmes présentés à Dieu comme une offrande ; autre compréhension possible : « l’offrande apportée par les non-Juifs ».'
    reason: alternative_reading
  - marker: d
    text: Ou « dans l’Esprit Saint ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: ministre
  rationale: Le terme désigne ici une personne chargée d’un service, avec une dimension sacrée renforcée par le vocabulaire sacerdotal qui suit. « Ministre » conserve ces deux aspects sans imposer une fonction ecclésiale postérieure.
- source_word: Χριστοῦ Ἰησοῦ
  choice: du Messie Jésus
  rationale: Χριστός garde ici sa valeur de titre. « Messie Jésus » en exprime le sens plutôt que de simplement translittérer le terme.
- source_word: εἰς τὰ ἔθνη
  choice: auprès des non-Juifs
  rationale: Dans le contexte de la mission de Paul, ἔθνη désigne les peuples autres que le peuple juif. « Auprès de » exprime naturellement l’orientation de son ministère.
- source_word: ἱερουργοῦντα
  choice: exerçant un service sacerdotal
  rationale: Le verbe appartient explicitement au domaine cultuel et sacerdotal. Cette formulation préserve la métaphore sans présenter Paul comme détenteur d’un office sacerdotal au sens institutionnel ultérieur.
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: la bonne nouvelle de Dieu
  rationale: « Bonne nouvelle » rend directement εὐαγγέλιον dans une langue claire et actuelle, tout en conservant le génitif grec, qui peut indiquer la source ou l’objet de cette nouvelle.
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: l’offrande des non-Juifs
  rationale: La construction française conserve l’ambiguïté du génitif grec, même si le contexte favorise l’idée que les non-Juifs eux-mêmes constituent l’offrande.
- source_word: εὐπρόσδεκτος
  choice: agréée
  rationale: Dans un contexte d’offrande, « agréée » exprime naturellement l’idée d’une offrande favorablement reçue par Dieu.
- source_word: ἡγιασμένη
  choice: sanctifiée
  rationale: Le participe parfait passif décrit l’offrande comme placée dans un état de sainteté résultant d’une action de consécration.
- source_word: ἐν πνεύματι ἁγίῳ
  choice: par l’Esprit saint
  rationale: La préposition ἐν peut indiquer ici le moyen ou l’agent de la sanctification. La lecture « dans l’Esprit saint » demeure possible et est signalée en note.
theological_decisions:
- issue: La description du ministère de Paul en termes sacerdotaux
  choice: Conserver pleinement la métaphore sacerdotale appliquée au ministère de Paul parmi les non-Juifs.
  alternative: Comprendre le passage comme l’affirmation d’un office sacerdotal formel, ou au contraire neutraliser toute l’imagerie cultuelle.
  rationale: L’association de λειτουργός, ἱερουργέω et προσφορά impose de garder l’imagerie sacerdotale. Toutefois, le texte décrit métaphoriquement le service de la bonne nouvelle et ne présente pas Paul comme offrant un sacrifice expiatoire.
- issue: Le référent de « l’offrande des non-Juifs »
  choice: Laisser le texte principal ouvert tout en indiquant en note que les non-Juifs eux-mêmes sont probablement l’offrande.
  alternative: Une offrande apportée par les non-Juifs.
  rationale: Le contexte missionnaire et sacerdotal favorise la première lecture, mais le génitif grec permet aussi la seconde. La traduction ne doit donc pas supprimer cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. Le vocabulaire sacerdotal est maintenu sans archaïsme excessif. « Non-Juifs » est plus immédiatement compréhensible que « païens » ou « Gentils », tandis que « nations » est conservé en note. La phrase reste un fragment syntaxique introduit par « afin que », conformément à son lien avec le verset précédent.
