id: ROM.15.14
reference: Romans 15:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: fr
  text: Quant à moi, mes frères et sœurs[a], je suis moi-même convaincu, en ce qui vous concerne, que vous êtes vous aussi pleins de bonté, remplis de toute connaissance et capables de vous exhorter les uns les autres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « mes frères » ; ce terme peut s’adresser collectivement aux croyants, femmes et hommes.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi signifier « vous avertir », « vous reprendre » ou « vous instruire » les uns les autres.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: je suis convaincu
  rationale: Le parfait exprime ici un état présent et assuré résultant d’une persuasion acquise ; cette formulation est naturelle en français moderne.
- source_word: δέ
  choice: Quant à moi
  rationale: La particule introduit une transition légère plutôt qu’une opposition forte ; associée à καὶ αὐτὸς ἐγώ, cette tournure rend naturellement le changement de perspective.
- source_word: ἀδελφοί μου
  choice: mes frères et sœurs
  rationale: Dans l’adresse à l’ensemble de la communauté chrétienne de Rome, le pluriel grec masculin inclut ici les croyantes aussi bien que les croyants ; la formulation française rend explicite cette portée collective.
- source_word: καὶ αὐτὸς ἐγὼ
  choice: je suis moi-même
  rationale: Le pronom intensif et le pronom personnel soulignent l’assurance personnelle de Paul ; « moi-même » en conserve l’emphase sans lourdeur excessive.
- source_word: περὶ ὑμῶν
  choice: en ce qui vous concerne
  rationale: Cette expression rend clairement περί avec le génitif dans un registre français courant et digne.
- source_word: καὶ αὐτοὶ
  choice: vous êtes vous aussi
  rationale: « Vous » renforcé par « vous aussi » conserve à la fois la valeur additive de καί et l’insistance d’αὐτοί.
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: vous êtes pleins de bonté
  rationale: Le grec décrit l’abondance d’une bonté morale ; la traduction est directe, claire et idiomatique.
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: remplis de toute connaissance
  rationale: Le participe parfait décrit un état présent, tandis que πάσης garde une portée étendue que « toute connaissance » préserve sans la préciser abusivement.
- source_word: δυνάμενοι
  choice: capables
  rationale: Le participe exprime l’aptitude qui découle des qualités précédemment mentionnées.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Cette locution rend naturellement la réciprocité exprimée par le pronom grec.
- source_word: νουθετεῖν
  choice: vous instruire
  rationale: Le verbe désigne une instruction qui peut comporter conseil, avertissement ou correction. « Instruire » convient au contexte élogieux, tandis qu’une note conserve sa nuance corrective.
theological_decisions:
- issue: Portée de l’adresse ἀδελφοί dans une assemblée mixte
  choice: mes frères et sœurs
  alternative: mes frères
  rationale: Le masculin pluriel grec peut servir d’adresse collective à tous les membres de la communauté. Le français moderne « frères et sœurs » communique explicitement cette portée sans limiter l’adresse aux hommes.
- issue: Nuance corrective de νουθετεῖν
  choice: vous instruire les uns les autres
  alternative: vous avertir, vous reprendre ou vous exhorter les uns les autres
  rationale: Le contexte met en valeur la maturité des destinataires, ce qui favorise le terme englobant « instruire ». La note maintient toutefois la possibilité d’une instruction corrective et évite d’aplanir la gamme de sens du verbe.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve les emphases de Paul (« moi-même », « vous aussi ») tout en restant lisible. Les termes potentiellement ecclésiastiques ou ambigus sont expliqués dans les notes.
