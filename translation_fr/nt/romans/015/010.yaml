  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: fr
  text: 'Et il dit encore : « Réjouissez-vous, non-Juifs[a], avec son peuple. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nations ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: encore
  rationale: Dans une formule introduisant une nouvelle citation de l’Écriture, « encore » rend naturellement l’idée d’une citation supplémentaire.
- source_word: λέγει
  choice: il dit
  rationale: Le présent est conservé, conformément à la manière dont le Nouveau Testament présente souvent l’Écriture comme une parole qui continue de parler. Le sujet implicite demeure inchangé.
- source_word: Εὐφράνθητε
  choice: Réjouissez-vous
  rationale: Cet impératif exprime ici l’appel à se réjouir. « Réjouissez-vous » garde à la fois la force de l’ordre et le ton élevé de la citation.
- source_word: ἔθνη
  choice: non-Juifs
  rationale: Dans le raisonnement de Romains 15, le terme désigne les peuples autres qu’Israël et souligne leur participation à la louange avec le peuple de Dieu. « Non-Juifs » est clair en français moderne; le sens plus littéral « nations » est signalé en note.
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: avec son peuple
  rationale: La préposition μετά avec le génitif marque l’association. Cette formulation concise conserve aussi la portée d’alliance de « son peuple » sans préciser explicitement Israël.
theological_decisions:
- issue: Sens de ἔθνη dans une citation liée à l’unité entre Juifs et non-Juifs
  choice: non-Juifs
  alternative: nations
  rationale: Le contexte immédiat met l’accent sur les non-Juifs qui glorifient Dieu avec son peuple. La traduction principale rend cette opposition clairement, tandis que la note préserve le sens collectif plus large possible dans la citation scripturaire.
- issue: Référent de « son peuple »
  choice: conserver « son peuple » sans explicitation
  alternative: son peuple, Israël
  rationale: Le contexte scripturaire permet d’identifier le peuple à Israël, mais le grec ne le nomme pas ici. Ne pas l’ajouter évite de résoudre dans le texte une donnée laissée implicite.
translation_notes:
  register: Français moderne, courant et digne. « Non-Juifs » évite l’ambiguïté du mot français « Gentils », souvent opaque hors du langage religieux. La syntaxe brève conserve le caractère solennel de la citation.
