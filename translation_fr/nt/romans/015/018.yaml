id: ROM.15.18
reference: Romans 15:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: fr
  text: Car je n’oserai parler de rien, sinon de ce que le Messie a accompli par mon intermédiaire en vue de l’obéissance des non-Juifs[a], en parole et en actes[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des nations ».
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire le début du verset : « Car je n’ose parler de rien d’autre que de ce que le Messie a accompli par mon intermédiaire. »'
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: je n’oserai
  rationale: Le futur de τολμάω exprime ici la retenue déclarée de Paul. « Je n’oserai » est direct, naturel et conserve la nuance d’audace ou de hardiesse.
- source_word: τι λαλεῖν … ὧν οὐ
  choice: parler de rien, sinon de ce que
  rationale: La tournure restrictive grecque indique que Paul refuse de parler de quoi que ce soit en dehors de l’œuvre accomplie par le Messie. Cette formulation française rend clairement cette restriction sans en modifier la portée.
- source_word: κατειργάσατο
  choice: a accompli
  rationale: Le verbe désigne une action menée à bien ou produisant un résultat effectif. Le passé composé convient à une œuvre accomplie dont les effets demeurent pertinents.
- source_word: Χριστὸς
  choice: le Messie
  rationale: Χριστός garde ici sa valeur de titre et désigne celui qui agit par l’intermédiaire de Paul.
- source_word: δι’ ἐμοῦ
  choice: par mon intermédiaire
  rationale: 'διά avec le génitif marque l’intermédiaire ou l’instrument : le Messie demeure l’acteur principal, tandis que Paul est celui par qui il agit.'
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: en vue de l’obéissance des non-Juifs
  rationale: La formulation nominale préserve la relation de but ou de résultat exprimée par εἰς, sans préciser davantage la nature de cette obéissance. Dans le contexte de Romains, ἔθνη désigne principalement les peuples non juifs.
- source_word: λόγῳ καὶ ἔργῳ
  choice: en parole et en actes
  rationale: Cette expression française naturelle conserve le parallélisme entre ce qui est dit et ce qui est fait, tout en laissant ouverte son articulation exacte avec la proposition précédente.
theological_decisions:
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans ce passage, le terme peut être entendu comme un titre. « Le Messie » rend explicitement cette valeur sans introduire de précision doctrinale supplémentaire.
- issue: Sens de ἐθνῶν
  choice: les non-Juifs
  alternative: les nations
  rationale: Dans l’argumentation de Romains, le mot désigne couramment les peuples autres qu’Israël. « Les non-Juifs » rend ce contraste de façon claire, tandis que « les nations » reste une possibilité lexicale réelle.
- issue: Portée de λόγῳ καὶ ἔργῳ
  choice: en parole et en actes
  alternative: par la parole et par les actes
  rationale: Le grec peut présenter ces éléments comme les moyens de l’action accomplie ou les sphères dans lesquelles elle s’est manifestée. La formulation retenue préserve cette souplesse.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la structure argumentative de Paul, la primauté de l’action du Messie et la formulation nominale de « l’obéissance », afin de ne pas trancher inutilement entre but et résultat.
