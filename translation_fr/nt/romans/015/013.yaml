id: ROM.15.13
reference: Romans 15:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: fr
  text: Que le Dieu de l’espérance vous remplisse de toute joie et de toute paix dans la foi, afin que vous débordiez d’espérance par la puissance de l’Esprit Saint.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: Que le Dieu de l’espérance
  rationale: La tournure « Que… » rend naturellement en français l’optatif de souhait porté par πληρώσαι. δέ marque ici une liaison légère que le français peut laisser implicite sans créer un contraste artificiel. Le génitif décrit Dieu en relation avec l’espérance, notamment comme sa source, tout en conservant l’expression sobre du grec.
- source_word: πληρώσαι ὑμᾶς
  choice: vous remplisse
  rationale: Le subjonctif après « Que » exprime la bénédiction ou le souhait, et « remplir » conserve l’image de plénitude.
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: de toute joie et de toute paix
  rationale: Les génitifs indiquent ce dont les destinataires doivent être remplis. La répétition de « toute » est naturelle et rend explicitement la portée globale de πάσης sur les deux réalités coordonnées.
- source_word: ἐν τῷ πιστεύειν
  choice: dans la foi
  rationale: L’infinitif substantivé désigne ici le fait de croire comme cadre ou circonstance. « Dans la foi » est idiomatique en français biblique moderne et exprime cet état actif sans alourdir la phrase par « dans le fait de croire ».
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: afin que vous débordiez
  rationale: εἰς τό avec l’infinitif peut exprimer le but ou le résultat visé. « Afin que » convient au contexte de prière, et « déborder » garde l’image d’abondance de περισσεύω avec un français vivant.
- source_word: ἐν τῇ ἐλπίδι
  choice: d’espérance
  rationale: Après « déborder », le complément introduit par « de » est le tour français naturel pour exprimer la réalité abondante, tout en maintenant le lien lexical avec « le Dieu de l’espérance ».
- source_word: ἐν δυνάμει
  choice: par la puissance
  rationale: 'La préposition a ici une valeur instrumentale : cette abondance se produit au moyen de la puissance divine.'
- source_word: πνεύματος ἁγίου
  choice: de l’Esprit Saint
  rationale: Dans ce contexte paulinien, l’expression désigne l’Esprit divin. La majuscule et l’article correspondent à l’usage français courant, sans ajouter de précision étrangère au texte.
theological_decisions:
- issue: Référent de πνεύματος ἁγίου
  choice: l’Esprit Saint
  alternative: un esprit saint / l’esprit saint
  rationale: Le contexte paulinien désigne l’Esprit divin comme agent de puissance. La graphie française « l’Esprit Saint » identifie ce référent personnel sans développer une formulation doctrinale absente du verset.
- issue: Valeur de εἰς τὸ περισσεύειν
  choice: but ou résultat visé rendu par « afin que »
  alternative: simple conséquence rendue par « de sorte que »
  rationale: La construction grecque permet une nuance de but ou de résultat. Dans cette bénédiction, « afin que » rend le mouvement intentionnel de la prière sans exclure le résultat attendu.
translation_notes:
  register: Français international moderne, digne et fluide. Le verset conserve les images de plénitude et d’abondance ainsi que la répétition d’« espérance ». « Dans la foi » privilégie l’idiome français tout en rendant la sphère du fait de croire.
