id: ROM.15.11
reference: Romans 15:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: fr
  text: 'Et encore : « Toutes les nations[b], louez le Seigneur[a], et que tous les peuples le célèbrent ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « le SEIGNEUR », conformément à la source hébraïque de cette citation : dans la version grecque, le nom divin y est rendu par κύριος (« Seigneur »).'
    reason: alternative_reading
  - marker: b
    text: Ou « non-Juifs ». Le grec ἔθνη peut désigner les « nations » ou les « non-Juifs » ; la citation a ici une portée universelle, tout en s’accordant avec l’argument de Paul au sujet des non-Juifs.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ πάλιν
  choice: Et encore
  rationale: Introduit naturellement en français une nouvelle citation scripturaire tout en conservant les deux éléments grecs.
- source_word: Αἰνεῖτε
  choice: Louez
  rationale: Impératif présent à la deuxième personne du pluriel ; « Louez » est direct, naturel et digne.
- source_word: πάντα τὰ ἔθνη
  choice: vous toutes, nations
  rationale: ἔθνη désigne ici largement les nations, tout en pouvant évoquer les non-Juifs dans l’argument de Paul. La tournure vocative rend clairement l’adresse directe.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Représente directement κύριος dans le texte grec du Nouveau Testament ; la relation avec le nom divin dans la source hébraïque est signalée en note.
- source_word: ἐπαινεσάτωσαν
  choice: que ... célèbrent
  rationale: Rend naturellement l’impératif à la troisième personne et maintient une légère variation lexicale par rapport à αἰνεῖτε.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom renvoie sans ambiguïté au Seigneur et évite une répétition inutile.
- source_word: πάντες οἱ λαοί
  choice: tous les peuples
  rationale: Préserve la distinction entre λαοί, « peuples », et ἔθνη, « nations », ainsi que le parallélisme de la citation.
theological_decisions:
- issue: Traduction de κύριος dans une citation de l’Ancien Testament qui renvoie au nom divin
  choice: le Seigneur
  alternative: l’ÉTERNEL
  rationale: Le texte grec de Romains porte κύριος, rendu directement par « Seigneur ». La variante « l’ÉTERNEL » reflète plutôt la source hébraïque et demeure donc en note.
- issue: Sens de ἔθνη dans le contexte de l’intégration des non-Juifs
  choice: nations
  alternative: non-Juifs
  rationale: Dans la citation, le sens universel de « nations » est premier. « Non-Juifs » correspond néanmoins à une nuance contextuelle réelle dans l’argument de Paul et est conservé en note.
translation_notes:
  register: Français international moderne, naturel et soutenu sans archaïsme. Le parallélisme poétique est conservé par « nations » / « peuples » et la variation « louez » / « célèbrent ». Les marqueurs de notes sont placés immédiatement après les termes concernés.
