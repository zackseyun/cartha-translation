id: ROM.15.5
reference: Romans 15:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: fr
  text: Que le Dieu de la persévérance et de l’encouragement vous donne d’avoir une même attitude les uns envers les autres[a], conformément à Jésus le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de penser de la même manière les uns à l’égard des autres » ou « d’être animés d’une même pensée ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « selon le Messie Jésus » ; l’expression indique ici la conformité à Jésus le Messie, considéré comme la norme ou le modèle.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: Que le Dieu
  rationale: La particule δέ assure ici une transition légère, qu’il n’est pas nécessaire d’expliciter en français. L’optatif δῴη donne à l’ensemble la force d’un souhait-prière, naturellement exprimé par « Que… vous donne ».
- source_word: τῆς ὑπομονῆς
  choice: de la persévérance
  rationale: ὑπομονή désigne la capacité de tenir ferme dans l’épreuve. « Persévérance » rend cette constance active plus précisément que la simple patience.
- source_word: τῆς παρακλήσεως
  choice: et de l’encouragement
  rationale: παράκλησις peut évoquer l’encouragement, la consolation ou l’exhortation. Dans le contexte de Romains 15:4, « encouragement » conserve au mieux cette idée générale de soutien qui fortifie.
- source_word: δῴη
  choice: vous donne
  rationale: L’aoriste optatif de δίδωμι appartient à une formule de souhait ou de prière. La construction française « Que… vous donne » en restitue naturellement la valeur.
- source_word: τὸ αὐτὸ φρονεῖν
  choice: d’avoir une même attitude
  rationale: φρονεῖν porte sur la disposition intérieure, la manière de penser et l’orientation d’esprit. « Avoir une même attitude » est naturel en français et n’impose pas l’idée d’une uniformité absolue des opinions.
- source_word: ἐν ἀλλήλοις
  choice: les uns envers les autres
  rationale: Cette expression situe la disposition commune dans les relations mutuelles au sein de la communauté. « Les uns envers les autres » rend clairement cette dimension relationnelle.
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: conformément à Jésus le Messie
  rationale: κατά indique ici la conformité à une norme ou à un modèle. « Jésus le Messie » traduit Χριστός comme un titre tout en respectant l’ordre naturel du français.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Jésus le Messie
  alternative: Jésus-Christ / Christ Jésus
  rationale: Χριστός conserve ici sa valeur de titre. « Le Messie » en transmet le sens plutôt que de le traiter comme un simple élément de nom, tandis que l’ordre « Jésus le Messie » est idiomatique en français.
- issue: Portée de τὸ αὐτὸ φρονεῖν
  choice: une même attitude
  alternative: penser exactement la même chose en toute matière
  rationale: Le grec appelle à une orientation d’esprit harmonieuse dans les relations communautaires, sans préciser qu’il faudrait partager une opinion identique sur chaque question. La formulation retenue préserve cette portée sans la durcir.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve la structure de souhait-prière du grec, emploie « persévérance » et « encouragement » dans leur sens communautaire, et évite un tour trop ecclésiastique ou une affirmation d’uniformité totale.
