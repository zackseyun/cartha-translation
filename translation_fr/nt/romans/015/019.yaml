id: ROM.15.19
reference: Romans 15:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: fr
  text: par la puissance de signes et de prodiges, par la puissance de l’Esprit[a], de sorte que, depuis Jérusalem et les régions alentour jusqu’en Illyrie, j’ai pleinement proclamé la bonne nouvelle du Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de l’Esprit Saint ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « j’ai accompli pleinement la proclamation de la bonne nouvelle du Messie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: par la puissance de
  rationale: La préposition ἐν exprime ici le moyen ou l’action efficace. « Par la puissance de » est naturel en français et maintient la répétition emphatique.
- source_word: σημείων καὶ τεράτων
  choice: signes et prodiges
  rationale: Cette paire biblique traditionnelle désigne des actes extraordinaires attestant l’action divine, sans qu’il soit nécessaire d’ajouter « miraculeux ».
- source_word: πνεύματος
  choice: l’Esprit
  rationale: Dans ce contexte paulinien, le terme désigne très probablement l’Esprit de Dieu. La formulation retenue exprime ce référent sans ajouter « Saint » au texte principal.
- source_word: ὥστε
  choice: Ainsi
  rationale: La conjonction introduit le résultat du ministère exercé par cette puissance. « Ainsi » rend ce rapport avec fluidité.
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: depuis Jérusalem, en rayonnant dans toutes les régions
  rationale: Le κύκλῳ adverbial évoque une activité déployée dans les régions alentour, et non nécessairement un parcours circulaire précis.
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: jusqu’en Illyrie
  rationale: μέχρι indique la limite géographique atteinte. « Illyrie » est la forme française courante du nom de cette région.
- source_word: πεπληρωκέναι
  choice: j’ai pleinement proclamé
  rationale: Avec « la bonne nouvelle » pour complément, πληρόω désigne ici le fait d’en mener la proclamation à sa pleine mesure dans l’espace indiqué. Le parfait présente cette œuvre comme accomplie, tandis qu’une note conserve la formulation plus littérale.
- source_word: τὸ εὐαγγέλιον
  choice: la bonne nouvelle
  rationale: Cette traduction restitue directement le sens de εὐαγγέλιον dans un français actuel et accessible.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός conserve ici sa valeur de titre dans l’expression « la bonne nouvelle du Messie » ; « Messie » en rend explicitement le sens.
theological_decisions:
- issue: Référent de πνεύματος
  choice: l’Esprit, compris comme l’Esprit de Dieu
  alternative: l’Esprit Saint
  rationale: Le contexte des signes, des prodiges et du ministère apostolique soutient fortement le référent divin. Le texte principal ne développe toutefois pas le grec au-delà de « l’Esprit ».
- issue: Sens de πεπληρωκέναι τὸ εὐαγγέλιον
  choice: j’ai pleinement proclamé la bonne nouvelle
  alternative: j’ai mené la bonne nouvelle à son plein accomplissement
  rationale: Le verbe peut évoquer l’accomplissement ou la plénitude. Avec εὐαγγέλιον comme objet et une étendue géographique comme cadre, il s’agit vraisemblablement d’avoir porté la proclamation à sa pleine mesure, sans affirmer que toute personne de ces régions a été évangélisée.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition « par la puissance de » est conservée pour respecter l’emphase grecque. « En rayonnant » rend l’expansion régionale de κύκλῳ sans imposer un itinéraire circulaire précis.
