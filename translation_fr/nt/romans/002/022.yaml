id: ROM.2.22
reference: Romans 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: fr
  text: 'Toi qui dis : « Ne commets pas d’adultère », commets-tu l’adultère ? Toi qui as les idoles en horreur, pilles-tu les temples[a] ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus largement : « commets-tu un sacrilège ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: Toi qui dis
  rationale: L’article suivi du participe présent désigne ici une personne représentative directement interpellée. « Toi qui dis » restitue naturellement en français l’adresse rhétorique de Paul.
- source_word: μὴ μοιχεύειν
  choice: « Ne commets pas d’adultère »
  rationale: L’infinitif précédé de μή exprime le contenu d’une interdiction. La formulation directe conserve la vigueur du discours et « commettre l’adultère » est l’équivalent français précis et usuel.
- source_word: μοιχεύεις
  choice: commets-tu l’adultère ?
  rationale: Le présent de l’indicatif prend la forme d’une question rhétorique accusatrice. Le présent français en préserve la portée générale.
- source_word: ὁ βδελυσσόμενος
  choice: Toi qui as … en horreur
  rationale: Le verbe exprime une forte répulsion. « Avoir en horreur » est idiomatique, actuel et suffisamment intense sans être archaïque.
- source_word: τὰ εἴδωλα
  choice: les idoles
  rationale: Dans ce contexte, le terme désigne des représentations cultuelles auxquelles un culte est rendu. « Idoles » est clair et conventionnel.
- source_word: ἱεροσυλεῖς
  choice: dépouilles-tu les temples
  rationale: Le verbe peut désigner concrètement le fait de voler les biens d’un temple. Cette traduction conserve l’image historique et l’ironie liée à la mention des idoles, tandis que le sens plus large est signalé en note.
theological_decisions:
- issue: Portée de ἱεροσυλεῖς
  choice: 'Sens concret : « dépouilles-tu les temples ? »'
  alternative: 'Sens plus large : « commets-tu un sacrilège ? »'
  rationale: Le sens concret est bien attesté et s’accorde étroitement avec la référence immédiate aux idoles. Toutefois, le verbe peut avoir une portée plus générale ; cette ambiguïté réelle est conservée au moyen d’une note.
translation_notes:
  register: Français moderne, direct et digne. La répétition de « Toi qui » et les deux questions parallèles préservent le rythme accusateur de la diatribe paulinienne. Le tutoiement singulier correspond à l’interpellation d’un interlocuteur représentatif.
