language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: fr
  text: En effet, quand des non-Juifs[a], qui n’ont pas la loi, accomplissent naturellement[b] ce que prescrit la loi[c], eux qui n’ont pas la loi sont une loi pour eux-mêmes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des gens des autres nations » ; le terme grec désigne ici ceux qui ne sont pas juifs.
    reason: lexical_alternative
  - marker: b
    text: Ou « par nature » ; certains comprennent « instinctivement ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « font les choses de la loi ».'
    reason: formal_equivalence
lexical_decisions:
- source_word: ἔθνη
  choice: non-Juifs
  rationale: Dans ce contexte paulinien, le terme désigne les peuples autres que le peuple juif, en contraste avec ceux qui possèdent la loi mosaïque. « Non-Juifs » est plus immédiatement compréhensible en français courant que « païens » et plus précis ici que « nations ».
- source_word: νόμον / νόμου / νόμος
  choice: la loi / loi
  rationale: La minuscule évite d’imposer une convention typographique confessionnelle. L’article défini désigne la loi connue dans le contexte, tandis que « se tenir lieu de loi » conserve l’écho rhétorique du dernier νόμος prédicatif.
- source_word: φύσει
  choice: naturellement
  rationale: Ce rendu français reste ouvert quant au mécanisme envisagé — disposition naturelle, condition ou conduite spontanée — sans imposer l’interprétation plus étroite « instinctivement ».
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: accomplissent ce que prescrit la loi
  rationale: Cette formulation naturelle exprime l’idiome grec, littéralement « font les choses de la loi », sans suggérer nécessairement une observance complète de toute la loi.
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: se tiennent lieu de loi à eux-mêmes
  rationale: Cette expression française idiomatique préserve l’idée qu’en l’absence de la loi possédée extérieurement, ils remplissent pour eux-mêmes une fonction analogue à celle d’une loi, sans accentuer une auto-législation autonome.
theological_decisions:
- issue: Sens de φύσει en rapport avec la connaissance morale et la conscience
  choice: Conserver dans le texte principal le terme ouvert « naturellement ».
  alternative: « instinctivement » ou « en vertu de leur nature »
  rationale: Le mot grec ne tranche pas à lui seul entre connaissance morale innée, condition naturelle et comportement spontané. Le rendu choisi préserve cette tension dans l’argument de Paul.
- issue: Portée de τὰ τοῦ νόμου ποιῶσιν
  choice: « accomplissent ce que prescrit la loi » sans affirmer qu’ils observent toute la loi.
  alternative: « font les choses de la loi »
  rationale: Le pluriel substantivé désigne ce qui relève de la loi, mais le verset ne dit pas explicitement que ces personnes en accomplissent toutes les prescriptions. La traduction reste donc non totalisante.
translation_notes:
  register: Français international moderne, naturel et digne. « Non-Juifs » évite le caractère potentiellement péjoratif ou historiquement chargé de « païens ». La syntaxe a été légèrement réorganisée pour rendre clairement le contraste entre l’absence de la loi et la fonction de loi, tout en conservant les répétitions conceptuelles du grec.
