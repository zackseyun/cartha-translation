  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: fr
  text: Mais si toi, tu portes le nom de Juif[a], tu t’appuies sur la Loi[b] et tu te glorifies en Dieu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu es appelé Juif » ou « tu te donnes le nom de Juif ».
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tu te reposes sur la Loi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: Mais si
  rationale: Conserve la valeur conditionnelle de εἰ et la légère nuance de contraste ou de transition portée par δέ.
- source_word: Ἰουδαῖος
  choice: Juif
  rationale: Dans le raisonnement de Romains, le terme désigne principalement l’identité ethnoreligieuse, et non simplement l’origine géographique.
- source_word: ἐπονομάζῃ
  choice: tu te donnes le nom de
  rationale: La tournure pronominale rend la nuance réflexive du moyen et l’idée de revendiquer ou de porter cette désignation, tout en préparant le ton critique de Paul.
- source_word: ἐπαναπαύῃ
  choice: tu t’appuies sur
  rationale: Exprime naturellement en français le fait de placer sa confiance dans la Loi, plutôt qu’un repos physique.
- source_word: νόμῳ
  choice: la Loi
  rationale: La majuscule signale ici la Loi mosaïque comme réalité reconnue dans l’alliance; l’article est requis par l’usage français.
- source_word: καυχᾶσαι
  choice: tu mets ta fierté
  rationale: Rend le verbe paulinien sans décider à lui seul si la fierté évoquée est légitime ou présomptueuse; le contexte en détermine la portée.
- source_word: ἐν θεῷ
  choice: en Dieu
  rationale: Conserve directement la construction avec ἐν et son objet, Dieu.
theological_decisions:
- issue: Portée de καυχᾶσαι ἐν θεῷ
  choice: tu mets ta fierté en Dieu
  alternative: tu te glorifies en Dieu
  rationale: La formulation retenue préserve l’ambivalence entre une fierté ayant Dieu pour fondement et une prétention religieuse critiquée par le contexte, sans trancher prématurément.
translation_notes:
  register: Français moderne, courant et digne. La reprise de « si » devant les trois propositions clarifie la longue condition qui se poursuit aux versets suivants. « Toi » fait ressortir le pronom grec emphatique σὺ. La phrase reste ouverte par une virgule, conformément à la syntaxe inachevée de ce verset isolé.
