id: ROM.2.20
reference: Romans 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: fr
  text: instructeur des insensés, enseignant des tout-petits, ayant dans la Loi la forme[a] de la connaissance et de la vérité—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’expression concrète » ou « la formulation » de la connaissance et de la vérité.
    reason: μόρφωσις peut désigner une forme, une formulation ou une expression concrète; « forme » préserve l’ambiguïté du grec.
lexical_decisions:
- source_word: παιδευτὴν
  choice: éducateur
  rationale: Le nom désigne quelqu’un qui forme, instruit ou corrige. « Éducateur » conserve l’idée de formation sans accentuer indûment la punition.
- source_word: ἀφρόνων
  choice: des insensés
  rationale: Le terme qualifie ceux qui manquent de jugement. « Insensés » garde la tonalité dépréciative de cette prétention rhétorique.
- source_word: διδάσκαλον
  choice: maître
  rationale: Dans cette série de titres, « maître » désigne naturellement celui qui enseigne et évite la répétition sonore avec « éducateur ».
- source_word: νηπίων
  choice: des tout-petits
  rationale: Le mot désigne littéralement de très jeunes enfants et peut évoquer figurativement des personnes immatures. « Tout-petits » préserve l’image sans l’alourdir.
- source_word: ἔχοντα
  choice: possédant
  rationale: Le participe exprime ici ce que le personnage se considère comme ayant. « Possédant » s’intègre naturellement à la série de qualificatifs.
- source_word: μόρφωσιν
  choice: l’expression
  rationale: μόρφωσις peut désigner une forme, une formulation ou une manifestation concrète. « Expression » indique que la connaissance et la vérité trouvent leur forme dans la Loi, tout en laissant l’alternative littérale en note.
- source_word: γνώσεως
  choice: de la connaissance
  rationale: « Connaissance » est l’équivalent direct et forme avec « vérité » le couple abstrait du grec.
- source_word: ἀληθείας
  choice: de la vérité
  rationale: « Vérité » rend directement le terme grec et préserve son association avec la connaissance.
- source_word: ἐν τῷ νόμῳ
  choice: dans la Loi
  rationale: La préposition est rendue par « dans » et la majuscule éditoriale signale que νόμος renvoie ici à la Loi juive.
theological_decisions:
- issue: Portée de μόρφωσις appliqué à la Loi
  choice: « l’expression »
  alternative: « la forme » ou « l’incarnation »
  rationale: « Expression » ne réduit pas la Loi à une simple apparence et n’introduit pas non plus la forte connotation christologique que pourrait prendre « incarnation » en français.
translation_notes:
  register: Fragment syntaxiquement rattaché au verset précédent, conservé en minuscules et terminé par un tiret. Registre actuel et digne; « tout-petits » maintient l’image vive de très jeunes enfants.
