id: ROM.2.2
reference: Romans 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: fr
  text: Or, nous savons que le jugement de Dieu contre ceux qui commettent de tels actes est conforme à la vérité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque peut aussi se rendre par « correspond à la réalité » ; le jugement de Dieu s’accorde avec ce qui est vrai.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: nous savons
  rationale: Le parfait οἶδα a ici un sens présent. « Nous savons » en donne l’équivalent français direct et naturel.
- source_word: δέ
  choice: Or
  rationale: δέ assure ici la progression du discours sans marquer nécessairement une forte opposition. « Or » convient à cette transition argumentative en français.
- source_word: κρίμα
  choice: jugement
  rationale: κρίμα désigne l’acte ou la décision judiciaire de Dieu. « Jugement » conserve cette portée générale sans la réduire à la seule condamnation.
- source_word: κατὰ ἀλήθειαν
  choice: est conforme à la vérité
  rationale: La formule exprime l’accord du jugement divin avec la vérité ou la réalité. Cette formulation reste explicite tout en étant idiomatique en français.
- source_word: ἐπὶ
  choice: contre
  rationale: Dans ce contexte de jugement défavorable portant sur des personnes, ἐπί indique la direction du jugement et se rend naturellement par « contre ».
- source_word: τὰ τοιαῦτα
  choice: de tels actes
  rationale: Le neutre pluriel renvoie aux comportements évoqués dans le contexte. « De tels actes » est plus naturel ici que « de telles choses » et explicite seulement la catégorie grammaticale impliquée par πράσσω.
- source_word: πράσσοντας
  choice: ceux qui commettent
  rationale: Le participe présent désigne ceux dont la conduite consiste à accomplir ces actes. « Commettent » convient en français à des actes moralement répréhensibles, sans imposer à lui seul une valeur aspectuelle excessive.
theological_decisions:
- issue: Faut-il rendre κατὰ ἀλήθειαν par une formule explicite liée à la vérité ou par l’adverbe interprétatif « justement » ?
  choice: est conforme à la vérité
  alternative: juge avec justice
  rationale: La formulation retenue préserve le lien explicite établi par Paul entre le jugement de Dieu et la vérité, au lieu de le réduire à l’idée, certes proche mais plus interprétative, de justice.
translation_notes:
  register: Français international moderne, clair et digne. L’ordre des constituants a été légèrement réorganisé pour produire une phrase naturelle tout en conservant le nom « jugement », la direction défavorable exprimée par « contre » et la référence explicite à la vérité.
