id: ROM.2.3
reference: Romans 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: fr
  text: Mais toi qui juges ceux qui commettent de telles choses et qui les commets toi-même, penses-tu échapper au jugement de Dieu ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογίζῃ
  choice: penses-tu vraiment
  rationale: Le verbe désigne ici une conviction ou un calcul mental soumis à la question rhétorique. « Penses-tu vraiment » est naturel en français et fait ressortir, sans surtraduire, la supposition contestée.
- source_word: ὦ ἄνθρωπε ὁ κρίνων
  choice: toi qui juges
  rationale: Le vocatif vise un interlocuteur humain représentatif dans le style de la diatribe. En français actuel, « toi qui juges » conserve l'interpellation directe et le singulier sans employer le peu naturel « ô homme ».
- source_word: τὰ τοιαῦτα πράσσοντας
  choice: ceux qui commettent de tels actes
  rationale: « Commettre de tels actes » exprime une conduite effective et convient aux fautes évoquées dans le contexte. Cette formulation permet aussi de garder une légère variation avec ποιῶν.
- source_word: καὶ ποιῶν αὐτά
  choice: tout en les faisant toi-même
  rationale: La tournure rend l'accusation de contradiction morale et fait ressortir le contraste porté par le contexte ainsi que par le pronom explicite σύ dans la proposition suivante.
- source_word: ἐκφεύξῃ
  choice: échapperas-tu
  rationale: Le futur français convient à la portée prospective de la question et « échapper à » rend précisément l'idée de se soustraire au jugement.
- source_word: τὸ κρίμα τοῦ θεοῦ
  choice: au jugement de Dieu
  rationale: « Jugement » garde la portée judiciaire générale de κρίμα sans la réduire au seul verdict ou à la seule peine.
theological_decisions:
- issue: Portée de l'adresse ὦ ἄνθρωπε
  choice: 'Interpellation singulière et représentative : « toi qui juges »'
  alternative: « ô homme » ou « ô personne »
  rationale: Le grec interpelle un individu représentatif plutôt qu'il ne formule ici une doctrine propre à un sexe. La traduction conserve la force personnelle de l'adresse sans introduire une restriction masculine absente de la visée contextuelle.
translation_notes:
  register: Français international moderne, direct et digne. La structure en question rhétorique est conservée, ainsi que le contraste entre juger autrui et agir de même. L'interjection littérale « ô homme » a été évitée parce qu'elle sonne archaïque ou artificielle en français courant.
