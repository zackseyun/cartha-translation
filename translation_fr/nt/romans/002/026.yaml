id: ROM.2.26
reference: Romans 2:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: fr
  text: Si donc celui qui est incirconcis[a] observe les exigences de la loi, son incirconcision ne sera-t-elle pas comptée comme circoncision ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si donc l’incirconcision observe… » Le nom « incirconcision » désigne ici la personne incirconcise.'
    reason: alternative lexicale et précision sur la métonymie
lexical_decisions:
- source_word: ἀκροβυστία
  choice: celui qui est incirconcis / son incirconcision
  rationale: Le nom signifie littéralement « incirconcision », mais sa première occurrence désigne ici, par métonymie, une personne incirconcise, comme le confirme αὐτοῦ (« son »). La seconde occurrence garde le sens abstrait.
- source_word: δικαιώματα
  choice: les exigences
  rationale: Le pluriel désigne ce que la loi prescrit ou exige. « Exigences » est clair en français moderne et n’ajoute pas l’idée explicite de « justes exigences ».
- source_word: φυλάσσῃ
  choice: observe
  rationale: Dans le contexte de prescriptions légales, « observer » exprime naturellement l’idée de garder et de mettre en pratique.
- source_word: λογισθήσεται
  choice: sera comptée
  rationale: Ce choix conserve le langage de mise au compte propre à λογίζομαι, sans employer le plus vieilli « imputée ».
- source_word: εἰς περιτομήν
  choice: comme circoncision
  rationale: La préposition marque ici le statut ou la catégorie dans laquelle l’incirconcision est comptée.
- source_word: οὐχ
  choice: ne sera-t-elle pas… ?
  rationale: La négation introduit une question rhétorique qui appelle une réponse affirmative.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et soutenu. La formulation conserve la condition ainsi que la force rhétorique de la question, sans préciser si Paul envisage un cas réel ou hypothétique.
