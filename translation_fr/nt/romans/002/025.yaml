id: ROM.2.25
reference: Romans 2:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: fr
  text: La circoncision est certes utile si tu mets la loi en pratique ; mais si tu transgresses la loi, ta circoncision est devenue incirconcision.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Paul ne décrit pas ici l’annulation physique de la circoncision, mais le renversement de sa valeur comme signe de l’alliance lorsque la loi est transgressée.
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: la circoncision
  rationale: Le nom abstrait conserve la catégorie d’alliance employée par Paul et son opposition directe avec ἀκροβυστία.
- source_word: μὲν γὰρ
  choice: certes
  rationale: « Certes » marque l’affirmation initiale tout en préparant naturellement le contraste introduit par « mais ».
- source_word: ὠφελεῖ
  choice: est utile
  rationale: Cette formulation française actuelle exprime l’utilité ou l’avantage réel, mais conditionnel, de la circoncision.
- source_word: ἐὰν νόμον πράσσῃς
  choice: si tu mets la loi en pratique
  rationale: La tournure rend le sens concret de πράσσω, « faire, pratiquer », sans réduire la loi à une simple connaissance ou profession.
- source_word: παραβάτης νόμου ᾖς
  choice: si tu transgresses la loi
  rationale: La formulation verbale est plus naturelle en français que « si tu es un transgresseur de la loi », tout en conservant l’idée explicite de violation.
- source_word: ἡ περιτομή σου
  choice: ta circoncision
  rationale: Le possessif et le tutoiement préservent l’adresse directe et la force rhétorique du grec.
- source_word: ἀκροβυστία
  choice: incirconcision
  rationale: Dans ce contexte, le terme désigne l’état opposé à la circoncision sur le plan de l’alliance, plutôt que le prépuce au sens anatomique.
- source_word: γέγονεν
  choice: est devenue
  rationale: Le passé composé rend le parfait grec comme un changement ayant produit un état présent, sans ajouter « considérée comme » ou « comptée comme ».
theological_decisions:
- issue: La dernière proposition décrit-elle un changement physique ou un renversement de statut lié à l’alliance ?
  choice: Conserver l’expression forte et concrète « ta circoncision est devenue incirconcision » dans le texte principal.
  alternative: « ta circoncision est considérée comme une incirconcision » ou « ne compte plus comme circoncision »
  rationale: Le grec formule directement un devenir et non une simple évaluation. La traduction retenue préserve donc la tension et la vigueur du paradoxe paulinien, tandis que la note en précise la portée contextuelle sans affaiblir le texte.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement suit le singulier grec et maintient l’interpellation personnelle. « Incirconcision », terme biblique précis mais moins courant, est conservé afin de reproduire le contraste lexical de Paul.
