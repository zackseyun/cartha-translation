  text: τοῖς μὲν καθ’ ὑπομονὴν ἔργου ἀγαθοῦ δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν ζητοῦσιν ζωὴν αἰώνιον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: fr
  text: la vie éternelle à ceux qui, par leur persévérance dans la pratique du bien, recherchent la gloire, l’honneur et l’immortalité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: par leur persévérance à faire le bien
  rationale: Cette formulation française naturelle exprime la persévérance caractérisant l’accomplissement du bien, sans réduire ἔργον ἀγαθόν à une œuvre bonne isolée.
- source_word: ἀφθαρσίαν
  choice: l’immortalité
  rationale: Dans cette série eschatologique, « immortalité » rend naturellement l’idée d’un état soustrait à la corruption et à la mort; « incorruptibilité » resterait une traduction plus formelle possible.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Rend directement l’expression grecque consacrée, qui désigne ici la vie accordée lors du jugement.
theological_decisions:
- issue: Rapport entre la persévérance à faire le bien et la vie éternelle
  choice: Conserver sans l’expliquer la formulation conditionnelle du verset
  alternative: Ajouter une précision sur la foi, la grâce ou le mérite
  rationale: Le grec affirme ici que Dieu donne la vie éternelle à ceux qui persévèrent à faire le bien; la traduction ne doit ni résoudre ni atténuer la tension théologique en ajoutant des éléments absents du verset.
translation_notes:
  register: 'Français moderne, clair et digne. Le fragment conserve la syntaxe du contexte immédiat: « la vie éternelle » est le complément du verbe « rendra » au verset 6.'
