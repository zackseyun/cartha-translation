  variant: modern international French
source:
  edition: SBLGNT
  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: fr
  text: Il y aura détresse et angoisse pour toute âme humaine[a] qui fait le mal, pour le Juif d’abord, et aussi pour le Grec[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « toute personne » ou « tout être humain ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « le Grec » désigne le non-Juif dans l’opposition entre Juif et Grec.
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: détresse
  rationale: « Détresse » exprime une souffrance ou une épreuve accablante en français courant et forme avec « angoisse » un couple intense sans confondre les deux termes grecs.
- source_word: στενοχωρία
  choice: angoisse
  rationale: Le mot évoque littéralement un espace resserré et, au figuré, une situation oppressante. « Angoisse » restitue naturellement cette sensation d’étouffement intérieur.
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: sur toute âme humaine
  rationale: Cette formulation conserve l’image concrète de ψυχή et rend clairement la portée générique de ἀνθρώπου. Une note signale l’équivalent français plus idiomatique « toute personne ».
- source_word: τοῦ κατεργαζομένου τὸ κακόν
  choice: qui fait le mal
  rationale: Le participe substantivé désigne celui qui accomplit effectivement le mal. « Fait le mal » est direct, naturel et n’ajoute pas l’idée nécessaire d’une pratique habituelle.
- source_word: Ἰουδαίου
  choice: Juif
  rationale: Dans l’opposition récurrente de Romains entre Juif et Grec, le terme désigne le peuple juif plutôt que le seul habitant de la Judée.
- source_word: πρῶτον
  choice: d’abord
  rationale: « D’abord » préserve l’idée de priorité ou d’ordre sans préciser indûment la nature de cette priorité.
- source_word: Ἕλληνος
  choice: Grec
  rationale: « Grec » conserve le terme employé par Paul et son opposition littérale avec « Juif »; la note explicite sa portée contextuelle.
theological_decisions:
- issue: Explicitation du prédicat sous-entendu dans la formulation grecque compacte
  choice: La détresse et l’angoisse s’abattront
  alternative: Détresse et angoisse sur toute âme humaine
  rationale: Le grec présente une proposition nominale dont le verbe doit être compris à partir du contexte du jugement à venir. Le futur français rend la phrase complète sans résoudre une question doctrinale étrangère au texte.
- issue: Portée de ψυχή dans « toute âme humaine »
  choice: Conserver « âme » dans le texte
  alternative: Traduire directement par « toute personne »
  rationale: Ici, ψυχή peut désigner la personne entière, mais conserver « âme » maintient l’expression et la solennité du grec sans imposer une définition précise de la composition de l’être humain.
- issue: Sens contextuel de « Grec »
  choice: Garder le terme ethnique littéral « Grec »
  alternative: Employer « non-Juif »
  rationale: Le couple « Juif et Grec » est une formulation paulinienne significative. La traduction littérale préserve cette tension, tandis qu’une note indique que « Grec » représente ici le non-Juif dans cette opposition.
translation_notes:
  register: Français international moderne, solennel mais accessible. La répétition de « sur » devant « le Juif » clarifie que la détresse et l’angoisse atteignent tous ceux qui font le mal, tout en conservant l’ordre et la structure du grec.
