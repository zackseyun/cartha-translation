  text: πέποιθάς τε σεαυτὸν ὁδηγὸν εἶναι τυφλῶν, φῶς τῶν ἐν σκότει,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: fr
  text: et tu es convaincu d’être toi-même un guide pour les aveugles, une lumière pour ceux qui sont dans les ténèbres,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: tu es convaincu
  rationale: Le parfait exprime un état durable d’assurance ou de persuasion. « Tu es convaincu » rend ici la ferme certitude que la personne nourrit à son propre sujet.
- source_word: τε
  choice: et
  rationale: La particule relie cette proposition à la suite commencée dans les versets précédents. Le simple « et » en conserve naturellement la valeur de liaison.
- source_word: σεαυτὸν
  choice: toi-même
  rationale: Le pronom réfléchi porte une nuance d’insistance sur l’idée que la personne se considère elle-même de cette manière.
- source_word: ὁδηγὸν
  choice: un guide
  rationale: « Un guide » restitue précisément et naturellement l’image d’une personne qui conduit autrui.
- source_word: τυφλῶν
  choice: pour les aveugles
  rationale: Le génitif dépend de « guide ». En français actuel, « un guide pour les aveugles » exprime clairement cette relation sans alourdir la phrase.
- source_word: φῶς
  choice: une lumière
  rationale: Le nom est employé métaphoriquement pour une personne qui éclaire ou oriente les autres; « une lumière » conserve directement cette image.
- source_word: τῶν ἐν σκότει
  choice: ceux qui sont dans les ténèbres
  rationale: Cette formulation personnelle préserve la métaphore de l’obscurité tout en restant idiomatique et claire en français.
