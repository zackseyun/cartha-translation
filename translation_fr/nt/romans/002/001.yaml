  to: C’est pourquoi tu es inexcusable, ô être humain, qui que tu sois, toi qui juges. Car, en jugeant l’autre, tu te condamnes toi-même, puisque toi qui juges pratiques les mêmes choses.
  rationale: 'La seule correction nécessaire remplace « lorsque tu juges » par « en jugeant » afin de mieux représenter la construction grecque ἐν ᾧ. Le reste du texte est conservé : il est fidèle au grec, naturel dans un français moderne de registre soutenu, et ne réduit pas indûment la portée générique de l’adresse.'
