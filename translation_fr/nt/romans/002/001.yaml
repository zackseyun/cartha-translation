id: ROM.2.1
reference: Romans 2:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: fr
  text: C’est pourquoi tu es inexcusable, ô être humain, qui que tu sois, toi qui juges. Car, en jugeant l’autre, tu te condamnes toi-même, puisque toi qui juges pratiques les mêmes choses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: C’est pourquoi
  rationale: Introduit naturellement en français la conséquence tirée de l’argument précédent.
- source_word: ἀναπολόγητος
  choice: inexcusable
  rationale: Terme français courant qui conserve la nuance judiciaire d’une personne dépourvue de défense valable.
- source_word: ὦ ἄνθρωπε πᾶς ὁ κρίνων
  choice: ô être humain, qui que tu sois, toi qui juges
  rationale: « Être humain » exprime la portée représentative de ἄνθρωπος sans restreindre l’adresse aux hommes; « qui que tu sois » restitue la force universalisante de πᾶς, et « toi qui juges » l’identification participiale.
- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: lorsque tu juges l’autre
  rationale: Rend clairement la valeur circonstancielle de la construction grecque compacte; le jugement porté sur autrui constitue le contexte et le moyen de l’auto-condamnation.
- source_word: κατακρίνεις
  choice: tu te condamnes
  rationale: Conserve la force judiciaire, plus marquée que celle du simple verbe « juger ».
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: puisque… tu pratiques les mêmes choses
  rationale: « Pratiquer » rend la conduite habituelle suggérée par le présent de πράσσω, tandis que « puisque » expose le motif de la condamnation.
theological_decisions:
- issue: Portée du masculin représentatif dans l’interpellation de Paul
  choice: « ô être humain » dans le texte principal
  alternative: « ô homme »
  rationale: ἄνθρωπος est morphologiquement masculin singulier, mais désigne ici toute personne qui juge. « Être humain » conserve cette portée générale en français moderne sans affaiblir l’interpellation directe.
- issue: Rapport entre juger autrui et se condamner soi-même
  choice: Conserver l’affirmation directe selon laquelle celui qui juge se condamne lui-même
  alternative: Expliciter un critère ou un fondement précis de jugement
  rationale: La construction ἐν ᾧ peut comporter une nuance temporelle et instrumentale. Le texte français préserve le lien sans ajouter un fondement de jugement non explicité par le verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’apostrophe « ô être humain » garde la solennité rhétorique du grec; le tutoiement singulier reproduit l’adresse directe. La répétition de « juges » est maintenue pour refléter l’insistance du texte source.
