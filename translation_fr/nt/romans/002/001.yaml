review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement l’inférence de Διό, l’adresse représentative de ἄνθρωπε, la portée universalisante de πᾶς ὁ κρίνων, la force condamnatoire de κατακρίνεις et l’idée de conduite répétée dans πράσσεις. Toutefois, « lorsque tu juges » ne rend que la nuance temporelle de ἐν ᾧ et laisse s’effacer le lien instrumental : c’est dans/par l’acte même de juger autrui que le juge se condamne. « En jugeant l’autre » préserve mieux cette concision et cette double relation sans surinterprétation.'
  naturalness: Le français est globalement naturel, soutenu et accessible. « Ô être humain » est une interpellation rhétorique recevable en français international moderne, et « inexcusable » ainsi que « pratiquer les mêmes choses » conviennent au registre paulinien. La révision proposée améliore la fluidité tout en resserrant le lien logique.
  terminology: « Être humain » traduit légitimement ἄνθρωπος dans son emploi générique et évite d’attribuer au masculin grammatical grec une restriction masculine absente du contexte. « Juger » et « condamner » maintiennent la distinction entre κρίνω et κατακρίνω. Aucun terme théologique spécialisé ne nécessite une note.
