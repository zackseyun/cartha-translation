  source_fidelity: 'Le texte rend fidèlement tous les éléments du grec : γὰρ (« En effet ») conserve le lien explicatif ; « le nom de Dieu » traduit directement τὸ ὄνομα τοῦ θεοῦ ; « à cause de vous » exprime bien la valeur causale de δι’ ὑμᾶς ; « est blasphémé » préserve le présent passif βλασφημεῖται ; et « comme il est écrit » rend naturellement καθὼς γέγραπται. « Parmi les non-Juifs » est contextuellement défendable pour ἐν τοῖς ἔθνεσιν, tandis que la note conserve à juste titre l’alternative plus littérale « parmi les nations ».'
