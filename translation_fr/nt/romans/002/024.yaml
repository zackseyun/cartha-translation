id: ROM.2.24
reference: Romans 2:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: fr
  text: En effet, à cause de vous, le nom de Dieu est blasphémé parmi les non-Juifs[a], comme il est écrit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « parmi les nations ».'
    reason: lexical_alternative
  - marker: b
    text: Paul fait écho à l’Écriture, surtout à Ésaïe 52.5, ainsi qu’à des thèmes également présents en Ézéchiel 36.20-23.
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Introduit l’explication qui fonde le reproche précédent et rend naturellement le lien logique en français.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: le nom de Dieu
  rationale: Traduction directe qui conserve la formulation biblique et sa portée liée à l’honneur et à la réputation de Dieu sans la paraphraser.
- source_word: δι’ ὑμᾶς
  choice: à cause de vous
  rationale: διά avec l’accusatif exprime ici la cause; cette tournure transmet clairement l’accusation de Paul.
- source_word: βλασφημεῖται
  choice: est blasphémé
  rationale: Conserve le présent passif et la force religieuse du verbe, qui désigne des paroles outrageantes contre Dieu.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: parmi les non-Juifs
  rationale: Dans le contexte de l’opposition entre Juifs et ἔθνη en Romains 2, le terme désigne naturellement les peuples autres que le peuple juif; «les nations» reste une possibilité lexicale signalée en note.
- source_word: καθὼς γέγραπται
  choice: comme il est écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture; «comme» rend suffisamment καθώς.
theological_decisions:
- issue: Identité des ἔθνη
  choice: les non-Juifs
  alternative: les nations
  rationale: Le contexte immédiat vise la distinction religieuse et ethnique entre Juifs et autres peuples, sans réduire le mot à des États ou entités politiques.
- issue: Portée de l’écho scripturaire
  choice: Ne pas intégrer de citation précise dans le corps du verset
  alternative: Identifier explicitement Ésaïe 52.5 dans le texte
  rationale: Paul emploie une formule citationnelle sans nommer le passage; la note peut signaler l’écho principal et le thème parallèle sans imposer une harmonisation.
translation_notes:
  register: Français moderne, international et digne. « Non-Juifs » est immédiatement compréhensible et plus courant que « païens » ou « Gentils », tout en respectant le contraste contextuel. La syntaxe garde l’accent causal de δι’ ὑμᾶς en plaçant « à cause de vous » près du début.
