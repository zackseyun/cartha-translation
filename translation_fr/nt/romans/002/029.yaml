    text: 'Ou : « dans ce qui est caché ». « Dans l’Esprit » peut aussi se comprendre : « dans l’esprit », c’est-à-dire dans la réalité intérieure et spirituelle plutôt que selon la lettre.'
    reason: Préserve la nuance de ἐν τῷ κρυπτῷ et l’ambiguïté interprétative de πνεύματι.
  revision_rationale: La révision retire les qualifications non exprimées (« véritable ») et l’idée ajoutée d’une circoncision « accomplie » par l’Esprit. Elle conserve la structure contrastive du grec, rend la relation de la louange à la personne par « sa louange », et signale en note les deux ambiguïtés pertinentes sans les confondre avec une paraphrase doctrinale.
