revisions:
- from: Mais le véritable Juif l’est intérieurement[a], et la véritable circoncision est celle du cœur, accomplie par l’Esprit et non par la lettre. La louange de ce Juif ne vient pas des humains, mais de Dieu.
  to: Mais le Juif, c’est celui qui l’est intérieurement[a], et la circoncision, c’est celle du cœur, dans l’Esprit, non selon la lettre. Sa louange ne vient pas des humains, mais de Dieu.
  rationale: La révision retire les qualifications non exprimées (« véritable ») et l’idée ajoutée d’une circoncision « accomplie » par l’Esprit. Elle conserve la structure contrastive du grec, rend la relation de la louange à la personne par « sa louange », et signale en note les deux ambiguïtés pertinentes sans les confondre avec une paraphrase doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:16:53Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement les contrastes fondamentaux du verset (intériorité/extériorité, cœur/lettre, humains/Dieu). Toutefois, « véritable » ajouté deux fois n’est pas exprimé dans le grec et risque de surinterpréter l’ellipse. « accomplie par l’Esprit » transforme également la construction « en esprit, non lettre » en une affirmation instrumentale et théologiquement plus tranchée que ne le permet sans réserve le texte.
  naturalness: La formulation révisée est fluide, sobre et idiomatique en français international moderne. Elle conserve l’ellipse emphatique du grec sans produire une phrase artificielle.
  terminology: « Juif », « circoncision du cœur », « lettre », « humains » et « Dieu » sont appropriés. « Dans l’Esprit » maintient le sens paulinien probable tout en laissant l’alternative « dans l’esprit » accessible par note. « Selon la lettre » rend naturellement en français l’opposition sans prétendre que le grec répète une préposition.
  issues:
  - severity: medium
    issue: Ajout de « véritable »
    rationale: Le grec ne qualifie ni Ἰουδαῖος ni περιτομή par « véritable ». Le contexte établit bien un contraste entre réalité intérieure et marque extérieure, mais l’ajout explicite dépasse la formulation source.
  - severity: medium
    issue: « accomplie par l’Esprit » résout et amplifie la syntaxe de ἐν πνεύματι
    rationale: La préposition ἐν est plus ouverte que l’instrumental « par », et πνεύματι peut être compris comme l’Esprit, l’esprit humain ou une sphère/réalité spirituelle. Une formulation avec note préserve mieux l’ambiguïté.
  - severity: low
    issue: La note attribue à ἐν τῷ κρυπτῷ le sens principal de « dans le secret »
    rationale: Dans ce contexte, « dans ce qui est caché » ou « intérieurement » évite une connotation de dissimulation volontaire et reflète mieux le contraste paulinien.
  revised_text: Mais le Juif, c’est celui qui l’est intérieurement[a], et la circoncision, c’est celle du cœur, dans l’Esprit, non selon la lettre. Sa louange ne vient pas des humains, mais de Dieu.
  revised_footnotes:
