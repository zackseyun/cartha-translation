id: ROM.2.29
reference: Romans 2:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: fr
  text: Mais le Juif, c’est celui qui l’est intérieurement[a], et la circoncision, c’est celle du cœur, dans l’Esprit, non selon la lettre. Sa louange ne vient pas des humains, mais de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans ce qui est caché ». « Dans l’Esprit » peut aussi se comprendre : « dans l’esprit », c’est-à-dire dans la réalité intérieure et spirituelle plutôt que selon la lettre.'
    reason: Préserve la nuance de ἐν τῷ κρυπτῷ et l’ambiguïté interprétative de πνεύματι.
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: intérieurement
  rationale: Rend naturellement l’opposition entre la réalité intérieure, cachée, et l’apparence extérieure, sans suggérer seulement le secret.
- source_word: Ἰουδαῖος
  choice: Juif
  rationale: Dans le raisonnement de Romains 2, le terme a une portée religieuse et liée à l’alliance plutôt que principalement géographique.
- source_word: περιτομὴ καρδίας
  choice: la véritable circoncision est celle du cœur
  rationale: Conserve la métaphore de la circoncision tout en donnant en français une phrase claire et parallèle à la première proposition elliptique du grec.
- source_word: ἐν πνεύματι
  choice: accomplie par l’Esprit
  rationale: Le contraste paulinien avec la lettre favorise une référence à l’action de l’Esprit saint; la formulation instrumentale est naturelle en français. L’ambiguïté réelle est signalée en note.
- source_word: οὐ γράμματι
  choice: et non par la lettre
  rationale: « Lettre » conserve le terme et le contraste pauliniens sans développer indûment l’idée en « code écrit ».
- source_word: οὗ ὁ ἔπαινος
  choice: La louange de ce Juif
  rationale: Explicite sobrement l’antécédent du relatif grec, dont une reproduction littérale serait lourde ou ambiguë en français.
- source_word: ἐξ ἀνθρώπων
  choice: des humains
  rationale: Rend le pluriel générique sans le limiter aux personnes de sexe masculin.
- source_word: ἐκ τοῦ θεοῦ
  choice: de Dieu
  rationale: Traduction directe et idiomatique de la provenance exprimée en grec.
theological_decisions:
- issue: πνεύματι désigne-t-il l’Esprit saint, l’esprit humain ou la réalité spirituelle intérieure ?
  choice: l’Esprit saint
  alternative: l’esprit humain ou, plus généralement, la réalité spirituelle intérieure
  rationale: Le contraste paulinien entre l’Esprit et la lettre rend probable une référence à l’Esprit saint. Toutefois, l’absence d’article et la structure de la phrase laissent subsister une ambiguïté, préservée en note.
- issue: La syntaxe elliptique définit-elle seulement le Juif ou également la circoncision ?
  choice: rendre les deux définitions parallèles en ajoutant « véritable »
  alternative: 'traduire plus littéralement : « Mais est Juif celui qui l’est dans le secret, et la circoncision est celle du cœur »'
  rationale: Le grec omet des éléments aisément suppléés par le contexte. « Véritable » exprime l’opposition entre réalité intérieure et simple apparence sans nier l’identité ethnique évoquée dans le passage.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « véritable » clarifie l’ellipse et l’opposition du contexte; « ce Juif » évite un relatif français maladroit. La note rassemble les deux ambiguïtés étroitement liées à l’intériorité.
