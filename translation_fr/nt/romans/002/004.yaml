id: ROM.2.4
reference: Romans 2:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: fr
  text: Ou méprises-tu les richesses de sa bonté, de sa patience et de sa longanimité[a], sans savoir que la bonté de Dieu te conduit à la repentance ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de sa bonté, de sa retenue et de sa patience persévérante ».'
    reason: Précise les nuances possibles de ἀνοχή et μακροθυμία, deux termes proches que le français courant distingue difficilement sans périphrase.
lexical_decisions:
- source_word: πλούτου
  choice: richesses
  rationale: Conserve la métaphore grecque d’une profusion de qualités divines et la construction au singulier collectif.
- source_word: χρηστότητος / τὸ χρηστόν
  choice: bonté
  rationale: « Bonté » exprime naturellement en français la bienveillance active de Dieu et permet de reprendre le même lexème aux deux occurrences.
- source_word: ἀνοχῆς
  choice: patience
  rationale: Dans ce contexte, le mot désigne le fait que Dieu retient ou diffère son jugement ; « patience » est clair et naturel, tandis que « tolérance » risquerait d’évoquer l’approbation.
- source_word: μακροθυμίας
  choice: longanimité
  rationale: Distingue cette endurance prolongée de l’ἀνοχή déjà rendue par « patience » et préserve l’accumulation de trois qualités distinctes, avec un terme français digne encore intelligible.
- source_word: καταφρονεῖς
  choice: méprises-tu
  rationale: Préserve la force accusatrice du verbe et la forme interrogative directe.
- source_word: ἀγνοῶν
  choice: sans savoir
  rationale: Rend naturellement le participe sans imposer l’idée d’une ignorance volontaire.
- source_word: εἰς μετάνοιάν
  choice: à la repentance
  rationale: « Repentance » exprime ici le retournement moral et spirituel visé, sans réduire μετάνοια à un simple changement intellectuel.
- source_word: ἄγει
  choice: te conduit
  rationale: Le présent français conserve l’action actuelle de Dieu et la valeur directionnelle du verbe.
theological_decisions:
- issue: Portée de χρηστότης / χρηστόν dans la description de l’action de Dieu
  choice: Rendre les deux occurrences par « bonté »
  alternative: « bienveillance » aux deux occurrences
  rationale: « Bonté » maintient la cohérence lexicale et couvre à la fois la qualité morale et son expression bienveillante, sans préciser au-delà du grec la manière dont Dieu agit.
- issue: Force de ἄγει relativement à la réponse humaine
  choice: « te conduit à la repentance »
  alternative: « veut te conduire à la repentance »
  rationale: Le texte affirme que la bonté de Dieu conduit ; l’ajout de « veut » affaiblirait et interpréterait cette affirmation, tandis que la traduction retenue ne tranche pas à elle seule la question de l’issue effective.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la question rhétorique ainsi que l’accumulation grecque. « Longanimité », moins fréquent mais exact, est accompagné d’une note afin de rester accessible.
