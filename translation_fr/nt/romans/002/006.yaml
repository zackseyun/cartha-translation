id: ROM.2.6
reference: Romans 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἀποδώσει ἑκάστῳ κατὰ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/006.yaml
  text: who will repay each one according to his works[a][b].
translation:
  language: fr
  text: lui qui rendra à chacun selon ses œuvres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses actes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: lui qui
  rationale: Le pronom relatif renvoie à Dieu dans le contexte précédent. « Lui qui » assure en français le raccord avec la citation tout en restant naturel.
- source_word: ἀποδώσει
  choice: rendra
  rationale: Dans ce contexte de jugement et de rétribution, « rendra » exprime l’idée de donner à chacun ce qui lui revient, sans atténuer la portée judiciaire.
- source_word: ἑκάστῳ
  choice: à chacun
  rationale: Cette formulation conserve la valeur distributive du singulier grec et souligne la responsabilité individuelle.
- source_word: κατὰ
  choice: selon
  rationale: « Selon » exprime clairement ici la norme ou la mesure de la rétribution.
- source_word: τὰ ἔργα
  choice: ses œuvres
  rationale: « Œuvres » est l’équivalent traditionnel et direct de ἔργα; il préserve aussi la cohérence du vocabulaire paulinien. Une note signale l’alternative courante « actes ».
- source_word: αὐτοῦ
  choice: ses
  rationale: Dans « à chacun selon ses œuvres », le possessif renvoie naturellement à chaque personne. Le français ne marque pas ici le genre du possesseur, ce qui restitue sans lourdeur la portée générique du masculin singulier grec.
theological_decisions:
- issue: Le jugement selon les œuvres
  choice: Conserver l’affirmation d’une rétribution rendue à chacun selon ses œuvres.
  alternative: Employer une formulation plus générale telle que « traitera chacun » ou préciser « récompensera ».
  rationale: Le grec affirme explicitement une rétribution selon les œuvres. La traduction maintient cette tension théologique sans l’atténuer ni l’harmoniser avec d’autres passages pauliniens sur la justification.
translation_notes:
  register: Français international moderne, sobre et digne. « Rendra à chacun » est idiomatique dans un contexte de justice; « œuvres » maintient le vocabulaire biblique et paulinien sans être archaïque. Aucun ajout de note sur le masculin générique n’est nécessaire, puisque le possessif français « ses » ne marque pas le genre du possesseur.
