id: ROM.2.27
reference: Romans 2:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: fr
  text: Et celui qui est incirconcis par nature[a], tout en accomplissant la loi, te jugera, toi qui, avec la lettre et la circoncision[b], transgresses la loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’incirconcision » ; ici, une personne incirconcise.'
    reason: lexical_alternative
  - marker: b
    text: « Avec la lettre » peut aussi se traduire par « avec le texte écrit ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: celui qui est incirconcis
  rationale: Le nom signifie littéralement « incirconcision », mais désigne ici par métonymie une personne incirconcise. Cette formulation garde le référent personnel sans introduire explicitement le terme ethnique « non-Juif ».
- source_word: ἐκ φύσεως
  choice: par nature
  rationale: Cette expression rend directement le grec et marque le contraste entre l'incirconcision naturelle et la possession de la circoncision.
- source_word: τελοῦσα
  choice: tout en accomplissant
  rationale: Le participe présent décrit la personne incirconcise comme accomplissant effectivement la loi. Cette formulation préserve sa valeur participiale sans imposer la lecture conditionnelle possible.
- source_word: νόμον
  choice: la loi
  rationale: Dans le contexte, il s'agit de la loi connue de l'argument de Paul, vraisemblablement la loi mosaïque.
- source_word: διὰ γράμματος
  choice: avec la lettre
  rationale: Dans cette construction, διά avec le génitif peut signaler le moyen ou les ressources dont dispose l'interlocuteur. « Avec la lettre » reste proche de la formulation grecque tout en étant naturel en français; « par le texte écrit » explicite davantage le sens.
- source_word: περιτομῆς
  choice: la circoncision
  rationale: Le signe d'alliance est rendu directement par son équivalent français courant.
- source_word: παραβάτην νόμου
  choice: transgresses la loi
  rationale: La tournure verbale française est plus naturelle que « es un transgresseur de la loi » et conserve le lien explicite avec la loi.
theological_decisions:
- issue: Faut-il expliciter le contraste ethnique en traduisant ἀκροβυστία par « non-Juif » ?
  choice: Conserver l'expression plus étroite « celui qui est incirconcis ».
  alternative: le non-Juif
  rationale: Le contexte concerne bien Juifs et non-Juifs, mais le vocabulaire précis du verset oppose circoncision et incirconcision. La traduction n'ajoute donc pas une désignation ethnique absente du terme grec.
- issue: Valeur circonstancielle du participe τελοῦσα
  choice: Le rendre par « tout en accomplissant », sans expliciter une condition.
  alternative: s'il accomplit
  rationale: Une nuance conditionnelle est possible dans le contexte, mais elle n'est pas formellement marquée dans le grec. La formulation retenue préserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier rend le σέ grec et maintient l'adresse directe à l'interlocuteur juif du contexte. La syntaxe conserve le contraste rhétorique entre la personne incirconcise qui accomplit la loi et celle qui possède la lettre et la circoncision mais transgresse la loi.
