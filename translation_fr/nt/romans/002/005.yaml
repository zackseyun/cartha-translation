id: ROM.2.5
reference: Romans 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: fr
  text: Mais, à cause de ton endurcissement et de ton cœur qui ne se repent pas, tu t’amasses un trésor de colère pour le jour de la colère et de la révélation du juste jugement de Dieu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du jugement équitable de Dieu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ
  choice: Mais, par
  rationale: « Mais » rend la nuance adversative de δέ, tandis que « par » exprime naturellement ici la valeur causale de κατά avec l’accusatif.
- source_word: σκληρότης
  choice: endurcissement
  rationale: Ce terme conserve la métaphore biblique d’une dureté morale tout en étant plus idiomatique en français actuel que « dureté » dans ce contexte.
- source_word: ἀμετανόητον καρδίαν
  choice: cœur qui refuse de changer
  rationale: Cette formulation garde l’image du cœur et exprime clairement l’absence de repentance sans recourir au terme moins courant « impénitent ».
- source_word: θησαυρίζεις
  choice: tu accumules
  rationale: Le verbe grec évoque une mise en réserve progressive. « Tu accumules » communique cette force dans le contexte négatif sans la connotation positive que pourrait avoir « amasser un trésor ».
- source_word: σεαυτῷ
  choice: contre toi-même
  rationale: Le datif réfléchi indique que les conséquences retombent sur la personne. Dans ce contexte de jugement, « contre toi-même » est naturel et précis.
- source_word: ὀργή
  choice: colère
  rationale: « Colère » est le terme français courant et digne pour la colère divine; le contexte judiciaire en précise la gravité.
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: pour le jour de la colère et de la révélation
  rationale: Avec θησαυρίζεις, « pour le jour » rend naturellement la destination temporelle de l’accumulation. La coordination nominale du grec est maintenue.
- source_word: δικαιοκρισία
  choice: juste jugement
  rationale: Le composé désigne un jugement conforme à la justice. « Juste jugement » est idiomatique et rend directement cette idée.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le complément est conservé explicitement et peut qualifier le jugement comme celui que Dieu prononce.
theological_decisions:
- issue: Faut-il transformer la construction nominale en proposition verbale explicite?
  choice: 'Conserver la construction nominale: « le jour de la colère et de la révélation du juste jugement de Dieu »'
  alternative: « le jour de la colère, lorsque Dieu révélera son juste jugement »
  rationale: Le grec coordonne « colère » et « révélation » sans verbe explicite. La formulation retenue préserve cette structure et évite de préciser davantage que le texte la relation entre le jour, la révélation et le jugement.
- issue: Portée du génitif τοῦ θεοῦ
  choice: « du juste jugement de Dieu »
  alternative: « du jugement juste rendu par Dieu »
  rationale: La formulation retenue laisse au génitif sa portée naturelle sans expliciter s’il indique principalement l’auteur, la possession ou l’origine du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier reflète les formes grecques de deuxième personne du singulier. La phrase conserve la densité et la coordination nominale de l’original tout en évitant un vocabulaire inutilement archaïque.
