id: ROM.2.28
reference: Romans 2:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: fr
  text: En effet, ce n’est pas celui qui est Juif extérieurement qui est Juif[a], et la circoncision n’est pas celle qui est visible extérieurement dans la chair[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car celui qui est Juif extérieurement n’est pas Juif ». Le grec emploie une formulation elliptique, dont le contraste est développé au verset suivant.'
    reason: clarification
  - marker: b
    text: « Dans la chair » désigne ici la circoncision physique, pratiquée sur le corps.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: En effet
  rationale: Introduit naturellement en français l’explication qui rattache ce verset à l’argument précédent.
- source_word: ὁ ἐν τῷ φανερῷ Ἰουδαῖος
  choice: ce n’est pas ce qui est visible extérieurement qui fait le Juif
  rationale: La tournure française restitue l’ellipse grecque et le contraste entre identité visible et réalité intérieure, sans nier en bloc l’identité juive.
- source_word: Ἰουδαῖος
  choice: Juif
  rationale: Dans ce contexte de Loi, de circoncision et d’identité d’Israël, « Juif » convient mieux que le sens géographique « Judéen ».
- source_word: ἐν τῷ φανερῷ
  choice: ce qui est visible extérieurement
  rationale: Préserve à la fois les dimensions visible et extérieure de l’expression, en contraste avec le verset suivant.
- source_word: περιτομή
  choice: circoncision
  rationale: Terme français standard et précis pour le signe d’alliance évoqué.
- source_word: ἐν σαρκί
  choice: dans la chair
  rationale: Rend littéralement la référence physique et corporelle, tout en conservant le vocabulaire qui prépare le contraste du verset suivant.
theological_decisions:
- issue: Identité juive et circoncision comme réalités extérieures
  choice: Le verset affirme que les signes extérieurement visibles ne suffisent pas à constituer l’identité dont Paul parle.
  alternative: Comprendre que Paul nie l’identité juive elle-même ou remplace entièrement celle-ci par une catégorie purement spirituelle.
  rationale: La formulation conserve la tension entre l’extérieur et l’intérieur, développée au verset 29, sans abolir la catégorie « Juif » ni préciser au-delà du texte la nature exacte de l’identité véritable.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « visible extérieurement » reflète la répétition grecque et maintient le parallèle entre l’identité juive et la circoncision.
