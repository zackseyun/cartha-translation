id: ROM.2.12
reference: Romans 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: fr
  text: En effet, tous ceux qui ont péché sans la loi périront aussi sans la loi[a], et tous ceux qui ont péché sous la loi[b] seront jugés par la loi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en dehors de la loi »; le grec peut aussi se rendre par « sans loi » dans les deux occurrences.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans la loi », c''est-à-dire dans la sphère où elle s''applique.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « au moyen de la loi »; la loi est présentée comme l''instrument ou le critère du jugement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: sans la loi
  rationale: Cette formulation naturelle garde le contraste avec ceux qui se trouvent sous la loi et indique l'absence de la loi mosaïque, sans réduire le terme au simple sens de « d'une manière illégale ».
- source_word: ἥμαρτον
  choice: ont péché
  rationale: Le passé composé exprime naturellement en français l'aoriste grec sans surinterpréter son aspect.
- source_word: ἀπολοῦνται
  choice: périront
  rationale: Ce futur préserve l'issue grave exprimée par le grec sans préciser s'il s'agit d'anéantissement, de condamnation ou d'une modalité particulière du jugement final.
- source_word: ἐν νόμῳ
  choice: sous la loi
  rationale: Cette expression idiomatique rend l'idée d'être dans la sphère ou sous la juridiction de la loi, plutôt qu'une localisation littérale « dans la loi ».
- source_word: διὰ νόμου
  choice: par la loi
  rationale: En français, « par la loi » rend naturellement διά avec le génitif en présentant la loi comme moyen ou critère du jugement; « au moyen de la loi » serait plus explicite mais plus lourd.
- source_word: κριθήσονται
  choice: seront jugés
  rationale: Le verbe est rendu de façon judiciairement neutre; « condamnés » préciserait davantage que ne le fait κρίνω lui-même.
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: tous ceux qui… et tous ceux qui
  rationale: Cette structure reproduit clairement la portée distributive et le parallélisme du grec.
- source_word: γὰρ
  choice: En effet
  rationale: « En effet » relie naturellement le verset à l'affirmation précédente en indiquant qu'il en donne le fondement.
theological_decisions:
- issue: Référence de νόμος
  choice: « la loi », comprise principalement comme la loi mosaïque
  alternative: La loi au sens moral général
  rationale: Le contraste entre ceux qui sont sans la loi et ceux qui sont sous la loi, dans le contexte juifs-non-Juifs de Romains 2, renvoie vraisemblablement à la loi mosaïque. Le texte traduit conserve néanmoins la simple expression « la loi ».
- issue: Portée de ἀπολοῦνται
  choice: « périront », sans définir la modalité du jugement final
  alternative: « seront détruits » ou « seront condamnés »
  rationale: Le verset affirme une issue judiciaire grave sans exposer ici sa nature précise; la traduction ne tranche donc ni en faveur de l'anéantissement ni d'une autre conception particulière.
- issue: Portée de κριθήσονται
  choice: « seront jugés »
  alternative: « seront condamnés »
  rationale: Le grec désigne le jugement; même si le contexte peut impliquer une issue défavorable, la traduction évite de transformer cette implication en équivalent lexical explicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme de la phrase grecque est conservé. « En effet » est préféré à « car » en tête de verset pour une articulation naturelle; « sous la loi » exprime clairement la juridiction sans ajouter d'explication confessionnelle.
