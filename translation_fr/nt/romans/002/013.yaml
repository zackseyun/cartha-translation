id: ROM.2.13
reference: Romans 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: fr
  text: En effet, ce ne sont pas ceux qui écoutent la Loi qui sont justes devant Dieu, mais ceux qui mettent la Loi en pratique qui seront déclarés justes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « seront justifiés »; autre possibilité : « seront reconnus comme justes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: ceux qui écoutent
  rationale: Cette tournure française naturelle exprime les personnes qui entendent la Loi et maintient le contraste rhétorique avec celles qui la mettent en pratique.
- source_word: νόμου
  choice: la Loi
  rationale: Malgré l’absence d’article en grec, le contexte vise la Loi déjà en discussion; l’article et la majuscule rendent cette référence clairement et naturellement en français.
- source_word: δίκαιοι
  choice: justes
  rationale: « Justes » est l’équivalent direct et courant dans ce contexte de jugement divin, tout en conservant le lien lexical avec le verbe qui suit.
- source_word: παρὰ τῷ θεῷ
  choice: devant Dieu
  rationale: Cette expression concise traduit naturellement l’idée d’être considéré selon l’évaluation ou le jugement de Dieu.
- source_word: ποιηταὶ
  choice: ceux qui mettent … en pratique
  rationale: Le français « ceux qui font la Loi » serait raide et potentiellement ambigu; cette formulation rend clairement l’obéissance effective et préserve l’opposition avec la simple écoute.
- source_word: δικαιωθήσονται
  choice: seront déclarés justes
  rationale: Cette formulation rend la valeur judiciaire possible du passif futur de δικαιόω, reste compréhensible en français moderne et conserve la parenté lexicale avec « justes ».
theological_decisions:
- issue: Sens et rendu de δικαιωθήσονται dans l’argument de Paul
  choice: seront déclarés justes
  alternative: seront justifiés; seront reconnus comme justes
  rationale: Le texte affirme un verdict futur sans expliquer ici son rapport précis avec l’ensemble de l’argument de Romains. « Déclarés justes » conserve la dimension de verdict sans résoudre cette tension théologique; les autres rendus plausibles figurent en note.
translation_notes:
  register: Français moderne, international et digne. La structure antithétique du grec est conservée, avec une formulation idiomatique plutôt que les substantifs peu naturels « auditeurs » et « pratiquants ». La répétition de « la Loi » clarifie le contraste.
