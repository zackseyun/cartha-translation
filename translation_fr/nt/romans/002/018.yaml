  text: καὶ γινώσκεις τὸ θέλημα καὶ δοκιμάζεις τὰ διαφέροντα κατηχούμενος ἐκ τοῦ νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/018.yaml
  text: and know his will and approve the things that differ[a], being instructed from the law[b],
translation:
  language: fr
  text: tu connais sa volonté et tu discernes ce qui est préférable[a], instruit par la Loi[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu approuves ce qui est excellent »; plus littéralement, « tu mets à l’épreuve les choses qui diffèrent ».
    reason: alternative_reading
  - marker: b
    text: Ou « instruit à partir de la Loi »; le grec présente la Loi comme la source de cette instruction.
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκεις
  choice: tu connais
  rationale: Le présent de l’indicatif exprime directement la connaissance; « connaître » est naturel et fidèle.
- source_word: τὸ θέλημα
  choice: sa volonté
  rationale: Le grec dit littéralement « la volonté » sans possessif, mais le contexte désigne implicitement Dieu; le français naturel appelle ici « sa volonté ».
- source_word: δοκιμάζεις
  choice: tu sais discerner
  rationale: Le verbe désigne ici l’examen qui permet de reconnaître ce qui mérite d’être retenu; « discerner » conserve mieux le processus évaluatif que le seul résultat « approuver ».
- source_word: τὰ διαφέροντα
  choice: ce qui est préférable
  rationale: L’expression peut désigner littéralement « les choses qui diffèrent » ou, idiomatiquement, ce qui se distingue par sa valeur. « Ce qui est préférable » convient au contexte moral tout en laissant l’alternative en note.
- source_word: κατηχούμενος
  choice: puisque tu es instruit
  rationale: Le participe passif explique vraisemblablement la source de cette connaissance et de ce discernement; la tournure causale est naturelle en français.
- source_word: ἐκ τοῦ νόμου
  choice: par la Loi
  rationale: ἐκ présente la Loi comme source de l’instruction. « Par la Loi » est idiomatique en français; une note signale la traduction plus formelle « à partir de la Loi ».
theological_decisions:
- issue: Possessif implicite de τὸ θέλημα
  choice: sa volonté
  alternative: la volonté
  rationale: Dieu est le référent implicite dans le contexte immédiat, mais l’absence de possessif explicite dans le grec est signalée en note.
- issue: Sens de τὰ διαφέροντα
  choice: ce qui est préférable
  alternative: les choses qui diffèrent
  rationale: Le sens idiomatique comparatif convient au discernement moral évoqué, sans exclure le sens plus littéral, conservé en note.
translation_notes:
  register: Français moderne, digne et accessible. Le tutoiement suit l’adresse directe au singulier du contexte. « Loi » prend une majuscule puisqu’il s’agit ici de la Loi donnée à Israël.
