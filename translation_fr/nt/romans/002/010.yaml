reference: Romans 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: fr
  text: mais gloire, honneur et paix à toute personne qui fait le bien[a], au Juif d’abord et aussi au Grec[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce qui est bien ».
    reason: lexical_alternative
  - marker: b
    text: Ici, « Grec » désigne probablement plus largement toute personne non juive, c’est-à-dire un non-Juif.
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: gloire
  rationale: « Gloire » est l’équivalent biblique naturel et conserve à la fois la valeur honorifique et la perspective de la récompense eschatologique.
- source_word: τιμή
  choice: honneur
  rationale: « Honneur » rend directement le terme et s’accorde naturellement avec « gloire » dans cette série.
- source_word: εἰρήνη
  choice: paix
  rationale: « Paix » préserve l’ampleur du sens biblique sans le réduire au bien-être intérieur, social ou relationnel.
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: pour toute personne qui fait
  rationale: Cette formulation inclusive et idiomatique exprime la personne caractérisée par son action, sans alourdir le français par une traduction littérale de l’idée de travail.
- source_word: τὸ ἀγαθόν
  choice: le bien
  rationale: L’adjectif substantivé désigne « le bien » ou « ce qui est bien ». « Faire le bien » est l’expression française la plus naturelle, tandis que l’autre possibilité est signalée en note.
- source_word: Ἰουδαίῳ
  choice: pour le Juif
  rationale: Le singulier représentatif du grec peut être conservé naturellement en français dans l’opposition traditionnelle entre le Juif et le Grec.
- source_word: πρῶτον
  choice: d’abord
  rationale: « D’abord » exprime clairement l’ordre marqué par le grec sans préciser indûment la nature de cette priorité.
- source_word: Ἕλληνι
  choice: pour le Grec
  rationale: Cette traduction conserve le terme source et la formule paulinienne « Juif et Grec » ; sa portée plus large est expliquée en note.
- source_word: δὲ
  choice: mais
  rationale: La conjonction introduit ici un contraste avec la colère et la détresse du verset précédent ; « mais » rend nettement cette opposition.
- source_word: τε ... καί
  choice: mais aussi
  rationale: Dans ce contexte antithétique, « mais aussi » relie naturellement les deux groupes tout en préservant leur inclusion parallèle.
theological_decisions:
- issue: Sens de Ἕλληνι dans l’opposition paulinienne entre Juif et Grec
  choice: Conserver « le Grec » dans le texte et signaler en note le sens plus large de non-Juif.
  alternative: Traduire directement par « le non-Juif » ou « le païen ».
  rationale: Le mot grec désigne littéralement un Grec, mais l’opposition « Juif et Grec » peut englober plus largement les Juifs et les non-Juifs. La traduction retenue préserve l’expression source et sa tension culturelle, tandis que la note en indique la portée probable.
- issue: Nature de la priorité exprimée par πρῶτον
  choice: Traduire simplement par « d’abord » sans expliquer la nature de cette priorité dans le verset.
  alternative: Préciser qu’il s’agit d’une priorité historique, missionnaire ou liée à l’histoire du salut.
  rationale: Le texte affirme un ordre mais n’en explicite pas ici la nature. La traduction évite d’imposer une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, clair et digne. « Toute personne » évite l’ambiguïté potentielle de « tout homme » tout en rendant le singulier distributif. Les termes bibliques établis « gloire », « honneur » et « paix » sont conservés. Les marqueurs de notes suivent immédiatement les expressions concernées.
