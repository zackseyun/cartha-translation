id: ROM.2.8
reference: Romans 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: fr
  text: 'Mais pour ceux qui agissent par ambition égoïste[a], qui refusent d’obéir à la vérité et obéissent au contraire à l’injustice[b] : colère et fureur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui agissent par esprit de rivalité ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec peut aussi désigner plus largement ce qui est contraire à la droiture devant Dieu.
    reason: semantic_scope
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: qui agissent par ambition égoïste
  rationale: La préposition ἐκ indique ici la source ou le mobile de l’action. Cette formulation exprime naturellement en français une conduite motivée par l’intérêt personnel, tout en conservant la nuance d’ambition partisane ou de rivalité.
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: qui refusent d’obéir à la vérité
  rationale: ἀπειθέω exprime ici une désobéissance volontaire plutôt qu’une simple absence de croyance. « Refusent d’obéir » rend clairement cette dimension morale et volitive.
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: et obéissent au contraire à l’injustice
  rationale: Le participe forme un contraste avec la désobéissance à la vérité. « Au contraire » rend la valeur adversative de δέ sans alourdir la phrase et souligne l’allégeance opposée.
- source_word: ἀδικίᾳ
  choice: l’injustice
  rationale: « Injustice » appartient au même champ sémantique que ἀδικία et reste clair en français moderne. Dans ce contexte, le terme désigne largement ce qui s’oppose à la droiture devant Dieu, et non uniquement l’injustice sociale ou judiciaire.
- source_word: ὀργὴ
  choice: colère
  rationale: « Colère » rend le terme avec sobriété et conserve, dans le contexte du jugement divin, sa force judiciaire.
- source_word: θυμός
  choice: fureur
  rationale: Associé à ὀργή, θυμός intensifie l’expression. « Fureur » maintient cette gradation dans un registre français actuel et solennel.
- source_word: implicit verbal ellipsis
  choice: deux-points après « injustice »
  rationale: Le grec présente « colère et fureur » sans verbe explicite, en dépendance de la phrase plus large. Les deux-points préservent cette formulation concise sans ajouter « il y aura ».
theological_decisions:
- issue: Sens de ἀδικία dans le contexte paulinien du jugement
  choice: l’injustice
  alternative: ce qui est injuste ; l’iniquité
  rationale: « Injustice » préserve le contraste direct avec « vérité » et reste intelligible. La note précise que le mot grec peut englober toute conduite contraire à la droiture devant Dieu, afin de ne pas en réduire la portée à une seule catégorie sociale ou juridique.
translation_notes:
  register: Français international moderne, clair et digne. La structure elliptique et solennelle de la finale grecque est conservée. La répétition d’« obéir » maintient le parallélisme entre le refus de la vérité et l’adhésion à l’injustice.
