reference: Romans 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: fr
  text: 'Ils montrent que l’œuvre de la loi est écrite dans leur cœur[a] : leur conscience en témoigne elle aussi, et, entre eux, leurs raisonnements les accusent ou même les défendent[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce que la loi exige » ou « les exigences de la loi ».
    reason: lexical_alternative
  - marker: b
    text: Litt. « entre les uns et les autres ». Le grec est très condensé ; on peut aussi comprendre que les raisonnements s’accusent ou même se défendent les uns les autres.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: montrent
  rationale: « Montrent » exprime clairement la valeur probante du verbe sans la renforcer jusqu’à l’idée de preuve formelle.
- source_word: τὸ ἔργον τοῦ νόμου
  choice: l’œuvre de la loi
  rationale: Le grec emploie « œuvre » au singulier. Cette formulation peu interprétative conserve l’expression et sa tension, tandis qu’une note donne le sens explicatif courant.
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: écrite dans leur cœur
  rationale: Le singulier distributif « leur cœur » est idiomatique en français et rend l’image d’une inscription intérieure.
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: leur conscience en témoigne elle aussi
  rationale: Cette tournure française fluide rend la proposition au génitif absolu et la valeur corroborante du verbe composé.
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: leurs raisonnements, qui se répondent
  rationale: La formulation conserve l’idée réciproque de raisonnements intérieurs en interaction sans imposer qu’ils s’accusent eux-mêmes.
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: les accusent ou même les défendent
  rationale: « Défendent » correspond au sens judiciaire de ἀπολογέομαι, et « même » rend le καὶ emphatique après ἢ. Le pronom « les » explicite sobrement que les personnes sont accusées ou défendues.
theological_decisions:
- issue: Paul parle-t-il de « l’œuvre de la loi » ou, plus explicitement, de ce que la loi exige ?
  choice: Conserver « l’œuvre de la loi » dans le texte principal.
  alternative: « ce que la loi exige » ou « les exigences de la loi »
  rationale: L’expression grecque est compacte et moins explicite que ses paraphrases courantes. La conserver évite de trancher silencieusement la portée théologique de l’énoncé.
- issue: Les raisonnements s’accusent-ils réciproquement, ou accusent-ils et défendent-ils les personnes ?
  choice: Les raisonnements se répondent et accusent ou défendent les personnes.
  alternative: « leurs raisonnements s’accusent ou même se défendent les uns les autres »
  rationale: La syntaxe grecque est condensée. La traduction maintient la réciprocité dans l’interaction des raisonnements tout en comprenant l’objet sous-entendu des verbes comme les personnes concernées; la note signale l’autre lecture formellement possible.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en évidence les deux témoignages intérieurs. « Raisonnements » garde la dimension réfléchie de λογισμοί; « qui se répondent » rend naturellement la réciprocité sans résoudre entièrement la syntaxe grecque.
