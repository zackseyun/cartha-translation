source:
  edition: SBLGNT
  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: fr
  text: Toi qui tires fierté de la loi, tu déshonores Dieu en transgressant la loi ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: dans la loi
  rationale: Conserve la formulation de Paul et le rapport à la loi comme motif de fierté, sans la réduire au simple sujet d'une déclaration.
- source_word: καυχᾶσαι
  choice: mets ta fierté
  rationale: Expression française naturelle qui rend ici la valeur de καυχάομαι et son ton critique, tout en évitant la connotation parfois exclusivement vantarde de « te vantes ».
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: en transgressant la loi
  rationale: Rend clairement le moyen par lequel Dieu est déshonoré. La tournure verbale est plus naturelle en français moderne que « par la transgression de la loi », sans perdre le sens de παράβασις.
- source_word: τὸν θεὸν
  choice: Dieu
  rationale: Le français omet naturellement l'article devant le nom propre « Dieu » dans cet emploi.
- source_word: ἀτιμάζεις
  choice: déshonores
  rationale: Correspond directement à l'idée de priver d'honneur et maintient le contraste rhétorique entre la fierté placée dans la loi et le déshonneur infligé à Dieu.
theological_decisions:
- issue: Sens de νόμος dans l'argumentation paulinienne
  choice: la loi
  alternative: la Loi
  rationale: Le contexte renvoie bien à la loi juive, mais la minuscule évite d'imposer une convention typographique absente du grec. Le contexte suffit à identifier le référent.
translation_notes:
  register: Tutoiement singulier conservé pour refléter les formes grecques de deuxième personne du singulier. Formulation moderne, directe et digne; la question rhétorique et le contraste accusateur sont maintenus.
