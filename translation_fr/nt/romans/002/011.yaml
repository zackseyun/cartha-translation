  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: fr
  text: Car Dieu ne fait pas de favoritisme[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne fait preuve d’aucune partialité ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: Car
  rationale: Introduit la raison qui fonde l’affirmation précédente et conserve naturellement la valeur explicative du grec.
- source_word: προσωπολημψία
  choice: favoritisme
  rationale: Désigne le fait d’accorder un traitement préférentiel selon le statut ou des considérations extérieures. « Favoritisme » est clair et courant en français moderne; « partialité » demeure une autre traduction possible, notamment dans un contexte judiciaire.
- source_word: παρὰ τῷ θεῷ
  choice: Dieu ne fait pas
  rationale: La tournure relationnelle grecque signifie que le favoritisme n’a pas sa place auprès de Dieu. Une formulation verbale est plus naturelle en français que le calque « il n’y a pas de favoritisme auprès de Dieu », sans changer le sens.
- source_word: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ
  choice: Car Dieu ne fait pas de favoritisme.
  rationale: La formulation dynamique rend avec naturel l’énoncé général sur l’impartialité de Dieu. Elle évite un tour français maladroit tout en conservant la portée morale et judiciaire de l’original.
theological_decisions:
- issue: Expression de l’impartialité divine
  choice: 'Présenter l’énoncé comme une affirmation générale: « Dieu ne fait pas de favoritisme. »'
  alternative: « Car il n’y a pas de partialité auprès de Dieu. »
  rationale: Les deux formulations expriment la même réalité. La formulation verbale est idiomatique en français moderne; elle n’introduit aucune distinction théologique absente du grec.
translation_notes:
  register: Français international moderne, clair et digne. « Favoritisme » est immédiatement compréhensible; la note conserve l’alternative plus formelle « partialité ».
