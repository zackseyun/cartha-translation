source:
  edition: SBLGNT
  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: fr
  text: 'Toi donc qui enseignes quelqu’un d’autre, ne t’enseignes-tu pas toi-même ? Toi qui proclames : « Ne vole pas », voles-tu ?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la conclusion tirée de l’argument précédent et conserve clairement la progression logique.
- source_word: διδάσκων
  choice: qui enseignes
  rationale: Le participe substantivé est rendu naturellement par une proposition relative, tout en gardant l’idée d’une activité caractéristique.
- source_word: ἕτερον
  choice: quelqu’un d’autre
  rationale: Préserve le singulier grec et exprime en français courant le contraste avec « toi-même ».
- source_word: σεαυτὸν
  choice: toi-même
  rationale: Conserve l’objet réfléchi et souligne le contraste rhétorique entre l’enseignement donné à autrui et celui qu’on devrait s’appliquer à soi.
- source_word: οὐ διδάσκεις;
  choice: ne t’enseignes-tu pas
  rationale: Maintient la forme interrogative négative et sa force de reproche, avec la construction réfléchie requise en français.
- source_word: κηρύσσων
  choice: qui proclames
  rationale: Rend l’idée d’une annonce publique sans limiter le terme au cadre ecclésial que pourrait suggérer « prêcher ».
- source_word: μὴ κλέπτειν
  choice: « Ne vole pas »
  rationale: Le contenu proclamé prend naturellement en français la forme d’une interdiction directe, sans modifier son sens.
- source_word: κλέπτεις;
  choice: voles-tu ?
  rationale: La question directe et concise conserve la vigueur accusatrice de Paul.
