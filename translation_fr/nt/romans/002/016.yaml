id: ROM.2.16
reference: Romans 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: fr
  text: le jour où Dieu jugera les secrets des êtres humains par Jésus le Messie[a], selon mon Évangile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par Jésus-Christ ».'
    reason: Autre manière de rendre Χριστοῦ Ἰησοῦ, en employant la forme française traditionnelle.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: le jour où
  rationale: Cette tournure rend naturellement en français la construction temporelle grecque et maintient la référence à un jour déterminé de jugement.
- source_word: κρίνει
  choice: jugera
  rationale: Bien que le grec emploie le présent, le futur est plus naturel en français pour désigner l’action divine qui aura lieu au jour évoqué.
- source_word: τὰ κρυπτὰ
  choice: les secrets
  rationale: Le terme désigne ce qui est caché ou tenu secret. « Les secrets » est concis, naturel et conserve la portée générale du grec.
- source_word: τῶν ἀνθρώπων
  choice: des êtres humains
  rationale: ἄνθρωποι désigne ici l’humanité sans distinction de sexe ; cette formulation explicite clairement la portée générique.
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: selon l’Évangile que j’annonce
  rationale: Cette formulation française naturelle exprime le sens du possessif paulinien sans laisser entendre que Paul revendique un Évangile qui lui serait propre par son contenu.
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: par Jésus le Messie
  rationale: διά suivi du génitif marque ici l’intermédiaire ou l’agent du jugement. En français, « Jésus le Messie » conserve la valeur de titre de Χριστός tout en évitant le tour peu idiomatique « Messie Jésus ».
theological_decisions:
- issue: Valeur de Χριστοῦ comme titre ou comme élément quasi nominal
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Dans ce contexte, Χριστός peut encore être entendu comme un titre. Le texte principal rend explicitement ce sens, tandis que la forme traditionnelle française est conservée en note.
- issue: Rapport entre le jugement de Dieu et l’action de Jésus
  choice: Dieu jugera … par Jésus le Messie
  alternative: Jésus le Messie jugera de la part de Dieu
  rationale: 'La traduction retenue respecte directement la syntaxe grecque : Dieu est le sujet de κρίνει et Jésus le Messie est introduit par διά comme médiateur ou agent, sans résoudre davantage la relation théologique.'
translation_notes:
  register: Français international moderne, clair et digne. Le verset conserve sa forme de proposition dépendante du contexte précédent. « Évangile que j’annonce » privilégie la clarté idiomatique, tandis que « Jésus le Messie » maintient la force titulaire de Χριστός.
