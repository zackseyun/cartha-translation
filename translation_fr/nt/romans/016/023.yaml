source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: fr
  text: Gaïus, mon hôte et celui de toute l’Église, vous salue. Éraste, le trésorier de la ville[a], vous salue, ainsi que Quartus, le frère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’administrateur de la ville ». Le terme grec peut désigner plus largement un responsable de l’administration municipale, même si « trésorier » correspond probablement à la fonction visée ici.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀσπάζεται
  choice: vous salue
  rationale: Dans une conclusion épistolaire, le verbe exprime la transmission d’une salutation personnelle. « Vous salue » est naturel, direct et fidèle.
- source_word: ξένος
  choice: qui m’accueille chez lui
  rationale: Dans ce contexte, le nom désigne celui qui offre l’hospitalité. Cette formulation évite l’ambiguïté du français « hôte », qui peut désigner aussi bien la personne qui reçoit que celle qui est reçue.
- source_word: ὅλης τῆς ἐκκλησίας
  choice: ainsi que toute l’Église
  rationale: L’expression étend l’hospitalité de Gaïus à l’ensemble de la communauté chrétienne. « Église » est le terme français courant dans l’usage paulinien, et « toute » rend explicitement ὅλης.
- source_word: οἰκονόμος τῆς πόλεως
  choice: le trésorier de la ville
  rationale: οἰκονόμος désigne un intendant ou administrateur. Dans le cadre civique, « trésorier de la ville » exprime clairement la fonction municipale probable, tandis qu’une note conserve le sens plus large possible.
- source_word: ἀδελφός
  choice: le frère
  rationale: Le grec emploie le masculin singulier avec l’article, sans possessif. « Le frère » en conserve la forme et présente Quartus comme membre de la fraternité chrétienne, sans ajouter « notre ».
theological_decisions:
- issue: Sens de ἐκκλησία dans cette salutation
  choice: Église
  alternative: assemblée ; communauté
  rationale: Chez Paul, le mot désigne couramment la communauté chrétienne. « Église » est ici exact et immédiatement compréhensible, sans préciser davantage sa structure.
- issue: Portée fraternelle de ἀδελφός
  choice: le frère
  alternative: notre frère ; le croyant
  rationale: Le terme masculin singulier est maintenu et son emploi chrétien reste perceptible. La traduction n’ajoute pas de possessif absent du grec et ne neutralise pas le lien familial métaphorique.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « qui m’accueille chez lui » privilégie la clarté sur le nom ambigu « hôte ». La formulation « le frère » demeure volontairement proche du grec, malgré son caractère légèrement marqué en français.
