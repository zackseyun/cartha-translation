source:
  edition: SBLGNT
  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: fr
  text: Saluez aussi l’Église qui est dans leur maison[a]. Saluez Épénète, mon bien-aimé, qui constitue les prémices de l’Asie[b] pour le Messie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’Église qui se réunit dans leur maison ».'
    reason: lexical_alternative
  - marker: b
    text: Il s’agit de la province romaine d’Asie, et non du continent asiatique actuel.
    reason: cultural_note
  - marker: c
    text: 'Ou : « qui fut le premier converti en Asie au Messie ».'
    reason: alternative_reading
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: l’Église qui est dans leur maison
  rationale: Cette formulation reste proche du grec, qui désigne l’assemblée associée à leur maison, sans expliciter dans le texte principal qu’elle s’y réunit.
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: Dans une liste de salutations épistolaires, « Saluez » est la formulation française naturelle et précise.
- source_word: Ἐπαίνετον
  choice: Épénète
  rationale: Forme française traditionnelle et transparente du nom grec Ἐπαίνετος.
- source_word: ἀγαπητόν μου
  choice: mon bien-aimé
  rationale: Cette expression conserve l’affection personnelle et le registre digne de l’adjectif grec.
- source_word: ἀπαρχὴ
  choice: les prémices
  rationale: « Les prémices » préserve l’image agricole et cultuelle de Paul, tandis que « premier converti » en expliciterait seulement le sens contextuel probable.
- source_word: τῆς Ἀσίας
  choice: de l’Asie
  rationale: Le génitif est rendu directement; une note précise qu’il s’agit de la province romaine d’Asie.
- source_word: εἰς Χριστόν
  choice: pour le Messie
  rationale: Avec ἀπαρχή, εἰς exprime ici le but ou la relation. « Pour le Messie » conserve cette construction sans la réduire à une simple indication de conversion.
theological_decisions:
- issue: Traduction de Χριστόν
  choice: le Messie
  alternative: le Christ
  rationale: Χριστός garde ici sa valeur de titre; « Messie » en communique directement le sens sans ajouter de précision confessionnelle.
- issue: Sens de ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν
  choice: qui est les prémices de l’Asie pour le Messie
  alternative: qui a été le premier converti d’Asie au Messie
  rationale: Le texte principal conserve la métaphore des « prémices » ainsi que la relation souple exprimée par εἰς; la note donne le sens contextuel probable sans l’imposer.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve l’image inhabituelle mais signifiante des « prémices » et emploie « Église » au sens d’assemblée locale.
