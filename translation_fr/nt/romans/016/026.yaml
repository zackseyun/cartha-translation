source:
  edition: robinson-pierpont-2005-byzantine
  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: fr
  text: mais qui a maintenant été révélé et, par les Écritures prophétiques, fait connaître à toutes les nations, selon l’ordre du Dieu éternel, en vue de l’obéissance de la foi,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φανερωθέντος
  choice: qui a maintenant été révélé
  rationale: Le participe renvoie au « mystère » du verset 25. « Révélé » exprime naturellement la mise au jour de ce qui était auparavant tenu secret, tandis que le relatif « qui » rend explicite en français le lien grammatical.
- source_word: γραϕῶν προφητικῶν
  choice: les Écrits prophétiques
  rationale: Dans ce contexte, γραφαί désigne les écrits sacrés, qualifiés de prophétiques. « Écrits » conserve toutefois la forme lexicale et évite de réduire l’expression aux seuls livres classés comme prophétiques.
- source_word: ἐπιταγὴν
  choice: l’ordre
  rationale: Le terme désigne une directive revêtue d’autorité. « Sur l’ordre de » est une formulation française actuelle et naturelle.
- source_word: ὑπακοὴν πίστεως
  choice: l’obéissance de la foi
  rationale: 'La formulation conserve le génitif grec et son ambiguïté féconde : il peut s’agir de l’obéissance qui découle de la foi, qui consiste dans la foi, ou qui lui appartient. Elle reprend aussi l’expression de Romains 1.5.'
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Ce choix rend la portée universelle de l’expression sans imposer ici le sens plus contrastif de « non-Juifs ».
- source_word: γνωρισθέντος
  choice: porté à la connaissance
  rationale: Le participe signifie « faire connaître ». La tournure passive s’accorde avec le mystère comme référent et distingue cet acte de la révélation exprimée par φανερωθέντος.
theological_decisions:
- issue: Sens de « l’obéissance de la foi »
  choice: Conserver le génitif sous la forme « de la foi »
  alternative: « afin que tous croient et obéissent » ou « afin de conduire à l’obéissance qui vient de la foi »
  rationale: Le grec ne tranche pas explicitement entre plusieurs relations possibles de la foi à l’obéissance. La traduction préserve donc la tension sans développer une interprétation particulière.
- issue: Référent implicite des participes
  choice: Employer le relatif masculin « qui », renvoyant au « mystère » du verset 25
  alternative: Répéter « le mystère » dans ce verset
  rationale: Les participes grecs au génitif masculin singulier reprennent naturellement μυστηρίου au verset précédent. Le relatif assure la continuité sans ajouter une répétition absente du texte.
- issue: But exprimé par εἰς ὑπακοὴν πίστεως
  choice: « afin de les conduire à l’obéissance de la foi »
  alternative: « en vue de l’obéissance de la foi »
  rationale: La formulation rend clairement la valeur finale de εἰς en français. Le pronom « les » reprend « toutes les nations » de manière idiomatique, sans limiter l’obéissance à un groupe particulier.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase demeure volontairement suspendue, puisqu’elle fait partie de la longue doxologie des versets 25–27. La majuscule à « Écrits » signale leur caractère scripturaire tout en gardant la valeur concrète de γραφαί.
