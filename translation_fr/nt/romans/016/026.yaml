review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement les deux participes se rapportant au « mystère » de Romains 16.25, l’instrument des γραφαὶ προφητικαί, l’ordre du Dieu éternel, la portée universelle de πάντα τὰ ἔθνη et l’expression volontairement ouverte « obéissance de la foi ». Toutefois, « afin de les conduire » explicite et renforce la relation finale de εἰς en introduisant une action de conduite et un pronom qui ne sont pas exprimés dans le grec. « En vue de l’obéissance de la foi » est plus proche et préserve mieux la concision de la doxologie.
  naturalness: La phrase révisée reste naturellement lisible en français moderne tout en conservant sa dépendance syntaxique à l’égard du « mystère » du verset précédent. « Fait connaître » est plus direct et idiomatique ici que « porté à la connaissance ».
  terminology: « Écritures prophétiques » est l’expression française usuelle et précise pour γραφαὶ προφητικαί dans ce contexte scripturaire. « Ordre », « Dieu éternel », « toutes les nations » et « obéissance de la foi » conviennent et ne surinterprètent pas le texte.
  issues:
