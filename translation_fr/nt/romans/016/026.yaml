    issue: « afin de les conduire à l’obéissance de la foi » ajoute une médiation causative et explicite le complément par « les ».
    rationale: εἰς ὑπακοὴν πίστεως exprime littéralement la visée ou le but, sans verbe correspondant à « conduire » ni pronom représentant les nations. La reformulation proposée maintient l’ambiguïté du génitif πίστεως et la formulation paulinienne.
  - severity: low
