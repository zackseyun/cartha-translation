id: ROM.16.27
reference: Romans 16:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: robinson-pierpont-2005-byzantine
  text: μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/027.yaml
  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: fr
  text: Au Dieu seul sage, par Jésus le Messie, à qui soit la gloire pour toujours. Amen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset conclut la doxologie finale de Romains 16,25–27. Comme indiqué en Romains 16,25, la présence et l’emplacement de cette doxologie varient sensiblement dans les manuscrits anciens ; elle est conservée ici selon la tradition majoritaire byzantine.
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: seul
  rationale: Avec « Dieu sage », le terme souligne que Dieu seul possède la sagesse suprême; « au Dieu seul sage » conserve aussi la concision solennelle du grec.
- source_word: σοφῷ
  choice: sage
  rationale: Équivalent direct et naturel de σοφός dans cette doxologie.
- source_word: διὰ
  choice: par
  rationale: Avec le génitif Ἰησοῦ Χριστοῦ, « par » exprime naturellement la médiation ou l'intermédiaire sans préciser davantage la relation.
- source_word: Χριστοῦ
  choice: le Messie
  rationale: Χριστός est ici un titre; « le Messie » en restitue le sens dans un français actuel et compréhensible.
- source_word: ᾧ
  choice: à qui
  rationale: Le pronom relatif au datif est conservé sans expliciter son antécédent, afin de préserver la légère ambiguïté syntaxique entre Dieu et Jésus le Messie.
- source_word: εἰς τοὺς αἰῶνας
  choice: pour toujours
  rationale: Cette expression, littéralement « pour les âges », est une formule grecque courante exprimant une durée sans fin; « pour toujours » est naturel et fidèle en français.
theological_decisions:
- issue: Antécédent de ᾧ (« à qui »)
  choice: Conserver « à qui » sans identifier explicitement l'antécédent
  alternative: « à lui soit la gloire » ou expliciter « à Dieu » / « à Jésus le Messie »
  rationale: La construction grecque permet une légère ambiguïté quant à l'antécédent. La traduction ne doit pas résoudre silencieusement cette tension.
translation_notes:
  register: Français international moderne, sobre et liturgique. La tournure « au Dieu seul sage » garde la structure doxologique du grec. Le marqueur [a] est placé après le verset entier puisqu'il porte sur l'ensemble de la conclusion.
