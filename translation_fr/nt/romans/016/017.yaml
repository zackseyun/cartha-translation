id: ROM.16.17
reference: Romans 16:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: fr
  text: Je vous exhorte, frères[a], à prendre garde à ceux qui provoquent des divisions et des obstacles qui font trébucher, contrairement à l’enseignement que vous avez appris. Éloignez-vous d’eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « frères et sœurs » ; le grec dit « frères » et s’adresse probablement à toute l’assemblée.
    reason: Alternative lexicale et précision sur la portée inclusive probable du vocatif masculin pluriel.
lexical_decisions:
- source_word: Παρακαλῶ
  choice: Je vous exhorte
  rationale: Le verbe introduit ici un appel pastoral pressant. « Je vous exhorte » en conserve la force avec un registre digne et naturel.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le vocatif masculin pluriel est rendu formellement par « frères »; dans l’usage paulinien, il peut désigner l’ensemble de l’assemblée, ce que précise la note.
- source_word: σκοπεῖν
  choice: à prendre garde à
  rationale: Le verbe demande d’identifier attentivement certaines personnes tout en s’en méfiant; « prendre garde à » exprime ces deux aspects.
- source_word: διχοστασίας
  choice: des divisions
  rationale: Ce terme désigne des dissensions qui fragmentent la communauté; « divisions » est clair et direct.
- source_word: σκάνδαλα
  choice: mettent des obstacles sur le chemin des autres
  rationale: Cette formulation française rend l’image de ce qui fait trébucher sans réduire le terme à une simple offense ressentie.
- source_word: παρὰ τὴν διδαχὴν
  choice: contrairement à l’enseignement
  rationale: παρά avec l’accusatif marque ici l’écart ou l’opposition par rapport à l’enseignement reçu.
- source_word: ἣν ὑμεῖς ἐμάθετε
  choice: que vous avez reçu
  rationale: Le grec dit littéralement « que vous avez appris ». En français, « l’enseignement que vous avez reçu » est plus idiomatique et garde l’idée d’une instruction déjà transmise.
- source_word: ποιοῦντας
  choice: qui causent … et mettent
  rationale: Le participe décrit ceux qui produisent les divisions et les obstacles; une proposition relative est naturelle en français.
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: Éloignez-vous d’eux
  rationale: L’impératif conserve l’image directionnelle d’un mouvement à l’écart et exprime clairement la conduite demandée.
theological_decisions:
- issue: Portée représentative de ἀδελφοί dans l’adresse à l’assemblée de Rome
  choice: Conserver « frères » dans le texte et signaler en note que l’ensemble de l’assemblée est probablement visé.
  alternative: Traduire directement « frères et sœurs ».
  rationale: Le grec emploie le masculin pluriel, mais l’usage communautaire paulinien inclut vraisemblablement les femmes. La note préserve à la fois la forme du texte source et sa portée probable.
- issue: Sens métaphorique de σκάνδαλα
  choice: Conserver l’idée d’obstacles placés sur le chemin des autres.
  alternative: Employer « sujets de chute » ou « occasions de péché ».
  rationale: Le contexte ne précise pas exclusivement une chute morale ou doctrinale. La traduction conserve donc l’image et son amplitude sans résoudre indûment la nature exacte du dommage.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque longue est divisée avant l’impératif final pour améliorer la lisibilité sans modifier la relation logique. « Je vous exhorte » garde la solennité pastorale; « mettre des obstacles sur le chemin » préserve de manière intelligible la métaphore de σκάνδαλα.
