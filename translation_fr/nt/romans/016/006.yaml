base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: fr
  text: Saluez Marie[a], qui a beaucoup travaillé pour vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « pour nous » ou « parmi vous » au lieu de « pour vous ».
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: Impératif aoriste moyen à la deuxième personne du pluriel, employé dans un contexte épistolaire pour transmettre des salutations. « Saluez » est la formulation française usuelle, concise et naturelle.
- source_word: Μαριάμ
  choice: Marie
  rationale: « Marie » est la forme française traditionnelle et immédiatement reconnaissable du nom Μαριάμ.
- source_word: ἥτις
  choice: qui
  rationale: Le pronom relatif introduit une précision descriptive au sujet de Marie. « Qui » rend naturellement ce lien sans surinterpréter la légère nuance qualitative possible.
- source_word: πολλὰ
  choice: beaucoup
  rationale: Employé adverbialement avec ἐκοπίασεν, le terme exprime l’ampleur de l’effort fourni. « Beaucoup travaillé » est idiomatique en français et conserve cette intensité.
- source_word: ἐκοπίασεν
  choice: a travaillé
  rationale: Le verbe κοπιάω évoque un travail pénible ou soutenu. Avec « beaucoup », « a travaillé » transmet clairement l’idée d’un effort considérable sans lourdeur de style.
- source_word: εἰς ὑμᾶς
  choice: pour vous
  rationale: Avec des personnes, εἰς exprime ici naturellement l’orientation ou le bénéfice. « Pour vous » suit le texte grec retenu et convient au contexte de service rendu aux destinataires.
theological_decisions:
- issue: Variante textuelle dans la dernière expression
  choice: pour vous
  alternative: pour nous ; parmi vous
  rationale: Le texte du SBLGNT porte εἰς ὑμᾶς (« pour vous »). D’autres manuscrits ont εἰς ἡμᾶς (« pour nous ») ou ἐν ὑμῖν (« parmi vous »). Le texte principal suit l’édition grecque fournie, tandis que la note conserve les autres lectures significatives.
translation_notes:
  register: Français international moderne, simple et digne. La formulation reste proche de la structure grecque tout en étant naturelle à l’oral comme à l’écrit.
