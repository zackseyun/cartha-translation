review_pass:
  verdict: revise
  source_fidelity: « Saluez » rend fidèlement les deux impératifs pluriels ἀσπάσασθε. « Apellès » et « Aristobule » sont des formes françaises recevables. « qui a fait ses preuves » rend de façon juste la valeur d’une personne éprouvée et reconnue de δόκιμος, sans spécifier l’épreuve ni l’agent de l’approbation. « ceux de la maison d’Aristobule » exprime naturellement l’ellipse τοὺς ἐκ τῶν Ἀριστοβούλου, qui désigne vraisemblablement les personnes rattachées à sa maisonnée.
  naturalness: Le seul point nécessitant correction est « dans le Messie ». Bien que littéral et motivé par la valeur titulaire de Χριστός, ce tour n’est pas naturel dans la phraséologie paulinienne française moderne. « dans le Christ » est l’expression idiomatique établie, tout en conservant le titre avec son article. Le reste est fluide et de registre approprié.
  terminology: « dans le Christ » préserve la portée théologique de ἐν Χριστῷ sans imposer une paraphrase doctrinale. La note peut conserver « en Christ » comme formulation traditionnelle; il s’agit d’une variante de traduction, non d’une variante textuelle.
  issues:
  - severity: medium
    issue: « dans le Messie » est peu idiomatique en français dans cette formule paulinienne.
    rationale: Le grec ἐν Χριστῷ doit garder son caractère de formule relationnelle/participative, mais en français moderne « dans le Christ » est à la fois naturel et fidèle au titre Χριστός. « Le Messie » dans cette construction paraît artificiel et peut indûment déplacer l’effet vers un emploi descriptif.
  revised_text: Saluez Apellès, qui a fait ses preuves dans le Christ[a]. Saluez ceux de la maison d’Aristobule.
  revised_footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « en Christ ».'
    reason: alternative_reading
  revision_rationale: Remplacement de « dans le Messie » par « dans le Christ » pour employer une formulation française naturelle de la locution paulinienne ἐν Χριστῷ, tout en conservant l’article qui marque la valeur de titre. Aucun autre changement n’est nécessaire.
