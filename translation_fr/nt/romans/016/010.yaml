  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: fr
  text: Saluez Apellès, qui a fait ses preuves dans le Christ[a]. Saluez ceux de la maison d’Aristobule.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « en Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: L’impératif pluriel appelle les destinataires à transmettre leurs salutations. « Saluez » est concis, naturel et convient à la série d’exhortations de Romains 16.
- source_word: Ἀπελλῆν
  choice: Apellès
  rationale: Translittération française usuelle du nom propre grec.
- source_word: τὸν δόκιμον
  choice: qui a fait ses preuves
  rationale: δόκιμος qualifie une personne éprouvée et reconnue comme authentique ou digne d’approbation. Cette formulation française rend naturellement la valeur commendataire de l’adjectif substantivé sans préciser abusivement la nature de l’épreuve.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: La préposition garde l’idée paulinienne de sphère ou d’union, tandis que « le Messie » rend la valeur titulaire de Χριστός.
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: ceux de la maison d’Aristobule
  rationale: L’expression elliptique désigne vraisemblablement les membres ou dépendants de la maisonnée d’Aristobule, sans nécessairement inclure Aristobule lui-même. « Maison » conserve cette portée collective de manière claire.
theological_decisions:
- issue: Rendu de Χριστῷ dans la formule paulinienne ἐν Χριστῷ
  choice: dans le Messie
  alternative: en Christ
  rationale: Le rendu principal maintient à la fois la préposition grecque et la valeur de titre de Χριστός, sans paraphraser l’expression comme une simple appartenance religieuse. La formulation traditionnelle est signalée en note.
- issue: Portée de δόκιμος
  choice: qui a fait ses preuves
  alternative: l’homme approuvé
  rationale: Le grec indique qu’Apellès a été éprouvé et reconnu, mais ne dit ni par qui ni dans quelles circonstances. Le choix retenu préserve cette indétermination.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « Saluez » reproduit la structure exhortative du grec. « Maison » est employé au sens de maisonnée ou entourage domestique.
