  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: fr
  text: Moi[a], Tertius, qui ai écrit cette lettre, je vous salue dans le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction, moins probable : « Moi, Tertius, qui ai écrit cette lettre dans le Seigneur, je vous salue. » L’expression grecque « dans le Seigneur » peut se rattacher à « ai écrit », mais elle qualifie plus naturellement la salutation.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: je vous salue
  rationale: Dans cette conclusion épistolaire, le verbe signifie adresser ses salutations. « Je vous salue » est naturel, concis et n’ajoute aucune nuance affective absente du grec.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom grec est à la deuxième personne du pluriel; « vous » en rend directement le nombre et la fonction d’objet.
- source_word: ἐγὼ Τέρτιος
  choice: Moi, Tertius
  rationale: Le pronom sujet explicite distingue nettement le nouveau locuteur. La reprise par « je » dans la proposition principale donne en français moderne une dislocation naturelle et met en valeur l’auto-identification.
- source_word: ὁ γράψας
  choice: qui ai écrit
  rationale: Le participe aoriste substantivé identifie Tertius comme celui qui a matériellement rédigé la lettre. L’accord à la première personne est requis puisque l’antécédent est le locuteur lui-même.
- source_word: τὴν ἐπιστολήν
  choice: cette lettre
  rationale: Bien que le grec emploie l’article défini, le démonstratif est idiomatique en français lorsque l’auteur matériel désigne la lettre en cours, sans modifier le référent.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette expression paulinienne est conservée sous une forme traditionnelle et intelligible. Dans l’ordre retenu, elle qualifie le plus naturellement la salutation et exprime la sphère de communion chrétienne.
theological_decisions:
- issue: Rattachement de ἐν κυρίῳ (« dans le Seigneur »)
  choice: L’expression qualifie principalement « je vous salue ».
  alternative: 'Elle peut se rattacher à « qui ai écrit cette lettre » : « qui ai écrit cette lettre dans le Seigneur ».'
  rationale: La position finale permet grammaticalement les deux rattachements. Dans une formule de salutation, le lien avec le verbe principal est plus naturel, mais l’autre analyse reste possible; elle est donc signalée en note plutôt qu’exclue.
translation_notes:
  register: Français moderne, digne et accessible. La construction détachée « Moi, Tertius, … je » rend l’insistance du pronom grec tout en restant idiomatique. Le nom propre « Tertius » est conservé sous sa forme biblique usuelle.
