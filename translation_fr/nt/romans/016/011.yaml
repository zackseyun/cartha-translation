id: ROM.16.11
reference: Romans 16:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: fr
  text: Saluez Hérodion, mon parent[a]. Saluez les gens de Narcisse[b] qui sont dans le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon compatriote » ou « un autre Juif » ; le terme grec peut désigner un parent par le sang ou quelqu’un qui appartient, comme Paul, au peuple juif.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit probablement de membres de la maisonnée ou du domaine de Narcisse qui croient au Seigneur.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: Dans une série de salutations épistolaires, l’impératif pluriel se rend naturellement et directement par « Saluez ».
- source_word: Ἡρῳδίωνα
  choice: Hérodion
  rationale: Le nom propre est translittéré selon l’usage français courant pour les noms bibliques grecs.
- source_word: συγγενῆ μου
  choice: mon parent
  rationale: « Parent » exprime le sens familial premier sans préciser le degré de parenté. Comme le mot grec peut aussi désigner un compatriote, notamment un autre Juif chez Paul, cette possibilité est signalée en note.
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: les gens de Narcisse
  rationale: Cette formulation française indique un groupe associé à Narcisse sans introduire explicitement le mot « maison », absent du grec. Elle reste assez souple pour inclure les membres de sa maisonnée ou de son domaine.
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: qui sont dans le Seigneur
  rationale: La formulation conserve l’expression paulinienne et sa portée théologique, au lieu de la réduire à une paraphrase telle que « qui sont croyants ».
- source_word: κυρίῳ
  choice: Seigneur
  rationale: « Seigneur » est le terme français établi ici et préserve l’expression chrétienne paulinienne « dans le Seigneur ».
theological_decisions:
- issue: Sens de συγγενής dans les salutations de Paul
  choice: mon parent
  alternative: mon compatriote ; mon frère de race, c’est-à-dire un autre Juif
  rationale: Le contexte immédiat ne permet pas de décider si Paul parle d’un lien familial ou de l’appartenance au même peuple. Le texte principal retient le sens familial naturel, tandis que la note maintient ouverte la portée ethnique attestée chez Paul.
- issue: Identité du groupe associé à Narcisse
  choice: les gens de Narcisse
  alternative: ceux de la maison de Narcisse ; les membres de la maisonnée de Narcisse
  rationale: Le grec marque leur association avec Narcisse sans employer explicitement le nom « maison » ou « maisonnée ». La traduction évite donc d’ajouter ce détail au texte principal, tout en indiquant en note l’interprétation probable.
translation_notes:
  register: Français international moderne, simple et digne. « Les gens de Narcisse » conserve une certaine indétermination tout en restant plus naturel que le calque « ceux de Narcisse ». L’expression paulinienne « dans le Seigneur » est maintenue.
