id: ROM.16.2
reference: Romans 16:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: fr
  text: afin que vous l’accueilliez dans le Seigneur d’une manière digne des saints, et que vous lui apportiez votre aide dans toute affaire où elle pourrait avoir besoin de vous. En effet, elle-même a été la bienfaitrice de beaucoup[a], et aussi de moi-même.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « protectrice », « soutien » ou « patronne ». Le terme grec désigne une femme qui apportait à d’autres un soutien important, probablement matériel et social.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: vous l’accueilliez
  rationale: Le verbe désigne ici le fait de recevoir favorablement Phoebé dans la communauté; « accueillir » exprime naturellement cette réception hospitalière.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: Cette formulation paulinienne conserve l’idée de la communion et de la relation qui ont leur cadre dans le Seigneur.
- source_word: ἀξίως τῶν ἁγίων
  choice: d’une manière digne des saints
  rationale: La traduction garde la valeur adverbiale de ἀξίως et le terme paulinien traditionnel pour désigner les croyants.
- source_word: παραστῆτε αὐτῇ
  choice: vous lui apportiez votre aide
  rationale: Dans ce contexte, le verbe signifie se tenir aux côtés de quelqu’un pour lui prêter assistance; cette formulation est claire et naturelle en français.
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: dans toute affaire où elle pourrait avoir besoin de vous
  rationale: « Affaire » préserve l’étendue de πρᾶγμα, et le conditionnel rend la nuance éventuelle portée par ἄν avec le subjonctif.
- source_word: προστάτις
  choice: bienfaitrice
  rationale: Le nom féminin évoque une femme qui soutient d’autres personnes, probablement par une aide matérielle, sociale ou protectrice. « Bienfaitrice » est idiomatique et indique une contribution substantielle sans imposer un statut technique.
- source_word: ἐγενήθη
  choice: a été
  rationale: Le passé composé exprime naturellement en français un rôle exercé dans le passé et pertinent pour l’exhortation présente.
- source_word: ἐμοῦ αὐτοῦ
  choice: aussi de moi-même
  rationale: La formulation conserve à la fois la valeur additive de καί et l’insistance du pronom αὐτοῦ.
theological_decisions:
- issue: Sens de προστάτις appliqué à Phoebé
  choice: bienfaitrice
  alternative: protectrice, soutien ou patronne
  rationale: Le terme indique vraisemblablement un rôle social important de soutien ou de patronage. « Bienfaitrice » préserve l’action et l’importance de Phoebé sans réduire son rôle à une aide occasionnelle ni lui attribuer un office ecclésiastique non explicité par le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe suit le mouvement de la phrase grecque tout en divisant la longue période pour en faciliter la lecture. « Saints » conserve le vocabulaire paulinien établi; « bienfaitrice » évite le sens commercial moderne que peut prendre « patronne ».
