id: ROM.16.15
reference: Romans 16:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: fr
  text: Saluez Philologue et Julia[a], Nérée et sa sœur, ainsi qu’Olympas et tous les saints qui sont avec eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, peut-être, « Julias », si le nom est compris comme masculin ; la forme grecque est généralement comprise comme le prénom féminin « Julia ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: Impératif épistolaire adressé à plusieurs personnes ; « Saluez » est la formulation française naturelle et concise.
- source_word: Φιλόλογον
  choice: Philologue
  rationale: Nom propre rendu selon sa forme française traditionnelle, distincte du nom commun par la majuscule.
- source_word: Ἰουλίαν
  choice: Julia
  rationale: La forme accusative grecque correspond le plus naturellement au prénom féminin Julia ; l’interprétation masculine minoritaire est signalée en note.
- source_word: Νηρέα
  choice: Nérée
  rationale: Forme française usuelle du nom propre grec.
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: sa sœur
  rationale: Rend directement le lien familial et le possessif, dont l’antécédent naturel est Nérée.
- source_word: Ὀλυμπᾶν
  choice: Olympas
  rationale: Transcription française claire du nom propre grec Ὀλυμπᾶς.
- source_word: τοὺς σὺν αὐτοῖς
  choice: qui sont avec eux
  rationale: Explicite naturellement en français l’expression grecque d’association sans en préciser davantage la nature.
- source_word: πάντας ἁγίους
  choice: tous les saints
  rationale: Conserve la désignation paulinienne traditionnelle des croyants et rend explicitement πάντας, sans introduire l’idée ultérieure de canonisation.
theological_decisions:
- issue: Sens de ἅγιοι dans une liste de salutations paulinienne
  choice: les saints
  alternative: les croyants consacrés à Dieu ; les membres du peuple saint
  rationale: « Les saints » préserve le vocabulaire paulinien et sa portée communautaire sans paraphrase doctrinale.
- issue: Genre du nom Ἰουλίαν
  choice: Julia
  alternative: Julias
  rationale: La forme grecque est communément et plus naturellement comprise comme le prénom féminin Julia, tout en permettant de signaler l’analyse masculine proposée dans l’histoire de la traduction.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe suit clairement la série des personnes saluées ; « ainsi que » évite une accumulation pesante de coordinations. Les noms suivent des formes françaises établies ou des transcriptions transparentes.
