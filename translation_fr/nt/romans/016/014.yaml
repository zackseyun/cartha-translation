source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: fr
  text: Saluez Asyncrite, Phlégon, Hermès, Patrobas, Hermas, ainsi que les frères qui sont avec eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: Impératif aoriste moyen à la deuxième personne du pluriel. Dans cette liste finale de salutations, « Saluez » est la formulation française naturelle, concise et digne.
- source_word: Ἀσύγκριτον
  choice: Asyncrite
  rationale: Nom propre transcrit selon sa forme française traditionnelle.
- source_word: Φλέγοντα
  choice: Phlégon
  rationale: Nom propre transcrit selon l’usage français, avec accentuation facilitant la lecture.
- source_word: Ἑρμῆν
  choice: Hermès
  rationale: Nom propre transcrit sous sa forme française usuelle. Bien qu’identique au nom français de la divinité grecque, il désigne clairement ici une personne.
- source_word: Πατροβᾶν
  choice: Patrobas
  rationale: Nom propre transcrit selon sa forme française traditionnelle.
- source_word: Ἑρμᾶν
  choice: Hermas
  rationale: Nom propre transcrit de manière à le distinguer de Ἑρμῆν (« Hermès »), qui le précède.
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: les frères qui sont avec eux
  rationale: « Les frères » conserve le masculin pluriel explicite de ἀδελφούς, tandis que la relative « qui sont avec eux » rend naturellement σὺν αὐτοῖς et désigne les croyants associés aux hommes nommés.
theological_decisions:
- issue: Rendu de ἀδελφούς dans une salutation communautaire
  choice: les frères
  alternative: les frères et sœurs ; les croyants
  rationale: Le grec porte explicitement le masculin pluriel. Le contexte ne permet pas d’établir avec certitude que le groupe est mixte ; la traduction conserve donc la forme du texte sans imposer une précision inclusive ni exclure que le terme puisse avoir une portée communautaire.
translation_notes:
  register: Français international moderne, naturel et digne. Les noms suivent les formes françaises bibliques courantes. La phrase conserve la brièveté de la liste de salutations de Paul.
