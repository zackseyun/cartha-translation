id: ROM.16.18
reference: Romans 16:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: fr
  text: En effet, de telles personnes ne servent pas notre Seigneur, le Messie[a], mais leur propre ventre[b] ; par des discours séduisants et des flatteries, elles trompent le cœur des gens sans méfiance[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « notre Seigneur, le Christ ».'
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « leur propre ventre », image frappante des désirs centrés sur soi et de la recherche de sa propre satisfaction.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « des innocents » ou « des gens sans malice ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: de telles personnes
  rationale: Renvoie aux fauteurs de divisions du verset précédent tout en restant naturel et inclusif en français moderne.
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: notre Seigneur, le Messie
  rationale: Rend κύριος par « Seigneur » et traduit Χριστός comme un titre. L’apposition française exprime clairement que le Messie est le Seigneur mentionné, sans ajouter « Jésus », absent du texte grec.
- source_word: δουλεύουσιν
  choice: servent
  rationale: Conserve le contraste direct entre le service rendu au Seigneur et l’asservissement aux intérêts personnels, sans surcharger ici la nuance esclavagiste du verbe.
- source_word: κοιλίᾳ
  choice: ventre
  rationale: Préserve l’image concrète et frappante de Paul plutôt que de la réduire par interprétation à « appétits » ou « désirs ».
- source_word: χρηστολογίας
  choice: discours séduisants
  rationale: Désigne des propos agréables et persuasifs employés pour gagner la confiance. « Séduisants » exprime ici à la fois leur attrait et leur fonction trompeuse.
- source_word: εὐλογίας
  choice: flatteries
  rationale: Dans ce contexte négatif, le terme désigne des paroles élogieuses destinées à manipuler, non une bénédiction authentique.
- source_word: ἐξαπατῶσι
  choice: trompent
  rationale: Rend clairement l’action de duper, l’intensité éventuelle du composé étant suffisamment portée par le contexte.
- source_word: καρδίας
  choice: le cœur
  rationale: Le singulier collectif est idiomatique en français dans « le cœur des gens » et conserve la notion biblique de l’être intérieur.
- source_word: ἀκάκων
  choice: les gens sans méfiance
  rationale: Met en avant leur vulnérabilité à la tromperie sans décider qu’ils sont moralement innocents ou intellectuellement naïfs.
theological_decisions:
- issue: Traduction de Χριστός dans le titre paulinien
  choice: le Messie
  alternative: le Christ
  rationale: Χριστός porte ici sa valeur de titre. « Le Messie » en traduit le sens, tandis que « le Christ », forme traditionnelle, demeure signalé en note.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La phrase conserve le contraste rhétorique entre le Seigneur et « leur propre ventre », ainsi que l’ambiguïté de ἀκάκων grâce à une formulation principale contextuelle et à des variantes en note.
