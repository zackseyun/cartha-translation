id: ROM.16.1
reference: Romans 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: fr
  text: Je vous recommande Phœbé, notre sœur, qui est aussi diacre[a] de l’Église de Cenchrées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « servante » ou « ministre » de l’Église de Cenchrées. Le mot grec diakonos peut désigner soit une fonction reconnue au service de l’Église, soit, plus généralement, une personne qui sert.
    reason: alternative_reading
lexical_decisions:
- source_word: Συνίστημι
  choice: Je vous recommande
  rationale: Dans ce contexte épistolaire, le verbe introduit favorablement une personne auprès des destinataires. « Je vous recommande » est idiomatique en français et conserve la fonction de recommandation personnelle.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, δέ marque une transition légère, sans contraste net. Un équivalent comme « mais », « donc » ou « maintenant » ajouterait une nuance absente du grec ; la transition est suffisamment portée par le début d’une nouvelle recommandation.
- source_word: Φοίβην
  choice: Phœbé
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: notre sœur
  rationale: Cette traduction directe préserve le langage familial employé pour une croyante, sans ajouter dans le corps du texte « dans la foi ».
- source_word: οὖσαν καὶ
  choice: qui est aussi
  rationale: La proposition relative rend naturellement en français le participe grec tout en conservant la valeur additive de καί.
- source_word: διάκονον
  choice: diacre
  rationale: Le terme grec peut désigner soit une personne qui sert, soit une fonction reconnue dans une communauté. « Diacre » préserve ici la possibilité d’une fonction ecclésiale liée à l’Église de Cenchrées, sans recourir à « diaconesse », terme susceptible d’évoquer des catégories institutionnelles plus tardives. L’ambiguïté lexicale est signalée en note.
- source_word: τῆς ἐκκλησίας
  choice: de l’Église
  rationale: Dans les lettres de Paul, ἐκκλησία désigne normalement la communauté chrétienne locale ; « Église » est le terme français usuel dans ce contexte.
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: de Cenchrées
  rationale: Cette tournure française rend naturellement la relation locative entre la communauté et la ville. « Cenchrées » est la forme française traditionnelle du nom de lieu.
theological_decisions:
- issue: διάκονον désigne-t-il un service en général ou une fonction reconnue dans l’Église ?
  choice: diacre
  alternative: servante ; ministre
  rationale: Le complément « de l’Église de Cenchrées » peut indiquer une relation ministérielle identifiable avec cette communauté, mais le mot grec ne permet pas à lui seul de définir précisément la fonction ni de lui attribuer les structures de traditions ecclésiales ultérieures. Le texte principal retient « diacre » et la note maintient les autres sens possibles.
translation_notes:
  register: Français moderne, clair et digne. La formulation reste concise et conserve le vocabulaire familial et ecclésial du grec. « Diacre » est employé sans article après « être », conformément à l’usage français pour une fonction, et sans féminisation en « diaconesse » afin de ne pas imposer une catégorie historique ou confessionnelle particulière.
