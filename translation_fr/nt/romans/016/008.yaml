  text: ἀσπάσασθε ⸀Ἀμπλιᾶτον τὸν ἀγαπητόν μου ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: fr
  text: Saluez Ampliatus[a], mon bien-aimé dans le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le nom grec peut aussi être transcrit « Amplias » ; la leçon du SBLGNT retenue ici correspond à « Ampliatus ».
    reason: Variante de forme du nom propre.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: L’impératif aoriste moyen, à la deuxième personne du pluriel, exprime ici la formule épistolaire habituelle demandant de transmettre des salutations. « Saluez » est concis, naturel et fidèle.
- source_word: Ἀμπλιᾶτον
  choice: Ampliatus
  rationale: Le nom personnel à l’accusatif est rendu sous sa forme nominative française. La leçon du SBLGNT, Ἀμπλιᾶτον, correspond à « Ampliatus ».
- source_word: ἀγαπητόν μου
  choice: mon bien-aimé
  rationale: Cette formulation conserve la chaleur relationnelle, le possessif et la concision du grec. Elle convient aussi au registre chrétien de Paul sans paraphraser l’expression.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: La préposition ἐν désigne ici la sphère de la relation et de la vie chrétiennes. « Dans le Seigneur » préserve l’expression paulinienne sans ajouter « Jésus », absent du grec.
theological_decisions:
- issue: Portée de l’affection de Paul et rattachement de ἐν κυρίῳ
  choice: « mon bien-aimé dans le Seigneur » qualifie Ampliatus et situe l’affection de Paul dans la communion chrétienne.
  alternative: Comprendre l’expression comme une simple marque d’amitié, ou rattacher « dans le Seigneur » à l’ordre de saluer.
  rationale: L’ordre des mots grec rattache le plus naturellement τὸν ἀγαπητόν μου ἐν κυρίῳ à Ampliatus. La traduction conserve ainsi la dimension théologique de l’affection sans en préciser davantage la nature.
translation_notes:
  register: Français international moderne, naturel et digne. « Bien-aimé » conserve le ton affectueux et ecclésial de Paul ; « dans le Seigneur » maintient la formulation paulinienne traditionnelle et son ouverture sémantique.
