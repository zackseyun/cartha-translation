  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: fr
  text: Saluez Andronicus et Junia[a], mes proches et mes compagnons de captivité. Ils sont remarquables parmi les apôtres[b] et ils étaient dans le Messie avant moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Junia : autre possibilité, « Junias », compris comme un nom masculin ; toutefois, la forme grecque et l’usage ancien favorisent le nom féminin Junia.'
    reason: alternative_reading
  - marker: b
    text: 'L’expression grecque peut aussi se comprendre : « ils sont bien connus des apôtres ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: Impératif épistolaire direct, rendu de façon concise et naturelle en français.
- source_word: Ἀνδρόνικον καὶ Ἰουνίαν
  choice: Andronicus et Junia
  rationale: Andronicus suit la forme française traditionnelle du nom grec; Junia correspond le plus probablement au nom féminin attesté par la forme grecque et l’usage ancien.
- source_word: τοὺς συγγενεῖς μου
  choice: mes compatriotes
  rationale: Chez Paul, συγγενής peut désigner des parents ou, plus largement, des membres du même peuple. « Compatriotes » conserve ici la référence probable à leur parenté ethnique sans affirmer un lien familial proche.
- source_word: συναιχμαλώτους μου
  choice: mes compagnons de captivité
  rationale: Le composé désigne des personnes ayant partagé la captivité de Paul; cette formulation garde le sens concret tout en restant digne et idiomatique.
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: remarquables parmi les apôtres
  rationale: Rendu direct qui exprime leur notoriété ou distinction sans préciser davantage la nature exacte de celle-ci; l’autre analyse syntaxique est signalée en note.
- source_word: πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ
  choice: ils étaient dans le Messie avant moi
  rationale: La formulation conserve l’antériorité temporelle et l’expression paulinienne « dans le Messie », sans la paraphraser en récit explicite de conversion.
theological_decisions:
- issue: Identité et genre de Ἰουνίαν
  choice: Junia, nom féminin
  alternative: Junias, nom masculin supposé
  rationale: La forme grecque correspond le plus naturellement au nom féminin Junia, bien attesté dans l’Antiquité. L’alternative masculine, historiquement influente mais moins probable, est conservée en note.
- issue: Sens de ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: remarquables parmi les apôtres
  alternative: bien connus des apôtres
  rationale: La construction peut inclure Andronicus et Junia parmi les apôtres en les disant remarquables dans ce groupe, ou indiquer qu’ils jouissaient d’une grande considération auprès des apôtres. Le texte principal suit la lecture la plus directe et la note préserve l’ambiguïté réelle.
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Χριστός est conservé comme titre messianique, et l’expression relationnelle « dans le Messie » reproduit l’idiome paulinien sans l’aplanir.
translation_notes:
  register: Français international moderne, clair et digne. Le verset garde la tournure paulinienne « dans le Messie » et signale en notes les deux ambiguïtés interprétatives majeures sans imposer une conclusion confessionnelle.
