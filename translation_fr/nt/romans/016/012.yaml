id: ROM.16.12
reference: Romans 16:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: fr
  text: Saluez Tryphène et Tryphose, qui se sont donné de la peine dans le Seigneur.[a] Saluez Perside, la bien-aimée,[b] qui s’est donné beaucoup de peine dans le Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ont travaillé dur dans le Seigneur » ou « qui ont peiné dans le Seigneur ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « la bien-aimée » ; le grec ne dit pas explicitement « ma bien-aimée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: Dans une liste de salutations épistolaires, l’impératif « Saluez » est direct, naturel et fidèle.
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: Tryphène et Tryphose
  rationale: Translittérations françaises usuelles de ces noms propres féminins.
- source_word: τὰς κοπιώσας / ἐκοπίασεν
  choice: se sont donné de la peine / s’est donné beaucoup de peine
  rationale: Cette formulation naturelle exprime l’effort soutenu indiqué par κοπιάω et conserve la répétition lexicale entre les deux propositions. Les passés composés présentent ces efforts passés comme pertinents pour l’éloge présent.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: La traduction littérale préserve la formule paulinienne et sa nuance de sphère relationnelle, sans la réduire à « pour le Seigneur ».
- source_word: Περσίδα
  choice: Perside
  rationale: Translittération française traditionnelle et reconnaissable du nom propre.
- source_word: τὴν ἀγαπητήν
  choice: la bien-aimée
  rationale: L’article et l’adjectif grecs désignent Perside comme « la bien-aimée » sans exprimer explicitement le possessif « ma ».
- source_word: πολλὰ
  choice: beaucoup
  rationale: Employé adverbialement, πολλὰ souligne l’ampleur des efforts de Perside.
theological_decisions:
- issue: Portée de ἐν κυρίῳ dans la formule paulinienne
  choice: dans le Seigneur
  alternative: pour le Seigneur / au service du Seigneur
  rationale: « Dans le Seigneur » conserve la richesse de la relation et de la sphère d’activité exprimées par Paul, plutôt que de n’indiquer que le bénéficiaire ou le but du travail.
- issue: Absence de possessif avec τὴν ἀγαπητήν
  choice: la bien-aimée
  alternative: ma bien-aimée
  rationale: Le grec ne contient pas le pronom μου (« ma »). La traduction retenue évite donc d’ajouter une nuance possessive, tout en gardant le caractère affectueux de la désignation.
translation_notes:
  register: Français international actuel, clair et digne. « Se donner de la peine » rend naturellement l’idée d’un travail exigeant, tandis que « dans le Seigneur » conserve la formulation théologique de Paul. Les noms suivent les formes françaises bibliques établies.
