source:
  edition: robinson-pierpont-2005-byzantine
  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: fr
  text: À celui[a] qui peut vous affermir selon mon évangile et la proclamation de Jésus le Messie, selon la révélation du mystère tenu secret durant des temps immémoriaux,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les versets 25 à 27 forment une doxologie finale dont l’emplacement varie dans les manuscrits anciens. Elle se trouve à la fin du chapitre 14 dans la tradition majoritaire byzantine, après le chapitre 15 dans le plus ancien papyrus conservé, et ici, à la fin du chapitre 16, dans d’importants manuscrits du IVe siècle ainsi que dans la tradition latine. Certains manuscrits la placent à plusieurs endroits, tandis que quelques-uns l’omettent entièrement. La plupart des traductions modernes la conservent ici comme conclusion de la lettre de Paul.
    reason: textual_critical
lexical_decisions:
- source_word: στηρίξαι
  choice: affermir
  rationale: Le verbe exprime l’action de rendre ferme et stable dans la foi. « Affermir » est naturel dans ce contexte et conserve l’idée d’établissement aussi bien que celle de fortification.
- source_word: τὸ εὐαγγέλιόν μου
  choice: mon Évangile
  rationale: Cette formulation directe conserve le possessif de Paul sans laisser entendre qu’il serait l’auteur du contenu; il s’agit de la bonne nouvelle qu’il annonce.
- source_word: τὸ κήρυγμα
  choice: la proclamation
  rationale: « Proclamation » rend l’annonce publique et autorisée exprimée par κήρυγμα, dans un registre actuel et digne.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός est rendu comme le titre « le Messie », tandis que le génitif grec reste attaché à « proclamation » sans être explicité dans le corps du texte.
- source_word: μυστηρίου
  choice: mystère
  rationale: « Mystère » désigne ici une réalité divine jusque-là cachée puis révélée, et non une énigme à résoudre.
- source_word: σεσιγημένου
  choice: tenu secret
  rationale: Le participe parfait passif signifie littéralement que le mystère a été gardé dans le silence. Avec « mystère », « tenu secret » exprime naturellement qu’il n’avait pas encore été révélé.
- source_word: χρόνοις αἰωνίοις
  choice: durant des temps immémoriaux
  rationale: Dans cette expression au pluriel, αἰώνιος renvoie à de vastes périodes du passé. « Temps immémoriaux » évite l’idée peu naturelle de « temps éternels » tout en conservant l’ancienneté indéfinie.
theological_decisions:
- issue: Sens du génitif dans « κήρυγμα Ἰησοῦ Χριστοῦ »
  choice: la proclamation de Jésus le Messie
  alternative: la proclamation au sujet de Jésus le Messie / la proclamation faite par Jésus le Messie
  rationale: Le génitif grec peut désigner le contenu de la proclamation ou son auteur. La formulation française retenue préserve cette tension au lieu de trancher silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase demeure ouverte par une virgule, car la doxologie se poursuit aux versets 26 et 27. La répétition de « selon » reproduit la structure grecque et maintient le lien entre l’affermissement, l’Évangile, la proclamation et la révélation.
