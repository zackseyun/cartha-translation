  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: fr
  text: Saluez-vous les uns les autres par un saint baiser[a]. Toutes les Églises du Messie vous saluent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « saint baiser » était une forme de salutation culturellement reconnue, exprimant entre croyants une affection pure et leur communion fraternelle.
    reason: cultural_note
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: Saluez-vous les uns les autres
  rationale: L’impératif de ἀσπάζομαι exprime ici la salutation, et ἀλλήλους marque clairement la réciprocité. Cette tournure est naturelle et digne en français.
- source_word: ἐν φιλήματι ἁγίῳ
  choice: par un saint baiser
  rationale: La préposition ἐν a ici une valeur de moyen ou de manière. « Saint baiser » conserve l’expression concrète du grec et sa qualification cultuelle et morale.
- source_word: Ἀσπάζονται ὑμᾶς
  choice: vous saluent
  rationale: Le présent de ἀσπάζομαι convient directement à la formule épistolaire française « vous saluent »; ὑμᾶς est un pluriel, naturellement rendu par « vous ».
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: Toutes les Églises
  rationale: Cette formulation rend l’ensemble article + πᾶσαι et préserve l’accent collectif de « toutes les assemblées ». La majuscule distingue ici les communautés chrétiennes sans changer le sens lexical.
- source_word: τοῦ Χριστοῦ
  choice: du Messie
  rationale: Χριστός conserve son sens titulaire d’« oint », c’est-à-dire « Messie »; le génitif exprime l’appartenance ou l’association de ces Églises au Messie.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: du Messie
  alternative: du Christ
  rationale: Le terme grec est ici un titre et non nécessairement un simple nom propre. « Messie » en restitue directement le contenu, tandis que « Christ » demeure la forme traditionnelle possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant idiomatique. « Saint baiser » est conservé plutôt que remplacé par une équivalence culturelle moderne, afin de préserver l’image historique et la force de l’exhortation.
