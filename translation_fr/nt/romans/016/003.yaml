  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: fr
  text: Saluez Prisca et Aquilas[a], mes collaborateurs en Jésus, le Messie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Prisca est la forme du nom employée ici ; Priscille est la forme plus familière désignant la même personne ailleurs.
    reason: alternative_reading
  - marker: b
    text: Ou « en Christ Jésus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: Saluez
  rationale: Impératif épistolaire adressé à plusieurs personnes; « Saluez » est concis, naturel et fidèle.
- source_word: Πρίσκαν
  choice: Prisca
  rationale: Le texte grec emploie Πρίσκα, forme du nom distincte de Πρίσκιλλα; la forme familière « Priscille » est signalée en note.
- source_word: Ἀκύλαν
  choice: Aquilas
  rationale: Forme française traditionnelle et courante du nom grec Ἀκύλας.
- source_word: τοὺς συνεργούς μου
  choice: mes collaborateurs
  rationale: Le syntagme désigne des personnes qui travaillent avec Paul à une œuvre commune; « collaborateurs » restitue naturellement cette coopération sans préciser davantage leur rôle.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: dans le Messie Jésus
  rationale: « dans » conserve la formulation paulinienne de sphère ou d’union, tandis que « Messie » rend le titre Χριστός; la tournure traditionnelle est donnée en note.
theological_decisions:
- issue: Traduction de Χριστῷ dans la formule paulinienne ἐν Χριστῷ Ἰησοῦ
  choice: Messie
  alternative: Christ
  rationale: Χριστός conserve ici sa portée titulaire et situe la collaboration en relation avec Jésus comme Messie. « Christ Jésus », formulation française traditionnelle et également possible, est conservé en note.
translation_notes:
  register: Français international moderne, sobre et digne. L’adresse au pluriel est rendue par « Saluez ». « Collaborateurs » est épicène et convient au couple sans lourdeur. Les marqueurs [a] et [b] figurent dans le texte.
