id: ROM.16.24
reference: Romans 16:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: fr
  text: Que la grâce de notre Seigneur Jésus-Christ[b] soit avec vous tous.[a] Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits contiennent ce verset, tandis que d’autres l’omettent; beaucoup d’éditions modernes le placent entre crochets comme variante textuelle dans la conclusion de la lettre aux Romains.
    reason: textual_variant
  - marker: b
    text: 'Ou : « Jésus le Messie ». Le grec Χριστός (Christos) est un titre qui signifie « Messie »; « Christ » en est la forme traditionnellement transcrite en français.'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: « Grâce » est le terme français naturel et traditionnel pour la faveur généreuse de Dieu dans les bénédictions pauliniennes; il en conserve ici la portée théologique.
- source_word: κυρίου
  choice: Seigneur
  rationale: Dans ce titre appliqué à Jésus, « Seigneur » exprime naturellement son autorité et correspond au sens de κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  rationale: « Jésus-Christ » est la forme française courante, claire et digne. Une note signale que Χριστός est à l’origine un titre signifiant « Messie ».
- source_word: μετὰ πάντων ὑμῶν
  choice: avec vous tous
  rationale: Cette formulation française naturelle conserve la valeur inclusive de πάντων et le sens de μετά suivi du génitif.
- source_word: Ἀμήν
  choice: Amen
  rationale: La translittération liturgique consacrée en français convient à cette affirmation finale.
theological_decisions:
- issue: Traduction de Χριστός dans le groupe Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  alternative: Jésus le Messie
  rationale: En français moderne, « Jésus-Christ » est immédiatement reconnu et fonctionne naturellement dans cette bénédiction. La note préserve toutefois le sens titulaire de Χριστός sans imposer que le terme soit seulement un nom propre.
- issue: Force de la bénédiction nominale grecque
  choice: Que ... soit avec vous tous
  alternative: La grâce ... avec vous tous
  rationale: Le grec ne comporte pas de verbe exprimé. La tournure française avec « Que ... soit » rend naturellement la valeur de souhait ou de bénédiction sans la transformer en affirmation descriptive.
translation_notes:
  register: Français international moderne, simple et digne. La tournure de bénédiction reste naturelle à l’oral comme à l’écrit; « vous tous » maintient explicitement l’inclusion de l’ensemble des destinataires.
