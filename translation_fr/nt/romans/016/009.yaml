  text: ἀσπάσασθε Οὐρβανὸν τὸν συνεργὸν ἡμῶν ἐν Χριστῷ καὶ Στάχυν τὸν ἀγαπητόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: fr
  text: Saluez Urbain, notre collaborateur dans le Messie[a], ainsi que Stachys, mon bien-aimé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le Christ ».'
    reason: Variante de traduction de Χριστῷ, selon qu’on souligne davantage sa valeur de titre (« Messie ») ou son emploi traditionnel quasi nominal (« Christ »).
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: L’impératif pluriel « Saluez » rend directement et naturellement la formule employée dans cette liste de salutations.
- source_word: Οὐρβανὸν
  choice: Urbain
  rationale: « Urbain » est la forme française traditionnelle du nom latin Urbanus représenté par le grec Οὐρβανός.
- source_word: συνεργὸν ἡμῶν
  choice: notre collaborateur
  rationale: Cette expression rend l’idée d’une personne qui œuvre avec Paul et ses compagnons, dans un français actuel et digne.
- source_word: ἐν Χριστῷ
  choice: dans le Messie
  rationale: La formule exprime la sphère ou l’union dans laquelle s’inscrit cette collaboration. « Messie » préserve ici la valeur titulaire de Χριστός, tandis que « dans » rend naturellement ἐν.
- source_word: Στάχυν
  choice: Stachys
  rationale: Translittération française usuelle de ce nom propre grec.
- source_word: ἀγαπητόν μου
  choice: mon bien-aimé
  rationale: Cette formulation conserve la chaleur personnelle de ἀγαπητός ainsi que son lien lexical avec le vocabulaire de l’amour, sans paraphrase explicative.
theological_decisions:
- issue: Rendu de Χριστῷ dans ἐν Χριστῷ
  choice: dans le Messie
  alternative: dans le Christ
  rationale: Dans cette formule, Χριστός demeure intelligible comme titre. « Le Messie » en fait ressortir le sens, tandis que la variante en note conserve le rendu ecclésial traditionnel sans trancher excessivement entre valeur titulaire et emploi quasi nominal.
translation_notes:
  register: Français international moderne, sobre et digne. « Saluez » convient à l’adresse plurielle; « ainsi que » fluidifie la coordination. Les noms propres suivent les formes françaises établies ou leur translittération usuelle.
