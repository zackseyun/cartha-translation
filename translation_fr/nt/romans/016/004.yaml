source:
  edition: SBLGNT
  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: fr
  text: 'eux qui ont risqué leur vie pour la mienne[a]. Je ne suis pas le seul à leur être reconnaissant : toutes les Églises d’origine non juive[b] le sont aussi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ont exposé leur propre cou ». Le grec emploie « cou » au singulier dans une expression évoquant l’exposition à un danger mortel.'
    reason: Préserver l’image concrète et la particularité grammaticale de l’expression grecque, sans ajouter au libellé littéral un élément absent du texte.
  - marker: b
    text: 'Ou : « toutes les Églises des nations ».'
    reason: Signaler l’équivalent plus littéral de ἐθνῶν sans effacer son sens contextuel de personnes non juives.
lexical_decisions:
- source_word: οἵτινες
  choice: eux qui
  rationale: Introduit une proposition relative descriptive renvoyant à Prisca et Aquilas; « eux qui » marque naturellement la reprise dans ce fragment de phrase.
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: pour sauver la mienne
  rationale: ψυχή désigne ici la vie de Paul; avec le verbe « risquer », cette formulation exprime clairement que leur exposition au danger visait sa survie.
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: ont risqué leur propre vie
  rationale: L’expression concrète, littéralement liée au fait de placer son cou sous un danger mortel, signifie qu’ils se sont exposés à la mort. L’équivalent idiomatique français évite une image opaque.
- source_word: οἷς ... εὐχαριστῶ
  choice: leur être reconnaissant
  rationale: Le datif désigne les personnes envers lesquelles Paul éprouve de la reconnaissance; cette tournure est naturelle en français contemporain.
- source_word: οὐκ ἐγὼ μόνος ... ἀλλὰ καὶ
  choice: Je ne suis pas le seul ... aussi
  rationale: Préserve le contraste emphatique entre Paul et l’ensemble des Églises concernées.
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: toutes les Églises
  rationale: Rend directement le pluriel défini et la portée universelle de πᾶσαι.
- source_word: τῶν ἐθνῶν
  choice: des non-Juifs
  rationale: Dans ce contexte paulinien, ἔθνη désigne les peuples autres que le peuple juif. « non-Juifs » est actuel, clair et moins marqué historiquement que « païens ».
theological_decisions:
- issue: Sens de ψυχή
  choice: vie
  alternative: âme
  rationale: Le contexte porte sur une exposition concrète au danger de mort pour Paul, non sur son âme envisagée comme composante immatérielle.
- issue: Image du cou exposé
  choice: risquer leur propre vie
  alternative: exposer leur propre cou
  rationale: Le grec emploie une image idiomatique de danger mortel. La traduction principale en donne le sens naturel, tandis que la note conserve l’image et le singulier grammatical du texte source.
- issue: Sens de ἐθνῶν
  choice: non-Juifs
  alternative: nations
  rationale: Dans l’usage paulinien et dans ce contexte, le terme désigne les communautés issues des peuples non juifs; la note signale la traduction plus formelle.
translation_notes:
  register: Français international moderne, digne et accessible. La traduction privilégie un idiome français clair pour l’expression grecque du cou exposé, tout en en conservant l’image dans une note. « Églises » désigne ici les assemblées locales; la majuscule suit un usage éditorial courant pour les communautés chrétiennes.
