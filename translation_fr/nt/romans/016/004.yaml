  naturalness: Le français est fluide et accessible. « Églises des non-Juifs » demeure compréhensible, mais « Églises d’origine non juive » est plus naturel et évite l’impression que les Églises appartiendraient à des personnes non juives.
  terminology: '« Vie » rend correctement ψυχή dans ce contexte. « Non juif » restitue convenablement le sens paulinien contextuel de ἐθνῶν. La note a doit toutefois éviter de présenter comme littéral l’ajout interprétatif « [le danger] » : le grec parle du « cou », dans une expression d’exposition au péril, sans nommer le danger.'
