source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: fr
  text: Car votre obéissance est parvenue à la connaissance de tous[a]. Je me réjouis donc à votre sujet[b]. Mais je veux que vous soyez sages dans ce qui est bien et innocents à l’égard de ce qui est mal[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « votre obéissance est parvenue jusqu’à tous ».'
    reason: La note conserve l’image exacte du grec derrière la formulation française idiomatique.
  - marker: b
    text: 'Ou : « à cause de vous » ; « grâce à vous ».'
    reason: La préposition peut indiquer aussi bien l’objet que le motif de la joie.
  - marker: c
    text: 'Ou : « purs » ou « sans mélange » à l’égard de ce qui est mal.'
    reason: Le terme grec ἀκεραίους peut désigner ce qui est innocent, pur ou sans mélange.
lexical_decisions:
- source_word: ὑπακοή
  choice: obéissance
  rationale: Dans l’usage paulinien, le nom désigne une réponse obéissante plutôt qu’une simple écoute.
- source_word: εἰς πάντας ἀφίκετο
  choice: est parvenue à la connaissance de tous
  rationale: Le grec dit littéralement que leur obéissance « est parvenue jusqu’à tous »; en français, cette formulation explicite naturellement qu’elle est devenue largement connue sans transformer la portée rhétorique en universalité absolue.
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: je me réjouis à votre sujet
  rationale: Avec χαίρω, ἐπί suivi du datif indique ici l’objet ou le motif de la joie; « à votre sujet » conserve cette légère ambiguïté.
- source_word: σοφοὺς εἶναι εἰς τὸ ἀγαθόν
  choice: être sages pour ce qui est bien
  rationale: La tournure exprime une sagesse pratique orientée vers le bien; « pour ce qui est bien » reste proche du grec tout en étant naturel.
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: sans compromission avec ce qui est mal
  rationale: ἀκέραιος évoque ce qui est sans mélange, intact ou innocent. Dans ce contraste moral, cette formulation exprime l’absence de participation au mal sans suggérer la naïveté.
theological_decisions:
- issue: Portée de πάντας
  choice: « tous » est conservé dans une affirmation rhétorique de vaste renommée.
  alternative: « partout » ou « dans toutes les Églises »
  rationale: Le texte ne précise pas un groupe restreint et n’exige pas non plus une universalité mathématique.
- issue: Contraste entre σοφούς et ἀκεραίους
  choice: Sagesse orientée vers le bien et absence de compromission avec le mal.
  alternative: « avisés quant au bien et innocents quant au mal »
  rationale: Cette traduction préserve le contraste entre discernement actif et intégrité morale sans faire de l’ignorance du mal une vertu en soi.
translation_notes:
  register: Français international moderne, digne et accessible. Le balancement entre le bien et le mal est maintenu, avec une légère explicitation idiomatique dans la première proposition.
