  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: fr
  text: Saluez Rufus[a], l’élu dans le Seigneur, ainsi que sa mère, et la mienne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Rufus, cet homme remarquable dans le Seigneur ». Le mot grec peut désigner quelqu’un qui est choisi ou élu, mais aussi quelqu’un de choix, d’éminent.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Saluez
  rationale: L’impératif pluriel demande de transmettre une salutation. « Saluez » est la formulation française naturelle et concise dans cette série de salutations finales.
- source_word: Ῥοῦφον
  choice: Rufus
  rationale: Le nom propre est translittéré selon sa forme française traditionnelle.
- source_word: ἐκλεκτὸν
  choice: l’élu
  rationale: L’adjectif substantivé avec article signifie ici « celui qui est choisi » ou « l’élu ». Cette formulation concise conserve la possibilité d’une élection divine sans exclure entièrement la nuance de personne remarquable, signalée en note.
- source_word: ἐν κυρίῳ
  choice: dans le Seigneur
  rationale: La traduction formelle de la préposition préserve l’idée de sphère ou de relation au Seigneur sans préciser indûment si Rufus est choisi par le Seigneur ou distingué parmi ceux qui lui appartiennent.
- source_word: μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: sa mère, qui est aussi la mienne
  rationale: Le grec dit littéralement « sa mère et la mienne ». La formulation française explicite que Paul parle de la même femme tout en conservant l’expression affectueuse selon laquelle elle a été pour lui comme une mère.
theological_decisions:
- issue: Sens de ἐκλεκτὸν ἐν κυρίῳ
  choice: « l’élu dans le Seigneur »
  alternative: « un homme remarquable dans le Seigneur » ou « choisi par le Seigneur »
  rationale: Le grec peut évoquer l’élection divine ou qualifier Rufus de personne choisie, éminente ou remarquable dans la communauté du Seigneur. Le texte principal garde la formulation ouverte et la note indique l’autre nuance, sans imposer un système doctrinal précis.
- issue: Sens de « sa mère, qui est aussi la mienne »
  choice: Une maternité affective et relationnelle envers Paul
  alternative: Une maternité biologique commune à Rufus et Paul
  rationale: Le contexte épistolaire favorise fortement une expression d’affection et de reconnaissance pour les soins maternels reçus par Paul. La traduction maintient néanmoins l’image familiale employée par l’apôtre.
translation_notes:
  register: Français international moderne, sobre et digne. « L’élu » reflète l’adjectif grec substantivé, tandis que « ainsi que » et la proposition « qui est aussi la mienne » rendent la phrase naturelle et lèvent une ambiguïté syntaxique non voulue en français.
