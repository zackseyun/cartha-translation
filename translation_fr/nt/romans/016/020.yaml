id: ROM.16.20
reference: Romans 16:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: fr
  text: Le Dieu de paix écrasera bientôt Satan sous vos pieds. Que la grâce de notre Seigneur Jésus le Messie[a] soit avec vous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « Jésus-Christ ».'
    reason: Signale le rendu traditionnel de Χριστοῦ à côté de sa traduction explicite comme titre.
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: Le Dieu de paix
  rationale: Cette formulation conserve le titre paulinien et rend naturellement le génitif grec, sans le développer en « le Dieu qui donne la paix ».
- source_word: συντρίψει
  choice: écrasera
  rationale: Le futur annonce une action certaine. « Écrasera » convient à l’image de la victoire sous les pieds et garde sa force concrète.
- source_word: τὸν Σατανᾶν
  choice: Satan
  rationale: Le grec emploie ici le nom propre usuel ; la translittération française évite d’ajouter dans le texte la glose interprétative « l’Adversaire ».
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: sous vos pieds
  rationale: L’expression française restitue directement l’image de soumission et garde l’adresse collective marquée par le pluriel grec.
- source_word: ἐν τάχει
  choice: bientôt
  rationale: Dans ce contexte, « bientôt » exprime naturellement la proximité temporelle ; « rapidement » pourrait plutôt décrire la vitesse de l’action.
- source_word: ἡ χάρις
  choice: la grâce
  rationale: Le terme théologique paulinien est conservé dans la formule de bénédiction.
- source_word: τοῦ κυρίου ἡμῶν
  choice: de notre Seigneur
  rationale: Le génitif est rendu simplement dans la formule consacrée « la grâce de notre Seigneur ».
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: « Le Messie » traduit le sens titulaire de Χριστός en français moderne, tout en évitant la tournure peu naturelle « Jésus Messie ».
- source_word: μεθ’ ὑμῶν
  choice: soit avec vous
  rationale: Le verbe, sous-entendu en grec, est nécessaire en français pour former une bénédiction naturelle.
theological_decisions:
- issue: Traduction de Χριστοῦ dans la bénédiction finale
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le rendu principal laisse entendre le sens du titre grec, tandis que la forme française traditionnelle, plus proche d’un nom composé, est signalée en note sans imposer une interprétation confessionnelle.
translation_notes:
  register: Français international actuel, digne et direct. La syntaxe conserve la brièveté et la force de la promesse grecque. « Que… soit » rend naturellement la bénédiction finale. Le connecteur δέ n’est pas traduit mécaniquement, car l’ouverture par « Mais » serait lourde hors du contexte immédiat et n’ajouterait ici aucune opposition nette.
