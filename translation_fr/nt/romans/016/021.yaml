  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: fr
  text: Timothée, mon collaborateur, vous salue. Lucius, Jason et Sosipater, mes proches, vous saluent aussi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: vous salue
  rationale: Dans un contexte épistolaire, ἀσπάζομαι exprime le fait de saluer ou d’adresser ses salutations. « Vous salue » est naturel et conserve la construction personnelle du grec.
- source_word: συνεργός
  choice: collaborateur
  rationale: συνεργός désigne quelqu’un qui travaille aux côtés d’un autre dans une œuvre commune. « Collaborateur » rend clairement cette association sans introduire de titre ecclésiastique.
- source_word: Λούκιος, Ἰάσων, Σωσίπατρος
  choice: Lucius, Jason et Sosipater
  rationale: Ces formes suivent les conventions françaises usuelles de transcription des noms grecs et distinguent Σωσίπατρος de la forme abrégée Sopater attestée ailleurs.
- source_word: συγγενεῖς μου
  choice: ceux de ma parenté
  rationale: Le grec peut désigner des parents au sens familial ou, plus largement, des personnes liées par une même origine, probablement ici des compatriotes juifs. « Ceux de ma parenté » maintient l’idée de lien sans préciser indûment sa portée; une note expose les principales possibilités.
theological_decisions:
- issue: Portée de συγγενεῖς μου chez Paul
  choice: ceux de ma parenté
  alternative: mes parents; mes compatriotes; mes compatriotes juifs
  rationale: Le verset ne permet pas de décider avec certitude s’il s’agit de membres de la famille de Paul ou de personnes unies à lui par une parenté ethnique. Le texte principal garde cette indétermination et la note présente les lectures possibles.
translation_notes:
  register: Français international actuel, simple et digne. Deux phrases sont employées pour éviter une coordination lourde et pour rendre naturellement le singulier du premier verbe grec, suivi des trois autres personnes regroupées sous οἱ συγγενεῖς μου.
