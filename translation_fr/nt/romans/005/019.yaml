  source_fidelity: Le texte rend fidèlement la structure comparative de ὥσπερ… οὕτως καί, les deux passifs de καθίστημι, et le contraste παρακοή / ὑπακοή. « La multitude » conserve le caractère articulé et collectif de οἱ πολλοί sans en fixer la portée à « tous ». Le singulier grammatical de « pécheresse / juste » est normalement commandé par le collectif français et ne modifie pas le sens pluriel grec. L’ellipse de « homme » dans « d’un seul » correspond à l’ellipse de ἀνθρώπου dans la seconde proposition grecque.
  naturalness: La formulation est naturelle en français international actuel, avec un registre biblique accessible. Le balancement « de même que… de même aussi » est clair et bien rythmé. « La multitude » est plus idiomatique que le calque « les nombreux » tout en gardant une note explicative appropriée.
  terminology: « Désobéissance », « obéissance », « pécheresse » et « juste » maintiennent les correspondances lexicales nécessaires. « Rendue juste » traduit καθίστημι sans substituer le langage plus interprétatif de la déclaration de justice (δικαιόω). Les notes présentent « constituée » comme alternative sans imposer d’interprétation confessionnelle.
