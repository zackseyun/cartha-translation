id: ROM.5.19
reference: Romans 5:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: fr
  text: En effet, de même que, par la désobéissance d’un seul homme, la multitude[a] a été rendue pécheresse[b], de même aussi, par l’obéissance d’un seul, la multitude sera rendue juste[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « les nombreux » ; de même dans la suite du verset.
    reason: lexical_alternative
  - marker: b
    text: Ou « a été constituée pécheresse », c’est-à-dire établie dans la condition de pécheurs.
    reason: lexical_alternative
  - marker: c
    text: Ou « sera constituée juste », c’est-à-dire établie dans la condition de justes.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: désobéissance
  rationale: Ce terme exprime le refus ou le défaut d’obéir et maintient l’opposition directe avec ὑπακοή.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: d’un seul homme
  rationale: Cette formulation française naturelle conserve l’accent mis sur l’unique homme, Adam, dans le parallèle représentatif du passage.
- source_word: ἁμαρτωλοὶ
  choice: pécheresse
  rationale: L’adjectif grec est employé comme prédicat. Avec le collectif « la multitude », le féminin singulier donne en français une formulation naturelle sans atténuer l’idée de pécheurs.
- source_word: κατεστάθησαν
  choice: a été rendue
  rationale: Dans ce contexte, καθίστημι indique l’établissement dans une condition ou un statut. « A été rendue » est idiomatique, tandis qu’une note conserve l’alternative plus formelle « constituée ».
- source_word: οἱ πολλοί
  choice: la multitude
  rationale: « La multitude » rend naturellement en français l’expression grecque articulée « les nombreux », sans l’élargir interprétativement à « tous » ni la réduire à l’indéfini « beaucoup ».
- source_word: ὑπακοῆς
  choice: obéissance
  rationale: Équivalent français direct qui préserve le contraste lexical avec « désobéissance ».
- source_word: τοῦ ἑνὸς
  choice: d’un seul
  rationale: Le grec omet ἀνθρώπου dans la seconde proposition. Le français permet de conserver cette ellipse tout en renvoyant clairement à « un seul homme » dans la première.
- source_word: δίκαιοι
  choice: juste
  rationale: Avec le sujet collectif « la multitude », le singulier « juste » rend le prédicat δίκαιοι et conserve le vocabulaire de la justice sans introduire l’idée plus précise de déclaration.
- source_word: κατασταθήσονται
  choice: sera rendue
  rationale: Le futur passif répond exactement à l’aoriste passif de la première proposition. Cette traduction maintient le parallélisme et n’importe pas le verbe théologiquement plus précis « déclarer juste ».
theological_decisions:
- issue: Portée de οἱ πολλοί
  choice: la multitude
  alternative: tous ; beaucoup de personnes
  rationale: Le grec dit οἱ πολλοί. La traduction conserve cette désignation collective et laisse ouverte la question de sa portée au lieu de l’identifier silencieusement à « tous ».
- issue: Nature de l’action exprimée par κατασταθήσονται δίκαιοι
  choice: sera rendue juste
  alternative: sera déclarée juste ; sera constituée juste
  rationale: Paul emploie καθίστημι, non δικαιόω. « Sera rendue juste » suit la formulation du texte sans trancher entre diverses lectures doctrinales de la justice ou de la justification.
translation_notes:
  register: Français international actuel, digne et accessible. Le balancement « de même que… de même aussi » reproduit la construction grecque. « La multitude » évite l’expression peu naturelle « les nombreux », expliquée en note, et permet de préserver l’article ainsi que la tension sur la portée du groupe.
