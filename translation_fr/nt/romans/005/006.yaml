id: ROM.5.6
reference: Romans 5:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: fr
  text: En effet, alors que nous étions encore faibles, le Messie est mort, au moment voulu, pour les impies[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en faveur des impies ».
    reason: La préposition ὑπέρ peut souligner que la mort du Messie a eu lieu au bénéfice des impies; la traduction principale « pour » préserve une gamme de sens plus large.
lexical_decisions:
- source_word: Χριστὸς
  choice: le Messie
  rationale: Le titre grec Χριστός est traduit par « le Messie », formulation claire en français moderne qui conserve sa fonction de titre.
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: alors que nous étions encore faibles
  rationale: Le génitif absolu est rendu par une proposition temporelle naturelle. « Faibles » conserve le sens large d’incapacité sans le réduire à une faiblesse physique ni lui imposer une formulation doctrinale plus précise.
- source_word: ἔτι
  choice: encore
  rationale: L’adverbe exprime la persistance de la condition. Une seule occurrence explicite en français transmet naturellement cette valeur malgré la répétition présente dans la forme grecque fournie.
- source_word: κατὰ καιρὸν
  choice: au moment voulu
  rationale: L’expression désigne un moment approprié ou déterminé. « Au moment voulu » est idiomatique et laisse ouverte la nuance entre moment opportun et moment fixé.
- source_word: ὑπὲρ
  choice: pour
  rationale: « Pour » exprime naturellement que la mort du Messie bénéficie aux impies tout en préservant l’ouverture sémantique de la préposition quant à la représentation ou à la substitution.
- source_word: ἀσεβῶν
  choice: les impies
  rationale: « Les impies » rend la dimension morale et religieuse du terme, qui désigne ceux qui vivent sans révérence envers Dieu.
- source_word: ἀπέθανεν
  choice: est mort
  rationale: Le verbe aoriste énonce simplement l’événement passé; le passé composé convient au français moderne.
theological_decisions:
- issue: Portée de la mort du Messie exprimée par ὑπὲρ ἀσεβῶν
  choice: pour les impies
  alternative: en faveur des impies
  rationale: « Pour » conserve la force théologique de l’énoncé sans réduire la préposition grecque à une théorie particulière de la représentation ou de la substitution.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le lien explicatif introduit par γάρ avec « En effet » et évite une répétition maladroite de « encore ».
