reference: Romans 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: fr
  text: 'Et ce n’est pas tout : nous nous glorifions aussi en Dieu[a] par notre Seigneur Jésus le Messie[b], par qui nous avons maintenant reçu la réconciliation.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous nous vantons en Dieu » ou « nous trouvons notre joie en Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: Grec Christos, traditionnellement rendu par « Christ ».
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: Et ce n’est pas tout… aussi
  rationale: Cette tournure française naturelle restitue la progression emphatique « non seulement… mais aussi » alors que le premier élément renvoie elliptiquement à ce qui précède.
- source_word: καυχώμενοι
  choice: nous plaçons aussi notre fierté
  rationale: Le verbe exprime ici une confiance fière et joyeuse dont Dieu est l’objet, sans suggérer la vantardise égocentrique que pourrait évoquer « nous nous vantons » en français courant.
- source_word: ἐν τῷ θεῷ
  choice: en Dieu
  rationale: La préposition ἐν présente Dieu comme l’objet ou le fondement de cette fierté; « en Dieu » conserve cette nuance et l’expression paulinienne.
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: par notre Seigneur
  rationale: Avec le génitif, διά désigne ici la médiation. « Seigneur » est le rendu français normal de κύριος dans cet emploi christologique.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός conserve ici sa valeur de titre; « le Messie » en rend le sens de manière transparente et idiomatique en français.
- source_word: καταλλαγὴν
  choice: la réconciliation
  rationale: Le mot désigne le rétablissement de la relation avec Dieu. L’article défini renvoie à la réconciliation précise décrite dans le contexte précédent.
- source_word: νῦν … ἐλάβομεν
  choice: nous avons maintenant reçu
  rationale: Le passé composé exprime naturellement en français l’acte accompli dont le résultat est présent, tandis que « maintenant » traduit explicitement νῦν.
theological_decisions:
- issue: Valeur christologique de Χριστοῦ
  choice: le Messie
  alternative: le Christ
  rationale: Le rendu retenu explicite le titre royal et messianique au lieu de le traiter comme un simple élément de nom; la forme traditionnelle demeure signalée en note.
- issue: Nature de la καταλλαγή
  choice: la réconciliation
  alternative: le rétablissement de la relation
  rationale: « Réconciliation » préserve le terme relationnel de Paul sans préciser au-delà du texte le mécanisme théologique de cette réconciliation.
translation_notes:
  register: Français international moderne, digne et accessible. « Nous plaçons notre fierté en Dieu » évite la connotation négative de « se vanter » tout en gardant l’idée de καυχάομαι; la note conserve les principaux rendus possibles. La répétition de « par » reflète les deux propositions grecques successives et reste claire en français.
