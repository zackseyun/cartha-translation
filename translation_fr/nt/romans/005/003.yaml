  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: fr
  text: 'Et ce n’est pas tout : nous nous réjouissons même dans les détresses[a], sachant que la détresse produit la persévérance[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous nous glorifions dans les détresses » ou « nous tirons fierté des détresses ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’endurance » ou « la constance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: Bien plus… aussi
  rationale: Cette tournure française naturelle exprime que Paul ajoute un motif inattendu à ce qui précède, sans alourdir la phrase par un calque.
- source_word: καυχώμεθα
  choice: nous mettons notre fierté
  rationale: Le verbe désigne le fait de se glorifier ou de tirer fierté de quelque chose. Cette formulation conserve mieux que « nous nous réjouissons » le lien lexical et la tension du grec, tout en évitant l'idée nécessaire d'une vantardise arrogante.
- source_word: θλίψεσιν / θλῖψις
  choice: détresses / détresse
  rationale: « Détresse » rend la pression et l'épreuve impliquées par θλῖψις dans un français actuel. Le passage du pluriel au singulier est conservé.
- source_word: εἰδότες
  choice: sachant
  rationale: Le participe français garde le lien syntaxique du grec sans préciser davantage si la connaissance exprime ici la cause ou les circonstances.
- source_word: ὑπομονήν
  choice: persévérance
  rationale: « Persévérance » exprime la constance patiente sous l'épreuve et convient au registre courant et digne du passage.
- source_word: κατεργάζεται
  choice: produit
  rationale: « Produit » rend clairement le résultat auquel la détresse conduit, sans ajouter de mécanisme absent du texte.
theological_decisions:
- issue: Portée de καυχώμεθα au sujet des détresses
  choice: Conserver l'idée de mettre sa fierté dans les détresses
  alternative: « nous nous réjouissons dans les détresses » ou « nous nous glorifions des détresses »
  rationale: Le grec peut évoquer la fierté, l'exultation ou la glorification. La traduction retenue préserve l'affirmation paradoxale de Paul sans en faire une joie spontanée causée par la souffrance ni une vantardise centrée sur soi.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le paradoxe du texte et la variation grecque entre le pluriel « détresses » et le singulier générique « détresse ».
