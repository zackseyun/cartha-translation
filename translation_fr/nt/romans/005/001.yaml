source:
  edition: SBLGNT
  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: fr
  text: Ainsi donc, puisque nous avons été justifiés par la foi[b], nous sommes en paix avec Dieu[a] par notre Seigneur Jésus le Messie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Quelques manuscrits ont : « soyons en paix avec Dieu ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « sur la base de la foi ».'
    reason: lexical_alternative
  - marker: c
    text: 'Grec Christos, « Messie » ; traditionnellement : « Christ ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: puisque nous avons été justifiés
  rationale: Le participe aoriste passif exprime ici une action accomplie qui fonde la proposition principale. « Justifiés » conserve le vocabulaire paulinien et son amplitude théologique sans préciser davantage si l’accent porte sur une déclaration ou sur une transformation.
- source_word: οὖν
  choice: Ainsi donc
  rationale: Cette expression marque clairement la conclusion tirée du raisonnement précédent, dans un français naturel et soutenu.
- source_word: ἐκ πίστεως
  choice: par la foi
  rationale: « Par la foi » est l’équivalent français idiomatique de cette construction et évite le calque peu naturel « à partir de la foi ». Une autre nuance possible est signalée en note.
- source_word: εἰρήνην ἔχομεν πρὸς τὸν θεὸν
  choice: nous sommes en paix avec Dieu
  rationale: Le français dit naturellement « être en paix avec ». Cette formulation garde la portée relationnelle de εἰρήνη sans la réduire soit à un sentiment intérieur, soit au terme plus interprétatif « réconciliation ».
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: par notre Seigneur
  rationale: « Par » rend ici le moyen ou la médiation exprimée par διά avec le génitif, et « Seigneur » est l’équivalent révérenciel courant de κύριος.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός est rendu selon son sens de titre, « Messie ». L’article ajouté en français produit la formulation idiomatique « Jésus le Messie » sans transformer le titre en simple nom propre.
theological_decisions:
- issue: Portée de la justification
  choice: Employer « justifiés » sans développer le terme
  alternative: « déclarés justes » ou « rendus justes »
  rationale: Le verset affirme l’action justificatrice accomplie, mais ne tranche pas à lui seul toutes les questions relatives à sa nature. Le terme traditionnel et transparent « justifiés » préserve cette tension.
- issue: Nature de la paix avec Dieu
  choice: « en paix avec Dieu »
  alternative: « réconciliés avec Dieu » ou « éprouvant la paix de Dieu »
  rationale: Le grec désigne la paix dans la relation avec Dieu. La traduction n’en fait ni exclusivement un statut objectif ni exclusivement une expérience intérieure, et n’introduit pas un autre terme théologique.
- issue: Variante textuelle de ἔχομεν / ἔχωμεν
  choice: 'Suivre l’indicatif du texte SBLGNT : « nous sommes en paix »'
  alternative: 'Suivre le subjonctif exhortatif : « soyons en paix »'
  rationale: Le texte source fourni porte l’indicatif ἔχομεν. La variante ancienne, qui transforme l’affirmation en exhortation, est assez importante pour être conservée en note.
translation_notes:
  register: Français international actuel, digne et accessible. La phrase conserve la progression logique du grec tout en remplaçant la tournure participiale par une subordonnée causale naturelle. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
