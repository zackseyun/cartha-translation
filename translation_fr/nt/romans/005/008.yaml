id: ROM.5.8
reference: Romans 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: fr
  text: 'Mais Dieu montre son propre amour envers nous[a] en ceci : alors que nous étions encore pécheurs, le Messie[b] est mort pour nous[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour nous ».
    reason: lexical_alternative
  - marker: b
    text: Grec Christos, traditionnellement rendu par « Christ » ; il s’agit ici du titre « Messie ».
    reason: lexical_alternative
  - marker: c
    text: Ou « en notre faveur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: montre
  rationale: Le présent exprime la mise en évidence active de l’amour de Dieu. « Montre » est naturel en français moderne et conserve la force démonstrative du verbe.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un contraste avec le raisonnement précédent.
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: son propre amour
  rationale: « Son propre » restitue l’insistance du pronom réfléchi ἑαυτοῦ, tandis qu’« amour » traduit directement ἀγάπη.
- source_word: εἰς ἡμᾶς
  choice: envers nous
  rationale: La préposition exprime l’orientation de l’amour divin vers nous. « Envers nous » est précis et idiomatique.
- source_word: ὅτι
  choice: 'en ceci :'
  rationale: La conjonction introduit le fait qui manifeste l’amour de Dieu. La tournure avec deux-points rend clairement cette fonction explicative.
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: alors que nous étions encore pécheurs
  rationale: Cette proposition temporelle et concessive restitue naturellement le génitif absolu et préserve la valeur de ἔτι, « encore ».
- source_word: Χριστὸς
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre christologique. « Le Messie » en transmet le sens plutôt que de le traiter uniquement comme un nom propre traditionnel.
- source_word: ὑπὲρ ἡμῶν
  choice: pour nous
  rationale: Cette formulation conserve le sens de bénéfice ou de représentation sans imposer une théorie particulière de l’expiation.
- source_word: ἀπέθανεν
  choice: est mort
  rationale: Traduction directe et naturelle de l’aoriste ἀπέθανεν.
theological_decisions:
- issue: Valeur de Χριστός dans le discours paulinien
  choice: le Messie
  alternative: le Christ
  rationale: Le terme garde ici sa valeur de titre messianique. La traduction explicite ce titre sans modifier l’affirmation christologique du verset.
- issue: Portée de ὑπὲρ ἡμῶν
  choice: pour nous
  alternative: en notre faveur / à notre place
  rationale: Le grec affirme que la mort du Messie a eu lieu pour nous, mais ce seul syntagme ne tranche pas toutes les nuances débattues concernant la représentation ou la substitution. La formulation retenue préserve cette latitude.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le contraste initial, l’insistance de « son propre amour » et la relation explicative entre la manifestation de cet amour et la mort du Messie.
