  verdict: revise
  source_fidelity: 'Le texte principal rend fidèlement la structure et les relations du grec : le péché entre dans le monde par un seul homme, la mort par le péché, puis la mort atteint tous les humains. « Parce que tous ont péché » est une lecture causale solide de ἐφ’ ᾧ, sans éliminer l’ambiguïté historique par la note. Le tiret final reproduit à juste titre l’élan syntaxique inachevé de la comparaison.'
  naturalness: Le français est naturel, moderne et d’un registre biblique accessible. La répétition de « est entrée », absente mais sous-entendue dans le grec, est une explicitation syntaxique sobre et idiomatique. « Tous les êtres humains » est inclusif et précis, quoique légèrement plus lourd que « tous les humains » ; il reste pleinement acceptable.
  terminology: '« Péché », « mort », « monde » et « un seul homme » sont exacts et cohérents avec la terminologie paulinienne. La note doit toutefois éviter de présenter « en qui » comme renvoyant explicitement à Adam : ce référent interprétatif n’est pas exprimé dans la formulation grecque elle-même et dépasse la réserve de la note anglaise.'
