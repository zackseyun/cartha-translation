  variant: modern international French
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: fr
  text: C’est pourquoi, de même que, par un seul homme, le péché est entré dans le monde et que, par le péché, la mort est entrée, de même aussi la mort s’est étendue à tous les êtres humains, parce que tous ont péché[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon une interprétation plus traditionnelle : « en qui tous ont péché ».'
    reason: Préserve la lecture traditionnelle alternative de ἐφ’ ᾧ sans imposer un référent ou une explication doctrinale qui ne soit pas explicitement formulée dans le grec.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Marque naturellement en français la transition logique avec l’argument qui précède.
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: par un seul homme
  rationale: διά avec le génitif exprime ici l’intermédiaire ou le moyen. « Homme » conserve la référence précise à Adam et la portée typologique du passage.
- source_word: ἡ ἁμαρτία
  choice: le péché
  rationale: Rend directement le nom grec articulé sans explicitation doctrinale supplémentaire.
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: est entré dans le monde
  rationale: Conserve le mouvement exprimé par εἰς dans une formulation française naturelle.
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: par le péché, la mort est entrée
  rationale: 'L’ajout en français du verbe sous-entendu dans le parallélisme grec clarifie la phrase tout en conservant la relation : le péché entre par un homme, et la mort par le péché.'
- source_word: οὕτως
  choice: de même aussi
  rationale: Maintient la correspondance introduite par la comparaison de Paul, dont la suite demeure syntaxiquement ouverte.
- source_word: εἰς πάντας ἀνθρώπους
  choice: à tous les êtres humains
  rationale: La formule vise ici l’ensemble de l’humanité, et non les seuls individus de sexe masculin.
- source_word: ὁ θάνατος διῆλθεν
  choice: la mort s’est étendue
  rationale: Exprime le mouvement de la mort jusqu’à l’ensemble des humains sans rendre le grec par un calque peu naturel.
- source_word: ἐφ’ ᾧ
  choice: parce que
  rationale: La valeur causale est la lecture contextuelle et grammaticale la plus naturelle, tout en laissant l’interprétation traditionnelle dans une note.
- source_word: πάντες ἥμαρτον
  choice: tous ont péché
  rationale: Le passé composé rend naturellement en français l’aoriste dans ce récit argumentatif, sans transformer l’énoncé en vérité générale intemporelle.
theological_decisions:
- issue: Sens de ἐφ’ ᾧ πάντες ἥμαρτον
  choice: 'Lecture causale : « parce que tous ont péché »'
  alternative: 'Lecture représentative ou incorporative traditionnelle : « en qui tous ont péché »'
  rationale: La lecture causale convient le mieux à l’usage grec et au contexte immédiat. Comme l’autre compréhension a une importance historique et théologique majeure dans l’interprétation du rapport entre Adam et l’humanité, elle est signalée sans être introduite dans le corps du texte.
- issue: Comparaison laissée en suspens
  choice: Conserver le tiret final
  alternative: Achever ou reformuler la comparaison dans ce verset
  rationale: Le grec se termine sur une proposition dont la construction comparative se prolonge dans l’argument suivant. Le tiret préserve cet effet rhétorique sans ajouter au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « est entrée » explicite le parallélisme elliptique du grec afin d’éviter une phrase artificielle. « Tous les êtres humains » exprime clairement la portée inclusive de πάντας ἀνθρώπους. Le tiret final conserve l’inachèvement syntaxique et rhétorique du verset.
