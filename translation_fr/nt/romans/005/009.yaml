reference: Romans 5:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: fr
  text: À bien plus forte raison, donc, maintenant que nous avons été justifiés[a] par son sang[b], nous serons sauvés par lui de la colère[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « déclarés justes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dans son sang »; le grec peut ici exprimer le moyen ou le fondement.'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire la colère divine indiquée par le contexte.
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: À bien plus forte raison donc
  rationale: Cette tournure française naturelle conserve à la fois le lien logique exprimé par οὖν et la progression renforcée de πολλῷ… μᾶλλον.
- source_word: δικαιωθέντες
  choice: maintenant que nous avons été justifiés
  rationale: Le passé composé passif présente la justification comme antérieure au salut futur, tandis que « maintenant que » rend naturellement en français le rapport entre le participe et le verbe principal.
- source_word: νῦν
  choice: maintenant
  rationale: L’adverbe garde sa valeur temporelle et souligne la situation présente issue de la justification.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: par son sang
  rationale: Dans ce contexte, ἐν peut exprimer le moyen ou le fondement. « Par son sang » est idiomatique en français et conserve l’image sacrificielle sans l’expliciter davantage.
- source_word: σωθησόμεθα
  choice: nous serons sauvés
  rationale: Le futur passif est conservé et présente ici un salut encore futur.
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: διά avec le génitif exprime ici la médiation ou l’action personnelle du Christ. « Par lui » est naturel en français et reste distinct de « par son sang ».
- source_word: ἀπὸ τῆς ὀργῆς
  choice: de la colère
  rationale: L’article défini est conservé. Le texte ne précise pas explicitement « de Dieu », même si le contexte indique qu’il s’agit de la colère divine.
theological_decisions:
- issue: Portée de δικαιωθέντες
  choice: Conserver « justifiés » dans le texte principal
  alternative: déclarés justes
  rationale: « Justifiés » maintient le terme paulinien traditionnel et sa continuité lexicale sans imposer une explication confessionnelle particulière; l’autre formulation est signalée en note.
- issue: Référent de ἡ ὀργή
  choice: Traduire « la colère » sans complément explicatif dans le texte principal
  alternative: la colère de Dieu
  rationale: Le contexte implique la colère divine, mais le grec ne contient pas ici le mot « Dieu ». La traduction préserve cette retenue, avec une précision en note.
- issue: Valeur de ἐν dans ἐν τῷ αἵματι αὐτοῦ
  choice: par son sang
  alternative: dans son sang
  rationale: La valeur instrumentale ou fondatrice est probable dans le contexte, mais la formulation plus littérale demeure possible et est documentée en note.
translation_notes:
  register: Français international moderne, clair et digne. « À bien plus forte raison » restitue l’intensification argumentative de Paul; « maintenant que nous avons été » évite la lourdeur du participe passé composé français tout en gardant l’antériorité de la justification par rapport au salut futur.
