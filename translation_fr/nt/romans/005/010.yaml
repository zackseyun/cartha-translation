id: ROM.5.10
reference: Romans 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: fr
  text: Car si, alors que nous étions ennemis, nous avons été réconciliés avec Dieu par la mort de son Fils, à plus forte raison, une fois réconciliés, nous serons sauvés par sa vie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans sa vie ».'
    reason: La préposition grecque ἐν peut ici exprimer soit le moyen (« par »), soit la sphère ou l’association (« dans »).
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Car si
  rationale: « Car » maintient le lien argumentatif avec ce qui précède, tandis que « si » conserve la forme conditionnelle du raisonnement de Paul.
- source_word: ἐχθροὶ ὄντες
  choice: alors que nous étions ennemis
  rationale: Cette formulation naturelle exprime l’état antérieur indiqué par le participe et conserve le terme relationnel fort « ennemis ».
- source_word: κατηλλάγημεν τῷ θεῷ
  choice: nous avons été réconciliés avec Dieu
  rationale: Le passif grec est conservé. En français, « réconciliés avec Dieu » est plus idiomatique que « réconciliés à Dieu », sans effacer le fait que Dieu est le terme de la réconciliation.
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: par la mort de son Fils
  rationale: « Par » rend naturellement διά avec le génitif dans son sens de moyen, tout en maintenant le contraste concis entre la mort et la vie du Fils.
- source_word: πολλῷ μᾶλλον
  choice: à plus forte raison
  rationale: Cette expression française rend clairement la progression a fortiori de l’argument, avec une force rhétorique naturelle.
- source_word: καταλλαγέντες
  choice: maintenant que nous avons été réconciliés
  rationale: Cette tournure explicite l’antériorité du participe aoriste par rapport au futur « serons-nous sauvés », sans ajouter de contenu doctrinal.
- source_word: σωθησόμεθα
  choice: serons-nous sauvés
  rationale: Le futur passif et le sens sotériologique de σῴζω sont directement conservés; l’inversion s’intègre à la construction ouverte par « si ».
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: par sa vie
  rationale: Le sens instrumental est plausible dans le contraste immédiat avec « par la mort de son Fils ». Une note conserve toutefois la possibilité locative ou associative de ἐν.
theological_decisions:
- issue: Valeur de ἐν τῇ ζωῇ αὐτοῦ
  choice: 'sens instrumental : « par sa vie »'
  alternative: 'sens locatif ou associatif : « dans sa vie »'
  rationale: Le parallèle avec le moyen de la réconciliation, « par la mort de son Fils », favorise une lecture instrumentale. Toutefois, la préposition ἐν peut garder une nuance de sphère ou d’union; cette ambiguïté réelle est signalée en note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. « À plus forte raison » restitue naturellement l’argument a fortiori. Le terme théologique courant « réconciliés » est conservé, et la syntaxe reste proche du mouvement argumentatif grec sans devenir pesante.
