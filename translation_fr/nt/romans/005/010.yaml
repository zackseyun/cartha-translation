    issue: 'La conclusion est formulée comme une question : « serons-nous sauvés ».'
    rationale: σωθησόμεθα est un futur indicatif déclaratif. Le grec affirme que « nous serons sauvés » ; il ne pose pas une question. L’inversion française altère donc le mode discursif de la phrase.
  - severity: low
    issue: « Maintenant que nous avons été réconciliés » explicite inutilement une temporalité présente.
    rationale: Le participe aoriste καταλλαγέντες marque l’antériorité de la réconciliation par rapport au salut futur, sans employer un équivalent explicite de « maintenant ». « Une fois réconciliés » conserve cette relation avec davantage de concision et de neutralité.
  revised_text: Car si, alors que nous étions ennemis, nous avons été réconciliés avec Dieu par la mort de son Fils, à plus forte raison, une fois réconciliés, nous serons sauvés par sa vie[a].
