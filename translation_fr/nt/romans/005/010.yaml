  to: Car si, alors que nous étions ennemis, nous avons été réconciliés avec Dieu par la mort de son Fils, à plus forte raison, une fois réconciliés, nous serons sauvés par sa vie[a].
  rationale: La révision rétablit le caractère déclaratif du futur grec et rend le participe aoriste par une construction française plus proche, sans modifier le sens ni trancher l’ambiguïté de ἐν τῇ ζωῇ αὐτοῦ.
