  to: par qui nous avons aussi obtenu, par la foi, accès à cette grâce dans laquelle nous sommes établis, et nous nous glorifions[a] dans l’espérance de la gloire de Dieu.
  rationale: La révision conserve les choix terminologiques solides du projet, tout en évitant que le passé composé de « eu accès » ne soit compris comme révolu et en remplaçant une périphrase peu idiomatique par « nous nous glorifions », qui représente plus directement καυχώμεθα. La note préserve les alternatives lexicales sans trancher artificiellement la nuance.
