source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: fr
  text: par qui nous avons aussi obtenu, par la foi, accès à cette grâce dans laquelle nous sommes établis, et nous nous glorifions[a] dans l’espérance de la gloire de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « nous nous réjouissons » ou « nous exultons ».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: accès
  rationale: « Accès » exprime naturellement l’entrée accordée dans la grâce et convient au contexte de la relation avec Dieu, sans réduire le terme à une simple présentation personnelle.
- source_word: πίστει
  choice: par la foi
  rationale: Le datif indique ici naturellement le moyen par lequel cet accès est reçu ; « par la foi » est clair, concis et courant en français biblique moderne.
- source_word: χάριν
  choice: grâce
  rationale: « Grâce » conserve le terme paulinien établi et désigne ici la faveur divine dans laquelle les croyants ont été introduits.
- source_word: ἑστήκαμεν
  choice: nous sommes établis
  rationale: Le parfait grec décrit un état présent résultant d’une action accomplie. « Nous sommes établis » rend cet état durable plus naturellement que le calque « nous nous tenons ».
- source_word: καυχώμεθα
  choice: nous mettons notre fierté
  rationale: Cette expression préserve l’idée positive d’une fierté assumée, sans les connotations exclusivement négatives que « nous nous vantons » porte souvent en français. La note conserve les autres nuances possibles.
- source_word: ἐπ’ ἐλπίδι
  choice: dans l’espérance
  rationale: Cette formulation idiomatique présente l’espérance comme le domaine ou le fondement de cette fierté confiante.
- source_word: δόξης τοῦ θεοῦ
  choice: la gloire de Dieu
  rationale: La formulation transparente conserve le génitif grec et le registre solennel du passage.
theological_decisions:
- issue: Rendre καυχώμεθα sans effacer la tension rhétorique de Paul
  choice: nous mettons notre fierté
  alternative: nous nous réjouissons ; nous exultons ; nous nous glorifions
  rationale: « Nous mettons notre fierté » garde la force d’une affirmation confiante tout en restant intelligible et digne en français actuel. La note signale que le verbe peut aussi exprimer la joie ou l’exultation, sans imposer une seule nuance théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche de la progression grecque tout en évitant les calques lourds. Le point avant « Et » clarifie les deux affirmations coordonnées sans modifier leur lien logique.
