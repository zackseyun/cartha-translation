revisions:
- from: Pourtant, la mort a régné depuis Adam jusqu’à Moïse, même sur ceux qui n’avaient pas péché d’une manière semblable à la transgression d’Adam. Celui-ci est la figure[a] de celui qui était à venir[b].
  to: Pourtant, la mort a régné depuis Adam jusqu’à Moïse, même sur ceux qui n’avaient pas péché à la ressemblance de la transgression d’Adam. Celui-ci est la figure[a] de celui qui était à venir[b].
  rationale: La seule révision remplace une comparaison française moins naturelle par « à la ressemblance de », qui reflète explicitement le nom grec ὁμοίωμα (« ressemblance ») et préserve l’indétermination de l’original. Les ancres de notes restent attachées à « figure » et à « celui qui était à venir », les expressions auxquelles elles se rapportent.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:17:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’ensemble est fidèlement rendu : la mort est personnifiée comme exerçant un règne, sa domination s’étend d’Adam à Moïse, y compris à ceux dont le péché n’était pas à la ressemblance de la transgression d’Adam, et Adam est présenté comme le τύπος de celui qui devait venir. « Celui qui était à venir » maintient à juste titre l’expression indirecte du grec et sa perspective future par rapport à Adam.'
  naturalness: 'La phrase est globalement naturelle, mais « péché d’une manière semblable à la transgression d’Adam » est moins idiomatique et légèrement imprécis : ce n’est pas une manière qui est comparée à une transgression, mais le péché qui est caractérisé comme étant « à la ressemblance » de cette transgression. Une formulation plus directe conserve mieux la construction et l’ambiguïté du grec.'
  terminology: « Mort », « régné », « transgression » et « figure » conviennent au registre paulinien et au français international moderne. « Figure » rend bien τύπος; les alternatives de note sont recevables. L’identification du référent au Christ reste limitée à la note contextuelle, sans l’ajouter au texte.
  issues:
  - severity: low
    issue: Formulation de la comparaison avec la transgression d’Adam
    rationale: « D’une manière semblable à la transgression » est une tournure française moins nette et peut faire porter la comparaison sur la manière plutôt que sur le péché. « À la ressemblance de la transgression d’Adam » suit plus étroitement ἐπὶ τῷ ὁμοιώματι tout en ne résolvant pas ce que Paul entend précisément par cette ressemblance.
