id: ROM.5.14
reference: Romans 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: fr
  text: Pourtant, la mort a régné depuis Adam jusqu’à Moïse, même sur ceux qui n’avaient pas péché à la ressemblance de la transgression d’Adam. Celui-ci est la figure[a] de celui qui était à venir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « modèle » ou « préfiguration ».
    reason: lexical_alternative
  - marker: b
    text: Ou « de celui qui devait venir ». Dans le contexte, il s’agit du Christ.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Pourtant
  rationale: Marque nettement le contraste avec l’affirmation précédente tout en restant naturel en français moderne.
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: la mort a régné
  rationale: Conserve l’image royale et la personnification de la mort présentes dans le grec.
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: depuis Adam jusqu’à Moïse
  rationale: Exprime clairement et naturellement toute l’étendue temporelle indiquée par le grec.
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: même sur ceux qui n’avaient pas péché
  rationale: « Même » fait ressortir l’extension surprenante du règne de la mort, tandis que « sur » maintient l’idée de domination.
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: d’une manière semblable à la transgression d’Adam
  rationale: Formulation française naturelle qui conserve la comparaison sans préciser au-delà du texte en quoi consiste la ressemblance.
- source_word: παραβάσεως
  choice: transgression
  rationale: Rend l’idée du franchissement ou de la violation d’un commandement et convient au registre argumentatif de Paul.
- source_word: τύπος
  choice: figure
  rationale: Terme français établi pour une personne qui annonce et préfigure une autre, sans réduire le mot à une simple ressemblance.
- source_word: τοῦ μέλλοντος
  choice: de celui qui était à venir
  rationale: Rend le participe substantivé sans introduire explicitement le nom du Christ et conserve la perspective future par rapport à Adam.
theological_decisions:
- issue: Référent de « celui qui était à venir »
  choice: Le référent demeure implicite dans le corps du texte, comme en grec; une note indique qu’il s’agit du Christ dans le contexte.
  alternative: Traduire directement « du Christ à venir ».
  rationale: Romains 5.12-21 établit la correspondance entre Adam et le Christ, mais le verset emploie lui-même une désignation indirecte. La traduction préserve cette formulation et évite d’expliciter dans le texte principal ce que le contexte permet d’identifier.
- issue: Lien de « celui-ci » avec Adam
  choice: Une nouvelle proposition, « Celui-ci est… », reprend Adam.
  alternative: 'Conserver une longue relative: « Adam, qui est… ».'
  rationale: Le masculin singulier identifie grammaticalement Adam comme antécédent tout en produisant une phrase française plus lisible; aucune autre interprétation théologique n’est ajoutée.
translation_notes:
  register: Français international moderne, digne et accessible. La personnification royale de la mort est conservée. La formulation maintient la comparaison entre la faute des autres humains et la transgression d’Adam sans en définir précisément la nature, et elle laisse indirecte dans le texte principal l’identification de celui qui était à venir.
