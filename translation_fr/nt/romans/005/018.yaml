id: ROM.5.18
reference: Romans 5:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: fr
  text: Ainsi donc, de même que, par une seule faute, la condamnation a atteint tous les êtres humains, de même aussi, par un seul acte juste, la justification qui donne la vie[a] a atteint tous les êtres humains.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « la justification de vie ».'
    reason: La relation exprimée par le génitif ζωῆς peut être rendue littéralement par « de vie » ; le texte principal l’explicite comme une justification qui donne la vie.
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: Ainsi donc
  rationale: Cette expression française naturelle conserve la force conclusive des deux connecteurs grecs.
- source_word: παραπτώματος
  choice: faute
  rationale: « Faute » désigne clairement un acte répréhensible précis et convient au contraste avec l’acte juste, sans élargir le terme à la notion générale de péché.
- source_word: κατάκριμα
  choice: condamnation
  rationale: Ce choix maintient la portée judiciaire du terme grec et le parallèle entre Adam et Christ.
- source_word: δικαιώματος
  choice: acte juste
  rationale: Dans ce contexte, le singulier désigne un acte décisif conforme à la justice. « Acte juste » est naturel en français et évite de transformer l’expression en qualité abstraite.
- source_word: δικαίωσιν ζωῆς
  choice: la justification qui donne la vie
  rationale: Cette formulation explicite naturellement en français le rapport entre la justification et la vie, tout en conservant ensemble les dimensions judiciaire et vivifiante de l’expression.
- source_word: πάντας ἀνθρώπους
  choice: tous les êtres humains
  rationale: Cette traduction inclusive et précise reproduit la même portée dans les deux membres du parallèle.
- source_word: εἰς
  choice: a atteint
  rationale: Le grec présente une construction elliptique sans verbe exprimé. « A atteint » rend lisiblement l’orientation vers le résultat dans les deux moitiés tout en maintenant leur symétrie.
theological_decisions:
- issue: Faut-il restreindre le second « tous les êtres humains » afin d’éviter une portée apparemment universelle ?
  choice: Conserver « tous les êtres humains » dans les deux membres sans restriction interprétative.
  alternative: « tous ceux qui croient » ou « tous ceux qui sont justifiés » dans le second membre
  rationale: Le grec répète exactement πάντας ἀνθρώπους dans les deux moitiés. Restreindre la seconde occurrence résoudrait dans la traduction une tension théologique que le verset laisse ouverte à son contexte.
- issue: Identification précise de l’« acte juste »
  choice: Ne pas préciser dans le texte qu’il s’agit de l’obéissance ou de la mort du Christ.
  alternative: « l’acte d’obéissance du Christ »
  rationale: Le contexte met cet acte en rapport avec le Christ, mais le nom δικαίωμα ne précise pas ici à lui seul la forme exacte de cet acte. La traduction conserve donc la concision et l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « de même… de même aussi » et celle de « tous les êtres humains » préservent la structure argumentative. Le verbe « a atteint », absent mais requis en français courant, est ajouté symétriquement dans les deux propositions afin de rendre l’ellipse grecque sans privilégier un membre du parallèle.
