id: ROM.5.17
reference: Romans 5:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: fr
  text: Car si, par la faute d’un seul, la mort a régné par ce seul homme, à bien plus forte raison ceux qui reçoivent l’abondance de la grâce et le don de la justice[a] régneront-ils dans la vie par un seul homme, Jésus-Christ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le don qui rend juste ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Jésus le Messie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: faute
  rationale: « Faute » exprime naturellement en français un acte de transgression et convient au contraste entre Adam et Christ, sans imposer un vocabulaire trop technique.
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: a régné / régneront
  rationale: La répétition de « régner » conserve la métaphore royale et le contraste délibéré entre le règne de la mort et celui des bénéficiaires de la grâce.
- source_word: διὰ τοῦ ἑνός
  choice: par ce seul homme / par un seul homme
  rationale: Le masculin substantivé renvoie ici à une personne. L’ajout de « homme » rend ce référent explicite en français tout en maintenant l’insistance sur l’unique personne dans le parallèle Adam-Christ.
- source_word: περισσείαν τῆς χάριτος
  choice: l’abondance de la grâce
  rationale: Cette formulation conserve l’idée de profusion et le terme paulinien établi « grâce ».
- source_word: δωρεᾶς τῆς δικαιοσύνης
  choice: le don de la justice
  rationale: « Justice » est le correspondant français naturel de δικαιοσύνη dans ce contexte paulinien; la construction laisse ouverte la portée exacte du don, sans la réduire à une seule formulation doctrinale.
- source_word: λαμβάνοντες
  choice: ceux qui reçoivent
  rationale: Le présent français rend naturellement le participe qui caractérise les personnes en question.
- source_word: ἐν ζωῇ
  choice: dans la vie
  rationale: La formulation concise maintient le contraste avec la mort et préserve l’ouverture de l’expression grecque.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus-Christ
  rationale: En français, la forme traditionnelle et idiomatique « Jésus-Christ » rend naturellement cette association devenue largement onomastique.
theological_decisions:
- issue: Portée de δικαιοσύνη dans « le don de la justice »
  choice: le don de la justice
  alternative: le don qui rend juste
  rationale: Le génitif grec peut être conservé sans décider explicitement s’il désigne la justice comme don ou le statut juste accordé. La traduction principale préserve cette densité; la note donne une explicitation possible sans l’imposer.
- issue: Valeur de Χριστός après Ἰησοῦ
  choice: Jésus-Christ
  alternative: Jésus le Messie
  rationale: Dans cette association, Χριστός peut fonctionner de manière proche d’un nom tout en gardant son origine titulaire. La traduction principale suit l’usage français naturel, tandis que la note conserve le sens du titre.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la structure argumentative « car si… à bien plus forte raison », le parallèle entre les deux règnes et la répétition insistante de « un seul », tout en explicitant le référent humain nécessaire à la fluidité française.
