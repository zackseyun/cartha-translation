  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: fr
  text: Car, jusqu’à la Loi, le péché était dans le monde ; mais le péché n’est pas compté[a] quand il n’y a pas de loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’est pas porté au compte de quelqu’un » ou « n’est pas imputé ».
    reason: Alternative lexicale pour rendre la nuance comptable de ἐλλογεῖται sans imposer un terme théologique technique dans le texte principal.
lexical_decisions:
- source_word: ἄχρι
  choice: jusqu’à
  rationale: La préposition marque la période qui s’étend jusqu’au don de la Loi ; « jusqu’à » en conserve naturellement la valeur temporelle.
- source_word: νόμου
  choice: la Loi / de loi
  rationale: Dans la première proposition, le contexte d’Adam à Moïse désigne vraisemblablement la Loi mosaïque, d’où « la Loi ». Dans la formulation générale de la seconde, « de loi » préserve l’absence d’article et la portée conditionnelle sans préciser davantage.
- source_word: ἁμαρτία
  choice: le péché
  rationale: Le singulier abstrait paulinien est rendu de manière directe et conserve sa possible force personnifiée.
- source_word: ἐν κόσμῳ
  choice: dans le monde
  rationale: Traduction naturelle qui désigne le monde humain où le péché était présent.
- source_word: ἐλλογεῖται
  choice: est porté en compte
  rationale: Cette expression française actuelle conserve nettement l’image comptable du verbe sans imposer le terme théologique plus technique « imputer ».
- source_word: μὴ ὄντος νόμου
  choice: quand il n’y a pas de loi
  rationale: Le génitif absolu exprime ici la circonstance ou condition temporelle de l’absence de loi ; cette formulation est idiomatique et laisse ouverte la nuance exacte.
theological_decisions:
- issue: Référent de νόμος dans l’argument de Paul
  choice: « la Loi » dans la première proposition, avec une référence mosaïque suggérée par le contexte
  alternative: « une loi » ou « loi », dans un sens entièrement générique
  rationale: Le contexte immédiat oppose la période d’Adam à Moïse à celle qui suit Moïse. La majuscule française signale le référent probable sans ajouter « de Moïse » au texte.
- issue: Portée de ἐλλογεῖται
  choice: « est porté en compte » dans le texte principal
  alternative: « est compté » ou « est imputé »
  rationale: Le choix retenu garde la métaphore comptable et la tension théologique du passage, sans figer le sens dans un vocabulaire doctrinal technique.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le parallélisme grec et la distinction contextuelle entre « la Loi » mosaïque et l’absence de « loi » dans la proposition générale.
