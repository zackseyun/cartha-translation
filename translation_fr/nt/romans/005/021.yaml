id: ROM.5.21
reference: Romans 5:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: fr
  text: afin que, tout comme le péché a régné dans la mort, de même la grâce règne par la justice[a], en vue de la vie éternelle, par Jésus le Messie[b], notre Seigneur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la droiture ».'
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « Jésus Christ »; Χριστός signifie « Messie » et peut fonctionner ici comme un titre ou comme une désignation devenue quasi nominale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit naturellement en français la visée ou le résultat exprimé par ἵνα avec le subjonctif, sans trancher rigidement entre but et conséquence.
- source_word: ἐβασίλευσεν
  choice: a régné
  rationale: Le passé composé rend naturellement l’aoriste en français moderne tout en conservant la métaphore royale.
- source_word: ἐν τῷ θανάτῳ
  choice: dans la mort
  rationale: Conserve la valeur de sphère la plus directe de ἐν et évite de transformer la mort en moyen explicite.
- source_word: ἡ χάρις
  choice: la grâce
  rationale: Rendu français usuel qui maintient la personnification paulinienne et son opposition au péché.
- source_word: βασιλεύσῃ
  choice: règne
  rationale: Le subjonctif présent après « afin que » exprime naturellement la visée ou le résultat et maintient la métaphore du règne.
- source_word: διὰ δικαιοσύνης
  choice: par la justice
  rationale: « Par » rend διά avec le génitif comme moyen; « justice » est le terme français le plus large et traditionnel pour δικαιοσύνη, sans réduire ici le mot à une seule construction doctrinale.
- source_word: εἰς ζωὴν αἰώνιον
  choice: en vue de la vie éternelle
  rationale: Préserve l’orientation exprimée par εἰς sans ajouter un verbe absent du grec; la formulation reste idiomatique en français.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Rend explicitement Χριστός comme titre, dans une formulation française naturelle.
- source_word: τοῦ κυρίου ἡμῶν
  choice: notre Seigneur
  rationale: Rendu direct, usuel et digne de κύριος avec le possessif.
theological_decisions:
- issue: Portée de δικαιοσύνη dans ce passage paulinien
  choice: par la justice
  alternative: par la droiture
  rationale: « Justice » conserve l’éventail juridique, relationnel et moral du terme grec. « Droiture » est signalé comme possibilité lexicale sans imposer une lecture doctrinale particulière.
- issue: Statut de Χριστός comme titre ou désignation devenue quasi nominale
  choice: Jésus le Messie
  alternative: Jésus-Christ
  rationale: Le texte principal rend le sens du titre grec; la note conserve la forme française traditionnelle, qui peut refléter son emploi quasi nominal dans les lettres.
- issue: Relation exprimée par ἵνα et le subjonctif
  choice: afin que… règne
  alternative: de sorte que… règne
  rationale: « Afin que » fait ressortir la visée, mais le contexte peut aussi permettre une nuance de résultat; le texte ne développe pas cette ambiguïté au-delà de ce que permet la syntaxe française.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure parallèle « tout comme… de même… » conserve la rhétorique grecque. Les personnifications du péché et de la grâce ainsi que l’image de leur règne sont maintenues.
