  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: fr
  text: et la persévérance produit un caractère éprouvé[a], et le caractère éprouvé produit l’espérance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un caractère qui a fait ses preuves » ou « l’approbation ».
    reason: Alternative lexicale reflétant l’étendue de sens de δοκιμή.
lexical_decisions:
- source_word: ὑπομονή
  choice: persévérance
  rationale: Ce terme français courant exprime la constance qui tient bon dans l’épreuve et convient à la progression amorcée au verset précédent.
- source_word: δοκιμή
  choice: caractère éprouvé
  rationale: Le nom désigne ici la qualité qui ressort de l’épreuve et s’y révèle authentique, plutôt qu’un simple trait moral abstrait.
- source_word: ἐλπίς
  choice: espérance
  rationale: Équivalent français naturel dans le registre biblique moderne; il conserve ici l’attente confiante sans explicitation doctrinale ajoutée.
- source_word: δὲ
  choice: et
  rationale: La particule relie les étapes successives de la chaîne sans marquer une forte opposition.
- source_word: ellipse de κατεργάζεται
  choice: produit
  rationale: Le verbe est repris implicitement du verset 3; le répéter en français rend clairement et naturellement la progression causale.
theological_decisions:
- issue: Sens de δοκιμή dans la progression
  choice: Une qualité de caractère éprouvée et reconnue authentique
  alternative: L’épreuve elle-même ou l’approbation qui en résulte
  rationale: Puisque δοκιμή est présentée comme le résultat de la persévérance, « caractère éprouvé » préserve sa portée expérientielle et morale sans trancher davantage la relation entre mise à l’épreuve et approbation.
translation_notes:
  register: Français international moderne, naturel et digne. La structure répétitive du grec est conservée afin de faire entendre l’enchaînement rhétorique.
