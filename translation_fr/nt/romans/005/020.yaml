id: ROM.5.20
reference: Romans 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: fr
  text: La loi est venue s’ajouter[a] afin que la faute[b] se multiplie ; mais là où le péché s’est multiplié, la grâce a surabondé[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est entrée en plus » ; le verbe grec évoque une entrée aux côtés de quelque chose ou en supplément.
    reason: lexical_alternative
  - marker: b
    text: Ou « la transgression » ou « l’offense ».
    reason: lexical_alternative
  - marker: c
    text: Ou « a abondé bien davantage » ou « a débordé au-delà de toute mesure ».
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: la loi
  rationale: Dans le contexte paulinien, le terme désigne naturellement la loi mosaïque. L’article défini français explicite ce référent sans ajouter de précision interprétative.
- source_word: παρεισῆλθεν
  choice: est venue s’ajouter
  rationale: Cette formulation naturelle rend la nuance de para-, celle d’une entrée en plus ou aux côtés de ce qui était déjà présent, plutôt qu’une simple arrivée.
- source_word: ἵνα πλεονάσῃ
  choice: afin que … se multiplie
  rationale: « Afin que » conserve la valeur de visée de ἵνα avec le subjonctif, tandis que « se multiplie » exprime l’accroissement sans en atténuer la tension théologique.
- source_word: τὸ παράπτωμα
  choice: la faute
  rationale: « Faute » désigne clairement l’acte de violation et convient au rappel de la faute d’Adam dans le contexte immédiat, tout en restant accessible en français actuel.
- source_word: οὗ
  choice: là où
  rationale: Cette locution rend naturellement le relatif adverbial et préserve la construction contrastive.
- source_word: ἡ ἁμαρτία
  choice: le péché
  rationale: C’est l’équivalent français courant et précis dans le vocabulaire paulinien.
- source_word: ὑπερεπερίσσευσεν
  choice: a surabondé bien davantage
  rationale: Le verbe composé est fortement intensif. « Surabondé » exprime l’abondance qui dépasse la mesure, et « bien davantage » rend son intensification dans un français solennel mais intelligible.
- source_word: ἡ χάρις
  choice: la grâce
  rationale: Terme théologique français établi, clair et fidèle au sens de χάρις dans ce passage.
theological_decisions:
- issue: La valeur de ἵνα dans l’affirmation selon laquelle la loi est venue afin que la faute se multiplie.
  choice: afin que la faute se multiplie
  alternative: de sorte que la faute s’est multipliée
  rationale: La construction grecque exprime directement une visée. La traduction la conserve sans la réduire à un simple résultat afin de ne pas résoudre à la place de Paul la tension théologique du propos.
translation_notes:
  register: Français international moderne, digne et lisible. « Est venue s’ajouter » évite un calque opaque tout en gardant la nuance du grec ; « surabondé bien davantage » maintient l’intensité rhétorique de la dernière proposition. La ponctuation finale par virgule reflète la continuité syntaxique fournie dans la source.
