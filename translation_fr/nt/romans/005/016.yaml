id: ROM.5.16
reference: Romans 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: fr
  text: Et le don n’est pas comme ce qui est venu par celui qui a péché[a]. En effet, le jugement, à partir d’une seule faute[b], a abouti à la condamnation, mais le don de grâce, à partir de nombreuses fautes, a abouti à la justification[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme ce qui est venu par un seul homme qui a péché ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement « à partir d’un seul ».
    reason: source_ambiguity
  - marker: c
    text: Ou « à un verdict favorable » ou « à l’acquittement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: le don
  rationale: Le nom désigne ce qui est donné. « Le don » est naturel en français et n’ajoute pas une qualification absente du terme.
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: par celui qui a péché
  rationale: Cette formulation conserve la référence personnelle et la tournure elliptique du grec, sans préciser « homme » ni remplacer la personne par son acte.
- source_word: κρίμα
  choice: le jugement
  rationale: Dans ce contexte judiciaire, le terme désigne une décision de justice; « jugement » reste clair et maintient sa distinction avec la condamnation qui en résulte.
- source_word: ἐξ ἑνὸς
  choice: à partir d’une seule faute
  rationale: Le neutre ἑνός renvoie vraisemblablement à une faute, en contraste avec les nombreuses fautes de la proposition suivante. Le nom est explicité pour rendre la phrase intelligible en français.
- source_word: κατάκριμα
  choice: la condamnation
  rationale: Le terme exprime une sentence ou un état de condamnation et forme l’un des pôles de l’antithèse judiciaire du verset.
- source_word: χάρισμα
  choice: le don de grâce
  rationale: Cette expression rend le lien du nom avec la grâce et le distingue de δώρημα, traduit plus simplement par « don ».
- source_word: παραπτωμάτων
  choice: fautes
  rationale: « Fautes » exprime de manière naturelle et digne l’idée d’actes répréhensibles, tout en évitant le caractère moins courant de « offenses » dans cet emploi.
- source_word: δικαίωμα
  choice: la justification
  rationale: Dans son opposition à κατάκριμα, le mot désigne ici le résultat judiciaire favorable. « Justification » restitue bien ce contraste paulinien, tout en laissant une note signaler la nuance possible de verdict favorable ou d’acquittement.
theological_decisions:
- issue: Portée judiciaire de δικαίωμα en contraste avec κατάκριμα
  choice: la justification, comme résultat opposé à la condamnation
  alternative: un verdict favorable; l’acquittement
  rationale: La structure oppose le jugement qui conduit à la condamnation au don de grâce qui conduit à δικαίωμα. « Justification » préserve cette antithèse judiciaire sans exclure la nuance plus concrète d’un verdict favorable.
- issue: Référent de ἐξ ἑνὸς
  choice: une seule faute
  alternative: un seul homme; une seule chose
  rationale: Le genre neutre et le parallèle explicite avec « de nombreuses fautes » favorisent la référence à une seule faute, mais la concision grecque justifie de signaler la solution plus littérale.
translation_notes:
  register: Français international moderne, digne et accessible. La symétrie argumentative est conservée au moyen de « à partir de… a abouti à… ». « Don de grâce » maintient la nuance propre à χάρισμα, tandis que les notes préservent les ambiguïtés réelles des expressions elliptiques et judiciaires.
