  to: Mais le don n’est pas comme la faute[a]. Car si, par la faute d’un seul, la multitude[c] est morte, à bien plus forte raison la grâce de Dieu et le don accordé par la grâce d’un seul homme, Jésus le Messie[b], ont surabondé pour la multitude[c].
  rationale: La révision allège la première désignation de χάρισμα en « don », tout en conservant l’expression explicite du rapport à la grâce pour δωρεὰ ἐν χάριτι. Elle corrige également l’inversion déclarative et ancre la note sur οἱ πολλοί / τοὺς πολλούς aux deux endroits concernés, sans modifier la portée volontairement non résolue du texte.
