id: ROM.5.15
reference: Romans 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: fr
  text: Mais le don n’est pas comme la faute[a]. Car si, par la faute d’un seul, la multitude[c] est morte, à bien plus forte raison la grâce de Dieu et le don accordé par la grâce d’un seul homme, Jésus le Messie[b], ont surabondé pour la multitude[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la transgression » ou « de l’offense ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Jésus-Christ ».
    reason: lexical_alternative
  - marker: c
    text: Littéralement « les nombreux », dans les deux occurrences.
    reason: source_form
lexical_decisions:
- source_word: παράπτωμα
  choice: faute
  rationale: « Faute » exprime ici un acte mauvais et coupable sans imposer un vocabulaire juridique trop technique; le même terme est repris pour maintenir le contraste entre Adam et le don.
- source_word: χάρισμα
  choice: don accordé par grâce
  rationale: Cette formulation fait entendre la relation de χάρισμα avec la grâce tout en gardant clairement l’idée centrale de don.
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: la multitude
  rationale: « La multitude » rend en français naturel le groupe défini opposé à « un seul », sans transformer explicitement l’expression en « tous » ni suggérer simplement une majorité numérique.
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: la grâce de Dieu
  rationale: La formulation conserve la structure grecque et le parallèle avec le don qui vient par la grâce.
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: le don venu par la grâce
  rationale: « Venu par » rend de façon idiomatique la valeur instrumentale ou associative possible de ἐν, sans effacer le lien étroit entre le don et la grâce.
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: d’un seul homme
  rationale: « Un seul homme » maintient l’opposition rhétorique essentielle entre l’un et la multitude.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre dans la comparaison entre Adam et le Messie; l’article français est nécessaire pour une expression naturelle.
- source_word: ἐπερίσσευσεν
  choice: ont surabondé
  rationale: « Surabonder » conserve la force d’excès de περισσεύω et soutient l’argument « à bien plus forte raison », malgré son registre légèrement soutenu.
theological_decisions:
- issue: Portée de « la multitude » dans le parallèle entre Adam et le Messie
  choice: Conserver « la multitude » sans l’expliciter par « tous ».
  alternative: Traduire par « tous » afin de rendre explicite une portée représentative universelle.
  rationale: Paul emploie ici délibérément l’opposition entre un seul et les nombreux. « La multitude » préserve cette tension et laisse le contexte plus large préciser la portée de l’expression.
- issue: Rapport entre la grâce de Dieu et le don dans la proposition finale
  choice: Les présenter comme deux expressions coordonnées étroitement liées, avec un verbe au pluriel exigé par le français.
  alternative: Faire du don une apposition explicative à la grâce de Dieu.
  rationale: Le grec coordonne ἡ χάρις et ἡ δωρεά tout en employant un verbe singulier. La coordination française préserve cette tension autant que possible sans produire une faute d’accord.
translation_notes:
  register: Français international actuel, digne et accessible. « Surabonder » est volontairement plus soutenu afin de conserver l’image d’une abondance qui dépasse toute mesure. La répétition de « grâce » et le contraste « un seul / la multitude » reproduisent la charpente argumentative du grec.
