  terminology: « Faute », « grâce », « Jésus le Messie » et « surabondé » conviennent. « La multitude » maintient utilement l’opposition définie entre l’un et les nombreux sans trancher sa portée. La note concernant cette expression doit être ancrée aux deux occurrences qu’elle commente.
