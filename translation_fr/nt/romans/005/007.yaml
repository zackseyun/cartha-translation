source:
  edition: SBLGNT
  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: fr
  text: En effet, c’est à peine si quelqu’un mourrait pour quelqu’un de juste[a][b] ; car, pour quelqu’un de bon, peut-être quelqu’un oserait-il même mourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un juste ». En grec, l’expression est grammaticalement masculine, mais elle peut avoir ici une portée générale.
    reason: lexical_alternative
  - marker: b
    text: Le contraste entre « juste » et « bon » peut être intentionnel, et non une simple variation de style.
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: c’est à peine si
  rationale: Cette tournure française naturelle exprime qu’un tel geste ne se produirait que très rarement, voire presque jamais.
- source_word: ὑπὲρ
  choice: pour
  rationale: Dans ce contexte, la préposition indique que la mort est subie en faveur de quelqu’un. « Pour » conserve ce sens de manière concise et idiomatique.
- source_word: δικαίου
  choice: une personne juste
  rationale: L’adjectif substantivé désigne une personne caractérisée par la justice. Cette formulation garde la catégorie morale du grec tout en rendant explicitement sa portée générique.
- source_word: ἀποθανεῖται
  choice: mourrait
  rationale: Bien que le grec emploie le futur, le conditionnel est la manière la plus naturelle en français d’exprimer cette éventualité dans une maxime générale.
- source_word: τοῦ ἀγαθοῦ
  choice: une personne bonne
  rationale: Ce choix préserve le contraste lexical possible entre la personne « juste » et la personne « bonne », sans préciser de quelle manière cette dernière manifeste sa bonté.
- source_word: τάχα
  choice: peut-être
  rationale: Le terme indique une possibilité sans l’affirmer et garde le ton mesuré de la phrase.
- source_word: καὶ
  choice: même
  rationale: 'Ici, καί a une valeur intensive : il souligne jusqu’où quelqu’un pourrait aller.'
- source_word: τολμᾷ
  choice: oserait
  rationale: Le conditionnel convient à l’éventualité introduite par « peut-être » et transmet l’idée qu’une telle mort exige une audace exceptionnelle.
- source_word: ἀποθανεῖν
  choice: mourir
  rationale: La traduction directe conserve la répétition du motif de la mort dans les deux propositions.
theological_decisions:
- issue: Faut-il préserver une distinction entre δικαίου et ἀγαθοῦ ?
  choice: Rendre les deux termes distinctement par « une personne juste » et « une personne bonne ».
  alternative: Les traiter comme de proches synonymes et atténuer la différence en français.
  rationale: La juxtaposition peut opposer la rectitude d’une personne à sa bonté positive. La traduction conserve cette tension possible sans imposer une explication précise.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « c’est à peine si » évite un calque rigide, tandis que « personne juste » et « personne bonne » maintiennent le parallélisme et la possible distinction du grec.
