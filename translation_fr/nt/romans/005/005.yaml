id: ROM.5.5
reference: Romans 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: fr
  text: Or, l’espérance ne nous couvre pas de honte[a], parce que l’amour de Dieu[b] a été répandu dans nos cœurs par l’Esprit Saint qui nous a été donné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne déçoit pas ».
    reason: Alternative lexicale qui exprime le résultat de la honte dans ce contexte, mais atténue l’image grecque.
  - marker: b
    text: Ou, moins probablement, « notre amour pour Dieu ».
    reason: Le génitif grec peut formellement désigner soit l’amour venant de Dieu, soit l’amour dirigé vers Dieu.
lexical_decisions:
- source_word: ἡ δὲ ἐλπὶς
  choice: Or, l’espérance
  rationale: « Or » rend légèrement la transition marquée par δέ sans imposer une forte opposition; l’article français convient naturellement au nom générique « espérance ».
- source_word: οὐ καταισχύνει
  choice: ne nous couvre pas de honte
  rationale: Cette formulation française naturelle conserve le champ sémantique de la honte de καταισχύνω; « nous » explicite seulement le complément humain sous-entendu dans ce contexte.
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: l’amour de Dieu
  rationale: La formulation garde la construction génitivale du grec et sa dignité, tout en laissant l’autre relation possible être signalée en note.
- source_word: ἐκκέχυται
  choice: a été répandu
  rationale: Le passé composé passif exprime l’acte accompli dont le résultat demeure, conformément au parfait grec.
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: dans nos cœurs
  rationale: Rendu direct, idiomatique et fidèle de la localisation intérieure.
- source_word: διὰ πνεύματος ἁγίου
  choice: par l’Esprit Saint
  rationale: « Par » exprime ici le moyen ou la médiation indiqués par διά avec le génitif; les majuscules identifient le référent divin personnel.
- source_word: τοῦ δοθέντος ἡμῖν
  choice: qui nous a été donné
  rationale: La proposition relative se rattache clairement à l’Esprit Saint et conserve le passif du grec.
theological_decisions:
- issue: Sens du génitif dans ἡ ἀγάπη τοῦ θεοῦ
  choice: l’amour de Dieu, compris principalement comme l’amour de Dieu pour nous
  alternative: notre amour pour Dieu
  rationale: Le fait que cet amour soit répandu dans nos cœurs par l’Esprit soutient principalement le sens subjectif, sans éliminer entièrement l’ambiguïté formelle du génitif; l’autre possibilité est donc conservée en note.
translation_notes:
  register: Français international moderne, courant et digne. « Ne nous couvre pas de honte » préserve l’image honneur-honte sans paraître archaïque. Les marqueurs de note sont placés immédiatement après les expressions auxquelles ils se rapportent.
