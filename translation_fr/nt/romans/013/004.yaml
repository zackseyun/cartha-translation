id: ROM.13.4
reference: Romans 13:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: fr
  text: 'Car elle est au service de Dieu pour ton bien. Mais si tu fais le mal, crains-la, car ce n’est pas pour rien[a] qu’elle porte l’épée. Elle est en effet au service de Dieu : elle est chargée d’exercer la vengeance, pour la colère contre celui qui pratique le mal.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vain ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « chargée d’infliger le châtiment à celui qui fait le mal ». Le grec dit littéralement, de façon concise : « vengeresse pour la colère envers celui qui pratique le mal »; il ne précise pas explicitement que cette colère est celle de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονός
  choice: au service de Dieu
  rationale: Cette formulation exprime clairement la fonction d’agent au service de Dieu dans un contexte civil, sans donner à « ministre » un sens ecclésiastique ni employer le peu naturel « servante de Dieu » pour l’autorité.
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: pour ton bien
  rationale: Le datif σοὶ et l’expression de but ou de résultat εἰς τὸ ἀγαθόν indiquent ensemble l’avantage procuré au destinataire.
- source_word: τὸ κακὸν ποιῇς
  choice: si tu fais le mal
  rationale: Expression française naturelle qui conserve la portée morale de κακόν.
- source_word: φοβοῦ
  choice: crains-la
  rationale: L’impératif direct garde la force de l’exhortation et précise naturellement en français que l’autorité est l’objet de cette crainte.
- source_word: εἰκῇ
  choice: pour rien
  rationale: Rend de façon idiomatique l’idée de porter l’épée non sans but ni effet réel.
- source_word: μάχαιραν φορεῖ
  choice: elle porte l’épée
  rationale: Conserve l’image concrète de l’épée et la nuance habituelle de φορέω, qui désigne ici le port régulier de cet instrument ou symbole d’autorité punitive.
- source_word: ἔκδικος
  choice: chargée de faire justice
  rationale: ἔκδικος désigne l’agent qui exerce la justice ou la vengeance. Cette formulation actuelle garde la dimension rétributive sans évoquer une vengeance personnelle.
- source_word: εἰς ὀργὴν
  choice: en exerçant la colère
  rationale: La formulation maintient le lien de but ou de résultat avec la colère sans préciser explicitement qu’il s’agit de la colère de Dieu, précision absente du grec.
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: contre celui qui pratique le mal
  rationale: Le participe substantivé décrit une personne caractérisée par une conduite mauvaise; « pratique le mal » en conserve la nuance durative.
- source_word: γὰρ
  choice: Car / en effet
  rationale: Ces connecteurs français rendent la fonction explicative des deux occurrences de γάρ tout en évitant une répétition lourde.
theological_decisions:
- issue: Rapport entre le rôle punitif de l’autorité et la colère divine
  choice: « en exerçant la colère » sans ajouter « de Dieu »
  alternative: « chargée d’infliger le châtiment » ou « d’exécuter la colère de Dieu »
  rationale: Le contexte présente bien l’autorité comme un agent de Dieu, mais εἰς ὀργὴν ne répète pas explicitement θεοῦ. La traduction conserve donc ce lien et cette ambiguïté au lieu de les résoudre.
- issue: Sens rétributif de ἔκδικος
  choice: « chargée de faire justice »
  alternative: « vengeresse » ou « chargée de punir »
  rationale: « Faire justice » traduit la fonction rétributive dans un registre civil digne, sans suggérer une vengeance passionnelle ni réduire la notion au seul châtiment.
translation_notes:
  register: Français international moderne, clair et digne. Le pronom féminin « elle » reprend l’autorité évoquée dans le contexte. Le tutoiement singulier conserve le nombre de σοὶ et des formes verbales grecques. Les deux occurrences de διάκονος sont rendues de manière cohérente par « au service de Dieu ».
