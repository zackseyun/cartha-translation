  - severity: low
    issue: La note b qualifie comme « littérale » une formulation qui ne l’est pas réellement.
    rationale: « Chargée de faire justice en vue de la colère » reste une paraphrase de ἔκδικος. La note doit présenter les options de traduction sans revendiquer une littéralité imprécise.
