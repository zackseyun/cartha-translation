source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: fr
  text: En effet, les gouvernants ne sont pas à craindre pour qui fait le bien, mais pour qui fait le mal.[a] Mais veux-tu ne pas craindre l’autorité ?[b] Fais le bien, et tu recevras son approbation.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « ne sont pas à craindre pour une bonne action, mais pour une mauvaise ». Le grec oppose de façon générale ce qui est bon à ce qui est mauvais.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Mais souhaites-tu ne pas craindre l’autorité ? »'
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire de la part de l’autorité qui gouverne.
    reason: referent_clarification
lexical_decisions:
- source_word: ἄρχοντες
  choice: ceux qui gouvernent
  rationale: Désigne les personnes qui exercent le pouvoir. Cette formulation est naturelle en français moderne et n’impose aucun titre officiel particulier.
- source_word: φόβος
  choice: ne sont pas à craindre
  rationale: Le nom prédicatif indique que les gouvernants constituent une cause ou un objet de crainte. La tournure française exprime clairement cette valeur sans raideur littérale.
- source_word: τῷ ἀγαθῷ ἔργῳ … τῷ κακῷ
  choice: quand on fait le bien … quand on fait le mal
  rationale: Le singulier ἔργῳ a ici une portée générique, et l’adjectif substantivé τῷ κακῷ lui répond. La traduction conserve l’antithèse éthique générale entre bien et mal.
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: Veux-tu donc ne pas avoir à craindre
  rationale: Conserve la question rhétorique et la construction θέλεις suivie de l’infinitif négatif, tout en restant idiomatique en français.
- source_word: τὴν ἐξουσίαν
  choice: l’autorité
  rationale: Le singulier avec article renvoie au pouvoir civil envisagé comme institution; «l’autorité» préserve cette formulation générale.
- source_word: τὸ ἀγαθὸν ποίει
  choice: Fais ce qui est bien
  rationale: L’adjectif substantivé désigne ce qui est moralement bon. Cette formulation garde la portée générale de l’expression.
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: tu recevras d’elle des éloges
  rationale: Rend naturellement l’idée d’avoir ou d’obtenir l’approbation venant de l’autorité, avec le pronom féminin exigé en français par «autorité».
theological_decisions:
- issue: Portée de l’affirmation concernant les gouvernants
  choice: 'Présenter sans ajout leur fonction normale: ils inspirent la crainte à celui qui fait le mal et approuvent celui qui fait le bien.'
  alternative: En faire soit une garantie absolue concernant tout gouvernant en toute circonstance, soit une déclaration ironique ou subversive.
  rationale: Le texte formule directement le rôle de l’autorité dans ce contexte. La traduction ne transforme pas cette affirmation en doctrine plus absolue que son libellé et n’introduit pas une ironie dépourvue de marque textuelle.
translation_notes:
  register: Français international moderne, clair et digne. La question rhétorique du grec est conservée. «Ceux qui gouvernent» évite un titre institutionnel trop précis, tandis que «l’autorité» maintient le singulier abstrait du texte source.
