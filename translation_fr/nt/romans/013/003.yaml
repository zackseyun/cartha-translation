  naturalness: Le français est globalement naturel. « Pour qui fait le bien / pour qui fait le mal » rend plus directement et plus idiomatiquement la relation entre les gouvernants et les personnes concernées que « quand on fait ».
  terminology: « Gouvernants », « autorité », « le bien », « le mal » et « approbation » conviennent au registre moderne international et conservent le caractère général du grec. « Son approbation » est plus juste ici que « des éloges », qui peut évoquer des compliments explicites et pluriels.
