revisions:
- from: En effet, ceux qui gouvernent ne sont pas à craindre quand on fait le bien, mais quand on fait le mal.[a] Veux-tu donc ne pas avoir à craindre l’autorité?[b] Fais ce qui est bien, et tu recevras d’elle des éloges.[c]
  to: En effet, les gouvernants ne sont pas à craindre pour qui fait le bien, mais pour qui fait le mal.[a] Mais veux-tu ne pas craindre l’autorité ?[b] Fais le bien, et tu recevras son approbation.[c]
  rationale: La révision retire la nuance modale ajoutée par « avoir à », exprime plus directement le rapport entre les gouvernants et ceux qui font le bien ou le mal, et rend ἔπαινον par « approbation », terme adéquat pour l’évaluation favorable de l’autorité. La question rhétorique, le singulier abstrait « l’autorité » et la portée non absolutisée de l’énoncé sont préservés.
