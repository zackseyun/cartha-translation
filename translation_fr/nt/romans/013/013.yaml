  source_fidelity: Le texte rend fidèlement l’exhortation au subjonctif (« Conduisons-nous »), l’image éthique du comportement « comme en plein jour », et les trois paires de vices. « Fêtes débridées » évite à juste titre le faux resserrement sexuel possible avec « orgies », tandis que « débauche sexuelle » rend le sens idiomatique de κοῖταις plutôt que son littéral opaque « lits ».
  naturalness: Le français est moderne, fluide et d’un registre digne. La ponctuation par deux-points et l’anaphore « sans » donnent à l’énumération un rythme naturel. Les singuliers collectifs « ivrognerie », « débauche sexuelle », « conduite indécente » sont idiomatiques en français et ne modifient pas le sens des pluriels grecs.
  terminology: « Avec dignité » communique convenablement εὐσχημόνως dans ce contexte, sans imposer une interprétation supplémentaire. « Conduite indécente » conserve la portée plus large, quoique souvent sexuelle, de ἀσελγείαις. « Jalousie » est approprié pour ζήλῳ dans cette liste; la note « envie » préserve l’alternative lexicale pertinente.
