id: ROM.13.13
reference: Romans 13:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: fr
  text: 'Conduisons-nous avec dignité, comme en plein jour : sans fêtes débridées ni ivrognerie, sans débauche sexuelle ni conduite indécente, sans querelles ni jalousie[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « envie »; le terme grec peut désigner la jalousie ou l’envie, avec ici un sens négatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: comme en plein jour
  rationale: Cette tournure française naturelle conserve l’image du jour et son contraste implicite avec les ténèbres dans le contexte.
- source_word: εὐσχημόνως περιπατήσωμεν
  choice: Conduisons-nous avec dignité
  rationale: Le verbe περιπατέω décrit ici la manière de vivre; « conduisons-nous » exprime clairement cette valeur métaphorique, tandis que « avec dignité » rend l’idée d’une conduite convenable et honorable.
- source_word: κώμοις
  choice: fêtes débridées
  rationale: Le terme désigne des réjouissances tapageuses et excessives, souvent accompagnées de boisson; cette formulation évite le sens sexuel trop étroit que peut suggérer « orgies ».
- source_word: μέθαις
  choice: ivrognerie
  rationale: Le mot grec vise l’ivresse ou les excès de boisson; « ivrognerie » convient au style condensé d’une liste de vices.
- source_word: κοίταις
  choice: débauche sexuelle
  rationale: Littéralement « lits », le terme désigne ici par métonymie des relations sexuelles répréhensibles; traduire le sens évite une expression française opaque.
- source_word: ἀσελγείαις
  choice: conduite indécente
  rationale: Le terme évoque une conduite effrontée, sans retenue et souvent sexuelle, mais son champ n’est pas exclusivement sexuel; cette traduction préserve cette largeur.
- source_word: ἔριδι
  choice: querelles
  rationale: Le terme désigne les conflits, disputes et rivalités; le pluriel français s’intègre naturellement à l’énumération.
- source_word: ζήλῳ
  choice: jalousie
  rationale: Dans cette liste de vices, ζῆλος a un sens négatif; « jalousie » convient au voisinage de « querelles », tout en laissant « envie » comme autre possibilité.
theological_decisions:
- issue: Contraste métaphorique entre le jour et les ténèbres
  choice: Conserver l’image par « comme en plein jour »
  alternative: Expliciter l’image par « comme il convient à ceux qui vivent dans la lumière »
  rationale: Le texte exhorte à une conduite appropriée au jour, dans le cadre du contraste contextuel jour-ténèbres. La traduction garde l’image sans lui ajouter une interprétation doctrinale.
- issue: Sens idiomatique de κοίταις
  choice: Traduire par « débauche sexuelle »
  alternative: Traduire littéralement par « lits »
  rationale: Le pluriel « lits » fonctionne ici comme référence aux activités sexuelles illicites. Une traduction sémantique communique le sens moral sans rendre la phrase obscure.
- issue: Portée de ἀσελγείαις
  choice: « conduite indécente »
  alternative: « sensualité » ou « dérèglement »
  rationale: Le grec désigne une absence effrontée de retenue, souvent mais non exclusivement sexuelle. Le choix évite de réduire sans nécessité le terme à la sensualité.
translation_notes:
  register: Français international moderne, clair et digne. La métaphore de la marche est rendue idiomatiquement par la conduite de vie; les trois paires de vices et le rythme exhortatif du grec sont conservés.
