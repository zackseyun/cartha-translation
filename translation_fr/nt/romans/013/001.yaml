id: ROM.13.1
reference: Romans 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: fr
  text: Que chacun se soumette aux autorités qui le gouvernent[a], car il n’y a pas d’autorité qui ne vienne de Dieu, et celles qui existent ont été établies[b] par Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux autorités supérieures » ou « aux autorités placées au-dessus de lui ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ont été instituées par Dieu » ou « ont été mises en ordre par Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: chacun
  rationale: L’expression signifie idiomatiquement chaque personne. « Chacun » conserve la portée distributive de πᾶσα dans un français naturel, sans suggérer ici une anthropologie technique liée au mot « âme ».
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: aux autorités qui le gouvernent
  rationale: ἐξουσίαις désigne les autorités, tandis que ὑπερεχούσαις les présente comme placées au-dessus. Cette formulation rend clairement leur fonction gouvernementale tout en maintenant en note les traductions plus littérales.
- source_word: ὑποτασσέσθω
  choice: se soumette
  rationale: Le présent impératif exprime une sujétion continue à un ordre d’autorité. « Se soumettre » est idiomatique et ne renforce pas le verbe jusqu’à lui faire signifier une approbation absolue ou une obéissance sans limites.
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: car il n’y a d’autorité que de Dieu
  rationale: La tournure française rend ὑπὸ θεοῦ comme indiquant la source ultime de l’autorité, sans développer davantage la portée théologique de l’énoncé.
- source_word: αἱ δὲ οὖσαι
  choice: celles qui existent
  rationale: Le féminin pluriel renvoie sans ambiguïté aux autorités déjà mentionnées et traduit directement le participe οὖσαι.
- source_word: τεταγμέναι
  choice: ont été établies
  rationale: Le parfait passif de τάσσω présente les autorités comme se trouvant dans un état résultant de l’action ordonnatrice de Dieu. « Établies » convient au contexte institutionnel sans impliquer que chacun de leurs actes est moralement approuvé.
theological_decisions:
- issue: Portée de l’affirmation concernant les autorités civiles et Dieu
  choice: Affirmer que les autorités existantes sont établies dans un ordre qui vient de Dieu, sans présenter pour autant chaque décision de chaque dirigeant comme approuvée par Dieu.
  alternative: Comprendre soit que tout régime et chacun de ses actes reçoivent une approbation divine positive, soit que Paul ne parle que du principe abstrait d’autorité.
  rationale: Le grec vise concrètement les autorités existantes et les dit τεταγμέναι par Dieu. La traduction conserve cette affirmation forte, mais n’ajoute aucune conclusion concernant la valeur morale de tous leurs actes.
translation_notes:
  register: Français international moderne, digne et accessible. Le singulier « le » reprend naturellement « chacun ». La phrase conserve la structure argumentative du grec et ses deux affirmations parallèles sur l’autorité.
