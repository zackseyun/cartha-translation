id: ROM.13.5
reference: Romans 13:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: fr
  text: C’est pourquoi il est nécessaire de se soumettre, non seulement à cause de la colère[a], mais aussi par motif de conscience[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du châtiment ». Le grec dit « de la colère », expression qui peut désigner soit l’action punitive de l’autorité, soit, plus largement, la colère divine s’exerçant par l’intermédiaire de l’autorité civile.
    reason: alternative_reading
  - marker: b
    text: Littéralement, « à cause de la conscience ».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: C’est pourquoi
  rationale: Marque clairement la conclusion tirée de l’argument précédent sur les autorités et reste naturel en français moderne.
- source_word: ἀνάγκη
  choice: il est nécessaire
  rationale: Conserve la tournure impersonnelle et la force de nécessité sans ajouter l’idée d’une obéissance absolue.
- source_word: ὑποτάσσεσθαι
  choice: de se soumettre
  rationale: Rend naturellement l’infinitif présent moyen/passif et exprime la posture demandée envers les autorités.
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: non seulement … mais aussi
  rationale: Reproduit directement et idiomatiquement la construction corrélative grecque.
- source_word: διὰ τὴν ὀργὴν
  choice: à cause de la colère
  rationale: διά avec l’accusatif indique ici le motif; « colère » préserve la valeur lexicale et l’ambiguïté du référent.
- source_word: διὰ τὴν συνείδησιν
  choice: par motif de conscience
  rationale: Exprime en français idiomatique la conscience comme motivation intérieure, tout en conservant le rapport causal de διά.
theological_decisions:
- issue: Référent de ὀργή (« colère »)
  choice: Conserver « la colère » sans en préciser l’auteur.
  alternative: « le châtiment » ou « la colère de Dieu »
  rationale: Le contexte peut évoquer l’action punitive de l’autorité aussi bien que la colère divine agissant par son intermédiaire; le grec ne tranche pas explicitement.
- issue: Portée de ὑποτάσσεσθαι envers les autorités
  choice: « se soumettre »
  alternative: « être soumis »
  rationale: La formulation exprime clairement la posture requise sans transformer le verset en affirmation explicite d’obéissance absolue.
translation_notes:
  register: Français international moderne, clair et digne. « C’est pourquoi » assure le lien logique; « par motif de conscience » est idiomatique et distingue élégamment la motivation intérieure de la crainte de la colère.
source_grounding:
  english_pob_role: consult_only
