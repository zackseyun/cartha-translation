id: ROM.13.12
reference: Romans 13:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: fr
  text: La nuit est bien avancée[a], et le jour est tout proche. Rejetons donc les œuvres des ténèbres et revêtons-nous des armes de la lumière[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La nuit a avancé. » Le verbe grec présente la nuit comme ayant progressé, c’est-à-dire comme étant déjà en grande partie écoulée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « l’armure de la lumière ». Le terme grec peut désigner les armes ou, plus largement, l’équipement de combat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ νὺξ
  choice: la nuit
  rationale: Conserve l’image temporelle explicite et son contraste avec « le jour », sans la réduire à sa seule portée morale.
- source_word: προέκοψεν
  choice: est bien avancée
  rationale: Le verbe évoque une progression. Cette tournure française naturelle indique que la nuit a largement suivi son cours, tout en maintenant l’image grecque.
- source_word: ἡ ἡμέρα ἤγγικεν
  choice: le jour est tout proche
  rationale: Le parfait grec exprime l’état présent résultant d’une approche. « Est tout proche » le rend naturellement en français sans expliciter l’identité symbolique du jour.
- source_word: ἀποβαλώμεθα
  choice: rejetons
  rationale: Le subjonctif d’exhortation appelle une action collective. « Rejetons » conserve l’idée vive de se débarrasser de quelque chose et s’accorde avec l’image vestimentaire qui suit.
- source_word: τὰ ἔργα τοῦ σκότους
  choice: les œuvres des ténèbres
  rationale: « Œuvres » maintient un terme paulinien courant, tandis que « des ténèbres » préserve la métaphore éthique sans la paraphraser.
- source_word: ἐνδυσώμεθα
  choice: revêtons-nous
  rationale: Rend naturellement l’exhortation et maintient l’image de l’habillement, en contraste avec l’action de rejeter.
- source_word: τὰ ὅπλα τοῦ φωτός
  choice: des armes de la lumière
  rationale: Ὅπλα désigne l’équipement de combat, notamment les armes, et le pluriel français suit celui du grec. Avec « revêtons-nous », l’expression peut évoquer l’ensemble de l’équipement militaire sans limiter le sens à l’armure défensive.
theological_decisions:
- issue: Métaphore eschatologique de la nuit et du jour
  choice: Conserver littéralement « nuit » et « jour »
  alternative: Expliciter par « l’époque des ténèbres touche à sa fin » et « le jour nouveau arrive »
  rationale: Les images ont à la fois une portée temporelle, morale et eschatologique. Les expliciter dans le texte principal trancherait une tension que le grec laisse ouverte.
- issue: Sens de ὅπλα τοῦ φωτός
  choice: les armes de la lumière
  alternative: l’armure de la lumière
  rationale: Le nom grec pluriel peut désigner des armes ou, plus largement, l’équipement militaire. « Armes » respecte directement cette amplitude lexicale; « armure » s’accorde particulièrement bien avec le verbe « revêtir », mais privilégie l’équipement défensif et passe au singulier.
translation_notes:
  register: Français international actuel, digne et accessible. Le parallélisme des exhortations est conservé, ainsi que les images temporelle, vestimentaire et militaire. « Tout proche » restitue idiomatiquement l’état présent exprimé par le parfait grec.
