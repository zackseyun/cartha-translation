revisions:
- from: Ainsi, celui qui s’oppose à l’autorité s’est opposé à l’ordre établi par Dieu[a], et ceux qui s’y sont opposés recevront un jugement contre eux-mêmes[b].
  to: Par conséquent, celui qui s’oppose à l’autorité s’est opposé à l’ordre établi par Dieu[a] ; ceux qui s’y sont opposés encourront eux-mêmes un jugement[b].
  rationale: La révision remplace la tournure non idiomatique « un jugement contre eux-mêmes » par « encourront eux-mêmes un jugement », qui rend naturellement le futur λήμψονται et le datif réfléchi ἑαυτοῖς. « Par conséquent » souligne la valeur inférentielle de ὥστε. Le point-virgule suit la légère valeur contrastive/de transition de δέ sans surinterprétation. La note a est reformulée afin que son alternative corresponde clairement au syntagme grec complet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:17:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : l''opposition à l''autorité équivaut à s''opposer à la disposition de Dieu, et entraîne un κρίμα. Toutefois, « un jugement contre eux-mêmes » ne rend pas naturellement le datif réfléchi ἑαυτοῖς avec λήμψονται ; le grec exprime qu''ils encourent ou reçoivent un jugement pour eux-mêmes, c''est-à-dire à leur propre détriment.'
  naturalness: « Ainsi » est acceptable, mais « Par conséquent » rend plus explicitement l'inférence de ὥστε. « Ils encourront eux-mêmes un jugement » est idiomatique en français moderne et restitue clairement la conséquence subie par les opposants.
  terminology: '« L''ordre établi par Dieu » est une bonne solution contextuelle pour τῇ τοῦ θεοῦ διαταγῇ. La note alternative « à la disposition de Dieu » est grammaticalement maladroite après « s''est opposé » dans la formulation actuelle : l''alternative doit porter sur le groupe nominal complet. « Jugement » maintient à juste titre l''ambiguïté de κρίμα sans imposer « condamnation » au sens final.'
  issues:
