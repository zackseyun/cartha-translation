id: ROM.13.2
reference: Romans 13:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: fr
  text: Par conséquent, celui qui s’oppose à l’autorité s’est opposé à l’ordre établi par Dieu[a] ; ceux qui s’y sont opposés encourront eux-mêmes un jugement[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la disposition établie par Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: « Jugement » peut aussi se traduire par « condamnation » ou « sentence », mais le grec n’impose pas ici le sens plus fort d’une condamnation finale.
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: Ainsi
  rationale: Introduit la conséquence logique de l’affirmation précédente, dans un français naturel et soutenu.
- source_word: ὁ ἀντιτασσόμενος
  choice: celui qui s’oppose
  rationale: Le participe présent substantivé désigne de manière générale quiconque adopte une attitude d’opposition.
- source_word: τῇ ἐξουσίᾳ
  choice: à l’autorité
  rationale: Conserve le singulier grec et renvoie, dans le contexte immédiat, à l’autorité gouvernante mentionnée au verset précédent.
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: à l’ordre établi par Dieu
  rationale: διαταγή peut désigner un ordre ou une disposition. Cette formulation exprime ici ce que Dieu a ordonné tout en restant idiomatique en français.
- source_word: ἀνθέστηκεν
  choice: s’est opposé
  rationale: 'Le passé composé rend la valeur résultative du parfait grec : l’opposition a été adoptée et demeure pertinente.'
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: et ceux qui s’y sont opposés
  rationale: Maintient le parallèle lexical avec le verbe précédent; « y » reprend naturellement l’ordre établi par Dieu, lié à l’autorité.
- source_word: ἑαυτοῖς
  choice: contre eux-mêmes
  rationale: Le datif réfléchi indique que le jugement retombe sur ceux qui résistent.
- source_word: κρίμα
  choice: jugement
  rationale: Terme assez large pour préserver l’indétermination du grec sans imposer l’idée plus forte d’une condamnation définitive.
- source_word: λήμψονται
  choice: recevront
  rationale: Rend directement le futur grec et laisse le complément réfléchi préciser que la conséquence retombera sur eux.
theological_decisions:
- issue: Portée de κρίμα
  choice: jugement
  alternative: condamnation ou sentence
  rationale: Le verset annonce un jugement encouru par les opposants, sans préciser qu’il s’agit de la condamnation finale.
- issue: Référence de ἐξουσία
  choice: l’autorité, comprise dans le contexte comme l’autorité gouvernante
  alternative: l’autorité au sens abstrait et général
  rationale: Romains 13.1 fournit le référent civil ou gouvernemental, mais le texte conserve la formulation sobre du grec sans ajouter un qualificatif.
- issue: Nature de la διαταγή de Dieu
  choice: l’ordre établi par Dieu
  alternative: la disposition de Dieu
  rationale: La formulation peut évoquer à la fois l’acte d’ordonner et l’organisation voulue par Dieu, sans préciser davantage la nature de cette ordonnance.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « s’opposer » préserve le lien lexical du grec; le passé composé restitue naturellement la portée actuelle du parfait.
