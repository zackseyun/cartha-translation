    issue: « recevront un jugement contre eux-mêmes »
    rationale: Cette expression est peu idiomatique et « contre eux-mêmes » suggère une direction hostile que le datif ἑαυτοῖς n'exprime pas directement. Le sens est celui d'un jugement qu'ils encourent à leur propre détriment.
  - severity: low
