id: ROM.13.11
reference: Romans 13:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: fr
  text: 'Et faites cela, sachant en quel temps nous sommes : c’est déjà l’heure pour vous[a] de vous réveiller du sommeil, car notre salut est maintenant plus proche que lorsque nous avons cru[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « nous » au lieu de « vous ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « que lorsque nous avons cru pour la première fois ». Le grec dit simplement « lorsque nous avons cru ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: Et faites cela
  rationale: Le démonstratif renvoie aux exhortations précédentes. L’ajout du verbe « faites », implicite dans l’enchaînement grec, produit en français une phrase naturelle sans introduire une nouvelle idée.
- source_word: εἰδότες τὸν καιρόν
  choice: sachant quel temps nous vivons
  rationale: καιρός désigne ici le moment décisif, et non simplement le temps chronologique. Cette tournure française rend naturellement la conscience de la période présente tout en conservant sa portée exhortative.
- source_word: ὅτι ὥρα ἤδη
  choice: c’est déjà l’heure
  rationale: Cette formulation conserve l’image de « l’heure » ainsi que l’urgence exprimée par ἤδη, tout en donnant à ὅτι une valeur explicative après les deux-points.
- source_word: ὑμᾶς
  choice: pour vous
  rationale: Le texte du SBLGNT porte la deuxième personne du pluriel. « Vous » la rend directement; la variante « nous » est signalée en note.
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: de vous réveiller du sommeil
  rationale: Cette expression garde la métaphore du réveil et du sommeil dans une langue française actuelle. La forme pronominale est plus naturelle que le passif, sans imposer une interprétation du caractère moyen ou passif de l’infinitif.
- source_word: νῦν γὰρ
  choice: car ... maintenant
  rationale: « Car » exprime la raison de l’exhortation, tandis que « maintenant » marque nettement le moment présent.
- source_word: ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: le salut est maintenant plus proche de nous
  rationale: Cette formulation suit la relation comparative du grec et évite de préciser de quelle étape doctrinale du salut il s’agit.
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: que lorsque nous avons cru
  rationale: Le grec dit simplement « lorsque nous avons cru ». La traduction n’ajoute donc pas « pour la première fois » ou « commencé », même si ce sens est contextuellement possible.
theological_decisions:
- issue: Le salut présenté comme plus proche qu’au moment où les destinataires ont cru
  choice: Conserver le terme général « le salut » comme une réalité encore à venir et qui s’approche.
  alternative: « notre salut final », « notre délivrance au retour du Seigneur » ou « le plein accomplissement de notre salut »
  rationale: Paul parle du salut comme appartenant déjà à l’horizon des croyants tout en étant encore plus proche dans le présent. Ne pas le qualifier préserve cette tension eschatologique sans réduire le mot à une étape doctrinale précise.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’urgence rhétorique de « l’heure », la métaphore du réveil et l’ambiguïté temporelle de « lorsque nous avons cru ».
