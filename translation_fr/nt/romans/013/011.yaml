  rationale: La révision resserre le rendu de καιρός, exprime naturellement le possessif ἡμῶν sans interpréter le sens eschatologique de « salut », et aligne la note b sur l'alternative lexicale documentée dans l'audit anglais. Les ancres restent placées sur les unités concernées.
