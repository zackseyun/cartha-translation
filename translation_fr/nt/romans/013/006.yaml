id: ROM.13.6
reference: Romans 13:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: fr
  text: C’est en effet pour cette raison que vous payez aussi des impôts, car les autorités sont des serviteurs de Dieu et s’appliquent à cette tâche même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: vous payez des impôts
  rationale: Expression française naturelle et exacte pour l’acquittement de taxes ou tributs dus à l’autorité.
- source_word: λειτουργοὶ θεοῦ
  choice: au service de Dieu
  rationale: Rend la fonction publique exercée au service de Dieu dans ce contexte, sans suggérer à tort un ministère cultuel ou ecclésial.
- source_word: προσκαρτεροῦντες
  choice: se consacrent
  rationale: Exprime la persévérance et l’application continue à une tâche.
- source_word: εἰς αὐτὸ τοῦτο
  choice: précisément à cette tâche
  rationale: Conserve l’insistance du grec sur l’objet même de leur activité.
theological_decisions:
- issue: Référent implicite de εἰσιν et προσκαρτεροῦντες
  choice: les autorités
  alternative: ils
  rationale: Le référent vient des dirigeants mentionnés dans le contexte immédiat (Romains 13.3-4). Le nom explicite clarifie le français sans élargir leur rôle au-delà du contexte.
- issue: Portée de λειτουργοὶ θεοῦ
  choice: au service de Dieu
  alternative: ministres de Dieu
  rationale: « Au service de Dieu » préserve l’idée d’agents exerçant une fonction assignée par Dieu, tout en évitant la connotation moderne presque exclusivement religieuse de « ministres de Dieu ».
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le lien causal avec le raisonnement précédent ainsi que l’insistance finale du grec.
