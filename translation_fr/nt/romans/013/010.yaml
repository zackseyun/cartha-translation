  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: fr
  text: L’amour ne fait aucun mal au prochain ; l’amour est donc l’accomplissement de la loi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀγάπη
  choice: l’amour
  rationale: « L’amour » est l’équivalent français courant et digne de ἀγάπη. La même traduction aux deux occurrences conserve la répétition emphatique du grec.
- source_word: τῷ πλησίον
  choice: au prochain
  rationale: Le datif désigne la personne touchée par l’action. « Au prochain » est idiomatique en français et exprime ici la portée éthique générale du substantif.
- source_word: κακὸν οὐκ ἐργάζεται
  choice: ne fait aucun mal
  rationale: Dans ce contexte, κακόν désigne le mal ou le tort causé à autrui, et ἐργάζεται signifie « faire, produire ». Cette formulation naturelle conserve l’idée concrète du grec sans l’alourdir.
- source_word: πλήρωμα
  choice: l’accomplissement
  rationale: Le nom πλήρωμα désigne ici ce qui mène la loi à sa pleine réalisation. « Accomplissement » préserve la construction nominale et convient mieux au contexte que le plus abstrait « plénitude ».
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque clairement et naturellement la conclusion tirée de la proposition précédente.
- source_word: νόμου
  choice: de la loi
  rationale: Dans le contexte de l’épître, νόμος renvoie à la loi comme réalité identifiable. L’article français est donc naturel et approprié.
theological_decisions:
- issue: Rapport de l’amour à la loi
  choice: l’amour est donc l’accomplissement de la loi
  alternative: l’amour accomplit donc la loi ; l’amour est donc la plénitude de la loi
  rationale: 'Le grec présente une proposition nominale : πλήρωμα νόμου ἡ ἀγάπη. La traduction retenue en conserve la forme et l’affirmation théologique sans préciser au-delà du texte la manière dont l’amour accomplit chaque commandement.'
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste concise comme le grec. « Au prochain » maintient le vocabulaire éthique et biblique tout en demeurant immédiatement compréhensible.
