id: ROM.13.7
reference: Romans 13:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: fr
  text: 'Rendez à chacun ce qui lui est dû : à qui l’impôt, l’impôt ; à qui la taxe, la taxe ; à qui la crainte, la crainte ; à qui l’honneur, l’honneur.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: Rendez
  rationale: Le verbe signifie restituer ou acquitter ce qui est dû. « Rendez » conserve l’idée d’obligation et fait naturellement écho au vocabulaire biblique français.
- source_word: πᾶσι τὰς ὀφειλάς
  choice: à chacun ce qui lui est dû
  rationale: Formulation française naturelle qui conserve la portée distributive de πᾶσι et la notion de dette ou d’obligation exprimée par ὀφειλάς.
- source_word: φόρον
  choice: l’impôt
  rationale: φόρος désigne ici un impôt, notamment un tribut direct versé à l’autorité.
- source_word: τέλος
  choice: la taxe
  rationale: τέλος peut désigner une taxe, un droit ou une redevance, distinct du φόρος. « Taxe » préserve cette distinction sans la préciser excessivement.
- source_word: φόβον
  choice: la crainte
  rationale: Traduction directe de φόβος. Elle préserve la force et l’ambiguïté du terme plutôt que de l’atténuer en « respect ».
- source_word: τιμήν
  choice: l’honneur
  rationale: τιμή désigne l’honneur ou l’estime accordée à quelqu’un ; « honneur » conserve ici le parallélisme nominal.
theological_decisions:
- issue: Portée de φόβος envers les autorités
  choice: la crainte
  alternative: le respect
  rationale: Le grec dit φόβος, terme qui peut selon le contexte aller de la peur au respect révérenciel. Le texte français conserve « crainte » afin de ne pas résoudre silencieusement cette tension.
- issue: Identité des bénéficiaires
  choice: à qui…
  alternative: à celui à qui est dû…
  rationale: Le grec reste général et distributif, sans préciser une catégorie particulière de destinataires. La tournure retenue maintient cette généralité.
translation_notes:
  register: Français international moderne, digne et concis. Le parallélisme et la répétition emphatique du grec sont conservés. La distinction entre φόρος et τέλος est rendue par « impôt » et « taxe ».
