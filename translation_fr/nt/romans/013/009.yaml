id: ROM.13.9
reference: Romans 13:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: fr
  text: 'En effet : « Tu ne commettras pas d’adultère, tu ne commettras pas de meurtre[a], tu ne voleras pas, tu ne convoiteras pas », et s’il y a quelque autre commandement, tout cela se résume dans cette parole[b] : « Tu aimeras ton prochain comme toi-même. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec désigne le meurtre, c’est-à-dire une mise à mort criminelle, plutôt que toute forme de mise à mort.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans cette déclaration ». Ici, le mot grec traduit par « parole » désigne la formulation qui suit.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: En effet, les commandements
  rationale: Le tour grec introduit le contenu des commandements qui explique l’affirmation précédente. Cette formulation française explicite naturellement l’ellipse créée par l’article neutre sans modifier l’argument.
- source_word: μοιχεύσεις
  choice: tu ne commettras pas d’adultère
  rationale: Le futur de la citation du Décalogue a valeur impérative. Le futur français conserve la forme solennelle et le lien intertextuel.
- source_word: φονεύσεις
  choice: tu ne commettras pas de meurtre
  rationale: Le verbe désigne ici le fait de tuer de manière criminelle, et non toute mise à mort sans distinction.
- source_word: κλέψεις
  choice: tu ne voleras pas
  rationale: Le futur français reproduit naturellement la forme juridique des commandements cités.
- source_word: ἐπιθυμήσεις
  choice: tu ne convoiteras pas
  rationale: Dans le contexte du Décalogue, « convoiter » exprime le désir porté sur ce qui appartient à autrui, plus précisément que le terme général « désirer ».
- source_word: καὶ εἴ τις ἑτέρα ἐντολή
  choice: ainsi que tout autre commandement
  rationale: Cette formulation rend la portée indéfinie de τις et inclut les commandements non énumérés, sans alourdir la phrase française.
- source_word: ἀνακεφαλαιοῦται
  choice: se résument
  rationale: Le verbe signifie rassembler ou ramener sous un même principe. L’accord au pluriel suit en français le sujet collectif explicité, sans changer le sens du singulier grec.
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: dans cette parole
  rationale: λόγος désigne ici une formulation scripturaire qui rassemble les commandements. « Parole » conserve la concision et la résonance biblique du grec.
- source_word: Ἀγαπήσεις
  choice: Tu aimeras
  rationale: Le futur à valeur impérative conserve la forme de la citation de Lévitique 19.18.
- source_word: τὸν πλησίον σου
  choice: ton prochain
  rationale: « Prochain » est l’équivalent français établi et exact dans cette citation, tout en préservant son lien avec Lévitique.
- source_word: ὡς σεαυτόν
  choice: comme toi-même
  rationale: Cette expression rend directement la comparaison réflexive sans ajouter un second verbe absent du grec.
theological_decisions:
- issue: Forme des interdictions du Décalogue
  choice: Futur à valeur de commandement (« tu ne… pas »)
  alternative: Impératif direct (« ne… pas »)
  rationale: Le grec reprend la forme scripturaire au futur. La conserver maintient le lien avec le Décalogue sans introduire de nuance doctrinale.
- issue: Portée de λόγος dans ἐν τῷ λόγῳ τούτῳ
  choice: « parole », au sens de formulation récapitulative
  alternative: « déclaration » ou « formule »
  rationale: Paul renvoie à la citation entière, non à un mot isolé. « Parole » reste fidèle au terme grec, tandis qu’une note préserve l’autre sens possible.
- issue: Relation entre les commandements et le commandement d’aimer
  choice: Les commandements « se résument » dans la parole citée
  alternative: Ils sont « ramenés sous un même principe »
  rationale: La traduction exprime la fonction récapitulative du verbe sans préciser au-delà du texte comment chaque commandement se rapporte théologiquement à l’amour du prochain.
translation_notes:
  register: Français international moderne, clair et digne. Les futurs conservent la tonalité scripturaire des citations tout en restant naturels. La structure a été légèrement explicitée afin de rendre en français l’ellipse grecque et l’accord collectif.
