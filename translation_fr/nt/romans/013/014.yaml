reference: Romans 13:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: fr
  text: Mais revêtez-vous du Seigneur Jésus, le Messie, et ne vous souciez pas de la chair[a] afin d’en satisfaire les désirs.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la nature humaine pécheresse ». Le grec dit « chair », terme que Paul emploie souvent pour les tendances humaines déchues, par opposition à une vie dirigée par Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: revêtez-vous de
  rationale: L’impératif moyen conserve l’image du vêtement et exprime l’adoption d’une identité et d’une manière de vivre. « Revêtez-vous de » est naturel dans un registre biblique moderne et digne.
- source_word: κύριον
  choice: Seigneur
  rationale: Dans ce contexte christologique, κύριος est un titre de Jésus et garde toute sa portée théologique.
- source_word: Χριστόν
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre. « Le Messie » en transmet le sens tout en s’intégrant naturellement à la séquence française « Jésus, le Messie ».
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: ne prenez aucune disposition
  rationale: πρόνοια évoque la prévoyance ou les préparatifs. Cette formulation rend l’idée de ne rien organiser à l’avance au service de ce qui suit.
- source_word: σάρξ
  choice: chair
  rationale: « Chair » préserve le terme paulinien et son amplitude anthropologique, sans le réduire d’emblée à la seule notion de « nature pécheresse ».
- source_word: εἰς ἐπιθυμίας
  choice: en vue d’en satisfaire les désirs
  rationale: La préposition εἰς indique ici la visée ou le résultat des dispositions prises. La formulation française explicite ce rapport tout en rattachant les désirs à la chair.
theological_decisions:
- issue: Sens de σάρξ dans un contexte moral chez Paul
  choice: chair
  alternative: nature humaine pécheresse
  rationale: Le contexte concerne des désirs désordonnés, mais traduire directement par « nature humaine pécheresse » fixerait plus étroitement l’anthropologie de Paul. « Chair » maintient la tension théologique et la terminologie de l’auteur.
- issue: Valeur de Χριστός dans la désignation de Jésus
  choice: le Messie
  alternative: Christ
  rationale: Le mot grec porte le sens de titre messianique. « Le Messie » le rend explicitement plutôt que de le traiter comme un simple élément de nom propre.
translation_notes:
  register: Français international moderne, clair et digne. L’image du vêtement et le terme paulinien « chair » sont conservés; la tournure « prendre des dispositions » rend de façon idiomatique l’idée de prévoyance contenue dans πρόνοια.
