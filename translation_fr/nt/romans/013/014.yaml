  source_fidelity: 'Le texte conserve correctement l’impératif métaphorique ἐνδύσασθε (« revêtez-vous »), les titres « Seigneur » et « le Messie », ainsi que le terme paulinien σάρξ (« chair »). La dernière proposition exprime bien le rapport de visée de εἰς ἐπιθυμίας. « Prendre des dispositions pour la chair » est toutefois une formulation française ambiguë et peu idiomatique : elle peut évoquer des mesures prises contre la chair plutôt que le fait de lui accorder une prévoyance qui aboutit à satisfaire ses désirs.'
