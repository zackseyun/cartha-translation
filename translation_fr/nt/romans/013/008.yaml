id: ROM.13.8
reference: Romans 13:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: fr
  text: Ne devez rien à personne, si ce n’est de vous aimer les uns les autres ; car celui qui aime l’autre[a] a accompli la loi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une autre personne ». Grec : « l’autre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: Ne devez rien à personne
  rationale: Cette formulation française naturelle conserve la portée générale de la double expression négative grecque ainsi que l’image de la dette ou de l’obligation.
- source_word: εἰ μὴ
  choice: si ce n’est
  rationale: Cette tournure introduit clairement l’unique obligation qui demeure, sans explicitation doctrinale supplémentaire.
- source_word: τὸ ἀλλήλους ἀγαπᾶν
  choice: de vous aimer les uns les autres
  rationale: L’infinitif français s’enchaîne naturellement avec « devez » et rend la réciprocité exprimée par ἀλλήλους.
- source_word: ἀγαπᾶν / ἀγαπῶν
  choice: aimer / aime
  rationale: « Aimer » maintient la cohérence lexicale et la portée théologique des termes de la famille d’ἀγάπη.
- source_word: ὁ γὰρ ἀγαπῶν
  choice: car celui qui aime
  rationale: Le participe substantivé singulier est rendu par une expression représentative, claire et non archaïque.
- source_word: τὸν ἕτερον
  choice: l’autre
  rationale: Cette traduction suit directement le grec et évite d’introduire ici « le prochain », terme qui n’apparaît que dans le contexte suivant.
- source_word: νόμον
  choice: la loi
  rationale: L’article français convient à la référence reconnue à la loi dont Paul expose ensuite les commandements.
- source_word: πεπλήρωκεν
  choice: a accompli
  rationale: Le passé composé rend naturellement le parfait grec et « accomplir la loi » conserve le sens d’une exigence menée à son plein effet.
theological_decisions:
- issue: Portée de l’interdiction de la dette
  choice: Traduire directement l’interdiction de devoir quelque chose, avec l’exception de l’amour mutuel.
  alternative: En faire soit une interdiction absolue de tout emprunt, soit une simple métaphore de l’obligation morale.
  rationale: Le grec formule une interdiction générale puis excepte l’obligation d’aimer. La traduction préserve cette tension sans trancher les débats éthiques plus larges.
- issue: Référent de τὸν ἕτερον
  choice: Conserver « l’autre » sans le préciser davantage.
  alternative: Traduire par « une autre personne » ou « son prochain ».
  rationale: « L’autre » respecte l’expression grecque et laisse ouverte sa portée exacte, tandis que « son prochain » anticiperait le vocabulaire du verset suivant.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche du grec tout en étant idiomatique ; « si ce n’est » marque avec précision l’exception, et la note conserve l’ambiguïté de τὸν ἕτερον.
