- from: L’Ancien[a], à la Dame choisie et à ses enfants, que j’aime dans la vérité — et non pas moi seul, mais aussi tous ceux qui sont parvenus à connaître la vérité —
  to: L’Ancien[a], à la dame élue et à ses enfants, que j’aime dans la vérité — et non pas moi seul, mais aussi tous ceux qui sont parvenus à connaître la vérité —
  rationale: La révision remplace « choisie » par « élue », équivalent français plus direct de ἐκλεκτῇ, et retire de la note l’interprétation institutionnelle « responsable d’Église ». Elle maintient l’ambiguïté délibérée de l’adresse, la portée johannique de « dans la vérité », l’aspect résultatif exprimé par « sont parvenus à connaître », ainsi que la suspension finale du verset.
