review_pass:
  verdict: revise
  source_fidelity: Le sens global est fidèle. Toutefois, « choisie » est possible mais « élue » rend plus directement ἐκλεκτῇ dans cette adresse, sans lever l’ambiguïté entre une femme et une Église personnifiée. La note actuelle propose « responsable d’Église » comme alternative à πρεσβύτερος, ce qui interprète et modernise excessivement le terme.
  naturalness: La phrase est lisible et le tiret final reproduit correctement la continuation syntaxique. « La dame élue » est plus idiomatique et plus proche de l’usage français biblique moderne que « la Dame choisie » ; la minuscule ne préjuge ni d’un titre ni d’un nom propre.
  terminology: « L’Ancien », « enfants », « aimer » et « la vérité » conviennent. La note doit distinguer les possibilités lexicales de « Ancien » de l’incertitude référentielle concernant « dame élue » et Kyria, sans substituer un titre ecclésial contemporain au grec.
  issues:
  - severity: medium
    issue: La note de « L’Ancien » donne « le responsable d’Église » comme variante.
    rationale: Cette formulation ne constitue pas une traduction lexicale équivalente de πρεσβύτερος et impose une fonction ecclésiale institutionnelle précise. Il convient de signaler plutôt « presbytre » et, avec prudence, le sens possible d’homme âgé.
  - severity: low
    issue: « Dame choisie » avec majuscule est moins naturel et légèrement plus interprétatif que nécessaire.
    rationale: Le grec ne permet pas de décider s’il s’agit d’un nom, d’un titre ou d’un nom commun. « la dame élue » conserve l’ambiguïté tout en rendant directement les deux mots grecs.
