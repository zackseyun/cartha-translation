id: 2JN.1.1
reference: 2 John 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: fr
  text: L’Ancien[a], à la dame élue et à ses enfants, que j’aime dans la vérité — et non pas moi seul, mais aussi tous ceux qui sont parvenus à connaître la vérité —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le presbytre » ; le terme peut aussi évoquer un homme âgé. Certains comprennent « la dame élue » comme une image désignant une Église locale ; d’autres pensent que Kyria est ici un nom propre.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: L’Ancien
  rationale: Dans l’ouverture de la lettre, le terme fonctionne vraisemblablement comme une désignation reconnue de l’auteur. « L’Ancien » reste naturel en français et conserve mieux que « le presbytre » la possible nuance d’âge, de statut et d’autorité.
- source_word: ἐκλεκτῇ κυρίᾳ
  choice: à la Dame choisie
  rationale: « Dame » rend le sens courant de κυρία, tandis que « choisie » exprime ἐκλεκτή sans imposer une lecture doctrinale particulière. La formulation peut désigner une femme ou, par personnification, une Église locale.
- source_word: τοῖς τέκνοις αὐτῆς
  choice: à ses enfants
  rationale: τέκνα désigne les enfants sans restriction de sexe. Le possessif féminin respecte la grammaire de surface et demeure compatible avec une lecture métaphorique.
- source_word: ἀγαπῶ
  choice: j’aime
  rationale: Le verbe simple « aimer » correspond directement à ἀγαπάω, sans intensification absente du grec.
- source_word: ἐν ἀληθείᾳ
  choice: dans la vérité
  rationale: Cette traduction garde la formulation concrète du grec et sa résonance johannique, tout en pouvant suggérer un amour véritable. « Véritablement » réduirait cette polysémie.
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: et non pas moi seul, mais aussi tous
  rationale: La formulation reproduit clairement le contraste emphatique du grec dans un français naturel et soutenu.
- source_word: οἱ ἐγνωκότες
  choice: ceux qui sont parvenus à connaître
  rationale: Le parfait exprime un état présent issu d’un accès antérieur à la connaissance. « Sont parvenus à connaître » conserve cet aspect mieux que le simple « connaissent ».
- source_word: τὴν ἀλήθειαν
  choice: la vérité
  rationale: La traduction directe maintient à la fois le sens ordinaire et la portée théologique caractéristique des écrits johanniques.
theological_decisions:
- issue: Identité de ἐκλεκτῇ κυρίᾳ
  choice: Une adresse formulée comme visant « la Dame choisie », sans préciser s’il s’agit d’une femme ou d’une Église personnifiée.
  alternative: Une chrétienne précise et ses enfants ; une assemblée locale et ses membres ; Kyria comme nom propre.
  rationale: Le grec autorise ces différentes compréhensions. Le texte principal conserve le sens commun de κυρία et la note signale les autres possibilités sans trancher.
- issue: Sens de ἐν ἀληθείᾳ
  choice: « dans la vérité »
  alternative: « véritablement » ou « en vérité »
  rationale: L’expression peut marquer la sincérité de l’amour ou son enracinement dans la vérité au sens johannique. La formulation retenue préserve cette tension.
translation_notes:
  register: Français international moderne, digne et lisible. La majuscule à « Dame » marque la forme d’adresse sans décider s’il s’agit d’un titre, d’une personnification ou d’une personne précise. Le tiret final conserve le caractère syntaxtiquement inachevé du verset, qui se poursuit au verset suivant.
