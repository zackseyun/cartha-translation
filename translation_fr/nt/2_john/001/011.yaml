id: 2JN.1.11
reference: 2 John 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ⸂λέγων γὰρ⸃ αὐτῷ χαίρειν κοινωνεῖ τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: fr
  text: 'En effet, celui qui lui dit : « Salut ! »[a] participe à ses œuvres mauvaises.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Réjouis-toi ! » Littéralement, le grec emploie une formule courante de salutation. Dans ce contexte, elle peut exprimer l’accueil ou l’approbation, et non une simple marque de politesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: celui qui […] dit
  rationale: L’article suivi du participe présent a une valeur substantivale et générique. « Celui qui dit » conserve cette structure sans alourdir la phrase.
- source_word: γάρ
  choice: En effet
  rationale: γάρ introduit la raison de l’interdiction formulée au verset précédent. « En effet » rend naturellement cette valeur explicative en français moderne.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif renvoie à la personne mentionnée au verset précédent. « Lui » respecte cette anaphore sans expliciter davantage le référent.
- source_word: χαίρειν
  choice: « Salut ! »
  rationale: Après λέγων, l’infinitif χαίρειν fonctionne comme une formule conventionnelle de salutation. « Salut ! » en restitue clairement la fonction idiomatique, tandis que « Réjouis-toi » serait ici trop littéral.
- source_word: κοινωνεῖ
  choice: participe à
  rationale: Avec le datif, κοινωνεῖ exprime la participation aux actes d’autrui et, dans ce contexte, leur complicité morale. « Participe à » est naturel et ne fait pas intervenir le sens ecclésial plus particulier de « communion ».
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: à ses œuvres mauvaises
  rationale: « Œuvres » maintient la correspondance avec ἔργα, et « mauvaises » rend la qualification morale exprimée par πονηροῖς. La postposition de l’adjectif convient au registre digne du passage.
theological_decisions:
- issue: La salutation désigne-t-elle une simple politesse ou une marque d’accueil et de soutien engageant la complicité ?
  choice: Le texte principal conserve la formule de salutation et affirme que l’adresser à cette personne revient à participer à ses œuvres mauvaises; la note signale la portée contextuelle d’accueil ou d’approbation.
  alternative: Comprendre le verset comme une interdiction absolue de toute parole polie adressée à une telle personne, quel que soit le contexte.
  rationale: χαίρειν est lexicalement une formule de salutation, mais κοινωνεῖ et le contexte immédiat de l’accueil dans la maison au verset 10 donnent à ce geste une portée de participation ou de soutien. La traduction ne remplace donc pas la formule par l’interprétation plus forte « souhaiter la bienvenue », mais la note en précise l’enjeu contextuel.
translation_notes:
  register: Français international moderne, clair et digne. « En effet » assure un lien explicatif naturel avec le verset précédent. « Salut ! » est une formule française directe et intelligible; la note préserve à la fois le sens littéral possible et la portée contextuelle sans la faire entrer de force dans le texte principal.
