review_pass:
  verdict: revise
  source_fidelity: Le sens des propositions grecques est globalement bien rendu. « Sans apporter » est admissible pour καὶ ... οὐ φέρει, mais « ne lui adressez pas de salutation » est une formulation calquée et peu idiomatique en français actuel. Le verbe français « saluer » rend naturellement χαίρειν ... λέγειν sans élargir ou restreindre la portée de l’interdit.
  naturalness: « Ne le saluez pas » est clair, courant et de registre convenable en français international moderne. Il évite l’expression lourde « adresser une salutation », tout en conservant le singulier masculin des pronoms du grec.
  terminology: « Cet enseignement », « recevez », et « chez vous » sont appropriés. La note doit présenter χαίρειν comme formule de salutation sans faire de « Salut » français la seule équivalence littérale, car cette formule peut produire un effet de registre trompeur.
  issues:
  - severity: medium
    issue: Formulation française peu naturelle pour χαίρειν αὐτῷ μὴ λέγετε
    rationale: « Ne lui adressez pas de salutation » est grammatical mais sonne administratif et calqué. « Ne le saluez pas » est l’équivalent idiomatique exact de l’acte exprimé, sans modifier la force du grec.
  - severity: low
    issue: Note littérale trop dépendante de « Salut » comme équivalent français
    rationale: Le grec χαίρειν est étymologiquement lié à la joie, mais il fonctionne ici comme formule de salutation. La note doit le signaler sans suggérer que le français contemporain « Salut » reproduit exactement son registre.
