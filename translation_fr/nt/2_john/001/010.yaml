  variant: modern international French
source:
  edition: SBLGNT
  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: fr
  text: Si quelqu’un vient à vous et n’apporte pas cet enseignement, ne le recevez pas chez vous et ne le saluez pas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne lui dites pas : “Réjouis-toi” » ; χαίρειν était employé comme formule de salutation.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: Si quelqu’un
  rationale: Expression conditionnelle indéfinie qui présente un cas général; « quelqu’un » est naturel en français moderne.
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: vient à vous
  rationale: Rend directement le mouvement vers les destinataires sans préciser davantage le cadre ecclésial.
- source_word: καὶ ταύτην τὴν διδαχὴν οὐ φέρει
  choice: sans apporter cet enseignement
  rationale: La tournure française exprime naturellement la circonstance associée à la venue; « apporter » conserve l’image de φέρει et « enseignement » rend διδαχή sans technicité excessive.
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: ne le recevez pas chez vous
  rationale: « Recevoir chez vous » exprime clairement l’accueil dans la maison tout en conservant la portée concrète et l’éventuelle dimension d’hospitalité.
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: ne lui adressez pas de salutation
  rationale: 'Cette formulation française reste proche de la construction grecque, littéralement « ne lui dites pas : Salut », tout en étant digne et compréhensible.'
theological_decisions:
- issue: Portée de l’interdiction visant celui qui n’apporte pas cet enseignement
  choice: Conserver les actes concrets de l’accueil chez soi et de la salutation sans définir dans le texte s’il s’agit d’une interdiction de tout contact ou seulement d’un soutien officiel.
  alternative: Traduire de façon à limiter explicitement l’interdiction à l’hébergement d’un enseignant itinérant, ou à l’étendre à toute interaction sociale.
  rationale: Le contexte concerne vraisemblablement des enseignants itinérants opposés à la confession apostolique, mais le verset lui-même formule l’interdiction par des actes concrets. La traduction préserve cette tension.
- issue: Genre et nombre de αὐτόν / αὐτῷ
  choice: le / lui
  alternative: cette personne / lui
  rationale: Les pronoms français au masculin singulier reflètent les formes grecques et restent naturels dans cette proposition hypothétique générique.
translation_notes:
  register: Français international moderne, clair et digne. « Chez vous » est plus idiomatique que « dans votre maison ». La note conserve la forme particulière de χαίρειν λέγειν et évite que le lecteur réduise nécessairement la phrase à une simple formule de politesse.
