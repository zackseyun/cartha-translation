source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: fr
  text: 'Car beaucoup de séducteurs sont entrés dans le monde : ce sont ceux qui ne confessent pas Jésus, le Messie, venu dans la chair.[a] Celui-là est le séducteur et l’antichrist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte littéralement : « Jésus Christ venant dans la chair ». Le participe est au présent; « venu dans la chair » exprime idiomatiquement en français la venue incarnée et peut aussi se comprendre comme « venant dans la chair ».'
    reason: Préserve la forme participiale présente et l’ambiguïté aspectuelle du grec, sans imposer une interprétation doctrinale ou syntaxique plus étroite.
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit naturellement en français la raison de l’exhortation précédente.
- source_word: πολλοὶ πλάνοι
  choice: beaucoup de séducteurs
  rationale: πλάνος désigne ici des personnes qui égarent autrui; « séducteurs » convient au registre johannique et permet la reprise au singulier.
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: se sont répandus dans le monde
  rationale: Rend idiomatiquement l’apparition et la diffusion publique de ces séducteurs, sans donner à κόσμος un sens technique absent du texte.
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: ils ne reconnaissent pas
  rationale: Le participe substantivé précise qui sont les séducteurs. « Reconnaître » exprime ici l’aveu public ou la profession, plus naturellement que « confesser » en français courant.
- source_word: Ἰησοῦν Χριστόν
  choice: que Jésus est le Messie
  rationale: Le double accusatif après ὁμολογέω peut exprimer la reconnaissance de Jésus comme Messie; la tournure française explicite naturellement cette relation prédicative sans réduire Χριστός à un simple nom propre.
- source_word: ἐρχόμενον ἐν σαρκί
  choice: venu dans la chair
  rationale: Le participe présent grec est une formule christologique pouvant viser la venue incarnée de Jésus. Le français « venu » est naturel pour l’événement de l’incarnation, tandis qu’une note conserve la forme plus littérale et son ambiguïté aspectuelle.
- source_word: οὗτός ἐστιν
  choice: Voilà
  rationale: Le démonstratif singulier caractérise tout individu correspondant à la description précédente; « Voilà » garde cette force identificatrice dans un français naturel.
- source_word: ὁ πλάνος καὶ ὁ ἀντίχριστος
  choice: le séducteur et l’antichrist
  rationale: Conserve la reprise lexicale de πλάνος et le terme johannique traditionnel « antichrist ».
theological_decisions:
- issue: Valeur de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette formule de reconnaissance christologique, Χριστός garde nettement sa valeur de titre; « le Messie » la rend explicitement.
- issue: Rapport syntaxique entre Ἰησοῦν Χριστόν et ἐρχόμενον
  choice: que Jésus est le Messie venu dans la chair
  alternative: Jésus-Christ venant dans la chair
  rationale: La formulation choisie rend clairement en français l’objet de la reconnaissance tout en maintenant l’affirmation de l’incarnation réelle. La note signale la formulation grecque plus littérale.
- issue: Aspect de ἐρχόμενον
  choice: venu
  alternative: venant
  rationale: Le participe est morphologiquement présent, mais la formule peut désigner la venue historique dans la chair. Le texte principal privilégie le français idiomatique sans exclure l’autre nuance, donnée en note.
- issue: Sens de σάρξ
  choice: la chair, au sens de l’existence humaine corporelle réelle
  alternative: la nature pécheresse
  rationale: Le contexte christologique parle de l’incarnation véritable, non d’une nature moralement corrompue.
translation_notes:
  register: Français international moderne, digne et accessible. « Séducteurs » garde la coloration polémique sans jargon spécialisé. « Dans la chair » conserve l’expression johannique importante; « venu » assure une lecture française naturelle, avec la formulation littérale documentée en note.
