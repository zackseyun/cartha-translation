id: 2JN.1.5
reference: 2 John 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: fr
  text: 'Et maintenant, je te le demande, Madame[a] : ce n’est pas comme si je t’écrivais un commandement nouveau, mais celui que nous avons depuis le commencement : que nous nous aimions les uns les autres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Madame » peut aussi désigner figurément une Église locale ; d’autres comprennent Kyria comme un nom propre.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: je te le demande
  rationale: Le verbe signifie ici « demander » ou « prier de ». Cette formulation naturelle conserve le ton personnel sans renforcer indûment la demande en exhortation pressante.
- source_word: κυρία
  choice: Madame
  rationale: Vocatif de κυρία, ce terme est une adresse respectueuse à une femme. « Madame » est idiomatique en français moderne et laisse ouverte l’interprétation d’une femme précise, d’une Église personnifiée ou, éventuellement, d’un nom propre.
- source_word: ἐντολὴν καινὴν
  choice: un commandement nouveau
  rationale: Rendu direct qui préserve l’écho du vocabulaire johannique.
- source_word: γράφων σοι
  choice: comme si je t’écrivais
  rationale: La tournure comparative οὐχ ὡς avec le participe est exprimée naturellement en français par « ce n’est pas comme si je t’écrivais ».
- source_word: ἣν εἴχομεν
  choice: celui que nous avons
  rationale: L’imparfait grec, associé à « depuis le commencement », présente une possession qui remonte au passé et demeure actuelle. Le présent français avec « depuis » l’exprime idiomatiquement.
- source_word: ἀπ’ ἀρχῆς
  choice: depuis le commencement
  rationale: Cette expression conserve la formulation johannique traditionnelle et indique ici une continuité depuis l’origine.
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: aimons-nous les uns les autres
  rationale: Le subjonctif après ἵνα précise le contenu du commandement et porte une force exhortative. L’impératif inclusif français restitue naturellement cette nuance.
theological_decisions:
- issue: Référent de κυρία
  choice: Traduire par « Madame » sans identifier explicitement la destinataire.
  alternative: Comprendre le terme comme une désignation figurée de l’Église, ou éventuellement comme le nom propre Kyria.
  rationale: Le grec autorise plusieurs interprétations. Le texte principal conserve donc l’adresse féminine, tandis que la note signale les autres possibilités sans trancher.
- issue: Valeur de ἵνα ἀγαπῶμεν
  choice: Exprimer le contenu du commandement par « aimons-nous les uns les autres ».
  alternative: 'Traduire plus formellement : « que nous nous aimions les uns les autres ».'
  rationale: ἵνα peut introduire ici le contenu du commandement tout en gardant une portée exhortative. L’impératif inclusif est naturel en français et ne réduit pas cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement suit le singulier grec σε et σοι. « Madame » fonctionne comme vocatif respectueux ; la majuscule souligne l’adresse directe sans imposer qu’il s’agisse d’un nom propre.
