  naturalness: « Madame » est une adresse moderne et naturelle dans ce contexte épistolaire. La construction « ce n’est pas comme si… » est idiomatique et rend de façon accessible la comparaison grecque. La formulation finale révisée est plus fluide et moins susceptible d’être lue comme une question.
  terminology: « commandement nouveau », « depuis le commencement » et « nous aimions les uns les autres » sont appropriés et conservent le vocabulaire johannique. La note doit présenter l’alternative concernant κυρία elle-même, plutôt que de paraphraser à tort l’ensemble de la demande.
