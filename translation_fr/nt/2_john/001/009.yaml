id: 2JN.1.9
reference: 2 John 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: fr
  text: Quiconque va plus loin et ne demeure pas dans l’enseignement du Messie n’a pas Dieu[a]. Celui qui demeure dans cet enseignement[b] a, lui, à la fois le Père et le Fils.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prend les devants », « dépasse les limites » ; certains manuscrits portent « transgresse » au lieu de « va plus loin ».
    reason: textual_variant
  - marker: b
    text: L’expression « l’enseignement du Messie » peut désigner soit l’enseignement donné par le Messie, soit l’enseignement au sujet du Messie.
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: Quiconque va plus loin
  rationale: La construction désigne de manière générale toute personne qui agit ainsi. « Va plus loin » conserve l’image d’un mouvement au-delà d’une limite, avec la nuance négative imposée par le contexte, sans adopter la variante « transgresse ».
- source_word: μὴ μένων
  choice: ne demeure pas
  rationale: « Demeurer » restitue le verbe johannique μένω et ses échos dans les écrits de Jean, dans un registre actuel et digne.
- source_word: ἐν τῇ διδαχῇ τοῦ Χριστοῦ
  choice: dans l’enseignement du Messie
  rationale: « Enseignement » est plus accessible que « doctrine ». Le génitif compact « du Messie » préserve la possibilité qu’il s’agisse de l’enseignement donné par le Messie ou de l’enseignement qui le concerne.
- source_word: θεὸν οὐκ ἔχει
  choice: n’a pas Dieu
  rationale: La formulation directe conserve la force abrupte du grec, sans développer l’expression en « n’est pas en communion avec Dieu ».
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: Celui qui demeure dans cet enseignement
  rationale: La reprise de « demeure » maintient le parallélisme. Le démonstratif « cet » renvoie naturellement en français à l’enseignement du Messie déjà mentionné.
- source_word: οὗτος
  choice: lui
  rationale: Le pronom disjoint placé en incise rend l’emphase de οὗτος d’une manière naturelle en français moderne.
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: a, lui, à la fois le Père et le Fils
  rationale: « À la fois… et… » rend la corrélation καὶ…καὶ, tandis que les titres personnels sont conservés.
theological_decisions:
- issue: Sens de προάγων
  choice: va plus loin
  alternative: 'prend les devants ; dépasse les limites ; selon certains manuscrits : transgresse'
  rationale: Le texte SBLGNT porte προάγων, non παραβαίνων. La traduction retient l’idée d’avancer au-delà de l’enseignement reçu sans remplacer le terme par la leçon variante ni expliciter excessivement la condamnation.
- issue: Sens du génitif τοῦ Χριστοῦ
  choice: l’enseignement du Messie
  alternative: l’enseignement donné par le Messie ; l’enseignement au sujet du Messie
  rationale: Le génitif grec peut être subjectif ou objectif. La formulation française conserve cette ambiguïté théologiquement significative.
- issue: Titre Χριστός
  choice: Messie
  alternative: Christ
  rationale: Dans ce contexte, Χριστός fonctionne comme un titre. « Messie » en rend explicitement la valeur, conformément à l’orientation du projet.
- issue: Portée de θεὸν οὐκ ἔχει
  choice: n’a pas Dieu
  alternative: n’est pas en communion avec Dieu
  rationale: Le texte ne précise pas ici la nature de cette relation. La traduction garde donc la formulation johannique sans résoudre sa portée doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. « Demeurer » conserve le vocabulaire caractéristique de Jean. L’incise « lui » marque l’emphase sans produire le calque peu naturel « celui-ci ». Tous les marqueurs de notes figurent dans le texte principal.
