id: 2JN.1.4
reference: 2 John 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: fr
  text: Je me suis beaucoup réjoui de constater que certains de tes enfants[a] marchent dans la vérité[b], conformément au commandement que nous avons reçu du Père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parmi tes enfants ». La tournure grecque désigne une partie d’entre eux, sans nécessairement les inclure tous.'
    reason: lexical_alternative
  - marker: b
    text: Ou « vivent selon la vérité ». Il ne s’agit vraisemblablement pas seulement d’être sincère, mais de vivre en accord avec la vérité révélée.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: Je me suis beaucoup réjoui
  rationale: Le verbe à l’aoriste exprime la réaction de joie de l’auteur, et λίαν l’intensifie. Cette formulation est naturelle en français tout en conservant la force du grec.
- source_word: εὕρηκα
  choice: de constater
  rationale: Le parfait présente une découverte dont le constat demeure pertinent. Dans cette construction française, « constater que » rend naturellement cette idée sans imposer le calque peu idiomatique « trouver que ».
- source_word: ἐκ τῶν τέκνων σου
  choice: certains de tes enfants
  rationale: La construction partitive ἐκ avec le génitif désigne des membres du groupe, sans affirmer que tous sont concernés. « Enfants » demeure inclusif et ne restreint pas le sens aux fils.
- source_word: περιπατοῦντας ἐν ἀληθείᾳ
  choice: marchent dans la vérité
  rationale: « Marcher » conserve la métaphore éthique johannique, tandis que « dans la vérité » maintient la vérité comme cadre et norme de vie plutôt que de réduire l’expression à la seule sincérité.
- source_word: καθὼς ἐντολὴν ἐλάβομεν
  choice: conformément au commandement que nous avons reçu
  rationale: « Conformément à » exprime clairement la correspondance introduite par καθὼς. Le passé composé convient naturellement en français au commandement reçu et toujours en vigueur.
- source_word: παρὰ τοῦ πατρός
  choice: du Père
  rationale: La traduction conserve le titre employé dans le texte grec sans ajouter explicitement « Dieu ».
theological_decisions:
- issue: Référent du « Père »
  choice: Conserver « du Père » sans explicitation
  alternative: de Dieu le Père
  rationale: Le grec dit simplement « du Père ». Le contexte johannique permet d’en reconnaître le référent sans ajouter au texte une désignation absente.
- issue: Étendue de l’expression « tes enfants »
  choice: certains de tes enfants
  alternative: tes enfants
  rationale: La construction partitive ἐκ indique une partie du groupe et ne permet pas d’affirmer explicitement que tous les enfants sont concernés.
- issue: Portée de « dans la vérité »
  choice: Conserver la métaphore « marchent dans la vérité »
  alternative: vivent selon la vérité
  rationale: La formulation retenue préserve à la fois l’image johannique de la marche et la possibilité que « vérité » désigne plus que la sincérité personnelle, sans préciser davantage que le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe évite les calques maladroits tout en conservant la métaphore johannique de la marche, le sens partitif de la construction grecque et le titre « Père » sans expansion interprétative.
