  source_fidelity: 'Le sens de l’ensemble est fidèlement rendu : l’amour se manifeste par une marche conforme aux commandements, puis le texte reprend au singulier « le commandement ». La répétition de « marchions / marchiez » préserve utilement l’image et la cohésion verbale du grec. L’ambiguïté de αὐτῇ entre « le commandement » et « l’amour » doit demeurer signalée.'
  naturalness: « Marcher en lui » n’est pas une tournure française naturelle pour un commandement et peut faire entendre un référent personnel. « Y marcher » rend idiomatiquement la construction tout en laissant la note expliciter l’alternative.
