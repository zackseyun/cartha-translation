id: 2JN.1.6
reference: 2 John 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: fr
  text: 'Et voici en quoi consiste l’amour : que nous marchions selon ses commandements. Voici le commandement[a], comme vous l’avez entendu dès le commencement : que vous y marchiez.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que vous marchiez dans l’amour » ; le pronom « y » peut renvoyer à « l’amour » plutôt qu’au « commandement ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: amour
  rationale: « Amour » est l’équivalent moderne et naturel de ἀγάπη et maintient le lien lexical avec l’usage johannique environnant.
- source_word: αὕτη ἐστὶν ἡ ἀγάπη
  choice: voici en quoi consiste l’amour
  rationale: Cette formulation française exprime naturellement la définition pratique introduite par le grec, sans réduire l’amour à un simple sentiment.
- source_word: ἵνα περιπατῶμεν
  choice: que nous marchions
  rationale: La proposition précise en quoi consiste l’amour. « Marchions » conserve la métaphore éthique johannique plutôt que de l’aplatir en « vivions ».
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: selon ses commandements
  rationale: « Selon » exprime la conformité indiquée par κατά, tandis que le pluriel « commandements » et le possessif non explicité davantage sont préservés.
- source_word: ἐντολάς / ἐντολή
  choice: commandements / commandement
  rationale: Le même radical français maintient le lien lexical ainsi que le passage rhétorique du pluriel au singulier.
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: comme vous l’avez entendu dès le commencement
  rationale: « Dès le commencement » conserve l’idiome johannique, et le passé composé rend naturellement l’aoriste en français contemporain.
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: que vous marchiez en lui
  rationale: Cette traduction conserve à la fois la métaphore de la marche, la préposition et l’ambiguïté du pronom, puisque « amour » et « commandement » sont tous deux masculins en français.
theological_decisions:
- issue: Référent de αὐτῇ dans la dernière proposition
  choice: Le pronom « lui » renvoie probablement au « commandement » mentionné immédiatement auparavant.
  alternative: Le pronom peut renvoyer plus largement à « l’amour » au début du verset.
  rationale: Le nom le plus proche est ἐντολή, mais ἀγάπη est également féminin singulier en grec et convient au contexte. Le texte principal ne tranche donc pas explicitement, et la possibilité concurrente est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « marchions / marchiez » est volontaire afin de conserver l’image éthique répétée du texte grec. « Commencement » préserve la tonalité johannique traditionnelle sans être archaïque.
