  text: βλέπετε ἑαυτούς, ἵνα μὴ ⸀ἀπολέσητε ἃ ⸀εἰργασάμεθα, ἀλλὰ μισθὸν πλήρη ⸀ἀπολάβητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/008.yaml
  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: fr
  text: Veillez sur vous-mêmes, afin que vous ne perdiez pas ce pour quoi nous avons travaillé[a], mais que vous receviez une pleine récompense.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « ce pour quoi vous avez travaillé » au lieu de « ce pour quoi nous avons travaillé ».
    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: Veillez sur vous-mêmes
  rationale: L’impératif présent appelle à une vigilance continue. Cette formulation française naturelle conserve la force de l’avertissement et le pronom réfléchi adressé aux lecteurs.
- source_word: ἵνα μὴ ἀπολέσητε
  choice: afin de ne pas perdre
  rationale: La construction exprime le but ou le résultat que les lecteurs doivent éviter. « Perdre » convient ici à l’idée de laisser échapper le résultat d’un travail.
- source_word: ἃ εἰργασάμεθα
  choice: le fruit de notre travail
  rationale: Le relatif neutre pluriel désigne ce qui résulte du travail accompli. Cette expression idiomatique rend le sens du parfait grec et conserve la première personne du pluriel du texte SBLGNT.
- source_word: μισθὸν πλήρη
  choice: une pleine récompense
  rationale: Dans ce contexte d’exhortation, μισθός désigne naturellement une récompense plutôt qu’un salaire; πλήρη en souligne le caractère entier.
- source_word: ἀπολάβητε
  choice: recevoir
  rationale: Le verbe signifie ici obtenir ou recevoir. Le contexte ne permet pas d’imposer en français la nuance éventuelle de « recevoir en retour ».
theological_decisions:
- issue: Sujet de εἰργασάμεθα
  choice: notre travail
  alternative: votre travail
  rationale: Le texte SBLGNT fourni porte la première personne du pluriel (« nous avons travaillé »), qui attribue le travail aux auteurs ou ouvriers apostoliques. Une variante manuscrite emploie la deuxième personne du pluriel et attribue ce travail aux destinataires; elle est signalée en note sans remplacer le texte retenu.
- issue: Nature de la récompense
  choice: une pleine récompense
  alternative: un plein salaire
  rationale: Le verset ne précise ni la nature ni le moment de la récompense. La traduction conserve donc cette généralité et n’y introduit aucune définition doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. « Veillez sur vous-mêmes » garde le ton direct de l’exhortation; « le fruit de notre travail » évite une tournure lourde tout en exprimant le résultat durable du travail évoqué.
