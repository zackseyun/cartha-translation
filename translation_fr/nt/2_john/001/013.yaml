  text: Ἀσπάζεταί σε τὰ τέκνα τῆς ἀδελφῆς σου τῆς ⸀ἐκλεκτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/013.yaml
  text: The children of your chosen sister greet you.
translation:
  language: fr
  text: Les enfants de ta sœur choisie te saluent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: saluent
  rationale: Rend naturellement la formule épistolaire grecque de salutation; le verbe est au singulier parce que le sujet neutre pluriel peut commander un verbe singulier en grec, mais le français exige ici le pluriel.
- source_word: τὰ τέκνα
  choice: Les enfants
  rationale: Équivalent direct et idiomatique du pluriel τέκνα.
- source_word: τῆς ἀδελφῆς σου
  choice: de ta sœur
  rationale: Conserve la deuxième personne du singulier et la relation familiale explicite du grec.
- source_word: τῆς ἐκλεκτῆς
  choice: choisie
  rationale: Rend ἐκλεκτή dans son sens de personne choisie, sans imposer le terme théologique plus spécialisé « élue ».
theological_decisions:
- issue: Identité de la « sœur choisie » et de ses enfants
  choice: Conserver littéralement l'expression familiale
  alternative: Interpréter explicitement la sœur et ses enfants comme une Église et ses membres
  rationale: Le grec permet une lecture personnelle aussi bien qu'une lecture métaphorique ecclésiale; la traduction ne doit pas trancher une ambiguïté que le texte laisse ouverte.
translation_notes:
  register: Français moderne, simple et digne. Le tutoiement reflète le singulier σε et σου et s'accorde avec l'adresse de la lettre.
