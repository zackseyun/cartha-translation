  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: fr
  text: à cause de la vérité qui demeure[a] en nous et qui sera avec nous pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui reste en nous ».'
    reason: Alternative lexicale possible pour μένω, mettant davantage en avant la continuité de la présence.
lexical_decisions:
- source_word: διὰ
  choice: à cause de
  rationale: Avec l’accusatif, διά exprime ici la cause ou le motif et explique le fondement de l’amour mentionné au verset précédent.
- source_word: ἀλήθειαν
  choice: la vérité
  rationale: Le terme français direct préserve toute la richesse du sens johannique sans préciser abusivement s’il s’agit du message de l’Évangile, de Christ ou de la révélation divine.
- source_word: τὴν μένουσαν
  choice: qui demeure
  rationale: Le participe présent de μένω exprime une présence continue. « Demeure » est naturel dans un registre biblique moderne et conserve la durée ainsi que la résonance johannique du verbe.
- source_word: ἐν ἡμῖν
  choice: en nous
  rationale: Cette formulation rend directement ἐν avec le datif et préserve l’idée d’une présence intérieure, sans exclure la dimension communautaire.
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: et qui sera avec nous
  rationale: La traduction suit simplement μετά avec le génitif et le futur de εἰμί. La reprise de « qui » relie naturellement les deux propositions françaises sans ajouter l’idée de demeurer au second verbe.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression française courante et digne rend clairement l’idée de durée perpétuelle portée par l’idiome grec.
theological_decisions:
- issue: Sens johannique de « vérité »
  choice: Conserver le terme général « la vérité »
  alternative: « la vérité de l’Évangile » ou « le véritable enseignement »
  rationale: Le contexte donne au mot une portée théologique riche, mais le grec ne la limite pas explicitement à l’une de ces interprétations. La formulation retenue préserve cette profondeur et cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. « Demeure » reste intelligible dans l’usage actuel tout en conservant l’écho caractéristique du vocabulaire johannique.
