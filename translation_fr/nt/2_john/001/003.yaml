source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: fr
  text: La grâce, la miséricorde et la paix seront avec nous, venant de Dieu le Père et de Jésus le Messie[a], le Fils du Père, dans la vérité et l’amour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus le Christ ». Le titre grec Χριστός signifie « Messie » ; « Christ » en est la forme traditionnelle.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσται
  choice: seront
  rationale: Le futur de l’indicatif exprime une affirmation plutôt qu’un souhait. Le pluriel est requis en français puisque « la grâce, la miséricorde et la paix » forment un sujet composé.
- source_word: μεθ’ ἡμῶν
  choice: avec nous
  rationale: μετά avec le génitif signifie normalement « avec »; cette formulation convient à la bénédiction épistolaire.
- source_word: χάρις ἔλεος εἰρήνη
  choice: la grâce, la miséricorde et la paix
  rationale: Ces trois noms sont les sujets de ἔσται. La suite traditionnelle demeure claire, naturelle et proche du grec.
- source_word: παρὰ θεοῦ πατρός
  choice: venant de Dieu le Père
  rationale: παρά avec le génitif indique ici la source. « Venant de » permet de rattacher naturellement en français cette provenance aux trois bienfaits annoncés, sans ajouter le possessif « notre », absent du grec.
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: et de Jésus le Messie
  rationale: La seconde occurrence de παρά partage la construction exprimant la source. Χριστός est rendu comme un titre, « le Messie », plutôt que seulement translittéré.
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: le Fils du Père
  rationale: Cette apposition française conserve explicitement l’identification relationnelle de Jésus comme Fils du Père.
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: dans la vérité et l’amour
  rationale: La préposition ἐν est rendue directement par « dans ». L’expression conserve les deux réalités qualitatives sans expliciter davantage leur rapport au reste de la phrase.
theological_decisions:
- issue: Traduction de Χριστοῦ
  choice: le Messie
  alternative: le Christ
  rationale: Χριστός fonctionne ici comme un titre appliqué à Jésus. « Le Messie » en transmet le sens, tandis que « le Christ » reste une traduction traditionnelle possible.
- issue: Rapport entre « le Fils du Père » et Jésus
  choice: Apposition identifiant Jésus le Messie comme le Fils du Père
  alternative: Formule descriptive rattachée plus librement à Jésus Christ
  rationale: La construction grecque rattache le plus naturellement τοῦ υἱοῦ τοῦ πατρός à Ἰησοῦ Χριστοῦ en apposition. La traduction garde cette identification explicite sans ajouter de formulation doctrinale.
- issue: Valeur de ἔσται dans la bénédiction
  choice: 'Affirmation au futur : « seront »'
  alternative: 'Souhait ou bénédiction : « soient »'
  rationale: La forme grecque est un futur de l’indicatif, non un optatif ni un impératif; la traduction préserve donc la force déclarative, malgré le contexte de bénédiction.
translation_notes:
  register: Français international moderne, digne et accessible. « Venant de » évite une répétition lourde de « de la part de » tout en conservant l’idée de source exprimée deux fois en grec. La formulation garde le futur affirmatif et l’expression finale « dans la vérité et l’amour » sans en préciser excessivement la fonction.
