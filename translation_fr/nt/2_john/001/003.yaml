    issue: La note b donne « le Fils qui vient du Père » comme alternative.
    rationale: Le grec τοῦ υἱοῦ τοῦ πατρός signifie directement « le Fils du Père » / « le Fils appartenant au Père ». La paraphrase proposée introduit l’idée de venue ou d’origine, qui n’est pas exprimée par le génitif et peut orienter indûment l’interprétation.
  - severity: low
    issue: La note a décrit « Christ » comme une « forme traditionnellement transcrite ».
    rationale: Cette caractérisation est imprécise en français. « Christ » est la forme traditionnelle reçue pour ce titre ; il est préférable de ne pas la présenter comme une transcription stricte du grec.
