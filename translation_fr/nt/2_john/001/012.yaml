source:
  edition: SBLGNT
  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: fr
  text: Bien que j’aie beaucoup de choses à vous écrire, je n’ai pas voulu le faire avec du papier et de l’encre. J’espère plutôt venir auprès de vous et vous parler de vive voix, afin que votre joie[a] soit complète.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « notre joie » au lieu de « votre joie ».
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: Bien que j’aie beaucoup de choses à vous écrire
  rationale: Le participe circonstanciel est compris dans un sens concessif. Cette formulation naturelle conserve l’idée plurielle de Πολλά et le destinataire marqué par ὑμῖν.
- source_word: οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος
  choice: je n’ai pas voulu le faire avec du papier et de l’encre
  rationale: βούλομαι exprime ici la volonté; διά avec le génitif indique le moyen. « Avec du papier et de l’encre » est idiomatique en français moderne sans surinterpréter χάρτου comme désignant nécessairement un matériau précis.
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: J’espère plutôt venir auprès de vous
  rationale: γενέσθαι πρὸς ὑμᾶς exprime le fait de se rendre présent auprès des destinataires. « Plutôt » marque naturellement le contraste introduit par ἀλλά.
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: vous parler de vive voix
  rationale: L’expression littérale « bouche à bouche » désigne une conversation directe, mais aurait en français moderne des connotations trompeuses. « De vive voix » restitue clairement l’opposition à la communication écrite.
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: afin que votre joie soit complète
  rationale: « Afin que » conserve la valeur finale de ἵνα. La périphrase formée du participe parfait et du subjonctif exprime un état de plénitude atteint; « soit complète » le rend avec naturel.
theological_decisions:
- issue: Variante du pronom indiquant à qui appartient la joie
  choice: votre joie
  alternative: notre joie
  rationale: Le texte de base SBLGNT porte ὑμῶν (« votre »). La variante ἡμῶν (« notre »), interprétativement significative, est signalée en note plutôt qu’écartée silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. « De vive voix » communique une rencontre personnelle sans le contresens possible de la traduction littérale « bouche à bouche ». Le tutoiement pluriel ou de politesse n’étant pas distingué en grec, « vous » demeure volontairement non spécifié.
