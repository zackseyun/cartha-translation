id: REV.17.14
reference: Revelation 17:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: fr
  text: Ceux-ci feront la guerre à l’Agneau[a], et l’Agneau les vaincra, parce qu’il est Seigneur des seigneurs et Roi des rois, et ceux qui sont avec lui sont appelés, choisis et fidèles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement en grec : « ils feront la guerre avec l’Agneau » ; dans ce contexte, cette tournure signifie qu’ils lui feront la guerre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Ceux-ci
  rationale: Le démonstratif renvoie aux rois mentionnés dans le contexte précédent et conserve mieux la valeur déictique du grec qu’un simple « ils ».
- source_word: μετὰ τοῦ ἀρνίου
  choice: à l’Agneau
  rationale: Avec πολεμέω dans ce contexte, μετά suivi du génitif désigne l’adversaire combattu. En français, « faire la guerre à » exprime naturellement ce sens, tandis que « avec l’Agneau » suggérerait à tort une alliance.
- source_word: ἀρνίον
  choice: Agneau
  rationale: « Agneau » est le titre christologique caractéristique de l’Apocalypse. La majuscule signale ici son emploi comme titre sans ajouter de contenu doctrinal.
- source_word: πολεμήσουσιν
  choice: feront la guerre
  rationale: Cette expression garde la portée militaire et le registre solennel du verbe, mieux que le terme plus général « combattront ».
- source_word: νικήσει
  choice: vaincra
  rationale: « Vaincre » rend directement le motif récurrent de νικάω dans l’Apocalypse et convient au contexte guerrier.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit la raison de la victoire de l’Agneau; « parce que » en rend clairement la valeur causale.
- source_word: κύριος κυρίων
  choice: Seigneur des seigneurs
  rationale: Cette formule superlative exprime la souveraineté suprême de l’Agneau et reprend une tournure biblique consacrée en français.
- source_word: βασιλεὺς βασιλέων
  choice: Roi des rois
  rationale: Cette formule parallèle exprime l’autorité royale suprême; la majuscule convient à son emploi titulaire.
- source_word: οἱ μετ’ αὐτοῦ
  choice: ceux qui sont avec lui
  rationale: Rend naturellement en français l’article substantivé suivi du groupe prépositionnel, sans préciser davantage l’identité de ces compagnons.
- source_word: κλητοὶ
  choice: appelés
  rationale: « Appelés » conserve la portée lexicale et théologique du terme sans trancher entre invitation et appel efficace.
- source_word: ἐκλεκτοὶ
  choice: choisis
  rationale: « Choisis » est courant et accessible, tout en évitant les connotations systématiques que peut porter « élus » dans certains contextes doctrinaux.
- source_word: πιστοί
  choice: fidèles
  rationale: Dans cette série, « fidèles » exprime à la fois la foi, la loyauté et la constance sans réduire le terme au seul fait de croire.
theological_decisions:
- issue: Le titre de l’Agneau et le langage de sa victoire
  choice: Employer « l’Agneau » et « vaincra » afin de préserver le vocabulaire christologique et thématique propre à l’Apocalypse.
  alternative: « l’agneau … triomphera d’eux »
  rationale: Le texte présente Jésus sous le titre distinctif ἀρνίον et emploie νικάω, motif récurrent du livre. Ces choix maintiennent cette cohérence interne sans explicitation doctrinale ajoutée.
- issue: La série κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί
  choice: Traduire « appelés, choisis et fidèles » sans définir un ordre du salut ni un système doctrinal.
  alternative: « appelés, élus et loyaux »
  rationale: Le grec qualifie ceux qui sont avec l’Agneau par trois termes coordonnés. La traduction conserve ces trois qualifications et leur tension théologique sans les intégrer à un cadre confessionnel particulier.
- issue: La relation syntaxique de la dernière proposition
  choice: Rendre « ceux qui sont avec lui sont appelés, choisis et fidèles ».
  alternative: « et avec lui, les appelés, les choisis et les fidèles »
  rationale: Le grec présente un groupe nominal coordonné sans verbe exprimé dans la dernière proposition. La formulation française fournit la copule nécessaire à une phrase naturelle, tout en évitant d’ajouter explicitement que ces compagnons vaincront eux aussi.
translation_notes:
  register: Français international moderne, clair et digne, avec un registre légèrement solennel adapté à la scène apocalyptique. Les coordinations répétées du grec sont largement conservées, notamment dans « appelés, choisis et fidèles ».
