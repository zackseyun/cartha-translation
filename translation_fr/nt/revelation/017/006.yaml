id: REV.17.6
reference: Revelation 17:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: fr
  text: Et je vis la femme ivre du sang des saints et du sang des témoins de Jésus[a]. En la voyant, je fus saisi d’un profond étonnement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «des martyrs de Jésus». Le mot grec peut désigner des «témoins» ou des «martyrs»; la mention de leur sang rend ici le sens de «martyrs» particulièrement approprié.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν ἐκ τοῦ αἵματος
  choice: ivre du sang
  rationale: Cette tournure française naturelle conserve l’image violente d’une ivresse produite par le sang versé; «du sang» rend idiomatiquement ἐκ avec μεθύω.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: Dans l’Apocalypse, le terme désigne couramment le peuple consacré à Dieu. «Les saints» est concis, digne et bien établi en français biblique.
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: des témoins de Jésus
  rationale: μάρτυς signifie fondamentalement «témoin», tandis que la mention de leur sang fait clairement entendre ici qu’ils ont été mis à mort. Le génitif «de Jésus» demeure compact et conserve ses nuances possibles.
- source_word: ἐθαύμασα ... θαῦμα μέγα
  choice: je fus saisi d’un profond étonnement
  rationale: Le complément de même racine intensifie le verbe. Cette formulation française exprime naturellement la force de la construction grecque sans suggérer nécessairement de l’admiration.
- source_word: ἰδὼν αὐτήν
  choice: En la voyant
  rationale: Le participe aoriste est rendu par une proposition participiale naturelle qui conserve son lien étroit avec la réaction de Jean.
theological_decisions:
- issue: Sens de μάρτυρες dans un contexte de persécution apocalyptique
  choice: témoins de Jésus
  alternative: martyrs de Jésus
  rationale: «Témoins» préserve le sens lexical central et le thème du témoignage dans l’Apocalypse. Puisqu’il est question de leur sang, le sens contextuel de «martyrs» est également présent et signalé en note, sans imposer une seule nuance.
- issue: Nature de l’étonnement de Jean
  choice: profond étonnement
  alternative: grande admiration
  rationale: θαυμάζω décrit ici une vive stupeur ou un grand étonnement; «admiration» risquerait d’attribuer à Jean une approbation de la femme que le grec n’exige pas.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde l’image saisissante de l’ivresse de sang ainsi que l’ambiguïté contextuellement féconde entre témoignage et martyre.
