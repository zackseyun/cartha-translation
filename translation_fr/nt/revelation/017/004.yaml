  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: fr
  text: La femme était vêtue de pourpre et d’écarlate, parée d’or, de pierres précieuses et de perles. Elle tenait à la main une coupe d’or remplie d’abominations et des impuretés de son immoralité sexuelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « prostitution » ou « inconduite sexuelle ». Dans l’Apocalypse, le terme grec peut désigner une conduite sexuelle immorale et, au sens figuré, l’infidélité idolâtre.
    reason: Alternative lexicale et préservation de la double portée littérale et métaphorique de πορνεία.
lexical_decisions:
- source_word: περιβεβλημένη
  choice: était vêtue
  rationale: Avec ἦν, le participe parfait décrit l’état résultant de la femme; « était vêtue » conserve cette valeur de manière naturelle et digne.
- source_word: πορφυροῦν καὶ κόκκινον
  choice: de pourpre et d’écarlate
  rationale: Ces termes précis évoquent des couleurs et étoffes luxueuses; la formulation française laisse implicite le vêtement, comme le grec.
- source_word: κεχρυσωμένη
  choice: parée
  rationale: Le participe indique une ornementation somptueuse; « parée » est naturel en français et s’applique à l’or, aux pierres et aux perles qui suivent.
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: d’or, de pierres précieuses et de perles
  rationale: « Or » laisse ouverte la forme exacte des ornements. Le singulier collectif λίθῳ τιμίῳ est rendu idiomatiquement par le pluriel générique « pierres précieuses ».
- source_word: ποτήριον χρυσοῦν
  choice: une coupe d’or
  rationale: Formulation française courante qui reproduit sans surcharge l’image du récipient en or.
- source_word: γέμον
  choice: remplie de
  rationale: Rend clairement le participe présent décrivant le contenu de la coupe.
- source_word: βδελυγμάτων
  choice: abominations
  rationale: Conserve la forte portée cultuelle et morale du terme dans le langage biblique et apocalyptique.
- source_word: τὰ ἀκάθαρτα
  choice: les impuretés
  rationale: Le substantif neutre pluriel désigne ce qui est impur; « impuretés » garde les dimensions morale et cultuelle tout en restant idiomatique.
- source_word: πορνείας
  choice: débauche sexuelle
  rationale: Expression moderne assez large pour évoquer l’inconduite sexuelle sans réduire d’emblée l’image à la prostitution commerciale; une note signale la portée métaphorique possible.
theological_decisions:
- issue: Portée de πορνεία dans le portrait apocalyptique de la femme
  choice: débauche sexuelle
  alternative: prostitution; inconduite sexuelle
  rationale: Dans l’Apocalypse, le terme peut associer conduite sexuelle littérale et infidélité idolâtre métaphorique. Le texte garde l’image sexuelle et la note en préserve la double portée sans imposer une seule interprétation.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La phrase est divisée en deux pour une lecture fluide, sans modifier les rapports syntaxiques ni l’imagerie du texte grec.
