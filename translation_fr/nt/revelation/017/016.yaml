id: REV.17.16
reference: Revelation 17:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: fr
  text: Les dix cornes que tu as vues et la bête, eux, haïront la prostituée. Ils la dévasteront et la mettront à nu[a], ils mangeront sa chair[b] et la brûleront entièrement par le feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « nue » ; l’expression évoque ici le dépouillement, l’exposition publique et l’humiliation.
    reason: lexical_alternative
  - marker: b
    text: Le mot « chair » est littéral. Dans l’imagerie apocalyptique de l’Apocalypse, cette expression représente une destruction totale et violente.
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: cornes
  rationale: Conserve le symbole apocalyptique employé par le grec plutôt que de le remplacer par son interprétation (« rois » ou « puissances »).
- source_word: θηρίον
  choice: bête
  rationale: Équivalent français courant dans le langage apocalyptique, qui préserve la force symbolique et menaçante du terme.
- source_word: πόρνην
  choice: prostituée
  rationale: Terme moderne, clair et lexicalement exact, sans archaïsme ni surenchère péjorative.
- source_word: μισήσουσι
  choice: haïront
  rationale: Rend directement le futur de μισέω et convient à la suite d'actes violents.
- source_word: ἠρημωμένην ποιήσουσιν
  choice: la dévasteront
  rationale: 'Exprime naturellement en français le résultat causatif de la construction : la rendre dévastée ou désolée.'
- source_word: γυμνήν
  choice: la mettront à nu
  rationale: Rend l'adjectif « nue » dans une formulation française naturelle qui fait entendre l'exposition et l'humiliation publiques.
- source_word: σάρκας
  choice: chair
  rationale: Conserve l'image corporelle explicite et violente du grec, sans l'atténuer en « corps ».
- source_word: φάγονται
  choice: mangeront
  rationale: Traduit directement ἐσθίω, tout en maintenant la brutalité de l'image apocalyptique.
- source_word: κατακαύσουσιν ἐν πυρί
  choice: la brûleront entièrement par le feu
  rationale: « Entièrement » restitue la valeur intensive de κατακαίω, tandis que « par le feu » conserve explicitement ἐν πυρί.
- source_word: οὗτοι
  choice: celles-ci
  rationale: Maintient la reprise démonstrative emphatique du grec. Le féminin pluriel français s'accorde naturellement avec les « cornes », sujet collectif principal, malgré l'ajout singulier de « la bête ».
theological_decisions:
- issue: Référent et accord du groupe « les dix cornes… et la bête » avec les verbes au pluriel
  choice: 'Conserver le sujet collectif et sa reprise démonstrative emphatique : « Les dix cornes…, ainsi que la bête, celles-ci… »'
  alternative: Lisser en « Les dix cornes que tu as vues et la bête haïront… » ou comprendre la bête comme une apposition aux cornes.
  rationale: Le grec présente une construction mêlée, reprise par οὗτοι et des verbes pluriels. La formulation retenue préserve autant que possible cette emphase tout en restant intelligible en français.
- issue: Nature des images décrivant la destruction de la prostituée
  choice: Préserver sans l'adoucir la métaphore apocalyptique de sa dévastation, de sa nudité, de sa chair mangée et de sa destruction par le feu.
  alternative: Identifier directement la prostituée à une ville ou à un système dans le corps du verset.
  rationale: Le texte donne lui-même une représentation symbolique du jugement; la traduction ne doit pas imposer dans le verset une interprétation de ce symbole.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination « ainsi que » et la reprise « celles-ci » conservent l'étrangeté emphatique de la syntaxe grecque sans rendre la phrase obscure. Les images violentes et symboliques sont maintenues sans euphémisme.
