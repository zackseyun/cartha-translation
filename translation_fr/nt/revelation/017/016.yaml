revisions:
- from: Les dix cornes que tu as vues, ainsi que la bête, celles-ci haïront la prostituée. Elles la dévasteront et la mettront à nu[a], elles mangeront sa chair[b] et la brûleront entièrement par le feu.
  to: Les dix cornes que tu as vues et la bête, eux, haïront la prostituée. Ils la dévasteront et la mettront à nu[a], ils mangeront sa chair[b] et la brûleront entièrement par le feu.
  rationale: La seule modification nécessaire remplace la reprise féminine « celles-ci » par « eux », puis emploie « ils » dans la phrase suivante. Cette correction permet au français de représenter correctement le sujet conjoint « les dix cornes … et la bête », sans lisser l’emphase résomptive du grec ni modifier l’imagerie ou le sens du verset. Les deux appels de note restent correctement ancrés sur « à nu » et « chair ».
