  naturalness: La formulation est globalement claire et de registre moderne. Toutefois, « celles-ci » reprend grammaticalement les seules cornes (féminin pluriel) et risque d’exclure « la bête » du sujet conjoint. Une reprise masculine plurielle « eux » est l’accord usuel pour ce groupe mixte et maintient l’emphase du démonstratif grec.
  terminology: « Cornes », « bête », « prostituée », « chair » et « mettre à nu » sont des choix exacts, naturels et adaptés au registre apocalyptique. « Brûleront entièrement par le feu » restitue de façon acceptable l’intensif de κατακαύσουσιν et l’instrument ἐν πυρί.
