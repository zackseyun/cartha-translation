source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: fr
  text: Et la bête qui était et qui n’est pas est elle-même un huitième[a], elle vient des sept[b] et elle va à la destruction.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « elle est elle-même un huitième roi » ; le nom « roi » est sous-entendu d’après le contexte, mais il ne figure pas dans le grec.
    reason: alternative_reading
  - marker: b
    text: Ou « elle est l’un des sept ». Le grec dit « des sept », ce qui peut indiquer l’origine, l’appartenance ou un lien étroit.
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: bête
  rationale: Dans l’Apocalypse, « bête » est le terme apocalyptique consacré pour cette puissance monstrueuse opposée à Dieu; il conserve la force symbolique et les échos intertextuels.
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: qui était et qui n’est pas
  rationale: Cette formulation garde le parallélisme abrupt du grec et l’écho de la formule récurrente du chapitre, sans préciser davantage la nuance temporelle.
- source_word: αὐτὸς
  choice: elle-même
  rationale: Le pronom grec est emphatique. En français, le féminin s’accorde naturellement avec « la bête » et rend cette insistance.
- source_word: ὄγδοός
  choice: un huitième
  rationale: L’adjectif ordinal n’est accompagné d’aucun nom dans le grec. La traduction ne supplée donc pas « roi », tout en laissant le contexte éclairer la catégorie sous-entendue.
- source_word: ἐκ τῶν ἑπτά
  choice: elle vient des sept
  rationale: Cette tournure française exprime l’origine ou la relation marquée par ἐκ sans imposer l’interprétation plus précise « elle est l’un des sept ».
- source_word: εἰς ἀπώλειαν
  choice: à la destruction
  rationale: « Destruction » rend clairement la ruine finale et eschatologique indiquée ici, sans employer le terme plus archaïque « perdition ».
- source_word: ὑπάγει
  choice: elle va
  rationale: Le présent simple conserve la vivacité du grec et son mouvement vers la destruction.
theological_decisions:
- issue: Faut-il expliciter le nom sous-entendu après « un huitième »?
  choice: Conserver « un huitième » sans ajouter « roi » dans le texte principal.
  alternative: « un huitième roi »
  rationale: Le contexte immédiat parle de rois, mais βασιλεύς n’apparaît pas dans ce verset. Ne pas le suppléer préserve la concision et l’ambiguïté symbolique du texte grec.
- issue: Faut-il comprendre ἐκ τῶν ἑπτά comme une appartenance précise?
  choice: Traduire par « elle vient des sept ».
  alternative: « elle est l’un des sept »
  rationale: La préposition peut exprimer l’origine, l’appartenance ou un lien étroit. La formulation retenue ne tranche pas une question que le grec laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « Quant à » clarifie la reprise du sujet; les formulations volontairement abruptes « qui était et qui n’est pas » et « un huitième » préservent la tension du grec.
