id: REV.17.17
reference: Revelation 17:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: fr
  text: Car Dieu a mis dans leur cœur d’accomplir son dessein, d’agir dans une même intention et de donner leur royaume à la bête, jusqu’à ce que les paroles de Dieu s’accomplissent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: a mis dans leur cœur
  rationale: Cette tournure française naturelle conserve la métaphore du cœur et exprime l’action intérieure de Dieu sans la réduire à une simple permission.
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: d’accomplir son dessein
  rationale: Ici, γνώμη désigne l’intention arrêtée de Dieu. « Dessein » convient au registre prophétique, tandis qu’« accomplir » rend la mise à exécution exprimée par ποιῆσαι.
- source_word: ποιῆσαι μίαν γνώμην
  choice: d’agir dans une même intention
  rationale: La formulation rend l’expression grecque condensée, littéralement « faire une seule intention », en préservant à la fois l’unité de visée et sa dimension active.
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: de donner leur royaume
  rationale: La traduction garde le singulier grec « royaume » avec le possesseur pluriel et maintient le parallélisme des infinitifs.
- source_word: τῷ θηρίῳ
  choice: à la bête
  rationale: « Bête » préserve l’image constante de l’Apocalypse et ses correspondances internes.
- source_word: ἄχρι τελεσθήσονται οἱ λόγοι τοῦ θεοῦ
  choice: jusqu’à ce que les paroles de Dieu s’accomplissent
  rationale: « S’accomplissent » exprime l’achèvement et la réalisation des déclarations prophétiques, sans surinterpréter leur forme.
theological_decisions:
- issue: Souveraineté divine et action humaine dans la conduite des rois
  choice: Affirmer que Dieu met ce dessein dans leur cœur tout en présentant les rois comme ceux qui agissent et donnent leur royaume.
  alternative: Atténuer l’action divine par « permettre », ou renforcer le texte par une paraphrase déterministe.
  rationale: Le grec juxtapose sans les résoudre l’action causative de Dieu et les actes réels des dirigeants. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la structure causale introduite par « Car », le parallélisme des actions et le vocabulaire apocalyptique traditionnel sans archaïsme.
