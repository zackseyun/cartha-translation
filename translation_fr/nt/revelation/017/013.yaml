source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: fr
  text: Ils sont d’un même avis[a] et donnent leur puissance et leur autorité à la bête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ont un même dessein ». Litt. : « ils ont une même pensée » ; l’expression peut désigner un avis, une résolution ou un dessein commun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: Ils
  rationale: Le pronom reprend naturellement en français les dix rois mentionnés au verset précédent, sans alourdir la phrase par « ceux-ci ».
- source_word: μίαν γνώμην ἔχουσιν
  choice: ont une même pensée
  rationale: Cette formulation conserve au plus près l’image grecque d’une pensée commune, tout en laissant ouvertes les nuances d’avis, de résolution et de dessein partagés.
- source_word: δύναμιν
  choice: puissance
  rationale: Dans ce contexte politique et apocalyptique, « puissance » désigne la capacité effective d’agir et reste distincte de l’autorité.
- source_word: ἐξουσίαν
  choice: autorité
  rationale: « Autorité » exprime la prérogative ou le pouvoir de gouverner, distinct de la puissance effective désignée par δύναμις.
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: leur puissance et leur autorité
  rationale: La construction française naturelle ne répète le possessif qu’une fois, tout en maintenant les deux notions grecques distinctes.
- source_word: τῷ θηρίῳ
  choice: à la bête
  rationale: « La bête » est la désignation apocalyptique établie de θηρίον dans l’Apocalypse; l’article défini est conservé.
- source_word: διδόασιν
  choice: donnent
  rationale: Le présent français reflète directement le présent grec dans la scène visionnaire, sans préciser indûment la nature du transfert.
theological_decisions:
- issue: Sens de l’expression μίαν γνώμην ἔχουσιν dans le contexte politico-apocalyptique
  choice: ont une même pensée
  alternative: ont un même dessein
  rationale: Le grec peut évoquer une opinion, une résolution ou un dessein commun. Le texte principal préserve l’image et l’amplitude sémantique de l’expression; la note indique une autre traduction contextuellement plausible.
- issue: Distinction entre δύναμις et ἐξουσία
  choice: puissance et autorité
  alternative: force et pouvoir
  rationale: Le maintien de deux termes distincts préserve la différence entre capacité effective et prérogative de gouverner, sans réduire les deux notions à un seul concept.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est concise et naturelle; « une même pensée » conserve l’idiome grec sans paraître archaïque, tandis que la note en explicite la portée possible.
