  rationale: 'La révision ne change pas le contenu de la vision, mais préserve dans le texte français l’ambiguïté de ἐν πνεύματι. La note conserve l’interprétation selon laquelle l’Esprit est l’agent du transport. La phrase explicite sur la bête reste justifiée : les deux participes grecs γέμοντα et ἔχων décrivent θηρίον, non la femme.'
