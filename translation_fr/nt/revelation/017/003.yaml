id: REV.17.3
reference: Revelation 17:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: fr
  text: Il m’emporta, en esprit[a], dans un lieu désert. Et je vis une femme assise sur une bête écarlate. La bête était pleine de noms blasphématoires et avait sept têtes et dix cornes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par l’Esprit ». L’expression grecque peut désigner un état spirituel ou le fait d’être transporté par l’Esprit ; dans l’Apocalypse, elle introduit souvent une expérience visionnaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: transporta
  rationale: Le verbe décrit ici le déplacement de Jean dans le cadre d’une vision. « Transporta » exprime naturellement ce mouvement sans préciser indûment s’il est corporel ou seulement visionnaire.
- source_word: εἰς ἔρημον
  choice: dans un lieu désert
  rationale: Ἔρημος peut désigner un désert, une étendue sauvage ou un lieu inhabité. « Un lieu désert » conserve le caractère indéfini et évite de limiter l’image à un désert de sable.
- source_word: ἐν πνεύματι
  choice: par l’Esprit
  rationale: Dans l’Apocalypse, cette expression introduit couramment une expérience visionnaire sous l’action de l’Esprit. La variante « en esprit » reste possible et figure en note.
- source_word: γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον
  choice: une femme assise sur une bête écarlate
  rationale: La formulation restitue directement la scène. « Bête » est le terme apocalyptique usuel pour θηρίον, et « écarlate » rend la teinte vive de κόκκινος.
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: Cette bête était pleine de noms blasphématoires
  rationale: Γέμω signifie « être plein de ». Une nouvelle phrase nommant explicitement la bête évite qu’en français l’adjectif féminin soit compris comme décrivant la femme.
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: avait sept têtes et dix cornes
  rationale: Cette tournure française naturelle conserve sans les interpréter les éléments de l’imagerie apocalyptique.
theological_decisions:
- issue: Sens de ἐν πνεύματι
  choice: par l’Esprit
  alternative: en esprit
  rationale: Le contexte et l’emploi récurrent de la formule dans l’Apocalypse favorisent l’action de l’Esprit lors de l’expérience prophétique. Comme le grec ne distingue pas les majuscules et que l’expression peut aussi désigner un état spirituel, l’autre lecture est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition explicite de « Cette bête » privilégie la clarté référentielle et évite une ambiguïté grammaticale propre au français, sans ajouter d’interprétation symbolique.
