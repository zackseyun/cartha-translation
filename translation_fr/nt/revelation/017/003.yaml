  verdict: revise
  source_fidelity: 'La scène et ses éléments essentiels sont correctement rendus : transport, lieu désert, femme, bête écarlate, noms blasphématoires, sept têtes et dix cornes. Toutefois, « par l’Esprit » tranche une ambiguïté de ἐν πνεύματι que le grec ne résout pas explicitement. La traduction principale doit conserver cette ouverture.'
  naturalness: Le français est globalement clair et naturel. « Il m’emporta, en esprit, dans un lieu désert » est idiomatique, conserve l’ordre logique de l’expérience visionnaire et ne présume pas de l’agent du transport. La reprise par « La bête » évite à juste titre toute ambiguïté avec « la femme ».
  terminology: « bête », « écarlate », « noms blasphématoires », « têtes » et « cornes » sont des choix justes et cohérents avec le vocabulaire apocalyptique. « En esprit » en texte, avec « par l’Esprit » en variante, traite prudemment la capitalisation et la portée théologique de πνεύματι.
  issues:
