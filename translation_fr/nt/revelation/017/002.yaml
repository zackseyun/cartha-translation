reference: Revelation 17:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: fr
  text: avec laquelle les rois de la terre se sont prostitués[a], et ceux qui habitent sur la terre se sont enivrés du vin de sa prostitution.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, l’image de la prostitution évoque probablement, de manière symbolique, des alliances corrompues, idolâtres ou infidèles, tout en gardant la force de la métaphore sexuelle.
    reason: cultural_note
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: avec qui
  rationale: Le pronom relatif renvoie à la femme du verset précédent. « Avec qui » conserve explicitement la construction relative grecque.
- source_word: ἐπόρνευσαν
  choice: se sont livrés à l’immoralité sexuelle
  rationale: Cette formulation garde la force de l’image sexuelle tout en permettant sa portée symbolique dans l’Apocalypse, sans la réduire d’emblée à l’idolâtrie ou à une alliance politique.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: les rois de la terre
  rationale: Cette traduction conserve l’expression apocalyptique récurrente et le sens mondial probable de γῆ.
- source_word: ἐμεθύσθησαν
  choice: se sont enivrés
  rationale: Le verbe français exprime naturellement l’entrée dans l’état d’ivresse indiquée par l’aoriste passif grec, sans imposer un agent extérieur explicite.
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: ceux qui habitent sur la terre
  rationale: La forme verbale est conservée, ainsi que l’expression récurrente de l’Apocalypse.
- source_word: ἐκ τοῦ οἴνου
  choice: du vin
  rationale: Dans « se sont enivrés du vin », la préposition française exprime naturellement la source ou la cause de l’ivresse.
- source_word: τῆς πορνείας αὐτῆς
  choice: de son immoralité sexuelle
  rationale: Le choix reprend le champ lexical du verbe apparenté et préserve à la fois l’image sexuelle et sa portée symbolique plus large.
theological_decisions:
- issue: Faut-il expliciter πορνεύω/πορνεία comme idolâtrie ou comme infidélité politico-religieuse ?
  choice: Conserver dans le texte l’image de l’immoralité sexuelle sans paraphrase interprétative.
  alternative: Traduire par « infidélité spirituelle » ou expliciter une alliance idolâtre.
  rationale: L’Apocalypse exploite intentionnellement une métaphore sexuelle pouvant évoquer plusieurs formes de corruption et d’infidélité. La conserver respecte cette tension théologique et symbolique.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec sans devenir artificielle. « Ceux qui habitent sur la terre » maintient une formule caractéristique de l’Apocalypse, tandis que « se sont enivrés du vin » est idiomatique en français.
