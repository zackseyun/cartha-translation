id: REV.17.1
reference: Revelation 17:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: fr
  text: 'Puis l’un des sept anges qui tenaient les sept coupes vint me parler : « Viens, je te montrerai le jugement[a] de la grande prostituée, celle qui est assise sur de nombreuses eaux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la condamnation » ou « le châtiment ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Puis
  rationale: Marque naturellement la progression du récit tout en conservant la valeur connective.
- source_word: ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: l’un des sept anges vint
  rationale: Rend directement l’aoriste narratif et la construction partitive dans un français naturel et soutenu.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: qui tenaient les sept coupes
  rationale: Identifie le groupe d’anges visé; « coupes » est le terme naturel et consacré pour les φιάλαι de l’Apocalypse, et « tenaient » restitue concrètement le participe.
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: me parler et dit
  rationale: Expression française idiomatique qui rend l’adresse faite à Jean sans reproduire lourdement le doublet grec « parla… disant ».
- source_word: Δεῦρο
  choice: Viens
  rationale: Rend clairement et sobrement l’invitation ou la convocation.
- source_word: δείξω σοι
  choice: je te montrerai
  rationale: Conserve directement la valeur du futur grec.
- source_word: τὸ κρίμα
  choice: le jugement
  rationale: Terme assez large pour englober la décision judiciaire, la condamnation et sa mise à exécution sans choisir prématurément entre ces nuances.
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: de la grande prostituée
  rationale: « Prostituée » est actuel, précis et digne, tout en préservant la vigueur de la métaphore prophétique sans archaïsme.
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: celle qui est assise sur de nombreuses eaux
  rationale: Conserve l’image symbolique de la position sur les eaux, sans l’interpréter avant l’explication donnée plus loin dans le chapitre.
theological_decisions:
- issue: Portée de κρίμα dans le contexte apocalyptique
  choice: jugement
  alternative: condamnation; châtiment
  rationale: Le grec peut viser la sentence judiciaire ou son résultat punitif. « Jugement » maintient cette amplitude et laisse le contexte préciser la nature de l’action divine.
- issue: Désignation métaphorique πόρνη
  choice: grande prostituée
  alternative: grande courtisane; grande femme prostituée
  rationale: La traduction conserve la métaphore sexuelle et polémique des traditions prophétiques sans identifier de manière confessionnelle la réalité symbolisée.
- issue: Relation spatiale exprimée par ἐπὶ ὑδάτων πολλῶν
  choice: assise sur de nombreuses eaux
  alternative: assise au bord de nombreuses eaux
  rationale: « Sur » préserve l’image apocalyptique délibérément frappante et concorde avec son interprétation ultérieure en Apocalypse 17.15.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement lissée pour éviter le tour peu naturel « parla avec moi en disant », tandis que les images apocalyptiques et l’ambiguïté judiciaire de κρίμα sont préservées.
