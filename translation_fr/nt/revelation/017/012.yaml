id: REV.17.12
reference: Revelation 17:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: fr
  text: Les dix cornes que tu as vues sont dix rois. Ils n’ont pas encore reçu de royaume, mais ils reçoivent l’autorité en tant que rois pendant une heure[a] avec la bête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour peu de temps ». Dans l’imagerie apocalyptique, l’expression « une heure » désigne probablement une période brève et limitée.'
    reason: Alternative lexicale et interprétative pour μίαν ὥραν.
lexical_decisions:
- source_word: κέρατα
  choice: cornes
  rationale: Le rendu littéral conserve l’image apocalyptique, dont le texte lui-même donne ensuite la portée symbolique en identifiant les cornes à des rois.
- source_word: βασιλεῖς
  choice: rois
  rationale: « Rois » est le sens lexical direct et préserve la tension entre cette désignation et la nature symbolique de la vision.
- source_word: βασιλείαν
  choice: royaume
  rationale: Ce choix naturel en français maintient la distinction avec « autorité » (ἐξουσίαν) dans la proposition suivante.
- source_word: οὔπω ἔλαβον
  choice: n’ont pas encore reçu
  rationale: Le passé composé exprime naturellement en français un état résultant encore valable au moment décrit.
- source_word: ἐξουσίαν
  choice: autorité
  rationale: « Autorité » rend l’idée d’un pouvoir de gouvernement accordé sans la confondre avec le « royaume ».
- source_word: ὡς βασιλεῖς
  choice: en tant que rois
  rationale: Cette formulation indique leur statut ou qualité lorsqu’ils reçoivent l’autorité, plutôt qu’une simple ressemblance.
- source_word: μίαν ὥραν
  choice: pour une heure
  rationale: Le rendu formel conserve l’expression temporelle propre à l’imagerie apocalyptique; sa possible valeur figurée est signalée en note.
- source_word: λαμβάνουσιν
  choice: ils reçoivent
  rationale: Le présent grec est conservé afin de respecter la vivacité de la narration visionnaire, sans imposer explicitement une valeur future.
- source_word: μετὰ τοῦ θηρίου
  choice: avec la bête
  rationale: Cette traduction directe exprime l’association avec la bête tout en laissant ouverte la nature précise de cette association.
- source_word: θηρίου
  choice: la bête
  rationale: « La bête » est le rendu français établi qui préserve la cohérence de l’image dans l’Apocalypse.
theological_decisions:
- issue: Les dix rois sont-ils des monarques littéraux ou des dirigeants ou puissances symboliques?
  choice: Conserver « dix rois » sans explicitation interprétative dans le texte principal.
  alternative: « dix dirigeants symboliques », « dix puissances politiques » ou « dix royaumes »
  rationale: Le grec dit explicitement « dix rois », tandis que le cadre apocalyptique suggère une portée symbolique. La traduction préserve cette tension.
- issue: L’expression « une heure » désigne-t-elle une heure littérale ou une brève période?
  choice: Conserver « pour une heure » dans le texte principal.
  alternative: « pour peu de temps » ou « pour une courte période »
  rationale: L’expression grecque est littéralement « une heure », mais elle peut symboliser une période brève et limitée. La note présente cette possibilité sans la substituer au texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle; le vocabulaire symbolique de l’Apocalypse est conservé sans paraphrase doctrinale.
