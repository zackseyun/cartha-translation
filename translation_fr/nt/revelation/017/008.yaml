id: REV.17.8
reference: Revelation 17:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: fr
  text: La bête que tu as vue était et n’est pas. Elle est sur le point de monter de l’abîme, puis elle s’en va vers la destruction. Les habitants de la terre dont le nom n’est pas écrit dans le livre de la vie depuis la fondation du monde seront saisis d’étonnement quand ils verront la bête, parce qu’elle était, qu’elle n’est pas et qu’elle sera là.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « seront saisis d’étonnement en voyant que la bête était, qu’elle n’est pas et qu’elle sera là ». Le grec peut présenter cette dernière proposition soit comme la cause de leur étonnement (« parce que »), soit comme le contenu de ce qu’ils voient (« que »). « Sera là » peut aussi se traduire par « viendra » ou « apparaîtra ».'
    reason: alternative_reading
lexical_decisions:
- source_word: θηρίον
  choice: bête
  rationale: Terme apocalyptique consacré en français, qui conserve la force monstrueuse et symbolique du grec sans réduire le référent à un simple animal.
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: était et n’est pas
  rationale: Conserve le contraste verbal abrupt du grec et son écho avec les formules d’existence de l’Apocalypse, sans l’expliciter par « n’existe plus ».
- source_word: μέλλει ἀναβαίνειν
  choice: est sur le point de monter
  rationale: Rend la nuance d’imminence de μέλλει avec l’infinitif et le mouvement ascendant de ἀναβαίνειν.
- source_word: ἄβυσσος
  choice: abîme
  rationale: Équivalent apocalyptique exact et usuel en français, moins interprétatif que « puits sans fond ».
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: s’en va vers la destruction
  rationale: Préserve le mouvement vers une issue funeste et le présent grec de ὑπάγει, sans employer le terme vieilli « perdition » ni l’expression plus interprétative « court à sa perte ».
- source_word: θαυμασθήσονται
  choice: seront saisis d’étonnement
  rationale: Exprime naturellement en français l’étonnement intense indiqué par le verbe, sans la connotation nécessairement positive de « s’émerveiller ».
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: les habitants de la terre
  rationale: Formulation naturelle et cohérente avec l’expression récurrente de l’Apocalypse.
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: dont le nom n’est pas écrit
  rationale: Maintient le singulier collectif explicite τὸ ὄνομα et la valeur résultative du parfait grec.
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: dans le livre de la vie
  rationale: L’usage français dit qu’un nom est écrit dans un livre; le calque « sur le livre » serait peu naturel.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: depuis la fondation du monde
  rationale: Rend directement la portée temporelle de ἀπό et conserve l’expression théologiquement chargée sans la développer.
- source_word: βλεπόντων
  choice: quand ils verront
  rationale: Rend la valeur temporelle naturelle du participe et relie clairement la vision à l’étonnement.
- source_word: ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται
  choice: parce qu’elle était, qu’elle n’est pas et qu’elle sera là
  rationale: Le sens causal de ὅτι convient au déroulement de la phrase; « sera là » rend naturellement le futur de πάρειμι, qui exprime la présence, tout en évitant d’imposer l’idée plus précise d’une résurrection ou d’une réapparition.
theological_decisions:
- issue: Portée temporelle de « depuis la fondation du monde »
  choice: La locution se rattache à l’inscription du nom dans le livre de la vie.
  alternative: Lire la locution à la lumière d’un autre passage comme portant sur une mise à mort ou sur une autre notion voisine.
  rationale: Dans cette phrase, l’ordre syntaxique grec rattache naturellement la locution à « n’est pas écrit dans le livre de la vie ». La traduction conserve ce lien sans élaborer un système doctrinal sur la prédestination.
- issue: Sens de παρέσται
  choice: sera là
  alternative: viendra; apparaîtra; reparaîtra
  rationale: Le futur de πάρειμι désigne d’abord le fait d’être présent ou d’arriver. « Sera là » maintient le contraste avec « n’est pas » sans introduire explicitement une résurrection ou une réapparition.
- issue: Valeur de ὅτι dans la dernière proposition
  choice: 'Lecture causale : « parce que »'
  alternative: 'Lecture complétive : « en voyant que la bête était, n’est pas et sera là »'
  rationale: La lecture causale explique directement la raison de l’étonnement, mais le grec permet aussi de comprendre que la proposition énonce le contenu de ce qu’ils voient; cette ambiguïté est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les contrastes abrupts du texte grec, notamment « était et n’est pas », tout en divisant la longue période pour assurer une lecture claire. Le vocabulaire apocalyptique traditionnel est maintenu lorsqu’il reste courant (« bête », « abîme », « livre de la vie »).
