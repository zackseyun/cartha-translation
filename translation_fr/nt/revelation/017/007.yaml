id: REV.17.7
reference: Revelation 17:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: fr
  text: 'Alors l’ange me dit : « Pourquoi t’es-tu étonné ? Je vais te faire connaître le mystère de la femme et de la bête qui la porte[a] et qui a les sept têtes et les dix cornes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui la soutient ».'
    reason: βαστάζω peut exprimer le fait de porter ou de soutenir ; la variante signale cette nuance lexicale sans modifier l’image principale.
lexical_decisions:
- source_word: ἐθαύμασας
  choice: t’es-tu étonné
  rationale: Le verbe exprime ici un vif étonnement ou de l’émerveillement. « T’es-tu étonné » est naturel en français moderne et garde la force de la question sans suggérer une simple curiosité.
- source_word: μυστήριον
  choice: mystère
  rationale: Dans l’Apocalypse, le terme désigne une réalité cachée qui va être dévoilée, et non une simple énigme. « Mystère » conserve cette portée apocalyptique et théologique.
- source_word: γυναικός
  choice: femme
  rationale: Dans ce contexte symbolique, γυνή désigne une femme, sans qu’une relation conjugale soit exprimée.
- source_word: θηρίου
  choice: bête
  rationale: « Bête » est le terme apocalyptique consacré dans l’Apocalypse et préserve les connotations hostiles et monstrueuses de θηρίον.
- source_word: βαστάζοντος
  choice: qui la porte
  rationale: Le participe décrit la bête comme portant la femme. « Porte » rend clairement l’image tout en laissant en note la nuance possible de soutien.
- source_word: ἔχοντος
  choice: celle qui a
  rationale: Le participe se rapporte grammaticalement à la bête. La reprise pronominale féminine française rend ce lien clair et produit une phrase naturelle.
- source_word: κεφαλάς
  choice: têtes
  rationale: La traduction littérale conserve l’imagerie anatomique et symbolique de la vision.
- source_word: κέρατα
  choice: cornes
  rationale: La traduction littérale maintient l’imagerie apocalyptique employée dans tout le livre.
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: C’est l’équivalent interrogatif direct et idiomatique en français.
- source_word: ἐρῶ σοι
  choice: Je vais te faire connaître
  rationale: Le futur de λέγω introduit l’explication révélatrice qui suit. Cette formulation est plus naturelle que « je te dirai le mystère » et conserve l’idée de communication sans détailler prématurément le contenu de l’explication.
theological_decisions:
- issue: Référent de la description « qui a les sept têtes et les dix cornes »
  choice: Rattacher explicitement cette description à la bête.
  alternative: Laisser en français une ambiguïté syntaxique entre la femme, la bête et l’ensemble du mystère.
  rationale: Les participes génitifs τοῦ βαστάζοντος et τοῦ ἔχοντος s’accordent avec θηρίου et non avec γυναικός. La formulation « celle qui a » indique donc clairement que la bête porte la femme et possède les sept têtes et les dix cornes.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier σοι dans le dialogue direct. « Alors » assure une transition narrative naturelle pour καί, tandis que la structure et les images apocalyptiques restent proches du grec.
