  to: 'Alors l’ange me dit : « Pourquoi t’es-tu étonné ? Je vais te faire connaître le mystère de la femme et de la bête qui la porte[a] et qui a les sept têtes et les dix cornes. »'
  rationale: La révision remplace la reprise « celle qui a » par « et qui a » afin d’indiquer sans ambiguïté que la bête, et non la femme, possède les sept têtes et les dix cornes. Aucun autre changement de sens n’est nécessaire.
