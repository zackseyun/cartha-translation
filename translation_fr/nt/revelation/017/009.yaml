id: REV.17.9
reference: Revelation 17:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: fr
  text: 'C’est ici qu’il faut de l’intelligence et de la sagesse : les sept têtes sont sept montagnes sur lesquelles la femme est assise[a] ; et ce sont sept rois.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sept collines ». Le mot grec peut désigner des montagnes ou des collines ; « montagnes » en est ici la traduction la plus directe.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν
  choice: C’est ici qu’il faut une intelligence pleine de sagesse
  rationale: Cette formulation française naturelle conserve l’appel au discernement contenu dans l’expression grecque, sans réduire νοῦς à une simple faculté intellectuelle ni expliquer le symbole à la place du texte.
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: les sept têtes
  rationale: Le terme symbolique est rendu directement, sans interprétation ajoutée.
- source_word: ἑπτὰ ὄρη
  choice: sept montagnes
  rationale: « Montagnes » est le sens direct de ὄρη. « Collines », souvent associé à Rome, reste possible selon le contexte et figure donc en note.
- source_word: ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν
  choice: sur lesquelles la femme est assise
  rationale: Cette tournure rend naturellement en français la combinaison de ὅπου et ἐπ’ αὐτῶν, sans la redondance qu’occasionnerait un calque mot à mot.
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: ce sont aussi sept rois
  rationale: Le démonstratif reprend naturellement les sept têtes en français, tandis que « aussi » rend la coordination καί et maintient la seconde identification symbolique.
theological_decisions:
- issue: Identification symbolique des sept têtes
  choice: Conserver les deux correspondances — sept montagnes et sept rois — sans préciser leur référent historique.
  alternative: Identifier explicitement les montagnes aux sept collines de Rome, ou les rois à des empereurs ou à des royaumes déterminés.
  rationale: Le verset présente les correspondances symboliques, mais ne tranche pas à lui seul entre les divers schémas historiques proposés. La traduction préserve donc cette ouverture interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. Le tour « C’est ici qu’il faut… » signale naturellement l’exigence de discernement ; le point-virgule clarifie les deux identifications successives sans les dissocier.
