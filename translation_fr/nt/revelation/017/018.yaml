id: REV.17.18
reference: Revelation 17:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: fr
  text: Et la femme que tu as vue, c’est la grande ville qui exerce son pouvoir sur les rois de la terre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui détient la royauté sur les rois de la terre ». L’expression grecque dit littéralement « ayant royauté » et peut aussi évoquer le fait de posséder un royaume, un règne ou un pouvoir royal.'
    reason: alternative lexicale
lexical_decisions:
- source_word: γυνή
  choice: femme
  rationale: Dans cette vision, le nom désigne la figure féminine symbolique déjà vue ; « femme » est le rendu naturel, sans introduire le sens contextuel possible d’« épouse ».
- source_word: ἣν εἶδες
  choice: que tu as vue
  rationale: La proposition relative identifie directement la figure aperçue par Jean et respecte le féminin du référent en français.
- source_word: πόλις ἡ μεγάλη
  choice: la grande ville
  rationale: Rendu direct et courant de πόλις avec l’adjectif attributif, qui conserve l’identification apocalyptique.
- source_word: ἔχουσα βασιλείαν
  choice: qui exerce son pouvoir
  rationale: L’expression signifie littéralement « ayant royauté/règne ». Dans ce contexte, elle évoque une autorité souveraine exercée sur les rois plutôt qu’un territoire possédé.
- source_word: βασιλεία
  choice: pouvoir
  rationale: Le terme peut désigner un royaume, une royauté, un règne ou un pouvoir royal. Ici, le complément « sur les rois » met l’accent sur l’autorité exercée.
- source_word: ἐπὶ τῶν βασιλέων
  choice: sur les rois
  rationale: Avec le génitif dans ce contexte, ἐπί exprime une autorité ou une suprématie sur les rois.
- source_word: τῆς γῆς
  choice: de la terre
  rationale: Ce rendu conserve la portée universelle et apocalyptique habituelle du terme dans l’Apocalypse, sans la restreindre à un pays particulier.
theological_decisions:
- issue: Nature de l’identification entre la femme et la ville
  choice: « la femme… c’est la grande ville »
  alternative: « la femme… représente la grande ville »
  rationale: Le grec emploie la copule simple ἔστιν, « est ». Le rendu retenu maintient l’identification symbolique directe sans la transformer en paraphrase interprétative.
- issue: Sens de βασιλεία dans l’autorité de la ville
  choice: « exerce son pouvoir »
  alternative: « possède un royaume » ou « détient la royauté »
  rationale: Le contexte indique une autorité sur les rois, mais la note conserve le sens plus littéral et l’ambiguïté lexicale entre royaume, royauté et règne.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure présentative « c’est » rend idiomatiquement l’identification grecque tout en conservant sa force directe. « Exerce son pouvoir » évite le caractère territorial que pourrait suggérer « possède un royaume », tandis que la note signale l’ambiguïté du grec.
