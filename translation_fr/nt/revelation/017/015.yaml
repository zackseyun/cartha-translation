  text: 'Puis il me dit : « Les eaux que tu as vues, là où la prostituée est assise, ce sont des peuples, des foules, des nations et des langues. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄχλοι
  choice: foules
  rationale: Rend directement le pluriel grec et conserve la distinction avec « peuples ».
- source_word: γλῶσσαι
  choice: langues
  rationale: Équivalent concret du grec, désignant ici des communautés linguistiques sans expliciter davantage que le texte.
- source_word: πόρνη
  choice: prostituée
  rationale: Terme moderne, clair et non euphémisé correspondant au sens du nom grec.
- source_word: κάθηται
  choice: est assise
  rationale: Préserve l’image symbolique et le présent du texte grec.
theological_decisions:
- issue: Identification symbolique des eaux
  choice: « ce sont des peuples, des foules, des nations et des langues »
  alternative: « elles représentent des peuples… »
  rationale: La formulation copulative du grec est conservée sans transformer explicitement l’identité symbolique en simple représentation.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif de λέγει est rendu par « il me dit », usage idiomatique français, tandis que les quatre groupes coordonnés et l’image de la femme assise sont conservés.
