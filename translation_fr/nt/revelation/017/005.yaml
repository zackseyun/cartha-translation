id: REV.17.5
reference: Revelation 17:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: fr
  text: 'Sur son front était écrit un nom : Mystère[a], Babylone la Grande, la mère des prostituées et des abominations de la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un nom était écrit, un mystère : Babylone la Grande, la mère des prostituées et des abominations de la terre », si « mystère » introduit la signification symbolique du nom au lieu de faire partie de l’inscription elle-même.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: Sur son front
  rationale: Rend directement la localisation de l’inscription dans un français naturel, tout en conservant l’image du texte placé sur le front.
- source_word: ὄνομα γεγραμμένον
  choice: était écrit un nom
  rationale: Conserve le sens passif et résultatif de γεγραμμένον. L’ordre choisi est naturel dans cette tournure descriptive française.
- source_word: μυστήριον
  choice: Mystère
  rationale: Le terme est traité dans le texte principal comme un élément du nom inscrit. La majuscule signale sa fonction titulaire sans réduire le mot à « secret ».
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babylone la Grande
  rationale: Forme française traditionnelle et naturelle du nom propre suivi de son titre appositif.
- source_word: ἡ μήτηρ
  choice: la mère
  rationale: Reproduit l’article et la désignation appositive du grec.
- source_word: τῶν πορνῶν
  choice: des prostituées
  rationale: Correspond au sens concret de πόρνη dans un français moderne et clair, sans l’atténuer par une paraphrase générale sur l’immoralité sexuelle.
- source_word: τῶν βδελυγμάτων
  choice: des abominations
  rationale: Préserve le registre biblique et apocalyptique ainsi que les connotations cultuelles et morales possibles du terme.
- source_word: τῆς γῆς
  choice: de la terre
  rationale: Convient à la portée universelle du tableau dans l’Apocalypse et conserve la construction génitive.
theological_decisions:
- issue: Déterminer si μυστήριον appartient à l’inscription ou introduit l’interprétation symbolique du nom
  choice: '« Mystère » est inclus dans l’inscription : « Mystère, Babylone la Grande… »'
  alternative: 'Comprendre : « un nom était écrit, un mystère : Babylone la Grande… », de sorte que « mystère » qualifie ou introduit la signification symbolique du nom.'
  rationale: Le grec sans ponctuation décisive permet les deux analyses. Le texte principal retient naturellement μυστήριον comme partie du nom écrit, tandis que la note conserve l’autre lecture afin de ne pas supprimer l’ambiguïté apocalyptique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère solennel d’une inscription apocalyptique. « Prostituées » est précis et actuel; « abominations » maintient le registre biblique sans ajouter d’interprétation confessionnelle.
