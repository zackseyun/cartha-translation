review_pass:
  verdict: revise
  source_fidelity: La formulation « l’un est là » ajoute une nuance locative ou de présence concrète qui n’est pas exprimée par ὁ εἷς ἔστιν. De plus, « il devra rester » déplace la nécessité exprimée par δεῖ vers un futur explicite ; « il doit rester » conserve plus directement la valeur du présent grec dans ce cadre futur. Le reste rend fidèlement l’ellipse, la succession et la brièveté indiquées par le grec.
  naturalness: « L’un est » est volontairement elliptique, comme le grec, mais reste recevable dans ce style prophétique condensé. La ponctuation et « peu de temps » sont naturelles en français international moderne.
  terminology: Le texte ne nomme pas les rois dans le corps du verset, préservant la condensation de l’original et l’ambiguïté des identifications historiques. La note explicite légitimement le référent contextuel sans l’interpréter.
  issues:
  - severity: medium
    issue: Ajout de « là » dans « l’un est là »
    rationale: ἔστιν signifie simplement « est » ici. « Là » introduit une idée de localisation ou de présence plus concrète que le grec ne formule pas.
  - severity: low
    issue: « il devra rester » pour αὐτὸν δεῖ μεῖναι
    rationale: Le futur est compréhensible après « quand il viendra », mais δεῖ est au présent. « Il doit rester » préserve plus étroitement la nécessité énoncée par le texte.
  revised_text: Cinq sont tombés[a], l’un est, l’autre n’est pas encore venu ; et, quand il viendra, il doit rester peu de temps.
