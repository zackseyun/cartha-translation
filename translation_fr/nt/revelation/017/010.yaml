source:
  edition: SBLGNT
  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: fr
  text: Cinq sont tombés[a], l’un est, l’autre n’est pas encore venu ; et, quand il viendra, il doit rester peu de temps.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement d’après le contexte : « Cinq rois sont tombés, un roi est, l’autre roi n’est pas encore venu. »'
    reason: Alternative lexicale explicitant les sujets sous-entendus à partir du verset précédent.
lexical_decisions:
- source_word: οἱ πέντε
  choice: Cinq
  rationale: L’article renvoie aux sept rois mentionnés au verset précédent, mais le français naturel n’exige pas ici « les cinq ». Le contexte maintient clairement la référence.
- source_word: ἔπεσαν
  choice: sont tombés
  rationale: Le parfait composé rend naturellement l’aoriste dans ce bilan d’événements accomplis ayant une incidence sur la situation présente, tout en conservant l’image de la chute.
- source_word: ὁ εἷς ἔστιν
  choice: l’un est là
  rationale: Cette formulation française conserve l’ellipse du grec tout en étant plus idiomatique que « l’un est ». Elle n’explicite ni « règne » ni une autre interprétation historique.
- source_word: ὁ ἄλλος
  choice: l’autre
  rationale: Le terme distingue le roi suivant dans la série et répond naturellement à « l’un ».
- source_word: οὔπω ἦλθεν
  choice: n’est pas encore venu
  rationale: Le passé composé avec « pas encore » exprime en français l’arrivée toujours attendue et correspond naturellement à l’aoriste grec dans ce contexte.
- source_word: ὅταν ἔλθῃ
  choice: quand il viendra
  rationale: ὅταν avec le subjonctif aoriste indique une éventualité future. Le futur français est ici naturel, et le pronom masculin reprend le roi évoqué dans le contexte.
- source_word: ὀλίγον
  choice: peu de temps
  rationale: Employé adverbialement avec μεῖναι, le mot marque une courte durée sans ajouter explicitement la nuance restrictive de « seulement ».
- source_word: αὐτὸν δεῖ μεῖναι
  choice: il devra rester
  rationale: La construction signifie littéralement qu’il est nécessaire qu’il demeure. « Il devra rester » transpose cette nécessité dans un français fluide et respecte l’orientation future de la proposition.
theological_decisions:
- issue: Degré d’explicitation de l’image des sept rois
  choice: Conserver dans le texte l’expression elliptique « Cinq… l’un… l’autre » et préciser « rois » seulement en note.
  alternative: Traduire explicitement « Cinq rois sont tombés, un roi est là, l’autre roi n’est pas encore venu » ou identifier ces rois à des personnages historiques précis.
  rationale: Le contexte immédiat établit qu’il s’agit de rois, mais le grec du verset reste condensé. Cette traduction préserve cette forme et n’impose aucun système contesté d’identification historique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère bref et énigmatique du discours apocalyptique, sans archaïsme ni identification interprétative ajoutée.
