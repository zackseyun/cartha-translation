id: REV.15.2
reference: Revelation 15:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: fr
  text: Et je vis ce qui ressemblait à une mer de verre mêlée de feu, ainsi que ceux qui avaient remporté la victoire sur la bête, sur son image et sur le nombre de son nom[a], debout sur la mer de verre et tenant des harpes de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie littéralement une préposition qui peut aussi évoquer une sortie hors de la bête, de son image et du nombre de son nom, c’est-à-dire une délivrance de leur pouvoir.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « des harpes appartenant à Dieu », « venant de Dieu » ou « consacrées à Dieu ». Le complément grec peut indiquer la possession, la provenance ou la consécration.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: comme
  rationale: Introduit une comparaison propre à la vision sans identifier strictement ce qui est vu à une mer réelle.
- source_word: θάλασσαν ὑαλίνην
  choice: une mer de verre
  rationale: Expression naturelle et évocatrice qui conserve l’image et permet sa reprise exacte dans la seconde proposition.
- source_word: μεμιγμένην πυρί
  choice: mêlée de feu
  rationale: Rend directement le participe parfait et préserve l’étrange image composite sans l’expliquer.
- source_word: τοὺς νικῶντας
  choice: ceux qui avaient remporté la victoire
  rationale: Exprime l’identité victorieuse de ces personnes dans un français naturel, sans donner au verbe un sens exclusivement militaire.
- source_word: ἐκ τοῦ θηρίου ... καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ
  choice: sur la bête, sur son image et sur le nombre de son nom
  rationale: Avec l’expression « remporter la victoire », « sur » est idiomatique en français et conserve les trois objets distincts introduits par la répétition grecque de ἐκ.
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: Ils se tenaient debout sur la mer de verre
  rationale: « Sur » maintient l’image saisissante portée par ἐπί avec l’accusatif; une traduction par « près de » l’atténuerait.
- source_word: κιθάρας τοῦ θεοῦ
  choice: des harpes de Dieu
  rationale: « Harpes » est le terme français traditionnel et immédiatement compréhensible pour ces instruments; « de Dieu » conserve l’ambiguïté du génitif quant à la possession, la provenance ou la consécration.
theological_decisions:
- issue: Rapport des vainqueurs à la bête exprimé par ἐκ répété après νικῶντας
  choice: Ils ont remporté la victoire sur la bête, son image et le nombre de son nom.
  alternative: Ils sont sortis de la sphère ou du pouvoir de la bête en vainqueurs.
  rationale: La construction française « remporter la victoire sur » exprime naturellement le motif de la victoire récurrent dans l’Apocalypse. Une note conserve néanmoins la possibilité que ἐκ souligne aussi leur sortie hors du pouvoir de la bête.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque très longue est divisée en deux phrases pour faciliter la lecture, sans perdre les liens syntaxiques ni la succession de la vision. Les marqueurs de notes sont placés précisément après les expressions auxquelles leurs notes se rapportent.
