revisions:
- from: Et je vis comme une mer de verre mêlée de feu, et ceux qui avaient remporté la victoire sur la bête, sur son image et sur le nombre de son nom[a]. Ils se tenaient debout sur la mer de verre et avaient des harpes de Dieu[b].
  to: Et je vis ce qui ressemblait à une mer de verre mêlée de feu, ainsi que ceux qui avaient remporté la victoire sur la bête, sur son image et sur le nombre de son nom[a], debout sur la mer de verre et tenant des harpes de Dieu[b].
  rationale: La révision explicite la valeur comparative et visionnaire de ὡς, maintient en une seule phrase les participes coordonnés du grec, et conserve l’ambiguïté discutée de ἐκ ainsi que celle du génitif τοῦ θεοῦ dans des notes idiomatiques. Aucun ajout doctrinal n’est introduit.
  reviewer_model: gpt-5.6-terra
