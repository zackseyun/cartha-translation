id: REV.15.8
reference: Revelation 15:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: fr
  text: Et le sanctuaire[a] fut rempli de fumée provenant de la gloire de Dieu et de sa puissance, et personne ne pouvait entrer dans le sanctuaire jusqu’à ce que les sept fléaux des sept anges soient accomplis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « temple ». Le grec ναός désigne souvent plus précisément la demeure sainte intérieure que l’ensemble du complexe du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: sanctuaire
  rationale: Dans l’Apocalypse, ναός désigne souvent plus précisément la demeure sainte intérieure plutôt que l’ensemble du complexe du temple. « Sanctuaire » conserve cette nuance et reste naturel en français.
- source_word: ἐγεμίσθη
  choice: fut rempli
  rationale: L’aoriste passif est rendu par un passé simple passif, adapté au registre narratif solennel du passage.
- source_word: καπνοῦ
  choice: de fumée
  rationale: Après le verbe « remplir », le génitif grec se rend naturellement par « de » en français. « Fumée » convient à l’imagerie théophanique.
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ
  choice: provenant de la gloire de Dieu
  rationale: ἐκ exprime ici la source. « Provenant de » rend explicitement ce rapport sans confondre la fumée avec la gloire elle-même.
- source_word: ἐκ τῆς δυνάμεως αὐτοῦ
  choice: et de sa puissance
  rationale: Le second complément coordonné dépend de « provenant » et présente la puissance divine comme autre source associée à la fumée.
- source_word: οὐδεὶς ἐδύνατο
  choice: personne ne pouvait
  rationale: Cette tournure française naturelle restitue l’imparfait grec et l’incapacité prolongée.
- source_word: εἰσελθεῖν εἰς τὸν ναὸν
  choice: entrer dans le sanctuaire
  rationale: La construction infinitive est rendue directement, avec le même équivalent de ναός aux deux occurrences.
- source_word: ἄχρι τελεσθῶσιν
  choice: avant que … soient arrivés à leur terme
  rationale: La locution rend la limite temporelle et le sens d’achèvement du passif τελεσθῶσιν. Le subjonctif français est requis après « avant que ».
- source_word: πληγαὶ
  choice: fléaux
  rationale: Dans l’Apocalypse, le mot désigne des coups ou calamités relevant du jugement divin. « Fléaux » est précis, digne et idiomatique en français biblique moderne.
- source_word: τῶν ἑπτὰ ἀγγέλων
  choice: des sept anges
  rationale: Le génitif associe les sept fléaux aux sept anges sans préciser davantage la nature exacte de cette relation.
theological_decisions:
- issue: Traduction de ναός dans le cadre céleste et cultuel de l’Apocalypse
  choice: sanctuaire
  alternative: temple
  rationale: « Sanctuaire » évoque la demeure sainte proprement dite et évite de suggérer nécessairement tout l’ensemble du temple, sans ajouter de précision doctrinale absente du grec.
- issue: Rapport de la fumée à la gloire et à la puissance de Dieu
  choice: la fumée est présentée comme provenant de la gloire de Dieu et de sa puissance
  alternative: la fumée serait seulement un signe accompagnant la gloire et la puissance
  rationale: La répétition de ἐκ marque grammaticalement la source ou la provenance. La traduction conserve cette image sans tenter d’en résoudre le mécanisme théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple soutient la narration solennelle. « Fléaux » conserve la force apocalyptique de πληγαί, tandis que « arrivés à leur terme » exprime naturellement l’achèvement sans affaiblir le passif grec.
