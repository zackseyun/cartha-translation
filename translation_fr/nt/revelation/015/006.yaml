id: REV.15.6
reference: Revelation 15:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: fr
  text: Et les sept anges qui avaient les sept fléaux sortirent du sanctuaire[a], vêtus de lin pur et éclatant[b], ceints de ceintures d’or autour de la poitrine[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « temple »; le mot grec désigne souvent plus précisément le sanctuaire que l’ensemble du temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « d’un lin propre et brillant ».
    reason: lexical_alternative
  - marker: c
    text: Ou « ceints autour de la poitrine de ceintures d’or ».
    reason: literal_rendering
lexical_decisions:
- source_word: ἐξῆλθον
  choice: sortirent
  rationale: L’aoriste de ἐξέρχομαι exprime ici un mouvement vers l’extérieur; le passé simple convient au registre narratif soutenu de la vision.
- source_word: ἄγγελοι
  choice: anges
  rationale: Dans cette vision céleste, il s’agit d’êtres angéliques et non de messagers humains.
- source_word: πληγάς
  choice: fléaux
  rationale: Dans l’Apocalypse, πληγή désigne des coups ou jugements envoyés par Dieu; « fléaux » est naturel en français biblique moderne et garde cette portée.
- source_word: ναοῦ
  choice: sanctuaire
  rationale: ναός désigne plus précisément le sanctuaire, plutôt que l’ensemble du complexe du temple.
- source_word: ἐνδεδυμένοι
  choice: vêtus
  rationale: Le participe parfait décrit l’état dans lequel se trouvent les anges; « vêtus » est concis, digne et naturel.
- source_word: λίνον
  choice: lin
  rationale: Le nom désigne le lin; le texte n’ajoute pas de terme distinct signifiant « fin ».
- source_word: καθαρὸν
  choice: pur
  rationale: καθαρός peut signifier « propre » ou « pur »; appliqué au lin dans cette scène céleste, « pur » est idiomatique tout en préservant la nuance possible de pureté.
- source_word: λαμπρὸν
  choice: éclatant
  rationale: λαμπρός évoque ce qui brille ou resplendit; « éclatant » restitue cette luminosité avec naturel.
- source_word: περιεζωσμένοι
  choice: portant autour
  rationale: Le participe exprime le fait d’être ceint; cette formulation actuelle évite l’archaïsme de « ceints » tout en gardant la disposition physique des bandes.
- source_word: περὶ τὰ στήθη
  choice: autour de la poitrine
  rationale: La locution situe les ceintures autour de la région thoracique; le singulier collectif est idiomatique en français.
- source_word: ζώνας χρυσᾶς
  choice: ceintures d’or
  rationale: ζώνη désigne une ceinture ou une bande servant à ceindre; « d’or » rend naturellement l’adjectif χρυσᾶς.
theological_decisions:
- issue: Sens de ναός dans le contexte du temple céleste
  choice: sanctuaire
  alternative: temple
  rationale: « Sanctuaire » conserve le sens plus précis du lieu saint intérieur sans trancher davantage la nature de la réalité céleste décrite.
- issue: Nuance de καθαρός
  choice: pur
  alternative: propre
  rationale: « Pur » convient au vêtement céleste et laisse entendre la dimension symbolique possible, sans l’imposer explicitement.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif littéraire de l’Apocalypse. Les formulations archaïques sont évitées dans le texte principal, tandis qu’une note conserve l’image littérale de l’action de ceindre.
