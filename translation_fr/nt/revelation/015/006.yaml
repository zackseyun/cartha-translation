revisions:
- from: Et les sept anges qui tenaient les sept fléaux sortirent du sanctuaire[a], vêtus d’un lin pur et éclatant[b], et portant autour de la poitrine des ceintures d’or[c].
  to: Et les sept anges qui avaient les sept fléaux sortirent du sanctuaire[a], vêtus de lin pur et éclatant[b], ceints de ceintures d’or autour de la poitrine[c].
  rationale: La révision remplace « tenaient » par « avaient » afin de rendre sans surinterprétation le participe ἔχοντες. Elle remplace également « portant » par « ceints » pour refléter plus directement περιεζωσμένοι. Les autres choix sont maintenus, notamment « sanctuaire », qui correspond bien à ναός dans ce contexte.
