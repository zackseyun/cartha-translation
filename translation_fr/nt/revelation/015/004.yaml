id: REV.15.4
reference: Revelation 15:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: fr
  text: Qui ne te craindrait, Seigneur, et ne glorifierait ton nom ? Car toi seul es saint. Car toutes les nations viendront se prosterner devant toi, parce que tes actes de justice[a] ont été manifestés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tes justes jugements ». Le terme grec peut aussi désigner des verdicts ou des ordonnances ; ici, il évoque probablement les interventions justes de Dieu désormais rendues visibles.
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: Qui ne te craindrait
  rationale: La question rhétorique renforcée par οὐ μή appelle la réponse « personne ». Le conditionnel français rend naturellement cette force délibérative sans transformer la phrase en simple prédiction.
- source_word: κύριε
  choice: Seigneur
  rationale: Le vocatif de κύριος se rend naturellement par « Seigneur » dans cette adresse liturgique.
- source_word: δοξάσει τὸ ὄνομά σου
  choice: ne glorifierait ton nom
  rationale: « Glorifier ton nom » conserve l’expression biblique et désigne l’honneur rendu au caractère et à la réputation révélés de Dieu.
- source_word: μόνος ὅσιος
  choice: toi seul, tu es saint
  rationale: ὅσιος exprime ici la sainteté morale et religieuse dans une doxologie. La dislocation « toi seul, tu » souligne naturellement l’exclusivité en français.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Cette expression garde la portée universelle et collective de ἔθνη dans la scène eschatologique.
- source_word: ἥξουσιν
  choice: viendront
  rationale: Le futur de ἥκω annonce la venue des nations ; « viendront » est direct et naturel.
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: se prosterner devant toi
  rationale: προσκυνέω évoque concrètement la prosternation comme acte d’adoration. « Se prosterner devant toi » conserve à la fois le geste et ἐνώπιόν σου.
- source_word: τὰ δικαιώματά σου
  choice: tes actes de justice
  rationale: δικαιώματα peut désigner des actes justes, des jugements ou des ordonnances. Dans ce chant célébrant la justice divine rendue visible, « actes de justice » préserve une portée assez large.
- source_word: ἐφανερώθησαν
  choice: ont été manifestés
  rationale: L’aoriste passif indique que ces actes sont devenus visibles. Le passé composé exprime en français leur manifestation accomplie et pertinente dans la scène présente.
theological_decisions:
- issue: Sens de ὅσιος dans une doxologie adressée à Dieu
  choice: saint
  alternative: fidèle ; pieux
  rationale: « Saint » convient au caractère unique de Dieu célébré ici et à la langue de l’adoration, sans réduire le terme à la seule fidélité d’alliance.
- issue: Sens de δικαιώματα dans le contexte des jugements apocalyptiques
  choice: actes de justice
  alternative: justes jugements ; décrets
  rationale: Le contexte célèbre la justice de Dieu désormais rendue visible. « Actes de justice » garde l’amplitude du grec, tandis qu’une note signale sa nuance judiciaire possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au Seigneur. Le conditionnel dans la question rhétorique est idiomatique en français ; « se prosterner » maintient l’image corporelle de l’adoration.
