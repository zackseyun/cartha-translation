revisions:
- from: 'Puis je vis dans le ciel un autre signe, grand et admirable : sept anges qui tenaient les sept derniers fléaux, car c’est par eux que la colère de Dieu devait parvenir à son terme.[a]'
  to: 'Puis je vis dans le ciel un autre signe, grand et admirable : sept anges qui tenaient les sept derniers fléaux, car c’est en eux que la colère de Dieu fut menée à son terme.'
  rationale: La révision conserve les choix lexicaux français appropriés, tout en rétablissant l’aspect accompli de ἐτελέσθη et la relation exprimée par ἐν αὐταῖς. L’accomplissement peut être compris dans le cadre de la vision sans que la traduction introduise une modalité prospective absente du grec.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:47:29Z'
review_pass:
  verdict: revise
  source_fidelity: La tournure « devait parvenir à son terme » ne rend pas la forme aoriste passive ἐτελέσθη, qui présente l’achèvement comme accompli (éventuellement selon la perspective visionnaire), et « par eux » déplace sans nécessité le sens de ἐν αὐταῖς (« en eux »).
  naturalness: Le français est globalement fluide et d’un registre adapté. « Fut menée à son terme » est naturel dans ce contexte solennel et conserve l’aspect accompli du grec.
  terminology: « Signe », « ciel », « fléaux » et « colère de Dieu » sont des choix exacts et cohérents avec le vocabulaire de l’Apocalypse. « Grand et admirable » convient à μέγα καὶ θαυμαστόν.
  issues:
  - severity: high
    issue: « devait parvenir à son terme » remplace un accomplissement exprimé par un aoriste passif par une périphrase de futur dans le passé.
    rationale: ἐτελέσθη signifie que la colère de Dieu « fut achevée » / « fut menée à son terme ». La vision peut présenter cet accomplissement de manière anticipée, mais le français ne doit pas transformer la forme verbale en événement seulement attendu.
  - severity: medium
    issue: « par eux » rend ἐν αὐταῖς de façon instrumentale.
    rationale: Le grec dit littéralement « en elles », c’est-à-dire dans ces plaies; « en eux » conserve cette relation sans imposer l’idée que les fléaux sont exclusivement le moyen instrumental.
  - severity: medium
    issue: La note propose une traduction plus proche du grec comme simple alternative, alors que le texte principal s’en écarte sur l’aspect verbal.
    rationale: La correction du texte principal rend la note inutile; son explication fondée sur l’ordre narratif ne justifie pas l’abandon de l’aoriste passif.
  revised_text: 'Puis je vis dans le ciel un autre signe, grand et admirable : sept anges qui tenaient les sept derniers fléaux, car c’est en eux que la colère de Dieu fut menée à son terme.'
  revised_footnotes: []
  revision_rationale: La révision conserve les choix lexicaux français appropriés, tout en rétablissant l’aspect accompli de ἐτελέσθη et la relation exprimée par ἐν αὐταῖς. L’accomplissement peut être compris dans le cadre de la vision sans que la traduction introduise une modalité prospective absente du grec.
