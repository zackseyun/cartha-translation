id: REV.15.1
reference: Revelation 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: fr
  text: 'Puis je vis dans le ciel un autre signe, grand et admirable : sept anges qui tenaient les sept derniers fléaux, car c’est en eux que la colère de Dieu fut menée à son terme.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σημεῖον
  choice: signe
  rationale: « Signe » est le terme habituel et transparent dans l’Apocalypse pour une réalité visible à portée symbolique.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Le contexte apocalyptique désigne ici le domaine céleste plutôt que le simple ciel visible.
- source_word: μέγα καὶ θαυμαστόν
  choice: grand et admirable
  rationale: Cette formulation conserve à la fois la grandeur et le caractère propre à susciter l’émerveillement, dans un registre français digne et naturel.
- source_word: ἔχοντας
  choice: qui tenaient
  rationale: Dans ce contexte, « tenir » exprime naturellement que les anges ont les fléaux en leur possession, sans la lourdeur de « ayant ».
- source_word: πληγὰς ἑπτὰ τὰς ἐσχάτας
  choice: les sept derniers fléaux
  rationale: « Fléaux » convient au contexte des jugements divins; l’article défini et « derniers » rendent naturellement la construction grecque.
- source_word: ὅτι
  choice: car
  rationale: « Car » marque clairement le rapport explicatif ou causal tout en convenant au registre narratif solennel.
- source_word: ἐν αὐταῖς
  choice: par eux
  rationale: Le français idiomatique emploie ici « par » pour désigner les fléaux comme le moyen dans lequel ou par lequel la colère atteint son accomplissement.
- source_word: ἐτελέσθη
  choice: devait parvenir à son terme
  rationale: Le passé grec présente l’achèvement comme certain depuis le point de vue de la vision; cette tournure française évite de suggérer que les fléaux ont déjà été exécutés dans le déroulement narratif.
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: la colère de Dieu
  rationale: « Colère » rend clairement θυμός en français moderne, avec la gravité requise, sans ajouter une nuance doctrinale étrangère au texte.
theological_decisions:
- issue: Langage du jugement divin dans le contexte apocalyptique
  choice: la colère de Dieu
  alternative: la fureur de Dieu
  rationale: « Colère » conserve le caractère solennel du jugement divin sans l’intensification potentiellement excessive de « fureur ».
- issue: Valeur temporelle et accomplie de ἐτελέσθη
  choice: devait parvenir à son terme
  alternative: fut menée à son terme
  rationale: Le verbe exprime l’aboutissement de la colère dans les sept fléaux. La traduction retenue respecte la perspective visionnaire et la place de ce verset avant leur déversement, sans élargir l’affirmation à toute forme possible de jugement.
translation_notes:
  register: Français international moderne, narratif et solennel. « Puis je vis » est naturel dans l’enchaînement des visions. La syntaxe reste accessible tout en préservant le caractère apocalyptique du passage.
