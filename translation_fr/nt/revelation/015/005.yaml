id: REV.15.5
reference: Revelation 15:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα εἶδον, καὶ ἠνοίγη ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου ἐν τῷ οὐρανῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: fr
  text: Après cela, je vis que le sanctuaire de la tente du témoignage, dans le ciel, fut ouvert.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « La tente du témoignage » reprend le langage de l’Ancien Testament pour désigner la tente-sanctuaire du désert, liée au témoignage de l’alliance de Dieu. On traduit traditionnellement aussi « le tabernacle du témoignage ».
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: Après cela
  rationale: Cette formule marque la succession des visions. Le français naturel emploie ici le singulier collectif « cela », sans perdre la valeur séquentielle du grec.
- source_word: εἶδον
  choice: je vis
  rationale: L’aoriste de ὁράω exprime directement la perception visionnaire de Jean.
- source_word: ἠνοίγη
  choice: fut ouvert
  rationale: Le passé simple restitue l’événement ponctuel exprimé par l’aoriste passif et convient au registre narratif solennel.
- source_word: ὁ ναὸς
  choice: le sanctuaire
  rationale: ναός désigne plus précisément le lieu saint, ou sanctuaire intérieur, plutôt que l’ensemble du complexe du temple. « Sanctuaire » convient aussi naturellement à l’imagerie de la tente sacrée.
- source_word: τῆς σκηνῆς
  choice: de la tente
  rationale: σκηνή désigne la tente-sanctuaire du désert. « Tente » est moderne et compréhensible, tout en conservant l’écho biblique que « tabernacle » rendrait dans un registre plus traditionnel.
- source_word: τοῦ μαρτυρίου
  choice: du témoignage
  rationale: Le terme conserve la formulation cultuelle héritée de l’Ancien Testament et son association au témoignage de l’alliance.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Cette expression situe explicitement le sanctuaire dans le domaine céleste.
theological_decisions:
- issue: Imagerie cultuelle du sanctuaire céleste
  choice: Conserver la chaîne « le sanctuaire de la tente du témoignage, dans le ciel »
  alternative: le sanctuaire céleste ; le sanctuaire dans le ciel, c’est-à-dire la tente du témoignage
  rationale: Le grec superpose des génitifs cultuels qui évoquent la tente du désert et le sanctuaire céleste. La traduction ne réduit pas cette tension imagée à une paraphrase explicative.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient la tonalité visionnaire du récit. « Sanctuaire » précise le sens de ναός, tandis que « tente » évite l’archaïsme de « tabernacle » dans le texte principal.
