id: REV.15.3
reference: Revelation 15:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: fr
  text: 'Ils chantent le chant de Moïse, l’esclave de Dieu, et le chant de l’Agneau, en disant : « Grandes et merveilleuses sont tes œuvres, Seigneur Dieu, le Tout-Puissant ! Justes et véritables sont tes voies, ô Roi des siècles[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « Roi des nations » au lieu de « Roi des siècles ».
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: ils chantent
  rationale: Le présent de l’indicatif est rendu par un présent vivant et naturel dans le récit de la vision.
- source_word: ᾠδὴν
  choice: chant
  rationale: « Chant » rend le sens ordinaire du terme sans lui ajouter une coloration liturgique plus précise.
- source_word: δούλου
  choice: esclave
  rationale: « Esclave » conserve la notion d’appartenance et de dépendance inhérente à δοῦλος, particulièrement sensible dans le titre solennel donné à Moïse.
- source_word: ἀρνίου
  choice: l’Agneau
  rationale: Dans l’Apocalypse, le terme fonctionne comme un titre christologique ; la majuscule signale cet emploi tout en préservant l’image sacrificielle.
- source_word: λέγοντες
  choice: en disant
  rationale: Le participe introduit directement les paroles du chant et se rend naturellement ainsi en français.
- source_word: Μεγάλα καὶ θαυμαστὰ
  choice: grandes et merveilleuses
  rationale: Cette formulation conserve le parallélisme et le registre élevé de l’acclamation grecque.
- source_word: ἔργα
  choice: œuvres
  rationale: « Œuvres » est une traduction directe et convient aux actes de Dieu dans ce contexte doxologique.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Seigneur Dieu, le Tout-Puissant
  rationale: La formulation maintient les trois éléments de l’apposition grecque dans un français solennel et intelligible.
- source_word: δίκαιαι καὶ ἀληθιναὶ
  choice: justes et véritables
  rationale: « Justes » exprime ici la rectitude des voies de Dieu ; « véritables » conserve l’idée de conformité à la vérité et de fiabilité.
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: ô Roi des siècles
  rationale: « Des siècles » traduit directement αἰώνων et « ô » marque clairement l’adresse solennelle exprimée par ce nominatif employé comme vocatif.
theological_decisions:
- issue: Traduction de δοῦλος dans le titre de Moïse
  choice: l’esclave de Dieu
  alternative: le serviteur de Dieu
  rationale: Le choix retient la force concrète de δοῦλος et l’idée d’appartenance à Dieu, sans atténuer le terme en « serviteur ». Il ne suppose toutefois aucune dévalorisation de Moïse, puisque l’expression constitue ici un titre honorifique de fidélité et de mission.
- issue: Le titre divin final
  choice: Roi des siècles
  alternative: Roi des nations
  rationale: Le texte principal suit le SBLGNT, qui lit αἰώνων (« siècles »). La variante « nations », importante dans la tradition manuscrite, est signalée en note sans être substituée au texte retenu.
translation_notes:
  register: Français international moderne, solennel et accessible. L’ordre prédicatif « Grandes et merveilleuses sont tes œuvres » et « Justes et véritables sont tes voies » conserve l’allure poétique du chant sans devenir obscur. Les majuscules à « Agneau », « Tout-Puissant » et « Roi » signalent des titres dans cette adresse doxologique.
