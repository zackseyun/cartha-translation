id: REV.15.7
reference: Revelation 15:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: fr
  text: Puis l’un des quatre êtres vivants donna aux sept anges sept coupes d’or[a], pleines de la colère de Dieu, qui vit pour les siècles des siècles[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vasques d’or »; le mot grec désigne un récipient large et peu profond.
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « pour les âges des âges »; cette expression signifie « pour toujours ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: l’un des quatre êtres vivants
  rationale: Dans l’Apocalypse, ζῷον désigne les êtres célestes qui entourent le trône. « Êtres vivants » les distingue de la « bête » (θηρίον) et évite de les réduire à de simples animaux.
- source_word: ἔδωκεν
  choice: donna
  rationale: L’aoriste de δίδωμι exprime simplement l’action de donner, sans qu’un verbe plus interprétatif soit nécessaire.
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: aux sept anges
  rationale: Dans ce contexte apocalyptique, ἄγγελος désigne naturellement des anges célestes.
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: sept coupes d’or
  rationale: φιάλη désigne un récipient large et peu profond. « Coupes » est clair en français moderne, et « d’or » indique naturellement la matière exprimée par χρυσᾶς.
- source_word: γεμούσας
  choice: pleines de
  rationale: Le participe de γέμω, construit avec le génitif, décrit le contenu dont les coupes sont remplies.
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: de la colère de Dieu
  rationale: Dans ce contexte de jugement, θυμός désigne la colère divine dans toute son intensité. « Colère » demeure solennel et naturel, sans suggérer par lui-même un emportement irrationnel.
- source_word: τοῦ ζῶντος
  choice: qui vit
  rationale: Le participe substantivé qualifie directement Dieu comme celui qui vit; une proposition relative le rend clairement et naturellement en français.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: La formule exprime une durée sans fin. Cette tournure française, à la fois intelligible et proche de l’image grecque, conserve la solennité de l’expression.
theological_decisions:
- issue: Le vocabulaire de la colère divine
  choice: la colère de Dieu
  alternative: la fureur de Dieu
  rationale: « Colère » garde la force judiciaire et eschatologique de θυμός sans donner nécessairement à Dieu les connotations d’un emportement incontrôlé que « fureur » peut avoir en français courant.
- issue: Le Dieu vivant et son éternité
  choice: Dieu, qui vit pour les siècles des siècles
  alternative: le Dieu vivant pour toujours
  rationale: La formulation retenue rattache explicitement τοῦ ζῶντος à Dieu et conserve l’expression temporelle solennelle, sans ajouter d’explication doctrinale ni effacer la structure du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase suit de près la progression grecque tout en restant naturelle. « Puis » assure l’enchaînement narratif de καί; « êtres vivants » respecte la terminologie propre à la scène du trône; les notes signalent les principales possibilités lexicales sans alourdir le verset.
