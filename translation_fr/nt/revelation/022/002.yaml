source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: fr
  text: Au milieu de sa grande rue et de part et d’autre du fleuve se trouve l’arbre de vie, produisant douze fruits[a] et donnant son fruit chaque mois[b]. Les feuilles de l’arbre servent à la guérison des nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « douze sortes de fruits ». L’expression peut désigner douze sortes ou un cycle complet et abondant de production.'
    reason: lexical_alternative
  - marker: b
    text: Cette image rappelle l’arbre de vie de Genèse 2,9 et les arbres dont les feuilles servent à la guérison en Ézéchiel 47,12.
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: Au milieu de sa grande rue
  rationale: « Grande rue » rend le sens de voie large ou place publique de πλατεία tout en conservant le possessif αὐτῆς et le cadre urbain.
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: de part et d’autre
  rationale: Expression française naturelle qui conserve la répartition spatiale littérale, sans préciser davantage la géographie de la vision.
- source_word: ξύλον ζωῆς
  choice: l’arbre de vie
  rationale: « Arbre » convient au contexte botanique et à l’écho de la Genèse; l’article défini identifie l’arbre bien connu de cette imagerie biblique.
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: Il produisait douze fruits
  rationale: La formulation reste proche du grec, qui dit « douze fruits » sans exprimer explicitement « sortes »; une note signale l’ambiguïté possible.
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: donnant son fruit chaque mois
  rationale: Rend naturellement la distribution mensuelle et l’idée que l’arbre donne régulièrement son produit.
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: servent à la guérison des nations
  rationale: Conserve la valeur finale de εἰς, le substantif « guérison » et la portée collective de ἔθνη.
theological_decisions:
- issue: Description spatiale comprimée de l’arbre par rapport à la rue et au fleuve
  choice: Conserver au singulier « l’arbre de vie » et maintenir côte à côte ses rapports à la rue et aux deux côtés du fleuve.
  alternative: Employer « des arbres de vie » ou réorganiser la phrase afin d’imposer une géographie plus explicite.
  rationale: Le grec présente une image visionnaire syntaxiquement tendue. Le singulier respecte le texte transmis et l’écho à l’Éden, sans résoudre artificiellement la disposition spatiale.
- issue: Sens de « douze fruits »
  choice: Traduire littéralement « douze fruits » et expliquer l’extension possible en note.
  alternative: Introduire dans le texte « douze sortes de fruits » ou « douze récoltes ».
  rationale: Le grec n’emploie ni « sortes » ni « récoltes »; conserver la formulation ouverte préserve l’ambiguïté entre variété, cycle et abondance.
translation_notes:
  register: Français international moderne, fluide et digne. La ponctuation divise la longue construction grecque pour la rendre intelligible, tout en préservant la singularité de l’arbre et la tension spatiale de la vision.
