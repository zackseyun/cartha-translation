source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: fr
  text: Que celui qui fait le mal fasse encore le mal, que celui qui est souillé soit encore souillé[a], que le juste pratique encore la justice[b], et que celui qui est saint soit encore rendu saint[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « demeure souillé ». Le verbe grec est à la forme passive, mais il peut exprimer ici la persistance dans la souillure.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « continue à agir avec droiture ». Le mot grec traduit par « justice » peut désigner ici la conduite juste ou droite.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « soit encore sanctifié ». À la forme passive, le verbe grec signifie « être rendu saint » ou « être sanctifié ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν … ἀδικησάτω
  choice: celui qui fait le mal … fasse encore le mal
  rationale: Le participe substantivé et l’impératif gardent leur caractère verbal ainsi que la reprise frappante de la même racine grecque. « Faire le mal » est clair en français courant sans réduire le sens à une injustice juridique.
- source_word: ἔτι
  choice: encore
  rationale: L’adverbe, répété dans les quatre propositions, exprime ici la continuation ou la persistance; « encore » conserve naturellement cette valeur en français.
- source_word: ὁ ῥυπαρός … ῥυπαρευθήτω
  choice: celui qui est souillé … soit encore souillé
  rationale: « Souillé » conserve les connotations morales et cultuelles du grec. La tournure avec « soit » respecte la forme passive de l’impératif, même si le français peut aussi l’entendre comme un état.
- source_word: ὁ δίκαιος … δικαιοσύνην ποιησάτω
  choice: le juste … pratique encore la justice
  rationale: « Le juste » rend l’adjectif substantivé. « Pratiquer la justice » exprime une conduite active et conserve le nom δικαιοσύνη plutôt que de le transformer en simple adjectif.
- source_word: ὁ ἅγιος … ἁγιασθήτω
  choice: celui qui est saint … soit encore rendu saint
  rationale: Cette formulation accessible maintient à la fois le lien lexical avec la sainteté et la voix passive de ἁγιασθήτω, dont l’agent demeure implicite.
theological_decisions:
- issue: Valeur impérative dans le contexte du jugement final
  choice: Rendre les quatre verbes par des impératifs introduits par « Que… »
  alternative: Employer des futurs prédictifs, par exemple « celui qui fait le mal fera encore le mal »
  rationale: Les formes grecques sont des impératifs à la troisième personne. La traduction préserve leur force grammaticale et la tension solennelle du passage, sans présenter ces paroles comme une approbation morale du mal.
- issue: Voix de ῥυπαρευθήτω et de ἁγιασθήτω
  choice: 'Conserver le passif : « soit encore souillé » et « soit encore rendu saint »'
  alternative: 'Employer des formulations statives ou pronominales : « reste souillé », « se souille encore », « reste saint »'
  rationale: Les deux verbes sont passifs en grec. Le maintien de cette voix laisse l’agent implicite et évite de résoudre une ambiguïté théologique présente dans le texte.
- issue: Sens de δικαιοσύνη
  choice: justice
  alternative: droiture
  rationale: « Justice » est le correspondant français habituel de δικαιοσύνη et convient au contraste avec le mal, tandis que la note signale la nuance possible de droiture morale.
translation_notes:
  register: Français international moderne, sobre et solennel. Le parallélisme des quatre impératifs et la répétition d’« encore » reproduisent la structure rhétorique du grec. Les expressions plus techniques sont expliquées en notes.
