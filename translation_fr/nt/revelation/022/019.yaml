  - severity: low
    issue: « décrits » pour γεγραμμένων
    rationale: γεγραμμένων signifie littéralement « écrits »; « décrits » est une interprétation plus libre. Une formulation française idiomatique peut conserver la notion d’écrit sans cette substitution.
