  to: Et si quelqu’un retranche aux paroles du livre de cette prophétie, Dieu retranchera sa part de l’arbre de la vie[a] et de la ville sainte, dont il est écrit dans ce livre.
  rationale: La révision conserve le parallélisme verbal du grec (ἀφέλῃ / ἀφελεῖ) par « retranche / retranchera », sans ajouter d’objet implicite. Elle remplace « décrits » par « dont il est écrit », tournure naturelle qui maintient la référence aux deux réalités immédiatement précédentes et le sens du participe parfait passif γεγραμμένων. La variante « livre de la vie » demeure signalée en note sans modifier le texte principal SBLGNT.
