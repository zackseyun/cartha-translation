id: REV.22.19
reference: Revelation 22:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: fr
  text: Et si quelqu’un retranche aux paroles du livre de cette prophétie, Dieu retranchera sa part de l’arbre de la vie[a] et de la ville sainte, dont il est écrit dans ce livre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « livre de la vie » au lieu de « arbre de la vie ».
    reason: textual_variant
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: enlève quelque chose / enlèvera
  rationale: Le même verbe français conserve la réciprocité voulue entre l’acte humain et la réponse divine. « Quelque chose » rend naturelle en français la construction « enlever aux paroles » sans préciser ce que le grec laisse indéfini.
- source_word: λόγων
  choice: paroles
  rationale: Dans ce contexte, le terme désigne le contenu verbal de la prophétie. « Paroles » convient au registre solennel de l’avertissement.
- source_word: βιβλίου
  choice: livre
  rationale: « Livre » est la désignation française conventionnelle et claire, même si le support matériel antique pouvait être un rouleau.
- source_word: προφητείας
  choice: prophétie
  rationale: Ce choix conserve directement la désignation du genre et la solennité du texte.
- source_word: μέρος
  choice: part
  rationale: « Part » exprime ici la participation ou la portion attribuée, sans développer davantage la nature de cet héritage.
- source_word: ξύλου τῆς ζωῆς
  choice: arbre de la vie
  rationale: Cette expression établie correspond au contexte immédiat d’Apocalypse 22 et à l’image biblique.
- source_word: πόλεως τῆς ἁγίας
  choice: ville sainte
  rationale: Traduction directe et naturelle de la désignation apocalyptique.
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: qui sont décrits dans ce livre
  rationale: La tournure française rattache le pluriel à l’arbre de la vie et à la ville sainte. « Décrits » rend le sens du parfait passif tout en évitant l’expression peu naturelle « qui sont écrits » appliquée à des réalités.
theological_decisions:
- issue: Variante textuelle entre « arbre de la vie » et « livre de la vie »
  choice: arbre de la vie
  alternative: livre de la vie
  rationale: Le texte SBLGNT fourni porte ξύλου τῆς ζωῆς (« arbre de la vie »), lecture retenue par les éditions critiques et cohérente avec le contexte immédiat. La variante traditionnelle demeure signalée en note.
- issue: Référent de la proposition participiale finale
  choice: l’arbre de la vie et la ville sainte
  alternative: les bénédictions ou réalités mentionnées plus largement dans le livre
  rationale: L’accord pluriel et la proximité syntaxique favorisent un rattachement aux deux éléments immédiatement précédents, sans exclure leur portée symbolique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition d’« enlever » préserve le parallélisme judiciaire du grec. La formulation maintient la tension de l’avertissement sans en préciser les implications doctrinales.
