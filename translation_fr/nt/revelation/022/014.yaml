id: REV.22.14
reference: Revelation 22:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: fr
  text: Heureux ceux qui lavent leurs robes[a][b], afin d’avoir droit à l’arbre de vie et d’entrer dans la ville par les portes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « Heureux ceux qui mettent en pratique ses commandements » ou « ceux qui gardent ses commandements », au lieu de : « ceux qui lavent leurs robes ».'
    reason: textual_variant
  - marker: b
    text: L’image des robes lavées rappelle Apocalypse 7.14, où les robes sont lavées et blanchies dans le sang de l’Agneau.
    reason: cross_reference
  - marker: c
    text: 'Ou : « en franchissant les portes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: Heureux
  rationale: Formule traditionnelle et naturelle des béatitudes en français. Ici, « heureux » exprime une condition de faveur accordée par Dieu, et non une simple émotion passagère.
- source_word: πλύνοντες
  choice: ceux qui lavent
  rationale: Le participe présent désigne les personnes caractérisées par cette action. Le présent français conserve le caractère concret de l’image sans l’interpréter comme une purification abstraite.
- source_word: στολάς
  choice: robes
  rationale: « Robes » convient au vêtement ample évoqué dans les scènes visionnaires de l’Apocalypse et maintient le lien verbal avec Apocalypse 7.14.
- source_word: ἵνα
  choice: afin de
  rationale: Cette tournure exprime clairement en français le but ou le résultat visé par la proposition grecque.
- source_word: ἔσται ἡ ἐξουσία αὐτῶν
  choice: avoir droit
  rationale: Dans ce contexte, ἐξουσία désigne un droit d’accès plutôt qu’un pouvoir exercé ou une autorité souveraine. L’infinitif après « afin de » rend naturellement la construction grecque avec le futur.
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: à l’arbre de vie
  rationale: Avec ἐξουσία, la préposition exprime ici le droit d’accéder à l’arbre de vie, et non une domination sur lui.
- source_word: τοῖς πυλῶσιν
  choice: par les portes
  rationale: Le datif sans préposition peut marquer la voie ou le moyen d’entrée. « Par les portes » est concis et naturel en français.
- source_word: εἰσέλθωσιν εἰς τὴν πόλιν
  choice: entrer dans la ville
  rationale: Rend directement et naturellement l’idée d’entrée exprimée par le verbe et la préposition grecs.
theological_decisions:
- issue: Variante textuelle dans la première proposition
  choice: 'Traduire le texte du SBLGNT : « ceux qui lavent leurs robes »'
  alternative: « ceux qui mettent en pratique ses commandements » ou « ceux qui gardent ses commandements »
  rationale: Le texte grec fourni porte πλύνοντες τὰς στολὰς αὐτῶν. La variante bien attestée dans la tradition de transmission est signalée en note en raison de son importance textuelle et théologique, sans remplacer le texte source retenu.
- issue: Rapport entre le lavage des robes et l’accès à la vie
  choice: Conserver le lien formulé par le verset sans préciser dans le texte principal le mécanisme théologique
  alternative: Présenter le lavage comme une œuvre méritoire, ou ajouter explicitement dans le texte principal que les robes sont lavées dans le sang de l’Agneau
  rationale: Le verset relie l’identité de ceux qui lavent leurs robes à leur droit à l’arbre de vie et à leur entrée dans la ville, mais n’explicite pas ici davantage ce rapport. La note renvoie à Apocalypse 7.14 sans imposer une explication supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant l’imagerie visionnaire, le lien de but ou de résultat et l’ambiguïté théologique du texte grec.
