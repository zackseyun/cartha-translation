id: REV.22.1
reference: Revelation 22:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: fr
  text: Puis il me montra un fleuve d’eau de la vie, brillant comme du cristal, qui sortait du trône de Dieu et de l’Agneau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Puis
  rationale: Dans la progression du récit visionnaire, « Puis » rend naturellement la coordination grecque sans alourdir le français.
- source_word: ἔδειξέν μοι
  choice: il me montra
  rationale: Le verbe signifie couramment « montrer »; le passé simple convient au registre narratif digne du passage.
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: un fleuve d’eau de la vie
  rationale: « Fleuve » correspond à ποταμός et la formulation conserve la chaîne de génitifs ainsi que l’image biblique, sans la réduire à « eau vivifiante ».
- source_word: λαμπρὸν ὡς κρύσταλλον
  choice: brillant comme du cristal
  rationale: λαμπρός évoque d’abord l’éclat plutôt que la seule transparence; « comme du cristal » exprime clairement la comparaison introduite par ὡς.
- source_word: ἐκπορευόμενον
  choice: qui sortait
  rationale: Cette relative rend naturellement en français le participe présent décrivant le fleuve et indique son mouvement depuis sa source.
- source_word: ἐκ τοῦ θρόνου
  choice: du trône
  rationale: La préposition ἐκ marque ici l’origine; « sortir du trône » l’exprime avec naturel.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: de Dieu et de l’Agneau
  rationale: La coordination est conservée, et « l’Agneau » maintient le titre christologique caractéristique de l’Apocalypse.
theological_decisions:
- issue: Le trône commun de Dieu et de l’Agneau
  choice: « du trône de Dieu et de l’Agneau »
  alternative: « des trônes de Dieu et de l’Agneau »
  rationale: Le grec emploie « trône » au singulier avec deux compléments coordonnés. La traduction conserve cette image théologiquement forte sans l’expliciter ni la résoudre.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif littéraire; l’ordre des images et la tension théologique du grec sont préservés.
