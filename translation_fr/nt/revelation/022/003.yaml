id: REV.22.3
reference: Revelation 22:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: fr
  text: Et il n’y aura plus aucune malédiction[a]. Le trône de Dieu et de l’Agneau s’y trouvera, et ses esclaves[b] lui[d] rendront un culte[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il n’y aura plus rien de maudit » ou « aucun objet maudit ».
    reason: lexical_alternative
  - marker: b
    text: Ou « serviteurs »; le terme grec peut désigner des personnes appartenant entièrement à un maître.
    reason: lexical_alternative
  - marker: c
    text: Ou « le serviront » ou « lui assureront un service sacré ».
    reason: lexical_alternative
  - marker: d
    text: 'Le grec emploie le singulier : « le trône » de « Dieu et de l’Agneau »… « ses esclaves lui rendront un culte ». Il maintient ainsi à la fois la distinction entre Dieu et l’Agneau et leur règne commun.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: aucune malédiction
  rationale: Cette formulation française naturelle exprime la portée globale de πᾶν et le sens de κατάθεμα dans le contexte de la disparition de la malédiction, tout en signalant en note la lecture concrète possible.
- source_word: οὐκ ἔσται ἔτι
  choice: il n’y aura plus
  rationale: Rend naturellement en français la construction existentielle future et la valeur de ἔτι, « désormais plus / plus longtemps ».
- source_word: ὁ θρόνος
  choice: le trône
  rationale: Traduction usuelle qui conserve le singulier significatif du texte grec.
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: de Dieu et de l’Agneau
  rationale: Conserve explicitement les deux compléments coordonnés ainsi que l’image messianique et sacrificielle propre à l’Apocalypse.
- source_word: ἐν αὐτῇ ἔσται
  choice: s’y trouvera
  rationale: Le pronom adverbial « y » reprend naturellement en français la ville mentionnée dans le contexte et maintient le sens locatif sans lourdeur.
- source_word: δοῦλοι
  choice: esclaves
  rationale: Préserve l’idée forte d’appartenance exprimée par δοῦλοι; « serviteurs » demeure une possibilité française plus atténuée et figure en note.
- source_word: λατρεύσουσιν
  choice: rendront un culte
  rationale: Dans ce contexte lié au trône et au service de Dieu, l’expression indique clairement le service religieux ou cultuel de λατρεύω sans le réduire à un service général.
- source_word: αὐτοῦ ... αὐτῷ
  choice: ses ... lui
  rationale: Conserve les pronoms grecs au singulier après « le trône de Dieu et de l’Agneau », au lieu de résoudre la tension du texte par des pluriels.
theological_decisions:
- issue: Le trône singulier de Dieu et de l’Agneau, suivi de pronoms singuliers
  choice: 'Conserver le singulier : « le trône… ses esclaves lui… »'
  alternative: 'Employer des formes plurielles : « leurs esclaves leur rendront un culte », ou reformuler pour éviter la difficulté'
  rationale: Le grec distingue Dieu et l’Agneau tout en parlant d’un seul trône et en employant ensuite des pronoms singuliers. La traduction garde cette tension sans lui imposer une explication doctrinale.
translation_notes:
  register: Français international actuel, digne et lisible. « S’y trouvera » évite le peu naturel « sera en elle » tout en reprenant clairement la ville. « Esclaves » garde la force de δοῦλοι; la note offre « serviteurs ». La syntaxe singulière volontairement marquée préserve l’ambiguïté et la tension théologique du grec.
