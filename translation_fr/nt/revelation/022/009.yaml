reference: Revelation 22:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: fr
  text: 'Et il me dit : « Ne fais pas cela ! Je suis un esclave comme toi, comme tes frères, les prophètes, et comme ceux qui gardent les paroles de ce livre. Adore Dieu. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Comparer Apocalypse 19.10, où l’ange adresse à Jean le même avertissement et lui ordonne également : « Adore Dieu. »'
    reason: cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: Ne fais pas cela !
  rationale: Cette interdiction elliptique et vive renvoie, dans le contexte, à la tentative de Jean d’adorer l’ange. La formulation française explicite naturellement l’action sous-entendue.
- source_word: σύνδουλός σού εἰμι
  choice: Je suis un esclave comme toi
  rationale: σύνδουλος désigne quelqu’un qui partage avec un autre la condition d’esclave sous un même maître. Cette tournure française reste naturelle tout en préservant la subordination commune à Dieu.
- source_word: τῶν ἀδελφῶν σου τῶν προφητῶν
  choice: tes frères les prophètes
  rationale: 'Le second groupe nominal précise l’identité des « frères » : ce sont les prophètes. La formulation conserve cette apposition sans la transformer en proposition explicative.'
- source_word: τῶν τηρούντων τοὺς λόγους
  choice: ceux qui gardent les paroles
  rationale: τηρέω peut évoquer le fait de garder, d’observer et de mettre fidèlement en pratique. « Garder » maintient cette amplitude et les échos johanniques.
- source_word: τοῦ βιβλίου τούτου
  choice: de ce livre
  rationale: « Livre » est le terme français courant et fidèle pour le référent, sans imposer le support matériel particulier d’un rouleau.
- source_word: τῷ θεῷ προσκύνησον
  choice: Adore Dieu
  rationale: Dans l’Apocalypse, προσκυνέω désigne ici l’hommage cultuel refusé à l’ange et dû à Dieu seul. « Adorer » exprime clairement ce contraste.
theological_decisions:
- issue: Condition commune exprimée par σύνδουλος
  choice: « un esclave comme toi »
  alternative: « ton compagnon de service » ou « un serviteur comme toi »
  rationale: L’ange se présente non comme un être digne d’adoration, mais comme quelqu’un placé, au même titre que Jean, sous l’autorité de Dieu. « Esclave » rend explicitement cette condition commune sans ajouter de doctrine étrangère au texte.
- issue: Action sous-entendue dans Ὅρα μή
  choice: « Ne fais pas cela ! »
  alternative: « Attention, non ! » ou simplement « Non ! »
  rationale: Le grec ne répète pas l’action interdite, mais le contexte immédiat l’identifie comme la prosternation de Jean devant l’ange. L’explicitation idiomatique clarifie sans résoudre une ambiguïté réelle.
- issue: Portée de « tes frères les prophètes » et de « ceux qui gardent »
  choice: Conserver deux groupes coordonnés
  alternative: Comprendre les prophètes et les gardiens des paroles comme un seul groupe
  rationale: La répétition de καί et des articles génitifs présente naturellement l’ange comme compagnon de Jean, des prophètes et de ceux qui gardent les paroles. La traduction préserve cette structure.
translation_notes:
  register: Français international moderne, direct et digne. L’impératif bref conserve la vigueur de la réprimande. « Esclave comme toi » est retenu malgré sa force en français afin de rendre la condition partagée exprimée par σύνδουλος; la syntaxe demeure toutefois naturelle et immédiatement compréhensible.
