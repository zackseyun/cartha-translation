id: REV.22.8
reference: Revelation 22:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: fr
  text: Et moi, Jean, je suis celui qui entend et voit ces choses. Et quand je les ai entendues et vues, je suis tombé aux pieds de l’ange qui me montrait ces choses, pour l’adorer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « me prosterner devant lui » ou « lui rendre hommage ». Le verbe grec peut désigner un geste de prosternation ou de révérence ; « adorer » est retenu ici en raison de son emploi habituel dans l’Apocalypse et de la réprimande qui suit.
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: Et moi
  rationale: Conserve à la fois le lien discursif de καί et l’accent porté par le pronom explicite ἐγώ, dans une tournure française naturelle.
- source_word: ὁ ἀκούων καὶ βλέπων
  choice: je suis celui qui entend et voit
  rationale: Reproduit la construction participiale substantivée et son aspect présent sans la réduire à un simple passé.
- source_word: ταῦτα
  choice: ces choses / les
  rationale: « Ces choses » maintient le pluriel du démonstratif; dans la reprise immédiate, le pronom « les » évite une lourdeur sans changer le référent.
- source_word: ὅτε ἤκουσα καὶ ἔβλεψα
  choice: Quand je les ai entendues et vues
  rationale: « Quand » préserve la relation temporelle sans imposer « après »; le passé composé rend naturellement les aoristes en français narratif.
- source_word: ἔπεσα προσκυνῆσαι
  choice: je suis tombé… pour l’adorer
  rationale: Rend le mouvement physique exprimé par ἔπεσα et la finalité de l’infinitif προσκυνῆσαι.
- source_word: ἔμπροσθεν τῶν ποδῶν
  choice: aux pieds
  rationale: Expression française idiomatique qui conserve la scène concrète de prosternation devant les pieds de l’ange.
- source_word: τοῦ ἀγγέλου
  choice: de l’ange
  rationale: Dans le contexte de l’Apocalypse, il s’agit clairement d’un être angélique plutôt que d’un messager humain.
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: qui me montrait ces choses
  rationale: L’imparfait exprime l’aspect imperfectif du participe présent et le rôle continu de l’ange dans la vision.
theological_decisions:
- issue: Sens de προσκυνέω dirigé vers l’ange
  choice: pour l’adorer
  alternative: pour me prosterner devant lui / pour lui rendre hommage
  rationale: Le verbe peut désigner une prosternation ou un hommage, mais il a régulièrement une force cultuelle dans l’Apocalypse. La réprimande du verset suivant confirme qu’il ne faut pas atténuer d’avance la gravité de l’acte, sans pour autant suggérer que l’ange mérite cette adoration.
translation_notes:
  register: Français international moderne, clair et digne. La première phrase conserve la solennité et l’insistance du grec; la seconde privilégie une syntaxe française fluide tout en maintenant le pluriel « ces choses » et la tension liée à l’adoration de l’ange.
