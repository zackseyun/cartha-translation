id: REV.22.13
reference: Revelation 22:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: fr
  text: Je suis l’Alpha et l’Oméga, le premier et le dernier, le commencement et la fin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ
  choice: Je
  rationale: Le pronom grec explicite donne de l’emphase à cette déclaration solennelle. En français, « Je suis » la rend naturellement sans recourir au tour plus appuyé « Moi, je suis ».
- source_word: τὸ Ἄλφα
  choice: l’Alpha
  rationale: Le nom de la première lettre grecque est conservé comme titre symbolique établi dans l’Apocalypse.
- source_word: τὸ Ὦ
  choice: l’Oméga
  rationale: Le nom de la dernière lettre grecque est conservé comme pendant reconnu d’« Alpha ».
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: Équivalent direct de l’adjectif substantivé, employé ici comme titre et mis en parallèle avec « le dernier ».
- source_word: ὁ ἔσχατος
  choice: le dernier
  rationale: Équivalent direct et idiomatique, qui préserve l’équilibre avec « le premier ».
- source_word: ἡ ἀρχὴ
  choice: le commencement
  rationale: Ce choix conserve le parallélisme compact avec « la fin » et le sens premier de début, sans exclure les connotations plus larges de principe ou d’origine.
- source_word: τὸ τέλος
  choice: la fin
  rationale: Ce choix naturel préserve le parallélisme avec « le commencement »; dans ce contexte, le terme peut évoquer aussi l’aboutissement, sans qu’il soit nécessaire de l’expliciter dans le texte.
theological_decisions:
- issue: Rendre la triple autodésignation sans préciser excessivement sa portée métaphysique ou christologique
  choice: Je suis l’Alpha et l’Oméga, le premier et le dernier, le commencement et la fin.
  alternative: Je suis l’Alpha et l’Oméga, le premier et l’ultime, l’origine et l’aboutissement.
  rationale: Le grec juxtapose trois paires de titres parallèles. La formulation retenue en maintient la symétrie et la solennité, tout en laissant intacte la portée théologique élevée de la déclaration sans ajouter d’explication étrangère au texte.
translation_notes:
  register: Français international moderne, solennel et accessible. La structure ternaire et les articles définis du grec sont conservés; « Alpha » et « Oméga » gardent leurs majuscules en tant que titres symboliques.
