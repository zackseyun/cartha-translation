id: REV.22.5
reference: Revelation 22:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: fr
  text: Il n’y aura plus de nuit, et ils n’auront besoin ni de la lumière d’une lampe ni de celle du soleil, car le Seigneur Dieu brillera sur eux, et ils régneront pour toujours.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour les siècles des siècles », expression grecque désignant une durée sans fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ
  choice: nuit
  rationale: Sens lexical courant; l’absence d’article se rend naturellement en français par « de nuit » dans cette construction.
- source_word: οὐκ ἔσται ἔτι
  choice: il n’y aura plus
  rationale: Formulation française naturelle et solennelle exprimant la disparition définitive de la nuit.
- source_word: οὐκ ἔχουσιν χρείαν
  choice: ils n’auront besoin
  rationale: Le présent grec est rendu au futur pour s’accorder avec la perspective eschatologique et les futurs explicites qui encadrent la proposition.
- source_word: φωτὸς λύχνου
  choice: de la lumière d’une lampe
  rationale: Rend explicitement le génitif grec tout en restant naturel en français moderne.
- source_word: φῶς ἡλίου
  choice: de celle du soleil
  rationale: Évite une répétition lourde tout en conservant clairement le contraste entre la lampe et le soleil.
- source_word: κύριος ὁ θεός
  choice: le Seigneur Dieu
  rationale: Équivalent français habituel et contextuellement approprié de l’expression grecque.
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: répandra sa lumière sur eux
  rationale: Conserve l’image directionnelle de la lumière venant de Dieu; « éclairera sur eux » serait peu idiomatique en français.
- source_word: βασιλεύσουσιν
  choice: ils régneront
  rationale: Rendu direct du verbe désignant l’exercice de la royauté, sans ajout interprétatif.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours
  rationale: Expression française idiomatique indiquant une durée sans fin; la tournure grecque est signalée en note.
theological_decisions:
- issue: Valeur temporelle de οὐκ ἔχουσιν χρείαν dans une vision orientée vers l’avenir
  choice: 'Rendu au futur : « ils n’auront besoin »'
  alternative: 'Rendu formel au présent : « ils n’ont besoin »'
  rationale: Le présent grec peut produire un effet de description vive, mais les futurs ἔσται, φωτίσει et βασιλεύσουσιν situent clairement l’ensemble dans l’état à venir.
- issue: Nature de la lumière divine dans φωτίσει ἐπ’ αὐτούς
  choice: 'Conserver une image lumineuse sans préciser son mécanisme : « répandra sa lumière sur eux »'
  alternative: « les éclairera » ou « brillera sur eux »
  rationale: Le texte affirme que Dieu est la source de lumière, sans imposer une explication théologique plus précise.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec, avec une coordination fluide et sans vocabulaire confessionnel spécialisé.
