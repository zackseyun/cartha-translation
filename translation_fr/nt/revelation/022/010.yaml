id: REV.22.10
reference: Revelation 22:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: fr
  text: 'Puis il me dit : « Ne scelle pas les paroles de la prophétie de ce livre[a], car le temps est proche[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Comparer Daniel 12.4, où il est ordonné de sceller la prophétie ; ici, l’ordre est inverse. « Ne scelle pas » peut donc aussi avoir le sens de « ne tiens pas secrètes ».
    reason: cross_reference_and_lexical_alternative
  - marker: b
    text: 'Ou : « car le moment fixé est proche ». Le grec peut désigner un moment décisif ou fixé.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει μοι
  choice: il me dit
  rationale: Le présent grec est un présent narratif fréquent dans l’Apocalypse. En français, « il me dit » conserve cette vivacité tout en restant naturel dans le récit.
- source_word: Μὴ σφραγίσῃς
  choice: Ne scelle pas
  rationale: Le verbe σφραγίζω signifie littéralement « sceller » et, ici, évoque le fait de fermer ou de tenir une révélation cachée. Le choix maintient l’image prophétique et le contraste avec Daniel 12.4 sans l’expliciter dans le texte.
- source_word: τοὺς λόγους
  choice: les paroles
  rationale: Le pluriel concret λόγους est conservé. « Paroles » est plus idiomatique que « mots » pour désigner le contenu d’une prophétie en français biblique moderne.
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: de la prophétie de ce livre
  rationale: Cette formulation reproduit naturellement la chaîne de génitifs et laisse ouverte la relation exacte entre la prophétie et le livre, sans remplacer « livre » par l’historiquement possible « rouleau ».
- source_word: ὁ καιρὸς
  choice: le temps
  rationale: καιρός peut désigner un moment décisif ou fixé. « Le temps » demeure sobre, naturel et suffisamment ouvert pour préserver cette nuance, signalée en note.
- source_word: ἐγγύς ἐστιν
  choice: est proche
  rationale: Cette formulation rend directement l’idée de proximité exprimée par ἐγγύς, dans un français actuel, sans atténuer l’affirmation.
theological_decisions:
- issue: Langage d’imminence dans un contexte apocalyptique
  choice: car le temps est proche
  alternative: car le moment fixé est proche
  rationale: La traduction maintient l’affirmation de proximité sans lui imposer un calendrier eschatologique ni en atténuer la tension. La nuance de moment décisif ou fixé reste possible et figure en note.
- issue: Ouverture de la révélation par contraste avec Daniel
  choice: Ne scelle pas
  alternative: Ne tiens pas secrètes
  rationale: L’image du sceau est conservée, car elle appartient au langage prophétique et fait écho à Daniel 12.4, où l’ordre opposé est donné. Une paraphrase aurait expliqué l’effet au prix de l’image.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans raideur. « Puis » rend la continuité narrative de Καί ; les images prophétiques de « sceller » et la proximité du « temps » sont conservées sans interprétation confessionnelle.
