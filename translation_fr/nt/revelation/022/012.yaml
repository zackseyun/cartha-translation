  source_fidelity: Le texte rend fidèlement Ἰδοὺ ἔρχομαι ταχύ (« Voici, je viens bientôt »), la proposition nominale ὁ μισθός μου μετ’ ἐμοῦ (« ma récompense est avec moi »), ainsi que l’infinitif de but ἀποδοῦναι et le critère individuel exprimé par ἑκάστῳ ὡς τὸ ἔργον ἐστὶν αὐτοῦ. « Pour rendre à chacun selon ce qu’est son œuvre » conserve, de façon volontairement proche du grec, le nom singulier « œuvre » et le verbe explicite « est ».
