id: REV.22.12
reference: Revelation 22:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: fr
  text: « Voici, je viens bientôt[a], et ma récompense est avec moi, pour rendre à chacun selon ce qu’est son œuvre. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je viens rapidement » ou « je viens soudainement ». Le grec ταχύ peut souligner soit la proximité de la venue (« bientôt »), soit sa rapidité ou son caractère soudain.
    reason: alternative lexicale
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Conserve l’appel solennel à l’attention propre au registre prophétique et apocalyptique, dans un français actuel et digne.
- source_word: ἔρχομαι
  choice: je viens
  rationale: Le présent grec a ici une portée future et imminente. « Je viens » est idiomatique en français et garde la vivacité de la déclaration.
- source_word: ταχύ
  choice: bientôt
  rationale: Dans ce contexte eschatologique, l’adverbe peut exprimer la proximité temporelle aussi bien que la rapidité ou la soudaineté. « Bientôt » rend naturellement le premier sens; l’autre possibilité est signalée en note.
- source_word: ὁ μισθός μου
  choice: ma récompense
  rationale: μισθός peut désigner un salaire, une rétribution ou une récompense. « Récompense » convient au contexte du jugement divin sans donner à l’image une tonalité excessivement commerciale.
- source_word: μετ’ ἐμοῦ
  choice: est avec moi
  rationale: Le grec sous-entend la copule; son ajout est nécessaire pour former une proposition française complète.
- source_word: ἀποδοῦναι
  choice: pour rendre
  rationale: L’infinitif exprime le but lié à la venue. « Rendre » conserve l’idée de rétribution, qu’elle soit favorable ou défavorable, sans limiter le sens à une récompense positive.
- source_word: ἑκάστῳ
  choice: à chacun
  rationale: Rend directement la valeur distributive du datif singulier et souligne la responsabilité individuelle.
- source_word: ὡς
  choice: selon ce que
  rationale: Introduit la norme de la rétribution tout en permettant de conserver la proposition explicite formée avec ἐστίν.
- source_word: τὸ ἔργον ἐστὶν αὐτοῦ
  choice: ce qu’est son œuvre
  rationale: Préserve le nom singulier ἔργον et le verbe ἐστίν, ainsi que la formulation délibérément formelle du grec, plutôt que de paraphraser par « ce qu’il a fait ».
theological_decisions:
- issue: Représentation du genre dans ἑκάστῳ … αὐτοῦ
  choice: à chacun … son œuvre
  alternative: à chaque personne … son œuvre; à chacun … ce qu’il a fait
  rationale: Les formes grecques sont au masculin singulier avec une portée représentative. Le français « chacun … son » conserve cette forme tout en pouvant naturellement englober toute personne.
- issue: Nature de la rétribution
  choice: ma récompense … pour rendre à chacun selon ce qu’est son œuvre
  alternative: ma rétribution … pour donner à chacun selon ses œuvres
  rationale: Le texte affirme une rétribution individuelle en rapport avec l’œuvre de chacun. La traduction maintient cette tension sans en tirer une conclusion doctrinale supplémentaire sur le fondement du salut final.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. « Voici » maintient le ton apocalyptique; « ce qu’est son œuvre » conserve la structure marquée de l’original, tout en restant intelligible.
