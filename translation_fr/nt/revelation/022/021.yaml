  text: Ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μετὰ ⸀πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: fr
  text: Que la grâce du Seigneur Jésus soit avec tous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « Que la grâce du Seigneur Jésus soit avec tous les saints » ; d’autres : « avec vous tous ».'
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: grâce
  rationale: Terme chrétien courant et naturel dans une bénédiction finale; il conserve les dimensions relationnelle et salvatrice du grec sans paraphrase.
- source_word: κυρίου
  choice: Seigneur
  rationale: Rend le titre christologique κύριος selon son équivalent français établi et adapté au contexte.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Forme française traditionnelle du nom propre grec Ἰησοῦ.
- source_word: μετὰ
  choice: soit avec
  rationale: Le grec est sans verbe, mais la formule française de bénédiction appelle naturellement le subjonctif « soit »; cet ajout minimal explicite le souhait sans en modifier le sens.
- source_word: πάντων
  choice: tous
  rationale: Le texte SBLGNT présente un terme large et non qualifié. « Tous » en préserve l'indétermination sans ajouter « vous » ni « les saints ».
theological_decisions:
- issue: Faut-il préciser les destinataires implicites de la bénédiction ?
  choice: 'Maintenir l''objet implicite : « avec tous »'
  alternative: « avec vous tous » ou « avec tous les saints »
  rationale: Le texte retenu se termine simplement par πάντων (« tous »). Préciser « vous » serait interprétatif, tandis que « les saints » relève d'une variante manuscrite. La formulation choisie conserve l'étendue et l'ambiguïté du texte source.
translation_notes:
  register: Français moderne, digne et accessible. La tournure optative « Que… soit » restitue naturellement la bénédiction finale. « Avec tous » est légèrement inhabituel en français, mais conserve volontairement l'absence de complément explicite dans le texte grec.
