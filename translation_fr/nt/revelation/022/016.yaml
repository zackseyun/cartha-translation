id: REV.22.16
reference: Revelation 22:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: fr
  text: « Moi, Jésus, j’ai envoyé mon ange pour vous attester ces choses à l’intention des Églises[a]. Je suis la racine et le descendant de David[b], l’étoile brillante du matin. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans les Églises » ou « au sujet des Églises ». L’expression grecque ἐπὶ ταῖς ἐκκλησίαις admet plusieurs nuances.
    reason: lexical_alternative
  - marker: b
    text: Ou « le rejeton de David » ; le mot grec peut désigner la lignée, la descendance ou celui qui en est issu.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: Moi, Jésus
  rationale: Le pronom explicite est emphatique. La tournure appositive « Moi, Jésus » rend naturellement cette auto-identification sans ajouter un verbe absent à cet endroit du grec.
- source_word: ἔπεμψα
  choice: j’ai envoyé
  rationale: Le passé composé exprime en français courant une action accomplie dont l’effet demeure pertinent dans le discours.
- source_word: τὸν ἄγγελόν μου
  choice: mon ange
  rationale: Dans le contexte apocalyptique de l’Apocalypse, ἄγγελος désigne naturellement un être angélique plutôt qu’un simple messager humain.
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: pour vous rendre témoignage de ces choses
  rationale: L’infinitif indique le but de l’envoi. Cette formulation française conserve l’idée de témoignage, le destinataire exprimé par ὑμῖν et le pluriel de ταῦτα.
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: à l’intention des Églises
  rationale: Cette expression rend la destination ou la sphère visée par le témoignage sans imposer le sens strictement local de « dans les Églises »; l’ambiguïté de ἐπί avec le datif est signalée en note.
- source_word: ἡ ῥίζα
  choice: la racine
  rationale: La traduction littérale préserve l’image messianique de la source ou de l’origine.
- source_word: τὸ γένος Δαυίδ
  choice: le descendant de David
  rationale: Dans cette prédication singulière appliquée à Jésus, « descendant » exprime clairement l’appartenance à la lignée de David tout en restant naturel en français moderne.
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: l’étoile brillante du matin
  rationale: La formulation française réunit naturellement les deux qualificatifs apposés en grec tout en conservant l’image et le titre.
theological_decisions:
- issue: Auto-identification messianique et davidique
  choice: la racine et le descendant de David
  alternative: la source et le rejeton de David
  rationale: Le texte présente Jésus à la fois comme antérieur à David dans l’image de la racine et comme issu de sa lignée. La traduction conserve cette tension sans l’expliquer ni la résoudre.
- issue: Titre christologique de l’étoile du matin
  choice: l’étoile brillante du matin
  alternative: l’étoile du matin, celle qui brille
  rationale: Le titre est conservé comme auto-désignation directe de Jésus, sans lui ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Moi, Jésus » marque l’emphase sans lourdeur; « rendre témoignage » maintient la solennité et le champ lexical du témoignage. La majuscule à « Églises » souligne ici les communautés chrétiennes destinataires sans introduire une dénomination particulière.
