  text: Λέγει ὁ μαρτυρῶν ταῦτα· Ναί· ἔρχομαι ταχύ. Ἀμήν· ⸀ἔρχου, κύριε Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/020.yaml
  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: fr
  text: 'Celui qui témoigne de ces choses dit : « Oui, je viens bientôt[a]. » Amen. Viens, Seigneur Jésus !'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rapidement ». L’adverbe grec peut souligner soit la proximité dans le temps, soit la rapidité de l’arrivée ou de l’action.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: dit
  rationale: Le présent grec introduit directement la parole; « dit » est naturel et sobre en français.
- source_word: ὁ μαρτυρῶν
  choice: Celui qui témoigne
  rationale: Cette formulation conserve la valeur substantivée du participe présent ainsi que la nuance de témoignage de μαρτυρέω.
- source_word: ταῦτα
  choice: de ces choses
  rationale: Le pluriel démonstratif renvoie au contenu de la révélation qui vient d’être donnée.
- source_word: Ναί
  choice: Oui
  rationale: « Oui » rend simplement l’affirmation directe, sans lui ajouter une solennité absente du terme grec.
- source_word: ἔρχομαι
  choice: je viens
  rationale: En français, le présent « je viens » peut naturellement exprimer une venue annoncée et imminente, sans paraphrase.
- source_word: ταχύ
  choice: bientôt
  rationale: Dans ce contexte, « bientôt » exprime naturellement la proximité temporelle, tandis que la possibilité de comprendre une venue rapide est signalée en note.
- source_word: Ἀμήν
  choice: Amen
  rationale: La translittération traditionnelle conserve la réponse liturgique et l’assentiment priant.
- source_word: ἔρχου
  choice: Viens
  rationale: L’impératif direct préserve la brièveté et l’urgence de l’appel.
- source_word: κύριε
  choice: Seigneur
  rationale: « Seigneur » est le titre français établi et convient à l’adresse révérencieuse faite à Jésus.
- source_word: Ἰησοῦ
  choice: Jésus
  rationale: Le nom propre suit sa forme française conventionnelle.
theological_decisions:
- issue: Sens de ταχύ dans la promesse de la venue du Christ
  choice: bientôt
  alternative: rapidement, avec promptitude
  rationale: L’adverbe peut désigner soit la proximité dans le temps, soit la rapidité de l’arrivée ou de l’action. Le texte principal retient le sens temporel le plus naturel ici, mais la note maintient l’autre possibilité afin de ne pas trancher silencieusement une tension eschatologique réelle.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition concise entre la promesse « je viens » et la prière « Viens » est conservée. Les points d’exclamation rendent l’assentiment et l’appel final avec leur force, sans amplification lexicale.
