id: REV.22.6
reference: Revelation 22:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: fr
  text: 'Et il m’a dit : « Ces paroles sont dignes de confiance et vraies. Le Seigneur, le Dieu des esprits des prophètes, a envoyé son ange pour montrer à ses esclaves[b] ce qui doit arriver bientôt[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rapidement ». L’expression grecque peut souligner soit la proximité dans le temps (« bientôt »), soit la rapidité avec laquelle les événements se produiront (« rapidement »).
    reason: alternative_reading
  - marker: b
    text: Ou « serviteurs », voire « serviteurs liés à leur maître ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστοὶ
  choice: dignes de confiance
  rationale: Cette expression française naturelle appliquée à des paroles en souligne la fiabilité, sans la confondre avec la fidélité personnelle.
- source_word: ἀληθινοί
  choice: vraies
  rationale: « Vraies » rend directement la véracité et l’authenticité des paroles dans cette coordination.
- source_word: κύριος
  choice: Seigneur
  rationale: Titre divin usuel qui conserve la portée biblique et l’apposition avec « le Dieu des esprits des prophètes ».
- source_word: ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: le Dieu des esprits des prophètes
  rationale: Le maintien des génitifs préserve l’ambiguïté concernant la relation de Dieu aux esprits des prophètes, sans introduire une paraphrase sur l’inspiration.
- source_word: ἄγγελον
  choice: ange
  rationale: Dans ce contexte apocalyptique, le terme désigne naturellement un messager céleste.
- source_word: δούλοις
  choice: esclaves
  rationale: Le mot conserve l’idée forte d’appartenance et de dépendance contenue dans δοῦλος; les équivalents français plus traditionnels sont signalés en note.
- source_word: δεῖξαι
  choice: montrer
  rationale: Équivalent direct et naturel dans le cadre des visions de l’Apocalypse.
- source_word: ἃ δεῖ γενέσθαι
  choice: ce qui doit arriver
  rationale: Formulation française idiomatique qui conserve la nécessité exprimée par δεῖ et la survenue des événements.
- source_word: ἐν τάχει
  choice: bientôt
  rationale: Le contexte met principalement l’accent sur la proximité temporelle; la possibilité d’une réalisation rapide est conservée en note.
- source_word: Καὶ εἶπέν μοι
  choice: Et il m’a dit
  rationale: Le simple « Et » reflète καί sans le renforcer en transition temporelle.
theological_decisions:
- issue: Sens eschatologique de ἐν τάχει
  choice: bientôt
  alternative: rapidement
  rationale: L’expression peut indiquer soit la proximité temporelle, soit la rapidité d’exécution. Le texte principal retient l’imminence suggérée par le contexte, tandis que la note préserve l’autre nuance.
- issue: Portée de δοῦλοι pour le peuple de Dieu
  choice: esclaves
  alternative: serviteurs
  rationale: « Esclaves » maintient explicitement l’appartenance entière au maître exprimée par δοῦλοι, sans atténuer cette image; une note fournit les formulations françaises plus usuelles.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec lorsque cela préserve une ambiguïté théologique réelle; les deux longues propositions grecques sont séparées en français pour faciliter la lecture. Les marqueurs de notes sont placés sur les expressions qu’ils expliquent.
