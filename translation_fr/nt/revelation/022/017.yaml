id: REV.22.17
reference: Revelation 22:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: fr
  text: 'L’Esprit et l’épouse disent : « Viens ! » Que celui qui entend dise : « Viens ! »[b] Que celui qui a soif vienne ; que celui qui veut prenne de l’eau de la vie gratuitement.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sans rien payer » ou « comme un don ».'
    reason: lexical_alternative
  - marker: b
    text: Les deux premiers appels, « Viens ! », sont souvent compris comme une demande adressée au Seigneur pour qu’il vienne ; les propositions suivantes invitent alors la personne qui a soif et qui le veut à venir recevoir la vie.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Dans ce contexte de l’Apocalypse, l’expression désigne le plus naturellement l’Esprit saint. La majuscule indique ce référent en français.
- source_word: ἡ νύμφη
  choice: l’épouse
  rationale: « Épouse » conserve l’image symbolique sans l’expliciter comme l’Église, le peuple de Dieu ou la nouvelle Jérusalem.
- source_word: λέγουσιν
  choice: disent
  rationale: Le présent simple rend naturellement la proclamation actuelle et continue.
- source_word: Ἔρχου
  choice: Viens !
  rationale: L’impératif direct à la deuxième personne est rendu simplement, sans ajouter de destinataire absent du grec.
- source_word: ὁ ἀκούων
  choice: celui qui entend
  rationale: Cette formulation française naturelle conserve la valeur générique du participe substantivé.
- source_word: εἰπάτω
  choice: Que … dise
  rationale: Le subjonctif à valeur injonctive rend naturellement l’impératif grec à la troisième personne.
- source_word: ὁ διψῶν
  choice: celui qui a soif
  rationale: L’expression idiomatique préserve la métaphore de la soif.
- source_word: ἐρχέσθω
  choice: Que … vienne
  rationale: Le subjonctif injonctif conserve la force d’invitation ou d’exhortation de l’impératif.
- source_word: ὁ θέλων
  choice: celui qui le désire
  rationale: « Désire » reflète θέλω, tandis que le pronom « le » reprend naturellement en français l’accès à l’eau offerte sans en modifier le sens.
- source_word: λαβέτω
  choice: qu’il prenne
  rationale: « Prendre » maintient l’image concrète et le parallélisme impératif ; « recevoir » serait également possible.
- source_word: ὕδωρ ζωῆς
  choice: de l’eau de la vie
  rationale: Le génitif est conservé littéralement ; « eau vive » modifierait la construction et la nuance.
- source_word: δωρεάν
  choice: gratuitement
  rationale: Ce terme exprime clairement que l’eau est offerte sans paiement, tout en conservant la fonction adverbiale du grec.
theological_decisions:
- issue: Destinataire des deux appels « Viens ! »
  choice: Le texte ne précise pas le destinataire ; les deux appels restent donc ouverts, avant que l’invitation ne s’adresse explicitement à celui qui a soif.
  alternative: Comprendre les deux premiers appels comme adressés au Seigneur, puis la suite comme une invitation faite à la personne assoiffée.
  rationale: Le grec répète l’impératif à la deuxième personne sans complément, puis passe aux impératifs à la troisième personne. La traduction ne résout pas une ambiguïté que le texte maintient.
- issue: Référent symbolique de « l’épouse »
  choice: Conserver « l’épouse » sans explication dans le corps du verset.
  alternative: Traduire explicitement par « l’Église », « le peuple de Dieu » ou « la nouvelle Jérusalem ».
  rationale: L’imagerie de l’Apocalypse superpose ces associations ; une explicitation réduirait la portée du symbole.
- issue: Portée de δωρεάν
  choice: Rendre le don par « gratuitement ».
  alternative: « sans rien payer » ou « comme un don ».
  rationale: Le terme peut mettre en relief soit l’absence de coût, soit le caractère offert ; « gratuitement » préserve les deux dimensions avec concision.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe injonctive avec « Que… » garde le parallélisme du grec. « Épouse » est préféré à « mariée », plus événementiel en français contemporain. Les marqueurs [a] et [b] sont placés après la proposition à laquelle ils se rapportent.
