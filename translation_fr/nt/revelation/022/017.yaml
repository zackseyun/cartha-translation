  naturalness: 'Le français est moderne, clair et d’un registre approprié. Le déplacement des appels de note rend leurs ancrages explicites : la note sur l’ambiguïté des deux premiers « Viens ! » suit le second, et l’alternative de δωρεάν suit « gratuitement ».'
