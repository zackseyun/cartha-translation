id: REV.22.4
reference: Revelation 22:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὄψονται τὸ πρόσωπον αὐτοῦ, καὶ τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: fr
  text: Ils verront son visage[a], et son nom sera sur leur front.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils contempleront son visage. »'
    reason: Alternative lexicale possible pour ὄψονται ; « verront » reste toutefois plus direct et naturel.
  - marker: b
    text: Les pronoms singuliers « son » peuvent renvoyer à Dieu ou refléter, dans le contexte immédiat, le règne divin commun de Dieu et de l’Agneau.
    reason: Préserver l’ambiguïté théologique et référentielle du grec.
lexical_decisions:
- source_word: ὄψονται
  choice: ils verront
  rationale: Le futur de ὁράω exprime ici simplement l’action future de voir. « Ils verront » est naturel en français moderne et conserve la force directe du grec.
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: son visage
  rationale: πρόσωπον désigne d’abord le visage. Avec ὄψονται, le sens concret « voir son visage » est le plus probable et préserve la portée visuelle et relationnelle de l’expression.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: son nom
  rationale: « Nom » rend directement ὄνομα sans expliciter dans le texte les idées possibles d’identité, d’appartenance ou de caractère.
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: sur leur front
  rationale: ἐπί avec le génitif indique ici une position. En français idiomatique, le singulier distributif « leur front » désigne le front de chacun, bien que le grec emploie le pluriel.
- source_word: καὶ … καὶ
  choice: et … et
  rationale: Les deux coordinations sont conservées afin de respecter la structure additive du grec.
- source_word: αὐτοῦ
  choice: son
  rationale: Le pronom est rendu directement sans remplacer son référent par « Dieu » ou « l’Agneau », ce qui maintient l’ambiguïté contextuelle du texte grec.
theological_decisions:
- issue: Référent de « son » dans « son visage » et « son nom »
  choice: Conserver le pronom possessif « son » sans en préciser le référent.
  alternative: Expliciter « de Dieu » ou comprendre le singulier à la lumière du règne commun de Dieu et de l’Agneau.
  rationale: Le contexte immédiat associe étroitement Dieu et l’Agneau (Apocalypse 22.3), tandis que le grec emploie des pronoms singuliers. La traduction conserve cette tension sans imposer une identification plus étroite que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste proche de la syntaxe grecque tout en employant le singulier distributif naturel « leur front ». Les marqueurs de notes sont placés après les expressions auxquelles ils se rapportent.
