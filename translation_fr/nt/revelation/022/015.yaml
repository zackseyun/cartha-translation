    issue: Ellipse verbale dans « Dehors, les chiens… »
    rationale: Bien que calquée sur la construction nominale du grec, elle est moins idiomatique en français moderne. L’ajout de « se trouvent » ne modifie pas le sens et rend explicitement la prédication d’exclusion.
  - severity: low
    issue: « Ceux qui pratiquent la magie » est plus large que φάρμακοι
    rationale: Dans le contexte de l’Apocalypse, le terme désigne des praticiens de sorcellerie/arts occultes. « Ceux qui pratiquent la sorcellerie » est plus précis sans imposer une lecture doctrinale.
