id: REV.22.15
reference: Revelation 22:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: fr
  text: À l’extérieur se trouvent les chiens[a], ceux qui pratiquent la sorcellerie, ceux qui se livrent à l’immoralité sexuelle, les meurtriers, les idolâtres, et quiconque aime et pratique le mensonge[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « chiens » est probablement une image désignant des personnes exclues et moralement impures; certains comprennent le terme de façon plus précise.
    reason: cultural_note
  - marker: b
    text: 'Ou : « aime et pratique un mensonge »; le grec peut aussi désigner plus largement la fausseté.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξω
  choice: Dehors
  rationale: L’adverbe placé en tête souligne l’exclusion hors de la ville; la phrase nominale reste naturelle et solennelle en français.
- source_word: κύνες
  choice: les chiens
  rationale: Conserve l’image concrète et métaphorique du grec sans imposer une identification particulière contestée.
- source_word: φάρμακοι
  choice: ceux qui pratiquent la magie
  rationale: Dans l’Apocalypse, le terme désigne les praticiens d’arts magiques ou de sorcellerie; cette formulation est claire en français moderne et évite les connotations féeriques de « sorciers ».
- source_word: πόρνοι
  choice: ceux qui vivent dans l’immoralité sexuelle
  rationale: Rend la catégorie large d’inconduite sexuelle et la portée caractéristique du substantif désignant ceux qui s’y livrent.
- source_word: φονεῖς
  choice: les meurtriers
  rationale: Équivalent direct du nom grec désignant ceux qui commettent un meurtre.
- source_word: εἰδωλολάτραι
  choice: les idolâtres
  rationale: Terme français standard, précis et compact, adapté au rythme de la liste.
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: quiconque aime et pratique le mensonge
  rationale: « Quiconque » rend naturellement πᾶς avec les participes; « pratique » exprime un comportement habituel, tandis que « le mensonge » peut désigner la fausseté comme domaine moral.
theological_decisions:
- issue: Faut-il interpréter « les chiens » comme un groupe précis plutôt que conserver la métaphore?
  choice: Conserver « les chiens » dans le texte principal.
  alternative: les impurs; les débauchés; un groupe particulier d’exclus
  rationale: Le grec emploie l’image concrète κύνες. La conserver respecte le langage symbolique de l’Apocalypse et évite de trancher une identification débattue.
- issue: ψεῦδος désigne-t-il « un mensonge » particulier ou le mensonge/la fausseté en général?
  choice: le mensonge
  alternative: un mensonge; la fausseté
  rationale: Avec « aime et pratique », le mot paraît désigner une orientation habituelle vers ce qui est faux, tout en conservant le lien avec l’acte de mentir. Une note maintient l’autre possibilité grammaticale.
translation_notes:
  register: Français international moderne, digne et accessible. La liste conserve sa vigueur nominale, tandis que les périphrases employées pour φάρμακοι et πόρνοι évitent des termes vieillis ou trop étroits. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
