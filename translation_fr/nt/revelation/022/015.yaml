review_pass:
  verdict: revise
  source_fidelity: Le sens de la liste grecque est bien rendu, y compris l’image littérale « les chiens » et la portée habituelle de « aime et pratique ». Toutefois, « ceux qui pratiquent la sorcellerie » correspond plus précisément à φάρμακοι dans l’Apocalypse que la formulation plus générale « pratiquent la magie ».
  naturalness: La phrase nominale « Dehors, les chiens… » imite fortement le grec mais demeure elliptique et peu naturelle en français international contemporain. « À l’extérieur se trouvent… » conserve l’antéposition et l’exclusion tout en formant une phrase française fluide et solennelle.
  terminology: « Idolâtres » et « meurtriers » sont exacts. « Ceux qui se livrent à l’immoralité sexuelle » exprime plus directement la participation caractéristique visée par πόρνοι. « Le mensonge » convient pour ψεῦδος, avec une note qui préserve l’alternative « un mensonge » et le sens plus large de « fausseté ».
  issues:
