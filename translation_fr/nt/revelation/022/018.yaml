id: REV.22.18
reference: Revelation 22:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: fr
  text: 'Je témoigne[b] à toute personne qui entend les paroles de la prophétie de ce livre[a] : si quelqu’un y ajoute quoi que ce soit, Dieu ajoutera sur lui les fléaux qui sont écrits dans ce livre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rouleau »; le mot grec peut désigner un rouleau, forme matérielle courante pour les écrits anciens.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « J’en atteste »; le verbe grec appartient au langage du témoignage, et non seulement à celui de l’avertissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: Je témoigne
  rationale: Le verbe μαρτυρέω appartient au langage du témoignage. « Je témoigne » conserve sa force solennelle sans le réduire à une simple formule d’avertissement.
- source_word: παντὶ τῷ ἀκούοντι
  choice: à toute personne qui entend
  rationale: Cette formulation inclusive et naturelle rend le datif avec participe présent, sans alourdir la phrase française.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: les paroles de la prophétie
  rationale: « Paroles » rend directement λόγους, tandis que « prophétie » conserve la nature prophétique du contenu au lieu de la réduire à une prédiction.
- source_word: τοῦ βιβλίου τούτου / ἐν τῷ βιβλίῳ τούτῳ
  choice: de ce livre / dans ce livre
  rationale: « Livre » est le terme français courant et convient à la référence littéraire; la répétition du grec est maintenue dans le verset.
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: si quelqu’un y ajoute quoi que ce soit
  rationale: Le pronom adverbial « y » renvoie naturellement aux paroles précédemment mentionnées. « Quoi que ce soit » explicite en français l’objet indéfini impliqué par la construction grecque.
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: Dieu lui ajoutera
  rationale: La reprise du verbe « ajouter » préserve la correspondance rhétorique voulue entre l’acte humain et la réponse divine. La tournure est légèrement marquée, mais reste intelligible et évite d’introduire un complément absent du grec, tel que « à son sort ».
- source_word: τὰς πληγὰς
  choice: les fléaux
  rationale: Dans l’Apocalypse, πληγαί désigne régulièrement les fléaux du jugement divin; ce choix maintient les échos internes du livre.
- source_word: τὰς γεγραμμένας
  choice: qui sont écrits
  rationale: Le parfait passif indique ce qui se trouve durablement consigné par écrit. La formulation française en conserve le sens sans lourdeur excessive.
theological_decisions:
- issue: Témoignage solennel ou simple avertissement
  choice: Je témoigne
  alternative: J’avertis
  rationale: Le verbe grec relève explicitement du témoignage. La portée d’avertissement ressort déjà de la menace conditionnelle qui suit et ne doit pas remplacer la valeur propre du verbe.
- issue: Correspondance entre l’ajout humain et la réponse divine
  choice: Répéter le verbe « ajouter »
  alternative: Dieu fera tomber sur lui / Dieu lui infligera
  rationale: Le grec emploie deux formes du même verbe afin d’établir une réciprocité verbale frappante. La traduction maintient cette tension plutôt que de lisser la seconde proposition.
translation_notes:
  register: Français international moderne, solennel et accessible. La syntaxe demeure naturelle, sauf la tournure volontairement marquée « Dieu lui ajoutera », retenue pour préserver le jeu verbal central du grec.
