id: REV.22.7
reference: Revelation 22:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: fr
  text: Et voici, je viens bientôt[a]. Heureux celui qui garde les paroles de la prophétie de ce livre[b] !
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « rapidement » : le grec peut évoquer soit la proximité dans le temps (« bientôt »), soit la rapidité ou le caractère soudain de la venue.'
    reason: lexical_alternative
  - marker: b
    text: Ou « de ce rouleau ».
    reason: cultural_note
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: Et voici
  rationale: Conserve à la fois la coordination καί et la force déictique de ἰδού, qui attire solennellement l’attention, dans une tournure française naturelle au registre apocalyptique.
- source_word: ἔρχομαι
  choice: je viens
  rationale: Le présent grec à portée future est rendu naturellement par le présent français, qui peut exprimer une venue imminente sans ajouter d’explication.
- source_word: ταχύ
  choice: bientôt
  rationale: Dans ce contexte, l’adverbe exprime le plus naturellement la proximité temporelle. Une note conserve la possibilité d’une venue rapide ou soudaine.
- source_word: μακάριος
  choice: Heureux
  rationale: Formule française consacrée pour une béatitude, exprimant une condition favorable accordée par Dieu plutôt qu’une simple émotion passagère.
- source_word: ὁ τηρῶν
  choice: celui qui garde
  rationale: Préserve l’idée de garder, observer et prendre au sérieux, sans réduire le sens au seul fait d’obéir.
- source_word: τοὺς λόγους
  choice: les paroles
  rationale: Rend le pluriel concret λόγους et évite de le résumer par « message ».
- source_word: τῆς προφητείας
  choice: de la prophétie
  rationale: Maintient la catégorie littéraire et théologique explicite ainsi que la relation génitive du grec.
- source_word: τοῦ βιβλίου τούτου
  choice: de ce livre
  rationale: « Livre » est la désignation française la plus idiomatique de l’ouvrage, tandis que la réalité matérielle possible du rouleau est signalée en note.
theological_decisions:
- issue: Identité de celui qui dit « je viens bientôt »
  choice: Ne pas ajouter de nom au locuteur
  alternative: 'Préciser dans le texte : « Moi, Jésus, je viens bientôt »'
  rationale: Le grec ne contient ici que la première personne. Le contexte littéraire permet d’identifier le locuteur ; la traduction ne doit donc pas insérer un nom absent du verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Et voici » conserve la solennité du discours apocalyptique sans archaïsme excessif ; « garde » préserve volontairement l’étendue sémantique du verbe grec.
