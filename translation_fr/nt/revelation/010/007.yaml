id: REV.10.7
reference: Revelation 10:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: fr
  text: Mais, aux jours où la voix du septième ange se fera entendre, quand il sera sur le point de sonner de la trompette, le mystère de Dieu s’accomplira, conformément à la bonne nouvelle que Dieu a annoncée à ses propres esclaves[a], les prophètes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec peut désigner des serviteurs ou des esclaves ; ici, l’expression « ses propres » souligne leur appartenance à Dieu.
    reason: Alternative lexicale pour δοῦλος et explication de la nuance contextuelle.
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque simplement le contraste avec ce qui précède.
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: aux jours où la voix du septième ange se fera entendre
  rationale: Conserve l’expression apocalyptique « aux jours » et le terme φωνή (« voix, son »), tout en produisant une tournure française intelligible.
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: quand il sera sur le point de sonner de la trompette
  rationale: « Sera sur le point de » exprime l’imminence portée par μέλλῃ ; « sonner de la trompette » explicite naturellement en français l’instrument impliqué par σαλπίζειν.
- source_word: καὶ ἐτελέσθη
  choice: alors … sera mené à son accomplissement
  rationale: Le futur français s’accorde avec la proposition temporelle orientée vers l’avenir, tandis que « mené à son accomplissement » rend l’idée d’achèvement ou de réalisation sans la réduire à une simple cessation.
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: le mystère de Dieu
  rationale: Maintient le terme théologique et l’ambiguïté du génitif, au lieu de paraphraser le mystère comme un dessein précis.
- source_word: ὡς εὐηγγέλισεν
  choice: comme Dieu en a annoncé la bonne nouvelle
  rationale: Rend la valeur de « proclamer une bonne nouvelle » et explicite Dieu comme sujet afin d’éviter en français une référence pronominale incertaine ; « en » rattache l’annonce au mystère sans en définir davantage le contenu.
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: à ses propres esclaves
  rationale: « Esclaves » préserve la relation d’appartenance accentuée par ἑαυτοῦ (« ses propres »). Une note fournit « serviteurs », plus idiomatique mais moins explicite quant à cette appartenance.
- source_word: τοὺς προφήτας
  choice: les prophètes
  rationale: Conserve l’apposition qui identifie les esclaves de Dieu.
theological_decisions:
- issue: Valeur temporelle et aspectuelle de ἐτελέσθη
  choice: sera mené à son accomplissement
  alternative: 'fut accompli / présent prophétique : « aura été accompli » ou « s’accomplit »'
  rationale: Bien que le grec emploie un aoriste, la construction avec ὅταν et μέλλῃ situe l’événement dans la perspective future. Le futur français communique cette orientation sans imposer un calendrier eschatologique particulier.
- issue: Traduction de δοῦλος pour les prophètes de Dieu
  choice: esclaves
  alternative: serviteurs
  rationale: La présence de ἑαυτοῦ souligne qu’ils appartiennent à Dieu. « Esclaves » conserve cette force relationnelle, tandis que la note signale l’autre traduction française courante sans atténuer silencieusement le grec.
- issue: Sens de μυστήριον τοῦ θεοῦ
  choice: mystère de Dieu
  alternative: dessein secret de Dieu
  rationale: La formulation retenue préserve à la fois le terme biblique et l’ambiguïté quant au contenu précis du mystère, sans importer un système eschatologique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le registre apocalyptique de « aux jours » et « mystère », tout en évitant un calque trop obscur de « la voix du septième ange ». Le marqueur [a] figure immédiatement après le mot concerné.
