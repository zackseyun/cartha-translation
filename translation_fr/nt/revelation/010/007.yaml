    rationale: Le pronom « en » ne possède pas d’antécédent suffisamment explicite en français et la construction ne rend pas naturellement εὐηγγέλισεν τοὺς ... προφήτας. Une relative (« la bonne nouvelle que Dieu a annoncée à… ») exprime clairement l’annonce aux prophètes, sans définir le mystère.
  - severity: low
    issue: « Sera mené à son accomplissement » est pesant.
