revisions:
- from: Mais aux jours où la voix du septième ange se fera entendre, quand il sera sur le point de sonner de la trompette, alors le mystère de Dieu sera mené à son accomplissement, comme Dieu en a annoncé la bonne nouvelle à ses propres esclaves[a], les prophètes.
  to: Mais, aux jours où la voix du septième ange se fera entendre, quand il sera sur le point de sonner de la trompette, le mystère de Dieu s’accomplira, conformément à la bonne nouvelle que Dieu a annoncée à ses propres esclaves[a], les prophètes.
  rationale: La révision remplace deux tournures françaises lourdes ou ambiguës. « S’accomplira » rend l’orientation future du passage sans imposer une lecture eschatologique précise. « Conformément à la bonne nouvelle que Dieu a annoncée à… » restitue naturellement la valeur de εὐηγγέλισεν et son destinataire, tout en laissant le mystère non défini. La terminologie théologique et l’ancrage de la note sont préservés.
