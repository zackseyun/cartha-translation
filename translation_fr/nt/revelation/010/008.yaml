id: REV.10.8
reference: Revelation 10:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: fr
  text: 'Et la voix que j’avais entendue venant du ciel me parla de nouveau et dit : « Va, prends le rouleau[a] ouvert dans la main de l’ange qui se tient debout sur la mer et sur la terre ferme[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « petit rouleau ». Les versets voisins emploient une forme diminutive, mais ce verset porte βιβλίον, « rouleau ».
    reason: alternative_reading
  - marker: b
    text: Ou « terre ».
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: voix
  rationale: Dans ce contexte, φωνή désigne une voix céleste qui parle, et non un simple son.
- source_word: πάλιν
  choice: de nouveau
  rationale: 'Le terme marque la répétition : la voix céleste s’adresse encore une fois à Jean.'
- source_word: λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: me parla de nouveau et dit
  rationale: Cette formulation française naturelle conserve les deux participes grecs et rend μετά avec le pronom indirect idiomatique « me ».
- source_word: Ὕπαγε λάβε
  choice: Va prendre
  rationale: Les deux impératifs forment en français une directive fluide et directe, sans ajouter de nuance étrangère au texte.
- source_word: βιβλίον
  choice: rouleau
  rationale: Dans le cadre historique et visionnaire de l’Apocalypse, il s’agit vraisemblablement d’un rouleau plutôt que d’un livre relié; le diminutif n’est pas présent dans ce verset.
- source_word: ἠνεῳγμένον
  choice: ouvert
  rationale: Le participe parfait passif décrit l’état résultant de l’ouverture; « ouvert » l’exprime naturellement en français.
- source_word: ἐν τῇ χειρὶ
  choice: dans la main
  rationale: La formulation conserve la préposition grecque ἐν et décrit la position du rouleau sans expliciter « de la main », qui reste implicite dans l’action de prendre.
- source_word: ἄγγελος
  choice: ange
  rationale: Le contexte visionnaire désigne un être céleste, non un messager humain.
- source_word: ἑστῶτος
  choice: qui se tient debout
  rationale: Le parfait de ἵστημι exprime un état durable; cette tournure restitue clairement la posture de l’ange.
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: sur la mer et sur la terre ferme
  rationale: Face à « la mer », « la terre ferme » exprime clairement le contraste spatial de γῆ tout en conservant la répétition de « sur ».
theological_decisions:
- issue: Sens de γῆ dans l’image apocalyptique
  choice: terre ferme
  alternative: terre
  rationale: Le passage décrit la position physique de l’ange sur la mer et sur son pendant terrestre. « Terre ferme » rend ce contraste sans imposer une interprétation cosmologique; « terre » demeure possible.
- issue: Continuité de βιβλίον avec les versets voisins
  choice: rouleau
  alternative: petit rouleau; livre
  rationale: Le présent verset porte βιβλίον, sans diminutif. Traduire « petit rouleau » harmoniserait le texte avec les versets voisins; la traduction principale respecte donc la forme de ce verset et signale l’autre possibilité en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec sans lourdeur; « me parla » est plus idiomatique que « parla avec moi », et « Va prendre » rend naturellement la succession des deux impératifs.
