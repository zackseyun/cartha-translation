id: REV.10.10
reference: Revelation 10:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: fr
  text: Puis je pris le petit rouleau[a] de la main de l’ange et je le mangeai ; dans ma bouche, il était doux comme du miel, et quand je l’eus mangé, mon estomac devint amer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « petit livre ». Le terme grec est un diminutif qui désigne un petit document écrit ; « petit rouleau » correspond probablement mieux à sa forme dans l’Antiquité.
    reason: lexical_alternative
  - marker: b
    text: Ou « mon ventre devint amer ». Le grec peut aussi se rendre par « mon estomac fut rendu amer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: petit rouleau
  rationale: Le diminutif désigne un petit document écrit; « rouleau » correspond vraisemblablement à sa forme ancienne et évite l’anachronisme possible de « petit livre ».
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: de la main de l’ange
  rationale: Rendu direct et idiomatique qui conserve l’image concrète de la remise par l’ange.
- source_word: κατέφαγον
  choice: je le mangeai
  rationale: Le verbe peut avoir une valeur intensive, mais « mangeai » rend sobrement l’acte symbolique sans imposer l’idée plus forte de dévorer.
- source_word: ὡς μέλι γλυκύ
  choice: doux comme du miel
  rationale: Formulation française naturelle qui conserve explicitement la comparaison.
- source_word: ὅτε ἔφαγον αὐτό
  choice: quand je l’eus mangé
  rationale: Le passé antérieur marque naturellement, dans ce récit au passé simple, que l’amertume suit l’ingestion, sans attribuer au seul aoriste une valeur temporelle excessive.
- source_word: ἐπικράνθη
  choice: devint amer
  rationale: Le passif grec peut décrire l’entrée dans un état. « Devint amer » est naturel en français et préserve le changement subi sans suggérer explicitement un agent absent du texte.
- source_word: κοιλία
  choice: estomac
  rationale: « Estomac » est clair en français moderne et convient au contexte de l’ingestion; « ventre » demeure une possibilité plus littérale et plus large.
theological_decisions:
- issue: Acte symbolique consistant à manger le rouleau
  choice: Conserver sans l’expliquer l’image de la douceur dans la bouche et de l’amertume dans l’estomac.
  alternative: Expliciter dans la traduction que la douceur et l’amertume représentent, par exemple, la joie de recevoir la parole et la douleur du jugement.
  rationale: Le verset ne donne pas lui-même l’interprétation complète du symbole; l’ajouter résoudrait une tension que le texte maintient.
- issue: Valeur du passif ἐπικράνθη
  choice: Traduire le changement d’état par « devint amer » sans nommer de cause.
  alternative: « fut rendu amer », qui reproduit plus formellement le passif et pourrait laisser davantage entendre une action causative.
  rationale: Le grec ne nomme aucun agent. Le français idiomatique permet de garder la transformation subie sans introduire une causalité théologique explicite.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple et le passé antérieur conviennent au registre narratif biblique soutenu sans être archaïques. La coordination finale emploie « mais » pour rendre naturellement le contraste contextuel porté par καί.
