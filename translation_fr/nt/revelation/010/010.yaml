  terminology: « Petit rouleau » rend bien βιβλαρίδιον et conserve l’idée diminutive. « Estomac » est un équivalent moderne approprié de κοιλία dans ce contexte ; « ventre » peut figurer en note. La formulation passive proposée en note est grammaticalement possible, mais doit être présentée comme une possibilité de rendu de la voix grecque, sans lui attribuer un agent.
  issues:
