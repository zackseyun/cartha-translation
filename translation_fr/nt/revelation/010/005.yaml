source:
  edition: SBLGNT
  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: fr
  text: Et l’ange que j’avais vu debout sur la mer et sur la terre[a] leva la main droite vers le ciel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur la terre ferme ».
    reason: lexical_alternative
  - marker: b
    text: Ou « au ciel ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: ange
  rationale: Dans l’Apocalypse, le référent est un être céleste; « ange » est donc le terme naturel et précis.
- source_word: ὃν εἶδον
  choice: que j’avais vu
  rationale: Le plus-que-parfait situe naturellement en français cette vision avant le geste maintenant raconté, sans changer la valeur référentielle du grec.
- source_word: ἑστῶτα
  choice: debout
  rationale: Le participe parfait décrit l’état ou la posture présente de l’ange; « debout » est idiomatique et fidèle.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: sur la mer
  rationale: Cette formulation conserve l’image saisissante du grec et reprend le cadre immédiat.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: En contraste avec « la mer », « la terre » désigne naturellement la partie ferme; le français permet de préserver aussi la portée plus large de γῆ.
- source_word: ἦρεν
  choice: leva
  rationale: « Lever la main » est l’expression française naturelle pour ce geste solennel et rend directement αἴρω.
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: la main droite
  rationale: La construction française avec article défini exprime idiomatiquement la possession lorsqu’il s’agit d’une partie du corps, tout en conservant la précision « droite ».
- source_word: εἰς τὸν οὐρανόν
  choice: vers le ciel
  rationale: « Vers » exprime clairement la direction du geste; « ciel » garde ici le registre biblique et théologique de οὐρανός.
theological_decisions:
- issue: Sens de γῆ en contraste avec θάλασσα
  choice: terre
  alternative: terre ferme / sol
  rationale: « Terre » conserve le contraste spatial avec la mer tout en évitant de réduire inutilement l’éventuelle portée cosmique du terme grec.
- issue: Sens de οὐρανός
  choice: ciel
  alternative: voûte céleste
  rationale: Le geste prépare le serment du verset suivant et vise le domaine céleste, non seulement une direction physique; « ciel » maintient cette résonance sans surinterprétation.
translation_notes:
  register: Français moderne, international et digne. La phrase reste fluide et visuelle; « debout », « leva la main droite » et « vers le ciel » sont immédiatement compréhensibles sans affaiblir le caractère solennel de la scène.
