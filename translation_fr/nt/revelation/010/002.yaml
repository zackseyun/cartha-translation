id: REV.10.2
reference: Revelation 10:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: fr
  text: Il tenait dans sa main un petit rouleau qui avait été ouvert[a]. Il posa le pied droit sur la mer et le gauche sur la terre[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui était ouvert »; le grec indique qu’il avait été ouvert et qu’il le restait.
    reason: aspectual_clarification
  - marker: b
    text: Ou « sur la terre ferme ». Le mot grec peut désigner la terre, le sol ou la terre ferme; ici, il s’oppose à « la mer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων
  choice: Il tenait
  rationale: Le participe présent se rattache à l’ange puissant du verset précédent. Une proposition à l’imparfait rend ce lien naturellement en français et exprime qu’il avait le rouleau en main.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: dans sa main
  rationale: Rend directement la construction grecque et conserve le singulier explicite.
- source_word: βιβλαρίδιον
  choice: un petit rouleau
  rationale: Le diminutif désigne un petit livre ou rouleau. « Rouleau » convient à l’image du document écrit dans ce contexte ancien, tandis que la variante « petit livre » est signalée en note.
- source_word: ἠνεῳγμένον
  choice: qui avait été ouvert
  rationale: 'Le participe parfait passif évoque une ouverture accomplie dont le résultat demeure : le rouleau se trouve ouvert.'
- source_word: ἔθηκεν
  choice: posa
  rationale: « Poser le pied » est l’expression française naturelle et garde le caractère délibéré de l’action.
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιόν
  choice: le pied droit
  rationale: Rend clairement le nom et l’adjectif grecs sans alourdir la formulation par le possessif, inutile en français avec une partie du corps.
- source_word: ἐπὶ τῆς θαλάσσης
  choice: sur la mer
  rationale: Équivalent direct et naturel, qui conserve l’image visionnaire.
- source_word: τὸν δὲ εὐώνυμον
  choice: et le gauche
  rationale: Le nom « pied » est naturellement sous-entendu dans la structure parallèle française; δέ marque ici la coordination contrastive.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: « Terre » est l’équivalent français courant de γῆ et forme un contraste naturel avec « mer », tout en laissant ouverte la portée locale ou plus vaste du terme.
theological_decisions:
- issue: Portée de γῆ en contraste avec θάλασσα
  choice: terre
  alternative: terre ferme / sol
  rationale: « Terre » préserve l’ambivalence possible entre l’étendue terrestre et la terre ferme, sans imposer une lecture exclusivement locale ou cosmologique. La note indique la variante plus explicitement spatiale.
translation_notes:
  register: Français international moderne, sobre et digne. La participiale grecque initiale est rendue par une proposition à l’imparfait pour assurer un enchaînement naturel avec le verset précédent. La virgule finale est conservée puisque la phrase se poursuit au verset suivant.
