  source_fidelity: Le texte rend fidèlement Καὶ λέγουσίν μοι, Δεῖ σε πάλιν προφητεῦσαι et conserve les quatre groupes. Toutefois, πολλοῖς (« nombreux ») est placé après βασιλεῦσιν et, en grec, se rattache le plus naturellement aux seuls « rois », non à l’ensemble de l’énumération. La traduction proposée étend « beaucoup de » à tous les groupes.
