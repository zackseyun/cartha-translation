id: REV.10.11
reference: Revelation 10:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: fr
  text: 'Et on me dit : « Il faut que tu prophétises de nouveau au sujet de peuples, de nations, de langues et de nombreux rois. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσίν μοι
  choice: l’on me dit
  rationale: Le présent grec est conservé par un présent narratif naturel en français. Le sujet pluriel indéterminé est rendu par « l’on », sans préciser une identité que le texte ne donne pas.
- source_word: Δεῖ σε
  choice: Il faut que tu
  rationale: Exprime clairement la nécessité portée par δεῖ, sans ajouter explicitement sa source.
- source_word: πάλιν προφητεῦσαι
  choice: prophétises de nouveau
  rationale: Rend directement l’idée de reprendre ou renouveler l’activité prophétique.
- source_word: ἐπὶ
  choice: au sujet de
  rationale: Dans ce contexte, la préposition désigne naturellement les peuples, nations, langues et rois comme le sujet ou l’objet du message prophétique, tout en évitant le français moins idiomatique « sur ».
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: beaucoup de peuples, de nations, de langues et de rois
  rationale: Préserve les quatre catégories et rattache naturellement πολλοῖς à l’ensemble de l’énumération, comme le permet sa position finale.
theological_decisions:
- issue: Nature de la nécessité exprimée par δεῖ
  choice: « Il faut » sans préciser l’agent de cette nécessité
  alternative: « Dieu veut que » ou « tu dois »
  rationale: Le texte affirme une nécessité, mais n’en nomme pas explicitement la source dans ce verset; la formulation retenue conserve cette sobriété.
- issue: Portée de ἐπὶ
  choice: « au sujet de »
  alternative: « contre », « devant » ou « auprès de »
  rationale: La valeur thématique convient au contexte de la prophétie et à la série qui suit, sans imposer une orientation exclusivement hostile ni une mission de déplacement.
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif et la tournure impersonnelle « l’on me dit » conservent la forme du grec tout en restant naturels. Aucun marqueur de note n’est requis.
