id: REV.10.6
reference: Revelation 10:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: fr
  text: 'et il jura par celui qui vit pour toujours et à jamais, celui qui a créé le ciel et ce qui s’y trouve, la terre et ce qui s’y trouve, la mer et ce qui s’y trouve : « Il n’y aura plus de délai[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Il n’y aura plus de temps. » Dans ce contexte, χρόνος peut désigner le délai d’attente avant l’intervention finale de Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: il jura
  rationale: L’aoriste de ὀμνύω exprime ici la prestation solennelle d’un serment. « Il jura » est concis, naturel et digne dans ce contexte apocalyptique.
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: par celui qui vit pour toujours et à jamais
  rationale: Le datif désigne celui par qui le serment est prêté. Le participe substantivé est rendu par « celui qui vit », et la formule intensive exprime une durée sans fin.
- source_word: ἔκτισεν
  choice: a créé
  rationale: Dans cette formule cosmique, κτίζω désigne l’acte créateur et non simplement la fabrication.
- source_word: τὸν οὐρανὸν
  choice: le ciel
  rationale: Le singulier désigne ici le domaine céleste dans l’ensemble cosmique ciel-terre-mer.
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: ce qui s’y trouve
  rationale: Cette formulation française naturelle conserve la répétition et la structure ternaire du grec sans alourdir le texte par « les choses ».
- source_word: γῆν
  choice: la terre
  rationale: Dans la triade cosmique, γῆ désigne la terre plutôt qu’un territoire particulier.
- source_word: θάλασσαν
  choice: la mer
  rationale: Le singulier correspond au grec et à la formule de création.
- source_word: ὅτι
  choice: introduit par deux-points et discours direct
  rationale: Après le verbe de serment, ὅτι introduit le contenu du serment. En français, les deux-points suivis du discours direct rendent clairement cette fonction.
- source_word: χρόνος οὐκέτι ἔσται
  choice: Il n’y aura plus de délai
  rationale: Dans le contexte immédiat, χρόνος désigne vraisemblablement le délai avant l’accomplissement annoncé au verset suivant. La note conserve toutefois le sens formel « temps » et l’ambiguïté historique de la formule.
theological_decisions:
- issue: Sens de χρόνος dans la formule du serment
  choice: « délai » dans le texte principal
  alternative: « il n’y aura plus de temps »
  rationale: Le verset suivant annonce l’accomplissement du dessein mystérieux de Dieu, ce qui favorise le sens de fin de l’attente plutôt que celui d’abolition du temps. La traduction littérale reste signalée afin de ne pas effacer l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition « ce qui s’y trouve » préserve le rythme solennel de la formule de création. Le futur simple et le discours direct donnent à l’énoncé la force d’un serment.
