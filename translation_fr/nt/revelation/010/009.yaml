id: REV.10.9
reference: Revelation 10:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: fr
  text: 'Je suis allé vers l’ange et je lui ai dit de me donner le petit rouleau[a]. Il me dit[c] : « Prends-le et mange-le entièrement. Il rendra ton ventre amer[b], mais dans ta bouche il sera doux comme du miel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le petit livre ». Le mot grec est un diminutif qui peut désigner un petit rouleau ou un livret.
    reason: lexical_alternative
  - marker: b
    text: Ou « ton estomac ».
    reason: lexical_alternative
  - marker: c
    text: Le grec emploie au début de la réplique un présent historique (« il me dit »), qui donne de la vivacité au récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: je suis allé vers l’ange
  rationale: Le mouvement de Jean en direction de l’ange est rendu naturellement, sans donner à ἀπῆλθα le sens trop appuyé de « je me suis éloigné ».
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: je lui ai dit de me donner
  rationale: Cette formulation rend le participe accompagné de l’infinitif sans transformer explicitement la parole en demande polie, nuance absente du grec.
- source_word: βιβλαρίδιον
  choice: petit rouleau
  rationale: Le diminutif est conservé par « petit », tandis que « rouleau » correspond bien à la forme probable du document dans ce contexte antique.
- source_word: λέγει μοι
  choice: il me dit
  rationale: En français narratif, « il me dit » peut conserver la vivacité du présent historique grec sans lourdeur.
- source_word: Λάβε καὶ κατάφαγε αὐτό
  choice: Prends-le et mange-le entièrement
  rationale: « Prends-le » explicite naturellement le pronom objet en français. « Mange-le entièrement » rend la force du composé κατάφαγε sans recourir au plus violent « dévore-le ».
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: il rendra ton ventre amer
  rationale: La tournure causative de πικραίνω est préservée. Dans cette image liée à l’ingestion, « ventre » rend concrètement κοιλία et reste idiomatique.
- source_word: γλυκὺ ὡς μέλι
  choice: doux comme du miel
  rationale: Cette comparaison est naturelle en français et conserve l’image exacte de la douceur du miel.
theological_decisions:
- issue: Acte symbolique consistant à manger le rouleau
  choice: Conserver l’ordre concret de prendre et de manger le rouleau sans en expliquer le symbole dans le texte.
  alternative: Paraphraser l’acte comme l’assimilation intérieure du message divin.
  rationale: Le verset présente lui-même l’action prophétique et ses effets contrastés. Une explication intégrée au texte supprimerait une part de son imagerie et de sa tension théologique.
- issue: Contraste entre amertume intérieure et douceur dans la bouche
  choice: Conserver les deux effets corporels dans leur ordre et leur formulation imagée.
  alternative: Interpréter l’amertume comme souffrance ou jugement et la douceur comme joie spirituelle.
  rationale: Le grec n’explicite pas ici la portée exacte de ce contraste; la traduction doit préserver cette ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative demeure fluide, et les images corporelles du grec sont conservées sans ajout interprétatif.
