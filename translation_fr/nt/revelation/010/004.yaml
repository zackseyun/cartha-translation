id: REV.10.4
reference: Revelation 10:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: fr
  text: 'Quand les sept tonnerres eurent parlé, j’allais écrire. Mais j’entendis une voix venant du ciel qui disait : « Garde sous sceau ce qu’ont dit les sept tonnerres, et ne l’écris pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησαν
  choice: eurent parlé / ont dit
  rationale: Le verbe λαλέω signifie ici « parler » ou « dire ». La variation française évite une répétition lourde sans modifier le sens.
- source_word: αἱ ἑπτὰ βρονταί
  choice: les sept tonnerres
  rationale: Le pluriel conserve l’image apocalyptique personnifiée du grec, où les tonnerres parlent.
- source_word: ἤμελλον γράφειν
  choice: j’allais écrire
  rationale: Cette tournure française naturelle exprime l’imminence indiquée par μέλλω suivi de l’infinitif.
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: une voix venant du ciel
  rationale: La formulation indique l’origine céleste de la voix sans en préciser l’identité.
- source_word: Σφράγισον
  choice: Garde sous sceau
  rationale: Dans ce contexte révélatoire, l’impératif commande de tenir caché et non divulgué le contenu entendu.
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: ce qu’ont dit les sept tonnerres
  rationale: « Ce que » rend naturellement le relatif neutre pluriel ἃ en présentant les paroles comme un contenu collectif.
- source_word: μὴ αὐτὰ γράψῃς
  choice: ne l’écris pas
  rationale: Bien que αὐτά soit un pronom grec pluriel, son antécédent désigne collectivement en français le contenu exprimé par « ce que » ; le singulier « l’ » est donc idiomatique et fidèle au référent.
theological_decisions:
- issue: Identité de la voix céleste
  choice: une voix venant du ciel
  alternative: la voix de Dieu venant du ciel
  rationale: Le grec donne seulement l’origine de la voix et n’identifie pas explicitement celui qui parle ; la traduction maintient cette réserve.
- issue: Sens du commandement de sceller
  choice: Garde sous sceau
  alternative: Scelle
  rationale: La formulation exprime la non-divulgation exigée par le contexte sans préciser davantage la nature ou la durée du secret.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé antérieur après « quand » marque nettement l’antériorité, tandis que « j’allais écrire » rend l’action imminente interrompue. La ponctuation en deux phrases remplace naturellement le long enchaînement grec.
