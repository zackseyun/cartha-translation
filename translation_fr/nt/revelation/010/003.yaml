id: REV.10.3
reference: Revelation 10:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: fr
  text: Il cria d’une voix forte, comme un lion rugit. Quand il cria, les sept tonnerres firent entendre leurs propres voix.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « les sept tonnerres parlèrent leurs propres voix ». Le grec personnifie les tonnerres de manière frappante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: cria
  rationale: Le verbe κράζω exprime ici un cri puissant. « Cria » est direct et naturel sans suggérer nécessairement la détresse.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Cette formulation conserve le nom concret φωνή et exprime naturellement en français la manière dont il crie.
- source_word: ὥσπερ λέων μυκᾶται
  choice: comme rugit un lion
  rationale: « Comme » marque clairement la comparaison, et « rugit » est le verbe français naturel pour le cri du lion.
- source_word: ὅτε
  choice: quand
  rationale: La conjonction temporelle est rendue sans préciser davantage le rapport chronologique ou causal.
- source_word: ἐλάλησαν
  choice: firent entendre
  rationale: Dans cette construction inhabituelle avec « leurs propres voix », « firent entendre » produit un français intelligible tout en maintenant l’action attribuée aux tonnerres.
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: les sept tonnerres
  rationale: Le syntagme défini et personnifié de la vision est conservé littéralement.
- source_word: τὰς ἑαυτῶν φωνάς
  choice: leurs propres voix
  rationale: Cette traduction préserve l’insistance du réfléchi ἑαυτῶν ainsi que la personnification saisissante du texte grec.
theological_decisions:
- issue: Personnification des sept tonnerres
  choice: Conserver l’expression personnifiée « les sept tonnerres firent entendre leurs propres voix »
  alternative: « les sept tonnerres retentirent » ou « firent entendre leurs messages »
  rationale: Le grec attribue explicitement aux tonnerres l’acte de parler et mentionne « leurs propres voix ». La formulation retenue préserve cette image apocalyptique sans la réduire à un simple bruit ni interpréter les voix comme des messages.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste fluide tout en conservant la répétition de « cria/crié », le vocabulaire concret de la voix et la personnification inhabituelle des tonnerres.
