id: REV.10.1
reference: Revelation 10:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: fr
  text: Puis je vis un autre ange puissant descendre du ciel, enveloppé d’une nuée. Un arc-en-ciel était au-dessus de sa tête, son visage était comme le soleil et ses pieds comme des colonnes de feu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: un autre ange
  rationale: Dans cette vision et avec la descente depuis le ciel, « ange » est le référent naturel de ἄγγελος; « un autre » conserve la relation avec les figures angéliques précédentes.
- source_word: ἰσχυρὸν
  choice: puissant
  rationale: « Puissant » exprime naturellement en français moderne la force exceptionnelle indiquée par ἰσχυρός.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: descendre du ciel
  rationale: L’infinitif après « je vis » restitue avec fluidité le participe grec et garde le mouvement descendant explicite.
- source_word: περιβεβλημένον νεφέλην
  choice: enveloppé d’une nuée
  rationale: Le participe de περιβάλλω décrit la figure comme revêtue ou entourée par une nuée. « Enveloppé » préserve cette image, tandis que « nuée » convient au registre visionnaire et biblique.
- source_word: ἡ ἶρις
  choice: un arc-en-ciel
  rationale: ἶρις désigne normalement un arc-en-ciel, sens également cohérent avec l’imagerie d’Apocalypse 4.3.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: au-dessus de sa tête
  rationale: Cette formulation naturelle conserve la position indiquée par ἐπί avec l’accusatif.
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: son visage était comme le soleil
  rationale: « Visage » rend directement πρόσωπον, et l’ajout de « était » produit une phrase française complète sans expliciter davantage la comparaison.
- source_word: οἱ πόδες αὐτοῦ
  choice: ses pieds
  rationale: « Pieds » est le sens direct de πόδες et laisse intacte l’image corporelle du texte.
- source_word: στῦλοι πυρός
  choice: des colonnes de feu
  rationale: « Colonnes de feu » rend clairement la construction génitive et constitue une expression naturelle et évocatrice en français.
theological_decisions:
- issue: Identité de l’ange puissant
  choice: La traduction dit simplement « un autre ange puissant » sans préciser son identité.
  alternative: Identifier la figure comme un ange créé ou comme une manifestation du Messie/Christ.
  rationale: Le grec présente la figure comme ἄλλον ἄγγελον ἰσχυρόν. Comme son identité fait l’objet d’interprétations divergentes, la traduction conserve la formulation du texte et ne tranche pas.
translation_notes:
  register: Français international moderne, naturel et digne. « Nuée » maintient la tonalité visionnaire et théophanique sans rendre la phrase obscure; la syntaxe est légèrement segmentée pour assurer clarté et fluidité.
