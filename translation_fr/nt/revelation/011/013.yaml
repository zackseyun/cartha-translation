id: REV.11.13
reference: Revelation 11:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: fr
  text: À cette heure-là, il y eut un grand tremblement de terre. Un dixième de la ville s’effondra, et sept mille personnes[a] furent tuées dans le tremblement de terre. Les autres furent saisis de terreur et rendirent gloire au Dieu du ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sept mille noms d’hommes » ; cette expression désigne ici sept mille personnes comptées parmi les morts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: À cette heure-là
  rationale: Cette formulation conserve le repère temporel précis et l’immédiateté du grec tout en étant naturelle en français moderne.
- source_word: ἐγένετο σεισμὸς μέγας
  choice: il y eut un grand tremblement de terre
  rationale: « Il y eut » rend naturellement la survenue de l’événement, tandis que « grand tremblement de terre » reste proche de l’expression grecque.
- source_word: τὸ δέκατον τῆς πόλεως ἔπεσεν
  choice: Un dixième de la ville s’effondra
  rationale: Le chiffre exact est conservé. « S’effondra » exprime en français idiomatique la chute d’une partie de la ville dans le contexte d’un séisme.
- source_word: ἀπεκτάνθησαν
  choice: furent tuées
  rationale: Ce passif rend directement l’idée de mise à mort sans employer le terme plus archaïque « périrent » ni effacer la valeur passive.
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: sept mille personnes
  rationale: L’expression grecque signifie ici sept mille personnes comptées parmi les morts. La tournure littérale remarquable est signalée en note.
- source_word: οἱ λοιποὶ
  choice: Les autres
  rationale: Cette traduction directe évite d’ajouter explicitement l’idée de « survivants », bien qu’elle soit impliquée par le contexte.
- source_word: ἔμφοβοι ἐγένοντο
  choice: furent saisis de terreur
  rationale: La formulation rend à la fois l’entrée dans cet état et l’intensité de la peur, dans un français naturel.
- source_word: ἔδωκαν δόξαν
  choice: rendirent gloire
  rationale: Cette expression française établie conserve l’idiome biblique sans le réduire à une simple marque d’honneur.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: au Dieu du ciel
  rationale: La traduction préserve le titre génitival tel qu’il apparaît dans le grec et dans l’usage biblique.
theological_decisions:
- issue: La nature spirituelle de la réaction des autres habitants
  choice: Le texte dit seulement qu’ils furent saisis de terreur et rendirent gloire au Dieu du ciel.
  alternative: Préciser qu’ils se repentirent sincèrement, ou au contraire qu’ils reconnurent seulement la puissance de Dieu sous l’effet de la peur.
  rationale: Le grec décrit leur peur et leur acte de rendre gloire à Dieu, mais ne définit pas explicitement s’il s’agit d’une repentance authentique ou d’une reconnaissance extérieure. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été répartie en trois phrases pour faciliter la lecture sans modifier la progression des événements. Le marqueur de note [a] est placé après « personnes », là où se trouve l’expression grecque expliquée.
