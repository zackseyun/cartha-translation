id: REV.11.8
reference: Revelation 11:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: fr
  text: Et leur cadavre[a] gît dans la grande rue[b] de la grande ville, qui est appelée, au sens spirituel[c], Sodome et Égypte, là même où leur Seigneur a été crucifié[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie le singulier « cadavre », présentant ainsi les deux témoins comme un tout ; on pourrait aussi traduire : « leurs cadavres ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « sur la place publique ». Le terme grec peut désigner une large rue ou une place.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « symboliquement », « au sens figuré ».'
    reason: lexical_alternative
  - marker: d
    text: La mention du lieu où leur Seigneur a été crucifié renvoie à Jérusalem, mais le texte maintient le titre symbolique « la grande ville ».
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: leur cadavre
  rationale: Le singulier grec πτῶμα est conservé malgré le référent pluriel, car il présente les deux témoins comme un tout. « Cadavre » rend directement l’idée d’un corps mort avec la sobriété et la force du texte.
- source_word: ἐπὶ τῆς πλατείας
  choice: dans la grande rue
  rationale: πλατεῖα désigne couramment une rue large ou une place publique. « Dans la grande rue » convient à l’espace urbain évoqué tout en laissant l’autre possibilité en note.
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: de la grande ville
  rationale: Cette formulation conserve le titre apocalyptique important « la grande ville » sans en expliciter l’identité dans le texte.
- source_word: πνευματικῶς
  choice: spirituellement
  rationale: C’est l’équivalent direct de l’adverbe grec et il préserve la dimension spirituelle ou symbolique de cette désignation sans la réduire à une simple figure littéraire.
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: Sodome et Égypte
  rationale: Les noms propres traditionnels en français sont retenus, sans expliciter dans le corps du texte leurs associations symboliques respectives.
- source_word: ὅπου καὶ
  choice: là même où
  rationale: Cette tournure française naturelle souligne le lien de lieu et rend la valeur additive ou emphatique de καί dans ce contexte.
- source_word: ὁ κύριος αὐτῶν
  choice: leur Seigneur
  rationale: « Seigneur » conserve la portée christologique habituelle de κύριος, tandis que le possessif renvoie aux deux témoins.
- source_word: ἐσταυρώθη
  choice: a été crucifié
  rationale: Le passé composé passif exprime naturellement en français l’événement historique désigné par l’aoriste passif grec.
theological_decisions:
- issue: Singulier πτῶμα avec un référent pluriel
  choice: Conserver « leur cadavre » au singulier.
  alternative: « leurs cadavres »
  rationale: Le grec traite les deux témoins collectivement au moyen d’un nom singulier. Le français permet cette formulation, dont l’étrangeté mesurée préserve l’effet rhétorique du texte.
- issue: Sens de πνευματικῶς
  choice: Traduire par « spirituellement ».
  alternative: « symboliquement » ou « au sens figuré »
  rationale: La traduction directe maintient la possible portée théologique de l’adverbe; une note indique le sens figuratif possible sans l’imposer.
- issue: Identification de « la grande ville »
  choice: Ne pas remplacer l’expression par « Jérusalem ».
  alternative: Identifier explicitement la ville comme Jérusalem.
  rationale: La crucifixion du Seigneur oriente fortement vers Jérusalem, mais le texte conserve une désignation apocalyptique associée à Sodome et à l’Égypte. La traduction maintient cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le singulier surprenant du grec, le titre apocalyptique « la grande ville » et l’adverbe « spirituellement », tout en signalant les principales possibilités lexicales dans les notes.
