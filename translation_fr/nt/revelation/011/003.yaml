id: REV.11.3
reference: Revelation 11:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: fr
  text: Et j’accorderai à mes deux témoins[a] de prophétiser pendant mille deux cent soixante jours, vêtus de toile de sac[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « je donnerai à mes deux témoins ». Le grec ne précise pas ce qui leur est donné ; la suite indique que cela concerne leur activité prophétique.'
    reason: lexical_alternative
  - marker: b
    text: La toile de sac, étoffe grossière, était notamment associée au deuil, à la repentance et à la lamentation prophétique.
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: j’accorderai … de prophétiser
  rationale: Le verbe signifie littéralement « je donnerai », mais son complément direct n’est pas exprimé. La tournure française « accorder à quelqu’un de… » rend naturellement l’idée suggérée par la proposition suivante sans préciser davantage la nature de ce qui est accordé.
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: à mes deux témoins
  rationale: Cette formulation directe conserve le sens testimonial de μάρτυς et exprime naturellement le possessif en français.
- source_word: προφητεύσουσιν
  choice: de prophétiser
  rationale: « Prophétiser » est l’équivalent direct et usuel de προφητεύω. L’infinitif résulte ici de la restructuration nécessaire après « j’accorderai », tout en conservant le sens futur de l’ensemble.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: pendant mille deux cent soixante jours
  rationale: L’accusatif indique une durée. « Pendant » l’exprime clairement en français, et les adjectifs numéraux « cent » et « vingt » restent invariables puisqu’ils sont suivis d’un autre nombre.
- source_word: περιβεβλημένοι
  choice: vêtus
  rationale: Le participe parfait décrit l’état dans lequel se trouvent les témoins. « Vêtus » conserve le registre soutenu et l’image marquante du grec.
- source_word: σάκκους
  choice: de toile de sac
  rationale: Le pluriel grec désigne des vêtements faits de cette étoffe grossière. « Toile de sac » est l’expression française idiomatique qui préserve l’image biblique.
theological_decisions:
- issue: Complément sous-entendu de δώσω
  choice: Restructurer par « j’accorderai à mes deux témoins de prophétiser »
  alternative: « Je donnerai à mes deux témoins » ou « je donnerai autorité à mes deux témoins »
  rationale: Le grec ne dit pas explicitement ce qui est donné. La restructuration française relie l’octroi à l’action prophétique annoncée immédiatement après, sans introduire dans le texte principal le mot « autorité » ou « mission ». La note signale l’ellipse de l’original.
- issue: Portée symbolique de la toile de sac
  choice: Conserver l’image sans l’interpréter dans le texte principal
  alternative: « vêtus d’habits de deuil »
  rationale: La toile de sac évoque notamment le deuil, la repentance et la lamentation prophétique, mais le verset ne réduit pas explicitement son sens à une seule de ces associations.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement restructurée pour éviter une phrase incomplète en français, tandis que la note conserve l’ambiguïté du grec. « Toile de sac » maintient l’image traditionnelle sans l’expliquer dans le corps du verset.
