id: REV.11.18
reference: Revelation 11:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: fr
  text: Les nations se sont mises en colère, et ta colère est venue, ainsi que le moment de juger les morts, de donner la récompense à tes serviteurs[a] — les prophètes, les saints et ceux qui craignent ton nom, les petits et les grands —, et de détruire ceux qui détruisent la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « esclaves ». Le mot grec peut désigner un serviteur ou un esclave selon le contexte.
    reason: alternative_reading
  - marker: b
    text: Ou « ceux qui ravagent ou corrompent la terre » ; le mot grec traduit par « terre » peut aussi signifier « pays ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: nations
  rationale: Dans l’Apocalypse, le terme désigne ici collectivement les peuples du monde; « nations » convient mieux que « non-Juifs ».
- source_word: ὠργίσθησαν
  choice: se sont mises en colère
  rationale: Cette formulation rend le changement d’état exprimé par l’aoriste sans renforcer indûment l’intensité.
- source_word: ὀργή
  choice: colère
  rationale: En français biblique moderne, « colère » peut porter la dimension judiciaire de la réaction divine et maintient l’écho lexical avec la colère des nations.
- source_word: καιρός
  choice: temps
  rationale: Le contexte eschatologique indique qu’il s’agit du moment décisif fixé, sans qu’il soit nécessaire d’ajouter « fixé » au texte.
- source_word: κριθῆναι
  choice: doivent être jugés
  rationale: Le passif et la valeur judiciaire sont conservés naturellement; la construction française explicite la relation avec « le temps où ».
- source_word: μισθός
  choice: récompense
  rationale: Dans ce contexte de rétribution divine favorable, « récompense » est naturel et évite la nuance contractuelle de « salaire ».
- source_word: δούλοις
  choice: serviteurs
  rationale: La désignation est honorifique et souligne ici le service et l’appartenance à Dieu; « esclaves » demeure lexicalement possible et figure en note.
- source_word: ἁγίοις
  choice: saints
  rationale: « Saints » est la désignation biblique française établie pour le peuple consacré à Dieu.
- source_word: φοβουμένοις τὸ ὄνομά σου
  choice: ceux qui craignent ton nom
  rationale: La formulation préserve l’idiome biblique de la crainte révérencielle sans le réduire à « respectent ».
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: les petits et les grands
  rationale: La paire traditionnelle et naturelle exprime l’ensemble des personnes sans distinction de rang.
- source_word: διαφθεῖραι / διαφθείροντας
  choice: détruire / détruisent
  rationale: La répétition française conserve le jeu verbal du grec; le verbe peut aussi évoquer le fait de corrompre ou de ravager.
- source_word: γῆ
  choice: terre
  rationale: Le cadre cosmique du jugement dans l’Apocalypse favorise « terre », tout en laissant « pays » lexicalement possible.
theological_decisions:
- issue: Valeur de δοῦλος comme désignation du peuple de Dieu
  choice: serviteurs
  alternative: esclaves
  rationale: Le contexte porte sur les personnes reconnues et récompensées par Dieu plutôt que sur leur condition servile; la note préserve néanmoins l’autre valeur réelle du grec.
- issue: Portée de γῆ
  choice: terre
  alternative: pays
  rationale: Le contexte apocalyptique favorise une portée universelle, mais le mot grec peut aussi désigner un territoire ou un pays.
- issue: Relation entre les prophètes, les saints et ceux qui craignent le nom de Dieu
  choice: conserver trois groupes coordonnés sans préciser s’ils se recouvrent
  alternative: présenter tous les termes comme des catégories explicitement distinctes ou comme des appositions équivalentes
  rationale: La syntaxe grecque énumère les groupes sans résoudre complètement leurs rapports; la traduction conserve cette ouverture.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase ample et solennelle suit la progression du grec, tandis que « ainsi que le temps où » et les reprises de « où » clarifient la syntaxe. Le contraste lexical entre la colère des nations et celle de Dieu est maintenu.
