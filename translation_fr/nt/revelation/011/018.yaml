revisions:
- from: Les nations se sont mises en colère, mais ta colère est venue, ainsi que le temps où les morts doivent être jugés, où tu dois donner la récompense à tes serviteurs[a] — les prophètes, les saints et ceux qui craignent ton nom, les petits et les grands — et détruire ceux qui détruisent la terre[b].
  to: Les nations se sont mises en colère, et ta colère est venue, ainsi que le moment de juger les morts, de donner la récompense à tes serviteurs[a] — les prophètes, les saints et ceux qui craignent ton nom, les petits et les grands —, et de détruire ceux qui détruisent la terre[b].
  rationale: Suppression de l'adversatif non justifié et de la modalité ajoutée. La construction « le moment de juger..., de donner..., et de détruire... » rend la coordination grecque tout en gardant Dieu comme agent implicitement indiqué par « ta » et « tes ». L'énumération entre tirets conserve sans la résoudre la relation syntaxique des prophètes, des saints, de ceux qui craignent le nom de Dieu, et des petits et des grands.
  reviewer_model: gpt-5.6-terra
