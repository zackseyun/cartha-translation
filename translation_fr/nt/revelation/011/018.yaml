  naturalness: La phrase révisée demeure ample et solennelle, mais elle est naturelle en français moderne. « Le moment de juger les morts » rend clairement la valeur eschatologique de καιρός sans ajouter « fixé » ou une obligation.
  terminology: « Nations », « colère », « récompense », « serviteurs », « saints », « ceux qui craignent ton nom », « les petits et les grands » et « terre » sont appropriés. Les notes préservent les alternatives lexicales pertinentes pour δοῦλοι et pour διαφθείροντας / γῆ.
