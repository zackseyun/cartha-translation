- from: Ceux-ci ont l’autorité de fermer le ciel afin qu’aucune pluie ne tombe durant les jours de leur prophétie. Ils ont aussi autorité sur les eaux pour les changer en sang et pour frapper la terre de toutes sortes de fléaux, aussi souvent qu’ils le veulent.
  to: Ceux-ci ont l’autorité de fermer le ciel afin qu’aucune pluie ne tombe durant les jours de leur prophétie. Ils ont aussi autorité sur les eaux pour les changer en sang, et autorité pour frapper la terre de tout fléau, aussi souvent qu’ils le veulent.
  rationale: 'Révision limitée à deux points sûrs : « de tout fléau » rend πάσῃ πληγῇ sans ajouter « sortes », et la reprise d’« autorité » évite que l’expression « sur les eaux » ne soit comprise comme régissant également l’action de frapper la terre. Aucune note n’est nécessaire : « ciel » conserve naturellement l’ambiguïté pertinente de οὐρανός en français.'
