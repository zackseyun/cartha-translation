id: REV.11.6
reference: Revelation 11:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: fr
  text: Ceux-ci ont l’autorité de fermer le ciel afin qu’aucune pluie ne tombe durant les jours de leur prophétie. Ils ont aussi autorité sur les eaux pour les changer en sang, et autorité pour frapper la terre de tout fléau, aussi souvent qu’ils le veulent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτοι
  choice: Ceux-ci
  rationale: Le démonstratif est conservé sans ajouter « les deux », puisque le nombre ressort du contexte mais n’est pas répété dans ce verset.
- source_word: ἐξουσίαν
  choice: l’autorité
  rationale: « Autorité » exprime ici un droit ou un pouvoir accordé, plutôt que la seule capacité d’agir.
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: fermer le ciel
  rationale: En français, « ciel » désigne naturellement à la fois l’espace d’où vient la pluie et, selon le contexte, le ciel comme domaine céleste; le terme conserve donc l’ambiguïté du grec.
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: afin qu’aucune pluie ne tombe
  rationale: Cette formulation française naturelle garde la valeur de but ou de résultat de ἵνα et rend explicitement le substantif « pluie ».
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: durant les jours de leur prophétie
  rationale: La formulation conserve à la fois « les jours » et le nom « prophétie », sans réduire celui-ci à un simple discours ponctuel.
- source_word: ἐπὶ τῶν ὑδάτων
  choice: sur les eaux
  rationale: Avec « avoir autorité », ἐπί suivi du génitif marque le domaine sur lequel cette autorité s’exerce; le pluriel grec est maintenu.
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: pour les changer en sang
  rationale: « Changer en » rend clairement et naturellement en français l’idée de transformation exprimée par στρέφω avec εἰς.
- source_word: πατάξαι τὴν γῆν
  choice: frapper la terre
  rationale: Cette traduction directe conserve la portée forte et cosmique de l’image sans recourir à un verbe archaïque.
- source_word: ἐν πάσῃ πληγῇ
  choice: de toutes sortes de fléaux
  rationale: La préposition française « de » convient avec « frapper » pour indiquer le moyen; « toutes sortes de fléaux » exprime naturellement la portée distributive de πάσῃ sans suggérer une liste déterminée.
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: aussi souvent qu’ils le veulent
  rationale: La tournure conserve la répétition éventuelle et la volonté des témoins exprimées par ὁσάκις avec ἐάν.
theological_decisions:
- issue: Échos aux miracles associés à Élie et à Moïse
  choice: Conserver les actes miraculeux dans un langage direct, sans les interpréter dans la traduction.
  alternative: Présenter explicitement ces actes comme symboliques ou comme de simples comparaisons.
  rationale: Le texte attribue ces actes à l’autorité accordée aux témoins, mais ne tranche pas ici la question de leur caractère littéral, symbolique ou conjointement littéral et symbolique.
translation_notes:
  register: Français international moderne, clair et digne. La répétition d’« autorité » reflète celle du grec. « Ciel » préserve naturellement en français la polysémie de οὐρανός, de sorte qu’aucune note lexicale n’est nécessaire.
