id: REV.11.15
reference: Revelation 11:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: fr
  text: 'Le septième ange sonna de la trompette[a]. De fortes voix se firent alors entendre dans le ciel. Elles disaient : « Le royaume du monde est devenu celui de notre Seigneur et de son Messie[b], et il régnera pour toujours et à jamais[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent « les royaumes du monde sont devenus » ou « le royaume de ce monde est devenu ». Le texte du SBLGNT porte le singulier : « le royaume du monde est devenu ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « son Christ ». Le titre grec Χριστός est rendu ici par « Messie » afin de préserver sa valeur de titre.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « pour les siècles des siècles », expression grecque qui désigne une durée sans fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: sonna de la trompette
  rationale: Le verbe σαλπίζω signifie faire retentir une trompette. Cette tournure française naturelle explicite l’instrument impliqué par le verbe sans ajouter d’idée étrangère au texte.
- source_word: φωναὶ μεγάλαι
  choice: de fortes voix
  rationale: Puisque ces voix prononcent des paroles, φωναί désigne ici des voix plutôt que de simples sons. « Fortes » rend naturellement l’intensité exprimée par μεγάλαι.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Dans ce contexte de l’Apocalypse, οὐρανός désigne le domaine céleste. « Dans le ciel » est la formulation française courante et digne.
- source_word: λέγοντες
  choice: Elles disaient
  rationale: Cette reformulation explicite naturellement en français le lien entre les voix et les paroles qui suivent, sans tenter de reproduire l’accord grec inhabituel du participe masculin avec le nom féminin φωναί.
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: Le royaume du monde est devenu
  rationale: Le singulier βασιλεία est conservé par « royaume ». Le passé composé rend la proclamation d’un changement désormais accompli, portée ici par l’aoriste ἐγένετο.
- source_word: τοῦ κυρίου ἡμῶν
  choice: celui de notre Seigneur
  rationale: « Celui de » exprime clairement en français que le royaume appartient désormais à notre Seigneur, tout en conservant le titre κύριος par « Seigneur ».
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: de son Messie
  rationale: Χριστός fonctionne ici comme un titre, particulièrement dans la relation possessive « son Messie ». « Messie » en restitue donc directement le sens.
- source_word: καὶ βασιλεύσει
  choice: et il régnera
  rationale: Le verbe grec est au singulier. Le pronom « il » maintient ce singulier et laisse l’antécédent aussi condensé que dans la proclamation grecque.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  rationale: Cette expression française naturelle rend l’idée de durée sans fin portée par l’idiome grec, sans recourir à un calque obscur.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Le mot est employé comme titre et non comme un nom propre, ce que souligne la formule « son Messie ». La note conserve néanmoins l’équivalent traditionnel « Christ ».
- issue: Sujet de βασιλεύσει
  choice: il régnera
  alternative: ils régneront / notre Seigneur et son Messie régneront
  rationale: Le grec emploie un verbe au singulier. La traduction conserve ce singulier sans préciser davantage lequel des référents précédents est visé, préservant ainsi la concision et la tension du texte.
- issue: Nature de βασιλεία
  choice: royaume
  alternative: royauté / règne
  rationale: « Royaume » maintient l’image nominale traditionnelle et le singulier du texte grec. « Royauté » ou « règne » seraient possibles, mais orienteraient davantage le sens vers l’exercice du pouvoir.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la proclamation grecque tout en évitant les calques peu naturels. Le singulier de « royaume » et de « il régnera » est délibérément conservé, et l’antécédent du verbe final n’est pas explicité au-delà du texte source.
