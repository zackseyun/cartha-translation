reference: Revelation 11:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: fr
  text: Après les trois jours et demi, un souffle de vie venant de Dieu[a] entra en eux. Ils se tinrent sur leurs pieds, et une grande peur s’empara de ceux qui les regardaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un esprit de vie venant de Dieu » ; éventuellement « l’Esprit de vie venant de Dieu ». Le grec πνεῦμα peut signifier souffle, esprit ou Esprit.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: Après les trois jours et demi
  rationale: μετά avec l’accusatif exprime ici la succession temporelle. L’article grec est conservé, et « trois jours et demi » est la formulation française naturelle.
- source_word: πνεῦμα ζωῆς
  choice: un souffle de vie
  rationale: πνεῦμα peut désigner le souffle, l’esprit ou l’Esprit. Dans cette scène de retour à la vie, « souffle de vie » rend naturellement l’image tout en laissant les autres possibilités en note.
- source_word: ἐκ τοῦ θεοῦ
  choice: venant de Dieu
  rationale: Cette formulation française exprime clairement l’origine divine indiquée par ἐκ, sans suggérer une identification plus précise du souffle.
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: entra en eux
  rationale: La tournure conserve l’idée d’une entrée à l’intérieur des deux témoins et reste naturelle en français.
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: Ils se tinrent debout sur leurs pieds
  rationale: Le verbe est ici intransitif. Cette traduction préserve l’expression corporelle et l’écho au langage biblique du relèvement.
- source_word: φόβος μέγας ἐπέπεσεν ἐπὶ
  choice: une grande peur s’empara de
  rationale: « S’empara de » rend idiomatiquement en français l’idée d’une peur qui tombe soudain sur des personnes, tandis que « grande peur » conserve la force de φόβος μέγας.
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: ceux qui les regardaient
  rationale: Le participe présent indique une observation en cours; « regardaient » est clair, courant et fidèle au contexte.
theological_decisions:
- issue: Faut-il comprendre πνεῦμα ζωῆς comme un souffle vivifiant ou l’identifier explicitement à l’Esprit Saint ?
  choice: un souffle de vie venant de Dieu
  alternative: un esprit de vie venant de Dieu ; l’Esprit de vie venant de Dieu
  rationale: Le texte affirme l’origine divine, mais n’identifie pas explicitement πνεῦμα à l’Esprit Saint. Le texte principal retient l’image du souffle, bien adaptée à la scène de retour à la vie, et la note préserve l’ambiguïté lexicale et théologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche du grec sans adopter de tournures artificielles; l’ambiguïté de πνεῦμα est explicitement préservée en note.
