id: REV.11.2
reference: Revelation 11:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: fr
  text: Mais laisse de côté le parvis qui est à l’extérieur du sanctuaire[a] et ne le mesure pas, car il a été donné aux nations[b]. Elles fouleront aux pieds la ville sainte pendant quarante-deux mois.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du temple ». Le grec ναός peut désigner plus précisément le sanctuaire, c’est-à-dire le bâtiment sacré, plutôt que l’ensemble du complexe du temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « aux non-Juifs ». Le grec ἔθνεσιν peut signifier « nations » ou désigner les peuples non juifs, selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: parvis
  rationale: Dans le contexte du temple, « parvis » désigne naturellement en français l’espace découvert entourant le sanctuaire et évite le sens trop général de « cour ».
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: qui est à l’extérieur du sanctuaire
  rationale: La proposition relative rend clairement la relation spatiale entre le parvis et le ναός sans transformer la formule en désignation technique absente du grec.
- source_word: ναός
  choice: sanctuaire
  rationale: Dans ce contraste avec le parvis, ναός désigne vraisemblablement le bâtiment sacré proprement dit plutôt que l’ensemble du complexe du temple.
- source_word: ἔκβαλε ἔξωθεν
  choice: laisse de côté
  rationale: Dans le contexte de la mesure, l’expression commande d’exclure le parvis de l’opération. « Laisse de côté » restitue ce sens idiomatique sans suggérer qu’un lieu serait matériellement jeté dehors.
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: ne le mesure pas
  rationale: Le pronom masculin français reprend « parvis »; la défense à la deuxième personne du singulier est conservée directement.
- source_word: ἐδόθη
  choice: il a été donné
  rationale: Le passif est maintenu sans identifier l’agent implicite, ce qui préserve la retenue du texte grec.
- source_word: τοῖς ἔθνεσιν
  choice: aux nations
  rationale: « Nations » conserve le sens collectif large et le registre prophétique de ἔθνη, sans imposer dans le texte principal l’interprétation ethno-religieuse « non-Juifs ».
- source_word: πόλιν τὴν ἁγίαν
  choice: la ville sainte
  rationale: Cette expression française consacrée reproduit fidèlement le titre sans identifier explicitement la ville au-delà de ce que dit le verset.
- source_word: πατήσουσιν
  choice: fouleront aux pieds
  rationale: L’expression garde l’image concrète de piétinement ainsi que sa portée de profanation et de domination hostile.
- source_word: μῆνας τεσσεράκοντα δύο
  choice: pendant quarante-deux mois
  rationale: « Pendant » exprime naturellement en français l’accusatif grec de durée.
theological_decisions:
- issue: Portée de ναός dans l’imagerie du temple
  choice: sanctuaire
  alternative: temple
  rationale: « Sanctuaire » rend le sens plus précis du bâtiment sacré distingué de son parvis. Comme ναός peut aussi être rendu plus largement par « temple », cette possibilité est signalée en note afin de ne pas fermer l’interprétation de la vision.
- issue: Sens de ἔθνεσιν
  choice: nations
  alternative: non-Juifs
  rationale: Le grec peut désigner les nations en général ou les non-Juifs par contraste avec Israël. Le choix principal préserve la portée collective et prophétique la plus large; la note maintient l’autre nuance possible.
- issue: Agent implicite de ἐδόθη
  choice: conserver le passif sans nommer l’agent
  alternative: expliciter que Dieu l’a donné
  rationale: Le passif peut suggérer l’action souveraine de Dieu, mais le grec ne nomme pas l’agent. L’expliciter résoudrait une implication que le texte laisse tacite.
translation_notes:
  register: Français international moderne, digne et accessible. « Parvis », « sanctuaire » et « fouler aux pieds » maintiennent le registre biblique et visionnaire sans archaïsme excessif. La reprise par « Elles » désigne clairement les nations tout en conservant le passage du parvis donné à l’action exercée contre la ville.
