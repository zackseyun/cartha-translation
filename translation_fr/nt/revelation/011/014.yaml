id: REV.11.14
reference: Revelation 11:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: fr
  text: Le deuxième malheur est passé. Voici, le troisième malheur arrive rapidement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bientôt ». Le grec peut souligner soit la proximité dans le temps, soit la rapidité.
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: malheur
  rationale: « Malheur » est le terme français traditionnel et naturel pour l’exclamation ou le nom exprimant la détresse et le désastre imminent; il conserve ici la portée apocalyptique et la numérotation des trois malheurs.
- source_word: δευτέρα
  choice: deuxième
  rationale: L’ordinal qualifie directement « malheur »; « deuxième » est clair et idiomatique.
- source_word: ἀπῆλθεν
  choice: est passé
  rationale: Dans cette séquence de jugements, cette formulation idiomatique exprime qu’un malheur a pris fin, tout en restant proche du sens de départ ou d’éloignement du verbe grec.
- source_word: ἰδού
  choice: voici
  rationale: « Voici » attire solennellement l’attention sur ce qui suit et convient au registre prophétique sans paraître archaïque.
- source_word: τρίτη
  choice: troisième
  rationale: L’ordinal qualifie directement « malheur » et se traduit sans difficulté par « troisième ».
- source_word: ἔρχεται
  choice: arrive
  rationale: Le présent grec est rendu par un présent français vivant; « arrive » convient naturellement à un événement qui approche.
- source_word: ταχύ
  choice: rapidement
  rationale: Le mot grec peut évoquer soit la rapidité de la venue, soit sa proximité temporelle. « Rapidement » préserve en priorité la nuance de célérité, tandis que l’autre possibilité est signalée en note.
theological_decisions:
- issue: Sens de ταχύ dans un contexte eschatologique
  choice: rapidement
  alternative: bientôt
  rationale: Le texte grec permet d’entendre soit une venue rapide ou soudaine, soit une venue prochaine. Le texte principal ne fixe pas un calendrier eschatologique précis, et la note conserve explicitement l’autre nuance.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient le ton prophétique; « malheur » préserve le lien terminologique avec la série apocalyptique. La ponctuation en deux phrases rend naturellement la transition marquée par ἰδού.
