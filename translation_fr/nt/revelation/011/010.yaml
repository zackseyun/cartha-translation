id: REV.11.10
reference: Revelation 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: fr
  text: Et ceux qui habitent sur la terre[a] se réjouissent à leur sujet et font la fête, et ils s’enverront des cadeaux les uns aux autres, parce que ces deux prophètes ont tourmenté ceux qui habitent sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’Apocalypse, l’expression « ceux qui habitent sur la terre » désigne souvent le monde humain en rébellion contre Dieu.
    reason: theological_literary_context
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς / τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: ceux qui habitent sur la terre
  rationale: Cette formulation conserve la force verbale du participe et reproduit à l’identique l’expression répétée au début et à la fin du verset. Elle reste naturelle en français et préserve la portée particulière que cette expression récurrente possède dans l’Apocalypse.
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: se réjouissent à leur sujet
  rationale: « Se réjouissent » rend directement χαίρουσιν. « À leur sujet » conserve la relation assez ouverte exprimée par ἐπί, le contexte indiquant que leur joie est liée au sort des deux prophètes sans que la traduction ajoute explicitement « de leur mort ».
- source_word: εὐφραίνονται
  choice: font la fête
  rationale: Le verbe désigne ici une réjouissance festive. « Font la fête » le distingue de χαίρουσιν et exprime naturellement en français actuel l’idée de célébration joyeuse.
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: ils s’enverront des cadeaux les uns aux autres
  rationale: Le futur est conservé, ainsi que l’idée explicite d’envoyer des dons réciproquement. « Cadeaux » convient au contexte de réjouissances.
- source_word: οὗτοι οἱ δύο προφῆται
  choice: ces deux prophètes
  rationale: Rendu direct et naturel du démonstratif avec le groupe nominal.
- source_word: ἐβασάνισαν
  choice: ont tourmenté
  rationale: « Tourmenter » préserve l’intensité de βασανίζω et évite d’atténuer l’effet attribué aux deux prophètes.
theological_decisions:
- issue: Portée de l’expression récurrente « ceux qui habitent sur la terre »
  choice: ceux qui habitent sur la terre
  alternative: les habitants de la terre
  rationale: La formulation choisie préserve le caractère verbal de l’expression grecque et sa répétition exacte, sans expliciter dans le texte principal qu’elle désigne fréquemment, dans l’Apocalypse, l’humanité opposée à Dieu.
- issue: Intensité de l’action des deux prophètes
  choice: ont tourmenté
  alternative: ont affligé
  rationale: Le grec exprime un tourment ou une détresse intense. La traduction ne doit ni adoucir cette affirmation ni préciser au-delà du texte les moyens par lesquels les prophètes ont produit cet effet.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de l’expression « ceux qui habitent sur la terre » est volontaire. « Font la fête » apporte une nuance festive distincte de « se réjouissent » sans archaïsme.
