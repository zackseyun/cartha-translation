id: REV.11.9
reference: Revelation 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: fr
  text: Des gens issus de peuples, de tribus, de langues et de nations regardent leur cadavre[a] pendant trois jours et demi, et ils ne permettent pas que leurs cadavres soient déposés dans un tombeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit d’abord « leur cadavre » au singulier, puis « leurs cadavres » au pluriel. Le singulier peut présenter les deux témoins comme un ensemble, avant le retour aux corps considérés individuellement.
    reason: La note signale la variation de nombre inhabituelle et potentiellement significative dans le texte source, sans en imposer une interprétation.
lexical_decisions:
- source_word: βλέπουσιν
  choice: regardent
  rationale: Le présent et l’action visuelle directe sont conservés. « Regardent » est naturel en français et exprime mieux une observation soutenue que le simple « voient ».
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: Des gens issus de peuples, de tribus, de langues et de nations
  rationale: La préposition ἐκ marque ici un ensemble partiel provenant de ces groupes. « Des gens issus de » rend ce sens partitif sans laisser entendre que chaque membre de tous ces groupes est concerné.
- source_word: λαῶν
  choice: peuples
  rationale: Le pluriel conserve les collectivités distinctes de la formule récurrente de l’Apocalypse.
- source_word: φυλῶν
  choice: tribus
  rationale: « Tribus » est l’équivalent courant et adapté aux listes ethnographiques de l’Apocalypse.
- source_word: γλωσσῶν
  choice: langues
  rationale: Dans cette énumération, γλῶσσα désigne les langues parlées; « langues » est clair et actuel.
- source_word: ἐθνῶν
  choice: nations
  rationale: « Nations » convient à la formule de l’Apocalypse et évite le sens trop restreint de « non-Juifs ».
- source_word: τὸ πτῶμα αὐτῶν
  choice: leur cadavre
  rationale: Le singulier du texte grec est maintenu, bien que deux témoins soient concernés. « Cadavre » indique sans ambiguïté qu’il s’agit d’un corps mort.
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: pendant trois jours et demi
  rationale: Cette tournure française naturelle rend l’accusatif de durée et conserve exactement la période indiquée.
- source_word: τὰ πτώματα αὐτῶν
  choice: leurs cadavres
  rationale: La seconde proposition passe au pluriel dans le grec. Le répéter en français rend visible le passage du singulier collectif au pluriel individuel.
- source_word: οὐκ ἀφίουσιν
  choice: ils ne permettent pas
  rationale: Dans ce contexte, ἀφίημι signifie permettre plutôt que laisser partir ou pardonner.
- source_word: τεθῆναι εἰς μνῆμα
  choice: que leurs cadavres soient déposés dans un tombeau
  rationale: La formulation garde l’idée précise d’une déposition dans un lieu funéraire, plutôt que de la généraliser en « être enterrés ».
theological_decisions:
- issue: Singulier πτῶμα dans la première proposition, puis pluriel πτώματα dans la seconde
  choice: Conserver « leur cadavre » au singulier, puis « leurs cadavres » au pluriel
  alternative: Employer le pluriel dans les deux propositions pour fluidifier le français
  rationale: La variation appartient au texte grec et peut présenter d’abord les deux témoins comme un témoignage collectif, avant de les considérer individuellement. La traduction préserve cette tension sans imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. L’énumération conserve la cadence solennelle de l’Apocalypse; la syntaxe reste naturelle sans effacer le contraste singulier-pluriel.
