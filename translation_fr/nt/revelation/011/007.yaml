id: REV.11.7
reference: Revelation 11:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: fr
  text: Quand ils auront achevé leur témoignage, la bête qui monte de l’abîme leur fera la guerre[a], les vaincra et les tuera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « fera la guerre avec eux ».'
    reason: La note conserve la construction grecque avec μετά, tandis que le texte principal emploie l’expression française idiomatique qui en donne clairement le sens hostile.
lexical_decisions:
- source_word: τελέσωσιν
  choice: auront achevé
  rationale: Après ὅταν, l’aoriste subjonctif exprime ici une éventualité future arrivée à son terme. Le futur antérieur français rend naturellement l’antériorité de l’achèvement par rapport à l’action de la bête.
- source_word: μαρτυρίαν
  choice: témoignage
  rationale: « Témoignage » conserve à la fois l’idée de l’acte de témoigner et sa portée publique, centrale dans l’Apocalypse.
- source_word: θηρίον
  choice: bête
  rationale: « Bête » est le terme français naturel et consacré dans le cadre symbolique et apocalyptique de l’ouvrage, sans ajout interprétatif.
- source_word: ἀναβαῖνον
  choice: qui monte
  rationale: La proposition relative restitue simplement le participe présent et en préserve l’aspect vivant.
- source_word: ἀβύσσου
  choice: abîme
  rationale: « Abîme » correspond directement au grec et évite l’explicitation interprétative « puits sans fond ».
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: leur fera la guerre
  rationale: C’est l’expression française idiomatique correspondant à « faire la guerre avec/contre eux »; elle exprime sans ambiguïté l’hostilité rendue explicite par les verbes suivants.
- source_word: νικήσει
  choice: vaincra
  rationale: « Vaincre » maintient le vocabulaire de victoire caractéristique de l’Apocalypse et convient au contexte de guerre.
- source_word: ἀποκτενεῖ
  choice: tuera
  rationale: « Tuer » est l’équivalent direct, courant et non euphémistique du verbe grec.
theological_decisions:
- issue: Relation hostile dans ποιήσει μετ’ αὐτῶν πόλεμον
  choice: leur fera la guerre
  alternative: fera la guerre avec eux
  rationale: Le grec emploie μετά avec le génitif, littéralement « avec eux », dans une expression de conflit. En français actuel, « leur faire la guerre » transmet exactement le rapport hostile sans suggérer à tort que la bête combattrait à leurs côtés; la forme grecque est signalée en note.
translation_notes:
  register: Français international moderne, sobre et digne. Le futur antérieur suivi de futurs simples rend clairement la succession des actions. La coordination resserrée (« les vaincra et les tuera ») conserve la force cumulative du grec.
