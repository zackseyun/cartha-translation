id: REV.11.4
reference: Revelation 11:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: fr
  text: Ce sont les deux oliviers et les deux chandeliers qui se tiennent devant le Seigneur de la terre[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Allusion à Zacharie 4, où les oliviers et le chandelier évoquent des serviteurs établis par Dieu et rendus capables par son Esprit.
    reason: cross_reference
  - marker: b
    text: Le grec emploie un participe masculin pluriel ; il peut renvoyer aux deux témoins représentés par les oliviers et les chandeliers.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: Ce sont
  rationale: Le démonstratif masculin pluriel renvoie aux deux témoins du contexte. « Ce sont » permet en français une identification naturelle sans réintroduire explicitement « témoins ».
- source_word: ἐλαῖαι
  choice: oliviers
  rationale: Dans cette image apocalyptique qui renvoie à Zacharie 4, le terme désigne des oliviers, non leurs fruits.
- source_word: λυχνίαι
  choice: porte-lampes
  rationale: Le mot désigne les supports sur lesquels sont placées les lampes. « Porte-lampes » conserve cette distinction et l’imagerie caractéristique de l’Apocalypse.
- source_word: ἐνώπιον
  choice: devant
  rationale: « Devant » exprime avec concision la position en présence du Seigneur.
- source_word: κυρίου
  choice: Seigneur
  rationale: Ce titre respecte la portée révérencielle et théologique de κύριος dans ce contexte.
- source_word: γῆς
  choice: terre
  rationale: La portée cosmique de l’Apocalypse favorise « terre » plutôt que « pays ».
- source_word: ἑστῶτες
  choice: qui se tiennent
  rationale: Le participe parfait décrit leur position établie. La proposition relative est naturelle en français et rend l’accord masculin du grec, qui renvoie aux deux témoins malgré les noms imagés féminins.
theological_decisions:
- issue: Rapport entre l’image de Zacharie 4 et l’identité des deux témoins
  choice: 'Conserver l’identification métaphorique directe : « les deux oliviers et les deux porte-lampes »'
  alternative: 'Expliciter : « Ces deux témoins sont comme les deux oliviers et les deux porte-lampes »'
  rationale: Le grec identifie les témoins au moyen de l’image apocalyptique sans ajouter de comparaison ni expliquer le symbole. La formulation retenue préserve l’ambiguïté et la résonance intertextuelle.
- issue: Référent grammatical de ἑστῶτες
  choice: « qui se tiennent », avec un relatif sémantiquement rattaché aux deux témoins
  alternative: « placés devant », accordé aux objets symboliques
  rationale: Le participe grec est masculin pluriel alors que « oliviers » et « porte-lampes » correspondent à des noms grecs féminins. Cet accord signale un retour aux personnes représentées, sans qu’il soit nécessaire de les nommer de nouveau dans le texte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste accessible tout en conservant l’identification métaphorique et la tension grammaticale du grec.
