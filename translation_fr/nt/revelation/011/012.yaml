source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: fr
  text: 'Ils entendirent une voix forte venant du ciel, qui leur disait : « Montez ici ! » Ils montèrent au ciel dans la nuée[a], et leurs ennemis les regardèrent.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un nuage ». Le grec porte « dans la nuée », expression qui peut aussi rappeler des scènes bibliques de présence divine et de vindication.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: Ils entendirent
  rationale: L’aoriste de ἀκούω désigne ici le fait de percevoir la voix céleste; « entendirent » est naturel et précis.
- source_word: φωνῆς μεγάλης
  choice: une voix forte
  rationale: En français, « voix forte » exprime naturellement la puissance ou le volume de la voix, là où « grande voix » serait peu idiomatique.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: venant du ciel
  rationale: Dans ce contexte visionnaire, οὐρανός désigne le ciel comme domaine céleste; la tournure s’intègre naturellement à la phrase.
- source_word: λεγούσης αὐτοῖς
  choice: qui leur disait
  rationale: Le participe féminin se rapporte à « voix » et indique que la parole leur est directement adressée.
- source_word: Ἀνάβατε ὧδε
  choice: Montez ici !
  rationale: L’impératif pluriel appelle les deux témoins à monter jusqu’au lieu d’où vient la voix. « Montez ici » conserve le déictique ὧδε sans ajouter « venez », absent du grec.
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: Ils montèrent au ciel
  rationale: Cette formulation rend le mouvement ascendant vers le ciel avec clarté et sans imposer le terme plus traditionnel « furent élevés ».
- source_word: ἐν τῇ νεφέλῃ
  choice: dans la nuée
  rationale: L’article défini est conservé. « La nuée », terme français biblique encore intelligible, permet de préserver l’éventuel écho aux manifestations de la présence divine.
- source_word: ἐθεώρησαν αὐτοὺς
  choice: sous les yeux de
  rationale: Cette tournure idiomatique exprime que les ennemis assistent visuellement à la scène. Elle conserve l’idée d’observation portée par θεωρέω.
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: leurs ennemis
  rationale: La formulation restitue directement et naturellement le groupe possessif grec.
theological_decisions:
- issue: Éventuelle allusion biblique dans ἐν τῇ νεφέλῃ
  choice: Conserver « dans la nuée » dans le texte principal
  alternative: dans un nuage
  rationale: L’article grec peut évoquer la nuée associée, dans les récits bibliques, à la présence et à la justification divines. La formulation retenue préserve cette possibilité sans l’imposer.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif soutenu de l’Apocalypse. « La nuée » conserve une résonance biblique pertinente tout en étant éclairé par une note.
