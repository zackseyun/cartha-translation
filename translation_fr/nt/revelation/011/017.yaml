source:
  edition: SBLGNT
  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: fr
  text: 'disant : « Nous te rendons grâce, Seigneur Dieu, le Tout-Puissant, toi qui es et qui étais[a], parce que tu as pris en main ta grande puissance et que tu as commencé à régner[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits et certaines traductions ajoutent ici : « et qui viens », selon la formule employée ailleurs dans l’Apocalypse. Cette expression est absente du texte grec retenu ici.'
    reason: textual_variant
  - marker: b
    text: 'Ou : « tu as régné » ou « tu es devenu roi ». Le verbe grec peut souligner le commencement ou l’exercice effectif de la royauté ; dans ce contexte, il semble mettre en relief la manifestation du règne de Dieu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: disant
  rationale: Participe présent actif au nominatif pluriel, rattaché aux anciens du verset précédent ; « disant » assure naturellement la continuité narrative.
- source_word: Εὐχαριστοῦμέν σοι
  choice: Nous te rendons grâce
  rationale: Cette formulation courante conserve le ton solennel et liturgique de l’action de grâce adressée à Dieu.
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: Seigneur Dieu, le Tout-Puissant
  rationale: Rend la suite de titres divins avec dignité et clarté ; l’article devant « Tout-Puissant » correspond bien à l’emploi substantivé du grec.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: toi qui es et qui étais
  rationale: Le pronom « toi » fait ressortir la valeur de désignation divine tout en donnant une syntaxe française naturelle ; les deux repères temporels du grec sont conservés sans ajout.
- source_word: ὅτι
  choice: parce que
  rationale: 'Le lien causal convient à l’action de grâce : les anciens remercient Dieu en raison de son intervention.'
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: tu as pris en main ta grande puissance
  rationale: Le parfait indique une action accomplie dont l’effet demeure. « Pris en main » exprime ici la prise en charge ou la mise en œuvre de la puissance, sans suggérer que Dieu en était auparavant dépourvu.
- source_word: ἐβασίλευσας
  choice: tu as commencé à régner
  rationale: L’aoriste peut ici mettre en relief l’entrée dans l’exercice manifeste de la royauté. Cette traduction exprime la nuance ingressive possible dans le contexte, sans prétendre que Dieu n’était pas souverain auparavant.
theological_decisions:
- issue: Formule du titre divin et absence de « qui vient »
  choice: toi qui es et qui étais
  alternative: toi qui es, qui étais et qui viens
  rationale: Le texte grec de ce verset ne contient que ὁ ὢν καὶ ὁ ἦν. La traduction ne l’harmonise donc pas avec les formules plus longues présentes ailleurs dans l’Apocalypse.
- issue: Portée de l’aoriste ἐβασίλευσας
  choice: tu as commencé à régner
  alternative: tu as régné / tu es devenu roi
  rationale: Dans ce contexte, le chant célèbre l’avènement manifeste du règne de Dieu. La formulation choisie préserve cette nuance contextuelle sans résoudre la tension par une affirmation doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. Le tutoiement respecte l’usage biblique français courant dans l’adresse directe à Dieu. La syntaxe demeure fluide pour une lecture publique tout en conservant les titres divins et les ambiguïtés pertinentes du grec.
