id: REV.11.1
reference: Revelation 11:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: fr
  text: 'Et il me fut donné un roseau semblable à un bâton, avec ces paroles : « Lève-toi et mesure le temple de Dieu[a], l’autel et ceux qui y adorent. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le sanctuaire de Dieu » ; le grec ναός peut désigner plus précisément la partie intérieure du temple plutôt que l’ensemble de son enceinte.
    reason: Alternative lexicale préservant la nuance plus précise possible de ναός.
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: il me fut donné
  rationale: La tournure passive conserve l’accent du grec sur ce qui est donné, sans nommer celui qui le donne.
- source_word: κάλαμος
  choice: un roseau
  rationale: Le sens premier est « roseau ». La comparaison qui suit déconseille de fondre d’emblée le terme dans « baguette à mesurer ».
- source_word: ὅμοιος ῥάβδῳ
  choice: semblable à un bâton
  rationale: Cette formulation rend directement la comparaison exprimée par ὅμοιος avec le datif, sans surcharger l’image d’une interprétation particulière.
- source_word: λέγων
  choice: avec ces paroles
  rationale: Le participe grec est syntaxiquement abrupt et son sujet demeure implicite. Cette tournure française introduit les paroles sans identifier le locuteur.
- source_word: Ἔγειρε
  choice: Lève-toi
  rationale: Impératif direct, naturel en français moderne et adapté au registre solennel de la vision.
- source_word: μέτρησον
  choice: mesure
  rationale: Rend simplement et directement l’impératif grec.
- source_word: ναὸν τοῦ θεοῦ
  choice: le temple de Dieu
  rationale: « Temple » est naturel et exact dans le texte principal, tandis qu’une note conserve la possibilité plus précise de « sanctuaire ».
- source_word: θυσιαστήριον
  choice: l’autel
  rationale: Équivalent usuel de θυσιαστήριον ; le contexte ne permet pas de préciser de quel autel il s’agit.
- source_word: τοὺς προσκυνοῦντας
  choice: ceux qui adorent
  rationale: La proposition relative conserve la valeur verbale du participe substantivé et reste naturelle en français.
- source_word: ἐν αὐτῷ
  choice: y
  rationale: Le pronom adverbial renvoie naturellement au temple et exprime avec fluidité le lieu où ces personnes adorent.
theological_decisions:
- issue: Référent de ναός dans le contexte apocalyptique
  choice: le temple de Dieu
  alternative: le sanctuaire de Dieu
  rationale: Le verset ne tranche pas entre un temple terrestre littéral, un sanctuaire céleste ou une réalité symbolique. La traduction principale garde donc le terme général « temple » sans imposer une lecture eschatologique.
- issue: Identité du locuteur impliqué par λέγων
  choice: laissée implicite par « avec ces paroles »
  alternative: « un ange disant » ou « une voix disant »
  rationale: Le grec n’identifie pas explicitement le locuteur. Nommer un ange ou une voix ajouterait une interprétation absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « il me fut donné » garde le passif du grec et une tonalité visionnaire, tandis que « avec ces paroles » évite d’attribuer explicitement le discours à un ange, à une voix ou au roseau.
