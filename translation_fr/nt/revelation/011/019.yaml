revisions:
- from: Alors le temple de Dieu qui est dans le ciel fut ouvert[a], et l’arche de son alliance devint visible dans son temple. Il y eut des éclairs, des voix[b], des coups de tonnerre, un tremblement de terre et une forte grêle.
