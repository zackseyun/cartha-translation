  rationale: La révision clarifie que « dans le ciel » caractérise le temple, conformément à la syntaxe grecque, tout en conservant le passif et le rythme solennel du verset. Elle rétablit également une note ancrée pour l’alternative relative à l’arche de l’alliance et attribue à la note sur φωναί une ancre propre. Aucun choix doctrinal n’est ajouté et l’ambiguïté contextuelle de « voix » est maintenue.
