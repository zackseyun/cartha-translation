  source_fidelity: 'Le texte rend fidèlement les principaux éléments grecs : le passif de ἠνοίγη, la visibilité de l’arche (ὤφθη), le possessif αὐτοῦ dans « son alliance » et « son temple », ainsi que la série des phénomènes. Toutefois, « le temple de Dieu qui est dans le ciel » permet en français de rattacher « qui est dans le ciel » à « Dieu », alors que le grec qualifie explicitement le temple. La ponctuation proposée lève cette ambiguïté sans modifier le sens.'
  naturalness: Le français est moderne, clair et d’un registre approprié à l’Apocalypse. « Et » est retenu pour refléter la coordination narrative de Καὶ, et l’incise « dans le ciel » est naturelle et évite une relative ambiguë.
  terminology: « Temple », « arche », « alliance », « voix », « coups de tonnerre », « tremblement de terre » et « forte grêle » sont appropriés. La répétition de « temple » préserve celle de ναός. La note sur « l’arche de l’alliance » est ajoutée, avec une ancre distincte, afin de refléter l’alternative documentée dans la piste d’audit anglaise et d’assurer des ancres de notes cohérentes.
  issues:
