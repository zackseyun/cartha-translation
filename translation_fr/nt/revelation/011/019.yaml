id: REV.11.19
reference: Revelation 11:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: fr
  text: Et le temple de Dieu, dans le ciel, fut ouvert[a], et l’arche de son alliance[b] devint visible dans son temple. Il y eut des éclairs, des voix[c], des coups de tonnerre, un tremblement de terre et une forte grêle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctuaire ». Le grec ναός peut désigner plus précisément le lieu saint intérieur plutôt que l’ensemble du temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « l’arche de l’alliance » ; le grec dit explicitement « son alliance ».
    reason: lexical_alternative
  - marker: c
    text: Ou « sons » ou « grondements ». Dans l’Apocalypse, « voix » appartient souvent à une série de manifestations de la majesté et du jugement divins.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: temple
  rationale: « Temple » est naturel en français et convient au sanctuaire céleste dans l’Apocalypse. Le grec désigne plus précisément le lieu saint intérieur plutôt que l’ensemble du complexe religieux; cette nuance est signalée en note.
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: qui est dans le ciel
  rationale: Cette proposition rattache explicitement la localisation céleste au temple, conformément à la construction grecque, sans laisser entendre que « Dieu » serait l’antécédent immédiat.
- source_word: ἠνοίγη
  choice: fut ouvert
  rationale: Le passif conserve la forme événementielle du grec et laisse l’agent implicite, sans préciser qui ouvre le temple.
- source_word: ὤφθη
  choice: devint visible
  rationale: Cette formulation rend le passif de perception sans ajouter un observateur explicite et sans suggérer trop fortement que l’arche se déplace ou agit d’elle-même.
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: l’arche de son alliance
  rationale: Le possessif « son » traduit explicitement αὐτοῦ et présente l’alliance comme celle de Dieu. « Alliance » est le terme français courant et contextuellement juste pour διαθήκη.
- source_word: ἐγένοντο
  choice: il y eut
  rationale: Cette tournure idiomatique française exprime la survenue de toute la série de phénomènes.
- source_word: ἀστραπαὶ
  choice: des éclairs
  rationale: Rendu français direct et naturel du pluriel grec.
- source_word: φωναὶ
  choice: des voix
  rationale: Le sens lexical ordinaire est conservé, ainsi que la formulation théophanique récurrente de l’Apocalypse, même si le contexte permet aussi de comprendre des sons ou des grondements.
- source_word: βρονταὶ
  choice: des coups de tonnerre
  rationale: Cette expression française naturelle rend la pluralité des manifestations du tonnerre.
- source_word: σεισμὸς
  choice: un tremblement de terre
  rationale: Équivalent français standard de σεισμός dans ce contexte apocalyptique.
- source_word: χάλαζα μεγάλη
  choice: une forte grêle
  rationale: Cette expression rend l’intensité indiquée par μεγάλη dans un français actuel, sans développer le nom en « tempête de grêle ».
theological_decisions:
- issue: Nature du ναός céleste
  choice: « temple » dans le texte principal
  alternative: « sanctuaire »
  rationale: « Temple » est immédiatement compréhensible et ne transforme pas la vision en description architecturale trop précise. « Sanctuaire » rend cependant mieux la portée plus étroite possible de ναός; l’alternative est donc conservée en note.
- issue: Sens de φωναὶ dans la scène théophanique
  choice: « voix »
  alternative: « sons » ou « grondements »
  rationale: Le choix principal préserve le lexique distinctif et récurrent de l’Apocalypse ainsi que son ambiguïté. La note indique les lectures contextuelles possibles sans réduire d’office les voix à un phénomène météorologique.
- issue: Agent de l’ouverture du temple
  choice: Maintien du passif « fut ouvert »
  alternative: « s’ouvrit »
  rationale: Le passif grec peut suggérer une action divine sans nommer son agent. Le français conserve cette discrétion au lieu de rendre l’ouverture apparemment spontanée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression solennelle de la vision et l’accumulation finale des phénomènes, tout en évitant les archaïsmes. La répétition de « temple » reflète celle de ναός dans le grec.
