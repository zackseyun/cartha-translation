    issue: Portée ambiguë de « qui est dans le ciel »
    rationale: Dans « le temple de Dieu qui est dans le ciel », la relative peut grammaticalement être comprise comme qualifiant « Dieu ». Dans le grec, ὁ ἐν τῷ οὐρανῷ qualifie ναός. L’incise « le temple de Dieu, dans le ciel » rend ce rattachement clair.
