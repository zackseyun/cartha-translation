    rationale: La piste d’audit anglaise documente cette alternative pour κιβωτὸς τῆς διαθήκης αὐτοῦ. La note française existante emploie l’ancre b pour φωναί, ce qui laisse cette décision lexicale sans note. L’ajout d’une note b et le déplacement de la note sur « voix » à c rétablissent un jeu d’ancres explicite.
