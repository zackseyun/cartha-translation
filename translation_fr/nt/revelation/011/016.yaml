id: REV.11.16
reference: Revelation 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: fr
  text: Et les vingt-quatre anciens, qui étaient assis devant Dieu sur leurs trônes, tombèrent face contre terre et adorèrent Dieu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: les vingt-quatre anciens
  rationale: « Anciens » est le terme français établi pour ces figures du conseil céleste dans l’Apocalypse; il évite de les réduire à de simples hommes âgés.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Cette formulation concise et naturelle conserve la dimension spatiale et relationnelle de leur présence face à Dieu.
- source_word: καθήμενοι ἐπὶ τοὺς θρόνους αὐτῶν
  choice: étaient assis sur leurs trônes
  rationale: Le participe décrit leur position continue. « Étaient assis » en rend clairement le sens, tandis que « sur leurs trônes » conserve l’image royale.
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: tombèrent face contre terre
  rationale: Cette expression française idiomatique restitue la prosternation corporelle exprimée littéralement par « tombèrent sur leurs visages ».
- source_word: προσεκύνησαν τῷ θεῷ
  choice: adorèrent Dieu
  rationale: Puisque l’acte a Dieu pour destinataire dans une scène liturgique céleste, « adorer » exprime ici avec justesse la portée religieuse du verbe.
theological_decisions:
- issue: Portée de προσκυνέω dans la scène céleste
  choice: adorèrent Dieu
  alternative: se prosternèrent devant Dieu / rendirent hommage à Dieu
  rationale: Le destinataire explicite étant Dieu, le sens cultuel est premier. « Adorèrent » ne minimise pas l’acte et n’ajoute aucun contenu doctrinal absent du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Face contre terre » rend idiomatiquement la posture de prosternation, tandis que « anciens » maintient la terminologie reconnue de l’Apocalypse. La virgule finale est conservée puisque le verset se poursuit syntaxiquement au verset suivant.
