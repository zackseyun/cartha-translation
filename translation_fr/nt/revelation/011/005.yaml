id: REV.11.5
reference: Revelation 11:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: fr
  text: Si quelqu’un veut leur faire du mal, du feu sort de leur bouche[a] et dévore leurs ennemis ; et si quelqu’un veut leur faire du mal, il doit être mis à mort de cette manière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de leurs bouches ». Le grec porte littéralement le singulier « de leur bouche », avec un possesseur pluriel.'
    reason: Préciser l’écart possible entre le singulier grec, conservé dans le texte, et le pluriel plus explicite en français.
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: faire du mal à
  rationale: Dans ce contexte apocalyptique, le verbe désigne une action hostile contre les deux témoins. « Faire du mal à » est naturel en français moderne et ne précise pas indûment la forme de l’agression.
- source_word: πῦρ
  choice: du feu
  rationale: Le terme signifie directement « feu ». L’image concrète est conservée sans l’interpréter dans le corps du texte.
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: sort de leur bouche
  rationale: Cette formulation conserve l’image et le singulier στόματος associé à un possesseur pluriel. En français, « leur bouche » peut avoir une valeur distributive ou collective.
- source_word: κατεσθίει
  choice: dévore
  rationale: « Dévore » restitue la force destructive et la vivacité du verbe grec.
- source_word: ἐχθροὺς
  choice: ennemis
  rationale: Équivalent français courant et précis pour ceux qui s’opposent aux témoins.
- source_word: θέλει / θελήσῃ
  choice: veut / voulait
  rationale: Le présent « veut » rend le premier indicatif, tandis que l’imparfait « voulait » exprime naturellement en français la nuance plus éventuelle de la seconde proposition conditionnelle au subjonctif aoriste.
- source_word: οὕτως
  choice: c’est ainsi
  rationale: La formule renvoie clairement à la manière de mourir qui vient d’être décrite.
- source_word: δεῖ
  choice: doit
  rationale: « Doit » conserve la nécessité ou l’inéluctabilité exprimée par le grec sans en préciser la source.
- source_word: ἀποκτανθῆναι
  choice: être mis à mort
  rationale: Cette tournure rend explicitement l’infinitif passif et garde un registre digne sans être archaïque.
theological_decisions:
- issue: Faut-il interpréter l’image du feu qui sort de la bouche ?
  choice: 'Conserver telle quelle l’image : « du feu sort de leur bouche »'
  alternative: Expliciter le feu comme une parole ou un jugement destructeur
  rationale: Le texte grec présente directement cette image apocalyptique sans en donner ici l’interprétation. La traduction préserve donc l’ambiguïté entre lecture littérale et lecture symbolique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme des deux propositions conditionnelles ainsi que la force de l’image apocalyptique.
