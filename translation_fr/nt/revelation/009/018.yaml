  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: fr
  text: 'Par ces trois fléaux, un tiers de l’humanité fut tué : par le feu, la fumée et le soufre qui sortait de leurs bouches.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: Par ces trois fléaux
  rationale: Dans ce contexte, ἀπό indique la cause ou le moyen. « Par » l’exprime naturellement, tandis que « ces » conserve la valeur démonstrative de τούτων.
- source_word: ἀπεκτάνθησαν
  choice: fut tué
  rationale: L’aoriste passif signifie « furent tués ». En français, le sujet collectif singulier « un tiers de l’humanité » appelle naturellement « fut tué ».
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: un tiers de l’humanité
  rationale: La construction partitive désigne un tiers des êtres humains. « L’humanité » est collectif, inclusif et digne, sans limiter ἀνθρώπων aux hommes de sexe masculin.
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: par le feu, la fumée et le soufre
  rationale: ἐκ marque ici ce qui émane des bouches et cause la mort. « Par » rend clairement l’agence létale; « soufre » est le terme français moderne usuel pour θεῖον.
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: qui sortaient de leurs bouches
  rationale: Le participe présent décrit l’émission continue des trois éléments. Le pluriel « sortaient » rattache naturellement la relative au feu, à la fumée et au soufre, conformément au génitif masculin singulier grec employé de façon coordonnée avec le dernier nom.
theological_decisions:
- issue: Portée de ἀνθρώπων dans cette scène de jugement apocalyptique
  choice: l’humanité
  alternative: les êtres humains
  rationale: Le mot vise les humains en général, et non spécifiquement les personnes de sexe masculin. « L’humanité » conserve la portée collective et le registre solennel sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et solennel. Le passé simple convient au registre narratif biblique sans être archaïque. Les articles répétés du grec sont légèrement allégés dans l’énumération pour une expression française naturelle; les trois fléaux demeurent explicitement identifiés.
