id: REV.9.2
reference: Revelation 9:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: fr
  text: Et il ouvrit le puits de l’abîme[a]. Une fumée monta du puits, comme la fumée d’une grande fournaise, et le soleil et l’air furent obscurcis par la fumée du puits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’ouverture de l’abîme » ; traditionnellement : « le puits sans fond ».'
    reason: Signale une autre manière de rendre φρέαρ et la formulation traditionnelle, tout en préservant la distinction entre le puits ou l’ouverture et l’abîme.
lexical_decisions:
- source_word: ἤνοιξεν
  choice: ouvrit
  rationale: L’aoriste de ἀνοίγω indique simplement l’action d’ouvrir, sans préciser le mécanisme.
- source_word: φρέαρ
  choice: puits
  rationale: φρέαρ désigne un puits ou une ouverture profonde. « Puits » est naturel en français et maintient la distinction avec l’abîme lui-même.
- source_word: ἀβύσσου
  choice: de l’abîme
  rationale: « Abîme » rend directement ἄβυσσος et évite l’expression traditionnelle mais plus interprétative « puits sans fond ».
- source_word: ἀνέβη
  choice: monta
  rationale: Le verbe exprime un mouvement ascendant; « monta » est direct et idiomatique.
- source_word: καπνὸς
  choice: fumée
  rationale: Équivalent français courant, répété de manière cohérente dans le verset.
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: comme la fumée d’une grande fournaise
  rationale: « Comme » conserve la comparaison introduite par ὡς; « fournaise » rend l’image intense de κάμινος dans un registre biblique encore compréhensible aujourd’hui.
- source_word: ἐσκοτώθη
  choice: furent obscurcis
  rationale: Le passif est conservé. Le pluriel français s’accorde naturellement avec le sujet composé « le soleil ainsi que l’air » malgré le verbe grec au singulier.
- source_word: ὁ ἀὴρ
  choice: l’air
  rationale: ἀήρ désigne l’air ou l’atmosphère; « air » est plus direct que « ciel ».
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: par la fumée du puits
  rationale: « Par » exprime naturellement la cause de l’obscurcissement, tandis que « du puits » indique la provenance de la fumée.
theological_decisions:
- issue: Rendre le lieu apocalyptique sans importer une interprétation traditionnelle
  choice: « le puits de l’abîme »
  alternative: « le puits sans fond » ou « l’ouverture de l’abîme »
  rationale: Cette formulation distingue φρέαρ, le puits ou l’ouverture, de ἄβυσσος, l’abîme, et n’ajoute pas explicitement l’idée de « sans fond », absente du nom grec dans ce verset.
translation_notes:
  register: Français international moderne, naturel et digne. « Fournaise » conserve la force de l’image apocalyptique; la ponctuation en deux phrases allège la longue coordination grecque sans modifier les relations logiques.
