id: REV.9.15
reference: Revelation 9:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: fr
  text: Et les quatre anges qui avaient été préparés pour l’heure, le jour, le mois et l’année[a] furent libérés, afin de tuer un tiers de l’humanité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour cette heure, ce jour, ce mois et cette année ». Le grec peut souligner un moment fixé avec précision.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un tiers des humains ». Le grec désigne ici les êtres humains en général, et non uniquement les hommes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύθησαν
  choice: furent libérés
  rationale: L’aoriste passif de λύω renvoie ici à la libération des anges auparavant liés. « Furent libérés » est naturel en français moderne et conserve clairement le passif.
- source_word: οἱ τέσσαρες ἄγγελοι
  choice: les quatre anges
  rationale: Dans ce contexte apocalyptique, ἄγγελοι désigne des êtres célestes, non de simples messagers humains.
- source_word: οἱ ἡτοιμασμένοι
  choice: qui avaient été préparés
  rationale: Le participe parfait passif exprime une préparation antérieure dont l’état résultant demeure au moment de leur libération.
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: pour l’heure, le jour, le mois et l’année
  rationale: Cette formulation conserve l’accumulation des indications temporelles et leur précision, sans décider si elles désignent un instant exactement fixé ou une durée cumulée.
- source_word: ἵνα ἀποκτείνωσιν
  choice: afin de tuer
  rationale: ἵνα avec le subjonctif exprime ici le but. « Afin de tuer » en rend la force de manière claire et digne, sans l’atténuer.
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: un tiers de l’humanité
  rationale: L’expression partitive signifie « un tiers », et ἀνθρώπων désigne les êtres humains en général, sans restriction aux hommes de sexe masculin.
theological_decisions:
- issue: Portée de l’expression temporelle « l’heure, le jour, le mois et l’année »
  choice: Conserver la série temporelle telle quelle, en laissant entendre un moment précisément fixé sans l’expliciter davantage.
  alternative: Comprendre l’expression comme une durée totale d’une année, d’un mois, d’un jour et d’une heure.
  rationale: Le grec regroupe vraisemblablement toute la série sous un même article et souligne une détermination temporelle précise. La traduction préserve toutefois l’ambiguïté apocalyptique et n’impose aucun système chronologique.
- issue: Portée de ἀνθρώπων
  choice: l’humanité
  alternative: les humains ; les hommes
  rationale: Le terme grec est générique. « L’humanité » exprime correctement la portée collective sans introduire une référence exclusivement masculine.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec tout en évitant les tournures archaïques. Les marqueurs de notes sont placés immédiatement après les expressions qu’ils éclairent.
