id: REV.9.3
reference: Revelation 9:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: fr
  text: Des sauterelles sortirent de la fumée et vinrent sur la terre. Un pouvoir[a] leur fut donné, semblable à celui que possèdent les scorpions de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une autorité ». Le mot grec peut désigner une autorité, un droit ou un pouvoir ; ici, « pouvoir » souligne la capacité d’agir qui leur est accordée.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ ἐξῆλθον
  choice: sortirent de la fumée
  rationale: Cette formulation rend directement le mouvement depuis l’intérieur de la fumée et conserve l’image saisissante de leur apparition.
- source_word: ἀκρίδες
  choice: sauterelles
  rationale: Dans ce contexte biblique et apocalyptique, ἀκρίδες désigne des sauterelles, et non de simples criquets au sens large.
- source_word: εἰς τὴν γῆν
  choice: vinrent sur la terre
  rationale: La tournure exprime naturellement en français le mouvement dirigé vers la terre, sans réduire γῆ au seul sens de « pays » ou de « sol ».
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: Un pouvoir leur fut donné
  rationale: « Pouvoir » exprime ici la capacité effective qui leur est accordée. Le passif maintient l’idée d’une permission reçue sans nommer celui qui la donne.
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: semblable à celui que possèdent
  rationale: Cette formulation française naturelle conserve la comparaison explicite avec le pouvoir des scorpions.
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: les scorpions de la terre
  rationale: Le génitif est rendu sans explicitation interprétative et maintient le contraste spatial du passage.
theological_decisions:
- issue: Nature et origine du pouvoir accordé aux sauterelles
  choice: Conserver le passif « leur fut donné » sans préciser le donateur.
  alternative: Nommer Dieu comme celui qui leur donne ce pouvoir, ou traduire par une capacité autonome.
  rationale: Le texte présente leur pouvoir comme reçu et donc limité, mais il ne désigne pas explicitement celui qui le donne. La traduction préserve cette retenue et la tension théologique du passif.
translation_notes:
  register: Français international moderne, sobre et digne. La première phrase évite une construction trop calquée sur le grec, tandis que la seconde conserve le passif théologiquement significatif. La répétition grecque de ἐξουσία est représentée par le pronom « celui », solution plus idiomatique en français.
