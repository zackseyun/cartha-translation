id: REV.9.4
reference: Revelation 9:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: fr
  text: Il leur fut dit de ne faire de mal ni à l’herbe de la terre, ni à rien de vert, ni à aucun arbre, mais seulement aux êtres humains qui ne portent pas le sceau de Dieu sur le front.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: Il leur fut dit
  rationale: Cette tournure conserve le passif et laisse, comme le grec, l’identité de celui qui parle implicite. Le pronom féminin renvoie contextuellement aux sauterelles, sans qu’il soit nécessaire de les nommer ici.
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: de ne faire de mal
  rationale: Dans ce contexte de jugement, ἀδικέω désigne le fait de causer du tort ou des dégâts. La construction infinitive rend naturellement en français l’instruction introduite par ἵνα μή.
- source_word: τὸν χόρτον τῆς γῆς
  choice: l’herbe de la terre
  rationale: Traduction directe qui conserve le rapport génitif et la portée terrestre de la vision.
- source_word: οὐδὲ πᾶν χλωρόν
  choice: ni à rien de vert
  rationale: Le grec emploie l’adjectif χλωρόν substantivé, sans nommer explicitement une plante. « Rien de vert » en préserve la généralité et reste idiomatique.
- source_word: οὐδὲ πᾶν δένδρον
  choice: ni à aucun arbre
  rationale: Équivalent direct de la coordination négative et de δένδρον.
- source_word: εἰ μὴ τοὺς ἀνθρώπους
  choice: mais seulement aux êtres humains
  rationale: εἰ μή introduit ici l’unique cible permise. « Êtres humains » exprime la portée générique de ἀνθρώπους sans la limiter aux hommes de sexe masculin.
- source_word: οἵτινες οὐκ ἔχουσι
  choice: qui ne portent pas
  rationale: Pour un sceau placé sur le front, « porter » est plus naturel en français que « avoir », tout en conservant le sens de possession ou de présence.
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: le sceau de Dieu
  rationale: « Sceau » maintient le symbole apocalyptique d’appartenance et de protection, ainsi que la construction génitive.
- source_word: ἐπὶ τῶν μετώπων
  choice: sur le front
  rationale: Le singulier distributif français est naturel lorsque plusieurs personnes ont chacune le sceau sur leur propre front.
theological_decisions:
- issue: Identité de l’auteur de l’instruction
  choice: La voix passive est conservée sans nommer celui qui donne l’ordre.
  alternative: Expliciter que Dieu leur donna cet ordre.
  rationale: Le texte grec laisse l’agent implicite. Même si le contexte suggère une autorité divine, la traduction ne doit pas ajouter un sujet absent.
- issue: Portée de ἀνθρώπους
  choice: « êtres humains », au sens générique
  alternative: « hommes », susceptible d’être compris comme désignant seulement les personnes de sexe masculin
  rationale: Le contraste oppose la végétation aux personnes dépourvues du sceau de Dieu; rien ne restreint celles-ci aux hommes.
- issue: Fonction du sceau de Dieu
  choice: Le symbole est rendu sans en expliciter la fonction dans le verset.
  alternative: Ajouter qu’il s’agit d’un signe de protection ou d’appartenance.
  rationale: Ces notions ressortent du contexte de l’Apocalypse, mais le verset se contente de mentionner la présence ou l’absence du sceau.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le rythme ternaire des éléments de la végétation et la restriction finale. « Rien de vert » maintient volontairement la formulation large du grec.
