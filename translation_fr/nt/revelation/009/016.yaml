lexical_decisions:
- source_word: ἀριθμὸς
  choice: nombre
  rationale: Équivalent direct et naturel, repris dans la seconde proposition comme en grec.
- source_word: στρατευμάτων
  choice: troupes
  rationale: Le pluriel désigne ici des corps ou forces militaires ; « troupes » s’associe naturellement à « cavalerie ».
- source_word: ἱππικοῦ
  choice: cavalerie
  rationale: Le substantif collectif désigne une force montée plutôt que les cavaliers pris individuellement.
- source_word: δισμυριάδες μυριάδων
  choice: deux cents millions
  rationale: L’expression associe deux myriades à des myriades et correspond numériquement à 200 000 000 ; la formulation moderne communique clairement ce total, tandis que la forme grecque est signalée en note.
- source_word: ἤκουσα
  choice: j’entendis
  rationale: Le passé simple convient au registre narratif biblique français tout en restant clair et dignifié.
- source_word: αὐτῶν
  choice: leur
  rationale: Le pronom renvoie aux troupes de cavalerie et se rend idiomatiquement par le possessif français.
