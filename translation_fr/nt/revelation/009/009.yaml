id: REV.9.9
reference: Revelation 9:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: fr
  text: Ils avaient des cuirasses semblables à des cuirasses de fer, et le bruit de leurs ailes était comme celui de chars tirés par de nombreux chevaux courant au combat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « comme le bruit de chars de nombreux chevaux courant au combat ».'
    reason: La construction grecque rattache grammaticalement « courant » aux chevaux et peut être reproduite plus littéralement, mais de façon moins naturelle en français.
lexical_decisions:
- source_word: θώρακας
  choice: cuirasses
  rationale: θώραξ désigne une armure protégeant le torse. « Cuirasses » est précis, courant dans un contexte militaire et permet de conserver la répétition de la comparaison.
- source_word: ὡς θώρακας σιδηροῦς
  choice: semblables à des cuirasses de fer
  rationale: ὡς introduit une comparaison. Cette formulation française préserve explicitement la similitude sans affirmer que les cuirasses étaient réellement en fer.
- source_word: φωνὴ
  choice: bruit
  rationale: Dans ce contexte, φωνή désigne un phénomène audible produit par des ailes et comparé à celui de chars. « Bruit » est naturel en français et convient à l’intensité de l’image.
- source_word: πτερύγων
  choice: ailes
  rationale: πτέρυξ signifie directement « aile » ; le génitif est rendu naturellement par « le bruit de leurs ailes ».
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: chars tirés par de nombreux chevaux
  rationale: La formulation conserve explicitement les chars et les nombreux chevaux tout en exprimant leur relation de manière intelligible en français moderne.
- source_word: τρεχόντων
  choice: lancés
  rationale: Le participe de τρέχω exprime une course rapide. « Lancés » rend naturellement cette vive progression dans l’image de chevaux allant au combat, sans imposer l’idée plus précise d’une charge.
- source_word: εἰς πόλεμον
  choice: au combat
  rationale: Dans cette scène de chars en mouvement, « au combat » restitue avec naturel la direction et la portée militaire de l’expression.
theological_decisions:
- issue: Nature de l’image dans la vision de Jean
  choice: Présenter la scène comme une comparaison visionnaire sans identifier ce qu’elle représenterait.
  alternative: Interpréter les êtres décrits comme des machines littérales, des démons ou une armée symbolique déterminée.
  rationale: Le texte emploie explicitement ὡς (« comme », « semblables à »). La traduction conserve donc l’image apocalyptique et son ouverture interprétative sans trancher les débats sur son référent.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « cuirasses » est conservée afin de refléter celle du grec. Les comparaisons restent explicites et aucune interprétation particulière de l’imagerie apocalyptique n’est introduite.
