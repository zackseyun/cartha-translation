id: REV.9.5
reference: Revelation 9:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: fr
  text: Il leur fut donné, non pas de les tuer, mais de les tourmenter pendant cinq mois. Leur tourment était semblable à celui d’un scorpion lorsqu’il pique une personne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: Il leur fut donné
  rationale: Conserve le passif sans nommer celui qui accorde ce pouvoir, conformément à l’expression apocalyptique et à l’ambiguïté du grec.
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: non pas de les tuer
  rationale: Exprime naturellement en français le contenu ou le but négatif lié à « il leur fut donné ».
- source_word: ἀλλ’ ἵνα βασανισθήσονται
  choice: mais de les tourmenter
  rationale: Rend le contraste et le résultat visé malgré la construction grecque inhabituelle du futur passif après ἵνα.
- source_word: μῆνας πέντε
  choice: pendant cinq mois
  rationale: Rend clairement l’accusatif de durée.
- source_word: βασανισθήσονται / βασανισμός
  choice: tourmenter / tourment
  rationale: Maintient la répétition lexicale du groupe βασαν- sans introduire l’idée plus précise de torture judiciaire.
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: Le tourment qu’elles infligeaient
  rationale: Dans le contexte, le génitif désigne naturellement le tourment causé par les créatures; cette formulation évite l’ambiguïté peu naturelle de « leur tourment » en français.
- source_word: ὡς βασανισμὸς σκορπίου
  choice: semblable à celui d’un scorpion
  rationale: Conserve la comparaison tout en évitant une répétition lourde en français.
- source_word: ὅταν παίσῃ
  choice: lorsqu’il pique
  rationale: παίω signifie littéralement frapper, mais avec un scorpion le français idiomatique et contextuellement précis est « piquer ».
- source_word: ἄνθρωπον
  choice: une personne
  rationale: ἄνθρωπος a ici une valeur générique; « une personne » communique cette portée sans suggérer que seuls les hommes sont concernés.
theological_decisions:
- issue: Passif divin dans le jugement apocalyptique
  choice: Conserver « Il leur fut donné » sans identifier l’auteur du don.
  alternative: « Dieu leur donna le pouvoir » ou « elles reçurent la permission »
  rationale: Le grec ne nomme pas explicitement Dieu. Le passif préserve la tension entre souveraineté divine et action d’agents intermédiaires.
- issue: Référent du tourment
  choice: Comprendre « leur tourment » comme le tourment infligé par les créatures.
  alternative: Le tourment qu’elles subissent
  rationale: Le contexte immédiat oppose la mise à mort des humains au tourment qui leur est imposé; les créatures sont donc les agents du tourment.
- issue: Valeur générique de ἄνθρωπον
  choice: « une personne »
  alternative: « un homme »
  rationale: Le nom grec est générique dans cette comparaison et ne désigne pas spécifiquement un individu masculin.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe reste proche du grec tout en évitant les calques pesants; les pronoms féminins renvoient naturellement aux sauterelles du contexte précédent.
