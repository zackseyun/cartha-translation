id: REV.9.21
reference: Revelation 9:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: fr
  text: Et ils ne se repentirent pas de leurs meurtres, ni de leurs pratiques magiques[a], ni de leur immoralité sexuelle, ni de leurs vols.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sorcelleries », « sortilèges »; le terme grec peut aussi être associé à des potions ou à des empoisonnements.
    reason: Alternative lexicale préservant l’étendue sémantique de φαρμάκων.
lexical_decisions:
- source_word: μετενόησαν
  choice: se repentirent
  rationale: Dans ce contexte moral, μετανοέω exprime la repentance et l’abandon du mal, et non un simple changement d’opinion. « Se repentir de » est idiomatique en français avec les compléments introduits par ἐκ.
- source_word: φόνων
  choice: meurtres
  rationale: φόνος désigne ici des homicides moralement condamnables. « Meurtres » conserve cette force plus précisément que le terme général « morts ».
- source_word: φαρμάκων
  choice: pratiques magiques
  rationale: Dans l’Apocalypse, le mot et ses apparentés renvoient généralement à la magie ou à la sorcellerie. « Pratiques magiques » est naturel en français moderne et assez large pour ne pas réduire le sens à des sorts particuliers; les liens lexicaux possibles avec les potions et les poisons sont signalés en note.
- source_word: πορνείας
  choice: immoralité sexuelle
  rationale: πορνεία couvre un ensemble de conduites sexuelles jugées immorales. Cette expression moderne en préserve l’étendue sans employer le terme plus étroit ou vieilli « fornication ».
- source_word: κλεμμάτων
  choice: vols
  rationale: κλέμμα peut désigner ce qui est volé ou un acte de vol; dans cette liste de vices, le pluriel « vols » est concis et naturel.
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: ni ... ni ... ni
  rationale: Après la négation initiale, la coordination répétée par « ni » reproduit clairement et naturellement la structure cumulative du grec.
theological_decisions:
- issue: Portée sémantique de φαρμάκων dans une liste de vices apocalyptique
  choice: pratiques magiques
  alternative: sortilèges, sorcelleries, potions ou empoisonnements
  rationale: Le contexte de l’Apocalypse favorise le sens de pratiques occultes ou magiques. La traduction principale retient ce sens sans réduire anachroniquement le mot aux produits pharmaceutiques modernes, tandis que la note préserve son association lexicale possible avec des potions ou des poisons.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif de l’Apocalypse. La répétition de « leurs » et la série de « ni » conservent le rythme accusateur du grec.
