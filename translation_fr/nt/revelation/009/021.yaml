  source_fidelity: 'Le texte rend fidèlement la structure de καὶ οὐ μετενόησαν ἐκ τῶν... : la négation, le repentir à l’égard des quatre catégories et la coordination cumulative sont conservés. « Meurtres », « pratiques magiques », « immoralité sexuelle » et « vols » correspondent adéquatement à φόνων, φαρμάκων, πορνείας et κλεμμάτων. Le choix contextuel de « pratiques magiques » pour φαρμάκων est solide et la note préserve à juste titre la gamme lexicale incluant potions et empoisonnements.'
  naturalness: La formulation est naturelle en français international moderne. « Ne se repentirent pas de... ni de... » est idiomatique, et le passé simple convient au registre solennel et visionnaire de l’Apocalypse. La répétition de « ni » reproduit bien l’insistance de la liste grecque sans lourdeur excessive.
  terminology: La terminologie morale demeure suffisamment large et ne surinterprète pas le texte. « Immoralité sexuelle » rend la portée générale de πορνεία sans la restreindre à une catégorie particulière. « Pratiques magiques » évite à la fois l’archaïsme possible de « sorcelleries » dans le texte courant et une assimilation anachronique à la pharmacologie moderne. L’ancre de note [a] est correctement placée sur le terme concerné.
