id: REV.9.13
reference: Revelation 9:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: fr
  text: Le sixième ange sonna de la trompette, et j’entendis une seule voix venant des cornes de l’autel d’or qui se trouve devant Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: sonna de la trompette
  rationale: Le verbe désigne l’action de faire retentir une trompette. Cette formulation française est naturelle dans la séquence des sonneries de l’Apocalypse, sans devoir ajouter un possessif absent du grec.
- source_word: φωνὴν μίαν
  choice: une seule voix
  rationale: μίαν souligne ici l’unicité de la voix. « Une seule voix » rend cette insistance explicitement et naturellement, sans préciser l’identité de celui qui parle.
- source_word: ἐκ τῶν κεράτων
  choice: venant des cornes
  rationale: ἐκ indique la provenance. « Venant des cornes » conserve l’image cultuelle des saillies en forme de corne de l’autel tout en produisant une phrase française fluide.
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: l’autel d’or
  rationale: Cette expression idiomatique rend la construction grecque et conserve l’imagerie du sanctuaire céleste.
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: qui se trouve devant Dieu
  rationale: La formulation exprime la position de l’autel en présence de Dieu sans ajouter l’idée plus précise qu’il serait debout.
- source_word: ἄγγελος
  choice: ange
  rationale: Dans cette vision de l’Apocalypse, le terme désigne clairement un être angélique plutôt qu’un messager humain.
theological_decisions:
- issue: Identité de la voix
  choice: Conserver la formulation neutre « une seule voix » sans en identifier l’auteur.
  alternative: Préciser qu’il s’agit de la voix de Dieu, d’un ange ou d’une voix associée à l’autel.
  rationale: Le grec indique seulement que Jean entend une voix provenant des cornes de l’autel d’or. Identifier celui qui parle résoudrait une ambiguïté que le texte maintient.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche de la progression grecque, tandis que « une seule voix » préserve l’accent porté par μίαν. Aucun appel de note n’est nécessaire, puisque cette nuance est intégrée directement au texte.
