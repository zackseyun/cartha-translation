id: REV.9.1
reference: Revelation 9:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: fr
  text: Le cinquième ange sonna de la trompette. Je vis alors une étoile[c] qui était tombée du ciel sur la terre[a], et la clé du puits de l’abîme[b] lui fut donnée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait traduire plus brièvement : « une étoile tombée du ciel sur la terre ». Le participe grec au parfait indique vraisemblablement que la chute avait déjà eu lieu lorsque Jean vit l’étoile.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction possible : « la clé de la fosse de l’abîme ». La formulation traditionnelle « le puits sans fond » interprète davantage l’expression grecque.'
    reason: lexical_alternative
  - marker: c
    text: L’« étoile » peut symboliser un être personnel, puisque la suite du verset dit que la clé lui fut donnée.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: sonna de la trompette
  rationale: Le verbe σαλπίζω signifie faire retentir une trompette. Cette formulation française conserve explicitement l’image de la trompette sans ajouter de possessif absent du grec.
- source_word: ἀστέρα
  choice: une étoile
  rationale: ἀστήρ désigne littéralement une étoile. Même si l’image peut représenter un être personnel dans ce contexte apocalyptique, la traduction conserve l’image sans l’interpréter dans le corps du texte.
- source_word: πεπτωκότα
  choice: qui était tombée
  rationale: Le participe parfait présente une chute déjà accomplie et l’état qui en résulte. « Qui était tombée » marque clairement que la chute précède la vision de Jean.
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: du ciel sur la terre
  rationale: Dans le cadre visionnaire de l’Apocalypse, οὐρανός désigne ici le ciel. « Sur la terre » rend naturellement le mouvement exprimé par εἰς et maintient le contraste cosmique.
- source_word: ἐδόθη αὐτῷ
  choice: lui fut donnée
  rationale: La tournure passive conserve l’agent non exprimé, comme dans le grec, et n’explicite donc pas une intervention divine que le verset laisse implicite.
- source_word: ἡ κλεὶς
  choice: la clé
  rationale: L’article grec appelle naturellement le défini « la clé ».
- source_word: τοῦ φρέατος
  choice: du puits
  rationale: φρέαρ peut désigner un puits, une fosse ou un conduit profond. « Puits » conserve l’image d’une ouverture verticale donnant accès à l’abîme et maintient la construction au génitif.
- source_word: τῆς ἀβύσσου
  choice: de l’abîme
  rationale: « Abîme » est l’équivalent français direct et consacré de ἄβυσσος; il préserve le terme apocalyptique sans lui ajouter explicitement l’idée de fond inexistant.
theological_decisions:
- issue: Faut-il identifier l’« étoile » à un ange ou à Satan dans le texte principal ?
  choice: Conserver « étoile » sans identification interprétative
  alternative: « être angélique » ou « Satan »
  rationale: Le verset présente la figure sous l’image d’une étoile, puis emploie un pronom qui peut renvoyer à un être personnel. Il ne l’identifie toutefois pas explicitement; la traduction préserve donc cette tension.
- issue: Faut-il nommer Dieu comme celui qui donne la clé ?
  choice: Maintenir le passif sans nommer l’agent
  alternative: « Dieu lui donna la clé »
  rationale: L’agent du passif ἐδόθη n’est pas exprimé. Même si une permission divine est plausible dans le contexte, l’ajout de « Dieu » dépasserait ce que dit explicitement le grec.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du grec tout en évitant un calque pesant. Le passé simple convient au registre narratif solennel de l’Apocalypse; « qui était tombée » rend avec précision l’antériorité et l’état résultant du parfait grec.
