id: REV.9.20
reference: Revelation 9:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: fr
  text: Et le reste des êtres humains[a], ceux qui n’avaient pas été tués par ces plaies, ne se repentirent même pas des œuvres de leurs mains[b], afin de ne pas adorer les démons et les idoles d’or, d’argent, de bronze, de pierre et de bois[c], qui ne peuvent ni voir, ni entendre ni marcher.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le reste de l’humanité ». Le terme grec désigne ici les êtres humains en général.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « se repentir des œuvres de leurs mains ». L’expression vise ici tout particulièrement ce qu’ils avaient fabriqué et adoraient.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « de sorte qu’ils n’adorent pas ». La proposition grecque peut exprimer le but ou le résultat visé de la repentance.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: le reste des humains
  rationale: « Humains » rend le sens générique de ἀνθρώπων sans le limiter aux hommes de sexe masculin, tandis que « le reste » conserve la valeur collective de λοιποί.
- source_word: ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις
  choice: n’avaient pas été tués par ces fléaux
  rationale: Le plus-que-parfait situe naturellement en français leur survie avant leur absence de repentance; « fléaux » convient au sens apocalyptique de πληγαί.
- source_word: οὐδὲ μετενόησαν
  choice: ne se repentirent pas même
  rationale: 'La tournure conserve l’insistance de οὐδέ : malgré les fléaux auxquels ils avaient survécu, ils ne se repentirent pas.'
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: des œuvres de leurs mains
  rationale: « Se repentir de » est idiomatique en français; l’expression concrète préserve l’image biblique et prépare la mention des idoles fabriquées.
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: de manière à ne plus adorer
  rationale: Cette formulation relie la repentance à l’abandon du culte déjà pratiqué, tout en laissant ouverte la nuance de but ou de résultat de ἵνα μή.
- source_word: τὰ δαιμόνια
  choice: les démons
  rationale: « Démons » est le terme français courant et précis pour ces êtres spirituels hostiles dans le Nouveau Testament.
- source_word: τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: les idoles d’or, d’argent, de bronze, de pierre et de bois
  rationale: La liste des matières est naturelle en français et conserve l’effet cumulatif ainsi que le caractère cultuel exprimé par εἴδωλα.
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: qui ne peuvent ni voir, ni entendre, ni marcher
  rationale: La traduction préserve la triple négation rhétorique qui souligne l’impuissance des idoles, et rend περιπατεῖν littéralement par « marcher ».
theological_decisions:
- issue: Portée générique de ἀνθρώπων
  choice: le reste des humains
  alternative: le reste de l’humanité; les autres êtres humains
  rationale: Le grec désigne ici les êtres humains en général; la formulation retenue maintient le contraste entre ceux qui ont péri et ceux qui restent sans introduire une restriction masculine.
- issue: Rapport entre la repentance et l’abandon de l’idolâtrie dans ἵνα μὴ προσκυνήσουσιν
  choice: de manière à ne plus adorer
  alternative: afin de ne plus adorer; si bien qu’ils cessent d’adorer
  rationale: Le texte présente la cessation du culte idolâtre comme liée à la repentance. « De manière à » préserve mieux que les alternatives l’ouverture entre but et résultat sans imposer une théorie particulière de la repentance.
translation_notes:
  register: Français international moderne, soutenu mais accessible. Le passé simple convient au registre narratif biblique. La répétition de « ni » et la liste des matières gardent la cadence solennelle et polémique du grec.
