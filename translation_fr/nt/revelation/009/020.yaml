  verdict: revise
  source_fidelity: 'La structure et les principaux termes sont bien rendus. Une correction est toutefois indiquée : « ne plus adorer » ajoute explicitement l’idée de cessation, qui est contextuellement plausible mais n’est pas exprimée par μὴ προσκυνήσουσιν. « Afin de ne pas adorer » conserve la formulation négative du grec tout en laissant la relation de but/résultat ouverte par note.'
  naturalness: Le français est globalement naturel et soutenu. « Ne se repentirent même pas » est plus idiomatique que « ne se repentirent pas même ». « Le reste des êtres humains » est plus naturel et moins elliptique que « le reste des humains » dans ce registre.
  terminology: « Plaies » rend plus directement πληγαί dans le vocabulaire apocalyptique. « Démons », « idoles » et la liste des matériaux sont exacts. La note b doit éviter le pseudo-littéral « hors des œuvres », qui n’est pas français.
