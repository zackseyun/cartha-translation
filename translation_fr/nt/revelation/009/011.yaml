  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: fr
  text: Elles ont au-dessus d’elles, comme roi, l’ange de l’abîme[a]. Son nom en hébreu est Abaddon[b], et en grec il porte le nom d’Apollyon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du puits sans fond » pour « de l’abîme ».
    reason: alternative_reading
  - marker: b
    text: Abaddon est un nom hébreu associé à la destruction.
    reason: lexical_alternative
  - marker: c
    text: Apollyon est un nom grec qui signifie « destructeur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: Elles ont pour roi au-dessus d’elles
  rationale: Cette formulation conserve le verbe « avoir », la fonction de roi et l’idée explicite de domination exprimée par ἐπί avec le génitif. Le féminin « elles » renvoie aux créatures comparées à des sauterelles dans le contexte précédent.
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: l’ange de l’abîme
  rationale: Dans l’Apocalypse, ἄγγελος désigne naturellement un ange. « Abîme » rend directement ἄβυσσος sans ajouter l’idée interprétative d’un puits.
- source_word: ὄνομα αὐτῷ Ἑβραϊστὶ
  choice: Son nom en hébreu est
  rationale: Cette tournure française naturelle rend l’expression possessive au datif et l’adverbe Ἑβραϊστί, « en hébreu ».
- source_word: Ἀβαδδών
  choice: Abaddon
  rationale: Le terme fonctionne ici comme un nom propre; il est donc transcrit plutôt que remplacé par son sens, « destruction ».
- source_word: καὶ ἐν τῇ Ἑλληνικῇ ὄνομα ἔχει
  choice: et en grec il porte le nom de
  rationale: La formulation préserve la répétition grecque autour du nom tout en restant idiomatique et digne en français.
- source_word: Ἀπολλύων
  choice: Apollyon
  rationale: Le mot grec est employé comme nom propre. Sa valeur transparente de « destructeur » est indiquée en note.
theological_decisions:
- issue: Traduire ou transcrire les noms Ἀβαδδών et Ἀπολλύων
  choice: 'Transcrire les deux noms dans le texte principal : « Abaddon » et « Apollyon ».'
  alternative: Les traduire par « Destruction » et « Destructeur ».
  rationale: Le verset les présente comme les noms de l’ange. La transcription respecte cette fonction, tandis que les notes conservent leur portée sémantique sans imposer une identification théologique supplémentaire.
- issue: Rendu de ἀβύσσου
  choice: abîme
  alternative: puits sans fond
  rationale: « Abîme » est l’équivalent lexical le plus direct et préserve l’image du grec sans préciser une forme de « puits » absente du terme lui-même.
translation_notes:
  register: Français international moderne, clair et soutenu. La structure du grec est conservée sans raideur excessive; la répétition relative au nom reste perceptible. Les noms propres suivent les formes françaises usuelles.
