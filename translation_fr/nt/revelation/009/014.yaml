  text: ⸀λέγοντα τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα· Λῦσον τοὺς τέσσαρας ἀγγέλους τοὺς δεδεμένους ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: fr
  text: 'disant au sixième ange, celui qui tenait la trompette : « Libère les quatre anges qui sont liés auprès du grand fleuve Euphrate[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui ont été liés » ou « se trouvant liés » ; le participe parfait grec souligne leur état actuel de contrainte, résultant d’une action antérieure qui les a liés.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντα
  choice: disant
  rationale: Le participe présent est conservé afin de rattacher directement cette parole à la voix mentionnée au verset précédent.
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: au sixième ange
  rationale: Rend naturellement le datif désignant le destinataire.
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: celui qui avait la trompette
  rationale: La formulation appositive identifie clairement l’ange auquel la voix s’adresse; l’imparfait convient au cadre narratif.
- source_word: Λῦσον
  choice: Libère
  rationale: Impératif clair et actuel exprimant la levée de la contrainte.
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: les quatre anges
  rationale: Traduction directe, sans préciser leur nature morale, que le texte laisse indéterminée.
- source_word: τοὺς δεδεμένους
  choice: qui sont retenus
  rationale: Le participe parfait passif souligne leur état présent de contrainte résultant d’une action antérieure; « retenus » s’accorde naturellement avec l’ordre de les libérer.
- source_word: ἐπὶ τῷ ποταμῷ
  choice: près du … fleuve
  rationale: ἐπί avec le datif a ici une valeur locative; « près de » indique leur emplacement par rapport au fleuve sans suggérer qu’ils se trouvent littéralement dessus.
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: du grand fleuve, l’Euphrate
  rationale: Conserve l’épithète « grand » et l’apposition du nom propre dans un français naturel.
theological_decisions:
- issue: Identité et statut moral des quatre anges
  choice: les quatre anges
  alternative: les quatre anges déchus; les quatre anges chargés du jugement
  rationale: Le verset dit seulement qu’ils sont des anges retenus près de l’Euphrate. Aucun qualificatif interprétatif n’est ajouté, afin de préserver l’indétermination du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe participiale du début est maintenue pour préserver le lien avec le verset précédent. Le marqueur de note [a] figure dans le texte après la proposition concernée.
