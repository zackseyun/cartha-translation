  to: 'disant au sixième ange, celui qui tenait la trompette : « Libère les quatre anges qui sont liés auprès du grand fleuve Euphrate[a]. »'
  rationale: La révision remplace « retenus » par « liés » afin de rendre plus directement δεδεμένους et son lien sémantique avec Λῦσον. Elle ajuste aussi l’expression de lieu et la ponctuation du nom du fleuve pour un français plus naturel, sans trancher la localisation exacte ni le statut moral des anges. Le marqueur de note est déplacé immédiatement après l’expression qu’il éclaire.
