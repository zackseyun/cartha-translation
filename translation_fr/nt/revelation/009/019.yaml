review_pass:
  verdict: approve
  source_fidelity: Le texte rend fidèlement les deux propositions explicatives de γάρ, ἐξουσία comme capacité effective (« puissance »), les bouches et les queues des chevaux, puis l’image de queues semblables à des serpents et pourvues de têtes. « C’est par elles qu’elles font du mal » exprime de façon explicite la valeur instrumentale de ἐν αὐταῖς et conserve les queues comme référent féminin pluriel et sujet naturel de ἀδικοῦσιν.
  naturalness: Le français est moderne, clair et d’un registre convenant à une vision apocalyptique. Le singulier distributif « leur bouche » / « leur queue » est idiomatique après « les chevaux », tandis que le pluriel est repris dans la phrase descriptive. La répétition des pronoms dans la dernière proposition est légèrement marquée, mais elle maintient utilement l’étrangeté et la structure de l’image sans calque inintelligible.
  terminology: « Puissance », « bouche », « queue », « serpents », « têtes » et « faire du mal » sont des équivalents justes et accessibles. Aucun terme théologique n’est surinterprété; l’imagerie demeure descriptive.
