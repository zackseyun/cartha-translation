id: REV.9.19
reference: Revelation 9:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: fr
  text: 'Car la puissance des chevaux réside dans leur bouche et dans leur queue. En effet, leurs queues ressemblent à des serpents : elles ont des têtes, et c’est par elles qu’elles font du mal.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: puissance
  rationale: Dans cette vision apocalyptique, le terme désigne surtout la capacité effective des chevaux à nuire, plutôt qu’une autorité juridique ou déléguée.
- source_word: στόματι
  choice: bouche
  rationale: Le grec emploie le singulier dans une construction distributive avec un possesseur pluriel; le français accepte naturellement « leur bouche », chaque cheval ayant la sienne.
- source_word: οὐραῖς / οὐραὶ
  choice: queue / queues
  rationale: « Queue » est le sens courant du terme; le singulier distributif dans la première proposition puis le pluriel dans la description rendent naturellement la syntaxe grecque.
- source_word: ὅμοιαι ὄφεσιν
  choice: ressemblent à des serpents
  rationale: « Serpents » conserve le caractère solennel et visionnaire de l’image tout en restant immédiatement compréhensible.
- source_word: ἔχουσαι κεφαλάς
  choice: elles ont des têtes
  rationale: Une proposition verbale est plus naturelle en français que le calque participial « ayant des têtes », tout en conservant la vive succession descriptive.
- source_word: ἐν αὐταῖς
  choice: c’est par elles
  rationale: Le tour rend la valeur instrumentale probable de ἐν et rattache explicitement le moyen de nuire aux queues, sans imposer une explication allégorique.
- source_word: ἀδικοῦσιν
  choice: elles font du mal
  rationale: Dans ce contexte, le verbe exprime le fait de causer un dommage plutôt qu’une injustice abstraite; cette formulation est claire et idiomatique.
- source_word: γὰρ
  choice: car / en effet
  rationale: Les deux occurrences introduisent une explication. La variation française évite une répétition pesante sans modifier leur fonction discursive.
theological_decisions:
- issue: Nature des queues et des têtes dans l’imagerie apocalyptique
  choice: Décrire directement la vision sans en proposer d’interprétation symbolique.
  alternative: Identifier les queues à un enseignement mensonger, à une puissance démoniaque ou à une autre réalité théologique.
  rationale: Le grec présente une image visionnaire sans en donner ici la clé; la traduction doit préserver cette image et son étrangeté.
- issue: Référent grammatical de αὐταῖς et sujet implicite de ἀδικοῦσιν
  choice: Rattacher « par elles » aux queues et maintenir celles-ci comme sujet de « font du mal ».
  alternative: Comprendre les têtes comme l’instrument immédiat de la nuisance, ou faire des chevaux le sujet implicite.
  rationale: Le féminin pluriel αὐταῖς reprend naturellement οὐραὶ; la structure grecque permet de conserver les queues comme sujet grammatical sans préciser davantage le mécanisme de la vision.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde l’étrangeté de la vision tout en évitant les calques peu naturels. Aucun marqueur de note n’est requis, puisqu’aucune note n’est ajoutée.
