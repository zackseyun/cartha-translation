id: REV.9.6
reference: Revelation 9:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: fr
  text: Et en ces jours-là, les êtres humains chercheront la mort et ne la trouveront certainement pas ; ils désireront mourir, et la mort les fuit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: en ces jours-là
  rationale: Expression temporelle française naturelle qui conserve la valeur déictique de ἐκείναις.
- source_word: οἱ ἄνθρωποι
  choice: les êtres humains
  rationale: Dans ce contexte, ἄνθρωποι désigne génériquement l’humanité, et non les seuls individus masculins. Cette formulation moderne rend explicitement cette portée universelle.
- source_word: ζητήσουσιν
  choice: chercheront
  rationale: Rend directement l’action volontaire exprimée par ζητέω tout en convenant au registre solennel du passage.
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: ils ne la trouveront absolument pas
  rationale: La tournure οὐ μή suivie du futur marque une négation fortement emphatique ; « absolument pas » en restitue clairement la force.
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: ils désireront mourir
  rationale: ἐπιθυμέω exprime un désir intense. « Désireront mourir » reste naturel et digne, sans ajouter une nuance étrangère au texte.
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: la mort les fuira
  rationale: Cette formulation conserve la personnification explicite de la mort et rend idiomatiquement ἀπ’ αὐτῶν par le pronom objet « les ».
theological_decisions:
- issue: Personnification de la mort dans le jugement apocalyptique
  choice: 'Conserver directement l’image : « la mort les fuira »'
  alternative: 'Expliciter : « ils ne pourront pas mourir »'
  rationale: Le grec fait de « la mort » le sujet de φεύγει. Maintenir cette personnification respecte l’imagerie apocalyptique et évite de réduire la tension du texte à une simple explication.
- issue: Portée générique de οἱ ἄνθρωποι
  choice: les êtres humains
  alternative: les hommes
  rationale: Bien que le nom grec soit morphologiquement masculin pluriel, il a ici une portée générique. « Les êtres humains » communique cette portée sans suggérer à tort que seuls les hommes sont concernés.
translation_notes:
  register: Français international moderne, solennel et accessible. La coordination et le parallélisme du grec sont conservés, avec un point-virgule pour assurer une lecture fluide. Aucun archaïsme ni explicitation doctrinale n’est ajouté.
