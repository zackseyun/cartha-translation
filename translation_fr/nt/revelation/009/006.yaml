  source_fidelity: Le sens général est fidèlement rendu, y compris la portée générique de οἱ ἄνθρωποι et la personnification de la mort. Toutefois, φεύγει est un présent, employé avec vivacité dans une séquence de futurs ; « fuira » l’aplanit en futur. Les deux « mais » introduisent aussi une opposition qui n’est pas marquée par les καί grecs, même si le contraste est contextuellement intelligible.
  naturalness: Le français est clair, solennel et naturel. « La mort les fuira » est grammaticalement recevable, mais « la mort les fuit » restitue plus nettement l’image active et le présent saisissant du grec. « Certainement pas » est une expression moderne et idiomatique pour l’emphase de οὐ μή.
  terminology: « Les êtres humains » rend correctement le sens générique de οἱ ἄνθρωποι dans un français international actuel. « La mort » conserve à juste titre la personnification, sans explicitation doctrinale.
