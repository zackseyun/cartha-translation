id: REV.9.17
reference: Revelation 9:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: fr
  text: 'Et voici comment, dans la vision, je vis les chevaux et ceux qui étaient assis dessus : ils avaient des cuirasses couleur de feu, d’hyacinthe et de soufre[a]. Les têtes des chevaux étaient comme des têtes de lions, et de leur bouche sortent du feu, de la fumée et du soufre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « des cuirasses ardentes, couleur d’hyacinthe et sulfureuses ». Les trois termes peuvent évoquer à la fois l’aspect des matières et leurs couleurs.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: voici comment
  rationale: Cette tournure française naturelle conserve la valeur de manière et la force démonstrative de l’adverbe.
- source_word: ἐν τῇ ὁράσει
  choice: dans la vision
  rationale: Dans le contexte apocalyptique, l’expression désigne l’expérience visionnaire de Jean.
- source_word: τοὺς καθημένους ἐπ’ αὐτῶν
  choice: ceux qui étaient assis dessus
  rationale: La formulation garde la structure participiale grecque sans la réduire au seul nom « cavaliers ».
- source_word: θώρακας
  choice: cuirasses
  rationale: « Cuirasses » rend concrètement l’armure protégeant le torse et convient au registre biblique moderne.
- source_word: πυρίνους καὶ ὑακινθίνους καὶ θειώδεις
  choice: couleur de feu, d’hyacinthe et de soufre
  rationale: La série décrit l’aspect des cuirasses tout en évitant de préciser arbitrairement « rouge », « bleu » et « jaune », valeurs suggérées mais non exprimées directement par le grec.
- source_word: ὡς κεφαλαὶ λεόντων
  choice: comme des têtes de lions
  rationale: Rend directement la comparaison introduite par ὡς dans un français idiomatique.
- source_word: ἐκπορεύεται
  choice: sortent
  rationale: Le présent est conservé, avec l’accord pluriel naturel en français devant les trois éléments coordonnés.
- source_word: θεῖον
  choice: soufre
  rationale: « Soufre » est le terme moderne exact, contrairement à des équivalents traditionnels devenus archaïques.
theological_decisions:
- issue: Nature des trois adjectifs décrivant les cuirasses
  choice: 'Les rendre comme des indications d’aspect ou de couleur : « couleur de feu, d’hyacinthe et de soufre »'
  alternative: « ardentes, couleur d’hyacinthe et sulfureuses » ou l’explicitation « rouge feu, bleu hyacinthe et jaune soufre »
  rationale: Le contexte est visuel, mais les termes grecs gardent aussi leurs associations matérielles. La traduction choisie préserve cette tension sans imposer des couleurs précises absentes du texte.
- issue: Passage de l’aoriste de vision au présent descriptif
  choice: « je vis » puis « sortent »
  alternative: 'Uniformiser au passé : « sortaient »'
  rationale: Le changement de temps est présent dans le grec et produit un effet de vivacité qu’il convient de conserver.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le mouvement de la vision et le présent saisissant de la dernière proposition, tout en fractionnant légèrement la longue syntaxe grecque pour la lisibilité.
