  source_fidelity: 'Le texte rend fidèlement la structure de la vision : « voici comment » exprime bien οὕτως, « dans la vision » correspond à ἐν τῇ ὁράσει, et « je vis » conserve l’aoriste. La coordination des chevaux et de ceux qui les montent est préservée. « Cuirasses » est exact pour θώρακες. La formulation « couleur de feu, d’hyacinthe et de soufre » restitue de manière cohérente la série descriptive sans imposer les nuances précises rouge, bleu et jaune. Le présent « sortent » reproduit avec justesse ἐκπορεύεται, malgré le cadre narratif au passé.'
  naturalness: Le français est clair, moderne et d’un registre approprié. « Ceux qui étaient assis dessus » est naturel dans ce contexte et garde l’image explicite des personnes sur les chevaux. La ponctuation en deux phrases améliore la lisibilité sans altérer les liens syntaxiques. « De leur bouche » est une tournure distributive française naturelle pour les bouches des chevaux.
  terminology: « Vision », « cuirasses », « lions », « feu », « fumée » et « soufre » sont exacts et adaptés au registre biblique moderne. « Soufre » est préférable à l’archaïque « soufre/brimstone » traditionnel anglais. La note, correctement ancrée après la série d’adjectifs, signale l’alternative plus formelle et l’ambiguïté entre propriétés matérielles et coloration sans trancher indûment.
