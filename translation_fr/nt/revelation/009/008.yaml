id: REV.9.8
reference: Revelation 9:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: fr
  text: Ils avaient des cheveux comme ceux des femmes[a], et leurs dents étaient comme celles des lions.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « des cheveux comme des cheveux de femmes ».'
    reason: Variante lexicale plus formelle reflétant la répétition de τρίχας dans le grec.
lexical_decisions:
- source_word: εἶχον
  choice: ils avaient
  rationale: L’imparfait de ἔχω décrit un élément de la vision ; l’imparfait français convient naturellement à cette description dans le passé.
- source_word: τρίχας
  choice: des cheveux
  rationale: Bien que le nom grec soit au pluriel, « des cheveux » est la formulation naturelle en français pour parler de la chevelure humaine.
- source_word: ὡς τρίχας γυναικῶν
  choice: comme ceux des femmes
  rationale: ὡς introduit une comparaison. Le pronom « ceux » reprend clairement « cheveux » et évite la répétition peu naturelle, tout en conservant la comparaison avec les cheveux des femmes.
- source_word: οἱ ὀδόντες αὐτῶν
  choice: leurs dents
  rationale: Cette construction possessive rend naturellement en français l’article, le nom et le pronom possessif grecs.
- source_word: ὡς λεόντων
  choice: comme celles des lions
  rationale: Le grec sous-entend que leurs dents sont comparées à celles des lions. « Celles » explicite ce rapport sans ajouter d’interprétation.
- source_word: ἦσαν
  choice: étaient
  rationale: L’imparfait de εἰμί appelle ici l’imparfait français dans cette description visionnaire.
theological_decisions:
- issue: Nature des images dans la description apocalyptique
  choice: Conserver directement les comparaisons avec les cheveux des femmes et les dents des lions, sans en expliquer le symbolisme.
  alternative: Employer une formulation interprétative explicitant le sens symbolique supposé de ces traits.
  rationale: Le grec présente des comparaisons visionnaires sans les interpréter. La traduction préserve donc les images ainsi que leur portée ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. Les pronoms « ceux » et « celles » évitent des répétitions lourdes tout en maintenant précisément les deux comparaisons du texte grec.
