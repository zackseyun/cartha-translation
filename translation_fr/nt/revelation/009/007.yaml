id: REV.9.7
reference: Revelation 9:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: fr
  text: Les sauterelles avaient l’apparence de chevaux préparés pour le combat, et sur leur tête se trouvaient comme des couronnes semblables à de l’or[a] ; leur visage était comme un visage humain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner des couronnes ou des couronnes de victoire. Le texte dit qu’elles étaient semblables à de l’or, sans préciser qu’elles étaient réellement faites d’or.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des visages d’êtres humains » ; l’expression grecque est générique et ne désigne pas uniquement des hommes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὁμοιώματα τῶν ἀκρίδων
  choice: Les sauterelles avaient l’apparence
  rationale: ὁμοίωμα désigne ici l’aspect ou l’apparence dans une description visionnaire. Cette formulation française naturelle conserve l’idée d’une ressemblance sans affirmer une identité littérale.
- source_word: ἀκρίδων
  choice: sauterelles
  rationale: Équivalent français courant de ἀκρίς dans ce contexte apocalyptique.
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: de chevaux préparés pour le combat
  rationale: La tournure complète « avaient l’apparence de chevaux préparés pour le combat » rend la comparaison et l’état de préparation exprimé par le participe parfait passif.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: sur leur tête
  rationale: Rend directement la relation spatiale ; le singulier collectif est naturel en français puisque chaque sauterelle possède une tête.
- source_word: ὡς στέφανοι
  choice: comme des couronnes
  rationale: ὡς marque une comparaison. « Comme des couronnes » préserve le caractère phénoménologique de la vision.
- source_word: ὅμοιοι χρυσῷ
  choice: semblables à de l’or
  rationale: La construction exprime la ressemblance avec l’or, non nécessairement la composition matérielle ; « en or » serait trop affirmatif.
- source_word: τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων
  choice: leur visage était comme un visage humain
  rationale: Cette formulation française idiomatique conserve la comparaison et rend ἀνθρώπων de manière générique, sans le restreindre aux hommes de sexe masculin.
theological_decisions:
- issue: Langage comparatif de la vision apocalyptique
  choice: 'Maintenir explicitement les comparaisons successives : « l’apparence de », « comme », « semblables à », « comme »'
  alternative: Présenter les éléments comme de véritables couronnes en or et des visages humains
  rationale: Les termes ὁμοιώματα, ὅμοια et ὡς décrivent des ressemblances perçues. La traduction ne doit pas transformer ces images visionnaires en affirmations sur leur nature littérale.
translation_notes:
  register: Français international moderne, clair et digne. Le singulier collectif (« leur tête », « leur visage ») évite une accumulation lourde tout en décrivant chaque membre du groupe. Le point-virgule articule naturellement la longue série descriptive.
