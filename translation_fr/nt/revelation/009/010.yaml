  - severity: low
    issue: Verbe interprétatif « réside »
    rationale: Le texte grec exprime littéralement que leur pouvoir est dans leurs queues. « Se trouve » restitue plus directement cette localisation sans ajouter la nuance figurée de « résider ».
  revised_text: Elles ont des queues semblables à celles des scorpions et des dards, et c’est dans leurs queues que se trouve leur pouvoir de faire du mal aux êtres humains pendant cinq mois.
