id: REV.9.10
reference: Revelation 9:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: fr
  text: Elles ont des queues semblables à celles des scorpions et des dards, et c’est dans leurs queues que se trouve leur pouvoir de faire du mal aux êtres humains pendant cinq mois.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς ὁμοίας σκορπίοις
  choice: des queues semblables à celles des scorpions
  rationale: Le datif après ὁμοίας exprime la ressemblance. « À celles des scorpions » rend explicite en français que ce sont les queues qui sont comparées, sans modifier l’image.
- source_word: κέντρα
  choice: des dards
  rationale: Dans l’image du scorpion, κέντρα désigne naturellement les organes pointus qui piquent; « dards » est concret, courant et adapté au contexte.
- source_word: ἐξουσία
  choice: pouvoir
  rationale: Ici, le terme désigne la capacité effective de nuire. « Pouvoir » conserve aussi la possibilité d’un pouvoir accordé ou permis, sans imposer le sens plus juridique d’« autorité ».
- source_word: ἀδικῆσαι
  choice: de faire du mal
  rationale: Dans ce contexte de fléau et de tourment, le verbe exprime l’action de causer du tort ou des souffrances plutôt qu’une injustice abstraite.
- source_word: τοὺς ἀνθρώπους
  choice: aux êtres humains
  rationale: Le pluriel grec est générique et vise l’humanité sans distinction de sexe. « Êtres humains » est précis et naturel en français moderne.
- source_word: μῆνας πέντε
  choice: pendant cinq mois
  rationale: L’accusatif exprime une durée; « pendant » la rend clairement en français.
theological_decisions:
- issue: Sens de ἐξουσία dans l’image apocalyptique
  choice: pouvoir
  alternative: autorité
  rationale: Le passage met au premier plan leur capacité de nuire au moyen de leurs queues. « Pouvoir » n’exclut pas que cette capacité soit limitée ou permise dans le cadre de la vision.
- issue: Référent générique de τοὺς ἀνθρώπους
  choice: êtres humains
  alternative: hommes
  rationale: Le nom grec désigne ici les humains en général. Le rendre par « êtres humains » évite que le français contemporain ne le comprenne comme visant seulement les personnes de sexe masculin.
- issue: Relation entre les queues et les dards
  choice: avec des dards
  alternative: et des dards
  rationale: Le grec coordonne les deux éléments, mais la ponctuation ne détermine pas entièrement leur relation. « Avec des dards » restitue naturellement l’image de queues de scorpions munies de dards sans développer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La tournure présentative « c’est dans leurs queues que réside » reproduit l’accent grec placé sur l’emplacement de leur pouvoir, tout en restant naturelle.
