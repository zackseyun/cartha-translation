id: REV.9.12
reference: Revelation 9:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: fr
  text: 'Le premier malheur est passé[a]. Voici : deux malheurs viennent encore après cela.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « le malheur, l’un » ; dans le contexte, il s’agit du premier d’une série.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: malheur
  rationale: « Malheur » conserve la formule solennelle de jugement et de calamité propre au registre prophétique et apocalyptique, sans la réduire au simple nom d’un événement.
- source_word: ἡ μία
  choice: le premier
  rationale: Bien que l’expression signifie littéralement « l’unique » ou « l’un », elle a ici une valeur ordinale dans la série des trois malheurs annoncés; « le premier » est naturel et précis en français.
- source_word: ἀπῆλθεν
  choice: est passé
  rationale: Le verbe présente ce premier malheur comme achevé. « Est passé » exprime idiomatiquement sa fin, sans imposer le sens spatial de « s’en est allé ».
- source_word: ἰδού
  choice: voici
  rationale: « Voici » attire solennellement l’attention sur l’annonce qui suit et convient au registre visionnaire de l’Apocalypse.
- source_word: ἔρχεται
  choice: viennent
  rationale: Le singulier grec employé avec le sujet neutre pluriel est rendu par un pluriel conforme à la grammaire française; le présent garde le caractère imminent et vivant de l’annonce.
- source_word: ἔτι
  choice: encore
  rationale: « Encore » indique que deux malheurs restent à venir après le premier.
- source_word: μετὰ ταῦτα
  choice: après cela
  rationale: « Après cela » rend naturellement en français la succession temporelle exprimée par le grec, tout en évitant le tour moins idiomatique « après ces choses ».
theological_decisions:
- issue: Enchaînement apocalyptique des trois malheurs
  choice: Le verset marque l’achèvement du premier malheur annoncé et la venue prochaine de deux autres.
  alternative: Paraphraser les « malheurs » comme de simples « catastrophes » ou « jugements ».
  rationale: La répétition de « malheur » et la formulation ordinale maintiennent la structure littéraire et théologique de la vision, sans préciser au-delà du texte la nature des jugements.
translation_notes:
  register: Français international moderne, clair et digne. « Voici » maintient la solennité apocalyptique; « malheur » préserve la formule de jugement. La tournure « deux autres malheurs viennent encore » explicite naturellement en français la continuité de la série sans ajouter de contenu interprétatif.
