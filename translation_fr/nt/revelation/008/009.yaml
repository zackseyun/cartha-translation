source:
  edition: SBLGNT
  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: fr
  text: Un tiers des créatures de la mer — celles qui avaient la vie — mourut[a], et un tiers des navires furent détruits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « celles qui avaient une âme » ou « les êtres vivants ». Littéralement, en grec : « celles qui avaient des âmes/des vies ».'
    reason: Alternative lexicale pour ψυχάς, qui peut désigner les âmes, les vies ou les êtres vivants selon le contexte.
lexical_decisions:
- source_word: ἀπέθανε
  choice: mourut
  rationale: L’aoriste de ἀποθνῄσκω exprime directement la mort. Le singulier « mourut » correspond à l’accord grec avec τὸ τρίτον et convient en français avec « un tiers ».
- source_word: τὸ τρίτον
  choice: un tiers
  rationale: « Un tiers » est l’expression quantitative naturelle en français moderne.
- source_word: κτισμάτων
  choice: créatures
  rationale: κτίσμα peut désigner une créature ou une chose créée. La précision τὰ ἔχοντα ψυχάς montre qu’il s’agit ici d’êtres marins animés.
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: qui se trouvaient dans la mer
  rationale: Cette formulation explicite naturellement en français la localisation indiquée par le grec.
- source_word: τὰ ἔχοντα ψυχάς
  choice: celles qui avaient la vie
  rationale: L’apposition grecque distingue les créatures animées. « Avaient la vie » rend ici le sens contextuel de ψυχή sans imposer une affirmation technique sur l’âme des animaux; la note conserve les possibilités lexicales plus littérales.
- source_word: ψυχάς
  choice: la vie
  rationale: Dans ce contexte, ψυχή désigne la vie animée ou l’être vivant. Le singulier collectif est idiomatique en français, tandis que la note signale le pluriel et l’amplitude du grec.
- source_word: πλοίων
  choice: navires
  rationale: πλοῖον désigne un bateau ou un navire. « Navires » convient naturellement à cette scène maritime.
- source_word: διεφθάρησαν
  choice: furent détruits
  rationale: Le passif de διαφθείρω évoque ici la destruction matérielle, et non la corruption morale. L’accord au pluriel reflète celui du texte grec avec les navires envisagés collectivement.
theological_decisions:
- issue: Sens de ψυχάς à propos des créatures marines
  choice: « celles qui avaient la vie » dans le texte, avec une note indiquant « des âmes/des vies »
  alternative: « celles qui avaient des âmes vivantes » ou « les êtres vivants »
  rationale: Le passage caractérise des êtres animés sans nécessairement formuler une doctrine sur l’âme animale. La traduction principale reste naturelle en français, tandis que la note préserve la portée lexicale et l’ambiguïté de ψυχή.
translation_notes:
  register: 'Français international moderne, sobre et digne. L’incise entre tirets reproduit la valeur appositive de τὰ ἔχοντα ψυχάς. Les accords suivent les constructions du grec : singulier avec le premier « un tiers », pluriel pour les navires dans la seconde proposition.'
