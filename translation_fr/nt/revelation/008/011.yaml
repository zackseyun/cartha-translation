source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: fr
  text: Le nom de l’étoile est « Absinthe »[a]. Le tiers des eaux se changea en absinthe, et beaucoup de gens moururent à cause des eaux[b], parce qu’elles avaient été rendues amères.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici le nom de la plante très amère appelée « absinthe », puis répète le même mot à propos des eaux. Il ne s’agit pas nécessairement de la boisson alcoolisée moderne.
    reason: lexical_alternative
  - marker: b
    text: La préposition grecque indique ici que les eaux furent la cause de leur mort. Le texte ne dit pas explicitement qu’ils en avaient bu.
    reason: translation_clarification
lexical_decisions:
- source_word: ὄνομα τοῦ ἀστέρος λέγεται
  choice: L’étoile porte le nom de
  rationale: Cette tournure rend naturellement en français l’expression grecque désignant le nom sous lequel l’étoile est appelée, sans conserver la lourdeur littérale « le nom de l’étoile est appelé ».
- source_word: Ἄψινθος / ἄψινθον
  choice: Absinthe / absinthe
  rationale: En français, « absinthe » désigne d’abord la plante très amère correspondant au grec ἄψινθος. La majuscule signale le nom propre de l’étoile, tandis que la minuscule dans la seconde occurrence maintient le lien lexical voulu par la répétition grecque.
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: le tiers des eaux
  rationale: Rendu français idiomatique et précis de l’expression partitive grecque.
- source_word: ἐγένετο … εἰς ἄψινθον
  choice: devint de l’absinthe
  rationale: Le verbe et la préposition expriment ici un résultat ou une transformation. Le rendu conserve l’image concrète ainsi que la répétition du nom de la plante.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: beaucoup de gens
  rationale: Expression naturelle et inclusive en français moderne pour désigner de nombreux êtres humains, sans suggérer uniquement des hommes de sexe masculin.
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: moururent à cause de ces eaux
  rationale: ἐκ indique ici la source ou la cause. « À cause de ces eaux » rend clairement ce rapport sans ajouter l’idée de les boire, qui reste implicite dans le texte grec.
- source_word: ὅτι ἐπικράνθησαν
  choice: parce qu’elles avaient été rendues amères
  rationale: Le pronom féminin pluriel renvoie naturellement aux eaux en français. Le plus-que-parfait passif exprime l’état résultant antérieur aux morts et respecte la voix passive grecque.
theological_decisions:
- issue: Référent du verbe passif ἐπικράνθησαν
  choice: 'Le verbe renvoie aux eaux : « parce qu’elles avaient été rendues amères »'
  alternative: Comprendre que les êtres humains furent aigris ou rendus malades
  rationale: Le groupe « les eaux » est l’antécédent pluriel le plus proche, et le contexte présente leur amertume comme la cause des morts. Le français explicite le référent exigé par sa syntaxe, sans ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit visionnaire écrit, tandis que la formulation demeure accessible. La répétition « Absinthe / absinthe » conserve le jeu lexical central du grec.
