  source_fidelity: 'Le sens général est bien rendu : le nom de l’étoile, la proportion des eaux, la mort causée par les eaux et leur amertume sont conservés. Toutefois, « devint de l’absinthe » emploie un partitif qui affaiblit légèrement la transformation exprimée par εἰς ἄψινθον. La note b présente en outre comme littérale une formulation française qui ne l’est pas.'
  naturalness: Le français est globalement naturel et de registre approprié. « Se changea en absinthe » exprime plus nettement et plus idiomatiquement la transformation. La note b doit éviter le calque maladroit « moururent provenant des eaux ».
  terminology: « Absinthe / absinthe » est le bon choix français et préserve la répétition lexicale grecque ainsi que le nom propre de l’étoile. « Beaucoup de gens » convient à πολλοὶ τῶν ἀνθρώπων. La formulation « rendues amères » conserve de façon recevable le passif grec et son référent, les eaux.
