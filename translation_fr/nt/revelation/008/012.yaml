  rationale: 'La révision conserve la répétition quantitative du grec, rend explicitement le partitif de αὐτῶν et restitue la construction ἵνα avec le subjonctif français. Elle maintient l’ellipse finale : la même réduction de lumière s’applique à la nuit. Aucune note n’est nécessaire, puisque la formulation principale rend directement la nuance syntaxique sans trancher la portée littérale ou symbolique de l’imagerie.'
