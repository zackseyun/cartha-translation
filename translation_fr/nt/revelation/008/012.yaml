review_pass:
  verdict: revise
  source_fidelity: La première proposition est globalement fidèle, mais « leur tiers fut obscurci » rend le génitif partitif grec de façon maladroite et moins précise. Surtout, « le jour perdit sa lumière » transforme la proposition dépendante de ἵνα en constat indicatif et ne conserve pas aussi bien sa relation de but/résultat avec les frappes. Une formulation au subjonctif après « afin que » restitue directement la syntaxe grecque sans imposer une interprétation théologique.
  naturalness: « Sonna de la trompette » et « la nuit de même » sont naturels dans un registre biblique moderne. En revanche, « leur tiers » est peu idiomatique ici. « Un tiers d’entre eux » est plus clair, et la reprise coordonnée « que le jour ne brille pas… et la nuit de même » conserve naturellement l’ellipse du grec.
  terminology: Les termes « ange », « trompette », « frappés », « obscurci », « soleil », « lune » et « étoiles » conviennent. « Brille » rend bien φαίνῃ dans ce contexte de lumière cosmique, sans surinterpréter l’image.
  issues:
  - severity: medium
    issue: « leur tiers fut obscurci »
    rationale: Le grec τὸ τρίτον αὐτῶν est un partitif (« un tiers d’entre eux » / « un tiers de ces éléments »), non un possessif français naturel. La formulation actuelle est ambiguë et stylistiquement lourde.
  - severity: medium
    issue: « le jour perdit sa lumière »
    rationale: Cette reformulation à l’indicatif atténue la dépendance syntaxique de ἵνα et la coordination avec σκοτισθῇ. Le subjonctif français après « afin que » préserve plus directement la nuance de but, tout en restant compatible avec une lecture résultative dans ce contexte.
  - severity: low
    issue: Note actuelle
    rationale: 'La note propose une alternative moins fidèle au texte révisé : elle présente « afin que » comme une simple possibilité alors que cette construction est retenue dans le corps du texte. Elle devient inutile si la nuance est rendue directement.'
  revised_text: Le quatrième ange sonna de la trompette ; un tiers du soleil, un tiers de la lune et un tiers des étoiles furent frappés, afin qu’un tiers d’entre eux soit obscurci, que le jour ne brille pas pendant un tiers de sa durée, et la nuit de même.
  revised_footnotes: []
