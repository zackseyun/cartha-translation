id: REV.8.12
reference: Revelation 8:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: fr
  text: Le quatrième ange sonna de la trompette ; un tiers du soleil, un tiers de la lune et un tiers des étoiles furent frappés, afin qu’un tiers d’entre eux soit obscurci, que le jour ne brille pas pendant un tiers de sa durée, et la nuit de même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: sonna de la trompette
  rationale: Le verbe désigne l’action de faire retentir une trompette. Cette tournure est naturelle en français et explicite clairement l’instrument sous-entendu.
- source_word: ἐπλήγη
  choice: furent frappés
  rationale: Le passif conserve l’image d’un jugement subi. Le pluriel français accorde le verbe avec les trois éléments célestes coordonnés.
- source_word: τὸ τρίτον
  choice: le tiers
  rationale: « Le tiers » rend naturellement en français la fraction répétée dans le grec et maintient l’insistance quantitative du passage.
- source_word: ἵνα σκοτισθῇ
  choice: si bien que … fut obscurci
  rationale: Cette formulation exprime naturellement la conséquence tout en laissant ouverte la nuance de finalité que peut porter ἵνα.
- source_word: τὸ τρίτον αὐτῶν
  choice: leur tiers
  rationale: Le possessif pluriel renvoie collectivement au soleil, à la lune et aux étoiles, comme le pronom grec αὐτῶν.
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: le jour perdit sa lumière
  rationale: Dans ce contexte d’obscurcissement cosmique, φαίνω évoque la lumière qui brille. Cette expression est idiomatique et évite l’étrangeté de faire du jour lui-même le sujet de « briller » en français.
- source_word: τὸ τρίτον αὐτῆς
  choice: pendant un tiers de sa durée
  rationale: La formulation indique clairement que la limitation porte sur une fraction de la durée du jour, sans suggérer qu’un tiers spatial du jour serait visible.
- source_word: ἡ νὺξ ὁμοίως
  choice: et la nuit de même
  rationale: Cette traduction concise conserve le parallélisme et laisse l’ellipse du grec s’appliquer à la nuit.
theological_decisions:
- issue: Nature de l’obscurcissement cosmique
  choice: Présenter directement l’atteinte portée aux astres et à la lumière du jour et de la nuit, sans en déterminer le caractère littéral ou symbolique.
  alternative: Interpréter explicitement la scène comme un phénomène astronomique strictement littéral ou comme une image purement symbolique.
  rationale: Le verset décrit le jugement au moyen d’images cosmiques mais ne tranche pas lui-même la manière dont elles doivent être rapportées à leur accomplissement.
- issue: Valeur de ἵνα
  choice: Employer dans le texte « si bien que », qui met en avant le résultat, et signaler en note la nuance possible de but.
  alternative: Traduire directement « afin que » dans le corps du texte.
  rationale: ἵνα peut exprimer le but ou le résultat dans ce contexte. Le texte français doit rester naturel sans effacer cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « le tiers » reproduit l’insistance du grec. « Perdit sa lumière » privilégie une formulation française naturelle, tandis que la note conserve la nuance de but et une traduction plus formelle de la proposition grecque.
