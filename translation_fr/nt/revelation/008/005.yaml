id: REV.8.5
reference: Revelation 8:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: fr
  text: Alors l’ange prit l’encensoir, le remplit de feu pris sur l’autel et le jeta sur la terre. Il y eut des coups de tonnerre, des voix[a], des éclairs et un tremblement de terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des bruits ». Le mot grec peut désigner des voix articulées ou des sons dans une manifestation divine.
    reason: Alternative lexicale destinée à préserver l’ambiguïté de φωναί.
lexical_decisions:
- source_word: εἴληφεν
  choice: prit
  rationale: Le parfait grec s’insère ici dans une suite narrative; le passé simple rend naturellement en français l’action successive et ponctuelle.
- source_word: λιβανωτόν
  choice: l’encensoir
  rationale: Dans ce contexte cultuel, le terme désigne le récipient servant à l’encens et pouvant recevoir des braises; « encensoir » est le terme français précis et usuel.
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: le remplit de feu pris sur l’autel
  rationale: Cette formulation française explicite sobrement que le feu provient de l’autel, sans ajouter de matière absente du texte.
- source_word: θυσιαστηρίου
  choice: l’autel
  rationale: Équivalent normal dans l’imagerie cultuelle et céleste de l’Apocalypse.
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: le jeta sur la terre
  rationale: « Jeta » conserve la force de βάλλω, tandis que « sur la terre » rend la portée cosmique probable de γῆ dans cette scène de jugement.
- source_word: ἐγένοντο
  choice: il y eut
  rationale: Tour idiomatique français qui marque la survenue des phénomènes dans la narration.
- source_word: βρονταὶ
  choice: des coups de tonnerre
  rationale: Le pluriel grec suggère des manifestations répétées; « coups de tonnerre » est naturel et précis.
- source_word: φωναὶ
  choice: des voix
  rationale: « Voix » est le sens direct de φωναί et maintient la possibilité d’énoncés célestes, sans préciser qui parle; le sens plus général « bruits » reste possible et est signalé en note.
- source_word: ἀστραπαὶ
  choice: des éclairs
  rationale: Équivalent français courant qui conserve le pluriel.
- source_word: σεισμός
  choice: un tremblement de terre
  rationale: Formulation idiomatique moderne pour le phénomène singulier désigné par le grec.
theological_decisions:
- issue: Sens de γῆ dans un contexte apocalyptique de jugement
  choice: la terre
  alternative: le sol; le pays
  rationale: « La terre » correspond le mieux à la portée cosmique de la scène et à l’usage fréquent du terme dans l’Apocalypse, sans la restreindre à un lieu particulier.
- issue: Sens de φωναί dans la formule théophanique
  choice: des voix
  alternative: des bruits; des sons
  rationale: Le grec peut désigner des voix articulées ou, plus largement, des manifestations sonores. Le texte n’identifie aucun locuteur; la note préserve donc l’ambiguïté lexicale sans imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif biblique sans être archaïque. Les répétitions coordonnées du grec sont légèrement fluidifiées, tout en conservant la succession dramatique des actions et des phénomènes.
