id: REV.8.4
reference: Revelation 8:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: fr
  text: Et la fumée de l’encens monta, avec les prières des saints, de la main de l’ange, devant Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec associe la fumée de l’encens aux prières des saints sans dire explicitement, dans ce verset, que l’une représente les autres.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: monta
  rationale: L’aoriste de ἀναβαίνω décrit un mouvement ascendant. « Monta » est naturel et concis en français, tout en conservant l’image concrète.
- source_word: καπνὸς
  choice: fumée
  rationale: Le sens ordinaire est « fumée »; rien dans l’image apocalyptique n’exige ici une formulation plus interprétative.
- source_word: θυμιαμάτων
  choice: de l’encens
  rationale: θυμίαμα désigne couramment l’encens. Le singulier collectif français rend naturellement le pluriel grec dans ce contexte cultuel.
- source_word: ταῖς προσευχαῖς
  choice: avec les prières
  rationale: Le datif associe la fumée aux prières sans préciser davantage la nature de leur rapport. « Avec » préserve cette indétermination.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: ἅγιοι désigne ici les membres du peuple consacré à Dieu. « Saints » conserve le terme biblique traditionnel sans le limiter à une catégorie canonisée ultérieure.
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: de la main de l’ange
  rationale: Cette formulation assez formelle conserve l’image grecque de la fumée s’élevant à partir de la main de l’ange.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: jusque devant Dieu
  rationale: ἐνώπιον signifie « devant » ou « en présence de ». L’ajout idiomatique de « jusque » rattache clairement le complément au mouvement ascendant sans modifier sa destination.
theological_decisions:
- issue: Rapport entre l’encens et les prières
  choice: « la fumée de l’encens monta, avec les prières des saints »
  alternative: « la fumée de l’encens, c’est-à-dire les prières des saints, monta »; « la fumée monta en faveur des prières des saints »
  rationale: La construction grecque associe la fumée et les prières, mais ne les identifie pas explicitement dans ce verset. La traduction maintient cette tension sans imposer une interprétation symbolique précise.
- issue: Référent de « saints »
  choice: « saints » au sens large du peuple consacré à Dieu
  alternative: « membres du peuple saint »; « fidèles »
  rationale: Le contexte emploie ἅγιοι comme désignation du peuple de Dieu. Le terme biblique « saints » préserve cette portée sans introduire une définition confessionnelle ultérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’imagerie cultuelle et le mouvement de la phrase grecque, tout en employant une ponctuation qui clarifie l’association entre la fumée et les prières.
