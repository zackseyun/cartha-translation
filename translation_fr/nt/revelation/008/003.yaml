id: REV.8.3
reference: Revelation 8:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: fr
  text: Un autre ange vint et se tint près de l’autel. Il tenait un encensoir en or[a]. On lui donna une grande quantité d’encens afin qu’il l’offre avec les prières de tous les saints[b] sur l’autel d’or qui se trouve devant le trône.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un brûle-parfum en or ».'
    reason: Alternative lexicale pour λιβανωτός.
  - marker: b
    text: 'Littéralement : « afin qu’il le donne aux prières de tous les saints » ; dans ce contexte, l’encens est présenté avec leurs prières ou y est ajouté.'
    reason: La construction au datif est inhabituelle et permet une traduction plus littérale que le corps du texte.
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: un autre ange
  rationale: ἄλλος introduit un ange supplémentaire dans la séquence, sans suggérer une autre catégorie d’être.
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: se tint près de l’autel
  rationale: Avec ἐπί suivi du génitif, « près de l’autel » exprime naturellement la position sans laisser entendre que l’ange se tenait dessus.
- source_word: λιβανωτὸν χρυσοῦν
  choice: un encensoir en or
  rationale: λιβανωτός désigne ici un récipient servant à brûler ou à présenter l’encens ; « encensoir » est le terme français précis et χρυσοῦν indique qu’il est en or.
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: on lui donna une grande quantité d’encens
  rationale: Le passif grec est rendu par le passif impersonnel français courant « on lui donna » ; « une grande quantité d’encens » restitue naturellement le pluriel θυμιάματα et l’idée d’abondance.
- source_word: ἵνα δώσει
  choice: afin qu’il l’offre
  rationale: Dans ce cadre cultuel, δίδωμι a le sens contextuel de présenter ou d’offrir. « Afin que » marque le but, et le pronom « l’ » reprend l’encens.
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: avec les prières de tous les saints
  rationale: Le datif est difficile ; « avec » exprime que l’encens accompagne les prières, tandis qu’une note conserve la formulation plus littérale et son ambiguïté.
- source_word: ἅγιοι
  choice: saints
  rationale: Dans l’Apocalypse, le terme désigne les membres du peuple consacré à Dieu. « Saints » est bref, traditionnel et exact dans ce contexte.
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: sur l’autel d’or
  rationale: ἐπί avec l’accusatif indique ici le mouvement ou le dépôt sur l’autel ; « autel d’or » est idiomatique en français.
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: qui se trouve devant le trône
  rationale: Cette formulation rend clairement la relation spatiale exprimée par ἐνώπιον et rattache sans ambiguïté la proposition à l’autel d’or.
theological_decisions:
- issue: Rapport entre l’encens et les prières des saints
  choice: L’encens est offert avec les prières de tous les saints.
  alternative: L’encens est littéralement « donné aux prières » de tous les saints.
  rationale: Le contexte cultuel favorise l’idée que l’encens accompagne les prières, mais la note signale la construction grecque inhabituelle afin de ne pas effacer sa tension ni développer une doctrine de médiation angélique absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases sont légèrement segmentées pour la clarté, tout en conservant la progression du grec. Le vocabulaire cultuel essentiel (« autel », « encensoir », « encens », « saints », « trône ») est maintenu.
