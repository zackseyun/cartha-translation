id: REV.8.7
reference: Revelation 8:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: fr
  text: Le premier sonna de la trompette. Il y eut alors de la grêle et du feu mêlés de sang[a], et cela fut jeté sur la terre[b]. Un tiers de la terre fut consumé, un tiers des arbres fut consumé, et toute l’herbe verte fut consumée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mélangés à du sang ».
    reason: Variante lexicale possible pour μεμιγμένα ἐν αἵματι.
  - marker: b
    text: Ou « sur le pays » ou « sur le sol » ; le mot grec γῆ peut avoir ces sens, mais le contexte apocalyptique plus large favorise ici « terre ».
    reason: Ambiguïté lexicale de γῆ.
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: Le nom « ange » est sous-entendu par le contexte immédiat, mais il n’est pas exprimé dans ce verset. La formulation elliptique du grec est donc conservée.
- source_word: ἐσάλπισεν
  choice: sonna de la trompette
  rationale: Le verbe signifie faire retentir une trompette. Cette tournure est naturelle en français et explicite l’instrument déjà établi par le contexte.
- source_word: ἐγένετο
  choice: il y eut alors
  rationale: Cette expression rend la valeur événementielle du verbe et introduit naturellement le phénomène apocalyptique qui suit.
- source_word: χάλαζα καὶ πῦρ
  choice: de la grêle et du feu
  rationale: Traduction directe qui conserve les deux éléments destructeurs et leur image saisissante.
- source_word: μεμιγμένα ἐν αἵματι
  choice: mêlés de sang
  rationale: Le participe décrit la grêle et le feu comme mêlés à du sang. « Mêlés de sang » est idiomatique, actuel et respecte l’image sans l’expliquer.
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: cela fut jeté sur la terre
  rationale: Le singulier passif présente l’ensemble du phénomène comme une réalité collective. Le pronom « cela » préserve ce singulier sans imposer un antécédent particulier.
- source_word: τὸ τρίτον τῆς γῆς
  choice: un tiers de la terre
  rationale: « Un tiers » est l’équivalent français naturel de cette expression partitive. « Terre » convient au cadre cosmique du passage tout en laissant ouverte la possibilité lexicale de « pays » ou « sol ».
- source_word: κατεκάη
  choice: fut consumé
  rationale: Le verbe intensif κατακαίω évoque une destruction par le feu, plus forte que le simple fait d’être brûlé. « Fut consumé » rend cette force avec dignité et sans lourdeur malgré la triple répétition.
- source_word: τὸ τρίτον τῶν δένδρων
  choice: un tiers des arbres
  rationale: Traduction française naturelle de l’expression partitive, qui maintient le motif répété du tiers.
- source_word: πᾶς χόρτος χλωρός
  choice: toute l’herbe verte
  rationale: χόρτος désigne ici concrètement l’herbe ou la végétation herbacée, et χλωρός souligne son état vert et frais. La traduction conserve cette image précise.
theological_decisions:
- issue: Portée de γῆ dans l’imagerie du jugement apocalyptique
  choice: terre
  alternative: pays ou sol
  rationale: Le contexte des jugements des trompettes présente des effets de portée cosmique; « terre » convient donc mieux sans réduire la scène à un territoire local. Une note maintient néanmoins l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste vive et narrative; la répétition de « fut consumé » reproduit l’insistance solennelle du grec. Les marqueurs de notes ont été placés auprès des expressions auxquelles les notes se rapportent.
