id: REV.8.8
reference: Revelation 8:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: fr
  text: Le deuxième ange sonna de la trompette. Quelque chose qui ressemblait à une grande montagne en feu fut jeté dans la mer, et le tiers de la mer devint du sang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: sonna de la trompette
  rationale: Le verbe signifie faire retentir une trompette. L’ajout de l’objet implicite donne en français une formulation naturelle et claire dans cette série de visions.
- source_word: ὡς
  choice: quelque chose qui ressemblait à
  rationale: ὡς marque ici une comparaison. Cette formulation naturelle préserve la distinction entre l’apparence décrite et l’identité réelle de l’objet.
- source_word: ὄρος μέγα
  choice: une grande montagne
  rationale: Traduction directe qui conserve le ton ample et solennel de l’image apocalyptique.
- source_word: πυρὶ καιόμενον
  choice: embrasée
  rationale: Le participe avec πυρί décrit la montagne comme brûlant de feu. « Embrasée » rend cette image avec force et concision sans préciser la nature du phénomène.
- source_word: ἐβλήθη
  choice: fut jeté
  rationale: L’aoriste passif indique que l’objet subit l’action d’être jeté. Le masculin s’accorde avec « quelque chose » et évite d’identifier l’objet à la montagne de la comparaison.
- source_word: εἰς τὴν θάλασσαν
  choice: dans la mer
  rationale: En français, « jeter dans la mer » exprime naturellement le mouvement vers l’intérieur indiqué par εἰς.
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: le tiers de la mer
  rationale: Cette expression partitive reproduit clairement la proportion précise du texte et le motif des jugements limités de l’Apocalypse.
- source_word: αἷμα
  choice: du sang
  rationale: Le terme signifie directement « sang » ; aucune explicitation interprétative n’est nécessaire.
theological_decisions:
- issue: Nature de l’objet semblable à une montagne
  choice: Présenter un objet qui ressemble à une montagne sans en déterminer la nature.
  alternative: Comprendre l’image comme une montagne littérale, un objet météorique ou un symbole du jugement.
  rationale: L’emploi de ὡς indique une ressemblance. La traduction conserve donc l’indétermination de la vision sans imposer une lecture littérale ou symbolique.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases allège la longue coordination grecque sans modifier la progression de la vision. « Embrasée » conserve la force poétique du registre apocalyptique.
