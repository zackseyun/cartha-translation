revisions:
- from: Le troisième ange sonna de la trompette. Alors, une grande étoile tomba du ciel[a], brûlant comme une torche[b]. Elle tomba sur le tiers des fleuves et sur les sources des eaux.[c]
  to: Le troisième ange sonna de la trompette ; puis une grande étoile[c] tomba du ciel[a], brûlante comme une torche[b]. Elle tomba sur le tiers des fleuves et sur les sources des eaux.
  rationale: La correction est limitée à l’accord grammatical de « brûlante », à une ponctuation qui conserve la succession narrative, et au déplacement de l’ancre c vers son référent. Le texte ne tranche pas le sens symbolique éventuel de l’étoile.
