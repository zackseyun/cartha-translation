    issue: Accord grammatical de « brûlant »
    rationale: Le participe se rapporte à « une grande étoile », nom féminin ; il doit donc être « brûlante ». Le grec emploie επίσης un participe accordé avec ἀστήρ, mais le genre grammatical français exige le féminin.
  - severity: low
