id: REV.8.10
reference: Revelation 8:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: fr
  text: Le troisième ange sonna de la trompette ; puis une grande étoile[c] tomba du ciel[a], brûlante comme une torche[b]. Elle tomba sur le tiers des fleuves et sur les sources des eaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner le ciel visible ou la demeure céleste ; le français « ciel » conserve cette possibilité.
    reason: lexical_alternative
  - marker: b
    text: Ou « brûlante comme une lampe ». Le mot grec peut désigner une torche ou une lampe ; « torche » convient mieux à l’image d’un astre en flammes.
    reason: lexical_alternative
  - marker: c
    text: L’« étoile » demeure une image non interprétée. Elle peut être comprise comme un être angélique, un objet comparable à une météorite ou une puissance symbolique.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: sonna de la trompette
  rationale: Le verbe σαλπίζω signifie faire retentir une trompette. « Sonna de la trompette » est une formulation française naturelle et explicite, adaptée à la séquence des sonneries dans l’Apocalypse.
- source_word: ἀστὴρ μέγας
  choice: une grande étoile
  rationale: Cette traduction directe préserve l’image sans décider si l’adjectif indique seulement la taille ou aussi le caractère impressionnant de l’étoile.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: En français, « ciel » couvre naturellement les sens spatiaux possibles de οὐρανός et convient au registre visionnaire du passage.
- source_word: καιόμενος ὡς λαμπάς
  choice: brûlant comme une torche
  rationale: Le participe καιόμενος décrit ce qui brûle, tandis que λαμπάς désigne couramment une torche. La comparaison reste explicite et vive.
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: tomba… Elle tomba
  rationale: 'La répétition du verbe est conservée afin de reproduire le rythme et l’insistance du grec : d’abord la chute depuis le ciel, puis son point d’impact.'
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: sur le tiers des fleuves
  rationale: Dans cette série de jugements, τὸ τρίτον désigne un tiers. « Le tiers des fleuves » est précis et naturel en français.
- source_word: πηγὰς τῶν ὑδάτων
  choice: les sources des eaux
  rationale: Cette formulation conserve la construction grecque et son ton solennel tout en restant intelligible; elle désigne les lieux d’où jaillissent les eaux.
theological_decisions:
- issue: Référent de l’étoile qui tombe
  choice: L’image est rendue littéralement par « une grande étoile », sans en préciser le référent symbolique.
  alternative: Un être angélique, un objet comparable à une météorite, ou une puissance symbolique.
  rationale: Le verset nomme une étoile sans identifier explicitement ce qu’elle représente. Garder cette image évite d’imposer une interprétation et préserve l’ambiguïté de la vision.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases sont légèrement segmentées pour la clarté, tandis que la répétition de « tomba » et les images apocalyptiques du grec sont conservées.
