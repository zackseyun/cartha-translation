id: REV.8.1
reference: Revelation 8:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: fr
  text: Quand il ouvrit le septième sceau[a], il y eut[b] un silence dans le ciel pendant environ une demi-heure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « brisa le septième sceau pour l’ouvrir ». Le grec dit simplement : « ouvrit le septième sceau ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « un silence se fit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: quand
  rationale: Dans ce récit, la conjonction introduit un événement unique. « Quand » exprime naturellement le rapport temporel sans donner au passage un sens répétitif comme pourrait le faire « chaque fois que ».
- source_word: ἤνοιξεν
  choice: ouvrit
  rationale: Le verbe ἀνοίγω signifie simplement « ouvrir ». « Ouvrit » reste proche du grec, tandis que « brisa pour ouvrir » expliciterait le mécanisme du sceau.
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: le septième sceau
  rationale: « Sceau » est le terme français courant et précis dans la séquence du rouleau scellé de l’Apocalypse; l’adjectif ordinal est attributif.
- source_word: ἐγένετο
  choice: il y eut
  rationale: Cette tournure française rend naturellement la survenue d’un état. Elle conserve la valeur événementielle de γίνομαι sans la lourdeur de « il advint ».
- source_word: σιγὴ
  choice: un silence
  rationale: « Silence » préserve la force solennelle et dramatique de la scène mieux que « calme » ou « tranquillité ».
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Dans ce contexte apocalyptique, οὐρανός désigne le domaine céleste. « Dans le ciel » est la formulation française naturelle.
- source_word: ὡς ἡμιώριον
  choice: pendant environ une demi-heure
  rationale: Devant une durée, ὡς indique ici l’approximation. « Pendant » explicite idiomatiquement la durée, et « environ une demi-heure » en conserve le caractère approximatif.
theological_decisions:
- issue: Référent du sujet implicite de ἤνοιξεν
  choice: « il ouvrit », sans nommer explicitement le sujet
  alternative: « l’Agneau ouvrit »
  rationale: Le grec porte un sujet masculin singulier implicite, dont l’antécédent est l’Agneau dans le contexte précédent. Le pronom « il », nécessaire en français, maintient ce lien discursif sans introduire dans le verset une identification que le grec n’énonce pas explicitement.
translation_notes:
  register: Français international moderne, sobre et solennel. Le passé simple convient au registre narratif biblique soutenu tout en restant clair. La formulation évite d’expliciter davantage que le grec l’identité du sujet ou la manière d’ouvrir le sceau.
