id: REV.8.13
reference: Revelation 8:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: fr
  text: 'Et je vis et j’entendis un aigle[a] qui volait au milieu du ciel[b] et qui disait d’une voix forte : « Malheur, malheur, malheur aux habitants de la terre, à cause des sons de trompette qui restent, ceux des trois anges qui sont sur le point de sonner de la trompette ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « un ange » au lieu de « un aigle ».
    reason: textual_variant
  - marker: b
    text: Ou « au plus haut du ciel » ; le terme grec désigne le milieu ou la partie la plus élevée du ciel visible.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: un aigle
  rationale: Le nom désigne normalement l’aigle. Le contexte ne comporte aucun élément lié à une charogne qui favoriserait « vautour ».
- source_word: μεσουρανήματι
  choice: au milieu du ciel
  rationale: Cette expression naturelle conserve l’image de l’oiseau volant dans la partie haute du ciel; une note précise la portée du terme grec.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Formulation française idiomatique qui rend la puissance et le caractère public de la proclamation.
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: Malheur, malheur, malheur
  rationale: La triple répétition est maintenue afin de préserver l’intensité prophétique et rhétorique.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: aux habitants de la terre
  rationale: Formulation claire et digne qui rend l’expression récurrente de l’Apocalypse sans expliciter davantage son sens théologique.
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: à cause des autres sonneries de trompette
  rationale: Dans ce contexte, ἐκ exprime la cause; « sonneries de trompette » rend idiomatiquement les sons encore à venir.
- source_word: τῶν τριῶν ἀγγέλων
  choice: des trois anges
  rationale: Dans cette vision apocalyptique, « anges » est le sens contextuel naturel.
- source_word: τῶν μελλόντων σαλπίζειν
  choice: qui sont sur le point de sonner
  rationale: La tournure conserve l’idée d’imminence exprimée par μέλλω avec l’infinitif; la trompette est clairement sous-entendue par le contexte immédiat.
theological_decisions:
- issue: Identification du messager volant
  choice: un aigle
  alternative: un ange
  rationale: Le texte principal suit le SBLGNT, qui porte ἀετοῦ (« aigle »). La variante « ange », attestée dans certains manuscrits, est signalée sans être introduite dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe répétitive de l’ouverture et le triple « malheur » sont conservés pour respecter le rythme solennel de la vision. Le marqueur [b] est placé après l’expression qu’il explique.
