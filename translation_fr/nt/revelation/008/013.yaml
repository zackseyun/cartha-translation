revisions:
- from: 'Et je vis, et j’entendis un aigle[a] qui volait au milieu du ciel[b] et disait d’une voix forte : « Malheur, malheur, malheur aux habitants de la terre, à cause des autres sonneries de trompette des trois anges qui sont sur le point de sonner ! »'
  to: 'Et je vis et j’entendis un aigle[a] qui volait au milieu du ciel[b] et qui disait d’une voix forte : « Malheur, malheur, malheur aux habitants de la terre, à cause des sons de trompette qui restent, ceux des trois anges qui sont sur le point de sonner de la trompette ! »'
  rationale: La révision remplace « autres » par une expression qui rend explicitement l’idée de sonneries restantes et explicite « de la trompette » avec les anges sur le point de sonner. Elle conserve le texte de base « un aigle », la variante textuelle en note, le registre visionnaire et l’ambiguïté lexicale raisonnable de μεσουρανήματι.
