id: REV.8.6
reference: Revelation 8:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: fr
  text: Et les sept anges qui avaient les sept trompettes se préparèrent à en sonner[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à faire retentir les trompettes ». Le verbe grec signifie « sonner de la trompette ».'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἄγγελοι
  choice: anges
  rationale: Dans le contexte céleste et apocalyptique de l’Apocalypse, le terme désigne ici des êtres célestes plutôt que des messagers humains.
- source_word: ἔχοντες
  choice: qui avaient
  rationale: La proposition relative rend naturellement en français le participe présent grec et indique que les anges étaient en possession des trompettes.
- source_word: σάλπιγγας
  choice: trompettes
  rationale: « Trompettes » est le terme français courant qui conserve les résonances apocalyptiques et cultuelles de σάλπιγξ.
- source_word: ἡτοίμασαν αὑτοὺς
  choice: se préparèrent
  rationale: La forme pronominale exprime explicitement la préparation des anges eux-mêmes; le passé simple convient au registre narratif digne du passage.
- source_word: ἵνα σαλπίσωσιν
  choice: à en sonner
  rationale: La construction française avec « se préparer à » exprime naturellement le but introduit par ἵνα; « en » reprend les sept trompettes et « sonner » rend le verbe grec spécifique à l’action de faire retentir une trompette.
theological_decisions:
- issue: Nature des ἄγγελοι dans le contexte apocalyptique
  choice: anges célestes
  alternative: messagers humains
  rationale: La scène céleste et les sept trompettes confiées à ces figures favorisent nettement le sens d’êtres célestes, sans ajouter de précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le ton narratif littéraire; « se préparèrent à en sonner » évite une répétition lourde tout en conservant clairement le référent.
