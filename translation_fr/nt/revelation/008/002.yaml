id: REV.8.2
reference: Revelation 8:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: fr
  text: Et je vis les sept anges qui se tiennent devant Dieu[a], et sept trompettes leur furent données.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui sont debout devant Dieu » ; le parfait grec souligne qu’ils se trouvent durablement dans cette position.
    reason: alternative lexicale liée à la valeur stative du parfait grec
lexical_decisions:
- source_word: εἶδον
  choice: je vis
  rationale: L’aoriste de ὁράω introduit naturellement ce que Jean perçoit dans la vision. Le passé simple convient au registre narratif biblique soutenu sans être archaïque.
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: les sept anges
  rationale: L’article grec avec le nombre désigne un groupe défini. Le contexte céleste indique des êtres angéliques, et non de simples messagers humains.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: devant Dieu
  rationale: Cette formulation française concise et naturelle conserve la dimension spatiale et relationnelle de l’expression grecque.
- source_word: ἑστήκασιν
  choice: se tiennent
  rationale: Le parfait de ἵστημι décrit un état présent résultant d’une prise de position. « Se tiennent » exprime idiomatiquement cet état continu en français.
- source_word: ἐδόθησαν αὐτοῖς
  choice: leur furent données
  rationale: Le passif maintient implicite l’identité de celui qui donne, comme dans le grec, et l’accord au féminin suit « trompettes ».
- source_word: σάλπιγγες
  choice: trompettes
  rationale: « Trompettes » est le terme français usuel et approprié à l’imagerie apocalyptique et judiciaire de l’Apocalypse.
theological_decisions:
- issue: Identité et statut des sept anges
  choice: les sept anges qui se tiennent devant Dieu
  alternative: les sept archanges
  rationale: Le texte désigne un groupe défini de sept anges, mais ne les appelle pas « archanges » et ne précise pas leur rang. La traduction n’importe donc aucune identification issue de traditions ultérieures.
- issue: Agent implicite du don des trompettes
  choice: sept trompettes leur furent données
  alternative: Dieu leur donna sept trompettes
  rationale: Le passif grec ne nomme pas celui qui donne. Le conserver évite de rendre explicite une identification que le verset laisse implicite.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple « je vis » et « furent données » soutient le récit visionnaire sans recourir à des termes archaïques. La syntaxe suit étroitement le grec tout en restant naturelle en français.
