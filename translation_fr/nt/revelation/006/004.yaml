id: REV.6.4
reference: Revelation 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: fr
  text: Et un autre cheval sortit, rouge feu[a]. À celui qui le montait, il fut donné d’enlever la paix de la terre[b], afin que les hommes se massacrent les uns les autres[c], et une grande épée lui fut donnée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rouge ». Le mot grec désigne plus précisément un rouge qui évoque le feu.
    reason: lexical_alternative
  - marker: b
    text: Ou « du pays ». Le mot grec peut désigner la terre entière ou un territoire.
    reason: lexical_alternative
  - marker: c
    text: 'Le verbe grec est plus fort que le simple verbe « tuer » : il évoque une mise à mort violente et sanglante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἵππος πυρρός
  choice: un autre cheval… rouge feu
  rationale: « Un autre » marque naturellement la succession dans la vision. πυρρός désigne un rouge évoquant le feu; « rouge feu » en conserve la force visuelle dans un français actuel.
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: à celui qui le montait
  rationale: La tournure rend le participe « celui qui était assis sur lui » sans lourdeur. « Monter » un cheval est idiomatique et n’ajoute aucune identité au personnage.
- source_word: ἐδόθη αὐτῷ
  choice: il lui fut donné
  rationale: Le passif est conservé aux deux occurrences afin de ne pas nommer l’agent que le grec laisse implicite et de maintenir la répétition littéraire.
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: enlever la paix de la terre
  rationale: Dans ce contexte, λαβεῖν… ἐκ exprime le retrait; « enlever » est plus naturel en français que « prendre… de ». « Terre » garde la portée potentiellement mondiale de γῆ.
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: afin que les hommes s’égorgent les uns les autres
  rationale: σφάζω évoque une mise à mort sanglante, plus forte que « tuer ». Le sujet implicite indéfini est explicité par « les hommes », au sens de personnes humaines, pour obtenir une phrase française intelligible.
- source_word: μάχαιρα μεγάλη
  choice: une grande épée
  rationale: μάχαιρα peut désigner une épée ou une grande lame; « épée » convient à l’imagerie apocalyptique, tandis que « grande » préserve μεγάλη.
theological_decisions:
- issue: Passif implicite dans les deux emplois de ἐδόθη
  choice: Conserver « il lui fut donné » sans identifier celui qui donne
  alternative: « Dieu lui donna » ou « il reçut le pouvoir de »
  rationale: Le texte suggère une autorisation souveraine sans en nommer explicitement l’auteur. Le passif préserve cette retenue ainsi que la tension théologique.
- issue: Valeur de ἵνα après l’enlèvement de la paix
  choice: « afin que », laissant ouverte la nuance de but ou de conséquence envisagée
  alternative: « de sorte que »
  rationale: ἵνα peut ici exprimer le but ou le résultat. « Afin que » suit la construction grecque sans expliquer davantage le rapport causal.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La syntaxe garde la répétition solennelle du passage et ses passifs, tout en évitant le calque lourd « celui qui était assis dessus ». « Rouge feu » restitue l’image vive; « s’égorgent » rend la brutalité particulière de σφάζω.
