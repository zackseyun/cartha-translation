  rationale: La révision corrige la collocation française du complément de « venger », restitue explicitement la formule « ceux qui habitent sur la terre » et ajuste la note afin qu’elle signale une possibilité syntaxique sans ajouter une paraphrase interprétative. Les virgules rendent également l’adresse grecque plus nette.
