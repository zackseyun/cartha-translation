id: REV.6.10
reference: Revelation 6:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: fr
  text: 'Ils crièrent d’une voix forte : « Jusqu’à quand, Maître[a], saint et véritable, resteras-tu sans juger ni venger notre sang sur ceux qui habitent sur la terre[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Souverain Seigneur ». Le titre grec employé ici, despotēs, souligne l’autorité absolue et se distingue de kyrios (« Seigneur »).
    reason: lexical_alternative
  - marker: b
    text: Ou « de ceux qui habitent sur la terre ». La préposition grecque peut désigner ceux de qui la justice est exigée; « ceux qui habitent sur la terre » est une désignation récurrente dans l’Apocalypse.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: crièrent d’une voix forte
  rationale: Cette formulation naturelle conserve l’intensité du verbe κράζω ainsi que l’image concrète de la voix forte.
- source_word: Ἕως πότε
  choice: Jusqu’à quand
  rationale: Équivalent français usuel d’un appel plaintif portant sur le retard d’une intervention attendue.
- source_word: δεσπότης
  choice: Maître
  rationale: Le terme désigne celui qui détient une autorité absolue et reste ainsi distinct de κύριος, habituellement rendu par « Seigneur ».
- source_word: ἅγιος καὶ ἀληθινός
  choice: saint et véritable
  rationale: La traduction directe préserve à la fois la sainteté et le caractère authentique, fiable, de celui qui est invoqué.
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: resteras-tu sans juger ni venger
  rationale: Dans la question introduite par « Jusqu’à quand », les présents grecs expriment une action divine attendue mais encore différée. Cette tournure française rend ce retard sans affaiblir les notions de jugement et de vengeance.
- source_word: τὸ αἷμα ἡμῶν
  choice: notre sang
  rationale: La traduction littérale conserve l’idiome biblique qui désigne leur mort violente.
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: contre les habitants de la terre
  rationale: La préposition ἐκ, avec ἐκδικεῖς, désigne ici ceux auxquels vengeance est demandée. « Habitants de la terre » est naturel en français tout en maintenant la désignation récurrente de l’Apocalypse.
theological_decisions:
- issue: Titre divin δεσπότης
  choice: Maître
  alternative: Souverain Seigneur
  rationale: « Maître » préserve la distinction lexicale avec κύριος et exprime l’autorité absolue sans ajouter le titre « Seigneur » absent du grec.
- issue: Portée de l’appel des martyrs à la justice
  choice: juger et venger notre sang
  alternative: juger et faire justice de notre sang
  rationale: Le texte demande explicitement un jugement et une vengeance divins en réponse au sang versé. La formulation retenue conserve cette tension judiciaire et rétributive au lieu de l’atténuer.
- issue: Valeur de ἐκ devant les habitants de la terre
  choice: contre les habitants de la terre
  alternative: demander compte de notre sang aux habitants de la terre
  rationale: La formulation retenue laisse subsister la construction selon laquelle les habitants sont la cible ou la source auprès de laquelle la vengeance s’exerce, sans expliciter davantage le mécanisme du jugement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe de la question a été rendue idiomatiquement, tout en conservant le retard de l’action attendue, le titre divin distinctif et la force non atténuée de l’appel au jugement et à la vengeance.
