  source_fidelity: La phrase rend correctement l’appel pressant, le titre δεσπότης distinct de κύριος, ainsi que la demande de jugement et de juste rétribution. Toutefois, « venger notre sang contre les habitants » est une collocation française peu naturelle et rend de façon imprécise la relation marquée par ἐκ. « sur ceux qui habitent sur la terre » conserve mieux la formulation récurrente de l’Apocalypse et fournit un complément français plus idiomatique à « venger notre sang ».
  naturalness: La question avec « Jusqu’à quand » est naturelle et soutenue. L’ajout de virgules autour de « saint et véritable » clarifie qu’il s’agit de deux qualificatifs vocatifs de « Maître ». « Ceux qui habitent sur la terre » est plus proche du tour apocalyptique que « les habitants de la terre ».
  terminology: « Maître » préserve de manière défendable la distinction avec κύριος. « Saint et véritable », « juger » et « venger notre sang » maintiennent le registre biblique et la force judiciaire du grec sans l’atténuer.
