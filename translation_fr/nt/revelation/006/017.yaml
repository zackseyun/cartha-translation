id: REV.6.17
reference: Revelation 6:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: fr
  text: car le grand jour de leur colère est arrivé[a], et qui peut tenir debout ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certaines traductions interprétatives ont « sa colère » ; le grec porte « leur colère », en référence à celui qui siège sur le trône et à l’Agneau ensemble.
    reason: Signaler une interprétation alternative tout en expliquant le pluriel explicite du texte grec.
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Introduit la cause de la terreur décrite au verset précédent. « Car » convient au registre solennel tout en restant naturel en français moderne.
- source_word: ἦλθεν
  choice: est arrivé
  rationale: L’aoriste de ἔρχομαι présente ici l’événement comme désormais réalisé, avec des conséquences présentes. « Est arrivé » exprime clairement cette portée.
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: le grand jour
  rationale: Cette formulation française naturelle conserve le poids solennel et eschatologique de l’expression grecque.
- source_word: τῆς ὀργῆς
  choice: de leur colère
  rationale: Dans ce contexte de jugement, ὀργή désigne une colère qui s’exerce judiciairement. « Colère » est plus courant et immédiatement compréhensible que « courroux », sans en affaiblir ici la force.
- source_word: αὐτῶν
  choice: leur
  rationale: 'Le pronom grec est au pluriel et renvoie aux deux figures mentionnées au verset précédent : celui qui siège sur le trône et l’Agneau. Le pluriel est donc conservé malgré sa tension théologique.'
- source_word: τίς δύναται
  choice: qui peut
  rationale: Rend directement et naturellement la question rhétorique portant sur la capacité de résister.
- source_word: σταθῆναι
  choice: tenir debout
  rationale: Préserve l’image concrète de « se tenir debout » tout en laissant entendre, dans ce contexte, l’idée de subsister face au jugement.
theological_decisions:
- issue: Le pronom pluriel associé à la colère de celui qui siège sur le trône et de l’Agneau
  choice: Conserver « leur colère »
  alternative: Employer « sa colère » en ramenant l’action judiciaire à un référent singulier
  rationale: Le texte grec porte explicitement αὐτῶν, « leur ». Il renvoie naturellement aux deux figures de 6.16. La traduction conserve cette tension grammaticale et théologique au lieu de l’harmoniser.
translation_notes:
  register: Français international moderne, digne et solennel. La syntaxe reste concise et conserve la force de la question rhétorique. « Tenir debout » maintient l’image du grec sans expliciter à l’excès l’idée de résister ou de subsister.
