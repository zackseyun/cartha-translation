  rationale: La révision remplace « loin de la face » par « de devant le visage », formulation française soutenue et naturelle qui maintient l’image personnelle de πρόσωπον et le mouvement de fuite exprimé par ἀπό. La répétition de « de devant » devant « la colère » rend explicitement la coordination grecque sans infléchir le sens. La virgule finale est conservée, car la phrase continue au verset suivant.
