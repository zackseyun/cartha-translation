  verdict: revise
  source_fidelity: 'Le texte rend correctement le présent narratif, les deux impératifs, les montagnes et les rochers, ainsi que les deux réalités coordonnées dont les humains cherchent à se soustraire : celui qui siège sur le trône et la colère de l’Agneau. Toutefois, « cachez-nous loin de la face » introduit une tournure française mal rattachée syntaxiquement à l’impératif et affaiblit la relation directe exprimée par ἀπό.'
  naturalness: Le registre est globalement moderne et digne. « Cachez-nous de devant le visage de » est une formulation soutenue mais intelligible, plus idiomatique dans ce contexte solennel que « cachez-nous loin de la face de ».
  terminology: « Colère », « Agneau », « trône », « montagnes » et « rochers » conviennent. « Visage » rend concrètement πρόσωπον dans un français actuel; la note conserve l’alternative interprétative « présence ».
  issues:
