    issue: La construction « cachez-nous loin de la face de celui qui siège » est maladroite et syntaxiquement ambiguë.
    rationale: En français, « cacher quelqu’un loin de » ne rend pas naturellement l’idée de se soustraire à une personne. « De devant le visage de » exprime directement et avec un registre approprié l’éloignement de la présence visible de celui qui siège, sans modifier le sens.
