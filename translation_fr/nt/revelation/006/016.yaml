id: REV.6.16
reference: Revelation 6:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: fr
  text: 'et ils disent aux montagnes et aux rochers : « Tombez sur nous et cachez-nous de devant le visage[a] de celui qui siège sur le trône, et de devant la colère de l’Agneau, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de la présence de celui qui siège sur le trône ».'
    reason: 'Alternative lexicale pour ἀπὸ προσώπου : « visage » conserve l’image concrète, tandis que « présence » en exprime le sens idiomatique possible.'
lexical_decisions:
- source_word: λέγουσιν
  choice: ils disent
  rationale: Le présent de l’indicatif est conservé comme présent narratif vivant, adapté à l’immédiateté de la vision apocalyptique.
- source_word: ὄρεσιν
  choice: aux montagnes
  rationale: ὄρος désigne normalement une montagne ; ce choix préserve la force et l’ampleur de l’image.
- source_word: πέτραις
  choice: aux rochers
  rationale: πέτρα désigne ici des masses rocheuses ou des escarpements ; « rochers » est précis et naturel en français moderne.
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: Tombez sur nous
  rationale: L’impératif aoriste pluriel exprime un ordre direct et pressant ; « sur nous » rend naturellement ἐπί avec l’accusatif.
- source_word: κρύψατε ἡμᾶς
  choice: cachez-nous
  rationale: Cette formulation directe conserve l’impératif et reste claire, naturelle et forte.
- source_word: ἀπὸ προσώπου
  choice: loin de la face de
  rationale: La traduction maintient l’image concrète de πρόσωπον, « face », tout en employant « loin de » pour exprimer naturellement ἀπό en français. Le sens possible de « présence » est signalé en note.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: celui qui siège sur le trône
  rationale: Cette formulation rend le participe substantivé et l’état durable de celui qui est assis sur le trône, dans un français actuel et digne.
- source_word: ὀργῆς
  choice: la colère
  rationale: Dans ce contexte de jugement, « colère » porte en français la gravité requise sans recourir à l’archaïsant « courroux ».
- source_word: τοῦ ἀρνίου
  choice: de l’Agneau
  rationale: La majuscule marque le titre christologique établi dans l’Apocalypse et préserve le paradoxe entre l’agneau sacrificiel et l’agent du jugement.
theological_decisions:
- issue: Les deux figures coordonnées devant lesquelles les humains cherchent à se cacher
  choice: Conserver distinctement « celui qui siège sur le trône » et « l’Agneau », tous deux introduits par l’idée d’éloignement.
  alternative: Fondre les deux références en une mention générale de Dieu.
  rationale: Le grec coordonne explicitement la face de celui qui siège sur le trône et la colère de l’Agneau. La traduction maintient leur distinction ainsi que leur association dans la scène du jugement.
- issue: Le paradoxe de « la colère de l’Agneau »
  choice: Traduire directement « la colère de l’Agneau ».
  alternative: Atténuer l’expression, par exemple en parlant seulement du jugement de l’Agneau.
  rationale: Le texte unit délibérément l’image sacrificielle de l’Agneau à la colère eschatologique ; cette tension théologique ne doit pas être résolue ou adoucie dans la traduction.
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif maintient l’immédiateté de la vision. « Celui qui siège » est plus solennel que « celui qui est assis » sans être archaïque. La ponctuation finale conserve la virgule, puisque la phrase se poursuit au verset suivant.
