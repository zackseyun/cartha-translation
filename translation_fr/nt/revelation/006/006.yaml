id: REV.6.6
reference: Revelation 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: fr
  text: 'Et j’entendis comme une voix qui disait, du milieu des quatre êtres vivants : « Une mesure[a] de blé pour un denier[b], et trois mesures d’orge pour un denier ; et ne porte atteinte ni à l’huile ni au vin[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La mesure grecque appelée choenix correspondait approximativement à un litre et représentait souvent la ration quotidienne de céréales d’une personne.
    reason: cultural_note
  - marker: b
    text: Le denier était généralement le salaire d’une journée de travail ; ces prix évoquent donc une grave pénurie.
    reason: cultural_note
  - marker: c
    text: 'Ou : « n’endommage ni l’huile ni le vin ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: comme une voix
  rationale: Cette formulation conserve la valeur comparative ou perceptive de ὡς sans affirmer plus précisément l’identité de celui qui parle. Elle reste naturelle dans le registre visionnaire de l’Apocalypse.
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: au milieu des quatre êtres vivants
  rationale: ἐν μέσῳ exprime ici une position centrale ou une présence parmi eux. « Êtres vivants » distingue ces figures du trône des bêtes hostiles mentionnées plus loin dans l’Apocalypse.
- source_word: Χοῖνιξ
  choice: une mesure
  rationale: La choenix est une ancienne mesure de capacité sèche, proche d’un litre. « Une mesure » évite une conversion faussement précise dans le texte courant, tandis que la note en indique l’ordre de grandeur et la portée alimentaire.
- source_word: σίτου
  choice: blé
  rationale: Le sens précis « blé » convient au contraste explicite avec l’orge.
- source_word: δηναρίου
  choice: pour un denier
  rationale: Le génitif marque le prix. Le denier est conservé comme monnaie antique plutôt que converti en valeur moderne, nécessairement instable.
- source_word: τρεῖς χοίνικες κριθῶν
  choice: trois mesures d’orge
  rationale: La répétition de la même unité est rendue de façon cohérente, et κριθή désigne l’orge.
- source_word: μὴ ἀδικήσῃς
  choice: ne porte atteinte ni à l’huile ni au vin
  rationale: ἀδικέω peut signifier faire du tort, nuire ou endommager. « Porter atteinte à » convient à des produits agricoles tout en préservant une portée plus large que la seule détérioration matérielle.
- source_word: τὸ ἔλαιον
  choice: l’huile
  rationale: Dans ce contexte méditerranéen, il s’agit normalement d’huile d’olive, mais « huile » suffit dans le texte principal.
- source_word: τὸν οἶνον
  choice: le vin
  rationale: Équivalent français direct et usuel de οἶνος.
theological_decisions:
- issue: Désignation des ζῷα dans la vision du trône
  choice: êtres vivants
  alternative: animaux ; bêtes
  rationale: « Êtres vivants » reflète leur caractère visionnaire et évite de les confondre avec les bêtes hostiles qui apparaissent plus loin dans le livre.
- issue: Présentation des mesures et de la monnaie antiques
  choice: Employer « mesure » dans le texte et conserver « denier », avec des précisions en notes
  alternative: Transcrire « choenix » ; convertir les deux unités en mesures et monnaie modernes
  rationale: Ce choix rend immédiatement compréhensible la scène de rationnement sans introduire une équivalence moderne trop précise ni effacer son cadre historique.
- issue: Portée de l’interdiction concernant l’huile et le vin
  choice: ne porte atteinte ni à l’huile ni au vin
  alternative: n’endommage pas l’huile et le vin ; ne fais pas de mal à l’huile et au vin
  rationale: La traduction retenue garde l’étendue sémantique de ἀδικέω et ne tranche pas entre dommage matériel, restriction économique ou autre forme d’atteinte.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe conserve le rythme de la proclamation visionnaire. « Comme une voix » maintient l’ambiguïté perceptive du grec ; « mesure » privilégie la compréhension courante, avec la précision historique donnée en note.
