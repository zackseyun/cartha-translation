id: REV.6.7
reference: Revelation 6:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: fr
  text: 'Quand il ouvrit le quatrième sceau, j’entendis la voix du quatrième être vivant dire : « Viens[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « Pars ! » Le grec dit plus littéralement « Viens ! », mais l’ordre peut être compris comme adressé soit à Jean, soit au cavalier.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: ouvrit
  rationale: L’aoriste de ἀνοίγω se rend naturellement par le passé simple dans ce récit solennel; « ouvrir un sceau » reprend avec précision la formule apocalyptique.
- source_word: σφραγῖδα
  choice: sceau
  rationale: Dans Apocalypse 6, σφραγίς désigne l’un des sceaux du rouleau; « sceau » est le terme français précis et établi.
- source_word: τετάρτην / τετάρτου
  choice: quatrième
  rationale: Les deux adjectifs ordinaux sont rendus de manière uniforme.
- source_word: φωνὴν
  choice: la voix
  rationale: Bien qu’anarthre en grec, le nom est déterminé par « du quatrième être vivant »; l’article défini est donc naturel en français.
- source_word: ζῴου
  choice: être vivant
  rationale: Dans l’Apocalypse, ζῷον désigne les êtres qui entourent le trône, et non un animal ordinaire. « Être vivant » est clair et évite la confusion avec θηρίον, la « bête ».
- source_word: λέγοντος
  choice: dire
  rationale: Après « j’entendis la voix », l’infinitif « dire » rend naturellement le participe présent grec sans alourdir la phrase.
- source_word: Ἔρχου
  choice: Viens
  rationale: L’impératif ἔρχου signifie le plus directement « Viens ». Le texte grec ne nomme pas son destinataire, et la traduction conserve cette indétermination.
theological_decisions:
- issue: Destinataire de l’impératif Ἔρχου
  choice: Traduire simplement par « Viens » sans préciser le destinataire.
  alternative: Comprendre l’ordre comme adressé à Jean ou au cavalier, et traduire éventuellement « Pars » ou « Avance ».
  rationale: Le grec ne désigne pas explicitement le destinataire. La formulation nue préserve l’ambiguïté narrative et théologique au lieu de la résoudre par interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Être vivant » maintient la distinction terminologique avec « bête ». Le marqueur [a] figure immédiatement après l’impératif concerné.
