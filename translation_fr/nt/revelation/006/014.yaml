id: REV.6.14
reference: Revelation 6:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: fr
  text: Et le ciel se retira[a], comme un rouleau[b] qu’on enroule, et toute montagne et toute île furent déplacées de leur place[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se sépara » ou « disparut » ; le verbe grec peut exprimer une séparation ou un retrait.
    reason: lexical_alternative
  - marker: b
    text: Le grec désigne un rouleau, et non un livre moderne relié.
    reason: cultural_note
  - marker: c
    text: 'Littéralement « de leurs places » : chaque montagne et chaque île fut déplacée de sa propre place.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐρανὸς
  choice: le ciel
  rationale: Dans cette scène de bouleversement cosmique, « le ciel » désigne naturellement en français l’étendue visible au-dessus de la terre, sans obliger à comprendre le lieu où Dieu demeure.
- source_word: ἀπεχωρίσθη
  choice: se retira
  rationale: Le verbe exprime une séparation ou un éloignement. « Se retira » reste naturel en français et conserve le mouvement suggéré par le rouleau qui s’enroule, sans préciser indûment le mécanisme de la vision.
- source_word: βιβλίον
  choice: rouleau
  rationale: Dans ce contexte ancien, le terme désigne un rouleau plutôt qu’un livre moderne relié; l’action de l’enrouler confirme ce sens.
- source_word: ἑλισσόμενον
  choice: qui s’enroule
  rationale: Le participe décrit quelque chose qui est roulé ou qui s’enroule. Cette formulation française rend l’image avec clarté et concision.
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: toute montagne et toute île
  rationale: La répétition de « toute » rend explicitement en français la valeur distributive de πᾶν devant les deux noms singuliers.
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: de leur place
  rationale: Le grec dit littéralement « de leurs lieux ». Le singulier distributif français indique naturellement que chaque montagne et chaque île quitte sa propre place.
- source_word: ἐκινήθησαν
  choice: furent déplacées
  rationale: Le contexte et le complément de lieu indiquent un changement de position, et non un simple tremblement.
theological_decisions:
- issue: Portée cosmique de οὐρανός
  choice: Traduire par « le ciel » au sens de l’étendue visible
  alternative: Comprendre « les cieux » comme le domaine céleste ou la demeure divine
  rationale: L’imagerie associe le ciel aux montagnes et aux îles dans un bouleversement cosmique visible. La traduction n’ajoute donc aucune affirmation sur une altération de la demeure de Dieu.
- issue: Nature du retrait du ciel
  choice: Employer « se retira » tout en signalant l’idée possible de séparation
  alternative: « se sépara », « fut écarté » ou « disparut »
  rationale: ἀπεχωρίσθη permet plusieurs nuances de séparation et d’éloignement. « Se retira » préserve l’image apocalyptique sans imposer l’idée d’un anéantissement, tandis que la note maintient l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le rythme de la vision et sa coordination répétée par « et ». « Se retira » est courant sans être familier; les notes préservent les nuances du grec et expliquent l’image ancienne du rouleau.
