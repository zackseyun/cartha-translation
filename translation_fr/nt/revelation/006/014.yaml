review_pass:
  verdict: revise
  source_fidelity: « Le ciel se retira » rend de manière recevable ἀπεχωρίσθη, dont le sens fondamental est celui d’une séparation ou d’un retrait; les possibilités alternatives sont convenablement signalées. « Toute montagne et toute île furent déplacées de leur place » préserve la valeur distributive et le déplacement hors de leur emplacement. En revanche, le participe passif ἑλισσόμενον est mieux rendu par « qu’on enroule » que par « qui s’enroule », qui attribue au rouleau une action réflexive absente du grec.
  naturalness: La formulation révisée demeure sobre et naturelle en français international moderne. La virgule avant la comparaison rend la syntaxe plus lisible, et « un rouleau qu’on enroule » exprime idiomatiquement l’image antique sans donner l’impression que le rouleau agit de lui-même.
  terminology: « Ciel », « rouleau » et « déplacées » sont appropriés au contexte visionnaire et ne surinterprètent pas l’imagerie cosmique. La note sur le rouleau est resserrée afin d’expliquer précisément l’opposition pertinente avec un livre relié moderne, sans ajout spéculatif.
  issues:
  - severity: low
    issue: Voix du participe ἑλισσόμενον
    rationale: « qui s’enroule » est réflexif, tandis que le participe grec est passif/moyen dans une image où le rouleau est en train d’être enroulé. « qu’on enroule » rend plus directement la construction et l’image.
  - severity: low
    issue: Formulation de la note b
    rationale: Dire qu’il s’agit d’un rouleau « destiné à être déroulé et enroulé » ajoute une précision fonctionnelle non nécessaire. Il suffit d’identifier le support comme un rouleau plutôt qu’un codex moderne.
