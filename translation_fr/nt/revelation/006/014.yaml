- from: Et le ciel se retira[a] comme un rouleau[b] qui s’enroule, et toute montagne et toute île furent déplacées de leur place[c].
  to: Et le ciel se retira[a], comme un rouleau[b] qu’on enroule, et toute montagne et toute île furent déplacées de leur place[c].
  rationale: Révision limitée à la restitution de la voix du participe décrivant le rouleau et à une note culturelle plus précise. Le choix principal « se retira » et l’ambiguïté lexicale de ἀπεχωρίσθη sont conservés; aucun sens théologique ou mécanisme cosmologique supplémentaire n’est introduit.
