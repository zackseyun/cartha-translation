  rationale: La révision corrige la seule défaillance syntaxique significative et renforce légèrement la correspondance de « tuer » avec ἀποκτεῖναι. Les choix lexicaux importants du projet, ainsi que les deux notes nécessaires à la transparence des ambiguïtés, sont conservés.
