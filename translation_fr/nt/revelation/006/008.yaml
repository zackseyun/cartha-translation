review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle au grec. « Vert pâle » rend bien χλωρός et la note conserve l’alternative « pâle ». « Le séjour des morts » transmet adéquatement ᾅδης sans importer le sens de châtiment final. « Par la peste », avec une note signalant le sens littéral « par la mort », est défendable dans l’allusion aux listes de jugements d’Ézéchiel. En revanche, « Il leur fut donné autorité » est une construction française défectueuse et obscurcit le passif pluriel ἐδόθη αὐτοῖς ἐξουσία.
  naturalness: La formulation est globalement claire et de registre biblique moderne. « Une autorité leur fut donnée » préserve plus naturellement le passif solennel du grec. « Afin de tuer » rend directement l’infinitif ἀποκτεῖναι et s’accorde mieux avec l’énumération des moyens.
  terminology: La personnification de « la Mort » est correctement indiquée par la majuscule. « Le séjour des morts » est un équivalent explicatif approprié de ᾅδης. « Autorité » convient à ἐξουσία, et « bêtes sauvages » à θηρία.
  issues:
  - severity: medium
    issue: Construction « Il leur fut donné autorité »
    rationale: En français moderne, « donner autorité » dans cette construction impersonnelle est fautif ou au minimum très heurté. Le grec exprime qu’une autorité fut donnée aux deux figures, la Mort et le séjour des morts. « Une autorité leur fut donnée » restitue clairement ce sens et le passif.
  - severity: low
    issue: « Pour faire mourir » atténue légèrement ἀποκτεῖναι
    rationale: ἀποκτεῖναι signifie directement « tuer » ou « mettre à mort ». « Afin de tuer » est à la fois plus exact et plus idiomatique avant la liste des instruments.
