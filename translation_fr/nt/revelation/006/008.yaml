source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: fr
  text: 'Et je regardai, et voici : un cheval vert pâle[a]. Celui qui le montait avait pour nom la Mort, et le séjour des morts le suivait. Une autorité leur fut donnée sur le quart de la terre, afin de tuer par l’épée, par la famine, par la peste[b] et par les bêtes sauvages de la terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un cheval pâle ». Le grec désigne une couleur verte ou verdâtre qui évoque ici une pâleur maladive.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « par la mort ». Dans cette liste de jugements, qui fait écho à Ézéchiel 14, le mot peut désigner la peste ou une épidémie meurtrière.'
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: vert pâle
  rationale: Le mot désigne une teinte verte ou verdâtre et peut évoquer ici la pâleur maladive d’un cadavre. « Vert pâle » conserve la couleur explicite du grec, contrairement à « pâle » seul.
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: celui qui le montait
  rationale: Cette formulation rend naturellement en français la personne assise sur le cheval sans ajouter un titre absent du grec.
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: avait pour nom la Mort
  rationale: La tournure garde la formule de nomination tout en restant idiomatique; la majuscule marque la personnification.
- source_word: ᾅδης
  choice: le séjour des morts
  rationale: Cette expression désigne clairement le domaine des morts sans l’assimiler à l’enfer du jugement final; elle est plus immédiatement compréhensible que le calque « Hadès ».
- source_word: μετ’ αὐτοῦ
  choice: le suivait
  rationale: Avec ἠκολούθει, le français naturel exprime l’accompagnement comme le fait de suivre. Le contexte établit qu’il suit la Mort.
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: il leur fut donné autorité
  rationale: « Autorité » exprime une compétence accordée, et le passif conserve la retenue du passif divin grec.
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: sur le quart de la terre
  rationale: Le grec indique un quart de la terre; « terre » convient à la portée cosmique de la vision.
- source_word: ἀποκτεῖναι
  choice: faire mourir
  rationale: Cette expression française permet d’introduire naturellement la série des moyens de mort tout en rendant le sens causal de l’infinitif.
- source_word: ἐν ῥομφαίᾳ
  choice: par l’épée
  rationale: « Par l’épée » rend clairement le moyen et conserve l’image biblique traditionnelle sans archaïsme.
- source_word: ἐν λιμῷ
  choice: par la famine
  rationale: λιμός désigne une famine, non le simple sentiment de faim.
- source_word: ἐν θανάτῳ
  choice: par la peste
  rationale: Dans la liste traditionnelle de jugements qui évoque Ézéchiel 14, « mort » peut désigner idiomatiquement une épidémie meurtrière. La traduction littérale est signalée en note.
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: par les bêtes sauvages de la terre
  rationale: La tournure rend l’agent exprimé par ὑπό et précise naturellement que θηρία désigne des animaux sauvages.
theological_decisions:
- issue: Sens de ᾅδης
  choice: le séjour des morts
  alternative: l’Hadès; l’enfer; la tombe
  rationale: Le texte distingue la Mort personnifiée du domaine des morts qui la suit. « L’enfer » risquerait d’introduire ici la notion du châtiment final, que le terme grec n’impose pas.
- issue: Sens de ἐν θανάτῳ dans la liste des jugements
  choice: par la peste
  alternative: par la mort
  rationale: L’écho aux listes de jugements d’Ézéchiel favorise le sens idiomatique de peste ou d’épidémie. Une note préserve toutefois la valeur littérale et l’ambiguïté du grec.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe visionnaire « Et je regardai, et voici » préserve le rythme solennel du grec. Les formulations doctrinalement chargées sont évitées, et les ambiguïtés lexicales importantes sont conservées en notes.
