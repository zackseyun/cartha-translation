id: REV.6.2
reference: Revelation 6:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: fr
  text: 'Et je vis : voici un cheval blanc. Celui qui le montait[b] avait un arc. Une couronne lui fut donnée[a], puis il partit en vainqueur et pour vaincre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une couronne de vainqueur lui fut donnée ». Le grec στέφανος désigne souvent une couronne ou une guirlande associée à la victoire, plutôt qu’un diadème royal.
    reason: lexical_alternative
  - marker: b
    text: Le texte ne précise pas l’identité de celui qui monte le cheval. Les interprétations sont très diverses.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶδον
  choice: je vis
  rationale: Le sens ordinaire de l’aoriste de ὁράω convient à la succession des visions et reste plus direct en français que « je regardai ».
- source_word: ἰδοὺ
  choice: voici
  rationale: « Voici » conserve la fonction de présentation vive et solennelle de la particule sans employer l’archaïsme « voici que ».
- source_word: ἵππος λευκός
  choice: un cheval blanc
  rationale: La tournure introduit naturellement en français un nouvel élément de la vision.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: celui qui le montait
  rationale: Cette formulation française naturelle rend la personne assise sur le cheval sans la nommer ni préciser son identité.
- source_word: ἔχων τόξον
  choice: avait un arc
  rationale: « Avait » exprime simplement la possession indiquée par ἔχων; le texte ne précise ni qu’il le tenait à la main ni qu’il en faisait usage.
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: une couronne lui fut donnée
  rationale: La voix passive et le bénéficiaire sont conservés. « Couronne » reste naturel, tandis qu’une note signale la nuance possible de couronne de victoire.
- source_word: ἐξῆλθεν
  choice: il partit
  rationale: « Partit » rend naturellement le mouvement de sortie dans la progression narrative de la vision.
- source_word: νικῶν
  choice: en vainqueur
  rationale: Cette expression concise maintient l’imagerie de victoire ou de conquête et le lien circonstanciel avec son départ.
- source_word: ἵνα νικήσῃ
  choice: pour vaincre
  rationale: La construction finale française exprime clairement le but porté par ἵνα avec le subjonctif, sans lourdeur.
theological_decisions:
- issue: Identité de celui qui monte le cheval blanc
  choice: La traduction ne précise pas son identité.
  alternative: Le Christ ou une figure semblable au Christ; un souverain ou un empire conquérant; l’antichrist ou un conquérant trompeur.
  rationale: Le grec décrit la monture, l’équipement et l’action du personnage sans l’identifier. La formulation et la note préservent cette indétermination.
translation_notes:
  register: Français international moderne, sobre et digne. « Voici » garde la vivacité du style visionnaire; « en vainqueur et pour vaincre » préserve la répétition de la racine grecque et sa tension, sans identifier le personnage.
