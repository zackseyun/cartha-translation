  to: Et chacun d’eux reçut une robe blanche. Il leur fut dit de se reposer encore un peu de temps, jusqu’à ce que leurs compagnons d’esclavage et leurs frères[b], qui allaient être mis à mort comme eux-mêmes l’avaient été, soient eux aussi au complet[a].
  rationale: Réorganisation de la dernière proposition afin que « qui allaient être mis à mort » se rattache sans ambiguïté à « leurs compagnons d’esclavage et leurs frères » et que la principale au subjonctif soit fluide. Le sens non spécifié de πληρωθῶσιν demeure préservé par « soient eux aussi au complet », avec l’explicitation interprétative limitée à la note.
