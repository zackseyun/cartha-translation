id: REV.6.11
reference: Revelation 6:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: fr
  text: Et chacun d’eux reçut une robe blanche. Il leur fut dit de se reposer encore un peu de temps, jusqu’à ce que leurs compagnons d’esclavage et leurs frères[b], qui allaient être mis à mort comme eux-mêmes l’avaient été, soient eux aussi au complet[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement « jusqu’à ce que… soient rendus complets » ou « soient accomplis ». On peut aussi comprendre : « jusqu’à ce que le nombre total de leurs compagnons d’esclavage et de leurs frères soit complet ».'
    reason: alternative_reading
  - marker: b
    text: Ici, « frères » peut désigner plus largement les autres croyants, y compris des femmes ; le grec emploie toutefois le masculin pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: une robe blanche
  rationale: στολή désigne une robe ou un long vêtement ; « robe blanche » est naturel en français et conserve l’image précise.
- source_word: ἑκάστῳ
  choice: chacun d’eux
  rationale: 'Le datif singulier a une valeur distributive : une robe est donnée individuellement à chacun.'
- source_word: ἐρρέθη αὐτοῖς
  choice: Il leur fut dit
  rationale: Cette formulation conserve le passif grec sans identifier celui qui parle.
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: de se reposer encore un peu de temps
  rationale: ἀναπαύω exprime ici le repos ou la cessation de l’épreuve ; la traduction maintient explicitement l’idée de repos et la durée limitée.
- source_word: πληρωθῶσιν
  choice: soient eux aussi au complet
  rationale: La formule française reste compréhensible avec des personnes pour sujet et exprime l’achèvement du groupe sans ajouter explicitement le mot « nombre », absent du grec.
- source_word: σύνδουλοι
  choice: compagnons d’esclavage
  rationale: Le terme désigne ceux qui partagent la même condition d’esclave et le même maître ; ce choix préserve la force de la famille lexicale de δοῦλος.
- source_word: ἀδελφοί
  choice: frères
  rationale: Le masculin pluriel du texte source est conservé ; une note signale qu’il peut désigner plus largement les autres croyants.
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: qui allaient être mis à mort
  rationale: Cette traduction rend le caractère à venir de μέλλω sans imposer la nuance plus déterministe que pourrait suggérer « destinés à ».
- source_word: ὡς καὶ αὐτοί
  choice: comme ils l’avaient été eux-mêmes
  rationale: Le pronom renvoie aux témoins déjà mis à mort ; le plus-que-parfait explicite naturellement en français l’antériorité contextuelle sans modifier le rapport comparatif.
theological_decisions:
- issue: Sens de πληρωθῶσιν appliqué aux compagnons d’esclavage et aux frères
  choice: soient eux aussi au complet
  alternative: jusqu’à ce que leur nombre soit complet ; soient eux aussi accomplis
  rationale: Le grec ne contient pas le nom « nombre ». Le texte principal exprime donc l’idée générale d’achèvement tout en laissant ouverte son interprétation comme achèvement numérique du groupe.
- issue: Portée de ἀδελφοί
  choice: frères, avec une note sur sa possible portée collective
  alternative: frères et sœurs ; croyants
  rationale: Le masculin du grec est préservé dans le texte principal, sans exclure la possibilité que le mot englobe ici l’ensemble des croyants.
- issue: Force sociale et théologique de σύνδουλοι
  choice: compagnons d’esclavage
  alternative: compagnons de service ; serviteurs comme eux
  rationale: L’image de personnes appartenant au même maître est significative dans l’Apocalypse ; « esclavage » évite d’atténuer cette relation.
translation_notes:
  register: Français international moderne, digne et accessible. La seconde phrase évite une coordination très longue. « Compagnons d’esclavage » est volontairement plus marqué que « compagnons de service » afin de conserver la relation au maître exprimée par σύνδουλοι. L’ambiguïté de πληρωθῶσιν est maintenue dans le texte et expliquée en note.
