  naturalness: 'La phrase actuelle est inutilement heurtée : l’inversion dans « jusqu’à ce que soient eux aussi au complet » éloigne le sujet de son verbe, puis la relative est rejetée après ce groupe verbal. Le réagencement ci-dessous est naturel en français moderne et rend l’attachement de la relative aux « compagnons d’esclavage et frères » immédiatement clair.'
