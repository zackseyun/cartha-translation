id: REV.6.3
reference: Revelation 6:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: fr
  text: 'Quand il ouvrit le deuxième sceau, j’entendis le deuxième être vivant dire : « Viens[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Va ! » Certains comprennent que l’ordre s’adresse au cavalier plutôt qu’il ne constitue une invitation à s’avancer.
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: Quand
  rationale: Le français omet naturellement ici le « et » initial tout en conservant l’enchaînement narratif par la proposition temporelle.
- source_word: ὅτε
  choice: quand
  rationale: Cette conjonction temporelle marque l’événement qui déclenche la suite de la scène.
- source_word: ἤνοιξεν
  choice: il ouvrit
  rationale: Le verbe ἀνοίγω signifie directement « ouvrir » ; il n’est pas nécessaire d’introduire l’idée interprétative de briser le sceau.
- source_word: σφραγῖδα τὴν δευτέραν
  choice: le deuxième sceau
  rationale: Formulation française naturelle qui conserve l’ordre ordinal du texte.
- source_word: ἤκουσα
  choice: j’entendis
  rationale: Le passé simple convient au récit soutenu et rend l’aoriste comme un événement ponctuel dans la séquence.
- source_word: τοῦ δευτέρου ζῴου
  choice: le deuxième être vivant
  rationale: Dans l’Apocalypse, ζῷον désigne les êtres entourant le trône, non de simples animaux ; « être vivant » est clair et évite une connotation zoologique trompeuse.
- source_word: λέγοντος
  choice: dire
  rationale: Après « entendre », l’infinitif constitue en français la manière la plus naturelle de rendre le participe grec sans perdre son rapport avec ce qui est entendu.
- source_word: Ἔρχου
  choice: Viens !
  rationale: L’impératif de ἔρχομαι signifie le plus directement « Viens ». Le contexte laisse toutefois discuter le destinataire et la valeur contextuelle de l’ordre ; cette possibilité est signalée en note.
theological_decisions:
- issue: Sens de Ἔρχου dans la formule liée à l’ouverture du sceau
  choice: Viens !
  alternative: Va !
  rationale: « Viens » conserve le sens lexical normal du verbe sans décider à qui l’ordre est adressé. La note présente l’autre compréhension contextuelle, selon laquelle l’ordre viserait le cavalier.
translation_notes:
  register: Français moderne, international et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué. L’exclamation rend la force de l’impératif grec, et la note préserve l’ambiguïté concernant son destinataire.
