id: REV.6.5
reference: Revelation 6:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: fr
  text: 'Quand il ouvrit le troisième sceau, j’entendis le troisième être vivant dire : « Viens[a]. » Je regardai, et voici : un cheval noir, et celui qui le montait tenait une balance[b] à la main.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Approche. » L’ordre peut être adressé à Jean ou appeler le cheval et celui qui le monte à s’avancer.'
    reason: alternative_reading
  - marker: b
    text: Il s’agit d’une balance servant à peser ; dans ce contexte, elle sert probablement à mesurer des denrées alimentaires.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἤνοιξε
  choice: ouvrit
  rationale: Rend directement l’aoriste de ἀνοίγω; en français, on ouvre naturellement un sceau dans cette scène visionnaire.
- source_word: σφραγῖδα τὴν τρίτην
  choice: le troisième sceau
  rationale: Traduction directe qui conserve l’ordre de la série des sceaux.
- source_word: ζῴου
  choice: être vivant
  rationale: Dans l’Apocalypse, ζῷον désigne les êtres célestes autour du trône; « être vivant » évite de les assimiler à de simples animaux.
- source_word: Ἔρχου
  choice: Viens
  rationale: Impératif bref et direct, sans préciser un destinataire que le grec laisse implicite.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: Je regardai, et voici
  rationale: Formulation française vive qui conserve la progression de la vision et la force présentative de ἰδού sans répétition maladroite.
- source_word: ἵππος μέλας
  choice: un cheval noir
  rationale: Traduction littérale qui préserve la couleur symboliquement importante.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: celui qui le montait
  rationale: Rend naturellement en français la tournure participiale « celui qui était assis sur lui », tout en conservant le personnage comme sujet explicite.
- source_word: ζυγὸν
  choice: une balance
  rationale: ζυγός peut désigner une balance à fléau; le contexte du verset suivant, où des denrées sont mesurées, favorise ce sens plutôt que « joug ».
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: à la main
  rationale: Expression idiomatique française correspondant au sens de « dans sa main ».
theological_decisions:
- issue: Destinataire de l’impératif Ἔρχου
  choice: « Viens », sans destinataire explicité
  alternative: L’ordre peut s’adresser à Jean ou appeler le cheval et celui qui le monte à s’avancer.
  rationale: Le grec ne nomme pas le destinataire; la traduction préserve cette ambiguïté au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. « Et voici » conserve la vivacité de la vision; « celui qui le montait » reste proche du grec tout en étant naturel.
