id: REV.6.13
reference: Revelation 6:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: fr
  text: et les étoiles du ciel tombèrent sur la terre, comme un figuier laisse tomber ses figues encore vertes[a] lorsqu’il est secoué par un vent violent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « figues non mûres », « figues d’hiver » ou « figues tardives » ; le terme grec désigne des figues immatures qui tombent avant de mûrir.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: étoiles
  rationale: Le sens ordinaire est « étoiles ». L’image apocalyptique est conservée sans en imposer une interprétation symbolique.
- source_word: τοῦ οὐρανοῦ
  choice: du ciel
  rationale: « Ciel » convient au registre cosmique du passage et demeure naturel en français.
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: tombèrent sur la terre
  rationale: L’aoriste et εἰς expriment le mouvement jusqu’à la terre ; cette tournure est idiomatique et dramatique en français.
- source_word: ὡς
  choice: comme
  rationale: Introduit naturellement la comparaison.
- source_word: συκῆ
  choice: un figuier
  rationale: Équivalent français courant du nom grec.
- source_word: βάλλει
  choice: laisse tomber
  rationale: Dans le contexte des fruits détachés d’un arbre sous l’action du vent, cette expression rend le résultat avec naturel sans suggérer une action volontaire.
- source_word: ὀλύνθους
  choice: figues encore vertes
  rationale: Le terme désigne des figues immatures ou non parvenues à maturité ; cette formulation est claire en français moderne, tandis qu’une note conserve la nuance lexicale.
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: par un vent violent
  rationale: « Violent » exprime idiomatiquement la grande force du vent.
- source_word: σειομένη
  choice: lorsqu’il est secoué
  rationale: Le participe présent passif, rapporté au figuier, reçoit ici une valeur circonstancielle naturelle en français.
theological_decisions:
- issue: Image apocalyptique des étoiles qui tombent
  choice: Conserver littéralement l’image des « étoiles du ciel » qui « tombèrent sur la terre », sans qualification interprétative.
  alternative: Interpréter les étoiles comme des êtres angéliques, des dirigeants ou d’autres réalités symboliques.
  rationale: Le genre apocalyptique autorise une portée symbolique, mais le texte traduit ne doit pas trancher cette question. Le maintien de l’image préserve l’ambiguïté et la tension théologique du grec.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple soutient le ton narratif élevé de l’Apocalypse ; la comparaison reste concrète et immédiatement compréhensible.
