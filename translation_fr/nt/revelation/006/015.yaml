id: REV.6.15
reference: Revelation 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: fr
  text: Et les rois de la terre, les hauts dignitaires[a], les chefs militaires, les riches, les puissants, tout esclave et toute personne libre[b] se cachèrent dans les grottes et parmi les rochers des montagnes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les grands personnages » ou « les notables ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « tout esclave et tout homme libre »; le grec emploie ici une paire au masculin singulier avec une portée représentative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: les rois de la terre
  rationale: Dans le contexte du jugement à portée universelle de l’Apocalypse, « terre » convient mieux que « pays » et correspond à l’usage récurrent de l’expression dans le livre.
- source_word: μεγιστᾶνες
  choice: les hauts dignitaires
  rationale: Le terme désigne des personnages de rang élevé ou influents. « Hauts dignitaires » exprime leur statut sans suggérer nécessairement une noblesse héréditaire.
- source_word: χιλίαρχοι
  choice: les chefs militaires
  rationale: Le mot désigne littéralement des commandants de mille hommes. Cette formulation française rend clairement la fonction militaire sans employer un titre antique peu transparent.
- source_word: πλούσιοι
  choice: les riches
  rationale: L’adjectif substantivé se rend directement et naturellement par « les riches ».
- source_word: ἰσχυροὶ
  choice: les puissants
  rationale: Dans cette liste de catégories sociales, « puissants » peut évoquer à la fois la force et le pouvoir, tout en restant distinct de la richesse et du rang officiel.
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: tout esclave et toute personne libre
  rationale: Le contraste avec les personnes libres rend explicite le statut d’asservissement de δοῦλος. « Personne libre » restitue la portée représentative du masculin grec sans limiter le groupe aux hommes.
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: se cachèrent
  rationale: Le verbe pronominal français rend naturellement l’action réflexive exprimée par le grec.
- source_word: εἰς τὰ σπήλαια
  choice: dans les grottes
  rationale: Après « se cachèrent », « dans » exprime idiomatiquement le lieu atteint, même si εἰς peut aussi souligner le mouvement vers l’intérieur.
- source_word: εἰς τὰς πέτρας τῶν ὀρέων
  choice: parmi les rochers des montagnes
  rationale: La formulation évoque naturellement les formations rocheuses et leurs anfractuosités où l’on peut se dissimuler, sans donner l’impression d’entrer dans la matière même des rochers.
theological_decisions:
- issue: Traduction de δοῦλος dans l’opposition esclave/libre
  choice: esclave
  alternative: serviteur
  rationale: L’opposition immédiate avec ἐλεύθερος met au premier plan le statut social d’asservissement; « esclave » en conserve donc la force.
- issue: Portée de la paire masculine singulière δοῦλος καὶ ἐλεύθερος
  choice: tout esclave et toute personne libre
  alternative: tout esclave et tout homme libre
  rationale: Le masculin singulier grec forme une paire sociale représentative englobant toutes les personnes. La traduction choisie conserve cette portée sans affirmer une restriction aux hommes.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au registre narratif de l’Apocalypse. L’énumération reste proche du rythme grec, tandis que les termes de rang et de statut sont formulés de manière immédiatement compréhensible.
