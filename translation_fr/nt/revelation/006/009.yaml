id: REV.6.9
reference: Revelation 6:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: fr
  text: Quand il ouvrit le cinquième sceau, je vis sous l’autel les âmes de ceux qui avaient été égorgés[a] à cause de la parole de Dieu et à cause du témoignage[b] qu’ils portaient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mis à mort ». Le verbe grec évoque plus précisément une mise à mort violente et peut avoir ici une résonance sacrificielle.
    reason: lexical_alternative
  - marker: b
    text: Ou « témoignage rendu », voire « fait d’être témoins ». Le terme grec peut désigner aussi bien le témoignage porté que l’activité ou la qualité de témoin.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: ouvrit
  rationale: Rend directement l’aoriste de ἀνοίγω et convient à la formule répétée de l’ouverture des sceaux dans l’Apocalypse.
- source_word: σφραγῖδα
  choice: sceau
  rationale: Terme français courant et précis pour l’objet symbolique de la vision apocalyptique.
- source_word: ὑποκάτω τοῦ θυσιαστηρίου
  choice: sous l’autel
  rationale: Rend simplement la relation spatiale tout en conservant intacte l’imagerie sacrificielle.
- source_word: ψυχὰς
  choice: âmes
  rationale: Préserve la forme particulière de la vision, où Jean voit les morts sous l’autel, sans transformer le terme en « vies » ou en « personnes ».
- source_word: ἐσφαγμένων
  choice: égorgés
  rationale: σφάζω désigne une mise à mort violente et porte souvent une résonance sacrificielle dans l’Apocalypse. « Égorgés » conserve cette force mieux que le terme générique « tués ».
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: à cause de la parole de Dieu
  rationale: διά avec l’accusatif exprime ici la cause; cette formulation française est claire et ne suggère pas simplement un but ou un bénéficiaire.
- source_word: μαρτυρίαν
  choice: témoignage
  rationale: « Témoignage » conserve la portée déclarative et confessionnelle de μαρτυρία, tout en laissant ouverte la nuance possible de « témoignage rendu » ou de « fait d’être témoin ».
- source_word: ἣν εἶχον
  choice: qu’ils portaient
  rationale: Formulation française naturelle qui reste proche de l’idée d’un témoignage qu’ils avaient et maintenaient, sans expliciter davantage son contenu.
theological_decisions:
- issue: Nature des ψυχὰς dans la scène visionnaire
  choice: Traduire par « les âmes » dans le texte principal.
  alternative: « les vies » ou « les personnes »
  rationale: « Âmes » respecte l’imagerie propre à la vision sans imposer une anthropologie complète ni réduire les martyrs à une simple désignation collective.
- issue: Force sacrificielle de ἐσφαγμένων
  choice: Employer « avaient été égorgés ».
  alternative: « avaient été mis à mort » ou « avaient été tués »
  rationale: Le verbe grec est plus fort qu’un simple verbe signifiant tuer et fait écho à l’autel ainsi qu’à l’imagerie sacrificielle de l’Apocalypse.
- issue: Portée de μαρτυρία
  choice: Conserver « témoignage » sans préciser s’il s’agit principalement de leur confession, de leur proclamation ou de leur qualité de témoins.
  alternative: « témoignage rendu » ou « fait d’être témoins »
  rationale: Le grec permet ces nuances; le texte principal ne doit pas en privilégier une de manière exclusive.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du mouvement de la phrase grecque, tandis que « qu’ils portaient » évite le tour peu naturel « qu’ils avaient » en français. Les répétitions de « à cause de » sont conservées pour refléter les deux constructions parallèles avec διά.
