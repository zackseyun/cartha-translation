id: REV.6.1
reference: Revelation 6:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: fr
  text: 'Je vis, lorsque l’Agneau ouvrit l’un des sept sceaux, l’un des quatre êtres vivants dire d’une voix pareille au tonnerre : « Viens ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Va ! », si l’ordre est compris comme adressé au cavalier plutôt qu’à Jean.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: l’Agneau
  rationale: Dans l’Apocalypse, ce diminutif grec fonctionne comme un titre christologique. « L’Agneau » est la formulation française consacrée et naturelle, sans ajouter une nuance de petitesse qui n’est pas pertinente ici.
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: l’un des sept sceaux
  rationale: Cette tournure partitive désigne un seul sceau parmi les sept. La formulation retenue est idiomatique en français et respecte précisément ce sens.
- source_word: ζῴων
  choice: êtres vivants
  rationale: Dans ce contexte, le mot désigne les êtres célestes qui entourent le trône, et non des animaux ordinaires. « Êtres vivants » évite une association zoologique trompeuse.
- source_word: ὡς φωνῇ βροντῆς
  choice: d’une voix pareille au tonnerre
  rationale: Cette formulation française naturelle conserve explicitement la comparaison entre la voix et le tonnerre.
- source_word: Ἔρχου
  choice: Viens !
  rationale: L’impératif signifie le plus directement « viens ». Le grec ne nomme pas explicitement le destinataire ; la traduction principale demeure donc simple et ouverte, tandis que l’interprétation concurrente est signalée en note.
- source_word: ὅτε ἤνοιξεν
  choice: ouvrir
  rationale: Dans la construction française « je vis l’Agneau ouvrir », l’infinitif rend naturellement la proposition temporelle grecque sans modifier la relation entre la vision et l’ouverture du sceau.
- source_word: εἶδον
  choice: je vis
  rationale: Rendu narratif direct de l’aoriste, sans ajouter une idée de regard qui n’est pas exprimée.
- source_word: ἤκουσα
  choice: j’entendis
  rationale: Le passé simple convient au registre narratif soutenu mais accessible de l’Apocalypse.
- source_word: λέγοντος
  choice: dire
  rationale: L’infinitif après « entendre » rend naturellement le participe grec, sans préciser indûment la manière de parler.
theological_decisions:
- issue: Destinataire et portée de l’impératif Ἔρχου
  choice: « Viens ! », sans identifier le destinataire dans le texte principal
  alternative: « Va ! » ou « Pars ! », si l’ordre s’adresse au cavalier
  rationale: Le grec porte simplement l’impératif « viens » et ne désigne pas expressément son destinataire. Le texte principal conserve cette indétermination, tandis que la note présente l’autre compréhension sans l’imposer.
translation_notes:
  register: Français international moderne, digne et fluide. Le passé simple maintient le ton narratif littéraire sans archaïsme. « Êtres vivants » est clair pour le lecteur courant et adapté au contexte céleste. La note est placée après l’impératif auquel elle se rapporte.
