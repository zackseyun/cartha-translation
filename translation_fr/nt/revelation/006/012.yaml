id: REV.6.12
reference: Revelation 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: fr
  text: 'Et je vis lorsqu’il ouvrit le sixième sceau : il se produisit un grand tremblement de terre ; le soleil devint noir comme une toile de sac faite de poils[a], et la lune tout entière devint comme du sang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme une étoffe grossière faite de poils ». Cette expression désigne une toile de sac rugueuse fabriquée avec des poils, traditionnellement associée au deuil.'
    reason: Préciser le sens concret de σάκκος τρίχινος et signaler une autre formulation possible en français.
lexical_decisions:
- source_word: εἶδον
  choice: je vis
  rationale: L’aoriste de ὁράω introduit ici la perception visionnaire de Jean ; « je vis » est direct, naturel et conforme au registre narratif de l’Apocalypse.
- source_word: ὅτε ἤνοιξεν
  choice: lorsqu’il ouvrit
  rationale: « Lorsqu’il » rend clairement la relation temporelle exprimée par ὅτε, tandis que « ouvrit » conserve le sens normal de ἀνοίγω dans le contexte des sceaux.
- source_word: τὴν σφραγῖδα τὴν ἕκτην
  choice: le sixième sceau
  rationale: Formulation française idiomatique qui rend explicitement le nom et l’adjectif ordinal grecs.
- source_word: σεισμὸς μέγας ἐγένετο
  choice: il se produisit un grand tremblement de terre
  rationale: σεισμός désigne naturellement ici un tremblement de terre ; « il se produisit » conserve la valeur événementielle de ἐγένετο dans un français soutenu mais courant.
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: le soleil devint noir
  rationale: μέλας signifie précisément « noir », et « devint » restitue le changement exprimé par ἐγένετο.
- source_word: ὡς σάκκος τρίχινος
  choice: comme une toile de sac faite de poils
  rationale: La formulation rend à la fois σάκκος, une étoffe grossière de type toile de sac, et τρίχινος, « fait de poils », sans préciser arbitrairement l’animal dont ils proviennent.
- source_word: ἡ σελήνη ὅλη
  choice: la lune tout entière
  rationale: Cette tournure française naturelle préserve l’insistance de ὅλη sur la totalité de la lune.
- source_word: ἐγένετο ὡς αἷμα
  choice: devint comme du sang
  rationale: « Comme » maintient explicitement la comparaison introduite par ὡς, sans transformer l’image en identité littérale.
theological_decisions:
- issue: Nature des signes cosmiques
  choice: Présenter directement les phénomènes visionnaires au moyen des comparaisons du texte, sans déterminer s’ils sont littéraux, symboliques, ou les deux.
  alternative: Interpréter explicitement ces signes soit comme une catastrophe astronomique littérale, soit comme des symboles de jugement divin ou de bouleversements politiques.
  rationale: Le grec décrit des images apocalyptiques saisissantes, mais ne tranche pas dans ce verset leur mode précis d’accomplissement. La traduction conserve donc cette tension interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation structure la longue succession grecque sans effacer son rythme cumulatif. Le marqueur de note est placé immédiatement après l’expression qu’il explique.
