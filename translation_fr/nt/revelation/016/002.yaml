  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: fr
  text: Le premier partit et versa sa coupe sur la terre. Alors, une plaie grave et terrible[a] atteignit les personnes qui portaient la marque de la bête et qui se prosternaient devant son image.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « une plaie mauvaise et maligne ». Le grec emploie deux adjectifs fortement négatifs, κακόν et πονηρόν, pour souligner la gravité et le caractère nuisible du fléau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: partit
  rationale: L’aoriste de ἀπέρχομαι fait avancer le récit. « Partit » exprime naturellement le déplacement sans lui ajouter d’emphase.
- source_word: ὁ πρῶτος
  choice: le premier
  rationale: L’adjectif substantivé renvoie au premier des sept anges mentionnés dans le contexte. La traduction n’ajoute pas « ange » au texte.
- source_word: ἐξέχεεν
  choice: versa
  rationale: ἐκχέω désigne ici l’action de verser le contenu de la coupe; « versa » est idiomatique et convient à la formule répétée du chapitre.
- source_word: φιάλην
  choice: coupe
  rationale: φιάλη désigne un récipient large et peu profond. « Coupe » est le terme français courant dans ce contexte apocalyptique et évite l’image moderne trompeuse d’une fiole.
- source_word: εἰς τὴν γῆν
  choice: sur la terre
  rationale: La préposition εἰς indique ici la terre comme destination du contenu versé. « Sur la terre » est naturel en français et garde la portée possible de γῆ sans la réduire à un territoire particulier.
- source_word: ἐγένετο … ἐπὶ
  choice: atteignit
  rationale: La construction décrit l’apparition de la plaie sur les personnes visées. « Atteignit » rend naturellement en français le résultat de l’action, sans préciser un mécanisme absent du grec.
- source_word: ἕλκος
  choice: plaie
  rationale: ἕλκος désigne une lésion ou un ulcère. « Plaie » est clair pour un large lectorat et ne donne pas au terme une précision clinique excessive.
- source_word: κακὸν καὶ πονηρὸν
  choice: mauvaise et douloureuse
  rationale: Les deux adjectifs fortement négatifs intensifient la gravité de la plaie. « Mauvaise » garde la portée générale de κακόν, tandis que « douloureuse » exprime ici le caractère pénible et nocif de πονηρόν sans attribuer une culpabilité morale à la plaie.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: les gens
  rationale: ἄνθρωποι désigne ici les êtres humains concernés, sans distinction de sexe. « Les gens » est naturel, actuel et inclusif en français.
- source_word: τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου
  choice: qui portaient la marque de la bête
  rationale: « Porter une marque » est plus idiomatique que « avoir une marque » en français tout en exprimant clairement la possession signalée par ἔχοντας.
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: qui se prosternaient devant son image
  rationale: προσκυνέω décrit un geste de prosternation exprimant l’adoration ou l’hommage. Cette formulation conserve à la fois le geste concret et sa portée cultuelle.
theological_decisions:
- issue: Les deux adjectifs κακὸν καὶ πονηρὸν appliqués à la plaie
  choice: « une plaie mauvaise et douloureuse »
  alternative: « une plaie mauvaise et maligne »; « un ulcère pénible et douloureux »
  rationale: Le grec juxtapose deux adjectifs proches pour renforcer la sévérité du fléau. La traduction maintient les deux qualificatifs sans transformer la description physique en jugement moral sur la plaie.
- issue: L’étendue des personnes frappées
  choice: La plaie atteint précisément ceux qui portent la marque de la bête et se prosternent devant son image.
  alternative: Formulation générale qui ferait porter le fléau sur toute l’humanité.
  rationale: Les deux participes grecs délimitent explicitement le groupe atteint. La traduction conserve cette restriction et le lien entre allégeance à la bête et jugement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste fluide, « le premier » conserve l’ellipse du grec, et « se prosternaient devant » rend concrètement le langage cultuel sans introduire d’interprétation confessionnelle.
