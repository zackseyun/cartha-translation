revisions:
- from: Le premier partit et versa sa coupe sur la terre. Alors, une plaie mauvaise et douloureuse[a] atteignit les gens qui portaient la marque de la bête et qui se prosternaient devant son image.
  to: Le premier partit et versa sa coupe sur la terre. Alors, une plaie grave et terrible[a] atteignit les personnes qui portaient la marque de la bête et qui se prosternaient devant son image.
  rationale: La révision remplace la spécification non explicite de la douleur par deux qualificatifs français qui expriment la gravité et l’intensification négative du grec sans attribuer à la plaie une douleur particulière ni une portée morale. Elle relève aussi légèrement le registre de « les gens » à « les personnes ».
  reviewer_model: gpt-5.6-terra
