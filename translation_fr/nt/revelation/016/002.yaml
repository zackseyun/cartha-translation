review_pass:
  verdict: revise
  source_fidelity: Révision nécessaire, surtout pour les deux adjectifs qualifiant la plaie. « Douloureuse » ajoute l’idée spécifique de douleur, qui n’est pas exprimée de façon nette par πονηρόν. Le grec décrit une plaie doublement négative, nocive et terrible, sans en préciser le symptôme. Le reste rend fidèlement la séquence narrative, la coupe versée sur la terre et le groupe limité aux porteurs de la marque qui se prosternent devant l’image.
  naturalness: Le texte est fluide et intelligible. « Les gens » est toutefois relativement familier pour le registre visionnaire et solennel de l’Apocalypse; « les personnes » est plus neutre et international. « Une plaie grave et terrible » est idiomatique, soutenu sans être archaïque, et reproduit l’intensification des deux adjectifs.
  terminology: « Coupe », « terre », « marque de la bête » et « image » sont appropriés et cohérents avec le vocabulaire de l’Apocalypse. « Se prosternaient devant son image » rend utilement προσκυνοῦντας sans réduire le terme à une adhésion purement abstraite. La note doit éviter de présenter « douloureuse » comme une alternative privilégiée, puisque cette nuance va au-delà du grec.
  issues:
  - severity: medium
    issue: « douloureuse » pour πονηρόν
    rationale: πονῆρος, associé à κακός, renforce le caractère mauvais, nuisible ou redoutable de la plaie; il ne désigne pas spécifiquement la douleur. « Douloureuse » restreint indûment le sens.
  - severity: low
    issue: « les gens »
    rationale: La formule est naturelle mais légèrement conversationnelle dans ce contexte apocalyptique. « Les personnes » conserve la référence humaine générale de ἄνθρωποι dans un registre plus neutre.
