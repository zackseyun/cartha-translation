id: REV.16.11
reference: Revelation 16:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: fr
  text: Ils blasphémèrent le Dieu du ciel[a] à cause de leurs souffrances et de leurs plaies[b], et ils ne se repentirent pas de leurs œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dirent du mal du Dieu du ciel » ou « insultèrent le Dieu du ciel ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de leurs ulcères ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: blasphémèrent
  rationale: Le verbe désigne ici des paroles injurieuses et irrévérencieuses dirigées contre Dieu. « Blasphémèrent » en conserve la portée religieuse précise.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: le Dieu du ciel
  rationale: Cette formulation rend directement le titre biblique et en préserve le ton solennel et apocalyptique.
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: à cause de leurs souffrances
  rationale: Dans ce contexte, ἐκ a une valeur causale. « Souffrances » exprime naturellement les douleurs intenses évoquées sans suggérer le travail ou l'effort.
- source_word: ἑλκῶν
  choice: plaies
  rationale: Ἕλκος peut désigner une plaie ou un ulcère. « Plaies » est courant, clair et convient au contexte des fléaux sans précision médicale excessive.
- source_word: μετενόησαν
  choice: ne se détournèrent pas
  rationale: Avec ἐκ et les œuvres comme complément, le verbe exprime une repentance concrète, c'est-à-dire le fait de se détourner de sa conduite. Cette formulation naturelle rend explicitement la nuance de séparation portée par ἐκ.
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: de leurs œuvres
  rationale: « De leurs œuvres » conserve le terme biblique ἔργα et, après « se détournèrent », reflète directement le mouvement d'éloignement exprimé par ἐκ.
theological_decisions:
- issue: Valeur des trois emplois de ἐκ
  choice: Les deux premiers sont rendus causalement (« à cause de »), tandis que le dernier marque le fait de se détourner de ses œuvres.
  alternative: Rendre plus littéralement les premiers par « sous l'effet de » ou rendre μετενόησαν par « ne se repentirent pas de leurs œuvres ».
  rationale: Le contexte présente les souffrances et les plaies comme la cause du blasphème, tandis qu'avec μετανοέω le dernier ἐκ indique ce dont les personnes auraient dû se détourner. Cette distinction respecte l'usage grec sans harmoniser artificiellement les trois occurrences.
- issue: Expression de la repentance
  choice: « ne se détournèrent pas de leurs œuvres »
  alternative: « ne se repentirent pas de leurs œuvres »
  rationale: Le choix principal préserve ensemble le sens moral et religieux de μετανοέω et la force séparative de ἐκ, sans réduire la repentance à un simple changement d'avis.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple convient au récit visionnaire et maintient un ton biblique soutenu sans archaïsme. « Œuvres » conserve une résonance biblique, tandis que les notes signalent les principales possibilités lexicales.
