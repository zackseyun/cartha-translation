  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: fr
  text: Le troisième versa sa coupe dans les fleuves et les sources d’eau, et elles devinrent du sang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: le troisième
  rationale: Le grec conserve l’ellipse du nom, aisément compris d’après le contexte immédiat; le français peut la reproduire naturellement sans ajouter « ange ».
- source_word: ἐξέχεεν
  choice: versa
  rationale: Le verbe ἐκχέω désigne ici l’action de verser le contenu de la coupe; « versa » est naturel et précis en français.
- source_word: φιάλην
  choice: coupe
  rationale: φιάλη désigne un récipient large et peu profond. « Coupe » est le terme français courant dans ce contexte apocalyptique et évite l’inexactitude de « fiole ».
- source_word: εἰς τοὺς ποταμούς
  choice: dans les fleuves
  rationale: εἰς avec l’accusatif exprime le mouvement vers l’intérieur ou dans le domaine visé; « dans » convient idiomatiquement.
- source_word: πηγὰς τῶν ὑδάτων
  choice: les sources d’eau
  rationale: πηγή signifie « source » ou « fontaine »; « sources d’eau » rend simplement le groupe génitival sans archaïsme.
- source_word: ἐγένετο αἷμα
  choice: tout devint du sang
  rationale: Le singulier grec présente collectivement le résultat affectant les eaux mentionnées. « Tout » conserve cette valeur récapitulative et évite d’imposer soit un antécédent pluriel explicite, soit un pronom singulier français ambigu.
theological_decisions:
- issue: Sujet implicite de ἐγένετο
  choice: Le résultat est formulé collectivement par « tout devint du sang »
  alternative: « elles devinrent du sang » (les eaux des fleuves et des sources) ou « cela devint du sang »
  rationale: Le grec emploie un verbe singulier sans sujet nominal exprimé après deux réalités coordonnées. La traduction collective préserve cette tension grammaticale tout en communiquant clairement la transformation, sans trancher plus que le texte.
translation_notes:
  register: Français international moderne, sobre et digne. L’ellipse « le troisième » est conservée; « tout » permet une lecture naturelle tout en respectant le singulier récapitulatif du grec.
