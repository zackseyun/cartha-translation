id: REV.16.17
reference: Revelation 16:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: fr
  text: 'Le septième versa sa coupe dans l’air, et une voix forte sortit du sanctuaire[a], venant du trône. Elle disait : « C’est fait[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du temple ». Le mot grec ναός désigne plus précisément le sanctuaire que l’ensemble du complexe du temple.
    reason: lexical_alternative
  - marker: b
    text: Ou « Cela s’est accompli ! »
    reason: alternative_rendering
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: le septième
  rationale: Le grec emploie uniquement l’adjectif ordinal substantivé. Le contexte désigne le septième ange, mais le texte ne répète pas le mot « ange » ; l’ellipse est donc conservée.
- source_word: ἐξέχεεν
  choice: versa
  rationale: « Verser » rend naturellement ἐκχέω dans la formule répétée des coupes du jugement et convient à l’action ponctuelle décrite.
- source_word: φιάλην
  choice: coupe
  rationale: « Coupe » est l’équivalent français moderne usuel pour ce récipient large et peu profond ; il évite l’archaïsme et le sens moderne trompeur de « fiole ».
- source_word: ἐπὶ τὸν ἀέρα
  choice: dans l’air
  rationale: Après un verbe exprimant l’action de verser, « dans l’air » rend naturellement ἐπί avec l’accusatif, sans le littéralisme peu idiomatique « sur l’air ».
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: une voix forte sortit
  rationale: « Voix forte » exprime naturellement l’intensité de φωνὴ μεγάλη, tandis que « sortit » conserve le mouvement exprimé par ἐξῆλθεν.
- source_word: ἐκ τοῦ ναοῦ
  choice: du sanctuaire
  rationale: ναός désigne plus précisément le sanctuaire que l’ensemble plus vaste du temple. Ce choix préserve cette précision dans la scène céleste.
- source_word: ἀπὸ τοῦ θρόνου
  choice: venant du trône
  rationale: Cette formulation conserve la seconde indication de provenance sans la confondre avec la sortie hors du sanctuaire.
- source_word: λέγουσα
  choice: Elle disait
  rationale: Le participe féminin se rapporte à « voix ». Une proposition indépendante est naturelle en français et maintient clairement ce lien grammatical.
- source_word: Γέγονεν
  choice: C’est fait !
  rationale: Cette formule française brève et solennelle exprime l’état d’achèvement résultant du parfait de γίνομαι, sans préciser au-delà du texte ce qui est achevé.
theological_decisions:
- issue: Sens de ναός dans l’imagerie céleste de l’Apocalypse
  choice: sanctuaire
  alternative: temple
  rationale: Le choix est lexical plutôt que doctrinal. « Sanctuaire » conserve la distinction entre ναός, qui vise le lieu sacré proprement dit, et un terme pouvant désigner tout le complexe du temple.
- issue: Portée de Γέγονεν
  choice: C’est fait !
  alternative: Cela s’est accompli !
  rationale: La formule principale traduit la valeur résultative du parfait et l’annonce culminante, sans déterminer explicitement la nature de l’événement achevé. L’autre traduction possible est signalée afin de préserver la nuance d’accomplissement.
translation_notes:
  register: Français international moderne, sobre et solennel. L’ellipse « le septième » est conservée comme en grec. La ponctuation sépare les deux indications de provenance et évite une phrase française excessivement lourde.
