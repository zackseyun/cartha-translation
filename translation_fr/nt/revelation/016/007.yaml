source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: fr
  text: 'Et j’entendis l’autel dire[a] : « Oui, Seigneur Dieu, le Tout-Puissant, tes jugements sont vrais et justes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « j’entendis une parole venant de l’autel ». Le génitif grec peut indiquer la source de ce que Jean entend, bien que la tournure présente le plus naturellement l’autel lui-même comme parlant.'
    reason: alternative lexicale et ambiguïté syntaxique
lexical_decisions:
- source_word: ἤκουσα
  choice: j’entendis
  rationale: L’aoriste de ἀκούω présente un événement ponctuel. Le passé simple convient au registre narratif soutenu de l’Apocalypse sans suggérer l’attention volontaire qu’impliquerait « j’écoutai ».
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: l’autel dire
  rationale: La construction au génitif avec ἤκουσα peut signaler la source entendue, mais le participe λέγοντος présente le plus naturellement l’autel comme parlant. Cette formulation conserve la personnification vive du texte sans ajouter le mot « voix ».
- source_word: Ναί
  choice: Oui
  rationale: Ναί est une affirmation forte. « Oui » en conserve clairement la valeur responsive en français moderne.
- source_word: κύριε, ὁ θεός
  choice: Seigneur Dieu
  rationale: Les deux désignations sont conservées dans l’adresse directe. « Seigneur Dieu » est naturel, digne et n’exige pas l’ajout d’une interjection absente du grec.
- source_word: ὁ παντοκράτωρ
  choice: le Tout-Puissant
  rationale: « Le Tout-Puissant » est l’équivalent français traditionnel et actuel qui exprime la souveraineté et la puissance universelles, tout en reflétant l’article grec.
- source_word: ἀληθιναὶ
  choice: vrais
  rationale: Avec « jugements », « vrais » exprime leur conformité à la vérité et leur fiabilité sans réduire le terme à la seule sincérité.
- source_word: δίκαιαι
  choice: justes
  rationale: « Justes » rend naturellement la portée judiciaire et morale de δίκαιαι dans ce contexte.
- source_word: αἱ κρίσεις σου
  choice: tes jugements
  rationale: « Tes jugements » conserve le registre judiciaire, la concision et la portée potentiellement large de κρίσεις, sans expliciter indûment condamnations ou décisions particulières.
theological_decisions:
- issue: Personnification de l’autel comme locuteur
  choice: « j’entendis l’autel dire »
  alternative: « j’entendis, venant de l’autel, quelqu’un dire » ou « j’entendis une voix venant de l’autel »
  rationale: Le grec nomme l’autel dans une construction liée au verbe « entendre » et lui associe le participe « disant ». Garder l’autel comme locuteur respecte au mieux l’image apocalyptique et évite d’ajouter une « voix » non exprimée.
- issue: Forme des titres divins dans l’adresse directe
  choice: « Seigneur Dieu, le Tout-Puissant »
  alternative: « Seigneur, Dieu Tout-Puissant »
  rationale: La formulation retenue préserve les trois éléments grecs — Seigneur, Dieu et le Tout-Puissant — ainsi que la valeur appositionnelle et l’article devant παντοκράτωρ, sans les fondre en un seul titre.
- issue: Ordre prédicatif des adjectifs
  choice: « tes jugements sont vrais et justes »
  alternative: « vrais et justes sont tes jugements »
  rationale: L’ordre français naturel clarifie la prédication sans modifier l’affirmation théologique ni diminuer l’accent porté par le grec sur les qualités des jugements divins.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple maintient le ton narratif biblique sans archaïsme lexical marqué. La personnification de l’autel et la série complète des titres divins sont conservées.
