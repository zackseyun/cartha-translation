id: REV.16.8
reference: Revelation 16:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: fr
  text: Le quatrième versa sa coupe sur le soleil, et il lui fut donné de brûler les êtres humains par le feu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le feu ». Le pronom « lui » renvoie probablement au soleil; le grec ne l’explicite pas.'
    reason: Préserver la formulation littérale de ἐν πυρί et signaler, sans la trancher, l’ambiguïté du référent de αὐτῷ.
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: le quatrième
  rationale: L’adjectif substantivé renvoie au quatrième ange de la série, sans que le nom « ange » soit répété dans ce verset.
- source_word: ἐξέχεεν
  choice: versa
  rationale: « Verser » est le terme naturel et précis dans le contexte des coupes du jugement en Apocalypse 16.
- source_word: φιάλην
  choice: coupe
  rationale: « Coupe » rend naturellement le récipient large désigné par φιάλη et conserve l’imagerie cultuelle et judiciaire de l’Apocalypse.
- source_word: ἐπὶ τὸν ἥλιον
  choice: sur le soleil
  rationale: ἐπί avec l’accusatif désigne ici la cible sur laquelle la coupe est versée.
- source_word: ἐδόθη αὐτῷ
  choice: il fut donné à celui-ci
  rationale: Cette formulation conserve le passif sans nommer celui qui accorde ce pouvoir. « Celui-ci » renvoie naturellement au soleil, antécédent grammatical le plus proche, tout en évitant une répétition lourde.
- source_word: καυματίσαι
  choice: de brûler
  rationale: Dans ce contexte de chaleur solaire et de feu, « brûler » exprime clairement l’action causative de καυματίζω; « brûler gravement » au verset suivant peut ensuite rendre l’intensification exprimée par le nom et l’adjectif.
- source_word: τοὺς ἀνθρώπους
  choice: les êtres humains
  rationale: Le terme désigne les humains de manière générique, sans restriction au sexe masculin; cette expression est précise et digne en français moderne.
- source_word: ἐν πυρί
  choice: par le feu
  rationale: La préposition ἐν peut ici indiquer le moyen ou la manière. « Par le feu » est naturel en français et conserve explicitement l’image du feu.
theological_decisions:
- issue: Agent implicite dans ἐδόθη
  choice: Conserver le passif « il fut donné » sans nommer Dieu.
  alternative: « Dieu lui donna le pouvoir » ou « il lui fut permis »
  rationale: Le passif laisse l’auteur de l’autorisation inexprimé, comme le grec, et préserve la souveraineté implicite sans ajouter « Dieu », « pouvoir » ou une simple notion de permission.
- issue: Référent de αὐτῷ
  choice: Faire renvoyer « celui-ci » au soleil.
  alternative: Le quatrième ange ou un agent non précisé
  rationale: « Le soleil » est l’antécédent grammatical le plus proche, et la fonction de brûler les humains correspond directement au rôle du soleil dans cette scène.
- issue: Portée générique de ἀνθρώπους
  choice: Employer « les êtres humains ».
  alternative: « les hommes » ou « l’humanité »
  rationale: Le grec vise collectivement des personnes humaines, non les seuls hommes; « les êtres humains » conserve en outre le pluriel défini du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe légèrement solennelle « il fut donné à celui-ci » conserve le passif théologique et la tension du grec sans explicitation interprétative. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
