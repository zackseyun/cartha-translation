id: REV.16.21
reference: Revelation 16:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: fr
  text: Et une grêle énorme, avec des grêlons d’environ un talent, tombe du ciel sur les humains. Ceux-ci blasphémèrent Dieu à cause du fléau de la grêle, car son fléau est extrêmement grave[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Autre traduction possible : « car son fléau est très grand ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: une grêle énorme
  rationale: Le singulier collectif grec est conservé par « grêle », tandis que « énorme » exprime son caractère exceptionnel sans imposer dès l’abord le pluriel « grêlons ».
- source_word: ὡς ταλαντιαία
  choice: dont chaque grêlon pesait environ un talent
  rationale: La formulation rend explicite le poids individuel impliqué par l’adjectif et préserve l’approximation portée par ὡς. Le talent est maintenu comme unité antique, avec une note explicative.
- source_word: καταβαίνει
  choice: tombe
  rationale: Le présent grec, vif dans ce récit visionnaire, est conservé. Pour la grêle, « tombe du ciel » est plus naturel en français que « descend ».
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: « Ciel » conserve à la fois le sens spatial et la résonance apocalyptique de οὐρανός.
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: sur les humains
  rationale: ἄνθρωποι désigne ici les êtres humains en général. « Les humains » est inclusif, précis et évite le masculin potentiellement ambigu de « les hommes ».
- source_word: ἐβλασφήμησαν
  choice: blasphémèrent
  rationale: Le terme français correspond directement au verbe grec lorsqu’il a Dieu pour objet et en conserve la gravité théologique.
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: à cause du fléau de la grêle
  rationale: ἐκ a ici une valeur causale. « Fléau » convient au vocabulaire des jugements de l’Apocalypse et évite de réduire πληγή à un simple coup physique.
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: car ce fléau était extrêmement terrible
  rationale: La formulation transmet l’intensification μεγάλη…σφόδρα dans un français naturel. « Ce fléau » explicite le référent de αὐτῆς sans changer le sens.
theological_decisions:
- issue: Sens de οὐρανός dans cette scène de jugement apocalyptique
  choice: du ciel
  alternative: du firmament / du ciel atmosphérique
  rationale: « Du ciel » garde ouverte la dimension à la fois atmosphérique et théologique du texte, sans préciser indûment l’une au détriment de l’autre.
- issue: Portée générique de ἄνθρωποι
  choice: les humains
  alternative: les hommes
  rationale: Le grec vise les êtres humains sans distinction de sexe. La traduction choisie rend cette portée générique explicitement.
- issue: Valeur de πληγή
  choice: fléau
  alternative: plaie / coup
  rationale: Dans l’Apocalypse, πληγή désigne fréquemment un malheur infligé comme jugement. « Fléau » préserve ce sens tout en restant naturel en français.
translation_notes:
  register: Français international moderne, digne et accessible. Le verset conserve le présent vif de « tombe », puis l’aoriste narratif par le passé simple « blasphémèrent ». « Talent » est maintenu afin de ne pas substituer une équivalence moderne faussement précise.
