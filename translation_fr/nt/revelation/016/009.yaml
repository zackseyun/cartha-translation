id: REV.16.9
reference: Revelation 16:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: fr
  text: Les gens furent brûlés par une chaleur intense et ils blasphémèrent le nom de Dieu, qui a autorité sur ces fléaux. Mais ils ne se repentirent pas pour lui rendre gloire.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: furent brûlés
  rationale: Le passif aoriste indique qu’ils subirent l’action d’une chaleur brûlante. « Furent brûlés » est naturel en français et n’implique pas nécessairement une combustion totale.
- source_word: οἱ ἄνθρωποι
  choice: les gens
  rationale: Dans ce contexte, le masculin pluriel désigne les êtres humains en général, non les hommes de sexe masculin en particulier.
- source_word: καῦμα μέγα
  choice: par une chaleur intense
  rationale: L’expression indique la cause ou le moyen de la brûlure; « intense » rend naturellement la gravité exprimée par μέγα.
- source_word: ἐβλασφήμησαν
  choice: blasphémèrent
  rationale: Lorsque le verbe a pour objet le nom de Dieu, « blasphémer » conserve exactement sa portée religieuse.
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: le nom de Dieu
  rationale: Cette formulation proche du grec préserve l’idiome biblique associant le nom à l’identité et à l’honneur de Dieu.
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: qui a autorité sur ces fléaux
  rationale: Le participe présent ἔχοντος présente Dieu comme possédant l’autorité, et ἐξουσία exprime ici l’autorité ou le pouvoir légitime.
- source_word: πληγὰς
  choice: fléaux
  rationale: Dans l’Apocalypse, πληγή désigne régulièrement des fléaux de jugement et évoque les fléaux de l’Exode.
- source_word: οὐ μετενόησαν
  choice: ils ne se repentirent pas
  rationale: Dans ce contexte de jugement, μετανοέω exprime la repentance morale et spirituelle, et non une simple révision d’opinion.
- source_word: δοῦναι αὐτῷ δόξαν
  choice: pour lui rendre gloire
  rationale: Cette tournure française naturelle conserve l’idiome biblique de donner ou rendre gloire à Dieu; l’infinitif précise ce à quoi leur repentance aurait dû conduire.
theological_decisions:
- issue: Portée de οἱ ἄνθρωποι
  choice: référence inclusive à l’humanité (« les gens »)
  alternative: « les hommes »
  rationale: Le contexte vise les êtres humains frappés par le jugement sans limiter le propos aux personnes de sexe masculin.
- issue: Autorité divine sur les fléaux
  choice: Dieu est explicitement présenté comme ayant autorité sur ces fléaux
  alternative: Dieu serait seulement associé aux fléaux
  rationale: Le grec attribue directement à Dieu ἐξουσία sur les fléaux; la traduction maintient cette affirmation sans l’atténuer ni l’amplifier.
- issue: Rapport entre repentance et glorification
  choice: « pour lui rendre gloire » exprime l’orientation attendue de la repentance
  alternative: « de sorte qu’ils lui rendent gloire »
  rationale: L’infinitif δοῦναι peut exprimer le contenu, le but ou le résultat lié à la repentance. La formulation française conserve cette relation sans la définir plus précisément que le contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique. « Mais » au début de la dernière proposition rend naturellement le contraste porté par le second καί sans modifier le sens.
