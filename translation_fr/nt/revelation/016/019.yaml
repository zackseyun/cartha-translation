id: REV.16.19
reference: Revelation 16:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: fr
  text: La grande ville fut divisée en trois parties, et les villes des nations tombèrent. Dieu se souvint[a] de Babylone la grande, afin de lui donner la coupe du vin de la fureur de sa colère.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Babylone la grande vint en mémoire devant Dieu. » Cette expression biblique indique ici que Dieu porte son attention sur elle en vue du jugement.'
    reason: Alternative lexicale et explication de l’idiome biblique ἐμνήσθη ἐνώπιον τοῦ θεοῦ.
lexical_decisions:
- source_word: ἐγένετο … εἰς τρία μέρη
  choice: fut divisée en trois parties
  rationale: La construction décrit l’état résultant de la ville, qui se retrouve en trois parties. « Fut divisée » l’exprime clairement en français sans préciser la cause de la division.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: la grande ville
  rationale: Rendu direct qui conserve l’image urbaine et la désignation apocalyptique.
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: les villes des nations
  rationale: Dans ce contexte de jugement universel, « nations » rend naturellement ἔθνη sans limiter le terme aux non-Juifs.
- source_word: ἔπεσαν
  choice: tombèrent
  rationale: Le verbe simple et évocateur conserve l’imagerie apocalyptique sans expliciter « s’effondrèrent ».
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babylone la Grande
  rationale: Cette forme préserve le titre emphatique récurrent de l’Apocalypse.
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: Dieu se souvint de
  rationale: Cette formulation idiomatique et naturelle en français exprime que Babylone vient à la mémoire de Dieu, tout en laissant le contexte préciser qu’il s’agit d’un souvenir en vue du jugement. Une note conserve la forme plus littérale.
- source_word: δοῦναι αὐτῇ
  choice: afin de lui donner
  rationale: « Afin de » explicite la valeur finale de l’infinitif tout en restant proche de la syntaxe grecque.
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: la coupe du vin
  rationale: Le génitif et la métaphore biblique de la coupe comme part assignée sont conservés.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: de la fureur de sa colère
  rationale: « Fureur » et « colère » distinguent les deux termes grecs apparentés, θυμός et ὀργή, et maintiennent leur intensification rhétorique.
theological_decisions:
- issue: L’idiome judiciaire ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: Dieu se souvint de Babylone la Grande
  alternative: Babylone la Grande revint en mémoire devant Dieu
  rationale: 'La formulation retenue est naturelle en français et préserve l’idée biblique du souvenir divin. Elle n’ajoute pas explicitement « pour la juger » : la suite du verset communique elle-même cette portée judiciaire.'
- issue: La distinction entre θυμός et ὀργή
  choice: la fureur de sa colère
  alternative: son ardente colère
  rationale: Le choix maintient deux mots distincts, comme le grec, plutôt que de les fondre en une seule expression interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme bref et solennel ainsi que les images de la chute, de la coupe, du vin, de la fureur et de la colère sont conservés. Le marqueur [a] est placé sur l’expression qu’il explique.
