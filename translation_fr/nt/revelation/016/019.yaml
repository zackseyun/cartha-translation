  verdict: revise
  source_fidelity: 'Le sens général est fidèle au grec : la ville est divisée, les villes des nations tombent, puis Babylone est évoquée devant Dieu afin de recevoir la coupe du vin de la fureur de sa colère. « Dieu se souvint de » est une transposition française idiomatique acceptable de l’expression passive « Babylone fut rappelée devant Dieu », sans ajouter explicitement le jugement.'
  naturalness: Le français est fluide, moderne et conserve le registre solennel requis. « Babylone la grande » avec une minuscule à l’épithète suit l’usage typographique français habituel dans les désignations bibliques. La note doit être ancrée sur le verbe ou l’expression qu’elle éclaire, plutôt que sur le seul nom de Babylone.
  terminology: « grande ville », « nations », « coupe », « vin », « fureur » et « colère » rendent adéquatement les termes et l’imagerie. Le couple « fureur / colère » préserve utilement la succession θυμός / ὀργή. Le nom est rendu « Babylone la grande », forme française bibliquement usuelle.
  issues:
