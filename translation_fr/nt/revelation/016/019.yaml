    rationale: La note explique ἐμνήσθη ἐνώπιον τοῦ θεοῦ, non le nom propre. Déplacer le marqueur après « souvint » rend son référent immédiatement clair.
  - severity: low
    issue: Majuscule à « Grande » dans « Babylone la Grande ».
    rationale: 'Dans l’usage français courant des traductions bibliques, l’épithète descriptive de cette désignation s’écrit normalement en minuscule : « Babylone la grande ».'
  - severity: low
