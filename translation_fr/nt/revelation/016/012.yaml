id: REV.16.12
reference: Revelation 16:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: fr
  text: Le sixième versa sa coupe sur le grand fleuve, l’Euphrate. Son eau se dessécha, afin que soit préparé le chemin des rois qui viennent du côté où le soleil se lève[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus simplement : « de l’est ». Littéralement : « du lever du soleil ».'
    reason: L’expression grecque désigne l’est au moyen de l’image du lever du soleil ; la note donne à la fois son sens géographique courant et sa forme littérale.
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: le sixième
  rationale: L’article et l’ordinal renvoient au sixième porteur de coupe dans le contexte. Le grec ne répète pas « ange » ; l’ellipse est donc conservée.
- source_word: ἐξέχεεν
  choice: versa
  rationale: « Verser » rend naturellement l’action d’ἐκχέω et maintient l’image récurrente des coupes du jugement dans l’Apocalypse.
- source_word: φιάλην
  choice: coupe
  rationale: Dans ce contexte, φιάλη désigne un récipient large et peu profond. « Coupe » est clair et traditionnel en français moderne, contrairement à « fiole », qui évoquerait un petit flacon.
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: sur le grand fleuve, l’Euphrate
  rationale: Cette formulation conserve l’apposition grecque tout en employant une ponctuation française naturelle.
- source_word: ἐξηράνθη
  choice: se dessécha
  rationale: Le passif grec décrit l’assèchement de l’eau. Le verbe pronominal français rend naturellement l’événement sans préciser un agent que le verset ne nomme pas.
- source_word: τὸ ὕδωρ αὐτοῦ
  choice: son eau
  rationale: Le possessif renvoie sans ambiguïté au fleuve et reproduit sobrement la relation exprimée en grec.
- source_word: ἵνα ἑτοιμασθῇ
  choice: afin que soit préparé
  rationale: « Afin que » marque clairement le but, tandis que la tournure passive conserve la voix du grec.
- source_word: ἡ ὁδὸς τῶν βασιλέων
  choice: le chemin des rois
  rationale: « Chemin » garde la portée concrète et potentiellement symbolique d’ὁδός sans imposer une interprétation.
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: qui viennent du côté où le soleil se lève
  rationale: Cette formulation française actuelle conserve l’image explicite du lever du soleil et indique naturellement l’origine des rois, sans réduire directement l’expression à « l’est ».
theological_decisions:
- issue: Faut-il expliciter que « le sixième » est un ange ?
  choice: Conserver « le sixième » sans ajouter « ange ».
  alternative: « Le sixième ange »
  rationale: Le contexte identifie les porteurs des coupes comme des anges, mais le nom n’est pas présent dans ce verset. Le conserver sous-entendu respecte l’ellipse du texte grec.
- issue: Faut-il expliquer symboliquement l’assèchement de l’Euphrate et la venue des rois ?
  choice: Traduire directement les images sans les interpréter.
  alternative: Ajouter une explication relative à une invasion ou au rassemblement eschatologique.
  rationale: Le verset ne livre pas lui-même l’interprétation complète de ces images apocalyptiques. La traduction préserve donc leur tension et leur ouverture.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec sans devenir artificielle ; l’image apocalyptique du soleil levant est maintenue dans le texte principal.
