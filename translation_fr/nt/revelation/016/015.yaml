id: REV.16.15
reference: Revelation 16:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: fr
  text: « Voici, je viens comme un voleur. Heureux celui qui veille[a] et garde ses vêtements, afin qu’il ne marche pas nu et qu’on ne voie pas sa honte[b] — »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui reste éveillé » ou « qui se tient vigilant ».
    reason: lexical_alternative
  - marker: b
    text: Ou « son indécence »; le terme grec peut désigner une exposition honteuse.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Voici
  rationale: Interjection française naturelle qui attire solennellement l’attention et convient au registre apocalyptique.
- source_word: ἔρχομαι
  choice: je viens
  rationale: Le présent français conserve la vivacité du présent grec ainsi que sa portée imminente ou future dans le contexte.
- source_word: ὡς κλέπτης
  choice: comme un voleur
  rationale: Rend directement la comparaison et souligne le caractère inattendu de la venue sans suggérer une équivalence morale.
- source_word: μακάριος
  choice: Heureux
  rationale: Formule française consacrée des béatitudes, qui exprime une condition favorable accordée par Dieu plutôt qu’un simple état psychologique passager.
- source_word: ὁ γρηγορῶν
  choice: celui qui veille
  rationale: « Veiller » exprime à la fois le fait de rester éveillé et la vigilance métaphorique, tout en demeurant concis et naturel.
- source_word: τηρῶν
  choice: garde
  rationale: 'Le verbe conserve la latitude de τηρέω : garder, préserver ou ne pas laisser perdre ses vêtements.'
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: ses vêtements
  rationale: Terme courant mais digne, qui préserve l’image concrète et son éventuelle portée symbolique.
- source_word: ἵνα μὴ
  choice: afin que… ne… pas
  rationale: Conserve explicitement la valeur finale de la construction grecque négative.
- source_word: γυμνὸς περιπατῇ
  choice: qu’il ne marche pas nu
  rationale: Préserve l’image concrète de περιπατέω et l’exposition évoquée par γυμνός sans l’atténuer.
- source_word: βλέπωσιν
  choice: qu’on ne voie
  rationale: Le pronom indéfini « on » rend naturellement en français le sujet non précisé de la troisième personne du pluriel grec.
- source_word: τὴν ἀσχημοσύνην αὐτοῦ
  choice: sa honte
  rationale: « Honte » maintient à la fois l’idée d’exposition honteuse et celle de déshonneur, sans réduire le terme à la seule nudité.
theological_decisions:
- issue: Portée métaphorique des vêtements et de la nudité dans le contexte apocalyptique
  choice: Conserver les images concrètes des vêtements, de la nudité et de la honte sans les expliquer dans le corps du texte.
  alternative: Interpréter explicitement les vêtements comme la fidélité ou les œuvres justes, et la nudité comme la disgrâce eschatologique.
  rationale: Le contexte autorise une portée symbolique, mais le grec ne l’explicite pas ici. La traduction laisse donc intactes l’ambiguïté et la tension théologique.
- issue: Référence masculine singulière
  choice: Employer « celui » et le pronom masculin singulier « il ».
  alternative: Reformuler au pluriel ou neutraliser la référence.
  rationale: La construction grecque est au masculin singulier et possède une portée représentative. Le français peut la reproduire clairement sans modifier le nombre grammatical.
- issue: Sujet indéfini de βλέπωσιν
  choice: Employer « on » sans identifier ceux qui voient.
  alternative: Préciser « les autres », « les hommes » ou « tous ».
  rationale: Le grec laisse le sujet indéterminé; l’ajout d’un groupe précis imposerait une interprétation absente du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici » maintient la solennité de l’avertissement; « celui qui veille » est idiomatique tout en préservant le double sens concret et spirituel. Le tiret final est conservé pour refléter l’interruption ou l’insertion parenthétique dans le passage.
