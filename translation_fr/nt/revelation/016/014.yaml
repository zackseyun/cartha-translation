id: REV.16.14
reference: Revelation 16:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: fr
  text: Car ce sont des esprits de démons[a] qui accomplissent des signes et vont vers les rois du monde entier[b] afin de les rassembler pour le combat du grand jour de Dieu le Tout-Puissant —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des esprits démoniaques ».
    reason: lexical_alternative
  - marker: b
    text: Ou « du monde habité tout entier ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: des esprits de démons
  rationale: Cette formulation conserve le rapport génitif du grec sans trancher entre origine et caractérisation; elle reste claire en français actuel.
- source_word: ποιοῦντα σημεῖα
  choice: qui accomplissent des signes
  rationale: « Accomplir des signes » rend l'activité surnaturelle exprimée sans préciser si ces signes sont des prodiges authentiques ou des tromperies.
- source_word: ἃ ἐκπορεύεται
  choice: Ils se rendent
  rationale: Le singulier verbal irrégulier du grec est rendu selon son antécédent pluriel. Dans ce contexte de déplacement vers des personnes, « se rendent » est naturel.
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: auprès des rois
  rationale: Avec un verbe de mouvement, ἐπί indique ici la destination; « auprès des rois » prépare naturellement l'action exercée sur eux.
- source_word: τῆς οἰκουμένης ὅλης
  choice: du monde entier
  rationale: La formule désigne l'ensemble du monde habité et organisé sous des pouvoirs humains; « monde entier » est idiomatique et garde la portée universelle.
- source_word: συναγαγεῖν
  choice: afin de les rassembler
  rationale: « Afin de » explicite la valeur de but de l'infinitif sans ajouter d'interprétation.
- source_word: εἰς τὸν πόλεμον
  choice: pour le combat
  rationale: Le singulier πόλεμος vise ici l'affrontement déterminé; « combat » convient mieux que le sens plus étendu de « guerre ».
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: du grand jour
  rationale: La construction française conserve le lien entre le combat et le grand jour dans un registre apocalyptique solennel.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: de Dieu, le Tout-Puissant
  rationale: « Le Tout-Puissant » conserve παντοκράτωρ comme titre divin reconnu, clair et digne.
theological_decisions:
- issue: Nature des signes accomplis par les esprits
  choice: Le texte les présente simplement comme des « signes » accomplis par des esprits de démons.
  alternative: Les qualifier explicitement de faux prodiges, d'illusions ou de miracles véritables.
  rationale: σημεῖα ne précise ni le mécanisme ni le degré de réalité de ces manifestations. La traduction préserve cette tension au lieu de la résoudre.
translation_notes:
  register: Français international moderne, clair et solennel. La phrase grecque a été divisée en deux pour éviter une relative lourde et ambiguë, tout en conservant l'enchaînement logique. Le tiret final signale que la phrase se poursuit au verset suivant.
