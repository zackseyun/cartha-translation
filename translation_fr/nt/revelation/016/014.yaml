revisions:
- from: Car ce sont des esprits de démons[a] qui accomplissent des signes. Ils se rendent auprès des rois du monde entier[b] afin de les rassembler pour le combat du grand jour de Dieu, le Tout-Puissant —
  to: Car ce sont des esprits de démons[a] qui accomplissent des signes et vont vers les rois du monde entier[b] afin de les rassembler pour le combat du grand jour de Dieu le Tout-Puissant —
  rationale: 'La phrase est réunie afin de maintenir clairement les esprits comme sujet de « accomplissent » et de « vont », conformément à la construction grecque. « Vers » est plus précis que « auprès de » pour le mouvement vers les rois. La virgule avant le titre divin est supprimée: « Dieu le Tout-Puissant » rend naturellement la chaîne génitive et le titre τοῦ θεοῦ τοῦ παντοκράτορος. Les deux ancres de notes sont maintenues aux unités lexicales correspondantes.'
