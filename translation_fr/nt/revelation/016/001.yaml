id: REV.16.1
reference: Revelation 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: fr
  text: 'Puis j’entendis une voix forte venant du sanctuaire[a]. Elle disait aux sept anges : « Allez verser sur la terre les sept coupes de la colère de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « temple » ; le mot grec désigne souvent plus précisément le sanctuaire intérieur que l’ensemble du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: une voix forte
  rationale: En français, « voix forte » exprime naturellement le volume sonore indiqué ici par μέγας avec φωνή.
- source_word: ναοῦ
  choice: sanctuaire
  rationale: ναός désigne souvent plus précisément le lieu saint intérieur que l’ensemble du temple ; « sanctuaire » conserve cette nuance dans la scène céleste de l’Apocalypse.
- source_word: λεγούσης
  choice: Elle disait
  rationale: Le participe présent se rapporte à « voix ». Deux phrases donnent un français naturel tout en maintenant explicitement ce lien.
- source_word: Ὑπάγετε
  choice: Allez
  rationale: L’impératif commande aux anges de partir accomplir l’action ; « Allez » est direct et idiomatique.
- source_word: ἐκχέετε
  choice: verser
  rationale: Le verbe garde l’image du contenu des récipients répandu entièrement.
- source_word: φιάλας
  choice: coupes
  rationale: φιάλη désigne un récipient large et peu profond ; « coupes » est exact et conforme à l’usage français actuel dans ce contexte.
- source_word: θυμοῦ
  choice: colère
  rationale: Dans ce contexte de jugement, θυμός désigne la colère intense de Dieu. « Colère » est solennel, clair et moins archaïque que « courroux ».
- source_word: εἰς τὴν γῆν
  choice: sur la terre
  rationale: Avec « verser », εἰς marque ici le mouvement vers une surface ou un domaine. « Sur la terre » rend naturellement la portée cosmique du jugement.
theological_decisions:
- issue: Sens de ναός dans la scène céleste
  choice: sanctuaire
  alternative: temple
  rationale: « Sanctuaire » préserve la référence probable au lieu saint intérieur sans exclure que le terme puisse être rendu plus largement par « temple ».
- issue: Traduction de θυμός τοῦ θεοῦ
  choice: la colère de Dieu
  alternative: la fureur de Dieu
  rationale: « Colère » exprime clairement le jugement divin sans intensifier le texte par un terme français pouvant suggérer une perte de maîtrise.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme narratif est allégé par deux phrases ; l’impératif reste solennel et direct.
