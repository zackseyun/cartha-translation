  source_fidelity: 'Le texte rend fidèlement les éléments essentiels du grec : la voix forte venant du sanctuaire, son adresse aux sept anges, les sept coupes, la colère de Dieu et leur déversement sur la terre. « Puis » convient au καί narratif dans ce contexte, et « Allez verser » rend de manière idiomatique les deux impératifs coordonnés Ὑπάγετε καὶ ἐκχέετε.'
