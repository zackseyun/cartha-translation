  source_fidelity: 'Le texte rend fidèlement la progression du grec : l’ordinal implicite (« Le cinquième »), l’action de verser la coupe sur le trône de la bête, l’entrée du royaume dans les ténèbres, puis l’action durative de se ronger la langue en raison de la douleur. « Son royaume » est approprié en français, où le possessif ne force pas une interprétation quant à la personnification de la bête.'
  naturalness: Le français est moderne, clair et soutenu. « Fut plongé dans les ténèbres » est une formulation idiomatique qui exprime naturellement l’état résultant de ἐγένετο … ἐσκοτωμένη. Le singulier distributif dans « ils se rongeaient la langue » est naturel en français pour une action accomplie individuellement par plusieurs personnes.
  terminology: « Coupe », « trône », « bête », « royaume », « ténèbres » et « douleur » conviennent au registre apocalyptique et conservent les termes et l’imagerie du texte source. Aucun choix terminologique ne pose de problème théologique ou ne réduit une ambiguïté significative.
