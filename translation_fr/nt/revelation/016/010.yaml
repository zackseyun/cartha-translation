id: REV.16.10
reference: Revelation 16:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: fr
  text: Le cinquième versa sa coupe sur le trône de la bête. Son royaume fut plongé dans les ténèbres, et ils se rongeaient la langue à cause de la douleur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: le cinquième
  rationale: Le grec emploie seulement l’adjectif ordinal substantivé. Le contexte permet de comprendre qu’il s’agit du cinquième ange, mais le mot « ange » n’est pas ajouté au texte.
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: versa sa coupe
  rationale: « Verser » rend naturellement ἐκχέω dans la série des jugements, et « coupe » est un équivalent français courant et digne pour le récipient large et peu profond désigné par φιάλη.
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: sur le trône de la bête
  rationale: Traduction directe qui conserve l’image apocalyptique et le terme établi « bête » pour θηρίον.
- source_word: ἡ βασιλεία αὐτοῦ
  choice: son royaume
  rationale: Le possessif français « son » convient indépendamment du genre grammatical grec de θηρίον et n’oblige pas à trancher entre personnification et simple référence grammaticale.
- source_word: ἐγένετο … ἐσκοτωμένη
  choice: fut plongé dans les ténèbres
  rationale: Cette formulation française naturelle exprime l’entrée du royaume dans l’état d’obscurcissement indiqué par γίνομαι avec le participe parfait passif.
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: ils se rongeaient la langue
  rationale: L’imparfait rend l’action prolongée du verbe grec à l’imparfait, tandis que « se ronger la langue » conserve la violence concrète de μασάομαι sans l’affaiblir.
- source_word: ἐκ τοῦ πόνου
  choice: à cause de la douleur
  rationale: ἐκ indique ici la cause ou la source de leur réaction; cette formulation est claire et idiomatique en français.
theological_decisions:
- issue: Référent du possessif lié à la bête
  choice: son royaume
  alternative: le royaume de la bête
  rationale: Le français ne marque pas dans « son » le genre du possesseur. La formulation conserve donc naturellement le lien avec la bête sans accentuer ni exclure sa personnification.
- issue: Intensité de l’obscurcissement du royaume
  choice: fut plongé dans les ténèbres
  alternative: fut obscurci
  rationale: Le tour choisi exprime clairement le nouvel état résultant du participe parfait passif, sans préciser si les ténèbres sont physiques, symboliques ou les deux.
translation_notes:
  register: Français international moderne, sobre et soutenu. La syntaxe reste proche de la progression grecque, tout en divisant la longue coordination en deux phrases pour une lecture naturelle. Le sujet indéfini « ils » est conservé, puisque le grec ne nomme pas explicitement les personnes qui souffrent.
