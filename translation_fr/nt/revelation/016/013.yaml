  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: fr
  text: Et je vis sortir de la bouche du dragon, de la bouche de la bête et de la bouche du faux prophète trois esprits impurs, semblables à des grenouilles.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδον
  choice: je vis
  rationale: L’aoriste de ὁράω est rendu par le passé simple, naturel dans le récit d’une vision et adapté au registre littéraire de l’Apocalypse.
- source_word: ἐκ τοῦ στόματος
  choice: sortir de la gueule / de la bouche
  rationale: La préposition ἐκ exprime la provenance; « sortir de » rend clairement cette relation implicite en français. « Gueule » convient au dragon et à la bête, tandis que « bouche » convient au faux prophète, sans modifier l’image fondamentale.
- source_word: δράκοντος
  choice: du dragon
  rationale: « Dragon » est l’équivalent usuel de δράκων et conserve l’image symbolique déjà établie dans l’Apocalypse.
- source_word: θηρίου
  choice: de la bête
  rationale: « Bête » conserve la désignation et la symbolique apocalyptiques de θηρίον.
- source_word: ψευδοπροφήτου
  choice: du faux prophète
  rationale: Le composé désigne un prophète mensonger ou non authentique; « faux prophète » est l’expression française courante et conserve sa valeur de titre dans ce contexte.
- source_word: πνεύματα
  choice: esprits
  rationale: Dans ce passage, πνεύματα désigne des êtres spirituels. « Esprits » est précis sans ajouter dès ce verset une qualification absente du texte.
- source_word: τρία ἀκάθαρτα
  choice: trois esprits impurs
  rationale: Ἀκάθαρτα porte ici des connotations religieuses, morales et spirituelles que « impurs » conserve. L’ordre des mots est adapté à la syntaxe française.
- source_word: ὡς βάτραχοι
  choice: semblables à des grenouilles
  rationale: Ὡς introduit une comparaison plutôt qu’une identification. Cette formulation française préserve clairement la comparaison.
theological_decisions:
- issue: Nature des πνεύματα ἀκάθαρτα dans l’imagerie apocalyptique
  choice: « trois esprits impurs, semblables à des grenouilles » sans explication allégorique
  alternative: « trois esprits démoniaques ressemblant à des grenouilles »
  rationale: Le grec de ce verset dit seulement « esprits impurs » et les compare à des grenouilles. Même si le verset suivant précise leur caractère démoniaque, cette précision n’est pas anticipée ici.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit visionnaire. La syntaxe principale est restructurée pour être naturelle en français, tandis que la note signale l’ordre grec. La variation entre « gueule » et « bouche » est idiomatique en français et respecte la nature des figures désignées.
