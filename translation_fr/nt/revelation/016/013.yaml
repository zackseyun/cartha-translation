revisions:
- from: Puis je vis trois esprits impurs, semblables à des grenouilles, sortir de la gueule du dragon[a], de la gueule de la bête et de la bouche du faux prophète.
  to: Et je vis sortir de la bouche du dragon, de la bouche de la bête et de la bouche du faux prophète trois esprits impurs, semblables à des grenouilles.
