source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: fr
  text: Il y eut des éclairs, des sons et des coups de tonnerre, et il y eut un grand tremblement de terre, tel qu’il ne s’en était pas produit depuis que les êtres humains sont apparus sur la terre — si grand était ce tremblement de terre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: des éclairs
  rationale: Rendu français naturel du pluriel, qui évoque des manifestations lumineuses répétées sans lourdeur.
- source_word: φωναὶ
  choice: des sons
  rationale: φωνή peut désigner des voix ou des sons. Dans cette série de phénomènes, « sons » préserve l’indétermination du terme sans supposer une parole articulée.
- source_word: βρονταί
  choice: des coups de tonnerre
  rationale: Expression idiomatique qui rend la pluralité et le caractère répété des détonations.
- source_word: σεισμὸς
  choice: tremblement de terre
  rationale: Équivalent français courant et précis dans ce contexte.
- source_word: μέγας
  choice: grand
  rationale: Conserve le vocabulaire simple et solennel du texte apocalyptique, ainsi que sa répétition emphatique.
- source_word: οἷος οὐκ ἐγένετο
  choice: tel qu’il n’y en avait pas eu
  rationale: Exprime naturellement en français le caractère sans précédent de l’événement tout en gardant la comparaison rétrospective.
- source_word: ἀφ’ οὗ
  choice: depuis que
  rationale: Rend directement la relation temporelle.
- source_word: ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: les êtres humains étaient apparus sur la terre
  rationale: ἄνθρωποι désigne ici l’humanité sans distinction de sexe. « Étaient apparus » rend le sens existentiel et historique de ἐγένοντο dans un français plus naturel que « vinrent à être ».
- source_word: τηλικοῦτος … οὕτω μέγας
  choice: tant … était grand
  rationale: La tournure française restitue l’intensification finale et l’ampleur extraordinaire du séisme.
theological_decisions:
- issue: Portée générique de ἄνθρωποι dans la comparaison historique apocalyptique
  choice: les êtres humains
  alternative: les hommes
  rationale: Le grec vise l’ensemble de l’humanité et non les personnes de sexe masculin. « Les êtres humains » rend cette portée explicitement sans ajouter de contenu doctrinal.
- issue: Nature de φωναί parmi les phénomènes célestes
  choice: des sons
  alternative: des voix
  rationale: Le mot grec autorise les deux sens. Le contexte immédiat favorise des phénomènes auditifs, mais « sons » reste assez général pour ne pas préciser indûment leur origine ou leur caractère.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « il y eut » et de « grand » est conservée pour respecter le rythme cumulatif et l’emphase du grec. Le tiret met en relief la reprise finale sans la transformer en phrase indépendante.
