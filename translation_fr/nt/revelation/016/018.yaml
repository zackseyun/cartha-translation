  rationale: 'Révision limitée à la syntaxe française : le pronom « s’en » renvoie clairement à un tremblement de terre de cette ampleur, tandis que l’inversion finale conserve la répétition emphatique de « grand » et l’intensité de τηλικοῦτος … οὕτω μέγας. Le choix inclusif « les êtres humains » est maintenu.'
