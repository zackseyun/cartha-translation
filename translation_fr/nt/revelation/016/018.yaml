revisions:
- from: Il y eut des éclairs, des sons et des coups de tonnerre, et il y eut un grand tremblement de terre, tel qu’il n’y en avait pas eu depuis que les êtres humains étaient apparus sur la terre — tant ce tremblement de terre était grand.
