id: REV.16.6
reference: Revelation 16:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: fr
  text: parce qu’ils ont versé le sang des saints et des prophètes[a], et tu leur as donné du sang à boire. Ils en sont dignes[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « répandu le sang des saints et des prophètes ». Le verbe grec signifie littéralement « verser » ou « répandre » et peut faire écho aux coupes déversées dans le contexte.'
    reason: lexical_alternative
  - marker: b
    text: « Ils en sont dignes » signifie ici qu’ils méritent ce jugement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: parce que
  rationale: Introduit la cause de la déclaration précédente et rend clairement la relation logique en français courant.
- source_word: αἷμα
  choice: le sang / du sang
  rationale: Conserve les deux occurrences et l’effet de rétribution. L’article défini convient au sang versé des victimes, tandis que le partitif est naturel avec « donner à boire ».
- source_word: ἁγίων
  choice: saints
  rationale: Dans l’Apocalypse, le terme désigne largement le peuple consacré à Dieu, sans impliquer la catégorie ultérieure des personnes canonisées.
- source_word: προφητῶν
  choice: prophètes
  rationale: Équivalent direct et naturel, coordonné à « saints ».
- source_word: ἐξέχεαν
  choice: ont versé
  rationale: Préserve le sens concret de « répandre, verser » et l’écho possible aux coupes déversées dans le contexte, tout en restant idiomatique avec « sang » en français.
- source_word: αὐτοῖς
  choice: leur
  rationale: Rend naturellement le datif désignant les responsables auxquels le sang est donné.
- source_word: δέδωκας
  choice: tu leur as donné
  rationale: Le passé composé rend le parfait grec comme un acte accompli dont le résultat demeure pertinent.
- source_word: πιεῖν
  choice: à boire
  rationale: Construction française idiomatique après « donner », correspondant à l’infinitif grec.
- source_word: ἄξιοί εἰσιν
  choice: Ils en sont dignes
  rationale: Conserve la formulation évaluative et solennelle du grec, sans la remplacer dans le texte par l’explicitation « ils le méritent ».
theological_decisions:
- issue: Langage de justice rétributive
  choice: 'Maintenir l’image directe : « tu leur as donné du sang à boire » et la conclusion « Ils en sont dignes »'
  alternative: « tu leur as donné du sang à boire ; ils le méritent »
  rationale: Le texte présente un jugement proportionnel d’une grande sévérité. La traduction ne l’atténue pas, tandis que la note précise que « dignes » exprime ici le fait de mériter ce jugement.
- issue: Référent de ἁγίων
  choice: « saints » au sens biblique large du peuple consacré à Dieu
  alternative: « personnes saintes » ou « membres du peuple saint »
  rationale: « Saints » préserve le terme traditionnel de l’Apocalypse sans introduire une limitation aux personnes canonisées.
translation_notes:
  register: Français international moderne, naturel et solennel. Le tutoiement de Dieu correspond au registre biblique français courant. La répétition de « sang » et la dureté judiciaire de l’énoncé sont conservées.
