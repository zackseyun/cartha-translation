id: REV.16.16
reference: Revelation 16:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: fr
  text: Et il les rassembla[a] au lieu appelé en hébreu[b] Armaguédon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte un verbe au singulier : « il les rassembla », sans nommer explicitement l’agent. Dans les versets 13-14, ce sont les esprits impurs qui partent rassembler les rois, ce qui explique aussi la traduction possible : « ils les rassemblèrent ».'
    reason: ambiguïté grammaticale et contextuelle
  - marker: b
    text: Ou « dans la langue hébraïque ou araméenne ». Dans l’Apocalypse, l’expression « en hébreu » désigne la forme sémitique du nom sans nécessairement établir une distinction stricte entre l’hébreu et l’araméen.
    reason: alternative lexicale
lexical_decisions:
- source_word: συνήγαγεν
  choice: il les rassembla
  rationale: Le verbe grec est à la troisième personne du singulier et signifie « rassembler ». Le français conserve ce singulier sans préciser l’identité de l’agent, que le texte grec ne nomme pas explicitement.
- source_word: αὐτούς
  choice: les
  rationale: Pronom accusatif pluriel renvoyant, dans le contexte, aux rois rassemblés pour le combat.
- source_word: τὸν τόπον
  choice: au lieu
  rationale: « Lieu » est l’équivalent naturel et direct de τόπος dans ce contexte.
- source_word: τὸν καλούμενον
  choice: appelé
  rationale: 'Le participe passif est rendu de façon concise et idiomatique tout en conservant son sens : le lieu porte ce nom.'
- source_word: Ἑβραϊστί
  choice: en hébreu
  rationale: Traduction usuelle et transparente de l’adverbe, avec une note signalant que, dans cet usage, il peut désigner plus largement la langue sémitique locale, notamment l’araméen.
- source_word: Ἁρμαγεδών
  choice: Armaguédon
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom propre grec.
theological_decisions:
- issue: Identité de l’agent du rassemblement
  choice: il les rassembla
  alternative: ils les rassemblèrent
  rationale: La forme verbale grecque est incontestablement au singulier, mais son sujet n’est pas exprimé. Le contexte précédent présente les esprits impurs comme ceux qui vont rassembler les rois (v. 13-14), tandis que le singulier peut suggérer un agent unique. La traduction respecte la forme grammaticale sans identifier cet agent, et la note préserve la tension contextuelle.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste concise, conformément au grec. Le passé simple convient au registre narratif biblique sans être archaïque. Les deux notes rendent visibles l’ambiguïté de l’agent et la portée linguistique de Ἑβραϊστί.
