id: REV.16.20
reference: Revelation 16:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶσα νῆσος ἔφυγεν, καὶ ὄρη οὐχ εὑρέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/020.yaml
  text: And every island fled[a], and mountains were not found.
translation:
  language: fr
  text: Et toute île s’enfuit[a], et les montagnes ne furent pas trouvées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « disparut ». Le verbe grec signifie littéralement « s’enfuit », ce qui conserve la personnification saisissante du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα
  choice: toute
  rationale: 'Avec le singulier νῆσος, πᾶσα a un sens distributif : « toute île », c’est-à-dire chaque île.'
- source_word: νῆσος
  choice: île
  rationale: Le nom désigne directement une île.
- source_word: ἔφυγεν
  choice: s’enfuit
  rationale: Le verbe φεύγω signifie littéralement « fuir ». « S’enfuit » conserve la personnification saisissante du texte apocalyptique.
- source_word: ὄρη
  choice: les montagnes
  rationale: Le pluriel ὄρη désigne les montagnes ; l’article défini est naturel en français pour cette catégorie prise globalement.
- source_word: οὐχ εὑρέθησαν
  choice: ne furent plus trouvées
  rationale: Le passif signifie littéralement « ne furent pas trouvées ». Dans ce contexte de bouleversement cosmique, « ne furent plus trouvées » exprime naturellement qu’elles étaient désormais introuvables, sans remplacer l’image par une explication.
- source_word: καὶ ... καὶ
  choice: Et ... et
  rationale: La répétition de « et » maintient la coordination cumulative et le style paratactique de l’Apocalypse.
theological_decisions:
- issue: Faut-il interpréter l’image apocalyptique comme une disparition littérale ou comme une image symbolique ?
  choice: Conserver la description concrète sans en préciser le mode d’accomplissement
  alternative: Traduire de manière interprétative par « disparut » ou reformuler comme un effondrement symbolique
  rationale: Le grec donne une image cosmique vive. La traduction préserve cette image et laisse ouverte la question de son caractère littéral ou symbolique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif solennel de l’Apocalypse. La répétition « Et… et… » est volontaire afin de préserver le rythme cumulatif du grec.
