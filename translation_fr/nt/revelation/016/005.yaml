id: REV.16.5
reference: Revelation 16:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: fr
  text: 'Et j’entendis l’ange des eaux[a] dire : « Tu es juste[b], toi qui es et qui étais, le Saint[c], parce que tu as jugé ces choses. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’ange chargé des eaux ».
    reason: lexical_alternative
  - marker: b
    text: Ou « Tu es droit »; le terme souligne ici la rectitude de Dieu dans son jugement.
    reason: lexical_alternative
  - marker: c
    text: 'Certains manuscrits présentent ici une formule plus développée : « toi qui es, qui étais et qui viens », probablement sous l’influence de formules semblables ailleurs dans l’Apocalypse. Le texte retenu porte : « toi qui es et qui étais, le Saint ». Pour « le Saint », on pourrait aussi comprendre « le Fidèle ».'
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: l’ange des eaux
  rationale: Le génitif grec est conservé de près. Dans le contexte, il peut désigner l’ange associé aux eaux ou chargé d’elles, sans que cette fonction soit explicitée dans le texte.
- source_word: Δίκαιος
  choice: juste
  rationale: En français moderne, « juste » exprime naturellement la rectitude morale de Dieu, particulièrement dans l’exercice du jugement, tout en gardant le ton solennel de la proclamation.
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: toi qui es et qui étais
  rationale: Cette formulation conserve le titre divin propre à l’Apocalypse. L’apostrophe « toi » rend naturellement en français la construction grecque employée après « Tu es juste ».
- source_word: ὁ ὅσιος
  choice: le Saint
  rationale: ὅσιος désigne ici celui qui possède une sainteté morale et fidèle. « Le Saint » est un titre français clair, digne et adapté au contexte doxologique.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit la raison pour laquelle Dieu est proclamé juste; « parce que » en exprime clairement la valeur causale.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif est rendu sans remplacer explicitement son référent par « ces jugements », ce qui préserve la formulation et la portée du grec.
- source_word: ἔκρινας
  choice: tu as jugé
  rationale: Le passé composé présente l’acte de juger comme accompli et pertinent pour la proclamation présente, tout en rendant convenablement l’aoriste grec.
theological_decisions:
- issue: Le titre divin ne comporte pas l’élément futur attendu
  choice: toi qui es et qui étais, le Saint
  alternative: toi qui es, qui étais et qui viens
  rationale: Le texte du SBLGNT porte ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος. La traduction suit cette forme plus courte et n’introduit pas la formule plus développée attestée ailleurs dans l’Apocalypse.
- issue: Valeur de ὅσιος comme titre divin
  choice: le Saint
  alternative: le Fidèle
  rationale: « Le Saint » rend directement la qualité morale et cultuelle exprimée par ὅσιος sans réduire le mot à la seule fidélité, tout en laissant l’autre nuance accessible en note.
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La syntaxe d’adresse directe est naturelle en français, tandis que les titres divins et la formulation inhabituelle du texte grec sont conservés sans harmonisation.
