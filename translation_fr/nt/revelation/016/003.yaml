id: REV.16.3
reference: Revelation 16:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: fr
  text: Le deuxième versa sa coupe dans la mer. Elle devint du sang, comme celui d’un mort[a], et tout être vivant dans la mer mourut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du sang comme d’un mort »; autre traduction possible : « comme du sang provenant d’un cadavre ».'
    reason: La construction grecque est elliptique et peut évoquer soit le sang d’une personne morte, soit du sang semblable à celui d’un cadavre.
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: le deuxième
  rationale: L’adjectif substantivé renvoie, dans le contexte immédiat, au deuxième ange, mais le nom « ange » n’est pas exprimé dans ce verset; l’ellipse est donc conservée.
- source_word: ἐξέχεεν
  choice: versa
  rationale: « Verser » rend naturellement l’action d’épancher le contenu d’une coupe et maintient l’image des jugements.
- source_word: φιάλην
  choice: coupe
  rationale: La φιάλη est un récipient large et peu profond; « coupe » est plus juste et actuel que « fiole ».
- source_word: εἰς τὴν θάλασσαν
  choice: dans la mer
  rationale: La préposition εἰς marque ici la direction du contenu vers la mer; « dans » est naturel en français.
- source_word: ἐγένετο αἷμα
  choice: elle devint du sang
  rationale: Cette formulation traduit directement γίνομαι avec l’attribut αἷμα et présente la transformation comme réelle dans la vision.
- source_word: ὡς νεκροῦ
  choice: comme celui d’un mort
  rationale: Le génitif elliptique compare le sang à celui d’une personne morte. La formulation française conserve l’ellipse et le singulier sans réduire la comparaison à une simple couleur.
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: tout être vivant
  rationale: Dans ce contexte marin, l’expression désigne chaque créature vivante. « Être vivant » évite le sens anthropologique trompeur que pourrait suggérer « âme » en français moderne.
- source_word: ἀπέθανεν
  choice: mourut
  rationale: Le verbe simple traduit directement ἀποθνῄσκω sans amplification interprétative.
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: dans la mer
  rationale: Le groupe neutre pluriel précise quels êtres vivants sont concernés; en français, il s’intègre naturellement à « tout être vivant dans la mer ».
theological_decisions:
- issue: Nature de l’image du fléau
  choice: Présenter la mer comme devenant réellement du sang dans la vision
  alternative: 'Traduire de manière phénoménologique: « elle prit l’apparence du sang »'
  rationale: Le grec affirme qu’elle « devint du sang », puis en qualifie la nature par une comparaison. La traduction conserve donc toute la force du jugement visionnaire sans le réduire à une simple apparence.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif solennel de l’Apocalypse. L’ellipse « le deuxième » est maintenue comme dans le grec, et le vocabulaire reste accessible sans atténuer la violence de l’image.
