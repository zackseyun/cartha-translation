id: REV.13.16
reference: Revelation 13:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: fr
  text: Elle fait en sorte que tous — petits et grands, riches et pauvres, hommes libres et esclaves — reçoivent une marque[a] sur leur main droite ou sur leur front.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour qu’ils leur donnent une marque ». Le sujet de « donnent » n’est pas exprimé dans le grec.'
    reason: La formulation grecque est grammaticalement active et présente un sujet implicite ambigu ; la note préserve cette difficulté que le texte principal rend de façon idiomatique.
lexical_decisions:
- source_word: ποιεῖ
  choice: fait en sorte que
  rationale: 'Avec ἵνα et le subjonctif, le verbe exprime ici la causation : la bête provoque ce qui suit. « Fait en sorte que » est naturel en français et n’ajoute pas explicitement l’idée de contrainte.'
- source_word: πάντας
  choice: tous
  rationale: Le masculin pluriel, développé par les catégories qui suivent, désigne sans exception toutes les personnes visées.
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: petits et grands
  rationale: Cette formule traditionnelle conserve l’opposition sociale et la cadence rhétorique du grec sans préciser abusivement le critère de grandeur.
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: riches et pauvres
  rationale: Cette opposition socioéconomique directe est claire et idiomatique en français.
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: hommes libres et esclaves
  rationale: L’ajout de « hommes » rend l’expression française naturelle et inclusive au sens générique ; l’opposition avec les personnes libres montre que δοῦλοι désigne ici des esclaves, non de simples serviteurs.
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: reçoivent une marque
  rationale: Le grec attesté dit formellement « qu’ils leur donnent une marque », avec un sujet implicite difficile à identifier. Dans le contexte, « reçoivent une marque » exprime naturellement le résultat subi par tous, tandis que la forme plus littérale est conservée en note.
- source_word: χάραγμα
  choice: marque
  rationale: « Marque » rend le terme désignant une empreinte ou un signe distinctif et correspond à son emploi récurrent dans l’Apocalypse.
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: sur la main droite
  rationale: Le singulier distributif est naturel en français et suit le singulier grec.
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: ou sur le front
  rationale: Le singulier distributif français traduit clairement le singulier grec sans lourdeur.
theological_decisions:
- issue: Traduction de δοῦλος dans une opposition de statuts sociaux
  choice: esclaves
  alternative: serviteurs
  rationale: L’opposition explicite avec les hommes libres met au premier plan la condition juridique et sociale d’asservissement. « Serviteurs » affaiblirait cette opposition.
- issue: Expression de la proposition difficile ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: reçoivent une marque
  alternative: qu’ils leur donnent une marque
  rationale: La formulation principale privilégie un français clair qui rend l’événement décrit sans identifier le sujet implicite du don. La note préserve la construction active et l’ambiguïté formelle du grec.
translation_notes:
  register: Français international moderne, digne et accessible. Les trois paires sont resserrées entre tirets pour conserver l’élan de l’énumération. « Petits et grands » maintient la formulation imagée et la tension du texte sans la réduire à une seule hiérarchie sociale.
