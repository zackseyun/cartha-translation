id: REV.13.18
reference: Revelation 13:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: fr
  text: 'C’est ici qu’il faut de la sagesse : que celui qui a de l’intelligence calcule le nombre de la bête, car c’est un nombre d’homme[a], et son nombre est six cent soixante-six[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le nombre d’un homme » ; autre possibilité : « un nombre humain ».'
    reason: alternative_reading
  - marker: b
    text: Quelques manuscrits portent « six cent seize » au lieu de « six cent soixante-six ».
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: C’est ici qu’il faut de la sagesse
  rationale: Cette formulation française naturelle conserve la valeur démonstrative de ὧδε et présente la sagesse comme nécessaire à l’interprétation qui suit.
- source_word: ὁ ἔχων νοῦν
  choice: celui qui a de l’intelligence
  rationale: Le syntagme désigne la personne capable de discernement; cette formulation conserve le singulier et reste digne et courante.
- source_word: ψηφισάτω
  choice: calcule
  rationale: L’impératif appelle à établir le nombre par calcul, et non simplement à le réciter ou à le compter.
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: le nombre de la bête
  rationale: Rendu direct et traditionnel, adapté au contexte apocalyptique de l’Apocalypse.
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: car c’est un nombre d’homme
  rationale: Le génitif ἀνθρώπου peut désigner un homme particulier ou caractériser le nombre comme humain. « Un nombre d’homme » maintient cette ambiguïté mieux que des formulations plus explicites.
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: et son nombre
  rationale: En français, « son » renvoie naturellement à la bête sans imposer une décision sur le degré de personnification.
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: six cent soixante-six
  rationale: Rendu direct du nombre grec selon l’orthographe traditionnelle des numéraux en français.
theological_decisions:
- issue: Sens de ἀνθρώπου dans ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: un nombre d’homme
  alternative: le nombre d’un homme; un nombre humain
  rationale: Le grec ne tranche pas entre l’appartenance à un homme déterminé et la qualité humaine du nombre. Le texte principal conserve cette tension, tandis que la note expose les deux principales compréhensions.
- issue: Variante textuelle du nombre
  choice: six cent soixante-six
  alternative: six cent seize
  rationale: Le texte principal suit le SBLGNT et la lecture très largement attestée 666; la variante ancienne 616 est signalée en note sans remplacer le texte retenu.
translation_notes:
  register: Français international moderne, clair et digne. La tournure initiale est idiomatique sans être familière; le vocabulaire établi de l’Apocalypse (« la bête ») est conservé. Les notes maintiennent l’ambiguïté interprétative et la variante textuelle.
