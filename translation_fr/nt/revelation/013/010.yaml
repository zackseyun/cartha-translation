id: REV.13.10
reference: Revelation 13:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: fr
  text: Si quelqu’un est voué à la captivité, il ira en captivité[a] ; si quelqu’un doit être tué par l’épée, il doit être tué par l’épée[b]. C’est ici que se trouvent la persévérance et la foi des saints[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si quelqu’un va en captivité, il ira en captivité. » Cette parole peut décrire une destinée fixée plutôt que formuler un commandement.'
    reason: alternative_reading
  - marker: b
    text: 'Certains manuscrits ou certaines formes du texte portent une formulation différente, notamment : « Si quelqu’un tue par l’épée, il doit être tué par l’épée. » La présente traduction suit le texte retenu ici, mais la variante influe sensiblement sur l’interprétation.'
    reason: textual_variant
  - marker: c
    text: 'Ou : « la fidélité des saints ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: Si quelqu’un
  rationale: Expression conditionnelle indéfinie et générale ; « quelqu’un » est naturel en français moderne et conserve sa portée ouverte.
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: est voué à la captivité ... ira en captivité
  rationale: La répétition de « captivité » garde l’insistance proverbiale du grec. « Est voué à » rend l’ellipse initiale sans masquer, grâce à la note, la possibilité d’une formulation plus strictement descriptive.
- source_word: αἰχμαλωσία
  choice: captivité
  rationale: Le terme désigne le fait d’être emmené captif et conserve la tonalité solennelle de jugement ; « emprisonnement » serait trop étroit.
- source_word: ἐν μαχαίρῃ
  choice: par l’épée
  rationale: Rend naturellement en français la valeur instrumentale de la construction et maintient l’écho du langage biblique de jugement.
- source_word: ἀποκτανθῆναι ... αὐτὸν ... ἀποκτανθῆναι
  choice: doit être tué ... il faut qu’il soit tué
  rationale: La formulation passive et la répétition expriment la nécessité ou le destin annoncé, tout en donnant en français une phrase cohérente à cette construction grecque très concise.
- source_word: ὧδέ ἐστιν
  choice: C’est ici que se trouvent
  rationale: 'Formulation française compréhensible qui conserve la fonction démonstrative : le texte attire l’attention sur la persévérance et la foi requises dans cette situation.'
- source_word: ὑπομονή
  choice: persévérance
  rationale: Exprime la constance endurante sous l’épreuve et convient au vocabulaire récurrent de l’Apocalypse.
- source_word: πίστις
  choice: foi
  rationale: Choix lexical direct qui laisse ouverte la nuance contextuelle de fidélité, signalée en note.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: Désigne de façon concise le peuple saint de Dieu et reste une expression biblique largement comprise en français.
theological_decisions:
- issue: 'Sens des deux premières propositions : destinée annoncée ou commandement'
  choice: Une destinée judiciaire ou une issue inéluctable est énoncée sous forme proverbiale.
  alternative: On peut comprendre un commandement de ne pas résister par la violence, ou, selon une variante textuelle, un principe de rétribution contre celui qui tue.
  rationale: Le texte grec retenu est elliptique et difficile, mais il présente le plus naturellement ceux qui sont voués à la captivité ou à la mort par l’épée comme allant vers le sort annoncé. La traduction évite d’en déduire à elle seule une doctrine complète de non-violence ou de représailles.
- issue: Nuance de πίστις
  choice: foi
  alternative: fidélité
  rationale: « Foi » correspond directement au terme grec, tandis que le contexte de persévérance sous l’oppression permet aussi la nuance de « fidélité » ; celle-ci est donc conservée en note.
translation_notes:
  register: Français international moderne, sobre et solennel. La répétition de « captivité » et d’« épée » conserve le caractère proverbial et emphatique du grec. Les formulations archaïques ont été évitées, tandis que « saints » maintient le registre biblique sans ajouter de précision confessionnelle.
