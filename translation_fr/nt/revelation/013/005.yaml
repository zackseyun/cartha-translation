id: REV.13.5
reference: Revelation 13:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: fr
  text: Et il lui fut donné une bouche qui proférait de grandes choses[b] et des blasphèmes, et il lui fut donné l’autorité d’agir pendant quarante-deux mois.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « il lui fut donné l’autorité de poursuivre son action pendant quarante-deux mois ».'
    reason: textual_variant
  - marker: b
    text: Dans ce contexte, « de grandes choses » désigne probablement des propos arrogants ou prétentieux.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: il lui fut donné
  rationale: Le passif montre que la bête reçoit ce qui lui est accordé au lieu de le posséder par elle-même. La répétition de la même formule française conserve celle du grec.
- source_word: στόμα
  choice: une bouche
  rationale: Le sens concret préserve l’image apocalyptique frappante du texte, sans la réduire à la simple faculté de parler.
- source_word: λαλοῦν
  choice: qui prononçait
  rationale: Cette proposition relative rend naturellement en français le participe présent qui qualifie « bouche », tout en exprimant une activité de parole en cours.
- source_word: μεγάλα
  choice: de grandes choses
  rationale: La traduction reste proche de l’expression grecque, qui suggère ici des propos arrogants ou prétentieux sans employer explicitement le mot « vantardises ».
- source_word: βλασφημίας
  choice: des blasphèmes
  rationale: Le pluriel explicite la nature religieusement offensante des paroles et correspond au contexte immédiat des attaques contre Dieu.
- source_word: ἐξουσία
  choice: l’autorité
  rationale: « Autorité » exprime mieux une capacité ou une permission accordée que la seule idée de puissance brute. L’article est requis par l’usage naturel du français.
- source_word: ποιῆσαι
  choice: d’agir
  rationale: Le verbe grec est très large, au sens de faire ou d’accomplir. Avec une indication de durée, « agir » reste idiomatique sans importer un complément absent ni adopter la variante « poursuivre ».
- source_word: μῆνας τεσσεράκοντα δύο
  choice: pendant quarante-deux mois
  rationale: L’accusatif de durée se rend naturellement par « pendant », et le nombre est écrit en toutes lettres pour une lecture fluide.
theological_decisions:
- issue: Portée de μεγάλα dans la description des paroles de la bête
  choice: de grandes choses
  alternative: des paroles arrogantes ; de grandes vantardises
  rationale: Le contexte implique l’arrogance et l’opposition à Dieu, mais l’adjectif grec demeure plus large. Le texte principal en conserve l’ambiguïté, tandis que la note en précise la force probable.
- issue: Sens de ποιῆσαι avec l’expression de durée
  choice: d’agir pendant quarante-deux mois
  alternative: de poursuivre son action pendant quarante-deux mois
  rationale: Le texte principal suit ποιῆσαι dans le SBLGNT. La formulation traditionnelle fondée sur une variante textuelle est signalée en note plutôt que substituée au texte grec retenu.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme des deux occurrences de « il lui fut donné » et l’image concrète de la « bouche », tout en employant une relative naturelle en français.
