language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: fr
  text: afin que personne ne puisse acheter ni vendre, à moins d’avoir la marque, le nom de la bête ou le nombre de son nom.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la marque, c’est-à-dire le nom de la bête ou le nombre de son nom ».'
    reason: ambiguïté_syntaxique
lexical_decisions:
- source_word: ἵνα μή τις δύνηται
  choice: afin que personne ne puisse
  rationale: ἵνα introduit ici le but ou le résultat, μή τις exprime « personne », et δύνηται la capacité ou la possibilité. Cette formulation est naturelle en français tout en conservant la force de la proposition grecque.
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: acheter ni vendre
  rationale: Après « personne ne puisse », le français courant coordonne naturellement les deux infinitifs par « ni ». Les verbes désignent les activités commerciales ordinaires.
- source_word: εἰ μὴ ὁ ἔχων
  choice: sauf celui qui porte
  rationale: εἰ μή introduit l’unique exception et ὁ ἔχων est un participe substantivé, littéralement « celui qui a ». Avec une marque, « porter » est idiomatique en français et rend une possession identifiable sans préciser son mode d’apposition.
- source_word: τὸ χάραγμα
  choice: la marque
  rationale: χάραγμα désigne une marque, une empreinte ou un signe gravé. « La marque » est clair, traditionnel et adapté au contexte apocalyptique.
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: le nom de la bête
  rationale: La formulation reproduit directement le génitif grec et maintient le parallélisme avec « le nombre de son nom ».
- source_word: θηρίου
  choice: la bête
  rationale: Dans l’Apocalypse, θηρίον est le titre symbolique de l’adversaire apocalyptique ; « la bête » est l’équivalent français établi.
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: ou le nombre de son nom
  rationale: Le possessif français « son » renvoie grammaticalement au nom masculin « nom », sans trancher à lui seul entre une référence personnelle ou non personnelle de αὐτοῦ. La formulation préserve ainsi l’ambiguïté référentielle du grec.
theological_decisions:
- issue: Valeur générique de ὁ ἔχων
  choice: sauf celui qui porte
  alternative: sauf quiconque porte
  rationale: Le grec emploie un masculin singulier substantivé à valeur générique. « Celui qui » en garde la forme grammaticale sans limiter explicitement l’interdiction aux hommes.
- issue: Relation entre la marque, le nom et le nombre
  choice: la marque, le nom de la bête ou le nombre de son nom
  alternative: la marque — c’est-à-dire le nom de la bête ou le nombre de son nom
  rationale: La ponctuation grecque ne permet pas d’imposer avec certitude une apposition explicative. La virgule conserve la tension entre une liste de trois éléments et une possible explication de la marque.
- issue: Référence de αὐτοῦ
  choice: son nom
  alternative: le nom de celle-ci
  rationale: αὐτοῦ peut être rendu personnellement ou selon le genre grammatical neutre de θηρίον. Le possessif français naturel « son » évite de surinterpréter cette distinction.
translation_notes:
  register: Français international moderne, courant et digne. « Porter la marque » est plus naturel que « avoir la marque » dans ce contexte. La structure reste proche du grec, et la note préserve l’ambiguïté entre énumération et apposition.
