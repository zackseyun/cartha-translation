id: REV.13.7
reference: Revelation 13:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: fr
  text: Il lui fut donné de faire la guerre aux saints[a] et de les vaincre[b], et une autorité lui fut donnée sur toute tribu, tout peuple, toute langue et toute nation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, « faire la guerre avec les saints » ; dans ce contexte, le sens est hostile : « aux saints » ou « contre les saints ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « l’emporter sur eux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: il lui fut donné / lui fut donnée
  rationale: Le passif français conserve la forme grecque et ne nomme pas celui qui accorde cette possibilité ou cette autorité.
- source_word: ποιῆσαι πόλεμον μετὰ τῶν ἁγίων
  choice: faire la guerre aux saints
  rationale: Cette tournure française naturelle exprime l’engagement hostile que prend μετά dans cette association avec « faire la guerre », tout en conservant « saints » pour ἅγιοι.
- source_word: νικῆσαι
  choice: vaincre
  rationale: « Vaincre » restitue le motif récurrent de νικάω dans l’Apocalypse sans le réduire à une simple défaite militaire.
- source_word: ἐξουσία
  choice: autorité
  rationale: « Autorité » exprime une compétence ou une domination accordée, en cohérence avec le passif ἐδόθη, plutôt que la seule force brute.
- source_word: ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος
  choice: sur toute tribu, tout peuple, toute langue et toute nation
  rationale: La série est rendue terme à terme dans un français clair, en maintenant sa portée universelle et ses quatre catégories distinctes.
theological_decisions:
- issue: Passif sans agent dans les deux occurrences de ἐδόθη
  choice: Conserver le passif sans identifier celui qui donne
  alternative: 'Expliciter une permission divine : « il lui fut permis »'
  rationale: Le grec ne nomme pas l’agent. Le maintien du passif préserve la tension entre l’action du mal et l’autorité qui lui est accordée, sans imposer une explication théologique.
- issue: Portée de la victoire sur les saints
  choice: « les vaincre »
  alternative: « l’emporter sur eux »
  rationale: Le texte affirme une victoire de la bête sur les saints dans ce conflit, mais ne précise pas ici sa portée ultime. « Vaincre » conserve cette affirmation forte sans ajouter qu’elle serait définitive.
translation_notes:
  register: Français international moderne, digne et direct. « Il lui fut donné » garde la retenue du passif grec ; « faire la guerre aux saints » est idiomatique sans être familier. La répétition de « toute/tout » reproduit la force distributive de πᾶσαν.
