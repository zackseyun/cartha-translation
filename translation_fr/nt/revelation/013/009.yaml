  text: Εἴ τις ἔχει οὖς ἀκουσάτω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: fr
  text: Si quelqu’un a une oreille, qu’il entende[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le pronom « il » reprend « quelqu’un » selon l’usage grammatical français; l’appel s’adresse à toute personne.
    reason: Clarifier la portée générale du masculin grammatical sans modifier le singulier du texte grec.
lexical_decisions:
- source_word: Εἴ τις
  choice: Si quelqu’un
  rationale: La tournure conditionnelle et le pronom indéfini sont conservés directement. « Quelqu’un » a ici une portée générale et ouverte.
- source_word: ἔχει
  choice: a
  rationale: Le présent de possession se rend naturellement et simplement par « a ».
- source_word: οὖς
  choice: une oreille
  rationale: Le singulier grec est conservé dans cette formule proverbiale, où l’oreille représente la capacité d’accueillir attentivement le message.
- source_word: ἀκουσάτω
  choice: qu’il entende
  rationale: Le subjonctif à valeur injonctive rend l’impératif grec de troisième personne. « Entende » maintient le motif biblique de l’écoute réceptive sans le réduire à la seule compréhension intellectuelle.
theological_decisions:
- issue: Portée générale du masculin grammatical
  choice: qu’il entende
  alternative: que cette personne entende
  rationale: « Quelqu’un » commande normalement le masculin grammatical en français, sans limiter l’exhortation aux hommes. La formulation reste concise et proche du singulier grec.
- issue: Force de la formule d’écoute
  choice: entende
  alternative: écoute
  rationale: '« Entendre » préserve l’écho de la formule prophétique et apocalyptique et laisse subsister sa portée riche : recevoir, prêter attention et répondre, plutôt que simplement percevoir un son.'
translation_notes:
  register: Français international actuel, concis et solennel. La formulation conserve le parallélisme proverbial et le singulier de l’original tout en restant immédiatement compréhensible.
