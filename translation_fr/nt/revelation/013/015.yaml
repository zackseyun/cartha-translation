id: REV.13.15
reference: Revelation 13:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: fr
  text: Il lui fut donné de donner un souffle[a] à l’image de la bête, afin que l’image de la bête parle même et fasse en sorte que tous ceux qui n’adoreraient pas l’image de la bête soient mis à mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de donner un esprit » ou « de donner la vie » à l’image de la bête.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: Il lui fut donné
  rationale: La tournure passive conserve l’auteur implicite du don ou de l’autorisation, sans préciser une identité que le grec ne nomme pas.
- source_word: δοῦναι πνεῦμα
  choice: de donner un souffle
  rationale: « Souffle » convient à l’animation de l’image et à sa capacité de parler, tout en préservant l’éventail de sens de πνεῦμα sans affirmer explicitement qu’elle reçoit une vie véritable ou un esprit personnel.
- source_word: εἰκών
  choice: image
  rationale: Terme large et usuel qui n’impose pas la forme matérielle plus précise d’une statue.
- source_word: θηρίον
  choice: bête
  rationale: Rend le terme apocalyptique de manière traditionnelle et exacte, sans ajouter la nuance interprétative de « monstre ».
- source_word: ἵνα καὶ λαλήσῃ
  choice: afin que ... puisse même parler
  rationale: « Afin que » exprime le but ou le résultat, tandis que « même » souligne le fait saisissant que l’image en vient à parler.
- source_word: ποιήσῃ ἵνα
  choice: et fasse en sorte que
  rationale: Cette formulation française naturelle conserve la force causative de ποιέω suivi d’une proposition introduite par ἵνα.
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: tous ceux qui n’adoreraient pas
  rationale: La formulation rend naturellement la relative indéfinie et la non-conformité envisagée dans ces cas.
- source_word: προσκυνήσωσιν
  choice: adoreraient
  rationale: Dans ce contexte de l’Apocalypse, le verbe désigne l’adoration rendue à la bête et à son image, plutôt qu’un simple geste de respect.
- source_word: ἀποκτανθῶσιν
  choice: soient mis à mort
  rationale: Le passif grec est maintenu dans un français clair et digne.
theological_decisions:
- issue: Sens de πνεῦμα dans l’animation de l’image de la bête
  choice: souffle
  alternative: esprit ; vie
  rationale: « Souffle » évoque l’animation qui permet à l’image de parler, sans trancher la question de savoir si elle reçoit réellement la vie ou si un esprit personnel l’habite.
- issue: Identité de celui qui accorde la capacité
  choice: L’auteur du don demeure implicite
  alternative: Nommer explicitement Dieu ou Satan comme auteur
  rationale: Le passif grec ne précise pas qui donne cette capacité ; la traduction conserve cette indétermination et la tension propre au récit apocalyptique.
- issue: Nature de l’hommage rendu à l’image
  choice: adorer
  alternative: se prosterner devant ; rendre hommage à
  rationale: Le contexte religieux de l’Apocalypse favorise « adorer », sans ajouter de précision confessionnelle étrangère au texte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « l’image de la bête » est conservée, conformément à l’insistance du grec. Le futur dans le passé « n’adoreraient pas » exprime les cas envisagés sans transformer la proposition en affirmation temporelle stricte.
