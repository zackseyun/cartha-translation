revisions:
- from: Il lui fut donné de donner un souffle[a] à l’image de la bête, afin que l’image de la bête puisse même parler et fasse en sorte que tous ceux qui n’adoreraient pas l’image de la bête soient mis à mort.
  to: Il lui fut donné de donner un souffle[a] à l’image de la bête, afin que l’image de la bête parle même et fasse en sorte que tous ceux qui n’adoreraient pas l’image de la bête soient mis à mort.
  rationale: Révision limitée à la fluidité de la coordination des subjonctifs et à la clarté formelle de la note lexicale. Elle maintient l’auteur implicite de la permission, l’ambiguïté de πνεῦμα et la force causative de la dernière proposition.
  reviewer_model: gpt-5.6-terra
