reference: Revelation 13:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: fr
  text: Et elle ouvrit la bouche pour proférer des blasphèmes contre Dieu, pour blasphémer son nom et sa demeure[b], ceux qui demeurent dans le ciel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension possible de la fin du verset : « et ceux qui demeurent dans le ciel », si cette expression est prise comme un troisième complément de « blasphémer », plutôt que comme une explication de « sa demeure ».'
    reason: alternative_reading
  - marker: b
    text: « Demeure » peut aussi être traduit par « tabernacle » ou « tente ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: elle ouvrit la bouche
  rationale: L’aoriste ἤνοιξε est rendu simplement par le passé simple. Le pronom féminin renvoie naturellement en français à « la bête », le référent du contexte.
- source_word: εἰς βλασφημίας
  choice: pour proférer des blasphèmes
  rationale: La tournure idiomatique française exprime clairement la destination de l’ouverture de la bouche, tout en conservant le pluriel βλασφημίας.
- source_word: πρὸς τὸν θεόν
  choice: contre Dieu
  rationale: Dans ce contexte de parole hostile, πρός a une valeur adversative.
- source_word: βλασφημῆσαι
  choice: pour blasphémer
  rationale: L’infinitif aoriste indique ici le but ou le résultat; cette formulation directe laisse subsister cette légère indétermination.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: son nom
  rationale: La traduction littérale préserve la portée biblique du nom comme identité et honneur de Dieu.
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: sa demeure
  rationale: σκηνή peut désigner une tente, un tabernacle ou une demeure. « Demeure » est naturel en français moderne et convient ici à l’habitation céleste de Dieu sans imposer une connotation cultuelle.
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: ceux qui demeurent dans le ciel
  rationale: Le participe présent est rendu par une relative naturelle. La répétition de « demeure/demeurent » conserve le lien lexical entre σκηνή et σκηνόω.
theological_decisions:
- issue: Rapport entre « sa demeure » et « ceux qui demeurent dans le ciel »
  choice: Présenter la dernière expression en apposition directe à « sa demeure »
  alternative: 'La comprendre comme un troisième complément de « blasphémer » : « et ceux qui demeurent dans le ciel »'
  rationale: L’accusatif final peut expliquer « sa demeure » ou constituer un objet coordonné supplémentaire. L’apposition sans ajout explicatif représente sobrement la première analyse, tandis que l’autre possibilité est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique. La structure répétitive et l’apposition du grec sont préservées autant que le permet un français naturel.
