id: REV.13.8
reference: Revelation 13:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: fr
  text: Et tous les habitants de la terre dont le nom n’est pas inscrit dans le livre de vie de l’Agneau immolé depuis la fondation du monde l’adoreront.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et tous les habitants de la terre dont le nom n’est pas inscrit depuis la fondation du monde dans le livre de vie de l’Agneau immolé l’adoreront. » En grec, « depuis la fondation du monde » peut se rattacher soit à « immolé », soit à « n’est pas inscrit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: adoreront
  rationale: Dans l’Apocalypse, le verbe désigne régulièrement un hommage religieux rendu soit à Dieu et à l’Agneau, soit à la bête. « Adoreront » en exprime clairement la portée cultuelle.
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: les habitants de la terre
  rationale: Cette formulation naturelle conserve l’expression récurrente de l’Apocalypse, qui caractérise souvent l’humanité opposée à Dieu, sans recourir au calque peu idiomatique « ceux qui habitent sur la terre ».
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: tous ceux dont le nom n’est pas écrit
  rationale: Le relatif grec est singulier après un collectif, mais le français demande ici une reprise plurielle. « N’est pas écrit » rend l’état résultant du parfait grec de façon naturelle.
- source_word: βιβλίῳ τῆς ζωῆς
  choice: livre de vie
  rationale: « Livre de vie » est l’expression française consacrée et intelligible pour cette image apocalyptique; « rouleau » serait possible lexicalement, mais moins naturel dans cette locution.
- source_word: τοῦ ἀρνίου
  choice: de l’Agneau
  rationale: La majuscule signale l’emploi de ἀρνίον comme titre christologique récurrent dans l’Apocalypse, tout en préservant l’image sacrificielle et messianique.
- source_word: τοῦ ἐσφαγμένου
  choice: immolé
  rationale: « Immolé » exprime à la fois la mise à mort violente et la nuance sacrificielle de σφάζω, dans un registre digne et courant dans le langage biblique français.
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: depuis la fondation du monde
  rationale: « Depuis » rend naturellement la valeur temporelle de ἀπό avec le génitif; « fondation du monde » conserve la formulation biblique et l’ambiguïté d’attachement est explicitée en note.
theological_decisions:
- issue: Rattachement syntaxique de « depuis la fondation du monde »
  choice: Rattachement à « l’Agneau immolé » dans le texte principal
  alternative: « tous ceux dont le nom n’est pas inscrit depuis la fondation du monde dans le livre de vie de l’Agneau immolé »
  rationale: L’ordre des mots grecs favorise le rattachement au participe immédiatement précédent, « immolé ». Toutefois, Apocalypse 17.8 fournit un parallèle important en faveur du rattachement à l’inscription du nom. La note conserve donc cette ambiguïté réelle sans trancher dogmatiquement.
translation_notes:
  register: Français international moderne, naturel et digne. « Les habitants de la terre » maintient le motif récurrent de l’Apocalypse; « immolé » conserve la force sacrificielle du grec. Le marqueur [a] figure dans le texte principal.
