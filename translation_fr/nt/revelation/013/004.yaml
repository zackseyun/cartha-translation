id: REV.13.4
reference: Revelation 13:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: fr
  text: 'Ils adorèrent le dragon parce qu’il avait donné l’autorité à la bête, et ils adorèrent la bête en disant : « Qui est semblable à la bête[a] et qui peut lui faire la guerre[b] ? »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Qui peut être comparé à la bête ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui peut combattre contre elle ? »'
    reason: lexical_alternative
  - marker: c
    text: Cette acclamation fait probablement écho au langage de l’Ancien Testament sur l’incomparabilité de Dieu (par exemple Exode 15.11 ; Psaume 35.10), ici appliqué de manière blasphématoire à la bête.
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: adorèrent
  rationale: Dans l’Apocalypse, προσκυνέω désigne régulièrement une vénération religieuse. « Adorèrent » rend clairement ici la portée idolâtre.
- source_word: δράκοντι
  choice: dragon
  rationale: Traduction directe et habituelle de δράκων dans l’imagerie apocalyptique, sans interpréter le symbole dans le corps du texte.
- source_word: ὅτι
  choice: parce que
  rationale: 'ὅτι introduit ici vraisemblablement la cause de l’adoration du dragon : celui-ci avait conféré son autorité à la bête.'
- source_word: ἔδωκεν
  choice: avait donné
  rationale: Le plus-que-parfait français marque naturellement l’antériorité du don par rapport à l’adoration rapportée au passé.
- source_word: τὴν ἐξουσίαν
  choice: son autorité
  rationale: ἐξουσία désigne une autorité ou un pouvoir de domination. Le possessif français explicite naturellement que l’autorité donnée procède du dragon, sans changer le sens.
- source_word: τῷ θηρίῳ
  choice: à la bête
  rationale: « Bête » est la traduction établie et exacte de θηρίον dans l’imagerie de l’Apocalypse.
- source_word: λέγοντες
  choice: en disant
  rationale: Le gérondif introduit naturellement en français les paroles qui accompagnent l’adoration.
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: Qui est semblable à la bête
  rationale: Cette formulation conserve la question rhétorique et son probable écho aux déclarations bibliques sur l’incomparabilité de Dieu.
- source_word: δύναται
  choice: peut
  rationale: « Peut » exprime directement et naturellement la capacité indiquée par δύναμαι.
- source_word: πολεμῆσαι μετ’ αὐτοῦ
  choice: lui faire la guerre
  rationale: πολεμέω a une portée militaire plus forte que le simple fait de combattre. « Faire la guerre à » rend le sens hostile de μετά avec le génitif; le pronom français reprend grammaticalement le nom féminin « bête ».
theological_decisions:
- issue: Genre du pronom reprenant la bête
  choice: Employer « lui », conformément au genre grammatical français de « bête »
  alternative: Employer une tournure qui personnalise explicitement la bête comme un être masculin
  rationale: Le grec reprend le neutre θηρίον par αὐτοῦ. Le français ne possède pas de pronom neutre équivalent dans cette construction; « lui » est imposé par le genre grammatical de « bête » et ne tranche pas davantage la question de sa personnification.
- issue: Écho au langage de l’incomparabilité divine
  choice: Conserver « Qui est semblable à la bête » sans explicitation dans le texte principal
  alternative: Paraphraser afin de rendre manifeste la parodie blasphématoire
  rationale: La formule fait probablement écho à des textes proclamant l’incomparabilité de Dieu. La traduction préserve cette tension et l’explique seulement en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique soutenu; le plus-que-parfait marque l’antériorité du don. Les marqueurs [a], [b] et [c] figurent tous dans le texte principal.
