id: REV.13.11
reference: Revelation 13:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: fr
  text: Puis je vis une autre bête qui montait de la terre[a]. Elle avait deux cornes semblables à celles d’un agneau, et elle parlait comme un dragon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui montait du pays ». Le mot grec γῆ peut signifier « terre » ou « pays ».'
    reason: Alternative lexicale réelle de γῆ, que le contexte apocalyptique ne supprime pas entièrement.
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: une autre bête
  rationale: « Bête » conserve le terme apocalyptique établi dans l’Apocalypse et sa portée symbolique hostile; ἄλλο signifie simplement « une autre ».
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: qui montait de la terre
  rationale: Le participe présent décrit la bête en train d’émerger. « Montait de » rend naturellement ce mouvement; γῆ peut désigner la terre ou le pays, ambiguïté signalée en note.
- source_word: εἶχεν κέρατα δύο
  choice: elle avait deux cornes
  rationale: L’imparfait a ici une valeur descriptive, naturellement rendue par « avait ». « Deux cornes » préserve directement l’imagerie apocalyptique de puissance et d’autorité.
- source_word: ὅμοια ἀρνίῳ
  choice: semblables à celles d’un agneau
  rationale: Le neutre pluriel ὅμοια s’accorde avec « cornes ». Cette formulation française explicite que ce sont les cornes qui ressemblent à celles d’un agneau, tout en conservant l’allusion à l’Agneau.
- source_word: ἐλάλει ὡς δράκων
  choice: mais elle parlait comme un dragon
  rationale: L’imparfait exprime une action ou une caractéristique durative. « Comme » maintient la comparaison sans assimiler explicitement la bête au dragon. « Mais » rend en français le contraste saisissant porté contextuellement par le second καί entre l’apparence d’agneau et la parole de dragon.
theological_decisions:
- issue: Rendu de ἀρνίον dans un contexte pouvant évoquer l’Agneau de l’Apocalypse
  choice: agneau
  alternative: petit agneau
  rationale: « Agneau » conserve naturellement l’écho possible à la figure de l’Agneau sans identifier la bête à celui-ci. « Petit agneau » introduirait en français une nuance affective ou diminutive excessive.
- issue: Rendu de γῆ
  choice: terre
  alternative: pays
  rationale: Les deux sens sont possibles. « Terre » convient mieux au cadre cosmique et au contraste immédiat avec la bête qui monte de la mer, sans réduire l’image à un territoire déterminé; la possibilité de « pays » est néanmoins préservée en note.
- issue: Relation entre l’apparence d’agneau et la parole de dragon
  choice: contraste exprimé par « mais »
  alternative: coordination littérale par « et »
  rationale: Le grec emploie καί, mais le français idiomatique peut marquer explicitement le contraste déjà présent entre les deux images. Ce choix n’identifie ni l’agneau ni le dragon au-delà de ce que disent les comparaisons.
translation_notes:
  register: Français international moderne, naturel et digne. La narration visionnaire reste vive; les images apocalyptiques traditionnelles (« bête », « cornes », « agneau », « dragon ») sont conservées. La reprise pronominale en deux phrases évite une longue coordination tout en gardant la progression du grec.
