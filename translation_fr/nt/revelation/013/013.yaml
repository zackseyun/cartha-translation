id: REV.13.13
reference: Revelation 13:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: fr
  text: Elle accomplit de grands signes[a], allant jusqu’à faire descendre du feu du ciel sur la terre sous les yeux des humains[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « de grands prodiges » ou « de grands miracles »; grec : « signes ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « devant les humains »; ou « en présence des humains ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: accomplit
  rationale: Avec σημεῖα, « accomplir des signes » est naturel en français biblique moderne et exprime la réalisation d’actes remarquables sans préciser leur mécanisme.
- source_word: σημεῖα μεγάλα
  choice: de grands signes
  rationale: « Signes » conserve la portée johannique et apocalyptique d’actes porteurs de sens, notamment trompeurs dans ce contexte, sans les qualifier d’emblée de miracles authentiques.
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: allant jusqu’à faire descendre du feu
  rationale: Cette formulation naturelle rend la valeur intensive de καί et rattache le feu aux grands signes; « faire descendre » anticipe le complément infinitif καταβαίνειν sans alourdir la phrase.
- source_word: πῦρ
  choice: du feu
  rationale: Le sens littéral « feu » est requis et préserve les échos prophétiques d’un feu venu du ciel.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: « Du ciel » convient au registre apocalyptique et maintient l’ambivalence entre le ciel visible et la sphère céleste.
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: faire descendre … sur la terre
  rationale: Cette tournure restitue le mouvement descendant et la destination explicitement indiquée par εἰς τὴν γῆν.
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: sous les yeux des humains
  rationale: L’expression souligne que le phénomène est publiquement visible; « humains » rend le pluriel générique ἀνθρώπων sans restriction de sexe.
theological_decisions:
- issue: Nature des signes accomplis
  choice: Décrire des signes observables sans préciser s’ils sont surnaturels dans leur origine ou trompeurs dans leur mécanisme.
  alternative: Employer « miracles » pour affirmer implicitement leur caractère surnaturel, ou parler d’illusions pour nier celui-ci.
  rationale: Le verset présente les actes comme de grands signes et le feu comme visible par les humains, mais ne tranche pas ici la question de leur mécanisme ou de leur authenticité divine.
- issue: Valeur de ἵνα dans ἵνα καὶ πῦρ ποιῇ
  choice: Rendre la conséquence ou l’extension remarquable par « allant jusqu’à ».
  alternative: Rendre explicitement un but par « afin de faire même descendre du feu ».
  rationale: Dans ce contexte, la proposition précise l’ampleur des signes accomplis. La formulation choisie préserve le lien logique sans imposer une finalité distincte qui serait peu naturelle en français.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le singulier féminin du sujet implicite, « la bête » du contexte immédiat, et privilégie « sous les yeux » pour exprimer clairement la visibilité publique du signe.
