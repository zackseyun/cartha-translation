id: REV.13.3
reference: Revelation 13:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: fr
  text: L’une de ses têtes était comme égorgée à mort[a], et sa blessure mortelle fut guérie. Et la terre entière, saisie d’étonnement, suivit la bête[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « semblait avoir été égorgée à mort ». Le grec emploie « comme », ce qui peut exprimer une apparence ou une ressemblance plutôt qu’une affirmation sans nuance.
    reason: lexical_alternative
  - marker: b
    text: Ou « tout le pays »; toutefois, dans ce contexte apocalyptique, « la terre entière » est plus probable.
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: l’une de ses têtes
  rationale: Cette formulation rend naturellement en français la construction partitive μίαν ἐκ suivie du génitif pluriel.
- source_word: ὡς ἐσφαγμένην εἰς θάνατον
  choice: était comme égorgée à mort
  rationale: « Comme » conserve la valeur comparative de ὡς sans affirmer directement la réalité de la mort; « égorgée » rend la force de σφάζω, tandis que « à mort » maintient l’intensification εἰς θάνατον.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: sa blessure mortelle
  rationale: Rendu français idiomatique du groupe génitival, désignant une blessure caractérisée par la mort ou paraissant devoir entraîner la mort.
- source_word: ἐθεραπεύθη
  choice: fut guérie
  rationale: Le passif de θεραπεύω exprime ici le rétablissement consécutif à la blessure; « guérie » est direct et transparent.
- source_word: ἐθαυμάσθη
  choice: saisie d’étonnement
  rationale: Cette expression rend la réaction d’émerveillement ou de stupéfaction sans préciser si elle est admirative, craintive ou favorable.
- source_word: ὅλη ἡ γῆ
  choice: la terre entière
  rationale: γῆ peut désigner la terre ou un pays, mais le cadre apocalyptique universel favorise ici « la terre entière ».
- source_word: ὀπίσω τοῦ θηρίου
  choice: suivit la bête
  rationale: Avec le génitif, ὀπίσω évoque le mouvement à la suite de quelqu’un et peut aussi suggérer l’adhésion; le verbe français « suivre » conserve naturellement ces deux dimensions.
- source_word: θηρίου
  choice: la bête
  rationale: « La bête » est le rendu français courant de θηρίον dans l’imagerie apocalyptique de l’Apocalypse.
theological_decisions:
- issue: Nature de la mort apparente et de la guérison de la bête
  choice: Présenter la tête comme étant « comme égorgée à mort » et sa blessure comme guérie, sans définir la nature de l’événement.
  alternative: Interpréter explicitement l’événement comme une résurrection littérale, le rétablissement symbolique d’un pouvoir politique ou une mise en scène trompeuse.
  rationale: Le grec associe ὡς, qui marque la comparaison ou l’apparence, à une blessure mortelle ensuite guérie. Il ne tranche pas entre les diverses lectures possibles; la traduction maintient donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Égorgée » conserve la violence précise de l’image grecque; « saisie d’étonnement » évite de donner à la réaction une valeur positive ou négative que le texte ne précise pas. La virgule finale est conservée parce que le verset se poursuit syntaxiquement au verset suivant.
