revisions:
- from: Et elle égare ceux qui habitent sur la terre[a] par les signes qu’il lui a été donné d’accomplir en présence de la bête. Elle dit à ceux qui habitent sur la terre de faire une image pour la bête[b], celle qui avait reçu la blessure de l’épée et qui pourtant a vécu[c].
  to: Et elle égare[a] ceux qui habitent sur la terre par les signes qu’il lui a été donné d’accomplir en présence de la bête, en disant à ceux qui habitent sur la terre de faire une image pour la bête[b], qui porte la blessure de l’épée et qui a repris vie[c].
  rationale: La révision conserve les choix lexicaux et la retenue théologique du projet, mais corrige le présent de ἔχει, formule plus clairement et plus naturellement l'effet de ἔζησεν, et replace l'ancre de note sur le terme qu'elle explique. « A repris vie » ne précise ni le mécanisme ni la nature théologique de ce retour à la vie; la variante plus littérale est conservée en note.
