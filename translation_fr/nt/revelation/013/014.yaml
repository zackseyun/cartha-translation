id: REV.13.14
reference: Revelation 13:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: fr
  text: Et elle égare[a] ceux qui habitent sur la terre par les signes qu’il lui a été donné d’accomplir en présence de la bête, en disant à ceux qui habitent sur la terre de faire une image pour la bête[b], qui porte la blessure de l’épée et qui a repris vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle trompe ceux qui habitent sur la terre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « une image de la bête » ; le grec dit plus littéralement « une image pour la bête ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « et qui a vécu ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: égare
  rationale: Le présent actif décrit l’action de tromper en détournant du vrai chemin. « Égare » conserve à la fois l’idée de tromperie et celle de conduire dans l’erreur.
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: ceux qui habitent sur la terre
  rationale: Cette formulation garde la force verbale et l’expression thématique récurrente de l’Apocalypse.
- source_word: διὰ τὰ σημεῖα
  choice: par les signes
  rationale: διά avec l’accusatif peut marquer la cause ou le moyen; ici, les signes constituent le moyen par lequel l’égarement s’opère.
- source_word: σημεῖα
  choice: signes
  rationale: « Signes » traduit directement le terme sans ajouter « miraculeux », nuance suggérée par le contexte mais non exprimée lexicalement.
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: qu’il lui a été donné d’accomplir
  rationale: La tournure passive préserve la retenue du texte sur l’identité de celui qui accorde cette capacité, tout en restant idiomatique en français.
- source_word: ἐνώπιον τοῦ θηρίου
  choice: en présence de la bête
  rationale: Cette expression rend naturellement la relation spatiale et publique indiquée par ἐνώπιον.
- source_word: λέγων
  choice: Elle dit
  rationale: Une nouvelle phrase rend clairement le participe grec en français sans lui donner la force plus précise d’un commandement.
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: faire une image pour la bête
  rationale: Le datif indique naturellement la destination ou la dédicace de l’image. « De la bête » demeure possible par implication, mais n’est pas la construction littérale.
- source_word: εἰκόνα
  choice: image
  rationale: « Image » conserve l’étendue du terme grec, notamment sa possible fonction cultuelle, sans le restreindre à une statue.
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης
  choice: celle qui avait reçu la blessure de l’épée
  rationale: Le relatif masculin renvoie à la bête, et non à l’image. Le plus-que-parfait situe naturellement la blessure antérieure dans le récit; « avait reçu » exprime en français le fait de porter cette blessure sans lourdeur.
- source_word: μάχαιρα
  choice: épée
  rationale: « Épée » est le terme français standard et suffisamment précis dans ce contexte.
- source_word: καὶ ἔζησεν
  choice: et qui pourtant a vécu
  rationale: Le passé composé rend l’aoriste narratif; « pourtant » explicite sobrement le contraste contextuel entre la blessure et la vie, sans imposer l’idée plus forte d’une résurrection.
theological_decisions:
- issue: Passif de permission dans ἐδόθη
  choice: Conserver « il lui a été donné » sans nommer celui qui donne.
  alternative: « Dieu lui a permis » ou « elle reçut le pouvoir »
  rationale: Le passif apocalyptique peut suggérer une permission souveraine, mais le texte ne désigne pas explicitement l’agent. Le maintien du passif préserve cette retenue et la tension théologique.
- issue: Portée de ἔζησεν après la blessure
  choice: « qui pourtant a vécu »
  alternative: « qui est revenue à la vie »
  rationale: Le texte affirme la vie après la blessure, mais cette proposition ne requiert pas à elle seule une formulation explicite de résurrection ou de réanimation.
- issue: Référent du pronom relatif ὃς
  choice: Faire clairement renvoyer le relatif à « la bête » par « celle qui ».
  alternative: Une formulation ambiguë pouvant sembler rattacher la proposition à « image »
  rationale: Le masculin grec ὃς s’accorde avec θηρίον selon le genre naturel/personnifié du référent dans cette construction, tandis qu’εἰκών est féminin. La traduction française doit éviter un faux rattachement grammatical à « image ».
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « ceux qui habitent sur la terre » est conservée pour maintenir le motif propre à l’Apocalypse. Le féminin « elle » reprend la seconde bête du contexte immédiat. La phrase est divisée en deux pour une lecture naturelle, sans modifier les relations syntaxiques essentielles.
