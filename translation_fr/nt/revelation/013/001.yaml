id: REV.13.1
reference: Revelation 13:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: fr
  text: Et je vis une bête monter de la mer. Elle avait dix cornes et sept têtes. Sur ses cornes se trouvaient dix diadèmes[a], et sur ses têtes, des noms blasphématoires[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « couronnes royales ».'
    reason: 'Variante lexicale : διάδημα désigne un insigne royal, rendu précisément par « diadème ».'
  - marker: b
    text: 'Littéralement : « des noms de blasphème ».'
    reason: La note conserve la construction grecque et la nuance du génitif βλασφημίας.
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Puis je vis
  rationale: Le passé simple convient au récit visionnaire et « puis » marque naturellement la progression sans ajouter l’idée explicite d’une nouvelle vision.
- source_word: ἐκ τῆς θαλάσσης
  choice: de la mer
  rationale: Avec « monter », cette formulation française exprime naturellement que la bête surgit de l’intérieur de la mer.
- source_word: θηρίον
  choice: une bête
  rationale: « Bête » conserve l’image apocalyptique traditionnelle sans l’interpréter comme un empire, un souverain ou un monstre au sens explicatif.
- source_word: ἀναβαῖνον
  choice: monter
  rationale: L’infinitif dépendant de « je vis » rend naturellement le participe présent grec et présente l’action en cours.
- source_word: ἔχον
  choice: qui avait
  rationale: La relative est plus naturelle en français moderne que le calque « ayant », tout en conservant la description.
- source_word: κέρατα δέκα καὶ κεφαλὰς ἑπτά
  choice: dix cornes et sept têtes
  rationale: Traduction directe qui maintient intacte l’imagerie symbolique.
- source_word: διαδήματα
  choice: diadèmes
  rationale: διάδημα désigne précisément un bandeau ou insigne royal. « Diadèmes » reste intelligible en français et distingue ce terme des autres mots grecs traduits par « couronne » dans l’Apocalypse.
- source_word: ἐπὶ τῶν κεράτων αὐτοῦ
  choice: Sur ses cornes
  rationale: Le complément locatif indique l’emplacement des diadèmes; le féminin de « ses » renvoie naturellement à « bête » en français.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: sur ses têtes
  rationale: La formulation conserve le rapport spatial exprimé par ἐπί sans expliquer la portée du symbole.
- source_word: ὀνόματα βλασφημίας
  choice: des noms blasphématoires
  rationale: Le génitif peut avoir une valeur qualificative. Cette formulation est claire et idiomatique, tandis que la note conserve la structure plus littérale.
theological_decisions:
- issue: Imagerie apocalyptique symbolique
  choice: Conserver littéralement la bête, les cornes, les têtes et les diadèmes sans identifier leurs référents.
  alternative: Identifier dans le texte la bête à un empire, un dirigeant, un royaume ou un agent satanique.
  rationale: Le verset donne une image visionnaire sans en expliciter ici tous les référents. La traduction ne doit pas imposer un système eschatologique.
- issue: Rapport exprimé par ὀνόματα βλασφημίας
  choice: « des noms blasphématoires »
  alternative: « des noms de blasphème » ou « des noms qui blasphémaient »
  rationale: Le génitif grec permet une qualification sans préciser si les noms sont intrinsèquement blasphématoires ou s’ils expriment un blasphème. Le texte principal reste naturel et la note signale la formulation littérale.
- issue: Valeur royale de διαδήματα
  choice: « diadèmes »
  alternative: « couronnes » ou « couronnes royales »
  rationale: Le terme français précis préserve la nuance d’insigne royal et évite de confondre διάδημα avec στέφανος, sans tirer de conclusion théologique sur la légitimité de l’autorité représentée.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est légèrement restructurée en deux phrases pour éviter une accumulation lourde de participes, tout en maintenant l’ordre des éléments de la vision. Les termes symboliques ne sont pas interprétés dans le corps du texte.
