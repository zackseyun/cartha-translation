id: REV.13.2
reference: Revelation 13:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: fr
  text: La bête que je vis ressemblait à un léopard[a] ; ses pieds étaient comme ceux d’un ours, et sa gueule comme celle d’un lion. Le dragon lui donna sa puissance, son trône et une grande autorité.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image du léopard, de l’ours et du lion fait écho aux visions des bêtes en Daniel 7.
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: bête
  rationale: Dans l’Apocalypse, « bête » conserve le sens d’un être monstrueux et la portée symbolique du terme, contrairement à « animal » ou « créature », plus neutres.
- source_word: ὅμοιον παρδάλει
  choice: ressemblait à un léopard
  rationale: ὅμοιος avec le datif exprime la ressemblance. Cette formulation est naturelle en français et préserve la comparaison visionnaire.
- source_word: πόδες
  choice: pieds
  rationale: πούς signifie normalement « pied ». « Pieds » suit le grec sans préciser « pattes », même si l’image est animale.
- source_word: ὡς ἄρκου
  choice: comme ceux d’un ours
  rationale: La comparaison grecque est elliptique après « ses pieds ». Le français demande naturellement le pronom « ceux ».
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: gueule comme celle d’un lion
  rationale: Pour des animaux, « gueule » est le terme français naturel. « Celle » reprend explicitement le nom sans lourdeur, tout en conservant l’équilibre de la description.
- source_word: δράκων
  choice: dragon
  rationale: « Dragon » est l’équivalent direct et le terme apocalyptique établi dans ce livre.
- source_word: ἔδωκεν
  choice: donna
  rationale: Le verbe δίδωμι signifie directement « donner » ; le passé simple convient au registre narratif biblique moderne et soutenu.
- source_word: δύναμιν
  choice: puissance
  rationale: « Puissance » désigne ici la capacité d’agir transmise par le dragon et reste distincte de l’autorité, ἐξουσία.
- source_word: θρόνον
  choice: trône
  rationale: Le terme conserve sans paraphrase les connotations royales et gouvernementales de θρόνος.
- source_word: ἐξουσίαν μεγάλην
  choice: une grande autorité
  rationale: « Autorité » exprime le pouvoir ou droit d’exercer une domination, distinct de la « puissance » ; μεγάλην est rendu par « grande ».
- source_word: αὐτοῦ / αὐτῷ
  choice: sa / son / lui
  rationale: Le français emploie naturellement des pronoms personnels et possessifs pour les deux figures. Dans la dernière phrase, « lui » désigne clairement la bête, tandis que « sa puissance » et « son trône » renvoient au dragon.
theological_decisions:
- issue: Rapport entre le dragon et la bête dans le rendu des pronoms
  choice: Employer « lui » pour la bête et les possessifs « sa » et « son » pour ce qui appartient au dragon.
  alternative: Répéter les noms afin de lever toute possibilité d’ambiguïté.
  rationale: Le contexte grammatical français distingue suffisamment les référents sans ajouter d’explication. Les deux personnages demeurent des agents de la vision, conformément au grec.
- issue: Maintien de l’imagerie animale composite sans développement interprétatif
  choice: Traduire directement les comparaisons avec le léopard, l’ours et le lion.
  alternative: Signaler explicitement dans le corps du texte l’allusion à Daniel 7.
  rationale: Le texte grec présente les images sans les interpréter. Le rapprochement avec Daniel appartient à la note plutôt qu’au texte traduit.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple (« vis », « donna ») maintient un registre narratif biblique soutenu sans archaïsme. « Gueule » est idiomatique pour les animaux et évite l’étrangeté de « bouche » dans ce contexte.
