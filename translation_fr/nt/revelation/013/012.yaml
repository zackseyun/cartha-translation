id: REV.13.12
reference: Revelation 13:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: fr
  text: Elle exerce toute l’autorité de la première bête en sa présence[a]. Elle amène la terre et ceux qui y habitent à adorer la première bête, celle dont la blessure mortelle a été guérie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « devant elle ». L’expression peut indiquer que la seconde bête agit sous le regard de la première ou directement devant elle.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « dont la blessure de mort a été guérie » ; autrement dit, sa blessure mortelle.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: autorité
  rationale: Le terme désigne ici l’autorité mise en œuvre plutôt qu’une simple puissance brute.
- source_word: πᾶσαν
  choice: toute
  rationale: L’adjectif souligne que l’autorité de la première bête est exercée dans sa totalité.
- source_word: ποιεῖ (première occurrence)
  choice: exerce
  rationale: Avec « autorité », « exercer » rend naturellement l’idée de mettre cette autorité en œuvre.
- source_word: ἐνώπιον αὐτοῦ
  choice: en sa présence
  rationale: Cette expression conserve la valeur spatiale et relationnelle du grec sans décider si l’accent porte sur le regard, l’approbation ou la proximité.
- source_word: ποιεῖ (deuxième occurrence)
  choice: amène … à
  rationale: La tournure causative indique que la seconde bête produit ce comportement, sans préciser à elle seule le degré de contrainte.
- source_word: τὴν γῆν
  choice: la terre
  rationale: Dans ce contexte apocalyptique, « la terre » convient mieux que le sens plus local de « pays ».
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: ceux qui y habitent
  rationale: Cette formulation naturelle garde la texture verbale et le motif récurrent des habitants de la terre dans l’Apocalypse.
- source_word: ἵνα προσκυνήσουσιν
  choice: à adorer
  rationale: Après le verbe causatif, l’infinitif français exprime clairement l’action produite ou visée.
- source_word: θηρίον
  choice: bête
  rationale: « Bête » est la traduction directe et consacrée dans le contexte apocalyptique.
- source_word: πρῶτον
  choice: première
  rationale: L’adjectif distingue cette bête de celle décrite dans le contexte immédiat.
- source_word: ἐθεραπεύθη
  choice: a été guérie
  rationale: Le passif conserve explicitement le motif de la guérison.
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: sa blessure mortelle
  rationale: Cette expression française idiomatique rend une blessure caractérisée par la mort, sans reproduire maladroitement le génitif grec.
theological_decisions:
- issue: Force de l’action de la seconde bête sur les habitants de la terre
  choice: amène … à adorer
  alternative: force … à adorer ; fait que … adorent
  rationale: Le grec exprime une relation causative, mais ce membre de phrase ne définit pas précisément le degré de coercition. « Amène … à » préserve cette latitude.
translation_notes:
  register: Français international moderne, naturel et digne. Les pronoms féminins suivent le genre grammatical de « bête ». La répétition de « première bête » est conservée pour la clarté et la fidélité au texte.
