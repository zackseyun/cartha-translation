- from: Elle mit au monde un fils, un enfant mâle, qui doit faire paître toutes les nations avec un sceptre de fer[a]. Et son enfant fut enlevé auprès de Dieu et de son trône.
  to: Elle mit au monde un fils, un garçon, qui doit faire paître toutes les nations avec un bâton de fer[a]. Et son enfant fut enlevé vers Dieu et vers son trône.
  rationale: La révision restitue le mouvement vers Dieu et vers son trône, évite d’interpréter ῥάβδος comme « sceptre » dans le texte principal, et améliore la fluidité de l’apposition emphatique. Elle conserve la portée future-destinée de μέλλει et la métaphore pastorale de ποιμαίνειν.
