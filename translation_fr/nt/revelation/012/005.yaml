id: REV.12.5
reference: Revelation 12:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: fr
  text: Elle mit au monde un fils, un garçon, qui doit faire paître toutes les nations avec un bâton de fer[a]. Et son enfant fut enlevé vers Dieu et vers son trône.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « gouverner toutes les nations avec un bâton de fer ». Le verbe grec signifie littéralement « faire paître » ou « conduire comme un berger »; dans cette allusion au Psaume 2, il exprime aussi l’autorité royale.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: mit au monde
  rationale: Expression française naturelle qui conserve l’image concrète de l’accouchement.
- source_word: υἱόν, ἄρσεν
  choice: un fils, un enfant mâle
  rationale: Conserve les deux éléments grecs et leur effet d’insistance, sans réduire l’apposition à un seul terme.
- source_word: μέλλει ποιμαίνειν
  choice: doit faire paître
  rationale: « Doit » exprime ici l’action future assignée ou destinée, plus naturellement que l’imminence stricte; « faire paître » maintient la métaphore pastorale.
- source_word: ποιμαίνειν
  choice: faire paître
  rationale: Préserve le sens propre de ποιμαίνω et l’image pastorale, tout en laissant la note signaler sa portée royale dans l’allusion au Psaume 2.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Désigne largement les peuples du monde et correspond à l’écho du Psaume 2.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: avec un sceptre de fer
  rationale: Dans ce contexte royal, « sceptre » rend naturellement ῥάβδος et maintient l’écho traditionnel du Psaume 2; « avec » conserve la valeur instrumentale de ἐν.
- source_word: ἡρπάσθη
  choice: fut enlevé
  rationale: Le passif exprime un retrait soudain vers Dieu; « enlevé » est naturel en français et garde le mouvement ascendant donné par le contexte.
- source_word: τὸ τέκνον αὐτῆς
  choice: son enfant
  rationale: Respecte le passage de υἱός à τέκνον dans le grec.
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: auprès de Dieu et de son trône
  rationale: Rend la destination et la proximité exprimées par πρὸς dans un français fluide, sans laisser entendre que l’enfant est seulement remis à Dieu.
theological_decisions:
- issue: Allusion messianique au Psaume 2 dans ποιμαίνειν … ἐν ῥάβδῳ σιδηρᾷ
  choice: Conserver dans le texte l’image pastorale « faire paître » et signaler en note le sens royal.
  alternative: gouverner toutes les nations avec un sceptre de fer
  rationale: Le contexte évoque clairement l’autorité royale messianique, mais le verbe grec est ποιμαίνω, « faire paître, être berger ». La traduction ne doit pas remplacer silencieusement la métaphore par son interprétation.
- issue: Valeur de μέλλει
  choice: « doit faire paître »
  alternative: « est sur le point de faire paître » ou « fera paître »
  rationale: μέλλω avec l’infinitif peut marquer l’imminence ou une action destinée à s’accomplir. Ici, « doit » préserve la visée future et le caractère assigné de l’action sans imposer une imminence chronologique trop étroite.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif élevé de l’Apocalypse. La répétition appositionnelle « un fils, un enfant mâle » est volontairement conservée malgré sa légère solennité.
