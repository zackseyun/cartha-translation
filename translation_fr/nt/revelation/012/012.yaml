id: REV.12.12
reference: Revelation 12:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: fr
  text: C’est pourquoi, réjouissez-vous, cieux, et vous qui y habitez ! Malheur à la terre[a] et à la mer, car le diable est descendu jusqu’à vous, animé d’une grande fureur[b], sachant qu’il ne lui reste que peu de temps[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au pays ». Le grec γῆ peut désigner la terre entière ou un territoire; « terre » convient mieux ici à la portée cosmique du contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « rempli d’une grande colère ».
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « il a peu de temps ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Marque naturellement en français la conséquence tirée de la victoire céleste décrite auparavant.
- source_word: εὐφραίνεσθε
  choice: réjouissez-vous
  rationale: Conserve la force impérative et le registre solennel sans archaïsme.
- source_word: οἱ οὐρανοὶ
  choice: cieux
  rationale: Le nominatif grec a ici valeur de vocatif. En français, l’adresse directe est claire sans ajouter « ô », qui donnerait une tonalité plus archaïque.
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: vous qui y habitez
  rationale: Rend le sens de résidence de σκηνόω et la valeur d’adresse directe, tout en évitant le calque opaque « qui y dressez votre tente ».
- source_word: οὐαὶ
  choice: Malheur à
  rationale: Formule française usuelle de lamentation et de jugement prophétique.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: la terre et la mer
  rationale: γῆ peut désigner la terre ou un territoire. La portée cosmique du passage et son association avec la mer favorisent « terre ».
- source_word: κατέβη
  choice: est descendu
  rationale: Le passé composé exprime un événement accompli dont les effets se font sentir dans la situation présente.
- source_word: ὁ διάβολος
  choice: le diable
  rationale: Dans ce contexte, διάβολος fonctionne comme le titre établi de Satan; « le diable » est l’équivalent français normal.
- source_word: πρὸς ὑμᾶς
  choice: jusqu’à vous
  rationale: Exprime le mouvement et l’arrivée dans la sphère visée, sans introduire explicitement l’idée d’hostilité déjà manifeste dans le contexte.
- source_word: ἔχων θυμὸν μέγαν
  choice: animé d’une grande fureur
  rationale: θυμός désigne ici une colère intense. Cette formulation est vive et naturelle, tout en conservant la construction participiale.
- source_word: εἰδὼς
  choice: sachant
  rationale: Préserve la construction participiale grecque et présente cette connaissance comme concomitante et explicative.
- source_word: ὀλίγον καιρὸν ἔχει
  choice: il ne lui reste que peu de temps
  rationale: Formulation idiomatique française qui souligne la brièveté de la période encore à sa disposition; la note fournit la forme plus littérale.
theological_decisions:
- issue: Référent de « vous » dans « le diable est descendu jusqu’à vous »
  choice: L’adresse passe de ceux qui sont dans les cieux à la terre et à la mer; « vous » vise donc le domaine terrestre qui vient de recevoir l’annonce de malheur.
  alternative: « Vous » continuerait à désigner rhétoriquement les cieux et ceux qui y habitent.
  rationale: Le lien immédiat entre « Malheur à la terre et à la mer » et « il est descendu jusqu’à vous » favorise le domaine terrestre, tout en laissant au langage symbolique du texte son ampleur sans préciser davantage les habitants concernés.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste dramatique entre la joie céleste et le malheur terrestre est renforcé par la ponctuation, sans ajout interprétatif. « Cieux » conserve la forme plurielle du grec; les formulations archaïsantes comme « ô cieux » ou « tabernacler » ont été évitées.
