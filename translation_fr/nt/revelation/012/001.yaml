id: REV.12.1
reference: Revelation 12:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: fr
  text: 'Puis un grand signe apparut dans le ciel : une femme revêtue du soleil, la lune sous ses pieds et, sur sa tête, une couronne[a] de douze étoiles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une guirlande » ou « une couronne de vainqueur » ; le mot grec est στέφανος, distinct du diadème royal.
    reason: Préciser la nuance lexicale de στέφανος sans alourdir le texte principal.
lexical_decisions:
- source_word: σημεῖον
  choice: signe
  rationale: Dans l’Apocalypse, le terme désigne couramment un signe visionnaire porteur d’une signification symbolique, plutôt qu’un simple prodige.
- source_word: μέγα
  choice: grand
  rationale: « Grand » rend naturellement à la fois l’ampleur et l’importance du signe dans ce contexte apocalyptique.
- source_word: ὤφθη
  choice: apparut
  rationale: Bien que la forme grecque soit passive (« fut vu »), « apparut » est plus naturel en français pour rapporter une vision et conserve l’idée d’une manifestation visible.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: « Ciel » convient mieux que « voûte céleste » ou « firmament » au cadre visionnaire de l’Apocalypse, sans préciser indûment s’il s’agit du ciel visible ou du domaine céleste.
- source_word: γυνή
  choice: une femme
  rationale: Le verset présente une figure féminine symbolique sans l’identifier comme épouse.
- source_word: περιβεβλημένη τὸν ἥλιον
  choice: revêtue du soleil
  rationale: Le participe parfait exprime un état durable d’habillement ou d’enveloppement; cette formulation française conserve l’image avec dignité et naturel.
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: la lune sous ses pieds
  rationale: Cette formulation concise reproduit directement la disposition spatiale de la vision.
- source_word: στέφανος
  choice: couronne
  rationale: « Couronne » est le terme français le plus clair dans le corps du texte; une note précise qu’il s’agit du στέφανος, distinct du diadème royal.
- source_word: ἀστέρων δώδεκα
  choice: de douze étoiles
  rationale: Cette construction rend simplement le génitif grec et préserve l’image sans ajouter d’interprétation.
theological_decisions:
- issue: Identité symbolique de la femme
  choice: Ne pas identifier la femme; la décrire uniquement comme une figure du signe visionnaire.
  alternative: L’identifier à Israël, à Marie, au peuple de Dieu ou à l’Église.
  rationale: Le verset ne donne ici aucune identification explicite. Une traduction descriptive préserve l’ambiguïté et évite d’introduire une interprétation confessionnelle.
translation_notes:
  register: Français international moderne, fluide et digne. « Puis » assure naturellement la continuité narrative du Καί initial. La structure descriptive et les images du grec sont conservées sans identifier la femme ni expliquer le symbolisme.
