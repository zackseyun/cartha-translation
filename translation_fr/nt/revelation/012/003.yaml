id: REV.12.3
reference: Revelation 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: fr
  text: 'Un autre signe apparut dans le ciel : voici, un grand dragon rouge feu, avec sept têtes et dix cornes, et sur ses têtes sept diadèmes[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couronnes ». Le grec dit plus précisément « diadèmes », c’est-à-dire des bandeaux royaux, distincts des couronnes remises aux vainqueurs.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: apparut
  rationale: Dans le récit visionnaire, le passif aoriste de ὁράω fonctionne idiomatiquement au sens d’« apparaître » ; « fut vu » serait plus formel mais moins naturel.
- source_word: ἄλλο σημεῖον
  choice: un autre signe
  rationale: σημεῖον désigne ici une réalité symbolique donnée à voir ; « signe » est clair, courant et cohérent avec le contexte de l’Apocalypse.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Dans le contexte cosmique et visionnaire de l’Apocalypse, « ciel » convient mieux que le seul sens atmosphérique.
- source_word: ἰδοὺ
  choice: voici
  rationale: « Voici » conserve la fonction présentative et l’effet soudain de ἰδού dans un registre biblique digne, sans l’archaïsme de « voici que » obligatoire.
- source_word: δράκων μέγας πυρρός
  choice: un grand dragon rouge feu
  rationale: « Grand dragon » garde l’ampleur de μέγας. « Rouge feu » exprime la teinte rouge ardente de πυρρός avec une formulation française naturelle et vive.
- source_word: ἔχων
  choice: avec
  rationale: Le français descriptif emploie naturellement « avec » ici ; le sens de possession du participe est pleinement conservé sans la lourdeur de « ayant ».
- source_word: κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: sept têtes et dix cornes
  rationale: Traduction directe qui préserve les éléments de la vision sans les interpréter.
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: sur ses têtes
  rationale: La préposition indique la position des diadèmes ; le possessif français convient au référent masculin « dragon ».
- source_word: ἑπτὰ διαδήματα
  choice: sept diadèmes
  rationale: διάδημα désigne précisément l’insigne royal appelé diadème, distinct de la couronne de victoire (στέφανος).
theological_decisions:
- issue: Valeur de la couleur πυρρός
  choice: rouge feu
  alternative: rouge ; rouge ardent
  rationale: « Rouge feu » conserve le lien lexical avec la couleur du feu sans transformer la description en symbole théologique explicite.
- issue: Nature de σημεῖον
  choice: signe
  alternative: prodige
  rationale: « Signe » préserve la portée symbolique de la vision sans suggérer nécessairement un miracle ni expliquer d’avance sa signification.
- issue: Distinction entre διάδημα et στέφανος
  choice: diadèmes
  alternative: couronnes
  rationale: Le terme précis maintient la connotation de royauté ou de prétention royale tout en évitant de confondre ces insignes avec les couronnes de victoire.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation française remplace l’enchaînement grec par deux-points après l’annonce du signe. « Voici » garde l’effet visionnaire ; « avec » allège la description sans perte de sens.
