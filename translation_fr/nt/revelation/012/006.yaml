language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: fr
  text: Et la femme s’enfuit au désert, où elle a un lieu préparé par Dieu, afin qu’on l’y nourrisse[a] pendant mille deux cent soixante jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « afin qu’ils la nourrissent là pendant mille deux cent soixante jours ». Le verbe grec est à la troisième personne du pluriel, mais son sujet n’est pas précisé. Autre traduction possible : « afin qu’elle y soit nourrie pendant mille deux cent soixante jours ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγεν
  choice: s’enfuit
  rationale: L’aoriste de φεύγω exprime ici la fuite; « s’enfuit » est précis, vif et naturel en français.
- source_word: ἔρημον
  choice: désert
  rationale: Dans ce contexte biblique, « désert » désigne une région inhabitée ou solitaire sans imposer l’idée d’une étendue sablonneuse.
- source_word: τόπον
  choice: un lieu
  rationale: « Un lieu » rend directement τόπον dans un registre digne et courant.
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: préparé par Dieu
  rationale: Le participe parfait passif présente ce lieu comme déjà aménagé, et ἀπό introduit ici l’agent personnel.
- source_word: ἵνα
  choice: afin que
  rationale: « Afin que » conserve clairement la valeur finale de ἵνα et convient au registre biblique moderne.
- source_word: τρέφωσιν αὐτὴν
  choice: qu’on la nourrisse
  rationale: Le grec emploie un pluriel actif sans sujet exprimé. Le pronom indéfini français « on » garde l’agent non identifié tout en produisant une phrase naturelle; « nourrir » peut inclure l’entretien durable, et pas seulement un repas ponctuel.
- source_word: ἐκεῖ
  choice: y
  rationale: Le pronom adverbial « y » reprend naturellement le lieu mentionné et conserve l’insistance locale sans lourdeur.
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: pendant mille deux cent soixante jours
  rationale: L’accusatif marque l’étendue de temps; « pendant » l’exprime naturellement. Le nombre est écrit en toutes lettres pour la prose biblique.
theological_decisions:
- issue: Sujet non exprimé de τρέφωσιν
  choice: « qu’on l’y nourrisse », avec un agent indéterminé
  alternative: « qu’ils l’y nourrissent » ou « pour qu’elle y soit nourrie »
  rationale: Le pluriel actif grec n’identifie aucun agent. Le français « on » préserve cette indétermination sans attribuer explicitement l’action à Dieu. Une note signale la forme littérale afin de ne pas masquer l’ambiguïté grammaticale.
translation_notes:
  register: Français international moderne, clair et digne. « Désert » garde la résonance biblique d’un lieu retiré. La tournure « où elle a un lieu » suit de près la structure grecque tout en évitant la redondance peu naturelle « où elle a là ». Le marqueur de note est placé après la proposition concernée.
