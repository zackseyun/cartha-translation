revisions:
- from: Alors le serpent lança de sa bouche, à la poursuite de la femme[a], de l’eau comme un fleuve, afin de la faire emporter par le fleuve[b].
  to: Alors le serpent lança de l’eau comme un fleuve hors de sa bouche, à la poursuite de la femme[a], afin de la faire emporter par le fleuve[b].
  rationale: La révision ne modifie pas le sens du verset. Elle rend la syntaxe française plus fluide et corrige la note sur ποταμοφόρητον ποιήσῃ afin qu’elle reflète à la fois l’image d’être emportée par un fleuve et la construction causative avec ποιέω. L’ambiguïté de ὀπίσω demeure signalée sans imposer une interprétation symbolique.
