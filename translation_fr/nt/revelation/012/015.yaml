id: REV.12.15
reference: Revelation 12:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: fr
  text: Alors le serpent lança de l’eau comme un fleuve hors de sa bouche, à la poursuite de la femme[a], afin de la faire emporter par le fleuve[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « derrière la femme ». Le grec peut indiquer une position derrière elle ou un mouvement à sa poursuite.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « afin de la faire devenir emportée par un fleuve ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: lança
  rationale: Le verbe βάλλω signifie « jeter, lancer ». « Lança » exprime naturellement en français l’action hostile sans ajouter une intensité absente du verbe lui-même.
- source_word: ὁ ὄφις
  choice: le serpent
  rationale: « Serpent » conserve la désignation biblique et la portée symbolique de ὄφις dans l’Apocalypse.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: de sa bouche
  rationale: Formulation française naturelle qui indique clairement que l’eau sort de la bouche du serpent.
- source_word: ὀπίσω τῆς γυναικός
  choice: à la poursuite de la femme
  rationale: Dans cette scène d’attaque, ὀπίσω suivi du génitif peut exprimer un mouvement dirigé à la suite de quelqu’un. La note conserve l’autre lecture spatiale possible.
- source_word: ὕδωρ ὡς ποταμόν
  choice: de l’eau comme un fleuve
  rationale: Cette traduction maintient la comparaison introduite par ὡς et conserve l’image explicite du fleuve, sans la remplacer par une interprétation telle que « déluge » ou « torrent ».
- source_word: ἵνα
  choice: afin de
  rationale: « Afin de » rend clairement la visée de l’attaque exprimée par ἵνα.
- source_word: ποταμοφόρητον ποιήσῃ
  choice: la faire emporter par le fleuve
  rationale: Le rare adjectif ποταμοφόρητος signifie littéralement « emporté par un fleuve »; associé à ποιέω, il forme une expression causative. La tournure française conserve cette structure et l’image du fleuve.
theological_decisions:
- issue: Interprétation de l’eau dans l’imagerie apocalyptique
  choice: Conserver dans le texte l’image de l’eau semblable à un fleuve, sans identifier son référent symbolique.
  alternative: Traduire explicitement l’eau comme des armées, la persécution, des mensonges ou le chaos.
  rationale: Le grec présente une image symbolique sans l’expliquer dans ce verset. La traduction ne doit pas imposer une interprétation théologique particulière.
- issue: Portée de ὀπίσω τῆς γυναικός
  choice: Rendre le mouvement hostile par « à la poursuite de la femme », tout en signalant l’alternative spatiale.
  alternative: « derrière la femme »
  rationale: Le contexte favorise la poursuite, mais la construction grecque admet une lecture spatiale; cette ambiguïté réelle est donc conservée en note.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste vive et narrative; l’imagerie apocalyptique ainsi que la répétition de « fleuve » sont maintenues afin de refléter le grec.
