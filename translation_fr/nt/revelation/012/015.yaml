review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : le serpent projette de l’eau comparable à un fleuve dans le but de faire emporter la femme par ce fleuve. « À la poursuite de » rend de façon contextuellement défendable ὀπίσω, tout en signalant correctement l’alternative spatiale en note. La note b actuelle, cependant, traduit trop littéralement ποταμοφόρητον par une expression française non idiomatique (« rendre emportée ») et ne rend pas clairement la valeur causative de ποιήσῃ.'
  naturalness: La construction « lança de sa bouche, à la poursuite de la femme, de l’eau » sépare maladroitement le verbe de son complément direct et alourdit la phrase. Placer « de sa bouche » après le groupe nominal rend la formulation nette et naturelle en français moderne.
  terminology: « Serpent », « femme », « eau », « fleuve » et la répétition de « fleuve » sont appropriés et préservent l’imagerie apocalyptique sans interprétation doctrinale ajoutée. « Afin de la faire emporter par le fleuve » exprime bien le tour causatif grec.
  issues:
  - severity: low
    issue: Ordre des constituants peu naturel
    rationale: Dans « lança de sa bouche, à la poursuite de la femme, de l’eau », les compléments intercalés retardent inutilement l’objet direct. Une réorganisation conserve exactement le sens tout en améliorant la lisibilité.
  - severity: medium
    issue: Note b insuffisamment idiomatique et causative
    rationale: « Afin de la rendre emportée par le fleuve » est un calque peu français. La note doit indiquer que le grec signifie littéralement qu’il voulait la faire devenir « emportée par un fleuve », soit la faire emporter par le fleuve.
  revised_text: Alors le serpent lança de l’eau comme un fleuve hors de sa bouche, à la poursuite de la femme[a], afin de la faire emporter par le fleuve[b].
