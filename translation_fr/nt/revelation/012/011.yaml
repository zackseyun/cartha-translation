id: REV.12.11
reference: Revelation 12:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: fr
  text: Ils l’ont vaincu par le sang de l’Agneau et par la parole de leur témoignage[a], et ils n’ont pas aimé leur vie jusqu’à la mort[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par le message de leur témoignage ». Littéralement : « par la parole de leur témoignage ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « leur âme ». Le grec psychē peut désigner la vie, la personne elle-même ou l’âme. Dans ce contexte, « vie » désigne la vie exposée à la mort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: ont vaincu
  rationale: Le verbe exprime la victoire sur un adversaire. « Vaincre » conserve l’imagerie de combat propre à l’Apocalypse et convient naturellement avec le pronom objet « l’ ».
- source_word: διὰ τὸ αἷμα
  choice: par le sang
  rationale: Avec l’accusatif, διά peut indiquer la cause ou le moyen. « Par le sang » maintient ici cette légère ouverture tout en présentant naturellement le sang de l’Agneau comme ce par quoi la victoire est remportée.
- source_word: τοῦ ἀρνίου
  choice: de l’Agneau
  rationale: Dans l’Apocalypse, ἀρνίον est un titre christologique. La majuscule française signale ce titre sans explicitation doctrinale ajoutée.
- source_word: τὸν λόγον τῆς μαρτυρίας αὐτῶν
  choice: la parole de leur témoignage
  rationale: Cette formulation conserve les deux éléments grecs, λόγος et μαρτυρία, ainsi que la possibilité que λόγος désigne leur parole proclamée ou le message dont ils témoignent.
- source_word: οὐκ ἠγάπησαν
  choice: ils n’ont pas aimé
  rationale: La traduction garde le sens lexical ordinaire d’ἀγαπάω et évite de remplacer d’emblée l’expression par une paraphrase telle que « tenir à ».
- source_word: τὴν ψυχὴν αὐτῶν
  choice: leur vie
  rationale: Dans ce contexte de mort, ψυχή désigne naturellement la vie terrestre de chacun. Le singulier distributif du grec est conservé en français.
- source_word: ἄχρι θανάτου
  choice: au point de reculer devant la mort
  rationale: Dans la construction française avec « ne pas aimer leur vie », cette formulation explicite idiomatiquement que leur attachement à la vie ne les a pas arrêtés face à la mort, sans suggérer qu’ils recherchaient la mort.
theological_decisions:
- issue: La victoire par le sang de l’Agneau
  choice: « par le sang de l’Agneau »
  alternative: « à cause du sang de l’Agneau »
  rationale: La traduction conserve la formulation compacte du texte et son possible accent instrumental, sans développer une théorie particulière de l’expiation.
- issue: Le sens de ψυχή dans le contexte du martyre
  choice: « leur vie »
  alternative: « leur âme »
  rationale: Le contexte porte sur l’acceptation de la mort. « Vie » évite d’introduire une opposition entre corps et âme qui n’est pas exigée par le grec.
- issue: La portée de ἄχρι θανάτου
  choice: « au point de reculer devant la mort »
  alternative: « jusqu’à la mort »
  rationale: 'Rattaché littéralement à « ils n’ont pas aimé leur vie », « jusqu’à la mort » serait peu naturel ou ambigu en français. La formulation choisie rend le sens contextuel : ils n’ont pas préféré leur vie au témoignage quand la mort se présentait.'
translation_notes:
  register: Français international moderne, solennel sans archaïsme. La dislocation « Eux, ils » rend l’insistance de καὶ αὐτοί. La phrase demeure proche de la structure grecque, tandis que la dernière proposition est formulée idiomatiquement et accompagnée d’une note littérale.
