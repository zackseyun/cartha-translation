review_pass:
  verdict: revise
  source_fidelity: 'Le sens fondamental est fidèlement rendu : le dragon est identifié au serpent ancien, au Diable et à Satan; il égare le monde entier; lui et ses anges sont précipités sur la terre. La triple répétition de ἐβλήθη/ἐβλήθησαν est conservée.'
  naturalness: La formulation initiale « Et il fut précipité, le grand dragon » est possible dans un registre littéraire, mais elle est moins naturelle et moins immédiatement claire en français international moderne que l’antéposition explicite du sujet. « Fut précipité sur la terre » convient au mouvement et à l’opposition contextuelle entre ciel et terre.
  terminology: « Le grand dragon », « le serpent ancien », « le Diable », « Satan » et « ses anges » sont appropriés. « Égare » rend bien πλανῶν sans réduire le terme à une tromperie purement intellectuelle. La note a doit toutefois présenter une véritable variante lexicale et conserver plus précisément la nuance de « monde habité ».
  issues:
  - severity: low
    issue: Ordre de la première proposition
    rationale: L’inversion avec pronom anticipatif (« il fut précipité, le grand dragon ») est plus lourde en français moderne. « Le grand dragon fut précipité » rend la même emphase sans ambiguïté.
  - severity: low
    issue: Note a insuffisamment distinctive
    rationale: « Qui égare toute la terre habitée » ne propose guère d’alternative au texte principal et « terre habitée » est moins exact ici que « monde habité » pour οἰκουμένη. Une note avec « trompe » et « monde habité » représente une réelle possibilité de traduction.
  revised_text: 'Et le grand dragon fut précipité : le serpent ancien[b], celui qu’on appelle le Diable et Satan, celui qui égare le monde entier[a]. Il fut précipité sur la terre, et ses anges furent précipités avec lui.'
  revised_footnotes:
