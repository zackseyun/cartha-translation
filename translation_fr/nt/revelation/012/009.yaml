revisions:
- from: Et il fut précipité, le grand dragon, le serpent ancien[b], celui qu’on appelle le Diable et Satan, celui qui égare le monde entier[a]. Il fut précipité sur la terre, et ses anges furent précipités avec lui.
  to: 'Et le grand dragon fut précipité : le serpent ancien[b], celui qu’on appelle le Diable et Satan, celui qui égare le monde entier[a]. Il fut précipité sur la terre, et ses anges furent précipités avec lui.'
  rationale: La révision explicite le sujet dès l’ouverture pour une syntaxe française plus naturelle, tout en préservant les appositions et la répétition emphatique de « fut précipité ». La note a est reformulée pour fournir une variante sémantiquement réelle de πλανῶν et une expression plus précise de la nuance de οἰκουμένη.
  reviewer_model: gpt-5.6-terra
