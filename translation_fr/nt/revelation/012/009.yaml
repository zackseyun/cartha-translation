id: REV.12.9
reference: Revelation 12:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: fr
  text: 'Et le grand dragon fut précipité : le serpent ancien[b], celui qu’on appelle le Diable et Satan, celui qui égare le monde entier[a]. Il fut précipité sur la terre, et ses anges furent précipités avec lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui trompe le monde habité tout entier ».",
    reason: lexical_alternative
  - marker: b
    text: L’expression « le serpent ancien » fait écho au serpent de Genèse 3.
    reason: cross_reference
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: fut précipité / furent précipités
  rationale: Le passif de βάλλω exprime ici une expulsion violente vers le bas. « Précipiter » convient au mouvement décrit et permet de conserver la triple répétition emphatique du verbe grec.
- source_word: δράκων ὁ μέγας
  choice: le grand dragon
  rationale: « Dragon » conserve directement l’image apocalyptique du texte.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: le serpent ancien
  rationale: « Serpent » maintient l’écho biblique de Genèse 3, tandis qu’« ancien » rend ἀρχαῖος sans imposer l’interprétation plus forte de « primordial ».
- source_word: ὁ καλούμενος
  choice: celui qu’on appelle
  rationale: Cette tournure française naturelle conserve la fonction identificatrice du participe grec.
- source_word: Διάβολος
  choice: le Diable
  rationale: Dans ce contexte, le terme fonctionne comme un titre ou nom reconnu plutôt que comme le simple nom commun « calomniateur ».
- source_word: Σατανᾶς
  choice: Satan
  rationale: La translittération traditionnelle française traite ici Σατανᾶς comme un nom ou titre propre reconnu.
- source_word: ὁ πλανῶν
  choice: celui qui égare
  rationale: πλανάω signifie faire dévier, égarer ou tromper. « Égarer » préserve l’image dynamique sans réduire le sens à la seule tromperie intellectuelle.
- source_word: τὴν οἰκουμένην ὅλην
  choice: le monde entier
  rationale: Cette expression française naturelle communique la portée universelle de l’expression, tout en laissant en note son sens plus littéral de monde habité.
- source_word: εἰς τὴν γῆν
  choice: sur la terre
  rationale: Le contexte oppose le ciel à la terre; « sur la terre » exprime naturellement en français la destination de la chute.
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: ses anges
  rationale: Dans ce contexte apocalyptique, ἄγγελοι désigne des êtres célestes associés au dragon, non de simples messagers humains.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: La formulation simple rend précisément l’accompagnement exprimé par le grec.
theological_decisions:
- issue: Identification du dragon par Διάβολος et Σατανᾶς
  choice: celui qu’on appelle le Diable et Satan
  alternative: appelé le Diable et l’Adversaire
  rationale: Le grec juxtapose plusieurs désignations du dragon. Les formes françaises conventionnelles conservent cette identification sans ajouter d’élaboration doctrinale.
- issue: Portée de οἰκουμένη
  choice: le monde entier
  alternative: toute la terre habitée
  rationale: Le choix principal rend naturellement la portée universelle dans ce contexte apocalyptique; la note conserve la nuance lexicale plus précise de « monde habité ».
- issue: Relation avec le serpent de Genèse 3
  choice: Conserver « le serpent ancien » et signaler l’écho en note
  alternative: le serpent primordial
  rationale: Le texte évoque fortement Genèse 3 sans expliciter ici tous les contours de cette identification. La formulation et la note préservent l’allusion sans la surdéterminer.
translation_notes:
  register: Français international moderne, digne et accessible. La construction en apposition reflète la solennité du grec; la triple répétition de « fut précipité » en conserve l’insistance. Les marqueurs [a] et [b] sont placés dans le texte auprès des expressions auxquelles leurs notes se rapportent.
