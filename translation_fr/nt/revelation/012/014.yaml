revisions:
- from: Et les deux ailes du grand aigle furent données à la femme, afin qu’elle s’envole dans le désert, jusqu’au lieu qui lui est réservé, où elle est nourrie pendant un temps, des temps et la moitié d’un temps, loin de la face du serpent.
  to: Et les deux ailes du grand aigle furent données à la femme, afin qu’elle s’envole dans le désert, vers son lieu, là où elle est nourrie pendant un temps, des temps et la moitié d’un temps, loin de la présence du serpent.
  rationale: La révision retire l’ajout « réservé », rend l’élément locatif « là » de manière française naturelle et remplace un calque sémitisant peu idiomatique par « présence », sans expliciter l’identité de l’agent qui nourrit ni interpréter la durée symbolique.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:47:15Z'
review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement l’image des deux ailes, le but du vol, le passif non spécifié et la formule temporelle ambiguë. Toutefois, « le lieu qui lui est réservé » ajoute l’idée de réservation, absente de τὸν τόπον αὐτῆς (« son lieu »). Elle ne rend pas non plus explicitement ἐκεῖ (« là »), que l’on peut intégrer naturellement par « là où ».
  naturalness: La phrase est globalement fluide et de registre biblique moderne. « Loin de la face du serpent » est intelligible mais peu naturel en français contemporain; « loin de la présence du serpent » conserve l’image de présence/menace sans imposer une interprétation supplémentaire.
  terminology: « Désert », « grand aigle », « serpent » et « un temps, des temps et la moitié d’un temps » conviennent. La formule de durée doit demeurer non interprétée.
  issues:
  - severity: medium
    issue: Ajout interprétatif dans « le lieu qui lui est réservé »
    rationale: Le grec dit littéralement « son lieu » et ne qualifie pas ce lieu comme réservé dans ce verset. Cette idée peut être suggérée par le contexte, mais elle ne doit pas être introduite ici.
  - severity: low
    issue: Omission de l’adverbe ἐκεῖ (« là »)
    rationale: La construction « là où elle est nourrie » permet de rendre idiomatiquement l’insistance locative du grec.
  - severity: low
    issue: « Loin de la face du serpent » est trop calqué
    rationale: « Loin de la présence du serpent » est plus naturel tout en préservant la portée de ἀπὸ προσώπου, qui dépasse la seule distance géographique.
  revised_text: Et les deux ailes du grand aigle furent données à la femme, afin qu’elle s’envole dans le désert, vers son lieu, là où elle est nourrie pendant un temps, des temps et la moitié d’un temps, loin de la présence du serpent.
  revised_footnotes: []
