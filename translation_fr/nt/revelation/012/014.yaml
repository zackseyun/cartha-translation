id: REV.12.14
reference: Revelation 12:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: fr
  text: Et les deux ailes du grand aigle furent données à la femme, afin qu’elle s’envole dans le désert, vers son lieu, là où elle est nourrie pendant un temps, des temps et la moitié d’un temps, loin de la présence du serpent.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: les deux ailes du grand aigle
  rationale: Rend directement l’expression grecque définie et conserve l’imagerie symbolique sans l’expliciter.
- source_word: ἵνα πέτηται
  choice: afin qu’elle s’envole
  rationale: Le présent subjonctif exprime ici le but; « s’envole » est naturel en français tout en gardant le mouvement vers le désert.
- source_word: εἰς τὴν ἔρημον
  choice: dans le désert
  rationale: « Désert » est le terme biblique courant pour ἔρημος et peut désigner une région inhabitée, sans imposer un paysage strictement sablonneux.
- source_word: εἰς τὸν τόπον αὐτῆς
  choice: jusqu’au lieu qui lui est réservé
  rationale: Le possessif grec signifie littéralement « son lieu »; cette formulation naturelle indique le lieu qui est le sien sans préciser davantage son origine ou sa fonction.
- source_word: ὅπου τρέφεται
  choice: où elle est nourrie
  rationale: Conserve le présent passif et ne nomme pas l’agent, comme le grec.
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: un temps, des temps et la moitié d’un temps
  rationale: Préserve la formulation apocalyptique délibérément énigmatique et son parallélisme, sans la convertir en durée interprétée.
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: loin de la face du serpent
  rationale: Conserve l’image sémitisante de la « face », qui peut évoquer à la fois la présence et la menace, sans réduire l’expression à une simple distance spatiale.
theological_decisions:
- issue: Durée symbolique de la protection
  choice: un temps, des temps et la moitié d’un temps
  alternative: trois ans et demi
  rationale: Le texte ne donne pas explicitement une équivalence chronologique; la traduction garde donc l’ambiguïté et la tension symbolique de la formule.
- issue: Agent qui nourrit la femme
  choice: elle est nourrie
  alternative: Dieu la nourrit
  rationale: Le passif grec ne nomme pas l’agent; le préciser introduirait une interprétation théologique absente de cette proposition.
- issue: Nature du lieu de refuge
  choice: le lieu qui lui est réservé
  alternative: le lieu préparé par Dieu pour elle
  rationale: Ce verset dit seulement « son lieu »; une préparation divine est mentionnée dans le contexte plus large, mais ne doit pas être importée explicitement ici.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste fluide tout en conservant les images apocalyptiques, le passif sans agent et la formule temporelle ambiguë de l’original.
