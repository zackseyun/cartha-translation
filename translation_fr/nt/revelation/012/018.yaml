id: REV.12.18
reference: Revelation 12:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἐστάθη ἐπὶ τὴν ἄμμον τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/018.yaml
  text: And he stood on the sand of the sea[a].
translation:
  language: fr
  text: Et il se tint debout sur le sable de la mer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent: «Et je me tins debout sur le sable de la mer.»'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction de coordination simple qui relie cette scène au récit précédent.
- source_word: ἐστάθη
  choice: il se tint debout
  rationale: Aoriste de forme passive employé ici avec un sens intransitif. La troisième personne du texte retenu renvoie le plus naturellement au dragon mentionné au verset précédent; «se tint debout» exprime clairement la position prise.
- source_word: ἐπὶ
  choice: sur
  rationale: Avec l’accusatif dans ce contexte, la préposition indique l’endroit où le sujet vient se tenir.
- source_word: τὴν ἄμμον
  choice: le sable
  rationale: Rend directement le nom grec ἄμμος sans le généraliser en «rivage».
- source_word: τῆς θαλάσσης
  choice: de la mer
  rationale: Conserve le complément au génitif et l’image concrète du sable de la mer.
theological_decisions:
- issue: Identification du sujet et variante textuelle du verbe
  choice: 'Le texte principal suit la leçon à la troisième personne: «il se tint debout», qui renvoie naturellement au dragon du verset précédent.'
  alternative: «Et je me tins debout sur le sable de la mer.»
  rationale: Le SBLGNT porte ἐστάθη, à la troisième personne, tandis qu’une tradition manuscrite bien attestée porte ἐστάθην, à la première personne. La variante est signalée sans résoudre silencieusement la différence narrative.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste proche de l’image grecque tout en évitant une tournure inutilement archaïque.
