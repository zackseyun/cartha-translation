source:
  edition: SBLGNT
  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: fr
  text: 'Et une guerre éclata dans le ciel[a] : Michel et ses anges combattirent contre le dragon[b]. Le dragon et ses anges combattirent[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il y eut une guerre dans le ciel » ou « une guerre survint dans le ciel ».
    reason: lexical_alternative
  - marker: b
    text: 'Plus formellement : « Michel et ses anges pour combattre contre le dragon » ; le grec emploie un infinitif substantivé pour exprimer l’action ou le but.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, plus littéralement : « le dragon combattit, et ses anges ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: une guerre éclata
  rationale: La tournure γίνομαι + nom présente ici la survenue d’un événement. « Une guerre éclata » est naturel en français et conserve cette nuance dynamique.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Dans ce contexte apocalyptique, οὐρανός désigne le domaine céleste. « Dans le ciel » est la formulation française courante et convient mieux que « dans le firmament ».
- source_word: Μιχαὴλ
  choice: Michel
  rationale: Le nom est rendu selon sa forme française traditionnelle, sans ajout interprétatif.
- source_word: ἄγγελοι αὐτοῦ
  choice: ses anges
  rationale: Le possessif exprime simplement le lien entre Michel et les anges qui lui sont associés, puis entre le dragon et les siens.
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: combattirent contre le dragon
  rationale: L’infinitif grec introduit de manière condensée l’action ou le but. Une proposition verbale est plus naturelle en français, et « contre » explicite la relation hostile que le contexte impose à μετά.
- source_word: δράκοντος / δράκων
  choice: le dragon
  rationale: « Dragon » conserve directement l’image apocalyptique du texte et sa cohérence dans le contexte immédiat.
- source_word: ἐπολέμησεν
  choice: ripostèrent
  rationale: La seconde action se situe en réponse au combat engagé par Michel et ses anges. « Ripostèrent » rend naturellement cette progression, tandis qu’une note conserve la formulation grecque plus simple.
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: et ses anges
  rationale: Cette formulation préserve le parallélisme entre Michel accompagné de ses anges et le dragon accompagné des siens.
theological_decisions:
- issue: Identité et statut de Michel
  choice: Le désigner simplement par le nom « Michel »
  alternative: Préciser qu’il est un archange ou l’identifier à une figure christologique
  rationale: Ce verset nomme Michel sans préciser ici son rang ni l’identifier au Christ. La traduction évite donc toute précision doctrinale étrangère au texte.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe explicite l’action condensée dans le grec tout en signalant les formulations plus formelles en notes. La virgule finale maintient le lien avec la suite de la phrase au verset suivant.
