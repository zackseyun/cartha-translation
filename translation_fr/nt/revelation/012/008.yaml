id: REV.12.8
reference: Revelation 12:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: fr
  text: Mais il ne fut pas assez fort[a], et il ne se trouva plus de place pour eux dans le ciel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ne l’emporta pas ». Le verbe grec peut exprimer le fait d’être fort, d’être capable ou de l’emporter.'
    reason: Alternative lexicale permettant de conserver l’étendue sémantique de ἰσχύω.
lexical_decisions:
- source_word: καὶ
  choice: Mais
  rationale: Dans le contexte du combat décrit au verset précédent, la conjonction introduit ici le résultat contraire aux efforts du dragon; « mais » rend naturellement cette valeur adversative.
- source_word: οὐκ ἴσχυσεν
  choice: il ne fut pas assez fort
  rationale: Le verbe ἰσχύω peut exprimer la force, la capacité ou le fait de l’emporter. Cette formulation conserve l’image de la puissance dans le contexte du combat sans réduire le sens au seul résultat.
- source_word: οὐδὲ τόπος εὑρέθη
  choice: et il ne se trouva plus de place
  rationale: La tournure impersonnelle française rend naturellement le passif grec « aucune place ne fut trouvée », tout en conservant l’idée qu’aucune place ne demeurait disponible.
- source_word: αὐτῶν
  choice: pour eux
  rationale: Le pronom renvoie collectivement au dragon et à ses anges mentionnés au verset précédent.
- source_word: ἔτι
  choice: plus
  rationale: 'Avec la négation, ἔτι indique qu’une situation antérieure a cessé : il n’y avait désormais plus de place pour eux.'
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Dans ce passage de l’Apocalypse, οὐρανός désigne le domaine céleste plutôt que le ciel visible; « dans le ciel » est la formulation française biblique et courante adaptée au contexte.
theological_decisions:
- issue: Référent du singulier ἴσχυσεν
  choice: Le sujet reste singulier (« il ») et désigne le dragon du verset précédent; « eux » désigne ensuite le dragon avec ses anges.
  alternative: 'Employer un pluriel collectif : « ils ne furent pas assez forts ».'
  rationale: Le grec distingue explicitement le verbe singulier, dont le sujet est le dragon, du pronom pluriel αὐτῶν, qui englobe le dragon et ses anges. La traduction maintient cette distinction sans l’aplanir.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif solennel de l’Apocalypse. La tournure « il ne se trouva plus de place » évite le calque lourd « aucune place ne fut trouvée » tout en respectant la voix et le résultat exprimés par le grec.
