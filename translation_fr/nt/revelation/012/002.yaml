  text: καὶ ἐν γαστρὶ ἔχουσα· ⸂καὶ κράζει⸃ ὠδίνουσα καὶ βασανιζομένη τεκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/002.yaml
  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: fr
  text: Elle est enceinte[a] et elle crie, en proie aux douleurs de l’enfantement[b] et tourmentée pour accoucher[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ayant dans le ventre » ; autre traduction : « elle porte un enfant ».'
    reason: lexical_alternative
  - marker: b
    text: 'Autre traduction : « en travail ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « dans une grande souffrance pour accoucher ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: elle est enceinte
  rationale: L’expression signifie littéralement « ayant dans le ventre ». « Elle est enceinte » en donne le sens idiomatique dans un français actuel et naturel.
- source_word: κράζει
  choice: elle crie
  rationale: Le présent restitue l’immédiateté de la vision et l’intensité du verbe, sans le transformer en passé narratif.
- source_word: ὠδίνουσα
  choice: en proie aux douleurs de l’accouchement
  rationale: Cette formulation explicite les douleurs du travail tout en conservant la valeur circonstancielle du participe grec.
- source_word: βασανιζομένη
  choice: au tourment
  rationale: Le terme grec exprime une souffrance aiguë. « Tourment » en préserve la force sans préciser artificiellement si sa cause est seulement physique ou plus largement angoissante.
- source_word: τεκεῖν
  choice: d’enfanter
  rationale: L’infinitif désigne l’acte de mettre au monde. « Enfanter » est concis, digne et convient au parallélisme avec « accouchement ».
- source_word: καὶ ... καὶ
  choice: et ... et
  rationale: La coordination répétée est maintenue afin de préserver l’accumulation vive de la phrase grecque.
theological_decisions:
- issue: Intensité de la souffrance et identité symbolique de la femme
  choice: Conserver une expression forte de la souffrance sans identifier la femme ni expliquer le symbole.
  alternative: Atténuer βασανιζομένη en « dans la peine » ou expliciter l’identité symbolique de la femme.
  rationale: Le grec décrit une souffrance intense, mais ce verset ne donne pas lui-même l’interprétation théologique de la femme. La traduction laisse donc cette question ouverte.
translation_notes:
  register: Français international moderne, clair et digne. Le présent de vision est conservé. La phrase maintient l’intensité et l’accumulation de l’original sans ajouter d’interprétation symbolique.
