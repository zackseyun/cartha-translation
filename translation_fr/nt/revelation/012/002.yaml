review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement la grossesse (ἐν γαστρὶ ἔχουσα), le présent vif de κράζει, les douleurs de l’enfantement (ὠδίνουσα) et l’intensité de βασανιζομένη. Toutefois, la note c actuelle (« tourmentée à l’idée d’accoucher ») introduit une cause psychologique—l’appréhension—qui n’est pas exprimée par le grec. La coordination et le lien de τεκεῖν avec le tourment doivent demeurer explicites.
  naturalness: La formulation est globalement claire et adaptée au français international moderne. « En proie aux douleurs de l’accouchement » est naturel; « au tourment d’enfanter » est plus littéraire et légèrement moins idiomatique. Une formulation participiale parallèle est plus fluide tout en gardant le registre digne.
  terminology: « Enceinte », « douleurs de l’enfantement », « tourmentée » et « accoucher » sont justes. « Tourmentée » conserve la force de βασανιζομένη sans interpréter l’identité de la femme. « Enfanter » n’est pas fautif, mais « accoucher » est plus courant en français moderne dans cette construction.
  issues:
  - severity: medium
    issue: La note c ajoute « à l’idée de ».
    rationale: Cette expression présente le tourment comme une angoisse anticipatrice ou psychologique. Le grec dit qu’elle est tourmentée en relation avec le fait d’enfanter, sans préciser que ce tourment provient de la seule idée d’accoucher.
  - severity: low
    issue: « Au tourment d’enfanter » est moins naturel que la structure participiale parallèle.
    rationale: La révision « tourmentée pour accoucher » rend plus directement βασανιζομένη τεκεῖν et maintient la progression des participes grecs.
