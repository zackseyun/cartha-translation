id: REV.12.13
reference: Revelation 12:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: fr
  text: Quand le dragon vit qu’il avait été précipité sur la terre, il poursuivit[a] la femme qui avait mis au monde l’enfant mâle[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « persécuta ». Le verbe grec peut évoquer à la fois une poursuite hostile et la persécution.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « le mâle ». Le français ajoute « enfant » pour une formulation naturelle, conformément au contexte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: dragon
  rationale: Le terme désigne ici le dragon de la vision apocalyptique; il convient de conserver cette image plutôt que d’harmoniser avec « serpent ».
- source_word: ἐβλήθη
  choice: avait été précipité
  rationale: L’aoriste passif exprime une expulsion violente déjà accomplie au moment où le dragon en prend conscience. « Précipité » rend naturellement en français le mouvement forcé vers le bas.
- source_word: εἰς τὴν γῆν
  choice: sur la terre
  rationale: Dans le cadre cosmique de l’Apocalypse, γῆ désigne la terre par contraste avec le ciel; « sur la terre » est idiomatique avec « précipité ».
- source_word: ἐδίωξεν
  choice: poursuivit
  rationale: διώκω peut signifier poursuivre ou persécuter. Le récit présente une poursuite hostile concrète; une note conserve l’autre nuance possible.
- source_word: τὴν γυναῖκα
  choice: la femme
  rationale: Traduction directe qui maintient l’image symbolique sans préciser l’identité de la femme.
- source_word: ἥτις ἔτεκεν
  choice: qui avait mis au monde
  rationale: Cette formulation française courante et digne rend l’acte d’enfanter et marque naturellement son antériorité.
- source_word: τὸν ἄρσενα
  choice: l’enfant mâle
  rationale: Le grec dit littéralement « le mâle ». Le nom « enfant » est fourni par le contexte, tandis que « mâle » préserve l’expression marquée du texte.
theological_decisions:
- issue: Identité symbolique de la femme et de l’enfant
  choice: Conserver les images « la femme » et « l’enfant mâle » sans les expliquer dans le corps du texte.
  alternative: Identifier la femme à Marie, à Israël ou au peuple de Dieu, et préciser l’identité de l’enfant.
  rationale: Le grec ne résout pas ici toutes les dimensions de ces symboles, qui font l’objet de plusieurs interprétations. Une traduction ne doit pas imposer l’une d’elles.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple porte l’action narrative, tandis que le plus-que-parfait marque les événements antérieurs. Les notes préservent l’ambiguïté lexicale sans alourdir le verset.
