id: REV.12.10
reference: Revelation 12:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: fr
  text: 'Et j’entendis dans le ciel une voix forte qui disait : « Maintenant sont venus le salut, la puissance et le règne de notre Dieu, ainsi que l’autorité de son Messie[a], car l’accusateur de nos frères[b] a été précipité, lui qui les accuse devant notre Dieu jour et nuit. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Christ ». Le titre grec Χριστός (Christos) signifie « Oint » et correspond à « Messie ».
    reason: alternative_reading
  - marker: b
    text: Ici, « frères » peut désigner l’ensemble des croyants, femmes comprises.
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: une voix forte
  rationale: Avec φωνή, μεγάλη exprime naturellement l’intensité sonore ; « une voix forte » est idiomatique en français moderne.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Le singulier désigne ici le domaine céleste ; « dans le ciel » est la formulation française naturelle.
- source_word: Ἄρτι ἐγένετο
  choice: Maintenant sont arrivés
  rationale: Ἄρτι marque le moment décisif présent, et ἐγένετο annonce l’avènement effectif des réalités énumérées. L’accord pluriel est naturel en français avec le sujet composé qui suit.
- source_word: ἡ σωτηρία
  choice: le salut
  rationale: Équivalent théologique courant et direct, avec maintien de l’article dans la série rhétorique.
- source_word: ἡ δύναμις
  choice: la puissance
  rationale: Désigne la puissance efficace de Dieu manifestée dans la victoire, tout en restant distincte de ἐξουσία.
- source_word: ἡ βασιλεία τοῦ θεοῦ ἡμῶν
  choice: le règne de notre Dieu
  rationale: βασιλεία peut désigner le royaume ou l’exercice de la royauté. Dans cette proclamation d’avènement, « règne » met naturellement en relief la domination royale devenue manifeste sans exclure la réalité du royaume.
- source_word: ἡ ἐξουσία
  choice: l’autorité
  rationale: Le terme exprime l’autorité ou le droit légitime d’exercer le pouvoir, et se distingue ainsi de δύναμις, « puissance ».
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: de son Messie
  rationale: Χριστός fonctionne ici comme un titre désignant l’Oint de Dieu. « Messie » en restitue le sens titulaire en français.
- source_word: ἐβλήθη
  choice: il a été précipité
  rationale: Le passif de βάλλω décrit ici une expulsion violente vers le bas. « Précipité » convient au mouvement de chute du contexte apocalyptique.
- source_word: ὁ κατήγωρ
  choice: l’accusateur
  rationale: Le nom rare désigne celui qui porte des accusations ; « accusateur » conserve clairement la dimension judiciaire.
- source_word: ἡμέρας καὶ νυκτός
  choice: jour et nuit
  rationale: Expression française naturelle qui conserve l’idée d’une accusation incessante.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: 'Dans « son Χριστός », le mot est explicitement un titre possessif : « Messie » rend son sens d’Oint de Dieu au lieu de le traiter comme un nom propre.'
- issue: Portée de ἀδελφῶν
  choice: frères
  alternative: frères et sœurs
  rationale: « Frères » correspond formellement au masculin pluriel grec et conserve le langage familial du texte. Une note précise que, dans ce contexte communautaire, le terme peut englober les croyantes.
- issue: Sens de βασιλεία
  choice: règne
  alternative: royaume
  rationale: Les deux sens sont possibles. « Règne » s’accorde bien avec l’annonce de l’exercice victorieux de la souveraineté divine, tandis que la note n’est pas nécessaire puisque l’ambiguïté lexicale ne modifie pas l’affirmation centrale.
- issue: Valeur temporelle de ἐγένετο
  choice: sont arrivés
  alternative: ont été établis
  rationale: La formulation retenue exprime l’avènement décisif proclamé sans préciser davantage si le texte vise le commencement, la manifestation ou l’établissement final de ces réalités.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La syntaxe conserve l’élan solennel de la proclamation céleste et la répétition des articles, tout en évitant les archaïsmes. Les marqueurs [a] et [b] figurent bien dans le texte principal.
