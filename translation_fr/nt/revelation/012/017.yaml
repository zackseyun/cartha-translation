id: REV.12.17
reference: Revelation 12:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: fr
  text: Alors le dragon se mit en colère contre la femme et s’en alla faire la guerre au reste de sa descendance, à ceux qui gardent les commandements de Dieu et qui ont le témoignage de Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le témoignage au sujet de Jésus » ; autre possibilité : « le témoignage rendu par Jésus ». Le génitif grec peut se comprendre de plusieurs manières.'
    reason: 'Lecture alternative : préservation de l’ambiguïté du génitif μαρτυρίαν Ἰησοῦ.'
lexical_decisions:
- source_word: ὠργίσθη
  choice: se mit en colère
  rationale: L’aoriste de ὀργίζομαι exprime ici l’entrée dans la colère. Cette formulation française rend naturellement cet aspect sans amplifier indûment le terme grec.
- source_word: δράκων
  choice: dragon
  rationale: Équivalent direct qui conserve l’image symbolique et apocalyptique établie dans le chapitre.
- source_word: ἐπὶ τῇ γυναικί
  choice: contre la femme
  rationale: Avec un verbe de colère, ἐπί introduit ici la personne visée. « Contre » est naturel en français et la femme est celle déjà présentée dans le contexte.
- source_word: ἀπῆλθεν
  choice: s’en alla
  rationale: Rend le mouvement exprimé par ἀπέρχομαι dans un français narratif courant et digne.
- source_word: ποιῆσαι πόλεμον
  choice: faire la guerre
  rationale: Équivalent idiomatique proche de la construction grecque, sans atténuer la portée hostile de l’action.
- source_word: μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς
  choice: au reste de sa descendance
  rationale: Dans l’expression « faire la guerre », μετά désigne les adversaires et se rend naturellement par « à ». « Descendance » exprime le sens collectif de σπέρμα sans l’archaïsme possible de « semence ».
- source_word: τηρούντων τὰς ἐντολὰς
  choice: qui gardent les commandements
  rationale: « Garder » conserve les nuances d’observance fidèle et de vigilance propres à τηρέω, tandis que « commandements » maintient la force biblique de ἐντολαί.
- source_word: ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: qui ont le témoignage de Jésus
  rationale: La formulation reste proche de ἔχω et préserve en français l’ambiguïté du génitif Ἰησοῦ, qui peut désigner un témoignage au sujet de Jésus ou rendu par Jésus.
theological_decisions:
- issue: Valeur du génitif dans τὴν μαρτυρίαν Ἰησοῦ
  choice: le témoignage de Jésus
  alternative: le témoignage au sujet de Jésus ; le témoignage rendu par Jésus
  rationale: Le génitif grec peut être compris objectivement ou subjectivement. Le français « de Jésus » conserve cette tension authentique dans le texte principal, et la note explicite les deux principales lectures sans en imposer une.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le mouvement narratif du grec et son vocabulaire biblique central. L’apposition « à ceux qui… » explicite naturellement que le collectif « le reste de sa descendance » désigne des personnes, sans ajouter d’identification doctrinale.
