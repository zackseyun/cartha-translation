id: REV.12.16
reference: Revelation 12:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: fr
  text: Et la terre[a] vint au secours de la femme ; la terre ouvrit sa bouche et engloutit le fleuve que le dragon avait projeté de sa bouche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut désigner la terre, un territoire ou le sol.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « avait jeté hors de sa bouche » ou « avait fait sortir de sa bouche ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: vint au secours de
  rationale: Le verbe βοηθέω signifie « aider, venir au secours de ». Cette formulation naturelle conserve ici l’idée d’une intervention en faveur de la femme.
- source_word: ἡ γῆ
  choice: la terre
  rationale: Le nom γῆ peut désigner la terre, un territoire ou le sol. « La terre » convient au cadre cosmique de la vision et permet de conserver sa personnification ainsi que la répétition du sujet grec.
- source_word: τῇ γυναικί
  choice: la femme
  rationale: Traduction directe de γυνή, sans expliciter l’identité symbolique du personnage.
- source_word: ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς
  choice: la terre ouvrit sa bouche
  rationale: Le français emploie naturellement le féminin avec « terre » ; la formulation préserve l’image personnifiée du texte grec.
- source_word: κατέπιεν
  choice: engloutit
  rationale: Καταπίνω signifie avaler ou engloutir. Dans cette image où la terre absorbe un fleuve, « engloutit » est à la fois naturel et fidèle à la force du verbe.
- source_word: τὸν ποταμόν
  choice: le fleuve
  rationale: Ποταμός désigne un fleuve ou une rivière. « Fleuve » maintient l’ampleur de l’image sans transformer explicitement le cours d’eau en déluge.
- source_word: ὃν ἔβαλεν
  choice: que … avait projeté
  rationale: Βάλλω signifie fondamentalement jeter ou lancer. « Projeter » exprime naturellement en français l’émission énergique du fleuve depuis la bouche du dragon, tout en laissant ouvertes des nuances moins fortes signalées en note.
- source_word: ὁ δράκων
  choice: le dragon
  rationale: Équivalent direct de δράκων, qui conserve la figure apocalyptique sans interprétation supplémentaire.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: de sa bouche
  rationale: La préposition ἐκ marque la provenance. En contexte, « de sa bouche » est idiomatique et précis.
theological_decisions:
- issue: Personnification de la terre dans l’imagerie apocalyptique
  choice: Conserver la terre comme sujet agissant, qui ouvre sa bouche et vient au secours de la femme.
  alternative: Interpréter la terre comme une population, un territoire ou un moyen providentiel de délivrance.
  rationale: Le verset ne donne pas lui-même la clé du symbole. La traduction garde donc intacte l’image et son ambiguïté théologique au lieu d’en imposer une explication.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « la terre », présente dans le grec, est maintenue pour souligner son action. Le point-virgule rend les deux propositions coordonnées sans effacer leur enchaînement.
