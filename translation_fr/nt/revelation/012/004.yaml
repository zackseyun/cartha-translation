id: REV.12.4
reference: Revelation 12:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: fr
  text: Sa queue entraîne le tiers des étoiles du ciel et les précipita sur la terre.[a] Le dragon se tient devant la femme qui allait accoucher, afin de dévorer son enfant dès qu’elle l’aurait mis au monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec passe brusquement du présent (« entraîne ») au passé (« précipita »). Certains témoins ont ici le présent : « précipite ».'
    reason: Signaler l’alternance temporelle difficile mais bien attestée du texte retenu, ainsi que la variante qui explique plusieurs traductions uniformisées au présent.
lexical_decisions:
- source_word: σύρει
  choice: entraîne
  rationale: Le présent grec décrit vivement l’action de la queue; « entraîne » exprime le mouvement exercé sur les étoiles sans préciser au-delà du texte s’il s’agit de les balayer ou de les tirer.
- source_word: τὸ τρίτον
  choice: le tiers
  rationale: Expression française naturelle et exacte pour la fraction indiquée.
- source_word: ἔβαλεν
  choice: précipita
  rationale: L’aoriste marque une action passée et contraste avec le présent σύρει; « précipita sur la terre » rend ici le mouvement violent de βάλλω plus naturellement que le très général « jeta ».
- source_word: ἕστηκεν
  choice: se tenait
  rationale: 'Le parfait a une valeur résultative: le dragon a pris position et demeure là; l’imparfait français décrit naturellement cette posture dans le récit.'
- source_word: μελλούσης τεκεῖν
  choice: qui allait accoucher
  rationale: Rend clairement l’imminence exprimée par μέλλω et l’acte de mettre au monde.
- source_word: καταφάγῃ
  choice: dévorer
  rationale: Conserve la force du verbe grec, qui signifie manger entièrement, dévorer.
theological_decisions:
- issue: Identification symbolique des étoiles
  choice: Conserver simplement « étoiles »
  alternative: Interpréter explicitement les étoiles comme des anges ou des êtres humains
  rationale: Le verset ne donne pas lui-même l’interprétation du symbole; la traduction ne doit pas résoudre cette ambiguïté théologique.
- issue: Alternance des temps verbaux σύρει / ἔβαλεν
  choice: « entraîne… précipita »
  alternative: Uniformiser au présent (« entraîne… précipite ») ou au passé
  rationale: Le texte grec présente une alternance réelle entre présent et aoriste. La conserver respecte la forme saisissante, quoique abrupte, du passage.
- issue: Finalité exprimée par ἵνα
  choice: « afin de dévorer »
  alternative: « dans l’espoir de dévorer » ou une formulation qui atténue l’intention
  rationale: La proposition exprime directement le dessein du dragon, sans affirmer que celui-ci aboutira.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste accessible tout en conservant l’alternance inhabituelle des temps du grec. « Dès qu’elle l’aurait mis au monde » évite la répétition lourde d’« accoucher » et explicite naturellement le référent de l’enfant sans ajout interprétatif.
