review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement l’appel à quitter Babylone, le féminin personnifiant αὐτῆς, ainsi que la participation à ses péchés. En revanche, « subir ses fléaux » interprète λάβητε (« recevoir ») comme l’expérience effective du châtiment et ne rend plus explicitement ἐκ, qui évoque la réception d’une part de ses fléaux. « Recevoir une part de ses fléaux » préserve cette nuance sans surinterprétation.
  naturalness: Le français est moderne, clair et d’un registre approprié. « Sortez du milieu d’elle » est un peu solennel, mais naturel dans ce contexte apocalyptique et permet de conserver le féminin. La légère explicitation « une part de » est idiomatique et précise.
  terminology: « Voix », « ciel », « mon peuple », « péchés » et « fléaux » conviennent au vocabulaire biblique français moderne. Le maintien du féminin est juste pour l’image de Babylone personnifiée.
  issues:
  - severity: medium
    issue: « subir ses fléaux » ne reflète pas pleinement ἐκ τῶν πληγῶν αὐτῆς … λάβητε.
    rationale: λάβητε signifie d’abord « recevoir », et ἐκ marque la réception provenant des fléaux ou d’une part de ceux-ci. « Subir » exprime une conséquence plausible, mais atténue cette formulation et transforme légèrement l’image de la participation au jugement.
  revised_text: 'Et j’entendis une autre voix venant du ciel, qui disait : « Sortez du milieu d’elle, mon peuple, afin de ne pas participer à ses péchés et de ne pas recevoir une part de ses fléaux. »'
