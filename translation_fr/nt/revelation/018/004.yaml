  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: fr
  text: 'Et j’entendis une autre voix venant du ciel, qui disait : « Sortez du milieu d’elle, mon peuple, afin de ne pas participer à ses péchés et de ne pas recevoir une part de ses fléaux. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: une autre voix
  rationale: Désigne naturellement une voix supplémentaire, distincte de celle qui précède.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: venant du ciel
  rationale: Dans ce contexte, οὐρανός désigne le domaine céleste; cette formulation est naturelle en français.
- source_word: Ἐξέλθατε … ἐξ αὐτῆς
  choice: Sortez du milieu d’elle
  rationale: L’impératif appelle directement le peuple à quitter Babylone. « Du milieu d’elle » exprime clairement la sortie tout en conservant le pronom féminin de la personnification.
- source_word: ὁ λαός μου
  choice: mon peuple
  rationale: Conserve l’adresse d’alliance et sa valeur vocative sans tournure archaïque.
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: afin de ne pas participer à ses péchés
  rationale: συγκοινωνέω exprime la participation ou la complicité; « participer à » rend ce sens directement et naturellement.
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: de ne pas subir ses fléaux
  rationale: Avec les fléaux comme objet du jugement, « subir » est idiomatique en français et rend le fait d’en recevoir une part; « fléaux » maintient les résonances bibliques de πληγαί.
theological_decisions:
- issue: Référent et image de αὐτῆς
  choice: Conserver le féminin avec « d’elle » et « ses » pour Babylone personnifiée.
  alternative: Employer le neutre conceptuel en reformulant par « cette ville » ou « ce système ».
  rationale: L’Apocalypse présente Babylone à la fois comme ville et comme femme. Le féminin préserve cette image littéraire sans préciser davantage son identité.
- issue: Valeur des deux propositions introduites par ἵνα μή
  choice: Les rendre comme deux buts ou conséquences à éviter, coordonnés sous « afin de ne pas… et de ne pas… ».
  alternative: Employer deux avertissements avec « de peur que… » ou répéter « afin que vous ne… ».
  rationale: La construction française choisie conserve la coordination et la portée d’avertissement des deux propositions, tout en évitant une répétition pesante.
translation_notes:
  register: Français moderne, international et digne. Le passé simple « j’entendis » convient au registre narratif solennel de l’Apocalypse sans être obscur. La syntaxe reste accessible, et le féminin de Babylone est préservé.
