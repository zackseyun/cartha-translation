id: REV.18.24
reference: Revelation 18:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: fr
  text: Et c’est en elle[a] qu’on a trouvé le sang des prophètes et des saints[b], ainsi que celui de tous ceux qui ont été égorgés sur la terre[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Elle » désigne Babylone, représentée comme une femme dans la vision environnante.
    reason: cross_reference
  - marker: b
    text: Ou « de ceux qui appartiennent à Dieu »; littéralement « des saints ».
    reason: lexical_alternative
  - marker: c
    text: Ou « qui ont été massacrés sur la terre ». Le verbe grec désigne une mise à mort violente et est plus fort qu’un simple verbe signifiant « tuer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: en elle
  rationale: Le pronom féminin renvoie à Babylone, présentée comme une femme et une ville dans la vision. « En elle » conserve cette personnification.
- source_word: αἷμα
  choice: le sang
  rationale: Le sens concret de « sang » convient naturellement et porte aussi, dans le contexte, l’idée de culpabilité liée au sang versé.
- source_word: προφητῶν
  choice: des prophètes
  rationale: Équivalent français direct et usuel de προφητῶν.
- source_word: ἁγίων
  choice: des saints
  rationale: Dans l’Apocalypse, le terme désigne couramment ceux qui appartiennent à Dieu et lui sont consacrés. « Saints » est concis et bien établi; une note signale une formulation plus explicite.
- source_word: εὑρέθη
  choice: on a trouvé
  rationale: Cette tournure française naturelle rend l’aoriste passif sans perdre l’idée de constat ou de mise au jour.
- source_word: πάντων τῶν ἐσφαγμένων
  choice: de tous ceux qui ont été égorgés
  rationale: Le verbe σφάζω est plus fort qu’un terme générique signifiant « tuer » et évoque une mise à mort violente. Le passé composé rend l’action accomplie avec sa portée persistante.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Dans ce cadre apocalyptique, γῆ désigne vraisemblablement la terre dans son ensemble plutôt qu’un territoire particulier.
theological_decisions:
- issue: Référent du pronom féminin
  choice: « elle » désigne Babylone personnifiée
  alternative: Employer « la ville » ou une formulation impersonnelle
  rationale: Le féminin grec et le contexte immédiat présentent Babylone comme une femme; la traduction conserve cette image sans ajouter le nom au texte.
- issue: Étendue de la culpabilité de Babylone
  choice: Conserver l’accusation globale visant tous ceux qui ont été égorgés sur la terre
  alternative: Limiter explicitement l’énoncé au sang des justes ou le qualifier d’hyperbole
  rationale: Le grec formule une accusation universelle sans préciser comment le symbole correspond à l’histoire. La traduction en préserve donc l’ampleur et la tension.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la personnification féminine de Babylone, la force judiciaire du constat et l’ampleur de l’accusation. « Égorgés » rend avec vigueur σφάζω; la note offre « massacrés », possible lorsque l’accent collectif est privilégié.
