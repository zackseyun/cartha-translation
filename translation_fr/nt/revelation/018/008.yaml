id: REV.18.8
reference: Revelation 18:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: fr
  text: 'C’est pourquoi, en un seul jour, ses fléaux viendront : la mort, le deuil et la famine ; elle sera consumée par le feu, car le Seigneur Dieu qui l’a jugée est puissant.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Exprime naturellement en français le lien causal avec le contexte précédent.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: en un seul jour
  rationale: Conserve l’idée d’une soudaineté et d’une concentration temporelle marquées.
- source_word: αἱ πληγαὶ αὐτῆς
  choice: les fléaux qui la frapperont
  rationale: Le génitif grec désigne les fléaux qui lui sont destinés; cette formulation évite l’ambiguïté française de « ses fléaux », qui pourrait suggérer qu’elle les inflige.
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: Elle sera entièrement consumée par le feu
  rationale: Le préverbe intensif de κατακαίω justifie « entièrement consumée », tandis que la voix passive est conservée.
- source_word: ἰσχυρός
  choice: puissant
  rationale: Dans ce contexte de capacité à exécuter le jugement, « puissant » est plus idiomatique et digne que le littéral « fort ».
- source_word: ὁ κρίνας αὐτήν
  choice: qui l’a jugée
  rationale: Conserve le participe aoriste et la notion judiciaire sans préciser davantage la manière ni le moment du jugement.
theological_decisions:
- issue: Relation entre la puissance de Dieu et le jugement de Babylone
  choice: car il est puissant, le Seigneur Dieu qui l’a jugée
  alternative: car le Seigneur Dieu qui la juge est puissant
  rationale: Préserve l’accent grec placé sur ἰσχυρός et maintient le participe aoriste « qui l’a jugée », sans transformer celui-ci en présent.
- issue: Agent implicite de la destruction par le feu
  choice: voix passive sans agent explicité
  alternative: Dieu la consumera par le feu
  rationale: Le grec emploie un passif et ne nomme pas directement l’agent dans cette proposition; la traduction n’explicite donc pas ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, naturel et solennel. La ponctuation répartit l’énumération et la destruction par le feu en deux phrases pour assurer la lisibilité sans modifier leur enchaînement logique.
