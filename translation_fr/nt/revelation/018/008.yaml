review_pass:
  verdict: revise
  source_fidelity: 'Le sens est globalement fidèle : le lien causal, « en un seul jour », les trois fléaux, le passif de la destruction par le feu et le participe aoriste « qui l’a jugée » sont tous rendus. Toutefois, « entièrement » explicite avec une force potentiellement excessive l’intensité de κατακαυθήσεται, alors que « consumée par le feu » rend naturellement le verbe en français sans préciser le degré d’achèvement au-delà de ce que requiert le contexte.'
  naturalness: '« Les fléaux qui la frapperont surviendront » est lourd et redondant en français : les fléaux « survenir » et « frapper » cumulent deux prédicats proches. La construction finale « car il est puissant, le Seigneur Dieu qui l’a jugée » est grammaticalement possible, mais moins fluide que l’ordre français usuel. Une ponctuation par point-virgule conserve l’enchaînement étroit des propositions grecques tout en restant lisible.'
  terminology: « Fléaux », « mort », « deuil », « famine », « feu », « Seigneur Dieu » et « jugée » conviennent au registre solennel et au vocabulaire apocalyptique. Aucun terme théologique n’est indûment interprété. Aucun appel de note n’est requis.
  issues:
  - severity: low
    issue: Redondance dans « les fléaux qui la frapperont surviendront »
    rationale: La formulation ajoute une relative explicative et juxtapose « frapper » à « survenir », ce qui alourdit inutilement la phrase sans mieux refléter αἱ πληγαὶ αὐτῆς ἥξουσιν.
  - severity: low
    issue: Intensification explicite par « entièrement »
    rationale: Le composé κατακαυθήσεται évoque bien une destruction par le feu, mais « consumée par le feu » est une équivalence française suffisante et plus sobre; « entièrement » impose une explicitation additionnelle.
  - severity: low
    issue: Ordre final peu naturel
    rationale: L’antéposition grecque de ἰσχυρός peut être conservée dans une traduction très littérale, mais l’ordre « le Seigneur Dieu qui l’a jugée est puissant » est plus naturel en français international moderne tout en gardant l’aoriste.
  revised_text: 'C’est pourquoi, en un seul jour, ses fléaux viendront : la mort, le deuil et la famine ; elle sera consumée par le feu, car le Seigneur Dieu qui l’a jugée est puissant.'
