revisions:
- from: 'Voilà pourquoi, en un seul jour, les fléaux qui la frapperont surviendront : la mort, le deuil et la famine. Elle sera entièrement consumée par le feu, car il est puissant, le Seigneur Dieu qui l’a jugée.'
  to: 'C’est pourquoi, en un seul jour, ses fléaux viendront : la mort, le deuil et la famine ; elle sera consumée par le feu, car le Seigneur Dieu qui l’a jugée est puissant.'
  rationale: La révision allège la formulation, conserve la liste et la coordination du grec, maintient le passif sans nommer d’agent, et garde « qui l’a jugée » pour le participe aoriste. « Ses fléaux » est idiomatique et, dans ce contexte, désigne naturellement les fléaux qui lui sont destinés.
  reviewer_model: gpt-5.6-terra
