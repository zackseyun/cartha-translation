    issue: « tout en pleurant et en prenant le deuil » pour κλαίοντες καὶ πενθοῦντες
    rationale: « Prendre le deuil » désigne couramment le fait d’adopter le deuil, notamment ses usages ou ses marques extérieures, plutôt que le fait concomitant de se lamenter. « En pleurant et en se lamentant » reflète directement les deux participes grecs sans ajout contextuel.
  - severity: low
    issue: Ponctuation de « Malheur ! Malheur à la grande ville »
    rationale: La seconde occurrence est grammaticalement liée à « à la grande ville ». « Malheur, malheur à la grande ville ! » restitue la répétition grecque et forme une exclamation française plus unifiée.
