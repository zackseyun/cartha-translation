revisions:
- from: 'Ils jetèrent de la poussière sur leur tête et crièrent, tout en pleurant et en prenant le deuil : « Malheur ! Malheur à la grande ville, où tous ceux qui avaient des navires en mer se sont enrichis grâce à son opulence[a] ! Car en une seule heure, elle a été dévastée. »'
  to: 'Ils jetèrent de la poussière sur leur tête et poussèrent des cris, en pleurant et en se lamentant : « Malheur, malheur à la grande ville ! Tous ceux qui avaient des navires en mer se sont enrichis grâce à son opulence[a], car en une seule heure elle a été dévastée. »'
  rationale: La révision remplace une expression française susceptible d’ajouter l’idée de l’observance du deuil par « en se lamentant », qui correspond au sens verbal de πενθοῦντες et reste distinct de « en pleurant ». Elle ajuste aussi la ponctuation de la formule répétée de lamentation. Le reste, notamment « où », « grâce à son opulence » et le passif « elle a été dévastée », est conservé.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:47:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les éléments essentiels du grec sont bien conservés : geste de deuil, cri, pleurs, lamentation, ville personnifiée, enrichissement des détenteurs de navires et dévastation soudaine au passif. Toutefois, « prendre le deuil » évoque plutôt l’adoption d’un état ou de signes sociaux de deuil que l’action de πενθοῦντες (« se lamentant / étant en deuil ») dans cette scène.'
  naturalness: Le français est globalement fluide. « Poussèrent des cris » rend plus naturellement la force de ἔκραξαν, et « en se lamentant » coordonné à « en pleurant » est plus idiomatique et précis ici. La double exclamation gagne en cohérence syntaxique sous la forme « Malheur, malheur à la grande ville ! ».
  terminology: « Malheur » préserve adéquatement la portée de lamentation et de jugement de οὐαί. « Opulence » est recevable pour τιμιότης dans le contexte, tout en justifiant une note qui indique les nuances possibles de coût, de splendeur et de richesse.
  issues:
