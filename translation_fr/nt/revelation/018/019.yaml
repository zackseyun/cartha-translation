reference: Revelation 18:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: fr
  text: 'Ils jetèrent de la poussière sur leur tête et poussèrent des cris, en pleurant et en se lamentant : « Malheur, malheur à la grande ville ! Tous ceux qui avaient des navires en mer se sont enrichis grâce à son opulence[a], car en une seule heure elle a été dévastée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « grâce à son luxe coûteux » ou « grâce à sa splendeur ». Le terme grec peut désigner la valeur, le caractère coûteux, la magnificence ou l’opulence.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: Ils jetèrent de la poussière sur leur tête
  rationale: Rend directement le geste conventionnel de deuil. Le singulier distributif « leur tête » est naturel en français et évite de suggérer que chacun aurait plusieurs têtes.
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: crièrent, tout en pleurant et en prenant le deuil
  rationale: 'Distingue les trois éléments du grec : le cri à haute voix, les pleurs et le deuil. « Prendre le deuil » exprime ici une manifestation de deuil plutôt qu’un simple état intérieur.'
- source_word: Οὐαὶ οὐαί
  choice: Malheur ! Malheur
  rationale: Conserve à la fois la lamentation et la portée prophétique de jugement propres à οὐαί, dans un registre biblique compréhensible en français moderne.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: la grande ville
  rationale: Équivalent français naturel de la tournure grecque avec article et apposition.
- source_word: ἐν ᾗ
  choice: où
  rationale: Préserve le sens locatif littéral « dans laquelle » tout en donnant une formulation française fluide; le contexte commercial permet de comprendre que la ville était le cadre de leur enrichissement.
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: tous ceux qui avaient des navires en mer
  rationale: Suit de près le grec sans préciser indûment qu’ils en étaient juridiquement propriétaires.
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: grâce à son opulence
  rationale: Dans ce contexte économique, « opulence » exprime la richesse coûteuse et fastueuse de la ville, tout en conservant davantage que « richesse » la nuance de valeur et de magnificence de τιμιότης.
- source_word: μιᾷ ὥρᾳ
  choice: en une seule heure
  rationale: La tournure souligne naturellement en français la soudaineté spectaculaire du désastre apocalyptique.
- source_word: ἠρημώθη
  choice: elle a été dévastée
  rationale: Conserve la voix passive et l’état résultant de désolation, dans une formulation actuelle et forte.
theological_decisions:
- issue: Valeur de la formule de lamentation Οὐαὶ οὐαί dans un contexte de jugement apocalyptique
  choice: Malheur ! Malheur
  alternative: Hélas ! Hélas
  rationale: « Malheur » maintient ensemble la plainte et la résonance de jugement prophétique. « Hélas » exprimerait clairement la lamentation, mais atténuerait la dimension judiciaire du passage.
- issue: Rapport exprimé par ἐν ᾗ entre la ville et l’enrichissement des gens de mer
  choice: où
  alternative: grâce à laquelle
  rationale: Le grec emploie explicitement ἐν, qui peut conserver une valeur locale ou contextuelle. « Où » préserve cette formulation et son ambiguïté sans imposer une lecture strictement instrumentale; « grâce à son opulence » rend ensuite clairement le moyen économique exprimé par ἐκ τῆς τιμιότητος αὐτῆς.
translation_notes:
  register: Français international moderne, digne et oralement lisible. La ponctuation donne à la double exclamation sa force de lamentation. Le texte conserve le féminin personnifiant la ville et évite d’expliciter l’identité des gens de mer ou l’agent de la dévastation.
