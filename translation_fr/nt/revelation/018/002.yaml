  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: fr
  text: 'Et il cria d’une voix puissante : « Elle est tombée, elle est tombée, Babylone la grande ! Elle est devenue une demeure de démons, un repaire de tout esprit impur, un repaire de tout oiseau impur[a] et un repaire de toute bête impure et détestée[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « repaire » peut aussi désigner un lieu où des êtres sont gardés ou détenus.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits omettent « et un repaire de toute bête impure et détestée ».
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν ἐν ἰσχυρᾷ φωνῇ
  choice: il cria d’une voix puissante
  rationale: « Cria » exprime la proclamation forte de κράζω, tandis que « d’une voix puissante » conserve la valeur de ἰσχυρᾷ et le registre élevé de l’Apocalypse.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Elle est tombée, elle est tombée
  rationale: Le passé composé français rend naturellement l’aoriste comme proclamation d’un événement accompli; la répétition solennelle et l’écho prophétique sont conservés.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babylone la grande
  rationale: Cette formulation préserve la construction en apposition et la désignation récurrente de Babylone dans l’Apocalypse.
- source_word: ἐγένετο κατοικητήριον δαιμονίων
  choice: elle est devenue une demeure de démons
  rationale: Le passé composé souligne l’état résultant; « demeure » traduit clairement κατοικητήριον et « démons » rend directement δαιμονίων.
- source_word: φυλακή
  choice: repaire
  rationale: Dans cette accumulation liée à des esprits, oiseaux et bêtes, « repaire » exprime naturellement en français un lieu occupé ou fréquenté par des êtres inquiétants. Le sens possible de lieu de garde ou de détention est signalé en note.
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: tout esprit impur
  rationale: « Impur » conserve le vocabulaire biblique de l’impureté sans réduire l’expression à une simple méchanceté morale.
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: tout oiseau impur
  rationale: La traduction reste générique comme le grec et ne précise pas arbitrairement qu’il s’agit d’oiseaux charognards.
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: toute bête impure et détestée
  rationale: « Bête » garde ici le sens commun de θηρίον, et « détestée » reflète la valeur passive et résultative de μεμισημένου.
theological_decisions:
- issue: Sens de θηρίον dans la dernière proposition
  choice: nom commun « bête »
  alternative: titre apocalyptique « la Bête »
  rationale: Le génitif singulier est régi par παντός et se trouve dans une série avec tout esprit et tout oiseau. Le contexte favorise donc une catégorie d’animaux plutôt que l’adversaire symbolique appelé ailleurs « la Bête ».
- issue: Valeur contextuelle de φυλακή
  choice: « repaire », avec « lieu de détention » en note
  alternative: « prison »
  rationale: φυλακή peut désigner la garde, la détention ou un lieu où quelque chose est gardé; dans ce tableau de désolation, il peut aussi évoquer un lieu occupé par ces êtres. La traduction principale privilégie le français naturel sans effacer l’autre possibilité lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence proclamatoire est maintenue par la répétition « elle est tombée » et par l’anaphore « un repaire de tout… ». Les marqueurs [a] et [b] figurent tous deux dans le texte principal.
