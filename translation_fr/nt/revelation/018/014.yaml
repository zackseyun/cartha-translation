revisions:
- from: Le fruit que ton âme désirait s’en est allé loin de toi, et tout ce qui était raffiné et splendide a disparu de chez toi. Plus jamais on ne retrouvera ces choses.[a]
  to: Le fruit que ton âme désirait s’en est allé loin de toi, et tous les biens luxueux et splendides ont disparu loin de toi, et plus jamais on ne les retrouvera.[a]
  rationale: La révision remplace l’imparfait interprétatif par des substantifs pluriels qui reflètent les deux adjectifs grecs substantivés, et harmonise les deux occurrences de ἀπὸ σοῦ par « loin de toi ». La forme active impersonnelle « on ne les retrouvera » conserve l’ambiguïté du sujet pluriel non exprimé; la note fournit l’alternative passive.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:48:11Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend fidèlement ὀπώρα et la chaîne « de désir/de l’âme » de façon naturelle. La dernière proposition préserve bien le sujet indéfini de εὑρήσουσιν par « on ». En revanche, « tout ce qui était raffiné et splendide » introduit un imparfait non exprimé et affaiblit le pluriel substantivé de πάντα τὰ λιπαρὰ καὶ τὰ λαμπρά. « De chez toi » est plus domestique et plus étroit que ἀπὸ σοῦ (« loin de toi » / « de toi »).
  naturalness: Le français est globalement moderne et lisible. « Les biens luxueux et splendides » est plus idiomatique que « tout ce qui était raffiné et splendide » dans ce contexte de perte de richesses, sans imposer une catégorie matérielle plus précise que le grec.
  terminology: « Fruit », « âme », « désir », « luxueux », « splendides » et « plus jamais » conviennent au registre du passage et à ses termes grecs. Le tutoiement conserve l’apostrophe singulière à Babylone.
  issues:
  - severity: medium
    issue: Imparfait ajouté dans « tout ce qui était raffiné et splendide »
    rationale: ἀπώλετο est le verbe de perte au passé; les deux adjectifs grecs substantivés désignent les choses luxueuses et splendides elles-mêmes. L’imparfait français suggère inutilement un état antérieur distinct.
  - severity: low
    issue: « de chez toi » pour ἀπὸ σοῦ
    rationale: Cette expression évoque surtout un domicile. « loin de toi » garde la séparation personnelle et correspond mieux à la reprise de ἀπὸ σοῦ dans les deux membres.
  revised_text: Le fruit que ton âme désirait s’en est allé loin de toi, et tous les biens luxueux et splendides ont disparu loin de toi, et plus jamais on ne les retrouvera.[a]
  revised_footnotes:
  - marker: a
    text: 'Ou : « ils ne seront plus jamais retrouvés ». Le grec ne précise pas le sujet du verbe.'
    reason: alternative_reading
  revision_rationale: La révision remplace l’imparfait interprétatif par des substantifs pluriels qui reflètent les deux adjectifs grecs substantivés, et harmonise les deux occurrences de ἀπὸ σοῦ par « loin de toi ». La forme active impersonnelle « on ne les retrouvera » conserve l’ambiguïté du sujet pluriel non exprimé; la note fournit l’alternative passive.
