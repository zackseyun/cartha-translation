id: REV.18.14
reference: Revelation 18:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: fr
  text: Le fruit que ton âme désirait s’en est allé loin de toi, et tous les biens luxueux et splendides ont disparu loin de toi, et plus jamais on ne les retrouvera.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne seront plus jamais retrouvés ». Le grec ne précise pas le sujet du verbe.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: le fruit
  rationale: Le terme désigne le fruit, notamment le fruit mûr ou de fin de saison. « Le fruit » conserve l’image concrète et sa valeur collective dans ce catalogue de produits de luxe.
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: que ton âme désirait
  rationale: Cette formulation française naturelle exprime la chaîne de génitifs tout en conservant explicitement « âme » et l’intensité du désir intérieur.
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: s’en est allé loin de toi
  rationale: Le passé composé souligne le résultat présent de la perte, tandis que « loin de toi » rend la séparation exprimée par ἀπό.
- source_word: πάντα τὰ λιπαρὰ
  choice: tout ce qui était raffiné
  rationale: Dans le contexte commercial, λιπαρά évoque l’opulence et le luxe plutôt que les seuls aliments gras. « Raffiné » reste assez large pour englober les biens somptueux.
- source_word: τὰ λαμπρὰ
  choice: splendide
  rationale: Le mot qualifie ce qui brille par son éclat ou sa magnificence; « splendide » convient au luxe ostentatoire du contexte.
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: a disparu de chez toi
  rationale: Le verbe intransitif exprime ici une perte irréversible. « De chez toi » indique que ces biens ont disparu du domaine de la cité interpellée.
- source_word: οὐκέτι οὐ μὴ
  choice: plus jamais
  rationale: Le grec cumule des négations pour marquer une finalité catégorique; « plus jamais » en restitue naturellement la force.
- source_word: αὐτὰ εὑρήσουσιν
  choice: on ne retrouvera ces choses
  rationale: La troisième personne du pluriel n’a pas de sujet exprimé et peut avoir une valeur indéfinie. Le pronom français « on » maintient cette indétermination sans inventer d’acteur précis.
theological_decisions:
- issue: Sujet implicite de εὑρήσουσιν
  choice: Sujet indéfini rendu par « on ne retrouvera ces choses »
  alternative: « Ces choses ne seront plus jamais retrouvées »
  rationale: Le grec emploie une troisième personne du pluriel sans sujet explicite. Le français indéfini « on » en préserve la forme active et l’indétermination; la note signale la traduction passive également possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier conserve l’adresse directe à Babylone. La première proposition garde l’image du fruit et la mention explicite de l’âme; la dernière demeure catégorique sans identifier le sujet indéfini.
