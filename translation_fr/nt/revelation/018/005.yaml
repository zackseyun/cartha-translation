id: REV.18.5
reference: Revelation 18:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: fr
  text: En effet, ses péchés se sont entassés jusqu’au ciel[a], et Dieu s’est souvenu de ses injustices[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se sont joints les uns aux autres jusqu’au ciel » ; le verbe grec signifie littéralement « être collé » ou « être joint » et exprime ici l’accumulation des péchés en une immense masse.
    reason: lexical_alternative
  - marker: b
    text: 'Ici, le fait que Dieu « se soit souvenu » a une portée judiciaire : il n’a pas laissé ses injustices sans suite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: En effet
  rationale: Introduit naturellement en français la raison de l’ordre donné au verset précédent, tout en conservant la valeur causale du grec.
- source_word: ἐκολλήθησαν
  choice: se sont entassés
  rationale: Le verbe signifie littéralement « être collé/joint ». Avec les péchés pour sujet et le ciel comme limite, il évoque ici une accumulation formant une masse qui s’élève.
- source_word: ἁμαρτίαι
  choice: péchés
  rationale: Équivalent français usuel et précis de ἁμαρτίαι.
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: jusqu’au ciel
  rationale: Rend directement la limite exprimée par ἄχρι et conserve l’image verticale ainsi que le registre biblique.
- source_word: ἐμνημόνευσεν
  choice: s’est souvenu
  rationale: Conserve le verbe grec et l’idiome biblique du souvenir divin, dont le contexte indique la portée judiciaire sans l’expliciter dans le corps du texte.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Traduction directe et habituelle.
- source_word: ἀδικήματα
  choice: injustices
  rationale: Préserve la distinction avec ἁμαρτίαι et rend la dimension de tort ou d’acte injuste portée par ἀδίκημα. Le pluriel désigne ici les actes commis.
theological_decisions:
- issue: Distinction entre ἁμαρτίαι et ἀδικήματα
  choice: 'Employer deux termes distincts : « péchés » et « injustices »'
  alternative: Traduire les deux termes par « péchés » ou rendre ἀδικήματα par « méfaits »
  rationale: Le grec emploie deux mots apparentés mais distincts. La traduction en garde la plénitude rhétorique sans imposer entre eux une opposition théologique trop stricte.
- issue: Portée du souvenir de Dieu
  choice: Traduire littéralement par « Dieu s’est souvenu »
  alternative: « Dieu lui a demandé compte » ou « Dieu a fait venir en jugement »
  rationale: Dans ce contexte, le souvenir divin implique une intervention judiciaire, mais le texte dit « s’est souvenu ». Cette formulation préserve la tension théologique au lieu de la résoudre par une paraphrase.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » relie clairement le verset à l’exhortation précédente. « Jusqu’au ciel » conserve l’image biblique sans lourdeur, tandis que les notes signalent le sens littéral inhabituel du verbe et la portée contextuelle du souvenir divin.
