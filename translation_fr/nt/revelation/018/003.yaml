id: REV.18.3
reference: Revelation 18:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: fr
  text: Car toutes les nations sont tombées à cause du vin de la fureur de son immoralité sexuelle[a], les rois de la terre se sont livrés à l’immoralité sexuelle avec elle[b], et les marchands de la terre se sont enrichis grâce à la puissance de son luxe effréné.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Une variante grecque lit : « ont bu ». Dans le texte grec retenu ici, le verbe signifie « sont tombées ». Le terme traduit par « fureur » peut aussi évoquer une « passion », et l’enchaînement des compléments peut se comprendre de plusieurs manières.'
    reason: textual_variant_and_lexical_ambiguity
  - marker: b
    text: Cette image sexuelle évoque probablement des alliances idolâtres, corrompues et fondées sur l’exploitation ; la traduction conserve toutefois l’image du grec.
    reason: metaphorical_tension
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit la raison de l’annonce précédente concernant la chute de Babylone et conserve clairement la valeur causale.
- source_word: ἐκ τοῦ οἴνου
  choice: à cause du vin
  rationale: Avec la leçon πέπτωκαν du texte source fourni, ἐκ exprime naturellement la cause ou l’origine de la chute.
- source_word: θυμοῦ
  choice: fureur
  rationale: θυμός peut désigner la colère ou une passion violente. « Fureur » maintient l’intensité et l’ambiguïté entre passion déchaînée et colère destructrice.
- source_word: πορνείας
  choice: immoralité sexuelle
  rationale: Expression moderne et compréhensible qui conserve l’image sexuelle sans la restreindre à la prostitution commerciale.
- source_word: πέπτωκαν
  choice: sont tombées
  rationale: Traduit directement le parfait de πίπτω tel qu’il figure dans le texte grec fourni, plutôt que d’adopter la leçon variante signifiant « ont bu ».
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Désigne collectivement les peuples soumis à l’influence de Babylone.
- source_word: μετ’ αὐτῆς ἐπόρνευσαν
  choice: se sont livrés avec elle à l’immoralité sexuelle
  rationale: Conserve le lien lexical et imagé avec πορνεία, tout en restant naturel en français.
- source_word: ἔμποροι
  choice: marchands
  rationale: Convient au contexte du commerce international et des produits de luxe au chapitre 18.
- source_word: ἐκ τῆς δυνάμεως
  choice: grâce à la puissance de
  rationale: Préserve la notion de force ou de puissance de δύναμις et exprime ici la source de leur enrichissement.
- source_word: στρήνους
  choice: luxe effréné
  rationale: στρῆνος désigne un luxe arrogant, sensuel et excessif, et non le simple confort matériel.
- source_word: ἐπλούτησαν
  choice: se sont enrichis
  rationale: Rend naturellement en français le résultat économique exprimé par l’aoriste.
theological_decisions:
- issue: Faut-il expliciter πορνεία et πορνεύω comme de l’idolâtrie ou des alliances corrompues ?
  choice: Conserver dans le texte l’image de l’immoralité sexuelle
  alternative: Traduire par « idolâtrie », « infidélité spirituelle » ou « alliances corrompues »
  rationale: L’Apocalypse fait fonctionner simultanément l’image sexuelle et ses dimensions religieuses, politiques et économiques. Une explicitation unique supprimerait cette tension voulue.
- issue: Comment traiter la leçon πέπτωκαν du texte grec fourni face à la variante πέπωκαν ?
  choice: Traduire « sont tombées »
  alternative: Traduire « ont bu »
  rationale: Le projet demande de partir en priorité du texte original fourni. πέπτωκαν signifie « sont tombées »; la variante qui signifie « ont bu » est signalée en note sans remplacer le texte de base.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le mouvement ternaire du grec. « Luxe effréné » rend la décadence de στρῆνος sans recourir à un terme archaïque; « immoralité sexuelle » maintient l’image explicite et son écho verbal.
