id: REV.18.22
reference: Revelation 18:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: fr
  text: Et l’on n’entendra plus jamais chez toi le son des joueurs de lyre, des musiciens, des joueurs d’aulos[a] et des joueurs de trompette. On ne trouvera plus jamais chez toi aucun artisan, quel que soit son métier, et l’on n’entendra plus jamais chez toi le bruit d’une meule[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’aulos était un instrument à vent antique, généralement muni d’une anche; il ne correspondait pas exactement à la flûte moderne. Autre traduction possible : « joueurs de flûte ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « le bruit d’un moulin ». Le grec peut désigner une meule ou, plus largement, le dispositif servant à moudre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: le son / le bruit
  rationale: Le terme désigne ici un phénomène audible plutôt qu’une voix parlée. « Son » convient aux instruments, tandis que « bruit » est plus naturel pour la meule, sans effacer la répétition conceptuelle.
- source_word: κιθαρῳδῶν
  choice: joueurs de lyre
  rationale: Le mot désigne des exécutants associés à la kithara, instrument à cordes de la famille des lyres. Cette formulation est compréhensible et plus historiquement précise que « harpistes ».
- source_word: μουσικῶν
  choice: musiciens
  rationale: Le terme désigne largement des exécutants musicaux et s’intègre naturellement à l’énumération.
- source_word: αὐλητῶν
  choice: joueurs d’aulos
  rationale: L’aulos était un instrument à vent antique, souvent à anche, qui ne correspond pas exactement à la flûte moderne. La translittération accompagnée d’une note évite une identification trompeuse.
- source_word: σαλπιστῶν
  choice: joueurs de trompette
  rationale: Cette expression française naturelle désigne clairement ceux qui sonnent de la trompette.
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: l’on n’entendra plus jamais
  rationale: La combinaison οὐ μή avec le subjonctif aoriste exprime une négation fortement emphatique, et ἔτι marque la cessation définitive. « Plus jamais » rend cette finalité avec vigueur et naturel.
- source_word: ἐν σοὶ
  choice: chez toi
  rationale: Babylone est apostrophée comme une ville personnifiée. « Chez toi » conserve l’adresse directe tout en étant idiomatique pour ce qui se passe dans une ville.
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: aucun artisan, quel que soit son métier
  rationale: Cette tournure restitue la portée exhaustive du grec sans reproduire en français une répétition lourde de type « artisan de tout artisanat ».
- source_word: εὑρεθῇ
  choice: on ne trouvera
  rationale: Le passif grec se rend naturellement par le pronom indéfini « on » en français; avec « plus jamais », la disparition totale reste explicite.
- source_word: μύλου
  choice: d’une meule
  rationale: μύλος peut désigner la meule ou le dispositif de mouture. « Le bruit d’une meule » évoque concrètement l’activité quotidienne de broyage tout en laissant ouverte l’étendue exacte du référent.
theological_decisions:
- issue: Imagerie du jugement de Babylone
  choice: Conserver les trois déclarations concrètes de cessation définitive — musique, activité artisanale et mouture — sans leur attribuer dans le texte une signification allégorique précise.
  alternative: Expliciter ces éléments comme symboles de la fête, de l’économie et de la subsistance.
  rationale: La répétition de οὐ μή ... ἔτι souligne une désolation totale et irréversible, mais le verset présente des images concrètes sans en fournir lui-même une interprétation détaillée.
translation_notes:
  register: Français international moderne, digne et accessible. La triple reprise de « plus jamais chez toi » conserve l’insistance solennelle du grec. « Joueurs de lyre » et « joueurs d’aulos » privilégient la précision historique, avec une note explicative pour le terme le moins familier.
