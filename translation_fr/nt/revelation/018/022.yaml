  to: Et l’on n’entendra plus jamais chez toi le son des joueurs de lyre, des musiciens, des joueurs d’aulos[a] et des joueurs de trompette. On ne trouvera plus jamais chez toi aucun artisan, quel que soit son métier, et l’on n’entendra plus jamais chez toi le bruit d’une meule[b].
  rationale: La seule modification est le remplacement de « des trompettes » par « des joueurs de trompette », afin de rendre correctement σαλπιστῶν et de maintenir une énumération homogène d’exécutants musicaux. Le sens, l’imagerie et les deux notes existantes sont conservés.
