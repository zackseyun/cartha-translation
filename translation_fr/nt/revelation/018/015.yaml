id: REV.18.15
reference: Revelation 18:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: fr
  text: Les marchands de ces produits[a], qui se sont enrichis grâce à elle, se tiendront à distance par crainte de son tourment, pleurant et menant deuil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de ces marchandises » ou « de ces biens »; l'expression renvoie aux produits de luxe énumérés dans le contexte.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἔμποροι
  choice: marchands
  rationale: Désigne des personnes qui pratiquent le commerce; « marchands » est naturel et convient au contexte économique.
- source_word: τούτων
  choice: de ces produits
  rationale: Le démonstratif au génitif renvoie aux marchandises de luxe énumérées dans le contexte. « Produits » explicite légèrement le référent commercial sans préciser davantage leur nature.
- source_word: πλουτήσαντες
  choice: qui se sont enrichis
  rationale: Le participe aoriste exprime leur enrichissement antérieur; la tournure pronominale est idiomatique et n'impose pas un sens passif.
- source_word: ἀπ’ αὐτῆς
  choice: grâce à elle
  rationale: ἀπό indique ici la source de leur richesse. « Grâce à elle » rend naturellement en français l'avantage qu'ils ont tiré d'elle, sans en faire l'agent grammatical direct.
- source_word: ἀπὸ μακρόθεν
  choice: à distance
  rationale: Rend l'idée d'une distance spatiale volontairement maintenue et s'accorde naturellement avec « se tenir ».
- source_word: στήσονται
  choice: se tiendront
  rationale: Le futur moyen de ἵστημι décrit le fait de se placer ou de rester debout; « se tiendront » restitue naturellement cette nuance.
- source_word: διὰ τὸν φόβον
  choice: par crainte de
  rationale: διά avec l'accusatif exprime la cause; cette formulation est concise et idiomatique.
- source_word: βασανισμοῦ
  choice: tourment
  rationale: Dans l'Apocalypse, le terme évoque une souffrance intense liée au jugement. « Tourment » en conserve la force sans introduire les connotations plus étroites de « torture ».
- source_word: κλαίοντες
  choice: pleurant
  rationale: Exprime les pleurs manifestes et conserve la distinction avec le participe suivant.
- source_word: πενθοῦντες
  choice: menant deuil
  rationale: Exprime le deuil et la lamentation causés par la perte; la locution distingue nettement cette idée de celle de pleurer.
theological_decisions:
- issue: Nature de βασανισμός dans le langage apocalyptique du jugement
  choice: « tourment », sans réduire le terme à une détresse seulement affective ou économique
  alternative: « châtiment » ou « détresse »
  rationale: Le contexte immédiat porte sur le jugement de Babylone, et l'Apocalypse emploie ce terme pour une souffrance punitive intense. La traduction en préserve la gravité sans développer une doctrine que ce verset n'énonce pas.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la structure solennelle du texte grec tout en employant des tournures françaises naturelles.
