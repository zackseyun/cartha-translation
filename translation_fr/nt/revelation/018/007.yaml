id: REV.18.7
reference: Revelation 18:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: fr
  text: 'Autant elle s’est glorifiée et a vécu dans le luxe[a], autant donnez-lui de tourment et de deuil. Car elle dit dans son cœur : « Je siège en reine, je ne suis pas veuve et je ne verrai absolument jamais le deuil[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’est livrée aux plaisirs » ou « a vécu dans la démesure ». Le verbe grec peut désigner une vie luxueuse, débridée et tournée vers la satisfaction de soi.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici une négation particulièrement forte, qui exprime sa certitude présomptueuse de ne jamais voir le deuil.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: Autant ... autant
  rationale: Conserve la structure corrélative grecque et exprime clairement la proportion entre la conduite de Babylone et sa rétribution.
- source_word: ἐδόξασεν αὑτὴν
  choice: elle s’est glorifiée elle-même
  rationale: Maintient l’idée explicite d’auto-exaltation portée par la construction réfléchie.
- source_word: ἐστρηνίασεν
  choice: a vécu dans le luxe
  rationale: Rend naturellement l’idée d’une vie luxueuse, débridée et complaisante envers soi-même, sans donner au terme une portée exclusivement sexuelle.
- source_word: δότε αὐτῇ
  choice: donnez-lui
  rationale: Impératif direct qui convient au ton judiciaire et se construit naturellement avec « tourment et deuil ».
- source_word: βασανισμὸν
  choice: tourment
  rationale: Préserve la sévérité du jugement sans le réduire à la seule torture physique.
- source_word: πένθος
  choice: deuil
  rationale: Évoque la douleur liée à une perte et permet de conserver la répétition thématique du mot dans le verset.
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: elle dit dans son cœur
  rationale: Conserve l’idiome biblique décrivant une conviction intérieure et orgueilleuse.
- source_word: Κάθημαι βασίλισσα
  choice: Je siège en reine
  rationale: Préserve l’image d’une souveraine installée dans une position de puissance et de sécurité, dans un français naturel et digne.
- source_word: χήρα οὐκ εἰμί
  choice: je ne suis pas veuve
  rationale: Traduction directe qui maintient l’image de l’absence supposée de perte ou d’abandon.
- source_word: οὐ μὴ ἴδω
  choice: jamais, non jamais, je ne connaîtrai
  rationale: La reprise « jamais, non jamais » restitue la négation grecque fortement emphatique; « connaître le deuil » exprime idiomatiquement le fait d’en faire l’expérience.
theological_decisions:
- issue: Personnification de Babylone comme femme, reine et veuve
  choice: Maintenir le féminin et les images de reine et de veuve.
  alternative: Transformer Babylone en ville ou en système impersonnel.
  rationale: Le grec personnifie constamment Babylone au féminin; cette personnification porte la force littéraire et théologique de son orgueil et de son jugement.
- issue: Portée judiciaire de βασανισμός
  choice: Employer « tourment ».
  alternative: Employer « torture » ou « souffrance ».
  rationale: « Tourment » conserve la gravité de la rétribution sans préciser un mécanisme de châtiment que le texte ne précise pas.
translation_notes:
  register: Français international moderne, clair et digne. La structure proportionnelle, la personnification féminine et la répétition de « deuil » sont conservées. « Je siège en reine » maintient l’image royale sans lourdeur, tandis que « jamais, non jamais » rend audible l’insistance de la négation grecque.
