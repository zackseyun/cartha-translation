  verdict: revise
  source_fidelity: 'Le sens lexical est globalement fidèle : la distance, la crainte causée par le tourment de Babylone, la double lamentation, la grandeur et la puissance de la ville, ainsi que la soudaineté du jugement sont bien rendus. Toutefois, « Se tenant à distance ... ils diront » est une construction moins naturelle en français et affaiblit la relation étroite des deux participes grecs (« se tenant ... disant »).'
  naturalness: « Se tenant à distance par peur de son tourment, ils diront » est compréhensible, mais son enchaînement est raide en français moderne. « Ils se tiendront à distance ... et diront » est plus fluide, tout en restant cohérent avec le futur porté par le contexte immédiat (18.9). « Par crainte de » convient au registre solennel sans être archaïque.
  terminology: '« Malheur ! Malheur ! », « Babylone », « ville puissante » et « jugement » sont des choix justes. « Jugement » conserve correctement l’amplitude de κρίσις; aucune interprétation confessionnelle n’est ajoutée. Aucune note n’est nécessaire ici : les alternatives anglaises ne signalent pas une ambiguïté textuelle qui exigerait une note française.'
