id: REV.18.10
reference: Revelation 18:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: fr
  text: 'Ils se tiendront à distance, par crainte de son tourment, et diront : « Malheur ! Malheur ! La grande ville, Babylone, la ville puissante ! Car, en une seule heure, ton jugement est arrivé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: Se tenant à distance
  rationale: La tournure rend naturellement en français la posture durable exprimée par le participe parfait et la distance spatiale, sans archaïsme.
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: par peur de son tourment
  rationale: διά avec l’accusatif exprime la cause. « Tourment » conserve l’intensité de βασανισμός sans préciser indûment la forme de la souffrance.
- source_word: λέγοντες
  choice: ils diront
  rationale: Le participe introduit les paroles des rois mentionnés dans le contexte. Le futur français assure un enchaînement naturel avec le verbe principal du verset précédent, sans changer le repérage temporel du discours.
- source_word: Οὐαὶ οὐαί
  choice: Malheur ! Malheur !
  rationale: « Malheur » garde à la fois la lamentation et la portée de condamnation prophétique de l’interjection grecque.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: La grande ville
  rationale: Rendu attributif naturel de la construction grecque avec répétition de l’article.
- source_word: Βαβυλὼν
  choice: Babylone
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: la ville puissante
  rationale: ἰσχυρός évoque force et puissance. « Puissante » convient mieux à une ville que « forte » dans ce contexte et préserve la portée du terme.
- source_word: μιᾷ ὥρᾳ
  choice: en une seule heure
  rationale: La formulation souligne clairement la soudaineté et la brièveté exprimées par le grec.
- source_word: ἦλθεν ἡ κρίσις σου
  choice: ton jugement est arrivé
  rationale: Le passé composé exprime naturellement en français l’arrivée accomplie du jugement avec sa pertinence présente dans la lamentation.
theological_decisions:
- issue: Portée de l’interjection apocalyptique οὐαί
  choice: Malheur ! Malheur !
  alternative: Hélas ! Hélas !
  rationale: « Malheur » préserve mieux l’association entre lamentation et annonce de condamnation, tandis que « hélas » mettrait surtout l’accent sur le regret.
- issue: Sens de κρίσις
  choice: jugement
  alternative: condamnation
  rationale: « Jugement » conserve l’étendue sémantique du grec et évite de réduire explicitement le terme au verdict, même si le contexte implique une issue punitive.
- issue: Aspect de ἦλθεν
  choice: est arrivé
  alternative: vint
  rationale: Le passé composé restitue en français courant un événement accompli dont les effets sont présents, sans transformer cette nuance aspectuelle en affirmation doctrinale.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La ponctuation détache la double lamentation et conserve l’intensité apocalyptique. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
