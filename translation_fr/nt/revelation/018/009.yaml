id: REV.18.9
reference: Revelation 18:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: fr
  text: Les rois de la terre, qui se sont livrés à l’immoralité sexuelle avec elle et ont vécu avec elle dans le luxe, pleureront et se lamenteront sur elle[a] quand ils verront la fumée de son embrasement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se frapperont en signe de deuil » ; le verbe grec évoque une lamentation manifestée par des gestes.
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: pleureront
  rationale: Le futur de κλαίω exprime des pleurs manifestes; « pleureront » est naturel et garde la force émotionnelle.
- source_word: κόψονται
  choice: se lamenteront
  rationale: Dans cet emploi, le moyen de κόπτω désigne une manifestation de deuil; « se lamenteront » conserve cette dimension sans suggérer à tort une automutilation littérale.
- source_word: ἐπ’ αὐτὴν
  choice: sur elle
  rationale: Avec les verbes de lamentation, ἐπί suivi de l’accusatif désigne l’objet du deuil; « sur elle » convient au registre biblique français actuel.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: les rois de la terre
  rationale: Expression apocalyptique usuelle désignant les souverains du monde.
- source_word: μετ’ αὐτῆς
  choice: avec elle
  rationale: Le complément associatif porte naturellement sur les deux participes coordonnés dans la formulation française.
- source_word: πορνεύσαντες
  choice: se sont livrés à l’immoralité sexuelle
  rationale: Cette formulation préserve l’imagerie sexuelle du grec tout en restant intelligible et digne en français moderne.
- source_word: στρηνιάσαντες
  choice: ont vécu dans le luxe
  rationale: Le verbe évoque une vie de luxe effréné et complaisant; la formulation retenue est claire et correspond à la critique économique et morale du contexte.
- source_word: ὅταν βλέπωσιν
  choice: quand ils verront
  rationale: Ὅταν avec le subjonctif présent exprime ici une éventualité future; le futur français rend naturellement la perspective prophétique.
- source_word: τὸν καπνὸν
  choice: la fumée
  rationale: Équivalent direct et idiomatique.
- source_word: τῆς πυρώσεως αὐτῆς
  choice: de son embrasement
  rationale: πύρωσις désigne ici l’action ou l’état de brûler; « embrasement » restitue l’image de la destruction par le feu sans ajouter la notion de tourment.
theological_decisions:
- issue: Nature de l’image exprimée par πορνεύσαντες
  choice: Conserver dans le texte l’expression « immoralité sexuelle » tout en laissant au contexte sa portée métaphorique.
  alternative: Rendre plus abstraitement par « se sont corrompus » ou « ont été infidèles avec elle ».
  rationale: Dans l’Apocalypse, cette imagerie peut évoquer les alliances idolâtres et corrompues, mais la traduction ne doit pas effacer sa formulation volontairement sexualisée.
- issue: Sens de κόψονται
  choice: Traduire le sens de lamentation démonstrative.
  alternative: « se frapperont la poitrine » ou, trop littéralement, « se frapperont ».
  rationale: L’idiome concerne le deuil visible; une traduction littérale risquerait de déplacer l’accent vers un geste corporel précis ou l’automutilation.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’ordre logique du grec, l’imagerie sexualisée et le rapport partagé de « avec elle » aux deux conduites, sans expliciter davantage l’identité symbolique de Babylone.
