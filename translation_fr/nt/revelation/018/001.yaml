    rationale: « Il avait une grande autorité » est compréhensible, mais l’imparfait et la nouvelle phrase affaiblissent le lien direct entre l’ange vu et sa possession d’autorité au moment de sa descente.
  - severity: low
    issue: Formulation de la note lexicale
    rationale: « À partir de sa gloire » est lourd et ne constitue pas une bonne formulation française de l’alternative liée à ἐκ. La note peut proposer simplement « de sa gloire », en signalant son caractère plus littéral.
  revised_text: Après cela, je vis un autre ange descendre du ciel, ayant une grande autorité, et la terre fut illuminée par sa gloire.[a]
