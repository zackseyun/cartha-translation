id: REV.18.1
reference: Revelation 18:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: fr
  text: Après cela, je vis un autre ange descendre du ciel, ayant une grande autorité, et la terre fut illuminée par sa gloire.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « La terre fut illuminée de sa gloire. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Expression temporelle naturelle en français qui marque la succession des visions. Le singulier français reprend idiomatiquement l'ensemble des événements précédents sans imposer un découpage différent.
- source_word: εἶδον
  choice: je vis
  rationale: Le passé simple convient au registre narratif digne de la vision et rend directement l'aoriste sans ajouter la nuance de « regarder ».
- source_word: ἄλλον ἄγγελον
  choice: un autre ange
  rationale: Rend simplement l'idée d'un ange supplémentaire dans la succession visionnaire.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: descendre du ciel
  rationale: L'infinitif après « je vis » rend naturellement en français le participe présent contemporain de la vision; « du ciel » exprime la provenance indiquée par ἐκ.
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: Il avait une grande autorité
  rationale: « Autorité » préserve le sens de droit ou de pouvoir conféré porté par ἐξουσία, plutôt que celui de simple puissance. Une nouvelle phrase évite une longue accumulation participiale.
- source_word: ἡ γῆ
  choice: la terre
  rationale: L'image d'une illumination à portée cosmique favorise « la terre » plutôt qu'un territoire local.
- source_word: ἐφωτίσθη
  choice: fut illuminée
  rationale: Préserve la voix passive de l'aoriste et le caractère solennel de la scène.
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: par sa gloire
  rationale: En français, « par » exprime naturellement la source ou la cause de l'illumination; la note conserve une formulation plus proche de la valeur littérale de ἐκ.
theological_decisions:
- issue: Nature de la gloire et de l'autorité de l'ange
  choice: Conserver sans atténuation « une grande autorité » et « sa gloire », sans identifier l'ange comme divin.
  alternative: Interpréter l'intensité de la gloire qui illumine la terre comme suggérant une identité divine.
  rationale: Le grec attribue explicitement autorité et gloire à l'ange, mais ne le qualifie pas de divin. La traduction maintient la force et la tension du texte sans ajouter d'explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre visionnaire et littéraire de l'Apocalypse. La division en deux phrases améliore la lisibilité sans modifier les rapports syntaxiques essentiels.
