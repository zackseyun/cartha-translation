  rationale: 'La révision conserve tous les éléments du grec et leur rapport syntaxique : l’ange qui descend est aussi celui qui a une grande autorité. « Par sa gloire » demeure la traduction française idiomatique de la source ou du moyen exprimé par ἐκ, tandis que la note conserve une possibilité plus proche de la préposition grecque sans imposer une interprétation théologique.'
