id: REV.18.21
reference: Revelation 18:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: fr
  text: 'Puis un ange puissant souleva une pierre semblable à une grande meule et la jeta dans la mer. Il dit : « Ainsi, Babylone, la grande ville, sera précipitée avec violence[a], et on ne la retrouvera plus jamais. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec un élan impétueux », « avec force » ou « brutalement ». Le terme grec évoque un mouvement soudain et puissant.
    reason: Alternative lexicale pour ὁρμήματι, dont le sens associe élan brusque et force violente.
lexical_decisions:
- source_word: ἦρεν
  choice: souleva
  rationale: L’aoriste de αἴρω décrit ici l’action de prendre et lever la pierre avant de la jeter. « Souleva » exprime naturellement ce mouvement physique délibéré.
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: un ange puissant
  rationale: En français, « un » désigne naturellement l’unique ange introduit dans la scène. « Puissant » rend ἰσχυρός dans un registre apocalyptique actuel et digne.
- source_word: λίθον ὡς μύλινον μέγαν
  choice: une pierre semblable à une grande meule
  rationale: « Semblable à » conserve la comparaison introduite par ὡς sans identifier strictement la pierre à la meule; « grande meule » préserve l’image de poids massif.
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: la jeta dans la mer
  rationale: « Jeta » rend directement et naturellement βάλλω tout en conservant la force du geste symbolique.
- source_word: Οὕτως
  choice: C’est avec la même… que
  rationale: Cette tournure rattache explicitement la déclaration au geste qui vient d’être accompli et rend la valeur démonstrative de Οὕτως dans un français naturel.
- source_word: ὁρμήματι
  choice: avec la même violence
  rationale: Le nom ὅρμημα évoque un mouvement soudain et impétueux. « Violence » en exprime la force destructrice; « même » appartient à la tournure française choisie pour Οὕτως et relie l’oracle au lancer de la pierre.
- source_word: βληθήσεται
  choice: sera précipitée
  rationale: Le futur passif de βάλλω reprend le geste précédent. « Sera précipitée » conserve l’idée d’un mouvement imposé, brusque et ruineux, sans ajouter explicitement un complément absent du grec.
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: Babylone, la grande ville
  rationale: La mise en apposition conserve la désignation grecque et l’intitulé apocalyptique sans interpréter l’identité de Babylone.
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: on ne la retrouvera plus jamais
  rationale: « Plus jamais » rend l’emphase de οὐ μή avec ἔτι. La construction avec « on » est idiomatique en français et garde le passif grec sans nommer d’agent.
theological_decisions:
- issue: Nature de l’image de la destruction de Babylone
  choice: Présenter une chute violente et définitive sans préciser si Babylone est littérale, symbolique ou les deux.
  alternative: Identifier Babylone à une ville historique précise, à un système mondial opposé à Dieu ou à un symbole apocalyptique composite.
  rationale: Le verset associe un geste symbolique à l’annonce d’un renversement catastrophique. La traduction doit conserver l’image et sa finalité sans imposer un scénario eschatologique que le grec n’explicite pas.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’enchaînement entre le geste symbolique et son interprétation. « Meule » reste volontairement général, puisque le grec décrit une pierre comparable à une grande meule sans en préciser davantage le type.
