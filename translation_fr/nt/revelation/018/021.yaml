  source_fidelity: 'Le sens principal est bien rendu : l’ange soulève une pierre comparable à une grande meule, la jette dans la mer, puis ce geste annonce la chute définitive de Babylone. Toutefois, « avec la même violence » et la tournure clivée introduisent une comparaison explicite (« même ») qui n’est pas formulée ainsi par le grec ; Οὕτως indique plutôt « ainsi/de cette manière », tandis que ὁρμήματι qualifie la manière violente ou impétueuse de la chute.'
  naturalness: Le texte est globalement clair et d’un registre approprié. « Ainsi, Babylone, la grande ville, sera précipitée avec violence » est plus direct, plus naturel et reflète mieux l’articulation grecque entre le geste symbolique et son interprétation.
  terminology: « Ange puissant », « grande meule », « Babylone, la grande ville » et « on ne la retrouvera plus jamais » conviennent. « Avec violence » rend de façon recevable ὁρμήματι, dont la note peut signaler les nuances d’élan impétueux et de force.
