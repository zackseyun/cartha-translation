  to: 'Puis un ange puissant souleva une pierre semblable à une grande meule et la jeta dans la mer. Il dit : « Ainsi, Babylone, la grande ville, sera précipitée avec violence[a], et on ne la retrouvera plus jamais. »'
  rationale: La révision distingue explicitement Οὕτως (« Ainsi ») de ὁρμήματι (« avec violence »). Elle évite d’ajouter l’idée d’une violence « identique » tout en conservant le lien démonstratif entre le geste de l’ange et l’annonce de la chute de Babylone. La note est ajustée afin que ses alternatives concernent seulement le terme grec qu’elle annote.
