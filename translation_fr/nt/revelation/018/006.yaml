reference: Revelation 18:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: fr
  text: Rendez-lui comme elle-même a rendu[a], et rendez-lui au double selon ses œuvres ; dans la coupe où elle a préparé son breuvage[b], préparez-lui une double mesure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Rendez-lui comme elle-même a rendu, et doublez pour elle ce qui est double » ; l’expression grecque est condensée et très appuyée, et peut souligner l’intensification de la rétribution.'
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire la coupe dans laquelle elle a préparé une boisson en la mélangeant ; l’image évoque vraisemblablement une boisson de jugement préparée pour être donnée.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ
  choice: Rendez-lui
  rationale: L’impératif appelle une rétribution. « Rendez-lui » conserve la reprise lexicale avec ἀπέδωκεν et le ton judiciaire sans ajouter un objet absent du grec.
- source_word: ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: selon ce qu’elle-même a rendu
  rationale: « Elle-même » restitue l’emphase de αὐτή. La formulation française garde ouverte l’identité exacte de ce qu’elle a rendu, comme le grec.
- source_word: διπλώσατε τὰ διπλᾶ
  choice: rendez-lui au double
  rationale: L’expression grecque est condensée et fortement emphatique. Cette formulation naturelle transmet l’idée d’une rétribution doublée sans imposer une stricte formule arithmétique.
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: selon ses œuvres
  rationale: « Œuvres » correspond directement à ἔργα et maintient le registre judiciaire de la rétribution mesurée d’après les actes.
- source_word: ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν
  choice: dans la coupe où elle a fait son mélange
  rationale: La coupe préserve l’image apocalyptique, tandis que « fait son mélange » exprime le sens de κεράννυμι, préparer une boisson en la mélangeant.
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: préparez-lui une double mesure
  rationale: « Préparez » reprend naturellement l’action de mélanger la boisson, et « une double mesure » rend idiomatiquement διπλοῦν tout en conservant l’image quantitative.
theological_decisions:
- issue: Nature de la rétribution doublée
  choice: Conserver l’image d’une rétribution judiciaire intensifiée sans préciser si le double est mathématiquement littéral.
  alternative: Interpréter le double comme une peine strictement quantitative, ou réduire l’expression à une affirmation générale de justice.
  rationale: Le langage apocalyptique associe une rétribution correspondant aux œuvres de Babylone à une intensification exprimée par le double. La traduction maintient cette tension au lieu de la résoudre.
translation_notes:
  register: Français international actuel, digne et direct. La répétition de « rendez » reflète la reprise du même verbe grec ; les formulations conservent le parallélisme, l’image de la coupe et la force judiciaire du verset.
