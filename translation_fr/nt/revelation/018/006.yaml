review_pass:
  verdict: revise
  source_fidelity: La première injonction doit conserver le parallèle avec l’action antérieure de Babylone (« comme elle a rendu »), sans transformer ὡς en une mesure explicative (« selon ce que »). La rétribution doublée et l’image de la coupe sont maintenues. « Préparé son breuvage » rend de façon idiomatique le mélange exprimé par ἐκέρασεν, sans prétendre identifier la boisson.
  naturalness: « Rendez-lui selon ce qu’elle-même a rendu » est moins naturel et infléchit la relation comparative du grec. La formulation révisée est directe et lisible en français international actuel. « Dans la coupe où elle a préparé son breuvage » est plus fluide que « où elle a fait son mélange ».
  terminology: « Rendez-lui », « œuvres », « coupe » et « double mesure » conviennent au registre judiciaire et imagé de l’Apocalypse. Le terme « breuvage » est employé seulement pour donner à « mélanger » un complément français naturel; il ne spécifie pas la nature de la boisson.
  issues:
  - severity: medium
    issue: La tournure « selon ce qu’elle-même a rendu » pour ὡς καὶ αὐτὴ ἀπέδωκεν
    rationale: ὡς est ici comparatif (« comme/de même que »). « Selon ce que » tend à présenter une norme ou le contenu de ce qui est rendu, plutôt que le parallèle voulu par le grec.
  - severity: low
    issue: « où elle a fait son mélange »
    rationale: La formulation est pesante en français et ne rend pas naturellement l’action de préparer une boisson par mélange. Une reformulation idiomatique peut préserver l’image sans en préciser le contenu.
