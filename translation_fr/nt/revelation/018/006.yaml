- from: Rendez-lui selon ce qu’elle-même a rendu[a], et rendez-lui au double selon ses œuvres ; dans la coupe où elle a fait son mélange[b], préparez-lui une double mesure.
  to: Rendez-lui comme elle-même a rendu[a], et rendez-lui au double selon ses œuvres ; dans la coupe où elle a préparé son breuvage[b], préparez-lui une double mesure.
  rationale: La révision rétablit la valeur comparative de ὡς, tout en conservant l’emphase de « elle-même ». Elle garde la formulation française naturelle « rendez-lui au double » pour l’expression grecque intensive et comprimée, sans trancher entre double strictement quantitatif et intensification rhétorique. La seconde image est rendue plus idiomatiquement, avec une note qui explicite le sens de « mélanger » sans imposer une interprétation doctrinale.
