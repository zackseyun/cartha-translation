id: REV.18.18
reference: Revelation 18:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: fr
  text: 'Et ils crièrent en voyant la fumée de son embrasement : « Quelle ville est comparable à la grande ville[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Qui ou quoi est semblable à la grande ville ? » Le grec est elliptique : il n’exprime pas le verbe et ne répète pas le mot « ville » dans la première partie de la comparaison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξαν
  choice: ils crièrent
  rationale: L’aoriste de κράζω exprime un cri poussé avec force. « Ils crièrent » est direct, naturel et soutenu sans être archaïque.
- source_word: βλέποντες
  choice: en voyant
  rationale: Le participe présent indique une action contemporaine de celle du verbe principal ; « en voyant » conserve ce rapport temporel.
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: la fumée de son embrasement
  rationale: « Embrasement » rend le processus ou l’état de combustion exprimé par πύρωσις, tandis que le possessif maintient le lien avec la ville personnifiée.
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: Quelle ville est comparable à la grande ville ?
  rationale: La formule grecque est elliptique, sans copule exprimée. Le contexte appelle une comparaison rhétorique ; « quelle ville » explicite naturellement en français l’élément comparé, et le présent convient à la portée de l’exclamation.
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: la grande ville
  rationale: Cette formulation rend directement la construction grecque articulée et reprend l’appellation connue dans le contexte.
theological_decisions:
- issue: Personnification de Babylone comme ville et comme femme
  choice: Conserver le lien possessif avec la ville dans « son embrasement »
  alternative: 'Reformuler de manière impersonnelle : « la fumée de l’incendie »'
  rationale: Le contexte de l’Apocalypse personnifie Babylone. La formulation retenue maintient cette cohérence littéraire sans ajouter d’interprétation.
- issue: Temps sous-entendu dans la question elliptique
  choice: 'Employer le présent : « est comparable »'
  alternative: 'Employer l’imparfait ou le passé composé : « était comparable » / « a été comparable »'
  rationale: Le grec n’exprime aucune copule et ne fixe donc pas explicitement le temps. Le présent rend naturellement l’affirmation rhétorique de son caractère incomparable, tout en laissant l’ellipse signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Embrasement » conserve l’idée de combustion portée par πύρωσις ; « est comparable » donne une tournure française naturelle à la question rhétorique elliptique.
