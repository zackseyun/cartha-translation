id: REV.18.16
reference: Revelation 18:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: fr
  text: 'ils disaient : « Malheur ! Malheur ! La grande ville, vêtue de fin lin, de pourpre et d’écarlate, parée d’or, de pierres précieuses et de perles, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: ils disaient
  rationale: Le participe présent nominatif pluriel se rattache au sujet du verset précédent. En français, une proposition conjuguée exprime naturellement cette continuité.
- source_word: Οὐαὶ οὐαί
  choice: Malheur ! Malheur !
  rationale: Cette répétition conserve à la fois la lamentation et la portée prophétique de jugement propres au contexte apocalyptique.
- source_word: ἡ πόλις ἡ μεγάλη
  choice: La grande ville
  rationale: Cette formulation française naturelle restitue la construction grecque emphatique sans lourdeur.
- source_word: περιβεβλημένη
  choice: vêtue de
  rationale: Le participe parfait décrit l’état somptueux de la ville personnifiée; « vêtue de » est clair et digne.
- source_word: βύσσινον
  choice: fin lin
  rationale: Le terme désigne un textile de lin raffiné et coûteux, élément essentiel de l’imagerie de luxe.
- source_word: πορφυροῦν
  choice: pourpre
  rationale: Le nom de couleur évoque naturellement richesse et rang élevé.
- source_word: κόκκινον
  choice: écarlate
  rationale: « Écarlate » est précis et conserve la vivacité ainsi que les résonances apocalyptiques du terme.
- source_word: κεχρυσωμένη
  choice: parée
  rationale: Le participe peut évoquer une dorure, mais les datifs coordonnés comprennent aussi pierres et perles; « parée » rend donc mieux l’ornementation somptueuse dans son ensemble.
- source_word: χρυσίῳ
  choice: d’or
  rationale: Rend directement la matière ou le moyen de la parure.
- source_word: λίθῳ τιμίῳ
  choice: de pierres précieuses
  rationale: Le singulier grec a ici une valeur collective; le pluriel est plus idiomatique en français dans cette énumération.
- source_word: μαργαρίτῃ
  choice: de perles
  rationale: Le singulier grec peut être compris collectivement; le pluriel français exprime naturellement la profusion de la parure.
theological_decisions:
- issue: Tonalité de la lamentation sur la chute de Babylone
  choice: Traduire οὐαί par « Malheur ! » afin de conserver lamentation et jugement
  alternative: « Hélas ! » mettrait davantage l’accent sur la seule affliction
  rationale: Dans cet oracle de jugement, « Malheur ! » préserve mieux la force prophétique et apocalyptique sans exclure la douleur des locuteurs.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation forte détache le double cri de lamentation. La ville est personnifiée conformément au grec; les pluriels « pierres précieuses » et « perles » rendent idiomatiquement les singuliers collectifs.
