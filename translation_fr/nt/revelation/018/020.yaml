id: REV.18.20
reference: Revelation 18:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: fr
  text: Réjouis-toi à son sujet[a], ô ciel ! Et vous aussi, saints, apôtres et prophètes, car Dieu a jugé votre cause contre elle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec est condensé : littéralement, « Dieu a jugé votre jugement d’elle ». On peut aussi comprendre : « Dieu vous a fait justice contre elle » ou « Dieu a exécuté contre elle le jugement qui vous concernait ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Εὐφραίνου
  choice: Réjouis-toi
  rationale: L’impératif au singulier adresse au ciel une exhortation directe à la joie. « Réjouis-toi » en conserve clairement la force.
- source_word: ἐπ’ αὐτῇ
  choice: de son sort
  rationale: Avec un verbe exprimant la joie, ἐπί avec le datif indique ici ce qui motive cette joie. « De son sort » est naturel en français et renvoie, dans le contexte, au jugement qui frappe Babylone sans ajouter explicitement « chute » au texte.
- source_word: οὐρανέ
  choice: ô ciel
  rationale: Le vocatif singulier personnifie le ciel. « Ô ciel » en maintient la forme solennelle et l’adresse directe.
- source_word: οἱ ἅγιοι
  choice: saints
  rationale: Dans l’Apocalypse, le terme désigne couramment les membres du peuple saint de Dieu. « Saints » est ici concis et traditionnel, sans exiger une paraphrase.
- source_word: οἱ ἀπόστολοι
  choice: apôtres
  rationale: Aux côtés des prophètes, le sens reconnu d’« apôtres » convient mieux que le sens général de « messagers ».
- source_word: οἱ προφῆται
  choice: prophètes
  rationale: Équivalent français direct et naturel de προφῆται.
- source_word: ὅτι
  choice: car
  rationale: Introduit le motif de l’appel à se réjouir. « Car » convient au registre élevé tout en restant courant.
- source_word: ἔκρινεν
  choice: a jugé
  rationale: Le passé composé présente l’acte judiciaire de Dieu comme accompli et pertinent dans la scène présente, tout en conservant le vocabulaire explicite du jugement.
- source_word: τὸ κρίμα ὑμῶν
  choice: votre cause
  rationale: L’expression grecque est condensée. « Votre cause » maintient le cadre judiciaire et rend naturellement l’idée d’une affaire ou d’un jugement concernant les saints, sans recourir au vocabulaire plus explicite de la vengeance.
- source_word: ἐξ αὐτῆς
  choice: en la condamnant
  rationale: La préposition ἐξ est difficile dans cette formule condensée. Dans le contexte, elle présente Babylone comme celle dont Dieu obtient ou exige le jugement en faveur des personnes interpellées. Cette formulation française exprime la portée judiciaire probable, tandis que la note conserve la forme plus littérale et les autres possibilités.
theological_decisions:
- issue: Degré d’explicitation de l’intervention judiciaire de Dieu contre Babylone en faveur des saints
  choice: « Dieu a jugé votre cause en la condamnant »
  alternative: « Dieu vous a fait justice en la jugeant » ou « Dieu vous a vengés d’elle »
  rationale: Le grec emploie les mots de la famille de κρίνω, non un verbe explicite signifiant « venger ». La formulation retenue reste dans le champ du jugement, rend la phrase intelligible en français et évite de transformer sans avertissement la justification judiciaire en vengeance explicite. La note signale la compression et les principales interprétations possibles.
translation_notes:
  register: Français international moderne, digne et accessible. L’interjection « ô » maintient l’adresse solennelle au ciel. « Et vous aussi » clarifie naturellement le passage de l’impératif singulier adressé au ciel aux groupes également appelés à se réjouir.
