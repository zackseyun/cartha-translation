revisions:
- from: Réjouis-toi de son sort, ô ciel ! Et vous aussi, saints, apôtres et prophètes, car Dieu a jugé votre cause en la condamnant[a].
  to: Réjouis-toi à son sujet[a], ô ciel ! Et vous aussi, saints, apôtres et prophètes, car Dieu a jugé votre cause contre elle.
  rationale: 'La révision retire « en la condamnant », qui résolvait explicitement une construction grecque disputée, et conserve une formulation judiciaire française naturelle : « a jugé votre cause contre elle ». « À son sujet » suit plus étroitement l’objet de réjouissance exprimé par ἐπ’ αὐτῇ sans ajouter « son sort ». La note explique la compression du grec et donne des développements possibles sans imposer celui de la vengeance.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:48:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'La formulation « en la condamnant » explicite de manière excessive le grec condensé : elle introduit une condamnation de Babylone comme complément explicite de l’acte, alors que ἐξ αὐτῆς demeure syntaxiquement difficile. « A jugé votre cause contre elle » rend le cadre judiciaire et la direction probable de l’action sans imposer davantage.'
  naturalness: Le français est globalement digne et clair. « Réjouis-toi à son sujet » est plus proche de ἐπ’ αὐτῇ que « de son sort », qui spécifie le sort de Babylone. La coordination après l’apostrophe est rendue naturellement par « et vous aussi ».
  terminology: « Saints », « apôtres », « prophètes », « car » et « a jugé » sont appropriés. « Cause » est un bon équivalent juridiquement naturel de κρίμα dans cette construction, à condition de ne pas développer le sens en « condamnation ».
  issues:
  - severity: medium
    issue: « en la condamnant » ajoute une explicitation interprétative au texte principal.
    rationale: Le grec dit littéralement que Dieu a « jugé votre jugement » ἐξ αὐτῆς. Le sens contextuel vise probablement une action judiciaire contre Babylone en faveur des destinataires, mais le texte ne dit pas explicitement « en la condamnant ». La note doit conserver les lectures plus développées.
  - severity: low
    issue: « de son sort » restreint l’objet de la joie.
    rationale: ἐπ’ αὐτῇ signifie plus directement « à son sujet / à cause d’elle »; « son sort » anticipe et spécifie l’issue de Babylone. Une expression plus neutre préserve mieux la formulation source.
  revised_text: Réjouis-toi à son sujet[a], ô ciel ! Et vous aussi, saints, apôtres et prophètes, car Dieu a jugé votre cause contre elle.
