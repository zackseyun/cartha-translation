  terminology: « Cargaison », « pierres précieuses », « lin fin », « étoffe pourpre », « soie », « étoffe écarlate », « objets en ivoire », « bronze », « fer » et « marbre » conviennent. « Bois de thuya » est retenu comme rendu traditionnel de θύϊνον, avec une note qui signale explicitement l’incertitude d’identification; cela est plus précis lexicalement que la désignation générique « bois odorants ».
