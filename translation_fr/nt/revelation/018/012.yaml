source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: fr
  text: une cargaison d’or, d’argent, de pierres précieuses, de perles, de lin fin, d’étoffe pourpre, de soie et d’étoffe écarlate, toutes sortes de bois de thuya[a], toutes sortes d’objets en ivoire, et toutes sortes d’objets faits de bois de très grande valeur, de bronze, de fer et de marbre,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bois odorant » ; « bois de thuya » est une traduction traditionnelle d’un bois coûteux et parfumé dont l’identification exacte est incertaine.
    reason: lexical_alternative
lexical_decisions:
- source_word: γόμον
  choice: une cargaison
  rationale: Le terme désigne le chargement ou le fret d’un navire. Le singulier collectif « une cargaison » convient à cette liste commerciale et se rattache à la phrase commencée au verset précédent.
- source_word: λίθου τιμίου
  choice: pierres précieuses
  rationale: Bien que le grec emploie le singulier comme nom de matière, le pluriel est plus naturel en français dans un inventaire de marchandises et en conserve le sens collectif.
- source_word: βυσσίνου
  choice: lin fin
  rationale: Le terme désigne une étoffe de lin raffinée et luxueuse. « Lin fin » est l’équivalent français usuel et naturel.
- source_word: πορφύρας
  choice: étoffe pourpre
  rationale: Le mot peut désigner la pourpre, sa teinture ou le tissu teint. Dans une liste de marchandises, « étoffe pourpre » explicite naturellement le produit commercial sans préciser indûment sa forme.
- source_word: σιρικοῦ
  choice: soie
  rationale: Le terme désigne la soie ou une étoffe de soie; « soie » est la formulation française la plus directe dans cet inventaire.
- source_word: κοκκίνου
  choice: étoffe écarlate
  rationale: Le terme renvoie ici à une matière textile écarlate. Cette formulation fait pendant à « étoffe pourpre » et convient au contexte commercial.
- source_word: πᾶν ξύλον θύϊνον
  choice: toutes sortes de bois odorants
  rationale: θύϊνος désigne un bois coûteux et parfumé dont l’identification botanique exacte reste incertaine. La traduction descriptive communique sa caractéristique principale sans imposer une espèce précise.
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: toutes sortes d’objets en ivoire
  rationale: σκεῦος est un terme large pouvant désigner un récipient, un ustensile ou un objet. « Objets » préserve mieux cette ampleur que « vases » en français moderne.
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: toutes sortes d’objets en bois de très grande valeur
  rationale: Le superlatif τιμιωτάτου souligne la valeur exceptionnelle du bois. « De très grande valeur » rend cette force dans un français naturel sans suggérer que le bois serait moralement « précieux ».
- source_word: χαλκοῦ
  choice: bronze
  rationale: χαλκός peut désigner le cuivre ou le bronze. Dans cette liste d’objets de luxe antiques, « bronze » est l’équivalent français le plus probable et le plus idiomatique.
- source_word: σιδήρου
  choice: fer
  rationale: Équivalent lexical direct dans cette énumération de matériaux.
- source_word: μαρμάρου
  choice: marbre
  rationale: Équivalent lexical direct, adapté à la liste de matériaux employés pour fabriquer des objets de valeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, soutenu mais accessible. L’énumération et la ponctuation finale conservent le caractère de fragment syntaxique du verset, qui poursuit la phrase commencée en Apocalypse 18.11. La répétition de « toutes sortes » restitue πᾶν de manière idiomatique; « objets » évite le sens trop étroit que pourrait prendre « vases » aujourd’hui.
