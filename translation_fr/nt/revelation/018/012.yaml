  source_fidelity: La liste des marchandises est globalement fidèle au grec. Toutefois, « toutes sortes d’objets en bois de très grande valeur, en bronze, en fer et en marbre » peut faire entendre que les mêmes objets sont constitués de tous ces matériaux. Le grec énumère plutôt des objets faits de bois très précieux, de bronze, de fer et de marbre.
