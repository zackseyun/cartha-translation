id: REV.18.13
reference: Revelation 18:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: fr
  text: de la cannelle, de l’amome[a], de l’encens, du parfum, de l’oliban, du vin, de l’huile d’olive, de la fleur de farine, du blé, du gros bétail, des moutons, des chevaux, des voitures, des corps[b] et des âmes humaines.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’amome était une plante aromatique coûteuse; son identification exacte est incertaine.
    reason: lexical_alternative
  - marker: b
    text: Ici, « corps » désigne des êtres humains vendus comme esclaves.
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: cannelle
  rationale: Équivalent français courant et précis pour cette denrée aromatique importée.
- source_word: ἄμωμον
  choice: amome
  rationale: Conserve le nom spécifique, mais incertain, de cette plante aromatique coûteuse; une note l’explicite sans réduire le terme au sens générique d’« épice ».
- source_word: θυμιάματα
  choice: encens
  rationale: Dans cette liste commerciale, le pluriel désigne des substances destinées à être brûlées comme encens.
- source_word: μύρον
  choice: parfum
  rationale: Rend naturellement en français moderne une préparation aromatique coûteuse, sans imposer la forme précise d’un onguent ou d’une huile.
- source_word: λίβανον
  choice: oliban
  rationale: Désigne spécifiquement la résine aromatique appelée oliban, distincte du terme plus général rendu par « encens ».
- source_word: ἔλαιον
  choice: huile d’olive
  rationale: Explicite le référent normal du terme dans ce contexte méditerranéen.
- source_word: σεμίδαλιν
  choice: fleur de farine
  rationale: Expression française consacrée pour une farine fine de qualité supérieure.
- source_word: σῖτον
  choice: blé
  rationale: Sens spécifique vraisemblable dans cette énumération de marchandises.
- source_word: κτήνη
  choice: gros bétail
  rationale: Distingue les grands animaux domestiques des moutons mentionnés immédiatement après.
- source_word: πρόβατα
  choice: moutons
  rationale: Équivalent direct et usuel.
- source_word: ῥεδῶν
  choice: chars
  rationale: Désigne des véhicules à quatre roues; « chars » reste concis et évite de préciser sans certitude s’il s’agit de voitures de luxe ou d’autres véhicules.
- source_word: σωμάτων
  choice: corps
  rationale: Préserve le mot concret et choquant du grec ainsi que la déshumanisation produite par l’inclusion de personnes dans une liste de marchandises; la note indique le contexte esclavagiste.
- source_word: ψυχὰς ἀνθρώπων
  choice: âmes humaines
  rationale: Conserve la formulation distincte et culminante du grec sans l’aplatir en simple synonyme de « personnes ».
theological_decisions:
- issue: Rapport entre σωμάτων et ψυχὰς ἀνθρώπων
  choice: des corps et des âmes humaines
  alternative: des esclaves, c’est-à-dire des êtres humains
  rationale: La coordination littérale maintient l’ambiguïté syntaxique et la tension rhétorique du texte, qui juxtapose les corps commercialisés et les âmes humaines. La note explique le référent historique sans transformer l’explication en texte principal.
translation_notes:
  register: Français international moderne, digne et lisible. La structure en accumulation est conservée. Les articles partitifs naturels en français rendent la série grecque de marchandises, tandis que la fin littérale préserve son effet saisissant.
