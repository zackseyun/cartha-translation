  source_fidelity: La liste des marchandises est fidèlement rendue. « Amome », « oliban », « fleur de farine », « gros bétail » et la séquence littérale « corps et âmes humaines » respectent utilement les distinctions du grec. La note sur « corps » explicite le référent esclavagiste sans l’imposer au texte principal. En revanche, ῥεδῶν désigne des véhicules de transport, probablement des voitures à cheval ou des carrosses, plutôt que des chars au sens habituel français de chariots de guerre.
  naturalness: Le français est fluide et garde bien l’effet d’accumulation commerciale. « Des voitures » est plus transparent en français international moderne que « des chars » dans ce contexte, où ce dernier peut suggérer des chars de guerre ou, pour certains lecteurs modernes, des blindés.
