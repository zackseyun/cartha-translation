id: REV.18.17
reference: Revelation 18:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι μιᾷ ὥρᾳ ἠρημώθη ὁ τοσοῦτος πλοῦτος. Καὶ πᾶς κυβερνήτης καὶ πᾶς ὁ ἐπὶ τόπον πλέων, καὶ ναῦται καὶ ὅσοι τὴν θάλασσαν ἐργάζονται, ἀπὸ μακρόθεν ἔστησαν
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/017.yaml
  text: for in one hour such great wealth has been laid waste. And every shipmaster, and everyone sailing to a place, and sailors, and as many as work the sea, stood far off
translation:
  language: fr
  text: Car en une seule heure, une si grande richesse a été dévastée ! Tous les capitaines de navire, tous ceux qui naviguent vers quelque destination[a], les marins et tous ceux qui travaillent en mer se tinrent à distance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tous ceux qui naviguent vers un port » ou « tous ceux qui vont quelque part par mer ». L’expression grecque est quelque peu idiomatique et peut désigner largement les personnes qui se rendent par mer à diverses destinations.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Introduit l’explication ou le contenu de la lamentation précédente et assure une liaison naturelle en français.
- source_word: μιᾷ ὥρᾳ
  choice: en une seule heure
  rationale: Rend le datif temporel et souligne la soudaineté sans imposer une interprétation non littérale de la durée.
- source_word: ἠρημώθη
  choice: a été dévastée
  rationale: Exprime la ruine profonde indiquée par le verbe, dans un français actuel et digne.
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: une si grande richesse
  rationale: Conserve la valeur intensive de τοσοῦτος et le ton de lamentation.
- source_word: πᾶς κυβερνήτης
  choice: tous les capitaines de navire
  rationale: Dans ce contexte maritime, κυβερνήτης désigne celui qui dirige ou gouverne le navire; « capitaine de navire » est clair en français moderne.
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: tous ceux qui naviguent vers quelque destination
  rationale: Préserve l’idée de déplacement maritime vers un lieu sans réduire le groupe aux seuls passagers ou marchands; la tournure grecque reste quelque peu idiomatique.
- source_word: ναῦται
  choice: les marins
  rationale: Équivalent français courant, précis et naturel.
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: tous ceux qui travaillent en mer
  rationale: Maintient un groupe plus large que les seuls marins, sans préciser indûment qu’ils en tirent nécessairement tout leur revenu.
- source_word: ἀπὸ μακρόθεν
  choice: à distance
  rationale: Tournure française idiomatique qui conserve l’éloignement spatial.
- source_word: ἔστησαν
  choice: se tinrent
  rationale: Rend simplement l’aoriste narratif et s’associe naturellement à « à distance ».
theological_decisions:
- issue: Étendue des groupes maritimes énumérés dans la lamentation sur Babylone
  choice: Conserver les groupes distincts dans l’énumération
  alternative: Réunir l’ensemble sous une formule générale telle que « tous les gens de mer », ou identifier le deuxième groupe aux passagers ou aux marchands
  rationale: Le grec coordonne plusieurs catégories touchées par la chute de Babylone. Les maintenir distinctes préserve l’effet rhétorique d’une perte économique généralisée sans ajouter une identification incertaine.
translation_notes:
  register: Français international moderne, naturel et digne. La structure de l’énumération grecque est conservée, tandis que les formulations sont rendues idiomatiques. Le point d’exclamation traduit le caractère exclamatif de la lamentation dans le contexte immédiat.
