id: REV.18.11
reference: Revelation 18:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: fr
  text: Et les marchands de la terre[a] pleurent et se lamentent sur elle, parce que plus personne n’achète leur cargaison[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du pays ». Le mot grec peut désigner la terre entière ou un territoire.
    reason: lexical_alternative
  - marker: b
    text: Ou « leurs marchandises ». Le mot grec désigne une charge, notamment celle d’un navire, ou les biens transportés pour le commerce.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: marchands
  rationale: « Marchands » est le terme français courant pour des personnes engagées dans le commerce et convient au contexte économique et maritime du chapitre.
- source_word: τῆς γῆς
  choice: de la terre
  rationale: γῆ peut désigner la terre ou un pays. « De la terre » préserve ici la portée universelle fréquente de l’expression dans l’Apocalypse, tout en signalant l’autre possibilité en note.
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: pleurent et se lamentent
  rationale: 'Cette formulation conserve les deux verbes et leur effet d’intensification : les marchands expriment leur douleur par les pleurs et la lamentation.'
- source_word: ἐπ’ αὐτήν
  choice: sur elle
  rationale: Avec les verbes de lamentation, cette expression présente la femme-ville comme l’objet des pleurs. Le pronom féminin maintient la personnification de Babylone.
- source_word: γόμον
  choice: cargaison
  rationale: γόμος désigne proprement une charge, notamment la cargaison d’un navire. « Cargaison » convient au cadre commercial du passage et prépare l’énumération des biens qui suit.
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: plus personne n’achète
  rationale: Cette tournure française naturelle exprime clairement la cessation marquée par οὐκέτι tout en conservant la valeur présente du verbe.
- source_word: αὐτῶν
  choice: leur
  rationale: Le pronom au génitif indique que la cargaison appartient aux marchands ; le possessif « leur » est l’équivalent français naturel.
theological_decisions:
- issue: Référent et personnification de Babylone
  choice: Conserver le pronom féminin « elle »
  alternative: Employer le pronom neutre ou masculin « cela » ou « lui » en envisageant Babylone comme un système ou comme le nom masculin « empire »
  rationale: Le texte personnifie Babylone comme une femme et une ville. « Elle » maintient cette image littéraire et théologique sans préciser davantage l’identité du symbole.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination des deux verbes de lamentation et la personnification féminine ont été conservées. Les notes suivent l’ordre d’apparition de leurs marqueurs dans le texte français.
