reference: Revelation 18:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: fr
  text: La lumière d’une lampe ne brillera plus jamais chez toi, et la voix du marié et de la mariée ne s’entendra plus jamais chez toi ; car tes marchands étaient les grands de la terre[a], parce que toutes les nations ont été égarées par ta sorcellerie[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les puissants de la terre » ou « les magnats de la terre ». Le terme grec désigne des personnes de premier plan ou détenant un grand pouvoir.
    reason: lexical_alternative
  - marker: b
    text: Ou « par tes arts magiques » ou « par tes pratiques occultes ». Le grec φαρμακεία désigne ici la sorcellerie ou des pratiques magiques trompeuses.
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: la lumière d’une lampe
  rationale: Rend directement le génitif grec dans un français naturel ; « lampe » convient au contexte ancien sans introduire l’idée plus précise d’une lanterne.
- source_word: οὐ μὴ φάνῃ … ἔτι
  choice: ne brillera plus jamais
  rationale: La tournure française exprime à la fois la négation grecque fortement emphatique οὐ μή et la cessation indiquée par ἔτι.
- source_word: ἐν σοὶ
  choice: chez toi
  rationale: Babylone est personnifiée et interpellée comme une ville. « Chez toi » conserve l’adresse directe tout en étant plus idiomatique que « en toi » pour ce qui se produit dans une ville.
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: la voix du marié et de la mariée
  rationale: « Voix » préserve le sens premier de φωνή et l’écho au langage prophétique ; « marié et mariée » est actuel, clair et fidèle au couple nuptial.
- source_word: οὐ μὴ ἀκουσθῇ … ἔτι
  choice: ne s’entendra plus jamais
  rationale: Le tour pronominal passif est naturel en français et garde la force irrévocable de οὐ μή ainsi que la valeur de cessation de ἔτι.
- source_word: οἱ ἔμποροί σου
  choice: tes marchands
  rationale: « Marchands » correspond au commerce à grande échelle évoqué dans le chapitre et maintient le possessif de l’adresse directe.
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: les grands de la terre
  rationale: Cette formulation garde la portée large du terme, qui désigne des personnages éminents ou puissants, sans les limiter à la noblesse politique ni aux seuls magnats économiques.
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: par ta sorcellerie
  rationale: Dans ce contexte de jugement apocalyptique, φαρμακεία désigne des pratiques magiques ou occultes trompeuses ; « sorcellerie » évite l’anachronisme d’une référence aux produits pharmaceutiques modernes.
- source_word: ἐπλανήθησαν
  choice: ont été égarées
  rationale: Le passif français reflète la forme grecque et préserve l’idée d’avoir été conduit dans l’erreur, sans réduire le verbe à une tromperie purement intellectuelle.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Rendu collectif naturel qui correspond à l’usage fréquent de ἔθνη dans l’Apocalypse pour les peuples du monde.
theological_decisions:
- issue: Sens de φαρμακεία dans le jugement contre Babylone
  choice: sorcellerie
  alternative: arts magiques ; pratiques occultes
  rationale: Le mot peut être associé à des drogues, philtres ou sortilèges, mais le contexte met l’accent sur la puissance de séduction spirituelle de Babylone. « Sorcellerie » conserve cette portée sans imposer une lecture moderne liée aux médicaments.
- issue: Force des deux constructions οὐ μή
  choice: ne … plus jamais
  alternative: ne … plus ; ne … certainement jamais
  rationale: La formulation retenue exprime de manière idiomatique la négation emphatique et le caractère définitif du jugement, tout en intégrant la valeur de ἔτι.
- issue: Portée de μεγιστᾶνες
  choice: les grands de la terre
  alternative: les puissants de la terre ; les magnats de la terre
  rationale: Le grec désigne des personnes de très haut rang ou d’une grande influence. La traduction retenue laisse ouverte la nature exacte de leur prééminence, qu’elle soit économique, sociale ou politique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « plus jamais chez toi » conserve l’insistance solennelle du grec. « Marié et mariée » est préféré à « époux et épouse » pour signaler clairement la scène nuptiale. Les marqueurs de notes sont placés immédiatement après les termes qu’ils expliquent.
