id: REV.1.2
reference: Revelation 1:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: fr
  text: qui a rendu témoignage à la parole de Dieu, au témoignage de Jésus le Messie[a], et à tout ce qu’il a vu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le témoignage venant de Jésus le Messie » ou « le témoignage au sujet de Jésus le Messie ». Le grec peut se comprendre dans les deux sens.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: a attesté
  rationale: Le verbe « attester » exprime clairement l’acte de rendre témoignage et accepte naturellement les compléments directs qui suivent en grec.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: la parole de Dieu
  rationale: Cette formulation naturelle et consacrée conserve le sens de la communication divine sans réduire λόγος au seul sens de « message ».
- source_word: τὴν μαρτυρίαν
  choice: le témoignage
  rationale: « Témoignage » restitue le sens judiciaire et testimonial de μαρτυρία et maintient son lien sémantique avec ἐμαρτύρησεν.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός conserve ici sa valeur de titre; « le Messie » la rend explicitement et de manière idiomatique en français.
- source_word: ὅσα εἶδεν
  choice: tout ce qu’il a vu
  rationale: La tournure rend la portée globale de ὅσα et conserve sa fonction de résumé apposé aux éléments précédents.
theological_decisions:
- issue: Ambiguïté du génitif dans μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: le témoignage de Jésus le Messie
  alternative: le témoignage venant de Jésus le Messie ; le témoignage au sujet de Jésus le Messie
  rationale: Le génitif grec peut désigner Jésus comme source du témoignage ou comme celui dont il est question. Le texte principal conserve cette ambiguïté réelle, tandis que la note explicite les deux lectures.
- issue: Valeur de Χριστοῦ
  choice: le Messie
  alternative: Christ
  rationale: Dans ce contexte, Χριστός demeure intelligible comme titre messianique plutôt que comme simple élément d’un nom propre.
translation_notes:
  register: Français international moderne, sobre et digne. « Attester » permet de suivre la syntaxe grecque sans lourdeur. La virgule maintient l’apposition finale et évite d’expliciter un rapport que le grec laisse implicite.
