    rationale: Après une virgule, le groupe final peut se lire comme une apposition flottante. Le coordonner comme troisième complément de « rendre témoignage à » reflète clairement la syntaxe et le sens englobant du grec.
  revised_text: qui a rendu témoignage à la parole de Dieu, au témoignage de Jésus le Messie[a], et à tout ce qu’il a vu.
