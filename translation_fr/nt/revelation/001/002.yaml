    rationale: Dans cette phrase, « attester la parole de Dieu et le témoignage » sonne administratif et ne restitue pas aussi bien le champ lexical répété de μαρτυρέω / μαρτυρία. « A rendu témoignage à » est plus idiomatique et conserve ce lien.
  - severity: low
