id: REV.1.18
reference: Revelation 1:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: fr
  text: 'et le Vivant — j’ai été mort[a], et voici : je suis vivant pour les siècles des siècles[b] — et je tiens les clés de la mort et du séjour des morts[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « je suis devenu mort » ; le verbe grec souligne le passage à l’état de mort.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « pour les âges des âges », expression qui marque une durée sans fin.'
    reason: lexical_alternative
  - marker: c
    text: Le grec emploie « Hadès », qui désigne le domaine des morts et non spécifiquement le lieu du châtiment final.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: le Vivant
  rationale: Le participe présent substantivé et précédé de l’article fonctionne comme un titre. « Le Vivant » en conserve la force et reste naturel dans un registre biblique digne.
- source_word: ἐγενόμην νεκρός
  choice: j’ai été mort
  rationale: Cette formulation française naturelle exprime l’état réel de mort dans le contraste mort-vie. Une note conserve la nuance plus littérale de γίνομαι, qui marque l’entrée dans cet état.
- source_word: ἰδού
  choice: voici
  rationale: « Voici » restitue la force vive de l’interjection grecque dans un français actuel mais soutenu.
- source_word: ζῶν εἰμι
  choice: je suis vivant
  rationale: Le tour rend naturellement en français l’état présent exprimé par le participe avec εἰμί et maintient le contraste avec la mort.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Cette expression française traditionnelle et intelligible conserve l’image sémitisante emphatique du grec plutôt que de la réduire au seul adverbe « éternellement ».
- source_word: κλεῖς
  choice: les clés
  rationale: Équivalent direct qui conserve l’image d’autorité et de maîtrise sans l’expliciter dans le corps du texte.
- source_word: τοῦ θανάτου
  choice: de la mort
  rationale: Le génitif est rendu directement; rien dans le grec n’impose ici de personnifier la Mort par une majuscule.
- source_word: τοῦ ᾅδου
  choice: du séjour des morts
  rationale: Cette expression désigne clairement pour le lecteur francophone le domaine des morts, sans le confondre avec la tombe physique ni avec le châtiment final.
theological_decisions:
- issue: Rendu de ᾅδης dans un contexte eschatologique
  choice: le séjour des morts
  alternative: l’Hadès; l’enfer; la tombe
  rationale: « Le séjour des morts » maintient la distinction entre la mort et le domaine des morts. Il évite d’assimiler ᾅδης à l’enfer compris comme châtiment final ou à la seule tombe, tout en restant plus immédiatement compréhensible que la translittération « Hadès ».
- issue: Nuance de ἐγενόμην νεκρός
  choice: j’ai été mort, avec une note sur la transition
  alternative: je suis devenu mort; je suis passé par la mort
  rationale: Le français idiomatique favorise « j’ai été mort ». La note signale toutefois que le verbe grec exprime littéralement le fait de devenir et préserve ainsi la transition vers la mort sans imposer une tournure maladroite ou plus interprétative.
translation_notes:
  register: Français international moderne, clair et digne. « Le Vivant » et « voici » maintiennent le relief solennel de l’Apocalypse. La syntaxe et les virgules conservent l’enchaînement vigoureux du grec, tandis que « mais » rend explicitement en français le contraste pragmatique entre la mort et la vie présente.
