  - severity: low
    issue: Formulation « comme embrasé »
    rationale: La formulation laisse incertain l’antécédent qualifié et produit une ellipse peu naturelle. Une formulation participiale explicitement rattachée au bronze améliore la lisibilité sans modifier le sens.
  - severity: low
    issue: La note a ne signale pas explicitement la possibilité d’un métal incandescent ou chauffé
    rationale: La note traite correctement de l’incertitude référentielle de χαλκολίβανον ; elle peut être légèrement resserrée pour distinguer l’incertitude sur le métal de l’image de chauffage exprimée ensuite dans le texte.
