source:
  edition: SBLGNT
  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: fr
  text: ses pieds étaient semblables à du bronze étincelant[a], comme chauffé à blanc dans une fournaise, et sa voix était comme le bruit de nombreuses eaux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le terme grec est très rare et son sens précis est incertain ; il peut désigner un bronze poli, un alliage brillant ou un autre métal éclatant.
    reason: lexical_alternative
  - marker: b
    text: 'Plus littéralement : « comme la voix de nombreuses eaux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: pieds
  rationale: Le sens direct de πούς est « pied »; ce choix conserve précisément l’image corporelle de la vision.
- source_word: ὅμοιοι
  choice: étaient semblables à
  rationale: Cette tournure française naturelle exprime la ressemblance indiquée par ὅμοιος et restitue la copule sous-entendue.
- source_word: χαλκολιβάνῳ
  choice: bronze étincelant
  rationale: Ce terme très rare désigne vraisemblablement un métal ou alliage brillant, sans que sa composition exacte soit certaine. « Bronze étincelant » communique son éclat sans prétendre trancher la question métallurgique.
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: comme embrasé dans une fournaise
  rationale: κάμινος désigne une fournaise, tandis que πυρόομαι évoque ce qui est porté au feu, embrasé ou affiné. « Embrasé » préserve plus directement l’image ardente sans imposer exclusivement l’idée d’affinage.
- source_word: φωνή
  choice: voix
  rationale: La première occurrence se rapporte personnellement au personnage décrit; « voix » est donc le sens approprié.
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: comme le bruit de grandes eaux
  rationale: La seconde occurrence de φωνή peut naturellement désigner un bruit ou un son. « Grandes eaux » rend l’hébraïsme biblique avec dignité et évoque leur ampleur, sans le réduire aux vagues ou à une chute d’eau précise.
theological_decisions:
- issue: Rendu de la répétition de φωνή dans la comparaison finale
  choice: sa voix était comme le bruit de grandes eaux
  alternative: sa voix était comme la voix de nombreuses eaux
  rationale: Le premier φωνή demeure « voix », tandis que le second est rendu par « bruit » pour une comparaison idiomatique en français. L’image majestueuse reste ouverte et n’est pas limitée à un phénomène naturel particulier; le rendu plus littéral figure en note.
- issue: Valeur de πεπυρωμένης dans l’image métallurgique
  choice: embrasé dans une fournaise
  alternative: affiné dans une fournaise
  rationale: Le participe peut évoquer un métal chauffé au feu, devenu incandescent, ou affiné. « Embrasé » maintient l’image visuelle sans résoudre à tort cette nuance en faveur du seul raffinage; l’autre possibilité est signalée en note.
translation_notes:
  register: Français international actuel, fluide et digne. La formulation conserve la structure visionnaire et les deux comparaisons. Les notes suivent l’ordre réel des marqueurs dans le texte français et rendent visibles les principales incertitudes lexicales.
