- from: ses pieds étaient semblables à du bronze étincelant[a], comme embrasé dans une fournaise, et sa voix était comme le bruit de grandes eaux[b].
  to: ses pieds étaient semblables à du bronze étincelant[a], comme chauffé à blanc dans une fournaise, et sa voix était comme le bruit de nombreuses eaux[b].
  rationale: La révision conserve la structure et les comparaisons du grec, ainsi que l’incertitude sur χαλκολίβανον. « Chauffé à blanc dans une fournaise » rend l’image de πεπυρωμένης de manière claire et visuelle, sans imposer l’interprétation plus étroite « affiné ». « Nombreuses eaux » reflète directement πολλῶν, tout en préservant l’imagerie biblique ouverte.
