id: REV.1.7
reference: Revelation 1:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: fr
  text: Voici, il vient avec les nuées, et tout œil le verra, même ceux qui l’ont transpercé, et toutes les tribus de la terre se lamenteront sur lui.[a] Oui, amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « toutes les tribus du pays se lamenteront sur lui ». Cette expression peut faire écho à Zacharie 12.10-12, où le sens « pays » est possible selon le contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Regardez !
  rationale: Cette interjection appelle vivement l’attention. « Regardez ! » en restitue la force dans un français actuel, sans l’archaïsme de « Voici » employé isolément.
- source_word: ἔρχεται
  choice: Il vient
  rationale: Le présent grec, vif et orienté vers l’avenir, est conservé par le présent français, naturel dans l’annonce d’une venue imminente ou certaine.
- source_word: μετὰ τῶν νεφελῶν
  choice: avec les nuées
  rationale: Conserve l’article et l’imagerie solennelle qui évoque Daniel 7. « Nuées » reste compréhensible et porte mieux la résonance biblique que le plus ordinaire « nuages ».
- source_word: ὄψεται
  choice: verra
  rationale: Le futur de ὁράω se rend directement et naturellement par « verra ».
- source_word: πᾶς ὀφθαλμὸς
  choice: tout œil
  rationale: Préserve l’expression concrète, singulière et distributive du grec plutôt que de la réduire à « tout le monde ».
- source_word: οἵτινες
  choice: ceux qui
  rationale: Désigne naturellement en français le groupe particulier inclus dans « tout œil ».
- source_word: ἐξεκέντησαν
  choice: ont transpercé
  rationale: « Transpercer » conserve le lien verbal et intertextuel avec Zacharie 12.10 et Jean 19.37.
- source_word: κόψονται
  choice: se lamenteront
  rationale: Le verbe exprime une lamentation de deuil. « Se lamenteront » garde cette intensité sans préciser un geste qui demeure implicite.
- source_word: ἐπ’ αὐτὸν
  choice: à cause de lui
  rationale: Cette formulation française conserve l’ambiguïté quant au motif et à la nature de la lamentation. « Sur lui » serait moins idiomatique ici, tandis que « à son sujet » atténuerait la force du rapport exprimé.
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: toutes les tribus de la terre
  rationale: « Tribus » rend précisément φυλαί. Dans le contexte universel de « tout œil », « terre » convient au texte principal, tout en laissant « pays » comme possibilité en raison de l’écho à Zacharie.
- source_word: ναί, ἀμήν
  choice: Oui, amen
  rationale: Préserve la double affirmation emphatique et la portée liturgique du terme « amen », bien établi en français.
theological_decisions:
- issue: Portée de τῆς γῆς dans πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: « toutes les tribus de la terre » dans le texte principal
  alternative: « toutes les tribus du pays »
  rationale: La visibilité universelle de la venue — « tout œil le verra » — favorise « terre ». Cependant, l’écho probable à Zacharie 12.10-12 permet de comprendre γῆ comme « pays » ; cette possibilité est donc conservée en note plutôt que tranchée silencieusement.
- issue: Sens de la lamentation exprimée par κόψονται ἐπ’ αὐτόν
  choice: « se lamenteront à cause de lui »
  alternative: « se lamenteront sur lui » ou « à son sujet »
  rationale: Le grec peut évoquer une lamentation à son sujet ou provoquée par lui, sans préciser ici s’il s’agit de repentance, de deuil ou de terreur. La traduction choisie évite d’imposer une interprétation doctrinale unique.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme bref et solennel de l’annonce est maintenu. « Nuées », « transpercé » et « amen » conservent les échos scripturaires sans rendre l’ensemble archaïque.
