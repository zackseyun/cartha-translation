    reason: alternative_reading
  revision_rationale: La révision remplace l’impératif interprétatif « Regardez ! » par l’interjection d’annonce « Voici » et rend ἐπ’ αὐτόν par « sur lui », afin de ne pas réduire la lamentation à une simple conséquence causale. La note conserve l’alternative « pays » pour γῆ et reste cohérente avec le texte révisé.
