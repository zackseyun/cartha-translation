  timestamp: '2026-07-14T11:46:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les images du grec sont bien conservées : venue « avec les nuées », visibilité universelle, ceux qui l’ont transpercé, tribus de la terre, et double affirmation finale. Toutefois, « à cause de lui » pour ἐπ’ αὐτόν déplace la relation vers la causalité, alors que le grec, en écho à Zacharie, exprime plus directement la lamentation portée sur la personne. « Voici » rend mieux Ἰδού, particule d’annonce, que l’impératif pluriel « Regardez ! ».'
  naturalness: Le registre est globalement digne et accessible. « Voici, il vient » est une formule française actuelle dans un registre solennel, sans transformer l’interjection grecque en ordre adressé au lecteur. « Se lamenteront sur lui » est naturel dans ce registre scripturaire et préserve plus exactement le lien de la lamentation avec « lui ».
  terminology: « Nuées », « transpercé », « tribus », « terre » et « amen » sont justes et maintiennent les échos bibliques. La note sur « pays » préserve convenablement l’ambiguïté de γῆ.
  issues:
  - severity: medium
    issue: « à cause de lui » pour ἐπ’ αὐτόν
    rationale: Cette expression présente surtout Jésus comme la cause de la lamentation. Dans cette construction, le grec indique la personne sur laquelle porte le deuil ou la lamentation; la formulation révisée conserve cette relation sans en définir le motif théologique.
  - severity: low
    issue: « Regardez ! » pour Ἰδού
    rationale: Le grec est une particule déictique et emphatique, non un impératif pluriel. « Voici » est plus fidèle à sa fonction discursive et reste naturel dans le registre solennel du verset.
  revised_text: Voici, il vient avec les nuées, et tout œil le verra, même ceux qui l’ont transpercé, et toutes les tribus de la terre se lamenteront sur lui.[a] Oui, amen.
