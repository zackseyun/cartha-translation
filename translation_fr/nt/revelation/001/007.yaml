revisions:
- from: Regardez ! Il vient avec les nuées. Tout œil le verra, même ceux qui l’ont transpercé, et toutes les tribus de la terre se lamenteront à cause de lui.[a] Oui, amen.
  to: Voici, il vient avec les nuées, et tout œil le verra, même ceux qui l’ont transpercé, et toutes les tribus de la terre se lamenteront sur lui.[a] Oui, amen.
  rationale: La révision remplace l’impératif interprétatif « Regardez ! » par l’interjection d’annonce « Voici » et rend ἐπ’ αὐτόν par « sur lui », afin de ne pas réduire la lamentation à une simple conséquence causale. La note conserve l’alternative « pays » pour γῆ et reste cohérente avec le texte révisé.
