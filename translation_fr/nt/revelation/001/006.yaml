  source_fidelity: 'Le texte rend fidèlement la structure de καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς : « il a fait de nous un royaume, des prêtres ». Il conserve le singulier « un royaume », sans introduire la variante « des rois », et rend correctement τῷ θεῷ καὶ πατρὶ αὐτοῦ par « pour son Dieu et Père ». La doxologie (« à lui la gloire et le pouvoir souverain ») et la formule temporelle « pour les siècles des siècles » correspondent au grec.'
