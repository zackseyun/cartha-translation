id: REV.1.6
reference: Revelation 1:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: fr
  text: et il a fait de nous un royaume[a], des prêtres pour son Dieu et Père — à lui la gloire et le pouvoir souverain pour les siècles des siècles[b] ! Amen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Quelques manuscrits plus tardifs portent « des rois et des prêtres » au lieu de « un royaume, des prêtres ». Le texte principal suit le texte grec retenu ici.
    reason: textual_variant
  - marker: b
    text: L’expression signifie « pour toujours » ; littéralement, « pour les âges des âges ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: il a fait de nous
  rationale: Le passé composé exprime naturellement en français l’acte accompli de l’aoriste dans cette séquence, sans ajouter davantage que le grec.
- source_word: βασιλείαν
  choice: un royaume
  rationale: Le singulier désigne ici un royaume, non des « rois » ; il préserve l’identité collective exprimée par le texte grec et l’écho probable à Exode 19.6.
- source_word: ἱερεῖς
  choice: des prêtres
  rationale: Ce terme garde directement l’image cultuelle et l’identité sacerdotale de la communauté.
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: pour son Dieu et Père
  rationale: « Pour » rend naturellement le datif d’orientation et de service. « Son » porte sur l’expression coordonnée « Dieu et Père », conformément à la syntaxe grecque.
- source_word: αὐτῷ
  choice: à lui
  rationale: Cette formule française conserve la tournure d’attribution de la doxologie grecque, dont le verbe reste sous-entendu.
- source_word: δόξα
  choice: la gloire
  rationale: Équivalent doxologique courant, clair et fidèle.
- source_word: κράτος
  choice: le pouvoir souverain
  rationale: Cette expression communique la force agissante et la domination souveraine indiquées par κράτος, plus précisément que le terme générique « puissance ».
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Cette formule française consacrée conserve l’image sémitisante et grecque tout en exprimant une durée sans fin.
- source_word: ἀμήν
  choice: Amen
  rationale: Le terme liturgique traditionnel est conservé comme affirmation finale.
theological_decisions:
- issue: Référent de « son Dieu et Père »
  choice: La formulation est conservée telle quelle et renvoie, dans le contexte, à Jésus-Christ.
  alternative: « pour Dieu, son Père »
  rationale: La traduction préserve la formulation relationnelle et christologique du grec sans l’aplanir ni résoudre autrement la distinction exprimée.
- issue: Statut de la communauté
  choice: « un royaume, des prêtres »
  alternative: « des rois et des prêtres »
  rationale: Le texte fourni porte βασιλείαν, « un royaume », et non βασιλεῖς, « des rois ». La juxtaposition avec « des prêtres » est maintenue afin de ne pas effacer la tension syntaxique ni l’identité collective.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « un royaume, des prêtres » conserve volontairement la juxtaposition du grec. « Pouvoir souverain » évite l’ambiguïté moderne de « domination » tout en rendant la force royale de κράτος.
