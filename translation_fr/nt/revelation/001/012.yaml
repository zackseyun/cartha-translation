id: REV.1.12
reference: Revelation 1:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: fr
  text: Je me retournai pour voir la voix qui me parlait[a]. Et, m’étant retourné, je vis sept porte-lampes en or.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parlait avec moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: je me retournai
  rationale: Le verbe désigne ici le mouvement physique par lequel Jean se tourne. Le passé simple convient au registre narratif digne et distingue cette action ponctuelle de la parole en cours.
- source_word: βλέπειν
  choice: pour voir
  rationale: L’infinitif exprime naturellement le but du mouvement. La formulation conserve l’image inhabituelle consistant à « voir la voix ».
- source_word: φωνὴν
  choice: la voix
  rationale: Dans ce contexte de parole, φωνή désigne une voix plutôt qu’un simple son.
- source_word: ἥτις
  choice: qui
  rationale: Le pronom relatif français « qui » reprend naturellement « la voix » comme sujet de « parlait ».
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: me parlait
  rationale: L’imparfait rend l’action en cours. En français contemporain, « parler avec moi » suggérerait plus nettement une conversation réciproque que ne l’impose le contexte; « me parlait » rend idiomatiquement l’adresse tout en gardant en note la construction grecque.
- source_word: ἐπιστρέψας
  choice: m’étant retourné
  rationale: Le participe composé marque l’antériorité immédiate du retournement par rapport à la vision et préserve la répétition présente dans le grec.
- source_word: εἶδον
  choice: je vis
  rationale: Le passé simple rend directement l’aoriste narratif sans ajout.
- source_word: ἑπτὰ
  choice: sept
  rationale: Traduction directe du nombre cardinal.
- source_word: λυχνίας
  choice: porte-lampes
  rationale: Le terme désigne les supports sur lesquels sont placées les lampes, et non les lampes elles-mêmes. « Porte-lampes » est concret, compréhensible et permet de conserver la cohérence avec l’explication de 1.20.
- source_word: χρυσᾶς
  choice: en or
  rationale: Cette formulation indique clairement la matière des porte-lampes et sonne plus naturellement ici que « dorés », qui pourrait évoquer un simple revêtement.
theological_decisions:
- issue: Identification de l’objet symbolique λυχνίας
  choice: porte-lampes
  alternative: lampes
  rationale: Le texte distingue le support de la lampe; cette précision doit être conservée puisque les sept porte-lampes reçoivent une interprétation symbolique en Apocalypse 1.20.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient un registre narratif biblique naturel sans archaïsme lexical. La tournure volontairement frappante « voir la voix » est conservée, de même que la répétition de l’action de se retourner.
