  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: fr
  text: 'Quand je le vis, je tombai à ses pieds comme mort. Et il posa sa main droite sur moi et dit : « N’aie pas peur. Je suis le Premier et le Dernier, »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὅτε εἶδον αὐτόν
  choice: Quand je le vis
  rationale: Le français n’a pas besoin de rendre καί par « et » ici pour conserver l’enchaînement narratif. Le passé simple convient au récit solennel et εἶδον désigne simplement le fait de voir.
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: je tombai à ses pieds
  rationale: Cette formulation française naturelle rend l’effondrement devant la personne sans ajouter l’idée d’un geste volontaire de prosternation.
- source_word: ὡς νεκρός
  choice: comme mort
  rationale: La comparaison introduite par ὡς est préservée. « Comme mort » reste concise et n’affirme pas que Jean mourut réellement.
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: il posa sa main droite sur moi
  rationale: « Posa » rend naturellement τίθημι, tandis que « main droite » conserve un élément explicite et potentiellement symbolique du grec.
- source_word: λέγων
  choice: et dit
  rationale: Le participe grec est rendu par un verbe coordonné, tournure plus naturelle en français narratif que « disant ».
- source_word: Μὴ φοβοῦ
  choice: N’aie pas peur
  rationale: Cette formule actuelle et digne exprime directement l’interdiction portée par le présent impératif sans raideur artificielle.
- source_word: ἐγώ εἰμι
  choice: Je suis
  rationale: La formulation conserve l’auto-identification emphatique du grec sans lui imposer une allusion théologique supplémentaire.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: le Premier et le Dernier
  rationale: Les adjectifs substantivés et articulés fonctionnent comme des titres. Les majuscules signalent cet emploi en français sans modifier le sens lexical.
theological_decisions:
- issue: Valeur titulaire de ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: le Premier et le Dernier
  alternative: le premier et le dernier
  rationale: Dans ce contexte, l’expression est une auto-désignation solennelle de Jésus exalté et fait écho au langage d’Ésaïe. Les majuscules indiquent sa fonction de titre sans développer l’interprétation au-delà du texte.
- issue: Portée de ἐγώ εἰμι
  choice: Je suis
  alternative: C’est moi
  rationale: Puisque l’expression introduit ici deux titres, « Je suis » préserve mieux la force de l’auto-identification, tout en évitant d’affirmer une allusion précise que le verset ne rend pas explicite.
translation_notes:
  register: Français international moderne, clair et solennel. Le passé simple maintient le registre narratif biblique sans archaïsmes lexicaux. La virgule avant la fermeture des guillemets signale que la déclaration se poursuit au verset suivant.
