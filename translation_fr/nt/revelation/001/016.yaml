id: REV.1.16
reference: Revelation 1:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: fr
  text: Il tenait sept étoiles dans sa main droite, de sa bouche sortait une épée aiguisée à deux tranchants[a], et son aspect était comme le soleil qui brille dans toute sa force[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une épée tranchante à double tranchant ».'
    reason: Alternative lexicale et syntaxique pour δίστομος ὀξεῖα.
  - marker: b
    text: 'Littéralement : « dans sa puissance ».'
    reason: La formulation principale rend idiomatiquement en français l’intensité exprimée par ἐν τῇ δυνάμει αὐτοῦ.
lexical_decisions:
- source_word: ἔχων
  choice: Il tenait
  rationale: Le participe poursuit la description de la vision. Une forme verbale à l’imparfait rend naturellement en français cette scène descriptive et continue.
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: dans sa main droite
  rationale: χείρ est exprimé dans le grec et doit donc être conservé; « sa main droite » est la formulation française naturelle.
- source_word: ἀστέρας ἑπτά
  choice: sept étoiles
  rationale: Traduction directe, avec l’ordre usuel en français.
- source_word: ῥομφαία
  choice: épée
  rationale: Le terme peut désigner une grande épée, mais « épée » demeure clair et évite de préciser indûment le type d’arme dans cette image visionnaire.
- source_word: δίστομος ὀξεῖα
  choice: aiguisée à deux tranchants
  rationale: δίστομος signifie littéralement « à deux bouches », d’où « à deux tranchants » dans le contexte d’une épée; ὀξεῖα ajoute explicitement l’idée qu’elle est aiguisée.
- source_word: ἐκπορευομένη
  choice: sortait
  rationale: Le participe présente l’épée comme provenant de sa bouche. L’imparfait s’intègre naturellement à la description visionnaire sans affaiblir l’image.
- source_word: ἡ ὄψις αὐτοῦ
  choice: son aspect
  rationale: ὄψις désigne ici ce qui est visible, l’aspect ou l’apparence, et ne se limite pas nécessairement au visage.
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: comme le soleil qui brille
  rationale: Cette formulation conserve la comparaison et la valeur présente de φαίνει dans un français fluide.
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: de toute sa puissance
  rationale: Dans cette image, δύναμις évoque la pleine intensité du soleil. La tournure choisie est idiomatique en français; une version plus formellement proche est signalée en note.
theological_decisions:
- issue: Nature de l’image de l’épée sortant de la bouche
  choice: Conserver l’image visionnaire sans l’expliquer dans le texte.
  alternative: Identifier explicitement l’épée à la parole de jugement du Christ.
  rationale: Le verset présente un symbole apocalyptique sans en donner ici l’interprétation. La traduction ne doit pas intégrer au texte une explication théologique tirée d’autres passages.
translation_notes:
  register: Français international moderne, naturel et digne. Les imparfaits donnent à la scène son caractère descriptif. « Aspect » préserve l’étendue de ὄψις sans réduire la vision au seul visage.
