id: REV.1.14
reference: Revelation 1:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: fr
  text: Sa tête et ses cheveux étaient blancs[a], comme de la laine blanche, comme la neige, et ses yeux étaient comme une flamme de feu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sa tête et ses cheveux étaient blancs comme de la laine blanche, comme la neige ».'
    reason: lexical_alternative
  - marker: b
    text: Cette image fait écho à Daniel 7.9 et souligne le caractère visionnaire de la description.
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: et
  rationale: Connecteur léger intégré naturellement à la coordination française, sans lui donner une valeur temporelle absente du grec.
- source_word: κεφαλὴ
  choice: tête
  rationale: Terme anatomique direct, conservé littéralement dans la description visionnaire.
- source_word: τρίχες
  choice: cheveux
  rationale: Le pluriel « cheveux » est l’expression idiomatique française pour la chevelure humaine.
- source_word: λευκαὶ
  choice: blancs
  rationale: Le terme de couleur courant préserve l’insistance du grec sans ajouter l’idée interprétative d’éclat.
- source_word: ὡς ἔριον λευκόν
  choice: comme de la laine blanche
  rationale: Rend explicitement la comparaison et conserve la qualification de la laine par « blanche ».
- source_word: ὡς χιών
  choice: comme la neige
  rationale: Conserve la seconde comparaison et l’accumulation des images de blancheur.
- source_word: ὀφθαλμοὶ
  choice: yeux
  rationale: Équivalent anatomique français standard.
- source_word: ὡς φλὸξ πυρός
  choice: comme une flamme de feu
  rationale: Formulation proche du grec qui maintient l’image apocalyptique traditionnelle sans la réduire à « une flamme ».
theological_decisions:
- issue: Description symbolique du Fils de l’homme exalté
  choice: Conserver littéralement les images dans le texte principal sans en expliquer le symbolisme.
  alternative: Développer la traduction en y introduisant des notions telles que la pureté, l’éternité ou le jugement.
  rationale: Le verset présente des comparaisons visionnaires, non leur interprétation doctrinale explicite. Leur maintien préserve la portée et la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « blanc/blanche » et la formulation « flamme de feu » sont volontairement maintenues afin de préserver la texture et l’imagerie du grec.
