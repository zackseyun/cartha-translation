id: REV.1.9
reference: Revelation 1:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: fr
  text: Moi, Jean, votre frère et votre compagnon dans la détresse, le royaume et la persévérance en Jésus, j’étais sur l’île appelée Patmos à cause de la parole de Dieu et du témoignage de Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « du témoignage au sujet de Jésus ». Le génitif grec peut désigner soit le témoignage rendu par Jésus, soit le témoignage qui concerne Jésus.'
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: compagnon
  rationale: Le terme exprime une participation commune. « Compagnon dans » rend naturellement en français la solidarité de Jean avec ses lecteurs, sans connotation commerciale.
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: dans la détresse, le règne et la persévérance
  rationale: La construction coordonne trois réalités auxquelles Jean et ses lecteurs participent ensemble. « Détresse » conserve la gravité apocalyptique de θλῖψις; « règne » désigne ici la réalité dynamique de la souveraineté royale; « persévérance » rend l’endurance fidèle de ὑπομονή.
- source_word: ἐν Ἰησοῦ
  choice: en Jésus
  rationale: La formule compacte rattache naturellement les trois réalités précédentes à Jésus, sans expliciter davantage une relation que le grec laisse concise.
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: je me trouvais sur l’île
  rationale: Cette tournure française rend idiomatiquement la présence de Jean sur l’île sans préciser un mode d’arrivée que le texte ne donne pas.
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: appelée Patmos
  rationale: Formulation française directe et naturelle pour le participe grec en apposition à « l’île ».
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: à cause de la parole de Dieu
  rationale: διά suivi de l’accusatif indique la cause. Cette formulation laisse ouverte la manière précise dont la parole de Dieu a conduit Jean à Patmos.
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: le témoignage de Jésus
  rationale: Le complément « de Jésus » préserve en français l’ambiguïté du génitif grec entre un témoignage rendu par Jésus et un témoignage qui porte sur lui.
- source_word: ἀδελφὸς ὑμῶν
  choice: votre frère
  rationale: Cette expression directe conserve l’image familiale et la solidarité personnelle affirmées par Jean.
theological_decisions:
- issue: Ambiguïté du génitif dans μαρτυρίαν Ἰησοῦ
  choice: « le témoignage de Jésus » dans le texte principal
  alternative: « le témoignage au sujet de Jésus »
  rationale: Le génitif grec peut être subjectif ou objectif. La formulation principale maintient cette tension exégétique réelle, tandis que la note indique explicitement l’autre compréhension.
- issue: Portée de ἐν Ἰησοῦ
  choice: Rattacher « en Jésus » à la détresse, au règne et à la persévérance
  alternative: Le rattacher seulement à la persévérance
  rationale: La structure coordonnée et le sens global favorisent une portée sur l’ensemble de la série, tout en conservant l’expression grecque sous une forme compacte.
translation_notes:
  register: Français international moderne, naturel et digne. La dislocation « Moi, Jean… je » reproduit l’insistance du pronom grec tout en restant idiomatique. « Règne » a été préféré à « royaume » pour exprimer la souveraineté royale comme réalité partagée dans cette série abstraite.
