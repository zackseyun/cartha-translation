id: REV.1.10
reference: Revelation 1:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: fr
  text: Je me trouvai dans l’Esprit[a], le jour du Seigneur[b], et j’entendis derrière moi une voix forte, comme une trompette.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en esprit ». Cette expression peut désigner l’action prophétique de l’Esprit Saint; le texte ne dit pas explicitement « en extase ».
    reason: lexical_alternative
  - marker: b
    text: Ou, moins probablement, « au jour du Seigneur » dans son sens eschatologique. Le grec porte ici κυριακῇ ἡμέρᾳ, littéralement un jour « appartenant au Seigneur », et non la tournure habituelle désignant le « jour du Seigneur » eschatologique.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγενόμην
  choice: Je me trouvai
  rationale: Cette formulation française naturelle exprime l’entrée ou la présence dans un état sans réduire le verbe au simple « j’étais » ni ajouter explicitement l’idée d’une transe.
- source_word: ἐν πνεύματι
  choice: dans l’Esprit
  rationale: La majuscule indique la référence probable à l’Esprit Saint dans la formule visionnaire de l’Apocalypse, tout en conservant la formulation grecque et son degré d’ambiguïté.
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: le jour du Seigneur
  rationale: L’adjectif κυριακός signifie « qui appartient au Seigneur ». « Le jour du Seigneur » est la formulation française la plus claire et naturelle, bien qu’elle puisse aussi évoquer l’expression eschatologique; une note précise la distinction présente en grec.
- source_word: ἤκουσα
  choice: j’entendis
  rationale: Le verbe décrit ici une perception auditive ponctuelle; le passé simple convient au registre narratif soutenu du passage.
- source_word: ὀπίσω μου
  choice: derrière moi
  rationale: Le sens spatial s’impose dans le contexte et se rend directement en français.
- source_word: φωνὴν μεγάλην
  choice: une voix forte
  rationale: Avec φωνή, μέγας exprime naturellement la puissance ou le volume sonore; « forte » est idiomatique en français.
- source_word: ὡς σάλπιγγος
  choice: comme une trompette
  rationale: La comparaison simple conserve l’image grecque sans ajouter explicitement « son » ou « retentissement », absents du texte source.
theological_decisions:
- issue: La nature de l’expérience exprimée par ἐν πνεύματι
  choice: dans l’Esprit
  alternative: en esprit; en extase
  rationale: Le contexte suggère l’influence prophétique de l’Esprit Saint, mais le grec ne dit pas explicitement « en extase ». La traduction garde donc la formulation littérale et la tension interprétative.
- issue: L’identification de κυριακῇ ἡμέρᾳ
  choice: le jour du Seigneur
  alternative: le jour du Seigneur au sens eschatologique; le dimanche
  rationale: La construction grecque emploie l’adjectif κυριακός, « appartenant au Seigneur », et non la tournure grecque habituelle désignant le « jour du Seigneur » eschatologique. La traduction n’explicite toutefois pas ce jour comme étant nécessairement le dimanche.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple maintient la tonalité littéraire de l’Apocalypse sans archaïsme lexical. Les notes sont placées immédiatement après les expressions concernées et leurs marqueurs sont réordonnés par rapport à la couche anglaise afin de suivre leur apparition dans le texte français.
