id: REV.1.8
reference: Revelation 1:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: fr
  text: « Je suis l’Alpha et l’Oméga, dit le Seigneur Dieu, celui qui est, qui était et qui vient[a], le Tout-Puissant. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui doit venir ».'
    reason: Alternative lexicale et aspectuelle légitime pour ὁ ἐρχόμενος.
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Je suis
  rationale: Formulation française naturelle et solennelle qui rend la déclaration emphatique sans surtraduire le pronom grec.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: l’Alpha et l’Oméga
  rationale: Conserve les noms des lettres grecques et leur portée symbolique, conformément à l’expression apocalyptique établie en français.
- source_word: λέγει
  choice: dit
  rationale: Rend simplement le présent grec dans la formule de citation, sans ajouter la nuance plus interprétative de « déclare ».
- source_word: κύριος, ὁ θεός
  choice: le Seigneur Dieu
  rationale: Rend les deux titres divins en apposition dans une formulation biblique claire et idiomatique.
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: celui qui est, qui était et qui vient
  rationale: Préserve la structure ternaire et rend le participe présent ἐρχόμενος par « qui vient », formulation directe laissant ouverte sa portée présente et eschatologique.
- source_word: ὁ παντοκράτωρ
  choice: le Tout-Puissant
  rationale: Équivalent français établi et naturel qui exprime la souveraineté universelle de Dieu sans littéralisme maladroit.
theological_decisions:
- issue: La désignation divine articulant l’existence éternelle de Dieu et sa venue future
  choice: celui qui est, qui était et qui vient
  alternative: celui qui est, qui était et qui doit venir
  rationale: « Qui vient » correspond directement au participe présent grec et conserve l’idée d’une venue active. « Qui doit venir » est une lecture traditionnelle et légitime, signalée en note sans être imposée au texte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation met en relief la formule ternaire sans alourdir la phrase. Le titre traditionnel « le Tout-Puissant » et les noms grecs Alpha et Oméga sont conservés en raison de leur clarté et de leur forte portée symbolique.
