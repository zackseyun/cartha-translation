id: REV.1.4
reference: Revelation 1:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: fr
  text: 'Jean, aux sept Églises qui sont en Asie[a] : Que la grâce et la paix vous soient données de la part de celui qui est, qui était et qui vient[b], et de la part des sept esprits qui sont devant son trône[c],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « Asie » désigne la province romaine d’Asie, dans l’ouest de l’actuelle Turquie, et non le continent asiatique.
    reason: historical_clarification
  - marker: b
    text: 'Ou, selon la formulation française traditionnelle : « qui est, qui était et qui doit venir ».'
    reason: lexical_alternative
  - marker: c
    text: L’expression « les sept esprits » peut désigner symboliquement l’Esprit Saint dans sa plénitude, ou sept esprits célestes; le grec porte bien le pluriel « sept esprits ».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: Jean
  rationale: Forme française traditionnelle et courante du nom grec Ἰωάννης.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: aux sept Églises
  rationale: Dans ce cadre épistolaire chrétien, ἐκκλησία désigne naturellement les communautés locales; « Églises » est le terme français établi. La majuscule distingue ici les communautés chrétiennes sans imposer une conception institutionnelle particulière.
- source_word: ἐν τῇ Ἀσίᾳ
  choice: qui sont en Asie
  rationale: Suit explicitement le grec tout en produisant une adresse naturelle en français. « Asie » désigne ici la province romaine, précision donnée en note afin d’éviter l’identification au continent moderne.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: Que la grâce et la paix vous soient données
  rationale: Formulation idiomatique d’une bénédiction épistolaire en français; elle rend la valeur souhaitée ou invoquée de la formule nominale grecque et maintient le destinataire explicite.
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: de la part de celui qui est, qui était et qui vient
  rationale: « De la part de » rend naturellement la source personnelle exprimée par ἀπό. Les trois propositions conservent la force solennelle du titre divin; « qui vient » traduit directement le participe présent ὁ ἐρχόμενος sans le transformer en simple indication de futur.
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: des sept esprits
  rationale: Le grec porte un pluriel explicite. Le conserver évite de trancher dans le texte entre la plénitude symbolique de l’Esprit Saint et sept esprits célestes.
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: qui sont devant son trône
  rationale: Le verbe « sont », sous-entendu en grec, est nécessaire en français. Le relatif personnel « qui » convient à des esprits sans préciser davantage leur nature.
theological_decisions:
- issue: Identité de « celui qui est, qui était et qui vient »
  choice: Conserver la formule comme titre divin personnel et rendre ὁ ἐρχόμενος par « qui vient ».
  alternative: « celui qui est, qui était et qui doit venir »
  rationale: Le participe grec a une force verbale présente et peut évoquer une venue active; la traduction ne réduit donc pas la formule à une simple existence future. L’alternative traditionnelle est signalée en note.
- issue: Identité des « sept esprits »
  choice: Maintenir le pluriel littéral dans le texte principal.
  alternative: « l’Esprit dans sa plénitude » ou « sept esprits célestes »
  rationale: Le référent est discuté et le grec dit explicitement « sept esprits ». La note expose les principales possibilités sans en imposer une.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le caractère solennel de la salutation tout en restant naturelle. « Églises » prend ici une majuscule selon un usage éditorial fréquent pour les communautés chrétiennes; aucune distinction théologique ne dépend de cette graphie.
