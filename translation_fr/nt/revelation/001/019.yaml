id: REV.1.19
reference: Revelation 1:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γράψον οὖν ἃ εἶδες καὶ ἃ εἰσὶν καὶ ἃ μέλλει ⸀γίνεσθαι μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: fr
  text: Écris donc ce que tu as vu, ce qui est et ce qui est sur le point d’arriver[a] après tout cela.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui arrivera après tout cela ». Dans certains contextes, le verbe grec peut avoir presque la valeur d’un simple futur, bien qu’il exprime souvent ce qui est sur le point de se produire.'
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: Écris
  rationale: L’impératif aoriste actif à la deuxième personne du singulier exprime un ordre direct; « Écris » le rend naturellement sans ajout interprétatif.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque avec naturel en français la conséquence ou la continuité découlant de la vision et de la mission précédentes.
- source_word: ἃ εἶδες
  choice: ce que tu as vu
  rationale: Le passé composé relie idiomatiquement en français la vision déjà reçue à l’ordre présent de l’écrire.
- source_word: ἃ εἰσὶν
  choice: ce qui est
  rationale: Cette formulation collective et idiomatique conserve la référence aux réalités présentes sans expliciter davantage leur nature.
- source_word: μέλλει γίνεσθαι
  choice: ce qui est sur le point d’arriver
  rationale: Cette tournure préserve la nuance d’imminence souvent portée par μέλλω avec l’infinitif, sans introduire l’idée plus forte d’un destin fixé.
- source_word: μετὰ ταῦτα
  choice: après cela
  rationale: En français courant, « après cela » restitue naturellement la valeur temporelle de l’expression grecque; le démonstratif collectif peut reprendre l’ensemble de ce qui précède.
theological_decisions:
- issue: Valeur temporelle de μέλλει dans un contexte apocalyptique
  choice: Conserver l’imminence avec « est sur le point d’arriver »
  alternative: 'Employer le futur simple: « arrivera »'
  rationale: La construction grecque porte souvent l’idée d’un événement imminent, mais peut parfois se rapprocher d’un simple futur. Le texte principal conserve la tension temporelle la plus marquée, tandis que la note signale l’autre possibilité sans trancher un débat eschatologique plus large.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe ternaire du grec est conservée (« ce que… ce qui… ce qui… »), tout en privilégiant des formulations naturelles. « Après cela » évite le calque peu idiomatique « après ces choses ».
