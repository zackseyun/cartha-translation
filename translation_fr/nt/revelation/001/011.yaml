id: REV.1.11
reference: Revelation 1:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: fr
  text: 'qui disait : « Ce que tu vois, écris-le dans un livre[a] et envoie-le aux sept Églises : à Éphèse, à Smyrne, à Pergame, à Thyatire, à Sardes, à Philadelphie et à Laodicée. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans un rouleau »; le mot grec peut désigner un livre, un rouleau ou un document écrit.
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγούσης
  choice: qui disait
  rationale: Le participe présent féminin au génitif prolonge la description de la voix au verset précédent. « Qui disait » conserve ce lien grammatical et introduit naturellement la citation en français.
- source_word: Ὃ βλέπεις
  choice: Ce que tu vois
  rationale: Cette tournure idiomatique rend fidèlement le relatif neutre et le présent, sans restreindre l’étendue de la vision.
- source_word: γράψον
  choice: écris-le
  rationale: L’impératif aoriste commande directement la mise par écrit. Le pronom « le » reprend naturellement « ce que tu vois » en français.
- source_word: εἰς βιβλίον
  choice: dans un livre
  rationale: βιβλίον peut désigner un livre, un rouleau ou plus largement un document écrit. « Livre » est clair en français moderne, tandis que « rouleau » est signalé en note.
- source_word: πέμψον
  choice: envoie-le
  rationale: L’impératif est rendu directement; le pronom reprend le document écrit demandé dans la proposition précédente.
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: aux sept Églises
  rationale: Le terme désigne ici sept communautés chrétiennes locales bien déterminées. « Églises » est le terme français naturel dans ce contexte, sans précision confessionnelle.
- source_word: εἰς Ἔφεσον … εἰς Λαοδίκειαν
  choice: à Éphèse, à Smyrne, à Pergame, à Thyatire, à Sardes, à Philadelphie et à Laodicée
  rationale: La répétition de « à » devant chaque ville reproduit le caractère distributif de εἰς tout en restant fluide. Les formes retenues sont les noms français usuels de ces villes.
theological_decisions:
- issue: Sens de ἐκκλησίαις en Apocalypse 1.11
  choice: Églises
  alternative: assemblées
  rationale: Il s’agit de communautés chrétiennes locales auxquelles le message doit être envoyé. « Églises » exprime clairement cette réalité ecclésiale sans importer une structure ou une identité confessionnelle particulière.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier grec adressé à Jean. La syntaxe garde le lien avec la voix mentionnée dans le contexte précédent. Les toponymes suivent l’usage biblique français courant. La note anglaise associée à « Pergamum/Pergamos » n’est pas reprise, car « Pergame » est la forme française normale et aucune variante du texte grec ne l’exige.
