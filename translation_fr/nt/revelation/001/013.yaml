id: REV.1.13
reference: Revelation 1:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: fr
  text: et, au milieu des porte-lampes, quelqu’un qui ressemblait à un fils d’homme[a], vêtu d’une robe descendant jusqu’aux pieds et ceint d’une ceinture d’or à la poitrine.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quelqu’un qui ressemblait au Fils de l’homme ». La formulation grecque fait écho à Daniel 7.13 et désigne ici Jésus exalté.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ τῶν λυχνιῶν
  choice: au milieu des porte-lampes
  rationale: Rend directement la position spatiale et traduit λυχνία par le support de la lampe, conformément à l’image explicitée dans le contexte de l’Apocalypse.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: quelqu’un qui ressemblait à un fils d’homme
  rationale: Cette formulation naturelle conserve l’absence d’article en grec ainsi que l’écho à Daniel 7.13, sans imposer dans le texte principal la lecture de l’expression comme titre défini.
- source_word: ἐνδεδυμένον ποδήρη
  choice: vêtu d’une robe descendant jusqu’aux pieds
  rationale: « Vêtu » exprime l’état décrit par le participe, tandis que l’expansion « descendant jusqu’aux pieds » communique clairement le sens de ποδήρης.
- source_word: περιεζωσμένον πρὸς τοῖς μαστοῖς
  choice: ceint, à hauteur de poitrine
  rationale: « Ceint » maintient le registre solennel de la vision; « à hauteur de poitrine » indique naturellement en français que la ceinture est portée haut sur le torse.
- source_word: ζώνην χρυσᾶν
  choice: d’une ceinture d’or
  rationale: « Ceinture » est ici le terme français le plus naturel pour ζώνη; « d’or » décrit la matière avec sobriété et fidélité.
theological_decisions:
- issue: Portée christologique de ὅμοιον υἱὸν ἀνθρώπου
  choice: « quelqu’un qui ressemblait à un fils d’homme » dans le texte principal
  alternative: « quelqu’un qui ressemblait au Fils de l’homme »
  rationale: Le choix principal respecte la syntaxe grecque sans article et préserve l’allusion à Daniel 7.13 sans la transformer explicitement en titre. La variante traditionnelle, pertinente puisque la vision concerne Jésus exalté, est conservée en note.
translation_notes:
  register: Français international moderne, clair et digne, avec un léger relief solennel adapté au récit visionnaire. « Porte-lampes » privilégie la précision référentielle; « ceint » conserve le ton élevé sans rendre l’ensemble archaïque.
