id: REV.1.3
reference: Revelation 1:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: fr
  text: Heureux celui qui lit à haute voix[a], et ceux qui entendent les paroles de cette prophétie et gardent ce qui y est écrit, car le temps est proche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui lit ». Le grec évoque probablement une personne lisant publiquement dans l’assemblée.
    reason: lexical_alternative
  - marker: b
    text: Ou « car le moment fixé est proche ».
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Heureux
  rationale: Formule traditionnelle et naturelle des béatitudes en français biblique moderne; elle exprime la faveur accordée par Dieu sans se limiter à une émotion passagère.
- source_word: ὁ ἀναγινώσκων
  choice: celui qui lit à haute voix
  rationale: Le singulier du lecteur, opposé au pluriel de ceux qui entendent, indique vraisemblablement une lecture publique dans l’assemblée. La note conserve toutefois le sens lexical plus général.
- source_word: οἱ ἀκούοντες
  choice: ceux qui entendent
  rationale: Rend directement l’acte de recevoir oralement les paroles lues et s’accorde avec le contexte probable d’une lecture publique.
- source_word: τοὺς λόγους τῆς προφητείας
  choice: les paroles de cette prophétie
  rationale: « Paroles » respecte le pluriel λόγους sans le généraliser en « message »; « cette » désigne naturellement la prophétie contenue dans le livre.
- source_word: τηροῦντες
  choice: gardent
  rationale: '« Garder » préserve l’étendue de τηρέω: conserver fidèlement, prendre à cœur et mettre en pratique, sans le réduire au seul fait d’obéir à des règles.'
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: ce qui y est écrit
  rationale: Formulation idiomatique française qui rend le participe parfait passif et renvoie clairement à la prophétie.
- source_word: ὁ καιρός
  choice: le temps fixé
  rationale: καιρός peut désigner un moment décisif ou déterminé. « Temps fixé » rend cette nuance tout en évitant de préciser la chronologie de son accomplissement.
- source_word: ἐγγύς
  choice: est proche
  rationale: Expression française actuelle qui conserve l’affirmation de proximité temporelle sans imposer un scénario eschatologique.
theological_decisions:
- issue: Cadre de lecture publique suggéré par le lecteur singulier et les auditeurs pluriels
  choice: « celui qui lit à haute voix »
  alternative: « celui qui lit »
  rationale: La construction suggère fortement qu’une personne lit devant plusieurs auditeurs. La traduction explicite ce cadre probable, tandis que la note préserve l’ambiguïté lexicale.
- issue: Portée eschatologique de ὁ καιρὸς ἐγγύς
  choice: « le temps fixé est proche »
  alternative: « le temps est proche »
  rationale: La formulation maintient à la fois la nuance possible d’un moment déterminé et l’affirmation non résolue de sa proximité, sans adopter une chronologie prophétique particulière.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la forme de béatitude et le contraste entre le lecteur singulier et les auditeurs pluriels. Le vocabulaire reste biblique sans être archaïque.
