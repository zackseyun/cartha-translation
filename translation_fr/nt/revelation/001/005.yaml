id: REV.1.5
reference: Revelation 1:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: fr
  text: et de la part de Jésus le Messie[b], le témoin fidèle, le premier-né d’entre les morts et le souverain des rois de la terre. À celui qui nous aime et qui nous a libérés de nos péchés par son sang[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ont : « qui nous a lavés de nos péchés dans son sang », au lieu de : « qui nous a libérés de nos péchés par son sang ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « Jésus-Christ ». Le terme grec Christos est traduit ici par « Messie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: Jésus le Messie
  rationale: Χριστός est ici un titre. « Jésus le Messie » le traduit clairement et naturellement, tandis que « Jésus-Christ » reste indiqué en note comme formulation traditionnelle.
- source_word: ὁ μάρτυς ὁ πιστός
  choice: le témoin fidèle
  rationale: μάρτυς désigne celui qui rend témoignage, sans impliquer nécessairement la mort du martyr; πιστός exprime sa fidélité et sa fiabilité.
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: le premier-né d’entre les morts
  rationale: Cette formulation conserve l’image biblique de πρωτότοκος et rend naturellement le rapport aux morts, sans réduire le titre à une simple indication chronologique.
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: le souverain des rois de la terre
  rationale: « Souverain » exprime clairement l’autorité exercée sur les rois; « de la terre » convient à la portée cosmique de l’Apocalypse.
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: À celui qui nous aime
  rationale: Le participe présent exprime une action continue, rendue naturellement en français par le présent.
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: qui nous a libérés de nos péchés
  rationale: λύω signifie délier, relâcher ou libérer; « libérés de nos péchés » conserve l’image de délivrance et rend clairement ἐκ.
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: par son sang
  rationale: ἐν a ici une valeur instrumentale probable; « par son sang » exprime le moyen en français courant tout en préservant le langage sacrificiel.
theological_decisions:
- issue: Variante textuelle après « qui nous aime »
  choice: 'λύσαντι : « qui nous a libérés »'
  alternative: 'λούσαντι : « qui nous a lavés »'
  rationale: Le texte SBLGNT fourni porte λύσαντι. La variante λούσαντι, ancienne et théologiquement significative, est conservée en note sans remplacer le texte de base.
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: Christ
  rationale: Χριστός fonctionne comme un titre et correspond à « Messie ». L’alternative traditionnelle « Jésus-Christ » est signalée en note afin de préserver la transparence lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La série de titres reste solennelle. « Premier-né d’entre les morts » préserve l’image biblique sans l’expliciter, et le tiret final maintient la continuité syntaxique avec le verset suivant.
