  rationale: La révision est limitée à la restitution explicite de ἀποστείλας par « en l’envoyant » et à une réorganisation syntaxique qui maintient la concision ainsi que l’ambiguïté contrôlée du sujet implicite. Les notes sont conservées; la note d est ajustée pour correspondre à la syntaxe révisée.
