id: REV.1.1
reference: Revelation 1:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: fr
  text: Révélation de Jésus le Messie[a], que Dieu lui a donnée pour montrer à ses esclaves[b] ce qui doit arriver bientôt[c], et qu’il a fait connaître en l’envoyant par l’intermédiaire de son ange à son esclave Jean[d],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Révélation venant de Jésus le Messie » ou « Révélation concernant Jésus le Messie ». Le génitif grec permet plusieurs nuances.'
    reason: alternative_reading
  - marker: b
    text: Ou « serviteurs ». Le mot grec désigne littéralement des esclaves et souligne leur appartenance à un maître.
    reason: lexical_alternative
  - marker: c
    text: Ou « rapidement ». L’expression grecque peut signifier que ces événements arriveront bientôt ou qu’ils se dérouleront rapidement une fois commencés.
    reason: lexical_alternative
  - marker: d
    text: 'On pourrait aussi traduire : « qu’il l’a indiquée par des signes ». Le verbe grec peut suggérer une communication au moyen de signes, ce qui correspond au caractère symbolique du livre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: Révélation
  rationale: Le terme désigne le dévoilement ou la communication de ce qui était caché. « Révélation » est naturel en français et convient au début traditionnel du livre.
- source_word: Ἰησοῦ Χριστοῦ
  choice: de Jésus le Messie
  rationale: 'Χριστός fonctionne ici comme un titre. La construction française avec « de » conserve autant que possible l’ambiguïté du génitif grec : révélation venant de Jésus, lui appartenant ou le concernant.'
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: que Dieu lui a donnée
  rationale: La proposition relative est rendue directement; « lui » renvoie à Jésus le Messie sans ajouter d’explication doctrinale.
- source_word: δεῖξαι
  choice: pour montrer
  rationale: L’infinitif exprime le but du don et garde le sens visuel approprié au contexte des visions.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: à ses esclaves
  rationale: « Esclaves » préserve l’idée forte d’appartenance exprimée par δοῦλος, même si « serviteurs » serait plus usuel dans le registre religieux français.
- source_word: ἃ δεῖ γενέσθαι
  choice: ce qui doit arriver
  rationale: Formulation française idiomatique qui conserve la nécessité exprimée par δεῖ.
- source_word: ἐν τάχει
  choice: bientôt
  rationale: La locution peut exprimer la proximité temporelle ou la rapidité. « Bientôt » convient au contexte immédiat, tandis que l’autre possibilité est signalée en note.
- source_word: ἐσήμανεν
  choice: l’a fait connaître
  rationale: Traduction claire de σημαίνω. La possible nuance d’une communication au moyen de signes est conservée en note.
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: par l’intermédiaire de son ange
  rationale: La formulation met en évidence le rôle d’intermédiaire de l’ange exprimé par διά avec le génitif, sans reproduire lourdement le participe grec.
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: à son esclave Jean
  rationale: Le datif indique Jean comme destinataire; « esclave » assure la cohérence avec le premier emploi de δοῦλος.
theological_decisions:
- issue: Sens du génitif dans Ἀποκάλυψις Ἰησοῦ Χριστοῦ
  choice: « Révélation de Jésus le Messie »
  alternative: « Révélation venant de Jésus le Messie » ou « Révélation concernant Jésus le Messie »
  rationale: Le génitif grec peut indiquer la source, l’objet ou une relation plus large. La traduction principale ne tranche pas explicitement entre ces nuances.
- issue: Traduction de δοῦλος
  choice: « esclave(s) »
  alternative: « serviteur(s) »
  rationale: Le terme grec exprime une relation d’appartenance et de soumission plus forte que le français « serviteur ». Le choix conserve cette force sans développer sa portée théologique.
- issue: Rapport entre Dieu et Jésus dans la transmission de la révélation
  choice: « que Dieu lui a donnée »
  alternative: Expliciter le référent par « que Dieu a donnée à Jésus »
  rationale: Le pronom préserve la structure concise du grec ainsi que la distinction textuelle entre Dieu et Jésus, sans y ajouter une explication doctrinale.
translation_notes:
  register: 'Français international moderne, clair et digne. La syntaxe a été légèrement réorganisée pour éviter une chaîne participiale lourde, tout en conservant l’ordre de transmission : Dieu donne la révélation à Jésus, qui la communique à Jean par l’intermédiaire de son ange. La virgule finale signale que la phrase se poursuit au verset suivant.'
