id: REV.1.20
reference: Revelation 1:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: fr
  text: 'Quant au mystère des sept étoiles que tu as vues dans ma main droite et des sept porte-lampes en or : les sept étoiles sont les anges[a] des sept Églises, et les sept porte-lampes sont les sept Églises.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « messagers des sept Églises ». Le mot grec peut désigner aussi bien des anges que des messagers humains.
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: mystère
  rationale: Conserve le terme apocalyptique et théologique, qui désigne ici la signification révélée de la vision sans la réduire à une simple « signification symbolique ».
- source_word: ἀστέρων / ἀστέρες
  choice: étoiles
  rationale: Rendu direct de l’image visionnaire, dont la référence est ensuite explicitée.
- source_word: οὓς εἶδες
  choice: que tu as vues
  rationale: Tour relatif naturel en français moderne; l’accord au féminin pluriel suit « étoiles ».
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: dans ma main droite
  rationale: Rend naturellement en français l’image établie dans le contexte immédiat, où les étoiles sont tenues dans la main droite.
- source_word: λυχνίας
  choice: porte-lampes
  rationale: Le terme désigne des supports portant des lampes, et non les lampes elles-mêmes; « porte-lampes » préserve cette distinction plus clairement que le moderne « chandeliers ».
- source_word: χρυσᾶς
  choice: en or
  rationale: Expression française naturelle indiquant la matière des porte-lampes.
- source_word: ἄγγελοι
  choice: anges
  rationale: Le mot grec peut désigner des anges ou des messagers. L’usage fréquent dans l’Apocalypse et la lecture traditionnelle favorisent « anges » dans le texte, tandis que l’autre possibilité est conservée en note.
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: Églises
  rationale: Terme français usuel pour les communautés locales auxquelles s’adresse l’Apocalypse; la majuscule éditoriale distingue ces communautés au sens ecclésial.
- source_word: τὸ μυστήριον ... καὶ ...
  choice: 'Quant au mystère de… et des… :'
  rationale: Reproduit la mise en thème grecque suivie de son explication, sans ajouter une proposition absente du texte source.
theological_decisions:
- issue: Référent de ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν
  choice: les anges des sept Églises
  alternative: les messagers des sept Églises
  rationale: Ἄγγελος peut désigner un être céleste ou un messager humain. Le texte ne tranche pas explicitement; le sens « anges » est retenu dans le corps du texte et « messagers » figure en note afin de préserver l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse singulière à Jean. « Porte-lampes » est choisi pour éviter que « chandeliers » n’évoque à tort des supports à bougies. Le marqueur de note est placé après « anges », le mot auquel l’alternative se rapporte.
