id: REV.14.19
reference: Revelation 14:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: fr
  text: Alors l’ange passa sa faucille sur la terre, vendangea la vigne de la terre et jeta la vendange dans le grand pressoir de la colère de Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν … τὸ δρέπανον … εἰς τὴν γῆν
  choice: passa sa faucille sur la terre
  rationale: Dans ce contexte de récolte, βάλλω décrit le geste par lequel l’ange met la faucille en action. « Passa … sur » exprime naturellement le mouvement sans suggérer qu’il abandonne ou lance son outil dans le sol.
- source_word: ἐτρύγησεν
  choice: vendangea
  rationale: Le verbe τρυγάω désigne ici la récolte des raisins; « vendangea » est précis et maintient l’image viticole.
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: la vigne de la terre
  rationale: Traduction directe qui conserve la portée symbolique et la répétition de « la terre ».
- source_word: ἔβαλεν
  choice: jeta
  rationale: Pour le second emploi de βάλλω, l’objet récolté est projeté dans le pressoir; « jeta » rend clairement cette action énergique.
- source_word: εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν
  choice: dans le grand pressoir de la colère de Dieu
  rationale: « Pressoir » est le terme français courant pour ληνός. La construction conserve l’association métaphorique entre le pressoir et la colère divine ainsi que l’emphase de μέγαν.
theological_decisions:
- issue: Nature du jugement figuré par la vendange
  choice: Conserver l’image sans identifier explicitement la vigne ou la vendange à un groupe précis.
  alternative: Ajouter « les méchants » ou une autre identification interprétative.
  rationale: Le verset décrit symboliquement le jugement sans nommer directement les personnes représentées; une traduction ne doit pas résoudre cette portée théologique à la place du texte.
- issue: Sens de θυμός
  choice: « colère »
  alternative: « fureur »
  rationale: « Colère » est une traduction large et naturelle qui garde la notion de jugement divin; « fureur » accentuerait davantage l’intensité, déjà exprimée par l’image du grand pressoir.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. La formulation garde le rythme ternaire du grec et distingue naturellement la vendange de la vigne elle-même en employant « la vendange » comme objet jeté dans le pressoir.
