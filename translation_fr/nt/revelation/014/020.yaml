id: REV.14.20
reference: Revelation 14:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: fr
  text: Le pressoir fut foulé hors de la ville, et du sang sortit du pressoir[b] jusqu’aux mors des chevaux sur une distance de mille six cents stades.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le stade était une ancienne unité de distance ; mille six cents stades correspondent à environ 296 kilomètres.
    reason: cultural_note
  - marker: b
    text: 'Ou : « le sang coula du pressoir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπατήθη
  choice: fut foulé
  rationale: Le passif de πατέω évoque l’action de fouler aux pieds. « Fut foulé » conserve directement l’image du pressoir et le caractère solennel du récit.
- source_word: ληνός / ληνοῦ
  choice: pressoir
  rationale: « Pressoir » est l’équivalent français établi et maintient l’image apocalyptique de la vendange et du jugement.
- source_word: ἔξωθεν τῆς πόλεως
  choice: hors de la ville
  rationale: Expression spatiale naturelle et concise, fidèle au sens de « à l’extérieur de la ville ».
- source_word: ἐξῆλθεν αἷμα
  choice: du sang sortit
  rationale: Rend directement ἐξέρχομαι, « sortir », sans préciser de manière interprétative que le sang « coula », bien que ce sens soit possible dans le contexte.
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: jusqu’aux mors des chevaux
  rationale: « Mors » désigne naturellement en français la pièce du harnachement placée dans la bouche du cheval. La formulation conserve l’indication concrète et saisissante de hauteur ou d’étendue.
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: sur une distance de mille six cents stades
  rationale: Cette formulation exprime clairement l’étendue spatiale indiquée par le grec tout en conservant l’unité ancienne et la précision du texte.
theological_decisions:
- issue: Faut-il conserver l’image comme hyperbole apocalyptique ou l’adoucir par une explication ?
  choice: 'Conserver sans atténuation les éléments concrets : le sang, les mors des chevaux et les mille six cents stades.'
  alternative: Paraphraser le verset comme une représentation symbolique d’un jugement immense.
  rationale: Le texte présente volontairement une scène graphique de jugement apocalyptique. La traduction doit préserver sa force et sa tension sans en imposer une interprétation symbolique particulière.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient à la narration solennelle. « Fut foulé » et « pressoir » maintiennent l’imagerie viticole, tandis que la note sur « coula » signale l’alternative contextuelle sans l’introduire dans le texte principal.
