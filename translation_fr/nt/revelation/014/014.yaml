reference: Revelation 14:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: fr
  text: 'Je regardai, et voici : une nuée blanche. Sur la nuée était assis quelqu’un qui ressemblait à un fils d’homme[a]. Il avait sur la tête une couronne d’or[b] et, à la main, une faucille tranchante.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quelqu’un qui ressemblait au Fils de l’homme ». L’expression fait écho à Daniel 7.13 et est souvent comprise comme un titre messianique, bien que le grec dise ici, sans article, « comme un fils d’homme ».'
    reason: alternative_reading
  - marker: b
    text: Le mot grec traduit par « couronne » est stephanos ; il désigne souvent la couronne remise au vainqueur plutôt qu’un diadème royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: voici
  rationale: Conserve la force déictique et soudaine de la vision dans un français biblique actuel, sans recourir à l’archaïque « voici que ».
- source_word: νεφέλη λευκή
  choice: une nuée blanche
  rationale: « Nuée » est naturel dans le registre visionnaire et biblique, tandis que « blanche » rend directement λευκή sans l’interpréter comme « lumineuse ».
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: Sur la nuée était assis
  rationale: Formulation française naturelle et digne qui rend la position assise du participe καθήμενον.
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: quelqu’un qui ressemblait à un fils d’homme
  rationale: Rend l’absence d’article devant υἱὸν et préserve l’écho à Daniel 7.13 sans transformer implicitement l’expression en titre christologique défini.
- source_word: στέφανον χρυσοῦν
  choice: une couronne d’or
  rationale: Formulation claire et idiomatique; une note précise que στέφανος peut désigner la couronne du vainqueur plutôt qu’un diadème royal.
- source_word: δρέπανον ὀξύ
  choice: une faucille tranchante
  rationale: Rend directement l’instrument de moisson et son caractère acéré dans un vocabulaire moderne transparent.
theological_decisions:
- issue: Faut-il rendre υἱὸν ἀνθρώπου comme un titre christologique explicite ?
  choice: « quelqu’un qui ressemblait à un fils d’homme » dans le texte principal
  alternative: « quelqu’un qui ressemblait au Fils de l’homme »
  rationale: Le grec est sans article, mais l’expression fait nettement écho à Daniel 7.13 et reçoit souvent une lecture messianique. Le texte principal conserve la forme grecque et la note signale l’autre compréhension sans trancher la tension.
translation_notes:
  register: Français international moderne, clair et digne, avec un léger relief visionnaire. « Nuée » maintient le registre apocalyptique sans rendre l’ensemble archaïque. Les deux appels de note [a] et [b] figurent dans le texte principal.
