id: REV.14.15
reference: Revelation 14:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: fr
  text: 'Puis un autre ange sortit du sanctuaire et cria d’une voix forte à celui qui était assis sur la nuée : « Lance ta faucille et moissonne, car l’heure de moissonner est venue, car la moisson de la terre est desséchée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: sanctuaire
  rationale: Dans l’Apocalypse, le terme désigne le sanctuaire céleste plutôt que l’ensemble du temple ; « sanctuaire » conserve cette précision.
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: Lance ta faucille
  rationale: Πέμψον signifie littéralement « envoie » ; avec la faucille, « lance » exprime naturellement sa mise en action sans ajouter une interprétation.
- source_word: ἐξηράνθη
  choice: est mûre
  rationale: Le verbe signifie littéralement « s’est desséchée ». Dans le contexte agricole, il indique que la récolte est arrivée à maturité et prête à être moissonnée ; « est mûre » rend clairement cette valeur contextuelle.
theological_decisions:
- issue: Nature de la moisson terrestre
  choice: Conserver l’image sans préciser s’il s’agit du salut ou du jugement
  alternative: Expliciter une moisson de jugement ou le rassemblement des fidèles
  rationale: Le verset lui-même ne tranche pas explicitement la portée théologique de la moisson ; la traduction préserve cette tension narrative.
- issue: Autorité de l’ordre adressé à celui qui siège sur la nuée
  choice: Employer l’impératif direct « Lance… et moissonne »
  alternative: Atténuer en demande ou en annonce
  rationale: Le grec emploie deux impératifs. Les conserver respecte la forme du texte sans tirer de conclusion doctrinale sur la hiérarchie entre les personnages.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La répétition grecque autour de « moissonner/moisson » est conservée autant que le permet une formulation française naturelle.
