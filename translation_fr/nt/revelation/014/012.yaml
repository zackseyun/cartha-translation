id: REV.14.12
reference: Revelation 14:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: fr
  text: C’est ici que se trouve la persévérance des saints, ceux qui gardent les commandements de Dieu et la foi de Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « la foi en Jésus » ; autre possibilité : « la fidélité de Jésus ». L’expression grecque est ambiguë.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: C’est ici que se manifeste
  rationale: Dans cette formule rhétorique, ὧδε désigne la situation qui vient d’être décrite. La tournure française explicite naturellement la manifestation de la qualité évoquée sans en changer le contenu.
- source_word: ὑπομονὴ
  choice: persévérance
  rationale: Le nom désigne la constance dans l’épreuve. « Persévérance » est naturel en français moderne et exprime mieux la continuité active que le simple fait d’endurer.
- source_word: ἁγίων
  choice: saints
  rationale: « Saints » est le terme biblique courant pour désigner ceux qui appartiennent à Dieu; il reste concis et reconnaissable.
- source_word: τηροῦντες
  choice: gardent
  rationale: Le verbe peut exprimer le fait de garder, observer ou respecter. « Gardent les commandements » conserve sa nuance de fidélité vigilante ainsi que sa résonance biblique.
- source_word: ἐντολὰς
  choice: commandements
  rationale: Le terme désigne ici les prescriptions divines. « Commandements » en conserve le poids et l’usage biblique établi.
- source_word: πίστιν
  choice: foi
  rationale: « Foi » rend directement πίστις tout en laissant la construction avec le génitif ouverte aux différentes analyses possibles.
- source_word: Ἰησοῦ
  choice: de Jésus
  rationale: Le génitif grec est représenté formellement par « de Jésus ». Les interprétations plus explicites sont signalées en note plutôt qu’intégrées silencieusement au texte.
theological_decisions:
- issue: Sens de τὴν πίστιν Ἰησοῦ
  choice: la foi de Jésus
  alternative: la foi en Jésus; la fidélité de Jésus
  rationale: La construction peut désigner la foi dirigée vers Jésus ou la foi/fidélité propre à Jésus. Le texte principal reste proche de la forme grecque et la note préserve cette ambiguïté théologique réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le caractère rhétorique du verset et son apposition, tandis que la note rend explicite l’ambiguïté du génitif sans la résoudre dans le texte principal.
