id: REV.14.17
reference: Revelation 14:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: fr
  text: Puis un autre ange sortit du temple qui est dans le ciel[a] ; lui aussi avait une faucille tranchante.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du sanctuaire qui est dans le ciel ». Le grec ναός peut désigner plus précisément la partie intérieure du temple, le sanctuaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: un autre ange
  rationale: Traduction naturelle de l’expression grecque dans la succession des figures angéliques de la vision.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: L’aoriste de ἐξέρχομαι décrit la sortie depuis l’intérieur du temple ; « sortit » est direct et idiomatique.
- source_word: ναοῦ
  choice: temple
  rationale: ναός désigne le temple, plus précisément son sanctuaire intérieur. « Temple » reste clair et courant, tandis que l’autre possibilité est signalée en note.
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: qui est dans le ciel
  rationale: La relative rend explicitement la construction attributive grecque et rattache sans ambiguïté la localisation céleste au temple.
- source_word: ἔχων καὶ αὐτὸς
  choice: lui aussi avait
  rationale: 'Cette formulation française naturelle conserve l’insistance de καὶ αὐτός : cet ange possède, lui aussi, une faucille.'
- source_word: δρέπανον ὀξύ
  choice: une faucille tranchante
  rationale: « Faucille » est l’équivalent usuel de l’instrument de moisson ; « tranchante » restitue vivement ὀξύ et s’accorde naturellement avec l’objet.
theological_decisions:
- issue: Nature de l’image du temple céleste
  choice: Conserver « temple » sans développement interprétatif.
  alternative: Employer « sanctuaire » pour souligner la partie intérieure et sacrée du temple.
  rationale: Le texte présente l’image apocalyptique telle quelle, sans préciser si elle doit être comprise de manière architecturale, symbolique ou liturgique. La traduction préserve cette ouverture.
translation_notes:
  register: Français international moderne, sobre et digne. « Puis » marque naturellement la progression de la vision ; le point-virgule permet de conserver le lien entre la sortie de l’ange et la faucille qu’il porte sans calquer lourdement le participe grec.
