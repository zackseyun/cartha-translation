id: REV.14.11
reference: Revelation 14:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: fr
  text: Et la fumée de leur tourment monte pour les siècles des siècles[a], et ils n’ont de repos ni le jour ni la nuit, ceux qui adorent la bête et son image, et si quelqu’un reçoit la marque de son nom[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour des siècles de siècles » ; cette formule exprime ici une durée sans fin.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec termine de façon abrupte par « et si quelqu’un reçoit la marque de son nom », ce qui semble prolonger la description des personnes soumises au jugement. On peut aussi traduire plus couramment : « et quiconque reçoit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: fumée
  rationale: Équivalent concret et direct, qui conserve l’image apocalyptique sans l’expliciter.
- source_word: βασανισμοῦ
  choice: tourment
  rationale: Dans ce contexte de jugement, « tourment » exprime la souffrance punitive sans préciser indûment son mode.
- source_word: εἰς αἰῶνας αἰώνων
  choice: pour les siècles des siècles
  rationale: Formule française consacrée, proche de l’idiome grec et porteuse de sa force durative, sans substituer une formulation doctrinalement plus explicite.
- source_word: ἀναβαίνει
  choice: monte
  rationale: Le présent conserve le caractère vivant et continu de l’image.
- source_word: ἀνάπαυσιν
  choice: repos
  rationale: Équivalent direct qui garde le contraste avec le tourment incessant.
- source_word: ἡμέρας καὶ νυκτός
  choice: ni le jour ni la nuit
  rationale: Tour naturel en français après une négation, exprimant l’absence continuelle de repos.
- source_word: προσκυνοῦντες
  choice: adorent
  rationale: Dans l’Apocalypse, le verbe désigne ici l’hommage cultuel et l’allégeance religieuse.
- source_word: θηρίον
  choice: bête
  rationale: Rendu établi et précis de cette figure apocalyptique.
- source_word: εἰκόνα
  choice: image
  rationale: Équivalent large et direct, cohérent avec l’expression récurrente de l’Apocalypse.
- source_word: εἴ τις λαμβάνει
  choice: si quelqu’un reçoit
  rationale: Suit le passage abrupt du participe pluriel à la condition indéfinie au singulier et préserve la syntaxe marquée du grec.
- source_word: χάραγμα
  choice: marque
  rationale: Rendu usuel et suffisamment large du signe d’identification dans l’Apocalypse.
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: de son nom
  rationale: Conserve le rapport génitif du grec sans l’interpréter comme « portant son nom ».
theological_decisions:
- issue: Durée du jugement exprimée par εἰς αἰῶνας αἰώνων
  choice: pour les siècles des siècles
  alternative: pour toujours et à jamais
  rationale: La formule retenue reproduit de près l’idiome intensif de l’Apocalypse et sa portée de durée continue, tout en laissant la formulation source porter elle-même son poids théologique.
- issue: Référent et syntaxe de la proposition finale
  choice: et si quelqu’un reçoit
  alternative: et quiconque reçoit
  rationale: Le grec passe brusquement d’une désignation participiale au pluriel à une condition indéfinie au singulier. Le français conserve ce changement plutôt que de transformer silencieusement la proposition en second relatif coordonné.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme reste proche du grec ; la seconde phrase allège la longue coordination sans effacer l’enchaînement. La tournure finale volontairement abrupte est signalée en note.
