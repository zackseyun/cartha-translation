id: REV.14.4
reference: Revelation 14:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: fr
  text: Ce sont ceux qui ne se sont pas souillés avec des femmes[a], car ils sont vierges. Ce sont eux qui suivent l’Agneau partout où il va. Ils ont été achetés du milieu des êtres humains, comme prémices pour Dieu et pour l’Agneau[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette image peut aussi évoquer la pureté spirituelle ou l’absence de souillure liée à l’idolâtrie, plutôt que désigner uniquement l’abstinence sexuelle au sens littéral.
    reason: alternative_reading
  - marker: b
    text: L’expression grecque désigne les êtres humains en général, et non uniquement les hommes de sexe masculin.
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: ne se sont pas souillés
  rationale: Le verbe exprime la souillure, avec de possibles connotations morales ou cultuelles. La tournure pronominale est naturelle en français et rend ici l’état résultant évoqué par le passif grec.
- source_word: μετὰ γυναικῶν
  choice: avec des femmes
  rationale: Avec le génitif, μετά signifie normalement « avec ». Le pluriel γυναικῶν désigne ici des femmes, sans limiter explicitement le propos aux épouses.
- source_word: παρθένοι
  choice: vierges
  rationale: Le terme concret préserve l’image du grec sans la réduire d’emblée à une interprétation métaphorique telle que « chastes ».
- source_word: ἀκολουθοῦντες
  choice: suivent
  rationale: Le présent français rend naturellement l’action continue et caractéristique exprimée par le participe présent grec.
- source_word: ἀρνίῳ
  choice: l’Agneau
  rationale: Dans l’Apocalypse, ἀρνίον est un titre et une image christologiques. La majuscule signale cet emploi titulaire tout en conservant l’imagerie sacrificielle et apocalyptique.
- source_word: ὅπου ἂν ὑπάγῃ
  choice: partout où il va
  rationale: La combinaison ὅπου ἄν avec le subjonctif a une valeur indéfinie. « Partout où il va » est idiomatique et exprime l’absence de restriction.
- source_word: ἠγοράσθησαν
  choice: ont été achetés
  rationale: Le rendu conserve directement la métaphore commerciale et rédemptrice de ἀγοράζω, sans introduire dans le texte principal le terme plus interprétatif « rachetés ».
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: d’entre les humains
  rationale: ἄνθρωποι désigne ici les êtres humains en général, et non les seuls hommes de sexe masculin. Cette formulation française est précise, inclusive et naturelle.
- source_word: ἀπαρχὴ
  choice: comme prémices
  rationale: ἀπαρχή désigne la première part offerte à Dieu. « Prémices » conserve l’imagerie cultuelle et agricole; « comme » explicite naturellement en français la fonction appositive du terme.
theological_decisions:
- issue: Le caractère littéral ou symbolique de l’absence de souillure avec des femmes et de la virginité
  choice: 'Conserver dans le texte principal la formulation concrète : « ne se sont pas souillés avec des femmes, car ils sont vierges ».'
  alternative: Comprendre cette image comme désignant la pureté spirituelle ou l’absence de compromission idolâtre.
  rationale: Le grec emploie un langage concret. Puisque l’Apocalypse peut lui donner une portée symbolique, la traduction ne doit ni effacer cette forme ni trancher silencieusement la question; la note présente l’autre possibilité.
- issue: La valeur de l’achat des personnes
  choice: Traduire littéralement ἠγοράσθησαν par « ont été achetés ».
  alternative: Employer « ont été rachetés », qui explicite davantage la portée rédemptrice.
  rationale: « Achetés » préserve la métaphore du grec et laisse le contexte en déployer la portée théologique sans l’expliciter excessivement.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « Ce sont ceux… Ce sont eux… » reflète l’anaphore grecque sans lourdeur excessive. « Prémices » conserve le registre biblique et cultuel; la ponctuation finale en virgule suit le fait que le verset se poursuit syntaxiquement au verset suivant.
