id: REV.14.1
reference: Revelation 14:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: fr
  text: 'Puis je regardai, et voici : l’Agneau se tenait sur le mont Sion. Avec lui se tenaient cent quarante-quatre mille, qui portaient son nom et le nom de son Père inscrits sur leurs fronts.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent seulement : « le nom de son Père inscrit sur leurs fronts ».'
    reason: 'Variante textuelle : ces témoins omettent la mention du nom de l’Agneau.'
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Puis je regardai
  rationale: Cette formulation marque naturellement la progression de la vision tout en rendant le verbe de perception.
- source_word: ἰδοὺ
  choice: et voici
  rationale: « Voici » conserve la fonction d’appel à l’attention et le ton élevé du récit apocalyptique.
- source_word: τὸ ἀρνίον
  choice: l’Agneau
  rationale: Traduction consacrée du titre christologique dans l’Apocalypse, sans ajouter une interprétation sacrificielle absente de ce verset.
- source_word: ἑστὸς
  choice: se tenait
  rationale: Le participe parfait décrit un état résultant et durable; « se tenait » l’exprime naturellement en français.
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: sur le mont Sion
  rationale: Formulation française idiomatique du nom géographique.
- source_word: μετ’ αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: Avec lui se tenaient cent quarante-quatre mille personnes
  rationale: Le verbe est explicité pour former une phrase française naturelle; « personnes » évite de déterminer leur sexe, que le grec ne précise pas ici.
- source_word: ἔχουσαι
  choice: qui avaient
  rationale: Le participe féminin, accordé avec « milliers », est rendu naturellement par une proposition relative visant le groupe dénombré.
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: son nom et le nom de son Père
  rationale: La coordination de deux noms est conservée sans les identifier l’un à l’autre; « Père » prend une majuscule comme titre désignant Dieu.
- source_word: γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν
  choice: inscrits sur le front
  rationale: « Inscrits » rend l’état résultant du parfait passif et convient à un nom apposé comme marque; le singulier distributif « sur le front » est naturel en français.
theological_decisions:
- issue: Identité de τὸ ἀρνίον
  choice: Le titre « l’Agneau » est conservé sans développement explicatif.
  alternative: « l’Agneau offert en sacrifice »
  rationale: Le contexte de l’Apocalypse identifie l’Agneau au Christ, mais le verset n’ajoute ici aucun qualificatif sacrificiel.
- issue: Rapport entre les deux noms
  choice: « son nom et le nom de son Père »
  alternative: « son nom, c’est-à-dire celui de son Père »
  rationale: Le grec coordonne deux objets distincts; la traduction préserve cette distinction et leur étroite association sans résoudre davantage la relation théologique.
- issue: Variante textuelle concernant l’inscription
  choice: Le texte principal suit le SBLGNT et comporte le nom de l’Agneau ainsi que celui de son Père.
  alternative: Seulement « le nom de son Père »
  rationale: La variante modifie matériellement le contenu de l’inscription et mérite donc une note.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit visionnaire écrit, tandis que « et voici » conserve la solennité apocalyptique. La répétition de « nom » maintient le parallélisme explicite du grec.
