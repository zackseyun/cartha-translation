review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement la séquence visionnaire, l’Agneau, le mont Sion, le nombre et les deux noms du texte SBLGNT. Toutefois, l’ajout de « personnes » n’est pas requis par le grec, et « avaient ... inscrits » exprime moins nettement le marquage porté sur les fronts que la construction grecque.
  naturalness: Le français est globalement naturel et d’un registre approprié. « Portaient ... inscrits sur leurs fronts » est plus idiomatique dans ce contexte et rend mieux l’image d’une inscription visible. Le pluriel « leurs fronts » reflète directement le pluriel grec, sans nuire à la fluidité.
  terminology: « l’Agneau », « le mont Sion » et « son Père » conviennent. La coordination des deux noms est préservée sans interprétation doctrinale ajoutée.
  issues:
  - severity: low
    issue: Ajout de « personnes »
    rationale: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες signifie littéralement « cent quarante-quatre mille »; « personnes » explicite inutilement le référent et peut être omis.
  - severity: low
    issue: Rendu de l’inscription
    rationale: « qui avaient son nom et le nom de son Père inscrits » est compréhensible, mais « qui portaient ... inscrits sur leurs fronts » rend plus explicitement la construction ἔχουσαι ... γεγραμμένον et l’image du marquage.
  - severity: low
    issue: Singulier « sur le front » dans le texte et la note
    rationale: Le singulier distributif est possible en français, mais le grec a le pluriel τῶν μετώπων αὐτῶν. « Sur leurs fronts » conserve plus directement ce détail et clarifie que chaque membre du groupe est marqué.
  revised_text: 'Puis je regardai, et voici : l’Agneau se tenait sur le mont Sion. Avec lui se tenaient cent quarante-quatre mille, qui portaient son nom et le nom de son Père inscrits sur leurs fronts.[a]'
