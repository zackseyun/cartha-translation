id: REV.14.10
reference: Revelation 14:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: fr
  text: lui aussi boira du vin de la fureur de Dieu, préparé sans être dilué dans la coupe de sa colère[a], et il sera tourmenté dans le feu et le soufre, devant les saints anges et devant l’Agneau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque associe un vin préparé ou mêlé à un vin non dilué, c’est-à-dire servi dans toute sa force; elle souligne ainsi un jugement sans atténuation.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτός
  choice: lui aussi
  rationale: Le pronom est emphatique et reprend la personne évoquée au verset précédent; « lui aussi » rend naturellement cette insistance et la valeur additive de καί.
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: boira du vin
  rationale: En français, « boire du vin » exprime idiomatiquement la relation partitive marquée par ἐκ sans alourdir la phrase par « boire de ce vin » ou « boire à même le vin ».
- source_word: θυμοῦ τοῦ θεοῦ
  choice: de la fureur de Dieu
  rationale: Dans ce contexte de jugement, θυμός désigne une colère intense. « Fureur » conserve sa force et permet de le distinguer de ὀργή dans la même phrase.
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: préparé sans être dilué
  rationale: κεράννυμι évoque ici le vin préparé ou mêlé, tandis que ἄκρατος précise qu’il demeure non dilué. Cette formulation française exprime les deux idées sans créer l’apparente contradiction de « mélangé sans mélange ».
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: dans la coupe de sa colère
  rationale: « Dans » respecte la valeur ordinaire de ἐν et conserve l’image biblique de la coupe; « colère » rend ὀργή tout en la distinguant de θυμός.
- source_word: βασανισθήσεται
  choice: il sera tourmenté
  rationale: Le futur passif annonce une souffrance punitive sévère; « sera tourmenté » est précis, digne et naturel en français contemporain.
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: dans le feu et le soufre
  rationale: « Soufre » est le terme moderne exact pour θεῖον. « Dans » conserve l’image et la préposition grecque sans imposer exclusivement une lecture instrumentale.
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: devant les saints anges et devant l’Agneau
  rationale: La répétition de « devant » reproduit l’insistance du double ἐνώπιον; « l’Agneau » conserve le titre christologique de l’Apocalypse.
theological_decisions:
- issue: Distinction entre θυμός et ὀργή
  choice: Rendre θυμός par « fureur » et ὀργή par « colère »
  alternative: Rendre les deux termes par « colère », ou θυμός par « colère » et ὀργή par « indignation »
  rationale: Le grec emploie deux mots apparentés dans une même image. La distinction française préserve leur tension rhétorique sans prétendre établir entre eux une différence doctrinale rigide.
- issue: Force de τοῦ κεκερασμένου ἀκράτου
  choice: « préparé sans être dilué »
  alternative: « mélangé pur », « mêlé sans mélange » ou « versé à pleine force »
  rationale: L’expression associe la préparation du vin à son caractère non dilué et souligne ainsi un jugement sans atténuation. La traduction retenue garde ce paradoxe conceptuel de façon intelligible sans ajouter l’idée non explicite de verser.
- issue: Valeur de ἐν dans ἐν πυρὶ καὶ θείῳ
  choice: « dans le feu et le soufre »
  alternative: « par le feu et le soufre »
  rationale: Le grec peut évoquer le domaine où se produit le tourment ou le moyen de celui-ci. « Dans » reste proche de la formulation source et évite de trancher exclusivement en faveur de l’instrument.
translation_notes:
  register: Français international moderne, sobre et solennel. La formulation conserve l’imagerie apocalyptique de la coupe, du feu, du soufre et de l’Agneau, tout en distinguant les deux termes grecs relatifs à la colère divine.
