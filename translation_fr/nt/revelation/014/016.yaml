source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: fr
  text: Et celui qui était assis sur la nuée jeta sa faucille sur la terre[a], et la terre fut moissonnée[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « lança sa faucille sur la terre ». Le verbe grec signifie littéralement « jeta » ou « lança » ; dans cette scène, il décrit le geste qui déclenche la moisson.
    reason: lexical_alternative
  - marker: b
    text: Ou « fut récoltée ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: lança
  rationale: Le verbe βάλλω signifie concrètement « jeter/lancer ». « Lança sa faucille sur » conserve cette image énergique tout en restant intelligible dans le contexte de la moisson.
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: celui qui était assis sur la nuée
  rationale: Cette formulation reproduit la valeur substantive du participe sans identifier davantage le personnage. L’imparfait français convient à la posture décrite dans la scène narrative.
- source_word: νεφέλης
  choice: la nuée
  rationale: L’article grec et le contexte renvoient à la nuée déjà mentionnée. « Nuée », naturel dans un registre biblique moderne, garde ici la portée céleste de l’image.
- source_word: δρέπανον
  choice: faucille
  rationale: « Faucille » est l’équivalent français courant et précis de cet instrument de moisson.
- source_word: ἐπὶ τὴν γῆν
  choice: sur la terre
  rationale: Avec l’accusatif, ἐπί exprime ici le mouvement dirigé vers la terre. « Sur la terre » préserve cette relation sans imposer une description technique du geste.
- source_word: ἐθερίσθη
  choice: fut moissonnée
  rationale: Le passé simple passif rend l’aoriste passif et conserve l’image agricole ainsi que la concision solennelle de l’énoncé.
- source_word: ἡ γῆ
  choice: la terre
  rationale: Dans ce cadre apocalyptique à portée cosmique, « la terre » convient mieux qu’un territoire localisé et permet de conserver la répétition grecque.
theological_decisions:
- issue: Identité de celui qui moissonne, assis sur la nuée
  choice: Le désigner seulement comme « celui qui était assis sur la nuée ».
  alternative: L’identifier explicitement au Fils de l’homme ou à un agent angélique.
  rationale: Le contexte précédent favorise l’identification au Fils de l’homme, mais ce verset emploie seulement une désignation descriptive. La traduction n’ajoute donc aucune identification absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Nuée » et le passé simple maintiennent le registre visionnaire et solennel sans archaïsmes lourds. La répétition de « la terre » est conservée.
