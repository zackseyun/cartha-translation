id: REV.14.8
reference: Revelation 14:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: fr
  text: 'Et un autre ange, le deuxième, suivit en disant : « Elle est tombée, elle est tombée, Babylone la Grande, elle qui a fait boire[c] à toutes les nations du vin de la fureur[a] de son immoralité sexuelle[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de la colère » ou « de la passion ardente ». Le grec θυμός peut désigner la colère, la rage ou un emportement passionnel intense.
    reason: lexical_alternative
  - marker: b
    text: L’« immoralité sexuelle » de Babylone est vraisemblablement une image de son influence corruptrice, idolâtre et infidèle, sans que le texte la limite ici à une seule de ces idées.
    reason: cultural_note
  - marker: c
    text: Ou « qui a enivré toutes les nations ». Le grec dit littéralement qu’elle les a fait boire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: un autre ange, un deuxième
  rationale: Les deux éléments grecs, « autre » et « deuxième », sont conservés; l’apposition reste naturelle en français.
- source_word: ἠκολούθησεν λέγων
  choice: suivit en disant
  rationale: Cette formulation rend la succession dans la vision ainsi que le lien participial de λέγων, sans alourdir la phrase.
- source_word: Ἔπεσεν, ἔπεσεν
  choice: Elle est tombée, elle est tombée
  rationale: Le passé composé exprime naturellement en français l’annonce prophétique d’une chute accomplie, tandis que la répétition conserve sa force rhétorique.
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: Babylone la Grande
  rationale: La forme française traditionnelle du nom propre et le titre sont maintenus, avec une majuscule à « Grande » pour signaler la valeur de titre.
- source_word: ἣ
  choice: elle qui
  rationale: Le féminin explicite maintient la personnification de Babylone comme ville-femme.
- source_word: ἐκ τοῦ οἴνου
  choice: du vin
  rationale: Avec « faire boire », le partitif français rend naturellement le fait de boire à cette source, sans imposer la tournure peu idiomatique « à partir du vin ».
- source_word: τοῦ θυμοῦ
  choice: de la fureur
  rationale: « Fureur » conserve l’intensité de θυμός et son ambiguïté entre emportement passionnel et colère destructrice; une autre lecture est signalée en note.
- source_word: τῆς πορνείας αὐτῆς
  choice: de son immoralité sexuelle
  rationale: Cette expression moderne garde l’image sexuelle assez large pour permettre aussi sa portée symbolique, sans la réduire à la prostitution ni l’expliciter comme idolâtrie.
- source_word: πεπότικεν
  choice: a fait boire
  rationale: Le causatif et la valeur résultative du parfait grec sont rendus directement par le passé composé français.
- source_word: πάντα τὰ ἔθνη
  choice: toutes les nations
  rationale: Le terme désigne ici largement les peuples ou nations, plutôt que les seuls non-Juifs.
theological_decisions:
- issue: Portée métaphorique de πορνεία appliquée à Babylone
  choice: immoralité sexuelle
  alternative: prostitution; idolâtrie; infidélité
  rationale: Le texte conserve une image sexuelle susceptible d’évoquer une influence idolâtre, corruptrice ou infidèle, mais il ne l’explique pas par une seule catégorie.
- issue: Sens de θυμός dans « le vin du θυμός de son immoralité sexuelle »
  choice: fureur
  alternative: colère; passion ardente
  rationale: Le mot peut exprimer la colère violente ou un emportement intense. « Fureur » maintient cette tension, alors que « colère » orienterait davantage vers le jugement et « passion ardente » vers le désir.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la solennité de la proclamation visionnaire sans archaïsmes. Les répétitions et la personnification sont conservées, et les ambiguïtés lexicales importantes sont signalées en notes.
