id: REV.14.13
reference: Revelation 14:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: fr
  text: 'Et j’entendis une voix venant du ciel qui disait : « Écris : Heureux dès maintenant les morts qui meurent dans le Seigneur. » « Oui, dit l’Esprit, afin qu’ils se reposent de leurs peines, car leurs œuvres les accompagnent. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: une voix venant du ciel qui disait
  rationale: Cette formulation rend naturellement l’origine céleste de la voix et conserve la valeur du participe λεγούσης dans le cadre narratif au passé.
- source_word: Γράψον
  choice: Écris
  rationale: L’impératif aoriste singulier est rendu directement, sans ajouter de complément absent du grec.
- source_word: Μακάριοι
  choice: Heureux
  rationale: « Heureux » est la formulation française traditionnelle et naturelle des béatitudes; elle exprime une condition déclarée favorable plutôt qu’une simple émotion.
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: ceux qui meurent dans le Seigneur
  rationale: Le français évite la lourdeur de « les morts qui meurent » tout en conservant la caractérisation substantivale et l’expression théologiquement ouverte « dans le Seigneur ».
- source_word: ἀπ’ ἄρτι
  choice: dès maintenant
  rationale: Cette expression temporelle moderne marque clairement le point de départ indiqué par le grec.
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: Oui, dit l’Esprit
  rationale: « Oui » garde l’affirmation emphatique, et le présent grec de discours est rendu par un présent de narration idiomatique en français.
- source_word: ἵνα ἀναπαήσονται
  choice: afin qu’ils se reposent
  rationale: « Afin que » préserve la nuance de but ou de résultat de ἵνα; le subjonctif est requis en français et ne permet pas de reproduire formellement le futur grec.
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: de leurs peines
  rationale: κόπος désigne ici l’effort pénible, la fatigue et les épreuves qui en résultent. « Peines » est naturel et suffisamment large en français biblique moderne.
- source_word: τὰ γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν
  choice: car leurs œuvres les accompagnent
  rationale: « Œuvres » conserve le vocabulaire moral et actif de ἔργα. « Les accompagnent » rend idiomatiquement à la fois ἀκολουθεῖ et la présence de μετά, sans le tour maladroit « suivent avec eux ».
theological_decisions:
- issue: Sens de « dans le Seigneur »
  choice: Conserver littéralement « dans le Seigneur ».
  alternative: « fidèles au Seigneur » ou « appartenant au Seigneur »
  rationale: Le grec peut évoquer l’union, l’appartenance et la fidélité; la traduction ne réduit pas cette richesse à une seule interprétation.
- issue: Force de ἵνα ἀναπαήσονται
  choice: « afin qu’ils se reposent »
  alternative: « car ils se reposeront » ou « de sorte qu’ils se reposeront »
  rationale: La formulation retenue maintient la nuance de but ou de résultat sans trancher excessivement, tandis que la syntaxe française exige le subjonctif après « afin que ».
- issue: Rapport entre les œuvres et les morts déclarés heureux
  choice: Dire simplement que leurs œuvres les accompagnent.
  alternative: Présenter les œuvres soit comme méritant leur salut, soit comme étant seulement gardées en mémoire.
  rationale: Le verset affirme l’accompagnement des œuvres sans expliquer ici leur fonction précise; aucune doctrine supplémentaire n’est introduite.
translation_notes:
  register: Français international moderne, digne et lisible. La formulation garde le rythme solennel de la proclamation céleste sans archaïsmes. Le marqueur [a] figure dans le texte principal.
