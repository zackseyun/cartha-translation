id: REV.14.9
reference: Revelation 14:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: fr
  text: 'Et un autre ange, le troisième, les suivit en disant d’une voix forte : « Si quelqu’un adore[a] la bête et son image, et reçoit une marque sur son front ou sur sa main[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se prosterne devant la bête et son image ». Le verbe grec peut désigner l’action de se prosterner, mais il exprime ici une allégeance cultuelle.
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie des possessifs masculins singuliers avec « si quelqu’un » ; ils ont ici une valeur générique.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: un autre ange, le troisième
  rationale: Cette formulation conserve à la fois ἄλλος (« un autre ») et τρίτος (« le troisième »), tout en exprimant naturellement l’ordre des trois anges en français.
- source_word: ἠκολούθησεν αὐτοῖς
  choice: les suivit
  rationale: Le pronom « les » préserve le renvoi pluriel du grec sans préciser davantage ses référents.
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: dit d’une voix forte
  rationale: Expression française naturelle qui rend le participe introducteur et le caractère public et puissant de la proclamation.
- source_word: Εἴ τις
  choice: Si quelqu’un
  rationale: Rend directement la condition indéfinie et sa portée générale.
- source_word: προσκυνεῖ
  choice: adore
  rationale: Dans ce contexte, le verbe désigne une prosternation exprimant une allégeance cultuelle envers la bête, et non un simple geste de respect.
- source_word: τὸ θηρίον
  choice: la bête
  rationale: Équivalent français établi de θηρίον dans le langage apocalyptique de l’Apocalypse.
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: son image
  rationale: Le possessif français renvoie naturellement à « la bête » sans ajouter de précision de genre absente du sens contextuel.
- source_word: λαμβάνει χάραγμα
  choice: reçoit une marque
  rationale: « Reçoit » exprime l’acceptation de la marque, tandis que l’article indéfini convient au nom grec sans article.
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: sur son front ou sur sa main
  rationale: La formulation conserve le singulier et les possessifs qui renvoient à « quelqu’un », tout en rendant clairement la localisation.
theological_decisions:
- issue: Portée religieuse de προσκυνέω envers la bête
  choice: adore
  alternative: se prosterne devant
  rationale: Le contexte associe le geste à une allégeance idolâtre. « Adore » en exprime clairement la gravité cultuelle, tandis qu’une note conserve la dimension possible de prosternation.
- issue: Singulier générique avec τις et αὐτοῦ
  choice: sur son front ou sur sa main
  alternative: sur le front ou sur la main
  rationale: Les possessifs singuliers reproduisent le lien grammatical avec « quelqu’un » sans transformer le référent en pluriel ni restreindre l’avertissement aux hommes.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans calque lourd. Les marqueurs [a] et [b] sont placés précisément après les expressions auxquelles leurs notes se rapportent. Le guillemet et la virgule finale restent ouverts, puisque la déclaration se poursuit au verset suivant.
