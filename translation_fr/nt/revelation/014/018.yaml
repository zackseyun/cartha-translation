source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: fr
  text: 'Et un autre ange sortit de l’autel, celui qui avait autorité sur le feu. Il cria d’une voix forte à celui qui tenait la faucille tranchante : « Lance ta faucille tranchante[a] et vendange les grappes de la vigne de la terre[b], car ses raisins sont mûrs. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Mets ta faucille tranchante à l’œuvre ». Le verbe grec signifie littéralement « envoyer », mais, dans le contexte d’une récolte, l’expression peut être rendue de façon idiomatique.
    reason: lexical_alternative
  - marker: b
    text: « La vigne de la terre » est une image apocalyptique. Le texte n’en identifie pas explicitement le référent ici, bien que le contexte évoque le jugement.
    reason: cross_reference
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: un autre ange
  rationale: Dans les visions de l’Apocalypse, ἄγγελος désigne normalement un être angélique. « Un autre ange » conserve aussi la progression narrative marquée par ἄλλος.
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: sortit de l’autel
  rationale: « Autel » rend θυσιαστήριον. Avec le verbe de mouvement sous-entendu par la construction, « sortit de l’autel » préserve l’image singulière du grec sans la remplacer par une interprétation spatiale.
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: Il avait autorité sur le feu
  rationale: La proposition indépendante est naturelle en français et garde l’idée d’une autorité exercée à l’égard du feu. L’imparfait s’accorde au cadre narratif sans nier le caractère descriptif du participe présent grec.
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: cria d’une voix forte
  rationale: Cette formulation française actuelle conserve à la fois l’intensité du verbe et le nom explicite φωνή.
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: à celui qui tenait la faucille tranchante
  rationale: « Tenait » exprime naturellement la possession concrète de l’instrument dans cette scène. « Faucille tranchante » rend δρέπανον τὸ ὀξύ et permet d’en conserver la répétition.
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: Lance ta faucille tranchante
  rationale: πέμπω signifie fondamentalement « envoyer ». « Lance » conserve ce mouvement en français tout en restant intelligible dans l’image de la récolte; la note signale l’expression idiomatique alternative.
- source_word: τρύγησον
  choice: vendange
  rationale: τρυγάω désigne spécifiquement la récolte des raisins. Le verbe français « vendanger » restitue cette précision viticole avec naturel.
- source_word: τοὺς βότρυας
  choice: les grappes
  rationale: βότρυς désigne une grappe de raisin. Le contexte explicite rend inutile l’ajout de « raisin » ici.
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: de la vigne de la terre
  rationale: La double construction au génitif est conservée afin de maintenir l’image apocalyptique et son ambiguïté, sans identifier explicitement son référent.
- source_word: ἤκμασαν
  choice: sont mûrs
  rationale: ἀκμάζω indique que les raisins ont atteint leur maturité. « Sont mûrs » est précis et naturel, sans ajouter l’intensification « tout à fait ».
- source_word: αἱ σταφυλαὶ αὐτῆς
  choice: ses raisins
  rationale: σταφυλαί signifie « raisins » et le possessif renvoie naturellement en français à « la vigne ».
theological_decisions:
- issue: Interprétation de τῆς ἀμπέλου τῆς γῆς
  choice: Conserver « la vigne de la terre » comme métaphore apocalyptique
  alternative: Identifier directement la vigne aux habitants impies de la terre ou paraphraser « la vigne qui pousse sur la terre »
  rationale: Le contexte environnant évoque fortement le jugement, mais ce verset présente une image sans en nommer explicitement le référent. La traduction préserve donc la tension théologique au lieu de l’expliquer dans le texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme narratif est allégé par deux phrases. Le vocabulaire viticole précis (« vendange », « grappes », « raisins ») conserve la cohérence de l’image, tandis que les répétitions significatives du grec sont maintenues.
