id: REV.14.6
reference: Revelation 14:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: fr
  text: Et je vis un autre ange qui volait au milieu du ciel et qui avait un évangile éternel à proclamer aux habitants de la terre[b], et à toute nation, tribu, langue et peuple,
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Littéralement « à ceux qui sont assis sur la terre » ; dans l’Apocalypse, cette expression désigne de manière idiomatique les habitants de la terre.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: un autre ange
  rationale: « Un autre ange » rend directement la succession narrative exprimée par ἄλλον et, dans le contexte apocalyptique de l’Apocalypse, ἄγγελος désigne un être angélique céleste.
- source_word: πετόμενον
  choice: qui volait
  rationale: Le participe présent décrit l’ange en plein mouvement; la proposition relative est naturelle en français moderne.
- source_word: ἐν μεσουρανήματι
  choice: au milieu du ciel
  rationale: Cette formulation conserve l’image spatiale du terme apocalyptique μεσουράνημα tout en restant immédiatement compréhensible; une note signale ses autres nuances possibles.
- source_word: ἔχοντα
  choice: Il avait
  rationale: Le verbe « avoir » rend sans surinterprétation la possession du message par l’ange. Une nouvelle phrase évite une longue accumulation de participes peu naturelle en français.
- source_word: εὐαγγέλιον αἰώνιον
  choice: un Évangile éternel
  rationale: « Évangile » préserve la résonance canonique de εὐαγγέλιον, tandis que l’article indéfini respecte la construction grecque sans article. « Éternel » rend la portée durable de αἰώνιον.
- source_word: εὐαγγελίσαι
  choice: à proclamer
  rationale: L’infinitif exprime ici le but. « Proclamer » évite une répétition maladroite tout en conservant le caractère public de l’annonce.
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: aux habitants de la terre
  rationale: Καθημένους signifie littéralement « assis », mais la formule fonctionne dans l’Apocalypse comme une désignation des personnes établies sur la terre. « Habitants » transmet cette valeur idiomatique sans suggérer une simple posture.
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: à toute nation, tribu, langue et peuple
  rationale: Cette série conserve les quatre catégories et leur portée universelle. En français, les virgules et le dernier « et » rendent naturellement la coordination grecque répétée.
theological_decisions:
- issue: Rendre εὐαγγέλιον αἰώνιον par un terme chrétien traditionnel ou par une expression plus générique
  choice: un Évangile éternel
  alternative: une bonne nouvelle éternelle
  rationale: « Évangile » garde la résonance théologique et canonique du mot grec sans préciser le contenu de la proclamation au-delà du texte. L’indéfini maintient l’absence d’article en grec sans imposer la lecture « l’Évangile éternel ».
- issue: Interprétation de la formule τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: aux habitants de la terre
  alternative: à ceux qui sont assis sur la terre
  rationale: La traduction choisie rend l’usage idiomatique récurrent de l’Apocalypse sans transformer la formule en description de posture. La note conserve toutefois le sens littéral et donc la texture propre de l’expression.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Et je vis » conserve la continuité visionnaire du récit. Deux phrases allègent la syntaxe participiale grecque sans modifier les rapports logiques. La virgule finale est maintenue parce que le verset se poursuit syntaxiquement au verset suivant.
