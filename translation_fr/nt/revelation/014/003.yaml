id: REV.14.3
reference: Revelation 14:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: fr
  text: Ils chantent ce qui paraît être un chant nouveau devant le trône, devant les quatre êtres vivants et devant les anciens[a]. Personne ne pouvait apprendre ce chant, excepté les cent quarante-quatre mille, ceux qui avaient été achetés[b] de la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme un chant nouveau ». Le grec emploie ici une tournure de comparaison ou d’apparence fréquente dans les visions de l’Apocalypse.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « rachetés ». Le verbe grec signifie littéralement « acheter » ou « acquérir ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: ils chantent
  rationale: Le présent de l’indicatif est conservé pour rendre le présent vivant de la narration visionnaire de l’Apocalypse.
- source_word: ὡς
  choice: ce qui paraît être
  rationale: Cette formulation naturelle en français exprime la perception visionnaire signalée par ὡς sans nier qu’il s’agisse réellement d’un chant nouveau.
- source_word: ᾠδὴν καινὴν
  choice: un chant nouveau
  rationale: Équivalent français courant et digne, qui conserve l’idée de nouveauté portée par καινή.
- source_word: ἐνώπιον
  choice: devant
  rationale: Rend de façon concise la présence devant le trône et les êtres de la cour céleste.
- source_word: τῶν τεσσάρων ζῴων
  choice: les quatre êtres vivants
  rationale: Évite le sens animalier trompeur et désigne naturellement les êtres célestes entourant le trône.
- source_word: τῶν πρεσβυτέρων
  choice: les anciens
  rationale: Désignation française établie et contextuellement appropriée pour ce groupe de la cour céleste.
- source_word: οὐδεὶς ἐδύνατο
  choice: personne ne pouvait
  rationale: Restitue naturellement en français l’imparfait exprimant l’incapacité.
- source_word: μαθεῖν
  choice: apprendre
  rationale: Conserve le sens premier de μανθάνω sans introduire l’idée plus forte de maîtriser.
- source_word: εἰ μὴ
  choice: excepté
  rationale: Après une proposition négative, ce terme exprime clairement la valeur exceptive.
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: les cent quarante-quatre mille
  rationale: Le nombre est écrit en toutes lettres pour préserver la tenue littéraire du passage.
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: ceux qui avaient été achetés parmi les habitants de la terre
  rationale: « Achetés » maintient la métaphore commerciale de ἀγοράζω. L’expression « parmi les habitants de la terre » explicite en français naturel la provenance indiquée par ἀπό avec « la terre », sans employer dans le texte principal le terme théologiquement plus chargé « rachetés ».
theological_decisions:
- issue: Valeur de ὡς dans la description visionnaire
  choice: ce qui paraît être un chant nouveau
  alternative: comme un chant nouveau
  rationale: La formulation conserve la nuance de perception propre au langage visionnaire sans trancher la question de la nature objective du chant.
- issue: Traduction de ἠγορασμένοι
  choice: achetés
  alternative: rachetés
  rationale: Le texte principal garde la métaphore explicite de l’achat; « rachetés », théologiquement familier, est signalé en note comme traduction possible.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « devant » est maintenue afin de refléter la structure du grec et de donner à chaque groupe sa place dans la scène céleste. Le vocabulaire évite les archaïsmes tout en préservant le caractère solennel de la vision.
