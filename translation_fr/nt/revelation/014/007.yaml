id: REV.14.7
reference: Revelation 14:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: fr
  text: 'Il disait d’une voix forte : « Craignez Dieu[a] et rendez-lui gloire, car l’heure de son jugement est venue. Et adorez celui qui a fait le ciel, la terre, la mer et les sources d’eau[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Révérez Dieu ». Le verbe grec peut exprimer aussi bien une crainte révérencielle que la crainte devant le jugement.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « des sources d’eaux » ; le grec emploie le pluriel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: Il disait d’une voix forte
  rationale: Le tour verbal français conserve le lien participial avec le contexte précédent tout en rendant naturellement l’expression grecque ἐν φωνῇ μεγάλῃ.
- source_word: Φοβήθητε τὸν θεόν
  choice: Craignez Dieu
  rationale: « Craignez » maintient à la fois la révérence due à Dieu et la gravité suscitée par l’annonce du jugement, sans réduire le verbe au simple respect ni à la seule terreur.
- source_word: δότε αὐτῷ δόξαν
  choice: rendez-lui gloire
  rationale: Cette expression française courante et solennelle transmet l’appel à reconnaître et proclamer la gloire de Dieu plus naturellement que le calque « donnez-lui gloire ».
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: car l’heure de son jugement est venue
  rationale: « Car » exprime la valeur causale de ὅτι, tandis que « l’heure » préserve l’immédiateté apocalyptique de ὥρα. « Son jugement » conserve la concision et l’ambiguïté possible du génitif.
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: adorez celui qui a fait
  rationale: Dans l’Apocalypse, προσκυνέω désigne ici l’adoration religieuse. Le participe substantivé est rendu par une formulation française naturelle qui conserve sa force verbale.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν καὶ πηγὰς ὑδάτων
  choice: le ciel, la terre, la mer et les sources d’eau
  rationale: La liste garde l’écho du langage biblique de la création. « Sources d’eau » est idiomatique en français, tandis qu’une note signale le pluriel littéral du grec.
theological_decisions:
- issue: Portée de l’impératif Φοβήθητε τὸν θεόν
  choice: Craignez Dieu
  alternative: Révérez Dieu
  rationale: Le contexte unit crainte, gloire, adoration et jugement. « Craignez » préserve la tension entre révérence et crainte devant le Dieu créateur et juge, au lieu de la résoudre en simple respect.
- issue: Valeur de τῆς κρίσεως αὐτοῦ
  choice: de son jugement
  alternative: du jugement qu’il exerce
  rationale: La formulation retenue ne précise pas davantage que le grec si le génitif met surtout l’accent sur l’appartenance, la source ou l’exercice du jugement.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme solennel de la proclamation est maintenu, ainsi que l’enchaînement des impératifs et les échos au langage de la création.
