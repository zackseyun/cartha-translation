id: REV.14.5
reference: Revelation 14:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸂ἐν τῷ στόματι αὐτῶν οὐχ εὑρέθη⸃ ψεῦδος· ⸀ἄμωμοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: fr
  text: Et dans leur bouche, aucun mensonge n’a été trouvé ; ils sont irréprochables[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans défaut » ou « sans tache » ; le terme grec peut évoquer aussi bien l’intégrité morale que l’absence de défaut exigée pour une offrande sacrificielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: dans leur bouche
  rationale: Cette formulation conserve le singulier grec à valeur collective et l’image biblique de la bouche comme lieu de la parole, tout en restant compréhensible en français.
- source_word: οὐχ εὑρέθη
  choice: aucun mensonge n’a été trouvé
  rationale: Le passif aoriste est conservé afin de maintenir l’accent du grec sur l’absence constatée de mensonge.
- source_word: ψεῦδος
  choice: mensonge
  rationale: « Mensonge » est le terme français le plus direct et naturel pour désigner ici une parole contraire à la vérité ; « fausseté » serait possible mais plus abstrait.
- source_word: ἄμωμοί
  choice: sans défaut
  rationale: « Sans défaut » préserve à la fois l’idée d’intégrité morale et l’éventuelle résonance sacrificielle de l’adjectif grec, sans imposer un seul de ces deux aspects.
- source_word: καὶ
  choice: Et
  rationale: La conjonction est maintenue pour marquer la continuité avec la description précédente.
theological_decisions:
- issue: Rendre ἄμωμοί sans effacer son arrière-plan sacrificiel ni transformer explicitement l’expression en affirmation de perfection absolue
  choice: sans défaut
  alternative: irréprochables
  rationale: « Sans défaut » conserve l’ambivalence entre intégrité morale et absence de défaut sacrificiel. « Irréprochables » exprimerait clairement le sens éthique, mais atténuerait l’imagerie cultuelle possible.
translation_notes:
  register: Français moderne, digne et accessible. La tournure « dans leur bouche » demeure légèrement sémitisante, mais elle est volontairement conservée pour refléter l’expression grecque et son image liée à la parole.
