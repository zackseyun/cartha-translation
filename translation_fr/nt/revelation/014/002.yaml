id: REV.14.2
reference: Revelation 14:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: fr
  text: Et j’entendis un son[a] venant du ciel, semblable au bruit de grandes eaux[b] et à celui d’un puissant tonnerre. Le son que j’entendis était comme celui de harpistes jouant de leurs harpes[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une voix » ; le mot grec φωνή peut désigner une voix ou un son selon le contexte. Il est rendu ici par « son » dans ses trois occurrences.
    reason: lexical_alternative
  - marker: b
    text: Les « grandes eaux » sont une image biblique évoquant un grondement immense et irrésistible ; comparer Ézéchiel 43.2.
    reason: cross_reference
  - marker: c
    text: Le grec κιθάρα désigne un ancien instrument à cordes, plus proche de la lyre ; il est traditionnellement rendu par « harpe ».
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: bruit
  rationale: Dans les trois occurrences, le terme désigne ici un phénomène sonore comparé aux grandes eaux, au tonnerre et à la musique instrumentale. « Bruit » convient mieux que « voix » à cette dominante acoustique, sans attribuer explicitement le son à une personne.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: venant du ciel
  rationale: Dans l’Apocalypse, οὐρανός désigne couramment le domaine céleste. Cette tournure est naturelle en français et conserve l’origine céleste du bruit.
- source_word: ὡς
  choice: semblable à / ressemblait à
  rationale: Le terme introduit les comparaisons successives. La légère variation française évite une lourdeur sans modifier la relation de similitude.
- source_word: ὑδάτων πολλῶν
  choice: grandes eaux
  rationale: « Grandes eaux » est une expression biblique française établie qui conserve l’image d’une masse d’eau immense et retentissante, sans la réduire à un type précis de courant.
- source_word: βροντῆς μεγάλης
  choice: puissant tonnerre
  rationale: μέγας exprime ici la grandeur ou l’intensité. « Puissant tonnerre » restitue la force de l’image dans un français naturel et soutenu.
- source_word: κιθαρῳδῶν
  choice: harpistes
  rationale: Dans ce contexte, le participe qui suit met l’accent sur le jeu instrumental. « Harpistes » est clair, concis et conforme au vocabulaire traditionnel de l’Apocalypse.
- source_word: κιθαριζόντων
  choice: jouant
  rationale: Le participe décrit explicitement l’action de jouer de l’instrument, sans exiger l’ajout interprétatif de « pincer » ou de « faire de la musique ».
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: de leurs harpes
  rationale: « Jouer de » est la construction idiomatique française. Le pluriel distributif conserve l’idée que les musiciens jouent chacun de leur instrument.
theological_decisions:
- issue: Nature du phénomène sonore céleste
  choice: Traduire φωνή par « bruit » dans tout le verset.
  alternative: Traduire φωνή par « voix », ou alterner entre « voix », « son » et « bruit ».
  rationale: Les comparaisons avec les eaux, le tonnerre et les instruments soulignent un phénomène acoustique sans identifier explicitement un locuteur. « Bruit » évite d’introduire une voix personnelle que le verset ne précise pas, tandis qu’une note maintient l’ambiguïté lexicale réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve les comparaisons en cascade et la répétition de φωνή, tout en variant légèrement les constructions comparatives pour obtenir une syntaxe française fluide. Les termes traditionnels « grandes eaux » et « harpes » maintiennent les résonances bibliques, avec notes explicatives pour éviter l’anachronisme ou la surinterprétation.
