review_pass:
  verdict: revise
  source_fidelity: La proposition « ils se tiennent devant le trône » ajoute une nuance posturale qui n’est pas exprimée par εἰσιν (« ils sont »). Le reste rend fidèlement le lien inférentiel, le service cultuel continu dans le temple et le titre divin. Pour σκηνώσει ἐπ’ αὐτούς, l’image de la tente et la relation « au-dessus d’eux » doivent être conservées sans suggérer qu’une tente est littéralement posée sur eux.
  naturalness: « Ils sont devant le trône » est à la fois plus direct et plus exact. « Dressera sa tente sur eux » est compréhensible, mais sonne en français comme si la tente était dressée sur leurs personnes; « étendra sa tente au-dessus d’eux » conserve l’image tout en étant naturel et clair.
  terminology: « Rendent un culte » convient très bien à λατρεύουσιν dans le cadre du ναός et conserve la portée de service sacré. « Temple » est approprié. La note maintient les possibilités lexicales sans imposer une interprétation doctrinale.
  issues:
  - severity: medium
    issue: « se tiennent devant » traduit εἰσιν de manière trop spécifique.
    rationale: Le grec dit simplement qu’ils « sont » devant le trône; il n’énonce pas explicitement l’action ou la posture de se tenir debout.
  - severity: medium
    issue: « dressera sa tente sur eux » est une formulation française maladroite et potentiellement concrétisante.
    rationale: σκηνώσει ἐπ’ αὐτούς évoque le fait de dresser/étendre sa tente au-dessus d’eux, avec des connotations de présence et de protection. « Au-dessus d’eux » rend mieux ἐπί en français.
  revised_text: C’est pourquoi ils sont devant le trône de Dieu et lui rendent un culte jour et nuit dans son temple. Celui qui siège sur le trône étendra sa tente au-dessus d’eux[a].
  revised_footnotes:
  - marker: a
    text: Ou « habitera au-dessus d’eux » ou « les abritera ». Le verbe grec évoque l’image d’une tente ou du tabernacle.
    reason: lexical_alternative
  revision_rationale: La révision retire l’ajout postural de « se tiennent » et remplace « sur eux » par « au-dessus d’eux », afin de rendre plus exactement et plus naturellement l’image grecque de σκηνώσει ἐπ’ αὐτούς. La note conserve les alternatives de sens — habitation et protection — tout en préservant dans le texte l’imagerie de la tente.
