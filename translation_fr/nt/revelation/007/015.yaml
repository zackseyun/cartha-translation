id: REV.7.15
reference: Revelation 7:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: fr
  text: C’est pourquoi ils sont devant le trône de Dieu et lui rendent un culte jour et nuit dans son temple. Celui qui siège sur le trône étendra sa tente au-dessus d’eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « habitera au-dessus d’eux » ou « les abritera ». Le verbe grec évoque l’image d’une tente ou du tabernacle.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: C’est pourquoi
  rationale: Cette tournure renvoie naturellement à l’explication précédente et conserve le lien causal ou inférentiel explicite.
- source_word: ἐνώπιον
  choice: devant
  rationale: « Devant » exprime avec concision la position et la présence auprès du trône de Dieu.
- source_word: λατρεύουσιν
  choice: lui rendent un culte
  rationale: Dans ce cadre cultuel et céleste, λατρεύω désigne un service religieux rendu à Dieu. Cette expression évite que le simple verbe « servir » soit compris comme une activité profane.
- source_word: ἡμέρας καὶ νυκτός
  choice: jour et nuit
  rationale: La formulation française conserve l’image claire d’un culte incessant.
- source_word: ναῷ
  choice: temple
  rationale: ναός désigne le temple ou sanctuaire proprement dit. « Temple » est ici le terme courant et le contexte indique sa dimension céleste.
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: celui qui siège sur le trône
  rationale: Cette formulation naturelle et digne préserve la valeur de titre du participe grec.
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: dressera sa tente sur eux
  rationale: Ce choix maintient l’image de la tente ou du tabernacle ainsi que la préposition « sur », tout en évoquant sans l’expliciter excessivement la présence protectrice de Dieu.
theological_decisions:
- issue: Image de la présence divine dans σκηνώσει ἐπ’ αὐτούς
  choice: dressera sa tente sur eux
  alternative: habitera au-dessus d’eux ; les abritera
  rationale: 'La traduction retenue conserve l’image biblique de la tente associée à la présence divine et laisse subsister sa richesse sémantique : habitation, proximité et protection. Elle évite de réduire l’expression soit à la seule résidence, soit au seul abri.'
translation_notes:
  register: Français international moderne, clair et digne. « Rendre un culte » explicite la portée sacrée de λατρεύω ; « dressera sa tente sur eux » préserve une métaphore inhabituelle mais importante, éclairée par la note.
