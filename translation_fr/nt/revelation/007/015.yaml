revisions:
- from: C’est pourquoi ils se tiennent devant le trône de Dieu et lui rendent un culte jour et nuit dans son temple. Et celui qui siège sur le trône dressera sa tente sur eux[a].
  to: C’est pourquoi ils sont devant le trône de Dieu et lui rendent un culte jour et nuit dans son temple. Celui qui siège sur le trône étendra sa tente au-dessus d’eux[a].
  rationale: La révision retire l’ajout postural de « se tiennent » et remplace « sur eux » par « au-dessus d’eux », afin de rendre plus exactement et plus naturellement l’image grecque de σκηνώσει ἐπ’ αὐτούς. La note conserve les alternatives de sens — habitation et protection — tout en préservant dans le texte l’imagerie de la tente.
  reviewer_model: gpt-5.6-terra
