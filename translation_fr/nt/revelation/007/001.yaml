id: REV.7.1
reference: Revelation 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: fr
  text: Après cela[a], je vis quatre anges debout aux quatre coins de la terre[b]. Ils retenaient les quatre vents de la terre, afin qu’aucun vent ne souffle sur la terre, ni sur la mer, ni sur aucun arbre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Après ces choses, je vis. »'
    reason: lexical_alternative
  - marker: b
    text: « Les quatre coins de la terre » est une expression conventionnelle désignant les extrémités de la terre ou les quatre directions.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Après cela
  rationale: Cette formule marque la succession dans le récit visionnaire. « Après cela » est naturel en français moderne, tandis que « Après ces choses » reproduirait plus formellement la tournure grecque.
- source_word: εἶδον
  choice: je vis
  rationale: L’aoriste de ὁράω rapporte simplement la perception visionnaire de Jean, sans exiger un ajout tel que « je regardai ».
- source_word: τέσσαρας ἀγγέλους
  choice: quatre anges
  rationale: Traduction directe du numéral et du nom.
- source_word: ἑστῶτας
  choice: debout
  rationale: Le participe parfait décrit les anges dans l’état d’être debout. « Placés » ou « postés » préciserait leur fonction au-delà de ce qu’exprime le mot grec.
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: aux quatre coins de la terre
  rationale: Cette expression imagée conventionnelle désigne les extrémités ou les quatre directions du monde. La préposition contractée « aux » est idiomatique en français.
- source_word: κρατοῦντας
  choice: retenaient
  rationale: Dans ce contexte, κρατέω indique que les anges empêchent les vents de souffler. « Retenaient » exprime clairement cette contrainte sans surinterprétation.
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: les quatre vents de la terre
  rationale: La formulation conserve l’image apocalyptique des vents venant des quatre directions.
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: afin qu’aucun vent ne souffle
  rationale: ἵνα suivi du subjonctif exprime ici le but. En français, « aucun vent » rend naturellement la portée négative et générique du singulier ἄνεμος.
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: sur la terre, ni sur la mer, ni sur aucun arbre
  rationale: La coordination négative μήτε… μήτε est rendue par « ni… ni ». « Aucun arbre » restitue la valeur distributive de πᾶν δένδρον.
theological_decisions:
- issue: Portée de γῆ dans la vision apocalyptique
  choice: terre
  alternative: pays / territoire
  rationale: Les quatre coins, les quatre vents, la terre, la mer et tout arbre composent une scène d’ampleur cosmique. « Pays » ou « territoire » en réduirait indûment la portée.
- issue: Nature de l’expression cosmologique « les quatre coins de la terre »
  choice: Conservation littérale de l’image
  alternative: les quatre extrémités de la terre / les quatre directions
  rationale: La formule appartient au langage imagé conventionnel de la vision. La conserver respecte la force du texte sans transformer l’expression en affirmation scientifique ni l’aplanir par une paraphrase.
translation_notes:
  register: Français international moderne, clair et digne. La phrase grecque, longue, est divisée après « terre » afin d’améliorer la lisibilité sans modifier les relations syntaxiques. L’imagerie apocalyptique est conservée, et les répétitions de « terre » et de « vents » sont maintenues.
