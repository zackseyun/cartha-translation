id: REV.7.13
reference: Revelation 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: fr
  text: 'Alors l’un des anciens prit la parole et me dit : « Ceux qui sont vêtus de robes blanches, qui sont-ils et d’où sont-ils venus ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Alors
  rationale: Marque naturellement en français la progression du récit visionnaire, sans alourdir la phrase par un simple « Et ».
- source_word: ἀπεκρίθη
  choice: prit la parole
  rationale: Le verbe grec peut introduire une intervention même lorsqu’aucune question explicite ne précède. « Prit la parole » est naturel en français et évite de suggérer à tort qu’il répond à une question formulée.
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: l’un des anciens
  rationale: Rend directement et naturellement la construction partitive ainsi que le titre du groupe.
- source_word: λέγων μοι
  choice: et me dit
  rationale: Reformulation idiomatique du participe grec, tout en conservant explicitement le destinataire.
- source_word: Οὗτοι οἱ περιβεβλημένοι
  choice: Ceux qui sont vêtus
  rationale: Le participe parfait décrit l’état présent résultant du fait d’avoir revêtu les robes. Cette formulation garde ce sens statif dans un français digne et courant.
- source_word: τὰς στολὰς τὰς λευκὰς
  choice: de robes blanches
  rationale: στολή désigne ici une robe ou un long vêtement; « robes blanches » préserve l’image récurrente de l’Apocalypse.
- source_word: τίνες εἰσὶν
  choice: qui sont-ils
  rationale: Formulation interrogative française naturelle, avec reprise pronominale du groupe placé en tête.
- source_word: πόθεν ἦλθον
  choice: d’où sont-ils venus
  rationale: Rend l’origine demandée par πόθεν et l’aoriste ἦλθον par un passé composé, temps naturel en français moderne pour une venue passée pertinente dans la scène présente.
theological_decisions:
- issue: Valeur temporelle et aspectuelle de ἦλθον
  choice: « d’où sont-ils venus ? » au passé composé
  alternative: « d’où venaient-ils ? » ou « d’où vinrent-ils ? »
  rationale: Le passé composé exprime naturellement en français une venue accomplie dont le résultat demeure pertinent dans la vision. L’imparfait modifierait l’aspect, tandis que le passé simple serait littéraire et moins courant. Ce choix n’impose aucune interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « prit la parole et me dit » restitue l’idiome sémitisant/biblique ἀπεκρίθη… λέγων sans donner l’impression artificielle d’une réponse à une question immédiatement précédente. Aucun appel de note n’est nécessaire, puisque le passé composé est la formulation française normale et ne crée pas la même alternative stylistique que l’anglais.
