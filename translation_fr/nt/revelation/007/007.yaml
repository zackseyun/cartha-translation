  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: fr
  text: de la tribu de Siméon, douze mille ; de la tribu de Lévi, douze mille ; de la tribu d’Issacar, douze mille.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: de
  rationale: Dans cette formule d’énumération, « de » exprime naturellement en français la provenance ou l’appartenance, tout en conservant la répétition du grec.
- source_word: φυλῆς
  choice: tribu
  rationale: Dans le contexte généalogique d’Israël, φυλή désigne une division tribale ; « tribu » est l’équivalent français établi et précis.
- source_word: Συμεὼν
  choice: Siméon
  rationale: Forme française usuelle du nom biblique.
- source_word: δώδεκα χιλιάδες
  choice: douze mille
  rationale: Le nombre est écrit en toutes lettres pour préserver le caractère littéraire et la cadence de l’énumération.
- source_word: Λευὶ
  choice: Lévi
  rationale: Forme française usuelle du nom biblique ; son inclusion explicite dans le grec est conservée sans ajout explicatif.
- source_word: Ἰσσαχὰρ
  choice: Issacar
  rationale: Forme française moderne courante du nom biblique.
theological_decisions:
- issue: Syntaxe répétitive de la liste des tribus
  choice: Conserver pour chaque tribu la formule répétée « de la tribu de…, douze mille »
  alternative: Résumer par « des tribus de Siméon, de Lévi et d’Issacar, douze mille de chacune »
  rationale: Le grec répète intégralement la formule pour chaque tribu. Cette cadence appartient à l’énumération apocalyptique et ne doit pas être lissée.
- issue: Inclusion de Lévi dans l’énumération tribale
  choice: Nommer simplement Lévi dans le texte
  alternative: Ajouter une explication sur le caractère inhabituel de sa présence dans certaines listes tribales
  rationale: Le verset inclut explicitement Lévi sans commentaire. Une explication dans le texte principal introduirait une interprétation absente de la source.
translation_notes:
  register: 'Français international moderne, naturel et digne. La structure répétitive et les points-virgules rendent la cadence solennelle de la liste grecque. Aucune note n’est nécessaire : « de la tribu de » rend adéquatement ἐκ φυλῆς sans perte significative.'
