id: REV.7.6
reference: Revelation 7:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ἀσὴρ δώδεκα χιλιάδες, ἐκ φυλῆς Νεφθαλὶμ δώδεκα χιλιάδες, ἐκ φυλῆς Μανασσῆ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: fr
  text: de la tribu d’Aser[a], douze mille ; de la tribu de Nephtali, douze mille ; de la tribu de Manassé, douze mille ;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en explicitant ce que le contexte sous-entend : « de la tribu d’Aser, douze mille furent marqués du sceau » (de même pour les tribus suivantes). Le grec de ce verset ne répète pas le verbe.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: de
  rationale: 'La préposition indique ici l’origine ou l’appartenance : les personnes comptées viennent de chacune des tribus. Dans cette formule d’énumération, « de la tribu de » est naturel et précis en français.'
- source_word: φυλῆς
  choice: tribu
  rationale: Dans ce contexte généalogique israélite, φυλή désigne une division tribale d’Israël ; « tribu » est l’équivalent français courant et exact.
- source_word: Ἀσὴρ
  choice: Aser
  rationale: Forme française biblique usuelle du nom de la tribu, avec la graphie moderne sans accent circonflexe.
- source_word: δώδεκα χιλιάδες
  choice: douze mille
  rationale: Le nombre est rendu directement. Aucun verbe tel que « furent marqués du sceau » n’est ajouté, puisqu’il n’est pas répété dans le grec de ce verset.
- source_word: Νεφθαλὶμ
  choice: Nephtali
  rationale: Forme française traditionnelle et largement reconnue du nom de la tribu.
- source_word: Μανασσῆ
  choice: Manassé
  rationale: Forme française standard du nom propre.
theological_decisions:
- issue: Faut-il restituer un verbe sous-entendu, tel que « furent marqués du sceau », à partir du contexte ?
  choice: Ne pas ajouter de verbe dans le texte principal et conserver l’énumération nominale du grec.
  alternative: « de la tribu d’Aser, douze mille furent marqués du sceau ; de la tribu de Nephtali, douze mille ; de la tribu de Manassé, douze mille »
  rationale: Le scellement gouverne la liste dans le contexte précédent, mais le grec de ce verset ne répète aucun verbe. La formulation concise préserve donc la structure et l’implicite du texte source sans les expliciter silencieusement.
translation_notes:
  register: Français moderne, sobre et digne. La ponctuation en points-virgules maintient le rythme de la liste. Les noms propres suivent leurs formes françaises bibliques courantes, et la syntaxe volontairement elliptique reflète celle du grec tout en restant intelligible.
