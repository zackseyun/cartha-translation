id: REV.7.11
reference: Revelation 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: fr
  text: Tous les anges se tenaient autour du trône, des anciens et des quatre êtres vivants[a]. Ils tombèrent face contre terre devant le trône et adorèrent Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quatre créatures vivantes ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: tous les anges
  rationale: Rend directement le groupe nominal grec et emploie le terme français courant pour les ἄγγελοι dans l’Apocalypse.
- source_word: εἱστήκεισαν
  choice: se tenaient
  rationale: Le plus-que-parfait grec a ici une valeur stative; « se tenaient » exprime naturellement leur posture continue.
- source_word: κύκλῳ
  choice: autour de
  rationale: Avec le génitif, le terme indique une disposition spatiale autour du trône et des autres figures mentionnées.
- source_word: τῶν πρεσβυτέρων
  choice: des anciens
  rationale: « Les anciens » est la désignation française établie de ce groupe céleste dans l’Apocalypse.
- source_word: τῶν τεσσάρων ζῴων
  choice: des quatre êtres vivants
  rationale: Cette formulation évite la connotation animale que peut avoir « créatures » en français tout en conservant le caractère vivant et non précisément identifié de ces figures.
- source_word: ἔπεσαν … ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: tombèrent face contre terre
  rationale: Rend de manière idiomatique et précise l’acte de tomber sur leur visage en signe de prosternation.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: devant le trône
  rationale: Équivalent spatial naturel de ἐνώπιον dans ce contexte.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: adorèrent Dieu
  rationale: Puisque Dieu est l’objet explicite et que la prosternation physique vient déjà d’être décrite, « adorèrent » transmet le sens cultuel du verbe sans redondance.
theological_decisions:
- issue: Désignation des ζῷα de la salle du trône
  choice: êtres vivants
  alternative: créatures vivantes
  rationale: « Êtres vivants » préserve l’indétermination de l’image apocalyptique sans les réduire à des animaux ni préciser leur identité théologique.
- issue: Portée de προσκυνέω lorsque Dieu en est l’objet
  choice: adorèrent Dieu
  alternative: se prosternèrent devant Dieu
  rationale: La proposition précédente exprime déjà la posture corporelle; ici, le contexte et l’objet divin justifient le sens explicite d’adoration.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est divisée en deux pour alléger la coordination grecque sans modifier la progression narrative; le point remplace la virgule finale du fragment fourni.
