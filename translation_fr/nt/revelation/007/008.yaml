  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: fr
  text: de la tribu de Zabulon, douze mille ; de la tribu de Joseph, douze mille ; de la tribu de Benjamin, douze mille, marqués d’un sceau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ayant été marqués d’un sceau » ou « scellés ». Le participe grec, placé à la fin, récapitule les groupes énumérés.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: de
  rationale: Dans la formule répétée ἐκ φυλῆς, « de » indique naturellement en français l’origine ou l’appartenance.
- source_word: φυλῆς
  choice: tribu
  rationale: Dans cette liste d’Israël, φυλή désigne une division tribale ; « tribu » est l’équivalent français établi et précis.
- source_word: Ζαβουλών
  choice: Zabulon
  rationale: Forme française traditionnelle et courante du nom de la tribu.
- source_word: δώδεκα χιλιάδες
  choice: douze mille
  rationale: Rendu numérique direct qui conserve le compte et la structure répétitive du grec.
- source_word: Ἰωσήφ
  choice: Joseph
  rationale: Le texte nomme explicitement Joseph ; cette désignation est conservée sans la remplacer par Éphraïm ou Manassé.
- source_word: Βενιαμίν
  choice: Benjamin
  rationale: Forme française conventionnelle du nom propre et tribal.
- source_word: ἐσφραγισμένοι
  choice: qui avaient été marqués d’un sceau
  rationale: Cette formulation rend le participe parfait passif, son état résultant et son application récapitulative aux groupes énumérés, tout en restant claire en français moderne.
theological_decisions:
- issue: Référent et valeur du participe final ἐσφραγισμένοι
  choice: Le rendre à la fin par « qui avaient été marqués d’un sceau », comme une caractérisation récapitulative des groupes énumérés.
  alternative: « ayant été marqués d’un sceau » ou « scellés »
  rationale: La place finale et la portée récapitulative du grec sont préservées. Le passif est maintenu sans préciser qui appose le sceau ni expliquer davantage la nature de ce marquage.
translation_notes:
  register: Français international moderne, digne et lisible. La répétition de « de la tribu de… douze mille » reproduit la cadence de la liste grecque ; les points-virgules en clarifient les unités.
