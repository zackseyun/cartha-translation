id: REV.7.2
reference: Revelation 7:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: fr
  text: 'Et je vis un autre ange qui montait de l’est[a], tenant le sceau du Dieu vivant. Il cria d’une voix forte aux quatre anges auxquels il avait été donné de nuire à la terre et à la mer :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « du lever du soleil ».'
    reason: L’expression grecque désigne l’est tout en conservant l’image du soleil qui se lève.
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: un autre ange
  rationale: Rend naturellement l’idée d’un ange supplémentaire, distinct des quatre anges déjà mentionnés.
- source_word: ἀναβαίνοντα
  choice: monter
  rationale: Conserve le mouvement ascendant du participe grec dans une formulation française simple et naturelle.
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: du côté de l’est
  rationale: Exprime clairement la valeur directionnelle de l’expression; l’image littérale du lever du soleil est conservée en note.
- source_word: ἔχοντα σφραγῖδα
  choice: Il tenait le sceau
  rationale: Dans cette scène où le sceau sera employé pour marquer les serviteurs de Dieu, «tenait» rend naturellement la possession concrète sans préciser davantage le geste.
- source_word: θεοῦ ζῶντος
  choice: du Dieu vivant
  rationale: Formulation française consacrée et exacte, qui préserve la force théologique de l’épithète.
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: cria d’une voix forte
  rationale: Reproduit l’intensité du verbe et de l’expression instrumentale dans un français digne et idiomatique.
- source_word: οἷς ἐδόθη αὐτοῖς ἀδικῆσαι
  choice: à qui il avait été donné de faire du mal
  rationale: Suit étroitement le passif grec sans ajouter «pouvoir» ni nommer celui qui accorde cette capacité ou permission.
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: la terre et la mer
  rationale: Préserve la portée cosmique probable de γῆ dans son association avec la mer.
theological_decisions:
- issue: Nature de ce qui est accordé par ἐδόθη
  choice: «à qui il avait été donné de faire du mal»
  alternative: «qui avaient reçu le pouvoir de faire du mal»
  rationale: Le grec emploie un passif sans complément exprimant ce qui est donné. La traduction retenue préserve cette formulation et l’ambiguïté entre autorisation et pouvoir délégué, sans préciser explicitement le donateur.
- issue: Valeur de ἀπὸ ἀνατολῆς ἡλίου
  choice: «du côté de l’est» dans le texte
  alternative: «du lever du soleil»
  rationale: Le texte principal communique le sens directionnel en français moderne, tandis que la note maintient accessible l’image grecque.
translation_notes:
  register: Français international moderne, clair et digne. La phrase est ponctuée par deux-points parce que le cri de l’ange introduit directement les paroles du verset suivant. Le pronom «Il» évite une longue coordination tout en gardant nettement le même sujet.
