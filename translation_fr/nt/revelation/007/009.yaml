id: REV.7.9
reference: Revelation 7:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: fr
  text: 'Après cela, je regardai, et voici : une foule immense que personne ne pouvait compter, de toute nation, de toutes tribus, de tous peuples et de toutes langues. Ils se tenaient devant le trône et devant l’Agneau, vêtus de robes blanches, des palmes dans leurs mains.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Cette tournure française naturelle marque la succession des visions tout en reflétant le démonstratif pluriel grec employé comme expression idiomatique.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: je regardai, et voici
  rationale: « Je regardai » introduit naturellement la nouvelle scène visionnaire, tandis que « voici » conserve la fonction d’appel à l’attention de ἰδού.
- source_word: ὄχλος πολύς
  choice: une foule immense
  rationale: « Foule » rend clairement ὄχλος, et « immense » exprime l’ampleur soulignée par la proposition suivante sans ajouter l’idée plus technique de multitude.
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: que personne ne pouvait compter
  rationale: Formulation française directe qui conserve l’incapacité exprimée par οὐδεὶς ἐδύνατο.
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: de toute nation, de toutes tribus, de tous peuples et de toutes langues
  rationale: La traduction préserve le passage du singulier ἔθνους aux pluriels φυλῶν, λαῶν et γλωσσῶν, tout en rendant clairement la portée distributive de παντός dans un français naturel.
- source_word: ἑστῶτες
  choice: Ils se tenaient
  rationale: Une proposition autonome résout naturellement en français la rupture d’accord présente dans la construction grecque et identifie la foule comme sujet sans modifier le contenu.
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: devant le trône et devant l’Agneau
  rationale: La répétition de « devant » reproduit la cadence et l’insistance du double ἐνώπιον.
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: vêtus de robes blanches
  rationale: « Vêtus de » rend le participe parfait, et « robes » convient aux vêtements longs désignés par στολάς.
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: des branches de palmier à la main
  rationale: Dans ce contexte, φοίνικες désigne des palmes ou branches de palmier; l’expression française est concise et conserve l’image sans préciser une action absente du grec.
theological_decisions:
- issue: Valeur christologique de ἀρνίον
  choice: l’Agneau
  alternative: le petit agneau
  rationale: Dans l’Apocalypse, ἀρνίον fonctionne comme un titre christologique établi. « L’Agneau » en conserve la reconnaissance et la dignité sans imposer en français une nuance diminutive peu naturelle.
translation_notes:
  register: Français international moderne, clair et digne. Le rythme visionnaire est conservé par « je regardai, et voici », tandis que la longue phrase grecque est divisée après l’énumération afin d’éviter une construction française lourde. Le passé simple convient au registre narratif solennel de l’Apocalypse sans être archaïque.
