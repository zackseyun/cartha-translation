  source_fidelity: 'Le texte rend fidèlement la structure et les principaux choix lexicaux du grec : l’adresse respectueuse à l’ancien, l’emphase de σὺ, le participe présent « ceux qui sortent », les deux actions achevées sur les robes, et l’image volontairement paradoxale de leur blanchiment « dans le sang de l’Agneau ». « Je lui ai répondu » est contextuellement recevable dans cet échange, même si εἴρηκα signifie littéralement « j’ai dit ».'
