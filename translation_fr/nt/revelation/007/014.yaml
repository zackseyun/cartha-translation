id: REV.7.14
reference: Revelation 7:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: fr
  text: 'Je lui ai répondu : « Mon seigneur, c’est toi qui le sais. » Il m’a dit : « Ce sont ceux qui sortent de la grande détresse[a]. Ils ont lavé leurs robes et les ont blanchies dans le sang de l’Agneau[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « de la grande tribulation » ou « de la grande affliction ». Le terme grec peut désigner la pression, la détresse, l’affliction ou la tribulation.'
    reason: lexical_alternative
  - marker: b
    text: 'L’expression « dans le sang de l’Agneau » est maintenue intentionnellement. Le grec peut aussi être compris au sens instrumental : « par le sang », mais « dans » préserve l’image paradoxale de purification propre à l’Apocalypse.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: je lui ai répondu
  rationale: Bien que la forme grecque soit un parfait, elle introduit ici la réponse de Jean dans un échange. Le passé composé est naturel en français moderne, et « répondu » explicite sans surinterprétation la fonction contextuelle de la parole.
- source_word: Κύριέ μου
  choice: Mon seigneur
  rationale: Jean s’adresse à l’un des anciens célestes, non explicitement à Dieu ou au Messie. La minuscule évite d’identifier le destinataire au Seigneur tout en conservant la déférence de l’adresse grecque.
- source_word: σὺ οἶδας
  choice: c’est toi qui le sais
  rationale: La tournure française rend l’insistance portée par le pronom grec explicite σὺ et exprime la reconnaissance déférente du savoir de l’ancien.
- source_word: οἱ ἐρχόμενοι
  choice: ceux qui sortent
  rationale: Le présent conserve l’aspect en cours ou caractéristique du participe grec, sans transformer la scène en action simplement passée.
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: de la grande détresse
  rationale: « Détresse » rend naturellement en français moderne la pression et la souffrance exprimées par θλῖψις. L’article et l’adjectif sont conservés, sans imposer une lecture eschatologique particulière.
- source_word: ἔπλυναν τὰς στολὰς αὐτῶν
  choice: ils ont lavé leurs robes
  rationale: Le passé composé présente l’action comme accomplie. « Robes » convient aux vêtements longs et solennels désignés par στολαί dans la vision.
- source_word: ἐλεύκαναν αὐτάς
  choice: les ont blanchies
  rationale: Le verbe français conserve le sens causatif de « rendre blanc », et le pronom féminin reprend clairement « robes ».
- source_word: ἐν τῷ αἵματι τοῦ ἀρνίου
  choice: dans le sang de l’Agneau
  rationale: « Dans » suit la valeur spatiale de ἐν et préserve l’image paradoxale de vêtements blanchis dans le sang. La majuscule à « Agneau » signale son emploi comme titre christologique dans l’Apocalypse.
theological_decisions:
- issue: Sens de « la grande détresse »
  choice: la grande détresse
  alternative: la grande tribulation ; la grande affliction
  rationale: La formulation reste lexicale et ne décide pas si l’expression désigne exclusivement une période eschatologique déterminée, l’ensemble des souffrances des fidèles, ou une réalité qui comprend les deux.
- issue: Valeur de ἐν dans l’image du sang
  choice: dans le sang de l’Agneau
  alternative: par le sang de l’Agneau ; avec le sang de l’Agneau
  rationale: « Dans » conserve la formulation grecque et son paradoxe visuel. Une valeur instrumentale demeure possible et est signalée en note, sans effacer l’image.
- issue: Titre κύριος adressé à l’ancien
  choice: Mon seigneur
  alternative: Mon Seigneur ; Monsieur
  rationale: La minuscule maintient une adresse honorifique élevée sans attribuer à l’ancien une identité divine ou christologique ; « Monsieur » affaiblirait excessivement le registre de la scène.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé évite un registre inutilement littéraire, tandis que « Mon seigneur » et le rythme direct du dialogue conservent la solennité de la vision. Les marqueurs [a] et [b] sont placés immédiatement après les expressions qu’ils expliquent.
