  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Jean entend le total des personnes ayant reçu le sceau, soit 144 000, provenant de l’ensemble des tribus d’Israël. Toutefois, « marqués d’un sceau » explicite le verbe grec σφραγίζω par un nom indéfini absent du texte et affaiblit la répétition lexicale directe. « Scellés » est le rendu français biblique et sémantiquement précis du parfait passif. La formulation révisée rend également plus nettement la distribution de πάσης φυλῆς (« chaque tribu »).'
  naturalness: Le passé simple (« j’entendis ») convient au récit visionnaire. « Scellés » est naturel dans le registre biblique moderne et ne se réduit pas, dans ce contexte, au sens matériel de fermeture hermétique. « Issus de chaque tribu » est fluide et explicite sans imposer une interprétation du nombre.
  terminology: « Fils d’Israël » préserve le masculin généalogique de υἱῶν et convient au contexte de la liste tribale qui suit. La note alternative « enfants d’Israël » est appropriée. Le double emploi de « scellés » reflète la répétition de ἐσφραγισμένων / ἐσφραγισμένοι.
  issues:
  - severity: low
    issue: « Marqués d’un sceau » au lieu de « scellés »
    rationale: Le grec emploie deux fois le même participe du verbe σφραγίζω, sans nom correspondant à « un sceau ». « Scellés » est un équivalent français direct, établi et plus fidèle à la répétition source.
  - severity: low
    issue: « De toutes les tribus » rend moins explicitement le singulier distributif πάσης φυλῆς
    rationale: La formulation française est défendable, mais « de chaque tribu » reproduit plus précisément la portée distributive du grec.
