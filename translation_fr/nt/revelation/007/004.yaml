- from: 'Et j’entendis le nombre de ceux qui avaient été marqués d’un sceau : cent quarante-quatre mille, marqués d’un sceau, de toutes les tribus des fils d’Israël[a].'
  to: 'Et j’entendis le nombre de ceux qui avaient été scellés : cent quarante-quatre mille, scellés, issus de chaque tribu des fils d’Israël[a].'
  rationale: La révision remplace une paraphrase nominale par le verbe français direct « sceller », afin de préserver la répétition du grec et la valeur résultative du parfait passif. Elle remplace aussi « de toutes les tribus » par « de chaque tribu », qui rend plus explicitement la distribution du singulier grec. Elle ne modifie ni le nombre ni l’ambiguïté quant à sa portée littérale ou symbolique.
