source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: fr
  text: 'Et j’entendis le nombre de ceux qui avaient été scellés : cent quarante-quatre mille, scellés, issus de chaque tribu des fils d’Israël[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des enfants d’Israël ». Le grec dit littéralement « des fils d’Israël » et conserve une formulation masculine de filiation généalogique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: j’entendis
  rationale: L’aoriste indicatif de ἀκούω rapporte simplement, dans le récit, ce que Jean entendit. Le passé simple convient au registre narratif soutenu de l’Apocalypse.
- source_word: ἀριθμὸν
  choice: le nombre
  rationale: « Le nombre » est le correspondant naturel de ἀριθμός et désigne ici le total annoncé.
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: de ceux qui avaient été marqués d’un sceau / marqués d’un sceau
  rationale: Le participe parfait passif exprime une action accomplie dont l’effet demeure. « Avaient été marqués d’un sceau » rend cette antériorité et cet état résultant; la seconde occurrence, plus concise, conserve la répétition grecque.
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: cent quarante-quatre mille
  rationale: Formulation numérique française standard, sans article ajouté.
- source_word: ἐκ
  choice: de
  rationale: Dans cette construction, « de » exprime naturellement la provenance ou l’extraction du groupe, là où « parmi » expliciterait davantage la relation.
- source_word: πάσης φυλῆς
  choice: de toutes les tribus
  rationale: Le singulier distributif grec signifie que les personnes marquées proviennent de chaque tribu. Le français idiomatique « de toutes les tribus » exprime ce sens collectif sans altérer la distribution.
- source_word: υἱῶν Ἰσραήλ
  choice: des fils d’Israël
  rationale: Cette formulation conserve le masculin généalogique de υἱῶν ainsi que la couleur biblique et tribale de l’expression.
theological_decisions:
- issue: Traduction de υἱῶν Ἰσραήλ dans le contexte de la liste tribale
  choice: les fils d’Israël
  alternative: les enfants d’Israël
  rationale: Le grec emploie explicitement le nom masculin υἱοί dans une formule de filiation tribale. « Fils d’Israël » préserve cette donnée sans trancher la question de l’identité eschatologique du groupe. « Enfants d’Israël » est une formulation traditionnelle possible, mais elle atténue le marquage masculin du texte source.
- issue: Portée référentielle des cent quarante-quatre mille
  choice: ne pas préciser s’il s’agit d’un nombre littéral ou symbolique
  alternative: expliciter une lecture littérale ou symbolique
  rationale: Le verset annonce le nombre sans expliquer ici sa portée. La traduction conserve cette tension apocalyptique et n’importe aucun système eschatologique.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient le ton narratif littéraire sans archaïsme excessif. « Marqués d’un sceau » rend l’image concrète de σφραγίζω et sa répétition; « scellés » a été évité, car il peut évoquer en français le fait de fermer hermétiquement plutôt que d’apposer une marque d’appartenance ou d’authentification.
