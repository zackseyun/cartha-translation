id: REV.7.10
reference: Revelation 7:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: fr
  text: 'Et ils crient d’une voix forte : « Le salut appartient[a] à notre Dieu, qui siège sur le trône, et à l’Agneau ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Le salut à notre Dieu, qui siège sur le trône, et à l’Agneau ! »'
    reason: La phrase grecque est une acclamation sans verbe; la traduction principale explicite le datif d’attribution par « appartient à ».
lexical_decisions:
- source_word: κράζουσι
  choice: ils crient
  rationale: Le présent grec donne à la scène une force vive et actuelle. « Ils crient » exprime naturellement l’intensité de κράζω sans l’affaiblir en simple verbe de parole.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Cette expression au datif indique la manière. « D’une voix forte » est idiomatique en français et conserve l’image de la voix.
- source_word: λέγοντες
  choice: ':'
  rationale: En français, les deux-points introduisent naturellement les paroles qui constituent le cri; traduire en plus le participe par « en disant » alourdirait inutilement la phrase.
- source_word: Ἡ σωτηρία
  choice: Le salut appartient
  rationale: L’acclamation grecque est sans verbe et attribue le salut à Dieu et à l’Agneau. « Le salut appartient à » en restitue clairement le sens en français moderne, tandis qu’une note conserve la formulation plus littérale.
- source_word: τῷ θεῷ ἡμῶν
  choice: à notre Dieu
  rationale: Le datif désigne celui à qui le salut est attribué.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: qui siège sur le trône
  rationale: La proposition relative rend clairement la valeur appositionnelle du participe. « Siège » convient au registre royal de la scène et reste naturel en français.
- source_word: τῷ ἀρνίῳ
  choice: à l’Agneau
  rationale: « Agneau » est le titre johannique établi pour Jésus dans l’Apocalypse; la majuscule signale son emploi titulaire sans expliciter davantage l’image.
theological_decisions:
- issue: Rapport du salut à Dieu et à l’Agneau
  choice: « Le salut appartient à notre Dieu […] et à l’Agneau »
  alternative: « Le salut à notre Dieu […] et à l’Agneau »
  rationale: La formulation retenue présente l’acclamation comme une attribution commune du salut à Dieu et à l’Agneau, sans préciser au-delà du grec la nature exacte de cette relation. La note préserve l’ambiguïté formelle de la phrase nominale originale.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « qui siège sur le trône » maintient la solennité royale, tandis que « ils crient d’une voix forte » conserve l’énergie liturgique de la scène.
