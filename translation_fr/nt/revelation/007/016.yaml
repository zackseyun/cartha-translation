id: REV.7.16
reference: Revelation 7:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: fr
  text: Ils n’auront plus faim, ils n’auront plus soif ; le soleil ne les frappera jamais[a], et aucune chaleur accablante non plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « ne tombera jamais sur eux ». Le grec emploie ici une négation particulièrement forte.'
    reason: Précision sur l’image de πέσῃ et sur la force emphatique de οὐδὲ μή.
lexical_decisions:
- source_word: πεινάσουσιν … οὐ … ἔτι
  choice: ils n’auront plus faim
  rationale: Cette formulation française naturelle exprime la cessation définitive indiquée par la négation avec ἔτι, tout en gardant l’image concrète de la faim.
- source_word: διψήσουσιν … οὐδὲ … ἔτι
  choice: ils n’auront plus soif
  rationale: La répétition de « ils n’auront plus » restitue le parallélisme grec et la seconde occurrence de ἔτι.
- source_word: οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς
  choice: ne les frappera jamais
  rationale: « Frapper » rend naturellement, à propos du soleil et de la chaleur, l’idée de tomber sur quelqu’un avec force. « Jamais » communique la négation future fortement emphatique οὐδὲ μή.
- source_word: ὁ ἥλιος
  choice: le soleil
  rationale: Équivalent direct et naturel.
- source_word: οὐδὲ πᾶν καῦμα
  choice: ni aucune chaleur accablante
  rationale: καῦμα désigne une chaleur brûlante ou intense. « Chaleur accablante » est idiomatique en français et convient à l’effet du soleil, tandis que « aucune » rend la portée totale de πᾶν sous la négation.
theological_decisions:
- issue: Allusion à Ésaïe 49.10 et langage de restauration eschatologique
  choice: Conserver les images concrètes de la faim, de la soif, du soleil et de la chaleur accablante.
  alternative: Interpréter explicitement la faim et la soif comme des aspirations spirituelles.
  rationale: Le passage reprend le langage des promesses de restauration d’Ésaïe. La traduction laisse subsister à la fois les images concrètes et leur portée théologique, sans imposer une lecture exclusivement métaphorique.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « ils n’auront plus » donne au verset un rythme solennel et reflète la structure du grec. Le point-virgule distingue les besoins supprimés des menaces extérieures écartées.
