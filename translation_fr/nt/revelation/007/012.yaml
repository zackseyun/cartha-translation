id: REV.7.12
reference: Revelation 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: fr
  text: 'Ils disaient : « Amen ! La bénédiction, la gloire, la sagesse, l’action de grâce, l’honneur, la puissance et la force soient à notre Dieu pour les siècles des siècles[a] ! Amen ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour toujours et à jamais ». Littéralement : « pour les siècles des siècles ».'
    reason: La note donne l’équivalent idiomatique de durée illimitée tout en signalant la forme littérale de l’expression grecque.
lexical_decisions:
- source_word: λέγοντες
  choice: Ils disaient
  rationale: Le participe présent actif au nominatif pluriel introduit l’acclamation. Une proposition à l’imparfait est naturelle en français narratif et exprime l’action en cours.
- source_word: Ἀμήν / ἀμήν
  choice: Amen
  rationale: Dans ce cadre liturgique et doxologique, la translittération consacrée « Amen » convient mieux que « vraiment » et encadre la louange comme en grec.
- source_word: ἡ εὐλογία
  choice: la bénédiction
  rationale: Ce choix conserve le nom et l’article de la série grecque, ainsi que l’idée d’une bénédiction attribuée à Dieu.
- source_word: ἡ δόξα
  choice: la gloire
  rationale: Équivalent usuel dans les doxologies, avec maintien de l’article pour préserver le rythme de l’énumération.
- source_word: ἡ σοφία
  choice: la sagesse
  rationale: Traduction directe qui conserve la forme nominale et l’article de la série.
- source_word: ἡ εὐχαριστία
  choice: l’action de grâce
  rationale: Expression française naturelle dans le registre biblique et cultuel, plus précise ici que « les remerciements ».
- source_word: ἡ τιμή
  choice: l’honneur
  rationale: Dans cette acclamation, le mot désigne l’honneur rendu à Dieu et non une valeur marchande.
- source_word: ἡ δύναμις
  choice: la puissance
  rationale: Équivalent courant de δύναμις, qui évoque la capacité et le pouvoir effectif.
- source_word: ἡ ἰσχύς
  choice: la force
  rationale: Le terme est distingué de δύναμις tout en conservant le parallélisme de deux notions proches.
- source_word: τῷ θεῷ ἡμῶν
  choice: soient à notre Dieu
  rationale: Le grec est sans verbe et emploie un datif d’attribution. Le verbe « soient » explicite sobrement la valeur d’acclamation sans transformer celle-ci en simple affirmation de possession.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour les siècles des siècles
  rationale: Cette formule française traditionnelle reste compréhensible, suit de près l’expression grecque et en communique la durée sans fin.
theological_decisions:
- issue: Ajout du verbe sous-entendu dans la doxologie
  choice: soient à notre Dieu
  alternative: appartiennent à notre Dieu
  rationale: Le texte grec ne comporte pas de verbe. « Soient à » préserve la portée optative ou ascriptive de la louange, tandis que « appartiennent à » la transformerait plus nettement en déclaration de possession.
- issue: Distinction entre δύναμις et ἰσχύς
  choice: la puissance et la force
  alternative: la puissance et la vigueur
  rationale: La paire française maintient deux termes distincts et proches, comme le grec, sans attribuer à chacun une différence théologique plus précise que le contexte ne l’exige.
translation_notes:
  register: Français international moderne, digne et adapté à une acclamation liturgique. La répétition des articles maintient le rythme solennel de la liste grecque. « Action de grâce » est retenu comme expression courante du registre biblique, sans archaïsme marqué.
