  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: fr
  text: de la tribu de Juda[a], douze mille furent scellés ; de la tribu de Ruben, douze mille ; de la tribu de Gad, douze mille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus littérale : « de la tribu de Juda, douze mille scellés ». Le grec emploie un participe passif (« scellés ») après le premier dénombrement tribal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: de
  rationale: Marque ici l’origine ou l’appartenance dans la formule répétée de l’énumération ; « de la tribu de » est l’expression française naturelle.
- source_word: φυλῆς
  choice: tribu
  rationale: Dans le cadre de l’organisation généalogique d’Israël, « tribu » est le terme précis et consacré ; « clan » désignerait une subdivision plus restreinte.
- source_word: Ἰούδα
  choice: Juda
  rationale: Forme française usuelle du nom de la tribu.
- source_word: δώδεκα χιλιάδες
  choice: douze mille
  rationale: Rendu numérique direct ; le français permet de laisser le groupe compté implicite dans cette énumération.
- source_word: ἐσφραγισμένοι
  choice: furent marqués d’un sceau
  rationale: Le participe passif décrit les personnes comptées. Cette formulation exprime naturellement en français l’acte de sceller tout en maintenant sa place explicite dans la première proposition seulement.
- source_word: Ῥουβὴν
  choice: Ruben
  rationale: Forme française usuelle du nom de la tribu.
- source_word: Γὰδ
  choice: Gad
  rationale: Forme française usuelle du nom de la tribu.
theological_decisions:
- issue: Valeur et portée de ἐσφραγισμένοι dans l’énumération des tribus
  choice: Exprimer le participe par « furent marqués d’un sceau » dans la première proposition et conserver l’ellipse dans les deux suivantes.
  alternative: « douze mille marqués d’un sceau » ; ou répéter « furent marqués d’un sceau » après chaque tribu.
  rationale: Le grec place le participe passif après le premier nombre. Il qualifie naturellement les personnes recensées dans l’ensemble de la liste, mais le répéter dans chaque proposition ajouterait au texte. Le verbe explicite rend le français fluide sans trancher au-delà de la syntaxe grecque.
translation_notes:
  register: Français international moderne, sobre et digne. La structure répétitive de l’énumération est conservée, ainsi que l’ellipse après la première tribu. « Marqués d’un sceau » rend l’image concrète du sceau plus clairement que le seul verbe « sceller ».
