id: REV.7.17
reference: Revelation 7:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: fr
  text: car l’Agneau qui est au milieu du trône[a] sera leur berger, et il les guidera[b] vers des sources d’eau de la vie[c] ; et Dieu essuiera toute larme de leurs yeux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au centre du trône ».
    reason: lexical_alternative
  - marker: b
    text: Ou « les conduira ».
    reason: lexical_alternative
  - marker: c
    text: Ou « vers des sources d’eau vive ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: l’Agneau
  rationale: Titre christologique établi dans l’Apocalypse ; la majuscule signale ici son emploi comme titre sans surtraduire la forme diminutive.
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: au milieu du trône
  rationale: Rend l’image spatiale centrale du grec tout en restant naturel en français ; « au centre du trône » demeure possible.
- source_word: ποιμανεῖ
  choice: sera leur berger
  rationale: 'Expression française naturelle qui conserve le paradoxe voulu : l’Agneau remplit lui-même la fonction de berger. « Les fera paître » serait plus formellement direct, mais évoquerait trop fortement l’alimentation du bétail en français courant.'
- source_word: ὁδηγήσει
  choice: il les guidera
  rationale: Rend distinctement l’idée de direction et évite de confondre ce verbe avec l’image pastorale précédente ; « les conduira » est également possible.
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: vers des sources d’eau de la vie
  rationale: « Vers » exprime naturellement le mouvement ; « sources » maintient l’image naturelle, et « eau de la vie » conserve le rapport génitif sans le réduire d’office à l’expression « eau vive ».
- source_word: ἐξαλείψει
  choice: essuiera
  rationale: Dans ce contexte de consolation, « essuiera » est l’équivalent idiomatique qui préserve le geste tendre évoqué.
- source_word: πᾶν δάκρυον
  choice: toute larme
  rationale: Le singulier distributif conserve l’accent individualisant et la totalité exprimée par le grec.
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: de leurs yeux
  rationale: Formulation idiomatique française qui restitue précisément l’origine des larmes.
theological_decisions:
- issue: Paradoxe christologique de l’Agneau berger
  choice: « l’Agneau… sera leur berger »
  alternative: « l’Agneau… prendra soin d’eux » ou « les gouvernera »
  rationale: 'La formulation retenue préserve explicitement le paradoxe propre à la vision : l’Agneau est aussi le berger. Une généralisation comme « prendra soin » ou une lecture seulement royale comme « gouvernera » en atténuerait la force.'
- issue: Sujet de la proposition finale
  choice: « Dieu essuiera toute larme de leurs yeux »
  alternative: Faire implicitement de l’Agneau le sujet de toute la phrase
  rationale: Le grec introduit explicitement ὁ θεός comme sujet du dernier verbe. La traduction maintient donc la distinction textuelle entre l’Agneau et Dieu sans développer au-delà de ce que dit le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le mouvement solennel de la vision sans archaïsmes. « Sera leur berger » privilégie une expression immédiatement compréhensible tout en maintenant l’image théologique centrale.
