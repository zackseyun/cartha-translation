id: REV.7.3
reference: Revelation 7:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: fr
  text: 'disant : « Ne faites de mal ni à la terre, ni à la mer, ni aux arbres, jusqu’à ce que nous ayons marqué du sceau les esclaves[a] de notre Dieu sur leur front. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec peut désigner des personnes qui appartiennent à un maître; « esclaves » conserve ici cette idée d’appartenance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδικήσητε
  choice: fassiez de mal
  rationale: Avec la terre, la mer et les arbres comme objets, le verbe désigne ici le fait de causer du tort ou des dégâts; « faire du mal à » reste naturel et assez large en français.
- source_word: γῆν
  choice: terre
  rationale: Dans la triade cosmique « terre, mer, arbres », « terre » convient mieux que « pays » ou « sol ».
- source_word: θάλασσαν
  choice: mer
  rationale: Équivalent français direct et naturel dans ce contexte.
- source_word: δένδρα
  choice: arbres
  rationale: Traduction directe du pluriel grec.
- source_word: ἄχρι
  choice: jusqu’à ce que
  rationale: Marque la limite temporelle de l’interdiction, laquelle demeure en vigueur jusqu’à l’accomplissement du marquage.
- source_word: σφραγίσωμεν
  choice: ayons marqué du sceau
  rationale: Le passé du subjonctif après « jusqu’à ce que » présente le marquage comme devant être accompli avant la suite; « marquer du sceau » conserve l’image du sceau et prend naturellement les personnes pour complément direct.
- source_word: δούλους
  choice: esclaves
  rationale: Le terme grec désigne des personnes appartenant à un maître. Dans cette scène où un sceau signale leur appartenance à Dieu, « esclaves » conserve cette force, malgré sa rudesse moderne.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: de notre Dieu
  rationale: Rend directement le rapport d’appartenance et maintient l’identification exprimée par « notre ».
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: sur leur front
  rationale: Formulation française naturelle qui indique précisément l’emplacement du sceau; le singulier distributif « leur front » est idiomatique.
theological_decisions:
- issue: Traduction de δοῦλος dans un contexte apocalyptique d’appartenance
  choice: esclaves
  alternative: serviteurs
  rationale: Le sceau manifeste ici que ces personnes appartiennent à Dieu. « Esclaves » préserve donc la dimension de dépendance et d’appartenance du grec, tandis que la note signale la traduction traditionnelle plus douce sans effacer la tension du texte.
translation_notes:
  register: Français international moderne, sobre et solennel. La coordination négative « ni… ni… ni… » est idiomatique. L’expression « marqué du sceau » garde l’imagerie apocalyptique sans lourdeur excessive.
