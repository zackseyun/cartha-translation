id: REV.2.16
reference: Revelation 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: fr
  text: Repens-toi donc. Sinon, je viens à toi sans tarder[a], et je leur[c] ferai la guerre avec l’épée de ma bouche[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rapidement » ou « bientôt ». Le terme grec peut souligner la proximité de la venue ou la rapidité avec laquelle elle se produira.
    reason: lexical_alternative
  - marker: b
    text: L’« épée de ma bouche » est une image apocalyptique associée à la parole judiciaire du Christ.
    reason: cross_reference
  - marker: c
    text: 'Littéralement « avec eux ». Après « faire la guerre », le contexte donne à l’expression un sens hostile : « contre eux ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετανόησον
  choice: Repens-toi
  rationale: L’impératif aoriste appelle à une repentance décisive. « Repens-toi » conserve avec concision la portée morale et spirituelle du grec.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence de la réprimande précédente et maintient clairement le lien logique dans un français naturel.
- source_word: εἰ δὲ μή
  choice: Sinon
  rationale: Rend de façon idiomatique et ferme la formule conditionnelle d’avertissement, sans alourdir la phrase.
- source_word: ἔρχομαί σοι
  choice: je viens à toi
  rationale: Le présent grec exprime une venue imminente. La traduction conserve l’adresse au singulier sans introduire ici l’idée hostile, explicitée dans la proposition suivante.
- source_word: ταχύ
  choice: sans tarder
  rationale: Expression française naturelle qui préserve l’idée de promptitude tout en laissant ouverte la nuance entre proximité temporelle et rapidité d’exécution.
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: je leur ferai la guerre
  rationale: Après πολεμέω, μετά avec le génitif a ici une valeur hostile. Cette formulation conserve la force martiale et distingue « eux » du destinataire singulier.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: avec l’épée
  rationale: Rend naturellement la valeur instrumentale de ἐν tout en préservant l’image apocalyptique.
- source_word: ῥομφαίᾳ
  choice: épée
  rationale: Bien que le terme puisse désigner une grande épée, « épée » est précis, digne et n’ajoute pas une spécification étrangère au propos.
- source_word: τοῦ στόματός μου
  choice: de ma bouche
  rationale: Reproduit le génitif et conserve sans paraphrase l’image johannique frappante.
theological_decisions:
- issue: Portée de la venue du Christ et cible de l’action hostile
  choice: La venue est adressée à l’Église au singulier (« à toi »), tandis que la guerre vise « eux ».
  alternative: Comprendre que le Christ vient indistinctement contre toute l’Église, ou qu’il ne vient qu’aux faux enseignants sans concerner l’Église.
  rationale: Le texte grec maintient cette distinction et la tension entre responsabilité collective et jugement ciblé; la traduction ne les confond pas.
- issue: Nature de l’instrument du jugement
  choice: Conserver l’image « l’épée de ma bouche ».
  alternative: Paraphraser par « ma parole » ou « la puissance de ma parole ».
  rationale: Le texte emploie une image apocalyptique délibérée. La conserver respecte sa portée littéraire et judiciaire sans en imposer une explication dans le corps du verset.
translation_notes:
  register: Français international moderne, direct et solennel. Le tutoiement singulier reflète l’adresse grecque à l’Église; « eux » préserve la distinction avec le groupe visé par la guerre. Les images et la tension théologique du texte sont maintenues.
