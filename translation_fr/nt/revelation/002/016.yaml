review_pass:
  verdict: revise
  source_fidelity: Le texte principal rend fidèlement l’impératif de repentance, l’inférence de οὖν, la venue imminente, l’image de l’épée et la distinction entre « toi » et « eux ». « Leur faire la guerre » est contextuellement justifié pour πολεμήσω μετ’ αὐτῶν. Toutefois, l’audit anglais signale explicitement l’alternative littérale « avec eux » pour μετ’ αὐτῶν ; une note ancrée sur « eux » est souhaitable afin de préserver cette donnée lexicale sans affaiblir le sens hostile imposé par le contexte.
  naturalness: Le français est naturel, direct et d’un registre solennel approprié. « Repens-toi donc », « Sinon » et « sans tarder » sont idiomatiques en français international moderne.
  terminology: « Se repentir », « faire la guerre » et « l’épée de ma bouche » conservent la force morale, martiale et apocalyptique du grec. La note sur l’épée doit rester descriptive et ne pas présenter comme une explication exhaustive le fait que la parole « exécute » le jugement.
  issues:
