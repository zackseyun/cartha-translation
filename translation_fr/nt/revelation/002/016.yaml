    issue: Absence de note sur « leur » pour μετ’ αὐτῶν
    rationale: Le grec emploie littéralement μετά avec génitif (« avec eux »), même si, après πολεμέω et dans ce contexte, le sens est adversatif (« contre eux »). L’audit anglais relève cette alternative ; une note française préserve l’ambiguïté lexicale pertinente.
  - severity: low
    issue: Formulation trop affirmative de la note sur l’épée
    rationale: « Qui prononce et exécute le jugement » développe l’image au-delà de ce que dit directement le verset. Une formulation plus sobre maintient sa portée judiciaire sans imposer une interprétation.
