id: REV.2.29
reference: Revelation 2:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: fr
  text: Que celui qui a une oreille écoute ce que l’Esprit dit aux Églises.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων
  choice: celui qui a
  rationale: L’article suivi du participe présent forme une expression substantivée. « Celui qui a » conserve le singulier et la portée proverbiale tout en restant naturel en français moderne.
- source_word: οὖς
  choice: une oreille
  rationale: Le singulier grec est conservé. Dans cette formule, « avoir une oreille » désigne la capacité et la disposition à entendre.
- source_word: ἀκουσάτω
  choice: écoute
  rationale: 'L’impératif aoriste à la troisième personne du singulier est rendu par une tournure française injonctive naturelle : « Que celui… écoute ». « Écouter » exprime ici l’attention et la réponse demandées, mieux que le simple fait d’entendre.'
- source_word: τί
  choice: ce que
  rationale: Le pronom interrogatif introduit ici le contenu des paroles de l’Esprit ; « ce que » est la formulation française idiomatique.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Dans le refrain d’Apocalypse 2–3, le terme désigne l’Esprit divin qui s’adresse aux Églises. La majuscule indique ce référent sans ajouter d’explication au texte.
- source_word: λέγει
  choice: dit
  rationale: Le présent grec exprime la parole actuelle ou caractéristique de l’Esprit. « Dit » est direct, naturel et fidèle à la formule répétée.
- source_word: ταῖς ἐκκλησίαις
  choice: aux Églises
  rationale: Dans Apocalypse 2–3, ἐκκλησίαι désigne les communautés chrétiennes destinataires. « Églises » est le terme établi et contextuellement précis ; la majuscule distingue les communautés de simples bâtiments.
theological_decisions:
- issue: Référent de « l’Esprit »
  choice: l’Esprit Saint parlant aux Églises
  alternative: un esprit humain ou l’esprit/le message de Jésus
  rationale: Le refrain répété dans Apocalypse 2–3 présente l’Esprit comme le locuteur divin qui transmet les messages à l’ensemble des Églises. La traduction « l’Esprit » préserve cette identification sans explicitation doctrinale ajoutée.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La tournure « Que celui qui… écoute » conserve l’injonction solennelle et le singulier du grec sans employer une formulation archaïque.
