id: REV.2.14
reference: Revelation 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: fr
  text: 'Mais j’ai quelques reproches à te faire : tu as là des gens qui s’en tiennent à l’enseignement de Balaam, lequel enseignait à Balak à placer devant les fils d’Israël[a] une occasion de chute, afin qu’ils mangent des aliments sacrifiés aux idoles et se livrent à l’immoralité sexuelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les enfants d’Israël » ou « les Israélites ». Le grec dit littéralement « les fils d’Israël ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: quelques reproches
  rationale: L’adjectif neutre pluriel est employé substantivement dans l’expression ἔχω κατὰ σοῦ. « Quelques reproches » explicite naturellement en français ce qui est dirigé contre le destinataire.
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: qui restent attachés à l’enseignement
  rationale: κρατέω exprime ici l’adhésion persistante à un enseignement, non une saisie physique. « Restent attachés » rend la valeur durative du participe présent.
- source_word: Βαλαάμ / Βαλὰκ
  choice: Balaam / Balak
  rationale: Formes françaises bibliques usuelles des noms propres.
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: enseignait à Balak
  rationale: L’imparfait français correspond naturellement à l’imparfait grec et conserve son aspect sans imposer une nuance plus précise.
- source_word: βαλεῖν σκάνδαλον
  choice: placer un piège
  rationale: σκάνδαλον désigne ce qui fait tomber ou incite à pécher. En français moderne, « placer un piège » conserve l’image concrète et exprime clairement la fonction du σκάνδαλον.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  rationale: Rendu formel du masculin pluriel υἱῶν et de la désignation biblique traditionnelle, avec une variante idiomatique signalée en note.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: pour qu’ils mangent des aliments sacrifiés aux idoles
  rationale: εἰδωλόθυτα désigne des aliments, notamment de la viande, offerts aux idoles. La proposition finale rend explicitement en français la fonction des infinitifs après le piège posé.
- source_word: πορνεῦσαι
  choice: se livrent à l’immoralité sexuelle
  rationale: πορνεύω couvre les conduites sexuelles illicites sans se limiter à une seule pratique. Cette formulation est actuelle, compréhensible et suffisamment large.
theological_decisions:
- issue: Rendu de τῶν υἱῶν Ἰσραήλ
  choice: les fils d’Israël
  alternative: les Israélites / les enfants d’Israël
  rationale: Le texte grec porte littéralement « les fils d’Israël ». Le texte principal conserve cette forme, tandis que la note fournit des équivalents français plus idiomatiques.
- issue: Interprétation de σκάνδαλον
  choice: un piège
  alternative: un obstacle qui fait tomber / une occasion de pécher
  rationale: « Piège » préserve une image concrète d’incitation à la chute sans réduire le terme à une explication théologique unique.
- issue: Relation des infinitifs φαγεῖν et πορνεῦσαι à σκάνδαλον
  choice: 'but ou résultat visé du piège : « pour qu’ils… »'
  alternative: 'apposition explicative : « à savoir manger… »'
  rationale: La construction indique que le piège conduit les Israélites à ces actes. « Pour qu’ils » est naturel en français tout en laissant ouverte la nuance exacte de but ou de résultat.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond au destinataire singulier σοῦ et s’inscrit dans l’adresse directe au messager de l’Église. La phrase conserve la progression accusatoire du grec tout en évitant des calques peu naturels.
