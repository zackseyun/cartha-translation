    issue: « un piège » pour σκάνδαλον
    rationale: « Piège » est une interprétation possible, mais le terme grec conserve plus précisément l’image d’un obstacle ou d’une occasion faisant tomber. « Occasion de chute » maintient l’ambiguïté métaphorique sans surinterpréter.
  - severity: low
    issue: « restent attachés » pour κρατοῦντας
    rationale: La tournure ajoute une nuance de persévérance qui n’est pas nécessairement explicitée par le participe. « s’en tiennent à » rend naturellement l’adhésion continue.
