  to: 'Mais j’ai quelques reproches à te faire : tu as là des gens qui s’en tiennent à l’enseignement de Balaam, lequel enseignait à Balak à placer devant les fils d’Israël[a] une occasion de chute, afin qu’ils mangent des aliments sacrifiés aux idoles et se livrent à l’immoralité sexuelle.'
  rationale: La révision préserve le sens et le registre du projet tout en rendant σκάνδαλον par une expression française qui garde l’image d’une cause de chute, plutôt que de la réduire à l’idée plus spécifique de piège. Elle remplace aussi une légère explicitation aspectuelle par une expression idiomatique et directe de l’adhésion à un enseignement.
