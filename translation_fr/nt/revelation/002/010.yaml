id: REV.2.10
reference: Revelation 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: fr
  text: Ne crains pas ce que tu vas souffrir. Voici que le diable va jeter certains d’entre vous en prison afin que vous soyez mis à l’épreuve[a], et vous connaîtrez la détresse pendant dix jours. Sois fidèle jusqu’à la mort[b], et je te donnerai la couronne de la vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi signifier « être tentés » ou « être éprouvés », selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: '« Jusqu’à la mort » peut aussi signifier « jusqu’au point de mourir » : reste fidèle même si cela doit te coûter la vie.'
    reason: alternative_reading
  - marker: c
    text: Le mot grec désigne la couronne remise au vainqueur, et non un diadème royal.
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: Ne crains pas
  rationale: Cette formulation rend naturellement en français moderne l’interdiction exprimée par l’impératif avec μηδέν, sans la raideur de « Ne crains rien » dans ce contexte.
- source_word: ἃ μέλλεις πάσχειν
  choice: ce que tu vas souffrir
  rationale: μέλλω avec l’infinitif signale ici un avenir imminent, et πάσχειν signifie subir ou souffrir.
- source_word: ἰδοὺ
  choice: Voici que
  rationale: Cette tournure attire l’attention sur ce qui suit tout en conservant un registre biblique digne et actuel.
- source_word: μέλλει βάλλειν
  choice: va jeter
  rationale: La construction exprime l’imminence; « jeter en prison » conserve l’image de βάλλω tout en étant idiomatique.
- source_word: ὁ διάβολος
  choice: le diable
  rationale: Dans ce contexte, διάβολος désigne l’adversaire personnel; le titre français établi convient mieux que le sens générique « calomniateur ».
- source_word: ἐξ ὑμῶν
  choice: certains d’entre vous
  rationale: La préposition indique qu’une partie du groupe est concernée, ce que cette expression française rend explicitement.
- source_word: εἰς φυλακήν
  choice: en prison
  rationale: φυλακή désigne ici l’emprisonnement ou la détention; « prison » correspond au registre et au contexte.
- source_word: ἵνα πειρασθῆτε
  choice: afin que vous soyez mis à l’épreuve
  rationale: πειράζω peut désigner l’épreuve, la mise à l’essai ou la tentation. Le contexte de persécution favorise « mis à l’épreuve », sans supprimer les autres nuances possibles.
- source_word: ἕξετε θλῖψιν
  choice: vous connaîtrez la détresse
  rationale: θλῖψις évoque une souffrance oppressante. « Connaître la détresse » est naturel, grave et accessible, sans imposer le terme technique « tribulation ».
- source_word: ἡμερῶν δέκα
  choice: pendant dix jours
  rationale: Le génitif exprime la durée; « pendant dix jours » est sa traduction française naturelle.
- source_word: γίνου πιστός
  choice: Sois fidèle
  rationale: L’impératif appelle à entrer dans une fidélité résolue et à y persévérer; la formulation française concise couvre bien ces deux aspects.
- source_word: ἄχρι θανάτου
  choice: jusqu’à la mort
  rationale: La traduction directe maintient l’ambiguïté entre la fidélité poursuivie jusqu’à la fin de la vie et la fidélité allant jusqu’à subir la mort.
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: la couronne de la vie
  rationale: La formulation conserve le génitif grec et l’image de la récompense victorieuse, sans expliciter de manière indue le rapport exact entre la couronne et la vie.
theological_decisions:
- issue: Sens de πειρασθῆτε dans le contexte de l’action du diable et de la persécution
  choice: mis à l’épreuve
  alternative: tentés, éprouvés
  rationale: L’emprisonnement et la souffrance constituent une épreuve de la fidélité des croyants. La note préserve néanmoins l’étendue sémantique du verbe, qui peut aussi inclure la tentation.
- issue: Portée de ἄχρι θανάτου
  choice: jusqu’à la mort
  alternative: jusqu’au point de mourir; même si cela doit te coûter la vie
  rationale: Le grec peut appeler à demeurer fidèle jusqu’à la fin ou jusque dans le martyre. La traduction principale ne réduit pas l’expression à une seule de ces lectures.
- issue: Relation exprimée par τῆς ζωῆς
  choice: de la vie
  alternative: couronne qui est la vie; couronne donnant la vie
  rationale: Le génitif permet plusieurs nuances. Le conserver évite de trancher inutilement entre apposition, contenu et résultat.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier de « Sois » et « je te donnerai » reflète l’adresse au messager ou au représentant de l’Église, tandis que le pluriel décrit l’expérience de la communauté. Les images fortes du grec sont conservées sans archaïsmes inutiles.
