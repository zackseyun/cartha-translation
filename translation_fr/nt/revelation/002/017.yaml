  naturalness: Le français est moderne, fluide et d’un registre biblique accessible. « Que celui qui a une oreille écoute », « À celui qui remporte la victoire » et la construction finale sont idiomatiques. La séparation en deux phrases après « manne cachée » ne modifie pas la coordination ni le sens.
  terminology: « L’Esprit », « Églises », « manne », « pierre blanche » et « nom nouveau » sont des choix établis, précis et adaptés au contexte de l’Apocalypse. « Remporte la victoire » rend νικῶν de manière naturelle; la note conserve utilement « vainc » et « triomphe ».
