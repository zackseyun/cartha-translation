id: REV.2.17
reference: Revelation 2:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: fr
  text: Que celui qui a une oreille écoute ce que l’Esprit dit aux Églises. À celui qui remporte la victoire[a], je donnerai une part de la manne cachée. Je lui donnerai aussi une pierre blanche[b], sur laquelle est écrit un nom nouveau que personne ne connaît, sauf celui qui la reçoit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à celui qui vainc »; on peut aussi traduire : « à celui qui triomphe ».'
    reason: lexical_alternative
  - marker: b
    text: La « pierre blanche » pourrait évoquer un caillou de vote, un signe d’acquittement ou un jeton donnant accès à un lieu ou à un repas; le texte ne précise pas l’arrière-plan visé.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: celui qui a une oreille
  rationale: Conserve l’idiome au singulier et la forme représentative de l’expression grecque, dans un français clair et naturel.
- source_word: ἀκουσάτω
  choice: écoute
  rationale: L’impératif introduit par « Que celui qui… » rend directement l’exhortation grecque sans l’affaiblir.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: La majuscule signale le référent divin dans la formule récurrente de l’Apocalypse, sans ajouter « Saint », absent du grec.
- source_word: ταῖς ἐκκλησίαις
  choice: aux Églises
  rationale: « Églises » est le terme courant et contextuellement approprié pour les communautés auxquelles s’adressent les messages.
- source_word: τῷ νικῶντι
  choice: À celui qui remporte la victoire
  rationale: Cette formulation exprime la valeur active et générale du participe présent νικῶν tout en restant idiomatique; la variante plus littérale « celui qui vainc » est conservée en note.
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: une part de la manne cachée
  rationale: Le génitif après « donner » indique naturellement une quantité ou une part de cette manne; « cachée » conserve l’état résultant du participe parfait.
- source_word: ψῆφον λευκήν
  choice: une pierre blanche
  rationale: Rendu sobre qui ne tranche pas entre les divers usages possibles de ψῆφος; les principales associations culturelles sont signalées en note.
- source_word: ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον
  choice: sur laquelle est écrit un nom nouveau
  rationale: Rend explicitement et naturellement en français l’emplacement de l’inscription tout en conservant le passif et le sens résultatif de γεγραμμένον.
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: que personne ne connaît, sauf celui qui la reçoit
  rationale: Le relatif « que » renvoie au nom nouveau, tandis que « la » renvoie naturellement à la pierre reçue; l’ambiguïté symbolique n’est pas résolue.
theological_decisions:
- issue: Formes masculines singulières dans l’exhortation et la promesse
  choice: Conserver « celui qui » au masculin singulier générique et éviter un pronom masculin supplémentaire lorsque le français permet une reprise claire.
  alternative: Employer une formulation plurielle ou épicène.
  rationale: Le grec présente une personne représentative au masculin singulier. La formulation française respecte ce nombre et cette structure tout en demeurant naturellement inclusive dans sa portée.
- issue: Interprétation de ψῆφος λευκή
  choice: Traduire simplement par « une pierre blanche » sans identifier sa fonction symbolique.
  alternative: Préciser qu’il s’agit d’un jeton d’acquittement, de vote ou d’admission.
  rationale: Le texte ne définit pas la fonction de cette pierre. Une traduction minimale préserve l’ouverture interprétative, tandis qu’une note présente les principaux arrière-plans proposés.
- issue: Référent de la proposition relative finale
  choice: Comprendre « que personne ne connaît » comme qualifiant le « nom nouveau », et « la reçoit » comme renvoyant à la pierre.
  alternative: Comprendre l’objet reçu comme le nom lui-même ou comme l’ensemble pierre-nom.
  rationale: Le pronom relatif grec neutre s’accorde naturellement avec ὄνομα, tandis que le participe substantivé « celui qui reçoit » laisse son objet implicite. Le français doit préciser un objet; la pierre est l’antécédent concret le plus immédiat, sans prétendre dissiper toute la portée symbolique de l’ensemble.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence solennelle de l’exhortation est conservée, avec une syntaxe française fluide. « Églises » et « Esprit » prennent une majuscule selon l’usage biblique éditorial français.
