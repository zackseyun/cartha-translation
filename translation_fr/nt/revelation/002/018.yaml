id: REV.2.18
reference: Revelation 2:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: fr
  text: '« À l’ange[a] de l’Église qui est à Thyatire, écris : Voici ce que dit le Fils de Dieu, celui qui a les yeux comme une flamme de feu et dont les pieds sont semblables à du bronze incandescent[b] : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « messager ».
    reason: alternative_reading
  - marker: b
    text: Le mot grec traduit par « bronze incandescent » est rare ; il peut désigner plus généralement un métal ou un alliage raffiné et brillant.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ange
  rationale: « Ange » est le sens habituel dans la formule répétée des messages aux sept Églises de l’Apocalypse. « Messager » reste lexicalement possible et figure donc en note.
- source_word: ἐκκλησίας
  choice: Église
  rationale: Dans ce contexte, le terme désigne la communauté chrétienne locale. « Église » est naturel en français moderne et convient à cette réalité communautaire.
- source_word: Τάδε λέγει
  choice: Voici ce que dit
  rationale: Cette formulation française naturelle conserve la solennité de la formule prophétique grecque sans produire le calque peu idiomatique « Ces choses dit ».
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Traduction directe du titre christologique explicite, sans atténuation ni paraphrase.
- source_word: ὁ ἔχων
  choice: celui qui a
  rationale: Cette tournure rend la valeur substantive du participe grec et rattache clairement la description à l’identité de celui qui parle.
- source_word: ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: les yeux comme une flamme de feu
  rationale: La comparaison et l’image apocalyptique sont conservées au plus près du grec dans un français clair.
- source_word: οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: dont les pieds sont semblables à du bronze incandescent
  rationale: « Dont » évite une coordination lourde en français. Le terme rare χαλκολίβανον semble désigner un métal ou alliage de cuivre raffiné et éclatant ; « bronze incandescent » restitue l’aspect lumineux tout en signalant l’incertitude en note.
theological_decisions:
- issue: Titre christologique dans l’auto-identification du locuteur
  choice: le Fils de Dieu
  alternative: une paraphrase fonctionnelle du titre
  rationale: Le grec donne explicitement ce titre. La traduction le maintient intégralement, sans en réduire ni en développer la portée théologique.
- issue: Référent de ἀγγέλῳ dans l’adresse à Thyatire
  choice: ange
  alternative: messager
  rationale: « Ange » correspond au sens traditionnel et au cadre apocalyptique, tandis que la note préserve la possibilité lexicale d’un messager humain sans trancher une question que le texte laisse ouverte.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Voici ce que dit » conserve le ton solennel de l’oracle, tandis que les images sont rendues sans les expliquer dans le corps du texte. Les marqueurs de note sont placés immédiatement après les termes concernés.
