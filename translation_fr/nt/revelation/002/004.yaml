source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι τὴν ἀγάπην σου τὴν πρώτην ἀφῆκες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: fr
  text: 'Mais j’ai ceci contre toi : tu as abandonné ton premier amour[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu as délaissé ton premier amour ». L’expression peut désigner l’amour que tu avais au début, que ce soit envers le Seigneur, envers les autres croyants, ou les deux.
    reason: Alternative lexicale et préservation de l’ambiguïté du référent.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Conjonction adversative qui marque un contraste net avec l’éloge précédent ; « Mais » est naturel et direct en français moderne.
- source_word: ἔχω κατὰ σοῦ
  choice: j’ai ceci contre toi
  rationale: Cette tournure conserve la force de reproche ou de grief de l’expression grecque tout en restant idiomatique en français.
- source_word: ὅτι
  choice: ': tu as'
  rationale: Les deux-points introduisent naturellement le contenu du reproche sans donner à ὅτι une valeur causale plus précise que ne l’exige le grec.
- source_word: τὴν ἀγάπην σου τὴν πρώτην
  choice: ton premier amour
  rationale: Traduction concise qui respecte l’ordre conceptuel du grec et maintient ouverte l’identité de l’objet de cet amour.
- source_word: ἀφῆκες
  choice: tu as abandonné
  rationale: Le verbe exprime ici le fait de laisser ou de délaisser ; « abandonné » rend clairement la gravité du reproche en français actuel.
theological_decisions:
- issue: Sens de « ton premier amour »
  choice: Conserver la formule « ton premier amour » sans préciser son objet.
  alternative: « l’amour que tu avais au début », éventuellement compris comme l’amour pour le Seigneur, pour les autres croyants, ou les deux
  rationale: Le grec demeure concis et ouvert. La traduction ne tranche donc pas une ambiguïté théologique que le texte lui-même ne résout pas.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier correspond au pronom grec σοῦ et à l’adresse à l’assemblée envisagée collectivement.
