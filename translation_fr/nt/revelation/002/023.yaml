id: REV.2.23
reference: Revelation 2:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: fr
  text: Je ferai mourir ses enfants de mort[a], et toutes les Églises sauront que c’est moi qui sonde les reins et les cœurs[b], et je donnerai à chacun de vous selon vos œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par la peste » ; le grec dit littéralement « de mort », expression marquée qui peut intensifier le jugement ou reprendre le langage du jugement dans l’Ancien Testament.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « les reins et les cœurs » ; expression biblique désignant l’être intérieur, notamment les pensées, les motivations et les désirs.
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: enfants
  rationale: « Enfants » rend directement le grec tout en maintenant l’ambiguïté entre descendants biologiques et disciples ou partisans.
- source_word: ἀποκτενῶ ἐν θανάτῳ
  choice: je ferai mourir … par la mort
  rationale: Cette formulation conserve l’expression grecque marquée et son possible écho au langage biblique du jugement, sans imposer l’interprétation « peste ».
- source_word: ἐκκλησίαι
  choice: Églises
  rationale: Dans l’Apocalypse, le terme désigne les communautés chrétiennes auxquelles le livre s’adresse; « Églises » est la désignation française courante.
- source_word: ὁ ἐραυνῶν
  choice: qui sonde
  rationale: « Sonder » exprime un examen profond et continu, avec la nuance solennelle et judiciaire du participe grec.
- source_word: νεφροὺς καὶ καρδίας
  choice: les reins et les cœurs
  rationale: La formulation littérale préserve l’idiome anthropologique biblique et son ordre, tandis qu’une note en explique le sens au lecteur moderne.
- source_word: δώσω ὑμῖν ἑκάστῳ
  choice: je donnerai à chacun de vous
  rationale: Cette traduction suit de près le verbe « donner » et exprime clairement la valeur distributive de ἑκάστῳ.
- source_word: κατὰ τὰ ἔργα ὑμῶν
  choice: selon vos œuvres
  rationale: « Œuvres » maintient la formule biblique de rétribution ainsi que ses liens lexicaux ailleurs dans le texte.
theological_decisions:
- issue: Identité du locuteur qui sonde l’être intérieur
  choice: 'Conserver l’affirmation à la première personne : « c’est moi qui sonde les reins et les cœurs »'
  alternative: Atténuer en parlant simplement de connaissance ou d’observation
  rationale: Le grec attribue au Christ ressuscité une connaissance judiciaire profonde; la traduction en maintient la portée sans l’amplifier ni l’affaiblir.
- issue: Sens de « ses enfants »
  choice: Laisser ouverte l’interprétation littérale ou figurée
  alternative: Préciser qu’il s’agit soit de ses enfants biologiques, soit de ses disciples
  rationale: Le contexte peut évoquer ses partisans, mais le grec ne tranche pas explicitement; l’ambiguïté doit donc être préservée.
translation_notes:
  register: Français international moderne, digne et lisible. La tournure biblique « les reins et les cœurs » est conservée en raison de sa force intertextuelle, avec une note explicative. « Faire mourir » est naturel en français tout en rendant clairement le jugement exprimé par ἀποκτενῶ.
