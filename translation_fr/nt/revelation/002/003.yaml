id: REV.2.3
reference: Revelation 2:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: fr
  text: Tu as de la persévérance, tu as enduré à cause de mon nom[a], et tu ne t’es pas lassé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour mon nom » ou « pour l’amour de mon nom ».
    reason: lexical_alternative
  - marker: b
    text: 'Ou « tu ne t’es pas fatigué » ; la proposition peut aussi être comprise en rapport avec le labeur : « tu ne t’es pas lassé de travailler ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: de la persévérance
  rationale: Le nom désigne la constance qui tient ferme dans l’épreuve. « Persévérance » est naturel en français et exprime cette endurance active sans préciser la nature des difficultés.
- source_word: ἔχεις
  choice: tu as
  rationale: Rend directement le présent et la constatation adressée à l’Église.
- source_word: ἐβάστασας
  choice: tu as supporté des épreuves
  rationale: βαστάζω signifie porter, supporter ou endurer. L’ajout explicatif « des épreuves » rend en français le complément implicite sans identifier une persécution ou un travail particulier.
- source_word: διὰ τὸ ὄνομά μου
  choice: à cause de mon nom
  rationale: διά avec l’accusatif peut exprimer la cause ou le motif. Cette formulation est naturelle et conserve l’idée que ce qui a été supporté l’a été en raison de l’attachement au nom de Jésus.
- source_word: οὐ κεκοπίακες
  choice: tu ne t’es pas lassé
  rationale: Le parfait de κοπιάω peut décrire le fait de s’être fatigué ou lassé, avec un état qui en résulte. La formulation retient ici la nuance de lassitude dans le contexte de la persévérance, tout en signalant l’autre possibilité en note.
theological_decisions:
- issue: Nature de ce qui a été supporté pour le nom de Jésus
  choice: La formulation évoque des épreuves sans en préciser la forme.
  alternative: Comprendre plus généralement « tu as porté » ou plus précisément des persécutions ou les charges du service.
  rationale: Le contexte recommande l’idée de difficultés endurées, mais le grec ne permet pas d’en définir précisément la nature.
- issue: Sens de la proposition finale
  choice: Elle affirme que le destinataire ne s’est pas laissé gagner par la lassitude.
  alternative: 'Elle peut être comprise en rapport avec le labeur : « tu ne t’es pas fatigué à la tâche » ou « tu n’as pas cessé de peiner ».'
  rationale: κοπιάω peut désigner aussi bien la fatigue que le travail pénible. Le parallèle avec la persévérance favorise la fatigue ou la lassitude, sans exclure le lien avec le labeur.
translation_notes:
  register: Français moderne, direct et digne. Le tutoiement singulier correspond à l’adresse grecque à l’ange de l’Église. La coordination a été légèrement allégée pour rester naturelle, tout en conservant les trois éléments de la recommandation.
