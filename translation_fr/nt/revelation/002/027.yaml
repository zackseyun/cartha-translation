source:
  edition: SBLGNT
  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: fr
  text: et il les fera paître avec une verge de fer[a], comme des vases de poterie sont mis en pièces[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il les gouvernera avec une verge de fer ». Le verbe grec signifie littéralement « faire paître »; dans cette allusion au Psaume 2, il comporte aussi l’idée d’autorité royale.
    reason: alternative_reading
  - marker: b
    text: Allusion au Psaume 2,9, où les nations sont brisées comme des vases de poterie.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: et
  rationale: Le connecteur est conservé afin de maintenir le lien avec la promesse du verset précédent.
- source_word: ποιμανεῖ
  choice: conduira en berger
  rationale: Le verbe signifie proprement exercer l’activité du berger. Cette formulation française naturelle conserve l’image pastorale tout en laissant au contexte du Psaume 2 sa portée royale et judiciaire.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: avec un sceptre de fer
  rationale: ῥάβδος peut désigner une verge, un bâton ou un sceptre. « Sceptre » rend ici clairement l’autorité royale évoquée par le Psaume 2, tandis que « de fer » préserve la force de l’image.
- source_word: ὡς
  choice: comme
  rationale: Introduit naturellement en français la comparaison avec la poterie brisée.
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: des récipients d’argile
  rationale: σκεῦος désigne un objet ou récipient, et κεραμικός précise qu’il est en terre cuite. Cette traduction reste générale et intelligible sans réduire le terme à une forme particulière de poterie.
- source_word: συντρίβεται
  choice: on brise
  rationale: Le verbe exprime une destruction par écrasement ou mise en pièces. La tournure impersonnelle française rend naturellement le singulier grec employé avec un sujet neutre pluriel, sans introduire explicitement un agent absent du texte.
theological_decisions:
- issue: Allusion royale et messianique au Psaume 2:9 dans ποιμανεῖ et l’image du sceptre de fer
  choice: Conserver l’image du berger dans « conduira en berger », tout en rendant ῥάβδος par « sceptre » afin que la dimension royale demeure perceptible.
  alternative: Traduire « il les gouvernera avec une verge de fer », ce qui mettrait directement l’accent sur la domination.
  rationale: Le grec emploie ποιμαίνω, et non un verbe générique signifiant gouverner. La formulation choisie préserve donc la tension entre conduite pastorale, autorité royale et jugement violent au lieu de la résoudre dans un seul sens.
translation_notes:
  register: Français international moderne, digne et accessible. « Conduira en berger » conserve une métaphore biblique inhabituelle sans être opaque; « sceptre de fer » porte l’imagerie royale. La ponctuation finale maintient le raccord syntaxique avec le contexte plus large.
