id: REV.2.12
reference: Revelation 2:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: fr
  text: 'Écris à l’ange de l’Église qui est à Pergame : Voici ce que dit celui qui tient l’épée acérée à deux tranchants :[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « messager » pour « ange ». Les interprètes ne s’accordent pas sur la question de savoir s’il s’agit d’un être céleste ou d’un représentant humain de l’Église.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ange
  rationale: Le terme peut désigner un ange céleste ou un messager humain. « Ange » est naturel dans la formule répétée d’Apocalypse 2–3 et conserve l’ambiguïté du référent.
- source_word: ἐκκλησίας
  choice: Église
  rationale: Dans ce contexte chrétien, le mot désigne la communauté locale des croyants. « Église » est l’équivalent français courant et idiomatique.
- source_word: γράψον
  choice: Écris
  rationale: L’impératif aoriste est rendu directement par l’impératif français; la citation qui suit fournit le contenu à écrire.
- source_word: Τάδε λέγει
  choice: Voici ce que dit
  rationale: Cette tournure française actuelle et digne restitue la formule solennelle qui introduit une déclaration prophétique, sans le calque peu naturel « Ces choses dit ».
- source_word: ὁ ἔχων
  choice: celui qui tient
  rationale: Le participe substantivé forme un titre descriptif. « Tient » convient mieux qu’« a » à une épée et garde l’image concrète.
- source_word: ῥομφαίαν
  choice: épée
  rationale: Le mot peut évoquer une épée grande ou lourde, mais « épée » évite une précision typologique que le contexte n’exige pas.
- source_word: δίστομον
  choice: à deux tranchants
  rationale: Littéralement « à deux bouches », l’adjectif désigne idiomatiquement une lame qui coupe des deux côtés. « À deux tranchants » est la formulation française consacrée et naturelle.
- source_word: ὀξεῖαν
  choice: acérée
  rationale: Le mot caractérise l’épée comme tranchante. « Acérée » est précis, vivant et d’un registre digne.
- source_word: Περγάμῳ
  choice: Pergame
  rationale: « Pergame » est la forme française moderne usuelle du nom de la ville antique.
theological_decisions:
- issue: Identité de l’« ange » de l’Église
  choice: Conserver « ange » dans le texte sans préciser s’il s’agit d’un être céleste ou d’un représentant humain.
  alternative: messager humain, responsable de l’Église ou représentant céleste
  rationale: Le grec ἄγγελος autorise plusieurs référents et le verset ne tranche pas. La traduction et la note préservent cette tension sans imposer une lecture ecclésiologique particulière.
translation_notes:
  register: Français international moderne, naturel et solennel. L’inversion grecque plaçant « l’ange » avant l’impératif est réorganisée selon l’ordre idiomatique français. La formule « Voici ce que dit » conserve la portée déclarative de Τάδε λέγει, tandis que « qui est à Pergame » reflète explicitement l’expression grecque.
