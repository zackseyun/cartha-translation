id: REV.2.5
reference: Revelation 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: fr
  text: Souviens-toi donc d’où tu es tombé[a], repens-toi et accomplis les œuvres que tu faisais au début. Sinon, je viens à toi et j’enlèverai ton chandelier de sa place[b], à moins que tu ne te repentes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de quelle hauteur tu es tombé ». Le grec dit littéralement « d’où tu es tombé » ; certains y voient une allusion implicite à une hauteur.
    reason: lexical_alternative
  - marker: b
    text: Dans Apocalypse 1:20, le « chandelier » représente une Église.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: Souviens-toi
  rationale: L’impératif présent appelle à garder activement le souvenir; «Souviens-toi» est naturel en français et conserve la force de l’ordre.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence de la réprimande précédente; «donc» exprime clairement et naturellement ce lien logique.
- source_word: πόθεν πέπτωκας
  choice: d’où tu es tombé
  rationale: Rend littéralement l’origine spatiale exprimée par πόθεν et l’état résultant du parfait πέπτωκας, sans ajouter explicitement l’idée de hauteur.
- source_word: μετανόησον / μετανοήσῃς
  choice: repens-toi / te repentes
  rationale: «Se repentir» est le terme français courant dans ce contexte moral et spirituel; la répétition du même verbe grec est conservée.
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: accomplis les œuvres que tu faisais au début
  rationale: Formulation française naturelle qui garde le terme «œuvres» et explicite sobrement la valeur temporelle de πρῶτα.
- source_word: εἰ δὲ μή
  choice: Sinon
  rationale: Rend de façon concise et idiomatique la condition négative qui introduit l’avertissement.
- source_word: ἔρχομαί σοι
  choice: je viens à toi
  rationale: Conserve le présent vif du grec et n’ajoute pas «contre toi», même si le contexte est celui d’un jugement.
- source_word: κινήσω
  choice: j’enlèverai
  rationale: Dans la construction «de sa place», κινέω désigne ici le déplacement qui retire le porte-lampe de sa position; «enlèverai» communique clairement cette conséquence.
- source_word: τὴν λυχνίαν σου
  choice: ton porte-lampe
  rationale: λυχνία désigne le support de la lampe, non la lampe elle-même; «porte-lampe» garde l’image concrète et se distingue du chandelier à bougies.
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: de sa place
  rationale: Rendu direct, clair et idiomatique de la locution prépositionnelle.
theological_decisions:
- issue: Portée de l’avertissement concernant le porte-lampe
  choice: Conserver l’image symbolique de l’enlèvement du porte-lampe sans en préciser davantage la portée doctrinale.
  alternative: L’expliciter comme perte du témoignage collectif, suppression de l’Église ou perte du salut.
  rationale: Apocalypse 1:20 identifie les porte-lampes aux Églises, mais ce verset ne formule pas lui-même une conclusion systématique sur le salut individuel. La traduction préserve donc l’image et sa tension.
- issue: Sens de la chute
  choice: «d’où tu es tombé»
  alternative: «de quelle hauteur tu es tombé» ou «tu t’es détourné»
  rationale: Le grec présente une métaphore spatiale sans nommer explicitement une hauteur ni définir la chute comme apostasie; le rendu retenu maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe impérative et l’avertissement abrupt sont conservés. «Porte-lampe» restitue l’objet ancien sans le confondre avec une lampe ou un chandelier à bougies.
