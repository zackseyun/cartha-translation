    rationale: Le καὶ grec coordonne la promesse du don à la comparaison qui précède. Une virgule et une minuscule rendent mieux la continuité de la phrase.
  - severity: low
    issue: Ellipse de l’objet de « j’ai reçu » trop abrupte en français.
    rationale: Le grec peut omettre l’objet, récupérable dans le contexte immédiat (l’autorité du v. 27). En français, « je l’ai reçue » rend ce renvoi de façon plus naturelle, sans expliciter le contenu au-delà du contexte.
  - severity: low
    issue: La note parle d’« une figure royale et messianique ».
    rationale: « Des images royales et messianiques » reflète plus précisément le caractère imagé de l’expression et évite de suggérer une identification unique.
