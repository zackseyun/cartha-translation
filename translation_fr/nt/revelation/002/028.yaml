  text: ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου, καὶ δώσω αὐτῷ τὸν ἀστέρα τὸν πρωϊνόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: fr
  text: tout comme moi aussi je l’ai reçue de mon Père, et je lui donnerai l’étoile du matin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’étoile de l’aurore ». Cette expression peut évoquer des images royales et messianiques ; elle peut aussi faire écho à Apocalypse 22.16, où Jésus se présente comme « l’étoile brillante du matin ».
    reason: Alternative lexicale et résonances bibliques possibles, laissées ouvertes par le texte.
lexical_decisions:
- source_word: ὡς
  choice: tout comme
  rationale: Introduit la correspondance avec la promesse d’autorité du verset précédent; « tout comme » rend clairement la valeur comparative en français naturel.
- source_word: κἀγὼ
  choice: moi aussi
  rationale: La crase de καὶ ἐγώ associe addition et emphase; « moi aussi » conserve ces deux nuances sans les exagérer.
- source_word: εἴληφα
  choice: j’ai reçu
  rationale: Le passé composé rend naturellement en français l’action accomplie dont le résultat demeure; le complément « de mon Père » favorise le sens de réception plutôt que celui de prise.
- source_word: παρὰ τοῦ πατρός μου
  choice: de mon Père
  rationale: παρά avec le génitif indique ici la source; cette formulation conserve directement la relation filiale exprimée dans le grec.
- source_word: καὶ δώσω αὐτῷ
  choice: Et je lui donnerai
  rationale: Le futur et le datif sont rendus directement. La phrase autonome évite une coordination française trop lourde tout en maintenant le lien avec ce qui précède.
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: l’étoile du matin
  rationale: Expression française naturelle et traditionnelle qui garde intacte l’image sans en imposer une interprétation dans le texte principal.
theological_decisions:
- issue: Identité et portée de « l’étoile du matin »
  choice: Conserver la métaphore « l’étoile du matin » sans l’expliquer dans le texte principal.
  alternative: Y voir explicitement le Christ, une image royale et messianique, ou la gloire eschatologique promise.
  rationale: Le verset ne définit pas lui-même le symbole. Le maintien de la métaphore préserve ses résonances possibles, notamment le rapprochement avec Apocalypse 22.16, sans trancher entre elles.
- issue: Relation christologique dans « de mon Père »
  choice: Traduire directement la relation filiale et le langage de réception.
  alternative: Ajouter une explication concernant une autorité déléguée ou l’économie de la rédemption.
  rationale: Le texte exprime la source du don et la relation Père-Fils sans préciser davantage leur portée doctrinale; aucune explication théologique ne doit être ajoutée à la traduction.
translation_notes:
  register: Français international moderne, naturel et digne. « Tout comme moi aussi » conserve l’articulation avec le verset précédent et l’insistance du grec. La métaphore centrale reste non explicitée dans le corps du texte.
