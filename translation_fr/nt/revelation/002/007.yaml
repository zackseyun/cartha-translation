id: REV.2.7
reference: Revelation 2:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: fr
  text: Que celui qui a une oreille écoute ce que l’Esprit dit aux Églises. À celui qui vaincra[a], je donnerai à manger de l’arbre de vie qui est dans le paradis de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À celui qui remportera la victoire. »'
    reason: Alternative lexicale permettant de faire entendre la valeur victorieuse de νικάω tout en conservant la formulation principale plus concise.
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: celui qui a une oreille
  rationale: Conserve le singulier et la tournure représentative de l’expression grecque, dans un français clair et traditionnel.
- source_word: ἀκουσάτω
  choice: écoute
  rationale: L’impératif français rend directement l’exhortation de l’impératif aoriste grec et s’accorde naturellement avec « celui qui ».
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Dans la formule répétée d’Apocalypse 2–3, le contexte désigne l’Esprit Saint; la majuscule marque cette identification contextuelle.
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: dit aux Églises
  rationale: Le présent simple rend naturellement λέγει; « Églises » est le terme établi pour les communautés auxquelles s’adressent les messages.
- source_word: τῷ νικῶντι
  choice: à celui qui vaincra
  rationale: « Vaincre » garde l’imagerie de victoire propre à νικάω. Le futur idiomatique français exprime la persévérance jusqu’à la victoire dans la formule de promesse, sans changer la portée du participe présent grec.
- source_word: δώσω αὐτῷ φαγεῖν
  choice: je donnerai à manger
  rationale: Cette tournure française naturelle conserve l’idée que le locuteur accordera au vainqueur de manger, sans lourde répétition pronominale.
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: de l’arbre de vie
  rationale: Avec « manger », le français emploie naturellement « manger de » pour exprimer la provenance indiquée par ἐκ; ξύλον désigne ici l’arbre.
- source_word: παραδείσῳ
  choice: paradis
  rationale: « Paradis » préserve la portée eschatologique et l’écho intertextuel du terme παράδεισος.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Rend directement et sobrement le génitif grec.
theological_decisions:
- issue: Référent de τὸ πνεῦμα
  choice: l’Esprit, compris comme l’Esprit Saint
  alternative: un esprit au sens générique
  rationale: La formule récurrente adressée aux Églises dans Apocalypse 2–3 présente cette parole comme une adresse divine; la majuscule signale ce référent sans développer le texte.
- issue: Rendu de νικάω dans la formule de promesse
  choice: vaincra
  alternative: remportera la victoire / triomphera
  rationale: « Vaincre » restitue directement le champ lexical de la victoire et maintient l’imagerie de conflit de l’Apocalypse. La note conserve une autre formulation française possible.
- issue: Singulier représentatif de l’exhortation
  choice: celui qui… écoute
  alternative: quiconque… écoute
  rationale: La formulation conserve le singulier grammatical du grec tout en gardant sa portée générale, sans ajouter de distinction de genre absente du nom français « personne » mais moins fidèle à la structure.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la solennité de la formule répétée dans l’Apocalypse, avec un impératif direct et une promesse formulée naturellement.
