source:
  edition: SBLGNT
  text: οὕτως ἔχεις καὶ σὺ κρατοῦντας τὴν ⸀διδαχὴν Νικολαϊτῶν ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: fr
  text: Ainsi, toi aussi, tu as des personnes qui s’attachent à l’enseignement des Nicolaïtes de même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « semblablement ». Le grec peut indiquer qu’ils s’attachent à cet enseignement d’une manière comparable à celle des personnes mentionnées au verset précédent, ou rattacher plus largement la situation à ce qui vient d’être décrit.'
    reason: alternative lexicale et ambiguïté syntaxique
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Introduit le rapprochement avec le reproche du verset précédent tout en conservant la progression directe du grec.
- source_word: ἔχεις
  choice: tu as
  rationale: Conserve l’adresse directe au singulier. Dans le contexte, le sens est qu’il se trouve de telles personnes au sein de l’Église.
- source_word: καὶ σὺ
  choice: toi aussi
  rationale: Rend l’insistance du grec et souligne que la communauté de Pergame présente elle aussi cette situation.
- source_word: κρατοῦντας
  choice: des gens qui s’attachent à
  rationale: Exprime l’adhésion durable à un enseignement dans un français actuel et naturel, sans renforcer indûment le degré d’attachement.
- source_word: διδαχὴν
  choice: l’enseignement
  rationale: Terme courant et clair qui désigne ce qui est enseigné sans la connotation plus technique ou confessionnelle de « doctrine ».
- source_word: Νικολαϊτῶν
  choice: des Nicolaïtes
  rationale: Emploie la forme française traditionnelle et reconnaissable du nom de ce groupe.
- source_word: ὁμοίως
  choice: de même
  rationale: Conserve la valeur comparative de l’adverbe et sa position liée à l’adhésion, tout en laissant possible un rattachement plus large à la situation décrite au verset précédent.
theological_decisions:
- issue: Rattachement de ὁμοίως dans la phrase
  choice: Placer « de même » après « s’attachent », de façon à permettre un lien avec leur manière d’adhérer tout en maintenant la comparaison générale avec le verset précédent.
  alternative: « De même, toi aussi, tu as des gens qui s’attachent à l’enseignement des Nicolaïtes. »
  rationale: Le grec permet de comprendre ὁμοίως soit comme précisant l’adhésion, soit comme reprenant plus largement la comparaison avec les personnes évoquées au verset 14. La formulation retenue ne tranche pas explicitement cette ambiguïté.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier reflète l’adresse grammaticale à l’ange de l’Église. La légère répétition comparative (« Ainsi… de même ») est maintenue parce qu’elle correspond aux deux marqueurs grecs οὕτως et ὁμοίως.
