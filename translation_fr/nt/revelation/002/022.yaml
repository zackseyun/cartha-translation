id: REV.2.22
reference: Revelation 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: fr
  text: Voici, je la jette sur un lit[a], et ceux qui commettent l’adultère avec elle, dans une grande détresse[b], à moins qu’ils ne se repentent de ses œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur un lit de malade ». Le grec dit littéralement « sur un lit » ; dans ce contexte, beaucoup comprennent qu’il s’agit d’un lit de souffrance ou de maladie infligée comme jugement.
    reason: lexical_alternative
  - marker: b
    text: Ou « dans une grande affliction » ou « dans une grande tribulation ». L’expression désigne ici une détresse ou une souffrance sévère.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: Interjection française actuelle et digne qui attire l’attention sans recourir à l’archaïque « Voici que ».
- source_word: βάλλω
  choice: je la jette
  rationale: Le présent rend l’action vive et imminente dans cette déclaration de jugement.
- source_word: αὐτὴν εἰς κλίνην
  choice: sur un lit
  rationale: κλίνη désigne littéralement un lit ou une couche. Le texte ne précise pas lexicalement qu’il s’agit d’un lit de malade; cette interprétation contextuelle est donc réservée à la note.
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: ceux qui commettent l’adultère avec elle
  rationale: Cette formulation conserve le sens concret de μοιχεύω ainsi que l’action exprimée par le participe, sans trancher sa portée symbolique éventuelle.
- source_word: εἰς θλῖψιν μεγάλην
  choice: dans une grande détresse
  rationale: θλῖψις peut désigner la détresse, l’affliction ou la tribulation. « Grande détresse » exprime naturellement une souffrance sévère sans imposer une lecture eschatologique technique.
- source_word: ἐὰν μὴ μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς
  choice: à moins qu’ils ne se détournent de ses œuvres
  rationale: Avec ἐκ, le verbe μετανοέω implique ici l’abandon des œuvres en question. « Se détournent de » rend explicitement et naturellement ce mouvement, tandis que « ses œuvres » préserve le lien avec αὐτῆς.
theological_decisions:
- issue: Faut-il interpréter explicitement κλίνη comme un lit de malade servant de jugement?
  choice: Conserver « lit » dans le texte principal
  alternative: lit de malade
  rationale: Le contexte évoque clairement un jugement et peut suggérer une couche de souffrance, peut-être par renversement ironique. Cependant, κλίνη ne signifie pas nécessairement « lit de malade »; la traduction principale conserve donc l’ambiguïté lexicale.
- issue: Μοιχεύοντας désigne-t-il un adultère sexuel littéral, une infidélité spirituelle métaphorique, ou les deux?
  choice: Traduire par « commettent l’adultère » et laisser la portée plus large implicite
  alternative: se livrent à l’immoralité sexuelle avec elle; lui sont infidèles
  rationale: Μοιχεύω désigne directement l’adultère. Le contexte de l’Apocalypse peut lui donner une portée symbolique ou spirituelle, mais une formulation plus générale effacerait l’image concrète du grec.
- issue: Comment comprendre le sujet de μετανοήσωσιν et le possessif αὐτῆς?
  choice: Conserver le sujet pluriel « ils » et attribuer les œuvres à « elle »
  alternative: à moins qu’elle ne se repente de ses œuvres
  rationale: Le texte SBLGNT fourni porte μετανοήσωσιν, troisième personne du pluriel, et αὐτῆς, « ses œuvres à elle ». La traduction maintient cette distinction grammaticale, même si elle produit une formulation théologiquement tendue où ses partenaires doivent abandonner les œuvres qui lui sont associées.
translation_notes:
  register: Français international moderne, naturel et digne. « Voici » conserve la solennité de l’interjection; « lit » et « adultère » maintiennent les images concrètes du grec. La syntaxe distingue clairement la femme de ceux qui commettent l’adultère avec elle, conformément au texte source.
