id: REV.2.6
reference: Revelation 2:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: fr
  text: 'Mais tu as ceci : tu hais les œuvres des Nicolaïtes[a], que moi aussi je hais.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les actes » ; le terme grec désigne ici leurs actions ou leurs pratiques.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque naturellement le contraste avec ce qui précède.
- source_word: τοῦτο ἔχεις
  choice: tu as ceci pour toi
  rationale: Conserve l’idée littérale de possession tout en rendant naturellement en français la valeur favorable de la tournure, sans aller jusqu’à l’explicitation plus libre « c’est à ton honneur ».
- source_word: ὅτι
  choice: ':'
  rationale: Introduit le contenu de « ceci » ; les deux-points sont naturels en français.
- source_word: μισεῖς / μισῶ
  choice: tu détestes / je déteste
  rationale: « Détester » exprime nettement l’aversion forte de μισέω et permet de conserver la répétition du même verbe sans suggérer ici que les personnes elles-mêmes sont l’objet direct.
- source_word: τὰ ἔργα
  choice: les œuvres
  rationale: Rendu lexicalement transparent de ἔργα ; dans ce contexte, le terme désigne les actes ou pratiques du groupe.
- source_word: τῶν Νικολαϊτῶν
  choice: des Nicolaïtes
  rationale: Translittération française traditionnelle et immédiatement reconnaissable du nom du groupe.
- source_word: ἃ κἀγὼ μισῶ
  choice: que moi aussi, je déteste
  rationale: Le relatif renvoie aux œuvres ; « moi aussi » préserve l’insistance de κἀγώ et l’alignement explicite du locuteur.
theological_decisions:
- issue: Objet de l’aversion
  choice: Les œuvres des Nicolaïtes sont explicitement l’objet de « détestes ».
  alternative: Une formulation plus vague pourrait laisser entendre que les Nicolaïtes eux-mêmes sont directement visés.
  rationale: Le complément d’objet grec est τὰ ἔργα ; la traduction maintient donc la distinction entre les personnes et leurs actes ou pratiques.
- issue: Accord du locuteur avec l’assemblée
  choice: « que moi aussi, je déteste »
  alternative: « que je déteste également »
  rationale: La formulation choisie conserve l’emphase de κἀγώ et la répétition directe du verbe, sans atténuer la force théologique de la déclaration.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « tu as ceci pour toi » reste proche du grec tout en étant idiomatique. « Détester » est plus naturel que « haïr » avec « œuvres » en français courant, tout en maintenant une forte condamnation et la répétition verbale.
