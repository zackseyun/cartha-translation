    issue: « du fait de la seconde mort »
    rationale: Cette expression peut évoquer une simple circonstance ou cause. Le grec présente la seconde mort comme la source ou l’agent du dommage que le vainqueur ne subira pas; « atteint par » préserve mieux cette relation.
  - severity: low
    issue: « Celui qui remporte la victoire »
    rationale: La formulation est intelligible, mais elle développe le participe νικῶν en une périphrase nominale. « Celui qui vainc » est plus direct, naturel et proche de l’image verbale grecque.
  revised_text: Que celui qui a des oreilles[a] entende ce que l’Esprit dit aux Églises. Celui qui vainc[b] ne sera absolument pas atteint par la seconde mort.
