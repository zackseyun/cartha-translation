id: REV.2.11
reference: Revelation 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: fr
  text: Que celui qui a des oreilles[a] entende ce que l’Esprit dit aux Églises. Celui qui vainc[b] ne sera absolument pas atteint par la seconde mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « une oreille ».'
    reason: Précision sur le singulier grammatical du grec, rendu idiomatiquement au pluriel en français.
  - marker: b
    text: 'Ou : « Celui qui triomphe » ; traduction traditionnelle : « Le vainqueur ».'
    reason: Variantes lexicales possibles pour ὁ νικῶν.
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: celui qui a des oreilles
  rationale: L’expression grecque est au singulier (« une oreille »), mais le pluriel est la tournure idiomatique française de cette formule d’appel à l’écoute. Le singulier représentatif est conservé dans « celui qui ».
- source_word: ἀκουσάτω
  choice: entende
  rationale: Le subjonctif présent dans la construction exhortative « Que… entende » rend naturellement l’impératif aoriste grec à la troisième personne.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Dans le refrain adressé aux Églises en Apocalypse 2–3, le terme désigne très probablement l’Esprit divin; la majuscule signale ce référent sans ajouter d’explication au texte.
- source_word: ταῖς ἐκκλησίαις
  choice: aux Églises
  rationale: Dans ce contexte, ἐκκλησίαις désigne les communautés chrétiennes auxquelles les messages sont adressés. « Églises » est le terme français courant et précis.
- source_word: ὁ νικῶν
  choice: celui qui remporte la victoire
  rationale: Cette formulation exprime le caractère continu ou distinctif du participe présent et conserve l’image de la victoire, importante dans l’Apocalypse. « Celui qui vaincra » serait plus concis, mais introduirait explicitement un futur absent du participe.
- source_word: οὐ μὴ
  choice: absolument aucun
  rationale: La combinaison οὐ μή avec le subjonctif constitue une négation fortement emphatique. « Ne… absolument aucun » en restitue la vigueur en français moderne.
- source_word: ἀδικηθῇ
  choice: ne subira… aucun mal
  rationale: Le passif de ἀδικέω signifie ici subir un dommage ou un mal, plutôt qu’être victime d’une injustice au sens juridique.
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: du fait de la seconde mort
  rationale: Avec le passif, ἐκ indique ici la source du dommage. « Du fait de » rend cette relation plus naturellement que le calque « de la seconde mort ».
- source_word: τοῦ θανάτου τοῦ δευτέρου
  choice: la seconde mort
  rationale: L’expression apocalyptique est conservée sans paraphrase doctrinale, puisque l’Apocalypse elle-même en développe le sens.
theological_decisions:
- issue: Référent de « l’Esprit »
  choice: l’Esprit divin parlant aux Églises
  alternative: l’esprit prophétique au sens plus général
  rationale: Le refrain des chapitres 2–3 présente l’Esprit comme locuteur divin. La majuscule reflète ce référent probable sans développer l’expression.
- issue: Formes masculines représentatives
  choice: conserver le singulier masculin représentatif dans « celui qui »
  alternative: reformuler au pluriel ou par une tournure entièrement épicène
  rationale: Les participes grecs sont au masculin singulier avec une portée représentative. La formulation française garde cette structure tout en restant naturelle.
- issue: Sens de « la seconde mort »
  choice: préserver l’expression sans l’expliquer dans le corps du verset
  alternative: la paraphraser comme condamnation éternelle ou jugement final
  rationale: L’expression possède une forte charge théologique et reçoit son éclairage dans l’Apocalypse elle-même; une expansion ici résoudrait indûment son sens.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le rythme solennel de l’exhortation apocalyptique, évite les archaïsmes et préserve l’emphase de la négation grecque.
