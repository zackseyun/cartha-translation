id: REV.2.26
reference: Revelation 2:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: fr
  text: Et celui qui remporte la victoire[a] et qui garde mes œuvres[b] jusqu’à la fin, je lui[c] donnerai autorité sur les nations.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui triomphe ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « mes œuvres » peut désigner les œuvres qui appartiennent à Jésus ou qui sont conformes à ses actes, à ses desseins ou à ce qu’il demande ; le grec ne précise pas davantage cette relation.
    reason: lexical_alternative
  - marker: c
    text: Le grec emploie ici des formes masculines au singulier (« celui qui… je lui donnerai ») dans un sens représentatif.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ νικῶν
  choice: celui qui remporte la victoire
  rationale: Le participe présent substantivé désigne la personne caractérisée par la victoire. Cette formulation française conserve l’image active du combat récurrente dans l’Apocalypse, tout en restant naturelle.
- source_word: ὁ τηρῶν
  choice: qui garde
  rationale: τηρέω peut signifier garder, observer ou veiller à conserver. « Garde » maintient cette étendue de sens sans réduire le verbe à la seule obéissance.
- source_word: ἄχρι τέλους
  choice: jusqu’à la fin
  rationale: Cette expression temporelle indique la persévérance jusqu’au terme et se rend directement et naturellement ainsi en français.
- source_word: τὰ ἔργα μου
  choice: mes œuvres
  rationale: Le grec dit littéralement « mes œuvres » et ne précise pas s’il s’agit des actes de Jésus, de ceux qui lui appartiennent, qui lui correspondent ou qu’il demande. La formulation conserve cette ambiguïté.
- source_word: δώσω αὐτῷ
  choice: je lui donnerai
  rationale: Le futur de δίδωμι est rendu simplement par « donnerai »; « lui » reprend explicitement le bénéficiaire singulier de la promesse.
- source_word: ἐξουσίαν
  choice: autorité
  rationale: ἐξουσία désigne ici l’autorité ou le droit de gouverner, sens mieux adapté au complément « sur les nations » que le terme plus général « puissance ».
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: sur les nations
  rationale: Dans ce contexte, ἔθνη désigne les nations ou peuples du monde, et ἐπί avec le génitif exprime l’autorité exercée sur eux.
theological_decisions:
- issue: Masculin singulier représentatif
  choice: Conserver « celui » et « lui » au masculin singulier, avec une note explicative
  alternative: Employer « cette personne » ou une tournure plurielle épicène
  rationale: Le grec emploie des participes substantivés et un pronom au masculin singulier. La traduction en garde la forme représentative sans lui donner une portée exclusivement masculine.
- issue: Rapport exprimé par « mes œuvres »
  choice: Conserver la formulation « mes œuvres »
  alternative: Traduire « les œuvres que j’exige » ou « ce que j’ai commandé »
  rationale: Le texte ne définit pas explicitement la relation entre Jésus et les œuvres. Une explicitation dans le corps du verset trancherait indûment une ambiguïté réelle.
translation_notes:
  register: Français international moderne, digne et accessible. La dislocation « celui qui…, je lui… » reprend naturellement en français la construction grecque et met en relief le bénéficiaire de la promesse. « Mes œuvres » est volontairement conservé malgré son caractère inhabituel afin de ne pas résoudre l’ambiguïté du grec.
