  naturalness: « Je lui ai donné du temps pour qu’elle se repente, mais elle ne veut pas se repentir de son immoralité sexuelle » est un français moderne, clair et d’un registre approprié au passage. Le terme « se repentir » est courant dans le registre biblique et exprime plus exactement le verbe grec que « changer d’attitude ».
