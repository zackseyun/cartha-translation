source:
  edition: SBLGNT
  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: fr
  text: Je lui ai donné du temps pour qu’elle se repente[a], mais elle ne veut pas se repentir de son immoralité sexuelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « se repentir loin de son immoralité sexuelle ».
    reason: 'Alternative lexicale : la seconde occurrence de « se repentir » est construite avec ἐκ, qui exprime l’éloignement ou la sortie.'
lexical_decisions:
- source_word: ἔδωκα
  choice: j’ai donné
  rationale: L’aoriste désigne ici l’acte accompli d’accorder un délai; le passé composé est naturel en français moderne.
- source_word: χρόνον
  choice: du temps
  rationale: Le terme désigne une durée accordée et se rend directement et naturellement ainsi.
- source_word: ἵνα μετανοήσῃ
  choice: pour qu’elle change d’attitude
  rationale: La construction exprime le but. « Changer d’attitude » communique clairement l’idée de μετανοέω en français courant, sans réduire celle-ci au seul regret.
- source_word: οὐ θέλει
  choice: elle ne veut pas
  rationale: Cette formulation préserve la dimension volontaire de θέλω sans renforcer le texte jusqu’à « elle refuse ».
- source_word: μετανοῆσαι ἐκ
  choice: se détourner de
  rationale: Avec ἐκ, la seconde occurrence met en relief l’abandon de la conduite; « se détourner de » conserve plus nettement ce mouvement que la tournure idiomatique « se repentir de ».
- source_word: τῆς πορνείας αὐτῆς
  choice: son immoralité sexuelle
  rationale: Cette expression garde la précision sexuelle de πορνεία tout en laissant le contexte apocalyptique porter d’éventuelles résonances symboliques.
theological_decisions:
- issue: Sens de πορνεία dans une réprimande apocalyptique
  choice: immoralité sexuelle
  alternative: inconduite; prostitution; débauche
  rationale: Le sens lexical concret est conservé sans imposer une lecture exclusivement littérale ni transformer explicitement le terme en métaphore de l’idolâtrie.
- issue: Rendu de μετανοέω et de la construction avec ἐκ
  choice: « change d’attitude » à la première occurrence, puis « se détourner de » à la seconde
  alternative: répéter « se repentir » dans les deux occurrences
  rationale: Le grec répète le même verbe, mais la construction ἐκ explicite à la seconde occurrence le mouvement d’abandon. La variation française rend ce rapport intelligiblement tout en signalant en note la répétition grecque.
translation_notes:
  register: Français international moderne, clair et digne. « Elle ne veut pas » garde la force de la volonté sans surtraduire par « elle refuse ». La formulation évite le terme religieux parfois opaque « se repentir » dans le corps du texte, tout en le conservant dans la note comme équivalent traditionnel.
