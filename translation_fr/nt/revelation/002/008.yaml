id: REV.2.8
reference: Revelation 2:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: fr
  text: 'Écris à l’ange[a] de l’Église qui est à Smyrne : Voici ce que dit le Premier et le Dernier, celui qui est mort et qui est revenu à la vie[b] :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « messager ».
    reason: alternative_reading
  - marker: b
    text: 'Autre traduction possible : « qui était mort et a repris vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ange
  rationale: Dans le cadre apocalyptique de l’Apocalypse, « ange » est le sens contextuel le plus probable; « messager » demeure toutefois lexicalement possible et figure en note.
- source_word: ἐκκλησίας
  choice: Église
  rationale: Le terme désigne ici la communauté chrétienne de Smyrne. « Église » exprime naturellement ce sens religieux établi en français moderne.
- source_word: Τάδε λέγει
  choice: Voici ce que dit
  rationale: Cette tournure française naturelle conserve la solennité de la formule prophétique récurrente sans calquer maladroitement la syntaxe grecque.
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: le Premier et le Dernier
  rationale: Les majuscules signalent qu’il s’agit d’un titre christologique, faisant écho au langage divin d’Ésaïe.
- source_word: ἐγένετο νεκρὸς
  choice: a été mort
  rationale: 'Cette formulation conserve mieux que le simple « était mort » la valeur événementielle de ἐγένετο : il est effectivement passé par la mort, tout en restant intelligible en français.'
- source_word: ἔζησεν
  choice: est revenu à la vie
  rationale: Dans le contraste avec la mort, cette expression idiomatique communique clairement le retour à la vie sans ajouter d’explication doctrinale.
theological_decisions:
- issue: Titre christologique et formulation de la mort et du retour à la vie
  choice: « le Premier et le Dernier, celui qui a été mort et qui est revenu à la vie »
  alternative: « le premier et le dernier, celui qui était mort et a repris vie »
  rationale: Le titre est maintenu comme auto-identification solennelle du Christ, et la proposition suivante exprime clairement sa mort réelle et son retour à la vie, sans développer davantage la portée doctrinale du passage.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Voici ce que dit » restitue naturellement le ton prophétique. « Église » prend une majuscule pour désigner la communauté locale en tant qu’institution religieuse; les titres « Premier » et « Dernier » sont également capitalisés.
