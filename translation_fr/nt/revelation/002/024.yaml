  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: fr
  text: 'Mais à vous, les autres qui êtes à Thyatire, à tous ceux qui n’adhèrent pas à cet enseignement et qui n’ont pas connu les « profondeurs de Satan », comme ils disent[a], je vous le dis : je ne vous impose aucune autre charge.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les choses profondes de Satan ». L’expression grecque peut faire écho à une prétention à posséder une connaissance spirituelle « profonde », sans préciser exactement qui emploie cette désignation ni dans quel sens.'
    reason: Alternative lexicale ; préservation de l’ambiguïté rhétorique de ὡς λέγουσιν.
lexical_decisions:
- source_word: τοῖς λοιποῖς τοῖς ἐν Θυατείροις
  choice: à vous, les autres qui êtes à Thyatire
  rationale: Cette formulation naturelle conserve l’adresse directe et distingue les autres membres de l’assemblée de ceux qui suivent l’enseignement condamné.
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: n’adhèrent pas à cet enseignement
  rationale: Avec διδαχή, ἔχω exprime ici le fait d’adopter ou de soutenir un enseignement. « Adhérer à » rend ce sens clairement sans suggérer une simple possession.
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: qui n’ont pas connu
  rationale: Le passé composé convient à cette description et préserve la possibilité que « connaître » désigne aussi bien une connaissance qu’une expérience.
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: les « profondeurs de Satan »
  rationale: « Profondeurs » rend le substantif neutre pluriel βαθέα et laisse entendre, sans l’expliciter, une possible prétention à une connaissance spirituelle profonde. Les guillemets signalent le caractère rapporté ou polémique de l’expression.
- source_word: ὡς λέγουσιν
  choice: comme ils disent
  rationale: Cette traduction littérale et naturelle préserve l’indétermination du grec quant aux personnes visées et à la portée exacte de la formule.
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: je ne vous impose pas d’autre fardeau
  rationale: « Imposer un fardeau » rend idiomatiquement βάλλω ἐπί avec βάρος et conserve l’idée d’une obligation ajoutée.
theological_decisions:
- issue: Référent et portée de l’expression « les profondeurs de Satan, comme ils disent »
  choice: Conserver une désignation rapportée et polémique sans préciser qui l’a formulée ni de quelle manière.
  alternative: Préciser soit que les faux enseignants parlaient de « profondeurs » que Jean attribue à Satan, soit que l’expression entière constituait leur propre formule.
  rationale: La construction grecque est condensée et permet plusieurs compréhensions. La traduction garde cette ambiguïté et la tension rhétorique du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’adresse solennelle tout en évitant les tournures archaïques. « Je déclare » reprend le verbe de parole après la longue adresse et rend la phrase aisément compréhensible.
