id: REV.2.13
reference: Revelation 2:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: fr
  text: 'Je sais où tu habites : là où se trouve le trône de Satan. Pourtant, tu restes fermement attaché à mon nom et tu n’as pas renié ta foi en moi[a], même aux jours d’Antipas, mon témoin[b], mon fidèle, qui a été tué parmi vous, là où Satan habite.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « ma foi ». On peut aussi comprendre « ma fidélité ». La formule grecque est concise et peut recevoir plusieurs interprétations.
    reason: alternative_reading
  - marker: b
    text: Le mot grec traduit par « témoin » peut aussi, dans un contexte de souffrance et de mort, prendre le sens de « martyr ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: Je sais
  rationale: Le parfait grec a ici un sens présent; « Je sais » est direct et naturel.
- source_word: κατοικεῖς
  choice: tu habites
  rationale: Rend simplement l’idée de résider en un lieu, dans un français moderne.
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: là où se trouve le trône de Satan
  rationale: Conserve sans l’expliquer l’image apocalyptique forte du texte grec.
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: tu restes fermement attaché à mon nom
  rationale: κρατέω exprime ici une adhésion tenace; cette formulation naturelle préserve aussi littéralement « mon nom ».
- source_word: οὐκ ἠρνήσω
  choice: tu n’as pas renié
  rationale: « Renier » convient à l’abandon public d’une foi ou d’une allégeance et garde la force du verbe grec.
- source_word: τὴν πίστιν μου
  choice: ta foi en moi
  rationale: Dans ce contexte de fidélité sous la persécution, cette lecture du génitif est naturelle en français; l’ambiguïté de la formule grecque est signalée en note.
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: même aux jours d’Antipas
  rationale: Préserve la tournure temporelle et rattache naturellement l’épreuve évoquée à l’affirmation précédente.
- source_word: ὁ μάρτυς μου
  choice: mon témoin
  rationale: « Témoin » est le sens lexical fondamental de μάρτυς; le contexte de la mort permet aussi « martyr », indiqué en note.
- source_word: ὁ πιστός μου
  choice: mon fidèle
  rationale: Garde l’apposition distincte et la relation personnelle exprimée par μου, sans ajouter « serviteur » absent du grec.
- source_word: ἀπεκτάνθη
  choice: a été tué
  rationale: Rend directement le passif sans ajouter la nuance juridique de « assassiné ».
- source_word: παρ’ ὑμῖν
  choice: parmi vous
  rationale: Indique que la mort a eu lieu dans leur milieu sans suggérer que l’Église en était l’auteur.
theological_decisions:
- issue: Sens de τὴν πίστιν μου
  choice: ta foi en moi
  alternative: ma foi; ma fidélité
  rationale: Le génitif μου admet plusieurs relations possibles. La lecture objective, « foi en moi », est naturelle dans ce contexte, mais les autres possibilités réelles sont conservées en note.
- issue: Sens de μάρτυς dans un contexte de mise à mort
  choice: témoin
  alternative: martyr
  rationale: Le sens de base est « témoin ». Le fait qu’Antipas ait été tué donne aussi au terme la portée de « martyr », sans qu’il soit nécessaire d’imposer ce sens dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond au destinataire ecclésial personnifié par l’ange de l’Église. Les images et répétitions du texte sont conservées; les ambiguïtés lexicales importantes sont signalées en notes.
