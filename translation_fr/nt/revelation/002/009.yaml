id: REV.2.9
reference: Revelation 2:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: fr
  text: Je connais ta détresse et ta pauvreté — pourtant tu es riche — ainsi que les calomnies[a] de ceux qui se disent juifs et ne le sont pas, mais qui sont une synagogue[b] de Satan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les blasphèmes ». Ici, le mot grec peut désigner des paroles hostiles et diffamatoires ; c’est pourquoi « calomnies » figure dans le texte.
    reason: lexical_alternative
  - marker: b
    text: L’expression « synagogue de Satan » traduit littéralement le grec. Le mot rendu par « synagogue » peut aussi signifier « assemblée » ou « rassemblement ».
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: détresse
  rationale: Le terme désigne la pression, l’épreuve ou l’oppression. « Détresse » est naturel en français moderne et exprime la souffrance sans introduire les connotations eschatologiques parfois attachées à « tribulation ».
- source_word: πτωχείαν
  choice: pauvreté
  rationale: « Pauvreté » rend directement et clairement le sens de πτωχεία sans préciser indûment le degré de dénuement.
- source_word: πλούσιος
  choice: riche
  rationale: Le prédicat contraste fortement avec la pauvreté matérielle. Le laisser sans qualification préserve le paradoxe et l’implication d’une richesse d’un autre ordre.
- source_word: βλασφημίαν
  choice: calomnies
  rationale: Dans ce contexte, le mot désigne des paroles hostiles et diffamatoires prononcées contre les croyants. « Calomnies » communique ce sens en français courant, tandis que « blasphème » évoquerait surtout une offense directe à Dieu.
- source_word: ἐκ τῶν λεγόντων
  choice: de ceux qui se disent
  rationale: ἐκ indique la source des calomnies, et la tournure française « de ceux qui se disent » rend naturellement le participe et le réfléchi de la proposition suivante.
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: se disent juifs
  rationale: Cette formulation idiomatique conserve explicitement « juifs » et exprime la force réflexive de ἑαυτούς sans lourdeur.
- source_word: συναγωγὴ
  choice: synagogue
  rationale: Le mot peut désigner une assemblée, mais « synagogue » conserve ici la précision historique ainsi que la force polémique et ironique de l’expression.
- source_word: τοῦ Σατανᾶ
  choice: de Satan
  rationale: Le génitif est rendu directement, sans atténuer ni développer la caractérisation du texte.
theological_decisions:
- issue: La portée de l’expression concernant ceux qui « se disent juifs et ne le sont pas »
  choice: Conserver littéralement « juifs » et le contraste énoncé, sans ajouter de qualificatif.
  alternative: « ceux qui prétendent être le peuple de Dieu » ou « ceux qui se disent de vrais juifs »
  rationale: Ἰουδαίους est explicite. La traduction ne doit ni transformer l’énoncé en négation ethnique générale ni résoudre la question de l’authenticité d’alliance en ajoutant « vrais », absent du grec.
- issue: La nature de la richesse évoquée
  choice: Traduire simplement « tu es riche ».
  alternative: « tu es riche spirituellement »
  rationale: Le contexte suggère une richesse non matérielle, mais le grec ne la qualifie pas. L’ajout de « spirituellement » expliciterait une implication au lieu de préserver la formulation ouverte.
- issue: La caractérisation « synagogue de Satan »
  choice: Maintenir l’expression littérale dans le texte principal.
  alternative: « assemblée appartenant à Satan »
  rationale: La formulation littérale préserve la dureté polémique, la spécificité lexicale et l’ambiguïté du génitif sans l’interpréter davantage.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond aux formes grecques adressées à l’ange de l’Église. Les tirets mettent en relief la parenthèse paradoxale « pourtant tu es riche » sans expliquer la nature de cette richesse.
