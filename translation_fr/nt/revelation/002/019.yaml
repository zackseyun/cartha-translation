id: REV.2.19
reference: Revelation 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: fr
  text: Je connais tes œuvres, ton amour, ta foi[a], ton service et ta persévérance, et tes dernières œuvres sont plus nombreuses que les premières.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fidélité ». Le mot grec peut désigner ici soit la foi, soit la fidélité.
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: Je connais
  rationale: οἶδα a ici une valeur présente et stative. « Je connais » rend naturellement la formule répétée dans les messages aux assemblées de l’Apocalypse.
- source_word: ἔργα
  choice: œuvres
  rationale: ἔργα désigne les actes concrets évalués par le Christ. « Œuvres » conserve la répétition du terme dans le verset et son vocabulaire caractéristique dans l’Apocalypse.
- source_word: ἀγάπην
  choice: amour
  rationale: ἀγάπη désigne ici l’amour actif comme vertu chrétienne.
- source_word: πίστιν
  choice: foi
  rationale: πίστις peut exprimer ici la foi ou la fidélité. « Foi » est retenu dans le texte, tandis que l’autre possibilité est signalée en note afin de préserver l’ambiguïté.
- source_word: διακονίαν
  choice: service
  rationale: διακονία évoque ici le service concret. « Service » est clair en français moderne et n’introduit pas l’idée d’une fonction ecclésiale officielle.
- source_word: ὑπομονήν
  choice: persévérance
  rationale: ὑπομονή exprime la constance qui tient bon sous l’épreuve. « Persévérance » est naturel et courant dans ce contexte.
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: tes dernières œuvres
  rationale: ἔσχατα est ici temporel et oppose les œuvres plus tardives aux premières. « Dernières » maintient directement ce contraste.
- source_word: πλείονα τῶν πρώτων
  choice: sont plus nombreuses que les premières
  rationale: πλείονα est un comparatif pouvant indiquer une supériorité de nombre ou d’ampleur. Dans la construction avec ἔργα, « plus nombreuses » donne un sens clair sans effacer la progression constatée.
theological_decisions:
- issue: Sens de πίστις dans la liste des vertus
  choice: foi
  alternative: fidélité
  rationale: Dans ce contexte, πίστις peut désigner la confiance croyante ou la fidélité manifestée dans la conduite. Le texte retient « foi » sans trancher silencieusement la question, puisque « fidélité » est conservé en note.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement singulier correspond à l’adresse grecque à l’assemblée personnifiée. La structure accumulative de la liste est conservée, ainsi que la répétition d’« œuvres ».
