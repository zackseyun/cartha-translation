  timestamp: '2026-07-14T11:46:38Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est globalement bien rendu : l’impératif, la formule d’annonce, la main droite, les sept étoiles et le déplacement au milieu des sept λυχνίαι sont conservés. « Ange » maintient à juste titre l’ambiguïté de ἄγγελος, avec une note appropriée.'
  naturalness: « L’Église qui est à Éphèse » est grammatical mais moins naturel que « l’Église d’Éphèse ». « Porte-lampes » est compréhensible et précis, mais demeure peu idiomatique dans un français biblique moderne ; « chandeliers » est le terme français établi et désigne ici les supports des lampes, non les lampes elles-mêmes.
  terminology: « Église », « ange », « étoiles », « main droite » et « d’or » conviennent. « Chandeliers » préserve l’image cultuelle et apocalyptique traditionnelle tout en restant intelligible en français international. La note doit expliciter que l’alternative « messager » concerne l’ange de cette Église.
  issues:
  - severity: low
    issue: Localisation de l’Église formulée de manière lourde
    rationale: La construction grecque « de l’Église qui est à Éphèse » se rend plus naturellement en français par « de l’Église d’Éphèse », sans perte de sens.
  - severity: low
    issue: Terme « porte-lampes » peu idiomatique
    rationale: Bien qu’il vise justement le support de lampe, ce terme est rare. « Chandeliers » est un équivalent français établi pour λυχνίαι dans ce contexte et conserve l’imagerie de l’Apocalypse.
  - severity: low
    issue: Portée de l’alternative en note insuffisamment précisée
    rationale: « Ou “messager” » peut être compris de façon trop isolée ; préciser « messager de l’Église d’Éphèse » indique clairement la construction concernée.
