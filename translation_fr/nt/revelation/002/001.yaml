revisions:
- from: '« Écris à l’ange[a] de l’Église qui est à Éphèse : Voici ce que dit celui qui tient les sept étoiles dans sa main droite et qui marche au milieu des sept porte-lampes d’or : »'
  to: '« Écris à l’ange[a] de l’Église d’Éphèse : Voici ce que dit celui qui tient les sept étoiles dans sa main droite, celui qui marche au milieu des sept chandeliers d’or : »'
  rationale: La révision améliore l’idiomaticité française et précise la portée de la note, tout en conservant la syntaxe déclarative, l’imagerie et l’ambiguïté interprétative du grec. Le deux-points final est maintenu parce que la déclaration se poursuit au verset suivant.
