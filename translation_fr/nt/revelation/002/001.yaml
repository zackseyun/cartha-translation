  variant: modern international French
source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: fr
  text: '« Écris à l’ange[a] de l’Église d’Éphèse : Voici ce que dit celui qui tient les sept étoiles dans sa main droite, celui qui marche au milieu des sept chandeliers d’or : »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « messager de l’Église d’Éphèse ». Le grec ἄγγελος peut désigner un ange céleste ou un messager humain.
    reason: Le terme grec ἄγγελος est ambigu dans ce contexte ; la note préserve l’alternative sans décider de l’identité du référent.
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ange
  rationale: Le nom peut désigner un ange céleste ou un messager humain. « Ange » convient naturellement au cadre apocalyptique et préserve la lecture traditionnelle, tandis que l’autre sens est signalé en note.
- source_word: ἐκκλησίας
  choice: Église
  rationale: Dans ce contexte de communauté chrétienne locale, « Église » est l’équivalent courant et naturel. La tournure « qui est à Éphèse » conserve la structure localisante du grec.
- source_word: γράψον
  choice: Écris
  rationale: L’impératif rend directement et clairement l’ordre ponctuel adressé à Jean.
- source_word: Τάδε λέγει
  choice: Voici ce que dit
  rationale: Cette formulation française naturelle conserve la solennité de la formule prophétique sans reproduire une syntaxe grecque artificielle.
- source_word: κρατῶν
  choice: tient
  rationale: « Tient » préserve l’image concrète ainsi que l’idée de possession et de maîtrise, sans expliciter excessivement la force possible du verbe.
- source_word: δεξιᾷ
  choice: main droite
  rationale: Équivalent concret et traditionnel qui conserve les possibles connotations symboliques d’autorité et de protection.
- source_word: περιπατῶν ἐν μέσῳ
  choice: marche au milieu de
  rationale: Cette expression garde l’image vive du déplacement et rend naturellement l’idée de présence parmi les porte-lampes.
- source_word: λυχνιῶν
  choice: porte-lampes
  rationale: Le terme désigne les supports de lampes, non les lampes elles-mêmes. « Porte-lampes » est clair en français moderne et maintient l’imagerie du chapitre 1.
- source_word: χρυσῶν
  choice: d’or
  rationale: « D’or » est une formulation française naturelle et précise pour indiquer la matière ou l’apparence dorée des porte-lampes.
theological_decisions:
- issue: Référent de « l’ange de l’Église »
  choice: Conserver « ange » dans le texte principal
  alternative: messager
  rationale: Le grec ἄγγελος permet les deux sens. Le genre apocalyptique et l’imagerie céleste de l’Apocalypse favorisent « ange », mais l’identité du référent demeure discutée ; la note préserve donc l’ambiguïté sans la trancher.
translation_notes:
  register: Français international moderne, digne et accessible. La formule introductive garde un ton solennel, tandis que la syntaxe demeure naturelle. Le deux-points final est conservé puisque le verset introduit la déclaration qui suit.
