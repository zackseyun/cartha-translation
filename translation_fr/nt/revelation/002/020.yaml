id: REV.2.20
reference: Revelation 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: fr
  text: 'Mais j’ai ceci contre toi : tu tolères la femme Jézabel[a], qui se dit prophétesse[b], qui enseigne et égare[c] mes esclaves en les poussant à se livrer à l’immoralité sexuelle et à manger des aliments sacrifiés aux idoles.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « ta femme Jézabel » au lieu de « la femme Jézabel ».
    reason: textual_variant
  - marker: b
    text: 'Ou : « qui prétend être prophétesse ».'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « trompe ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque nettement le contraste avec les éloges qui précèdent, dans un français naturel.
- source_word: ἔχω κατὰ σοῦ
  choice: j’ai ceci contre toi
  rationale: Rend l’expression accusatrice grecque sans l’alourdir.
- source_word: ἀφεῖς
  choice: tu tolères
  rationale: Dans ce contexte, le verbe désigne le fait de laisser perdurer une conduite nuisible, et non le pardon.
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: cette femme, Jézabel
  rationale: Conserve la désignation féminine et le nom du texte principal sans adopter la variante « ta femme ».
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: qui se dit prophétesse
  rationale: Exprime avec concision le statut qu’elle s’attribue elle-même et conserve le féminin explicite du grec.
- source_word: διδάσκει
  choice: elle enseigne
  rationale: Le présent caractérise une activité en cours ou habituelle.
- source_word: πλανᾷ
  choice: égare
  rationale: Rend l’idée de détourner d’une conduite juste; « trompe » demeure une possibilité lexicale signalée en note.
- source_word: τοὺς ἐμοὺς δούλους
  choice: mes esclaves
  rationale: Préserve ici la force d’appartenance et d’allégeance portée par δοῦλος et renforcée par le possessif.
- source_word: πορνεῦσαι
  choice: se livrer à l’immoralité sexuelle
  rationale: Désigne largement les comportements sexuels illicites sans réduire indûment le champ du terme.
- source_word: φαγεῖν εἰδωλόθυτα
  choice: manger des aliments sacrifiés aux idoles
  rationale: Formulation claire pour la nourriture associée aux sacrifices idolâtres.
theological_decisions:
- issue: Identité de « Jézabel »
  choice: Conserver « Jézabel » sans préciser s’il s’agit d’un nom personnel littéral ou d’une désignation symbolique.
  alternative: Comprendre soit une femme portant réellement ce nom, soit une allusion symbolique à la Jézabel de l’Ancien Testament.
  rationale: Le verset ne tranche pas cette question; la traduction préserve donc l’ambiguïté.
- issue: Traduction de δοῦλος
  choice: mes esclaves
  alternative: mes serviteurs
  rationale: Dans la formule possessive « mes esclaves », l’appartenance au Christ est saillante; « esclaves » conserve plus directement cette force, malgré la plus grande douceur stylistique de « serviteurs ».
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases évite une longue accumulation tout en conservant les liens logiques du grec. « Immoralité sexuelle » est explicite sans être archaïque; « aliments sacrifiés aux idoles » reste immédiatement compréhensible.
