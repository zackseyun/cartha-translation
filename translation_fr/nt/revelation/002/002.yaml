id: REV.2.2
reference: Revelation 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: fr
  text: Je connais tes œuvres, ton labeur et ta persévérance, et je sais que tu ne peux supporter les gens mauvais[a]. Tu as mis à l’épreuve ceux qui se disent apôtres[b] et ne le sont pas, et tu as découvert que c’étaient de faux apôtres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tu ne peux tolérer les gens mauvais ». Le verbe grec signifie littéralement « porter, supporter » et prend ici le sens de ne pas accepter ces personnes.
    reason: alternative lexicale
  - marker: b
    text: Ou « ceux qui prétendent être apôtres ».
    reason: alternative lexicale
lexical_decisions:
- source_word: Οἶδα
  choice: Je connais
  rationale: Rend directement le verbe de connaissance au présent et conserve la force personnelle de l’évaluation du Christ.
- source_word: τὰ ἔργα σου
  choice: tes œuvres
  rationale: « Œuvres » garde le sens large des actions et de l’activité, tout en restant naturel dans le registre biblique français.
- source_word: τὸν κόπον
  choice: ton dur labeur
  rationale: κόπος désigne un travail pénible et exigeant ; « dur labeur » exprime cet effort sans réduire le terme au simple « travail ».
- source_word: τὴν ὑπομονήν σου
  choice: ta persévérance
  rationale: Le terme évoque la constance qui tient ferme sous l’épreuve. « Persévérance » est clair et courant en français moderne.
- source_word: οὐ δύνῃ βαστάσαι
  choice: tu ne peux supporter
  rationale: Conserve l’image de « porter/supporter » tout en exprimant idiomatiquement le refus ou l’incapacité de tolérer dans ce contexte.
- source_word: κακούς
  choice: les gens mauvais
  rationale: L’adjectif masculin pluriel est substantivé et désigne des personnes ; cette formulation ne lui impose pas un référent exclusivement masculin.
- source_word: ἐπείρασας
  choice: tu as mis à l’épreuve
  rationale: Exprime l’examen destiné à vérifier la validité de leur prétention, sans suggérer que l’Église les aurait tentés au mal.
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: ceux qui se disent apôtres
  rationale: Reproduit la valeur réflexive de ἑαυτούς et laisse entendre qu’il s’agit de leur propre prétention.
- source_word: ἀποστόλους
  choice: apôtres
  rationale: Dans ce contexte ecclésial, le titre technique est plus probable que le sens général de « messagers ».
- source_word: ψευδεῖς
  choice: faux
  rationale: Le qualificatif dénonce leur fausseté sans préciser au-delà du grec s’ils mentent consciemment ou sont simplement de faux prétendants.
theological_decisions:
- issue: Statut revendiqué par les personnes mises à l’épreuve
  choice: « apôtres », comme titre ecclésial revendiqué
  alternative: « envoyés » ou « messagers » au sens général
  rationale: Le contexte porte sur l’examen de personnes revendiquant une autorité dans les Églises. Le titre « apôtres » préserve le sens technique probable sans définir davantage la nature institutionnelle de leur prétention.
- issue: Portée de l’affirmation « ils étaient faux »
  choice: Conserver l’adjectif « faux »
  alternative: « menteurs » ou « imposteurs »
  rationale: « Menteurs » mettrait l’accent sur une tromperie consciente et « imposteurs » interpréterait explicitement leur fausse qualité. « Faux » maintient la formulation ouverte du texte grec.
- issue: Genre des personnes qualifiées de mauvaises
  choice: « les gens mauvais »
  alternative: « les hommes mauvais »
  rationale: Le masculin grec est ici substantivé pour désigner des personnes ; rien dans le verset n’exige un groupe exclusivement masculin.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond à l’adresse grecque à l’ange de l’Église. La coordination grecque répétée est légèrement allégée en trois phrases pour assurer une lecture naturelle, sans supprimer les éléments de l’énoncé.
