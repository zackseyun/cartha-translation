id: REV.2.25
reference: Revelation 2:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: fr
  text: Seulement[a], gardez fermement ce que vous avez jusqu’à ce que je vienne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Toutefois, gardez fermement ce que vous avez jusqu’à ce que je vienne. »'
    reason: πλὴν peut introduire soit une restriction (« seulement »), soit une réserve adversative (« toutefois »).
lexical_decisions:
- source_word: πλὴν
  choice: Cependant
  rationale: Le terme introduit ici une restriction ou une réserve par rapport à ce qui précède. « Cependant » exprime naturellement cette nuance adversative, tandis que « Seulement » demeure une possibilité lexicale signalée en note.
- source_word: ὃ ἔχετε
  choice: ce que vous avez
  rationale: Le relatif neutre suivi de ἔχετε désigne de manière générale ce que les destinataires possèdent déjà. Cette formulation est idiomatique, claire et ne précise pas indûment la nature de ce bien.
- source_word: κρατήσατε
  choice: tenez fermement
  rationale: L’impératif de κρατέω appelle les destinataires à conserver avec fermeté ce qu’ils ont. « Tenez fermement » garde l’image de la prise et la force de l’exhortation.
- source_word: ἄχρι οὗ ἂν
  choice: jusqu’à ce que
  rationale: Cette construction fixe comme limite future le moment de la venue du locuteur. « Jusqu’à ce que » en rend naturellement la valeur temporelle en français.
- source_word: ἥξω
  choice: je vienne
  rationale: Le verbe exprime la venue ou l’arrivée. Dans ce contexte, « je vienne » conserve la résonance eschatologique possible sans déterminer la nature ni le moment de cette venue.
theological_decisions:
- issue: La venue de Jésus désigne-t-elle précisément sa venue eschatologique finale ou une intervention en jugement auprès de cette Église ?
  choice: jusqu’à ce que je vienne
  alternative: jusqu’à ce que je vienne pour juger ; jusqu’à mon retour final
  rationale: Le grec ne précise ni la modalité ni le moment de la venue. La traduction maintient donc cette ouverture interprétative au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et direct. Le pluriel de l’impératif est conservé. « Tenez fermement » reste compréhensible tout en maintenant la vigueur exhortative du grec.
