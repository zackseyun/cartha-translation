source:
  edition: SBLGNT
  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: fr
  text: Il saisit le dragon — le serpent ancien[a], qui est le Diable et Satan — et le lia pour mille ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’ancien serpent » ou « ce serpent d’autrefois ».'
    reason: Alternative lexicale pour ὁ ὄφις ὁ ἀρχαῖος, dont l’apposition peut être formulée de plusieurs manières naturelles en français.
lexical_decisions:
- source_word: ἐκράτησεν
  choice: saisit
  rationale: Le verbe exprime ici une prise ferme et décisive. « Saisit » est vif, naturel et conserve la force de l’action.
- source_word: δράκοντα
  choice: dragon
  rationale: Équivalent usuel dans le contexte apocalyptique, qui préserve l’image et la continuité interne de l’Apocalypse.
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: le serpent ancien
  rationale: Cette apposition identifie le dragon. La formulation conserve les deux articles grecs sans ajouter un démonstratif absent du texte; une variante française plus idiomatique est signalée en note.
- source_word: Διάβολος
  choice: le Diable
  rationale: Le titre est naturellement précédé de l’article en français et reçoit une majuscule comme désignation personnelle.
- source_word: Σατανᾶς
  choice: Satan
  rationale: Translittération française traditionnelle du nom ou titre personnel.
- source_word: ἔδησεν
  choice: enchaîna
  rationale: Le verbe signifie littéralement « lier ». Dans cette scène d’emprisonnement, « enchaîna » conserve l’image concrète et produit une formulation française naturelle, sans préciser davantage la nature de la contrainte.
- source_word: χίλια ἔτη
  choice: pour mille ans
  rationale: L’accusatif de durée est rendu naturellement par « pour ». La quantité est traduite directement, sans interprétation.
theological_decisions:
- issue: Nature des mille ans
  choice: Rendre χίλια ἔτη directement par « mille ans » sans préciser si la période est littérale ou symbolique.
  alternative: Interpréter explicitement la période comme un millénaire littéral ou comme une durée figurée.
  rationale: La traduction conserve la formulation et la tension théologique du texte sans trancher entre les lectures millénaristes.
- issue: Identification du dragon
  choice: 'Conserver toute la chaîne d’identifications : « le dragon — le serpent ancien, qui est le Diable et Satan ».'
  alternative: Réduire les désignations à une seule ou reformuler leur relation.
  rationale: Le verset identifie explicitement le dragon au serpent ancien, au Diable et à Satan; toutes ces désignations doivent être préservées.
translation_notes:
  register: Français international moderne, digne et accessible. Les tirets marquent clairement l’apposition explicative. « Enchaîna » maintient l’image concrète de la captivité; « mille ans » reste volontairement non interprété.
