id: REV.20.10
reference: Revelation 20:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: fr
  text: Et le diable, celui qui les égarait, fut jeté dans l’étang de feu et de soufre, où se trouvent aussi la bête et le faux prophète. Ils seront tourmentés jour et nuit, pour toujours et à jamais.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour les âges des âges », expression intensive indiquant ici une durée sans fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: le diable
  rationale: Dans l’Apocalypse, le terme fonctionne comme la désignation personnelle établie de Satan. « Le diable » est la formulation française courante et directe.
- source_word: ὁ πλανῶν αὐτοὺς
  choice: celui qui les égarait
  rationale: Le participe présent substantivé désigne le diable par son activité continue. L’imparfait français situe cette activité durative dans le déroulement du récit, tandis qu’« égarer » conserve l’idée de tromper et de conduire hors du droit chemin.
- source_word: ἐβλήθη
  choice: fut jeté
  rationale: Le passif exprime ici le fait d’être précipité de force dans le lieu du jugement. Le passé simple convient au récit solennel sans être archaïque dans ce registre écrit.
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: l’étang de feu et de soufre
  rationale: θεῖον désigne le soufre. « Étang » est le terme français biblique établi pour λίμνη et garde l’image d’une étendue de feu, tandis que « soufre » est moderne et précis.
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: où se trouvent aussi la bête et le faux prophète
  rationale: La proposition grecque ne comporte pas de verbe exprimé. « Se trouvent » complète naturellement la phrase en français et rend la présence continue suggérée par le contexte, sans faire du présent un élément explicitement formulé en grec.
- source_word: θηρίον
  choice: la bête
  rationale: Équivalent direct et désignation apocalyptique consacrée dans le contexte de l’Apocalypse.
- source_word: ψευδοπροφήτης
  choice: le faux prophète
  rationale: Équivalent lexical direct et titre établi de cette figure apocalyptique.
- source_word: βασανισθήσονται
  choice: ils seront tourmentés
  rationale: Le verbe désigne un tourment intense dans ce contexte de jugement. « Tourmentés » est idiomatique et évite de préciser un procédé que le texte ne décrit pas.
- source_word: ἡμέρας καὶ νυκτός
  choice: jour et nuit
  rationale: Expression idiomatique indiquant une continuité incessante.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  rationale: Cette formulation française naturelle rend l’expression grecque intensive qui signifie littéralement « pour les âges des âges » et présente ici une durée sans fin.
theological_decisions:
- issue: Durée du tourment exprimée par εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  alternative: pour les âges des âges
  rationale: Le texte principal donne l’équivalent idiomatique français le plus naturel de cette formule grecque intensive, sans en atténuer la portée. Une note conserve sa forme plus littérale afin de rendre visible l’expression source sans trancher des débats doctrinaux plus larges.
- issue: Verbe sous-entendu dans ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: où se trouvent aussi la bête et le faux prophète
  alternative: où étaient aussi la bête et le faux prophète
  rationale: Le grec omet le verbe. Le présent « se trouvent » correspond le mieux au contexte immédiat, où ces deux figures ont déjà été jetées dans l’étang et y sont encore, tout en signalant dans l’analyse que le temps verbal n’est pas explicite dans la proposition grecque.
- issue: Référent du pluriel βασανισθήσονται
  choice: Ils seront tourmentés
  alternative: Tous trois seront tourmentés
  rationale: Le pluriel renvoie naturellement au diable, à la bête et au faux prophète. Le simple pronom « ils » préserve la formulation du texte sans ajouter une explicitation numérique.
translation_notes:
  register: Français international moderne, digne et lisible. Le passé simple maintient la tonalité narrative solennelle; le reste de la syntaxe demeure courant. La seule note porte sur l’idiome temporel grec. Les marqueurs et notes de la couche anglaise semblent décalés par rapport à son texte; le projet français rattache donc la note au segment qu’elle explique réellement.
