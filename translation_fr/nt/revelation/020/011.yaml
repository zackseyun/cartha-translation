id: REV.20.11
reference: Revelation 20:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: fr
  text: Puis je vis un grand trône blanc et celui qui y siégeait, devant qui[a] la terre et le ciel s’enfuirent ; aucune place ne fut trouvée pour eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de sa face » ou « de la face de qui ».'
    reason: La note conserve l’image concrète de πρόσωπον, « face », tandis que le texte principal emploie une tournure française plus naturelle pour exprimer la fuite devant sa présence.
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: Puis je vis
  rationale: Dans cette succession de visions, « Puis » rend naturellement la valeur narrative de καί, tandis que « je vis » conserve l’aoriste et la formule visionnaire.
- source_word: θρόνον μέγαν λευκὸν
  choice: un grand trône blanc
  rationale: Cette formulation française naturelle conserve à la fois la grandeur du trône et sa couleur, sans réduire μέγαν au seul sens matériel de « vaste ».
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: celui qui y siégeait
  rationale: « Siégeait » convient au contexte d’un trône et garde l’identité du personnage implicite, comme dans le grec.
- source_word: ἀπὸ τοῦ προσώπου
  choice: devant qui
  rationale: Cette tournure idiomatique exprime le mouvement de fuite provoqué par la présence du personnage assis sur le trône. Le sens concret de « face » est conservé en note.
- source_word: ἔφυγεν
  choice: s’enfuirent
  rationale: Le pluriel français s’accorde avec « la terre et le ciel » et préserve l’image vive d’une fuite plutôt que de l’interpréter comme une simple disparition.
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: la terre et le ciel
  rationale: Les deux noms sont rendus avec leurs articles. « Ciel » convient mieux que « firmament » ou « atmosphère » au contexte apocalyptique.
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: aucune place ne fut trouvée pour eux
  rationale: La formulation conserve le passif solennel du grec et laisse « eux » renvoyer conjointement à la terre et au ciel.
theological_decisions:
- issue: Identité de celui qui siège sur le trône
  choice: La traduction le désigne seulement comme « celui qui y siégeait ».
  alternative: L’identifier explicitement comme Dieu, le Père ou le Messie.
  rationale: Le verset ne nomme pas le personnage assis sur le trône. La traduction préserve cette réserve et n’impose aucune identification doctrinale.
translation_notes:
  register: Français international moderne, solennel mais accessible. « Siégeait » soutient l’imagerie royale sans archaïsme marqué. Le point-virgule distingue clairement les deux propositions tout en maintenant leur étroite unité.
