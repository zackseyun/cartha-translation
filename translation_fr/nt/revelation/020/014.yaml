id: REV.20.14
reference: Revelation 20:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: fr
  text: La Mort et le séjour des morts[a] furent jetés dans le lac de feu. C’est la seconde mort — le lac de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « l’Hadès ». Ici, le terme grec désigne le séjour des morts et se distingue du « lac de feu » ; le traduire par « l’enfer » pourrait donc prêter à confusion.
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: la Mort / la mort
  rationale: La majuscule dans la première proposition signale la personnification apocalyptique de la Mort, associée au séjour des morts et jetée dans le lac. Dans « la seconde mort », la minuscule convient à la désignation d’un jugement ou d’une réalité, sans personnification supplémentaire.
- source_word: ᾅδης
  choice: le séjour des morts
  rationale: Cette expression française courante rend le domaine des morts tout en évitant de le confondre avec le châtiment final représenté ici par le lac de feu. Une note conserve le lien avec le terme grec « Hadès ».
- source_word: ἐβλήθησαν
  choice: furent jetés
  rationale: Le passif rend l’action subie et l’idée d’une mise à l’écart énergique. Le passé simple convient au registre narratif solennel de l’Apocalypse sans être archaïque.
- source_word: λίμνη τοῦ πυρός
  choice: lac de feu
  rationale: Traduction directe de la construction grecque, qui conserve l’image apocalyptique et sa répétition.
- source_word: οὗτος
  choice: C’est
  rationale: Le présentatif français exprime naturellement l’identification marquée par le démonstratif grec, sans la paraphraser par « cela signifie ».
- source_word: θάνατος ὁ δεύτερος
  choice: la seconde mort
  rationale: Formulation française naturelle qui conserve l’expression apocalyptique technique et l’article défini.
- source_word: ἡ λίμνη τοῦ πυρός
  choice: le lac de feu
  rationale: La répétition est maintenue afin de refléter l’insistance du grec et l’identification finale.
theological_decisions:
- issue: Traduction de ᾅδης dans le contexte du jugement final
  choice: le séjour des morts
  alternative: l’Hadès ; l’enfer ; la tombe
  rationale: Le texte distingue explicitement le ᾅδης du lac de feu. « L’enfer » risquerait de fondre les deux images en une seule, tandis que « la tombe » réduirait le terme au lieu d’inhumation. « Le séjour des morts » préserve la distinction sans imposer un modèle doctrinal précis.
- issue: Personnification de θάνατος
  choice: « la Mort » dans la première proposition, puis « la mort » dans « la seconde mort »
  alternative: La minuscule partout ; la majuscule partout
  rationale: La première occurrence agit comme une réalité personnifiée, en parallèle avec le séjour des morts. La seconde nomme le jugement appelé « seconde mort ». Cette distinction typographique rend l’effet littéraire sans ajouter de doctrine.
- issue: Rapport entre « la seconde mort » et « le lac de feu »
  choice: Identification conservée au moyen d’un tiret
  alternative: Deux-points ; virgule ; « le lac de feu est la seconde mort »
  rationale: Le tiret rend en français naturel l’apposition et l’identification du grec, tout en conservant son ordre et sa tension syntaxique plutôt qu’en réorganisant entièrement la proposition.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple soutient la narration visionnaire. La majuscule à « Mort » marque discrètement la personnification, et le tiret final rend l’apposition grecque de façon lisible.
