    text: Ou « le gouffre sans fond ».
    reason: lexical_alternative
  - marker: b
    text: Ou « afin qu’il n’égare plus les nations ».
    reason: lexical_alternative
  - marker: c
    text: Ou « il doit être libéré pour un court moment ».
    reason: lexical_alternative
  revision_rationale: La révision améliore la précision de πλανάω et clarifie la séquence « fermer/sceller » sans ajouter d’interprétation. Elle conserve l’ambiguïté théologique relative aux mille ans et à la nécessité exprimée par δεῖ, ainsi que les trois ancres de notes.
