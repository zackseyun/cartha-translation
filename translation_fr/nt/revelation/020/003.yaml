id: REV.20.3
reference: Revelation 20:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: fr
  text: Il le jeta dans l’abîme[a]. Il la ferma et la scella sur lui, afin qu’il ne trompe plus les nations[b] jusqu’à ce que les mille ans soient achevés. Après cela, il doit être relâché pour peu de temps[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le gouffre sans fond ».
    reason: lexical_alternative
  - marker: b
    text: Ou « afin qu’il n’égare plus les nations ».
    reason: lexical_alternative
  - marker: c
    text: Ou « il doit être libéré pour un court moment ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: jeta
  rationale: Le passé simple de « jeter » restitue avec naturel et vigueur l’action ponctuelle et forcée exprimée par βάλλω, dans un registre narratif digne.
- source_word: ἄβυσσον
  choice: abîme
  rationale: « Abîme » est le terme apocalyptique établi en français et conserve la portée conceptuelle du grec sans ajouter l’image interprétative d’un puits sans fond.
- source_word: ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: qu’il ferma et scella au-dessus de lui
  rationale: Le pronom relatif « que » explicite naturellement en français que l’abîme est fermé, tandis que « au-dessus de lui » préserve la relation spatiale de ἐπάνω αὐτοῦ.
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: afin qu’il ne séduise plus les nations
  rationale: « Séduire » exprime ici le fait de tromper et d’égarer, sens courant de πλανάω dans l’Apocalypse; « ne… plus » rend ἔτι sous la négation.
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: jusqu’à ce que les mille ans soient achevés
  rationale: Cette formulation garde la limite temporelle et la valeur d’accomplissement du passif τελεσθῇ, sans interpréter la nature des mille ans.
- source_word: μετὰ ταῦτα
  choice: Après cela
  rationale: Formulation française naturelle qui conserve clairement la transition temporelle du grec.
- source_word: δεῖ
  choice: il faut
  rationale: « Il faut » rend la nécessité exprimée par δεῖ sans en préciser la source ou le mécanisme.
- source_word: λυθῆναι αὐτὸν
  choice: qu’il soit relâché
  rationale: « Relâché » rend le passif de λύω dans le contexte d’une libération hors de l’enfermement, sans suggérer qu’il se libère lui-même.
- source_word: μικρὸν χρόνον
  choice: pour un peu de temps
  rationale: Cette expression naturelle conserve l’idée d’une durée limitée sans la quantifier davantage.
theological_decisions:
- issue: Nature des « mille ans »
  choice: Conserver simplement « les mille ans »
  alternative: Préciser qu’il s’agit d’un millénium littéral ou d’une longue période symbolique
  rationale: Le grec ne tranche pas explicitement entre les lectures eschatologiques; la traduction maintient donc cette ouverture.
- issue: Portée de δεῖ
  choice: Traduire par « il faut »
  alternative: Expliciter un décret divin ou une simple nécessité narrative
  rationale: Le texte affirme une nécessité sans en définir ici la nature exacte; « il faut » en préserve la force et l’ambiguïté.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit littéraire de l’Apocalypse. La syntaxe reste proche du grec tout en évitant une tournure artificielle; aucune lecture particulière du millénium ni de la nécessité exprimée par δεῖ n’est imposée.
