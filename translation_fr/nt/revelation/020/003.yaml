revisions:
- from: Il le jeta dans l’abîme[a], qu’il ferma et scella au-dessus de lui, afin qu’il ne séduise plus les nations[b] jusqu’à ce que les mille ans soient achevés. Après cela, il faut qu’il soit relâché pour un peu de temps[c].
  to: Il le jeta dans l’abîme[a]. Il la ferma et la scella sur lui, afin qu’il ne trompe plus les nations[b] jusqu’à ce que les mille ans soient achevés. Après cela, il doit être relâché pour peu de temps[c].
  rationale: La révision améliore la précision de πλανάω et clarifie la séquence « fermer/sceller » sans ajouter d’interprétation. Elle conserve l’ambiguïté théologique relative aux mille ans et à la nécessité exprimée par δεῖ, ainsi que les trois ancres de notes.
