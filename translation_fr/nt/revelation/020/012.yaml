id: REV.20.12
reference: Revelation 20:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: fr
  text: 'Et je vis les morts, les grands et les petits, debout devant le trône. Des livres furent ouverts. Puis un autre livre fut ouvert : le livre de vie. Et les morts furent jugés d’après ce qui était écrit dans les livres[a], selon leurs œuvres[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les « livres » pouvaient être des rouleaux dans le contexte antique.
    reason: cultural_note
  - marker: b
    text: 'Ou : « selon leurs actes » ou « selon ce qu’ils avaient fait ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: les morts
  rationale: L’adjectif substantivé désigne collectivement les personnes décédées. « Les morts » est idiomatique, concis et solennel en français.
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: les grands et les petits
  rationale: Cette expression forme un mérisme englobant tous les rangs et toutes les conditions. La formulation française reste proche du grec sans expliciter davantage que le texte.
- source_word: ἑστῶτας
  choice: debout
  rationale: Le participe parfait exprime ici l’état dans lequel ils se trouvent devant le trône. « Debout » rend naturellement cette posture.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: devant le trône
  rationale: Traduction directe de l’expression de présence. « Tribunal » ajouterait une interprétation absente du nom θρόνος.
- source_word: βιβλία
  choice: livres
  rationale: βιβλίον peut désigner un livre ou un rouleau. « Livres » est clair et assez large dans le texte principal; une note signale le support antique possible.
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: furent ouverts / fut ouvert
  rationale: Les passifs aoristes d’ἀνοίγω indiquent simplement l’ouverture. « Desceller » serait trop précis.
- source_word: ἄλλο βιβλίον
  choice: un autre livre
  rationale: ἄλλο introduit un livre supplémentaire, distinct des premiers.
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: le livre de vie
  rationale: La construction grecque est elliptique et sous-entend βιβλίον. Le français doit reprendre « livre »; la formulation concise après les deux-points exprime fidèlement l’identification.
- source_word: ἐκρίθησαν
  choice: furent jugés
  rationale: κρίνω a ici un sens judiciaire. « Jugés » conserve ce sens sans préjuger du verdict, contrairement à « condamnés ».
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: d’après ce qui était écrit dans les livres
  rationale: ἐκ présente le contenu consigné comme fondement du jugement. « D’après » est naturel en français et maintient ce rapport sans surtraduire le parfait.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: selon leurs œuvres
  rationale: « Œuvres » conserve le sens large des actions ainsi que les résonances bibliques de ἔργα. La note donne l’équivalent français plus courant « actes ».
theological_decisions:
- issue: Le jugement selon les œuvres
  choice: selon leurs œuvres
  alternative: selon leurs actes / selon ce qu’ils avaient fait
  rationale: Le texte affirme explicitement que le jugement est conforme aux œuvres. La traduction préserve cette tension théologique sans l’atténuer ni l’expliquer à partir d’une synthèse doctrinale extérieure.
translation_notes:
  register: Français international moderne, digne et accessible. Les phrases sont légèrement segmentées pour une lecture naturelle, tout en conservant l’enchaînement visionnaire. « Puis » rend le second καί comme progression discursive plutôt que par une répétition lourde de « et ». Tous les marqueurs de note figurent dans le texte.
