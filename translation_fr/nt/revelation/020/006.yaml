id: REV.20.6
reference: Revelation 20:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: fr
  text: Heureux et saint est celui qui a part à la première résurrection. Sur eux, la seconde mort n’a aucune autorité, mais ils seront prêtres de Dieu et du Messie[a], et ils régneront avec lui pendant mille ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du Christ ». Le titre grec Χριστός signifie « Messie ».
    reason: Signale l’équivalent traditionnel du titre grec tout en expliquant le choix retenu dans le texte.
lexical_decisions:
- source_word: μακάριος
  choice: Heureux
  rationale: Formule naturelle des béatitudes en français biblique moderne; elle exprime la condition favorable proclamée plutôt qu’un simple sentiment de bonheur.
- source_word: ἅγιος
  choice: saint
  rationale: Rend directement le statut de consécration exprimé par ἅγιος, sans le réduire à une qualité morale.
- source_word: ὁ ἔχων μέρος
  choice: celui qui a part
  rationale: Expression française idiomatique qui conserve le singulier représentatif et l’idée de participation.
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: à la première résurrection
  rationale: En français, « avoir part à » est la construction naturelle; « première résurrection » conserve sans l’expliquer la formulation apocalyptique.
- source_word: ἐπὶ τούτων
  choice: Sur ceux-là
  rationale: Conserve la reprise démonstrative et la nuance de domination ou de juridiction associée à ἐπί avec le génitif.
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: n’a aucune autorité
  rationale: ἐξουσία désigne ici l’autorité ou la juridiction davantage que la seule puissance; « aucune » donne une négation française nette.
- source_word: ἱερεῖς
  choice: prêtres
  rationale: Équivalent direct qui maintient l’imagerie cultuelle et sacerdotale.
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: de Dieu et du Messie
  rationale: Χριστός garde ici sa valeur de titre dans une construction formelle coordonnée avec « Dieu »; « Messie » rend explicitement cette valeur.
- source_word: βασιλεύσουσιν
  choice: ils régneront
  rationale: Équivalent français concis qui préserve l’idée de participation au règne.
- source_word: μετ’ αὐτοῦ χίλια ἔτη
  choice: avec lui pendant mille ans
  rationale: « Pendant » explicite naturellement la durée indiquée par l’accusatif χίλια ἔτη, sans imposer d’interprétation du millénium.
theological_decisions:
- issue: Traduction de Χριστός
  choice: Messie
  alternative: Christ
  rationale: Dans « de Dieu et du Χριστός », le terme fonctionne nettement comme un titre. « Messie » en préserve le sens, tandis qu’une note signale l’équivalent traditionnel sans trancher au-delà du grec.
- issue: Nature de la première résurrection
  choice: première résurrection
  alternative: interprétation spirituelle ou corporelle explicitée
  rationale: Le texte nomme la réalité sans en préciser ici la nature; la traduction préserve cette tension exégétique.
- issue: Durée millénaire
  choice: pendant mille ans
  alternative: lecture symbolique ou strictement chronologique explicitée
  rationale: La durée formulée par le texte est conservée telle quelle, sans importer de système eschatologique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du grec, notamment par « Sur ceux-là », tout en employant des tournures françaises naturelles comme « avoir part à » et « pendant mille ans ».
