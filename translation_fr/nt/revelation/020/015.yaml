id: REV.20.15
reference: Revelation 20:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: fr
  text: Et si quelqu’un ne fut pas trouvé inscrit dans le livre de vie[a], il fut jeté dans l’étang de feu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans le rouleau de vie ». Le mot grec peut désigner un livre ou un rouleau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: si quelqu’un
  rationale: Cette tournure conditionnelle indéfinie exprime naturellement en français un cas général sans transformer la condition en proposition relative.
- source_word: οὐχ εὑρέθη
  choice: ne fut pas trouvé
  rationale: Le passif aoriste de εὑρίσκω est rendu directement et conserve la tonalité judiciaire du contexte.
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: dans le livre de vie
  rationale: βίβλος peut désigner un livre ou un rouleau. « Livre de vie » est une formulation française claire, naturelle et bien établie dans ce contexte apocalyptique.
- source_word: γεγραμμένος
  choice: inscrit
  rationale: Le participe parfait passif indique que le nom de la personne figure dans le livre. « Inscrit » est plus idiomatique en français que « écrit » pour une personne enregistrée dans un registre, tout en conservant l’état résultant du parfait.
- source_word: ἐβλήθη
  choice: fut jeté
  rationale: Le passif aoriste de βάλλω exprime l’action de jeter; cette formulation moderne conserve sa force sans la renforcer abusivement.
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: dans l’étang de feu
  rationale: Cette traduction directe préserve l’image apocalyptique sans en proposer d’interprétation doctrinale.
- source_word: τις ... γεγραμμένος / ἐβλήθη
  choice: quelqu’un ... il fut jeté
  rationale: Le pronom « il » reprend naturellement en français le pronom indéfini singulier « quelqu’un » et respecte la construction représentative au masculin singulier du grec.
theological_decisions:
- issue: Masculin singulier représentatif
  choice: il fut jeté
  alternative: cette personne fut jetée
  rationale: Le grec emploie un référent indéfini avec un participe masculin singulier et un verbe au singulier. Le français reprend naturellement « quelqu’un » par « il », sans affirmer que le jugement ne concernerait que des hommes.
- issue: Image du jugement final
  choice: l’étang de feu
  alternative: le lac de feu
  rationale: La métaphore est conservée telle quelle, sans expliciter la nature du châtiment final. « Étang de feu » rend λίμνη de manière naturelle et correspond à l’usage français établi dans l’Apocalypse.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif solennel de l’Apocalypse. La syntaxe reste proche du grec sans devenir artificielle.
