id: REV.20.13
reference: Revelation 20:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: fr
  text: Et la mer rendit les morts qui étaient en elle, et la Mort et le séjour des morts[a] rendirent les morts qui étaient en eux. Chacun fut jugé selon ses œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’Hadès ». Le mot grec ᾅδης désigne le séjour des morts et se distingue des termes souvent traduits par « enfer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: rendit / rendirent
  rationale: Dans ce contexte, « rendre les morts » exprime naturellement en français le fait que la mer, la Mort et le séjour des morts les livrent en vue du jugement, tout en restant proche du sens de δίδωμι.
- source_word: ἡ θάλασσα
  choice: la mer
  rationale: Équivalent français direct, avec l’article défini du grec.
- source_word: τοὺς νεκρούς
  choice: les morts
  rationale: Le substantif adjectival grec se rend idiomatiquement et dignement par « les morts ».
- source_word: τοὺς ἐν αὐτῇ
  choice: qui étaient en elle
  rationale: La proposition relative explicite en français le groupe grec qui identifie les morts se trouvant dans la mer.
- source_word: ὁ θάνατος
  choice: la Mort
  rationale: La majuscule signale la personnification apocalyptique, sans ajouter de précision doctrinale.
- source_word: ὁ ᾅδης
  choice: le séjour des morts
  rationale: Cette expression française transmet le sens de ᾅδης sans le confondre avec la géhenne ou avec le châtiment final. Elle est plus immédiatement intelligible que la translittération « Hadès ».
- source_word: τοὺς ἐν αὐτοῖς
  choice: qui étaient en eux
  rationale: Le masculin pluriel « eux » reprend conjointement la Mort et le séjour des morts et conserve le pluriel du grec.
- source_word: ἐκρίθησαν ἕκαστος
  choice: Chacun fut jugé
  rationale: La formulation française rend clairement la valeur distributive de ἕκαστος tout en conservant le passif du grec.
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: selon ses œuvres
  rationale: « Œuvres » préserve le terme biblique ἔργα et « ses » s’accorde avec le distributif singulier « chacun », sans changer le sens collectif du référent.
theological_decisions:
- issue: Traduction de ᾅδης dans le contexte du jugement final
  choice: le séjour des morts
  alternative: l’Hadès ; l’enfer
  rationale: « Le séjour des morts » maintient la distinction lexicale entre ᾅδης et les termes désignant le châtiment final. « L’enfer » importerait une identification que le grec n’impose pas.
- issue: Personnification de θάνατος
  choice: la Mort
  alternative: la mort
  rationale: La majuscule rend visible la personnification de la Mort, présentée avec le séjour des morts comme une puissance qui restitue ses morts.
- issue: Critère du jugement exprimé par κατὰ τὰ ἔργα αὐτῶν
  choice: selon ses œuvres
  alternative: d’après ce qu’il avait fait ; selon ses actes
  rationale: La traduction conserve l’expression du texte sans expliquer la relation théologique entre les œuvres et le jugement ni la réduire à une doctrine particulière.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique. La coordination répétée conserve le rythme solennel du grec, tandis que la dernière phrase détachée clarifie la portée distributive de « chacun ».
