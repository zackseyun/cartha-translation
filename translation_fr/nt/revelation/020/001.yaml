id: REV.20.1
reference: Revelation 20:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: fr
  text: Et je vis un ange descendre du ciel, tenant à la main la clé de l’abîme[a] et une grande chaîne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le puits sans fond ». Le grec porte « l’abîme ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: Puis
  rationale: Dans la succession des visions, « Puis » rend naturellement le lien narratif sans alourdir la phrase; il marque la continuation plutôt qu’une stricte simultanéité.
- source_word: εἶδον
  choice: je vis
  rationale: Le passé simple convient au récit visionnaire écrit dans un registre digne et rend directement l’aoriste grec.
- source_word: ἄγγελον
  choice: un ange
  rationale: Le contexte céleste désigne clairement un être angélique, et non simplement un messager humain.
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: qui descendait du ciel
  rationale: Cette formulation française naturelle conserve le mouvement en cours exprimé par le participe présent et son origine céleste.
- source_word: ἔχοντα
  choice: tenant à la main
  rationale: « Tenant » rend le participe, tandis que « à la main » exprime idiomatiquement l’image précisée ensuite par ἐπὶ τὴν χεῖρα αὐτοῦ.
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: la clé de l’abîme
  rationale: Le complément français « de l’abîme » conserve naturellement le génitif grec et indique la clé associée à son accès.
- source_word: ἅλυσιν μεγάλην
  choice: une grande chaîne
  rationale: Traduction directe qui préserve l’ampleur de l’image apocalyptique sans ajouter l’idée plus précise de poids ou de masse.
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: à la main
  rationale: L’expression française indique naturellement que l’ange porte les objets dans sa main, sans reproduire maladroitement la préposition grecque par « sur ».
theological_decisions:
- issue: Sens de ἄβυσσος dans le contexte apocalyptique
  choice: abîme
  alternative: puits sans fond
  rationale: « Abîme » correspond directement au terme grec et préserve l’indétermination de l’image, tandis que « puits sans fond » l’explicite davantage que le texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple soutient le registre narratif biblique sans archaïsme marqué. La structure reste concise et conserve l’enchaînement visionnaire ainsi que l’imagerie du grec.
