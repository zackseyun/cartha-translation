id: REV.20.4
reference: Revelation 20:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: fr
  text: Puis je vis des trônes, et ils s’y assirent ; le jugement leur fut donné. Je vis aussi les âmes de ceux qui avaient été décapités à cause du témoignage de Jésus[a] et à cause de la parole de Dieu, ainsi que ceux qui n’avaient adoré ni la bête ni son image et n’avaient pas reçu la marque sur le front ni sur la main. Ils revinrent à la vie et régnèrent avec le Messie[b] pendant mille ans.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression grecque « le témoignage de Jésus » peut désigner soit le témoignage rendu par Jésus, soit le témoignage au sujet de Jésus.
    reason: alternative_reading
  - marker: b
    text: Ou « avec le Christ ». Le titre grec Χριστός est rendu ici par « Messie ».
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: trônes
  rationale: Équivalent concret et direct, conforme au registre visionnaire de l’Apocalypse.
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: ils s’y assirent
  rationale: La forme active et le sujet pluriel implicite sont conservés sans identifier les personnes concernées.
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: le jugement leur fut donné
  rationale: Cette formulation garde ouverte la question de savoir s’il s’agit de l’autorité de juger, de l’acte judiciaire ou de son résultat.
- source_word: ψυχὰς
  choice: âmes
  rationale: Le terme préserve l’imagerie apocalyptique et la distinction narrative entre leur mort antérieure et leur retour à la vie.
- source_word: πεπελεκισμένων
  choice: avaient été décapités
  rationale: Rend précisément le mode d’exécution sans alourdir le texte par la mention explicite de la hache.
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: à cause du témoignage de Jésus
  rationale: La valeur causale de διά est exprimée, tandis que le génitif reste volontairement ambigu.
- source_word: οἵτινες
  choice: ainsi que ceux qui
  rationale: La rupture grammaticale entre le génitif précédent et ce relatif nominatif est rendue comme l’introduction d’un groupe associé, sans fusion interprétative forcée.
- source_word: προσεκύνησαν
  choice: avaient adoré
  rationale: Le plus-que-parfait situe naturellement ce refus avant le retour à la vie, et « adorer » exprime la portée cultuelle du verbe.
- source_word: χάραγμα
  choice: marque
  rationale: Terme clair et consacré dans le contexte de l’Apocalypse, sans préciser indûment la nature matérielle du signe.
- source_word: ἔζησαν
  choice: revinrent à la vie
  rationale: Exprime la valeur événementielle du verbe dans ce contexte sans définir davantage la nature de cette reprise de vie.
- source_word: χριστοῦ
  choice: Messie
  rationale: Χριστός fonctionne ici comme un titre ; « Messie » en rend le sens plutôt que de le traiter comme un nom propre.
theological_decisions:
- issue: Identité du sujet de ἐκάθισαν et des bénéficiaires du jugement
  choice: 'Le sujet reste indéfini : « ils » et « leur ».'
  alternative: Identifier explicitement les personnes assises comme les martyrs, tous les saints ou des membres de la cour céleste.
  rationale: Le grec ne nomme pas le sujet ; une identification explicite trancherait une question que le verset laisse ouverte.
- issue: Sens de « témoignage de Jésus »
  choice: Conserver « témoignage de Jésus » dans le texte principal.
  alternative: « leur témoignage au sujet de Jésus » ou « le témoignage rendu par Jésus ».
  rationale: Le génitif peut désigner soit le témoignage rendu par Jésus, soit le témoignage à son sujet ; la note signale cette ambiguïté réelle.
- issue: Relation entre les décapités et ceux qui n’ont pas adoré la bête
  choice: Employer « ainsi que ceux qui » sans déclarer explicitement s’il s’agit d’un second groupe entièrement distinct.
  alternative: Faire de la seconde description une simple caractérisation des seuls décapités.
  rationale: La construction grecque présente une rupture de cas qui permet plusieurs analyses ; la traduction évite de résoudre complètement la relation entre les groupes.
- issue: Nature du retour à la vie exprimé par ἔζησαν
  choice: « revinrent à la vie »
  alternative: « vécurent », « ressuscitèrent » ou « reprirent vie ».
  rationale: La formulation rend la transition narrative sans importer une définition confessionnelle détaillée de cet événement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le caractère visionnaire du passage tout en divisant la longue phrase grecque pour assurer sa lisibilité. Les pronoms indéfinis, les ambiguïtés du génitif et la tension entre les groupes décrits ne sont pas résolus de manière confessionnelle.
