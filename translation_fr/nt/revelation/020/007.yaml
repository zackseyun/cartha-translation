source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: fr
  text: Quand les mille ans seront achevés, Satan sera relâché de sa prison.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: quand
  rationale: Avec le subjonctif τελεσθῇ, introduit le moment futur attendu où l’événement se produira. « Quand » est naturel et n’ajoute aucune nuance étrangère au texte.
- source_word: τελεσθῇ
  choice: seront achevés
  rationale: Le passif de τελέω exprime ici l’achèvement d’une période déterminée. « Seront achevés » conserve la voix passive et le caractère accompli.
- source_word: τὰ χίλια ἔτη
  choice: les mille ans
  rationale: L’article défini renvoie dans le contexte à la période déjà mentionnée. Cette formulation directe ne tranche pas entre une lecture littérale et une lecture symbolique.
- source_word: λυθήσεται
  choice: sera relâché
  rationale: Le futur passif de λύω désigne la levée de la détention. « Sera relâché » est idiomatique en français dans un contexte carcéral et évite la connotation favorable que pourrait avoir « sera libéré ».
- source_word: ὁ Σατανᾶς
  choice: Satan
  rationale: Forme française usuelle du nom ou titre personnel, conformément à l’usage biblique courant.
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: de sa prison
  rationale: φυλακή désigne ici le lieu de détention; « de sa prison » rend simplement la provenance exprimée par ἐκ et le possessif αὐτοῦ.
theological_decisions:
- issue: Nature des mille ans
  choice: Traduire directement par « les mille ans » sans préciser s’il s’agit d’une durée littérale ou symbolique.
  alternative: Interpréter explicitement l’expression comme un règne littéral de mille ans ou comme une longue période symbolique.
  rationale: Le verset désigne une période définie, mais ne résout pas à lui seul les différentes lectures du millénium. La traduction préserve cette tension.
translation_notes:
  register: Français moderne international, naturel et digne. La phrase reste concise et suit l’ordre logique du grec. « Relâché » convient au contexte de prison tout en conservant le passif.
