id: REV.20.8
reference: Revelation 20:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: fr
  text: il sortira pour tromper[a] les nations qui sont aux quatre coins de la terre — Gog et Magog[b] — et pour les rassembler en vue de la guerre[c]. Leur nombre est comme le sable de la mer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « égarer ».
    reason: lexical_alternative
  - marker: b
    text: « Gog et Magog » fait écho à Ézéchiel 38–39 et peut servir ici à désigner, de manière typologique, les nations rassemblées pour la rébellion finale.
    reason: cross_reference
  - marker: c
    text: Ou « en vue de la bataille ». Le mot grec peut désigner une guerre ou une bataille.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: Il sortira
  rationale: Le futur de ἐξέρχομαι exprime la sortie de Satan après sa libération au verset 7. Le sujet implicite est conservé par le pronom, sans répétition explicative.
- source_word: πλανῆσαι
  choice: pour tromper
  rationale: πλανάω peut signifier « tromper » ou « égarer ». « Tromper » est clair et naturel ici, tandis qu’une note conserve l’autre nuance.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Dans ce contexte, ἔθνη désigne collectivement les nations ou les peuples, sans imposer le sens plus spécifique de « non-Juifs ».
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: qui sont aux quatre coins de la terre
  rationale: Cette expression idiomatique désigne les extrémités du monde habité. La formulation française garde l’image biblique tout en restant naturelle.
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: Gog et Magog
  rationale: Les noms propres sont translittérés et placés en apposition aux nations, sans trancher leur portée symbolique, typologique ou géographique.
- source_word: συναγαγεῖν
  choice: et pour les rassembler
  rationale: L’infinitif coordonné exprime le dessein de la sortie et de la tromperie. Le pronom « les » rend explicite son objet, les nations.
- source_word: εἰς τὸν πόλεμον
  choice: en vue de la guerre
  rationale: πόλεμος peut désigner une guerre ou une bataille. « En vue de la guerre » exprime naturellement le but sans imposer une bataille particulière.
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: Leur nombre
  rationale: Cette formulation française reprend clairement les nations rassemblées et évite la lourdeur de « dont le nombre » après la longue apposition.
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: est comme le sable de la mer
  rationale: La comparaison traditionnelle est conservée, avec son image biblique d’une multitude impossible à compter.
theological_decisions:
- issue: Référent du sujet implicite de ἐξελεύσεται
  choice: Le pronom « Il » renvoie à Satan, sujet fourni par le verset précédent.
  alternative: Répéter explicitement « Satan sortira ».
  rationale: La continuité grammaticale avec Apocalypse 20.7 suffit à identifier le sujet; ne pas répéter son nom évite d’ajouter au texte grec du verset.
- issue: Portée de « Gog et Magog »
  choice: Les noms sont présentés en apposition aux nations trompées.
  alternative: Les comprendre exclusivement comme des lieux ou des personnages ethnogéographiques précis, ou exclusivement comme des symboles.
  rationale: Cette présentation préserve l’écho à Ézéchiel 38–39 et l’ambiguïté apocalyptique sans fixer une interprétation contestée.
- issue: Sens de πόλεμος
  choice: « la guerre »
  alternative: « la bataille »
  rationale: Les deux sens sont possibles. Le texte principal retient le sens large, tandis que la note signale le sens ponctuel possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le double but (« pour tromper… et pour les rassembler »), les images bibliques et l’apposition « Gog et Magog », tout en évitant les tournures inutilement archaïques.
