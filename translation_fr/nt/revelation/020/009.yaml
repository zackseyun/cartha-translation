reference: Revelation 20:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: fr
  text: Ils montèrent sur la vaste étendue de la terre[a] et encerclèrent[b] le camp des saints ainsi que la ville bien-aimée[c]. Et un feu descendit du ciel et les dévora.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « sur la largeur de la terre »; l’expression évoque sa vaste étendue.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « entourèrent ».'
    reason: lexical_alternative
  - marker: c
    text: Le texte n’identifie pas explicitement « la ville bien-aimée »; elle est souvent comprise comme Jérusalem ou, plus largement, comme la cité de Dieu.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: montèrent
  rationale: Rend directement le mouvement exprimé par ἀναβαίνω sans préciser une géographie que le texte ne donne pas.
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: sur toute l’étendue de la terre
  rationale: « Étendue » exprime naturellement en français la largeur ou la vaste extension désignée par πλάτος; « toute » explicite ici la portée de cette vaste étendue sans introduire l’image absente d’une plaine.
- source_word: ἐκύκλευσαν
  choice: encerclèrent
  rationale: Le verbe signifie entourer en formant un cercle; « encercler » convient particulièrement au contexte d’un camp assiégé.
- source_word: παρεμβολὴν
  choice: camp
  rationale: παρεμβολή désigne un campement, souvent militaire; « camp » est précis, simple et naturel.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: « Saints » maintient le vocabulaire néotestamentaire habituel et la continuité interne de l’Apocalypse.
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: la ville bien-aimée
  rationale: Cette formulation conserve le passif et ne nomme pas celui qui aime la ville, conformément à l’ambiguïté du grec.
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: un feu descendit du ciel
  rationale: Traduction naturelle et proche de l’ordre sémantique grec, qui conserve l’image de la descente céleste.
- source_word: κατέφαγεν αὐτούς
  choice: les dévora
  rationale: κατεσθίω signifie littéralement « dévorer » ou « engloutir »; avec le feu pour sujet, « dévora » reste idiomatique et garde la vigueur de l’image.
theological_decisions:
- issue: Référent de « la ville bien-aimée »
  choice: Conserver l’expression générique sans identifier la ville dans le corps du texte.
  alternative: L’identifier à Jérusalem ou, plus largement, à la cité ou au peuple eschatologique de Dieu.
  rationale: Le verset ne nomme pas explicitement cette ville; une identification dans le texte traduirait une interprétation plutôt que la formulation grecque.
translation_notes:
  register: Français international moderne, narratif et digne. « Encerclèrent » maintient la coloration militaire du contexte; « bien-aimée » conserve le caractère soutenu et biblique sans archaïsme. Le connecteur « Mais » rend naturellement le contraste pragmatique du second καί, quand l’assaut est interrompu par le feu céleste.
