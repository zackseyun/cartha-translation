id: REV.20.5
reference: Revelation 20:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: fr
  text: Les autres morts ne revinrent pas à la vie avant que les mille ans soient achevés[a]. C’est la première résurrection.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne vécurent pas avant que les mille ans soient achevés ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: les autres morts
  rationale: Cette formulation française naturelle désigne ceux qui restent parmi les morts et maintient le contraste avec le groupe mentionné au verset précédent.
- source_word: οὐκ ἔζησαν
  choice: ne revinrent pas à la vie
  rationale: Dans ce contexte de résurrection, l’aoriste de ζάω a vraisemblablement une valeur ingressive. « Revenir à la vie » exprime clairement cette idée en français, tandis que la note conserve l’autre possibilité lexicale.
- source_word: ἄχρι τελεσθῇ
  choice: avant que … soient achevés
  rationale: La tournure marque le terme jusqu’auquel la situation se prolonge. Le subjonctif « soient achevés » rend naturellement en français la forme passive et l’idée d’accomplissement.
- source_word: τὰ χίλια ἔτη
  choice: les mille ans
  rationale: Traduction directe qui renvoie à la période précise déjà mentionnée dans le contexte.
- source_word: αὕτη
  choice: C’est
  rationale: Le démonstratif renvoie à la réalité qui vient d’être décrite sans que la traduction en précise davantage le référent.
- source_word: ἡ ἀνάστασις ἡ πρώτη
  choice: la première résurrection
  rationale: « Résurrection » est l’équivalent français établi de ἀνάστασις, et l’ordre retenu est naturel tout en préservant l’expression grecque.
theological_decisions:
- issue: Référent de « C’est la première résurrection »
  choice: Maintenir un démonstratif à portée non précisée, renvoyant à la réalité décrite dans le contexte.
  alternative: Préciser qu’il s’agit exclusivement des martyrs du verset 4, de tous les justes décédés, ou d’une résurrection spirituelle.
  rationale: Le grec affirme simplement « celle-ci est la première résurrection ». La traduction ne doit imposer aucun système millénariste ni trancher une question que la formulation laisse débattue.
- issue: Valeur de ἔζησαν dans le contexte
  choice: Employer « revinrent à la vie », qui exprime une entrée dans la vie en contexte de résurrection.
  alternative: Traduire simplement par « vécurent » ou interpréter explicitement le verbe comme une venue spirituelle à la vie.
  rationale: Le contexte immédiat favorise le sens de retour à la vie, sans qu’il soit nécessaire d’ajouter une qualification doctrinale absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique soutenu. La formulation reste proche du grec tout en étant idiomatique et ne tranche pas les débats eschatologiques.
