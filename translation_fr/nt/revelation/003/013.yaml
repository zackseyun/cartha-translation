  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: fr
  text: Que celui qui a une oreille écoute ce que l’Esprit dit aux Églises[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux assemblées ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: celui qui a
  rationale: Le participe présent substantivé est rendu par une tournure française naturelle qui conserve le singulier et la portée proverbiale.
- source_word: οὖς
  choice: une oreille
  rationale: Le singulier du grec est conservé; dans cette formule, l’oreille évoque la capacité et la disposition à entendre attentivement.
- source_word: ἀκουσάτω
  choice: écoute
  rationale: L’impératif à la troisième personne est naturellement rendu en français par « que… écoute ». « Écouter » exprime ici l’attention et l’accueil du message, au-delà de la simple perception auditive.
- source_word: τί
  choice: ce que
  rationale: Cette formulation introduit naturellement en français le contenu des paroles prononcées.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Dans la formule répétée de l’Apocalypse, le terme désigne très probablement l’Esprit saint; la majuscule signale ce référent sans ajouter de précision absente du grec.
- source_word: λέγει
  choice: dit
  rationale: Le présent français rend simplement et naturellement l’acte de parole exprimé par le présent grec.
- source_word: ταῖς ἐκκλησίαις
  choice: aux Églises
  rationale: Le datif indique les destinataires. « Églises » est le terme courant et contextuellement approprié pour les communautés auxquelles s’adressent les messages de l’Apocalypse.
theological_decisions:
- issue: Référent de « l’Esprit »
  choice: l’Esprit saint parlant aux Églises
  alternative: un esprit humain ou l’esprit de prophétie compris de manière impersonnelle
  rationale: La formule exhortative récurrente de l’Apocalypse désigne très probablement l’Esprit saint qui s’adresse aux Églises par le message prophétique.
translation_notes:
  register: Français international moderne, naturel et digne. La construction « Que celui qui… écoute » conserve la forme proverbiale et l’impératif du grec sans recourir à une tournure archaïque.
