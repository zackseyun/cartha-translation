id: REV.3.6
reference: Revelation 3:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/006.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: fr
  text: Que celui qui a une oreille[a] écoute ce que l’Esprit dit aux Églises.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Que celui qui a une oreille écoute. » Le masculin singulier est employé de manière générique : l’exhortation s’adresse à toute personne.'
    reason: Préciser la forme singulière et générique de l’expression grecque.
lexical_decisions:
- source_word: ὁ ἔχων
  choice: celui qui a
  rationale: Le participe présent substantivé signifie littéralement « celui qui a ». Cette tournure conserve le singulier et la portée proverbiale tout en restant naturelle en français moderne.
- source_word: οὖς
  choice: une oreille
  rationale: Le singulier grec est conservé. Dans cette formule imagée, « avoir une oreille » désigne la capacité et la disposition à écouter, sans ajouter l’infinitif absent du texte grec.
- source_word: ἀκουσάτω
  choice: écoute
  rationale: L’impératif aoriste actif à la troisième personne du singulier est rendu par une construction française à l’impératif avec « que ». « Écoute » garde la force directe de l’exhortation.
- source_word: τί
  choice: ce que
  rationale: Le pronom interrogatif introduit ici le contenu des paroles de l’Esprit ; « ce que » est la formulation française naturelle.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Dans le refrain répété d’Apocalypse 2–3, l’expression désigne très probablement l’Esprit Saint. La majuscule signale ce référent sans ajouter « Saint », absent du grec.
- source_word: λέγει
  choice: dit
  rationale: Le présent de l’indicatif exprime la parole actuelle ou caractéristique de l’Esprit. « Dit » restitue naturellement la formule.
- source_word: ταῖς ἐκκλησίαις
  choice: aux Églises
  rationale: Le datif pluriel après « dit » indique les destinataires. « Églises » est le terme français établi pour les communautés chrétiennes auxquelles s’adressent ces messages.
theological_decisions:
- issue: Référent de « l’Esprit »
  choice: l’Esprit Saint
  alternative: un esprit
  rationale: Dans le refrain des chapitres 2–3 et dans le contexte prophétique de l’Apocalypse, « l’Esprit » désigne très probablement l’Esprit Saint qui parle aux Églises. La traduction conserve toutefois la forme sobre du grec en n’ajoutant pas le mot « Saint ».
- issue: Singulier générique de l’exhortation
  choice: Que celui qui a… écoute
  alternative: Que quiconque a… écoute ; Que ceux qui ont… écoutent
  rationale: Le grec emploie un participe substantivé et un impératif au singulier masculin dans une formule générique. Le français « celui qui » préserve ce singulier représentatif ; l’exhortation s’adresse à toute personne, et non exclusivement aux hommes.
translation_notes:
  register: Français international moderne, digne et direct. La formulation conserve le parallélisme proverbial et le singulier du grec. La majuscule à « Esprit » et à « Églises » suit l’usage biblique français ; « aux Églises » garde la portée collective du pluriel.
