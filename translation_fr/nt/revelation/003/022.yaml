id: REV.3.22
reference: Revelation 3:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: fr
  text: Que celui qui a une oreille écoute ce que l’Esprit dit aux Églises.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que quiconque a une oreille écoute. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων
  choice: celui qui a
  rationale: L’article suivi du participe présent forme une expression substantivée au singulier. « Celui qui a » en conserve la portée représentative dans un français naturel.
- source_word: οὖς
  choice: une oreille
  rationale: Le nom grec est au singulier. La formulation garde l’image concrète et l’écho de l’exhortation répétée dans l’Apocalypse.
- source_word: ἀκουσάτω
  choice: écoute
  rationale: L’impératif grec à la troisième personne du singulier est rendu naturellement par la construction française « Que celui… écoute », qui en préserve la force exhortative.
- source_word: τί
  choice: ce que
  rationale: « Ce que » introduit naturellement en français le contenu à écouter.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Dans cette formule répétée adressée aux Églises, le contexte désigne l’Esprit Saint. La majuscule indique ce référent sans ajouter de qualificatif absent du grec.
- source_word: λέγει
  choice: dit
  rationale: Le présent « dit » restitue directement et naturellement le verbe grec dans cette formule.
- source_word: ταῖς ἐκκλησίαις
  choice: aux Églises
  rationale: Le datif indique les destinataires. « Églises » est le terme consacré et approprié pour les communautés auxquelles s’adressent les messages d’Apocalypse 2–3.
theological_decisions:
- issue: Portée représentative de l’expression masculine singulière
  choice: Que celui qui a une oreille écoute
  alternative: Que quiconque a une oreille écoute
  rationale: La construction conserve le singulier représentatif du grec. « Quiconque » serait naturel, mais généraliserait légèrement la formulation source.
- issue: Référent de τὸ πνεῦμα
  choice: l’Esprit
  alternative: l’esprit
  rationale: Dans le refrain des lettres aux Églises, le contexte identifie le locuteur comme l’Esprit Saint. La majuscule rend cette identification contextuelle tout en laissant le texte sans explicitation ajoutée.
translation_notes:
  register: Français international moderne, digne et direct. La tournure « Que celui qui… écoute » évite le masculin pronominal redondant, reste proche de la syntaxe grecque et conserve l’image singulière de l’oreille. La majuscule à « Églises » suit un usage éditorial biblique pour les communautés locales; la minuscule serait également possible selon la charte typographique.
