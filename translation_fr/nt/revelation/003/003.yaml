id: REV.3.3
reference: Revelation 3:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: fr
  text: Souviens-toi donc de la manière dont tu as reçu et entendu[a] ; garde cela et repens-toi. Si donc tu ne veilles pas[b], je viendrai comme un voleur[c], et tu ne sauras certainement pas à quelle heure je viendrai sur toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « souviens-toi de ce que tu as reçu et entendu ». Le grec dit littéralement « comment », ce qui peut souligner la manière dont le message a été reçu, bien que certains comprennent l’expression comme désignant le message lui-même.'
    reason: alternative_reading
  - marker: b
    text: « Veiller » peut aussi se traduire par « rester éveillé » ou « être vigilant ».
    reason: lexical_alternative
  - marker: c
    text: L’avertissement « je viendrai comme un voleur » reprend l’image d’une intervention soudaine et inattendue. Le verset ne précise pas s’il s’agit du jugement final ou d’une intervention disciplinaire plus immédiate.
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: Souviens-toi
  rationale: L’impératif présent appelle à une remémoration continue ; « souviens-toi » est naturel, direct et digne en français moderne.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence tirée du reproche précédent ; « donc » conserve clairement le lien logique.
- source_word: πῶς
  choice: comment
  rationale: L’adverbe renvoie d’abord à la manière dont ils ont reçu et entendu, tout en laissant possible une compréhension portant sur le message lui-même.
- source_word: εἴληφας
  choice: tu as reçu
  rationale: Le passé composé français exprime naturellement une réception passée dont la portée demeure présente.
- source_word: ἤκουσας
  choice: entendu
  rationale: Rend directement l’acte antérieur d’entendre, sans ajouter l’idée plus étroite d’obéissance attentive.
- source_word: τήρει
  choice: garde-le
  rationale: « Garder » peut évoquer à la fois la conservation fidèle et la mise en pratique. Le pronom renvoie à ce qui a été reçu et entendu.
- source_word: μετανόησον
  choice: repens-toi
  rationale: Formulation néotestamentaire concise qui exprime le changement intérieur et le retour exigés.
- source_word: γρηγορήσῃς
  choice: tu ne restes pas éveillé
  rationale: Préserve l’image concrète de la veille, particulièrement adaptée à la comparaison avec le voleur, tout en exprimant la vigilance spirituelle.
- source_word: ἥξω ὡς κλέπτης
  choice: je viendrai comme un voleur
  rationale: Comparaison française naturelle qui conserve l’idée d’une venue soudaine et inattendue.
- source_word: οὐ μὴ γνῷς
  choice: tu ne sauras certainement pas
  rationale: « Certainement pas » restitue la négation grecque fortement emphatique sans archaïsme.
- source_word: ποίαν ὥραν
  choice: à quelle heure
  rationale: Conserve la précision et la tonalité du grec plutôt que de généraliser par « à quel moment ».
- source_word: ἐπὶ σέ
  choice: sur toi
  rationale: Préserve le mouvement dirigé vers le destinataire ainsi que la tonalité solennelle, sans décider s’il s’agit d’une visitation, d’une discipline ou d’un jugement.
theological_decisions:
- issue: Sens de πῶς εἴληφας καὶ ἤκουσας
  choice: « comment tu as reçu et entendu »
  alternative: « ce que tu as reçu et entendu »
  rationale: Le grec porte explicitement « comment » et peut souligner la manière de la réception initiale. La note signale l’autre compréhension possible sans la substituer au texte.
- issue: Nature de la venue annoncée par « je viendrai comme un voleur »
  choice: La menace reste celle d’une venue inattendue, sans identification plus précise.
  alternative: Y voir explicitement soit la venue finale du Christ, soit un jugement historique ou une intervention disciplinaire immédiate.
  rationale: Le verset ne précise pas la portée de cette venue ; la traduction conserve donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, naturel et solennel. Le tutoiement singulier reflète l’adresse grecque à l’ange ou au représentant de l’Église. La formulation conserve les images de la veille et du voleur, l’emphase de la négation et l’ambiguïté quant à la nature de la venue.
