  to: Souviens-toi donc de la manière dont tu as reçu et entendu[a] ; garde cela et repens-toi. Si donc tu ne veilles pas[b], je viendrai comme un voleur[c], et tu ne sauras certainement pas à quelle heure je viendrai sur toi.
  rationale: La révision est limitée à des améliorations de français idiomatique. « De la manière dont » reproduit πῶς sans imposer l’interprétation « ce que », tandis que « cela » reprend de manière neutre l’objet sous-entendu du grec. « Veiller » est la formulation française naturelle de l’appel à rester vigilant. L’ambiguïté de ἐπὶ σέ est maintenue par « sur toi ».
