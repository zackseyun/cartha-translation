id: REV.3.8
reference: Revelation 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: fr
  text: 'Je connais tes œuvres. Voici[a] : j’ai placé devant toi une porte ouverte que personne ne peut fermer, parce que tu as peu de force, que tu as gardé ma parole et que tu n’as pas renié mon nom.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vois ». Le grec appelle l’attention sur ce qui suit. L’expression « porte ouverte » désigne plus précisément une porte qui a été ouverte et qui le demeure.'
    reason: Alternative lexicale et nuance du participe parfait passif grec.
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: Je connais tes œuvres
  rationale: οἶδα, parfait de forme mais présent de sens, appelle un présent français. « Œuvres » conserve le pluriel concret et la formule récurrente de l’Apocalypse.
- source_word: ἰδοὺ
  choice: Voici
  rationale: Marqueur d’attention naturel dans un registre biblique moderne et digne, sans l’archaïsme de « Voici que » ou « Vois » dans ce contexte.
- source_word: δέδωκα ἐνώπιόν σου
  choice: j’ai placé devant toi
  rationale: Le parfait δέδωκα garde une portée actuelle. Avec une porte comme complément, « placer devant » exprime naturellement l’image sans transformer explicitement le geste en « ouvrir ».
- source_word: θύραν ἠνεῳγμένην
  choice: une porte ouverte
  rationale: Le participe parfait passif indique une porte qui a été ouverte et demeure ouverte. En français, « porte ouverte » est idiomatique et peut porter ce résultat présent; une note explicite la nuance verbale.
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: que personne ne peut fermer
  rationale: « Peut » rend directement l’idée de capacité exprimée par δύναται; « fermer » est le verbe français naturel avec « porte ».
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: parce que tu as peu de force
  rationale: ὅτι est compris causalement. « Peu de force » préserve l’idée de capacité limitée sans préciser sa nature.
- source_word: ἐτήρησάς μου τὸν λόγον
  choice: tu as gardé ma parole
  rationale: « Garder » conserve l’étendue de τηρέω, qui peut évoquer l’obéissance, l’attachement et la préservation fidèle; « parole » maintient le terme λόγος sans paraphrase.
- source_word: οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: tu n’as pas renié mon nom
  rationale: « Renier » rend naturellement ἀρνέομαι dans le contexte de la fidélité personnelle et religieuse, tandis que « mon nom » préserve l’expression représentative du grec.
theological_decisions:
- issue: Sens de l’image de la porte ouverte
  choice: Conserver littéralement l’image d’une « porte ouverte » sans en préciser le référent.
  alternative: L’expliciter comme une occasion missionnaire, un accès au salut ou au royaume, ou une possibilité providentielle.
  rationale: Le verset n’interprète pas explicitement la métaphore; la traduction doit donc préserver son ouverture théologique.
- issue: Portée de ὅτι
  choice: Le rendre par « parce que », en lien avec l’affirmation qui précède.
  alternative: Le rendre par « car », ou comprendre qu’il introduit le contenu de la connaissance de Christ.
  rationale: La valeur causale est la lecture la plus naturelle ici, mais la portée syntaxique exacte garde une certaine souplesse; aucune expansion interprétative n’est ajoutée.
- issue: Valeur des formes verbales passées
  choice: Employer le passé composé pour « j’ai placé », « tu as gardé » et « tu n’as pas renié ».
  alternative: Employer le passé simple ou reformuler au présent.
  rationale: Le passé composé exprime naturellement en français des actes accomplis dont les effets ou la pertinence demeurent présents.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier reflète les formes σου et ἔχεις adressées à l’ange de l’Église. La coordination finale est légèrement resserrée en français sans effacer les trois propositions causales du grec.
