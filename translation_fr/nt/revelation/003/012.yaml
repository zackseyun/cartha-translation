id: REV.3.12
reference: Revelation 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: fr
  text: Celui qui remporte la victoire[a], j’en ferai une colonne dans le sanctuaire de mon Dieu, et jamais plus il n’en sortira[b]. J’écrirai sur lui le nom de mon Dieu, le nom de la cité de mon Dieu — la nouvelle Jérusalem, qui descend du ciel, d’auprès de mon Dieu —, et mon nom nouveau[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Celui qui vainc ». Le verbe grec est un terme récurrent dans l’Apocalypse pour évoquer la victoire fidèle.
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie ici une négation particulièrement forte : « il ne sortira certainement jamais plus ».'
    reason: lexical_alternative
  - marker: c
    text: L’ordre des mots grecs met légèrement en relief le caractère nouveau du nom.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Celui qui remporte la victoire
  rationale: Le participe présent substantivé désigne de manière représentative celui qui vainc. Cette formulation française naturelle conserve le motif récurrent de la victoire fidèle dans l’Apocalypse.
- source_word: ποιήσω αὐτὸν στῦλον
  choice: j’en ferai une colonne
  rationale: La construction avec attribut de l’objet exprime le fait de faire de quelqu’un une colonne. « J’en ferai » est idiomatique et garde intacte l’image architecturale de permanence et d’honneur.
- source_word: ἐν τῷ ναῷ
  choice: dans le sanctuaire
  rationale: ναός désigne plus précisément le sanctuaire, par contraste avec l’ensemble plus vaste du domaine du temple. Le choix conserve cette précision sans expliquer la métaphore.
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: jamais plus il n’en sortira
  rationale: « Jamais plus » rend la négation grecque emphatique οὐ μή et la finalité exprimée par ἔτι. « En » reprend naturellement le sanctuaire en français.
- source_word: γράψω ἐπ’ αὐτὸν
  choice: J’écrirai sur lui
  rationale: La formulation garde l’image concrète d’une inscription portée sur la personne, sans renforcer inutilement le verbe en « graver ».
- source_word: τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου
  choice: le nom de la cité de mon Dieu
  rationale: Le parallélisme des trois mentions du nom est préservé. « Cité » convient au registre élevé de la Jérusalem nouvelle tout en restant intelligible.
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: qui descend du ciel, d’auprès de mon Dieu
  rationale: 'La traduction distingue les deux indications grecques : ἐκ marque la provenance hors du ciel et ἀπό la provenance d’auprès de Dieu. La virgule évite de les confondre.'
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: mon nom nouveau
  rationale: La postposition de « nouveau » donne en français une légère solennité et une certaine mise en relief, tout en évitant d’ajouter « propre », qui pourrait suggérer un contraste absent du contexte immédiat.
theological_decisions:
- issue: Genre grammatical singulier de la formule de promesse
  choice: Employer « celui » et « lui »
  alternative: Employer une formulation épicène ou plurielle
  rationale: Le grec présente un participe masculin singulier et des pronoms masculins singuliers. Le français les conserve tout en laissant à la formule sa portée représentative.
- issue: Répétition de « mon Dieu » dans la parole du Christ exalté
  choice: Conserver les trois occurrences présentes dans le texte grec de ce verset
  alternative: Alléger la répétition pour des raisons stylistiques
  rationale: La répétition est explicite et théologiquement significative. Elle doit demeurer sans harmonisation ni explication doctrinale ajoutée.
- issue: Sens du nom nouveau
  choice: Traduire simplement « mon nom nouveau »
  alternative: Expliciter l’identité ou le contenu de ce nom
  rationale: Le texte ne précise pas ce nom. La traduction conserve donc le mystère et la tension théologique sans interprétation spéculative.
- issue: Colonne dans le sanctuaire et sortie future
  choice: Maintenir littéralement les deux images
  alternative: Paraphraser comme une promesse de sécurité ou de présence permanente
  rationale: Les images expriment permanence, appartenance et honneur, mais le texte ne les réduit pas à une seule explication. Elles sont donc conservées telles quelles.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme de la promesse est conservé, ainsi que les images de la colonne, de l’inscription et de la Jérusalem qui descend. Les tirets isolent l’apposition explicative sans casser la série des trois noms.
