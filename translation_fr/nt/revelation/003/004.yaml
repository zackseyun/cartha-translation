id: REV.3.4
reference: Revelation 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: fr
  text: Mais tu as à Sardes quelques noms[a] qui n’ont pas souillé leurs vêtements[b]. Ils marcheront avec moi, en blanc[c], parce qu’ils en sont dignes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelques personnes ». Le grec dit littéralement « quelques noms ».
    reason: lexical_alternative
  - marker: b
    text: Ou « n’ont pas rendu impurs leurs vêtements »; le verbe peut aussi évoquer l’idée de les tacher.
    reason: lexical_alternative
  - marker: c
    text: C’est-à-dire, vraisemblablement, vêtus de blanc; le grec dit simplement « en blanc ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque nettement le contraste avec le reproche précédent, dans une formulation française simple et naturelle.
- source_word: ἔχεις ὀλίγα ὀνόματα
  choice: tu as quelques noms
  rationale: Conserve la métonymie frappante du grec, où « noms » désigne des personnes identifiables, sans en effacer la force littéraire.
- source_word: ἐν Σάρδεσιν
  choice: à Sardes
  rationale: En français, la préposition « à » est la tournure locative naturelle devant un nom de ville.
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: qui n’ont pas souillé leurs vêtements
  rationale: « Souillé » conserve à la fois l’image concrète des vêtements tachés et sa portée morale, tandis que « vêtements » garde un registre digne sans préciser indûment le type d’habit.
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: Ils marcheront avec moi
  rationale: Préserve l’image littérale de la marche ainsi que ses possibles connotations de communion et de reconnaissance.
- source_word: ἐν λευκοῖς
  choice: en blanc
  rationale: Reproduit la concision elliptique du grec; le contexte vestimentaire permet de comprendre qu’il s’agit vraisemblablement de vêtements blancs.
- source_word: ὅτι ἄξιοί εἰσιν
  choice: parce qu’ils en sont dignes
  rationale: Rend directement la causalité et la dignité affirmées par le texte; « en » rattache naturellement cette dignité à la promesse de marcher avec le Christ en blanc.
theological_decisions:
- issue: Faut-il rendre ὀνόματα par une expression idiomatique désignant les personnes ou conserver « noms »?
  choice: Conserver « quelques noms » dans le texte principal.
  alternative: « quelques personnes »
  rationale: La formulation grecque est volontairement marquante et peut souligner l’identité individuelle de ces fidèles. Une note explicite la métonymie sans l’aplanir dans le texte.
- issue: Quelle nuance donner à μολύνω dans l’image vestimentaire?
  choice: « n’ont pas souillé leurs vêtements »
  alternative: « n’ont pas rendu impurs leurs vêtements » ou « n’ont pas taché leurs vêtements »
  rationale: « Souillé » maintient ensemble les dimensions concrète, morale et potentiellement cultuelle du terme sans imposer une interprétation doctrinale particulière.
- issue: Comment traduire ἄξιοί εἰσιν sans résoudre la tension théologique sur le mérite?
  choice: « ils en sont dignes »
  alternative: « ils le méritent » ou « ils en sont jugés dignes »
  rationale: La traduction conserve l’affirmation explicite de leur dignité sans ajouter ni nier une notion de mérite, de grâce ou de jugement qui n’est pas formulée ici.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement singulier respecte l’adresse grecque à l’Église de Sardes. La syntaxe est légèrement répartie en deux phrases pour éviter une relative lourde et rendre sans ambiguïté le référent humain de « quelques noms ». Les images de la souillure, de la marche et du blanc sont conservées.
