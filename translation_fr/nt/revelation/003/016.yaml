id: REV.3.16
reference: Revelation 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: fr
  text: Ainsi, parce que tu es tiède et que tu n’es ni chaud ni froid, je suis sur le point de te vomir[a] de ma bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec signifie littéralement « vomir » ; « cracher » en atténuerait la force.
    reason: Précision lexicale sur une image volontairement forte.
lexical_decisions:
- source_word: οὕτως
  choice: Ainsi
  rationale: Introduit naturellement en français la conséquence tirée de la déclaration précédente, tout en conservant la valeur déductive du grec.
- source_word: ὅτι
  choice: parce que
  rationale: 'Exprime clairement la relation causale : l’état tiède motive le jugement annoncé.'
- source_word: χλιαρός
  choice: tiède
  rationale: Équivalent français direct et courant qui conserve exactement l’image de la température.
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: ni chaud ni froid
  rationale: Reproduit le contraste grec de façon concise et naturelle, sans donner à l’image une interprétation supplémentaire.
- source_word: μέλλω
  choice: je suis sur le point de
  rationale: Conserve la nuance d’imminence du grec et l’urgence de l’avertissement, plus nettement qu’un simple futur.
- source_word: ἐμέσαι
  choice: te vomir
  rationale: Rend directement le verbe grec, qui désigne l’action de vomir, sans adoucir l’image volontairement choquante.
- source_word: ἐκ τοῦ στόματός μου
  choice: hors de ma bouche
  rationale: Conserve l’idée d’expulsion exprimée par ἐκ et l’image corporelle vive du texte grec.
theological_decisions:
- issue: Force de l’image du jugement dans ἐμέσαι
  choice: Conserver l’image crue de « vomir ».
  alternative: Employer « cracher » ou « rejeter ».
  rationale: Le grec présente une image volontairement forte de répulsion et de rejet. « Cracher » ou « rejeter » en atténuerait la portée rhétorique et théologique.
- issue: Valeur temporelle de μέλλω
  choice: Exprimer l’imminence par « je suis sur le point de ».
  alternative: Traduire par « je te vomirai » ou « je vais te vomir ».
  rationale: La formulation retenue fait ressortir l’action imminente annoncée par le grec, sans la réduire à un simple futur.
translation_notes:
  register: Français international moderne, clair et digne. La construction demeure solennelle, tandis que « vomir » conserve sans euphémisme la vigueur saisissante du texte source.
