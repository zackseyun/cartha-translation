id: REV.3.17
reference: Revelation 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: fr
  text: 'Parce que tu dis : « Je suis riche, je me suis enrichi et je n’ai besoin de rien », sans savoir que c’est toi qui es malheureux, pitoyable, pauvre, aveugle et nu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις
  choice: Parce que tu dis
  rationale: Le premier ὅτι a ici une valeur causale et introduit le motif du reproche; le présent français convient à l’accusation directe.
- source_word: Πλούσιός εἰμι
  choice: Je suis riche
  rationale: Rendu direct qui conserve l’affirmation de richesse et prépare son contraste ironique avec « pauvre ».
- source_word: πεπλούτηκα
  choice: je me suis enrichi
  rationale: Le passé composé rend naturellement le parfait grec en conservant l’idée d’un enrichissement acquis dont le résultat demeure.
- source_word: οὐδὲν χρείαν ἔχω
  choice: je n’ai besoin de rien
  rationale: Expression idiomatique française qui conserve la négation totale et le sens de complète autosuffisance revendiquée.
- source_word: οὐκ οἶδας
  choice: sans savoir
  rationale: La coordination grecque est rendue par une tournure française naturelle qui maintient l’opposition entre la prétention déclarée et l’ignorance réelle, sans remplacer le verbe cognitif par « se rendre compte ».
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: c’est toi qui es malheureux
  rationale: La construction clivée met en relief le pronom σὺ et restitue le caractère pointé de l’article devant ταλαίπωρος sans produire l’expression peu naturelle « le malheureux » comme attribut.
- source_word: ἐλεεινός
  choice: pitoyable
  rationale: Désigne celui qui inspire la pitié et reste distinct de ταλαίπωρος.
- source_word: πτωχός
  choice: pauvre
  rationale: Terme simple et direct qui préserve le contraste avec la richesse revendiquée.
- source_word: τυφλός
  choice: aveugle
  rationale: Équivalent usuel, laissé sans explicitation interprétative.
- source_word: γυμνός
  choice: nu
  rationale: Équivalent direct qui conserve l’image sans l’expliquer.
theological_decisions:
- issue: Expliciter comme spirituel le contraste entre richesse et pauvreté
  choice: Conserver littéralement les termes riche, pauvre, aveugle et nu sans ajouter « spirituellement ».
  alternative: Je suis spirituellement riche… tu es spirituellement pauvre.
  rationale: Le verset produit lui-même son contraste ironique et métaphorique; une explicitation réduirait la tension rhétorique du texte.
- issue: Force de σὺ et de l’article dans ὁ ταλαίπωρος
  choice: « c’est toi qui es malheureux »
  alternative: « tu es le malheureux » ou simplement « tu es malheureux »
  rationale: La tournure choisie marque naturellement en français l’identification accusatrice et l’emphase du grec, sans substantiver artificiellement l’adjectif.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier correspond à l’adresse grecque à l’ange de l’Église. La série finale conserve son rythme accumulatif et ses images sans ajout doctrinal.
