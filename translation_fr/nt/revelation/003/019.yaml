  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: fr
  text: Moi, je reprends et je corrige tous ceux que j’aime[a]. Sois donc zélé et repens-toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La correction dont il est question vise aussi à former et à éduquer, et non seulement à punir.
    reason: cultural_note
lexical_decisions:
- source_word: ἐγὼ
  choice: Moi, … je
  rationale: Le pronom grec explicite est emphatique. La dislocation « Moi, … je » restitue naturellement cette insistance en français.
- source_word: ὅσους ἐὰν
  choice: tous ceux que
  rationale: La construction relative indéfinie désigne l’ensemble des personnes concernées (« tous ceux que / quiconque »).
- source_word: φιλῶ
  choice: j’aime
  rationale: Le verbe exprime ici un amour réel et personnel; « j’aime » en conserve la force sans imposer une distinction technique avec ἀγαπάω.
- source_word: ἐλέγχω
  choice: je les reprends
  rationale: Dans ce contexte, le verbe désigne une réprimande qui met en évidence une faute afin d’amener un changement.
- source_word: παιδεύω
  choice: je les corrige
  rationale: Le terme évoque une correction éducative et formatrice, et non une simple punition; « corriger » est naturel en français et garde cette dimension.
- source_word: ζήλευε
  choice: aie du zèle
  rationale: L’impératif appelle à une ardeur engagée. « Aie du zèle » conserve le lien lexical avec ζῆλος et l’intensité de l’ordre.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence à tirer de la correction motivée par l’amour.
- source_word: μετανόησον
  choice: change radicalement
  rationale: L’impératif appelle à une réorientation morale décisive. Cette formulation rend le sens en français courant; la traduction ecclésiale traditionnelle est indiquée en note.
theological_decisions:
- issue: Nature de l’amour exprimé par φιλῶ dans son rapport à la correction divine
  choice: « j’aime », sans affaiblissement en simple affection
  alternative: « j’ai de l’affection pour »
  rationale: La réprimande et la correction sont fondées sur un amour véritable. Le texte ne justifie pas d’établir ici une opposition doctrinale technique entre φιλέω et ἀγαπάω.
- issue: Portée de παιδεύω
  choice: « je les corrige », au sens d’une correction éducative
  alternative: « je les discipline » ou « je les châtie »
  rationale: Le terme englobe la formation par la correction. « Châtier » accentuerait indûment la punition, tandis que « discipliner » est moins idiomatique pour une personne en français international.
- issue: Portée de μετανόησον
  choice: « change radicalement »
  alternative: « repens-toi »
  rationale: Le choix rend l’appel à une réorientation profonde sans le réduire à un simple regret. La note conserve le terme traditionnel et laisse visible son registre théologique.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. La structure disloquée « Moi, … je les » rend l’emphase grecque tout en restant idiomatique. Les impératifs au singulier correspondent à l’adresse faite à l’ange de l’Église de Laodicée.
