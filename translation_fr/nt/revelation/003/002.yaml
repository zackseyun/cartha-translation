id: REV.3.2
reference: Revelation 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: fr
  text: Sois vigilant et affermis ce qui reste, qui était sur le point de mourir, car je n’ai pas trouvé tes œuvres accomplies devant mon Dieu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: Réveille-toi
  rationale: Littéralement, l’expression appelle à devenir vigilant et à le rester. Dans le contexte de Sardes, « Réveille-toi » rend naturellement l’image de l’éveil et la force de l’impératif présent, sans ajouter d’explication.
- source_word: στήρισον
  choice: affermis
  rationale: Le verbe signifie rendre ferme, fortifier ou consolider. « Affermis » convient à ce qui subsiste mais menace de mourir.
- source_word: τὰ λοιπά
  choice: ce qui reste
  rationale: Cette formulation conserve le neutre pluriel substantivé sans préciser arbitrairement s’il s’agit de personnes, d’œuvres ou de réalités spirituelles.
- source_word: ἔμελλον ἀποθανεῖν
  choice: était sur le point de mourir
  rationale: Rend directement l’imminence exprimée par μέλλω avec l’infinitif, tout en accordant le relatif collectif « qui » avec « ce qui reste ».
- source_word: πεπληρωμένα
  choice: accomplies
  rationale: Le participe parfait passif évoque des œuvres menées à leur plein accomplissement. « Accomplies » préserve cette idée sans imposer « parfaites ».
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: devant mon Dieu
  rationale: Équivalent français naturel de l’expression indiquant la présence et le jugement de Dieu.
theological_decisions:
- issue: Nature de « ce qui reste »
  choice: Maintenir une formulation indéterminée
  alternative: « ceux qui restent » ou « les œuvres qui restent »
  rationale: Le grec τὰ λοιπά est neutre et ne précise pas explicitement le référent; la traduction ne doit pas trancher une ambiguïté réelle.
- issue: Évaluation des œuvres
  choice: « œuvres accomplies »
  alternative: « œuvres parfaites » ou « œuvres complètes »
  rationale: Le texte affirme qu’elles n’ont pas été menées à leur plein accomplissement devant Dieu; « accomplies » évite de transformer explicitement cette constatation en doctrine de perfection morale absolue.
translation_notes:
  register: Français international moderne, direct et digne. Les impératifs restent vigoureux; la phrase conserve l’ambiguïté du référent de τὰ λοιπά et la tension du jugement porté sur les œuvres.
