id: REV.3.1
reference: Revelation 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: fr
  text: 'Écris à l’ange de l’Église qui est à Sardes : « Voici ce que dit celui qui a les sept esprits de Dieu[a] et les sept étoiles : Je connais tes œuvres. Tu as la réputation d’être vivant, mais tu es mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « les sept esprits de Dieu » est conservée littéralement. Elle peut symboliser la plénitude de l’Esprit Saint ; certains y voient plutôt sept esprits célestes.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ange
  rationale: « Ange » conserve le sens lexical le plus naturel dans le cadre apocalyptique de l’Apocalypse, sans trancher l’identité précise du destinataire.
- source_word: ἐκκλησίας
  choice: Église
  rationale: Dans ce contexte, « Église » désigne naturellement la communauté chrétienne locale et correspond à l’usage français établi.
- source_word: Τάδε λέγει
  choice: Voici ce que dit
  rationale: Cette formule française actuelle et digne restitue naturellement la formule prophétique grecque, sans le caractère artificiel d’un calque.
- source_word: ὁ ἔχων
  choice: celui qui a
  rationale: Cette tournure rend directement le participe substantivé grec et demeure naturelle en français moderne.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: les sept esprits de Dieu
  rationale: Le pluriel grec est maintenu afin de ne pas imposer une interprétation théologique du symbole.
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: les sept étoiles
  rationale: Traduction directe qui conserve l’image propre à l’Apocalypse.
- source_word: Οἶδά
  choice: Je connais
  rationale: « Connaître » rend ici de façon concise et idiomatique la connaissance évaluative exprimée par οἶδα.
- source_word: τὰ ἔργα
  choice: tes œuvres
  rationale: « Œuvres » préserve le vocabulaire récurrent de l’Apocalypse et reste intelligible dans un registre biblique moderne.
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: Tu as la réputation d’être vivant
  rationale: La formulation exprime clairement l’idiome grec « avoir un nom », ici au sens de réputation, tout en conservant le contraste avec la mort.
- source_word: νεκρὸς εἶ
  choice: tu es mort
  rationale: La traduction directe garde toute la force du verdict et son contraste avec « vivant ».
theological_decisions:
- issue: Sens des « sept esprits de Dieu »
  choice: Conserver littéralement « les sept esprits de Dieu » dans le texte principal.
  alternative: « l’Esprit de Dieu dans sa plénitude » ou sept esprits angéliques devant Dieu
  rationale: Le grec emploie un pluriel et ne résout pas explicitement la portée du symbole. La traduction préserve donc l’ambiguïté théologique.
- issue: Référent de ἀγγέλῳ
  choice: Traduire par « ange » dans le texte principal.
  alternative: « messager » ou représentant humain de l’Église
  rationale: « Ange » convient au cadre apocalyptique et préserve la forme lexicale sans décider de l’identité exacte du référent.
translation_notes:
  register: Français international moderne, clair et digne. La formule prophétique est rendue idiomatiquement, tandis que le vocabulaire symbolique et le contraste abrupt entre vie apparente et mort réelle sont conservés.
