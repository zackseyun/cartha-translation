id: REV.3.18
reference: Revelation 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: fr
  text: Je te conseille d’acheter auprès de moi de l’or affiné par le feu[a], afin que tu deviennes riche, des vêtements blancs[b], afin que tu t’en revêtes et que la honte de ta nudité ne soit pas dévoilée, ainsi que du collyre[c] à appliquer sur tes yeux, afin que tu voies.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « purifié par le feu » ou « éprouvé au feu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « des habits blancs » ; dans certains contextes, le terme peut désigner plus précisément des robes.
    reason: lexical_alternative
  - marker: c
    text: Le terme grec désigne une préparation médicinale que l’on appliquait sur les yeux.
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω
  choice: Je te conseille
  rationale: Le présent à la première personne exprime un conseil direct et autorisé. « Conseiller » est naturel en français moderne sans affaiblir la solennité de l’exhortation.
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: de m’acheter
  rationale: Cette formulation rend à la fois l’action d’acheter et la provenance indiquée par παρά avec le génitif, dans un français idiomatique.
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: de l’or affiné par le feu
  rationale: « Affiné » convient au traitement métallurgique de l’or et le parfait passif présente celui-ci comme ayant subi l’action du feu. L’image reste intacte.
- source_word: ἵνα πλουτήσῃς
  choice: afin que tu deviennes riche
  rationale: Le subjonctif aoriste peut présenter l’entrée dans un nouvel état ; « deviennes riche » conserve cette nuance possible.
- source_word: ἱμάτια λευκά
  choice: des vêtements blancs
  rationale: Ἱμάτια est un terme général désignant des vêtements. Cette traduction ne le restreint pas indûment à des robes.
- source_word: ἵνα περιβάλῃ
  choice: afin que tu t’en revêtes
  rationale: La tournure pronominale rend la valeur moyenne du verbe et renvoie clairement aux vêtements blancs.
- source_word: μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: que la honte de ta nudité ne soit pas dévoilée
  rationale: Le passif est conservé. « Dévoilée » exprime la manifestation publique de cette honte tout en faisant écho au champ imagé du vêtement.
- source_word: κολλούριον
  choice: du collyre
  rationale: « Collyre » est en français moderne le terme précis et courant pour une préparation médicinale destinée aux yeux.
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: pour t’en enduire les yeux
  rationale: Le verbe désigne l’application d’une substance en l’étendant sur une partie du corps. « Enduire » restitue ici le geste médical sans lui imposer une portée sacramentelle.
- source_word: ἵνα βλέπῃς
  choice: afin que tu voies
  rationale: La formulation simple conserve le but exprimé par ἵνα et laisse au contexte la portée littérale et symbolique de la vue.
theological_decisions:
- issue: Portée symbolique de l’or, des vêtements blancs et du collyre
  choice: Conserver littéralement les trois images sans en définir les référents spirituels dans le corps du verset.
  alternative: Identifier explicitement l’or à la richesse spirituelle, les vêtements à la justice ou à la pureté, et le collyre au discernement spirituel.
  rationale: Le verset présente ces réalités sous forme d’images sans en donner ici une interprétation exhaustive. Les expliciter dans la traduction résoudrait une tension que le texte grec maintient.
- issue: Résonance éventuelle de ἐγχρῖσαι
  choice: Employer « enduire » pour décrire fidèlement l’application du collyre.
  alternative: Employer « oindre », qui pourrait davantage évoquer une onction religieuse ou sacramentelle.
  rationale: Dans le contexte immédiat, le verbe décrit l’application d’une préparation sur les yeux. « Enduire » est précis et naturel, tout en laissant subsister la valeur symbolique générale de l’image.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement est conservé parce que l’adresse grecque est au singulier et vise directement le destinataire représentatif de l’Église de Laodicée. La phrase garde l’accumulation rhétorique du grec tout en employant une ponctuation lisible.
