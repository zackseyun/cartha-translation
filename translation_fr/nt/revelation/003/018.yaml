    issue: « de m’acheter de l’or » est ambigu et ne rend pas correctement « παρ’ ἐμοῦ ».
    rationale: Cette construction se comprend normalement comme « acheter de l’or pour moi », non comme « acheter de l’or de moi/auprès de moi ». Le grec désigne explicitement le Christ comme la source auprès de laquelle l’achat figuré est effectué.
