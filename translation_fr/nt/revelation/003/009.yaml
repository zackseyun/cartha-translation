id: REV.3.9
reference: Revelation 3:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: fr
  text: Voici[a], je te donne des gens de la synagogue de Satan — ceux qui se disent juifs et ne le sont pas, mais qui mentent. Voici, je les ferai venir se prosterner devant tes pieds[b], et ils sauront que, moi, je t’ai aimé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je donne de la synagogue de Satan » ; la formulation grecque semble désigner des personnes provenant de ce groupe.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « venir et adorer devant tes pieds ». Le verbe grec peut exprimer l’adoration ou le fait de se prosterner ; ici, « se prosterner » évite de laisser entendre qu’un culte divin est rendu au destinataire.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: Interjection française actuelle et digne qui attire l’attention, sans l’archaïsme marqué de « voici que » ou de certaines tournures plus solennelles.
- source_word: διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: je te donne des gens de la synagogue de Satan
  rationale: Le présent de διδῶ est conservé. « Des gens de » explicite naturellement en français le complément partitif sous-entendu après « donner », sans faire nécessairement de toute la synagogue l’objet de l’action. Le destinataire indirect « te » est rendu explicite d’après le contexte et la construction française.
- source_word: συναγωγῆς τοῦ Σατανᾶ
  choice: synagogue de Satan
  rationale: Rend directement le nom et le génitif polémiques, sans les atténuer ni les développer.
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: ceux qui se disent juifs
  rationale: « Se disent » restitue naturellement la construction réflexive et présente leur revendication d’identité sans ajout interprétatif.
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: et ne le sont pas, mais qui mentent
  rationale: Préserve l’antithèse tranchée du grec. La reprise de « qui » assure une syntaxe française fluide.
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν
  choice: je les ferai venir
  rationale: La tournure causative française rend de manière concise ποιήσω αὐτοὺς avec la venue exprimée par ἥξουσιν.
- source_word: προσκυνήσουσιν
  choice: se prosterner
  rationale: Le verbe désigne ici le geste d’abaissement ou d’hommage. « Se prosterner » conserve la force corporelle du terme sans affirmer explicitement qu’un culte divin est rendu aux croyants.
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: devant tes pieds
  rationale: Traduction formellement proche qui conserve ἐνώπιον et l’image précise des pieds, malgré le français plus idiomatique « à tes pieds ».
- source_word: γνῶσιν
  choice: ils sauront
  rationale: Le futur français exprime naturellement le résultat visé dans la suite des actions futures.
- source_word: ἐγὼ ἠγάπησά σε
  choice: que, moi, je t’ai aimé
  rationale: Le pronom tonique « moi » rend l’insistance du pronom grec exprimé ἐγώ, et le passé composé respecte l’aoriste sans imposer une nuance aspectuelle étrangère.
theological_decisions:
- issue: Sens de « ceux qui se disent juifs et ne le sont pas »
  choice: Conserver littéralement le jugement polémique du texte, sans préciser s’il nie une identité ethnique ou affirme une fausse fidélité à l’alliance.
  alternative: Paraphraser en termes de « vrais juifs », de « peuple spirituel » ou de négation explicite de l’ascendance juive.
  rationale: Le grec formule un jugement sévère mais n’en explicite pas ici les critères. La traduction préserve donc la tension et évite d’étendre le propos en affirmation générale contre les Juifs.
- issue: Portée de προσκυνήσουσιν devant les pieds du destinataire
  choice: « se prosterner » comme geste d’hommage, de reconnaissance ou de soumission
  alternative: « adorer » devant tes pieds
  rationale: « Adorer » suggérerait fortement en français un culte divin rendu au croyant. « Se prosterner » garde le geste visible et laisse ouverte sa portée exacte.
- issue: Valeur de ἠγάπησά σε
  choice: « je t’ai aimé »
  alternative: « je t’aime »
  rationale: Le passé composé conserve la forme passée de l’aoriste et l’affirmation d’un amour déjà manifesté, sans exclure sa continuité.
translation_notes:
  register: Français international moderne, direct et solennel sans archaïsmes. Le tutoiement correspond au singulier σου et à l’adresse individuelle à l’ange de l’Église. La ponctuation met en relief les deux occurrences de ἰδού et isole la caractérisation polémique du groupe.
