id: REV.3.11
reference: Revelation 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: fr
  text: Je viens bientôt[a]. Tiens fermement ce que tu as, afin que personne ne prenne ta couronne[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rapidement » ou « sans tarder ». L’adverbe grec peut souligner soit la proximité dans le temps, soit la rapidité de l’action.
    reason: alternative_reading
  - marker: b
    text: Le mot grec désigne une couronne ou une guirlande d’honneur ou de victoire, et non spécifiquement un diadème royal.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: Je viens
  rationale: Le présent grec a ici une portée imminente ou future. « Je viens » est naturel en français, tout en conservant la forme présente et l'attente d'une arrivée prochaine.
- source_word: ταχύ
  choice: bientôt
  rationale: L'adverbe peut exprimer la proximité temporelle (« bientôt ») ou la rapidité de l'action (« rapidement »). Dans cette exhortation, « bientôt » rend bien l'imminence, tandis que l'autre nuance est signalée en note.
- source_word: κράτει
  choice: Tiens fermement
  rationale: L'impératif de κρατέω appelle à conserver avec fermeté et persévérance. Cette formulation est claire, actuelle et plus explicite que le simple « tiens ».
- source_word: ὃ ἔχεις
  choice: ce que tu as
  rationale: Cette traduction naturelle laisse volontairement l'objet indéterminé, comme dans le grec, sans imposer une interprétation contextuelle.
- source_word: ἵνα
  choice: afin que
  rationale: La locution introduit clairement le but ou le résultat que l'exhortation vise à prévenir.
- source_word: μηδεὶς
  choice: personne ne
  rationale: Équivalent français neutre et idiomatique du sujet indéfini négatif.
- source_word: λάβῃ
  choice: prenne
  rationale: Le subjonctif français convient après « afin que personne ne » et rend sans exagération l'issue indésirable exprimée par l'aoriste subjonctif grec.
- source_word: στέφανόν
  choice: couronne
  rationale: « Couronne » est le terme français courant et accessible. La note précise qu'il s'agit du στέφανος honorifique ou victorieux, et non spécifiquement d'un diadème royal.
theological_decisions:
- issue: Nuance de ταχύ dans la promesse de la venue du Christ
  choice: bientôt
  alternative: rapidement, sans tarder
  rationale: Le grec peut souligner soit la proximité temporelle, soit la rapidité de la venue lorsqu'elle se produira. Le texte principal retient l'imminence contextuelle sans supprimer l'autre possibilité, conservée en note.
translation_notes:
  register: Français international moderne, digne et directement compréhensible. Le tutoiement singulier correspond à l'adresse grecque au messager ou représentant de l'Église. La phrase reste concise et exhortative, avec les ambiguïtés lexicales pertinentes conservées en notes.
