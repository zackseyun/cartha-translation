  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: fr
  text: '« Écris à l’ange[a] de l’Église de Laodicée : Voici ce que dit l’Amen, le témoin fidèle et véritable, le commencement de la création de Dieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au messager de l’Église de Laodicée ».
    reason: lexical_alternative
  - marker: b
    text: Ou « l’origine de la création de Dieu », « la source de la création de Dieu » ou « le souverain de la création de Dieu ». Le mot grec archē peut désigner un commencement, une origine ou une autorité souveraine.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ange
  rationale: Dans la formule répétée adressée aux sept Églises de l’Apocalypse, « ange » est le rendu établi et le plus direct, tout en laissant « messager » comme possibilité lexicale en note.
- source_word: Τάδε λέγει
  choice: Voici ce que dit
  rationale: Cette tournure française naturelle et digne restitue la formule solennelle d’annonce prophétique sans calquer maladroitement le grec.
- source_word: ὁ Ἀμήν
  choice: l’Amen
  rationale: « Amen » est conservé comme titre distinctif, afin de préserver sa force hébraïque de certitude et de vérité ainsi que sa portée intertextuelle.
- source_word: μάρτυς
  choice: témoin
  rationale: « Témoin » rend naturellement les dimensions testimoniale et révélatrice du terme.
- source_word: πιστὸς
  choice: fidèle
  rationale: « Fidèle » exprime la constance et la fiabilité personnelles du témoin dans ce titre christologique.
- source_word: ἀληθινός
  choice: véritable
  rationale: « Véritable » forme en français une association naturelle avec « fidèle » et peut désigner ce qui est authentique et pleinement conforme à la réalité.
- source_word: ἀρχὴ
  choice: commencement
  rationale: « Commencement » est le rendu lexical le plus direct et conserve la tension théologique du texte sans imposer dans le corps du verset les interprétations « origine/source » ou « souverain ».
- source_word: κτίσεως
  choice: création
  rationale: « Création » est le rendu simple et naturel de κτίσις dans cette construction.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif est rendu directement, sans préciser une relation que le grec laisse implicite.
theological_decisions:
- issue: Sens de ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ comme titre christologique
  choice: le commencement de la création de Dieu
  alternative: l’origine ou la source de la création de Dieu ; le souverain de la création de Dieu
  rationale: Le terme ἀρχή possède une gamme de sens qui comprend « commencement », « origine/source » et, dans certains contextes, « autorité/souverain ». Le texte principal retient le rendu le plus direct, tandis que la note expose les autres lectures possibles sans trancher silencieusement une question christologique disputée.
translation_notes:
  register: Français international moderne, solennel mais accessible. La formule « Voici ce que dit » conserve la tonalité prophétique ; les titres christologiques restent concis. Les ambiguïtés de ἀγγέλῳ et de ἀρχή sont signalées en notes plutôt que résolues dans le texte.
