id: REV.3.5
reference: Revelation 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: fr
  text: Le vainqueur sera ainsi revêtu de vêtements blancs[a]. Jamais je n’effacerai son nom du livre de vie[b][c], et je reconnaîtrai son nom devant mon Père et devant ses anges[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Celui qui remporte la victoire sera ainsi revêtu de vêtements blancs. »'
    reason: lexical_alternative
  - marker: b
    text: 'La tournure grecque exprime une négation particulièrement forte : « je n’effacerai certainement pas » son nom.'
    reason: lexical_alternative
  - marker: c
    text: Le « livre de vie » représente le registre céleste de ceux qui appartiennent à Dieu et reçoivent la vie.
    reason: cultural_note
  - marker: d
    text: 'Ou : « je déclarerai ouvertement son nom ». Comparer Matthieu 10.32.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Le vainqueur
  rationale: Le participe présent substantivé désigne celui qui remporte la victoire et caractérise sa persévérance. « Le vainqueur » est naturel en français et maintient le motif de la victoire propre à l’Apocalypse.
- source_word: οὕτως
  choice: ainsi
  rationale: Ce terme conserve le lien de correspondance avec la promesse et le contexte précédents sans l’expliciter davantage.
- source_word: περιβαλεῖται
  choice: sera revêtu
  rationale: La forme médio-passive future se rend naturellement ici par un passif exprimant l’investiture promise.
- source_word: ἱματίοις λευκοῖς
  choice: de vêtements blancs
  rationale: « Vêtements » rend le terme général ἱμάτια sans lui donner le sens plus précis de « robes » ; la couleur blanche et sa portée symbolique restent intactes.
- source_word: οὐ μὴ ἐξαλείψω
  choice: Jamais je n’effacerai
  rationale: « Jamais » restitue clairement la négation grecque fortement emphatique ; « effacer » convient à l’image d’un nom inscrit dans un registre.
- source_word: τὸ ὄνομα αὐτοῦ
  choice: son nom
  rationale: La formulation suit le masculin singulier du grec tout en gardant sa valeur représentative.
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: du livre de vie
  rationale: Cette expression biblique établie est claire et conserve l’image d’un registre céleste ; βίβλος pourrait matériellement désigner un livre ou un rouleau.
- source_word: ὁμολογήσω
  choice: je reconnaîtrai
  rationale: Dans ce contexte, le verbe exprime une reconnaissance ouverte et publique. « Reconnaître » est idiomatique en français et préserve le lien conceptuel avec Matthieu 10.32.
- source_word: ἐνώπιον
  choice: devant
  rationale: Rendu direct, concis et naturel dans les deux occurrences.
- source_word: τοῦ πατρός μου
  choice: mon Père
  rationale: La traduction littérale conserve la relation filiale exprimée par Jésus.
- source_word: τῶν ἀγγέλων αὐτοῦ
  choice: ses anges
  rationale: Dans la syntaxe immédiate, le possessif renvoie le plus naturellement au Père ; la formulation ne l’harmonise pas avec une autre expression.
theological_decisions:
- issue: Portée de la promesse de ne pas effacer le nom du livre de vie dans les débats sur la persévérance et l’apostasie
  choice: Présenter directement cette parole comme une promesse emphatique faite au vainqueur, sans en tirer dans la traduction une conclusion doctrinale supplémentaire.
  alternative: Y voir soit une garantie de la persévérance finale des croyants, soit l’indication qu’un nom peut être retiré du livre de vie.
  rationale: Le verset formule une assurance au moyen de l’image d’un registre, mais ne tranche pas à lui seul les débats théologiques plus larges. La traduction doit préserver la force de la promesse et la tension interprétative.
- issue: Genre du participe masculin singulier et du pronom correspondant
  choice: Employer « Le vainqueur » et « son nom », conformément à la grammaire masculine singulière et à sa portée représentative.
  alternative: Employer une formulation neutralisée ou un pluriel épicène.
  rationale: Le masculin singulier du texte source peut désigner toute personne qui remporte la victoire ; le français permet ici de suivre la forme grecque sans exclure les femmes de la promesse.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve les trois promesses coordonnées tout en divisant la longue phrase pour une lecture naturelle. Le vocabulaire apocalyptique traditionnel (« vainqueur », « vêtements blancs », « livre de vie ») est maintenu sans archaïsme.
