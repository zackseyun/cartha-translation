id: REV.3.15
reference: Revelation 3:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: fr
  text: 'Je connais tes œuvres : tu n’es ni froid ni chaud. Si seulement tu étais froid ou chaud !'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδά
  choice: Je connais
  rationale: οἶδα a ici une valeur stative de présent. « Je connais » restitue naturellement le ton direct et évaluatif.
- source_word: σου τὰ ἔργα
  choice: tes œuvres
  rationale: Cette formulation conserve le terme caractéristique de l’évaluation des communautés dans l’Apocalypse ainsi que sa portée morale, sans paraphraser par « ce que tu fais ».
- source_word: ψυχρὸς
  choice: froid
  rationale: Le terme concret de température est conservé afin de ne pas expliquer prématurément la métaphore.
- source_word: ζεστός
  choice: chaud
  rationale: « Chaud » forme en français le contraste naturel avec « froid » et préserve l’image thermique sans lui substituer une interprétation comme « fervent ».
- source_word: ὄφελον
  choice: Si seulement
  rationale: ὄφελον exprime un souhait portant sur une situation contraire à la réalité présente. « Si seulement » en rend clairement la force et permet de conserver l’exclamation autonome du grec.
- source_word: ἢ
  choice: ou
  rationale: La simple disjonction entre les deux états est rendue de façon directe et idiomatique.
theological_decisions:
- issue: Sens de la métaphore de la température (« froid » et « chaud »)
  choice: Conserver littéralement la métaphore sans en imposer l’interprétation.
  alternative: Comprendre « froid » comme hostile ou indifférent et « chaud » comme fervent ; ou comprendre les deux températures comme deux formes distinctes d’utilité.
  rationale: Le verset ne donne pas lui-même la clé de la métaphore. Les termes concrets préservent donc l’ambiguïté et la tension théologique du texte.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement singulier correspond aux formes grecques au singulier adressées à l’ange de l’Église. La répétition « froid ou chaud » est maintenue pour conserver l’insistance rhétorique.
