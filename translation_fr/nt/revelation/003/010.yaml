id: REV.3.10
reference: Revelation 3:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: fr
  text: Parce que tu as gardé la parole de ma persévérance[a], moi aussi, je te garderai de[b] l’heure de l’épreuve qui va venir sur le monde habité tout entier, afin de mettre à l’épreuve ceux qui habitent sur la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la parole concernant ma persévérance » ou « mon message qui appelle à persévérer ». L’expression grecque peut se comprendre de plusieurs manières étroitement liées.
    reason: lexical_alternative
  - marker: b
    text: Ou « je te préserverai pendant l’heure de l’épreuve » ou « je te tiendrai hors de l’heure de l’épreuve ». Le grec dit littéralement « garder de » et ne tranche pas à lui seul les débats théologiques sur la manière dont cette protection s’accomplira.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: tu as gardé
  rationale: Le passé composé exprime naturellement en français un acte accompli dont la portée demeure présente. « Gardé » conserve aussi le lien verbal avec τηρήσω plus loin dans le verset.
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: la parole de ma persévérance
  rationale: 'Cette formulation assez littérale maintient l’ambiguïté du génitif grec : il peut s’agir de la parole caractérisée par la persévérance, de la parole concernant la persévérance de Jésus ou du message qui appelle à persévérer.'
- source_word: κἀγώ
  choice: moi aussi
  rationale: 'Cette tournure rend l’emphase et la réciprocité : puisqu’ils ont gardé sa parole, lui aussi les gardera.'
- source_word: τηρήσω ἐκ
  choice: je te garderai de
  rationale: La traduction directe préserve la répétition de τηρέω et ne tranche pas la question de savoir si la protection consiste en une exemption, une mise à l’écart ou une préservation au sein de l’épreuve.
- source_word: ὥρας
  choice: l’heure
  rationale: « Heure » conserve l’image temporelle grecque et le registre apocalyptique, même si le mot désigne ici une période déterminée.
- source_word: πειρασμοῦ
  choice: l’épreuve
  rationale: Dans ce contexte universel, « épreuve » couvre le sens de mise à l’épreuve sans réduire le terme à la tentation morale.
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: qui va venir
  rationale: Cette expression française naturelle garde la valeur prospective de μέλλω avec l’infinitif, laquelle peut comporter une nuance d’imminence.
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: sur le monde habité tout entier
  rationale: « Monde habité » rend la nuance propre à οἰκουμένη plutôt que celle du cosmos en général, tandis que « tout entier » traduit ὅλης.
- source_word: πειράσαι
  choice: afin de mettre à l’épreuve
  rationale: La locution reprend le champ lexical d’« épreuve » et exprime clairement la visée de l’événement annoncé.
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: ceux qui habitent sur la terre
  rationale: La formulation conserve la forme verbale et l’expression récurrente de l’Apocalypse, plutôt que de la condenser en « les habitants de la terre ».
theological_decisions:
- issue: Sens de τηρήσω ἐκ dans le contexte eschatologique
  choice: je te garderai de
  alternative: je te préserverai pendant l’épreuve ; je te tiendrai hors de l’heure de l’épreuve
  rationale: Le texte principal suit de près la construction grecque sans décider si la promesse annonce un retrait préalable, une protection pendant l’épreuve ou une exemption de ses effets.
- issue: Valeur du génitif dans τὸν λόγον τῆς ὑπομονῆς μου
  choice: la parole de ma persévérance
  alternative: la parole concernant ma persévérance ; mon message qui appelle à persévérer
  rationale: Le génitif grec permet plusieurs compréhensions étroitement liées. La formulation principale conserve cette tension au lieu d’en imposer une seule.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier correspond à l’adresse à l’assemblée personnifiée. La répétition de « garder » et celle du champ lexical « épreuve / mettre à l’épreuve » reflètent les reprises grecques. Les formulations légèrement marquées « parole de ma persévérance » et « garder de l’heure » sont maintenues pour préserver les ambiguïtés du texte source, avec clarification en notes.
