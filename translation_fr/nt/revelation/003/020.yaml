id: REV.3.20
reference: Revelation 3:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: fr
  text: 'Voici[a] : je me tiens à la porte et je frappe. Si quelqu’un entend ma voix et ouvre la porte, j’entrerai chez lui[b], je prendrai le repas avec lui[c], et lui avec moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voyez : je me tiens à la porte et je frappe. » Le grec attire fortement l’attention et emploie un parfait à valeur présente pour « je me tiens », suivi d’un présent pour « je frappe », ce qui souligne une position et une action qui se prolongent.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « j’entrerai vers lui ». La tournure grecque souligne l’orientation personnelle de cette entrée, et non seulement l’accès à un lieu.'
    reason: lexical_alternative
  - marker: c
    text: L’image du repas exprime une communion personnelle et réciproque. Elle peut être comprise comme une allusion à la cène, à la conversion ou au rétablissement de la communion, mais le texte ne précise pas lui-même laquelle de ces interprétations est visée.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici
  rationale: Particule qui attire vivement l’attention. « Voici » reste naturel et digne en français biblique moderne, sans l’archaïsme de « Voici que ».
- source_word: ἕστηκα
  choice: je me tiens
  rationale: 'Le parfait de ἵστημι a ici une valeur stative présente : il décrit une position actuelle et persistante. « Je me tiens » rend naturellement cet état.'
- source_word: ἐπὶ τὴν θύραν
  choice: à la porte
  rationale: Expression idiomatique française indiquant la position auprès de l’entrée.
- source_word: κρούω
  choice: je frappe
  rationale: Le présent exprime une action en cours. En français, « frapper à la porte » est l’expression naturelle, le complément étant déjà donné.
- source_word: ἐάν τις
  choice: Si quelqu’un
  rationale: Formulation indéfinie et inclusive qui conserve la condition ouverte du grec.
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: entend ma voix
  rationale: Rend directement φωνή par « voix » sans ajouter l’idée d’obéissance que pourrait suggérer « écoute ».
- source_word: ἀνοίξῃ τὴν θύραν
  choice: ouvre la porte
  rationale: Rendu direct et idiomatique de la proposition conditionnelle.
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: j’entrerai chez lui
  rationale: « Chez lui » exprime en français à la fois l’entrée et l’orientation personnelle de πρὸς αὐτόν, mieux qu’un calque tel que « j’entrerai vers lui ».
- source_word: δειπνήσω
  choice: je prendrai le repas
  rationale: δειπνέω désigne le fait de prendre le repas principal. Cette formulation est moderne, digne et moins culturellement étroite que « je souperai ».
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: avec lui, et lui avec moi
  rationale: La reprise elliptique conserve l’accent grec sur la réciprocité de la communion.
theological_decisions:
- issue: Portée de l’image du repas partagé
  choice: Conserver l’image concrète et réciproque du repas sans en préciser le référent doctrinal.
  alternative: Y voir explicitement la cène, la conversion initiale ou le rétablissement de la communion avec un croyant ou une Église.
  rationale: Le texte exprime clairement une communion personnelle et mutuelle, mais ne tranche pas explicitement entre ces diverses applications théologiques.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure proche du mouvement du grec tout en évitant les calques. « Prendre le repas » conserve l’image de la table sans régionalisme marqué, et l’ellipse finale maintient la réciprocité emphatique.
