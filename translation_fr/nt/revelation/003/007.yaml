id: REV.3.7
reference: Revelation 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: fr
  text: 'Écris à l’ange[a] de l’Église qui est à Philadelphie : Voici ce que dit le Saint, le Véritable, celui qui détient la clé de David[b], celui qui ouvre et personne ne fermera, celui qui ferme et personne n’ouvre :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « messager ». Le mot grec ἄγγελος peut désigner un ange céleste ou un messager humain.
    reason: alternative_reading
  - marker: b
    text: L’expression « la clé de David » évoque probablement Ésaïe 22.22 ; la clé y représente l’autorité royale d’ouvrir et de fermer.
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: ange
  rationale: Le mot grec peut désigner un ange céleste ou un messager humain. « Ange » conserve le sens le plus naturel dans la formule répétée des messages aux sept Églises, sans exclure l’autre possibilité, signalée en note.
- source_word: ἐκκλησίας
  choice: Église
  rationale: Dans cette formule d’adresse, le terme désigne la communauté chrétienne locale. « Église » est l’équivalent français courant et clair.
- source_word: Τάδε λέγει
  choice: Voici ce que dit
  rationale: Cette tournure française naturelle garde la solennité de la formule prophétique et la valeur démonstrative de τάδε.
- source_word: ὁ ἅγιος
  choice: le Saint
  rationale: L’adjectif substantivé avec article fonctionne ici comme un titre du locuteur.
- source_word: ὁ ἀληθινός
  choice: le Véritable
  rationale: Ce titre exprime celui qui est vrai, authentique et pleinement réel, sans réduire le terme à la seule sincérité.
- source_word: τὴν κλεῖν Δαυίδ
  choice: la clé de David
  rationale: La formulation directe conserve l’image biblique et son évocation de l’autorité davidique.
- source_word: ὁ ἀνοίγων
  choice: celui qui ouvre
  rationale: La proposition relative rend naturellement en français le participe présent grec tout en poursuivant la série de titres.
- source_word: κλείσει
  choice: fermera
  rationale: 'Le futur grec est conservé, malgré l’alternance avec les présents environnants : personne ne pourra fermer ce qu’il ouvre.'
- source_word: κλείων
  choice: celui qui ferme
  rationale: Cette proposition relative rend le participe grec de manière naturelle et maintient le parallélisme.
- source_word: ἀνοίγει
  choice: ouvre
  rationale: Le présent grec est conservé dans le second membre de la formule complémentaire.
theological_decisions:
- issue: Titres christologiques ὁ ἅγιος et ὁ ἀληθινός
  choice: « le Saint, le Véritable » comme titres directs du Christ ressuscité
  alternative: « celui qui est saint et vrai » comme simple description adjectivale
  rationale: Les constructions grecques avec article substantivent les adjectifs et leur donnent la force de titres solennels. Cette traduction préserve la christologie élevée du passage sans ajouter d’explication doctrinale.
- issue: Allusion portée par « la clé de David »
  choice: Conserver l’image de la clé dans le texte et expliquer brièvement l’allusion en note
  alternative: Paraphraser par « l’autorité sur le royaume de David »
  rationale: L’expression évoque vraisemblablement Ésaïe 22.22, mais le texte traduit doit préserver l’image biblique plutôt que la remplacer par son interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Voici ce que dit » restitue naturellement la cadence prophétique. Les majuscules à « Église », « Saint » et « Véritable » signalent ici respectivement la communauté désignée et les titres du locuteur. L’alternance du futur (« fermera ») et du présent (« ouvre ») suit délibérément les temps du grec.
