id: REV.3.21
reference: Revelation 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: fr
  text: Celui qui remporte la victoire[a][b], je lui accorderai de s’asseoir avec moi sur mon trône, tout comme moi aussi j’ai remporté la victoire et me suis assis avec mon Père sur son trône.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Celui qui triomphe ». Le même verbe grec est repris plus loin dans le verset; la traduction par « remporter la victoire » préserve ce lien.
    reason: lexical_alternative
  - marker: b
    text: 'Le masculin singulier a ici une valeur représentative : la promesse s’adresse à toute personne qui remporte la victoire.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Celui qui remporte la victoire
  rationale: Le participe présent substantivé désigne, de manière générale, toute personne qui demeure victorieuse. Cette formulation naturelle conserve le motif de la victoire et permet de reprendre le même verbe pour ἐνίκησα.
- source_word: δώσω αὐτῷ καθίσαι
  choice: je lui accorderai de s’asseoir
  rationale: Dans cette construction avec un infinitif, δίδωμι exprime l’octroi d’un privilège. « Accorder de » restitue ce sens idiomatique sans ajouter d’explication au texte.
- source_word: μετ’ ἐμοῦ
  choice: avec moi
  rationale: Rend directement l’association exprimée par μετά avec le génitif.
- source_word: ἐν τῷ θρόνῳ μου
  choice: sur mon trône
  rationale: Bien que ἐν signifie ordinairement « dans », le français emploie naturellement « sur un trône » pour l’image de l’intronisation.
- source_word: ὡς κἀγὼ
  choice: tout comme moi aussi
  rationale: « Tout comme » marque nettement la comparaison, tandis que « moi aussi » conserve la valeur additive de καί dans κἀγώ.
- source_word: ἐνίκησα
  choice: j’ai remporté la victoire
  rationale: La même expression que pour νικῶν préserve le lien lexical et le thème répété de la victoire.
- source_word: ἐκάθισα
  choice: me suis assis
  rationale: L’aoriste présente l’action accomplie; le passé composé est naturel en français et convient au contexte d’intronisation.
- source_word: μετὰ τοῦ πατρός μου
  choice: avec mon Père
  rationale: Traduction directe de l’association et de la relation filiale exprimées dans le grec.
- source_word: ἐν τῷ θρόνῳ αὐτοῦ
  choice: sur son trône
  rationale: Le français idiomatique de l’intronisation demande « sur son trône », tout en préservant l’image grecque.
theological_decisions:
- issue: Masculin singulier représentatif dans la promesse faite à ὁ νικῶν
  choice: Conserver « celui » et « lui » au masculin singulier dans le texte
  alternative: Employer « la personne qui » ou reformuler au pluriel
  rationale: Le grec emploie un participe et un pronom masculins singuliers avec une portée représentative. La note précise que la promesse n’est pas limitée aux hommes, sans effacer la forme du texte source.
- issue: Rapport entre le vainqueur et le trône du Christ, puis entre le Christ et le trône du Père
  choice: Traduire le parallèle sans l’atténuer ni l’expliquer
  alternative: Qualifier la participation de « symbolique » ou ajouter une précision doctrinale dans le texte
  rationale: Le verset établit lui-même un parallèle fort entre la victoire des fidèles et celle du Christ. La traduction en conserve la tension et la portée sans définir davantage la nature de cette participation.
translation_notes:
  register: Français international actuel, digne et accessible. La répétition de « remporter la victoire » est volontaire afin de reproduire celle du verbe grec νικάω. « Sur mon trône » et « sur son trône » suivent l’usage naturel du français pour l’intronisation.
