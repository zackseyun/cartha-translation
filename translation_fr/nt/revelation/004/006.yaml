source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: fr
  text: Devant le trône, il y avait comme une mer de verre[a], semblable à du cristal. Au milieu du trône et tout autour du trône[b], il y avait quatre êtres vivants[c], pleins d’yeux devant et derrière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « une mer vitreuse ». Le grec établit une comparaison : Jean voit quelque chose qui ressemble à une mer de verre.'
    reason: lexical_alternative
  - marker: b
    text: La formulation « au milieu du trône et tout autour du trône » est spatialement difficile. Elle est conservée proche du grec sans préciser la disposition des êtres vivants.
    reason: alternative_reading
  - marker: c
    text: Ou « quatre créatures vivantes ». Le mot grec ne désigne pas les « bêtes » hostiles qui apparaissent plus loin dans l’Apocalypse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνώπιον
  choice: devant
  rationale: Rend naturellement la relation spatiale avec le trône sans développer le sens en « en présence de ».
- source_word: ὡς
  choice: comme
  rationale: Marque une comparaison et préserve le caractère approximatif de la description visionnaire.
- source_word: θάλασσα ὑαλίνη
  choice: une mer de verre
  rationale: Conserve l’image saisissante du grec et reste idiomatique en français biblique moderne, sans affirmer qu’il s’agit littéralement d’une mer.
- source_word: ὁμοία κρυστάλλῳ
  choice: semblable à du cristal
  rationale: Préserve la seconde comparaison et évoque la limpidité ou l’éclat sans choisir explicitement entre ces qualités.
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: au milieu du trône et tout autour du trône
  rationale: Maintient la difficulté spatiale du grec au lieu d’imposer une géométrie harmonisée; « tout autour » rend naturellement κύκλῳ.
- source_word: ζῷα
  choice: êtres vivants
  rationale: Désigne clairement des êtres animés et évite « bêtes », qui pourrait les confondre avec les figures hostiles mentionnées plus loin dans l’Apocalypse.
- source_word: γέμοντα ὀφθαλμῶν
  choice: pleins d’yeux
  rationale: Rendu direct, imagé et naturel de la construction grecque.
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: devant et derrière
  rationale: Reproduit sobrement les deux orientations indiquées par le grec sans préciser davantage la disposition des yeux.
theological_decisions:
- issue: Traduction de ζῷα dans la vision de la salle du trône
  choice: êtres vivants
  alternative: créatures vivantes; bêtes
  rationale: « Êtres vivants » respecte la nature animée et céleste de ces figures, en écho à la vision d’Ézéchiel, sans leur attribuer les connotations hostiles de « bêtes ».
- issue: Tension spatiale dans ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: conserver « au milieu du trône et tout autour du trône »
  alternative: harmoniser en « autour du trône, de chaque côté » ou interpréter la disposition exacte
  rationale: La perspective visionnaire reste spatialement difficile dans le grec. La traduction conserve cette tension plutôt que de résoudre silencieusement la position des quatre êtres.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe « il y avait comme » rend explicite la présence implicite dans la proposition nominale grecque, tandis que le vocabulaire conserve l’étrangeté maîtrisée de la vision. Les répétitions de « trône » sont maintenues pour préserver la structure et la tension du texte source.
