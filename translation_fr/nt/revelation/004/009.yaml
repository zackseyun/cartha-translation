id: REV.4.9
reference: Revelation 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: fr
  text: Et chaque fois que les êtres vivants rendront gloire, honneur et actions de grâce à celui qui siège sur le trône, à celui qui vit pour toujours et à jamais[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour les siècles des siècles ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: chaque fois que
  rationale: Avec le verbe orienté vers l’avenir, la conjonction exprime ici une action récurrente ou indéfinie. « Chaque fois que » rend clairement cette valeur itérative.
- source_word: δώσουσιν
  choice: rendront
  rationale: En français, « rendre gloire, honneur et reconnaissance » est plus naturel que « donner » avec ces trois compléments, tout en conservant l’idée d’un hommage effectivement adressé.
- source_word: τὰ ζῷα
  choice: les êtres vivants
  rationale: Dans l’Apocalypse, le terme désigne les êtres qui entourent le trône, et non de simples animaux. « Êtres vivants » est exact, digne et naturel; le nombre quatre n’est pas ajouté puisqu’il n’est pas répété dans ce verset.
- source_word: δόξαν
  choice: gloire
  rationale: « Gloire » est l’équivalent direct dans ce contexte doxologique et évite de réduire le terme à la seule action de louer.
- source_word: τιμήν
  choice: honneur
  rationale: « Honneur » restitue directement le sens de τιμή et forme une association naturelle avec « gloire ».
- source_word: εὐχαριστίαν
  choice: reconnaissance
  rationale: Dans cette construction avec « rendre », « reconnaissance » exprime naturellement l’action de remercier sans suggérer seulement un sentiment intérieur; « action de grâce » serait également possible mais moins fluide au sein de la série.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: à celui qui siège sur le trône
  rationale: « Siège » rend naturellement le participe statif dans l’imagerie royale du trône, sans ajouter explicitement le mot « Dieu ».
- source_word: τῷ ζῶντι
  choice: à celui qui vit
  rationale: Cette formulation verbale conserve l’apposition grecque et relie clairement le participe à l’expression de durée qui suit.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  rationale: Cette locution française exprime avec naturel et solennité la durée sans fin et préserve l’insistance de l’idiome grec.
theological_decisions:
- issue: Traduction du titre divin lié au trône sans précision ajoutée
  choice: à celui qui siège sur le trône, à celui qui vit pour toujours et à jamais
  alternative: à celui qui siège sur le trône et qui vit pour toujours et à jamais
  rationale: La répétition de « à celui » préserve la structure appositionnelle grecque et présente l’intronisation et la vie éternelle comme deux descriptions du même référent, sans ajouter explicitement « Dieu », absent du texte source.
translation_notes:
  register: Français international moderne, solennel mais accessible. La cadence ternaire « gloire, honneur et reconnaissance » est conservée, de même que la structure appositionnelle du texte grec.
