  source_fidelity: La traduction rend fidèlement l’adresse, la triade « gloire, honneur, puissance », l’acte créateur et la relation causale exprimée par διὰ + accusatif. Toutefois, « elles existaient » donne en français un imparfait narratif ou descriptif difficile à justifier dans cette formulation isolée. Pour ἦσαν, dont l’imparfait peut exprimer l’état d’existence, « elles existent » rend plus naturellement le sens dans le français actuel sans fusionner les deux verbes grecs.
  naturalness: Le registre est digne et compréhensible. La correction de « existaient » en « existent » supprime une rupture temporelle maladroite (« existaient et ont été créées ») tout en gardant la tension voulue entre existence et création. « En raison de ta volonté » est naturel, causal et évite de surinterpréter la relation comme strictement instrumentale.
  terminology: '« Seigneur », « Dieu », « gloire », « honneur », « puissance » et « créé » conviennent au contexte et au français biblique moderne. Les ancres des notes correspondent aux éléments effectivement annotés : [a] à « digne » et [b] à l’expression relative à la volonté.'
