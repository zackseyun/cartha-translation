id: REV.4.11
reference: Revelation 4:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: fr
  text: Tu es digne[a], notre Seigneur et notre Dieu, de recevoir la gloire, l’honneur et la puissance, car tu as créé toutes choses, et c’est en raison de ta volonté[b] qu’elles existent et ont été créées.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Digne es-tu, notre Seigneur et notre Dieu ». En grec, le mot rendu par « digne » est placé en tête pour être mis en relief.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « par ta volonté ». La tournure grecque peut exprimer la cause (« en raison de ») ou, de façon moins probable, le moyen (« par »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: Tu es digne
  rationale: Cette formulation française naturelle exprime directement la dignité reconnue à Dieu, tandis qu’une note signale l’emphase produite en grec par la place initiale de ἄξιος.
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: notre Seigneur et notre Dieu
  rationale: Dans ce contexte d’adoration, les groupes nominaux articulés ont une valeur d’adresse directe. Cette traduction conserve les deux titres ainsi que le possessif ἡμῶν.
- source_word: λαβεῖν
  choice: de recevoir
  rationale: L’infinitif complète ἄξιος et indique ce que le destinataire est digne de recevoir. « Recevoir » convient au contexte de louange.
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: la gloire, l’honneur et la puissance
  rationale: La série conserve les trois notions distinctes et leur cadence doxologique. En français, la répétition de l’article devant chaque terme n’est pas nécessaire pour préserver cette structure.
- source_word: ὅτι
  choice: car
  rationale: « Car » introduit clairement, dans un registre digne et courant, le motif pour lequel Dieu est déclaré digne.
- source_word: ἔκτισας τὰ πάντα
  choice: tu as créé toutes choses
  rationale: « Créer » rend directement κτίζω, et « toutes choses » conserve la portée globale et le registre élevé de τὰ πάντα.
- source_word: διὰ τὸ θέλημά σου
  choice: à cause de ta volonté
  rationale: διά avec l’accusatif exprime normalement ici la cause ou le motif. La formulation retient cette nuance sans exclure l’autre lecture possible, signalée en note.
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: elles existaient et ont été créées
  rationale: L’imparfait « existaient » et le passé composé passif « ont été créées » maintiennent la distinction entre l’imparfait ἦσαν et l’aoriste ἐκτίσθησαν, sans réduire la tension de leur enchaînement.
theological_decisions:
- issue: Valeur vocative des titres divins
  choice: notre Seigneur et notre Dieu
  alternative: ô Seigneur, notre Dieu ; le Seigneur et notre Dieu
  rationale: Le contexte de louange indique une adresse directe à celui qui siège sur le trône. La traduction vocative préserve cette fonction sans ajouter de précision doctrinale étrangère au texte.
- issue: Rapport entre la volonté divine et l’existence de la création
  choice: c’est à cause de ta volonté qu’elles existaient et ont été créées
  alternative: c’est par ta volonté qu’elles existaient et ont été créées
  rationale: La traduction principale donne à διά avec l’accusatif sa nuance causale habituelle. La variante instrumentale reste possible et est explicitement conservée en note, afin de ne pas trancher davantage que le grec.
- issue: Relation entre ἦσαν et ἐκτίσθησαν
  choice: elles existaient et ont été créées
  alternative: elles sont venues à l’existence et ont été créées
  rationale: Le texte grec juxtapose un imparfait de εἰμί et un aoriste passif de κτίζω. Les deux verbes et leurs aspects sont maintenus plutôt que fusionnés en une seule affirmation sur l’origine des choses.
translation_notes:
  register: Français international moderne, naturel et digne, avec une cadence adaptée à une scène d’adoration. Le tutoiement correspond à l’adresse directe au singulier. La formulation conserve volontairement l’enchaînement inhabituel « existaient et ont été créées » afin de respecter les deux verbes grecs et leur tension.
