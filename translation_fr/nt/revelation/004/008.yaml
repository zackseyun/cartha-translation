id: REV.4.8
reference: Revelation 4:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: fr
  text: 'Et les quatre êtres vivants, qui ont chacun six ailes, sont pleins d’yeux tout autour et au-dedans. Ils ne connaissent aucun repos, jour et nuit, et disent : « Saint, saint, saint est le Seigneur Dieu, le Tout-Puissant, celui qui était, qui est et qui vient[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « qui était, qui est et qui doit venir »'
    reason: Rendu alternatif traditionnel de ὁ ἐρχόμενος, qui exprime la venue comme attendue plutôt que par le présent dynamique « qui vient ».
lexical_decisions:
- source_word: ζῷα
  choice: êtres vivants
  rationale: Dans l’Apocalypse, le terme désigne des êtres célestes animés, et non des animaux au sens moderne. « Êtres vivants » est naturel en français et préserve leur caractère visionnaire.
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: qui ont chacun
  rationale: La tournure distributive indique que chacun des quatre êtres possède individuellement les six ailes; cette formulation française l’exprime sans lourdeur.
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: six ailes
  rationale: Associé à « chacun », ce rendu restitue clairement que chaque être vivant a six ailes.
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: tout autour et au-dedans
  rationale: Le rendu conserve les deux dimensions spatiales de l’image sans préciser artificiellement ce que recouvre exactement l’intérieur.
- source_word: γέμουσιν ὀφθαλμῶν
  choice: sont pleins d’yeux
  rationale: γέμω suivi du génitif signifie « être plein de »; le rendu préserve directement l’image apocalyptique.
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: ne connaissent aucun repos
  rationale: Cette expression française naturelle conserve la notion de repos ou de répit, sans réduire le sens à la seule absence de silence.
- source_word: ἡμέρας καὶ νυκτός
  choice: jour et nuit
  rationale: Formule française concise exprimant une activité continuelle.
- source_word: λέγοντες
  choice: disent
  rationale: Le verbe reste neutre et n’ajoute pas l’intensité de « crier », absente du grec.
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: Saint, saint, saint
  rationale: La triple répétition est conservée intégralement en raison de sa force rhétorique et théologique.
- source_word: κύριος, ὁ θεός
  choice: le Seigneur Dieu
  rationale: Rendu français établi et naturel de ces titres divins dans cette construction.
- source_word: ὁ παντοκράτωρ
  choice: le Tout-Puissant
  rationale: Titre divin usuel qui exprime celui qui détient toute puissance et gouverne toutes choses.
- source_word: ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: lui qui était, qui est et qui vient
  rationale: Le présent « qui vient » reflète le participe présent ὁ ἐρχόμενος et maintient la dynamique de la venue, plutôt que de la transformer en simple futur.
theological_decisions:
- issue: Rendu de la formule temporelle divine ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος
  choice: lui qui était, qui est et qui vient
  alternative: lui qui était, qui est et qui doit venir
  rationale: « Qui vient » suit la forme participiale présente du grec et préserve l’idée d’une venue en cours ou imminente. La formule traditionnelle « qui doit venir » demeure possible, mais elle infléchit davantage l’expression vers le futur; elle est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe a été légèrement réorganisée pour éviter un participe lourd et l’accord heurté du grec, tout en conservant les images, la répétition liturgique et l’ambiguïté aspectuelle de la formule finale.
