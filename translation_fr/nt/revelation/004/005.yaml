id: REV.4.5
reference: Revelation 4:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: fr
  text: 'Du trône sortent des éclairs, des voix[a] et des coups de tonnerre. Devant le trône brûlent sept torches de feu[b] : ce sont les sept esprits de Dieu[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des sons ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « sept lampes de feu ».'
    reason: lexical_alternative
  - marker: c
    text: Beaucoup comprennent « les sept esprits de Dieu » comme une manière symbolique de parler de la plénitude de l’unique Saint-Esprit; le texte grec lui-même dit « sept esprits ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: sortent
  rationale: Le présent « sortent » exprime naturellement en français que les phénomènes émanent du trône, tout en conservant le temps présent grec.
- source_word: ἀστραπαὶ
  choice: des éclairs
  rationale: Le pluriel français est idiomatique et rend directement les manifestations lumineuses répétées.
- source_word: φωναὶ
  choice: des voix
  rationale: « Voix » est le sens direct de φωναί et préserve la possibilité d'une expression personnelle dans le langage apocalyptique. Le sens plus général « sons » demeure possible et figure en note.
- source_word: βρονταί
  choice: des coups de tonnerre
  rationale: Cette expression française naturelle restitue la pluralité de grondements ou de détonations, mieux que le singulier collectif « tonnerre ».
- source_word: λαμπάδες πυρὸς
  choice: sept torches de feu
  rationale: λαμπάς désigne couramment une torche; le complément « de feu » suit de près la construction grecque et conserve l'image saisissante du texte. « Lampes de feu » reste lexicalement possible.
- source_word: καιόμεναι
  choice: brûlent
  rationale: Le verbe conjugué rend en français naturel le participe présent grec et son idée d'une combustion continue.
- source_word: ἐνώπιον τοῦ θρόνου
  choice: devant le trône
  rationale: Formulation spatiale concise et habituelle en français.
- source_word: ἅ εἰσιν
  choice: ce sont
  rationale: Cette tournure française introduit clairement l'identification symbolique des sept torches.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: les sept esprits de Dieu
  rationale: La traduction conserve explicitement le pluriel grec et ne transforme pas l'expression en interprétation théologique.
theological_decisions:
- issue: Interprétation de τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: Traduire littéralement « les sept esprits de Dieu » dans le texte principal.
  alternative: « l'Esprit de Dieu dans sa plénitude septuple » ou une désignation symbolique de la plénitude de l'unique Saint-Esprit.
  rationale: Le grec porte explicitement le pluriel « sept esprits ». Le rendre par un singulier résoudrait dans la traduction une question d'interprétation que le texte laisse ouverte; l'interprétation courante est donc signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le mouvement solennel de la vision, avec un vocabulaire concret. « Voix » maintient l'ambiguïté de φωναί, tandis que « torches de feu » rend l'image de façon directe sans atténuer l'étrangeté apocalyptique.
