source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: fr
  text: Autour du trône se trouvaient vingt-quatre trônes, et sur ces trônes étaient assis vingt-quatre anciens, revêtus de vêtements blancs et portant sur leurs têtes des couronnes d’or.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « couronnes de victoire » : le mot grec peut désigner une couronne décernée en signe d’honneur ou de victoire, et pas seulement un diadème royal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: autour de
  rationale: Exprime naturellement la disposition qui entoure le trône central.
- source_word: θρόνοι
  choice: trônes
  rationale: Le grec reprend le même nom que pour le trône central; « trônes » conserve le lien lexical ainsi que l’imagerie royale ou judiciaire.
- source_word: πρεσβυτέρους
  choice: anciens
  rationale: Terme consacré pour ce groupe céleste dans l’Apocalypse, sans réduire le mot à une simple indication d’âge.
- source_word: καθημένους
  choice: étaient assis
  rationale: Transforme naturellement le participe grec en verbe conjugué tout en conservant la posture décrite.
- source_word: περιβεβλημένους ἐν ἱματίοις λευκοῖς
  choice: vêtus de vêtements blancs
  rationale: Conserve le sens général de ἱμάτια sans préciser indûment qu’il s’agit de robes; le parfait exprime leur état vestimentaire.
- source_word: στεφάνους χρυσοῦς
  choice: couronnes d’or
  rationale: « Couronnes » est clair dans la scène céleste, tandis que « d’or » est plus idiomatique en français que « dorées » et indique la matière.
theological_decisions:
- issue: Nature des vingt-quatre θρόνοι entourant le trône
  choice: trônes
  alternative: sièges
  rationale: La répétition grecque de θρόνος appelle le même terme français et maintient l’imagerie royale ou judiciaire, sans attribuer aux anciens une souveraineté égale à celle du personnage occupant le trône central.
- issue: Identité des vingt-quatre anciens
  choice: anciens, sans précision interprétative
  alternative: représentants de l’Église, êtres angéliques, ou représentants d’Israël et des apôtres
  rationale: Le verset les désigne comme πρεσβύτεροι mais n’explique pas leur identité; la traduction laisse donc ouverte cette question.
- issue: Nuance de στέφανος
  choice: couronnes dans le texte, avec une note indiquant « couronnes de victoire »
  alternative: couronnes royales ou diadèmes
  rationale: στέφανος peut désigner une couronne honorifique ou décernée au vainqueur, et non seulement un insigne royal; la note préserve cette nuance sans la fixer dans le corps du texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe est légèrement restructurée pour éviter une succession pesante de participes. « Ces trônes » clarifie la reprise sans ajout interprétatif; « portant sur la tête » rend idiomatiquement la dernière proposition.
