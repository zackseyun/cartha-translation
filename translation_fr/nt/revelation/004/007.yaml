id: REV.4.7
reference: Revelation 4:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: fr
  text: Le premier être vivant était semblable à un lion, le deuxième être vivant à un veau, le troisième être vivant avait un visage comme celui d’un homme[a], et le quatrième être vivant était semblable à un aigle en plein vol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un visage humain ». Le grec dit littéralement : « un visage comme celui d’un homme ».'
    reason: Alternative lexicale permettant de conserver à la fois le sens générique possible de ἀνθρώπου et la formulation comparative du grec.
lexical_decisions:
- source_word: ζῷον
  choice: être vivant
  rationale: « Être vivant » rend le sens large de ζῷον dans cette vision du trône et évite de confondre ces êtres avec les « bêtes » désignées plus loin par θηρίον.
- source_word: ὅμοιον
  choice: semblable à
  rationale: Cette formulation exprime une ressemblance, et non une identité, tout en gardant un registre naturel et digne.
- source_word: λέοντι
  choice: lion
  rationale: Équivalent direct et naturel du terme grec.
- source_word: μόσχῳ
  choice: veau
  rationale: μόσχος désigne couramment un veau ou un jeune bovin. « Veau » conserve cette valeur sans préciser indûment le sexe ni introduire une interprétation sacrificielle.
- source_word: ἔχων
  choice: avait
  rationale: Le participe grec est rendu par un verbe conjugué afin d’obtenir une phrase française fluide tout en conservant sa valeur descriptive.
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: un visage comme celui d’un homme
  rationale: « Visage » rend πρόσωπον, et « comme » maintient la comparaison introduite par ὡς. « Celui d’un homme » conserve la forme concrète du grec sans transformer la comparaison en simple identification.
- source_word: ἀετῷ
  choice: aigle
  rationale: Bien que ἀετός puisse parfois désigner un vautour, « aigle » est ici le sens usuel et convient le mieux à l’imagerie visionnaire.
- source_word: πετομένῳ
  choice: en plein vol
  rationale: Cette expression française naturelle décrit l’aigle dans l’action de voler et restitue l’image vive du participe grec.
theological_decisions:
- issue: Rendu de ἀνθρώπου dans la description du troisième être vivant
  choice: un visage comme celui d’un homme
  alternative: un visage humain
  rationale: Le grec peut employer ἄνθρωπος au sens générique d’être humain, mais il formule ici une comparaison explicite avec ὡς. Le texte principal garde cette comparaison et la note signale l’autre rendu naturel sans imposer une interprétation.
translation_notes:
  register: Français international moderne, clair et soutenu. La structure coordonnée et répétitive de la vision est conservée, avec une légère ellipse dans le deuxième membre pour éviter une lourdeur inutile.
