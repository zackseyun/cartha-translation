id: REV.4.2
reference: Revelation 4:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: fr
  text: 'Aussitôt, je me trouvai dans l’Esprit[a], et voici : un trône se dressait dans le ciel, et quelqu’un siégeait sur le trône.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « en esprit ». En grec, le nom « esprit » est sans article ; l’expression peut évoquer soit l’action de l’Esprit Saint, soit un état spirituel ou visionnaire.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Exprime avec naturel l’immédiateté et la soudaineté de la transition.
- source_word: ἐγενόμην
  choice: je me trouvai
  rationale: Rend l’entrée dans un nouvel état exprimée par γίνομαι, sans recourir au peu idiomatique « je devins » ni réduire le verbe à une simple existence statique.
- source_word: ἐν πνεύματι
  choice: dans l’Esprit
  rationale: La formule désigne vraisemblablement l’expérience prophétique suscitée par l’Esprit, tout en restant assez compacte pour conserver l’ambiguïté du grec, explicitée en note.
- source_word: ἰδοὺ
  choice: 'Et voici :'
  rationale: Formule française actuelle mais digne qui attire l’attention sur ce qui apparaît dans la vision.
- source_word: θρόνος ἔκειτο
  choice: un trône se dressait
  rationale: Présente un nouvel élément et rend l’imparfait de position par une expression naturelle pour un trône établi dans le ciel.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Dans ce contexte apocalyptique, οὐρανός désigne le domaine céleste plutôt que le ciel atmosphérique.
- source_word: ἐπὶ τὸν θρόνον καθήμενος
  choice: quelqu’un siégeait sur ce trône
  rationale: Rend le participe substantivé sans identifier prématurément l’occupant; « siégeait » convient naturellement à une personne assise sur un trône.
theological_decisions:
- issue: ἐν πνεύματι renvoie-t-il explicitement au Saint-Esprit ou à un état spirituel ou visionnaire ?
  choice: dans l’Esprit
  alternative: en esprit
  rationale: Dans l’Apocalypse, la formule introduit l’expérience prophétique et renvoie probablement à l’action de l’Esprit. Toutefois, l’absence d’article en grec permet une compréhension plus générale; la note conserve donc cette tension.
translation_notes:
  register: Français international moderne, clair et digne. Le présentatif « Et voici » garde la force visionnaire du texte, tandis que « quelqu’un » évite de préciser l’identité au-delà du grec.
