id: REV.4.1
reference: Revelation 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: fr
  text: 'Après cela, je vis, et voici : une porte se tenait ouverte dans le ciel. La première voix[b], que j’avais entendue — comme une trompette qui me parlait[a] —, dit : « Monte ici, et je te montrerai ce qui doit arriver après cela[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parlant avec moi ». Le grec dit plus littéralement « parlant avec moi ».
    reason: lexical_alternative
  - marker: b
    text: La « première voix » renvoie probablement à celle que Jean avait entendue auparavant (voir Apocalypse 1.10).
    reason: cross_reference
  - marker: c
    text: Littéralement « après ces choses », ici comme au début du verset. Le grec répète exactement la même expression aux deux endroits.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela … après cela
  rationale: La formule temporelle est rendue de la même manière à ses deux occurrences, afin de préserver la répétition grecque. Le singulier collectif « cela » est naturel en français et peut renvoyer à l’ensemble des événements précédents.
- source_word: εἶδον, καὶ ἰδοὺ
  choice: 'je regardai : voici que'
  rationale: « Je regardai » introduit naturellement la nouvelle scène visionnaire, tandis que « voici que » conserve la fonction de mise en relief de ἰδοὺ sans produire le tour maladroit « je vis, et voici ».
- source_word: θύρα ἠνεῳγμένη
  choice: une porte était ouverte
  rationale: 'Le plus-que-parfait morphologique du participe parfait passif exprime ici un état résultant : la porte se trouve ouverte. Cette formulation est naturelle et n’explicite pas l’agent.'
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Dans ce contexte apocalyptique, « le ciel » désigne le domaine céleste plutôt que la voûte visible.
- source_word: ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα
  choice: La première voix que j’avais entendue
  rationale: Le plus-que-parfait français marque l’antériorité de l’audition et « première voix » conserve le rappel probable de la voix entendue en Apocalypse 1.10.
- source_word: ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ
  choice: semblable au son d’une trompette et parlant avec moi
  rationale: L’ajout idiomatique de « son » indique que la comparaison porte sur la qualité sonore de la voix, non sur l’objet lui-même. « Parlant avec moi » suit la valeur littérale de μετά avec le génitif, tout en laissant une variante plus courante en note.
- source_word: Ἀνάβα ὧδε
  choice: Monte ici
  rationale: L’impératif invite Jean à rejoindre le lieu céleste du locuteur. « Monte ici » est direct, moderne et fidèle au repérage spatial.
- source_word: ἃ δεῖ γενέσθαι
  choice: ce qui doit arriver
  rationale: Cette expression conserve l’idée de nécessité portée par δεῖ sans en préciser la nature ou la cause.
theological_decisions:
- issue: Portée temporelle de la répétition μετὰ ταῦτα
  choice: Les deux occurrences sont rendues par « après cela » et indiquent une succession temporelle dans le récit visionnaire.
  alternative: Comprendre la seconde occurrence comme une indication exhaustive d’une chronologie eschatologique particulière.
  rationale: La répétition est maintenue, mais la traduction ne décide pas si la succession est seulement littéraire, visionnaire ou liée à un schéma précis de la fin des temps.
- issue: Nécessité exprimée par δεῖ
  choice: « doit arriver »
  alternative: « arrivera certainement » ou une formulation attribuant explicitement cette nécessité à un décret divin
  rationale: Le texte exprime une nécessité sans en expliciter ici le fondement; la traduction préserve cette retenue.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La ponctuation segmente la vision afin d’éviter une phrase surchargée. « Voici que » maintient la vivacité apocalyptique; « trompette » et « ciel » conservent le vocabulaire traditionnel immédiatement compréhensible.
