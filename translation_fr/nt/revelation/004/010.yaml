id: REV.4.10
reference: Revelation 4:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: fr
  text: 'les vingt-quatre anciens se prosterneront devant celui qui siège sur le trône et adoreront celui qui vit pour toujours[a]. Ils jetteront leurs couronnes[b] devant le trône, en disant :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « pour les siècles des siècles ».'
    reason: lexical_alternative
  - marker: b
    text: Le mot grec traduit par « couronnes » peut aussi désigner des couronnes de victoire décernées en signe d’honneur.
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: se prosterneront
  rationale: Dans ce contexte d’adoration, le verbe décrit le fait de tomber devant quelqu’un en signe de révérence. « Se prosterneront » exprime naturellement en français l’action physique et sa portée cultuelle.
- source_word: πρεσβύτεροι
  choice: anciens
  rationale: Terme français courant et traditionnel pour les membres du conseil céleste dans l’Apocalypse, sans la technicité confessionnelle de « presbytres ».
- source_word: ἐνώπιον
  choice: devant
  rationale: Équivalent français naturel et concis dans les deux occurrences.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: celui qui siège sur le trône
  rationale: Préserve le titre descriptif et l’état continu d’intronisation, dans un registre français digne et idiomatique.
- source_word: προσκυνήσουσιν
  choice: adoreront
  rationale: Dans ce contexte divin, le verbe désigne l’adoration, au-delà du seul geste de s’incliner.
- source_word: τῷ ζῶντι
  choice: celui qui vit
  rationale: Rend clairement le participe substantivé sans transformer la description en identification doctrinale explicite.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours
  rationale: Expression française naturelle indiquant une durée sans fin; la tournure grecque littérale est signalée en note.
- source_word: βαλοῦσιν
  choice: jetteront
  rationale: Conserve la vigueur concrète de βάλλω et la solennité du geste symbolique.
- source_word: στεφάνους
  choice: couronnes
  rationale: Rendu naturel dans le cadre royal et apocalyptique; la nuance historique de couronne honorifique ou de victoire est conservée en note.
- source_word: λέγοντες
  choice: en disant
  rationale: Introduit naturellement en français les paroles qui suivent tout en rendant le participe grec.
theological_decisions:
- issue: Référent de celui qui siège sur le trône et qui vit
  choice: Conserver les désignations descriptives « celui qui siège sur le trône » et « celui qui vit pour toujours »
  alternative: Identifier explicitement le référent comme Dieu le Père
  rationale: Le contexte indique fortement Dieu assis sur le trône, mais le grec emploie ici des titres descriptifs. La traduction ne précise donc pas davantage que le texte source.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur des trois verbes est maintenu. « Se prosterner » évite l’expression moins idiomatique « tomber devant » tout en conservant le geste révérenciel; les titres descriptifs du grec restent non interprétés.
