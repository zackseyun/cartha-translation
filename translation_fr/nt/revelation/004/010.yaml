  source_fidelity: 'Le texte rend fidèlement les trois futurs coordonnés : la prosternation des vingt-quatre anciens, leur adoration de celui qui vit éternellement, puis le jet de leurs couronnes devant le trône. « Se prosterneront » transmet correctement la portée révérencielle de πεσοῦνται dans ce contexte, sans ajouter une interprétation doctrinale. Les désignations descriptives du grec sont conservées.'
  naturalness: Le français est moderne, clair et d’un registre digne. « Celui qui siège sur le trône », « se prosterneront », « adoreront » et « en disant » sont naturels dans une traduction biblique internationale. La séparation en deux phrases ne compromet ni l’enchaînement ni le sens.
