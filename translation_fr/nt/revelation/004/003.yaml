revisions:
- from: Et celui qui siégeait avait, par son aspect, l’apparence d’une pierre de jaspe et de cornaline[a]. Autour du trône se trouvait un arc-en-ciel[b] qui, par son aspect, ressemblait à une émeraude.
  to: Et celui qui était assis avait l’apparence du jaspe et de la cornaline[a]. Autour du trône se trouvait un arc-en-ciel[b] qui avait l’apparence d’une émeraude.
  rationale: La révision resserre deux formulations redondantes, rapproche le rendu du participe grec sans surtraduire sa durée, et corrige l’alternative minéralogique de la note. Elle conserve les deux comparaisons d’apparence, la disposition autour du trône et l’ambiguïté raisonnable de ἶρις.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:47:02Z'
review_pass:
  verdict: revise
  source_fidelity: La double comparaison visuelle de ὅμοιος ὁράσει est bien conservée. La correction remplace toutefois l’imparfait « siégeait », qui peut suggérer une action simplement passée, par « était assis », plus proche du participe présent substantivé ὁ καθήμενος. Elle évite aussi la redondance française de « par son aspect, l’apparence » tout en maintenant explicitement le caractère comparatif et visionnaire.
  naturalness: 'Le texte révisé est plus fluide en français international moderne : « avait l’apparence de » rend naturellement la ressemblance visuelle sans répétition lourde. « Halo » est plus idiomatique et moins confessionnellement chargé qu’« auréole » dans la note.'
  terminology: « Cornaline » est un rendu moderne défendable de σαρδίῳ. La note remplace « sardoine », qui désigne plus précisément une variété de calcédoine distincte et peut donc induire en erreur, par « sarde », appellation traditionnelle apparentée. « Jaspe », « arc-en-ciel » et « émeraude » sont appropriés.
  issues:
  - severity: medium
    issue: « avait, par son aspect, l’apparence » est redondant.
    rationale: Les deux expressions rendent déjà la même restriction visuelle portée par ὁράσει. « Avait l’apparence de » conserve pleinement la comparaison sans alourdir la phrase.
  - severity: low
    issue: « celui qui siégeait » emploie l’imparfait.
    rationale: Le présent participial grec décrit celui qui est assis sur le trône. « Celui qui était assis » est plus direct et évite une nuance temporelle passée non exprimée.
  - severity: medium
    issue: La note proposant « sardoine » est lexicalement imprécise.
    rationale: La sardoine est habituellement une calcédoine rubanée (sardonyx), tandis que σαρδίον renvoie à la sarde/cornaline. La note doit fournir une alternative qui ne change pas l’identification de la pierre.
  revised_text: Et celui qui était assis avait l’apparence du jaspe et de la cornaline[a]. Autour du trône se trouvait un arc-en-ciel[b] qui avait l’apparence d’une émeraude.
  revised_footnotes:
  - marker: a
    text: Ou « sarde », nom traditionnel de la pierre ici rendue par « cornaline ».
    reason: lexical_alternative
  - marker: b
    text: Ou « halo » ; le mot grec peut désigner une lueur semblable à un arc-en-ciel.
    reason: lexical_alternative
  revision_rationale: La révision resserre deux formulations redondantes, rapproche le rendu du participe grec sans surtraduire sa durée, et corrige l’alternative minéralogique de la note. Elle conserve les deux comparaisons d’apparence, la disposition autour du trône et l’ambiguïté raisonnable de ἶρις.
