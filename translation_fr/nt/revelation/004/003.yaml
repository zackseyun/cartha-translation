id: REV.4.3
reference: Revelation 4:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: fr
  text: Et celui qui était assis avait l’apparence du jaspe et de la cornaline[a]. Autour du trône se trouvait un arc-en-ciel[b] qui avait l’apparence d’une émeraude.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sarde », nom traditionnel de la pierre ici rendue par « cornaline ».
    reason: lexical_alternative
  - marker: b
    text: Ou « halo » ; le mot grec peut désigner une lueur semblable à un arc-en-ciel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: celui qui siégeait
  rationale: Le participe substantivé désigne celui qui est assis sur le trône. « Siégeait » exprime naturellement en français la posture royale suggérée par le contexte, sans ajouter le mot « là », absent du grec.
- source_word: ὅμοιος ὁράσει
  choice: avait, par son aspect, l’apparence de / par son aspect, ressemblait à
  rationale: 'Le datif ὁράσει précise le domaine de la ressemblance : l’aspect visible. Ces formulations françaises préservent la comparaison visionnaire sans présenter l’être comme matériellement constitué de pierres.'
- source_word: λίθῳ ἰάσπιδι
  choice: une pierre de jaspe
  rationale: Cette formulation conserve explicitement λίθῳ (« pierre ») et rend ἴασπις par le nom français usuel « jaspe ».
- source_word: σαρδίῳ
  choice: cornaline
  rationale: « Cornaline » est un équivalent moderne et intelligible de cette pierre rouge. « Sardoine », plus traditionnel mais moins transparent, est signalé en note.
- source_word: ἶρις
  choice: arc-en-ciel
  rationale: Dans cette vision, le terme désigne le plus naturellement un phénomène lumineux semblable à un arc-en-ciel. La possibilité d’une auréole ou d’un halo est conservée en note.
- source_word: κυκλόθεν τοῦ θρόνου
  choice: autour du trône
  rationale: La formulation rend clairement la position encerclant le trône, sans préciser plus que le grec la forme exacte du phénomène.
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: qui, par son aspect, ressemblait à une émeraude
  rationale: La traduction maintient la ressemblance visuelle et évite de dire que l’arc-en-ciel était réellement fait d’émeraude.
theological_decisions:
- issue: Description de celui qui siège sur le trône au moyen de comparaisons visuelles
  choice: Conserver explicitement le langage de l’apparence et de la ressemblance
  alternative: Décrire la figure comme faite de pierres précieuses ou comme émettant directement leurs couleurs
  rationale: Le grec emploie à deux reprises ὅμοιος ὁράσει, qui marque une ressemblance dans l’apparence. La traduction préserve ainsi le caractère visionnaire et la transcendance de la scène sans transformer la comparaison en description matérielle.
translation_notes:
  register: Français international moderne, digne et accessible. « Siégeait » convient au contexte du trône tout en restant naturel. La légère variation entre « avait l’apparence de » et « ressemblait à » évite une répétition pesante tout en conservant les deux comparaisons explicites du grec.
