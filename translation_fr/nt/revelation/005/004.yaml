id: REV.5.4
reference: Revelation 5:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: fr
  text: Et je pleurais beaucoup, parce que personne n’avait été trouvé digne d’ouvrir le rouleau ni de le regarder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’y regarder ». Dans ce contexte, l’expression peut aussi suggérer le fait d’en examiner le contenu.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: Et je
  rationale: Préserve l’enchaînement narratif de καί et le sujet explicite ἐγώ sans ajouter une insistance excessive.
- source_word: ἔκλαιον
  choice: je pleurais
  rationale: L’imparfait grec décrit une action en cours dans le passé; l’imparfait français en rend naturellement l’aspect.
- source_word: πολύ
  choice: beaucoup
  rationale: L’accusatif adverbial intensifie les pleurs sans préciser qu’ils sont bruyants ou amers.
- source_word: ὅτι
  choice: parce que
  rationale: Introduit clairement la cause des pleurs.
- source_word: οὐδεὶς ἄξιος εὑρέθη
  choice: personne n’avait été trouvé digne
  rationale: Conserve la négation absolue, le passif de εὑρέθη et le poids moral et statutaire de ἄξιος. Le plus-que-parfait situe naturellement cette constatation avant les pleurs dans le récit français.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: d’ouvrir le rouleau
  rationale: « Ouvrir » rend directement l’infinitif; « rouleau » correspond à la forme matérielle suggérée par la scène antique de Revelation 5.
- source_word: οὔτε βλέπειν αὐτό
  choice: ni de le regarder
  rationale: Rend au plus près βλέπειν αὐτό sans imposer l’idée d’en examiner le contenu, tout en conservant la coordination négative οὔτε.
theological_decisions:
- issue: Portée de ἄξιος dans la scène céleste
  choice: digne
  alternative: qualifié; apte
  rationale: « Digne » conserve la gravité morale et statutaire du terme sans expliquer davantage la nature de cette dignité.
- issue: Sens de βιβλίον
  choice: rouleau
  alternative: livre
  rationale: Le contexte antique et l’image de l’objet à ouvrir favorisent « rouleau », sans modifier la portée théologique du passage.
- issue: Portée de βλέπειν αὐτό
  choice: le regarder
  alternative: y regarder; en examiner le contenu
  rationale: Le grec peut désigner simplement le fait de regarder l’objet; le contexte peut suggérer l’accès à son contenu, mais la traduction principale préserve l’indétermination lexicale.
translation_notes:
  register: Français international moderne, sobre et digne. L’imparfait « je pleurais » traduit l’action prolongée; « beaucoup » évite d’ajouter la manière des pleurs. La note conserve l’ambiguïté de βλέπειν αὐτό.
