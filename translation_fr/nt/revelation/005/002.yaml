id: REV.5.2
reference: Revelation 5:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: fr
  text: 'Et je vis un ange puissant qui proclamait d’une voix forte : « Qui est digne d’ouvrir le rouleau et d’en briser les sceaux ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: un ange puissant
  rationale: « Puissant » exprime naturellement en français la force ou la puissance indiquée par ἰσχυρός, sans la lourdeur de « un ange fort ».
- source_word: κηρύσσοντα
  choice: qui proclamait
  rationale: κηρύσσω désigne une annonce publique faite avec autorité. « Proclamait » convient au caractère solennel de la scène, mieux que « prêchait ».
- source_word: ἐν φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Cette tournure idiomatique exprime une parole forte et nettement audible. « D’une voix forte » est naturel et digne en français moderne.
- source_word: Τίς ἄξιος
  choice: Qui est digne
  rationale: ἄξιος exprime ici la dignité ou la qualité requise pour accomplir cette tâche solennelle. « Digne » conserve la portée du terme et son écho théologique sans l’expliciter davantage.
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: d’ouvrir le rouleau
  rationale: Dans cette scène, βιβλίον désigne vraisemblablement un document enroulé, comme le suggèrent ses multiples sceaux. « Rouleau » rend clairement l’objet ancien représenté.
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: et d’en briser les sceaux
  rationale: λύω signifie délier, détacher ou libérer. Appliqué à des sceaux, « briser » exprime concrètement l’action nécessaire pour permettre l’ouverture du rouleau; « en » renvoie sans ambiguïté au rouleau.
theological_decisions:
- issue: Rendu de βιβλίον dans la vision de la salle du trône
  choice: rouleau
  alternative: livre
  rationale: L’objet écrit muni de plusieurs sceaux correspond plus naturellement, dans le contexte du premier siècle et de cette vision, à un rouleau. Ce choix lexical et historique guide la représentation de la scène sans imposer une interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et solennel. La syntaxe reste proche du grec tout en évitant un calque; l’imparfait « proclamait » accompagne naturellement le passé simple narratif « je vis ».
