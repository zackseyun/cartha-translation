id: REV.5.12
reference: Revelation 5:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: fr
  text: 'Ils disaient d’une voix forte : « L’Agneau qui a été immolé[a] est digne de recevoir la puissance, la richesse[b], la sagesse, la force[c], l’honneur, la gloire et la bénédiction. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui a été égorgé ». Le verbe grec peut décrire plus crûment la mise à mort ; « immolé » convient au cadre sacrificiel et solennel de cette adoration.
    reason: lexical_alternative
  - marker: b
    text: Ou « les richesses ».
    reason: lexical_alternative
  - marker: c
    text: Ou « la vigueur ». « Force » permet de distinguer ce terme de « puissance », employé plus tôt dans la liste.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: Ils disaient
  rationale: Le participe présent se rattache à la multitude céleste du verset précédent. Une proposition à l’imparfait rend naturellement ce lien en français tout en maintenant la scène en cours.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Expression française naturelle qui conserve l’image concrète de la voix et l’intensité de la proclamation.
- source_word: Ἄξιόν ἐστιν
  choice: Il est digne
  rationale: Formulation claire et solennelle. La dislocation qui suit — « l’Agneau » — garde la mise en relief doxologique du grec sans produire une inversion artificielle.
- source_word: τὸ ἀρνίον
  choice: l’Agneau
  rationale: Rendu traditionnel et immédiatement intelligible du titre christologique caractéristique de l’Apocalypse. La majuscule signale son emploi comme titre dans ce contexte.
- source_word: τὸ ἐσφαγμένον
  choice: qui a été immolé
  rationale: Le parfait passif évoque une mise à mort dont la portée demeure. « Immolé » convient au contexte sacrificiel et liturgique, tandis que « égorgé » en exprimerait plus crûment le caractère violent.
- source_word: λαβεῖν
  choice: de recevoir
  rationale: Dans cette acclamation, les qualités et honneurs sont attribués à l’Agneau; « recevoir » convient mieux que « prendre » sans exclure l’autorité qui lui revient.
- source_word: δύναμιν
  choice: la puissance
  rationale: Équivalent français usuel de δύναμις, distinct ici de ἰσχύς.
- source_word: πλοῦτον
  choice: la richesse
  rationale: Le singulier collectif correspond au grec et désigne l’abondance des ressources; « les richesses » reste possible.
- source_word: σοφίαν
  choice: la sagesse
  rationale: Équivalent direct et naturel.
- source_word: ἰσχὺν
  choice: la force
  rationale: « Force » distingue naturellement ἰσχύς de δύναμις, rendu par « puissance », et préserve la variété de l’énumération.
- source_word: τιμὴν
  choice: l’honneur
  rationale: Équivalent standard dans un contexte d’hommage et d’adoration.
- source_word: δόξαν
  choice: la gloire
  rationale: Équivalent biblique usuel, pleinement adapté au contexte céleste.
- source_word: εὐλογίαν
  choice: la bénédiction
  rationale: Rendu formel qui préserve l’idée d’une parole de bénédiction ou d’éloge adressée à l’Agneau; « louange » serait plus interprétatif.
theological_decisions:
- issue: Titre christologique et majuscule
  choice: l’Agneau
  alternative: l’agneau
  rationale: Dans l’Apocalypse, ἀρνίον désigne de façon titulaire Jésus exalté. La majuscule rend cet emploi contextuel sans ajouter une précision doctrinale absente du texte.
- issue: Langage de la mise à mort sacrificielle
  choice: qui a été immolé
  alternative: qui a été égorgé
  rationale: « Immolé » maintient le lien entre la mort de l’Agneau et son identité sacrificielle dans cette scène d’adoration. La note conserve la possibilité d’un rendu plus graphique du verbe σφάζω.
- issue: Sens de εὐλογία dans l’acclamation
  choice: la bénédiction
  alternative: la louange
  rationale: Le terme peut désigner une bénédiction prononcée et, dans une doxologie, rejoindre l’idée de louange. Le rendu retenu conserve la forme lexicale et l’ambivalence plutôt que de réduire le terme à la seule louange.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve le rythme solennel de l’acclamation et les sept éléments de l’énumération grecque. La dislocation « Il est digne, l’Agneau… » met le sujet en relief de manière naturelle en français.
