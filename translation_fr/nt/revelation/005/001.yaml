- from: Puis je vis, dans la main droite de celui qui était assis sur le trône, un rouleau écrit à l’intérieur et au verso[a], scellé de sept sceaux.[b]
  to: Puis je vis, dans la main droite de celui qui siège sur le trône, un rouleau écrit à l’intérieur et au verso[a], scellé de sept sceaux.
  rationale: La révision conserve l’image et les ambiguïtés pertinentes du grec, corrige la formulation imprécise de la note concernant ὄπισθεν, rend le participe descriptif plus naturellement et supprime une note non nécessaire. Aucun choix théologique n’est ajouté.
