review_pass:
  verdict: revise
  source_fidelity: 'Le sens du grec est globalement bien rendu : le rouleau est dans la main droite de celui qui siège sur le trône, il est écrit sur ses deux faces et porte sept sceaux. « Au verso » restitue adéquatement ὄπισθεν dans l’image d’un rouleau. Toutefois, la note a traduit ὄπισθεν par « derrière », ce qui est moins exact et moins clair que « au verso » ou « sur le revers ».'
  naturalness: 'Le texte est fluide et de registre biblique moderne. « Celui qui était assis » est possible, mais « celui qui siège » rend plus naturellement la valeur descriptive du participe présent et évite de suggérer inutilement une action simplement passée. La ponctuation de l’appel de note doit être corrigée : l’appel se place avant le point.'
  terminology: '« Rouleau », « scellé de sept sceaux » et « trône » sont appropriés. La note anglaise correspondant à βιβλίον n’est pas représentée : puisqu’aucune note n’est nécessaire au français pour comprendre « rouleau », son omission est acceptable. En revanche, la note attachée à « scellé de sept sceaux » offre une alternative qui n’est pas nécessaire et ne correspond pas à la note lexicale anglaise ; elle peut être supprimée.'
  issues:
