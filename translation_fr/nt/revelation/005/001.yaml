    issue: La note a donne « derrière » comme littéral pour ὄπισθεν.
    rationale: Dans ce contexte matériel, ὄπισθεν désigne le revers ou le dos du rouleau, non un emplacement vague « derrière ». La note devrait employer « au verso » ou « sur le revers ».
  - severity: low
    issue: « était assis » peut surmarquer l’antériorité ou un état passé.
    rationale: Le génitif participial καθημένου est descriptif. « Celui qui siège sur le trône » est plus idiomatique en français littéraire moderne et préserve mieux cette valeur.
  - severity: low
    issue: L’appel de note [b] est placé après le point et la note correspondante est superflue.
    rationale: L’appel doit suivre immédiatement l’expression annotée, avant la ponctuation. L’alternative « fermé par sept sceaux » n’améliore pas le texte et n’est pas requise par l’ambiguïté grecque.
  revised_text: Puis je vis, dans la main droite de celui qui siège sur le trône, un rouleau écrit à l’intérieur et au verso[a], scellé de sept sceaux.
  revised_footnotes:
