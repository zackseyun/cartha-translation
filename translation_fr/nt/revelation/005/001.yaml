source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: fr
  text: Puis je vis, dans la main droite de celui qui siège sur le trône, un rouleau écrit à l’intérieur et au verso[a], scellé de sept sceaux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « écrit à l’intérieur et au verso ». On peut aussi rendre le second terme par « sur le revers » ou, plus généralement, « à l’extérieur ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: je vis
  rationale: L’aoriste de ὁράω appelle ici un passé simple narratif, naturel dans le registre biblique écrit moderne.
- source_word: ἐπὶ τὴν δεξιὰν
  choice: dans la main droite
  rationale: Bien que ἐπί puisse signifier « sur », l’expression désigne naturellement ici l’emplacement du rouleau dans la main droite; « dans » rend clairement la scène en français.
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: de celui qui était assis sur le trône
  rationale: Cette formulation conserve la désignation descriptive du personnage sans ajouter son identité ni surcharger la valeur temporelle du participe.
- source_word: βιβλίον
  choice: rouleau
  rationale: Dans ce contexte ancien, βιβλίον désigne vraisemblablement un rouleau plutôt qu’un livre relié; l’écriture sur les deux faces et les sceaux soutiennent cette image.
- source_word: γεγραμμένον
  choice: écrit
  rationale: Le participe parfait passif présente le rouleau dans l’état résultant d’avoir été écrit; « écrit » est simple et idiomatique.
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: à l’intérieur et au verso
  rationale: La formulation rend les deux faces du rouleau tout en conservant la nuance de ὄπισθεν comme face arrière plutôt que de la généraliser en « extérieur ».
- source_word: κατεσφραγισμένον
  choice: scellé
  rationale: Le participe parfait passif indique un état achevé. « Scellé » restitue naturellement ce sens sans expliciter séparément la force éventuelle du préverbe κατα-.
- source_word: σφραγῖσιν ἑπτά
  choice: de sept sceaux
  rationale: En français, « scellé de sept sceaux » exprime de façon concise et naturelle l’instrument ou le dispositif de scellement.
theological_decisions:
- issue: Identification du personnage assis sur le trône
  choice: celui qui était assis sur le trône
  alternative: Dieu assis sur le trône
  rationale: Le grec désigne le personnage par une description et non par un nom divin explicite. La traduction préserve cette présentation littéraire sans résoudre l’identification dans le corps du verset.
translation_notes:
  register: Français international moderne, digne et narratif. Le passé simple convient à la narration visionnaire écrite. « Rouleau » privilégie le contexte matériel antique; « au verso » est courant et précis. Tous les marqueurs de notes figurent dans le texte.
