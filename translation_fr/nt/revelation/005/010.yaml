id: REV.5.10
reference: Revelation 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: fr
  text: Tu as fait d’eux un royaume[a] et des prêtres pour notre Dieu, et ils règnent sur la terre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « des rois » au lieu de « un royaume ».
    reason: textual_variant
  - marker: b
    text: Certains manuscrits portent « ils régneront sur la terre » au lieu de « ils règnent sur la terre ».
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: tu as fait
  rationale: L’aoriste désigne ici l’acte accompli par l’Agneau. Le passé composé est naturel en français moderne et convient au contexte hymnique.
- source_word: αὐτοὺς
  choice: d’eux
  rationale: Avec la tournure française « faire de quelqu’un… », le pronom accusatif grec devient naturellement « d’eux ».
- source_word: τῷ θεῷ ἡμῶν
  choice: pour notre Dieu
  rationale: Le datif exprime ici naturellement le bénéficiaire ou celui au service duquel ils ont été constitués. « Pour notre Dieu » est idiomatique sans préciser davantage la relation.
- source_word: βασιλείαν
  choice: un royaume
  rationale: Le singulier désigne collectivement les rachetés constitués en royaume, conformément au texte grec retenu et à l’écho d’Exode 19.6.
- source_word: ἱερεῖς
  choice: des prêtres
  rationale: Équivalent français courant et précis du nom grec, coordonné à « un royaume ».
- source_word: βασιλεύουσιν
  choice: ils règnent
  rationale: Dans le texte grec fourni, la forme est un présent actif de l’indicatif, et non un futur. Le présent est donc maintenu dans le texte principal.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: ἐπί avec le génitif indique ici le lieu. « Sur la terre » est direct et évite de renforcer indûment l’idée de domination qu’exprimerait « sur toute la terre » ou « au-dessus de la terre ».
theological_decisions:
- issue: Identité des rachetés comme βασιλείαν
  choice: un royaume
  alternative: des rois
  rationale: Le texte SBLGNT fourni porte βασιλείαν, « royaume », et non βασιλεῖς, « rois ». La variante est signalée sans être introduite dans le texte principal.
- issue: Moment du règne
  choice: ils règnent
  alternative: ils régneront
  rationale: La forme βασιλεύουσιν du texte source fourni est au présent. La traduction conserve ce présent sans trancher par harmonisation une question eschatologique; la variante au futur est indiquée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe à l’Agneau dans le cantique. La syntaxe « faire d’eux… » évite un calque maladroit tout en conservant les rapports grammaticaux et le parallélisme.
