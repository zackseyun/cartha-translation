id: REV.5.3
reference: Revelation 5:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: fr
  text: Et personne, ni dans le ciel, ni sur la terre, ni sous la terre, ne pouvait ouvrir le rouleau ni le regarder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le livre ». Le mot grec peut désigner de manière générale un document écrit, mais, dans cette scène, « rouleau » correspond mieux à l’image antique.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: personne
  rationale: Pronom négatif naturel en français, qui exprime sans restriction l’absence de tout être capable d’accomplir l’action.
- source_word: ἐδύνατο
  choice: ne pouvait
  rationale: L’imparfait de pouvoir rend directement l’imparfait grec et l’incapacité constatée dans la scène.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Formulation française idiomatique qui conserve le singulier et la localisation céleste.
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Rend la localisation exprimée par ἐπί avec le génitif et maintient le cadre cosmique en trois domaines.
- source_word: ὑποκάτω τῆς γῆς
  choice: sous la terre
  rationale: Traduction spatiale directe qui préserve l’imagerie apocalyptique.
- source_word: ἀνοῖξαι
  choice: ouvrir
  rationale: Infinitif simple et exact après le verbe exprimant la capacité.
- source_word: τὸ βιβλίον
  choice: le rouleau
  rationale: Dans cette vision antique, βιβλίον désigne vraisemblablement un document enroulé; « rouleau » évite l’image anachronique d’un livre relié.
- source_word: οὔτε βλέπειν αὐτό
  choice: ni le regarder
  rationale: οὔτε coordonne négativement le second infinitif; « regarder » exprime ici l’action de porter le regard sur le rouleau, sans ajouter l’intensif « même », absent du grec.
theological_decisions:
- issue: Portée cosmique de l’incapacité à ouvrir le rouleau
  choice: 'Conserver les trois domaines: « dans le ciel », « sur la terre » et « sous la terre ».'
  alternative: Généraliser par « nulle part dans la création ».
  rationale: La triple formulation souligne l’incapacité universelle tout en conservant l’imagerie cosmique et la tension propres à la vision.
translation_notes:
  register: Français moderne, digne et accessible. La construction corrélative « ni… ni… ni… » rend clairement la portée universelle, tandis que « ne pouvait » maintient la narration à l’imparfait. Aucun intensif non explicite n’est ajouté devant « regarder ».
