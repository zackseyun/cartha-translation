id: REV.5.8
reference: Revelation 5:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: fr
  text: 'Quand il eut pris le rouleau, les quatre êtres vivants et les vingt-quatre anciens tombèrent devant l’Agneau. Chacun tenait une cithare[a] et des coupes d’or pleines d’encens : ce sont les prières des saints[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une harpe » ou « une lyre ».
    reason: Alternative lexicale pour κιθάρα, instrument antique à cordes pincées dont l’équivalent exact ne correspond pas parfaitement aux catégories instrumentales modernes.
  - marker: b
    text: Ou « de ceux qui sont saints ».
    reason: Cette formulation explicite le sens de οἱ ἅγιοι et évite que « saints » soit compris uniquement au sens ultérieur de personnes canonisées.
lexical_decisions:
- source_word: βιβλίον
  choice: rouleau
  rationale: Dans la scène d’Apocalypse 5, le terme désigne vraisemblablement un document écrit enroulé. « Rouleau » restitue mieux la forme antique et l’imagerie du passage que le mot moderne « livre ».
- source_word: ζῷα
  choice: êtres vivants
  rationale: Le terme désigne ici les êtres célestes qui entourent le trône. « Êtres vivants » évite la connotation animale ou péjorative de « bêtes » et reste naturel en français.
- source_word: πρεσβύτεροι
  choice: anciens
  rationale: « Anciens » est la désignation française courante de ces vingt-quatre figures célestes et n’impose pas un titre ecclésiastique postérieur.
- source_word: ἔπεσαν ἐνώπιον τοῦ ἀρνίου
  choice: tombèrent devant l’Agneau
  rationale: Cette formulation concise conserve à la fois le mouvement de prosternation et la position révérencielle exprimée par ἐνώπιον. La majuscule à « Agneau » marque son emploi comme titre christologique dans l’Apocalypse.
- source_word: ἔχοντες ἕκαστος
  choice: Chacun tenait
  rationale: La tournure distributive est rendue clairement et naturellement. Une nouvelle phrase allège la longue structure grecque sans modifier la relation entre les participants et les objets tenus.
- source_word: κιθάραν
  choice: une cithare
  rationale: κιθάρα désigne un instrument à cordes pincées proche de la lyre. « Cithare » correspond directement au terme grec, tandis que « harpe », traditionnel dans certaines versions, est signalé en note.
- source_word: φιάλας χρυσᾶς
  choice: des coupes d’or
  rationale: φιάλη désigne une coupe ou un récipient large et peu profond. « Coupes » est plus précis et plus actuel que « fioles ».
- source_word: γεμούσας θυμιαμάτων
  choice: pleines d’encens
  rationale: Le pluriel grec peut naturellement être rendu en français par le nom massif « encens ». La formulation est fidèle et idiomatique.
- source_word: αἵ εἰσιν αἱ προσευχαὶ τῶν ἁγίων
  choice: ce sont les prières des saints
  rationale: La proposition équative grecque est conservée directement, sans l’affaiblir en « représentent ». « Saints » traduit le substantif pluriel οἱ ἅγιοι dans son sens de personnes consacrées à Dieu.
theological_decisions:
- issue: Identification symbolique de l’encens aux prières
  choice: ce sont les prières des saints
  alternative: cela représente les prières des saints
  rationale: Le grec emploie une identification directe avec αἵ εἰσιν. La formulation retenue préserve la force propre au symbolisme apocalyptique sans introduire une explication interprétative.
- issue: Sens de τῶν ἁγίων
  choice: des saints
  alternative: de ceux qui sont saints
  rationale: « Saints » maintient le vocabulaire biblique de la consécration à Dieu. Dans ce contexte, il désigne le peuple saint et ne doit pas être limité à une catégorie ultérieure de personnes officiellement canonisées.
- issue: Portée distributive de ἔχοντες ἕκαστος
  choice: Chacun tenait une cithare et des coupes d’or
  alternative: les anciens tenaient chacun une cithare et des coupes d’or
  rationale: Le texte associe les quatre êtres vivants et les vingt-quatre anciens avant le participe pluriel, puis emploie « chacun ». La traduction conserve cette portée formellement ouverte au lieu de limiter explicitement les objets aux seuls anciens.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme est allégé par une division en deux phrases. « Êtres vivants », « anciens », « Agneau » et « saints » conservent les principaux repères littéraires et théologiques de l’Apocalypse. Les marqueurs de notes sont placés immédiatement après les termes concernés.
