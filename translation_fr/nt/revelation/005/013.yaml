id: REV.5.13
reference: Revelation 5:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: fr
  text: 'Et j’entendis toute créature[a] dans le ciel, sur la terre, sous la terre et sur la mer, ainsi que tout ce qui s’y trouve, dire : « À celui qui siège sur le trône et à l’Agneau soient la bénédiction, l’honneur, la gloire et la puissance, pour toujours et à jamais[b] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tout être créé ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « pour les siècles des siècles ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: toute créature
  rationale: κτίσμα désigne un être ou une chose créée. Dans cette scène où la création entière fait entendre sa louange, « toute créature » est naturel en français et conserve la force distributive de πᾶν.
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: dans le ciel, sur la terre, sous la terre et sur la mer, ainsi que tout ce qui s’y trouve
  rationale: L’énumération embrasse tous les domaines du cosmos. « Tout ce qui s’y trouve » rend la portée globale de τὰ ἐν αὐτοῖς πάντα sans alourdir la phrase.
- source_word: ἤκουσα λέγοντας
  choice: j’entendis ... dire
  rationale: La construction française avec « entendre » suivi de l’infinitif rend naturellement le participe λέγοντας, dont le pluriel renvoie selon le sens à l’ensemble des créatures.
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: à celui qui siège sur le trône
  rationale: Cette formulation rend le participe substantivé, garde son aspect présent et adopte un registre digne sans archaïsme.
- source_word: τῷ ἀρνίῳ
  choice: à l’Agneau
  rationale: « L’Agneau » est le titre christologique caractéristique de l’Apocalypse et préserve son imagerie sacrificielle et royale.
- source_word: ἡ εὐλογία
  choice: la bénédiction
  rationale: Dans cette acclamation, εὐλογία désigne la bénédiction attribuée à Dieu et à l’Agneau. Le terme français conserve la forme doxologique du grec.
- source_word: ἡ τιμή
  choice: l’honneur
  rationale: « L’honneur » exprime clairement l’estime et l’hommage rendus dans ce contexte cultuel.
- source_word: ἡ δόξα
  choice: la gloire
  rationale: « La gloire » est l’équivalent établi et sémantiquement approprié de δόξα dans une scène d’adoration.
- source_word: τὸ κράτος
  choice: la puissance
  rationale: κράτος évoque une force effective et souveraine. « Puissance » reste naturel dans une doxologie française et évite le sens politique plus étroit que peut prendre « domination ».
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  rationale: Cette tournure française exprime clairement la durée sans fin visée par l’idiome grec, tandis que sa forme littérale est signalée en note.
theological_decisions:
- issue: Doxologie commune adressée à Dieu et à l’Agneau
  choice: Conserver une seule acclamation adressée conjointement à « celui qui siège sur le trône » et à « l’Agneau ».
  alternative: Expliciter séparément ce qui revient à chacun des deux destinataires.
  rationale: Le grec coordonne les deux destinataires sous une même attribution de bénédiction, d’honneur, de gloire et de puissance. La traduction maintient cette unité et la tension christologique du texte sans commentaire doctrinal ajouté.
- issue: Référent de κτίσμα dans la louange cosmique
  choice: toute créature
  alternative: toute la création ; toute chose créée
  rationale: Le contexte représente les habitants de tous les domaines cosmiques en train de parler. « Toute créature » garde à la fois cette dimension vocale et la portée universelle de l’expression.
translation_notes:
  register: Français international moderne, fluide et digne. La structure cumulative de la vision et le parallélisme solennel de la doxologie sont conservés. Le subjonctif « soient » explicite naturellement en français la valeur d’acclamation de la phrase nominale grecque.
