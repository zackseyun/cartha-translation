id: REV.5.11
reference: Revelation 5:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: fr
  text: Puis je regardai[a], et j’entendis la voix d’un grand nombre d’anges autour du trône, des êtres vivants et des anciens. Leur nombre était de myriades de myriades et de milliers de milliers[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je vis » au début du verset.
    reason: lexical_alternative
  - marker: b
    text: 'Grec : « des myriades de myriades et des milliers de milliers », expression évoquant une multitude immense. On peut aussi traduire : « des dizaines de milliers de dizaines de milliers et des milliers de milliers ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: je regardai
  rationale: Dans la progression de la vision, cette formulation exprime naturellement que Jean porte son attention sur une nouvelle scène avant de rapporter ce qu’il entend. « Je vis » reste possible.
- source_word: ἤκουσα
  choice: j’entendis
  rationale: Équivalent narratif direct de l’aoriste de ἀκούω.
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: la voix d’un grand nombre d’anges
  rationale: Le singulier collectif « la voix » est conservé. « Un grand nombre d’anges » rend πολλῶν avec une ampleur naturelle en français.
- source_word: κύκλῳ
  choice: autour
  rationale: Rend clairement et sobrement la disposition spatiale de la scène.
- source_word: ζῴων
  choice: les êtres vivants
  rationale: Désigne les quatre figures célestes propres aux visions de l’Apocalypse sans les assimiler à de simples animaux.
- source_word: πρεσβυτέρων
  choice: les anciens
  rationale: Traduction française traditionnelle et compréhensible de πρεσβύτεροι dans la scène céleste.
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: leur nombre était
  rationale: Formulation française naturelle qui conserve la mention explicite du nombre.
- source_word: μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων
  choice: des myriades de myriades et des milliers de milliers
  rationale: Conserve l’expression accumulative du grec et son effet d’immensité sans la réduire à un calcul précis ni ajouter « innombrables ».
theological_decisions:
- issue: Désignation des ζῷα dans la salle du trône
  choice: les êtres vivants
  alternative: les créatures vivantes
  rationale: « Les êtres vivants » préserve leur identité particulière dans l’Apocalypse et évite que « créatures » ne les fasse comprendre comme des animaux ordinaires.
- issue: Portée des grands nombres apocalyptiques
  choice: conserver « myriades de myriades et milliers de milliers »
  alternative: des dizaines de milliers de dizaines de milliers et des milliers de milliers
  rationale: La formulation retenue préserve l’intensité rhétorique et l’indétermination relative de l’expression grecque, sans imposer une lecture strictement arithmétique.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans archaïsme lexical marqué. La répétition numérique inhabituelle est volontairement maintenue pour préserver la force de l’image apocalyptique.
