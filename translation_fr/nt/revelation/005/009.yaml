id: REV.5.9
reference: Revelation 5:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: fr
  text: 'Et ils chantent un chant nouveau en disant :


    « Tu es digne de prendre le rouleau

    et d’en ouvrir les sceaux,

    car tu as été égorgé,

    et tu as acheté pour Dieu[a], par ton sang[b], des gens[c]

    de toute tribu, de toute langue, de tout peuple et de toute nation[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à Dieu ».
    reason: lexical_alternative
  - marker: b
    text: Ou « avec ton sang ».
    reason: lexical_alternative
  - marker: c
    text: Le grec ne précise pas ici qui a été acheté ; « des gens » est sous-entendu d’après le contexte.
    reason: textual_clarity
  - marker: d
    text: 'Littéralement : « de toute tribu et langue et peuple et nation » ; cette formule à quatre termes souligne l’étendue mondiale de ceux qui ont été achetés.'
    reason: cultural_note
lexical_decisions:
- source_word: ᾄδουσιν
  choice: ils chantent
  rationale: Le présent narratif grec est rendu naturellement par un présent français vivant, sans ajouter l’idée de louange qui n’est pas exprimée par le verbe seul.
- source_word: ᾠδὴν καινὴν
  choice: un chant nouveau
  rationale: « Chant nouveau » est une expression française naturelle et digne qui conserve le motif biblique de la nouveauté.
- source_word: Ἄξιος εἶ
  choice: Tu es digne
  rationale: Cette formulation actuelle conserve l’acclamation directe sans recourir à une inversion artificielle.
- source_word: τὸ βιβλίον
  choice: le rouleau
  rationale: Le contexte décrit un document ancien muni de sceaux ; « rouleau » en représente mieux la forme matérielle que « livre ».
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: d’en ouvrir les sceaux
  rationale: La formulation conserve la compression du grec, qui parle d’« ouvrir » les sceaux, plutôt que de préciser par interprétation qu’il faut les briser.
- source_word: ἐσφάγης
  choice: tu as été égorgé
  rationale: « Égorgé » rend la violence concrète de σφάζω et convient à l’image de l’Agneau, sans remplacer le terme par une formulation doctrinale plus développée comme « offert en sacrifice ».
- source_word: ἠγόρασας
  choice: tu as acheté
  rationale: « Acheter » conserve le sens commercial fondamental du verbe. « Racheter » introduirait en français une nuance de délivrance ou de rachat qui n’est pas encodée à elle seule dans cette forme verbale.
- source_word: τῷ θεῷ
  choice: pour Dieu
  rationale: Le datif indique naturellement le bénéficiaire ou celui à qui appartiennent les personnes achetées. La possibilité plus littérale « à Dieu » est signalée en note.
- source_word: ἐν τῷ αἵματί σου
  choice: par ton sang
  rationale: La préposition ἐν exprime ici vraisemblablement le moyen ; « par ton sang » le rend sans développer le texte en « au prix de ton sang ».
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: de toute tribu, de toute langue, de tout peuple et de toute nation
  rationale: La répétition de « toute/tout » restitue la portée distributive de πάσης dans la formule à quatre termes et garde clairement ses dimensions ethniques et linguistiques.
- source_word: λαοῦ
  choice: peuple
  rationale: « Peuple » est l’équivalent collectif courant de λαός et demeure distinct de « tribu » et de « nation » dans l’énumération.
theological_decisions:
- issue: Le complément d’objet de « tu as acheté » n’est pas exprimé dans le texte grec retenu
  choice: Ajouter « des gens » dans le texte et signaler cet ajout par une note
  alternative: 'Conserver l’ellipse : « tu as acheté pour Dieu, par ton sang, de toute tribu… »'
  rationale: Le français exige normalement un complément humain explicite pour que la phrase soit intelligible. Le contexte permet de restituer un objet humain indéterminé, mais la note préserve la particularité textuelle au lieu de la masquer.
- issue: Valeur du datif τῷ θεῷ
  choice: pour Dieu
  alternative: à Dieu
  rationale: « Pour Dieu » exprime naturellement le bénéficiaire ou le destinataire de l’achat, tandis que « à Dieu » demeure grammaticalement possible et est conservé en note sans trancher davantage la relation théologique.
- issue: Langage relatif au sang de l’Agneau
  choice: Conserver « par ton sang »
  alternative: Paraphraser par « par ta mort » ou « au prix de ton sang »
  rationale: Le texte relie explicitement l’achat au sang de l’Agneau. La traduction garde cette image sacrificielle concrète sans la réduire à la mort en général ni expliciter une théorie particulière de l’expiation.
- issue: Portée de « de toute tribu… »
  choice: Comprendre qu’il s’agit de gens provenant de chacun des groupes énumérés
  alternative: Comprendre que chaque tribu, langue, peuple et nation dans son ensemble a été acheté
  rationale: La construction ἐκ πάσης indique une provenance au sein de chaque catégorie. La traduction évite donc d’affirmer que chaque groupe serait acheté collectivement dans sa totalité.
translation_notes:
  register: Français international moderne, soutenu sans archaïsme. Le parallélisme poétique est disposé en lignes brèves. « Égorgé » est volontairement concret afin de préserver la force de l’image de l’Agneau ; « acheté » maintient la métaphore commerciale du grec, tandis que les notes rendent visibles les ambiguïtés syntaxiques et lexicales.
