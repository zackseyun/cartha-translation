source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα ⸀ἔλεγον· Ἀμήν. καὶ οἱ πρεσβύτεροι ἔπεσαν καὶ προσεκύνησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: fr
  text: 'Et les quatre êtres vivants disaient : « Amen. » Et les anciens tombèrent à terre et se prosternèrent.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits ajoutent après « se prosternèrent » un complément explicite, tel que « devant celui qui vit aux siècles des siècles » ou « devant lui ». Le texte principal suit la leçon plus courte du SBLGNT, qui laisse le complément implicite d’après le contexte.
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: êtres vivants
  rationale: Dans l’Apocalypse, le terme désigne les êtres célestes qui entourent le trône, en écho à la vision d’Ézéchiel. « Êtres vivants » évite le sens réducteur d’« animaux » et reste naturel en français.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente l’acclamation comme une action en cours ou répétée ; l’imparfait français en préserve naturellement l’aspect.
- source_word: Ἀμήν
  choice: Amen
  rationale: La translittération conserve la formule liturgique reconnue et sa fonction d’acclamation.
- source_word: πρεσβύτεροι
  choice: anciens
  rationale: Le terme désigne ici le groupe céleste identifié dans l’Apocalypse, et non simplement des hommes âgés.
- source_word: ἔπεσαν
  choice: tombèrent à terre
  rationale: Cette formulation exprime clairement le mouvement corporel qui accompagne la prosternation.
- source_word: προσεκύνησαν
  choice: se prosternèrent
  rationale: Dans ce contexte d’adoration céleste, le verbe décrit un geste de révérence cultuelle. « Se prosternèrent » restitue l’acte sans ajouter en français un complément d’objet absent du texte grec.
theological_decisions:
- issue: Objet de la prosternation laissé implicite
  choice: Conserver « se prosternèrent » sans préciser devant qui.
  alternative: « l’adorèrent », « adorèrent Dieu » ou « se prosternèrent devant celui qui vit aux siècles des siècles »
  rationale: Le texte du SBLGNT ne donne aucun objet après προσεκύνησαν. La formulation retenue préserve cette absence au lieu d’introduire un élément tiré du contexte ou de variantes manuscrites.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination est rendue par « puis » dans la seconde proposition pour une lecture naturelle, sans modifier la succession des actions. Le point d’exclamation après « Amen » marque l’acclamation liturgique.
