id: REV.5.5
reference: Revelation 5:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: fr
  text: 'Et l’un des anciens me dit : « Ne pleure pas. Voici : le Lion de la tribu de Juda[a], la Racine de David, a vaincu[b], pour ouvrir[c] le rouleau et ses sept sceaux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire plus explicitement : « le Lion issu de la tribu de Juda ».'
    reason: lexical_alternative
  - marker: b
    text: Ou « a remporté la victoire ». Le verbe grec est un terme clé de l’Apocalypse pour exprimer la victoire remportée sur une opposition.
    reason: lexical_alternative
  - marker: c
    text: L’infinitif grec peut aussi être rendu, en explicitant sa valeur de résultat ou de qualification, par « de sorte qu’il peut ouvrir ».
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Dans l’Apocalypse, le terme désigne un groupe céleste reconnu et non simplement des hommes âgés.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent français, qui conserve l’immédiateté du récit.
- source_word: Μὴ κλαῖε
  choice: Ne pleure pas
  rationale: Formulation française naturelle et digne, sans imposer la nuance plus précise de « cesse de pleurer ».
- source_word: ἰδοὺ
  choice: Voici
  rationale: Marqueur d’attention courant dans le registre biblique moderne, moins archaïque que « voici que » ou « contemple ».
- source_word: ἐνίκησεν
  choice: a remporté la victoire
  rationale: Cette expression préserve le motif central de victoire associé à νικάω dans l’Apocalypse, sans suggérer nécessairement une conquête militaire.
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: le Lion de la tribu de Juda
  rationale: Formule française idiomatique et traditionnelle qui conserve le titre messianique; le grec ἐκ peut être explicité par « issu de ».
- source_word: ἡ ῥίζα Δαυίδ
  choice: la Racine de David
  rationale: Le nom commun est conservé comme titre messianique faisant écho aux Écritures d’Israël.
- source_word: ἀνοῖξαι
  choice: afin d’ouvrir
  rationale: L’infinitif français maintient le lien entre la victoire et l’ouverture sans ajouter explicitement l’idée de capacité ou de dignité.
- source_word: τὸ βιβλίον
  choice: le rouleau
  rationale: Dans cette scène, il s’agit d’un document enroulé plutôt que d’un livre au format codex.
- source_word: σφραγῖδας
  choice: sceaux
  rationale: Équivalent français usuel des dispositifs qui ferment et authentifient le rouleau.
- source_word: αὐτοῦ
  choice: ses
  rationale: Le possessif renvoie naturellement au rouleau en français.
theological_decisions:
- issue: Titres royaux et messianiques
  choice: Conserver directement « le Lion de la tribu de Juda, la Racine de David »
  alternative: Paraphraser ou expliquer ces titres dans le corps du texte
  rationale: L’accumulation des deux titres est intentionnelle et doit garder sa force scripturaire et christologique sans ajout doctrinal.
- issue: Rapport de ἀνοῖξαι avec ἐνίκησεν
  choice: « a remporté la victoire afin d’ouvrir »
  alternative: « a remporté la victoire et peut donc ouvrir » ou, plus littéralement, « a remporté la victoire pour ouvrir »
  rationale: « Afin d’ouvrir » conserve le lien syntaxique tout en laissant ouverte la nuance exacte de l’infinitif, qui peut exprimer le but, le résultat ou la qualification effective.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le présent narratif est conservé. Les titres messianiques prennent une majuscule. Les notes signalent les principales ambiguïtés lexicales et syntaxiques sans les résoudre dans le texte.
