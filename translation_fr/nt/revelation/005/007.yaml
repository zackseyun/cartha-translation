id: REV.5.7
reference: Revelation 5:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἦλθεν καὶ εἴληφεν ἐκ τῆς δεξιᾶς τοῦ καθημένου ἐπὶ τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: fr
  text: Il vint et prit le rouleau[a] de la main droite de celui qui était assis sur le trône.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec sous-entend ici l’objet; le contexte indique qu’il s’agit du rouleau.
    reason: Signaler avec transparence que « le rouleau » est explicité à partir du contexte immédiat.
lexical_decisions:
- source_word: ἦλθεν
  choice: vint
  rationale: L’aoriste de ἔρχομαι décrit ici le mouvement de l’Agneau vers celui qui siège sur le trône. « Vint » reste proche du verbe grec sans ajouter la nuance interprétative de « s’avança » ou « s’approcha ».
- source_word: εἴληφεν
  choice: prit
  rationale: Le parfait de λαμβάνω s’insère dans la succession narrative de la vision. Le passé simple français rend naturellement cette action ponctuelle et décisive; « reçut » serait moins concret.
- source_word: ἐκ
  choice: de
  rationale: 'La préposition indique ici la provenance: le rouleau est pris de la main droite. « De » est la formulation française naturelle.'
- source_word: τῆς δεξιᾶς
  choice: la main droite
  rationale: Dans cette construction, δεξιά désigne la main droite plutôt que le côté droit, ce qui conserve l’image concrète de la scène.
- source_word: τοῦ καθημένου
  choice: celui qui était assis
  rationale: Le participe substantivé désigne la personne assise sur le trône. L’imparfait convient au cadre narratif de la vision et exprime l’état continu sans tournure archaïque.
- source_word: ἐπὶ τοῦ θρόνου
  choice: sur le trône
  rationale: ἐπί a ici son sens locatif ordinaire. « Sur le trône » est clair et naturel en français moderne.
theological_decisions:
- issue: Objet direct sous-entendu de εἴληφεν
  choice: Expliciter « le rouleau », identifié par le contexte immédiat.
  alternative: 'Employer seulement un pronom: « le prit »; ou reproduire l’absence d’objet, ce qui serait incorrect en français.'
  rationale: Le grec omet l’objet parce que le rouleau mentionné dans le contexte est évident. Le nommer en français clarifie la phrase sans ajouter un nouvel élément à la vision.
- issue: Désignation de la figure assise sur le trône
  choice: « celui qui était assis sur le trône »
  alternative: « celui qui siège sur le trône »
  rationale: Cette formulation maintient la distinction narrative entre l’Agneau et la figure assise sur le trône, sans ajouter d’identification doctrinale absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au récit visionnaire écrit et permet de conserver la coordination concise des deux actions grecques.
