id: REV.5.6
reference: Revelation 5:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: fr
  text: Et je vis, au milieu du trône et des quatre êtres vivants, et au milieu des anciens, un Agneau debout, comme immolé[a], avec sept cornes et sept yeux, qui sont les sept esprits de Dieu[b], envoyés sur toute la terre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « comme s’il avait été égorgé » ; littéralement, « comme égorgé ».'
    reason: lexical_alternative
  - marker: b
    text: L’expression « les sept esprits de Dieu » est conservée telle quelle. Certains y voient une manière symbolique de parler de l’Esprit Saint dans sa plénitude septuple.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: au milieu de… et au milieu de
  rationale: Conserve la répétition et la disposition spatiale complexe de la vision sans les simplifier.
- source_word: ζῴων
  choice: êtres vivants
  rationale: Désigne naturellement les êtres célestes entourant le trône et évite de les présenter comme de simples animaux.
- source_word: πρεσβυτέρων
  choice: anciens
  rationale: Dans cette scène céleste, le terme désigne un groupe reconnu et non simplement des hommes âgés.
- source_word: ἀρνίον
  choice: Agneau
  rationale: Préserve l'image sacrificielle et messianique. La majuscule signale qu'il s'agit d'un titre dans ce contexte, sans expliciter davantage son identité.
- source_word: ἑστηκὸς
  choice: debout
  rationale: Rend l'état résultant exprimé par le participe parfait et maintient le contraste saisissant avec l'immolation.
- source_word: ὡς ἐσφαγμένον
  choice: comme immolé
  rationale: « Comme » conserve la valeur comparative ou d'apparence de ὡς, tandis qu'« immolé » exprime la mise à mort violente et sa résonance sacrificielle.
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: Il avait sept cornes et sept yeux
  rationale: Une proposition verbale est plus naturelle en français qu'un participe juxtaposé, tout en conservant littéralement les éléments symboliques.
- source_word: οἵ εἰσιν
  choice: qui sont
  rationale: Relie naturellement la proposition aux « sept yeux », antécédent immédiat, sans ajouter d'interprétation.
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: les sept esprits de Dieu
  rationale: Reproduit la formulation grecque au lieu de la remplacer par une paraphrase doctrinale telle que « l'Esprit septuple ». La minuscule évite de trancher typographiquement une question que le texte laisse symboliquement ouverte.
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: envoyés sur toute la terre
  rationale: Rend le participe passif et la direction exprimée par εἰς dans un français idiomatique.
theological_decisions:
- issue: Référent de « qui sont les sept esprits de Dieu »
  choice: La proposition relative identifie les sept yeux aux sept esprits de Dieu.
  alternative: Comprendre plus largement que les cornes et les yeux ensemble sont désignés par cette expression.
  rationale: Les « sept yeux » constituent l'antécédent immédiat et le plus cohérent, notamment à la lumière de l'imagerie de Zacharie. La traduction conserve cependant la formulation du texte sans en développer l'interprétation.
- issue: Sens de « les sept esprits de Dieu »
  choice: Conserver littéralement l'expression au pluriel.
  alternative: « l'Esprit de Dieu dans sa plénitude septuple » ou « l'Esprit septuple de Dieu ».
  rationale: Le sens théologique de l'expression est débattu. La formulation grecque doit être préservée afin de ne pas réduire l'image à une seule explication doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétitive de la scène et son symbolisme apocalyptique sont conservés. « Immolé » maintient la résonance sacrificielle sans employer un archaïsme, tandis que la note précise la violence concrète du verbe grec.
