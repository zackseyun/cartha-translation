id: REV.19.18
reference: Revelation 19:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: fr
  text: afin que vous mangiez la chair des rois, la chair des chefs militaires, la chair des puissants, la chair des chevaux et de ceux qui les montent, et la chair de tous, libres et esclaves, petits et grands.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit le but ou le résultat de l’appel lancé par l’ange au verset précédent et conserve naturellement la valeur finale en français.
- source_word: φάγητε
  choice: vous mangiez
  rationale: Subjonctif aoriste actif, deuxième personne du pluriel, régi par ἵνα ; le subjonctif français après « afin que » en restitue naturellement la valeur.
- source_word: σάρκας
  choice: la chair
  rationale: Désigne littéralement la chair des corps dans cette scène de jugement. La répétition de « la chair » maintient l’insistance rhétorique du grec.
- source_word: βασιλέων
  choice: des rois
  rationale: Le terme désigne précisément des rois plutôt que des dirigeants au sens large.
- source_word: χιλιάρχων
  choice: des chefs militaires
  rationale: Désigne des officiers supérieurs, historiquement à la tête d’environ mille hommes ; cette expression claire conserve la dimension militaire sans translittération opaque.
- source_word: ἰσχυρῶν
  choice: des puissants
  rationale: Adjectif substantivé désignant ici des personnes fortes ou puissantes ; « puissants » convient au catalogue des détenteurs de force et de pouvoir.
- source_word: ἵππων
  choice: des chevaux
  rationale: Référence littérale aux chevaux dans l’imagerie de bataille.
- source_word: τῶν καθημένων ἐπ’ αὐτῶν
  choice: de ceux qui les montent
  rationale: Rend naturellement en français ceux qui sont assis sur les chevaux. La formulation conserve le référent tout en évitant une tournure pesante.
- source_word: πάντων
  choice: de tous
  rationale: Résume la totalité des catégories qui suivent et s’accorde avec la construction génitive dépendant de « chair ».
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: libres et esclaves
  rationale: La paire exprime les deux extrêmes du statut social ; « esclaves » rend explicitement la condition de dépendance opposée aux personnes libres.
- source_word: μικρῶν καὶ μεγάλων
  choice: petits et grands
  rationale: Conserve le mérisme traditionnel qui englobe tous les rangs et toutes les conditions.
- source_word: τε καὶ
  choice: et
  rationale: Dans l’énumération française, la corrélation grecque est rendue naturellement par « et » entre les deux catégories opposées.
theological_decisions:
- issue: Traduction de δοῦλος dans une opposition de statuts sociaux
  choice: esclaves
  alternative: serviteurs
  rationale: L’opposition explicite avec les personnes libres met en avant la condition juridique et sociale d’asservissement. « Esclaves » correspond donc mieux au grec sans atténuer la réalité évoquée.
translation_notes:
  register: Français international moderne, digne et direct. La répétition solennelle de « la chair » est conservée, tandis que « ceux qui les montent » donne une expression idiomatique de l’image des cavaliers.
