id: REV.19.12
reference: Revelation 19:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: fr
  text: Ses yeux étaient une flamme de feu, et sur sa tête se trouvaient de nombreux diadèmes. Il portait un nom écrit que personne ne connaît, sauf lui-même.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτοῦ
  choice: Ses yeux
  rationale: Le possessif français rend naturellement le groupe nominal grec. La particule δέ, simple élément de liaison dans cette description, n’exige pas d’équivalent explicite.
- source_word: φλὸξ πυρός
  choice: une flamme de feu
  rationale: Le grec présente une formulation nominale sans marque comparative explicite. Cette traduction en conserve la force métaphorique et les résonances apocalyptiques.
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: sur sa tête
  rationale: Rend directement et naturellement le sens spatial de ἐπί dans ce contexte.
- source_word: διαδήματα πολλά
  choice: de nombreux diadèmes
  rationale: διάδημα désigne précisément un diadème royal, contrairement au terme plus général « couronne »; « diadèmes » est compréhensible en français moderne et préserve cette nuance.
- source_word: ἔχων
  choice: Il portait
  rationale: Le participe présent poursuit la description du cavalier. Une proposition indépendante est plus naturelle en français; « portait » convient à un nom écrit attaché à sa personne sans préciser où il était inscrit.
- source_word: ὄνομα γεγραμμένον
  choice: un nom écrit
  rationale: Préserve le sens résultatif du participe parfait passif sans ajouter un emplacement que le grec ne donne pas.
- source_word: ὃ οὐδεὶς οἶδεν
  choice: que personne ne connaît
  rationale: οἶδεν, bien que de forme parfaite, a ici son sens présent usuel. Le relatif se rend naturellement par « que ».
- source_word: εἰ μὴ αὐτός
  choice: sauf lui-même
  rationale: Rend l’exception et l’emphase du pronom αὐτός de manière idiomatique, sans développer davantage sa portée.
theological_decisions:
- issue: Référence de la proposition exprimant la connaissance exclusive
  choice: Le nom écrit n’est connu que du cavalier lui-même.
  alternative: Comprendre surtout cette formule comme une affirmation générale du caractère insondable du nom.
  rationale: Le grec dit explicitement que personne ne connaît ce nom, sauf lui-même. La traduction maintient cette exclusivité et le mystère qui l’accompagne sans en tirer une explication doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque est répartie en deux phrases françaises pour éviter une coordination lourde tout en conservant la progression descriptive. « Diadèmes » maintient avec précision l’image de l’autorité royale.
