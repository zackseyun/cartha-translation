    rationale: En français, la construction pronominale rend déjà le réfléchi grec ἑαυτήν. L’ajout de « elle-même » crée une insistance absente de manière nécessaire du texte grec et alourdit la phrase.
  - severity: low
    issue: La note unique mélange deux questions et n’est pas ancrée sur « rendons-lui gloire »
    rationale: L’alternative « nous lui rendrons gloire » porte sur δώσομεν, non sur « épouse ». Des notes distinctes avec des ancres distinctes améliorent la traçabilité sans modifier le sens.
