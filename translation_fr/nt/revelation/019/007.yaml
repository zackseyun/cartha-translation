id: REV.19.7
reference: Revelation 19:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: fr
  text: Réjouissons-nous, exultons de joie et rendons-lui gloire[a], car les noces de l’Agneau sont arrivées, et son épouse[b] s’est préparée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nous lui rendrons gloire ». Le verbe grec est au futur, bien qu’il puisse avoir ici une valeur exhortative en parallèle avec « réjouissons-nous » et « exultons de joie ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « sa fiancée ». Le grec γυνή peut désigner une femme ou une épouse ; dans ce contexte nuptial, il peut se rapporter à la mariée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν
  choice: Réjouissons-nous
  rationale: Le subjonctif présent à la première personne du pluriel a ici une valeur exhortative, naturellement rendue par cette tournure.
- source_word: ἀγαλλιῶμεν
  choice: soyons transportés de joie
  rationale: Cette formulation conserve l’intensité de ἀγαλλιάω et distingue ce second verbe de χαίρωμεν sans recourir à un terme rare.
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: rendons-lui gloire
  rationale: Bien que δώσομεν soit morphologiquement un futur, le parallélisme avec les deux subjonctifs exhortatifs favorise ici une lecture exhortative. La note conserve l’autre possibilité.
- source_word: ἦλθεν
  choice: sont arrivées
  rationale: Le passé composé exprime une arrivée accomplie dont la portée demeure présente dans la proclamation visionnaire; l’accord pluriel suit le français « noces ».
- source_word: γάμος
  choice: les noces
  rationale: Dans ce contexte nuptial, « les noces » est naturel en français et désigne l’événement matrimonial sans ajouter explicitement l’idée de banquet.
- source_word: τοῦ ἀρνίου
  choice: de l’Agneau
  rationale: Traduction française consacrée du titre christologique johannique, avec majuscule signalant son emploi titulaire.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: son épouse
  rationale: γυνή peut désigner une femme, une épouse ou, en contexte nuptial, une fiancée. « Épouse » convient à l’arrivée des noces tout en maintenant le lien conjugal explicite.
- source_word: ἡτοίμασεν ἑαυτήν
  choice: s’est préparée elle-même
  rationale: La formulation préserve explicitement la valeur réfléchie et l’insistance de ἑαυτήν, tout en restant compréhensible en français actuel.
theological_decisions:
- issue: Désignation de γυνὴ αὐτοῦ dans l’imagerie nuptiale
  choice: son épouse
  alternative: sa fiancée
  rationale: « Épouse » est lexicalement direct et convient au moment où les noces arrivent; « fiancée » mettrait davantage l’accent sur la préparation précédant l’union, mais préciserait plus étroitement le statut que ne le fait le grec.
- issue: Valeur de δώσομεν dans la suite exhortative
  choice: rendons-lui gloire
  alternative: nous lui rendrons gloire
  rationale: La coordination avec χαίρωμεν et ἀγαλλιῶμεν invite à comprendre l’ensemble comme un appel collectif à la louange. Le futur indicatif demeure néanmoins grammaticalement possible et est signalé en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Noces » maintient la tonalité solennelle de la scène sans archaïsme marqué. La paire « réjouissons-nous / soyons transportés de joie » préserve la progression expressive des deux verbes grecs.
