review_pass:
  verdict: revise
  source_fidelity: 'Le sens de l’original est globalement bien rendu : les deux premiers verbes sont exhortatifs, δώσομεν est plausiblement compris dans la même valeur exhortative, γάμος est correctement rendu par « noces », et le titre « l’Agneau » est conservé. « Son épouse » est défendable pour γυνὴ αὐτοῦ dans cette image nuptiale, avec une alternative signalée. La forme réfléchie française « s’est préparée » rend suffisamment ἑαυτήν.'
  naturalness: '« S’est préparée elle-même » est lourd et non idiomatique en français moderne : le pronominal « s’est préparée » exprime déjà la réflexivité. « Exultons de joie » conserve l’intensité du δεύτερος verbe tout en étant plus direct et naturel que « soyons transportés de joie ».'
  terminology: « Noces », « Agneau », « gloire » et « épouse » conviennent au registre biblique moderne. La note doit distinguer clairement l’alternative liée à γυνή de celle qui concerne la valeur possible du futur δώσομεν, et la seconde doit être ancrée sur l’expression pertinente.
