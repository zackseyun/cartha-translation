reference: Revelation 19:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: fr
  text: 'Et une voix sortit du trône, disant : « Louez notre Dieu, tous ses esclaves, et ceux qui le craignent, les petits et les grands ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνὴ
  choice: une voix
  rationale: Le participe λέγουσα (« disant ») indique qu’il s’agit d’une voix articulant des paroles, et non d’un simple son.
- source_word: ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: sortit du trône
  rationale: Cette formulation naturelle conserve à la fois l’idée d’origine exprimée par ἀπό et celle de sortie portée par ἐξέρχομαι, sans préciser l’identité de celui qui parle.
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: Louez notre Dieu
  rationale: Le datif désigne l’objet de la louange ; en français, « louer Dieu » est la construction idiomatique directe.
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: vous tous qui êtes ses esclaves
  rationale: δοῦλοι exprime ici l’appartenance entière à Dieu. « Esclaves » en conserve la force, tandis que la tournure avec « vous » rend clairement l’adresse collective en français.
- source_word: οἱ φοβούμενοι αὐτόν
  choice: vous qui le craignez
  rationale: La traduction garde l’expression biblique de la crainte de Dieu, qui peut inclure respect, révérence et fidélité, sans la réduire à une seule nuance.
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: les petits comme les grands
  rationale: Cette expression française naturelle conserve l’inclusion de toutes les conditions, des personnes de moindre rang à celles de rang élevé.
theological_decisions:
- issue: Sens de δοῦλοι dans le contexte de l’adoration
  choice: esclaves
  alternative: serviteurs
  rationale: « Esclaves » maintient la notion forte d’appartenance et de soumission à Dieu présente dans δοῦλοι. La note signale « serviteurs », plus traditionnel et moins marqué en français.
- issue: Portée de la crainte de Dieu
  choice: vous qui le craignez
  alternative: vous qui le révérez
  rationale: Le texte principal conserve la tension de l’expression grecque et de l’idiome biblique ; « révérez » explicite une nuance réelle, mais plus étroite.
- issue: Relation entre les groupes nommés
  choice: vous tous qui êtes ses esclaves, vous qui le craignez, les petits comme les grands
  alternative: vous tous, ses esclaves et ceux qui le craignent, petits et grands
  rationale: La formulation suit la succession grecque et laisse ouverte la relation exacte entre « ses esclaves » et « ceux qui le craignent », sans imposer soit deux groupes entièrement distincts, soit une stricte identité.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe directe convient à une proclamation céleste, tandis que « les petits comme les grands » exprime clairement l’universalité sociale de l’appel.
