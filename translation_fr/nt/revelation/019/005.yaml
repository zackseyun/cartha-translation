  rationale: La révision remplace l’ajout temporel « Alors » par « Et » et reformule l’adresse afin de conserver la coordination grecque entre « tous ses esclaves » et « ceux qui le craignent ». Elle maintient le vocabulaire théologique choisi ainsi que l’imagerie de la voix sortant du trône.
