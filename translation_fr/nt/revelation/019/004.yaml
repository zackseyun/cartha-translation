id: REV.19.4
reference: Revelation 19:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: fr
  text: 'Et les vingt-quatre anciens et les quatre êtres vivants tombèrent à terre et adorèrent Dieu, celui qui siège sur le trône, en disant : « Amen ! Alléluia[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Louez le Seigneur ! » Acclamation liturgique hébraïque; littéralement : « Louez Yah ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: tombèrent à terre
  rationale: Dans ce contexte d’adoration, le verbe décrit une prosternation. « Tombèrent à terre » exprime naturellement le mouvement sans ajouter explicitement une posture absente du verbe lui-même.
- source_word: πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: les vingt-quatre anciens
  rationale: « Anciens » est le terme biblique français courant et accessible pour les figures ainsi désignées dans l’Apocalypse.
- source_word: τὰ τέσσαρα ζῷα
  choice: les quatre êtres vivants
  rationale: Cette expression distingue ces figures célestes de simples animaux et correspond bien à leur rôle autour du trône.
- source_word: προσεκύνησαν
  choice: adorèrent
  rationale: Dieu étant l’objet de l’action, le contexte indique l’adoration plutôt qu’un simple hommage.
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: celui qui siège sur le trône
  rationale: Formulation française naturelle et digne qui conserve l’identification participiale de Dieu ainsi que l’image royale du texte.
- source_word: λέγοντες
  choice: Ils disaient
  rationale: Une nouvelle proposition évite la lourdeur de « en disant » après deux verbes coordonnés, tout en gardant le lien entre l’adoration et l’acclamation.
- source_word: Ἀμήν
  choice: Amen
  rationale: L’acclamation liturgique est consacrée en français sous cette forme translittérée.
- source_word: Ἁλληλουϊά
  choice: Alléluia
  rationale: « Alléluia » est la forme liturgique traditionnelle et immédiatement reconnaissable en français; sa signification est donnée en note.
theological_decisions:
- issue: Rendu de Ἁλληλουϊά, acclamation hébraïque transmise par le grec
  choice: Alléluia
  alternative: Louez le Seigneur ! / Louez Yah !
  rationale: La translittération préserve le caractère d’acclamation liturgique du terme et son usage naturel en français. La note explicite son sens sans imposer dans le corps du texte une résolution du nom divin sous-jacent.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique écrit; « celui qui siège » conserve la solennité de la scène sans archaïsme marqué. Le marqueur [a] figure dans le texte immédiatement après le terme annoté.
