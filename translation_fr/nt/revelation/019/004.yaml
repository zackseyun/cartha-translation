    issue: « Alors » traduit l'ouverture καί.
    rationale: Καί est ici la simple coordination narrative « et ». « Alors » ajoute une inférence temporelle qui n'est pas explicitée par le grec.
  - severity: low
    issue: « Ils disaient » rend λέγοντες.
    rationale: Le participe présent λέγοντες est lié à l'action d'adorer; « en disant » en préserve plus directement la valeur participiale. L'imparfait « disaient » peut créer une nuance progressive non marquée dans le texte source.
