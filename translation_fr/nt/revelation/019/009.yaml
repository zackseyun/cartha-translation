id: REV.19.9
reference: Revelation 19:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: fr
  text: 'Il me dit : « Écris : Heureux ceux qui sont invités[a] au repas des noces[b] de l’Agneau ! » Puis il me dit : « Ce sont là les vraies paroles de Dieu[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « appelés ». Dans le contexte d’un repas, le verbe grec signifie naturellement « invités ».
    reason: lexical_alternative
  - marker: b
    text: Ou « festin des noces » ; le mot grec désigne le repas principal, souvent pris le soir.
    reason: lexical_alternative
  - marker: c
    text: Ou « paroles dignes de foi » ; l’expression affirme qu’elles sont vraies et fiables.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ λέγει μοι
  choice: Puis il me dit
  rationale: Le présent historique λέγει est rendu naturellement en français narratif par « il me dit ». « Puis » exprime ici l’enchaînement marqué par καί sans alourdir la phrase.
- source_word: Γράψον
  choice: Écris
  rationale: L’impératif aoriste singulier est direct et n’exige aucun complément ajouté.
- source_word: Μακάριοι
  choice: Heureux
  rationale: « Heureux » est la formulation française consacrée et naturelle des béatitudes ; elle désigne une condition favorable accordée par Dieu, non une simple émotion passagère.
- source_word: οἱ ... κεκλημένοι
  choice: ceux qui sont invités
  rationale: Le participe parfait passif décrit ceux qui se trouvent dans l’état d’avoir été appelés. Dans le contexte d’un repas de noces, « invités » en transmet clairement le sens idiomatique, tandis que « appelés » demeure possible et est signalé en note.
- source_word: δεῖπνον τοῦ γάμου
  choice: repas des noces
  rationale: δεῖπνον désigne le repas principal et γάμος, dans ce contexte festif, les noces. « Repas des noces » reste proche de la structure grecque et sonne naturellement en français actuel.
- source_word: τοῦ ἀρνίου
  choice: de l’Agneau
  rationale: La majuscule signale le titre christologique récurrent de l’Apocalypse, tout en conservant l’image sacrificielle et messianique du grec.
- source_word: Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν
  choice: Ce sont là les vraies paroles de Dieu
  rationale: Cette tournure française conserve l’accent démonstratif de Οὗτοι, rend ἀληθινοί directement par « vraies » et maintient le génitif τοῦ θεοῦ sans le préciser davantage par « venant de Dieu ».
theological_decisions:
- issue: Portée de κεκλημένοι dans le cadre du festin eschatologique
  choice: invités
  alternative: appelés
  rationale: Dans le cadre d’un repas, καλέω a naturellement le sens d’inviter. Ce choix évite d’imposer ici une conception doctrinale particulière de l’appel au salut, tandis que la note conserve la traduction plus formelle « appelés ».
- issue: Sens de ἀληθινοί appliqué aux paroles de Dieu
  choice: vraies
  alternative: dignes de foi
  rationale: « Vraies » est le rendu le plus direct et préserve la dimension de vérité. « Dignes de foi » explicite la fiabilité impliquée, sans être imposé dans le texte principal.
- issue: Relation exprimée par τοῦ θεοῦ
  choice: de Dieu
  alternative: venant de Dieu
  rationale: Le génitif grec peut suggérer l’origine divine, mais « de Dieu » conserve sa formulation ouverte sans réduire la relation à la seule provenance.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « Puis il me dit » conserve la structure insistante du grec. « Agneau » garde la majuscule traditionnelle propre au titre christologique, sans ajout interprétatif.
