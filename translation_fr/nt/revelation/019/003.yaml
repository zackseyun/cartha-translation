source:
  edition: SBLGNT
  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: fr
  text: 'Et ils dirent une deuxième fois : « Alléluia ! » Et sa fumée monte pour toujours et à jamais[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour les siècles des siècles », expression grecque qui désigne ici une durée sans fin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: une deuxième fois
  rationale: Cet accusatif employé comme adverbe exprime la répétition tout en conservant l’idée d’une succession comptée.
- source_word: εἴρηκαν
  choice: ils dirent
  rationale: Le parfait de λέγω est rendu par un passé narratif naturel en français écrit, sans ajouter l’intensité qu’impliquerait « ils s’écrièrent ».
- source_word: Ἁλληλουϊά
  choice: Alléluia
  rationale: Cette acclamation liturgique d’origine hébraïque est conservée sous sa forme française traditionnelle et immédiatement reconnaissable.
- source_word: ὁ καπνὸς αὐτῆς
  choice: sa fumée
  rationale: Le pronom féminin renvoie à Babylone, représentée comme une femme et comme une ville. « Sa fumée » maintient cette référence sans l’alourdir.
- source_word: ἀναβαίνει
  choice: monte
  rationale: Le présent grec donne à la scène une force continue et saisissante. « Monte » restitue simplement l’image.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  rationale: Cette tournure idiomatique grecque exprime ici une durée sans fin. La formulation française est claire et naturelle, tandis que la forme littérale est signalée en note.
theological_decisions:
- issue: Durée exprimée par εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: pour toujours et à jamais
  alternative: pour les siècles des siècles
  rationale: Dans ce contexte de jugement définitif, l’expression grecque communique le caractère interminable de la durée. La traduction ne l’atténue pas, tout en donnant en note la formulation littérale traditionnelle.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif de l’Apocalypse; « Alléluia » conserve la formule cultuelle traditionnelle. La note est placée après l’expression de durée à laquelle elle se rapporte.
