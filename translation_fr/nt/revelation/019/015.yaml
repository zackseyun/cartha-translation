id: REV.19.15
reference: Revelation 19:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: fr
  text: De sa bouche sort une épée aiguisée, afin qu’avec elle il frappe les nations ; et lui-même les fera paître avec un bâton de fer[a], et lui-même foule le pressoir du vin de la fureur de la colère de Dieu, le Tout-Puissant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « il les gouvernera avec un bâton de fer ». Le verbe grec signifie littéralement « faire paître » et conserve ici l’image pastorale, tout en évoquant l’autorité royale du Psaume 2.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: sort
  rationale: Le présent « sort » restitue naturellement en français l’image vive de quelque chose qui jaillit de sa bouche.
- source_word: ῥομφαία ὀξεῖα
  choice: une épée aiguisée
  rationale: « Épée » reste précis sans surdéterminer le type d’arme; « aiguisée » exprime ici clairement ὀξεῖα.
- source_word: ἵνα ἐν αὐτῇ πατάξῃ
  choice: afin qu’avec elle il frappe
  rationale: « Afin que » marque la finalité, « avec elle » la valeur instrumentale de ἐν, et « frappe » évite d’ajouter l’idée non explicite d’abattre.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: Le terme désigne collectivement les nations et ne doit pas être limité aux non-Juifs.
- source_word: ποιμανεῖ
  choice: les conduira comme un berger
  rationale: Cette formulation française naturelle conserve explicitement la métaphore pastorale du verbe, tout en laissant entendre sa portée royale dans ce contexte.
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: avec un sceptre de fer
  rationale: Dans l’allusion royale au Psaume 2, « sceptre » rend la portée d’autorité de ῥάβδος; « de fer » conserve la force de l’image.
- source_word: πατεῖ
  choice: foule
  rationale: Le présent maintient la vivacité de la scène et « fouler le pressoir » appartient naturellement au vocabulaire français de cette image.
- source_word: τὴν ληνὸν τοῦ οἴνου
  choice: le pressoir d’où coule le vin
  rationale: Cette explicitation minimale rend intelligible en français le lien génitif inhabituel entre le pressoir et le vin, sans modifier l’image.
- source_word: τοῦ θυμοῦ τῆς ὀργῆς
  choice: de la fureur de la colère
  rationale: Les deux termes proches sont maintenus afin de préserver l’intensité cumulative du grec.
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: de Dieu, le Tout-Puissant
  rationale: La tournure préserve la valeur de titre divin de παντοκράτωρ et reste idiomatique en français.
theological_decisions:
- issue: La valeur de ποιμανεῖ dans l’allusion au Psaume 2 et dans un contexte de jugement
  choice: les conduira comme un berger
  alternative: les gouvernera
  rationale: Le grec emploie le verbe « faire paître/être berger ». La traduction conserve la tension entre soin pastoral, autorité royale et jugement, au lieu de réduire le sens au seul gouvernement.
- issue: Le redoublement θυμοῦ τῆς ὀργῆς
  choice: la fureur de la colère
  alternative: l’ardente colère
  rationale: Conserver deux substantifs reflète l’intensification rhétorique du texte et évite de fondre deux mots grecs en une seule notion.
- issue: La portée royale et coercitive de ῥάβδος σιδηρᾶ
  choice: un sceptre de fer
  alternative: un bâton de fer
  rationale: « Sceptre » rend la dimension royale de l’allusion au Psaume 2, tandis que « de fer » maintient son caractère inflexible et judiciaire.
translation_notes:
  register: Français international moderne, digne et imagé. La syntaxe est légèrement segmentée pour rester claire à l’oral comme à l’écrit, tout en conservant les présents de vision, la répétition emphatique de « lui-même » et l’intensité des génitifs grecs.
