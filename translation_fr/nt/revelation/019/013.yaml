  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: fr
  text: Il est vêtu d’un vêtement trempé de sang[a], et le nom qu’il porte est « la Parole de Dieu ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « taché de sang ». Le verbe grec signifie plus littéralement « trempé » ou « teint ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: Il est vêtu de
  rationale: Le participe parfait décrit l’état présent du personnage. « Il est vêtu de » restitue naturellement en français cette valeur résultative.
- source_word: ἱμάτιον
  choice: manteau
  rationale: ἱμάτιον désigne un vêtement extérieur. « Manteau » convient au contexte du cavalier sans préciser indûment la forme du vêtement.
- source_word: βεβαμμένον αἵματι
  choice: trempé dans le sang
  rationale: Le participe de βάπτω évoque fondamentalement l’action de plonger ou de teindre. « Trempé dans le sang » conserve la force de l’image; « taché de sang » reste une possibilité de sens signalée en note.
- source_word: κέκληται τὸ ὄνομα αὐτοῦ
  choice: le nom qu’il porte est
  rationale: Le parfait passif de καλέω présente un nom attribué qui demeure celui du personnage. Cette tournure française est naturelle et conserve le sens de dénomination, sans le calque lourd « son nom est appelé ».
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: la Parole de Dieu
  rationale: λόγος fonctionne ici comme un titre personnel. La majuscule à « Parole » marque cet emploi titulaire et préserve l’écho christologique du contexte johannique.
theological_decisions:
- issue: Le titre christologique λόγος
  choice: la Parole de Dieu
  alternative: le message de Dieu
  rationale: Dans cette vision, l’expression désigne personnellement le cavalier plutôt qu’un simple message. « La Parole de Dieu » préserve la portée du titre sans développer son interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation garde le relief solennel de la vision tout en évitant le calque syntaxique du grec.
