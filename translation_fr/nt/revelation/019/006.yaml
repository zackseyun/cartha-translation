id: REV.19.6
reference: Revelation 19:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: fr
  text: 'Puis j’entendis comme la voix d’une foule immense, comme la voix de grandes eaux et comme celle de puissants coups de tonnerre. Elles disaient : « Alléluia ! Car le Seigneur Dieu, le Tout-Puissant[a], règne[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « le Seigneur notre Dieu, le Tout-Puissant »; le texte grec imprimé ici se lit plus littéralement « le Seigneur, le Dieu, le Tout-Puissant ».
    reason: textual_variant
  - marker: b
    text: Ou « a régné », « s’est mis à régner » ou « est devenu roi »; le verbe grec peut célébrer la manifestation décisive du règne de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: j’entendis
  rationale: L’aoriste narratif de ἀκούω désigne ici une perception auditive ponctuelle dans la succession de la vision.
- source_word: ὡς φωνὴν
  choice: comme la voix
  rationale: ὡς introduit une comparaison et préserve le caractère analogique de l’expérience visionnaire, tandis que φωνή peut désigner une voix ou un bruit; la proclamation qui suit favorise « voix ».
- source_word: ὄχλου πολλοῦ
  choice: d’une foule immense
  rationale: Cette expression désigne un très grand rassemblement; « foule immense » est naturel, clair et digne en français contemporain.
- source_word: ὑδάτων πολλῶν
  choice: de grandes eaux
  rationale: La formulation conserve l’image biblique traditionnelle d’eaux nombreuses et puissantes sans préciser indûment qu’elles seraient tumultueuses.
- source_word: βροντῶν ἰσχυρῶν
  choice: de puissants coups de tonnerre
  rationale: « Coups de tonnerre » est l’expression française naturelle, et « puissants » rend la force exprimée par ἰσχυρῶν.
- source_word: λεγόντων
  choice: Elle disait
  rationale: Le participe introduit le contenu de la proclamation. Le grec emploie un pluriel lié aux réalités sonores précédentes; le français reprend naturellement le nom collectif singulier « voix » sans chercher à identifier davantage les locuteurs.
- source_word: Ἁλληλουϊά
  choice: Alléluia
  rationale: La translittération liturgique établie en français conserve la forme reçue dans le Nouveau Testament.
- source_word: ὅτι
  choice: Car
  rationale: La conjonction introduit le motif de l’acclamation; « car » convient au registre doxologique.
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: le Seigneur Dieu, le Tout-Puissant
  rationale: Cette formulation française naturelle conserve les trois désignations divines du texte imprimé sans ajouter le possessif « notre » absent de celui-ci.
- source_word: ἐβασίλευσεν
  choice: règne
  rationale: Dans cette acclamation, le présent français exprime naturellement la royauté divine célébrée comme manifeste; une note conserve les autres valeurs possibles de l’aoriste grec.
theological_decisions:
- issue: Valeur de l’aoriste ἐβασίλευσεν et manifestation du règne de Dieu
  choice: règne
  alternative: a régné ; s’est mis à régner ; est devenu roi
  rationale: Le présent français rend l’acclamation de façon naturelle sans affirmer que la souveraineté divine commencerait seulement à cet instant. La note préserve toutefois la possibilité que l’aoriste souligne la manifestation décisive de ce règne.
- issue: Présence ou absence du possessif dans le titre divin
  choice: le Seigneur Dieu, le Tout-Puissant
  alternative: 'le Seigneur notre Dieu, le Tout-Puissant ; plus littéralement : le Seigneur, le Dieu, le Tout-Puissant'
  rationale: Le texte principal suit le SBLGNT fourni, qui ne contient pas ἡμῶν (« notre »), tout en signalant la variante manuscrite significative.
translation_notes:
  register: Français international moderne, clair et solennel. La répétition de « comme » maintient le rythme comparatif de la vision; « comme celle de » évite une lourdeur sans effacer le parallélisme. Les termes liturgiques « Alléluia » et « le Tout-Puissant » conservent la dignité et les résonances bibliques du passage.
