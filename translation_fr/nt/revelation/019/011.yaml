id: REV.19.11
reference: Revelation 19:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: fr
  text: 'Et je vis le ciel ouvert, et voici : un cheval blanc. Celui qui était assis sur lui est appelé Fidèle et Véritable, et c’est avec justice qu’il juge et fait la guerre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: ouvert
  rationale: Le participe parfait passif présente le ciel dans l’état résultant de son ouverture ; « ouvert » rend naturellement cette valeur en français.
- source_word: ἰδοὺ
  choice: et voici
  rationale: Cette formule conserve la vivacité visionnaire et la fonction de mise en relief de l’expression grecque.
- source_word: ἵππος λευκός
  choice: un cheval blanc
  rationale: Traduction directe et idiomatique du groupe nominal.
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: celui qui le montait
  rationale: En contexte équestre, cette formulation française est naturelle tout en restant proche de l’idée de celui qui est assis sur le cheval.
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: est appelé Fidèle et Véritable
  rationale: καλούμενος introduit une désignation ; les majuscules signalent ici la fonction de titres sans ajouter d’identification explicite.
- source_word: ἐν δικαιοσύνῃ
  choice: avec justice
  rationale: Dans le contexte du jugement et de la guerre, δικαιοσύνη désigne la rectitude juste qui caractérise son action. « Avec justice » est idiomatique et préserve la portée morale et judiciaire du terme.
- source_word: κρίνει
  choice: il juge
  rationale: Rend directement le présent actif sans explicitation supplémentaire.
- source_word: πολεμεῖ
  choice: fait la guerre
  rationale: Expression française courante qui conserve pleinement la force militaire du verbe πολεμέω.
theological_decisions:
- issue: Présentation des désignations πιστός et ἀληθινός
  choice: Les rendre comme les titres « Fidèle et Véritable »
  alternative: 'Les rendre comme de simples adjectifs en minuscules : « fidèle et véritable »'
  rationale: Dans le contexte immédiat de l’Apocalypse, ces mots fonctionnent comme des désignations du cavalier. Les majuscules marquent cet emploi titulaire sans résoudre davantage son identité.
- issue: Sens de δικαιοσύνη
  choice: avec justice
  alternative: dans la justice ; avec droiture
  rationale: Le contexte associe le terme au jugement et à la guerre, ce qui met en avant la justice tout en incluant la rectitude morale. La formulation retenue ne suggère pas une violence arbitraire.
translation_notes:
  register: Français international moderne, digne et lisible. La ponctuation segmente la longue coordination grecque afin d’en préserver la vivacité sans produire une phrase pesante. Aucun marqueur de note n’est requis puisqu’aucune note n’est fournie.
