review_pass:
  verdict: revise
  source_fidelity: La traduction rend bien l’ouverture du ciel, le cheval blanc, les titres et l’action de juger et de faire la guerre « avec justice ». Toutefois, « celui qui le montait » transforme le participe grec « celui qui est assis sur lui » en une désignation plus interprétative du cavalier et emploie un imparfait qui n’est pas nécessaire. Une formulation plus proche conserve l’image et l’aspect de la scène visionnaire.
  naturalness: Le français est moderne, clair et d’un registre approprié. « Celui qui était assis sur lui » demeure naturel dans ce contexte solennel et est plus fidèle que « celui qui le montait ».
  terminology: « Fidèle et Véritable » rend de façon satisfaisante les désignations πιστός et ἀληθινός, avec une capitalisation titulaire justifiée par le contexte. « Avec justice » est une option idiomatique défendable pour ἐν δικαιοσύνῃ; aucune note n’est indispensable puisque le français exprime déjà naturellement la nuance de justice/rectitude dans ce contexte.
  issues:
  - severity: medium
    issue: « Celui qui le montait » pour ὁ καθήμενος ἐπ’ αὐτὸν
    rationale: Le grec dit littéralement « celui qui était assis sur lui », et non explicitement « celui qui le montait ». « Monter » est possible par implication équestre, mais ajoute une manière de caractériser l’action et l’imparfait « montait » suggère une action en cours plutôt que la position exprimée par le participe καθήμενος.
  revised_text: 'Et je vis le ciel ouvert, et voici : un cheval blanc. Celui qui était assis sur lui est appelé Fidèle et Véritable, et c’est avec justice qu’il juge et fait la guerre.'
