id: REV.19.17
reference: Revelation 19:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: fr
  text: 'Puis je vis un ange qui se tenait dans le soleil. Il cria d’une voix forte à tous les oiseaux qui volaient au milieu du ciel[a] : « Venez, rassemblez-vous pour le grand repas de Dieu, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au plus haut du ciel » ou « en plein ciel ». Le terme grec μεσουράνημα est une expression apocalyptique caractéristique employée dans l’Apocalypse.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: un ange
  rationale: En français, « un ange » peut rendre naturellement le numéral grec employé comme indéfini, sans lui imposer l’insistance de « un seul ange », absente du contexte.
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: qui se tenait dans le soleil
  rationale: Cette formulation conserve l’image apocalyptique saisissante et le sens direct de ἐν, sans l’atténuer par « devant le soleil ».
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: cria d’une voix forte
  rationale: Rend avec naturel la force de κράζω et l’expression φωνῇ μεγάλῃ, sans registre excessivement familier.
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: à tous les oiseaux
  rationale: ὄρνεον désigne l’oiseau en général ; l’idée de charognards découle du contexte suivant et ne doit pas être introduite ici.
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: qui volaient au milieu du ciel
  rationale: « Au milieu du ciel » exprime clairement le μεσουράνημα apocalyptique en français moderne et préserve sa dimension céleste mieux que « dans les airs ».
- source_word: Δεῦτε
  choice: Venez
  rationale: Impératif direct au pluriel, adapté à l’appel lancé à tous les oiseaux.
- source_word: συνάχθητε
  choice: rassemblez-vous
  rationale: Rend idiomatiquement l’impératif grec à valeur passive ou moyenne, tout en conservant l’idée de rassemblement collectif.
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: pour le grand repas de Dieu
  rationale: « Repas » est naturel et digne en français contemporain ; l’ordre « le grand repas de Dieu » maintient la structure et le caractère solennel de l’expression grecque.
theological_decisions:
- issue: Rendu de l’image spatiale apocalyptique
  choice: qui se tenait dans le soleil
  alternative: qui se tenait devant le soleil
  rationale: Le grec présente une image volontairement saisissante. La traduction la conserve au lieu de résoudre la difficulté en adoptant une localisation plus vraisemblable.
translation_notes:
  register: Français international moderne, clair et solennel. La syntaxe reste fluide tout en conservant l’imagerie apocalyptique, la généralité du mot « oiseaux » et la force de l’appel.
