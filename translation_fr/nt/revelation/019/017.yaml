  source_fidelity: 'Le texte rend fidèlement les éléments grecs essentiels : l’ange est « dans le soleil », l’appel est lancé à tous les oiseaux volant « au milieu du ciel », et les impératifs Δεῦτε / συνάχθητε sont bien conservés. « Un ange » est un rendu français naturel de ἕνα ἄγγελον sans surcharger le numéral d’une emphase absente du contexte immédiat.'
