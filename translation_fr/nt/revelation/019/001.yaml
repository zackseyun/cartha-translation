id: REV.19.1
reference: Revelation 19:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: fr
  text: 'Après cela, j’entendis comme une voix forte, celle d’une foule immense dans le ciel, qui s’écriait : « Alléluia[a] ! Le salut, la gloire et la puissance appartiennent à notre Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Louez Yah » ou « Louez le SEIGNEUR »; l’expression hébraïque signifie littéralement « Louez Yah », « Yah » étant une forme abrégée du nom divin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Expression temporelle courante qui marque la progression de la vision. Le singulier collectif « cela » reprend naturellement en français les événements précédents sans effacer la valeur séquentielle du grec.
- source_word: ἤκουσα
  choice: j’entendis
  rationale: L’aoriste narratif est rendu par le passé simple, registre naturel et digne pour un récit visionnaire écrit.
- source_word: ὡς
  choice: comme
  rationale: Préserve directement la comparaison ou l’approximation perceptive du grec sans décider s’il s’agit strictement ou non de la voix de la foule.
- source_word: φωνὴν μεγάλην
  choice: la voix puissante
  rationale: μέγας qualifie ici l’intensité et l’ampleur sonore. « Puissante » convient à une voix collective et solennelle, sans la maladresse de « grande voix ».
- source_word: ὄχλου πολλοῦ
  choice: d’une foule immense
  rationale: ὄχλος désigne une foule et πολύς en souligne la très grande taille. Cette formulation est naturelle en français tout en conservant l’ampleur de la scène.
- source_word: ἐν τῷ οὐρανῷ
  choice: dans le ciel
  rationale: Le contexte désigne le domaine céleste; « dans le ciel » est l’expression française idiomatique.
- source_word: λεγόντων
  choice: qui disait
  rationale: Le participe au génitif s’accorde avec la foule. En français, le singulier collectif « qui disait » rend naturellement la foule parlant d’une seule voix.
- source_word: Ἁλληλουϊά
  choice: Alléluia
  rationale: Forme liturgique traditionnellement translittérée et immédiatement reconnaissable en français; la note en donne le sens hébreu.
- source_word: ἡ σωτηρία
  choice: Le salut
  rationale: « Salut » rend la délivrance salvatrice exprimée par σωτηρία. L’article convient naturellement à l’énumération française.
- source_word: ἡ δόξα
  choice: la gloire
  rationale: Équivalent établi de δόξα dans une acclamation adressée à Dieu.
- source_word: ἡ δύναμις
  choice: la puissance
  rationale: « Puissance » rend la force souveraine attribuée à Dieu et convient au registre doxologique.
- source_word: τοῦ θεοῦ ἡμῶν
  choice: appartiennent à notre Dieu
  rationale: Explicite naturellement en français la relation génitive de possession ou d’attribution entre les trois noms et Dieu.
theological_decisions:
- issue: Rendu de l’acclamation céleste Ἁλληλουϊά
  choice: Alléluia
  alternative: Louez Yah / Louez le Seigneur
  rationale: La translittération conserve le caractère liturgique et l’écho hébraïque de l’expression sans développer le nom divin dans le corps du texte. La note en préserve le sens lexical.
- issue: Portée de ὡς devant « voix »
  choice: comme la voix puissante
  alternative: ce qui semblait être la voix puissante
  rationale: « Comme » maintient l’ambiguïté du marqueur comparatif grec et évite d’imposer une incertitude ontologique plus forte que celle qu’exige le texte.
translation_notes:
  register: Français international moderne, solennel mais accessible. Le passé simple soutient le registre narratif de l’Apocalypse. La structure de l’acclamation et son rythme ternaire sont conservés.
