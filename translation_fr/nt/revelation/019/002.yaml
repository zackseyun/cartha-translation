id: REV.19.2
reference: Revelation 19:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: fr
  text: 'car ses jugements sont vrais et justes : il a jugé la grande prostituée, qui corrompait la terre par sa prostitution, et il lui a demandé compte du sang de ses esclaves[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec désigne des personnes qui appartiennent à un maître; selon le contexte, il peut se traduire par « esclaves » ou « serviteurs ».
    reason: Préserver l’étendue sémantique de δοῦλοι et signaler l’autre traduction française courante.
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: vrais et justes
  rationale: Cette expression naturelle en français conserve à la fois la conformité à la vérité et la rectitude judiciaire des jugements de Dieu.
- source_word: κρίσεις
  choice: jugements
  rationale: « Jugements » préserve le sens judiciaire et eschatologique du pluriel grec.
- source_word: ἔκρινεν
  choice: il a jugé
  rationale: Le passé composé rend naturellement en français l’acte accompli célébré dans ce chant, sans expliciter davantage que le verbe grec.
- source_word: πόρνην τὴν μεγάλην
  choice: la grande prostituée
  rationale: « Prostituée » est le terme moderne précis, sans l’archaïsme de « courtisane » ni une vulgarité inutile.
- source_word: ἔφθειρεν
  choice: corrompait
  rationale: Dans ce contexte, le verbe décrit la corruption exercée par son inconduite; l’imparfait français présente cette activité antérieure et durable sans exclure la nuance de ruine portée par φθείρω.
- source_word: γῆν
  choice: la terre
  rationale: La portée cosmique de l’Apocalypse favorise « terre » plutôt que « pays ».
- source_word: πορνείᾳ
  choice: prostitution
  rationale: La reprise lexicale de « prostituée » conserve le réseau métaphorique du grec et peut évoquer tant la conduite sexuelle que l’infidélité idolâtre dans le symbolisme du livre.
- source_word: ἐξεδίκησεν τὸ αἷμα
  choice: il a demandé compte du sang
  rationale: Cette tournure biblique française exprime l’exercice de la justice punitive pour le sang versé, tout en évitant que « venger le sang » soit compris comme une vengeance passionnelle.
- source_word: τῶν δούλων αὐτοῦ
  choice: de ses esclaves
  rationale: « Esclaves » conserve la force de δοῦλοι et l’idée d’appartenance entière à un maître; « serviteurs » est signalé en note comme équivalent contextuellement possible.
- source_word: ἐκ χειρὸς αὐτῆς
  choice: il lui a demandé compte
  rationale: L’agent féminin exprimé par l’idiome « de sa main » est rendu idiomatiquement par le pronom « lui »; la formulation française indique qu’elle est tenue responsable du sang versé.
theological_decisions:
- issue: Sens métaphorique de πορνεία
  choice: prostitution
  alternative: inconduite sexuelle; immoralité sexuelle
  rationale: « Prostitution » maintient le lien explicite avec la « prostituée » et laisse ouverte la portée à la fois sexuelle, politique et idolâtre de l’image apocalyptique.
- issue: Désignation des croyants par δοῦλοι
  choice: esclaves
  alternative: serviteurs
  rationale: Le terme principal conserve la relation forte d’appartenance présente dans δοῦλος, tandis que la note reconnaît que « serviteurs » convient mieux à certains contextes et registres français.
- issue: Expression de la justice divine en ἐξεδίκησεν
  choice: a demandé compte du sang
  alternative: a vengé le sang
  rationale: La formulation choisie présente l’acte comme une justice exercée contre la coupable, sans atténuer la sanction ni attribuer à Dieu une vengeance arbitraire.
translation_notes:
  register: Français international actuel, solennel mais accessible. Le deux-points articule la déclaration générale sur les jugements de Dieu et son application à la grande prostituée. La répétition grecque de ὅτι est rendue sans répéter « car », ce qui allège la syntaxe française sans perdre le rapport causal.
