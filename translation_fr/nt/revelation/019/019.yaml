source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: fr
  text: Puis je vis la bête, les rois de la terre et leurs armées, rassemblés pour faire la guerre à celui qui est assis sur le cheval et à son armée.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « faire la guerre avec celui qui est assis sur le cheval et avec son armée » ; dans ce contexte, « avec » a un sens hostile.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: la bête
  rationale: Dans l’Apocalypse, ce terme chargé appartient au langage symbolique et apocalyptique; « la bête » en conserve naturellement la force menaçante.
- source_word: βασιλεῖς τῆς γῆς
  choice: les rois de la terre
  rationale: Bien que γῆ puisse désigner un pays ou une terre, la portée universelle de la scène favorise ici « la terre ».
- source_word: στρατεύματα αὐτῶν
  choice: leurs armées
  rationale: Le pluriel désigne les forces militaires des rois; « armées » est clair et naturel dans ce contexte de guerre.
- source_word: συνηγμένα
  choice: rassemblés
  rationale: Le participe parfait passif décrit les rois et leurs armées dans l’état résultant de leur rassemblement. L’accord masculin pluriel convient au groupe coordonné en français.
- source_word: ποιῆσαι τὸν πόλεμον
  choice: pour faire la guerre
  rationale: Cette locution française idiomatique rend étroitement l’expression grecque et exprime leur objectif hostile.
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: à celui qui était assis sur le cheval
  rationale: Après « faire la guerre », le français emploie naturellement « à » pour désigner l’adversaire. La tournure descriptive préserve le participe grec sans remplacer le personnage par un titre explicite.
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: à son armée
  rationale: Le second complément reste sous la portée de « faire la guerre à ». Le singulier collectif du grec est conservé par « armée ».
theological_decisions:
- issue: Identité de celui qui est assis sur le cheval
  choice: Conserver la désignation descriptive « celui qui était assis sur le cheval ».
  alternative: Expliciter « le Christ » ou « le Messie ».
  rationale: Le contexte littéraire permet d’identifier le personnage, mais ce verset emploie une expression descriptive. La conserver évite d’introduire dans le texte un titre absent du grec.
- issue: Valeur de μετά dans le contexte guerrier
  choice: Rendre l’hostilité par la construction française « faire la guerre à ».
  alternative: Traduire formellement μετά par « avec ».
  rationale: Même si μετά avec le génitif signifie ordinairement « avec », l’idiome ποιεῖν πόλεμον μετά désigne ici clairement ceux contre qui la guerre est menée. Le français « faire la guerre à » exprime ce rapport sans ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. « Puis je vis » assure une narration naturelle tout en rendant καὶ εἶδον. La phrase conserve la longue coordination et la solennité de la scène sans archaïsmes.
