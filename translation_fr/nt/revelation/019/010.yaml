revisions:
- from: 'Alors je tombai devant ses pieds pour me prosterner devant lui. Mais il me dit : « Garde-toi de le faire ! Je suis ton compagnon d’esclavage et celui de tes frères et sœurs[a] qui gardent le témoignage de Jésus[b]. Prosterne-toi devant Dieu ! Car le témoignage de Jésus[b] est l’esprit de la prophétie. »'
  to: 'Alors je tombai devant ses pieds pour me prosterner devant lui. Mais il me dit : « Ne fais surtout pas cela ! Je suis esclave, comme toi et comme tes frères[a] qui ont le témoignage de Jésus[b]. Prosterne-toi devant Dieu ! Car le témoignage de Jésus[b] est l’esprit de la prophétie. »'
  rationale: La révision remplace une tournure française maladroite par une expression naturelle de la condition servile partagée, restitue ἔχοντες par « qui ont », et conserve sans résolution l’ambiguïté du génitif Ἰησοῦ. Elle maintient aussi la portée potentiellement inclusive de ἀδελφοί dans une note plutôt que de l’expliciter dans le corps du texte.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:48:14Z'
review_pass:
  verdict: revise
  source_fidelity: La structure et les termes majeurs sont globalement bien rendus, notamment l’ambiguïté de « témoignage de Jésus » et « l’esprit de la prophétie ». Toutefois, « qui gardent le témoignage » interprète ἔχοντες (« qui ont ») avec une nuance de conservation absente du verbe grec. La construction « ton compagnon d’esclavage et celui de tes frères et sœurs » est également lourde et ambiguë en français.
  naturalness: Le registre est digne, mais « compagnon d’esclavage » employé avec « celui de » produit une formulation peu naturelle. « Je suis esclave, comme toi et comme tes frères » exprime clairement la condition commune et reste naturel dans un français biblique moderne. « Ne fais surtout pas cela ! » rend l’interdiction abrupte de manière plus actuelle que « Garde-toi de le faire ! ».
  terminology: « Esclave » préserve la force de σύνδουλος sans recourir à une périphrase maladroite. « Frères » conserve le masculin pluriel du grec; la note indique sans imposer que le terme peut englober l’ensemble des croyants. « Témoignage de Jésus » maintient correctement l’ambiguïté du génitif dans les deux occurrences.
  issues:
  - severity: medium
    issue: « qui gardent le témoignage » pour τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
    rationale: ἔχοντες signifie d’abord « ayant ». « Garder » peut suggérer l’observance ou la conservation et ajoute une nuance non explicitée par le grec.
  - severity: medium
    issue: Construction de « compagnon d’esclavage »
    rationale: '« Je suis ton compagnon d’esclavage et celui de tes frères et sœurs » est syntaxiquement pesant et rend moins clairement la coordination grecque: l’ange partage la même condition avec Jean et ses frères.'
  - severity: low
    issue: « frères et sœurs » dans le texte principal
    rationale: Cette explicitation inclusive est possible dans le contexte, mais le grec dit littéralement « frères ». Conserver ce terme dans le texte, avec une note sur sa portée représentative possible, respecte plus directement la formulation source.
