id: REV.19.10
reference: Revelation 19:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: fr
  text: 'Alors je tombai devant ses pieds pour me prosterner devant lui. Mais il me dit : « Ne fais surtout pas cela ! Je suis esclave, comme toi et comme tes frères[a] qui ont le témoignage de Jésus[b]. Prosterne-toi devant Dieu ! Car le témoignage de Jésus[b] est l’esprit de la prophétie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « tes frères ». Selon le contexte, ce terme peut désigner l’ensemble des croyants, hommes et femmes.
    reason: lexical_alternative
  - marker: b
    text: L’expression « le témoignage de Jésus » peut signifier « le témoignage au sujet de Jésus » ou « le témoignage rendu par Jésus ». La même ambiguïté vaut dans les deux occurrences.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: je tombai devant ses pieds
  rationale: Cette formulation conserve la posture physique et la valeur de ἔμπροσθεν (« devant »), tout en restant intelligible en français.
- source_word: προσκυνῆσαι αὐτῷ / τῷ θεῷ προσκύνησον
  choice: pour me prosterner devant lui / Prosterne-toi devant Dieu
  rationale: « Se prosterner devant » exprime à la fois le geste et, dans ce contexte, l’hommage religieux refusé par l’ange puis réservé à Dieu.
- source_word: Ὅρα μή
  choice: Garde-toi de le faire !
  rationale: Rend naturellement en français l’interdiction brusque et énergique de la formule grecque.
- source_word: σύνδουλός
  choice: compagnon d’esclavage
  rationale: Le terme souligne que l’ange partage avec Jean une même condition de dépendance et de soumission à Dieu, plutôt qu’un simple rôle de service.
- source_word: ἀδελφῶν σου
  choice: tes frères et sœurs
  rationale: Dans ce contexte collectif, le masculin pluriel grec désigne vraisemblablement les croyants des deux sexes. Une note signale la formulation plus littérale « tes frères ».
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: qui gardent le témoignage de Jésus
  rationale: « Garder » restitue ici ἔχω comme possession et attachement durable sans transformer l’expression en « témoigner de ». Le génitif reste volontairement non résolu.
- source_word: μαρτυρία Ἰησοῦ
  choice: le témoignage de Jésus
  rationale: La formulation française conserve l’ambiguïté du génitif grec, qui peut désigner soit le témoignage au sujet de Jésus, soit le témoignage donné par Jésus.
- source_word: πνεῦμα τῆς προφητείας
  choice: l’esprit de la prophétie
  rationale: Cette traduction formelle préserve la portée théologique possible de πνεῦμα et évite de réduire arbitrairement le terme à « essence » ou « principe ».
theological_decisions:
- issue: Sens du génitif dans « le témoignage de Jésus »
  choice: Conserver « le témoignage de Jésus » dans les deux occurrences
  alternative: « le témoignage au sujet de Jésus » ou « le témoignage rendu par Jésus »
  rationale: Le génitif Ἰησοῦ est réellement ambigu. La traduction principale maintient donc ouvertes la lecture objective et la lecture subjective, tandis qu’une note les explicite.
- issue: Traduction de σύνδουλος
  choice: compagnon d’esclavage
  alternative: compagnon de service
  rationale: L’ange insiste sur sa subordination commune avec Jean et les autres croyants afin de refuser l’adoration. Le vocabulaire de l’esclavage rend cette dépendance plus précisément que celui d’un simple service.
- issue: Portée de ἀδελφοί
  choice: frères et sœurs
  alternative: frères
  rationale: Le contexte vise vraisemblablement l’ensemble des croyants. La formulation inclusive rend cette portée en français actuel, tandis que la note conserve la forme littérale du masculin grec.
translation_notes:
  register: Français international moderne, digne et accessible. Le récit est rendu au passé simple pour le ton littéraire de l’Apocalypse. La formulation conserve les répétitions et les ambiguïtés théologiques du grec sans introduire de lecture confessionnelle.
