  source_fidelity: 'La traduction rend correctement les éléments principaux : « armées », la localisation céleste sans identification doctrinale, l’imparfait progressif « le suivaient », les chevaux blancs et le fin lin. Toutefois, « qui étaient dans le ciel » ajoute une nuance de passé à la localisation que le grec ne porte pas : le groupe substantivé τὰ ἐν τῷ οὐρανῷ est plus exactement rendu par « qui sont dans le ciel » dans le cadre de la vision.'
