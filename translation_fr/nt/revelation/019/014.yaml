id: REV.19.14
reference: Revelation 19:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: fr
  text: Et les armées qui sont dans le ciel le suivaient sur des chevaux blancs[a], vêtues de fin lin blanc et pur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les armées du ciel ». Le grec dit littéralement : « les armées, celles qui sont dans le ciel ».'
    reason: Alternative lexicale reflétant la possibilité d’une formulation d’appartenance en français, tout en signalant la structure locative du grec.
lexical_decisions:
- source_word: στρατεύματα
  choice: armées
  rationale: Le pluriel désigne des forces militaires organisées. « Armées » est direct, naturel et adapté au contexte guerrier de la vision.
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: qui étaient dans le ciel
  rationale: Cette relative rend explicitement la valeur locative de l’expression grecque et évite de transformer la localisation en appartenance.
- source_word: ἠκολούθει αὐτῷ
  choice: le suivaient
  rationale: L’imparfait français conserve l’aspect duratif de l’imparfait grec et convient à la progression de la scène visionnaire.
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: sur des chevaux blancs
  rationale: Formulation française courante pour des cavaliers montés, tout en conservant la couleur symbolique.
- source_word: ἐνδεδυμένοι
  choice: vêtues
  rationale: « Vêtues » maintient un registre digne et naturel. L’accord au féminin reprend « armées » en français sans préciser l’identité de leurs membres.
- source_word: βύσσινον
  choice: un fin lin
  rationale: Le terme désigne une étoffe de lin raffinée et précieuse; « fin lin » est une expression claire et bien établie dans ce contexte.
- source_word: λευκὸν καθαρόν
  choice: blanc et pur
  rationale: Les deux adjectifs sont conservés distinctement. « Pur » rend ici καθαρόν avec naturel et préserve sa portée possible, à la fois visuelle et morale, sans l’expliciter.
theological_decisions:
- issue: Identité des armées célestes
  choice: Décrire simplement « les armées qui étaient dans le ciel » sans préciser leur identité.
  alternative: « Les armées du ciel », ou une identification explicite comme anges ou saints glorifiés.
  rationale: Le verset indique leur localisation et leur apparence, mais ne dit pas explicitement s’il s’agit d’anges, de saints ou des deux. La formulation retenue préserve cette réserve du texte.
- issue: Sens de καθαρόν
  choice: « pur »
  alternative: « propre »
  rationale: Dans cette image apocalyptique, « pur » reste naturel pour une étoffe et conserve la tension entre propreté visible et pureté symbolique, sans imposer une seule lecture.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit étroitement le grec sans devenir lourde; l’imparfait maintient le mouvement continu de la vision. Aucun terme ne tranche l’identité des armées.
