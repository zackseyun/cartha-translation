id: REV.19.8
reference: Revelation 19:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: fr
  text: Il lui a été donné de se vêtir d’un fin lin éclatant et pur, car le fin lin, ce sont les actes justes[a] des saints.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les actions conformes à la justice ». Le mot grec peut aussi désigner, dans d’autres contextes, de justes exigences ou prescriptions ; ici, il désigne le plus naturellement les actes justes des saints.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: Il lui a été donné
  rationale: Cette tournure conserve le passif et laisse, comme le grec, l’auteur du don implicite.
- source_word: ἵνα περιβάληται
  choice: de se vêtir
  rationale: L’infinitif exprime naturellement la visée de la proposition introduite par ἵνα, tandis que la forme pronominale rend la valeur moyenne du verbe.
- source_word: βύσσινον
  choice: fin lin
  rationale: « Fin lin » rend la qualité précieuse de cette étoffe et convient aux deux occurrences du terme.
- source_word: λαμπρὸν καθαρόν
  choice: éclatant et pur
  rationale: « Éclatant » conserve l’image visuelle de λαμπρός. Pour une étoffe symbolique, « pur » exprime naturellement καθαρός sans effacer son sens de propreté.
- source_word: τὸ γὰρ βύσσινον
  choice: car le fin lin
  rationale: « Car » introduit l’explication donnée par γάρ, et la répétition de « fin lin » suit celle du grec.
- source_word: τὰ δικαιώματα
  choice: les actes justes
  rationale: Dans ce contexte symbolique et au pluriel, le terme désigne le plus naturellement les actes conformes à la justice, tout en gardant une note sur son éventail sémantique.
- source_word: τῶν ἁγίων
  choice: des saints
  rationale: « Les saints » est en français biblique une désignation concise et bien établie du peuple consacré à Dieu.
- source_word: ἐστίν
  choice: représente
  rationale: Dans l’explication d’un symbole, « représente » transmet naturellement la relation exprimée par « est » sans suggérer une identité matérielle entre l’étoffe et les actes.
theological_decisions:
- issue: Rapport entre le don du vêtement et les actes justes des saints
  choice: Le texte maintient ensemble le vêtement accordé à l’épouse et sa signification comme actes justes des saints.
  alternative: Interpréter le vêtement uniquement comme un statut de justice accordé aux saints, ou uniquement comme leurs mérites propres.
  rationale: Le passif « il lui a été donné » souligne le don sans nommer celui qui donne, tandis que la proposition explicative associe explicitement le fin lin aux δικαιώματα des saints. La traduction préserve cette tension.
- issue: Sens de δικαιώματα
  choice: Les actes justes des saints
  alternative: Les exigences justes qui concernent les saints, ou leur justification.
  rationale: Le pluriel et le contexte où le fin lin caractérise l’épouse favorisent le sens d’actes conformes à la justice, sans exclure par paraphrase la portée plus large du terme.
- issue: Auteur implicite du don
  choice: Ne pas identifier explicitement celui qui donne.
  alternative: 'Écrire : « Dieu lui a donné ».'
  rationale: Même si un passif divin est probable, le texte grec ne nomme pas l’agent.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « Il lui a été donné » conserve la retenue du passif grec ; « se vêtir » est courant sans être familier. « Saints » maintient le vocabulaire biblique traditionnel dans son sens collectif.
