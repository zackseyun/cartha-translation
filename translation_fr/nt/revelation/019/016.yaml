id: REV.19.16
reference: Revelation 19:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: fr
  text: 'Il a, sur son vêtement et sur sa cuisse, un nom écrit : « Roi des rois et Seigneur des seigneurs ».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un nom inscrit ». Le grec dit littéralement : « un nom écrit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: Il porte
  rationale: Le présent conserve la vivacité de la vision. En français, « porter un nom sur » exprime naturellement qu’un nom figure sur le vêtement et la cuisse, sans modifier les deux emplacements donnés par le grec.
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: sur son vêtement
  rationale: ἱμάτιον désigne un vêtement ou un manteau. « Vêtement » reste précis sans imposer le type exact d’habit; le possessif est rendu naturellement d’après le contexte.
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: sur sa cuisse
  rationale: μηρός signifie directement « cuisse ». La localisation est conservée sans chercher à expliquer la disposition de l’inscription.
- source_word: ὄνομα γεγραμμένον
  choice: un nom écrit
  rationale: Cette formulation garde la valeur résultative du participe parfait passif et évite la précision supplémentaire qu’introduirait « gravé » ou « inscrit ».
- source_word: Βασιλεὺς βασιλέων
  choice: Roi des rois
  rationale: La construction génitive superlative et la force du titre royal sont conservées dans la formulation française traditionnelle et transparente.
- source_word: κύριος κυρίων
  choice: Seigneur des seigneurs
  rationale: « Seigneur » rend κύριος dans ce titre élevé et préserve le parallélisme exact avec « Roi des rois ».
theological_decisions:
- issue: Rendu du double titre royal
  choice: « Roi des rois et Seigneur des seigneurs »
  alternative: « Roi suprême et Seigneur suprême »
  rationale: Le rendu littéral préserve la forme solennelle, le parallélisme et la portée christologique du titre sans l’aplatir en paraphrase.
- issue: Rapport spatial entre le vêtement et la cuisse
  choice: 'Conserver les deux localisations : « sur son vêtement et sur sa cuisse »'
  alternative: « sur son vêtement, à hauteur de la cuisse »
  rationale: Le grec présente deux groupes distincts introduits par ἐπί. La traduction ne tranche pas si le nom se trouve en deux endroits ou sur la partie du vêtement couvrant la cuisse.
translation_notes:
  register: Français international moderne, clair et digne. Les majuscules marquent les deux éléments du nom-titre. La formulation conserve l’étrangeté de l’image apocalyptique sans l’expliquer dans le corps du texte.
