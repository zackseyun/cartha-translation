source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: fr
  text: Les autres[a] furent tués par l’épée de celui qui était assis sur le cheval, l’épée qui sortait de sa bouche[b], et tous les oiseaux se rassasièrent de leur chair.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « furent mis à mort ».
    reason: lexical_alternative
  - marker: b
    text: L’épée qui sort de sa bouche appartient au langage imagé de l’Apocalypse ; voir Apocalypse 19.15.
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: les autres
  rationale: Désigne naturellement ceux qui restent après le sort de la bête et du faux prophète dans le contexte précédent.
- source_word: ἀπεκτάνθησαν
  choice: furent tués
  rationale: Préserve le passif de l’aoriste tout en employant un français moderne et sobre.
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: par l’épée
  rationale: Exprime ici le moyen ou l’instrument et conserve l’image concrète récurrente dans l’Apocalypse.
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: de celui qui était assis sur le cheval
  rationale: Rend de façon transparente le participe substantivé et maintient le lien avec le cavalier déjà présenté.
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: celle qui sortait de sa bouche
  rationale: Le pronom reprend clairement « l’épée » et conserve sans l’expliquer l’image apocalyptique; l’imparfait décrit naturellement cette caractéristique dans le récit.
- source_word: πάντα τὰ ὄρνεα
  choice: tous les oiseaux
  rationale: Le grec dit simplement « oiseaux »; le contexte implique des oiseaux charognards sans qu’il faille l’ajouter au texte.
- source_word: ἐχορτάσθησαν
  choice: se rassasièrent
  rationale: Exprime le fait de manger jusqu’à satiété plus naturellement en français que le calque passif « furent remplis ».
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: de leur chair
  rationale: Après « se rassasier », la préposition « de » rend idiomatiquement la source ou la matière exprimée par ἐκ, tandis que « chair » garde le sens physique littéral.
theological_decisions:
- issue: Nature de l’épée sortant de la bouche du cavalier
  choice: Conserver l’image concrète de l’épée qui sort de sa bouche sans en imposer l’interprétation dans le texte.
  alternative: Identifier explicitement l’épée à sa parole ou à son jugement.
  rationale: Le grec présente une image apocalyptique et symbolique; la traduction doit préserver cette image et sa tension interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique écrit. « Se rassasièrent de leur chair » privilégie un français naturel tout en préservant l’image crue et la relation de source exprimée par le grec.
