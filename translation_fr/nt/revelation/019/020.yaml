id: REV.19.20
reference: Revelation 19:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: fr
  text: Et la bête fut capturée, et avec elle le faux prophète, qui avait accompli devant elle les signes par lesquels il avait égaré ceux qui avaient reçu la marque de la bête et ceux qui se prosternaient devant son image. Tous deux furent jetés vivants dans l’étang de feu qui brûle avec du soufre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιάσθη
  choice: fut capturée
  rationale: L’aoriste passif de πιάζω désigne ici l’arrestation ou la capture; « fut capturée » est naturel et conserve le passif.
- source_word: τὸ θηρίον
  choice: la bête
  rationale: Terme apocalyptique consacré dans l’Apocalypse, qui préserve directement l’image grecque.
- source_word: μετ’ αὐτοῦ
  choice: avec elle
  rationale: Le pronom renvoie à θηρίον, nom grammaticalement neutre en grec mais féminin en français; l’accord français exige donc « elle » sans trancher la nature personnelle de la figure.
- source_word: ὁ ψευδοπροφήτης
  choice: le faux prophète
  rationale: Traduction directe et courante du nom composé grec.
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: qui avait accompli ... les signes
  rationale: Le participe aoriste exprime une action antérieure à la capture; « signes » conserve la valeur signifiante de σημεῖα mieux que « miracles ».
- source_word: ἐνώπιον αὐτοῦ
  choice: devant elle
  rationale: Rend naturellement l’idée d’agir en présence de la bête, avec l’accord français du référent.
- source_word: ἐν οἷς ἐπλάνησεν
  choice: par lesquels il avait égaré
  rationale: ἐν οἷς a ici une valeur instrumentale; « égaré » conserve la nuance de conduire dans l’erreur portée par πλανάω.
- source_word: τοὺς λαβόντας τὸ χάραγμα
  choice: ceux qui avaient reçu la marque
  rationale: Le plus-que-parfait marque l’antériorité du fait de recevoir; « marque » est le terme établi et exact pour χάραγμα dans l’Apocalypse.
- source_word: τοὺς προσκυνοῦντας
  choice: ceux qui se prosternaient devant
  rationale: La formule exprime l’hommage cultuel tout en conservant l’image corporelle de προσκυνέω; elle convient naturellement avec « l’image ».
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: Tous deux furent jetés vivants
  rationale: Cette formulation française naturelle maintient l’accent grec sur le fait que les deux personnages sont jetés vivants.
- source_word: τὴν λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: l’étang de feu qui brûle avec du soufre
  rationale: Préserve concrètement l’image apocalyptique et rend θείον par le terme moderne « soufre ».
theological_decisions:
- issue: Référence pronominale à la bête
  choice: Employer « elle/son » selon le genre grammatical français de « bête »
  alternative: Employer des tournures masculines qui personnaliseraient explicitement la bête
  rationale: Le grec emploie des pronoms renvoyant à un nom neutre. Le féminin français découle simplement de la grammaire de « bête » et ne doit pas servir à déterminer la nature ontologique ou personnelle de la figure.
- issue: Portée de προσκυνέω
  choice: « se prosternaient devant »
  alternative: « adoraient »
  rationale: Dans ce contexte cultuel, « adoraient » serait possible, mais « se prosternaient devant » préserve à la fois le geste et l’hommage sans résoudre plus étroitement la portée du verbe.
- issue: Image du jugement final
  choice: Conserver littéralement « l’étang de feu qui brûle avec du soufre »
  alternative: Paraphraser par une formulation doctrinale comme « l’enfer » ou « le tourment éternel »
  rationale: Le verset présente une image apocalyptique concrète; la traduction ne doit pas y substituer une systématisation doctrinale absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du grec tout en évitant un calque pesant. Aucun archaïsme comme « étang ardent de soufre » ou « faux-prophète » n’est nécessaire.
