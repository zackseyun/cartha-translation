reference: Revelation 21:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: fr
  text: Celui qui vainc héritera de ces choses[a], et je serai son Dieu, et il sera mon fils[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui remporte la victoire ». Le verbe grec traduit par « vainc » revient souvent dans l’Apocalypse pour désigner le fait de tenir bon fidèlement et de l’emporter.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « il sera mon fils ». Le masculin a vraisemblablement ici une portée représentative, mais la traduction conserve le langage filial du texte source.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: Celui qui vaincra
  rationale: Le participe présent substantivé désigne la personne caractérisée par la victoire. Le futur français s’accorde naturellement avec la promesse qui suit, tandis que « vaincre » conserve le motif récurrent de νικάω dans l’Apocalypse.
- source_word: κληρονομήσει
  choice: héritera
  rationale: Ce verbe rend directement l’idée de recevoir en héritage et préserve les résonances familiales et d’alliance renforcées par la relation père-fils qui suit.
- source_word: ταῦτα
  choice: de ces choses
  rationale: Le démonstratif pluriel est conservé plutôt que ramené au singulier collectif « tout cela », afin de refléter la formulation grecque sans rendre le français obscur.
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: Je serai son Dieu
  rationale: Cette formulation française naturelle restitue la force relationnelle du datif αὐτῷ et l’écho de la formule d’alliance.
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: lui sera mon fils
  rationale: La tournure conserve l’insistance portée par αὐτός et exprime naturellement en français la relation filiale, sans imposer l’indéfini « un fils ».
- source_word: υἱός
  choice: fils
  rationale: « Fils » préserve le terme masculin explicite ainsi que l’imagerie filiale et successorale du texte; la portée vraisemblablement représentative est précisée en note plutôt que neutralisée dans le texte.
theological_decisions:
- issue: Langage filial masculin dans une promesse formulée de manière représentative
  choice: Conserver « fils » dans le texte principal
  alternative: enfant
  rationale: Le grec emploie explicitement υἱός au masculin singulier. « Enfant » atténuerait le lien entre filiation et héritage; la portée générique probable peut être signalée en note.
- issue: Écho de la formule d’alliance
  choice: « Je serai son Dieu, et lui sera mon fils »
  alternative: « Je serai Dieu pour lui, et il sera pour moi un fils »
  rationale: Le choix retenu est idiomatique en français tout en maintenant la relation d’alliance et sa formulation filiale, sans ajouter d’explication doctrinale au verset.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle; « lui » marque l’insistance de αὐτός. Les notes expliquent l’alternative lexicale et la portée du masculin sans résoudre silencieusement l’ambiguïté.
