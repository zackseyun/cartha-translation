id: REV.21.21
reference: Revelation 21:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: fr
  text: Les douze portes étaient douze perles ; chacune des portes était faite d’une seule perle. Et la grande rue[a] de la ville était d’or pur, comme du verre transparent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la rue de la ville » ou « la place de la ville » pour πλατεῖα.
    reason: 'Alternative lexicale : le grec peut désigner une rue large, une voie publique ou une place.'
lexical_decisions:
- source_word: πυλῶνες
  choice: portes
  rationale: Dans la description architecturale de la nouvelle Jérusalem, le terme désigne les portes ou entrées monumentales de la ville ; « portes » est naturel et précis en français.
- source_word: μαργαρῖται / μαργαρίτου
  choice: perles / perle
  rationale: 'Le terme désigne sans ambiguïté des perles. L’alternance pluriel-singulier est conservée : douze perles, puis une seule perle pour chaque porte.'
- source_word: ἀνὰ εἷς ἕκαστος
  choice: chacune
  rationale: Cette formulation restitue naturellement la valeur distributive renforcée de l’expression grecque, qui insiste sur chaque porte prise individuellement.
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: était faite d’une seule perle
  rationale: ἐξ indique ici la matière ou la provenance. « Faite d’une seule perle » exprime clairement l’image et conserve l’insistance portée par ἑνός.
- source_word: πλατεῖα
  choice: grande rue
  rationale: Le nom peut désigner une rue large ou un espace public ouvert. « Grande rue » garde la dimension urbaine et l’idée de largeur sans imposer la notion plus précise de place.
- source_word: χρυσίον καθαρὸν
  choice: or pur
  rationale: Équivalent français direct, courant et naturel pour désigner de l’or sans mélange.
- source_word: ὡς ὕαλος διαυγής
  choice: comme du verre transparent
  rationale: Cette formulation préserve l’image saisissante d’un or ayant la transparence du verre ; διαυγής exprime la clarté ou la transparence.
theological_decisions:
- issue: Nature de l’espace urbain désigné par πλατεῖα
  choice: grande rue de la ville
  alternative: rue de la ville ; place de la ville
  rationale: Le terme grec permet plusieurs représentations de l’espace public. « Grande rue » préserve son sens courant de voie large tout en évitant de déterminer excessivement l’aménagement de la ville visionnaire.
translation_notes:
  register: Français moderne, international et digne. La syntaxe conserve le parallélisme descriptif du grec, tandis que « chacune des portes » et « faite d’une seule perle » restent immédiatement compréhensibles. Le point-virgule marque la relation étroite entre les douze perles et la composition de chaque porte.
