id: REV.21.16
reference: Revelation 21:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: fr
  text: 'La ville forme un carré : sa longueur est égale à sa largeur. Il mesura la ville avec le roseau à mesurer[a] : douze mille stades[b]. Sa longueur, sa largeur et sa hauteur sont égales[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « avec le roseau »; il sert ici d’instrument de mesure.'
    reason: lexical_alternative
  - marker: b
    text: Le stade était une unité de distance antique. Douze mille stades correspondent approximativement à 2 220 kilomètres, selon la valeur retenue pour le stade.
    reason: cultural_note
  - marker: c
    text: 'Ou, de manière plus interprétative : « la ville forme un cube parfait ». Le grec dit directement que sa longueur, sa largeur et sa hauteur sont égales.'
    reason: alternative_reading
lexical_decisions:
- source_word: τετράγωνος κεῖται
  choice: forme un carré
  rationale: Cette formulation française naturelle rend à la fois la disposition de la ville (κεῖται) et sa forme carrée (τετράγωνος), sans recourir à un tour archaïque.
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: sa longueur est égale à sa largeur
  rationale: ὅσον exprime ici l’égalité d’étendue; la formulation choisie est précise et idiomatique en français moderne.
- source_word: ἐμέτρησεν
  choice: il mesura
  rationale: L’aoriste rapporte simplement l’action; le sujet masculin, identifiable dans le contexte immédiat, reste implicite comme en grec.
- source_word: τῷ καλάμῳ
  choice: avec le roseau à mesurer
  rationale: κάλαμος désigne littéralement un roseau, employé ici comme instrument de mesure. La traduction conserve l’image concrète tout en indiquant sa fonction.
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: douze mille stades
  rationale: La préposition est naturellement intégrée à l’expression française du résultat de la mesure. L’unité antique est conservée dans le texte.
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: Sa longueur, sa largeur et sa hauteur sont égales
  rationale: La traduction reproduit directement l’égalité explicite des trois dimensions, sans la remplacer par une conclusion géométrique.
theological_decisions:
- issue: Conservation ou conversion de l’unité antique
  choice: Conserver « douze mille stades » dans le texte principal
  alternative: Donner directement une distance d’environ 2 220 kilomètres
  rationale: Le grec emploie l’unité antique; sa conversion dépend de la valeur exacte attribuée au stade. L’équivalent moderne convient donc mieux à une note.
- issue: Description explicite ou interprétation géométrique de la ville
  choice: Dire que la longueur, la largeur et la hauteur sont égales
  alternative: Dire que la ville est un cube parfait
  rationale: La forme cubique découle naturellement des dimensions données, mais le grec énonce leur égalité sans employer le terme « cube ». Le texte principal préserve cette distinction.
translation_notes:
  register: Français international moderne, clair et digne. « Forme un carré » évite l’archaïsme tout en conservant l’image architecturale; « roseau à mesurer » maintient le référent antique et en explicite sobrement la fonction.
