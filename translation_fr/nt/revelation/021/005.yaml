id: REV.21.5
reference: Revelation 21:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: fr
  text: 'Et celui qui siège sur le trône dit : « Voici que je fais toutes choses nouvelles[a]. » Puis il dit : « Écris, car ces paroles sont dignes de confiance[b] et vraies. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « je rends tout nouveau ». Le grec affirme une nouveauté globale sans préciser à lui seul s’il s’agit d’une transformation ou d’un remplacement.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « fidèles ». Ici, le terme grec qualifie des paroles sur lesquelles on peut compter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: celui qui siège sur le trône
  rationale: « Siège » rend naturellement le participe présent et conserve l’image solennelle de l’intronisation, sans préciser davantage l’identité du locuteur.
- source_word: Ἰδοὺ
  choice: Voici que
  rationale: Cette tournure française actuelle conserve la fonction solennelle d’appel à l’attention sans adopter le ton plus abrupt de « Regarde ».
- source_word: καινὰ ποιῶ πάντα
  choice: je fais toutes choses nouvelles
  rationale: La formulation suit l’ordre prédicatif du grec, garde la portée globale de πάντα et évite de décider si l’œuvre annoncée consiste en une transformation ou un remplacement.
- source_word: Γράψον
  choice: Écris
  rationale: L’impératif direct est conservé sans ajouter de complément absent du grec.
- source_word: ὅτι
  choice: car
  rationale: Dans ce contexte, ὅτι donne la raison de l’ordre d’écrire. « Car » exprime clairement ce lien dans un registre digne et naturel.
- source_word: οὗτοι οἱ λόγοι
  choice: ces paroles
  rationale: « Paroles » convient à des déclarations révélées et demeure plus naturel en français biblique moderne que « mots » ou « propos ».
- source_word: πιστοὶ
  choice: dignes de confiance
  rationale: Cette expression indique clairement que les paroles sont fiables; « fidèles » serait possible, mais moins immédiatement idiomatique pour qualifier des paroles en français courant.
- source_word: ἀληθινοί
  choice: vraies
  rationale: « Vraies » rend directement l’affirmation de vérité et conserve la coordination avec πιστοί.
theological_decisions:
- issue: Portée et nature du renouvellement eschatologique dans καινὰ ποιῶ πάντα
  choice: je fais toutes choses nouvelles
  alternative: je rends tout nouveau
  rationale: Le choix retenu conserve la portée universelle et l’aspect présent de la déclaration, sans trancher entre renouvellement transformateur et création de réalités nouvelles.
- issue: Présentation du locuteur divin
  choice: celui qui siège sur le trône
  alternative: celui qui est assis sur le trône
  rationale: La traduction maintient l’image d’autorité royale donnée par le texte, sans ajouter d’identification doctrinale explicite.
- issue: Valeur de πιστοί appliqué aux paroles
  choice: dignes de confiance
  alternative: fidèles
  rationale: Le sens porte ici sur la fiabilité des paroles. L’alternative « fidèles » reste possible et est signalée, sans transformer cette nuance lexicale en affirmation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. « Voici que » et « celui qui siège » gardent la solennité apocalyptique sans archaïsme marqué. La légère répétition de « dit » reflète le texte grec, qui passe de l’aoriste εἶπεν au présent λέγει.
