revisions:
- from: Et je vis la ville sainte, la Jérusalem nouvelle, qui descendait du ciel, d’auprès de Dieu, préparée comme une mariée parée pour son époux.
  to: Et je vis la ville sainte, la Jérusalem nouvelle, qui descendait du ciel, de la part de Dieu, préparée comme une mariée parée pour son époux.
  rationale: La seule correction remplace « d’auprès de Dieu » par « de la part de Dieu », afin d’éviter une nuance de proximité non explicitement formulée par le grec tout en gardant distinctes les deux indications de provenance, « du ciel » et « de la part de Dieu ».
