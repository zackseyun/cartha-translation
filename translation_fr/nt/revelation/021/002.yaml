review_pass:
  verdict: revise
  source_fidelity: 'La structure et les images du grec sont bien rendues : « ville sainte », « Jérusalem nouvelle », la descente du ciel, l’état de préparation et la comparaison nuptiale sont tous conservés. Toutefois, « d’auprès de Dieu » tend à préciser une proximité ou une provenance depuis la présence de Dieu que ἀπό n’explicite pas. « De la part de Dieu » rend naturellement la provenance divine tout en distinguant ce complément de « du ciel ».'
  naturalness: Le français est fluide, moderne et d’un registre approprié à la vision apocalyptique. Le passé simple « je vis » convient. « Une mariée parée pour son époux » est naturel et conserve l’imagerie nuptiale.
  terminology: « Ville sainte », « Jérusalem nouvelle », « préparée », « mariée », « parée » et « époux » sont des choix justes et cohérents. La minuscule à « nouvelle » maintient la valeur descriptive de l’adjectif sans trancher la question stylistique d’un titre fixe.
  issues:
  - severity: low
    issue: « d’auprès de Dieu » est plus spécifique que ἀπὸ τοῦ θεοῦ.
    rationale: Cette expression peut suggérer que la ville vient de la proximité ou de la présence immédiate de Dieu. Le grec indique simplement la source ou la provenance. « De la part de Dieu » préserve cette relation sans ajout.
  revised_text: Et je vis la ville sainte, la Jérusalem nouvelle, qui descendait du ciel, de la part de Dieu, préparée comme une mariée parée pour son époux.
