id: REV.21.2
reference: Revelation 21:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: fr
  text: Et je vis la ville sainte, la Jérusalem nouvelle, qui descendait du ciel, de la part de Dieu, préparée comme une mariée parée pour son époux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν
  choice: ville
  rationale: « Ville » rend directement πόλις et conserve l’image civique concrète de la vision.
- source_word: ἁγίαν
  choice: sainte
  rationale: « Sainte » est la formulation biblique naturelle pour ἅγιος et préserve sa portée théologique.
- source_word: Ἰερουσαλὴμ καινὴν
  choice: la Jérusalem nouvelle
  rationale: Cette construction française naturelle maintient Jérusalem comme nom propre et rend καινήν comme un adjectif descriptif, sans en faire nécessairement un titre figé.
- source_word: εἶδον
  choice: je vis
  rationale: Le passé simple convient au registre narratif digne de l’Apocalypse et rend sans ajout l’aoriste de ὁράω.
- source_word: καταβαίνουσαν
  choice: qui descendait
  rationale: « Descendait » exprime directement le mouvement vers le bas tout en s’intégrant naturellement à la proposition relative française.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: Avec « descendre », « du ciel » exprime naturellement en français la provenance et le mouvement hors de celui-ci.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: d’auprès de Dieu
  rationale: Cette tournure distingue la provenance divine de la provenance céleste déjà exprimée, sans ajouter explicitement « présence » au texte.
- source_word: ἡτοιμασμένην
  choice: préparée
  rationale: 'Le participe parfait passif décrit la ville dans un état résultant : elle se trouve préparée.'
- source_word: ὡς
  choice: comme
  rationale: « Comme » introduit clairement la comparaison en français.
- source_word: νύμφην
  choice: une mariée
  rationale: Dans ce contexte nuptial, « mariée » désigne naturellement la femme parée en vue de son époux et conserve la valeur comparative sans imposer un titre technique.
- source_word: κεκοσμημένην
  choice: parée
  rationale: « Parée » restitue l’idée d’ornement nuptial de κοσμέω dans un français actuel et digne.
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: pour son époux
  rationale: Dans l’image d’une mariée, ἀνήρ désigne son mari; « époux » convient au registre nuptial sans substituer le terme spécifique « fiancé » ou « jeune marié ».
theological_decisions:
- issue: Faut-il traiter « Jérusalem nouvelle » comme un titre eschatologique figé ?
  choice: « la Jérusalem nouvelle », avec « nouvelle » en minuscule
  alternative: « la Nouvelle Jérusalem »
  rationale: Le grec associe le nom Ἰερουσαλήμ à l’adjectif καινήν. La minuscule préserve la force descriptive de l’adjectif sans nier que l’expression puisse fonctionner comme une désignation eschatologique.
- issue: Faut-il expliciter l’identité ecclésiologique de la mariée ?
  choice: Conserver uniquement la comparaison avec une mariée
  alternative: Expliciter « l’Église, épouse de l’Agneau »
  rationale: Le verset formule une comparaison et n’identifie pas explicitement ici la ville à l’Église. Une telle explicitation résoudrait dans la traduction une relation symbolique que le texte laisse se déployer.
- issue: Nuance de la double provenance ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ
  choice: « du ciel, d’auprès de Dieu »
  alternative: « du ciel, de Dieu »
  rationale: « D’auprès de Dieu » garde les deux compléments distincts et suggère le point d’origine personnel marqué par ἀπό, sans transformer celui-ci en affirmation doctrinale plus précise.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple « je vis » convient au caractère visionnaire et littéraire du passage. « Mariée parée » conserve l’écho sonore du grec sans archaïsme marqué. Aucun appel de note n’est nécessaire, puisqu’aucune note n’est proposée.
