id: REV.21.15
reference: Revelation 21:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: fr
  text: Celui qui me parlait avait un roseau d’or servant à mesurer[a], pour mesurer la ville, ses portes et sa muraille.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une canne à mesurer en or ». Le mot grec désigne littéralement un roseau, employé ici comme instrument de mesure.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: Celui qui me parlait
  rationale: Le participe présent substantivé est rendu par une tournure française naturelle qui conserve la description du personnage sans ajouter « ange », absent de ce verset.
- source_word: εἶχεν
  choice: avait
  rationale: L’imparfait de ἔχω exprime simplement la possession; « avait » évite de préciser sans nécessité qu’il tenait l’objet en main.
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: une règle d’or
  rationale: κάλαμος désigne littéralement un roseau employé ici comme instrument de mesure, tandis que μέτρον en explicite la fonction. « Règle » communique naturellement cette fonction en français moderne; la note conserve l’image littérale du roseau.
- source_word: ἵνα μετρήσῃ
  choice: pour mesurer
  rationale: La construction française à l’infinitif exprime clairement et naturellement le but marqué par ἵνα avec le subjonctif aoriste.
- source_word: τὴν πόλιν
  choice: la ville
  rationale: Équivalent usuel, sans expliciter dans le verset qu’il s’agit de la nouvelle Jérusalem.
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: ses portes
  rationale: πυλών peut désigner une porte ou une entrée monumentale; « portes » convient naturellement à la description architecturale de la ville.
- source_word: τὸ τεῖχος αὐτῆς
  choice: sa muraille
  rationale: Dans le contexte d’une ville fortifiée, « muraille » rend plus précisément τεῖχος que le terme général « mur », tout en restant courant.
theological_decisions:
- issue: Faut-il identifier explicitement celui qui parle comme un ange ?
  choice: Conserver « Celui qui me parlait » sans ajouter « ange ».
  alternative: « L’ange qui me parlait »
  rationale: Le contexte plus large permet d’identifier le personnage comme l’un des anges, mais le grec de ce verset emploie seulement une description participiale. La traduction n’introduit donc pas une identification absente de la formulation du verset.
translation_notes:
  register: Français international moderne, naturel et digne. « Celui qui me parlait » évite une tournure pesante tout en préservant la référence descriptive; « règle d’or » rend immédiatement la fonction de l’objet, avec le sens littéral signalé en note.
