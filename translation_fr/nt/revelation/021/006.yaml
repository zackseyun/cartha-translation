id: REV.21.6
reference: Revelation 21:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: fr
  text: 'Puis il me dit : « Ces choses se sont accomplies[a]. Je suis l’Alpha et l’Oméga, le commencement et la fin. À celui qui a soif, je donnerai gratuitement[b] de la source d’eau de la vie. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formule traditionnelle : « C’en est fait. » Le verbe grec est au pluriel : littéralement, « elles se sont accomplies » ou « ces choses se sont accomplies ».'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « sans rien payer » ou « comme un don ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: Ces choses se sont accomplies
  rationale: Le parfait actif pluriel de γίνομαι est rendu par une formulation française explicitement plurielle. « Ces choses » exprime le sujet implicite sans réduire la déclaration au singulier et « se sont accomplies » convient à la réalisation effective des réalités annoncées.
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: l’Alpha et l’Oméga
  rationale: Les noms grecs des lettres sont conservés comme titres symboliques établis dans l’Apocalypse; l’apposition qui suit en éclaire immédiatement la portée.
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: le commencement et la fin
  rationale: Cette formulation naturelle conserve les dimensions temporelle et téléologique de la paire sans imposer une interprétation plus étroite.
- source_word: τῷ διψῶντι
  choice: à celui qui a soif
  rationale: Le participe présent substantivé désigne au singulier la personne caractérisée par la soif; cette tournure est claire et naturelle en français moderne.
- source_word: δώσω
  choice: je donnerai
  rationale: Le futur simple restitue directement la promesse exprimée par le futur grec.
- source_word: ἐκ τῆς πηγῆς
  choice: de la source
  rationale: πηγή désigne une source ou une fontaine; « source » est courant, clair et adapté à l’image d’une eau jaillissante.
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: de l’eau de la vie
  rationale: La construction génitivale et l’image biblique traditionnelle sont préservées sans paraphrase explicative.
- source_word: δωρεάν
  choice: gratuitement
  rationale: L’adverbe indique que le don est accordé sans paiement; « gratuitement » en exprime directement le sens en français contemporain.
theological_decisions:
- issue: Rendre la déclaration divine Γέγοναν en respectant son pluriel
  choice: Ces choses se sont accomplies
  alternative: C’en est fait
  rationale: La déclaration marque l’accomplissement des réalités promises de la nouvelle création. Le pluriel grec est conservé afin de ne pas l’aplanir en une formule française traditionnelle au singulier.
- issue: Conserver l’image de l’Alpha et de l’Oméga comme titre divin
  choice: l’Alpha et l’Oméga
  alternative: le A et le Z
  rationale: Les noms des lettres grecques maintiennent l’image propre à l’Apocalypse et ses résonances intertextuelles; l’expression « le commencement et la fin » en donne ensuite la portée conceptuelle sans ajout doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant un calque excessif. Les titres « Alpha » et « Oméga » ainsi que l’expression « eau de la vie » sont conservés pour préserver l’imagerie de l’Apocalypse.
