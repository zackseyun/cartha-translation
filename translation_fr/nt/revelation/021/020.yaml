  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: fr
  text: la cinquième, de sardonyx ; la sixième, de cornaline[a] ; la septième, de chrysolithe ; la huitième, de béryl ; la neuvième, de topaze ; la dixième, de chrysoprase ; la onzième, d’hyacinthe[b] ; la douzième, d’améthyste.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sardoine » ; l’identification précise de certaines pierres précieuses de l’Antiquité demeure incertaine.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec désigne ici une pierre précieuse, et non la fleur.
    reason: lexical_clarification
lexical_decisions:
- source_word: σαρδόνυξ
  choice: sardoine
  rationale: « Sardoine » est le nom français courant de la variété d’onyx désignée par ce terme grec et maintient sa distinction avec σάρδιον.
- source_word: σάρδιον
  choice: cornaline
  rationale: « Cornaline » est l’équivalent moderne le plus intelligible, tout en signalant en note l’incertitude propre à l’identification des pierres antiques.
- source_word: χρυσόλιθος
  choice: chrysolithe
  rationale: Le terme minéralogique traditionnel français conserve le nom grec conventionnel sans imposer une identification moderne incertaine.
- source_word: βήρυλλος
  choice: béryl
  rationale: Équivalent français standard du nom de cette pierre.
- source_word: τοπάζιον
  choice: topaze
  rationale: Équivalent français standard, malgré l’incertitude possible entre nomenclatures antiques et modernes.
- source_word: χρυσόπρασος
  choice: chrysoprase
  rationale: Nom français établi de la pierre ; une traduction étymologique littérale serait obscure.
- source_word: ὑάκινθος
  choice: hyacinthe
  rationale: Le terme traditionnel français correspond au grec et désigne ici une pierre précieuse, non la fleur.
- source_word: ἀμέθυστος
  choice: améthyste
  rationale: Équivalent français standard du nom grec.
