id: REV.21.8
reference: Revelation 21:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: fr
  text: Mais les lâches, les incroyants[a], les personnes abominables, les meurtriers, ceux qui vivent dans l’immoralité sexuelle, ceux qui pratiquent la magie, les idolâtres et tous les menteurs auront leur part dans l’étang embrasé de feu et de soufre. C’est la seconde mort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les infidèles » ou « ceux qui manquent de foi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: δειλοῖς
  choice: les lâches
  rationale: Le terme dénonce une peur moralement coupable, et non la peur ordinaire; « les lâches » en conserve la force dans un français courant.
- source_word: ἀπίστοις
  choice: les incroyants
  rationale: Dans cette liste liée au jugement, le sens le plus direct est celui de personnes qui ne croient pas; l’autre valeur possible, « infidèles », est signalée en note.
- source_word: ἐβδελυγμένοις
  choice: les êtres abjects
  rationale: Le participe parfait caractérise des personnes devenues ou tenues pour répugnantes en raison de ce qui les souille. Cette formulation conserve la forte réprobation sans employer l’archaïsme « abominables ».
- source_word: φονεῦσι
  choice: les meurtriers
  rationale: Le nom désigne précisément des auteurs de meurtre, plutôt que toute personne ayant causé une mort.
- source_word: πόρνοις
  choice: ceux qui vivent dans l’immoralité sexuelle
  rationale: Le terme désigne les personnes caractérisées par des pratiques sexuelles immorales; cette formulation est claire, actuelle et suffisamment large.
- source_word: φαρμάκοις
  choice: ceux qui pratiquent la magie
  rationale: Dans l’Apocalypse, le terme vise les praticiens d’arts magiques ou occultes, non les pharmaciens ni simplement les empoisonneurs. Cette expression est plus immédiatement compréhensible que « sorciers » dans certains usages modernes.
- source_word: εἰδωλολάτραις
  choice: les idolâtres
  rationale: Le terme désigne directement ceux qui rendent un culte aux idoles; « idolâtres » est précis et naturel dans le registre biblique français.
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: tous les menteurs
  rationale: L’adjectif substantivé désigne ici les personnes fausses ou mensongères; « tous les menteurs » est l’expression française la plus claire.
- source_word: τὸ μέρος αὐτῶν
  choice: auront leur part
  rationale: μέρος exprime ici la part ou le sort attribué. Le futur rend naturellement en français la portée eschatologique de la proposition nominale grecque.
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: dans l’étang embrasé de feu et de soufre
  rationale: La formulation conserve l’image de l’étang en combustion et traduit θείον par son équivalent concret moderne, « soufre ».
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: C’est la seconde mort
  rationale: Le relatif grec identifie l’étang qui précède à la seconde mort. Une nouvelle phrase évite en français l’ambiguïté de genre qu’introduirait « lequel », tout en gardant la fonction explicative.
theological_decisions:
- issue: Sens de ἄπιστος dans une liste de personnes jugées
  choice: incroyants
  alternative: infidèles
  rationale: Le contexte favorise l’absence de foi, mais le mot peut aussi qualifier ceux qui manquent de fidélité. La note préserve cette tension sémantique sans imposer une lecture confessionnelle.
- issue: Référent de ὅ dans l’identification à la seconde mort
  choice: « C’est la seconde mort », renvoyant à l’étang embrasé
  alternative: « lequel est la seconde mort »
  rationale: Le neutre ὅ reprend naturellement l’ensemble de l’image précédente. La formulation française explicite ce renvoi sans décider davantage de la nature théologique de la seconde mort.
- issue: Traduction de θείον
  choice: soufre
  alternative: aucun archaïsme traditionnel ajouté
  rationale: « Soufre » désigne directement la substance évoquée par le grec et demeure immédiatement intelligible en français moderne.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition structurante de l’article et des groupes nominaux maintient le rythme solennel de la liste grecque, tandis que les périphrases retenues pour πόρνοις et φαρμάκοις évitent des termes ambigus ou vieillis.
