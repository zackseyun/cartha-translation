source:
  edition: SBLGNT
  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: fr
  text: Du côté de l’est[a], trois portes ; et du côté du nord, trois portes ; et du côté du sud, trois portes ; et du côté de l’ouest, trois portes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de l’est … du nord … du sud … de l’ouest » ; dans ce contexte, ces expressions indiquent le côté où se trouvent les portes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: Du côté de l’est
  rationale: Dans cette description schématique, ἀπό suivi du point cardinal situe les portes sur un côté de la ville. « Du côté de l’est » rend naturellement cette valeur spatiale tout en restant proche de la formulation grecque.
- source_word: πυλῶνες
  choice: portes
  rationale: πυλών peut désigner une porte ou une entrée monumentale. « Portes » est clair, naturel et cohérent avec la description de la muraille de la nouvelle Jérusalem.
- source_word: τρεῖς
  choice: trois
  rationale: Le cardinal est rendu directement et répété pour chaque côté afin de préserver la symétrie mesurée du grec.
- source_word: ἀπὸ βορρᾶ / ἀπὸ νότου / ἀπὸ δυσμῶν
  choice: du côté du nord / du côté du sud / du côté de l’ouest
  rationale: La même construction est rendue uniformément pour exprimer l’emplacement sur chacun des côtés de la ville. δυσμῶν désigne l’ouest, le côté du coucher du soleil.
- source_word: καὶ ... καὶ ... καὶ ...
  choice: juxtaposition par points-virgules, avec « et » avant le dernier élément
  rationale: Le français énumératif naturel n’exige pas la répétition de « et » à chaque membre. Les points-virgules et le dernier « et » conservent néanmoins le rythme ordonné et la symétrie de la liste.
theological_decisions:
- issue: Description spatiale des portes de la nouvelle Jérusalem
  choice: Une énumération architecturale directe de trois portes sur chacun des quatre côtés
  alternative: Faire ressortir dans la traduction un symbolisme lié à la disposition des tribus d’Israël ou à la vision d’Ézéchiel
  rationale: Le verset énumère simplement les portes selon les quatre points cardinaux. La traduction laisse ouvertes les résonances symboliques canoniques sans les introduire explicitement dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « du côté de » maintient la disposition régulière du verset, tandis que les points-virgules en soutiennent le rythme architectural.
