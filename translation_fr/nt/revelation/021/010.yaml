id: REV.21.10
reference: Revelation 21:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: fr
  text: Il me transporta dans l’Esprit[a] sur une montagne grande et élevée, et il me montra la ville sainte, Jérusalem, qui descendait du ciel, d’auprès de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en esprit ». L’expression grecque peut désigner un état visionnaire ; dans l’Apocalypse, elle introduit régulièrement une vision prophétique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: transporta
  rationale: Le verbe exprime ici le déplacement de Jean vers un autre point d’observation dans le cadre de la vision. « Transporta » est naturel en français et conserve cette idée sans préciser indûment le mode du déplacement.
- source_word: ἐν πνεύματι
  choice: dans l’Esprit
  rationale: Dans l’Apocalypse, cette formule récurrente introduit une expérience visionnaire prophétique. La majuscule signale la référence probable à l’Esprit Saint, tandis que la note préserve l’autre compréhension possible.
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: sur une montagne grande et élevée
  rationale: « Sur » rend le mouvement vers un point situé sur la montagne. Les deux adjectifs sont maintenus, car μέγα et ὑψηλόν présentent deux caractéristiques distinctes.
- source_word: ἔδειξέν μοι
  choice: me montra
  rationale: Traduction directe et idiomatique de δείκνυμι, sans ajouter une nuance de révélation qui n’est pas explicitement exprimée par le verbe.
- source_word: τὴν πόλιν τὴν ἁγίαν Ἰερουσαλήμ
  choice: la ville sainte, Jérusalem
  rationale: Cette formulation conserve l’apposition grecque et identifie naturellement la ville sainte comme Jérusalem.
- source_word: καταβαίνουσαν
  choice: qui descendait
  rationale: Le participe présent décrit la ville en cours de descente. L’imparfait français convient à l’action observée dans le déroulement de la vision.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: La tournure française « descendre du ciel » exprime naturellement la provenance indiquée par ἐκ, sans lourdeur.
- source_word: ἀπὸ τοῦ θεοῦ
  choice: d’auprès de Dieu
  rationale: Cette expression distingue la source personnelle indiquée par ἀπό de la provenance spatiale « du ciel » et évite la répétition peu élégante « du ciel, de Dieu », sans ajouter explicitement « la présence ».
theological_decisions:
- issue: Référent de πνεῦμα dans la formule visionnaire ἐν πνεύματι
  choice: « dans l’Esprit », avec majuscule
  alternative: « en esprit », désignant un état visionnaire ou l’esprit de Jean
  rationale: Le contexte de l’Apocalypse favorise l’action de l’Esprit Saint dans la vision, mais le grec ne supprime pas toute ambiguïté. Le texte retient la lecture probable et la note rend visible l’autre possibilité.
translation_notes:
  register: Français moderne, international et digne. La syntaxe reste proche du mouvement de la phrase grecque. « Montagne grande et élevée » conserve les deux adjectifs malgré une formulation légèrement plus solennelle que dans l’usage courant.
