id: REV.21.19
reference: Revelation 21:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: fr
  text: 'Les fondations de la muraille de la ville étaient ornées de toutes sortes de pierres précieuses[a] : la première fondation était de jaspe, la deuxième de saphir, la troisième de calcédoine[b], la quatrième d’émeraude,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de chaque pierre précieuse ». L’expression grecque peut avoir un sens distributif, d’où la traduction « de toutes sortes de pierres précieuses ».'
    reason: lexical_alternative
  - marker: b
    text: « Calcédoine » est la traduction traditionnelle du terme grec; l’identification exacte de certaines pierres précieuses de l’Antiquité demeure incertaine.
    reason: cultural_note
lexical_decisions:
- source_word: θεμέλιοι
  choice: fondations
  rationale: Le pluriel désigne les fondations, ou les assises fondamentales, de la muraille. « Fondations » est naturel en français et évite d’ajouter explicitement « pierres ».
- source_word: τεῖχος
  choice: muraille
  rationale: Dans la description d’une ville fortifiée, « muraille » rend le terme plus précisément et plus naturellement que le générique « mur ».
- source_word: πόλεως
  choice: ville
  rationale: Équivalent français courant de πόλις dans ce contexte eschatologique.
- source_word: παντὶ λίθῳ τιμίῳ
  choice: de toutes sortes de pierres précieuses
  rationale: Cette formulation exprime naturellement la valeur distributive possible de παντί tout en conservant l’idée d’ornement au moyen de pierres précieuses.
- source_word: κεκοσμημένοι
  choice: étaient ornées
  rationale: Le participe parfait passif décrit l’état résultant d’un ornement achevé; « étaient ornées » en conserve le passif et le registre élevé.
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: la première fondation
  rationale: Le singulier individualise successivement chacune des fondations; cette traduction reste proche du grec sans imposer « pierre de fondation ».
- source_word: ἴασπις
  choice: jaspe
  rationale: Nom français traditionnel et lexicalement établi de cette pierre, même si l’identification minéralogique antique n’est pas nécessairement identique à la classification moderne.
- source_word: σάπφιρος
  choice: saphir
  rationale: Équivalent français usuel du nom de cette pierre précieuse.
- source_word: χαλκηδών
  choice: calcédoine
  rationale: Forme française traditionnelle correspondant au terme grec; l’identification exacte de certaines gemmes antiques demeure incertaine.
- source_word: σμάραγδος
  choice: émeraude
  rationale: Équivalent français établi et probable, sans exclure l’incertitude générale entourant certaines nomenclatures antiques.
theological_decisions:
- issue: Interprétation symbolique de la liste des pierres dans la vision apocalyptique
  choice: Traduire directement les noms des pierres sans leur attribuer de signification symbolique dans le texte.
  alternative: Relier explicitement chaque pierre aux tribus d’Israël, aux apôtres ou aux ornements sacerdotaux.
  rationale: Le verset décrit les ornements mais n’explique pas leur symbolisme. Une interprétation explicite importerait dans la traduction une construction théologique qui n’est pas formulée ici.
translation_notes:
  register: Français international moderne, digne et accessible. « Muraille » convient au cadre urbain fortifié; « ornées » préserve le ton élevé. La répétition « la première… la deuxième… » reproduit la progression solennelle du grec.
