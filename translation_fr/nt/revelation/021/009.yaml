id: REV.21.9
reference: Revelation 21:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: fr
  text: 'Puis l’un des sept anges qui avaient les sept coupes pleines des sept derniers fléaux vint et parla avec moi en disant : « Viens, je te montrerai la mariée, l’épouse de l’Agneau. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: Puis
  rationale: Marque naturellement la progression du récit tout en conservant la valeur connective.
- source_word: ἦλθεν
  choice: vint
  rationale: Rend directement l’aoriste de ἔρχομαι dans ce contexte narratif.
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: l’un des sept anges
  rationale: Expression partitive idiomatique en français.
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: qui avaient les sept coupes
  rationale: Le participe identifie les anges par les coupes en leur possession; « avaient » est naturel et ne précise pas inutilement qu’ils les tenaient encore à cet instant.
- source_word: φιάλας
  choice: coupes
  rationale: Désigne correctement les récipients larges évoqués ici, contrairement à « fioles », trompeur en français moderne.
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: pleines des sept derniers fléaux
  rationale: Conserve l’idée d’être plein, le nombre sept et la position finale des fléaux dans la série apocalyptique.
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: parla avec moi
  rationale: Préserve la construction grecque avec μετά, sans la réduire silencieusement à « me parla », même si cette dernière tournure serait plus courante.
- source_word: λέγων
  choice: en disant
  rationale: Maintient explicitement le lien participial qui introduit les paroles directes.
- source_word: Δεῦρο
  choice: Viens
  rationale: Impératif d’invitation concis et naturel.
- source_word: δείξω σοι
  choice: je te montrerai
  rationale: Rend directement le futur de l’indicatif et le pronom singulier.
- source_word: τὴν νύμφην
  choice: la fiancée
  rationale: « Fiancée » exprime l’image nuptiale de νύμφη et demeure distinct de γυνή, traduit ensuite par « épouse ».
- source_word: τὴν γυναῖκα τοῦ ἀρνίου
  choice: l’épouse de l’Agneau
  rationale: Dans cette apposition nuptiale, γυνή signifie « épouse »; « Agneau » conserve le titre christologique caractéristique de l’Apocalypse.
theological_decisions:
- issue: Rapport entre νύμφην et γυναῖκα
  choice: la fiancée, l’épouse de l’Agneau
  alternative: la mariée, la femme de l’Agneau
  rationale: Les deux substantifs apposés sont conservés afin de ne pas aplatir l’image. « Fiancée » et « épouse » rendent en français actuel les deux aspects de l’expression nuptiale, sans transformer l’apposition en un terme composé.
- issue: Emploi de ἀρνίον comme titre christologique
  choice: l’Agneau
  alternative: l’agneau
  rationale: La majuscule signale l’emploi titulaire dans l’Apocalypse sans ajouter d’explication doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La structure de la phrase grecque est largement conservée, avec une syntaxe française naturelle. Aucun appel de note n’est introduit, car les notes anglaises fournies présentent un décalage manifeste entre leurs marqueurs et leur contenu, et le texte français peut préserver directement les éléments concernés.
