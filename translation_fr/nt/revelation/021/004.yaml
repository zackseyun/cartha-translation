id: REV.21.4
reference: Revelation 21:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: fr
  text: Il essuiera toute larme de leurs yeux[a]. La mort ne sera plus ; il n’y aura plus ni deuil, ni cri[b], ni douleur. Les réalités d’autrefois ont disparu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « toutes les larmes ». En grec, le singulier a ici une valeur distributive : chaque larme.'
    reason: lexical_alternative
  - marker: b
    text: Ou « clameur ». Le mot grec peut désigner un cri ou un cri puissant.
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « les premières choses sont parties » ; c’est-à-dire les réalités de l’ordre antérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: essuiera
  rationale: Avec « larme », ἐξαλείφω exprime naturellement l’action personnelle d’essuyer et d’enlever les larmes ; « effacera » serait moins idiomatique en français dans ce contexte.
- source_word: πᾶν δάκρυον
  choice: toute larme
  rationale: 'Le singulier accompagné de πᾶν a une valeur distributive : chaque larme est visée. « Toute larme » conserve cette nuance en français.'
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: de leurs yeux
  rationale: Formulation française naturelle qui exprime bien l’éloignement des larmes à partir des yeux.
- source_word: ὁ θάνατος οὐκ ἔσται ἔτι
  choice: La mort ne sera plus
  rationale: Cette formulation concise et solennelle rend l’abolition catégorique de la mort exprimée par le grec.
- source_word: πένθος
  choice: deuil
  rationale: Le terme désigne le deuil ou l’affliction, particulièrement en rapport avec la mort ; « deuil » convient précisément à cette énumération.
- source_word: κραυγή
  choice: cri
  rationale: κραυγή désigne un cri, parfois un cri puissant ou une clameur. « Cri » demeure suffisamment large et naturel sans imposer l’idée plus collective de « clameur ».
- source_word: πόνος
  choice: douleur
  rationale: Dans cette liste des maux abolis, « douleur » rend clairement πόνος et peut englober la souffrance physique comme l’affliction.
- source_word: τὰ πρῶτα
  choice: les réalités d’autrefois
  rationale: Le neutre pluriel substantivé renvoie aux éléments ou réalités de l’ordre antérieur. Cette formulation française est naturelle et évite l’ambiguïté temporelle de « les premières choses ».
- source_word: ἀπῆλθαν
  choice: ont disparu
  rationale: Le verbe marque le départ accompli de l’ancien ordre. « Ont disparu » restitue ici naturellement cette cessation, sans évoquer le décès comme pourrait le faire « sont passées ».
theological_decisions:
- issue: Sujet implicite de ἐξαλείψει
  choice: Employer « Il » sans ajouter « Dieu » dans le verset.
  alternative: « Dieu essuiera »
  rationale: Le sujet masculin singulier est fourni par le contexte immédiat de 21.3, mais le nom « Dieu » n’est pas répété dans le texte grec du verset. Le pronom préserve cette cohésion.
- issue: Portée de la disparition de la mort et des souffrances
  choice: 'Conserver des formulations absolues : « La mort ne sera plus » et « il n’y aura plus » pour les autres réalités.'
  alternative: Employer des formulations atténuées telles que « il y aura moins de douleur ».
  rationale: Le grec affirme une cessation catégorique, et non une simple diminution ; la traduction maintient cette pleine portée eschatologique.
- issue: Relation logique de la dernière proposition
  choice: Introduire « car » devant « les réalités d’autrefois ont disparu ».
  alternative: 'Conserver une juxtaposition stricte : « Les réalités d’autrefois ont disparu. »'
  rationale: Le grec juxtapose les propositions, mais la dernière fournit naturellement le fondement de la disparition des maux énumérés. « Car » explicite légèrement cette relation discursive sans modifier le contenu.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation sépare nettement l’action personnelle d’essuyer les larmes de l’énumération solennelle des réalités abolies. Le futur et le passé composé préservent le contraste temporel de la vision.
