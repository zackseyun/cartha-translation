id: REV.21.11
reference: Revelation 21:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: fr
  text: Elle avait la gloire de Dieu. Son éclat était semblable à celui d’une pierre très précieuse, telle une pierre de jaspe, cristalline.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « étincelante comme du cristal » pour « cristalline ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν
  choice: Elle avait
  rationale: Le participe présent féminin se rapporte à la ville du verset précédent. Une proposition indépendante est naturelle en français tout en conservant l’idée qu’elle possède la gloire divine.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: la gloire de Dieu
  rationale: « Gloire » est le rendu biblique usuel de δόξα et préserve à la fois la majesté et la manifestation visible de la présence divine.
- source_word: ὁ φωστὴρ αὐτῆς
  choice: son éclat
  rationale: φωστήρ peut désigner une source lumineuse ou ce qui diffuse la lumière. « Éclat » convient à la description de l’apparence de la ville sans préciser excessivement la nature de cette lumière.
- source_word: ὅμοιος λίθῳ τιμιωτάτῳ
  choice: était semblable à celui d’une pierre très précieuse
  rationale: La tournure restitue la comparaison et la valeur superlative de τιμιωτάτῳ, tout en évitant de laisser entendre que l’éclat est lui-même une pierre.
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: telle une pierre de jaspe
  rationale: Le choix conserve la répétition de λίθος et l’identification de la pierre comme jaspe dans une formulation française naturelle.
- source_word: κρυσταλλίζοντι
  choice: cristalline
  rationale: Le participe qualifie le jaspe comme ayant l’aspect ou les propriétés visuelles du cristal. « Cristalline » préserve cette relative indétermination mieux qu’une précision exclusive sur la transparence ou le scintillement.
theological_decisions:
- issue: Sens de δόξα τοῦ θεοῦ dans la vision apocalyptique
  choice: la gloire de Dieu
  alternative: la splendeur de Dieu
  rationale: « Gloire » conserve la portée théologique de la présence divine manifestée, tandis que « splendeur » réduirait plus facilement l’expression à son aspect visuel.
- issue: Nature exacte de φωστήρ
  choice: son éclat
  alternative: sa lumière
  rationale: Le contexte associe manifestement le terme à la luminosité de la ville, mais le grec peut évoquer soit une source lumineuse, soit son rayonnement. « Éclat » garde cette tension sans identifier la lumière à un objet précis.
translation_notes:
  register: Français international moderne, digne et accessible. Le rythme bref conserve le caractère visionnaire de la description; « telle » évite une répétition pesante de « semblable ».
