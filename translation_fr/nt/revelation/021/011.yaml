  source_fidelity: 'Le texte rend fidèlement la structure et le sens du grec : la ville possède « la gloire de Dieu », et son éclat est comparé à une pierre de très grand prix, précisée comme une pierre de jaspe ayant l’apparence du cristal. « Elle avait » est une transposition française recevable du participe ἔχουσαν, rattaché à la ville du verset précédent.'
  naturalness: Le français est fluide, moderne et soutenu. « Son éclat était semblable à celui d’une pierre très précieuse » évite à juste titre l’image maladroite d’un éclat qui serait lui-même une pierre. La reprise « telle une pierre de jaspe » reste naturelle dans ce registre visionnaire.
  terminology: « La gloire de Dieu » conserve la portée de δόξα. « Éclat » est un bon choix contextuel pour φωστήρ sans imposer le sens plus concret de « luminaire ». « Pierre de jaspe » et « cristalline » rendent l’imagerie précieuse et la qualité visuelle exprimées par λίθος ἰάσπιδι κρυσταλλίζοντι. La note offre une alternative légitime sans réduire indûment l’ambiguïté du participe grec.
