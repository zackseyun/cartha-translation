id: REV.21.1
reference: Revelation 21:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: fr
  text: Et je vis un ciel nouveau et une terre nouvelle, car le premier ciel et la première terre[a] avaient disparu, et la mer n’existe plus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le ciel d’autrefois et la terre d’autrefois ». Le grec dit littéralement « le premier ciel et la première terre » ; « premier » peut désigner ici l’ordre antérieur, par contraste avec le nouveau.
    reason: lexical_alternative
  - marker: b
    text: « La mer » peut être comprise au sens littéral ; dans l’Apocalypse, elle peut aussi évoquer le chaos, le danger ou la séparation.
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: je vis
  rationale: L’aoriste de ὁράω fonctionne ici comme un passé narratif simple. « Je vis » est direct, digne et naturel dans le récit d’une vision.
- source_word: οὐρανὸν ... γῆν
  choice: un ciel ... une terre
  rationale: Dans ce contexte cosmique, les deux termes désignent l’ordre créé plutôt que le seul ciel visible et le sol. Le singulier français correspond aux formes grecques.
- source_word: καινὸν ... καινήν
  choice: nouveau ... nouvelle
  rationale: καινός exprime la nouveauté sans préciser à lui seul s’il s’agit d’un remplacement ou d’une transformation. « Nouveau » conserve cette ouverture.
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: le premier ciel et la première terre
  rationale: « Premier » rend directement πρῶτος et maintient le contraste entre l’ordre antérieur et le nouveau, sans substituer une interprétation au texte.
- source_word: ἀπῆλθαν
  choice: avaient disparu
  rationale: Dans ce contexte, ἀπέρχομαι décrit la disparition de l’ordre précédent. Le plus-que-parfait situe naturellement cette disparition par rapport à la vision introduite par « je vis ».
- source_word: ἡ θάλασσα
  choice: la mer
  rationale: « La mer » est l’équivalent concret et direct de θάλασσα. Ses éventuelles résonances symboliques ne sont pas introduites dans le corps du texte.
- source_word: οὐκ ἔστιν ἔτι
  choice: n’existe plus
  rationale: Cette tournure rend clairement la négation présente accompagnée de ἔτι, tout en conservant le changement de temps du grec après les verbes au passé.
theological_decisions:
- issue: Nature du ciel nouveau et de la terre nouvelle
  choice: Employer « nouveau » sans préciser s’il s’agit d’un remplacement ou d’une transformation de la création.
  alternative: Traduire ou expliquer comme une création entièrement remplacée, ou comme la création existante renouvelée.
  rationale: καινός indique la nouveauté, mais le verset ne tranche pas à lui seul entre remplacement et renouvellement. La formulation préserve cette tension.
- issue: Sens de l’absence de la mer
  choice: 'Conserver l’image concrète : « la mer n’existe plus ».'
  alternative: Expliciter dans le texte la disparition du chaos, du mal, du danger ou de la séparation.
  rationale: La mer peut porter des résonances symboliques dans l’Apocalypse, mais le texte nomme simplement la mer. La note signale les possibilités sans imposer une interprétation.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif de la vision sans être archaïque. Le présent final, « n’existe plus », reproduit le changement de temps du grec et donne à la déclaration sa force immédiate.
