id: REV.21.24
reference: Revelation 21:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: fr
  text: Les nations marcheront à sa lumière[a], et les rois de la terre y apporteront leur gloire[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : grâce à sa lumière.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : leur splendeur, ou leur honneur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: marcheront
  rationale: Le sens concret de « marcher » convient à l’image de peuples avançant à la lumière de la ville et préserve la force visuelle du passage.
- source_word: τὰ ἔθνη
  choice: les nations
  rationale: « Les nations » rend le sens collectif, politique et ethnique du terme et maintient l’écho des prophéties de l’Ancien Testament.
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: à sa lumière
  rationale: Cette tournure française naturelle exprime que la lumière de la ville permet ou oriente leur marche, sans alourdir la phrase.
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: les rois de la terre
  rationale: Il s’agit de la formulation apocalyptique habituelle pour les souverains terrestres; elle assure aussi la cohérence avec le reste de l’Apocalypse.
- source_word: φέρουσιν
  choice: apporteront
  rationale: Le futur français harmonise l’action avec « marcheront » et rend naturellement le présent grec employé dans la description visionnaire.
- source_word: τὴν δόξαν αὐτῶν
  choice: leur gloire
  rationale: « Gloire » conserve la résonance biblique du terme, qui peut inclure l’honneur, la magnificence et les richesses royales.
- source_word: εἰς αὐτήν
  choice: y
  rationale: Le pronom adverbial « y » renvoie naturellement à la ville et exprime la destination sans imposer une personnification plus marquée que le grec.
theological_decisions:
- issue: Référence et éventuelle personnification des pronoms féminins désignant la nouvelle Jérusalem
  choice: Employer « sa » puis « y », en référence à la ville.
  alternative: Employer « sa » puis « en elle », ce qui ferait davantage entendre la personnification nuptiale de la ville.
  rationale: Le contexte immédiat présente surtout la Jérusalem nouvelle comme une ville éclairant les nations et recevant la gloire des rois. « Y » garde le renvoi spatial tout en laissant au contexte élargi l’image de l’épouse.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste accessible, tout en conservant les images concrètes de la marche, de la lumière et de la gloire apportée dans la ville.
