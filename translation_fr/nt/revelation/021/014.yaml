id: REV.21.14
reference: Revelation 21:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: fr
  text: La muraille de la ville avait douze fondations[a], et sur elles se trouvaient les douze noms des douze apôtres de l’Agneau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « douze pierres de fondation ». Le grec peut désigner des fondations ou des pierres servant de fondation dans un contexte architectural.
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: muraille
  rationale: Dans le contexte d’une ville fortifiée, « muraille » rend plus précisément τεῖχος que le terme général « mur » et reste naturel en français.
- source_word: πόλεως
  choice: de la ville
  rationale: 'Le génitif exprime simplement l’appartenance ou l’association : la muraille qui entoure la ville.'
- source_word: ἔχων
  choice: avait
  rationale: Bien que le grec emploie un participe présent, une forme verbale finie est plus idiomatique dans cette description en français. L’accord grec au masculin avec τεῖχος, malgré le neutre attendu, n’a pas à être reproduit.
- source_word: θεμελίους δώδεκα
  choice: douze fondations
  rationale: θεμέλιος peut désigner une fondation ou une pierre de fondation. « Douze fondations » conserve le sens principal sans préciser indûment leur forme matérielle.
- source_word: ἐπ’ αὐτῶν
  choice: sur lesquelles
  rationale: ἐπί avec le génitif indique ici une position sur les fondations. Le relatif féminin pluriel fournit un lien clair et naturel avec « fondations ».
- source_word: ὀνόματα
  choice: étaient inscrits les douze noms
  rationale: Le grec dit littéralement que les noms étaient « sur » les fondations. En français, « étaient inscrits » explicite naturellement cette relation spatiale implicite, sans modifier l’identité ni le contenu des noms.
- source_word: ἀποστόλων
  choice: apôtres
  rationale: « Apôtres » est le terme français établi pour cette fonction néotestamentaire et préserve son sens particulier.
- source_word: τοῦ ἀρνίου
  choice: de l’Agneau
  rationale: Dans l’Apocalypse, ἀρνίον sert de titre christologique récurrent. « L’Agneau » en conserve l’image et la valeur titulaire.
theological_decisions:
- issue: Valeur christologique de ἀρνίον
  choice: l’Agneau
  alternative: l’agneau
  rationale: La majuscule signale que le mot désigne ici le Christ comme personnage titulaire récurrent de l’Apocalypse, sans ajouter une interprétation étrangère au texte.
- issue: Relation des apôtres à l’Agneau
  choice: les douze apôtres de l’Agneau
  alternative: les douze apôtres appartenant à l’Agneau
  rationale: Le génitif grec reste volontairement concis. La tournure « de l’Agneau » préserve cette relation sans en imposer une analyse plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. « Muraille » convient à l’architecture urbaine de la vision. La phrase est légèrement restructurée pour éviter une coordination lourde et rendre naturellement la présence des noms sur les fondations.
