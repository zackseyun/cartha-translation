id: REV.21.22
reference: Revelation 21:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: fr
  text: Et je n’y vis aucun temple[a], car le Seigneur Dieu, le Tout-Puissant, est son temple, ainsi que l’Agneau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sanctuaire ». Le grec ναός peut désigner plus précisément le sanctuaire intérieur du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: temple
  rationale: « Temple » est le terme français le plus clair et le plus naturel dans ce contexte. Il conserve le contraste entre l’absence d’un édifice cultuel et Dieu avec l’Agneau comme temple de la ville. ναός peut désigner plus précisément le sanctuaire intérieur, possibilité signalée en note.
- source_word: οὐκ εἶδον
  choice: je ne vis aucun
  rationale: Le passé simple rend avec concision l’action de vision rapportée par l’aoriste, tandis que « aucun » souligne nettement l’absence du temple.
- source_word: ἐν αὐτῇ
  choice: n’y
  rationale: Le pronom adverbial renvoie naturellement à la ville en français, sans alourdir la phrase ni devoir répéter « en elle ».
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: le Seigneur Dieu, le Tout-Puissant
  rationale: Cette formulation conserve les titres divins et leur relation appositionnelle. « Le Tout-Puissant » est le rendu français établi et précis de παντοκράτωρ dans l’Apocalypse.
- source_word: ναὸς αὐτῆς ἐστιν
  choice: est son temple
  rationale: Le singulier du grec est conservé. En français, « son » s’accorde avec « temple » et renvoie sans ambiguïté à la ville dans le contexte.
- source_word: καὶ τὸ ἀρνίον
  choice: ainsi que l’Agneau
  rationale: « Ainsi que » rattache clairement l’Agneau au Seigneur Dieu comme temple de la ville, tout en permettant de conserver le verbe singulier du texte grec et le caractère ajouté du dernier groupe nominal.
theological_decisions:
- issue: Interprétation de « ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον »
  choice: 'Conserver le verbe au singulier et rattacher l’Agneau au Seigneur Dieu par « ainsi que » : tous deux sont présentés comme le temple de la ville.'
  alternative: 'Employer un sujet coordonné suivi d’un verbe pluriel : « le Seigneur Dieu, le Tout-Puissant, et l’Agneau sont son temple ».'
  rationale: Le grec emploie ἐστιν au singulier avant l’ajout « et l’Agneau ». La formulation retenue respecte cet ordre et ce nombre tout en maintenant la force coordonnante de καί et la portée christologique du passage, sans imposer une reformulation doctrinale plus explicite que le texte.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif solennel de l’Apocalypse. « N’y vis aucun » reste naturel et concis; « ainsi que l’Agneau » préserve la syntaxe singulière et l’ajout final sans obscurcir le sens.
