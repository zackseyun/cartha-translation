id: REV.21.3
reference: Revelation 21:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: fr
  text: 'Et j’entendis une voix forte venant du trône, qui disait : « Voici, la demeure[a] de Dieu est avec les humains. Il demeurera[b] avec eux ; ils seront ses peuples[c], et Dieu lui-même sera avec eux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec σκηνή peut aussi se traduire par « tente » ou « tabernacle ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec est apparenté au mot traduit par « demeure » ; plus littéralement, Dieu « dressera sa tente » avec eux.
    reason: lexical_alternative
  - marker: c
    text: Le grec porte « peuples » au pluriel, et non le singulier traditionnel « peuple ».
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: une voix forte
  rationale: En association avec φωνή, μεγάλη exprime ici la puissance ou le volume de la voix. « Une voix forte » est naturel en français moderne et conserve la solennité de la proclamation.
- source_word: ἐκ τοῦ θρόνου
  choice: venant du trône
  rationale: ἐκ indique la provenance. La formulation « venant du trône » est idiomatique et maintient l’imagerie du trône caractéristique de l’Apocalypse.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: « Voici » restitue naturellement en français soutenu la force déictique et l’appel à l’attention de ἰδού.
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: la demeure de Dieu
  rationale: σκηνή désigne littéralement une tente ou un tabernacle, mais exprime ici le lieu de la présence de Dieu. « Demeure » est clair et digne, tandis que la note conserve l’image concrète de la tente et du sanctuaire.
- source_word: μετὰ τῶν ἀνθρώπων
  choice: avec les humains
  rationale: ἄνθρωποι désigne ici les êtres humains en général. « Les humains » rend cette portée collective sans ambiguïté de genre.
- source_word: σκηνώσει
  choice: il demeurera
  rationale: Le verbe σκηνόω signifie habiter ou dresser sa tente et fait écho à σκηνή. « Il demeurera » est fluide dans le texte principal ; la note signale l’écho littéral important.
- source_word: λαοὶ αὐτοῦ
  choice: ses peuples
  rationale: Le texte critique porte le pluriel λαοί. « Ses peuples » préserve cette pluralité au lieu de l’aplanir en un singulier traditionnel.
- source_word: αὐτὸς ὁ θεός
  choice: Dieu lui-même
  rationale: « Lui-même » rend l’emphase de αὐτός et souligne la présence directe de Dieu.
- source_word: μετ’ αὐτῶν ἔσται
  choice: sera avec eux
  rationale: Cette traduction simple et naturelle conserve la formule de présence exprimée par le grec.
theological_decisions:
- issue: Pluriel λαοί plutôt que le singulier traditionnel « peuple »
  choice: ils seront ses peuples
  alternative: ils seront son peuple
  rationale: Le SBLGNT lit λαοί au pluriel. Le maintien de « peuples » respecte le texte critique et laisse ouverte sa portée concernant les divers peuples réunis auprès de Dieu, sans imposer une harmonisation théologique.
- issue: Imagerie de la tente ou du tabernacle dans σκηνή et σκηνόω
  choice: la demeure de Dieu… il demeurera avec eux
  alternative: la tente de Dieu… il dressera sa tente avec eux ; le tabernacle de Dieu… il habitera avec eux
  rationale: Le texte principal privilégie une expression française claire, tandis que les notes préservent l’écho lexical et l’imagerie scripturaire de la tente-sanctuaire associée à la présence divine.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple « j’entendis » convient au registre narratif élevé de l’Apocalypse sans être archaïque. « Voici » conserve la solennité de l’annonce. La ponctuation répartit la longue déclaration grecque en propositions lisibles, sans en modifier les rapports logiques.
