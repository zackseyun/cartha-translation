reference: Revelation 21:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: fr
  text: 'Elle avait une muraille grande et haute, douze portes, et, aux portes, douze anges. Des noms y étaient inscrits : ceux des douze tribus des fils d’Israël.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la formulation traditionnelle : « les douze tribus des enfants d’Israël ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσα
  choice: Elle avait
  rationale: Le participe féminin singulier décrit la ville mentionnée au verset précédent. Une proposition à verbe conjugué est plus naturelle en français tout en conservant le lien descriptif.
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: une muraille grande et haute
  rationale: « Muraille » convient à l’enceinte d’une ville, et les deux adjectifs grecs sont conservés distinctement.
- source_word: πυλῶνας δώδεκα
  choice: douze portes
  rationale: « Portes » est le terme français courant pour les accès monumentaux d’une ville.
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: aux portes
  rationale: Avec le datif, ἐπί a ici une valeur locale. « Aux portes » demeure naturel sans imposer l’idée que les anges se trouvent au-dessus d’elles.
- source_word: ἀγγέλους δώδεκα
  choice: douze anges
  rationale: Traduction directe et non interprétative.
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: Des noms y étaient inscrits
  rationale: ἐπιγεγραμμένα exprime une inscription portée sur un support; « y » renvoie naturellement aux portes dans ce contexte architectural.
- source_word: ἅ ἐστιν
  choice: ceux de
  rationale: Le relatif neutre pluriel reprend « noms » et les identifie comme les noms des tribus; cette formulation française explicite seulement la relation grammaticale sous-entendue.
- source_word: φυλῶν
  choice: tribus
  rationale: Terme biblique et historique usuel pour les divisions d’Israël.
- source_word: υἱῶν Ἰσραήλ
  choice: fils d’Israël
  rationale: Conserve le substantif masculin explicite υἱῶν et la désignation familiale de la source.
theological_decisions:
- issue: Rendu de υἱῶν Ἰσραήλ comme désignation collective
  choice: les fils d’Israël
  alternative: les enfants d’Israël
  rationale: Le texte grec dit explicitement « fils ». Le texte principal garde cette forme, tandis qu’une note signale la tournure française traditionnelle sans neutraliser silencieusement l’expression source.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition grecque de ἔχουσα est allégée pour éviter une lourdeur peu naturelle, sans supprimer aucun élément descriptif. La ponctuation clarifie l’identification des noms.
