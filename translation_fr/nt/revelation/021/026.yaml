id: REV.21.26
reference: Revelation 21:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἴσουσιν τὴν δόξαν καὶ τὴν τιμὴν τῶν ἐθνῶν εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/026.yaml
  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: fr
  text: Et l’on y apportera la gloire et l’honneur des nations.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: La conjonction rattache directement ce verset à la description précédente et se rend naturellement par « Et ».
- source_word: οἴσουσιν
  choice: l’on apportera
  rationale: Le futur actif de φέρω exprime ici le mouvement de quelque chose vers l’intérieur de la ville. « Apporter » est idiomatique en français. Le pronom indéfini « l’on » conserve le sujet non exprimé et indéterminé du grec sans imposer un référent précis.
- source_word: τὴν δόξαν
  choice: la gloire
  rationale: « Gloire » conserve à la fois les connotations d’éclat, de prestige et d’honneur propres à δόξα dans l’Apocalypse.
- source_word: τὴν τιμὴν
  choice: l’honneur
  rationale: Dans cette coordination avec δόξα, τιμή désigne le mieux l’honneur ou le prestige. Des sens étendus comme « richesse » ou « objets précieux » seraient ici trop restrictifs.
- source_word: τῶν ἐθνῶν
  choice: des nations
  rationale: « Nations » rend le sens collectif large de ἔθνη sans introduire artificiellement une opposition entre Juifs et non-Juifs.
- source_word: εἰς αὐτήν
  choice: y
  rationale: Le pronom adverbial « y » exprime naturellement en français le mouvement vers la ville, la nouvelle Jérusalem, tout en évitant le lourd « en elle ». Le genre féminin du grec correspond grammaticalement à πόλις et peut aussi évoquer la personnification de la ville, mais cette nuance ne nécessite pas de note en français puisque « ville » est également féminin.
theological_decisions:
- issue: Référent et personnification de αὐτήν
  choice: Le pronom est rendu par « y » et renvoie à la ville, la nouvelle Jérusalem.
  alternative: « en elle »
  rationale: « Y » est le tour français moderne le plus naturel. « En elle » soulignerait davantage la personnification féminine, mais risquerait de paraître emphatique et de faire croire que le texte distingue ici la ville de sa personnification.
- issue: Sens de « la gloire et l’honneur des nations »
  choice: La formule reste générale, sans préciser la nature de ce qui est apporté.
  alternative: « les richesses des nations » ou « ce qui fait la splendeur des nations »
  rationale: Le grec permet d’évoquer le prestige, la splendeur, l’hommage ou les biens précieux des nations. Le contexte ne permet pas de réduire sûrement l’image à une seule de ces interprétations.
translation_notes:
  register: Français international moderne, digne et direct. La tournure « l’on » évite l’ambiguïté contemporaine de « ils », dont l’antécédent pourrait être recherché à tort dans le verset précédent, tout en conservant l’indétermination du sujet verbal grec. Aucun appel de note n’est nécessaire.
