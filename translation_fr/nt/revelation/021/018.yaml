  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: fr
  text: Le matériau de sa muraille était du jaspe[a], et la ville était d’or pur, semblable à du verre limpide[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « La construction de sa muraille était du jaspe » ou « La structure de sa muraille était du jaspe ». Le terme grec peut désigner la construction, la structure ou le matériau employé.'
    reason: lexical_alternative
  - marker: b
    text: 'Litt. : « du verre pur ». Ou : « du verre transparent ». Le terme grec peut souligner la limpidité éclatante du verre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: était construite
  rationale: Le nom peut désigner la construction, la structure ou le matériau employé. Cette formulation française naturelle conserve l’idée de composition sans ajouter un terme technique.
- source_word: τεῖχος
  choice: muraille
  rationale: Dans le contexte d’une ville, « muraille » désigne naturellement son mur d’enceinte.
- source_word: ἴασπις
  choice: jaspe
  rationale: Nom traditionnel de la pierre correspondant au terme grec, sans prétendre identifier exactement la variété minérale antique.
- source_word: χρυσίον καθαρόν
  choice: or pur
  rationale: Rend directement la matière et sa pureté dans un français idiomatique.
- source_word: ὅμοιον
  choice: semblable à
  rationale: Introduit explicitement la comparaison exprimée par le grec.
- source_word: ὕαλῳ καθαρῷ
  choice: verre pur
  rationale: Rend littéralement la répétition de καθαρός et préserve l’image paradoxale d’un or ayant la pureté ou la limpidité du verre.
