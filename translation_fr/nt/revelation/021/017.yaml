id: REV.21.17
reference: Revelation 21:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: fr
  text: 'Et il mesura sa muraille : 144 coudées, selon une mesure humaine, qui est aussi celle d’un ange.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon la mesure d’un homme, c’est-à-dire d’un ange ». Le grec peut souligner soit que l’ange employait une unité de mesure humaine, soit qu’ici les mesures humaine et angélique correspondent.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: mesura
  rationale: L’aoriste de μετρέω désigne simplement l’acte de mesurer; le passé simple convient au registre narratif biblique en français.
- source_word: τὸ τεῖχος αὐτῆς
  choice: sa muraille
  rationale: τεῖχος désigne la muraille défensive d’une ville. « Sa » renvoie naturellement à la ville, nom féminin en français.
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 coudées
  rationale: La coudée est l’unité ancienne donnée par le texte; elle est conservée sans conversion moderne, et les chiffres favorisent une lecture immédiate.
- source_word: μέτρον ἀνθρώπου
  choice: selon une mesure humaine
  rationale: Cette formulation rend le caractère générique de ἀνθρώπου et laisse ouverte la question de savoir s’il s’agit d’une unité humaine ou d’une mesure correspondant à celle de l’ange.
- source_word: ὅ ἐστιν ἀγγέλου
  choice: qui est aussi celle d’un ange
  rationale: Le grec est elliptique. « Celle » reprend clairement « mesure », tandis que « aussi » exprime la correspondance possible sans développer davantage le texte.
theological_decisions:
- issue: Sens de μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου
  choice: Une mesure dite humaine est également celle d’un ange.
  alternative: Il mesura selon la mesure d’un homme, c’est-à-dire de l’ange.
  rationale: La construction grecque est condensée et peut mettre l’accent soit sur l’emploi par l’ange d’une unité humaine, soit sur la correspondance entre mesure humaine et angélique. Le texte principal demeure naturel tout en conservant cette tension, explicitée dans la note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le ton narratif soutenu sans archaïsme marqué. « Muraille » est plus précis que « mur » pour l’enceinte d’une ville. La ponctuation distingue naturellement la mesure chiffrée de l’explication qui suit.
