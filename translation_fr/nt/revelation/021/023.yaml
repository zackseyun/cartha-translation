id: REV.21.23
reference: Revelation 21:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: fr
  text: La ville n’a besoin ni du soleil ni de la lune pour l’éclairer[a], car la gloire de Dieu l’a illuminée, et sa lampe, c’est l’Agneau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour briller sur elle ». Le grec dit littéralement « pour briller pour/sur elle ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: ville
  rationale: Sens direct et naturel dans le contexte de la nouvelle Jérusalem.
- source_word: οὐ χρείαν ἔχει
  choice: n’a besoin ni… ni…
  rationale: Rend idiomatiquement l’absence de besoin tout en intégrant naturellement les deux compléments coordonnés.
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: ni du soleil ni de la lune
  rationale: Conserve la paire équilibrée et la portée négative du grec dans un français courant.
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: pour l’éclairer
  rationale: Avec le soleil et la lune pour sujets, l’expression désigne leur fonction d’éclairage. Cette formulation française est naturelle; une note signale la traduction plus littérale possible.
- source_word: δόξα
  choice: gloire
  rationale: Terme consacré qui conserve la portée théologique et apocalyptique de δόξα sans la réduire à la seule clarté visible.
- source_word: ἐφώτισεν
  choice: l’a illuminée
  rationale: Exprime concrètement l’action d’apporter la lumière et distingue le verbe de la proposition précédente.
- source_word: λύχνος
  choice: lampe
  rationale: Rend précisément λύχνος, par opposition à la lumière en général ou au porte-lampe.
- source_word: ἀρνίον
  choice: l’Agneau
  rationale: Titre christologique établi dans l’Apocalypse; la majuscule indique cet emploi titulaire.
theological_decisions:
- issue: Rapport métaphorique dans « sa lampe, c’est l’Agneau »
  choice: Conserver directement l’image de la lampe.
  alternative: « l’Agneau est sa lumière »
  rationale: Le grec emploie explicitement λύχνος, « lampe », et non un terme générique pour « lumière ». La formulation conserve aussi la distinction entre la gloire de Dieu qui illumine la ville et l’Agneau qui en est la lampe.
- issue: Image de l’illumination divine
  choice: Traduire l’affirmation sans explication eschatologique ajoutée.
  alternative: Expliciter que Dieu remplace toutes les lumières créées.
  rationale: Le verset affirme seulement que la ville n’a pas besoin du soleil ni de la lune, puisque la gloire de Dieu l’illumine et que l’Agneau est sa lampe.
translation_notes:
  register: Français international moderne, digne et accessible. La dislocation « sa lampe, c’est l’Agneau » restitue avec naturel l’identification emphatique du grec tout en préservant la métaphore.
