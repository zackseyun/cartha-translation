id: REV.21.25
reference: Revelation 21:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: fr
  text: Et ses portes ne seront jamais fermées de jour, car il n’y aura pas de nuit là.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « ses portes ne seront absolument jamais fermées de jour ». Le grec emploie une négation emphatique.'
    reason: lexical_alternative
  - marker: b
    text: La raison donnée est qu’« il n’y aura pas de nuit là ».
    reason: cross_reference
lexical_decisions:
- source_word: πυλῶνες
  choice: portes
  rationale: Dans la description d’une ville, le terme désigne ses portes ou entrées fortifiées. « Portes » est naturel en français et maintient l’image de la nouvelle Jérusalem.
- source_word: οὐ μὴ κλεισθῶσιν
  choice: ne seront jamais fermées
  rationale: La construction οὐ μή avec le subjonctif aoriste exprime une négation future particulièrement forte. « Ne seront jamais fermées » en restitue clairement la portée emphatique.
- source_word: ἡμέρας
  choice: pendant le jour
  rationale: Le génitif a ici une valeur temporelle adverbiale. « Pendant le jour » est clair et préserve le contraste avec l’absence de nuit.
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: car il n’y aura pas de nuit là-bas
  rationale: « Car » rend la valeur explicative de γάρ, tandis que la tournure existentielle française rend naturellement οὐκ ἔσται.
- source_word: καὶ
  choice: Et
  rationale: Cette conjonction relie simplement le verset à la description précédente de la ville.
- source_word: αὐτῆς
  choice: ses
  rationale: Le possessif renvoie naturellement à la ville en français. Comme « ville » est féminin, « ses portes » conserve sans emphase artificielle la référence grammaticale grecque.
theological_decisions:
- issue: Degré de personnification de la nouvelle Jérusalem
  choice: Employer « ses portes »
  alternative: « les portes de la ville » ou une formulation explicitement personnifiée
  rationale: Le possessif français convient aussi bien à une ville qu’à une personne et ne force donc ni n’efface la personnification. Le propos immédiat porte sur l’ouverture permanente de la ville et l’absence de nuit.
translation_notes:
  register: Français international moderne, clair et digne. La formulation suit de près la syntaxe et la logique du grec tout en restant idiomatique. Les marqueurs [a] et [b] figurent dans le texte principal.
