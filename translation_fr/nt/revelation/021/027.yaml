id: REV.21.27
reference: Revelation 21:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: fr
  text: Rien de souillé n’y entrera jamais[a], ni personne qui pratique l’abomination et le mensonge[b], mais seulement ceux qui sont inscrits dans le livre de vie de l’Agneau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rien d’impur » ou « rien de profane », pour πᾶν κοινόν.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « qui pratique l’abomination et le mensonge ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: n’y entrera jamais
  rationale: La construction οὐ μή avec le subjonctif aoriste exprime une négation future catégorique; « jamais » en restitue naturellement la force.
- source_word: αὐτὴν
  choice: y
  rationale: Le pronom renvoie à la ville, la Nouvelle Jérusalem; le pronom adverbial français « y » est naturel avec « entrer ».
- source_word: πᾶν κοινὸν
  choice: rien de souillé
  rationale: Le neutre singulier avec πᾶν a une valeur globale (« rien »). Dans ce contexte de pureté, κοινός désigne ce qui est impur, profané ou souillé; « souillé » conserve la portée cultuelle et morale sans réduire le terme à l’impureté rituelle.
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: personne qui pratique ce qui est abominable ou mensonger
  rationale: Le participe substantivé désigne une personne caractérisée par sa conduite. « Pratique » rend l’action suivie; « abominable » garde la forte valeur de βδέλυγμα, et « mensonger » exprime ψεῦδος en français idiomatique. « Ou » présente naturellement les deux catégories coordonnées sans exiger qu’elles soient toujours réunies chez la même personne.
- source_word: εἰ μὴ
  choice: mais seulement
  rationale: Dans cette opposition, εἰ μή introduit l’unique exception et se rend clairement par « mais seulement ».
- source_word: οἱ γεγραμμένοι
  choice: ceux qui sont inscrits
  rationale: Le participe parfait passif indique l’état résultant d’une inscription accomplie. La traduction n’ajoute pas explicitement « les noms », absent du grec.
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς
  choice: dans le livre de vie
  rationale: « Livre de vie » est une expression française établie et exacte dans ce contexte apocalyptique.
- source_word: τοῦ ἀρνίου
  choice: de l’Agneau
  rationale: Le génitif rattache le livre de vie à l’Agneau; la majuscule signale le titre christologique récurrent de l’Apocalypse.
theological_decisions:
- issue: Portée de l’exclusion de la Nouvelle Jérusalem
  choice: Le verset exclut à la fois toute chose souillée et toute personne caractérisée par des pratiques abominables ou mensongères.
  alternative: Comprendre le premier membre comme visant uniquement une impureté impersonnelle, puis le second comme visant séparément des personnes.
  rationale: Le grec passe du neutre πᾶν κοινόν au participe substantivé ποιῶν; la traduction maintient ces deux dimensions sans les confondre.
- issue: Objet implicite de l’inscription
  choice: Traduire « ceux qui sont inscrits » sans ajouter « dont les noms ».
  alternative: « ceux dont les noms sont inscrits »
  rationale: Le livre implique naturellement des noms, mais le mot « noms » n’apparaît pas dans ce verset; la formulation retenue respecte cette concision et laisse subsister l’implicite.
- issue: Coordination de βδέλυγμα et ψεῦδος
  choice: Employer « ou » pour présenter en français deux types distincts de pratique condamnée.
  alternative: « et mensonger » ou, plus littéralement, « qui pratique l’abomination et le mensonge »
  rationale: Le grec coordonne les deux objets par καί. Dans une proposition négative française visant toute personne relevant de l’une ou l’autre catégorie, « ou » communique naturellement la portée distributive sans affirmer que les deux pratiques doivent nécessairement être conjointes.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement grec tout en étant idiomatique. « Souillé » conserve la nuance de pureté et « inscrits » évite d’ajouter le mot « noms ».
