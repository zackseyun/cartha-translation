  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: fr
  text: Mais parce que je vous ai dit ces choses, la tristesse a rempli votre cœur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vos cœurs ». Le grec emploie « cœur » au singulier avec un possessif qui renvoie à plusieurs personnes, ce qui peut exprimer la tristesse intérieure commune au groupe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: La conjonction marque un contraste avec ce qui précède. « Mais » est le lien adversatif le plus naturel ici.
- source_word: ὅτι
  choice: parce que
  rationale: Dans ce contexte, ὅτι introduit la cause de la tristesse des disciples plutôt que le contenu d’une parole.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif pluriel renvoie aux sujets que Jésus vient d’aborder; la traduction conserve ce pluriel.
- source_word: λελάληκα ὑμῖν
  choice: je vous ai dit
  rationale: Le passé composé rend naturellement en français le parfait grec, qui présente une parole prononcée dont l’effet demeure. « Dire » convient idiomatiquement avec « ces choses ».
- source_word: ἡ λύπη
  choice: la tristesse
  rationale: λύπη désigne ici une profonde affliction. « Tristesse » est naturel, digne et adapté au contexte; « chagrin » serait également possible.
- source_word: πεπλήρωκεν
  choice: a rempli
  rationale: Cette traduction conserve l’image concrète de πληρόω ainsi que la valeur résultative du parfait.
- source_word: ὑμῶν τὴν καρδίαν
  choice: votre cœur
  rationale: Le grec associe un possessif pluriel à « cœur » au singulier. « Votre cœur » conserve ce singulier collectif et reste naturel en français.
theological_decisions:
- issue: Singulier collectif « cœur » ou pluriel distributif « cœurs »
  choice: votre cœur
  alternative: vos cœurs
  rationale: Le singulier grec peut présenter les disciples comme partageant un même état intérieur, sans exclure une application à chacun. Le texte principal préserve cette formulation, tandis que la note signale l’autre rendu français possible.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche du grec tout en restant naturelle; l’image de la tristesse qui remplit le cœur est conservée.
