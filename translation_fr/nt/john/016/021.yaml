revisions:
- from: Quand une femme accouche, elle éprouve de la tristesse, parce que son heure est venue. Mais quand elle a donné naissance à l’enfant, elle ne se souvient plus de la détresse, tant elle est heureuse qu’un être humain soit né dans le monde.[a]
  to: Quand une femme accouche, elle éprouve de la tristesse, parce que son heure est venue ; mais quand elle a donné naissance à l’enfant, elle ne se souvient plus de la détresse, à cause de la joie qu’elle éprouve du fait qu’un être humain[a] est né dans le monde.
  rationale: La révision remplace une tournure française qui obscurcissait la syntaxe et la valeur assertive du grec par une formulation causale explicite. Elle maintient tous les choix lexicaux principaux, conserve la distinction entre « l’enfant » et « un être humain », et place l’appel de note sur le mot auquel la variante se rapporte.
