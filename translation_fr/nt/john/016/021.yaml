source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: fr
  text: Quand une femme accouche, elle éprouve de la tristesse, parce que son heure est venue ; mais quand elle a donné naissance à l’enfant, elle ne se souvient plus de la détresse, à cause de la joie qu’elle éprouve du fait qu’un être humain[a] est né dans le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’un homme est né dans le monde ». Le grec ἄνθρωπος peut désigner un homme ou, plus généralement, un être humain ; ici, le terme ne précise pas le sexe de l’enfant.'
    reason: Alternative lexicale signalant la possibilité formelle de « homme » tout en indiquant que le contexte appelle un sens générique.
lexical_decisions:
- source_word: ἡ γυνή
  choice: une femme
  rationale: Dans cette comparaison générale sur l’accouchement, γυνή désigne naturellement une femme, et non spécifiquement une épouse.
- source_word: ὅταν τίκτῃ
  choice: quand une femme accouche
  rationale: Le présent avec ὅταν présente une situation générale en cours. « Accouche » est naturel en français et couvre le processus de la mise au monde.
- source_word: λύπην ἔχει
  choice: elle éprouve de la tristesse
  rationale: λύπη évoque la tristesse ou la peine, sans se limiter à la douleur physique; ce choix maintient aussi le contraste johannique entre tristesse et joie.
- source_word: ἡ ὥρα αὐτῆς
  choice: son heure
  rationale: La formulation conserve le mot « heure », qui désigne ici le moment venu de l’accouchement tout en gardant sa résonance particulière dans Jean.
- source_word: γεννήσῃ τὸ παιδίον
  choice: elle a donné naissance à l’enfant
  rationale: L’aoriste présente la naissance comme accomplie. « Donner naissance à » est une expression française courante et fidèle; παιδίον est rendu par « l’enfant ».
- source_word: οὐκέτι μνημονεύει τῆς θλίψεως
  choice: elle ne se souvient plus de la détresse
  rationale: La traduction suit directement μνημονεύει et rend θλῖψις par « détresse », terme qui évoque l’épreuve éprouvante sans introduire ici le sens technique de « tribulation ».
- source_word: διὰ τὴν χαράν
  choice: tant elle est heureuse
  rationale: διά avec l’accusatif exprime la cause. Cette tournure française idiomatique fait de la joie la raison pour laquelle la détresse n’est plus rappelée.
- source_word: ὅτι ἐγεννήθη
  choice: qu’un … soit né
  rationale: ὅτι introduit le motif ou le contenu de la joie. Après « être heureux que », le subjonctif est requis en français naturel, sans modifier la réalité affirmée de la naissance.
- source_word: ἄνθρωπος
  choice: un être humain
  rationale: 'ἄνθρωπος est ici générique: il désigne une nouvelle vie humaine, sans préciser que l’enfant est de sexe masculin. « Être humain » préserve cette portée et le passage lexical de παιδίον à ἄνθρωπος.'
- source_word: εἰς τὸν κόσμον
  choice: dans le monde
  rationale: La préposition εἰς marque l’entrée dans le monde; « naître dans le monde » est la tournure française naturelle correspondante.
theological_decisions:
- issue: Portée générique de ἄνθρωπος
  choice: un être humain
  alternative: un homme; un enfant; une personne
  rationale: Le nom est grammaticalement masculin, mais son emploi est générique dans cette image de la naissance. « Un être humain » évite d’impliquer un enfant mâle et conserve la nuance explicite d’une nouvelle vie humaine; une note signale la traduction traditionnelle possible.
- issue: Résonance de « son heure »
  choice: son heure
  alternative: son temps; le moment d’accoucher
  rationale: Le contexte indique le moment de l’accouchement, mais la traduction conserve l’expression littérale et sa possible résonance johannique sans l’expliquer dans le corps du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases favorise la lisibilité. « Son heure » conserve la formulation thématique de Jean, tandis que « tant elle est heureuse » rend idiomatiquement le rapport causal entre la joie et l’oubli de la détresse.
