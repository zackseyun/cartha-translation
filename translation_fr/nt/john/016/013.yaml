  variant: modern international French
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: fr
  text: Mais quand lui, l’Esprit de vérité, viendra, il vous conduira dans toute la vérité. En effet, il ne parlera pas de sa propre initiative[a], mais il dira tout ce qu’il entendra et il vous annoncera les choses à venir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « de lui-même » ; on peut aussi traduire : « de son propre chef ».'
    reason: La formulation littérale peut être comprise à tort en français comme signifiant qu’il ne parlera pas à son propre sujet ; la note conserve néanmoins la forme et l’ambiguïté de l’expression grecque.
lexical_decisions:
- source_word: ὅταν δὲ
  choice: Mais quand
  rationale: ὅταν introduit un événement futur attendu, tandis que δέ marque ici une légère transition contrastive avec le contexte précédent.
- source_word: ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας
  choice: quand il viendra, lui, l’Esprit de vérité
  rationale: Le futur français exprime naturellement l’aoriste subjonctif après ὅταν. Le tour disloqué avec « lui » conserve l’insistance personnelle de ἐκεῖνος et présente clairement « l’Esprit de vérité » en apposition.
- source_word: ὁδηγήσει ὑμᾶς ἐν τῇ ἀληθείᾳ πάσῃ
  choice: il vous conduira dans toute la vérité
  rationale: '« Conduire dans » rend naturellement en français la métaphore de ὁδηγέω avec ἐν, sans effacer la valeur locative possible de la préposition. L’article de ἀληθείᾳ est conservé : il s’agit de « toute la vérité », non de vérités prises une à une.'
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: En effet, il ne parlera pas de sa propre initiative
  rationale: γάρ donne la raison de l’affirmation précédente. « De sa propre initiative » communique la provenance autonome niée par ἀφ’ ἑαυτοῦ et évite que « parler de lui-même » soit compris en français comme « parler à son propre sujet ».
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: mais il dira tout ce qu’il entendra
  rationale: Le futur « entendra » respecte ἀκούσει et maintient l’ordre logique de réception puis de proclamation. « Dira » est plus naturel ici que la répétition de « parlera ».
- source_word: τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν
  choice: il vous annoncera les choses à venir
  rationale: « Les choses à venir » rend sobrement le participe substantivé τὰ ἐρχόμενα, tandis qu’« annoncera » conserve le sens déclaratif de ἀναγγελεῖ.
theological_decisions:
- issue: Référence personnelle à l’Esprit
  choice: Employer le pronom masculin « il » et le pronom tonique « lui »
  alternative: Éviter tout pronom en répétant « l’Esprit »
  rationale: Bien que πνεῦμα soit grammaticalement neutre en grec, le texte emploie le démonstratif masculin ἐκεῖνος. Le français « Esprit » est en outre masculin ; cette formulation suit donc la référence personnelle du texte sans ajout doctrinal.
- issue: Sens de ἐν τῇ ἀληθείᾳ πάσῃ
  choice: « dans toute la vérité »
  alternative: « vers toute la vérité »
  rationale: « Dans » préserve la valeur ordinaire de ἐν tout en restant idiomatique avec « conduire ». « Vers » accentuerait davantage une direction que ne l’exige explicitement la préposition.
- issue: Dépendance exprimée par ἀφ’ ἑαυτοῦ
  choice: « de sa propre initiative »
  alternative: « de lui-même »
  rationale: Le choix principal exprime que l’Esprit ne parle pas indépendamment, sans préciser davantage la nature théologique de cette dépendance. La traduction plus littérale est signalée en note.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe met en relief l’identité de celui qui vient sans reproduire une apposition grecque maladroite en français. Le vocabulaire reste sobre et évite des formulations confessionnelles spécialisées.
