revisions:
- from: Tout ce que le Père a est à moi. Voilà pourquoi j’ai dit qu’il prend de ce qui est à moi[a] et qu’il vous l’annoncera.
  to: Tout ce que le Père a est à moi. C’est pourquoi j’ai dit qu’il prend de ce qui est à moi et qu’il vous le fera connaître[a].
  rationale: La révision supprime l’objet artificiellement introduit avec « annoncer » et emploie « faire connaître », tournure française naturelle qui rend la fonction révélatrice de ἀναγγελεῖ. Le pronom « le » de « vous le fera connaître » renvoie de façon souple à « ce qui est à moi », sans déterminer plus précisément que ne le fait le grec. La note est déplacée en fin de proposition afin que son ancrage porte clairement sur l’alternative « prend/reçoit » tout en conservant la phrase complète et sa syntaxe française.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:07:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend correctement les éléments essentiels du grec : la portée totale de πάντα ὅσα, la possession commune exprimée par ἐμά ἐστιν, le lien explicatif διὰ τοῦτο, le présent λαμβάνει et le futur ἀναγγελεῖ. Toutefois, le pronom objet « l’ » dans « il vous l’annoncera » n’a pas de correspondant explicite en grec et peut faire croire que l’Esprit annoncera une chose déterminée plutôt qu’il ne fera connaître ce qu’il reçoit.'
  naturalness: La formulation est fluide et relève d’un français international moderne. « Voilà pourquoi » est naturel, mais « C’est pourquoi » est légèrement plus sobre dans ce discours solennel. « Il vous annoncera » est moins idiomatique et plus ambigu en français que « il vous le fera connaître », qui rend bien la valeur révélatrice de ἀναγγελεῖ sans ajouter d’objet absent du grec.
  terminology: '« Le Père » et « à moi » sont justes et cohérents avec le registre johannique. Pour ἀναγγελεῖ, « fera connaître » est préférable à « annoncera » : le verbe français annoncer appelle habituellement un contenu explicite et peut évoquer une simple proclamation, tandis que le grec porte ici l’idée de communiquer ou révéler aux disciples. La note sur « reçoit » préserve adéquatement l’alternative lexicale de λαμβάνει.'
  issues:
  - severity: medium
    issue: Objet pronominal ajouté dans « il vous l’annoncera »
    rationale: Le grec ἀναγγελεῖ ὑμῖν ne comporte aucun pronom objet exprimé. L’ajout de « l’ » anticipe et spécifie un objet qui reste implicite dans la formulation grecque. Une formulation sans objet explicite préserve mieux cette construction.
  - severity: low
    issue: « annoncera » est moins naturel dans cette construction française
    rationale: Sans complément explicite, « il vous annoncera » sonne incomplet ou ambigu. « Il vous le fera connaître » est idiomatique, garde le futur et correspond au sens de communication révélatrice de ἀναγγέλλω.
  revised_text: Tout ce que le Père a est à moi. C’est pourquoi j’ai dit qu’il prend de ce qui est à moi et qu’il vous le fera connaître[a].
  revised_footnotes:
  - marker: a
    text: Ou « qu’il reçoit de ce qui est à moi et vous le fera connaître ».
    reason: « Reçoit » est une autre traduction possible de λαμβάνει ; le grec peut évoquer l’action de prendre ou de recevoir.
  revision_rationale: La révision supprime l’objet artificiellement introduit avec « annoncer » et emploie « faire connaître », tournure française naturelle qui rend la fonction révélatrice de ἀναγγελεῖ. Le pronom « le » de « vous le fera connaître » renvoie de façon souple à « ce qui est à moi », sans déterminer plus précisément que ne le fait le grec. La note est déplacée en fin de proposition afin que son ancrage porte clairement sur l’alternative « prend/reçoit » tout en conservant la phrase complète et sa syntaxe française.
