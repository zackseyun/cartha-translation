  variant: modern international French
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: fr
  text: Tout ce que le Père a est à moi. C’est pourquoi j’ai dit qu’il prend de ce qui est à moi et qu’il vous le fera connaître[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il reçoit de ce qui est à moi et vous le fera connaître ».
    reason: « Reçoit » est une autre traduction possible de λαμβάνει ; le grec peut évoquer l’action de prendre ou de recevoir.
lexical_decisions:
- source_word: πάντα ὅσα
  choice: Tout ce que
  rationale: Cette tournure française naturelle conserve la portée globale et appuyée de l’expression grecque.
- source_word: ἔχει
  choice: a
  rationale: Le présent simple rend directement ἔχει sans alourdir la phrase par « possède ».
- source_word: ὁ πατήρ
  choice: le Père
  rationale: Dans ce contexte johannique, il s’agit de Dieu désigné comme Père; la majuscule signale cet emploi titulaire.
- source_word: ἐμά ἐστιν
  choice: est à moi
  rationale: Cette formulation idiomatique exprime directement la valeur possessive du pluriel neutre grec et maintient la force de l’affirmation.
- source_word: διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Ce connecteur courant en français moderne restitue clairement la relation explicative et déductive.
- source_word: εἶπον
  choice: j’ai dit
  rationale: Le passé composé est ici la forme narrative naturelle en français pour renvoyer à une parole antérieure encore pertinente.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: de ce qui est à moi
  rationale: La formulation explicite naturellement l’expression grecque elliptique tout en conservant l’idée de provenance.
- source_word: λαμβάνει
  choice: prend
  rationale: « Prend » conserve le présent grec et la valeur possible de λαμβάνω avec ἐκ indiquant la source. « Reçoit » demeure une possibilité lexicale pertinente, signalée en note.
- source_word: ἀναγγελεῖ
  choice: annoncera
  rationale: Le futur est conservé; « annoncera » exprime la communication révélatrice sans ajouter une idée absente du grec.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom indirect rend naturellement le datif adressé aux disciples.
theological_decisions:
- issue: Rapport entre ce que possède le Père et le Fils
  choice: Tout ce que le Père a est à moi
  alternative: Tout ce que le Père a m’appartient
  rationale: La formulation préserve la forte affirmation selon laquelle tout ce que le Père a est aussi au Fils, sans introduire de terminologie doctrinale postérieure au texte.
- issue: Réception par l’Esprit de ce qui appartient au Fils
  choice: il prend de ce qui est à moi
  alternative: il reçoit de ce qui est à moi
  rationale: Le grec permet les nuances de « prendre » et de « recevoir ». Le texte principal retient la première sans résoudre silencieusement la nuance théologique; l’autre possibilité figure en note.
translation_notes:
  register: Français international moderne, clair et digne. La reprise de « est à moi » maintient le lien verbal entre les deux propositions, tandis que la coordination « et qu’il » évite toute ambiguïté syntaxique.
