id: JHN.16.2
reference: John 16:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: fr
  text: Ils vous excluront des synagogues[a]. Bien plus, l’heure vient où quiconque vous tuera pensera rendre un culte à Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous chasseront de la synagogue » ou « feront de vous des exclus des synagogues ».
    reason: lexical_alternative
  - marker: b
    text: Ou « pensera offrir un service religieux à Dieu » ou « accomplir un acte de culte à Dieu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: Ils vous excluront des synagogues
  rationale: L’adjectif ἀποσυνάγωγος désigne l’exclusion de la communauté synagogale, et ποιέω avec un attribut exprime ici le fait de rendre quelqu’un tel. Cette formulation française naturelle restitue clairement l’expulsion sociale et religieuse tout en conservant le pluriel du texte grec.
- source_word: ἀλλ’
  choice: Bien plus
  rationale: 'Dans ce contexte, ἀλλά introduit une aggravation plutôt qu’une simple opposition : après l’exclusion vient la mise à mort. « Bien plus » rend cette progression avec naturel.'
- source_word: ἔρχεται ὥρα ἵνα
  choice: l’heure vient où
  rationale: Cette tournure conserve l’image johannique de l’« heure » et rend idiomatiquement ἵνα, qui introduit ici ce qui caractérisera cette heure.
- source_word: πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: quiconque vous tuera
  rationale: Le participe substantivé avec πᾶς a une portée générale. « Quiconque » exprime cette universalité sans alourdir la phrase.
- source_word: δόξῃ
  choice: pensera
  rationale: Le verbe δοκέω exprime ici la conviction subjective des persécuteurs, non la réalité ni l’approbation divine.
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: rendre un culte à Dieu
  rationale: λατρεία désigne un service religieux ou cultuel, tandis que προσφέρειν évoque ce qui est présenté ou rendu à Dieu. « Rendre un culte à Dieu » est une expression française naturelle qui conserve la portée religieuse et l’ironie saisissante de l’énoncé.
theological_decisions:
- issue: La manière de présenter la conviction religieuse des persécuteurs
  choice: pensera rendre un culte à Dieu
  alternative: pensera offrir un service à Dieu
  rationale: Le texte décrit leur propre interprétation de leur acte, sans la valider. « Rendre un culte » conserve la dimension cultuelle de λατρεία et laisse intacte la tension selon laquelle un meurtre peut être pris, à tort, pour un acte de dévotion.
- issue: La portée générique de πᾶς ὁ ἀποκτείνας
  choice: quiconque vous tuera
  alternative: toute personne qui vous tuera
  rationale: « Quiconque » restitue la portée universelle de la construction grecque sans ajouter de précision de genre que le français n’exige pas ici.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation privilégie la clarté orale sans effacer l’idiome johannique de « l’heure » ni la nuance cultuelle de λατρεία.
