id: JHN.16.22
reference: John 16:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: fr
  text: 'Ainsi, vous aussi, vous êtes maintenant dans la tristesse. Mais je vous reverrai[a] : votre cœur se réjouira, et personne ne vous enlèvera votre joie.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je vous verrai de nouveau ». Cette formulation peut souligner l’initiative de Jésus lorsqu’il revient auprès de ses disciples.'
    reason: Le verbe français « revoir » est naturel, mais la note explicite la construction grecque et sa nuance possible.
lexical_decisions:
- source_word: οὖν
  choice: Ainsi
  rationale: Marque l’application de l’image de l’accouchement qui précède et assure naturellement le lien logique en français.
- source_word: νῦν μὲν λύπην ἔχετε
  choice: vous êtes maintenant dans la tristesse
  rationale: Rend l’état présent exprimé par ἔχετε avec une tournure française naturelle; le contraste porté par μέν est repris par « Mais ».
- source_word: πάλιν δὲ
  choice: Mais je vous reverrai
  rationale: « Mais » exprime le contraste avec la tristesse présente, tandis que le préfixe re- de « reverrai » rend πάλιν.
- source_word: ὄψομαι ὑμᾶς
  choice: je vous reverrai
  rationale: Conserve clairement le sujet à la première personne et l’objet à la deuxième personne du grec, sans harmonisation avec Jean 16.16.
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: votre cœur se réjouira
  rationale: Tournure idiomatique qui préserve le langage du cœur et la valeur verbale future de χαρήσεται.
- source_word: τὴν χαρὰν ὑμῶν
  choice: votre joie
  rationale: Rendu possessif direct qui maintient le lien lexical avec « se réjouira ».
- source_word: οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: personne ne vous enlèvera votre joie
  rationale: Le futur français explicite la portée future donnée par le contexte à ce présent grec; « enlever à quelqu’un » rend naturellement αἴρει ἀφ’ ὑμῶν.
theological_decisions:
- issue: Sujet et orientation de la rencontre future
  choice: je vous reverrai
  alternative: vous me reverrez
  rationale: Le grec fait sans ambiguïté de Jésus le sujet de ὄψομαι et des disciples l’objet. Ce rendu préserve son initiative sans harmoniser la formulation avec le contexte proche.
translation_notes:
  register: 'Français international moderne, digne et accessible. La ponctuation met en relief le passage de la tristesse à la joie. Le tutoiement collectif n’est pas employé : « vous » correspond naturellement au pluriel grec.'
