  text: περὶ ἁμαρτίας μέν, ὅτι οὐ πιστεύουσιν εἰς ἐμέ·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/009.yaml
  text: concerning sin[a], because they do not believe in me;
translation:
  language: fr
  text: au sujet du péché, parce qu’ils ne croient pas en moi ;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ
  choice: au sujet de
  rationale: Avec le génitif, περί introduit ici le domaine sur lequel porte l’action de l’Esprit. « Au sujet de » est naturel en français moderne et permet de conserver le parallélisme avec les versets 10–11.
- source_word: ἁμαρτίας
  choice: péché
  rationale: Le nom abstrait au singulier désigne la catégorie du péché, sans être développé en « état de péché » ni en actes particuliers.
- source_word: μέν
  choice: —
  rationale: μέν signale le premier élément d’une série poursuivie aux versets 10–11. Une traduction explicite comme « d’une part » serait lourde ici ; la structure parallèle suffit à rendre sa fonction discursive.
- source_word: ὅτι
  choice: parce que
  rationale: ὅτι introduit l’explication ou le motif du péché dont il vient d’être question. « Parce que » exprime clairement cette force causale tout en maintenant le lien direct avec l’incrédulité envers Jésus.
- source_word: οὐ πιστεύουσιν
  choice: ils ne croient pas
  rationale: Le présent actif de πιστεύω décrit la réalité actuelle de leur non-foi. « Croire » est le terme français courant et approprié dans ce contexte.
- source_word: εἰς ἐμέ
  choice: en moi
  rationale: La construction johannique πιστεύω εἰς exprime une foi personnellement dirigée vers Jésus. L’expression idiomatique française est « croire en moi ».
theological_decisions:
- issue: Nature du péché désigné dans ce verset
  choice: Le verset relie directement le péché, dans ce contexte, au fait de ne pas croire en Jésus.
  alternative: Comprendre le péché comme la condition pécheresse humaine en général, l’incrédulité n’en étant qu’un exemple.
  rationale: La proposition introduite par ὅτι explique directement « au sujet du péché ». La traduction garde ce lien sans élargir l’énoncé à une formulation doctrinale que le verset n’explicite pas.
translation_notes:
  register: Français international moderne, simple et digne. Le segment étant syntaxiquement rattaché au verset précédent et suivi par les éléments parallèles des versets 10–11, il commence par une minuscule et se termine par un point-virgule.
