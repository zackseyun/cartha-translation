  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: fr
  text: Encore un peu de temps[a], et vous ne me verrez plus ; puis encore un peu de temps, et vous me verrez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici deux verbes différents pour « voir » : θεωρέω dans la première proposition et ὁράω dans la seconde. Cette variation peut comporter une nuance, mais les deux sont rendus par « voir », car le contraste principal du verset est temporel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: un peu de temps
  rationale: L’adjectif neutre singulier est employé adverbialement pour désigner une courte durée. « Un peu de temps » est naturel en français et conserve la brièveté temporelle sans paraphraser par « bientôt ».
- source_word: οὐκέτι
  choice: ne… plus
  rationale: Cette tournure idiomatique exprime clairement la cessation à partir du moment envisagé.
- source_word: θεωρεῖτέ
  choice: verrez
  rationale: Bien que θεωρέω puisse évoquer le fait de regarder ou d’observer, « voir » convient naturellement ici et évite d’accentuer artificiellement sa différence avec ὁράω.
- source_word: πάλιν
  choice: puis encore
  rationale: πάλιν introduit ici le retour ultérieur de la situation. Avec le second « un peu de temps », « puis encore » rend clairement la succession tout en maintenant la répétition.
- source_word: ὄψεσθέ
  choice: vous me verrez
  rationale: Le futur de ὁράω désigne naturellement une vision à venir. Employer également « voir » préserve le parallélisme sans imposer une distinction sémantique incertaine.
- source_word: με
  choice: me
  rationale: Pronom objet direct renvoyant à Jésus, rendu sans ambiguïté par « me ».
- source_word: καὶ
  choice: et / puis
  rationale: Les occurrences de καί structurent deux propositions parallèles. « Et » conserve la coordination initiale, tandis que « puis » rend naturellement en français la progression temporelle de la seconde.
theological_decisions:
- issue: Faut-il distinguer θεωρέω et ὁράω par deux verbes français afin de suggérer deux modes de vision ?
  choice: Rendre les deux verbes par « voir » dans le texte principal.
  alternative: « vous ne me contemplerez plus… vous me verrez » ou « vous ne me verrez plus… vous me contemplerez »
  rationale: Les deux verbes grecs ont ici un fort chevauchement sémantique. Leur imposer une distinction théologique précise en français irait au-delà de ce que le verset établit ; le contraste explicitement marqué est avant tout temporel.
translation_notes:
  register: Français moderne, international et digne. La répétition « un peu de temps » conserve le rythme énigmatique de la parole de Jésus ; le futur français est requis dans la première proposition là où le grec emploie un présent à valeur prospective.
