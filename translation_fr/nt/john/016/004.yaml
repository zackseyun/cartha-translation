revisions:
- from: Mais je vous ai dit ces choses afin que, lorsque leur heure viendra, vous vous souveniez que je vous en avais parlé.[a] Je ne vous ai pas dit ces choses dès le commencement, parce que j’étais avec vous.
  to: 'Mais je vous ai dit ces choses afin que, lorsque leur heure viendra, vous vous en souveniez : je vous l’ai dit. Mais je ne vous ai pas dit ces choses dès le commencement, parce que j’étais avec vous.'
  rationale: La révision conserve l’ambiguïté des deux occurrences de αὐτῶν sans transformer explicitement le second en complément de « parler de ». Elle remplace le plus-que-parfait par le passé composé, ajoute le connecteur de la seconde phrase et corrige la formulation de la note. Les deux-points rendent naturellement en français le contenu rappelé après « vous vous en souveniez », tout en signalant la liaison difficile du grec.
