source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: fr
  text: 'Mais je vous ai dit ces choses afin que, lorsque leur heure viendra, vous vous en souveniez : je vous l’ai dit. Mais je ne vous ai pas dit ces choses dès le commencement, parce que j’étais avec vous.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λελάληκα
  choice: je vous ai dit
  rationale: Le parfait grec présente une parole déjà prononcée qui demeure pertinente. Le passé composé est naturel en français et garde cette portée dans le contexte.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif pluriel renvoie aux avertissements précédents. « Ces choses » conserve le pluriel sans préciser davantage leur contenu.
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure exprime clairement le but tout en convenant au registre digne du discours.
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: lorsque leur heure viendra
  rationale: La construction désigne une éventualité future, et « heure » conserve la notion johannique d’un moment fixé sans remplacer celle-ci par une interprétation.
- source_word: μνημονεύητε αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν
  choice: vous vous souveniez que je vous en avais parlé
  rationale: « En » rend discrètement le second αὐτῶν et produit une phrase française naturelle. Le plus-que-parfait situe justement la parole antérieure de Jésus par rapport à l’heure future évoquée.
- source_word: ἐξ ἀρχῆς
  choice: dès le commencement
  rationale: Cette expression garde l’idée temporelle d’un point de départ. « Dès le commencement » est idiomatique et légèrement plus direct que « depuis le commencement » après une négation.
- source_word: μεθ’ ὑμῶν ἤμην
  choice: j’étais avec vous
  rationale: Rendu direct de la relation de présence exprimée par le grec.
theological_decisions:
- issue: Référent et double emploi de αὐτῶν
  choice: Le premier pronom est conservé par « leur heure » et le second est représenté par « en » dans « je vous en avais parlé ».
  alternative: 'Traduire plus explicitement : « vous vous souveniez d’elles, que je vous l’avais dit », ou ne rendre ouvertement que le premier pronom.'
  rationale: Le texte grec de la SBLGNT comporte deux occurrences de αὐτῶν, dont le référent et l’enchaînement syntaxique ne sont pas entièrement transparents. La formulation retenue garde les deux sans imposer comme certain que le pronom désigne les personnes hostiles, les persécutions ou les événements annoncés.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « je vous ai dit ces choses » est conservée pour refléter la structure du verset. « Leur heure » maintient l’expression volontairement ouverte du grec, tandis que « en avais parlé » évite une formulation française lourde sans effacer le second pronom.
