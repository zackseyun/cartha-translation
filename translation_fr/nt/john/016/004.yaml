review_pass:
  verdict: revise
  source_fidelity: La traduction rend correctement le parfait de λελάληκα, le but introduit par ἵνα, l’éventualité future de ὅταν, ainsi que la présence exprimée par μεθ’ ὑμῶν. « Leur heure » préserve utilement l’ambiguïté du premier αὐτῶν. Toutefois, le second αὐτῶν suit μνημονεύητε dans le grec ; le faire porter sur « je vous en avais parlé » est une réorganisation interprétative possible, mais moins proche de la syntaxe source. Le plus-que-parfait n’est pas requis par l’aoriste εἶπον et affaiblit la correspondance verbale.
  naturalness: Le français est globalement clair et moderne. « Mais je ne vous ai pas dit » restitue mieux le δέ de la seconde phrase que l’absence de connecteur. La note actuelle contient une formulation française maladroite et syntaxiquement défectueuse (« vous vous souveniez d’elles, que moi, je vous l’avais dit »).
  terminology: « Ces choses », « afin que », « leur heure », « dès le commencement » et « avec vous » conviennent au registre et ne surinterprètent pas le texte. Une formulation principale qui rend le second pronom par « vous en souveniez » est à la fois plus proche de sa position grecque et naturelle, sans fixer son référent.
  issues:
  - severity: medium
    issue: Le second αὐτῶν est déplacé vers « je vous en avais parlé » et εἶπον est rendu par un plus-que-parfait.
    rationale: Dans le texte SBLGNT, αὐτῶν dépend immédiatement de μνημονεύητε. Le français peut le rendre naturellement par « vous en souveniez ». Le passé composé « je vous l’ai dit » restitue plus directement l’aoriste et la parole antérieure sans imposer un repérage au plus-que-parfait.
  - severity: medium
    issue: La note propose une paraphrase littérale grammaticalement défectueuse.
    rationale: « Vous vous souveniez d’elles, que moi, je vous l’avais dit » ne forme pas une construction française recevable et ne clarifie pas de façon fiable la difficulté syntaxique.
  - severity: low
    issue: Le connecteur δέ de la seconde phrase n’est pas rendu.
    rationale: « Mais » maintient la progression adversative ou corrective du discours, comme dans la première phrase.
  revised_text: 'Mais je vous ai dit ces choses afin que, lorsque leur heure viendra, vous vous en souveniez : je vous l’ai dit. Mais je ne vous ai pas dit ces choses dès le commencement, parce que j’étais avec vous.'
  revised_footnotes:
  - marker: a
    text: 'Plus littéralement : « lorsque leur heure viendra, vous vous souveniez d’eux/d’elles, que moi, je vous ai dit ». Le grec emploie deux fois αὐτῶν (« leur ; d’eux/d’elles »). Le référent du pronom et le lien exact entre le second pronom et la proposition qui suit sont discutés ; la traduction principale conserve cette indétermination par « leur heure » et « vous en souveniez ».'
    reason: Variante de traduction et ambiguïté syntaxique du texte grec.
  revision_rationale: La révision conserve l’ambiguïté des deux occurrences de αὐτῶν sans transformer explicitement le second en complément de « parler de ». Elle remplace le plus-que-parfait par le passé composé, ajoute le connecteur de la seconde phrase et corrige la formulation de la note. Les deux-points rendent naturellement en français le contenu rappelé après « vous vous en souveniez », tout en signalant la liaison difficile du grec.
