  text: περὶ δὲ κρίσεως, ὅτι ὁ ἄρχων τοῦ κόσμου τούτου κέκριται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/011.yaml
  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: fr
  text: et en ce qui concerne le jugement, parce que le dirigeant de ce monde[a][b] a été jugé[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prince de ce monde ».
    reason: lexical_alternative
  - marker: b
    text: Cette expression désigne probablement Satan ; comparer Jean 12.31 et 14.30.
    reason: cross_reference
  - marker: c
    text: Le parfait grec souligne un jugement accompli dont l’effet demeure.
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: et en ce qui concerne le jugement
  rationale: περί avec le génitif introduit le sujet (« en ce qui concerne ») ; δέ assure ici la liaison avec la série précédente et se rend naturellement par « et ». « Jugement » conserve le terme clé de la séquence « péché… justice… jugement ».
- source_word: ὅτι
  choice: parce que
  rationale: 'Dans cette proposition explicative, ὅτι exprime la cause : le jugement est mis en évidence parce que le dirigeant de ce monde a été jugé.'
- source_word: ὁ ἄρχων
  choice: le dirigeant
  rationale: ἄρχων désigne celui qui gouverne ou exerce une autorité. « Dirigeant » est clair en français moderne et évite la possible connotation de filiation royale attachée à « prince ».
- source_word: τοῦ κόσμου τούτου
  choice: de ce monde
  rationale: « Monde » est le rendu johannique naturel de κόσμος et conserve la formulation exacte sans la remplacer par l’interprétation « époque ».
- source_word: κέκριται
  choice: a été jugé
  rationale: Le parfait passif de κρίνω indique un jugement accompli dont l’effet demeure. « A été jugé » préserve la voix passive et l’étendue lexicale, sans préciser davantage « condamné ».
theological_decisions:
- issue: Identité du « dirigeant de ce monde »
  choice: Conserver le titre sans nommer Satan dans le texte principal.
  alternative: « Satan, le dirigeant de ce monde »
  rationale: Le contexte johannique conduit couramment à identifier ce dirigeant à Satan, mais le verset emploie un titre plutôt qu’un nom propre. La note donne l’identification probable sans l’insérer dans le texte.
- issue: Portée de κέκριται
  choice: « a été jugé »
  alternative: « a été condamné » ou « demeure condamné »
  rationale: « Jugé » respecte la gamme de sens de κρίνω et l’ambiguïté formelle du texte. La condamnation peut être impliquée par le contexte, mais elle n’est pas explicitée lexicalement.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste proche de la structure grecque tout en étant idiomatique ; les notes préservent les variantes lexicales et la valeur résultative du parfait.
