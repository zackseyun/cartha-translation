id: JHN.16.24
reference: John 16:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: fr
  text: Jusqu’à présent, vous n’avez rien demandé en mon nom[a]. Demandez, et vous recevrez[b], afin que votre joie soit complète.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « en mon nom » peut désigner une demande faite en relation avec la personne, l’autorité et la mission de Jésus; elle n’est pas limitée ici à une seule explication.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Continuez à demander, et vous recevrez. » L’impératif présent peut évoquer, dans ce contexte, une action continue ou répétée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: Jusqu’à présent
  rationale: Cette tournure française naturelle marque la période allant jusqu’au moment où Jésus parle.
- source_word: ᾐτήσατε οὐδὲν
  choice: vous n’avez rien demandé
  rationale: Le passé composé convient à la construction temporelle avec « jusqu’à présent » et rend clairement l’idée de présenter une demande.
- source_word: ἐν τῷ ὀνόματί μου
  choice: en mon nom
  rationale: La formulation littérale et consacrée préserve toute la richesse johannique du rapport à la personne, à l’autorité et à la mission de Jésus.
- source_word: αἰτεῖτε
  choice: Demandez
  rationale: L’impératif présent est rendu naturellement sans imposer une valeur ponctuelle ou répétée; cette dernière possibilité est signalée en note.
- source_word: λήμψεσθε
  choice: vous recevrez
  rationale: Le futur exprime directement la réponse promise à la demande.
- source_word: ἵνα
  choice: afin que
  rationale: Cette conjonction française, claire et digne, conserve la nuance de but ou de résultat.
- source_word: ᾖ πεπληρωμένη
  choice: soit complète
  rationale: Le parfait périphrastique décrit une joie parvenue à sa pleine mesure; « complète » est idiomatique en français et conserve l’idée d’accomplissement.
theological_decisions:
- issue: Sens de la demande faite « en mon nom »
  choice: Conserver « en mon nom » sans explicitation dans le texte principal.
  alternative: de ma part; sous mon autorité; en union avec moi
  rationale: L’expression est théologiquement riche et ne doit pas être réduite à une seule de ses dimensions.
- issue: Valeur de l’impératif présent αἰτεῖτε
  choice: Employer l’impératif simple « Demandez » et signaler en note la possibilité d’une action continue ou répétée.
  alternative: Continuez à demander
  rationale: Le contexte peut autoriser une lecture itérative, mais l’aspect présent ne suffit pas à l’imposer; le texte principal préserve donc l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement pluriel correspond aux disciples auxquels Jésus s’adresse. La phrase conserve l’expression théologiquement ouverte « en mon nom » et rend l’image de plénitude par l’idiome français « joie complète ».
