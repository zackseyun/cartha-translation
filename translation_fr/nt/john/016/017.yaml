source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: fr
  text: 'Quelques-uns de ses disciples se dirent donc les uns aux autres : « Que signifie ce qu’il nous dit : “Un peu de temps, et vous ne me verrez pas ; puis encore un peu de temps, et vous me verrez” ? Et aussi : “Parce que je vais vers le Père”[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Que je vais vers le Père. » La conjonction grecque peut introduire le contenu cité ou avoir un sens causal (« parce que »).'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la suite logique et narrative de la parole précédente, dans un français naturel.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: quelques-uns de ses disciples
  rationale: La construction partitive désigne une partie des disciples, non nécessairement l’ensemble du groupe.
- source_word: πρὸς ἀλλήλους
  choice: les uns aux autres
  rationale: Rend directement l’expression réciproque et convient au registre narratif.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: Que veut-il nous dire par là
  rationale: Formulation française idiomatique exprimant la perplexité des disciples sans préciser la signification de la parole.
- source_word: Μικρὸν
  choice: encore un peu de temps
  rationale: Le mot est employé temporellement dans le contexte ; « de temps » explicite naturellement cette valeur en français.
- source_word: θεωρεῖτέ με
  choice: vous ne me verrez plus
  rationale: « Voir » rend le sens perceptif ; « plus » exprime naturellement en français la négation suivant la situation présente.
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: puis encore un peu de temps, et vous me verrez
  rationale: Préserve la répétition temporelle et le parallélisme, tout en rendant πάλιν par une reprise naturelle.
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: Parce que je vais vers le Père
  rationale: Conserve la valeur causale possible de ὅτι et rend πρὸς par « vers », sans harmoniser « le Père » en « mon Père ».
theological_decisions:
- issue: Référent du départ et du retour de Jésus
  choice: Ne pas préciser l’événement auquel Jésus fait allusion
  alternative: La mort et la résurrection ; l’ascension et la présence spirituelle ; les apparitions après la résurrection
  rationale: Le verset met en scène l’incompréhension des disciples et ne tranche pas lui-même entre ces interprétations.
- issue: Fonction de ὅτι dans la dernière citation
  choice: 'Valeur causale : « Parce que »'
  alternative: 'Conjonction introduisant le contenu : « Que je vais vers le Père »'
  rationale: La valeur causale est possible et correspond à la formulation antérieure, mais l’ambiguïté grammaticale réelle est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours direct garde la répétition énigmatique de Jésus et la perplexité des disciples. La distinction entre θεωρέω et ὁράω n’est pas artificiellement marquée, les deux étant rendus par « voir » afin de préserver le parallélisme en français.
