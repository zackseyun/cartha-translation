  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: fr
  text: J’ai encore beaucoup de choses à vous dire, mais vous ne pouvez pas les supporter[a] pour l’instant.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les porter ». Le verbe grec peut évoquer le fait de porter une charge ou de supporter quelque chose.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι
  choice: encore
  rationale: Exprime la continuité et indique que Jésus a d’autres enseignements à communiquer.
- source_word: πολλὰ
  choice: beaucoup de choses
  rationale: L’adjectif neutre pluriel est substantivé; cette formulation explicite naturellement son sens en français.
- source_word: ἔχω ὑμῖν λέγειν
  choice: j’ai … à vous dire
  rationale: La tournure française « avoir à dire » restitue naturellement la construction grecque et conserve le destinataire exprimé par ὑμῖν.
- source_word: οὐ δύνασθε
  choice: vous ne pouvez pas
  rationale: Rend directement et idiomatiquement l’incapacité exprimée par δύνασθε.
- source_word: βαστάζειν
  choice: les porter
  rationale: Conserve l’image du poids à porter sans réduire le sens à la seule compréhension intellectuelle ni à la seule endurance émotionnelle.
- source_word: ἄρτι
  choice: maintenant
  rationale: Marque l’incapacité présente, en contraste avec la suite du discours.
theological_decisions:
- issue: Nature de l’incapacité présente des disciples exprimée par βαστάζειν
  choice: Ils ne peuvent pas encore « porter » ces choses.
  alternative: Ils ne peuvent pas encore les comprendre pleinement ou en supporter l’annonce.
  rationale: Le verbe peut évoquer le fait de porter ou de supporter. Maintenir la métaphore préserve la tension entre capacité intellectuelle, spirituelle et émotionnelle.
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve la métaphore grecque de βαστάζειν; le pronom « les » reprend naturellement « beaucoup de choses ».
