  text: ἔλεγον οὖν· ⸂Τί ἐστιν τοῦτο⸃ ὃ ⸀λέγει μικρόν; οὐκ οἴδαμεν τί λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/018.yaml
  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: fr
  text: 'Ils disaient donc : « Que signifie ce qu’il dit : “Un peu de temps” ? Nous ne savons pas de quoi il parle. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: Ils disaient
  rationale: L’imparfait grec présente leur parole comme en cours ou répétée. L’imparfait français en conserve naturellement l’aspect sans ajouter explicitement « entre eux ».
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la conséquence ou la continuation du raisonnement suscité par les paroles précédentes de Jésus.
- source_word: Τί ἐστιν τοῦτο ὃ λέγει μικρόν
  choice: 'Que signifie ce qu’il dit : “Un peu de temps” ?'
  rationale: Cette formulation française rend clairement leur interrogation sur l’expression précise employée par Jésus. « Que signifie » explicite idiomatiquement la portée de Τί ἐστιν τοῦτο sans résoudre leur incompréhension.
- source_word: μικρόν
  choice: Un peu de temps
  rationale: Dans ce contexte, le mot désigne elliptiquement un court laps de temps. Cette traduction reste naturelle et permet de reprendre uniformément l’expression du contexte.
- source_word: οὐκ οἴδαμεν τί λαλεῖ
  choice: Nous ne savons pas de quoi il parle
  rationale: Cette formulation courante exprime leur incapacité à saisir le propos de Jésus, tout en distinguant en français λαλεῖ du précédent λέγει.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La question demeure directe et perplexe, sans expliquer à la place des disciples ce que Jésus entend par « un peu de temps ».
