lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Aoriste narratif de ἀποκρίνομαι ; « répondit » est la formulation française naturelle et habituelle dans un dialogue.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif pluriel indique les destinataires de la réponse ; en français, « leur répondit » rend naturellement cette construction.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française traditionnelle et standard du nom propre.
- source_word: Ἄρτι
  choice: maintenant
  rationale: Le terme exprime l’immédiateté présente ; « maintenant » en conserve directement la valeur temporelle.
- source_word: πιστεύετε
  choice: croyez-vous
  rationale: Présent actif, deuxième personne du pluriel, de πιστεύω ; « croire » est le rendu direct et usuel dans Jean. L’inversion marque naturellement l’interrogation en français soigné.
theological_decisions:
- issue: Valeur de Ἄρτι πιστεύετε;
  choice: 'Lecture interrogative : « Croyez-vous maintenant ? »'
  alternative: 'Lecture déclarative : « Maintenant, vous croyez. »'
  rationale: Le grec peut être ponctué comme une question ou compris comme une affirmation. Le contexte immédiat, où Jésus annonce la dispersion prochaine des disciples, favorise une question rhétorique, sans supprimer l’autre lecture possible.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise et conserve la tension entre interrogation rhétorique et affirmation possible.
