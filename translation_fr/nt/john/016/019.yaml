source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: fr
  text: 'Jésus savait qu’ils voulaient l’interroger, et il leur dit : « Vous vous interrogez entre vous à ce sujet, parce que[a] j’ai dit : “Encore un peu de temps, et vous ne me verrez plus[b] ; puis encore un peu de temps, et vous me verrez” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « au sujet de ce que j’ai dit ». Le grec peut présenter la citation comme le sujet de leur interrogation ou comme sa raison.'
    reason: alternative_reading
  - marker: b
    text: 'Le grec emploie ici deux verbes différents pour « voir » : d’abord θεωρέω, qui peut évoquer le fait de regarder ou d’observer, puis ὁράω, le verbe courant pour voir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: savait
  rationale: L’aoriste de γινώσκω exprime ici la connaissance qu’a Jésus de l’intention des disciples ; « savait » est direct et naturel.
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: ils voulaient l’interroger
  rationale: θέλω exprime leur intention, et ἐρωτάω signifie ici adresser une question, sans nuance hostile.
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: Vous cherchez entre vous ce que j’ai voulu dire par ces paroles
  rationale: ζητέω garde l’idée de chercher à comprendre ; avec μετ’ ἀλλήλων et la citation qui suit, la formulation française explicite naturellement l’objet de leur recherche commune sans réduire le verbe à une simple discussion.
- source_word: ὅτι εἶπον
  choice: par ces paroles
  rationale: ὅτι peut introduire soit le contenu examiné, soit la raison de leur recherche. La tournure retenue introduit la citation comme objet de leur interrogation tout en restant naturelle en français ; l’autre possibilité est signalée en note.
- source_word: Μικρὸν
  choice: Encore un peu de temps
  rationale: Le neutre μικρόν a ici une valeur temporelle ; « un peu de temps » est clair et idiomatique.
- source_word: οὐ θεωρεῖτέ με
  choice: vous ne me verrez plus
  rationale: Dans la séquence temporelle introduite par μικρόν, le présent grec décrit la cessation prochaine de la vue ; le futur français et « plus » rendent naturellement cette portée contextuelle.
- source_word: πάλιν μικρὸν
  choice: puis encore un peu de temps
  rationale: πάλιν marque la nouvelle étape de la séquence ; « puis encore » en rend clairement l’enchaînement.
- source_word: ὄψεσθέ με
  choice: vous me verrez
  rationale: Le futur de ὁράω se rend naturellement par le futur français « vous me verrez ».
theological_decisions:
- issue: Différence entre θεωρέω et ὁράω
  choice: Rendre les deux verbes par « voir » dans le texte principal
  alternative: Différencier par « vous ne m’observerez plus… vous me verrez »
  rationale: Le contraste principal porte sur l’absence puis la vue renouvelée. Une différenciation forcée serait peu naturelle en français ; la nuance lexicale est conservée en note.
- issue: Valeur de ὅτι après ζητεῖτε
  choice: Présenter la parole citée comme l’objet de ce que les disciples cherchent à comprendre
  alternative: 'Comprendre ὅτι comme causal : « parce que j’ai dit »'
  rationale: La syntaxe permet une valeur de contenu ou de cause. Le texte principal adopte une formulation française naturelle correspondant au contenu recherché, tandis qu’une note préserve l’ambiguïté réelle.
- issue: Portée de la question de Jésus
  choice: Conserver une véritable question qui dévoile leur recherche entre eux
  alternative: 'En faire une affirmation : « Vous vous interrogez entre vous… »'
  rationale: La ponctuation et le contexte soutiennent une question par laquelle Jésus met au jour leur échange privé.
translation_notes:
  register: Français international moderne, digne et accessible. « Interroger » convient au contexte sans suggérer un interrogatoire. La question est formulée de manière idiomatique, et les deux ambiguïtés pertinentes — la valeur de ὅτι et la variation des verbes de vision — sont conservées en notes.
