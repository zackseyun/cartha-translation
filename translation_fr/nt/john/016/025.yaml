id: JHN.16.25
reference: John 16:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: fr
  text: « Je vous ai parlé de ces choses en langage figuré[a]. L’heure vient[b] où je ne vous parlerai plus en langage figuré, mais où je vous annoncerai clairement[c] ce qui concerne le Père. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au moyen d’images », « en paroles voilées ». Le mot grec désigne ici une manière imagée ou indirecte de parler.
    reason: lexical_alternative
  - marker: b
    text: Ou « Le moment vient ». Chez Jean, le mot « heure » peut aussi avoir une portée théologique particulière.
    reason: lexical_alternative
  - marker: c
    text: Ou « ouvertement » ou « avec franchise ». Dans ce contexte, le terme souligne une parole directe, par opposition au langage figuré.
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαις
  choice: en langage figuré
  rationale: Dans l’usage johannique, le terme désigne ici une manière imagée ou indirecte de parler, plutôt que la parabole au sens technique. « En langage figuré » exprime naturellement le contraste avec une parole claire.
- source_word: λελάληκα
  choice: je vous ai parlé
  rationale: Le passé composé rend naturellement en français le parfait grec et maintient la portée actuelle des paroles déjà prononcées.
- source_word: ἔρχεται ὥρα
  choice: L’heure vient
  rationale: Cette formulation française naturelle conserve le vocabulaire caractéristique de Jean et sa possible portée théologique, sans réduire ὥρα à un simple moment.
- source_word: οὐκέτι
  choice: ne… plus
  rationale: C’est l’équivalent français idiomatique et précis dans cette déclaration portant sur l’avenir.
- source_word: λαλήσω
  choice: je parlerai
  rationale: Le choix maintient le lien lexical avec λελάληκα et souligne la manière de parler.
- source_word: παρρησίᾳ
  choice: clairement
  rationale: Dans le contraste avec le langage figuré, le mot évoque surtout une expression directe et sans voile, plutôt que l’audace.
- source_word: ἀπαγγελῶ
  choice: je vous parlerai
  rationale: Avec περὶ τοῦ πατρός, cette formulation est idiomatique en français et communique une révélation directe au sujet du Père, même si elle ne reproduit pas la différence formelle entre λαλέω et ἀπαγγέλλω.
- source_word: περὶ τοῦ πατρὸς
  choice: du Père
  rationale: Après « parler », « du Père » est la tournure française naturelle pour rendre « au sujet du Père », tout en conservant le titre relationnel et théologique.
theological_decisions:
- issue: Portée de ὥρα dans le contexte johannique
  choice: L’heure vient
  alternative: Le moment vient
  rationale: « Heure » préserve un motif important chez Jean. L’article défini relève ici de l’idiome français et ne vise pas à imposer une précision absente de la construction grecque.
- issue: Sens de παρρησίᾳ en contraste avec ἐν παροιμίαις
  choice: clairement
  alternative: ouvertement ; avec franchise
  rationale: Le contexte oppose la parole figurée ou voilée à une communication directe. « Clairement » conserve ce contraste sans déplacer l’accent vers le courage public.
- issue: Relation entre λαλήσω et ἀπαγγελῶ
  choice: je vous parlerai… je vous parlerai clairement
  alternative: je vous annoncerai clairement ; je vous ferai connaître clairement
  rationale: La répétition est fluide en français et met en relief le changement de mode de communication. La note signale les nuances possibles du second verbe sans surinterpréter la nature de la révélation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme du grec. « L’heure vient » garde la résonance johannique, tandis que « en langage figuré » et « clairement » rendent immédiatement perceptible l’opposition centrale.
