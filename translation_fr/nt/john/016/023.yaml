  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: fr
  text: 'Et ce jour-là, vous ne me poserez aucune question[a]. Amen, amen, je vous le dis : tout ce que vous demanderez au Père en mon nom, il vous le donnera.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici deux verbes différents : le premier peut signifier « poser une question » ou « demander », tandis que le second, dans la phrase suivante, désigne plus précisément le fait de solliciter quelque chose.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ce jour-là
  rationale: Expression temporelle française naturelle qui conserve la portée solennelle et potentiellement eschatologique de la formule johannique.
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: vous ne me poserez plus aucune question
  rationale: Le contexte immédiat concerne les questions que les disciples souhaitent poser à Jésus. Cette formulation distingue naturellement ἐρωτάω de αἰτέω dans la seconde proposition. « Plus » explicite la cessation impliquée par le contraste temporel, sans modifier le référent de la négation.
- source_word: ἀμὴν ἀμὴν
  choice: Oui, vraiment
  rationale: Formule solennelle, claire en français moderne, qui rend l'affirmation redoublée sans recourir à une tournure artificielle comme « vraiment, vraiment ».
- source_word: ἄν τι αἰτήσητε
  choice: tout ce que vous demanderez
  rationale: Rend naturellement la construction indéfinie ἄν τι et le caractère ouvert de l'objet demandé.
- source_word: τὸν πατέρα
  choice: au Père
  rationale: Respecte l'article défini grec sans ajouter le possessif « mon », absent du texte source.
- source_word: δώσει ὑμῖν
  choice: il vous le donnera
  rationale: Le pronom « le » reprend naturellement en français ce qui aura été demandé, objet implicite du verbe grec.
- source_word: ἐν τῷ ὀνόματί μου
  choice: en mon nom
  rationale: Formule française consacrée et directe, qui préserve la portée représentative et théologique de l'expression sans l'expliciter abusivement.
theological_decisions:
- issue: Distinction entre ἐρωτάω à propos de Jésus et αἰτέω à propos du Père
  choice: Rendre le premier par « poser une question » et le second par « demander »
  alternative: Employer « demander » dans les deux propositions
  rationale: Le contexte de Jean 16 et la différence lexicale favorisent une distinction intelligible en français. La note signale néanmoins que le premier verbe peut aussi avoir un sens plus général.
- issue: Portée de la promesse faite à la prière « en mon nom »
  choice: Conserver la promesse telle qu'elle est formulée, sans lui ajouter de condition explicative
  alternative: Préciser qu'il s'agit seulement des demandes conformes à la volonté de Jésus
  rationale: Les éventuelles précisions fournies par le contexte johannique relèvent de l'interprétation; elles ne doivent pas être introduites dans le texte de ce verset.
- issue: Rattachement syntaxique de « en mon nom »
  choice: Le rattacher à la demande adressée au Père
  alternative: 'Le rattacher au don du Père : « il vous donnera en mon nom »'
  rationale: L'ordre des mots transmis permet une discussion du rattachement, mais l'usage johannique et la lecture naturelle favorisent la demande faite au nom de Jésus. L'autre possibilité est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Poser une question » rend le contexte de l'entretien d'adieu et permet de conserver la distinction entre les deux verbes grecs. « Oui, vraiment » traduit avec solennité le double ἀμήν sans lourdeur littérale.
