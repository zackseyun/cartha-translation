id: JHN.16.10
reference: John 16:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: περὶ δικαιοσύνης δέ, ὅτι πρὸς τὸν ⸀πατέρα ὑπάγω καὶ οὐκέτι θεωρεῖτέ με·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/010.yaml
  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: fr
  text: et en ce qui concerne la justice[a], parce que je vais vers le Père et que vous ne me voyez plus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec peut aussi évoquer la droiture ou la reconnaissance du bon droit. Ici, le départ de Jésus vers le Père peut suggérer que son bon droit est confirmé, sans que le texte explicite entièrement ce lien.
    reason: alternative lexicale et ambiguïté théologique
lexical_decisions:
- source_word: περὶ
  choice: en ce qui concerne
  rationale: Cette tournure reprend clairement la structure des trois propositions parallèles des versets 9 à 11, tout en restant naturelle en français.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » est le correspondant français naturel du nom grec et peut évoquer à la fois ce qui est juste, la droiture et la reconnaissance du bon droit. Une note préserve cette amplitude dans ce contexte théologiquement dense.
- source_word: δέ
  choice: et
  rationale: La particule fait ici progresser une énumération plutôt qu’elle n’introduit une opposition forte.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici l’explication liée à la justice; « parce que » exprime naturellement cette valeur causale.
- source_word: πρὸς τὸν πατέρα
  choice: vers le Père
  rationale: Avec un verbe de mouvement, πρός indique la direction. « Vers le Père » conserve cette nuance sans ajouter le possessif « mon », absent du texte grec.
- source_word: ὑπάγω
  choice: je vais
  rationale: Le présent grec, orienté vers un départ prochain, est rendu par un présent français naturel qui en conserve l’immédiateté.
- source_word: οὐκέτι
  choice: ne… plus
  rationale: Cette négation exprime la cessation à partir de ce moment.
- source_word: θεωρεῖτέ
  choice: voyez
  rationale: Dans ce contexte, le verbe désigne le fait de voir Jésus; « voyez » est clair et moderne, sans surcharger le texte avec « contemplez » ou « observez ».
theological_decisions:
- issue: Portée de δικαιοσύνη dans ce passage
  choice: justice
  alternative: droiture; reconnaissance du bon droit
  rationale: Le mot grec possède une portée morale et judiciaire. Le contexte peut évoquer la manifestation ou la confirmation du bon droit de Jésus lorsqu’il va vers le Père, mais le texte ne précise pas explicitement toutes les relations théologiques en jeu. Le rendu principal et la note maintiennent donc cette tension sans imposer une interprétation unique.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le parallélisme du discours et la relation causale du grec, sans ajouter de possessif devant « Père » ni préciser excessivement le sens de « justice ».
