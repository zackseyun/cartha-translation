reference: John 16:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: fr
  text: 'Je vous ai dit ces choses afin qu’en moi vous ayez la paix. Dans le monde, vous subissez la détresse[a]. Mais prenez courage : moi, j’ai vaincu le monde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’épreuve », « l’affliction » ou « l’oppression ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λελάληκα
  choice: Je vous ai dit ces choses
  rationale: Le démonstratif pluriel renvoie au discours précédent. Le passé composé rend naturellement en français le parfait grec, qui présente une parole achevée dont l’effet demeure.
- source_word: ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε
  choice: afin qu’en moi vous ayez la paix
  rationale: « Afin que » conserve la valeur de but de ἵνα, tandis que « en moi » maintient sans l’expliciter davantage le langage johannique d’union ou de relation avec Jésus.
- source_word: ἐν τῷ κόσμῳ
  choice: Dans le monde
  rationale: Cette formulation garde le terme johannique « monde » et sa portée contextuelle sans le réduire à « système du monde » ou à « monde déchu ».
- source_word: θλῖψιν ἔχετε
  choice: vous connaissez la détresse
  rationale: Le grec exprime la possession ou l’expérience présente de θλῖψις. En français courant, « connaître la détresse » est plus naturel que « avoir de la détresse » et conserve l’idée de pression, d’épreuve et d’affliction.
- source_word: θαρσεῖτε
  choice: prenez courage
  rationale: L’impératif appelle à la confiance face à la détresse. « Prenez courage » est actuel, clair et digne.
- source_word: ἐγὼ νενίκηκα τὸν κόσμον
  choice: moi, j’ai vaincu le monde
  rationale: Le pronom exprimé ἐγώ reçoit une légère mise en relief par « moi ». Le passé composé rend le parfait comme une victoire accomplie dont les effets demeurent.
theological_decisions:
- issue: Portée de κόσμος dans le contexte johannique
  choice: « monde » dans ses deux occurrences
  alternative: « système du monde » ou « monde déchu »
  rationale: « Monde » préserve la polysémie johannique et le contraste entre la paix en Jésus, la détresse dans le monde et la victoire de Jésus sur le monde, sans imposer une définition doctrinale plus étroite.
- issue: Valeur des parfaits λελάληκα et νενίκηκα
  choice: 'passé composé : « j’ai dit » et « j’ai vaincu »'
  alternative: présent ou passé simple
  rationale: Le passé composé est la manière naturelle, en français moderne, de présenter ces actes comme accomplis et toujours pertinents. Il maintient notamment la tension narrative de la victoire déclarée avant la crucifixion.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve le contraste johannique entre « en moi » et « dans le monde ». Le point et la reprise par « Mais » donnent à l’exhortation sa force sans alourdir la phrase.
