id: JHN.16.30
reference: John 16:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: fr
  text: Maintenant, nous savons que tu sais tout et que tu n’as pas besoin que quelqu’un t’interroge[a]. C’est pourquoi nous croyons que tu es venu de Dieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que quelqu’un te pose une question ». Le verbe grec peut signifier « demander », « poser une question » ou « interroger »; « interroger » convient ici au contexte du savoir de Jésus et des pensées inexprimées des disciples.
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: Maintenant
  rationale: L’adverbe marque la prise de conscience présente des disciples; « Maintenant » est direct et naturel.
- source_word: οἴδαμεν
  choice: nous savons
  rationale: La forme οἶδα a ici un sens présent; le présent français en rend naturellement la valeur.
- source_word: οἶδας πάντα
  choice: tu sais tout
  rationale: Cette formulation française courante conserve la portée globale de πάντα sans alourdir la phrase.
- source_word: οὐ χρείαν ἔχεις
  choice: tu n’as pas besoin
  rationale: Rend clairement et idiomatiquement l’expression grecque de nécessité niée.
- source_word: ἵνα τίς σε ἐρωτᾷ
  choice: que quelqu’un t’interroge
  rationale: « Interroger » convient au contexte où Jésus connaît déjà les pensées et questions des disciples; le verbe grec peut aussi simplement signifier « demander » ou « poser une question ».
- source_word: ἐν τούτῳ
  choice: C’est pourquoi
  rationale: Exprime ici que ce constat fonde la confession des disciples, dans un français naturel.
- source_word: πιστεύομεν
  choice: nous croyons
  rationale: Équivalent direct et approprié dans ce contexte de confession.
- source_word: ἀπὸ θεοῦ
  choice: de Dieu
  rationale: Respecte le texte, qui dit explicitement « de Dieu », sans préciser « du Père ».
- source_word: ἐξῆλθες
  choice: tu es venu
  rationale: Avec « de Dieu », cette tournure française exprime naturellement l’origine et la mission de Jésus.
theological_decisions:
- issue: Portée christologique de « tu sais tout »
  choice: Conserver l’affirmation sans l’expliciter davantage
  alternative: Employer une formulation ajoutant explicitement l’omniscience
  rationale: Le texte rapporte la confession des disciples au sujet du savoir de Jésus; la traduction en préserve toute la force sans ajouter une formulation doctrinale absente du grec.
- issue: Sens de ἀπὸ θεοῦ ἐξῆλθες
  choice: tu es venu de Dieu
  alternative: tu es sorti de Dieu / tu es venu du Père
  rationale: La formulation directe maintient l’idée d’origine et de mission divines. « Du Père » harmoniserait avec le contexte, mais préciserait davantage que ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. Tutoiement cohérent avec l’adresse directe à Jésus. La phrase reste proche de la structure grecque tout en étant idiomatique.
