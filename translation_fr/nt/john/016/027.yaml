id: JHN.16.27
reference: John 16:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: fr
  text: En effet, le Père lui-même vous aime, parce que vous m’avez aimé et que vous avez cru que je suis venu de Dieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis sorti d’auprès de Dieu »; le grec peut aussi suggérer une venue de la présence de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ πατὴρ
  choice: En effet, le Père lui-même
  rationale: « En effet » introduit naturellement l’explication donnée par Jésus, tandis que « lui-même » conserve l’insistance portée par αὐτός sur le Père.
- source_word: φιλεῖ ὑμᾶς
  choice: vous aime
  rationale: φιλέω exprime ici un amour personnel et affectueux. « Aimer » est le terme français le plus naturel et le plus digne, sans affaiblir le lien relationnel.
- source_word: ὅτι ὑμεῖς ἐμὲ πεφιλήκατε
  choice: parce que vous m’avez aimé
  rationale: Le premier ὅτι est causal. Le passé composé rend de façon naturelle le parfait grec, qui présente cet amour comme acquis et toujours pertinent; les pronoms explicites gardent une légère insistance sans alourdir la phrase.
- source_word: καὶ πεπιστεύκατε
  choice: et que vous avez cru
  rationale: La reprise de « que » est idiomatique en français après « parce que » et coordonne clairement les deux motifs. Le passé composé reflète l’état présent issu de l’acte de croire.
- source_word: ὅτι ἐγὼ παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: que je suis venu de Dieu
  rationale: Cette formulation française naturelle conserve l’idée d’origine et de mission exprimée par παρά avec ἐξέρχομαι, sans imposer une explication doctrinale plus développée. Une note signale les nuances plus littérales possibles.
theological_decisions:
- issue: Portée christologique de « παρὰ τοῦ θεοῦ ἐξῆλθον »
  choice: je suis venu de Dieu
  alternative: je suis sorti de Dieu / je suis venu d’auprès de Dieu
  rationale: Le texte affirme l’origine de Jésus en relation avec Dieu, tout en pouvant suggérer qu’il vient de sa présence. La traduction principale reste naturelle et ne développe pas cette affirmation en formule doctrinale; la note préserve l’éventail sémantique du grec.
translation_notes:
  register: Français international moderne, clair et digne. La répétition « parce que… et que… » est idiomatique et garde la structure logique du grec. Le marqueur de note est placé après l’expression qu’il explique.
