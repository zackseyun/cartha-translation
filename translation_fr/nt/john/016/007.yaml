id: JHN.16.7
reference: John 16:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: fr
  text: 'Mais moi, je vous dis la vérité : il vaut mieux pour vous que je m’en aille. En effet, si je ne m’en vais pas, le Défenseur[a] ne viendra certainement pas auprès de vous ; mais si je pars, je vous l’enverrai.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « l’Aide », « le Conseiller » ou « le Consolateur » ; en grec : « le Paraclet ».'
    reason: Le terme grec παράκλητος possède un champ de sens plus large que chacun de ces équivalents français pris isolément.
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque le contraste avec la tristesse des disciples dans le contexte précédent ; « Mais » est naturel et concis en français.
- source_word: ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν
  choice: moi, je vous dis la vérité
  rationale: Rend l’affirmation solennelle et conserve la mise en relief du pronom ἐγώ par « moi ».
- source_word: συμφέρει ὑμῖν
  choice: il vaut mieux pour vous
  rationale: Exprime clairement l’idée d’avantage ou de bénéfice dans un français courant, sans donner au verbe un sens purement utilitaire.
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: que je m’en aille
  rationale: Après συμφέρει, la proposition indique ce qui est avantageux. « Que je m’en aille » est idiomatique et conserve l’idée de départ.
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: En effet, si je ne m’en vais pas
  rationale: « En effet » rend la fonction explicative de γάρ ; la construction conditionnelle et la répétition du verbe de départ sont maintenues.
- source_word: ὁ παράκλητος
  choice: le Défenseur
  rationale: Dans les écrits johanniques, παράκλητος désigne un agent personnel appelé à soutenir et à représenter. « Défenseur » rend cette dimension sans réduire le terme à la seule consolation ; les autres équivalents importants figurent en note.
- source_word: οὐ μὴ ἔλθῃ
  choice: ne viendra certainement pas
  rationale: La tournure οὐ μή avec le subjonctif constitue une négation appuyée ; « certainement pas » en communique la force en français moderne.
- source_word: πρὸς ὑμᾶς
  choice: auprès de vous
  rationale: Exprime ici le mouvement vers les disciples et l’arrivée en leur présence, dans une formulation française naturelle.
- source_word: ἐὰν δὲ πορευθῶ
  choice: mais si je pars
  rationale: « Mais » marque le contraste entre les deux conditions. « Je pars » distingue naturellement πορεύομαι de la répétition précédente de ἀπέρχομαι sans surcharger le texte.
- source_word: πέμψω αὐτὸν πρὸς ὑμᾶς
  choice: je vous l’enverrai
  rationale: Formulation française naturelle qui rend l’acte d’envoyer le Défenseur vers les disciples ; le pronom masculin « l’ » reprend personnellement « le Défenseur ».
theological_decisions:
- issue: Traduction de παράκλητος dans le discours johannique
  choice: Défenseur
  alternative: Aide, Conseiller, Consolateur, Paraclet
  rationale: Aucun mot français ne couvre à lui seul tout le champ sémantique. « Défenseur » préserve bien la fonction personnelle de soutien et de représentation, tandis que la note signale les autres nuances légitimes sans imposer une interprétation confessionnelle particulière.
- issue: Référence personnelle au παράκλητος
  choice: le Défenseur… je vous l’enverrai
  alternative: une formulation impersonnelle
  rationale: Le texte présente le παράκλητος comme celui qui vient et que Jésus envoie. Le masculin français dépend aussi du nom choisi, mais la syntaxe conserve clairement cette présentation personnelle sans ajouter une définition doctrinale absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « moi, je » conserve l’emphase grecque sans archaïsme. Le point-virgule met en relief le contraste logique entre les deux conditions.
