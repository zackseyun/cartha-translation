id: JHN.16.32
reference: John 16:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: fr
  text: Voici que l’heure vient, et elle est venue, où vous serez dispersés, chacun de son côté[a], et où vous me laisserez seul. Pourtant, je ne suis pas seul, car le Père est avec moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chacun chez soi », « chacun vers ce qui lui appartient ». Le grec a un sens plus large qu’un lieu précis et peut désigner ce qui est propre à chacun.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Voici que
  rationale: Marque solennellement l’attention en français moderne sans recourir à l’archaïque « voici ». La tournure introduit naturellement l’annonce qui suit.
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: l’heure vient, et elle est venue
  rationale: 'Conserve la tension entre le présent et le parfait : l’événement est imminent tout en étant déjà arrivé. En français johannique, « l’heure » est l’expression naturelle pour ce moment décisif.'
- source_word: ἵνα
  choice: où
  rationale: Après « l’heure », la relative temporelle introduit naturellement le contenu de ce moment, sans imposer ici une valeur finale de but.
- source_word: σκορπισθῆτε
  choice: vous serez dispersés
  rationale: Rend le passif et présente la dispersion comme l’événement annoncé, non comme une simple possibilité.
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: chacun de son côté
  rationale: Expression française naturelle qui maintient l’idée distributive sans limiter τὰ ἴδια à la seule maison. Une note signale la portée plus large de l’expression grecque.
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: et où vous me laisserez seul
  rationale: Rend clairement le fait que les disciples laisseront Jésus seul, sans renforcer indûment le verbe en « abandonnerez ».
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: Pourtant, je ne suis pas seul
  rationale: Le connecteur adversatif naturel fait ressortir le contraste entre le départ des disciples et la présence du Père.
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: car le Père est avec moi
  rationale: Exprime la raison donnée par Jésus et conserve le titre relationnel défini « le Père ».
theological_decisions:
- issue: Portée de ἕκαστος εἰς τὰ ἴδια
  choice: chacun de son côté
  alternative: chacun chez soi / chacun vers ce qui lui appartient
  rationale: La formulation ne réduit pas l’expression à un domicile précis et préserve son caractère distributif; la note conserve explicitement l’ambiguïté lexicale.
- issue: Rapport entre le départ des disciples et la présence du Père
  choice: Pourtant, je ne suis pas seul, car le Père est avec moi
  alternative: Et je ne suis pas seul, parce que le Père est avec moi
  rationale: Le contraste est explicité sans nier que les disciples laisseront réellement Jésus seul ni tirer de la présence du Père des conclusions doctrinales allant au-delà du verset.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde le rythme solennel de l’annonce, la tension temporelle entre l’imminence et l’accomplissement déjà présent, ainsi que l’ambiguïté de τὰ ἴδια.
