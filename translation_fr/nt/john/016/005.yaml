source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: fr
  text: 'Mais maintenant, je vais vers celui qui m’a envoyé, et aucun de vous ne me demande : « Où vas-tu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Mais maintenant
  rationale: Conserve le contraste discursif exprimé par δέ tout en restant naturel en français.
- source_word: ὑπάγω
  choice: je vais
  rationale: Rend simplement le présent de mouvement, dont le contexte indique le départ imminent de Jésus, sans le réduire au seul sens de « partir ».
- source_word: πρὸς τὸν πέμψαντά με
  choice: vers celui qui m’a envoyé
  rationale: Reproduit l’expression participiale personnelle et la direction marquée par πρός, sans expliciter « le Père », absent de cette proposition grecque.
- source_word: πέμψαντά
  choice: a envoyé
  rationale: « Envoyer » est l’équivalent courant et approprié de πέμπω dans le langage johannique de la mission.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: aucun de vous
  rationale: Rend directement et naturellement l’expression partitive avec sa négation catégorique.
- source_word: ἐρωτᾷ με
  choice: ne me demande
  rationale: Dans ce contexte, ἐρωτάω désigne le fait de poser une question; « demander » convient au français courant.
- source_word: Ποῦ ὑπάγεις;
  choice: Où vas-tu ?
  rationale: Formulation idiomatique qui conserve le sens de mouvement et l’adresse directe au singulier.
theological_decisions:
- issue: Identité de « celui qui m’a envoyé »
  choice: Conserver « celui qui m’a envoyé » sans ajouter « le Père ».
  alternative: « vers le Père qui m’a envoyé »
  rationale: Le référent est clair dans le contexte johannique, mais le grec de ce verset ne le nomme pas explicitement. La traduction préserve donc la formulation du texte source.
translation_notes:
  register: Français moderne, international et digne. La phrase conserve la tension apparente avec les questions antérieures des disciples sur la destination de Jésus, sans l’expliquer ni la résoudre dans le texte.
