source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: fr
  text: 'En vérité, en vérité, je vous le dis : vous pleurerez et vous vous lamenterez, mais le monde se réjouira ; vous serez dans la tristesse, mais votre tristesse se changera en joie.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « votre tristesse deviendra joie ».'
    reason: Formulation alternative, plus proche de la concision du grec εἰς χαρὰν γενήσεται.
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: En vérité, en vérité
  rationale: Conserve la répétition solennelle et emphatique propre à la formule johannique, dans un français digne et largement compréhensible.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Rend directement la formule d’adresse tout en respectant l’usage idiomatique du français, qui reprend l’énoncé par « le ».
- source_word: κλαύσετε
  choice: vous pleurerez
  rationale: Exprime clairement les pleurs et maintient la distinction avec le verbe suivant.
- source_word: θρηνήσετε
  choice: vous vous lamenterez
  rationale: Rend l’expression manifeste du deuil ou de la douleur sans confondre le terme avec « pleurer ».
- source_word: ὁ δὲ κόσμος
  choice: tandis que le monde
  rationale: Marque naturellement le contraste entre les disciples et le monde sans expliciter davantage la portée johannique de κόσμος.
- source_word: χαρήσεται
  choice: se réjouira
  rationale: Préserve la force du contraste émotionnel et le lien lexical avec χαρά, rendu ensuite par « joie ».
- source_word: λυπηθήσεσθε
  choice: vous serez dans la tristesse
  rationale: Formulation naturelle en français qui exprime l’état douloureux annoncé et prépare la reprise nominale « votre tristesse ».
- source_word: ἡ λύπη ὑμῶν
  choice: votre tristesse
  rationale: Maintient en français le lien lexical avec la proposition précédente et désigne l’affliction des disciples sans l’interpréter.
- source_word: εἰς χαρὰν γενήσεται
  choice: deviendra joie
  rationale: Suit de près le mouvement exprimé par εἰς avec γενήσεται. L’absence d’article devant « joie » donne à la formule une concision soutenue sans effacer l’idée de transformation.
theological_decisions:
- issue: Emploi johannique de κόσμος
  choice: le monde
  alternative: le monde incroyant ; le système du monde
  rationale: Le contexte oppose le monde aux disciples, mais ne définit pas ici explicitement le terme. La traduction conserve donc l’expression large et théologiquement chargée de Jean sans lui ajouter une interprétation.
- issue: Nature du passage de la tristesse à la joie
  choice: votre tristesse deviendra joie
  alternative: votre tristesse se changera en joie
  rationale: La formulation retenue préserve l’image forte selon laquelle la tristesse elle-même devient joie, sans préciser le mécanisme ni réduire la phrase à un simple remplacement d’un sentiment par un autre.
translation_notes:
  register: Français international moderne, soutenu mais accessible. La formule traditionnelle « En vérité, en vérité » conserve la solennité johannique ; le reste de la phrase privilégie une syntaxe naturelle et claire.
