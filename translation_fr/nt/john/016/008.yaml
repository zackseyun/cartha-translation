review_pass:
  verdict: revise
  source_fidelity: 'Le sens de la phrase grecque est globalement bien rendu : le participe temporel, la portée de ἐλέγξει et la triade introduite par περὶ sont respectés. Toutefois, « celui-là » introduit en français moderne une nuance dépréciative ou distanciante que l’emphase de ἐκεῖνος n’impose pas.'
  naturalness: « Confondra le monde au sujet du péché, de la justice et du jugement » est naturel dans un registre biblique moderne. La reformulation de l’emphase par la dislocation « quand il viendra, lui » est plus idiomatique et moins connotée que « celui-là ».
  terminology: « Confondra », « monde », « péché », « justice » et « jugement » sont des choix recevables et conservent l’ouverture du grec. La note sur δικαιοσύνη doit cependant éviter d’introduire comme simple possibilité lexicale « le fait d’être reconnu juste », formulation interprétative qui n’est pas nécessaire ici.
  issues:
  - severity: medium
    issue: « celui-là » pour ἐκεῖνος
    rationale: En français international moderne, « celui-là » peut sonner péjoratif, dismissif ou fortement distanciant. Le démonstratif grec est emphatique et anaphorique, sans comporter cette coloration. « lui » en dislocation conserve une emphase sobre et naturelle.
  - severity: low
    issue: Note b trop interprétative
    rationale: La mention « le fait d’être reconnu juste » dépasse l’alternative lexicale immédiatement justifiée par δικαιοσύνη dans ce verset et risque d’orienter le lecteur vers une interprétation précise. Une alternative telle que « droiture » préserve mieux l’ouverture sémantique.
  revised_text: Et quand il viendra, lui[a], il confondra le monde au sujet du péché, de la justice[b] et du jugement.
