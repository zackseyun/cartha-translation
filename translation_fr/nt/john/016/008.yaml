id: JHN.16.8
reference: John 16:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: fr
  text: Et quand il viendra, lui[a], il confondra le monde au sujet du péché, de la justice[b] et du jugement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou simplement : « il ». Le grec emploie un démonstratif emphatique qui renvoie au Défenseur annoncé dans le contexte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « droiture ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: quand … viendra
  rationale: Le participe aoriste a ici une valeur temporelle. La tournure « quand … viendra » est naturelle en français et conserve cette relation temporelle.
- source_word: ἐκεῖνος
  choice: celui-là
  rationale: Le démonstratif grec est emphatique et renvoie au Défenseur annoncé dans le contexte immédiat. « Celui-là » en maintient l’insistance, tout en restant compréhensible.
- source_word: ἐλέγξει
  choice: confondra
  rationale: Le verbe signifie ici mettre en évidence la faute ou démontrer que quelqu’un est dans l’erreur. « Confondra » conserve cette portée morale et quasi judiciaire sans la limiter à une condamnation prononcée.
- source_word: τὸν κόσμον
  choice: le monde
  rationale: Cette traduction garde l’ampleur et la résonance johannique de κόσμος sans expliciter abusivement s’il s’agit de l’humanité opposée à Dieu ou d’un ordre du monde.
- source_word: περὶ
  choice: au sujet de
  rationale: La locution, reprise implicitement dans l’énumération française, exprime naturellement le rapport indiqué par περὶ tout en préservant la structure ternaire.
- source_word: ἁμαρτίας
  choice: péché
  rationale: Le singulier du grec est conservé, laissant au verset suivant le soin d’en préciser la portée.
- source_word: δικαιοσύνης
  choice: justice
  rationale: « Justice » est le terme français naturel couvrant ici la qualité ou le statut de ce qui est juste. Le contexte du verset 10 en précisera le sens christologique sans que la traduction l’anticipe.
- source_word: κρίσεως
  choice: jugement
  rationale: « Jugement » préserve la portée judiciaire et potentiellement eschatologique de κρίσις sans la réduire d’avance à la condamnation.
theological_decisions:
- issue: Référent et force de ἐκεῖνος
  choice: Le démonstratif renvoie au Défenseur, l’Esprit, et son emphase est rendue par « celui-là ».
  alternative: Employer simplement « il », avec une formulation française plus fluide mais sans expression directe de l’emphase.
  rationale: Le référent vient du contexte immédiat. La traduction maintient le relief du démonstratif grec sans ajouter d’affirmation doctrinale au texte.
- issue: Portée de δικαιοσύνη
  choice: justice
  alternative: justesse ou le fait d’être juste
  rationale: En français biblique moderne, « justice » reste le correspondant le plus large et le plus naturel. Il permet au contexte suivant d’expliquer en quel sens le monde sera confondu à ce sujet.
- issue: Portée de ἐλέγχω envers le monde
  choice: confondra
  alternative: convaincra le monde de son erreur ou mettra en lumière la faute du monde
  rationale: Le grec peut associer exposition, réfutation et reconnaissance de culpabilité. « Confondra » préserve cette tension sans affirmer que chaque personne du monde sera intérieurement persuadée.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition grecque de περὶ est allégée en français après « au sujet de », tout en maintenant nettement la triade « péché, justice, jugement ». « Celui-là » est volontairement marqué afin de refléter l’emphase du grec.
