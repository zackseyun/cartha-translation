id: JHN.16.14
reference: John 16:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: fr
  text: Il me glorifiera, parce qu’il prendra de ce qui est à moi[a] et vous l’annoncera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « recevra de ce qui est à moi ».'
    reason: Alternative lexicale pour λήμψεται, qui peut exprimer l’idée de prendre ou de recevoir.
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Il
  rationale: Le pronom renvoie à l’Esprit mentionné dans le contexte immédiat. En français, « il » est naturel et suffit ici, sans forcer la valeur démonstrative de ἐκεῖνος.
- source_word: ἐμὲ
  choice: me
  rationale: Pronom personnel à l’accusatif, complément d’objet direct de « glorifiera ».
- source_word: δοξάσει
  choice: glorifiera
  rationale: « Glorifier » conserve le poids théologique de δοξάζω dans l’Évangile selon Jean, au-delà du simple fait d’honorer.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici la raison pour laquelle l’Esprit glorifiera Jésus.
- source_word: ἐκ τοῦ ἐμοῦ
  choice: de ce qui est à moi
  rationale: 'Cette formulation française naturelle garde l’expression volontairement large : le texte ne précise pas s’il s’agit de paroles, d’autorité, de révélation ou de tout ce qui appartient à Jésus.'
- source_word: λήμψεται
  choice: prendra
  rationale: λαμβάνω peut signifier « prendre » ou « recevoir ». « Prendra » s’accorde naturellement avec « de ce qui est à moi » et conserve la nuance active possible du verbe.
- source_word: ἀναγγελεῖ
  choice: vous l’annoncera
  rationale: ἀναγγέλλω signifie annoncer, rapporter ou faire connaître. Le pronom « l’ » reprend naturellement en français ce qui vient d’être évoqué.
- source_word: ὑμῖν
  choice: vous
  rationale: Le datif pluriel désigne les disciples auxquels Jésus s’adresse ; « vous » rend naturellement le nombre en français.
theological_decisions:
- issue: La relation de l’Esprit à Jésus dans ἐκ τοῦ ἐμοῦ λήμψεται
  choice: il prendra de ce qui est à moi
  alternative: il recevra de ce qui est à moi
  rationale: La traduction conserve l’ampleur de la formule johannique sans la transformer en énoncé doctrinal technique ni préciser davantage ce que l’Esprit prend ou reçoit.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près le grec tout en restant idiomatique ; le futur et la répétition des pronoms préservent la progression de la phrase.
