  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: fr
  text: Je suis sorti d’auprès du Père et je suis venu dans le monde. À nouveau[a], je quitte le monde et je vais vers le Père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « De nouveau » ou « Encore une fois ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: Je suis sorti d’auprès du Père
  rationale: La tournure conserve le verbe de sortie et l’origine exprimée par ἐκ, sans suggérer matériellement que Jésus serait sorti de l’intérieur du Père. « D’auprès du Père » est naturel en français johannique et maintient la relation personnelle exprimée par le contexte.
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: je suis venu dans le monde
  rationale: Le passé composé rend naturellement en français l’action accomplie avec sa pertinence présente; « dans le monde » exprime le mouvement d’entrée marqué par εἰς.
- source_word: πάλιν
  choice: Maintenant
  rationale: 'Ici, πάλιν structure le mouvement inverse ou correspondant: après être venu dans le monde, Jésus le quitte pour retourner vers le Père. « Maintenant » rend naturellement la transition contextuelle, tandis qu’une note conserve le sens plus littéral possible.'
- source_word: ἀφίημι τὸν κόσμον
  choice: je quitte le monde
  rationale: Le présent français exprime clairement l’action imminente; « quitter » est direct, idiomatique et fidèle au sens contextuel d’ἀφίημι.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: je vais vers le Père
  rationale: « Vers » conserve la direction exprimée par πρός sans ajouter l’idée non explicite de présence; la répétition de « je » respecte les deux verbes coordonnés du grec.
theological_decisions:
- issue: L’origine de Jésus auprès du Père et son retour vers lui
  choice: Conserver le mouvement « sorti d’auprès du Père » puis « vers le Père » sans l’expliciter doctrinalement.
  alternative: Paraphraser par « envoyé par Dieu » ou développer explicitement la préexistence et l’incarnation.
  rationale: Le grec affirme une provenance depuis le Père, une venue dans le monde et un mouvement vers le Père. La traduction préserve cette forte affirmation christologique tout en laissant intactes sa formulation et sa tension propres.
translation_notes:
  register: Français moderne, international et digne. La structure en deux mouvements parallèles est conservée. « D’auprès du Père » évite une formulation matériellement équivoque tout en restant plus précise que le simple « du Père ».
