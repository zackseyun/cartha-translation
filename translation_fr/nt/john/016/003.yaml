id: JHN.16.3
reference: John 16:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ταῦτα ποιήσουσιν ὅτι οὐκ ἔγνωσαν τὸν πατέρα οὐδὲ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: fr
  text: Et ils feront cela parce qu’ils n’ont connu ni le Père ni moi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne connaissaient ni le Père ni moi », ou « ils n’ont appris à connaître ni le Père ni moi ». Le verbe grec peut se rendre naturellement de plusieurs manières ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui relie cette affirmation au contexte précédent.
- source_word: ταῦτα
  choice: cela
  rationale: En français naturel, le singulier collectif « cela » reprend aisément l’ensemble des actes hostiles mentionnés auparavant, même si le grec emploie un démonstratif neutre pluriel.
- source_word: ποιήσουσιν
  choice: ils feront
  rationale: Le futur actif de ποιέω se rend directement et naturellement par « feront » avec « cela ».
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici la cause de leurs actes.
- source_word: οὐκ ἔγνωσαν
  choice: ils n’ont connu
  rationale: Le passé composé exprime naturellement en français un défaut de connaissance dont la portée demeure actuelle; « connaître » préserve la dimension relationnelle du verbe sans l’expliciter excessivement.
- source_word: τὸν πατέρα
  choice: le Père
  rationale: La majuscule convient à ce titre désignant Dieu dans le contexte johannique.
- source_word: οὐδὲ ἐμέ
  choice: ni moi
  rationale: Avec la négation, « ni… ni… » restitue clairement la coordination négative de οὐδέ.
theological_decisions:
- issue: Le langage johannique de la connaissance du Père et de Jésus
  choice: ils n’ont connu ni le Père ni moi
  alternative: ils ne connaissaient ni le Père ni moi; ils n’ont appris à connaître ni le Père ni moi
  rationale: La formulation maintient l’idée d’une absence de connaissance relationnelle du Père et de Jésus, donnée comme cause de la persécution, sans réduire cette connaissance à une simple information ni préciser davantage que le grec.
translation_notes:
  register: Français moderne, international et digne. « Ils feront cela » est plus idiomatique que « ils feront ces choses » tout en reprenant collectivement les actes évoqués dans le contexte. La tournure « n’ont connu ni… ni… » est soutenue mais claire et conserve la tension du grec.
