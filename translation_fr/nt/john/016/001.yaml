id: JHN.16.1
reference: John 16:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ταῦτα λελάληκα ὑμῖν ἵνα μὴ σκανδαλισθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/001.yaml
  text: I have spoken these things to you so that you may not fall away.
translation:
  language: fr
  text: Je vous ai dit tout cela pour que vous ne trébuchiez pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tombiez », « soyez amenés à tomber » ou « abandonniez la foi ». Le verbe grec évoque le fait de trébucher et peut désigner ici une défaillance spirituelle provoquée par l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: tout cela
  rationale: Le démonstratif neutre pluriel renvoie aux paroles précédentes de Jésus. « Tout cela » est naturel en français tout en gardant la portée rétrospective de l’expression.
- source_word: λελάληκα
  choice: j’ai dit
  rationale: Le passé composé rend naturellement en français la valeur accomplie du parfait grec dans ce discours. « J’ai parlé de ces choses » serait plus formel mais moins idiomatique.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom français exprime correctement le destinataire pluriel dans « je vous ai dit ».
- source_word: ἵνα μὴ
  choice: pour que… ne… pas
  rationale: Cette construction française exprime clairement le but négatif introduit par ἵνα avec μή.
- source_word: σκανδαλισθῆτε
  choice: trébuchiez
  rationale: « Trébucher » conserve l’image du verbe grec et évite de préciser sans nécessité si l’effet envisagé est le trouble, la chute spirituelle ou l’abandon de la foi. Le contexte de persécution donne néanmoins à l’image une portée grave.
theological_decisions:
- issue: Portée de σκανδαλισθῆτε dans le contexte de la persécution des disciples
  choice: trébuchiez
  alternative: abandonniez la foi ; tombiez ; soyez scandalisés
  rationale: Le contexte peut viser une défaillance spirituelle allant jusqu’à l’abandon, mais le verbe grec conserve une image et une certaine amplitude sémantique. Le texte principal maintient cette tension par « trébuchiez », tandis que la note explicite les sens possibles.
translation_notes:
  register: Français international moderne, simple et digne. « Je vous ai dit tout cela » est idiomatique dans un discours direct, et « trébuchiez » préserve l’image grecque sans atténuer la gravité que lui donne le contexte immédiat.
