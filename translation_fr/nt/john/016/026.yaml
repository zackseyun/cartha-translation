id: JHN.16.26
reference: John 16:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: fr
  text: Ce jour-là, vous demanderez en mon nom, et je ne vous dis pas que je prierai le Père à votre sujet[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour vous » ou « en votre faveur ». Le grec emploie ici un autre verbe que celui traduit par « demanderez » au début du verset.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Ce jour-là
  rationale: Expression temporelle naturelle en français moderne, qui conserve la valeur démonstrative de ἐκείνῃ.
- source_word: ἐν τῷ ὀνόματί μου
  choice: en mon nom
  rationale: Formulation johannique traditionnelle et naturelle, qui préserve le rapport à la personne et à l’autorité de Jésus sans l’expliciter excessivement.
- source_word: αἰτήσεσθε
  choice: vous demanderez
  rationale: Le futur est conservé, et « demander » convient naturellement à une demande adressée dans la prière.
- source_word: οὐ λέγω ὑμῖν
  choice: je ne vous dis pas
  rationale: Rend directement le présent grec dans un registre digne et courant.
- source_word: ἐρωτήσω
  choice: je prierai
  rationale: Dans la construction avec le Père, « prier » exprime naturellement une demande faite en faveur de quelqu’un et permet de faire entendre la différence avec αἰτέω, sans imposer le sens plus technique d’« intercéder ».
- source_word: τὸν πατέρα
  choice: le Père
  rationale: Reproduit l’expression grecque sans ajouter le possessif « mon ».
- source_word: περὶ ὑμῶν
  choice: à votre sujet
  rationale: Reste proche de la portée de περί avec le génitif et laisse ouverte la nuance contextuelle « pour vous / en votre faveur ».
theological_decisions:
- issue: La phrase nie-t-elle toute intercession future de Jésus, ou refuse-t-elle seulement de présenter ainsi l’accès des disciples au Père dans ce contexte ?
  choice: Conserver la formulation négative limitée à ce que Jésus dit ici, sans en tirer une négation générale de son intercession.
  alternative: Paraphraser que Jésus n’intercédera pas du tout pour les disciples, ou qu’ils accèdent au Père sans aucune médiation.
  rationale: Le verset souligne que les disciples demanderont en son nom, mais sa formulation ne suffit pas à trancher toutes les questions relatives à l’intercession de Jésus. La traduction préserve donc la tension du texte.
translation_notes:
  register: Français international moderne, sobre et digne. « Ce jour-là » est idiomatique; « en mon nom » maintient l’expression johannique; « je prierai le Père » évite la répétition française de « demander » tout en signalant la distinction entre αἰτέω et ἐρωτάω.
