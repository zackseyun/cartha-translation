  source_fidelity: La traduction rend correctement le présent discursif, l’interpellation Ἴδε, νῦν, et surtout le contraste entre ἐν παρρησίᾳ (« ouvertement ») et παροιμίαν οὐδεμίαν. Toutefois, « plus » introduit une notion temporelle additionnelle que le grec n’exprime pas dans cette proposition négative.
  naturalness: Le français est globalement naturel et de registre approprié. « N’employer aucune expression figurée » est plus idiomatique et précis que « ne plus s’exprimer par des paroles figurées ».
  terminology: « Ouvertement » convient à ἐν παρρησίᾳ dans ce contexte. « Expression figurée » rend bien παροιμία sans réduire le terme à « proverbe » ni imposer une interprétation particulière. La note ne doit pas présenter une translittération comme un équivalent littéral français.
  issues:
