    issue: Ajout de « plus »
    rationale: οὐδεμίαν exprime une négation totale (« aucune »), mais ne contient pas l’idée de cessation véhiculée par « plus ». Le contraste avec νῦν ne justifie pas d’ajouter cette nuance au texte traduit.
  - severity: low
    issue: Note b formulée comme « Littéralement “aucune paroimia” »
    rationale: Le grec porte l’accusatif παροιμίαν avec la négation οὐδεμίαν; « paroimia » est une translittération, non une traduction littérale utile au lecteur français. Une note d’alternatives lexicales est plus claire.
