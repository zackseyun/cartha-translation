source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: fr
  text: 'Ses disciples lui dirent : « Regarde, maintenant tu parles ouvertement[a] et tu n’emploies aucune expression figurée[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « clairement » ou « franchement ». L’expression grecque peut évoquer une parole ouverte, claire ou franche.
    reason: lexical_alternative
  - marker: b
    text: Ou « proverbe », « parabole » ou « parole voilée ». Ici, le terme désigne une manière de parler figurée ou indirecte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγουσιν
  choice: dirent
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit biblique écrit en français.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: Ses disciples
  rationale: Rend naturellement le groupe possessif grec tout en conservant la relation au référent.
- source_word: Ἴδε
  choice: Regarde
  rationale: Interjection moderne attirant l’attention; « voici » serait possible, mais moins direct dans cette prise de parole.
- source_word: νῦν
  choice: maintenant
  rationale: Conserve l’adverbe temporel qui signale le changement perçu par les disciples.
- source_word: ἐν παρρησίᾳ
  choice: ouvertement
  rationale: Dans ce contexte, l’expression s’oppose aux paroles figurées ou indirectes et désigne une manière ouverte et claire de parler.
- source_word: λαλεῖς
  choice: tu parles
  rationale: Le présent français convient à la situation immédiate commentée par les disciples.
- source_word: παροιμίαν
  choice: paroles figurées
  rationale: Dans Jean, le terme peut désigner une formulation figurée, voilée ou indirecte plutôt qu’un simple proverbe; le pluriel français exprime naturellement cette manière de parler.
- source_word: οὐδεμίαν λέγεις
  choice: tu ne t’exprimes plus par
  rationale: Cette formulation idiomatique rend la négation totale dans un contexte où les disciples constatent un changement; « plus » fait ressortir naturellement le contraste temporel avec « maintenant ».
theological_decisions:
- issue: Sens de παρρησία en contraste avec παροιμία
  choice: Jésus est décrit comme parlant ouvertement, sans formulation figurée ou voilée.
  alternative: Jésus parle avec assurance ou franchise.
  rationale: Le contraste immédiat avec παροιμίαν οὐδεμίαν favorise ici la clarté et le caractère direct du langage plutôt que l’idée principale de courage.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue entre les disciples et Jésus. La ponctuation française et le passé simple maintiennent un registre narratif biblique accessible.
