source:
  edition: SBLGNT
  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: fr
  text: 'Simon Pierre leur dit[a] : « Je vais pêcher. » Ils lui dirent : « Nous aussi, nous venons avec toi. » Ils sortirent, montèrent dans le bateau et, cette nuit-là, ils ne prirent rien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici le présent historique : « Simon Pierre leur dit… Ils lui disent… »'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει … λέγουσιν
  choice: dit … dirent
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit littéraire en français. La note signale cette différence sans alourdir le texte.
- source_word: Ὑπάγω ἁλιεύειν
  choice: Je vais pêcher
  rationale: Cette formulation française naturelle exprime le déplacement projeté et son but, sans surtraduire le verbe de mouvement.
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: Nous aussi, nous venons avec toi
  rationale: « Nous aussi » restitue l’insistance de καὶ ἡμεῖς, tandis que « venons avec toi » rend directement ἐρχόμεθα et σύν.
- source_word: ἐξῆλθον
  choice: Ils sortirent
  rationale: Le verbe conserve le mouvement de sortie exprimé par le grec, sans préciser un lieu que le texte ne nomme pas.
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: montèrent dans le bateau
  rationale: Expression idiomatique pour l’embarquement; « bateau » convient au contexte de pêche mieux que « navire ».
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: cette nuit-là
  rationale: Rendu français idiomatique de l’expression temporelle déictique.
- source_word: ἐπίασαν οὐδέν
  choice: ils ne prirent rien
  rationale: Dans ce contexte de pêche, « prendre » est naturel et rend clairement l’absence totale de prise.
