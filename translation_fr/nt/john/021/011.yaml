id: JHN.21.11
reference: John 21:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: fr
  text: 'Simon Pierre monta donc[a] et tira le filet sur le rivage. Il était plein de gros poissons : cent cinquante-trois. Et malgré leur grand nombre, le filet ne se déchira pas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « monta ». Dans ce contexte, il s’agit probablement de monter dans la barque ou à bord.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: monta
  rationale: Rend directement le verbe grec « monter ». Dans le contexte, Pierre monte vraisemblablement dans la barque ou à bord, mais le grec ne précise pas explicitement le complément ; la note conserve cette donnée contextuelle sans l’insérer dans le texte.
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement en français la conséquence narrative de l’instruction donnée au verset précédent.
- source_word: εἵλκυσεν
  choice: tira
  rationale: Équivalent courant et précis pour l’action de tirer le filet vers la terre, sans renforcer indûment l’idée de le traîner.
- source_word: τὸ δίκτυον
  choice: le filet
  rationale: Désignation française directe et usuelle de l’engin de pêche.
- source_word: εἰς τὴν γῆν
  choice: sur le rivage
  rationale: Le grec dit littéralement « vers/sur la terre » ; dans cette scène de pêche, « sur le rivage » exprime clairement et naturellement la destination du filet.
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: plein de gros poissons
  rationale: Formulation française naturelle qui conserve l’image du filet rempli ainsi que la grande taille des poissons.
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: cent cinquante-trois
  rationale: Reproduit sans interprétation le nombre précis donné par le texte.
- source_word: τοσούτων ὄντων
  choice: malgré leur grand nombre
  rationale: 'Rend avec fluidité la valeur concessive du génitif absolu : bien que les poissons soient si nombreux.'
- source_word: οὐκ ἐσχίσθη
  choice: ne se déchira pas
  rationale: Expression idiomatique française qui décrit le filet demeuré intact ; la forme pronominale française correspond naturellement au passif grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. La traduction reste proche de la syntaxe et des images grecques tout en fractionnant la longue phrase pour une lecture naturelle. Le marqueur [a] figure immédiatement après le terme concerné.
