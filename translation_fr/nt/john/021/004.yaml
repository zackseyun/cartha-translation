id: JHN.21.4
reference: John 21:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: fr
  text: Alors que le jour était déjà levé, Jésus se tint sur le rivage ; pourtant, les disciples ne savaient pas[a] que c’était Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « ne reconnurent pas que c’était Jésus ». Le grec dit plus littéralement : « ne savaient pas que c’était Jésus ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: Quand le jour se leva
  rationale: Le génitif absolu exprime la circonstance temporelle. « Le jour se leva » rend naturellement l’arrivée du petit matin; le français n’a pas besoin d’expliciter ἤδη, dont l’idée d’accomplissement est portée par le passé simple. δέ assure ici une transition narrative légère qui peut rester implicite.
- source_word: ἔστη
  choice: se tint
  rationale: L’aoriste de ἵστημι présente Jésus prenant ou occupant sa position sur le rivage. « Se tint » est naturel, digne et plus nettement événementiel que « se tenait ».
- source_word: εἰς τὸν αἰγιαλόν
  choice: sur le rivage
  rationale: Avec un verbe de position, εἰς peut désigner le lieu où quelqu’un se tient. « Rivage » rend αἰγιαλός avec précision dans ce contexte.
- source_word: οὐ μέντοι
  choice: Pourtant, … ne
  rationale: Cette combinaison marque un contraste concessif entre la présence visible de Jésus et l’absence d’identification par les disciples.
- source_word: ᾔδεισαν
  choice: ne savaient pas
  rationale: Le verbe οἶδα signifie littéralement « savoir, connaître ». Cette formulation préserve le choix lexical grec, tandis que la note indique le sens contextuel possible de reconnaissance.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: L’article renvoie au groupe déjà connu; aucun possessif n’a besoin d’être ajouté.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: que c’était Jésus
  rationale: Cette tournure française idiomatique rend la proposition d’identification sans calque maladroit.
theological_decisions:
- issue: Identification de Jésus après la résurrection
  choice: Dire que les disciples « ne savaient pas » que c’était Jésus, sans expliquer pourquoi.
  alternative: « ne reconnurent pas Jésus » ou « ne se rendaient pas compte que c’était Jésus »
  rationale: Le récit constate leur absence d’identification sans en donner la cause. La traduction conserve cette retenue et n’introduit aucune explication concernant l’apparence de Jésus ou la perception des disciples.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La ponctuation en deux phrases évite un point-virgule plus soutenu. Le marqueur [a] est placé après la proposition qu’il éclaire.
