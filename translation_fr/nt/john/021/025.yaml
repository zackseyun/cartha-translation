  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: fr
  text: Il y a encore beaucoup d’autres choses que Jésus a faites. Si elles étaient écrites une à une, je pense que pas même le monde lui-même ne pourrait contenir[a] les livres qui seraient écrits.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « n’aurait pas assez de place pour les livres qui seraient écrits ». Le verbe grec peut signifier « contenir » ou « avoir assez de place pour », et le participe peut aussi se rendre plus idiomatiquement par une idée de résultat futur.'
    reason: Alternative lexicale pour χωρήσειν et précision sur le participe γραφόμενα dans le cadre hypothétique.
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: Il y a encore beaucoup d’autres choses
  rationale: « Encore » exprime naturellement l’idée d’addition portée par δὲ καί et ἄλλα, sans introduire une valeur temporelle absente du grec.
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: que Jésus a faites
  rationale: Le verbe ποιέω désigne ici largement les actions de Jésus. L’accord au féminin pluriel suit « choses ».
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: Si on les écrivait une à une
  rationale: La tournure hypothétique française rend le subjonctif avec ἐάν, tandis que « une à une » conserve la valeur distributive de καθ’ ἕν.
- source_word: οὐδ’ αὐτὸν οἶμαι τὸν κόσμον
  choice: je pense que le monde lui-même ne pourrait pas
  rationale: « Je pense » maintient l’incise personnelle de l’auteur; « lui-même » restitue la valeur intensive de αὐτόν, et « ne… pas » avec « même » dans le groupe nominal préserve le sens de οὐδέ.
- source_word: χωρήσειν
  choice: contenir
  rationale: Dans ce contexte spatial et hyperbolique, « contenir » exprime directement l’une des valeurs reconnues de χωρέω.
- source_word: τὰ γραφόμενα βιβλία
  choice: les livres qui seraient écrits
  rationale: Le conditionnel passif français rend naturellement les livres qui résulteraient de l’hypothèse exprimée plus tôt, sans suggérer qu’ils sont réellement en cours de rédaction.
theological_decisions:
- issue: Hyperbole sur la capacité du monde à contenir les livres
  choice: Conserver l’image selon laquelle le monde lui-même ne pourrait pas contenir les livres
  alternative: Réduire l’image à une formule comme « il faudrait d’innombrables livres »
  rationale: Le texte grec conclut par une hyperbole délibérée. La traduction en préserve la force rhétorique sans l’interpréter de manière littéraliste ni l’affaiblir.
translation_notes:
  register: Français international moderne, clair et digne. Deux phrases remplacent la longue période grecque afin d’éviter une relative lourde, tout en conservant la progression logique, l’incise personnelle et l’hyperbole finale.
