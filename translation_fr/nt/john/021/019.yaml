  source_fidelity: 'La première occurrence d’εἶπεν est un aoriste, tandis que λέγει est un présent historique. Le texte français actuel emploie « Il dit » dans les deux cas : cette forme peut certes correspondre au passé simple pour la première occurrence, mais elle ne rend pas perceptible le contraste narratif grec et ne justifie pas l’affirmation selon laquelle le présent historique est conservé. « Il a dit » suivi de « il lui dit » rend clairement l’antériorité de la première déclaration et le présent historique de la seconde. Le sens de σημαίνων, ποίῳ θανάτῳ et δοξάσει est par ailleurs bien conservé.'
