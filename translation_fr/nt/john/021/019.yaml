source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: fr
  text: 'Il a dit cela pour indiquer par quel genre de mort Pierre glorifierait Dieu[a]. Après avoir dit cela, il lui dit[b] : « Suis-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par quelle sorte de mort » ; l’expression souligne la nature ou la manière de sa mort.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie ici un présent historique : « il lui dit ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: pour indiquer
  rationale: 'Le participe précise la portée de la parole précédente : elle faisait connaître indirectement ce qui allait arriver. « Indiquer » est naturel en français moderne et conserve cette nuance.'
- source_word: ποίῳ θανάτῳ
  choice: par quel genre de mort
  rationale: L’adjectif ποίῳ porte sur la nature ou la manière de la mort, et non seulement sur son identification. Cette formulation conserve la nuance qualitative.
- source_word: δοξάσει
  choice: glorifierait
  rationale: Le futur grec est rendu par le conditionnel présent, conformément à l’usage français dans le discours indirect dépendant d’un verbe au passé, tout en gardant la perspective future.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom grec est conservé sans répétition explicative du nom de Pierre dans la seconde phrase.
- source_word: λέγει
  choice: il lui dit
  rationale: Le présent français préserve le présent historique grec et la vivacité du récit johannique.
- source_word: Ἀκολούθει μοι
  choice: Suis-moi
  rationale: Cette formulation française naturelle conserve l’impératif présent, dont la portée peut être immédiate tout en engageant une fidélité continue.
- source_word: καὶ τοῦτο εἰπὼν
  choice: Après avoir dit cela
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal. La tournure choisie est claire et idiomatique sans ajouter un marqueur temporel absent.
theological_decisions:
- issue: Le sens de « glorifier Dieu » par la mort de Pierre
  choice: Conserver simplement « glorifierait Dieu », sans expliquer le mécanisme de cette glorification.
  alternative: Préciser qu’il s’agit du témoignage fidèle de Pierre dans le martyre.
  rationale: Le texte associe la mort de Pierre à la gloire rendue à Dieu, mais n’explicite pas ici comment cette mort le glorifierait. La traduction garde cette densité théologique sans imposer une interprétation supplémentaire.
- issue: Identification du sujet implicite de δοξάσει
  choice: Nommer Pierre dans la première phrase.
  alternative: Employer seulement « il », comme dans le grec.
  rationale: Dans le contexte immédiat, Jésus parle de la mort de Pierre. Nommer Pierre évite qu’en français le pronom soit pris pour Jésus, tout en n’ajoutant aucune identification contestable.
translation_notes:
  register: Français international moderne, sobre et digne. Le présent historique de λέγει est conservé par « il lui dit ». La première phrase explicite Pierre afin d’éviter une ambiguïté pronominale artificielle en français ; la seconde conserve les pronoms du texte grec.
