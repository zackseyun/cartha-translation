revisions:
- from: '« En vérité, en vérité, je te le dis : quand tu étais plus jeune, tu t’habillais toi-même[a] et tu allais où tu voulais. Mais quand tu seras vieux, tu étendras les mains[b] ; un autre t’habillera[a] et t’emmènera[c] là où tu ne veux pas aller. »'
  to: '« En vérité, en vérité, je te le dis : quand tu étais plus jeune, tu t’habillais toi-même[a] et tu allais où tu voulais. Mais quand tu seras vieux, tu étendras tes mains[b] ; un autre t’habillera[a] et t’emmènera[c] là où tu ne veux pas aller. »'
  rationale: La révision rend le possessif explicite du grec dans « tes mains » et corrige la note lexicale sur ζώννυμι. Elle conserve le choix judicieux de ne pas transformer l’imagerie du verset en une prédiction explicite de crucifixion dans le texte principal, ainsi que tous les ancrages de notes.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:08:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend fidèlement les oppositions temporelles et sémantiques du grec : autonomie passée (« tu t’habillais toi-même », « tu allais où tu voulais »), dépendance future et destination non voulue. Toutefois, τὰς χεῖράς σου exige naturellement « tes mains » en français ; « les mains » efface le possessif explicite. La note a présentait aussi de manière imprécise le sens littéral de ζώννυμι comme l’action d’« attacher ses vêtements » : il s’agit plus exactement de se ceindre / de mettre sa ceinture, ou de ceindre quelqu’un.'
  naturalness: Le français est moderne, clair et d’un registre convenant à la parole solennelle de Jésus. « T’emmènera » est une bonne solution naturelle pour οἴσει, sans surinterpréter l’image. L’ajout de « tes » améliore à la fois l’exactitude et la fluidité.
  terminology: « En vérité, en vérité », « je te le dis », « plus jeune », « vieux » et « glorifierait Dieu » sont cohérents et appropriés. « S’habiller » est acceptable dans le texte courant, à condition que la note conserve la nuance concrète de « se ceindre ». L’allusion possible à la crucifixion reste, à juste titre, en note et non dans le texte principal.
