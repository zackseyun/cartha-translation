  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: fr
  text: '« En vérité, en vérité, je te le dis : quand tu étais plus jeune, tu t’habillais toi-même[a] et tu allais où tu voulais. Mais quand tu seras vieux, tu étendras tes mains[b] ; un autre t’habillera[a] et t’emmènera[c] là où tu ne veux pas aller. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, le verbe signifie « se ceindre » ou « ceindre quelqu’un », notamment en mettant ou en attachant une ceinture. Il peut, selon le contexte, désigner le fait de s’habiller. Le contraste souligne ici l’autonomie passée de Pierre et sa dépendance future.
    reason: lexical_alternative
  - marker: b
    text: L’expression « étendre les mains » est souvent comprise comme une allusion à la mort de Pierre par crucifixion. Le verset suivant précise que Jésus indiquait ainsi par quelle mort Pierre glorifierait Dieu.
    reason: cross_reference
  - marker: c
    text: 'Ou : « te conduira », « t’emportera ». Le verbe grec peut évoquer le fait d’être porté ou emmené vers une destination non désirée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: En vérité, en vérité
  rationale: Cette formule française établie conserve le redoublement solennel et emphatique propre à l’Évangile selon Jean.
- source_word: λέγω σοι
  choice: je te le dis
  rationale: Formulation française naturelle qui maintient l’adresse directe et la force déclarative de Jésus.
- source_word: ὅτε ἦς νεώτερος
  choice: quand tu étais plus jeune
  rationale: Le comparatif νεώτερος est conservé et prépare le contraste avec la vieillesse annoncée.
- source_word: ἐζώννυες σεαυτόν
  choice: tu t’habillais toi-même
  rationale: Rend naturellement en français l’action de mettre et d’attacher ses vêtements, tout en soulignant l’autonomie passée de Pierre. Le sens concret plus précis est signalé en note.
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: tu allais où tu voulais
  rationale: Dans ce contexte, περιπατέω désigne le déplacement ordinaire. « Aller » exprime idiomatiquement la liberté de mouvement sans introduire un sens moral figuré.
- source_word: ὅταν δὲ γηράσῃς
  choice: Mais quand tu seras vieux
  rationale: Le futur français rend naturellement la construction ὅταν avec le subjonctif aoriste, tandis que « mais » marque le contraste introduit par δέ.
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: tu étendras les mains
  rationale: Traduction directe qui préserve l’image sans expliciter dès ce verset son possible rapport avec la crucifixion.
- source_word: ἄλλος σε ζώσει
  choice: un autre t’habillera
  rationale: Le même champ lexical que dans la première proposition est maintenu afin de faire ressortir le passage de l’autonomie à la dépendance.
- source_word: οἴσει
  choice: t’emmènera
  rationale: Dans ce contexte de déplacement imposé vers une destination, « emmener » est naturel et laisse ouverte la nuance de conduire, d’emporter ou de faire aller quelqu’un.
- source_word: ὅπου οὐ θέλεις
  choice: là où tu ne veux pas aller
  rationale: « Aller » est implicite dans le grec mais nécessaire en français courant pour exprimer clairement la destination non désirée.
theological_decisions:
- issue: Faut-il expliciter dans le texte principal une annonce de la crucifixion de Pierre ?
  choice: Conserver l’image littérale sans mentionner explicitement la crucifixion.
  alternative: Traduire l’image comme une annonce explicite de la crucifixion ou employer « liera » pour orienter immédiatement l’interprétation.
  rationale: Le verset suivant explique que ces paroles indiquaient par quelle mort Pierre glorifierait Dieu. Maintenir ici l’image permet de respecter la progression narrative et de ne pas résoudre prématurément son ambiguïté.
translation_notes:
  register: Français international moderne, clair et digne. Le redoublement solennel « En vérité, en vérité » conserve le style johannique. Le tutoiement correspond à l’adresse singulière de Jésus à Pierre. La ponctuation fait ressortir le contraste entre son autonomie passée et la dépendance qui l’attend.
