  text: ὁ δὲ εἶπεν αὐτοῖς· Βάλετε εἰς τὰ δεξιὰ μέρη τοῦ πλοίου τὸ δίκτυον, καὶ εὑρήσετε. ἔβαλον οὖν, καὶ οὐκέτι αὐτὸ ἑλκύσαι ⸀ἴσχυον ἀπὸ τοῦ πλήθους τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: fr
  text: 'Mais il leur dit : « Jetez le filet du côté droit de la barque, et vous trouverez[a]. » Ils le jetèrent donc, et ils ne parvenaient plus à le tirer, à cause de la grande quantité de poissons.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Litt. : « et vous trouverez ». En grec, le complément de « trouverez » n’est pas exprimé ; le contexte de la pêche le sous-entend.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: Jetez
  rationale: L’impératif « Jetez » exprime naturellement en français l’action de lancer un filet de pêche.
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: du côté droit de la barque
  rationale: Cette formulation naturelle conserve l’indication directionnelle sans recourir à un terme nautique spécialisé.
- source_word: πλοίου
  choice: barque
  rationale: Dans le cadre de la pêche sur le lac de Galilée, « barque » est le terme français courant et approprié.
- source_word: τὸ δίκτυον
  choice: le filet
  rationale: Équivalent direct et naturel du nom grec désignant ici un filet de pêche.
- source_word: εὑρήσετε
  choice: vous trouverez
  rationale: Le grec ne précise pas l’objet du verbe. Le français peut ici conserver cette ellipse, rendue intelligible par le contexte de pêche.
- source_word: οὐκέτι αὐτὸ ἑλκύσαι ἴσχυον
  choice: ils ne parvenaient plus à le tirer
  rationale: « Ne parvenaient plus » exprime l’incapacité ou le manque de force indiqué par ἴσχυον, tandis que « le tirer » conserve le mouvement exprimé par ἑλκύσαι sans ajouter explicitement une destination.
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: à cause de la grande quantité de poissons
  rationale: Cette expression rend clairement la valeur causale de ἀπό et le grand nombre exprimé par πλήθους dans un français moderne.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. La formulation conserve l’ellipse du grec en « vous trouverez », tout en l’expliquant en note.
