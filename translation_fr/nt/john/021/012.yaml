id: JHN.21.12
reference: John 21:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: fr
  text: 'Jésus leur dit : « Venez prendre le petit-déjeuner[a]. » Mais aucun des disciples n’osait lui demander[b] : « Qui es-tu ? », sachant que c’était le Seigneur.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec désigne précisément le fait de prendre le repas du matin.
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « demander » peut aussi signifier « interroger » ou « questionner de près ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: Venez
  rationale: L’adverbe employé comme invitation impérative appelle les disciples à s’approcher. « Venez » est direct et naturel en français.
- source_word: ἀριστήσατε
  choice: prendre le petit-déjeuner
  rationale: Le verbe désigne le fait de prendre le repas du matin. Cette formulation en conserve la précision temporelle tout en restant idiomatique.
- source_word: οὐδεὶς δὲ
  choice: Mais aucun
  rationale: δέ marque ici une transition légèrement contrastive entre l’invitation de Jésus et la retenue des disciples.
- source_word: ἐτόλμα
  choice: n’osait
  rationale: L’imparfait exprime leur absence persistante de hardiesse dans cette scène; « n’osait » convient naturellement avec l’infinitif.
- source_word: ἐξετάσαι
  choice: demander
  rationale: Avec la question directement citée, le sens contextuel est celui d’adresser une question à Jésus. Une note conserve la nuance possible d’un questionnement plus poussé.
- source_word: Σὺ τίς εἶ;
  choice: Qui es-tu ?
  rationale: C’est la forme naturelle de la question d’identité en français. Le pronom grec Σὺ est explicite et peut être emphatique, mais « Toi, qui es-tu ? » serait inutilement marqué dans ce contexte.
- source_word: εἰδότες ὅτι
  choice: sachant que
  rationale: Le participe présent reproduit la construction circonstancielle grecque sans imposer exclusivement une valeur causale comme le ferait « parce qu’ils savaient ».
- source_word: ὁ κύριός
  choice: le Seigneur
  rationale: « Le Seigneur » conserve le titre christologique et l’article dans cette identification narrative de Jésus ressuscité.
theological_decisions:
- issue: Traduction de κύριος appliqué à Jésus
  choice: le Seigneur
  alternative: le maître
  rationale: Dans cette scène d’apparition après la résurrection, « le Seigneur » préserve le poids christologique du titre sans ajouter d’interprétation.
- issue: Rapport logique du participe εἰδότες avec l’absence de question
  choice: sachant que
  alternative: parce qu’ils savaient que
  rationale: La forme participiale laisse le rapport circonstanciel ouvert, même si une nuance causale est plausible; la traduction évite de rendre cette causalité plus explicite que le grec.
translation_notes:
  register: Français international moderne, naturel et digne. « Prendre le petit-déjeuner » évite le sens variable de « déjeuner » selon les régions francophones. La ponctuation garde la question étroitement liée au verbe « demander », tandis que « sachant » conserve la forme participiale et sa légère ouverture circonstancielle.
