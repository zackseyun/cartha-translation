id: JHN.21.23
reference: John 21:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: fr
  text: 'Ainsi, cette parole[a] se répandit parmi les frères[b] : ce disciple ne mourrait pas. Pourtant, Jésus ne lui avait pas dit qu’il ne mourrait pas, mais : « Si je veux qu’il demeure jusqu’à ce que je vienne, que t’importe ? »[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ce propos ». Le grec λόγος peut désigner une parole, une déclaration ou un message qui circule.
    reason: lexical_alternative
  - marker: b
    text: Ici, « les frères » désigne la communauté des disciples ; le grec emploie le masculin pluriel ἀδελφοί.
    reason: cultural_note
  - marker: c
    text: 'Jésus n’a pas affirmé que ce disciple ne mourrait pas ; il a formulé une condition : « Si je veux qu’il demeure jusqu’à ce que je vienne… »'
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: se répandit
  rationale: Dans cette construction, le verbe décrit une parole qui circule au sein d’un groupe. « Se répandit » exprime naturellement cet emploi en français.
- source_word: οὗτος ὁ λόγος
  choice: cette parole
  rationale: λόγος désigne ici un propos qui circule. « Cette parole » reste proche du grec et laisse le contexte montrer qu’il s’agit d’une affirmation rapportée, voire mal comprise.
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: parmi les frères
  rationale: Avec le verbe de diffusion, εἰς indique ici le milieu dans lequel le propos s’est répandu. « Frères » conserve le masculin pluriel grec tout en désignant la communauté des disciples.
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: ce disciple
  rationale: Le démonstratif identifie le disciple précis dont il vient d’être question, sans ajouter d’explication absente du texte.
- source_word: οὐκ ἀποθνῄσκει
  choice: ne mourrait pas
  rationale: Le conditionnel convient au discours indirect dépendant d’un verbe au passé et rend le contenu de l’affirmation qui circulait.
- source_word: οὐκ εἶπεν δὲ
  choice: Pourtant, Jésus ne lui avait pas dit
  rationale: δέ introduit la correction du malentendu. Le plus-que-parfait français situe naturellement la parole antérieure de Jésus par rapport à la diffusion du propos.
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: Si je veux qu’il demeure
  rationale: « Veux » rend la volonté exprimée par θέλω, tandis que « demeure » conserve la portée johannique possible de μένω sans la surinterpréter.
- source_word: ἕως ἔρχομαι
  choice: jusqu’à ce que je vienne
  rationale: Cette formulation reste proche du présent grec à valeur prospective et évite d’expliciter « revenir », que le texte ne formule pas.
- source_word: τί πρὸς σέ
  choice: que t’importe ?
  rationale: Cette expression française concise rend l’idiome grec qui écarte la préoccupation de Pierre au sujet du destin de l’autre disciple.
theological_decisions:
- issue: Nature de l’affirmation concernant le disciple
  choice: Présenter le propos comme une parole répandue, puis conserver la correction explicite de l’auteur.
  alternative: Traduire λόγος par « rumeur » ou formuler directement que Jésus n’avait jamais promis l’immortalité au disciple.
  rationale: Le verset distingue soigneusement ce qui circulait de ce que Jésus avait réellement dit. « Parole » préserve la gamme de sens de λόγος, tandis que la seconde phrase empêche de transformer la condition hypothétique en promesse.
- issue: Sens de la condition « Si je veux qu’il demeure »
  choice: Maintenir la condition telle quelle, sans déterminer si elle se réalisera ni préciser la nature de la venue de Jésus.
  alternative: Paraphraser comme une promesse de survie jusqu’au retour de Jésus ou comme une hypothèse irréelle.
  rationale: Le grec énonce une condition portant sur la volonté de Jésus, mais ne tranche pas ici sa réalisation. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « que t’importe ? » garde la franchise de la question grecque sans devenir familière. « Demeure » préserve un écho lexical johannique tout en restant compréhensible.
