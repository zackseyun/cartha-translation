  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐνέγκατε ἀπὸ τῶν ὀψαρίων ὧν ἐπιάσατε νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: fr
  text: 'Jésus leur dit : « Apportez quelques-uns des poissons que vous venez de prendre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est conservé naturellement par le présent français « dit », forme qui convient au récit vivant de Jean.
- source_word: Ἐνέγκατε
  choice: Apportez
  rationale: L’impératif aoriste pluriel de φέρω exprime ici un ordre direct de déplacer les poissons jusqu’au lieu où se trouve Jésus.
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: quelques-uns des poissons
  rationale: La construction partitive indique qu’il faut apporter une partie des poissons, non nécessairement toute la prise.
- source_word: ὀψαρίων
  choice: poissons
  rationale: Dans ce contexte de pêche, le terme désigne simplement les poissons pris, sans qu’il soit nécessaire d’en préciser la taille ou la préparation.
- source_word: ὧν ἐπιάσατε νῦν
  choice: que vous venez de prendre
  rationale: La tournure française « venir de » rend naturellement l’action accomplie tout récemment, exprimée par l’aoriste avec νῦν.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. « Quelques-uns des poissons » conserve explicitement la valeur partitive de ἀπό, tandis que « vous venez de prendre » exprime sans lourdeur l’immédiateté de νῦν.
