id: JHN.21.14
reference: John 21:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο ἤδη τρίτον ἐφανερώθη ⸀ὁ Ἰησοῦς τοῖς ⸀μαθηταῖς ἐγερθεὶς ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: fr
  text: C’était déjà la troisième fois que Jésus se révélait aux disciples après avoir été ressuscité d’entre les morts[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’était déjà la troisième fois que Jésus apparaissait aux disciples après avoir été ressuscité d’entre les morts. »'
    reason: Alternative lexicale pour ἐφανερώθη, qui peut se rendre contextuellement par « apparaissait ».
lexical_decisions:
- source_word: τοῦτο
  choice: C’était
  rationale: Le démonstratif renvoie à la manifestation qui vient d’être racontée. La tournure « C’était » est naturelle en français dans le décompte des manifestations.
- source_word: ἤδη
  choice: déjà
  rationale: Le mot marque que le récit en est désormais arrivé à une troisième occurrence; « déjà » en conserve directement la nuance.
- source_word: τρίτον
  choice: la troisième fois
  rationale: L’accusatif est employé adverbialement pour indiquer le rang de l’occurrence; cette expansion est idiomatique en français.
- source_word: ἐφανερώθη
  choice: se révélait
  rationale: Le verbe φανερόω exprime ici le fait de se rendre manifeste. « Se révélait » conserve le vocabulaire johannique de manifestation tout en restant naturel; « apparaissait » est signalé en note comme possibilité contextuelle.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Le nom propre précédé de l’article grec se rend normalement sans article en français.
- source_word: τοῖς μαθηταῖς
  choice: aux disciples
  rationale: Le datif désigne les destinataires de la manifestation. Le grec ne comporte pas explicitement de possessif, même si « ses disciples » est sous-entendu par le contexte.
- source_word: ἐγερθεὶς
  choice: après avoir été ressuscité
  rationale: Le participe aoriste passif indique une action antérieure à celle du verbe principal. Cette formulation exprime clairement le rapport temporel et préserve la voix passive.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Expression française consacrée et précise pour l’idiome grec de la résurrection, qui évoque une sortie du milieu des morts.
theological_decisions:
- issue: Rendu de la formule de résurrection ἐγερθεὶς ἐκ νεκρῶν
  choice: après avoir été ressuscité d’entre les morts
  alternative: après être ressuscité d’entre les morts
  rationale: Le participe grec est passif. Le texte principal conserve donc cette voix sans déterminer explicitement l’agent, plutôt que de passer à une formulation pronominale susceptible d’être comprise comme plus active.
- issue: Valeur de ἐφανερώθη
  choice: se révélait
  alternative: apparaissait
  rationale: Le choix principal maintient la notion johannique de manifestation sans prétendre que Jésus était auparavant inconnaissable; la note conserve l’autre rendu contextuel légitime.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait « se révélait » s’intègre naturellement à la construction identificatrice « C’était… la troisième fois que »; la formulation conserve le passif de la résurrection et n’ajoute pas le possessif « ses » absent du grec.
