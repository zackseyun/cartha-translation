base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: fr
  text: 'Jésus leur dit donc : « Les enfants, vous n’avez pas de poisson[a], n’est-ce pas ? » Ils lui répondirent : « Non. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelque chose à manger ». Le grec προσφάγιον désigne plus précisément un aliment mangé avec du pain ; dans ce contexte de pêche, il renvoie probablement au poisson.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement la progression du récit et le lien avec la situation précédente.
- source_word: Παιδία
  choice: Mes enfants
  rationale: Le vocatif exprime ici une adresse familière et affectueuse. « Mes enfants » est idiomatique en français tout en conservant la nuance relationnelle du grec.
- source_word: μή τι
  choice: vous n’avez pas… n’est-ce pas ?
  rationale: La question introduite par μή appelle une réponse négative; cette tournure française en conserve l’orientation sans être artificielle.
- source_word: προσφάγιον
  choice: poisson
  rationale: Le terme désigne un aliment mangé avec du pain; dans ce contexte de pêche, il s’agit très probablement de poisson. Le français « poisson » restitue clairement ce sens contextuel.
- source_word: ἔχετε
  choice: vous n’avez pas
  rationale: Le présent de possession est intégré naturellement à la question négative.
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: Ils lui répondirent
  rationale: Formule narrative française naturelle, correspondant directement à la réponse adressée à Jésus.
- source_word: Οὔ
  choice: Non
  rationale: Réponse négative brève qui reproduit la concision du grec.
