source:
  edition: SBLGNT
  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: fr
  text: C’est ce disciple qui témoigne au sujet de ces choses et qui les a écrites[a], et nous savons que son témoignage est vrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « qui rend témoignage au sujet de ces choses et qui les a écrites […] son témoignage est vrai ». Le grec emploie dans tout le verset des mots de la même famille pour « témoigner » et « témoignage ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ μαθητὴς
  choice: C’est ce disciple
  rationale: Cette tournure française naturelle conserve la valeur d’identification du démonstratif et renvoie au disciple qui vient d’être mentionné.
- source_word: ὁ μαρτυρῶν
  choice: qui témoigne
  rationale: Le participe présent exprime une activité actuelle ou caractéristique. « Témoigne » est idiomatique et maintient le champ lexical du témoignage.
- source_word: περὶ τούτων
  choice: au sujet de ces choses
  rationale: Rendu direct qui conserve le renvoi démonstratif au contenu évoqué.
- source_word: ὁ γράψας ταῦτα
  choice: qui les a écrites
  rationale: Le participe aoriste présente l’acte d’écrire comme accompli. Le pronom « les » évite une répétition lourde tout en renvoyant clairement à « ces choses ».
- source_word: οἴδαμεν
  choice: nous savons
  rationale: Le parfait grec a ici un sens présent; « nous savons » est le rendu français normal sans préciser l’identité du groupe parlant.
- source_word: ἀληθὴς
  choice: vrai
  rationale: L’adjectif qualifie le témoignage et conserve directement l’affirmation johannique de vérité.
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: son témoignage
  rationale: Le possessif français rend naturellement le génitif et « témoignage » préserve les nuances d’attestation et d’affirmation véridique.
theological_decisions:
- issue: Identité et voix du « nous savons »
  choice: Conserver simplement « nous savons » sans identifier les locuteurs.
  alternative: Attribuer ces mots à l’évangéliste comme pluriel éditorial, ou à une communauté attestant le témoignage du disciple.
  rationale: Le grec emploie explicitement la première personne du pluriel sans en identifier le référent. La traduction ne doit pas trancher la question de l’auteur ou du groupe attestataire.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve le lien lexical entre « témoigne » et « témoignage », ainsi que l’ambiguïté du « nous ».
