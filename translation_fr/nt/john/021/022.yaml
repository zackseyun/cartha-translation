id: JHN.21.22
reference: John 21:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: fr
  text: 'Jésus lui dit : « Si je veux qu’il reste jusqu’à ce que je vienne[a], que t’importe ? Toi, suis-moi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression « jusqu’à ce que je vienne » reste volontairement ouverte : le texte ne précise pas à quelle venue de Jésus elle fait référence.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Le présent historique grec est rendu naturellement par le présent de narration français, courant et digne dans un récit.
- source_word: Ἐὰν
  choice: Si
  rationale: Introduit simplement la condition hypothétique sans lui ajouter de nuance.
- source_word: θέλω
  choice: je veux
  rationale: Rend directement la volonté ou le désir exprimé par θέλω ; en français, « vouloir » couvre naturellement ces nuances.
- source_word: μένειν
  choice: qu’il reste
  rationale: « Rester » conserve le sens général de μένω sans préciser indûment qu’il s’agirait de rester en vie.
- source_word: ἕως ἔρχομαι
  choice: jusqu’à ce que je vienne
  rationale: Formulation française naturelle qui laisse ouverte la nature de la venue de Jésus, contrairement à « jusqu’à mon retour ».
- source_word: τί πρὸς σέ;
  choice: que t’importe ?
  rationale: Expression idiomatique, concise et directe, qui écarte la préoccupation de Pierre au sujet de l’autre disciple.
- source_word: σύ
  choice: Toi
  rationale: 'Le pronom détaché restitue l’emphase et le contraste grecs : quel que soit le sort de l’autre disciple, Pierre doit suivre Jésus.'
- source_word: μοι ἀκολούθει
  choice: suis-moi
  rationale: L’impératif présent commande de suivre Jésus ; la formulation française simple peut naturellement avoir une portée continue.
theological_decisions:
- issue: Sens de la venue de Jésus dans ἕως ἔρχομαι
  choice: jusqu’à ce que je vienne
  alternative: jusqu’à mon retour ; jusqu’à une venue historique particulière ; jusqu’à la venue finale
  rationale: Le verset ne précise ni la nature ni le moment de cette venue. La traduction conserve donc l’ambiguïté au lieu d’imposer une interprétation historique ou eschatologique.
translation_notes:
  register: Français international moderne, direct et digne. « Que t’importe ? » garde la vigueur de la question grecque, tandis que « Toi, suis-moi » marque nettement l’opposition entre Pierre et l’autre disciple.
