id: JHN.21.8
reference: John 21:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: fr
  text: Mais les autres disciples vinrent dans la petite barque, car ils n’étaient pas loin de la rive, à environ deux cents coudées[a], en tirant le filet contenant les poissons[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Deux cents coudées correspondent à environ 90 mètres.
    reason: cultural_note
  - marker: b
    text: 'Plus littéralement: «le filet des poissons». L’expression grecque désigne vraisemblablement le filet qui contenait les poissons.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: Mais les autres disciples
  rationale: δέ marque ici le contraste avec l’action de Pierre au verset précédent; «Mais» le rend naturellement en français.
- source_word: τῷ πλοιαρίῳ
  choice: dans la petite barque
  rationale: Le diminutif πλοιάριον suggère une embarcation de petite taille; «barque» convient au contexte de pêche.
- source_word: ἦλθον
  choice: vinrent
  rationale: L’aoriste de ἔρχομαι exprime simplement leur venue dans la séquence narrative.
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: car ils n’étaient pas loin de la rive
  rationale: γάρ introduit l’explication. Dans ce contexte nautique, γῆ désigne la terre ferme envisagée comme la rive.
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: à environ deux cents coudées
  rationale: ὡς indique l’approximation. La mesure ancienne est conservée dans le texte et expliquée en note.
- source_word: σύροντες
  choice: en tirant
  rationale: Le participe présent décrit l’action simultanée à leur venue; «tirer» est naturel pour un filet amené derrière une barque.
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: le filet contenant les poissons
  rationale: Le génitif peut désigner le contenu du filet. Cette formulation reste naturelle sans ajouter explicitement l’idée qu’il était «plein».
