  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: fr
  text: 'Après le repas du matin, Jésus dit à Simon Pierre : « Simon, fils de Jean, m’aimes-tu plus que ceux-ci[a] ? » Il lui répondit : « Oui, Seigneur, tu sais que je t’aime[b]. » Jésus lui dit : « Nourris mes agneaux. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Plus que ceux-ci » peut signifier « plus que ceux-ci ne m’aiment » ou renvoyer aux personnes ou aux choses présentes. Le grec laisse la comparaison implicite.
    reason: alternative_reading
  - marker: b
    text: Jésus emploie ici le verbe grec ἀγαπάω (« aimer »), tandis que Pierre répond avec φιλέω (« aimer, avoir de l’affection pour »). Certains y voient une nuance voulue ; d’autres considèrent cette variation comme stylistique. Le texte principal traduit les deux verbes par « aimer ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρίστησαν
  choice: Après le repas du matin
  rationale: ἀριστάω désigne ici le fait de prendre le repas du matin. Cette formulation est naturelle en français international et conserve la précision temporelle.
- source_word: Σίμων Ἰωάννου
  choice: Simon, fils de Jean
  rationale: Le génitif Ἰωάννου fonctionne comme un patronyme. « Jean » traduit directement la forme grecque de ce verset, sans importer la variante traditionnelle « Jonas ».
- source_word: ἀγαπᾷς / φιλῶ
  choice: m’aimes-tu / je t’aime
  rationale: « Aimer » est naturel pour les deux verbes dans ce contexte. Leur alternance grecque est signalée en note afin de ne pas imposer une différence de degré qui demeure discutée.
- source_word: πλέον τούτων
  choice: plus que ceux-ci
  rationale: L’expression grecque est elliptique et son référent reste implicite. La formulation française conserve autant que possible cette ambiguïté, explicitée en note.
- source_word: κύριε
  choice: Seigneur
  rationale: Dans ce contexte johannique, « Seigneur » rend l’adresse respectueuse et théologiquement chargée de Pierre à Jésus.
- source_word: Βόσκε τὰ ἀρνία μου
  choice: Nourris mes agneaux
  rationale: βόσκω vise précisément l’action de nourrir, tandis que ἀρνία conserve l’image pastorale des agneaux.
theological_decisions:
- issue: Faut-il distinguer fortement ἀγαπάω et φιλέω dans le texte principal ?
  choice: Traduire les deux par « aimer » et signaler l’alternance en note.
  alternative: Traduire φιλέω par « avoir de l’affection » ou « être attaché » afin de marquer une différence avec ἀγαπάω.
  rationale: Le vocabulaire grec varie, mais le contexte ne démontre pas sans ambiguïté une hiérarchie entre deux formes d’amour. Une note préserve la donnée lexicale sans imposer une interprétation psychologique ou théologique.
- issue: Sens de πλέον τούτων
  choice: Conserver l’expression elliptique « plus que ceux-ci ».
  alternative: Préciser « plus que ceux-ci ne m’aiment » ou comprendre « plus que ces choses ».
  rationale: Le grec n’explicite ni le référent ni le second terme complet de la comparaison. Le texte principal doit préserver cette tension interprétative.
translation_notes:
  register: Français moderne, international et digne. Le passé composé introduit naturellement la scène ; le passé simple est évité. Les paroles restent directes et sobres. Les deux ambiguïtés importantes du grec sont conservées et documentées.
