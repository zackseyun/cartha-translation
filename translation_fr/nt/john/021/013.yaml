  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: fr
  text: Jésus vient, prend le pain et le leur donne, puis fait de même avec le poisson.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « et le poisson de même ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent de narration grec est conservé afin de respecter la vivacité du récit johannique.
- source_word: λαμβάνει
  choice: prend
  rationale: Dans ce contexte de distribution d’un repas déjà préparé, « prend » exprime simplement l’action indiquée.
- source_word: τὸν ἄρτον
  choice: le pain
  rationale: L’article désigne le pain précis qui se trouve là; « le pain » est naturel en français.
- source_word: δίδωσιν αὐτοῖς
  choice: le leur donne
  rationale: Le pronom « le » reprend naturellement « le pain », et « leur » rend αὐτοῖς sans introduire l’idée plus interprétative de servir.
- source_word: τὸ ὀψάριον
  choice: le poisson
  rationale: Dans le contexte, le terme désigne du poisson destiné à être mangé; le mot grec n’exige pas de préciser qu’il est cuit.
- source_word: ὁμοίως
  choice: fait de même avec
  rationale: Cette formulation française explicite naturellement les verbes sous-entendus pour le poisson tout en conservant le parallélisme concis du grec.
theological_decisions:
- issue: Présents de narration dans le récit d’une apparition après la résurrection
  choice: Conserver le présent de narration (« vient, prend… donne »)
  alternative: Employer le passé composé ou le passé simple (« est venu/a pris/a donné » ou « vint/prit/donna »)
  rationale: Il s’agit d’une question narrative plutôt que doctrinale. Le présent respecte la texture du grec et reste idiomatique dans un récit français vivant.
translation_notes:
  register: Français moderne, international et digne. La coordination « puis fait de même avec le poisson » évite le calque peu naturel « et le poisson de même » tout en restituant clairement l’ellipse grecque. Le présent historique est maintenu.
