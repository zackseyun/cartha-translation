  text: τοῦτον ⸀οὖν ἰδὼν ὁ Πέτρος λέγει τῷ Ἰησοῦ· Κύριε, οὗτος δὲ τί;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: fr
  text: 'Quand Pierre le voit, il dit donc à Jésus : « Seigneur, et lui ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον … ἰδών
  choice: Quand Pierre le voit
  rationale: Le pronom renvoie au disciple mentionné au verset précédent. Une proposition temporelle rend naturellement en français le participe circonstanciel grec.
- source_word: οὖν
  choice: donc
  rationale: Conserve le lien narratif et logique avec le contexte immédiat, tout en adoptant une place idiomatique en français.
- source_word: λέγει
  choice: il dit
  rationale: Le présent historique grec est rendu par le présent de narration, naturel ici et fidèle à l'effet du texte source.
- source_word: Κύριε
  choice: Seigneur
  rationale: Équivalent français courant et digne du vocatif κύριε adressé à Jésus.
- source_word: οὗτος δὲ τί;
  choice: et lui ?
  rationale: 'Cette formulation française brève conserve le caractère elliptique de la question grecque, dont le sens complet dépend du contexte : « qu''en est-il de lui ? ».'
theological_decisions:
- issue: Caractère elliptique de la question de Pierre
  choice: « et lui ? »
  alternative: « qu’en est-il de lui ? » ou « que lui arrivera-t-il ? »
  rationale: Le grec ne précise aucun verbe ni destin particulier. La traduction retenue préserve cette ambiguïté sans imposer une interprétation théologique ou narrative.
translation_notes:
  register: Français international moderne, naturel et digne. La concision de la dernière question reproduit l’ellipse vive de l’original.
