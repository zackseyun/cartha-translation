    reason: lexical_alternative
  - marker: b
    text: « Feu de braises » traduit un terme également employé en Jean 18.18, ce qui relie verbalement cette scène au cadre du reniement antérieur de Pierre.
    reason: cross_reference
  revision_rationale: La révision remplace une expression française lourde et légèrement imprécise par « eurent débarqué à terre », qui rend le mouvement exprimé par le grec. Elle maintient le passé narratif naturel, la relation du poisson au feu et l’indétermination de « pain ». La note de variante est conservée, et une note de renvoi lexical est ajoutée conformément à la piste d’audit anglaise.
