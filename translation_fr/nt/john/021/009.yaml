revisions:
- from: Quand ils furent donc descendus à terre[a], ils virent là un feu de braises, avec du poisson posé dessus, et du pain.
  to: Lorsqu’ils eurent débarqué à terre, ils virent alors un feu de braises[b], du poisson posé dessus et du pain.
  rationale: La révision remplace une expression française lourde et légèrement imprécise par « eurent débarqué à terre », qui rend le mouvement exprimé par le grec. Elle maintient le passé narratif naturel, la relation du poisson au feu et l’indétermination de « pain ». La note de variante est conservée, et une note de renvoi lexical est ajoutée conformément à la piste d’audit anglaise.
