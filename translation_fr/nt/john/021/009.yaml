id: JHN.21.9
reference: John 21:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: fr
  text: Lorsqu’ils eurent débarqué à terre, ils virent alors un feu de braises[b], du poisson posé dessus et du pain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: « Feu de braises » traduit un terme également employé en Jean 18.18, ce qui relie verbalement cette scène au cadre du reniement antérieur de Pierre.
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Quand… donc
  rationale: Associe la valeur temporelle de ὡς à la continuité narrative marquée par οὖν, dans un ordre naturel en français.
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: ils furent descendus à terre
  rationale: Exprime la sortie de la barque et l’arrivée sur la terre ferme sans préciser davantage que le grec le lieu exact du débarquement.
- source_word: βλέπουσιν
  choice: ils virent
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit écrit en français.
- source_word: ἀνθρακιὰν
  choice: un feu de braises
  rationale: Rend clairement un feu alimenté par des charbons et conserve le lien lexical avec Jean 18.18.
- source_word: κειμένην
  choice: là
  rationale: La présence du feu installé à cet endroit est exprimée naturellement par l’adverbe, sans la tournure peu idiomatique « un feu couché ».
- source_word: ὀψάριον
  choice: du poisson
  rationale: Dans l’usage johannique, le terme désigne du poisson destiné à être mangé; le partitif français évite d’imposer un nombre que le contexte ne précise pas nettement.
- source_word: ἐπικείμενον
  choice: posé dessus
  rationale: 'Préserve explicitement la relation spatiale: le poisson se trouve sur le feu de braises.'
- source_word: ἄρτον
  choice: du pain
  rationale: Traduction non marquée qui ne précise ni la forme ni le nombre des pains au-delà du texte grec.
theological_decisions:
- issue: Présent historique du récit
  choice: Rendre βλέπουσιν par le passé simple « ils virent »
  alternative: 'Conserver le présent vif: « ils voient »'
  rationale: Il s’agit d’un trait narratif plutôt que d’une décision doctrinale; le passé simple produit un récit français naturel tout en maintenant l’ordre des événements.
- issue: Lien verbal avec le reniement de Pierre
  choice: Traduire ἀνθρακιά par « feu de braises » comme en Jean 18.18
  alternative: Employer ici « feu de charbon » ou « brasier »
  rationale: La cohérence lexicale permet au lecteur de percevoir le rappel narratif sans en imposer une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe demeure proche du grec tout en évitant les calques peu naturels. « Feu de braises » est idiomatique et permet de préserver le lien verbal avec Jean 18.18.
