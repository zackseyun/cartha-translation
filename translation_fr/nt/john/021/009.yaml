review_pass:
  verdict: revise
  source_fidelity: 'La formulation « furent descendus à terre » n’est pas la meilleure représentation de ἀπέβησαν εἰς τὴν γῆν : le verbe évoque le fait de quitter l’embarcation et d’arriver à terre, non nécessairement une descente. « Eurent débarqué à terre » rend ce mouvement avec fidélité et naturel. Le reste de la scène (feu de braises, poisson sur le feu, pain) est correctement transmis.'
  naturalness: Le passé simple convient au présent historique βλέπουσιν. Toutefois, « Quand ils furent donc descendus à terre » est lourd et peu idiomatique en français moderne. « Lorsqu’ils eurent débarqué à terre » est plus fluide; « alors » rend la continuité de οὖν sans alourdir la subordonnée.
  terminology: « Feu de braises » rend bien ἀνθρακιά. Il convient de conserver l’annotation signalant que le même mot est employé en Jean 18.18, puisque ce lien lexical est présent dans la piste d’audit anglaise, sans en imposer d’interprétation. « Du poisson » et « du pain » respectent l’absence de précision sur le nombre ou la forme.
  issues:
  - severity: medium
    issue: « furent descendus à terre »
    rationale: Cette tournure suggère une descente et sonne peu naturelle ici. ἀποβαίνω avec εἰς τὴν γῆν désigne plus précisément le débarquement ou l’arrivée à terre.
  - severity: low
    issue: Absence de l’annotation sur « feu de braises »
    rationale: La note anglaise documente le lien verbal de ἀνθρακιά avec Jean 18.18. L’ajouter préserve utilement la piste d’audit et la cohérence terminologique.
  revised_text: Lorsqu’ils eurent débarqué à terre, ils virent alors un feu de braises[b], du poisson posé dessus et du pain.
