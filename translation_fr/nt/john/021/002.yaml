id: JHN.21.2
reference: John 21:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: fr
  text: Simon Pierre, Thomas, appelé Didyme[a], Nathanaël, de Cana en Galilée, les fils de Zébédée et deux autres de ses disciples étaient ensemble.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec « Δίδυμος » signifie « Jumeau ».
    reason: La note explicite le sens du terme grec rendu par « Didyme ».
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: étaient ensemble
  rationale: L’imparfait ἦσαν décrit un état passé, et ὁμοῦ indique qu’ils se trouvaient réunis au même endroit. La formulation française est simple et naturelle.
- source_word: Σίμων Πέτρος
  choice: Simon Pierre
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom et du surnom de l’apôtre.
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: Thomas, appelé Didyme[a]
  rationale: « Didyme » représente la désignation grecque Δίδυμος sans la confondre avec un nom français ordinaire; la note en donne le sens lexical, « Jumeau ».
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: Nathanaël, de Cana en Galilée
  rationale: ἀπό marque ici l’origine. « Cana en Galilée » est une désignation géographique naturelle en français moderne.
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: les fils de Zébédée
  rationale: L’expression grecque elliptique désigne contextuellement les fils de Zébédée; le nom « fils » doit être explicité en français.
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: deux autres de ses disciples
  rationale: 'Cette formulation conserve le sens partitif de ἐκ: deux autres pris parmi ses disciples.'
- source_word: καί … καί
  choice: énumération avec virgules et un dernier « et »
  rationale: Le grec coordonne chaque élément par καί; une énumération française standard en préserve les relations sans lourdeur.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. Les noms suivent leurs formes françaises bibliques usuelles. La ponctuation distingue clairement les personnes énumérées, et le marqueur de note est placé après « Didyme », le terme qu’il explique.
