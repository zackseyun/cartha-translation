reference: John 21:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: fr
  text: 'Il lui dit pour la troisième fois[a] : « Simon, fils de Jean, m’aimes-tu ? » Pierre fut attristé de ce qu’il lui avait demandé pour la troisième fois : « M’aimes-tu ? » Il lui répondit : « Seigneur, tu sais tout ; tu sais[b] que je t’aime. » Jésus lui dit : « Nourris mes brebis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici φιλέω (« aimer, avoir de l’affection »), alors que, dans les deux premières questions, Jésus avait employé ἀγαπάω. Certains interprètes voient une différence significative entre ces verbes ; d’autres estiment que leurs sens se recouvrent dans ce contexte. La traduction emploie « aimer » et n’impose pas une opposition plus nette que ne le permet le grec.
    reason: lexical_alternative
  - marker: b
    text: 'Dans la réponse de Pierre, le grec emploie deux verbes différents pour « savoir » : οἶδα et γινώσκω. Le français les rend naturellement tous deux par « savoir » ici ; leur éventuelle nuance ne peut être explicitée sans surinterpréter le texte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: pour la troisième fois
  rationale: Cette tournure française naturelle exprime clairement la répétition de la question et conserve le motif de la triple interrogation.
- source_word: Σίμων Ἰωάννου
  choice: Simon, fils de Jean
  rationale: Le génitif Ἰωάννου est ici patronymique. « Fils de Jean » traduit directement la leçon grecque, sans lui substituer la forme traditionnelle « fils de Jonas ».
- source_word: φιλεῖς / φιλῶ
  choice: m’aimes-tu ? / je t’aime
  rationale: φιλέω exprime ici l’amour ou l’affection. « Aimer » garde la force relationnelle et solennelle de l’échange sans imposer une opposition sémantique incertaine avec ἀγαπάω dans les questions précédentes.
- source_word: ἐλυπήθη
  choice: fut attristé
  rationale: Le verbe indique que Pierre éprouve de la tristesse ou de la peine. « Fut attristé » convient au registre narratif digne et conserve le poids émotionnel du passage.
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans l’adresse de Pierre à Jésus ressuscité, « Seigneur » rend naturellement κύριε et convient mieux au contexte que le simple titre de politesse « Monsieur ».
- source_word: πάντα σὺ οἶδας
  choice: tu sais tout
  rationale: Cette formulation française directe conserve toute l’étendue de πάντα et l’insistance portée par le pronom σὺ.
- source_word: οἶδας ... γινώσκεις
  choice: tu sais ... tu sais
  rationale: Les deux verbes grecs se rapportent à la connaissance, mais leur éventuelle nuance respective ne peut être reproduite ici en français sans interprétation excessive. La répétition est donc conservée.
- source_word: Βόσκε
  choice: Nourris
  rationale: βόσκω désigne spécifiquement l’action de donner à manger ou de faire paître, à la différence du verbe plus large ποιμαίνω. « Nourris » en conserve le sens direct tout en restant naturel.
- source_word: πρόβατά
  choice: mes brebis
  rationale: πρόβατα désigne les moutons, et non spécifiquement les agneaux. Dans cette image pastorale, « brebis » est idiomatique en français et maintient la distinction avec ἀρνία au verset 15.
theological_decisions:
- issue: Faut-il marquer une opposition nette entre φιλέω et ἀγαπάω dans l’échange entre Jésus et Pierre ?
  choice: Traduire φιλέω par « aimer » sans faire apparaître dans le texte principal une autre catégorie d’amour.
  alternative: Employer des verbes différents, par exemple « aimer » et « avoir de l’affection », afin de rendre l’alternance lexicale.
  rationale: En grec koinè, la différence sémantique entre ces verbes n’est pas assez stable dans ce contexte pour fonder une opposition nette. La note signale l’alternance sans en faire une interprétation théologique obligatoire.
- issue: 'Portée de l’affirmation de Pierre : « tu sais tout »'
  choice: Conserver sans restriction l’affirmation forte de la connaissance de Jésus.
  alternative: Limiter explicitement le propos à la situation présente, par exemple « tu sais tout à ce sujet », ou développer le texte en affirmation doctrinale explicite de l’omniscience.
  rationale: Le grec dit simplement et fortement « tu sais tout ». La traduction garde cette portée sans l’atténuer ni l’élargir par une glose doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. Le dialogue reste direct et solennel. « Fut attristé » maintient une légère élévation narrative sans archaïsme marqué ; « nourris mes brebis » conserve simplement l’image pastorale.
