  to: 'Ce disciple-là que Jésus aimait dit donc à Pierre : « C’est le Seigneur. » Alors Simon Pierre, lorsqu’il entendit que c’était le Seigneur, attacha son vêtement de dessus autour de lui — car il était peu vêtu[a] — et se jeta dans la mer.'
