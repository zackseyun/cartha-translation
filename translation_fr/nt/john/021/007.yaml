id: JHN.21.7
reference: John 21:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: fr
  text: 'Ce disciple-là que Jésus aimait dit donc à Pierre : « C’est le Seigneur. » Alors Simon Pierre, lorsqu’il entendit que c’était le Seigneur, attacha son vêtement de dessus autour de lui — car il était peu vêtu[a] — et se jeta dans la mer.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « nu ». Le mot grec peut désigner une personne entièrement nue ou insuffisamment vêtue, selon le contexte.'
    reason: Alternative lexicale nécessaire pour préserver l’étendue de sens de γυμνός.
lexical_decisions:
- source_word: λέγει οὖν
  choice: Alors ... dit
  rationale: οὖν fait progresser le récit et marque ici la conséquence de la pêche extraordinaire. « Alors » restitue naturellement cette articulation narrative en français.
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: ce disciple-là, celui que Jésus aimait
  rationale: « Ce disciple-là » rend la valeur démonstrative de ἐκεῖνος, tandis que l’apposition conserve la désignation johannique caractéristique.
- source_word: Ὁ κύριός ἐστιν
  choice: C’est le Seigneur !
  rationale: « Seigneur » conserve à la fois la valeur courante du titre κύριος et sa portée christologique dans cette scène de reconnaissance. La tournure présentative « C’est » est idiomatique en français.
- source_word: Σίμων οὖν Πέτρος, ἀκούσας
  choice: Quand Simon Pierre entendit
  rationale: Le participe aoriste ἀκούσας est rendu par une proposition temporelle naturelle. Le lien porté par οὖν ressort déjà de la réaction immédiate décrite dans la phrase.
- source_word: τὸν ἐπενδύτην
  choice: son vêtement de dessus
  rationale: ἐπενδύτης désigne un vêtement porté par-dessus un autre. Cette formulation reste transparente sans préciser indûment sa coupe ou sa fonction.
- source_word: διεζώσατο
  choice: attacha autour de lui
  rationale: Le verbe évoque l’action de serrer ou de fixer un vêtement autour de soi. Cette expression moderne évite l’archaïsme « se ceignit » sans réduire le geste au simple fait de s’habiller.
- source_word: ἦν γὰρ γυμνός
  choice: car il était peu vêtu
  rationale: γυμνός peut désigner une nudité complète ou le fait de ne pas porter les vêtements habituels. « Peu vêtu » convient au contexte de travail sur la barque tout en laissant l’autre sens dans la note.
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: se jeta dans la mer
  rationale: La formulation conserve le caractère vif et volontaire de βάλλω avec le pronom réfléchi, ainsi que le terme « mer » pour θάλασσα.
theological_decisions:
- issue: Valeur de κύριος lors de la reconnaissance de Jésus ressuscité
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » préserve l’ambivalence entre titre d’adresse et confession chargée d’une portée christologique, sans expliciter davantage que le texte.
- issue: État vestimentaire exprimé par γυμνός
  choice: peu vêtu
  alternative: nu
  rationale: Le contexte n’impose pas de trancher en faveur d’une nudité totale. Le choix principal exprime le manque de vêtements appropriés, tandis que la note conserve explicitement le sens plus littéral possible.
translation_notes:
  register: Français international actuel, narratif et digne. « Ce disciple-là » conserve le démonstratif grec sans lourdeur excessive; « vêtement de dessus » reste volontairement générique. Les tirets isolent l’explication parenthétique du narrateur.
