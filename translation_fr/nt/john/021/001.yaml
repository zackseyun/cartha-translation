id: JHN.21.1
reference: John 21:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: fr
  text: Après cela, Jésus se manifesta de nouveau aux disciples, au bord du lac de Tibériade[a]. Voici comment il se manifesta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mer de Tibériade ». Il s’agit du lac aussi appelé mer de Galilée.
    reason: La désignation grecque emploie le mot « mer », tandis que le français moderne appelle habituellement cette étendue d’eau un lac.
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Transition temporelle naturelle en français. Le singulier collectif « cela » reprend idiomatiquement les événements précédents sans imposer l'idée d'une succession immédiate.
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: se manifesta
  rationale: Le pronominal français conserve l'idée que Jésus se rend lui-même visible et se fait connaître; « se manifesta » convient au registre narratif et garde la nuance de dévoilement de φανερόω.
- source_word: πάλιν
  choice: de nouveau
  rationale: Exprime clairement la répétition de la manifestation après les apparitions précédentes.
- source_word: τοῖς μαθηταῖς
  choice: aux disciples
  rationale: Respecte l'absence de possessif explicite dans le grec tout en restant naturel en français.
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: au bord du lac de Tibériade
  rationale: Dans ce cadre narratif, ἐπί avec le génitif situe la scène près de l'étendue d'eau. « Lac » est l'appellation française géographiquement courante, tandis que « de Tibériade » préserve le nom johannique.
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: Voici comment il se manifesta
  rationale: Formulation française fluide qui introduit la manière dont l'événement s'est produit, tout en répétant le verbe comme dans le grec.
theological_decisions:
- issue: Vocabulaire de l'apparition après la résurrection
  choice: se manifesta
  alternative: apparut; se fit connaître
  rationale: « Se manifesta » préserve à la fois la réalité de la rencontre et la nuance de dévoilement intentionnel portée par le verbe grec, sans réduire l'événement à une simple perception visuelle.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe a été légèrement allégée pour éviter une coordination lourde, tout en conservant la répétition littéraire de « se manifesta ».
