reference: John 21:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: fr
  text: 'Pierre se retourna et vit le disciple que Jésus aimait, qui suivait[a]. C’était celui qui, pendant le repas, s’était aussi appuyé contre la poitrine[b] de Jésus et avait dit : « Seigneur, qui est celui qui va te livrer ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui le suivait » ou « qui les suivait » ; le participe grec ne précise pas qui le disciple suivait.
    reason: ambiguïté grammaticale
  - marker: b
    text: 'Le grec évoque la posture de personnes allongées pour prendre un repas ; on pourrait aussi traduire : « s’était incliné sur la poitrine de Jésus ».'
    reason: contexte culturel et variante lexicale
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: se retourna
  rationale: Le participe aoriste introduit l’action de Pierre; le passé simple restitue naturellement la succession narrative.
- source_word: βλέπει
  choice: vit
  rationale: Le présent historique grec est rendu au passé simple, plus naturel dans une narration française au passé.
- source_word: τὸν μαθητὴν
  choice: le disciple
  rationale: « Disciple » est le terme johannique établi et conserve sa portée relationnelle et théologique.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: que Jésus aimait
  rationale: Traduction directe et idiomatique de la relative, avec l’imparfait correspondant à l’action durative exprimée par le grec.
- source_word: ἀκολουθοῦντα
  choice: qui suivait
  rationale: Le grec ne précise pas l’objet du verbe. La formulation française sans complément préserve cette indétermination, explicitée en note.
- source_word: ἀνέπεσεν
  choice: s’était appuyé
  rationale: Dans le contexte d’un repas pris en position allongée, le verbe décrit le mouvement par lequel le disciple s’est incliné ou appuyé contre Jésus.
- source_word: ἐν τῷ δείπνῳ
  choice: pendant le repas
  rationale: Cette expression désigne naturellement le cadre du repas sans lui donner une portée liturgique absente du lexème.
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: contre la poitrine de Jésus
  rationale: « Poitrine » est moderne et précis. La répétition de « Jésus » lève en français une ambiguïté référentielle involontaire.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » rend l’adresse respectueuse à Jésus tout en conservant la résonance johannique de κύριος.
- source_word: ὁ παραδιδούς σε
  choice: celui qui va te livrer
  rationale: Dans le contexte de la Passion, παραδίδωμι signifie remettre Jésus à ses adversaires, avec la connotation de trahison. Le futur proche est idiomatique en français pour l’acte alors imminent.
theological_decisions:
- issue: Présent historique βλέπει
  choice: vit
  alternative: voit
  rationale: Le passé simple convient au récit français et ne modifie pas le contenu théologique.
- issue: Objet implicite de ἀκολουθοῦντα
  choice: qui suivait
  alternative: qui le suivait / qui les suivait
  rationale: Puisque le grec ne nomme pas l’objet, le texte principal conserve cette indétermination plutôt que de décider si le disciple suivait Jésus seul ou Jésus et Pierre.
- issue: Valeur de παραδιδούς
  choice: qui va te livrer
  alternative: qui te trahit
  rationale: « Livrer » conserve l’image lexicale de la remise aux autorités ainsi que sa forte connotation contextuelle de trahison, sans réduire le terme à une seule nuance.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient un registre narratif soutenu mais courant dans les textes bibliques. La division en deux phrases évite l’enchaînement lourd de relatives tout en conservant toutes les relations du texte grec.
