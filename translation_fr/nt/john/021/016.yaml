base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: fr
  text: 'Il lui dit de nouveau, pour la deuxième fois[a] : « Simon, fils de Jean, m’aimes-tu[b] ? » Il lui répondit : « Oui, Seigneur, tu sais que je t’aime. » Jésus lui dit : « Prends soin de mes brebis[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « de nouveau, une deuxième fois », avec une légère redondance qui souligne la répétition.
    reason: source_emphasis
  - marker: b
    text: 'Le grec emploie deux verbes différents pour « aimer » dans cet échange : Jésus utilise agapaō et Pierre utilise phileō. Certains y voient une nuance de sens, d’autres une variation de style. Le texte les traduit tous deux par « aimer » afin de ne pas imposer une distinction incertaine.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « Sois le berger de mes brebis. » Le verbe grec évoque l’ensemble du travail du berger : conduire, protéger et prendre soin du troupeau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: de nouveau, pour la deuxième fois
  rationale: Les deux éléments grecs marquent explicitement la répétition. Cette formulation conserve cette insistance, malgré une légère redondance naturelle dans le récit.
- source_word: Σίμων Ἰωάννου
  choice: Simon, fils de Jean
  rationale: Le génitif Ἰωάννου fonctionne ici comme un patronyme. « Fils de Jean » traduit le texte grec attesté sans importer la forme traditionnelle « fils de Jonas ».
- source_word: ἀγαπᾷς με / φιλῶ σε
  choice: m’aimes-tu ? / je t’aime
  rationale: Le français courant emploie naturellement « aimer » dans les deux répliques. Une note signale la variation réelle entre ἀγαπάω et φιλέω sans lui imposer une différence de sens contestée.
- source_word: Ναί, κύριε
  choice: Oui, Seigneur
  rationale: « Oui » rend sobrement l’affirmation, et « Seigneur » convient à l’adresse révérencieuse de Pierre à Jésus.
- source_word: σὺ οἶδας
  choice: tu sais
  rationale: Le pronom sujet, obligatoire en français, ne peut reproduire à lui seul l’emphase du grec, mais le contexte dialogué la rend suffisamment perceptible.
- source_word: Ποίμαινε
  choice: Prends soin de
  rationale: 'ποιμαίνω désigne l’action globale du berger : conduire, protéger et prendre soin du troupeau. « Prends soin de » est naturel en français moderne et garde ici la portée pastorale grâce à « brebis ».'
- source_word: τὰ πρόβατά μου
  choice: mes brebis
  rationale: « Brebis » conserve l’image concrète du troupeau et le lien d’appartenance à Jésus.
theological_decisions:
- issue: Faut-il différencier ἀγαπάω et φιλέω par deux verbes français ?
  choice: Traduire les deux par « aimer » dans le texte et signaler la variation grecque en note.
  alternative: Traduire ἀγαπάω par « aimer » et φιλέω par « avoir de l’affection pour ».
  rationale: Les deux verbes peuvent se recouvrir dans l’usage johannique. Les différencier fortement dans le texte risquerait d’imposer une nuance affective ou théologique que le passage ne tranche pas.
- issue: Portée pastorale de Ποίμαινε
  choice: « Prends soin de mes brebis »
  alternative: « Sois le berger de mes brebis » ou « Fais paître mes brebis ».
  rationale: La formulation choisie exprime la responsabilité pastorale sans la réduire à l’alimentation ni introduire un titre ecclésiastique absent du verbe grec. La note conserve la métaphore plus littérale.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue direct avec Jésus. La ponctuation française et les incises rendent clairement les changements de locuteur; le nom « Jésus » est explicité dans la dernière incise pour éviter une ambiguïté naturelle en français.
