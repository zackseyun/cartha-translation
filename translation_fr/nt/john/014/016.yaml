id: JHN.14.16
reference: John 14:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: fr
  text: Et moi, je demanderai au Père, et il vous donnera un autre Défenseur[a], afin qu’il soit avec vous pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Soutien », « Conseiller » ou, selon la traduction traditionnelle, « Consolateur » pour le grec παράκλητος.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Et moi, je
  rationale: La crase de καί et ἐγώ associe une liaison au sujet légèrement emphatique. « Et moi, je » rend cette insistance naturelle en français sans la surcharger.
- source_word: ἐρωτήσω
  choice: demanderai
  rationale: Le futur de ἐρωτάω exprime ici une demande adressée au Père. « Demanderai » est direct et actuel, tandis que « prierai » introduirait une coloration religieuse plus marquée que le terme grec ne l’exige.
- source_word: τὸν πατέρα
  choice: au Père
  rationale: Le grec porte l’article mais aucun possessif. « Au Père » respecte l’usage johannique sans ajouter « mon ».
- source_word: ἄλλον
  choice: un autre
  rationale: ἄλλος désigne un autre en relation avec une personne déjà présente. La formulation simple conserve ce rapport implicite avec Jésus sans en préciser davantage la nature.
- source_word: παράκλητον
  choice: Défenseur
  rationale: παράκλητος est un terme riche qui peut évoquer l’assistance, le conseil, la consolation et la défense. « Défenseur » préserve bien sa dimension personnelle, représentative et juridico-relationnelle dans Jean; les autres possibilités importantes figurent en note.
- source_word: δώσει ὑμῖν
  choice: il vous donnera
  rationale: Cette tournure française rend naturellement le futur actif et le complément indirect.
- source_word: ἵνα ᾖ
  choice: afin qu’il soit
  rationale: ἵνα suivi du subjonctif exprime ici le but ou le résultat visé. « Afin qu’il soit » en conserve la nuance et appelle naturellement le subjonctif en français.
- source_word: μεθ’ ὑμῶν
  choice: avec vous
  rationale: μετά avec le génitif signifie simplement « avec »; cette traduction évite de substituer l’idée plus interprétative de présence « parmi » les disciples.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression idiomatique désigne une durée permanente. « Pour toujours » est clair, naturel et fidèle au sens dans ce contexte johannique.
theological_decisions:
- issue: Traduction de παράκλητος dans la promesse de « l’autre » παράκλητος
  choice: Défenseur
  alternative: Soutien, Conseiller ou, selon la traduction traditionnelle, Consolateur
  rationale: « Défenseur » maintient le caractère personnel et la fonction représentative du terme sans réduire celui-ci à une aide impersonnelle ni définir entièrement l’action de l’Esprit. La note conserve la richesse lexicale et la tradition de traduction.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « Et moi, je » conserve l’emphase légère du grec; « afin que » maintient la relation de but ou de résultat. La majuscule à « Défenseur » signale ici une désignation personnelle dans le contexte sans transformer le mot en nom propre explicite.
