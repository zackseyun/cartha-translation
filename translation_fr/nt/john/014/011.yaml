id: JHN.14.11
reference: John 14:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: fr
  text: 'Croyez-moi : je suis dans le Père et le Père est en moi. Sinon, croyez à cause des œuvres elles-mêmes.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le dernier verbe « croyez » n’a pas de complément explicite en grec. On pourrait aussi comprendre : « croyez en vous fondant sur les œuvres elles-mêmes ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: Croyez-moi
  rationale: Le verbe πιστεύω suivi du datif μοι signifie naturellement « croire quelqu’un » ou « croire ce qu’il dit ». « Croyez-moi » est direct, idiomatique et conserve l’appel personnel.
- source_word: ὅτι
  choice: ':'
  rationale: En français, après « Croyez-moi », les deux-points introduisent naturellement le contenu de ce qu’il faut croire, sans donner à ὅτι un sens causal.
- source_word: ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί
  choice: je suis dans le Père et le Père est en moi
  rationale: La répétition de ἐν est conservée afin de maintenir le langage johannique de l’intériorité réciproque, sans le réduire à une paraphrase comme « être un avec ».
- source_word: εἰ δὲ μή
  choice: Sinon
  rationale: '« Sinon » exprime avec naturel l’alternative introduite par l’expression grecque : si la parole de Jésus ne suffit pas comme fondement immédiat.'
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: à cause des œuvres elles-mêmes
  rationale: διά avec l’accusatif indique ici le motif ou le fondement. « Les œuvres elles-mêmes » conserve l’insistance portée par αὐτά.
- source_word: πιστεύετε
  choice: croyez
  rationale: L’impératif reste sans complément explicite, comme en grec. La traduction évite donc d’ajouter « en moi » ou « à ce que je dis ».
theological_decisions:
- issue: L’intériorité réciproque du Fils et du Père
  choice: Conserver « je suis dans le Père et le Père est en moi »
  alternative: « je suis un avec le Père »
  rationale: La formulation littérale préserve à la fois la profondeur de l’unité exprimée et la distinction relationnelle, sans substituer au texte une formulation doctrinale explicative.
- issue: Le fondement de la foi dans les œuvres
  choice: Laisser le second « croyez » sans complément explicite
  alternative: « croyez en moi à cause des œuvres »
  rationale: Le grec ne précise pas l’objet du second impératif. Maintenir cette absence conserve la concision et l’ambiguïté authentique du texte, tandis que les œuvres sont clairement présentées comme fondement de la foi.
translation_notes:
  register: Français international moderne, digne et accessible. « Père » prend une majuscule comme titre divin. Le rythme est resserré; les deux-points rendent clairement la proposition complétive après « Croyez-moi ». Le marqueur [a] est placé après la proposition qu’il explique.
