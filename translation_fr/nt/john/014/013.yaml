id: JHN.14.13
reference: John 14:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: fr
  text: Et tout ce que vous demanderez en mon nom, je le ferai, afin que le Père soit glorifié dans le Fils.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par le Fils ». Le grec dit littéralement « dans le Fils », expression qui peut désigner la sphère dans laquelle le Père est glorifié ou le moyen par lequel il l’est.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: tout ce que
  rationale: La construction relative indéfinie avec ἄν exprime une portée ouverte. « Tout ce que » est naturel en français et en conserve l’ampleur.
- source_word: αἰτήσητε
  choice: vous demanderez
  rationale: Le verbe αἰτέω signifie couramment « demander ». Le futur français convient naturellement après « tout ce que » et rend ici la valeur éventuelle du subjonctif grec avec ἄν.
- source_word: ἐν τῷ ὀνόματί μου
  choice: en mon nom
  rationale: Cette formulation française consacrée reste proche du grec et préserve les dimensions possibles d’autorité, de représentation et d’union avec Jésus sans les réduire à une seule explication.
- source_word: τοῦτο ποιήσω
  choice: je le ferai
  rationale: Le pronom « le » reprend naturellement en français ce qui sera demandé et restitue le démonstratif τοῦτο sans produire la tournure artificielle « cela, je le ferai ».
- source_word: ἵνα
  choice: afin que
  rationale: « Afin que » marque clairement le but introduit par ἵνα dans un registre digne et courant.
- source_word: δοξασθῇ
  choice: soit glorifié
  rationale: Cette forme passive préserve le vocabulaire biblique de la gloire et correspond au subjonctif passif grec.
- source_word: ὁ πατὴρ
  choice: le Père
  rationale: Le grec porte « le Père », sans possessif. La majuscule signale ici le titre divin dans l’usage français.
- source_word: ἐν τῷ υἱῷ
  choice: dans le Fils
  rationale: « Dans » conserve la valeur première de ἐν ainsi que l’ambiguïté entre sphère et moyen, au lieu de trancher en faveur de « par ».
theological_decisions:
- issue: Sens de la demande « en mon nom »
  choice: Maintien de la formulation « en mon nom » sans développement interprétatif.
  alternative: « par mon autorité » ; « en union avec moi » ; « conformément à mon caractère et à ma volonté »
  rationale: L’expression johannique possède plusieurs dimensions relationnelles et théologiques. La formulation directe évite d’imposer une seule interprétation.
- issue: Valeur de ἐν τῷ υἱῷ
  choice: « dans le Fils »
  alternative: « par le Fils »
  rationale: La préposition ἐν peut désigner ici la sphère dans laquelle le Père est glorifié ou le moyen par lequel il l’est. Le texte principal préserve cette tension, et la note signale l’autre rendu possible.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement de la phrase grecque tout en employant des tournures françaises naturelles. Le marqueur de note est placé après « dans le Fils », auquel la note se rapporte.
