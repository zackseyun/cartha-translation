id: JHN.14.20
reference: John 14:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: fr
  text: Ce jour-là, vous saurez que je suis en mon Père, que vous êtes en moi et que je suis en vous.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: Ce jour-là
  rationale: La tournure a une valeur temporelle. « Ce jour-là » est naturelle en français moderne et conserve la précision démonstrative de ἐκείνῃ.
- source_word: γνώσεσθε
  choice: vous saurez
  rationale: Le futur de γινώσκω exprime ici une connaissance ou une prise de conscience future. « Vous saurez » reste naturel et suffisamment large, sans accentuer indûment le processus.
- source_word: ὑμεῖς
  choice: vous
  rationale: Le pronom grec explicite porte une certaine insistance, mais le français n’exige pas l’ajout de « vous-mêmes », qui alourdirait et pourrait surmarquer cette nuance.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit le contenu de ce que les disciples sauront, et non une proposition causale.
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: je suis en mon Père
  rationale: Le français biblique courant « en mon Père » demeure clair, digne et concis, tout en préservant littéralement la préposition ἐν et la métaphore johannique.
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: que vous êtes en moi
  rationale: Le verbe « êtes » est ajouté comme l’exige le français dans cette proposition sans verbe exprimé en grec. La préposition « en » est conservée afin de maintenir le parallélisme et la réciprocité.
- source_word: κἀγὼ ἐν ὑμῖν
  choice: et que je suis en vous
  rationale: κἀγώ signifie « et moi/et je ». La répétition de « en » conserve le langage d’habitation réciproque sans le réduire à une paraphrase interprétative telle que « uni à ».
theological_decisions:
- issue: Langage johannique de l’habitation réciproque (ἐν… ἐν… ἐν)
  choice: 'Conserver « en » dans les trois propositions : « je suis en mon Père, que vous êtes en moi et que je suis en vous »'
  alternative: « je suis uni à mon Père, vous êtes unis à moi et je suis uni à vous »
  rationale: La répétition de ἐν exprime des réalités relationnelles et théologiques riches. La traduction littérale préserve la métaphore et sa tension, au lieu de la ramener à la seule notion d’union.
- issue: Relation de Jésus avec le Père
  choice: « je suis en mon Père »
  alternative: « je suis un avec mon Père » ou « je suis auprès de mon Père »
  rationale: Cette formulation ne dilue pas la portée christologique du texte et n’y introduit pas non plus une explication doctrinale plus précise que le grec.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe coordonnée garde le rythme de la phrase grecque. « En mon Père » est légèrement solennel, mais demeure idiomatique dans ce contexte et permet de conserver exactement la triple image exprimée par ἐν.
