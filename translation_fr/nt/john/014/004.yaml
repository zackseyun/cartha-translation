  text: καὶ ὅπου ἐγὼ ὑπάγω οἴδατε ⸂τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/004.yaml
  text: And you know the way where I am going[a].
translation:
  language: fr
  text: Et là où je vais, vous connaissez le chemin[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « Et vous savez où je vais, et vous connaissez le chemin. »'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui relie cette affirmation à ce qui précède, sans ajouter d’emphase.
- source_word: ὅπου
  choice: là où
  rationale: Adverbe locatif rendu naturellement en français dans la proposition indiquant la destination.
- source_word: ἐγὼ
  choice: je
  rationale: Pronom sujet explicite, requis en français; aucune emphase supplémentaire n’est ajoutée.
- source_word: ὑπάγω
  choice: je vais
  rationale: Le présent exprime ici le mouvement ou le départ imminent; «je vais» reste naturel et évite de préciser excessivement la nuance par «je pars».
- source_word: οἴδατε
  choice: vous connaissez
  rationale: οἶδα a une forme de parfait mais un sens présent. Avec «le chemin» comme complément, «connaître» est l’expression française idiomatique.
- source_word: τὴν ὁδόν
  choice: le chemin
  rationale: ὁδός peut désigner une route, un chemin ou, figurativement, le moyen d’arriver quelque part. «Le chemin» convient au contexte tout en préservant la portée développée au verset 6.
theological_decisions:
- issue: Ordre des propositions et rapport entre la destination et «le chemin»
  choice: Et vous connaissez le chemin pour aller là où je vais.
  alternative: Et là où je vais, vous connaissez le chemin.
  rationale: Le grec place d’abord la proposition locative, mais le français naturel exprime clairement le rapport entre le chemin et la destination avec «pour aller». Cet ajout fonctionnel ne détermine pas ce qu’est le chemin et préserve la tension qui conduit à la question de Thomas au verset suivant.
- issue: Variante textuelle plus longue
  choice: Retenir le texte court du SBLGNT dans le corps du verset.
  alternative: Et vous savez où je vais, et vous connaissez le chemin.
  rationale: La formulation plus longue appartient à une variante manuscrite et ne doit pas être intégrée silencieusement au texte principal; elle est signalée en note.
translation_notes:
  register: Français international moderne, simple et digne. «Pour aller là où» rend idiomatiquement le lien syntaxique, tandis que «le chemin» conserve la métaphore et son ouverture théologique.
