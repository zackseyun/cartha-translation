source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: fr
  text: Et si je m’en vais et vous prépare une place, je reviendrai[a][b] et je vous prendrai auprès de moi, afin que là où je suis, vous soyez vous aussi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je viens de nouveau ». Le grec emploie une forme au présent qui a ici un sens futur.'
    reason: lexical_alternative
  - marker: b
    text: 'Les interprétations divergent : cette venue peut désigner particulièrement les apparitions de Jésus après sa résurrection, la venue de l’Esprit, son retour final, ou une promesse à plusieurs niveaux englobant plusieurs de ces événements.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: si je m’en vais
  rationale: La construction avec ἐάν et le subjonctif présente une éventualité future. « Je m’en vais » est naturel en français et convient au contexte du départ de Jésus sans préciser davantage sa nature.
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: vous prépare une place
  rationale: Cette formulation directe rend ἑτοιμάζω (« préparer »), τόπος (« place ») et le datif ὑμῖν, sans développer ce que désigne la place.
- source_word: πάλιν ἔρχομαι
  choice: je reviendrai
  rationale: Le présent grec ἔρχομαι a ici une valeur future; avec πάλιν, le français idiomatique « je reviendrai » exprime clairement la promesse. Une note signale la forme présente du grec.
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: je vous prendrai auprès de moi
  rationale: « Prendre auprès de moi » exprime à la fois l’action de παραλαμβάνω et l’orientation relationnelle de πρὸς ἐμαυτόν, sans le ton archaïque que pourrait avoir « recevoir à moi ».
- source_word: ἵνα
  choice: afin que
  rationale: « Afin que » conserve clairement la valeur de but de ἵνα dans un registre digne et courant.
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: là où je suis
  rationale: Le français n’a pas besoin de redoubler le pronom sujet pour rendre la proposition naturellement; « là » rend la construction plus fluide sans ajouter de lieu précis.
- source_word: καὶ ὑμεῖς ἦτε
  choice: vous soyez vous aussi
  rationale: Le subjonctif « soyez » convient à la proposition de but introduite par « afin que », et « vous aussi » restitue καί ainsi que l’insistance du pronom ὑμεῖς.
theological_decisions:
- issue: Nature du retour promis par πάλιν ἔρχομαι
  choice: Présenter une promesse orientée vers l’avenir sans en préciser le mode ni le moment.
  alternative: Y voir exclusivement les apparitions après la résurrection, la venue de l’Esprit, le retour final de Jésus, ou une promesse à plusieurs niveaux.
  rationale: Le verset promet que Jésus viendra de nouveau et prendra les disciples auprès de lui, mais il ne tranche pas à lui seul entre les principales identifications proposées. La traduction conserve cette ouverture interprétative.
translation_notes:
  register: Français international moderne, naturel et digne. Le futur « je reviendrai » évite une tournure française artificielle tout en signalant en note la forme présente du grec. Les termes restent concrets et relationnels, sans imposer une lecture eschatologique particulière.
