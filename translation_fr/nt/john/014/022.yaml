source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: fr
  text: 'Judas — non pas l’Iscariote — lui dit : « Seigneur, qu’est-il donc arrivé pour que tu aies l’intention de te manifester à nous et non au monde ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent narratif français, naturel dans le récit biblique et fidèle à l’aspect formel du texte.
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: Judas — non pas l’Iscariote —
  rationale: La précision appositive distingue explicitement ce Judas de Judas l’Iscariote. Les tirets rendent clairement l’incise en français moderne.
- source_word: Κύριε
  choice: Seigneur
  rationale: Ce vocatif conserve à la fois la marque de respect et la portée possible du titre κύριος dans l’Évangile selon Jean.
- source_word: τί γέγονεν
  choice: que s’est-il passé
  rationale: Le parfait de γίνομαι évoque un fait survenu dont la situation présente résulte ; cette formulation française est naturelle et en garde la force.
- source_word: ὅτι
  choice: pour que
  rationale: Dans la construction interrogative, ὅτι relie ce qui s’est passé à l’intention annoncée de Jésus. « Pour que » exprime naturellement en français ce rapport sans trancher excessivement entre explication et conséquence.
- source_word: ἡμῖν
  choice: à nous
  rationale: Le datif désigne simplement les bénéficiaires de cette révélation, sans ajout interprétatif.
- source_word: μέλλεις
  choice: tu ailles
  rationale: Avec l’infinitif, μέλλω indique ici une action projetée ou destinée à se produire. La tournure française après « pour que » rend cette orientation future sans insister indûment sur l’imminence.
- source_word: ἐμφανίζειν σεαυτόν
  choice: te révéler
  rationale: Le verbe peut désigner le fait de se rendre visible ou de se faire connaître. « Te révéler » est actuel, clair et conserve la dimension réflexive ainsi que l’ambiguïté entre manifestation et connaissance.
- source_word: κόσμῳ
  choice: au monde
  rationale: « Monde » préserve le vocabulaire johannique et sa profondeur théologique sans le réduire d’emblée à l’humanité entière ou au système humain opposé à Dieu.
theological_decisions:
- issue: Sens johannique de κόσμος
  choice: le monde
  alternative: l’humanité en général ; le monde incrédule opposé à Dieu
  rationale: Le verset ne détermine pas à lui seul toutes les nuances du terme. Le conserver littéralement laisse le contexte johannique maintenir cette tension.
- issue: Nature de la manifestation exprimée par ἐμφανίζειν
  choice: te révéler
  alternative: te manifester ; te faire connaître
  rationale: « Te révéler » permet de ne pas limiter l’action à une apparition visible ni de la réduire à une communication intellectuelle.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le présent narratif « dit » convient au récit français. La question conserve son étonnement devant un changement apparent de situation, sans expliciter davantage le contraste entre les disciples et le monde.
