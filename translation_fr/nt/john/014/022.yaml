review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est bien rendu : Judas, explicitement distingué de l’Iscariote, interroge Jésus sur le fait qu’il entend se révéler aux disciples plutôt qu’au monde. Toutefois, « tu ailles te révéler » est une manière indirecte et peu idiomatique de rendre μέλλεις ; elle risque aussi de faire sentir un déplacement. « Aies l’intention de » rend mieux la valeur prospective/intentionnelle de μέλλω dans une syntaxe française naturelle.'
  naturalness: Le présent narratif « lui dit », l’incise avec tirets et « Seigneur » conviennent au français international moderne. La correction proposée fluidifie la question et préserve son étonnement sans introduire d’explication doctrinale.
  terminology: « Judas », « l’Iscariote », « Seigneur », « te manifester » et « le monde » sont appropriés. « Le monde » conserve volontairement l’ouverture sémantique de κόσμος dans Jean. « Te manifester » correspond directement à ἐμφανίζειν tout en restant intelligible dans un registre biblique moderne.
  issues:
  - severity: medium
    issue: Rendu de μέλλεις par « tu ailles te révéler »
    rationale: Après « pour que », cette tournure est grammaticalement possible, mais elle est moins naturelle ici et peut évoquer inutilement l’idée d’aller quelque part. Le grec marque une intention ou une action projetée ; « tu aies l’intention de te manifester » rend explicitement cette valeur sans ajouter l’idée d’obligation ou d’imminence.
  revised_text: 'Judas — non pas l’Iscariote — lui dit : « Seigneur, qu’est-il donc arrivé pour que tu aies l’intention de te manifester à nous et non au monde ? »'
