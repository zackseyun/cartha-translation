  rationale: La révision ne modifie pas le sens du passage. Elle remplace seulement une périphrase française peu fluide par une formulation qui rend plus précisément la valeur prospective de μέλλω. « Donc » exprime naturellement la nuance interrogative de surprise de τί γέγονεν sans résoudre la cause implicite. Aucun renvoi de note n’est requis.
