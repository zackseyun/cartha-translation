id: JHN.14.27
reference: John 14:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: fr
  text: Je vous laisse la paix ; je vous donne ma paix. Je ne vous la donne pas comme le monde la donne. Que votre cœur ne soit pas troublé et qu’il ne perde pas courage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qu’il n’ait pas peur » ou « qu’il ne devienne pas craintif ». Le verbe grec exprime le fait de céder à la peur ou de perdre courage.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: la paix
  rationale: « Paix » conserve l’étendue du terme grec, qui peut évoquer davantage que l’absence de conflit, sans en réduire ici le sens à la tranquillité intérieure, au bien-être ou à la réconciliation.
- source_word: ἀφίημι
  choice: je vous laisse
  rationale: Cette formulation rend naturellement l’idée de laisser quelque chose aux disciples. « Je vous lègue » accentuerait trop une possible nuance testamentaire.
- source_word: εἰρήνην τὴν ἐμὴν
  choice: ma paix
  rationale: Le possessif distingue avec force la paix de Jésus de celle que le monde peut donner ; « ma paix » le fait de manière concise et naturelle en français.
- source_word: δίδωμι
  choice: je vous donne / la donne
  rationale: Le présent simple restitue le verbe répété et maintient le contraste entre le don de Jésus et celui du monde.
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν
  choice: Je ne vous la donne pas comme le monde la donne
  rationale: La reprise pronominale est idiomatique en français et conserve explicitement la comparaison ainsi que la répétition du verbe « donner ».
- source_word: κόσμος
  choice: le monde
  rationale: Ce choix garde la résonance johannique du terme sans la restreindre par une paraphrase telle que « la société humaine » ou « l’ordre du monde ».
- source_word: μὴ ταρασσέσθω ὑμῶν ἡ καρδία
  choice: Que votre cœur ne soit pas troublé
  rationale: Cette tournure respecte l’impératif grec et le singulier collectif « votre cœur », tout en reprenant naturellement l’expression de Jean 14.1.
- source_word: μηδὲ δειλιάτω
  choice: et qu’il ne perde pas courage
  rationale: Le verbe δειλιάω exprime le fait de devenir craintif ou de céder à la peur. « Ne perde pas courage » marque la différence avec « être troublé » et évite la connotation accusatrice de « lâche ».
theological_decisions:
- issue: Nature de la paix donnée par Jésus
  choice: Conserver simplement « la paix » et « ma paix »
  alternative: Préciser qu’il s’agit de tranquillité intérieure, de plénitude eschatologique ou de réconciliation avec Dieu
  rationale: Le verset ne définit pas cette paix de manière étroite. Le terme général préserve sa richesse théologique et ne tranche pas entre ses dimensions possibles.
- issue: Valeur de δειλιάω
  choice: « qu’il ne perde pas courage » dans le texte, avec les nuances de peur signalées en note
  alternative: « qu’il n’ait pas peur » ou « qu’il ne devienne pas craintif »
  rationale: Le choix principal exprime la perte de courage impliquée par le verbe, tandis que la note maintient ouvertes les autres formulations lexicalement possibles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le parallélisme et les répétitions du grec sans produire un ordre des mots artificiel. Le singulier collectif « votre cœur » est maintenu.
