id: JHN.14.31
reference: John 14:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: fr
  text: Mais pour que le monde sache que j’aime le Père, j’agis exactement comme le Père me l’a commandé.[a] Levez-vous, partons d’ici.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Mais afin que le monde sache que j’aime le Père, et comme le Père me l’a commandé, ainsi j’agis. »'
    reason: La formulation principale réorganise la corrélation grecque καθώς…οὕτως pour produire un français naturel; la note en conserve l’ordre et la structure plus littéraux.
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Conserve la valeur adversative qui relie la phrase à ce qui précède, dans un français naturel.
- source_word: ἵνα γνῷ
  choice: pour que … sache
  rationale: Rend la proposition de but introduite par ἵνα avec le subjonctif aoriste, sans la transformer en simple conséquence.
- source_word: ὁ κόσμος
  choice: le monde
  rationale: Préserve le vocabulaire caractéristique de Jean et sa portée collective, plutôt que de l’expliciter par « les gens du monde ».
- source_word: ἀγαπῶ
  choice: j’aime
  rationale: Le présent simple exprime naturellement en français le présent grec et conserve le champ lexical de l’amour.
- source_word: τὸν πατέρα
  choice: le Père
  rationale: Respecte l’article grec et le titre relationnel sans ajouter le possessif « mon ».
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: j’agis exactement comme le Père me l’a commandé
  rationale: La réorganisation rend idiomatiquement en français la corrélation καθώς…οὕτως (« comme…ainsi »). « Commandé » maintient la force de ἐντέλλομαι, et « exactement » exprime la correspondance marquée par la construction corrélative.
- source_word: Ἐγείρεσθε
  choice: Levez-vous
  rationale: Rend clairement l’impératif pluriel dans un registre courant et digne.
- source_word: ἄγωμεν
  choice: partons
  rationale: Le subjonctif exhortatif à la première personne du pluriel se rend naturellement par l’impératif français « partons ».
- source_word: ἐντεῦθεν
  choice: d’ici
  rationale: Indique directement le lieu que Jésus et les disciples sont invités à quitter.
theological_decisions:
- issue: Titre relationnel πατήρ dans la christologie johannique
  choice: le Père
  alternative: mon Père
  rationale: Le grec ne comporte aucun possessif explicite. « Le Père » préserve la formulation du texte et la relation Père-Fils sans expansion interprétative.
- issue: Force de ἐντέλλομαι dans la relation du Père au Fils
  choice: commandé
  alternative: demandé ou indiqué
  rationale: Le verbe désigne un commandement ou une charge. La traduction ne doit pas en atténuer la force pour des motifs doctrinaux.
- issue: Rapport syntaxique entre la proposition de but et οὕτως ποιῶ
  choice: j’agis exactement comme le Père me l’a commandé
  alternative: et, comme le Père me l’a commandé, ainsi j’agis
  rationale: La formulation française place naturellement l’action principale avant la comparaison tout en gardant le but (« pour que »), l’amour de Jésus pour le Père et son obéissance. La note conserve l’ordre et la corrélation plus explicites du grec.
translation_notes:
  register: Français international moderne, clair et digne. « Levez-vous, partons d’ici » reste direct et oral sans archaïsme. La première phrase est réorganisée selon la syntaxe française tout en conservant la proposition de but et la force du commandement.
