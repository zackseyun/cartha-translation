id: JHN.14.8
reference: John 14:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: fr
  text: 'Philippe lui dit : « Seigneur, montre-nous le Père, et cela nous suffit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγει
  choice: dit
  rationale: Le présent historique grec introduit le dialogue; le passé composé serait possible, mais le présent de narration « dit » est naturel et concis en français biblique moderne tout en conservant la forme du grec.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom au datif désigne le destinataire de la parole; « lui dit » est la tournure française idiomatique.
- source_word: Φίλιππος
  choice: Philippe
  rationale: Forme française conventionnelle du nom propre grec.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif κύριε peut exprimer une adresse respectueuse ou le titre « Seigneur ». Dans ce contexte johannique où Philippe s'adresse à Jésus, « Seigneur » préserve la portée possible du titre sans l'affaiblir.
- source_word: δεῖξον
  choice: montre-nous
  rationale: L'impératif aoriste demande directement que le Père soit rendu visible ou connu; « montre-nous » restitue simplement cette demande.
- source_word: τὸν πατέρα
  choice: le Père
  rationale: Dans le contexte, le terme désigne Dieu comme Père; la majuscule française signale cette référence déterminée sans ajouter de qualificatif.
- source_word: καὶ
  choice: et
  rationale: La coordination simple du grec est conservée.
- source_word: ἀρκεῖ ἡμῖν
  choice: cela nous suffit
  rationale: ἀρκέω signifie « suffire ». La construction française « cela nous suffit » rend naturellement le présent et le datif ἡμῖν.
theological_decisions:
- issue: Valeur de Κύριε dans l'adresse à Jésus
  choice: Seigneur
  alternative: Maître / Monsieur
  rationale: « Seigneur » conserve à la fois le respect de l'adresse et la portée christologique possible de κύριος dans Jean. « Monsieur » serait ici trop faible, tandis que « Maître » préciserait autrement une nuance que le mot grec ne tranche pas à lui seul.
translation_notes:
  register: Français moderne, digne et direct. La syntaxe brève du dialogue grec est conservée. « Cela nous suffit » est plus naturel en français que le calque « c'est assez pour nous » et n'explicite pas davantage ce que Philippe attend de cette révélation.
