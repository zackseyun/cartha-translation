  text: Ταῦτα λελάληκα ὑμῖν παρ’ ὑμῖν μένων·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/025.yaml
  text: I have spoken these things to you while staying with you[a].
translation:
  language: fr
  text: Je vous ai dit tout cela alors que je demeurais avec vous[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « alors que je suis avec vous » ou « pendant que je reste auprès de vous ». Le grec emploie le participe du verbe « demeurer », fréquent dans l’Évangile selon Jean.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: tout cela
  rationale: Le démonstratif neutre pluriel renvoie aux enseignements précédents. « Tout cela » en restitue naturellement la portée collective en français moderne.
- source_word: λελάληκα
  choice: je vous ai dit
  rationale: Le passé composé rend naturellement le parfait grec et présente ces paroles comme déjà prononcées, avec une pertinence toujours actuelle. En français, « dire quelque chose à quelqu’un » est plus idiomatique que « parler ces choses ».
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom désigne les disciples au pluriel. Le français « vous » conserve cette adresse sans ajout explicatif.
- source_word: παρ’ ὑμῖν
  choice: avec vous
  rationale: παρά avec le datif exprime ici la présence et la proximité de Jésus auprès de ses disciples ; « avec vous » est la formulation française la plus naturelle.
- source_word: μένων
  choice: pendant que je demeure
  rationale: Le participe présent indique une situation simultanée à la parole. « Demeure » conserve le lien lexical avec le verbe μένω, récurrent dans Jean, tout en restant intelligible.
theological_decisions:
- issue: Maintien de la continuité lexicale du verbe johannique μένω
  choice: pendant que je demeure avec vous
  alternative: pendant que je suis avec vous ; pendant mon séjour auprès de vous
  rationale: « Demeure » garde perceptible le vocabulaire récurrent de Jean sans lui imposer ici un sens doctrinal supplémentaire. La note signale des formulations françaises plus idiomatiques.
translation_notes:
  register: Français international moderne, simple et digne. « Tout cela » évite le calque peu naturel « ces choses ». Le choix légèrement marqué de « demeure » préserve l’écho johannique de μένω, tandis que la note donne des équivalents plus courants.
