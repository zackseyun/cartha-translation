id: JHN.14.18
reference: John 14:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: fr
  text: Je ne vous laisserai pas orphelins[a] ; je viens vers vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je ne vous laisserai pas dans la condition d’orphelins. » L’image grecque est celle d’enfants laissés sans la présence ni les soins de leurs parents.'
    reason: lexical_alternative
  - marker: b
    text: « Je viens vers vous » peut renvoyer aux apparitions de Jésus après sa résurrection, à sa venue par l’Esprit Saint ou à son retour futur ; la formulation grecque n’impose pas une seule interprétation.
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκ
  choice: ne… pas
  rationale: La négation grecque porte simplement sur le verbe au futur ; la négation française courante « ne… pas » la rend sans ajouter d’emphase.
- source_word: ἀφήσω
  choice: laisserai
  rationale: Dans ce contexte, ἀφίημι signifie laisser quelqu’un dans une certaine situation. « Laisserai » est naturel et conserve le lien direct avec l’attribut « orphelins », sans renforcer le texte par « abandonnerai ».
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom accusatif pluriel désigne les disciples auxquels Jésus s’adresse ; « vous » en restitue directement le nombre et la fonction.
- source_word: ὀρφανούς
  choice: orphelins
  rationale: Le terme désigne concrètement des personnes privées de parents et, par extension, privées de soutien ou de protection. « Orphelins » maintient l’image familiale sans la réduire à un simple sentiment d’abandon.
- source_word: ἔρχομαι
  choice: je viens
  rationale: Le présent grec peut exprimer une venue proche ou présentée avec vivacité. Le présent français conserve cette immédiateté et évite de préciser à tort le moment ou la forme de cette venue.
- source_word: πρὸς ὑμᾶς
  choice: vers vous
  rationale: πρός avec l’accusatif marque ici le mouvement en direction des disciples. « Vers vous » est idiomatique et évite l’ambiguïté française possible de « venir à vous », qui peut aussi signifier solliciter quelqu’un.
theological_decisions:
- issue: Référent et moment de « je viens vers vous »
  choice: Conserver la formulation au présent sans identifier précisément cette venue.
  alternative: Préciser qu’il s’agit soit des apparitions de Jésus après sa résurrection, soit de sa venue par l’Esprit Saint, soit de son retour futur.
  rationale: Le contexte évoque l’Esprit, mais la formulation peut également renvoyer à la présence personnelle de Jésus après la résurrection ou à son retour futur. Le grec ne contraint pas à choisir un seul référent ; la traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, simple et digne. La phrase conserve l’image concrète des orphelins et le présent saisissant de « je viens », tout en évitant des termes plus interprétatifs comme « abandonner » ou « revenir ».
