  terminology: « Maison de mon Père », « demeures » et « une place » respectent l’imagerie et l’amplitude lexicale du grec. La majuscule à « Père » est cohérente avec l’usage français pour Dieu dans ce discours. Les deux notes conservent utilement l’alternative lexicale et l’ambiguïté de ponctuation/construction autour de ὅτι.
