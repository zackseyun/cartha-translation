source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: fr
  text: Dans la maison de mon Père, il y a de nombreuses demeures[a]. S’il n’en était pas ainsi, vous aurais-je dit que je pars vous préparer une place[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de nombreuses chambres ». Le mot grec désigne des lieux où l’on séjourne ou demeure ; « demeures » est plus large et garde un lien avec le thème de demeurer dans ce chapitre.'
    reason: lexical_alternative
  - marker: b
    text: 'Autre ponctuation possible : « S’il n’en était pas ainsi, je vous l’aurais dit, car je pars vous préparer une place. » La phrase grecque peut aussi être comprise comme une déclaration plutôt que comme une question rhétorique.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: maison
  rationale: « Maison » rend naturellement le sens concret de οἰκία et conserve l’expression johannique « la maison de mon Père », sans l’interpréter comme « famille » ou « maisonnée ».
- source_word: πατρός μου
  choice: mon Père
  rationale: Cette formulation française rend idiomatiquement le génitif grec. La majuscule signale que Jésus parle de Dieu, sans ajouter une précision doctrinale au texte.
- source_word: μοναὶ πολλαί
  choice: de nombreuses demeures
  rationale: μονή désigne un lieu où l’on demeure ou séjourne. « Demeures » reste plus large que « chambres » et maintient un écho lexical avec le thème de demeurer en Jean 14, notamment au verset 23.
- source_word: εἰ δὲ μή
  choice: S’il n’en était pas ainsi
  rationale: Cette tournure explicite naturellement en français la condition elliptique grecque, dont le contenu renvoie à l’affirmation précédente.
- source_word: εἶπον ἂν ὑμῖν
  choice: vous aurais-je dit
  rationale: Le conditionnel passé rend l’aoriste accompagné de ἄν dans ce contexte irréel; l’inversion exprime la lecture interrogative retenue.
- source_word: ὅτι
  choice: que
  rationale: Dans la lecture principale, ὅτι introduit le contenu de ce que Jésus aurait dit. L’autre possibilité, où il signifie « car » ou « parce que », est signalée en note.
- source_word: πορεύομαι
  choice: je vais
  rationale: Le présent grec prend ici une valeur de départ imminent. « Je vais » est naturel et garde cette immédiateté, même si le français peut momentanément évoquer le semi-auxiliaire du futur; le complément de but clarifie le mouvement.
- source_word: ἑτοιμάσαι
  choice: préparer
  rationale: L’infinitif a une valeur de but, rendue clairement par « préparer » après le verbe de mouvement.
- source_word: τόπον
  choice: une place
  rationale: τόπος est un terme large. « Une place » évite de le réduire à une « chambre » et s’accorde avec « demeures » sans imposer une architecture précise.
- source_word: ὑμῖν
  choice: vous
  rationale: Le pronom français rend le datif bénéficiaire pluriel dans « vous préparer une place »; il n’est pas nécessaire d’ajouter « à tous ».
theological_decisions:
- issue: Sens de μονή dans l’imagerie eschatologique
  choice: de nombreuses demeures
  alternative: de nombreuses chambres; de nombreuses résidences
  rationale: « Demeures » préserve l’idée d’un lieu où l’on reste sans importer l’image moderne de somptueuses « mansions » ni affirmer que le mot désigne précisément des pièces à l’intérieur d’un bâtiment.
- issue: Ponctuation et construction de la seconde partie du verset
  choice: 'Question rhétorique : « S’il n’en était pas ainsi, vous aurais-je dit que je vais vous préparer une place ? »'
  alternative: 'Déclaration : « S’il n’en était pas ainsi, je vous l’aurais dit, car je vais vous préparer une place. »'
  rationale: Le texte grec ancien ne portait pas la ponctuation moderne, et la syntaxe permet de rattacher ὅτι soit au contenu de « dire », soit à une proposition causale. La lecture interrogative est cohérente et naturelle, mais l’ambiguïté réelle est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Demeures » appartient à un registre légèrement soutenu mais reste courant et compréhensible; il convient à l’image tout en évitant le caractère archaïque ou somptueux de « mansions ». La syntaxe interrogative demeure fluide à l’oral comme à l’écrit.
