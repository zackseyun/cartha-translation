id: JHN.14.19
reference: John 14:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: fr
  text: Encore un peu de temps, et le monde ne me verra plus ; mais vous, vous me verrez[a]. Car moi, je vis, et vous aussi, vous vivrez[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec traduit par « voir » dans les deux cas peut aussi évoquer le fait de contempler ou d’observer, et non un simple regard.
    reason: lexical_alternative
  - marker: b
    text: « Vous aussi, vous vivrez » peut désigner la participation des disciples à la vie de résurrection de Jésus, leur vie spirituelle en union avec lui, ou les deux.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: Encore un peu de temps
  rationale: Expression temporelle naturelle qui indique qu’il reste peu de temps avant le changement annoncé.
- source_word: ὁ κόσμος
  choice: le monde
  rationale: Conserve le terme johannique établi sans le réduire soit à l’humanité opposée à Jésus, soit à un système abstrait.
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: ne me verra plus / vous me verrez
  rationale: « Voir » convient naturellement aux deux occurrences et préserve l’ambiguïté entre vision physique et perception plus profonde. Le futur français explicite le changement imminent indiqué par le contexte temporel.
- source_word: οὐκέτι
  choice: ne… plus
  rationale: Rend avec concision la cessation prochaine exprimée par le grec.
- source_word: δὲ
  choice: mais
  rationale: Marque clairement le contraste entre le monde et les disciples.
- source_word: ὅτι
  choice: Parce que
  rationale: 'Rend la valeur causale la plus naturelle : la vie des disciples repose sur celle de Jésus.'
- source_word: ἐγὼ ζῶ
  choice: moi, je vis
  rationale: Maintient le présent et fait entendre l’emphase du pronom grec ἐγώ sans ajouter d’interprétation.
- source_word: καὶ ὑμεῖς ζήσετε
  choice: vous aussi, vous vivrez
  rationale: Le futur est conservé, et « aussi » rend καί en soulignant le lien entre la vie de Jésus et celle des disciples.
theological_decisions:
- issue: Nature de la vision de Jésus par les disciples
  choice: Employer simplement « voir », sans préciser la modalité.
  alternative: Les apparitions après la résurrection; la perception spirituelle du Christ ressuscité; ou une référence à plusieurs niveaux.
  rationale: Le grec ne tranche pas entre une vision physique et une perception spirituelle; la formulation conserve cette tension johannique.
- issue: Portée de « vous vivrez »
  choice: Traduire largement par « vous aussi, vous vivrez ».
  alternative: La vie spirituelle présente, la vie de résurrection future, ou la participation globale à la vie de Jésus.
  rationale: Le futur de ζάω peut porter plusieurs résonances théologiques; la traduction ne doit pas en imposer une seule.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise pronominale « vous, vous » et « moi, je » restitue les contrastes emphatiques du grec tout en restant naturelle à l’oral comme à l’écrit.
