id: JHN.14.15
reference: John 14:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: fr
  text: Si vous m’aimez, vous garderez mes commandements.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous obéirez à mes commandements ». Le verbe grec peut signifier garder, observer, préserver ou obéir; « garderez » en conserve le sens plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: Si
  rationale: Introduit une proposition conditionnelle. « Si » est le rendu français le plus naturel; « chaque fois que » ajouterait une valeur itérative que le contexte n’impose pas.
- source_word: ἀγαπᾶτέ
  choice: vous aimez
  rationale: Présent actif au subjonctif, deuxième personne du pluriel, après ἐάν. Le présent français convient naturellement et conserve le vocabulaire de l’amour.
- source_word: με
  choice: m’
  rationale: Pronom complément d’objet direct désignant Jésus; l’élision devant « aimez » est exigée en français.
- source_word: ἐντολάς
  choice: commandements
  rationale: « Commandements » conserve le poids du terme et son emploi johannique reconnaissable; « ordres » ou « instructions » seraient possibles, mais plus étroits ou moins solennels.
- source_word: τὰς ἐμὰς
  choice: mes
  rationale: La construction grecque avec article et possessif se rend naturellement par l’adjectif possessif français. L’expansion « les commandements qui sont les miens » serait inutilement lourde.
- source_word: τηρήσετε
  choice: vous garderez
  rationale: Futur actif de l’indicatif, deuxième personne du pluriel. « Garder » préserve l’éventail de sens de τηρέω — garder, observer, conserver fidèlement — sans le réduire à la seule obéissance. Le futur est maintenu plutôt que transformé en impératif.
theological_decisions:
- issue: Faut-il rendre τηρήσετε comme un ordre ou comme une affirmation au futur?
  choice: 'Affirmation au futur : « vous garderez »'
  alternative: 'Valeur impérative : « gardez mes commandements »'
  rationale: 'La forme grecque est un futur de l’indicatif, non un impératif. La traduction conserve donc la tension du texte : l’amour pour Jésus est présenté comme conduisant à garder ses commandements, sans transformer cette relation en ordre direct.'
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et mémorable. « Garderez » est naturel dans le registre biblique courant tout en demeurant compréhensible; la note explicite l’autre rendu idiomatique possible.
