id: JHN.14.21
reference: John 14:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: fr
  text: Celui qui a mes commandements et qui les garde, c’est lui qui m’aime. Celui qui m’aime sera aimé de mon Père ; moi aussi, je l’aimerai et je me révélerai à lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je me montrerai à lui ». Le verbe grec peut désigner le fait de se rendre visible ou de se faire connaître ; dans ce contexte, il peut évoquer une révélation personnelle.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἔχων
  choice: Celui qui a
  rationale: L’article suivi du participe présent désigne ici une personne représentative. « Celui qui a » conserve la structure et la valeur générique du grec dans un français naturel.
- source_word: ἐντολάς
  choice: commandements
  rationale: « Commandements » maintient la portée normative de ἐντολή et correspond bien à l’usage johannique.
- source_word: τηρῶν
  choice: garde
  rationale: Dans Jean, τηρέω peut exprimer le fait de garder, observer et demeurer fidèle à une parole ou à des commandements. « Garde » préserve cette richesse mieux que le seul « obéit ».
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: c’est lui qui m’aime
  rationale: 'Cette tournure française rend l’identification emphatique portée par ἐκεῖνος : c’est précisément cette personne qui aime Jésus.'
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: aime / sera aimé / aimerai
  rationale: La répétition du même lexème conserve le lien verbal et théologique intentionnel entre l’amour de la personne, celui du Père et celui de Jésus.
- source_word: ὁ δὲ ἀγαπῶν με
  choice: Celui qui m’aime
  rationale: δέ assure ici une transition légère. En français, une nouvelle phrase sans connecteur explicite exprime naturellement la progression sans introduire une opposition artificielle.
- source_word: ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου
  choice: sera aimé de mon Père
  rationale: Le futur passif et l’agent sont rendus directement, tout en conservant l’expression filiale « mon Père ».
- source_word: κἀγὼ
  choice: moi aussi
  rationale: κἀγώ associe explicitement l’action de Jésus à celle du Père. « Moi aussi » en fait entendre clairement la valeur additive.
- source_word: ἐμφανίσω
  choice: je me révélerai
  rationale: ἐμφανίζω peut signifier rendre visible ou se faire connaître. La forme pronominale « me révélerai » exprime ici la manifestation personnelle sans la limiter à une apparition physique.
- source_word: ἐμαυτόν
  choice: me
  rationale: 'La construction pronominale française « je me révélerai » restitue naturellement le réflexif grec : Jésus révèle sa propre personne.'
- source_word: αὐτὸν / αὐτῷ
  choice: le / à lui
  rationale: Ces pronoms reprennent le masculin singulier représentatif de la formulation grecque. En français, « celui qui » et « lui » peuvent également avoir une portée générique.
theological_decisions:
- issue: Rapport entre amour et obéissance
  choice: La formulation identifie celui qui garde les commandements de Jésus comme celui qui l’aime.
  alternative: Expliciter que l’obéissance prouve l’amour ou mérite l’amour divin.
  rationale: Le grec établit une identification étroite sans préciser un rapport de mérite ni développer explicitement une logique de preuve. La traduction conserve cette tension.
- issue: Nature de la révélation de Jésus
  choice: « je me révélerai à lui »
  alternative: « je me montrerai à lui »
  rationale: Le contexte peut viser une manifestation ou une connaissance personnelle, sans imposer nécessairement une apparition visible. « Se révéler » préserve cette amplitude sémantique.
- issue: Masculin singulier représentatif
  choice: Conserver « celui », « le » et « lui » dans le texte principal.
  alternative: Employer une formulation épicène comme « toute personne » ou passer au pluriel.
  rationale: Le grec emploie des formes masculines singulières à valeur représentative. La formulation française les conserve sans exclure les femmes de la portée générique.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « celui qui » et du verbe « aimer » conserve la structure rhétorique du grec. « Garder les commandements » maintient la nuance johannique de fidélité et d’observance, tandis que « moi aussi » rend explicitement la force additive de κἀγώ.
