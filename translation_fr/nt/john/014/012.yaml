id: JHN.14.12
reference: John 14:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: fr
  text: 'En vérité, en vérité, je vous le dis : celui qui croit en moi[a] accomplira lui aussi les œuvres que j’accomplis ; et il en accomplira de plus grandes, parce que je vais vers le Père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le grec, « celui qui croit… il » est au masculin singulier représentatif et désigne de manière générale toute personne qui croit.
    reason: cultural_note
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: En vérité, en vérité
  rationale: Rend de façon transparente et solennelle la formule emphatique redoublée, tout en restant naturelle en français biblique moderne.
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: celui qui croit en moi
  rationale: Conserve le participe substantivé au singulier représentatif et rend naturellement la construction johannique πιστεύω εἰς.
- source_word: τὰ ἔργα ἃ ἐγὼ ποιῶ
  choice: les œuvres que j’accomplis
  rationale: « Œuvres » préserve le vocabulaire johannique, tandis qu’« accomplir » convient idiomatiquement aux actes de Jésus sans en préciser abusivement la nature.
- source_word: κἀκεῖνος ποιήσει
  choice: accomplira lui aussi
  rationale: « Lui aussi » restitue l’insistance de κἀκεῖνος et maintient la continuité verbale avec la proposition précédente.
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: il en accomplira même de plus grandes
  rationale: Le pronom « en » reprend clairement « les œuvres » et « de plus grandes » conserve l’ellipse grecque tout en produisant un français naturel. « Même » exprime ici la progression portée par καί.
- source_word: ὅτι
  choice: parce que
  rationale: Marque explicitement la relation causale donnée par le texte.
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: je vais vers le Père
  rationale: Conserve la préposition directionnelle πρὸς et l’article défini, sans ajouter le possessif « mon » absent du texte grec.
theological_decisions:
- issue: Sens des œuvres « plus grandes »
  choice: La formulation demeure ouverte quant à la manière dont ces œuvres seront plus grandes, tout en les reliant au départ de Jésus vers le Père.
  alternative: Préciser qu’elles seront plus grandes par leur étendue missionnaire, leur portée dans l’histoire du salut, leur puissance ou l’action de l’Esprit.
  rationale: Le verset affirme la supériorité et sa relation causale avec le départ de Jésus, mais n’en définit pas ici la nature exacte. La traduction ne tranche donc pas entre les principales interprétations.
- issue: Portée de « celui qui croit »
  choice: Employer le masculin singulier représentatif « celui qui croit », conformément à la forme grecque.
  alternative: Employer la tournure générique « quiconque croit » pour expliciter directement l’inclusion de toute personne croyante.
  rationale: Le singulier représentatif conserve la structure du grec; une note précise que sa portée est générique afin d’éviter une lecture limitée aux hommes.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition « En vérité, en vérité » maintient la solennité johannique. « Accomplir des œuvres » est légèrement soutenu mais courant dans ce registre. La reprise pronominale « il en accomplira » évite une lourde répétition tout en gardant explicite le référent « œuvres ».
