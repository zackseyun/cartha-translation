source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: fr
  text: 'Vous avez entendu que je vous ai dit : « Je m’en vais et je viens vers vous. » Si vous m’aimiez, vous vous seriez réjouis[a] de ce que je vais vers le Père, car le Père est plus grand que moi[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous vous réjouiriez de ce que je vais vers le Père ». La forme grecque peut recevoir une portée plus générale, mais « vous vous seriez réjouis » convient bien à la condition irréelle dans ce contexte.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « le Père est plus grand que moi » est traduite telle quelle, sans ajout interprétatif comme « quant à son rôle » ou « quant à sa condition ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: Vous avez entendu
  rationale: L’aoriste renvoie au fait accompli d’avoir entendu la déclaration antérieure de Jésus. Le passé composé est naturel en français moderne.
- source_word: Ὑπάγω
  choice: Je m’en vais
  rationale: Le présent a ici une portée imminente. « Je m’en vais » exprime naturellement le départ loin des disciples.
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: je reviens vers vous
  rationale: Le présent à orientation future est conservé. Dans ce contexte de départ suivi d’une venue auprès des disciples, « reviens » rend le mouvement de retour de façon idiomatique, tandis que « vers vous » préserve πρὸς ὑμᾶς.
- source_word: εἰ ἠγαπᾶτέ με
  choice: Si vous m’aimiez
  rationale: L’imparfait grec introduit une condition présentée comme irréelle; l’imparfait français convient naturellement.
- source_word: ἐχάρητε ἄν
  choice: vous vous seriez réjouis
  rationale: L’aoriste avec ἄν, dans l’apodose d’une condition irréelle, désigne la réaction qui aurait eu lieu. Le conditionnel passé rend cette valeur sans la réduire à une simple éventualité présente.
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: je vais vers le Père
  rationale: « Aller vers » conserve à la fois l’idée de déplacement et la préposition relationnelle πρὸς. « Le Père » respecte l’article grec sans introduire de possessif.
- source_word: μείζων μού ἐστιν
  choice: est plus grand que moi
  rationale: Cette formulation traduit directement le comparatif grec sans préciser la nature de la grandeur ni ajouter une interprétation théologique.
theological_decisions:
- issue: Sens de « le Père est plus grand que moi »
  choice: Conserver sans qualification le comparatif « le Père est plus grand que moi ».
  alternative: Ajouter « quant à son rôle », « quant à sa condition » ou une autre précision interprétative.
  rationale: Le grec énonce simplement la comparaison. La traduction doit préserver cette tension théologique et ne pas trancher dans le texte principal entre les diverses explications christologiques.
- issue: Réaction hypothétique des disciples
  choice: « vous vous seriez réjouis »
  alternative: « vous vous réjouiriez »
  rationale: La forme grecque peut donner lieu à une formulation française plus générale, mais le conditionnel passé rend au mieux, dans ce contexte, la réaction qui aurait dû accompagner l’annonce déjà entendue.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement collectif de Jésus envers les disciples est rendu par « vous ». La ponctuation française et les guillemets français sont employés.
