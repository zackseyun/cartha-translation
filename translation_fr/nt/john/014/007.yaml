id: JHN.14.7
reference: John 14:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: fr
  text: Si vous m’aviez connu, vous auriez aussi connu mon Père. Dès maintenant, vous le connaissez et vous l’avez vu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγνώκειτέ / γινώσκετε
  choice: connu / connaissez
  rationale: Le verbe « connaître » rend naturellement γινώσκω dans ce contexte relationnel et cognitif, tout en conservant en français le contraste temporel entre l’irréel du passé et la situation présente.
- source_word: ᾔδειτε
  choice: auriez connu
  rationale: Bien que οἶδα puisse souligner le fait de savoir ou de connaître, « connaître mon Père » est ici le tour français le plus naturel et maintient le parallélisme avec la connaissance de Jésus.
- source_word: ἀπ’ ἄρτι
  choice: Dès maintenant
  rationale: Cette expression marque le commencement d’une nouvelle situation à partir du moment présent; « dès maintenant » en restitue la force temporelle.
- source_word: ἑωράκατε
  choice: vous l’avez vu
  rationale: Le passé composé traduit naturellement en français le parfait grec, qui présente une vision déjà accomplie avec une portée actuelle.
theological_decisions:
- issue: Rapport entre connaître Jésus, connaître le Père et avoir vu le Père
  choice: Conserver les affirmations directes sans les expliquer ni les atténuer
  alternative: Paraphraser en disant que les disciples connaissent ou voient le Père seulement de manière figurée ou représentative
  rationale: Le grec formule volontairement une relation forte entre Jésus et le Père sans préciser ici la modalité de cette connaissance et de cette vision; la traduction préserve cette tension théologique.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement collectif est évité conformément au pluriel grec; « Père » reçoit une majuscule comme titre référant à Dieu. La structure conditionnelle irréelle est rendue idiomatiquement par le plus-que-parfait suivi du conditionnel passé.
