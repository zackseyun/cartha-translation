  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: fr
  text: Si vous me demandez quelque chose en mon nom[a], je le ferai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « Si vous demandez quelque chose en mon nom, je le ferai », sans le mot « me ».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: Si
  rationale: Introduit une proposition conditionnelle; « si » est la formulation française la plus naturelle ici.
- source_word: τι
  choice: quelque chose
  rationale: Le pronom indéfini désigne l’objet éventuel de la demande. Après « si », « quelque chose » rend naturellement la portée ouverte de l’expression grecque.
- source_word: αἰτήσητέ
  choice: vous demandez
  rationale: Aoriste actif au subjonctif, deuxième personne du pluriel, régi par ἐάν. Le présent français convient naturellement dans la proposition conditionnelle et conserve le sens de demande adressée à quelqu’un.
- source_word: με
  choice: me
  rationale: Le pronom objet figure dans le texte du SBLGNT et doit être traduit explicitement.
- source_word: ἐν τῷ ὀνόματί μου
  choice: en mon nom
  rationale: Expression johannique conservée sous sa forme traditionnelle et naturelle, sans expliciter dans le texte principal ses nuances possibles d’autorité, de personne ou de représentation.
- source_word: ἐγὼ
  choice: je
  rationale: Le pronom grec explicite porte une certaine insistance. Le français exige ici le sujet « je »; ajouter « moi-même » accentuerait probablement trop le texte.
- source_word: ποιήσω
  choice: je le ferai
  rationale: Futur actif de première personne du singulier. « Le » reprend naturellement en français ce qui est demandé.
theological_decisions:
- issue: Présence de με (« me »), qui présente Jésus comme destinataire explicite de la demande
  choice: Traduire « si vous me demandez » dans le texte principal
  alternative: « Si vous demandez quelque chose en mon nom, je le ferai »
  rationale: Le texte source fourni, le SBLGNT, contient με. La variante qui l’omet est signalée en note afin de préserver avec transparence la différence textuelle et sa portée possible, sans imposer de conclusion doctrinale.
translation_notes:
  register: Français moderne, international et digne. La formulation reste directe et accessible. « Quelque chose » est plus idiomatique que « quoi que ce soit » dans cette condition, tandis que « en mon nom » préserve l’expression théologiquement riche sans la paraphraser.
