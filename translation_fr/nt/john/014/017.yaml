id: JHN.14.17
reference: John 14:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: fr
  text: l’Esprit de vérité[a], que le monde ne peut pas recevoir, parce qu’il ne le voit ni ne le connaît. Vous, vous le connaissez, parce qu’il demeure auprès de vous et qu’il sera en vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie des formes grammaticalement neutres en accord avec le mot « Esprit » (πνεῦμα). En français, « Esprit » est masculin.
    reason: Précision grammaticale sur les pronoms et accords.
  - marker: b
    text: 'Ou : « parmi vous ». Le pronom grec est au pluriel; toutefois, « en vous » rend plus directement ἐν et préserve le contraste avec « auprès de vous ».'
    reason: Lecture alternative possible de l’expression locative.
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: l’Esprit de vérité
  rationale: Conserve l’expression johannique et la construction génitive. La majuscule indique que le contexte désigne l’Esprit Saint.
- source_word: ὃ / αὐτό
  choice: que / le / il
  rationale: Le grec emploie des formes neutres par accord avec πνεῦμα, mais le français désigne naturellement l’Esprit par des formes masculines, sans transformer pour autant la grammaire grecque en argument théologique.
- source_word: ὁ κόσμος
  choice: le monde
  rationale: Rend directement le terme johannique κόσμος sans le réduire à l’humanité ni l’expliciter comme un système hostile.
- source_word: οὐ δύναται λαβεῖν
  choice: ne peut pas recevoir
  rationale: Expression naturelle en français moderne qui conserve à la fois l’idée d’incapacité et celle de réception.
- source_word: θεωρεῖ
  choice: voit
  rationale: Rendu direct et courant, qui laisse subsister la portée perceptive du verbe sans la surinterpréter.
- source_word: γινώσκει / γινώσκετε
  choice: connaît / connaissez
  rationale: Maintient la reprise lexicale et le contraste entre le monde et les disciples.
- source_word: ὑμεῖς
  choice: Vous, vous
  rationale: La dislocation française rend naturellement l’accent porté par le pronom grec explicite et souligne le contraste.
- source_word: παρ’ ὑμῖν μένει
  choice: il demeure auprès de vous
  rationale: « Demeure » préserve le vocabulaire caractéristique de μένω chez Jean; « auprès de vous » distingue clairement παρά de l’expression suivante avec ἐν.
- source_word: ἐν ὑμῖν ἔσται
  choice: il sera en vous
  rationale: Rend le sens locatif le plus direct de ἐν et maintient la distinction avec « auprès de vous », tout en signalant en note la lecture collective possible.
theological_decisions:
- issue: Référence personnelle à l’Esprit malgré le genre neutre de πνεῦμα en grec
  choice: Employer en français les formes masculines personnelles « le » et « il »
  alternative: Calquer le neutre grec au moyen de formes impersonnelles
  rationale: Le français ne possède pas de neutre équivalent et le nom « Esprit » est masculin. Ces formes sont donc grammaticalement nécessaires et conviennent à la présentation personnelle de l’Esprit dans le contexte.
- issue: Rapport de l’Esprit aux disciples dans παρ’ ὑμῖν et ἐν ὑμῖν
  choice: Préserver la distinction par « auprès de vous » et « en vous »
  alternative: Rendre la seconde expression par « parmi vous »
  rationale: Les deux prépositions grecques sont distinctes. « En vous » conserve leur contraste le plus direct sans exclure silencieusement la portée collective du pluriel, mentionnée en note.
- issue: Valeur temporelle de ἔσται
  choice: « il sera »
  alternative: « il est » selon une variante textuelle ancienne
  rationale: Le texte SBLGNT fourni retient le futur ἔσται; la traduction suit donc cette forme sans harmonisation.
translation_notes:
  register: Français international moderne, digne et accessible. « Demeurer » est conservé pour sa valeur johannique; « auprès de vous » évite l’ambiguïté de deux occurrences successives de « avec vous ». Tous les marqueurs de note figurent dans le texte.
