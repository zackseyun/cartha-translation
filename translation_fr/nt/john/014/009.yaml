  source_fidelity: 'Le texte rend fidèlement les éléments grecs : la durée prolongée de Τοσούτῳ χρόνῳ, la présence continue auprès du groupe (« avec vous »), l’adresse personnelle à Philippe (« tu »), la force du parfait de γινώσκω (« ne me connais toujours pas »), et les deux parfaits de βλέπω/ὁράω (« m’a vu a vu le Père »). Il ne réduit ni n’explicite indûment l’affirmation sur le Père.'
