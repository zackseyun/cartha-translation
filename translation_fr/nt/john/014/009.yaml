id: JHN.14.9
reference: John 14:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: fr
  text: 'Jésus lui dit : « Il y a si longtemps[a] que je suis avec vous, et tu ne me connais toujours pas, Philippe ? Celui qui m’a vu a vu le Père. Comment peux-tu dire : “Montre-nous le Père” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « depuis tout ce temps » ou « voilà si longtemps ».'
    reason: Alternative lexicale pour Τοσούτῳ χρόνῳ, qui exprime une longue durée.
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: Il y a si longtemps
  rationale: Cette tournure française exprime naturellement la durée prolongée indiquée par le datif de durée et conserve la force de reproche de la question.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: que je suis avec vous
  rationale: Le présent français convient après « il y a… que » pour une présence commencée auparavant et qui se poursuit. Le pluriel « vous » respecte le grec et vise le groupe des disciples.
- source_word: οὐκ ἔγνωκάς με
  choice: tu ne me connais toujours pas
  rationale: Le singulier correspond à l’adresse personnelle faite à Philippe. « Toujours pas » rend en français courant l’état persistant suggéré par le parfait grec et la portée réprobatrice du contexte, sans réduire connaître à une simple identification.
- source_word: Φίλιππε
  choice: Philippe
  rationale: Forme française traditionnelle et courante du nom propre au vocatif.
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: Celui qui m’a vu
  rationale: « Celui qui » rend le participe substantivé. Le passé composé exprime naturellement en français l’expérience accomplie dont la portée demeure.
- source_word: ἑώρακεν τὸν πατέρα
  choice: a vu le Père
  rationale: La formulation conserve « le Père », conformément au grec, ainsi que la force directe et théologiquement dense de l’affirmation.
- source_word: πῶς σὺ λέγεις
  choice: Comment peux-tu dire
  rationale: Cette formulation idiomatique restitue la question rhétorique et l’étonnement exprimés par πῶς, tandis que « tu » met en relief l’interlocuteur singulier.
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: Montre-nous le Père
  rationale: L’impératif direct « Montre » correspond à δείκνυμι et reprend sans l’expliquer la demande de Philippe au verset précédent.
theological_decisions:
- issue: Rapport entre voir Jésus et voir le Père
  choice: « Celui qui m’a vu a vu le Père »
  alternative: « Celui qui m’a vu a vu comment est le Père » ou une paraphrase formulée selon des catégories doctrinales ultérieures
  rationale: La traduction conserve telle quelle la forte affirmation christologique du grec. Elle ne l’affaiblit pas en une simple ressemblance et ne l’explicite pas non plus au moyen de catégories théologiques absentes du verset.
translation_notes:
  register: Français international moderne, naturel et digne. L’alternance entre « vous » (le groupe des disciples) et « tu » (Philippe personnellement) est intentionnellement conservée. Les guillemets français encadrent les paroles de Jésus et les guillemets doubles la citation intérieure.
