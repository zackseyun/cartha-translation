id: JHN.14.1
reference: John 14:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: fr
  text: Que votre cœur ne soit pas troublé. Croyez en Dieu ; croyez aussi en moi.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Vous croyez en Dieu ; croyez aussi en moi. » En grec, la forme πιστεύετε peut être soit un indicatif (« vous croyez »), soit un impératif (« croyez »).'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Mettez votre confiance en Dieu ; mettez aussi votre confiance en moi. » Le verbe peut exprimer la confiance aussi bien que la croyance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: Que … ne soit pas troublé
  rationale: Le présent impératif passif à la troisième personne, précédé de μή, exprime une défense. Cette tournure française conserve l’impératif de troisième personne et le passif sans réduire le trouble à la seule peur ou à la seule inquiétude.
- source_word: ὑμῶν ἡ καρδία
  choice: votre cœur
  rationale: Le grec associe le singulier ἡ καρδία au possessif pluriel ὑμῶν. Le singulier collectif « votre cœur » préserve cette forme tout en s’adressant naturellement à l’ensemble des disciples.
- source_word: πιστεύετε
  choice: Croyez
  rationale: πιστεύω peut exprimer le fait de croire ou de mettre sa confiance en quelqu’un. « Croyez » est direct, naturel et maintient le parallélisme des deux occurrences ; la nuance de confiance est signalée en note.
- source_word: εἰς τὸν θεόν
  choice: en Dieu
  rationale: Avec πιστεύω, εἰς indique ici l’orientation de la foi ou de la confiance vers Dieu ; « en Dieu » est l’équivalent idiomatique en français.
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: croyez aussi en moi
  rationale: « aussi » rend la valeur additive de καί, tandis que la répétition de « croyez » conserve le parallélisme explicite du grec entre Dieu et Jésus.
theological_decisions:
- issue: Valeur indicative ou impérative des deux occurrences de πιστεύετε
  choice: 'Les deux occurrences sont rendues comme des impératifs : « Croyez en Dieu ; croyez aussi en moi. »'
  alternative: « Vous croyez en Dieu ; croyez aussi en moi. » D’autres combinaisons grammaticales sont également possibles.
  rationale: La deuxième personne du pluriel au présent actif a la même forme à l’indicatif et à l’impératif. Le contexte d’exhortation, après la défense initiale, favorise deux impératifs, mais l’ambiguïté réelle du grec est conservée dans une note plutôt que résolue silencieusement.
translation_notes:
  register: Français international moderne, digne et accessible. Le point-virgule met en relief le parallélisme des deux propositions. Le singulier collectif « votre cœur » suit la forme grecque sans devenir obscur. Les deux appels de note sont placés après les propositions concernées, puisque les notes portent sur πιστεύετε et non sur la première phrase.
