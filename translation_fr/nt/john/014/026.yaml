id: JHN.14.26
reference: John 14:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: fr
  text: Mais le Défenseur[a], l’Esprit Saint, que le Père enverra en mon nom, lui, vous enseignera toutes choses et vous rappellera tout ce que je vous ai dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « l’Aide », « le Conseiller » ou « le Consolateur » ; grec : paraklêtos.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: Défenseur
  rationale: « Défenseur » conserve la dimension personnelle, active et représentative du terme, notamment sa possible nuance juridique, sans le réduire à la seule consolation. Comme aucun mot français n’en épuise le sens, les principales autres possibilités figurent en note.
- source_word: πνεῦμα τὸ ἅγιον
  choice: l’Esprit Saint
  rationale: Titre consacré et naturel en français moderne, correspondant directement à l’expression grecque.
- source_word: ὃ πέμψει ὁ πατήρ
  choice: que le Père enverra
  rationale: Le pronom relatif français « que » convient naturellement à la personne envoyée tout en respectant la fonction syntaxique du relatif grec.
- source_word: ἐν τῷ ὀνόματί μου
  choice: en mon nom
  rationale: Cette expression française établie préserve sans la restreindre la gamme de sens liée à l’autorité, à la représentation et à la mission.
- source_word: ἐκεῖνος
  choice: lui
  rationale: Le pronom détaché rend l’insistance du démonstratif masculin grec, qui renvoie au Défenseur, et souligne son action personnelle.
- source_word: διδάξει ὑμᾶς πάντα
  choice: vous enseignera toutes choses
  rationale: La formulation conserve l’ampleur de πάντα et reste digne et intelligible en français courant.
- source_word: ὑπομνήσει ὑμᾶς
  choice: vous rappellera
  rationale: « Rappeler quelque chose à quelqu’un » exprime naturellement en français le sens causatif du verbe grec.
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: tout ce que je vous ai dit
  rationale: Le passé composé est naturel dans ce discours français et rend l’aoriste rétrospectif sans ajouter de précision temporelle.
theological_decisions:
- issue: Langage personnel appliqué à l’Esprit Saint
  choice: Employer des formulations personnelles et reprendre le Défenseur par « lui »
  alternative: Suivre mécaniquement le genre neutre de πνεῦμα et employer une reprise impersonnelle
  rationale: Le texte associe le neutre πνεῦμα au titre personnel masculin παράκλητος, puis emploie le démonstratif masculin emphatique ἐκεῖνος. La traduction rend cette agence personnelle sans tirer de conclusion allant au-delà du verset.
- issue: Traduction de παράκλητος
  choice: Défenseur
  alternative: Aide, Conseiller, Consolateur ou Paraclet
  rationale: Le terme grec possède des nuances juridiques, représentatives et secourables. « Défenseur » en préserve bien le rôle actif dans un français moderne, tandis que la note maintient visibles les principales autres lectures lexicales.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « tout/toutes » et l’emphase de ἐκεῖνος sont conservées. La note évite de faire passer une seule nuance de παράκλητος pour exhaustive.
