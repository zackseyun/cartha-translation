id: JHN.14.6
reference: John 14:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: fr
  text: 'Jésus lui dit[a] : « Je suis le chemin, la vérité et la vie. Personne ne vient au Père autrement que par moi[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici un présent historique (« Jésus lui dit »), que le français peut également rendre par un présent narratif.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « si ce n’est par moi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Le présent historique grec λέγει est rendu par le présent narratif français « dit », naturel dans un récit et formellement proche de la source; αὐτῷ est conservé par « lui ».
- source_word: Ἐγώ εἰμι
  choice: C’est moi qui suis
  rationale: La tournure clivée rend naturellement en français l’accent porté par le pronom explicite ἐγώ, sans ajouter de contenu.
- source_word: ἡ ὁδὸς
  choice: le chemin
  rationale: « Chemin » conserve à la fois l’image concrète et le sens métaphorique d’accès ou de voie vers le Père.
- source_word: ἡ ἀλήθεια
  choice: la vérité
  rationale: « Vérité » correspond au sens lexical central d’ἀλήθεια et préserve toute la portée johannique sans l’expliciter.
- source_word: ἡ ζωή
  choice: la vie
  rationale: « Vie » rend directement ζωή et laisse intacte sa richesse théologique dans Jean.
- source_word: οὐδεὶς ἔρχεται
  choice: Personne ne vient
  rationale: Le présent français exprime naturellement, comme le grec, une affirmation générale.
- source_word: πρὸς τὸν πατέρα
  choice: au Père
  rationale: La préposition « à », contractée dans « au », exprime le mouvement vers; la majuscule indique l’emploi de « Père » comme titre personnel divin.
- source_word: εἰ μὴ δι’ ἐμοῦ
  choice: autrement que par moi
  rationale: Cette tournure française idiomatique conserve la valeur exceptive de εἰ μή et rend διά avec le génitif par « par », qui exprime ici le moyen ou la médiation.
theological_decisions:
- issue: Exclusivité de l’accès au Père par Jésus
  choice: Personne ne vient au Père autrement que par moi
  alternative: Personne ne vient au Père si ce n’est par moi
  rationale: La formulation maintient sans atténuation l’exclusion exprimée par οὐδεὶς et εἰ μή, tout en évitant d’étendre l’affirmation au-delà des mots du verset.
- issue: Suite des trois prédicats johanniques
  choice: le chemin, la vérité et la vie
  alternative: le chemin, et la vérité, et la vie
  rationale: Les trois articles définis sont conservés. En français courant et digne, une seule conjonction avant le dernier terme restitue clairement la triade; répéter « et » serait possible pour souligner davantage sa cadence, mais serait plus marqué.
- issue: Force emphatique de Ἐγώ εἰμι
  choice: C’est moi qui suis
  alternative: Je suis
  rationale: La construction retenue manifeste l’emphase du pronom grec explicite sans identifier artificiellement cette formule à une doctrine qui ne serait pas grammaticalement imposée par le seul verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif est conservé, contrairement au passage à un passé souvent nécessaire en anglais. « C’est moi qui suis » rend l’emphase grecque. La ponctuation et les guillemets suivent l’usage français; les marqueurs [a] et [b] figurent bien dans le texte.
