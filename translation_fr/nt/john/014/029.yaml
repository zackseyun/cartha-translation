id: JHN.14.29
reference: John 14:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: fr
  text: Et maintenant, je vous l’ai dit avant que cela arrive, afin que, lorsque cela arrivera, vous croyiez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe traduit par « croyiez » peut aussi avoir le sens de « ayez confiance ».
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Et maintenant
  rationale: Conserve à la fois le lien avec ce qui précède (καί) et l’indication temporelle (νῦν) dans un français naturel.
- source_word: εἴρηκα ὑμῖν
  choice: je vous l’ai dit
  rationale: Le parfait exprime une parole déjà prononcée dont la portée demeure présente. « Je vous l’ai dit » rend naturellement le datif ὑμῖν.
- source_word: πρὶν γενέσθαι
  choice: avant que cela arrive
  rationale: πρίν avec l’infinitif aoriste signifie « avant que cela arrive ». « Cela » reprend l’événement implicite sans en préciser indûment la nature.
- source_word: ἵνα
  choice: afin que
  rationale: Rend clairement la visée exprimée par ἵνα, dans un registre français digne et courant.
- source_word: ὅταν γένηται
  choice: lorsque cela arrivera
  rationale: ὅταν avec le subjonctif présente un événement futur envisagé. La répétition d’« arriver » reflète celle de γίνομαι dans les deux propositions.
- source_word: πιστεύσητε
  choice: vous croyiez
  rationale: « Croire » est le rendu johannique naturel de πιστεύω. Le subjonctif après « afin que » préserve la construction de but sans décider s’il s’agit du commencement ou de l’affermissement de la foi.
theological_decisions:
- issue: Portée de πιστεύσητε dans le contexte
  choice: vous croyiez
  alternative: vous continuiez à croire ; vous ayez confiance
  rationale: Le grec peut viser l’éveil ou l’affermissement de la foi, sans préciser lequel. Le rendu général « vous croyiez » maintient cette ouverture et n’impose pas une lecture doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « arriver » reproduit volontairement celle du verbe grec γίνομαι. « Afin que » marque nettement le but, tandis que « lorsque cela arrivera » exprime naturellement en français la perspective future de ὅταν avec le subjonctif.
