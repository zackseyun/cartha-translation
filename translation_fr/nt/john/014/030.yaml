source:
  edition: SBLGNT
  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: fr
  text: Je ne parlerai plus beaucoup avec vous, car le dirigeant du monde[a] vient. Il n’a rien en moi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On traduit parfois : « le dirigeant de ce monde ». Dans le grec de ce verset, cependant, il est simplement écrit « du monde ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou, selon le sens de l’expression : « il n’a aucun droit sur moi » ou « il n’a aucune prise sur moi ». Le grec dit littéralement : « il n’a rien en moi ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω
  choice: Je ne parlerai plus beaucoup
  rationale: « Ne… plus » exprime la cessation à partir de maintenant, tandis que « beaucoup » rend le pluriel neutre πολλὰ employé adverbialement avec « parlerai ».
- source_word: μεθ’ ὑμῶν
  choice: avec vous
  rationale: La préposition μετά avec le génitif marque ici l’association et la conversation de Jésus avec ses disciples.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent grec a ici une portée imminente. En français, « vient » est naturel et conserve cette proximité sans ajouter « est en train de ».
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: le dirigeant du monde
  rationale: « Dirigeant » rend ἄρχων dans un français actuel sans suggérer, comme « souverain », une autorité nécessairement légitime. L’absence de démonstratif dans le grec est respectée.
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: Il n’a rien en moi
  rationale: Cette formulation conserve l’expression grecque concise et ambiguë, au lieu de la réduire à une seule interprétation telle que « aucun pouvoir sur moi » ou « aucun droit sur moi ».
theological_decisions:
- issue: Identité et portée du « dirigeant du monde »
  choice: Conserver le titre sans remplacer son référent par « Satan ».
  alternative: Identifier explicitement le personnage comme Satan ou comme une personnification générale des puissances mauvaises.
  rationale: Dans le contexte johannique, ce titre renvoie vraisemblablement à Satan, mais le texte grec emploie le titre lui-même. Le conserver évite de rendre explicite dans le corps du texte ce qui demeure contextuellement inféré.
- issue: Sens de « il n’a rien en moi »
  choice: Maintenir l’expression littérale et ouverte.
  alternative: « Il n’a aucun droit sur moi », « il n’a aucune prise sur moi » ou « il n’a aucun pouvoir sur moi ».
  rationale: La tournure peut évoquer l’absence de droit, de prise, de pouvoir ou de terrain commun. La formulation littérale préserve cette densité théologique sans privilégier une seule explication.
translation_notes:
  register: Français international moderne, digne et accessible. « Dirigeant » a été préféré au traditionnel « prince », devenu moins transparent, et à « souverain », qui pourrait suggérer une autorité légitime. La syntaxe brève de la dernière proposition est volontairement conservée.
