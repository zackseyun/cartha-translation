  terminology: « Dirigeant » rend correctement ἄρχων sans présumer de la légitimité de son autorité ni identifier explicitement le référent. Les notes distinguent bien le fait lexical de l’absence de « ce » dans le grec et les lectures possibles de « rien en moi », sans imposer une interprétation doctrinale.
