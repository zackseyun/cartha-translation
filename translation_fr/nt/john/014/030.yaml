  source_fidelity: Le texte rend fidèlement οὐκέτι πολλὰ λαλήσω (« je ne parlerai plus beaucoup »), μεθ’ ὑμῶν (« avec vous »), le présent imminent ἔρχεται (« vient »), et ὁ τοῦ κόσμου ἄρχων sans ajouter « ce ». La formule volontairement littérale « Il n’a rien en moi » conserve la concision et l’ouverture sémantique de ἐν ἐμοὶ οὐκ ἔχει οὐδέν.
