  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: fr
  text: 'Thomas lui dit : « Seigneur, nous ne savons pas où tu vas. Comment pouvons-nous connaître le chemin ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: Thomas lui dit
  rationale: Le présent historique λέγει est rendu au présent de narration français, naturel dans un récit et proche de la forme grecque.
- source_word: Κύριε
  choice: Seigneur
  rationale: Cette forme d’adresse préserve à la fois le respect du disciple et la portée christologique possible du titre, sans la préciser davantage.
- source_word: οὐκ οἴδαμεν
  choice: nous ne savons pas
  rationale: οἶδα exprime ici le fait de savoir; « savoir » est idiomatique devant la proposition interrogative indirecte « où tu vas ».
- source_word: ποῦ ὑπάγεις
  choice: où tu vas
  rationale: Cette formulation naturelle conserve le sens de déplacement de ὑπάγω et laisse intacte sa résonance johannique sans expliciter la destination.
- source_word: πῶς δυνάμεθα
  choice: Comment pouvons-nous
  rationale: La tournure exprime directement l’interrogation sur la possibilité ou la capacité, conformément au grec.
- source_word: τὴν ὁδὸν
  choice: le chemin
  rationale: « Chemin » rend naturellement ὁδός en français et préserve le lien thématique avec le verset suivant.
- source_word: εἰδέναι
  choice: connaître
  rationale: « Connaître le chemin » est plus naturel en français que « savoir le chemin »; le sens de connaissance est conservé, même si la répétition étymologique grecque avec οἴδαμεν ne peut l’être sans maladresse.
theological_decisions:
- issue: Portée théologique possible de ὑπάγεις dans Jean
  choice: où tu vas
  alternative: où tu t’en vas
  rationale: La formulation neutre maintient l’ignorance exprimée par Thomas et la tension narrative concernant la destination de Jésus, sans introduire explicitement son retour au Père.
translation_notes:
  register: Français moderne, international et digne; dialogue direct et naturel. Aucun marqueur de note n’est nécessaire, car les nuances pertinentes sont rendues dans le texte ou relèvent de décisions de traduction sans variante exigeant une note.
