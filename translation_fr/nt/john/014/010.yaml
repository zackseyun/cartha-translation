id: JHN.14.10
reference: John 14:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: fr
  text: Ne crois-tu pas que je suis dans le Père et que le Père est en moi ? Les paroles que je vous dis, je ne les prononce pas de moi-même[a] ; mais le Père, qui demeure en moi[b], accomplit ses œuvres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de ma propre initiative » ou « de ma propre autorité ». L’expression peut indiquer la source, l’initiative ou l’autorité personnelle.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qui reste en moi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: crois
  rationale: « Croire » conserve le terme johannique récurrent et convient naturellement à la question adressée à Philippe.
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: dans le Père ... en moi
  rationale: Cette formulation garde l’image grecque de l’intériorité réciproque sans la remplacer par une paraphrase interprétative comme « uni au Père ».
- source_word: ῥήματα
  choice: paroles
  rationale: « Paroles » rend directement le contenu exprimé et correspond au vocabulaire johannique courant.
- source_word: λέγω
  choice: dis
  rationale: « Dire » est ici le verbe français le plus naturel pour introduire les paroles adressées aux disciples.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: de moi-même
  rationale: La tournure préserve l’idée de provenance tout en laissant ouverte la nuance d’initiative ou d’autorité propre.
- source_word: λαλῶ
  choice: prononce
  rationale: « Prononcer » évite une répétition lourde de « dire » et conserve, sans l’exagérer, la variation entre λέγω et λαλῶ.
- source_word: μένων
  choice: qui demeure
  rationale: « Demeurer » exprime la continuité de μένω et conserve un important motif johannique dans un français digne et intelligible.
- source_word: ποιεῖ
  choice: accomplit
  rationale: « Accomplit » forme une expression française naturelle avec « œuvres » et rend l’action du Père sans affaiblir le verbe.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ses œuvres
  rationale: Le possessif représente αὐτοῦ, tandis que « œuvres » conserve le vocabulaire théologique caractéristique de Jean.
theological_decisions:
- issue: Présence réciproque du Père et du Fils
  choice: Conserver littéralement « je suis dans le Père et le Père est en moi ».
  alternative: « Je suis uni au Père et le Père est uni à moi » ou « le Père et moi sommes un ».
  rationale: Le grec exprime ici une présence réciproque. La traduction la maintient sans l’harmoniser avec une autre formulation johannique ni préciser davantage la nature de cette relation.
- issue: Origine des paroles de Jésus et action du Père
  choice: Traduire « je ne les prononce pas de moi-même » et attribuer au Père qui demeure en Jésus l’accomplissement de « ses œuvres ».
  alternative: « Je ne parle pas de ma propre autorité » ou « le Père agit par moi ».
  rationale: Cette formulation préserve à la fois la distinction entre le Père et le Fils et leur profonde unité d’action, sans réduire « de moi-même » à une seule nuance possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse singulière à Philippe dans le contexte. « Demeure » conserve le motif johannique sans être obscur, tandis que « accomplit ses œuvres » évite le tour peu idiomatique « fait ses œuvres ».
