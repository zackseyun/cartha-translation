id: JHN.14.23
reference: John 14:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: fr
  text: 'Jésus lui répondit : « Si quelqu’un m’aime, il gardera ma parole[a]. Mon Père l’aimera, nous viendrons à lui et nous ferons notre demeure chez lui[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon enseignement » ou « ce que je dis ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « nous établirons chez lui notre demeure » ou « nous habiterons chez lui ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jésus lui répondit
  rationale: La formule grecque « répondit et lui dit » est une tournure narrative redondante. « Lui répondit » en exprime naturellement tout le sens en français moderne.
- source_word: Ἐάν τις
  choice: Si quelqu’un
  rationale: Cette condition indéfinie a une portée générale et ouverte ; « quelqu’un » conserve le singulier sans limiter le groupe visé.
- source_word: ἀγαπᾷ με
  choice: m’aime
  rationale: Rendu direct et courant de ἀγαπάω, qui maintient le lien lexical avec le second emploi du même verbe.
- source_word: τὸν λόγον μου
  choice: ma parole
  rationale: « Ma parole » préserve le vocabulaire johannique et peut désigner à la fois le message, l’enseignement et ce que Jésus dit.
- source_word: τηρήσει
  choice: gardera
  rationale: '« Garder » conserve la gamme de sens de τηρέω : tenir fermement, observer et mettre en pratique, sans la réduire au seul concept d’obéissance.'
- source_word: ὁ πατήρ μου ἀγαπήσει αὐτόν
  choice: Mon Père l’aimera
  rationale: Cette formulation directe maintient le titre relationnel « mon Père » et reprend le même verbe « aimer » que dans la première proposition.
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: nous viendrons à lui
  rationale: La préposition πρός marque ici le mouvement vers la personne ; la traduction garde explicitement le sujet pluriel.
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: nous ferons notre demeure chez lui
  rationale: Cette expression française naturelle conserve l’image concrète d’une demeure et l’idée de présence auprès de la personne. Le possessif « notre », implicite dans l’action du sujet pluriel, rend la tournure idiomatique.
theological_decisions:
- issue: Sujet divin pluriel dans « nous viendrons… nous ferons »
  choice: Maintenir explicitement le pluriel, qui associe Jésus et le Père dans la venue et la demeure.
  alternative: Reformuler au singulier ou parler plus généralement de la présence divine.
  rationale: Les deux verbes grecs sont à la première personne du pluriel et présentent Jésus et le Père comme agissant conjointement. La traduction préserve cette formulation sans lui ajouter d’explication doctrinale.
- issue: Référence générique singulière
  choice: Employer « quelqu’un », puis les pronoms singuliers « l’ » et « lui ».
  alternative: Recourir à une reformulation au pluriel ou répéter « cette personne ».
  rationale: Le grec emploie une construction générique au singulier. Le français permet de la conserver naturellement sans introduire de masculin grammatical explicite.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste accessible, tout en conservant les termes johanniques « parole », « Père » et « demeure ». Les pronoms permettent une formulation générique sans marquage masculin explicite.
