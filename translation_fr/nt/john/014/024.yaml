id: JHN.14.24
reference: John 14:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: fr
  text: Celui qui ne m’aime pas ne garde pas mes paroles. Et la parole que vous entendez n’est pas la mienne, mais celle du Père qui m’a envoyé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: Celui qui ne m’aime pas
  rationale: Le participe présent substantivé désigne de façon générale la personne caractérisée par l’absence d’amour envers Jésus. Cette formulation conserve la structure grecque tout en restant naturelle en français.
- source_word: τοὺς λόγους μου
  choice: mes paroles
  rationale: Le pluriel est conservé et renvoie aux enseignements prononcés par Jésus. « Paroles » maintient aussi le lien lexical avec le singulier qui suit.
- source_word: τηρεῖ
  choice: garde
  rationale: Dans l’usage johannique, le verbe exprime l’observation fidèle et la mise en pratique. « Garde » préserve cette ampleur sans réduire le sens à la seule obéissance à des règles.
- source_word: ὁ λόγος ὃν ἀκούετε
  choice: la parole que vous entendez
  rationale: Le singulier présente l’enseignement comme une parole unifiée. La traduction conserve le présent et n’ajoute pas un complément tel que « de moi », seulement implicite dans le contexte.
- source_word: οὐκ ἔστιν ἐμὸς
  choice: n’est pas la mienne
  rationale: Cette tournure rend directement l’adjectif possessif prédicatif et demeure idiomatique en français.
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: mais celle du Père qui m’a envoyé
  rationale: Le génitif elliptique est explicité par « celle du Père », qui exprime naturellement l’appartenance ou l’origine tout en permettant à la relative de modifier clairement « Père ».
theological_decisions:
- issue: Rapport entre la parole de Jésus et celle du Père
  choice: « n’est pas la mienne, mais celle du Père qui m’a envoyé »
  alternative: « ne vient pas de moi, mais du Père qui m’a envoyé »
  rationale: La formulation retenue préserve la distinction entre Jésus et le Père ainsi que l’unité de leur parole, sans réduire le génitif à la seule idée de provenance ni expliquer la relation théologique au-delà de ce qu’affirme le texte.
translation_notes:
  register: Français international moderne, simple et digne. « Garder des paroles » conserve volontairement l’expression johannique et son sens d’observation fidèle; le parallélisme entre « mes paroles » et « la parole » reste visible.
