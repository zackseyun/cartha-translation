source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: fr
  text: 'Il entra de nouveau dans la résidence officielle du gouverneur[a] et dit à Jésus : « D’où viens-tu ? » Mais Jésus ne lui donna aucune réponse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « prétoire » : résidence officielle ou quartier général du gouverneur romain.'
    reason: Alternative lexicale et précision historique pour πραιτώριον.
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: entra
  rationale: L’aoriste d’εἰσέρχομαι exprime l’entrée dans un lieu. « Entra » est concis, naturel et adapté au registre narratif.
- source_word: πραιτώριον
  choice: résidence officielle du gouverneur
  rationale: Dans ce contexte, le terme désigne la résidence ou le quartier général officiel du gouverneur romain. Cette formulation française en indique clairement la fonction sans imposer le terme technique « prétoire ».
- source_word: πάλιν
  choice: de nouveau
  rationale: L’adverbe marque la répétition du déplacement et se rend naturellement par « de nouveau ».
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit écrit en français.
- source_word: Πόθεν εἶ σύ
  choice: D’où es-tu ?
  rationale: Πόθεν interroge l’origine ou la provenance. La formulation conserve cette portée et reste idiomatique en français.
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: ne lui donna aucune réponse
  rationale: Cette formulation préserve l’image verbale grecque, littéralement « ne lui donna pas de réponse », tout en restant naturelle en français.
- source_word: καὶ … καὶ … δὲ
  choice: et … et … Mais
  rationale: Les conjonctions assurent la progression du récit, tandis que « Mais » fait ressortir le contraste entre la question posée et le silence de Jésus.
theological_decisions:
- issue: Référent du sujet sous-entendu
  choice: Conserver le pronom « il », dont le contexte identifie le référent comme Pilate.
  alternative: Expliciter « Pilate » dans le corps du texte.
  rationale: Le grec ne nomme pas de nouveau le sujet. Le pronom respecte cette forme tout en demeurant clair grâce au contexte immédiat.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit. La question directe reste brève, et la tournure « ne lui donna aucune réponse » conserve l’expression concrète du grec.
