id: JHN.19.7
reference: John 19:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: fr
  text: 'Les Juifs lui répondirent : « Nous avons une loi et, selon cette loi[a], il doit mourir, parce qu’il s’est fait Fils de Dieu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « selon la loi ». Le grec répète le mot « loi » ; au second emploi, il renvoie à la loi qui vient d’être mentionnée.'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « parce qu’il s’est fait lui-même Fils de Dieu ».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: répondirent
  rationale: Verbe narratif courant qui rend directement l’aoriste grec dans un registre digne et naturel.
- source_word: οἱ Ἰουδαῖοι
  choice: Les Juifs
  rationale: Rend directement la désignation collective employée ici par Jean, sans la restreindre implicitement aux seuls chefs, restriction que ce verset n’énonce pas.
- source_word: νόμον ἔχομεν
  choice: Nous avons une loi
  rationale: L’absence d’article au premier emploi de νόμος et l’appel à un fondement juridique se rendent naturellement ainsi en français.
- source_word: κατὰ τὸν νόμον
  choice: selon cette loi
  rationale: Le second νόμος, avec article, renvoie à la loi qui vient d’être mentionnée ; « cette loi » exprime clairement cette reprise en français.
- source_word: ὀφείλει ἀποθανεῖν
  choice: il doit mourir
  rationale: ὀφείλει exprime ici une obligation juridique. « Il doit mourir » est plus naturel en français moderne que « il devrait mourir » et ne transforme pas l’énoncé en simple recommandation.
- source_word: υἱὸν θεοῦ
  choice: Fils de Dieu
  rationale: En français, le titre se formule idiomatiquement sans article après « se faire ». Cette traduction conserve la portée qualitative et titulaire de l’expression sans la réduire à « un fils de Dieu ».
- source_word: ἑαυτὸν ἐποίησεν
  choice: il s’est fait
  rationale: Rend de près la formulation accusatrice grecque et préserve son caractère abrupt, sans l’expliciter par « il a prétendu être ».
theological_decisions:
- issue: Portée de υἱὸν θεοῦ dans l’accusation portée contre Jésus
  choice: Fils de Dieu
  alternative: un fils de Dieu ; le Fils de Dieu
  rationale: « Fils de Dieu » est la tournure française naturelle après « s’est fait » et conserve la revendication de statut filial unique sous-entendue dans le contexte johannique. Elle rapporte l’accusation sans y ajouter une explication doctrinale.
- issue: Force de l’obligation exprimée par ὀφείλει
  choice: il doit mourir
  alternative: il devrait mourir
  rationale: Le contexte est celui d’une exigence juridique. Le conditionnel français affaiblirait indûment cette exigence, tandis que l’indicatif « doit » garde la force du grec sans commenter la validité de l’accusation.
translation_notes:
  register: Français international moderne, clair et solennel. Le passé simple convient au récit biblique écrit. La répétition grecque de νόμος est conservée, avec « cette loi » pour marquer la reprise. La formulation « Les Juifs » suit le texte source sans ajouter une précision contextuelle absente de ce verset.
