id: JHN.19.21
reference: John 19:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: fr
  text: 'Alors les grands prêtres des Juifs disaient à Pilate : « N’écris pas : “Le roi des Juifs”[a], mais plutôt : “Cet homme a dit : ‘Je suis roi des Juifs’[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Le roi des Judéens ». Le terme grec peut désigner les Juifs en général ou, selon le contexte, les habitants de la Judée.
    reason: alternative_reading
  - marker: b
    text: Ou « Je suis le roi des Juifs ». Le grec n’emploie pas ici d’article devant « roi », mais le français peut naturellement en ajouter un dans cette construction.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: dirent
  rationale: L’imparfait grec peut décrire une prise de parole dans le récit. Le passé simple français est ici plus naturel que « disaient » et n’impose pas l’idée de demandes répétées.
- source_word: οὖν
  choice: Alors
  rationale: Marque la progression et la conséquence narratives dans un français actuel et fluide.
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: Désignation française habituelle des principales autorités sacerdotales; elle n’implique pas que plusieurs personnes exerçaient simultanément la fonction unique de grand prêtre.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Rend naturellement la désignation politique et religieuse reconnue « roi des Juifs »; l’autre sens possible, « Judéens », est signalé en note.
- source_word: Μὴ γράφε
  choice: N’écris pas
  rationale: Rend directement l’impératif présent négatif sans ajouter l’idée non certaine de cesser une action déjà commencée.
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: Le roi des Juifs
  rationale: Reproduit la formulation précise de l’inscription contestée.
- source_word: ἀλλ’ ὅτι
  choice: mais qu’il a dit
  rationale: Introduit directement la formulation substitutive demandée; cette construction, volontairement serrée, conserve la syntaxe du grec.
- source_word: ἐκεῖνος
  choice: il
  rationale: Le pronom démonstratif grec renvoie à Jésus avec une certaine distance, mais « cet homme » renforcerait possiblement une nuance méprisante qui n’est pas certaine.
- source_word: εἶπεν
  choice: a dit
  rationale: Rend le verbe sans lui ajouter la nuance interprétative de « prétendre ».
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: Je suis roi des Juifs
  rationale: Conserve l’absence d’article devant le nom attribut tout en restant idiomatique en français; la formulation avec l’article est donnée en note.
theological_decisions:
- issue: Sens de Ἰουδαίων dans le récit johannique de la Passion
  choice: Juifs
  alternative: Judéens
  rationale: Le contexte cite la titulature politique « roi des Juifs », dont c’est la traduction française établie et intelligible. Comme le terme grec peut aussi avoir un sens géographique plus précis, l’alternative est conservée en note.
- issue: Article devant βασιλεύς dans la parole rapportée
  choice: Je suis roi des Juifs
  alternative: Je suis le roi des Juifs
  rationale: Le grec n’a pas d’article devant le nom attribut. Les deux tours sont possibles en français; le texte garde la forme sans article et la note préserve l’autre possibilité sans en tirer une distinction théologique.
translation_notes:
  register: Français international moderne, sobre et digne. Les citations imbriquées sont ponctuées clairement. Le passé simple convient au registre narratif biblique sans être archaïque; la formulation « mais qu’il a dit » conserve la structure légèrement abrupte de la correction demandée.
