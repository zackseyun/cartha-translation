id: JHN.19.14
reference: John 19:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: fr
  text: 'C’était le jour de la Préparation de la Pâque ; il était environ la sixième heure[a]. Et il dit aux Juifs[b] : « Voici votre roi ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Selon la manière de compter les heures, cela pourrait correspondre, en termes modernes, à environ midi.
    reason: cultural_note
  - marker: b
    text: Dans ce contexte, « les Juifs » peut désigner plus précisément les autorités judéennes ou les dirigeants juifs.
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: le jour de la Préparation de la Pâque
  rationale: « Jour de la Préparation » explicite la valeur temporelle de παρασκευή, tandis que « de la Pâque » garde le rapport génitif sans trancher davantage la nature exacte de cette préparation.
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: il était environ la sixième heure
  rationale: Cette formulation conserve la manière antique de compter les heures ainsi que l’approximation exprimée par ὡς. Une équivalence moderne possible est donnée en note.
- source_word: λέγει
  choice: il dit
  rationale: Le présent historique grec produit un récit vif. En français narratif moderne, le présent « il dit » risquerait ici une rupture temporelle artificielle ; le passé composé restitue naturellement l’acte de parole dans la séquence.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: La traduction directe évite de restreindre explicitement le référent aux seuls dirigeants, restriction que le grec n’énonce pas, tout en signalant en note la portée contextuelle possible.
- source_word: Ἴδε
  choice: Voici
  rationale: « Voici » est une formule française naturelle de présentation solennelle et publique, correspondant à la force déictique de Ἴδε.
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: votre roi
  rationale: La tournure idiomatique conserve la possession exprimée par ὑμῶν ainsi que la portée politique et ironique de la déclaration.
theological_decisions:
- issue: Référent de « les Juifs » dans l’Évangile selon Jean
  choice: Conserver « aux Juifs » dans le texte principal
  alternative: aux autorités judéennes ; aux dirigeants juifs
  rationale: Le texte source porte τοῖς Ἰουδαίοις sans restriction explicite. La note préserve la possibilité d’un référent contextuellement plus étroit sans l’imposer au texte.
- issue: Notation antique de « la sixième heure »
  choice: Conserver l’expression culturelle ancienne dans le texte principal
  alternative: vers midi
  rationale: Le grec donne une heure approximative selon un système antique. Maintenir « la sixième heure » évite de résoudre implicitement les questions relatives au mode de calcul, tandis que la note fournit l’équivalent moderne possible.
translation_notes:
  register: Français international moderne, sobre et digne. La ponctuation française et « Voici » donnent à la proclamation sa force publique sans archaïsme excessif. La majuscule à « Préparation » signale l’emploi quasi technique du terme comme désignation du jour.
