  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: fr
  text: Portant lui-même la croix[a], il sortit vers le lieu appelé « Lieu du Crâne », qui se dit en hébreu Golgotha[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits omettent « lui-même la croix ».
    reason: textual_variant
  - marker: b
    text: 'Ou peut-être : « en araméen ». Le terme employé par Jean, traduit par « en hébreu », peut désigner la langue sémitique locale de la Judée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: Portant
  rationale: Le participe exprime concrètement l’action de porter; « portant » est naturel et fidèle.
- source_word: αὑτῷ τὸν σταυρόν
  choice: lui-même la croix
  rationale: Le datif réfléchi met l’accent sur le fait que Jésus porte lui-même la croix, sans imposer une lecture strictement possessive.
- source_word: σταυρός
  choice: croix
  rationale: « Croix » est l’équivalent établi et suffisamment large; le grec n’exige pas ici le sens plus précis de « traverse ».
- source_word: ἐξῆλθεν
  choice: il sortit
  rationale: Rend directement l’aoriste de « sortir », dans un registre narratif digne et courant.
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: au lieu appelé « Lieu du Crâne »
  rationale: Cette formulation conserve les éléments « lieu » et « crâne » tout en formant un nom de lieu intelligible en français.
- source_word: ὃ λέγεται
  choice: qui se dit
  rationale: La tournure française convient à l’indication du nom d’un lieu dans une autre langue.
- source_word: Ἑβραϊστί
  choice: en hébreu
  rationale: Le texte grec dit explicitement « en hébreu »; l’éventuelle référence à l’araméen est signalée en note.
- source_word: Γολγοθα
  choice: Golgotha
  rationale: Le nom propre est translittéré selon son usage français établi.
theological_decisions:
- issue: Identification de la langue désignée par Ἑβραϊστί
  choice: en hébreu
  alternative: en araméen
  rationale: La traduction principale suit la désignation explicite du grec, tandis que la note préserve la possibilité que, chez Jean, ce terme renvoie à la langue sémitique locale, possiblement l’araméen.
translation_notes:
  register: Français international moderne, sobre et narratif. « Lui-même » préserve l’insistance du réfléchi; les guillemets identifient clairement le nom traduit du lieu.
