  terminology: « Écriture », « vêtements » et « habit » sont bien choisis. La distinction entre le pluriel ἱμάτια et le singulier ἱματισμός est préservée sans surinterpréter le type de vêtement. La référence au Psaume est exacte selon les numérotations hébraïque et grecque/latine.
