source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: fr
  text: 'Ils se dirent donc les uns aux autres : « Ne la déchirons pas, mais tirons au sort pour savoir à qui elle sera », afin que soit accomplie l’Écriture qui dit : « Ils se sont partagé mes vêtements[a] et ils ont tiré au sort mon habit. » C’est donc ce que firent les soldats.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Citation du Psaume 22.19 (21.19 dans la numérotation grecque et latine).
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: déchirons
  rationale: Le verbe désigne l’action de déchirer ou de fendre; « déchirer » est le terme français naturel pour une tunique.
- source_word: αὐτόν
  choice: la
  rationale: Le pronom grec masculin renvoie contextuellement à la tunique mentionnée au verset précédent; le français exige donc le féminin « la ».
- source_word: λάχωμεν
  choice: tirons au sort
  rationale: Le verbe évoque l’attribution d’un bien par le sort. « Tirer au sort » est l’expression idiomatique courante en français.
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: pour savoir à qui elle sera
  rationale: Cette formulation française explicite naturellement ce que le tirage doit déterminer, à savoir l’identité du propriétaire, sans ajouter d’idée étrangère au grec.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: afin que soit accomplie l’Écriture
  rationale: Cette formulation conserve la valeur finale de ἵνα et le passif du verbe, tout en restant digne et lisible.
- source_word: ἡ γραφή
  choice: l’Écriture
  rationale: Dans ce contexte johannique, le terme désigne l’Écriture sacrée et non un écrit quelconque.
- source_word: ἡ λέγουσα
  choice: qui dit
  rationale: Le participe introduit la citation; « qui dit » en restitue simplement et naturellement la fonction.
- source_word: Διεμερίσαντο
  choice: Ils se sont partagé
  rationale: Le verbe exprime la répartition des vêtements entre plusieurs personnes; la tournure pronominale française rend naturellement cette distribution.
- source_word: ἱμάτιά
  choice: vêtements
  rationale: Le pluriel désigne les habits ou vêtements, souvent les vêtements de dessus; « vêtements » est clair et convient au registre de la citation.
- source_word: ἑαυτοῖς
  choice: se sont partagé
  rationale: Le pronom réfléchi indique que les bénéficiaires de la répartition sont eux-mêmes; cette valeur est intégrée idiomatiquement dans la construction française.
- source_word: ἱματισμόν
  choice: habit
  rationale: Le singulier « habit » maintient une distinction lexicale avec « vêtements » et convient au parallélisme poétique sans préciser indûment le type de vêtement.
- source_word: ἔβαλον κλῆρον
  choice: ils ont tiré au sort
  rationale: Cette expression française rend idiomatiquement l’action de recourir au sort; le contexte indique que l’enjeu est l’attribution de l’habit.
- source_word: Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν
  choice: Voilà donc ce que firent les soldats
  rationale: La tournure restitue la conclusion emphatique et récapitulative du grec dans un français naturel et digne.
theological_decisions:
- issue: Rapport entre l’action des soldats et l’accomplissement de l’Écriture dans ἵνα ἡ γραφὴ πληρωθῇ
  choice: Traduire directement par « afin que soit accomplie l’Écriture » sans expliquer davantage le mécanisme de l’accomplissement.
  alternative: « de sorte que l’Écriture fut accomplie »
  rationale: La formulation retenue préserve la valeur finale habituelle de la formule johannique et la tension entre l’intention divine exprimée par l’Écriture et l’action humaine des soldats, sans imposer une explication déterministe particulière.
translation_notes:
  register: Français international moderne, clair et digne. Le discours des soldats reste direct et naturel; la citation biblique conserve un léger relief poétique. Le marqueur [a] est placé dans la citation après la première proposition à laquelle renvoie la note.
