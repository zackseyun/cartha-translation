  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: fr
  text: 'Alors ils crièrent : « Enlève-le ! Enlève-le ! Crucifie-le ! » Pilate leur dit : « Vais-je crucifier votre roi ? » Les grands prêtres répondirent : « Nous n’avons de roi que César. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: Alors ils crièrent
  rationale: κραυγάζω exprime un cri poussé avec force; « crièrent » garde cette intensité sans préciser indûment l’émotion. οὖν assure ici la progression ou la conséquence narrative, rendue naturellement par « alors ». Le démonstratif ἐκεῖνοι est représenté sobrement par « ils ».
- source_word: Ἆρον ἆρον
  choice: À mort ! À mort !
  rationale: Dans ce contexte où la foule exige immédiatement la crucifixion, l’impératif répété fonctionne comme un cri réclamant que Jésus soit supprimé. « À mort ! » restitue en français actuel sa force idiomatique et judiciaire, sans la formulation peu naturelle « enlève-le ».
- source_word: σταύρωσον αὐτόν
  choice: Crucifie-le !
  rationale: Dans le contexte romain, σταυρόω désigne précisément l’exécution par crucifixion.
- source_word: λέγει αὐτοῖς ὁ Πιλᾶτος
  choice: Pilate leur dit
  rationale: Le présent historique grec est rendu par le passé simple, naturel dans un récit français de registre soutenu mais accessible.
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: Vais-je crucifier votre roi ?
  rationale: Le subjonctif délibératif exprime une question rhétorique et provocatrice. « Vais-je » est naturel en français moderne et conserve la pointe de la question.
- source_word: οἱ ἀρχιερεῖς
  choice: les grands prêtres
  rationale: Au pluriel, le terme désigne les principaux responsables de l’autorité sacerdotale; « grands prêtres » est la désignation française biblique usuelle et intelligible.
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: Nous n’avons pas d’autre roi que César
  rationale: La construction εἰ μὴ marque l’exception exclusive. Cette formulation française exprime clairement que César est présenté comme leur seul roi.
theological_decisions:
- issue: La déclaration d’allégeance politique des grands prêtres
  choice: Nous n’avons pas d’autre roi que César
  alternative: Nous n’avons de roi que César
  rationale: La traduction maintient la portée exclusive et saisissante de la déclaration dans le récit, sans en atténuer la tension théologique ni ajouter une interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et oralement percutant. Le passé simple convient au récit biblique écrit sans archaïsme lexical. Les répliques restent brèves pour préserver la violence et la tension de la scène.
