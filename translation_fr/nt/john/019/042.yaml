id: JHN.19.42
reference: John 19:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: fr
  text: Comme c’était le jour de la Préparation des Juifs[a] et que le tombeau était tout proche, c’est donc là qu’ils déposèrent Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le jour de préparation juif » ou « la Préparation des Juifs ».
    reason: Le grec permet plusieurs formulations du lien entre « Préparation » et « des Juifs »; « Préparation » peut être compris comme le nom donné à ce jour.
lexical_decisions:
- source_word: ἐκεῖ
  choice: c’est donc là que
  rationale: La tournure présentative française exprime naturellement le lieu choisi pour l’ensevelissement et donne à ἐκεῖ sa pleine valeur sans devoir répéter « là » en fin de phrase.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence et la continuité du récit; « donc » en conserve clairement la force.
- source_word: διὰ τὴν παρασκευὴν
  choice: comme c’était le jour de la Préparation
  rationale: διά avec l’accusatif indique la cause. La formulation explicite en français moderne le sens calendaire probable de παρασκευή tout en conservant le terme historique « Préparation ».
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Le complément du nom reproduit sans l’interpréter davantage le génitif grec, qui rattache cette Préparation aux Juifs, à leurs pratiques ou à leur calendrier.
- source_word: ὅτι
  choice: et que
  rationale: 'Dans la construction causale ouverte par « Comme », cette coordination introduit naturellement la raison supplémentaire donnée par le texte: la proximité du tombeau.'
- source_word: ἐγγὺς
  choice: tout proche
  rationale: Expression française courante qui souligne la proximité immédiate du tombeau sans ajouter de précision spatiale.
- source_word: μνημεῖον
  choice: tombeau
  rationale: Dans ce contexte d’ensevelissement, « tombeau » désigne précisément le lieu préparé où le corps est déposé.
- source_word: ἔθηκαν
  choice: ils déposèrent
  rationale: « Déposer » convient dignement à la mise du corps dans le tombeau et rend le sens contextuel de τίθημι.
- source_word: τὸν Ἰησοῦν
  choice: Jésus
  rationale: Forme française usuelle du nom propre, objet direct du verbe.
theological_decisions:
- issue: Sens de παρασκευή dans le récit de la Passion
  choice: jour de la Préparation
  alternative: Préparation; jour de préparation
  rationale: Le mot peut fonctionner comme une désignation calendaire établie. « Jour de la Préparation » reste compréhensible pour le lecteur moderne sans préciser au-delà du texte s’il s’agit de la préparation du sabbat ou de la fête.
- issue: Portée du génitif τῶν Ἰουδαίων
  choice: des Juifs
  alternative: juive; propre aux Juifs
  rationale: La traduction conserve la construction du grec et son ambiguïté d’association, sans en faire un jugement théologique ou ethnique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase réorganise légèrement les propositions pour rendre clairement les deux motifs exprimés dans le grec, tout en mettant en relief le lieu par « c’est donc là ». La majuscule à « Préparation » signale un emploi calendaire sans imposer une précision absente du verset.
