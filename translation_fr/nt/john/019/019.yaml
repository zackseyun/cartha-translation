id: JHN.19.19
reference: John 19:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: fr
  text: 'Pilate écrivit aussi une inscription et la plaça sur la croix. Il était écrit : « Jésus le Nazaréen, le roi des Juifs[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le roi des Judéens ». Le terme grec peut désigner soit les Juifs au sens large, soit plus particulièrement les habitants de la Judée, selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: une inscription
  rationale: 'Dans le contexte d’une crucifixion, τίτλος désigne l’écriteau indiquant le motif de la condamnation. « Inscription » est naturel, précis et s’accorde avec la suite : « Il était écrit ».'
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: la plaça sur la croix
  rationale: Le grec dit explicitement « sur la croix ». « La plaça » convient au registre narratif et reprend clairement « inscription ».
- source_word: ἦν ... γεγραμμένον
  choice: Il était écrit
  rationale: Cette tournure rend la construction périphrastique grecque et son état résultant de façon idiomatique en français.
- source_word: Ναζωραῖος
  choice: le Nazaréen
  rationale: Le terme grec est une désignation adjectivale ou nominale, et non une expression explicite signifiant « de Nazareth ». « Le Nazaréen » en préserve la forme tout en restant intelligible.
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: le roi des Juifs
  rationale: Dans l’inscription publique rapportant le chef d’accusation royal, « le roi des Juifs » est la formulation française établie et convient au sens contextuel. La possibilité lexicale « Judéens » est signalée en note.
- source_word: δὲ καὶ
  choice: aussi
  rationale: « Aussi » exprime naturellement la valeur additive de la combinaison de particules dans la continuité du récit.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française usuelle du nom Ἰησοῦς.
- source_word: Πιλᾶτος
  choice: Pilate
  rationale: Forme française usuelle du nom Πιλᾶτος.
- source_word: σταυροῦ
  choice: croix
  rationale: « Croix » est le terme français standard et contextuellement approprié dans le récit de la Passion.
theological_decisions:
- issue: Sens de Ἰουδαίων dans l’inscription
  choice: des Juifs
  alternative: des Judéens
  rationale: L’expression fonctionne ici comme une désignation royale publique liée au chef d’accusation contre Jésus. « Des Juifs » rend le sens conventionnel et probablement visé dans ce contexte, tandis que « des Judéens », lexicalement possible, est conservé en note afin de ne pas effacer l’ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe suit de près la progression du grec sans reproduire mécaniquement ses particules. « Fit aussi rédiger » exprime ici l’action de Pilate sans imposer qu’il ait écrit l’inscription de sa propre main.
