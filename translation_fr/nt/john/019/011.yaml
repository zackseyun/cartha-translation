id: JHN.19.11
reference: John 19:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: fr
  text: 'Jésus lui répondit : « Tu n’aurais sur moi aucune autorité si elle ne t’avait pas été donnée d’en haut[a]. C’est pourquoi celui qui m’a livré à toi[b] est coupable d’un plus grand péché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du ciel ». Le grec dit « d’en haut », expression qui, dans l’Évangile selon Jean, indique souvent une origine divine.
    reason: lexical_alternative
  - marker: b
    text: La personne qui a livré Jésus à Pilate n’est pas expressément identifiée ici. Il peut s’agir de Judas, de Caïphe ou, plus largement, des autorités juives.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: autorité
  rationale: Dans le contexte judiciaire, « autorité » exprime la compétence de gouverner et de juger qui a été déléguée à Pilate; « pouvoir » pourrait évoquer surtout la capacité ou la force.
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: sur moi aucune
  rationale: Avec ἐξουσίαν, cette formulation française exprime naturellement l’autorité exercée sur quelqu’un, tandis que « aucune » conserve l’emphase de οὐδεμίαν.
- source_word: δεδομένον σοι
  choice: ne t’avait pas été donnée
  rationale: Le plus-que-parfait passif indique naturellement que cette autorité a été accordée auparavant et qu’elle conditionne la situation présente de Pilate.
- source_word: ἄνωθεν
  choice: d’en haut
  rationale: Cette traduction préserve l’expression johannique et son indication d’une origine divine sans la rendre plus explicite que le grec.
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette locution conserve le lien logique et causal avec l’affirmation précédente dans un français naturel.
- source_word: ὁ παραδούς μέ σοι
  choice: celui qui m’a livré à toi
  rationale: « Livré » correspond au vocabulaire de la Passion tout en laissant ouverte l’identité de la personne ou de l’instance désignée.
- source_word: μείζονα ἁμαρτίαν ἔχει
  choice: est coupable d’un plus grand péché
  rationale: Le tour littéral « a un plus grand péché » serait peu naturel en français. Cette formulation exprime la culpabilité comparative indiquée par le grec, sans nier la culpabilité de Pilate.
theological_decisions:
- issue: Origine de l’autorité de Pilate suggérée par ἄνωθεν
  choice: « d’en haut », évoquant une origine divine sans développer une doctrine générale du pouvoir politique
  alternative: « du ciel »
  rationale: Le contexte et l’usage johannique orientent vers Dieu comme source, mais « d’en haut » conserve la formulation et la résonance propres au texte grec.
- issue: Identité de ὁ παραδούς μέ σοι
  choice: 'Maintenir la désignation non précisée : « celui qui m’a livré à toi »'
  alternative: Identifier Judas, Caïphe ou plus largement les autorités juives
  rationale: Le verset ne nomme pas explicitement le référent; la traduction préserve donc cette ambiguïté réelle.
- issue: Comparaison des culpabilités
  choice: « un plus grand péché », ce qui compare les degrés de culpabilité
  alternative: Formuler la phrase comme si Pilate était innocent
  rationale: Le comparatif μείζονα implique une culpabilité plus grande chez celui qui a livré Jésus, sans supprimer celle de Pilate.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du raisonnement grec, tandis que « est coupable de » évite le calque peu naturel « a un péché ». Les marqueurs de notes sont placés précisément après les expressions qu’ils expliquent.
