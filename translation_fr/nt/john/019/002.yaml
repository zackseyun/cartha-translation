  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: fr
  text: Les soldats tressèrent une couronne d’épines, la posèrent sur sa tête et le revêtirent d’un vêtement pourpre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: soldats
  rationale: Équivalent courant et précis pour les militaires romains présents dans ce récit.
- source_word: πλέξαντες
  choice: tressèrent
  rationale: Le participe aoriste exprime une action accomplie avant la pose de la couronne; la coordination française restitue naturellement la succession des gestes.
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: une couronne d’épines
  rationale: « Couronne » conserve la parodie royale, et « d’épines » exprime naturellement en français la matière dont elle est faite.
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: la posèrent sur sa tête
  rationale: Cette formulation idiomatique explicite par le pronom « la » l’objet sous-entendu en grec et rend fidèlement la construction locative.
- source_word: ἱμάτιον
  choice: vêtement
  rationale: Le terme grec est général; « vêtement » évite de préciser sans nécessité qu’il s’agissait d’une robe ou d’un manteau.
- source_word: πορφυροῦν
  choice: pourpre
  rationale: Le terme français traditionnel et actuel conserve la couleur ainsi que ses connotations royales.
- source_word: περιέβαλον αὐτόν
  choice: le revêtirent de
  rationale: « Revêtir de » rend avec dignité et naturel l’action de placer un vêtement autour de quelqu’un.
theological_decisions:
- issue: Imagerie de royauté tournée en dérision
  choice: Décrire simplement la couronne et le vêtement pourpre, sans expliciter la moquerie.
  alternative: Ajouter que les soldats le parodiaient ou se moquaient de sa royauté.
  rationale: Le texte grec rapporte les gestes sans en donner ici une interprétation explicite; leur portée ironique ressort suffisamment du contexte et du vocabulaire.
translation_notes:
  register: Français international moderne, clair et digne. La phrase privilégie une coordination naturelle en français tout en conservant l’ordre des trois actions. Aucun marqueur de note n’est requis.
