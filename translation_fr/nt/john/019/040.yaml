  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: fr
  text: Ils prirent donc le corps de Jésus et l’enveloppèrent de linges, avec les aromates, selon la coutume funéraire des Juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des Judéens », si le terme est compris géographiquement plutôt qu’au sens ethnique et religieux ; ici, le contexte favorise une allusion générale aux pratiques funéraires juives.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: ils prirent
  rationale: Le verbe désigne ici le fait de prendre le corps afin de le préparer pour l’ensevelissement.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence narrative de ce qui précède; « donc » est naturel et conserve ce lien.
- source_word: σῶμα
  choice: corps
  rationale: « Corps » rend directement le grec sans la rudesse supplémentaire de « cadavre ».
- source_word: ἔδησαν
  choice: l’enveloppèrent
  rationale: Bien que le verbe signifie littéralement « lier », le contexte des linges funéraires appelle en français naturel « envelopper », sans exclure l’idée qu’ils furent attachés autour du corps.
- source_word: ὀθονίοις
  choice: de linges
  rationale: Le terme désigne de petites pièces ou bandes de toile de lin employées pour la sépulture; « linges » est clair et non excessivement interprétatif.
- source_word: ἀρώματα
  choice: les aromates
  rationale: « Aromates » désigne avec précision les substances odorantes utilisées dans les rites funéraires et convient au registre biblique français actuel.
- source_word: καθὼς
  choice: selon
  rationale: Cette préposition exprime naturellement la conformité à une pratique établie.
- source_word: ἔθος ἐστὶν
  choice: la coutume funéraire
  rationale: L’expression grecque signifie qu’il s’agit d’un usage habituel; « funéraire » explicite naturellement le domaine indiqué par l’infinitif qui suit.
- source_word: τοῖς Ἰουδαίοις
  choice: des Juifs
  rationale: Dans ce contexte, le terme renvoie à la pratique funéraire du peuple juif en général plutôt qu’aux seules autorités ou aux seuls habitants de la Judée.
- source_word: ἐνταφιάζειν
  choice: funéraire
  rationale: L’infinitif concerne la préparation et la mise au tombeau; son sens est intégré avec naturel dans l’expression « coutume funéraire ».
theological_decisions:
- issue: Sens de τοῖς Ἰουδαίοις
  choice: des Juifs
  alternative: des Judéens
  rationale: Le contexte décrit une coutume d’ensevelissement largement juive, et non une action propre aux autorités judéennes. La variante géographique demeure toutefois linguistiquement possible et est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le lien narratif, évite un vocabulaire macabre et rend l’action funéraire de façon idiomatique sans surinterpréter les détails matériels.
