id: JHN.19.20
reference: John 19:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: fr
  text: Beaucoup de Juifs lurent donc cette inscription, parce que l’endroit où Jésus fut crucifié était près de la ville. Elle était rédigée en hébreu[a], en latin et en grec.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être : « en araméen » ; Jean emploie « hébreu » pour désigner la langue sémitique locale.'
    reason: Ἑβραϊστί signifie littéralement « en hébreu », mais, dans l’usage johannique, il peut renvoyer à la langue sémitique locale, probablement l’araméen.
lexical_decisions:
- source_word: τίτλον
  choice: inscription
  rationale: Dans le contexte de la crucifixion, le mot désigne l’écriteau portant le motif de la condamnation; « inscription » est précis, naturel et digne en français moderne.
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: beaucoup de Juifs
  rationale: Cette formulation française rend naturellement la construction partitive grecque sans faire de généralisation sur l’ensemble du peuple juif.
- source_word: ἀνέγνωσαν
  choice: lurent
  rationale: Le verbe indique simplement l’action de lire; rien dans le texte n’impose l’idée d’une lecture à haute voix.
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: l’endroit ... était près de la ville
  rationale: Rend directement la proximité géographique sans ajouter la mention d’une porte de la ville, absente du grec.
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: où Jésus avait été crucifié
  rationale: Le passif grec est conservé. Le plus-que-parfait situe naturellement la crucifixion avant la lecture de l’inscription dans le récit français.
- source_word: ἦν γεγραμμένον
  choice: Elle était rédigée
  rationale: Cette formulation exprime l’état résultant de la construction périphrastique au parfait et évite la répétition maladroite de « inscription » et « écrite ».
- source_word: Ἑβραϊστί
  choice: en hébreu
  rationale: Le texte principal conserve la désignation explicite du grec; la possibilité qu’elle vise ici l’araméen est signalée en note.
- source_word: Ῥωμαϊστί
  choice: en latin
  rationale: Bien que l’adverbe signifie littéralement « en romain », il désigne idiomatiquement la langue latine.
- source_word: Ἑλληνιστί
  choice: en grec
  rationale: Équivalent français direct et usuel de l’adverbe de langue.
- source_word: οὖν
  choice: donc
  rationale: « Donc » maintient le lien logique et narratif avec le verset précédent de manière naturelle en français.
theological_decisions:
- issue: Sens de Ἑβραϊστί dans l’usage johannique
  choice: « en hébreu » dans le texte principal
  alternative: « en araméen »
  rationale: Le grec dit explicitement « en hébreu ». Toutefois, cette désignation peut renvoyer à la langue sémitique locale, probablement l’araméen; l’ambiguïté historique est donc préservée en note plutôt que tranchée dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique soutenu sans être archaïque; le plus-que-parfait clarifie l’antériorité de la crucifixion. Le marqueur [a] est placé après « inscription », conformément à la couche de consultation fournie, bien que la note porte précisément sur la mention ultérieure de l’hébreu.
