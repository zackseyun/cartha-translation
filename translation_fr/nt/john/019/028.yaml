source:
  edition: SBLGNT
  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: fr
  text: 'Après cela, Jésus, sachant que tout était déjà accompli, dit, afin que l’Écriture s’accomplisse : « J’ai soif. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Après cela
  rationale: Transition temporelle naturelle qui conserve le démonstratif singulier τοῦτο et convient au style narratif de Jean.
- source_word: εἰδὼς
  choice: sachant
  rationale: Le participe circonstanciel se rapporte à Jésus et exprime ici une connaissance concomitante.
- source_word: ἤδη πάντα τετέλεσται
  choice: tout était désormais accompli
  rationale: Le parfait indique un état d’achèvement déjà atteint. « Tout » rend πάντα, tandis que « désormais » exprime ἤδη sans alourdir la phrase.
- source_word: ἵνα τελειωθῇ ἡ γραφή
  choice: afin que l’Écriture s’accomplisse
  rationale: Avec l’Écriture pour sujet, « s’accomplir » est idiomatique en français et garde la nuance de finalité de ἵνα ainsi que le lien lexical avec l’idée d’achèvement.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel de la narration biblique écrite en français.
- source_word: Διψῶ
  choice: J’ai soif
  rationale: Expression française directe, actuelle et digne correspondant exactement à l’état exprimé par le présent grec; « Je suis assoiffé » serait moins naturel et plus intense.
theological_decisions:
- issue: Rapport entre la connaissance de Jésus, l’achèvement de tout et l’accomplissement de l’Écriture
  choice: Le texte affirme que Jésus sait que tout est déjà accompli, puis qu’il parle afin que l’Écriture s’accomplisse.
  alternative: On peut entendre ἵνα avec une nuance de résultat, sans préciser un système théologique plus large.
  rationale: La formulation conserve l’enchaînement syntaxique et la tension du grec sans ajouter d’explication doctrinale sur la prescience ou la prédestination. Elle maintient aussi la proximité, sans les confondre, entre τετέλεσται et τελειωθῇ.
translation_notes:
  register: Français international moderne, sobre et digne. « J’ai soif » est la formulation française idiomatique et traditionnelle; aucune note lexicale n’est nécessaire. L’ordre « dit, afin que… » évite de faire dépendre trop naturellement la proposition finale de « tout était accompli », tout en restant fidèle à la syntaxe grecque.
