id: JHN.19.16
reference: John 19:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: fr
  text: Alors, il le leur livra afin qu’il soit crucifié.[a] Ils prirent donc Jésus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « pour être crucifié ».'
    reason: lexical_alternative
  - marker: b
    text: Dans ce verset, le grec ne précise pas qui sont « leur » et « ils » ; leur identité doit être comprise d’après le contexte immédiat.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Alors
  rationale: Dans ce contexte narratif, « alors » exprime naturellement à la fois la succession temporelle et la conséquence, sans l’accumulation peu idiomatique « alors donc ».
- source_word: παρέδωκεν
  choice: livra
  rationale: Le verbe désigne ici la remise de Jésus au pouvoir d’autrui. « Livra » convient au contexte judiciaire et reste naturel dans un registre digne.
- source_word: αὐτὸν αὐτοῖς
  choice: le leur
  rationale: Les deux pronoms sont conservés sans préciser l’identité des destinataires, que le grec ne nomme pas dans ce verset.
- source_word: ἵνα σταυρωθῇ
  choice: afin qu’il soit crucifié
  rationale: Cette formulation maintient la valeur de but de ἵνα ainsi que la voix passive du verbe.
- source_word: Παρέλαβον
  choice: Ils prirent
  rationale: Dans ce passage, le verbe indique qu’ils prennent Jésus en charge. La formulation concise laisse le sujet implicite aussi indéterminé que dans le grec.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence et la progression du récit dans la seconde phrase.
- source_word: Ἰησοῦν
  choice: Jésus
  rationale: Forme française usuelle du nom propre.
theological_decisions:
- issue: Identité des destinataires de la remise et du sujet de « prirent »
  choice: Conserver les pronoms non précisés « leur » et « ils ».
  alternative: Identifier explicitement les chefs des prêtres, leurs agents ou les soldats romains.
  rationale: Le verset grec ne nomme pas ces personnes. Les identifier dans le corps du texte résoudrait une ambiguïté que le récit laisse dépendre du contexte.
- issue: Force de la proposition ἵνα σταυρωθῇ
  choice: « afin qu’il soit crucifié »
  alternative: « pour être crucifié »
  rationale: La proposition développée préserve explicitement le but et le passif sans déterminer davantage quels acteurs procéderont à la crucifixion.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe demeure fluide tout en conservant les pronoms non identifiés et la proposition de but du grec.
