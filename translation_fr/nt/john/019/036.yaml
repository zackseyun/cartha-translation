id: JHN.19.36
reference: John 19:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: fr
  text: 'En effet, ces choses sont arrivées afin que s’accomplisse l’Écriture : « Aucun de ses os ne sera brisé. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement, en grec : « Un os de lui ne sera pas brisé. » Le singulier « os » est rendu idiomatiquement par « Aucun de ses os ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: sont arrivées
  rationale: L’aoriste de γίνομαι désigne ici les événements qui viennent d’être racontés. « Sont arrivées » est naturel en français moderne et conserve le sens événementiel.
- source_word: γὰρ
  choice: En effet
  rationale: γάρ apporte l’explication de l’affirmation précédente. « En effet » rend clairement ce lien sans donner à la phrase une tournure archaïque.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie aux faits précédemment rapportés. « Ces choses » reste proche de la forme grecque tout en étant intelligible.
- source_word: ἵνα
  choice: afin que
  rationale: La conjonction introduit ici l’accomplissement visé ou résultant. « Afin que » conserve cette nuance téléologique.
- source_word: ἡ γραφή
  choice: l’Écriture
  rationale: Dans cet emploi johannique, γραφή désigne l’Écriture sacrée. Le singulier défini est conservé.
- source_word: πληρωθῇ
  choice: s’accomplisse
  rationale: Le subjonctif passif aoriste après ἵνα est rendu par le subjonctif français. La forme pronominale « s’accomplisse » exprime naturellement l’accomplissement d’une parole écrite sans préciser explicitement l’agent.
- source_word: Ὀστοῦν
  choice: aucun de ses os
  rationale: Le grec emploie le singulier « os » avec une portée distributive ou collective. La formulation française « aucun de ses os » en restitue naturellement le sens.
- source_word: οὐ συντριβήσεται
  choice: ne sera brisé
  rationale: Le futur passif de συντρίβω désigne ici un os qui ne sera pas brisé. « Brisé » convient au contexte et maintient l’écho scripturaire.
- source_word: αὐτοῦ
  choice: ses
  rationale: Le génitif du pronom est naturellement rendu en français par l’adjectif possessif « ses ».
theological_decisions:
- issue: Formulation de la citation scripturaire et maintien de son écho à Exode 12.46, Nombres 9.12 et Psaume 34.21 dans la numérotation française courante
  choice: « Aucun de ses os ne sera brisé. »
  alternative: « Un os de lui ne sera pas brisé. »
  rationale: Le singulier grec a une portée collective ou distributive. La formulation retenue est idiomatique en français, conserve l’idée qu’aucun os n’est brisé et ne tranche pas davantage l’identification précise de la source scripturaire.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde le lien explicatif et la construction d’accomplissement du grec, tandis que la citation est formulée selon l’usage naturel du français.
