source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: fr
  text: Alors Pilate, après avoir entendu ces paroles, fit sortir Jésus et s’assit sur le siège du tribunal[a], à un endroit appelé « le Pavé de pierre » et, en hébreu[b], « Gabbatha ».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « fit asseoir Jésus sur le siège du tribunal ». Le verbe grec peut être compris transitivement, bien que le sens le plus probable ici soit que Pilate lui-même s’assit sur ce siège.'
    reason: alternative_reading
  - marker: b
    text: Dans Jean, « en hébreu » désigne probablement la langue sémitique locale, sans doute l’araméen.
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: Quand
  rationale: La relation narrative avec ce qui précède est rendue naturellement par la proposition temporelle formée avec le participe ἀκούσας; une traduction distincte de οὖν alourdirait ici le français.
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: eut entendu ces paroles
  rationale: Le participe aoriste marque une action antérieure à la suite du récit; le passé antérieur convient après « quand ». « Paroles » désigne naturellement les propos qui viennent d’être prononcés.
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: il fit sortir Jésus
  rationale: Cette formulation française exprime clairement le déplacement vers l’extérieur sans préciser indûment que Pilate l’aurait conduit lui-même.
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: s’assit sur le siège du juge
  rationale: Dans ce contexte judiciaire, βῆμα désigne le siège ou l’estrade depuis lesquels le magistrat rend son jugement. Le sens intransitif, avec Pilate comme sujet, est le plus probable, tout en maintenant l’autre analyse en note.
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: au lieu appelé « le Pavé de pierre »
  rationale: Avec le mouvement suivi de l’installation, εἰς se rend idiomatiquement par « au ». Le nom grec transparent est traduit pour communiquer son sens.
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: et, en hébreu, Gabbatha
  rationale: Le texte dit littéralement « en hébreu »; cette désignation est conservée dans le corps du verset, tandis qu’une note précise son emploi johannique probable. δέ est ici faiblement connectif.
theological_decisions:
- issue: Sujet et valeur de ἐκάθισεν
  choice: Pilate s’assit sur le siège du juge
  alternative: Pilate fit asseoir Jésus sur le siège du juge
  rationale: La forme grecque permet une compréhension intransitive ou transitive. Le contexte judiciaire et la syntaxe la plus naturelle favorisent Pilate prenant place pour juger; l’autre lecture, réelle et interprétativement importante, est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. « Siège du juge » rend la fonction judiciaire de βῆμα dans une langue accessible; les guillemets signalent le nom traduit du lieu.
