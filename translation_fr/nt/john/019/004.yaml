base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: fr
  text: 'Pilate sortit de nouveau et leur dit : « Voyez, je vous le fais amener dehors afin que vous sachiez que je ne trouve aucun motif d’accusation contre lui[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne trouve en lui aucune faute ». Cette expression grecque est souvent rendue ainsi de façon plus traditionnelle ; dans ce contexte, elle a vraisemblablement un sens judiciaire : Pilate ne trouve aucun motif valable d’accusation contre Jésus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: sortit
  rationale: En français, « sortir » exprime naturellement le déplacement vers l’extérieur ; ajouter « dehors » serait ici inutilement redondant.
- source_word: πάλιν
  choice: de nouveau
  rationale: Cette expression marque clairement la répétition et convient au registre narratif.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit littéraire en français.
- source_word: Ἴδε
  choice: Voyez
  rationale: L’impératif attire l’attention des interlocuteurs de Pilate dans une langue actuelle et digne, sans l’archaïsme de « voici que » ou « voyez donc ».
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: je vous l’amène dehors
  rationale: ἄγω peut signifier « conduire » ou « amener ». Dans cette scène, Pilate présente Jésus à ceux qui sont dehors ; « amener dehors » conserve à la fois le mouvement et la destination.
- source_word: ἵνα γνῶτε
  choice: afin que vous sachiez
  rationale: La formulation conserve explicitement la valeur de but de ἵνα et le sens de connaissance de γινώσκω.
- source_word: οὐδεμίαν αἰτίαν
  choice: aucun motif d’accusation
  rationale: Dans ce contexte judiciaire, αἰτία désigne un fondement d’accusation ou une charge valable, plutôt qu’une faute morale au sens large.
- source_word: εὑρίσκω ἐν αὐτῷ
  choice: je ne trouve ... contre lui
  rationale: La tournure française judiciaire « trouver un motif d’accusation contre quelqu’un » rend idiomatiquement l’expression grecque sans reproduire artificiellement la préposition ἐν.
theological_decisions:
- issue: Portée judiciaire de la déclaration de Pilate sur l’innocence de Jésus
  choice: je ne trouve aucun motif d’accusation contre lui
  alternative: je ne trouve en lui aucune faute
  rationale: Le contexte est celui d’une appréciation juridique par Pilate. La traduction retenue fait ressortir cette dimension sans transformer à elle seule la déclaration en affirmation théologique plus générale ; la formulation traditionnelle demeure signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au récit écrit ; le discours direct reste naturel. La formulation juridique évite aussi bien l’archaïsme que l’importation d’une interprétation confessionnelle.
