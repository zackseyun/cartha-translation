  variant: modern international French
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: fr
  text: Comme c’était le jour de la Préparation[a], les Juifs[b] demandèrent donc à Pilate qu’on leur brise les jambes et qu’on enlève les corps, afin que les corps ne restent pas sur la croix pendant le sabbat — car ce jour de sabbat-là était particulièrement important[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le « jour de la Préparation » désigne le jour précédant le sabbat, consacré aux préparatifs.
    reason: Clarification lexicale et culturelle de παρασκευή.
  - marker: b
    text: Dans certains contextes de l’Évangile selon Jean, « les Juifs » peut désigner plus précisément les autorités ou les responsables juifs.
    reason: Préservation de l’ambiguïté contextuelle du terme Ἰουδαῖοι.
  - marker: c
    text: 'Littéralement : « car le jour de ce sabbat-là était grand »; autrement dit, ce jour de sabbat avait une importance particulière.'
    reason: Signalement de la forme littérale et de la portée contextuelle de μεγάλη.
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: les Juifs demandèrent donc
  rationale: « donc » rend la valeur inférentielle ou consécutive de οὖν. « les Juifs » conserve le terme grec sans en restreindre explicitement le référent, tandis qu’une note signale son emploi contextuel possible chez Jean.
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: Comme c’était le jour de la Préparation
  rationale: παρασκευή désigne ici le jour où l’on prépare ce qui est nécessaire avant le sabbat. La majuscule en fait une désignation calendaire identifiable, expliquée en note.
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: afin que les corps ne restent pas sur la croix pendant le sabbat
  rationale: « afin que » exprime clairement le but marqué par ἵνα avec le subjonctif. « pendant le sabbat » rend naturellement la valeur temporelle de ἐν.
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: car ce sabbat-là était un jour particulièrement important
  rationale: Cette formulation naturelle rend la grandeur ou l’importance spéciale exprimée par μεγάλη sans recourir à l’expression traditionnelle mais peu transparente « grand jour ».
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: demandèrent donc à Pilate
  rationale: Le verbe ἐρωτάω exprime ici une demande adressée à l’autorité romaine; le français n’a pas besoin d’ajouter explicitement « la permission ».
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: de faire briser les jambes des crucifiés
  rationale: La tournure causative française rend le passif grec et clarifie le référent de αὐτῶν sans ajouter d’identité étrangère au contexte.
- source_word: καὶ ἀρθῶσιν
  choice: et de les faire enlever
  rationale: αἴρω peut signifier enlever ou emporter. « faire enlever » conserve l’étendue du verbe, sans préciser de manière indue seulement la descente de croix.
theological_decisions:
- issue: Référent de Ἰουδαῖοι dans le quatrième Évangile
  choice: les Juifs
  alternative: les autorités juives; les Judéens
  rationale: Le contexte peut viser plus précisément les responsables qui s’adressent à Pilate, mais le grec ne comporte pas le mot « responsables ». Le texte principal reste formellement proche de la source et la note préserve l’ambiguïté contextuelle.
- issue: Portée de μεγάλη appliqué au jour de ce sabbat
  choice: un jour particulièrement important
  alternative: un grand jour; un jour solennel
  rationale: Le grec indique le caractère exceptionnel de ce sabbat sans préciser ici la nature exacte de son importance. La traduction communique cette valeur sans importer une explication liturgique ou doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase est réorganisée selon l’ordre naturel du français tout en conservant les rapports de cause, de but et d’explication du grec. « Les crucifiés » évite l’ambiguïté d’un simple pronom possessif et demeure directement fourni par la scène.
