id: JHN.19.35
reference: John 19:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: fr
  text: Celui qui a vu a témoigné, et son témoignage est vrai. Celui-là sait qu’il dit vrai, afin que vous aussi, vous croyiez.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « afin que vous aussi, vous continuiez à croire ». Le subjonctif présent grec peut comporter une nuance de continuité.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: celui qui a vu
  rationale: Le participe parfait substantivé désigne celui qui a effectivement vu, avec une portée qui demeure. Cette formulation conserve la structure grecque et la valeur de témoin oculaire sans expliciter « témoin oculaire » dans le texte.
- source_word: μεμαρτύρηκεν
  choice: a témoigné
  rationale: Le passé composé rend naturellement en français l’acte accompli dont le témoignage reste valable. Il maintient aussi le lien lexical avec « témoignage ».
- source_word: ἀληθινὴ αὐτοῦ ἐστιν ἡ μαρτυρία
  choice: son témoignage est vrai
  rationale: « Vrai » exprime directement ici la véracité et la fiabilité du témoignage, sans réduire le terme à la seule idée d’authenticité.
- source_word: ἐκεῖνος
  choice: celui-là
  rationale: Le démonstratif conserve l’insistance du grec et évite de déterminer si le narrateur parle de lui-même à la troisième personne ou d’un autre témoin.
- source_word: οἶδεν
  choice: sait
  rationale: Bien que formellement parfait, οἶδα a une valeur présente et stative ; « sait » est l’équivalent français naturel.
- source_word: ἀληθῆ λέγει
  choice: dit vrai
  rationale: Cette tournure française concise et digne rend idiomatiquement l’idée de dire des choses vraies ou de parler conformément à la vérité.
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: afin que vous aussi, vous croyiez
  rationale: « Afin que » marque clairement le but. La reprise pronominale « vous aussi, vous » fait ressortir l’inclusion emphatique portée par καὶ ὑμεῖς, tandis que « croyiez » laisse ouverte la nuance ponctuelle ou continue du présent grec.
theological_decisions:
- issue: Référent des expressions emphatiques désignant le témoin
  choice: 'Le texte garde la troisième personne : « celui qui a vu » et « celui-là ».'
  alternative: Identifier explicitement le témoin au disciple bien-aimé, au narrateur, ou à une autre personne.
  rationale: Le grec n’identifie pas expressément le témoin. La formulation retenue préserve donc l’ambiguïté et l’éventuelle solennité autoréférentielle sans trancher.
- issue: Valeur aspectuelle de πιστεύητε
  choice: « vous croyiez » dans le texte principal
  alternative: « vous continuiez à croire »
  rationale: Le subjonctif présent peut suggérer une foi qui se poursuit, mais il n’impose pas ici cette interprétation. Le texte principal reste non marqué et la nuance durative possible est signalée en note.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de la famille lexicale « témoigné / témoignage » reflète celle du grec. « Celui-là » est volontairement plus marqué qu’un simple « il » afin de conserver l’emphase et l’ambiguïté du texte source.
