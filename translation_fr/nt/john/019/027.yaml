source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: fr
  text: 'Puis il dit au disciple : « Voici ta mère. » Et dès cette heure-là, le disciple l’accueillit chez lui.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: Voici
  rationale: Dans cette formule de désignation, « Voici » est naturel et digne en français, tout en conservant la force présentative de l’impératif grec.
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: dès cette heure-là
  rationale: Rend explicitement le point de départ temporel exprimé par ἀπό, sans réduire nécessairement ὥρα à un instant strict.
- source_word: ἔλαβεν
  choice: l’accueillit
  rationale: Dans ce contexte relationnel et domestique, « accueillir » exprime plus naturellement que « prendre » le fait que le disciple la prend sous sa responsabilité.
- source_word: εἰς τὰ ἴδια
  choice: chez lui
  rationale: L’expression idiomatique désigne ce qui appartient en propre au disciple, probablement son foyer ou son milieu personnel ; « chez lui » reste naturel sans ajouter le mot « maison », absent du grec.
theological_decisions:
- issue: Portée de la parole « Voici ta mère »
  choice: Traduction littérale sans explicitation doctrinale
  alternative: Ajouter une notion de maternité spirituelle universelle ou d’adoption formelle
  rationale: Le verset établit directement une nouvelle relation entre Jésus, sa mère et le disciple, mais n’en explicite pas ici une portée ecclésiale plus large.
- issue: Nature de l’accueil du disciple
  choice: « l’accueillit chez lui »
  alternative: « la prit pour sienne » ou « la prit dans sa propre maison »
  rationale: La formulation retenue suggère la prise en charge concrète sans imposer une interprétation possessive, juridique ou sacramentelle.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe demeure proche du grec, tandis que « l’accueillit chez lui » évite une tournure littérale maladroite et ne surtraduit pas τὰ ἴδια par « maison ».
