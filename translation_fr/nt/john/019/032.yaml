id: JHN.19.32
reference: John 19:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: fr
  text: Les soldats vinrent donc et brisèrent les jambes du premier, et celles de l’autre qui avait été crucifié avec lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence et la continuité narrative avec le verset précédent, dans un français naturel.
- source_word: οἱ στρατιῶται
  choice: les soldats
  rationale: Désignation courante et précise des militaires romains présents dans la scène.
- source_word: τοῦ μὲν πρώτου
  choice: du premier
  rationale: Le grec désigne le premier des deux hommes crucifiés aux côtés de Jésus sans employer un nom. Le français peut conserver cette formulation elliptique avec clarté.
- source_word: κατέαξαν τὰ σκέλη
  choice: brisèrent les jambes
  rationale: Rend directement l’action de casser les jambes; « briser » convient à la violence délibérée du geste sans ajouter de détail.
- source_word: καὶ τοῦ ἄλλου
  choice: puis celles de l’autre
  rationale: Le pronom « celles » reprend clairement « les jambes », tandis que « puis » exprime naturellement la succession narrative portée ici par καί.
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: qui avait été crucifié avec lui
  rationale: Le participe identifie l’autre homme par une action antérieure à l’arrivée des soldats. « Avec lui » conserve la forme pronominale du grec.
theological_decisions:
- issue: Référent de αὐτῷ
  choice: « avec lui », compris dans le contexte comme renvoyant à Jésus
  alternative: Comprendre « lui » comme renvoyant au premier homme
  rationale: Dans le récit johannique, les deux autres condamnés sont définis par leur crucifixion aux côtés de Jésus, personnage central de la scène. La traduction pronominale française conserve néanmoins la formulation du grec sans explicitation interprétative.
translation_notes:
  register: Français moderne, digne et narratif. Le passé simple convient au récit écrit, tandis que l’ellipse « du premier » et la reprise « celles de l’autre » évitent d’ajouter le nom « homme », absent du grec, tout en assurant la clarté.
