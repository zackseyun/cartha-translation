  terminology: « Vin aigre » est une bonne traduction de ὄξος, avec les alternatives utiles en note. « C’est accompli » conserve l’objet implicite de Τετέλεσται. « Remit son esprit » maintient la formulation marquante de παρέδωκεν τὸ πνεῦμα sans réduire l’expression à « mourut » ni l’interpréter doctrinalement.
