  rationale: La révision adopte « eut reçu » pour la fidélité contextuelle à ἔλαβεν, améliore légèrement la fluidité de la liaison initiale et restitue plus étroitement le rapport participial entre l’inclinaison de la tête et la remise de l’esprit. Elle conserve l’ambiguïté de Τετέλεσται, le registre sobre et les notes existantes, dont les ancres sont toutes présentes et correctement associées.
