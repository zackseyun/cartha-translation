id: JHN.19.30
reference: John 19:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: fr
  text: 'Lorsque donc Jésus eut reçu le vin aigre[a], il dit : « C’est accompli[b]. » Et, inclinant la tête, il remit son esprit[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le vinaigre » ou « le vinaigre de vin ». Le grec ὄξος désigne du vin aigre.
    reason: lexical_alternative
  - marker: b
    text: Ou « Tout est accompli » ou « C’est achevé ».
    reason: lexical_alternative
  - marker: c
    text: 'Ou « expira ». Le grec dit plus littéralement : « remit l’esprit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Quand donc
  rationale: « Quand » exprime la relation temporelle, tandis que « donc » conserve la fonction de liaison et de progression narrative de οὖν.
- source_word: ἔλαβεν
  choice: eut pris
  rationale: Le passé antérieur marque naturellement en français soutenu l’action achevée avant la parole de Jésus. « Prendre » reste proche de λαμβάνω et convient au contexte où le vin lui est présenté.
- source_word: τὸ ὄξος
  choice: le vin aigre
  rationale: ὄξος désigne du vin devenu aigre, ou vinaigré. « Vin aigre » informe mieux le lecteur moderne que le seul mot « vinaigre » sur la nature de la boisson.
- source_word: Τετέλεσται
  choice: C’est accompli
  rationale: Le parfait de τελέω présente l’action comme menée à son terme avec un résultat qui demeure. « C’est accompli » conserve à la fois l’idée d’achèvement et celle d’accomplissement, sans préciser ce que le grec laisse implicite.
- source_word: κλίνας τὴν κεφαλήν
  choice: il inclina la tête
  rationale: Cette formulation française naturelle rend l’action du participe aoriste qui précède le verbe principal.
- source_word: παρέδωκεν
  choice: remit
  rationale: παραδίδωμι signifie fondamentalement « remettre » ou « livrer ». Ici, « remit » reste intelligible dans la formule de mort tout en préservant davantage que « mourut » le caractère volontaire suggéré par l’expression.
- source_word: τὸ πνεῦμα
  choice: son esprit
  rationale: Le grec dit littéralement « l’esprit », mais le possessif est naturel en français pour désigner l’esprit de Jésus. « Esprit » préserve la portée de πνεῦμα mieux qu’une simple mention du souffle.
theological_decisions:
- issue: Faut-il rendre παρέδωκεν τὸ πνεῦμα comme une simple expression signifiant que Jésus mourut, ou conserver l’image de la remise de l’esprit ?
  choice: remit son esprit
  alternative: expira
  rationale: La formulation retenue suit les mots du grec et laisse percevoir la présentation johannique de la mort de Jésus comme un acte volontaire, sans développer une interprétation doctrinale au-delà du texte.
- issue: Faut-il expliciter ce qui est accompli dans Τετέλεσται ?
  choice: C’est accompli
  alternative: Tout est accompli
  rationale: Le grec ne nomme pas explicitement le sujet de l’accomplissement. « C’est accompli » garde cette indétermination et la tension interprétative du texte.
translation_notes:
  register: Français international actuel, digne et accessible. Le passé antérieur convient à la narration écrite sans être archaïque. La phrase conserve la progression temporelle du grec ainsi que l’implicite de Τετέλεσται; les notes signalent les principales possibilités lexicales sans imposer une lecture confessionnelle.
