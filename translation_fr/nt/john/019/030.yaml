    rationale: κλίνας est un participe aoriste lié au verbe principal παρέδωκεν. « Et, inclinant la tête, il remit son esprit » préserve plus étroitement ce lien sans surdéterminer la chronologie.
  - severity: low
    issue: « Quand donc »
    rationale: La formulation est possible, mais « Lorsque donc » convient mieux au français narratif soutenu et conserve la liaison discursive de οὖν.
