  text: ἀπεκρίθη ὁ Πιλᾶτος· Ὃ γέγραφα γέγραφα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/022.yaml
  text: Pilate answered[a], “What I have written, I have written.”
translation:
  language: fr
  text: 'Pilate répondit : « Ce que j’ai écrit, je l’ai écrit. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Aoriste de ἀποκρίνομαι, employé de façon déponente au sens de « répondre ». « Répondit » est naturel et digne dans un récit français.
- source_word: ὁ Πιλᾶτος
  choice: Pilate
  rationale: Le nom propre est rendu sous sa forme française usuelle; l’article grec, courant devant les noms propres dans le récit, n’est pas reproduit.
- source_word: Ὃ
  choice: Ce que
  rationale: Le pronom relatif neutre substantivé signifie « ce que ». Cette tournure est idiomatique en français moderne.
- source_word: γέγραφα
  choice: j’ai écrit
  rationale: Le parfait actif de γράφω présente l’écriture comme un acte accompli dont le résultat demeure. Le passé composé français convient naturellement au contexte; sa répétition conserve la formulation catégorique du grec.
theological_decisions:
- issue: Portée de la répétition du parfait γέγραφα γέγραφα
  choice: « Ce que j’ai écrit, je l’ai écrit. »
  alternative: « Ce que j’ai écrit reste écrit. »
  rationale: La répétition exacte préserve la forme rhétorique grecque et exprime le caractère arrêté de la décision de Pilate, sans expliciter davantage que le texte source la permanence du résultat.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition volontaire est maintenue afin de préserver la brièveté et la fermeté de la réponse.
