id: JHN.19.41
reference: John 19:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: fr
  text: À l’endroit où il avait été crucifié, il y avait un jardin, et dans ce jardin un tombeau neuf où personne n’avait encore été déposé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: non rendu explicitement
  rationale: La particule marque ici une légère progression narrative. En français, la continuité du récit suffit à en porter la valeur, sans ajouter un « or » potentiellement plus marqué.
- source_word: ἐν τῷ τόπῳ
  choice: À l’endroit
  rationale: « À l’endroit » exprime naturellement la localisation précise indiquée par le grec.
- source_word: ὅπου ἐσταυρώθη
  choice: où il avait été crucifié
  rationale: Le passif grec est conservé. Le plus-que-parfait situe naturellement la crucifixion avant la présence du jardin et du tombeau évoquée dans le récit.
- source_word: κῆπος
  choice: jardin
  rationale: « Jardin » est l’équivalent courant et précis, sans introduire la spécificité non exprimée d’un verger.
- source_word: μνημεῖον καινόν
  choice: un tombeau neuf
  rationale: « Tombeau » convient au lieu funéraire décrit, et « neuf » conserve l’adjectif distinct de l’explication qui suit, selon laquelle personne n’y avait encore été déposé.
- source_word: ἐν ᾧ
  choice: où
  rationale: Le relatif locatif « où » renvoie clairement au tombeau et donne une formulation française fluide.
- source_word: οὐδέπω οὐδεὶς
  choice: personne n’avait encore
  rationale: Cette tournure reproduit naturellement la négation portant sur toute personne ainsi que la valeur temporelle de « pas encore ».
- source_word: ἦν τεθειμένος
  choice: avait été déposé
  rationale: Le plus-que-parfait passif rend l’état résultant antérieur exprimé par la construction périphrastique grecque. « Déposé » convient au contexte de mise au tombeau.
theological_decisions:
- issue: Vocabulaire de la mise au tombeau
  choice: tombeau … avait encore été déposé
  alternative: tombe … avait encore été placé
  rationale: Le choix retenu exprime clairement le contexte funéraire sans ajouter d’interprétation théologique.
- issue: Voix de ἐσταυρώθη
  choice: il avait été crucifié
  alternative: on l’avait crucifié
  rationale: Le passif préserve la forme du grec et n’ajoute aucun agent explicite.
translation_notes:
  register: Français moderne, clair et digne. La répétition grecque de « dans le jardin » est légèrement reprise par « dans ce jardin », qui assure la cohésion sans alourdir la phrase.
