  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: fr
  text: 'Et une autre Écriture dit aussi : « Ils regarderont celui qu’ils ont transpercé. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils regarderont vers celui qu’ils ont transpercé. » La construction grecque peut souligner la direction du regard. Cette formulation fait écho à Zacharie 12.10.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: encore
  rationale: L’adverbe introduit une citation scripturaire supplémentaire; « encore » est naturel dans cette formule.
- source_word: ἑτέρα γραφή
  choice: une autre Écriture
  rationale: Dans l’usage johannique, γραφή désigne un texte faisant autorité; ἑτέρα présente ici un autre témoignage scripturaire.
- source_word: λέγει
  choice: dit
  rationale: Le présent conserve la formule vivante par laquelle le texte biblique est présenté comme parlant.
- source_word: Ὄψονται
  choice: ils regarderont
  rationale: Le futur de ὁράω, suivi de εἰς, exprime ici un regard dirigé plutôt qu’une simple perception visuelle.
- source_word: εἰς ὃν
  choice: celui qu’ils
  rationale: Après un verbe de vision, εἰς marque la direction du regard vers une personne. En français, « regarder celui que » l’exprime naturellement sans ajouter une préposition peu idiomatique.
- source_word: ἐξεκέντησαν
  choice: ont transpercé
  rationale: Le verbe désigne l’action de percer profondément. Le passé composé rend naturellement l’aoriste grec et relie l’acte accompli au regard futur.
theological_decisions:
- issue: Rendre l’allusion à Zacharie 12.10 sans importer dans Jean une formulation absente de son texte grec
  choice: Ils regarderont celui qu’ils ont transpercé
  alternative: Ils tourneront les regards vers celui qu’ils ont transpercé
  rationale: La traduction suit la formulation grecque de Jean et maintient l’identification du transpercé avec Jésus dans le contexte, sans introduire la première personne divine du texte hébreu de Zacharie.
- issue: Préserver la nuance directionnelle de εἰς après ὄψονται
  choice: regarderont celui
  alternative: tourneront les regards vers celui
  rationale: Le français transitif « regarder quelqu’un » exprime normalement la direction du regard. Une note signale la traduction plus explicite, qui fait ressortir la valeur de εἰς.
translation_notes:
  register: Français international moderne, sobre et digne. « Écriture » prend une majuscule parce qu’il s’agit ici d’un texte scripturaire déterminé. « Transpercé » conserve la force du geste dans le contexte de la crucifixion.
