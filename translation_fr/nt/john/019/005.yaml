id: JHN.19.5
reference: John 19:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: fr
  text: 'Jésus sortit donc, portant la couronne d’épines et le manteau pourpre. Pilate leur dit : « Voici[a] l’homme. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Regardez : l’homme ! » Le grec Ἰδού est une expression qui attire l’attention et peut se traduire par « voici », « regardez » ou « voyez ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: sortit
  rationale: Le verbe français « sortir » exprime naturellement le mouvement vers l’extérieur; il n’est pas nécessaire d’ajouter « dehors », qui serait plus lourd dans ce contexte.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque ici la conséquence et la progression du récit sans donner au lien une force logique excessive.
- source_word: φορῶν
  choice: portant
  rationale: Le participe « portant » s’applique naturellement à la couronne comme au manteau et conserve la simultanéité de la scène.
- source_word: τὸν ἀκάνθινον στέφανον
  choice: la couronne d’épines
  rationale: Expression française courante et exacte pour une couronne faite d’épines.
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: le manteau pourpre
  rationale: « Manteau » convient à un vêtement extérieur sans préciser indûment sa forme; « pourpre » conserve la couleur et sa connotation royale dans cette scène de dérision.
- source_word: λέγει αὐτοῖς
  choice: Pilate leur dit
  rationale: Le contexte identifie Pilate comme le locuteur. Nommer le sujet évite qu’en français le pronom « il » soit compris comme renvoyant à Jésus, immédiatement mentionné.
- source_word: Ἰδοὺ
  choice: Voici
  rationale: « Voici » est une formule française naturelle de présentation qui garde la force publique et solennelle de l’interjection grecque.
- source_word: ὁ ἄνθρωπος
  choice: l’homme
  rationale: La formulation désigne concrètement Jésus présenté à la foule et préserve la concision ainsi que les résonances possibles de l’expression grecque.
theological_decisions:
- issue: Sens de ὁ ἄνθρωπος dans la déclaration de Pilate
  choice: l’homme
  alternative: l’être humain
  rationale: « L’homme » désigne directement Jésus dans la scène, sans effacer les éventuelles résonances représentatives de la formule ni imposer celles-ci dans la traduction.
- issue: Identification du locuteur de λέγει
  choice: Pilate leur dit
  alternative: il leur dit
  rationale: Le contexte antérieur fournit Pilate comme sujet implicite. L’explicitation est nécessaire à la clarté française et ne transforme pas Jésus en locuteur.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. La ponctuation française et l’espace avant les deux-points sont respectées; la formule « Voici l’homme » conserve la sobriété et la force de la présentation.
