id: JHN.19.18
reference: John 19:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: fr
  text: Là, ils le crucifièrent, et avec lui deux autres, un d’un côté et un de l’autre, et Jésus au milieu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus concise : « de part et d’autre, avec Jésus entre eux ».'
    reason: Variante de formulation qui exprime la même disposition spatiale de façon plus ramassée.
lexical_decisions:
- source_word: ὅπου
  choice: Là
  rationale: Dans la continuité du verset précédent, « Là » rend naturellement l’adverbe relatif de lieu ὅπου sans alourdir la phrase par « à l’endroit où ».
- source_word: ἐσταύρωσαν
  choice: ils le crucifièrent
  rationale: Le verbe σταυρόω désigne ici sans ambiguïté la crucifixion. Cette formulation française est précise et n’ajoute aucun détail sur les modalités du supplice.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: μετά avec le génitif exprime l’accompagnement ou l’association; « avec lui » en est l’équivalent direct et naturel.
- source_word: ἄλλους δύο
  choice: deux autres
  rationale: Le grec ne répète aucun nom et ne précise pas explicitement « hommes » dans ce verset; « deux autres » conserve cette concision.
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: un d’un côté et un de l’autre
  rationale: La paire d’adverbes situe les deux autres crucifiés de part et d’autre. La formulation choisie rend explicitement la répartition, sans ajouter « de Jésus », qui reste implicite jusqu’à la proposition suivante.
- source_word: μέσον δὲ τὸν Ἰησοῦν
  choice: et Jésus au milieu
  rationale: μέσον indique la position centrale de Jésus. Le δέ est rendu par « et », liaison légère qui respecte la coordination et le relief final porté sur Jésus.
theological_decisions:
- issue: Faut-il expliciter que Jésus se trouvait entre les deux autres?
  choice: « un d’un côté et un de l’autre, et Jésus au milieu »
  alternative: « de part et d’autre, avec Jésus entre eux »
  rationale: Le texte grec décrit d’abord la disposition des deux autres, puis place Jésus au centre. La traduction conserve cette progression et l’image spatiale sans remplacer « au milieu » par l’explicitation « entre eux ».
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique écrit. La structure garde le mouvement du grec et sa mise en relief finale de Jésus, tout en restant immédiatement compréhensible.
