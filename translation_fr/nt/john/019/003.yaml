  text: καὶ ⸂ἤρχοντο πρὸς αὐτὸν καὶ⸃ ἔλεγον· Χαῖρε, ὁ βασιλεὺς τῶν Ἰουδαίων· καὶ ἐδίδοσαν αὐτῷ ῥαπίσματα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: fr
  text: 'Ils s’approchaient de lui et disaient : « Salut, roi des Juifs ! » Et ils lui donnaient des gifles.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν καὶ ἔλεγον
  choice: Ils s’approchaient de lui et disaient
  rationale: Les deux imparfaits décrivent naturellement une action en cours ou répétée. En français, cette formulation conserve la scène de railleries répétées sans l’alourdir.
- source_word: Χαῖρε
  choice: Salut
  rationale: Dans ce contexte, le mot reprend une formule de salutation adressée ironiquement à un roi. « Salut » est intelligible en français moderne et conserve l’écho de l’acclamation moqueuse.
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: roi des Juifs
  rationale: Traduction directe du titre politique et messianique employé dans le récit de la Passion.
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: ils lui donnaient des gifles
  rationale: La construction signifie littéralement qu’ils lui donnaient des coups, et ῥαπίσματα désigne ici des gifles ou coups portés de la main. L’imparfait français conserve l’aspect répété.
theological_decisions:
- issue: Tonalité de la salutation adressée à Jésus
  choice: Conserver la formule d’hommage royal sans ajouter explicitement qu’elle est ironique
  alternative: « Vive le roi des Juifs ! » ou « Je te salue, roi des Juifs ! »
  rationale: Le contexte rend la moquerie manifeste. La traduction laisse au récit lui-même le soin d’en communiquer l’ironie et évite une paraphrase interprétative.
translation_notes:
  register: Français moderne, courant et digne. Les imparfaits rendent la durée ou la répétition des gestes. « Salut » fonctionne comme une acclamation moqueuse, non comme une salutation familière contemporaine.
