  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: fr
  text: Quand Pilate entendit ces paroles, il eut encore plus peur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε
  choice: Quand
  rationale: Introduit naturellement en français la circonstance temporelle qui provoque la réaction de Pilate.
- source_word: οὖν
  choice: —
  rationale: La continuité logique et narrative est suffisamment portée par le contexte et par la proposition temporelle; ajouter « donc » alourdirait ici le français sans gain notable.
- source_word: ἤκουσεν
  choice: entendit
  rationale: Dans ce contexte narratif, le verbe désigne le fait de prendre connaissance de paroles prononcées.
- source_word: ὁ Πιλᾶτος
  choice: Pilate
  rationale: Le français omet normalement l’article grec devant ce nom propre.
- source_word: τοῦτον τὸν λόγον
  choice: ces paroles
  rationale: L’expression renvoie à ce qui vient d’être déclaré au verset précédent. « Ces paroles » est naturel, précis dans le contexte et ne réduit pas λόγος à un seul mot.
- source_word: μᾶλλον
  choice: encore plus
  rationale: Exprime clairement l’intensification comparative de la peur déjà éprouvée par Pilate.
- source_word: ἐφοβήθη
  choice: eut peur
  rationale: Le passé simple convient au récit et, avec « encore plus », présente la peur de Pilate comme une réaction accrue à ce qu’il vient d’entendre.
theological_decisions:
- issue: Nature de la peur de Pilate
  choice: Décrire simplement l’accroissement de sa peur, sans en préciser la cause politique, superstitieuse ou théologique.
  alternative: Expliciter soit une inquiétude politique, soit la crainte d’une possible origine divine de Jésus.
  rationale: Le grec indique seulement que Pilate eut davantage peur après avoir entendu ces paroles. La traduction préserve cette tension narrative sans trancher ce que le texte laisse implicite.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient le registre narratif biblique sans archaïsme; la formulation reste accessible à un large lectorat.
