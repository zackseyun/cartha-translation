source:
  edition: SBLGNT
  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: fr
  text: Or, près de la croix de Jésus se tenaient sa mère, la sœur de sa mère, Marie de Clopas[a][b], et Marie de Magdala.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec identifie Marie par rapport à Clopas sans préciser explicitement la nature de leur lien. On comprend souvent qu’elle était sa femme.
    reason: lexical_alternative
  - marker: b
    text: Le grec peut aussi être compris comme nommant trois femmes plutôt que quatre, si « la sœur de sa mère » et « Marie de Clopas » désignent la même personne.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: se tenaient
  rationale: L’imparfait français exprime naturellement la posture qui se prolonge, correspondant à la valeur stative et durative de la forme grecque.
- source_word: δὲ
  choice: Or
  rationale: Ici, δέ introduit une transition narrative plutôt qu’une opposition forte. « Or » marque discrètement ce changement de scène sans ajouter une indication temporelle absente du grec.
- source_word: παρὰ τῷ σταυρῷ
  choice: près de la croix
  rationale: παρά avec le datif indique la proximité. « Près de » est naturel en français et ne précise pas indûment la distance.
- source_word: τοῦ Ἰησοῦ
  choice: de Jésus
  rationale: Le complément du nom conserve la relation directe exprimée par le génitif grec.
- source_word: ἡ μήτηρ αὐτοῦ
  choice: sa mère
  rationale: Traduction directe et idiomatique du groupe nominal.
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: la sœur de sa mère
  rationale: Cette formulation française naturelle reproduit sans expansion la construction au génitif.
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: Marie, femme de Clopas
  rationale: Le groupe article plus génitif identifie Marie par son lien avec Clopas. Le lien conjugal est l’interprétation contextuelle la plus courante, mais comme le grec ne dit pas explicitement « femme », l’expression plus littérale est signalée en note.
- source_word: Μαρία ἡ Μαγδαληνή
  choice: Marie de Magdala
  rationale: Cette forme française courante rend l’épithète géographique qui identifie Marie comme originaire de Magdala.
theological_decisions:
- issue: Identification et nombre des femmes présentes auprès de la croix
  choice: 'Le texte principal présente quatre femmes : la mère de Jésus, la sœur de sa mère, Marie femme de Clopas et Marie de Magdala.'
  alternative: On peut comprendre que « la sœur de sa mère » désigne Marie de Clopas, ce qui donnerait une liste de trois femmes.
  rationale: La coordination se lit naturellement comme une liste de quatre personnes, mais la syntaxe grecque compacte permet aussi de prendre « Marie de Clopas » en apposition à « la sœur de sa mère ». La note conserve cette ambiguïté sans la trancher sur une base doctrinale.
translation_notes:
  register: 'Français international moderne, sobre et digne. L’ordre locatif initial et l’imparfait « se tenaient » donnent une narration fluide tout en conservant la proximité spatiale et l’aspect duratif du grec. Les notes préservent les deux ambiguïtés réelles : la relation de Marie avec Clopas et le nombre de femmes énumérées.'
