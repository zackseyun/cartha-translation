  text: Τότε οὖν ἔλαβεν ὁ Πιλᾶτος τὸν Ἰησοῦν καὶ ἐμαστίγωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: fr
  text: Alors Pilate prit Jésus et le fouetta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec dit littéralement : « le fouetta ». Pilate est le sujet grammatical; le texte ne précise pas s’il exécuta lui-même la flagellation ou la fit exécuter.'
    reason: Préserver l’ambiguïté concernant l’action directe ou déléguée.
lexical_decisions:
- source_word: Τότε
  choice: Alors
  rationale: Marque naturellement en français la succession temporelle et narrative.
- source_word: οὖν
  choice: — (intégré au mouvement narratif)
  rationale: Sa valeur de progression est portée par « Alors »; une traduction distincte alourdirait la phrase.
- source_word: ἔλαβεν
  choice: prit
  rationale: Rend simplement le sens de λαμβάνω et préserve la structure narrative, sans ajouter l'idée plus forte de saisir ou d'arrêter.
- source_word: ὁ Πιλᾶτος
  choice: Pilate
  rationale: Forme française usuelle du nom; le référent est déjà établi.
- source_word: τὸν Ἰησοῦν
  choice: Jésus
  rationale: Forme française usuelle du nom propre, complément direct de « prit ».
- source_word: ἐμαστίγωσεν
  choice: le fit fouetter
  rationale: « Fouetter » est actuel et compréhensible pour le châtiment désigné. La tournure factitive exprime naturellement en français l'action exercée sous l'autorité de Pilate dans ce contexte, tout en signalant en note la structure grammaticale plus directe du grec.
theological_decisions:
- issue: Rôle personnel ou autorité déléguée de Pilate dans la flagellation
  choice: « le fit fouetter », formulation française naturelle qui présente Pilate comme l'autorité responsable sans affirmer qu'il mania lui-même le fouet
  alternative: « le fouetta »
  rationale: Le grec fait de Pilate le sujet grammatical de ἐμαστίγωσεν, mais un dirigeant peut être présenté comme accomplissant ce qu'il fait exécuter. La note conserve la formulation directe et l'ambiguïté relative à l'agent matériel.
translation_notes:
  register: Français international moderne, sobre et narratif. « Alors » assure la progression; « fit fouetter » évite l'archaïsme de « flageller » tout en gardant la gravité du châtiment.
