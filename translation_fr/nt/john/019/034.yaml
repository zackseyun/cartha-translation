id: JHN.19.34
reference: John 19:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ εἷς τῶν στρατιωτῶν λόγχῃ αὐτοῦ τὴν πλευρὰν ἔνυξεν, καὶ ⸂ἐξῆλθεν εὐθὺς⸃ αἷμα καὶ ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: fr
  text: Mais l’un des soldats lui perça le côté avec une lance[a], et il en sortit aussitôt du sang et de l’eau[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « une pique ».'
    reason: lexical_alternative
  - marker: b
    text: Certains interprètes comprennent « du sang et de l’eau » dans un sens symbolique ou sacramentel ; d’autres y voient une description physique. Le texte grec lui-même n’en explique pas ici la signification.
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque naturellement le contraste avec le fait que les jambes de Jésus n’ont pas été brisées.
- source_word: εἷς τῶν στρατιωτῶν
  choice: l’un des soldats
  rationale: Conserve explicitement la construction partitive du grec.
- source_word: λόγχῃ
  choice: avec une lance
  rationale: « Lance » est le terme français courant et digne pour l’arme d’hast désignée ici.
- source_word: αὐτοῦ τὴν πλευράν
  choice: lui perça le côté
  rationale: La construction française avec le pronom indirect exprime naturellement que le côté est celui de Jésus, sans explicitation superflue.
- source_word: ἔνυξεν
  choice: perça
  rationale: Rend l’action de pénétrer avec une pointe sans ajouter l’idée d’une traversée complète que pourrait suggérer « transperça ».
- source_word: καὶ ἐξῆλθεν εὐθὺς
  choice: et il en sortit aussitôt
  rationale: Conserve la succession et l’immédiateté, tout en employant une tournure impersonnelle naturelle en français.
- source_word: αἷμα καὶ ὕδωρ
  choice: du sang et de l’eau
  rationale: Traduction directe qui maintient l’expression inhabituelle sans lui imposer d’interprétation.
theological_decisions:
- issue: Faut-il interpréter « du sang et de l’eau » de manière sacramentelle, symbolique ou physiologique dans le texte principal ?
  choice: Conserver la description littérale sans l’expliquer dans le texte principal.
  alternative: Y voir une allusion sacramentelle ou symbolique, ou encore une description physiologique des effets de la blessure.
  rationale: Le verset rapporte le phénomène sans en préciser ici la signification. La traduction préserve donc l’ambiguïté et la tension interprétative du texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Lui perça le côté » évite une répétition lourde du possessif, tandis que la tournure impersonnelle « il en sortit » convient au français courant et préserve l’ordre narratif.
