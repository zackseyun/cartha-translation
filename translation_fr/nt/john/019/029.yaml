  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: fr
  text: Un récipient plein de vin aigre[a] se trouvait là. Ils fixèrent donc une éponge pleine de vin aigre à une tige d’hysope[b] et la portèrent à sa bouche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vinaigre ». Le terme grec peut désigner du vin aigre ou du vinaigre ; ici, il désigne probablement la boisson de vin aigre dont disposaient les soldats.
    reason: lexical_alternative
  - marker: b
    text: Litt. « à/sur/avec de l’hysope ». Ou « sur une branche d’hysope » ou « avec de l’hysope ». Le grec ne précise pas « tige » ni « branche » ; la manière exacte dont l’éponge y était fixée ou portée reste discutée.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: récipient
  rationale: Terme général et naturel qui ne précise pas indûment la forme ou la matière de l’objet.
- source_word: ἔκειτο
  choice: il y avait là
  rationale: Rend naturellement en français la valeur stative et descriptive de κεῖμαι à l’imparfait.
- source_word: ὄξος
  choice: vin aigre
  rationale: Dans ce contexte, le terme désigne vraisemblablement une boisson de vin acidulée et bon marché plutôt que du vinaigre employé seulement comme condiment.
- source_word: μεστόν / μεστόν
  choice: plein de / pleine de
  rationale: Conserve la répétition du grec pour le récipient puis l’éponge, tout en respectant l’accord naturel en français.
- source_word: σπόγγον
  choice: une éponge
  rationale: Équivalent lexical direct et courant.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence narrative sans alourdir la phrase.
- source_word: ὑσσώπῳ
  choice: sur de l’hysope
  rationale: Reste proche du datif grec sans ajouter explicitement « branche », absent du texte, tout en laissant ouverte la valeur exacte de moyen ou de support.
- source_word: περιθέντες
  choice: placèrent
  rationale: Transpose le participe aoriste en un verbe coordonné exprimant l’action antérieure à l’approche de l’éponge.
- source_word: προσήνεγκαν
  choice: l’approchèrent
  rationale: Exprime ici le mouvement par lequel l’éponge est portée jusqu’à la bouche, dans un français plus idiomatique que « l’apportèrent à ».
- source_word: αὐτοῦ τῷ στόματι
  choice: de sa bouche
  rationale: Complément naturel après « approcher »; le pronom maintient la continuité du récit sans répéter le nom de Jésus.
theological_decisions:
- issue: Résonance historique et cultuelle de ὑσσώπῳ
  choice: Conserver « hysope » dans le texte sans en expliciter le symbolisme.
  alternative: Traduire de façon plus interprétative par « une branche d’hysope » ou neutraliser le terme en parlant d’une tige ou d’un roseau.
  rationale: Le mot peut évoquer la Pâque et les rites de purification, mais le verset n’explicite pas cette portée. Le maintien d’« hysope » préserve cette éventuelle résonance sans imposer une interprétation.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation demeure accessible tout en conservant la répétition de « plein de » et l’ambiguïté concrète de l’hysope.
