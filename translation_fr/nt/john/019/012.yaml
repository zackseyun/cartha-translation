  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: fr
  text: 'À partir de ce moment[a], Pilate cherchait à le relâcher. Mais les Juifs[b] crièrent : « Si tu relâches cet homme, tu n’es pas ami de César. Quiconque se fait roi s’oppose à César[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À cause de cela ». L’expression grecque peut indiquer le moment à partir duquel Pilate agit ainsi ou la raison pour laquelle il le fait.'
    reason: lexical_alternative
  - marker: b
    text: Dans l’Évangile selon Jean, « les Juifs » désigne souvent, selon le contexte, les autorités judéennes ou certains adversaires juifs de Jésus, et non nécessairement l’ensemble du peuple juif.
    reason: cultural_note
  - marker: c
    text: 'Ou, plus littéralement : « parle contre César »; le verbe grec peut aussi signifier « contredit César ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: À partir de ce moment
  rationale: Cette expression rend naturellement la valeur temporelle probable dans la progression du récit, tout en signalant en note la lecture causale également possible.
- source_word: ἐζήτει
  choice: cherchait
  rationale: L’imparfait grec exprime ici une démarche prolongée ou répétée; l’imparfait français en conserve directement l’aspect duratif.
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: relâcher / relâches
  rationale: « Relâcher » convient au cadre judiciaire et désigne clairement la remise en liberté d’un détenu.
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Mais les Juifs
  rationale: Le texte grec emploie le terme général Ἰουδαῖοι. La traduction ne restreint pas explicitement le référent aux chefs juifs, mais une note précise sa portée narrative fréquente chez Jean.
- source_word: ἐκραύγασαν λέγοντες
  choice: 'crièrent :'
  rationale: Le verbe désigne un cri public et véhément. En français, les deux-points introduisent naturellement les paroles sans qu’il soit nécessaire de reproduire littéralement le participe « disant ».
- source_word: τοῦτον
  choice: cet homme
  rationale: Cette formulation restitue naturellement la force du démonstratif et son ton potentiellement dépréciatif.
- source_word: φίλος τοῦ Καίσαρος
  choice: ami de César
  rationale: La formule française « être ami de » est naturelle et conserve l’accusation de déloyauté politique sans décider s’il s’agit d’un titre officiel.
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: Quiconque se fait roi
  rationale: La formulation reste proche de l’expression grecque et évite de l’affaiblir en simple prétention verbale à la royauté.
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: s’oppose à César
  rationale: Dans ce contexte politique, ἀντιλέγω désigne l’opposition à l’autorité de César. « S’oppose à » est plus idiomatique en français que « parle contre », lequel est conservé en note comme possibilité plus formelle.
theological_decisions:
- issue: Référent de « les Juifs » dans l’Évangile selon Jean
  choice: Conserver « les Juifs » dans le texte principal
  alternative: les chefs juifs / les autorités judéennes / les Judéens
  rationale: Le grec porte οἱ Ἰουδαῖοι sans précision supplémentaire. Une substitution dans le texte principal trancherait l’étendue du référent; la note prévient toutefois une généralisation abusive à l’ensemble du peuple juif.
- issue: Nature de l’accusation portée contre celui qui se fait roi
  choice: s’oppose à César
  alternative: parle contre César
  rationale: Le contexte est celui d’une menace politique adressée à Pilate. La traduction choisie exprime cette opposition sans déterminer plus précisément si elle consiste en paroles, en revendication ou en action.
translation_notes:
  register: Français international moderne, sobre et digne. Le rythme narratif demeure direct; l’imparfait de « cherchait » conserve la durée de l’action, tandis que le passé simple « crièrent » marque l’intervention soudaine du groupe. Les notes maintiennent les ambiguïtés lexicale, narrative et politique du grec.
