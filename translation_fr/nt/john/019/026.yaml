source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: fr
  text: 'Quand Jésus voit donc sa mère et le disciple qu’il aimait, qui se tenait là, il dit à sa mère : « Femme[a], voici ton fils. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Chère femme » ou « Madame ». En grec, cette manière de s’adresser à elle est respectueuse, non impolie, même si « Femme » peut paraître abrupt en français moderne.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la progression et le lien avec la scène précédente, sans alourdir le récit.
- source_word: ἰδὼν
  choice: quand Jésus voit
  rationale: Rend naturellement la valeur temporelle du participe aoriste tout en maintenant la vivacité narrative liée au présent historique λέγει.
- source_word: τὴν μητέρα
  choice: sa mère
  rationale: Le grec emploie l’article, mais le français courant demande ici le possessif pour identifier naturellement la mère de Jésus.
- source_word: τὸν μαθητὴν
  choice: le disciple
  rationale: L’article désigne un disciple précis, déjà identifiable dans le récit johannique.
- source_word: παρεστῶτα
  choice: se tenant là
  rationale: Exprime la présence debout du disciple dans la scène sans préciser davantage que le grec la personne exacte auprès de laquelle il se tient.
- source_word: ὃν ἠγάπα
  choice: qu’il aimait
  rationale: Conserve la formule johannique et son sujet implicite, Jésus, clairement établi par le contexte.
- source_word: λέγει
  choice: il dit
  rationale: Le présent français de narration serait possible, mais « il dit » est plus naturel dans ce récit au passé tout en gardant la parole vive et immédiate.
- source_word: Γύναι
  choice: Femme
  rationale: Traduction directe du vocatif grec. En contexte, l’appellation est respectueuse et non méprisante ; une note prévient la connotation abrupte que le mot peut avoir en français moderne.
- source_word: ἴδε
  choice: voici
  rationale: Dans cette déclaration déictique et solennelle, « voici » est idiomatique en français et conserve mieux la force présentative que « regarde ».
- source_word: ὁ υἱός σου
  choice: ton fils
  rationale: Reproduit l’identification du disciple dans une relation filiale avec la mère de Jésus sans expliciter davantage la nature de cette relation.
theological_decisions:
- issue: Tonalité de l’adresse Γύναι faite à la mère de Jésus
  choice: Conserver « Femme » dans le texte avec une note explicative
  alternative: « Chère femme » ou « Madame »
  rationale: Le grec n’exprime ni rudesse ni mépris. Une formulation plus affectueuse ou plus honorifique ajouterait toutefois une nuance absente du terme lui-même.
- issue: Portée de « voici ton fils »
  choice: Maintenir la déclaration sans expliquer la nature exacte du lien filial
  alternative: Paraphraser comme une adoption, une responsabilité de soin ou une maternité spirituelle
  rationale: Le verset établit une relation filiale, mais n’en formule pas ici toute la portée ; la traduction préserve cette ouverture interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. La structure reste proche du grec tout en évitant un participe initial lourd. « Voici » conserve la solennité de l’énoncé, et la note accompagne le vocatif littéral sans l’adoucir directement dans le texte.
