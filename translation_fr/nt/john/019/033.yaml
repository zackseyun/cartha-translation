source:
  edition: SBLGNT
  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: fr
  text: Mais quand ils arrivèrent à Jésus[a], voyant qu’il était déjà mort[b], ils ne lui brisèrent pas les jambes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jean relie ensuite ce geste à l’Écriture : « Aucun de ses os ne sera brisé » (Jean 19.36 ; voir aussi Exode 12.46 ; Nombres 9.12 ; Psaume 34.21).'
    reason: cross_reference
  - marker: b
    text: 'Autre traduction : « voyant qu’il était déjà décédé » ou « quand ils virent qu’il était déjà mort ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: Mais quand ils arrivèrent à Jésus
  rationale: La construction participiale est naturellement rendue par une proposition temporelle. « Mais » exprime le léger contraste introduit par δέ avec ce que les soldats viennent de faire aux autres crucifiés.
- source_word: ὡς εἶδον
  choice: voyant que
  rationale: Cette formulation conserve la perception qui motive l’action suivante, tout en restant naturelle en français.
- source_word: ἤδη
  choice: déjà
  rationale: Le terme indique que la mort de Jésus avait eu lieu avant l’arrivée des soldats auprès de lui.
- source_word: τεθνηκότα
  choice: il était mort
  rationale: Le participe parfait souligne l’état résultant de la mort. « Il était mort » rend clairement cet état, tandis que la note conserve l’autre formulation possible centrée sur l’événement.
- source_word: οὐ κατέαξαν
  choice: ils ne lui brisèrent pas
  rationale: Dans ce contexte, κατάγνυμι désigne l’action de briser les membres ou leurs os. « Briser » est précis, idiomatique et adapté au registre narratif.
- source_word: τὰ σκέλη
  choice: les jambes
  rationale: σκέλη désigne les jambes. La tournure française « lui briser les jambes » est plus naturelle que « briser ses jambes » et ne devance pas la mention des os au verset 36.
theological_decisions:
- issue: Allusion possible à l’accomplissement de l’Écriture par le fait que les jambes de Jésus ne sont pas brisées
  choice: Conserver dans le texte principal une narration directe, avec « jambes », et signaler le lien scripturaire en note.
  alternative: Employer « os des jambes » ou intégrer explicitement l’idée d’accomplissement.
  rationale: Le verset 36 établit lui-même le rapport avec l’Écriture. Il ne convient pas d’anticiper cette explication dans le verset 33 ni de remplacer le sens ordinaire de σκέλη par « os ».
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La reprise pronominale dans « ils ne lui brisèrent pas les jambes » est idiomatique en français.
