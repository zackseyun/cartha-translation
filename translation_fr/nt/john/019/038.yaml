review_pass:
  verdict: revise
  source_fidelity: 'Le projet rend fidèlement la séquence et les principaux rapports syntaxiques du grec. Une correction est nécessaire dans la dernière proposition : ἦλθεν ... καὶ ἦρεν rapporte deux actions accomplies (« vint et enleva »), non la venue en vue d’une action exprimée par infinitif (« vint ... enlever »).'
  naturalness: Le français est moderne, clair et de registre approprié. « qui le cachait » rend explicitement et naturellement l’idée que Joseph tenait sa condition de disciple cachée.
  terminology: « disciple », « corps », « Pilate » et « Joseph d’Arimathée » sont justes et usuels. « les Juifs » préserve le terme source ; la note apporte avec justesse la clarification contextuelle nécessaire.
  issues:
  - severity: medium
    issue: La dernière phrase emploie « Joseph vint donc enlever son corps ».
    rationale: 'Le grec coordonne deux aoristes, ἦλθεν et ἦρεν : Joseph vint, puis il enleva le corps. L’infinitif français peut présenter l’enlèvement comme le seul but de sa venue et n’exprime pas aussi nettement l’action accomplie. En outre, « son corps » peut créer une ambiguïté française avec Joseph ; « le corps de Jésus » est plus clair.'
  - severity: low
    issue: « mais en secret » reste elliptique quant à ce qui était caché.
    rationale: Le participe κεκρυμμένος concerne, dans le contexte, son statut de disciple. « mais qui le cachait » explicite sobrement cet objet implicite et s’accorde mieux avec la formulation française.
  revised_text: Après cela, Joseph d’Arimathée, qui était disciple de Jésus, mais qui le cachait par crainte des Juifs[a], demanda à Pilate l’autorisation d’enlever le corps de Jésus. Pilate la lui accorda. Joseph vint donc et enleva le corps de Jésus.
  revised_footnotes:
