id: JHN.19.38
reference: John 19:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: fr
  text: Après cela, Joseph d’Arimathée, qui était disciple de Jésus, mais qui le cachait par crainte des Juifs[a], demanda à Pilate l’autorisation d’enlever le corps de Jésus. Pilate la lui accorda. Joseph vint donc et enleva le corps de Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus précisément dans ce contexte, « des autorités judéennes ou juives ». Jean emploie souvent « les Juifs » pour désigner ceux qui s’opposent à Jésus, et non le peuple juif sans distinction.
    reason: Clarifier la portée contextuelle de τῶν Ἰουδαίων sans en réduire le sens dans le texte principal.
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Après cela
  rationale: Transition temporelle naturelle en français; le singulier collectif « cela » reprend idiomatiquement les événements précédents sans modifier la séquence johannique.
- source_word: Ἰωσὴφ ἀπὸ Ἁριμαθαίας
  choice: Joseph d’Arimathée
  rationale: Forme française consacrée et naturelle pour exprimer l’origine indiquée par ἀπό.
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: qui était disciple de Jésus
  rationale: La proposition relative rend clairement le participe grec tout en conservant le terme standard « disciple ».
- source_word: κεκρυμμένος
  choice: mais en secret
  rationale: Le contexte indique que Joseph tenait cachée sa qualité de disciple. Cette formulation française concise maintient l’opposition introduite par δέ sans préciser davantage que le grec l’objet sous-entendu.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: par crainte des Juifs
  rationale: Rendu proche, idiomatique et digne de la construction causale grecque; la note prévient une généralisation ethnique étrangère au contexte.
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: l’autorisation d’enlever le corps de Jésus
  rationale: Avec « demanda à Pilate », l’ajout explicatif « l’autorisation » exprime naturellement en français la proposition de but et le contexte de permission; « enlever » rend ici αἴρω, c’est-à-dire retirer le corps en vue de son ensevelissement.
- source_word: ἐπέτρεψεν ὁ Πιλᾶτος
  choice: Pilate la lui accorda
  rationale: Exprime clairement l’octroi de l’autorisation; les pronoms reprennent naturellement « l’autorisation » et Joseph.
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: Joseph vint donc enlever son corps
  rationale: « donc » conserve la valeur consécutive ou séquentielle de οὖν. La répétition du nom lève en français toute ambiguïté sur le sujet, tandis que « son corps » représente αὐτοῦ.
theological_decisions:
- issue: Référent de τῶν Ἰουδαίων dans l’Évangile selon Jean
  choice: les Juifs dans le texte, avec une note contextuelle
  alternative: les autorités juives; les Judéens
  rationale: Le grec porte explicitement οἱ Ἰουδαῖοι. Le texte principal préserve cette formulation et sa complexité, tandis que la note indique qu’ici elle vise plus précisément les autorités judéennes ou juives opposées à Jésus, et non le peuple juif sans distinction.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe privilégie la clarté orale et écrite tout en restant proche des relations logiques et lexicales du grec.
