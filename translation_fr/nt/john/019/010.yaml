reference: John 19:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: fr
  text: 'Alors Pilate lui dit : « Tu ne me parles pas, à moi ? Ne sais-tu pas que j’ai l’autorité[a] de te relâcher et que j’ai l’autorité de te crucifier ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pouvoir ». Le grec exousia peut désigner l’autorité, le droit ou le pouvoir. Ici, « autorité » convient au contexte judiciaire et gouvernemental.
    reason: Alternative lexicale
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: Alors Pilate lui dit
  rationale: οὖν fait ici progresser le récit tout en reliant la réaction de Pilate à ce qui précède. « Alors » rend naturellement cette valeur narrative en français; le présent historique « dit » conserve la vivacité du grec.
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: C’est à moi que tu ne parles pas ?
  rationale: Le datif Ἐμοί est placé en tête et porte une forte emphase. La tournure clivée française restitue l’indignation de Pilate sans ajouter l’idée explicite d’un refus.
- source_word: οὐκ οἶδας ὅτι
  choice: Ne sais-tu pas que
  rationale: Traduction directe et idiomatique de la question rhétorique, sans renforcer οἶδας en « ne te rends-tu pas compte ».
- source_word: ἐξουσίαν ἔχω
  choice: j’ai l’autorité
  rationale: Dans ce cadre judiciaire et gouvernemental, ἐξουσία désigne surtout l’autorité ou la compétence exercée, plutôt que la seule puissance matérielle.
- source_word: ἀπολῦσαί σε
  choice: de te relâcher
  rationale: ἀπολύω a ici son sens judiciaire de remettre une personne en liberté. « Relâcher » reste précis sans présumer un acquittement formel.
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: et que j’ai l’autorité de te crucifier
  rationale: La répétition grecque de ἐξουσίαν ἔχω est conservée, car elle souligne le contraste entre les deux issues que Pilate prétend pouvoir décider. « Crucifier » traduit directement l’infinitif sans expliciter les agents d’exécution.
theological_decisions:
- issue: Nature de l’ἐξουσία revendiquée par Pilate
  choice: Rendre ἐξουσία par « autorité » sans valider la légitimité ni le caractère absolu de la prétention de Pilate.
  alternative: « pouvoir » ou « droit »
  rationale: Le verset rapporte la revendication de Pilate; il ne constitue pas une approbation théologique de sa souveraineté. « Autorité » convient au contexte juridico-politique et laisse intacte la tension que la réponse de Jésus développera au verset suivant.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe au singulier et au rapport de force de la scène. La tournure clivée « C’est à moi que… » porte l’emphase de Ἐμοί sans devenir artificiellement solennelle.
