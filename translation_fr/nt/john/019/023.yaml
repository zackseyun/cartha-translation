  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: fr
  text: Après avoir crucifié Jésus, les soldats prirent donc ses vêtements et en firent quatre parts, une pour chaque soldat. Ils prirent aussi la tunique. Or, cette tunique était sans couture, tissée depuis le haut, d’un bout à l’autre[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Littéralement : « depuis les parties supérieures, à travers le tout ». L’expression décrit probablement une tunique tissée depuis sa partie supérieure sur toute son étendue ; « d’en haut » est également possible.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: les soldats… donc
  rationale: οὖν assure ici la progression du récit. Placé après le groupe verbal, « donc » garde ce lien narratif dans un français naturel sans suggérer une déduction appuyée.
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: Après avoir crucifié Jésus
  rationale: Cette formulation rend clairement l’antériorité de l’aoriste dans la proposition temporelle et évite une tournure française pesante.
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: prirent ses vêtements
  rationale: ἱμάτια peut désigner les vêtements en général et, dans ce contexte, probablement les vêtements autres que la tunique mentionnée séparément. Le terme français large préserve cette nuance sans imposer « vêtements de dessus ».
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: en firent quatre parts, une pour chaque soldat
  rationale: Rend directement la division en quatre lots et la distribution correspondante, dans une formulation française claire.
- source_word: καὶ τὸν χιτῶνα
  choice: Ils prirent aussi la tunique
  rationale: La reprise verbale explicite en français le verbe sous-entendu en grec et distingue naturellement la tunique des autres vêtements.
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: Or, cette tunique était sans couture
  rationale: δέ introduit une précision narrative plutôt qu’une forte opposition. « Or » convient à cette transition, tandis que « sans couture » traduit exactement ἄραφος.
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: tissée d’un seul tenant depuis le haut
  rationale: La formulation réunit l’idée d’un tissage continu sur toute l’étendue du vêtement et son point de départ supérieur, tout en conservant la possibilité formelle de comprendre ἄνωθεν comme « d’en haut ».
theological_decisions:
- issue: Éventuelle portée symbolique de la tunique sans couture
  choice: Traduire uniquement la description matérielle du vêtement
  alternative: Introduire une allusion aux vêtements sacerdotaux ou à l’unité de l’Église
  rationale: Le verset décrit la confection de la tunique et l’action des soldats sans expliciter une interprétation symbolique. La traduction ne doit donc pas intégrer une portée doctrinale que le texte ne formule pas.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. La phrase a été scindée afin de rendre clairement la mention distincte de la tunique.
