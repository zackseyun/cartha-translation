  terminology: « Grands prêtres » est le rendu usuel et exact de ἀρχιερεῖς ; « gardes » est un choix naturel et suffisamment non surspécifié pour ὑπηρέται. Le vocabulaire judiciaire de « motif d’accusation » est approprié.
