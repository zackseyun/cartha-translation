source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: fr
  text: 'Quand donc les grands prêtres et les gardes le virent, ils crièrent : « Crucifie-le ! Crucifie-le ! » Pilate leur dit : « Prenez-le vous-mêmes et crucifiez-le[a], car moi, je ne trouve en lui aucun motif d’accusation[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec exprime explicitement « vous », ce qui souligne le contraste : « Prenez-le, vous, et crucifiez-le. »'
    reason: emphase grammaticale
  - marker: b
    text: 'Ou : « je ne trouve en lui aucune faute ». Le terme grec peut désigner une faute, une accusation ou le motif sur lequel elle repose ; le sens judiciaire domine ici.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Quand donc
  rationale: Conserve à la fois la valeur temporelle de ὅτε et la progression logique ou narrative marquée par οὖν, dans une formulation française digne et intelligible.
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: Désigne ici les principaux responsables sacerdotaux de Jérusalem ; le pluriel ne signifie pas qu’il y avait simultanément plusieurs titulaires de la fonction de grand prêtre.
- source_word: ὑπηρέται
  choice: gardes
  rationale: Dans ce contexte johannique, le terme désigne des agents subalternes au service des autorités juives. « Gardes » est naturel en français et convient à leur rôle, sans préciser davantage leur rattachement institutionnel.
- source_word: ἐκραύγασαν λέγοντες
  choice: ils crièrent
  rationale: Le verbe exprime un cri puissant ; en français, le contenu des paroles peut suivre directement sans reproduire mécaniquement le participe « disant ».
- source_word: Σταύρωσον σταύρωσον
  choice: Crucifie-le ! Crucifie-le !
  rationale: L’objet, implicite en grec mais évident dans le contexte, est exprimé pour obtenir un français naturel. La répétition emphatique est conservée.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Prenez-le vous-mêmes
  rationale: « Vous-mêmes » rend l’emphase portée par le pronom explicite ὑμεῖς et le contraste entre les interlocuteurs de Pilate et Pilate lui-même.
- source_word: σταυρώσατε
  choice: crucifiez-le
  rationale: Rend directement et précisément l’impératif grec, en conservant la cohérence avec le cri précédent.
- source_word: ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: car moi, je ne trouve en lui aucun motif d’accusation
  rationale: « Moi » restitue l’emphase du pronom ἐγώ. Dans cette scène judiciaire, αἰτία désigne principalement un motif d’accusation ou un fondement légal, plutôt qu’une faute morale au sens large.
theological_decisions:
- issue: La déclaration de Pilate concernant Jésus
  choice: je ne trouve en lui aucun motif d’accusation
  alternative: je ne trouve en lui aucune faute
  rationale: Le contexte est celui d’un jugement légal. La formulation choisie conserve la portée judiciaire de αἰτία sans transformer explicitement la déclaration de Pilate en affirmation théologique générale, tout en laissant clairement entendre qu’il ne reconnaît aucun fondement à la condamnation.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme vif de la scène et la répétition du cri sont préservés. Les pronoms emphatiques « vous-mêmes » et « moi » rendent le contraste explicite du grec sans alourdir excessivement la phrase.
