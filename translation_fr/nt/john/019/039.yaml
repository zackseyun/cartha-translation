  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: fr
  text: Nicodème vint lui aussi, lui qui était auparavant venu trouver Jésus de nuit, apportant un mélange de myrrhe et d’aloès, environ cent livres romaines[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Une livre romaine pesait environ 327 grammes ; cent livres romaines correspondent donc à quelque 32 ou 33 kilogrammes.
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: vint lui aussi
  rationale: δέ assure ici une transition légère, tandis que καί ajoute Nicodème aux personnes déjà engagées dans l’ensevelissement. « vint lui aussi » est naturel en français et conserve cette valeur additive.
- source_word: Νικόδημος
  choice: Nicodème
  rationale: Forme française traditionnelle et courante du nom propre grec Νικόδημος.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: c’était lui qui, la première fois, était venu trouver Jésus de nuit
  rationale: La construction articulée avec participe identifie Nicodème par son premier entretien avec Jésus. « La première fois » rend τὸ πρῶτον sans effacer son possible sens de « précédemment », et « de nuit » conserve l’écho narratif de Jean 3. Le nom « Jésus » explicite le référent clair de αὐτόν et évite une succession de pronoms peu naturelle en français.
- source_word: φέρων
  choice: apportant
  rationale: Le participe présent exprime une circonstance accompagnant la venue de Nicodème ; « apportant » est idiomatique dans ce contexte.
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: un mélange de myrrhe et d’aloès
  rationale: « Mélange » rend directement μίγμα. « Myrrhe » est l’équivalent établi de σμύρνη, et « aloès » désigne ici la substance aromatique employée pour les rites funéraires, non la plante d’intérieur moderne.
- source_word: ὡς
  choice: environ
  rationale: Devant une quantité, ὡς marque l’approximation ; « environ » convient au registre narratif français.
- source_word: λίτρας ἑκατόν
  choice: cent livres romaines
  rationale: La λίτρα est une livre romaine. L’expression française rend immédiatement la nature de l’unité antique, tandis que la note fournit son équivalent approximatif moderne sans faire croire à une mesure contemporaine exacte.
theological_decisions:
- issue: Référent de αὐτόν dans la proposition identifiant Nicodème
  choice: « Jésus »
  alternative: « lui »
  rationale: Le contexte johannique renvoie clairement à la visite de Nicodème auprès de Jésus en Jean 3. L’explicitation évite une ambiguïté pronominale artificielle en français sans ajouter d’interprétation théologique.
- issue: Sens temporel de τὸ πρῶτον
  choice: « la première fois »
  alternative: « auparavant »
  rationale: La formulation retenue préserve l’idée d’une première venue nocturne tout en rappelant Jean 3, sans trancher plus que ne le fait le grec entre « la première fois » et « précédemment ».
translation_notes:
  register: Français international moderne, digne et narratif. La ponctuation détache l’apposition explicative sans alourdir la phrase. L’unité antique est rendue de manière intelligible dans le texte et précisée en note.
