source:
  edition: SBLGNT
  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: fr
  text: Il a dit cela, non parce qu’il se souciait des pauvres, mais parce qu’il était voleur et que, ayant la caisse[a], il prenait ce qu’on y mettait[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bourse ». Le terme grec désigne ici un contenant servant à garder de l’argent.
    reason: lexical_alternative
  - marker: b
    text: Ou « il emportait », voire « il dérobait ce qu’on y mettait ». Le verbe grec signifie souvent « porter », mais la mention qu’il était voleur indique ici un détournement.
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: Il a dit cela
  rationale: Le passé composé rend naturellement l’aoriste dans un récit en français moderne. La légère valeur connective de δέ n’a pas besoin d’être explicitée ici.
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: non parce qu’il se souciait des pauvres
  rationale: La construction nie le motif allégué. « Se soucier de » exprime naturellement μέλει avec le datif et περί.
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: mais parce qu’il était voleur
  rationale: La tournure conserve le parallèle entre le motif nié et le véritable motif. κλέπτης désigne celui qui vole, d’où « voleur » plutôt que « brigand ».
- source_word: τὸ γλωσσόκομον ἔχων
  choice: comme il avait la caisse
  rationale: « La caisse » désigne naturellement le contenant ou fonds dont Judas avait la charge. « Comme » présente le participe comme une circonstance liée à l’action suivante sans préciser davantage sa valeur logique.
- source_word: τὰ βαλλόμενα
  choice: ce qu’on y mettait
  rationale: Cette formulation française claire rend le participe passif et explicite par « y » la destination déjà donnée par « la caisse ».
- source_word: ἐβάσταζεν
  choice: il prenait
  rationale: L’imparfait restitue l’aspect habituel ou répété. « Prenait » laisse au contexte immédiat — « il était voleur » — le soin d’indiquer le détournement, sans enfermer le verbe dans un sens plus précis que nécessaire.
theological_decisions:
- issue: Sens de ἐβάσταζεν dans l’accusation portée contre Judas
  choice: il prenait ce qu’on y mettait
  alternative: il emportait / il dérobait ce qu’on y mettait
  rationale: Le contexte présente clairement Judas comme voleur et favorise donc l’idée de détournement. Toutefois, βαστάζω peut aussi signifier « porter » ; le choix de « prenait » communique l’accusation tout en maintenant une part de l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, courant et digne. La phrase conserve la structure causale du grec, tandis que l’imparfait « prenait » suggère une pratique répétée. Les notes sont placées sur les termes auxquels elles se rapportent, corrigeant le décalage apparent des marqueurs dans la couche anglaise fournie.
