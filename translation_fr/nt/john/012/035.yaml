id: JHN.12.35
reference: John 12:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: fr
  text: 'Jésus leur dit donc : « La lumière est encore parmi vous[a] pour peu de temps. Marchez pendant que vous avez la lumière, afin que les ténèbres ne vous surprennent pas. Celui qui marche dans les ténèbres ne sait pas où il va. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en vous » ou « avec vous ». L’expression grecque peut se comprendre de plusieurs façons, mais « parmi vous » convient le mieux au contexte immédiat, où Jésus parle de sa présence publique actuelle.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement le lien avec l’échange précédent sans donner à la relation une force logique excessive.
- source_word: Ἔτι μικρὸν χρόνον
  choice: encore … pour peu de temps
  rationale: Rend à la fois ἔτι et l’expression temporelle μικρὸν χρόνον dans un français actuel.
- source_word: τὸ φῶς
  choice: la lumière
  rationale: Conserve l’image johannique et sa portée christologique implicite sans la paraphraser.
- source_word: ἐν ὑμῖν
  choice: parmi vous
  rationale: Dans la scène, cette formulation évoque le mieux la présence publique de Jésus auprès de ses auditeurs, tout en laissant les autres sens possibles en note.
- source_word: περιπατεῖτε
  choice: Marchez
  rationale: Préserve la métaphore du cheminement, qui peut désigner à la fois l’action et la manière de vivre.
- source_word: ὡς
  choice: pendant que
  rationale: 'La valeur temporelle convient au contexte d’urgence : agir tant que la lumière est présente.'
- source_word: ἵνα μὴ
  choice: afin que … ne … pas
  rationale: Exprime clairement la finalité négative dans un registre digne et courant.
- source_word: σκοτία
  choice: les ténèbres
  rationale: Rendu français traditionnel mais toujours intelligible, qui maintient le contraste littéraire avec « la lumière ».
- source_word: καταλάβῃ
  choice: surprennent
  rationale: Évoque les ténèbres qui atteignent quelqu’un soudainement. Le pluriel s’accorde avec l’usage français de « ténèbres ».
- source_word: ὁ περιπατῶν
  choice: Celui qui marche
  rationale: Reproduit naturellement la portée générique du participe substantivé au singulier.
- source_word: ἐν τῇ σκοτίᾳ
  choice: dans les ténèbres
  rationale: Conserve la forme définie et le contraste thématique avec la lumière.
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: ne sait pas où il va
  rationale: Formulation française idiomatique qui conserve le sens directionnel du présent grec.
theological_decisions:
- issue: Sens de ἐν ὑμῖν en rapport avec « la lumière »
  choice: parmi vous
  alternative: en vous ; avec vous
  rationale: Le contexte immédiat favorise la présence de Jésus comme lumière au milieu de la foule, sans introduire ici une doctrine d’habitation intérieure. La polysémie réelle de la préposition grecque est néanmoins signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La métaphore de la marche ainsi que l’opposition johannique entre lumière et ténèbres sont conservées. Le vouvoiement pluriel correspond à l’adresse faite au groupe.
