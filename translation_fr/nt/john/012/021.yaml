id: JHN.12.21
reference: John 12:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: fr
  text: 'Ils vinrent donc trouver Philippe, qui était de Bethsaïda en Galilée, et lui demandaient : « Monsieur[a], nous voulons voir Jésus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Seigneur ». Le vocatif grec κύριε peut être une manière respectueuse de s’adresser à une personne aussi bien que le titre « Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι οὖν
  choice: Ils… donc
  rationale: Le pronom reprend naturellement en français les Grecs mentionnés au verset précédent, tandis que « donc » conserve le lien narratif exprimé par οὖν.
- source_word: προσῆλθον Φιλίππῳ
  choice: vinrent trouver Philippe
  rationale: Cette tournure française naturelle exprime le fait de s’approcher de Philippe pour entrer en contact avec lui.
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: qui était de Bethsaïda en Galilée
  rationale: La proposition relative rend clairement et naturellement l’expression grecque qui identifie Philippe par son lieu d’origine.
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: lui demandèrent
  rationale: Le français n’a pas besoin de reproduire littéralement « en disant ». Le verbe « demander » introduit naturellement les paroles; le passé simple convient à la progression narrative, même si l’imparfait grec présente la demande dans son déroulement.
- source_word: Κύριε
  choice: Monsieur
  rationale: Le vocatif s’adresse ici à Philippe et fonctionne très probablement comme une marque de respect. « Monsieur » est donc le choix contextuel le plus naturel; la valeur lexicale « Seigneur » est signalée en note afin de préserver l’ambiguïté du grec.
- source_word: θέλομεν
  choice: nous voulons
  rationale: Cette formulation directe et courante rend le désir ou l’intention exprimé par θέλω.
- source_word: τὸν Ἰησοῦν ἰδεῖν
  choice: voir Jésus
  rationale: La traduction conserve le sens littéral de ἰδεῖν sans préciser davantage s’il s’agit de le rencontrer ou de lui parler.
theological_decisions:
- issue: Sens de κύριε dans l’adresse faite à Philippe
  choice: Monsieur
  alternative: Seigneur
  rationale: Puisque les visiteurs parlent à Philippe, le mot désigne vraisemblablement une formule de politesse plutôt qu’un titre théologique. Toutefois, κύριε peut aussi se traduire formellement par « Seigneur »; cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste proche de la structure narrative grecque tout en évitant le calque peu idiomatique « ils lui demandaient en disant ».
