id: JHN.12.46
reference: John 12:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: fr
  text: Je suis venu dans le monde comme lumière[a], afin que toute personne qui croit en moi[b] ne reste pas dans les ténèbres.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « comme une lumière ». Le grec n’a pas d’article devant « lumière » ; l’expression peut être comprise qualitativement ou rendue avec l’article indéfini en français.
    reason: lexical_alternative
  - marker: b
    text: Ou « quiconque croit en moi ».
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: lumière
  rationale: Le nom sans article a ici une valeur qualitative. « Comme lumière » conserve la métaphore johannique et présente Jésus selon son identité et sa fonction, sans imposer « une lumière » ni expliciter davantage l’image.
- source_word: εἰς τὸν κόσμον
  choice: dans le monde
  rationale: Avec le verbe de mouvement ἐλήλυθα, εἰς exprime l’entrée dans le monde. En français, « venir dans le monde » rend naturellement ce mouvement et sa portée incarnationnelle et missionnaire.
- source_word: ἐλήλυθα
  choice: Je suis venu
  rationale: Le parfait grec présente une venue accomplie dont la portée demeure. Le passé composé français est la formulation naturelle qui convient le mieux à cette nuance.
- source_word: ἵνα
  choice: afin que
  rationale: La conjonction introduit ici le but de la venue de Jésus. « Afin que » en conserve clairement la valeur finale dans un registre digne et courant.
- source_word: πᾶς ὁ πιστεύων
  choice: toute personne qui croit
  rationale: Le participe substantivé accompagné de πᾶς désigne de manière générale chaque personne appartenant à la catégorie de ceux qui croient. Cette formulation est claire, inclusive et naturelle en français moderne.
- source_word: πιστεύων εἰς ἐμέ
  choice: croit en moi
  rationale: Dans Jean, πιστεύω suivi de εἰς et d’une personne exprime une foi orientée vers Jésus. « Croire en moi » est l’équivalent français usuel, sans ajouter une explication interprétative.
- source_word: ἐν τῇ σκοτίᾳ
  choice: dans les ténèbres
  rationale: Le pluriel français « les ténèbres » est l’expression idiomatique qui rend le domaine moral et spirituel défini par l’article grec et par l’imagerie johannique.
- source_word: μὴ μείνῃ
  choice: ne reste pas
  rationale: 'Le subjonctif aoriste avec μή après ἵνα exprime le but négatif : ne pas continuer dans cet état. « Ne reste pas » est direct et naturel.'
theological_decisions:
- issue: Auto-identification christologique par l’image johannique de la lumière
  choice: « comme lumière »
  alternative: « comme une lumière » ou « pour apporter la lumière »
  rationale: La traduction maintient l’identification métaphorique de Jésus à la lumière révélatrice et salvatrice, sans réduire celle-ci à un simple apport ni développer la métaphore en explication doctrinale.
- issue: Portée de πᾶς ὁ πιστεύων
  choice: « toute personne qui croit »
  alternative: « quiconque croit »
  rationale: Le texte désigne l’ensemble des croyants sans trancher les débats théologiques plus larges sur l’origine ou les mécanismes de la foi. La formulation conserve cette portée générale sans ajout confessionnel.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle ; « les ténèbres » conserve l’imagerie johannique traditionnelle et immédiatement compréhensible.
