id: JHN.12.2
reference: John 12:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: fr
  text: On prépara donc là un repas pour Jésus. Marthe servait, tandis que Lazare était l’un de ceux qui étaient à table[a] avec lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « qui étaient étendus avec lui ». Lors des repas, il était habituel de manger en position allongée.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: on prépara
  rationale: Avec δεῖπνον, le verbe désigne naturellement la préparation d’un repas. Le pronom indéfini « on » conserve l’absence de sujet exprimé sans identifier les hôtes.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la suite logique et narrative par rapport au contexte précédent.
- source_word: αὐτῷ
  choice: pour Jésus
  rationale: Le datif indique ici le bénéficiaire du repas. Le nom « Jésus » clarifie naturellement le référent en français.
- source_word: δεῖπνον
  choice: un repas
  rationale: Le terme désigne le principal repas, souvent pris le soir. « Repas » est actuel et précis sans imposer une heure que le verset ne donne pas explicitement.
- source_word: ἐκεῖ
  choice: là
  rationale: Cet adverbe renvoie au lieu mentionné dans le contexte, Béthanie.
- source_word: διηκόνει
  choice: servait
  rationale: L’imparfait grec décrit une action en cours; l’imparfait français en rend naturellement l’aspect. Dans ce contexte, il s’agit du service du repas.
- source_word: δὲ
  choice: tandis que
  rationale: Cette formulation exprime le contraste léger entre l’activité de Marthe et la présence de Lazare parmi les convives, sans lui donner une force adversative excessive.
- source_word: εἷς ἦν ἐκ
  choice: était l’un de ceux
  rationale: Cette tournure conserve l’idée que Lazare appartenait à un groupe de convives.
- source_word: ἀνακειμένων
  choice: qui étaient à table
  rationale: Dans un contexte de repas, le participe désigne ceux qui prennent place en position allongée. Le texte principal emploie une expression française naturelle, tandis que la note conserve le détail culturel.
- source_word: σὺν αὐτῷ
  choice: avec lui
  rationale: La formule exprime simplement l’accompagnement; le pronom renvoie à Jésus.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La tournure « on prépara » évite d’attribuer le repas à des personnes que le grec ne nomme pas. La posture culturelle des convives est conservée en note afin de ne pas alourdir le récit.
