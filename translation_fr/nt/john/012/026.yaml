id: JHN.12.26
reference: John 12:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: fr
  text: Si quelqu’un me sert[a], qu’il me suive ; et là où je suis, là aussi sera mon serviteur. Si quelqu’un me sert, le Père l’honorera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici une construction générique au masculin singulier : « Si quelqu’un me sert… le Père l’honorera. »'
    reason: Préciser que les formes masculines singulières de la phrase grecque ont une portée générique.
lexical_decisions:
- source_word: διακονῇ
  choice: sert
  rationale: Le verbe désigne ici le service rendu à Jésus. « Servir » est naturel, large et évite la connotation ecclésiastique plus étroite de « exercer un ministère ».
- source_word: ἀκολουθείτω
  choice: qu’il me suive
  rationale: Cette tournure rend directement l’impératif présent et son appel à la marche du disciple, sans surcharger explicitement la nuance durative.
- source_word: διάκονος
  choice: serviteur
  rationale: Le nom désigne ici celui qui sert Jésus, non la fonction ecclésiale ultérieure de diacre. « Serviteur » conserve aussi le lien lexical avec « sert ».
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: là où je suis
  rationale: Formulation française idiomatique qui conserve le repère spatial sans introduire un pronom emphatique artificiel.
- source_word: ἐκεῖ καὶ
  choice: là aussi
  rationale: Cette expression restitue à la fois la valeur locative de ἐκεῖ et la valeur additive de καί.
- source_word: τιμήσει
  choice: honorera
  rationale: Le futur simple exprime clairement la promesse, tandis que « honorer » garde l’étendue sémantique du grec sans préciser indûment la forme de cet honneur.
- source_word: ὁ πατήρ
  choice: le Père
  rationale: Le grec porte simplement « le Père » ; aucun possessif n’est ajouté.
- source_word: τις
  choice: quelqu’un
  rationale: Le pronom indéfini a une portée générique. « Quelqu’un » est naturel en français et n’enferme pas la référence dans le sexe masculin.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom objet reprend la personne désignée par « quelqu’un ». En français, la forme élidée ne marque pas graphiquement le genre, tout en conservant le singulier personnel.
theological_decisions:
- issue: Référence générique dans les propositions conditionnelles
  choice: Employer « quelqu’un », puis les formes françaises singulières ordinaires « qu’il » et « l’ », avec une note signalant la construction grecque.
  alternative: Reformuler entièrement au pluriel ou répéter « cette personne » afin d’éviter toute forme masculine.
  rationale: Le grec emploie un indéfini générique avec un accord masculin singulier. La formulation française reste naturelle et fidèle à cette structure, tandis que la note empêche de comprendre la portée comme limitée aux hommes.
- issue: Nature de l’honneur accordé par le Père
  choice: Traduire simplement « le Père l’honorera ».
  alternative: Préciser qu’il s’agit d’une récompense céleste ou d’une glorification eschatologique.
  rationale: Le verset promet l’honneur divin sans en définir ici la forme. La traduction ne réduit donc pas cette ouverture théologique à une interprétation particulière.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation maintient les deux propositions conditionnelles et le parallélisme du grec. « Là où… là aussi » conserve volontairement la reprise rhétorique.
