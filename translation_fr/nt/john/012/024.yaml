id: JHN.12.24
reference: John 12:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: fr
  text: 'En vérité, en vérité, je vous le dis : si le grain de blé ne tombe en terre et ne meurt, il reste seul[a] ; mais s’il meurt, il porte beaucoup de fruit[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il demeure seul ».'
    reason: lexical_alternative
  - marker: b
    text: L’image évoque un grain qui doit mourir en terre pour devenir fécond. Dans le contexte, Jésus applique ce modèle à sa propre mort et à ceux qui le suivent.
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: En vérité, en vérité
  rationale: Cette formule solennelle caractéristique de Jean conserve la répétition et la force d’affirmation du grec dans un français digne et intelligible.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formulation française naturelle qui conserve l’adresse directe et la solennité de la formule johannique.
- source_word: ἐὰν μὴ
  choice: si ... ne ...
  rationale: Dans cette phrase, la construction « si ... ne ... » rend naturellement la condition négative tout en permettant de conserver la coordination « tombe ... et meurt ».
- source_word: ὁ κόκκος τοῦ σίτου
  choice: le grain de blé
  rationale: « Grain de blé » est l’expression agricole courante en français et restitue précisément l’image de κόκκος τοῦ σίτου.
- source_word: πεσὼν εἰς τὴν γῆν
  choice: tombe en terre
  rationale: « Tomber en terre » est une expression française naturelle dans le contexte des semailles et rend le mouvement vers le sol indiqué par εἰς.
- source_word: ἀποθάνῃ
  choice: meurt
  rationale: Le présent français convient naturellement dans une proposition conditionnelle générale et préserve sans atténuation l’image de la mort du grain.
- source_word: αὐτὸς μόνος μένει
  choice: il reste seul
  rationale: Cette traduction concise conserve à la fois l’idée de persistance exprimée par μένει et l’isolement ou l’absence de multiplication exprimés par αὐτὸς μόνος.
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: mais s’il meurt
  rationale: « Mais » marque clairement le contraste introduit par δέ, tandis que le présent convient à la condition en français.
- source_word: πολὺν καρπὸν φέρει
  choice: il porte beaucoup de fruit
  rationale: La locution « porter du fruit » conserve la métaphore agricole et fait écho au vocabulaire johannique sans transformer καρπός en « récolte ».
theological_decisions:
- issue: Portée christologique et implications pour les disciples de l’image agricole
  choice: Conserver dans le texte principal l’image littérale du grain qui meurt et porte du fruit, sans en expliciter l’application.
  alternative: Ajouter dans le texte que Jésus parle de sa propre mort et de ses effets pour beaucoup.
  rationale: Le contexte relie fortement cette image à la mort prochaine de Jésus et, dans les versets suivants, au chemin de ses disciples. Toutefois, le verset lui-même énonce une image sans en développer explicitement l’interprétation ; la traduction préserve donc cette tension et laisse le contexte guider la lecture.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure solennelle « En vérité, en vérité » maintient la répétition johannique ; « tombe en terre », « reste seul » et « porte beaucoup de fruit » gardent intacte l’image agricole.
