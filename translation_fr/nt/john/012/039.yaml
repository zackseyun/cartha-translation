  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: fr
  text: 'Voilà pourquoi ils ne pouvaient pas croire, car Ésaïe a dit encore :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Cette tournure exprime clairement la cause ou la raison et relie naturellement le verset au contexte précédent.
- source_word: οὐκ ἠδύναντο
  choice: ils ne pouvaient pas
  rationale: L’imparfait de δύναμαι indique une incapacité; cette formulation française la préserve sans la réduire à un simple refus.
- source_word: πιστεύειν
  choice: croire
  rationale: « Croire » est le rendu français le plus naturel du verbe πιστεύω dans cette construction et dans le vocabulaire johannique.
- source_word: ὅτι
  choice: car
  rationale: Dans ce contexte, ὅτι introduit la raison de l’incapacité, développée par la nouvelle citation d’Ésaïe. « Car » conserve ce lien causal tout en évitant une répétition lourde de « parce que » après « voilà pourquoi ».
- source_word: πάλιν
  choice: encore
  rationale: Le mot signale une citation supplémentaire du même prophète après celle du verset précédent.
- source_word: εἶπεν
  choice: a dit
  rationale: Le passé composé est naturel en français moderne dans une formule introduisant une parole antérieure qui demeure pertinente.
- source_word: Ἠσαΐας
  choice: Ésaïe
  rationale: Forme française traditionnelle et largement reconnue du nom du prophète.
theological_decisions:
- issue: Nature de l’incapacité à croire
  choice: « ils ne pouvaient pas croire »
  alternative: « ils ne voulaient pas croire » ou une formulation explicitant un système théologique particulier
  rationale: Le grec exprime une incapacité et non seulement un refus. La traduction conserve cette tension sans préciser doctrinalement comment s’articulent l’endurcissement divin et la responsabilité humaine.
- issue: Fonction de ὅτι
  choice: Lien causal rendu par « car »
  alternative: 'Lecture déclarative: « qu’Ésaïe a dit encore »'
  rationale: Le contexte favorise une explication de l’incapacité par la citation qui suit; la formulation française préserve ce rapport sans développer l’interprétation au-delà du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Voilà pourquoi » est idiomatique et explicite; « ils ne pouvaient pas croire » garde la force de l’incapacité exprimée par le grec. La ponctuation finale annonce la citation du verset suivant.
