id: JHN.12.28
reference: John 12:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: fr
  text: 'Père, glorifie ton nom. Alors une voix vint du ciel : « Je l’ai glorifié, et je le glorifierai encore. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: Père
  rationale: Vocatif d’adresse directe à Dieu. « Père » est naturel en français et n’ajoute pas le possessif absent du grec.
- source_word: δόξασόν
  choice: glorifie
  rationale: L’impératif « glorifie » conserve le vocabulaire johannique de la gloire et sa portée théologique, contrairement à « honore », plus faible.
- source_word: σου τὸ ὄνομα
  choice: ton nom
  rationale: Cette formulation idiomatique préserve le poids biblique du « nom », qui renvoie à la personne telle qu’elle se révèle, sans l’expliciter par une paraphrase.
- source_word: ἦλθεν οὖν
  choice: Alors ... vint
  rationale: Dans ce contexte, οὖν fait progresser le récit. « Alors » est fluide, tandis que « vint » garde l’image de la voix qui vient du ciel.
- source_word: φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: une voix vint du ciel
  rationale: La parole citée montre que φωνή désigne une voix intelligible, et « du ciel » exprime naturellement son origine divine.
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: Je l’ai glorifié, et je le glorifierai encore
  rationale: Le passé composé rend naturellement en français l’aoriste comme un acte accompli ayant une pertinence présente. Le pronom « l’ » reprend clairement « ton nom », objet implicite en grec, et « encore » porte naturellement sur le futur.
theological_decisions:
- issue: Référent de l’objet implicite dans la réponse divine
  choice: Employer « l’ » pour reprendre « ton nom »
  alternative: 'Laisser l’objet inexprimé : « J’ai glorifié, et je glorifierai encore »'
  rationale: Le grec permet l’ellipse de l’objet, récupérable dans le contexte. En français, le pronom est nécessaire à une formulation naturelle et indique sans ambiguïté que le Père parle de la glorification de son propre nom.
- issue: Traduction de δοξάζω dans le contexte johannique
  choice: glorifier
  alternative: honorer
  rationale: « Glorifier » maintient le réseau lexical et théologique de la gloire chez Jean sans réduire le sens à l’honneur ou à la réputation.
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’usage biblique courant dans l’adresse à Dieu. La ponctuation distingue clairement la prière de Jésus et la réponse venue du ciel.
