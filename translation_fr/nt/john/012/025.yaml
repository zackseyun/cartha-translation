  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: fr
  text: Celui qui aime sa vie[a] la perd, et celui qui hait sa vie dans ce monde[b] la préservera pour la vie éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son âme » ou « sa personne ». Le mot grec ψυχή peut désigner la vie, la personne elle-même ou l’âme, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: '« Haïr sa vie » est un paradoxe délibéré : il s’agit de renoncer à l’attachement à sa propre vie dans l’ordre présent du monde, non de se mépriser soi-même. Comparer Luc 14.26, où se trouve une tournure semblable.'
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: celui qui aime
  rationale: Le participe présent substantivé exprime une vérité générale. « Celui qui aime » restitue naturellement en français sa valeur générique et son parallélisme avec ὁ μισῶν.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: sa vie
  rationale: Dans ce contexte, ψυχή désigne la vie ou la personne elle-même, envisagée comme pouvant être perdue ou gardée. « Sa vie » convient mieux que « son âme » au contraste verbal du verset, sans imposer une anthropologie dualiste.
- source_word: ἀπολλύει
  choice: la perd
  rationale: Le présent grec a ici une portée générale. « La perd » est idiomatique avec « sa vie » et maintient le contraste avec le futur « la gardera ».
- source_word: ὁ μισῶν
  choice: celui qui déteste
  rationale: Le verbe μισέω est volontairement fort. « Déteste » conserve le paradoxe du texte au lieu de l’atténuer par une formulation interprétative comme « aime moins ».
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: dans ce monde
  rationale: Cette formulation naturelle conserve le contraste johannique entre l’attachement à la vie dans l’ordre présent et la vie éternelle.
- source_word: φυλάξει
  choice: la gardera
  rationale: Le futur actif exprime ce qui adviendra à la vie de celui qui y renonce dans ce monde. « Gardera » demeure proche du sens de φυλάσσω et répond simplement à « perd ».
- source_word: εἰς ζωὴν αἰώνιον
  choice: pour la vie éternelle
  rationale: La préposition εἰς indique ici la visée ou l’aboutissement. « Pour la vie éternelle » est clair, actuel et laisse subsister cette nuance de destination.
theological_decisions:
- issue: Sens de « déteste sa vie »
  choice: Conserver la formulation forte comme paradoxe portant sur le renoncement à l’attachement à sa vie dans le monde présent.
  alternative: « aime moins sa vie » ou « tient moins à sa vie »
  rationale: Le grec emploie μισέω et la précision « dans ce monde » encadre le paradoxe. L’adoucir dans le texte principal en résoudrait prématurément la tension et pourrait masquer la force de l’appel de Jésus.
- issue: Sens de ψυχή
  choice: Traduire par « vie » dans les deux propositions.
  alternative: « âme » ou « personne »
  rationale: Le contexte oppose le fait de perdre sa ψυχή à celui de la garder pour la vie éternelle. « Vie » rend cette opposition sans introduire une distinction entre corps et âme que le verset n’explicite pas.
translation_notes:
  register: Français international moderne, simple et digne. La structure antithétique et le passage du présent général (« perd ») au futur (« gardera ») sont conservés. Le terme fort « déteste » maintient la tension rhétorique de l’original, tandis que les notes explicitent les principales ambiguïtés sans les résoudre dans le texte.
