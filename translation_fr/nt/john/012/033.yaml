id: JHN.12.33
reference: John 12:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἔλεγεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: fr
  text: Il disait cela pour indiquer de quelle mort il allait mourir[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par quel genre de mort ». L’expression grecque peut mettre l’accent sur la manière de mourir.'
    reason: alternative lexicale
lexical_decisions:
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif neutre singulier renvoie à la déclaration précédente de Jésus ; « cela » est naturel en français dans ce contexte.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: La particule marque ici une légère transition narrative. Le français enchaîne naturellement sans ajouter « or » ou « mais », qui risqueraient de surcharger le lien.
- source_word: ἔλεγεν
  choice: disait
  rationale: L’imparfait grec est rendu par l’imparfait français, qui convient à cette explication rétrospective de la parole de Jésus.
- source_word: σημαίνων
  choice: pour indiquer
  rationale: Le participe exprime ce que Jésus donnait à comprendre par ses paroles. « Indiquer » restitue clairement cette valeur sans expliciter la crucifixion.
- source_word: ποίῳ θανάτῳ
  choice: de quelle mort
  rationale: Cette tournure française concise conserve l’idée de la nature ou de la manière de mourir et fait écho à la formulation grecque.
- source_word: ἤμελλεν
  choice: allait
  rationale: « Allait » exprime le futur envisagé depuis un point du passé sans renforcer indûment l’idée de destinée.
- source_word: ἀποθνῄσκειν
  choice: mourir
  rationale: L’infinitif complémentaire est rendu directement par « mourir ».
theological_decisions:
- issue: Faut-il préciser que cette mort est la crucifixion ?
  choice: 'Conserver la formulation indirecte : « de quelle mort il allait mourir »'
  alternative: « qu’il allait mourir crucifié » ou « comment il allait être exécuté »
  rationale: Le contexte désigne la crucifixion, mais ce verset ne la nomme pas. La traduction préserve donc l’explication indirecte du narrateur sans ajouter ce que le grec laisse implicite.
translation_notes:
  register: Français moderne, international et digne. La formulation reste proche du grec tout en étant immédiatement compréhensible ; la répétition « mort… mourir » est conservée parce qu’elle reflète le texte source et demeure idiomatique dans ce registre.
