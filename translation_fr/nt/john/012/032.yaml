id: JHN.12.32
reference: John 12:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: fr
  text: Et moi, quand je serai élevé de la terre[a][b], j’attirerai tous les êtres humains[c] à moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si je suis élevé ». Le grec emploie une tournure conditionnelle, mais le contexte présente la mort prochaine de Jésus comme certaine.
    reason: alternative_reading
  - marker: b
    text: '« Élevé » peut aussi signifier « exalté » : Jean associe ainsi l’élévation de Jésus sur la croix à sa glorification.'
    reason: lexical_alternative
  - marker: c
    text: Ou simplement « tous ». Le grec désigne vraisemblablement tous les êtres humains, sans préciser comment cette affirmation se rapporte aux débats théologiques ultérieurs sur l’étendue du salut.
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: Et moi
  rationale: La crase de καί et ἐγώ associe un lien avec ce qui précède à une légère insistance sur Jésus. « Et moi » rend naturellement ces deux nuances.
- source_word: ἐὰν
  choice: quand
  rationale: Bien que ἐάν suivi du subjonctif ait une forme conditionnelle, le contexte présente l’événement comme imminent. « Quand » en exprime ici la valeur contextuelle, tandis qu’une note conserve la possibilité formelle de « si ».
- source_word: ὑψωθῶ
  choice: je serai élevé
  rationale: 'Le verbe ὑψόω porte chez Jean un double sens voulu : l’élévation physique sur la croix et l’exaltation ou la glorification. « Être élevé » permet de conserver les deux dimensions.'
- source_word: ἐκ τῆς γῆς
  choice: de terre
  rationale: Ici, γῆ désigne naturellement la terre ou le sol dont Jésus sera élevé lors de la crucifixion. La tournure française « élevé de terre » est concise et idiomatique.
- source_word: πάντας
  choice: tous les êtres humains
  rationale: L’accusatif masculin pluriel employé substantivement renvoie naturellement à des personnes. Cette formulation inclusive explicite le référent humain sans trancher les débats théologiques ultérieurs sur la portée exacte de « tous ».
- source_word: ἑλκύσω
  choice: j’attirerai
  rationale: ἕλκω peut signifier tirer ou attirer. « Attirer » est naturel en français et conserve l’idée d’un mouvement vers Jésus sans préciser davantage la manière dont cette action s’exerce.
- source_word: πρὸς ἐμαυτόν
  choice: à moi
  rationale: Le pronom réfléchi ἐμαυτόν met Jésus lui-même en relief. En français, « à moi » rend cette orientation personnelle plus naturellement que « à moi-même » dans cette phrase.
theological_decisions:
- issue: Portée de πάντας par rapport au salut
  choice: tous les êtres humains
  alternative: tous ; tous sans distinction ; tous sans exception
  rationale: Le masculin pluriel désigne naturellement des personnes plutôt que l’ensemble de la création impersonnelle. La traduction maintient l’ampleur universelle de l’énoncé sans décider si elle vise chaque individu sans exception ou des personnes de toute catégorie.
- issue: Double sens johannique de ὑψωθῶ
  choice: élevé
  alternative: exalté
  rationale: « Élevé » garde ensemble la crucifixion et la glorification. « Exalté » ne conserverait que la dimension théologique et effacerait l’image physique explicitée au verset suivant.
- issue: Valeur conditionnelle de ἐὰν
  choice: quand
  alternative: si
  rationale: Dans le récit, Jésus annonce sa mort comme un événement à venir certain. « Quand » communique cette force en français courant, tandis que la note signale fidèlement la forme conditionnelle grecque.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans devenir raide. « Êtres humains » évite que le masculin « hommes » soit compris comme excluant les femmes, et les notes préservent les ambiguïtés conditionnelle, lexicale et théologique du texte.
