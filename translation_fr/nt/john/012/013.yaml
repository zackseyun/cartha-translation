source:
  edition: SBLGNT
  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: fr
  text: 'Ils prirent les branches de palmier et sortirent à sa rencontre. Ils criaient : « Hosanna[a] ! Béni soit celui qui vient au nom du Seigneur[b], et le roi d’Israël ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Hosanna » vient d’une expression hébraïque signifiant « sauve donc » ou « de grâce, sauve » ; à cette époque, le mot servait aussi d’acclamation de louange.
    reason: lexical_alternative
  - marker: b
    text: Cette acclamation fait écho au Psaume 118.26.
    reason: cross_reference
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: les branches de palmier
  rationale: Cette formulation rend explicitement βάϊα, « branches », et précise leur nature par τῶν φοινίκων, tout en restant naturelle en français moderne.
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: sortirent à sa rencontre
  rationale: Rend directement l’idée d’aller au-devant de quelqu’un sans ajouter explicitement la notion d’accueil.
- source_word: ἐκραύγαζον
  choice: Ils criaient
  rationale: L’imparfait français conserve l’aspect duratif ou répété de l’imparfait grec.
- source_word: Ὡσαννά
  choice: Hosanna
  rationale: La translittération conserve l’acclamation liturgique connue et sa double portée historique de supplication et de louange.
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: Béni soit celui qui vient
  rationale: Formulation française naturelle qui conserve le participe substantivé et la tournure d’acclamation.
- source_word: ἐν ὀνόματι κυρίου
  choice: au nom du Seigneur
  rationale: Expression biblique consacrée et fidèle au grec, sans expliciter davantage l’autorité impliquée.
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: et le roi d’Israël
  rationale: Le simple « et » préserve la coordination du texte grec et son ambiguïté syntaxique, sans imposer la valeur explicative « c’est-à-dire » ou intensive « même ».
theological_decisions:
- issue: Rendu de κύριος dans l’écho au Psaume 118.26
  choice: Seigneur
  alternative: ÉTERNEL
  rationale: Le texte grec porte κυρίου. « Seigneur » le représente directement; employer « ÉTERNEL » rétrovertirait le nom divin supposé dans le texte hébreu du psaume.
- issue: Rapport syntaxique entre celui qui vient et le roi d’Israël
  choice: et le roi d’Israël
  alternative: c’est-à-dire le roi d’Israël
  rationale: καί peut avoir une valeur explicative, mais aussi garder son sens coordonnant ordinaire. Le texte principal conserve cette ambiguïté au lieu d’identifier explicitement les deux désignations par une paraphrase.
- issue: Portée royale et messianique de l’acclamation
  choice: le roi d’Israël
  alternative: le Roi d’Israël
  rationale: Le titre royal est rendu sans l’atténuer ni l’amplifier. La minuscule suit l’usage courant du français pour un titre accompagné de l’article, sans nier sa portée messianique.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation sépare les actions narratives sans alourdir la phrase. L’acclamation garde une formulation biblique reconnaissable. Tous les appels de note figurent dans le texte principal.
