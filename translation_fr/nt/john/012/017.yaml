id: JHN.12.17
reference: John 12:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: fr
  text: La foule qui était avec lui lorsqu’il appela Lazare hors du tombeau et le releva d’entre les morts témoignait donc[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendait témoignage » ; le verbe grec peut désigner le fait de témoigner ou de rendre témoignage, un thème récurrent dans l’Évangile selon Jean.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: continuait à témoigner
  rationale: L’imparfait présente le témoignage comme une action en cours dans le récit. « Témoigner » conserve le vocabulaire récurrent du témoignage dans Jean.
- source_word: οὖν
  choice: Ainsi
  rationale: Le connecteur marque le lien avec le contexte précédent; « ainsi » rend naturellement cette progression narrative et logique.
- source_word: ὁ ὄχλος
  choice: la foule
  rationale: Désigne ici le groupe de personnes présent lors du signe accompli en faveur de Lazare.
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: qui avait été avec lui
  rationale: Le participe substantivé précise de quelle foule il s’agit, et le plus-que-parfait situe sa présence lors de l’événement antérieur.
- source_word: ὅτε
  choice: lorsqu’il
  rationale: Introduit naturellement en français le moment où la foule se trouvait avec Jésus.
- source_word: ἐφώνησεν
  choice: avait appelé
  rationale: Le verbe indique que Jésus a appelé Lazare; « appeler » reste direct sans ajouter une intensité absente du seul verbe.
- source_word: ἐκ τοῦ μνημείου
  choice: hors du tombeau
  rationale: « Tombeau » rend le lieu d’ensevelissement, tandis que « hors de » exprime clairement le mouvement indiqué par ἐκ.
- source_word: ἤγειρεν
  choice: avait relevé
  rationale: Dans ce contexte de retour à la vie, « relever » garde l’image et la portée de ἐγείρω sans paraphraser le miracle.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette tournure française usuelle préserve l’expression grecque et son sens de retour à la vie.
theological_decisions:
- issue: Formulation du retour à la vie de Lazare
  choice: l’avait relevé d’entre les morts
  alternative: l’avait ressuscité
  rationale: Le texte affirme sans atténuation que Jésus a relevé Lazare d’entre les morts. « Relever » traduit de près ἐγείρω et conserve son lien avec le vocabulaire de la résurrection, sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve l’identification précise de la foule et l’aspect continu de l’imparfait grec, tout en restant naturelle à la lecture.
