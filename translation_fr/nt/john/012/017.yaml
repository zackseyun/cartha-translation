revisions:
- from: Ainsi, la foule qui avait été avec lui lorsqu’il avait appelé Lazare hors du tombeau et l’avait relevé d’entre les morts continuait à témoigner[a].
  to: La foule qui était avec lui lorsqu’il appela Lazare hors du tombeau et le releva d’entre les morts témoignait donc[a].
  rationale: La révision rétablit la relation temporelle et narrative du texte grec, rend sobrement l’imparfait de μαρτυρέω et maintient le vocabulaire johannique du témoignage. La note est conservée, avec une formulation française légèrement normalisée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:06:59Z'
review_pass:
  verdict: revise
  source_fidelity: La proposition relative doit conserver la valeur descriptive du participe présent ὁ ὢν μετ’ αὐτοῦ (« qui était avec lui »), plutôt qu’un plus-que-parfait (« qui avait été avec lui »). L’imparfait ἐμαρτύρει est bien rendu par « témoignait », qui exprime l’action en cours sans ajouter explicitement l’idée de continuation. Les aoristes ἐφώνησεν et ἤγειρεν sont rendus par des passés simples narratifs.
  naturalness: La phrase révisée est naturelle dans un français biblique moderne et international. Le placement de « donc » après le verbe principal évite l’enchaînement un peu lourd de « Ainsi, ... continuait à témoigner ».
  terminology: « Témoignait » et l’alternative « rendait témoignage » conservent le réseau johannique de μαρτυρέω. « Releva d’entre les morts » rend ἤγειρεν ... ἐκ νεκρῶν sans atténuer l’affirmation ni imposer une interprétation doctrinale supplémentaire. « Tombeau » convient à μνημεῖον.
  issues:
  - severity: medium
    issue: Les plus-que-parfaits « avait été », « avait appelé » et « avait relevé » modifient la présentation temporelle du grec.
    rationale: Le participe ὢν décrit la foule comme étant avec Jésus lors des deux actions, et les aoristes relatent ces actions. En français narratif, « était ... lorsqu’il appela ... et le releva » reproduit plus directement cette relation.
  - severity: low
    issue: « Continuait à témoigner » explicite une idée de continuation qui n’est pas lexicalement exprimée.
    rationale: L’imparfait justifie une action en cours ou répétée, mais « témoignait » le rend avec davantage de retenue et de souplesse.
  revised_text: La foule qui était avec lui lorsqu’il appela Lazare hors du tombeau et le releva d’entre les morts témoignait donc[a].
  revised_footnotes:
  - marker: a
    text: Ou « rendait témoignage » ; le verbe grec peut désigner le fait de témoigner ou de rendre témoignage, un thème récurrent dans l’Évangile selon Jean.
    reason: lexical_alternative
  revision_rationale: La révision rétablit la relation temporelle et narrative du texte grec, rend sobrement l’imparfait de μαρτυρέω et maintient le vocabulaire johannique du témoignage. La note est conservée, avec une formulation française légèrement normalisée.
