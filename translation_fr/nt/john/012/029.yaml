id: JHN.12.29
reference: John 12:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: fr
  text: 'La foule qui se tenait là et qui avait entendu disait donc qu’il y avait eu un coup de tonnerre. D’autres disaient : « Un ange lui a parlé. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la continuité et la conséquence narrative après la voix mentionnée au verset précédent; sa position après le sujet est naturelle en français.
- source_word: ὁ ὄχλος ὁ ἑστὼς
  choice: la foule qui se tenait là
  rationale: Le participe parfait décrit la foule présente sur les lieux; « se tenait là » rend naturellement la posture et la situation.
- source_word: ἀκούσας
  choice: qui avait entendu
  rationale: Le plus-que-parfait exprime l’antériorité du participe aoriste par rapport aux paroles de la foule. L’objet reste implicite, comme en grec.
- source_word: ἔλεγεν
  choice: disait
  rationale: L’imparfait conserve l’aspect duratif ou collectif de la réaction rapportée.
- source_word: βροντὴν γεγονέναι
  choice: Il y a eu un coup de tonnerre
  rationale: Formulation française idiomatique qui conserve l’idée qu’un phénomène de tonnerre s’est produit, sans transformer la perception de la foule en explication objective.
- source_word: ἄλλοι
  choice: D’autres
  rationale: Désigne naturellement un autre groupe au sein de la foule.
- source_word: Ἄγγελος
  choice: Un ange
  rationale: Dans ce contexte de voix venue du ciel, le terme désigne vraisemblablement un être céleste plutôt qu’un messager humain.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom indirect renvoie à Jésus et rend simplement le datif grec.
- source_word: λελάληκεν
  choice: a parlé
  rationale: Le passé composé est la manière française naturelle de rendre ici l’acte accompli exprimé par le parfait grec, avec sa pertinence présente.
theological_decisions:
- issue: Nature du locuteur céleste supposé par une partie de la foule
  choice: Un ange lui a parlé
  alternative: Un messager lui a parlé
  rationale: Le contexte immédiat est celui d’une voix venue du ciel; « ange » communique donc le sens contextuel probable de ἄγγελος sans ajouter d’identification doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La construction distingue clairement les deux interprétations de la foule et préserve l’antériorité de l’audition ainsi que la valeur imperfective de « disait ».
