  naturalness: Le français révisé est naturel en français international moderne. Le plus-que-parfait « avait entendu » marque bien l’antériorité; « disait » maintient l’imparfait du grec; et « il y avait eu un coup de tonnerre » est idiomatique sans présenter le tonnerre comme un fait narratorial.
  terminology: « foule », « coup de tonnerre », « ange » et « lui a parlé » sont appropriés. « Ange » correspond au sens contextuellement probable de ἄγγελος sans ajouter d’interprétation doctrinale.
