reference: John 12:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: fr
  text: 'Mais Jésus cria et dit : « Celui qui croit en moi ne croit pas en moi, mais en celui qui m’a envoyé.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette parole ne nie pas que Jésus soit lui-même l’objet de la foi ; elle affirme que croire en lui est inséparable de croire en celui qui l’a envoyé.
    reason: cross_reference
lexical_decisions:
- source_word: ἔκραξεν
  choice: proclama d’une voix forte
  rationale: Le verbe κράζω décrit une déclaration forte et publique. Cette formulation restitue à la fois le volume et la solennité sans suggérer nécessairement un cri de détresse.
- source_word: Ὁ πιστεύων
  choice: Celui qui croit
  rationale: Le participe présent substantivé a une portée générale. « Celui qui croit » suit de près la construction grecque tout en restant naturel en français.
- source_word: πιστεύων / πιστεύει
  choice: croit
  rationale: Avec εἰς, πιστεύω se rend traditionnellement et justement par « croire en ». La répétition du même verbe conserve le parallélisme du texte.
- source_word: εἰς ἐμέ
  choice: en moi
  rationale: Avec πιστεύω, la préposition εἰς indique ici la personne vers laquelle la foi se porte; « en moi » est l’expression française idiomatique.
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: mais en celui qui m’a envoyé
  rationale: La traduction préserve le contraste marqué par ἀλλά et la désignation indirecte du participe, sans introduire « le Père » dans le texte principal.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque une transition légèrement contrastive avec le contexte précédent; « Mais » la rend clairement et naturellement.
- source_word: καὶ εἶπεν
  choice: implicite dans « proclama »
  rationale: 'En français, « proclama d’une voix forte : » exprime naturellement l’acte de parler introduit par καὶ εἶπεν; traduire séparément « et dit » serait lourd et redondant.'
theological_decisions:
- issue: La phrase « ne croit pas en moi, mais en celui qui m’a envoyé » peut sembler nier que Jésus soit lui-même l’objet de la foi.
  choice: Conserver sans ajout la formulation paradoxale du grec, avec une note explicative.
  alternative: Traduire « ne croit pas seulement en moi » ou nommer explicitement « le Père » dans le texte principal.
  rationale: Le grec ne comporte pas « seulement ». L’ajouter résoudrait une tension voulue. La formulation johannique présente la foi en Jésus comme inséparable de la foi en celui qui l’a envoyé, sans que la traduction doive expliciter davantage.
translation_notes:
  register: Français international moderne, digne et accessible. « Proclama d’une voix forte » garde le caractère public et solennel de l’énoncé. La tension théologique de la négation est maintenue dans le texte principal plutôt que résolue par l’ajout de « seulement ».
