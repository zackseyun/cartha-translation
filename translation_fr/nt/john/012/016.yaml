id: JHN.12.16
reference: John 12:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: fr
  text: Ses disciples ne comprirent pas tout cela au début[a]. Mais lorsque Jésus fut glorifié[b], ils se souvinrent que tout cela avait été écrit à son sujet[c] et qu’on avait accompli tout cela à son égard.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne connurent pas tout cela au début » ; dans le contexte, il s’agit de ne pas en saisir la signification.'
    reason: lexical_alternative
  - marker: b
    text: Dans l’Évangile selon Jean, la glorification de Jésus est liée à sa mort, à sa résurrection et à son élévation auprès du Père.
    reason: cross_reference
  - marker: c
    text: 'Ou : « avait été écrit le concernant ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνωσαν
  choice: ne comprirent pas
  rationale: Dans ce contexte, le verbe désigne moins l’absence d’une information que l’incapacité des disciples à saisir sur le moment la portée des événements. « Ne comprirent pas » l’exprime naturellement en français, tout en laissant en note le sens plus littéral de connaissance.
- source_word: αὐτοῦ οἱ μαθηταί
  choice: ses disciples
  rationale: Le génitif marque ici l’appartenance ou l’association. « Ses disciples » est la tournure française naturelle.
- source_word: τὸ πρῶτον
  choice: au début
  rationale: Cette expression temporelle signifie « d’abord », « au début ». La formulation choisie est claire et courante.
- source_word: ταῦτα
  choice: tout cela
  rationale: Le démonstratif neutre pluriel renvoie collectivement aux actes qui viennent d’être racontés. « Tout cela » est plus idiomatique que « ces choses » en français et sa répétition maintient la cohésion du verset.
- source_word: ἐδοξάσθη
  choice: eut été glorifié
  rationale: Le passif et le vocabulaire johannique sont conservés. Le passé antérieur marque naturellement en français l’antériorité de cette glorification par rapport au souvenir des disciples, sans en préciser excessivement la portée.
- source_word: ἐμνήσθησαν
  choice: ils se souvinrent
  rationale: Le verbe, de forme passive à valeur déponente, se rend naturellement par le pronominal actif français « se souvenir ».
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: avait été écrit à son sujet
  rationale: Avec le datif, ἐπί signifie ici « au sujet de » ou « concernant ». Le plus-que-parfait exprime l’existence antérieure du témoignage écrit.
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: on avait fait tout cela pour lui
  rationale: La troisième personne du pluriel grec a un sujet non exprimé; le pronom indéfini « on » évite d’identifier celui-ci plus précisément que le texte. « Pour lui » rend naturellement le datif, tandis qu’une note signale l’autre nuance possible, « envers lui ».
theological_decisions:
- issue: Portée de la glorification de Jésus dans Jean
  choice: Conserver « fut glorifié » sans définir davantage l’événement.
  alternative: Paraphraser par « fut élevé dans la gloire », ou limiter l’expression à la résurrection ou à l’exaltation.
  rationale: Chez Jean, la glorification de Jésus peut englober sa mort, sa résurrection et son exaltation. La formulation retenue préserve cette densité et cette tension théologiques.
- issue: Référent du sujet implicite de ἐποίησαν
  choice: Employer le sujet indéfini « on ».
  alternative: Identifier explicitement « la foule » ou « les gens ».
  rationale: Le grec ne nomme pas le sujet de « avaient fait ». La traduction évite donc d’ajouter une identification interprétative.
translation_notes:
  register: Français international moderne, digne et accessible. « Tout cela » évite le calque peu naturel « ces choses ». Le passé antérieur « eut été glorifié » convient à la narration écrite soutenue sans être archaïque; « on » maintient l’indétermination du sujet grec.
