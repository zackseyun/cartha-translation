revisions:
- from: Ses disciples ne comprirent pas tout cela au début[a]. Mais lorsque Jésus eut été glorifié[b], ils se souvinrent que tout cela avait été écrit à son sujet et qu’on avait fait tout cela pour lui[c].
  to: Ses disciples ne comprirent pas tout cela au début[a]. Mais lorsque Jésus fut glorifié[b], ils se souvinrent que tout cela avait été écrit à son sujet[c] et qu’on avait accompli tout cela à son égard.
  rationale: 'La révision corrige le sens du datif dans la proposition finale sans identifier le sujet grec implicite : « on » le maintient indéterminé et « à son égard » évite la nuance indue de bénéfice. Elle replace la note lexicale sur l’expression « écrit à son sujet », qui correspond à ἐπ’ αὐτῷ γεγραμμένα. Le passé simple passif « fut glorifié » est fidèle, naturel et ne force pas une chronologie plus précise que celle du grec.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:07:56Z'
review_pass:
  verdict: revise
  source_fidelity: La première proposition rend bien le sens contextuel de ἔγνωσαν (« ne comprirent pas »), et « fut glorifié » conserve la portée johannique non explicitée de ἐδοξάσθη. En revanche, « pour lui » pour ταῦτα ἐποίησαν αὐτῷ introduit une nuance bénéficiaire qui n’est pas requise par le datif et affaiblit la relation directe des actes à Jésus. « À son égard » préserve mieux l’indétermination du sujet et le sens relationnel de la construction.
  naturalness: Le français est globalement naturel. « Lorsque Jésus fut glorifié » est plus direct et moins lourd que le passé antérieur passif « eut été glorifié », tout en respectant la succession narrative. « On avait accompli tout cela à son égard » est idiomatique dans un registre biblique moderne et évite de suggérer que les actes ont été accomplis à son bénéfice.
  terminology: « Disciples », « glorifié » et « à son sujet » sont justes et cohérents avec le registre johannique. La note sur la glorification conserve utilement sa portée large sans la réduire à une seule étape. La note lexicale doit porter sur « à son sujet » (ἐπ’ αὐτῷ γεγραμμένα), non présenter abusivement « pour lui » comme le sens de la proposition finale.
  issues:
  - severity: high
    issue: « pour lui » rend ταῦτα ἐποίησαν αὐτῷ de manière trop bénéficiaire.
    rationale: Le datif αὐτῷ se rapporte à Jésus comme personne concernée par les actions. Dans ce contexte, « pour lui » suggère spontanément un acte accompli en sa faveur; cette lecture n’est pas imposée par le grec et ne correspond pas à la formulation anglaise auditée (« to him »).
  - severity: medium
    issue: La note c est rattachée à la mauvaise unité lexicale et justifie une interprétation incertaine du datif final.
    rationale: L’alternative lexicale pertinente dans le matériau d’audit concerne ἐπ’ αὐτῷ γεγραμμένα (« à son sujet / le concernant »). Une note finale sur « pour lui / envers lui » ne rend pas correctement cette distinction et soutient le choix problématique de « pour lui ».},{
