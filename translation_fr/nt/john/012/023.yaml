id: JHN.12.23
reference: John 12:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: fr
  text: 'Mais Jésus leur répondit : « L’heure est venue pour que le Fils de l’homme soit glorifié.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « L’heure est venue où le Fils de l’homme est glorifié. » Le grec peut exprimer ici ce qui caractérise cette heure ou le dessein qui lui est attaché.'
    reason: ambiguity
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: leur répondit
  rationale: Le présent historique grec et le participe introducteur sont rendus naturellement en français narratif par un passé simple suivi directement du discours. « Leur répondit en disant » serait inutilement lourd.
- source_word: Ἐλήλυθεν
  choice: est venue
  rationale: Le passé composé rend le parfait grec et présente l’arrivée de l’heure comme un fait accompli dont l’effet demeure.
- source_word: ἡ ὥρα
  choice: L’heure
  rationale: « L’heure » conserve le motif johannique récurrent du moment fixé pour la souffrance et la gloire de Jésus, contrairement à « le moment », plus générique.
- source_word: ἵνα δοξασθῇ
  choice: où … doit être glorifié
  rationale: Dans ce contexte, ἵνα précise ce qui caractérise l’heure arrivée. Cette tournure française naturelle conserve aussi l’idée du dessein fixé sans réduire la proposition à une simple indication temporelle.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation française consacrée préserve le titre christologique ainsi que ses résonances avec Daniel 7.
theological_decisions:
- issue: Rendu de ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  alternative: l’Humain
  rationale: Le titre traditionnel conserve sa force christologique et intertextuelle. Une reformulation comme « l’Humain » rendrait son sens général plus immédiat, mais affaiblirait son écho biblique reconnu.
- issue: Valeur de Ἐλήλυθεν ἡ ὥρα
  choice: L’heure est venue
  alternative: Le moment est venu
  rationale: « L’heure » maintient le motif théologique propre à Jean, tandis que le passé composé respecte l’état présent résultant exprimé par le parfait grec.
- issue: Relation exprimée par ἵνα
  choice: où … doit être glorifié
  alternative: pour que … soit glorifié
  rationale: Le contexte permet une nuance de contenu et de dessein. « Où … doit » est idiomatique en français et maintient l’idée d’un moment fixé, sans trancher trop fortement entre temporalité et finalité.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au récit écrit; l’incise grecque « disant » est absorbée dans la ponctuation française. Le titre « Fils de l’homme » et le terme johannique « heure » sont conservés.
