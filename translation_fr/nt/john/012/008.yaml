id: JHN.12.8
reference: John 12:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: fr
  text: En effet, vous avez toujours les pauvres avec vous[a], mais moi, vous ne m’avez pas toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les personnes pauvres ». En grec, l’adjectif « pauvres » est employé comme un nom.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς πτωχούς
  choice: les pauvres
  rationale: L’adjectif substantivé désigne les personnes pauvres comme un groupe. « Les pauvres » est naturel, concis et fidèle en français.
- source_word: γάρ
  choice: En effet
  rationale: La particule introduit ici l’explication de l’affirmation précédente. « En effet » exprime clairement ce lien sans alourdir la phrase.
- source_word: πάντοτε
  choice: toujours
  rationale: L’adverbe indique une présence constante ou une disponibilité durable dans ce contexte. Le même équivalent est conservé dans les deux propositions.
- source_word: ἔχετε
  choice: avez
  rationale: Le verbe exprime ici la présence auprès des disciples, non la possession. « Avoir avec soi » rend naturellement cette idée en français.
- source_word: μεθ’ ἑαυτῶν
  choice: avec vous
  rationale: L’expression signifie « en votre compagnie » ou « auprès de vous ». « Avec vous » est l’équivalent français le plus idiomatique.
- source_word: ἐμέ
  choice: moi / m’
  rationale: Le pronom emphatique est mis en relief par « mais moi », puis repris naturellement comme complément élidé dans « vous ne m’avez pas ».
- source_word: δέ
  choice: mais
  rationale: La conjonction marque le contraste entre la présence durable des pauvres et la présence temporaire de Jésus.
- source_word: οὐ πάντοτε
  choice: ne… pas toujours
  rationale: Cette tournure conserve directement la portée de la négation sur « toujours », sans transformer l’énoncé en négation absolue.
theological_decisions:
- issue: Risque de comprendre la parole comme une dévalorisation de l’aide aux pauvres
  choice: Présenter simplement le contraste entre la présence continuelle des pauvres et la présence temporaire de Jésus auprès des disciples.
  alternative: Paraphraser en laissant entendre que les pauvres sont moins importants, ou atténuer le contraste explicite.
  rationale: Le grec établit un contraste de présence et de moment opportun. Il ne dit pas que le soin des pauvres serait sans importance. La traduction préserve cette tension sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » convient mieux que « car » à l’oral moderne tout en conservant la valeur explicative de γάρ. La dislocation « mais moi » rend l’emphase de ἐμέ et produit un contraste clair.
