  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: fr
  text: Il y avait quelques Grecs parmi ceux qui montaient pour adorer à l’occasion de la fête.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « certains Grecs »; il pouvait s’agir de non-Juifs venus adorer à l’occasion de la fête.
    reason: Signaler une autre manière de rendre l’indéfini τινες et l’incertitude concernant l’identité religieuse de ces Grecs.
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: Il y avait
  rationale: L’imparfait ἦσαν introduit ici l’existence de personnes dans la scène. Le léger lien marqué par δέ peut rester implicite en français, sans ajouter un « alors » temporel absent du grec.
- source_word: Ἕλληνές τινες
  choice: quelques Grecs
  rationale: Ἕλληνες désigne littéralement des Grecs, tandis que τινες leur donne un caractère indéfini. « Quelques Grecs » est naturel et ne tranche pas leur statut religieux.
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: parmi ceux qui étaient montés
  rationale: ἐκ indique qu’ils faisaient partie du groupe. Le verbe « monter » conserve l’expression du pèlerinage vers Jérusalem; le plus-que-parfait français situe naturellement leur montée avant la scène relatée.
- source_word: ἵνα προσκυνήσωσιν
  choice: pour adorer
  rationale: ἵνα suivi du subjonctif exprime le but. Ici, προσκυνέω désigne l’adoration religieuse.
- source_word: ἐν τῇ ἑορτῇ
  choice: pendant la fête
  rationale: L’expression situe leur adoration dans le cadre de la fête juive. « Pendant la fête » est clair et naturel sans préciser davantage ce que le verset ne nomme pas.
theological_decisions:
- issue: Identité des Ἕλληνες
  choice: Grecs
  alternative: non-Juifs; païens; Juifs de langue grecque
  rationale: Le texte les appelle simplement Ἕλληνες et ne précise pas s’ils étaient prosélytes, sympathisants du judaïsme ou membres d’un autre groupe. La traduction conserve cette ambiguïté au lieu de déterminer leur statut religieux.
translation_notes:
  register: Français international moderne, simple et digne. « La fête » conserve le vocabulaire johannique sans ajouter explicitement « la Pâque » dans ce verset.
