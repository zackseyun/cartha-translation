source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: fr
  text: Il a aveuglé leurs yeux et endurci leur cœur, afin qu’ils ne voient pas de leurs yeux, ne comprennent pas avec leur cœur, ne se tournent pas, et je les guérirai[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne se convertissent pas ».
    reason: lexical_alternative
  - marker: b
    text: Cette phrase reprend Ésaïe 6.10.
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: a aveuglé
  rationale: Le parfait grec présente un acte accompli dont l’effet demeure. Le passé composé français exprime naturellement cet état résultant dans ce contexte.
- source_word: ἐπώρωσεν
  choice: endurci
  rationale: Le verbe désigne l’action de rendre insensible ou endurci. « Endurci » est naturel, conserve l’image prophétique et ne diminue pas la portée judiciaire du propos.
- source_word: καρδίαν / καρδίᾳ
  choice: cœur / avec leur cœur
  rationale: « Cœur » maintient l’anthropologie biblique du texte, tandis que « comprennent » rend explicite sa dimension cognitive. Le singulier collectif du grec est conservé.
- source_word: ἵνα μὴ
  choice: afin qu’ils ne… pas
  rationale: Cette tournure française rend la valeur de but ou de résultat de la construction grecque sans trancher entre ces deux nuances étroitement liées dans la citation.
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: voient de leurs yeux
  rationale: La formulation conserve l’image concrète et le parallélisme du texte. « De leurs yeux » est idiomatique en français dans cette expression.
- source_word: νοήσωσιν
  choice: comprennent
  rationale: Le verbe exprime ici la saisie intellectuelle ou intérieure ; « comprennent » est clair et naturel.
- source_word: στραφῶσιν
  choice: se tournent
  rationale: Cette traduction garde l’image et l’ambiguïté du verbe grec, sans imposer le vocabulaire ecclésiastique plus spécialisé de la conversion.
- source_word: ἰάσομαι
  choice: je les guérirais
  rationale: La forme grecque est un futur, mais elle clôt une séquence de but ou de résultat négatif. Le conditionnel français fait entendre la guérison qui suivrait leur retournement tout en maintenant la tension syntaxique de la citation ; le futur formel est signalé en note.
theological_decisions:
- issue: Action divine dans l’aveuglement et l’endurcissement
  choice: 'Conserver le sujet divin explicite : « Il a aveuglé… et endurci… »'
  alternative: Employer une tournure impersonnelle ou passive qui atténuerait l’action divine
  rationale: Les verbes grecs attribuent explicitement ces actions à un sujet singulier. La traduction maintient donc la difficulté théologique du jugement sans l’adoucir.
- issue: Portée de στραφῶσιν
  choice: « se tournent » dans le texte principal
  alternative: « se convertissent »
  rationale: Le contexte évoque un retour à Dieu, mais le verbe reste plus large que le terme théologique français « se convertir ». La formulation retenue préserve cette amplitude.
- issue: Valeur de ἰάσομαι dans la citation
  choice: « je les guérirais »
  alternative: « je les guérirai »
  rationale: Le futur morphologique est indéniable, mais son insertion après la proposition négative de but ou de résultat crée une relation contingente. Le conditionnel est plus naturel en français, tandis qu’une note conserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « yeux » et « cœur », ainsi que le singulier collectif « leur cœur », sont maintenus pour préserver le parallélisme et la texture de la citation prophétique. Le point-virgule laisse perceptible la rupture syntaxique avant le dernier verbe sans résoudre artificiellement la tension du grec.
