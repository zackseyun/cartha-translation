id: JHN.12.3
reference: John 12:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: fr
  text: Alors Marie prit une livre de parfum de nard pur, très précieux[a][b]. Elle enduisit les pieds de Jésus de ce parfum et les essuya avec ses cheveux. La maison fut remplie de la senteur du parfum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La livre romaine pesait environ 327 grammes.
    reason: cultural_note
  - marker: b
    text: Ou « de nard authentique ». Le sens exact du mot grec traduit par « pur » est discuté.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Alors
  rationale: Marque naturellement en français la progression du récit, sans donner au lien une force strictement déductive.
- source_word: λαβοῦσα
  choice: prit
  rationale: Le participe aoriste, antérieur aux verbes principaux, est rendu par un verbe conjugué pour une narration française naturelle.
- source_word: λίτραν
  choice: une livre
  rationale: La « livre » désigne ici l’unité romaine de poids; ce terme français compréhensible est précisé par une note afin d’éviter de l’assimiler exactement à une mesure moderne.
- source_word: μύρου
  choice: parfum
  rationale: Dans ce contexte, μύρον désigne une substance aromatique servant à l’onction; « parfum » est clair et convient aussi à la mention finale de son odeur.
- source_word: νάρδου
  choice: nard
  rationale: Conserve le nom de la substance aromatique précisée par le texte grec.
- source_word: πιστικῆς
  choice: pur
  rationale: « Pur » exprime une interprétation courante de cet adjectif rare, mais son sens discuté est explicitement signalé en note.
- source_word: πολυτίμου
  choice: très précieux
  rationale: Rend à la fois l’intensité de πολύ- et la grande valeur du produit; en contexte, cette valeur implique aussi son coût élevé.
- source_word: ἤλειψεν
  choice: oignit
  rationale: Rend directement l’application de parfum sur les pieds tout en laissant ouverte sa portée symbolique, sans imposer une lecture sacramentelle ou royale.
- source_word: ἐξέμαξεν
  choice: essuya
  rationale: Exprime simplement l’action accomplie avec les cheveux, sans préciser au-delà du grec s’il s’agit surtout de sécher ou d’essuyer l’excédent.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: avec ses cheveux
  rationale: Rend naturellement le datif instrumental.
- source_word: ἐπληρώθη
  choice: fut remplie
  rationale: Préserve la forme passive et décrit la diffusion de l’odeur dans toute la maison.
theological_decisions:
- issue: Portée symbolique de l’onction
  choice: Employer « oignit » dans son sens narratif concret.
  alternative: « appliqua le parfum sur » ou « enduisit »
  rationale: Le verbe grec décrit bien une onction, qui peut avoir une résonance symbolique dans le récit, mais la traduction ne doit ni effacer cette possibilité ni transformer explicitement le geste en rite sacramentel ou en couronnement.
- issue: Sens de πιστικῆς
  choice: Retenir « pur » dans le texte et signaler l’incertitude en note.
  alternative: « authentique » ou simple translittération « pistique »
  rationale: Le sens exact de l’adjectif est débattu. Une solution lisible est nécessaire dans le texte, mais la note préserve honnêtement l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, narratif et digne. « Livre » conserve la mesure ancienne tout en étant éclairé par une note. Le passé simple convient au registre biblique littéraire sans archaïsme excessif; « oignit » maintient le vocabulaire précis de l’onction.
