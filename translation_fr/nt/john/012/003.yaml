revisions:
- from: Alors Marie prit une livre de parfum de nard pur et très précieux[a][b]. Elle en oignit les pieds de Jésus et les essuya avec ses cheveux. La maison fut remplie de l’odeur du parfum.
  to: Alors Marie prit une livre de parfum de nard pur, très précieux[a][b]. Elle enduisit les pieds de Jésus de ce parfum et les essuya avec ses cheveux. La maison fut remplie de la senteur du parfum.
  rationale: La révision clarifie que la grande valeur qualifie le parfum de nard, conformément à la construction grecque, et emploie une expression moderne et concrète pour l’action d’ἀλείφω. Les notes conservent la précision culturelle sur la litra et l’ambiguïté lexicale reconnue de πιστικῆς. Les ancres restent correctement attachées à l’expression concernée.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:06:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle au grec : Marie prend une litra de nard, oint les pieds de Jésus, les essuie de ses cheveux, et l’odeur remplit la maison. Toutefois, l’emplacement de l’adjectif « très précieux » dans la première phrase peut faire porter la qualification sur le nard seul plutôt que sur le parfum/onguent de nard, alors que le grec qualifie le μύρον. Une formulation plus étroitement structurée résout ce point.'
  naturalness: Le français est globalement naturel et le passé simple convient au registre narratif. « Oignit » est exact mais un peu marqué dans le français international moderne ; « parfuma les pieds de Jésus » serait plus idiomatique mais pourrait atténuer ἀλείφω. « Enduisit les pieds de Jésus de ce parfum » demeure naturel, précis et non archaïque.
  terminology: « Une livre » est acceptable avec la note historique. « Nard pur » conserve un choix interprétatif légitime pour πιστικῆς, à condition de maintenir la note d’incertitude. « Odeur » est fidèle à ὀσμή, mais « senteur » est plus naturel et peut rester neutre ; « parfum » convient aussi dans la répétition finale.
  issues:
  - severity: low
    issue: Portée syntaxique de « très précieux »
    rationale: Dans « parfum de nard pur et très précieux », la coordination peut être comprise comme qualifiant directement « nard ». Le grec πολυτίμου qualifie μύρου (« parfum/onguent »), dont le nard est la substance précisée. Reformuler en « un parfum de nard pur, très précieux » rend plus clairement cette relation sans modifier le sens.
  - severity: low
    issue: Registre de « oignit »
    rationale: Le mot est lexicalement exact, mais il est plus littéraire et ecclésial que le niveau moderne international visé. « Enduisit les pieds de Jésus de ce parfum » exprime l’application concrète de ἀλείφω sans imposer de lecture doctrinale et sans perdre une éventuelle résonance narrative.
  revised_text: Alors Marie prit une livre de parfum de nard pur, très précieux[a][b]. Elle enduisit les pieds de Jésus de ce parfum et les essuya avec ses cheveux. La maison fut remplie de la senteur du parfum.
  revised_footnotes:
  - marker: a
    text: La livre romaine pesait environ 327 grammes.
    reason: cultural_note
  - marker: b
    text: Ou « de nard authentique ». Le sens exact du mot grec traduit par « pur » est discuté.
    reason: lexical_alternative
  revision_rationale: La révision clarifie que la grande valeur qualifie le parfum de nard, conformément à la construction grecque, et emploie une expression moderne et concrète pour l’action d’ἀλείφω. Les notes conservent la précision culturelle sur la litra et l’ambiguïté lexicale reconnue de πιστικῆς. Les ancres restent correctement attachées à l’expression concernée.
