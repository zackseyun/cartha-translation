  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: fr
  text: 'Mais Judas Iscariote, l’un de ses disciples — celui qui allait le livrer[a] —, dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le trahir ». Le verbe grec signifie littéralement « livrer » ou « remettre » et, dans ce contexte, désigne une trahison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit soutenu en français.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste avec le geste de Marie et introduit l’objection de Judas.
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: Judas Iscariote
  rationale: Forme française traditionnelle et immédiatement reconnaissable du nom.
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: l’un de ses disciples
  rationale: « Disciple » conserve précisément la relation de l’élève à son maître; « l’un » convient naturellement devant un complément pluriel défini.
- source_word: ὁ μέλλων
  choice: celui qui allait
  rationale: Cette tournure exprime naturellement en français la perspective future portée par μέλλω dans un récit au passé.
- source_word: παραδιδόναι
  choice: le livrer
  rationale: « Livrer » conserve le sens premier de remise aux autorités tout en évoquant clairement, dans ce contexte, la trahison de Judas.
theological_decisions:
- issue: Sens de παραδιδόναι à propos de l’action de Judas envers Jésus
  choice: le livrer
  alternative: le trahir
  rationale: « Le livrer » préserve l’étendue sémantique du verbe grec et les liens lexicaux avec la remise de Jésus aux autorités, sans effacer la dimension de trahison, explicitée en note.
translation_notes:
  register: Français moderne, international et digne. Le passé simple convient au registre narratif biblique sans être archaïque. L’incise entre tirets conserve l’apposition grecque et prépare la parole qui suit.
