id: JHN.12.9
reference: John 12:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: fr
  text: Une grande foule de Juifs[a] apprit donc que Jésus était là. Ils vinrent non seulement à cause de Jésus, mais aussi pour voir Lazare, qu’il avait relevé d’entre les morts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une grande foule de Judéens ». Le terme grec peut désigner les Juifs en général ou, dans certains contextes chez Jean, plus précisément les habitants de la Judée.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: apprit
  rationale: L’aoriste de γινώσκω exprime ici l’acquisition d’une information; « apprit » rend naturellement ce sens narratif.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence ou la continuité logique avec le contexte précédent.
- source_word: ὄχλος πολὺς
  choice: une foule nombreuse
  rationale: Cette formulation française naturelle conserve le nom collectif singulier et l’idée d’un grand nombre.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: parmi les Juifs
  rationale: '« Parmi » rend la valeur partitive de ἐκ: la foule est issue d’un ensemble plus large. Le terme Ἰουδαῖοι demeure contextuellement susceptible de désigner les Juifs ou, plus précisément, les Judéens.'
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: que Jésus était là
  rationale: Le nom « Jésus », implicite en grec, évite en français une ambiguïté référentielle avec Lazare; l’imparfait respecte la concordance naturelle des temps dans le récit.
- source_word: ἦλθον
  choice: ils vinrent
  rationale: Le passé simple convient au registre narratif biblique moderne et conserve le point de vue déictique de la scène.
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: non seulement à cause de Jésus
  rationale: διά avec l’accusatif indique ici la raison ou le motif de leur venue.
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: mais aussi pour voir
  rationale: L’infinitif de but est la tournure française la plus naturelle pour rendre ἵνα avec le subjonctif, tout en maintenant la structure corrélative « non seulement… mais aussi ».
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: qu’il avait relevé d’entre les morts
  rationale: Le plus-que-parfait explicite l’antériorité de l’action. « Relever d’entre les morts » conserve l’image de ἐγείρω et la valeur de ἐκ, sans réduire l’expression à une simple guérison.
theological_decisions:
- issue: Portée de Ἰουδαίων dans l’Évangile selon Jean
  choice: parmi les Juifs
  alternative: parmi les Judéens
  rationale: Le contexte de la fête et de la foule permet de comprendre le terme comme une désignation du peuple juif, tandis que son sens géographique « Judéens » reste possible dans l’usage johannique. Le texte principal retient l’expression française la plus courante, et la note préserve l’ambiguïté réelle.
- issue: Sens de ἐγείρω appliqué à Lazare
  choice: relevé d’entre les morts
  alternative: ressuscité
  rationale: « Relevé » reproduit plus directement l’image verbale grecque, tandis que « d’entre les morts » rend explicite le retour à la vie sans imposer une terminologie doctrinale plus technique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient une narration littéraire accessible; les constructions restent courantes et non confessionnelles.
