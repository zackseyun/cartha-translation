id: JHN.12.18
reference: John 12:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: fr
  text: 'C’est aussi pour cette raison que la foule alla à sa rencontre[a] : elle avait appris qu’il avait accompli ce signe[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rencontra Jésus » ou « sortit à sa rencontre ». Le verbe grec comporte l’idée d’aller à la rencontre de quelqu’un.'
    reason: lexical_alternative
  - marker: b
    text: '« Signe » est le terme caractéristique employé par Jean pour un acte miraculeux qui renvoie au-delà de lui-même, à l’identité et à la mission de Jésus. Autre traduction possible : « miracle ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: pour cette raison
  rationale: Cette expression marque explicitement le lien causal avec ce qui précède. « Pour cette raison » est naturel en français tout en conservant cette force causale.
- source_word: καὶ
  choice: aussi
  rationale: L’adverbe restitue la valeur additive de la conjonction sans alourdir la phrase.
- source_word: ὑπήντησεν
  choice: alla à sa rencontre
  rationale: Le verbe exprime le mouvement par lequel on va rencontrer quelqu’un. Cette formulation en préserve la nuance directionnelle, contrairement au simple « rencontra ».
- source_word: ὁ ὄχλος
  choice: la foule
  rationale: « La foule » est l’équivalent courant et naturel de ὁ ὄχλος dans ce contexte.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français la cause de l’action de la foule; le rapport causal reste explicite dans la structure de la phrase.
- source_word: ἤκουσαν
  choice: elle avait appris
  rationale: Dans ce contexte, le verbe signifie que la foule avait reçu l’information. Le plus-que-parfait rend clairement l’antériorité par rapport à son déplacement, tandis que le singulier collectif s’accorde naturellement avec « la foule ».
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: qu’il avait accompli ce signe
  rationale: Cette formulation française restitue le discours indirect, la valeur accomplie de l’infinitif parfait et le démonstratif portant sur le signe précis mentionné dans le contexte.
- source_word: τὸ σημεῖον
  choice: ce signe
  rationale: Dans Jean, σημεῖον désigne un acte remarquable qui révèle quelque chose de l’identité et de la mission de Jésus. « Signe » conserve cette portée mieux que « miracle ».
theological_decisions:
- issue: Traduction du terme johannique σημεῖον
  choice: signe
  alternative: miracle
  rationale: « Signe » préserve la dimension révélatrice caractéristique du vocabulaire de Jean, sans réduire l’acte à son caractère prodigieux ni imposer une interprétation supplémentaire.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « C’est aussi pour cette raison que » garde l’enchaînement argumentatif, et les deux-points évitent une répétition lourde de « parce que ». Le passé simple convient au récit écrit, tandis que le plus-que-parfait marque l’information reçue auparavant.
