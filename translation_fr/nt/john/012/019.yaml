id: JHN.12.19
reference: John 12:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: fr
  text: 'Les pharisiens se dirent donc entre eux : « Vous voyez bien que vous n’arrivez à rien. Regardez : le monde est parti à sa suite[a] ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout le monde est parti à sa suite ». Le grec dit « le monde », probablement par exagération rhétorique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence de la scène précédente et conserve naturellement le lien logique en français.
- source_word: πρὸς ἑαυτούς
  choice: entre eux
  rationale: 'Le pronom a ici un sens réciproque : les pharisiens parlent les uns avec les autres au sein de leur groupe.'
- source_word: Θεωρεῖτε
  choice: Vous voyez bien
  rationale: L’indicatif présent pluriel exprime un constat exaspéré adressé aux autres pharisiens ; « bien » rend cette force rhétorique sans transformer le verbe en impératif.
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: vous n’arrivez à rien
  rationale: Cette tournure française actuelle exprime clairement l’inefficacité complète de leurs efforts, plutôt qu’une idée d’aide ou de profit matériel.
- source_word: ἴδε
  choice: Regardez
  rationale: Interjection qui attire brusquement l’attention ; « Regardez » garde sa vigueur dans un registre moderne et digne.
- source_word: κόσμος
  choice: le monde
  rationale: Conserve l’expression grecque et sa résonance johannique, tout en laissant la note signaler son emploi vraisemblablement hyperbolique.
- source_word: ὀπίσω αὐτοῦ
  choice: à sa suite
  rationale: Expression française idiomatique qui garde l’image d’un mouvement derrière Jésus et implique qu’on le suit.
- source_word: ἀπῆλθεν
  choice: est parti
  rationale: Rend directement l’aoriste et s’accorde naturellement avec « à sa suite » ; le contexte fait ressortir le résultat désormais visible.
theological_decisions:
- issue: Portée de κόσμος dans la déclaration des pharisiens
  choice: Conserver « le monde » comme formulation hyperbolique.
  alternative: « tout le monde » ou « toute la foule »
  rationale: Les pharisiens parlent sous le coup de la frustration et exagèrent manifestement. Garder le terme grec évite de réduire sa portée dans le texte principal et ne transforme pas la phrase en affirmation doctrinale d’une adhésion universelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue conserve l’exaspération des pharisiens par « bien », l’appel « Regardez » et le point d’exclamation, sans tomber dans un registre familier.
