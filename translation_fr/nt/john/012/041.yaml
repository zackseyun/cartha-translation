  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: fr
  text: Ésaïe a dit cela parce qu’il a vu sa gloire et qu’il a parlé de lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ésaïe a dit cela parce qu’il a vu la gloire de Dieu et qu’il a parlé de lui. » Dans le contexte de Jean, les pronoms renvoient probablement à Jésus, mais l’arrière-plan plus large chez Ésaïe est la vision de la gloire du Seigneur (Ésaïe 6.1).'
    reason: Lecture alternative précisant l’ambiguïté du référent des pronoms et l’arrière-plan intertextuel.
lexical_decisions:
- source_word: ταῦτα
  choice: cela
  rationale: Le neutre pluriel renvoie aux paroles prophétiques citées précédemment. En français naturel, « cela » reprend bien l’ensemble de ces déclarations, tandis que « ces choses » serait moins idiomatique.
- source_word: εἶπεν
  choice: a dit
  rationale: Rend simplement l’aoriste de λέγω et permet de conserver une légère distinction avec ἐλάλησεν, traduit par « a parlé ».
- source_word: Ἠσαΐας
  choice: Ésaïe
  rationale: Forme française traditionnelle et courante du nom du prophète.
- source_word: ὅτι
  choice: parce que
  rationale: Dans ce contexte, ὅτι introduit le plus naturellement la raison pour laquelle Ésaïe a tenu ces propos. « Que » reste grammaticalement envisageable, mais convient moins bien au mouvement explicatif du passage.
- source_word: εἶδεν
  choice: a vu
  rationale: Rendu direct et naturel de l’aoriste de ὁράω.
- source_word: τὴν δόξαν αὐτοῦ
  choice: sa gloire
  rationale: « Gloire » conserve la portée johannique de δόξα. Le possessif français préserve l’ambiguïté grammaticale du pronom quant à son référent explicite.
- source_word: ἐλάλησεν
  choice: a parlé
  rationale: Rend naturellement l’aoriste de λαλέω tout en le distinguant légèrement de εἶπεν (« a dit »).
- source_word: περὶ αὐτοῦ
  choice: de lui
  rationale: Avec parler, « parler de lui » est l’expression française naturelle pour περί suivi du génitif.
theological_decisions:
- issue: Référent des deux pronoms αὐτοῦ
  choice: Conserver les pronoms « sa » et « lui » dans le texte, avec une note indiquant que le contexte johannique les rapporte probablement à Jésus.
  alternative: Expliciter « la gloire de Dieu » ou nommer directement Jésus dans le corps du texte.
  rationale: Le contexte immédiat de Jean 12 applique les paroles d’Ésaïe à l’incrédulité envers Jésus et favorise donc un référent christologique. Toutefois, l’arrière-plan d’Ésaïe 6 est la vision de la gloire du Seigneur. Maintenir les pronoms respecte à la fois la formulation grecque et cette tension intertextuelle sans la résoudre silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. « Cela » évite le calque peu idiomatique « ces choses ». Le parallélisme « a dit… a vu… a parlé » reste clair, et la note préserve l’ambiguïté théologique réelle des pronoms.
