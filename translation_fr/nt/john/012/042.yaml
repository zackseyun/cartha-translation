id: JHN.12.42
reference: John 12:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: fr
  text: Pourtant, même parmi les dirigeants, beaucoup crurent en lui. Mais à cause des Pharisiens, ils ne le reconnaissaient pas, afin de ne pas être exclus de la synagogue[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « chassés de la synagogue ». Le grec désigne l’exclusion de la communauté de la synagogue.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: Pourtant
  rationale: Les deux particules renforcent ensemble la concession et le contraste. « Pourtant » en rend naturellement la force en français moderne.
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: même parmi les dirigeants, beaucoup
  rationale: ἐκ avec le génitif indique l’appartenance à un groupe. Dans ce contexte, ἄρχοντες désigne les membres des autorités ou les responsables, d’où « dirigeants » plutôt que « princes ».
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: crurent en lui
  rationale: Cette formulation française courante rend la confiance personnelle dirigée vers Jésus dans l’expression johannique πιστεύω εἰς, sans en déterminer davantage la nature théologique.
- source_word: διὰ τοὺς Φαρισαίους
  choice: à cause des pharisiens
  rationale: διά avec l’accusatif exprime ici la cause. La peur est suggérée par le contexte, mais elle n’est pas explicitement nommée dans ce groupe de mots.
- source_word: οὐχ ὡμολόγουν
  choice: ils ne le reconnaissaient pas ouvertement
  rationale: L’imparfait grec décrit une absence persistante ou répétée de reconnaissance publique. Le pronom « le » renvoie naturellement à Jésus, tandis que « ouvertement » explicite la dimension publique inhérente au contexte sans transformer la phrase en profession de foi formelle.
- source_word: ἵνα μὴ
  choice: afin de ne pas
  rationale: 'Cette tournure conserve la valeur finale de ἵνα μή : leur absence de reconnaissance visait à éviter la conséquence qui suit.'
- source_word: ἀποσυνάγωγοι γένωνται
  choice: être exclus de la synagogue
  rationale: ἀποσυνάγωγος désigne l’exclusion de la communauté synagogale. Cette formulation communique le résultat social et religieux sans supposer une procédure juridique plus précise que le texte.
theological_decisions:
- issue: Nature de la foi des dirigeants dans la théologie johannique
  choice: Traduire simplement ἐπίστευσαν par « crurent en lui » tout en maintenant leur refus de reconnaître Jésus ouvertement.
  alternative: Qualifier leur foi de purement apparente, ou au contraire affirmer qu’elle constituait nécessairement une foi salvatrice pleinement authentique.
  rationale: Le verset affirme leur foi en Jésus tout en signalant leur silence public. La traduction conserve cette tension et ne tranche pas leur statut spirituel au-delà de ce que dit le texte.
- issue: Objet implicite de ὡμολόγουν
  choice: Employer « le reconnaissaient », avec Jésus comme référent naturel.
  alternative: « ne déclaraient pas leur foi » ou « ne l’avouaient pas »
  rationale: Le grec ne formule pas d’objet explicite. Le choix retenu demeure proche de la reconnaissance de Jésus dans le contexte, sans réduire nécessairement le verbe à l’aveu d’une proposition ni lui imposer un sens confessionnel technique.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple « crurent » convient au registre narratif biblique sans être archaïque. « Dirigeants » évite l’ancien « chefs » et indique des responsables investis d’autorité. La répétition de « Mais » après une première phrase brève rend nettement le contraste du grec.
