id: JHN.12.38
reference: John 12:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: fr
  text: 'pour que s’accomplisse la parole prononcée par le prophète Ésaïe : « Seigneur, qui a cru à notre message[a] ? Et à qui le bras du Seigneur a-t-il été révélé ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à ce que nous avons entendu » ou « à notre proclamation ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: pour que
  rationale: Cette tournure introduit naturellement en français la proposition d’accomplissement et laisse subsister la nuance possible de but ou de résultat dans le contexte johannique.
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: la parole prononcée par le prophète Ésaïe
  rationale: « Parole » conserve le motif johannique de l’accomplissement de l’Écriture. « Prononcée par » rend explicite et naturel en français le génitif qui désigne Ésaïe comme auteur de cette parole.
- source_word: πληρωθῇ
  choice: s’accomplisse
  rationale: Le subjonctif présent après « pour que » rend naturellement l’aoriste passif grec dans cette formule d’accomplissement, sans ajouter d’explication causale.
- source_word: Κύριε
  choice: Seigneur
  rationale: Rend directement le vocatif κύριε et convient à l’adresse scripturaire de la citation.
- source_word: ἐπίστευσεν
  choice: a cru
  rationale: Le passé composé est naturel dans cette question rhétorique et exprime l’acte de croire sans modifier sa portée.
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: à notre message
  rationale: ἀκοή peut désigner ce qui est entendu ou annoncé. « Notre message » exprime clairement en français le contenu proclamé, tandis que les autres sens possibles sont signalés en note.
- source_word: ὁ βραχίων κυρίου
  choice: le bras du Seigneur
  rationale: La traduction littérale conserve la métaphore biblique de la puissance et de l’action divines.
- source_word: ἀπεκαλύφθη
  choice: a-t-il été révélé
  rationale: Le passé composé passif conserve explicitement la voix passive et s’accorde naturellement avec « qui a cru ».
theological_decisions:
- issue: Rapport entre l’incrédulité et l’accomplissement prophétique
  choice: pour que s’accomplisse
  alternative: de sorte que s’est accomplie ; afin que s’accomplisse
  rationale: « Pour que » maintient la formulation grecque d’accomplissement sans trancher nettement entre but divin et résultat constaté.
- issue: Sens de ἀκοή dans la citation d’Ésaïe
  choice: notre message
  alternative: ce que nous avons entendu ; notre proclamation
  rationale: Le mot grec peut évoquer aussi bien l’audition que le contenu entendu ou proclamé. Le texte principal retient le sens contextuel de message, et la note préserve l’ambiguïté lexicale réelle.
translation_notes:
  register: Français moderne, digne et accessible. La syntaxe initiale reste liée au contexte du verset précédent, comme dans le grec. La métaphore du « bras du Seigneur » est conservée sans paraphrase interprétative.
