  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: fr
  text: Pourquoi n’a-t-on pas vendu ce parfum pour trois cents deniers et donné l’argent aux pauvres ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le denier représentait généralement le salaire d’une journée de travail. Trois cents deniers correspondaient donc approximativement au revenu d’une année, compte tenu des jours non travaillés.
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: Rend directement et naturellement l’interrogation causale.
- source_word: τοῦτο τὸ μύρον
  choice: ce parfum
  rationale: « Parfum » est courant en français moderne et convient à une substance aromatique coûteuse destinée à l’onction.
- source_word: οὐκ ἐπράθη
  choice: n’a-t-on pas vendu
  rationale: Conserve la voix passive de l’aoriste tout en formulant naturellement la question rhétorique en français.
- source_word: τριακοσίων δηναρίων
  choice: pour trois cents deniers
  rationale: Le génitif indique le prix. « Deniers » conserve la monnaie historique sans remplacer sa valeur par une équivalence interprétative.
- source_word: καὶ ἐδόθη πτωχοῖς
  choice: et donné l’argent aux pauvres
  rationale: Le grec coordonne deux passifs et sous-entend ce qui est donné. En français, expliciter « l’argent » évite de suggérer que le parfum lui-même aurait été donné, tout en préservant le sens contextuel.
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La formulation garde la vigueur de la question rhétorique et le terme monétaire historique, expliqué en note.
