id: JHN.12.50
reference: John 12:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: fr
  text: Et je sais que son commandement est la vie éternelle[a]. Ainsi, ce que je dis, je le dis comme le Père me l’a dit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « son commandement conduit à la vie éternelle » ou « son commandement concerne la vie éternelle ». Le grec dit plus littéralement : « son commandement est la vie éternelle ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: commandement
  rationale: « Commandement » correspond directement à l’autorité exprimée par ἐντολή et convient au registre digne du passage.
- source_word: ζωὴ αἰώνιος
  choice: vie éternelle
  rationale: Expression johannique consacrée, qui conserve à la fois la durée et la dimension eschatologique de cette vie.
- source_word: ἃ
  choice: ce que
  rationale: Rend naturellement en français le relatif neutre pluriel employé comme objet de λαλῶ.
- source_word: λαλῶ
  choice: je dis
  rationale: « Dire » est ici plus naturel que « parler » avec une proposition objet; sa répétition conserve celle du verbe grec.
- source_word: καθὼς
  choice: exactement comme
  rationale: Exprime nettement la correspondance entre les paroles du Père et celles de Jésus, sans ajouter de contenu.
- source_word: εἴρηκέν μοι
  choice: me l’a dit
  rationale: Le passé composé rend naturellement en français l’énoncé antérieur dont l’autorité demeure; le pronom « l’ » reprend ce que Jésus dit.
- source_word: ὁ πατήρ
  choice: le Père
  rationale: Conserve le titre relationnel avec l’article, sans ajouter le possessif « mon ».
- source_word: οὖν
  choice: ainsi
  rationale: Marque l’enchaînement logique avec un registre naturel et légèrement soutenu.
- source_word: οἶδα
  choice: je sais
  rationale: Équivalent direct et idiomatique, qui préserve la certitude solennelle de l’affirmation.
theological_decisions:
- issue: Sens de « son commandement est la vie éternelle »
  choice: 'Conserver l’énoncé équatif direct : « son commandement est la vie éternelle »'
  alternative: « son commandement conduit à la vie éternelle » ou « concerne la vie éternelle »
  rationale: Le grec emploie directement le verbe « être ». La formulation retenue préserve la densité et l’ambiguïté théologiques du texte sans réduire le commandement à son résultat ou à son sujet.
translation_notes:
  register: Français international moderne, naturel et digne. La structure répétée « ce que je dis, je le dis » reflète la répétition grecque sans raideur excessive. Aucune note n’est nécessaire, puisque le texte principal conserve déjà l’expression littérale et théologiquement ouverte.
