review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend correctement les éléments essentiels du grec : « je sais », « son commandement est la vie éternelle », la répétition de « dire », le titre « le Père » et le lien inférentiel. L’équation directe entre le commandement et la vie éternelle est bien conservée. Cependant, « exactement comme » peut renforcer καθὼς (« comme / de la manière dont ») au-delà de ce que le grec exige.'
  naturalness: Le français est globalement naturel et digne. « Ainsi » convient bien à οὖν. La formulation répétée « ce que je dis, je le dis » est idiomatique et reproduit utilement la répétition de λαλέω. Remplacer « exactement comme » par « comme » donne une formulation plus sobre et plus directement proportionnée au grec.
  terminology: « Commandement », « vie éternelle » et « le Père » sont des choix justes, établis et adaptés au français international moderne. Une note est souhaitable sur « est la vie éternelle » afin de conserver dans le texte l’expression littérale tout en signalant, sans la trancher, l’ambiguïté sémantique reconnue dans l’audit anglais.
  issues:
  - severity: low
    issue: « exactement comme » est plus appuyé que καθὼς.
    rationale: καθὼς marque la conformité (« comme », « de la manière dont »), mais n’impose pas nécessairement l’intensif « exactement ». La version plus simple préserve mieux la latitude de l’original.
  - severity: low
    issue: Absence de note pour l’expression équative « son commandement est la vie éternelle ».
    rationale: L’expression grecque est littéralement équative, tout en pouvant être comprise contextuellement comme indiquant que le commandement mène à la vie éternelle ou la concerne. Une note brève préserve cette ambiguïté, conformément à l’audit anglais, sans modifier le texte.
  revised_text: Et je sais que son commandement est la vie éternelle[a]. Ainsi, ce que je dis, je le dis comme le Père me l’a dit.
  revised_footnotes:
