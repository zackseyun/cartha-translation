- from: Et je sais que son commandement est la vie éternelle. Ainsi, ce que je dis, je le dis exactement comme le Père me l’a dit.
  to: Et je sais que son commandement est la vie éternelle[a]. Ainsi, ce que je dis, je le dis comme le Père me l’a dit.
