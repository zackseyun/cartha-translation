id: JHN.12.43
reference: John 12:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: fr
  text: Car ils ont aimé la gloire des êtres humains plus que la gloire de Dieu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Les expressions grecques peuvent aussi évoquer la gloire ou l’approbation qui vient des êtres humains, plutôt que celle qui vient de Dieu.
    reason: Le grec répète δόξα (« gloire ») et emploie des génitifs dont le contexte peut suggérer la source, sans l’expliciter.
lexical_decisions:
- source_word: ἠγάπησαν
  choice: ils ont aimé
  rationale: Le passé composé rend naturellement en français l’aoriste indicatif et conserve la force du verbe ἀγαπάω, tandis que la comparaison exprime la préférence.
- source_word: γὰρ
  choice: En effet
  rationale: Dans ce contexte explicatif, « En effet » relie naturellement cette phrase à l’affirmation précédente et en donne la raison.
- source_word: δόξαν
  choice: la gloire
  rationale: « Gloire » préserve la répétition du même terme grec ainsi que sa portée johannique, sans la réduire à la seule approbation ou louange.
- source_word: τῶν ἀνθρώπων
  choice: qui vient des êtres humains
  rationale: Le génitif peut exprimer ici la source de la gloire. « Êtres humains » rend le pluriel générique sans suggérer qu’il s’agit uniquement d’hommes de sexe masculin.
- source_word: μᾶλλον ἤπερ
  choice: plus que
  rationale: Cette formulation française simple conserve explicitement la comparaison entre les deux objets aimés.
- source_word: τοῦ θεοῦ
  choice: qui vient de Dieu
  rationale: La même construction que dans le premier membre préserve le parallélisme et explicite prudemment la valeur probable de source du génitif.
theological_decisions:
- issue: Sens de δόξα dans le contraste entre les êtres humains et Dieu
  choice: gloire
  alternative: approbation, louange ou honneur
  rationale: « Gloire » maintient l’écho lexical et théologique propre à Jean. Les autres formulations éclairent le sens contextuel, mais sont plus étroites.
- issue: Valeur des génitifs τῶν ἀνθρώπων et τοῦ θεοῦ
  choice: qui vient des êtres humains / qui vient de Dieu
  alternative: des êtres humains / de Dieu
  rationale: Le contexte porte vraisemblablement sur la gloire reçue des humains ou de Dieu. La formulation retenue rend ce rapport de source avec clarté, tout en signalant dans la note que le grec reste plus compact.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » convient mieux que le très littéraire « car » au début de cette phrase explicative. La répétition de « la gloire » conserve le parallélisme grec, tandis que « êtres humains » évite une lecture exclusivement masculine.
