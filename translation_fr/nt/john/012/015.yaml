  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: fr
  text: « N’aie pas peur, fille de Sion. Voici, ton roi vient, assis sur un ânon[a]. »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur le petit d’un âne ». Cette formulation fait écho à Zacharie 9.9.'
    reason: Précision lexicale et renvoi intertextuel.
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: N’aie pas peur
  rationale: Cette tournure rend naturellement en français moderne la défense exprimée par μή avec l’impératif présent de φοβέομαι, sans archaïsme.
- source_word: θυγάτηρ Σιών
  choice: fille de Sion
  rationale: Le vocatif suivi du génitif reprend la personnification prophétique de Sion, c’est-à-dire Jérusalem.
- source_word: ἰδοὺ
  choice: Voici
  rationale: La particule attire l’attention sur l’arrivée du roi. « Voici » conserve ici la tonalité prophétique tout en restant courant et digne.
- source_word: ὁ βασιλεύς σου
  choice: ton roi
  rationale: Le groupe nominal défini avec possessif est rendu directement. La minuscule évite d’ajouter par la typographie une distinction absente du grec, tandis que le contexte conserve pleinement la portée messianique.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent français exprime avec concision l’arrivée en cours ou imminente du roi.
- source_word: καθήμενος
  choice: assis
  rationale: Le participe décrit la manière dont le roi vient, sans ajouter l’idée interprétative de « monté ».
- source_word: ἐπὶ πῶλον ὄνου
  choice: sur le petit d’une ânesse
  rationale: Cette formulation conserve πῶλος, un jeune animal, ainsi que ὄνου, qui précise qu’il s’agit d’un âne; le féminin « ânesse » correspond naturellement à la relation de filiation exprimée.
theological_decisions:
- issue: Allusion messianique à Zacharie 9.9
  choice: Conserver « fille de Sion » et « ton roi » sans expliciter l’accomplissement dans le corps du verset.
  alternative: Remplacer Sion par Jérusalem ou identifier explicitement Jésus comme le roi promis.
  rationale: La formulation prophétique doit rester reconnaissable et porter elle-même l’allusion, sans intégrer l’interprétation à la traduction.
- issue: Majuscule éventuelle à « roi »
  choice: 'Employer la minuscule : « roi ».'
  alternative: Écrire « Roi » pour souligner la valeur de titre messianique.
  rationale: Le grec ne marque pas cette distinction typographique. La minuscule traduit sans ajouter de signal théologique éditorial, tandis que le contexte royal et messianique demeure intact.
translation_notes:
  register: Français international moderne, simple et digne. La tournure « N’aie pas peur » est naturelle; « Voici » maintient la solennité de la citation prophétique. Le seul appel de note est placé après l’expression qu’il explique.
