  text: Τῇ ἐπαύριον ⸀ὁ ὄχλος πολὺς ὁ ἐλθὼν εἰς τὴν ἑορτήν, ἀκούσαντες ὅτι ἔρχεται ⸁ὁ Ἰησοῦς εἰς Ἱεροσόλυμα,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/012.yaml
  text: The next day[a], the large crowd that had come to the feast, when they heard that Jesus was coming to Jerusalem[b],
translation:
  language: fr
  text: Le lendemain, la foule nombreuse qui était venue à la fête apprit que Jésus arrivait à Jérusalem,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Le lendemain
  rationale: Cette expression temporelle rend naturellement le datif adverbial et maintient la progression du récit.
- source_word: ὁ ὄχλος πολὺς
  choice: la foule nombreuse
  rationale: ὄχλος désigne une foule et πολὺς en souligne l'importance numérique ; cette formulation est claire, actuelle et digne.
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: qui était venue pour la fête
  rationale: Le participe articulaire qualifie la foule ; le plus-que-parfait exprime l'antériorité de sa venue, et « pour » rend ici la destination ou le but de cette venue à la fête.
- source_word: ἀκούσαντες
  choice: apprit
  rationale: Le participe aoriste pluriel renvoie aux personnes composant la foule. En français, le nom collectif singulier appelle naturellement le verbe au singulier ; l'intégration comme verbe principal produit une phrase fluide, dont l'action reste suspendue jusqu'au verset suivant comme dans le grec.
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: que Jésus arrivait
  rationale: L'imparfait français transpose naturellement le présent historique ἔρχεται dans le cadre d'un récit au passé, tout en indiquant l'approche en cours.
- source_word: εἰς Ἱεροσόλυμα
  choice: à Jérusalem
  rationale: Avec un verbe de mouvement, εἰς marque ici la destination ; « arriver à Jérusalem » est l'expression française idiomatique.
