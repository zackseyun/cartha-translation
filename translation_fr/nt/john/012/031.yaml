source:
  edition: SBLGNT
  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: fr
  text: C’est maintenant le jugement de ce monde ; maintenant, le dirigeant de ce monde[a] sera jeté dehors.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prince de ce monde ». Cette expression est généralement comprise comme désignant Satan.
    reason: lexical_alternative_and_interpretive_clarification
lexical_decisions:
- source_word: νῦν
  choice: maintenant
  rationale: Répété aux deux endroits afin de conserver l’insistance temporelle et le parallélisme du grec.
- source_word: κρίσις
  choice: est jugé
  rationale: La tournure verbale est naturelle en français et exprime l’acte décisif de jugement visant « ce monde », sans le réduire à une simple évaluation.
- source_word: κόσμου τούτου
  choice: ce monde
  rationale: Conserve le démonstratif τούτου et le contraste johannique associé au monde présent.
- source_word: ἄρχων
  choice: souverain
  rationale: Désigne clairement celui qui exerce une autorité, tout en évitant le caractère dynastique que « prince » peut suggérer en français moderne.
- source_word: ἐκβληθήσεται ἔξω
  choice: sera jeté dehors
  rationale: Préserve le futur passif ainsi que l’idée renforcée d’expulsion portée par ἐκβάλλω accompagné de ἔξω.
theological_decisions:
- issue: Identité du « souverain de ce monde »
  choice: L’identité reste implicite dans le texte principal.
  alternative: L’identifier explicitement à Satan ou au diable.
  rationale: Dans Jean, l’expression est couramment comprise comme désignant Satan, mais le grec emploie ici un titre plutôt qu’un nom. La formulation conserve donc la tension du texte sans ajouter cette identification.
translation_notes:
  register: Français international moderne, naturel et digne. La structure parallèle avec « maintenant » est conservée. « C’est maintenant que » rend idiomatiquement l’accent initial, tandis que le second « maintenant » maintient la progression rhétorique.
