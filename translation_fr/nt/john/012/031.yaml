  verdict: revise
  source_fidelity: 'La formulation actuelle rend bien les deux occurrences emphatiques de νῦν, le démonstratif de « ce monde » et le futur passif renforcé d’expulsion. Toutefois, « ce monde est jugé » transforme le substantif grec κρίσις (« jugement ») en verbe passif et atténue la formulation déclarative : « maintenant est le jugement de ce monde ».'
  naturalness: « C’est maintenant le jugement de ce monde » est naturel dans un registre biblique moderne et conserve mieux la structure du grec. « Le dirigeant de ce monde » est plus courant et moins dynastique que « le souverain » dans le français international actuel. « Sera jeté dehors » demeure une expression claire qui rend l’expulsion renforcée par ἔξω.
  terminology: « Jugement », « ce monde » et « dirigeant » rendent respectivement κρίσις, κόσμου τούτου et ἄρχων sans expliciter l’identité du dirigeant. La note maintient « prince » comme possibilité lexicale et présente l’identification à Satan comme une compréhension courante, non comme une addition au texte.
  issues:
