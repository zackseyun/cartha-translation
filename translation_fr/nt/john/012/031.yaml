    issue: κρίσις est rendu par une proposition verbale passive.
    rationale: « Ce monde est jugé » communique une conséquence compatible avec le contexte, mais le grec énonce littéralement la présence ou l’avènement du « jugement de ce monde ». Employer le substantif préserve plus exactement la forme et la portée de l’énoncé.
  - severity: low
    issue: « Souverain » peut évoquer avant tout un monarque.
    rationale: ἄρχων désigne ici celui qui exerce une autorité. « Dirigeant » est plus neutre et idiomatique en français moderne, sans implication dynastique.
  revised_text: C’est maintenant le jugement de ce monde ; maintenant, le dirigeant de ce monde[a] sera jeté dehors.
