  to: C’est maintenant le jugement de ce monde ; maintenant, le dirigeant de ce monde[a] sera jeté dehors.
  rationale: La révision rétablit « jugement » pour rendre directement κρίσις et remplace « souverain » par « dirigeant », terme moderne plus neutre pour ἄρχων. Le parallélisme de νῦν, le démonstratif « ce », le futur passif et l’intensification expulsive de ἐκβληθήσεται ἔξω sont conservés. La note conserve l’ambiguïté textuelle en ne faisant de Satan qu’une compréhension généralement reçue.
