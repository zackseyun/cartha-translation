revisions:
- from: Maintenant, mon âme est troublée[a]. Et que dirai-je ? Père, sauve-moi de cette heure. Mais c’est précisément pour cela que je suis venu jusqu’à cette heure.
  to: Maintenant, mon âme est troublée[a]. Et que dirai-je ? Père, sauve-moi de cette heure. Mais c’est pour cela que je suis venu à cette heure.
  rationale: La révision retire l’intensification non exprimée par le grec et remplace « jusqu’à » par « à » afin de rendre plus directement εἰς (« à/vers, dans ») et l’arrivée à l’« heure » johannique. La demande directe et la note sur la ponctuation ambiguë sont maintenues.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:07:12Z'
review_pass:
  verdict: revise
  source_fidelity: Le texte rend fidèlement le trouble présent (τετάρακται), la question délibérative, la demande directe retenue par la ponctuation SBLGNT et l’opposition introduite par ἀλλά. Toutefois, « précisément » ajoute une insistance qui n’est pas explicitement portée par διὰ τοῦτο. « Jusqu’à cette heure » est possible en français biblique, mais suggère plus nettement un parcours temporel (« jusqu’à maintenant ») que l’arrivée à l’« heure » exprimée par εἰς.
  naturalness: Le français est globalement moderne, clair et d’un registre approprié. « Je suis venu à cette heure » est une formulation un peu solennelle, mais naturelle dans ce contexte johannique et plus proche de l’image d’une arrivée à l’heure décisive.
  terminology: « Âme », « troublée », « Père », « sauve-moi » et « heure » sont des choix cohérents, naturels et terminologiquement adéquats. La note préserve correctement l’ambiguïté de ponctuation sans imposer une lecture théologique.
  issues:
  - severity: low
    issue: « précisément » dans « c’est précisément pour cela »
    rationale: Le grec διὰ τοῦτο signifie « pour cela / à cause de cela » et ne requiert pas l’intensification « précisément ». Il est préférable de ne pas ajouter cette nuance.
  - severity: low
    issue: « jusqu’à cette heure » pour εἰς τὴν ὥραν ταύτην
    rationale: Cette tournure est recevable, mais peut évoquer l’idée de durée jusqu’au présent. « à cette heure » rend plus directement l’arrivée à l’heure décisive tout en conservant le motif johannique.
  revised_text: Maintenant, mon âme est troublée[a]. Et que dirai-je ? Père, sauve-moi de cette heure. Mais c’est pour cela que je suis venu à cette heure.
