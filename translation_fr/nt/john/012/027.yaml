source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: fr
  text: Maintenant, mon âme est troublée[a]. Et que dirai-je ? Père, sauve-moi de cette heure. Mais c’est pour cela que je suis venu à cette heure.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre lecture possible : « Maintenant, mon âme est troublée. Et que dirai-je ? “Père, sauve-moi de cette heure” ? » Le grec peut faire de ces paroles une question rhétorique plutôt qu’une demande directe.'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Maintenant
  rationale: Marque l’immédiateté du trouble présent de Jésus, dans une formulation française directe et naturelle.
- source_word: ψυχή
  choice: âme
  rationale: Désigne ici la vie intérieure, voire la personne même de Jésus. « âme » conserve la gravité du terme et son caractère anthropologique sans le paraphraser excessivement.
- source_word: τετάρακται
  choice: est troublée
  rationale: Le parfait exprime un état présent résultant d’un bouleversement. « est troublée » rend naturellement cet état durable sans en atténuer la force.
- source_word: τί εἴπω
  choice: que dirai-je ?
  rationale: Le subjonctif délibératif exprime la réflexion devant ce qu’il conviendrait de dire. Le futur français est idiomatique et conserve cette hésitation délibérative.
- source_word: πάτερ
  choice: Père
  rationale: Vocatif adressé à Dieu ; « Père » est la forme directe, naturelle et digne en français contemporain.
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: sauve-moi de cette heure
  rationale: L’impératif et ἐκ expriment la délivrance de l’épreuve imminente. Cette formulation reste proche du grec et conserve le motif johannique de l’« heure ».
- source_word: ὥρα
  choice: heure
  rationale: Chez Jean, le mot désigne souvent le moment décisif fixé pour la souffrance, la mort et la glorification de Jésus. Le choix littéral préserve ce motif théologique.
- source_word: ἀλλὰ διὰ τοῦτο
  choice: Mais c’est précisément pour cela
  rationale: La tournure exprime à la fois le contraste et la raison ou finalité. « précisément » clarifie le lien avec l’heure sans imposer une explication étrangère au texte.
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: je suis venu jusqu’à cette heure
  rationale: Le passé composé convient au français actuel, tandis que « jusqu’à » rend idiomatiquement l’arrivée au moment décisif exprimée par εἰς, sans transformer explicitement celui-ci en « pour ».
theological_decisions:
- issue: Faut-il comprendre « Père, sauve-moi de cette heure » comme une demande directe ou comme la possibilité rejetée qui prolonge la question « que dirai-je ? » ?
  choice: 'Le rendre comme une demande directe : « Père, sauve-moi de cette heure. »'
  alternative: 'Le rendre comme une question rhétorique : « Et que dirai-je ? “Père, sauve-moi de cette heure” ? »'
  rationale: La ponctuation n’appartient pas aux manuscrits les plus anciens, et le grec permet les deux lectures. La ponctuation du SBLGNT présente la phrase comme une demande directe, suivie d’une affirmation contrastée de la mission de Jésus. Le texte principal conserve ainsi la tension entre son trouble réel devant l’heure et son acceptation de la raison de sa venue ; la note préserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve « âme » et « heure », termes importants dans le contexte johannique, tout en employant une syntaxe accessible. Le marqueur [a] figure dans le texte principal.
