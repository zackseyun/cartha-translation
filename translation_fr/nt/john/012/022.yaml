  text: ἔρχεται ⸀ὁ Φίλιππος καὶ λέγει τῷ Ἀνδρέᾳ· ⸀ἔρχεται Ἀνδρέας καὶ Φίλιππος ⸀καὶ λέγουσιν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/022.yaml
  text: Philip comes and tells Andrew[a]; Andrew and Philip come and tell Jesus.
translation:
  language: fr
  text: Philippe vient le dire à André[a] ; André et Philippe viennent le dire à Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie quatre présents historiques (« vient… dit… viennent… disent »), procédé narratif courant qui donne de la vivacité à la scène. Le français conserve cet effet dans « vient/viennent le dire »; beaucoup de traductions utilisent plutôt le passé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: va trouver
  rationale: Dans ce contexte, le verbe décrit le déplacement de Philippe vers son interlocuteur. « Va trouver » est naturel en français et conserve le présent historique.
- source_word: λέγει
  choice: lui dit
  rationale: Le présent « dit » restitue le présent historique grec ; le pronom « lui » exprime naturellement le destinataire marqué par le datif.
- source_word: τῷ Ἀνδρέᾳ
  choice: André
  rationale: Le nom est donné sous sa forme française traditionnelle ; le datif est rendu par le pronom indirect « lui ».
- source_word: ἔρχεται Ἀνδρέας καὶ Φίλιππος
  choice: André et Philippe vont trouver
  rationale: L'accord au pluriel suit le sujet composé. « Vont trouver » exprime idiomatiquement leur déplacement vers Jésus tout en maintenant le présent historique.
- source_word: λέγουσιν
  choice: lui disent
  rationale: Le pluriel correspond aux deux sujets et le présent conserve la vivacité narrative du grec.
- source_word: τῷ Ἰησοῦ
  choice: Jésus
  rationale: Le nom est donné sous sa forme française traditionnelle ; le datif destinataire est rendu par « lui ».
- source_word: καί
  choice: et
  rationale: La coordination simple du grec est conservée sans lui ajouter une nuance temporelle ou logique explicite.
- source_word: ὁ Φίλιππος
  choice: Philippe
  rationale: L'article grec devant le nom propre n'est pas rendu, conformément à l'usage naturel du français.
theological_decisions: []
