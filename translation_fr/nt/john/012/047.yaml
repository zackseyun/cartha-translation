id: JHN.12.47
reference: John 12:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: fr
  text: Si quelqu’un entend mes paroles et ne les garde pas, moi, je ne le juge pas[a][b] ; car je ne suis pas venu pour juger le monde, mais pour sauver le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je ne le condamne pas ». Selon le contexte, le verbe grec traduit par « juger » peut désigner un jugement défavorable.
    reason: lexical_alternative
  - marker: b
    text: 'Le pronom « le » a ici une valeur générique : la déclaration s’applique à toute personne qui entend les paroles de Jésus sans les garder.'
    reason: generic_pronoun
lexical_decisions:
- source_word: ἐάν τίς
  choice: si quelqu’un
  rationale: Cette tournure conditionnelle indéfinie présente un cas général et ouvert. « Quelqu’un » est naturel en français moderne.
- source_word: ἀκούσῃ
  choice: entend
  rationale: Le sens premier est « entendre ». Ce choix n’ajoute pas l’idée d’attention ou d’obéissance que pourrait suggérer « écoute ».
- source_word: τῶν ῥημάτων
  choice: mes paroles
  rationale: ῥήματα désigne ici les paroles prononcées par Jésus. « Mes paroles » est naturel, digne et moins paraphrastique que « ce que je dis ».
- source_word: φυλάξῃ
  choice: ne les garde pas
  rationale: φυλάσσω peut signifier garder, préserver ou observer. « Garder » maintient l’étendue du sens, qui comprend ici la fidélité et la mise en pratique, sans le réduire à la seule obéissance.
- source_word: οὐ κρίνω αὐτόν
  choice: moi, je ne le juge pas
  rationale: « Juger » conserve le même verbe que dans la proposition de but qui suit et préserve la tension du langage johannique sur le jugement. Le pronom « le » reprend au singulier le cas générique introduit par « quelqu’un ».
- source_word: ἦλθον
  choice: je ne suis pas venu
  rationale: Le passé composé exprime naturellement en français la venue de Jésus et la mission qui en découle.
- source_word: ἵνα κρίνω
  choice: pour juger
  rationale: La préposition « pour » rend de façon idiomatique la proposition grecque de but.
- source_word: κόσμον
  choice: le monde
  rationale: « Le monde » est l’équivalent usuel de κόσμος chez Jean et conserve ici sa portée humaine et théologique sans la préciser excessivement.
- source_word: σώσω
  choice: sauver
  rationale: « Sauver » rend le verbe théologique central σῴζω et convient mieux que le plus restreint « secourir ».
theological_decisions:
- issue: La déclaration « je ne le juge pas » au regard des autres passages johanniques sur le jugement
  choice: Conserver « juger » et laisser le contexte indiquer que Jésus parle du but de sa venue.
  alternative: Traduire par « condamner » ou expliciter « je ne le juge pas maintenant ».
  rationale: Le verset oppose le but salvateur de la venue de Jésus au jugement. Garder « juger » préserve la répétition grecque et la tension avec d’autres affirmations johanniques, sans imposer une harmonisation doctrinale.
- issue: La portée générique du pronom αὐτόν
  choice: Employer « le » comme reprise singulière de « quelqu’un », avec une note explicative.
  alternative: Employer « cette personne » afin d’éviter le pronom masculin générique.
  rationale: Le grec emploie un pronom masculin singulier après l’indéfini τις. Le français « le » reflète cette reprise grammaticale, tandis que la note précise que l’énoncé concerne toute personne.
translation_notes:
  register: Français international moderne, clair et digne. La dislocation « moi, je » rend l’emphase explicite de ἐγώ. La répétition de « le monde » suit le grec et soutient l’opposition entre juger et sauver.
