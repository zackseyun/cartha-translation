id: JHN.12.37
reference: John 12:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοσαῦτα δὲ αὐτοῦ σημεῖα πεποιηκότος ἔμπροσθεν αὐτῶν οὐκ ἐπίστευον εἰς αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: fr
  text: Bien qu’il ait accompli tant de signes sous leurs yeux, ils ne croyaient pas en lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ils ne crurent pas en lui » ; l’imparfait grec peut suggérer une incrédulité continue ou répétée.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: tant de
  rationale: Exprime naturellement en français la quantité importante et l’accent porté sur le grand nombre des signes.
- source_word: δὲ
  choice: bien que
  rationale: La valeur adversative de δέ est intégrée à la tournure concessive, plus fluide en français qu’un cumul comme « Mais bien que ».
- source_word: σημεῖα
  choice: signes
  rationale: Conserve le terme johannique, qui présente les actes de Jésus comme porteurs d’une signification révélatrice, plutôt que de les réduire à des « miracles ».
- source_word: πεποιηκότος
  choice: ait accompli
  rationale: Le passé du subjonctif après « bien que » rend l’antériorité et la valeur concessive du participe parfait dans la construction absolue.
- source_word: ἔμπροσθεν αὐτῶν
  choice: sous leurs yeux
  rationale: Rend de façon idiomatique le caractère visible et public des signes accomplis en leur présence.
- source_word: οὐκ ἐπίστευον
  choice: ils ne croyaient pas
  rationale: L’imparfait français restitue naturellement l’aspect continu ou persistant de l’imparfait grec sans ajouter l’idée explicite d’un refus volontaire.
- source_word: εἰς αὐτόν
  choice: en lui
  rationale: « Croire en lui » est l’équivalent français naturel de la construction johannique πιστεύω εἰς, avec sa dimension relationnelle de confiance.
theological_decisions:
- issue: La portée de l’imparfait dans l’expression de l’incrédulité
  choice: ils ne croyaient pas en lui
  alternative: ils ne crurent pas en lui
  rationale: L’imparfait préserve l’idée d’une incrédulité persistante malgré les nombreux signes, sans durcir le texte en « ils refusaient de croire », formulation qui ajouterait une nuance volitive.
translation_notes:
  register: Français moderne, digne et accessible. La formulation concessive évite la redondance de « Mais bien que ». « Sous leurs yeux » est plus naturel que « devant eux » dans ce contexte, tout en gardant l’idée de signes publiquement visibles.
