id: JHN.12.45
reference: John 12:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: fr
  text: Et celui qui me voit voit celui qui m’a envoyé[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « contemple » ; le verbe grec peut évoquer un regard attentif, et non la seule perception physique.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: Et
  rationale: Conjonction simple qui relie cette parole au contexte précédent; « Et » en conserve directement la continuité.
- source_word: ὁ θεωρῶν
  choice: celui qui voit
  rationale: Le participe présent substantivé désigne de façon générale la personne qui accomplit l’action. « Celui qui voit » garde le singulier représentatif et reste naturel en français.
- source_word: ἐμὲ
  choice: me
  rationale: Pronom personnel de première personne, complément direct; le français n’exige pas ici de marque supplémentaire pour rendre la forme grecque accentuée.
- source_word: θεωρεῖ
  choice: voit
  rationale: θεωρέω peut désigner le fait de voir, d’observer ou de contempler. « Voit » est naturel et maintient la répétition du même verbe grec.
- source_word: τὸν πέμψαντά με
  choice: celui qui m’a envoyé
  rationale: Le participe aoriste substantivé décrit Dieu comme celui qui a envoyé Jésus, sans introduire un titre absent du grec. Le passé composé est idiomatique en français moderne.
theological_decisions:
- issue: Rapport entre voir Jésus et voir celui qui l’a envoyé
  choice: 'Conserver l’affirmation directe : voir Jésus, c’est voir celui qui l’a envoyé.'
  alternative: Paraphraser soit comme une simple connaissance indirecte de l’envoyeur, soit comme une affirmation explicite d’identité ontologique.
  rationale: Le grec exprime une unité révélatrice forte tout en distinguant Jésus de celui qui l’a envoyé. La formulation française préserve cette tension sans ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, simple et digne. La répétition de « voit » reproduit volontairement celle de θεωρέω, et « celui qui » conserve la structure participiale ainsi que la distinction relationnelle du texte.
