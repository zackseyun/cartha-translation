  source_fidelity: 'La structure fondamentale est fidèle : la négation porte sur une parole venant de Jésus seul, le Père est identifié comme celui qui l’a envoyé, et l’emphase de αὐτός est rendue. Toutefois, « exprimer » pour λαλήσω est trop étroit : le verbe grec signifie ordinairement « parler », sans nécessairement désigner l’expression formulée d’une pensée.'
