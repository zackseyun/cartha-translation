  to: Car ce n’est pas de ma propre initiative que j’ai parlé[a] ; mais le Père qui m’a envoyé m’a lui-même donné l’ordre de ce que je dois dire et de ce dont je dois parler[b].
  rationale: La révision remplace « exprimer », qui restreint indûment le sens de λαλέω, par une tournure française naturelle correspondant à « parler ». Elle améliore aussi la liaison entre le commandement et son contenu, sans modifier le sens, l’emphase sur le Père, ni l’ambiguïté inhérente au texte grec.
