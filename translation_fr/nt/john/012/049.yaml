id: JHN.12.49
reference: John 12:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: fr
  text: Car ce n’est pas de ma propre initiative que j’ai parlé[a] ; mais le Père qui m’a envoyé m’a lui-même donné l’ordre de ce que je dois dire et de ce dont je dois parler[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de moi-même » ou « de ma propre autorité ».'
    reason: lexical_alternative
  - marker: b
    text: Le grec emploie ici deux verbes différents, rendus par « dire » et « parler ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: de ma propre initiative
  rationale: Cette tournure française naturelle exprime que Jésus ne parle pas indépendamment ni de sa seule autorité, sans suggérer que ses paroles ne viennent pas réellement de lui.
- source_word: οὐκ ἐλάλησα
  choice: ce n’est pas ... que j’ai parlé
  rationale: Le passé composé convient au contexte discursif et présente l’ensemble de la parole de Jésus jusqu’ici. La construction clivée rend clairement la négation portant sur l’origine indépendante de cette parole.
- source_word: ὁ πέμψας με πατὴρ
  choice: le Père qui m’a envoyé
  rationale: Cette formulation rend naturellement le participe substantivé associé à « Père ». La majuscule marque le titre divin dans le contexte johannique.
- source_word: αὐτός μοι
  choice: m’a lui-même
  rationale: « Lui-même » conserve l’emphase du pronom grec αὐτός.
- source_word: ἐντολήν
  choice: un commandement
  rationale: « Commandement » maintient la force autoritative du terme grec et convient au registre biblique français sans être obscur.
- source_word: δέδωκεν
  choice: m’a ... donné
  rationale: Le passé composé français exprime naturellement un acte accompli dont la portée demeure présente.
- source_word: τί εἴπω
  choice: ce que je dois dire
  rationale: Le présent « dois » rend naturellement la force directive de la question indirecte après « commandement ».
- source_word: καὶ τί λαλήσω
  choice: et ce que je dois exprimer
  rationale: « Exprimer » permet de ne pas effacer entièrement la présence de deux verbes grecs distincts, λέγω et λαλέω, tout en évitant en français l’étrange répétition « dire/parler ce que ».
theological_decisions:
- issue: Rapport entre la parole du Fils et le commandement du Père
  choice: La formulation affirme que Jésus ne parle pas de sa propre initiative, mais selon le commandement du Père qui l’a envoyé.
  alternative: Formuler le verset comme si Jésus parlait indépendamment du Père, ou comme s’il n’était qu’un porte-parole humain.
  rationale: Le grec souligne explicitement l’origine et la mission reçue du Père. La traduction conserve cette relation sans tirer du verset une conclusion sur une prétendue infériorité de nature.
- issue: Traduction de πατήρ
  choice: Père
  alternative: père
  rationale: Dans ce contexte johannique, le mot désigne Dieu comme Père de Jésus et fonctionne comme un titre divin.
translation_notes:
  register: Français international moderne, digne et accessible. « De ma propre initiative » est plus idiomatique que le littéral « à partir de moi-même ». Le parallélisme final est conservé autant que le permet un français naturel.
