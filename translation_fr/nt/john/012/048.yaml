id: JHN.12.48
reference: John 12:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: fr
  text: 'Celui qui me rejette et ne reçoit pas mes paroles[a] a quelqu’un qui le juge : la parole que j’ai prononcée[b], c’est elle qui le jugera au dernier jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’accepte pas mes paroles ». Le verbe grec peut signifier recevoir, accueillir ou accepter.
    reason: lexical_alternative
  - marker: b
    text: Ou « le message que j’ai prononcé ». Le grec logos peut désigner une parole ou un message selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: rejette
  rationale: Le verbe exprime ici le rejet de Jésus lui-même, et non une simple négligence. « Rejette » est direct, naturel et conserve la force personnelle du grec.
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: ne reçoit pas mes paroles
  rationale: « Recevoir » préserve le vocabulaire johannique et peut évoquer aussi bien l’accueil que l’acceptation des paroles de Jésus, sans réduire le sens à un assentiment intellectuel.
- source_word: τὰ ῥήματά μου
  choice: mes paroles
  rationale: Le pluriel ῥήματα désigne les paroles prononcées par Jésus. « Paroles » est courant et digne en français moderne.
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: a quelqu’un qui le juge
  rationale: 'Cette formulation conserve la construction elliptique et la valeur substantivée du participe : celui qui rejette Jésus a déjà quelqu’un qui le juge. La proposition suivante en donne l’identification.'
- source_word: ὁ λόγος
  choice: la parole
  rationale: « La parole » maintient le singulier et la force presque personnifiée de λόγος, tout en pouvant désigner le message prononcé par Jésus.
- source_word: ὃν ἐλάλησα
  choice: que j’ai prononcée
  rationale: En français, le passé composé rend naturellement l’aoriste dans ce contexte. « Prononcée » souligne qu’il s’agit d’une parole effectivement dite.
- source_word: ἐκεῖνος
  choice: c’est elle
  rationale: La tournure détachée restitue l’insistance du démonstratif grec et renvoie clairement à « la parole ».
- source_word: κρινεῖ
  choice: jugera
  rationale: « Jugera » garde toute l’étendue de κρίνω sans préciser indûment que le verdict sera nécessairement une condamnation.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: au dernier jour
  rationale: Expression française naturelle qui conserve la formule eschatologique johannique sans lui imposer un schéma doctrinal supplémentaire.
theological_decisions:
- issue: Nature de l’agent du jugement dans ce verset
  choice: Présenter la parole prononcée par Jésus comme celle qui jugera au dernier jour.
  alternative: Comprendre la parole uniquement comme la norme du jugement exercé personnellement par Jésus, ou comme un juge directement personnifié.
  rationale: La syntaxe annonce d’abord « quelqu’un qui le juge », puis l’identifie à « la parole que j’ai prononcée ». La traduction maintient cette formulation et sa tension avec d’autres passages johanniques sur le rôle du Fils dans le jugement, sans chercher à les harmoniser dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « parole/paroles » est conservée pour refléter la distinction et le lien entre ῥήματα au pluriel et λόγος au singulier. La tournure « c’est elle qui » rend l’emphase grecque sans lourdeur excessive.
