  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: fr
  text: 'Alors Jésus, ayant trouvé un ânon[a], s’assit sur lui, comme il est écrit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un petit âne ». Le grec ὀνάριον désigne un âne, souvent jeune.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: trouva
  rationale: Le participe aoriste indique une action antérieure à celle de s’asseoir. En français courant, deux verbes coordonnés rendent naturellement cette succession sans en modifier le sens.
- source_word: δὲ
  choice: Alors
  rationale: Ici, δέ est un lien narratif léger qui fait progresser le récit, sans marquer une forte opposition.
- source_word: ὀνάριον
  choice: ânon
  rationale: Ce diminutif désigne un âne, souvent jeune. « Ânon » est le terme français précis et naturel pour un jeune âne, tout en convenant à l’allusion à Zacharie.
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: s’assit dessus
  rationale: Cette formulation rend directement l’action de s’asseoir sur l’animal, sans adopter « monta », qui serait légèrement plus interprétatif.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: comme il est écrit
  rationale: Formule française consacrée et naturelle pour introduire une citation de l’Écriture; elle conserve le rapport de correspondance exprimé par καθώς et la portée résultative de γεγραμμένον.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: En français, l’article grec employé avec le nom propre n’est pas rendu.
theological_decisions:
- issue: Rapport entre l’action de Jésus et la citation de l’Écriture
  choice: Présenter l’action de Jésus comme correspondant à ce qui est écrit, sans préciser explicitement son intention.
  alternative: Formuler le texte de manière à suggérer que Jésus accomplit délibérément la prophétie.
  rationale: Le verset rapporte l’action, puis introduit la citation biblique. Il établit une correspondance prophétique, mais n’explicite pas ici le motif de Jésus; la traduction conserve cette retenue.
translation_notes:
  register: Français international moderne, clair et digne. « Alors » assure la progression narrative; « s’assit dessus » reste courant sans devenir familier. Le deux-points prépare la citation du verset suivant.
