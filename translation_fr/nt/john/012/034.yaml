id: JHN.12.34
reference: John 12:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: fr
  text: 'La foule lui répondit donc : « Nous avons entendu dire, d’après la Loi, que le Messie[a] demeure pour toujours. Comment peux-tu dire que le Fils de l’homme doit être élevé[b] ? Qui est ce Fils de l’homme ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « le Christ ». Ici, le terme est rendu par « le Messie » parce qu’il fonctionne comme un titre.'
    reason: lexical_alternative
  - marker: b
    text: Ou « être exalté ». Chez Jean, « être élevé » peut évoquer à la fois une élévation physique et l’exaltation.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: La foule lui répondit donc
  rationale: « Donc » conserve la fonction de continuité ou de conséquence de οὖν, tandis que « la foule » rend naturellement ὁ ὄχλος.
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: Nous avons entendu dire, d’après la Loi
  rationale: Cette formulation française exprime une tradition reçue et conserve la Loi comme source de l’affirmation, sans élargir explicitement νόμος à toute l’Écriture.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme un titre au sein d’une attente juive; « Messie » en restitue clairement la portée.
- source_word: μένει εἰς τὸν αἰῶνα
  choice: demeure pour toujours
  rationale: « Demeure » rend la valeur durative de μένει, et « pour toujours » l’expression idiomatique εἰς τὸν αἰῶνα.
- source_word: πῶς λέγεις σὺ
  choice: Comment peux-tu donc dire
  rationale: La tournure rend le caractère incrédule et contradictoire de la question; le pronom sujet explicite reflète l’accent porté par σὺ.
- source_word: δεῖ ὑψωθῆναι
  choice: doit être élevé
  rationale: '« Doit » exprime la nécessité de δεῖ. « Être élevé » préserve le double sens johannique possible: élévation physique et exaltation.'
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Formulation française consacrée qui conserve la valeur titulaire et les résonances scripturaires de l’expression.
theological_decisions:
- issue: Rendu de Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette affirmation sur l’attente d’une figure qui demeure pour toujours, le mot fonctionne nettement comme un titre messianique plutôt que comme un nom propre.
- issue: Portée de ὑψωθῆναι
  choice: être élevé
  alternative: être dressé / être exalté
  rationale: Le choix retenu ne tranche pas entre l’élévation physique associée à la crucifixion et l’exaltation, deux dimensions que le vocabulaire johannique peut faire résonner ensemble.
- issue: Portée de νόμος
  choice: la Loi
  alternative: les Écritures
  rationale: Même si νόμος peut désigner ici plus largement le témoignage scripturaire, « la Loi » préserve l’expression du texte et son cadre juif sans résoudre cette extension sémantique.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation française et les formulations interrogatives naturelles facilitent la lecture, tandis que les titres « Messie » et « Fils de l’homme » conservent leur poids scripturaire.
