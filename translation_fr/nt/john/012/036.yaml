id: JHN.12.36
reference: John 12:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: fr
  text: Pendant que vous avez la lumière, croyez en la lumière, afin que vous deveniez des fils de lumière[a]. Jésus dit cela, puis il s’en alla et se cacha d’eux[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des enfants de lumière ». Le grec dit littéralement « des fils de lumière », expression qui désigne les personnes caractérisées par la lumière.
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « et, après s’en être allé, il se cacha d’eux ».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὡς … ἔχετε
  choice: Pendant que vous avez
  rationale: La tournure a ici une valeur temporelle. « Pendant que » est naturelle en français et conserve l’urgence liée au temps limité où la lumière est présente; « tant que » reste également possible.
- source_word: τὸ φῶς
  choice: la lumière
  rationale: L’article défini est conservé. La formulation maintient sans l’expliciter davantage la portée à la fois imagée et christologique de « la lumière » dans Jean.
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: croyez en la lumière
  rationale: « Croire en » rend directement la construction johannique πιστεύω εἰς et évite une paraphrase interprétative comme « mettez votre confiance dans ».
- source_word: ἵνα
  choice: afin que
  rationale: « Afin que » exprime clairement la visée de l’exhortation tout en convenant au registre digne du passage.
- source_word: υἱοὶ φωτός
  choice: fils de lumière
  rationale: La formulation conserve le nom masculin υἱοί et l’image sémitique désignant des personnes caractérisées par la lumière. Le sens idiomatique inclusif est signalé en note.
- source_word: γένησθε
  choice: vous deveniez
  rationale: Le verbe γίνομαι exprime ici le fait de devenir, et non simplement d’être; le subjonctif français convient à la proposition introduite par « afin que ».
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: Jésus dit cela
  rationale: Cette formulation actuelle et naturelle restitue le sens de λαλέω sans la raideur de « prononça ces choses ».
- source_word: ἀπελθὼν
  choice: puis il s’en alla
  rationale: La coordination française rend avec fluidité l’action du participe aoriste antérieure à celle du verbe principal; « puis » explicite sobrement la succession.
- source_word: ἐκρύβη ἀπ’ αὐτῶν
  choice: se cacha d’eux
  rationale: 'Bien que la forme grecque soit passive, elle a ici un sens intransitif ou moyen naturel: Jésus se soustrait à leur présence ou à leurs regards.'
theological_decisions:
- issue: Expression familiale genrée υἱοὶ φωτός
  choice: fils de lumière
  alternative: enfants de lumière
  rationale: « Fils » préserve la forme masculine du grec et l’expression traditionnelle, tandis que la note précise que l’idiome vise les personnes caractérisées par la lumière, sans restriction implicite aux hommes.
- issue: Portée de πιστεύω εἰς dans le motif johannique de la lumière
  choice: croyez en la lumière
  alternative: mettez votre confiance dans la lumière
  rationale: La traduction directe conserve la diction théologique de Jean sans préciser au-delà du texte la nature de cette foi ou identifier explicitement « la lumière » dans le corps du verset.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « lumière » est volontaire afin de préserver le motif johannique. « Fils de lumière » garde la forme de l’idiome grec, avec une note qui en explicite la portée inclusive. La seconde phrase privilégie une coordination française fluide tout en signalant en note une traduction plus formelle du participe.
