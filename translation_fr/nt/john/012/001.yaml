id: JHN.12.1
reference: John 12:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: fr
  text: Jésus vint donc à Béthanie six jours avant la Pâque, là où se trouvait Lazare, que Jésus avait ressuscité d’entre les morts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Conserve le lien narratif et logique avec le contexte précédent dans un français naturel.
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: six jours avant la Pâque
  rationale: Rend naturellement l’expression temporelle grecque et emploie la désignation française usuelle de la fête juive.
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: vint à Béthanie
  rationale: Suit le mouvement exprimé par ἔρχομαι sans ajouter l’idée plus précise d’une arrivée achevée.
- source_word: ὅπου ἦν Λάζαρος
  choice: là où se trouvait Lazare
  rationale: Préserve la formulation locative simple sans préciser indûment que Lazare y habitait ou y séjournait.
- source_word: ἤγειρεν
  choice: avait relevé
  rationale: Le plus-que-parfait marque naturellement l’antériorité de l’action; « relever » conserve l’image de ἐγείρω et convient au contexte du retour à la vie.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Rend explicitement la valeur de ἐκ et le pluriel substantivé νεκρῶν tout en restant idiomatique en français.
theological_decisions:
- issue: Désignation de celui qui a relevé Lazare
  choice: que Jésus avait relevé d’entre les morts
  alternative: qu’il avait relevé d’entre les morts
  rationale: Le texte grec répète explicitement Ἰησοῦς; la traduction maintient cette répétition et l’identification insistante de Jésus comme auteur de l’acte.
- issue: Langage de résurrection appliqué à Lazare
  choice: relevé d’entre les morts
  alternative: ressuscité
  rationale: « Relevé » traduit plus directement ἐγείρω sans imposer un terme théologique français susceptible de gommer la nuance lexicale du verbe grec.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en évitant un tour lourd; la répétition de « Jésus » est volontairement conservée.
