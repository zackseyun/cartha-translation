id: JHN.12.30
reference: John 12:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: fr
  text: 'Jésus répondit : « Cette voix ne s’est pas fait entendre pour moi, mais pour vous.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cette voix ne s’est pas produite à cause de moi, mais à cause de vous. » La préposition grecque peut aussi exprimer la cause, bien que le contexte favorise ici le sens « pour » ou « au bénéfice de ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν
  choice: Jésus répondit
  rationale: En français moderne, la formule « répondit et dit » serait inutilement lourde. « répondit » restitue naturellement la fonction discursive de la formule grecque tout entière.
- source_word: ἡ φωνὴ αὕτη
  choice: cette voix
  rationale: Le contexte immédiat désigne la voix céleste entendue par la foule; « voix » est donc plus précis que « son ».
- source_word: γέγονεν
  choice: s’est fait entendre
  rationale: Le parfait de γίνομαι décrit ici la survenue de la voix et son résultat présent. Cette tournure est idiomatique en français et convient mieux à « voix » que le calque « est arrivée ».
- source_word: δι’ ἐμὲ
  choice: pour moi
  rationale: 'Dans ce contexte, διά avec l’accusatif indique probablement la destination ou le bénéfice : la voix n’était pas destinée à Jésus ni donnée à son avantage.'
- source_word: δι’ ὑμᾶς
  choice: pour vous
  rationale: La formulation conserve le parallélisme et le contraste avec « pour moi », en désignant les auditeurs comme bénéficiaires de la voix.
- source_word: Οὐ ... ἀλλὰ
  choice: ne… pas… mais
  rationale: Cette construction rend directement l’opposition grecque.
theological_decisions:
- issue: Finalité de la voix céleste
  choice: La voix ne s’est pas fait entendre pour Jésus, mais pour ses auditeurs.
  alternative: La voix s’est produite à cause de Jésus, mais à cause des auditeurs.
  rationale: Le contexte favorise une valeur finale ou bénéficiaire de διά avec l’accusatif dans les deux membres de la phrase. La note conserve toutefois la possibilité causale sans trancher au-delà des données grecques.
translation_notes:
  register: Français international moderne, naturel et digne. La formule narrative grecque redondante est condensée selon l’usage français, tandis que le contraste et l’ambiguïté possible de διά sont préservés.
