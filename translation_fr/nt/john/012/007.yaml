source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: fr
  text: 'Jésus dit donc : « Laisse-la tranquille[a], afin qu’elle le garde pour le jour de mon ensevelissement[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Laisse-la tranquille : elle l’a gardé pour le jour de mon ensevelissement. » Certains comprennent la proposition comme décrivant ce qu’elle a déjà fait plutôt que ce qu’elle pourrait encore faire.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : « jusqu’au jour de mon ensevelissement ». La construction grecque peut aussi recevoir un sens temporel plus explicite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la continuité narrative et logique avec ce qui précède, sans alourdir la phrase.
- source_word: Ἄφες αὐτήν
  choice: Laisse-la tranquille
  rationale: Dans ce contexte, l’impératif de ἀφίημι ordonne à l’interlocuteur de cesser d’importuner la femme. Le singulier correspond à la forme grecque.
- source_word: ἵνα
  choice: afin que
  rationale: Introduit ici le but ou le résultat visé et maintient explicitement le lien entre les deux propositions.
- source_word: εἰς τὴν ἡμέραν
  choice: pour le jour
  rationale: Oriente l’action vers l’occasion future envisagée sans imposer dans le texte principal le sens temporel plus précis de « jusqu’au jour ».
- source_word: ἐνταφιασμοῦ
  choice: ensevelissement
  rationale: Désigne la mise au tombeau ou l’inhumation. « Ensevelissement » est digne, intelligible et convient au contexte funéraire.
- source_word: τηρήσῃ
  choice: qu’elle le garde
  rationale: Rend le subjonctif aoriste dépendant de ἵνα comme une proposition de but. « Garder » conserve l’idée de réserver quelque chose pour une occasion donnée.
- source_word: αὐτό
  choice: le
  rationale: Le pronom neutre renvoie au parfum mentionné dans le contexte. Le pronom français évite d’ajouter un nom absent du grec.
theological_decisions:
- issue: Rapport entre l’onction accomplie par Marie et l’ensevelissement prochain de Jésus
  choice: Présenter la parole comme une instruction orientée vers le jour à venir de l’ensevelissement de Jésus.
  alternative: 'Comprendre la proposition comme décrivant ce qu’elle a déjà fait : « elle l’a gardé pour le jour de mon ensevelissement »; ou lui permettre de le garder « jusqu’au jour » de son ensevelissement.'
  rationale: La construction grecque est difficile et admet plusieurs compréhensions. Le texte principal suit directement l’enchaînement Ἄφες… ἵνα… τηρήσῃ, tandis que les notes préservent les autres interprétations sans résoudre artificiellement la tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement au singulier reflète l’impératif grec adressé à l’interlocuteur immédiat. La formulation conserve le pronom renvoyant au parfum ainsi que l’ambiguïté syntaxique du passage, explicitée en notes.
