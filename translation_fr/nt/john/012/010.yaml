  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: fr
  text: Les grands prêtres décidèrent donc de tuer aussi Lazare,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « projetèrent de tuer aussi Lazare ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: décidèrent
  rationale: Le verbe exprime ici une délibération qui aboutit à une résolution. « Décidèrent » est naturel en français moderne et conserve cette volonté arrêtée; « projetèrent » mettrait davantage l’accent sur la préparation.
- source_word: δὲ
  choice: donc
  rationale: Dans la progression narrative, la particule relie cette décision aux événements qui précèdent. « Donc » rend naturellement ce lien sans introduire un contraste trop marqué.
- source_word: οἱ ἀρχιερεῖς
  choice: les grands prêtres
  rationale: Dans les Évangiles, le pluriel désigne les membres de l’élite sacerdotale, et « les grands prêtres » est l’expression française usuelle et précise.
- source_word: ἵνα
  choice: de
  rationale: Après « décider », la construction française idiomatique « décider de » exprime ici le contenu et le but de la résolution portée par ἵνα avec le subjonctif.
- source_word: καὶ
  choice: aussi
  rationale: 'L’adverbe conserve la valeur additive: Lazare est lui aussi visé, en plus de Jésus dans le contexte.'
- source_word: τὸν Λάζαρον
  choice: Lazare
  rationale: Le nom propre suit sa forme française conventionnelle; l’article grec n’a pas à être rendu séparément.
- source_word: ἀποκτείνωσιν
  choice: faire mourir
  rationale: « Faire mourir » exprime directement l’intention de provoquer sa mort, sans ajouter la qualification morale de « assassiner » ni nécessairement suggérer une exécution judiciaire formelle.
theological_decisions:
- issue: Présentation de l’intention des grands prêtres envers Lazare
  choice: Exprimer directement leur décision de faire mourir Lazare, sans ajouter de motif ni parler de complot.
  alternative: Employer « projetèrent », « complotèrent » ou « décidèrent de tuer ».
  rationale: Le texte décrit une résolution délibérée, mais n’emploie pas ici un terme technique désignant un complot. La formulation retenue préserve la gravité de l’intention sans charger le récit d’une interprétation supplémentaire.
translation_notes:
  register: Français international moderne, sobre et digne. « Grands prêtres » suit l’usage biblique courant; « décidèrent donc » assure une progression narrative fluide. La variante en note conserve les nuances possibles de projet et la formulation plus directe « tuer ».
