id: JHN.12.11
reference: John 12:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: fr
  text: car beaucoup de Juifs[a] s’en allaient[b] à cause de lui et croyaient en Jésus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « beaucoup de Judéens ». Dans l’Évangile selon Jean, le terme peut désigner les Juifs en général, les habitants de la Judée ou, selon le contexte, les autorités juives.
    reason: alternative_reading
  - marker: b
    text: Ou « partaient » ou « se retiraient ». Le verbe grec décrit une action en cours ou répétée, sans préciser explicitement de qui ni de quoi ils s’éloignaient.
    reason: lexical_alternative
  - marker: c
    text: Ou « mettaient leur foi en Jésus » ou « plaçaient leur confiance en Jésus ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: car
  rationale: Introduit la raison du projet des grands prêtres mentionné au verset précédent. « Car » assure naturellement en français le lien causal avec la phrase précédente.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: Rend simplement la quantité exprimée, dans la construction partitive « beaucoup de Juifs ».
- source_word: δι’ αὐτὸν
  choice: à cause de lui
  rationale: 'Avec διά suivi de l’accusatif, l’expression est causale : Lazare est la raison de leur éloignement et de leur foi en Jésus.'
- source_word: ὑπῆγον
  choice: s’éloignaient
  rationale: L’imparfait exprime un mouvement continu ou répété. « S’éloignaient » conserve l’idée de départ sans préciser indûment s’il était physique, social ou idéologique.
- source_word: τῶν Ἰουδαίων
  choice: de Juifs
  rationale: 'Le génitif est partitif avec πολλοὶ : il s’agit de beaucoup de personnes appartenant à ce groupe, et non de tous les Juifs. La possibilité du sens « Judéens » est signalée en note.'
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: croyaient en Jésus
  rationale: Rend directement la foi orientée vers Jésus tout en respectant l’aspect imperfectif, sans ajouter les conséquences doctrinales de cette foi.
theological_decisions:
- issue: Sens de Ἰουδαίων dans le contexte johannique
  choice: « Juifs » dans le texte, avec une note indiquant « Judéens »
  alternative: « Judéens » ou, dans certains contextes, « autorités juives »
  rationale: Ici, « beaucoup de » désigne explicitement une partie du groupe et ne constitue pas une accusation globale contre tous les Juifs. Le texte principal garde le terme général sans imposer un sens géographique ou institutionnel plus étroit.
- issue: Portée de πιστεύω εἰς
  choice: « croyaient en Jésus »
  alternative: « mettaient leur foi en Jésus » ou « plaçaient leur confiance en Jésus »
  rationale: La formulation exprime une foi dirigée vers Jésus, mais le verset ne précise pas à lui seul toutes ses implications théologiques; la traduction évite donc de paraphraser par « devenaient disciples » ou « étaient sauvés ».
translation_notes:
  register: Français international moderne, naturel et digne. La tournure initiale « car » relie le verset au projet meurtrier du verset 10. L’ordre « à cause de lui » évite une formulation lourde tout en rendant clairement la causalité; le pronom renvoie à Lazare dans le contexte.
