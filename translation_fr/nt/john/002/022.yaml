id: JHN.2.22
reference: John 2:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: fr
  text: Ainsi, lorsqu’il fut ressuscité d’entre les morts[a], ses disciples se souvinrent qu’il avait dit cela[b], et ils crurent à l’Écriture et à la parole[c] que Jésus avait prononcée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il ressuscita d’entre les morts ». Le verbe grec est au passif (« fut ressuscité »), forme conservée dans le texte.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « qu’il disait cela ». L’imparfait grec peut présenter la parole dans son déroulement ou comme répétée, mais il peut aussi renvoyer ici au propos tenu auparavant.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « déclaration » ou « message ». Le terme grec peut désigner une parole prononcée, une déclaration ou un message.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Ainsi, quand
  rationale: « Quand » introduit la proposition temporelle, tandis que « ainsi » rend la continuité et la conséquence narratives exprimées par οὖν dans un français naturel.
- source_word: ἠγέρθη
  choice: il eut été ressuscité
  rationale: Le passif aoriste est conservé. Le passé antérieur situe clairement la résurrection avant le souvenir et la foi des disciples, dans une narration au passé.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Cette expression française consacrée rend naturellement la construction grecque au pluriel et son sens résurrectionnel.
- source_word: ἐμνήσθησαν
  choice: se souvinrent
  rationale: Le verbe indique que les disciples se rappelèrent alors les paroles antérieures de Jésus.
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: qu’il avait dit cela
  rationale: Le plus-que-parfait marque l’antériorité de la parole de Jésus. Dans ce contexte, l’imparfait grec renvoie au propos tenu précédemment sans exiger en français l’idée d’une répétition.
- source_word: ἐπίστευσαν
  choice: ils crurent à
  rationale: « Croire à » convient aux objets au datif et exprime qu’ils tinrent pour vrais l’Écriture et la parole de Jésus, sans ajouter une notion interprétative de confiance personnelle.
- source_word: τῇ γραφῇ
  choice: l’Écriture
  rationale: Le singulier grec désigne ici l’Écriture sainte comme témoignage faisant autorité; le singulier est donc conservé.
- source_word: τῷ λόγῳ
  choice: la parole
  rationale: Dans ce contexte, λόγος désigne la parole prononcée par Jésus. « Parole » conserve la portée du terme et convient au registre johannique.
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: que Jésus avait prononcée
  rationale: La proposition relative qualifie « la parole ». « Avait prononcée » exprime naturellement en français son antériorité par rapport au souvenir des disciples.
theological_decisions:
- issue: Voix du verbe de résurrection
  choice: il eut été ressuscité d’entre les morts
  alternative: il ressuscita d’entre les morts
  rationale: Le texte grec emploie un passif. Le conserver respecte la formulation du passage sans préciser explicitement l’agent ni nier les formulations actives présentes ailleurs.
- issue: Sens de πιστεύω avec des compléments au datif
  choice: ils crurent à l’Écriture et à la parole
  alternative: ils mirent leur foi dans l’Écriture et dans la parole
  rationale: « Crurent à » traduit sobrement l’adhésion à la vérité de ce que disent l’Écriture et Jésus, sans développer le verbe en une formule théologique plus chargée.
- issue: Valeur de l’imparfait ἔλεγεν
  choice: qu’il avait dit cela
  alternative: qu’il disait cela
  rationale: Le contexte renvoie à une déclaration antérieure précise. Le français naturel privilégie ici le plus-que-parfait; la note conserve la possibilité de rendre plus directement l’aspect imperfectif.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé antérieur convient à la séquence narrative et maintient clairement l’antériorité de la résurrection; le vocabulaire « Écriture », « parole » et « ressuscité » reste accessible tout en conservant le registre biblique.
