source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: fr
  text: 'Les Juifs[a] lui répondirent donc : « Quel signe nous montres-tu à l’appui de ce que tu fais ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les chefs juifs » ou « les Judéens ». Dans l’Évangile selon Jean, l’expression « les Juifs » peut désigner plus précisément un groupe représentatif, notamment les autorités de Judée, selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν … καὶ εἶπαν αὐτῷ
  choice: lui répondirent
  rationale: En grec, la formule associe littéralement « répondirent » et « dirent ». En français actuel, « lui répondirent » introduit naturellement les paroles qui suivent sans reproduire une redondance narrative peu idiomatique.
- source_word: οὖν
  choice: donc
  rationale: Le terme relie cette réaction à l’intervention de Jésus dans le temple et en conserve la progression logique et narrative.
- source_word: οἱ Ἰουδαῖοι
  choice: Les Juifs
  rationale: C’est le rendu direct de l’expression grecque. Le contexte peut viser plus précisément des représentants ou des autorités judéennes, mais le verset ne les désigne pas explicitement ainsi ; cette nuance est donc signalée en note.
- source_word: Τί σημεῖον
  choice: Quel signe
  rationale: Dans Jean, σημεῖον désigne un acte qui manifeste et authentifie une réalité au-delà de lui-même. « Signe » préserve ce vocabulaire caractéristique, contrairement à « miracle » ou « preuve ».
- source_word: δεικνύεις ἡμῖν
  choice: nous montres-tu
  rationale: Rendu direct du présent de δείκνυμι et du datif ἡμῖν, sous une forme interrogative naturelle en français.
- source_word: ὅτι ταῦτα ποιεῖς
  choice: pour agir ainsi
  rationale: La tournure française exprime de manière concise le lien entre la demande d’un signe et les actes que Jésus vient d’accomplir. « Ainsi » reprend naturellement le pluriel ταῦτα sans réduire la référence à un seul geste.
theological_decisions:
- issue: Référent de l’expression « les Juifs » dans l’Évangile selon Jean
  choice: Conserver « Les Juifs » dans le texte principal
  alternative: « les chefs juifs » ou « les Judéens »
  rationale: L’expression johannique peut désigner, selon le contexte, un groupe représentatif, notamment les autorités de Judée, plutôt que l’ensemble du peuple juif. Toutefois, le grec de ce verset ne précise pas lui-même cette restriction ; la traduction directe est donc maintenue, accompagnée d’une note qui prévient une généralisation abusive.
- issue: Portée de ὅτι dans la demande d’un signe
  choice: « pour agir ainsi »
  alternative: « puisque tu agis ainsi » ou « pour prouver que tu as le droit d’agir ainsi »
  rationale: La formulation retenue conserve le rapport entre le signe exigé et l’action de Jésus sans préciser outre mesure si le signe doit prouver son droit, son autorité ou son identité. Elle préserve ainsi la relative concision et l’ouverture de la formulation grecque.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond à l’adresse directe au singulier. La syntaxe reste concise et orale, tout en conservant le terme johannique important « signe ».
