    issue: « pour agir ainsi » pour ὅτι ταῦτα ποιεῖς
    rationale: Cette tournure française exprime normalement un but (« afin d’agir ainsi »), alors que ὅτι introduit ici le fait/les actes qui motivent la demande de signe. Elle atténue aussi le pluriel explicite ταῦτα (« ces choses »).
