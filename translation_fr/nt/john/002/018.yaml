revisions:
- from: 'Les Juifs[a] lui répondirent donc : « Quel signe nous montres-tu pour agir ainsi ? »'
  to: 'Les Juifs[a] lui répondirent donc : « Quel signe nous montres-tu à l’appui de ce que tu fais ? »'
  rationale: La révision remplace une construction finale ambiguë par « à l’appui de ce que tu fais », qui exprime naturellement la demande d’un signe authentifiant les actes de Jésus. Elle ne tranche pas au-delà du grec la nature exacte de l’authentification demandée (autorité, droit ou identité) et maintient le pluriel sémantique de ταῦτα par « ce que tu fais ».
  reviewer_model: gpt-5.6-terra
