review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement ἀπεκρίθησαν, οὖν, οἱ Ἰουδαῖοι, σημεῖον et δεικνύεις ἡμῖν. En revanche, « pour agir ainsi » transforme la proposition introduite par ὅτι en infinitif final et peut faire entendre que le signe est requis afin de pouvoir agir. Le grec rattache plutôt la demande de signe aux actes que Jésus accomplit.
  naturalness: La formulation est globalement fluide et de registre moderne. « Quel signe nous montres-tu à l’appui de ce que tu fais ? » est idiomatique et rend clairement, sans lourdeur, le lien entre le signe demandé et les actions en question.
  terminology: « Les Juifs » conserve le libellé grec, avec une note contextuelle équilibrée qui évite une généralisation indue. « Signe » préserve le vocabulaire johannique. La note est bien ancrée à « Juifs » et ne nécessite pas de modification.
  issues:
