  text: καὶ λέγει αὐτοῖς· Ἀντλήσατε νῦν καὶ φέρετε τῷ ἀρχιτρικλίνῳ· ⸂οἱ δὲ⸃ ἤνεγκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: fr
  text: 'Puis il leur dit : « Puisez-en maintenant et portez-en au responsable du banquet[a]. » Ils lui en apportèrent donc.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au maître du repas », « au maître d’hôtel » ou « à l’intendant ». Le terme grec désigne la personne chargée du banquet.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: il leur dit
  rationale: Le présent grec est un présent historique fréquent dans le récit; le passé simple français rend naturellement la progression narrative.
- source_word: Ἀντλήσατε
  choice: Puisez-en
  rationale: L’impératif désigne l’action de puiser un liquide. Le pronom « en » reprend naturellement, sans la nommer, l’eau évoquée dans le contexte.
- source_word: νῦν
  choice: maintenant
  rationale: Rend directement l’adverbe temporel et l’immédiateté de l’ordre.
- source_word: φέρετε
  choice: portez-en
  rationale: Le verbe exprime ici le transport du liquide jusqu’à une personne; « porter » conserve mieux que « apporter » la neutralité du point de vue grec.
- source_word: ἀρχιτρικλίνῳ
  choice: au responsable du banquet
  rationale: Le terme désigne la personne chargée de superviser le banquet. Cette formulation est claire, actuelle et suffisamment large pour ne pas préciser indûment sa fonction exacte.
- source_word: οἱ δὲ ἤνεγκαν
  choice: Ils lui en apportèrent donc
  rationale: δέ est ici un lien narratif léger, rendu par « donc ». Le changement de « porter » à « apporter » est naturel en français une fois la destination exprimée; « lui » et « en » explicitent les compléments clairement fournis par le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque; « responsable du banquet » évite à la fois un terme technique obscur et une fonction moderne trop précise.
