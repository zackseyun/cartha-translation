id: JHN.2.19
reference: John 2:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: fr
  text: 'Jésus leur répondit : « Détruisez ce temple, et en trois jours je le relèverai[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « Démolissez ce temple… je le reconstruirai. » Le verbe grec rendu par « relèverai » peut, dans ce contexte, évoquer la résurrection ; Jean précise ensuite que Jésus parlait du temple de son corps (2.21).'
    reason: Alternative lexicale et maintien du double sens de ἐγείρω.
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: répondit
  rationale: La tournure grecque, influencée par un idiome sémitique, associe littéralement « répondit » et « dit ». En français actuel, « leur répondit » en rend naturellement la fonction sans lourdeur.
- source_word: Λύσατε
  choice: Détruisez
  rationale: Dans ce contexte, λύω désigne la destruction ou la démolition du temple, et non le simple fait de délier.
- source_word: τὸν ναὸν τοῦτον
  choice: ce temple
  rationale: « Temple » est naturel et compréhensible en français, tandis que le démonstratif conserve le caractère immédiat et énigmatique de la parole.
- source_word: ἐν τρισὶν ἡμέραις
  choice: en trois jours
  rationale: Cette expression temporelle française correspond directement au grec sans préciser indûment s'il s'agit de « dans » ou de « sous » trois jours.
- source_word: ἐγερῶ αὐτόν
  choice: je le relèverai
  rationale: « Relever » peut s'entendre de la remise debout d'un édifice tout en conservant un écho possible au relèvement d'entre les morts. Le pronom « le » reprend naturellement « temple ».
theological_decisions:
- issue: Faut-il identifier explicitement le temple au corps de Jésus dans ce verset ?
  choice: Conserver « ce temple » sans explication dans le texte principal.
  alternative: « ce temple, c’est-à-dire mon corps »
  rationale: La parole demeure volontairement énigmatique ici ; Jean n'en donne l'explication qu'au verset 21. L'expliciter dès maintenant supprimerait la tension narrative.
- issue: Faut-il rendre ἐγερῶ par un terme architectural ou par un terme évoquant la résurrection ?
  choice: « je le relèverai »
  alternative: « je le reconstruirai »
  rationale: Le choix principal reste intelligible dans l'image du temple tout en préservant l'écho au relèvement d'entre les morts que le contexte johannique fait apparaître.
translation_notes:
  register: Français international moderne, sobre et digne. La formulation évite le calque lourd « répondit et leur dit », tout en conservant l'énigme et le double sens central de la parole.
