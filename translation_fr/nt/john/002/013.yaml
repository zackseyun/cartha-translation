source:
  edition: SBLGNT
  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: fr
  text: La Pâque des Juifs était proche[a], et Jésus monta à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la Pâque des Judéens ». Dans l’Évangile selon Jean, le mot grec traduit par « Juifs » peut, dans certains contextes, désigner les « Judéens »; ici, il désigne très probablement la fête juive.'
    reason: Alternative lexicale liée à l’étendue sémantique de Ἰουδαῖοι.
lexical_decisions:
- source_word: ἐγγὺς
  choice: était proche
  rationale: L’adverbe exprime ici la proximité dans le temps. Cette formulation est naturelle en français moderne et conserve la simplicité du grec.
- source_word: πάσχα
  choice: la Pâque
  rationale: Désignation française courante de la fête juive commémorant la sortie d’Égypte.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Dans cette expression, le terme identifie naturellement la Pâque comme fête juive. « Des Judéens » reste lexicalement possible et figure donc en note.
- source_word: ἀνέβη
  choice: monta
  rationale: Le verbe évoque le déplacement vers Jérusalem, située en hauteur, et conserve le langage traditionnel du pèlerinage sans ajout explicatif.
- source_word: εἰς Ἱεροσόλυμα
  choice: à Jérusalem
  rationale: Formulation idiomatique française indiquant la destination.
- source_word: Καὶ … καὶ
  choice: '[premier καί non explicité] … et'
  rationale: Le premier καί assure la continuité narrative et n’a pas besoin d’être rendu mécaniquement en français; le second relie naturellement les deux propositions par « et ».
theological_decisions:
- issue: Sens de Ἰουδαίων dans l’Évangile selon Jean
  choice: des Juifs
  alternative: des Judéens
  rationale: Ici, le mot qualifie une fête reconnue comme juive plutôt qu’un groupe régional ou polémique précis. La variante « des Judéens » est néanmoins conservée en note afin de respecter la portée possible du terme grec.
translation_notes:
  register: Français international moderne, simple et digne. « Monta à Jérusalem » préserve l’image géographique et le langage du pèlerinage. Aucun marqueur discursif artificiel n’est ajouté au début du verset.
