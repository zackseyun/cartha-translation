  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: fr
  text: Quand le responsable du repas goûta l’eau devenue du vin[a], il ne savait pas d’où venait ce vin (mais les serviteurs qui avaient puisé l’eau le savaient) ; le responsable du repas appelle le marié[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « l’eau étant devenue du vin » ; autre traduction possible : « l’eau changée en vin ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie ici un présent historique : « appelle » ; on pourrait aussi traduire au passé : « appela ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: responsable du repas
  rationale: Le terme désigne celui qui supervise le banquet. Cette formulation naturelle garde la fonction générale sans la réduire à celle d’un maître d’hôtel.
- source_word: ἐγεύσατο
  choice: goûta
  rationale: Le verbe désigne directement l’action de goûter; le passé simple convient au registre narratif biblique tout en restant clair.
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: l’eau devenue du vin
  rationale: Le participe parfait exprime un changement d’état accompli dont le résultat demeure. Cette formulation concise préserve explicitement la transformation.
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: il ne savait pas d’où elle venait
  rationale: πόθεν indique l’origine; le pronom féminin reprend naturellement « l’eau » en français.
- source_word: διάκονοι
  choice: serviteurs
  rationale: Dans ce contexte de banquet, le mot désigne des personnes chargées du service, et non une fonction ecclésiale.
- source_word: ἠντληκότες
  choice: avaient puisé
  rationale: Le participe indique qu’ils avaient puisé l’eau auparavant; « puiser » est le verbe français précis et idiomatique.
- source_word: φωνεῖ
  choice: appelle
  rationale: Le présent français conserve le présent historique du récit grec et sa vivacité.
- source_word: νυμφίον
  choice: marié
  rationale: Dans ce contexte concret de noces, « marié » est le terme courant en français moderne; « époux » serait plus littéraire et potentiellement chargé d’autres résonances.
- source_word: ὡς δὲ
  choice: Quand
  rationale: La conjonction introduit l’événement suivant. « Quand » rend naturellement la relation temporelle sans ajouter un marqueur comme « alors » absent du texte.
theological_decisions:
- issue: Description narrative du miracle
  choice: Rendre explicitement que l’eau était devenue du vin.
  alternative: Employer une tournure plus imagée comme « l’eau changée en vin » ou affaiblir l’énoncé en simple apparence.
  rationale: Le grec affirme un changement d’état accompli. La traduction ne doit ni amplifier doctrinalement l’énoncé ni réduire la transformation à une perception.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple porte la narration, tandis que « appelle » conserve volontairement le présent historique grec. Les tirets isolent l’explication parenthétique sans modifier la progression de la phrase.
