id: JHN.2.24
reference: John 2:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: fr
  text: Mais Jésus, lui, ne se fiait pas à eux[a], parce qu’il connaissait tout le monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie le même verbe qu’au verset précédent : beaucoup avaient « cru en » Jésus, mais Jésus, lui, ne « se fiait pas à » eux.'
    reason: La note rend visible le jeu de mots grec que le français ne peut reproduire naturellement avec un seul verbe.
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: Mais Jésus, lui
  rationale: Le pronom αὐτός est emphatique et δέ introduit un contraste avec les nombreuses personnes mentionnées au verset précédent. La tournure française « Jésus, lui » rend naturellement cette insistance.
- source_word: οὐκ ἐπίστευεν
  choice: ne se fiait pas
  rationale: Avec le pronom réfléchi et le datif qui suivent, πιστεύω exprime ici le fait de se fier à quelqu’un ou de se remettre à lui, plutôt que simplement de croire. L’imparfait français conserve la valeur durative ou habituelle de l’imparfait grec.
- source_word: αὑτὸν αὐτοῖς
  choice: à eux
  rationale: En français, « se fier à eux » exprime idiomatiquement la relation portée par le réfléchi grec αὑτόν et le datif αὐτοῖς, sans la lourdeur de « ne leur confiait pas sa personne ».
- source_word: διὰ τὸ
  choice: parce que
  rationale: διά suivi de l’infinitif articulé a ici une valeur causale, rendue clairement et naturellement par « parce que ».
- source_word: αὐτὸν γινώσκειν
  choice: il connaissait
  rationale: La proposition infinitive grecque devient naturellement une proposition verbale en français. Dans ce contexte, γινώσκω désigne une connaissance réelle des personnes.
- source_word: πάντας
  choice: tout le monde
  rationale: Le masculin pluriel désigne ici l’ensemble des personnes. « Tout le monde » est une formulation française courante, inclusive et générale, sans limiter le propos à un groupe précis.
theological_decisions:
- issue: Rendre le lien lexical de πιστεύω entre les versets 23 et 24
  choice: Employer « croire » au verset 23 et « se fier à » au verset 24, tout en signalant dans une note qu’il s’agit du même verbe grec.
  alternative: Répéter « croire » dans les deux versets, ou employer « se confier à » au verset 24.
  rationale: 'Le grec produit un contraste délibéré : beaucoup ont cru en Jésus, mais Jésus ne se fiait pas à eux. Une répétition stricte du même verbe serait peu naturelle ou trompeuse en français; la note préserve le jeu lexical sans sacrifier le sens contextuel.'
- issue: Portée de πάντας
  choice: Le rendre généralement par « tout le monde ».
  alternative: « tous les hommes », « tous » ou « toutes ces personnes ».
  rationale: Le texte affirme que Jésus connaissait les personnes en général, sans restreindre πάντας aux seuls croyants superficiels mentionnés juste avant ni développer davantage la portée doctrinale de cette connaissance.
translation_notes:
  register: Français moderne, international et digne. « Jésus, lui » marque clairement le contraste; « ne se fiait pas » reste naturel et accessible. La virgule finale de la couche anglaise n’est pas reproduite, le verset formant ici une phrase française complète.
