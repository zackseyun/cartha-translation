  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: fr
  text: Mais lui parlait du temple de son corps[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du sanctuaire de son corps » ; le mot grec naos désigne souvent plus précisément le sanctuaire que l’ensemble du complexe du temple.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: lui
  rationale: Le pronom disjoint reprend Jésus et marque naturellement le léger contraste porté par la tournure grecque.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction introduit un contraste modéré avec la compréhension littérale exprimée au verset précédent.
- source_word: ἔλεγεν
  choice: parlait
  rationale: L’imparfait français rend l’aspect descriptif de l’imparfait grec sans recourir à l’interprétatif « voulait dire ».
- source_word: περὶ
  choice: de
  rationale: Avec « parler », la préposition française « de » exprime naturellement le sujet dont il était question.
- source_word: ναοῦ
  choice: temple
  rationale: « Temple » est le terme français courant et digne; la nuance plus précise de sanctuaire intérieur est signalée en note.
- source_word: σώματος
  choice: corps
  rationale: Le mot rend directement σῶμα et conserve l’importante identification métaphorique du corps de Jésus.
- source_word: αὐτοῦ
  choice: son
  rationale: Le possessif indique sans ambiguïté qu’il s’agit du propre corps de Jésus.
theological_decisions:
- issue: Identification métaphorique du corps de Jésus au temple
  choice: « du temple qu’était son corps »
  alternative: « du temple de son corps »
  rationale: Cette formulation conserve l’identification métaphorique tout en évitant en français l’ambiguïté selon laquelle le temple ne serait qu’une partie ou une propriété du corps. Elle n’ajoute aucune explication doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait garde la valeur descriptive du grec; « lui » et « mais » rendent ensemble le contraste avec le malentendu précédent.
