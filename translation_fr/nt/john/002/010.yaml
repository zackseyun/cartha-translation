id: JHN.2.10
reference: John 2:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: fr
  text: 'Et il lui dit : « Tout le monde sert d’abord le bon vin et, quand les convives se sont enivrés[a], le moins bon. Mais toi, tu as gardé le bon vin jusqu’à maintenant. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sont devenus ivres ». Le verbe grec signifie normalement « devenir ivre »; certaines traductions l’atténuent en « avoir beaucoup bu ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: il lui dit
  rationale: Le présent grec est un présent historique. Le présent de narration est naturel en français et conserve la vivacité du récit.
- source_word: Πᾶς ἄνθρωπος
  choice: Tout le monde
  rationale: Cette expression générique désigne les gens en général, et non les hommes exclusivement. « Tout le monde » est idiomatique et inclusif en français moderne.
- source_word: τὸν καλὸν οἶνον
  choice: le bon vin
  rationale: καλός qualifie ici la qualité du vin. « Le bon vin » rend directement le contraste avec le vin de qualité moindre.
- source_word: τίθησιν
  choice: sert
  rationale: Dans le contexte d’un repas de noces, « sert » exprime naturellement l’action de mettre le vin à la disposition des convives.
- source_word: ὅταν μεθυσθῶσιν
  choice: quand les convives se sont enivrés
  rationale: Le verbe μεθύω désigne normalement le fait de devenir ivre. Le sujet implicite est explicité par « les convives » pour assurer la clarté en français, sans atténuer le sens du grec.
- source_word: τὸν ἐλάσσω
  choice: le moins bon
  rationale: Le comparatif substantivé signifie le vin inférieur en qualité. « Le moins bon » reprend naturellement le nom « vin » sous-entendu sans suggérer nécessairement un prix inférieur.
- source_word: τετήρηκας
  choice: tu as gardé
  rationale: Le parfait grec présente une action passée dont le résultat demeure au moment où l’on parle. Le passé composé français convient naturellement ici.
- source_word: ἕως ἄρτι
  choice: jusqu’à maintenant
  rationale: L’expression désigne précisément le moment présent dans le récit.
theological_decisions:
- issue: Sens de μεθυσθῶσιν dans un récit de miracle où il est question de vin
  choice: Conserver le sens explicite « se sont enivrés »
  alternative: « ont beaucoup bu » ou « ont assez bu »
  rationale: Le verbe grec évoque normalement l’ivresse. La phrase rapporte une observation sociale du maître du repas sans pour autant approuver l’ivrognerie; l’atténuer résoudrait artificiellement la tension du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Tout le monde » rend le singulier générique sans restriction masculine. « Le moins bon » conserve le contraste de qualité sans ajouter l’idée de prix. Le discours direct reste fluide tout en maintenant l’affirmation explicite concernant l’ivresse.
