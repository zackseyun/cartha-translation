id: JHN.2.20
reference: John 2:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: fr
  text: 'Les Juifs[a] lui dirent donc : « Il a fallu quarante-six ans pour construire ce temple, et toi, tu le relèveras en trois jours[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens ». Dans l’Évangile selon Jean, l’expression grecque traduite par « les Juifs » désigne des groupes différents selon le contexte.
    reason: alternative_reading
  - marker: b
    text: Ou « tu le reconstruiras ». Le verbe grec peut être compris ici au sens de remettre un édifice debout, mais « relever » préserve le lien que Jean établit ensuite avec la résurrection de Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement en français la conséquence de la déclaration précédente de Jésus.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Reproduit le référent explicite du grec sans le restreindre aux seuls chefs; une note signale la valeur contextuelle possible « les Judéens ».
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη
  choice: Il a fallu quarante-six ans pour construire
  rationale: Rend idiomatiquement la durée exprimée par le datif et le bilan de construction porté par l’aoriste passif, sans suggérer que le temple avait été achevé quarante-six ans auparavant.
- source_word: ὁ ναὸς οὗτος
  choice: ce temple
  rationale: « Temple » est clair et naturel; bien que ναός puisse désigner plus précisément le sanctuaire, le contexte n’exige pas ici un terme technique.
- source_word: καὶ σὺ
  choice: et toi, tu
  rationale: La dislocation française fait entendre l’insistance sur σὺ et l’incrédulité des interlocuteurs.
- source_word: ἐν τρισὶν ἡμέραις
  choice: en trois jours
  rationale: Expression temporelle directe qui conserve la formulation reprise dans l’interprétation pascale du récit.
- source_word: ἐγερεῖς
  choice: tu le relèveras
  rationale: « Relever » convient à un édifice tout en maintenant le lien lexical et l’ambiguïté avec le relèvement d’un mort, explicités au verset suivant.
theological_decisions:
- issue: Risque de généralisation antijuive de οἱ Ἰουδαῖοι dans Jean
  choice: Conserver « les Juifs » dans le texte avec une note contextuelle
  alternative: « les Judéens » ou « les autorités juives »
  rationale: Le grec ne précise pas ici « les autorités »; la note prévient une lecture englobant tous les Juifs et rappelle que l’expression varie selon le contexte johannique.
- issue: Lien de ἐγερεῖς avec la résurrection
  choice: Employer « tu le relèveras »
  alternative: « tu le reconstruiras »
  rationale: 'Cette formulation préserve l’ironie narrative : les interlocuteurs comprennent un édifice, tandis que la suite rapporte les paroles de Jésus à son corps et à son relèvement.'
translation_notes:
  register: Français international actuel, digne et oralement fluide. La tournure « Il a fallu… pour construire » exprime clairement la durée, tandis que « et toi, tu » conserve le ton incrédule de la question. Tous les appels de note figurent dans le texte.
