  source_fidelity: 'Le texte rend fidèlement la structure et le sens du grec : οὖν (« donc »), οἱ Ἰουδαῖοι (« les Juifs »), la durée de quarante-six ans, l’insistance de καὶ σύ (« et toi, tu »), et la question rhétorique sont tous préservés. « Il a fallu quarante-six ans pour construire ce temple » est une reformulation française idiomatique qui exprime convenablement la durée associée à οἰκοδομήθη sans imposer une datation plus précise. « Tu le relèveras » conserve à bon droit l’ambiguïté narrative de ἐγερεῖς.'
  naturalness: Le français est actuel, clair et fluide. La dislocation « et toi, tu » rend naturellement l’emphase incrédule du grec. Le registre convient à un récit évangélique sans archaïsme.
