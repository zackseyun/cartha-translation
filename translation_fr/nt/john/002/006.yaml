  text: ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: fr
  text: Il y avait là six jarres de pierre, destinées aux rites de purification des Juifs[a], qui pouvaient chacune contenir deux ou trois mesures[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « conformément à la pratique de purification des Juifs ». Il s’agit de pratiques de purification rituelle.'
    reason: lexical_alternative
  - marker: b
    text: La « mesure » (grec metrētēs) était une ancienne unité de capacité pour les liquides, équivalant approximativement à 35–40 litres.
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ
  choice: se trouvaient là
  rationale: Cette formulation rend naturellement l’existence et la localisation des jarres. Le léger enchaînement marqué par δέ n’exige pas de connecteur explicite en français.
- source_word: λίθιναι ὑδρίαι
  choice: jarres de pierre
  rationale: λίθιναι indique le matériau, et ὑδρίαι désigne des récipients servant normalement à contenir de l’eau. « Jarres de pierre » est précis et naturel en français moderne.
- source_word: ἓξ
  choice: six
  rationale: Rendu direct du nombre cardinal.
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: pour les rites de purification des Juifs
  rationale: Dans ce contexte, καθαρισμός renvoie à une purification rituelle. « Pour » exprime le rapport fonctionnel probable entre les jarres et cette pratique, tandis que la note conserve la nuance possible de conformité exprimée par κατά.
- source_word: κείμεναι
  choice: disposées
  rationale: Le participe indique que les jarres étaient placées ou installées là. « Disposées » convient à des récipients posés à un endroit en vue d’un usage.
- source_word: χωροῦσαι
  choice: avait une capacité de
  rationale: Le verbe exprime ici la contenance des jarres plutôt que leur contenu effectif.
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: deux ou trois mesures chacune
  rationale: ἀνά a une valeur distributive, rendue par « chacune ». Le nom de l’unité antique est conservé de façon générique dans le texte, avec une estimation moderne en note.
theological_decisions:
- issue: Sens de τῶν Ἰουδαίων dans le récit johannique
  choice: des Juifs
  alternative: des Judéens
  rationale: La phrase vise ici des pratiques religieuses reconnues, non une origine régionale. « Des Juifs » rend donc le sens culturel et religieux sans ajouter de portée polémique.
- issue: Rapport exprimé par κατά entre les jarres et la purification
  choice: pour les rites de purification
  alternative: conformément à la pratique de purification
  rationale: Le contexte suggère que ces jarres étaient disposées en vue des ablutions rituelles, mais κατά peut aussi souligner leur conformité à la coutume. La traduction principale retient la fonction probable et la note signale l’autre nuance.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste proche de la structure grecque tout en évitant une tournure pesante. Le point-virgule distingue la présence et la fonction des jarres de l’indication de leur capacité.
