  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: fr
  text: Après cela, il descendit à Capernaüm, avec sa mère, ses frères[a] et ses disciples. Ils y restèrent peu de jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses proches parents » ou « des membres de sa parenté » ; le mot grec peut désigner des frères au sens strict ou, dans certains contextes, une relation familiale plus large.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: Après cela
  rationale: Transition temporelle naturelle qui conserve la valeur du démonstratif singulier.
- source_word: κατέβη
  choice: il descendit
  rationale: Le verbe exprime un déplacement vers le bas; «descendit» convient au mouvement géographique de Cana vers Capernaüm.
- source_word: εἰς Καφαρναοὺμ
  choice: à Capernaüm
  rationale: En français, la préposition «à» marque naturellement la destination devant un nom de ville.
- source_word: αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ
  choice: avec sa mère, ses frères et ses disciples
  rationale: «Avec» rend naturellement la coordination grecque qui énumère les personnes accompagnant Jésus, sans donner au pronom αὐτός une insistance indue.
- source_word: οἱ ἀδελφοὶ
  choice: ses frères
  rationale: Le masculin pluriel ἀδελφοί désigne le plus directement des frères, tout en pouvant avoir selon le contexte un sens familial plus large, signalé en note.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: «Disciples» est le terme évangélique courant et conserve les idées d'apprentissage et d'attachement au maître.
- source_word: ἐκεῖ ἔμειναν
  choice: Ils y restèrent
  rationale: Le pluriel inclut tout le groupe; «y restèrent» est idiomatique et dignifié.
- source_word: οὐ πολλὰς ἡμέρας
  choice: peu de jours
  rationale: Expression française naturelle équivalant à la litote grecque «pas beaucoup de jours», sans ajouter la nuance restrictive de «seulement».
theological_decisions:
- issue: Lien familial exprimé par ἀδελφοί
  choice: «frères» dans le texte principal
  alternative: «parents» ou «membres de sa parenté»
  rationale: Le sens direct du masculin pluriel est «frères», mais le mot peut, dans certains contextes, désigner une parenté plus large. La note préserve cette possibilité sans trancher un débat doctrinal ultérieur.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit; la syntaxe a été légèrement allégée par «avec» et par une seconde phrase afin d'éviter une coordination lourde.
