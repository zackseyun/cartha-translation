  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: fr
  text: 'Comme le vin venait à manquer[a], la mère de Jésus lui dit[b] : « Ils n’ont plus de vin. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « le vin ayant manqué » ou « alors que le vin faisait défaut ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie ici le présent historique : « dit » au sens de « elle dit ». En français, la forme est comprise ici comme un passé simple.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: Comme le vin venait à manquer
  rationale: Le génitif absolu avec participe aoriste exprime la circonstance liée à la parole qui suit. « Venait à manquer » est naturel en français et conserve l’idée de pénurie sans imposer que tout le vin avait déjà entièrement disparu.
- source_word: λέγει
  choice: dit
  rationale: Il s’agit d’un présent historique grec. Le passé simple convient mieux à la narration française courante, tandis qu’une note signale la forme du texte source.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: la mère de Jésus
  rationale: Cette formulation suit de près le grec et conserve la manière caractéristique dont Jean la désigne dans ce contexte.
- source_word: πρὸς αὐτόν
  choice: lui
  rationale: Avec le verbe de parole, le pronom indirect « lui » rend naturellement πρὸς αὐτόν en français.
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: Ils n’ont plus de vin
  rationale: Le sujet pluriel demeure non précisé, comme en grec. Dans le contexte de la pénurie qui survient, « ne… plus » exprime idiomatiquement qu’ils se trouvent désormais sans vin.
- source_word: οἶνος
  choice: vin
  rationale: « Vin » est le sens ordinaire du terme grec et rien dans le contexte ne justifie de l’atténuer ou de le paraphraser.
theological_decisions:
- issue: Présent historique dans la narration johannique
  choice: Employer le passé simple « dit » dans le texte et signaler le présent grec en note
  alternative: 'Conserver le présent historique : « dit » au présent (même forme graphique), compris comme « elle dit » dans une narration au présent'
  rationale: La forme française « dit » est graphiquement ambiguë entre présent et passé simple. Dans cette phrase introduite par « venait », elle se lit naturellement comme un passé simple; la note préserve explicitement la texture du grec sans produire une narration française heurtée.
- issue: Référent du sujet pluriel implicite dans Οἶνον οὐκ ἔχουσιν
  choice: Conserver le pronom non précisé « ils »
  alternative: Expliciter « les organisateurs du mariage » ou « les gens de la noce »
  rationale: Le grec ne nomme pas le référent. Garder « ils » préserve cette indétermination et évite d’ajouter une identification absente du texte.
- issue: Portée de la pénurie de vin
  choice: Formuler « venait à manquer » puis « n’ont plus de vin »
  alternative: « le vin manqua » / « ils n’ont pas de vin »
  rationale: La formulation française rend naturellement la situation sans tirer de conclusion théologique ni préciser au-delà du contexte les causes ou les responsables de la pénurie.
translation_notes:
  register: Français international moderne, naturel et digne. Le tour « venait à manquer » évite une littéralité raide; « ils » conserve l’ambiguïté référentielle du grec. Les deux appels de note [a] et [b] figurent dans le texte.
