source:
  edition: SBLGNT
  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: fr
  text: 'Ses disciples se souvinrent qu’il est écrit[a] : « Le zèle pour ta maison me dévorera. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « m’a dévoré », reflétant la formulation du Psaume 69.10 dans certaines traditions textuelles ; le grec de Jean porte ici : « me dévorera ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: se souvinrent
  rationale: L’aoriste déponent de μιμνῄσκομαι exprime ici le fait que les disciples se rappelèrent le texte biblique. « Se souvinrent » est direct, naturel et digne en français.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: « Disciples » est le terme français usuel pour μαθηταί, et le possessif rend naturellement αὐτοῦ.
- source_word: γεγραμμένον ἐστίν
  choice: il est écrit
  rationale: Formule consacrée introduisant une citation de l’Écriture; elle restitue naturellement la valeur résultative du parfait grec.
- source_word: ζῆλος
  choice: zèle
  rationale: « Zèle » conserve l’idée d’attachement ardent et la résonance biblique du terme, sans expliciter davantage que le grec.
- source_word: τοῦ οἴκου σου
  choice: pour ta maison
  rationale: Dans la construction française, « le zèle pour ta maison » exprime naturellement l’ardeur dont la maison de Dieu est l’objet. « Maison » préserve la formulation de la citation plutôt que de l’expliciter par « temple ».
- source_word: καταφάγεταί
  choice: dévorera
  rationale: Le futur de κατεσθίω est conservé. « Dévorera » restitue l’image forte et concrète du verbe grec, plus précisément que le plus abstrait « consumera » en français moderne.
- source_word: με
  choice: me
  rationale: Le pronom objet à la première personne est rendu directement et conserve la voix du locuteur du psaume telle qu’elle est appliquée ici.
theological_decisions:
- issue: Temps verbal de la citation du Psaume 69.10 (68.10 LXX) appliquée à Jésus
  choice: 'Conserver le futur : « me dévorera »'
  alternative: « m’a dévoré » ou « me dévore »
  rationale: Le texte grec de Jean porte explicitement le futur καταφάγεταί. La traduction suit donc Jean sans l’harmoniser avec les formes passées ou présentes attestées dans d’autres traditions textuelles ou traductions du psaume.
- issue: Référent de « maison » dans le contexte du Temple
  choice: Conserver « maison »
  alternative: Traduire explicitement par « temple »
  rationale: Même si le contexte désigne le Temple, οἶκος signifie ici « maison » dans la citation scripturaire. Garder ce mot préserve l’allusion et évite une explicitation interprétative inutile.
translation_notes:
  register: Français moderne international, naturel et digne. La syntaxe reste simple et accessible, tandis que la citation conserve sa force poétique et scripturaire. Aucun marqueur de note n’est requis puisqu’aucune note n’est ajoutée au texte français.
