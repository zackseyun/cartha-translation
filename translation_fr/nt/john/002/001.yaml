review_pass:
  verdict: revise
  source_fidelity: Le repère temporel, le lieu et la présence de la mère de Jésus sont bien rendus. Toutefois, dans ce contexte narratif, γάμος désigne plus naturellement les noces, c’est-à-dire l’événement célébré, que le mariage au sens du lien matrimonial; « des noces » préserve mieux cette portée.
  naturalness: « Et le troisième jour, il y eut des noces à Cana, en Galilée » est fluide en français international moderne tout en conservant le ton narratif sobre. « Là » est naturel et direct.
  terminology: « Noces » est le terme français le plus exact et le plus idiomatique ici. La note peut signaler « un mariage » comme possibilité plus générale, sans présenter la distinction comme tranchée.
  issues:
