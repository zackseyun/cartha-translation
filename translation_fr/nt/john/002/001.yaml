source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: fr
  text: Et le troisième jour, il y eut des noces[a] à Cana, en Galilée, et la mère de Jésus était là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un mariage » ou « une fête de mariage ». Le mot grec peut désigner le mariage ou les noces, c’est-à-dire la célébration.
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: omis explicitement
  rationale: En français, commencer par « Et » serait possible, mais plus lourd ici. L’enchaînement narratif est naturellement porté par « Le troisième jour » sans perte de sens.
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: Le troisième jour
  rationale: Rend directement le datif temporel et conserve la référence chronologique précise sans lui imposer une interprétation symbolique.
- source_word: γάμος
  choice: un mariage
  rationale: Terme français naturel et assez large pour désigner aussi bien les noces que leur célébration; l’autre possibilité est signalée en note.
- source_word: ἐγένετο
  choice: il y eut
  rationale: Tour narratif idiomatique qui présente simplement la tenue de l’événement.
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: à Cana, en Galilée
  rationale: Formulation géographique naturelle en français moderne; elle identifie Cana par sa région sans calquer maladroitement le génitif grec.
- source_word: ἦν
  choice: était
  rationale: L’imparfait fournit l’information d’arrière-plan et préserve la sobriété du grec.
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: la mère de Jésus
  rationale: Suit de près la construction grecque tout en gardant un registre français naturel et digne.
- source_word: ἐκεῖ
  choice: là
  rationale: Équivalent locatif direct, sans ajouter l’idée interprétative d’invitation ou de participation.
theological_decisions:
- issue: Portée de l’expression « le troisième jour »
  choice: Conserver une indication chronologique non interprétée
  alternative: Expliciter une allusion symbolique à la résurrection
  rationale: Le texte peut recevoir une lecture symbolique dans l’ensemble johannique, mais le verset formule d’abord un repère temporel. La traduction préserve cette éventuelle résonance sans l’intégrer explicitement.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe reste sobre, et l’ordre des propositions suit étroitement le récit grec. Aucun appel de note n’est ajouté après « Galilée », car la variante anglaise correspondante ne repose pas sur une ambiguïté réelle du texte grec.
