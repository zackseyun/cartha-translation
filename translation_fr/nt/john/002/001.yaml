    issue: « un mariage » est moins précis dans ce contexte
    rationale: En français courant, « un mariage » évoque volontiers l’acte ou l’institution matrimoniale. Le grec γάμος, dans le récit de Cana, vise naturellement les noces/la célébration. « Des noces » restitue mieux l’événement sans en préciser indûment les détails.
  - severity: low
    issue: Le connecteur Καὶ n’est pas représenté
    rationale: Son omission est possible en français, mais « Et » est parfaitement naturel en ouverture narrative et conserve plus clairement l’enchaînement du texte grec.
