source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: fr
  text: Lorsqu’il était à Jérusalem, pendant la fête de la Pâque, beaucoup crurent en son nom[a], en voyant les signes[b] qu’il accomplissait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « crurent en lui ». Littéralement : « crurent en son nom », expression propre à Jean qui souligne une confiance placée dans l’identité révélée de Jésus.'
    reason: lexical_alternative
  - marker: b
    text: Dans l’Évangile selon Jean, le mot « signes » désigne habituellement des œuvres qui renvoient au-delà d’elles-mêmes à l’identité de Jésus ; on peut aussi traduire par « signes miraculeux ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Pendant que
  rationale: Introduit la circonstance temporelle avec une légère continuité narrative, sans ajouter un adverbe tel que « maintenant » absent du grec.
- source_word: ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: il était à Jérusalem
  rationale: Expression locative naturelle en français moderne.
- source_word: ἐν τῷ πάσχα
  choice: à l’occasion de la Pâque
  rationale: Désigne ici la période de la fête de la Pâque et évite de réduire l’expression au seul repas pascal.
- source_word: ἐν τῇ ἑορτῇ
  choice: durant la fête
  rationale: Conserve la précision appositive et la répétition circonstancielle du grec dans une formulation française fluide.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: Rend simplement la quantité sans ajouter un nom qui reste implicite.
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: crurent en son nom
  rationale: Préserve l’expression johannique centrée sur le nom, plutôt que de la réduire silencieusement à « crurent en lui ».
- source_word: θεωροῦντες
  choice: en voyant
  rationale: Exprime l’observation qui accompagne et motive la foi; le français n’exige pas une périphrase progressive pour rendre naturellement le participe présent.
- source_word: τὰ σημεῖα
  choice: les signes
  rationale: Maintient le terme caractéristique de Jean, qui présente ces œuvres comme révélatrices de l’identité de Jésus, sans ajouter explicitement « miraculeux ».
- source_word: ἃ ἐποίει
  choice: qu’il accomplissait
  rationale: L’imparfait rend l’action en cours ou répétée; « accomplir un signe » est idiomatique et digne en français biblique moderne.
theological_decisions:
- issue: Nature de la foi exprimée par ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: Affirmer sans l’affaiblir que beaucoup « crurent en son nom ».
  alternative: Qualifier dès ce verset cette foi d’initiale, superficielle ou simplement provoquée par les miracles.
  rationale: Le grec affirme qu’ils crurent en son nom. Le verset suivant apportera sa propre tension narrative; la traduction ne doit pas anticiper ce jugement ni résoudre la nuance doctrinalement.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement du grec tout en évitant une tournure artificielle. Les marqueurs de notes sont placés après les expressions qu’ils expliquent.
