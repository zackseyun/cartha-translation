  source_fidelity: 'La proposition rend correctement les éléments essentiels : présence à Jérusalem, cadre pascal, foi « en son nom », observation des signes et imparfait d’action d’ἐποίει. Toutefois, « Pendant que » suggère plus nettement une simultanéité qu’un simple repère temporel ; « Lorsque » est plus exact ici. La double indication ἐν τῷ πάσχα ἐν τῇ ἑορτῇ désigne naturellement la fête de la Pâque ; la formulation actuelle, « à l’occasion de la Pâque, durant la fête », est redondante sans être aussi claire.'
