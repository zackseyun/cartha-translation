id: JHN.2.25
reference: John 2:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: fr
  text: et parce qu’il n’avait pas besoin que quelqu’un témoigne au sujet de l’être humain[a] ; car lui-même savait ce qu’il y avait dans l’être humain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au sujet de l’homme » et « ce qu’il y avait dans l’homme ». Le grec emploie au singulier le mot « homme » au sens générique, pour désigner un être humain ou l’humanité.'
    reason: Alternative lexicale permettant de voir plus directement la forme singulière et générique du grec.
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: avait besoin
  rationale: L’expression χρείαν ἔχειν signifie « avoir besoin ». Avec la négation οὐ, « n’avait pas besoin » est naturel en français et reste proche de l’idiome grec.
- source_word: ἵνα τις μαρτυρήσῃ
  choice: que quelqu’un témoigne
  rationale: μαρτυρέω signifie « témoigner » ou « rendre témoignage ». La construction « avoir besoin que quelqu’un témoigne » rend naturellement la proposition introduite par ἵνα, sans perdre la portée testimoniale du verbe.
- source_word: περὶ τοῦ ἀνθρώπου
  choice: au sujet de l’être humain
  rationale: Le singulier ἄνθρωπος a ici une valeur générique. « L’être humain » conserve ce singulier représentatif dans un français moderne, tout en pouvant viser aussi bien chaque personne que l’humanité en général.
- source_word: αὐτὸς γὰρ
  choice: car lui-même
  rationale: '« Car » marque l’explication introduite par γάρ, tandis que « lui-même » conserve l’insistance portée par αὐτός : Jésus possède directement cette connaissance.'
- source_word: ἐγίνωσκεν
  choice: savait
  rationale: L’imparfait grec présente une connaissance continue ou caractéristique. Le français « savait » rend naturellement cet aspect avec un verbe d’état.
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: ce qu’il y avait dans l’être humain
  rationale: Cette formulation conserve l’image intérieure de ἐν et reprend le même terme générique que dans la proposition précédente, sans préciser s’il s’agit de l’intériorité de chaque personne ou de la condition humaine en général.
theological_decisions:
- issue: Étendue de la connaissance de Jésus concernant l’être humain
  choice: Présenter directement Jésus comme sachant ce qu’il y avait dans l’être humain, sans restreindre cette connaissance à une simple perspicacité sociale ni l’expliciter doctrinalement.
  alternative: « ce qu’il y avait en chaque personne » ou « ce qui caractérisait la nature humaine »
  rationale: Le singulier grec ἀνθρώπου/ἀνθρώπῳ peut avoir une portée représentative englobant à la fois l’individu et l’humanité. La traduction maintient cette amplitude et la tension théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « L’être humain » évite l’ambiguïté contemporaine de « l’homme » tout en conservant le singulier générique et sa reprise dans les deux propositions. Le point-virgule respecte le lien explicatif étroit avec « car ».
