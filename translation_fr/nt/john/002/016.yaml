id: JHN.2.16
reference: John 2:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: fr
  text: 'Et il dit à ceux qui vendaient les colombes : « Enlevez tout cela d’ici ! Ne faites pas de la maison de mon Père une maison de commerce[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un marché ». Le grec dit plus littéralement « une maison de commerce », ce qui conserve dans la phrase la répétition du mot « maison ».
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: les colombes
  rationale: Le terme désigne ici les oiseaux vendus pour les sacrifices. « Colombes » est la désignation française traditionnelle et naturelle dans ce contexte, sans exclure que le mot grec puisse aussi désigner des pigeons.
- source_word: πωλοῦσιν
  choice: à ceux qui vendaient
  rationale: Le participe présent grec caractérise ce groupe par son activité de vente. L’imparfait français s’intègre naturellement au récit tout en conservant l’idée d’une activité en cours.
- source_word: Ἄρατε ταῦτα ἐντεῦθεν
  choice: Enlevez tout cela d’ici
  rationale: L’impératif appelle une action immédiate et décisive. « Tout cela » rend naturellement le neutre pluriel ταῦτα sans préciser au-delà du texte les oiseaux, cages ou marchandises concernés.
- source_word: μὴ ποιεῖτε
  choice: Ne faites pas
  rationale: Cette formulation rend directement l’interdiction exprimée par μή avec l’impératif présent, sans introduire l’interprétation plus libre « ne transformez pas ».
- source_word: τὸν οἶκον τοῦ πατρός μου
  choice: la maison de mon Père
  rationale: 'La formulation conserve la référence au Temple ainsi que l’affirmation explicite par Jésus de sa relation filiale : « mon Père ».'
- source_word: οἶκον ἐμπορίου
  choice: une maison de commerce
  rationale: Cette traduction conserve la répétition rhétorique de οἶκος, « maison », et exprime directement l’idée de commerce portée par ἐμπόριον.
theological_decisions:
- issue: Désignation du Temple comme « la maison de mon Père »
  choice: Conserver « la maison de mon Père »
  alternative: « la maison de notre Père » ou « la maison de Dieu »
  rationale: Le grec emploie explicitement le possessif singulier μου, « mon », avec « Père ». La traduction maintient donc la revendication filiale de Jésus sans l’atténuer ni la développer.
translation_notes:
  register: Français international actuel, digne et accessible. La structure « maison de mon Père… maison de commerce » conserve le contraste et la répétition du grec. Le point d’exclamation après le premier impératif rend sa vigueur sans modifier son contenu.
