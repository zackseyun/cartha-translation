  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: fr
  text: 'Jésus leur dit : « Remplissez d’eau les jarres. » Et ils les remplirent jusqu’en haut.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec introduit la parole de Jésus. « Dit » convient naturellement au récit français et, dans cette forme, peut se lire comme présent ou passé simple selon la conduite narrative.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom au datif pluriel désigne les destinataires de la parole de Jésus.
- source_word: Γεμίσατε
  choice: Remplissez
  rationale: L’impératif aoriste actif pluriel exprime un ordre direct adressé à plusieurs personnes.
- source_word: τὰς ὑδρίας
  choice: les jarres
  rationale: ὑδρία désigne une jarre destinée à contenir de l’eau. Le contexte immédiat identifie déjà ces récipients, si bien que « les jarres » est clair et naturel sans répéter qu’elles sont en pierre.
- source_word: ὕδατος
  choice: d’eau
  rationale: Le génitif indique le contenu dont les jarres doivent être remplies ; « remplir d’eau » est l’expression idiomatique française.
- source_word: ἐγέμισαν αὐτάς
  choice: ils les remplirent
  rationale: L’aoriste narratif rapporte l’exécution achevée de l’ordre, et le pronom reprend les jarres.
- source_word: ἕως ἄνω
  choice: jusqu’en haut
  rationale: Cette expression indique que les jarres furent remplies jusqu’à leur partie supérieure. La formulation reste proche du grec sans supposer une forme précise des récipients.
