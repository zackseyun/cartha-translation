translation_notes:
  register: 'Français international moderne, sobre et digne. La phrase conserve la brièveté du récit grec. Aucune note n’est nécessaire : la note anglaise fournie est rattachée à un marqueur incohérent, tandis que le sens de ἕως ἄνω est rendu directement dans le texte.'
