id: JHN.2.5
reference: John 2:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: fr
  text: 'Sa mère dit à ceux qui servaient : « Quoi qu’il vous dise, faites-le. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: sa mère
  rationale: Rend naturellement la construction génitive grecque et maintient l’identification familiale sans explicitation superflue.
- source_word: διακόνοις
  choice: à ceux qui servaient
  rationale: Dans le contexte des noces, le terme désigne les personnes chargées du service. Cette formulation évite de suggérer la fonction ecclésiale ultérieure de « diacre » ou un statut social précis que le grec n’impose pas.
- source_word: Ὅ τι ἂν
  choice: quoi que
  rationale: Cette locution indéfinie avec ἄν exprime une éventualité ouverte ; « quoi que » en restitue naturellement la portée.
- source_word: λέγῃ ὑμῖν
  choice: il vous dise
  rationale: Le subjonctif français convient à la tournure indéfinie « quoi que » et conserve la valeur éventuelle de la forme grecque.
- source_word: ποιήσατε
  choice: faites-le
  rationale: L’impératif pluriel exprime nettement l’ordre, tandis que « le » reprend naturellement tout ce qu’il pourra leur dire.
theological_decisions:
- issue: Référent du sujet implicite de λέγῃ
  choice: Le sujet est rendu par « il », en référence à Jésus.
  alternative: « Quoi que Jésus vous dise, faites-le. »
  rationale: Le grec n’exprime pas le sujet nominalement, bien que le contexte identifie clairement Jésus. Garder le pronom respecte la concision et l’implicite du texte source.
translation_notes:
  register: Français international moderne, naturel et digne. « Ceux qui servaient » correspond à la situation concrète du repas de noces sans introduire un titre religieux ni préciser indûment leur statut.
