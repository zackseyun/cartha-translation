  source_fidelity: 'Le sens est globalement fidèle : ταύτην ἐποίησεν est rendu sans introduire « miracle », σημεῖα par « signes », et les éléments de lieu, de gloire et de foi sont conservés. Toutefois, « comme commencement de ses signes » est une formulation française peu idiomatique et donne à l’accusatif grec une nuance fonctionnelle (« en tant que ») moins nette que son sens inaugural/appositif.'
  naturalness: Le passé simple et le registre sont appropriés. La reformulation proposée rend plus clairement et plus naturellement en français l’idée que l’acte de Cana inaugure les signes, tout en conservant « commencement » et sans imposer « miracle » ni une interprétation doctrinale.
  terminology: « Signes », « manifesta sa gloire » et « crurent en lui » sont des choix justes et cohérents avec la terminologie johannique. « Cana de Galilée » est naturel et exact.
