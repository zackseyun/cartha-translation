id: JHN.2.11
reference: John 2:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: fr
  text: 'Jésus fit cela à Cana de Galilée : ce fut le commencement[a] de ses signes ; il manifesta sa gloire, et ses disciples crurent en lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le premier de ses signes ».'
    reason: Alternative lexicale pour ἀρχὴν τῶν σημείων, dont ἀρχή peut souligner le commencement inaugural ou le premier élément d’une série.
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: fit cela
  rationale: Le démonstratif renvoie à l’acte qui vient d’être raconté. « Cela » évite d’ajouter « miracle » ou « signe » là où le grec emploie seulement un pronom; « fit » conserve la simplicité de ποιέω.
- source_word: ἀρχὴν τῶν σημείων
  choice: comme commencement de ses signes
  rationale: « Commencement » reflète directement ἀρχή et présente l’événement de Cana comme l’inauguration d’une série. « Comme » explicite naturellement en français la fonction prédicative de l’accusatif, sans transformer le syntagme en simple apposition maladroite.
- source_word: σημείων
  choice: signes
  rationale: Dans Jean, σημεῖον désigne un acte qui révèle l’identité et la gloire de Jésus; « signes » préserve cette portée mieux que « miracles ».
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: à Cana de Galilée
  rationale: Formulation géographique française naturelle, proche du génitif grec et permettant de distinguer cette localité.
- source_word: ἐφανέρωσεν
  choice: manifesta
  rationale: « Manifester » exprime le fait de rendre visible ou perceptible et s’accorde naturellement avec « sa gloire », tout en conservant le registre théologique de φανερόω.
- source_word: τὴν δόξαν αὐτοῦ
  choice: sa gloire
  rationale: « Gloire » est le terme français établi et adéquat pour δόξα, ici dévoilée par le signe.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: crurent en lui
  rationale: Cette tournure française idiomatique rend la confiance personnelle dirigée vers Jésus qu’exprime πιστεύω avec εἰς.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: Rendu français naturel et exact du groupe nominal grec.
theological_decisions:
- issue: Terminologie johannique de σημεῖον
  choice: « signes »
  alternative: « miracles »
  rationale: 'Les actes ne sont pas seulement des démonstrations de puissance: ils révèlent qui est Jésus. « Signes » maintient cette fonction théologique sans l’expliciter davantage que le texte.'
- issue: Valeur de ἀρχὴν τῶν σημείων
  choice: « comme commencement de ses signes »
  alternative: « le premier de ses signes »
  rationale: Le choix principal conserve le nom ἀρχή, « commencement », ainsi que l’idée d’inauguration. L’alternative exprime légitimement la valeur ordinale possible et figure donc en note.
- issue: Portée de la foi des disciples
  choice: « crurent en lui »
  alternative: « mirent leur foi en lui »
  rationale: '« Crurent en lui » reste au plus près du verbe grec et conserve la tension narrative: les disciples sont déjà associés à Jésus, mais le signe approfondit ou confirme leur foi sans que la traduction en précise le degré.'
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au récit biblique écrit; deux phrases allègent la coordination grecque sans modifier les rapports logiques. Le marqueur [a] est placé immédiatement après « cela », là où porte l’alternative.
