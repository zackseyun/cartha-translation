base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: fr
  text: 'Jésus lui dit : « Qu’est-ce que cela a à voir avec toi et moi[a], femme[b] ? Mon heure n’est pas encore venue. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Quoi pour moi et pour toi ? » Cette expression idiomatique marque une distance quant à la préoccupation en cause, sans exprimer nécessairement de l’hostilité.'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte culturel, « femme » pouvait être une forme d’adresse respectueuse et n’avait pas nécessairement le ton abrupt qu’elle peut avoir aujourd’hui en français.
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent narratif français, naturel dans ce contexte et fidèle à la vivacité du récit.
- source_word: Τί ἐμοὶ καὶ σοί
  choice: Qu’est-ce que cela a à voir avec moi et avec toi
  rationale: Cette formulation conserve les deux personnes explicitement mentionnées et exprime la prise de distance portée par l’idiome, sans la transformer en hostilité déclarée.
- source_word: γύναι
  choice: femme
  rationale: Le vocatif signifie littéralement « femme ». Des équivalents comme « madame » déplaceraient le registre culturel, tandis que « chère femme » ajouterait une affection non exprimée dans le grec.
- source_word: οὔπω
  choice: pas encore
  rationale: Cette expression rend directement l’idée que le moment en question n’est pas arrivé jusqu’à présent.
- source_word: ἥκει
  choice: est venue
  rationale: Avec « heure », « est venue » est une tournure française naturelle qui exprime l’arrivée du moment fixé.
- source_word: ἡ ὥρα μου
  choice: mon heure
  rationale: La traduction littérale préserve le motif johannique de l’« heure » de Jésus et sa portée théologique, que le terme plus général « moment » atténuerait.
theological_decisions:
- issue: Le ton de la réponse de Jésus à sa mère
  choice: Une réponse qui marque une distance sans constituer nécessairement une offense
  alternative: Une réprimande dure, ou au contraire une formule explicitement affectueuse
  rationale: L’idiome Τί ἐμοὶ καὶ σοί marque une différence de préoccupation ou une prise de distance, tandis que γύναι pouvait être une forme d’adresse convenable. Le texte et les notes préservent cette tension sans durcir ni adoucir artificiellement la parole.
- issue: La portée de « mon heure » dans Jean
  choice: Conserver la formule ouverte à sa résonance johannique plus large
  alternative: La limiter au seul moment d’accomplir ce signe, ou la réduire à une simple indication chronologique
  rationale: Dans l’Évangile selon Jean, l’« heure » est liée à la mission, à la mort et à la glorification de Jésus. La traduction littérale laisse percevoir ce réseau thématique sans l’expliciter excessivement dans le verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe garde la formulation inhabituelle de l’idiome grec suffisamment visible pour préserver sa tension, tandis que les notes en éclairent le sens et le ton.
