id: JHN.2.15
reference: John 2:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: fr
  text: Après avoir fait un fouet de cordes, il les chassa tous de l’enceinte du Temple[a] — les moutons aussi bien que les bœufs[b] —, répandit les pièces de monnaie des changeurs et renversa les tables.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici l’ensemble du domaine ou des cours du Temple, non le sanctuaire intérieur proprement dit.
    reason: cultural_note
  - marker: b
    text: Le grec dit « il les chassa tous », puis mentionne « les moutons aussi bien que les bœufs » ; il ne dit pas explicitement que le fouet fut utilisé contre des personnes.
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: Après avoir fait
  rationale: Le participe aoriste exprime ici une action antérieure à l’action principale ; cette tournure rend clairement la succession des gestes.
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: un fouet avec des cordes
  rationale: « Fouet » est le terme moderne le plus clair ; « avec des cordes » indique naturellement la matière employée.
- source_word: πάντας ἐξέβαλεν
  choice: il les chassa tous
  rationale: Cette formulation conserve le pronom masculin pluriel et la portée générale de πάντας sans préciser davantage son référent.
- source_word: τοῦ ἱεροῦ
  choice: de l’enceinte du Temple
  rationale: ἱερόν désigne l’ensemble du domaine ou des cours du Temple, et non le sanctuaire intérieur proprement dit.
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: les moutons aussi bien que les bœufs
  rationale: La tournure rend la coordination emphatique τε…καί et garde ces animaux comme précision après « tous ».
- source_word: κολλυβιστῶν
  choice: des changeurs
  rationale: Terme français courant pour les personnes qui échangeaient les monnaies.
- source_word: ἐξέχεεν τὰ κέρματα
  choice: répandit les pièces
  rationale: « Répandre » conserve l’image concrète de ἐκχέω, tandis que « pièces » exprime clairement κέρματα.
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: renversa les tables
  rationale: Rendu direct et naturel de l’action décrite.
theological_decisions:
- issue: Étendue de l’expulsion et usage du fouet
  choice: Conserver « il les chassa tous », puis préciser « les moutons aussi bien que les bœufs », sans dire que Jésus frappa des personnes avec le fouet.
  alternative: Comprendre que Jésus chassa soit toutes les personnes et tous les animaux, soit seulement l’ensemble des animaux.
  rationale: La syntaxe grecque laisse subsister une certaine ambiguïté sur le référent exact de πάντας ; elle ne dit pas explicitement que le fouet fut utilisé contre des personnes.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en incise préserve la structure du grec et son ambiguïté sans alourdir excessivement la phrase.
