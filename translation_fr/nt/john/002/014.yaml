reference: John 2:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: fr
  text: Dans le temple[a], il trouva les marchands de bœufs, de moutons et de colombes, ainsi que les changeurs de monnaie assis là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec traduit par « temple » désigne ici l’ensemble de l’enceinte du temple, notamment ses parvis, et non spécifiquement le sanctuaire intérieur.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: il trouva
  rationale: L’aoriste de εὑρίσκω indique ici ce que Jésus découvrit en arrivant; « trouva » reste proche du sens lexical sans le réduire à la simple perception visuelle.
- source_word: ἱερῷ
  choice: dans le temple
  rationale: ἱερόν désigne ici l’ensemble du domaine ou de l’enceinte du temple, non le sanctuaire intérieur; « temple » est naturel en français, et la note précise la portée spatiale.
- source_word: πωλοῦντας
  choice: les marchands de
  rationale: Le participe substantivé désigne ceux qui vendaient ces animaux. « Les marchands de » rend leur activité continue de façon concise et idiomatique.
- source_word: βόας
  choice: bœufs
  rationale: βοῦς désigne des bovins; « bœufs » convient au contexte des animaux destinés aux sacrifices sans préciser indûment « taureaux ».
- source_word: πρόβατα
  choice: moutons
  rationale: Dans ce contexte, πρόβατα désigne naturellement des moutons; ce terme courant est clair pour un lectorat moderne.
- source_word: περιστερὰς
  choice: colombes
  rationale: περιστερά peut désigner une colombe ou un pigeon; « colombes » est l’équivalent biblique courant dans le contexte sacrificiel.
- source_word: κερματιστὰς
  choice: changeurs de monnaie
  rationale: κερματιστής désigne une personne qui échange des pièces ou des monnaies; « changeurs de monnaie » est précis et immédiatement compréhensible.
- source_word: καθημένους
  choice: assis là
  rationale: Le participe décrit leur posture et leur présence installée sur place; « assis là » restitue naturellement la scène.
theological_decisions:
- issue: Portée de ἱερόν concernant le temple de Jérusalem
  choice: « temple » dans le texte, compris comme l’ensemble de l’enceinte du temple
  alternative: « parvis du temple », « enceinte du temple » ou « sanctuaire »
  rationale: La présence des vendeurs d’animaux et des changeurs situe la scène dans le vaste domaine du temple plutôt que dans le sanctuaire intérieur. « Temple » demeure la formulation française la plus naturelle, tandis que la note préserve la précision historique et spatiale.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve l’ordre narratif essentiel tout en employant « les marchands de » pour rendre idiomatiquement le participe grec. Le marqueur de note est placé après la liste des animaux, conformément au texte de consultation, et renvoie à la nuance du mot « temple ».
