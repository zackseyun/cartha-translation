id: JHN.2.2
reference: John 2:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκλήθη δὲ καὶ ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὸν γάμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: fr
  text: Jésus aussi fut invité au mariage, ainsi que ses disciples.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: fut invité
  rationale: Dans le contexte d’une célébration à laquelle on se rend, le passif de καλέω signifie naturellement « être invité » plutôt que le sens plus général « être appelé ».
- source_word: δὲ καὶ
  choice: aussi
  rationale: La combinaison introduit ici Jésus comme une personne supplémentaire invitée au mariage; « aussi » rend cette valeur additive avec naturel en français.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: ainsi que ses disciples
  rationale: La coordination associe les disciples de Jésus à l’invitation. « Ainsi que » évite une répétition pesante de « et » tout en conservant cette association; « disciples » rend μαθηταί selon son usage établi dans les Évangiles.
- source_word: εἰς τὸν γάμον
  choice: au mariage
  rationale: γάμος désigne ici la célébration du mariage. « Au mariage » est idiomatique et n’ajoute pas explicitement l’idée de festin.
theological_decisions: []
translation_notes:
  register: Français moderne, digne et direct. Le passé simple convient au registre narratif biblique écrit sans paraître archaïque; la structure reste proche du grec tout en étant naturelle.
