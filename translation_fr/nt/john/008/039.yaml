  source_fidelity: 'Le texte français rend fidèlement le grec : la réponse des interlocuteurs, leur revendication d’Abraham comme père, le présent historique λέγει, puis la condition avec εἰ + présent (ἐστε) et l’imparfait ἐποιεῖτε. « Vous accompliriez » exprime de façon recevable la portée conditionnelle de l’imparfait, sans éliminer la tension formelle du grec.'
  naturalness: Le français est naturel, actuel et adapté à un registre biblique accessible. « Notre père, c’est Abraham » et « Jésus leur dit » sont fluides. La combinaison « Si vous êtes… vous accompliriez » est volontairement marquée, mais elle est grammaticalement intelligible et sert à conserver l’ambiguïté aspectuelle et modale du grec; la note l’explicite utilement.
  terminology: « Enfants d’Abraham » traduit précisément τέκνα sans masculiniser indûment le terme. « Les œuvres d’Abraham » conserve le vocabulaire johannique et le contraste entre filiation revendiquée et conduite. Aucun développement doctrinal extérieur n’est introduit.
