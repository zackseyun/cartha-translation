id: JHN.8.39
reference: John 8:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: fr
  text: 'Ils lui répondirent : « Notre père, c’est Abraham. » Jésus leur dit : « Si vous êtes enfants d’Abraham, vous accompliriez les œuvres d’Abraham.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Si vous étiez enfants d’Abraham, vous accompliriez les œuvres d’Abraham. » L’imparfait grec peut suggérer une condition contraire aux faits.'
    reason: La construction conditionnelle grecque permet une compréhension irréelle, tandis que la proposition introduite par « si » présente une forme au présent.
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Ils lui répondirent
  rationale: Le français exprime naturellement la formule grecque redoublée « répondirent et dirent » par le seul verbe « répondirent », suivi du discours direct, sans perte de contenu narratif.
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: Notre père, c’est Abraham
  rationale: Cette dislocation naturelle en français met en relief la revendication de filiation tout en conservant Abraham comme attribut.
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: Jésus leur dit
  rationale: « Dit » convient au présent historique grec et demeure idiomatique dans un récit français.
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: enfants d’Abraham
  rationale: « Enfants » conserve le sens relationnel et inclusif de τέκνα sans le restreindre aux descendants masculins.
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: les œuvres d’Abraham
  rationale: « Œuvres » préserve le terme concret et le contraste johannique entre la filiation revendiquée et la conduite effective.
- source_word: ἐποιεῖτε
  choice: vous accompliriez
  rationale: Le conditionnel français rend la valeur potentiellement irréelle de l’imparfait grec dans cette construction, sans réduire les « œuvres » à une simple paraphrase.
theological_decisions:
- issue: Nature de la filiation à Abraham
  choice: Conserver littéralement le langage de filiation et son contraste avec les œuvres
  alternative: Préciser qu’il s’agit exclusivement d’une filiation spirituelle ou nier explicitement la descendance physique
  rationale: Le verset oppose la revendication d’avoir Abraham pour père à l’absence de ses œuvres, sans développer ici une doctrine complète des rapports entre descendance physique et filiation spirituelle.
- issue: Force de la proposition conditionnelle
  choice: Conserver dans le texte la tension entre « si vous êtes » et « vous accompliriez »
  alternative: Harmoniser en « si vous étiez… vous accompliriez » ou en une condition pleinement réelle
  rationale: Le grec transmis associe ἐστε au présent et ἐποιεῖτε à l’imparfait. La formulation principale garde cette tension, tandis que la note signale l’interprétation contraire aux faits.
translation_notes:
  register: Français international actuel, digne et accessible. Le dialogue reste direct; « œuvres » est conservé pour respecter le vocabulaire et le contraste du texte grec.
