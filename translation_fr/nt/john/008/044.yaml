  to: Vous avez pour père le diable, et vous voulez accomplir les désirs de votre père. Lui, il était meurtrier dès le commencement et il ne s’est pas tenu dans la vérité, parce qu’il n’y a pas de vérité en lui. Quand il dit le mensonge[a], il parle de ce qui lui est propre[b], car il est menteur et il en est le père[c].
