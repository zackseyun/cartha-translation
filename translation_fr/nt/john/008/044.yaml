id: JHN.8.44
reference: John 8:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: fr
  text: Vous avez pour père le diable, et vous voulez accomplir les désirs de votre père. Lui, il était meurtrier dès le commencement et il ne s’est pas tenu dans la vérité, parce qu’il n’y a pas de vérité en lui. Quand il dit le mensonge[a], il parle de ce qui lui est propre[b], car il est menteur et il en est le père[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus courante : « Quand il ment » ou « Quand il dit ce qui est faux ». Le grec dit plus littéralement : « Quand il dit le mensonge ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « il parle de ce qui lui appartient », c’est-à-dire de ce qui procède de son caractère propre.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou, plus explicitement : « le père du mensonge ». Littéralement, le grec dit : « le père de lui/d’elle/de cela » ; le pronom se rapporte vraisemblablement au mensonge, bien qu’une autre analyse soit possible.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: vous avez pour père le diable
  rationale: Cette tournure française naturelle exprime l’origine ou l’appartenance spirituelle indiquée par ἐκ avec εἰμί, sans suggérer une filiation biologique.
- source_word: ἐπιθυμίας
  choice: désirs
  rationale: « Désirs » conserve la portée générale du terme et évite le sens principalement sexuel que « convoitises » peut prendre en français courant.
- source_word: θέλετε ποιεῖν
  choice: vous voulez accomplir
  rationale: La formulation rend clairement la volonté active exprimée par θέλετε ποιεῖν.
- source_word: ἀνθρωποκτόνος
  choice: meurtrier
  rationale: Équivalent français direct et naturel pour celui qui tue des êtres humains dans ce contexte moral.
- source_word: ἀπ’ ἀρχῆς
  choice: dès le commencement
  rationale: Cette expression conserve la portée temporelle et l’écho du vocabulaire johannique.
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: il ne s’est pas tenu dans la vérité
  rationale: La formulation conserve l’image de se tenir dans la vérité sans affirmer explicitement qu’il y serait d’abord demeuré avant de la quitter.
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: quand il dit le mensonge
  rationale: Cette traduction garde l’article singulier remarquable de τὸ ψεῦδος; une formulation française plus courante est signalée en note.
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: il parle de ce qui lui est propre
  rationale: La formulation reste proche de l’expression grecque tout en étant compréhensible en français moderne; elle désigne ce qui procède de son caractère propre.
- source_word: ψεύστης
  choice: menteur
  rationale: Équivalent direct et idiomatique du nom prédicatif grec.
- source_word: ὁ πατὴρ αὐτοῦ
  choice: il en est le père
  rationale: Le pronom « en » renvoie naturellement au mensonge mentionné juste avant et conserve l’image du père comme source, sans généraliser le singulier en « mensonges ».
theological_decisions:
- issue: Référent de ὁ πατὴρ αὐτοῦ
  choice: « il en est le père », où « en » renvoie au mensonge
  alternative: « le père du mensonge »; ou, beaucoup moins probablement, « son père » en parlant du diable
  rationale: Le référent contextuel le plus proche et le plus cohérent est τὸ ψεῦδος. La traduction conserve ce lien sans introduire l’idée spéculative d’un père du diable.
- issue: Le diable se serait-il autrefois tenu dans la vérité ?
  choice: « il ne s’est pas tenu dans la vérité »
  alternative: « il n’est pas demeuré dans la vérité »
  rationale: « Demeurer » pourrait affirmer plus nettement une participation antérieure à la vérité. Le texte retenu préserve l’image grecque et laisse ouverte cette question théologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Lui, il était » marque clairement le changement de sujet et donne à l’accusation sa force orale. Les expressions « le mensonge » et « il en est le père » conservent volontairement la singularité et la tension de la formulation grecque.
