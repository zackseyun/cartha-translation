id: JHN.8.22
reference: John 8:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: fr
  text: 'Les Juifs disaient donc[a] : « Il ne va tout de même pas se tuer, puisqu’il dit : “Là où je vais, vous ne pouvez pas venir” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou peut-être, dans le contexte de l’Évangile selon Jean : « les Judéens » ou « les responsables juifs », selon l’étendue du groupe visé ici.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente la réaction comme en cours ou répétée; l’imparfait français la rend naturellement.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque ici la conséquence ou la reprise narrative à partir de la parole précédente de Jésus.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: C’est le sens lexical direct de l’expression. Le contexte johannique peut parfois viser plus précisément des Judéens ou des responsables juifs, mais le verset ne précise pas lui-même cette portée.
- source_word: Μήτι
  choice: Il ne va tout de même pas… ?
  rationale: μήτι introduit une question qui attend normalement une réponse négative; cette tournure française exprime le scepticisme des interlocuteurs sans transformer la question en affirmation.
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: se tuer
  rationale: Rend directement et en français actuel le verbe au futur accompagné du pronom réfléchi.
- source_word: ὅτι
  choice: puisque
  rationale: 'La conjonction introduit le motif de leur supposition: ils tirent cette conclusion de ce que Jésus dit.'
- source_word: λέγει
  choice: il dit
  rationale: Conserve le présent grec dans la réaction rapportée.
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Là où je vais
  rationale: ὑπάγω indique le fait d’aller ou de partir; « je vais » est naturel et évite de préciser excessivement la destination ou la nuance de départ.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: vous ne pouvez pas venir
  rationale: Rend clairement l’incapacité exprimée par δύνασθε avec l’infinitif ἐλθεῖν.
theological_decisions:
- issue: Portée de l’expression οἱ Ἰουδαῖοι dans l’Évangile selon Jean
  choice: Maintenir « les Juifs » dans le texte principal
  alternative: « les Judéens » ou « les responsables juifs »
  rationale: Le grec ne restreint pas explicitement ici le groupe aux autorités. La note signale les portées contextuelles possibles afin de préserver l’ambiguïté sans faire de l’appartenance ethnique en général la cible nécessaire du passage.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Il ne va tout de même pas… ? » restitue une question sceptique attendant une réponse négative. Le marqueur [a] est placé immédiatement après le groupe concerné.
