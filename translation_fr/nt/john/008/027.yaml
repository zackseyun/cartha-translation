id: JHN.8.27
reference: John 8:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἔγνωσαν ὅτι τὸν πατέρα αὐτοῖς ἔλεγεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/027.yaml
  text: They did not understand that he was speaking to them about the Father[a].
translation:
  language: fr
  text: Ils ne comprirent pas qu’il leur parlait du Père[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils ne savaient pas qu’il leur parlait du Père. »'
    reason: Alternative lexicale possible pour οὐκ ἔγνωσαν, qui peut aussi se traduire plus formellement par « ils ne savaient pas ».
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: Ils ne comprirent pas
  rationale: Dans ce contexte, γινώσκω exprime l’échec des auditeurs à saisir de qui Jésus parlait. « Comprirent » rend naturellement cette valeur cognitive en français, tout en conservant l’énoncé ponctuel de l’aoriste.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit le contenu de ce qu’ils n’ont pas compris ; « que » est la tournure française normale.
- source_word: τὸν πατέρα
  choice: du Père
  rationale: 'Avec λέγω, l’accusatif désigne ici le sujet du propos : Jésus parlait du Père. La majuscule indique, conformément au contexte johannique, qu’il s’agit de Dieu comme Père de Jésus.'
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif désigne les destinataires des paroles de Jésus ; le pronom français « leur » le rend directement.
- source_word: ἔλεγεν
  choice: parlait
  rationale: L’imparfait français correspond naturellement à l’aspect imperfectif du verbe grec et, avec « du Père », donne une formulation courante et digne.
theological_decisions:
- issue: Référent de « le Père »
  choice: Comprendre que Jésus parlait de Dieu, son Père.
  alternative: Comprendre qu’il parlait d’un père humain.
  rationale: Dans le contexte immédiat de Jean, « le Père » désigne Dieu comme Père de Jésus. La majuscule explicite ce référent contextuel sans ajouter de développement doctrinal.
- issue: Valeur contextuelle de γινώσκω
  choice: Traduire par « comprendre ».
  alternative: Traduire par « savoir » ou « reconnaître ».
  rationale: Le contexte porte sur l’incapacité des auditeurs à saisir le référent des paroles de Jésus. « Comprendre » exprime ce sens avec clarté, tandis que la note conserve l’alternative lexicale plus formelle.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple « comprirent » convient au récit écrit et rend l’aoriste, tandis que l’imparfait « parlait » préserve l’aspect continu de ἔλεγεν.
