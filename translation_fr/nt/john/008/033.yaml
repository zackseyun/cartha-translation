reference: John 8:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: fr
  text: 'Ils lui répondirent : « Nous sommes de la descendance d’Abraham[a] et nous n’avons jamais été esclaves de personne[b]. Comment peux-tu dire : “Vous deviendrez libres”[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « la semence d’Abraham » ; le grec emploie un singulier collectif pour parler de la descendance.
    reason: lexical_alternative
  - marker: b
    text: Ou « nous n’avons jamais servi personne ». Dans ce contexte, le verbe évoque plus particulièrement l’esclavage ou la servitude.
    reason: lexical_alternative
  - marker: c
    text: Ou « Vous serez libres ». Le grec dit plus littéralement « vous deviendrez libres ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: Ils lui répondirent
  rationale: Cette tournure rend naturellement en français la réponse directement adressée à Jésus. Le passé simple convient au registre narratif soutenu du passage.
- source_word: Σπέρμα Ἀβραάμ
  choice: la descendance d’Abraham
  rationale: Le nom grec au singulier a ici une valeur collective et désigne la lignée physique. « Descendance » préserve cette valeur sans l’archaïsme ni les connotations possibles de « semence ».
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: nous n’avons jamais été esclaves de personne
  rationale: Le parfait de δουλεύω exprime ici un état de servitude, mis en contraste avec la liberté. La formulation française est idiomatique et conserve la portée emphatique de πώποτε.
- source_word: πῶς σὺ λέγεις
  choice: Comment peux-tu dire
  rationale: Cette formulation restitue naturellement l’incrédulité de la question et l’accent porté sur le pronom σὺ.
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: Vous deviendrez libres
  rationale: « Deviendrez » conserve l’idée de passage à un nouvel état exprimée par γενήσεσθε, plutôt que de la réduire au simple état « vous serez libres ».
theological_decisions:
- issue: Sens de δουλεύω dans l’opposition entre esclavage et liberté
  choice: été esclaves
  alternative: servi
  rationale: Le contexte immédiat développe explicitement l’opposition entre esclavage et liberté. « Être esclaves » garde la force sociale et théologique de cette image sans l’affaiblir en simple service.
- issue: Désignation de la relation à Abraham par σπέρμα
  choice: la descendance d’Abraham
  alternative: la semence d’Abraham
  rationale: L’expression rapporte leur revendication de filiation physique sans lui ajouter une interprétation doctrinale. « Descendance » rend clairement le collectif singulier.
- issue: Valeur de γενήσεσθε
  choice: deviendrez libres
  alternative: serez libres
  rationale: Le choix conserve la transition exprimée par γίνομαι et laisse intacte la tension entre leur affirmation de n’avoir jamais été esclaves et la promesse de devenir libres.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple maintient un registre narratif biblique courant sans archaïsme. La ponctuation avec citation intérieure clarifie que les interlocuteurs reprennent les paroles de Jésus.
