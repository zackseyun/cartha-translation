  rationale: La révision retire le contraste non exprimé par le grec, évite de restreindre le « trésor » à une salle précise et emploie une tournure française plus naturelle pour l’absence de saisie. Elle maintient la structure, les deux appels de note et le motif théologique volontairement littéral de « son heure ».
