  verdict: revise
  source_fidelity: Le sens global est bien rendu, y compris la simultanéité de l’enseignement et le plus-que-parfait (« n’était pas encore venue »). Toutefois, « Pourtant » ajoute une opposition que le καί grec n’exprime pas. « Salle du trésor » spécifie indûment une salle déterminée, alors que γαζοφυλάκιον désigne plus largement le trésor ou son espace.
  naturalness: Le français est globalement naturel et d’un registre approprié. « Personne ne se saisit de lui » est compréhensible, mais « personne ne mit la main sur lui » est plus idiomatique dans ce contexte tout en gardant la nuance non strictement juridique de πιάζω.
  terminology: « Son heure » conserve avec justesse le motif johannique. « Enceinte du temple » dans la note explique correctement que ἱερόν vise le complexe cultuel plutôt que le sanctuaire intérieur.
