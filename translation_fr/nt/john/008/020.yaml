  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: fr
  text: Il prononça ces paroles dans le trésor, tandis qu’il enseignait dans le temple[a]. Personne ne mit la main sur lui, parce que son heure[b] n’était pas encore venue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’enceinte du temple » ; le terme grec désigne l’ensemble du complexe du temple, et non seulement le sanctuaire intérieur.
    reason: lexical_alternative
  - marker: b
    text: 'Dans l’Évangile selon Jean, « son heure » renvoie au moment fixé de ses souffrances et de sa glorification. Autre traduction possible : « le moment fixé pour lui ».'
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα ἐλάλησεν
  choice: Il prononça ces paroles
  rationale: « Ces paroles » renvoie naturellement au discours précédent; « prononça » rend l’acte de parler dans un registre narratif digne et actuel.
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: dans la salle du trésor
  rationale: γαζοφυλάκιον désigne ici le trésor du temple ou l’espace où se trouvaient les troncs à offrandes. « Salle du trésor » évite de suggérer un coffre unique tout en restant concise.
- source_word: διδάσκων
  choice: tandis qu’il enseignait
  rationale: Le participe présent indique une action simultanée à celle du verbe principal.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: ἱερόν désigne l’ensemble du complexe du temple, non le sanctuaire intérieur seulement; le français courant « temple » convient, avec une note explicative.
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: personne ne se saisit de lui
  rationale: πιάζω exprime le fait de saisir ou de mettre la main sur quelqu’un. Cette formulation conserve la force physique et hostile sans imposer la nuance juridique plus précise d’une arrestation.
- source_word: ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ
  choice: parce que son heure n’était pas encore venue
  rationale: La formulation conserve le lien causal, la valeur du plus-que-parfait grec et le motif johannique de « l’heure ».
theological_decisions:
- issue: Le motif johannique de « son heure »
  choice: Conserver « son heure » dans le texte principal.
  alternative: « le moment fixé pour lui » ou « son temps »
  rationale: 'L’expression littérale préserve la portée thématique et la tension du récit: dans Jean, « l’heure » renvoie au moment déterminant des souffrances et de la glorification de Jésus, sans que le texte du verset explicite à lui seul tous ces aspects.'
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec sans être raide. « Pourtant » rend clairement la progression narrative de καί dans ce contexte. Les deux appels de note figurent dans le texte principal.
