    issue: Ajout de « Pourtant »
    rationale: καί est simplement coordonnant ici. Le contraste narratif peut être perçu dans le contexte, mais il n’est pas lexicalement exprimé et ne doit pas être imposé.
  - severity: low
    issue: « salle du trésor » est trop spécifique
    rationale: Le grec γαζοφυλάκιον peut désigner le trésor/secteur du trésor; il ne requiert pas l’image d’une salle unique.
  - severity: low
    issue: Formulation de la saisie
    rationale: « Personne ne mit la main sur lui » rend plus naturellement πιάζω en français sans interpréter l’acte comme une arrestation officielle.
