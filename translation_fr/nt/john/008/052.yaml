source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: fr
  text: 'Les Juifs lui dirent : « Maintenant, nous savons que tu as un démon[a]. Abraham est mort, et les prophètes aussi, pourtant tu dis : “Si quelqu’un garde ma parole, il ne goûtera absolument jamais la mort[b].” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu es possédé par un démon ». Le grec dit littéralement : « tu as un démon ».'
    reason: lexical_alternative
  - marker: b
    text: 'La tournure grecque est fortement emphatique : elle signifie qu’une telle personne ne goûtera jamais la mort, à aucun moment.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: Les Juifs
  rationale: Rendu direct du groupe qui s’oppose ici à Jésus. « Les chefs juifs » serait plus interprétatif et « les Judéens » mettrait au premier plan une nuance géographique que le contexte n’impose pas.
- source_word: Νῦν ἐγνώκαμεν
  choice: Maintenant, nous savons
  rationale: Le parfait exprime un état présent résultant d’une constatation; cette formulation est naturelle en français.
- source_word: δαιμόνιον ἔχεις
  choice: tu as un démon
  rationale: Conserve l’expression grecque concrète sans la remplacer dans le texte principal par l’interprétation « tu es possédé ».
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: Abraham est mort, et les prophètes aussi
  rationale: Le passé composé convient au français courant, et « aussi » explicite naturellement la coordination.
- source_word: καὶ σὺ λέγεις
  choice: pourtant tu dis
  rationale: Dans ce contexte, καί marque le contraste entre la mort d’Abraham et des prophètes et la parole attribuée à Jésus.
- source_word: τὸν λόγον μου τηρήσῃ
  choice: garde ma parole
  rationale: « Garde » préserve la portée de τηρέω — conserver, observer, mettre en pratique — sans la réduire à la seule obéissance; « parole » maintient le vocabulaire johannique de λόγος.
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: il ne goûtera absolument jamais la mort
  rationale: « Goûter la mort » conserve la métaphore grecque. « Absolument jamais » rend à la fois la négation fortement emphatique οὐ μή et la portée temporelle de εἰς τὸν αἰῶνα, sans produire l’ambiguïté française de « goûter la mort pour toujours ».
theological_decisions:
- issue: Sens de la promesse concernant la mort
  choice: Conserver l’expression « goûter la mort » sans préciser la nature de cette mort.
  alternative: Interpréter explicitement la mort comme physique, spirituelle ou éternelle/finale.
  rationale: Les interlocuteurs de Jésus comprennent ses paroles en les confrontant à la mort d’Abraham et des prophètes, tandis que l’Évangile selon Jean permet souvent plusieurs niveaux de sens. La traduction préserve donc cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La structure dialoguée et l’accusation directe sont conservées. « Absolument jamais » exprime l’insistance grecque de manière idiomatique, tout en évitant de faire de « pour toujours » un complément ambigu de « goûter la mort ».
