id: JHN.8.29
reference: John 8:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: fr
  text: Et celui qui m’a envoyé est avec moi ; il ne m’a pas laissé seul, parce que je fais toujours ce qui lui plaît.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: Celui qui m’a envoyé
  rationale: Le participe aoriste substantivé désigne celui qui a envoyé Jésus. Cette formulation naturelle conserve l’expression relationnelle du grec sans expliciter « le Père ».
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: est avec moi
  rationale: μετά avec le génitif exprime ici la présence et l’accompagnement ; « est avec moi » en est l’équivalent français direct et idiomatique.
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: Il ne m’a pas laissé seul
  rationale: L’aoriste ἀφῆκεν est rendu naturellement par le passé composé, tandis que μόνον qualifie Jésus comme étant seul. La formulation reste étroitement liée au grec.
- source_word: ὅτι
  choice: parce que
  rationale: Dans ce contexte, ὅτι introduit la raison donnée par Jésus. « Parce que » préserve clairement cette relation causale.
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: ce qui lui plaît
  rationale: Le neutre pluriel substantivé signifie littéralement « les choses qui lui sont agréables ». « Ce qui lui plaît » exprime le même contenu en français courant et digne.
- source_word: ποιῶ πάντοτε
  choice: je fais toujours
  rationale: Le présent indique une action constante ou habituelle, renforcée par πάντοτε. L’ordre retenu est naturel en français.
theological_decisions:
- issue: Référent de « Celui qui m’a envoyé »
  choice: Conserver l’expression relationnelle sans ajouter « le Père ».
  alternative: Traduire « Le Père qui m’a envoyé ».
  rationale: Le contexte johannique permet d’identifier le Père, mais le grec ne le nomme pas ici. La formulation retenue préserve le style et la portée du texte.
- issue: Lien causal introduit par ὅτι
  choice: Traduire explicitement par « parce que ».
  alternative: Employer « car », qui pourrait présenter la proposition davantage comme une explication générale.
  rationale: Le grec établit un lien causal qu’il ne convient pas d’atténuer ni de réinterpréter théologiquement. La traduction laisse intacte la tension entre la présence de celui qui a envoyé Jésus et l’obéissance constante de Jésus.
- issue: Valeur temporelle de ἀφῆκεν
  choice: 'Employer le passé composé : « ne m’a pas laissé seul ».'
  alternative: 'Employer le présent : « ne me laisse pas seul », afin de souligner la présence continue.'
  rationale: Le passé composé correspond naturellement à l’aoriste en français tout en permettant une pertinence présente, sans transformer explicitement le temps verbal en présent.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve la répétition simple et l’enchaînement causal de l’original, sans explicitation confessionnelle.
