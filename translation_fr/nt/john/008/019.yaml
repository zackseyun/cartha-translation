  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: fr
  text: 'Ils lui disaient donc : « Où est ton Père ? » Jésus répondit : « Vous ne connaissez ni moi ni mon Père. Si vous me connaissiez, vous connaîtriez aussi mon Père. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: ils lui demandaient
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme répétée. Devant une question directe, « demandaient » est naturel en français et rend explicitement la valeur contextuelle du verbe de parole sans exagérer la répétition.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la suite ou la conséquence dans le discours; « donc » en conserve clairement la fonction.
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: Où est ton Père ?
  rationale: La formulation directe est conservée. La majuscule signale que, dans le contexte johannique, le Père dont parle Jésus est Dieu, tout en maintenant l’ironie née de l’incompréhension de ses interlocuteurs.
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: Vous ne connaissez ni moi ni mon Père
  rationale: La construction « ne… ni… ni » rend οὔτε…οὔτε. « Connaître » préserve la portée large de οἶδα, qui peut inclure connaissance et reconnaissance, sans la réduire à la compréhension intellectuelle.
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: Si vous me connaissiez, vous connaîtriez aussi mon Père
  rationale: L’imparfait après « si » et le conditionnel présent expriment naturellement en français une condition contraire à la réalité présente. « Aussi » rend καί sans alourdir la phrase.
theological_decisions:
- issue: Majuscule à « Père » lorsqu’il désigne Dieu
  choice: « Père » avec une majuscule dans les deux occurrences
  alternative: « père » avec une minuscule
  rationale: Le contexte identifie le Père de Jésus à Dieu. La majuscule aide le lecteur moderne à reconnaître ce référent sans ajouter d’explication au texte.
- issue: Portée de la connaissance de Jésus et du Père
  choice: Maintien du verbe large « connaître »
  alternative: « reconnaître » ou « comprendre »
  rationale: « Connaître » conserve le lien théologique johannique entre Jésus et le Père ainsi que l’éventail relationnel et cognitif du grec, sans résoudre cette tension par une paraphrase.
- issue: Valeur temporelle et irréelle de la condition
  choice: 'Condition contraire à la réalité présente : « Si vous me connaissiez, vous connaîtriez… »'
  alternative: 'Condition contraire au passé : « Si vous m’aviez connu, vous auriez connu… »'
  rationale: Les imparfaits grecs peuvent formellement recevoir une lecture irréelle, mais le contexte se prête mieux à une méconnaissance actuelle. La note conserve l’autre manière possible d’accentuer la force contraire aux faits.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement rend le singulier σου adressé à Jésus; Jésus répond au groupe par « vous ». La ponctuation française et les guillemets français sont employés.
