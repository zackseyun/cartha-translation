  source_fidelity: La réponse de Jésus et la condition irréelle sont rendues avec fidélité. Toutefois, ἔλεγον est un verbe de parole (« ils disaient ») à l’imparfait; « ils lui demandaient » interprète la question comme un acte de demande et modifie inutilement le choix lexical de la source. « Ils lui disaient donc » conserve à la fois le verbe et l’aspect imperfectif.
  naturalness: Le français est moderne, clair et d’un registre approprié. « Ils lui disaient donc » suivi d’une question directe est naturel dans une narration biblique soignée. La formulation conditionnelle « Si vous me connaissiez, vous connaîtriez aussi mon Père » est idiomatique et rend bien la portée présente contraire aux faits.
  terminology: La majuscule à « Père » convient au référent divin dans ce contexte. « Connaître » préserve de manière non interprétative la répétition de οἶδα et le lien entre Jésus et son Père. Le tutoiement dans la question, puis le vouvoiement collectif dans la réponse, correspondent aux pronoms grecs.
