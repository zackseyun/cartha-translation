id: JHN.8.46
reference: John 8:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: fr
  text: Qui parmi vous me convainc de péché[a] ? Si je dis la vérité, pourquoi ne me croyez-vous pas[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « peut prouver que je suis coupable de péché ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « pourquoi ne me faites-vous pas confiance ? » Le grec peut évoquer aussi bien le fait de croire celui qui parle que celui de lui faire confiance.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: Qui parmi vous
  rationale: Cette tournure française naturelle conserve l’interpellation directe adressée aux auditeurs de Jésus.
- source_word: ἐλέγχει με περὶ ἁμαρτίας
  choice: me convainc de péché
  rationale: Dans la construction « convaincre quelqu’un de », le verbe peut exprimer le fait d’établir sa culpabilité. Cette formulation garde la portée judiciaire du défi et le caractère général de « péché », sans préciser une faute particulière.
- source_word: εἰ ἀλήθειαν λέγω
  choice: Si je dis la vérité
  rationale: « Si » respecte la forme conditionnelle grecque sans la transformer en « puisque », même si le contexte donne à la question une force rhétorique.
- source_word: διὰ τί
  choice: pourquoi
  rationale: Équivalent français direct et idiomatique de l’interrogation portant sur la raison.
- source_word: πιστεύετέ μοι
  choice: ne me croyez-vous pas
  rationale: « Croire quelqu’un » restitue naturellement la construction avec le datif et préserve à la fois la dimension du témoignage et, en arrière-plan, celle de la confiance.
theological_decisions:
- issue: Portée de l’affirmation implicite de Jésus concernant son absence de péché et la vérité de sa parole
  choice: Conserver les deux questions sous leur forme directe, sans expliciter davantage l’affirmation implicite.
  alternative: 'Paraphraser : « Qui parmi vous peut prouver que j’ai commis un péché ? Puisque je dis la vérité, pourquoi refusez-vous de me croire ? »'
  rationale: Le grec présente un défi rhétorique fort, mais ne remplace ni le présent par une formulation modale explicite ni « si » par « puisque ». La traduction maintient donc la tension et la force christologique du texte sans ajout doctrinal.
translation_notes:
  register: Français international moderne, sobre et digne. « Convaincre de péché » est plus soutenu que la langue courante, mais demeure une construction française précise qui préserve la concision et la nuance judiciaire du grec ; la note fournit une formulation plus explicite.
