  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: fr
  text: 'En vérité, en vérité, je vous le dis : si quelqu’un garde ma parole, il ne verra jamais la mort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: En vérité, en vérité
  rationale: Conserve la répétition solennelle propre aux paroles de Jésus dans Jean, dans une formulation française digne et bien établie.
- source_word: τηρήσῃ
  choice: garde
  rationale: « Garder » exprime l’idée de conserver, observer et demeurer fidèle à la parole, sans réduire le verbe à la seule obéissance extérieure.
- source_word: λόγον
  choice: parole
  rationale: Dans ce contexte, « parole » désigne l’enseignement ou le message de Jésus et correspond naturellement à l’usage johannique.
- source_word: θεωρήσῃ
  choice: verra
  rationale: Reproduit l’image grecque de « voir la mort » sans l’aplatir en « mourir ».
- source_word: οὐ μὴ … εἰς τὸν αἰῶνα
  choice: ne verra jamais
  rationale: La double négation grecque avec l’expression temporelle forme une négation emphatique et durable ; « jamais » la rend naturellement en français sans l’ajout redondant de « pour toujours ».
theological_decisions:
- issue: Nature de la mort promise comme ne devant jamais être vue
  choice: Conserver l’expression « voir la mort » sans préciser sa nature
  alternative: Interpréter explicitement comme la mort spirituelle, la mort éternelle ou la mort physique
  rationale: Le verset crée une tension avec l’expérience de la mort physique et avec la réaction des interlocuteurs au verset suivant. La traduction ne doit pas résoudre cette tension à la place du lecteur.
- issue: Portée de « garder ma parole »
  choice: Employer « garde » sans paraphrase doctrinale
  alternative: « obéit à mon enseignement » ou « croit en moi »
  rationale: Le grec peut inclure fidélité, mise en pratique et attachement ; une paraphrase plus étroite imposerait une interprétation.
translation_notes:
  register: Français international moderne, solennel mais accessible. La ponctuation avec deux-points introduit clairement la déclaration qui suit. La tournure idiomatique « ne verra jamais la mort » conserve l’image et l’emphase du grec.
