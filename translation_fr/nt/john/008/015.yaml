  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς κατὰ τὴν σάρκα κρίνετε, ἐγὼ οὐ κρίνω οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: fr
  text: Vous, vous jugez selon la chair[a] ; moi, je ne juge personne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’après des critères humains » ou « d’après les apparences ».
    reason: Alternative lexicale explicitant deux sens contextuels possibles de l’expression grecque.
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vous, vous
  rationale: Le pronom grec explicite a une valeur contrastive. La dislocation naturelle « Vous, vous » rend cette insistance face à « moi ».
- source_word: κατὰ τὴν σάρκα
  choice: selon la chair
  rationale: 'Cette traduction conserve l’expression johannique et son ambiguïté : elle peut évoquer des critères purement humains, terrestres ou fondés sur l’apparence, sans la réduire à « nature pécheresse ».'
- source_word: κρίνετε
  choice: jugez
  rationale: Le présent actif est rendu directement par le verbe français courant « juger ».
- source_word: ἐγὼ
  choice: moi, je
  rationale: Le pronom grec explicite marque fortement le contraste avec ὑμεῖς ; « moi, je » le restitue naturellement en français.
- source_word: οὐ κρίνω οὐδένα
  choice: je ne juge personne
  rationale: Cette formulation française directe conserve la négation absolue et la brièveté du grec.
theological_decisions:
- issue: Sens de σάρξ dans κατὰ τὴν σάρκα
  choice: selon la chair
  alternative: d’après des critères humains ; d’après les apparences
  rationale: Le contexte suggère un jugement fondé sur des critères humains ou superficiels, mais le maintien de « chair » préserve le vocabulaire de Jean ainsi que la portée et la tension théologiques de l’expression.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise pronominale (« Vous, vous » ; « moi, je ») marque le contraste explicite du grec sans alourdir la phrase.
