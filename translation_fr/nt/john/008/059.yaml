  variant: modern international French
source:
  edition: SBLGNT
  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: fr
  text: Ils ramassèrent donc des pierres pour les lancer contre lui. Mais Jésus se cacha et sortit du Temple[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus précisément : « sortit de l’enceinte du Temple » ou « des cours du Temple ». Le mot grec ἱερόν désigne ici l’ensemble du complexe du Temple, et non le sanctuaire intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: ramassèrent
  rationale: Dans ce contexte hostile, αἴρω décrit le geste de prendre des pierres en main. « Ramassèrent » est naturel en français et rend clairement l’action préparatoire.
- source_word: οὖν
  choice: donc
  rationale: Le mot marque la conséquence de la déclaration précédente de Jésus. « Donc » conserve ce lien logique avec concision.
- source_word: λίθους
  choice: des pierres
  rationale: « Pierres » est le terme français courant et convient au contexte d’une tentative de lapidation.
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: pour les lancer contre lui
  rationale: La construction avec ἵνα exprime ici le but. « Contre lui » rend nettement l’intention hostile et évite l’ambiguïté possible de « les lui jeter ».
- source_word: ἐκρύβη
  choice: se cacha
  rationale: Bien que la forme grecque soit morphologiquement passive, elle peut avoir ici un sens proche du moyen. « Se cacha » est idiomatique et n’introduit aucun agent extérieur.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Ce verbe rend simplement le déplacement hors du lieu et s’accorde naturellement avec le complément qui suit.
- source_word: ἐκ τοῦ ἱεροῦ
  choice: sortit du Temple
  rationale: ἱερόν désigne l’ensemble du complexe du Temple, et non le sanctuaire intérieur. Le texte principal reste fluide, tandis que la note apporte la précision lexicale.
theological_decisions:
- issue: Nature de la fuite de Jésus
  choice: Dire seulement que Jésus se cacha et sortit du Temple.
  alternative: Ajouter qu’il passa miraculeusement au milieu d’eux ou qu’il devint invisible.
  rationale: Le texte grec fourni ne décrit aucun mécanisme miraculeux et ne contient pas les développements présents dans certaines traditions manuscrites plus tardives. La traduction n’ajoute donc rien à ce qu’il affirme.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La majuscule à « Temple » identifie le Temple de Jérusalem. La note est placée après « Temple », le terme qu’elle précise.
