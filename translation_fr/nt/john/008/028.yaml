source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: fr
  text: 'Jésus dit donc : « Quand vous aurez élevé le Fils de l’homme[b], alors vous saurez que je suis[a], et que je ne fais rien de moi-même, mais que je dis ces choses comme le Père me les a enseignées. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec porte simplement : « je suis » (ἐγώ εἰμι), sans prédicat exprimé.'
    reason: alternative_reading
  - marker: b
    text: Dans l’Évangile selon Jean, « élever » peut évoquer à la fois le fait d’être physiquement élevé sur la croix et l’exaltation.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Alors
  rationale: Marque la progression et la conséquence dans l’échange précédent, avec un enchaînement naturel en français moderne.
- source_word: Ὅταν ὑψώσητε
  choice: Quand vous aurez élevé
  rationale: Le futur antérieur rend naturellement l’antériorité de l’action par rapport à « vous saurez ». « Élever » conserve le double sens johannique de mise en hauteur physique et d’exaltation.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Rendu français consacré de cette désignation, qui en préserve les résonances évangéliques et daniéliques.
- source_word: γνώσεσθε
  choice: vous saurez
  rationale: Exprime la prise de conscience future annoncée dans ce contexte; « vous reconnaîtrez » serait plus interprétatif.
- source_word: ἐγώ εἰμι
  choice: moi, je suis
  rationale: Reproduit l’expression grecque sans attribut et en conserve la solennité ainsi que l’ambiguïté, au prix d’une tournure volontairement marquée.
- source_word: ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν
  choice: je ne fais rien de moi-même
  rationale: Préserve l’idée de source ou d’initiative propre sans la développer par une paraphrase interprétative.
- source_word: καθὼς ἐδίδαξέν με ὁ πατὴρ ταῦτα λαλῶ
  choice: je dis ces choses comme le Père me les a enseignées
  rationale: Conserve le rapport de correspondance exprimé par καθώς, le démonstratif ταῦτα et la dépendance de Jésus envers l’enseignement du Père.
theological_decisions:
- issue: Expression absolue ou elliptique ἐγώ εἰμι
  choice: moi, je suis
  alternative: je suis bien celui que j’affirme être
  rationale: Le grec n’exprime aucun attribut. Le texte principal garde cette forme ouverte afin de ne réduire ni sa valeur contextuelle d’identification ni sa possible résonance de révélation divine.
- issue: Portée de ὑψώσητε dans l’Évangile selon Jean
  choice: élevé
  alternative: crucifié / exalté
  rationale: « Élevé » peut évoquer à la fois l’élévation physique sur la croix et l’exaltation; traduire seulement par « crucifié » ou « exalté » supprimerait cette tension johannique.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec lorsque cette proximité porte une ambiguïté théologique réelle; « moi, je suis » est donc volontairement plus marqué que le reste de la phrase.
