id: JHN.8.42
reference: John 8:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: fr
  text: 'Jésus leur dit : « Si Dieu était votre Père, vous m’aimeriez, car je suis venu de Dieu et je suis ici[a]. En effet, je ne suis pas venu de moi-même[b] : c’est lui qui m’a envoyé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « j’ai procédé de Dieu et je suis venu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je ne suis pas venu de ma propre initiative ». Le grec peut souligner soit la provenance (« de moi-même »), soit l’absence d’initiative indépendante.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν, ἠγαπᾶτε ἂν ἐμέ
  choice: Si Dieu était votre Père, vous m’aimeriez
  rationale: L’imparfait dans la proposition introduite par εἰ, associé à l’imparfait avec ἄν dans la principale, exprime une condition contraire aux faits. En français, « si… était… vous aimeriez » rend naturellement cette irréalité.
- source_word: ἐγὼ γὰρ
  choice: car je
  rationale: γάρ introduit la raison pour laquelle ils aimeraient Jésus si Dieu était réellement leur Père. « Car » conserve clairement et dignement ce lien causal.
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον
  choice: je suis venu de Dieu
  rationale: ἐξέρχομαι avec ἐκ indique ici l’origine ou la provenance. « Venir de Dieu » est naturel en français et évite d’introduire dans le texte principal le terme théologique plus technique « procéder ».
- source_word: καὶ ἥκω
  choice: et je suis ici
  rationale: ἥκω désigne l’arrivée avec son résultat présent. « Je suis ici » fait ressortir cette présence actuelle, tout en laissant en note la traduction plus formelle.
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: En effet, je ne suis pas venu de moi-même
  rationale: La locution ἀπ’ ἐμαυτοῦ peut nier l’origine propre ou l’initiative indépendante. « De moi-même » maintient le langage de provenance en parallèle avec « de Dieu », sans exclure la nuance d’initiative.
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: c’est lui qui m’a envoyé
  rationale: La tournure clivée rend l’insistance portée par ἐκεῖνος et conserve le vocabulaire de mission exprimé par ἀποστέλλω.
theological_decisions:
- issue: Rendre le langage concernant l’origine de Jésus sans lui imposer des catégories doctrinales postérieures
  choice: je suis venu de Dieu et je suis ici
  alternative: j’ai procédé de Dieu et je suis venu
  rationale: Le grec affirme fortement l’origine divine et la mission de Jésus, mais emploie ici des verbes ordinaires de sortie, de venue et de présence. Le texte principal reste donc naturel et non technique, tandis que la note signale une formulation plus littérale et traditionnellement chargée.
- issue: Portée de ἀπ’ ἐμαυτοῦ
  choice: je ne suis pas venu de moi-même
  alternative: je ne suis pas venu de ma propre initiative
  rationale: Le grec peut porter sur la source ou sur l’absence d’initiative indépendante. Le choix principal préserve le parallèle avec « de Dieu »; la note conserve explicitement l’autre nuance possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le conditionnel irréel est exprimé idiomatiquement. Les connecteurs « car » et « en effet » préservent la progression argumentative sans lourdeur. Les majuscules à « Père » marquent ici le titre relationnel divin.
