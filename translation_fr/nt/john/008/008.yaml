lexical_decisions:
- source_word: κάτω κύψας
  choice: il se baissa
  rationale: Le participe aoriste κύψας, renforcé par κάτω, décrit le fait de courber le corps vers le bas. « Se baissa » est naturel en français moderne et restitue clairement ce mouvement.
- source_word: πάλιν
  choice: de nouveau
  rationale: Rend la répétition de l’action indiquée par πάλιν, dans un ordre naturel en français.
- source_word: ἔγραφεν
  choice: écrivait
  rationale: L’imparfait grec présente l’action d’écrire dans son déroulement; l’imparfait français en conserve naturellement l’aspect sans préciser ce qui était écrit.
- source_word: εἰς τὴν γῆν
  choice: sur le sol
  rationale: Dans ce contexte, γῆ désigne la surface terrestre immédiate. Malgré la préposition εἰς, le français idiomatique dit « écrire sur le sol ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La formulation conserve l’aspect duratif de l’imparfait grec et n’ajoute aucune hypothèse sur ce que Jésus écrivait.
