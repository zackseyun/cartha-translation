  text: And again[a], he stooped down and wrote on the ground.
translation:
  language: fr
  text: Puis, s’étant de nouveau baissé, il écrivait sur le sol[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Suite du récit de la femme surprise en adultère (Jean 7.53–8.11). Voir la note sur Jean 7.53.
