source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: fr
  text: 'Les Juifs[a] lui dirent donc : « Tu n’as pas encore cinquante ans, et tu as vu Abraham ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens » ou « les chefs juifs », selon la portée donnée ici à l’expression grecque.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: C’est le rendu direct de la désignation narrative grecque. Le contexte immédiat ne limite pas explicitement le groupe aux seuls chefs religieux, tandis que « les Judéens » reste possible selon la portée contextuelle du terme chez Jean.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence ou la réaction découlant de la déclaration précédente de Jésus, dans un français naturel et soutenu.
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: Tu n’as pas encore cinquante ans
  rationale: Le français peut conserver naturellement l’idiome grec qui exprime l’âge avec le verbe « avoir ».
- source_word: ἑώρακας
  choice: tu as vu
  rationale: Le passé composé rend naturellement le parfait grec et son lien avec la situation présente.
- source_word: καὶ
  choice: et
  rationale: Conserve la coordination simple ainsi que la force incrédule de la question sans expliciter davantage le rapport logique.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Portée de οἱ Ἰουδαῖοι dans l’Évangile selon Jean
  choice: les Juifs
  alternative: les Judéens ; les chefs juifs
  rationale: Le texte grec emploie une désignation large sans préciser ici qu’il s’agit uniquement des autorités. Le rendu principal reste donc direct, tandis qu’une note signale les autres portées contextuellement possibles afin de ne pas trancher silencieusement l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe coordonnée et la question incrédule sont conservées au plus près du grec, sans explicitation interprétative.
