  text: ἐγὼ δὲ οὐ ζητῶ τὴν δόξαν μου· ἔστιν ὁ ζητῶν καὶ κρίνων.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: fr
  text: Mais moi, je ne cherche pas ma gloire ; il y a quelqu’un[a] qui la cherche[b] et qui juge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte, « quelqu’un » est généralement compris comme désignant le Père, mais le grec ne le nomme pas explicitement ici.
    reason: alternative_reading
  - marker: b
    text: 'Plus littéralement : « celui qui cherche et qui juge ». L’objet de « cherche » est sous-entendu en grec ; il reprend la gloire de Jésus mentionnée juste avant.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Mais moi
  rationale: Le pronom explicite ἐγώ est conservé pour rendre l’emphase et le contraste ; δέ reçoit ici une valeur adversative naturelle en contexte.
- source_word: οὐ ζητῶ
  choice: je ne cherche pas
  rationale: Le présent est rendu simplement, et « chercher » permet de conserver la répétition lexicale avec ζητῶν dans la seconde proposition.
- source_word: τὴν δόξαν μου
  choice: ma propre gloire
  rationale: δόξα désigne ici la gloire ou l’honneur accordé à une personne. « propre » fait ressortir en français l’idée de ne pas rechercher sa gloire pour soi-même, sans modifier le référent du possessif μου.
- source_word: ἔστιν ὁ ζητῶν
  choice: il y a celui qui la cherche
  rationale: La tournure existentielle rend ἔστιν, tandis que « celui qui » reflète le participe substantivé et défini ὁ ζητῶν. Le pronom « la », nécessaire en français courant, reprend « ma propre gloire » sans ajouter un nouvel objet.
- source_word: καὶ κρίνων
  choice: et qui juge
  rationale: Le second participe substantivé, coordonné au premier, est rendu par une proposition relative parallèle. « Juge » conserve la portée judiciaire possible du verbe sans préciser l’objet ni le résultat du jugement.
theological_decisions:
- issue: Identité de celui qui cherche la gloire de Jésus et qui juge
  choice: Le texte dit seulement « celui », sans le nommer.
  alternative: Expliciter « le Père ».
  rationale: Le contexte johannique conduit couramment à comprendre qu’il s’agit du Père, mais le grec ne l’énonce pas dans ce verset. La traduction maintient donc cette retenue et laisse l’identification au contexte.
- issue: Objet sous-entendu de ζητῶν
  choice: Le pronom « la » reprend la gloire de Jésus mentionnée dans la proposition précédente.
  alternative: Traduire plus littéralement « celui qui cherche et qui juge », sans complément exprimé.
  rationale: Le grec laisse l’objet de ζητῶν sous-entendu. Le français naturel appelle ici un complément ; la reprise pronominale conserve le lien immédiat avec τὴν δόξαν μου tout en signalant cet ajout dans une note.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « cherche » reproduit celle du grec. « Il y a celui » est légèrement marqué en français, mais préserve mieux que « quelqu’un » le caractère défini du participe grec sans identifier explicitement son référent.
