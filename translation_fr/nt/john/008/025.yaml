  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: fr
  text: 'Ils lui demandaient donc : « Toi, qui es-tu ? » Jésus leur répondit : « C’est précisément ce que je vous dis depuis le commencement.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec de la réponse de Jésus est difficile et peut aussi être compris ainsi : « Ce que je vous dis dès le commencement » ou, selon une autre analyse : « Pourquoi donc est-ce que je vous parle ? »'
    reason: Préserver l’ambiguïté syntaxique et sémantique réelle de Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν.
lexical_decisions:
- source_word: ἔλεγον
  choice: demandaient
  rationale: Dans ce dialogue, l’imparfait grec introduit une question répétée ou insistante ; « demandaient » est plus naturel en français que le littéral « disaient ».
- source_word: Σὺ τίς εἶ;
  choice: Toi, qui es-tu ?
  rationale: Le pronom explicite σύ porte une emphase que « Toi » conserve naturellement.
- source_word: Τὴν ἀρχὴν
  choice: depuis le commencement
  rationale: Cette expression difficile peut avoir une valeur temporelle ; cette lecture s’accorde avec le contexte johannique où Jésus affirme avoir déjà déclaré son identité.
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: Précisément ce que je vous dis
  rationale: « Précisément » rend la force de καί dans l’interprétation retenue, tandis que le présent « je vous dis » respecte λαλῶ sans le transformer en passé.
theological_decisions:
- issue: Sens de la réponse énigmatique de Jésus
  choice: « Précisément ce que je vous dis depuis le commencement »
  alternative: « Pourquoi donc est-ce que je vous parle ? » / « Ce que je vous dis dès le commencement »
  rationale: La syntaxe grecque est notoirement ambiguë. Le texte principal suit une lecture ancienne et contextuellement cohérente, sans expliciter l’identité de Jésus au-delà de ses propres paroles ; une note signale les principales autres possibilités.
translation_notes:
  register: Français moderne, international et digne. Le tour dialogué reste direct ; l’emphase de σύ est conservée par « Toi », et l’ambiguïté majeure du grec est documentée sans alourdir le verset.
