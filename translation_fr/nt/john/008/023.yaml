id: JHN.8.23
reference: John 8:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: fr
  text: 'Et il leur disait : « Vous êtes d’en bas[a] ; moi, je suis d’en haut. Vous êtes de ce monde[b] ; moi, je ne suis pas de ce monde. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Vous êtes de ce qui est en bas […] moi, je suis de ce qui est en haut ».
    reason: lexical_alternative
  - marker: b
    text: Dans l’Évangile selon Jean, le « monde » désigne souvent non seulement la terre physique, mais aussi l’ordre humain éloigné de Dieu.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: il leur disait
  rationale: L’imparfait grec est rendu par l’imparfait français, qui conserve naturellement l’aspect duratif de la parole dans le contexte.
- source_word: Ὑμεῖς / ἐγώ
  choice: vous / moi, je
  rationale: Les pronoms grecs explicites marquent fortement l’opposition. La dislocation « moi, je » restitue cette insistance de façon idiomatique en français.
- source_word: ἐκ τῶν κάτω
  choice: d’en bas
  rationale: Cette formulation concise maintient l’image verticale et la notion d’origine ou de provenance sans réduire la métaphore à une interprétation morale précise.
- source_word: ἐκ τῶν ἄνω
  choice: d’en haut
  rationale: Le choix fait pendant à « d’en bas » et préserve l’antithèse spatiale et théologique du grec.
- source_word: κόσμος
  choice: monde
  rationale: « Monde » conserve l’ampleur sémantique de κόσμος et son usage johannique, sans imposer une paraphrase telle que « ordre humain ».
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: de ce monde
  rationale: Le démonstratif est conservé, ainsi que la répétition de la construction marquant l’origine ou la sphère d’appartenance.
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: je ne suis pas de ce monde
  rationale: Cette traduction reprend littéralement et naturellement la construction avec ἐκ, tout en évitant de la remplacer par la seule idée d’appartenance.
theological_decisions:
- issue: Sens de l’opposition entre « d’en bas / d’en haut » et « de ce monde »
  choice: Conserver le langage d’origine et de sphère au moyen des expressions « d’en bas », « d’en haut » et « de ce monde ».
  alternative: Expliciter l’opposition comme étant morale, ou comme opposant directement la terre au ciel.
  rationale: Le texte établit une distinction johannique forte entre Jésus et ses interlocuteurs, mais ne développe pas ici toute sa portée doctrinale. La formulation retenue préserve l’image et sa tension christologique sans les réduire à une seule explication.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait « disait » garde l’aspect du grec ; « moi, je » souligne l’opposition explicite sans lourdeur excessive. Les expressions parallèles et répétées sont conservées pour respecter la structure rhétorique du verset.
