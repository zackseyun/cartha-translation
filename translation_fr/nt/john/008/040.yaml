id: JHN.8.40
reference: John 8:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: fr
  text: Mais maintenant, vous cherchez à me tuer, moi, un homme qui vous a dit la vérité que j’ai entendue de Dieu. Abraham n’a pas fait cela.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Mais maintenant
  rationale: Rend à la fois le contraste marqué par δέ et la valeur temporelle de νῦν dans un français naturel.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: vous cherchez à me tuer
  rationale: Préserve la poursuite intentionnelle exprimée par ζητέω suivi de l’infinitif, sans renforcer le sens jusqu’à « assassiner ».
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Rend directement le nom masculin singulier par lequel Jésus se désigne et maintient clairement son humanité.
- source_word: τὴν ἀλήθειαν
  choice: la vérité
  rationale: Conserve l’article défini et l’idée d’un contenu déterminé communiqué par Jésus.
- source_word: ὑμῖν λελάληκα
  choice: qui vous ai dit
  rationale: Le passé composé exprime naturellement en français l’action accomplie dont la portée demeure présente; l’accord à la première personne est requis puisque le relatif « qui » reprend « moi ».
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: que j’ai entendue de Dieu
  rationale: « De Dieu » exprime sobrement la source indiquée par παρά avec le génitif, sans remplacer « Dieu » par un titre plus précis absent du texte.
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: Abraham n’a pas fait cela
  rationale: Suit de près l’ordre de sens du grec et laisse « cela » renvoyer à la conduite qui vient d’être décrite, sans l’expliciter davantage.
theological_decisions:
- issue: La désignation de Jésus par ἄνθρωπον
  choice: un homme
  alternative: un être humain
  rationale: « Un homme » est le sens contextuel direct et naturel; il affirme l’humanité de Jésus sans rien ajouter ni retrancher concernant sa divinité.
- issue: La source du message dans παρὰ τοῦ θεοῦ
  choice: de Dieu
  alternative: du Père
  rationale: Le texte grec dit explicitement « Dieu »; employer « le Père » importerait ici une précision théologique venant d’autres passages.
- issue: Le référent de τοῦτο
  choice: cela
  alternative: agir ainsi
  rationale: Le démonstratif reste volontairement peu explicité dans le grec. « Cela » préserve cette portée, tandis que « agir ainsi » interpréterait plus nettement le référent comme une manière générale d’agir.
translation_notes:
  register: Français international moderne, clair et digne. La dislocation « moi, un homme » conserve l’apposition grecque et son relief rhétorique. Aucun marqueur de note n’est nécessaire.
