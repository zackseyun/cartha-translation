source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: fr
  text: 'Mais, même si je juge[a], mon jugement est vrai, car je ne suis pas seul : le Père qui m’a envoyé est avec moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « si je juge » ou « si je venais à juger ». L’expression conditionnelle grecque peut se traduire de façon plus formelle, mais elle a probablement ici un sens concessif : « même si je juge ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: même si je juge
  rationale: La construction ἐὰν avec le subjonctif présent exprime une éventualité conditionnelle. Dans le contexte, « même si je juge » rend naturellement sa valeur concessive, sans exclure les traductions plus formelles signalées en note.
- source_word: δὲ
  choice: Mais
  rationale: δέ marque ici un contraste avec l’affirmation précédente et se rend naturellement par « Mais ».
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: mon jugement
  rationale: Cette formulation française est naturelle et conserve la nuance judiciaire de κρίσις dans le passage.
- source_word: ἀληθινή
  choice: vrai
  rationale: « Vrai » préserve la portée johannique de ἀληθινή, qui peut évoquer à la fois la vérité et le caractère fondé ou valide du jugement.
- source_word: μόνος οὐκ εἰμί
  choice: je ne suis pas seul
  rationale: Cette traduction directe conserve l’idée que Jésus ne juge pas isolément.
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: il y a moi et le Père qui m’a envoyé
  rationale: Cette tournure explicite en français courant la coordination elliptique du grec et présente Jésus avec le Père comme n’étant pas seuls, tout en conservant la fonction identificatrice du participe πέμψας.
theological_decisions:
- issue: Rapport entre le jugement de Jésus et le Père qui l’a envoyé
  choice: Le jugement de Jésus est vrai parce qu’il n’est pas porté indépendamment du Père qui l’a envoyé.
  alternative: On pourrait comprendre le verset plus étroitement comme un argument juridique sur le témoignage, sans en développer les implications théologiques.
  rationale: Le texte fonde explicitement la vérité du jugement de Jésus sur le fait qu’il n’est pas seul et sur la présence du Père qui l’a envoyé. La traduction maintient cette affirmation sans la développer au moyen de formulations doctrinales postérieures.
translation_notes:
  register: Français international moderne, digne et accessible. « Jugement » conserve la tonalité judiciaire du contexte. Les deux-points rendent lisible l’opposition elliptique du grec entre « pas seul » et « moi et le Père ».
