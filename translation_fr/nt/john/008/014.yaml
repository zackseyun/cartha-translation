source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: fr
  text: 'Jésus leur répondit : « Même si je témoigne à mon sujet[a], mon témoignage est vrai, car je sais d’où je suis venu et où je vais. Mais vous, vous ne savez pas d’où je viens ni où je vais[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je rends témoignage à mon sujet ».
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits lisent « et où je vais » au lieu de « ou où je vais » ; après la négation, « ou » est rendu par « ni » en français.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Jésus leur répondit
  rationale: En français moderne, « répondit » exprime naturellement la formule narrative grecque « répondit et dit » sans lourdeur ni perte de sens.
- source_word: Κἂν
  choice: Même si
  rationale: Cette tournure conserve la valeur concessive de la proposition.
- source_word: μαρτυρῶ περὶ ἐμαυτοῦ
  choice: je témoigne à mon propre sujet
  rationale: « Témoigner » garde la nuance testimoniale et quasi judiciaire du verbe, tandis que « à mon propre sujet » rend περί avec précision sans ajouter l’idée d’une défense intéressée.
- source_word: ἀληθής ἐστιν ἡ μαρτυρία μου
  choice: mon témoignage est vrai
  rationale: Cette formulation directe préserve le vocabulaire johannique de la vérité sans réduire le propos à la seule validité juridique.
- source_word: ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω
  choice: car je sais d’où je suis venu et où je vais
  rationale: « Car » indique clairement le fondement de l’affirmation; le passé composé et le présent idiomatique rendent respectivement l’origine et la destination exprimées en grec.
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: Mais vous, vous ne savez pas
  rationale: La dislocation française souligne naturellement le pronom grec explicite et fait ressortir le contraste avec le savoir de Jésus.
- source_word: πόθεν ἔρχομαι ἢ ποῦ ὑπάγω
  choice: d’où je viens ni où je vais
  rationale: Après la négation, « ni » est la coordination française naturelle correspondant ici à ἢ, tout en conservant les deux objets de l’ignorance.
theological_decisions:
- issue: Nature du témoignage que Jésus se rend à lui-même
  choice: Présenter son témoignage comme vrai en raison de sa connaissance de son origine et de sa destination.
  alternative: Employer « juridiquement valable » ou expliciter une origine céleste et une destination divine.
  rationale: Le verset affirme la vérité du témoignage et en donne la raison, mais il ne formule pas ici explicitement les conclusions juridiques ou christologiques plus larges. La traduction laisse ces dimensions se dégager du contexte de Jean.
translation_notes:
  register: Français international moderne, digne et accessible. La formule grecque redondante « répondit et dit » est rendue idiomatiquement par « répondit ». Le contraste porté par ὑμεῖς est conservé au moyen de « Mais vous, vous… ».
