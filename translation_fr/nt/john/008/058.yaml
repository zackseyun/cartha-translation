  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: fr
  text: 'Jésus leur dit : « En vérité, en vérité, je vous le dis : avant qu’Abraham vienne à l’existence[a], moi, je suis[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « avant la naissance d’Abraham ». Le verbe grec a un sens plus large : « venir à l’existence » ou « commencer à exister ».'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait reformuler : « moi, j’existe déjà » ou « j’étais déjà là ». Le grec dit littéralement « moi, je suis » et conserve le présent, avec sa possible résonance théologique.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: Jésus leur dit
  rationale: Rend directement l’introduction narrative grecque dans un français naturel et concis.
- source_word: Ἀμὴν ἀμὴν
  choice: En vérité, en vérité
  rationale: Préserve la répétition solennelle et emphatique de la formule johannique tout en restant intelligible en français moderne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formulation française idiomatique qui conserve l’adresse directe et solennelle.
- source_word: πρὶν
  choice: avant que
  rationale: Équivalent temporel normal en français, introduisant ici une proposition au subjonctif.
- source_word: γενέσθαι
  choice: vienne à l’existence
  rationale: Préserve le sens large de γίνομαι et son contraste avec ἐγὼ εἰμί, sans limiter le propos à la naissance physique d’Abraham.
- source_word: ἐγὼ εἰμί
  choice: moi, je suis
  rationale: Conserve le présent grec ainsi que le pronom sujet emphatique. Cette formulation maintient la force inhabituelle et la possible résonance théologique de l’expression.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Forme française traditionnelle et standard du nom propre.
theological_decisions:
- issue: Traduction de ἐγὼ εἰμί dans un contexte christologique
  choice: moi, je suis
  alternative: moi, j’existe déjà / j’étais déjà là
  rationale: Le grec emploie explicitement le présent et une formulation absolue. La traduction retenue préserve cette tension et sa possible résonance avec l’auto-identification divine, sans l’imposer par une explication dans le texte principal. Une reformulation temporelle serait plus fluide, mais réduirait la portée de l’expression à la seule préexistence.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « En vérité, en vérité » garde la solennité propre à Jean. Le contraste verbal entre l’entrée d’Abraham dans l’existence et le présent « moi, je suis » est volontairement maintenu. Les appels de notes sont placés sur les expressions qu’ils expliquent.
