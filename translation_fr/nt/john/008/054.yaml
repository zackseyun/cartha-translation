  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: fr
  text: 'Jésus répondit : « Si je me glorifie moi-même, ma gloire n’est rien. C’est mon Père qui me glorifie, celui dont vous dites qu’il est notre Dieu[a], »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Certains manuscrits portent « votre Dieu » au lieu de « notre Dieu ».
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Rendu narratif courant et digne de ἀποκρίνομαι dans un dialogue.
- source_word: δοξάσω / δόξα / δοξάζων
  choice: me glorifie / gloire / glorifie
  rationale: La famille lexicale « glorifier/gloire » conserve la répétition grecque et le thème johannique de la gloire.
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: ma gloire n’est rien
  rationale: Traduction proche de la formulation grecque, naturelle en français et sans explicitation interprétative.
- source_word: ὁ πατήρ μου ὁ δοξάζων με
  choice: C’est mon Père qui me glorifie
  rationale: La construction clivée rend naturellement en français l’identification emphatique portée par ἔστιν et le participe substantivé.
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: 'lui dont vous dites : « Il est notre Dieu »'
  rationale: Cette formulation conserve le référent du relatif et présente clairement comme propos attribué l’affirmation introduite par λέγετε ὅτι.
- source_word: θεὸς ἡμῶν
  choice: notre Dieu
  rationale: Suit le texte principal du SBLGNT, ἡμῶν, et identifie naturellement le Dieu d’Israël.
theological_decisions:
- issue: Pronom dans θεὸς ἡμῶν/ὑμῶν ἐστιν
  choice: notre Dieu
  alternative: votre Dieu
  rationale: Le texte principal suit ἡμῶν dans le SBLGNT. La variante ὑμῶν, porteuse d’une nuance significative dans le contexte de controverse, est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « glorifie/gloire/glorifie » est volontaire afin de préserver la cohésion lexicale et théologique du grec. Le marqueur [a] est placé immédiatement après la leçon concernée.
