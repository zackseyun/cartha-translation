source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: fr
  text: Et pourtant, vous ne le connaissez pas[a], tandis que moi, je le connais. Si je disais[b] que je ne le connais pas, je serais un menteur comme vous. Mais je le connais et je garde sa parole[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « vous n’êtes pas parvenus à le connaître ». Le verbe grec est au parfait et peut souligner qu’ils demeurent sans véritable connaissance de lui.'
    reason: lexical_alternative
  - marker: b
    text: 'On pourrait aussi traduire : « si je dis » ou « même si je dis ». La tournure grecque présente ici une déclaration hypothétique ; « si je disais » en exprime naturellement la portée rhétorique en français.'
    reason: lexical_alternative
  - marker: c
    text: « Garder » peut aussi se traduire par « observer » ou « obéir à ». Chez Jean, le verbe peut évoquer le fait de rester fidèlement attaché à la parole de Dieu et de la mettre en pratique.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: vous ne le connaissez pas
  rationale: Le parfait grec décrit ici un défaut de connaissance qui demeure. Le présent français exprime naturellement cet état actuel, sans la possible ambiguïté de « vous ne l’avez pas connu », qui peut évoquer une personne disparue ou une simple fréquentation.
- source_word: οἶδα
  choice: je le connais
  rationale: Bien que parfait par sa forme, οἶδα fonctionne comme un verbe d’état au présent. « Je le connais » rend clairement cette valeur dans les deux occurrences.
- source_word: κἂν εἴπω
  choice: si je disais
  rationale: La construction introduit une supposition irréelle dans le contexte. L’imparfait français rend avec naturel l’idée d’une déclaration hypothétique contraire à la réalité affirmée par Jésus.
- source_word: ἔσομαι
  choice: je serais
  rationale: Le futur grec constitue la conséquence de la proposition conditionnelle. Le conditionnel français est la forme idiomatique après « si je disais ».
- source_word: ὅμοιος ὑμῖν ψεύστης
  choice: un menteur comme vous
  rationale: Cette formulation conserve le nom accusateur ψεύστης et la comparaison directe avec les interlocuteurs, sans atténuer la confrontation.
- source_word: τὸν λόγον αὐτοῦ
  choice: sa parole
  rationale: « Sa parole » conserve la diction johannique et laisse λόγος désigner à la fois ce que Dieu dit et le message qu’il révèle.
- source_word: τηρῶ
  choice: je garde
  rationale: '« Garder » préserve l’étendue de τηρέω : observer fidèlement, respecter et conserver. Le terme n’est ainsi pas réduit à la seule idée d’obéissance à une règle.'
- source_word: καὶ ... δὲ
  choice: Et pourtant ... tandis que moi
  rationale: « Et pourtant » fait ressortir la valeur contrastive du début, et « tandis que moi » marque nettement l’opposition entre les interlocuteurs et Jésus.
theological_decisions:
- issue: La connaissance de Dieu revendiquée par Jésus en contraste avec celle de ses interlocuteurs
  choice: Présenter sans ajout la connaissance réelle que Jésus affirme avoir de Dieu ainsi que sa fidélité à sa parole.
  alternative: Expliciter dans la traduction la filiation divine unique de Jésus, ou atténuer « connaître » au sens de simple acquaintance.
  rationale: Le verset établit lui-même un contraste tranché entre Jésus et ses interlocuteurs quant à la connaissance de Dieu et à la fidélité envers sa parole. La traduction en maintient la force sans ajouter une explication doctrinale absente de cette phrase.
translation_notes:
  register: Français international moderne, digne et direct. La répétition de « je le connais » est conservée parce qu’elle structure le contraste du texte grec. « Sa parole » maintient le vocabulaire johannique, et le tutoiement collectif est évité au profit du « vous » adressé aux interlocuteurs.
