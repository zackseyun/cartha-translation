  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: fr
  text: 'Les Juifs[a] répondirent en lui disant : « N’avons-nous pas raison de dire que tu es un Samaritain et que tu as un démon[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’Évangile selon Jean, l’expression « les Juifs » désigne souvent, selon le contexte, un groupe particulier d’opposants à Jésus, et non tous les Juifs sans exception. On pourrait aussi traduire, dans certains contextes, « les Judéens » ou « les chefs juifs ».
    reason: alternative_reading
  - marker: b
    text: 'Littéralement : « tu as un démon » ; cette accusation peut aussi être rendue de manière plus interprétative par « tu es possédé par un démon ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ
  choice: Les Juifs lui répondirent
  rationale: Le grec emploie littéralement deux verbes, « répondirent et dirent ». En français moderne, « lui répondirent » exprime naturellement les deux éléments sans lourdeur narrative.
- source_word: οἱ Ἰουδαῖοι
  choice: Les Juifs
  rationale: C’est la correspondance directe du grec. Le contexte johannique peut viser un groupe précis d’opposants juifs, mais le verset ne dit explicitement ni « chefs juifs » ni « Judéens ».
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: N’avons-nous pas raison de dire
  rationale: La question négative attend une réponse affirmative, et καλῶς signifie ici « à juste titre » ou « avec raison ». Cette formulation en restitue naturellement la force rhétorique.
- source_word: Σαμαρίτης εἶ σὺ
  choice: tu es un Samaritain
  rationale: Traduction directe de la désignation ethnique et religieuse, employée ici comme accusation insultante.
- source_word: δαιμόνιον ἔχεις
  choice: tu as un démon
  rationale: La formulation conserve l’expression littérale du grec, sans l’interpréter davantage par « tu es possédé ».
theological_decisions:
- issue: Référent de οἱ Ἰουδαῖοι dans Jean
  choice: Les Juifs
  alternative: les Judéens ; les chefs juifs
  rationale: La traduction principale suit le libellé grec sans préciser davantage le groupe. Une note prévient toutefois qu’en contexte johannique cette expression désigne souvent des opposants particuliers de Jésus, et non l’ensemble du peuple juif.
- issue: Portée de δαιμόνιον ἔχεις
  choice: tu as un démon
  alternative: tu es possédé par un démon
  rationale: La traduction retenue préserve l’expression grecque et évite de déterminer plus précisément la nature ou le degré de l’emprise supposée.
translation_notes:
  register: Français international moderne, digne et accessible. La redondance grecque « répondirent et dirent » est allégée en « lui répondirent », tandis que la question accusatrice et l’expression concrète « avoir un démon » sont conservées.
