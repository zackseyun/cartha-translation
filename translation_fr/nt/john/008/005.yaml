  source_fidelity: 'Le texte français rend fidèlement la structure et le sens du grec : Ἐν δὲ τῷ νόμῳ ἡμῶν est bien représenté par « Dans notre Loi »; Μωσῆς ἐνετείλατο par « Moïse nous a ordonné »; τὰς τοιαύτας conserve le féminin pluriel avec « de telles femmes »; et λιθοβολεῖσθαι est correctement rendu par « de lapider ». « Toi donc, qu’en dis-tu ? » restitue à la fois l’insistance de σύ et l’inférence argumentative de οὖν.'
  naturalness: Le français est naturel, moderne et d’un registre approprié. La tournure « ordonner de lapider » est idiomatique. La reprise explicite « Toi » est légèrement marquée, mais elle est justifiée par le pronom grec explicite et convient au défi adressé à Jésus.
