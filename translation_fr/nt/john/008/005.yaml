source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἐν δὲ τῷ νόμῳ ἡμῶν Μωσῆς ἐνετείλατο τὰς τοιαύτας λιθοβολεῖσθαι· σὺ οὖν τί λέγεις;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/005.yaml
  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: fr
  text: '[a] Dans notre Loi, Moïse nous a ordonné de lapider de telles femmes. Toi donc, qu’en dis-tu ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Suite du récit de la femme surprise en adultère (Jean 7.53–8.11). Voir la note sur Jean 7.53.
    reason: textual_critical
lexical_decisions:
- source_word: τὰς τοιαύτας
  choice: de telles femmes
  rationale: Le féminin pluriel désigne des femmes de cette sorte, dans le contexte celles qui sont prises en adultère. Cette formulation reste naturelle sans ajouter « adultères », absent de l’expression grecque.
- source_word: λιθοβολεῖσθαι
  choice: de lapider
  rationale: L’infinitif passif grec exprime la peine capitale par lapidation. Après « ordonner », le français emploie naturellement l’infinitif actif avec la personne condamnée comme complément.
- source_word: ἐνετείλατο
  choice: nous a ordonné
  rationale: Le verbe exprime un commandement ayant autorité. Le pronom « nous » rend le rapport implicite entre le commandement de Moïse et « notre Loi » sans modifier son contenu.
- source_word: σὺ οὖν τί λέγεις
  choice: Toi donc, qu’en dis-tu ?
  rationale: « Toi » conserve l’insistance portée par le pronom grec explicite, et « donc » rend la valeur argumentative de οὖν.
theological_decisions:
- issue: Portée de la prescription mosaïque
  choice: de lapider de telles femmes
  alternative: de lapider de telles femmes à mort
  rationale: Le texte évoque clairement la peine de lapidation, mais n’explicite pas séparément « à mort » ; l’ajout n’est donc pas nécessaire.
translation_notes:
  register: Français moderne, international et digne. La majuscule à « Loi » désigne ici la Loi de Moïse. L’ordre des mots met en relief « Toi », comme le grec.
