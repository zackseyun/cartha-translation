lexical_decisions:
- source_word: Ἄγουσιν
  choice: amènent
  rationale: 'Le présent historique grec est conservé en français : il rend la scène immédiate et reste naturel dans un récit.'
- source_word: οἱ γραμματεῖς
  choice: les spécialistes de la Loi
  rationale: Dans ce contexte juif, le terme désigne des experts et enseignants des Écritures et de la Loi, plutôt que de simples copistes ; cette formulation est claire en français moderne.
- source_word: ἐν μοιχείᾳ κατειλημμένην
  choice: surprise en adultère
  rationale: Le participe parfait passif indique qu’elle a été prise sur le fait ; « surprise en adultère » est une expression française naturelle et précise.
- source_word: στήσαντες αὐτὴν
  choice: la placent
  rationale: Le participe aoriste décrit le fait de la faire tenir à un endroit déterminé ; « la placent » exprime naturellement cette action délibérée.
- source_word: ἐν μέσῳ
  choice: au milieu du groupe
  rationale: Le grec signifie littéralement « au milieu » ; l’ajout explicatif « du groupe » rend la scène intelligible sans identifier plus précisément les personnes présentes que ne le fait le texte.
