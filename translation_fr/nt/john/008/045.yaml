  text: ἐγὼ δὲ ὅτι τὴν ἀλήθειαν λέγω, οὐ πιστεύετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: fr
  text: Mais moi, parce que je dis la vérité[a], vous ne me croyez pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La conjonction grecque peut aussi être comprise comme introduisant une proposition complétive (« que »), mais elle exprime très probablement ici la cause : « parce que ».'
    reason: Alternative lexicale et syntaxique pour ὅτι ; la note préserve l’ambiguïté possible sans répéter le texte principal.
lexical_decisions:
- source_word: ἐγὼ
  choice: moi, je
  rationale: Le pronom sujet explicite est rendu par la dislocation emphatique « moi, je », naturelle en français et propre à préserver le contraste avec les interlocuteurs.
- source_word: δὲ
  choice: Mais
  rationale: Dans le contexte, δέ marque un contraste avec ce qui précède ; « Mais » en restitue clairement la valeur adversative.
- source_word: ὅτι
  choice: parce que
  rationale: 'La conjonction est comprise ici dans son sens causal : c’est parce que Jésus dit la vérité que ses interlocuteurs ne le croient pas. Cette lecture convient à la syntaxe et à l’ironie du contexte.'
- source_word: τὴν ἀλήθειαν
  choice: la vérité
  rationale: Équivalent français direct et usuel, qui conserve naturellement l’article.
- source_word: λέγω
  choice: je dis
  rationale: Le présent grec est conservé au présent. « Dire la vérité » est l’expression française idiomatique correspondante.
- source_word: οὐ πιστεύετέ μοι
  choice: vous ne me croyez pas
  rationale: Avec le datif personnel, πιστεύω signifie ici croire quelqu’un. Cette formulation directe conserve le rejet personnel du témoignage de Jésus sans explicitation ajoutée.
theological_decisions:
- issue: Valeur de ὅτι dans le rapport entre la parole vraie de Jésus et l’incrédulité de ses interlocuteurs
  choice: 'Lecture causale : « parce que moi, je dis la vérité »'
  alternative: 'Lecture déclarative ou plus formelle : « que moi, je dis la vérité »'
  rationale: 'L’enchaînement du discours favorise la valeur causale : contrairement au diable mentionné dans le contexte, Jésus dit la vérité, et ses interlocuteurs refusent précisément pour cela de le croire. Ce choix syntaxique préserve l’ironie du passage sans y ajouter une conclusion doctrinale.'
translation_notes:
  register: Français international moderne, naturel et digne. La tournure emphatique « moi, je » rend l’insistance de ἐγώ sans lourdeur excessive ; « dire la vérité » et « ne pas croire quelqu’un » sont idiomatiques et accessibles.
