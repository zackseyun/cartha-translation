  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: fr
  text: 'Jésus leur répondit : « Amen, amen, je vous le dis : quiconque pratique le péché[a] est esclave du péché. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « quiconque fait le péché ». Le participe grec peut désigner une conduite suivie ou caractéristique; « pratique le péché » exprime cette nuance dans un français naturel. Le mot grec δοῦλος peut aussi être rendu par « serviteur », mais « esclave » conserve ici la force de l’image d’asservissement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: Jésus leur répondit
  rationale: Formulation narrative naturelle en français, qui conserve la valeur de réponse du verbe ἀποκρίνομαι.
- source_word: Ἀμὴν ἀμὴν
  choice: Oui, vraiment
  rationale: Cette formule solennelle et emphatique rend le redoublement johannique de ἀμήν dans un français actuel. « Amen, amen » serait plus formel, mais moins immédiatement intelligible pour certains lecteurs.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Rend fidèlement la formule déclarative tout en respectant l’idiome français, qui appelle ici le pronom « le ».
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: quiconque pratique le péché
  rationale: Le participe présent substantivé peut désigner une conduite caractéristique ou suivie. « Pratique le péché » en fait ressortir la portée sans exclure l’alternative plus littérale signalée en note.
- source_word: δοῦλος
  choice: esclave
  rationale: Le contexte porte sur l’asservissement et la perte de liberté; « esclave » conserve donc mieux la force de la métaphore que « serviteur ».
- source_word: τῆς ἁμαρτίας
  choice: du péché
  rationale: 'Le génitif exprime l’appartenance ou la domination : la personne se trouve sous la maîtrise du péché.'
theological_decisions:
- issue: Portée du participe présent ποιῶν
  choice: quiconque pratique le péché
  alternative: quiconque commet le péché
  rationale: Le présent peut évoquer une activité suivie ou caractéristique, mais cette nuance ne doit pas être transformée en affirmation doctrinale plus précise que le grec. La note conserve la traduction plus formelle.
- issue: Force de la métaphore δοῦλος
  choice: esclave du péché
  alternative: serviteur du péché
  rationale: Dans l’échange sur la liberté et l’esclavage, « esclave » exprime clairement la domination exercée par le péché, sans atténuer la tension théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La formule « Oui, vraiment » garde l’emphase de Ἀμὴν ἀμὴν sans employer une translittération potentiellement opaque. La note réunit les deux principales ambiguïtés lexicales sans les résoudre silencieusement.
