id: JHN.8.12
reference: John 8:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: fr
  text: 'Jésus leur parla donc de nouveau : « Je suis la lumière du monde. Celui qui me suit ne marchera certainement pas dans les ténèbres[a], mais il aura la lumière de la vie[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne marchera jamais dans les ténèbres ». Le grec emploie ici une négation fortement renforcée (οὐ μὴ).'
    reason: lexical_alternative
  - marker: b
    text: « La lumière de la vie » peut aussi se comprendre comme « la lumière qui donne la vie ».
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: donc de nouveau
  rationale: « De nouveau » exprime la reprise signalée par Πάλιν, tandis que « donc » maintient la liaison discursive de οὖν sans lui donner une force logique excessive.
- source_word: ἐλάλησεν ὁ Ἰησοῦς λέγων
  choice: 'Jésus leur parla :'
  rationale: Cette formulation française naturelle rend l’acte de parler et introduit directement les paroles, sans reproduire lourdement le participe λέγων par « en disant ».
- source_word: Ἐγώ εἰμι
  choice: Je suis
  rationale: Rend directement l’expression copulative liée ici à l’attribut « la lumière du monde », sans ajouter dans la traduction une interprétation théologique explicite.
- source_word: τὸ φῶς τοῦ κόσμου
  choice: la lumière du monde
  rationale: Équivalent précis et idiomatique qui conserve l’image johannique et la portée de κόσμος.
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: Celui qui me suit
  rationale: Conserve la forme représentative au singulier du participe substantivé grec dans un français courant.
- source_word: οὐ μὴ περιπατήσῃ
  choice: ne marchera certainement pas
  rationale: La tournure exprime la négation grecque fortement renforcée οὐ μὴ, tout en gardant la métaphore de la marche.
- source_word: ἐν τῇ σκοτίᾳ
  choice: dans les ténèbres
  rationale: « Les ténèbres » est l’expression française naturelle et dignifiée qui rend le caractère défini, presque conçu comme un domaine, de l’expression grecque.
- source_word: ἕξει
  choice: il aura
  rationale: Rend simplement et naturellement le futur de ἔχω.
- source_word: τὸ φῶς τῆς ζωῆς
  choice: la lumière de la vie
  rationale: Conserve la construction génitive compacte et son ouverture sémantique, au lieu de la réduire à l’idée de lumière qui donne la vie.
theological_decisions:
- issue: Portée de l’affirmation Ἐγώ εἰμι
  choice: Traduire simplement « Je suis » dans la proposition « Je suis la lumière du monde ».
  alternative: Employer une tournure plus appuyée comme « Moi, je suis » pour suggérer un écho théologique particulier.
  rationale: Ici, Ἐγώ εἰμι est grammaticalement lié à l’attribut « la lumière du monde ». La traduction suit cette syntaxe sans exclure les résonances johanniques plus larges ni les imposer.
- issue: Sens de « la lumière de la vie »
  choice: Conserver la formulation « la lumière de la vie ».
  alternative: Traduire « la lumière qui donne la vie » ou « la lumière vivifiante ».
  rationale: Le rapport exprimé par le génitif τῆς ζωῆς peut être compris de plusieurs manières. La formulation littérale préserve cette richesse et cette ambiguïté théologique.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe évite le calque lourd « parla en disant », tout en conservant les images centrales de la lumière, des ténèbres et de la marche. Les deux notes sont placées auprès des expressions auxquelles elles se rapportent.
