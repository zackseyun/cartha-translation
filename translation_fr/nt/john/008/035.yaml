id: JHN.8.35
reference: John 8:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: fr
  text: L’esclave[a] ne demeure pas pour toujours dans la maison ; le fils[b], lui, y demeure pour toujours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le grec doulos peut avoir les deux sens, mais « esclave » souligne mieux ici le contraste de statut avec le fils.
    reason: lexical_alternative
  - marker: b
    text: Dans ce propos qui a la forme d’une maxime, « le fils » peut aussi faire implicitement référence à Jésus, compte tenu du contexte et du verset suivant.
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: esclave
  rationale: « Esclave » rend le statut de dépendance exprimé par δοῦλος et fait ressortir le contraste avec le fils, dont la place dans la maison est permanente. « Serviteur » atténuerait ici cette différence de statut.
- source_word: μένει
  choice: demeure
  rationale: « Demeure » exprime la permanence du statut et convient aux deux occurrences. La répétition est conservée afin de reproduire la structure contrastée du grec.
- source_word: οἰκία
  choice: maison
  rationale: « Maison » est naturel en français et peut désigner ici non seulement le bâtiment, mais aussi le cadre familial auquel appartiennent l’esclave et le fils.
- source_word: εἰς τὸν αἰῶνα
  choice: pour toujours
  rationale: Cette expression française courante rend clairement l’idée de permanence dans chacune des deux propositions.
- source_word: υἱός
  choice: fils
  rationale: Le grec emploie le masculin singulier et oppose précisément le fils à l’esclave dans le cadre de la maison. La minuscule maintient à la fois la portée proverbiale et l’éventuel écho christologique.
- source_word: δέ
  choice: non exprimé séparément
  rationale: Le contraste est déjà clairement porté en français par les deux propositions parallèles et par « lui ». Ajouter « or » ou « mais » alourdirait la phrase ou accentuerait inutilement la valeur adversative.
theological_decisions:
- issue: Éventuelle résonance christologique de « le fils »
  choice: « le fils » avec une minuscule, accompagné d’une note
  alternative: « le Fils »
  rationale: La formule décrit de manière proverbiale la différence de statut entre un esclave et un fils, tout en préparant l’application que Jésus fait au verset suivant. La minuscule évite de transformer prématurément le terme en titre explicite, tandis que la note signale la possible résonance contextuelle.
translation_notes:
  register: Français moderne, sobre et digne. « Le fils, lui » marque naturellement le contraste sans ajouter un connecteur plus fort que le grec. Le pronom « y » évite une répétition lourde de « dans la maison », tandis que la reprise de « demeure » et de « pour toujours » conserve le parallélisme de l’original.
