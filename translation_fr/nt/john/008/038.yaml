  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: fr
  text: Je dis ce que j’ai vu auprès du Père[a] ; vous aussi, donc, faites ce que vous avez entendu de votre père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Je dis les choses que j’ai vues auprès du Père ; vous aussi, donc, faites les choses que vous avez entendues de votre père. » La dernière forme verbale peut aussi se comprendre comme un indicatif : « vous faites ». Le grec dit littéralement « le père » dans la seconde proposition, mais le contexte implique « votre père » ; son identité est précisée au verset 44.'
    reason: La note conserve la formulation plus formelle, l’ambiguïté grammaticale de ποιεῖτε et le caractère implicite de la seconde référence au père.
lexical_decisions:
- source_word: ἃ
  choice: ce que
  rationale: Le pronom relatif neutre pluriel introduit ici naturellement en français le contenu de la parole et de l’action.
- source_word: ἑώρακα
  choice: j’ai vu
  rationale: Le passé composé rend naturellement le parfait grec et la pertinence actuelle de ce que Jésus a vu.
- source_word: παρὰ τῷ πατρὶ
  choice: auprès du Père
  rationale: παρά avec le datif exprime ici la proximité ou la présence, plutôt qu’une simple provenance.
- source_word: λαλῶ
  choice: je dis
  rationale: Avec « ce que » comme complément direct, « je dis » restitue clairement et naturellement l’idée de parler.
- source_word: καὶ ὑμεῖς οὖν
  choice: vous aussi, donc
  rationale: La formulation conserve à la fois le contraste explicite porté par ὑμεῖς, la coordination καί et la valeur inférentielle ou conclusive de οὖν.
- source_word: ἃ ἠκούσατε
  choice: ce que vous avez entendu
  rationale: Le passé composé convient au français moderne et souligne que ce qu’ils ont entendu détermine leur conduite présente.
- source_word: παρὰ τοῦ πατρὸς
  choice: auprès de votre père
  rationale: παρά avec le génitif peut indiquer la provenance, mais « entendu auprès de » préserve ici le parallélisme rhétorique avec la première proposition. Le possessif, implicite dans le contraste contextuel, rend la phrase française intelligible sans anticiper l’identification du verset 44.
- source_word: ποιεῖτε
  choice: faites
  rationale: L’indicatif et l’impératif ont la même forme en grec. Dans ce contraste, la lecture impérative est possible et correspond à la ponctuation éditoriale reçue, tout en laissant subsister une ambiguïté réelle signalée en note.
- source_word: πατήρ / πατρὸς
  choice: Père / père
  rationale: La majuscule distingue la référence à Dieu dans la première proposition ; la minuscule maintient la progression rhétorique sans nommer encore le second père.
theological_decisions:
- issue: Identification du second père
  choice: votre père
  alternative: le père ; le diable
  rationale: Le contexte oppose le Père de Jésus au père de ses interlocuteurs, mais l’identification explicite avec le diable n’arrive qu’au verset 44. La traduction conserve cette progression.
- issue: Mode de ποιεῖτε
  choice: faites
  alternative: vous faites
  rationale: La forme grecque peut être comprise comme un impératif ou un indicatif. Le texte principal suit la lecture impérative traditionnelle, tandis qu’une note conserve l’autre possibilité sans trancher silencieusement.
- issue: Relation exprimée par παρά dans les deux propositions
  choice: auprès du Père / auprès de votre père
  alternative: auprès du Père / de votre père
  rationale: La variation de cas permet une nuance de présence dans la première proposition et de provenance dans la seconde. Toutefois, « entendre auprès de quelqu’un » reste naturel et préserve le parallélisme ainsi que la tension entre les deux filiations.
translation_notes:
  register: Français international moderne, digne et accessible. « Auprès de » exprime la présence personnelle sans lourdeur. La construction parallèle conserve la force rhétorique du grec ; la note documente les ambiguïtés que le français courant ne peut maintenir entièrement dans le corps du texte.
