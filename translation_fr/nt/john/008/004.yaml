  text: λέγουσιν αὐτῷ, Διδάσκαλε, αὕτη ἡ γυνὴ κατείληπται ἐπαυτοφώρῳ μοιχευομένη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/004.yaml
  text: They[a] said to him, "Teacher, this woman has been caught in the very act of committing adultery."
translation:
  language: fr
  text: 'Ils[a] lui dirent : « Maître, cette femme a été prise en flagrant délit d’adultère. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset fait partie du récit de la femme surprise en adultère (Jean 7.53–8.11). Voir la note sur Jean 7.53.
    reason: textual_critical
lexical_decisions:
- source_word: λέγουσιν
  choice: dirent
  rationale: Le présent historique grec est rendu au passé simple, temps naturel d’une narration écrite en français.
- source_word: κατείληπται
  choice: a été prise
  rationale: Le parfait passif décrit une arrestation déjà accomplie dont le résultat demeure pertinent dans la scène.
- source_word: ἐπαυτοφώρῳ
  choice: en flagrant délit
  rationale: Cette expression française courante rend précisément l’idée idiomatique d’être surpris au moment même de commettre l’acte.
- source_word: μοιχευομένη
  choice: d’adultère
  rationale: Le participe présent précise l’acte au cours duquel la femme a été surprise; il s’intègre naturellement à la locution « en flagrant délit d’adultère ».
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « Maître » conserve la forme d’adresse directe, tandis que « en flagrant délit d’adultère » transmet naturellement et sans atténuation la précision du grec.
