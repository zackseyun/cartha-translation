source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: fr
  text: 'Jésus répondit : « Moi, je n’ai pas de démon[a], mais j’honore mon Père, et vous, vous me déshonorez. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus interprétative : « je ne suis pas possédé par un démon ».'
    reason: Alternative lexicale explicitant le sens probable de l’expression grecque littérale « avoir un démon ».
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Verbe narratif courant et naturel dans un dialogue ; il rend directement l’aoriste grec.
- source_word: Ἐγώ
  choice: Moi, je
  rationale: La tournure disloquée française restitue l’accent porté par le pronom grec explicite et prépare le contraste avec « vous ».
- source_word: δαιμόνιον οὐκ ἔχω
  choice: je n’ai pas de démon
  rationale: Cette formulation conserve l’expression grecque littérale et son ambiguïté idiomatique, sans la remplacer dans le texte par l’interprétation plus précise « être possédé ».
- source_word: ἀλλά
  choice: au contraire
  rationale: Dans ce contexte, la locution marque clairement l’opposition entre l’accusation rejetée et l’honneur que Jésus rend à son Père.
- source_word: τιμῶ
  choice: j’honore
  rationale: Équivalent direct de τιμάω, il permet de conserver l’opposition lexicale avec ἀτιμάζω.
- source_word: τὸν πατέρα μου
  choice: mon Père
  rationale: Le contexte johannique identifie le Père à Dieu ; la majuscule signale cette référence sans expliciter davantage le texte.
- source_word: ὑμεῖς
  choice: vous, vous
  rationale: La reprise du pronom en français rend l’emphase du pronom grec explicite et le contraste avec « Moi, je ».
- source_word: ἀτιμάζετέ με
  choice: vous me déshonorez
  rationale: « Déshonorer » préserve le contraste formel et sémantique avec « honorer », contrairement à des choix plus étroits comme « insulter ».
theological_decisions:
- issue: Référence de « mon Père »
  choice: Employer « mon Père » avec une majuscule, en référence à Dieu.
  alternative: « mon père », compris comme une simple désignation familiale.
  rationale: Dans le contexte immédiat de Jean, Jésus parle de Dieu comme de son Père. La majuscule indique cette référence contextuelle sans ajouter une interprétation doctrinale au contenu.
- issue: Sens de « avoir un démon »
  choice: Conserver dans le texte l’expression « je n’ai pas de démon ».
  alternative: « je ne suis pas possédé par un démon »
  rationale: Le grec emploie littéralement le verbe « avoir ». La formulation alternative exprime probablement le sens idiomatique, mais elle précise davantage le type d’influence démoniaque que ne le fait la syntaxe source.
translation_notes:
  register: Français international moderne, naturel et digne. Les constructions emphatiques « Moi, je » et « vous, vous » rendent le contraste marqué du grec sans recourir à un registre archaïque. Le couple « honore / déshonorez » conserve le jeu lexical du texte source.
