  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: fr
  text: À l’aube, il revint au temple, et tout le peuple venait à lui. Il s’assit et les enseignait.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset poursuit le récit de la femme surprise en adultère (Jean 7.53–8.11), absent des plus anciens manuscrits grecs. Voir la note sur Jean 7.53.
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: Dès l’aube
  rationale: Le génitif de temps situe la scène au point du jour. « Dès l’aube » est naturel en français et conserve l’idée d’une venue très matinale.
- source_word: πάλιν παρεγένετο
  choice: il revint
  rationale: παρεγένετο exprime l’arrivée, et πάλιν indique la répétition. « Il revint » rend l’ensemble avec concision et naturel.
- source_word: εἰς τὸ ἱερόν
  choice: au temple
  rationale: ἱερόν désigne ici l’ensemble du domaine du temple, notamment ses cours accessibles où l’on pouvait enseigner, et non le sanctuaire intérieur.
- source_word: πᾶς ὁ λαὸς ἤρχετο πρὸς αὐτόν
  choice: tout le peuple venait à lui
  rationale: L’imparfait ἤρχετο présente un mouvement en cours ou répété vers Jésus. « Venait à lui » préserve cet aspect sans surinterpréter.
- source_word: καθίσας
  choice: Il s’assit
  rationale: Le participe aoriste marque une action préalable à l’enseignement. Une proposition indépendante produit un français clair et naturel.
- source_word: ἐδίδασκεν αὐτούς
  choice: se mit à les enseigner
  rationale: L’imparfait peut être compris comme inchoatif ou duratif. Dans cette séquence, après qu’il s’est assis, « se mit à les enseigner » exprime naturellement le début de l’action, tout en restant compatible avec sa durée.
theological_decisions:
- issue: Statut textuel de Jean 7.53–8.11
  choice: Conserver le verset dans le texte principal et signaler son statut manuscrit en note
  alternative: Omettre le passage du texte principal ou le placer entre crochets
  rationale: L’édition source byzantine contient ce verset, mais l’absence du récit dans les plus anciens manuscrits grecs constitue une donnée textuelle importante. La note informe le lecteur sans trancher silencieusement la question.
translation_notes:
  register: Français moderne, international et digne. La ponctuation en deux phrases évite une accumulation de coordinations tout en respectant la progression grecque. Le marqueur [a] est placé à la fin du verset afin de rattacher clairement la note à l’ensemble du passage sans perturber l’ouverture de la phrase.
