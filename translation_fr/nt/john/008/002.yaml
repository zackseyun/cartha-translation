review_pass:
  verdict: revise
  source_fidelity: 'La structure et le sens sont fidèlement rendus : Jésus retourne au temple à l’aube, le peuple vient vers lui, puis il s’assied pour enseigner. Cependant, « Dès l’aube » suggère plus naturellement un point de départ temporel (« à partir de l’aube »), tandis que ὄρθρου situe simplement l’action à l’aube. De plus, l’imparfait ἐδίδασκεν est aspectuellement ouvert ; « se mit à enseigner » privilégie l’inchoatif. « Il les enseignait » conserve plus directement cette ouverture.'
  naturalness: « À l’aube » et « il les enseignait » sont naturels, clairs et d’un registre moderne digne. « Tout le peuple venait à lui » est acceptable pour le collectif grec πᾶς ὁ λαός.
  terminology: « Temple » rend adéquatement ἱερόν dans ce contexte. « Enseigner » convient à διδάσκω. La note textuelle est exacte, sobre et ne surinterprète pas les données manuscrites.
  issues:
  - severity: low
    issue: Nuance temporelle de « Dès l’aube »
    rationale: Le grec ὄρθρου est un génitif de temps (« à l’aube / au point du jour »), non une expression marquant nécessairement le commencement d’une période. « À l’aube » est plus précis.
  - severity: low
    issue: Aspect de l’imparfait dans « se mit à les enseigner »
    rationale: L’inchoatif est possible, mais ἐδίδασκεν peut aussi être duratif. « Il les enseignait » préserve l’ambiguïté aspectuelle du grec sans perte de naturel.
  revised_text: À l’aube, il revint au temple, et tout le peuple venait à lui. Il s’assit et les enseignait.[a]
  revised_footnotes:
  - marker: a
    text: Ce verset poursuit le récit de la femme surprise en adultère (Jean 7.53–8.11), absent des plus anciens manuscrits grecs. Voir la note sur Jean 7.53.
    reason: textual_critical
  revision_rationale: La révision remplace « Dès l’aube » par « À l’aube » pour rendre précisément la valeur temporelle du grec, et remplace l’inchoatif explicite « se mit à les enseigner » par l’imparfait français « les enseignait », qui maintient l’ouverture aspectuelle de ἐδίδασκεν. La note et son ancre sont conservées.
