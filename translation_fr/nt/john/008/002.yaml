revisions:
- from: Dès l’aube, il revint au temple, et tout le peuple venait à lui. Il s’assit et se mit à les enseigner.[a]
  to: À l’aube, il revint au temple, et tout le peuple venait à lui. Il s’assit et les enseignait.[a]
  rationale: La révision remplace « Dès l’aube » par « À l’aube » pour rendre précisément la valeur temporelle du grec, et remplace l’inchoatif explicite « se mit à les enseigner » par l’imparfait français « les enseignait », qui maintient l’ouverture aspectuelle de ἐδίδασκεν. La note et son ancre sont conservées.
