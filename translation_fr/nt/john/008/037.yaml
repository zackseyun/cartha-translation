id: JHN.8.37
reference: John 8:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: fr
  text: Je sais que vous êtes de la descendance d’Abraham[a]. Mais vous cherchez à me tuer, parce que ma parole ne trouve pas de place en vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « la semence d’Abraham » ; c’est-à-dire ses descendants.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ma parole ne progresse pas parmi vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: la descendance d’Abraham
  rationale: Le singulier collectif σπέρμα désigne ici l’ascendance physique. « La descendance » est naturel en français, garde cette valeur collective et évite d’introduire prématurément la notion théologique d’enfants spirituels.
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: vous cherchez à me tuer
  rationale: La construction ζητέω avec l’infinitif exprime ici la recherche ou la volonté de faire quelque chose. Cette traduction conserve la forme verbale et la valeur durative du présent sans préciser davantage le motif.
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: ma parole
  rationale: « Ma parole » rend directement λόγος et préserve le vocabulaire johannique ainsi que ses possibles résonances, contrairement à « mon message », plus explicatif.
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: ne trouve pas de place en vous
  rationale: Cette formulation conserve l’image spatiale de χωρέω et exprime le défaut d’accueil intérieur sans réduire le sens à une seule interprétation, comme l’absence de progrès ou d’emprise.
- source_word: ἀλλὰ
  choice: Pourtant
  rationale: La conjonction marque un contraste fort entre leur ascendance reconnue et leur hostilité envers Jésus. « Pourtant » exprime clairement cette tension en français naturel.
- source_word: οἶδα ὅτι
  choice: Je sais que
  rationale: Traduction directe et naturelle de la proposition introductive grecque.
theological_decisions:
- issue: Rapport entre la descendance physique d’Abraham et la véritable conformité à Abraham
  choice: Employer « la descendance d’Abraham » dans un sens généalogique explicite.
  alternative: « les enfants d’Abraham »
  rationale: Jésus reconnaît ici leur filiation physique tout en mettant en cause leur conduite. « Descendance » préserve cette tension sans anticiper la distinction entre filiation physique et spirituelle développée dans le contexte.
translation_notes:
  register: Français international moderne, digne et accessible. « Descendance » rend naturellement le collectif généalogique ; « ne trouve pas de place en vous » conserve la métaphore et l’ambiguïté de χωρέω.
