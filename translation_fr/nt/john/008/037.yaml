  source_fidelity: 'Le sens général est fidèle : Jésus reconnaît leur lien généalogique avec Abraham, oppose à cela leur intention de le tuer et explique cette hostilité par le non-accueil de sa parole. « Vous êtes la descendance d’Abraham » est toutefois peu idiomatique en français : la tournure « vous êtes de la descendance d’Abraham » conserve mieux le collectif singulier de σπέρμα.'
  naturalness: Le registre est moderne et approprié. La correction de la tournure avec « descendance » améliore nettement la fluidité. « Mais » rend directement ἀλλά et convient au contraste fort.
