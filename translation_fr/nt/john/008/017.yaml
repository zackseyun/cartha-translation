source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: fr
  text: Et même dans votre loi, il est écrit que le témoignage de deux hommes est vrai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le témoignage de deux personnes est vrai ». Le grec emploie un terme qui peut désigner des personnes ou des êtres humains ; dans cette formule juridique, il se rapporte à deux témoins.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ... δὲ
  choice: Et même
  rationale: Cette formulation rend à la fois l’enchaînement et la légère insistance de la combinaison grecque, dans un français naturel.
- source_word: νόμῳ
  choice: loi
  rationale: Ici, le terme désigne le corpus légal et scripturaire invoqué dans le débat. La minuscule convient à l’expression polémique « votre loi » sans restreindre explicitement la référence au seul Pentateuque comme titre formel.
- source_word: ὑμετέρῳ
  choice: votre
  rationale: Le possessif explicite est conservé afin de maintenir la distance rhétorique du propos, sans la renforcer par « votre propre ».
- source_word: γέγραπται
  choice: il est écrit
  rationale: Cette formule française consacrée rend le parfait passif employé pour introduire une citation scripturaire et son autorité durable.
- source_word: δύο ἀνθρώπων
  choice: deux hommes
  rationale: Le grec emploie ἄνθρωπος dans une formule juridique concernant des témoins humains. « Deux hommes » conserve la forme traditionnelle et masculine de l’expression source; une note signale sa portée humaine plus générale possible.
- source_word: μαρτυρία
  choice: témoignage
  rationale: Le mot convient précisément au cadre juridique et s’emploie naturellement avec le complément « de deux hommes ».
- source_word: ἀληθής
  choice: vrai
  rationale: « Vrai » rend directement le grec tout en laissant perceptible, sans l’imposer, la nuance juridique de validité ou de recevabilité.
theological_decisions:
- issue: Portée rhétorique de « votre loi »
  choice: Conserver « votre loi » comme adresse directe aux interlocuteurs de Jésus.
  alternative: « la loi » ou « votre propre loi »
  rationale: Le possessif de deuxième personne est explicite. Le maintenir préserve la tension du discours sans suggérer que Jésus rejette lui-même la loi; « votre propre » accentuerait inutilement la distance.
- issue: Valeur de ἀνθρώπων dans la maxime juridique
  choice: Employer « hommes » dans le texte principal.
  alternative: « personnes » ou « êtres humains »
  rationale: Cette option conserve la formulation masculine du grec et l’expression juridique traditionnelle, tandis que la note indique que le terme peut désigner plus largement des témoins humains.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant idiomatique; le vocabulaire juridique et scripturaire est conservé sans explicitation doctrinale.
