id: JHN.8.36
reference: John 8:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: fr
  text: Donc, si le Fils vous libère, vous serez vraiment libres[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réellement libres » ou « véritablement libres ». L’adverbe grec souligne que cette liberté est authentique et pleine.
    reason: Alternative lexicale pour ὄντως et explicitation de sa valeur emphatique.
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Donc, si
  rationale: ἐὰν introduit la condition et οὖν marque la conséquence tirée de l’argument précédent. « Donc, si » conserve ces deux fonctions dans un français naturel.
- source_word: ὁ υἱὸς
  choice: le Fils
  rationale: Dans ce contexte johannique, l’expression désigne Jésus en tant que Fils. La majuscule signale cet emploi comme titre sans ajouter d’explication au texte.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom grec est au pluriel. Le français « vous » en respecte naturellement le nombre dans ce contexte.
- source_word: ἐλευθερώσῃ
  choice: vous libère
  rationale: Le verbe exprime l’action de rendre libre. « Libérer » est direct, courant et maintient le lien lexical avec l’adjectif « libres ».
- source_word: ὄντως
  choice: vraiment
  rationale: L’adverbe souligne que la liberté obtenue est réelle et authentique. « Vraiment » restitue cette insistance dans un français actuel.
- source_word: ἐλεύθεροι
  choice: libres
  rationale: Il s’agit d’un adjectif attribut décrivant l’état qui résulte de l’action du Fils, et non simplement l’acte d’être affranchi.
- source_word: ἔσεσθε
  choice: vous serez
  rationale: Le futur français rend directement le futur de εἰμί et préserve la conséquence annoncée.
theological_decisions:
- issue: Identité du « Fils »
  choice: Titre christologique désignant Jésus
  alternative: Un fils au sens générique
  rationale: Le contexte johannique présente « le Fils » comme une désignation précise de Jésus, notamment dans l’argument portant sur la place durable du Fils dans la maison.
- issue: Nature de la liberté annoncée
  choice: Liberté véritable, sans en restreindre explicitement la portée
  alternative: Liberté uniquement spirituelle, sociale, politique ou intérieure
  rationale: Le contexte immédiat parle de l’esclavage du péché, mais le verset formule largement le résultat. La traduction conserve cette ampleur sans introduire une catégorie absente de la phrase.
translation_notes:
  register: Français international moderne, simple et digne. La répétition « libère / libres » conserve le lien lexical du grec. « Donc, si » maintient explicitement le rapport logique avec les paroles précédentes.
