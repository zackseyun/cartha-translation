source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: fr
  text: Tu n’es tout de même pas plus grand que notre père Abraham, qui est mort ? Les prophètes aussi sont morts. Pour qui te prends-tu ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ σὺ
  choice: Tu n’es tout de même pas
  rationale: μή introduit une question qui appelle une réponse négative. La tournure française exprime naturellement l’incrédulité hostile des interlocuteurs sans transformer leur défi en affirmation.
- source_word: μείζων
  choice: plus grand
  rationale: 'Le comparatif garde toute son amplitude : rang, importance et autorité, sans préciser indûment laquelle de ces dimensions est visée.'
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: que notre père Abraham
  rationale: « que » rend le génitif de comparaison, tandis que « notre père Abraham » conserve la revendication d’ascendance et la valeur honorifique de πατήρ.
- source_word: ὅστις ἀπέθανεν
  choice: qui est mort
  rationale: Cette formulation française énonce directement le fait historique de la mort d’Abraham et s’intègre naturellement à l’argument.
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: Les prophètes aussi sont morts
  rationale: '« aussi » restitue le parallèle ajouté par καί : Abraham est mort, et les prophètes ont connu le même sort.'
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: Pour qui te prends-tu ?
  rationale: Cette expression idiomatique française rend l’idée de se présenter ou de prétendre être quelqu’un, ainsi que la nuance accusatrice de la question.
theological_decisions:
- issue: Défi rhétorique portant sur le statut de Jésus par rapport à Abraham et aux prophètes
  choice: Formuler la première question comme une contestation incrédule qui attend une réponse négative.
  alternative: « Es-tu plus grand que notre père Abraham… ? »
  rationale: Le grec μή signale l’attente d’une réponse négative. La traduction préserve ainsi la tension relative à l’identité et à l’autorité de Jésus sans apporter elle-même de résolution doctrinale.
translation_notes:
  register: Français international moderne, direct et digne. « Tout de même » marque clairement la force rhétorique attendue par μή. « Pour qui te prends-tu ? » est courant et accusateur, sans être vulgaire.
