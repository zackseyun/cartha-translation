  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: fr
  text: '« Vous faites les œuvres de votre père. » Ils lui dirent : « Nous ne sommes pas nés d’une union illégitime[a] ; nous avons un seul Père : Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nous ne sommes pas des enfants illégitimes. » Le grec dit littéralement : « Nous ne sommes pas nés de l’immoralité sexuelle. »'
    reason: Alternative lexicale et explication de l’idiome grec.
lexical_decisions:
- source_word: ποιεῖτε
  choice: vous accomplissez
  rationale: Le présent exprime l’action actuelle et continue; «accomplir les œuvres» est naturel en français biblique moderne et conserve le lien entre l’action et les œuvres.
- source_word: τὰ ἔργα
  choice: les œuvres
  rationale: «Œuvres» préserve le vocabulaire johannique et la portée morale du terme, sans le réduire à de simples actes isolés.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: de votre père
  rationale: La traduction littérale maintient l’ambiguïté entre filiation, origine et ressemblance morale, qui se développe dans le contexte.
- source_word: ἐκ πορνείας
  choice: de l’immoralité sexuelle
  rationale: πορνεία désigne largement l’immoralité sexuelle. Avec le verbe «naître», la formule peut évoquer une naissance illégitime, mais le texte principal conserve l’expression grecque sans en imposer l’interprétation.
- source_word: οὐ γεγεννήμεθα
  choice: nous ne sommes pas nés
  rationale: Le parfait passif grec décrit leur naissance avec un état qui en résulte; le passé composé français convient naturellement.
- source_word: ἕνα πατέρα ἔχομεν
  choice: nous avons un seul Père
  rationale: «Un seul» rend l’insistance de ἕνα sur l’unicité. La majuscule signale que le père ainsi désigné est Dieu.
- source_word: τὸν θεόν
  choice: Dieu
  rationale: L’accusatif en apposition identifie explicitement l’unique Père; les deux-points rendent clairement cette relation en français.
theological_decisions:
- issue: Faut-il expliciter ἐκ πορνείας comme une revendication de naissance légitime?
  choice: Conserver dans le texte la formulation «nés de l’immoralité sexuelle».
  alternative: «Nous ne sommes pas des enfants illégitimes.»
  rationale: L’autre formulation exprime probablement l’implication de l’idiome, mais elle résout une nuance que le grec laisse indirecte. Le texte principal garde donc l’image originale et la note en précise le sens possible.
- issue: Identité du «père» dans la première phrase
  choice: Garder «votre père» sans expliciter son identité.
  alternative: Préciser «votre père spirituel» ou anticiper «le diable».
  rationale: Le contexte ultérieur précise l’accusation, mais ce verset laisse encore la formule ouverte. L’expliciter ici supprimerait la progression et la tension du dialogue.
translation_notes:
  register: Français international moderne, digne et accessible. «Œuvres» maintient la résonance johannique; «immoralité sexuelle» évite le terme vieilli «fornication». La ponctuation resserrée convient au dialogue direct.
