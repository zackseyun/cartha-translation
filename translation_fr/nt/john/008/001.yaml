- source_word: ἐπορεύθη
  choice: se rendit
  rationale: Cet aoriste de πορεύομαι, de sens actif malgré sa forme, exprime ici un déplacement vers une destination. « Se rendit » est naturel en français et conserve cette orientation.
- source_word: ὄρος
  choice: mont
  rationale: Dans le nom géographique consacré « mont des Oliviers », « mont » est la désignation française courante.
- source_word: Ἐλαιῶν
  choice: des Oliviers
  rationale: Le génitif pluriel renvoie aux oliviers du lieu et correspond au nom traditionnel et largement reconnu « mont des Oliviers ».
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici le contraste avec le départ des autres personnages mentionné au verset précédent.
