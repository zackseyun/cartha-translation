  text: Ὡς δὲ ἐπέμενον ἐρωτῶντες αὐτόν, ἀνακύψας εἶπεν αὐτοῖς, Ὁ ἀναμάρτητος ὑμῶν, πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: fr
  text: 'Mais comme[a] ils persistaient à l’interroger, il se redressa et leur dit : « Que celui d’entre vous qui est sans péché soit le premier à lui jeter une pierre. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset fait partie du récit de la femme surprise en adultère (Jean 7.53–8.11), absent des plus anciens manuscrits grecs. Voir la note sur Jean 7.53.
    reason: textual_critical
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: ils persistaient à l’interroger
  rationale: L’imparfait ἐπέμενον associé au participe présent ἐρωτῶντες exprime une action insistante et prolongée ; « persistaient à l’interroger » rend naturellement cette continuité.
- source_word: ἀνακύψας
  choice: il se redressa
  rationale: Le participe aoriste décrit le mouvement par lequel Jésus se relève de la posture penchée mentionnée dans le contexte ; « se redressa » est précis et idiomatique.
- source_word: ἀναμάρτητος
  choice: sans péché
  rationale: Cet adjectif rare signifie « sans péché » ou « non coupable ». « Sans péché » conserve ici la portée morale et la possible résonance judiciaire sans restreindre artificiellement le sens.
- source_word: πρῶτος ἐπ’ αὐτὴν τὸν λίθον βαλέτω
  choice: soit le premier à lui jeter une pierre
  rationale: Cette formulation conserve l’impératif grec à la troisième personne et l’idée d’être le premier à mettre à exécution la lapidation.
theological_decisions:
- issue: Portée de « sans péché »
  choice: Conserver la formulation générale « sans péché »
  alternative: « qui n’a commis aucun péché semblable » ou « qui n’est pas coupable dans cette affaire »
  rationale: Le grec ἀναμάρτητος ne précise ni un type de péché ni une culpabilité particulière. La traduction ne doit donc pas résoudre une ambiguïté que le texte maintient.
translation_notes:
  register: Français international moderne, naturel et digne. « Persistaient » restitue l’insistance sans lourdeur ; « se redressa » décrit clairement le geste ; la parole de Jésus garde sa concision et sa tension morale.
