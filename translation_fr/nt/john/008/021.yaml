id: JHN.8.21
reference: John 8:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: fr
  text: 'Il leur dit donc de nouveau : « Moi, je m’en vais ; vous me chercherez[a], et vous mourrez dans votre péché[b]. Là où je vais, vous ne pouvez pas venir[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « vous me rechercherez ». Le verbe peut désigner la recherche de quelqu’un et, dans Jean, avoir aussi une portée spirituelle plus profonde.'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie le singulier : « dans votre péché ». Certaines traductions mettent « dans vos péchés », mais le singulier peut souligner une condition persistante plutôt que des actes particuliers.'
    reason: lexical_alternative
  - marker: c
    text: 'Littéralement : « vous n’êtes pas en mesure de venir ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Conserve la fonction de liaison et de conséquence dans la poursuite du dialogue, sans alourdir la phrase.
- source_word: πάλιν
  choice: de nouveau
  rationale: Exprime naturellement la répétition marquée par l’adverbe grec.
- source_word: Ἐγώ
  choice: Moi, je
  rationale: Rend l’insistance produite par le pronom grec explicite, tout en restant idiomatique en français.
- source_word: ὑπάγω
  choice: je m’en vais
  rationale: Évoque un départ plutôt qu’un simple déplacement et préserve, sans l’expliciter, la portée particulière de ce verbe dans Jean.
- source_word: ζητήσετέ με
  choice: vous me chercherez
  rationale: Le verbe peut désigner la recherche concrète de quelqu’un tout en gardant ici une possible portée spirituelle.
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: dans votre péché
  rationale: Respecte la préposition et le singulier grecs, qui peuvent désigner une condition persistante plutôt qu’une série d’actes distincts.
- source_word: ἀποθανεῖσθε
  choice: vous mourrez
  rationale: Rend directement et naturellement le futur grec.
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: Là où je vais
  rationale: Formulation française naturelle qui maintient le présent et la répétition de ὑπάγω sans rendre la proposition pesante.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: vous ne pouvez pas venir
  rationale: Exprime clairement et idiomatiquement l’impossibilité indiquée par δύνασθε.
theological_decisions:
- issue: Le singulier ἁμαρτίᾳ face au pluriel plus courant dans certaines traductions
  choice: dans votre péché
  alternative: dans vos péchés
  rationale: Le singulier du texte grec est conservé afin de ne pas réduire l’expression à des fautes individuelles; il peut évoquer un état de péché, sans que cette interprétation soit imposée dans le corps du texte.
- issue: La portée du départ de Jésus exprimé par ὑπάγω
  choice: je m’en vais
  alternative: je pars; je vais
  rationale: « Je m’en vais » indique un départ tout en laissant ouverte la portée johannique de ce départ, qui dépasse le simple déplacement sans que sa destination soit explicitée ici.
- issue: La nature de l’impossibilité exprimée par οὐ δύνασθε ἐλθεῖν
  choice: vous ne pouvez pas venir
  alternative: vous n’êtes pas en mesure de venir
  rationale: La traduction préserve l’affirmation d’incapacité ou d’impossibilité sans en préciser la cause théologique, que le verset ne développe pas.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation garde le rythme solennel de la déclaration. « Moi, je » restitue l’insistance du pronom grec; « je m’en vais » demeure courant tout en conservant la gravité du départ annoncé.
