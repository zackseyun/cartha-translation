  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: fr
  text: Abraham, votre père, s’est réjoui à l’idée de voir mon jour[a][b] ; il l’a vu et il en a été heureux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « s’est réjoui de voir mon jour » ou « a exulté à l’idée de voir mon jour ». La proposition grecque introduite par ἵνα admet plusieurs formulations proches.'
    reason: lexical_alternative
  - marker: b
    text: L’expression « mon jour » peut désigner largement le jour ou l’accomplissement messianique de Jésus ; le verset ne précise pas l’événement ni le moment exact dont il est question.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Forme française traditionnelle et courante du nom du patriarche.
- source_word: ὁ πατὴρ ὑμῶν
  choice: votre père
  rationale: Rend naturellement le groupe nominal grec et conserve le lien revendiqué entre Abraham et les interlocuteurs de Jésus.
- source_word: ἠγαλλιάσατο
  choice: s’est réjoui
  rationale: Le verbe exprime une joie intense. « S’est réjoui » est naturel en français moderne, tandis que la construction « à la perspective de » fait ressortir l’anticipation du contexte.
- source_word: ἵνα ἴδῃ
  choice: à la perspective de voir
  rationale: Cette formulation française exprime l’attente joyeuse sans imposer strictement une valeur finale ou complétive à la proposition introduite par ἵνα.
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: mon jour
  rationale: Traduction directe qui conserve la richesse et l’indétermination de l’expression grecque, sans préciser l’événement messianique visé.
- source_word: καὶ εἶδεν
  choice: il l’a vu
  rationale: Le pronom « l’ » reprend naturellement « mon jour », objet sous-entendu du verbe grec.
- source_word: καὶ ἐχάρη
  choice: et il en a été heureux
  rationale: Cette formulation restitue la joie exprimée par χαίρω tout en évitant de répéter exactement « s’est réjoui », employé pour ἀγαλλιάομαι.
theological_decisions:
- issue: Sens de « mon jour »
  choice: Conserver l’expression littérale « mon jour » sans identifier l’événement précis.
  alternative: Préciser « le jour de ma venue », « mon époque », la résurrection ou le jour eschatologique.
  rationale: Le verset ne détermine pas explicitement si l’expression vise la venue terrestre de Jésus, l’accomplissement messianique, sa mort et sa résurrection ou sa manifestation finale.
- issue: Valeur de ἵνα dans l’attente d’Abraham
  choice: « à la perspective de voir », qui communique une anticipation joyeuse tout en laissant ouverte la relation syntaxique exacte.
  alternative: « afin de voir », « de voir » ou « à l’idée qu’il verrait ».
  rationale: La proposition peut recevoir une nuance de but ou de contenu attendu. Le français choisi reste naturel sans trancher plus que ne le permet le grec.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve « mon jour », expression volontairement ouverte, et emploie « à la perspective de » pour rendre naturellement l’anticipation sans éliminer l’ambiguïté du grec.
