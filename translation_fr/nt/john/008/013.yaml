id: JHN.8.13
reference: John 8:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: fr
  text: 'Les Pharisiens lui dirent donc : « Tu témoignes à ton sujet ; ton témoignage n’est pas vrai[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton témoignage n’est pas valable ». Le grec dit littéralement « n’est pas vrai », expression qui peut aussi évoquer ici la validité juridique du témoignage.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la suite logique de la déclaration précédente, tout en restant naturel dans un récit en français.
- source_word: εἶπον ... οἱ Φαρισαῖοι
  choice: Les pharisiens lui dirent
  rationale: Rend simplement l’aoriste narratif et conserve le destinataire exprimé par αὐτῷ.
- source_word: Σὺ περὶ σεαυτοῦ μαρτυρεῖς
  choice: Tu témoignes à ton propre sujet
  rationale: Le pronom « Tu » placé en tête et l’expression « ton propre sujet » rendent l’insistance de Σὺ et du réfléchi σεαυτοῦ sans alourdir excessivement la phrase.
- source_word: ἡ μαρτυρία σου
  choice: ton témoignage
  rationale: Conserve la cohérence lexicale avec « témoignes » ainsi que la tonalité testimoniale et juridique du contexte.
- source_word: οὐκ ἔστιν ἀληθής
  choice: n’est pas vrai
  rationale: Rend directement ἀληθής et préserve son amplitude sémantique, qui peut concerner ici aussi bien la vérité que la validité d’un témoignage.
theological_decisions:
- issue: Portée de l’objection des pharisiens au témoignage que Jésus rend sur lui-même
  choice: « ton témoignage n’est pas vrai »
  alternative: « ton témoignage n’est pas valable »
  rationale: Le contexte comporte une dimension juridique, mais ἀληθής ne se limite pas à la recevabilité légale. Le texte principal conserve donc l’affirmation plus large, tandis que la note signale l’autre nuance possible.
translation_notes:
  register: Français international moderne, naturel et digne. Le vocabulaire de « témoigner » et du « témoignage » maintient l’écho lexical grec et les connotations juridiques du passage.
source_grounding:
  english_pob_role: consult_only
