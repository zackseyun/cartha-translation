id: JHN.8.31
reference: John 8:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: fr
  text: 'Jésus disait donc aux Juifs qui l’avaient cru[a] : « Si vous demeurez dans ma parole, vous êtes vraiment mes disciples. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qui avaient cru en lui ». Le grec dit littéralement : « qui l’avaient cru ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔλεγεν
  choice: disait
  rationale: L’imparfait grec présente la parole dans son déroulement; l’imparfait français « disait » en conserve naturellement l’aspect.
- source_word: οὖν
  choice: donc
  rationale: « Donc » marque la continuité ou la conséquence dans le discours sans imposer une relation exclusivement logique.
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: aux Juifs qui l’avaient cru
  rationale: Le plus-que-parfait rend l’antériorité et l’état résultant du participe parfait. « L’avaient cru » reflète directement le datif αὐτῷ, sans ajouter la préposition « en ».
- source_word: Ἐὰν
  choice: Si
  rationale: Introduit clairement la condition exprimée avec le subjonctif grec.
- source_word: ὑμεῖς
  choice: vous
  rationale: Le pronom explicite est conservé; en français, sa présence comme sujet suffit sans ajout emphatique artificiel.
- source_word: μείνητε
  choice: demeurez
  rationale: « Demeurer » exprime la continuité durable caractéristique de μένω chez Jean, tout en gardant sa résonance relationnelle.
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: dans ma parole
  rationale: Cette formulation préserve l’image et le vocabulaire johanniques de λόγος, plutôt que de réduire explicitement le sens à « enseignement ».
- source_word: ἀληθῶς
  choice: vraiment
  rationale: « Vraiment » exprime ici l’authenticité de la qualité de disciple dans un français moderne et naturel.
- source_word: μαθηταί μού ἐστε
  choice: vous êtes vraiment mes disciples
  rationale: « Disciples » est le terme approprié au contexte évangélique; la syntaxe française place naturellement « vraiment » devant le groupe attribut.
theological_decisions:
- issue: Traduction de πιστεύω avec le datif αὐτῷ
  choice: qui l’avaient cru
  alternative: qui avaient cru en lui
  rationale: Le grec emploie ici le datif sans εἰς. Le texte principal conserve donc la construction directe et évite d’introduire une formulation théologiquement plus développée; l’autre compréhension idiomatique est signalée en note.
translation_notes:
  register: Français international moderne, digne et accessible. « Demeurer dans ma parole » conserve volontairement l’expression johannique et sa portée théologique sans la paraphraser. La ponctuation française suit l’usage contemporain.
