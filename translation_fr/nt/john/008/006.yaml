source:
  edition: robinson-pierpont-2005-byzantine
  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: fr
  text: Ils[a] disaient cela pour le mettre à l’épreuve, afin d’avoir de quoi l’accuser. Mais Jésus se baissa et écrivait du doigt sur le sol, sans leur prêter attention.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Suite du récit de la femme surprise en adultère (Jean 7.53–8.11). Voir la note sur Jean 7.53.
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: pour le mettre à l’épreuve
  rationale: Dans ce contexte, il s’agit de soumettre Jésus à une épreuve malveillante afin de trouver un motif d’accusation. Cette formulation conserve l’idée de test sans réduire explicitement le terme à « tenter » ou à « piéger ».
- source_word: κατηγορίαν κατ' αὐτοῦ
  choice: de quoi l’accuser
  rationale: Expression française naturelle qui rend l’idée d’obtenir un fondement pour porter une accusation contre Jésus.
- source_word: κάτω κύψας
  choice: se baissa
  rationale: Rend simplement et naturellement le participe grec décrivant Jésus qui se penche vers le sol.
- source_word: ἔγραφεν
  choice: écrivait
  rationale: L’imparfait français reflète l’aspect imperfectif du verbe grec, sans préciser ce que Jésus écrivait ni combien de temps dura l’action.
- source_word: τῷ δακτύλῳ
  choice: du doigt
  rationale: Formulation idiomatique française fidèle à l’instrument indiqué dans le grec.
- source_word: μὴ προσποιούμενος
  choice: sans leur prêter attention
  rationale: Dans ce contexte, le participe négatif décrit Jésus comme ne donnant pas suite à leurs paroles. La traduction évite la formulation moins naturelle « faisant semblant de ne pas entendre » tout en conservant l’idée d’une absence délibérée de réaction.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste claire pour un large public, tout en conservant l’imparfait de ἔγραφεν et sans spéculer sur ce que Jésus écrivait.
