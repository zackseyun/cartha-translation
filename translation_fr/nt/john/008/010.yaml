source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: fr
  text: 'Alors Jésus[a] se redressa et, ne voyant personne sauf la femme, lui dit : « Femme, où sont-ils, ceux qui t’accusaient ? Personne ne t’a condamnée ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset fait partie du récit de la femme surprise en adultère (Jean 7.53–8.11), absent des plus anciens manuscrits grecs. Voir la note sur Jean 7.53.
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: se redressa
  rationale: Le verbe décrit Jésus relevant le haut du corps après s’être baissé pour écrire par terre ; « se redressa » rend naturellement ce mouvement sans affirmer qu’il s’est entièrement levé.
- source_word: θεασάμενος
  choice: ne voyant
  rationale: Le participe exprime ici une constatation visuelle ; la tournure « ne voyant personne sauf la femme » suit la syntaxe grecque tout en restant naturelle en français.
- source_word: κατήγοροί
  choice: ceux qui t’accusaient
  rationale: Cette formulation courante conserve la fonction accusatrice du terme grec et l’accent démonstratif de ἐκεῖνοι οἱ.
- source_word: κατέκρινεν
  choice: condamnée
  rationale: Dans ce contexte judiciaire, le verbe désigne une déclaration ou sentence de condamnation, plus précisément qu’un simple jugement.
theological_decisions:
- issue: Portée de la question finale
  choice: « Personne ne t’a condamnée ? »
  alternative: « Est-ce que personne ne t’a condamnée ? »
  rationale: La formulation retenue conserve la question grecque brève, qui attend une réponse négative, sans ajouter d’interprétation sur la nature ou la portée ultime de la condamnation.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier grec et au dialogue direct. La ponctuation met en relief la reprise « ceux qui t’accusaient » sans alourdir la phrase.
