  - severity: low
    issue: La note dit que la formulation « peut avoir une portée plus profonde ».
    rationale: Cette formulation reste vague et légèrement suggestive. Il est plus neutre de signaler que l’expression peut évoquer d’autres emplois johanniques, sans interprétation doctrinale.
