  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: fr
  text: C’est pourquoi je vous ai dit que vous mourrez dans vos péchés. Car si vous ne croyez pas que je suis[a], vous mourrez dans vos péchés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que c’est moi ». Littéralement, le grec dit : « que je suis », sans attribut exprimé après « je suis » ; cette formulation peut évoquer d’autres emplois de cette expression dans l’Évangile selon Jean.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: C’est pourquoi je vous ai dit
  rationale: οὖν relie cette affirmation à ce qui précède par une conclusion; « C’est pourquoi » rend clairement ce lien. Le passé composé convient naturellement au récit français et « je vous ai dit » respecte le datif ὑμῖν.
- source_word: ἀποθανεῖσθε
  choice: vous mourrez
  rationale: Le futur de ἀποθνῄσκω exprime directement la mort; « vous mourrez » évite d’ajouter la nuance interprétative de « périr ».
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: dans vos péchés
  rationale: Le pluriel ἁμαρτίαις est conservé, et ἐν désigne ici l’état ou la sphère dans laquelle ils mourront.
- source_word: ἐὰν γὰρ μὴ
  choice: Car si vous ne
  rationale: « Car » rend la valeur explicative de γάρ, tandis que « si… ne » exprime naturellement en français la condition négative de ἐὰν μή.
- source_word: πιστεύσητε
  choice: croyez
  rationale: « Croire » est le terme français courant et adapté à l’emploi johannique de πιστεύω, sans exclure sa dimension de confiance.
- source_word: ὅτι ἐγώ εἰμι
  choice: que moi, je suis
  rationale: Le grec ne donne aucun attribut après εἰμι. La tournure française marquée « moi, je suis » conserve l’insistance de ἐγώ et l’expression absolue sans fournir silencieusement un complément.
theological_decisions:
- issue: Rendu de l’expression johannique ἐγώ εἰμι sans attribut explicite
  choice: que moi, je suis
  alternative: que c’est moi
  rationale: « Que moi, je suis » suit la forme ouverte du grec et laisse subsister ses résonances possibles, tandis que « que c’est moi » en donnerait une lecture idiomatique d’identification. La note signale cette possibilité sans trancher la tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. La répétition finale est maintenue comme dans le grec. La formulation inhabituelle « moi, je suis » est volontaire afin de préserver l’absence d’attribut et l’ambiguïté du texte source.
