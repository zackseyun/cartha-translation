  source_fidelity: 'Le sens est globalement fidèle : le futur, le pluriel « péchés », la répétition et la condition négative sont conservés. Toutefois, « que moi, je suis » force l’ordre grec de manière peu recevable en français et rend la proposition complétive syntaxiquement heurtée. « Que je suis » conserve l’absence délibérée d’attribut sans en imposer un.'
  naturalness: « C’est pourquoi je vous ai dit » et le reste du verset sont naturels dans un registre biblique moderne. La séquence « que moi, je suis » ne l’est pas suffisamment ; « que je suis » est la formulation française usuelle pour maintenir l’expression ouverte.
  terminology: « Mourrez dans vos péchés » et « croyez » rendent adéquatement ἀποθανεῖσθε, ἐν ταῖς ἁμαρτίαις ὑμῶν et πιστεύσητε. La note doit présenter « que c’est moi » comme une possibilité idiomatique, sans attribuer de portée théologique déterminée à l’expression.
