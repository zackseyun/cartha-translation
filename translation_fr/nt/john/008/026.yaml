review_pass:
  verdict: revise
  source_fidelity: 'La structure et les principaux termes grecs sont bien rendus : « beaucoup de choses », « à votre sujet », « juger », « celui qui m’a envoyé », « vrai » et « au monde » correspondent au texte source. Toutefois, « entendre auprès de lui » ne rend pas correctement παρ’ αὐτοῦ ici, qui indique la provenance du message : « entendre de lui » est requis.'
  naturalness: Le français est globalement moderne et soutenu. « Auprès de lui », toutefois, évoque spontanément le lieu ou la présence (« en sa présence ») plutôt que la source de ce qui a été entendu. « De lui » est à la fois idiomatique et précis. La reprise « cela, je le dis » conserve l’insistance sans lourdeur.
  terminology: « Juger » maintient à juste titre la portée non restreinte de κρίνειν. « Celui qui m’a envoyé » ne surinterprète pas le référent. « Vrai » est recevable pour ἀληθής et conserve l’ambiguïté pertinente.
  issues:
  - severity: medium
    issue: « auprès de lui » pour παρ’ αὐτοῦ
    rationale: Dans cette construction, παρά avec le génitif marque la source (« de la part de », « de »). « Auprès de lui » déplace le sens vers une proximité ou un cadre spatial et ne communique pas clairement que le contenu proclamé provient de celui qui a envoyé Jésus.
  revised_text: J’ai beaucoup de choses à dire et à juger à votre sujet[a]. Mais celui qui m’a envoyé est vrai, et ce que j’ai entendu de lui, cela, je le dis au monde[b].
