  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: fr
  text: J’ai beaucoup de choses à dire et à juger à votre sujet[a]. Mais celui qui m’a envoyé est vrai, et ce que j’ai entendu de lui, cela, je le dis au monde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sur vous » ou « vous concernant ».'
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « et ce que j’ai entendu de lui, ces choses-là, je les dis au monde ». Le grec reprend explicitement le contenu par le démonstratif « ces choses » pour le mettre en relief.'
    reason: source_emphasis
lexical_decisions:
- source_word: πολλὰ
  choice: beaucoup de choses
  rationale: L’adjectif neutre pluriel est employé substantivement. « Beaucoup de choses » est naturel en français et conserve l’idée de pluralité.
- source_word: περὶ ὑμῶν
  choice: à votre sujet
  rationale: περί avec le génitif indique ici le thème ou la personne concernée. Cette formulation moderne laisse ouverte la nuance « sur vous / vous concernant ».
- source_word: λαλεῖν
  choice: à dire
  rationale: Dans la paire d’infinitifs, « dire » s’enchaîne naturellement avec « juger » tout en rendant l’acte de parole.
- source_word: κρίνειν
  choice: à juger
  rationale: « Juger » préserve l’étendue sémantique de κρίνω sans la réduire à « condamner ».
- source_word: ὁ πέμψας με
  choice: celui qui m’a envoyé
  rationale: Le participe substantivé est rendu par une expression personnelle naturelle, sans expliciter « le Père », absent du grec.
- source_word: ἀληθής
  choice: vrai
  rationale: « Vrai » conserve à la fois les nuances de véracité, de fiabilité et d’authenticité possibles dans le contexte johannique.
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: ce que j’ai entendu auprès de lui
  rationale: παρά avec le génitif marque la provenance personnelle. « Auprès de lui » en garde la couleur relationnelle, bien que « de lui » soit plus idiomatique.
- source_word: ταῦτα
  choice: voilà ce que
  rationale: La reprise démonstrative explicite est conservée par une tournure française emphatique et naturelle.
- source_word: λαλῶ
  choice: je dis
  rationale: « Je dis » convient naturellement à l’énoncé d’un contenu adressé publiquement, tout en conservant le présent.
- source_word: εἰς τὸν κόσμον
  choice: au monde
  rationale: Avec un verbe de parole, εἰς indique la direction vers les destinataires. « Au monde » est idiomatique et conserve κόσμος.
theological_decisions:
- issue: Référent de « celui qui m’a envoyé »
  choice: Le référent implicite est conservé sans ajouter « le Père ».
  alternative: Mais le Père qui m’a envoyé est vrai.
  rationale: Le contexte johannique permet d’identifier le Père, mais le grec ne le nomme pas dans ce verset.
- issue: Portée de κρίνειν
  choice: juger
  alternative: condamner
  rationale: « Juger » maintient la portée large du terme et n’impose pas la nuance plus étroite de condamnation.
- issue: Sens de ἀληθής
  choice: vrai
  alternative: digne de confiance / véridique
  rationale: Le français « vrai » préserve la tension entre véracité, fiabilité et authenticité sans trancher artificiellement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la solennité du propos, le sens large de « juger » et l’insistance créée en grec par la reprise démonstrative.
