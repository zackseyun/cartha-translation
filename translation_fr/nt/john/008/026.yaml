  to: J’ai beaucoup de choses à dire et à juger à votre sujet[a]. Mais celui qui m’a envoyé est vrai, et ce que j’ai entendu de lui, cela, je le dis au monde[b].
  rationale: La révision remplace « auprès de lui » par « de lui » afin de rendre la provenance exprimée par παρ’ αὐτοῦ. Elle conserve la reprise démonstrative explicite de ταῦτα par « cela, je le dis » et garde le présent de λαλῶ.
  reviewer_model: gpt-5.6-terra
