source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἡ δὲ εἶπεν, Οὐδείς, κύριε. Εἶπεν δὲ ὁ Ἰησοῦς, Οὐδὲ ἐγώ σε κατακρίνω· πορεύου, καὶ μηκέτι ἁμάρτανε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/011.yaml
  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: fr
  text: 'Elle[a] répondit : « Personne, Seigneur. » Jésus lui dit : « Moi non plus, je ne te condamne pas. Va, et désormais ne pèche plus. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dernier verset du récit de la femme surprise en adultère (Jean 7.53–8.11). Voir la note sur Jean 7.53.
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: Seigneur
  rationale: Le vocatif peut être une adresse respectueuse (« monsieur »), mais « Seigneur » conserve ici la reconnaissance de l’autorité de Jésus sans exclure la portée théologique possible du terme.
- source_word: κατακρίνω
  choice: condamner
  rationale: Le verbe exprime une condamnation dans un cadre judiciaire; « condamner » rend naturellement ce sens dans le contexte.
- source_word: μηκέτι
  choice: désormais… ne… plus
  rationale: Cette formulation restitue à la fois la cessation demandée et son point de départ présent.
- source_word: ἁμάρτανε
  choice: pèche
  rationale: « Pécher » est le terme français direct et courant pour l’impératif présent grec, dont l’association avec μηκέτι appelle à ne plus continuer ou recommencer à pécher.
theological_decisions:
- issue: Portée de l’adresse κύριε
  choice: Seigneur
  alternative: monsieur
  rationale: Le grec permet une adresse polie aussi bien qu’un titre plus chargé; le choix traditionnel « Seigneur » maintient cette possible profondeur sans développer explicitement une confession christologique.
- issue: Rapport entre pardon et appel à cesser de pécher
  choice: Conserver les deux affirmations sans explication ajoutée
  alternative: Paraphraser pour préciser les conditions du pardon
  rationale: Le texte juxtapose la non-condamnation de Jésus et l’ordre de ne plus pécher; il ne faut ni rendre l’une conditionnelle à l’autre ni effacer leur tension.
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation distingue clairement les deux prises de parole. « Moi non plus » rend l’emphase de οὐδὲ ἐγώ, et « désormais ne pèche plus » conserve la force temporelle de μηκέτι.
