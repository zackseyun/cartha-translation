id: JHN.8.32
reference: John 8:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γνώσεσθε τὴν ἀλήθειαν, καὶ ἡ ἀλήθεια ἐλευθερώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/032.yaml
  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: fr
  text: Et vous connaîtrez la vérité[a], et la vérité vous rendra libres[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous en viendrez à connaître la vérité ».
    reason: lexical_alternative
  - marker: b
    text: Le verset lui-même ne précise pas ici la nature de cette liberté ; le contexte qui suit la relie à la libération du péché.
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: vous connaîtrez
  rationale: Le futur de γινώσκω est rendu directement par « vous connaîtrez ». Cette formulation naturelle conserve la possibilité contextuelle d’une entrée progressive dans la connaissance sans l’imposer dans le texte principal.
- source_word: ἀλήθειαν / ἀλήθεια
  choice: la vérité
  rationale: L’article grec est présent dans les deux occurrences. La répétition exacte de « la vérité » préserve à la fois la précision et le rythme du texte source.
- source_word: ἐλευθερώσει
  choice: rendra libres
  rationale: Cette tournure française courante exprime clairement la valeur causative de ἐλευθερόω, sans ajouter la nature de la liberté en question.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom objet est à la deuxième personne du pluriel. « Vous » le rend naturellement en français, tandis que l’adjectif « libres » confirme ici le pluriel.
- source_word: καὶ ... καὶ
  choice: et ... et
  rationale: Les deux conjonctions sont conservées afin de respecter la coordination, la progression logique et la cadence de la phrase grecque.
theological_decisions:
- issue: Nature de la liberté dans « la vérité vous rendra libres »
  choice: Ne pas préciser dans le texte principal de quelle liberté il s’agit.
  alternative: « la vérité vous libérera du péché » ou « la vérité vous rendra spirituellement libres »
  rationale: Le contexte immédiat relie ensuite cette liberté à l’esclavage du péché, mais le verset lui-même formule la promesse sans complément. La traduction conserve cette concision et laisse le contexte en préciser la portée.
translation_notes:
  register: Français international moderne, naturel et digne. La structure coordonnée et la répétition du grec sont conservées. « Rendra libres » est idiomatique tout en évitant une explicitation théologique absente de la proposition elle-même.
