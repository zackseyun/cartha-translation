source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: fr
  text: 'Celui qui est de Dieu[a] entend les paroles de Dieu. C’est pourquoi vous n’entendez pas[b] : vous n’êtes pas de Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « de Dieu » indique ici la source ou l’origine ; elle peut aussi évoquer l’appartenance à Dieu.
    reason: lexical_alternative
  - marker: b
    text: 'Autre compréhension possible : « C’est pourquoi vous n’entendez pas que vous n’êtes pas de Dieu. » La conjonction grecque traduite ici par les deux-points peut aussi signifier « que », mais le sens causal convient mieux au contexte.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: Celui qui est
  rationale: L’article suivi du participe présent désigne ici une catégorie de personnes au moyen d’un représentant singulier. Cette formulation conserve cette force sans paraphrase excessive.
- source_word: ἐκ τοῦ θεοῦ
  choice: de Dieu
  rationale: La préposition ἐκ marque la source ou l’origine. En français, « de Dieu » reste naturel et conserve aussi la densité de l’expression johannique.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: les paroles de Dieu
  rationale: Le pluriel concret ῥήματα est rendu par « paroles », terme naturel ici et plus adapté à des paroles prononcées que le simple « mots ».
- source_word: ἀκούει / ἀκούετε
  choice: entend / entendez
  rationale: Le choix conserve la répétition du même verbe grec et n’explicite pas abusivement l’idée possible d’accueil, d’obéissance ou d’écoute attentive. Le pronom « les » reprend naturellement « les paroles de Dieu » dans la seconde proposition.
- source_word: διὰ τοῦτο
  choice: C’est pourquoi
  rationale: Cette tournure française exprime clairement le rapport de conséquence introduit par διὰ τοῦτο.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français la cause explicative exprimée ici par ὅτι, tout en évitant la lourdeur de « C’est pourquoi…, parce que… ».
- source_word: ἐκ τοῦ θεοῦ οὐκ ἐστέ
  choice: vous n’êtes pas de Dieu
  rationale: La formulation reprend exactement le contraste de source ou d’origine sans le réduire à une catégorie doctrinale plus précise.
theological_decisions:
- issue: Sens de l’expression « être de Dieu »
  choice: Conserver « de Dieu », avec sa notion de source ou d’origine
  alternative: appartenir à Dieu ; être né de Dieu
  rationale: Le texte établit un contraste johannique fort, mais ne précise pas ici une catégorie systématique telle que l’élection, la régénération ou l’appartenance à l’alliance. La traduction garde cette tension.
- issue: Portée de ἀκούω
  choice: entendre
  alternative: écouter ; obéir
  rationale: Dans le contexte, entendre peut inclure l’accueil réceptif des paroles, mais traduire par « obéir » rendrait explicite une implication que le verbe grec ne formule pas à lui seul.
- issue: Valeur de ὅτι
  choice: Valeur causale, rendue par les deux-points
  alternative: 'Valeur déclarative : « que vous n’êtes pas de Dieu »'
  rationale: La lecture causale explique pourquoi les interlocuteurs n’entendent pas et convient mieux au raisonnement immédiat, sans effacer l’autre possibilité grammaticale.
translation_notes:
  register: Français international moderne, sobre et digne. « C’est pourquoi » rend le mouvement logique avec naturel. Le choix d’« entendre » maintient la répétition grecque, tandis que le pronom « les » évite en français une ellipse obscure.
