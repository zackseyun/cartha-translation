id: JHN.8.43
reference: John 8:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: fr
  text: Pourquoi ne comprenez-vous pas ma manière de parler ? Parce que vous n’êtes pas capables d’entendre ma parole[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mon langage » ou « ma façon de parler ». Le terme grec désigne ici la manière de parler de Jésus, distinguée de « ma parole » dans la proposition suivante.
    reason: lexical_alternative
  - marker: b
    text: Ou « vous ne pouvez pas entendre ma parole ».
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: manière de parler
  rationale: Le terme désigne ici la façon de parler de Jésus et maintient la distinction avec λόγος dans la proposition suivante.
- source_word: γινώσκετε
  choice: comprenez
  rationale: Dans ce contexte, le verbe concerne la compréhension des paroles de Jésus plutôt que la simple connaissance ou reconnaissance.
- source_word: ἀκούειν
  choice: entendre
  rationale: Ce rendu conserve le sens premier du verbe sans expliciter à tort s’il s’agit d’écoute, d’accueil ou d’obéissance.
- source_word: λόγον
  choice: parole
  rationale: « Parole » désigne naturellement ce que Jésus communique et préserve la distinction avec sa « manière de parler ».
- source_word: οὐ δύνασθε
  choice: vous n’êtes pas capables
  rationale: La formulation exprime nettement l’incapacité énoncée par le grec, sans la réduire à un simple refus volontaire.
- source_word: ὅτι
  choice: Parce que
  rationale: La conjonction introduit directement la raison de l’incompréhension mentionnée dans la question précédente.
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: ma
  rationale: Le possessif français maintient le parallélisme entre « ma manière de parler » et « ma parole ».
theological_decisions:
- issue: Nature de l’incapacité à entendre la parole de Jésus
  choice: Énoncer directement l’incapacité sans en préciser la cause théologique.
  alternative: L’interpréter explicitement comme un refus moral, un endurcissement judiciaire ou une incapacité spirituelle.
  rationale: Le verset affirme une incapacité, mais n’en expose pas ici tout le mécanisme. La traduction préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement pluriel correspond aux interlocuteurs de Jésus. La formulation conserve la distinction lexicale entre λαλιὰ et λόγος ainsi que l’ambiguïté théologique de l’incapacité.
