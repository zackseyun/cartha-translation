id: JHN.8.18
reference: John 8:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ μαρτυρῶν περὶ ἐμαυτοῦ καὶ μαρτυρεῖ περὶ ἐμοῦ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: fr
  text: C’est moi qui témoigne à mon propre sujet[a], et le Père qui m’a envoyé témoigne à mon sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rend témoignage à mon propre sujet […] rend témoignage à mon sujet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: C’est moi qui témoigne
  rationale: La tournure française met naturellement en relief le sujet et rend le participe substantivé ὁ μαρτυρῶν sans lourdeur. Elle ne traite pas ἐγώ εἰμι comme une formule absolue, puisque le prédicat suit.
- source_word: μαρτυρῶν / μαρτυρεῖ
  choice: témoigne / témoigne
  rationale: « Témoigner » conserve la portée testimoniale, voire judiciaire, de μαρτυρέω et maintient la répétition lexicale du grec.
- source_word: περὶ ἐμαυτοῦ
  choice: à mon propre sujet
  rationale: Cette expression rend περί avec le génitif au sens de « au sujet de » et marque clairement la valeur réfléchie de ἐμαυτοῦ, sans surinterpréter par « en ma faveur ».
- source_word: περὶ ἐμοῦ
  choice: à mon sujet
  rationale: La même construction prépositionnelle préserve le parallélisme avec la première proposition dans un français naturel.
- source_word: ὁ πέμψας με πατήρ
  choice: le Père qui m’a envoyé
  rationale: La proposition relative rend naturellement le participe aoriste attributif. « Le Père » respecte l’article grec sans ajouter « mon » ni « Dieu ».
theological_decisions:
- issue: Référence du « Père » dans le contexte johannique
  choice: le Père qui m’a envoyé
  alternative: mon Père qui m’a envoyé ; Dieu le Père qui m’a envoyé
  rationale: Le grec désigne simplement « le Père » et l’identifie comme celui qui a envoyé Jésus. La traduction conserve cette affirmation relationnelle sans ajout doctrinal explicatif.
- issue: Portée testimoniale ou judiciaire de μαρτυρέω
  choice: témoigne
  alternative: rend témoignage
  rationale: « Témoigne » est clair et actuel, garde la notion de témoignage pertinente dans le contexte et permet de reproduire exactement la répétition du verbe.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est moi qui » restitue l’emphase naturelle de ἐγώ tout en évitant une formulation pesante. La répétition de « témoigne » et de « à mon sujet » préserve le parallélisme serré du grec.
