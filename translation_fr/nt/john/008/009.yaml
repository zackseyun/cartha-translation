revisions:
- from: Mais eux[a], après avoir entendu cela, leur conscience les accusant, sortaient un à un, en commençant par les plus âgés et jusqu’aux derniers[b]. Jésus resta seul, avec la femme qui se tenait au milieu.
  to: Mais eux[a], ayant entendu cela et convaincus par leur conscience, sortirent un à un, en commençant par les plus âgés jusqu’aux derniers[b]. Jésus resta seul, la femme se tenant au milieu.
  rationale: La révision rétablit un verbe narratif achevé, rend ἐλεγχόμενοι par une expression française plus idiomatique tout en conservant l’agent moral (« par leur conscience »), et corrige la syntaxe de la progression allant des plus âgés aux derniers. La formulation finale maintient la présence de la femme, debout au milieu, sans contredire le fait que Jésus est le seul autre personnage resté.
