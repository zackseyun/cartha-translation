source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: fr
  text: Mais eux[a], ayant entendu cela et convaincus par leur conscience, sortirent un à un, en commençant par les plus âgés jusqu’aux derniers[b]. Jésus resta seul, la femme se tenant au milieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Suite du récit de la femme surprise en adultère (Jean 7.53–8.11). Voir la note sur Jean 7.53.
    reason: textual_critical
  - marker: b
    text: 'Ou : « jusqu’au dernier ».'
    reason: previous_rendering
lexical_decisions:
- source_word: συνείδησις
  choice: conscience
  rationale: « Conscience » est l’équivalent français courant et précis pour la faculté intérieure qui porte un jugement moral sur ses propres actes.
- source_word: ἐλέγχω
  choice: accuser
  rationale: Dans la tournure « leur conscience les accusant », ce verbe exprime clairement la mise en évidence intérieure de leur faute, sans ajouter une condamnation extérieure.
- source_word: πρεσβύτερος
  choice: les plus âgés
  rationale: Le contraste avec « les derniers » décrit ici plus naturellement un ordre d’âge ou d’ancienneté qu’une fonction officielle d’« anciens ».
- source_word: εἷς καθ' εἷς
  choice: un à un
  rationale: Cette expression idiomatique restitue directement la sortie successive de chacun.
- source_word: κατελείφθη μόνος
  choice: resta seul
  rationale: 'Cette formulation française naturelle rend le résultat du passif grec : Jésus fut le seul à rester avec la femme.'
theological_decisions: []
translation_notes:
  register: Français moderne, naturel et digne. La structure participiale grecque est rendue par « leur conscience les accusant », ce qui conserve le lien explicite entre la conscience et la prise de conscience de la faute. « Les plus âgés » évite de faire de πρεσβύτεροι un titre institutionnel dans ce contexte.
