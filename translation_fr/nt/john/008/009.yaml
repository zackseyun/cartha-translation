review_pass:
  verdict: revise
  source_fidelity: Le sens est globalement bien rendu, y compris « conscience », la valeur non institutionnelle de πρεσβύτεροι (« les plus âgés »), et la scène finale où Jésus demeure tandis que la femme est encore au milieu. Cependant, l’imparfait « sortaient » affaiblit indûment l’aoriste narratif ἐξήρχοντο; le passé simple rend mieux la progression ponctuelle du récit.
  naturalness: « Leur conscience les accusant » est grammaticalement possible, mais lourd et moins idiomatique dans cette narration. « Convaincus par leur conscience » restitue plus naturellement le participe passif ἐλεγχόμενοι. La coordination « en commençant ... et jusqu’aux » est également à corriger.
  terminology: « Conscience » est exact. « Convaincus par leur conscience » exprime la mise en cause morale sans imposer une interprétation doctrinale ni judiciaire excessive. « Les plus âgés » évite à juste titre de transformer πρεσβύτεροι en titre d’office.
