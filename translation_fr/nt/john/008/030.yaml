id: JHN.8.30
reference: John 8:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα αὐτοῦ λαλοῦντος πολλοὶ ἐπίστευσαν εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/030.yaml
  text: As he was saying these things[b][a], many believed in him.
translation:
  language: fr
  text: Pendant qu’il disait cela[a], beaucoup crurent en lui[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Tandis qu’il disait ces choses ».
    reason: Alternative plus formelle qui conserve explicitement le pluriel de ταῦτα et la simultanéité du génitif absolu.
  - marker: b
    text: Ou « mirent leur foi en lui ».
    reason: Formulation possible qui explicite la confiance personnelle exprimée par πιστεύω suivi de εἰς.
lexical_decisions:
- source_word: ταῦτα
  choice: cela
  rationale: Le démonstratif neutre pluriel renvoie au contenu des paroles précédentes. En français naturel, « cela » reprend idiomatiquement l’ensemble de ce qui vient d’être dit, là où « ces choses » serait plus formel et moins courant.
- source_word: αὐτοῦ λαλοῦντος
  choice: pendant qu’il disait
  rationale: Le génitif absolu avec participe présent exprime une action contemporaine et en cours. « Pendant qu’il disait » conserve clairement cette simultanéité.
- source_word: πολλοὶ
  choice: beaucoup
  rationale: L’adjectif substantivé désigne un grand nombre de personnes. « Beaucoup » le rend sans ajout explicatif inutile.
- source_word: ἐπίστευσαν
  choice: crurent
  rationale: L’aoriste présente globalement l’événement de leur foi. « Crurent » est concis et maintient le lien lexical avec le vocabulaire de la foi, sans imposer la nuance plus interprétative de « se mirent à croire ».
- source_word: εἰς αὐτόν
  choice: en lui
  rationale: Avec πιστεύω, εἰς marque ici une foi ou une confiance dirigée vers Jésus. « Croire en lui » est l’expression française idiomatique correspondante.
theological_decisions:
- issue: Sens de πιστεύω εἰς αὐτόν dans l’usage johannique
  choice: crurent en lui
  alternative: mirent leur foi en lui
  rationale: « Crurent en lui » préserve la portée personnelle et relationnelle de la construction, plutôt que la simple adhésion à ses propos. La variante explicite la dimension de confiance sans être introduite dans le texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. « Pendant que » rend nettement la simultanéité; « cela » évite le calque peu idiomatique « ces choses ». Le passé simple convient au registre narratif biblique soutenu sans être archaïque.
