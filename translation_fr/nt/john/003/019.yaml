  naturalness: La formulation est globalement naturelle et de registre moderne. « Les êtres humains », « les ténèbres » et « leurs œuvres étaient mauvaises » sont idiomatiques dans un contexte biblique soutenu.
  terminology: « Jugement », « lumière », « monde », « ténèbres » et « œuvres » préservent utilement le vocabulaire johannique. « Les êtres humains » rend correctement la portée générique de οἱ ἄνθρωποι sans imposer une lecture masculine.
