id: JHN.3.19
reference: John 3:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: fr
  text: 'Et voici en quoi consiste le jugement : la lumière est venue dans le monde, et les êtres humains ont aimé les ténèbres plutôt que la lumière, car leurs œuvres étaient mauvaises.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: jugement
  rationale: « Jugement » conserve le sens large d’évaluation décisive sans réduire d’emblée le terme à la seule condamnation.
- source_word: τὸ φῶς
  choice: la lumière
  rationale: La métaphore johannique est conservée sans expliciter son référent dans le corps du texte.
- source_word: ἐλήλυθεν
  choice: est venue
  rationale: Le passé composé rend naturellement en français l’accompli grec et l’arrivée de la lumière dont les effets demeurent.
- source_word: κόσμον
  choice: monde
  rationale: « Monde » préserve l’étendue et les nuances propres à l’usage johannique.
- source_word: ἠγάπησαν ... μᾶλλον ... ἢ
  choice: ont préféré ... à
  rationale: Cette tournure française exprime naturellement l’attachement comparatif indiqué par l’ensemble de la construction, même si elle rend moins directement le verbe « aimer ».
- source_word: οἱ ἄνθρωποι
  choice: les êtres humains
  rationale: Le grec désigne ici l’humanité en général, et non les hommes de sexe masculin seulement; cette formulation est précise et inclusive en français moderne.
- source_word: τὸ σκότος
  choice: les ténèbres
  rationale: Le pluriel lexicalisé « les ténèbres » est la formulation française biblique et courante qui maintient le contraste symbolique avec « la lumière ».
- source_word: πονηρὰ
  choice: mauvaises
  rationale: Dans l’expression « œuvres mauvaises », le terme indique clairement leur qualité morale; « mauvaises » est naturel et moins surtraduit que « malfaisantes ».
- source_word: τὰ ἔργα
  choice: œuvres
  rationale: « Œuvres » maintient la correspondance lexicale johannique, tout en restant intelligible dans ce contexte.
theological_decisions:
- issue: Référent de « la lumière »
  choice: Conserver la métaphore « la lumière ».
  alternative: Employer explicitement « Jésus » ou faire de « la Lumière » un titre marqué par une majuscule.
  rationale: Le contexte rattache fortement la lumière au Fils, mais le grec maintient la métaphore; la traduction préserve ainsi la texture et l’ambiguïté littéraire du texte.
- issue: Sens de κρίσις
  choice: « jugement »
  alternative: « condamnation » ou « verdict »
  rationale: Le verset expose en quoi consiste ou sur quoi repose le jugement; « condamnation » préciserait prématurément son résultat.
- issue: Force générique de οἱ ἄνθρωποι
  choice: « les êtres humains »
  alternative: « les hommes » ou « les gens »
  rationale: Le référent est l’humanité en général. « Les êtres humains » évite une lecture limitée aux personnes de sexe masculin, tandis que « les gens » serait moins soutenu.
translation_notes:
  register: Français international moderne, digne et accessible. « Voici en quoi consiste » rend idiomatiquement αὕτη ... ἐστιν ... ὅτι. Le connecteur « mais » exprime ici le contraste discursif porté par καί entre la venue de la lumière et la préférence humaine pour les ténèbres.
