    issue: « ont préféré » pour ἠγάπησαν ... μᾶλλον ... ἢ
    rationale: Cette solution rend la préférence comparative, mais ne traduit pas le verbe « aimer », qui est important dans la formulation grecque. « Ont aimé ... plutôt que » conserve les deux éléments.
  - severity: low
