id: JHN.3.13
reference: John 3:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: fr
  text: 'Et personne n’est monté au ciel, sinon celui qui est descendu du ciel : le Fils de l’homme[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « celui qui est venu du ciel ».'
    reason: lexical_alternative
  - marker: b
    text: « Le Fils de l’homme » est la manière caractéristique dont Jésus se désigne lui-même et fait écho à Daniel 7.13-14.
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: personne
  rationale: « Personne » rend naturellement le pronom négatif sans employer le terme plus soutenu « nul » ni restreindre indûment sa portée.
- source_word: ἀναβέβηκεν
  choice: n’est monté
  rationale: Le passé composé rend le parfait grec comme une action accomplie qui demeure pertinente. La tournure négative française « personne n’est monté » est idiomatique.
- source_word: εἰς τὸν οὐρανόν
  choice: au ciel
  rationale: Avec « monter », le français courant exprime naturellement le mouvement par « au ciel » ; « dans le ciel » risquerait d’évoquer surtout le ciel visible.
- source_word: εἰ μὴ
  choice: sinon
  rationale: Dans cette construction exceptive, « sinon » désigne clairement l’unique exception à l’énoncé négatif.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: celui qui est descendu du ciel
  rationale: Cette formulation conserve la valeur substantivée du participe, l’origine céleste exprimée par ἐκ et le contraste lexical entre monter et descendre.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation traditionnelle et intelligible préserve à la fois l’usage caractéristique des Évangiles et l’écho intertextuel à Daniel 7, sans l’interpréter par une paraphrase.
theological_decisions:
- issue: Portée christologique de « le Fils de l’homme »
  choice: Conserver la désignation reconnue « le Fils de l’homme ».
  alternative: « l’Être humain » ou « l’Humain »
  rationale: La formule grecque peut porter à la fois une dimension idiomatique et une résonance apocalyptique. La traduction traditionnelle maintient cette tension et le lien avec Daniel 7 sans imposer une interprétation réductrice.
- issue: Valeur temporelle et aspectuelle de la montée et de la descente
  choice: Employer « n’est monté » et « est descendu ».
  alternative: « n’est allé » et « est venu »
  rationale: Les verbes choisis préservent directement le contraste spatial du grec et la déclaration sur l’origine céleste et l’accès unique du Fils de l’homme, sans développement doctrinal ajouté.
translation_notes:
  register: Français international moderne, clair et digne. « Personne » et « celui qui » restent accessibles, tandis que « le Fils de l’homme » conserve la formulation biblique reconnue. Le deux-points présente l’apposition finale sans expliciter davantage son rapport au syntagme précédent.
