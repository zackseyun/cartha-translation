id: JHN.3.36
reference: John 3:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: fr
  text: 'Celui qui croit au Fils a la vie éternelle ; mais celui qui désobéit au Fils[a] ne verra pas la vie : la colère de Dieu demeure sur lui.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui refuse de croire au Fils ». Le verbe grec peut exprimer aussi bien le refus de croire que la désobéissance.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱόν
  choice: Celui qui croit au Fils
  rationale: Le participe présent substantivé désigne toute personne caractérisée par la foi ; « croire au Fils » exprime naturellement en français la confiance dirigée vers sa personne.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: a la vie éternelle
  rationale: Le présent « a » conserve la possession actuelle exprimée par ἔχει, tandis que « vie éternelle » est l’équivalent français établi de l’expression johannique.
- source_word: ὁ δὲ ἀπειθῶν τῷ υἱῷ
  choice: mais celui qui désobéit au Fils
  rationale: ἀπειθέω peut exprimer la désobéissance aussi bien que le refus de croire. Le texte principal garde le sens large et fort de désobéissance, tandis que la note signale l’autre nuance.
- source_word: οὐκ ὄψεται ζωήν
  choice: ne verra pas la vie
  rationale: Cette formulation conserve au futur l’image johannique de « voir la vie » sans la réduire à « avoir » ou à « connaître » la vie.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: la colère de Dieu
  rationale: Traduction directe du génitif grec, sans atténuer l’affirmation du jugement divin.
- source_word: μένει ἐπ’ αὐτόν
  choice: demeure sur lui
  rationale: « Demeure » rend le présent et reprend un verbe important du vocabulaire johannique ; « sur lui » conserve la relation exprimée par ἐπί.
theological_decisions:
- issue: Sens de ἀπειθῶν en contraste avec πιστεύων
  choice: « celui qui désobéit » dans le texte, avec « celui qui refuse de croire » en note
  alternative: « celui qui refuse de croire au Fils »
  rationale: Le contraste avec « croit » fait ressortir le refus de croire, mais le verbe grec comporte aussi la notion de désobéissance. La traduction et la note préservent ensemble cette tension.
- issue: Temporalité de la vie éternelle et de la colère
  choice: Possession actuelle de la vie éternelle et permanence actuelle de la colère, avec une perspective future dans « ne verra pas »
  alternative: Interpréter la vie éternelle et la colère comme uniquement futures
  rationale: ἔχει et μένει sont au présent, alors que ὄψεται est au futur. La traduction maintient cette articulation temporelle sans l’harmoniser.
translation_notes:
  register: Français international moderne, clair et digne. Le générique masculin singulier « celui » suit la structure grecque et vise toute personne. Le point-virgule et les deux-points rendent lisible l’opposition puis sa conséquence, sans modifier les rapports logiques du texte.
