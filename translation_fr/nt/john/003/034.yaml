id: JHN.3.34
reference: John 3:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: fr
  text: En effet, celui que Dieu a envoyé prononce les paroles de Dieu, car il donne l’Esprit sans mesure.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le sujet de « donne » n’est pas exprimé en grec. On peut aussi comprendre : « car celui que Dieu a envoyé donne l’Esprit sans mesure ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: celui que
  rationale: Le pronom relatif accusatif masculin singulier désigne la personne envoyée par Dieu. « Celui que » rend naturellement sa valeur substantivée.
- source_word: ἀπέστειλεν
  choice: a envoyé
  rationale: L’aoriste renvoie ici à l’acte d’envoyer. Le passé composé est naturel en français moderne et conserve le motif johannique de l’envoi.
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: les paroles de Dieu
  rationale: Le pluriel ῥήματα désigne des paroles prononcées. Cette formulation conserve le génitif et le vocabulaire johannique sans lourdeur.
- source_word: λαλεῖ
  choice: dit
  rationale: Dans cette construction, « dit les paroles de Dieu » est plus idiomatique en français que le calque « parle les paroles de Dieu », tout en exprimant l’activité de parler.
- source_word: οὐ … ἐκ μέτρου
  choice: sans mesure
  rationale: Avec la négation, l’expression signifie que le don n’est ni mesuré ni limité. « Sans mesure » conserve l’image grecque avec concision.
- source_word: δίδωσιν
  choice: donne
  rationale: Le présent de l’indicatif exprime une affirmation actuelle ou générale. « Donne » en est l’équivalent le plus direct.
- source_word: τὸ πνεῦμα
  choice: l’Esprit
  rationale: Dans le contexte johannique, l’expression désigne très probablement l’Esprit de Dieu. La majuscule française signale ce référent, sans prétendre reproduire une distinction graphique du grec ancien.
theological_decisions:
- issue: Sujet implicite de δίδωσιν (« donne »)
  choice: Le pronom « il » est compris principalement comme renvoyant à Dieu, qui donne l’Esprit sans mesure.
  alternative: Le pronom peut renvoyer à celui que Dieu a envoyé, c’est-à-dire au Fils, qui donne alors l’Esprit sans mesure.
  rationale: Le grec n’exprime pas le sujet de δίδωσιν. Le déroulement de la phrase permet de comprendre Dieu comme celui qui donne l’Esprit à son envoyé, ce qui explique que celui-ci dise les paroles de Dieu. Toutefois, le référent de l’envoyé reste grammaticalement possible. Le texte français conserve donc le pronom ambigu et la note expose explicitement l’autre lecture.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » rend la valeur explicative de γάρ en tête de phrase. Le pronom « il » préserve l’ambiguïté réelle du sujet de « donne », tandis que la note en précise les deux lectures possibles.
