id: JHN.3.7
reference: John 3:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: fr
  text: 'Ne t’étonne pas de ce que je t’ai dit[b] : « Il faut que vous naissiez d’en haut[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nouveau ». Le grec ἄνωθεν peut signifier « d’en haut » ou « de nouveau » (ou « à nouveau »).
    reason: alternative_reading
  - marker: b
    text: Dans « je t’ai dit », le pronom grec est au singulier ; dans « il faut que vous naissiez », il est au pluriel.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: Ne t’étonne pas
  rationale: μή avec le subjonctif aoriste exprime ici une défense. « Ne t’étonne pas » est naturel en français moderne et rend bien θαυμάζω sans ton archaïque.
- source_word: ὅτι
  choice: de ce que
  rationale: ὅτι introduit ici le contenu de ce qui a été dit. La tournure « s’étonner de ce que » restitue naturellement ce rapport en français.
- source_word: εἶπόν σοι
  choice: je t’ai dit
  rationale: Le pronom σοι est singulier. « Je t’ai dit » est idiomatique et conserve l’adresse personnelle à Nicodème.
- source_word: Δεῖ
  choice: Il faut
  rationale: Δεῖ exprime une nécessité. « Il faut que » en conserve la force tout en introduisant naturellement un subjonctif français.
- source_word: ὑμᾶς
  choice: vous
  rationale: Le pronom grec est pluriel, en contraste avec le singulier σοι. Le français permet de rendre explicitement ce contraste par « t’ » puis « vous » ; une note le signale afin d’éviter que « vous » soit compris comme un simple vouvoiement.
- source_word: γεννηθῆναι
  choice: naissiez
  rationale: L’infinitif passif de γεννάω est rendu, après « il faut que », par le subjonctif « naissiez ». Cette formulation naturelle conserve l’image de la naissance.
- source_word: ἄνωθεν
  choice: d’en haut
  rationale: ἄνωθεν peut signifier « d’en haut » ou « de nouveau ». « D’en haut » convient à l’accent johannique sur l’origine céleste, tandis que l’autre sens authentique est conservé en note.
theological_decisions:
- issue: Sens de ἄνωθεν dans la parole sur la nouvelle naissance
  choice: d’en haut
  alternative: de nouveau
  rationale: Le mot possède ici une polysémie importante dans le dialogue avec Nicodème. L’usage johannique et l’accent sur l’origine divine favorisent « d’en haut » dans le texte principal, sans supprimer le sens possible « de nouveau », indiqué en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement singulier suivi du pluriel « vous » reproduit le changement de nombre du grec ; la note empêche de confondre ce pluriel avec un vouvoiement.
