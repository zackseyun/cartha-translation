  variant: modern international French
source:
  edition: SBLGNT
  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: fr
  text: Celui qui vient d’en haut est au-dessus de tous[a]. Celui qui est de la terre est de la terre et parle de la terre[b]. Celui qui vient du ciel est au-dessus de tous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vient du ciel » pour « vient d’en haut » ; le grec ἄνωθεν indique ici une origine d’en haut, précisée ensuite par « du ciel ».
    reason: lexical_alternative
  - marker: b
    text: Ou « parle à partir de la terre ». Le grec répète plus littéralement « de la terre » ; l’expression peut évoquer la source, la sphère ou le sujet de ses paroles.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: d’en haut
  rationale: Avec « vient », le terme indique ici l’origine, non la répétition. « D’en haut » conserve le contraste vertical avec la terre et reste distinct de l’expression explicite « du ciel » à la fin du verset.
- source_word: ἐρχόμενος
  choice: qui vient
  rationale: Le participe présent substantivé est rendu naturellement en français tout en gardant sa valeur descriptive.
- source_word: ἐπάνω πάντων
  choice: au-dessus de tous
  rationale: Cette formulation exprime la suprématie tout en conservant l’image spatiale. Le masculin pluriel « tous » laisse ouverte la portée personnelle ou plus générale de πάντων.
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: celui qui est de la terre
  rationale: La tournure conserve l’accent mis sur l’origine et prépare la répétition rhétorique de « terre ».
- source_word: γῆ
  choice: terre
  rationale: Le mot désigne ici la sphère terrestre opposée au ciel, plutôt que le sol ou un territoire.
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: est de la terre
  rationale: La répétition grecque est maintenue afin de souligner l’origine et la condition terrestres.
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: parle à partir de la terre
  rationale: Cette traduction conserve la valeur de provenance de ἐκ et évite de trancher entre origine, sphère et sujet du discours; une note signale l’autre compréhension possible.
- source_word: οὐρανός
  choice: ciel
  rationale: Dans ce contraste johannique, le terme renvoie au domaine céleste, opposé à la terre.
theological_decisions:
- issue: Rapport entre « d’en haut » et « du ciel »
  choice: 'Conserver deux formulations distinctes: « d’en haut » puis « du ciel ».'
  alternative: Traduire les deux expressions par « du ciel ».
  rationale: Le grec emploie deux expressions apparentées mais différentes. Les conserver permet à la seconde de préciser la première sans effacer la diction johannique.
- issue: Portée de la triple répétition de l’origine terrestre
  choice: Maintenir « de la terre ... de la terre ... à partir de la terre ».
  alternative: Lisser en « celui qui est terrestre parle des choses terrestres » ou « parle d’une manière terrestre ».
  rationale: La répétition est rhétoriquement marquée et oppose fortement l’origine terrestre à l’origine céleste. La maintenir évite d’imposer une interprétation unique au dernier syntagme.
translation_notes:
  register: Français international moderne, digne et accessible. La structure répétitive du grec est volontairement perceptible. « Parle à partir de la terre » est légèrement marqué, mais préserve mieux l’ambiguïté de provenance que des paraphrases plus interprétatives.
