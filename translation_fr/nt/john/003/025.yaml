  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: fr
  text: Il y eut alors une discussion entre les disciples de Jean et un Juif au sujet de la purification[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au sujet du lavage » ou « au sujet de la purification rituelle ». Le terme grec peut désigner un lavage ou une purification ; dans ce contexte, il comporte probablement une connotation rituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: s’éleva
  rationale: Le verbe introduit la survenue d’un événement. « Une discussion s’éleva » est une tournure française naturelle qui conserve cette idée.
- source_word: οὖν
  choice: Alors
  rationale: La particule marque ici la progression du récit, sans qu’il soit nécessaire de lui donner une forte valeur logique comme « donc ».
- source_word: ζήτησις
  choice: discussion
  rationale: Le terme peut désigner une discussion, un débat ou une controverse. « Discussion » laisse ouverte l’intensité exacte de l’échange, que le verset ne précise pas.
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου ... μετὰ Ἰουδαίου
  choice: entre les disciples de Jean et un Juif
  rationale: La formulation idiomatique française exprime les deux parties impliquées. Elle préserve le singulier de Ἰουδαίου.
- source_word: περὶ καθαρισμοῦ
  choice: au sujet de la purification
  rationale: « Purification » conserve à la fois le sens général de nettoyage et la probable portée rituelle ou religieuse du contexte, sans la rendre explicite à l’excès.
theological_decisions:
- issue: Faut-il rendre καθαρισμός par un terme explicitement rituel ?
  choice: purification
  alternative: nettoyage ; purification rituelle
  rationale: Le contexte johannique suggère une purification religieuse ou rituelle, mais le verset n’en définit pas précisément la nature. « Purification » préserve cette nuance sans ajouter « rituelle » dans le texte.
translation_notes:
  register: Français international moderne, naturel et digne. « Un Juif » conserve le singulier du grec. « Discussion » évite d’accentuer au-delà du texte le caractère conflictuel de l’échange.
