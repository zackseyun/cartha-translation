  naturalness: Le français est globalement fluide. « La mariée / le marié » est à la fois naturel et plus précis dans ce contexte nuptial. « Se réjouit grandement à cause de la voix » exprime clairement le rapport causal de διά avec l’accusatif.
  terminology: La révision rétablit de manière cohérente le couple terminologique nuptial « mariée / marié », sans identifier allégoriquement la mariée ni transformer l’ami en témoin. La note culturelle conserve le caractère non technique de φίλος.
