id: JHN.3.29
reference: John 3:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: fr
  text: Celui qui a la mariée est le marié. Mais l’ami du marié[a], qui se tient là et l’entend, se réjouit grandement[b] à cause de la voix du marié. Ainsi, cette joie qui est la mienne a été portée à sa plénitude[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « l’ami du marié ». Son rôle pouvait ressembler à celui d’un témoin de mariage, mais le terme grec reste simplement « ami ».
    reason: cultural_note
  - marker: b
    text: Littéralement « se réjouit de joie », expression grecque qui souligne fortement sa joie.
    reason: lexical_alternative
  - marker: c
    text: Ou « a été pleinement accomplie » ou « est complète » ; le grec exprime une joie parvenue à sa plénitude.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: Celui qui a l’épouse
  rationale: L’article avec le participe présent a une valeur substantivale. Cette formulation conserve la construction générale du grec et l’image nuptiale sans préciser l’identité symbolique de l’épouse.
- source_word: νυμφίος
  choice: l’époux
  rationale: « Époux » correspond au rôle masculin dans l’image nuptiale et s’accorde naturellement avec « l’épouse ». « Le marié » serait possible, mais mettrait davantage l’accent sur la cérémonie.
- source_word: φίλος τοῦ νυμφίου
  choice: l’ami de l’époux
  rationale: Traduction transparente du grec, préférable à « témoin », qui imposerait une fonction culturelle plus précise que le texte.
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: qui se tient là et l’entend
  rationale: Le parfait de ἵστημι décrit une posture maintenue, rendue naturellement par « se tient là ». « L’entend » préserve le sens direct de ἀκούω avec le pronom au génitif sans anticiper explicitement le mot « voix ».
- source_word: χαρᾷ χαίρει
  choice: éprouve une grande joie
  rationale: Le nom et le verbe de même racine forment une expression emphatique. La formulation française restitue cette intensité sans calque maladroit.
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: à la voix de l’époux
  rationale: διά avec l’accusatif indique ici la cause. « À la voix de » exprime naturellement en français que la voix de l’époux provoque cette joie.
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: Ainsi, cette joie qui est la mienne
  rationale: « Ainsi » marque la conséquence exprimée par οὖν. La tournure développée conserve l’insistance du démonstratif et du possessif articulé.
- source_word: πεπλήρωται
  choice: est devenue complète
  rationale: Le parfait passif présente la joie comme ayant été menée à sa plénitude et se trouvant désormais complète, sans limiter le verbe à l’accomplissement d’une prédiction.
theological_decisions:
- issue: L’identité symbolique de l’épouse et la position de Jean-Baptiste
  choice: Conserver sans explication ajoutée l’image de l’époux, de l’épouse et de l’ami de l’époux.
  alternative: Identifier explicitement l’épouse au peuple de Dieu ou à l’Église, ou appeler l’ami « témoin de mariage ».
  rationale: Le verset ne définit pas lui-même l’identité de l’épouse et ne donne pas à l’ami un titre cérémoniel précis. La traduction laisse donc ouvertes les implications ecclésiologiques et culturelles.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve l’image nuptiale et ses répétitions structurantes tout en évitant les calques les moins naturels. Les trois notes signalent respectivement le contexte culturel, l’emphase de l’expression grecque et la nuance résultative du parfait passif.
