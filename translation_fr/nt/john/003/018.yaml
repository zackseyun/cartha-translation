id: JHN.3.18
reference: John 3:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: fr
  text: Celui qui croit en lui n’est pas jugé[a] ; mais celui qui ne croit pas est déjà jugé, parce qu’il n’a pas cru au nom du Fils unique de Dieu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans les deux occurrences, le verbe grec peut aussi se traduire par « condamner » dans ce contexte.
    reason: lexical_alternative
  - marker: b
    text: Ou « du Fils sans égal de Dieu ». Le terme grec souligne que le Fils est unique en son genre.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: Celui qui croit en lui
  rationale: Le participe présent substantivé désigne de manière générale la personne qui croit ; « croit en lui » rend naturellement la confiance dirigée vers sa personne.
- source_word: οὐ κρίνεται / ἤδη κέκριται
  choice: n’est pas jugé / est déjà jugé
  rationale: « Juger » conserve l’étendue sémantique de κρίνω et la répétition du même verbe grec. Le parfait κέκριται est rendu par « est déjà jugé », qui exprime clairement l’état présent résultant du jugement.
- source_word: ὁ δὲ μὴ πιστεύων
  choice: mais celui qui ne croit pas
  rationale: « Mais » marque le contraste introduit par δέ, et la tournure substantivée reste parallèle à la première proposition.
- source_word: ὅτι μὴ πεπίστευκεν
  choice: parce qu’il n’a pas cru
  rationale: ὅτι introduit ici la cause. Le passé composé rend le parfait grec et son résultat présent sans alourdir la phrase.
- source_word: εἰς τὸ ὄνομα
  choice: au nom
  rationale: Avec « croire », « croire au nom de » est une expression française naturelle qui garde l’image johannique du nom, c’est-à-dire l’identité révélée de la personne, sans l’expliciter dans le texte.
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: du Fils unique de Dieu
  rationale: « Fils unique » exprime de façon concise la singularité portée par μονογενής et correspond à un français biblique actuel, sans imposer dans le texte principal la formulation traditionnelle « unique-engendré ».
theological_decisions:
- issue: Sens de κρίνω dans le contexte de Jean 3.17-19
  choice: jugé dans les deux propositions
  alternative: condamné
  rationale: Le contexte permet de comprendre un jugement défavorable, voire une condamnation, mais le verbe grec garde en lui-même le sens plus large de « juger ». Employer le même terme dans les deux propositions préserve la répétition grecque et l’ambiguïté théologique, tandis qu’une note signale la valeur contextuelle possible.
- issue: Sens de μονογενής appliqué au Fils
  choice: Fils unique
  alternative: Fils sans pareil ; traditionnellement, Fils unique-engendré
  rationale: Le choix principal souligne le caractère unique du Fils sans introduire explicitement une notion biologique ni faire dépendre la traduction d’une formulation doctrinale postérieure. La note conserve l’autre possibilité et la tradition historique.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme des deux propositions ainsi que la répétition de « jugé » reflètent la structure grecque. La ponctuation conserve le contraste net du verset.
