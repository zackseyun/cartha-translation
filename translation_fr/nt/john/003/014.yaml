id: JHN.3.14
reference: John 3:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: fr
  text: Et tout comme Moïse a élevé le serpent dans le désert[a], de même, il faut que le Fils de l’homme soit élevé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Voir Nombres 21.8-9, où Moïse élève le serpent dans le désert.
    reason: cross_reference
  - marker: b
    text: Ou « exalté ». Le verbe grec peut désigner à la fois le fait d’élever physiquement et celui d’exalter ; dans Jean, les deux sens semblent se rejoindre.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς … οὕτως
  choice: tout comme … de même
  rationale: Cette construction française naturelle marque clairement la correspondance entre l’action de Moïse et ce qui doit arriver au Fils de l’homme.
- source_word: ὕψωσεν
  choice: a élevé
  rationale: Dans l’allusion à Nombres 21, le verbe désigne concrètement l’action de placer le serpent en hauteur. « Élever » maintient aussi le lien lexical avec le second emploi du verbe.
- source_word: ὄφιν
  choice: serpent
  rationale: « Serpent » est clair en français moderne et correspond au vocabulaire biblique de l’épisode évoqué.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: « Désert » est l’expression française courante pour le cadre du séjour d’Israël évoqué ici.
- source_word: ὑψωθῆναι
  choice: soit élevé
  rationale: Le passif conserve l’ambiguïté johannique entre l’élévation physique sur la croix et l’exaltation du Fils de l’homme.
- source_word: δεῖ
  choice: il faut que
  rationale: Cette tournure exprime naturellement en français la nécessité indiquée par le grec, sans la réduire à une simple prédiction.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation reçue préserve le titre christologique et ses résonances bibliques sans l’interpréter davantage.
theological_decisions:
- issue: Double sens johannique de ὑψόω
  choice: Employer « élevé » pour les deux occurrences dans le texte principal.
  alternative: « dressé » pour le serpent et « exalté » pour le Fils de l’homme
  rationale: La répétition d’un même verbe reflète le parallèle grec et préserve la tension entre l’élévation concrète et l’exaltation, sans limiter le propos à un seul de ces sens.
translation_notes:
  register: Français international moderne, clair et digne. « Tout comme … de même » rend le parallélisme explicite, tandis que la répétition d’« élevé » conserve le jeu de sens du grec.
