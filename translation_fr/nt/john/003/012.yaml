id: JHN.3.12
reference: John 3:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: fr
  text: Si je vous ai parlé des réalités terrestres[a] et que vous ne croyez pas, comment croirez-vous si je vous parle des réalités célestes[b] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « des choses de la terre ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « des choses du ciel ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: les réalités terrestres
  rationale: L’adjectif neutre pluriel est employé comme substantif. « Les réalités terrestres » est naturel en français et maintient le contraste avec τὰ ἐπουράνια sans en préciser excessivement le contenu.
- source_word: εἶπον
  choice: je vous ai parlé
  rationale: L’aoriste renvoie aux paroles précédentes de Jésus. Avec le complément ὑμῖν, « je vous ai parlé » est idiomatique et conserve l’idée de communication adressée aux interlocuteurs.
- source_word: οὐ πιστεύετε
  choice: vous ne croyez pas
  rationale: Le présent de πιστεύω avec οὐ décrit ici leur réaction actuelle ou habituelle. « Vous ne croyez pas » est direct et conforme à l’usage johannique.
- source_word: πῶς ... πιστεύσετε
  choice: comment croirez-vous
  rationale: Cette formulation conserve le futur grec et la force de la question rhétorique sans la transformer en question de capacité.
- source_word: ἐὰν εἴπω
  choice: si je vous parle
  rationale: ἐάν suivi de l’aoriste subjonctif exprime une éventualité future. Le présent français après « si » rend naturellement cette valeur.
- source_word: τὰ ἐπουράνια
  choice: les réalités célestes
  rationale: L’adjectif neutre pluriel substantivé répond directement à τὰ ἐπίγεια. « Les réalités célestes » préserve le contraste et laisse ouverte la nature précise de ces réalités.
theological_decisions:
- issue: Sens du contraste entre « réalités terrestres » et « réalités célestes »
  choice: Traduire le contraste sans préciser si les réalités terrestres sont des images tirées de l’expérience humaine ou des événements qui ont lieu sur terre, ni définir davantage les réalités célestes.
  alternative: Comprendre les « réalités terrestres » comme des illustrations terrestres ou des vérités concernant ce qui se passe sur terre, et les « réalités célestes » comme des mystères divins plus profonds.
  rationale: Le texte oppose deux catégories de révélation, mais ne tranche pas entre ces interprétations. Une formulation large préserve l’ambiguïté et la tension théologique du grec.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme entre « réalités terrestres » et « réalités célestes » reproduit le contraste grec. L’ordre des marqueurs suit leur emplacement réel dans le texte.
