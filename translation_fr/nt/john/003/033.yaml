id: JHN.3.33
reference: John 3:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: fr
  text: Celui qui a reçu son témoignage a certifié que Dieu est vrai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « a apposé son sceau sur ceci : Dieu est vrai ».'
    reason: Alternative lexicale préservant l’image du sceau dans ἐσφράγισεν.
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: Celui qui a reçu
  rationale: L’article suivi du participe aoriste est substantivé et désigne de manière générale la personne qui reçoit le témoignage. « Celui qui a reçu » reste naturel tout en conservant l’aspect accompli.
- source_word: αὐτοῦ
  choice: son
  rationale: Le pronom renvoie le plus naturellement, dans le contexte, à celui qui vient du ciel, dont le témoignage est reçu.
- source_word: μαρτυρίαν
  choice: témoignage
  rationale: « Témoignage » convient à l’objet reçu et préserve le motif johannique du témoignage.
- source_word: ἐσφράγισεν
  choice: a certifié
  rationale: Le verbe signifie littéralement apposer un sceau, mais exprime ici métaphoriquement une attestation ou confirmation formelle. « A certifié » en communique clairement la portée; l’image littérale est conservée en note.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit ici le contenu de ce qui est attesté, et non une cause.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Le groupe nominal défini est directement rendu par « Dieu », sans ajout interprétatif.
- source_word: ἀληθής
  choice: vrai
  rationale: « Vrai » conserve à la fois l’idée que Dieu dit vrai et la résonance johannique plus large de la vérité; « véridique » serait plus explicite mais plus étroit.
theological_decisions:
- issue: Portée métaphorique du langage du sceau
  choice: Rendre ἐσφράγισεν par « a certifié » dans le texte principal
  alternative: « a attesté par son sceau » ou, plus littéralement, « a apposé son sceau pour attester »
  rationale: Recevoir le témoignage revient à reconnaître formellement que Dieu est vrai. La formulation principale communique cette portée en français moderne, tandis que la note préserve l’image du sceau.
- issue: Sens de ἀληθής appliqué à Dieu
  choice: « Dieu est vrai »
  alternative: « Dieu est véridique »
  rationale: « Vrai » préserve l’ampleur et la tension du terme grec, qui peut évoquer tant la véracité que la réalité authentique, sans réduire le propos à une seule nuance.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec sans être artificielle; la note conserve la métaphore ancienne que le texte principal explicite.
