id: JHN.3.4
reference: John 3:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: fr
  text: 'Nicodème lui dit : « Comment un homme[a] peut-il naître alors qu’il est vieux ? Il ne peut tout de même pas entrer une seconde fois[b] dans le ventre de sa mère et naître ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quelqu’un ». Le grec emploie ici le nom masculin singulier « homme » dans un sens générique.
    reason: lexical_alternative
  - marker: b
    text: Le grec dit explicitement « une seconde fois » ; Nicodème comprend les paroles de Jésus au sens littéral.
    reason: cross_reference
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: lui dit
  rationale: Le présent grec est un présent historique fréquent dans le récit johannique. Le passé composé est ici la tournure narrative la plus naturelle en français.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Le nom masculin singulier a ici une portée générique. « Un homme » conserve la forme représentative du grec, tandis que la note signale le sens non exclusivement masculin.
- source_word: γεννηθῆναι
  choice: naître
  rationale: Dans ce contexte, le passif de γεννάω désigne la naissance. La traduction n’ajoute pas d’elle-même « de nouveau », puisque cette idée est exprimée plus loin par δεύτερον.
- source_word: γέρων ὤν
  choice: alors qu’il est vieux
  rationale: Cette proposition circonstancielle rend naturellement le participe grec et maintient l’insistance sur l’âge avancé.
- source_word: μὴ δύναται
  choice: Il ne peut quand même pas… ?
  rationale: μή introduit une question qui appelle une réponse négative. Cette formulation française exprime naturellement l’incrédulité de Nicodème et l’attente d’un « non ».
- source_word: κοιλίαν τῆς μητρὸς αὐτοῦ
  choice: le ventre de sa mère
  rationale: Avec la mention de la mère, κοιλία désigne ici le lieu de la gestation. « Le ventre de sa mère » est clair, courant et moins soutenu ou ambigu que « le sein maternel ».
- source_word: δεύτερον
  choice: une seconde fois
  rationale: Cette expression rend explicitement l’adverbe ordinal et met en évidence l’interprétation littérale que Nicodème donne aux paroles précédentes de Jésus.
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: entrer… et naître
  rationale: Les deux infinitifs coordonnés sont conservés afin de préserver la logique concrète et saisissante de la question.
theological_decisions:
- issue: Portée du masculin singulier ἄνθρωπος
  choice: un homme
  alternative: quelqu’un / une personne
  rationale: Le grec emploie une forme masculine singulière avec une portée générique. Le texte conserve cette forme sans lui attribuer un sens exclusivement masculin, ce que précise la note.
- issue: Rapport avec l’ambiguïté de ἄνωθεν en Jean 3.3
  choice: naître… une seconde fois
  alternative: naître de nouveau
  rationale: Le présent verset contient δεύτερον, « une seconde fois », qui rapporte la compréhension littérale de Nicodème. La traduction n’importe donc pas dans γεννηθῆναι une résolution de l’ambiguïté du verset précédent.
translation_notes:
  register: Français international moderne, naturel et digne. « Il ne peut quand même pas… ? » restitue l’attente d’une réponse négative sans alourdir la phrase d’une question-tag peu idiomatique. « Ventre de sa mère » privilégie la clarté contemporaine.
