id: JHN.3.16
reference: John 3:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: fr
  text: 'Car Dieu a aimé le monde de cette manière : il a donné son Fils unique[a], afin que quiconque croit en lui ne périsse pas, mais qu’il ait la vie éternelle.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon le rendu traditionnel : « Car Dieu a tant aimé le monde qu’il a donné son Fils unique. » Le grec peut toutefois mettre surtout l’accent sur la manière dont Dieu a aimé : il l’a montré en donnant son Fils. Pour « Fils unique », on traduit aussi traditionnellement « Fils unique-engendré »; le mot grec souligne ici son caractère unique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: de cette manière
  rationale: Dans cette construction, le terme indique le plus naturellement la manière dont Dieu a manifesté son amour, explicitée par le don du Fils, plutôt que le seul degré de cet amour.
- source_word: γὰρ
  choice: Car
  rationale: Conserve la valeur explicative qui relie le verset au contexte précédent.
- source_word: ἠγάπησεν
  choice: a aimé
  rationale: Le passé composé est naturel en français actuel pour cet aoriste et présente l’acte d’amour accompli sans en limiter la portée.
- source_word: τὸν κόσμον
  choice: le monde
  rationale: Préserve l’ampleur et la polysémie johanniques de κόσμος sans réduire explicitement le référent à la seule humanité.
- source_word: ὥστε
  choice: ': il a donné'
  rationale: Après « de cette manière », les deux-points introduisent naturellement l’acte concret par lequel l’amour de Dieu s’est manifesté.
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: son Fils unique
  rationale: « Fils unique » exprime en français moderne la singularité de la relation filiale, sans imposer dans le texte principal l’étymologisation traditionnelle « engendré ».
- source_word: ἔδωκεν
  choice: a donné
  rationale: Maintient la portée large du verbe, sans préciser indûment si le don désigne avant tout l’envoi, l’incarnation ou la mort du Fils.
- source_word: ἵνα
  choice: afin que
  rationale: Rend clairement la finalité avec un registre digne et naturel.
- source_word: πᾶς ὁ πιστεύων
  choice: quiconque croit
  rationale: Expression générique et inclusive, idiomatique en français, qui ne tranche pas les débats théologiques ultérieurs.
- source_word: εἰς αὐτὸν
  choice: en lui
  rationale: « Croire en lui » est l’équivalent idiomatique français de πιστεύω εἰς.
- source_word: μὴ ἀπόληται
  choice: ne périsse pas
  rationale: Préserve la gravité et la relative indétermination du verbe grec tout en rendant le subjonctif régi par la proposition finale.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: ait la vie éternelle
  rationale: Rendu français direct qui conserve le contraste avec « périsse » et la formulation théologique johannique.
theological_decisions:
- issue: Sens de Οὕτως
  choice: 'la manière : « de cette manière »'
  alternative: 'le degré ou l’intensité : « tant aimé »'
  rationale: La suite introduite par ὥστε présente le don du Fils comme la manifestation concrète de l’amour de Dieu. La lecture traditionnelle exprimant l’intensité reste possible et est signalée en note.
- issue: Rendu de μονογενής appliqué au Fils
  choice: « Fils unique » dans le texte principal
  alternative: « Fils unique-engendré » ou « Fils seul engendré »
  rationale: Les données lexicales favorisent ici l’idée d’unicité. Le choix conserve la relation filiale singulière sans transformer une question lexicale discutée en affirmation confessionnelle ajoutée; le rendu traditionnel est indiqué en note.
- issue: Portée de πᾶς ὁ πιστεύων
  choice: « quiconque croit »
  alternative: « toute personne qui croit »
  rationale: Le français garde le caractère universel et générique de la formule sans importer une position sur l’élection, l’étendue de l’expiation ou la nature de la réponse humaine.
- issue: Portée du don du Fils
  choice: « il a donné » sans précision supplémentaire
  alternative: « il a livré » ou « il a envoyé »
  rationale: Le verbe grec est assez large pour évoquer la mission et le don de soi du Fils; une formulation plus précise résoudrait indûment cette amplitude.
translation_notes:
  register: Français international moderne, clair et digne. « Car » conserve le lien explicatif; « afin que » maintient un registre soutenu mais courant. L’ordre pronominal « mais qu’il ait » explicite correctement le sujet singulier et générique de « quiconque ».
