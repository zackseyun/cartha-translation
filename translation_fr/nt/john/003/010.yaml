  rationale: 'La révision remplace « maître » par « enseignant », terme qui rend plus précisément διδάσκαλος dans le français international actuel. Elle corrige également l’alternative de note afin de préserver le complément « d’Israël » et la valeur significative de l’article défini grec. Le reste de la formulation est conservé : « Toi, tu » restitue l’emphase du pronom exprimé, et « tu ne sais pas cela » préserve l’ouverture de γινώσκεις entre savoir et compréhension.'
