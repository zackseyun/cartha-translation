    rationale: Pour διδάσκαλος, le contexte vise la fonction d’enseignant de Nicodème. « Maître » peut être compris comme un titre d’adresse ou comme quelqu’un qui domine une discipline; « enseignant » est plus exact et immédiatement intelligible.
  - severity: low
    issue: L’alternative de note « un maître en Israël » change « d’Israël » en « en Israël »
    rationale: Le grec porte τοῦ Ἰσραήλ (« d’Israël »). Même si « en Israël » peut être interprétativement possible, l’alternative annoncée devrait d’abord conserver la même relation que le texte et que la traduction principale.
