  source_fidelity: 'La structure interrogative, l’insistance de σύ (« Toi, tu »), la valeur définie de ὁ διδάσκαλος, et le sens de γινώσκεις sont globalement bien rendus. Cependant, « maître » est moins précis en français moderne pour διδάσκαλος dans cette désignation de Nicodème : il peut évoquer une maîtrise ou un titre d’adresse plutôt que sa fonction d’enseignant.'
  naturalness: La phrase est fluide et conserve une pointe rhétorique naturelle. « L’enseignant d’Israël » est plus clair et idiomatique dans ce contexte que « le maître d’Israël ».
  terminology: '« Enseignant » rend directement διδάσκαλος sans importer les connotations religieuses de « maître ». La note doit aussi maintenir le complément « d’Israël » : son alternative actuelle (« en Israël ») modifie inutilement la relation exprimée par le génitif.'
