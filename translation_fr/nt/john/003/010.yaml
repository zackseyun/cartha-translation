  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: fr
  text: 'Jésus lui répondit : « Toi, tu es l’enseignant d’Israël[a], et tu ne sais pas cela ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « un enseignant d’Israël ». Le grec porte l’article défini : « l’enseignant d’Israël », ce qui donne probablement à l’adresse une force rhétorique appuyée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: lui répondit
  rationale: La formule grecque à deux verbes, littéralement « répondit et lui dit », est une tournure narrative courante. « Lui répondit » en restitue naturellement la fonction en français sans lourdeur.
- source_word: Σὺ
  choice: Toi, tu
  rationale: Le pronom grec exprimé porte une insistance. La dislocation « Toi, tu » conserve cette mise en relief et la force rhétorique de la question.
- source_word: ὁ διδάσκαλος
  choice: le maître
  rationale: « Le maître » préserve l’article défini et désigne ici un enseignant reconnu. « Professeur » serait trop institutionnel et moderne, tandis que « docteur » paraît aujourd’hui archaïque ou évoque surtout un titre universitaire ou médical.
- source_word: τοῦ Ἰσραήλ
  choice: d’Israël
  rationale: Le complément au génitif exprime l’appartenance et la position représentative de Nicodème au sein d’Israël, plutôt qu’une simple localisation géographique.
- source_word: ταῦτα
  choice: cela
  rationale: Le démonstratif neutre pluriel renvoie collectivement aux réalités dont Jésus vient de parler. En français actuel, « cela » est plus naturel que « ces choses » dans cette question.
- source_word: οὐ γινώσκεις
  choice: tu ne sais pas
  rationale: Cette formulation conserve le sens fondamental de γινώσκω tout en laissant le contexte lui donner la nuance de compréhension.
theological_decisions:
- issue: Force de l’adresse ὁ διδάσκαλος τοῦ Ἰσραήλ
  choice: « le maître d’Israël » avec valeur définie
  alternative: « un maître en Israël »
  rationale: L’article défini présente Nicodème comme un enseignant reconnu d’Israël et donne à la question une pointe rhétorique. Le conserver évite d’affaiblir le contraste sans attribuer à Nicodème une fonction théologique plus précise que le texte.
- issue: Nuance de γινώσκεις dans la réprimande
  choice: « tu ne sais pas »
  alternative: « tu ne comprends pas »
  rationale: « Comprendre » expliciterait légitimement le sens contextuel, mais « savoir » préserve davantage l’ouverture lexicale entre connaissance et compréhension.
translation_notes:
  register: Français international actuel, naturel et digne. La formule narrative grecque est allégée en « lui répondit », tandis que l’insistance du pronom Σὺ est conservée par « Toi, tu ». « Maître » est employé au sens d’enseignant reconnu, sans tonalité confessionnelle ajoutée.
