id: JHN.3.20
reference: John 3:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: fr
  text: En effet, toute personne qui pratique le mal hait la lumière et ne vient pas à la lumière, de peur que ses œuvres ne soient dévoilées[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « réprouvées » ou « reconnues coupables » ; le verbe grec peut évoquer le fait de mettre une faute au jour, d’en démontrer la culpabilité ou de la reprendre.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: En effet, toute personne qui
  rationale: La tournure substantivée désigne de façon générale toute personne caractérisée par l’action qui suit. « En effet » rend la valeur explicative de γάρ et relie ce verset au précédent.
- source_word: φαῦλα πράσσων
  choice: qui pratique le mal
  rationale: φαῦλα a ici une portée morale, tandis que le participe présent πράσσων évoque une conduite caractéristique ou répétée. « Pratique le mal » restitue les deux éléments avec naturel.
- source_word: μισεῖ
  choice: hait
  rationale: « Hait » conserve la force directe de μισέω et l’opposition morale marquée à la lumière.
- source_word: τὸ φῶς
  choice: la lumière
  rationale: La métaphore johannique doit être conservée sans paraphrase, car elle évoque à la fois révélation, vérité et manifestation divine.
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: ne vient pas à la lumière
  rationale: Cette formulation garde le mouvement imagé vers la lumière et la simplicité verbale du grec.
- source_word: ἵνα μὴ
  choice: de peur que… ne
  rationale: Dans ce contexte, la construction exprime le but négatif ou l’évitement recherché. La tournure française indique naturellement que la personne se tient à distance afin d’éviter la révélation de ses actes.
- source_word: ἐλεγχθῇ
  choice: soient dévoilées
  rationale: Le verbe peut désigner l’action de mettre au jour, de convaincre de faute ou de reprendre. Avec l’image de la lumière, « dévoilées » met au premier plan la révélation des œuvres sans exclure leur mise en accusation morale.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ses œuvres
  rationale: « Œuvres » préserve le vocabulaire johannique et le lien avec les actes d’une personne. Le possessif « ses » reprend naturellement « toute personne » sans imposer en français un pronom masculin générique.
theological_decisions:
- issue: Portée de ἐλεγχθῇ sous l’action de la lumière
  choice: soient dévoilées
  alternative: soient réprouvées / reconnues coupables
  rationale: Le contexte immédiat met l’accent sur ce que la lumière fait apparaître. « Dévoilées » conserve cette image de révélation morale sans réduire le verbe à une condamnation judiciaire ou à une réprimande.
- issue: Expression générique désignant celui qui pratique le mal
  choice: toute personne… ses œuvres
  alternative: quiconque… ses œuvres / tout homme… ses œuvres
  rationale: Le grec emploie un masculin singulier générique. « Toute personne » en restitue la portée universelle et singulière en français naturel, sans transformer l’énoncé en pluriel ni lui donner une restriction masculine absente de la visée du texte.
translation_notes:
  register: Français international moderne, clair et digne. « Hait » et « œuvres » maintiennent la force et le registre théologique du texte, tandis que « toute personne » assure une formulation générique naturelle. La métaphore répétée de la lumière est conservée à l’identique.
