  source_fidelity: 'Le texte rend fidèlement l’énoncé grec : « Jean répondit » exprime naturellement ἀπεκρίθη…καὶ εἶπεν, « une personne » conserve la valeur générique de ἄνθρωπος, et « ne peut recevoir quoi que ce soit » restitue l’incapacité renforcée par οὐδὲ ἕν. La condition « à moins que cela ne lui ait été donné du ciel » rend correctement ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ, y compris l’origine céleste sans l’expliciter comme « Dieu ».'
