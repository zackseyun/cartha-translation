id: JHN.3.27
reference: John 3:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: fr
  text: 'Jean répondit : « Une personne ne peut recevoir quoi que ce soit, à moins que cela ne lui ait été donné du ciel. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: Jean répondit
  rationale: En français moderne, « répondit » rend naturellement la formule narrative grecque « répondit et dit » sans lourdeur, tout en conservant sa fonction de réponse.
- source_word: ἄνθρωπος
  choice: une personne
  rationale: Le nom grec est ici singulier et générique; « une personne » exprime clairement que l’énoncé concerne tout être humain, sans le limiter aux hommes de sexe masculin.
- source_word: Οὐ δύναται … λαμβάνειν
  choice: ne peut recevoir
  rationale: Cette formulation française naturelle conserve explicitement l’idée d’incapacité exprimée par δύναμαι et le sens réceptif de λαμβάνω dans un contexte de don.
- source_word: οὐδὲ ἓν
  choice: quoi que ce soit
  rationale: Dans cette construction négative, l’expression idiomatique « quoi que ce soit » rend la portée emphatique de « pas même une seule chose » sans produire une tournure française artificielle.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: à moins que cela ne lui ait été donné
  rationale: Le subjonctif passé français rend la condition exceptive et l’état résultant du parfait passif périphrastique grec.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: La traduction conserve l’image et l’ambiguïté révérencielle de la source grecque, sans remplacer explicitement « le ciel » par « Dieu ».
theological_decisions:
- issue: Portée de l’origine céleste dans la déclaration de Jean
  choice: Conserver la formulation générale selon laquelle rien ne peut être reçu sans avoir été donné du ciel.
  alternative: Limiter explicitement l’énoncé aux fonctions ministérielles ou, à l’inverse, en faire une affirmation déterministe exhaustive.
  rationale: Le contexte vise notamment le rôle et l’importance respectifs de Jean et de Jésus, mais la formulation grecque reste générale. La traduction préserve cette ampleur et la tension théologique sans imposer un système doctrinal.
translation_notes:
  register: Français international moderne, digne et accessible. La formule grecque redondante « répondit et dit » est idiomatiquement condensée en « répondit ». Aucun appel de note n’est requis.
