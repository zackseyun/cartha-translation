id: JHN.3.8
reference: John 3:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: fr
  text: Le vent[a] souffle où il veut. Tu entends son bruit[b], mais tu ne sais ni d’où il vient ni où il va. Il en est ainsi de toute personne qui est née de l’Esprit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le même mot grec, pneuma, peut signifier « vent » ou « esprit ». Jésus emploie ce mot au début et à la fin du verset, créant un jeu de sens que le français ne peut pas reproduire entièrement.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « sa voix » ; le mot grec peut désigner une voix ou un son. Ici, il s’agit de l’effet audible du vent.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (v. 8a)
  choice: le vent
  rationale: Associé à πνεῖ (« souffle ») et à un effet audible, le mot désigne ici naturellement le vent. Le dernier πνεῦμα est rendu par « l’Esprit »; la note signale le jeu de sens grec impossible à reproduire entièrement en français.
- source_word: ὅπου θέλει
  choice: où il veut
  rationale: Cette formulation française courante conserve la nuance de volonté et la personnification du vent sans archaïsme.
- source_word: πνεῖ
  choice: souffle
  rationale: Avec πνεῦμα au sens de « vent », « souffle » exprime directement l’image météorologique.
- source_word: φωνὴν αὐτοῦ
  choice: le bruit qu’il fait
  rationale: φωνή peut signifier « voix » ou « son ». En parlant du vent, cette expression est naturelle et indique son effet audible sans suggérer à tort une parole articulée.
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: tu ne sais ni d’où il vient ni où il va
  rationale: La construction « ni… ni… » rend clairement et naturellement en français les deux inconnues coordonnées du grec.
- source_word: οὕτως ἐστίν
  choice: Il en est ainsi de
  rationale: Expression idiomatique qui conserve la fonction comparative de l’analogie.
- source_word: πᾶς ὁ γεγεννημένος
  choice: toute personne qui est née
  rationale: Le tour inclusif restitue la portée générique de la construction substantivée. Le passé composé reflète l’état présent résultant de la naissance exprimé par le participe parfait.
- source_word: ἐκ τοῦ πνεύματος (v. 8b)
  choice: de l’Esprit
  rationale: Dans le contexte de la nouvelle naissance, πνεῦμα renvoie ici à l’Esprit; « née de l’Esprit » exprime naturellement en français l’origine marquée par ἐκ.
theological_decisions:
- issue: Rendre les deux occurrences de πνεῦμα dans un jeu sur son double sens
  choice: Traduire la première par « vent » et la dernière par « Esprit ».
  alternative: Traduire les deux par « Esprit », les deux par « vent », ou placer « Esprit » dans la première proposition avec « vent » en note.
  rationale: Le contexte immédiat — le fait de souffler et d’être entendu — favorise « vent » au début, tandis que la naissance évoquée à la fin favorise « Esprit ». Comme le français ne possède pas un mot usuel réunissant naturellement les deux sens, la note préserve le jeu lexical sans brouiller le sens principal.
- issue: Portée de la comparaison introduite par οὕτως ἐστίν
  choice: 'Conserver une formule ouverte: « Il en est ainsi de toute personne… »'
  alternative: Préciser que seul le mode d’action, l’origine ou le caractère mystérieux de la naissance spirituelle est comparé au vent.
  rationale: Le grec ne précise pas quel aspect exact de l’image est appliqué. La traduction conserve cette tension plutôt que d’imposer une interprétation théologique particulière.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse singulière du contexte. « Toute personne » évite un masculin générique marqué, tandis que « Il en est ainsi » préserve l’ouverture interprétative de l’analogie.
