id: JHN.3.17
reference: John 3:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: fr
  text: En effet, Dieu n’a pas envoyé le Fils dans le monde pour qu’il juge le monde[a], mais pour que le monde soit sauvé par lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « condamne le monde ». Dans ce contexte, le verbe grec peut prendre ce sens plus précis, mais son sens fondamental est « juger ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: En effet, ... n’a pas
  rationale: γάρ relie cette phrase à la précédente en apportant une explication. « En effet » exprime naturellement ce lien en français, tandis que « n’a pas » rend la négation οὐ.
- source_word: ἀπέστειλεν
  choice: a envoyé
  rationale: « Envoyer » est l’équivalent français direct et naturel de ἀποστέλλω, sans surcharger le terme d’une nuance de mandat.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: L’expression grecque avec l’article se rend idiomatiquement par « Dieu » en français.
- source_word: τὸν υἱὸν
  choice: le Fils
  rationale: Le grec dit « le Fils », sans possessif explicite. Cette formulation conserve la valeur de titre et le style johannique.
- source_word: εἰς τὸν κόσμον
  choice: dans le monde
  rationale: Avec le verbe « envoyer », « dans le monde » rend naturellement le mouvement exprimé par εἰς et conserve la notion d’entrée dans la sphère du monde.
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: pour qu’il juge le monde
  rationale: κρίνω a pour sens fondamental « juger », plus large que « condamner ». La construction « pour que » exprime clairement le but marqué par ἵνα avec le subjonctif.
- source_word: ἀλλ’ ἵνα
  choice: mais pour que
  rationale: Cette formulation conserve le contraste appuyé et le parallélisme entre les deux propositions de but.
- source_word: σωθῇ
  choice: soit sauvé
  rationale: Le passif rend la forme grecque et « sauver » préserve toute l’étendue du sens de σῴζω, qui englobe délivrance et salut.
- source_word: ὁ κόσμος
  choice: le monde
  rationale: La répétition de « le monde » reproduit celle de κόσμος et évite de réduire explicitement son référent à la seule humanité.
- source_word: δι’ αὐτοῦ
  choice: par lui
  rationale: διά avec le génitif indique ici le moyen ou l’agent. « Par lui » est naturel en français et conserve cette médiation.
theological_decisions:
- issue: Sens de κρίνῃ dans son contraste avec σωθῇ
  choice: juge
  alternative: condamne
  rationale: Bien que le contexte puisse donner à κρίνω une portée défavorable, le verbe grec est plus large que « condamner ». « Juger » préserve son sens fondamental et la tension entre la mission salvatrice du Fils et le thème du jugement, sans trancher silencieusement en faveur du sens plus étroit. L’autre possibilité est signalée en note.
translation_notes:
  register: 'Français international moderne, clair et digne. « En effet » assure une liaison naturelle avec le verset précédent. La structure parallèle « pour que… mais pour que… » rend les deux propositions grecques de but. Le subjonctif français n’ajoute aucune incertitude : il est requis après « pour que ».'
