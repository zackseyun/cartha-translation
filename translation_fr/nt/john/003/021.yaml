id: JHN.3.21
reference: John 3:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: fr
  text: 'Mais celui qui pratique la vérité vient à la lumière, afin que ses œuvres soient manifestées : elles ont été accomplies en Dieu.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « fait la vérité » ; on peut aussi traduire « fait ce qui est vrai ».
    reason: lexical_alternative
  - marker: b
    text: 'La dernière proposition peut aussi se comprendre ainsi : « afin que ses œuvres soient manifestées, parce qu’elles ont été accomplies en Dieu ». « En Dieu » peut également évoquer l’action de Dieu, sans que le grec en précise exactement la nuance.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: Mais celui qui pratique la vérité
  rationale: Le participe substantivé décrit une personne caractérisée par son agir, et δέ marque le contraste avec le verset précédent. « Pratiquer la vérité » rend en français naturel l’expression sémitisante « faire la vérité » tout en conservant l’idée d’une vérité mise en acte.
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: vient à la lumière
  rationale: « À la lumière » reflète le mouvement exprimé par πρὸς sans transformer explicitement l’image en entrée dans un espace.
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: afin que ses œuvres soient manifestées
  rationale: « Afin que » conserve la valeur finale de ἵνα, tandis que le passif « soient manifestées » reflète φανερωθῇ. « Œuvres » maintient le vocabulaire johannique sans préciser davantage leur nature.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points laissent naturellement la proposition suivante expliciter ce qui devient manifeste, sans imposer aussi fortement que « parce que » une lecture exclusivement causale. Une note signale l’autre analyse possible.
- source_word: ἐν θεῷ
  choice: en Dieu
  rationale: La formulation conserve l’ouverture du grec entre sphère, relation et possible agentivité divine, sans la réduire à « par Dieu » ou « grâce à Dieu ».
- source_word: ἐστιν εἰργασμένα
  choice: elles ont été accomplies
  rationale: Le passé composé passif rend le parfait périphrastique et sa valeur résultative. « Accomplies » est plus soutenu et plus naturel ici que « travaillées », tout en restant compatible avec le sens large de l’action effectuée.
theological_decisions:
- issue: Sens de ποιεῖν τὴν ἀλήθειαν
  choice: « pratiquer la vérité » dans le texte, avec le littéral en note
  alternative: « faire la vérité » ou « faire ce qui est vrai »
  rationale: Le calque « faire la vérité » est intelligible mais inhabituel et peut évoquer en français le fait d’établir les faits. « Pratiquer la vérité » préserve l’union johannique entre vérité et conduite sans réduire l’expression à la seule exactitude morale.
- issue: Fonction de ὅτι
  choice: Lire principalement la proposition comme explicitant ce qui est manifesté
  alternative: La lire comme la raison pour laquelle les œuvres sont manifestées
  rationale: La syntaxe permet une valeur déclarative ou causale. Les deux-points préservent une certaine souplesse, et la note expose explicitement l’autre lecture.
- issue: Nuance de ἐν θεῷ
  choice: « en Dieu »
  alternative: « par Dieu », « grâce à Dieu » ou « dans l’union avec Dieu »
  rationale: Le grec ne tranche pas nettement entre domaine, relation et moyen ou agent. La traduction formelle évite d’imposer une explication doctrinale particulière.
translation_notes:
  register: Français international moderne, digne et accessible. « Œuvres » et « manifestées » gardent la texture johannique; « pratiquer la vérité » évite un calque français potentiellement trompeur. Tous les appels de notes figurent dans le texte.
