  source_fidelity: 'Le texte rend fidèlement les éléments essentiels : le contraste de δέ (« Mais »), le participe caractérisant (« celui qui pratique »), l’approche de la lumière, la finalité de ἵνα et le passif de φανερωθῇ. « Pratique la vérité » est une expression française naturelle qui transmet bien l’idiome ποιεῖν τὴν ἀλήθειαν, dont le littéral est justement signalé. Les deux-points permettent de présenter ὅτι comme explicatif sans exclure entièrement la lecture causale, indiquée en note. « En Dieu » préserve adéquatement l’ouverture de ἐν θεῷ, et « ont été accomplies » rend de façon recevable le parfait passif périphrastique.'
