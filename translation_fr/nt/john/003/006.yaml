  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: fr
  text: Ce qui est né de la chair est chair[a], et ce qui est né de l’Esprit est esprit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ce qui est né de la chair est de nature humaine. » Le mot grec traduit par « chair » peut, dans certains contextes, désigner la nature humaine déchue ou pécheresse ; ici, le contraste porte surtout sur la naissance qui vient de l’Esprit.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « Ce qui est né de l’Esprit est de nature spirituelle. » Le grec dit littéralement « est esprit », ce qui maintient un contraste qualitatif avec « chair ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: ce qui est né
  rationale: Le participe parfait passif neutre précédé de l’article a ici une portée générique. « Ce qui est né » rend naturellement en français cette affirmation générale tout en conservant l’idée d’une naissance accomplie.
- source_word: ἐκ
  choice: de
  rationale: Dans le contexte de la naissance et de l’origine, « né de » est l’expression française naturelle et indique clairement la source.
- source_word: σάρξ / σαρκὸς
  choice: chair
  rationale: « Chair » préserve le vocabulaire johannique et le contraste avec l’Esprit. Dans ce contexte, le mot renvoie d’abord à la sphère de la naissance humaine naturelle, sans imposer le sens plus étroit de « nature pécheresse ».
- source_word: πνεύματος / πνεῦμά
  choice: Esprit / esprit
  rationale: Le premier emploi désigne l’Esprit comme source de la naissance et prend donc une majuscule. Dans le second, le nom sans article a une valeur qualitative; la minuscule préserve le contraste entre l’Esprit qui fait naître et la réalité spirituelle qui en résulte.
- source_word: ἐστιν
  choice: est
  rationale: Le verbe copule simple conserve la structure concise, parallèle et définitionnelle de l’énoncé grec.
theological_decisions:
- issue: Sens de σάρξ dans la première proposition
  choice: « chair », comprise principalement comme la sphère humaine et naturelle
  alternative: « nature humaine » ou « nature pécheresse »
  rationale: Même si σάρξ peut avoir ailleurs une connotation éthique, le contexte immédiat oppose surtout la naissance naturelle à la naissance venant de l’Esprit. « Chair » maintient cette tension sans réduire le terme à la seule idée de péché.
- issue: Valeur de πνεῦμα dans l’attribut de la seconde proposition
  choice: « esprit » avec une minuscule
  alternative: « Esprit » ou « de nature spirituelle »
  rationale: La forme sans article se prête à une lecture qualitative. « Esprit » risquerait d’identifier directement le résultat de la naissance à l’Esprit Saint, tandis que « de nature spirituelle » expliciterait davantage que le grec. « esprit » conserve la formulation nominale et l’ambiguïté qualitative du texte.
translation_notes:
  register: Français international moderne, sobre et digne. La construction parallèle et aphoristique du grec est conservée. Les majuscules distinguent l’Esprit comme source divine de l’« esprit » qualifiant le résultat de cette naissance.
