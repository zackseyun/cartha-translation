id: JHN.3.11
reference: John 3:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: fr
  text: 'Amen, amen, je te le dis : nous parlons de ce que nous savons et nous témoignons de ce que nous avons vu, et vous ne recevez pas notre témoignage.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « et vous n’acceptez pas notre témoignage ». Le verbe peut signifier « recevoir » ou, dans ce contexte, « accepter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Amen, amen
  rationale: Conserve la formule solennelle redoublée caractéristique de Jésus chez Jean. Le mot « amen » est compris en français biblique courant et évite d'affaiblir la répétition par une tournure moins formulaire.
- source_word: λέγω σοι
  choice: je te le dis
  rationale: Rend naturellement l'adresse personnelle au singulier et la formule d'affirmation solennelle.
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: nous parlons de ce que nous savons
  rationale: Préserve les pluriels explicites et rend le relatif neutre par la tournure française naturelle « ce que ».
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: nous témoignons de ce que nous avons vu
  rationale: Le passé composé rend le parfait grec et sa pertinence présente; « témoigner de » conserve le champ lexical du témoignage.
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: notre témoignage
  rationale: Maintient le lien lexical avec « nous témoignons » ainsi que le pluriel collectif sans en préciser le référent.
- source_word: οὐ λαμβάνετε
  choice: vous ne recevez pas
  rationale: Conserve le sens premier de λαμβάνω et un motif johannique important, tout en laissant possible la nuance « accepter ».
- source_word: καὶ
  choice: mais
  rationale: Le dernier καί coordonne formellement les propositions, mais le français appelle ici une opposition naturelle entre le témoignage donné et son refus; la note signale la traduction plus formelle.
theological_decisions:
- issue: Référent des premières personnes du pluriel (« nous », « notre »)
  choice: Maintenir les pluriels sans identifier le groupe
  alternative: Jésus et ses disciples; pluriel rhétorique; témoins célestes ou divins
  rationale: Le grec emploie explicitement le pluriel, mais son référent demeure débattu. La traduction préserve cette ambiguïté et la tension théologique qui en résulte.
- issue: Passage du singulier σοι au pluriel λαμβάνετε
  choice: « je te le dis » puis « vous ne recevez pas »
  alternative: Uniformiser l'adresse au singulier ou au pluriel
  rationale: Le changement de nombre est présent dans le grec et peut élargir le reproche au-delà de Nicodème; il ne doit pas être effacé.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La formule « Amen, amen » garde la solennité johannique; les pluriels et le changement du singulier au pluriel sont conservés sans interprétation ajoutée.
