id: JHN.3.35
reference: John 3:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: fr
  text: Le Père aime le Fils et a tout remis entre ses mains[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement: « dans sa main ». Cette expression signifie que tout lui a été confié, sous son autorité ou en sa possession.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: Le Père
  rationale: Dans le contexte johannique, il s’agit du titre relationnel désignant Dieu comme Père du Fils; la majuscule signale cet emploi personnel sans ajouter d’explication doctrinale.
- source_word: ἀγαπᾷ
  choice: aime
  rationale: Le présent français exprime naturellement la réalité actuelle et continue indiquée par le présent grec.
- source_word: τὸν υἱόν
  choice: le Fils
  rationale: Le terme désigne ici Jésus dans sa relation particulière au Père; la majuscule marque son emploi comme titre christologique.
- source_word: πάντα
  choice: tout
  rationale: Le pronom neutre pluriel grec a une portée globale. « Tout » est la formulation française la plus naturelle tout en conservant cette ampleur.
- source_word: δέδωκεν
  choice: a remis
  rationale: Le passé composé rend l’acte accompli et son résultat durable. Avec « entre ses mains », « remettre » exprime naturellement le fait de confier sans préciser indûment si l’accent porte sur l’autorité, la possession ou les deux.
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: entre ses mains
  rationale: 'Cette locution française exprime idiomatiquement ce que le grec formule au singulier, littéralement « dans sa main »: ce qui est donné est placé sous la responsabilité, l’autorité ou la possession du Fils.'
theological_decisions:
- issue: La relation entre le Père et le Fils
  choice: Conserver les titres personnels « Père » et « Fils ».
  alternative: Employer les noms communs sans majuscule ou paraphraser leur relation.
  rationale: Le texte présente une relation personnelle précise dans le contexte johannique. Les titres sont maintenus sans développer une formulation doctrinale absente du verset.
- issue: La portée et le résultat durable du don fait au Fils
  choice: Traduire πάντα δέδωκεν par « a tout remis ».
  alternative: « lui donna tout » ou « lui a donné toutes choses »
  rationale: Le passé composé préserve naturellement la valeur résultative du parfait grec, tandis que « tout » maintient la portée globale de πάντα. « Remis entre ses mains » laisse subsister la richesse de l’image, qui peut évoquer possession, responsabilité et autorité.
translation_notes:
  register: Français international moderne, naturel et digne. « A tout remis entre ses mains » est idiomatique et accessible; la note conserve la forme singulière de l’expression grecque et son éventail de sens.
