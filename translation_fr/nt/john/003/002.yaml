reference: John 3:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: fr
  text: 'Cet homme vint le trouver de nuit[a] et lui dit : « Rabbi, nous savons que tu es venu de la part de Dieu comme enseignant. En effet, personne ne peut accomplir ces signes[b] que tu accomplis, à moins que Dieu ne soit avec lui[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pendant la nuit ». Dans l’Évangile selon Jean, la nuit et les ténèbres peuvent aussi avoir une portée symbolique.
    reason: lexical_alternative
  - marker: b
    text: Ou « ces signes miraculeux ». Le grec σημεῖα est rendu par « signes » afin de préserver leur fonction d’actes qui renvoient au-delà d’eux-mêmes.
    reason: lexical_alternative
  - marker: c
    text: 'Le grec maintient ici la troisième personne : « à moins que Dieu ne soit avec lui », dans la déclaration de Nicodème.'
    reason: source_text_feature
lexical_decisions:
- source_word: οὗτος
  choice: Cet homme
  rationale: Le démonstratif renvoie à Nicodème, présenté au verset précédent. « Cet homme » en conserve la valeur tout en restant naturel en français.
- source_word: ἦλθεν πρὸς αὐτὸν
  choice: vint le trouver
  rationale: Cette formulation idiomatique exprime le déplacement vers Jésus sans alourdir la répétition pronominale.
- source_word: νυκτός
  choice: de nuit
  rationale: Le génitif temporel désigne le moment de la venue. « De nuit » garde une tonalité narrative digne et laisse ouverte l’éventuelle résonance symbolique johannique.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: La translittération préserve le titre juif directement employé dans le texte grec et le cadre historique de la scène.
- source_word: οἴδαμεν
  choice: nous savons
  rationale: La première personne du pluriel est conservée sans décider si Nicodème parle officiellement au nom d’un groupe ou emploie un pluriel représentatif.
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: tu es venu de la part de Dieu
  rationale: Le parfait exprime une venue accomplie dont la portée demeure présente. La traduction indique l’origine divine sans introduire le verbe plus fort « envoyer », absent ici.
- source_word: διδάσκαλος
  choice: en tant qu’enseignant
  rationale: Cette formulation rend le rôle exprimé par le nominatif prédicatif tout en s’intégrant naturellement à la proposition française.
- source_word: οὐδεὶς γὰρ δύναται
  choice: En effet, personne ne peut
  rationale: « En effet » marque la justification introduite par γάρ, et « ne peut » rend directement et naturellement δύναται.
- source_word: ταῦτα τὰ σημεῖα
  choice: les signes
  rationale: '« Signes » conserve le vocabulaire caractéristique de Jean : ces actes extraordinaires renvoient au-delà d’eux-mêmes à l’identité et à la mission de Jésus.'
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: accomplir les signes que tu accomplis
  rationale: La répétition du même verbe préserve celle de ποιέω dans le grec, tandis qu’« accomplir » convient mieux que « faire » avec « signes » en français soutenu courant.
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: si Dieu n’est pas avec lui
  rationale: La condition est rendue directement, et la troisième personne de αὐτοῦ est maintenue plutôt que normalisée en « toi ».
theological_decisions:
- issue: Valeur de σημεῖα dans l’Évangile selon Jean
  choice: signes
  alternative: miracles / signes miraculeux
  rationale: « Signes » maintient la fonction théologique de ces actes, qui manifestent quelque chose de l’identité de Jésus, sans nier leur caractère miraculeux.
- issue: Passage de la deuxième à la troisième personne dans les paroles de Nicodème
  choice: si Dieu n’est pas avec lui
  alternative: si Dieu n’est pas avec toi
  rationale: Le grec passe de l’adresse directe à une formulation générale à la troisième personne. Conserver ce changement respecte la texture et l’ambiguïté rhétorique du texte.
- issue: Portée de ἀπὸ θεοῦ ἐλήλυθας
  choice: tu es venu de la part de Dieu
  alternative: tu as été envoyé par Dieu
  rationale: Le texte affirme ici une provenance divine, mais n’emploie pas un verbe signifiant explicitement « envoyer ». La traduction n’ajoute donc pas l’idée formelle de mandat.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient à la narration biblique écrite sans être archaïque. Le discours direct demeure naturel, tandis que « Rabbi », « signes » et le pronom « lui » préservent les traits historiques, johanniques et rhétoriques du grec.
