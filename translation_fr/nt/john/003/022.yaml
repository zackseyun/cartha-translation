id: JHN.3.22
reference: John 3:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: fr
  text: Après cela, Jésus se rendit avec ses disciples dans la région de Judée. Il y séjournait avec eux et baptisait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Jean 4.2 précise que Jésus ne baptisait pas lui-même : ce sont ses disciples qui le faisaient.'
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Transition temporelle naturelle en français, qui rend le pluriel grec de manière idiomatique sans préciser davantage la durée.
- source_word: ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: Jésus se rendit avec ses disciples
  rationale: « Se rendit » exprime naturellement le déplacement vers la destination indiquée; « avec ses disciples » restitue la coordination grecque sans lourdeur.
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: dans la région de Judée
  rationale: γῆ désigne ici le territoire ou la région de Judée, probablement par contraste avec Jérusalem; cette formulation reste précise et naturelle.
- source_word: διέτριβεν μετ’ αὐτῶν
  choice: Il y séjourna avec eux
  rationale: διατρίβω indique qu’il passa ou demeura quelque temps sur place. Le passé simple est naturel dans un récit français, tandis que le sens duratif est porté par « séjourna ».
- source_word: ἐβάπτιζεν
  choice: baptisait
  rationale: L’imparfait rend l’action continue du grec. « Baptiser » conserve le terme religieux reconnu sans imposer un mode particulier de baptême.
theological_decisions:
- issue: Sujet de l’action de baptiser à la lumière de Jean 4.2
  choice: Conserver Jésus comme sujet grammatical de « baptisait » dans le texte principal.
  alternative: Attribuer directement l’action aux disciples ou employer une tournure impersonnelle.
  rationale: Dans ce verset, le verbe grec au singulier a naturellement Jésus pour sujet. Jean 4.2 apporte ensuite la précision que Jésus ne baptisait pas lui-même, mais que ses disciples le faisaient; il ne convient donc pas de réécrire ici la formulation du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation en deux phrases allège la longue coordination grecque. « Région de Judée » évite le tour plus raide « terre de Judée » tout en conservant explicitement γῆ.
