  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: fr
  text: 'Jésus lui répondit : « En vérité, en vérité, je te le dis : si quelqu’un ne naît pas d’en haut,[a] il ne peut pas voir le royaume de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de nouveau ». L’adverbe grec peut avoir les deux sens ; le dialogue du verset suivant repose sur ce double sens.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: Jésus lui répondit
  rationale: En français naturel, « répondit » exprime à lui seul la formule narrative grecque à deux verbes; reproduire « répondit et lui dit » serait lourd et peu idiomatique.
- source_word: Ἀμὴν ἀμὴν λέγω σοι
  choice: Oui, je vous le dis, c’est la vérité
  rationale: Rend de manière claire, digne et emphatique la formule solennelle redoublée propre à Jésus. Le vouvoiement convient au dialogue entre adultes sans imposer une familiarité absente du grec.
- source_word: ἐὰν μή τις
  choice: si quelqu’un ne
  rationale: Construction française idiomatique équivalente à « à moins que quelqu’un » dans cette phrase, tout en conservant la portée générale et non genrée de τις.
- source_word: γεννηθῇ
  choice: naît
  rationale: Rend simplement le passif γεννηθῇ dans son sens de naissance, sans intégrer à ce verbe l’interprétation « de nouveau » portée éventuellement par ἄνωθεν.
- source_word: ἄνωθεν
  choice: d’en haut
  rationale: Le sens « d’en haut » correspond au thème johannique de l’origine céleste, tandis que l’autre sens possible, « de nouveau », est conservé en note afin de préserver le jeu de sens du dialogue.
- source_word: οὐ δύναται ἰδεῖν
  choice: il ne peut pas voir
  rationale: Traduction directe et naturelle qui conserve à « voir » sa possible portée à la fois perceptive et participative.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Expression française établie qui préserve les dimensions de règne et de royaume sans réduire le sens.
theological_decisions:
- issue: Sens de ἄνωθεν dans la parole de Jésus
  choice: d’en haut
  alternative: de nouveau
  rationale: L’adverbe grec possède réellement les deux sens. Le contexte johannique favorise l’origine céleste, mais la réaction de Nicodème au verset suivant repose sur le sens « de nouveau ». La traduction principale et la note maintiennent ensemble cette tension.
- issue: Portée de « voir le royaume de Dieu »
  choice: voir le royaume de Dieu
  alternative: entrer dans le royaume de Dieu / faire l’expérience du royaume de Dieu
  rationale: Le grec dit littéralement « voir ». Une formulation interprétative comme « entrer » ou « faire l’expérience de » anticiperait ou réduirait la portée de l’expression.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe grecque redondante « répondit et dit » est allégée selon l’usage français. Le vouvoiement marque une interaction respectueuse sans archaïsme. La formule « Oui, je vous le dis, c’est la vérité » privilégie la compréhension immédiate tout en gardant la solennité et l’insistance du double amen.
