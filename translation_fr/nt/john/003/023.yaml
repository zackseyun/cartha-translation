  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: fr
  text: Jean aussi baptisait à Énon, près de Salim, parce qu’il y avait là beaucoup d’eau[a]. Les gens venaient et se faisaient baptiser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « parce qu’il y avait là beaucoup d’eaux ».'
    reason: lexical_alternative
  - marker: b
    text: Le verbe traduit par « baptiser » peut aussi être rendu par « immerger ». Le terme consacré « baptiser » est retenu ici sans trancher à lui seul la question de la manière dont le baptême était pratiqué.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: Jean aussi baptisait
  rationale: La construction périphrastique ἦν…βαπτίζων exprime une activité continue dans le passé. « aussi » rend καί, tandis que δέ marque ici une transition légère qu’il n’est pas nécessaire d’expliciter en français.
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: à Énon, près de Salim
  rationale: « à » convient naturellement à la localisation; les noms de lieux sont translittérés selon l’usage français.
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: parce qu’il y avait là beaucoup d’eau
  rationale: ὅτι est causal. Le pluriel grec littéral « beaucoup d’eaux » désigne idiomatiquement une eau abondante; « beaucoup d’eau » est naturel en français tout en restant proche du sens.
- source_word: παρεγίνοντο
  choice: Les gens venaient
  rationale: L’imparfait grec indique des arrivées répétées ou continues. Le sujet implicite est rendu par « les gens » pour produire une phrase française claire.
- source_word: ἐβαπτίζοντο
  choice: se faisaient baptiser
  rationale: Cette tournure conserve la valeur passive et l’aspect répété de l’imparfait dans un français naturel.
theological_decisions:
- issue: Traduction de βαπτίζω
  choice: baptisait / se faisaient baptiser
  alternative: immergeait / se faisaient immerger
  rationale: « Baptiser » est le terme religieux consacré et maintient la continuité lexicale sans trancher à lui seul la question confessionnelle du mode du baptême. L’autre sens possible est signalé en note.
translation_notes:
  register: 'Français international moderne, simple et digne. La traduction privilégie une équivalence optimale : elle conserve l’activité continue et la causalité du grec, tout en rendant idiomatiquement le pluriel « eaux ». Les deux marqueurs de note figurent dans le texte principal.'
