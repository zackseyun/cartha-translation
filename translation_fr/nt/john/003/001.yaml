id: JHN.3.1
reference: John 3:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἦν δὲ ἄνθρωπος ἐκ τῶν Φαρισαίων, Νικόδημος ὄνομα αὐτῷ, ἄρχων τῶν Ἰουδαίων·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: fr
  text: Il y avait parmi les pharisiens un homme nommé Nicodème, un chef des Juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un chef des Judéens »; dans ce contexte, l’expression grecque peut aussi désigner un membre des autorités juives.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: Il y avait
  rationale: Cette tournure introduit naturellement le personnage en français. La faible valeur connective de δέ peut rester implicite sans ajouter un marqueur temporel absent du grec.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Le contexte désigne un individu masculin précis; « un homme » est exact et naturel.
- source_word: ἐκ τῶν Φαρισαίων
  choice: parmi les pharisiens
  rationale: ἐκ marque ici l’appartenance à ce groupe. « Parmi les pharisiens » exprime cette association plus naturellement en français que le calque « des pharisiens ».
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: nommé Nicodème
  rationale: Cette formulation française concise restitue naturellement l’expression grecque de dénomination.
- source_word: ἄρχων
  choice: un chef
  rationale: ἄρχων désigne une personne investie d’autorité. « Chef » conserve ce sens sans préciser une fonction institutionnelle que le verset ne nomme pas.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Dans ce contexte, l’expression renvoie le plus naturellement à l’autorité exercée au sein du peuple juif, tout en gardant la formulation large du grec.
theological_decisions:
- issue: Portée de τῶν Ἰουδαίων dans le contexte johannique
  choice: des Juifs
  alternative: des Judéens; parmi les autorités juives
  rationale: Ἰουδαῖοι peut désigner les Juifs en général, les Judéens ou, selon le contexte, les autorités juives. Le texte présente Nicodème comme pharisien et chef, ce qui rend probable une nuance institutionnelle, mais « des Juifs » préserve l’ampleur et l’ambiguïté de l’expression grecque; la note signale les autres possibilités.
translation_notes:
  register: Français international moderne, sobre et digne. « Pharisiens » prend la minuscule selon l’usage français pour les membres d’un groupe religieux; « Juifs » prend la majuscule lorsqu’il désigne le peuple.
