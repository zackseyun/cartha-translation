  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: fr
  text: En effet, Jean n’avait pas encore été jeté en prison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: C’est-à-dire Jean le Baptiste.
    reason: Renvoi contextuel précisant l’identité de Jean sans ajouter cette désignation au texte principal.
lexical_decisions:
- source_word: οὔπω
  choice: pas encore
  rationale: L’adverbe indique que l’emprisonnement n’avait pas eu lieu au moment du récit; « pas encore » est l’équivalent français naturel et concis.
- source_word: γὰρ
  choice: en effet
  rationale: La conjonction introduit ici une précision explicative. « En effet » rend clairement ce lien en français moderne sans le surinterpréter.
- source_word: ἦν βεβλημένος
  choice: avait été jeté
  rationale: Cette construction périphrastique au plus-que-parfait passif présente une action accomplie antérieurement au point de référence. « Avait été jeté » en conserve le temps, la voix et la vigueur.
- source_word: εἰς τὴν φυλακήν
  choice: en prison
  rationale: Dans ce contexte, φυλακή désigne la prison ou l’emprisonnement. L’expression idiomatique française « jeter en prison » restitue naturellement la destination exprimée par εἰς.
- source_word: ὁ Ἰωάννης
  choice: Jean
  rationale: Le grec donne simplement le nom « Jean ». Le contexte permet de l’identifier, mais le préciser dans le corps du verset ajouterait une information non exprimée ici.
theological_decisions:
- issue: Identification de Ἰωάννης
  choice: Jean
  alternative: Jean le Baptiste
  rationale: Il s’agit bien de Jean le Baptiste dans le contexte, mais le texte grec de ce verset dit seulement « Jean ». La précision est donc placée en note plutôt qu’intégrée au texte.
translation_notes:
  register: Français international moderne, simple et digne. « En effet » marque l’explication; « jeté en prison » reste idiomatique tout en préservant la force du passif grec.
