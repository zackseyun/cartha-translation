source:
  edition: SBLGNT
  text: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ· Πῶς δύναται ταῦτα γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: fr
  text: 'Nicodème lui répondit : « Comment ces choses peuvent-elles se produire[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Comment ces choses peuvent-elles être ? »
    reason: Alternative lexicale possible pour γενέσθαι, qui peut exprimer le fait d’être, d’advenir ou de se produire selon le contexte.
lexical_decisions:
- source_word: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ
  choice: Nicodème lui répondit
  rationale: Le français naturel exprime la formule narrative grecque « répondit et lui dit » par le seul verbe « répondit », sans perte de fonction discursive. Le pronom « lui » conserve le référent implicite du grec sans ajouter le nom de Jésus.
- source_word: Πῶς
  choice: Comment
  rationale: L’adverbe interrogatif porte sur la manière ou la possibilité.
- source_word: δύναται
  choice: peuvent-elles
  rationale: Le verbe « pouvoir » rend naturellement la capacité ou la possibilité exprimée par δύναμαι et s’accorde avec le pluriel « ces choses ».
- source_word: ταῦτα
  choice: ces choses
  rationale: Cette formulation préserve le pluriel neutre du démonstratif et son renvoi aux réalités évoquées juste avant.
- source_word: γενέσθαι
  choice: se produire
  rationale: « Se produire » rend ici le sens événementiel de γίνομαι dans un français actuel et digne, tout en évitant de réduire la question à une simple existence statique.
theological_decisions:
- issue: Portée de la question de Nicodème sur les réalités décrites par Jésus
  choice: Comment ces choses peuvent-elles se produire ?
  alternative: Comment ces choses peuvent-elles être ? / Comment ces choses peuvent-elles arriver ?
  rationale: « Se produire » conserve l’idée d’avènement ou de réalisation sans expliquer comment ces réalités deviennent possibles ni résoudre la tension théologique du dialogue.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure redondante grecque « répondit et dit » est idiomatiquement condensée, tandis que le pluriel et l’ambiguïté relative de γίνομαι sont préservés dans le texte et la note.
