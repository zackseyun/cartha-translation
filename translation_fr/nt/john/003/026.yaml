id: JHN.3.26
reference: John 3:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: fr
  text: 'Ils vinrent auprès de Jean et lui dirent : « Rabbi, celui qui était avec toi de l’autre côté du Jourdain, à qui tu as rendu témoignage[a], regarde : celui-là baptise, et tous viennent à lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « au sujet duquel tu as témoigné ». La construction grecque au datif peut se rendre de l’une ou l’autre manière.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: Ils vinrent auprès de Jean
  rationale: Le verbe ἔρχομαι peut se traduire par « venir » ou « aller » selon le point de vue. « Vinrent auprès de Jean » exprime naturellement leur approche dans le récit.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: La translittération, courante en français biblique et moderne, conserve le titre juif et le cadre historique.
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: celui qui était avec toi de l’autre côté du Jourdain
  rationale: Cette formulation idiomatique conserve la relation exprimée par μετὰ σοῦ et rend clairement l’indication géographique πέραν τοῦ Ἰορδάνου.
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: à qui tu as rendu témoignage
  rationale: « Rendre témoignage » maintient le motif johannique du témoignage. Le passé composé traduit naturellement en français la valeur résultative du parfait grec, tandis qu’une note signale l’autre compréhension possible du datif.
- source_word: ἴδε
  choice: regarde
  rationale: L’impératif attire vivement l’attention sans recourir à l’archaïsme « voici » ou « vois » dans cet emploi interjectif.
- source_word: οὗτος
  choice: celui-là
  rationale: Le démonstratif français conserve l’insistance déictique, voire la nuance de contrariété des interlocuteurs, mieux que le simple pronom « il ».
- source_word: βαπτίζει
  choice: baptise
  rationale: Le présent français convient à l’activité en cours signalée par les interlocuteurs.
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: tous vont à lui
  rationale: « Tous » garde la généralisation rhétorique de πάντες, et « vont à lui » rend naturellement le mouvement vers Jésus du point de vue des personnes qui parlent.
theological_decisions:
- issue: Le vocabulaire johannique du témoignage
  choice: rendu témoignage
  alternative: témoigné
  rationale: « Rendre témoignage » fait ressortir le motif récurrent de μαρτυρέω dans Jean sans ajouter d’interprétation doctrinale.
- issue: Le référent du datif ᾧ avec μαρτυρέω
  choice: à qui tu as rendu témoignage
  alternative: au sujet duquel tu as témoigné
  rationale: La construction grecque permet de comprendre le témoignage comme adressé à la personne ou comme portant sur elle. Le texte retient la forme la plus proche, et la note préserve l’autre lecture légitime.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation met en relief l’interjection « regarde », tandis que « celui-là » conserve l’insistance du démonstratif grec.
