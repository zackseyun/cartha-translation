id: JHN.3.5
reference: John 3:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: fr
  text: 'Jésus répondit : « En vérité, en vérité, je te le dis : si quelqu’un ne naît pas d’eau et d’Esprit[a], il ne peut pas entrer dans le royaume de Dieu. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’eau et d’esprit ». Le grec ancien ne distingue pas les majuscules des minuscules dans ce cas; le contexte favorise toutefois une référence à l’Esprit. L’expression « d’eau et d’Esprit » a reçu diverses interprétations, notamment la purification et le renouvellement, la naissance physique et la naissance spirituelle, ou le baptême. La traduction conserve la formulation grecque sans trancher cette question dans le texte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Équivalent narratif courant et naturel de ἀποκρίνομαι dans un dialogue.
- source_word: Ἀμὴν ἀμὴν
  choice: Oui, je vous le dis en vérité
  rationale: Rend la formule solennelle et emphatique propre à Jésus dans un français moderne et digne; l’insistance du redoublement est portée par « Oui » et « en vérité ».
- source_word: λέγω σοι
  choice: je vous le dis
  rationale: Préserve l’adresse directe au singulier tout en employant le vouvoiement français adapté au registre.
- source_word: ἐὰν μή τις
  choice: si quelqu’un ne
  rationale: Construction française idiomatique qui conserve la portée générique et non sexuée.
- source_word: γεννηθῇ
  choice: naît
  rationale: Conserve le sens de « venir à la naissance » sans importer ici « de nouveau » ou « d’en haut », puisque ἄνωθεν est absent de ce verset.
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: d’eau et d’Esprit
  rationale: Suit de près la construction grecque tout en restant naturelle en français et sans trancher dans le texte principal entre les diverses interprétations de l’eau.
- source_word: οὐ δύναται εἰσελθεῖν
  choice: il ne peut pas entrer
  rationale: Expression française directe qui conserve explicitement l’idée d’incapacité portée par δύναται.
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: le royaume de Dieu
  rationale: Formulation consacrée, exacte et intelligible, qui ne réduit pas βασιλεία au seul territoire ni au seul exercice du règne.
theological_decisions:
- issue: Référent de πνεύματος
  choice: Esprit, probablement l’Esprit Saint
  alternative: esprit, compris de manière non précisée ou comme principe spirituel
  rationale: Le contexte johannique favorise une référence à l’Esprit de Dieu, signalée par la majuscule; l’absence d’article en grec et l’ambiguïté graphique des manuscrits anciens justifient toutefois de signaler l’autre lecture.
- issue: Sens de « d’eau et d’Esprit »
  choice: Conserver la formulation grecque sans explicitation interprétative dans le texte
  alternative: L’image de purification et de renouvellement; la naissance physique suivie de la naissance spirituelle; une référence particulière au baptême
  rationale: La syntaxe ne permet pas à elle seule d’imposer une interprétation confessionnelle précise. La traduction préserve donc l’image et la tension exégétique.
translation_notes:
  register: Français international moderne, naturel et digne. Le vouvoiement marque l’adresse singulière à Nicodème sans archaïsme. La formule « Oui, je vous le dis en vérité » restitue l’emphase de Ἀμὴν ἀμὴν sans translittération opaque. Le pronom « il » reprend grammaticalement l’indéfini « quelqu’un » et n’introduit aucune restriction masculine.
