id: JHN.3.30
reference: John 3:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκεῖνον δεῖ αὐξάνειν, ἐμὲ δὲ ἐλαττοῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: fr
  text: Il faut qu’il grandisse[a], mais que moi, je diminue.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Celui-là doit grandir, mais moi diminuer. »'
    reason: Cette formulation rend explicitement le démonstratif ἐκεῖνον et conserve la construction grecque où une seule expression de nécessité régit les deux infinitifs.
lexical_decisions:
- source_word: ἐκεῖνον
  choice: il
  rationale: Le démonstratif accusatif est le sujet logique de l’infinitif et renvoie à Jésus dans le contexte. Le pronom « il » est naturel en français; la forme plus explicite « celui-là » est signalée dans la note.
- source_word: δεῖ
  choice: il faut… je dois
  rationale: δεῖ exprime une nécessité sans en préciser explicitement la nature. La formulation française répartit naturellement cette nécessité entre les deux propositions tout en la maintenant pour chacune.
- source_word: αὐξάνειν
  choice: grandisse
  rationale: « Grandir » conserve l’image large et dynamique du grec, qui peut évoquer ici une importance ou une influence croissante sans réduire le sens à une augmentation numérique.
- source_word: ἐμὲ
  choice: moi, je
  rationale: La tournure emphatique « moi, je » rend le contraste marqué entre ἐκεῖνον et ἐμὲ tout en restant idiomatique en français moderne.
- source_word: δὲ … δὲ
  choice: tandis que
  rationale: « Tandis que » exprime clairement l’opposition parallèle entre la progression de Jésus et l’effacement de Jean, sans donner à la seconde proposition une valeur de contradiction.
- source_word: ἐλαττοῦσθαι
  choice: diminuer
  rationale: « Diminuer » préserve le parallélisme concis avec « grandir » et le sens de devenir moins important, sans préciser davantage le domaine concerné.
theological_decisions:
- issue: Nature de la nécessité exprimée par δεῖ
  choice: Conserver une nécessité forte sans en définir explicitement la source ni le mécanisme.
  alternative: Préciser qu’il s’agit soit d’une simple nécessité pratique, soit d’un décret divin explicite.
  rationale: Dans ce contexte, δεῖ peut suggérer l’ordre nécessaire du dessein de Dieu, mais le verset n’en donne pas lui-même une explication doctrinale. « Il faut » et « je dois » maintiennent cette portée et cette tension.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase conserve le caractère mémorable et antithétique de l’original, avec une syntaxe naturelle et une note pour la formulation plus littérale.
