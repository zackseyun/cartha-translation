  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: fr
  text: 'Vous-mêmes, vous m’êtes témoins que j’ai dit : « Ce n’est pas moi qui suis le Messie[a], mais j’ai été envoyé devant lui[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : le Christ.'
    reason: alternative_reading
  - marker: b
    text: 'Ou : avant lui.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: Vous-mêmes, vous
  rationale: Le double pronom est emphatique. La dislocation française conserve naturellement l’insistance sur les auditeurs eux-mêmes.
- source_word: μοι μαρτυρεῖτε
  choice: vous témoignez en ma faveur
  rationale: Le datif μοι désigne ici la personne en faveur de qui le témoignage est rendu. Cette formulation garde la nuance testimoniale caractéristique de Jean tout en restant naturelle en français moderne.
- source_word: εἶπον
  choice: j’ai dit
  rationale: Le passé composé renvoie naturellement, en français, à la déclaration antérieure de Jean.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme le titre de la figure attendue; « le Messie » en exprime directement le sens.
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: j’ai été envoyé
  rationale: Cette tournure rend l’envoi accompli dont la mission demeure pertinente, sans préciser au-delà du grec l’identité de celui qui envoie.
- source_word: ἔμπροσθεν ἐκείνου
  choice: devant lui
  rationale: « Devant lui » conserve l’image d’un envoyé qui précède la personne annoncée, tout en laissant subsister la possible nuance spatiale ou temporelle.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Jean nie être la figure ointe attendue. Le titre « Messie » rend cette fonction clairement, tandis que « Christ » demeure une traduction traditionnelle possible.
- issue: Portée de la mission exprimée par Ἀπεσταλμένος εἰμὶ
  choice: j’ai été envoyé devant lui
  alternative: je suis envoyé devant lui; j’ai été envoyé avant lui
  rationale: Le choix principal présente l’envoi comme accompli et toujours pertinent, tout en maintenant le rôle préparatoire et subordonné de Jean sans développer une doctrine absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La reprise « Vous-mêmes, vous » porte l’emphase grecque sans lourdeur excessive; « témoignez en ma faveur » maintient la nuance judiciaire et testimoniale du vocabulaire johannique.
