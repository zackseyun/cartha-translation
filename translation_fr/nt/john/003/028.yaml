    issue: « Vous témoignez en ma faveur »
    rationale: Cette expression suggère que les interlocuteurs défendent Jean ou témoignent en son soutien. Dans μοι μαρτυρεῖτε, le datif désigne Jean comme celui à qui ils rendent témoignage; le contenu qui suit est sa déclaration antérieure. « Vous m’êtes témoins » évite cet ajout de sens.
  revised_text: 'Vous-mêmes, vous m’êtes témoins que j’ai dit : « Ce n’est pas moi qui suis le Messie[a], mais j’ai été envoyé devant lui[b]. »'
