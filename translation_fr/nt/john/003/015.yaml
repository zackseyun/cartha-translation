  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: fr
  text: afin que toute personne qui croit en lui ait la vie éternelle[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quiconque croit en lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit ici le but ou le résultat en lien avec l’énoncé précédent; « afin que » en garde clairement la valeur dans un français naturel et digne.
- source_word: πᾶς ὁ πιστεύων
  choice: toute personne qui croit
  rationale: Le participe présent substantivé a une portée générique et inclusive. Cette formulation française naturelle conserve à la fois l’idée de totalité et la valeur générique du singulier.
- source_word: πιστεύων
  choice: qui croit
  rationale: « Croire » est le rendu courant et transparent de πιστεύω dans Jean; le présent français convient à la valeur générale du participe présent.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Le texte grec porte ἐν, non εἰς. « En lui » traduit directement cette préposition sans importer la construction johannique plus fréquente avec εἰς.
- source_word: ἔχῃ
  choice: ait
  rationale: Le subjonctif présent français après « afin que » correspond naturellement au subjonctif grec régi par ἵνα, sans ajouter une idée d’incertitude.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Expression consacrée, exacte et immédiatement compréhensible, qui convient au sens johannique de la vie eschatologique et sans fin.
theological_decisions:
- issue: Expression johannique de la foi avec ἐν αὐτῷ
  choice: en lui
  alternative: en lui / vers lui au sens de « croire en » à partir d’une lecture ou d’une formulation avec εἰς
  rationale: La traduction suit la préposition attestée ἐν et ne la remplace pas par la construction plus courante εἰς. Elle préserve ainsi la donnée textuelle sans tirer de distinction doctrinale artificielle.
- issue: Portée de πᾶς ὁ πιστεύων
  choice: toute personne qui croit
  alternative: quiconque croit
  rationale: Les deux formulations expriment la portée générique et inclusive. Le choix principal rend explicitement πᾶς tout en restant idiomatique en français moderne.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe demeure liée au verset précédent par « afin que ». « Toute personne » évite une formulation genrée sans rien retrancher à la portée générique du grec.
