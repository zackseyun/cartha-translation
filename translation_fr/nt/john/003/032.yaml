id: JHN.3.32
reference: John 3:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: fr
  text: Ce qu’il a vu et entendu, il en témoigne, et personne ne reçoit son témoignage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Personne ne reçoit son témoignage » est une généralisation frappante ; le verset suivant parle de celui qui le reçoit.
    reason: cross_reference
lexical_decisions:
- source_word: ὃ
  choice: Ce qu’
  rationale: Le pronom relatif neutre désigne le contenu de ce qui a été vu et entendu; « ce que » est naturel en français et conserve cette valeur.
- source_word: ἑώρακεν
  choice: il a vu
  rationale: Le passé composé rend naturellement en français le parfait grec et sa pertinence présente.
- source_word: ἤκουσεν
  choice: entendu
  rationale: Coordonné à « a vu », le participe passé dépend du même auxiliaire en français idiomatique. La différence aspectuelle entre le parfait et l’aoriste grecs ne peut être reproduite sans lourdeur.
- source_word: τοῦτο
  choice: c’est ce dont
  rationale: Cette reprise démonstrative restitue la structure insistante « cela, il en témoigne » dans une formulation française naturelle.
- source_word: μαρτυρεῖ
  choice: il témoigne
  rationale: Ce verbe clair et actuel conserve la nuance de témoignage, importante dans Jean, ainsi que le lien lexical avec μαρτυρίαν.
- source_word: μαρτυρίαν
  choice: témoignage
  rationale: « Témoignage » garde la cohérence avec « témoigne » et la nuance judiciaire du vocabulaire grec.
- source_word: οὐδεὶς
  choice: personne ne
  rationale: Rend directement la négation universelle sans l’atténuer.
- source_word: λαμβάνει
  choice: reçoit
  rationale: « Reçoit » est plus proche du grec et du vocabulaire johannique que l’interprétation « accepte ».
theological_decisions:
- issue: Portée de la négation universelle « personne ne reçoit son témoignage »
  choice: Conserver sans l’atténuer la formulation générale « personne ne reçoit »
  alternative: Très peu de gens reçoivent son témoignage
  rationale: Le grec formule une négation universelle frappante. Le verset suivant évoque pourtant celui qui reçoit ce témoignage; la traduction préserve cette tension rhétorique au lieu de la résoudre.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure clivée « c’est ce dont il témoigne » conserve l’insistance de la reprise grecque sans produire un calque maladroit. Le connecteur « mais » exprime naturellement l’opposition portée par καί dans le contexte.
