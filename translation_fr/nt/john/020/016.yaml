id: JHN.20.16
reference: John 20:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: fr
  text: 'Jésus lui dit : « Marie ! » Elle se retourne et lui dit en hébreu[a] : « Rabbouni ! » (ce qui signifie « Maître »).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en araméen ». Chez Jean, l’expression « en hébreu » peut désigner plus largement la langue sémitique parlée en Judée.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent de narration grec est rendu par le présent français, naturel dans ce récit vivant.
- source_word: αὐτῇ
  choice: lui
  rationale: Le pronom datif français exprime naturellement « à elle ».
- source_word: Μαριάμ
  choice: Marie
  rationale: Forme française traditionnelle et courante du nom, immédiatement intelligible.
- source_word: στραφεῖσα
  choice: Elle se retourne
  rationale: La proposition verbale restitue naturellement le participe aoriste et la succession des gestes en français moderne.
- source_word: ἐκείνη
  choice: elle
  rationale: Le démonstratif grec sert ici à reprendre le sujet; le pronom personnel est idiomatique en français.
- source_word: Ἑβραϊστί
  choice: en hébreu
  rationale: La traduction suit le terme grec, tout en signalant en note qu’il peut désigner plus largement la langue sémitique locale, vraisemblablement l’araméen.
- source_word: Ραββουνι
  choice: Rabbouni
  rationale: La translittération est conservée puisque l’évangéliste en donne immédiatement le sens; elle maintient aussi la force culturelle et affective de l’adresse.
- source_word: ὃ λέγεται Διδάσκαλε
  choice: ce qui signifie « Maître »
  rationale: Cette formulation introduit naturellement la glose. « Maître » est en français l’appellation habituelle d’un disciple envers celui qui enseigne, sans imposer ici le sens de propriétaire ou de souverain.
theological_decisions:
- issue: Sens de Ἑβραϊστί dans le récit johannique
  choice: en hébreu
  alternative: en araméen
  rationale: Le texte principal respecte la désignation grecque. Comme le mot peut, dans cet usage, désigner plus largement la langue sémitique de Judée, l’autre compréhension est conservée en note plutôt que tranchée silencieusement.
- issue: Traduction de Διδάσκαλε
  choice: Maître
  alternative: Enseignant
  rationale: « Maître » est l’adresse française naturelle faite à un enseignant et correspond au rôle de Jésus dans la relation disciple-maître, sans ajouter un titre doctrinal absent de la glose.
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif est conservé; la syntaxe reste fluide. « Rabbouni » demeure translittéré et reçoit la glose explicative du texte source.
