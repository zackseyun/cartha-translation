id: JHN.20.13
reference: John 20:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: fr
  text: 'Ils lui disent : « Madame[a], pourquoi pleurez-vous ? » Elle leur dit : « On a enlevé mon Seigneur[b], et je ne sais pas où on l’a mis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « Femme ». En grec, cette apostrophe est respectueuse et n’a pas la rudesse que « Femme » peut avoir en français moderne.
    reason: clarification_culturelle
  - marker: b
    text: Ou « mon maître ». Le grec kyrios peut être un titre respectueux ; « Seigneur » en préserve aussi la possible portée christologique.
    reason: alternative_de_traduction
lexical_decisions:
- source_word: ἐκεῖνοι
  choice: Ils
  rationale: Le pronom reprend naturellement les deux anges mentionnés dans le contexte; rendre le démonstratif par « ceux-ci » alourdirait inutilement la phrase.
- source_word: Γύναι
  choice: Femme
  rationale: Le vocatif est direct mais respectueux en grec. « Femme » conserve la formulation johannique sans ajouter l’affection de « chère femme » ni la coloration sociale moderne de « Madame ».
- source_word: τί κλαίεις
  choice: pourquoi pleures-tu ?
  rationale: Même si τί signifie formellement « quoi », cette tournure interrogative demande la cause des pleurs. « Pourquoi pleures-tu ? » est l’équivalent idiomatique naturel en français.
- source_word: λέγουσιν / λέγει
  choice: disent / répond
  rationale: Le présent narratif grec est conservé. Dans la seconde proposition, « répond » exprime naturellement la prise de parole suscitée par la question sans modifier son contenu.
- source_word: Ἦραν
  choice: On a enlevé
  rationale: Le sujet pluriel n’est pas identifié par Marie. Le pronom français « on » préserve cette indétermination, tandis que le passé composé présente l’enlèvement comme accompli et toujours pertinent.
- source_word: τὸν κύριόν μου
  choice: mon Seigneur
  rationale: « Seigneur » conserve à la fois la révérence personnelle de Marie et la portée christologique possible de κύριος.
- source_word: οὐκ οἶδα
  choice: je ne sais pas
  rationale: Le parfait οἶδα a ici un sens présent d’état et se rend naturellement par le présent français.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: où on l’a mis
  rationale: « Mis » est le terme français courant correspondant à τίθημι dans ce contexte. « On » maintient l’identité indéterminée des personnes supposées avoir déplacé Jésus.
theological_decisions:
- issue: Portée de κύριος dans la parole de Marie
  choice: mon Seigneur
  alternative: mon maître
  rationale: « Seigneur » ne réduit pas κύριος à un simple titre social et laisse subsister ensemble la déférence de Marie et la résonance christologique du terme dans l’Évangile selon Jean.
- issue: Tonalité du vocatif Γύναι
  choice: Femme
  alternative: Madame
  rationale: Le grec est respectueux, sans être sentimental. La traduction conserve sa forme directe; une note prévient la lecture péjorative que le mot isolé pourrait recevoir en français contemporain.
- issue: Identité des auteurs du déplacement supposé
  choice: On a enlevé… on l’a mis
  alternative: Ils ont enlevé… ils l’ont mis
  rationale: Les formes grecques sont à la troisième personne du pluriel sans sujet exprimé. Le français « on » garde les responsables indéterminés et évite de faire des anges les antécédents grammaticaux apparents de « ils ».
translation_notes:
  register: Français international actuel, sobre et digne. Le présent narratif maintient la vivacité du grec. Le tutoiement correspond à l’adresse au singulier et reste naturel dans ce cadre ancien. Les contractions usuelles (« l’a ») assurent une lecture fluide sans rendre le registre familier.
