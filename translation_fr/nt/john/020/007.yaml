    issue: « à un endroit précis »
    rationale: Cette formulation introduit l’idée que l’emplacement était précis ou spécialement identifié. Le grec εἰς ἕνα τόπον décrit un emplacement unique/distinct, sans cette nuance supplémentaire.
  - severity: low
    issue: « Il n’était pas posé avec »
    rationale: Bien que possible, « posé » peut suggérer plus nettement une action de déposer. κείμενον décrit avant tout la position ou la présence du linge ; « ne se trouvait pas avec » est plus souple et idiomatique.
