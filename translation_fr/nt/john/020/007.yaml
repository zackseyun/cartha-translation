source:
  edition: SBLGNT
  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: fr
  text: ainsi que le linge qui avait été sur sa tête. Il ne se trouvait pas avec les bandes de lin, mais était roulé[a] à part, dans un endroit à part.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « plié » ou « enveloppé ».
    reason: Le sens de ἐντετυλιγμένον permet plusieurs représentations proches de l’état du linge; le texte ne permet pas d’établir avec certitude s’il était enroulé, plié ou enveloppé.
lexical_decisions:
- source_word: σουδάριον
  choice: linge
  rationale: Dans ce contexte funéraire, « linge » désigne naturellement la pièce de tissu associée à la tête de Jésus; la proposition relative en précise l’usage sans imposer « visage » au grec.
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: sur sa tête
  rationale: Rendu direct qui préserve la formulation grecque sans préciser davantage la manière dont le linge était disposé.
- source_word: ὀθονίων
  choice: bandes de lin
  rationale: Le pluriel désigne les pièces de toile funéraire; « bandes de lin » est clair en français courant et convient au contexte du tombeau.
- source_word: κείμενον
  choice: posé
  rationale: Le participe décrit le linge se trouvant étendu ou placé là; « posé » convient mieux à un objet inanimé que le calque « couché ».
- source_word: χωρὶς
  choice: à part
  rationale: Cette expression marque clairement la séparation spatiale d’avec les bandes de lin.
- source_word: ἐντετυλιγμένον
  choice: enroulé
  rationale: Le participe parfait passif décrit le linge dans un état résultant d’un enroulement ou enveloppement. « Enroulé » reste naturel et évite de présenter comme certaine l’idée plus précise d’un linge soigneusement plié.
- source_word: εἰς ἕνα τόπον
  choice: à un endroit précis
  rationale: Cette formulation exprime un emplacement distinct et déterminé, sans introduire l’idée interprétative de « sa place ».
- source_word: καὶ
  choice: ainsi que
  rationale: Dans ce fragment coordonné à la phrase précédente, « ainsi que » assure une continuité naturelle en français.
theological_decisions:
- issue: La disposition du linge implique-t-elle une affirmation théologique au-delà de la description narrative?
  choice: Présenter simplement le linge comme séparé des bandes de lin et enroulé à un endroit précis.
  alternative: Faire de sa disposition ordonnée un symbole ou une preuve d’une reconstruction particulière de la résurrection.
  rationale: Le grec décrit l’emplacement et l’état du linge, mais n’en explicite aucune portée symbolique ou apologétique.
translation_notes:
  register: Français moderne, sobre et narratif. Le début « ainsi que » tient compte du fait que le verset poursuit la construction du verset précédent. Le vocabulaire demeure concret tout en évitant de surinterpréter la disposition des linges.
