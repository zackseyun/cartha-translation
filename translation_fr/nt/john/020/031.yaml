reference: John 20:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: fr
  text: Mais ces choses ont été écrites pour que vous croyiez[a] que Jésus est le Messie[b], le Fils de Dieu, et pour qu’en croyant vous ayez la vie en son nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits ont une forme verbale pouvant plus naturellement signifier « pour que vous en veniez à croire » (aoriste), tandis que d’autres soutiennent la forme présente, qui peut suggérer « pour que vous continuiez à croire ». Le texte principal traduit de manière générale : « pour que vous croyiez ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « le Christ ». Le titre grec Χριστός est rendu ici par « Messie » afin d’en faire ressortir le sens de titre.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif pluriel renvoie à ce qui vient d’être rapporté, notamment aux signes de Jésus. « Ces choses » respecte le pluriel grec sans limiter explicitement la référence aux seuls signes.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici un léger contraste avec les nombreux autres signes non consignés mentionnés au verset précédent.
- source_word: γέγραπται
  choice: ont été écrites
  rationale: Le parfait passif présente l’action d’écrire comme accomplie avec un résultat qui demeure. Cette formulation française en conserve naturellement la valeur.
- source_word: ἵνα πιστεύητε
  choice: pour que vous croyiez
  rationale: La tournure exprime clairement le but. « Croyiez » reste assez large pour ne pas trancher entre l’entrée dans la foi et sa continuation.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne comme un titre. « Messie » en rend le sens et maintient son cadre biblique et juif, plutôt que de le traiter comme un nom propre.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Cette traduction directe conserve sans l’atténuer le titre christologique du texte grec.
- source_word: πιστεύοντες
  choice: en croyant
  rationale: Le participe exprime le moyen ou la circonstance liée au fait d’avoir la vie. « En croyant » préserve ce lien sans l’expliciter davantage.
- source_word: ζωὴν
  choice: la vie
  rationale: Le grec dit simplement « vie », sans adjectif. L’article français est idiomatique et le contexte johannique porte la profondeur théologique du terme sans ajout de « éternelle ».
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: en son nom
  rationale: Cette expression concise conserve la formulation grecque et son sens théologique ouvert, sans la réduire à « par son autorité » ou à une autre paraphrase.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le mot désigne ici le roi oint attendu et fonctionne comme un titre. « Messie » en communique le sens, tandis que « Christ » demeure indiqué en note comme autre rendu traditionnel.
- issue: Variante textuelle et aspect de πιστεύητε
  choice: pour que vous croyiez
  alternative: pour que vous continuiez à croire / pour que vous en veniez à croire
  rationale: Le texte imprimé du SBLGNT porte le subjonctif présent πιστεύητε, susceptible d’une nuance continue, tandis qu’une variante bien attestée porte l’aoriste πιστεύσητε, qui peut plus naturellement évoquer l’entrée dans la foi. Le texte principal garde une formulation française non restrictive et la note signale la tension.
translation_notes:
  register: Français international moderne, clair et digne. La structure des deux propositions de but est conservée. « Ces choses » maintient la référence plurielle et relativement ouverte de ταῦτα; « en son nom » préserve la densité de l’expression johannique sans paraphrase doctrinale.
