id: JHN.20.26
reference: John 20:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: fr
  text: 'Huit jours plus tard, ses disciples se trouvaient de nouveau à l’intérieur, et Thomas était avec eux. Jésus arrive, alors que les portes sont fermées, se place au milieu d’eux et dit : « La paix soit avec vous ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: Huit jours plus tard
  rationale: Rend naturellement l’expression temporelle grecque sans ajouter une précision calendaire absente du texte.
- source_word: ἔσω
  choice: à l’intérieur
  rationale: Conserve l’indétermination du lieu plutôt que d’ajouter « dans la maison » ou « dans la pièce ».
- source_word: ἔρχεται
  choice: vient
  rationale: Préserve le présent historique, expressément maintenu dans la couche anglaise auditée.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: alors que les portes sont verrouillées
  rationale: Le participe parfait présente les portes dans un état de fermeture; « verrouillées » exprime clairement cet état dans le contexte, sans préciser comment Jésus entre.
- source_word: Εἰρήνη ὑμῖν
  choice: Que la paix soit avec vous !
  rationale: Formule française actuelle et digne qui restitue la salutation et sa portée de bénédiction.
theological_decisions:
- issue: Mode d’entrée de Jésus malgré les portes verrouillées
  choice: Ne pas expliquer comment Jésus entre
  alternative: Préciser qu’il traverse miraculeusement les portes ou qu’elles s’ouvrent
  rationale: Le texte affirme sa venue alors que les portes sont verrouillées, mais ne décrit aucun mécanisme.
- issue: Variation des temps verbaux dans la narration grecque
  choice: Employer le présent historique de manière suivie en français
  alternative: Reproduire littéralement « Jésus vient… se tint… dit »
  rationale: Le grec passe du présent ἔρχεται aux aoristes ἔστη et εἶπεν. Une reproduction mécanique serait peu naturelle en français et risquerait de donner à cette variation une portée théologique qu’elle n’énonce pas; le présent narratif conserve la vivacité du passage.
translation_notes:
  register: Français international moderne, clair et digne. La formulation évite d’identifier le lieu et de décrire le mode d’entrée. Le discours direct emploie une salutation naturelle plutôt que le calque plus raide « Paix à vous ».
