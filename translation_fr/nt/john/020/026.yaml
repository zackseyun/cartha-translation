  source_fidelity: 'La structure et les éléments essentiels sont bien rendus : le délai de huit jours, les disciples à l’intérieur, la présence de Thomas, le présent historique de ἔρχεται, les portes déjà fermées, la position de Jésus au milieu et la salutation. Toutefois, « verrouillées » est plus spécifique que κεκλεισμένων (« fermées ») et ne doit pas être imposé par le seul contexte.'
