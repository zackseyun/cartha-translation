  source_fidelity: 'Le sens global est fidèle : présents narratifs, pluriel de « nous ne savons pas », titre « Seigneur », agent non identifié et extraction hors du tombeau sont bien rendus. Toutefois, « celui pour qui Jésus avait de l’affection » est une tournure moins directe et moins naturelle que le relatif grec ὃν ἐφίλει ; elle risque aussi de déplacer l’accent vers une affection unilatérale formulée de manière pesante.'
