language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: fr
  text: 'Elle court donc trouver Simon Pierre et l’autre disciple, celui que Jésus aimait[a], et elle leur dit : « On a enlevé le Seigneur du tombeau, et nous ne savons pas où on l’a déposé[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie ici le verbe φιλέω, souvent traduit par « aimer ». On pourrait aussi rendre : « celui pour qui Jésus avait de l’affection ».'
    reason: lexical_alternative
  - marker: b
    text: Le texte grec dit bien « nous ne savons pas ». Il ne précise pas ici quelles autres personnes Marie inclut dans ce pluriel.
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: Elle court donc trouver
  rationale: Le présent de narration conserve la vivacité du grec. « Court trouver » exprime naturellement en français le mouvement vers les deux disciples, sans reproduire lourdement « court et vient vers ».
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: Simon Pierre et l’autre disciple
  rationale: « Disciple » est le terme courant dans le contexte des Évangiles; la répétition grecque de πρός n’a pas besoin d’être reproduite en français.
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: celui pour qui Jésus avait de l’affection
  rationale: Cette formulation rend le sens affectif de φιλέω et la valeur durative de l’imparfait ἐφίλει, tout en restant naturelle et digne.
- source_word: λέγει αὐτοῖς
  choice: elle leur dit
  rationale: Le présent historique grec est rendu par le présent français, qui maintient l’immédiateté du récit.
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: On a enlevé le Seigneur du tombeau
  rationale: Le pronom « on » rend l’agent indéfini implicite dans la troisième personne du pluriel grec. Le passé composé exprime une action accomplie dont le résultat demeure présent.
- source_word: οὐκ οἴδαμεν
  choice: nous ne savons pas
  rationale: La première personne du pluriel du grec est conservée, sans la remplacer par un singulier ni expliquer qui elle inclut.
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: où on l’a déposé
  rationale: « Déposé » rend τίθημι avec naturel et respect dans ce contexte funéraire; le passé composé souligne que son emplacement actuel demeure inconnu.
theological_decisions:
- issue: Sens de κύριος appliqué à Jésus
  choice: le Seigneur
  alternative: le maître
  rationale: « Seigneur » conserve le titre révérenciel et christologique usuel dans ce contexte, sans le réduire au simple sens social de « maître ».
- issue: Première personne du pluriel οἴδαμεν
  choice: nous ne savons pas
  alternative: je ne sais pas
  rationale: Le pluriel explicite est maintenu afin de préserver la formulation et la tension du texte, qui ne précise pas ici quelles autres personnes Marie inclut.
- issue: Nuance de φιλέω
  choice: avait de l’affection
  alternative: aimait
  rationale: Les deux rendus sont possibles, mais « avait de l’affection » signale ici la nuance affective de φιλέω sans établir une distinction théologique rigide avec ἀγαπάω.
translation_notes:
  register: Français international moderne, narratif et digne. Les présents de narration sont conservés. « On » est employé dans la parole directe pour rendre naturellement les sujets indéfinis de Ἦραν et ἔθηκαν; « nous » reste explicite afin de préserver le pluriel grec.
