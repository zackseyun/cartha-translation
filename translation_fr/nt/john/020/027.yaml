reference: John 20:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: fr
  text: 'Puis il dit à Thomas : « Avance ton doigt ici et regarde mes mains. Avance ta main et mets-la dans mon côté. Ne deviens pas incrédule, mais croyant[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne deviens pas infidèle, mais fidèle. » Les adjectifs grecs peuvent exprimer soit l’absence ou la présence de foi, soit l’infidélité ou la fidélité. Dans ce contexte, le contraste porte surtout sur la foi de Thomas en Jésus ressuscité.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: Puis
  rationale: Marque simplement la progression du récit dans un français naturel.
- source_word: λέγει
  choice: il dit
  rationale: Le présent historique grec est rendu au passé simple, temps courant de la narration écrite en français.
- source_word: Φέρε
  choice: Avance
  rationale: Dans ce contexte, l’impératif invite Thomas à diriger son doigt puis sa main vers Jésus. « Avance » est plus naturel que le littéral « apporte » et permet de conserver la répétition du verbe.
- source_word: δάκτυλόν σου ὧδε
  choice: ton doigt ici
  rationale: Conserve la référence concrète du doigt et la valeur déictique de ὧδε.
- source_word: ἴδε
  choice: regarde
  rationale: Avec « mes mains », « regarde » exprime naturellement l’invitation à constater visuellement, sans l’archaïsme de « vois » employé comme injonction solennelle.
- source_word: τὰς χεῖράς μου
  choice: mes mains
  rationale: Rendu direct qui conserve le pluriel.
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: mets-la dans mon côté
  rationale: « Mets » conserve la force concrète de l’impératif βάλε, tandis que « dans » rend le mouvement vers l’intérieur exprimé par εἰς. Le pronom féminin reprend « ta main ».
- source_word: μὴ γίνου
  choice: ne deviens pas
  rationale: Conserve la nuance dynamique de γίνομαι sans la transformer en « cesse d’être », formulation qui imposerait une valeur aspectuelle plus forte.
- source_word: ἄπιστος
  choice: incrédule
  rationale: Dans le contexte du refus de Thomas de croire au témoignage concernant Jésus ressuscité, « incrédule » exprime clairement l’absence de croyance.
- source_word: πιστός
  choice: croyant
  rationale: Le contexte immédiat porte sur la foi en Jésus ressuscité. « Croyant » maintient le contraste avec « incrédule », tout en laissant en note l’autre sens lexical possible.
theological_decisions:
- issue: Le contraste ἄπιστος / πιστός dans l’exhortation adressée à Thomas
  choice: incrédule / croyant
  alternative: infidèle / fidèle
  rationale: Le récit met au premier plan le refus de Thomas de croire à la résurrection sans preuve visuelle et tactile. Le couple « incrédule / croyant » correspond donc au sens contextuel principal, tandis que la note préserve l’ambivalence lexicale sans introduire dans le texte une notion plus générale de loyauté.
translation_notes:
  register: Français international moderne, direct et digne. La répétition de « Avance » reproduit celle de Φέρε. La formulation légèrement marquée « ne deviens pas » est conservée pour rendre la dynamique du verbe grec plutôt que de la réduire au simple état exprimé par « ne sois pas ».
