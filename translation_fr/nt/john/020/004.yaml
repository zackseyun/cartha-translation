  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: fr
  text: Tous deux couraient ensemble, et l’autre disciple courut plus vite que Pierre et arriva le premier au tombeau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτρεχον
  choice: couraient
  rationale: L’imparfait exprime une action en cours dans le passé; « couraient » en conserve naturellement l’aspect.
- source_word: δὲ
  choice: et
  rationale: Dans ce contexte, δέ assure une transition narrative légère; « et » évite d’introduire une opposition trop marquée.
- source_word: οἱ δύο ὁμοῦ
  choice: Tous deux … ensemble
  rationale: Cette formulation naturelle conserve à la fois la mention explicite des deux hommes et l’idée qu’ils couraient de concert.
- source_word: ὁ ἄλλος μαθητής
  choice: l’autre disciple
  rationale: « Disciple » est le terme français consacré et contextuellement précis pour μαθητής dans les Évangiles.
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  choice: courut plus vite que Pierre, le devança
  rationale: προέδραμεν indique qu’il courut en avant, tandis que τάχιον τοῦ Πέτρου exprime explicitement la comparaison de vitesse. La formulation française rend les deux éléments sans ambiguïté.
- source_word: ἦλθεν πρῶτος
  choice: arriva le premier
  rationale: En contexte de course vers un lieu, « arriva le premier » est plus idiomatique en français que le calque « vint le premier ».
- source_word: εἰς τὸ μνημεῖον
  choice: au tombeau
  rationale: Le contexte désigne le lieu où Jésus a été enseveli. « Au » exprime ici l’arrivée au tombeau sans suggérer qu’il y soit entré, ce que le verset suivant exclut.
