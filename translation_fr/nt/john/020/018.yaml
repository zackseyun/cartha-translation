  variant: modern international French
source:
  edition: SBLGNT
  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: fr
  text: 'Marie de Magdala vint annoncer aux disciples[a] : « J’ai vu le Seigneur, et il m’a dit ces choses. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Marie de Magdala vint trouver les disciples et leur dit : “J’ai vu le Seigneur.” Et il lui dit ces choses. » La dernière proposition peut être comprise soit comme faisant partie du compte rendu de Marie, soit comme un commentaire du narrateur.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: vint
  rationale: Le présent grec est un présent historique. Le passé simple convient au registre narratif français et rend le mouvement vers les disciples.
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: Marie de Magdala
  rationale: Cette forme française courante rend naturellement le nom et l’origine indiquée par l’épithète.
- source_word: ἀγγέλλουσα
  choice: annoncer
  rationale: L’infinitif lié au verbe de mouvement rend naturellement le participe contemporain et conserve l’idée de transmettre une nouvelle.
- source_word: τοῖς μαθηταῖς
  choice: aux disciples
  rationale: « Disciples » est le terme français établi; aucun possessif n’est ajouté puisqu’il est absent du grec.
- source_word: ὅτι
  choice: ponctuation introduisant le discours direct
  rationale: Les deux-points et les guillemets rendent naturellement le contenu annoncé.
- source_word: Ἑώρακα
  choice: J’ai vu
  rationale: Le passé composé français exprime ici l’acte accompli dont la portée demeure présente.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Ce choix conserve la valeur titulaire et christologique de κύριος dans le contexte de la résurrection.
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: et qu’il lui avait dit ces choses
  rationale: La formulation retient la possibilité que cette proposition fasse encore partie du message de Marie. Le plus-que-parfait marque que les paroles du Seigneur précèdent son annonce.
theological_decisions:
- issue: Traduction de κύριος dans le contexte de la résurrection
  choice: le Seigneur
  alternative: le maître
  rationale: « Seigneur » préserve le titre reconnu de Jésus et sa portée christologique sans l’atténuer.
- issue: Lien de καὶ ταῦτα εἶπεν αὐτῇ avec le compte rendu de Marie
  choice: 'La proposition fait partie de ce que Marie annonce : « et qu’il lui avait dit ces choses »'
  alternative: 'Commentaire distinct du narrateur : « et il lui dit ces choses »'
  rationale: Bien qu’un second ὅτι ne soit pas exprimé, la proposition peut naturellement prolonger le contenu de ἀγγέλλουσα. L’ambiguïté réelle est signalée en note.
translation_notes:
  register: Français moderne, international et digne. Le passé simple maintient un registre narratif biblique naturel sans archaïsme marqué. La syntaxe volontairement légèrement serrée du dernier membre conserve l’ambiguïté du grec, explicitée dans la note.
