  source_fidelity: 'Le texte rend tous les éléments pertinents du grec : οὖν (« donc »), πάλιν (« de nouveau »), la salutation Εἰρήνη ὑμῖν, la comparaison introduite par καθὼς, le parfait ἀπέσταλκεν (« m’a envoyé »), « le Père », l’emphase coordonnée de κἀγώ (« moi aussi ») et le présent πέμπω (« je vous envoie »). Le passé composé français transmet convenablement la portée actuelle du parfait grec sans surcharger la phrase.'
