id: JHN.20.21
reference: John 20:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: fr
  text: 'Jésus leur dit donc de nouveau : « Que la paix soit avec vous ! Comme le Père m’a envoyé, moi aussi je vous envoie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la continuité logique et narrative avec la scène précédente, tout en restant naturel en français.
- source_word: πάλιν
  choice: de nouveau
  rationale: Signale explicitement que Jésus répète la salutation du verset précédent.
- source_word: Εἰρήνη ὑμῖν
  choice: Que la paix soit avec vous !
  rationale: Rend naturellement en français la formule de salutation grecque sans verbe, issue d’un arrière-plan sémitique. Une traduction littérale comme « Paix à vous » est possible, mais moins idiomatique dans le registre visé.
- source_word: καθὼς
  choice: Comme
  rationale: Introduit sobrement la correspondance entre la mission reçue du Père et celle confiée aux disciples.
- source_word: ἀπέσταλκέν
  choice: m’a envoyé
  rationale: Le passé composé français exprime une action accomplie dont la portée demeure actuelle, ce qui convient au parfait grec.
- source_word: ὁ πατήρ
  choice: le Père
  rationale: Conserve l’article et la manière johannique de désigner Dieu, sans ajouter le possessif « mon » absent du grec.
- source_word: κἀγὼ
  choice: moi aussi
  rationale: Rend à la fois la coordination et l’emphase portée par κἀγώ dans une formulation française naturelle.
- source_word: πέμπω
  choice: je vous envoie
  rationale: Le présent simple français convient à l’acte de commission accompli par cette parole et évite un progressif peu idiomatique.
theological_decisions:
- issue: Rapport entre l’envoi de Jésus par le Père et l’envoi des disciples par Jésus
  choice: « Comme le Père m’a envoyé, moi aussi je vous envoie. »
  alternative: « De même que le Père m’a envoyé, de même je vous envoie. »
  rationale: La formulation conserve l’analogie missionnaire affirmée par le texte sans préciser une identité de nature, d’autorité, de fonction ou de mode que le verset n’explicite pas.
translation_notes:
  register: Français international moderne, clair et digne. La salutation traditionnelle et idiomatique est retenue dans le texte principal; la syntaxe reste concise et solennelle sans archaïsme.
