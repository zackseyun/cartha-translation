  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: fr
  text: Alors Simon Pierre arrive lui aussi[a], en le suivant, et entre dans le tombeau ; il voit les linges posés là.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici le présent historique pour « arrive » et, plus loin, pour « voit », ce que la traduction conserve afin de rendre la vivacité du récit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: arrive
  rationale: Le présent historique grec est conservé en français, où il produit un récit naturel et vivant.
- source_word: οὖν
  choice: Alors
  rationale: Marque ici la progression du récit et la conséquence immédiate de la scène précédente sans suggérer une déduction formelle.
- source_word: καὶ Σίμων Πέτρος
  choice: Simon Pierre… lui aussi
  rationale: 'Rend la valeur additive de καί : Simon Pierre arrive à son tour, après l’autre disciple.'
- source_word: ἀκολουθῶν αὐτῷ
  choice: en le suivant
  rationale: Exprime la circonstance simultanée indiquée par le participe présent, tout en conservant le référent masculin du pronom.
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: Il entre dans le tombeau
  rationale: « Entrer dans » rend naturellement en français le mouvement vers l’intérieur exprimé par εἰς; « tombeau » convient au contexte funéraire.
- source_word: θεωρεῖ
  choice: voit
  rationale: Conserve le présent historique et rend simplement l’acte d’observer la scène, sans surcharger le verbe.
- source_word: τὰ ὀθόνια
  choice: les linges
  rationale: Terme français courant pour les pièces de toile de lin mentionnées dans le contexte funéraire, sans préciser davantage leur forme ou leur usage.
- source_word: κείμενα
  choice: qui sont là, posés
  rationale: Rend l’état statique des linges étendus ou déposés sur place; la formulation évite le possible comique de « couchés » et ne précise pas une disposition que le grec ne décrit pas.
