id: JHN.20.3
reference: John 20:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πέτρος καὶ ὁ ἄλλος μαθητής, καὶ ἤρχοντο εἰς τὸ μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: fr
  text: Pierre et l’autre disciple sortirent donc et se dirigeaient vers le tombeau[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « allaient au tombeau ». L’imparfait grec présente plus explicitement le déplacement comme une action en cours.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: sortirent
  rationale: L’aoriste de ἐξέρχομαι exprime ici le départ. Le passé simple convient à la narration écrite et « sortirent » conserve le mouvement hors du lieu où ils se trouvaient.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence narrative de l’annonce faite au verset précédent. « Donc » en préserve clairement la fonction.
- source_word: ὁ Πέτρος
  choice: Pierre
  rationale: Forme française traditionnelle et courante du nom personnel.
- source_word: ὁ ἄλλος μαθητής
  choice: l’autre disciple
  rationale: « Disciple » est le terme courant dans le récit évangélique, et « l’autre » renvoie au personnage déjà mentionné dans le contexte.
- source_word: ἤρχοντο
  choice: se dirigeaient
  rationale: L’imparfait grec présente le déplacement en cours. L’imparfait français « se dirigeaient » rend cet aspect tout en exprimant naturellement un mouvement vers une destination.
- source_word: εἰς τὸ μνημεῖον
  choice: vers le tombeau
  rationale: Dans ce contexte, μνημεῖον désigne le tombeau de Jésus. « Vers » indique le mouvement en direction du tombeau sans laisser entendre qu’ils y entrent déjà.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple porte l’action narrative ponctuelle, tandis que l’imparfait conserve le contraste aspectuel du grec et décrit le déplacement en cours.
