review_pass:
  verdict: revise
  source_fidelity: 'Le texte rend fidèlement les éléments essentiels : l’imparfait itératif de ἔλεγον (« disaient »), le parfait Ἑωράκαμεν (« avons vu »), le titre « le Seigneur », les trois gestes exigés et la négation emphatique οὐ μὴ πιστεύσω. Toutefois, « il leur répondit » explicite une notion de réponse qui n’est pas exprimée par εἶπεν (« il leur dit »).'
  naturalness: Le français est moderne, clair et d’un registre approprié. La répétition de « la marque des clous » reproduit utilement l’insistance grecque. Une seule condition initiale suivie de verbes coordonnés est plus naturelle en français et reflète plus directement la structure grecque.
  terminology: « Seigneur », « marque », « clous », « mains » et « côté » sont justes et cohérents. « Certainement pas » rend bien l’emphase de οὐ μή sans imposer la temporalité absolue de « jamais ».
  issues:
  - severity: low
    issue: « Il leur répondit » dépasse légèrement le verbe grec εἶπεν.
    rationale: Le grec dit simplement « il leur dit ». Même si le contexte permet de comprendre une réponse, le verbe français « répondit » ajoute cette nuance discursive.
  - severity: low
    issue: Les trois propositions conditionnelles sont chacune introduites par « si ».
    rationale: Le grec n’emploie qu’une seule protase introduite par ἐὰν μή, suivie de trois verbes coordonnés. En français, une seule introduction conditionnelle rend la phrase plus fluide tout en conservant intégralement les trois exigences.
