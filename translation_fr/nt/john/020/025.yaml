revisions:
- from: 'Les autres disciples lui disaient donc : « Nous avons vu le Seigneur. » Mais il leur répondit : « Si je ne vois pas dans ses mains la marque des clous, si je ne mets pas mon doigt dans la marque des clous et si je ne mets pas ma main dans son côté, je ne croirai certainement pas.[a] »'
  to: 'Les autres disciples lui disaient donc : « Nous avons vu le Seigneur. » Mais il leur dit : « Si je ne vois pas dans ses mains la marque des clous, ne mets pas mon doigt dans la marque des clous et ne mets pas ma main dans son côté, je ne croirai certainement pas.[a] »'
  rationale: La révision remplace « répondit » par le sens non enrichi de εἶπεν, « dit ». Elle restructure aussi la condition française afin qu’une seule proposition introduite par « si » gouverne les trois actions coordonnées, comme en grec. Le sens, le registre et la note sur la négation emphatique sont préservés.
