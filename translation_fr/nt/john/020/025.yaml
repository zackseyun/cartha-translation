id: JHN.20.25
reference: John 20:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: fr
  text: 'Les autres disciples lui disaient donc : « Nous avons vu le Seigneur. » Mais il leur dit : « Si je ne vois pas dans ses mains la marque des clous, ne mets pas mon doigt dans la marque des clous et ne mets pas ma main dans son côté, je ne croirai certainement pas.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne croirai jamais ». Le grec emploie une négation renforcée.'
    reason: Signaler une autre manière naturelle de rendre l’emphase de οὐ μή sans imposer une portée temporelle absolue dans le texte principal.
lexical_decisions:
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente une parole prolongée ou répétée; l’imparfait français en conserve naturellement l’aspect.
- source_word: οὖν
  choice: donc
  rationale: Conserve le lien narratif et inférentiel avec le verset précédent sans alourdir la phrase.
- source_word: οἱ ἄλλοι μαθηταί
  choice: les autres disciples
  rationale: Rend directement le groupe nominal et maintient le contraste avec Thomas.
- source_word: Ἑωράκαμεν
  choice: nous avons vu
  rationale: Le passé composé français exprime naturellement l’événement accompli dont la portée demeure présente.
- source_word: κύριον
  choice: le Seigneur
  rationale: Rend le titre κύριος qui, dans ce contexte, désigne Jésus ressuscité.
- source_word: Ἐὰν μὴ ἴδω
  choice: si je ne vois pas
  rationale: Formulation conditionnelle naturelle en français, qui préserve explicitement la condition négative.
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: dans ses mains
  rationale: Suit la préposition grecque et convient à une marque laissée dans les mains.
- source_word: τύπον
  choice: la marque
  rationale: Désigne ici la trace visible laissée par les clous; « marque » est concret, actuel et non archaïque.
- source_word: ἥλων
  choice: des clous
  rationale: Rend simplement le génitif indiquant ce qui a produit la marque.
- source_word: βάλω
  choice: je ne mets pas
  rationale: « Mettre » est l’équivalent français naturel dans ce contexte corporel et conserve le mouvement exprimé par la construction.
- source_word: τὸν δάκτυλόν μου εἰς
  choice: mon doigt dans
  rationale: « Dans » avec le verbe « mettre » exprime idiomatiquement en français le mouvement vers l’intérieur.
- source_word: μου τὴν χεῖρα
  choice: ma main
  rationale: Conserve le possessif explicitement présent dans le grec.
- source_word: πλευράν
  choice: côté
  rationale: Dans le récit johannique de la crucifixion et de l’apparition, « côté » est le terme français naturel pour la partie du corps visée.
theological_decisions:
- issue: Force du refus de Thomas dans οὐ μὴ πιστεύσω
  choice: je ne croirai certainement pas
  alternative: je ne croirai jamais
  rationale: La double négation grecque exprime un refus fortement emphatique. « Certainement pas » en conserve la vigueur sans transformer cette déclaration conditionnelle en refus intemporel absolu.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « la marque des clous » est conservée parce qu’elle appartient à l’insistance du texte grec. « Il leur répondit » rend naturellement le changement de locuteur, même si le grec emploie littéralement « il leur dit ».
