id: JHN.20.30
reference: John 20:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: fr
  text: Jésus a accompli beaucoup d’autres signes devant ses disciples[a], qui ne sont pas consignés dans ce livre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « miracles » ; le grec dit « signes », soulignant qu’il s’agit d’actes qui renvoient au-delà d’eux-mêmes à l’identité de Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: beaucoup d’autres
  rationale: Cette formulation française naturelle exprime la multiplicité et l’altérité. La valeur conclusive de οὖν et la fonction anticipatrice de μέν se comprennent dans l’enchaînement avec le verset 31 sans qu’il soit nécessaire d’ajouter un connecteur artificiel.
- source_word: σημεῖα
  choice: signes
  rationale: Dans Jean, le terme désigne des actes miraculeux qui révèlent l’identité et la mission de Jésus. « Signes » conserve cette portée caractéristique, contrairement à « miracles », qui mettrait surtout l’accent sur leur caractère extraordinaire.
- source_word: ἐποίησεν
  choice: a accompli
  rationale: Avec « signes », « accomplir » est idiomatique, digne et plus naturel en français que « faire des signes », qui pourrait évoquer des gestes ordinaires. Le passé composé convient au récit et à sa pertinence présente.
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: devant ses disciples
  rationale: « Devant » indique qu’ils en ont été les témoins. Le possessif « ses » explicite naturellement en français le lien contextuel avec Jésus sans modifier le référent.
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: qui ne sont pas consignés
  rationale: « Consignés » rend ici l’idée de faits mis par écrit et préserve l’état résultant exprimé par la construction périphrastique au parfait passif.
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: dans ce livre
  rationale: « Livre » est le terme français courant et approprié pour désigner l’œuvre écrite, sans imposer le support matériel plus précis de « rouleau ».
theological_decisions:
- issue: Emploi johannique de σημεῖα
  choice: Traduire par « signes ».
  alternative: « miracles »
  rationale: Ce choix préserve la tension entre l’acte extraordinaire et ce qu’il révèle au sujet de Jésus, sans réduire ces œuvres à de simples manifestations de puissance.
translation_notes:
  register: Français international moderne, clair et digne. « A accompli » évite l’expression ambiguë « faire des signes », tandis que « consignés » convient à des actes rapportés par écrit. La phrase reste proche de la structure grecque sans reproduire mécaniquement ses particules discursives.
