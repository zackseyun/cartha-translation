source:
  edition: SBLGNT
  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: fr
  text: Thomas, l’un des Douze, celui qu’on appelle le Jumeau, n’était pas avec eux quand Jésus est venu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: non exprimé séparément
  rationale: La particule marque ici une transition narrative légère vers Thomas. En français, le changement de sujet suffit naturellement à assurer cette transition; « mais » accentuerait trop le contraste et « or » donnerait un ton plus soutenu que nécessaire.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: l’un des Douze
  rationale: Expression française idiomatique qui conserve « les Douze » comme désignation reconnue du groupe apostolique, sans ajouter « disciples ».
- source_word: ὁ λεγόμενος Δίδυμος
  choice: celui qu’on appelle Didyme[a]
  rationale: La tournure reproduit clairement le participe grec. « Didyme » est la forme française traditionnelle du nom grec, tandis que la note en donne le sens lexical.
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: n’était pas avec eux
  rationale: Traduction directe de l’imparfait de εἰμί avec μετά et le génitif, indiquant l’absence de Thomas à ce moment-là.
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: quand Jésus est venu
  rationale: Le passé composé est naturel en français moderne pour l’événement ponctuel auquel l’imparfait « n’était pas » sert d’arrière-plan.
theological_decisions:
- issue: Rendu de Δίδυμος
  choice: Didyme, avec une note indiquant le sens « Jumeau »
  alternative: traduire directement par « Jumeau »
  rationale: Δίδυμος fonctionne ici comme une appellation grecque porteuse de sens. Garder la forme française « Didyme » respecte son usage comme nom ou surnom, tandis que la note rend son sens transparent sans trancher excessivement entre nom propre et épithète descriptive.
translation_notes:
  register: Français moderne, clair et digne. Le passé composé évite le passé simple, plus littéraire, et convient au récit courant. « Celui qu’on appelle » reste naturel tout en suivant de près la structure grecque.
