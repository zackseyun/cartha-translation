  source_fidelity: 'La syntaxe de base est fidèle : Thomas est identifié comme l’un des Douze et son absence est située au moment où Jésus est venu. Toutefois, Δίδυμος est un mot grec transparent signifiant « jumeau » et est introduit comme une appellation (« celui qui est appelé »). Le traduire directement rend mieux l’information lexicale du texte que de le remplacer par la forme traditionnelle française « Didyme » et de reléguer le sens en note.'
  naturalness: Le français est globalement moderne et fluide. « Thomas, l’un des Douze, celui qu’on appelle le Jumeau » demeure naturel dans un registre biblique sobre. Le passé composé dans « est venu » convient au français international moderne, en contraste avec l’imparfait « n’était pas ».
  terminology: « Les Douze » est la désignation usuelle appropriée. « Le Jumeau » rend Δίδυμος sans imposer d’interprétation sur l’identité d’un éventuel jumeau. Jésus et Thomas sont correctement nommés.
