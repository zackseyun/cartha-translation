  text: καὶ παρακύψας βλέπει κείμενα τὰ ὀθόνια, οὐ μέντοι εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: fr
  text: En se penchant pour regarder à l’intérieur, il voit les linges posés là, mais il n’entra pas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακύψας
  choice: En se penchant pour regarder à l’intérieur
  rationale: Le participe aoriste décrit à la fois le mouvement du corps à l’entrée du tombeau et l’action de regarder à l’intérieur.
- source_word: βλέπει
  choice: il voit
  rationale: Le présent français conserve le présent historique du récit johannique et sa vivacité.
- source_word: κείμενα
  choice: posés là
  rationale: Le participe de κεῖμαι indique que les linges se trouvent étendus ou placés à cet endroit; « posés là » est naturel en français sans suggérer nécessairement qui les aurait disposés.
- source_word: τὰ ὀθόνια
  choice: les linges
  rationale: Dans ce contexte funéraire, « les linges » rend directement le terme grec sans ajouter au texte la précision interprétative « funéraires ».
- source_word: οὐ μέντοι
  choice: mais
  rationale: La conjonction marque le contraste entre le fait de voir et le refus ou l’absence d’entrée; « mais » le rend clairement et naturellement.
- source_word: εἰσῆλθεν
  choice: il n’entra pas
  rationale: L’aoriste est rendu au passé simple, registre narratif digne et concis, avec le sens direct d’entrer dans le tombeau.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. Le présent historique « il voit » est maintenu au milieu du cadre narratif passé afin de préserver la vivacité caractéristique du grec de Jean.
