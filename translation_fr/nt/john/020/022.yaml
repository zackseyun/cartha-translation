id: JHN.20.22
reference: John 20:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: fr
  text: 'Après avoir dit cela, il souffla sur eux[a] et leur dit : « Recevez l’Esprit Saint. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il souffla en eux ». Le verbe rappelle aussi les images de la création et d’une création nouvelle en Genèse 2.7 et Ézéchiel 37.
    reason: Alternative lexicale et écho intertextuel laissés ouverts par le verbe grec.
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Après avoir dit cela
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. Cette formulation naturelle en français moderne préserve clairement la succession des actions.
- source_word: ἐνεφύσησεν
  choice: il souffla sur eux
  rationale: Le verbe désigne l’action de souffler sur quelqu’un ou vers lui. Cette traduction reste naturelle et ne précise pas excessivement le mouvement, tout en laissant percevoir l’écho possible aux récits de création et de renouvellement.
- source_word: λέγει αὐτοῖς
  choice: leur dit
  rationale: Le présent historique grec est rendu au passé, conformément à l’usage narratif courant en français. Le pronom indirect « leur » traduit naturellement αὐτοῖς.
- source_word: Λάβετε
  choice: Recevez
  rationale: Dans ce contexte, l’impératif de λαμβάνω désigne l’accueil ou la réception de l’Esprit. « Recevez » est précis, idiomatique et n’évoque pas une prise par initiative propre.
- source_word: πνεῦμα ἅγιον
  choice: l’Esprit Saint
  rationale: Dans le contexte johannique, l’expression désigne l’Esprit divin. En français, l’article défini est naturel après « recevez », même si l’expression grecque est sans article.
theological_decisions:
- issue: La valeur personnelle ou impersonnelle de πνεῦμα ἅγιον
  choice: l’Esprit Saint
  alternative: un esprit saint / de l’esprit saint
  rationale: Le contexte de l’Évangile selon Jean indique que l’expression renvoie à l’Esprit divin, non à une force indéfinie ou à un esprit simplement qualifié de saint. La traduction n’ajoute toutefois aucune précision doctrinale absente du texte.
- issue: La portée symbolique de ἐνεφύσησεν
  choice: Conserver « souffla sur eux » dans le texte et signaler l’autre compréhension en note
  alternative: il souffla en eux
  rationale: La construction grecque ne comporte pas de complément explicite équivalant à « sur eux » ou « en eux ». Le contexte fournit les destinataires, tandis que le verbe peut rappeler la création et la recréation. La note préserve cette ambiguïté sans imposer une interprétation.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé narratif est maintenu de façon cohérente; « l’Esprit Saint » suit l’usage français courant. La ponctuation respecte les conventions typographiques françaises.
