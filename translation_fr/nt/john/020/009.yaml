id: JHN.20.9
reference: John 20:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: fr
  text: En effet, ils ne comprenaient pas encore l’Écriture, selon laquelle il devait ressusciter d’entre les morts.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « il devait être ressuscité d’entre les morts ». Le grec emploie ici un verbe à la forme active : « ressusciter ».'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδέπω
  choice: pas encore
  rationale: Exprime naturellement en français que leur compréhension n’était pas encore acquise à ce moment du récit.
- source_word: γὰρ
  choice: En effet
  rationale: Marque le lien explicatif avec le verset précédent dans un français actuel et soutenu.
- source_word: ᾔδεισαν
  choice: comprenaient
  rationale: Avec « l’Écriture » et la proposition de contenu qui suit, le verbe désigne ici la saisie du sens plutôt que la simple connaissance de l’existence du texte.
- source_word: τὴν γραφὴν
  choice: l’Écriture
  rationale: Conserve le singulier grec et son sens courant de texte sacré faisant autorité, sans préciser indûment s’il s’agit d’un passage particulier ou du témoignage scripturaire en général.
- source_word: ὅτι
  choice: selon laquelle
  rationale: Introduit en français naturel le contenu attribué à l’Écriture tout en gardant le rapport explicatif du grec.
- source_word: δεῖ
  choice: devait
  rationale: Rend la nécessité exprimée par δεῖ et s’accorde avec le cadre narratif passé.
- source_word: αὐτὸν
  choice: il
  rationale: Devient naturellement le sujet de l’infinitif en français.
- source_word: ἐκ νεκρῶν
  choice: d’entre les morts
  rationale: Expression française consacrée qui rend la sortie du milieu des morts suggérée par ἐκ avec le pluriel νεκρῶν.
- source_word: ἀναστῆναι
  choice: ressusciter
  rationale: Conserve la forme active du grec et constitue l’expression française naturelle pour le retour à la vie.
theological_decisions:
- issue: Expression de la résurrection et agent de l’action
  choice: il devait ressusciter d’entre les morts
  alternative: il devait être ressuscité d’entre les morts
  rationale: L’infinitif grec ἀναστῆναι est actif. Le texte principal en garde donc la formulation sans imposer ici une tournure passive qui expliciterait un agent extérieur, même si cette dernière est compatible avec d’autres formulations néotestamentaires.
translation_notes:
  register: Français international moderne, naturel et digne. « En effet » assure la continuité explicative; « l’Écriture » conserve le singulier; « ressusciter d’entre les morts » maintient l’expression active et la nuance de ἐκ νεκρῶν.
