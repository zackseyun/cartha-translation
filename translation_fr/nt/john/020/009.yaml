  source_fidelity: Le texte rend avec exactitude οὐδέπω γὰρ ᾔδεισαν τὴν γραφήν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι. « En effet » exprime adéquatement la valeur explicative de γάρ; « ne comprenaient pas encore » transmet bien la portée contextuelle de ᾔδεισαν; le singulier « l’Écriture » respecte τὴν γραφήν. « Selon laquelle » est une formulation française idiomatique qui rend sans surinterprétation le contenu introduit par ὅτι. « Il devait ressusciter d’entre les morts » conserve la nécessité de δεῖ, l’actif de ἀναστῆναι et la nuance de ἐκ νεκρῶν.
