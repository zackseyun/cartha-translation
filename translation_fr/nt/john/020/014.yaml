source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: fr
  text: Après avoir dit ces paroles, elle se retourna et vit Jésus qui se tenait là, et elle ne savait pas que c’était Jésus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « elle ne reconnut pas Jésus ». Littéralement, le grec dit : « elle ne savait pas que c’est Jésus », ce qui exprime qu’elle n’avait pas identifié la personne qu’elle voyait.'
    reason: Variante lexicale explicitant la nuance possible de reconnaissance sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: ταῦτα
  choice: ces paroles
  rationale: Le démonstratif neutre pluriel renvoie à ce que Marie vient de dire. « Ces paroles » conserve l’idée du pluriel tout en étant naturel en français dans ce contexte de discours.
- source_word: εἰποῦσα
  choice: après avoir dit
  rationale: Le participe aoriste féminin indique une action antérieure à celle du verbe principal. Cette tournure exprime clairement et naturellement cette relation temporelle.
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: elle se retourna
  rationale: Cette expression idiomatique décrit le mouvement par lequel elle se tourne vers ce qui se trouve derrière elle. « Se retourna » est précis et naturel en français.
- source_word: θεωρεῖ
  choice: vit
  rationale: Le présent historique grec rend la scène vivante. Le passé simple convient toutefois à la narration française suivie et exprime ici une perception visuelle réelle sans ajouter l’idée d’une reconnaissance.
- source_word: ἑστῶτα
  choice: qui se tenait là
  rationale: Le participe parfait décrit Jésus dans la position de quelqu’un qui se tient debout. La relative française rend naturellement cet état dans la scène, tandis que « là » situe sa présence sans préciser indûment la distance.
- source_word: οὐκ ᾔδει
  choice: elle ne savait pas
  rationale: Le verbe exprime d’abord l’absence de connaissance. Cette traduction reste proche du grec et évite de faire de la reconnaissance l’unique nuance possible.
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: que c’était Jésus
  rationale: Cette proposition identifie la personne que Marie voit. L’imparfait est la formulation idiomatique attendue en français dans le discours narratif indirect, sans modifier le sens du présent grec.
theological_decisions:
- issue: Identification de Jésus ressuscité par Marie
  choice: elle ne savait pas que c’était Jésus
  alternative: elle ne reconnut pas Jésus
  rationale: Le texte affirme que Marie ignore l’identité de la personne présente, mais n’en précise pas la cause. La formulation principale conserve ce constat sans expliquer pourquoi elle ne reconnaît pas Jésus.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme marqué; l’imparfait rend naturellement l’état de non-connaissance. « Mais » explicite en français le contraste contextuel porté par la coordination grecque entre la vision de Jésus et l’absence d’identification.
