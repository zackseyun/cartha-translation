id: JHN.20.1
reference: John 20:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: fr
  text: Le premier jour de la semaine[a], Marie de Magdala vient au tombeau de bon matin, alors qu’il fait encore sombre, et elle voit que la pierre a été enlevée du tombeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement, « un [jour] des sabbats »; il s’agit d’une expression idiomatique désignant le premier jour de la semaine.
    reason: alternative lexicale
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: Le premier jour de la semaine
  rationale: Cette tournure idiomatique grecque désigne le premier jour de la semaine. La traduction naturelle explicite « jour », sous-entendu dans le grec. Le léger lien narratif porté par δέ n’exige pas ici l’ajout d’un connecteur français.
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: Marie de Magdala
  rationale: Forme française courante et claire du nom accompagné de son indication d’origine.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent historique grec est conservé afin de maintenir la vivacité du récit; il demeure naturel en français dans cette séquence narrative.
- source_word: πρωῒ
  choice: de bon matin
  rationale: Rend naturellement l’heure matinale sans suggérer qu’il fait déjà jour, puisque la proposition suivante précise qu’il fait encore sombre.
- source_word: σκοτίας ἔτι οὔσης
  choice: alors qu’il fait encore sombre
  rationale: La construction absolue exprime une circonstance temporelle continue; cette formulation est naturelle en français et conserve le présent narratif.
- source_word: εἰς τὸ μνημεῖον
  choice: au tombeau
  rationale: Dans ce contexte funéraire, μνημεῖον désigne clairement le tombeau.
- source_word: βλέπει
  choice: elle voit
  rationale: Le présent historique est conservé, et le pronom explicite assure une lecture fluide en français.
- source_word: τὸν λίθον ἠρμένον
  choice: que la pierre a été enlevée
  rationale: 'Le participe parfait passif décrit une action accomplie dont le résultat demeure visible: la pierre se trouve déjà retirée lorsqu’elle la voit.'
- source_word: ἐκ τοῦ μνημείου
  choice: du tombeau
  rationale: Rend simplement l’éloignement exprimé par ἐκ sans ajouter la notion d’« entrée », qui n’est pas explicite.
theological_decisions:
- issue: Temps narratif dans le récit de la résurrection
  choice: Conserver les présents historiques « vient » et « voit »
  alternative: Employer les passés « vint » et « vit » ou « est venue » et « a vu »
  rationale: Les présents grecs donnent de l’immédiateté au récit. Le français peut les conserver naturellement sans imposer d’interprétation théologique supplémentaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le présent historique est maintenu; « de bon matin » reste compatible avec l’obscurité explicitement mentionnée.
