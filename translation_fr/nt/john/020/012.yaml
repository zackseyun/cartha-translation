id: JHN.20.12
reference: John 20:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: fr
  text: Elle voit deux anges vêtus de blanc, assis, l’un à la tête et l’autre aux pieds, là où le corps de Jésus avait été étendu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεωρεῖ
  choice: elle voit
  rationale: Le présent historique grec est conservé naturellement en français; le contexte identifie le sujet comme Marie. « Voit » reste simple et direct.
- source_word: ἀγγέλους
  choice: anges
  rationale: Dans le contexte du tombeau vide, le terme désigne clairement des êtres célestes plutôt que de simples messagers humains.
- source_word: ἐν λευκοῖς
  choice: vêtus de blanc
  rationale: L’expression grecque signifie littéralement « en blanc » et sous-entend des vêtements; « vêtus de blanc » est idiomatique et précis en français.
- source_word: καθεζομένους
  choice: assis
  rationale: Le participe décrit simplement leur posture, sans qu’il soit nécessaire d’ajouter « là », absent du grec.
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: l’un à la place de la tête et l’autre à celle des pieds
  rationale: La formulation indique les deux extrémités de l’endroit où le corps avait été déposé. Cette traduction rend explicite le repère spatial sans suggérer que la tête et les pieds sont encore présents.
- source_word: ὅπου
  choice: là où
  rationale: Équivalent français naturel de l’adverbe relatif de lieu.
- source_word: ἔκειτο
  choice: avait reposé
  rationale: L’imparfait grec décrit l’état antérieur du corps à cet endroit. Le plus-que-parfait restitue clairement cette antériorité; « reposer » convient dignement à un corps déposé dans un tombeau.
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: le corps de Jésus
  rationale: Traduction directe, courante et respectueuse du groupe nominal grec.
theological_decisions:
- issue: Nature de ἀγγέλους dans le récit de la résurrection
  choice: anges célestes
  alternative: messagers
  rationale: Le tombeau vide et leur tenue blanche indiquent des êtres angéliques; ce choix découle du contexte lexical et narratif.
- issue: Valeur temporelle de ἔκειτο
  choice: état antérieur exprimé au plus-que-parfait
  alternative: « reposait » au passé simple ou à l’imparfait
  rationale: Au moment où Marie regarde, le corps n’est plus à cet endroit. Le plus-que-parfait rend nettement la relation temporelle suggérée par le contexte sans expliquer la cause de l’absence.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le présent narratif grec. « Vêtus de blanc » évite le tour légèrement elliptique « en blanc », tandis que « avait reposé » exprime sobrement l’état antérieur du corps.
