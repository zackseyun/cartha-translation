review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : Marie voit deux anges en blanc, assis aux deux extrémités de l’endroit où se trouvait auparavant le corps de Jésus. Toutefois, « à la place de la tête » introduit inutilement l’idée de remplacement et est moins exact que le repère spatial grec. « Avait reposé », bien que compréhensible, atténue la notion concrète de corps étendu/posé exprimée par ἔκειτο.'
  naturalness: La phrase est fluide dans l’ensemble. « L’un à la tête et l’autre aux pieds » est une formulation française naturelle dans ce contexte et évite la lourdeur de « à la place de la tête ».
  terminology: « Anges », « vêtus de blanc » et « le corps de Jésus » conviennent au registre moderne international et au contexte. « Avait été étendu » rend sobrement et concrètement l’état antérieur du corps sans ajouter d’interprétation.
  issues:
  - severity: medium
    issue: « à la place de la tête »
    rationale: Le grec πρὸς τῇ κεφαλῇ indique une position près/du côté de la tête, non une substitution (« à la place de »). La tournure française est également moins naturelle ici.
  - severity: low
    issue: « avait reposé » pour ἔκειτο
    rationale: Le verbe grec décrit le fait d’être couché ou étendu. « Reposer » est possible dans un contexte funéraire, mais peut devenir un euphémisme et perdre la description spatiale concrète. « Avait été étendu » la conserve mieux.
  revised_text: Elle voit deux anges vêtus de blanc, assis, l’un à la tête et l’autre aux pieds, là où le corps de Jésus avait été étendu.
