  text: ἄν τινων ἀφῆτε τὰς ἁμαρτίας ⸀ἀφέωνται αὐτοῖς· ἄν τινων κρατῆτε κεκράτηνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: fr
  text: Si vous pardonnez les péchés de qui que ce soit, ils lui ont été pardonnés ; si vous les retenez, ils ont été retenus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus naturelle : « Si vous pardonnez les péchés de quelqu’un, ils lui sont pardonnés ; si vous les retenez, ils sont retenus. » Dans les deux propositions, le grec emploie un parfait passif, qui peut souligner une action accomplie dont le résultat demeure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄν τινων
  choice: Si ... de certains
  rationale: La construction avec ἄν et le subjonctif exprime une condition indéfinie. « Si… de certains » en conserve à la fois la valeur conditionnelle et le référent humain indéfini.
- source_word: ἀφῆτε
  choice: vous pardonnez
  rationale: Dans le contexte des péchés, ἀφίημι signifie naturellement « pardonner ». « Remettre » serait plus traditionnel, mais moins immédiatement clair dans le français international courant.
- source_word: τὰς ἁμαρτίας
  choice: les péchés
  rationale: Cette formulation rend directement le groupe nominal grec et s’intègre naturellement à la construction française.
- source_word: ἀφέωνται
  choice: ils leur ont été pardonnés
  rationale: Le passé composé passif rend le parfait grec comme une action accomplie dont le résultat demeure. Le pronom « ils » reprend « les péchés », tandis que « leur » rend le datif αὐτοῖς.
- source_word: κρατῆτε
  choice: vous les retenez
  rationale: κρατέω s’oppose ici au pardon et signifie garder ou retenir les péchés. Le pronom « les » explicite naturellement en français que l’objet reste « les péchés ».
- source_word: κεκράτηνται
  choice: ils ont été retenus
  rationale: Le passé composé passif préserve le parallélisme avec ἀφέωνται et exprime l’état résultant du parfait grec.
theological_decisions:
- issue: Le rapport entre l’action des disciples et l’action divine dans le pardon ou la rétention des péchés
  choice: 'Conserver les parfaits passifs : « ils leur ont été pardonnés » et « ils ont été retenus »'
  alternative: « ils leur sont pardonnés » / « ils sont retenus », ou expliciter « Dieu les a pardonnés / retenus »
  rationale: Le grec ne nomme pas l’agent des passifs. La formulation retenue préserve donc l’ambiguïté et la tension théologique du texte sans attribuer explicitement l’action à Dieu ni présenter l’action des disciples comme indépendante.
translation_notes:
  register: Français moderne, digne et accessible. Le choix de « pardonner les péchés » évite l’emploi plus ecclésiastique de « remettre les péchés ». La reprise pronominale maintient le parallélisme serré du grec, et la note offre une formulation plus dynamique.
