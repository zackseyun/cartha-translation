id: JHN.20.29
reference: John 20:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: fr
  text: 'Jésus lui dit : « Parce que tu m’as vu, tu as cru ?[a] Heureux ceux qui n’ont pas vu et qui ont cru ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Parce que tu m’as vu, tu as cru. » Le grec peut se comprendre comme une question ou comme une affirmation.'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Le présent historique grec λέγει est rendu naturellement par le passé simple dans un récit français ; αὐτῷ, qui renvoie à Thomas, est conservé par « lui ».
- source_word: Ὅτι
  choice: Parce que
  rationale: Ὅτι introduit ici naturellement la cause de la foi de Thomas, sans exclure que l’ensemble de la proposition soit déclaratif plutôt qu’interrogatif.
- source_word: ἑώρακάς με
  choice: tu m’as vu
  rationale: Le passé composé exprime idiomatiquement en français l’action accomplie dont l’effet demeure pertinent dans la situation présente.
- source_word: πεπίστευκας
  choice: tu as cru
  rationale: Le passé composé rend avec naturel le parfait grec et relie la foi présente de Thomas au fait d’avoir vu Jésus.
- source_word: μακάριοι
  choice: Heureux
  rationale: « Heureux » est la formulation française courante, digne et traditionnelle des béatitudes ; elle désigne une condition favorable devant Dieu plutôt qu’une simple émotion passagère.
- source_word: οἱ μὴ ἰδόντες
  choice: ceux qui n’ont pas vu
  rationale: Cette formulation française naturelle conserve la négation et la valeur substantivée du participe grec.
- source_word: καὶ πιστεύσαντες
  choice: et qui ont cru
  rationale: Le simple « et » correspond explicitement au grec καί et préserve le contraste contextuel sans ajouter « pourtant » ou « néanmoins ».
theological_decisions:
- issue: Force de la première parole de Jésus
  choice: 'Lecture interrogative : « Parce que tu m’as vu, tu as cru ? »'
  alternative: 'Lecture déclarative : « Parce que tu m’as vu, tu as cru. »'
  rationale: Le grec transmis ne tranche pas par la ponctuation entre question et affirmation. La lecture interrogative fait entendre la nuance de contraste ou de doux reproche suggérée par la suite, tandis que la lecture déclarative demeure possible et est signalée en note.
- issue: Portée de μακάριοι
  choice: « Heureux »
  alternative: « Bénis » ou « Bienheureux »
  rationale: « Heureux » reprend l’idiome français usuel des béatitudes sans réduire nécessairement l’expression à un sentiment subjectif ni introduire une terminologie confessionnelle particulière.
translation_notes:
  register: Français international moderne, naturel et digne. Tutoiement conservé dans le dialogue direct. La ponctuation interrogative maintient la lecture principale tout en signalant immédiatement l’ambiguïté authentique par une note.
