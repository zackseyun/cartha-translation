  source_fidelity: 'Le texte rend fidèlement le grec : « Jésus lui dit » transmet naturellement le présent narratif λέγει ; « tu m’as vu » et « tu as cru » reflètent de façon idiomatique les parfaits ἑώρακάς et πεπίστευκας. La lecture interrogative de la première proposition est recevable, et la note préserve correctement l’alternative déclarative, puisque la ponctuation n’est pas déterminée par les manuscrits anciens. « Ceux qui n’ont pas vu et qui ont cru » correspond sans ajout au grec οἱ μὴ ἰδόντες καὶ πιστεύσαντες.'
