  text: ἀπῆλθον οὖν πάλιν πρὸς ⸀αὑτοὺς οἱ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/010.yaml
  text: So the disciples went away again to their own homes[a].
translation:
  language: fr
  text: Les disciples repartirent donc chez eux[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « vers eux-mêmes » ; on peut aussi comprendre : « à l’endroit où ils logeaient » ou « chez les leurs ».'
    reason: L’expression grecque πρὸς αὑτούς est idiomatique et ne précise pas explicitement s’il s’agit de leur domicile, de leur lieu de séjour ou de leur entourage.
lexical_decisions:
- source_word: ἀπῆλθον
  choice: repartirent
  rationale: L’aoriste de ἀπέρχομαι indique qu’ils quittent les lieux. Avec πάλιν, « repartirent » exprime naturellement en français le départ et l’idée de retour.
- source_word: οὖν
  choice: donc
  rationale: οὖν relie ce départ au récit précédent, avec une valeur de conséquence ou de continuation narrative. « Donc » conserve cette articulation sans alourdir la phrase.
- source_word: πάλιν
  choice: re- dans « repartirent »
  rationale: πάλιν marque ici le retour. Son sens est intégré au verbe « repartirent », ce qui évite la tournure moins naturelle « repartirent de nouveau ».
- source_word: πρὸς αὑτούς
  choice: chez eux
  rationale: L’expression signifie littéralement « vers eux-mêmes », mais désigne vraisemblablement l’endroit où ils logeaient ou leur lieu propre. « Chez eux » rend cet idiome de manière naturelle tout en laissant la note signaler l’ambiguïté.
- source_word: οἱ μαθηταί
  choice: les disciples
  rationale: « Les disciples » est la désignation française courante et exacte des μαθηταί de Jésus dans ce récit.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. « Repartirent » réunit naturellement les idées portées par ἀπῆλθον et πάλιν. « Chez eux » reste courant et digne, tandis que la note préserve l’indétermination de l’expression grecque.
