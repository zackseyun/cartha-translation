source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: fr
  text: 'Jésus lui dit : « Ne t’agrippe pas à moi[a], car je ne suis pas encore monté vers le Père. Mais va trouver mes frères[b] et dis-leur : “Je monte vers mon Père et votre Père, vers mon Dieu et votre Dieu.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Ne me touche pas » ou « Ne me retiens pas ». Le grec désigne probablement le fait de s’agripper à Jésus ou de continuer à le retenir, plutôt qu’un simple contact.
    reason: lexical_alternative
  - marker: b
    text: Le terme grec traduit par « frères » est un masculin pluriel. Ici, il désigne les disciples de Jésus et peut renvoyer à un groupe représentatif plus large.
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: Ne t’agrippe pas à moi
  rationale: Le présent impératif avec μή peut interdire la poursuite d’une action. « S’agripper à » exprime naturellement en français l’idée de retenir ou de continuer à tenir, sans réduire le sens à un simple contact.
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: car je ne suis pas encore monté
  rationale: Le passé composé rend ici la valeur résultative du parfait grec, tandis que « monter vers le Père » conserve le mouvement et la portée johannique de ἀναβαίνω.
- source_word: πρὸς τὸν πατέρα
  choice: vers le Père
  rationale: Le grec porte l’article sans possessif dans cette première proposition. « Le Père » respecte cette formulation avant la distinction explicite « mon Père et votre Père ».
- source_word: πορεύου δὲ πρὸς τοὺς ἀδελφούς μου
  choice: Mais va trouver mes frères
  rationale: « Va trouver » rend idiomatiquement le mouvement vers des personnes; « mes frères » conserve le masculin pluriel du grec.
- source_word: εἰπὲ αὐτοῖς
  choice: dis-leur
  rationale: Formulation française directe et naturelle qui garde la force de l’impératif.
- source_word: Ἀναβαίνω
  choice: Je monte
  rationale: Le présent français conserve la vivacité et l’imminence du présent grec, sans imposer une précision temporelle absente du texte.
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: mon Père et votre Père
  rationale: Cette traduction préserve le parallélisme délibéré ainsi que la distinction entre la relation de Jésus au Père et celle des disciples.
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: mon Dieu et votre Dieu
  rationale: Traduction directe qui maintient le parallélisme et toute la tension christologique du texte, sans atténuation doctrinale.
theological_decisions:
- issue: Sens de Μή μου ἅπτου
  choice: Interdiction de continuer à retenir Jésus ou à s’agripper à lui
  alternative: « Ne me touche pas »
  rationale: L’aspect du présent et le contexte favorisent l’idée d’une action en cours ou prolongée. La note maintient néanmoins l’alternative lexicale réelle.
- issue: Traduction de πατέρα dans la première proposition
  choice: « le Père »
  alternative: « mon Père »
  rationale: Le texte source n’a pas le possessif μου à cet endroit; celui-ci apparaît explicitement dans la parole qui suit.
- issue: Portée christologique de « mon Dieu et votre Dieu »
  choice: Conserver littéralement la formulation
  alternative: Une paraphrase visant à atténuer « mon Dieu »
  rationale: La traduction laisse subsister toute la force et la tension théologiques de la parole sans les résoudre par une reformulation doctrinale.
- issue: Référent de ἀδελφούς
  choice: « mes frères » dans le texte, avec une note explicative
  alternative: « mes frères et sœurs » ou « mes disciples »
  rationale: Le masculin pluriel grec est conservé, sans limiter silencieusement le groupe ni remplacer le lien familial exprimé par Jésus.
translation_notes:
  register: Français international moderne, naturel et digne. « Ne t’agrippe pas à moi » est courant sans être relâché; « va trouver » évite la tournure moins idiomatique « va vers ». Le parallélisme final est strictement préservé.
