id: JHN.20.8
reference: John 20:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: fr
  text: Alors, l’autre disciple, qui était arrivé le premier au tombeau, entra lui aussi ; il vit et crut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit simplement « crut », sans préciser explicitement ce qu’il crut. Il peut s’agir de la résurrection de Jésus, de ce que les indices présents dans le tombeau lui révélaient, ou du récit rapporté auparavant.
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: Alors
  rationale: La combinaison marque à la fois la progression du récit et une légère conséquence. « Alors » rend naturellement ces deux nuances en français sans alourdir la phrase.
- source_word: εἰσῆλθεν
  choice: entra
  rationale: Le verbe désigne l’entrée dans le tombeau. « Entra » est direct, naturel et précis dans ce récit.
- source_word: ὁ ἄλλος μαθητής
  choice: l’autre disciple
  rationale: « Disciple » est le terme français établi et exact pour μαθητής dans ce contexte johannique.
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: qui était arrivé le premier au tombeau
  rationale: Cette formulation naturelle indique clairement que son arrivée avait précédé l’action principale et qu’il avait atteint le tombeau avant Pierre.
- source_word: μνημεῖον
  choice: tombeau
  rationale: Dans ce récit funéraire, le mot désigne le lieu où Jésus avait été déposé ; « tombeau » est plus précis que « tombe » et convient au contexte.
- source_word: καὶ εἶδεν
  choice: il vit
  rationale: Le pronom explicite assure la clarté en français tout en rendant directement le verbe grec.
- source_word: ἐπίστευσεν
  choice: crut
  rationale: Le verbe est laissé sans complément, comme en grec, afin de ne pas préciser arbitrairement ce que le disciple crut.
theological_decisions:
- issue: Ce que le disciple crut
  choice: Rendre le verbe absolument par « crut », sans en préciser le contenu.
  alternative: « crut que Jésus était ressuscité », « crut le récit de Marie » ou « parvint à la foi »
  rationale: Le grec ne donne aucun complément au verbe. En ajouter un trancherait une question interprétative que le texte laisse ouverte, particulièrement au regard du verset suivant.
translation_notes:
  register: Français moderne, fluide et digne. Le passé simple convient à la narration biblique écrite sans être archaïque. Le point-virgule maintient l’enchaînement serré entre l’entrée, la vue et la foi.
