source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: fr
  text: 'Jésus lui dit : « Femme, pourquoi pleures-tu ? Qui cherches-tu ? » Pensant que c’était le jardinier, elle lui dit : « Monsieur[a], si c’est toi qui l’as emporté, dis-moi où tu l’as déposé, et moi, je l’emporterai. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « Seigneur » (κύριε) ; ici, le mot est probablement employé comme une formule de politesse, « Monsieur », puisque Marie pense parler au jardinier.'
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: Femme
  rationale: Le vocatif est une forme d’adresse directe qui n’est pas méprisante dans ce contexte. « Femme » préserve la formulation johannique et son écho dans le récit, sans ajouter une nuance affective absente du grec.
- source_word: τί κλαίεις
  choice: pourquoi pleures-tu ?
  rationale: κλαίω désigne ici le fait de pleurer; le français garde le ton solennel de la scène, tandis que τί exprime idiomatiquement la raison.
- source_word: τίνα ζητεῖς
  choice: Qui cherches-tu ?
  rationale: ζητέω signifie chercher; « qui » rend naturellement en français le complément personnel τίνα.
- source_word: δοκοῦσα
  choice: Pensant
  rationale: Le participe exprime l’interprétation erronée de Marie sans insister excessivement sur son degré de certitude.
- source_word: ὁ κηπουρός
  choice: le jardinier
  rationale: Traduction directe et courante de κηπουρός.
- source_word: Κύριε
  choice: Monsieur
  rationale: Bien que κύριε puisse signifier « Seigneur », Marie croit parler au jardinier; il fonctionne donc vraisemblablement ici comme une adresse respectueuse.
- source_word: ἐβάστασας αὐτόν
  choice: tu l’as emporté
  rationale: βαστάζω peut signifier porter ou emporter. Dans le contexte du déplacement d’un corps, « emporter » est naturel et conserve l’idée d’éloignement.
- source_word: ποῦ ἔθηκας αὐτόν
  choice: où tu l’as déposé
  rationale: τίθημι signifie mettre, placer ou déposer. « Déposer » convient naturellement à un corps sans préciser davantage la manière.
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: et moi, j’irai le prendre
  rationale: αἴρω peut signifier soulever, prendre ou enlever. Cette formulation française exprime naturellement l’intention future de Marie de récupérer le corps; « moi » conserve l’emphase de κἀγώ.
theological_decisions:
- issue: Sens de κύριε dans l’adresse de Marie avant qu’elle reconnaisse Jésus ressuscité
  choice: Monsieur
  alternative: Seigneur
  rationale: Le contexte indique que Marie pense s’adresser au jardinier; le sens d’adresse polie est donc le plus probable. La traduction « Seigneur », lexicalement possible et théologiquement chargée ailleurs dans Jean, est conservée en note afin de ne pas masquer l’ambiguïté du terme grec.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier grec et à l’usage habituel dans ce dialogue. « Femme » peut sembler plus abrupt en français contemporain, mais conserve l’adresse johannique sans lui ajouter « chère » ni la remplacer par « Madame ». Le marqueur de note est placé sur « Monsieur », le mot concerné.
