    issue: « et moi, j’irai le prendre » pour κἀγὼ αὐτὸν ἀρῶ
    rationale: ἀρῶ signifie ici « je l’emporterai / je l’enlèverai ». « J’irai » introduit un mouvement non exprimé et « le prendre » peut simplement signifier le récupérer, sans l’idée de l’emporter. « Je l’emporterai » rend le futur et fait écho à « tu l’as emporté ».
