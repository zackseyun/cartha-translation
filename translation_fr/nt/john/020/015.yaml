  verdict: revise
  source_fidelity: Le texte rend fidèlement les interrogations, la méprise de Marie, κηπουρός, l’adresse respectueuse κύριε et les verbes de déplacement. Toutefois, « j’irai le prendre » ajoute l’idée d’aller et ne rend pas clairement la valeur d’emportement/enlèvement de αὐτὸν ἀρῶ.
  naturalness: Le français est naturel, moderne et d’un registre digne. « Femme » est volontairement direct et quelque peu marqué en français contemporain, mais reste justifié par la formulation johannique et ne doit pas être adouci par un ajout interprétatif.
  terminology: « Monsieur » est le meilleur choix contextuel pour κύριε, puisque Marie prend Jésus pour le jardinier. La note conserve utilement « Seigneur » comme possibilité lexicale sans imposer une lecture théologique.
  issues:
