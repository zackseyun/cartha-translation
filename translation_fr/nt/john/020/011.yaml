  text: Μαρία δὲ εἱστήκει πρὸς ⸂τῷ μνημείῳ ἔξω κλαίουσα⸃. ὡς οὖν ἔκλαιεν παρέκυψεν εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/011.yaml
  text: But Mary was standing outside the tomb, weeping. So, as she was weeping, she bent over to look into the tomb,
translation:
  language: fr
  text: Mais Marie se tenait à l’extérieur du tombeau et pleurait. Alors qu’elle pleurait, elle se pencha[a] pour regarder dans le tombeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « elle se pencha et regarda dans le tombeau ». Le verbe grec exprime le fait de se pencher pour regarder à l’intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Marque une légère transition contrastive avec le départ des disciples au verset précédent, sans introduire une opposition forte.
- source_word: εἱστήκει
  choice: se tenait
  rationale: Rend l’état continu exprimé par le plus-que-parfait grec et décrit naturellement la posture de Marie.
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: dehors, près du tombeau
  rationale: Conserve à la fois la position extérieure et la proximité indiquée par πρὸς avec le datif, tout en restant naturel en français.
- source_word: μνημεῖον
  choice: tombeau
  rationale: Désigne ici le tombeau funéraire où Jésus avait été déposé; « tombeau » est précis, courant et adapté au contexte.
- source_word: κλαίουσα / ἔκλαιεν
  choice: pleurait / Tout en pleurant
  rationale: Préserve la durée de l’action et la répétition expressive du grec, avec une formulation française fluide.
- source_word: ὡς οὖν
  choice: Tout en
  rationale: Dans ce contexte, relie l’action suivante aux pleurs en cours sans surcharger le français d’une conséquence logique artificielle.
- source_word: παρέκυψεν
  choice: se pencha pour regarder
  rationale: Exprime le mouvement consistant à se courber afin de regarder à l’intérieur, sens porté par le verbe grec.
- source_word: εἰς τὸ μνημεῖον
  choice: à l’intérieur du tombeau
  rationale: Rend clairement l’orientation du regard vers l’intérieur du tombeau.
