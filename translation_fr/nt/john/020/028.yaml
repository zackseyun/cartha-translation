source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: fr
  text: 'Thomas lui répondit : « Mon Seigneur et mon Dieu ! »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre compréhension, moins probable : Thomas aurait prononcé « Mon Seigneur et mon Dieu ! » comme une exclamation qui ne s’adressait pas directement à Jésus. Cependant, le grec précise qu’il lui parla, ce qui appuie l’idée d’une adresse directe à Jésus.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Dans le récit, ἀποκρίνομαι signifie couramment « répondre ». Le passé simple convient au registre narratif français.
- source_word: Θωμᾶς
  choice: Thomas
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: εἶπεν αὐτῷ
  choice: lui répondit
  rationale: Le pronom datif αὐτῷ est conservé par « lui ». En français naturel, la combinaison grecque « répondit et lui dit » serait redondante ; « lui répondit » exprime idiomatiquement l’ensemble de la construction.
- source_word: Ὁ κύριός μου
  choice: Mon Seigneur
  rationale: « Seigneur » préserve la valeur respectueuse et la portée théologique de κύριος ; le possessif μου est rendu par « mon ».
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne directement les deux titres sans les confondre.
- source_word: ὁ θεός μου
  choice: mon Dieu
  rationale: θεός est rendu directement par « Dieu », et μου par « mon », ce qui conserve le caractère personnel de la confession.
theological_decisions:
- issue: Les paroles de Thomas sont-elles une adresse directe à Jésus ou une exclamation qui ne lui attribue pas les titres ?
  choice: 'Adresse directe à Jésus : « Mon Seigneur et mon Dieu ! »'
  alternative: Exclamation prononcée devant Jésus mais adressée à Dieu sans identifier directement Jésus comme « Seigneur » et « Dieu ».
  rationale: Le datif αὐτῷ indique explicitement que Thomas parle « à lui ». De plus, les nominaux grecs avec article peuvent servir d’apostrophe en grec koinè. La traduction conserve donc l’adresse directe et sa force christologique sans l’atténuer.
translation_notes:
  register: Français moderne, international et digne. « Thomas lui répondit » évite le calque lourd « Thomas répondit et lui dit » tout en conservant le destinataire explicite. L’exclamation traduit la force de la confession.
