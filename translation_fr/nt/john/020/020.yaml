id: JHN.20.20
reference: John 20:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: fr
  text: Après avoir dit cela, il leur montra ses mains et son côté. Les disciples se réjouirent alors en voyant le Seigneur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: Après avoir dit cela
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal. Cette tournure naturelle en français conserve clairement la succession temporelle.
- source_word: ἔδειξεν
  choice: montra
  rationale: Le verbe signifie présenter quelque chose à la vue. « Montra » est direct, naturel et précis dans ce contexte.
- source_word: τὰς χεῖρας
  choice: ses mains
  rationale: Même si le grec emploie l’article défini, le possessif est idiomatique en français puisqu’il s’agit des propres mains de Jésus.
- source_word: τὴν πλευράν
  choice: son côté
  rationale: « Côté » rend naturellement πλευρά et laisse le contexte évoquer la blessure mentionnée auparavant sans l’expliciter dans la traduction.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le datif désignant les destinataires s’intègre naturellement au verbe français sous la forme du pronom indirect « leur ».
- source_word: ἐχάρησαν
  choice: se réjouirent
  rationale: Le verbe χαίρω exprime la joie. « Se réjouirent » en conserve la force tout en restant digne et compréhensible.
- source_word: οὖν
  choice: alors
  rationale: Dans ce récit, οὖν marque la progression et la conséquence de ce qui précède. « Alors » rend ce lien avec fluidité sans imposer une déduction trop formelle.
- source_word: οἱ μαθηταί
  choice: Les disciples
  rationale: « Disciples » est le terme français établi et exact pour désigner les μαθηταί de Jésus.
- source_word: ἰδόντες
  choice: en voyant
  rationale: Le participe aoriste indique ici la circonstance qui provoque leur joie. « En voyant » conserve cette relation de manière concise et naturelle.
- source_word: τὸν κύριον
  choice: le Seigneur
  rationale: Dans le contexte de l’apparition après la résurrection, κύριος porte plus que le simple sens de « maître » et fonctionne comme un titre christologique. « Le Seigneur » en préserve la portée.
theological_decisions:
- issue: Sens et portée de κύριος
  choice: le Seigneur
  alternative: le maître
  rationale: Dans cette scène où les disciples reconnaissent Jésus ressuscité, « le Seigneur » conserve à la fois l’identification de Jésus et le poids christologique du titre dans l’Évangile selon Jean.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit sans être archaïque. Aucun ajout explicatif n’est introduit dans le verset.
