id: JHN.20.19
reference: John 20:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: fr
  text: 'Donc, le soir de ce même jour, le premier jour de la semaine, alors que les portes du lieu où se trouvaient les disciples étaient verrouillées par crainte des Juifs[a], Jésus vint, se tint au milieu d’eux et leur dit : « Paix à vous ! »[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou peut-être « des responsables juifs » ou « des Judéens », selon le sens donné ici au terme grec.
    reason: alternative_reading
  - marker: b
    text: 'Ou : « Que la paix soit avec vous ! » Le grec dit littéralement : « Paix à vous ! »'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  choice: donc … le soir venu
  rationale: Le génitif absolu fixe le cadre temporel, tandis que « donc » maintient le lien narratif exprimé par οὖν. La tournure française reste fluide sans effacer cette articulation.
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: ce même jour, le premier jour de la semaine
  rationale: « Ce même jour » renvoie clairement au jour déjà mentionné, et « le premier jour de la semaine » rend l’expression idiomatique grecque sans la remplacer par le nom moderne du dimanche.
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: les portes … étaient verrouillées
  rationale: Le participe parfait passif décrit l’état résultant d’une action antérieure. « Verrouillées » convient au contexte de crainte et exprime davantage qu’une simple fermeture.
- source_word: ὅπου ἦσαν οἱ μαθηταί
  choice: du lieu où se trouvaient les disciples
  rationale: Cette formulation française explicite seulement le lieu impliqué par « où », sans ajouter que les disciples y logeaient ou s’y étaient réunis.
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: par peur des Juifs
  rationale: διά avec l’accusatif indique ici la cause. La formulation demeure concise et conserve le référent lexical sans le préciser indûment.
- source_word: ἔστη εἰς τὸ μέσον
  choice: se tint au milieu d’eux
  rationale: Cette expression naturelle conserve l’image spatiale de Jésus qui prend place au milieu des disciples.
- source_word: λέγει αὐτοῖς
  choice: leur dit
  rationale: Le présent historique grec est rendu au passé simple, conformément à la narration française soutenue et naturelle.
- source_word: Εἰρήνη ὑμῖν
  choice: Que la paix soit avec vous !
  rationale: Cette formule française idiomatique transmet la salutation et la bénédiction exprimées par la phrase nominale grecque. La forme plus littérale est signalée en note.
theological_decisions:
- issue: Référent de τῶν Ἰουδαίων dans Jean
  choice: « des Juifs » dans le texte, avec une note contextuelle
  alternative: « des responsables juifs » ou « des Judéens »
  rationale: Le grec ne précise pas explicitement qu’il s’agit seulement des dirigeants. La note préserve les sens contextuellement possibles et limite le risque que l’expression soit comprise comme visant indistinctement tout le peuple juif.
- issue: Portée de la salutation Εἰρήνη ὑμῖν
  choice: « Que la paix soit avec vous ! »
  alternative: « Paix à vous ! »
  rationale: La traduction principale conserve à la fois la valeur de salutation et la force d’un souhait de paix, sans décider si les paroles doivent être comprises comme une simple formule ou comme une déclaration théologiquement plus chargée.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique sans être archaïque. La syntaxe place naturellement le cadre temporel en tête et évite d’alourdir la phrase par une imitation trop littérale du génitif absolu grec.
