revisions:
- from: 'Ce même jour donc, le premier jour de la semaine, le soir venu, les portes du lieu où se trouvaient les disciples étaient verrouillées, par peur des Juifs[a]. Jésus vint, se tint au milieu d’eux et leur dit : « Que la paix soit avec vous ! »[b]'
  to: 'Donc, le soir de ce même jour, le premier jour de la semaine, alors que les portes du lieu où se trouvaient les disciples étaient verrouillées par crainte des Juifs[a], Jésus vint, se tint au milieu d’eux et leur dit : « Paix à vous ! »[b]'
  rationale: La révision corrige l’ambiguïté syntaxique concernant le motif du verrouillage, conserve la progression narrative exprimée par οὖν avec « Donc », et adopte pour la salutation une équivalence française plus directe. Les alternatives contextuelles concernant Ἰουδαίων et la formulation développée de la salutation sont préservées en notes.
