    issue: Rattachement syntaxique ambigu de « par peur des Juifs »
    rationale: Placée après « les portes … étaient verrouillées », cette expression peut grammaticalement sembler attribuer la peur aux portes. Le grec attribue la crainte aux disciples et donne cette crainte comme motif du verrouillage.
  - severity: low
    issue: La formulation principale de la salutation est plus interprétative que nécessaire
    rationale: « Que la paix soit avec vous ! » est possible, mais « Paix à vous ! » rend directement la phrase nominale grecque et conserve sa concision; la formulation développée peut figurer en note comme alternative idiomatique.
