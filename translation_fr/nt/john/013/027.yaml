id: JHN.13.27
reference: John 13:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: fr
  text: 'Après ce morceau de pain[a], Satan entra alors en lui. Jésus lui dit donc : « Ce que tu fais, fais-le plus vite[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette bouchée ». Le grec désigne un petit morceau de nourriture, probablement ici le morceau de pain trempé donné pendant le repas.
    reason: lexical_alternative
  - marker: b
    text: Ou « fais-le vite ». Le grec emploie une forme comparative, littéralement « plus vite ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: ce morceau de pain
  rationale: Le diminutif désigne un petit morceau de nourriture, ici du pain dans le contexte du repas. « Morceau de pain » est concret, naturel et compréhensible en français moderne.
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: entra en lui
  rationale: Cette formulation conserve l’image directe d’une entrée personnelle et hostile sans l’expliquer ni l’atténuer.
- source_word: ὁ Σατανᾶς
  choice: Satan
  rationale: « Satan » est la forme propre traditionnelle et courante en français du nom ou titre grec.
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit donc
  rationale: Le passé simple convient au récit français naturel; « donc » rend le lien exprimé par οὖν sans l’alourdir.
- source_word: Ὃ ποιεῖς
  choice: Ce que tu fais
  rationale: Le présent grec est conservé sans introduire l’idée interprétative de ce que Judas serait seulement sur le point de faire.
- source_word: ποίησον
  choice: fais-le
  rationale: L’impératif bref et direct reproduit la force dépouillée du grec; le pronom « le » est nécessaire en français naturel.
- source_word: τάχιον
  choice: plus vite
  rationale: « Plus vite » conserve la forme comparative de l’adverbe grec, là où « vite » ou « rapidement » en effacerait la nuance.
theological_decisions:
- issue: Nature de l’action de Satan envers Judas
  choice: Conserver l’énoncé direct « Satan entra alors en lui »
  alternative: « Satan prit le contrôle de lui » ou « Judas se livra à Satan »
  rationale: Le texte affirme une entrée personnelle de Satan, mais n’en précise ni le mécanisme ni toute la portée. La traduction ne la réduit donc pas à une métaphore et ne développe pas non plus une doctrine de la possession absente du verset.
translation_notes:
  register: Français international moderne, sobre et digne. La tournure légèrement elliptique « Après ce morceau de pain » respecte l’expression grecque sans ajouter explicitement que Judas l’a pris ou mangé. Le passé simple maintient un récit français fluide, tandis que « plus vite » préserve la nuance comparative inhabituelle de l’original.
