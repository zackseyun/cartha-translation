  text: τοῦτο δὲ οὐδεὶς ἔγνω τῶν ἀνακειμένων πρὸς τί εἶπεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/028.yaml
  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: fr
  text: Mais aucun de ceux qui étaient à table ne comprit pourquoi il lui avait dit cela[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « dans quel but il lui avait dit cela ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie aux paroles qui précèdent. « Cela » est naturel en français et conserve cette référence sans l’expliciter davantage.
- source_word: δὲ
  choice: Mais
  rationale: La particule introduit ici un léger contraste entre l’ordre donné et l’incompréhension des convives.
- source_word: οὐδεὶς
  choice: aucun
  rationale: Avec le complément partitif « de ceux qui étaient à table », « aucun » exprime clairement la négation totale.
- source_word: ἔγνω
  choice: ne comprit
  rationale: Dans ce contexte, γινώσκω désigne le fait de saisir le sens ou le but des paroles, d’où « comprit » plutôt que le plus général « sut ».
- source_word: τῶν ἀνακειμένων
  choice: de ceux qui étaient à table
  rationale: Le participe désigne les personnes allongées pour prendre le repas selon l’usage antique. La formulation française actuelle rend clairement la situation sans imposer l’image peu naturelle de personnes « couchées ».
- source_word: πρὸς τί
  choice: pourquoi
  rationale: L’expression interroge ici le but ou la raison. « Pourquoi » est la formulation française la plus naturelle, tandis que la note conserve la nuance explicite de finalité.
- source_word: εἶπεν αὐτῷ
  choice: il lui avait dit
  rationale: Le plus-que-parfait situe naturellement en français cette parole avant le constat narratif exprimé par « ne comprit ». Les pronoms « il » et « lui » préservent la référence contextuelle du grec.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. « Étaient à table » communique naturellement le cadre du repas; la structure pronominale conserve l’implicite et l’ambiguïté référentielle du texte grec.
