  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: fr
  text: 'Il arrive donc auprès de Simon Pierre. Celui-ci lui dit[a] : « Seigneur, c’est toi qui me laves les pieds ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Monsieur, c’est toi qui me laves les pieds ? » Le grec κύριε peut être une formule d’adresse respectueuse ; « Seigneur » est conservé comme rendu principal.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: Il arrive
  rationale: Le présent de narration grec est conservé afin de préserver la vivacité du récit johannique. « Arrive auprès de » exprime naturellement le mouvement vers Simon Pierre.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque ici la progression du récit avec une nuance de conséquence; « donc » en maintient la force sans alourdir la phrase.
- source_word: πρὸς Σίμωνα Πέτρον
  choice: auprès de Simon Pierre
  rationale: πρός avec l’accusatif indique un mouvement en direction d’une personne; « auprès de » convient à l’approche immédiate de Jésus pour lui laver les pieds.
- source_word: λέγει αὐτῷ
  choice: Celui-ci lui dit
  rationale: Le sujet grammatical de λέγει est Simon Pierre, comme l’indique la question adressée à Jésus. « Celui-ci » évite en français l’ambiguïté que créerait « il », tandis que « lui » représente αὐτῷ. Le présent grec historique est rendu par le présent français.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve à la fois la valeur d’adresse respectueuse et la possible portée christologique du terme dans l’Évangile selon Jean.
- source_word: σύ
  choice: c’est toi qui
  rationale: La construction disloquée met naturellement en relief le pronom explicite et emphatique σύ, en faisant ressortir l’étonnement de Pierre.
- source_word: μου
  choice: me… les pieds
  rationale: Le français emploie idiomatiquement le pronom de la personne concernée avec l’article défini pour les parties du corps, plutôt que « mes pieds » dans cette construction.
- source_word: νίπτεις
  choice: laves
  rationale: νίπτω désigne le lavage d’une partie du corps. Le présent « laves » convient à l’action immédiate et à la question étonnée de Pierre.
- source_word: τοὺς πόδας
  choice: les pieds
  rationale: L’article défini est naturel en français après le pronom « me » lorsqu’il s’agit d’une partie du corps.
theological_decisions:
- issue: Sens de κύριε dans l’adresse de Pierre à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: « Seigneur » préserve l’adresse respectueuse ainsi que la résonance christologique possible dans Jean, sans imposer que Pierre exprime ici toute la portée théologique du titre.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent de narration est maintenu. La tournure « c’est toi qui » restitue l’emphase de σύ et l’étonnement de Pierre. La note signale surtout l’explicitation nécessaire du changement de sujet, sans effacer la concision grecque.
