    issue: La double formule ἀμὴν ἀμὴν est paraphrasée sans en conserver la répétition.
    rationale: « Oui, je te le dis, c’est la vérité » communique une affirmation solennelle, mais ajoute une reformulation explicative et efface la répétition caractéristique du grec johannique. « En vérité, en vérité » est plus proche du texte source et reste intelligible en français moderne.
