  rationale: La révision remplace la paraphrase de la double formule d’affirmation par « En vérité, en vérité », afin de conserver sa répétition et son relief dans l’évangile de Jean. Elle ajoute une note lexicalement justifiée sur ψυχή. Le reste de la formulation est maintenu, avec l’ajout du « ne » explétif après « avant que », courant dans le registre soigné, sans valeur négative supplémentaire.
