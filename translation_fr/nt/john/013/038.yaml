review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèle : Jésus répond à Pierre, met en question sa prétention à donner sa vie pour lui et annonce les trois reniements avant le chant du coq. Toutefois, « Oui, je te le dis, c’est la vérité » ne rend pas de façon suffisamment transparente la formule répétée ἀμὴν ἀμὴν. « En vérité, en vérité » en préserve la répétition et la solennité sans surcharge interprétative.'
  naturalness: Le français est globalement fluide et de registre biblique moderne. « En vérité, en vérité, je te le dis » est une formule française établie, claire et digne. La formulation temporelle « ne chantera pas avant que tu ne m’aies renié » est naturelle et conserve l’ordre des événements.
  terminology: « Donner sa vie », « renier », « le coq » et « trois fois » sont exacts et idiomatiques. Une note brève sur « vie » conserve l’alternative lexicale de ψυχή (« âme ») sans suggérer qu’elle soit le sens principal ici.
  issues:
