source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: fr
  text: 'Jésus lui répondit : « Tu donneras ta vie[a] pour moi ? En vérité, en vérité, je te le dis : le coq ne chantera pas avant que tu ne m’aies renié trois fois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ton âme ». Le grec psychē peut désigner l’« âme » ou la « vie » ; ici, il s’agit de donner sa vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: répondit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit écrit en français.
- source_word: Τὴν ψυχήν σου ... θήσεις
  choice: Tu donneras ta vie
  rationale: Dans cette expression, ψυχή désigne la vie que l’on accepte de sacrifier. « Donner sa vie » est idiomatique en français et conserve le sens concret du contexte.
- source_word: ὑπὲρ ἐμοῦ
  choice: pour moi
  rationale: Cette formulation concise exprime naturellement l’idée d’agir ou de mourir en faveur de Jésus.
- source_word: ἀμὴν ἀμὴν
  choice: Oui, je te le dis, c’est la vérité
  rationale: Cette formulation moderne rend le caractère solennel et affirmatif de la double formule, sans recourir à une tournure archaïque.
- source_word: οὐ μὴ ... φωνήσῃ
  choice: ne chantera certainement pas
  rationale: « Certainement pas » conserve la forte négation grecque οὐ μή, tandis que « chanter » est le verbe français usuel pour le cri du coq.
- source_word: ἀλέκτωρ
  choice: le coq
  rationale: Terme courant et précis en français moderne.
- source_word: ἕως οὗ
  choice: avant que
  rationale: Avec la négation principale, « ne… pas avant que » exprime naturellement la limite temporelle indiquée par le grec.
- source_word: ἀρνήσῃ με
  choice: tu m’aies renié
  rationale: « Renier » exprime ici le refus déclaré de reconnaître son lien avec Jésus. Le subjonctif passé est requis après « avant que » et présente les trois reniements comme accomplis avant le chant du coq.
- source_word: τρίς
  choice: trois fois
  rationale: Expression courante correspondant directement à l’adverbe grec.
theological_decisions:
- issue: Sens de ψυχή dans le contexte du sacrifice de soi
  choice: vie
  alternative: âme
  rationale: Le contexte porte sur la volonté déclarée de Pierre de mourir pour Jésus. « Vie » conserve ce sens concret sans imposer une conception particulière de l’être humain.
- issue: Force de la prédiction introduite par οὐ μή
  choice: ne chantera certainement pas avant que
  alternative: ne chantera pas avant que
  rationale: L’ajout de « certainement » maintient l’insistance de la négation grecque sans modifier l’ordre prédit des événements.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au singulier grec et à l’usage courant dans les traductions bibliques françaises. La question brève garde la réplique incisive de Jésus.
