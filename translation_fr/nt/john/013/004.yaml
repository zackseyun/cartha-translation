  text: ἐγείρεται ἐκ τοῦ δείπνου καὶ τίθησιν τὰ ἱμάτια καὶ λαβὼν λέντιον διέζωσεν ἑαυτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: fr
  text: Il se lève de table, met de côté ses vêtements de dessus et, prenant un linge, se le noue autour de la taille.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγείρεται ἐκ τοῦ δείπνου
  choice: Il se lève de table
  rationale: Le présent historique grec est conservé. En français, « se lever de table » exprime naturellement le fait de quitter sa place pendant le repas, sans suggérer que le repas est terminé.
- source_word: τίθησιν τὰ ἱμάτια
  choice: pose ses vêtements de dessus
  rationale: Dans ce contexte, τίθημι signifie déposer ou mettre de côté, et ἱμάτια désigne les vêtements extérieurs. Cette formulation évite de laisser entendre qu’il se déshabille entièrement.
- source_word: λαβὼν λέντιον
  choice: prenant un linge
  rationale: λέντιον désigne une pièce de toile employée ici pour le service. « Linge » est naturel et suffisamment précis en français; « serviette » pourrait évoquer trop étroitement une serviette de table moderne.
- source_word: διέζωσεν ἑαυτόν
  choice: il se le noue autour de la taille
  rationale: Le verbe signifie se ceindre de quelque chose. La formulation explicite clairement le geste en français moderne, le pronom « le » renvoyant au linge.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. Le présent historique des deux verbes principaux est maintenu. La coordination et le participe préservent la progression serrée des gestes du texte grec.
