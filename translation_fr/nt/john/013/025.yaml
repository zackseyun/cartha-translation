  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: fr
  text: 'Alors, celui-ci, s’étant ainsi penché en arrière[a] contre la poitrine de Jésus, lui dit : « Seigneur, qui est-ce ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « s’étant allongé contre la poitrine de Jésus ». Le grec évoque la posture d’un repas pris allongé à table.'
    reason: Préciser la posture culturelle et signaler une autre traduction possible de ἀναπεσών.
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: se penche en arrière
  rationale: Dans le contexte d’un repas pris en position allongée, le verbe évoque à la fois la posture à table et le mouvement vers l’arrière en direction de Jésus.
- source_word: ἐκεῖνος
  choice: celui-ci
  rationale: Le démonstratif renvoie au disciple mentionné juste auparavant sans ajouter explicitement une identification absente du grec.
- source_word: οὕτως
  choice: ainsi
  rationale: « Ainsi » relie le geste à la position décrite dans le verset précédent et conserve la valeur adverbiale du grec.
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: contre la poitrine de Jésus
  rationale: « Poitrine » est le terme courant et précis en français moderne; « contre » exprime naturellement le contact associé à cette posture.
- source_word: λέγει αὐτῷ
  choice: lui dit
  rationale: Le présent narratif français rend naturellement le présent historique grec et maintient la vivacité de la scène.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » préserve à la fois la valeur d’adresse respectueuse et la portée christologique possible du titre dans l’Évangile selon Jean.
- source_word: τίς ἐστιν;
  choice: qui est-ce ?
  rationale: Cette formulation idiomatique demande l’identité de la personne évoquée sans préciser davantage que le grec.
theological_decisions:
- issue: Traduction de κύριος dans une adresse directe à Jésus
  choice: Seigneur
  alternative: Maître ; Monsieur
  rationale: « Seigneur » conserve l’ouverture du terme entre adresse respectueuse et titre théologiquement significatif, sans réduire d’avance l’une de ces dimensions.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif maintient le présent historique du grec; « celui-ci » conserve le démonstratif sans introduire le substantif interprétatif « disciple ».
