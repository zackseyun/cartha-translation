source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: fr
  text: 'Jésus lui dit : « Celui qui s’est baigné[a] n’a besoin que de se laver les pieds, mais il est entièrement propre. Et vous, vous êtes propres, mais pas tous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le grec emploie deux verbes différents : λούω, « se baigner » ou laver tout le corps, et νίπτω, « laver », souvent une partie du corps comme les pieds.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Le présent historique λέγει est rendu par le présent français, naturel dans un récit vivant et fidèle à la forme grecque.
- source_word: Ὁ λελουμένος
  choice: Celui qui s’est baigné
  rationale: Le parfait de λούω présente une personne ayant pris un bain et se trouvant dans l’état qui en résulte. « S’est baigné » conserve cette nuance et prépare le contraste avec le lavage des pieds.
- source_word: οὐκ ἔχει χρείαν εἰ μὴ
  choice: n’a besoin que de
  rationale: Cette tournure française exprime naturellement l’absence de tout autre besoin et l’unique exception introduite par εἰ μή.
- source_word: τοὺς πόδας νίψασθαι
  choice: se laver les pieds
  rationale: νίπτω désigne souvent le lavage d’une partie du corps. La construction pronominale est idiomatique en français et fait clairement des pieds ceux de la personne baignée.
- source_word: καθαρὸς ὅλος
  choice: entièrement propre
  rationale: « Propre » maintient l’image concrète du lavage tout en laissant ouverte sa portée symbolique; « entièrement » rend l’idée de totalité exprimée par ὅλος.
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: Et vous, vous êtes propres
  rationale: La reprise du pronom met naturellement en relief le « vous » pluriel en français et conserve la répétition de καθαρός.
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: mais pas tous
  rationale: La formulation conserve l’exception interne au groupe sans préciser davantage l’identité ou la nature de cette exception.
theological_decisions:
- issue: Rapport entre le lavage matériel et la pureté symbolique ou spirituelle
  choice: Conserver « s’est baigné », « se laver les pieds » et « propre » sans expliciter le symbole.
  alternative: Traduire καθαρός par « pur » ou ajouter « spirituellement ».
  rationale: Le contexte fait jouer ensemble le geste concret et une portée plus profonde. La traduction garde cette tension sans imposer une interprétation doctrinale.
- issue: Distinction entre λούω et νίπτω
  choice: Employer respectivement « se baigner » et « se laver » et signaler la distinction en note.
  alternative: Rendre les deux verbes par « se laver ».
  rationale: La distinction lexicale structure la parole de Jésus et ne doit pas être aplatie.
- issue: Portée générique du participe masculin singulier
  choice: Celui qui s’est baigné
  alternative: L’homme qui s’est baigné
  rationale: Le masculin grammatical a ici une valeur générique; « celui qui » conserve le singulier sans introduire une limitation au sexe masculin.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement n’apparaît pas directement dans ce verset; « lui » reprend Pierre dans le contexte. La formulation conserve le présent historique grec et la répétition emphatique « vous, vous ».
