  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: fr
  text: 'Simon Pierre lui dit : « Seigneur[a], pas seulement mes pieds, mais aussi mes mains et ma tête. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Maître ». Grec : κύριος.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec donne de la vivacité au récit. En français narratif moderne, le présent « dit » le conserve naturellement.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif est rendu directement sans remplacer son référent par le nom de Jésus.
- source_word: Σίμων Πέτρος
  choice: Simon Pierre
  rationale: Forme française traditionnelle et courante du nom composé.
- source_word: Κύριε
  choice: Seigneur
  rationale: Ce titre d'adresse conserve à la fois la déférence de Pierre et la portée théologique possible de κύριος dans Jean.
- source_word: μὴ ... μόνον ἀλλὰ καὶ
  choice: pas seulement… mais aussi
  rationale: Cette tournure française naturelle exprime l'extension contrastive de la construction grecque.
- source_word: τοὺς πόδας μου
  choice: mes pieds
  rationale: Traduction directe de l'objet accompagné du possessif.
- source_word: τὰς χεῖρας
  choice: mes mains
  rationale: Le possessif, non répété en grec, est naturellement repris en français pour les parties du corps coordonnées.
- source_word: τὴν κεφαλήν
  choice: ma tête
  rationale: Le possessif implicite est repris selon l'usage français; « tête » en est le sens ordinaire ici.
theological_decisions:
- issue: Traduction de κύριος comme titre adressé à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » est le rendu français normal de κύριος et préserve sa résonance johannique sans imposer une interprétation plus précise que le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent historique est maintenu. L'exclamation finale, implicite dans la réponse vive et expansive de Pierre, rend son élan sans modifier le contenu propositionnel.
