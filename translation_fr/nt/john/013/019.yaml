  naturalness: Le français est sobre et moderne dans l’ensemble. L’ajout de « n’ » dans « avant que cela n’arrive » est la tournure standard après « avant que ». La formulation absolue « que je suis » reste marquée, mais elle est recevable dans ce contexte et son étrangeté reflète celle du grec sans être fautive.
  terminology: « Croire », « afin que » et « dès maintenant » conviennent. La note doit distinguer la traduction française nécessairement moins emphatique du grec, où le pronom ἐγώ est exprimé, de toute interprétation théologique arrêtée.
