  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: fr
  text: Dès maintenant, je vous le dis, avant que cela n’arrive, afin que, lorsque cela arrivera, vous croyiez que je suis[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement, le grec dit : « que moi, je suis », avec un pronom exprimé pour l’insistance. Cette expression peut aussi faire écho aux paroles par lesquelles Dieu se fait connaître dans Ésaïe, ainsi qu’à d’autres passages de Jean.'
    reason: Signaler la formulation absolue et l’insistance du grec, ainsi que sa possible portée théologique, sans imposer de prédicat ni une interprétation unique.
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: Dès maintenant
  rationale: Expression temporelle naturelle en français, qui situe la parole au moment présent et lui donne une portée vers l’avenir.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Le présent français convient à l’adresse directe; le pronom « le » reprend naturellement ce qui est annoncé.
- source_word: πρὸ τοῦ γενέσθαι
  choice: avant que cela arrive
  rationale: Rend clairement l’antériorité exprimée par πρό avec l’infinitif articulé, sans préciser davantage l’événement laissé implicite en grec.
- source_word: ἵνα
  choice: afin que
  rationale: Conserve nettement la valeur de but tout en gardant un registre digne et courant.
- source_word: πιστεύσητε
  choice: vous croyiez
  rationale: Rend le verbe πιστεύω sans lui imposer ici une nuance plus précise de commencement ou de confiance.
- source_word: ὅταν γένηται
  choice: lorsque cela arrivera
  rationale: Le futur français exprime naturellement l’accomplissement encore à venir envisagé par ὅταν avec le subjonctif.
- source_word: ὅτι ἐγώ εἰμι
  choice: que moi, je suis
  rationale: Cette formulation inhabituellement absolue conserve l’absence de prédicat dans le grec, l’insistance de ἐγώ et la possible résonance de l’auto-identification divine, sans la résoudre.
theological_decisions:
- issue: Traduction de l’expression absolue ἐγώ εἰμι dans le contexte johannique
  choice: que moi, je suis
  alternative: que c’est moi
  rationale: « Que c’est moi » serait plus idiomatique, mais réduirait plus facilement l’expression à une simple identification. La formulation retenue garde l’étrangeté signifiante du grec ainsi que sa possible évocation des déclarations divines d’Ésaïe et d’autres passages de Jean, sans affirmer que cette évocation épuise le sens.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition « cela arrive / cela arrivera » suit la répétition du même verbe grec et maintient le lien entre annonce et accomplissement. L’étrangeté volontaire de « moi, je suis » préserve l’ambiguïté du texte source.
