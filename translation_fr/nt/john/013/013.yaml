id: JHN.13.13
reference: John 13:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: fr
  text: Vous m’appelez « le Maître » et « le Seigneur »[a], et vous dites juste, car je le suis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Maître ». Le grec kyrios peut désigner une personne qui exerce l’autorité ou la seigneurie; « le Seigneur » est retenu ici comme traduction habituelle du titre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: appelez
  rationale: Dans cette construction où Jésus reçoit deux titres, « vous m’appelez » est la tournure française naturelle et directe.
- source_word: Ὁ διδάσκαλος
  choice: le Maître
  rationale: « Le Maître » exprime ici le titre de celui qui enseigne et conserve l’article grec; dans le contexte disciple-maître, le français courant préfère souvent « Maître » à « Enseignant ».
- source_word: Ὁ κύριος
  choice: le Seigneur
  rationale: « Le Seigneur » conserve la valeur habituelle de κύριος comme titre d’autorité appliqué à Jésus, sans en réduire d’avance la portée à celle d’un simple maître humain.
- source_word: καλῶς λέγετε
  choice: vous dites juste
  rationale: 'Cette expression française naturelle garde le verbe « dire » de λέγετε et rend la valeur évaluative de καλῶς : leur manière de le désigner est exacte.'
- source_word: εἰμὶ γάρ
  choice: car je le suis
  rationale: Le pronom « le » est nécessaire en français pour reprendre les deux titres prédicatifs; la formulation reste concise et préserve l’affirmation personnelle de Jésus.
theological_decisions:
- issue: Portée du titre κύριος appliqué à Jésus
  choice: le Seigneur
  alternative: le Maître
  rationale: « Seigneur » maintient la force traditionnelle et christologique possible du titre, tandis que « Maître » pourrait le confondre avec διδάσκαλος et aplatir la distinction entre les deux appellations.
translation_notes:
  register: Français international moderne, digne et accessible. Les guillemets signalent clairement les deux appellations citées. « Vous dites juste » conserve davantage la forme du grec que « vous avez raison », tout en restant idiomatique.
