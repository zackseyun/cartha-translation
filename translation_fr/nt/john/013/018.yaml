id: JHN.13.18
reference: John 13:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: fr
  text: '« Je ne parle pas de vous tous[a]. Je sais qui j’ai choisis. Mais c’est afin que l’Écriture s’accomplisse : “Celui qui mange mon pain a levé son talon contre moi[c].”[b] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Je ne parle pas au sujet de vous tous. »'
    reason: lexical_alternative
  - marker: b
    text: Citation ou allusion au Psaume 41.10 (41.9 dans certaines numérotations).
    reason: cross_reference
  - marker: c
    text: 'Ou : « a dressé son talon contre moi ». Cette image exprime l’hostilité et la trahison.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: Je ne parle pas de vous tous
  rationale: Formulation française naturelle qui conserve la portée de la négation et le sens de περὶ, « au sujet de ».
- source_word: οἶδα
  choice: Je sais
  rationale: Bien que οἶδα ait une forme de parfait, il a ici le sens présent courant de « savoir ».
- source_word: τίνας ἐξελεξάμην
  choice: lesquels j’ai choisis
  rationale: Le pronom maintient l’idée d’un choix parmi plusieurs et le pluriel de τίνας, sans préciser la nature théologique de ce choix.
- source_word: ἀλλ’ ἵνα
  choice: Mais c’est afin que
  rationale: Cette tournure rend clairement le lien de finalité ou d’accomplissement sans ajouter d’explication causale.
- source_word: ἡ γραφὴ πληρωθῇ
  choice: l’Écriture s’accomplisse
  rationale: Expression française consacrée et naturelle pour le langage johannique de l’accomplissement de l’Écriture.
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: Celui qui mange mon pain
  rationale: Rend naturellement le participe substantivé et rattache μου à « pain », conformément à la construction du texte.
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: a levé son talon contre moi
  rationale: Conserve l’image concrète du talon ainsi que l’hostilité exprimée par ἐπ’ ἐμέ, sans réduire la citation à une simple paraphrase de la trahison.
theological_decisions:
- issue: Rapport entre le choix de Jésus et le traître
  choice: Traduire simplement ἐξελεξάμην par « j’ai choisis », sans définir ce choix comme élection au salut ni comme simple nomination apostolique.
  alternative: Employer une formulation qui exclut explicitement Judas du choix ou qui définit la nature salvifique du choix.
  rationale: Le verset ne précise pas à lui seul la catégorie théologique du choix; la traduction conserve donc la tension du contexte.
- issue: Valeur de ἀλλ’ ἵνα dans le rapport entre la trahison et l’Écriture
  choice: « Mais c’est afin que l’Écriture s’accomplisse »
  alternative: « Mais cela est arrivé parce que l’Écriture devait nécessairement se réaliser »
  rationale: La formulation retenue préserve le langage d’accomplissement et sa possible nuance de finalité sans ajouter une explication déterministe absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. La métaphore du talon est conservée dans le texte, tandis qu’une note en explicite la portée idiomatique. Les marqueurs sont placés directement après les segments auxquels ils se rapportent.
