id: JHN.13.8
reference: John 13:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: fr
  text: 'Pierre lui dit : « Non, jamais tu ne me laveras les pieds ! » Jésus lui répondit : « Si je ne te lave pas, tu n’as aucune part avec moi[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tu n’as rien en partage avec moi » ; le terme grec peut désigner une part, une participation ou ce que l’on partage.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: Non, jamais tu ne me laveras
  rationale: La combinaison de οὐ μή et de εἰς τὸν αἰῶνα exprime un refus catégorique. « Non, jamais » en restitue naturellement la vigueur en français moderne.
- source_word: μου τοὺς πόδας
  choice: les pieds
  rationale: Le pronom objet « me » rend déjà explicite que Pierre parle de ses propres pieds ; « me laver les pieds » est la tournure française naturelle.
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: Jésus lui répondit
  rationale: Cette formulation suit directement la syntaxe narrative grecque tout en restant idiomatique en français.
- source_word: Ἐὰν μὴ νίψω σε
  choice: Si je ne te lave pas
  rationale: La traduction conserve la structure conditionnelle explicite et ne réduit pas le geste au seul lavage des pieds, puisque Jésus emploie ici le pronom « te » sans nommer une partie du corps.
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  choice: tu n’as aucune part avec moi
  rationale: « Part » conserve l’image ouverte de μέρος, qui peut évoquer une participation, un partage ou une appartenance, tandis que « avec moi » rend précisément μετά avec le génitif sans introduire l’idée distincte d’être « en » Jésus.
theological_decisions:
- issue: Portée de la « part » avec Jésus
  choice: Conserver la formule large « aucune part avec moi »
  alternative: Expliciter comme communion, salut, héritage ou participation sacramentelle
  rationale: Le verset affirme la nécessité du lavage accompli par Jésus, mais ne précise pas ici son mécanisme théologique. La traduction maintient donc la tension entre purification, communion et appartenance sans imposer une lecture confessionnelle particulière.
- issue: Étendue du lavage dans la réponse de Jésus
  choice: « Si je ne te lave pas »
  alternative: « Si je ne te lave pas les pieds »
  rationale: Dans sa réponse, Jésus dit νίψω σε, « je te lave », sans répéter « les pieds ». Préserver cette différence permet de ne pas limiter d’avance la portée symbolique possible de ses paroles.
translation_notes:
  register: Français international moderne, digne et oralement naturel. L’exclamation traduit la force du refus de Pierre sans archaïsme. La réponse de Jésus reste sobre et conserve l’ambiguïté théologique du grec.
