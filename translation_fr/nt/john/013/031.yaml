id: JHN.13.31
reference: John 13:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: fr
  text: 'Lorsqu’il fut sorti, Jésus dit alors : « Maintenant, le Fils de l’homme a été glorifié, et Dieu a été glorifié en lui[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par lui ». L’expression grecque peut signifier que Dieu a été glorifié dans le Fils ou par son intermédiaire.
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Quand… alors
  rationale: « Quand » exprime la relation temporelle, tandis que « alors » restitue naturellement en français la progression narrative marquée par οὖν.
- source_word: ἐξῆλθεν
  choice: il fut sorti
  rationale: Le passé antérieur situe la sortie de Judas avant la parole de Jésus et conserve le mouvement spatial exprimé par ἐξέρχομαι.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel d’un récit écrit en français.
- source_word: Νῦν
  choice: Maintenant
  rationale: 'Ce terme conserve la portée temporelle et discursive de νῦν : la sortie qui vient d’avoir lieu marque le début du moment annoncé par Jésus.'
- source_word: ἐδοξάσθη
  choice: a été glorifié
  rationale: Le passé composé passif exprime un fait désormais accompli et pertinent au moment où Jésus parle, sans limiter la glorification à un seul événement.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette formulation reconnue conserve le titre employé par Jésus ainsi que ses résonances scripturaires, notamment avec Daniel 7.
- source_word: ὁ θεὸς
  choice: Dieu
  rationale: Traduction française directe et naturelle de θεός dans ce contexte.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Cette traduction conserve au plus près la valeur relationnelle ou locative de ἐν avec le datif, tout en laissant en note la possibilité d’un sens instrumental.
theological_decisions:
- issue: Portée de la glorification du Fils de l’homme
  choice: Les deux passifs sont traduits sans préciser si la glorification désigne exclusivement la croix, la résurrection, l’exaltation ou l’ensemble de ces événements.
  alternative: Limiter la déclaration soit à la crucifixion, soit à la résurrection et à l’exaltation.
  rationale: Le texte présente la glorification comme désormais engagée, mais n’en restreint pas explicitement la portée. La traduction préserve cette amplitude théologique.
- issue: Valeur de ἐν αὐτῷ
  choice: en lui
  alternative: par lui
  rationale: La préposition peut être comprise dans un sens relationnel ou instrumental. Le texte principal retient la formulation la plus proche du grec, et la note préserve l’autre lecture possible.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient à la narration écrite, tandis que le passé composé dans la parole de Jésus souligne la pertinence présente de la glorification annoncée. Le pronom « il » conserve la continuité avec le contexte précédent sans ajouter explicitement le nom de Judas.
