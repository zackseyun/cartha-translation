id: JHN.13.7
reference: John 13:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: fr
  text: 'Jésus lui répondit : « Ce que je fais, tu ne le sais pas maintenant[a], mais tu le comprendras après cela[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie ici un verbe souvent traduit par « savoir », puis un autre qui peut signifier « apprendre à connaître » ou, dans ce contexte, « comprendre ».
    reason: lexical_alternative
  - marker: b
    text: « Après cela » peut désigner la suite de cette scène ou, plus largement, des événements ultérieurs qui éclaireront le sens de l’acte de Jésus.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: lui répondit
  rationale: La formule grecque associe littéralement « répondit » et « dit ». En français narratif moderne, « lui répondit » exprime naturellement l’ensemble de la formule sans lourde répétition, tout en gardant le destinataire masculin indiqué par αὐτῷ.
- source_word: Ὃ ἐγὼ ποιῶ
  choice: Ce que je fais
  rationale: Rend naturellement la proposition relative grecque et le présent de l’action en cours, sans expliciter dans le verset qu’il s’agit du lavage des pieds.
- source_word: οὐκ οἶδας ἄρτι
  choice: tu ne le sais pas maintenant
  rationale: « Savoir » conserve la valeur courante de οἶδα et permet de faire entendre, en français, la différence avec le verbe suivant. « Maintenant » correspond directement à ἄρτι.
- source_word: γνώσῃ
  choice: tu le comprendras
  rationale: Dans ce contexte, le futur de γινώσκω annonce non une simple acquisition d’information, mais la compréhension ultérieure du sens de l’acte. Le choix distingue aussi les deux verbes grecs.
- source_word: δὲ
  choice: mais
  rationale: Marque clairement le contraste entre l’absence actuelle de connaissance et la compréhension future.
- source_word: μετὰ ταῦτα
  choice: après cela
  rationale: Expression française naturelle qui reste proche du repère temporel grec et n’en précise pas indûment la portée.
theological_decisions:
- issue: Portée temporelle de la compréhension promise
  choice: Conserver la formulation ouverte « après cela »
  alternative: Préciser « après le lavage des pieds », « après la résurrection » ou « lorsque l’Esprit sera venu »
  rationale: Le grec ne détermine pas à lui seul si Jésus vise la suite immédiate de la scène, les événements de sa mort et de sa résurrection, ou une compréhension ultérieure plus large. La traduction ne tranche donc pas entre ces possibilités.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond au singulier grec adressé à Pierre. La formule introductive grecque littérale « répondit et lui dit » est condensée en « lui répondit », tournure idiomatique qui évite une répétition peu naturelle. Les deux verbes de connaissance sont distingués par « savoir » et « comprendre ».
