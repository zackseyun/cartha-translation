  text: ⸀ἔβλεπον εἰς ἀλλήλους οἱ μαθηταὶ ἀπορούμενοι περὶ τίνος λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/022.yaml
  text: The disciples were looking at one another, at a loss about whom he was speaking.
translation:
  language: fr
  text: Les disciples se regardaient les uns les autres, ne sachant pas de qui il parlait.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβλεπον
  choice: se regardaient
  rationale: L’imparfait grec présente une action en cours ou répétée dans la scène. L’imparfait français « se regardaient » en conserve naturellement l’aspect duratif.
- source_word: εἰς ἀλλήλους
  choice: les uns les autres
  rationale: Avec le verbe regarder, cette expression réciproque rend clairement le mouvement mutuel des regards au sein du groupe.
- source_word: οἱ μαθηταὶ
  choice: Les disciples
  rationale: L’article désigne le groupe déjà connu dans le contexte. Il n’est pas nécessaire d’ajouter « ses », absent du grec.
- source_word: ἀπορούμενοι
  choice: ne sachant pas
  rationale: Le participe exprime l’incertitude et l’embarras. Dans cette construction, « ne sachant pas de qui » transmet ce sens avec naturel sans réduire la réaction à une simple interrogation.
- source_word: περὶ τίνος
  choice: de qui
  rationale: Après « parler », le français idiomatique emploie « de qui » pour désigner la personne dont il est question.
- source_word: λέγει
  choice: il parlait
  rationale: Le présent grec, intégré à un récit au passé et à une interrogation indirecte, se rend naturellement par l’imparfait français. « Parlait » conserve le sens verbal sans l’interpréter comme « voulait parler ».
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La phrase conserve le regard réciproque et l’incertitude des disciples dans une formulation fluide et digne.
