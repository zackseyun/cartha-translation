id: JHN.13.16
reference: John 13:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: fr
  text: 'En vérité, en vérité, je vous le dis : un esclave[a] n’est pas plus grand que son maître[b], ni un apôtre[c] n’est plus grand que celui qui l’a envoyé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le grec désigne une personne placée sous l’autorité d’un maître ; « esclave » exprime plus fortement cette relation sociale.
    reason: lexical_alternative
  - marker: b
    text: Ou « seigneur ». Ici, le mot grec est rendu selon son sens social dans la relation entre l’esclave et son maître.
    reason: lexical_alternative
  - marker: c
    text: Ou « envoyé » ; le mot grec peut désigner une personne envoyée avec une mission.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: En vérité, en vérité
  rationale: La formule solennelle redoublée caractéristique de Jean est conservée avec sa répétition et sa force, dans un français digne et immédiatement compréhensible.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure idiomatique française rend directement la formule de parole au présent; le pronom « le » est requis par l’usage naturel du français.
- source_word: δοῦλος
  choice: esclave
  rationale: Le contraste avec κύριος met en avant une relation de dépendance et d’autorité. « Esclave » préserve cette réalité sociale plus nettement que « serviteur ».
- source_word: μείζων
  choice: plus grand
  rationale: Le comparatif peut viser le rang, l’autorité ou l’importance. « Plus grand » conserve cette amplitude sans préciser indûment le type de supériorité.
- source_word: κύριος
  choice: maître
  rationale: Dans la comparaison sociale esclave-maître, « maître » exprime le sens contextuel de κύριος sans en faire ici un titre christologique explicite.
- source_word: ἀπόστολος
  choice: envoyé
  rationale: Le parallélisme avec « celui qui l’a envoyé » met au premier plan le sens général de personne mandatée. « Envoyé » est naturel en français et évite d’imposer le sens technique d’« apôtre », tout en le signalant en note.
- source_word: τοῦ πέμψαντος αὐτόν
  choice: celui qui l’a envoyé
  rationale: Cette formulation française rend naturellement le participe substantivé et maintient clairement le rapport entre l’envoyé et son mandant.
theological_decisions:
- issue: Sens de κύριος dans la comparaison
  choice: maître
  alternative: Seigneur
  rationale: Le contexte immédiat présente une relation sociale entre un esclave et son maître. « Seigneur » reste lexicalement possible, mais risquerait de transformer la comparaison en titre explicite alors que le grec ne l’exige pas ici.
- issue: Portée de ἀπόστολος
  choice: envoyé
  alternative: apôtre
  rationale: Le terme peut désigner soit un envoyé ou mandataire au sens général, soit un apôtre au sens plus établi. La proposition relative liée à l’envoi favorise ici le sens fonctionnel général; la note préserve l’autre lecture.
translation_notes:
  register: Français international moderne, naturel et digne. La cadence proverbiale et le parallélisme du grec sont conservés. L’ellipse du second « n’est pas » est idiomatique et resserre la formulation sans rien retrancher au sens.
