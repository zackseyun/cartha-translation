source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: fr
  text: 'Mes petits enfants, je suis encore avec vous pour peu de temps. Vous me chercherez et, comme je l’ai dit aux Juifs[a] : « Là où je vais, vous ne pouvez pas venir », je vous le dis maintenant, à vous aussi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Selon le contexte, l’expression peut aussi désigner plus précisément les responsables juifs ou les autorités juives de Judée.
    reason: alternative_reading
lexical_decisions:
- source_word: τεκνία
  choice: Mes petits enfants
  rationale: Le diminutif employé comme vocatif exprime une tendre affection et une relation familiale. En français, « Mes petits enfants » rend naturellement cette chaleur, même si le possessif est implicite dans la forme d’adresse plutôt qu’exprimé en grec.
- source_word: ἔτι μικρόν
  choice: encore avec vous pour peu de temps
  rationale: La tournure indique le peu de temps qui reste. Cette formulation française conserve à la fois ἔτι (« encore ») et la brièveté exprimée par μικρόν.
- source_word: ζητήσετέ με
  choice: Vous me chercherez
  rationale: Le futur de ζητέω signifie ici chercher quelqu’un. « Chercherez » est direct, naturel et laisse intacte la portée johannique du verbe.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: C’est le sens formel du terme grec. Le référent peut être plus restreint dans certains contextes johanniques, mais le verset lui-même ne justifie pas de remplacer d’emblée ce terme par « responsables juifs ».
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: Là où je vais
  rationale: ὑπάγω évoque ici le fait de partir ou d’aller ailleurs. « Là où je vais » est idiomatique et conserve la destination non précisée.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: vous ne pouvez pas venir
  rationale: Cette formulation française rend clairement l’impossibilité exprimée par δύνασθε, sans la transformer en interdiction ni préciser la nature de cette impossibilité.
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: je vous le dis maintenant à vous aussi
  rationale: La formulation fait ressortir le parallèle entre ce qui a déjà été dit aux Juifs et ce qui est désormais adressé aux disciples. « Aussi » explicite naturellement ce lien en français.
theological_decisions:
- issue: Portée du terme Ἰουδαίοις dans l’Évangile selon Jean
  choice: aux Juifs
  alternative: aux responsables juifs
  rationale: Le grec dit littéralement « aux Juifs ». Dans Jean, le mot peut parfois désigner plus précisément des autorités judéennes ou juives, mais rien dans ce verset ne permet d’imposer cette restriction. Le texte principal garde donc la désignation large et la note signale l’interprétation contextuelle possible.
- issue: Nature de l’impossibilité exprimée par οὐ δύνασθε ἐλθεῖν
  choice: vous ne pouvez pas venir
  alternative: vous n’êtes pas en mesure de venir
  rationale: Le texte affirme une incapacité sans en donner ici l’explication complète. La traduction ne la transforme ni en simple refus ni en interdiction, préservant ainsi la tension du passage.
translation_notes:
  register: Français international moderne, naturel et digne. L’adresse « Mes petits enfants » conserve la tendresse du diminutif grec sans ton infantilisant. La syntaxe maintient le parallèle rhétorique entre la parole antérieure adressée aux Juifs et celle maintenant adressée aux disciples.
