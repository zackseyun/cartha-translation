id: JHN.13.17
reference: John 13:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: fr
  text: Si vous savez ces choses, vous êtes heureux[a] si vous les mettez en pratique.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « bénis », « bienheureux » ou « favorisés ». Le mot grec désigne une condition favorable et épanouie, et non simplement le fait d’éprouver du bonheur.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Si
  rationale: Introduit directement la première proposition conditionnelle, conformément à la syntaxe grecque.
- source_word: ταῦτα
  choice: ces choses
  rationale: Conserve le pluriel neutre et renvoie à l’exemple ainsi qu’à l’enseignement donnés juste avant par Jésus.
- source_word: οἴδατε
  choice: vous savez
  rationale: Rend directement l’idée de connaissance exprimée par οἶδα, sans préciser davantage « comprendre ».
- source_word: μακάριοι
  choice: heureux
  rationale: Dans la langue biblique française, « heureux » peut désigner la condition favorable de quelqu’un, et non une simple émotion; la note explicite cette portée.
- source_word: ἐὰν
  choice: à condition de
  rationale: Distingue naturellement en français la condition décisive de la simple connaissance et met en évidence le caractère contingent de l’action, sans l’intensifier.
- source_word: ποιῆτε αὐτά
  choice: les mettre en pratique
  rationale: Dans ce contexte d’enseignement et d’exemple à suivre, cette expression française naturelle rend l’action concrète impliquée par ποιέω et reprend clairement « ces choses ».
theological_decisions:
- issue: Portée de μακάριοι dans le contexte de la mise en pratique de l’enseignement
  choice: heureux
  alternative: bénis; bienheureux; favorisés
  rationale: « Heureux » est actuel, digne et traditionnel dans les déclarations de type béatitude. Il préserve l’idée d’une condition enviable ou favorable, tandis que la note empêche de la réduire à un sentiment passager.
- issue: Rapport entre connaissance et action
  choice: « à condition de » pour ἐὰν
  alternative: « si »
  rationale: 'La formulation conserve la tension du grec: connaître ne suffit pas; l’état déclaré dépend de la mise en pratique. Elle n’ajoute aucune explication doctrinale sur la nature de cette bénédiction.'
translation_notes:
  register: Français international moderne, clair et digne. La répétition grecque de deux conditions est rendue par « Si » puis « à condition de », tournure plus naturelle en français tout en conservant leur distinction logique.
