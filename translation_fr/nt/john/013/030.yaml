  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: fr
  text: Alors, après avoir pris le morceau de pain[a], il sortit aussitôt. Et il faisait nuit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la bouchée » ou « le morceau ». Le grec ψωμίον désigne un petit morceau de pain ou de nourriture donné pendant le repas.
    reason: lexical_alternative
  - marker: b
    text: La mention de la nuit indique littéralement le moment de la scène ; elle peut aussi faire écho au thème de la lumière et des ténèbres dans cet Évangile.
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν οὖν
  choice: Alors, après avoir pris
  rationale: Le participe aoriste exprime ici une action antérieure à la sortie, tandis que οὖν fait progresser le récit. Cette formulation restitue naturellement en français la succession des actions.
- source_word: τὸ ψωμίον
  choice: le morceau de pain
  rationale: Le diminutif ψωμίον désigne un petit morceau de pain ou de nourriture servi pendant le repas. « Le morceau de pain » est concret, clair et actuel.
- source_word: ἐκεῖνος
  choice: celui-là
  rationale: Le démonstratif est plus appuyé qu’un simple pronom personnel et attire l’attention sur Judas sans ajouter son nom au texte.
- source_word: ἐξῆλθεν εὐθύς
  choice: sortit aussitôt
  rationale: « Sortit » conserve le mouvement spatial de ἐξέρχομαι, et « aussitôt » exprime avec concision l’immédiateté indiquée par εὐθύς.
- source_word: ἦν δὲ νύξ
  choice: Et il faisait nuit
  rationale: Cette tournure française naturelle garde la simplicité de l’indication temporelle et sa force littéraire, sans expliciter une éventuelle portée symbolique.
theological_decisions:
- issue: Portée éventuellement symbolique de la nuit dans l’Évangile selon Jean
  choice: 'Conserver dans le texte principal la simple indication temporelle : « Et il faisait nuit. »'
  alternative: Expliciter la nuit comme symbole des ténèbres spirituelles.
  rationale: La phrase grecque énonce directement une circonstance temporelle. Le motif johannique de la lumière et des ténèbres peut donner à cette mention une résonance supplémentaire, mais la traduction ne doit pas imposer cette interprétation.
- issue: Valeur emphatique de ἐκεῖνος appliqué à Judas
  choice: Rendre le démonstratif par « celui-là » plutôt que par « il ».
  alternative: Employer le simple pronom « il » pour un français plus fluide.
  rationale: « Celui-là » préserve la mise en relief et la légère prise de distance du grec, sans ajouter d’identification absente de ce verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste fluide tout en conservant l’emphase inhabituelle du démonstratif grec et la sobriété de la dernière phrase.
