  naturalness: « Alors, après avoir pris le morceau de pain, il sortit aussitôt. Et il faisait nuit. » est fluide, sobre et adapté à un français international moderne. La suppression de « celui-là » évite une tournure inutilement heurtée et connotée.
  terminology: « morceau de pain », « sortit aussitôt » et « il faisait nuit » sont exacts et naturels. La note sur ψωμίον conserve utilement les possibilités « bouchée » et « morceau ». La portée symbolique possible de la nuit est correctement maintenue en note, sans être introduite dans le texte.
