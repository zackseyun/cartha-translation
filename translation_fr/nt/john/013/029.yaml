id: JHN.13.29
reference: John 13:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: fr
  text: 'En effet, certains pensaient que, puisque Judas avait la bourse[a], Jésus lui disait : « Achète ce dont nous avons besoin pour la fête[b] », ou qu’il lui demandait de donner quelque chose aux pauvres.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la caisse ». Le terme grec désigne le contenant où étaient gardés les fonds du groupe.
    reason: lexical_alternative
  - marker: b
    text: Dans cette section, « la fête » désigne la fête de la Pâque.
    reason: cross_reference
lexical_decisions:
- source_word: τινὲς
  choice: certains
  rationale: Désigne de manière indéfinie quelques personnes parmi celles qui étaient présentes.
- source_word: ἐδόκουν
  choice: pensaient
  rationale: L’imparfait grec présente leur compréhension de la situation dans le déroulement du récit ; « pensaient » est naturel et n’ajoute aucune certitude.
- source_word: ἐπεὶ
  choice: puisque
  rationale: 'Introduit la raison de leur supposition : Judas avait la garde de la bourse.'
- source_word: γλωσσόκομον
  choice: bourse
  rationale: Dans ce contexte, le terme désigne le contenant où étaient gardés les fonds communs du groupe. « Bourse » est idiomatique en français, sans préciser indûment la forme du contenant.
- source_word: εἶχεν
  choice: avait
  rationale: Conserve le sens simple du verbe grec ; le contexte fait comprendre que Judas détenait ou gardait la bourse.
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: Jésus lui disait
  rationale: Le présent historique grec est rendu naturellement par l’imparfait dans ce récit et s’intègre à ce que certains pensaient entendre.
- source_word: Ἀγόρασον
  choice: Achète
  rationale: Impératif direct, courant et fidèle au grec.
- source_word: ὧν χρείαν ἔχομεν
  choice: ce dont nous avons besoin
  rationale: Rend naturellement en français la construction relative grecque sans en modifier le contenu.
- source_word: εἰς τὴν ἑορτήν
  choice: pour la fête
  rationale: Le nom grec désigne une fête religieuse. Le contexte est celui de la Pâque, mais le verset ne la nomme pas explicitement.
- source_word: τοῖς πτωχοῖς
  choice: aux pauvres
  rationale: Rend directement l’adjectif substantivé grec désignant les personnes pauvres.
- source_word: ἵνα τι δῷ
  choice: qu’il lui demandait de donner quelque chose
  rationale: Explicite en français le second contenu supposé des paroles de Jésus tout en conservant l’idée d’une action demandée à Judas.
theological_decisions: []
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve les deux interprétations envisagées par certains convives, sans préciser davantage la forme de la bourse ni remplacer dans le texte « la fête » par « la Pâque ».
