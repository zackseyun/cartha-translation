  text: νεύει οὖν τούτῳ Σίμων Πέτρος ⸂πυθέσθαι τίς ἂν εἴη⸃ περὶ οὗ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: fr
  text: Simon Pierre lui fait donc signe de demander de qui Jésus parle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεύει
  choice: fait signe
  rationale: Le verbe désigne un signe ou un geste non verbal. « Fait signe » est naturel en français et évite de préciser sans preuve qu’il s’agit d’un hochement de tête.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque ici la conséquence narrative de la déclaration précédente.
- source_word: τούτῳ
  choice: lui
  rationale: Le démonstratif renvoie au disciple qui vient d’être mentionné. Le pronom « lui » est la reprise la plus naturelle en français, sans ajouter une identification absente du verset.
- source_word: πυθέσθαι
  choice: de demander
  rationale: L’infinitif indique ce que Pierre invite le disciple à faire; « demander » exprime clairement cette valeur en français courant.
- source_word: τίς ἂν εἴη
  choice: de qui
  rationale: Dans cette interrogation indirecte, la tournure grecque exprime une identité encore inconnue. Le français idiomatique « de qui » conserve cette indétermination sans la formulation lourde « qui cela pourrait être ».
- source_word: περὶ οὗ λέγει
  choice: Jésus veut parler
  rationale: La proposition signifie littéralement « au sujet de qui il parle ». Dans ce contexte, « de qui Jésus veut parler » est une formulation française naturelle; le nom explicite le référent du sujet sans ambiguïté.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et narratif. La formulation privilégie une syntaxe naturelle tout en conservant le geste non verbal de Pierre et l’identité indéterminée de la personne visée.
