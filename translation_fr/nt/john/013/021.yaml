source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: fr
  text: 'Après avoir dit ces choses, Jésus fut troublé en son esprit ; il témoigna et dit : « En vérité, en vérité, je vous le dis : l’un de vous me trahira[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « me livrera ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Après avoir dit cela
  rationale: Le participe aoriste exprime ici naturellement l’antériorité. Cette formulation française est fluide et conserve la succession des faits.
- source_word: ἐταράχθη τῷ πνεύματι
  choice: fut troublé dans son esprit
  rationale: Le verbe décrit une agitation ou une détresse intérieure, tandis que le datif précise le domaine où elle se manifeste. La traduction n’ajoute aucun degré d’intensité absent du grec.
- source_word: ἐμαρτύρησεν καὶ εἶπεν
  choice: 'Il rendit ce témoignage :'
  rationale: Cette tournure française naturelle conserve le vocabulaire johannique du témoignage et la solennité de la déclaration, sans reproduire lourdement la coordination grecque.
- source_word: Ἀμὴν ἀμὴν
  choice: En vérité, en vérité
  rationale: La répétition caractéristique des déclarations solennelles de Jésus dans Jean est conservée, dans une formulation française digne et aisément comprise.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette formulation directe et consacrée en français respecte le verbe λέγω et le pronom au datif.
- source_word: εἷς ἐξ ὑμῶν
  choice: l’un de vous
  rationale: C’est l’équivalent français naturel de l’expression partitive, qui maintient la force du fait que le traître appartient au groupe présent.
- source_word: παραδώσει με
  choice: me trahira
  rationale: Dans ce contexte, παραδίδωμι désigne la livraison traîtresse de Jésus par un disciple. « Trahira » en communique clairement la portée, tandis que le sens plus littéral est conservé en note.
theological_decisions:
- issue: La nature du trouble intérieur de Jésus
  choice: fut troublé dans son esprit
  alternative: fut profondément troublé en esprit
  rationale: La traduction laisse pleinement apparaître le trouble réel de Jésus sans en atténuer l’humanité ni lui ajouter une intensité que le texte n’explicite pas.
- issue: Le sens de παραδίδωμι dans l’annonce de la trahison
  choice: me trahira
  alternative: me livrera
  rationale: Le contexte donne à l’acte la valeur d’une trahison, mais le verbe grec signifie aussi concrètement « livrer » ou « remettre ». La note préserve cette dimension sans obscurcir le sens immédiat.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve la répétition solennelle « En vérité, en vérité » ainsi que le motif johannique du témoignage, tout en évitant les tournures inutilement lourdes.
