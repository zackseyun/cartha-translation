  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: fr
  text: Un de ses disciples, celui que Jésus aimait, était allongé à table tout près de Jésus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « dans le sein de Jésus ». Cette expression décrit la position d’une personne allongée à table juste à côté d’une autre.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακείμενος
  choice: était allongé à table
  rationale: Le participe décrit la posture adoptée pour prendre un repas dans l’Antiquité. Cette formulation rend à la fois la position allongée et le contexte du repas.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: Un de ses disciples
  rationale: Formulation partitive directe, exacte et naturelle en français moderne.
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: tout près de Jésus
  rationale: Dans le contexte d’un repas pris en position allongée, l’expression situe le disciple immédiatement à côté de Jésus. La traduction évite l’image trompeuse que pourrait susciter un littéralisme tel que « dans le sein de Jésus », tout en conservant celui-ci en note.
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: celui que Jésus aimait
  rationale: Cette tournure rend directement la proposition relative et préserve le sens ordinaire de ἀγαπάω, « aimer ».
theological_decisions:
- issue: La position du disciple que Jésus aimait par rapport à Jésus
  choice: tout près de Jésus
  alternative: dans le sein de Jésus
  rationale: L’expression décrit d’abord la disposition des convives lors du repas plutôt qu’une union mystique. La traduction principale communique clairement la proximité physique, tandis que la note préserve l’image grecque et sa possible résonance johannique.
translation_notes:
  register: Français international moderne, naturel et digne. « Était allongé à table » explicite sans lourdeur la posture antique; « tout près de Jésus » rend l’organisation du repas sans produire une image moderne trompeuse.
