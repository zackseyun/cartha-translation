  source_fidelity: 'Le texte rend fidèlement les quatre éléments grecs : le partitif (« Un de ses disciples »), la posture de repas (« était allongé à table »), la proximité exprimée par ἐν τῷ κόλπῳ (« tout près de Jésus ») et la relative « celui que Jésus aimait ». La note conserve explicitement le sens littéral de κόλπος et explique correctement son emploi dans le contexte d’un repas en position allongée.'
