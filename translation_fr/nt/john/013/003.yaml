  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: fr
  text: Jésus, sachant que le Père avait tout remis entre ses mains, qu’il était venu de Dieu[a] et qu’il allait vers Dieu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il était sorti de Dieu ».'
    reason: lexical_alternative
  - marker: b
    text: 'Le contexte permet aussi de comprendre : « qu’il retournait vers Dieu » ; le grec dit simplement : « qu’il allait vers Dieu ».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: sachant
  rationale: Le participe introduit la circonstance qui éclaire l’action suivante. « Sachant » est naturel en français et conserve cette valeur de contexte sans surinterpréter l’aspect verbal.
- source_word: πάντα
  choice: tout
  rationale: Le neutre pluriel a ici une portée globale. « Tout » l’exprime clairement et plus naturellement en français moderne que « toutes choses ».
- source_word: ἔδωκεν
  choice: avait remis
  rationale: Le plus-que-parfait marque une action accomplie antérieurement à la scène. « Remettre entre les mains » exprime à la fois le don et la charge confiée.
- source_word: εἰς τὰς χεῖρας
  choice: entre ses mains
  rationale: Cette expression française conserve l’image concrète des mains ainsi que son sens idiomatique d’autorité et de responsabilité confiées.
- source_word: ὁ πατὴρ
  choice: le Père
  rationale: Le grec porte l’article sans possessif explicite. Le titre « le Père » préserve la formulation johannique.
- source_word: ἀπὸ θεοῦ
  choice: de Dieu
  rationale: La formulation traduit directement l’origine indiquée par le grec, sans remplacer « Dieu » par « le Père ».
- source_word: ἐξῆλθεν
  choice: était venu
  rationale: Dans ce contexte johannique, le verbe exprime l’origine et la venue. « Était venu » est idiomatique, tandis que l’alternative plus littérale est signalée en note.
- source_word: πρὸς τὸν θεὸν
  choice: vers Dieu
  rationale: « Vers Dieu » rend directement le mouvement exprimé par πρός sans ajouter explicitement l’idée d’un retour.
- source_word: ὑπάγει
  choice: allait
  rationale: L’imparfait français rend naturellement le présent grec dans ce cadre narratif et exprime un départ en cours ou imminent.
theological_decisions:
- issue: Le langage christologique d’origine dans ἀπὸ θεοῦ ἐξῆλθεν
  choice: était venu de Dieu
  alternative: était sorti de Dieu
  rationale: Le choix principal exprime clairement l’origine et la mission de Jésus dans un français naturel, sans imposer une formulation doctrinale postérieure. La note conserve la valeur plus concrète possible du verbe grec.
- issue: La destination exprimée par πρὸς τὸν θεὸν ὑπάγει
  choice: allait vers Dieu
  alternative: retournait vers Dieu
  rationale: Le contexte suggère un retour, mais le grec de cette proposition dit simplement que Jésus va vers Dieu. Le texte principal évite donc d’expliciter ce que le contexte permet seulement d’inférer.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase demeure ouverte, comme dans le grec, car elle introduit l’action du verset suivant. L’expression « entre ses mains » conserve la métaphore biblique tout en restant immédiatement compréhensible.
