source:
  edition: SBLGNT
  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: fr
  text: 'Après leur avoir lavé les pieds, Jésus reprit donc ses vêtements et se remit à table[a]. Il leur dit de nouveau : « Comprenez-vous ce que j’ai fait pour vous[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « se rallongea à table » ; à l’époque, les convives prenaient habituellement leurs repas étendus sur le côté.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ce que je vous ai fait », c’est-à-dire « ce que j’ai fait à votre égard ». Le grec peut exprimer ici aussi bien « pour vous » que « à vous ».'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: Après… donc
  rationale: La tournure française avec « après » exprime naturellement l’antériorité de la proposition temporelle, tandis que « donc » conserve la progression narrative marquée par οὖν.
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: leur avoir lavé les pieds
  rationale: Rendu idiomatique du verbe et du complément possessif ; l’infinitif passé marque l’action achevée avant la suite.
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: reprit ses vêtements
  rationale: Dans le contexte, Jésus reprend les vêtements qu’il avait déposés. « Vêtements » reste lexicalement plus sobre que « vêtements de dessus », et « reprit » rend ici naturellement ἔλαβεν sans ajouter explicitement qu’il les enfila.
- source_word: ἀνέπεσεν
  choice: se remit à table
  rationale: En contexte de repas, le verbe désigne le fait de reprendre sa place en position allongée à table. Cette formulation est naturelle en français moderne ; une note préserve la posture historique précise.
- source_word: πάλιν
  choice: se remit
  rationale: Le préfixe français « re- » exprime naturellement la répétition indiquée par πάλιν.
- source_word: εἶπεν αὐτοῖς
  choice: il leur dit
  rationale: Équivalent français direct et idiomatique.
- source_word: Γινώσκετε
  choice: Comprenez-vous
  rationale: La question porte sur la signification du geste, non sur sa simple constatation ; « comprendre » exprime donc le sens contextuel de γινώσκω.
- source_word: τί πεποίηκα ὑμῖν
  choice: ce que j’ai fait pour vous
  rationale: Le passé composé conserve la pertinence présente du parfait grec. « Pour vous » exprime bien la nuance bénéficiaire probable du datif, tandis que la note signale l’autre rendu possible.
theological_decisions:
- issue: Posture de Jésus après le lavement des pieds
  choice: se remit à table
  alternative: s’allongea de nouveau à table
  rationale: Le texte évoque la manière antique de prendre le repas, en position allongée. Le texte principal privilégie une expression française naturelle, et la note conserve le détail historique sans transformer ce point en enjeu doctrinal.
- issue: Valeur du datif ὑμῖν
  choice: pour vous
  alternative: à vous
  rationale: Le contexte de service favorise une nuance bénéficiaire, mais le datif grec permet aussi un rendu plus neutre par « à vous ». La note maintient cette ambiguïté réelle.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre de la phrase évite une longue succession de participes, explicite Jésus comme sujet pour la clarté et conserve les nuances historiques et grammaticales pertinentes en notes.
