  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: fr
  text: 'Jésus répond : « C’est celui à qui je donnerai le morceau de pain après l’avoir trempé. » Après avoir trempé le morceau de pain, il le donne alors à Judas, fils de Simon l’Iscariote.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Judas l’Iscariote, fils de Simon ». La formulation grecque peut se comprendre des deux façons.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: répond
  rationale: Le présent de narration grec est conservé par un présent français naturel, qui maintient la vivacité du récit.
- source_word: Ἐκεῖνός ἐστιν
  choice: C’est celui
  rationale: Cette formulation identifie naturellement une personne en français sans alourdir la phrase.
- source_word: ᾧ
  choice: pour qui… et à qui
  rationale: 'Le datif se rattache sémantiquement aux deux actions : le pain est trempé pour cette personne, puis donné à cette personne. La reprise rend la construction claire en français.'
- source_word: βάψω
  choice: je vais tremper
  rationale: Le futur grec est explicitement rendu. « Tremper » convient à un aliment et n’introduit aucune connotation rituelle.
- source_word: ψωμίον
  choice: morceau de pain
  rationale: Le diminutif désigne ici un petit morceau de pain ou de nourriture ; cette expression est claire et courante.
- source_word: καὶ δώσω αὐτῷ
  choice: et à qui je le donnerai
  rationale: Le pronom « le » reprend le morceau de pain, tandis que « à qui » exprime clairement le destinataire.
- source_word: βάψας οὖν
  choice: Après avoir trempé… donc
  rationale: « Après avoir » marque l’antériorité du participe aoriste ; « donc » restitue la valeur inférentielle ou consécutive de οὖν dans un ordre naturel en français.
- source_word: δίδωσιν
  choice: il le donne
  rationale: Le présent historique grec est conservé en français, en accord avec « répond ».
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: à Judas, fils de Simon l’Iscariote
  rationale: Cette traduction suit la relation génitive immédiate, selon laquelle « l’Iscariote » peut qualifier Simon, tout en signalant l’autre analyse possible en note.
theological_decisions:
- issue: Identification de Judas dans la proposition finale
  choice: « Judas, fils de Simon l’Iscariote »
  alternative: « Judas l’Iscariote, fils de Simon »
  rationale: La construction grecque Σίμωνος Ἰσκαριώτου permet de comprendre directement « de Simon l’Iscariote », mais l’épithète peut aussi être rattachée à Judas conformément à son appellation habituelle. Le texte principal suit l’enchaînement syntaxique immédiat et la note préserve l’ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent de narration est maintenu. La phrase évite le calque peu naturel « celui à qui je tremperai » et explicite les rapports distincts avec les verbes « tremper » et « donner ».
