review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : Jésus donne un exemple en vue d’une action correspondante des disciples. « Pour vous » est contextuellement défendable pour le datif ὑμῖν, mais celui-ci demeure assez ouvert pour justifier une alternative moins explicitement bénéficiaire.'
  naturalness: La formulation « comme moi j’ai fait pour vous » n’est pas idiomatique en français moderne. Après « comme », le français emploie naturellement « comme j’ai fait » ou, plus explicitement, « comme je l’ai fait ». Le déplacement de « vous aussi » avant le verbe rend aussi la correspondance plus fluide.
  terminology: « Exemple », « Car », « afin que » et le subjonctif « fassiez » conviennent au registre biblique moderne et rendent correctement les éléments grecs pertinents. La note doit présenter l’alternative du datif sans substituer un verbe interprétatif tel que « agir ».
  issues:
