    issue: 'Tournure française non idiomatique : « comme moi j’ai fait pour vous »'
    rationale: Le pronom tonique « moi » n’est pas requis ici et produit une construction maladroite. « Comme j’ai fait pour vous » conserve la comparaison καθὼς et le sens du grec de façon naturelle.
  - severity: low
    issue: Note b insuffisamment proche de l’alternative syntaxique
    rationale: « J’ai agi envers vous » change le verbe général ποιέω en « agir ». « Comme je l’ai fait à votre égard » maintient mieux le verbe « faire » tout en signalant une lecture non bénéficiaire du datif.
