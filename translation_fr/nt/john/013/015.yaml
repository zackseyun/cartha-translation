id: JHN.13.15
reference: John 13:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: fr
  text: Car je vous ai donné un exemple[a] afin que vous aussi, vous fassiez comme j’ai fait pour vous[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un modèle » ou « un exemple à suivre ».
    reason: lexical_alternative
  - marker: b
    text: Ou « comme je l’ai fait à votre égard ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: un exemple
  rationale: Le nom désigne un exemple, un modèle ou un schéma proposé à l’imitation. « Un exemple » est naturel en français actuel et convient au geste que Jésus vient d’accomplir.
- source_word: γὰρ
  choice: Car
  rationale: La conjonction introduit l’explication du geste et de l’enseignement précédents; « Car » en conserve clairement le lien logique.
- source_word: ἔδωκα
  choice: j’ai donné
  rationale: Le passé composé rend naturellement en français l’aoriste grec pour un acte tout juste accompli dont la portée demeure présente.
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure exprime nettement le but sans réduire la proposition à un simple commandement direct.
- source_word: καθὼς
  choice: comme
  rationale: « Comme » exprime naturellement la correspondance entre l’action de Jésus et celle attendue des disciples; la construction française rend inutile l’ajout de « exactement ».
- source_word: ἐποίησα ὑμῖν
  choice: j’ai fait pour vous
  rationale: Le verbe est général (« faire ») et le datif ὑμῖν peut, dans ce contexte de service, recevoir une nuance bénéficiaire. La note conserve l’autre possibilité formelle.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: Cette formulation française naturelle conserve l’inclusion emphatique des disciples dans l’action correspondante.
- source_word: ποιῆτε
  choice: vous fassiez
  rationale: Le subjonctif français exigé après « afin que » rend correctement le subjonctif grec dans la proposition de but, tout en laissant le contexte porter la force éthique.
theological_decisions:
- issue: Portée de l’exemple donné par Jésus
  choice: Présenter le geste de Jésus comme un exemple que les disciples doivent imiter, sans préciser davantage la forme de cette imitation.
  alternative: Interpréter explicitement le verset soit comme l’institution universelle d’un rite de lavement des pieds, soit comme un symbole sans imitation concrète requise.
  rationale: Le texte affirme une correspondance entre ce que Jésus a fait et ce que les disciples doivent faire, mais ne tranche pas à lui seul la question de la ritualisation universelle du geste.
- issue: Valeur du datif ὑμῖν après ἐποίησα
  choice: Retenir dans le texte « pour vous », qui convient au service rendu dans le contexte, tout en signalant « à vous » en note.
  alternative: Traduire directement « à vous » afin de reproduire plus formellement le datif sans expliciter une nuance bénéficiaire.
  rationale: Le contexte immédiat autorise la lecture bénéficiaire, mais la forme grecque reste assez ouverte pour que l’alternative mérite d’être conservée.
translation_notes:
  register: Français international moderne, simple et digne. L’ordre « vous fassiez, vous aussi » évite la tournure incomplète « vous fassiez aussi » et garde l’accent sur la participation des disciples. Le passé composé convient à une action récente dont les conséquences demeurent.
