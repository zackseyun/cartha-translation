  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: fr
  text: 'En vérité, en vérité, je vous le dis : quiconque reçoit quelqu’un que j’enverrai me reçoit ; et quiconque me reçoit reçoit celui qui m’a envoyé.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Oui, vraiment
  rationale: Rend la formule solennelle et emphatique propre à Jésus dans un français actuel et digne. La tournure évite le peu naturel « vraiment, vraiment » tout en gardant l’insistance du redoublement.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formule idiomatique qui conserve le caractère déclaratif et solennel de l’expression johannique.
- source_word: ὁ λαμβάνων
  choice: celui qui reçoit
  rationale: Le participe substantivé a une portée générale. Cette formulation française est naturelle et n’impose aucune restriction au sexe masculin malgré le genre grammatical.
- source_word: ἄν τινα πέμψω
  choice: toute personne que j’enverrai
  rationale: 'Le pronom indéfini avec ἄν et le subjonctif exprime une portée ouverte : n’importe quelle personne que Jésus pourra envoyer. « Toute personne » rend cette indétermination sans lourdeur.'
- source_word: λαμβάνει
  choice: reçoit
  rationale: Conserve la répétition lexicale qui structure la chaîne de représentation entre l’envoyé, Jésus et celui qui l’a envoyé. « Accueille » serait possible, mais limiterait davantage le sens à l’accueil.
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: et celui qui me reçoit
  rationale: δέ est ici légèrement continuatif plutôt que fortement adversatif ; « et » soutient le parallélisme ascendant.
- source_word: τὸν πέμψαντά με
  choice: celui qui m’a envoyé
  rationale: Rend directement le participe aoriste et préserve la désignation relationnelle du texte sans ajouter explicitement « le Père ».
theological_decisions:
- issue: Identification de « celui qui m’a envoyé »
  choice: celui qui m’a envoyé
  alternative: le Père qui m’a envoyé
  rationale: Dans le contexte johannique, l’expression désigne le Père, mais ce verset emploie une désignation relationnelle. La traduction conserve cette formulation sans explicitation doctrinale dans le corps du texte.
- issue: Portée des participes masculins génériques
  choice: celui qui reçoit
  alternative: quiconque reçoit
  rationale: Le masculin est grammatical et générique, non réservé aux hommes. « Celui qui » est une formulation générique courante en français et maintient le parallélisme du verset.
- issue: Chaîne de représentation entre l’envoyé, Jésus et son envoyeur
  choice: répétition de « reçoit »
  alternative: variation entre « accueille » et « reçoit »
  rationale: La répétition maintient le lien théologique et rhétorique précis établi par le même verbe grec à chaque étape.
translation_notes:
  register: Français international moderne, clair et digne. La ponctuation met en relief la déclaration solennelle. Le texte conserve le parallélisme et la répétition essentiels du grec sans ajouter d’explication contextuelle au verset.
