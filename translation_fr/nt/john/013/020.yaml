review_pass:
  verdict: revise
  source_fidelity: 'La chaîne répétée de λαμβάνει (« reçoit ») et la désignation non explicitée « celui qui m’a envoyé » sont bien rendues. En revanche, « Oui, vraiment » ne restitue pas adéquatement la formule solennelle redoublée ἀμὴν ἀμὴν : « oui » introduit une nuance d’assentiment absente du grec et atténue le redoublement. « Toute personne » peut aussi se lire comme une totalité distributive plutôt que comme l’indéfini ouvert τινα avec ἄν.'
  naturalness: Le reste de la phrase est fluide et d’un registre moderne, clair et digne. « En vérité, en vérité, je vous le dis » demeure une formule française naturelle dans ce registre et rend explicitement l’emphase double.
  terminology: Conserver « reçoit » aux trois occurrences est juste. « Quiconque » exprime naturellement la portée générique de l’articulaire participial sans restriction de sexe grammatical. « Quelqu’un que j’enverrai » conserve l’indéfini personnel et l’ouverture de la construction grecque.
  issues:
  - severity: medium
    issue: Rendu de ἀμὴν ἀμὴν par « Oui, vraiment »
    rationale: La formule grecque est une affirmation solennelle redoublée, non une réponse affirmative. « Oui » ajoute une valeur pragmatique qui n’est pas dans le texte, tandis que la suppression du second équivalent affaiblit l’emphase.
  - severity: low
    issue: Rendu de ἄν τινα πέμψω par « toute personne que j’enverrai »
    rationale: « Toute personne » peut suggérer « chaque personne » plutôt que l’indéfini ouvert « quelqu’un/quiconque que j’enverrai ». Une formulation avec « quelqu’un » conserve plus directement cette portée.
  revised_text: 'En vérité, en vérité, je vous le dis : quiconque reçoit quelqu’un que j’enverrai me reçoit ; et quiconque me reçoit reçoit celui qui m’a envoyé.'
