  to: 'En vérité, en vérité, je vous le dis : quiconque reçoit quelqu’un que j’enverrai me reçoit ; et quiconque me reçoit reçoit celui qui m’a envoyé.'
  rationale: La révision restaure la formule johannique emphatique en deux temps, maintient la répétition de « reçoit » et préserve l’expression relationnelle concernant celui qui a envoyé Jésus. Elle rend également l’indéfini τινα sans lui donner une portée distributive plus forte que celle du grec.
