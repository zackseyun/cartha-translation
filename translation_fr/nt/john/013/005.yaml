  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: fr
  text: Puis il verse de l’eau dans la bassine[a] et se met à laver les pieds des disciples et à les essuyer avec le linge qu’il portait noué autour de la taille.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le bassin ». Le terme grec désigne un récipient utilisé pour se laver.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « avec lequel il était ceint » : il portait ce linge noué autour de lui pour le service.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: Puis
  rationale: Marque naturellement la succession des actions dans un récit en français moderne.
- source_word: βάλλει ὕδωρ
  choice: il verse de l’eau
  rationale: Dans ce contexte, βάλλω désigne idiomatiquement le fait de verser ou mettre de l’eau dans un récipient.
- source_word: εἰς τὸν νιπτῆρα
  choice: dans la bassine
  rationale: νιπτήρ désigne un récipient destiné au lavage; « bassine » est clair, courant et adapté au contexte.
- source_word: ἤρξατο νίπτειν
  choice: se met à laver
  rationale: Rend l’entrée dans l’action exprimée par ἤρξατο avec un tour narratif français naturel.
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: les pieds des disciples
  rationale: Conserve directement la relation génitive du grec dans une formulation française fluide.
- source_word: ἐκμάσσειν
  choice: à les essuyer
  rationale: Le verbe désigne l’action d’essuyer, pouvant avoir pour effet de sécher; le pronom reprend naturellement « les pieds ».
- source_word: τῷ λεντίῳ
  choice: avec le linge
  rationale: λέντιον désigne une pièce de tissu servant ici à essuyer; « linge » évite l’association moderne trop étroite de « serviette ».
- source_word: ᾧ ἦν διεζωσμένος
  choice: qu’il avait noué autour de la taille
  rationale: Exprime clairement l’idée de s’être ceint d’un linge, sans recourir à l’archaïsme « dont il était ceint ».
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le présent historique de βάλλει est conservé par « il verse », tandis que l’aoriste ἤρξατο est rendu par « se met à », ce qui maintient le mouvement aspectuel du grec. Les marqueurs de notes sont placés immédiatement après les expressions concernées.
