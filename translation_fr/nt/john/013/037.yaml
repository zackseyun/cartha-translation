id: JHN.13.37
reference: John 13:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: fr
  text: 'Pierre lui dit : « Seigneur, pourquoi ne puis-je pas te suivre maintenant ? Je donnerai ma vie[a] pour toi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « mon âme » ; dans cette expression, le mot grec désigne la vie.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent français « dit », naturel dans le récit et fidèle à la vivacité de la narration johannique.
- source_word: Κύριε
  choice: Seigneur
  rationale: Ce terme d’adresse exprime le respect et conserve la possible portée théologique de κύριος sans la préciser excessivement.
- source_word: διὰ τί οὐ δύναμαί
  choice: pourquoi ne puis-je pas
  rationale: Cette formulation interrogative est naturelle en français soutenu et restitue directement l’idée d’incapacité exprimée par δύναμαι.
- source_word: σοι ἀκολουθῆσαι
  choice: te suivre
  rationale: « Suivre » préserve à la fois le sens de déplacement et la résonance de l’engagement du disciple dans l’Évangile selon Jean.
- source_word: ἄρτι
  choice: maintenant
  rationale: « Maintenant » rend simplement et précisément l’immédiateté temporelle de l’adverbe.
- source_word: τὴν ψυχήν μου
  choice: ma vie
  rationale: Dans cette tournure, ψυχή désigne la vie que quelqu’un accepte de perdre en mourant, et non l’âme envisagée séparément du corps.
- source_word: ὑπὲρ σοῦ
  choice: pour toi
  rationale: 'Cette expression française naturelle laisse ouverte la nuance exacte de ὑπέρ : en faveur de quelqu’un, pour son bien ou à sa place.'
- source_word: θήσω
  choice: Je donnerai
  rationale: Avec « ma vie », « donner » exprime naturellement en français l’idée idiomatique de renoncer volontairement à sa vie, portée ici par τίθημι.
theological_decisions:
- issue: Sens de ψυχή dans la déclaration de Pierre
  choice: « ma vie »
  alternative: « mon âme »
  rationale: Le contexte évoque la volonté de Pierre de mourir pour Jésus. « Mon âme » introduirait en français une distinction métaphysique que la tournure grecque n’exige pas.
- issue: Portée de ἀκολουθέω
  choice: « te suivre »
  alternative: « t’accompagner » ou « aller avec toi »
  rationale: « Suivre » maintient ensemble le déplacement évoqué par le contexte et la portée propre à la condition de disciple, sans résoudre cette tension.
- issue: Nuance de ὑπὲρ σοῦ
  choice: « pour toi »
  alternative: « à ta place »
  rationale: Le grec peut suggérer l’action en faveur d’autrui et parfois la substitution, mais le verset ne contraint pas à expliciter ici « à ta place ».
translation_notes:
  register: Français international moderne, digne et accessible. L’interrogation avec inversion (« ne puis-je pas ») convient à l’adresse solennelle sans être archaïque. « Donner ma vie » est idiomatique et conserve la force volontaire de la déclaration de Pierre.
