id: JHN.13.14
reference: John 13:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: fr
  text: Si donc moi, le Seigneur et le Maître, je vous ai lavé les pieds, vous aussi, vous devez laver les pieds les uns des autres.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: Si donc
  rationale: Rend la condition εἰ et la valeur déductive de οὖν dans un enchaînement naturel en français.
- source_word: ἐγὼ
  choice: moi… je
  rationale: La dislocation avec pronom tonique conserve l’insistance du pronom grec explicite et souligne le contraste avec l’obligation des disciples.
- source_word: ἔνιψα
  choice: ai lavé
  rationale: Le passé composé exprime naturellement en français l’acte achevé que Jésus vient d’accomplir et dont les effets restent pertinents.
- source_word: ὑμῶν τοὺς πόδας
  choice: je vous ai lavé les pieds
  rationale: Cette construction idiomatique française avec pronom datif rend fidèlement la relation possessive du grec.
- source_word: ὁ κύριος
  choice: le Seigneur
  rationale: Conserve le titre usuel κύριος et le contraste entre la dignité de Jésus et l’humilité de son geste.
- source_word: ὁ διδάσκαλος
  choice: le Maître
  rationale: « Maître » est ici un titre français naturel pour celui qui enseigne; il évite la tournure moins idiomatique « l’Enseignant » tout en gardant la portée de διδάσκαλος.
- source_word: καὶ ὑμεῖς
  choice: vous aussi
  rationale: Rend à la fois la conjonction et l’emphase du pronom grec, en faisant correspondre l’action attendue des disciples à celle de Jésus.
- source_word: ὀφείλετε
  choice: vous devez
  rationale: Exprime clairement l’obligation morale portée par ὀφείλετε sans transformer la proposition en impératif direct.
- source_word: ἀλλήλων
  choice: les uns aux autres
  rationale: Formulation réciproque française standard, adaptée à un groupe de disciples.
- source_word: νίπτειν τοὺς πόδας
  choice: vous laver les pieds
  rationale: Maintient l’acte concret du lavage des pieds sans le réduire à une paraphrase générale sur le service.
theological_decisions:
- issue: Valeur christologique de κύριος
  choice: le Seigneur
  alternative: le Maître
  rationale: « Seigneur » conserve le titre distinct de κύριος, tandis que διδάσκαλος est rendu séparément par « Maître »; cette distinction préserve la juxtaposition des deux titres grecs.
- issue: Portée du geste du lavement des pieds
  choice: Conserver l’acte concret « vous laver les pieds les uns aux autres »
  alternative: vous servir humblement les uns les autres
  rationale: Le grec nomme explicitement le lavage des pieds. Sa portée exemplaire ne doit pas remplacer dans le texte principal le geste effectivement énoncé.
- issue: Force de l’obligation exprimée par ὀφείλετε
  choice: vous devez
  alternative: il vous faut / vous êtes tenus de
  rationale: « Vous devez » rend une obligation réelle et morale sans ajouter une qualification doctrinale sur la forme précise que doit prendre son accomplissement.
translation_notes:
  register: Français international moderne, clair et digne. La reprise « moi… je » est volontaire afin de préserver l’emphase grecque. « Maître » est employé comme titre pédagogique pour διδάσκαλος, à distinguer de « Seigneur » pour κύριος. Aucun appel de note n’est nécessaire.
