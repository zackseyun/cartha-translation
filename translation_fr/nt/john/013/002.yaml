  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: fr
  text: Pendant le repas[a], alors que le diable avait déjà mis au cœur de Judas, fils de Simon Iscariote[c], l’intention de livrer Jésus[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tandis que le repas avait lieu. » Le grec ne signifie pas que le repas était déjà terminé.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de trahir Jésus ». Littéralement, « de le livrer ».'
    reason: lexical_alternative
  - marker: c
    text: 'La construction grecque peut aussi être comprise : « Judas Iscariote, fils de Simon ».'
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: Pendant le repas
  rationale: 'Le génitif absolu exprime une circonstance contemporaine : le repas était en cours, et non terminé.'
- source_word: διάβολος
  choice: le diable
  rationale: Dans le récit johannique, le terme désigne personnellement l’adversaire mauvais; le titre français établi convient au référent.
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: avait déjà mis au cœur … l’intention
  rationale: Cette formulation conserve l’image du cœur et la valeur d’antériorité de βεβληκότος, tout en explicitant naturellement en français le contenu intentionnel introduit par ἵνα.
- source_word: καρδίαν
  choice: cœur
  rationale: « Cœur » préserve la métaphore anthropologique biblique, qui englobe ici la volonté et l’intention.
- source_word: ἵνα παραδοῖ
  choice: l’intention de livrer
  rationale: La construction rend naturellement le contenu ou le but de ce qui a été mis au cœur. « Livrer » conserve le sens concret de παραδίδωμι sans masquer la portée de trahison propre au contexte.
- source_word: αὐτόν
  choice: Jésus
  rationale: Le pronom renvoie à Jésus. La reprise nominale évite en français toute ambiguïté possible avec Simon, dernier nom masculin mentionné.
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: Judas Iscariote, fils de Simon
  rationale: La ponctuation rattache naturellement « Iscariote » à Judas, conformément à l’identification johannique, et « fils de Simon » rend le génitif patronymique sans suggérer que Simon porte ce surnom.
theological_decisions:
- issue: Action du diable et responsabilité de Judas
  choice: Le diable met une intention au cœur de Judas, tandis que Judas demeure celui qui doit livrer Jésus.
  alternative: Le diable avait poussé Judas à agir.
  rationale: Le grec affirme une influence diabolique sans supprimer l’action propre de Judas. La traduction maintient cette tension et n’impose aucune théorie de la causalité ou de la détermination.
- issue: Portée de παραδίδωμι
  choice: livrer
  alternative: trahir
  rationale: « Livrer » garde l’image et l’ambiguïté lexicale du verbe grec; dans le contexte de Judas, le lecteur en perçoit naturellement la dimension de trahison.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste suspendue par une virgule, comme le verset grec, puisqu’elle se poursuit au verset suivant. L’élision typographique de « l’intention » et l’apostrophe courbe suivent l’usage éditorial français.
