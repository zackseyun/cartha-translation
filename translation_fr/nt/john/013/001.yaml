source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: fr
  text: Avant la fête de la Pâque, Jésus, sachant que son heure était venue de passer de ce monde auprès du Père, ayant aimé les siens qui étaient dans le monde, les aima jusqu’au bout.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pleinement » ou « jusqu’à l’extrême ». L’expression grecque peut évoquer à la fois un amour qui demeure jusqu’au dernier moment et un amour porté à sa pleine mesure.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: Avant la fête de la Pâque
  rationale: Πρό avec le génitif exprime l’antériorité temporelle. δέ est ici une transition légère qu’il n’est pas nécessaire de rendre séparément. « La fête de la Pâque » conserve explicitement la notion de fête.
- source_word: εἰδὼς
  choice: savait
  rationale: Le participe exprime la pleine connaissance qu’avait Jésus au moment de l’action. Une proposition avec verbe conjugué donne une phrase française naturelle sans introduire de lien causal absent du grec.
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: son heure était venue
  rationale: Cette formulation conserve l’expression johannique de l’« heure », avec sa portée narrative et théologique, sans la réduire à un simple moment chronologique.
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: de passer de ce monde auprès du Père
  rationale: μεταβαίνω décrit un passage ou un transfert. « Passer » maintient l’image du mouvement, tandis que « auprès du Père » exprime naturellement en français la destination personnelle indiquée par πρός.
- source_word: ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: Ayant aimé les siens qui étaient dans le monde
  rationale: « Ayant aimé » préserve la structure participiale et récapitule l’amour antérieur de Jésus. « Les siens » garde la portée relationnelle et volontairement large de τοὺς ἰδίους.
- source_word: εἰς τέλος
  choice: jusqu’au bout
  rationale: La formule française peut évoquer à la fois la persévérance jusqu’au terme et l’amour porté à son accomplissement. Une note explicite la dimension qualitative également possible.
- source_word: ἠγάπησεν αὐτούς
  choice: il les aima
  rationale: Le passé simple convient au registre narratif biblique soutenu mais accessible et conserve le verbe simple « aimer » du grec.
theological_decisions:
- issue: Portée de εἰς τέλος dans l’affirmation culminante sur l’amour de Jésus
  choice: jusqu’au bout
  alternative: pleinement ; jusqu’à l’extrême
  rationale: L’expression grecque peut être temporelle, qualitative, ou intentionnellement porteuse des deux nuances. Le texte principal conserve cette tension sans choisir exclusivement entre durée et plénitude; la note indique les autres formulations possibles.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase grecque très longue est divisée en deux phrases afin d’éviter une construction française pesante, tout en maintenant l’enchaînement de la connaissance, du passage vers le Père et de l’amour de Jésus. Le marqueur [a] figure dans le texte principal et correspond à l’unique note.
