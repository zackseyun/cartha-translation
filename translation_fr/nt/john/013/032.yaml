  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: fr
  text: Si Dieu a été glorifié en lui[a], Dieu le glorifiera aussi en lui-même[b], et Dieu le glorifiera aussitôt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Puisque Dieu a été glorifié en lui. » Le grec emploie « si », mais, dans ce contexte, la condition est vraisemblablement tenue pour vraie. Certains manuscrits omettent « si Dieu a été glorifié en lui ».'
    reason: alternative_reading
  - marker: b
    text: « En lui-même » peut aussi être compris au sens de « auprès de lui-même » ou « par lui-même » ; l’expression grecque est concise et riche de sens.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: Si
  rationale: Rend directement la particule conditionnelle grecque, tout en laissant le contexte indiquer que la condition est tenue pour vraie.
- source_word: ἐδοξάσθη
  choice: a été glorifié
  rationale: Conserve la voix passive et exprime naturellement en français l’action accomplie de l’aoriste.
- source_word: ἐν αὐτῷ
  choice: en lui
  rationale: Reproduit sobrement la préposition grecque et préserve la densité de la formulation johannique sans imposer « par lui ».
- source_word: δοξάσει
  choice: glorifiera
  rationale: Maintient la continuité lexicale avec « a été glorifié » et la portée théologique de δοξάζω.
- source_word: ἐν αὑτῷ
  choice: en lui-même
  rationale: Le pronom réfléchi renvoie à Dieu; cette traduction reste proche de l’expression grecque compacte sans trancher entre des nuances possibles comme « auprès de lui-même » ou « par lui-même ».
- source_word: εὐθύς
  choice: immédiatement
  rationale: Expression française actuelle et claire de l’immédiateté marquée par l’adverbe grec.
theological_decisions:
- issue: Valeur conditionnelle de εἰ alors que le contexte présente la glorification comme une réalité tenue pour acquise
  choice: Maintenir « Si Dieu a été glorifié en lui » dans le texte principal
  alternative: « Puisque Dieu a été glorifié en lui »
  rationale: « Si » correspond explicitement au grec εἰ et préserve la forme conditionnelle; une note signale que, dans le contexte, la condition est vraisemblablement considérée comme remplie.
- issue: Sens théologique compact de ἐν αὑτῷ
  choice: « en lui-même »
  alternative: « auprès de lui-même » ou « par lui-même »
  rationale: La traduction littérale préserve l’ambiguïté de la relation exprimée sans imposer une interprétation instrumentale ou relationnelle particulière.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « glorifier » ainsi que les pronoms potentiellement denses sont conservés afin de respecter le style et la tension théologique du texte grec.
