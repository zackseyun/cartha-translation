  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: fr
  text: 'C’est à ceci que tous reconnaîtront que vous êtes mes disciples : si vous avez de l’amour les uns pour les autres.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « si vous avez de l’amour parmi vous » ; l’expression souligne un amour réciproque.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: C’est à ceci que
  rationale: Cette tournure française naturelle présente l’amour mutuel comme le signe distinctif permettant de reconnaître les disciples, tout en conservant la valeur démonstrative de l’expression grecque.
- source_word: γνώσονται
  choice: reconnaîtront
  rationale: Dans ce contexte, le futur de γινώσκω désigne le fait de discerner ou d’identifier les disciples grâce à un signe visible. « Reconnaîtront » exprime cette nuance plus précisément que le simple « sauront ».
- source_word: πάντες
  choice: tous
  rationale: Le pluriel masculin grec a ici une portée générique. Dans cette construction, « tous » désigne naturellement tout le monde sans limiter le propos aux hommes.
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: vous êtes mes disciples
  rationale: Le datif ἐμοί exprime ici l’appartenance ou la relation personnelle. « Mes disciples » est la formulation française établie et idiomatique.
- source_word: ἐὰν
  choice: si
  rationale: « Si » conserve directement la forme conditionnelle grecque sans transformer la condition en affirmation temporelle.
- source_word: ἀγάπην ἔχητε
  choice: vous avez de l’amour
  rationale: Cette traduction rend simplement le verbe ἔχω et le nom ἀγάπη, sans réduire l’amour à un sentiment ni ajouter explicitement l’idée d’action.
- source_word: ἐν ἀλλήλοις
  choice: les uns pour les autres
  rationale: Cette expression idiomatique française rend clairement la réciprocité visée. Le grec dit plus littéralement « parmi les uns et les autres », formulation moins naturelle en français.
theological_decisions:
- issue: Portée de la condition introduite par ἐὰν
  choice: si vous avez de l’amour les uns pour les autres
  alternative: quand vous aurez de l’amour les uns pour les autres
  rationale: Le texte présente l’amour mutuel comme le signe auquel les disciples seront reconnus. « Si » préserve la condition grammaticale sans suggérer que cet amour mérite ou produit à lui seul le statut de disciple.
- issue: Valeur de l’amour comme signe de reconnaissance
  choice: C’est à ceci que tous reconnaîtront
  alternative: Par ce moyen, tous sauront
  rationale: La formulation retenue présente l’amour mutuel comme une marque publique d’appartenance à Jésus, sans préciser au-delà du texte la nature exacte du lien entre amour et discipleship.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est à ceci que » et « les uns pour les autres » évitent une traduction trop littérale tout en conservant la structure argumentative et la réciprocité du grec.
