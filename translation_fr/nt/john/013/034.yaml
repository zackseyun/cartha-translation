id: JHN.13.34
reference: John 13:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: fr
  text: 'Je vous donne un commandement nouveau : aimez-vous les uns les autres. Comme je vous ai aimés, vous aussi, aimez-vous les uns les autres.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Comme je vous ai aimés, afin que vous aussi vous vous aimiez les uns les autres. »'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν
  choice: un commandement
  rationale: « Commandement » rend naturellement la force éthique et solennelle de ἐντολή dans le contexte johannique.
- source_word: καινὴν
  choice: nouveau
  rationale: Le terme français courant conserve la portée ouverte de καινός sans préciser en quoi consiste cette nouveauté.
- source_word: δίδωμι ὑμῖν
  choice: je vous donne
  rationale: Le présent simple exprime directement et solennellement le don du commandement, tout en intégrant naturellement le destinataire.
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: aimez-vous les uns les autres
  rationale: Après « je vous donne un commandement », l’impératif français exprime clairement le contenu prescriptif de la proposition en ἵνα.
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: Comme je vous ai aimés
  rationale: « Comme » préserve la comparaison, tandis que le passé composé est le temps naturel en français actuel pour l’amour manifesté par Jésus envers ses disciples.
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: vous aussi, aimez-vous les uns les autres
  rationale: Cette formulation préserve l’accent de καὶ ὑμεῖς et la force exhortative, tout en signalant en note la relation syntaxique possible avec la proposition précédente.
theological_decisions:
- issue: Nature du « commandement nouveau »
  choice: L’expression est conservée sans expliquer dans le texte en quel sens le commandement est nouveau.
  alternative: Préciser qu’il est nouveau dans le temps, dans sa qualité ou dans sa réalisation en Jésus.
  rationale: Le verset qualifie le commandement de nouveau sans définir lui-même cette nouveauté; l’expliciter trancherait une question que le texte laisse ouverte.
- issue: Fonction du second ἵνα
  choice: 'Le rendre comme une exhortation reprise : « vous aussi, aimez-vous les uns les autres ».'
  alternative: « afin que vous aussi vous vous aimiez les uns les autres », en le rattachant plus directement à « comme je vous ai aimés ».
  rationale: La ponctuation n’appartient pas au texte grec ancien, et la syntaxe permet de percevoir soit une reprise du contenu du commandement, soit une nuance de résultat ou de finalité. La note conserve cette ambiguïté.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « aimez-vous les uns les autres » est maintenue pour refléter l’insistance du grec. Le passé composé « je vous ai aimés » est plus idiomatique que le passé simple dans le discours français actuel.
