  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: fr
  text: 'Simon Pierre lui dit : « Seigneur, où vas-tu ? » Jésus répondit : « Là où je vais, tu ne peux pas me suivre maintenant, mais tu me suivras plus tard.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Tu me suivras plus tard » peut faire allusion au fait que Pierre suivra ensuite Jésus dans la souffrance ou la mort ; la formulation elle-même ne précise pas de quelle manière.
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent français « dit », naturel dans un récit et fidèle à la vivacité johannique.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » est le titre français usuel qui conserve à la fois la déférence de l’adresse et sa portée théologique possible.
- source_word: ποῦ ὑπάγεις / Ὅπου ὑπάγω
  choice: où vas-tu / Là où je vais
  rationale: La répétition de « aller » préserve le lien verbal entre la question de Pierre et la réponse de Jésus, sans préciser la destination.
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: tu ne peux pas me suivre maintenant
  rationale: « Tu ne peux pas » exprime explicitement la capacité niée par δύναμαι, dans un français courant et direct.
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: mais tu me suivras plus tard
  rationale: Le futur et le contraste marqué par δέ sont conservés, tandis que « plus tard » rend naturellement ὕστερον.
theological_decisions:
- issue: Nature du futur chemin à la suite de Jésus annoncé à Pierre
  choice: Ne pas préciser dans le texte s’il s’agit du martyre de Pierre, de sa reprise du discipulat après la résurrection ou d’un accomplissement eschatologique.
  alternative: Expliciter une allusion à la souffrance ou à la mort ultérieure de Pierre.
  rationale: Le grec affirme seulement que Pierre suivra Jésus plus tard. La formulation française maintient cette ouverture narrative et théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue direct habituel avec Jésus. La formulation reste concise et conserve la répétition structurante du verbe « suivre ».
