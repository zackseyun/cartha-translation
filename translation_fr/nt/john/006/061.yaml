id: JHN.6.61
reference: John 6:61
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: fr
  text: 'Mais Jésus, sachant en lui-même que ses disciples murmuraient à ce sujet, leur dit : « Cela vous scandalise-t-il[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cela vous fait-il trébucher ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: sachant
  rationale: Le participe présent exprime une connaissance concomitante à la parole de Jésus; « sachant » en conserve naturellement la valeur.
- source_word: ἐν ἑαυτῷ
  choice: en lui-même
  rationale: Cette expression souligne que Jésus avait intérieurement connaissance de leurs murmures, sans préciser comment il les avait appris.
- source_word: γογγύζουσιν
  choice: murmuraient
  rationale: Le verbe décrit des protestations exprimées à voix basse. L’imparfait convient au cadre narratif français et « murmuraient » garde cette nuance mieux que « se plaignaient ».
- source_word: περὶ τούτου
  choice: à ce sujet
  rationale: Cette formulation naturelle renvoie sans ajout explicatif aux paroles précédentes de Jésus.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: Rendu français idiomatique qui ne restreint pas indûment le groupe aux Douze.
- source_word: Τοῦτο
  choice: cela
  rationale: Le démonstratif reste sans complément explicatif, comme en grec, et renvoie au discours précédent.
- source_word: σκανδαλίζει
  choice: scandalise
  rationale: « Scandaliser » conserve le lien lexical et la tension entre choquer et devenir une occasion de chute; une note explicite cette seconde valeur.
theological_decisions:
- issue: Sens de σκανδαλίζει dans le contexte d’un possible rejet des paroles de Jésus
  choice: Cela vous scandalise-t-il ?
  alternative: Cela vous fait-il trébucher ? / Cela devient-il pour vous une occasion de chute ?
  rationale: Le grec peut désigner aussi bien le fait de choquer que celui de provoquer une chute spirituelle ou un abandon. Le texte principal reste concis et naturel, tandis que la note préserve la portée métaphorique et théologique.
translation_notes:
  register: Français moderne, digne et accessible. « Murmuraient » restitue la plainte à voix basse; « scandalise » est immédiatement compréhensible tout en permettant de conserver en note l’image plus forte de la chute.
