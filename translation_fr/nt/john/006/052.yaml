id: JHN.6.52
reference: John 6:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐμάχοντο οὖν πρὸς ἀλλήλους οἱ Ἰουδαῖοι λέγοντες· Πῶς δύναται οὗτος ἡμῖν δοῦναι τὴν σάρκα ⸀αὐτοῦ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/052.yaml
  text: So the Jews were arguing among themselves[a], saying[b], “How can this man give us his flesh to eat?”
translation:
  language: fr
  text: 'Les Juifs[a] se disputaient donc entre eux : « Comment cet homme peut-il nous donner sa chair[b] à manger ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens » ou, selon le contexte, « les responsables juifs ». Le grec dit simplement « les Juifs ».
    reason: alternative_reading
  - marker: b
    text: Ou « son corps ». Le mot grec est « chair » (σάρξ) ; il est conservé ici afin de préserver la formulation concrète et la tension du passage.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐμάχοντο
  choice: se disputaient
  rationale: L’imparfait exprime une querelle en cours. « Se disputaient » rend une vive opposition verbale sans suggérer nécessairement un combat physique.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la suite logique et narrative du discours précédent.
- source_word: πρὸς ἀλλήλους
  choice: entre eux
  rationale: Cette tournure française naturelle exprime la réciprocité du désaccord au sein du groupe.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Le grec dit explicitement « les Juifs ». Le texte principal conserve cette désignation sans en restreindre d’office la portée à un sous-groupe.
- source_word: λέγοντες
  choice: ':'
  rationale: Le participe introduit les paroles qui constituent la dispute. En français, les deux-points rendent naturellement cette fonction sans alourdir la phrase par « en disant ».
- source_word: Πῶς δύναται
  choice: Comment … peut-il
  rationale: Formulation française directe d’une question portant sur la possibilité ou la capacité.
- source_word: οὗτος
  choice: cet homme
  rationale: Le démonstratif a ici une valeur de désignation pouvant marquer la distance; « cet homme » la conserve mieux qu’un simple pronom.
- source_word: ἡμῖν
  choice: nous
  rationale: Complément indirect de « donner », rendu selon l’usage idiomatique français.
- source_word: δοῦναι
  choice: donner
  rationale: Sens courant et direct de δίδωμι, sans amplification interprétative.
- source_word: τὴν σάρκα αὐτοῦ
  choice: sa chair
  rationale: « Chair » conserve le terme concret σάρξ ainsi que la difficulté et la tension suscitées par les paroles de Jésus.
- source_word: φαγεῖν
  choice: à manger
  rationale: Après « donner », « à manger » est une formulation française naturelle qui conserve le sens de l’infinitif.
theological_decisions:
- issue: Traduction de σάρξ dans un contexte théologiquement chargé
  choice: chair
  alternative: corps
  rationale: Le grec emploie σάρξ, « chair ». Le conserver évite d’interpréter prématurément la parole de Jésus et maintient son caractère concret ainsi que la tension du passage.
- issue: Portée de οἱ Ἰουδαῖοι dans l’Évangile selon Jean
  choice: les Juifs
  alternative: les Judéens; les responsables juifs
  rationale: Le texte grec ne précise pas ici un groupe plus restreint. La traduction littérale est donc maintenue dans le corps du verset, tandis que les possibilités contextuelles sont signalées en note.
translation_notes:
  register: Français international moderne, naturel et digne. La structure participiale grecque est rendue idiomatiquement par deux-points. Les termes « les Juifs » et « chair » restent proches du texte source, avec des notes qui exposent les autres possibilités sans résoudre les ambiguïtés dans le texte principal.
