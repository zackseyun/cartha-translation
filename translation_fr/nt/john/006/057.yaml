id: JHN.6.57
reference: John 6:57
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: fr
  text: Comme le Père vivant m’a envoyé et que je vis à cause du Père[b], celui qui me mange[a] vivra, lui aussi, à cause de moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « celui qui se nourrit de moi ». Le verbe grec est concret et expressif; il désigne l’action de manger et peut évoquer le fait de mâcher.
    reason: lexical_alternative
  - marker: b
    text: Ou « je vis par le Père » et « vivra par moi ». La préposition grecque peut exprimer la cause ou le moyen; le texte principal retient ici le sens causal afin de préserver le parallèle entre le Père et le Fils, puis entre le Fils et celui qui le mange.
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: Comme
  rationale: Introduit la comparaison qui structure toute la phrase. En français, « Comme » ouvre naturellement la proposition comparative, tandis que « lui aussi » dans la proposition principale rend la correspondance exprimée par κἀκεῖνος.
- source_word: ὁ ζῶν πατὴρ
  choice: le Père vivant
  rationale: Rend directement le participe attributif ζῶν et conserve le thème johannique de la vie sans transformer l’expression en « Père qui donne la vie », ce qui irait au-delà du texte.
- source_word: ἀπέστειλέν με
  choice: m’a envoyé
  rationale: Le passé composé est naturel en français pour cet envoi passé dont la portée demeure dans la mission de Jésus.
- source_word: ζῶ
  choice: je vis
  rationale: Conserve le présent verbal et le parallèle avec le futur « vivra ».
- source_word: διὰ τὸν πατέρα
  choice: à cause du Père
  rationale: Avec l’accusatif, διά exprime ici très naturellement la cause ou le fondement. Cette formulation maintient le parallèle avec δι’ ἐμέ.
- source_word: ὁ τρώγων με
  choice: celui qui me mange
  rationale: Rend concrètement le verbe expressif τρώγω sans imposer une interprétation exclusivement sacramentelle ou exclusivement métaphorique.
- source_word: κἀκεῖνος
  choice: lui aussi
  rationale: Restitue l’insistance du pronom, littéralement « celui-là aussi », dans une tournure française naturelle.
- source_word: ζήσει
  choice: vivra
  rationale: Conserve simplement le futur et le lien verbal avec « je vis ».
- source_word: δι’ ἐμέ
  choice: à cause de moi
  rationale: Rend de manière cohérente la valeur causale de διά avec l’accusatif et préserve l’analogie entre la relation du Fils au Père et celle du croyant au Fils.
theological_decisions:
- issue: Le rapport entre la vie de Jésus et le Père dans διὰ τὸν πατέρα
  choice: je vis à cause du Père
  alternative: je vis par le Père
  rationale: La traduction causale respecte l’emploi de διά avec l’accusatif et le parallèle interne du verset, sans tirer de conclusion sur la nature ontologique du Fils ni expliquer davantage la relation évoquée.
- issue: La portée eucharistique ou métaphorique de ὁ τρώγων με
  choice: celui qui me mange
  alternative: celui qui se nourrit de moi
  rationale: Le verbe concret est maintenu afin de laisser ouvertes les lectures sacramentelle et plus largement relationnelle ou spirituelle, sans atténuer la force de l’image grecque.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe garde la longue comparaison du grec tout en rendant l’insistance de κἀκεῖνος par « lui aussi ». Le choix concret « me mange » préserve volontairement la vigueur et la tension interprétative du passage.
