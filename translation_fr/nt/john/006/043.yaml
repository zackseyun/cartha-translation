  yaml_path: translation/nt/john/006/043.yaml
  text: Jesus answered and said to them[b][a], “Do not grumble among yourselves.”
translation:
  language: fr
  text: 'Jésus leur répondit : « Ne murmurez pas entre vous[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « les uns avec les autres ».

      '
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: répondit
  rationale: La tournure grecque associe littéralement « répondit » et « dit ». En français moderne, « répondit » exprime naturellement à lui seul la fonction discursive, sans reproduire un redoublement sémitisant peu idiomatique.
- source_word: Μὴ γογγύζετε
  choice: Ne murmurez pas
  rationale: Le présent impératif avec μή peut interdire l’action de manière générale ou viser une action en cours. « Ne murmurez pas » conserve cette ambiguïté et fait écho au vocabulaire biblique des murmures, tout en restant compréhensible en français courant.
- source_word: μετ’ ἀλλήλων
  choice: entre vous
  rationale: Cette expression indique une action réciproque au sein du groupe. « Entre vous » est la formulation française la plus naturelle; la note signale l’autre nuance possible.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française traditionnelle et standard du nom Ἰησοῦς.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formule narrative grecque redondante est rendue idiomatiquement, tandis que « murmurez » préserve la résonance biblique du verbe sans imposer que l’ordre signifie nécessairement « cessez de murmurer ».
