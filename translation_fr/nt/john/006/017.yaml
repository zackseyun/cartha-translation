    issue: Placement ambigu de « de l’autre côté de la mer »
    rationale: Dans « se dirigeaient de l’autre côté de la mer, vers Capharnaüm », la préposition « de » peut évoquer l’origine plutôt que la destination. Il faut écrire « vers l’autre côté de la mer » pour rendre πέραν τῆς θαλάσσης.
  - severity: low
    issue: « Rejoints » interprète légèrement le verbe de mouvement
    rationale: ἐληλύθει πρὸς αὐτούς signifie littéralement qu’il n’était pas encore venu auprès d’eux. « Rejoindre » est possible, mais « venir auprès d’eux » est plus direct et préserve mieux la formulation du grec.
  revised_text: Ils montèrent dans une barque et se dirigeaient vers l’autre côté de la mer, vers Capharnaüm. La nuit était déjà tombée, et Jésus n’était pas encore venu auprès d’eux.
