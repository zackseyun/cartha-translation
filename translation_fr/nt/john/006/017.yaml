  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: fr
  text: Ils montèrent dans une barque et se dirigeaient vers l’autre côté de la mer, vers Capharnaüm. La nuit était déjà tombée, et Jésus n’était pas encore venu auprès d’eux.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: Ils montèrent dans une barque
  rationale: Le participe aoriste exprime une action antérieure au déplacement en cours. Une proposition coordonnée est naturelle en français et conserve la succession des actions. « Barque » convient au contexte du lac tout en traduisant πλοῖον sans suggérer un grand navire.
- source_word: ἤρχοντο
  choice: se dirigeaient
  rationale: L’imparfait grec présente le déplacement comme en cours. L’imparfait français maintient cet aspect progressif sans introduire l’idée plus ponctuelle de « partirent ».
- source_word: πέραν τῆς θαλάσσης
  choice: de l’autre côté de la mer
  rationale: πέραν avec le génitif désigne ici le passage vers la rive opposée. Cette formulation française est naturelle et garde « mer » pour θάλασσα, conformément au vocabulaire johannique.
- source_word: εἰς Καφαρναούμ
  choice: vers Capharnaüm
  rationale: La préposition εἰς marque la destination. « Vers » s’accorde avec un trajet encore en cours; « Capharnaüm » est la forme française usuelle du toponyme.
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: Il faisait déjà nuit
  rationale: Cette expression idiomatique rend l’état d’obscurité déjà établi par le plus-que-parfait grec. Une traduction plus formelle serait « l’obscurité était déjà venue », mais elle serait moins naturelle en français contemporain.
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: ne les avait pas encore rejoints
  rationale: Le plus-que-parfait avec οὔπω indique qu’à ce moment Jésus n’était toujours pas arrivé auprès d’eux. « Rejoindre » exprime naturellement en français le mouvement vers leur groupe sans préciser davantage ses modalités.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Forme française traditionnelle et courante du nom propre.
theological_decisions:
- issue: Aspect narratif et succession temporelle
  choice: La montée dans la barque est présentée comme accomplie, le trajet comme en cours, puis la nuit et l’absence de Jésus comme des états déjà établis.
  alternative: Employer uniquement des passés simples ou rendre la scène de façon strictement statique.
  rationale: Ce choix conserve les rapports aspectuels du grec et la tension narrative qui prépare les versets suivants, sans ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe privilégie une coordination naturelle, tandis que les imparfaits et le plus-que-parfait préservent la progression du récit. Aucun appel de note n’est nécessaire, car les principales nuances du grec peuvent être rendues directement dans le texte.
