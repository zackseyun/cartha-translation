id: JHN.6.60
reference: John 6:60
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: fr
  text: 'Après avoir entendu cela, beaucoup de ses disciples dirent donc : « Cette parole[a] est dure[b] ; qui peut l’écouter[c] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette déclaration », « ce message » ou « cet enseignement » ; ici, λόγος peut désigner les paroles, le message ou l’enseignement qui vient d’être entendu.
    reason: lexical_alternative
  - marker: b
    text: Ou « difficile », « sévère » ou « choquante » ; σκληρός peut évoquer ce qui est difficile ou pénible à recevoir, sans préciser davantage la nature de l’objection.
    reason: lexical_alternative
  - marker: c
    text: Ou « qui peut l’entendre ? » Le verbe grec peut signifier entendre, écouter, prêter attention ou accueillir, selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ
  choice: beaucoup
  rationale: Rend naturellement le nombre important de personnes au sein du groupe des disciples.
- source_word: οὖν
  choice: donc
  rationale: Conserve le lien logique avec le discours précédent tout en s’intégrant naturellement à la phrase française.
- source_word: ἀκούσαντες
  choice: après avoir entendu cela
  rationale: Rend la valeur temporelle du participe aoriste. « Cela » explicite sobrement l’objet implicite, à savoir les paroles précédentes de Jésus.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: beaucoup de ses disciples
  rationale: Indique que ceux qui parlent appartiennent au groupe plus large de ses disciples, sans alourdir la formulation par « parmi ».
- source_word: Σκληρός
  choice: dure
  rationale: « Dure » préserve l’ambiguïté entre une parole difficile à recevoir, sévère ou choquante, sans réduire l’objection à une difficulté intellectuelle.
- source_word: ὁ λόγος οὗτος
  choice: cette parole
  rationale: « Parole » reste proche de λόγος et peut désigner ici les propos, le message ou l’enseignement que les disciples viennent d’entendre.
- source_word: τίς δύναται
  choice: qui peut
  rationale: Formulation française concise et naturelle exprimant la capacité.
- source_word: αὐτοῦ ἀκούειν
  choice: l’écouter
  rationale: Le verbe « écouter » suggère davantage que la simple perception auditive et peut impliquer l’attention ou l’accueil, tout en évitant de préciser excessivement « accepter ».
theological_decisions:
- issue: Nature de l’objection des disciples au discours de Jésus
  choice: La parole est présentée comme difficile, sévère ou pénible à recevoir, sans préciser la nature exacte de cette difficulté.
  alternative: Comprendre qu’elle est seulement difficile à saisir intellectuellement, ou explicitement choquante et inacceptable.
  rationale: Le grec σκληρός permet plusieurs nuances. « Dure » maintient cette tension au lieu d’imposer une interprétation unique.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « cette parole est dure » conserve volontairement la force et l’ambiguïté du grec, tandis que « l’écouter » laisse ouverte la nuance d’attention, d’accueil ou d’acceptation.
