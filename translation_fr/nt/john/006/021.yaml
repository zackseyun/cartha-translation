id: JHN.6.21
reference: John 6:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: fr
  text: Ils étaient donc prêts à le prendre dans la barque, et aussitôt la barque se trouva à terre, là où ils se rendaient.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction possible : « et aussitôt la barque atteignit la rive vers laquelle ils se dirigeaient ».'
    reason: La construction ἐγένετο… ἐπὶ τῆς γῆς peut décrire le fait que la barque se trouva à destination ou qu’elle atteignit la rive; la note préserve cette possibilité lexicale.
lexical_decisions:
- source_word: ἤθελον
  choice: ils voulurent
  rationale: L’imparfait grec exprime ici leur volonté ou leur disposition à accueillir Jésus après leur frayeur. Le passé simple convient au déroulement narratif français sans réduire le verbe à un souhait passager.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence de ce qui précède; « donc » conserve clairement ce lien dans un registre naturel et digne.
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: le prendre dans la barque
  rationale: Cette formulation rend concrètement l’idée de faire monter ou d’accueillir Jésus dans l’embarcation, tout en restant proche de la construction grecque.
- source_word: πλοῖον
  choice: barque
  rationale: Dans le contexte du lac de Galilée, « barque » désigne naturellement l’embarcation sans évoquer un grand navire.
- source_word: εὐθέως
  choice: aussitôt
  rationale: « Aussitôt » préserve l’immédiateté marquée du grec et le caractère abrupt de la transition.
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: la barque se trouva à terre
  rationale: « Se trouva » restitue le fait de parvenir ou d’être soudainement en un lieu. « À terre » garde la référence à la terre ferme sans suggérer nécessairement que la barque était échouée sur le sol.
- source_word: γῆς
  choice: terre
  rationale: Dans ce contexte, γῆ désigne la terre ferme ou le lieu d’accostage. « Terre » reste proche du grec; « rive » est explicité comme possibilité en note.
- source_word: εἰς ἣν ὑπῆγον
  choice: là où ils se rendaient
  rationale: Cette tournure française naturelle exprime la destination visée et conserve la valeur durative de l’imparfait grec.
theological_decisions:
- issue: Faut-il expliquer ou atténuer l’apparente immédiateté miraculeuse de l’arrivée?
  choice: Conserver la formulation directe « aussitôt la barque se trouva à terre »
  alternative: « aussitôt la barque atteignit la rive » ou « bientôt la barque arriva à terre »
  rationale: Le grec raconte l’événement de manière brève et souligne son immédiateté. La traduction maintient cette tension narrative sans expliquer le mécanisme ni affaiblir εὐθέως.
translation_notes:
  register: Français international moderne, narratif et digne. « Barque », « aussitôt » et « se trouva à terre » sont accessibles tout en préservant la concision, l’immédiateté et l’ambiguïté spatiale du grec.
