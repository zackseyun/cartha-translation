    rationale: Le passé simple français présente habituellement une décision ou un acte ponctuel, alors que l’imparfait grec exprime ici leur volonté/disposition continue au moment du récit. « Ils étaient donc prêts à » transmet cette disposition sans ajouter d’interprétation doctrinale.
