  naturalness: « La barque se trouva à terre » est recevable et conserve utilement l’absence d’explication du texte grec. La formulation révisée reste narrative, moderne et internationale.
  terminology: « Barque » convient à πλοῖον dans ce contexte. « À terre » rend γῆ sans imposer « rive »; l’alternative « atteignit la rive » peut donc demeurer en note comme explicitation contextuelle.
  issues:
