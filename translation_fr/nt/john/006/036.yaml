  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: fr
  text: Mais je vous ai dit que vous m’avez vu[a], et pourtant vous ne croyez pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, en marquant davantage l’insistance : « vous m’avez bel et bien vu ».'
    reason: alternative lexicale pour la valeur emphatique du premier καί
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais
  rationale: Marque le contraste avec ce qui précède; « Mais » est l’adversatif français le plus naturel et concis.
- source_word: εἶπον ὑμῖν
  choice: je vous ai dit
  rationale: L’aoriste renvoie à une parole antérieure adressée aux auditeurs; cette tournure française restitue naturellement le verbe et son complément indirect.
- source_word: ὅτι
  choice: que
  rationale: Introduit le contenu de la parole précédente.
- source_word: καὶ ἑωράκατέ με
  choice: vous m’avez vu
  rationale: Le passé composé rend le parfait grec et sa pertinence présente. Le premier καί a ici une valeur emphatique difficile à isoler sans alourdir le français; sa portée est signalée en note.
- source_word: καὶ οὐ πιστεύετε
  choice: et pourtant vous ne croyez pas
  rationale: « Et pourtant » rend naturellement la coordination tout en faisant ressortir le contraste rhétorique entre voir et ne pas croire.
theological_decisions:
- issue: Valeur du premier καί dans καὶ ἑωράκατέ με
  choice: Rendre la proposition principale naturellement et signaler l’emphase en note
  alternative: « vous m’avez bel et bien vu » ou « même après m’avoir vu »
  rationale: Le καί peut être compris comme emphatique (« effectivement », « bel et bien »), mais une formulation trop appuyée risquerait de préciser indûment sa nuance. La note conserve l’ambiguïté sans masquer le contraste.
- issue: Traduction de πιστεύω
  choice: croire
  alternative: avoir foi; faire confiance
  rationale: « Croire » est l’équivalent verbal direct et courant dans l’Évangile selon Jean; il évite de réduire le terme à l’assentiment intellectuel ou d’en élargir explicitement le sens.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve les deux propositions coordonnées ainsi que la tension entre le fait d’avoir vu Jésus et l’absence de foi.
