id: JHN.6.29
reference: John 6:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: fr
  text: 'Jésus leur répondit : « Voici l’œuvre de Dieu[a] : que vous croyiez[b] en celui qu’il a envoyé. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « l’œuvre que Dieu demande » ou « l’œuvre que Dieu accomplit ». L’expression grecque « l’œuvre de Dieu » peut être comprise de plusieurs manières ; la formulation retenue conserve cette ambiguïté.
    reason: alternative_reading
  - marker: b
    text: Ou « mettiez votre confiance en ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς
  choice: Jésus leur répondit
  rationale: En français actuel, « répondit » exprime naturellement la formule narrative grecque à deux verbes, dont la reproduction littérale (« répondit et leur dit ») serait lourde et redondante.
- source_word: Τοῦτό ἐστιν
  choice: Voici
  rationale: « Voici » introduit de façon idiomatique et emphatique l’identification qui suit, sans en modifier le contenu.
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: l’œuvre de Dieu
  rationale: 'Cette formulation proche du grec conserve l’ambiguïté du génitif : l’œuvre peut être comprise comme celle que Dieu demande ou comme celle qu’il accomplit.'
- source_word: ἵνα πιστεύητε
  choice: que vous croyiez
  rationale: Après « voici l’œuvre de Dieu », la proposition en ἵνα précise ici le contenu de cette œuvre. Le subjonctif français convient à cette construction.
- source_word: εἰς ὃν
  choice: en celui qu’
  rationale: Dans Jean, πιστεύω εἰς se rend naturellement par « croire en » ; « celui » maintient clairement le caractère personnel de l’objet de la foi.
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: il a envoyé
  rationale: Le passé composé est naturel en français et souligne la portée actuelle de l’envoi. Le pronom « il » renvoie à Dieu sans introduire l’emphase peu naturelle de « celui-là ».
theological_decisions:
- issue: Sens du génitif dans τὸ ἔργον τοῦ θεοῦ
  choice: Conserver « l’œuvre de Dieu » dans le texte principal.
  alternative: « l’œuvre que Dieu demande » ou « l’œuvre que Dieu accomplit »
  rationale: Le grec permet plusieurs relations entre Dieu et l’œuvre. Le contexte peut soutenir l’exigence divine, tandis que la formulation peut aussi évoquer l’action de Dieu. La traduction ne tranche donc pas cette tension.
- issue: Sens de πιστεύητε εἰς
  choice: « que vous croyiez en »
  alternative: « que vous mettiez votre confiance en »
  rationale: « Croire en » est la formulation française habituelle pour πιστεύω εἰς et maintient le lien lexical avec le vocabulaire de la foi, tandis que « mettre sa confiance en » explicite une nuance relationnelle légitime.
translation_notes:
  register: Français international moderne, sobre et digne. La formule grecque littérale « répondit et leur dit » est condensée en « leur répondit », plus naturelle en français. Les deux appels de note figurent dans le texte principal immédiatement après les expressions concernées.
