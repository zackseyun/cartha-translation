  source_fidelity: 'Le texte rend fidèlement la construction grecque : Jésus répond à ses interlocuteurs, identifie « l’œuvre de Dieu », puis précise par une proposition introduite par ἵνα qu’il s’agit de croire en celui que Dieu a envoyé. « L’œuvre de Dieu » conserve correctement l’ambiguïté du génitif τοῦ θεοῦ, sans imposer une lecture théologique. « Croire en celui qu’il a envoyé » rend naturellement πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.'
