id: JHN.6.38
reference: John 6:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: fr
  text: Car je suis descendu du ciel, non pour faire ma propre volonté, mais la volonté de celui qui m’a envoyé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: Car
  rationale: Dans le contexte, ὅτι introduit l’explication de l’affirmation précédente. « Car » conserve cette valeur causale dans un français naturel et digne.
- source_word: καταβέβηκα
  choice: je suis descendu
  rationale: Le passé composé rend naturellement en français l’action accomplie dont la portée demeure présente, sans la lourdeur de « j’ai effectué ma descente ».
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: Cette formulation idiomatique conserve l’image spatiale et la résonance johannique de l’origine céleste.
- source_word: οὐχ ἵνα ποιῶ
  choice: non pour faire
  rationale: La tournure exprime clairement le but nié et maintient le parallélisme de la phrase.
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: ma propre volonté
  rationale: « Propre » restitue l’emphase du possessif grec et marque nettement le contraste avec la volonté de celui qui a envoyé Jésus.
- source_word: ἀλλὰ τὸ θέλημα
  choice: mais la volonté
  rationale: La répétition de « volonté » préserve le parallélisme formel et le poids théologique du grec.
- source_word: τοῦ πέμψαντός με
  choice: de celui qui m’a envoyé
  rationale: Cette formulation rend naturellement le participe substantivé sans préciser explicitement une identité que le verset laisse implicite.
theological_decisions:
- issue: La descente du ciel et l’origine de Jésus
  choice: Traduire directement « je suis descendu du ciel »
  alternative: Réduire l’expression à une métaphore de la mission divine
  rationale: Le texte présente l’origine de Jésus en termes célestes. La traduction conserve cette affirmation sans lui ajouter d’explication doctrinale.
- issue: Le rapport entre la volonté de Jésus et celle de celui qui l’a envoyé
  choice: Conserver « volonté » dans les deux membres et maintenir le contraste
  alternative: Paraphraser par « ce que je veux » et « ce qu’il veut »
  rationale: La répétition préserve la symétrie et la tension théologique du texte, sans effacer la distinction ni l’expliquer au moyen de catégories ultérieures.
translation_notes:
  register: Français international moderne, clair et digne. La structure antithétique du grec est conservée, avec une syntaxe naturelle. Aucun marqueur de note n’est nécessaire.
