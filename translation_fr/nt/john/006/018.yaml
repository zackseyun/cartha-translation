  yaml_path: translation/nt/john/006/018.yaml
  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: fr
  text: Et la mer était agitée parce qu’un vent fort soufflait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la mer se soulevait sous l’effet d’un vent fort ».
    reason: Alternative de formulation pour l’agitation progressive de la mer; le texte principal rend plus explicitement la valeur passive de διεγείρετο et le participe πνέοντος.
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: Et la mer
  rationale: θάλασσα désigne simplement la « mer ». Bien que le contexte soit celui de la mer de Galilée, le grec emploie ici le nom commun. τε assure une liaison légère, rendue naturellement par « Et ».
- source_word: ἀνέμου μεγάλου
  choice: un vent violent
  rationale: ἄνεμος signifie « vent » et μέγας en marque ici la grande force. En français météorologique courant, « vent violent » exprime plus naturellement cette intensité que le calque « grand vent ».
- source_word: πνέοντος
  choice: sous l’effet de
  rationale: Le participe présent décrit le vent en train de souffler comme circonstance concomitante à l’agitation de la mer. La tournure causale « sous l’effet de » restitue naturellement ce rapport en français, sans alourdir la phrase.
- source_word: διεγείρετο
  choice: se soulevait
  rationale: L’imparfait passif décrit un mouvement en cours affectant la mer. Le français idiomatique « se soulevait » conserve l’aspect progressif et évoque l’agitation croissante de l’eau sans ajouter explicitement des vagues absentes du texte.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La formulation principale privilégie une phrase fluide tout en conservant le mouvement continu exprimé par l’imparfait grec.
