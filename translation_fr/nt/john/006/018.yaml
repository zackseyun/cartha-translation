  source_fidelity: La tournure « se soulevait sous l’effet d’un vent violent » rend bien l’idée générale, mais « violent » peut accentuer μέγας au-delà de « fort », et « sous l’effet de » ne rend pas explicitement le participe πνέοντος (« soufflant »). Le passif imperfectif de διεγείρετο est plus directement conservé par « était agitée ».
  naturalness: « Et la mer était agitée parce qu’un vent fort soufflait » est naturel en français international moderne, fluide et adapté au registre narratif.
