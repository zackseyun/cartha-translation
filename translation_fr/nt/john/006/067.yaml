source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: fr
  text: 'Jésus dit donc aux Douze : « Vous ne voulez pas partir, vous aussi ? »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voulez-vous partir, vous aussi ? » En grec, la question est introduite par μή, qui laisse généralement attendre une réponse négative.'
    reason: Préciser la nuance de l’interrogation grecque et signaler une traduction française plus neutre possible.
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence narrative de ce qui précède, lorsque beaucoup de disciples cessent de suivre Jésus.
- source_word: τοῖς δώδεκα
  choice: aux Douze
  rationale: L’expression désigne de manière reconnue le groupe proche de Jésus; la majuscule en conserve la valeur de titre collectif.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Vous ne voulez pas… vous aussi ?
  rationale: La question introduite par μή appelle normalement une réponse négative. La tournure interrogative négative française en rend la nuance, tandis que « vous aussi » restitue καί et l’accent porté sur ὑμεῖς.
- source_word: θέλετε
  choice: voulez
  rationale: Dans ce contexte, le verbe exprime la volonté ou le désir; « voulez » est direct et naturel en français contemporain.
- source_word: ὑπάγειν
  choice: partir
  rationale: Le verbe exprime ici le fait de s’éloigner, dans le contexte immédiat du départ de nombreux disciples. « Partir » conserve ce sens sans expliciter davantage l’objet de l’éloignement.
theological_decisions:
- issue: Portée de la question de Jésus introduite par μή
  choice: Une interrogation négative laissant entendre que Jésus attend une réponse négative, sans transformer cette attente en affirmation certaine
  alternative: 'Une interrogation plus neutre : « Voulez-vous partir, vous aussi ? »'
  rationale: En grec, μή dans une question signale généralement l’attente d’une réponse négative. La formulation française préserve cette nuance discursive tout en maintenant l’ouverture réelle de la question.
translation_notes:
  register: Français international moderne, direct et digne. « Aux Douze » garde la désignation traditionnelle sans ajouter « disciples ». L’interrogation négative demeure naturelle et conserve l’attente implicite du grec.
