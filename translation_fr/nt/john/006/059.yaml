lexical_decisions:
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel renvoie à l’ensemble des paroles précédentes et conserve leur pluralité.
- source_word: εἶπεν
  choice: Il dit
  rationale: L’aoriste de λέγω se rend directement par « dit » ; le sujet implicite, Jésus, demeure exprimé par un pronom sans ajout explicatif.
- source_word: ἐν συναγωγῇ
  choice: dans la synagogue
  rationale: Malgré l’absence d’article en grec, la construction prépositionnelle peut désigner la synagogue connue du lieu ; le défini est naturel en français.
- source_word: διδάσκων
  choice: alors qu’il enseignait
  rationale: Le participe présent indique une action en cours, contemporaine du verbe principal.
- source_word: ἐν Καφαρναούμ
  choice: à Capharnaüm
  rationale: La préposition locative se rend naturellement par « à » devant un nom de ville ; « Capharnaüm » est la forme française usuelle du toponyme.
