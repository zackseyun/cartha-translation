  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: fr
  text: 'Mais il leur dit : « C’est moi[a]. N’ayez pas peur. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Je suis. » Dans l’Évangile selon Jean, cette expression peut servir à une simple identification et peut aussi faire écho à des thèmes théologiques plus larges.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: Mais il
  rationale: δέ marque ici une légère transition, avec une nuance de contraste par rapport à la peur des disciples. L’article ὁ a une valeur pronominale et renvoie à Jésus.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent français, naturel dans un récit au présent et fidèle à la forme verbale du texte source.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif pluriel est rendu directement sans expliciter « les disciples », que le contexte suffit à identifier.
- source_word: Ἐγώ εἰμι
  choice: C’est moi
  rationale: Dans la situation immédiate, Jésus se fait reconnaître et rassure les disciples. « C’est moi » exprime naturellement cette identification en français. La traduction plus littérale « Je suis » est signalée en note afin de préserver la possible résonance johannique.
- source_word: μὴ φοβεῖσθε
  choice: N’ayez pas peur
  rationale: Cette formulation rend naturellement en français moderne l’interdiction exprimée par μή avec l’impératif présent, dans le contexte de la peur des disciples.
theological_decisions:
- issue: Ἐγώ εἰμι est-il une simple formule d’identification ou comporte-t-il aussi une résonance théologique ?
  choice: 'Texte principal : « C’est moi »'
  alternative: « Je suis » ; éventuellement « C’est moi qui suis »
  rationale: Le contexte immédiat favorise une identification rassurante. Toutefois, dans l’Évangile selon Jean, ἐγώ εἰμι peut aussi évoquer un thème théologique plus large. La note maintient cette possibilité sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation distingue les deux paroles brèves de Jésus et conserve leur force rassurante.
