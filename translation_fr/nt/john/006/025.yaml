  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: fr
  text: 'Après l’avoir trouvé de l’autre côté de la mer, ils lui dirent : « Rabbi, quand es-tu arrivé[a] ici ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « quand es-tu venu ici ? » Le parfait grec peut souligner l’état présent qui résulte de la venue ; dans ce contexte, la question porte naturellement sur l’arrivée.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ εὑρόντες αὐτόν
  choice: Après l’avoir trouvé
  rationale: Le participe aoriste εὑρόντες marque ici une action antérieure au verbe principal. « Après l’avoir trouvé » restitue naturellement cette succession en français; la coordination initiale Καί est intégrée au mouvement narratif plutôt que traduite mécaniquement.
- source_word: πέραν τῆς θαλάσσης
  choice: de l’autre côté de la mer
  rationale: πέραν avec le génitif désigne le lieu situé au-delà ou sur la rive opposée. Cette expression française est claire et idiomatique.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Le maintien de ce titre translittéré préserve le cadre juif et la forme précise de l’adresse.
- source_word: πότε
  choice: quand
  rationale: Équivalent français direct et naturel de l’interrogatif temporel.
- source_word: ὧδε
  choice: ici
  rationale: Rend simplement l’adverbe de lieu, qui peut indiquer la présence ou l’arrivée en ce lieu.
- source_word: γέγονας
  choice: es-tu arrivé
  rationale: Dans ce contexte, le parfait de γίνομαι évoque idiomatiquement l’arrivée et la présence qui en résulte. « Es-tu arrivé » est naturel en français tout en laissant la note signaler la forme plus littérale.
- source_word: εἶπον αὐτῷ
  choice: ils lui dirent
  rationale: Conserve le sens ordinaire de λέγω sans le remplacer par le plus interprétatif « ils lui demandèrent ».
