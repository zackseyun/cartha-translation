id: JHN.6.66
reference: John 6:66
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: fr
  text: À partir de ce moment-là, beaucoup de ses disciples firent demi-tour et cessèrent de marcher avec lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « À cause de cela, beaucoup de ses disciples se retirèrent » ; l’expression grecque initiale peut avoir un sens causal, bien que le contexte favorise ici l’idée d’un tournant à partir de ce moment-là.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: À partir de ce moment-là
  rationale: Dans ce contexte, l’expression marque surtout le début d’une nouvelle situation, après les paroles difficiles de Jésus, tout en permettant de signaler en note sa possible valeur causale.
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: beaucoup de ses disciples
  rationale: 'Cette formulation française naturelle conserve le sens partitif : il s’agit d’un grand nombre au sein du groupe plus large de ses disciples.'
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: firent demi-tour
  rationale: L’ensemble exprime un mouvement de retrait ou de retour en arrière, et non un simple départ. « Firent demi-tour » restitue clairement ce tournant sans préciser abusivement leur destination.
- source_word: οὐκέτι
  choice: cessèrent de
  rationale: Avec l’infinitif français, cette tournure exprime naturellement l’interruption durable indiquée par l’adverbe grec.
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: marcher avec lui
  rationale: La traduction garde l’image de la marche et sa portée relationnelle, sans la réduire explicitement à « suivre ».
theological_decisions:
- issue: La portée du terme μαθηταί et le statut spirituel de ceux qui se retirent
  choice: disciples
  alternative: partisans
  rationale: Le récit les désigne comme des disciples sans les identifier aux Douze ni trancher dans la traduction la question de leur foi véritable. Le terme traditionnel et courant « disciples » préserve cette tension.
- issue: Le sens temporel ou causal de Ἐκ τούτου
  choice: À partir de ce moment-là
  alternative: À cause de cela
  rationale: Le contexte présente leur retrait comme un tournant qui commence alors. La valeur causale demeure linguistiquement possible et est donc conservée en note plutôt qu’intégrée au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. « Firent demi-tour » rend idiomatiquement le retrait exprimé par ἀπῆλθον εἰς τὰ ὀπίσω ; « marcher avec lui » conserve l’image grecque et sa tension entre déplacement concret et association durable.
