id: JHN.6.16
reference: John 6:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς δὲ ὀψία ἐγένετο κατέβησαν οἱ μαθηταὶ αὐτοῦ ἐπὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/016.yaml
  text: When evening came[a], his disciples went down to the sea,
translation:
  language: fr
  text: Quand le soir arriva, ses disciples descendirent vers la mer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le lac ». Il s’agit de la mer de Galilée, qui est techniquement un lac, mais le texte grec emploie le mot « mer » (θάλασσα).
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Quand
  rationale: Introduit naturellement la transition temporelle; la légère valeur connective de δέ reste implicite dans la continuité du récit.
- source_word: ὀψία ἐγένετο
  choice: le soir arriva
  rationale: Rend de manière naturelle et proche du grec l'arrivée du soir.
- source_word: κατέβησαν
  choice: descendirent
  rationale: Conserve explicitement l'idée de mouvement vers le bas exprimée par καταβαίνω, dans un registre narratif courant et digne.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: Rendu français naturel de la construction grecque avec possessif.
- source_word: ἐπὶ τὴν θάλασσαν
  choice: vers la mer
  rationale: Avec l'accusatif après un verbe de mouvement, ἐπί indique la direction ou la destination. « Vers » préserve cette nuance sans affirmer davantage que le grec l'arrivée au rivage; « mer » traduit directement θάλασσα.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. Le passé simple convient à la narration biblique écrite sans être archaïque; la phrase conserve la concision du grec.
