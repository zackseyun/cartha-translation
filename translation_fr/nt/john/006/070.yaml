source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: fr
  text: 'Jésus leur répondit : « N’est-ce pas moi qui vous ai choisis, vous les Douze ? Pourtant, l’un de vous est un diable[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un calomniateur ». Le mot grec peut désigner quelqu’un qui accuse faussement ou, dans de nombreux contextes, le Diable. Ici, la formulation semble caractériser cette personne plutôt que l’identifier directement à Satan.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Verbe narratif courant qui introduit naturellement la réponse de Jésus dans un dialogue.
- source_word: Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην;
  choice: N’est-ce pas moi qui vous ai choisis, vous les Douze ?
  rationale: La question introduite par οὐκ appelle une réponse affirmative. La tournure française conserve l’accent porté sur Jésus par ἐγώ et présente « les Douze » comme la désignation reconnue du groupe.
- source_word: καὶ
  choice: Pourtant
  rationale: Dans ce contexte, la conjonction marque le contraste entre le choix des Douze et ce qui est dit de l’un d’eux. « Pourtant » rend ce rapport de façon naturelle sans le renforcer excessivement.
- source_word: ἐξ ὑμῶν εἷς
  choice: l’un de vous
  rationale: Cette formulation idiomatique exprime clairement le sens partitif du grec.
- source_word: διάβολός
  choice: un diable
  rationale: Le nom attribut sans article caractérise ici l’un des disciples plutôt qu’il ne l’identifie explicitement à Satan. « Un diable » conserve la vigueur et l’ambiguïté théologique de l’expression grecque.
theological_decisions:
- issue: διάβολός désigne-t-il directement Satan ou qualifie-t-il l’un des Douze ?
  choice: un diable
  alternative: le diable ; un calomniateur
  rationale: L’absence d’article et la construction attributive favorisent une valeur qualitative. La traduction retenue préserve la force de l’énoncé sans affirmer que le disciple est Satan lui-même ; la note signale aussi le sens lexical de « calomniateur ».
translation_notes:
  register: Français international moderne, naturel et digne. « Vous les Douze » maintient la désignation collective tout en évitant une syntaxe pesante. « Un diable » conserve le caractère saisissant de la parole de Jésus, tandis que la note en précise la portée possible.
