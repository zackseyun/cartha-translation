  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent de narration français, naturel ici dans un récit et fidèle à la vivacité de la formulation source.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif marque le destinataire de la parole; dans le contexte, il renvoie à Jésus.
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: L’un de ses disciples
  rationale: Cette formulation française naturelle restitue exactement la construction partitive «un parmi ses disciples».
- source_word: μαθητῶν
  choice: disciples
  rationale: «Disciples» est le terme courant dans les Évangiles et conserve les dimensions d’apprentissage et d’attachement personnel.
- source_word: Ἀνδρέας
  choice: André
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et largement reconnue.
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: le frère de Simon Pierre
  rationale: Cette apposition reproduit clairement et naturellement l’identification familiale exprimée par le génitif grec.
- source_word: Σίμωνος Πέτρου
  choice: Simon Pierre
  rationale: Les deux noms forment ici la désignation connue du même personnage; la forme française usuelle est conservée.
