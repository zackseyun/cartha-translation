id: JHN.6.64
reference: John 6:64
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: fr
  text: Mais il y en a parmi vous qui ne croient pas. En effet, Jésus savait dès le commencement qui étaient ceux qui ne croyaient pas et qui était celui qui allait le livrer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le trahir ». Le verbe grec signifie littéralement « livrer » ou « remettre » quelqu’un; dans ce contexte, l’acte constitue une trahison.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque naturellement le contraste avec la déclaration précédente.
- source_word: ἐξ ὑμῶν τινες
  choice: il y en a parmi vous
  rationale: Expression française idiomatique indiquant qu’un certain nombre de personnes appartiennent au groupe auquel Jésus s’adresse.
- source_word: οἳ οὐ πιστεύουσιν
  choice: qui ne croient pas
  rationale: Le présent français exprime naturellement leur incrédulité actuelle et persistante.
- source_word: ᾔδει
  choice: savait
  rationale: L’imparfait rend l’état de connaissance passé exprimé par la forme de οἶδα et convient au cadre narratif.
- source_word: ἐξ ἀρχῆς
  choice: dès le commencement
  rationale: Préserve la portée temporelle sans préciser abusivement de quel commencement il s’agit.
- source_word: οἱ μὴ πιστεύοντες
  choice: ceux qui ne croyaient pas
  rationale: Rend le participe substantivé et l’état continu d’incrédulité dans un français naturel, avec concordance au récit passé.
- source_word: παραδώσων αὐτόν
  choice: qui allait le livrer
  rationale: Rend la valeur prospective du participe futur et conserve le sens premier de remise aux autorités, sans effacer la dimension contextuelle de trahison.
theological_decisions:
- issue: Sens de πιστεύω dans la réaction des disciples à Jésus
  choice: croire
  alternative: mettre sa confiance en
  rationale: « Croire » demeure le terme johannique le plus large et le plus naturel en français; il n’impose pas une distinction artificielle entre adhésion et confiance.
- issue: Sens de παραδίδωμι à propos de Judas
  choice: livrer
  alternative: trahir
  rationale: « Livrer » suit de plus près le verbe grec et préserve la tension entre l’acte concret de remettre Jésus et sa nature traîtresse; la note explicite la lecture contextuelle.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation conserve l’ambiguïté de « dès le commencement » et préfère « livrer » dans le texte principal afin de rester proche du grec, tout en signalant « trahir » en note.
