  source_fidelity: La distinction essentielle entre τοὺς ἀνθρώπους (« les gens », la foule au sens général) et οἱ ἄνδρες (« les hommes ») est bien maintenue. « Faites asseoir » rend correctement l’impératif causatif. La finale actuelle, « ils étaient environ cinq mille », est intelligible, mais elle reformule plus librement τὸν ἀριθμὸν ὡς πεντακισχίλιοι et la ponctuation au point-virgule est peu naturelle ici.
  naturalness: Le français est globalement moderne et clair. « Les hommes s’assirent donc, au nombre d’environ cinq mille » est plus fluide dans ce registre narratif et rattache directement le nombre aux hommes. La formulation de la note b doit éviter de présenter « s’allongèrent » comme une équivalence simple de la posture de repas.
  terminology: « Gens » et « hommes » rendent convenablement le contraste lexical grec. « Herbe » est exact pour χόρτος. « S’asseoir » est un choix français naturel; la note doit signaler sobrement la possibilité de la position inclinée lors d’un repas sans surtraduire le verbe.
