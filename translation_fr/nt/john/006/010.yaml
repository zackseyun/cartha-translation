  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: fr
  text: 'Jésus dit : « Faites asseoir les gens[a]. » Il y avait beaucoup d’herbe à cet endroit. Les hommes s’assirent donc[b], au nombre d’environ cinq mille.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit d’abord « les gens » (ἀνθρώπους), terme général désignant la foule, puis « les hommes » (ἄνδρες), ce qui indique que le nombre d’environ cinq mille se rapporte spécifiquement aux hommes.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi désigner le fait de prendre place en position inclinée pour un repas. « S’assirent » est ici plus naturel en français.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε … ἀναπεσεῖν
  choice: Faites asseoir
  rationale: La construction causative de ποιέω avec l’infinitif exprime l’ordre de faire prendre place au groupe. « Faites asseoir » est naturel en français et conserve la force de l’impératif.
- source_word: τοὺς ἀνθρώπους
  choice: les gens
  rationale: ἄνθρωποι désigne ici l’ensemble des personnes présentes. « Les gens » rend ce sens collectif général tout en permettant de le distinguer de οἱ ἄνδρες plus loin.
- source_word: ἀναπεσεῖν / ἀνέπεσαν
  choice: asseoir / s’assirent
  rationale: ἀναπίπτω peut évoquer la position inclinée adoptée pour un repas, mais, dans cette scène en plein air, « s’asseoir » exprime clairement et naturellement l’action sans imposer une posture trop précise.
- source_word: χόρτος πολὺς
  choice: beaucoup d’herbe
  rationale: Cette formulation simple et actuelle traduit directement l’abondance d’herbe signalée par le grec.
- source_word: ἐν τῷ τόπῳ
  choice: à cet endroit
  rationale: « À cet endroit » est une expression locative idiomatique en français et reprend naturellement le lieu où se trouve la foule.
- source_word: οἱ ἄνδρες
  choice: les hommes
  rationale: ἀνήρ désigne spécifiquement les hommes, contrairement au terme général ἄνθρωποι employé auparavant. La traduction conserve cette différence lexicale.
- source_word: τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: ils étaient environ cinq mille
  rationale: « Environ » rend l’approximation marquée par ὡς, tandis que la tournure française exprime naturellement le nombre indiqué par τὸν ἀριθμόν.
theological_decisions:
- issue: Le groupe précisément dénombré dans le récit
  choice: Distinguer « les gens » (ἀνθρώπους) de « les hommes » (ἄνδρες).
  alternative: Traduire les deux termes par « les gens » ou « les personnes ».
  rationale: Le texte grec passe d’un terme général désignant la foule à un terme masculin spécifique pour le groupe compté. Maintenir cette distinction évite d’élargir silencieusement le nombre d’environ cinq mille à toute la foule.
translation_notes:
  register: Français international moderne, clair et digne. La formulation reste narrative et accessible. Les marqueurs de notes sont placés après les expressions qu’ils éclairent, et la distinction entre le terme collectif général et le terme masculin spécifique est conservée.
