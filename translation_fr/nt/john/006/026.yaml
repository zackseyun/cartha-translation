id: JHN.6.26
reference: John 6:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: fr
  text: 'Jésus leur répondit : « En vérité, en vérité, je vous le dis, vous me cherchez, non parce que vous avez vu des signes, mais parce que vous avez mangé de ces pains et que vous avez été rassasiés.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « vous avez mangé des pains et vous avez été remplis ». Le grec dit « des pains » au pluriel et emploie un verbe qui signifie être nourri jusqu’à satiété.'
    reason: Précision lexicale sur ἐκ τῶν ἄρτων et ἐχορτάσθητε.
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Jésus leur répondit
  rationale: Le grec emploie la formule narrative redoublée « répondit et dit ». En français naturel, « leur répondit » introduit pleinement la parole directe sans lourdeur.
- source_word: Ἀμὴν ἀμὴν
  choice: En vérité, en vérité
  rationale: Cette formulation conserve la répétition solennelle propre à Jean tout en rendant clairement le sens de ἀμήν en français courant et digne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: La tournure française usuelle préserve la solennité et l'adresse explicite du grec.
- source_word: ζητεῖτέ με
  choice: vous me cherchez
  rationale: Le présent français exprime naturellement leur démarche en cours et maintient le thème johannique de la recherche de Jésus.
- source_word: οὐχ ὅτι … ἀλλ’ ὅτι
  choice: non parce que… mais parce que
  rationale: Cette construction rend clairement le contraste entre les deux motifs sans ajouter d'interprétation.
- source_word: εἴδετε
  choice: vous avez vu
  rationale: Le passé composé convient ici au récit français et ne transforme pas le simple fait d'avoir vu en perception spirituelle.
- source_word: σημεῖα
  choice: signes
  rationale: « Signes » conserve le vocabulaire caractéristique de Jean et la fonction révélatrice des actes de Jésus, contrairement au terme plus général « miracles ».
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: vous avez mangé de ces pains
  rationale: « De ces pains » garde le pluriel et rend de façon naturelle la nuance partitive de ἐκ, en renvoyant aux pains mentionnés dans le récit.
- source_word: ἐχορτάσθητε
  choice: vous avez été rassasiés
  rationale: Le passif est conservé, et « rassasiés » exprime le fait d'avoir mangé jusqu'à satiété sans réduire le sens à une simple satisfaction subjective.
theological_decisions:
- issue: Portée de σημεῖα dans le contexte johannique
  choice: signes
  alternative: miracles ; signes miraculeux
  rationale: Jean présente les œuvres de Jésus comme des actes qui renvoient au-delà d'eux-mêmes. « Signes » préserve cette portée théologique sans ajouter d'explication au texte.
- issue: Nature du reproche adressé à la foule
  choice: Conserver le contraste explicite entre avoir vu les signes et avoir mangé à satiété
  alternative: Expliciter qu'ils n'ont pas compris la signification spirituelle des signes
  rationale: Le verset oppose directement deux motifs, mais ne formule pas ici toute l'interprétation spirituelle de cette opposition. La traduction laisse donc subsister la tension du texte.
translation_notes:
  register: Français international moderne, clair et digne. La formule « En vérité, en vérité » maintient la solennité johannique; « rassasiés » reste courant tout en conservant la force du verbe grec.
