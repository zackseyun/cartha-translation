  text: ἀνῆλθεν δὲ εἰς τὸ ⸀ὄρος Ἰησοῦς, καὶ ἐκεῖ ἐκάθητο μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: fr
  text: Alors Jésus monta sur la montagne et là, il était assis avec ses disciples.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: monta
  rationale: L’aoriste de ἀνέρχομαι décrit ici un déplacement géographique ordinaire vers un lieu élevé. « Monta » est naturel et précis en français.
- source_word: δὲ
  choice: Alors
  rationale: δέ assure ici la progression du récit plutôt qu’une opposition marquée. « Alors » rend clairement cet enchaînement narratif.
- source_word: εἰς τὸ ὄρος
  choice: sur la montagne
  rationale: Avec ἀνῆλθεν, l’expression désigne le mouvement vers le haut de la montagne. « Sur la montagne » est idiomatique en français et conserve l’article défini sans suggérer nécessairement une montagne nommée.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française conventionnelle du nom propre.
- source_word: ἐκεῖ
  choice: là
  rationale: Cet adverbe locatif simple est rendu naturellement par « là ».
- source_word: ἐκάθητο
  choice: il s’assit
  rationale: Dans cette progression narrative, « il s’assit » exprime naturellement l’installation de Jésus en position assise. L’imparfait grec peut aussi être compris comme « il était assis », mais le contexte immédiat favorise ici la formulation dynamique.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: avec ses disciples
  rationale: μετά avec le génitif signifie « avec ». « Disciples » conserve la relation de formation et d’attachement à un maître propre au contexte des Évangiles.
