id: JHN.6.46
reference: John 6:46
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: fr
  text: 'Ce n’est pas que quelqu’un ait vu le Père, sauf celui qui est de Dieu[a] : lui a vu le Père.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « auprès de Dieu » ou « venant de la présence de Dieu ». L’expression grecque indique principalement la provenance, tout en pouvant évoquer une proximité personnelle avec Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: Ce n’est pas que
  rationale: Introduit une précision corrective par rapport à ce qui précède, et non une proposition causale.
- source_word: τὸν πατέρα
  choice: le Père
  rationale: Rend l’usage johannique habituel de Dieu comme Père; la majuscule marque cette désignation divine sans ajouter de contenu.
- source_word: ἑώρακέν τις
  choice: quelqu’un ait vu
  rationale: Après « Ce n’est pas que », le subjonctif passé est idiomatique en français et exprime l’action accomplie du parfait grec.
- source_word: εἰ μὴ
  choice: sauf
  rationale: Marque ici une exception et non une condition.
- source_word: ὁ ὢν
  choice: celui qui est
  rationale: Conserve la force identificatrice du participe présent substantivé et la relation continue qu’il exprime.
- source_word: παρὰ τοῦ θεοῦ
  choice: auprès de Dieu
  rationale: παρά avec le génitif peut exprimer la provenance tout en évoquant la proximité personnelle. « Auprès de Dieu » préserve ici cette nuance relationnelle, tandis que la note signale explicitement la lecture de provenance.
- source_word: οὗτος
  choice: lui
  rationale: Renvoie avec insistance à la personne qui vient d’être désignée; le pronom disjoint restitue naturellement cette emphase en français.
- source_word: ἑώρακεν
  choice: a vu
  rationale: Le passé composé français rend naturellement l’action accomplie du parfait grec avec sa pertinence actuelle.
theological_decisions:
- issue: Relation de celui qui voit le Père à Dieu dans παρὰ τοῦ θεοῦ
  choice: auprès de Dieu
  alternative: de Dieu
  rationale: La formulation principale conserve la possible nuance de proximité personnelle sans définir davantage la nature métaphysique de cette relation. La note maintient l’autre sens lexical important, celui de provenance ou d’origine.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la correction initiale, l’exception exclusive et l’emphase sur « lui », sans expliciter l’identité de « celui » au-delà du texte grec.
