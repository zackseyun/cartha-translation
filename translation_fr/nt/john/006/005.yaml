source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: fr
  text: 'Jésus leva donc les yeux et, voyant qu’une grande foule venait vers lui, dit à Philippe : « Où achèterons-nous du pain[a] pour que ces gens puissent manger ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « des pains » ou « des miches de pain ». Le mot grec peut désigner le pain en général ou des pains pris individuellement.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάρας … τοὺς ὀφθαλμούς
  choice: leva les yeux
  rationale: Cette expression française naturelle conserve l’image de l’idiome grec sans alourdir la phrase.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque le développement du récit et son lien avec ce qui précède ; « donc » en maintient explicitement la force.
- source_word: θεασάμενος
  choice: voyant
  rationale: Le participe exprime une observation effective ; « voyant » en conserve le sens et permet de maintenir la relation participiale avec le verbe principal.
- source_word: πολὺς ὄχλος
  choice: une grande foule
  rationale: Rend clairement l’importance numérique de la foule dans un français moderne et courant.
- source_word: ἔρχεται πρὸς αὐτόν
  choice: venait vers lui
  rationale: L’imparfait progressif convient à l’action en cours dans le récit, tandis que « vers lui » préserve la valeur directionnelle de πρός.
- source_word: λέγει πρὸς Φίλιππον
  choice: dit à Philippe
  rationale: Le passé simple rend naturellement le présent historique grec dans un récit français écrit, et « à Philippe » exprime clairement le destinataire.
- source_word: Πόθεν ἀγοράσωμεν
  choice: Où achèterons-nous
  rationale: Le grec emploie une question délibérative portant sur la provenance ou le lieu d’approvisionnement. La formulation française est naturelle sans ajouter une idée étrangère au texte.
- source_word: ἄρτους
  choice: du pain
  rationale: Le pluriel grec peut désigner des pains individuels ou le pain comme nourriture ; le collectif français « du pain » convient naturellement au contexte.
- source_word: ἵνα φάγωσιν οὗτοι
  choice: pour que ces gens puissent manger
  rationale: « Pour que » exprime la finalité de ἵνα ; « ces gens » explicite naturellement la référence humaine du démonstratif οὗτοι sans la remplacer par « la foule ».
theological_decisions:
- issue: Rapport entre les participes initiaux et le verbe principal
  choice: « leva … et, voyant …, dit »
  alternative: « ayant levé les yeux et vu…, Jésus dit »
  rationale: La formulation retenue conserve la séquence des actions et la subordination de « voyant », tout en produisant une narration française fluide. Ce choix stylistique n’ajoute aucune interprétation doctrinale.
- issue: Valeur de la question délibérative Πόθεν ἀγοράσωμεν
  choice: « Où achèterons-nous… ? »
  alternative: « D’où achèterions-nous… ? » ou « Où pourrions-nous acheter… ? »
  rationale: La traduction retenue garde l’implication collective de la première personne du pluriel et le caractère pratique de la question, sans laisser entendre une incapacité que le grec n’énonce pas explicitement.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans être archaïque. La syntaxe reste proche du grec tout en évitant une accumulation peu naturelle de participes.
