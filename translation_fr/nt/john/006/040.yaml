  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: fr
  text: Car la volonté de mon Père, c’est que toute personne qui voit le Fils[a] et croit en lui ait la vie éternelle, et moi, je la ressusciterai au dernier jour.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui porte son regard sur le Fils ». Le verbe grec peut évoquer un regard attentif, et non la seule perception visuelle.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement « et moi, je le ressusciterai au dernier jour » : le pronom grec traduit par « moi » est exprimé pour mettre l’accent sur celui qui accomplira cette résurrection.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: Car… c’est
  rationale: « Car » conserve la valeur explicative de γάρ et relie naturellement le verset à ce qui précède. La tournure disloquée « la volonté… c’est que » est idiomatique en français moderne.
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: la volonté de mon Père
  rationale: « Volonté » rend directement θέλημα. « Père » est employé comme titre relationnel désignant Dieu.
- source_word: πᾶς ὁ θεωρῶν τὸν υἱόν
  choice: toute personne qui voit le Fils
  rationale: La formule rend la portée générique de πᾶς avec le participe substantivé. « Voir » reste clair et naturel, tandis qu’une note signale la nuance possible d’un regard attentif portée par θεωρέω.
- source_word: καὶ πιστεύων εἰς αὐτόν
  choice: et croit en lui
  rationale: « Croire en » exprime naturellement en français la foi dirigée vers une personne et correspond à πιστεύω construit avec εἰς.
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: ait la vie éternelle
  rationale: Le subjonctif français après « c’est que » reflète naturellement le subjonctif grec régi par ἵνα, sans transformer la proposition en simple constat indicatif.
- source_word: καὶ ἀναστήσω αὐτὸν ἐγώ
  choice: et moi, je la ressusciterai
  rationale: Le pronom disjoint « moi » et la reprise par « je » rendent l’emphase explicite de ἐγώ. « Ressusciter » exprime sans ambiguïté le relèvement eschatologique. Le pronom français « la » reprend grammaticalement « toute personne » sans déterminer le sexe.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: au dernier jour
  rationale: Formulation française naturelle et consacrée pour le complément temporel grec.
theological_decisions:
- issue: Portée et condition dans πᾶς ὁ θεωρῶν… καὶ πιστεύων
  choice: que toute personne qui voit le Fils et croit en lui ait la vie éternelle
  alternative: que quiconque contemple le Fils et croit en lui a la vie éternelle
  rationale: La traduction conserve la formulation générique et les deux participes coordonnés, sans introduire de cadre doctrinal concernant l’élection ou la liberté humaine. Le subjonctif maintient la structure de ἵνα sans affaiblir la promesse.
- issue: Emphase de ἐγώ
  choice: et moi, je la ressusciterai
  alternative: et je la ressusciterai
  rationale: La dislocation française préserve l’accent placé sur l’action personnelle de Jésus, explicitement marqué par le pronom grec.
- issue: Référent individuel de αὐτόν après πᾶς
  choice: je la ressusciterai
  alternative: je le ressusciterai
  rationale: Le grec reprend chaque membre du groupe générique au singulier. En français, « la » reprend correctement « toute personne » et maintient la portée individuelle sans employer un masculin générique potentiellement moins inclusif.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe « la volonté… c’est que » évite une formulation raide, tandis que « moi, je » reproduit une emphase naturelle à l’oral comme à l’écrit. Les marqueurs de notes [a] et [b] figurent tous deux dans le texte.
