  - severity: medium
    issue: « Autant de poissons » transforme la quantité désirée en nombre d’unités.
    rationale: La construction ἐκ τῶν ὀψαρίων ... ὅσον ἤθελον est mieux rendue en français par « du poisson, autant qu’ils en voulaient ».
  - severity: low
