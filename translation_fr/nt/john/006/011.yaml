  source_fidelity: La première proposition rend fidèlement les pains, l’action de grâce et la distribution. Toutefois, « ceux qui étaient à table » atténue l’image explicite de τοῖς ἀνακειμένοις, qui désigne des convives allongés/reclinés pour le repas. Dans la seconde proposition, « autant de poissons » suggère un nombre de poissons, alors que ἐκ τῶν ὀψαρίων ... ὅσον ἤθελον exprime plus naturellement une quantité de poisson distribuée selon leur désir. « Distribua » rend aussi mieux le préfixe distributif de διέδωκεν que « donna ».
  naturalness: « Allongés pour le repas » est naturel, clair en français international moderne et conserve la précision culturelle sans lourdeur. « Du poisson, autant qu’ils en voulaient » est idiomatique et évite l’ambiguïté quantitative de « autant de poissons ».
  terminology: « Rendre grâce » est exact pour εὐχαριστήσας et ne surcharge pas le texte d’une interprétation sacramentelle. « Pains », « distribua » et « poisson » conviennent au registre biblique moderne.
