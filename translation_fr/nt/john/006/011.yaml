  to: Alors Jésus prit les pains et, après avoir rendu grâce, les distribua à ceux qui étaient allongés pour le repas[a] ; de même, il leur distribua du poisson, autant qu’ils en voulaient[b].
  rationale: La révision conserve le sens narratif et les ellipses du grec tout en rendant explicitement, mais naturellement, la posture des convives. Elle restitue la quantité de poisson distribuée selon le désir de chacun, plutôt qu’un nombre de poissons, et maintient le parallélisme du verbe « distribuer ».
