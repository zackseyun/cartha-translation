source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: fr
  text: Alors Jésus prit les pains et, après avoir rendu grâce, les distribua à ceux qui étaient allongés pour le repas[a] ; de même, il leur distribua du poisson, autant qu’ils en voulaient[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec désigne des personnes allongées ou reclinées pour prendre le repas, posture habituelle à cette époque.
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « de petits poissons ». Le terme grec peut désigner du poisson consommé avec du pain, peut-être de petits poissons.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: Alors
  rationale: Le connecteur marque ici la progression du récit. « Alors » est naturel en français moderne sans donner au lien une force déductive excessive.
- source_word: τοὺς ἄρτους
  choice: les pains
  rationale: Le pluriel désigne les pains individuels mentionnés dans le récit et se rend directement et naturellement par « les pains ».
- source_word: εὐχαριστήσας
  choice: après avoir rendu grâce
  rationale: Cette formulation exprime clairement l’antériorité du participe aoriste par rapport à la distribution, sans ajouter explicitement un destinataire absent du grec.
- source_word: διέδωκεν
  choice: il les distribua
  rationale: Le verbe exprime une distribution parmi les convives ; le pronom reprend naturellement « les pains ».
- source_word: τοῖς ἀνακειμένοις
  choice: à ceux qui étaient à table
  rationale: L’expression grecque évoque littéralement des personnes allongées pour prendre le repas. « À table » communique naturellement la situation en français moderne, tandis que la note conserve l’image culturelle précise.
- source_word: ὁμοίως καὶ ἐκ τῶν ὀψαρίων
  choice: il leur donna de même autant de poissons
  rationale: Le grec laisse le verbe elliptique dans la seconde proposition. « Il leur donna » l’explicite naturellement en français, tandis que « de même » préserve le parallélisme. « Poissons » évite de préciser indûment leur taille.
- source_word: ὅσον ἤθελον
  choice: autant … qu’ils en voulaient
  rationale: Cette tournure idiomatique exprime la quantité disponible selon le désir des convives et conserve l’idée d’abondance sans l’amplifier.
theological_decisions:
- issue: Résonance eucharistique possible de εὐχαριστήσας dans le récit de la multiplication
  choice: « après avoir rendu grâce », sans développement sacramentel
  alternative: « après avoir béni » ou expliciter une portée eucharistique
  rationale: Le verbe grec signifie ici rendre grâce. La traduction conserve le vocabulaire du texte sans harmonisation avec les récits synoptiques ni interprétation sacramentelle ajoutée.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. « Étaient à table » privilégie l’intelligibilité immédiate, avec la précision historique conservée en note.
