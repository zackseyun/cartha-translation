  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: fr
  text: 'Philippe lui répondit : « Deux cents deniers de pain ne leur suffiraient pas pour que chacun en reçoive un peu. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διακοσίων δηναρίων ἄρτοι
  choice: Même pour deux cents deniers de pain
  rationale: Le génitif de prix désigne du pain acheté pour deux cents deniers. « Même pour » rend naturellement en français la portée implicite de cette somme considérable sans convertir arbitrairement sa valeur.
- source_word: οὐκ ἀρκοῦσιν αὐτοῖς
  choice: il n’y en aurait pas assez
  rationale: Cette tournure idiomatique reprend « du pain » par « en » et exprime l’insuffisance indiquée par ἀρκοῦσιν.
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: pour que chacun en reçoive un peu
  rationale: « Pour que » conserve la relation introduite par ἵνα, tandis que « un peu » rend βραχύ τι sans préciser une quantité absente du grec.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le terme historique « deniers » est conservé; la construction hypothétique française rend le calcul implicite de Philippe sans ajouter d’explication au verset.
