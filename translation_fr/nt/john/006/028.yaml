id: JHN.6.28
reference: John 6:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: fr
  text: 'Ils lui dirent donc : « Que devons-nous faire pour accomplir les œuvres de Dieu[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut aussi se comprendre ainsi : « les œuvres que Dieu demande » ou « les œuvres que Dieu accomplit ».'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: Ils dirent
  rationale: L’aoriste de λέγω se rend naturellement par le passé simple dans un récit écrit soutenu ; il désigne simplement l’acte de parler sans le préciser davantage.
- source_word: οὖν
  choice: donc
  rationale: 'οὖν marque ici la continuité assortie d’une conséquence : la question répond à ce qui précède. « Donc » conserve cette valeur sans imposer une conclusion trop forte.'
- source_word: πρὸς αὐτόν
  choice: lui
  rationale: Avec un verbe de parole, πρός suivi de l’accusatif désigne le destinataire. En français, le pronom indirect « lui » est la formulation idiomatique.
- source_word: Τί ποιῶμεν
  choice: Que devons-nous faire
  rationale: Le subjonctif présent dans cette question délibérative porte sur la conduite requise. « Devons-nous » en exprime clairement la portée pratique.
- source_word: ἵνα
  choice: pour
  rationale: ἵνα introduit ici le but. L’infinitif français précédé de « pour » rend ce rapport de manière naturelle et concise.
- source_word: ἐργαζώμεθα τὰ ἔργα
  choice: accomplir les œuvres
  rationale: ἐργάζομαι peut signifier travailler, produire ou accomplir. « Accomplir les œuvres » évite en français la lourdeur de « travailler les œuvres », tout en conservant le nom ἔργα et sa portée.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: 'Le génitif grec demeure ouvert : il peut désigner les œuvres exigées par Dieu, celles qui lui appartiennent ou celles qu’il accomplit. « De Dieu » préserve cette ambiguïté.'
theological_decisions:
- issue: Sens du génitif dans τὰ ἔργα τοῦ θεοῦ
  choice: Conserver « les œuvres de Dieu » dans le texte principal.
  alternative: « les œuvres que Dieu demande » ; « les œuvres qui appartiennent à Dieu » ; « les œuvres que Dieu accomplit »
  rationale: Le génitif est sémantiquement ouvert, et le verset suivant exploite la notion d’« œuvre de Dieu ». La traduction ne doit pas trancher une tension que le grec laisse subsister.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Accomplir » rend idiomatiquement ἐργάζομαι avec ἔργα, tandis que la note signale l’ambiguïté réelle du génitif.
