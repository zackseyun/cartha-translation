source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: fr
  text: 'Alors, après avoir vu le signe qu’il avait accompli[a], les gens disaient : « C’est vraiment le Prophète[b] qui vient dans le monde. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le miracle qu’il avait accompli ». Jean emploie régulièrement le mot « signe » (σημεῖον) pour souligner ce que les œuvres de Jésus révèlent, et pas seulement leur caractère miraculeux.
    reason: lexical_alternative
  - marker: b
    text: « Le Prophète » désigne probablement le prophète attendu, semblable à Moïse (Deutéronome 18.15-18).
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: les gens … donc
  rationale: ἄνθρωποι désigne ici les personnes présentes, sans restriction aux hommes. « Les gens » est naturel en français moderne, tandis que « donc » maintient le lien narratif et logique exprimé par οὖν.
- source_word: ἰδόντες
  choice: Voyant
  rationale: Le participe aoriste indique que leur réaction fait suite à ce qu’ils ont vu. La tournure participiale française reste fluide et conserve le lien étroit entre la vue du signe et leur déclaration.
- source_word: ὃ ἐποίησεν σημεῖον
  choice: le signe qu’il avait accompli
  rationale: Dans Jean, σημεῖον désigne un acte miraculeux porteur de révélation; « signe » préserve cette portée. « Accomplir un signe » est idiomatique et plus digne que « faire un signe », tandis que le plus-que-parfait situe l’acte avant leur réaction.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec peut présenter une parole en cours ou répétée; l’imparfait français en conserve naturellement l’aspect sans imposer l’idée plus forte qu’ils ne cessaient de le répéter.
- source_word: ἀληθῶς
  choice: vraiment
  rationale: « Vraiment » exprime naturellement la certitude ou la reconnaissance authentique portée par ἀληθῶς.
- source_word: Οὗτός ἐστιν
  choice: C’est vraiment lui
  rationale: La construction française avec « lui » rend l’insistance démonstrative de Οὗτός sans lourdeur.
- source_word: ὁ προφήτης
  choice: le Prophète
  rationale: L’article défini présente une figure attendue et identifiable. La majuscule signale discrètement l’emploi quasi titulaire sans préciser dans le texte principal l’identité exacte de cette figure.
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: qui vient dans le monde
  rationale: Cette formulation conserve le participe présent et l’expression johannique, sans transformer explicitement la phrase en prédiction passée.
theological_decisions:
- issue: Identification du « Prophète »
  choice: Traduire « le Prophète » sans l’identifier explicitement dans le texte principal.
  alternative: « le prophète semblable à Moïse » ou « un prophète »
  rationale: Le contexte évoque probablement le prophète attendu selon Deutéronome 18.15-18, mais le grec dit seulement « le Prophète ». La traduction conserve cette tension et laisse l’allusion être expliquée en note.
- issue: Portée de σημεῖον
  choice: Conserver « signe » dans le texte principal.
  alternative: « miracle »
  rationale: L’acte est bien miraculeux, mais le vocabulaire johannique souligne aussi sa fonction révélatrice. « Signe » évite de réduire cette portée théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase garde l’aspect duratif de l’imparfait grec, le vocabulaire johannique du « signe » et l’ambiguïté référentielle du titre « le Prophète ».
