  source_fidelity: Le texte traduit fidèlement le grec SBLGNT. « Et nous, nous » rend de façon naturelle l’emphase de ἡμεῖς. « Nous avons cru » reflète bien le parfait πεπιστεύκαμεν, et « nous savons » exprime idiomatiquement en français l’état présent résultant du parfait ἐγνώκαμεν, sans ajouter de contenu. « Le Saint de Dieu » correspond directement à ὁ ἅγιος τοῦ θεοῦ et préserve l’ampleur du génitif.
  naturalness: Le français est moderne, clair et d’un registre approprié. La dislocation « nous, nous » est légèrement marquée, mais elle est naturelle ici et justifiée par l’emphase grecque. L’enchaînement « avons cru et nous savons » est idiomatique.
