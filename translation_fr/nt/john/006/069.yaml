id: JHN.6.69
reference: John 6:69
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ⸀ἅγιος τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: fr
  text: Et nous, nous avons cru et nous savons que tu es le Saint de Dieu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Quelques manuscrits portent : « le Christ, le Fils du Dieu vivant ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « le Saint venu de Dieu ». Le génitif grec peut exprimer une relation ou une origine.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: nous, nous
  rationale: Le pronom explicite est emphatique en grec. La dislocation « nous, nous » rend naturellement ce contraste en français, probablement avec ceux qui viennent de se retirer.
- source_word: πεπιστεύκαμεν
  choice: avons cru
  rationale: Le parfait exprime une foi acquise dont l'effet demeure. Le passé composé français rend idiomatiquement cette antériorité, tandis que le verbe coordonné au présent en manifeste le résultat actuel.
- source_word: ἐγνώκαμεν
  choice: savons
  rationale: Le parfait de γινώσκω présente ici une connaissance acquise et désormais possédée. « Nous savons » est plus naturel en français que « nous avons connu » et évite d'ajouter explicitement une nuance progressive.
- source_word: ὅτι
  choice: que
  rationale: La conjonction introduit le contenu commun de la foi et de la connaissance.
- source_word: ὁ ἅγιος
  choice: le Saint
  rationale: L'adjectif substantivé fonctionne comme un titre christologique. « Le Saint » est une formulation française claire et digne qui conserve sa force titulaire.
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Le génitif marque largement une relation, une appartenance ou une origine. « De Dieu » conserve cette amplitude sans trancher indûment.
theological_decisions:
- issue: Titre christologique en Jean 6.69
  choice: le Saint de Dieu
  alternative: le Saint venu de Dieu ; le Christ, le Fils du Dieu vivant
  rationale: Le texte du SBLGNT porte ὁ ἅγιος τοῦ θεοῦ. La traduction suit directement cette leçon sans l'harmoniser avec Matthieu 16.16 ni avec une expansion manuscrite ultérieure. « De Dieu » préserve la relation génitivale sans la réduire à la seule provenance.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise « nous, nous » préserve l'emphase du pronom grec. La coordination « avons cru et savons » exprime idiomatiquement l'état présent issu des deux parfaits grecs.
