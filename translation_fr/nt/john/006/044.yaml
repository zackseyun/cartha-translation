source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: fr
  text: Personne ne peut venir à moi, à moins que le Père qui m’a envoyé ne l’attire[a] ; et moi, je le ressusciterai au dernier jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne le tire » ou « ne l’entraîne ». Selon le contexte, le verbe grec peut exprimer plus fortement l’action de tirer. « Attire » préserve ici cette possibilité sans imposer une explication particulière de la manière dont le Père amène une personne à moi.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: Personne ne peut
  rationale: Cette formulation française naturelle conserve la négation universelle et l’idée explicite de capacité exprimée par δύναται.
- source_word: ἐλθεῖν πρός με
  choice: venir à moi
  rationale: Rend directement le mouvement vers Jésus tout en préservant, sans l’expliciter davantage, la portée relationnelle du verbe dans ce contexte.
- source_word: ἐὰν μὴ
  choice: à moins que… ne
  rationale: Construction française idiomatique pour la condition exceptive grecque ; le « ne » est ici explétif et ne crée pas une seconde négation.
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: le Père qui m’a envoyé
  rationale: La proposition relative rend naturellement le participe substantivé et conserve la désignation personnelle « le Père ».
- source_word: ἑλκύσῃ
  choice: attire
  rationale: « Attirer » convient au mouvement vers une personne et préserve la possibilité d’une action forte sans imposer l’image plus physique de « traîner » ou de « tirer ».
- source_word: αὐτόν
  choice: le
  rationale: Le pronom masculin singulier reprend de façon représentative la personne désignée par « personne » ; en français, « le » conserve cette forme sans limiter l’énoncé aux hommes.
- source_word: κἀγὼ
  choice: et moi, je
  rationale: Le pronom disjoint suivi du sujet grammatical restitue naturellement en français l’insistance portée par ἐγώ.
- source_word: ἀναστήσω αὐτόν
  choice: je le ressusciterai
  rationale: Dans ce contexte eschatologique, « ressusciter » exprime clairement l’action de relever d’entre les morts et évite l’ambiguïté de « relever » en français courant.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: au dernier jour
  rationale: Formulation française idiomatique qui conserve la référence eschatologique précise.
theological_decisions:
- issue: Portée de ἑλκύσῃ dans un contexte sotériologique discuté
  choice: attire
  alternative: le tire / l’entraîne
  rationale: Le verbe grec peut désigner le fait de tirer avec force selon le contexte. « Attire » garde ici l’idée que le Père amène la personne au Fils sans trancher le débat sur la manière ou l’irrésistibilité de cette action ; la note signale la force possible du terme.
- issue: Valeur représentative du masculin αὐτόν
  choice: le
  alternative: cette personne
  rationale: Le masculin singulier grec est conservé par un pronom français naturel dont l’antécédent est le générique « personne ». Il ne faut donc pas comprendre l’énoncé comme limité aux personnes de sexe masculin.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « à moins que… ne » relève du registre écrit courant ; « et moi, je » conserve l’emphase grecque. Le point-virgule distingue les deux propositions étroitement liées.
