revisions:
- from: Ne travaillez pas pour la nourriture qui périt, mais pour celle qui subsiste en vue de la vie éternelle, celle que le Fils de l’homme vous donnera ; car Dieu le Père a apposé son sceau sur lui.[a]
  to: Ne travaillez pas pour la nourriture qui périt, mais pour celle qui demeure pour la vie éternelle, celle que le Fils de l’homme vous donnera ; car Dieu le Père a apposé son sceau sur lui[a].
  rationale: La révision remplace une tournure française maladroite par « qui demeure pour la vie éternelle », qui rend naturellement le contraste entre ἀπολλυμένην et μένουσαν ainsi que l’orientation exprimée par εἰς. La métaphore du sceau, l’apposition « Dieu le Père » et l’ambiguïté interprétative sont maintenues. L’appel de note est déplacé au plus près du terme qu’il éclaire.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:06:12Z'
review_pass:
  verdict: revise
  source_fidelity: 'Le sens principal est bien rendu : l’impératif prohibitif, l’opposition entre la nourriture périssable et celle qui demeure, le titre « le Fils de l’homme », le don futur et la métaphore du sceau sont conservés. Toutefois, « subsiste en vue de la vie éternelle » rend εἰς de façon possible mais produit une relation sémantique et une collocation peu naturelles en français.'
  naturalness: « Ne travaillez pas pour… mais pour… » est naturel et clair. En revanche, on ne dit pas idiomatiquement qu’une nourriture « subsiste en vue de la vie éternelle » ; « demeure pour la vie éternelle » est à la fois plus fluide et plus proche de la construction grecque.
  terminology: « nourriture », « le Fils de l’homme », « vie éternelle » et « Dieu le Père » sont appropriés. « A apposé son sceau sur lui » préserve convenablement l’image de ἐσφράγισεν. La note explicite la portée possible sans remplacer la métaphore dans le texte.
  issues:
  - severity: medium
    issue: Formulation « qui subsiste en vue de la vie éternelle »
    rationale: Bien que « en vue de » puisse exprimer une finalité, l’expression est peu idiomatique avec « subsister » et obscurcit le lien du grec μένουσαν εἰς ζωὴν αἰώνιον. « Qui demeure pour la vie éternelle » est plus naturel, tout en gardant l’orientation vers la vie éternelle.
  - severity: low
    issue: Placement de l’appel de note
    rationale: L’appel de note explique directement « a apposé son sceau sur lui » ; le placer immédiatement après ce groupe, avant le point final, rend son rattachement plus net.
  revised_text: Ne travaillez pas pour la nourriture qui périt, mais pour celle qui demeure pour la vie éternelle, celle que le Fils de l’homme vous donnera ; car Dieu le Père a apposé son sceau sur lui[a].
  revised_footnotes:
