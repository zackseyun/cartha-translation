id: JHN.6.27
reference: John 6:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: fr
  text: Ne travaillez pas pour la nourriture qui périt, mais pour celle qui demeure pour la vie éternelle, celle que le Fils de l’homme vous donnera ; car Dieu le Père a apposé son sceau sur lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’image du sceau peut exprimer ici l’authentification ou l’autorisation donnée par Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργάζεσθε μὴ ... ἀλλὰ
  choice: Ne travaillez pas pour… mais pour
  rationale: Cette formulation restitue naturellement en français l’impératif présent et l’opposition μὴ… ἀλλὰ. Le contexte donne au verbe le sens de travailler en vue d’obtenir quelque chose.
- source_word: βρῶσιν
  choice: nourriture
  rationale: Dans ce contexte, βρῶσις désigne ce dont on se nourrit, et non l’acte de manger.
- source_word: ἀπολλυμένην
  choice: qui périt
  rationale: Le participe présent décrit une nourriture vouée à la corruption et à la disparition. « Périt » conserve cette portée plus large que « se gâte ».
- source_word: μένουσαν
  choice: qui subsiste
  rationale: « Subsiste » exprime la continuité de μένω et forme un contraste clair avec la nourriture qui périt.
- source_word: εἰς ζωὴν αἰώνιον
  choice: en vue de la vie éternelle
  rationale: La locution rend la direction ou la finalité exprimée par εἰς sans imposer un mécanisme théologique plus précis que le grec.
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Traduction française consacrée de ce titre, qui en préserve la forme et les résonances bibliques.
- source_word: ὑμῖν δώσει
  choice: vous donnera
  rationale: Rend directement le futur et le complément indirect dans un français naturel.
- source_word: ἐσφράγισεν
  choice: a apposé son sceau sur
  rationale: Cette expression conserve l’image concrète du sceau tout en restant intelligible en français moderne.
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: Dieu le Père
  rationale: Cette formulation française naturelle rend l’apposition grecque qui identifie le Père comme Dieu.
theological_decisions:
- issue: Rapport de la nourriture qui subsiste avec la vie éternelle
  choice: en vue de la vie éternelle
  alternative: jusque dans la vie éternelle
  rationale: εἰς peut indiquer le but, la direction ou le résultat. « En vue de » préserve cette orientation sans décider si l’accent porte principalement sur la durée de la nourriture ou sur son effet.
- issue: Sens du sceau apposé sur le Fils de l’homme
  choice: Dieu le Père a apposé son sceau sur lui
  alternative: Dieu le Père l’a authentifié
  rationale: Le texte garde ainsi la métaphore de σφραγίζω au lieu de la remplacer par une seule interprétation, tout en permettant d’en expliquer la portée en note.
- issue: Apposition ὁ πατὴρ ... ὁ θεός
  choice: Dieu le Père
  alternative: le Père, Dieu
  rationale: « Dieu le Père » est idiomatique en français et conserve l’identification explicite du Père comme Dieu sans ajouter de formulation doctrinale étrangère au verset.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve l’opposition rhétorique du grec, le titre « Fils de l’homme » et la métaphore du sceau. Le point-virgule maintient le lien explicatif introduit par γάρ.
