  variant: modern international French
source:
  edition: SBLGNT
  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: fr
  text: Tout ce que le Père me donne viendra à moi, et celui qui vient à moi, je ne le chasserai certainement pas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « je ne le chasserai jamais » ou « je ne le chasserai en aucun cas ». L’expression grecque constitue une négation emphatique.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: Tout ce que
  rationale: Le neutre singulier forme une expression collective. « Tout ce que » en conserve la forme sans la personnaliser en « tous ceux que ».
- source_word: δίδωσίν μοι
  choice: me donne
  rationale: Le présent simple rend naturellement le présent grec sans préciser indûment si le don est continu ou achevé.
- source_word: ὁ πατήρ
  choice: le Père
  rationale: Cette formulation respecte l’article grec et l’usage johannique, sans ajouter le possessif « mon ».
- source_word: πρὸς ἐμὲ ἥξει
  choice: viendra à moi
  rationale: Rend directement le futur et conserve le motif johannique de venir à Jésus.
- source_word: τὸν ἐρχόμενον πρός με
  choice: celui qui vient à moi
  rationale: Reproduit naturellement en français la valeur générique du participe présent substantivé.
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: je ne le chasserai certainement pas
  rationale: « Certainement pas » marque la négation grecque emphatique, tandis que « chasser » exprime l’exclusion renforcée par ἔξω sans lourdeur artificielle.
theological_decisions:
- issue: Le collectif neutre πᾶν ὃ en rapport avec le don du Père et la venue à Jésus
  choice: Tout ce que le Père me donne
  alternative: Tous ceux que le Père me donne
  rationale: Le choix conserve le neutre singulier collectif du grec et évite de trancher la question théologique en faveur d’une lecture explicitement individualisée.
- issue: La portée de la promesse exprimée par οὐ μὴ ἐκβάλω ἔξω
  choice: je ne le chasserai certainement pas
  alternative: je ne le chasserai jamais
  rationale: La traduction préserve l’assurance emphatique de Jésus sans développer le verset en une formulation doctrinale plus large sur la persévérance ou l’apostasie.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle. Le pronom « le » après « celui qui vient » explicite en français le complément sous-entendu de « chasser », sans ajout théologique.
