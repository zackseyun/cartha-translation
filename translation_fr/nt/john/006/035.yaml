source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: fr
  text: 'Jésus leur dit : « Moi, je suis le pain de la vie. Celui qui vient à moi n’aura jamais faim, et celui qui croit en moi n’aura absolument jamais soif[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec cumule une négation très forte et πώποτε, « jamais » ou « à aucun moment ».
    reason: Précise l’intensité de οὐ μή ... πώποτε sans présenter comme littérale une paraphrase française.
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: Jésus leur dit
  rationale: Tour narratif français naturel, qui conserve Jésus comme sujet et αὐτοῖς comme complément indirect.
- source_word: Ἐγώ εἰμι
  choice: C’est moi qui suis
  rationale: Cette tournure française idiomatique rend l’insistance du pronom explicite Ἐγώ dans cette déclaration d’identité, sans ajouter d’explication théologique.
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: le pain de la vie
  rationale: Rendu proche et consacré qui préserve la construction génitive et la force de la métaphore, contrairement à l’interprétation plus explicite « le pain qui donne la vie ».
- source_word: ὁ ἐρχόμενος πρὸς ἐμὲ
  choice: Celui qui vient à moi
  rationale: Le participe présent substantivé a ici une portée générale; cette formulation française la restitue clairement et naturellement.
- source_word: οὐ μὴ πεινάσῃ
  choice: n’aura jamais faim
  rationale: Le futur français accompagné de « jamais » transmet naturellement la négation grecque fortement appuyée.
- source_word: ὁ πιστεύων εἰς ἐμὲ
  choice: celui qui croit en moi
  rationale: « Croire en » est le rendu français courant et transparent de πιστεύω εἰς dans le langage johannique, sans réduire le sens à une simple adhésion intellectuelle.
- source_word: οὐ μὴ διψήσει πώποτε
  choice: n’aura absolument jamais soif
  rationale: « Absolument jamais » rend conjointement la négation emphatique οὐ μή et l’adverbe πώποτε (« jamais, à aucun moment »), sans introduire l’idée non exprimée de « de nouveau ».
theological_decisions:
- issue: Sens de πιστεύων εἰς ἐμέ
  choice: celui qui croit en moi
  alternative: celui qui met sa confiance en moi
  rationale: Le choix principal préserve la formulation johannique habituelle et sa portée ouverte; l’alternative explicite légitimement la dimension de confiance, mais interprète davantage.
- issue: Force de l’auto-identification Ἐγώ εἰμι
  choice: C’est moi qui suis
  alternative: Je suis
  rationale: La tournure retenue marque en français l’insistance du pronom grec explicite, tout en laissant intactes les résonances théologiques possibles de la formule sans les expliquer dans le texte.
- issue: Portée de la promesse de ne plus avoir faim ni soif
  choice: conserver la métaphore sans préciser la nature de la faim et de la soif
  alternative: expliciter une faim et une soif spirituelles
  rationale: Le grec maintient le langage métaphorique et absolu. Une précision telle que « spirituellement » résoudrait une tension que le texte laisse au lecteur.
translation_notes:
  register: Français international moderne, digne et accessible. « C’est moi qui suis » porte l’emphase de Ἐγώ tout en restant naturel. « N’aura faim/soif » est plus idiomatique en français que « ne souffrira pas de la faim/soif ». La ponctuation distingue les deux promesses sans alourdir la phrase.
