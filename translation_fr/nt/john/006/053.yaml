  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: fr
  text: 'Jésus leur dit donc : « En vérité, en vérité, je vous le dis, si vous ne mangez pas la chair du Fils de l’homme et si vous ne buvez pas son sang, vous n’avez pas la vie en vous-mêmes.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le texte grec dit simplement « la vie », et non « la vie éternelle », bien que, dans l’Évangile selon Jean, le contexte plus large associe souvent cette vie à la vie éternelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement en français la conséquence ou la continuité logique avec le discours précédent.
- source_word: Ἀμὴν ἀμὴν
  choice: Oui, je vous le dis en toute vérité
  rationale: Rend la formule johannique redoublée avec solennité et emphase dans un français actuel, sans conserver l’hébraïsme peu transparent « Amen, amen ».
- source_word: ἐὰν μὴ
  choice: si vous ne… pas
  rationale: Construction conditionnelle naturelle en français, répétée devant les deux verbes pour assurer clarté et fluidité.
- source_word: φάγητε
  choice: mangez
  rationale: Conserve le sens concret et direct du verbe grec.
- source_word: σάρκα
  choice: chair
  rationale: Correspond directement à σάρξ et préserve la force concrète, volontairement saisissante, de la parole sans la remplacer par le vocabulaire interprétatif de « corps ».
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: du Fils de l’homme
  rationale: Conserve l’appellation traditionnelle de Jésus ainsi que ses résonances bibliques et messianiques.
- source_word: πίητε
  choice: buvez
  rationale: Rendu littéral qui maintient le parallélisme saisissant avec « mangez ».
- source_word: αἷμα
  choice: sang
  rationale: Préserve sans atténuation l’image concrète et la portée théologique du grec.
- source_word: ζωὴν
  choice: la vie
  rationale: Le grec dit simplement « vie », sans l’adjectif « éternelle » ; l’article français est requis idiomatiquement.
- source_word: ἐν ἑαυτοῖς
  choice: en vous-mêmes
  rationale: Rendu direct qui conserve l’idée de possession intérieure de la vie.
theological_decisions:
- issue: Interprétation du langage consistant à manger la chair et à boire le sang
  choice: Conserver littéralement « mangez la chair… buvez son sang »
  alternative: Employer « prenez part à », « recevez », ou une formulation explicitement eucharistique avec « corps »
  rationale: Le grec est volontairement concret et provocateur. Le rendu retenu maintient la tension entre les lectures sacramentelle, métaphorique ou conjointes sans en imposer une.
- issue: Portée de ζωὴν
  choice: Traduire par « la vie »
  alternative: Expliciter « la vie éternelle »
  rationale: L’adjectif « éternelle » ne figure pas dans ce verset. Le contexte johannique éclaire la nature de cette vie, mais ne justifie pas son ajout dans le texte.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « Oui, je vous le dis en toute vérité » restitue la solennité de Ἀμὴν ἀμὴν sans archaïsme. Les termes concrets « chair » et « sang » sont maintenus afin de ne pas atténuer ni interpréter d’avance la parole.
