source:
  edition: SBLGNT
  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: fr
  text: « Il y a ici un garçon qui a cinq pains d’orge et deux poissons. Mais qu’est-ce que cela pour tant de gens ? »
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδάριον
  choice: garçon
  rationale: Le terme désigne ici un enfant ou un jeune garçon. « Garçon » est naturel en français moderne sans préciser davantage son âge.
- source_word: ὧδε
  choice: ici
  rationale: Cet adverbe locatif se rend directement et naturellement par « ici ».
- source_word: ὃς ἔχει
  choice: qui a
  rationale: La proposition relative identifie le garçon par ce qu’il possède; « qui a » est la formulation française la plus directe.
- source_word: ἄρτους κριθίνους
  choice: pains d’orge
  rationale: ἄρτους désigne des pains et κριθίνους précise qu’ils sont faits d’orge. « Pains d’orge » est concis et idiomatique.
- source_word: ὀψάρια
  choice: poissons
  rationale: Dans ce contexte, le mot désigne du poisson consommé avec du pain. Le pluriel « poissons » reste clair sans ajouter la notion possible, mais non certaine, de petite taille.
- source_word: ἀλλὰ
  choice: mais
  rationale: La conjonction marque simplement le contraste entre les provisions disponibles et le nombre de personnes.
- source_word: ταῦτα τί ἐστιν
  choice: qu’est-ce que cela
  rationale: Le grec emploie un sujet neutre pluriel avec un verbe au singulier et pose une question évaluative. Le collectif français « cela » renvoie naturellement à l’ensemble des provisions tout en conservant la forme rhétorique.
- source_word: εἰς τοσούτους
  choice: pour tant de gens
  rationale: La préposition exprime ici l’adéquation par rapport au grand nombre présent. L’ajout de « gens », implicite en grec, est nécessaire à une formulation française naturelle.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La question finale conserve sa tournure elliptique et sa force rhétorique, sans expliciter l’insuffisance par une paraphrase.
