  yaml_path: translation/nt/john/006/048.yaml
  text: I am the bread of life.
translation:
  language: fr
  text: Je suis le pain de la vie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: Je suis
  rationale: Le pronom sujet explicite, associé au verbe « être », produit une affirmation d’identité nette. « Je suis » est la formulation française naturelle et conserve cette force sans ajouter artificiellement « moi-même ».
- source_word: ὁ ἄρτος
  choice: le pain
  rationale: L’article défini et le nom sont rendus directement par « le pain ». « La miche » serait trop concrète dans ce contexte métaphorique.
- source_word: τῆς ζωῆς
  choice: de la vie
  rationale: Cette formulation préserve le rapport génitif compact et l’expression johannique, sans préciser de manière interprétative « qui donne la vie ».
theological_decisions:
- issue: Portée de la déclaration « Je suis » dans la christologie johannique
  choice: Je suis le pain de la vie.
  alternative: Moi, je suis le pain de la vie.
  rationale: Le grec présente ici une proposition avec attribut, et non un emploi absolu de ἐγώ εἰμι. La traduction conserve la forte identification de Jésus sans explicitation théologique ni emphase ajoutée.
- issue: Sens du génitif « de la vie »
  choice: Conserver « de la vie »
  alternative: le pain qui donne la vie
  rationale: Le génitif peut évoquer un pain caractérisé par la vie ou qui la communique. La traduction littérale maintient cette richesse et évite de réduire l’expression à une seule explication.
translation_notes:
  register: Français international moderne, simple et digne. La formulation traditionnelle demeure pleinement naturelle et suit de près la syntaxe concise du grec.
