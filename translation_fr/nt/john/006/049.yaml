lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: Vos pères
  rationale: « Pères » conserve la forme grecque et, dans ce contexte, désigne naturellement les ancêtres israélites de la génération du désert.
- source_word: ἔφαγον
  choice: ont mangé
  rationale: L’aoriste de ἐσθίω rapporte simplement le fait passé; le passé composé est naturel en français moderne.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: Dans le contexte de l’Exode, « le désert » est la formulation française biblique courante et désigne la région inculte où Israël a séjourné.
- source_word: τὸ μάννα
  choice: la manne
  rationale: L’article défini grec est conservé; il renvoie à la nourriture bien connue du récit de l’Exode.
- source_word: ἀπέθανον
  choice: ils sont morts
  rationale: La proposition exprime leur mort effective; le sujet explicite rend le contraste clair et naturel en français.
theological_decisions:
- issue: Désignation de la génération israélite du désert
  choice: Vos pères
  alternative: Vos ancêtres
  rationale: « Vos pères » maintient le lien rhétorique direct et la formulation genrée du grec sans ajouter d’interprétation; le contexte suffit à indiquer qu’il s’agit des ancêtres.
