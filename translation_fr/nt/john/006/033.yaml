id: JHN.6.33
reference: John 6:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: fr
  text: Car le pain de Dieu, c’est celui qui descend du ciel et qui donne la vie au monde[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce qui descend du ciel et donne la vie au monde ». La formulation grecque peut se comprendre de manière plus impersonnelle, mais les participes masculins favorisent un référent personnel.'
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: Introduit naturellement en français l’explication de l’affirmation précédente.
- source_word: ἄρτος
  choice: pain
  rationale: Conserve l’image concrète qui structure le discours, sans la généraliser en « nourriture ».
- source_word: τοῦ θεοῦ
  choice: de Dieu
  rationale: Préserve la formulation génitive et laisse ouvertes les nuances d’appartenance et d’origine.
- source_word: ὁ καταβαίνων
  choice: celui qui descend
  rationale: Les participes masculins singuliers favorisent un référent personnel; le présent « descend » reste naturel et vivant en français.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: Formulation française idiomatique qui conserve l’idée d’origine exprimée par ἐκ.
- source_word: ζωὴν
  choice: la vie
  rationale: Maintient le terme johannique central dans toute sa simplicité et sa portée.
- source_word: διδοὺς
  choice: qui donne
  rationale: Coordonne naturellement en français les deux actions caractéristiques du référent personnel.
- source_word: τῷ κόσμῳ
  choice: au monde
  rationale: Conserve l’ampleur et l’ambiguïté théologique de κόσμος sans le réduire à une catégorie plus étroite.
theological_decisions:
- issue: Référence personnelle ou impersonnelle de ὁ καταβαίνων… καὶ ζωὴν διδοὺς
  choice: celui qui descend du ciel et qui donne la vie au monde
  alternative: ce qui descend du ciel et donne la vie au monde
  rationale: La forme masculine singulière des participes grecs favorise une référence personnelle, qui anticipe l’identification de Jésus au pain, tout en évitant d’ajouter une explication doctrinale au texte.
- issue: Portée de κόσμος
  choice: le monde
  alternative: l’humanité / tous les êtres humains
  rationale: « Le monde » préserve le vocabulaire johannique et ne tranche pas les débats théologiques concernant l’étendue ou l’application du don de la vie.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure présentative « c’est celui qui » rend clairement l’identification portée par ἐστιν ὁ καταβαίνων, tandis que la répétition de « qui » assure une coordination fluide.
