  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ ⸀πιστεύων ἔχει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: fr
  text: Vraiment, vraiment, je vous le dis, celui qui croit a la vie éternelle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: Vraiment, vraiment
  rationale: La répétition solennelle propre aux déclarations de Jésus dans Jean est conservée, dans un français naturel et digne.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Cette tournure française idiomatique rend directement le présent λέγω et le datif pluriel ὑμῖν, tout en conservant la cadence johannique.
- source_word: ὁ πιστεύων
  choice: celui qui croit
  rationale: L’expression rend le participe présent substantivé, qui désigne la personne caractérisée par le fait de croire, sans ajouter d’objet absent du texte grec.
- source_word: ἔχει
  choice: a
  rationale: Le présent est maintenu afin d’affirmer que la vie éternelle est possédée dès maintenant, plutôt que seulement promise pour l’avenir.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Expression française usuelle et fidèle dans le contexte johannique, qui transmet la portée durable et qualitative de αἰώνιος sans imposer le calque peu naturel « vie de l’âge ».
theological_decisions:
- issue: Possession présente de la vie éternelle
  choice: a la vie éternelle
  alternative: aura la vie éternelle
  rationale: Le présent grec ἔχει doit être conservé. Le rendre au futur modifierait l’affirmation du texte et atténuerait sa tension eschatologique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve la répétition emphatique, le participe substantivé et le présent du texte grec.
