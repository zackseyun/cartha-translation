source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: fr
  text: 'Ils lui dirent donc : « Quel signe fais-tu donc, pour que nous le voyions et que nous te croyions[a] ? Quelle œuvre accomplis-tu ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « que nous croyions en toi » ou « que nous te fassions confiance ». Plus littéralement, le grec dit ici « que nous te croyions », avec le pronom au datif plutôt qu’avec la tournure johannique plus courante « croire en » quelqu’un.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: Ils lui dirent donc
  rationale: « Donc » conserve le lien inférentiel ou séquentiel marqué par οὖν, dans une formulation française naturelle.
- source_word: Τί οὖν
  choice: Quel signe fais-tu donc
  rationale: Le second οὖν est maintenu afin de préserver l'insistance de la réponse des interlocuteurs.
- source_word: ποιεῖς σὺ σημεῖον
  choice: Quel signe fais-tu
  rationale: Le présent français rend directement ποιεῖς, tandis que « signe » préserve le terme johannique σημεῖον sans expliciter d'emblée son caractère miraculeux.
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: pour que nous le voyions et que nous te croyions
  rationale: La construction finale avec ἵνα est rendue par « pour que ». « Te croire » correspond naturellement en français à πιστεύω avec le datif σοι et évite de le confondre avec la tournure johannique habituelle « croire en ».
- source_word: τί ἐργάζῃ
  choice: Quelle œuvre accomplis-tu ?
  rationale: « Œuvre » et « accomplir » rendent la nuance de travail ou d'action de ἐργάζομαι, tout en distinguant cette dernière question du verbe ποιεῖς qui précède.
theological_decisions:
- issue: Valeur de πιστεύω avec le datif σοι
  choice: nous te croyions
  alternative: nous croyions en toi ; nous te fassions confiance
  rationale: Le grec emploie le pronom au datif plutôt que εἰς avec l'accusatif. « Te croire » préserve le sens direct de croire les paroles ou la prétention de Jésus, sans imposer la formule johannique distincte « croire en toi ».
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « donc » reflète les deux occurrences de οὖν. « Quelle œuvre accomplis-tu ? » maintient le parallélisme rhétorique tout en distinguant ἐργάζῃ de ποιεῖς.
