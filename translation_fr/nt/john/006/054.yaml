id: JHN.6.54
reference: John 6:54
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: fr
  text: Celui qui mange[a] ma chair et boit mon sang a la vie éternelle, et moi, je le ressusciterai au dernier jour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec est plus concret que le terme général signifiant « manger » et peut aussi se rendre par « se nourrir de », voire, de façon plus expressive, « mâcher ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Celui qui mange
  rationale: L’article suivi du participe présent désigne une personne caractérisée par cette action. « Celui qui mange » conserve la forme personnelle au singulier et reste naturel en français.
- source_word: τρώγων
  choice: mange
  rationale: Le verbe τρώγω est concret et peut évoquer l’action de mâcher ou de se nourrir de quelque chose. « Mange » rend clairement le sens dans le texte principal sans accentuation excessive; la nuance plus expressive est signalée en note.
- source_word: μου τὴν σάρκα
  choice: ma chair
  rationale: « Chair » correspond ici au sens concret de σάρξ et préserve la formulation saisissante du grec sans la remplacer par une interprétation.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: et boit mon sang
  rationale: La coordination et le parallélisme des deux participes sont conservés; « sang » demeure littéral.
- source_word: ἔχει ζωὴν αἰώνιον
  choice: a la vie éternelle
  rationale: Le présent « a » exprime la possession actuelle, tandis que « vie éternelle » est l’expression française naturelle qui rend la durée et la qualité eschatologique de ζωὴ αἰώνιος.
- source_word: κἀγὼ
  choice: et moi, je
  rationale: Cette tournure française rend naturellement la coordination καί et l’insistance portée par le pronom ἐγώ.
- source_word: ἀναστήσω αὐτόν
  choice: je le ressusciterai
  rationale: Dans ce contexte eschatologique, « ressusciter » exprime idiomatiquement l’action de relever d’entre les morts. Le pronom « le » reprend le singulier « celui ».
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: au dernier jour
  rationale: Expression eschatologique consacrée et naturelle en français, correspondant directement au datif temporel grec.
theological_decisions:
- issue: Faut-il interpréter explicitement l’action de manger et de boire comme eucharistique ou métaphorique?
  choice: Conserver littéralement le langage de la chair mangée et du sang bu.
  alternative: Expliciter dans le texte principal une lecture sacramentelle, ou reformuler comme une métaphore de la foi.
  rationale: Le grec emploie volontairement des termes concrets. Les conserver maintient la tension théologique du passage sans imposer une interprétation confessionnelle.
- issue: Valeur temporelle de « a la vie éternelle » par rapport à la résurrection future
  choice: Maintenir le présent « a » et le futur « ressusciterai ».
  alternative: Faire de la vie éternelle une possession seulement future.
  rationale: Le texte juxtapose expressément la possession présente de la vie éternelle et la résurrection au dernier jour; la traduction ne doit pas effacer cette tension.
- issue: Reprise de αὐτόν
  choice: Employer le pronom masculin singulier « le ».
  alternative: Employer une reprise épicène telle que « cette personne ».
  rationale: Le pronom grec masculin singulier reprend la construction substantivée singulière; « celui… le » conserve cette correspondance grammaticale en français.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe garde le singulier personnel et l’insistance de « et moi, je », tout en préservant le caractère concret et théologiquement non résolu des paroles.
