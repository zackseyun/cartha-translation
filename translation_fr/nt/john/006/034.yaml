  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: fr
  text: 'Ils lui dirent donc : « Seigneur[a], donne-nous toujours ce pain. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur ». Le terme grec peut être une formule de respect ou signifier « Seigneur ».
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον
  choice: Ils dirent
  rationale: L’aoriste de λέγω introduit naturellement les paroles du groupe dans le récit. « Ils dirent » reste précis et sobre.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque ici la réaction qui découle de l’échange précédent. « Donc » conserve clairement ce lien logique et discursif.
- source_word: πρὸς αὐτόν
  choice: lui
  rationale: Avec un verbe de parole, πρός suivi de l’accusatif désigne le destinataire. En français, le pronom indirect « lui » est la tournure idiomatique.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif κύριε peut être une appellation respectueuse ou porter une portée plus haute. « Seigneur » préserve cette ouverture sémantique, tandis qu’une note signale « Monsieur » comme autre possibilité contextuelle.
- source_word: πάντοτε
  choice: toujours
  rationale: « Toujours » rend directement l’idée de continuité exprimée par πάντοτε et convient à la demande d’un approvisionnement durable.
- source_word: δὸς
  choice: donne
  rationale: L’impératif aoriste de δίδωμι formule une demande directe. « Donne » est naturel et ne surélève pas le registre.
- source_word: ἡμῖν
  choice: nous
  rationale: Le datif indique les bénéficiaires du don et se rend naturellement par « nous ».
- source_word: τὸν ἄρτον τοῦτον
  choice: ce pain
  rationale: « Ce pain » conserve le démonstratif et renvoie explicitement au pain dont Jésus vient de parler.
theological_decisions:
- issue: Sens de κύριος dans l’adresse directe à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: La foule ne manifeste pas nécessairement ici une pleine compréhension christologique, mais κύριε demeure susceptible d’être plus qu’une simple formule de politesse. Le texte principal « Seigneur » conserve cette tension, et la note présente le sens respectueux possible sans trancher silencieusement.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre « Ils lui dirent donc » suit l’usage narratif français tout en maintenant le lien logique de οὖν. La demande reste simple et directe.
