reference: John 6:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: fr
  text: C’est le pain qui descend du ciel[a], afin que quiconque en mange ne meure pas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie un participe présent, littéralement « le pain descendant du ciel ».
    reason: lexical_alternative
  - marker: b
    text: L’expression « ne meure pas » reste volontairement large. Dans ce contexte, elle peut être comprise comme désignant la mort ultime, la mort spirituelle ou la destruction à venir.
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: C’est
  rationale: La tournure identifie directement le pain dont parle Jésus. « C’est » est naturelle en français moderne et conserve la force démonstrative du grec.
- source_word: ἄρτος
  choice: pain
  rationale: « Pain » est le sens usuel du terme et préserve à la fois sa portée concrète et sa portée métaphorique dans Jean 6, sans le paraphraser.
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: qui descend du ciel
  rationale: La proposition relative rend naturellement le participe présent grec tout en maintenant l’image dynamique de la descente.
- source_word: οὐρανός
  choice: ciel
  rationale: Dans ce contexte johannique, le mot désigne le domaine céleste et divin, non simplement le ciel visible.
- source_word: ἵνα
  choice: afin que
  rationale: Cette locution exprime clairement la visée de la proposition grecque, qui peut comporter une nuance de but et de résultat.
- source_word: τις
  choice: quiconque
  rationale: Le pronom indéfini a ici une portée générale. « Quiconque » exprime cette ouverture sans limiter l’énoncé à une personne particulière.
- source_word: ἐξ αὐτοῦ φάγῃ
  choice: en mange
  rationale: Le pronom adverbial « en » rend naturellement en français l’idée de manger de ce pain, tandis que le subjonctif convient après « afin que ».
- source_word: μὴ ἀποθάνῃ
  choice: ne meure pas
  rationale: Le verbe grec signifie simplement « mourir ». Cette traduction conserve l’expression large du texte sans préciser indûment la nature de la mort.
theological_decisions:
- issue: Nature de la mort dans « ne meure pas »
  choice: Conserver la formulation simple « ne meure pas », sans préciser s’il s’agit de la mort physique, spirituelle ou définitive.
  alternative: « ne meure pas spirituellement » ou « ne périsse pas pour toujours »
  rationale: Le discours sur le pain de vie oppose le pain ordinaire à la vie que Jésus donne, mais ce verset ne définit pas explicitement la mort en question. La formulation large préserve la profondeur et la tension théologiques du passage.
translation_notes:
  register: Français international moderne, naturel et digne. « C’est » évite une tournure archaïque, tandis que « afin que » et « quiconque » gardent une certaine solennité adaptée au discours sans nuire à la clarté.
