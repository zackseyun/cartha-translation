  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: fr
  text: Lorsque la foule vit que Jésus n’était pas là, ni ses disciples, elle monta elle-même dans les barques[a] et se rendit à Capharnaüm à la recherche de Jésus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les petites barques » ; le grec emploie un diminutif de « barque » ou de « bateau ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Quand donc
  rationale: Conserve à la fois la relation temporelle exprimée par ὅτε et l’enchaînement narratif marqué par οὖν, dans une formulation française concise.
- source_word: ὁ ὄχλος
  choice: la foule
  rationale: Désigne naturellement le groupe rassemblé dans ce contexte narratif.
- source_word: εἶδεν
  choice: vit
  rationale: Rend directement le sens perceptif du verbe sans introduire la nuance plus interprétative de « comprit » ou « constata ».
- source_word: οὐκ ἔστιν ἐκεῖ
  choice: n’était pas là
  rationale: Le présent grec s’inscrit dans un récit au passé; l’imparfait français assure une concordance naturelle des temps.
- source_word: οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: ni ses disciples
  rationale: Préserve sobrement la coordination négative et l’ellipse du verbe, naturelles en français.
- source_word: ἐνέβησαν
  choice: montèrent dans
  rationale: Expression française habituelle pour l’action de prendre place dans une embarcation.
- source_word: αὐτοὶ
  choice: ils… eux-mêmes
  rationale: Maintient l’insistance du pronom grec sur les membres de la foule agissant personnellement; le passage du collectif singulier au pronom pluriel suit le sens et reste compréhensible en français.
- source_word: τὰ πλοιάρια
  choice: les embarcations
  rationale: Terme naturel et précis pour les bateaux concernés; la nuance diminutive possible est signalée en note plutôt que surchargée dans le texte.
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: arrivèrent à Capharnaüm
  rationale: Exprime le déplacement jusqu’à sa destination dans un français narratif naturel, tout en respectant le point d’arrivée indiqué par le grec.
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: à la recherche de Jésus
  rationale: Rend clairement l’action de chercher Jésus sans conférer au participe une portée spirituelle étrangère au contexte immédiat.
