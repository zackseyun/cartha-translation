source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: fr
  text: 'Jésus leur dit donc : « Amen, amen, je vous le dis : ce n’est pas Moïse qui vous a donné le pain venu du ciel[a], mais c’est mon Père qui vous donne le vrai pain[b] venu du ciel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « Moïse ne vous a pas donné le pain venu du ciel. » En grec, la négation précède « Moïse », ce qui met particulièrement en relief le contraste entre celui-ci et le Père.'
    reason: lexical_alternative
  - marker: b
    text: 'Le « vrai pain » peut aussi désigner le pain véritable ou authentique : le pain venu du ciel dans sa réalité pleine, par contraste avec la manne antérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la continuation logique de l’échange précédent, dans un français naturel.
- source_word: Ἀμὴν ἀμὴν
  choice: Oui, vraiment
  rationale: Rend la formule johannique solennelle et fortement affirmative dans un français moderne, sans employer un « en vérité, en vérité » devenu peu courant.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Expression française naturelle qui conserve la solennité de la déclaration.
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: ce n’est pas Moïse qui vous a donné
  rationale: La tournure clivée met clairement en relief la négation portant sur Moïse comme agent, conformément à l’ordre grec, tout en rendant le parfait par le passé composé.
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: le pain venu du ciel
  rationale: Formulation idiomatique qui conserve l’idée d’origine exprimée par ἐκ.
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: mais c’est mon Père qui vous donne
  rationale: La tournure souligne le contraste d’agent, tandis que le présent « donne » conserve le contraste temporel avec « a donné ».
- source_word: τὸν ἀληθινόν
  choice: le vrai pain
  rationale: « Vrai » préserve la portée johannique de ce qui est authentique et ultime sans l’expliciter abusivement.
theological_decisions:
- issue: Contraste entre le don attribué à Moïse et le don actuel du Père
  choice: « ce n’est pas Moïse qui vous a donné… mais c’est mon Père qui vous donne »
  alternative: « Moïse ne vous a pas donné… mais mon Père vous donne »
  rationale: La construction retenue préserve à la fois le contraste marqué entre les agents et la différence entre le parfait δέδωκεν et le présent δίδωσιν.
- issue: Sens de « vrai pain »
  choice: Conserver « le vrai pain » dans le texte
  alternative: « le pain véritable », « le pain réel » ou « le pain authentique »
  rationale: '« Vrai » laisse ouverte la richesse de ἀληθινός : authentique, définitif et correspondant pleinement à la réalité annoncée par la manne, sans imposer une interprétation unique.'
translation_notes:
  register: Français international moderne, naturel et digne. La formule « Oui, vraiment » garde une forte solennité tout en restant compréhensible; les tournures clivées rendent explicitement l’accent contrastif du grec.
