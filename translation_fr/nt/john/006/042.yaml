  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: fr
  text: 'Ils disaient : « N’est-ce pas Jésus, le fils de Joseph, dont nous connaissons le père et la mère ? Comment dit-il maintenant : “Je suis descendu du ciel” ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: Ils disaient
  rationale: L’imparfait grec présente leurs paroles comme une réaction en cours ou répétée ; l’imparfait français en conserve naturellement l’aspect.
- source_word: Οὐχ οὗτός ἐστιν
  choice: N’est-ce pas
  rationale: Cette tournure française naturelle conserve la question rhétorique qui attend une réponse affirmative.
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: le fils de Joseph
  rationale: Traduction directe qui maintient l’accent mis par les interlocuteurs sur l’origine familiale connue de Jésus.
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: Nous connaissons bien son père et sa mère
  rationale: La reprise en une nouvelle phrase est idiomatique en français. « bien » rend l’insistance portée par le pronom explicite ἡμεῖς sans prétendre que celui-ci signifie lexicalement « bien ».
- source_word: πῶς νῦν λέγει
  choice: Comment peut-il dire maintenant
  rationale: « Comment » conserve πῶς ; en français courant, « peut-il dire » exprime naturellement l’incrédulité de la question, sans transformer celle-ci en une demande de motif.
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: Rend naturellement l’origine exprimée par ἐκ avec le génitif.
- source_word: καταβέβηκα
  choice: Je suis descendu
  rationale: Le passé composé français rend ici le parfait grec comme un événement accompli dont la portée demeure présente ; « descendu » conserve explicitement le mouvement vers le bas.
theological_decisions:
- issue: L’objection à l’affirmation de l’origine céleste de Jésus
  choice: « Je suis descendu du ciel »
  alternative: « Je suis venu du ciel »
  rationale: La formulation retenue préserve directement le mouvement de descente exprimé par καταβαίνω ainsi que la tension entre l’origine familiale que les interlocuteurs pensent connaître et l’origine céleste revendiquée, sans expliquer ni atténuer cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. Le discours garde le ton d’incrédulité collective. La scission de la relative grecque en deux phrases évite une construction française lourde tout en conservant son contenu et son emphase.
