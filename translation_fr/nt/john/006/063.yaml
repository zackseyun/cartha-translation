id: JHN.6.63
reference: John 6:63
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: fr
  text: C’est l’Esprit qui donne la vie[a] ; la chair ne sert à rien[b]. Les paroles que je vous ai dites sont esprit et sont vie[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « C’est l’esprit qui donne la vie. » Le grec πνεῦμα peut désigner l’Esprit ou l’esprit ; ici, le contexte favorise une référence à l’Esprit Saint.
    reason: alternative_reading
  - marker: b
    text: « La chair » peut désigner ici, au sens large, ce qui est seulement humain. Traduire par « la nature pécheresse » serait plus interprétatif que le grec.
    reason: lexical_alternative
  - marker: c
    text: Ou « sont Esprit et vie », ou encore « sont spirituelles et donnent la vie ». La formulation grecque est concise et peut avoir une valeur qualitative.
    reason: alternative_reading
lexical_decisions:
- source_word: πνεῦμα
  choice: l’Esprit
  rationale: Dans la première proposition, l’article grec et le contexte johannique favorisent une référence définie à l’Esprit Saint. La majuscule signale ce sens probable sans ajouter « Saint », absent du texte.
- source_word: ζῳοποιοῦν
  choice: qui donne la vie
  rationale: Le participe présent exprime l’action de faire vivre ou de donner la vie. Cette formulation est naturelle en français et convient à un sujet personnel.
- source_word: σὰρξ
  choice: la chair
  rationale: « La chair » conserve l’ampleur et la tension du contraste grec avec l’Esprit. Des traductions comme « la nature pécheresse », « les seuls moyens humains » ou « le corps » préciseraient excessivement le sens.
- source_word: ὠφελεῖ οὐδέν
  choice: ne sert à rien
  rationale: Cette expression française courante rend clairement l’absence absolue de profit ou d’utilité exprimée par οὐδέν.
- source_word: ῥήματα
  choice: les paroles
  rationale: ῥήματα désigne ici des paroles prononcées. « Paroles » est plus idiomatique que « mots » dans ce contexte.
- source_word: λελάληκα
  choice: je vous ai dites
  rationale: Le passé composé rend naturellement le parfait grec et suggère que ces paroles déjà prononcées gardent leur portée présente.
- source_word: πνεῦμά ἐστιν
  choice: sont esprit
  rationale: Le prédicat sans article se prête à un sens qualitatif. La minuscule conserve la formulation dense du grec sans identifier de façon trop catégorique les paroles à l’Esprit Saint.
- source_word: ζωή
  choice: vie
  rationale: « Vie » est l’équivalent direct du terme johannique ζωή et en préserve la profondeur théologique.
theological_decisions:
- issue: Référent de πνεῦμα dans la première proposition
  choice: « l’Esprit », compris probablement comme l’Esprit Saint
  alternative: « l’esprit », comme principe spirituel ou esprit humain
  rationale: Dans l’Évangile selon Jean, l’action de donner la vie est étroitement associée à l’Esprit, et l’article grec favorise un référent défini. Une note maintient toutefois l’ambiguïté lexicale réelle.
- issue: Sens de σὰρξ dans son contraste avec l’Esprit
  choice: Conserver le terme large « chair »
  alternative: « nature pécheresse », « moyens purement humains » ou « corps »
  rationale: Le verset ne précise pas à lui seul lequel de ces sens plus étroits est visé. « Chair » préserve la tension théologique au lieu de la résoudre par interprétation.
- issue: Valeur de πνεῦμά ἐστιν dans la dernière proposition
  choice: 'Sens qualitatif : « sont esprit »'
  alternative: 'Sens identificatoire : « sont Esprit » ; paraphrase : « sont spirituelles »'
  rationale: L’absence d’article devant le prédicat favorise une nuance qualitative. La traduction garde la formulation concise et frappante du grec, tandis que la note présente les principales autres lectures.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du grec tout en étant idiomatique. « Ne sert à rien » évite le tour vieilli « ne profite de rien », et la répétition « sont esprit et sont vie » conserve l’insistance de la double copule grecque.
