id: JHN.6.12
reference: John 6:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: fr
  text: 'Quand ils eurent mangé à leur faim[a], il dit[b] à ses disciples : « Ramassez les morceaux qui restent[c], afin que rien ne se perde[d]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « quand ils furent rassasiés » ou « quand ils eurent mangé tout leur soûl ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie ici le présent historique : « il dit » au présent (« il leur dit / il dit » selon la ponctuation narrative). Le français le rend naturellement au passé simple.'
    reason: lexical_alternative
  - marker: c
    text: Ou « les fragments qui restent ». Le terme grec désigne des morceaux, notamment des morceaux de pain rompu.
    reason: lexical_alternative
  - marker: d
    text: 'Ou « afin que rien ne soit gaspillé ». Plus littéralement, le grec dit : « afin que rien ne se perde ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Quand
  rationale: Le contexte narratif permet de rendre naturellement la valeur temporelle de ὡς et la légère liaison de δέ sans alourdir le français.
- source_word: ἐνεπλήσθησαν
  choice: ils eurent mangé à leur faim
  rationale: Le passif exprime ici le fait d’être rassasié de nourriture. Cette formulation française est naturelle et explicite le contexte alimentaire sans ajouter d’idée étrangère.
- source_word: λέγει
  choice: il dit
  rationale: Le présent grec est un présent historique. Le passé simple constitue en français narratif la formulation la plus naturelle; une note signale la forme grecque.
- source_word: μαθηταῖς
  choice: disciples
  rationale: « Disciples » est le terme français établi et précis pour μαθηταί dans les Évangiles.
- source_word: Συναγάγετε
  choice: Ramassez
  rationale: L’impératif désigne l’action concrète de recueillir les morceaux restés sur place; « ramassez » est direct et idiomatique.
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: les morceaux qui restent
  rationale: Cette expression rend à la fois les morceaux de pain (κλάσματα) et leur caractère restant ou excédentaire (περισσεύσαντα), dans un français clair.
- source_word: ἵνα μή τι ἀπόληται
  choice: afin que rien ne se perde
  rationale: La formulation reste proche du grec et conserve la nuance de « perdre » sans la réduire au seul sens pratique de « gaspiller ».
theological_decisions:
- issue: Éventuelle résonance théologique de ἀπόληται dans le contexte du signe
  choice: « afin que rien ne se perde »
  alternative: « afin que rien ne soit gaspillé » ou « afin que rien ne périsse »
  rationale: Le référent immédiat est la nourriture restante. « Se perde » convient à ce sens matériel tout en conservant, sans l’imposer, l’éventuelle résonance johannique du verbe.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe narrative est fluide, tandis que les notes préservent le présent historique grec, les possibilités lexicales de ἐνεπλήσθησαν et κλάσματα, ainsi que l’ambiguïté entre perte matérielle et éventuelle résonance johannique.
