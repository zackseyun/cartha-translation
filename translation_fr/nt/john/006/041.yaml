id: JHN.6.41
reference: John 6:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: fr
  text: 'Les Juifs[a] murmuraient donc à son sujet parce qu’il avait dit : « Je suis le pain descendu du ciel. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens » ou, dans certains contextes, « les responsables juifs ». Chez Jean, l’expression « les Juifs » peut désigner un groupe particulier qui s’oppose à Jésus, et non le peuple juif dans son ensemble.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: murmuraient
  rationale: L’imparfait exprime une plainte en cours ou répétée. « Murmuraient » rend le mécontentement exprimé à voix basse et conserve l’écho biblique des murmures au désert, sans être obscur en français courant.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque la suite logique et narrative de la déclaration précédente. « Donc » exprime naturellement ce lien.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: C’est le rendu direct de l’expression johannique, sans la restreindre explicitement aux chefs ni lui imposer un sens purement géographique. Une note précise que, selon le contexte, l’expression peut désigner un groupe particulier opposé à Jésus plutôt que l’ensemble du peuple juif.
- source_word: περὶ αὐτοῦ
  choice: à son sujet
  rationale: περί avec le génitif signifie ici « au sujet de » ou « à propos de ». Cette formulation évite de renforcer indûment la préposition en « contre lui ».
- source_word: ὅτι
  choice: parce que
  rationale: 'ὅτι introduit ici la cause de leurs murmures : la déclaration de Jésus.'
- source_word: εἶπεν
  choice: avait dit
  rationale: Le plus-que-parfait français situe naturellement la déclaration antérieure comme la cause des murmures, sans modifier la valeur fondamentale de l’aoriste grec.
- source_word: Ἐγώ εἰμι
  choice: C’est moi
  rationale: Dans cette construction française, « C’est moi, le pain… » rend clairement l’identification emphatique Ἐγώ εἰμι et évite la tournure moins naturelle « Je suis le pain descendu… » dans une citation rapportée immédiatement après « avait dit ».
- source_word: ὁ ἄρτος
  choice: le pain
  rationale: 'L’article est conservé : Jésus s’identifie comme « le pain », non simplement comme du pain.'
- source_word: ὁ καταβὰς
  choice: descendu
  rationale: Le participe passé français modifie naturellement « le pain » et rend le participe aoriste grec, qui présente la descente comme accomplie.
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: du ciel
  rationale: « Du ciel » est le rendu français idiomatique de l’origine exprimée par ἐκ avec le génitif.
theological_decisions:
- issue: Référent et traduction de οἱ Ἰουδαῖοι dans Jean
  choice: « les Juifs » dans le texte principal, avec une note de contextualisation
  alternative: « les Judéens » ou, dans certains contextes, « les responsables juifs »
  rationale: Le texte grec ne limite pas explicitement ici le groupe aux responsables et n’impose pas une lecture géographique. Le rendu direct préserve donc l’expression de Jean, tandis que la note empêche de l’entendre comme une généralisation visant tout le peuple juif.
- issue: Forme de l’auto-identification Ἐγώ εἰμι
  choice: « C’est moi, le pain… »
  alternative: « Je suis le pain… »
  rationale: Les deux rendent l’identification. « C’est moi » préserve l’emphase du pronom grec et produit ici une phrase française naturelle, sans décider d’une éventuelle portée théologique de la formule au-delà de son sens copulatif immédiat.
translation_notes:
  register: Français international moderne, naturel et digne. « Murmuraient » garde la nuance de plainte persistante et l’écho scripturaire sans archaïsme marqué. La ponctuation met clairement en relief la parole citée.
