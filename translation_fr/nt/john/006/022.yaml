source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: fr
  text: Le lendemain, la foule qui se tenait de l’autre côté de la mer vit qu’il n’y avait là qu’une seule petite barque[a], et que Jésus n’était pas monté dans la barque[b] avec ses disciples, mais que ceux-ci étaient partis seuls.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « embarcation » pour « petite barque » (πλοιάριον) ; le grec emploie ici une forme diminutive.
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits et certaines éditions présentent dans ce verset une variation entre « petite barque » (πλοιάριον) et « barque » (πλοῖον) ; la traduction suit, dans chaque proposition, le texte grec imprimé.
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: Le lendemain
  rationale: Expression temporelle idiomatique et naturelle en français, qui marque clairement le passage au jour suivant.
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: la foule qui se tenait
  rationale: Le participe parfait décrit un état résultant ou maintenu; cette formulation française rend naturellement la présence persistante de la foule.
- source_word: πέραν τῆς θαλάσσης
  choice: de l’autre côté du lac
  rationale: Dans le contexte du lac de Galilée, « lac » est l’appellation géographique naturelle en français, tandis que « de l’autre côté » rend la valeur locative de πέραν.
- source_word: εἶδον
  choice: vit
  rationale: Le verbe conserve le sens fondamental de perception; le singulier français s’accorde naturellement avec le collectif « foule », malgré la forme verbale grecque plurielle.
- source_word: πλοιάριον
  choice: petite barque
  rationale: Le diminutif grec est rendu explicitement par « petite », et « barque » désigne naturellement une petite embarcation.
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: il n’y avait eu là qu’une seule petite barque
  rationale: La tournure restrictive « ne… que » rend clairement l’exclusivité, et le plus-que-parfait convient à l’observation rétrospective.
- source_word: συνεισῆλθεν
  choice: n’était pas monté … avec
  rationale: Dans le contexte d’une embarcation, « monter dans » exprime idiomatiquement l’entrée dans la barque, tandis que « avec » conserve l’idée d’accompagnement portée par le préverbe συν-.
- source_word: εἰς τὸ πλοῖον
  choice: dans la barque
  rationale: « Barque » est naturel dans ce contexte et reflète πλοῖον sans ajouter ici la nuance diminutive de πλοιάριον.
- source_word: μόνοι
  choice: seuls
  rationale: Le terme souligne que les disciples sont partis sans Jésus; « seuls » préserve directement cette exclusion.
- source_word: ἀπῆλθον
  choice: étaient partis
  rationale: Le plus-que-parfait français rend naturellement le départ antérieur constaté par la foule.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. La phrase grecque très longue est répartie en deux phrases pour faciliter la compréhension. « Elle savait aussi » explicite naturellement en français que le second ὅτι dépend toujours de la perception de la foule, sans modifier le contenu de l’observation.
