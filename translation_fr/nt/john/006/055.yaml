  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: fr
  text: Car ma chair est une vraie nourriture[a], et mon sang est une vraie boisson.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une nourriture réelle » et « une boisson réelle ».
    reason: Alternative lexicale possible pour ἀληθής, signalée sans l’imposer dans le texte principal.
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: « Car » conserve le lien explicatif avec l’affirmation précédente et convient au registre digne du passage.
- source_word: σάρξ
  choice: chair
  rationale: Le terme est rendu littéralement, en maintenant le parallélisme marqué entre la chair et le sang sans l’interpréter comme « corps ».
- source_word: ἀληθής
  choice: vraie
  rationale: « Vraie » exprime directement l’adjectif grec et préserve sa portée johannique sans trancher les implications théologiques par le choix plus appuyé de « réelle ».
- source_word: βρῶσις
  choice: nourriture
  rationale: Dans cette construction attributive et en parallèle avec πόσις, le mot désigne naturellement ce qui se mange plutôt que l’acte de manger.
- source_word: αἷμα
  choice: sang
  rationale: La traduction littérale maintient l’expression forte du grec et le parallélisme chair-sang.
- source_word: πόσις
  choice: boisson
  rationale: Dans ce contexte, le mot désigne ce qui se boit; « boisson » forme en français le pendant naturel de « nourriture ».
theological_decisions:
- issue: Rendre ἀληθής par « vraie » ou par « réelle » dans un passage lié aux débats eucharistiques
  choice: vraie
  alternative: réelle
  rationale: « Vraie » suit plus directement le grec et laisse ouvertes les implications sacramentelles du verset, tandis que « réelle » pourrait paraître résoudre davantage la tension théologique.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme grec est conservé, ainsi que la répétition de « vraie », importante pour le rythme et l’accent du verset.
