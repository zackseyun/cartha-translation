id: JHN.6.4
reference: John 6:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: fr
  text: La Pâque, la fête des Juifs[a], était proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la fête des Judéens ». Selon le contexte, le terme grec peut désigner soit les Juifs en général, soit plus particulièrement les habitants de la Judée.
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: Ponctuation et enchaînement sans mot de liaison explicite
  rationale: δέ marque ici une légère progression narrative. En français, le lien avec le contexte peut rester implicite sans introduire un « maintenant » temporel absent du grec.
- source_word: ἐγγὺς
  choice: était proche
  rationale: Avec ἦν, ἐγγύς indique que la fête approchait dans le temps. « Était proche » est naturel, précis et digne.
- source_word: πάσχα
  choice: la Pâque
  rationale: πάσχα désigne la fête juive de la Pâque. « La Pâque » est l’équivalent français usuel dans ce contexte.
- source_word: ἡ ἑορτή
  choice: la fête
  rationale: ἑορτή désigne une célébration religieuse. « La fête » convient naturellement à l’apposition explicative.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Ἰουδαῖοι peut désigner les Juifs en général ou, selon le contexte, les Judéens. Ici, la Pâque est la fête religieuse du peuple juif dans son ensemble, ce qui favorise « des Juifs ».
theological_decisions:
- issue: Sens de Ἰουδαίων dans la narration johannique
  choice: des Juifs
  alternative: des Judéens
  rationale: Dans ce contexte, l’expression caractérise la Pâque comme fête du peuple juif, et non comme une observance limitée à la Judée. Une note conserve néanmoins l’autre valeur lexicale possible du terme grec.
translation_notes:
  register: Français international moderne, clair et digne. La formulation conserve l’apposition du grec et n’ajoute aucun marqueur temporel explicite pour δέ.
