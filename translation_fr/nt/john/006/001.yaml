source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: fr
  text: Après cela, Jésus s’en alla de l’autre côté de la mer de Galilée, aussi appelée mer de Tibériade.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La « mer de Galilée » était aussi appelée « mer de Tibériade » ; les deux noms désignent la même étendue d’eau.
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Cette tournure française naturelle rend la transition temporelle grecque. Le singulier collectif « cela » reprend idiomatiquement en français l’ensemble des faits précédents, malgré le pluriel grammatical grec.
- source_word: ἀπῆλθεν
  choice: partit
  rationale: « Partit » exprime naturellement le déplacement marqué par ἀπέρχομαι sans alourdir la phrase par « s’en alla ».
- source_word: πέραν
  choice: vers l’autre rive de
  rationale: Dans le contexte d’une étendue d’eau, cette formulation indique clairement le mouvement en direction de la rive opposée, tout en évitant d’affirmer explicitement ici l’achèvement de la traversée.
- source_word: τῆς θαλάσσης τῆς Γαλιλαίας
  choice: de la mer de Galilée
  rationale: « Mer » conserve le terme traditionnel correspondant à θάλασσα, même si cette étendue d’eau est géographiquement un lac; « mer de Galilée » est son nom français usuel.
- source_word: τῆς Τιβεριάδος
  choice: appelée aussi mer de Tibériade
  rationale: Le second génitif grec donne une autre désignation de la même étendue d’eau. L’explicitation française rend clairement l’apposition sans donner l’impression qu’il s’agit de deux mers.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste fluide pour un lectorat général, tout en conservant les deux noms géographiques donnés par Jean.
