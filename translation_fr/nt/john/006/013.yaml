  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: fr
  text: Ils les ramassèrent donc et remplirent douze paniers avec les morceaux[a] provenant des cinq pains d’orge, restés après que les gens eurent mangé[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « fragments ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec dit littéralement : « qui furent en surplus pour ceux qui avaient mangé » ; le sens est qu’il s’agissait des morceaux restés après le repas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: Ils les ramassèrent donc
  rationale: Le verbe à l’aoriste décrit l’action accomplie par les disciples; « les » reprend naturellement les morceaux mentionnés dans le contexte. « Donc » conserve le lien de conséquence avec l’ordre donné au verset précédent.
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: remplirent douze paniers
  rationale: Traduction directe et naturelle; « paniers » rend κοφίνους sans imposer une forme ou une taille plus précise que le texte.
- source_word: κλασμάτων
  choice: morceaux
  rationale: Le terme désigne ici des morceaux de pain rompus. « Morceaux » est courant et clair; « fragments » demeure une possibilité plus formelle signalée en note.
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: provenant des cinq pains d’orge
  rationale: « Provenant de » exprime clairement la relation indiquée par ἐκ entre les morceaux recueillis et les cinq pains d’origine.
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: restés après que les gens eurent mangé
  rationale: Cette formulation française naturelle exprime le surplus demeuré après le repas, tout en conservant la référence explicite à ceux qui avaient mangé. Une note préserve la tournure grecque plus littérale.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au récit écrit; le plus-que-parfait du subjonctif après « après que » a été évité au profit du passé antérieur, correct et lisible dans ce registre.
