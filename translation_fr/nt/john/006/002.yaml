source:
  edition: SBLGNT
  text: ⸂ἠκολούθει δὲ⸃ αὐτῷ ὄχλος πολύς, ὅτι ⸀ἐθεώρουν τὰ σημεῖα ἃ ἐποίει ἐπὶ τῶν ἀσθενούντων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/002.yaml
  text: And a large crowd was following him[a], because they were seeing the signs that he was doing on those who were sick.
translation:
  language: fr
  text: Une grande foule le suivait, parce qu’elle voyait les signes[a] qu’il accomplissait pour les malades.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « miracles » ou « signes miraculeux » ; chez Jean, le mot « signes » souligne ce que ces œuvres révèlent au sujet de Jésus.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: suivait
  rationale: L’imparfait grec décrit une action en cours dans le passé; l’imparfait français en conserve naturellement l’aspect.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Particule de liaison narrative légère; en français, l’enchaînement reste naturel sans conjonction explicite.
- source_word: ὄχλος πολύς
  choice: une grande foule
  rationale: Expression française courante qui préserve l’idée d’un rassemblement nombreux.
- source_word: ἐθεώρουν
  choice: voyait
  rationale: L’imparfait rend l’observation répétée ou continue; le singulier assure l’accord collectif naturel avec « foule ».
- source_word: σημεῖα
  choice: signes
  rationale: Conserve le terme caractéristique de Jean et la portée révélatrice de ces actes, sans la réduire à leur seul caractère miraculeux.
- source_word: ἐποίει
  choice: accomplissait
  rationale: L’imparfait préserve l’action continue ou répétée; « accomplissait » est digne et idiomatique pour des actes extraordinaires.
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: sur les malades
  rationale: Rend directement ἐπί avec le génitif et présente les malades comme les personnes sur lesquelles ces signes étaient accomplis.
- source_word: ἀσθενούντων
  choice: les malades
  rationale: Dans ce contexte, le participe désigne des personnes atteintes physiquement; « les malades » est clair, naturel et concis.
theological_decisions:
- issue: Terminologie johannique de σημεῖα
  choice: signes
  alternative: miracles; signes miraculeux
  rationale: « Signes » maintient l’accent johannique sur ce que les œuvres de Jésus révèlent, tout en laissant la note signaler les équivalents possibles.
translation_notes:
  register: Français international moderne, simple et digne. Les imparfaits rendent les actions continues ou répétées du récit grec. Le pronom singulier « elle » reprend naturellement le nom collectif « foule ».
