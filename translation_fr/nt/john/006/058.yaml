  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: fr
  text: 'Voici le pain descendu du ciel ; il n’est pas comme celui que les pères[a] ont mangé : eux sont morts. Celui qui mange ce pain vivra pour toujours[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les ancêtres ». Le grec dit littéralement « les pères » et désigne probablement les ancêtres d’Israël qui ont mangé la manne.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « vivra jusque dans l’âge ». Cette expression grecque désigne ici une vie qui dure pour toujours.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: Voici le pain
  rationale: « Voici » rend naturellement en français l’identification démonstrative οὗτός ἐστιν dans ce contexte, tout en conservant l’article défini qui renvoie au pain déjà présenté.
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: qui est descendu du ciel
  rationale: La proposition relative rend clairement le participe aoriste καταβάς et conserve l’origine exprimée par ἐξ οὐρανοῦ.
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: 'Ce n’est pas comme ce qu’ont mangé les pères : eux, ils sont morts'
  rationale: Cette formulation française explicite seulement l’objet elliptique de « manger » par « ce que », sans ajouter « la manne », absent du verset. Les deux verbes et le contraste sont préservés; les deux-points rendent lisible la comparaison grecque elliptique.
- source_word: οἱ πατέρες
  choice: les pères
  rationale: Le choix conserve le masculin pluriel du grec et l’allusion probable aux pères d’Israël dans le désert. « Les ancêtres » reste une possibilité signalée en note.
- source_word: ὁ τρώγων
  choice: Celui qui mange
  rationale: Le participe présent substantivé est rendu par une tournure générique naturelle. « Mange » garde l’image concrète sans accentuer artificiellement le sens possible de « mâcher » ou « se nourrir de ».
- source_word: τοῦτον τὸν ἄρτον
  choice: ce pain
  rationale: Rendu direct du démonstratif et du nom, renvoyant au pain qui vient d’être identifié.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: vivra pour toujours
  rationale: Expression française idiomatique correspondant à la locution johannique εἰς τὸν αἰῶνα, qui exprime une vie durable sans fin.
theological_decisions:
- issue: Référent de « les pères » dans la comparaison avec le pain du désert
  choice: Maintenir « les pères » dans le texte
  alternative: les ancêtres
  rationale: Le grec emploie explicitement un masculin pluriel et évoque probablement les pères d’Israël qui ont mangé dans le désert. La note conserve l’autre rendu possible sans élargir silencieusement le référent.
- issue: Portée de τρώγων dans le discours sur le pain de vie
  choice: Traduire sobrement par « Celui qui mange »
  alternative: celui qui se nourrit de ce pain
  rationale: Ce rendu ne tranche pas entre les lectures sacramentelle et métaphorique du discours. Il préserve l’action concrète exprimée par le verbe sans importer une interprétation doctrinale.
- issue: Nature de la vie exprimée par εἰς τὸν αἰῶνα
  choice: vivra pour toujours
  alternative: vivra jusque dans l’âge
  rationale: « Pour toujours » communique idiomatiquement la durée indéfinie de l’expression grecque, tandis qu’un calque avec « l’âge » serait obscur en français moderne.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe comparative elliptique du grec est rendue avec deux phrases et des deux-points afin d’éviter une tournure artificielle, sans ajouter explicitement « la manne ». Les marqueurs de note sont placés auprès des expressions qu’ils expliquent.
