reference: John 6:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: fr
  text: Jésus, sachant donc qu’ils allaient venir s’emparer de lui[a] pour le faire roi, se retira de nouveau sur la montagne, lui seul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : le prendre de force.'
    reason: Alternative lexicale explicitant la nuance coercitive de ἁρπάζειν.
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque ici la conséquence ou la progression narrative à partir de la réaction de la foule; « donc » en conserve la force sans alourdir la phrase.
- source_word: γνοὺς
  choice: sachant
  rationale: Le participe aoriste donne la circonstance qui motive le retrait de Jésus. « Sachant » est direct, naturel et n’ajoute aucun moyen particulier de connaissance.
- source_word: μέλλουσιν ἔρχεσθαι
  choice: allaient venir
  rationale: Cette tournure française exprime naturellement l’imminence indiquée par μέλλω avec l’infinitif.
- source_word: ἁρπάζειν
  choice: s’emparer de lui
  rationale: Le verbe implique une prise énergique ou coercitive. « S’emparer de lui » conserve cette force dans un registre digne et courant; l’explicitation « le prendre de force » est signalée en note.
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: pour le faire roi
  rationale: La construction exprime le but. Cette formulation française est claire, concise et respecte l’absence d’article devant βασιλέα.
- source_word: ἀνεχώρησεν
  choice: se retira
  rationale: Le verbe décrit un éloignement volontaire, ici pour éviter l’action projetée par la foule. « Se retira » rend ce mouvement sans surinterpréter.
- source_word: πάλιν
  choice: de nouveau
  rationale: Rend explicitement la répétition indiquée par l’adverbe grec.
- source_word: εἰς τὸ ὄρος
  choice: dans la montagne
  rationale: « Dans la montagne » rend idiomatiquement le mouvement vers la zone montagneuse ou le relief déjà évoqué, tout en conservant l’image du grec.
- source_word: αὐτὸς μόνος
  choice: tout seul
  rationale: La combinaison grecque est emphatique. « Tout seul » en restitue naturellement l’insistance en français moderne.
theological_decisions:
- issue: Nature de l’action envisagée par la foule pour établir Jésus comme roi
  choice: 'Présenter l’action comme coercitive : « s’emparer de lui pour le faire roi »'
  alternative: « venir le prendre pour le faire roi »
  rationale: ἁρπάζειν comporte une idée de prise soudaine ou violente. La traduction ne transforme donc pas la scène en invitation ou en couronnement librement accepté.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste proche de la structure grecque, tout en plaçant les éléments de manière idiomatique. « Tout seul » conserve l’emphase finale sans produire une redondance artificielle.
