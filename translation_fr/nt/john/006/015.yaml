    rationale: « Dans la montagne » peut désigner le massif ou la zone montagneuse. Dans ce récit, « sur la montagne » correspond plus directement à la montagne déterminée déjà évoquée et demeure idiomatique en français biblique moderne.
  - severity: low
    issue: Registre de « tout seul »
    rationale: L’expression rend l’emphase, mais sa coloration légèrement familière est moins homogène avec le registre de la phrase. « Lui seul » est plus sobre et conserve l’insistance du grec αὐτὸς μόνος.
