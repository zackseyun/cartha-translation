  source_fidelity: 'Le sens essentiel est bien rendu : Jésus perçoit l’imminence de l’action de la foule, son caractère coercitif, son objectif de le faire roi et se retire. Toutefois, « dans la montagne » suggère plus volontiers une région montagneuse, alors que εἰς τὸ ὄρος renvoie ici à la montagne déjà mentionnée ; « sur la montagne » est plus précis dans ce contexte.'
  naturalness: La phrase est globalement naturelle et de registre digne. « Tout seul » est cependant un peu familier pour le registre narratif retenu. « Lui seul » rend naturellement l’emphase de αὐτὸς μόνος sans relâchement de registre.
  terminology: « S’emparer de lui » conserve adéquatement la force de ἁρπάζειν, et « pour le faire roi » rend clairement le but exprimé par ἵνα. La note proposée préserve utilement l’alternative coercitive.
