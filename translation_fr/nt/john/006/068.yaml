id: JHN.6.68
reference: John 6:68
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: fr
  text: 'Simon Pierre lui répondit : « Seigneur[a], vers qui irions-nous ? Tu as les paroles de la vie éternelle, »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Maître ». Le titre grec peut servir de formule respectueuse, mais « Seigneur » convient ici à l’usage de Jean et en préserve aussi la portée théologique possible.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: lui répondit
  rationale: Rend directement le verbe narratif de réponse et le pronom datif qui renvoie à Jésus, dans un français naturel.
- source_word: Σίμων Πέτρος
  choice: Simon Pierre
  rationale: Forme française habituelle de ce nom dans le Nouveau Testament.
- source_word: Κύριε
  choice: Seigneur
  rationale: Le vocatif peut exprimer à la fois le respect et une portée christologique. « Seigneur » conserve cette amplitude dans le contexte johannique.
- source_word: πρὸς τίνα
  choice: vers qui
  rationale: Avec un verbe de mouvement, « vers qui » préserve l’orientation personnelle exprimée par πρὸς et convient à la question rhétorique.
- source_word: ἀπελευσόμεθα
  choice: irions-nous
  rationale: Bien que le grec emploie le futur, le conditionnel est la tournure française naturelle dans cette question rhétorique qui implique l’absence de toute autre personne vers qui aller.
- source_word: ῥήματα
  choice: les paroles
  rationale: « Paroles » convient à des paroles prononcées et préserve le pluriel grec.
- source_word: ζωῆς αἰωνίου
  choice: de la vie éternelle
  rationale: Cette formulation conserve le génitif sans trancher explicitement entre des paroles qui communiquent la vie et des paroles qui ont la vie éternelle pour contenu.
- source_word: ἔχεις
  choice: tu as
  rationale: Rendu simple et direct du présent de possession, approprié à l’adresse personnelle de Pierre à Jésus.
theological_decisions:
- issue: Portée de Κύριε dans l’adresse à Jésus
  choice: Seigneur
  alternative: Maître
  rationale: « Seigneur » maintient à la fois la valeur d’adresse respectueuse et la résonance christologique possible, sans imposer une interprétation plus précise que le texte.
- issue: Relation entre les paroles et la vie éternelle
  choice: les paroles de la vie éternelle
  alternative: les paroles qui donnent la vie éternelle
  rationale: Le génitif grec peut évoquer le contenu, la source ou l’effet des paroles. La formulation retenue préserve cette densité au lieu de la réduire à une seule relation causale.
translation_notes:
  register: Français moderne, digne et oralement fluide. Le conditionnel « irions-nous » traduit idiomatiquement la force rhétorique du futur grec. Le tutoiement correspond à l’usage français courant dans les dialogues bibliques.
