source:
  edition: SBLGNT
  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: fr
  text: Il parlait de Judas[a], fils de Simon Iscariote, car c’était lui qui allait le livrer, l’un des Douze.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le trahir ». Littéralement, le verbe peut aussi signifier « le remettre ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: Il parlait de Judas
  rationale: L’imparfait a ici une valeur explicative dans le récit. « Parlait de » rend naturellement la construction avec λέγω, tandis que δέ peut rester implicite en français sans perdre le lien discursif.
- source_word: Σίμωνος Ἰσκαριώτου
  choice: fils de Simon Iscariote
  rationale: Les génitifs identifient le plus naturellement Judas par sa filiation; « Iscariote » se rapporte grammaticalement à Simon dans cette forme du texte.
- source_word: οὗτος γὰρ
  choice: car c’était lui qui
  rationale: « Car » conserve la valeur explicative de γάρ, et la tournure présentative « c’était lui qui » restitue l’insistance du démonstratif οὗτος en français naturel.
- source_word: ἔμελλεν παραδιδόναι αὐτόν
  choice: allait le livrer
  rationale: « Allait » exprime l’action future envisagée sans imposer l’idée de destinée ou d’intention; « livrer » conserve le sens concret de remise aux autorités tout en évoquant, dans ce contexte, la trahison.
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: bien qu’il fût l’un des Douze
  rationale: 'La proposition concessive rend explicite la tension saisissante de l’apposition: celui qui allait livrer Jésus appartenait au groupe des Douze. Le subjonctif imparfait maintient un registre narratif digne.'
theological_decisions:
- issue: Sens de παραδιδόναι à propos de Judas
  choice: le livrer
  alternative: le trahir
  rationale: Le verbe signifie fondamentalement « remettre/livrer » et, dans ce contexte, l’acte constitue une trahison. Le texte principal préserve l’image concrète et l’ambiguïté lexicale; la note signale la valeur contextuelle.
- issue: Force de εἷς ἐκ τῶν δώδεκα
  choice: bien qu’il fût l’un des Douze
  alternative: étant l’un des Douze
  rationale: Le grec juxtapose l’appartenance aux Douze à l’annonce de l’acte de Judas. La formulation française met en lumière la tension implicite sans ajouter de conclusion doctrinale.
translation_notes:
  register: Français international moderne, clair et digne. « Les Douze » est conservé comme désignation reconnue du cercle apostolique. La syntaxe évite un calque lourd tout en maintenant l’insistance sur Judas et le caractère choquant de son appartenance aux Douze.
