source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: fr
  text: 'Or, voici quelle est la volonté de celui qui m’a envoyé : que je ne perde rien de tout ce qu’il m’a donné[a], mais que je le ressuscite au dernier jour.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, dans une formulation plus personnelle : « tous ceux qu’il m’a donnés… je les ressuscite ». Le grec emploie un collectif neutre au singulier (« tout ce que… »), repris ensuite par un pronom neutre singulier.'
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: volonté
  rationale: « Volonté » exprime naturellement l’intention de Dieu sans préciser davantage s’il s’agit d’un désir ou d’un dessein arrêté.
- source_word: τοῦ πέμψαντός με
  choice: de celui qui m’a envoyé
  rationale: Cette formulation rend le participe substantivé et conserve la force relationnelle et verbale de πέμπω.
- source_word: ἵνα
  choice: que
  rationale: Après « voici quelle est la volonté », « que » introduit naturellement en français le contenu de cette volonté tout en laissant percevoir sa portée finale.
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: tout ce qu’il m’a donné
  rationale: Le grec emploie un collectif neutre singulier (πᾶν ὃ). Cette traduction en préserve la forme sans exclure que le référent soit personnel dans le contexte.
- source_word: δέδωκέν
  choice: m’a donné
  rationale: Le passé composé français présente naturellement le don comme accompli et pertinent dans la situation présente, conformément au parfait grec.
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: je ne perde rien de tout ce qu’il m’a donné
  rationale: Dans ce contexte, ἀπόλλυμι signifie « perdre ». « Rien de tout ce que » rend idiomatiquement la négation et ἐξ αὐτοῦ tout en maintenant le collectif neutre.
- source_word: ἀναστήσω αὐτὸ
  choice: je le relève
  rationale: « Relever » peut désigner ici l’action eschatologique de ramener à la vie; le pronom masculin grammatical « le » reprend en français le collectif « tout », sans transformer celui-ci en pluriel personnel.
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: au dernier jour
  rationale: Formulation française naturelle et consacrée qui conserve la référence eschatologique johannique.
theological_decisions:
- issue: Faut-il personnaliser le collectif neutre grec en traduisant « tous ceux que »?
  choice: tout ce qu’il m’a donné … je le relève
  alternative: tous ceux qu’il m’a donnés … je les relève
  rationale: Les formes grecques πᾶν, ὃ et αὐτό sont au neutre singulier et constituent un collectif. La traduction principale conserve cette particularité et son ambiguïté, tandis qu’une note donne la formulation personnelle naturellement suggérée par le contexte.
translation_notes:
  register: Français international moderne, naturel et digne. « Or voici quelle est » assure une transition lisible pour δέ; la syntaxe après les deux-points reste solennelle sans être archaïque. Le collectif singulier grec est maintenu dans le texte principal et expliqué en note.
