  to: 'Or, voici quelle est la volonté de celui qui m’a envoyé : que je ne perde rien de tout ce qu’il m’a donné[a], mais que je le ressuscite au dernier jour.'
  rationale: La révision conserve le collectif singulier et l’ambiguïté personnelle du grec, tout en employant « ressuscite », terme naturellement compris en français pour l’acte eschatologique visé. La note est reformulée afin d’expliquer avec exactitude et clarté le collectif neutre grec.
