review_pass:
  verdict: revise
  source_fidelity: Le texte rend correctement la structure, le collectif neutre singulier de πᾶν ὃ… αὐτό, la négation (« rien de tout ce que ») et la référence eschatologique. Dans ce contexte, ἀναστήσω désigne explicitement la résurrection au dernier jour ; « ressuscite » l’exprime plus sûrement en français moderne que « relève », qui peut être compris dans des sens non eschatologiques.
  naturalness: La phrase est naturelle, digne et adaptée au français international moderne. « Or, voici quelle est… » conserve bien la transition de δέ. La note doit toutefois éviter une prétendue citation littérale grammaticalement opaque (« tout ce que… le »).
  terminology: « Volonté », « celui qui m’a envoyé », « tout ce qu’il m’a donné » et « au dernier jour » sont appropriés. « Ressuscite » est le terme français usuel et précis ici pour l’action eschatologique de ἀνίστημι.
  issues:
  - severity: medium
    issue: « je le relève » est moins explicite que le sens eschatologique de ἀναστήσω dans ce contexte.
    rationale: Au « dernier jour », le verbe renvoie à la résurrection. En français contemporain, « relever » peut aussi évoquer le fait d’aider quelqu’un à se remettre debout ou de se rétablir ; « ressusciter » évite cette ambiguïté sans ajouter de doctrine.
  - severity: low
    issue: La formulation littérale de la note (« tout ce que… le ») n’est pas intelligible en français.
    rationale: Elle ne représente pas clairement la construction grecque et produit une citation elliptique artificielle. Il vaut mieux expliquer directement que le grec reprend le collectif neutre singulier par un pronom neutre.
