id: JHN.6.51
reference: John 6:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: fr
  text: Je suis le pain vivant qui est descendu du ciel. Si quelqu’un mange de ce pain, il vivra pour toujours[a]. Et le pain que je donnerai, c’est ma chair, pour la vie du monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « il vivra jusque dans l’éternité » ; l’expression signifie ici « pour toujours ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: le pain vivant
  rationale: Traduit directement le participe attributif ζῶν sans reprendre l’expression voisine « pain de vie ».
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: qui est descendu du ciel
  rationale: La proposition relative rend naturellement en français le participe aoriste et présente la descente comme accomplie.
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: Si quelqu’un mange de ce pain
  rationale: « Si quelqu’un » exprime la condition générale; « manger de ce pain » est idiomatique et conserve la valeur partitive de ἐκ.
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: il vivra pour toujours
  rationale: Rend clairement l’idiome johannique désignant une vie qui dure sans fin, tout en gardant le singulier générique du grec.
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: Et le pain que je donnerai
  rationale: « Et » marque le développement peu contrastif de δέ; le futur garde la perspective du don à venir.
- source_word: ἡ σάρξ μού ἐστιν
  choice: c’est ma chair
  rationale: « Chair » traduit concrètement σάρξ; la construction disloquée est naturelle en français et met en relief l’identification.
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: pour que le monde ait la vie
  rationale: Cette formulation française explicite la relation entre le don bénéfique exprimé par ὑπέρ et la vie destinée au monde, sans restreindre la portée de κόσμος.
- source_word: κόσμος
  choice: le monde
  rationale: Conserve la formulation ample et les résonances johanniques du terme, sans la réduire à une catégorie théologique.
theological_decisions:
- issue: Sens de σάρξ dans l’affirmation de Jésus
  choice: chair
  alternative: corps
  rationale: Le terme grec est concret et volontairement saisissant. « Corps » atténuerait sa force et pourrait imposer une interprétation particulière.
- issue: Portée de κόσμος
  choice: le monde
  alternative: l’humanité
  rationale: La traduction conserve l’étendue et l’ambiguïté théologique de l’expression grecque sans en restreindre les bénéficiaires.
- issue: Relation exprimée par ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: pour que le monde ait la vie
  alternative: pour la vie du monde
  rationale: La formulation retenue est naturelle et intelligible en français; la variante plus formelle demeure possible et est signalée en note.
- issue: Force christologique de la descente du ciel
  choice: qui est descendu du ciel
  alternative: envoyé par le ciel
  rationale: Le texte parle directement d’une descente; il ne faut pas la réduire à une simple mission ou autorisation divine.
translation_notes:
  register: Français international actuel, digne et accessible. « Quelqu’un… il » maintient le singulier générique du grec. « Chair » est conservé malgré son caractère concret. La ponctuation et la dislocation « c’est ma chair » favorisent une lecture naturelle sans effacer l’ambiguïté syntaxique finale, signalée en note.
