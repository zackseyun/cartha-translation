id: JHN.6.31
reference: John 6:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: fr
  text: 'Nos pères ont mangé la manne dans le désert[a], comme il est écrit : « Il leur a donné du pain venu du ciel à manger. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans le lieu désert ». Le terme grec peut désigner un désert ou une région inhabitée.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Nos pères
  rationale: Le grec dit littéralement « nos pères » et désigne ici les générations d’Israël qui ont précédé les locuteurs. Cette formulation conserve l’expression et la forme masculine du texte source; « nos ancêtres » est une autre traduction possible.
- source_word: τὸ μάννα
  choice: la manne
  rationale: « La manne » est le terme français consacré pour la nourriture donnée à Israël au désert et conserve la référence précise au récit de l’Exode.
- source_word: ἔφαγον
  choice: ont mangé
  rationale: L’aoriste de ἐσθίω exprime simplement l’action passée; le passé composé est naturel en français moderne dans ce discours.
- source_word: ἐν τῇ ἐρήμῳ
  choice: dans le désert
  rationale: Dans le contexte de l’Exode, « désert » est l’équivalent français courant de ἔρημος et évoque naturellement le séjour d’Israël hors des terres habitées.
- source_word: καθώς ἐστιν γεγραμμένον
  choice: comme il est écrit
  rationale: Cette formule française consacrée introduit naturellement une citation de l’Écriture et rend la valeur de témoignage écrit toujours valable du parfait passif.
- source_word: Ἄρτον
  choice: du pain
  rationale: ἄρτος désigne ici le pain de façon générique, non un pain individuel; le partitif est idiomatique après « donner ».
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: venu du ciel
  rationale: Cette tournure rend clairement l’origine céleste exprimée par ἐκ tout en évitant l’ambiguïté possible de « pain du ciel », qui pourrait désigner une sorte de pain plutôt que sa provenance.
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: Il leur a donné… à manger
  rationale: La construction conserve le verbe « donner », le bénéficiaire et l’infinitif final du grec dans un ordre français naturel.
theological_decisions:
- issue: Rendre la citation sur la manne sans introduire par anticipation l’interprétation christologique développée ensuite
  choice: La citation demeure une affirmation historique et scripturaire concernant le pain donné du ciel, sans majuscule ni explicitation christologique.
  alternative: Employer une majuscule ou une formulation interprétative qui identifierait déjà le pain à Jésus.
  rationale: À ce point du récit, les locuteurs invoquent le don de la manne. La traduction doit laisser le développement christologique apparaître dans la suite du discours plutôt que l’insérer dans leurs paroles.
- issue: Référent implicite du sujet de ἔδωκεν
  choice: Conserver le pronom « Il » sans identifier explicitement Dieu ni Moïse.
  alternative: Traduire « Dieu leur a donné » ou « Moïse leur a donné ».
  rationale: Le grec laisse le sujet sous-entendu. Le contexte scripturaire peut orienter son identification, mais la traduction préserve ici cette implicitation, importante pour la réponse de Jésus au verset suivant.
translation_notes:
  register: Français international moderne, digne et accessible. « Nos pères » maintient la formulation historique du grec; « comme il est écrit » reprend l’expression biblique française courante. La ponctuation française et les guillemets français signalent clairement la citation.
