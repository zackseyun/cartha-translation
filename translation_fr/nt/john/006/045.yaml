  to: 'Il est écrit dans les Prophètes : « Ils seront tous enseignés par Dieu[a]. » Quiconque a entendu le Père et a appris de lui vient à moi.'
  rationale: La révision rétablit le verbe « apprendre » pour μαθών et exprime clairement que l’écoute et l’apprentissage procèdent du Père, sans préciser le mécanisme théologique de cette relation. La note est simplifiée afin de supprimer une tournure littérale non idiomatique.
