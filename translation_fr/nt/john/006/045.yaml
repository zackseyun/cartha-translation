review_pass:
  verdict: revise
  source_fidelity: La citation est bien rendue, de même que « dans les Prophètes » et le présent « vient à moi ». En revanche, « a reçu son enseignement » explicite et reformule μαθών (« ayant appris »), tandis que « a entendu le Père » ne marque pas aussi clairement la provenance exprimée par παρὰ τοῦ πατρός. Une formulation qui maintient les deux participes et leur source est préférable.
  naturalness: Le français est globalement naturel et d’un registre adapté. « Quiconque a entendu le Père et a appris de lui » est idiomatique, plus proche du grec, et évite l’expansion interprétative « reçu son enseignement ».
  terminology: « Les Prophètes », « Dieu », « le Père » et « moi » conviennent au contexte johannique. La note actuelle contient l’expression française non idiomatique « enseignés de Dieu » sous l’étiquette « littéralement » ; elle doit être supprimée. La construction grecque est rendue naturellement par « enseignés par Dieu ».
  issues:
  - severity: medium
    issue: Reformulation expansive de μαθών et rendu incomplet de παρὰ τοῦ πατρός
    rationale: « A reçu son enseignement » ajoute l’idée de réception d’un enseignement possessif et ne reproduit pas directement « a appris ». La coordination grecque présente ceux qui ont entendu et appris auprès/de la part du Père. « A entendu le Père et a appris de lui » conserve les deux actions sans développement doctrinal.
  - severity: low
    issue: 'Mention de « littéralement : enseignés de Dieu » dans la note'
    rationale: « Enseignés de Dieu » n’est pas une formulation française moderne naturelle, et ne constitue pas une littéralité française utile. La note peut conserver une variante française idiomatique sans cette assertion.
  revised_text: 'Il est écrit dans les Prophètes : « Ils seront tous enseignés par Dieu[a]. » Quiconque a entendu le Père et a appris de lui vient à moi.'
  revised_footnotes:
