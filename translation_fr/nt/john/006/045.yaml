    text: 'Ou : « Ils seront tous instruits par Dieu. »'
    reason: Variante lexicale française naturelle pour la construction διδακτοὶ θεοῦ, sans modifier le sens d’un enseignement dont Dieu est la source ou l’agent.
  revision_rationale: La révision rétablit le verbe « apprendre » pour μαθών et exprime clairement que l’écoute et l’apprentissage procèdent du Père, sans préciser le mécanisme théologique de cette relation. La note est simplifiée afin de supprimer une tournure littérale non idiomatique.
