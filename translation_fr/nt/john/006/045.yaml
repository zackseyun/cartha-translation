reference: John 6:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: fr
  text: 'Il est écrit dans les Prophètes : « Ils seront tous enseignés par Dieu[a]. » Quiconque a entendu le Père et a appris de lui vient à moi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils seront tous instruits par Dieu. »'
    reason: Variante lexicale française naturelle pour la construction διδακτοὶ θεοῦ, sans modifier le sens d’un enseignement dont Dieu est la source ou l’agent.
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: Il est écrit
  rationale: Formule française naturelle et consacrée qui rend le parfait périphrastique et l’autorité durable du texte cité.
- source_word: ἐν τοῖς προφήταις
  choice: dans les Prophètes
  rationale: La majuscule signale vraisemblablement la collection reconnue des écrits prophétiques, plutôt que les prophètes envisagés seulement comme personnes.
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: Ils seront tous enseignés par Dieu
  rationale: Cette formulation conserve le futur et rend θεοῦ comme l’agent ou la source de l’enseignement, sans obscurcir la phrase.
- source_word: πᾶς ὁ
  choice: Quiconque
  rationale: Rend naturellement en français la portée générique du singulier substantivé.
- source_word: ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν
  choice: a entendu le Père et a reçu son enseignement
  rationale: Παρά avec le génitif peut marquer la source, mais en français « entendre du Père » serait ambigu ou peu naturel. La formulation choisie conserve deux actes distincts — entendre et apprendre — tout en explicitant naturellement la relation pédagogique.
- source_word: ἔρχεται πρὸς ἐμέ
  choice: vient à moi
  rationale: Rend directement le présent et le mouvement personnel vers Jésus.
theological_decisions:
- issue: Rapport entre l’enseignement divin et la venue à Jésus
  choice: 'La phrase maintient la séquence du texte : entendre le Père, recevoir son enseignement, venir à Jésus.'
  alternative: Préciser soit une causalité déterministe, soit une coopération humaine autonome.
  rationale: Le grec affirme ce rapport sans en exposer le mécanisme métaphysique; la traduction préserve donc la tension théologique.
- issue: Relation entre le Père et Jésus
  choice: Les désignations « le Père » et « moi » sont conservées sans développement explicatif.
  alternative: Ajouter une formulation doctrinale précisant leur relation.
  rationale: Le texte affirme que l’enseignement reçu du Père conduit à Jésus, mais cette phrase seule n’explicite pas davantage cette relation.
translation_notes:
  register: Français international moderne, digne et accessible. « Les Prophètes » garde la portée scripturaire de la formule de citation. La répétition d’« enseignés » puis « enseignement » reflète le lien lexical entre διδακτοί et μαθών sans produire une phrase excessivement littérale.
