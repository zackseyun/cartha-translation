source:
  edition: SBLGNT
  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: fr
  text: Et si vous voyiez donc le Fils de l’homme monter là où il était auparavant ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et si vous voyiez le Fils de l’homme monter là où il était auparavant… » Le grec présente une question conditionnelle rhétorique dont la conséquence reste inexprimée.'
    reason: ambiguïté syntaxique et alternative de traduction
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: Et si donc
  rationale: Cette formulation française conserve à la fois la valeur conditionnelle de ἐὰν et la portée inférentielle de οὖν, tout en introduisant naturellement la question rhétorique.
- source_word: θεωρῆτε
  choice: vous voyiez
  rationale: Le verbe désigne ici le fait de voir ou d’être témoin. L’imparfait après « si » rend naturellement en français l’éventualité prospective de la construction grecque.
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Cette désignation reconnue de Jésus préserve les résonances scripturaires et messianiques de l’expression grecque sans la paraphraser.
- source_word: ἀναβαίνοντα
  choice: monter
  rationale: Le participe exprime un mouvement ascendant. Après « voir », l’infinitif français restitue naturellement la construction grecque et laisse au contexte sa portée céleste possible.
- source_word: ὅπου ἦν τὸ πρότερον
  choice: là où il était auparavant
  rationale: La formulation conserve l’indication d’un lieu ou état antérieur ainsi que l’antériorité temporelle, sans préciser ce que le grec ne nomme pas explicitement.
theological_decisions:
- issue: Faut-il expliciter que l’ascension renvoie à la préexistence céleste de Jésus et à son retour auprès du Père ?
  choice: Conserver « là où il était auparavant » sans ajout explicatif.
  alternative: « monter au ciel, là où il était auparavant » ou « retourner auprès du Père »
  rationale: Le grec implique fortement une existence antérieure et une montée, mais ne nomme explicitement ici ni le ciel ni le Père. La traduction laisse donc intacte la force christologique de l’énoncé sans en développer l’interprétation.
- issue: Comment conserver le caractère suspendu de la question conditionnelle grecque ?
  choice: Employer « Et si donc… ? »
  alternative: Compléter implicitement par « qu’en sera-t-il ? » ou « que direz-vous ? »
  rationale: L’apodose demeure inexprimée en grec. La phrase française garde cette tension rhétorique au lieu de fournir une conclusion absente du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Monter » est plus naturel que « s’élever » ou « monter vers » et n’ajoute aucune destination absente du grec. « Auparavant » restitue avec clarté τὸ πρότερον.
