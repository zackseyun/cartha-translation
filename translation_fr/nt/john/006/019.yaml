  variant: modern international French
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: fr
  text: Après avoir ramé environ vingt-cinq ou trente stades[a], ils voient Jésus marcher sur la mer[b] et s’approcher du bateau, et ils prennent peur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le stade était une ancienne unité de longueur. Vingt-cinq ou trente stades correspondent à environ cinq ou six kilomètres.
    reason: cultural_note
  - marker: b
    text: 'On peut aussi traduire : « marcher sur l’eau ». Le grec dit littéralement : « marcher sur la mer ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: Après avoir ramé
  rationale: Dans ce contexte nautique, ἐλαύνω désigne l’action de faire avancer le bateau à la rame. La tournure « après avoir ramé » exprime naturellement l’antériorité du participe parfait par rapport au verbe principal.
- source_word: οὖν
  choice: Après avoir…
  rationale: La progression narrative portée par οὖν est ici intégrée à l’enchaînement français. Une traduction explicite par « donc » alourdirait la phrase sans apporter de relation logique supplémentaire nette.
- source_word: ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: sur une distance d’environ vingt-cinq ou trente stades
  rationale: ὡς marque l’approximation. Le maintien de l’unité antique « stade » reste proche du texte source, tandis qu’une note fournit l’équivalent moderne.
- source_word: θεωροῦσιν
  choice: ils voient
  rationale: Le présent narratif grec est conservé en français pour rendre la vivacité du récit. « Voir » exprime clairement la perception sans archaïsme.
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: marcher sur la mer
  rationale: La formulation traduit directement θάλασσα par « mer » et ἐπί par « sur », sans atténuer le caractère saisissant de la scène.
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: s’approcher du bateau
  rationale: La construction avec γίνομαι et ἐγγύς indique l’entrée dans la proximité, donc un mouvement d’approche plutôt qu’une position statique.
- source_word: πλοίου
  choice: bateau
  rationale: « Bateau » convient mieux que « navire » à l’embarcation du contexte galiléen et appartient au français courant.
- source_word: ἐφοβήθησαν
  choice: ils prennent peur
  rationale: Cette expression idiomatique rend la réaction ponctuelle exprimée par l’aoriste, tout en restant naturelle en français moderne.
theological_decisions:
- issue: Description du miracle sans en atténuer le sens direct
  choice: marcher sur la mer
  alternative: marcher sur l’eau
  rationale: Le grec emploie θάλασσα, « mer ». « Sur la mer » préserve donc sa formulation et son sens contextuel, sans substituer une expression explicative ni suggérer qu’il marche seulement au bord de la mer.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif (« ils voient ») conserve la vivacité du grec. L’unité antique est maintenue dans le texte avec une conversion métrique en note.
