  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: fr
  text: Mais des barques[a] arrivèrent de Tibériade près de l’endroit où ils avaient mangé le pain après que le Seigneur eut rendu grâce.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « de petites barques ». Le grec emploie ici une forme diminutive.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Cependant
  rationale: Marque le contraste avec la situation décrite au verset précédent, dans un français narratif naturel.
- source_word: ἦλθεν
  choice: arrivèrent
  rationale: Dans ce contexte de déplacement depuis Tibériade, « arrivèrent » exprime clairement l’aboutissement du trajet.
- source_word: πλοιάρια
  choice: barques
  rationale: Le diminutif grec peut désigner de petites embarcations, mais « barques » est naturel et garde déjà l’idée d’embarcations modestes; la nuance morphologique est signalée en note.
- source_word: ἐκ Τιβεριάδος
  choice: de Tibériade
  rationale: Rend simplement et naturellement l’origine des barques.
- source_word: ἐγγὺς τοῦ τόπου
  choice: près de l’endroit
  rationale: Expression idiomatique de la proximité spatiale.
- source_word: ὅπου
  choice: où
  rationale: Relatif de lieu courant et direct en français.
- source_word: ἔφαγον τὸν ἄρτον
  choice: ils avaient mangé le pain
  rationale: Le plus-que-parfait situe naturellement ce repas avant l’arrivée des barques, tandis que l’article désigne le pain déjà mentionné.
- source_word: εὐχαριστήσαντος
  choice: après que … avait rendu grâce
  rationale: Rend l’antériorité de l’action participiale par rapport au fait de manger, sans alourdir la phrase.
- source_word: τοῦ κυρίου
  choice: le Seigneur
  rationale: Conserve le titre honorifique et sa portée christologique dans le récit johannique.
theological_decisions:
- issue: Traduction de κύριος appliqué à Jésus
  choice: le Seigneur
  alternative: le maître
  rationale: « Le Seigneur » préserve le titre narratif et sa résonance christologique sans ajouter une interprétation absente du texte.
translation_notes:
  register: Français international moderne, narratif et digne. Le plus-que-parfait clarifie la chronologie du récit; la formulation conserve le lien entre l’action de grâce du Seigneur et le repas sans expliciter davantage leur rapport.
