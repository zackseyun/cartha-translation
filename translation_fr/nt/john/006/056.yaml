id: JHN.6.56
reference: John 6:56
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: fr
  text: Celui qui mange[a] ma chair et boit mon sang demeure[b] en moi, et moi en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le verbe grec peut aussi évoquer l’action de « se nourrir de » ou de « mâcher »; il est plus concret que le terme général pour manger.
    reason: lexical_alternative
  - marker: b
    text: 'On peut aussi traduire : « reste ». « Demeure » reprend un verbe caractéristique de l’Évangile selon Jean.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: Celui qui mange
  rationale: L’article suivi du participe présent a une valeur substantivée et désigne une personne caractérisée par cette action. « Celui qui mange » conserve le singulier et rend naturellement l’aspect continu dans ce contexte.
- source_word: τρώγων
  choice: mange
  rationale: τρώγω peut être plus concret ou expressif que le verbe grec courant pour « manger », avec des nuances possibles comme « mâcher » ou « se nourrir de ». « Mange » reste toutefois le choix français le plus naturel sans accentuer indûment une nuance discutée; celle-ci est signalée en note.
- source_word: μου τὴν σάρκα
  choice: ma chair
  rationale: La formulation concrète « ma chair » reproduit directement σάρξ et préserve l’imagerie incarnée et sacrificielle du discours sans la transformer en explication doctrinale.
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: et boit mon sang
  rationale: Le participe présent coordonné est rendu parallèlement et sans atténuer l’expression frappante du grec.
- source_word: ἐν ἐμοὶ μένει
  choice: demeure en moi
  rationale: μένω est un verbe majeur du vocabulaire johannique. « Demeure » exprime ici la continuité relationnelle, reste naturel dans un registre biblique digne et évite une paraphrase théologique.
- source_word: κἀγὼ ἐν αὐτῷ
  choice: et moi en lui
  rationale: Le grec sous-entend le verbe dans le second membre. La traduction conserve cette ellipse claire et expressive plutôt que de répéter « demeure ».
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom masculin singulier reprend « celui qui mange » et respecte la forme grammaticale du texte source.
theological_decisions:
- issue: Interprétation eucharistique ou métaphorique du fait de manger la chair et de boire le sang
  choice: Conserver les termes concrets « mange ma chair » et « boit mon sang » sans ajout explicatif.
  alternative: Expliciter soit une lecture sacramentelle, soit une lecture métaphorique centrée sur la foi.
  rationale: Le grec maintient cette image forte sans trancher ici entre les interprétations confessionnelles. La traduction préserve donc la tension théologique du passage.
- issue: Langage johannique de l’habitation mutuelle
  choice: Rendre μένει par « demeure » et conserver l’ellipse « et moi en lui ».
  alternative: Paraphraser par « est uni à moi » ou répéter explicitement « et moi, je demeure en lui ».
  rationale: « Demeure » préserve l’idée johannique de continuité et de réciprocité sans l’enfermer dans une formulation doctrinale ultérieure; l’ellipse reflète la concision du grec.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le parallélisme et l’ellipse du grec. Le vocabulaire concret n’atténue ni ne développe l’imagerie du verset.
