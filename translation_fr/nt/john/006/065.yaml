- from: 'Et il disait : « Voilà pourquoi je vous ai dit que personne ne peut venir à moi si cela ne lui a pas été donné par le Père.[a] »'
  to: 'Et il disait : « Voilà pourquoi je vous ai dit que personne ne peut venir à moi si cela ne lui a pas été donné de la part du Père.[a] »'
  rationale: La révision limitée remplace « par le Père » par « de la part du Père » afin de rendre la provenance exprimée par ἐκ, sans transformer la déclaration en explication théologique. La note est reformulée comme une véritable variante lexicale et son ancrage est conservé.
