source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: fr
  text: 'Et il disait : « Voilà pourquoi je vous ai dit que personne ne peut venir à moi si cela ne lui a pas été donné de la part du Père.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « si cela ne lui a pas été accordé de la part du Père ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: il disait
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme reprise dans le discours; l’imparfait français la restitue naturellement.
- source_word: Διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Cette expression renvoie à ce qui précède et introduit l’explication; « Voilà pourquoi » est naturel en français actuel tout en gardant le lien logique.
- source_word: εἴρηκα
  choice: je vous ai dit
  rationale: Le parfait grec désigne une parole antérieure qui demeure pertinente; le passé composé français convient naturellement dans ce contexte.
- source_word: οὐδεὶς δύναται
  choice: personne ne peut
  rationale: La tournure exprime une incapacité, et non une simple absence de permission.
- source_word: ἐλθεῖν πρός με
  choice: venir à moi
  rationale: Cette formulation idiomatique conserve la portée relationnelle johannique sans l’expliciter davantage.
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: si cela ne lui a pas été donné
  rationale: La construction passive périphrastique exprime une condition nécessaire reçue par la personne; « donné » reste proche du sens premier de δίδωμι, tandis que « lui » garde le singulier générique sans marquage de genre en français.
- source_word: ἐκ τοῦ πατρός
  choice: par le Père
  rationale: Bien que ἐκ indique littéralement la provenance, le passif français appelle naturellement ici un complément d’agent; « par le Père » exprime sans ambiguïté que le don vient du Père.
theological_decisions:
- issue: L’action divine et la capacité humaine de venir à Jésus
  choice: Conserver l’affirmation d’une incapacité sans ce qui est donné par le Père, sans préciser la nature ni l’étendue de ce don.
  alternative: Interpréter explicitement ce don comme un appel divin efficace, ou comme une grâce prévenante offerte plus largement.
  rationale: Le grec pose clairement le don du Père comme condition nécessaire, mais ne tranche pas à lui seul les débats théologiques ultérieurs sur le rapport entre l’action divine et la réponse humaine.
- issue: Référent générique de αὐτῷ
  choice: Traduire par « lui », pronom singulier français non marqué quant au genre dans cette construction.
  alternative: Expliciter par « à cette personne ».
  rationale: « Lui » conserve le singulier du grec de façon naturelle, sans imposer en français un masculin lexical inutile.
translation_notes:
  register: Français moderne, international et digne. La phrase reste proche de la syntaxe et de la logique du grec, tout en employant des tournures françaises naturelles. Le démonstratif neutre « cela » préserve l’absence d’objet explicitement nommé dans la construction grecque.
