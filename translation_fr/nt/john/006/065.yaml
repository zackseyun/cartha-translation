review_pass:
  verdict: revise
  source_fidelity: La phrase rend correctement l’imparfait ἔλεγεν, le parfait εἴρηκα, l’incapacité exprimée par οὐδεὶς δύναται et la condition passive δεδομένον. Toutefois, « par le Père » traduit plus naturellement un agent, alors que ἐκ τοῦ πατρός indique la provenance (« de la part du Père »).
  naturalness: Le français est moderne, clair et d’un registre approprié. « Voilà pourquoi », « je vous ai dit », « personne ne peut venir à moi » et l’imparfait « il disait » sont recevables dans une traduction à équivalence optimale.
  terminology: « Le Père » est le terme johannique approprié. « Cela » conserve prudemment l’objet implicite de δεδομένον, et « lui » maintient le singulier générique sans ajouter d’interprétation théologique.
  issues:
  - severity: medium
    issue: Le complément « par le Père » ne préserve pas pleinement la valeur de provenance de ἐκ τοῦ πατρός.
    rationale: Le grec dit littéralement que ce qui est donné vient « du Père ». En français, « de la part du Père » est naturel tout en conservant cette relation de source; « par le Père » oriente davantage vers l’agent du passif.
  - severity: medium
    issue: La note qualifie à tort de « littéralement » une reformulation qui ajoute « venant » et ne reproduit pas exactement la formulation grecque.
    rationale: Une note d’alternative doit éviter une étiquette de littéralité imprécise. Elle peut proposer « accordé » comme variante lexicale tout en gardant la provenance exprimée par « de la part du Père ».
  revised_text: 'Et il disait : « Voilà pourquoi je vous ai dit que personne ne peut venir à moi si cela ne lui a pas été donné de la part du Père.[a] »'
  revised_footnotes:
