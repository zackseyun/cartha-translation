id: JHN.6.6
reference: John 6:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: fr
  text: Mais il disait cela pour le mettre à l’épreuve[a], car lui-même savait ce qu’il allait faire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour l’éprouver » ; le verbe peut aussi signifier « tenter », mais ici il s’agit de mettre Philippe à l’épreuve.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: cela
  rationale: Le démonstratif renvoie à la question que Jésus vient de poser; «cela» est naturel en français dans ce contexte narratif.
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un léger contraste explicatif avec la question précédente.
- source_word: ἔλεγεν
  choice: disait
  rationale: L’imparfait français correspond naturellement à l’aspect imperfectif du verbe grec sans alourdir la narration.
- source_word: πειράζων αὐτόν
  choice: pour le mettre à l’épreuve
  rationale: Le participe exprime ici le but de la parole de Jésus. Dans le contexte, il s’agit d’éprouver Philippe, non de l’inciter au mal.
- source_word: αὐτὸς
  choice: lui-même
  rationale: Le pronom grec explicite est emphatique; «lui-même» conserve cette insistance.
- source_word: γὰρ
  choice: car
  rationale: La conjonction introduit l’explication de la démarche de Jésus dans un registre digne et naturel.
- source_word: ᾔδει
  choice: savait
  rationale: Bien que la forme grecque soit historiquement un plus-que-parfait, elle a ici une valeur stative d’imparfait; «savait» convient au récit français.
- source_word: τί ἔμελλεν ποιεῖν
  choice: ce qu’il allait faire
  rationale: Cette formulation rend le caractère futur et imminent ou projeté exprimé par μέλλω avec l’infinitif, sans trancher excessivement entre intention et imminence.
theological_decisions:
- issue: Sens de πειράζων appliqué à l’action de Jésus envers Philippe
  choice: mettre à l’épreuve
  alternative: tenter
  rationale: Le contexte présente Jésus comme éprouvant la compréhension ou la foi de Philippe, et non comme l’incitant à pécher. La note préserve toutefois l’étendue lexicale du verbe.
- issue: Insistance sur la connaissance préalable de Jésus
  choice: il savait lui-même
  alternative: il savait
  rationale: La traduction garde l’emphase portée par αὐτός sans développer le texte en affirmation doctrinale supplémentaire.
translation_notes:
  register: Français international moderne, clair et digne. L’imparfait «disait» restitue l’aspect narratif grec; «mettre à l’épreuve» est idiomatique et évite la connotation morale trompeuse que pourrait avoir «tenter» dans ce contexte.
