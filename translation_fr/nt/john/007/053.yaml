  text: And[a] each went to his own home.
translation:
  language: fr
  text: Et[a] chacun s’en alla chez lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ce verset ouvre le récit de la femme surprise en adultère (Jean 7.53–8.11). L’ensemble du passage est absent des plus anciens manuscrits grecs, notamment de papyrus du IIIe siècle ainsi que des codex Sinaïticus et Vaticanus du IVe siècle, et il manque aussi dans d’anciennes traductions coptes et syriaques. Il figure dans le Codex de Bèze du Ve siècle, dans la tradition latine et dans la tradition majoritaire byzantine plus tardive. Certains manuscrits placent ce récit ailleurs, par exemple après Jean 21.25 ou après Luc 21.38, ce qui suggère qu’il a pu circuler comme une tradition indépendante avant d’être intégré à la transmission manuscrite. Il est conservé ici en raison de la place importante qu’il occupe depuis environ quinze siècles dans la lecture chrétienne, la théologie et l’accompagnement pastoral.
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: Puis
  rationale: Dans ce contexte narratif, Καί marque la suite des événements. « Puis » est plus naturel en français que le calque « Et » tout en conservant la liaison avec ce qui précède.
- source_word: ἐπορεύθη
  choice: rentra
  rationale: Le verbe désigne ici le déplacement de chacun vers sa propre demeure. Avec le complément « chez lui », « rentra » exprime naturellement en français l'idée d'aller ou de retourner à son domicile.
- source_word: ἕκαστος
  choice: chacun
  rationale: Le singulier distributif souligne que les personnes se dispersent individuellement.
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: chez lui
  rationale: Cette expression grecque signifie idiomatiquement se rendre à sa propre demeure. « Chez lui » est la formulation française courante et évite le calque moins naturel « dans sa maison ».
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La phrase reste concise et narrative. « Puis » assure la continuité, tandis que « chacun rentra chez lui » rend l’idiome grec de manière naturelle.
