id: JHN.7.22
reference: John 7:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: fr
  text: Voilà pourquoi Moïse vous a donné la circoncision — non qu’elle vienne de Moïse, mais des pères[a] — et vous circoncisez un homme le jour du sabbat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'C’est-à-dire des patriarches : la circoncision n’a pas commencé avec Moïse, mais existait déjà chez les ancêtres d’Israël.'
    reason: Clarification du référent historique de « les pères » et de la parenthèse.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Voilà pourquoi
  rationale: Connecteur causal naturel en français moderne, qui conserve la valeur explicative de l’expression grecque.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française traditionnelle et courante du nom biblique.
- source_word: δέδωκεν
  choice: a donné
  rationale: Le passé composé rend naturellement le parfait grec et suggère qu’un don établi dans le passé demeure pertinent pour les interlocuteurs.
- source_word: τὴν περιτομήν
  choice: la circoncision
  rationale: Équivalent direct désignant l’institution et la pratique de la circoncision.
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: non qu’elle vienne de Moïse, mais des pères
  rationale: Cette formulation conserve la parenthèse explicative, l’idée d’origine exprimée par ἐκ et le terme biblique « les pères », sans expliciter davantage que le grec.
- source_word: ἐν σαββάτῳ
  choice: le jour du sabbat
  rationale: Expression temporelle idiomatique en français, appliquée ici à la pratique générale évoquée.
- source_word: περιτέμνετε
  choice: vous circoncisez
  rationale: Le présent rend directement l’indicatif grec et sa valeur de pratique habituelle.
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Dans le contexte concret de la circoncision, le référent est masculin; « un homme » préserve cette précision.
theological_decisions:
- issue: Référence de « les pères » dans la précision parenthétique
  choice: Conserver « les pères », avec une note indiquant qu’il s’agit des patriarches, chez qui la circoncision précède Moïse.
  alternative: Traduire directement par « les patriarches » ou, plus largement, par « les ancêtres ».
  rationale: Le texte situe l’origine de la circoncision avant Moïse. Garder l’expression littérale dans le corps du verset préserve son registre et sa portée, tandis que la note éclaire le référent sans intégrer une interprétation explicative au texte.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation par tirets maintient la parenthèse du grec. « Voilà pourquoi » assure une transition idiomatique; « les pères » conserve le registre biblique et reçoit une brève clarification en note.
