id: JHN.7.32
reference: John 7:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: fr
  text: Les pharisiens entendirent la foule murmurer ces propos à son sujet[a], et les grands prêtres et les pharisiens envoyèrent des gardes[b] pour se saisir de lui[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parler à voix basse », voire « protester à voix basse ». Le verbe grec peut évoquer des propos discrets empreints de mécontentement.
    reason: lexical_alternative
  - marker: b
    text: Ou « des agents » ou « des gardes du Temple ». Le terme grec désigne des auxiliaires officiels envoyés par les autorités juives.
    reason: lexical_alternative
  - marker: c
    text: Ou « pour l’arrêter ». Le grec dit plus littéralement « pour se saisir de lui ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: entendirent
  rationale: L’aoriste indique ici que les pharisiens eurent connaissance des propos tenus par la foule. « Entendirent » est direct, naturel et fidèle.
- source_word: τοῦ ὄχλου
  choice: la foule
  rationale: Dans ce contexte, ὄχλος désigne l’ensemble des personnes rassemblées. « La foule » est l’équivalent moderne le plus clair.
- source_word: γογγύζοντος
  choice: murmurer
  rationale: Le verbe évoque des propos tenus à voix basse, avec une nuance possible de mécontentement. « Murmurer » conserve cette discrétion sans imposer une hostilité plus forte que ne l’exige le contexte.
- source_word: περὶ αὐτοῦ ταῦτα
  choice: ces propos à son sujet
  rationale: « Ces propos » reprend naturellement en français le pluriel ταῦτα et renvoie à ce que la foule disait précédemment; « à son sujet » rend περί avec le génitif.
- source_word: οἱ ἀρχιερεῖς
  choice: les grands prêtres
  rationale: Au pluriel, l’expression désigne les principaux membres de l’aristocratie sacerdotale, et non plusieurs titulaires simultanés de la fonction de grand prêtre. « Les grands prêtres » est l’appellation française traditionnelle et historiquement appropriée.
- source_word: ἀπέστειλαν
  choice: envoyèrent
  rationale: Le simple « envoyèrent » rend exactement l’aoriste de ἀποστέλλω et convient au registre narratif.
- source_word: ὑπηρέτας
  choice: des gardes
  rationale: Dans Jean, le terme désigne ici des auxiliaires officiels chargés d’exécuter les ordres des autorités. « Gardes » exprime clairement leur fonction sans préciser au-delà du grec leur statut administratif exact.
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: pour se saisir de lui
  rationale: La construction exprime le but, et πιάζω signifie prendre ou saisir quelqu’un. Cette formulation conserve l’image concrète de l’appréhension sans la réduire d’emblée à une procédure juridique formelle.
theological_decisions:
- issue: Identité institutionnelle des ὑπηρέται
  choice: des gardes au service des autorités religieuses
  alternative: des agents, des serviteurs ou la police du Temple
  rationale: Le contexte montre qu’ils sont envoyés officiellement pour appréhender Jésus. « Gardes » préserve cette fonction institutionnelle sans affirmer explicitement une appartenance à la police du Temple que le mot grec, à lui seul, ne précise pas.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple maintient le registre narratif biblique sans archaïsme lexical. « Ces propos » rend le pluriel grec de façon plus naturelle que « ces choses », tandis que les notes préservent les principales nuances lexicales.
