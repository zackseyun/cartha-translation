source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: fr
  text: 'Pourtant, beaucoup de gens de la foule crurent en lui et disaient : « Quand le Messie[a] viendra, fera-t-il vraiment davantage de signes que cet homme en a fait ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le titre grec Χριστός est rendu ici par « Messie », puisqu’il est employé comme titre dans un contexte messianique juif.'
    reason: Conserve l’autre traduction traditionnelle du titre grec et explique le choix de « Messie » dans ce contexte.
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: Pourtant, beaucoup de gens dans la foule
  rationale: « Pourtant » marque le léger contraste introduit par δέ, tandis que « beaucoup de gens dans la foule » exprime naturellement le groupe nombreux issu de la foule.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: crurent en lui
  rationale: Cette formulation rend directement la foi personnelle orientée vers Jésus sans renforcer le sens par une paraphrase.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait français conserve l’aspect continu ou répété de l’imparfait grec.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Dans ce contexte juif, χριστός est clairement un titre désignant celui dont la venue est attendue ; « le Messie » en restitue naturellement la portée.
- source_word: ὅταν ἔλθῃ
  choice: Quand le Messie viendra
  rationale: La construction évoque une éventualité future attendue, que le français exprime idiomatiquement par « quand » suivi du futur.
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: fera-t-il plus de signes
  rationale: La question rhétorique appelle une réponse négative. La tournure interrogative française, dans son contexte comparatif, en conserve la force sans l’expliciter excessivement.
- source_word: σημεῖα
  choice: signes
  rationale: « Signes » préserve le vocabulaire johannique et sa portée révélatrice, contrairement à « miracles », plus explicatif.
- source_word: ὧν οὗτος ἐποίησεν
  choice: que cet homme n’en a fait
  rationale: « Cet homme » rend naturellement οὗτος dans la parole de la foule. Le passé composé présente les signes déjà accomplis, et le « ne » explétif convient à la comparaison sans introduire de négation réelle.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme fonctionne ici comme un titre dans l’attente juive de celui qui doit venir. « Messie » est donc retenu dans le texte, tandis que « le Christ » est signalé en note comme équivalent traditionnel.
- issue: Valeur de la question introduite par μή
  choice: Question rhétorique suggérant que le Messie ne ferait pas davantage de signes
  alternative: Question future neutre
  rationale: 'μή indique normalement qu’une réponse négative est attendue. La traduction garde la forme interrogative et laisse subsister la tension : la foule raisonne à partir des signes de Jésus sans que le narrateur formule lui-même sa conclusion.'
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple « crurent » convient au récit écrit, tandis que l’imparfait « disaient » conserve l’action en cours. La question reste concise et rhétorique ; le vocabulaire johannique « signes » est maintenu.
