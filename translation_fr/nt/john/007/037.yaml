id: JHN.7.37
reference: John 7:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: fr
  text: 'Le dernier jour, le grand jour de la fête, Jésus, debout, s’écria : « Si quelqu’un a soif, qu’il vienne à moi et qu’il boive. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: Le dernier jour
  rationale: La préposition avec le datif situe l’action dans le temps. δέ est un lien discursif léger qu’il n’est pas nécessaire de rendre explicitement en français. « Le dernier jour » est naturel et n’ajoute pas de portée eschatologique étrangère au contexte.
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: le grand jour de la fête
  rationale: μέγας qualifie le jour de manière emphatique. « Le grand jour de la fête » conserve cette insistance ainsi que le cadre festif johannique.
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: Jésus, debout
  rationale: Le plus-que-parfait grec décrit ici Jésus dans la posture debout. La tournure française évite de suggérer qu’il venait seulement de se lever et maintient cette posture comme cadre de sa proclamation publique.
- source_word: ἔκραξεν λέγων
  choice: s’écria
  rationale: κράζω indique une prise de parole forte et publique. En français, « s’écria » exprime naturellement cette intensité; le participe λέγων peut rester implicite avant le discours direct sans perte de sens.
- source_word: Ἐάν τις διψᾷ
  choice: Si quelqu’un a soif
  rationale: τις est indéfini et générique. « Si quelqu’un a soif » est une formulation française courante qui conserve l’ouverture métaphorique de l’image.
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: qu’il vienne à moi et qu’il boive
  rationale: Les deux impératifs présents coordonnés sont rendus par deux subjonctifs à valeur injonctive. Le pronom masculin singulier reprend grammaticalement l’indéfini singulier « quelqu’un » sans limiter l’invitation aux hommes.
theological_decisions:
- issue: Portée métaphorique de la soif et de l’action de boire
  choice: Conserver littéralement « a soif » et « boive »
  alternative: Expliciter par une formulation telle que « aspire à la vie » ou « reçoive l’Esprit »
  rationale: Le verset formule l’invitation au moyen d’une image que le contexte développe. L’expliciter dans le texte principal résoudrait prématurément sa portée théologique.
- issue: Expression générique singulière après τις
  choice: « quelqu’un… qu’il »
  alternative: Employer une reformulation plurielle ou épicène
  rationale: En français, « quelqu’un » est grammaticalement masculin singulier et « qu’il » en est la reprise naturelle; cette construction demeure générique et ne constitue pas une restriction de sexe.
translation_notes:
  register: Français international moderne, digne et accessible. La ponctuation du discours direct est idiomatique. Aucun marqueur de note n’est requis, puisque l’emploi de « quelqu’un… qu’il » est naturellement générique en français et ne crée pas l’alternative inclusive propre à l’anglais.
