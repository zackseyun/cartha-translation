id: JHN.7.13
reference: John 7:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: fr
  text: Pourtant, personne ne parlait ouvertement de lui, par peur des Juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans ce contexte, il peut s’agir plus précisément des chefs juifs ou des autorités judéennes. Chez Jean, « les Juifs » peut désigner l’ensemble du peuple juif ou, dans certains passages, les autorités de Jérusalem opposées à Jésus.
    reason: Préciser la portée contextuelle possible de Ἰουδαῖοι et prévenir une généralisation anachronique ou antijuive.
lexical_decisions:
- source_word: οὐδεὶς
  choice: personne ne
  rationale: Rend directement le pronom négatif grec et désigne de façon globale les personnes présentes.
- source_word: μέντοι
  choice: Pourtant
  rationale: Marque le léger contraste avec les avis exprimés auparavant dans la foule.
- source_word: παρρησίᾳ
  choice: ouvertement
  rationale: Exprime ici une parole publique et sans dissimulation, plutôt que la seule hardiesse.
- source_word: ἐλάλει
  choice: parlait
  rationale: L’imparfait français restitue naturellement l’aspect imperfectif du verbe grec dans la scène.
- source_word: περὶ αὐτοῦ
  choice: de lui
  rationale: « Parler de lui » est la tournure idiomatique française correspondant à περί avec le génitif.
- source_word: διὰ τὸν φόβον
  choice: par peur de
  rationale: Rend la cause exprimée par διά avec l’accusatif tout en conservant la construction nominale et un français naturel.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Conserve le terme grec sans en restreindre silencieusement la portée; la note précise son référent contextuel probable dans l’Évangile selon Jean.
theological_decisions:
- issue: Référent de τῶν Ἰουδαίων dans le récit johannique
  choice: « des Juifs » dans le texte, avec une note explicative
  alternative: « des chefs juifs » ou « des autorités judéennes »
  rationale: La formulation directe préserve l’ambiguïté lexicale du grec. Dans ce contexte, il s’agit vraisemblablement plus précisément des autorités juives de Judée ou de Jérusalem opposées à Jésus; la note évite qu’on comprenne abusivement tous les Juifs sans imposer cette précision au texte principal.
translation_notes:
  register: Français international moderne, clair et digne. La phrase conserve l’imparfait narratif et la relative sobriété de l’original; « par peur de » est idiomatique sans effacer la construction causale grecque.
