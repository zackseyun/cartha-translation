id: JHN.7.19
reference: John 7:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: fr
  text: Moïse ne vous a-t-il pas donné la Loi ? Pourtant, aucun de vous ne met la Loi en pratique[a]. Pourquoi cherchez-vous à me tuer ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « ne fait pas la Loi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: ne vous a-t-il pas donné
  rationale: La question introduite par οὐ attend une réponse affirmative. Le passé composé français rend naturellement le parfait grec et maintient la portée rhétorique.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française traditionnelle et actuelle du nom propre.
- source_word: τὸν νόμον
  choice: la Loi
  rationale: Avec Moïse explicitement nommé, le terme désigne ici la Loi mosaïque, ou Torah. La majuscule rend ce référent précis immédiatement perceptible en français.
- source_word: καὶ
  choice: Pourtant
  rationale: Dans ce contexte, καί introduit un contraste entre le don de la Loi et le fait que les interlocuteurs ne l'observent pas.
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: aucun de vous
  rationale: Équivalent français naturel qui conserve la négation totale.
- source_word: ποιεῖ τὸν νόμον
  choice: met la Loi en pratique
  rationale: Le grec dit littéralement « fait la Loi ». En français contemporain, « mettre la Loi en pratique » exprime clairement l'idée d'en accomplir les prescriptions sans réduire le sens à une simple conservation.
- source_word: τί
  choice: Pourquoi
  rationale: Avec ζητεῖτε suivi de l'infinitif, τί demande ici la raison de l'action projetée.
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: cherchez-vous à me tuer
  rationale: Cette formulation conserve l'idée d'une intention ou démarche en cours portée par le présent ζητεῖτε, sans l'interpréter davantage comme une tentative effective.
- source_word: ἀποκτεῖναι
  choice: tuer
  rationale: Équivalent direct, clair et actuel du verbe grec.
theological_decisions:
- issue: Référence de « la Loi »
  choice: La Loi mosaïque donnée par l'intermédiaire de Moïse
  alternative: La loi au sens moral général
  rationale: La mention explicite de Moïse détermine naturellement le référent comme étant la Loi mosaïque. La traduction le signale par la majuscule sans ajouter d'explication au corps du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure rhétorique « ne vous a-t-il pas » et l'accusation finale directe préservent la force du grec. « Mettre en pratique » évite l'expression peu idiomatique « faire la Loi », qui pourrait en français être comprise comme imposer son autorité.
