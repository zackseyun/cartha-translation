  source_fidelity: Le parallélisme de ζητεῖ (« recherche »), l’opposition entre la gloire propre et celle de l’envoyeur, l’emphase de οὗτος (« celui-là »), ainsi que ἀληθής et ἀδικία sont globalement bien rendus. Toutefois, en français actuel, « parler de lui-même » signifie spontanément parler à son propre sujet et risque donc de fausser ἀφ’ ἑαυτοῦ, qui concerne la source ou l’initiative de la parole.
  naturalness: La phrase est fluide et d’un registre approprié. « Parle de son propre chef » est l’idiome français clair pour le sens contextuel, tout en laissant la note indiquer les nuances d’initiative et d’autorité. « Il n’y a en lui aucune injustice » est naturel et conserve la portée morale large du grec.
  terminology: « Gloire », « recherche », « celui qui l’a envoyé », « vrai » et « injustice » conviennent au vocabulaire johannique et ne surinterprètent pas le texte. La note proposant « aucun mal » pour ἀδικία est trop large et doit être remplacée par des équivalents qui préservent l’idée d’injustice, d’iniquité ou de tort.
