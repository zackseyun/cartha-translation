  rationale: La révision élimine une ambiguïté idiomatique française susceptible d’inverser le sens de l’expression grecque, tout en maintenant ses nuances possibles en note. Elle resserre également la note sur ἀδικία afin que les variantes proposées restent dans son champ sémantique. Le reste de la formulation est conservé, car il est fidèle, naturel et d’un registre moderne international.
