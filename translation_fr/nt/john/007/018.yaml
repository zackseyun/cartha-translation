id: JHN.7.18
reference: John 7:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: fr
  text: Celui qui parle de son propre chef[a] recherche sa propre gloire ; mais celui qui recherche la gloire de celui qui l’a envoyé, celui-là est vrai[b], et il n’y a en lui aucune injustice[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de lui-même », « de sa propre initiative » ou « de sa propre autorité ».
    reason: lexical_alternative
  - marker: b
    text: Ou « véridique » ou « digne de confiance ».
    reason: lexical_alternative
  - marker: c
    text: Ou « aucune iniquité » ou « aucun tort » ; le terme peut aussi désigner ce qui n’est pas juste.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: de lui-même
  rationale: Cette formulation conserve l’expression grecque et le contraste avec celui qui a envoyé, sans préciser à tort s’il s’agit avant tout de l’origine du message, de l’initiative personnelle ou de l’autorité.
- source_word: λαλῶν
  choice: qui parle
  rationale: Le participe présent substantivé exprime ici une caractéristique générale ; « qui parle » est naturel et fidèle.
- source_word: δόξαν
  choice: gloire
  rationale: « Gloire » maintient le vocabulaire johannique et sa portée théologique, tout en pouvant évoquer l’honneur recherché.
- source_word: τὴν ἰδίαν
  choice: sa propre
  rationale: Cette expression marque clairement l’opposition entre la gloire personnelle et celle de l’envoyeur.
- source_word: ζητεῖ
  choice: recherche
  rationale: « Rechercher » convient au sens de ζητέω et permet de conserver la répétition du même verbe dans les deux propositions.
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: de celui qui l’a envoyé
  rationale: Cette traduction restitue clairement le participe substantivé et l’action personnelle de l’envoyeur.
- source_word: οὗτος
  choice: celui-là
  rationale: « Celui-là » conserve l’insistance du démonstratif grec mieux qu’un simple pronom personnel.
- source_word: ἀληθής
  choice: vrai
  rationale: « Vrai » préserve la formulation concise et le vocabulaire johannique, tout en laissant ouverte la nuance de véracité ou d’authenticité.
- source_word: ἀδικία
  choice: injustice
  rationale: « Injustice » est le correspondant direct et large de ἀδικία ; il désigne ici ce qui est contraire à la justice sans réduire le terme à un acte isolé.
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: il n’y a en lui aucune injustice
  rationale: La tournure française restitue naturellement la construction existentielle et maintient la caractérisation intérieure exprimée par « en lui ».
theological_decisions:
- issue: Le contraste entre parler « de lui-même » et rechercher la gloire de celui qui a envoyé
  choice: Conserver le contraste entre une parole issue de soi et orientée vers sa propre gloire, et une conduite visant la gloire de l’envoyeur.
  alternative: Expliciter « de sa propre autorité » ou limiter le contraste à Jésus face aux faux enseignants.
  rationale: Le contexte porte sur la source et la visée de l’enseignement. La traduction ne transforme pas cette opposition en formulation doctrinale technique et ne restreint pas davantage que le grec sa portée.
- issue: Portée de ἀληθής
  choice: vrai
  alternative: véridique ; digne de confiance
  rationale: « Vrai » conserve l’amplitude du terme, qui peut viser à la fois la véracité, la fiabilité et l’intégrité de la personne.
- issue: Portée morale de ἀδικία
  choice: injustice
  alternative: iniquité ; mal ; fausseté
  rationale: « Injustice » garde le rapport lexical avec ce qui n’est pas juste et évite de réduire la déclaration à la seule fausseté verbale, tout en laissant la note signaler une autre formulation possible.
translation_notes:
  register: Français international moderne, digne et accessible. La structure parallèle et la répétition de « recherche » sont conservées. « Celui-là » garde l’emphase du grec sans alourdir excessivement la phrase.
