id: JHN.7.23
reference: John 7:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: fr
  text: Si un homme reçoit la circoncision[a] le jour du sabbat pour que la loi de Moïse ne soit pas violée[b], êtes-vous en colère contre moi parce que j’ai rendu la santé à un homme tout entier[c] le jour du sabbat ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « est circoncis ». Le grec dit littéralement « reçoit la circoncision ».
    reason: lexical_alternative
  - marker: b
    text: Ou « ne soit pas annulée » ou « ne soit pas abolie ».
    reason: lexical_alternative
  - marker: c
    text: L’expression « un homme tout entier » souligne le contraste entre la circoncision d’une partie du corps et le rétablissement de l’homme dans son intégrité.
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: reçoit la circoncision
  rationale: Cette formulation conserve l’idiome grec tout en restant claire en français. « Est circoncis » serait plus courant, mais expliciterait davantage la valeur passive.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Dans ce contexte, le référent est masculin puisque la circoncision est en vue ; « un homme » est donc plus précis que le générique « une personne ».
- source_word: ἐν σαββάτῳ
  choice: le jour du sabbat
  rationale: Formulation française naturelle pour le datif temporel, qui désigne ici le sabbat comme jour d’observance.
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: pour que la loi de Moïse ne soit pas violée
  rationale: Dans ce contexte juridique, λύω exprime le fait d’enfreindre ou de mettre en échec une prescription. « Violée » est idiomatique et laisse en note les nuances « annulée » ou « abolie ».
- source_word: χολᾶτε
  choice: êtes-vous en colère contre moi
  rationale: Rend directement l’indignation ou la colère exprimée par le verbe sans en exagérer l’intensité.
- source_word: ὅλον ἄνθρωπον
  choice: un homme tout entier
  rationale: Conserve l’accent rhétorique sur l’homme dans son intégralité, en contraste implicite avec la circoncision d’une partie du corps.
- source_word: ὑγιῆ ἐποίησα
  choice: j’ai rendu la santé à
  rationale: Formulation française naturelle qui restitue la construction causative « rendre sain », plutôt que de la réduire au simple verbe « guérir ».
theological_decisions:
- issue: Sens de la comparaison entre la circoncision et la guérison le jour du sabbat
  choice: Jésus part de la circoncision admise le jour du sabbat et affirme, à plus forte raison, la légitimité de rendre la santé à un homme tout entier ce même jour.
  alternative: Jésus opposerait de manière générale la loi rituelle à l’action compatissante.
  rationale: La formulation préserve le raisonnement propre au verset et son contraste corporel, sans transformer celui-ci en polémique générale contre la loi de Moïse.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe interrogative reste directe, et les formulations proches du grec sont conservées lorsqu’elles demeurent naturelles en français.
