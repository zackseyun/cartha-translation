  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: fr
  text: Y a-t-il un seul des dirigeants ou des pharisiens qui ait cru en lui ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: En grec, la question introduite par μή appelle une réponse négative.
    reason: lexical_alternative
lexical_decisions:
- source_word: μή τις
  choice: Est-ce qu’un seul
  rationale: Dans cette question, μή indique que le locuteur attend une réponse négative. « Est-ce qu’un seul » conserve la forme interrogative et en fait sentir la portée rhétorique sans transformer la question en affirmation explicite.
- source_word: ἐκ τῶν ἀρχόντων
  choice: des chefs
  rationale: Ici, ἄρχοντες désigne les dirigeants reconnus du peuple juif. « Chefs » est naturel en français moderne et conserve le sens institutionnel dans le contexte.
- source_word: ἐπίστευσεν
  choice: a cru
  rationale: Le passé composé rend naturellement l’aoriste dans cette question et maintient le vocabulaire johannique courant de la foi.
- source_word: εἰς αὐτόν
  choice: en lui
  rationale: Avec πιστεύω, la construction εἰς αὐτόν se rend idiomatiquement en français par « croire en lui ».
- source_word: ἢ
  choice: ou
  rationale: La coordination simple suffit ; la force rhétorique provient de l’ensemble de la question.
- source_word: ἐκ τῶν Φαρισαίων
  choice: des pharisiens
  rationale: Cette formulation parallèle à « des chefs » exprime l’appartenance au groupe. « Pharisiens » est la désignation française habituelle.
theological_decisions:
- issue: Portée rhétorique de la question négative
  choice: Conserver une question qui appelle implicitement la réponse « non ».
  alternative: « Aucun des chefs ni des pharisiens n’a cru en lui. »
  rationale: Le grec μή τις signale l’attente d’une réponse négative, mais le texte reste interrogatif. Garder cette forme préserve le ton méprisant des locuteurs sans expliciter davantage que le grec.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « Est-ce qu’un seul » rend clairement la question rhétorique tout en évitant une formulation littéraire artificielle.
