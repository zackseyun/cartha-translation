source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: fr
  text: Il dit cela au sujet de l’Esprit[a], que ceux qui croyaient en lui allaient recevoir. En effet, l’Esprit n’était pas encore là[b], parce que Jésus n’avait pas encore été glorifié.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Il s’agit de l’Esprit divin ; le grec ne comporte pas ici le mot « Saint ».
    reason: clarification
  - marker: b
    text: 'Littéralement, le grec dit : « car l’Esprit n’était pas encore ». On peut comprendre plus explicitement : « car l’Esprit n’avait pas encore été donné ». Le grec relie cette situation au fait que Jésus n’avait pas encore été glorifié.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ πνεύματος / πνεῦμα
  choice: l’Esprit
  rationale: Le contexte désigne l’Esprit divin que les croyants doivent recevoir. « L’Esprit Saint » expliciterait justement le référent, mais ajouterait ἅγιον, absent du grec.
- source_word: οὗ
  choice: que
  rationale: Le pronom relatif reprend « l’Esprit ». En français, « que » est la forme naturelle pour le complément direct de « recevoir » et ne tranche pas inutilement une question de personnification grammaticale.
- source_word: ἔμελλον λαμβάνειν
  choice: devaient recevoir
  rationale: Cette tournure française exprime naturellement, depuis le point de vue narratif, une réception encore à venir, sans imposer l’idée plus forte de destinée.
- source_word: οἱ πιστεύσαντες εἰς αὐτόν
  choice: ceux qui croiraient en lui
  rationale: Le participe aoriste substantivé désigne les personnes caractérisées par la foi en Jésus. Dans cette remarque rétrospective portant sur une réception alors future, le conditionnel français rend clairement le groupe visé sans imposer une antériorité stricte par « avaient cru ».
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: En effet, l’Esprit n’était pas encore là
  rationale: Le grec dit littéralement que l’Esprit « n’était pas encore ». L’ajout idiomatique minimal « là » rend la phrase compréhensible en français tout en conservant sa tension; il évite d’insérer dans le texte principal « donné », qui n’est pas exprimé.
- source_word: οὐδέπω ἐδοξάσθη
  choice: n’avait pas encore été glorifié
  rationale: Le plus-que-parfait passif exprime naturellement l’antériorité attendue et conserve le vocabulaire johannique de la glorification.
theological_decisions:
- issue: Comment rendre οὔπω γὰρ ἦν πνεῦμα sans laisser entendre que l’Esprit n’existait pas avant la glorification de Jésus.
  choice: Conserver dans le texte la formulation tendue « l’Esprit n’était pas encore là », avec une note donnant le grec plus littéral et l’explicitation courante.
  alternative: « l’Esprit n’avait pas encore été donné » ou, littéralement, « il n’y avait pas encore d’Esprit »
  rationale: Le texte grec n’emploie aucun verbe signifiant « donner ». La traduction principale reste donc proche de sa formulation surprenante, tandis que la note permet au lecteur de voir à la fois la lettre du texte et son interprétation contextuelle habituelle.
translation_notes:
  register: Français international actuel, digne et accessible. « Il parlait ainsi » restitue naturellement τοῦτο δὲ εἶπεν sans ajouter de marqueur temporel. La ponctuation en deux phrases allège une longue période tout en conservant le lien explicatif de γάρ par « En effet ».
