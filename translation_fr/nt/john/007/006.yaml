id: JHN.7.6
reference: John 7:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: fr
  text: 'Jésus leur dit donc : « Mon temps n’est pas encore arrivé[a], mais le vôtre est toujours favorable. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Le moment qui m’est fixé n’est pas encore arrivé. » Le mot grec désigne souvent un moment approprié ou fixé, et non simplement le temps en général.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque le lien logique et narratif avec ce qui précède; « donc » est naturel et conserve cette articulation.
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: Jésus leur dit
  rationale: Le présent historique grec est rendu par le présent de narration, naturel en français dans ce contexte.
- source_word: αὐτοῖς
  choice: leur
  rationale: Rend directement le datif de destinataire sans explicitation contextuelle superflue.
- source_word: καιρός
  choice: temps / favorable
  rationale: καιρός désigne ici le moment approprié ou opportun. « Mon temps » préserve la sobriété et la portée théologique possible de la première occurrence; « le vôtre est toujours favorable » exprime idiomatiquement ἕτοιμος et évite le tour peu naturel « votre temps est toujours prêt ».
- source_word: οὔπω πάρεστιν
  choice: n’est pas encore arrivé
  rationale: Expression française idiomatique correspondant à l’idée qu’un moment n’est pas encore présent ou survenu.
- source_word: δὲ
  choice: mais
  rationale: Fait clairement ressortir le contraste entre le temps de Jésus et celui de ses interlocuteurs.
- source_word: πάντοτέ ἐστιν ἕτοιμος
  choice: est toujours favorable
  rationale: Rend naturellement l’idée d’un moment constamment disponible ou propice, sans transformer καιρός en simple durée chronologique.
theological_decisions:
- issue: Portée du « temps » de Jésus dans le contexte johannique
  choice: « Mon temps »
  alternative: « Le moment qui m’est fixé » ou « mon heure »
  rationale: Le grec emploie καιρός et non ὥρα. La formulation retenue laisse subsister la portée liée à la mission de Jésus sans importer le motif johannique de « l’heure » ni préciser explicitement qui aurait fixé ce moment.
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme est légèrement modulé dans la seconde proposition afin d’éviter l’expression non idiomatique « votre temps est toujours prêt », tout en conservant le contraste du grec.
