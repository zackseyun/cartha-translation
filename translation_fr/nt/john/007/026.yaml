id: JHN.7.26
reference: John 7:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: fr
  text: Et voilà qu’il parle ouvertement, et ils ne lui disent rien. Les chefs auraient-ils vraiment reconnu que c’est lui, le Messie ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἴδε
  choice: Et voilà que
  rationale: Cette tournure française actuelle restitue naturellement l’appel à l’attention de ἴδε dans le fil du récit, sans recourir à l’archaïque « voici » ni imposer un impératif explicite.
- source_word: παρρησίᾳ
  choice: ouvertement
  rationale: Le contexte met surtout en relief le caractère public et sans dissimulation de la parole de Jésus, plutôt que son courage subjectif.
- source_word: λαλεῖ
  choice: il parle
  rationale: Le présent français situe simplement l’action en cours et reste naturel dans cette observation directe.
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: ils ne lui disent rien
  rationale: Rendu au plus près de l’expression grecque et de son datif, sans ajouter l’idée interprétative de parler contre lui ou de l’arrêter.
- source_word: μήποτε ἀληθῶς ἔγνωσαν
  choice: auraient-ils vraiment reconnu
  rationale: Le conditionnel interrogatif exprime l’hypothèse étonnée et hésitante portée par μήποτε. « Reconnu » rend ici l’acquisition d’une connaissance concernant l’identité de Jésus, tout en évitant un lourd « sont-ils vraiment venus à savoir ».
- source_word: οἱ ἄρχοντες
  choice: les chefs
  rationale: Dans ce contexte, le terme désigne les dirigeants du peuple. « Les chefs » est clair et naturel, sans évoquer trop largement toutes les autorités.
- source_word: οὗτός ἐστιν ὁ χριστός
  choice: c’est lui, le Messie
  rationale: La construction disloquée met naturellement en français l’accent sur l’identification exprimée par οὗτός. « Messie » rend Χριστός comme titre dans ce contexte juif.
theological_decisions:
- issue: Traduction du titre ὁ χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Ici, la foule s’interroge explicitement sur l’identité messianique de Jésus. « Le Messie » fait entendre le titre attendu dans son cadre juif, tandis que « le Christ » risquerait davantage d’être compris comme un nom.
- issue: Portée de μήποτε dans la question
  choice: 'une hypothèse étonnée : « auraient-ils vraiment reconnu… ? »'
  alternative: 'une attente de réponse négative : « les chefs n’auraient tout de même pas reconnu… ? »'
  rationale: μήποτε peut introduire une question teintée d’incrédulité sans imposer ici une négation catégorique. Le conditionnel interrogatif français préserve cette tension.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition coordonnée du grec est conservée, tandis que « Et voilà que » restitue avec fluidité l’effet d’attention et de surprise.
