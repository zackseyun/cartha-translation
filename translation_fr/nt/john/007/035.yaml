source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: fr
  text: 'Les Juifs[a] se dirent donc entre eux : « Où donc cet homme va-t-il aller sans que nous le trouvions ? Il ne va pas aller dans la Dispersion parmi les Grecs[b] pour enseigner les Grecs, n’est-ce pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens ». Le terme grec peut désigner les Juifs en général ou, selon le contexte, les habitants de la Judée.
    reason: lexical_alternative
  - marker: b
    text: La « Dispersion parmi les Grecs » désigne les Juifs dispersés parmi des populations grecques ou de langue grecque, et non une dispersion composée de Grecs.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Équivalent lexical direct dans ce contexte collectif. « Les Judéens » reste possible et figure en note, tandis que « les chefs juifs » préciserait indûment un statut absent du grec.
- source_word: πρὸς ἑαυτούς
  choice: entre eux
  rationale: Exprime naturellement en français le sens réciproque de membres du groupe parlant les uns avec les autres.
- source_word: Ποῦ οὗτος μέλλει πορεύεσθαι
  choice: Où cet homme va-t-il aller
  rationale: « Cet homme » conserve la nuance distanciée de οὗτος; la tournure au futur rend ici naturellement la valeur prospective de μέλλει avec l’infinitif.
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: pour que nous ne le trouvions pas
  rationale: Dans cette interrogation, « pour que » relie idiomatiquement le lieu envisagé à la conséquence voulue ou supposée, sans ajouter explicitement une notion d’incapacité.
- source_word: μὴ ... μέλλει πορεύεσθαι
  choice: Va-t-il aller… ?
  rationale: Le grec introduit une question qui appelle normalement une réponse négative. Le français ne dispose pas toujours d’un marquage aussi léger; la question simple préserve la spéculation sans la surcharger d’un « quand même » ou « certainement pas ».
- source_word: τὴν διασπορὰν τῶν Ἑλλήνων
  choice: ceux qui sont dispersés parmi les Grecs
  rationale: Rend explicite le référent humain implicite de διασπορά et évite que « la dispersion des Grecs » soit comprise comme composée de Grecs. La note fournit le contexte culturel.
- source_word: καὶ διδάσκειν τοὺς Ἕλληνας
  choice: et enseigner les Grecs
  rationale: Traduction directe qui conserve la désignation grecque Ἕλληνας sans l’élargir à tous les non-Juifs.
theological_decisions:
- issue: Portée de Ἰουδαῖοι dans le récit johannique
  choice: les Juifs
  alternative: les Judéens
  rationale: Le verset ne commande pas une restriction régionale, ethnique ou institutionnelle plus précise. Le texte principal garde donc l’équivalent conventionnel, et la note signale l’ambiguïté lexicale afin d’éviter de la résoudre silencieusement.
- issue: Identité de la διασπορά parmi les Grecs
  choice: ceux qui sont dispersés parmi les Grecs
  alternative: la Dispersion parmi les Grecs
  rationale: Dans l’usage juif, il s’agit des Juifs vivant hors de leur terre au milieu de populations grecques ou hellénophones, et non d’une dispersion constituée de Grecs. La formulation choisie rend cette relation intelligible sans transformer Ἕλληνες en « païens ».
- issue: Attente négative marquée par μή
  choice: question française simple
  alternative: Il ne va tout de même pas aller… ?
  rationale: μή suggère que les locuteurs s’attendent à une réponse négative, mais une formulation renforcée ajouterait en français une coloration affective non explicitée. La tension interrogative est donc conservée sobrement.
translation_notes:
  register: Français international moderne, naturel et digne. « Ceux qui sont dispersés » est plus immédiatement compréhensible que le terme technique « Diaspora », tout en conservant la distinction entre les Juifs dispersés et les Grecs parmi lesquels ils vivent. Les deux marqueurs de note apparaissent dans le texte principal.
