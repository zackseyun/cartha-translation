  naturalness: Le français est globalement clair. « La Dispersion parmi les Grecs » est à la fois naturel dans un registre biblique moderne et plus précis que « ceux qui sont dispersés parmi les Grecs ». Une formulation négative avec « n’est-ce pas ? » restitue naturellement l’orientation rhétorique de la seconde question.
  terminology: « Les Juifs » convient, avec la note signalant « les Judéens » comme possibilité contextuelle. « Dispersion » doit être employé comme désignation du milieu juif dispersé; « Grecs » correspond à Ἕλληνες sans élargissement injustifié à « païens ».
