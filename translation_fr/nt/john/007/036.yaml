id: JHN.7.36
reference: John 7:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: fr
  text: '« Que signifie cette parole[a] qu’il a dite : “Vous me chercherez et vous ne me trouverez pas, et là où je suis[b], vous ne pouvez pas venir” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « cette déclaration » ou « ces mots ». Le grec λόγος peut désigner une parole, une déclaration, un message ou ce qui a été dit, selon le contexte.
    reason: lexical_alternative
  - marker: b
    text: Certaines traductions rendent cette expression par « là où je vais », mais le texte grec dit ici « là où je suis ».
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: parole
  rationale: Dans ce contexte, λόγος désigne ce que Jésus a dit. « Parole » garde l’étendue de sens du grec et convient au registre johannique, sans réduire le terme à un mot isolé.
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: Qu’est-ce que cette parole
  rationale: Cette formulation conserve la structure interrogative du grec et l’étonnement des interlocuteurs, plutôt que de paraphraser directement par « Que veut dire… ? ».
- source_word: Ζητήσετέ με
  choice: Vous me chercherez
  rationale: « Chercher » rend naturellement ζητέω en français et maintient la portée du verbe dans le vocabulaire johannique.
- source_word: οὐχ εὑρήσετε
  choice: vous ne me trouverez pas
  rationale: Le futur négatif est rendu directement; la reprise de « me » est naturelle et explicite en français.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: là où je suis
  rationale: Le présent εἰμί est conservé sans être transformé en « là où je vais », afin de respecter la formulation et la tension propres au texte.
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: vous ne pouvez pas venir
  rationale: Cette formulation idiomatique rend explicitement l’incapacité exprimée par δύνασθε.
- source_word: εἶπε
  choice: qu’il a dite
  rationale: Le verbe λέγω est rendu simplement par « dire »; l’accord au féminin reprend « parole ».
theological_decisions:
- issue: Le présent dans la parole de Jésus (« là où je suis »)
  choice: Conserver le présent « là où je suis ».
  alternative: « Là où je vais »
  rationale: Le grec emploie le présent εἰμί. Dans Jean, cette formulation peut évoquer plus qu’une destination future; la conserver évite de résoudre la tension théologique du texte.
translation_notes:
  register: Français international moderne, digne et accessible. « Parole » garde une tonalité johannique naturelle. La formulation légèrement marquée « Qu’est-ce que cette parole… ? » préserve la structure de la question grecque, tandis que « vous ne pouvez pas venir » reste idiomatique.
