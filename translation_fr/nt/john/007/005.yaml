  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: fr
  text: En effet, même ses frères ne croyaient pas en lui[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’avaient pas foi en lui ». Le verbe grec à l’imparfait présente leur absence de foi comme une situation passée en cours ou habituelle.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: même… ne… pas
  rationale: 'Dans cette proposition négative, οὐδὲ a une valeur intensive : « même ses frères ne… pas » exprime naturellement l’idée de « pas même » en français.'
- source_word: γὰρ
  choice: En effet
  rationale: γὰρ explique l’arrière-plan de ce qui précède. « En effet » maintient ce lien discursif avec plus de naturel que « car » dans une phrase autonome.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: ses frères
  rationale: Le masculin pluriel désigne ici les frères ou proches masculins de Jésus tels que le récit les présente; « ses frères » conserve cette précision sans élargissement inclusif.
- source_word: ἐπίστευον
  choice: ne croyaient pas
  rationale: L’imparfait français rend naturellement l’imparfait grec, en présentant leur absence de foi comme une situation en cours dans le passé.
- source_word: εἰς αὐτόν
  choice: en lui
  rationale: Avec πιστεύω, εἰς exprime ici une foi ou une confiance dirigée vers Jésus; « croire en lui » est la formulation française idiomatique.
theological_decisions:
- issue: Sens de πιστεύω εἰς αὐτόν dans l’usage johannique
  choice: croire en lui
  alternative: lui faire confiance
  rationale: La formule johannique désigne une foi ou confiance personnelle dirigée vers Jésus. « Croire en lui » préserve cette portée sans préciser davantage les motifs ni les implications doctrinales de leur incrédulité.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre « même ses frères ne croyaient pas » restitue l’emphase grecque, tandis que l’imparfait français conserve l’aspect duratif ou circonstanciel sans lourdeur.
