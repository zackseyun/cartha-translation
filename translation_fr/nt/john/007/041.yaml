id: JHN.7.41
reference: John 7:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: fr
  text: 'D’autres disaient : « C’est le Messie[a]. » Mais d’autres disaient : « Le Messie ne vient tout de même pas de Galilée, n’est-ce pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι
  choice: D’autres
  rationale: L’adjectif substantivé désigne un autre groupe au sein de la foule et prépare naturellement le contraste.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec évoque des propos en cours ou répétés; l’imparfait français le rend directement.
- source_word: Οὗτός ἐστιν
  choice: C’est
  rationale: Formulation française naturelle pour cette identification démonstrative, sans lourdeur inutile.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme le titre de la figure attendue; « le Messie » en conserve clairement la portée juive et messianique.
- source_word: οἱ δὲ
  choice: Mais d’autres
  rationale: L’article substantivé avec δέ introduit un groupe opposé; cette formulation conserve explicitement le contraste.
- source_word: Μὴ γὰρ
  choice: ne… tout de même pas…, n’est-ce pas ?
  rationale: La question introduite par μή attend une réponse négative; « tout de même » rend naturellement la nuance incrédule ou argumentative de γάρ, tandis que la question finale maintient sa force rhétorique.
- source_word: ἐκ τῆς Γαλιλαίας
  choice: de Galilée
  rationale: ἐκ indique ici l’origine; « venir de Galilée » est l’expression idiomatique française.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent exprime ici une attente générale concernant l’origine du Messie; le présent français convient directement.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans le débat de la foule, Χριστός est un titre messianique plutôt qu’un nom propre. « Messie » rend cette fonction sans imposer une interprétation confessionnelle; « Christ » reste une traduction traditionnelle valable.
translation_notes:
  register: Français international moderne, courant et digne. La répétition de « d’autres » est conservée pour refléter la structure contrastive du grec. La question finale reste rhétorique et attend une réponse négative.
