id: JHN.7.12
reference: John 7:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: fr
  text: 'Et, dans les foules, on parlait beaucoup de lui à voix basse[a]. Les uns disaient : « Il est bon. » D’autres disaient : « Non, au contraire, il égare la foule[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il y avait beaucoup de murmures à son sujet » ; le terme peut aussi évoquer des récriminations murmurées.
    reason: lexical_alternative
  - marker: b
    text: Ou « il trompe la foule » ou « il entraîne la foule dans l’erreur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: on parlait … à voix basse
  rationale: Le nom désigne des propos tenus à mi-voix, pouvant aller du murmure à la récrimination. Cette formulation naturelle conserve le caractère discret et officieux des échanges sans imposer l’idée de plainte.
- source_word: περὶ αὐτοῦ
  choice: de lui
  rationale: Rend directement et naturellement le sujet des propos.
- source_word: πολύς
  choice: beaucoup
  rationale: Exprime l’ampleur des propos qui circulaient au sujet de Jésus.
- source_word: ἐν τοῖς ὄχλοις
  choice: dans les foules
  rationale: Conserve le pluriel grec et situe ces propos au sein des groupes rassemblés.
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: Les uns … D’autres …
  rationale: Marque clairement et idiomatiquement l’opposition entre deux groupes.
- source_word: Ἀγαθός ἐστιν
  choice: Il est bon
  rationale: Suit de près l’adjectif prédicatif grec sans ajouter « homme » et laisse au contexte la portée exacte de ce jugement favorable.
- source_word: Οὔ, ἀλλὰ
  choice: Non, au contraire
  rationale: Reproduit la négation directe suivie d’une correction fortement contrastée.
- source_word: πλανᾷ
  choice: il égare
  rationale: Conserve la possibilité d’une conduite dans l’erreur sans préciser si l’accent porte sur une tromperie intentionnelle ou sur son résultat.
- source_word: τὸν ὄχλον
  choice: la foule
  rationale: Respecte le singulier collectif grec et maintient le lien lexical avec les foules mentionnées auparavant.
theological_decisions:
- issue: Caractérisation de Jésus par la foule
  choice: 'Rapporter sans atténuation les deux jugements opposés : « Il est bon » et « il égare la foule ».'
  alternative: Expliciter le premier par « C’est un homme de bien » ou renforcer le second par « il trompe la foule ».
  rationale: Le verset présente des opinions humaines contradictoires sans signaler ici que le narrateur adopte l’une d’elles. La traduction préserve cette tension et n’ajoute aucune appréciation doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. « On parlait beaucoup de lui à voix basse » évite le tour peu idiomatique « il y avait beaucoup de murmures » dans le corps du texte, tout en conservant cette possibilité en note. La ponctuation française et les espaces avant les deux-points sont respectées.
