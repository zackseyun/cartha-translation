id: JHN.7.24
reference: John 7:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: fr
  text: Ne jugez pas d’après les apparences, mais jugez avec justice.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: Ne jugez pas
  rationale: L’impératif présent avec μή exprime naturellement ici une interdiction. Cette formulation conserve la force impérative sans imposer la nuance aspectuelle « cessez de juger ».
- source_word: κατ’ ὄψιν
  choice: d’après les apparences
  rationale: L’expression désigne un jugement fondé sur ce qui se voit ou sur l’impression extérieure. « D’après les apparences » est idiomatique en français et rend bien cette idée.
- source_word: ἀλλὰ
  choice: mais
  rationale: La conjonction marque l’opposition directe entre la manière de juger interdite et celle qui est commandée.
- source_word: τὴν δικαίαν κρίσιν
  choice: avec justice
  rationale: Le grec emploie littéralement l’objet « le jugement juste », tournure peu naturelle en français après « juger ». « Jugez avec justice » conserve la portée éthique et judiciaire de δικαίαν tout en restant fluide.
- source_word: κρίνετε
  choice: jugez
  rationale: La répétition du même verbe dans les deux propositions préserve le parallélisme rhétorique du grec.
theological_decisions:
- issue: Rendu de δικαίαν dans un contexte éthique et judiciaire
  choice: avec justice
  alternative: portez un jugement juste
  rationale: « Avec justice » exprime la rectitude morale aussi bien que l’équité du jugement, sans limiter le sens à une simple procédure judiciaire ni introduire une catégorie doctrinale étrangère au contexte.
translation_notes:
  register: Français moderne, international et digne. La formulation est concise, naturelle à l’oral comme à l’écrit, et conserve l’opposition ainsi que la répétition de « juger » présentes dans le grec.
