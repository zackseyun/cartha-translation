lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Verbe narratif courant introduisant une réplique dans un dialogue ; le passé simple convient au registre narratif français.
- source_word: ὁ ὄχλος
  choice: la foule
  rationale: Désigne ici le groupe de personnes présent ; « la foule » est précis, naturel et actuel.
- source_word: Δαιμόνιον ἔχεις
  choice: Tu as un démon
  rationale: Reproduit directement l’expression grecque et conserve la forme de l’accusation sans la développer par une interprétation.
- source_word: τίς
  choice: Qui
  rationale: Maintient le pronom interrogatif explicite et la forme rhétorique de la réponse.
- source_word: ζητεῖ
  choice: cherche
  rationale: Le présent français exprime naturellement l’action en cours ; « cherche à » s’emploie idiomatiquement avec l’infinitif.
- source_word: ἀποκτεῖναι
  choice: te tuer
  rationale: Rend directement l’idée de donner la mort, sans ajouter la qualification juridique ou morale qu’impliquerait « assassiner ».
theological_decisions:
- issue: Rendu de δαιμόνιον dans l’accusation portée contre Jésus
  choice: « Tu as un démon »
  alternative: « Tu es possédé par un démon »
  rationale: Le texte rapporte une accusation hostile sans l’approuver. Le rendu littéral préserve l’expression grecque et sa tension, tandis que « possédé » expliciterait davantage la nature supposée de l’emprise.
translation_notes:
  register: Français international moderne, naturel et digne. La ponctuation exclamative fait entendre la vigueur de l’accusation, tandis que la question conserve sa forme rhétorique.
