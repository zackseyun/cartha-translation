  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: fr
  text: 'La foule répondit : « Tu as un démon[a]. Qui cherche à te tuer ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Tu es possédé par un démon. » Littéralement : « Tu as un démon. »'
