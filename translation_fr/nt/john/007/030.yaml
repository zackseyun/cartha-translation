id: JHN.7.30
reference: John 7:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: fr
  text: Ils cherchaient donc à le saisir[a], mais personne ne mit la main sur lui, parce que son heure n’était pas encore venue[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à l’arrêter ». Le verbe grec signifie « saisir » ou « s’emparer de » ; dans ce contexte, il s’agit vraisemblablement de procéder à son arrestation.'
    reason: lexical_alternative
  - marker: b
    text: Dans l’Évangile selon Jean, « son heure » désigne le moment déterminant fixé pour la mission de Jésus, particulièrement sa souffrance, sa mort, sa résurrection et sa glorification.
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: ils cherchaient
  rationale: L’imparfait exprime une démarche en cours ou répétée. « Ils cherchaient » reste proche de la forme grecque, tandis que l’infinitif qui suit fait clairement comprendre l’intention.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence narrative et logique de ce qui précède; « donc » est naturel et précis en français contemporain.
- source_word: πιάσαι
  choice: à se saisir de lui
  rationale: Le verbe signifie prendre ou saisir. Cette formulation conserve le sens lexical sans préciser dans le texte principal qu’il s’agit d’une arrestation officielle, bien que le contexte la suggère.
- source_word: οὐδεὶς
  choice: personne ne
  rationale: Équivalent français direct et idiomatique du pronom négatif grec.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: ne mit la main sur lui
  rationale: Cette tournure française naturelle conserve l’image de la main au singulier et exprime le fait de s’emparer physiquement de quelqu’un.
- source_word: ὅτι
  choice: parce que
  rationale: Introduit explicitement la raison pour laquelle personne n’agit.
- source_word: οὔπω
  choice: pas encore
  rationale: Rend directement la négation temporelle grecque.
- source_word: ἐληλύθει
  choice: était venue
  rationale: Le plus-que-parfait grec situe la non-venue de l’heure avant le moment raconté; le plus-que-parfait français en rend naturellement la valeur.
- source_word: ἡ ὥρα αὐτοῦ
  choice: son heure
  rationale: La traduction littérale préserve le motif johannique chargé de sens et évite de le réduire à un simple moment chronologique.
theological_decisions:
- issue: Sens de « son heure » dans l’Évangile selon Jean
  choice: Conserver « son heure » dans le texte principal sans l’expliciter.
  alternative: « le moment fixé pour lui » ou « le moment de sa mort »
  rationale: Dans Jean, l’expression renvoie au temps déterminant de la mission de Jésus, notamment sa souffrance, sa mort et sa glorification, mais le verset ne la limite pas explicitement à un seul événement. La formulation maintient donc l’ampleur et la tension théologiques du motif.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe suit de près la progression grecque tout en restant naturelle. « Se saisir de lui » et « mettre la main sur lui » conservent les deux formulations distinctes du texte source; les notes éclairent l’implication d’arrestation et le motif johannique de l’heure.
