  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: fr
  text: Car personne ne fait rien en secret tout en cherchant à être en vue de tous.[a] Si tu fais ces choses, manifeste-toi au monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à être connu publiquement ». L’expression grecque souligne le caractère ouvert et public.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: En effet, personne
  rationale: « En effet » exprime naturellement la valeur explicative de γάρ, tandis que « personne » rend clairement οὐδεὶς.
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: n’agit en secret
  rationale: Cette formulation française idiomatique conserve l’idée d’une action accomplie dans le secret, sans alourdir la phrase par un objet indéfini peu naturel.
- source_word: καὶ ζητεῖ αὐτὸς
  choice: tout en cherchant
  rationale: La tournure marque la simultanéité et le contraste entre agir secrètement et rechercher la publicité. L’emphase de αὐτός reste implicite, comme il est naturel en français.
- source_word: ἐν παρρησίᾳ εἶναι
  choice: être connu publiquement
  rationale: Dans ce contexte, παρρησία renvoie à l’ouverture et à la visibilité publiques plutôt qu’à la franchise de parole. « Être connu publiquement » rend cette visée avec naturel.
- source_word: εἰ ταῦτα ποιεῖς
  choice: Si tu fais ces choses
  rationale: Le présent conditionnel grec est conservé simplement, ainsi que le démonstratif pluriel qui renvoie aux œuvres mentionnées dans le contexte.
- source_word: φανέρωσον σεαυτὸν
  choice: manifeste-toi
  rationale: L’impératif aoriste appelle une manifestation publique décisive. « Manifeste-toi » conserve le caractère direct et le vocabulaire de révélation sans préciser abusivement sa nature.
- source_word: τῷ κόσμῳ
  choice: au monde
  rationale: « Monde » préserve le terme johannique κόσμος et sa résonance littéraire, tout en restant compréhensible ici au sens du vaste public.
theological_decisions:
- issue: Portée de κόσμος dans le contexte johannique
  choice: au monde
  alternative: au public
  rationale: Le contexte immédiat concerne la visibilité publique, mais traduire κόσμος par « monde » préserve la diction et la possible résonance thématique propres à Jean sans imposer une interprétation supplémentaire.
- issue: Sens de ἐν παρρησίᾳ εἶναι
  choice: être connu publiquement
  alternative: être en vue de tous
  rationale: Le contexte favorise la notoriété ou la visibilité publique. La traduction choisie garde cette nuance sans faire de παρρησία une référence à la hardiesse dans la parole.
translation_notes:
  register: Français international moderne, naturel et digne. Le contraste entre le secret et la visibilité publique est maintenu, ainsi que le tutoiement exigé par les formes grecques au singulier.
