source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: fr
  text: « Notre loi juge-t-elle un homme[b] sans l’avoir d’abord entendu lui-même[a] et sans savoir ce qu’il fait ? »
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sans avoir d’abord entendu ce qu’il a à dire ». Le grec dit plus littéralement « sans avoir d’abord entendu de sa part ».
    reason: lexical_alternative
  - marker: b
    text: Ou « quelqu’un… ce que cette personne fait ». Le grec emploie « un homme » au singulier dans un sens représentatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: juge-t-elle… sans… ?
  rationale: 'La question introduite par μή attend une réponse négative. En français, la tournure interrogative avec « sans » rend naturellement cette attente : non, la loi ne le fait pas.'
- source_word: ὁ νόμος ἡμῶν
  choice: notre loi
  rationale: Cette expression désigne la norme juridique revendiquée par les interlocuteurs. La minuscule évite de restreindre sans nécessité le référent au seul Pentateuque.
- source_word: κρίνει
  choice: juge
  rationale: Le verbe conserve le cadre juridique sans lui donner d’office le sens plus fort de « condamner ».
- source_word: τὸν ἄνθρωπον
  choice: un homme
  rationale: Le grec emploie ἄνθρωπος au singulier dans un sens représentatif et générique. « Un homme » en garde la forme, tandis que « quelqu’un » constitue une possibilité française plus inclusive.
- source_word: ἐὰν μὴ
  choice: sans
  rationale: Dans cette question, « sans » exprime avec naturel la condition négative nécessaire portée par ἐὰν μή.
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: sans l’avoir d’abord entendu
  rationale: La formulation indique que la loi doit d’abord entendre l’intéressé, c’est-à-dire recevoir sa propre déposition. Cette traduction est idiomatique tout en gardant l’ordre procédural marqué par πρῶτον.
- source_word: γνῷ
  choice: savoir
  rationale: Le verbe désigne ici l’acquisition d’une connaissance des faits. « Savoir » reste concis et convient au contexte judiciaire.
- source_word: τί ποιεῖ
  choice: ce qu’il fait
  rationale: Le présent français préserve le présent grec et n’introduit pas l’antériorité qu’impliquerait « ce qu’il a fait ».
