id: JHN.7.14
reference: John 7:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: fr
  text: Alors que la fête était déjà à mi-parcours[a], Jésus monta dans l’enceinte du Temple[b] et enseignait[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vers le milieu de la fête ».
    reason: lexical_alternative
  - marker: b
    text: Le mot grec désigne ici l’ensemble du Temple, notamment ses cours, et non le sanctuaire intérieur proprement dit.
    reason: cultural_note
  - marker: c
    text: Ou « se mit à enseigner ». L’imparfait grec peut mettre l’accent sur l’action en cours.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη δὲ τῆς ἑορτῆς μεσούσης
  choice: Alors que la fête était déjà à mi-parcours
  rationale: Le génitif absolu exprime la circonstance temporelle; «déjà» rend ἤδη, tandis que «à mi-parcours» communique naturellement que la fête avait atteint son milieu. δέ marque ici une transition narrative légère, sans exiger un «mais» explicite.
- source_word: ἀνέβη
  choice: monta
  rationale: Conserve le mouvement ascendant exprimé par ἀναβαίνω, approprié pour la montée vers Jérusalem et le Temple.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française usuelle du nom propre grec Ἰησοῦς.
- source_word: εἰς τὸ ἱερὸν
  choice: dans l’enceinte du Temple
  rationale: ἱερόν désigne l’ensemble du complexe ou des cours du Temple, et non spécifiquement le sanctuaire intérieur; «enceinte» rend cette portée sans suggérer que Jésus entra dans le sanctuaire réservé.
- source_word: ἐδίδασκεν
  choice: enseignait
  rationale: L’imparfait grec présente l’enseignement comme une action en cours, sans ajouter explicitement l’idée qu’il commença à enseigner.
theological_decisions:
- issue: Portée de ἱερόν
  choice: l’enceinte du Temple
  alternative: le Temple
  rationale: La précision distingue le complexe et ses cours du sanctuaire intérieur (ναός), tout en restant naturelle en français.
- issue: Valeur aspectuelle de ἐδίδασκεν
  choice: enseignait
  alternative: se mit à enseigner
  rationale: L’imparfait indique clairement une action en cours; une lecture ingressive est possible en contexte, mais elle n’est pas explicitement imposée par la forme grecque.
translation_notes:
  register: Français international moderne, clair et digne. «Fête» reste générique comme dans le verset, le contexte identifiant la fête. La majuscule à «Temple» signale l’édifice de Jérusalem.
