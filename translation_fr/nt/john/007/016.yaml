  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: fr
  text: 'Jésus leur répondit donc : « Mon enseignement ne m’appartient pas, mais appartient à celui qui m’a envoyé.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Mon enseignement ne vient pas de moi, mais de celui qui m’a envoyé. » Le génitif grec oppose d’abord l’appartenance (« le mien » / « celui de celui qui m’a envoyé »), tout en pouvant aussi souligner l’origine de cet enseignement.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: Jésus leur répondit donc
  rationale: « Répondit » rend naturellement ἀπεκρίθη dans ce contexte. « Donc » conserve la continuité marquée par οὖν. La formule française omet le redondant « et dit » sans perdre la fonction d’introduction du discours.
- source_word: Ἡ ἐμὴ διδαχή
  choice: Mon enseignement
  rationale: « Enseignement » est courant, clair et moins technique ou confessionnel que « doctrine » ; le possessif conserve l’accent de ἐμὴ.
- source_word: οὐκ ἔστιν ἐμὴ
  choice: ne vient pas de moi
  rationale: Dans le contraste avec le génitif τοῦ πέμψαντός με, cette formulation française exprime naturellement l’origine de l’enseignement. Une note conserve l’autre nuance possible, celle de l’appartenance.
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: mais de celui qui m’a envoyé
  rationale: Le génitif peut signaler l’origine ou l’appartenance. « De celui qui m’a envoyé » préserve la concision et rend l’origine sans préciser l’identité du sujet au-delà du texte.
theological_decisions:
- issue: Rapport entre l’enseignement de Jésus et celui qui l’a envoyé
  choice: Exprimer que l’enseignement de Jésus tire son origine de celui qui l’a envoyé
  alternative: « n’est pas à moi, mais appartient à celui qui m’a envoyé »
  rationale: Le grec nie une origine ou une possession indépendante et maintient la distinction entre Jésus et celui qui l’envoie. La traduction n’ajoute aucune conclusion métaphysique et la note préserve l’ambiguïté du génitif.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation est accessible à la lecture publique. Le marqueur [a] est placé après la proposition qu’il précise.
