  text: ἦν δὲ ἐγγὺς ἡ ἑορτὴ τῶν Ἰουδαίων ἡ σκηνοπηγία.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: fr
  text: Or, la fête juive des Tentes[a] était proche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nom traditionnel : « fête des Tabernacles »; on dit aussi « fête des Cabanes ».'
    reason: Signaler les autres appellations françaises courantes de cette fête.
lexical_decisions:
- source_word: δὲ
  choice: Or
  rationale: Marque avec naturel une transition narrative légère, sans lui donner une valeur temporelle ni une opposition forte.
- source_word: ἐγγὺς
  choice: était proche
  rationale: Exprime ici la proximité temporelle de manière claire et actuelle.
- source_word: ἑορτὴ τῶν Ἰουδαίων
  choice: la fête juive
  rationale: Le génitif identifie la fête comme appartenant au calendrier religieux juif; la tournure adjectivale est naturelle en français et n’introduit aucune nuance polémique.
- source_word: ἡ σκηνοπηγία
  choice: des Tentes
  rationale: Désigne la fête d’automne liée au séjour dans des abris temporaires. « Fête des Tentes » est intelligible et proche du sens du terme grec; l’apposition grecque est intégrée naturellement au nom de la fête.
theological_decisions:
- issue: Sens de τῶν Ἰουδαίων dans la désignation de la fête
  choice: juive
  alternative: des Juifs
  rationale: Dans ce contexte, l’expression classe la fête dans le calendrier juif et ne constitue pas une affirmation polémique au sujet des Juifs.
- issue: Nom français de σκηνοπηγία
  choice: fête des Tentes
  alternative: fête des Tabernacles
  rationale: Le texte principal privilégie une désignation moderne et transparente, tandis que la note conserve l’appellation française traditionnelle.
translation_notes:
  register: Français international moderne, sobre et digne. « Or » conserve la légère articulation narrative de δὲ. La formulation évite la répétition peu naturelle « la fête juive, la fête des Tentes » tout en préservant l’identification donnée par l’apposition grecque.
