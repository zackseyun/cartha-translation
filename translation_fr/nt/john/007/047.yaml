  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: fr
  text: 'Les Pharisiens leur répondirent donc : « Vous ne vous êtes tout de même pas laissé égarer, vous aussi[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous avez été trompés ». Le verbe grec peut désigner le fait d’être égaré ou trompé.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: répondirent
  rationale: Verbe narratif courant introduisant la réaction des pharisiens dans le dialogue.
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence dans l’échange tout en restant naturel dans un récit en français moderne.
- source_word: αὐτοῖς
  choice: leur
  rationale: Le pronom datif désignant les gardes est naturellement rendu par le pronom complément indirect « leur ».
- source_word: οἱ Φαρισαῖοι
  choice: Les pharisiens
  rationale: Désignation française habituelle du groupe, avec l’article défini conservé.
- source_word: Μὴ καὶ ὑμεῖς
  choice: Vous aussi, vous… ?
  rationale: La reprise du pronom met naturellement en relief « vous aussi »; la forme interrogative et le contexte portent l’attente d’une réponse négative sans ajouter « quand même » ou « sûrement ».
- source_word: πεπλάνησθε
  choice: vous vous êtes laissé égarer
  rationale: Cette tournure rend la valeur résultative du parfait et la notion d’avoir été amené dans l’erreur, tout en restant idiomatique en français.
theological_decisions:
- issue: Force rhétorique de la question introduite par μή
  choice: Conserver une question qui laisse entendre une réponse négative, sans expliciter cette attente.
  alternative: « Vous ne vous êtes tout de même pas laissé égarer, vous aussi ? »
  rationale: μή indique que les pharisiens s’attendent à une réponse négative. Le contexte et la formulation interrogative française permettent de préserver leur ton incrédule ou méprisant sans surtraduction.
- issue: Voix et nuance de πεπλάνησθε
  choice: « vous vous êtes laissé égarer »
  alternative: « vous avez été trompés »
  rationale: Le grec peut exprimer le fait d’être égaré ou trompé. La formulation retenue préserve la tension entre influence extérieure et implication des personnes visées, sans imposer une lecture doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La dislocation « Vous aussi, vous… » restitue l’accent porté par καὶ ὑμεῖς et convient à une réplique directe. Le point d’interrogation est placé à l’intérieur des guillemets français puisqu’il appartient à la citation.
