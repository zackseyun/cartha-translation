  terminology: « Pharisiens » avec majuscule est retenu pour la désignation historique et religieuse du groupe dans un texte biblique. « Égarer » conserve la portée de πλανάω sans imposer le sens plus étroit de tromperie frauduleuse; l’alternative est maintenue en note.
