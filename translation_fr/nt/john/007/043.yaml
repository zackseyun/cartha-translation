  text: σχίσμα οὖν ⸂ἐγένετο ἐν τῷ ὄχλῳ⸃ δι’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: fr
  text: Il y eut donc une division dans la foule à cause de lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: division
  rationale: Le nom désigne ici une fracture ou un désaccord qui divise un groupe. « Division » est naturel en français moderne et convient au contexte sans introduire la connotation ecclésiastique plus marquée de « schisme ».
- source_word: οὖν
  choice: donc
  rationale: Le connecteur présente la division comme le résultat des avis opposés exprimés auparavant. « Donc » conserve clairement ce lien conséquentiel.
- source_word: ἐγένετο
  choice: il y eut
  rationale: Avec σχίσμα pour sujet, γίνομαι indique qu'une division se produisit ou apparut. « Il y eut » rend cette tournure de manière concise, naturelle et digne.
- source_word: ἐν τῷ ὄχλῳ
  choice: dans la foule
  rationale: ὄχλος désigne la foule rassemblée. « Dans la foule » est idiomatique en français et conserve l'image du groupe au sein duquel la division apparaît.
- source_word: δι’ αὐτόν
  choice: à cause de lui
  rationale: διά avec l'accusatif exprime ici la cause. « À cause de lui » est direct et préserve le pronom du texte grec sans explicitation superflue.
theological_decisions:
- issue: Référent de αὐτόν
  choice: Conserver « lui », dont le référent contextuel est Jésus
  alternative: Expliciter « à cause de Jésus »
  rationale: Le contexte identifie clairement Jésus, mais le grec emploie un pronom. Le conserver respecte la forme du texte et n'impose aucune explicitation interprétative inutile.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase garde l'ordre logique du grec tout en restant naturelle; aucune note n'est nécessaire.
