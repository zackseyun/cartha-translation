  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: fr
  text: 'Ses frères lui dirent donc : « Pars d’ici et va en Judée, afin que tes disciples, eux aussi, voient[a] les œuvres que tu accomplis. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « observent ». Le grec porte formellement « verront »; dans cette proposition exprimant le but, le français emploie naturellement le subjonctif « voient ». Le verbe peut aussi évoquer le fait de regarder attentivement.
    reason: Alternative lexicale et particularité grammaticale du texte grec.
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement le lien logique et narratif avec ce qui précède.
- source_word: ἀδελφοὶ αὐτοῦ
  choice: ses frères
  rationale: Le masculin pluriel désigne ici les membres masculins de la famille de Jésus; la formulation reste directe sans préciser davantage la nature exacte de la parenté.
- source_word: Μετάβηθι ἐντεῦθεν
  choice: Pars d’ici
  rationale: Rend avec naturel et netteté l’impératif demandant de quitter le lieu présent.
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: va en Judée
  rationale: Traduction française courante du déplacement commandé vers la région de Judée.
- source_word: ἵνα καὶ οἱ μαθηταί σου
  choice: afin que tes disciples, eux aussi
  rationale: « Afin que » exprime le but, tandis que « eux aussi » fait clairement porter καί sur les disciples.
- source_word: θεωρήσουσιν
  choice: voient
  rationale: Dans la proposition de but introduite par ἵνα, le français appelle naturellement le subjonctif. « Voir » rend le sens perceptif du verbe sans surtraduire, tandis que la note signale la forme future grecque et la nuance possible d’observation attentive.
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: les œuvres que tu accomplis
  rationale: « Œuvres » conserve le vocabulaire thématique johannique; « accomplis » est une tournure française naturelle qui exprime les actions réalisées par Jésus.
theological_decisions:
- issue: Référence de « ses frères »
  choice: Les frères de Jésus sont les membres masculins de sa famille qui prennent la parole dans le récit.
  alternative: Des parents ou membres de la parenté au sens plus large.
  rationale: Le texte emploie le terme familial masculin sans définir plus précisément la parenté. La traduction conserve cette désignation sans trancher des débats doctrinaux extérieurs au verset.
- issue: Valeur de θεωρήσουσιν après ἵνα
  choice: 'Une proposition de but rendue au subjonctif français : « afin que… voient ».'
  alternative: 'Une formulation au futur : « ainsi… verront »; ou une nuance plus appuyée : « observent » / « contemplent ».'
  rationale: Le grec présente formellement un futur de l’indicatif dans une proposition introduite par ἵνα. Le corps du texte privilégie un français idiomatique, et la note préserve la tension grammaticale ainsi que la nuance lexicale.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue garde la force directe des deux impératifs. « Œuvres » maintient l’écho du vocabulaire johannique sans devenir archaïque.
