source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: fr
  text: 'Jésus dit donc : « Je suis encore avec vous pour peu de temps, et je vais vers celui qui m’a envoyé[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans le contexte de l’Évangile selon Jean, « celui qui m’a envoyé » désigne le Père.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la suite logique et narrative de l’échange précédent, dans un français naturel.
- source_word: Ἔτι χρόνον μικρόν
  choice: encore avec vous pour peu de temps
  rationale: Rend à la fois ἔτι (« encore ») et χρόνον μικρόν (« peu de temps »), sans alourdir la phrase.
- source_word: μεθ’ ὑμῶν εἰμι
  choice: je suis encore avec vous
  rationale: Conserve la formulation directe au présent et l’idée de présence auprès des interlocuteurs.
- source_word: καὶ ὑπάγω
  choice: puis je vais
  rationale: Dans ce contexte, καί relie une étape ultérieure à la brève présence restante; « puis » exprime naturellement cette succession, tandis que « je vais » garde la simplicité de ὑπάγω.
- source_word: πρὸς τὸν πέμψαντά με
  choice: vers celui qui m’a envoyé
  rationale: « Vers » respecte la valeur directionnelle de πρός; le participe substantivé reste indirectement formulé, comme dans le grec.
theological_decisions:
- issue: Identification de « celui qui m’a envoyé »
  choice: Conserver l’expression relationnelle sans nommer explicitement le Père dans le texte principal.
  alternative: vers le Père qui m’a envoyé
  rationale: Dans le contexte johannique, il s’agit du Père, mais le verset ne le nomme pas directement. La formulation grecque préserve cette référence implicite.
translation_notes:
  register: Français moderne, international et digne. La phrase demeure simple et orale, tout en conservant la direction exprimée par πρός et la désignation indirecte du Père.
