id: JHN.7.42
reference: John 7:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: fr
  text: L’Écriture ne dit-elle pas que le Messie[a] vient de la descendance de David et de Bethléem, le village où était David ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ». Le titre grec est ὁ χριστός.'
    reason: Signaler la traduction traditionnelle possible du titre grec sans effacer sa valeur messianique dans le texte principal.
lexical_decisions:
- source_word: ἡ γραφή
  choice: l’Écriture
  rationale: Dans Jean, le singulier désigne ici l’Écriture sainte faisant autorité; « l’Écriture » est la formulation française consacrée et naturelle.
- source_word: εἶπεν
  choice: ne dit-elle pas
  rationale: Dans cette question rhétorique, le présent français exprime naturellement la validité permanente de ce que déclare l’Écriture, sans alourdir la phrase par « n’a-t-elle pas dit ».
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: de la descendance de David
  rationale: σπέρμα désigne ici la lignée généalogique. « Descendance » transmet clairement ce sens sans conserver l’image peu naturelle de la semence.
- source_word: ἀπὸ Βηθλέεμ
  choice: de Bethléem
  rationale: ἀπό indique l’origine; « venir de Bethléem » est l’expression française naturelle.
- source_word: τῆς κώμης
  choice: le village
  rationale: κώμη désigne une petite localité; « village » respecte plus précisément le terme grec que « ville ».
- source_word: ὅπου ἦν Δαυίδ
  choice: où était David
  rationale: Cette formulation conserve la simplicité et l’indétermination du grec, qui ne précise ni que David y habitait ni qu’il en était originaire.
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent exprime ici l’origine attendue du Messie selon l’Écriture; le présent français convient directement.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Dans ce débat juif sur l’attente royale, Χριστός fonctionne comme un titre. « Messie » en rend le sens plutôt que de le translittérer.
theological_decisions:
- issue: Traduction de Χριστός employé comme titre
  choice: le Messie
  alternative: le Christ
  rationale: Le contexte porte sur l’identité et l’origine du roi attendu par Israël. « Messie » rend la valeur titulaire de ὁ χριστός, tandis que « Christ » peut être compris en français comme un nom propre.
translation_notes:
  register: Français international moderne, digne et accessible. La question rhétorique est conservée. La tournure légèrement inhabituelle « où était David » préserve volontairement l’indétermination de l’original au lieu de préciser « où il vivait » ou « dont il était originaire ».
