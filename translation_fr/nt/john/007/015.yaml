  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: fr
  text: 'Les Juifs[b] s’étonnaient donc et disaient : « Comment cet homme est-il instruit[a] sans avoir étudié ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « cet homme connaît les lettres ». L’expression peut signifier : « Comment cet homme a-t-il un tel savoir ? »'
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte de l’Évangile selon Jean, « les Juifs » désigne les interlocuteurs juifs de Jésus à Jérusalem, probablement des membres des autorités judéennes, et non le peuple juif dans son ensemble.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: s’étonnaient
  rationale: L’imparfait grec décrit une réaction en cours. « S’étonnaient » est naturel en français et exprime la surprise suscitée par l’enseignement de Jésus.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la suite narrative et logique du contexte précédent ; « donc » en conserve clairement la valeur.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Cette traduction directe conserve la formulation caractéristique de Jean sans réduire d’emblée le référent aux seuls chefs. Une note précise sa portée contextuelle afin d’éviter une généralisation ethnique.
- source_word: λέγοντες
  choice: et disaient
  rationale: Le participe introduit leurs paroles. La coordination avec « et » donne une phrase française fluide tout en maintenant l’action concomitante.
- source_word: Πῶς
  choice: Comment
  rationale: Rend directement l’interrogatif portant sur la manière dont cet homme possède un tel savoir.
- source_word: οὗτος
  choice: cet homme
  rationale: Expression française naturelle qui conserve une certaine distance dans la manière de désigner Jésus, sans ajouter de nuance franchement méprisante.
- source_word: γράμματα οἶδεν
  choice: est-il si instruit
  rationale: L’expression grecque, littéralement « connaît les lettres », désigne ici le savoir acquis ou la maîtrise des textes. « Est-il si instruit » en transmet idiomatiquement le sens en français ; la note conserve la forme littérale et son ambiguïté.
- source_word: μὴ μεμαθηκώς
  choice: sans avoir étudié
  rationale: Le participe parfait évoque l’absence de la formation reconnue qui aurait normalement produit ce savoir. Cette formulation reste naturelle sans préciser abusivement une institution rabbinique particulière.
theological_decisions:
- issue: Référent de οἱ Ἰουδαῖοι dans Jean
  choice: les Juifs
  alternative: les autorités juives ; les Judéens
  rationale: Le texte principal conserve la désignation grecque générale et la tension narrative propre à Jean. La note indique qu’ici le contexte vise les interlocuteurs de Jésus à Jérusalem, probablement avec des membres des autorités, et non l’ensemble du peuple juif.
- issue: Portée de γράμματα
  choice: instruction ou savoir reconnu
  alternative: les lettres ; les Écritures
  rationale: Le grec peut évoquer les lettres, les textes ou le savoir. Traduire directement par « les Écritures » préciserait plus que le texte ne l’impose, tandis que « est-il si instruit » exprime naturellement la surprise devant le savoir de Jésus sans fermer entièrement la portée du terme.
translation_notes:
  register: Français international moderne, digne et accessible. L’imparfait conserve l’aspect duratif de la réaction ; la question directe reste vive. « Si instruit » privilégie une formulation idiomatique, tandis que la note expose l’expression grecque littérale et son amplitude sémantique.
