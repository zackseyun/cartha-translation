  text: ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ⸀ἐπάρατοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: fr
  text: Mais cette foule, qui ne connaît pas la Loi[a], est maudite[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « la Loi » désigne la Loi juive, c’est-à-dire la Torah.
    reason: cultural_note
  - marker: b
    text: 'Ou : « sous le coup d’une malédiction ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: La conjonction marque ici une opposition avec ce qui précède; « Mais » est la formulation française la plus naturelle.
- source_word: ὁ ὄχλος οὗτος
  choice: cette foule
  rationale: « Foule » rend le collectif ὄχλος sans lui ajouter la nuance péjorative que pourrait avoir « populace ».
- source_word: ὁ μὴ γινώσκων
  choice: qui ne connaît pas
  rationale: Cette proposition relative rend naturellement le participe présent attributif et décrit l'état que les locuteurs imputent à la foule.
- source_word: τὸν νόμον
  choice: la Loi
  rationale: Dans ce contexte, νόμος désigne la Loi juive, la Torah. La majuscule signale ce référent précis sans développer le texte.
- source_word: ἐπάρατοί
  choice: maudite
  rationale: « Maudite » conserve la force de la condamnation exprimée par ἐπάρατος et s'accorde naturellement avec le nom collectif féminin « foule ».
- source_word: εἰσιν
  choice: est
  rationale: Bien que le grec emploie le pluriel en visant les membres de la foule, le français exige normalement le singulier avec le sujet collectif « cette foule ».
theological_decisions:
- issue: Faut-il présenter ce jugement hostile comme une affirmation théologique du narrateur?
  choice: Conserver sans l'atténuer la dénonciation formulée dans le discours direct des adversaires de Jésus.
  alternative: Ajouter une formule de distanciation, par exemple « ils prétendent que cette foule est maudite ».
  rationale: Le grec donne directement les paroles des locuteurs. La traduction doit préserver leur jugement sévère sans l'approuver ni ajouter une prise de distance absente du texte.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste concise et conserve le ton méprisant et accusateur du discours direct, sans employer un terme plus chargé que le grec pour désigner la foule.
