  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: fr
  text: 'Quelques habitants de Jérusalem disaient donc : « N’est-ce pas lui qu’ils cherchent à tuer ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente des paroles en cours ou répétées dans la scène ; l’imparfait français en rend naturellement l’aspect.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la continuation narrative et logique avec ce qui précède ; « donc » en conserve la force sans alourdir la phrase.
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: Quelques habitants de Jérusalem
  rationale: τινες désigne un groupe indéterminé, tandis que ἐκ indique qu’ils sont pris parmi les habitants de Jérusalem. Cette formulation est naturelle et précise en français moderne.
- source_word: Οὐχ οὗτός ἐστιν
  choice: N’est-ce pas lui
  rationale: Οὐχ introduit une question qui appelle vraisemblablement une réponse affirmative. « Lui » reprend naturellement la personne désignée par οὗτός.
- source_word: ζητοῦσιν
  choice: ils cherchent
  rationale: Le présent grec exprime ici une démarche ou intention actuelle ; le présent français préserve cette valeur.
- source_word: ἀποκτεῖναι
  choice: à tuer
  rationale: Le verbe signifie directement « tuer » ; cette formulation claire n’ajoute aucune nuance judiciaire absente du grec.
