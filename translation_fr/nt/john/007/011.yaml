id: JHN.7.11
reference: John 7:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: fr
  text: 'Les Juifs[a] le cherchaient donc pendant la fête et demandaient : « Où est cet homme-là ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens » ; dans le contexte narratif de Jean, il peut s’agir plus précisément des autorités juives de Judée.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la continuité logique et narrative avec le contexte précédent, dans un français naturel.
- source_word: Ἰουδαῖοι
  choice: les Juifs
  rationale: Rendu lexical direct qui ne restreint pas explicitement le groupe aux autorités; la nuance contextuelle possible est signalée en note.
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait français rend naturellement l’action en cours exprimée par l’imparfait grec.
- source_word: ἐν τῇ ἑορτῇ
  choice: pendant la fête
  rationale: Situe clairement l’action dans la durée de la fête déjà mentionnée dans le contexte.
- source_word: ἔλεγον
  choice: demandaient
  rationale: Dans ce contexte interrogatif, « demandaient » est idiomatique et conserve l’aspect duratif ou répété de l’imparfait.
- source_word: ἐκεῖνος
  choice: cet homme-là
  rationale: Le démonstratif garde une nuance de distance; « homme » explicite naturellement en français le référent masculin humain sans lui attribuer de titre.
theological_decisions:
- issue: Référent de Ἰουδαῖοι dans Jean
  choice: « les Juifs » dans le texte principal
  alternative: « les Judéens » ou, selon le contexte narratif, plus précisément « les autorités juives de Judée »
  rationale: Le verset ne limite pas expressément le référent aux dirigeants. Le texte principal conserve donc l’étendue lexicale, tandis que la note rend visible la possibilité contextuelle sans la transformer en certitude.
translation_notes:
  register: Français international moderne, sobre et digne. Les deux imparfaits grecs sont rendus par des imparfaits français. La formulation évite de résoudre silencieusement l’ambiguïté de Ἰουδαῖοι.
