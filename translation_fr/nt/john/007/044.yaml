review_pass:
  verdict: revise
  source_fidelity: 'Le sens de τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν est globalement bien rendu : certains, au sein du groupe, avaient l’intention de le saisir. La note conserve à juste titre la nuance possible d’arrestation. La seconde proposition exprime correctement que personne ne passa à l’acte.'
  naturalness: « Se saisir de lui » est grammatical, mais plus lourd et moins direct que « le saisir » dans ce contexte. « Porter la main sur lui » peut évoquer en français le fait de frapper ou d’agresser quelqu’un, alors que l’idiome grec décrit plus précisément le fait de mettre la main sur lui pour le saisir. « Mettre la main sur lui » est plus naturel et plus proche ici.
  terminology: « Saisir » conserve l’expression non technique de πιάσαι, sans imposer « arrêter » dans le texte. « Mettre la main sur lui » rend l’action physique de ἐπέβαλεν … τὰς χεῖρας sans introduire une interprétation confessionnelle ou juridique excessive.
