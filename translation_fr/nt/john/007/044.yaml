- from: Mais certains d’entre eux voulaient se saisir de lui[a], pourtant personne ne porta la main sur lui.
  to: Mais certains d’entre eux voulaient le saisir[a], mais personne ne mit la main sur lui.
  rationale: La révision emploie des tournures françaises modernes plus idiomatiques tout en préservant la distinction du grec entre le projet de le saisir et le fait que personne ne mit effectivement la main sur lui. La possibilité que πιάσαι désigne une arrestation demeure en note.
