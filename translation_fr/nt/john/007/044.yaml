  variant: modern international French
source:
  edition: SBLGNT
  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: fr
  text: Mais certains d’entre eux voulaient le saisir[a], mais personne ne mit la main sur lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « l’arrêter ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ
  choice: Mais certains
  rationale: « Certains » désigne naturellement un groupe non précisé au sein de la foule, tandis que « mais » marque le contraste avec les réactions précédentes.
- source_word: ἤθελον
  choice: voulaient
  rationale: L’imparfait français rend naturellement le désir ou l’intention qui existait alors, sans surinterpréter l’aspect grec.
- source_word: ἐξ αὐτῶν
  choice: d’entre eux
  rationale: Cette formulation indique clairement qu’il s’agit d’une partie du groupe déjà mentionné.
- source_word: πιάσαι
  choice: se saisir de lui
  rationale: Le verbe exprime l’action de saisir physiquement quelqu’un et peut, dans ce contexte, impliquer son arrestation sans que cette nuance soit rendue obligatoire dans le texte principal.
- source_word: ἀλλ’ οὐδεὶς
  choice: pourtant personne
  rationale: « Pourtant » souligne nettement le contraste entre leur intention et l’absence d’action, et « personne » rend l’indéfini négatif.
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: ne porta la main sur lui
  rationale: Cette expression française naturelle conserve l’image corporelle de l’idiome grec et son sens hostile de tentative de maîtrise ou d’arrestation.
theological_decisions: []
translation_notes:
  register: Français moderne, clair et digne. « Se saisir de lui » et « porter la main sur lui » préservent les deux formulations physiques distinctes du grec, tandis que la note explicite la nuance judiciaire possible de πιάσαι.
