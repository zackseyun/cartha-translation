- from: Vous, montez à la fête. Moi, je ne monte pas à cette fête[a], parce que le moment qui m’est réservé n’est pas encore arrivé à son accomplissement[b].
  to: Vous, montez à la fête. Moi, je ne monte pas à cette fête[a], car mon moment n’est pas encore accompli[b].
