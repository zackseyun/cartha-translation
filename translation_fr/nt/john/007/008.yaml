  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: fr
  text: Vous, montez à la fête. Moi, je ne monte pas à cette fête[a], car mon moment n’est pas encore accompli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Certains manuscrits portent : « je ne monte pas encore à cette fête ».'
    reason: textual_variant
  - marker: b
    text: 'Ou : « mon moment n’est pas encore pleinement arrivé ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: montez
  rationale: Conserve la nuance de montée vers Jérusalem tout en restant idiomatique dans ce contexte de pèlerinage.
- source_word: ἑορτή
  choice: fête
  rationale: « Fête » exprime naturellement en français le caractère religieux de la célébration juive concernée.
- source_word: οὐκ ἀναβαίνω
  choice: je ne monte pas
  rationale: Suit la leçon οὐκ du SBLGNT sans introduire « encore », tout en rendant naturellement le présent grec dans la situation immédiate.
- source_word: ταύτην
  choice: cette
  rationale: Rend directement le démonstratif qui désigne la fête précise dont il est question.
- source_word: καιρός
  choice: le moment qui m’est réservé
  rationale: Exprime un moment déterminé ou approprié plutôt que le temps en général, sans préciser explicitement par qui il est fixé.
- source_word: πεπλήρωται
  choice: n’est pas encore arrivé à son accomplissement
  rationale: Préserve la notion d’accomplissement du parfait passif de πληρόω, plutôt que de la réduire à une simple arrivée.
theological_decisions:
- issue: Variante textuelle dans la déclaration de Jésus sur sa montée à la fête
  choice: 'Le texte principal suit οὐκ : « je ne monte pas à cette fête »'
  alternative: 'La variante οὔπω donne : « je ne monte pas encore à cette fête »'
  rationale: Le texte source fourni, le SBLGNT, porte οὐκ. La variante est néanmoins signalée, car elle influe fortement sur la lecture du départ ultérieur de Jésus et la tension du récit.
- issue: Portée de καιρός
  choice: « le moment qui m’est réservé »
  alternative: « mon moment » ou « le temps qui m’est fixé »
  rationale: Cette formulation garde l’idée d’un moment propre à Jésus et déterminé, sans développer davantage la nature théologique de cette détermination.
translation_notes:
  register: Français moderne, digne et accessible. La reprise contrastive « Vous… Moi… » restitue l’opposition explicite des pronoms grecs. « Montez » conserve la perspective géographique et cultuelle de la montée à Jérusalem. Les notes maintiennent la variante textuelle et l’alternative lexicale sans résoudre la tension narrative.
