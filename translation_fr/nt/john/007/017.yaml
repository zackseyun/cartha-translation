  verdict: revise
  source_fidelity: La structure conditionnelle, le futur de discernement, l’alternative « de Dieu / de moi-même » et la note sur ἀπ’ ἐμαυτοῦ sont fidèlement rendus. Cependant, « sa volonté » peut naturellement se rapporter en français à « quelqu’un » et produire le sens fautif « faire sa propre volonté ». Dans le contexte, αὐτοῦ renvoie à Dieu; l’explicitation est nécessaire en français pour préserver ce référent.
  naturalness: La phrase est fluide et adaptée au français international moderne. « Il saura si cet enseignement vient de Dieu » rend naturellement le discernement concernant l’enseignement. « Je parle de moi-même » est clair, et la note fournit utilement les nuances d’autorité ou d’initiative personnelle.
  terminology: « Volonté de Dieu », « enseignement », « vient de Dieu » et « de moi-même » conviennent au registre et respectent les termes théologiques sans surcharge doctrinale. Le marqueur de note est correctement ancré sur « de moi-même ».
