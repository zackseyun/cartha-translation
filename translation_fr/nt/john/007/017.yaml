reference: John 7:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: fr
  text: Si quelqu’un veut faire la volonté de Dieu, il saura si cet enseignement vient de Dieu ou si je parle de moi-même[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de mon propre chef » ou « de ma propre autorité ». Le grec dit littéralement « de moi-même ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: Si quelqu’un veut
  rationale: La construction ἐάν avec le subjonctif exprime ici une condition générale. « Veut » restitue naturellement la volonté ou la disposition de la personne.
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: faire sa volonté
  rationale: Cette formulation française est directe et idiomatique. Le possessif conserve le pronom grec, dont le référent est Dieu dans le contexte, sans l’expliciter dans le texte principal.
- source_word: γνώσεται
  choice: il saura
  rationale: Le futur exprime la connaissance ou le discernement qui en résultera. « Il saura » est concis et naturel.
- source_word: περὶ τῆς διδαχῆς πότερον
  choice: si cet enseignement
  rationale: La tournure française intègre naturellement « au sujet de l’enseignement » dans l’interrogation indirecte. « Cet enseignement » renvoie clairement à l’enseignement de Jésus dont il est question.
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: vient de Dieu
  rationale: ἐκ indique l’origine. En français, « vient de Dieu » exprime idiomatiquement que l’enseignement a Dieu pour source.
- source_word: ἀπ’ ἐμαυτοῦ λαλῶ
  choice: je parle de moi-même
  rationale: La formulation conserve l’image grecque de la source personnelle du discours, sans préciser davantage la notion d’autorité indépendante.
theological_decisions:
- issue: Référent de αὐτοῦ dans « sa volonté »
  choice: Conserver le possessif « sa », avec Dieu comme référent contextuel
  alternative: Expliciter « la volonté de Dieu »
  rationale: Le contexte indique que le pronom renvoie à Dieu, mais le texte grec emploie un pronom. Le conserver évite une explicitation interprétative inutile.
- issue: Portée de ἀπ’ ἐμαυτοῦ
  choice: « de moi-même »
  alternative: « de mon propre chef » ou « de ma propre autorité »
  rationale: Le grec exprime directement la provenance ou l’origine. La traduction principale préserve cette image et la note signale les implications possibles sans les imposer.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe a été légèrement réorganisée pour rendre naturelle l’interrogation indirecte, tout en conservant le contraste entre l’origine divine de l’enseignement et une parole qui viendrait de Jésus lui-même.
