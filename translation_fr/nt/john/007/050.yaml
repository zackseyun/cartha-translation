id: JHN.7.50
reference: John 7:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: fr
  text: 'Nicodème, qui était venu auprès de lui auparavant[a] et qui était l’un d’eux, leur dit :'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui était venu auprès de lui précédemment ». Dans le contexte, « lui » désigne Jésus.
    reason: Alternative lexicale et clarification du référent pronominal.
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le présent « dit », naturel dans la narration biblique française et fidèle à la forme verbale du texte source.
- source_word: Νικόδημος
  choice: Nicodème
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: πρὸς αὐτούς
  choice: leur
  rationale: Avec un verbe de parole, πρός suivi de l’accusatif désigne les destinataires. Le pronom complément indirect « leur » est la formulation française naturelle.
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: qui était venu auprès de lui auparavant
  rationale: La relative rend naturellement en français le participe grec substantivé en apposition. Le plus-que-parfait marque l’antériorité de cette venue, tandis que « auprès de lui » conserve le pronom du grec sans insérer explicitement le nom de Jésus.
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: qui était l’un d’eux
  rationale: Cette relative restitue clairement et sans valeur causale ajoutée l’information circonstancielle portée par le participe grec.
theological_decisions:
- issue: Référent de αὐτόν dans ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: Conserver « lui » dans le texte et préciser en note que le contexte renvoie à Jésus.
  alternative: Nommer directement Jésus dans le corps du verset.
  rationale: Jean 3.1-2 permet d’identifier Jésus comme référent, mais le grec emploie un pronom. La traduction préserve donc la formulation du texte tout en apportant l’éclairage contextuel en note.
translation_notes:
  register: Français international moderne, digne et lisible. La phrase conserve la structure appositionnelle du grec sous la forme de deux relatives coordonnées, plus naturelle en français que « celui qui… étant l’un d’eux ».
