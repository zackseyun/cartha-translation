id: JHN.7.7
reference: John 7:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: fr
  text: Le monde[a] ne peut pas vous haïr[b], mais moi, il me hait, parce que je témoigne à son sujet[c] que ses œuvres sont mauvaises[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chez Jean, « le monde » désigne souvent l’ordre humain opposé à Dieu, et non l’univers créé en tant que tel.
    reason: cultural_note
  - marker: b
    text: Ou « est incapable de vous haïr ».
    reason: lexical_alternative
  - marker: c
    text: Ou « je rends témoignage à son sujet ».
    reason: lexical_alternative
  - marker: d
    text: Ou « ses actes sont mauvais ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύναται
  choice: ne peut pas
  rationale: Cette formulation française naturelle conserve explicitement l’idée d’incapacité exprimée par δύναμαι.
- source_word: ὁ κόσμος
  choice: le monde
  rationale: Cette traduction habituelle préserve l’étendue et la polysémie de κόσμος chez Jean sans la réduire à une paraphrase interprétative.
- source_word: μισεῖν / μισεῖ
  choice: haïr / hait
  rationale: La répétition du même verbe conserve la vigueur de μισέω et le contraste entre « vous » et « moi ».
- source_word: ἐμὲ δὲ
  choice: mais moi, il me hait
  rationale: La dislocation, naturelle en français, met « moi » en relief et restitue le contraste marqué par δέ et le pronom emphatique ἐμέ.
- source_word: μαρτυρῶ
  choice: je témoigne
  rationale: « Témoigner » rend clairement la dimension de témoignage de μαρτυρέω dans un français actuel.
- source_word: περὶ αὐτοῦ
  choice: à son sujet
  rationale: La locution renvoie sans ambiguïté au « monde » tout en évitant une tournure française lourde.
- source_word: τὰ ἔργα αὐτοῦ
  choice: ses œuvres
  rationale: « Œuvres » reste proche de ἔργα et conserve les résonances morales et théologiques du vocabulaire johannique.
- source_word: πονηρά
  choice: mauvaises
  rationale: Dans ce contexte moral, « mauvaises » qualifie les œuvres comme mauvaises au sens éthique, et non comme simplement médiocres.
theological_decisions:
- issue: Référent et portée théologique de « le monde » dans le contexte johannique
  choice: Conserver « le monde » sans développement interprétatif
  alternative: « l’humanité opposée à Dieu » ou « le système du monde »
  rationale: Chez Jean, κόσμος peut avoir plusieurs nuances. Ici, il désigne le monde humain qui s’oppose à Jésus parce que celui-ci dévoile le caractère mauvais de ses œuvres. La formulation retenue préserve cette tension sans imposer une définition théologique plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure emphatique « mais moi, il me hait » restitue le contraste grec sans archaïsme. « Œuvres » est maintenu pour préserver le vocabulaire johannique, avec « actes » proposé en note comme équivalent plus courant.
