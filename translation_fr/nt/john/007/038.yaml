id: JHN.7.38
reference: John 7:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: fr
  text: Celui qui croit en moi[a], comme l’a dit l’Écriture, des fleuves d’eau vive couleront du plus profond de lui[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: La phrase grecque permet aussi de rattacher « comme l’a dit l’Écriture » à l’affirmation qui suit plutôt qu’à « croit en moi ».
    reason: syntactic_ambiguity
  - marker: b
    text: Certains comprennent « lui » comme désignant le Messie plutôt que celui qui croit.
    reason: alternative_reading
  - marker: c
    text: 'Littéralement : « de son ventre » ; κοιλία peut aussi signifier « matrice ». Il s’agit ici vraisemblablement d’une image désignant l’être intérieur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: Celui qui croit en moi
  rationale: Le participe présent substantivé désigne une personne caractérisée par la foi, et εἰς ἐμέ exprime ici la confiance dirigée vers Jésus. Cette formulation conserve le singulier et reste naturelle en français.
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: comme l’a dit l’Écriture
  rationale: Le passé composé convient naturellement en français à une parole scripturaire antérieure qui demeure pertinente. Le singulier défini « l’Écriture » reflète ἡ γραφή.
- source_word: ποταμοὶ
  choice: des fleuves
  rationale: ποταμοί évoque des fleuves plutôt que de simples ruisseaux et conserve l’image d’abondance.
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: du plus profond de lui
  rationale: κοιλία signifie littéralement « ventre » ou « sein », mais désigne ici, par image, le centre intérieur de la personne. « Du plus profond de lui » rend cette valeur figurée en français naturel sans effacer le sens littéral, signalé en note.
- source_word: ῥεύσουσιν
  choice: couleront
  rationale: Le futur actif est rendu directement, sans ajouter l’intensité qu’impliquerait « jailliront à grands flots ».
- source_word: ὕδατος ζῶντος
  choice: d’eau vive
  rationale: Expression française consacrée qui préserve à la fois l’image d’une eau courante et sa portée théologique dans l’Évangile selon Jean.
theological_decisions:
- issue: Référent de αὐτοῦ dans ἐκ τῆς κοιλίας αὐτοῦ
  choice: Le pronom renvoie, dans le texte principal, à celui qui croit.
  alternative: Le pronom peut être compris comme renvoyant au Messie, source de l’eau vive.
  rationale: L’antécédent grammatical le plus proche est « celui qui croit », et Jean 7.39 associe ensuite l’image à l’Esprit que les croyants allaient recevoir. L’autre compréhension ancienne et théologiquement significative est toutefois conservée en note.
- issue: Rattachement de καθὼς εἶπεν ἡ γραφή
  choice: La formulation française conserve la place médiane de l’incise et ne tranche pas explicitement son rattachement.
  alternative: « Comme l’a dit l’Écriture » peut qualifier soit « croit en moi », soit l’affirmation selon laquelle des fleuves d’eau vive couleront.
  rationale: Le grec ne possède pas de ponctuation originale permettant de résoudre sûrement la relation syntaxique. La note rend cette ambiguïté visible.
- issue: Sens figuré de κοιλία
  choice: du plus profond de lui
  alternative: de son ventre ; de son sein ; de son être intérieur
  rationale: Le rendu choisi communique le centre intérieur de la personne dans un français actuel et digne, tandis que la note maintient l’image corporelle du grec.
translation_notes:
  register: Français international moderne, courant mais digne. « Eau vive » conserve l’expression biblique reconnue. « Du plus profond de lui » évite l’effet excessivement anatomique de « ventre » tout en maintenant la métaphore grâce à la note.
