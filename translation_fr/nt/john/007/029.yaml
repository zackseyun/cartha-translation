  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: fr
  text: Moi, je le connais, car je viens de lui[a], et c’est lui qui m’a envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je suis de lui » ou « je viens d’auprès de lui ». La formule grecque peut exprimer la provenance, l’origine ou la relation de présence. La conjonction rendue par « car » peut aussi être comprise comme introduisant un contenu (« que »), mais le contexte favorise le sens causal.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: Moi, je
  rationale: Le pronom sujet explicite est emphatique en grec. La dislocation « Moi, je » rend naturellement ce contraste en français.
- source_word: οἶδα
  choice: je connais
  rationale: οἶδα exprime ici un état présent de connaissance. Le présent français convient au contraste contextuel avec ceux qui ne connaissent pas véritablement le Père.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom renvoie au Père dans le contexte. Le pronom français conserve cette référence personnelle sans ajouter d’explication au texte.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit vraisemblablement ici la raison pour laquelle Jésus le connaît. « Parce que » exprime clairement ce rapport causal.
- source_word: παρ’ αὐτοῦ εἰμι
  choice: je suis issu de lui
  rationale: παρά avec le génitif marque la provenance ou l’origine, tandis que εἰμι demeure au présent. « Je suis issu de lui » exprime cette origine plus naturellement et précisément que le calque « je suis de lui », sans réduire la formule à un simple déplacement.
- source_word: κἀκεῖνός
  choice: et c’est lui qui
  rationale: La contraction καί + ἐκεῖνος désigne avec relief le même référent. La tournure clivée française rend ce relief de manière naturelle.
- source_word: με
  choice: m’
  rationale: Le pronom est le complément d’objet direct de ἀπέστειλεν.
- source_word: ἀπέστειλεν
  choice: a envoyé
  rationale: Le passé composé est le temps narratif français naturel pour cet aoriste et conserve le thème johannique de l’envoi.
theological_decisions:
- issue: Sens de la relation de Jésus au Père dans παρ’ αὐτοῦ εἰμι
  choice: « je suis issu de lui »
  alternative: « je viens de lui » ; « je suis auprès de lui » ; « je suis de sa présence »
  rationale: La formulation retenue exprime la source ou l’origine tout en maintenant le présent de εἰμι et la profondeur théologique de l’énoncé. Elle évite de réduire le sens soit à la seule mission, soit à une simple proximité spatiale.
- issue: Valeur de ὅτι
  choice: 'Valeur causale : « parce que »'
  alternative: 'Valeur déclarative : « que »'
  rationale: Dans le contexte, la provenance de Jésus fonde son affirmation qu’il connaît le Père. La valeur déclarative demeure grammaticalement possible et est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. « Moi, je » restitue l’emphase du sujet grec ; « issu de lui » préserve l’idée d’origine sans explicitation doctrinale excessive. Le marqueur [a] figure dans le texte principal.
