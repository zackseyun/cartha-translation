    rationale: « Je sais que je suis issu de lui » ne reproduit pas aisément la construction complète, où « le » reste l’objet de « connais ». Une note plus sobre peut signaler que ὅτι peut être compris comme introducteur de contenu, sans restructurer indûment la phrase.
