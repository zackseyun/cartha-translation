  source_fidelity: Le sens causal de ὅτι est bien rendu. Toutefois, « je suis issu de lui » tend en français à préciser l’origine de manière plus marquée et plus généalogique que ne le fait nécessairement παρ’ αὐτοῦ εἰμι. « Je viens de lui » exprime naturellement la provenance personnelle, tout en conservant l’ambiguïté de la relation exprimée par le grec.
  naturalness: La dislocation « Moi, je » et la mise en relief « c’est lui qui » sont naturelles et rendent de façon recevable l’emphase des pronoms grecs. « Je viens de lui » est plus idiomatique dans le français international moderne que « je suis issu de lui » dans cette affirmation personnelle.
  terminology: « Connais », « viens de lui » et « m’a envoyé » maintiennent respectivement la connaissance, la provenance et le thème johannique de l’envoi, sans explicitation doctrinale. La note doit présenter l’alternative déclarative sans attribuer au grec une précision excessive.
