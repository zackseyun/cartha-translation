id: JHN.7.1
reference: John 7:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: fr
  text: Après cela, Jésus circulait en Galilée. En effet, il ne voulait pas circuler en Judée, parce que les Juifs[a] cherchaient à le tuer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens » ou « les autorités juives ». Dans l’Évangile selon Jean, l’expression « les Juifs » désigne souvent plus précisément, selon le contexte, les autorités juives de Judée ou les personnes qui s’opposent à Jésus dans le récit, et non l’ensemble du peuple juif.
    reason: Préciser la portée contextuelle possible de οἱ Ἰουδαῖοι et prévenir une généralisation ethnique anachronique.
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Après cela
  rationale: Cette transition temporelle naturelle conserve la référence rétrospective du pluriel grec sans alourdir le français.
- source_word: περιεπάτει / περιπατεῖν
  choice: se déplaçait / se déplacer
  rationale: La répétition française reflète celle de περιπατέω. « Se déplacer » exprime ici l’activité continue dans une région plus naturellement que le littéral « marcher », tout en évitant de préciser indûment le mode de déplacement.
- source_word: ἐν τῇ Γαλιλαίᾳ / ἐν τῇ Ἰουδαίᾳ
  choice: en Galilée / en Judée
  rationale: Rendu locatif direct qui ne transforme pas explicitement le mouvement en parcours de l’ensemble de chaque région.
- source_word: οὐ γὰρ ἤθελεν
  choice: En effet, il ne voulait pas
  rationale: « En effet » restitue la valeur explicative de γάρ, tandis que « ne voulait pas » exprime la volonté plutôt qu’une incapacité.
- source_word: ὅτι
  choice: parce que
  rationale: Marque clairement la cause donnée par le récit.
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait conserve l’aspect continu de l’intention hostile. L’infinitif qui suit en précise le but.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Le rendu formel conserve l’expression grecque, tandis qu’une note indique sa portée narrative probable dans ce contexte afin d’éviter une généralisation à tout le peuple juif.
- source_word: ἀποκτεῖναι
  choice: à le tuer
  rationale: Rendu direct, courant et précis de l’infinitif grec avec son objet.
theological_decisions:
- issue: Référent de « les Juifs » dans l’Évangile selon Jean
  choice: Conserver « les Juifs » dans le texte avec une note de contextualisation.
  alternative: « les autorités juives » ou « les Judéens »
  rationale: Le grec dit formellement « les Juifs », mais le contexte johannique vise souvent plus précisément l’opposition juive de Judée, notamment ses autorités. La note préserve à la fois la forme du texte et sa nuance contextuelle, sans suggérer une condamnation indistincte du peuple juif.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « se déplacer » maintient le lien lexical interne du verset sans recourir au calque peu naturel « marcher en Galilée/Judée ».
