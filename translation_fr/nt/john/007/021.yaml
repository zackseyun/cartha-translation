  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Ἓν ἔργον ἐποίησα καὶ πάντες θαυμάζετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: fr
  text: 'Jésus leur répondit : « J’ai accompli une seule œuvre[a][b], et vous vous en étonnez tous. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « acte ». Le mot grec peut désigner l’un ou l’autre, mais « œuvre » préserve l’emploi récurrent de ce terme chez Jean pour parler des actions de Jésus.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit probablement de la guérison, un jour de sabbat, de l’homme infirme en Jean 5.1-18.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτοῖς
  choice: leur répondit
  rationale: La formule narrative grecque « répondit et leur dit », d’influence sémitique, se rend naturellement en français par « leur répondit », sans perte de sens.
- source_word: Ἓν
  choice: une seule
  rationale: « Une seule » fait ressortir l’insistance portée par le numéral placé en tête.
- source_word: ἔργον
  choice: œuvre
  rationale: « Œuvre » reste naturel ici et préserve la résonance johannique de ce terme récurrent pour les actes de Jésus.
- source_word: ἐποίησα
  choice: j’ai accompli
  rationale: Avec « œuvre », le verbe « accomplir » forme une expression française naturelle tout en rendant l’action achevée exprimée par l’aoriste.
- source_word: πάντες θαυμάζετε
  choice: vous vous en étonnez tous
  rationale: Cette formulation conserve l’adresse au groupe entier, le présent grec et une nuance d’étonnement qui ne présume pas d’une réaction favorable.
theological_decisions:
- issue: Portée johannique de ἔργον
  choice: œuvre
  alternative: acte
  rationale: « Œuvre » maintient le lien lexical avec les autres emplois théologiquement significatifs du mot dans Jean, sans expliciter dans le texte l’allusion probable à la guérison du chapitre 5.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure grecque redondante « répondit et dit » est idiomatiquement condensée, tandis que l’insistance sur « une seule » et l’ambivalence de l’étonnement sont conservées.
