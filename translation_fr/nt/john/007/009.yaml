  text: ταῦτα ⸀δὲ εἰπὼν ⸀αὐτὸς ἔμεινεν ἐν τῇ Γαλιλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/009.yaml
  text: After saying these things, he himself remained in Galilee.
translation:
  language: fr
  text: Après avoir dit cela, quant à lui, il resta en Galilée.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: cela
  rationale: Le neutre pluriel renvoie aux paroles précédentes. En français courant, « cela » reprend naturellement l’ensemble de ces propos sans imposer un pluriel peu idiomatique.
- source_word: δὲ εἰπὼν
  choice: Après avoir dit
  rationale: Le participe aoriste exprime ici une action antérieure à celle du verbe principal; cette tournure restitue naturellement la progression temporelle, tandis que δέ assure une transition légère sans devoir être traduit séparément.
- source_word: αὐτὸς
  choice: lui-même
  rationale: Le pronom explicite peut porter une valeur de mise en relief, vraisemblablement en contraste avec les frères de Jésus dans le contexte immédiat. « Lui-même » conserve cette nuance sans ajouter d’interprétation.
- source_word: ἔμεινεν
  choice: resta
  rationale: Dans ce récit, μένω signifie demeurer ou rester en un lieu. « Resta » est naturel, précis et conserve le verbe johannique sans le surcharger de sa portée éventuelle ailleurs.
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: en Galilée
  rationale: Traduction locative directe et idiomatique du nom géographique.
theological_decisions: []
translation_notes:
  register: Français moderne, sobre et narratif. La phrase conserve la mise en relief possible de αὐτός tout en employant « cela », plus naturel que « ces choses » pour reprendre des paroles en français.
