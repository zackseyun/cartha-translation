  text: ἀπεκρίθησαν οἱ ὑπηρέται· Οὐδέποτε ⸂ἐλάλησεν οὕτως⸃ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: fr
  text: 'Les gardes répondirent : « Jamais un homme[a] n’a parlé ainsi. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jamais personne n’a parlé ainsi. » Le grec dit littéralement « un homme », au masculin singulier, avec une portée représentative.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: répondirent
  rationale: L’aoriste de ἀποκρίνομαι introduit leur réponse dans le récit. Le passé simple convient au registre narratif français et rend directement « répondirent ».
- source_word: οἱ ὑπηρέται
  choice: les gardes
  rationale: Dans le contexte de Jean 7.32, 45, il s’agit des hommes envoyés pour arrêter Jésus. « Les gardes » exprime naturellement leur fonction sans préciser de façon interprétative qu’il s’agissait d’une « police du Temple ».
- source_word: Οὐδέποτε
  choice: Jamais
  rationale: L’adverbe nie qu’une telle manière de parler se soit produite à quelque moment que ce soit; « jamais » en restitue sobrement la force absolue.
- source_word: ἐλάλησεν
  choice: n’a parlé
  rationale: Après « jamais », le passé composé est naturel en français pour évoquer l’expérience jusqu’au moment présent, tout en rendant adéquatement l’aoriste grec.
- source_word: οὕτως
  choice: ainsi
  rationale: οὕτως indique ici la manière. « Ainsi » est concis, naturel et digne.
- source_word: ἄνθρωπος
  choice: un homme
  rationale: Le nom grec est au masculin singulier et possède ici une portée représentative. « Un homme » préserve cette forme, tandis que la note signale l’équivalent français plus explicitement générique « personne ».
theological_decisions:
- issue: Portée générique et forme masculine de ἄνθρωπος
  choice: un homme
  alternative: personne
  rationale: Le texte grec emploie le masculin singulier ἄνθρωπος avec une portée représentative. Le texte principal conserve cette formulation sans exclure le sens générique, lequel est explicité en note afin de préserver l’ambiguïté de forme et de portée.
translation_notes:
  register: Français international moderne, naturel et digne. « Les gardes » convient au contexte institutionnel sans surinterprétation; le passé simple maintient un registre narratif soigné, tandis que le passé composé dans la citation reste idiomatique.
