source:
  edition: SBLGNT
  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: fr
  text: Vous me chercherez sans me trouver, et là où je suis, vous ne pouvez pas venir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητήσετέ
  choice: vous chercherez
  rationale: Le futur actif à la deuxième personne du pluriel exprime une recherche à venir. « Chercher » est naturel en français moderne et correspond au contexte sans ajouter une nuance spirituelle particulière.
- source_word: με
  choice: me
  rationale: Pronom objet direct renvoyant à Jésus.
- source_word: οὐχ εὑρήσετε
  choice: sans me trouver
  rationale: Dans la construction française « chercher sans trouver », cette formulation rend naturellement le futur nié tout en maintenant le lien étroit entre les deux verbes. Aucune emphase supplémentaire n’est ajoutée.
- source_word: ὅπου
  choice: là où
  rationale: « Là où » introduit naturellement en français la proposition de lieu et rend explicitement sa valeur locative.
- source_word: εἰμὶ ἐγώ
  choice: je suis
  rationale: Rend directement le présent et le pronom sujet explicite. Le contraste avec « vous » demeure perceptible par la structure des deux propositions.
- source_word: ὑμεῖς
  choice: vous
  rationale: Pronom sujet pluriel explicitement exprimé, en contraste avec « je ».
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: vous ne pouvez pas venir
  rationale: Rend clairement l’idée d’incapacité portée par δύνασθε, sans la transformer en interdiction. Cette formulation est à la fois précise et idiomatique en français.
theological_decisions:
- issue: Nature de l’affirmation « là où je suis, vous ne pouvez pas venir »
  choice: Formuler une incapacité sans en préciser la nature.
  alternative: « vous n’avez pas le droit de venir », qui exprimerait une interdiction.
  rationale: Le grec emploie δύνασθε, verbe de capacité. Le verset ne précise pas si l’incapacité est morale, spirituelle, judiciaire ou temporaire; la traduction conserve donc cette tension.
translation_notes:
  register: Français international moderne, digne et accessible. La coordination grecque est légèrement resserrée en « sans me trouver » pour une expression naturelle, sans modifier le rapport logique entre la recherche annoncée et son échec.
