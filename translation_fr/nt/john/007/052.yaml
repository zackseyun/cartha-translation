review_pass:
  verdict: revise
  source_fidelity: La question négative et l’origine géographique (« de Galilée ») sont bien rendues. Toutefois, la note actuelle déplace « de Galilée » vers « en Galilée », ce qui peut faire de la Galilée le lieu où le prophète est suscité plutôt que son lieu d’origine. « Surgit » rend plus directement ἐγείρεται que « vient », tout en restant naturel.
  naturalness: La formulation révisée est fluide en français international moderne. « Tu n’es tout de même pas, toi aussi… ? » exprime clairement l’attente d’une réponse négative de μή. « Cherche et constate » conserve les deux impératifs sans lourdeur.
  terminology: « Prophète » convient pour προφήτης et demeure indéfini dans la portée de « aucun ». La note révisée préserve prudemment la possible nuance passive/divine de ἐγείρεται sans l’imposer au texte.
  issues:
  - severity: medium
    issue: La note dit « suscité en Galilée ».
    rationale: Le grec ἐκ τῆς Γαλιλαίας signifie « de Galilée », c’est-à-dire l’origine. « En Galilée » peut indiquer le lieu de l’action de susciter et modifie ainsi la relation exprimée par ἐκ.
  - severity: low
    issue: « Tu verras » reformule le second impératif comme une conséquence future.
    rationale: Cette tournure est idiomatique, mais « constate » maintient plus exactement la double injonction ἐραύνησον καὶ ἴδε.
  revised_text: 'Ils lui répondirent : « Tu n’es tout de même pas, toi aussi, de Galilée ? Cherche et constate qu’aucun prophète ne surgit de Galilée.[a] »'
