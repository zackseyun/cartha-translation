  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ; ἐραύνησον καὶ ἴδε ὅτι ⸂ἐκ τῆς Γαλιλαίας προφήτης⸃ οὐκ ⸀ἐγείρεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: fr
  text: 'Ils lui répondirent : « Tu n’es tout de même pas, toi aussi, de Galilée ? Cherche et constate qu’aucun prophète ne surgit de Galilée.[a] »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aucun prophète n’est suscité de Galilée » ; le grec peut aussi évoquer le fait que Dieu suscite les prophètes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Ils lui répondirent
  rationale: En français naturel, « répondirent et dirent » serait inutilement redondant. « Ils lui répondirent » rend clairement la formule narrative johannique et son destinataire.
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: Serais-tu, toi aussi, de Galilée ?
  rationale: Le conditionnel interrogatif et « toi aussi » rendent naturellement le ton incrédule et méprisant de la question introduite par μή, qui appelle une réponse négative.
- source_word: ἐραύνησον καὶ ἴδε
  choice: Fais des recherches et tu verras
  rationale: Cette formulation idiomatique conserve l’enchaînement de l’impératif d’enquête et du constat attendu.
- source_word: προφήτης
  choice: aucun prophète
  rationale: Le nom sans article désigne ici un prophète quelconque, et non spécifiquement « le Prophète » eschatologique.
- source_word: οὐκ ἐγείρεται
  choice: ne vient
  rationale: Dans ce contexte, ἐγείρεται évoque l’apparition ou l’émergence d’un prophète. « Ne vient » est naturel en français, tandis que la nuance possible d’une action divine est signalée en note.
theological_decisions:
- issue: Force rhétorique de la question négative
  choice: « Serais-tu, toi aussi, de Galilée ? »
  alternative: « Tu n’es tout de même pas, toi aussi, de Galilée ? »
  rationale: La formulation retenue exprime l’incrédulité et l’attente d’une réponse négative sans alourdir la phrase.
- issue: Sens de ἐγείρεται appliqué à un prophète
  choice: « ne vient »
  alternative: « n’est suscité »
  rationale: Le verbe peut désigner l’émergence d’un prophète tout en laissant entendre que Dieu le suscite. Le texte principal privilégie le français courant, et la note conserve cette nuance théologique possible.
translation_notes:
  register: Français international moderne, direct et digne. Le discours garde le ton polémique des interlocuteurs sans archaïsme. Le conditionnel interrogatif transmet leur incrédulité.
