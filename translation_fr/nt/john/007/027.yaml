id: JHN.7.27
reference: John 7:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: fr
  text: Mais nous savons d’où vient cet homme ; quand le Messie[a] viendra, personne ne sait d’où il vient.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ».'
    reason: Signale la traduction française traditionnelle et lexicalement transparente du titre grec χριστός.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Introduit directement le contraste avec ce qui précède, dans un français naturel.
- source_word: τοῦτον
  choice: cet homme
  rationale: Le démonstratif désigne concrètement Jésus; « cet homme » est plus naturel ici que « celui-ci ».
- source_word: οἴδαμεν
  choice: nous savons
  rationale: Rend simplement la connaissance affirmée par les interlocuteurs.
- source_word: πόθεν ἐστίν
  choice: d’où il vient
  rationale: Exprime idiomatiquement l’origine en français et permet de conserver la répétition dans les deux propositions.
- source_word: ὁ δὲ χριστός
  choice: Or, … le Messie
  rationale: « Messie » rend Χριστός comme titre de la figure attendue; « Or » marque le nouveau contraste sans lourdeur.
- source_word: ὅταν ἔρχηται
  choice: quand … viendra
  rationale: Rend l’éventualité future attendue exprimée par ὅταν avec le subjonctif.
- source_word: οὐδεὶς γινώσκει
  choice: personne ne sait
  rationale: Traduction claire et directe de la négation universelle et du verbe de connaissance.
theological_decisions:
- issue: Traduction de Χριστός comme titre
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette parole de la foule, Χριστός désigne la figure messianique attendue plutôt qu’un nom propre.
- issue: Affirmation de la foule au sujet de l’origine du Messie
  choice: La rapporter sans l’expliquer ni l’approuver
  alternative: Développer par une précision théologique sur l’origine du Messie
  rationale: Le texte rapporte l’opinion des interlocuteurs; la traduction en préserve la tension sans en faire une affirmation du narrateur.
- issue: Temps de γινώσκει dans la seconde proposition
  choice: personne ne sait
  alternative: personne ne saura
  rationale: Le présent grec énonce la croyance générale de la foule; le présent français conserve cette nuance malgré la proposition temporelle au futur.
translation_notes:
  register: Français international moderne, courant et digne. La répétition « d’où il vient » conserve le parallélisme grec; la ponctuation en deux phrases évite un point-virgule plus littéraire.
