source:
  edition: SBLGNT
  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: fr
  text: 'Les gardes vinrent donc trouver les grands prêtres et les pharisiens. Ceux-ci leur dirent : « Pourquoi ne l’avez-vous pas amené[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Pourquoi ne l’avez-vous pas conduit ici ? » Le verbe grec peut signifier « conduire » ou « amener » ; dans ce contexte, les gardes avaient été envoyés pour arrêter Jésus et le présenter aux autorités.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la suite et la conséquence du récit précédent ; « donc » en conserve naturellement la valeur.
- source_word: ὑπηρέται
  choice: les gardes
  rationale: Dans ce contexte, il s’agit des hommes envoyés par les autorités pour arrêter Jésus. « Gardes » exprime leur fonction sans les réduire à de simples serviteurs.
- source_word: ἀρχιερεῖς
  choice: les grands prêtres
  rationale: Désignation française courante du groupe des principales autorités sacerdotales.
- source_word: Φαρισαίους
  choice: les pharisiens
  rationale: Transcription française usuelle du nom de ce groupe juif.
- source_word: ἐκεῖνοι
  choice: Ceux-ci
  rationale: Le démonstratif grec, plus marqué qu’un simple pronom, renvoie aux grands prêtres et aux pharisiens. « Ceux-ci » préserve cette précision tout en restant naturel.
- source_word: Διὰ τί
  choice: Pourquoi
  rationale: Équivalent interrogatif direct et idiomatique.
- source_word: ἠγάγετε
  choice: ne l’avez-vous pas amené
  rationale: Le passé composé convient à cette question portant sur la mission qui vient de s’achever. « Amener » exprime naturellement le fait attendu de conduire Jésus auprès des autorités, tout en laissant en note le sens plus littéral de « conduire ».
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom objet renvoie à Jésus, clairement identifiable dans le contexte.
theological_decisions: []
translation_notes:
  register: Français international moderne, sobre et digne. « Vinrent trouver » rend naturellement le mouvement vers les autorités sans ajouter explicitement l’idée de retour, absente du verbe grec. Le démonstratif « Ceux-ci » évite toute ambiguïté sur les locuteurs.
