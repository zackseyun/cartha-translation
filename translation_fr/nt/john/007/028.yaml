id: JHN.7.28
reference: John 7:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: fr
  text: 'Alors Jésus, qui enseignait dans le Temple, s’écria : « Vous me connaissez et vous savez d’où je viens[a]. Mais je ne suis pas venu de moi-même[b] : celui qui m’a envoyé est véritable[c], celui que vous ne connaissez pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Cette déclaration peut être entendue comme ironique ou provocatrice dans le contexte ; le grec reste cependant formulé comme une affirmation.
    reason: alternative_reading
  - marker: b
    text: « De moi-même » peut aussi se traduire par « de ma propre initiative ».
    reason: lexical_alternative
  - marker: c
    text: Ou « vrai » ; le terme peut aussi évoquer ce qui est authentique ou réel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: s’écria
  rationale: Rend une prise de parole forte et publique sans suggérer nécessairement la détresse.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le Temple
  rationale: Ἱερόν désigne ici l’ensemble du domaine du Temple; « dans le Temple » est naturel en français et n’implique pas le sanctuaire intérieur.
- source_word: διδάσκων ... καὶ λέγων
  choice: 'qui enseignait ... :'
  rationale: La tournure française intègre naturellement les deux participes et présente les paroles citées comme le contenu de l’enseignement proclamé.
- source_word: Κἀμὲ οἴδατε καὶ οἴδατε
  choice: Vous me connaissez et vous savez
  rationale: La distinction française entre connaître une personne et savoir un fait convient aux deux compléments tout en conservant le parallélisme.
- source_word: πόθεν εἰμί
  choice: d’où je suis
  rationale: Formulation concise qui préserve l’ambiguïté entre origine apparente, géographique, et origine plus profonde.
- source_word: ἀπ’ ἐμαυτοῦ
  choice: de moi-même
  rationale: Conserve la métaphore de provenance et le thème johannique de la mission reçue, sans réduire le sens à la seule initiative personnelle.
- source_word: οὐκ ἐλήλυθα
  choice: je ne suis pas venu
  rationale: Le passé composé français rend naturellement le parfait grec et son résultat présent.
- source_word: ἀληθινὸς
  choice: véritable
  rationale: « Véritable » peut exprimer ce qui est réel, authentique et digne de foi, sans limiter le terme au seul fait de dire vrai.
- source_word: ὁ πέμψας με
  choice: celui qui m’a envoyé
  rationale: Préserve l’agent personnel sans ajouter explicitement « le Père », absent de cette proposition.
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: et vous, vous ne le connaissez pas
  rationale: La dislocation avec « vous » fait entendre l’emphase du pronom grec ὑμεῖς et conserve l’accusation directe.
theological_decisions:
- issue: Valeur déclarative, ironique ou provocatrice de « Vous me connaissez et vous savez d’où je suis »
  choice: Conserver une déclaration dans le texte principal
  alternative: Traduire comme une question rhétorique ou ajouter explicitement une nuance ironique
  rationale: La syntaxe grecque est déclarative, tandis que le contexte autorise une lecture ironique ou provocatrice. La traduction maintient cette tension et la note la signale sans la résoudre.
- issue: Portée de l’origine de Jésus
  choice: 'Employer une formulation ouverte : « d’où je suis » et « de moi-même »'
  alternative: Préciser une origine uniquement géographique ou explicitement céleste
  rationale: Le texte permet la superposition johannique de l’origine humaine apparente et de la mission divine; aucune précision interprétative n’est ajoutée.
- issue: Identité de celui qui a envoyé Jésus
  choice: Garder « celui qui m’a envoyé »
  alternative: Ajouter « le Père »
  rationale: Le référent est éclairé par le contexte de l’Évangile, mais le grec ne le nomme pas explicitement dans ce verset.
- issue: Sens de ἀληθινός appliqué à celui qui envoie
  choice: « véritable »
  alternative: « vrai », « digne de foi » ou « véridique »
  rationale: « Véritable » préserve la possibilité d’une nuance d’authenticité ou de réalité, caractéristique de l’usage johannique, sans exclure la fiabilité.
translation_notes:
  register: Français international moderne, digne et accessible. « Temple » prend une majuscule pour désigner le Temple de Jérusalem. La phrase est légèrement restructurée pour une proclamation naturelle en français, tout en conservant l’emphase, l’ambiguïté de l’origine et le contraste théologique du grec.
