id: JHN.7.10
reference: John 7:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: fr
  text: Mais lorsque ses frères furent montés à la fête, alors lui aussi y monta, non pas ouvertement, mais comme en secret[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « mais en secret ». L’expression grecque signifie littéralement « mais comme en secret », ce qui peut légèrement atténuer l’affirmation.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: Mais lorsque
  rationale: Ὡς introduit ici une proposition temporelle, tandis que δέ marque une transition avec une légère nuance de contraste par rapport au contexte précédent.
- source_word: ἀνέβησαν ... ἀνέβη
  choice: furent montés ... monta
  rationale: Le verbe ἀναβαίνω signifie « monter ». Le passé antérieur marque naturellement en français soutenu l’antériorité de la montée des frères, et « monta » conserve l’idée géographique et religieuse de monter à Jérusalem.
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: ses frères
  rationale: Dans le contexte immédiat, ἀδελφοί désigne les frères de Jésus; le masculin précis du grec est conservé sans élargissement interprétatif.
- source_word: εἰς τὴν ἑορτήν
  choice: à la fête
  rationale: ἑορτή désigne la fête juive mentionnée dans le contexte, celle des Tentes. « La fête » est concis, naturel et fidèle à l’article défini grec.
- source_word: τότε καὶ αὐτὸς
  choice: alors lui aussi
  rationale: τότε indique la succession temporelle et καὶ αὐτός souligne que Jésus monta à son tour.
- source_word: οὐ φανερῶς
  choice: non pas ouvertement
  rationale: φανερῶς signifie « ouvertement » ou « publiquement ». La formulation retenue établit clairement le contraste avec la proposition suivante.
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: mais comme en secret
  rationale: Cette traduction conserve le ὡς grec, qui qualifie légèrement l’expression. Le tour est moins lisse que « en secret », mais il préserve l’ambiguïté réelle du texte.
theological_decisions:
- issue: Rapport entre l’action de Jésus et sa déclaration antérieure concernant sa montée à la fête
  choice: Dire simplement qu’il monta après ses frères et non ouvertement
  alternative: Résoudre la tension en laissant entendre qu’il avait changé d’avis ou qu’il avait seulement refusé une certaine manière de monter
  rationale: Le grec ne fournit pas ici d’explication harmonisante. La traduction maintient donc la tension narrative entre cette action et les paroles précédentes de Jésus.
translation_notes:
  register: Français moderne, digne et accessible. Le passé antérieur « furent montés » convient après « lorsque » pour marquer la succession des actions; « y monta » évite de répéter lourdement « à la fête ». L’expression inhabituelle « comme en secret » est maintenue afin de préserver la nuance de ὡς, avec une note proposant la formulation française plus courante.
