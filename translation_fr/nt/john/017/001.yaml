id: JHN.17.1
reference: John 17:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: fr
  text: 'Après avoir dit cela, Jésus leva les yeux vers le ciel et dit : « Père, l’heure est venue. Glorifie ton Fils, afin que le Fils te glorifie. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ἐλάλησεν
  choice: Après avoir dit cela
  rationale: Le démonstratif neutre pluriel renvoie au discours précédent. En français, « après avoir dit cela » rend naturellement l’antériorité du verbe principal suivie du geste et de la prière, sans modifier le contenu.
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: leva les yeux
  rationale: Le participe aoriste décrit le geste qui précède immédiatement la parole. « Lever les yeux » est l’expression française naturelle et conserve l’image physique.
- source_word: εἰς τὸν οὐρανόν
  choice: vers le ciel
  rationale: La préposition εἰς marque ici la direction ; « vers le ciel » l’exprime avec précision en français.
- source_word: Πάτερ
  choice: Père
  rationale: Le vocatif ne comporte aucun possessif ; « Père » conserve cette adresse directe sans ajouter « mon ».
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: l’heure est venue
  rationale: Le parfait exprime l’arrivée désormais accomplie de l’heure décisive. « L’heure » préserve le motif johannique plutôt que de l’interpréter par « le moment ».
- source_word: δόξασόν
  choice: Glorifie
  rationale: « Glorifier » maintient le poids théologique et révélateur de δοξάζω ainsi que la répétition structurante du verbe.
- source_word: σου τὸν υἱόν
  choice: ton Fils
  rationale: Le génitif possessif se rend naturellement par « ton ». La majuscule signale l’emploi titulaire en référence à Jésus.
- source_word: ἵνα
  choice: afin que
  rationale: « Afin que » exprime clairement la visée de la proposition sans trancher artificiellement entre les nuances étroitement liées de but et de résultat.
- source_word: ὁ υἱὸς
  choice: le Fils
  rationale: L’article grec est conservé et le passage de « ton Fils » à « le Fils » reste perceptible.
- source_word: δοξάσῃ σέ
  choice: te glorifie
  rationale: Après ἵνα, le subjonctif français exprime naturellement la finalité. La reprise de « glorifier » conserve la symétrie du grec.
theological_decisions:
- issue: La glorification réciproque du Père et du Fils
  choice: « Glorifie ton Fils, afin que le Fils te glorifie »
  alternative: « Honore ton Fils, afin qu’il t’honore »
  rationale: La formulation retenue préserve la réciprocité, la répétition de δοξάζω et la tension théologique du texte, sans explication doctrinale ajoutée.
- issue: Majuscule à « Fils »
  choice: « Fils » avec une majuscule
  alternative: « fils » avec une minuscule
  rationale: Dans ce contexte, le terme désigne Jésus dans sa relation particulière au Père. La majuscule facilite la reconnaissance de cet emploi titulaire sans changer le sens lexical.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque ; le tutoiement entre le Fils et le Père est idiomatique et relationnel. Aucun ajout explicatif ni particularisme confessionnel.
