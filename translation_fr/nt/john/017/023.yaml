id: JHN.17.23
reference: John 17:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: fr
  text: Moi en eux et toi en moi, afin qu’ils soient conduits à une parfaite unité[a], afin que le monde sache que tu m’as envoyé et que tu les as aimés tout comme tu m’as aimé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « rendus parfaits en un » ou « amenés à l’accomplissement dans l’unité ».
    reason: 'Alternative lexicale pour τετελειωμένοι εἰς ἕν : le participe parfait passif évoque un état résultant d’une action achevée, et εἰς ἕν l’aboutissement à l’unité.'
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: en eux / en moi
  rationale: Conserve la préposition « en » et le langage johannique de l’habitation réciproque, sans l’affaiblir par « parmi ».
- source_word: τετελειωμένοι
  choice: rendus parfaits
  rationale: Le participe parfait passif exprime un état résultant d’une action menée à son terme. « Rendus parfaits » maintient à la fois la voix passive et les nuances d’accomplissement et de transformation.
- source_word: εἰς ἕν
  choice: dans l’unité
  rationale: Cette formulation française naturelle exprime le résultat visé, à savoir qu’ils soient un, sans reproduire artificiellement « en un ».
- source_word: γινώσκῃ
  choice: sache
  rationale: Rend naturellement en français le présent du subjonctif dans la proposition de but, sans ajouter l’idée plus interprétative d’un commencement de connaissance.
- source_word: κόσμος
  choice: le monde
  rationale: Conserve le terme johannique dans toute son ampleur et évite une explicitation interprétative telle que « les gens du monde ».
- source_word: ἀπέστειλας
  choice: tu m’as envoyé
  rationale: Rendu direct et cohérent du verbe ἀποστέλλω, qui préserve le thème johannique de la mission du Fils.
- source_word: ἠγάπησας
  choice: tu les as aimés / tu m’as aimé
  rationale: Conserve la répétition du même verbe dans les deux membres de la phrase.
- source_word: καθὼς
  choice: tout comme
  rationale: Marque clairement la comparaison réelle et forte du grec, dans un français courant et digne, sans en préciser interprétativement la portée.
theological_decisions:
- issue: Portée de la comparaison entre l’amour du Père pour les disciples et son amour pour le Fils
  choice: tout comme tu m’as aimé
  alternative: comme tu m’as aimé ; d’un amour semblable à celui dont tu m’as aimé
  rationale: La comparaison est rendue directement, sans atténuation ni explication doctrinale, afin de préserver toute la force et la tension théologiques de καθὼς.
- issue: Sens de τετελειωμένοι dans le contexte de l’unité
  choice: rendus parfaits dans l’unité
  alternative: amenés à l’accomplissement dans l’unité ; conduits à une parfaite unité
  rationale: La traduction conserve la forme passive et la notion d’achèvement, tout en rattachant explicitement cette perfection à l’unité visée dans le contexte plutôt qu’à une affirmation isolée de perfection morale absolue.
translation_notes:
  register: Français international moderne, naturel et digne. L’ouverture parallèle « moi en eux et toi en moi » conserve la structure concise du grec et son langage d’habitation réciproque. La répétition de « afin que » maintient les deux propositions de but.
