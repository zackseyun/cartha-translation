id: JHN.17.2
reference: John 17:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: fr
  text: de même que tu lui as donné autorité sur toute chair[a], afin qu’à tous ceux que tu lui as donnés[b], il donne la vie éternelle.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sur toute l’humanité ». Le grec dit littéralement « sur toute chair », expression biblique désignant les êtres humains.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « tout ce que tu lui as donné » ; le grec emploie un neutre singulier collectif pour désigner les personnes données au Fils.
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: de même que
  rationale: Cette locution conserve clairement la valeur comparative et le lien avec la demande du verset précédent.
- source_word: ἔδωκας
  choice: tu lui as donné
  rationale: Le passé composé rend naturellement en français l’acte accompli par lequel le Père a accordé cette autorité au Fils.
- source_word: ἐξουσίαν
  choice: autorité
  rationale: « Autorité » exprime un droit et une compétence accordés, plutôt qu’une simple puissance.
- source_word: πάσης σαρκός
  choice: sur toute chair
  rationale: Cette formulation conserve l’expression biblique grecque et sa portée universelle; son sens idiomatique est précisé en note.
- source_word: ἵνα
  choice: afin que
  rationale: La locution marque nettement le but ou le résultat visé, dans un registre français digne et naturel.
- source_word: πᾶν ὃ
  choice: à tous ceux que
  rationale: Le neutre singulier grec désigne collectivement les personnes données au Fils. Le français emploie naturellement le pluriel personnel, en accord avec αὐτοῖς.
- source_word: δέδωκας
  choice: tu lui as donnés
  rationale: Le passé composé convient au parfait grec, qui présente un don accompli dont les effets demeurent.
- source_word: δώσῃ
  choice: il donne
  rationale: Après « afin que », le subjonctif français exprime naturellement le but porté par le subjonctif grec, sans introduire une incertitude absente du contexte.
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: Expression johannique consacrée et exacte, évoquant à la fois une vie sans fin et la vie propre à l’âge à venir.
theological_decisions:
- issue: Portée de « toute chair » et référent de « tous ceux que tu lui as donnés »
  choice: Conserver l’étendue universelle de l’autorité du Fils tout en distinguant le groupe auquel il donne la vie éternelle.
  alternative: Traduire « toute chair » par « toute l’humanité » ou rendre littéralement πᾶν ὃ par « tout ce que tu lui as donné ».
  rationale: Le grec distingue l’autorité sur toute chair des personnes données par le Père au Fils. La traduction maintient cette tension sans l’intégrer à un système doctrinal particulier.
translation_notes:
  register: Français international moderne, clair et digne. Le tutoiement correspond à l’adresse directe de Jésus au Père. L’ordre « à tous ceux que tu lui as donnés, il donne » suit de près la structure grecque et évite de rattacher ce groupe à « toute chair ».
