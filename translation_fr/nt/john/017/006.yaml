reference: John 17:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: fr
  text: J’ai fait connaître ton nom[a] aux hommes que tu m’as donnés du milieu du monde[b]. Ils étaient à toi, et tu me les as donnés, et ils ont gardé ta parole[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: « Ton nom » désigne ici l’identité et le caractère révélés de Dieu, et non seulement une appellation.
    reason: cultural_note
  - marker: b
    text: 'Ou : « du monde ». Le grec exprime qu’ils ont été donnés à Jésus en provenance du monde.'
    reason: lexical_alternative
  - marker: c
    text: 'Ou : « ils ont observé ta parole »; le verbe grec peut aussi impliquer qu’ils lui ont obéi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: J’ai fait connaître
  rationale: Le verbe φανερόω exprime ici l’action de rendre manifeste ou de faire connaître. Cette formulation est naturelle en français et convient à l’objet « ton nom », tout en conservant l’idée de révélation.
- source_word: τὸ ὄνομα
  choice: ton nom
  rationale: Le texte dit littéralement « ton nom ». Dans ce contexte johannique, l’expression évoque l’identité et le caractère révélés de Dieu, mais la formulation concrète est conservée afin de ne pas réduire sa portée théologique.
- source_word: τοῖς ἀνθρώποις
  choice: aux hommes
  rationale: ἄνθρωποι peut désigner les êtres humains ou les gens en général. Ici, le référent immédiat est le groupe des disciples de Jésus, composé d’hommes; « aux hommes » préserve cette référence contextuelle.
- source_word: οὓς ἔδωκάς μοι
  choice: que tu m’as donnés
  rationale: Le passé composé convient au français moderne et présente le don accompli dont les effets demeurent dans la situation évoquée.
- source_word: ἐκ τοῦ κόσμου
  choice: en les prenant du milieu du monde
  rationale: Cette formulation rend explicitement le mouvement de provenance exprimé par ἐκ sans suggérer qu’ils ne se trouvent plus physiquement dans le monde; elle indique qu’ils ont été tirés de son sein.
- source_word: σοὶ ἦσαν
  choice: Ils étaient à toi
  rationale: Cette expression reste proche de la structure grecque, avec une sobriété adaptée à la prière.
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: et tu me les as donnés
  rationale: La tournure suit l’ordre naturel du français tout en conservant l’affirmation que le Père les a donnés au Fils.
- source_word: τὸν λόγον σου
  choice: ta parole
  rationale: « Parole » restitue λόγος dans un registre biblique naturel et maintient sa richesse de sens, qui peut inclure message et enseignement.
- source_word: τετήρηκαν
  choice: ils ont gardé
  rationale: Le parfait grec décrit une action accomplie dont le résultat demeure. « Ils ont gardé » conserve la métaphore et la gamme de sens de τηρέω, sans la réduire à la seule obéissance.
theological_decisions:
- issue: Sens de « ton nom » dans la théologie johannique
  choice: Conserver « ton nom » dans le texte principal
  alternative: Paraphraser par « qui tu es » ou « ton caractère »
  rationale: L’expression renvoie à l’identité, au caractère et à la présence révélés du Père, mais le grec emploie le terme concret « nom ». Le conserver maintient la profondeur et l’ouverture de l’expression.
- issue: Référent et genre de τοῖς ἀνθρώποις
  choice: Traduire par « aux hommes »
  alternative: Traduire par « aux personnes » ou « à ceux »
  rationale: Le nom grec peut être générique, mais le contexte immédiat vise les disciples masculins présents dans le récit. La traduction retient cette référence sans prétendre que le terme est toujours marqué quant au sexe.
- issue: Portée doctrinale du don des disciples par le Père au Fils
  choice: Préserver simplement l’affirmation du don
  alternative: Expliciter ce don selon un système particulier de l’élection ou de la réponse humaine
  rationale: Le verset affirme que les disciples appartenaient au Père et qu’il les a donnés au Fils, sans exposer ici le mécanisme complet de ce don. La traduction ne tranche donc pas les débats doctrinaux ultérieurs.
- issue: Sens de « garder » la parole
  choice: Conserver « ils ont gardé ta parole »
  alternative: Interpréter par « ils ont obéi à ta parole »
  rationale: 'L’obéissance peut être impliquée, mais τηρέω a une portée plus large: garder, observer, préserver. La traduction conserve cette richesse.'
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé est privilégié pour rendre naturellement les actions accomplies. La syntaxe demeure solennelle sans archaïsmes; les formulations littérales porteuses de sens théologique, notamment « ton nom », « à toi » et « gardé ta parole », sont conservées.
