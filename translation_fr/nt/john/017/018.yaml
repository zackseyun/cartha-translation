id: JHN.17.18
reference: John 17:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: fr
  text: Tout comme tu m’as envoyé dans le monde, moi aussi, je les ai envoyés dans le monde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: Tout comme
  rationale: Introduit clairement la comparaison entre l’envoi de Jésus par le Père et celui des disciples par Jésus, dans un français naturel.
- source_word: ἐμὲ
  choice: m’
  rationale: Complément d’objet direct de ἀπέστειλας. Le pronom disjoint grec est mis en relief; la structure parallèle française, complétée par « moi aussi », rend cette insistance sans lourdeur.
- source_word: ἀπέστειλας / ἀπέστειλα
  choice: as envoyé / ai envoyés
  rationale: Le même verbe « envoyer » dans les deux propositions préserve le parallélisme missionnel voulu par le grec, sans ajouter l’interprétation plus précise de « donner une mission ».
- source_word: εἰς τὸν κόσμον
  choice: dans le monde
  rationale: « Dans » exprime naturellement en français le mouvement vers la sphère où s’exerce la mission et conserve la portée spatiale et théologique de l’expression johannique.
- source_word: κἀγὼ
  choice: moi aussi
  rationale: Rend à la fois la valeur additive de καί et l’insistance de ἐγώ, tout en maintenant clairement le parallèle entre le Père et Jésus.
- source_word: αὐτοὺς
  choice: les
  rationale: Pronom objet naturel renvoyant aux disciples dans le contexte.
- source_word: κόσμον
  choice: monde
  rationale: Terme johannique central; « monde » conserve sa polysémie et la tension entre lieu de la mission, humanité et ordre souvent opposé à Dieu.
theological_decisions:
- issue: Parallèle entre l’envoi du Fils par le Père et l’envoi des disciples par le Fils
  choice: Conserver « envoyé… envoyés » dans les deux propositions.
  alternative: Varier avec « envoyé… chargés d’une mission » ou « mandatés ».
  rationale: La répétition traduit l’analogie affirmée par le texte sans prétendre que le statut ou la mission des disciples est identique à celui du Fils.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé composé est naturel dans ce discours et restitue les deux aoristes. « Tout comme » marque nettement la comparaison; « moi aussi » conserve l’insistance et le parallélisme du grec.
