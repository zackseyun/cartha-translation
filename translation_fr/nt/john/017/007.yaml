  text: νῦν ἔγνωκαν ὅτι πάντα ὅσα ⸀δέδωκάς μοι παρὰ σοῦ ⸀εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: fr
  text: Maintenant, ils ont compris que tout ce que tu m’as donné vient de toi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « tout ce que tu m’as donné est de toi ».'
    reason: Alternative lexicale permettant de rendre plus littéralement εἰσιν tout en conservant l’idée d’origine portée par παρὰ σοῦ.
lexical_decisions:
- source_word: νῦν
  choice: Maintenant
  rationale: Marque l’étape présente dans la compréhension des disciples, de manière concise et naturelle.
- source_word: ἔγνωκαν
  choice: ils ont compris
  rationale: Le parfait exprime ici une prise de conscience désormais acquise; « ont compris » rend naturellement en français le processus et son résultat présent.
- source_word: πάντα ὅσα
  choice: tout ce que
  rationale: Cette tournure idiomatique française exprime la totalité tout en conservant la valeur relative de ὅσα.
- source_word: δέδωκάς μοι
  choice: tu m’as donné
  rationale: Le passé composé convient au parfait grec et maintient la portée actuelle de ce que le Père a donné à Jésus.
- source_word: παρὰ σοῦ εἰσιν
  choice: vient de toi
  rationale: παρά avec le génitif indique la source ou l’origine. Le singulier s’accorde naturellement avec le collectif « tout ce que ».
theological_decisions:
- issue: Rapport entre les dons faits au Fils et leur origine
  choice: « tout ce que tu m’as donné vient de toi »
  alternative: « tout ce que tu m’as donné est de toi »
  rationale: La formulation affirme que le Père est la source de tout ce que Jésus a reçu, sans développer ni résoudre davantage la portée théologique de cette relation.
translation_notes:
  register: Français international moderne, naturel et digne. « Ils ont compris » est plus idiomatique que « ils sont parvenus à connaître », tandis que « vient de toi » explicite sans excès la relation d’origine.
