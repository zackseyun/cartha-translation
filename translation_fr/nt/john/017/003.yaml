id: JHN.17.3
reference: John 17:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: fr
  text: Or, la vie éternelle, c’est qu’ils te connaissent, toi, le seul vrai Dieu, et Jésus le Messie[a], que tu as envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, selon la traduction traditionnelle : « Jésus-Christ ». Le grec Χριστός peut fonctionner comme un titre (« Messie ») ou, dans certains contextes, comme une désignation proche d’un nom (« Christ »).'
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ
  choice: Or, la vie éternelle, c’est
  rationale: Cette tournure française naturelle conserve la valeur connective de δέ et introduit l’explication de ce qu’est la vie éternelle, sans accentuer artificiellement une opposition.
- source_word: ἵνα γινώσκωσι
  choice: qu’ils te connaissent
  rationale: Après « c’est », la proposition introduite par ἵνα définit ici le contenu de la vie éternelle. Le présent du subjonctif grec évoque une connaissance vivante et continue; le subjonctif français convient naturellement à cette construction.
- source_word: σὲ τὸν μόνον ἀληθινὸν θεὸν
  choice: toi, le seul vrai Dieu
  rationale: Le pronom tonique « toi » met clairement en apposition l’expression « le seul vrai Dieu » et reproduit l’adresse directe au Père.
- source_word: καὶ ὃν ἀπέστειλας
  choice: et … que tu as envoyé
  rationale: La coordination et la proposition relative sont conservées sans ajouter d’explication théologique. Le passé composé rend naturellement l’aoriste dans ce contexte.
- source_word: Ἰησοῦν Χριστόν
  choice: Jésus le Messie
  rationale: Χριστός garde ici sa valeur de titre messianique. « Jésus le Messie » l’exprime en français idiomatique, tandis que la traduction traditionnelle « Jésus-Christ » est signalée en note.
theological_decisions:
- issue: Rapport entre « le seul vrai Dieu » et Jésus
  choice: Conserver l’adresse au Père comme « le seul vrai Dieu » et distinguer Jésus comme celui qu’il a envoyé.
  alternative: Ajouter une formulation explicitant la relation trinitaire ou reformuler pour atténuer la distinction syntaxique.
  rationale: Le verset doit garder sa formulation propre et sa tension théologique sans faire intervenir dans la traduction une résolution doctrinale extérieure au texte.
- issue: Valeur de Χριστόν
  choice: Messie
  alternative: Christ
  rationale: Le sens titulaire demeure perceptible dans ce contexte. La forme traditionnelle, devenue plus proche d’une désignation nominale en français, reste proposée en note.
translation_notes:
  register: Français international actuel, digne et accessible. La construction disloquée « toi, le seul vrai Dieu » est naturelle en français et clarifie l’apposition grecque. La virgule avant « que tu as envoyé » maintient une lecture fluide de la proposition relative.
