id: JHN.17.25
reference: John 17:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: fr
  text: Père juste, le monde[a] ne t’a pas connu, mais moi, je t’ai connu, et ceux-ci ont reconnu que tu m’as envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Chez Jean, « le monde » peut désigner l’humanité, particulièrement en tant qu’elle demeure éloignée de Dieu.
    reason: Précision sur la portée contextuelle d’un terme théologiquement chargé, sans en réduire le sens dans le texte principal.
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: Père juste
  rationale: Le vocatif est rendu par une adresse directe, naturelle en français moderne. « Juste » conserve ici la portée morale de δίκαιος sans limiter le terme à l’impartialité judiciaire.
- source_word: καὶ ὁ κόσμος … ἐγὼ δέ
  choice: le monde… mais moi
  rationale: Le premier καί peut prendre une nuance concessive, mais la construction grecque met surtout en contraste le monde et Jésus au moyen de δέ. La coordination contrastive française reste naturelle sans imposer une relation logique plus précise que le texte.
- source_word: ὁ κόσμος
  choice: le monde
  rationale: Ce choix garde l’expression johannique dans toute son ampleur, sans la réduire explicitement à l’humanité ni à un système opposé à Dieu.
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: n’a pas connu / je t’ai connu / ont reconnu
  rationale: Le passé composé exprime naturellement en français des faits accomplis qui demeurent pertinents dans la prière. « Reconnu » dans la dernière proposition rend idiomatiquement la prise de conscience portant sur le contenu introduit par ὅτι, sans faire de la connaissance une simple information abstraite.
- source_word: ἐγὼ
  choice: moi, je
  rationale: La dislocation française restitue l’insistance du pronom sujet grec exprimé et souligne le contraste avec « le monde ».
- source_word: οὗτοι
  choice: ceux qui sont ici
  rationale: Cette formulation conserve la valeur démonstrative de οὗτοι tout en évitant la raideur de « ceux-ci » employé seul et sans ajouter l’identification interprétative « disciples ».
- source_word: σύ με ἀπέστειλας
  choice: tu m’as envoyé
  rationale: Le passé composé est la forme narrative naturelle en français courant et conserve l’accent mis par σύ sur le Père comme auteur de l’envoi, perceptible dans le contexte et l’ordre de la proposition.
theological_decisions:
- issue: Portée de δίκαιε appliqué au Père
  choice: Père juste
  alternative: Père qui es juste
  rationale: La formulation adjectivale directe garde la densité de l’adresse grecque et affirme la justice morale du Père sans développer le sens en paraphrase.
- issue: Sens de κόσμος chez Jean
  choice: le monde
  alternative: les hommes de ce monde
  rationale: « Le monde » préserve l’ambiguïté féconde entre l’humanité et l’ordre humain éloigné de Dieu, au lieu de trancher dans le texte principal.
- issue: Relation logique introduite par le premier καί
  choice: coordination suivie du contraste « mais moi »
  alternative: bien que le monde ne t’ait pas connu
  rationale: La lecture concessive est possible, mais n’a pas besoin d’être explicitée. La structure retenue reproduit plus directement la tension entre l’ignorance du monde et la connaissance que Jésus a du Père.
- issue: Nature de la connaissance exprimée par γινώσκω
  choice: connu / reconnu
  alternative: appris à connaître
  rationale: Le texte peut viser une connaissance relationnelle autant que cognitive. La traduction n’ajoute pas explicitement « intimement » ou « véritablement », ce qui préserverait moins bien cette amplitude.
translation_notes:
  register: Français international moderne, digne et oralement fluide. Le tutoiement suit l’usage biblique français courant dans l’adresse au Père. La phrase conserve le contraste marqué du grec tout en évitant aussi bien l’archaïsme que la paraphrase confessionnelle.
