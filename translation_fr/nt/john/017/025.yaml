    rationale: Le grec οὗτοι désigne « ceux-ci / ces gens-ci » sans indiquer un lieu. La mention spatiale est donc une précision non attestée par le texte source.
  revised_text: Père juste, le monde[a] ne t’a pas connu, mais moi, je t’ai connu, et ceux-ci ont reconnu que tu m’as envoyé.
