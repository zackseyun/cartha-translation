id: JHN.17.21
reference: John 17:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: fr
  text: afin que tous soient un[a], tout comme toi, Père, tu es en moi et moi, je suis en toi ; afin qu’eux aussi soient en nous[b], pour que le monde croie[c] que tu m’as envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « afin que tous soient unis ». Le grec dit plus littéralement « afin que tous soient un » : cette formulation conserve toute la portée de leur unité sans la limiter à un aspect particulier.'
    reason: lexical_alternative
  - marker: b
    text: La préposition « en », répétée dans « en moi », « en toi » et « en nous », appartient au langage johannique de présence réciproque et de participation ; elle exprime davantage qu’une simple association.
    reason: cross_reference
  - marker: c
    text: Ou « en vienne à croire ». Le grec peut désigner la foi du monde sans préciser explicitement si l’accent porte sur le commencement de la foi ou sur sa continuité.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: afin que / pour que
  rationale: Les trois propositions introduites par ἵνα sont conservées. « Afin que » convient aux deux premières, tandis que « pour que » exprime naturellement en français la visée de la dernière sans effacer leur enchaînement.
- source_word: πάντες
  choice: tous
  rationale: Ce choix concis conserve la portée universelle du pluriel grec.
- source_word: ἓν
  choice: un
  rationale: Le terme grec, au neutre singulier, exprime l’unité sans en préciser la nature. « Un » préserve cette densité mieux qu’une formulation interprétative comme « unis » ou « d’accord ».
- source_word: καθὼς
  choice: tout comme
  rationale: Cette tournure marque clairement la comparaison entre l’unité des disciples et la relation du Père et du Fils.
- source_word: πάτερ
  choice: Père
  rationale: L’apostrophe directe est maintenue, avec sa portée relationnelle et théologique.
- source_word: ἐν ἐμοὶ … ἐν σοί
  choice: en moi… en toi
  rationale: La répétition de ἐν est rendue par « en », conformément au langage johannique de présence réciproque et de participation ; « avec » en affaiblirait la force.
- source_word: κἀγώ
  choice: et moi
  rationale: 'La coordination exprime naturellement la réciprocité : « et moi [je suis] en toi ». L’ellipse du verbe demeure intelligible en français.'
- source_word: καὶ αὐτοὶ
  choice: eux aussi
  rationale: La forme tonique « eux » et l’adverbe « aussi » conservent l’insistance et la valeur additive du grec.
- source_word: ἐν ἡμῖν
  choice: en nous
  rationale: La traduction littérale préserve le thème johannique de la participation ou de la demeure réciproque, sans le réduire à une simple association.
- source_word: κόσμος
  choice: le monde
  rationale: Cette expression conserve le terme johannique usuel ainsi que sa portée théologique et collective.
- source_word: πιστεύῃ
  choice: croie
  rationale: Le subjonctif présent après « pour que » rend directement le présent du subjonctif grec, sans imposer l’idée d’un commencement de la foi.
- source_word: ἀπέστειλας
  choice: tu m’as envoyé
  rationale: Le passé composé est la manière la plus naturelle en français moderne d’exprimer ici l’envoi accompli désigné par l’aoriste.
theological_decisions:
- issue: Nature de l’unité des croyants par rapport au Père et au Fils
  choice: Conserver « soient un » et « en nous » sans développement interprétatif.
  alternative: « soient tous unis » ou « soient un dans leurs intentions »
  rationale: Le texte compare l’unité des croyants à la relation du Père et du Fils, mais ne la définit pas comme une unité institutionnelle, morale ou métaphysique. La formulation retenue garde cette profondeur et cette tension sans introduire une précision doctrinale absente du grec.
- issue: Langage johannique de présence réciproque
  choice: Employer « en moi », « en toi » et « en nous ».
  alternative: « avec moi », « avec toi », « avec nous » ou « unis à nous »
  rationale: La répétition de ἐν structure le verset et porte une forte résonance johannique. La conserver évite de réduire la relation à la proximité ou de définir trop précisément le mode de participation.
translation_notes:
  register: Français international moderne, digne et accessible. La structure solennelle de la prière est conservée, notamment par la succession de « afin que » et « pour que ». « Soient un » est légèrement marqué par l’usage biblique, mais reste clair et permet de préserver l’ambiguïté voulue du grec.
