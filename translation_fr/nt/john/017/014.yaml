id: JHN.17.14
reference: John 17:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: fr
  text: Je leur ai donné ta parole, et le monde les a haïs parce qu’ils ne sont pas du monde[a], tout comme moi, je ne suis pas du monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne viennent pas du monde ». L’expression grecque emploie littéralement une préposition indiquant la provenance et peut évoquer l’origine ou l’appartenance.
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: ai donné
  rationale: Le passé composé rend naturellement en français l’action accomplie dont le résultat demeure dans la situation présente.
- source_word: λόγον
  choice: parole
  rationale: « Parole » convient à ce que le Père communique par Jésus et conserve le vocabulaire johannique ainsi que sa résonance théologique.
- source_word: κόσμος
  choice: monde
  rationale: « Monde » préserve l’ampleur du terme grec; dans ce contexte, l’hostilité mentionnée fait ressortir sa dimension d’ordre humain opposé à Jésus et aux disciples.
- source_word: ἐμίσησεν
  choice: a haïs
  rationale: Le passé composé exprime idiomatiquement en français l’hostilité manifestée et toujours pertinente au moment de la prière.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici la cause de la haine du monde.
- source_word: ἐκ τοῦ κόσμου
  choice: du monde
  rationale: Cette expression française naturelle peut indiquer l’origine ou l’appartenance et maintient la formulation johannique sans la réduire à une seule de ces nuances.
- source_word: καθὼς
  choice: comme
  rationale: « Comme » marque clairement et sobrement la comparaison entre le rapport des disciples au monde et celui de Jésus.
theological_decisions:
- issue: Rapport des disciples au monde comparé à celui de Jésus
  choice: « ils ne sont pas du monde, comme moi, je ne suis pas du monde »
  alternative: « ils ne viennent pas du monde, tout comme moi je ne viens pas du monde »
  rationale: La formulation retenue conserve l’analogie affirmée par le texte et laisse ouverte la tension entre origine et appartenance que porte ἐκ, sans ajouter d’explication métaphysique ou seulement sociologique.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise explicite « moi, je » restitue l’emphase de ἐγώ et clarifie la comparaison. Le passé composé convient à l’usage français actuel.
