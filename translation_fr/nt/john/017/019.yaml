id: JHN.17.19
reference: John 17:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: fr
  text: Et pour eux, je me consacre moi-même[a], afin qu’eux aussi soient consacrés dans la vérité[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « je me sanctifie moi-même ». Le même verbe grec est employé plus loin dans le verset pour « soient consacrés ».
    reason: lexical_alternative
  - marker: b
    text: Ou « en vérité ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: pour eux
  rationale: Avec le génitif, ὑπέρ exprime ici l’intérêt ou le bénéfice des disciples. « Pour eux » est naturel en français et n’impose pas une nuance substitutive plus forte que le grec.
- source_word: ἁγιάζω / ἡγιασμένοι
  choice: me consacre / soient consacrés
  rationale: Dans ce contexte, le verbe désigne la mise à part pour Dieu et pour une mission. Répéter « consacrer » dans les deux propositions conserve le lien lexical visible dans le grec, tout en évitant de suggérer que Jésus passerait de l’impureté à la sainteté morale.
- source_word: ἐμαυτόν
  choice: moi-même
  rationale: Le pronom réfléchi marque que Jésus accomplit volontairement cette consécration sur sa propre personne.
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure française exprime clairement la visée introduite par ἵνα.
- source_word: καὶ αὐτοὶ
  choice: eux aussi
  rationale: « Eux aussi » rend à la fois l’inclusion exprimée par καί et l’accent porté par αὐτοί.
- source_word: ἐν ἀληθείᾳ
  choice: dans la vérité
  rationale: La formule conserve la valeur de sphère ou de réalité de ἐν et laisse entendre le lien contextuel avec Jean 17.17, sans trancher entre une vérité définie et la qualité de vérité.
theological_decisions:
- issue: Sens de la consécration de Jésus lui-même
  choice: Jésus se met lui-même à part et se voue à sa mission en faveur des disciples.
  alternative: Jésus se sanctifie, au sens de devenir moralement plus saint.
  rationale: Le contexte appelle une consécration volontaire à la mission plutôt qu’un passage de l’impureté à la pureté. « Consacrer » exprime ce sens tout en restant dans le champ sémantique de ἁγιάζω.
- issue: Portée de ἐν ἀληθείᾳ
  choice: dans la vérité
  alternative: en vérité ; par la vérité
  rationale: La construction peut décrire la sphère de la consécration, mais elle reste susceptible d’autres nuances. Le texte principal retient une formulation qui fait écho au verset 17, tandis que la note préserve l’autre rendu naturel.
translation_notes:
  register: Français international moderne, digne et accessible. « Consacrer » est choisi dans les deux propositions pour rendre naturellement le sens contextuel et préserver la répétition du même radical grec. Les pronoms « moi-même » et « eux aussi » maintiennent les accents du texte source.
