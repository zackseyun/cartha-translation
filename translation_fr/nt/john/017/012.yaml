  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: fr
  text: Tant que j’étais avec eux, je les gardais en ton nom, le nom que tu m’as donné, et je les ai protégés. Aucun d’eux n’a péri[a], sauf le fils de la perdition[b], afin que l’Écriture soit accomplie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Aucun d’eux ne s’est perdu. »'
    reason: lexical_alternative
  - marker: b
    text: « Le fils de la perdition » est une expression de tournure sémitique; elle peut aussi se comprendre comme « celui qui appartient à la perdition » ou « celui qui est voué à la perdition ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: Tant que j’étais avec eux
  rationale: Cette formulation française exprime naturellement la durée indiquée par le contexte et les imparfaits grecs.
- source_word: ἐγὼ ἐτήρουν αὐτοὺς
  choice: je les gardais
  rationale: L’imparfait conserve l’action continue; « garder » reste proche de τηρέω sans expliciter excessivement la nature de cette garde.
- source_word: ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι
  choice: en ton nom, le nom que tu m’as donné
  rationale: La reprise de « le nom » rend clairement en français l’accord du relatif neutre singulier avec ὄνομα et évite de rattacher la proposition aux disciples.
- source_word: καὶ ἐφύλαξα
  choice: et je les ai protégés
  rationale: « Protéger » distingue φυλάσσω de τηρέω tout en exprimant son idée de garde vigilante; le passé composé correspond à l’aoriste dans un récit français naturel.
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: Aucun d’eux n’a péri
  rationale: « Périr » rend la gravité de ἀπόλλυμι dans ce contexte; l’autre sens johannique possible, « se perdre », est signalé en note.
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: le fils de la perdition
  rationale: Cette expression conserve l’idiome sémitique et le lien lexical avec l’idée de perte ou de ruine, sans le transformer dans le texte en affirmation doctrinale explicite.
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: afin que l’Écriture soit accomplie
  rationale: « Afin que » préserve la nuance de finalité ou d’aboutissement de ἵνα, tandis que « l’Écriture » respecte l’article grec.
theological_decisions:
- issue: Référent de ᾧ δέδωκάς μοι
  choice: 'La proposition relative qualifie « ton nom » : « le nom que tu m’as donné ».'
  alternative: 'La comprendre comme désignant les disciples : « ceux que tu m’as donnés ».'
  rationale: Dans le texte grec fourni, le relatif neutre singulier s’accorde naturellement avec ὄνομα, neutre singulier, et non avec αὐτούς, masculin pluriel.
- issue: Sens de ὁ υἱὸς τῆς ἀπωλείας
  choice: Conserver l’idiome sous la forme « le fils de la perdition ».
  alternative: « celui qui est voué à la perdition » ou « celui qui appartient à la perdition ».
  rationale: La formulation retenue préserve l’image et sa tension théologique; la note explique l’idiome sans trancher entre caractérisation et destinée.
- issue: Nuance de ἵνα dans l’accomplissement de l’Écriture
  choice: « afin que l’Écriture soit accomplie »
  alternative: « de sorte que l’Écriture soit accomplie »
  rationale: La traduction conserve la formulation finale du grec tout en laissant subsister la relation complexe entre l’événement et l’accomplissement scripturaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à la prière adressée au Père. La répétition « ton nom, le nom » clarifie l’antécédent grammatical sans résoudre l’expression par une paraphrase doctrinale.
