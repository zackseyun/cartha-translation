id: JHN.17.22
reference: John 17:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: fr
  text: Et moi, je leur ai donné la gloire que tu m’as donnée[a], afin qu’ils soient un comme nous sommes un.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Moi aussi, je leur ai donné la gloire que tu m’as donnée. » Le grec κἀγώ peut porter une nuance additive : « moi aussi ».'
    reason: Alternative lexicale
lexical_decisions:
- source_word: κἀγὼ
  choice: Et moi
  rationale: La crase καί + ἐγώ relie la phrase au contexte tout en mettant le sujet en relief. « Et moi » est naturel en français et laisse ouverte la nuance additive possible.
- source_word: δόξαν
  choice: la gloire
  rationale: Dans Jean, δόξα désigne couramment la gloire divine plutôt qu’un simple honneur humain. « Gloire » conserve cette portée théologique.
- source_word: ἣν δέδωκάς μοι
  choice: que tu m’as donnée
  rationale: Le passé composé français exprime naturellement l’acte accompli dont le résultat demeure. L’accord de « donnée » avec l’antécédent féminin « gloire » est requis.
- source_word: δέδωκα αὐτοῖς
  choice: je leur ai donné
  rationale: Le passé composé rend naturellement le parfait grec, tandis que le pronom indirect « leur » produit une formulation française fluide.
- source_word: ἵνα
  choice: afin que
  rationale: « Afin que » marque clairement le but ou le résultat visé, dans un registre digne sans être archaïque.
- source_word: ὦσιν
  choice: ils soient
  rationale: Le subjonctif présent après « afin que » correspond au subjonctif grec et exprime la visée de l’action.
- source_word: ἓν
  choice: un
  rationale: Le neutre singulier souligne l’unité sans dire que les disciples deviennent une seule personne. « Un » conserve la concision et l’ouverture du grec.
- source_word: καθὼς
  choice: comme
  rationale: « Comme » exprime directement et naturellement la comparaison en français moderne.
- source_word: ἡμεῖς ἕν
  choice: nous sommes un
  rationale: Le verbe, sous-entendu en grec, doit être exprimé en français. La formulation préserve la comparaison sans définir la nature précise de cette unité.
theological_decisions:
- issue: Nature de l’unité des croyants comparée à celle du Père et du Fils
  choice: « afin qu’ils soient un comme nous sommes un »
  alternative: Préciser qu’il s’agit d’une unité seulement relationnelle, d’une participation à la vie divine ou d’une unité institutionnelle/ecclésiale
  rationale: Le texte établit une comparaison réelle, mais n’en définit pas ici le mode exact. La traduction conserve donc cette tension théologique sans imposer une interprétation particulière.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux parfaits est rendu par le passé composé, et la formulation concise « être un » est conservée malgré son caractère marqué afin de respecter le grec et sa portée théologique.
