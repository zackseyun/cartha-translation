id: JHN.17.9
reference: John 17:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: fr
  text: Moi, je demande pour eux[a]. Je ne demande pas pour le monde, mais pour ceux que tu m’as donnés, parce qu’ils sont à toi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à leur sujet ». Dans ce contexte, la préposition grecque peut exprimer aussi bien le sujet de la demande que son bénéficiaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: Moi, je
  rationale: Le pronom explicite est rendu par une dislocation naturelle en français afin de préserver son relief emphatique.
- source_word: περὶ αὐτῶν
  choice: pour eux
  rationale: Avec ἐρωτῶ dans cette prière, περί suivi du génitif a naturellement une valeur d’intercession. « Pour eux » est idiomatique en français, tandis que « à leur sujet » reste possible et est signalé en note.
- source_word: ἐρωτῶ
  choice: je demande
  rationale: « Demander » conserve le sens premier du verbe sans lui substituer le terme religieux plus explicite « prier »; le contexte indique clairement que Jésus s’adresse au Père.
- source_word: κόσμου
  choice: le monde
  rationale: Cette formulation conserve le terme johannique et sa tension sémantique sans le réduire à « l’humanité » ni à un système opposé à Dieu.
- source_word: ὧν δέδωκάς μοι
  choice: ceux que tu m’as donnés
  rationale: Le groupe est compris comme désignant des personnes. Le passé composé français exprime naturellement l’acte accompli dont le résultat demeure.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici le motif de la demande et reçoit une traduction causale claire.
- source_word: σοί εἰσιν
  choice: ils sont à toi
  rationale: Cette tournure française directe préserve la relation d’appartenance exprimée par le datif avec εἰμί.
theological_decisions:
- issue: Faut-il rendre ἐρωτῶ par un terme explicitement religieux ?
  choice: « je demande »
  alternative: « je prie »
  rationale: Bien que la scène soit une prière, le grec emploie le verbe courant « demander ». La traduction conserve cette transparence lexicale sans nier le contexte de prière.
- issue: Quelle est l’étendue du terme « le monde » ?
  choice: Conserver « le monde » sans précision interprétative
  alternative: « l’humanité » ou « le monde incroyant »
  rationale: Le terme κόσμος possède plusieurs nuances dans Jean. Le préciser ici résoudrait une tension que le texte grec laisse ouverte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « je demande pour » maintient le parallélisme appuyé du grec. Le tutoiement correspond à l’adresse de Jésus au Père et à l’usage biblique français courant.
