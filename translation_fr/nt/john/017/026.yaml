id: JHN.17.26
reference: John 17:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: fr
  text: Je leur ai fait connaître ton nom[a][b], et je le ferai connaître, afin que l’amour dont tu m’as aimé soit en eux[c], et moi en eux.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je leur ai révélé ton nom, et je le révélerai. »'
    reason: lexical_alternative
  - marker: b
    text: Ici, le « nom » de Dieu désigne son identité et son caractère tels qu’il les révèle, et non pas seulement une appellation prononcée.
    reason: cultural_note
  - marker: c
    text: 'Ou : « parmi eux ». « En eux » rend toutefois plus directement le grec et préserve le thème johannique de la présence intérieure.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: j’ai fait connaître
  rationale: L’aoriste actif de γνωρίζω exprime ici l’action de faire connaître. Cette formulation conserve son sens causatif et le parallélisme avec le futur γνωρίσω.
- source_word: τὸ ὄνομά σου
  choice: ton nom
  rationale: La formulation concrète du grec est maintenue. Dans ce contexte johannique, le « nom » évoque l’identité et le caractère révélés de Dieu, mais la traduction ne remplace pas l’image biblique par son interprétation.
- source_word: γνωρίσω
  choice: je le ferai connaître
  rationale: Le futur actif répond à ἐγνώρισα. Le pronom « le » reprend naturellement « ton nom » en français sans répétition lourde.
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure française exprime clairement la visée de la proposition au subjonctif tout en conservant la portée de but ou de résultat de ἵνα.
- source_word: ἡ ἀγάπη
  choice: l’amour
  rationale: Traduction directe et naturelle de ἀγάπη.
- source_word: ἣν ἠγάπησάς με
  choice: dont tu m’as aimé
  rationale: La construction avec « dont » rend de façon concise le lien entre l’amour et l’action d’aimer, sans paraphraser en « l’amour que tu as eu pour moi ».
- source_word: ἐν αὐτοῖς
  choice: en eux
  rationale: Cette traduction directe de ἐν avec le datif préserve le thème johannique de la présence intérieure; « parmi eux » demeure possible selon la portée contextuelle de la préposition.
- source_word: ᾖ
  choice: soit
  rationale: Le présent du subjonctif français après « afin que » correspond naturellement au présent subjonctif grec.
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: et moi en eux
  rationale: La formulation conserve l’ellipse grecque, où le verbe n’est pas répété, ainsi que la coordination étroite entre l’amour présent en eux et Jésus présent en eux.
theological_decisions:
- issue: Sens de « ton nom » dans la théologie johannique
  choice: Conserver « ton nom » dans le texte principal.
  alternative: « qui tu es » ou « ton caractère »
  rationale: Le « nom » renvoie à l’identité révélée du Père, mais une explicitation dans le texte trancherait l’image et réduirait sa richesse théologique.
- issue: Rapport entre l’amour divin et la présence du Christ dans la proposition finale
  choice: 'Présenter les deux réalités de manière coordonnée : « que l’amour… soit en eux, et moi en eux »'
  alternative: Répéter explicitement « que je sois en eux » ou établir un lien causal entre les deux réalités.
  rationale: Le grec coordonne les deux éléments sans préciser davantage leur rapport logique. L’ellipse est donc conservée afin de ne pas résoudre une tension que le texte laisse ouverte.
translation_notes:
  register: Français international actuel, digne et accessible. La syntaxe reste proche de la structure grecque, notamment dans la reprise de « faire connaître » et dans l’ellipse finale « et moi en eux », tout en demeurant intelligible en français.
