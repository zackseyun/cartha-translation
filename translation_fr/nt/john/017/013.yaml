id: JHN.17.13
reference: John 17:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: fr
  text: Mais maintenant, je viens à toi, et je dis ces choses dans le monde afin qu’ils aient en eux ma joie dans toute sa plénitude.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: Mais maintenant
  rationale: νῦν situe l’action au moment présent et δέ marque une transition légèrement contrastive; « Mais maintenant » conserve ce mouvement du discours sans durcir l’opposition.
- source_word: πρὸς σὲ ἔρχομαι
  choice: je viens à toi
  rationale: Le présent ἔρχομαι avec πρὸς exprime le mouvement vers le Père. Le présent français est naturel et garde la proximité de ce départ imminent.
- source_word: ταῦτα λαλῶ
  choice: je dis ces choses
  rationale: Cette formulation actuelle et sobre restitue l’acte de parole de λαλέω sans lourdeur.
- source_word: ἐν τῷ κόσμῳ
  choice: dans le monde
  rationale: Le rendu littéral conserve le vocabulaire johannique et désigne ici la sphère où Jésus parle encore.
- source_word: ἵνα ἔχωσιν
  choice: afin qu’ils aient
  rationale: « Afin que » exprime clairement la valeur de but de ἵνα.
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: ma joie
  rationale: Le possessif emphatique désigne naturellement la joie qui appartient à Jésus, sans imposer d’explication théologique supplémentaire.
- source_word: πεπληρωμένην
  choice: dans toute sa plénitude
  rationale: Le participe parfait passif de πληρόω décrit la joie portée à son plein accomplissement et demeurant dans cet état. Cette tournure idiomatique évite le français peu naturel « joie remplie » tout en préservant l’image de plénitude.
- source_word: ἐν ἑαυτοῖς
  choice: en eux
  rationale: Le réfléchi indique le lieu intérieur où cette joie est possédée ou éprouvée. « En eux » est naturel en français et reste proche du grec.
theological_decisions:
- issue: Nature de « ma joie »
  choice: La joie propre à Jésus doit être présente en plénitude dans ses disciples.
  alternative: La joie que les disciples éprouvent au sujet de Jésus.
  rationale: Le possessif ἐμὴν renvoie le plus naturellement à la joie de Jésus lui-même; la traduction n’explicite pas davantage la manière dont elle est communiquée.
- issue: Portée de ἐν ἑαυτοῖς
  choice: La joie est en eux, intérieurement.
  alternative: La joie est complète parmi eux, collectivement.
  rationale: Le sens réfléchi et intérieur est le plus naturel dans ce contexte, mais la formulation demeure assez sobre pour ne pas développer une doctrine de l’intériorité.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve la progression de la prière et le vocabulaire johannique, tandis que « dans toute sa plénitude » rend naturellement en français le résultat durable exprimé par πεπληρωμένην.
