id: JHN.17.24
reference: John 17:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: fr
  text: Père, je veux que ceux que tu m’as donnés[a] soient eux aussi avec moi là où je suis, afin qu’ils contemplent la gloire que tu m’as donnée, parce que tu m’as aimé avant la fondation du monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec dit littéralement « ce que tu m’as donné »; l’expression est collective et désigne les personnes que le Père a données au Fils, d’où « ceux que tu m’as donnés ».
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: Père
  rationale: Vocatif direct adressé à Dieu; « Père » est naturel et fidèle sans ajouter de possessif absent du grec.
- source_word: ὃ δέδωκάς μοι
  choice: ceux que tu m’as donnés
  rationale: Le relatif neutre singulier grec a ici une valeur collective et renvoie à des personnes, comme le confirment le pronom pluriel κἀκεῖνοι et le verbe ὦσιν. La note conserve la forme littérale comme véritable ambiguïté grammaticale.
- source_word: θέλω
  choice: je veux
  rationale: Exprime clairement la volonté ou le désir de Jésus. En français moderne, « je veux » est digne et plus direct que « je désire », sans imposer à lui seul l’idée d’un décret.
- source_word: ὅπου εἰμὶ ἐγώ
  choice: là où je suis
  rationale: Rend naturellement la localisation; le pronom grec explicite ajoute une légère emphase que le français n’a pas besoin de reproduire lourdement.
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: soient eux aussi avec moi
  rationale: « eux aussi » préserve la valeur additive et légèrement emphatique de κἀκεῖνοι.
- source_word: θεωρῶσιν
  choice: contemplent
  rationale: Le verbe désigne ici une vision attentive de la gloire; « contempler » restitue cette nuance mieux que le simple « voir », tout en restant courant et digne.
- source_word: τὴν δόξαν τὴν ἐμὴν ἣν δέδωκάς μοι
  choice: la gloire que tu m’as donnée
  rationale: Le français exprime naturellement la possession par le pronom objet « m’ » dans la relative; le passé composé convient au parfait grec et à son résultat durable.
- source_word: ὅτι ἠγάπησάς με
  choice: parce que tu m’as aimé
  rationale: ὅτι est compris causalement; le passé composé est la forme narrative française naturelle pour l’aoriste dans cette phrase.
- source_word: πρὸ καταβολῆς κόσμου
  choice: avant la fondation du monde
  rationale: Formulation française établie qui conserve l’image de la mise en place du monde et la référence temporelle antérieure à la création.
theological_decisions:
- issue: La préexistence du Fils impliquée par l’amour du Père avant la fondation du monde
  choice: 'Conserver sans atténuation l’énoncé temporel: « tu m’as aimé avant la fondation du monde »'
  alternative: Paraphraser la proposition comme une simple prédestination ou en métaphoriser la temporalité
  rationale: Le grec présente directement l’amour du Père pour Jésus comme antérieur à la fondation du monde; la traduction préserve cette affirmation sans développement doctrinal.
- issue: Force de θέλω dans la prière de Jésus
  choice: « je veux »
  alternative: « je désire » ou « je demande »
  rationale: « Je veux » garde la force volitive du grec. « Je demande » affaiblirait ou expliciterait indûment l’acte de parole, tandis que « je désire » pourrait paraître plus faible en français contemporain.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement suit l’adresse filiale et l’usage biblique français courant. « Contemplent » maintient la nuance attentive de θεωρέω sans archaïsme; « fondation du monde » conserve l’expression théologique et l’image grecque.
