id: JHN.17.10
reference: John 17:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ τὰ ἐμὰ πάντα σά ἐστιν καὶ τὰ σὰ ἐμά, καὶ δεδόξασμαι ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: fr
  text: Tout ce qui est à moi est à toi, et ce qui est à toi est à moi. Et j’ai été glorifié en eux.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par eux » ou « parmi eux ». Le grec dit littéralement « en eux », expression qui peut évoquer ici le lieu, le moyen ou la manifestation.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: Tout ce qui est à moi
  rationale: Le neutre pluriel substantivé avec πάντα a une portée globale. Cette formulation est naturelle en français et évite la nuance trop matérielle de « toutes mes choses ».
- source_word: σά
  choice: à toi
  rationale: Dans cette proposition attributive, « à toi » exprime clairement et naturellement la possession tout en conservant la réciprocité de l’énoncé.
- source_word: τὰ σὰ ἐμά
  choice: ce qui est à toi est à moi
  rationale: Cette formulation fait écho à la première proposition, reste idiomatique en français et maintient sans l’atténuer l’affirmation de possession réciproque.
- source_word: δεδόξασμαι
  choice: j’ai été glorifié
  rationale: Le parfait passif présente une action accomplie dont le résultat demeure. Le passé composé passif en conserve mieux la valeur que le simple présent « je suis glorifié ».
- source_word: ἐν αὐτοῖς
  choice: en eux
  rationale: C’est le rendu le plus direct de ἐν αὐτοῖς. Le pronom renvoie naturellement, dans le contexte, aux personnes données au Fils; la formulation préserve les nuances possibles de lieu, de moyen ou de manifestation.
theological_decisions:
- issue: La possession réciproque entre le Fils et le Père
  choice: 'Traduire directement l’affirmation comme une possession réciproque : « Tout ce qui est à moi est à toi, et ce qui est à toi est à moi. »'
  alternative: Atténuer l’énoncé en le réduisant à une simple coopération fonctionnelle.
  rationale: Le grec affirme explicitement cette réciprocité. La traduction ne doit ni l’affaiblir ni lui ajouter une terminologie doctrinale postérieure absente du verset.
- issue: Le référent et la valeur de ἐν αὐτοῖς
  choice: Conserver « en eux » dans le texte principal.
  alternative: Traduire de manière interprétative par « par eux » ou « parmi eux ».
  rationale: La préposition ἐν peut porter plusieurs nuances dans ce contexte. Le texte ne contraint pas à en choisir une seule; le rendu direct maintient donc l’ambiguïté authentique, avec les autres possibilités signalées en note.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition équilibrée « à moi… à toi… à toi… à moi » conserve la structure rhétorique du grec. La note est placée après « en eux », l’expression qu’elle précise.
