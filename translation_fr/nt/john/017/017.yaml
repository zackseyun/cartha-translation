  text: ἁγίασον αὐτοὺς ἐν τῇ ⸀ἀληθείᾳ· ὁ λόγος ὁ σὸς ἀλήθειά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: fr
  text: 'Sanctifie-les dans la vérité[a] : ta parole est vérité.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi comprendre : « Sanctifie-les par la vérité. » Dans la seconde proposition, on peut également traduire : « ta parole est la vérité ».'
    reason: La préposition grecque ἐν peut avoir ici une nuance locale ou instrumentale. De plus, le nom attribut « vérité » est sans article, ce qui peut souligner une qualité (« est vérité ») sans exclure entièrement l’identification (« est la vérité »).
lexical_decisions:
- source_word: ἁγίασον
  choice: Sanctifie
  rationale: L’impératif « sanctifie » conserve à la fois l’idée de consécration à Dieu et celle de sainteté, sans réduire le sens à une simple mise à part.
- source_word: αὐτοὺς
  choice: les
  rationale: Pronom objet pluriel renvoyant aux disciples.
- source_word: ἐν τῇ ἀληθείᾳ
  choice: dans la vérité
  rationale: Cette formulation respecte la préposition ἐν et l’article défini, tout en maintenant l’ouverture entre une nuance de domaine (« dans ») et une éventuelle nuance de moyen.
- source_word: ὁ λόγος ὁ σὸς
  choice: ta parole
  rationale: Formulation française naturelle qui rend λόγος comme la parole communiquée par Dieu et exprime simplement la construction possessive grecque.
- source_word: ἀλήθειά ἐστιν
  choice: est vérité
  rationale: L’absence d’article devant le nom attribut ἀλήθεια favorise ici une portée qualitative. La tournure, solennelle mais compréhensible, préserve le substantif plutôt que de l’affaiblir en « est vraie ».
theological_decisions:
- issue: Valeur qualitative ou identificatrice de ἀλήθεια dans la seconde proposition
  choice: ta parole est vérité
  alternative: ta parole est la vérité
  rationale: « Est vérité » reflète directement le nom attribut sans article et préserve sa possible valeur qualitative. « Est la vérité » reste grammaticalement possible, puisque l’absence d’article grec ne suffit pas à exclure une identification définie; cette possibilité est donc signalée en note.
translation_notes:
  register: Français international moderne, digne et concis. « Sanctifie » garde le poids théologique du verbe grec; « est vérité » est volontairement plus marqué que la prose courante afin de préserver la forme et l’ambiguïté du texte source.
