id: JHN.17.15
reference: John 17:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: fr
  text: Je ne te demande pas de les retirer du monde, mais de les préserver du Mauvais[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les préserver du mal ». Le grec τοῦ πονηροῦ peut désigner soit le Mauvais, soit le mal.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: je demande
  rationale: Le présent de l’indicatif exprime la demande que Jésus adresse alors au Père. « Demander » rend directement le verbe sans adopter le registre plus ecclésiastique de « prier ».
- source_word: ἄρῃς
  choice: retirer
  rationale: Dans la construction ἄρῃς ... ἐκ τοῦ κόσμου, le verbe signifie enlever ou faire sortir. « Retirer du monde » est naturel en français et conserve cette idée.
- source_word: κόσμου
  choice: monde
  rationale: « Monde » garde l’étendue sémantique de κόσμος et convient à l’usage johannique sans expliciter à l’excès l’ordre humain opposé à Dieu.
- source_word: τηρήσῃς
  choice: garder
  rationale: τηρέω peut signifier garder, préserver ou protéger. « Garder » demeure proche du grec et convient au langage biblique français courant.
- source_word: ἐκ
  choice: de
  rationale: Après « garder », la préposition française « de » exprime naturellement la préservation à l’égard d’un danger, tout en laissant au contexte le soin d’en préciser la nature.
- source_word: τοῦ πονηροῦ
  choice: du Mauvais
  rationale: La forme grecque peut être masculine (« le Mauvais ») ou neutre (« le mal »). Le contexte johannique favorise ici un agent personnel; « le Mauvais » conserve la valeur adjectivale substantivée du grec. L’autre lecture figure en note.
theological_decisions:
- issue: τοῦ πονηροῦ désigne-t-il une personne (« le Mauvais ») ou le mal de façon impersonnelle?
  choice: le Mauvais
  alternative: le mal
  rationale: La morphologie grecque permet les deux lectures. L’usage johannique et le contexte de protection favorisent la référence personnelle, sans rendre l’interprétation impersonnelle impossible; celle-ci est donc conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation directe conserve le contraste entre ne pas retirer les disciples du monde et les garder face au mal ou au Mauvais.
