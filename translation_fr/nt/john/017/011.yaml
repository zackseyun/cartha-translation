id: JHN.17.11
reference: John 17:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: fr
  text: Je ne suis plus dans le monde, mais eux sont dans le monde, et moi, je viens à toi. Père saint, garde-les en ton nom[a], ce nom que tu m’as donné[b], afin qu’ils soient un, comme nous.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On peut aussi traduire : « garde-les par ton nom » ou « protège-les au moyen de ton nom ». L’expression grecque peut indiquer la sphère, le moyen ou l’autorité.'
    reason: lexical_alternative
  - marker: b
    text: Certains manuscrits lisent « ceux que tu m’as donnés » plutôt que « ce nom que tu m’as donné ». La traduction suit ici le texte SBLGNT, où le relatif renvoie à « nom ».
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: ne… plus
  rationale: Exprime naturellement en français moderne la cessation envisagée du point de vue présent de Jésus.
- source_word: κόσμος
  choice: monde
  rationale: Conserve le terme johannique pour la sphère humaine et terrestre où demeurent les disciples.
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: et moi, je viens à toi
  rationale: Le présent français garde le mouvement exprimé par ἔρχομαι et sa portée imminente, sans le transformer en « je vais ».
- source_word: πάτερ ἅγιε
  choice: Père saint
  rationale: Vocatif naturel et digne, qui conserve à la fois l’adresse filiale et la sainteté attribuée au Père.
- source_word: τήρησον
  choice: garde-les
  rationale: '« Garder » préserve l’étendue de τηρέω : veiller sur, protéger et maintenir fidèlement, sans réduire le sens à la seule sécurité physique.'
- source_word: ἐν τῷ ὀνόματί σου
  choice: en ton nom
  rationale: Rend directement ἐν et maintient l’ambiguïté entre sphère, moyen et autorité.
- source_word: ᾧ δέδωκάς μοι
  choice: celui que tu m’as donné
  rationale: Le relatif grec s’accorde avec « nom »; « celui » rend ce lien explicite et naturel en français tout en suivant le texte SBLGNT.
- source_word: ἵνα ὦσιν ἓν
  choice: afin qu’ils soient un
  rationale: « Afin que » marque le but; « un » conserve la formulation dense du grec et exprime l’unité sans la définir davantage.
- source_word: καθὼς ἡμεῖς
  choice: comme nous
  rationale: Préserve la comparaison avec l’unité du Père et du Fils sans ajouter en français un verbe absent du grec ni préciser la nature de l’analogie.
theological_decisions:
- issue: Sens de « garde-les en ton nom »
  choice: La formulation littérale « en ton nom » est maintenue dans le texte.
  alternative: « garde-les par ton nom » ou « protège-les au moyen de ton nom »
  rationale: La préposition peut évoquer une sphère, un moyen ou une autorité. La traduction évite de trancher une tension authentique du texte.
- issue: Référent de « celui que tu m’as donné »
  choice: Le relatif renvoie au « nom ».
  alternative: Comprendre la clause comme « ceux que tu m’as donnés » selon une autre tradition manuscrite ou analyse textuelle.
  rationale: Le texte SBLGNT fourni porte le relatif neutre singulier ᾧ, qui s’accorde avec ὀνόματι; cette relation est donc conservée.
- issue: Portée de « qu’ils soient un comme nous »
  choice: La comparaison réelle entre l’unité des disciples et celle du Père et du Fils est laissée intacte.
  alternative: Réduire cette unité à une simple coopération morale ou, à l’inverse, expliciter une identité métaphysique.
  rationale: Le grec affirme l’analogie sans en définir ici la nature; la traduction ne doit ni l’affaiblir ni lui imposer une formulation doctrinale ultérieure.
translation_notes:
  register: Français international moderne, courant et digne. Le tutoiement convient à la prière adressée au Père. La répétition de « monde » et la brièveté de « soient un comme nous » conservent le style johannique. Tous les appels de notes figurent dans le texte.
