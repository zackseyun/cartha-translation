  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: fr
  text: Ils ne sont pas du monde[a], tout comme moi, je ne suis pas du monde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'L’expression grecque peut évoquer l’origine, la provenance ou l’appartenance : « ils ne viennent pas du monde » ou « ils n’appartiennent pas au monde ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: du
  rationale: Dans l’expression française « être du monde », « du » traduit naturellement ἐκ τοῦ et peut exprimer l’origine aussi bien que l’appartenance, sans imposer une paraphrase explicative.
- source_word: κόσμου
  choice: monde
  rationale: Le terme simple « monde » conserve la formulation et la profondeur théologique propres à Jean, sans la réduire à « système du monde » ou à une autre interprétation.
- source_word: οὐκ εἰσὶν
  choice: ils ne sont pas
  rationale: Cette formulation rend directement le présent négatif de εἰμί.
- source_word: καθὼς
  choice: tout comme
  rationale: « Tout comme » marque clairement et naturellement la comparaison étroite entre les disciples et Jésus.
- source_word: ἐγὼ
  choice: moi, je
  rationale: Le pronom disjoint suivi du pronom sujet restitue en français l’insistance portée par le pronom grec explicite.
- source_word: οὐκ εἰμὶ
  choice: je ne suis pas
  rationale: Cette formulation rend directement le présent négatif à la première personne.
- source_word: ἐκ τοῦ κόσμου
  choice: du monde
  rationale: La même expression est conservée dans les deux propositions. En français courant, « du monde » est plus naturel que « venant du monde » et laisse ouvertes les nuances d’origine, de provenance et d’appartenance.
theological_decisions:
- issue: Sens de « monde » dans la théologie johannique
  choice: Conserver « monde » sans développement interprétatif dans le texte principal.
  alternative: « système du monde » ou « ordre présent éloigné de Dieu »
  rationale: Le mot κόσμος possède chez Jean une profondeur théologique que le contexte éclaire. Une expansion dans le texte principal restreindrait indûment son sens et atténuerait la tension propre au passage.
- issue: Nuance de ἐκ τοῦ κόσμου
  choice: Employer « du monde » et signaler en note les nuances possibles d’origine ou d’appartenance.
  alternative: « venant du monde »
  rationale: « Du monde » est idiomatique et symétrique dans les deux propositions, tandis que « venant du monde » privilégierait la provenance et risquerait d’affaiblir la nuance d’appartenance.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise « moi, je » conserve l’emphase du grec sans alourdir la phrase; la répétition de « du monde » maintient le parallélisme du verset.
