id: JHN.17.8
reference: John 17:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: fr
  text: En effet, les paroles que tu m’as données, je les leur ai données[a]. Ils les ont reçues et ont vraiment reconnu que je suis venu de toi[b], et ils ont cru que c’est toi qui m’as envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « les déclarations que tu m’as données ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « je suis sorti d’auprès de toi ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: En effet
  rationale: Au début du verset, ὅτι introduit l’explication de l’affirmation précédente. « En effet » exprime naturellement ce lien en français moderne.
- source_word: τὰ ῥήματα
  choice: les paroles
  rationale: Le pluriel concret désigne ici les paroles ou déclarations données par le Père. « Les paroles » conserve ce pluriel sans le réduire au singulier interprétatif « le message ».
- source_word: ἔδωκάς … δέδωκα
  choice: tu m’as données … je les leur ai données
  rationale: Le passé composé convient naturellement aux deux actions en français; la seconde demeure présentée comme accomplie et pertinente dans la situation actuelle. La reprise de « données » conserve le parallélisme grec.
- source_word: ἔλαβον
  choice: ils les ont reçues
  rationale: « Recevoir » correspond au don mentionné juste avant et évite aussi bien le sens trop matériel de « prendre » que l’interprétation plus appuyée d’« accepter ».
- source_word: ἔγνωσαν ἀληθῶς
  choice: ont vraiment reconnu
  rationale: « Reconnu » rend l’idée d’une connaissance acquise ou d’une prise de conscience, tandis que « vraiment » traduit directement ἀληθῶς sans le transformer en simple certitude subjective.
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: je suis venu de toi
  rationale: Cette formulation française naturelle exprime l’origine indiquée par παρά avec le génitif. Elle conserve le poids théologique de l’énoncé sans lui imposer une terminologie doctrinale ultérieure.
- source_word: ἐπίστευσαν ὅτι
  choice: ils ont cru que
  rationale: La proposition introduite par ὅτι présente ce qu’ils ont tenu pour vrai; « ont cru que » en respecte directement la syntaxe.
- source_word: σύ με ἀπέστειλας
  choice: c’est toi qui m’as envoyé
  rationale: La tournure emphatique française rend la présence marquée du pronom σύ tout en traduisant simplement ἀποστέλλω par « envoyer ».
theological_decisions:
- issue: Relation entre Jésus et le Père dans παρὰ σοῦ ἐξῆλθον
  choice: je suis venu de toi
  alternative: je suis sorti d’auprès de toi
  rationale: Le texte principal exprime naturellement la provenance sans préciser davantage la nature de cette origine. La note conserve une traduction plus formelle du verbe ἐξέρχομαι et laisse intacte la tension théologique.
- issue: Valeur de πιστεύω suivi d’une proposition en ὅτι
  choice: ils ont cru que c’est toi qui m’as envoyé
  alternative: ils ont eu foi que c’est toi qui m’as envoyé
  rationale: Puisque le verbe porte ici sur une proposition, « croire que » est idiomatique et syntaxiquement précis; « avoir foi que » serait moins naturel et pourrait déplacer l’accent vers une confiance relationnelle non explicitée par cette construction.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond à l’adresse directe de Jésus au Père. Les reprises de « données » et le tour emphatique « c’est toi qui » préservent les traits saillants du grec sans alourdir la phrase.
