id: JHN.17.20
reference: John 17:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: fr
  text: Ce n’est pas seulement pour eux que je demande, mais aussi pour ceux qui croient en moi par leur parole[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « par leur message ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: je demande
  rationale: Dans ce contexte, Jésus adresse une demande au Père. « Je demande » rend directement le verbe sans ajouter la coloration particulière de « je prie ».
- source_word: περὶ τούτων
  choice: pour eux
  rationale: περί avec le génitif indique ici les personnes concernées par la demande. La tournure française « pour eux » est naturelle dans le contexte d’une prière et renvoie aux disciples immédiats sans les identifier davantage.
- source_word: Οὐ … μόνον
  choice: Ce n’est pas seulement … que
  rationale: Cette construction française met naturellement en relief la limitation exprimée par la négation et μόνον.
- source_word: ἀλλὰ καὶ
  choice: mais aussi
  rationale: La formule conserve à la fois le contraste et l’élargissement de la demande.
- source_word: τῶν πιστευόντων
  choice: ceux qui croient
  rationale: Le participe présent substantivé garde ainsi sa force verbale. Le français ne précise pas si ces personnes croient déjà ou croiront plus tard, ce qui préserve l’ouverture temporelle du grec.
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: par leur parole
  rationale: « Par » exprime le moyen, tandis que « leur parole » reste proche de λόγος et conserve ses résonances johanniques. « Leur message » est signalé en note comme formulation plus explicite.
- source_word: εἰς ἐμέ
  choice: en moi
  rationale: Avec πιστεύω, la construction εἰς ἐμέ désigne la foi orientée vers la personne de Jésus. « Croire en moi » est l’équivalent français idiomatique.
theological_decisions:
- issue: Portée temporelle et communautaire de la demande de Jésus
  choice: 'Ne pas ajouter « qui croiront » : « ceux qui croient » permet d’inclure les personnes qui viennent à la foi par le témoignage des disciples sans limiter explicitement le verset aux seuls croyants futurs.'
  alternative: Traduire « ceux qui croiront en moi », ce qui explicite une référence aux croyants futurs.
  rationale: Le participe présent πιστευόντων ne marque pas explicitement le futur. Le contraste avec « eux » ouvre naturellement la demande à un groupe plus large, mais la traduction préserve l’ambiguïté temporelle du texte.
translation_notes:
  register: Français moderne, clair et digne. La construction clivée « Ce n’est pas seulement pour eux que… » est idiomatique et maintient l’accent du grec. « Par leur parole » conserve la proximité lexicale avec λόγος, avec une option plus explicite en note.
