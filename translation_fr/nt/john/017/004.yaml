id: JHN.17.4
reference: John 17:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: fr
  text: Je t’ai glorifié sur la terre en achevant l’œuvre que tu m’as donnée à faire[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ayant achevé l’œuvre que tu m’as donnée à faire ».'
    reason: Cette formulation rend plus formellement le participe aoriste τελειώσας et peut laisser entendre une nuance circonstancielle ou temporelle.
lexical_decisions:
- source_word: ἐδόξασα
  choice: j’ai glorifié
  rationale: Le verbe « glorifier » conserve le sens théologique marqué de δοξάζω dans l’Évangile selon Jean, mieux que le plus faible « honorer ».
- source_word: ἐπὶ τῆς γῆς
  choice: sur la terre
  rationale: Cette formulation rend directement la valeur spatiale de ἐπί avec le génitif et reste naturelle en français moderne.
- source_word: τελειώσας
  choice: en accomplissant
  rationale: Le gérondif exprime naturellement le moyen par lequel Jésus a glorifié le Père, tout en gardant en note la possibilité d’une lecture circonstancielle.
- source_word: τὸ ἔργον
  choice: l’œuvre
  rationale: « L’œuvre » correspond au vocabulaire johannique de la mission confiée à Jésus et garde une portée plus riche que « la tâche ».
- source_word: δέδωκάς μοι
  choice: tu m’as donnée
  rationale: Le passé composé exprime en français l’acte accompli dont la portée demeure; l’accord de « donnée » avec « œuvre », placé avant le participe, est requis.
- source_word: ἵνα ποιήσω
  choice: à faire
  rationale: Après « donner », cette tournure infinitive rend avec naturel le but ou la mission exprimés par ἵνα avec le subjonctif.
- source_word: ἐγώ σε
  choice: Je t’
  rationale: Les pronoms français rendent directement les participants; ajouter « moi-même » surchargerait l’emphase du pronom grec explicite.
theological_decisions:
- issue: Rapport entre la glorification du Père et le participe τελειώσας
  choice: 'Le participe est compris comme exprimant le moyen : Jésus a glorifié le Père en accomplissant l’œuvre reçue.'
  alternative: '« ayant accompli l’œuvre »; ou une relation plus coordonnée : « je t’ai glorifié sur la terre; j’ai accompli l’œuvre… »'
  rationale: La syntaxe rattache naturellement le participe au verbe principal et présente l’accomplissement de la mission comme la manière dont Jésus a glorifié le Père, sans étendre l’affirmation au-delà du verset.
translation_notes:
  register: Français international moderne, digne et accessible. « Glorifier » et « œuvre » sont conservés pour leur poids johannique; la phrase reste fluide sans explicitation doctrinale ajoutée.
