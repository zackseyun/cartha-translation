id: JHN.17.5
reference: John 17:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: fr
  text: Et maintenant, Père, glorifie-moi auprès de toi[a], de la gloire que j’avais auprès de toi avant que le monde existe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en ta présence » ; l’expression grecque désigne plus littéralement la proximité auprès du Père.
    reason: lexical_alternative
  - marker: b
    text: Ou « avant que le monde soit » ou « avant que le monde vienne à l’existence ».
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: glorifie-moi
  rationale: L’impératif « glorifie » conserve le vocabulaire johannique de la gloire et de la glorification mutuelle du Père et du Fils, contrairement à « honore-moi », plus réducteur.
- source_word: παρὰ σεαυτῷ
  choice: auprès de toi
  rationale: παρά avec le datif exprime ici la proximité ou la présence. « Auprès de toi » est naturel en français, garde la dimension relationnelle et spatiale, et permet de faire écho au παρὰ σοί final.
- source_word: τῇ δόξῃ
  choice: de la gloire
  rationale: Après « glorifie-moi », « de la gloire » exprime idiomatiquement en français la gloire dont Jésus demande à être glorifié, tout en maintenant le lien lexical entre δοξάζω et δόξα.
- source_word: ᾗ εἶχον
  choice: que j’avais
  rationale: L’imparfait grec renvoie à la possession antérieure de cette gloire. L’imparfait français rend cette continuité passée de manière naturelle.
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: avant que le monde existe
  rationale: La construction infinitive articulée marque l’antériorité temporelle. Le subjonctif présent après « avant que » est idiomatique et conserve l’idée de l’existence du monde sans préciser davantage son mode de venue à l’existence.
- source_word: παρὰ σοί
  choice: auprès de toi
  rationale: La répétition de « auprès de toi » reproduit le parallélisme avec παρὰ σεαυτῷ et souligne la présence relationnelle auprès du Père.
- source_word: σύ, πάτερ
  choice: Père
  rationale: Le pronom grec σύ apporte une légère insistance, mais l’apostrophe « Père » suffit naturellement en français dans cette prière. Ajouter « toi, Père » alourdirait la phrase et pourrait suggérer un contraste plus marqué que le contexte immédiat.
- source_word: κόσμον
  choice: monde
  rationale: « Monde » est l’équivalent français habituel de κόσμος chez Jean et convient ici pour l’ordre créé sans imposer l’explicitation « univers » ou « création ».
theological_decisions:
- issue: La préexistence du Fils impliquée par le verset
  choice: Rendre directement la proposition temporelle comme désignant la gloire que Jésus avait auprès du Père avant l’existence du monde.
  alternative: Atténuer la formulation en parlant seulement d’une gloire prévue ou destinée à Jésus.
  rationale: Le grec présente cette gloire comme déjà possédée auprès du Père avant l’existence du monde. La traduction conserve cette affirmation sans l’amplifier par une explication doctrinale.
- issue: La nature de la gloire partagée avec le Père
  choice: Conserver le terme « gloire » sans ajout interprétatif.
  alternative: Employer « majesté » ou « honneur ».
  rationale: Le passage ne définit pas davantage cette gloire. « Gloire » préserve le vocabulaire et la tension théologique propres à Jean.
translation_notes:
  register: 'Français international moderne, digne et accessible. La répétition « auprès de toi » est volontaire : elle reflète les deux occurrences de παρά avec le datif et renforce la cohésion du verset. Les marqueurs de notes ont été placés aux expressions auxquelles leurs variantes se rapportent.'
