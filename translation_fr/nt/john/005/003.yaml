  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: fr
  text: Sous ces portiques, une foule de malades, d’aveugles, de boiteux et de personnes aux membres atrophiés[a] était couchée.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Littéralement « desséchés ». Le terme grec peut désigner des personnes ayant des membres atrophiés, desséchés ou gravement atteints.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: Sous ces portiques
  rationale: Le démonstratif féminin pluriel reprend les structures mentionnées au verset précédent. En français, « sous ces portiques » explicite naturellement l’antécédent et la relation spatiale sans changer le sens contextuel.
- source_word: κατέκειτο
  choice: était couchée
  rationale: L’imparfait décrit l’état prolongé de la foule étendue là. L’accord au singulier respecte le nom collectif « foule ».
- source_word: πλῆθος
  choice: une foule
  rationale: « Une foule » exprime clairement un grand nombre de personnes et conserve la valeur collective du grec dans un français courant et digne.
- source_word: τῶν ἀσθενούντων
  choice: de malades
  rationale: Le participe désigne ici des personnes souffrant de maladie ou d’infirmité physique. « Malades » est direct et naturel.
- source_word: τυφλῶν
  choice: aveugles
  rationale: Équivalent précis et courant de l’adjectif grec, intégré à l’énumération des personnes malades.
- source_word: χωλῶν
  choice: boiteux
  rationale: Le terme grec désigne des personnes dont la marche est atteinte. « Boiteux » en conserve le sens précis sans employer un terme contemporain plus dur ou plus général.
- source_word: ξηρῶν
  choice: infirmes aux membres desséchés
  rationale: Le grec signifie littéralement « secs, desséchés » et, appliqué à des personnes, évoque vraisemblablement des membres atrophiés ou incapables de fonctionner. La formulation conserve l’image corporelle au lieu de la réduire sans certitude à la paralysie.
