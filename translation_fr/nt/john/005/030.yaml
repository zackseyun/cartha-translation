id: JHN.5.30
reference: John 5:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: fr
  text: Je ne peux rien faire de moi-même. Je juge d’après ce que j’entends, et mon jugement est juste, parce que je ne cherche pas à faire ma propre volonté, mais la volonté de celui qui m’a envoyé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: Je ne peux rien faire de moi-même
  rationale: Cette formulation naturelle conserve la négation de la capacité exprimée par δύναμαι et rend ἀπ’ ἐμαυτοῦ comme une indication de source et d’indépendance, sans suggérer simplement une action solitaire.
- source_word: καθὼς ἀκούω κρίνω
  choice: Je juge d’après ce que j’entends
  rationale: « D’après ce que » exprime naturellement en français la correspondance entre ce que Jésus entend et le jugement qu’il porte, sans préciser indûment l’objet implicite de l’écoute.
- source_word: κρίνω / ἡ κρίσις ἡ ἐμὴ
  choice: je juge / mon jugement
  rationale: Le couple « juger / jugement » maintient la continuité lexicale et le cadre judiciaire du grec.
- source_word: δικαία
  choice: juste
  rationale: Dans ce contexte judiciaire, « juste » exprime à la fois la rectitude et l’équité du jugement.
- source_word: οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν
  choice: je ne cherche pas à faire ma propre volonté
  rationale: L’ajout idiomatique « à faire » explicite en français le sens volitif de ζητῶ avec θέλημα, tandis que « ma propre » restitue l’insistance du possessif grec.
- source_word: τοῦ πέμψαντός με
  choice: celui qui m’a envoyé
  rationale: Cette traduction claire conserve la désignation relationnelle du participe grec sans remplacer explicitement celle-ci par « le Père ».
theological_decisions:
- issue: Rapport de l’action du Fils à celui qui l’a envoyé dans ἀπ’ ἐμαυτοῦ
  choice: de moi-même
  alternative: par moi-même ; de ma propre initiative
  rationale: « De moi-même » conserve l’idée que l’action ne prend pas sa source dans une initiative indépendante, tout en laissant intacte la tension du texte concernant la capacité et la dépendance du Fils.
- issue: Portée de δικαία appliqué à κρίσις
  choice: mon jugement est juste
  alternative: mon jugement est droit
  rationale: « Juste » convient au contexte judiciaire et n’exclut pas la dimension morale de la rectitude.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du mouvement du grec, avec une légère explicitation idiomatique dans « d’après ce que j’entends » et « cherche à faire ma propre volonté ». Aucun marqueur de note n’est nécessaire.
