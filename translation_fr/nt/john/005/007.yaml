id: JHN.5.7
reference: John 5:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: fr
  text: 'Le malade lui répondit : « Seigneur, je n’ai personne pour me mettre dans le bassin quand l’eau est agitée. Pendant que je m’y rends, un autre y descend avant moi. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: le malade
  rationale: Rend naturellement le participe substantivé désignant l’homme atteint de maladie.
- source_word: Κύριε
  choice: Seigneur
  rationale: Conserve la forme d’adresse κύριε et sa possible portée christologique, sans réduire d’emblée le terme à « monsieur ».
- source_word: κολυμβήθραν
  choice: bassin
  rationale: Désigne ici le réservoir ou bassin de Béthesda; « bassin » est clair et naturel en français moderne.
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: Pendant que j’essaie d’y aller
  rationale: Exprime idiomatiquement la progression difficile impliquée par le contexte, sans préciser un mode de déplacement absent du grec.
- source_word: καταβαίνει
  choice: y descend
  rationale: Préserve l’image spatiale du grec, selon laquelle on descend dans le bassin.
theological_decisions:
- issue: Portée de l’adresse Κύριε
  choice: Seigneur
  alternative: Monsieur
  rationale: Le terme peut être une adresse respectueuse ou porter une résonance plus forte dans le récit johannique. « Seigneur » maintient cette ambiguïté et suit la décision textuelle auditée sans imposer que l’homme reconnaisse déjà pleinement l’identité de Jésus.
- issue: Cause de l’agitation de l’eau
  choice: Ne pas l’identifier
  alternative: Ajouter qu’un ange agite l’eau
  rationale: Le texte SBLGNT de ce verset dit seulement que l’eau est agitée; il ne faut pas importer l’explication de la variante textuelle associée à Jean 5.4.
translation_notes:
  register: Français international moderne, naturel et digne. La seconde phrase évite le calque lourd « pendant que je viens » tout en conservant l’idée que l’homme se dirige vers le bassin trop lentement.
