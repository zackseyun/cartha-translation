id: JHN.5.22
reference: John 5:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: fr
  text: En effet, le Père ne juge personne, mais il a remis tout jugement au Fils.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: En effet, … ne … personne
  rationale: « En effet » rend la valeur explicative de γάρ, tandis que la négation française avec « personne » exprime naturellement οὐδέ…οὐδένα sans lourdeur.
- source_word: ὁ πατὴρ
  choice: le Père
  rationale: Dans ce contexte johannique, il s’agit du titre désignant Dieu dans sa relation avec le Fils.
- source_word: κρίνει
  choice: juge
  rationale: Le présent exprime ici une réalité générale. « Juge » conserve le lien lexical avec κρίσιν et ne réduit pas le sens à la condamnation.
- source_word: οὐδένα
  choice: personne
  rationale: Avec « ne », ce terme rend de façon idiomatique et exhaustive la négation grecque.
- source_word: ἀλλὰ
  choice: mais
  rationale: Cette conjonction marque clairement le contraste affirmé dans le texte.
- source_word: τὴν κρίσιν πᾶσαν
  choice: tout jugement
  rationale: Cette formulation conserve le nom « jugement » et la portée totale de πᾶσαν sans expliciter davantage par « autorité de juger ».
- source_word: δέδωκεν
  choice: a remis
  rationale: Le passé composé rend l’acte accompli dont le résultat demeure. « Remettre quelque chose à quelqu’un » exprime ici naturellement le transfert, sans imposer la nuance plus spécifique de « confier ».
- source_word: τῷ υἱῷ
  choice: au Fils
  rationale: L’article et l’usage johannique soutiennent le maintien de « Fils » comme titre, sans ajouter le possessif absent du grec.
theological_decisions:
- issue: Rapport entre le jugement du Père et celui du Fils
  choice: Conserver sans atténuation l’affirmation selon laquelle le Père ne juge personne, mais a remis tout jugement au Fils.
  alternative: Ajouter que le Père ne juge personne indépendamment du Fils, ou limiter le propos au jugement final.
  rationale: Ces précisions peuvent relever de l’interprétation contextuelle, mais elles ne figurent pas dans cette proposition grecque. La traduction maintient donc sa tension théologique.
- issue: Titre christologique « le Fils »
  choice: Maintenir « le Fils » comme titre.
  alternative: Traduire « son Fils ».
  rationale: Le grec porte l’article mais aucun possessif explicite; le titre participe directement à la relation Père-Fils présentée dans le passage.
translation_notes:
  register: Français international moderne, naturel et digne. La structure reste proche du grec tout en évitant une reproduction maladroite de οὐδέ γάρ. Aucune note n’est nécessaire pour ce verset.
