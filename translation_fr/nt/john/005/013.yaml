  text: ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: fr
  text: Mais l’homme qui avait été guéri ne savait pas qui c’était, car Jésus s’était éclipsé[a], alors qu’il y avait une foule en ce lieu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « s’était retiré ». Le verbe grec évoque un départ discret. La présence de la foule en ce lieu peut être comprise comme la circonstance de ce départ ou comme son explication.
    reason: ambiguïté syntaxique et lexicale
lexical_decisions:
- source_word: ὁ δὲ ἰαθεὶς
  choice: Mais l’homme qui avait été guéri
  rationale: Le participe aoriste passif substantivé désigne l’homme guéri; le plus-que-parfait français exprime naturellement une guérison antérieure au fait de ne pas savoir.
- source_word: οὐκ ᾔδει τίς ἐστιν
  choice: ne savait pas qui c’était
  rationale: Cette formulation idiomatique conserve l’absence d’identification personnelle sans préciser davantage ce que l’homme ignorait de Jésus.
- source_word: ἐξένευσεν
  choice: s’était éclipsé
  rationale: Le verbe évoque ici un départ discret, hors de l’attention; «s’était éclipsé» restitue cette nuance avec naturel.
- source_word: ὄχλου ὄντος ἐν τῷ τόπῳ
  choice: dans la foule qui se trouvait là
  rationale: Le génitif absolu peut décrire la circonstance ayant permis ce retrait. Cette formulation française naturelle préserve le lien avec la présence de la foule, sans imposer une causalité plus forte que le grec.
theological_decisions: []
translation_notes:
  register: Français moderne, courant et digne. «S’était éclipsé» rend le caractère discret du départ; la note conserve l’autre analyse possible du génitif absolu.
