  source_fidelity: Le projet rend correctement l’homme guéri, son ignorance de l’identité de Jésus et la nuance d’un départ discret. Toutefois, « dans la foule » attribue au grec un mouvement ou une localisation de Jésus au sein de la foule, alors que ὄχλου ὄντος ἐν τῷ τόπῳ indique qu’une foule était présente en ce lieu. La relation circonstancielle ou explicative doit rester ouverte.
