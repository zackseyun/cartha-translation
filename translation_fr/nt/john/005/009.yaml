id: JHN.5.9
reference: John 5:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: fr
  text: Aussitôt, l’homme retrouva la santé, prit sa natte[a] et se mit à marcher[b]. Or, c’était un jour de sabbat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « son grabat ». Le mot grec désigne un couchage simple et transportable, tel qu’une natte, une paillasse ou un petit matelas, et non nécessairement un lit au sens moderne.
    reason: lexical_alternative
  - marker: b
    text: Ou « marchait ». L’imparfait grec peut souligner une action qui se prolonge; dans ce contexte, il peut aussi présenter le commencement de la marche après la guérison.
    reason: lexical_alternative
  - marker: c
    text: 'Ou « c’était le sabbat ». Littéralement : « Or, c’était sabbat ce jour-là ».'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: Aussitôt
  rationale: Rend clairement le caractère immédiat de la guérison dans un registre narratif naturel.
- source_word: ἐγένετο ὑγιὴς
  choice: retrouva la santé
  rationale: Exprime naturellement en français le passage à un état de bonne santé, sans expliciter dans la forme verbale un agent que le grec ne nomme pas.
- source_word: ὁ ἄνθρωπος
  choice: l’homme
  rationale: Correspond au nom masculin singulier désignant ici l’homme mentionné dans le récit.
- source_word: ἦρε
  choice: prit
  rationale: Verbe français simple et idiomatique pour l’action de prendre et d’emporter la natte.
- source_word: κράβαττον
  choice: natte
  rationale: Désigne un couchage simple et transportable plutôt qu’un lit conçu comme un meuble.
- source_word: περιεπάτει
  choice: se mit à marcher
  rationale: Lecture inchoative possible de l’imparfait grec, bien adaptée au contexte où l’homme vient de recouvrer l’usage de ses jambes; la valeur durative demeure signalée en note.
- source_word: Ἦν δὲ
  choice: Or, c’était
  rationale: « Or » introduit naturellement la précision narrative portée par δέ sans lui donner une valeur fortement adversative.
- source_word: σάββατον
  choice: un jour de sabbat
  rationale: Formulation française naturelle pour le substantif grec sans article, qui identifie la nature de ce jour et prépare la controverse suivante.
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: ce jour-là
  rationale: Équivalent français idiomatique et précis de l’expression temporelle grecque.
theological_decisions:
- issue: Forme verbale de la guérison dans ἐγένετο ὑγιὴς
  choice: retrouva la santé
  alternative: fut guéri
  rationale: Le contexte attribue clairement la guérison à l’action de Jésus, mais la construction grecque décrit littéralement le changement d’état de l’homme plutôt que d’employer un passif exprimant directement l’action d’un agent.
- issue: Traduction de σάββατον dans la précision narrative
  choice: un jour de sabbat
  alternative: le sabbat
  rationale: Le grec est sans article et présente ici la qualité particulière de ce jour. La traduction retenue reste naturelle en français sans transformer cette précision en affirmation théologique plus déterminée.
translation_notes:
  register: Français international actuel, clair et digne. La phrase conserve la rapidité de la succession narrative, tandis que « natte » évite l’image moderne d’un lit-meuble. « Or » marque sobrement la transition vers la précision décisive concernant le sabbat.
