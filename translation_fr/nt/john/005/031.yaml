  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: fr
  text: Si je témoigne à mon propre sujet, mon témoignage n’est pas vrai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « mon témoignage n’est pas valable », dans le contexte juridique de la validité des témoignages.'
    reason: Alternative lexicale et contextuelle pour ἀληθής.
lexical_decisions:
- source_word: Ἐὰν
  choice: Si
  rationale: Introduit naturellement une proposition conditionnelle, sans ajouter de nuance itérative.
- source_word: ἐγὼ
  choice: je
  rationale: Le pronom grec explicite souligne légèrement Jésus comme sujet; en français, cette mise en relief demeure perceptible dans la construction conditionnelle.
- source_word: μαρτυρῶ
  choice: témoigne
  rationale: Terme courant qui conserve le champ sémantique du témoignage et sa possible portée juridique.
- source_word: περὶ ἐμαυτοῦ
  choice: à mon propre sujet
  rationale: Rend directement l’idée de parler ou de témoigner au sujet de soi-même, sans imposer la nuance plus interprétative «en ma faveur».
- source_word: ἡ μαρτυρία μου
  choice: mon témoignage
  rationale: Maintient le lien lexical avec «témoigne» et convient au cadre probatoire du passage.
- source_word: οὐκ ἔστιν ἀληθής
  choice: n’est pas vrai
  rationale: Rend directement ἀληθής et préserve la tension avec Jean 8.14; la possibilité du sens juridique «n’est pas valable» est indiquée en note plutôt qu’intégrée au texte.
theological_decisions:
- issue: Sens de l’affirmation selon laquelle le témoignage de Jésus «n’est pas vrai»
  choice: Conserver la formulation directe «mon témoignage n’est pas vrai».
  alternative: «mon témoignage n’est pas valable» ou «n’est pas recevable»
  rationale: Le grec emploie ἀληθής, «vrai», tout en s’inscrivant dans un contexte de témoignage à valeur juridique. La traduction principale préserve donc la tension théologique et discursive sans la résoudre par une paraphrase juridique.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition «témoigne / témoignage» reproduit le lien lexical grec. Le marqueur [a] est placé après la proposition qu’il précise.
