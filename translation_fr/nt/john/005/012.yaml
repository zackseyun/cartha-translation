  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: fr
  text: 'Ils lui demandèrent donc : « Qui est l’homme qui t’a dit : “Prends-le[a] et marche” ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Prends et marche. » L’objet de « prends » n’est pas exprimé en grec ; le pronom reprend le grabat mentionné dans le contexte précédent.'
    reason: Le grec laisse l’objet de Ἆρον implicite ; le français l’explicite par « le ».
lexical_decisions:
- source_word: ἠρώτησαν
  choice: ils demandèrent
  rationale: L’aoriste de ἐρωτάω indique ici une question ponctuelle. « Demandèrent » est naturel en français narratif sans ajouter une nuance d’hostilité.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence et la continuité avec le verset précédent ; « donc » conserve clairement ce lien.
- source_word: αὐτόν
  choice: lui
  rationale: Le pronom renvoie à l’homme guéri et se rend naturellement comme complément de « demandèrent ».
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: Qui est l’homme
  rationale: Cette formulation directe conserve l’interrogation grecque et désigne un individu masculin précis.
- source_word: ὁ εἰπών σοι
  choice: qui t’a dit
  rationale: Le participe aoriste attributif identifie l’homme par les paroles qu’il a prononcées auparavant.
- source_word: Ἆρον
  choice: Prends-le
  rationale: L’impératif de αἴρω signifie prendre ou soulever. Le pronom masculin « le », exigé par le français, reprend implicitement le brancard mentionné dans le contexte précédent.
- source_word: καὶ περιπάτει
  choice: et marche
  rationale: « Marche » rend naturellement l’impératif présent sans surinterpréter sa valeur aspectuelle.
