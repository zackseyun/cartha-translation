revisions:
- from: 'Alors Jésus leur répondit : « Oui, je vous le dis, c’est la vérité : le Fils ne peut rien faire de lui-même, sauf ce qu’il voit le Père faire[a] ; car tout ce que fait le Père, le Fils aussi le fait de la même manière[b]. »'
  to: 'Alors Jésus leur répondit et leur dit : « En vérité, en vérité, je vous le dis, le Fils ne peut rien faire de lui-même, à moins qu’il ne voie le Père faire quelque chose ; car tout ce que fait celui-ci, le Fils aussi le fait de même. »'
  rationale: La révision rétablit le double « En vérité » correspondant à Ἀμὴν ἀμὴν, rend explicitement la condition d’exception et l’indéfini de ἐὰν μή τι βλέπῃ, et conserve le parallélisme entre l’action du Père et celle du Fils. « Celui-ci » rend l’accent démonstratif de ἐκεῖνος de façon naturelle en français. Les notes non nécessaires sont supprimées avec leurs ancres.
