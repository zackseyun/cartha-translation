source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: fr
  text: 'Alors Jésus leur répondit et leur dit : « En vérité, en vérité, je vous le dis, le Fils ne peut rien faire de lui-même, à moins qu’il ne voie le Père faire quelque chose ; car tout ce que fait celui-ci, le Fils aussi le fait de même. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: Alors Jésus leur répondit
  rationale: « Alors » assure naturellement la liaison narrative de οὖν. En français, « répondit » rend idiomatiquement l’ensemble « répondit et leur disait », dont la reproduction littérale serait lourde sans apporter ici de nuance claire.
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: Oui, je vous le dis, c’est la vérité
  rationale: Cette formule française actuelle conserve la solennité, l’insistance et l’affirmation de véracité du double ἀμήν sans recourir à une translittération peu transparente.
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  choice: le Fils ne peut rien faire de lui-même
  rationale: « Ne peut rien » rend directement l’incapacité exprimée par οὐ δύναται…οὐδέν, tandis que « de lui-même » conserve la formulation relationnelle de ἀφ’ ἑαυτοῦ.
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: sauf ce qu’il voit le Père faire
  rationale: La tournure française exprime naturellement l’exception et relie τι à l’activité observée du Père, sans ajouter un objet déterminé absent du grec.
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: car tout ce que fait le Père
  rationale: « Tout ce que » rend la valeur généralisante de la relative avec ἄν. Répéter « le Père » évite le peu naturel « celui-là » tout en maintenant clairement le référent emphatique ἐκεῖνος.
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: le Fils aussi le fait de la même manière
  rationale: La formulation conserve à la fois καί, qui associe le Fils à l’action, et ὁμοίως, qui affirme une correspondance de manière, sans la réduire au seul « fait de même ».
theological_decisions:
- issue: L’incapacité du Fils et sa relation au Père dans l’action
  choice: le Fils ne peut rien faire de lui-même
  alternative: le Fils ne peut rien faire tout seul
  rationale: La traduction maintient sans l’atténuer l’énoncé d’incapacité et de dépendance relationnelle. Elle n’ajoute ni « de sa propre initiative » ni une explication ontologique qui résoudrait la tension théologique au-delà du texte.
- issue: Correspondance entre les œuvres du Père et celles du Fils
  choice: tout ce que fait le Père, le Fils aussi le fait de la même manière
  alternative: tout ce que fait celui-là, le Fils le fait pareillement
  rationale: La répétition explicite du Père clarifie le référent en français, tandis que « aussi » et « de la même manière » préservent la portée remarquable de l’affirmation sur l’unité d’action.
- issue: Majuscules aux titres relationnels
  choice: le Fils / le Père
  alternative: le fils / le père
  rationale: Dans ce contexte, ces noms désignent spécifiquement Jésus et Dieu dans leur relation réciproque. Les majuscules signalent cet emploi titulaire sans ajouter une interprétation au contenu de la phrase.
translation_notes:
  register: Français international moderne, naturel et digne. La formule introductive solennelle évite le calque « Amen, amen », tandis que le corps de la déclaration reste assez formel pour préserver la densité théologique et le parallélisme johannique.
