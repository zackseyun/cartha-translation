review_pass:
  verdict: revise
  source_fidelity: Le sens central est bien rendu, mais la formule « Oui, je vous le dis, c’est la vérité » ne préserve pas suffisamment la répétition solennelle de Ἀμὴν ἀμὴν. La construction grecque conditionnelle ἐὰν μή τι βλέπῃ est plus exactement rendue par « à moins qu’il ne voie le Père faire quelque chose » que par « sauf ce qu’il voit le Père faire ».
  naturalness: Le français du projet est globalement naturel, mais « En vérité, en vérité, je vous le dis » est à la fois idiomatique dans un registre biblique moderne et plus fidèle à la formule johannique. « Le Fils aussi fait de même » est plus fluide que « le Fils aussi le fait de la même manière », tout en conservant la correspondance exprimée par ὁμοίως.
  terminology: Les majuscules à « le Fils » et « le Père » conviennent au contexte johannique. « De lui-même » transmet bien ἀφ’ ἑαυτοῦ, sans ajouter l’idée interprétative de seule initiative personnelle.
  issues:
  - severity: medium
    issue: La double formule Ἀμὴν ἀμὴν est paraphrasée plutôt que reproduite dans son insistance.
    rationale: « Oui, je vous le dis, c’est la vérité » affirme la véracité, mais ne fait plus entendre clairement le redoublement emphatique. « En vérité, en vérité » conserve cette caractéristique et reste compréhensible en français moderne.
  - severity: low
    issue: La note a décrit comme plus proche du grec une formulation qui rend plus directement la subordonnée d’exception que le texte principal.
    rationale: Il est préférable de placer cette formulation dans le texte, où elle maintient le caractère indéfini de τι (« quelque chose »), puis de supprimer une note devenue inutile.
  - severity: low
    issue: La note b offre une explication théologique qui dépasse la fonction nécessaire d’une note textuelle.
    rationale: Le verset peut exprimer son parallélisme sans commentaire interprétatif; supprimer la note évite d’orienter la réception doctrinale du texte.
  revised_text: 'Alors Jésus leur répondit et leur dit : « En vérité, en vérité, je vous le dis, le Fils ne peut rien faire de lui-même, à moins qu’il ne voie le Père faire quelque chose ; car tout ce que fait celui-ci, le Fils aussi le fait de même. »'
