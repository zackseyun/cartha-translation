id: JHN.5.39
reference: John 5:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: fr
  text: Vous examinez les Écritures parce que vous pensez avoir en elles la vie éternelle[a] ; ce sont précisément elles qui témoignent à mon sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Examinez les Écritures », si l’on comprend Ἐραυνᾶτε comme un impératif plutôt que comme un indicatif.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: Vous examinez
  rationale: La forme grecque peut être un indicatif ou un impératif. Dans le contexte, l’indicatif décrit naturellement la pratique actuelle des interlocuteurs de Jésus. « Examiner » rend l’idée d’une recherche attentive ; l’impératif possible est conservé en note.
- source_word: τὰς γραφάς
  choice: les Écritures
  rationale: Dans ce contexte johannique, le terme désigne les écrits sacrés d’Israël ; « les Écritures » est l’équivalent français usuel et précis.
- source_word: ὅτι
  choice: parce que
  rationale: 'La conjonction est comprise dans son sens causal : leur conviction de posséder la vie éternelle dans les Écritures motive leur examen.'
- source_word: δοκεῖτε
  choice: vous pensez
  rationale: Cette formulation courante exprime leur conviction ou supposition sans accentuer indûment la critique.
- source_word: ἐν αὐταῖς
  choice: en elles
  rationale: Le pronom renvoie aux Écritures et conserve directement la valeur locative de ἐν, sans transformer le texte en « par elles ».
- source_word: ζωὴν αἰώνιον
  choice: la vie éternelle
  rationale: C’est l’expression française établie qui correspond au vocabulaire johannique.
- source_word: ἐκεῖναί
  choice: ce sont précisément elles
  rationale: La tournure reprend explicitement « les Écritures » par le pronom féminin et rend l’emphase du démonstratif grec.
- source_word: αἱ μαρτυροῦσαι
  choice: qui témoignent
  rationale: « Témoigner » est naturel en français et préserve la nuance de témoignage, importante dans l’Évangile selon Jean.
- source_word: περὶ ἐμοῦ
  choice: à mon sujet
  rationale: Cette expression rend naturellement περί avec le génitif tout en conservant le sens « concernant moi ».
theological_decisions:
- issue: Mode de Ἐραυνᾶτε
  choice: 'Indicatif : « Vous examinez les Écritures »'
  alternative: 'Impératif : « Examinez les Écritures »'
  rationale: 'La forme grecque admet les deux analyses. Le contexte immédiat favorise l’indicatif : Jésus décrit la pratique de ses interlocuteurs et souligne qu’ils ne reconnaissent pas celui dont les Écritures témoignent. La note conserve toutefois l’impératif comme possibilité réelle.'
translation_notes:
  register: Français international moderne, digne et accessible. Le vouvoiement pluriel correspond au groupe auquel Jésus s’adresse. La formulation évite de résoudre l’ambiguïté grammaticale en silence et maintient le lien explicite entre les Écritures et leur témoignage au sujet de Jésus.
