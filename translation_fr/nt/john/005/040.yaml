  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: fr
  text: Pourtant, vous ne voulez pas venir à moi pour avoir la vie[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et vous ne voulez pas venir à moi pour avoir la vie. » La conjonction grecque peut aussi se traduire simplement par « et ».'
    reason: lexical_alternative
  - marker: b
    text: Dans l’Évangile selon Jean, « la vie » désigne souvent, dans un sens plus riche, la vie qui vient de Dieu, c’est-à-dire la vie éternelle, bien que le mot « éternelle » ne figure pas ici.
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: Pourtant
  rationale: 'Bien que καί signifie le plus souvent « et », le contexte lui donne ici une valeur adversative : malgré le témoignage des Écritures, les interlocuteurs ne viennent pas à Jésus. « Pourtant » exprime naturellement ce contraste.'
- source_word: οὐ θέλετε
  choice: vous ne voulez pas
  rationale: θέλω exprime la volonté ou le désir. « Vous ne voulez pas » est direct et naturel en français, tout en évitant la nuance plus forte de « vous refusez ».
- source_word: ἐλθεῖν πρός με
  choice: venir à moi
  rationale: L’infinitif ἐλθεῖν suivi de πρός avec l’accusatif signifie idiomatiquement « venir à » quelqu’un. Cette formulation conserve l’image johannique sans la paraphraser par « croire en moi ».
- source_word: ἵνα
  choice: pour
  rationale: Avec deux infinitifs coordonnés naturellement en français, « venir à moi pour avoir » rend clairement la finalité exprimée par ἵνα, sans lourdeur.
- source_word: ζωὴν
  choice: la vie
  rationale: ζωή signifie « vie ». Dans Jean, le terme évoque souvent la vie venant de Dieu, voire la vie éternelle, mais αἰώνιος n’est pas exprimé ici.
- source_word: ἔχητε
  choice: avoir
  rationale: Après « pour », l’infinitif français rend naturellement la proposition finale grecque ἵνα suivie du subjonctif, sans introduire une idée supplémentaire d’incertitude.
theological_decisions:
- issue: Faut-il rendre ζωὴν par « la vie » ou par « la vie éternelle » ?
  choice: la vie
  alternative: la vie éternelle
  rationale: Le contexte johannique donne à « vie » une profondeur salvifique, mais le qualificatif « éternelle » ne figure pas dans ce verset. Le texte principal conserve donc la formulation grecque sans explicitation doctrinale.
- issue: Faut-il interpréter « venir à moi » comme « croire en moi » dans le texte principal ?
  choice: venir à moi
  alternative: croire en moi
  rationale: Chez Jean, venir à Jésus est étroitement lié à la foi, mais le grec emploie concrètement le verbe « venir ». Le conserver maintient l’image et son amplitude théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation directe garde la force du reproche adressé au pluriel. « Pour avoir » rend la finalité avec fluidité, tandis que les notes préservent l’alternative connective et la portée johannique de « la vie ».
