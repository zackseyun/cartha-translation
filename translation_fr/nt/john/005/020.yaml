id: JHN.5.20
reference: John 5:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: fr
  text: Car le Père aime le Fils et lui montre tout ce qu’il fait lui-même ; il lui montrera des œuvres plus grandes que celles-ci, afin que vous soyez émerveillés.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « si bien que vous serez émerveillés ». En grec, ἵνα suivi du subjonctif peut exprimer un but et, dans ce contexte, peut aussi laisser entendre l’émerveillement qui en résultera chez les auditeurs de Jésus.
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: aime
  rationale: « Aime » exprime naturellement la relation affective entre le Père et le Fils sans affaiblir φιλέω ni lui imposer une distinction rigide par rapport à ἀγαπάω dans Jean.
- source_word: δείκνυσιν ... δείξει
  choice: montre ... montrera
  rationale: La répétition du même verbe français conserve le lien lexical et le passage du présent au futur dans le grec.
- source_word: πάντα
  choice: tout
  rationale: « Tout » rend directement la portée globale de πάντα et s’intègre naturellement à la proposition relative.
- source_word: ἃ αὐτὸς ποιεῖ
  choice: ce qu’il fait lui-même
  rationale: « Lui-même » représente l’emphase de αὐτός. Le présent français demeure ouvert à une action habituelle ou en cours, sans surdéterminer l’aspect.
- source_word: μείζονα τούτων ... ἔργα
  choice: des œuvres plus grandes encore que celles-ci
  rationale: « Œuvres » conserve le vocabulaire johannique chargé de sens pour les actes de Jésus ; « encore » rend idiomatiquement la progression annoncée sans ajouter un nouvel objet.
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: afin que vous soyez dans l’émerveillement
  rationale: Cette formulation naturelle et digne garde la valeur de visée de ἵνα avec le subjonctif, tout en laissant perceptible l’effet attendu sur les auditeurs.
theological_decisions:
- issue: Nature de l’amour du Père pour le Fils exprimé par φιλέω
  choice: Traduire simplement par « aime ».
  alternative: « éprouve de l’affection pour »
  rationale: Dans Jean, φιλέω et ἀγαπάω peuvent se recouvrir. Une traduction plus faible introduirait une distinction théologique que ce passage n’exige pas.
- issue: Valeur de ἵνα ὑμεῖς θαυμάζητε
  choice: « afin que vous soyez dans l’émerveillement »
  alternative: « si bien que vous serez dans l’émerveillement »
  rationale: « Afin que » préserve la construction de visée, tandis que la note signale que le contexte peut aussi laisser entendre le résultat effectif. Le pluriel « vous » désigne les auditeurs de Jésus.
translation_notes:
  register: Français international moderne, naturel et digne. « Œuvres » maintient le registre théologique johannique ; « être dans l’émerveillement » reste accessible tout en évitant le caractère vieilli de « s’émerveiller » dans certains usages.
