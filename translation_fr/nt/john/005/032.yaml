id: JHN.5.32
reference: John 5:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: fr
  text: Il y a un autre qui témoigne à mon sujet[a], et je sais que le témoignage qu’il rend à mon sujet est vrai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui rend témoignage à mon sujet ».
    reason: Variante lexicale qui fait ressortir plus explicitement le lien entre le verbe μαρτυρέω et le nom μαρτυρία.
lexical_decisions:
- source_word: ἄλλος
  choice: un autre
  rationale: Cette expression rend directement l’idée d’une autre personne tout en maintenant le contraste avec le propre témoignage de Jésus. La tournure « Il y en a un autre » est naturelle en français et ne précise pas l’identité du témoin.
- source_word: ὁ μαρτυρῶν
  choice: qui témoigne
  rationale: Le participe présent substantivé désigne celui qui témoigne. La relative française est fluide et conserve la valeur verbale durative du grec.
- source_word: περὶ ἐμοῦ
  choice: à mon sujet
  rationale: Avec le génitif, περί indique ici ce sur quoi porte le témoignage. « À mon sujet » est idiomatique et convient au registre digne du passage.
- source_word: οἶδα
  choice: je sais
  rationale: Traduction directe et courante du verbe grec de connaissance.
- source_word: ἀληθής
  choice: vrai
  rationale: Le mot qualifie ici le témoignage comme conforme à la vérité. « Vrai » préserve cette affirmation sans la réduire à la seule sincérité ni l’interpréter comme validité juridique.
- source_word: ἡ μαρτυρία
  choice: le témoignage
  rationale: Ce terme conserve la dimension testimoniale, voire judiciaire, du contexte et le lien lexical avec le verbe μαρτυρέω.
- source_word: ἣν μαρτυρεῖ
  choice: qu’il rend
  rationale: En français, « le témoignage qu’il rend » est naturel et maintient le lien sémantique entre le nom et le verbe. Une reproduction mécanique telle que « le témoignage qu’il témoigne » serait incorrecte et obscure.
theological_decisions:
- issue: Identité de « l’autre » (ἄλλος)
  choice: Maintenir la désignation indéfinie « un autre » sans identifier son référent.
  alternative: Identifier explicitement cet autre comme Jean-Baptiste, le Père ou un autre témoin au sens juridique.
  rationale: Le verset lui-même ne nomme pas ce témoin. La traduction conserve donc l’ambiguïté du texte, sans trancher une question que le contexte plus large laisse à l’interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation garde l’indétermination du référent et la répétition conceptuelle autour du témoignage, tout en évitant une construction non idiomatique en français.
