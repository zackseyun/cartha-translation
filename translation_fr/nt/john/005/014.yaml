id: JHN.5.14
reference: John 5:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: fr
  text: 'Après cela, Jésus le trouva dans le temple et lui dit : « Te voilà guéri. Ne pèche plus, de peur qu’il ne t’arrive quelque chose de pire. »[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’avertissement ne précise pas si la maladie antérieure avait été causée par un péché particulier, ni si « quelque chose de pire » désigne une souffrance dans la vie présente, le jugement final, ou les deux.
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: Après cela
  rationale: Rend naturellement en français la progression narrative exprimée par le pluriel grec, sans imposer un long intervalle.
- source_word: εὑρίσκει
  choice: trouva
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit écrit en français.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le temple
  rationale: ἱερόν désigne l’ensemble du domaine du temple, et non seulement le sanctuaire intérieur; « temple » reste ici la formulation concise et usuelle.
- source_word: Ἴδε ὑγιὴς γέγονας
  choice: Te voilà guéri
  rationale: Cette tournure française conserve l’appel à constater la nouvelle condition de l’homme ainsi que l’état résultant exprimé par le parfait γέγονας.
- source_word: μηκέτι ἁμάρτανε
  choice: Ne pèche plus
  rationale: Expression directe et naturelle qui garde l’idée de cesser de pécher sans surinterpréter l’aspect du présent impératif.
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: de peur qu’il ne t’arrive quelque chose de pire
  rationale: Rend clairement la mise en garde et l’éventualité négative; le ne explétif appartient au français soigné et ne change pas le sens.
theological_decisions:
- issue: Lien entre le péché et la souffrance dans l’avertissement de Jésus
  choice: Conserver l’avertissement direct contre le péché et la possibilité d’un malheur pire, sans préciser davantage leur rapport.
  alternative: Affirmer que la maladie antérieure résultait nécessairement d’un péché précis, ou identifier le malheur pire exclusivement à une souffrance temporelle ou au jugement final.
  rationale: Le grec établit un lien d’avertissement entre le péché futur et quelque chose de pire, mais il ne définit ni la cause exacte de la maladie passée ni la nature du malheur envisagé.
translation_notes:
  register: Français international moderne, digne et accessible. « Te voilà guéri » est idiomatique tout en préservant la force de Ἴδε et l’état résultant du parfait. Le passé simple convient au registre narratif biblique écrit sans être archaïque.
