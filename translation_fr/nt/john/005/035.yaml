id: JHN.5.35
reference: John 5:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: fr
  text: Il était, lui, la lampe qui brûlait et brillait ; mais vous, vous avez voulu vous réjouir pour un temps[a] dans sa lumière.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « pour une heure » ; l’expression désigne ici une durée limitée, pas nécessairement soixante minutes.'
    reason: Précision sur l’expression temporelle grecque πρὸς ὥραν et conservation de son image littérale.
lexical_decisions:
- source_word: ἐκεῖνος
  choice: Lui, il
  rationale: La dislocation met naturellement en relief le démonstratif emphatique grec tout en gardant une tournure française actuelle.
- source_word: λύχνος
  choice: la lampe
  rationale: Le terme désigne une lampe, et non la lumière abstraite ; ce choix maintient la distinction entre Jean, qui éclaire comme témoin, et la lumière elle-même.
- source_word: ὁ καιόμενος καὶ φαίνων
  choice: qui brûlait et brillait
  rationale: Les deux participes présents associés à l’imparfait ἦν décrivent l’activité continue de la lampe. La coordination est naturelle en français et conserve les deux images.
- source_word: ἠθελήσατε
  choice: vous avez voulu
  rationale: Cette formulation rend directement la volonté ou le désir exprimé par l’aoriste, sans suggérer nécessairement une disposition durable.
- source_word: ἀγαλλιαθῆναι
  choice: vous réjouir
  rationale: Le verbe exprime une joie vive ; « se réjouir » reste digne, clair et idiomatique en français moderne.
- source_word: πρὸς ὥραν
  choice: pendant quelque temps
  rationale: L’expression indique une durée limitée sans imposer le sens littéral d’une heure.
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: à sa lumière
  rationale: « Se réjouir à sa lumière » rend naturellement en français le fait de trouver sa joie dans l’éclairage apporté par Jean, tout en préservant la métaphore.
theological_decisions:
- issue: Distinction métaphorique entre Jean et Jésus dans le langage johannique de la lumière
  choice: Jean est appelé « la lampe », et non « la lumière ».
  alternative: Jean était la lumière.
  rationale: Le grec emploie λύχνος, non φῶς. La traduction maintient ainsi le rôle subordonné de Jean comme témoin qui éclaire, sans ajouter d’interprétation doctrinale au texte.
translation_notes:
  register: Français international moderne, clair et digne. Les reprises « Lui, il » et « vous, vous » rendent l’emphase et le contraste du grec sans lourdeur excessive. Le point-virgule marque nettement l’opposition introduite par δέ.
