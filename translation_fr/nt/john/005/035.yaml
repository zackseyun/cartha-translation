revisions:
- from: Lui, il était la lampe qui brûlait et brillait ; et vous, vous avez voulu vous réjouir pendant quelque temps[a] à sa lumière.
  to: Il était, lui, la lampe qui brûlait et brillait ; mais vous, vous avez voulu vous réjouir pour un temps[a] dans sa lumière.
  rationale: La révision rétablit le contraste de δέ par « mais », rend ἐν par « dans » et améliore légèrement la formulation emphatique française. Elle ne modifie ni le sens, ni l’ambiguïté temporelle, ni la distinction métaphorique entre la lampe et la lumière.
