id: JHN.5.44
reference: John 5:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: fr
  text: Comment pouvez-vous croire, alors que vous recevez de la gloire les uns des autres et que vous ne recherchez pas la gloire qui vient du Dieu unique[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « honneur » pour les deux occurrences de « gloire » ; on peut aussi traduire « du seul Dieu ».
    reason: Signaler les principales possibilités lexicales de δόξα et de μόνος sans rompre dans le texte la répétition du terme grec.
lexical_decisions:
- source_word: πῶς δύνασθε ... πιστεῦσαι
  choice: Comment pouvez-vous croire
  rationale: Cette formulation française naturelle conserve la question rhétorique portant sur la possibilité, sans expliciter davantage la cause ni transformer la question en affirmation.
- source_word: ὑμεῖς
  choice: vous qui
  rationale: Le pronom grec est explicite et emphatique. La reprise « vous qui » restitue sobrement cette mise en relief en français sans recourir au plus appuyé « vous-mêmes ».
- source_word: δόξαν
  choice: votre gloire / la gloire
  rationale: « Gloire » maintient la répétition lexicale et le contraste entre la gloire d'origine humaine et celle qui vient de Dieu. Le possessif dans la première occurrence rend l'expression idiomatique sans changer la source indiquée par le grec.
- source_word: παρ’ ἀλλήλων λαμβάνοντες
  choice: qui recevez votre gloire les uns des autres
  rationale: La relative rend naturellement le participe grec et conserve à la fois l'idée de réception et la réciprocité.
- source_word: καὶ ... οὐ ζητεῖτε
  choice: et qui ne recherchez pas
  rationale: Une seconde relative coordonnée produit une phrase française claire tout en maintenant le contraste avec la conduite précédente.
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: la gloire qui vient du Dieu unique
  rationale: La relative restitue clairement l'origine exprimée par παρά. « Le Dieu unique » exprime directement l'exclusivité de μόνος dans un français naturel et digne.
theological_decisions:
- issue: Sens de πιστεῦσαι dans le contexte johannique
  choice: croire
  alternative: mettre sa confiance
  rationale: « Croire » demeure assez large pour inclure la confiance sans imposer une précision doctrinale absente du verbe dans ce verset.
- issue: Répétition de δόξα
  choice: gloire aux deux occurrences
  alternative: honneur aux deux occurrences
  rationale: La répétition de « gloire » préserve le parallélisme et la tension entre reconnaissance humaine et gloire provenant de Dieu. « Honneur » reste une possibilité contextuelle signalée en note.
- issue: Portée de τοῦ μόνου θεοῦ
  choice: du Dieu unique
  alternative: du seul Dieu
  rationale: « Dieu unique » affirme l'exclusivité indiquée par μόνος sans ajouter de développement christologique ou confessionnel. « Du seul Dieu » est également possible, mais peut momentanément se lire comme « de Dieu seulement ».
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe en « vous qui… et qui… » rend l'emphase du pronom et les relations participiales grecques sans lourdeur excessive.
