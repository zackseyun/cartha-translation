id: JHN.5.45
reference: John 5:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: fr
  text: Ne pensez pas que c’est moi qui vous accuserai devant le Père[a]. Celui qui vous accuse, c’est Moïse[b], en qui vous avez mis votre espérance.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ne supposez pas que je porterai une accusation contre vous devant le Père. »'
    reason: lexical_alternative
  - marker: b
    text: Moïse — précisément celui en qui ils plaçaient leur confiance, notamment comme médiateur et témoin de la Loi — se trouve ainsi être leur accusateur.
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: Ne pensez pas
  rationale: Cette tournure rend naturellement en français l’interdiction exprimée par μή avec l’impératif présent, tout en conservant la franchise de l’avertissement.
- source_word: κατηγορήσω
  choice: j’accuserai
  rationale: 'Le verbe a un sens juridique : accuser ou porter une accusation. « Accuser » préserve cette portée sans aller jusqu’à « condamner ».'
- source_word: πρὸς τὸν πατέρα
  choice: devant le Père
  rationale: Dans ce contexte d’accusation, « devant » évoque naturellement la comparution en présence du Père et maintient l’image judiciaire.
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: Celui qui vous accuse, c’est
  rationale: Cette formulation française naturelle met l’accusateur en relief et conserve la valeur présente du participe grec.
- source_word: Μωϋσῆς
  choice: Moïse
  rationale: Forme française usuelle du nom biblique.
- source_word: εἰς ὃν
  choice: en qui
  rationale: Le complément de ἐλπίζω désigne directement la personne en qui l’espérance est placée; la formulation n’ajoute pas explicitement la Loi ou les écrits de Moïse.
- source_word: ἠλπίκατε
  choice: vous avez mis votre espérance
  rationale: Le passé composé associé à cette expression rend l’acte antérieur et la confiance qui en résulte, conformément à la valeur du parfait grec.
theological_decisions:
- issue: Portée judiciaire de l’accusation
  choice: « accuser »
  alternative: « condamner »
  rationale: κατηγορέω désigne l’accusation, non le verdict final. La traduction conserve donc l’imagerie judiciaire sans introduire une condamnation que le verbe n’énonce pas.
- issue: Objet de l’espérance placée en Moïse
  choice: « en qui vous avez mis votre espérance »
  alternative: « dans la Loi de Moïse » ou « dans les écrits de Moïse »
  rationale: Le grec nomme directement Moïse. Même si le contexte inclut ses écrits et son rôle de médiateur de la Loi, les préciser dans le corps du texte réduirait l’ambiguïté voulue.
- issue: Contraste entre Jésus et Moïse comme accusateur
  choice: « ce n’est pas moi » est exprimé par « c’est moi qui » sous la négation, puis Moïse est mis en relief
  alternative: Formulation neutre sans mise en relief
  rationale: La construction grecque met ἐγώ en contraste avec Moïse. La tournure française « ce n’est pas moi qui… Celui qui…, c’est Moïse » préserve nettement ce contraste.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe met en relief le contraste entre Jésus et Moïse, tandis que le vocabulaire juridique demeure compréhensible sans devenir technique.
