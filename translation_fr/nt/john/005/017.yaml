source:
  edition: SBLGNT
  text: ὁ ⸀δὲ ἀπεκρίνατο αὐτοῖς· Ὁ πατήρ μου ἕως ἄρτι ἐργάζεται κἀγὼ ἐργάζομαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: fr
  text: 'Mais il leur répondit : « Mon Père est à l’œuvre jusqu’à présent, et moi aussi, je suis à l’œuvre. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: La particule marque ici un léger contraste avec l’accusation précédente; « Mais » rend naturellement l’enchaînement en français.
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: il leur répondit
  rationale: Formulation française idiomatique et concise pour le verbe déponent accompagné du datif.
- source_word: Ὁ πατήρ μου
  choice: Mon Père
  rationale: Préserve la relation personnelle exprimée par Jésus ainsi que la portée divine de « Père » dans ce contexte.
- source_word: ἕως ἄρτι
  choice: jusqu’à présent
  rationale: Exprime la continuité de l’action jusqu’au moment où Jésus parle, sans laisser entendre qu’elle prend alors fin.
- source_word: ἐργάζεται
  choice: est à l’œuvre
  rationale: Rend le présent grec comme une activité continue, dans un français naturel et digne.
- source_word: κἀγὼ
  choice: et moi aussi
  rationale: Conserve explicitement la valeur additive de κἀγώ et souligne le parallèle avec l’activité du Père.
- source_word: ἐργάζομαι
  choice: je suis à l’œuvre
  rationale: Reproduit le parallélisme verbal avec le Père et la continuité de l’action présente.
theological_decisions:
- issue: Rapport entre l’œuvre de Jésus et celle du Père le jour du sabbat
  choice: 'Conserver le parallèle direct : « Mon Père est à l’œuvre […] et moi aussi, je suis à l’œuvre. »'
  alternative: « Mon Père œuvre jusqu’à présent, et moi aussi j’œuvre. »
  rationale: Le grec met délibérément en parallèle l’activité continue du Père et celle de Jésus. La traduction en préserve la force théologique sans expliquer davantage la question du sabbat, de la prérogative divine ou de l’égalité.
translation_notes:
  register: Français international moderne, courant et digne. « Être à l’œuvre » évite la lourdeur de « être en train de travailler » et convient à l’activité divine, tout en maintenant l’aspect continu des présents grecs.
