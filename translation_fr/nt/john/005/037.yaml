id: JHN.5.37
reference: John 5:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: fr
  text: Et le Père qui m’a envoyé, c’est lui qui a témoigné à mon sujet[a]. Vous n’avez jamais entendu sa voix ni vu sa forme[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il a lui-même témoigné à mon sujet ». Le démonstratif grec ἐκεῖνος met le Père en relief.
    reason: lexical_alternative
  - marker: b
    text: Ou « son apparence ». Le grec εἶδος peut désigner une forme visible ou une apparence.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: le Père qui m’a envoyé
  rationale: Le participe aoriste substantivé avec πατήρ a une valeur attributive, rendue naturellement en français par une proposition relative.
- source_word: ἐκεῖνος
  choice: c’est lui qui
  rationale: Cette tournure française actuelle et naturelle conserve l’insistance du démonstratif grec, qui reprend et met en relief le Père.
- source_word: μεμαρτύρηκεν
  choice: a témoigné
  rationale: Le passé composé rend clairement le témoignage accompli dont la portée demeure dans le contexte.
- source_word: περὶ ἐμοῦ
  choice: à mon sujet
  rationale: Cette expression rend naturellement περί avec le génitif sans ajouter d’interprétation.
- source_word: οὔτε ... οὔτε
  choice: ne ... jamais ... ni
  rationale: La corrélation négative grecque est exprimée idiomatiquement en français, πώποτε étant rendu par « jamais ».
- source_word: φωνὴν αὐτοῦ
  choice: sa voix
  rationale: « Voix » est ici l’équivalent direct de φωνή dans le contexte de l’audition.
- source_word: πώποτε ἀκηκόατε
  choice: n’avez jamais entendu
  rationale: Le passé composé français avec « jamais » traduit naturellement l’expérience niée jusqu’au présent.
- source_word: εἶδος αὐτοῦ
  choice: sa forme
  rationale: « Forme » conserve l’étendue sémantique de εἶδος et évite de préciser indûment la nature de cette perception visible.
- source_word: ἑωράκατε
  choice: avez ... vu
  rationale: Le passé composé s’accorde avec la valeur résultative du parfait grec et forme un parallèle avec « avez entendu ».
theological_decisions:
- issue: Insistance de ἐκεῖνος en référence au Père
  choice: « c’est lui qui a témoigné à mon sujet »
  alternative: « il a lui-même témoigné à mon sujet »
  rationale: La construction clivée garde l’emphase du démonstratif tout en restant plus naturelle en français que « celui-là »; elle n’ajoute aucune affirmation doctrinale.
- issue: Sens de εἶδος αὐτοῦ
  choice: « sa forme »
  alternative: « son apparence »
  rationale: « Forme » préserve l’ambiguïté entre forme visible et apparence perceptible, sans résoudre la tension théologique du texte.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « c’est lui qui » porte l’emphase sans la raideur de « celui-là ». La virgule finale est conservée puisque le verset se poursuit syntaxiquement.
