review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend fidèlement la structure et les termes principaux du grec : la double formule solennelle, « l’heure », « les morts », « la voix du Fils de Dieu » et la promesse de vie. Toutefois, « déjà là » ajoute l’idée d’antériorité (« déjà »), absente de καὶ νῦν ἐστιν, qui affirme simplement que l’heure est présente maintenant.'
  naturalness: Le français est moderne, clair et d’un registre digne. « L’heure vient, et elle est maintenant » est légèrement elliptique, mais cette ellipse est naturelle dans une proclamation solennelle et permet de conserver la tension du grec sans ajout interprétatif.
  terminology: « En vérité, en vérité », « l’heure », « les morts », « la voix du Fils de Dieu » et « vivront » sont appropriés. Le futur antérieur « auront entendue » rend de façon recevable l’antériorité du participe aoriste par rapport au futur principal; l’accord avec « voix » est correct.
  issues:
  - severity: medium
    issue: « et elle est déjà là »
    rationale: Le mot « déjà » n’est pas exprimé par νῦν (« maintenant »). Il oriente le lecteur vers une idée d’accomplissement déjà survenu, alors que le grec maintient plus sobrement l’affirmation paradoxale d’une heure qui vient et qui est maintenant présente.
