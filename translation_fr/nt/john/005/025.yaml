revisions:
- from: 'En vérité[a], en vérité, je vous le dis : l’heure vient[b] — et elle est déjà là — où les morts[c] entendront la voix du Fils de Dieu, et ceux qui l’auront entendue[d] vivront.'
  to: 'En vérité[a], en vérité, je vous le dis : l’heure vient[b], et elle est maintenant, où les morts[c] entendront la voix du Fils de Dieu, et ceux qui l’auront entendue[d] vivront.'
  rationale: La seule correction nécessaire consiste à supprimer « déjà », ajout sémantique non requis par le grec. La formulation révisée conserve volontairement la tension entre avenir (« vient ») et présence (« est maintenant »), sans décider si « les morts » désigne exclusivement une réalité spirituelle ou corporelle.
  reviewer_model: gpt-5.6-terra
