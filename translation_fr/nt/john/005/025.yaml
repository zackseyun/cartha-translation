id: JHN.5.25
reference: John 5:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: fr
  text: 'En vérité[a], en vérité, je vous le dis : l’heure vient[b], et elle est maintenant, où les morts[c] entendront la voix du Fils de Dieu, et ceux qui l’auront entendue[d] vivront.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de manière plus formelle : « Amen, amen, je vous le dis. »'
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « une heure vient » ; en français, « l’heure vient » est plus naturel. « Heure » peut désigner plus largement un moment ou un temps déterminé.
    reason: lexical_alternative
  - marker: c
    text: Ici, « les morts » peut avoir une portée spirituelle présente, puisque l’heure « est maintenant », tout en annonçant la résurrection corporelle dans le contexte immédiat.
    reason: cross_reference
  - marker: d
    text: 'Autre traduction possible : « ceux qui entendent vivront ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: En vérité, en vérité
  rationale: Rend clairement en français la formule solennelle et emphatique, tout en conservant sa répétition caractéristique chez Jean.
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formulation française naturelle et digne qui maintient l’adresse directe; le pronom « le » convient à l’expression française consacrée.
- source_word: ἔρχεται ὥρα
  choice: l’heure vient
  rationale: « Heure » préserve le terme johannique chargé de portée eschatologique. L’article défini est idiomatique en français dans cette tournure, malgré l’absence d’article en grec.
- source_word: καὶ νῦν ἐστιν
  choice: et elle est déjà là
  rationale: Expression française naturelle du paradoxe entre l’heure encore à venir et sa présence actuelle; elle maintient la tension entre accomplissement présent et futur.
- source_word: οἱ νεκροὶ
  choice: les morts
  rationale: Traduction directe qui ne tranche pas entre une portée spirituelle présente et la résurrection corporelle évoquée par le contexte.
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: entendront la voix
  rationale: « Voix » convient au contexte personnel, et « entendre » n’ajoute pas la nuance de réponse volontaire que pourrait suggérer « écouter ».
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: du Fils de Dieu
  rationale: Reproduit directement et pleinement le titre christologique grec dans sa formulation française traditionnelle.
- source_word: οἱ ἀκούσαντες
  choice: ceux qui l’auront entendue
  rationale: Le participe aoriste est rendu par le futur antérieur, qui marque naturellement en français l’antériorité de l’écoute par rapport au fait de vivre, sans imposer une interprétation supplémentaire.
- source_word: ζήσουσιν
  choice: vivront
  rationale: Rend simplement ζάω sans expliciter davantage l’idée de retour à la vie, ce qui préserve les résonances spirituelle et résurrectionnelle possibles.
theological_decisions:
- issue: Référent de « les morts » dans le contexte johannique
  choice: Conserver simplement « les morts »
  alternative: « ceux qui sont morts spirituellement » ou « les morts physiques »
  rationale: La précision « elle est déjà là » indique une dimension présente, tandis que le contexte de Jean 5 annonce aussi la résurrection corporelle. La traduction ne réduit pas cette tension à une seule lecture.
- issue: Titre christologique « le Fils de Dieu »
  choice: Maintenir « le Fils de Dieu » dans le texte principal
  alternative: « le Fils de Dieu » reformulé en « le Fils que Dieu a envoyé »
  rationale: La formulation retenue correspond directement au grec et n’ajoute aucune explication doctrinale étrangère au verset.
- issue: Rapport entre entendre et vivre
  choice: « ceux qui l’auront entendue vivront »
  alternative: « ceux qui entendent vivront »
  rationale: Le futur antérieur reflète la forme aoriste du participe et présente l’écoute de la voix comme antérieure à la vie promise, sans préciser si cette vie est uniquement présente ou future.
translation_notes:
  register: Français international moderne, digne et accessible. La cadence solennelle de la double affirmation est conservée. Les tirets mettent en relief, sans l’expliquer, la tension entre l’heure qui vient et sa présence actuelle.
