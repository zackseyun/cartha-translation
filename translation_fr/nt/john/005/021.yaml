id: JHN.5.21
reference: John 5:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: fr
  text: En effet, comme le Père relève les morts et leur donne la vie, de même le Fils donne la vie à ceux qu’il veut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rend vivants », pour les deux emplois de « donne la vie ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: En effet, comme
  rationale: « En effet » restitue la valeur explicative de γάρ, tandis que « comme » ouvre naturellement la comparaison exprimée par ὥσπερ.
- source_word: ὁ πατὴρ
  choice: le Père
  rationale: Titre désignant Dieu dans le contexte johannique; la majuscule maintient le parallèle avec « le Fils ».
- source_word: ἐγείρει τοὺς νεκρούς
  choice: relève les morts
  rationale: « Relever » exprime ici l’action de faire sortir les morts de la mort et convient au contexte de résurrection, sans ajouter de précision absente du grec.
- source_word: ζῳοποιεῖ
  choice: leur donne la vie / donne la vie
  rationale: La première occurrence prend naturellement « leur », qui reprend « les morts »; la seconde conserve la même expression. « Donner la vie » rend clairement l’action vivifiante du verbe.
- source_word: οὕτως καὶ
  choice: de même
  rationale: Formulation française idiomatique qui marque nettement la correspondance entre l’action du Père et celle du Fils.
- source_word: ὁ υἱὸς
  choice: le Fils
  rationale: Titre christologique en parallèle direct avec « le Père ».
- source_word: οὓς θέλει
  choice: à ceux qu’il veut
  rationale: Rend directement le pluriel relatif et la volonté exprimée par θέλει dans un français moderne, naturel et digne.
theological_decisions:
- issue: Parallèle entre le Père et le Fils dans le don de la vie
  choice: Préserver l’affirmation selon laquelle le Fils donne la vie de même que le Père
  alternative: Atténuer la comparaison par une paraphrase moins directe
  rationale: Le grec établit explicitement ce parallèle. La traduction le conserve sans développer ses implications théologiques au-delà du texte.
- issue: Portée de οὓς θέλει
  choice: « à ceux qu’il veut »
  alternative: « à ceux qu’il désire » ou « à ceux qu’il choisit »
  rationale: « Veut » préserve simplement la volonté souveraine exprimée par θέλει. « Choisit » préciserait un mécanisme que le texte ne formule pas, tandis que « désire » serait moins direct.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve le mouvement comparatif du grec. « Relève les morts » évite l’ambiguïté courante de « ressuscite les morts », qui pourrait être momentanément compris comme un emploi transitif de « ressusciter », tout en gardant la portée résurrectionnelle du contexte.
