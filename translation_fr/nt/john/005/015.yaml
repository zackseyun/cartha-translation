id: JHN.5.15
reference: John 5:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: fr
  text: L’homme s’en alla et rapporta aux Juifs que c’était Jésus qui l’avait guéri[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « aux responsables juifs » ou « aux Judéens », selon la manière dont on comprend dans ce contexte l’emploi par Jean de l’expression « les Juifs ».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: s’en alla
  rationale: L’aoriste de ἀπέρχομαι exprime le départ. « S’en alla » est naturel en français narratif et indique clairement que l’homme quitte les lieux.
- source_word: ὁ ἄνθρωπος
  choice: L’homme
  rationale: Le groupe nominal désigne l’homme guéri mentionné dans le contexte.
- source_word: ἀνήγγειλεν
  choice: rapporta
  rationale: ἀναγγέλλω signifie faire connaître, annoncer ou rapporter. « Rapporta » convient à la transmission d’une information sans suggérer nécessairement une proclamation publique.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: La formulation principale conserve le sens lexical direct de Ἰουδαῖοι. Dans Jean, le contexte peut toutefois viser plus précisément les responsables juifs ou les Judéens; cette ambiguïté est signalée en note.
- source_word: ὅτι
  choice: que
  rationale: Conjonction déclarative introduisant le contenu de ce que l’homme rapporte.
- source_word: Ἰησοῦς
  choice: Jésus
  rationale: Forme française habituelle du nom propre.
- source_word: ἐστιν
  choice: c’était
  rationale: Le présent grec se transpose naturellement par un imparfait dans le discours indirect français après le passé « rapporta ». La tournure présentative met en relief l’identification de Jésus.
- source_word: ὁ ποιήσας αὐτὸν ὑγιῆ
  choice: qui l’avait guéri
  rationale: Littéralement, l’expression désigne « celui qui l’avait rendu bien portant ». « Guéri » exprime naturellement en français le résultat de ποιέω avec l’adjectif ὑγιής, tandis que le plus-que-parfait marque l’antériorité de la guérison.
theological_decisions:
- issue: Référent de « les Juifs » dans l’Évangile selon Jean
  choice: Conserver « aux Juifs » dans le texte principal et signaler les nuances contextuelles en note.
  alternative: « aux responsables juifs » ou « aux Judéens »
  rationale: Ἰουδαίοις ne précise pas lexicalement qu’il s’agit des dirigeants, même si le contexte johannique peut le suggérer. Le texte principal préserve donc l’expression grecque sans trancher, et la note rend compte des interprétations contextuelles possibles.
translation_notes:
  register: Français international moderne, narratif et digne. « S’en alla » et « rapporta » restent courants sans être familiers. La tournure « c’était Jésus qui » rend naturellement la construction grecque d’identification, et « l’avait guéri » évite le calque peu idiomatique « l’avait rendu bien portant ».
