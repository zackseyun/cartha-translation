id: JHN.5.43
reference: John 5:43
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: fr
  text: Je suis venu au nom de mon Père[a], et vous ne me recevez pas. Si un autre vient en son propre nom[b], lui, vous le recevrez.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « avec l’autorité de mon Père ». L’expression grecque « au nom de » peut indiquer la représentation ou l’autorité, et pas seulement le nom lui-même.
    reason: lexical_alternative
  - marker: b
    text: Ou « de sa propre autorité ». L’expression « en son propre nom » forme un contraste marqué avec la venue de Jésus « au nom de mon Père ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: Je suis venu
  rationale: Le parfait grec exprime une venue accomplie dont l'effet demeure; le passé composé est ici la formulation française naturelle.
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: au nom de mon Père
  rationale: Cette expression française conserve l'image du nom ainsi que ses nuances de représentation et d'autorité, sans les réduire à une seule interprétation.
- source_word: οὐ λαμβάνετέ με
  choice: vous ne me recevez pas
  rationale: « Recevoir » rend le sens d'accueil et d'acceptation tout en maintenant la répétition rhétorique avec la dernière proposition.
- source_word: ἄλλος
  choice: un autre
  rationale: Traduction directe qui maintient le contraste avec Jésus sans préciser indûment l'identité de cet autre.
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: en son propre nom
  rationale: La formulation préserve le parallélisme avec « au nom de mon Père » et l'idée d'une revendication personnelle d'autorité.
- source_word: ἐκεῖνον λήμψεσθε
  choice: lui, vous le recevrez
  rationale: La dislocation emphatique rend la valeur contrastive de ἐκεῖνον et répète « recevoir », comme le grec répète λαμβάνω.
theological_decisions:
- issue: Faut-il expliciter que « mon Père » désigne Dieu ?
  choice: Conserver « mon Père » avec une majuscule.
  alternative: Écrire « mon père » ou ajouter explicitement « Dieu, mon Père ».
  rationale: Le contexte johannique identifie clairement le référent divin; la majuscule française le signale sans ajouter un nom absent du grec.
- issue: Faut-il traduire les expressions « au nom de » directement en termes d'autorité ?
  choice: Maintenir « au nom de mon Père » et « en son propre nom » dans le texte principal.
  alternative: Traduire « avec l'autorité de mon Père » et « de sa propre autorité ».
  rationale: Le grec évoque l'autorité et la représentation, mais l'expression du nom possède une portée plus large. La conserver respecte l'ambiguïté réelle et le contraste littéraire.
translation_notes:
  register: Français international moderne, naturel et digne. Le parallélisme des deux expressions relatives au nom ainsi que la répétition de « recevoir » sont conservés. « Lui » marque sans lourdeur l'opposition portée par ἐκεῖνον.
