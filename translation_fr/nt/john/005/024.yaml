  variant: modern international French
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: fr
  text: 'En vérité, en vérité, je vous le dis : quiconque écoute ma parole et croit en celui qui m’a envoyé a la vie éternelle ; il ne vient pas en jugement[a], mais il est passé de la mort à la vie[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne vient pas en condamnation ». Le grec κρίσις peut désigner le jugement en général ou, dans ce contexte, un jugement défavorable.
    reason: lexical_alternative
  - marker: b
    text: 'Le parfait grec indique une transition accomplie dont le résultat demeure : « est passé » ou « a franchi » de la mort à la vie.'
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: Oui, vraiment
  rationale: Rend en français naturel la formule solennelle et redoublée qui affirme avec force la véracité de la parole qui suit. Le redoublement grec est exprimé par deux termes affirmatifs plutôt que par l’expression moins courante « Amen, amen ».
- source_word: λέγω ὑμῖν
  choice: je vous le dis
  rationale: Formulation française idiomatique qui conserve l’adresse directe et solennelle.
- source_word: ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων
  choice: la personne qui écoute ma parole et croit
  rationale: Les participes présents substantivés décrivent de manière générale la personne caractérisée par cette écoute et cette foi. « La personne qui » évite d’introduire un masculin générique inutile.
- source_word: τὸν λόγον μου
  choice: ma parole
  rationale: Conserve la résonance johannique de λόγος tout en désignant clairement ici le message prononcé par Jésus.
- source_word: πιστεύων τῷ πέμψαντί με
  choice: croit celui qui m’a envoyé
  rationale: Le datif après πιστεύω désigne la personne que l’on croit ou à qui l’on fait confiance. Cette traduction suit directement la construction grecque sans ajouter « en ».
- source_word: ἔχει ζωὴν αἰώνιον
  choice: a la vie éternelle
  rationale: Le présent indique que cette vie est possédée dès maintenant ; « vie éternelle » est l’expression française établie et contextuellement juste.
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: ne vient pas en jugement
  rationale: « Jugement » conserve l’étendue sémantique de κρίσις et la préposition « en » reflète le mouvement exprimé par εἰς, sans préciser d’emblée « condamnation ».
- source_word: μεταβέβηκεν
  choice: est passée
  rationale: Le parfait présente un passage accompli dont le résultat demeure. Le passé composé français exprime naturellement cette transition effective.
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: de la mort à la vie
  rationale: Préserve le contraste johannique net et le mouvement d’un domaine à l’autre dans une tournure française naturelle.
theological_decisions:
- issue: Sens de κρίσις dans ce contexte de salut
  choice: jugement
  alternative: condamnation
  rationale: Le contexte peut orienter vers un jugement défavorable, mais κρίσις reste lexicalement plus large que « condamnation ». « Jugement » préserve cette amplitude et évite de résoudre silencieusement la tension.
- issue: Portée des temps verbaux concernant le salut
  choice: possession présente de la vie éternelle et passage déjà accompli de la mort à la vie
  alternative: possession uniquement future de la vie ou acquittement seulement futur
  rationale: Le présent ἔχει et le parfait μεταβέβηκεν présentent respectivement une possession actuelle et une transition accomplie dont l’effet demeure, sans imposer un système doctrinal particulier.
translation_notes:
  register: Français international moderne, naturel et digne. La formule initiale reste solennelle sans conserver l’hébraïsme « Amen, amen ». La reprise par « Elle » clarifie le sujet en français et évite le masculin générique.
