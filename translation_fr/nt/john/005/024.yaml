  verdict: revise
  source_fidelity: 'La structure et les temps grecs sont globalement bien rendus : possession présente de la vie éternelle, absence d’entrée en jugement, et passage accompli de la mort à la vie. Toutefois, « Oui, vraiment » ne restitue pas adéquatement la formule solennelle redoublée Ἀμὴν ἀμὴν. « En vérité, en vérité » en préserve mieux la répétition et la force. « Croire en celui qui m’a envoyé » est également plus idiomatique en français pour exprimer la confiance personnelle visée par πιστεύειν suivi du datif.'
  naturalness: Le texte est fluide dans l’ensemble, mais « Oui, vraiment » sonne conversationnel et ne correspond pas au registre solennel de l’énoncé. « Quiconque » fournit une formulation moderne, inclusive et plus légère que « la personne qui », sans nécessiter la reprise pronominale « Elle ».
  terminology: « Parole », « vie éternelle », « jugement », « mort » et « vie » sont appropriés et conservent la terminologie johannique. « Jugement » doit être maintenu dans le texte, car « condamnation » préciserait davantage que κρίσις ; l’alternative peut rester en note.
