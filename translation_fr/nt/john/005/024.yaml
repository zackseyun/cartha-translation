    rationale: Bien que le datif grec puisse se rendre littéralement par « croire quelqu’un », cette construction française est ambiguë et raide ici. « croit en celui qui m’a envoyé » exprime naturellement la foi/confiance en une personne, sans imposer une lecture doctrinale.
