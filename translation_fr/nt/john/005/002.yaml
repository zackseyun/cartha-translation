  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: fr
  text: Il y a à Jérusalem, près de la porte des Brebis[a], un bassin appelé en hébreu[b] Béthesda[c], avec cinq portiques.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie une expression elliptique, littéralement « à/près de la [probatique] »; elle désigne probablement le secteur de la porte des Brebis (voir Néhémie 3.1; 12.39). Le mot « porte » n’est pas exprimé dans ce verset.
    reason: cross_reference
  - marker: b
    text: Ou « en araméen »; chez Jean, l’expression « en hébreu » peut désigner la langue sémitique locale de Judée plutôt que strictement l’hébreu classique.
    reason: lexical_alternative
  - marker: c
    text: Certains manuscrits portent « Bethzatha » ou « Bethsaïda » au lieu de « Béthesda ».
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: Il y a
  rationale: Le présent ἔστιν est conservé. Le δέ, faiblement connectif, n’exige pas ici de mot de liaison explicite en français.
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: à Jérusalem
  rationale: C’est la tournure française naturelle pour situer quelque chose dans la ville, malgré la forme grecque morphologiquement plurielle du nom.
- source_word: ἐπὶ τῇ προβατικῇ
  choice: près de la porte des Brebis
  rationale: L’expression grecque est elliptique et renvoie vraisemblablement au secteur de la porte des Brebis. Le nom « porte », sous-entendu, est signalé en note afin de ne pas masquer l’ambiguïté.
- source_word: κολυμβήθρα
  choice: un bassin
  rationale: « Bassin » rend clairement un réservoir ou bassin d’eau sans les connotations récréatives que peut avoir « piscine » en français moderne.
- source_word: ἡ ἐπιλεγομένη
  choice: appelé
  rationale: Le participe introduit simplement le nom sous lequel le bassin était connu.
- source_word: Ἑβραϊστὶ
  choice: en hébreu
  rationale: La traduction formelle de l’adverbe est maintenue dans le texte; une note précise qu’il peut désigner plus largement la langue sémitique locale, probablement l’araméen.
- source_word: Βηθεσδά
  choice: Béthesda
  rationale: La forme du SBLGNT est suivie et adaptée à l’usage orthographique français; les principales variantes manuscrites sont données en note.
- source_word: πέντε στοὰς ἔχουσα
  choice: qui possède cinq portiques
  rationale: στοά désigne un espace couvert à colonnade. La proposition relative rend naturellement en français le participe grec tout en conservant son lien avec le bassin.
theological_decisions: []
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe est directe; « bassin » évite une connotation de loisir, tandis que « portiques » conserve le vocabulaire architectural précis.
