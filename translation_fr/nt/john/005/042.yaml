id: JHN.5.42
reference: John 5:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: fr
  text: 'Mais je vous connais : vous n’avez pas en vous l’amour de Dieu.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus explicitement : « l’amour pour Dieu ». Le grec peut aussi s’entendre plus largement de l’amour qui vient de Dieu ou de l’amour propre à Dieu.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque un contraste net avec le contexte précédent; « Mais » est l’adversatif français le plus naturel et concis.
- source_word: ἔγνωκα
  choice: je connais
  rationale: Le parfait exprime ici une connaissance établie; le présent français rend naturellement cette valeur résultative.
- source_word: ὑμᾶς
  choice: vous
  rationale: Complément direct pluriel de « je connais ».
- source_word: ὅτι
  choice: ': vous n’avez pas'
  rationale: Introduit le contenu de ce que Jésus sait à leur sujet. Les deux-points rendent cette relation avec naturel en français.
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: l’amour de Dieu
  rationale: Cette formulation proche du grec conserve l’ambiguïté du génitif, qui peut désigner l’amour pour Dieu, l’amour venant de Dieu ou l’amour propre à Dieu.
- source_word: οὐκ ἔχετε
  choice: vous n’avez pas
  rationale: Rend directement la négation et l’état présent exprimés par le grec.
- source_word: ἐν ἑαυτοῖς
  choice: en vous
  rationale: Expression française idiomatique d’une présence intérieure; elle rend le sens réflexif sans la lourdeur de « en vous-mêmes ».
theological_decisions:
- issue: Sens du génitif dans « l’amour de Dieu »
  choice: Conserver « l’amour de Dieu » dans le texte principal sans préciser la direction de l’amour.
  alternative: « l’amour pour Dieu »; ou, plus largement, « l’amour qui vient de Dieu » / « l’amour que Dieu donne »
  rationale: Le génitif grec τοῦ θεοῦ est réellement ambigu. Le contexte favorise fortement l’idée d’amour envers Dieu, mais le texte ne l’explicite pas grammaticalement; la note expose donc les lectures possibles sans trancher dans le texte.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « je vous connais » reste directe; « en vous » est plus naturelle que « en vous-mêmes ». L’ambiguïté théologique du génitif est maintenue dans le texte et expliquée en note.
