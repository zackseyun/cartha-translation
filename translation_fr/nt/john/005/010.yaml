id: JHN.5.10
reference: John 5:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: fr
  text: 'Les Juifs[a] disaient donc à l’homme qui avait été guéri : « C’est le sabbat, et il ne t’est pas permis de porter[b] ta natte[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Selon l’emploi de cette expression par Jean dans le contexte, il pourrait aussi s’agir plus précisément des responsables juifs ou des Judéens.
    reason: alternative_reading
  - marker: b
    text: Ou « de prendre » ou « d’emporter ».
    reason: lexical_alternative
  - marker: c
    text: Le terme traduit par « natte » désigne une couche ou un grabat transportable, et non nécessairement un lit complet.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente la parole dans son déroulement ou comme répétée. L’imparfait français « disaient » en conserve naturellement l’aspect.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la suite narrative avec une nuance de conséquence liée à la guérison et au fait que l’homme emportait sa natte.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Cette traduction reproduit sans la restreindre l’expression grecque. Dans Jean, celle-ci peut parfois désigner plus précisément des responsables juifs ou des Judéens, mais le verset ne le précise pas.
- source_word: τῷ τεθεραπευμένῳ
  choice: à l’homme qui avait été guéri
  rationale: Le participe parfait passif désigne une guérison accomplie dont le résultat demeure. « L’homme » est naturel en français et correspond au référent masculin établi par le contexte.
- source_word: Σάββατόν ἐστιν
  choice: C’est le sabbat
  rationale: Formulation française idiomatique pour désigner le jour du sabbat dans ce contexte.
- source_word: οὐκ ἔξεστίν σοι
  choice: il ne t’est pas permis
  rationale: ἔξεστιν exprime ce qui est permis ou autorisé. Cette formulation garde la portée normative de l’objection sans alourdir le français.
- source_word: ἆραι
  choice: porter
  rationale: Le verbe peut signifier « soulever », « prendre » ou « emporter ». Ici, l’objection porte sur le transport de la natte pendant le sabbat ; « porter » exprime clairement cette valeur contextuelle.
- source_word: κράβαττον
  choice: natte
  rationale: Le terme désigne une couche modeste et transportable, plutôt qu’un lit avec son cadre. « Natte » est courant, clair et cohérent avec l’action de la porter.
theological_decisions:
- issue: Référent de οἱ Ἰουδαῖοι dans l’Évangile selon Jean
  choice: les Juifs
  alternative: les responsables juifs ; les Judéens
  rationale: Le texte grec ne précise ici ni une fonction dirigeante ni une origine géographique particulière. La traduction principale conserve donc l’expression générale, tandis qu’une note signale l’ambiguïté contextuelle réelle sans imposer une interprétation plus étroite.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement au singulier reflète σοι et convient à l’adresse directe. La syntaxe reste proche du grec tout en étant fluide en français.
