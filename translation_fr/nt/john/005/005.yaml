  source_fidelity: Le sens temporel et la présence de l’homme sur les lieux sont bien rendus. Toutefois, « souffrait de sa maladie » introduit l’idée de souffrance ressentie et présente ἀσθένεια comme une maladie déterminée, alors que le grec décrit plus sobrement la durée de son état de faiblesse ou de maladie.
  naturalness: La phrase est naturelle, mais « était malade depuis trente-huit ans » est plus idiomatique et plus direct en français moderne. Le pronom possessif de « sa maladie » est inutile dans cette formulation.
