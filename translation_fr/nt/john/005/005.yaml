  yaml_path: translation/nt/john/005/005.yaml
  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: fr
  text: Il y avait là un homme qui était malade depuis trente-huit ans[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui était dans un état de faiblesse » ou « qui était atteint d’une maladie ». Le mot grec ἀσθένεια peut désigner de façon générale une faiblesse physique ou une maladie.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: Il y avait
  rationale: δέ est ici un connecteur narratif léger, sans contraste marqué. Le français peut naturellement laisser cette liaison implicite, tandis que « Il y avait » introduit le nouveau personnage.
- source_word: τις ἄνθρωπος
  choice: un homme
  rationale: Cette formulation rend naturellement l’indéfini τις et conserve la référence masculine singulière, sans la lourdeur de « un certain homme ».
- source_word: ἐκεῖ
  choice: là
  rationale: L’adverbe renvoie au lieu évoqué dans le contexte immédiat.
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: trente-huit ans
  rationale: C’est la formulation numérique idiomatique en français.
- source_word: ἔχων ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: qui souffrait de sa maladie depuis
  rationale: Le participe présent, associé à une durée à l’accusatif, décrit un état continu. « souffrait de… depuis » exprime naturellement en français cette durée qui se prolonge jusqu’au moment du récit, sans préciser la nature exacte du mal.
- source_word: ἀσθένεια
  choice: maladie
  rationale: Dans ce contexte physique, « maladie » est clair et naturel, tout en laissant indéterminée l’affection précise. Le terme grec peut aussi désigner plus largement la faiblesse ou l’infirmité.
