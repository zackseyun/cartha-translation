source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸀Ἔγειρε ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: fr
  text: 'Jésus lui dit : « Lève-toi, prends ta natte[a] et marche. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couche ». Le mot grec désigne une natte ou une couche simple servant à dormir, et non nécessairement un lit au sens de meuble.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent français « dit » conserve naturellement le présent historique grec, fréquent dans la narration johannique.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif marque simplement le destinataire de la parole de Jésus.
- source_word: Ἔγειρε
  choice: Lève-toi
  rationale: Cet impératif exprime directement l’action de se relever et convient au contexte sans ajouter explicitement l’idée de guérison.
- source_word: ἆρον
  choice: prends
  rationale: Dans ce contexte, l’impératif demande à l’homme de prendre et d’emporter l’objet sur lequel il couchait ; « prends » est naturel et suffisamment précis en français.
- source_word: κράβαττόν
  choice: natte
  rationale: Le terme désigne ici une couche simple et transportable, non nécessairement un lit constitué d’un meuble et d’un sommier.
- source_word: περιπάτει
  choice: marche
  rationale: Le verbe désigne ici l’action physique de marcher ; l’impératif français en restitue directement la force.
theological_decisions:
- issue: Nature de l’ordre de Jésus dans un contexte de guérison
  choice: Traduire les trois impératifs comme des ordres physiques directs, sans ajouter que l’homme est guéri.
  alternative: « Lève-toi, sois guéri et marche » ou une autre formulation explicitant la guérison.
  rationale: Le contexte implique la guérison, mais ce verset ordonne seulement de se lever, de prendre la natte et de marcher. La traduction ne doit pas rendre explicite ce que le grec laisse au contexte.
translation_notes:
  register: Français international moderne, clair et digne. Le présent narratif « dit » préserve le présent historique grec. Les impératifs sont directs et naturels ; « natte » évite l’image trompeuse d’un lit lourd tout en gardant une note pour l’alternative lexicale.
