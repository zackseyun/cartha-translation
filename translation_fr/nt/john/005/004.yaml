revisions:
- from: Car, de temps à autre, un ange descendait dans la piscine et agitait l’eau. Le premier qui y entrait après que l’eau avait été agitée était alors guéri[a] de la maladie dont il souffrait.[b]
  to: Car, de temps à autre, un ange descendait dans la piscine et agitait l’eau. Le premier qui y entrait après l’agitation de l’eau retrouvait alors la santé, quelle que fût la maladie dont il souffrait.[a][b]
  rationale: 'La révision rend plus exactement la valeur inchoative et habituelle de ὑγιὴς ἐγίνετο, tout en conservant l’imparfait narratif du grec. Elle resserre la formulation relative à l’agitation de l’eau et rend la précision textuelle de la note plus prudente. Les deux appels de note sont placés à la fin de la proposition à laquelle ils se rapportent : l’alternative de traduction concerne « retrouvait la santé », et la note critique concerne le verset entier.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:05:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'La traduction suit fidèlement le texte byzantin : « de temps à autre » rend κατὰ καιρόν, les imparfaits décrivent l’action habituelle, et « la maladie dont il souffrait » exprime correctement le passif idiomatique κατείχετο νοσήματι. Toutefois, « était alors guéri » décrit plus naturellement un état déjà acquis ou un acte de guérison, tandis que ὑγιὴς ἐγίνετο signifie « devenait bien portant / retrouvait la santé ».'
  naturalness: Le français est globalement clair et de registre approprié. « Retrouvait la santé » est plus idiomatique et plus précis que « était alors guéri ». « Après l’agitation de l’eau » est également plus direct et reste au plus près du substantif grec ταραχή.
  terminology: '« Ange », « piscine », « eau » et « maladie » conviennent. La note textuelle doit conserver le caractère discuté du verset sans atténuer ni qualifier l’énoncé traduit. La datation des papyrus est légèrement affinée : P66 est généralement situé vers la fin du IIe siècle ou le début du IIIe siècle.'
  issues:
  - severity: medium
    issue: « était alors guéri » pour ὑγιὴς ἐγίνετο
    rationale: 'Cette formulation peut suggérer un état résultant ou une guérison ponctuelle. Le verbe γίνομαι, à l’imparfait, exprime le devenir répété : « retrouvait la santé » le rend naturellement en français.'
  - severity: low
    issue: « après que l’eau avait été agitée »
    rationale: La formulation est correcte, mais le grec emploie le nom « agitation ». « Après l’agitation de l’eau » est plus concis et plus proche de la construction source.
  - severity: low
    issue: Datation de P66 dans la note
    rationale: Le présenter simplement comme un papyrus « du IIIe siècle » est réducteur, car il est souvent daté vers la fin du IIe ou le début du IIIe siècle. Une formulation couvrant cette fourchette est plus prudente.
