source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: fr
  text: Car, de temps à autre, un ange descendait dans la piscine et agitait l’eau. Le premier qui y entrait après l’agitation de l’eau retrouvait alors la santé, quelle que fût la maladie dont il souffrait.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « était guéri ».
    reason: previous_rendering
  - marker: b
    text: Ce verset, ainsi que la seconde moitié du verset 3, est absent des plus anciens papyrus grecs, notamment les papyrus 66 et 75, datés de la fin du IIe siècle ou du début du IIIe siècle, ainsi que de grands manuscrits du IVe siècle, tels que le Sinaïticus et le Vaticanus. Il figure dans la tradition majoritaire byzantine ainsi que dans d’anciennes traductions latines et syriaques. Beaucoup de spécialistes le considèrent comme un ajout ancien de copiste destiné à expliquer pourquoi les personnes handicapées se rassemblaient près de la piscine.
    reason: textual_critical
lexical_decisions:
- source_word: κατὰ καιρὸν
  choice: de temps à autre
  rationale: Cette expression indique ici une occurrence occasionnelle ou périodique, sans suggérer un calendrier fixe.
- source_word: κατέβαινεν
  choice: descendait
  rationale: L’imparfait grec présente une action habituelle ou répétée dans le passé; l’imparfait français la rend naturellement.
- source_word: ἐτάρασσεν
  choice: agitait
  rationale: Le verbe décrit la mise en mouvement ou le trouble de l’eau; « agitait » est clair et idiomatique.
- source_word: ἐγίνετο ὑγιής
  choice: était alors guéri
  rationale: La tournure exprime le fait de devenir sain ou bien portant; l’imparfait conserve l’aspect coutumier du récit et « alors » rend la conséquence marquée par οὖν.
- source_word: κατείχετο νοσήματι
  choice: la maladie dont il souffrait
  rationale: Employé passivement avec νόσημα, κατέχω décrit une personne atteinte d’une maladie; cette formulation est naturelle en français sans perdre le sens.
theological_decisions:
- issue: Statut de l’action de l’ange
  choice: Traduire l’énoncé tel qu’il figure dans la source byzantine, sans qualifier explicitement l’action de croyance rapportée.
  alternative: Ajouter une formule comme « disait-on » ou « selon la croyance »
  rationale: Le grec présente directement l’action; ajouter une réserve interprétative modifierait le niveau d’affirmation du texte. La question de l’authenticité textuelle est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. L’imparfait rend les actions répétées du grec. « Piscine » conserve le terme johannique usuel pour le bassin, tandis que « de temps à autre » évite de donner à κατὰ καιρόν une périodicité trop précise.
