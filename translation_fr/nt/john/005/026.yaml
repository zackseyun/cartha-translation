id: JHN.5.26
reference: John 5:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: fr
  text: En effet, de même que le Père a la vie en lui-même[a], de même il a aussi donné au Fils d’avoir la vie en lui-même[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: L’expression « la vie en lui-même » peut désigner une vie inhérente à son propre être. La traduction conserve toutefois la formulation grecque plutôt que d’employer le terme théologique « existence par soi-même ».
    reason: lexical_alternative
  - marker: b
    text: Littéralement, « a donné au Fils d’avoir la vie en lui-même ». La tournure française du texte suit de près cette construction grecque; on pourrait aussi traduire « a accordé au Fils d’avoir ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: En effet, de même que
  rationale: « En effet » rend la valeur explicative de γάρ, tandis que « de même que » introduit naturellement la comparaison marquée par ὥσπερ.
- source_word: ὁ πατὴρ
  choice: le Père
  rationale: Titre défini désignant Dieu dans le contexte johannique; la majuscule signale cet emploi titulaire.
- source_word: ἔχει ζωὴν ἐν ἑαυτῷ
  choice: a la vie en lui-même
  rationale: Rend directement le présent ἔχει et conserve la tournure prépositionnelle grecque sans lui substituer un terme théologique technique.
- source_word: οὕτως καὶ
  choice: de même… aussi
  rationale: Reproduit la corrélation ὥσπερ… οὕτως et rend καί par « aussi », tout en restant idiomatique en français.
- source_word: τῷ υἱῷ
  choice: au Fils
  rationale: Le datif indique le bénéficiaire ou objet indirect de ἔδωκεν; la majuscule reflète le titre christologique.
- source_word: ἔδωκεν
  choice: a donné
  rationale: Rend le sens ordinaire et direct de δίδωμι ainsi que l’aoriste par un passé composé naturel en français; « accordé » serait possible, mais davantage interprétatif.
- source_word: ζωὴν ἔχειν ἐν ἑαυτῷ
  choice: d’avoir la vie en lui-même
  rationale: Conserve la construction « donner à quelqu’un d’avoir » et le parallélisme exact avec ce qui est affirmé du Père.
theological_decisions:
- issue: Faut-il expliciter dans le texte l’idée d’existence par soi-même ou d’aséité?
  choice: Conserver « la vie en lui-même ».
  alternative: « la vie par lui-même » ou « une vie existant par elle-même »
  rationale: Le grec dit ἐν ἑαυτῷ. La formulation retenue préserve sa portée et son ambiguïté sans introduire un terme doctrinal postérieur ni réduire la phrase à une seule interprétation.
- issue: Comment rendre le don du Père au Fils exprimé par ἔδωκεν?
  choice: « a donné au Fils d’avoir »
  alternative: « a accordé au Fils d’avoir »
  rationale: '« A donné » suit au plus près le verbe grec ordinaire et maintient la tension théologique du texte: le Père donne, et ce qu’il donne au Fils est d’avoir la vie en lui-même. La traduction n’atténue ni n’explicite cette relation.'
translation_notes:
  register: Français international moderne, digne et accessible. Le parallélisme entre le Père et le Fils est volontairement conservé, ainsi que la répétition de « la vie en lui-même ». Les marqueurs de note sont placés après chacune des deux occurrences afin d’éclairer respectivement l’expression et la construction du don.
