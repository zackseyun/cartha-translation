    issue: « Retrouver la santé » implique un retour à un état antérieur.
    rationale: Le texte grec dit littéralement vouloir « devenir bien portant / en bonne santé » (ὑγιὴς γενέσθαι) et ne formule pas explicitement l’idée de recouvrer une santé précédemment possédée. Une formulation non présupposante est préférable.
  revised_text: 'Quand Jésus vit cet homme couché là et sut qu’il était dans cet état depuis longtemps déjà[a], il lui dit : « Veux-tu devenir en bonne santé ? »'
