source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: fr
  text: 'Quand Jésus vit cet homme couché là et sut qu’il était dans cet état depuis longtemps déjà[a], il lui dit : « Veux-tu devenir en bonne santé ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il se trouvait là depuis longtemps déjà ».'
    reason: 'L’expression grecque ne précise pas explicitement ce qui durait depuis longtemps : elle peut viser l’état de l’homme ou, dans cette scène, sa présence en ce lieu.'
lexical_decisions:
- source_word: τοῦτον
  choice: cet homme
  rationale: Le démonstratif désigne l’homme malade mentionné dans le contexte. « Cet homme » explicite naturellement le référent en français.
- source_word: ἰδὼν
  choice: Quand Jésus vit
  rationale: Le participe aoriste antérieur au verbe principal est rendu par une proposition temporelle, formulation naturelle qui conserve la progression du récit.
- source_word: κατακείμενον
  choice: couché là
  rationale: Le participe décrit l’homme étendu sur place. « Couché là » exprime à la fois sa posture et sa présence dans le lieu évoqué.
- source_word: γνοὺς
  choice: sut
  rationale: Le participe aoriste coordonné à ἰδών exprime la connaissance de Jésus sans indiquer comment celle-ci lui est venue. « Sut » maintient cette retenue.
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: il était dans cet état depuis déjà longtemps
  rationale: L’expression, littéralement « il a déjà beaucoup de temps », laisse son complément implicite. Le contexte immédiat renvoie le plus naturellement à la durée de l’état de l’homme, tout en permettant de comprendre sa présence prolongée en ce lieu.
- source_word: λέγει αὐτῷ
  choice: il lui demanda
  rationale: Le présent historique grec est rendu au passé pour un récit français naturel. Puisque les paroles qui suivent sont interrogatives, « demanda » convient mieux que le plus général « dit ».
- source_word: Θέλεις
  choice: Veux-tu
  rationale: θέλω exprime ici le désir ou la volonté. « Veux-tu » est direct, actuel et naturel.
- source_word: ὑγιὴς γενέσθαι
  choice: retrouver la santé
  rationale: L’expression désigne l’entrée dans un état de santé. « Retrouver la santé » rend ce changement d’état de manière idiomatique sans alourdir la phrase par « devenir bien portant ».
theological_decisions:
- issue: Nature de la connaissance de Jésus exprimée par γνοὺς
  choice: Présenter simplement Jésus comme sachant la durée de l’état de l’homme, sans préciser l’origine de cette connaissance.
  alternative: Préciser que Jésus le savait surnaturellement, ou qu’il l’avait appris par observation ou par un témoignage.
  rationale: Le texte affirme la connaissance de Jésus mais n’en indique pas le moyen. La traduction ne doit pas trancher au-delà de ce qui est écrit.
- issue: Agent implicite du rétablissement dans ὑγιὴς γενέσθαι
  choice: « retrouver la santé », qui met l’accent sur le changement d’état sans nommer l’agent.
  alternative: « être guéri », qui peut faire davantage entendre l’action d’un agent extérieur.
  rationale: Le grec emploie γίνομαι, « devenir », et non un verbe passif signifiant explicitement « être guéri ». La formulation retenue préserve cette nuance tout en restant naturelle.
translation_notes:
  register: Français international moderne, simple et digne. La syntaxe narrative est fluide, le présent historique grec est transposé au passé, et la question de Jésus demeure directe. Le marqueur [a] est placé immédiatement après l’expression concernée.
