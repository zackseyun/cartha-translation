  to: 'Quand Jésus vit cet homme couché là et sut qu’il était dans cet état depuis longtemps déjà[a], il lui dit : « Veux-tu devenir en bonne santé ? »'
  rationale: La révision remplace « retrouver la santé » par « devenir en bonne santé » afin de préserver l’aspect ingressif de γίνομαι sans ajouter la présupposition d’une santé antérieure. « Il lui dit » reflète directement λέγει ; la note maintient l’ambiguïté de l’expression temporelle grecque.
