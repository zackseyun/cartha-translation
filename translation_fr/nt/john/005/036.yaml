id: JHN.5.36
reference: John 5:36
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: fr
  text: 'Mais moi, j’ai un témoignage plus grand que celui de Jean[a] : les œuvres que le Père m’a données à accomplir, ces œuvres mêmes que je fais, témoignent à mon sujet que le Père m’a envoyé.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un témoignage supérieur à celui de Jean ».'
    reason: Alternative lexicale pour μείζω, qui peut exprimer la supériorité ou l’importance plutôt que la seule grandeur.
lexical_decisions:
- source_word: μαρτυρίαν
  choice: témoignage
  rationale: « Témoignage » conserve la dimension probatoire du terme dans ce contexte et s’emploie naturellement avec « avoir » en français.
- source_word: μείζω τοῦ Ἰωάννου
  choice: plus grand que celui de Jean
  rationale: Le comparatif marque une supériorité de degré, tandis que « celui de Jean » explicite sobrement l’ellipse du génitif sans comparer directement Jésus à Jean.
- source_word: ἔργα
  choice: œuvres
  rationale: « Œuvres » garde la portée johannique du terme, qui ne se limite pas nécessairement aux miracles mais englobe l’activité confiée à Jésus par le Père.
- source_word: δέδωκέν μοι
  choice: m’a données
  rationale: Le passé composé rend naturellement en français l’acte accompli dont le résultat demeure; l’accord se fait avec « œuvres », repris avant le participe.
- source_word: ὁ πατήρ
  choice: le Père
  rationale: Cette formulation respecte le titre relationnel du texte grec sans ajouter le possessif « mon ».
- source_word: ἵνα τελειώσω αὐτά
  choice: à accomplir
  rationale: « À accomplir » exprime le but et l’idée de mener les œuvres à leur terme, tout en restant idiomatique et digne.
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: ces œuvres mêmes que je fais
  rationale: « Ces œuvres mêmes » rend l’insistance de αὐτὰ τὰ ἔργα; « que je fais » traduit simplement le présent grec sans imposer artificiellement une forme progressive.
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: témoignent à mon sujet
  rationale: Le pluriel français s’accorde avec « œuvres », malgré le verbe grec au singulier avec un sujet neutre pluriel; l’expression préserve le champ lexical du témoignage.
- source_word: ἀπέσταλκεν
  choice: m’a envoyé
  rationale: Le passé composé exprime un envoi accompli dont la portée demeure actuelle.
theological_decisions:
- issue: Nature du témoignage qui authentifie Jésus
  choice: Les œuvres confiées par le Père constituent un témoignage supérieur à celui de Jean et attestent l’envoi de Jésus par le Père.
  alternative: Limiter les œuvres aux seuls miracles comme preuves d’autorité.
  rationale: Le terme ἔργα est conservé dans toute son amplitude et n’est pas réduit aux miracles, puisque le verset parle de l’ensemble de l’activité que le Père donne à Jésus d’accomplir.
- issue: Désignation de Dieu dans sa relation à Jésus
  choice: « le Père »
  alternative: « Dieu » ou « mon Père »
  rationale: Le grec porte ὁ πατήρ, sans possessif explicite; « le Père » préserve cette formulation et sa tension christologique sans ajout interprétatif.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « œuvres » et le vocabulaire du témoignage sont maintenus pour préserver l’insistance et la cohésion rhétorique du grec.
