id: JHN.5.23
reference: John 5:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: fr
  text: afin que tous honorent le Fils comme ils honorent le Père. Celui qui n’honore pas le Fils n’honore pas le Père qui l’a envoyé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit ici le but, avec une formulation française naturelle et digne qui conserve la valeur finale de la proposition.
- source_word: πάντες
  choice: tous
  rationale: Rend directement le pluriel universel sans ajouter un nom tel que « les humains ».
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: honorent / honore
  rationale: « Honorer » exprime le respect et la considération dus, tout en maintenant la répétition verbale structurante du grec.
- source_word: τὸν υἱὸν
  choice: le Fils
  rationale: Dans ce contexte johannique, il s’agit d’un titre désignant Jésus; la majuscule suit l’usage éditorial français pour ce titre.
- source_word: καθὼς
  choice: comme
  rationale: « Comme » exprime naturellement la correspondance forte établie par καθώς; le parallélisme même empêche de réduire la comparaison à une vague ressemblance.
- source_word: τὸν πατέρα
  choice: le Père
  rationale: Le terme désigne ici Dieu comme Père et fonctionne comme un titre personnel; la majuscule convient à l’usage français.
- source_word: ὁ μὴ τιμῶν
  choice: Celui qui n’honore pas
  rationale: Cette tournure rend le participe substantivé avec sa portée générale, de façon claire et idiomatique.
- source_word: τὸν πέμψαντα αὐτόν
  choice: le Père qui l’a envoyé
  rationale: La proposition relative française rend clairement le participe qui qualifie le Père; « l’ » renvoie au Fils.
- source_word: πέμψαντα
  choice: a envoyé
  rationale: Rend le sens courant de πέμπω sans préciser excessivement l’idée par « a mandaté » ou « a chargé d’une mission ».
theological_decisions:
- issue: Force de la comparaison entre l’honneur rendu au Fils et celui rendu au Père
  choice: « comme ils honorent le Père »
  alternative: « de la même manière qu’ils honorent le Père »
  rationale: « Comme » conserve la correspondance affirmée par le grec dans un français plus direct. La traduction ne diminue pas le parallèle, mais n’y introduit pas non plus de terminologie doctrinale postérieure.
- issue: Majuscules à « Fils » et « Père »
  choice: Majuscules employées comme marques éditoriales de titres personnels
  alternative: 'Minuscules : « fils » et « père »'
  rationale: Le grec ancien ne tranche pas par la capitalisation, mais le contexte identifie clairement Jésus et Dieu le Père. Les majuscules aident le lecteur sans ajouter une affirmation étrangère au passage.
- issue: Référent du pronom αὐτόν
  choice: Le pronom français « l’ » renvoie au Fils
  alternative: Répéter explicitement « le Fils »
  rationale: Le référent masculin le plus naturel et le sens de la mission dans la phrase désignent le Fils; le pronom maintient la concision de l’original.
translation_notes:
  register: Français international moderne, clair et digne. Le parallélisme et la triple répétition du verbe « honorer » sont préservés. Aucun marqueur de note n’est requis.
