source:
  edition: SBLGNT
  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: fr
  text: 'Mais il leur répondit : « Celui qui m’a rendu la santé, c’est lui qui m’a dit : “Prends ta natte[a] et marche.” »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « couche » ; le mot grec désigne une natte ou un couchage simple et transportable.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Verbe narratif courant qui rend directement la réponse de l’homme à ses interlocuteurs.
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: Celui qui m’a rendu la santé
  rationale: Cette formulation française naturelle conserve la construction causative et désigne la personne qui a rétabli l’homme physiquement.
- source_word: ἐκεῖνός
  choice: c’est lui
  rationale: La tournure disloquée préserve l’insistance du pronom grec sans produire un français artificiel.
- source_word: Ἆρον
  choice: Prends
  rationale: Dans ce contexte, l’impératif demande de saisir et d’emporter la natte ; « prends » est idiomatique et direct en français moderne.
- source_word: κράβαττόν
  choice: natte
  rationale: Le terme désigne ici une couche simple et transportable, plutôt qu’un lit conçu comme un meuble.
- source_word: περιπάτει
  choice: marche
  rationale: L’impératif français rend naturellement l’ordre de se mettre à marcher ; expliciter une action continue alourdirait inutilement la phrase.
- source_word: δὲ
  choice: Mais
  rationale: La conjonction marque ici une légère opposition entre l’interpellation précédente et la réponse de l’homme.
theological_decisions:
- issue: Portée de la description de la guérison
  choice: m’a rendu la santé
  alternative: m’a rendu entier
  rationale: Le contexte immédiat parle d’un rétablissement physique. La formulation choisie n’ajoute pas une idée de restauration spirituelle ou globale que le verset n’explicite pas.
translation_notes:
  register: Français international moderne, digne et accessible. La construction « Celui qui…, c’est lui… » maintient l’emphase grecque tout en restant naturelle. Les guillemets imbriqués distinguent la réponse de l’homme des paroles qu’il rapporte.
