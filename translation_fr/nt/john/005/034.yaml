id: JHN.5.34
reference: John 5:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: fr
  text: Mais moi, ce n’est pas d’un être humain que je reçois le témoignage ; mais je dis cela afin que vous soyez sauvés.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: d’un être humain
  rationale: παρά avec le génitif indique la source. Le singulier générique ἀνθρώπου désigne ici l’être humain par contraste avec une attestation d’origine divine ; cette formulation moderne évite que « d’un homme » soit compris comme visant uniquement un individu masculin.
- source_word: τὴν μαρτυρίαν
  choice: le témoignage
  rationale: « Témoignage » rend naturellement le contenu attesté et conserve la nuance probatoire du contexte.
- source_word: λαμβάνω
  choice: je reçois
  rationale: Le présent « je reçois » correspond directement à λαμβάνω et préserve l’idée de recevoir un témoignage, sans renforcer le sens en « accepter ».
- source_word: ταῦτα
  choice: cela
  rationale: Bien que ταῦτα soit formellement pluriel, « je dis cela » est l’expression idiomatique en français pour reprendre les propos concernés ; « ces choses » serait ici lourd et peu naturel.
- source_word: λέγω
  choice: je dis
  rationale: Le présent simple rend directement λέγω et convient à son complément.
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: afin que vous soyez sauvés
  rationale: « Afin que » marque clairement le but exprimé par ἵνα, tandis que « soyez sauvés » conserve le passif et la portée sotériologique de σωθῆτε.
- source_word: δὲ ... ἀλλὰ
  choice: Mais moi… cependant
  rationale: δὲ introduit le contraste avec le contexte précédent, et ἀλλά oppose ensuite le but de ces paroles au refus de dépendre d’un témoignage humain. En français, « cependant » évite le tour maladroit « mais… mais » tout en maintenant l’opposition.
theological_decisions:
- issue: Sens de « soyez sauvés » dans le contexte
  choice: Conserver la formulation large « soyez sauvés »
  alternative: « soyez délivrés » ou « parveniez au salut »
  rationale: Le passif de σῴζω porte une véritable portée salvifique sans préciser ici le modèle doctrinal, l’agent ou les modalités du salut. La traduction préserve cette ouverture et la tension du texte.
- issue: Rapport de Jésus au témoignage humain
  choice: Exprimer qu’il ne reçoit pas son témoignage d’une source humaine
  alternative: « je n’accepte pas le témoignage d’un être humain »
  rationale: Le texte nie la dépendance envers une source humaine ; il ne dit pas nécessairement que Jésus rejette comme faux tout témoignage humain. « Reçois… d’un être humain » conserve cette distinction.
translation_notes:
  register: Français international moderne, digne et accessible. La construction clivée « ce n’est pas… que » souligne naturellement la source niée. Aucun marqueur de note n’est requis.
