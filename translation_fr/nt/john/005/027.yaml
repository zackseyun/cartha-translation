id: JHN.5.27
reference: John 5:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: fr
  text: Et il lui a donné l’autorité d’exercer le jugement, parce qu’il est le Fils de l’homme.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «parce qu’il est un fils d’homme», c’est-à-dire parce qu’il partage la condition humaine. Le texte principal retient l’emploi probable de l’expression comme titre dans l’Évangile selon Jean.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: l’autorité
  rationale: Le terme désigne ici une autorité légitime et conférée, particulièrement adaptée à la prérogative judiciaire que le Père donne au Fils, plutôt qu’une simple puissance.
- source_word: ἔδωκεν
  choice: a donné
  rationale: L’aoriste de δίδωμι exprime directement le don; «a donné» est naturel et fidèle, sans explicitation inutile.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif renvoie au Fils dans le contexte et devient naturellement le complément indirect de «a donné».
- source_word: κρίσιν ποιεῖν
  choice: d’exercer le jugement
  rationale: L’expression signifie littéralement «faire le jugement». En français, «exercer le jugement» conserve la portée judiciaire et l’idée de mettre en œuvre le jugement, tout en restant idiomatique.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici la raison pour laquelle cette autorité lui est donnée.
- source_word: υἱὸς ἀνθρώπου
  choice: le Fils de l’homme
  rationale: Malgré l’absence d’article en grec, l’expression fonctionne très probablement dans Jean comme le titre reconnu de Jésus et évoque notamment Daniel 7. La formulation française consacrée préserve cette portée.
- source_word: ἐστίν
  choice: il est
  rationale: Le présent de la copule est rendu sans développement ni paraphrase.
theological_decisions:
- issue: Faut-il comprendre υἱὸς ἀνθρώπου comme un titre christologique ou comme une désignation générique de l’humanité?
  choice: Le texte principal porte «le Fils de l’homme», comme titre christologique.
  alternative: «un fils d’homme», c’est-à-dire un être humain
  rationale: Dans l’Évangile selon Jean, cette expression est une désignation reconnue de Jésus, avec une résonance apocalyptique et messianique, particulièrement pertinente dans un contexte d’autorité judiciaire. Toutefois, le grec sans article permet qu’on entende aussi une insistance sur son appartenance à l’humanité; la note conserve cette ambiguïté réelle sans l’imposer au texte principal.
translation_notes:
  register: Français international moderne, digne et accessible. «Exercer le jugement» garde la tonalité judiciaire sans employer le tour plus technique ou potentiellement ambigu «exécuter le jugement». Le titre traditionnel «Fils de l’homme» est conservé, avec une note signalant l’autre compréhension possible.
