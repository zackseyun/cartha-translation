  text: δόξαν παρὰ ἀνθρώπων οὐ λαμβάνω,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/041.yaml
  text: I do not receive glory from men[b][a],
translation:
  language: fr
  text: Je ne reçois pas de gloire de la part des êtres humains.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « honneur » ou « louanges » au lieu de « gloire ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit littéralement « des humains » ; le terme peut désigner les personnes ou les êtres humains en général.
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: la gloire
  rationale: « Gloire » préserve le lien lexical avec le thème johannique de la gloire, tout en pouvant désigner ici l’honneur ou les louanges accordés par autrui.
- source_word: παρὰ ἀνθρώπων
  choice: qui vient des êtres humains
  rationale: παρά avec le génitif indique la provenance. « Des êtres humains » exprime naturellement la portée générique de ἀνθρώπων et maintient le contraste implicite entre l’approbation humaine et celle de Dieu.
- source_word: οὐ λαμβάνω
  choice: Je ne reçois pas
  rationale: Rendu direct du présent de λαμβάνω, sans introduire dans le texte l’idée plus interprétative de « rechercher ».
theological_decisions:
- issue: Portée de la déclaration de Jésus concernant l’approbation humaine
  choice: Le texte nie que Jésus reçoive des humains la gloire qui valide sa mission ou son identité, sans expliciter davantage.
  alternative: Comprendre qu’il affirme ne jamais recevoir aucun honneur d’un être humain, en quelque sens que ce soit.
  rationale: La traduction reste proche du grec et conserve la tension du contexte, sans ajouter « chercher » ni transformer l’énoncé en affirmation métaphysique absolue.
translation_notes:
  register: Français international moderne, sobre et digne. La relative « qui vient de » rend clairement la provenance exprimée par παρά avec le génitif et évite la tournure moins naturelle « recevoir de la gloire de la part des êtres humains ».
