  source_fidelity: 'Le texte rend fidèlement les deux parfaits grecs par des passés composés (« avez envoyé », « a rendu témoignage »), ce qui convient en français et conserve l’idée d’actes accomplis pertinents dans l’argument présent. « Des messagers » explicite de manière sûre l’objet sous-entendu de ἀπεστάλκατε : le contexte immédiat de Jean 1.19 identifie une délégation effectivement envoyée. « Auprès de Jean » rend naturellement πρὸς Ἰωάννην sans ajouter « le Baptiste ».'
  naturalness: La phrase est fluide, claire et de registre moderne digne. « Rendre témoignage à la vérité » est une tournure française établie et conserve le vocabulaire de témoignage important dans ce passage.
  terminology: « Jean » respecte la forme non qualifiée du grec. « La vérité » conserve l’article de τῇ ἀληθείᾳ ainsi que sa résonance johannique sans déterminer indûment le contenu du témoignage. Le choix « rendu témoignage » est fidèle au champ sémantique de μαρτυρέω et plus approprié ici que des formulations explicatives.
