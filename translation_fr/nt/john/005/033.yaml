id: JHN.5.33
reference: John 5:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάννην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: fr
  text: Vous avez envoyé des messagers auprès de Jean, et il a rendu témoignage à la vérité.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vous
  rationale: Le pronom explicite apporte une légère insistance, mais « vous-mêmes » la renforcerait excessivement en français dans ce contexte.
- source_word: ἀπεστάλκατε
  choice: avez envoyé des messagers
  rationale: Le parfait renvoie à une démarche accomplie dont la portée demeure dans l'argument présent. Comme le verbe est employé ici sans complément d'objet exprimé, « des messagers » explicite naturellement en français les personnes envoyées, déjà mentionnées dans le contexte (Jean 1.19).
- source_word: πρὸς Ἰωάννην
  choice: auprès de Jean
  rationale: πρός avec une personne indique ici la destination de la délégation. « Auprès de Jean » est idiomatique avec « envoyer des messagers » et n'ajoute pas le titre « le Baptiste », absent du grec.
- source_word: μεμαρτύρηκε
  choice: a rendu témoignage
  rationale: Le parfait présente un témoignage passé qui reste pertinent. « Rendre témoignage » conserve le champ lexical johannique du témoin tout en restant clair en français moderne.
- source_word: τῇ ἀληθείᾳ
  choice: à la vérité
  rationale: Le datif régi par μαρτυρέω se rend naturellement par « rendre témoignage à ». L'article est conservé afin de maintenir la résonance propre à « la vérité » chez Jean.
theological_decisions:
- issue: L'emploi johannique de « la vérité »
  choice: la vérité
  alternative: la vérité au sujet de Jésus
  rationale: Le grec ne précise pas davantage le contenu du témoignage dans ce verset. La traduction conserve donc l'expression ouverte et sa portée théologique possible sans l'expliciter doctrinalement.
translation_notes:
  register: Français international moderne, digne et accessible. La formulation conserve le langage du témoignage, important dans le contexte judiciaire et théologique de Jean, tout en explicitant sobrement le complément implicite d'« envoyer » requis par l'usage français.
