id: JHN.5.16
reference: John 5:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: fr
  text: 'Et c’est pour cette raison que les Juifs persécutaient Jésus[a] : il faisait ces choses le jour du sabbat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens » ou, selon le contexte, « les dirigeants juifs ». Dans l’Évangile selon Jean, cette expression désigne souvent un groupe particulier opposé à Jésus, et non tous les Juifs sans distinction.
    reason: Lecture alternative et précision contextuelle visant à préserver l’étendue possible du terme grec sans encourager une généralisation.
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: c’est pour cette raison
  rationale: La locution renvoie à l’événement précédent et en présente la conséquence motivée. Cette formulation française exprime clairement ce lien causal.
- source_word: ἐδίωκον
  choice: persécutaient
  rationale: L’imparfait grec présente une hostilité en cours ou répétée. « Persécutaient » rend cette opposition durable sans anticiper l’intention explicite de tuer mentionnée au verset 18.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: C’est la traduction lexicale directe de l’expression grecque. Le texte principal ne la restreint pas explicitement aux chefs, tandis qu’une note précise la portée contextuelle possible dans Jean.
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif pluriel renvoie aux actes qui viennent d’être racontés et conserve ici sa forme plurielle.
- source_word: ἐποίει
  choice: faisait
  rationale: L’imparfait français rend naturellement l’aspect en cours ou habituel de l’imparfait grec.
- source_word: ἐν σαββάτῳ
  choice: le jour du sabbat
  rationale: Cette expression idiomatique en français désigne clairement le moment du sabbat tout en respectant le singulier grec.
theological_decisions:
- issue: Référent et traduction de οἱ Ἰουδαῖοι dans Jean
  choice: les Juifs
  alternative: les Judéens ; les dirigeants juifs
  rationale: Le texte principal conserve la désignation grecque sans préciser davantage son référent. La note signale toutefois que, dans l’Évangile selon Jean, l’expression peut viser un groupe particulier opposé à Jésus et ne doit pas être généralisée à tous les Juifs.
translation_notes:
  register: Français international moderne, naturel et digne. La coordination grecque est rendue par deux propositions séparées par deux-points afin d’éviter la répétition lourde de « parce que » tout en conservant le double lien causal. Le vocabulaire reste direct et accessible.
