  source_fidelity: Le texte rend fidèlement les deux liens causaux de διὰ τοῦτο et ὅτι, l’imparfait hostile ἐδίωκον (« persécutaient »), le pluriel ταῦτα (« ces choses ») et la circonstance temporelle ἐν σαββάτῳ (« le jour du sabbat »). Les deux-points expriment naturellement en français la cause introduite par ὅτι sans ajouter l’intention de tuer, absente de ce verset.
  naturalness: La formulation est claire, digne et naturelle en français international moderne. « C’est pour cette raison que » et « le jour du sabbat » conviennent au registre biblique courant. « Ces choses » est un peu formel, mais reste idiomatique et préserve utilement le pluriel grec.
