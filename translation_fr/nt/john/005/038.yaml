source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: fr
  text: Et vous n’avez pas sa parole qui demeure en vous[a], parce que vous ne croyez pas celui qu’il a envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui reste en vous ».
    reason: Variante lexicale moderne pour μένω, qui souligne également la continuité.
lexical_decisions:
- source_word: λόγον
  choice: parole
  rationale: « Parole » désigne ici la parole révélée de Dieu et conserve le vocabulaire caractéristique de Jean, sans réduire le terme à un simple « message ».
- source_word: ἐν ὑμῖν μένοντα
  choice: demeure en vous
  rationale: « Demeurer » exprime la présence continue indiquée par μένω et reprend naturellement un terme important du vocabulaire johannique. La tournure française reformule légèrement la construction avec ἔχετε pour rester fluide.
- source_word: ὅτι
  choice: parce que
  rationale: La conjonction introduit ici la raison pour laquelle la parole de Dieu ne demeure pas en eux.
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: celui qu’il a envoyé
  rationale: Cette formulation naturelle renvoie à Jésus comme envoyé du Père, sans alourdir le français par un littéral « celui-là » pour ἐκεῖνος.
- source_word: τούτῳ ... οὐ πιστεύετε
  choice: vous ne croyez pas en celui
  rationale: « Croire en » est idiomatique en français pour la confiance accordée à une personne et rend clairement le datif τούτῳ, dont l’antéposition grecque met le référent en relief.
theological_decisions:
- issue: Rapport entre la parole de Dieu demeurant dans les auditeurs et leur refus de croire en l’envoyé
  choice: Le refus de croire en Jésus manifeste que la parole du Père ne demeure pas en eux.
  alternative: Le propos peut viser plus précisément leur incapacité à garder intérieurement ou à accueillir les Écritures.
  rationale: La traduction conserve le lien causal du texte sans y introduire une doctrine particulière de la régénération, de l’illumination ou de la persévérance.
translation_notes:
  register: Français international moderne, simple et digne. « Demeurer » conserve la résonance johannique tout en restant compréhensible; « rester » est signalé comme variante plus courante.
