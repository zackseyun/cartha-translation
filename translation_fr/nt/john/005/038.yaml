revisions:
- from: Et sa parole ne demeure pas en vous[a], parce que vous ne croyez pas en celui qu’il a envoyé.
  to: Et vous n’avez pas sa parole qui demeure en vous[a], parce que vous ne croyez pas celui qu’il a envoyé.
  rationale: La révision rétablit la relation entre « avoir » et « la parole demeurant en vous », telle que l’exprime ἔχετε ... μένοντα. Elle rend aussi πιστεύω suivi du datif par « croire celui que », sans décider si le contexte théologique implique une nuance plus développée de confiance. L’antéposition de τούτῳ n’a pas besoin d’être reproduite artificiellement en français.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:05:54Z'
review_pass:
  verdict: revise
  source_fidelity: La reformulation « sa parole ne demeure pas en vous » exprime globalement le sens, mais elle efface la construction explicite ἔχετε ... μένοντα (« vous n’avez pas ... qui demeure »). De plus, πιστεύω avec le datif τούτῳ est rendu plus directement par « croire celui que », plutôt que par « croire en », qui peut renforcer la nuance de foi/confiance au-delà de la syntaxe immédiate.
  naturalness: « Vous n’avez pas sa parole qui demeure en vous » est naturel, clair et conserve la résonance johannique de « demeurer ». « Vous ne croyez pas celui qu’il a envoyé » est idiomatique en français moderne dans le sens de ne pas croire une personne.
  terminology: « Parole » convient pour λόγος et préserve le vocabulaire johannique. « Demeurer » convient pour μένω sans imposer une lecture doctrinale. La note est ajustée pour correspondre à la construction révisée.
  issues:
  - severity: medium
    issue: La traduction ne rend pas explicitement le verbe ἔχετε (« vous avez »).
    rationale: « Sa parole ne demeure pas en vous » est une paraphrase recevable, mais le grec affirme qu’ils ne possèdent pas sa parole comme parole demeurant en eux. « Vous n’avez pas sa parole qui demeure en vous » restitue cette structure et sa portée.
  - severity: medium
    issue: « Croire en celui qu’il a envoyé » rend πιστεύετε ... τούτῳ de façon plus interprétative.
    rationale: Le datif personnel μετά πιστεύω se rend directement par « croire quelqu’un / croire celui que ». La formulation révisée préserve l’ambiguïté et l’accent du texte sans ajouter la préposition française « en ».
  revised_text: Et vous n’avez pas sa parole qui demeure en vous[a], parce que vous ne croyez pas celui qu’il a envoyé.
  revised_footnotes:
  - marker: a
    text: Ou « qui reste en vous ».
    reason: Variante lexicale moderne pour μένω, qui souligne également la continuité.
