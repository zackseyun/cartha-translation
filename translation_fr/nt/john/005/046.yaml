  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: fr
  text: Car si vous croyiez Moïse, vous me croiriez, car c’est à mon sujet qu’il a écrit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « car celui-là a écrit à mon sujet » ; le pronom grec renvoyant à Moïse est emphatique. Le même verbe grec est employé dans les deux propositions : « croire Moïse » et « me croire » ; on pourrait aussi rendre : « faire confiance à Moïse » et « me faire confiance ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: Car si
  rationale: « Car » conserve le lien argumentatif marqué par γάρ avec ce qui précède, tandis que « si » rend la condition introduite par εἰ.
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: vous croyiez Moïse
  rationale: L’imparfait français convient à une condition présentée comme contraire aux faits. La construction directe « croire quelqu’un » rend le datif personnel sans ajouter l’idée de « croire en ».
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: vous me croiriez aussi
  rationale: Le conditionnel rend l’imparfait accompagné de ἄν dans l’apodose irréelle. « Me croire » conserve la même construction et le même verbe que dans la première proposition; « aussi » explicite naturellement la correspondance en français sans modifier le sens.
- source_word: περὶ γὰρ ἐμοῦ
  choice: car c’est à mon sujet que
  rationale: « À mon sujet » rend περί avec le génitif. La tournure clivée française met en relief « moi », conformément à l’ordre grec.
- source_word: ἐκεῖνος
  choice: lui
  rationale: Le pronom tonique « lui » conserve mieux que le simple « il » la valeur emphatique du démonstratif renvoyant à Moïse.
- source_word: ἔγραψεν
  choice: a écrit
  rationale: Le passé composé est le rendu courant et naturel de l’aoriste dans ce contexte en français moderne.
theological_decisions:
- issue: Nature du témoignage de Moïse au sujet de Jésus
  choice: c’est à mon sujet que lui a écrit
  alternative: il a écrit à mon sujet
  rationale: La formulation affirme que les écrits de Moïse concernent Jésus sans désigner un passage particulier ni préciser davantage la manière dont ils lui rendent témoignage.
- issue: Sens de πιστεύω avec le datif
  choice: croire Moïse / me croire
  alternative: faire confiance à Moïse / me faire confiance
  rationale: Le choix conserve la répétition grecque et n’importe pas la construction théologique « croire en », absente ici.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition de « croire » et l’emphase de ἐκεῖνος sont préservées; la syntaxe reste accessible à la lecture publique.
