id: JHN.5.47
reference: John 5:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: fr
  text: Mais si vous ne croyez pas ses écrits[a], comment croirez-vous mes paroles ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ses lettres ». Le mot grec peut désigner des lettres ou des écrits ; ici, il renvoie à ce que Moïse a écrit.
    reason: Alternative lexicale de γράμματα ; « écrits » convient mieux au contexte, mais l’autre sens possible du terme mérite d’être signalé.
lexical_decisions:
- source_word: εἰ δὲ
  choice: Mais si
  rationale: Exprime naturellement en français la condition introduite par εἰ et la valeur contrastive de δέ, en continuité avec l’argument précédent.
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: ses écrits
  rationale: Dans le contexte immédiat, ἐκείνου renvoie à Moïse et γράμματα désigne ce qu’il a écrit. « Ses écrits » est naturel et n’explicite pas davantage que le grec leur statut scripturaire.
- source_word: οὐ πιστεύετε
  choice: vous ne croyez pas
  rationale: Le verbe πιστεύω avec le datif signifie ici tenir le témoignage pour vrai. Le présent français rend simplement le présent grec.
- source_word: πῶς
  choice: comment
  rationale: Conserve la question rhétorique portant sur la possibilité ou la manière dont la foi aux paroles de Jésus pourrait suivre le refus des écrits de Moïse.
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: mes paroles
  rationale: « Paroles » rend naturellement ῥήματα et maintient le contraste entre ce que Moïse a écrit et ce que Jésus dit.
- source_word: πιστεύσετε
  choice: croirez-vous
  rationale: Le futur simple conserve le futur indicatif grec et reprend le même verbe que dans la première proposition.
theological_decisions:
- issue: Référent de ἐκείνου (« ses »)
  choice: Le possessif renvoie à Moïse dans le contexte immédiat.
  alternative: Répéter explicitement « les écrits de Moïse » ou laisser un référent générique.
  rationale: Jean 5.45-46 nomme Moïse et affirme qu’il a écrit au sujet de Jésus. Le simple possessif préserve la cohésion et le degré d’explicitation du grec.
- issue: Sens de πιστεύω
  choice: Traduire les deux occurrences par « croire ».
  alternative: Employer « faire confiance » ou varier entre « croire » et « se fier ».
  rationale: Le contexte porte sur l’accueil comme vrai du témoignage contenu dans les écrits de Moïse et dans les paroles de Jésus. La répétition de « croire » préserve le parallélisme rhétorique sans exclure la dimension relationnelle du verbe.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe brève conserve le contraste entre « ses écrits » et « mes paroles », ainsi que la force de la question rhétorique.
