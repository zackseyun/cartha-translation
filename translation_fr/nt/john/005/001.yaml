id: JHN.5.1
reference: John 5:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: fr
  text: Après cela, il y eut une fête des Juifs[a], et Jésus monta à Jérusalem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, «les Juifs» désigne le peuple juif en rapport avec l’une de ses fêtes. Ailleurs dans Jean, le même terme grec peut aussi, selon le contexte, désigner les Judéens.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: Après cela
  rationale: Cette tournure française naturelle conserve la fonction de transition narrative de l’expression grecque; le pluriel grec n’exige pas ici le calque moins idiomatique «après ces choses».
- source_word: ἦν
  choice: il y eut
  rationale: Le tour existentiel introduit naturellement la fête dans le récit et rend l’imparfait de εἰμί sans lourdeur.
- source_word: ἑορτὴ
  choice: une fête
  rationale: Le terme désigne une célébration religieuse. «Fête» est courant, digne et convient particulièrement aux fêtes juives.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Dans ce contexte, le génitif caractérise la fête comme une célébration du peuple juif, et non comme une fête propre aux seuls habitants de la Judée.
- source_word: ἀνέβη
  choice: monta
  rationale: Le verbe conserve l’idée traditionnelle et géographique de monter à Jérusalem, sans employer le terme trop marqué «s’éleva».
- source_word: Ἱεροσόλυμα
  choice: Jérusalem
  rationale: Forme française usuelle du nom de lieu.
theological_decisions:
- issue: Sens de Ἰουδαίων dans l’usage johannique
  choice: les Juifs
  alternative: les Judéens
  rationale: Ici, le mot qualifie une fête observée par le peuple juif; le sens régional «Judéens» convient moins bien. La note rappelle toutefois la variation de sens possible ailleurs dans l’Évangile afin d’éviter de généraliser indûment cet emploi.
translation_notes:
  register: Français international moderne, fluide et digne. La formulation reste proche de la structure grecque tout en évitant les calques peu naturels.
