id: JHN.5.18
reference: John 5:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: fr
  text: 'C’est pourquoi les Juifs[a] cherchaient d’autant plus à le tuer : non seulement il violait le sabbat, mais encore il appelait Dieu son propre Père, se faisant égal à Dieu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dans l’Évangile selon Jean, l’expression « les Juifs » désigne souvent, selon le contexte, les adversaires judéens de Jésus ou certaines autorités juives, et non tous les Juifs sans distinction.
    reason: cultural_note
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: Voilà pourquoi
  rationale: Rend naturellement en français la conclusion causale et logique exprimée cumulativement par διὰ τοῦτο et οὖν, sans la lourdeur de « C’est pourquoi donc ».
- source_word: μᾶλλον
  choice: encore davantage
  rationale: 'Conserve l’intensification comparative : leur volonté de le tuer devient plus forte à la suite de cet épisode.'
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: cherchaient ... à le tuer
  rationale: L’imparfait rend l’action continue ou répétée de ἐζήτουν, tandis que « tuer » restitue directement ἀποκτεῖναι.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Préserve la désignation explicite du grec sans restreindre d’office le référent aux chefs religieux; une note précise la portée contextuelle fréquente de l’expression chez Jean.
- source_word: ἔλυε τὸ σάββατον
  choice: violait le sabbat
  rationale: Dans ce contexte, λύω désigne la transgression ou la mise à l’écart des prescriptions sabbatiques; « violait » est clair, naturel et laisse entendre qu’il s’agit du motif d’accusation rapporté.
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: il disait que Dieu était son propre Père
  rationale: Conserve le verbe ἔλεγε et la force distinctive de ἴδιον, tout en adoptant une syntaxe française naturelle.
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: se faisant ainsi égal à Dieu
  rationale: Rend précisément la proposition participiale et son lien explicatif avec l’affirmation précédente; « égal à Dieu » est la tournure française idiomatique.
theological_decisions:
- issue: Force christologique de l’égalité avec Dieu
  choice: se faisant ainsi égal à Dieu
  alternative: prétendant être égal à Dieu
  rationale: La formulation retenue conserve l’assertion directe du grec sans l’atténuer en simple prétention ni introduire de terminologie doctrinale postérieure.
- issue: Référent de « les Juifs » dans l’Évangile selon Jean
  choice: Maintien de « les Juifs » dans le texte avec précision contextuelle en note
  alternative: les autorités juives / les Judéens
  rationale: Le grec porte οἱ Ἰουδαῖοι. La note permet de signaler que, selon le contexte johannique, l’expression vise souvent des adversaires judéens ou certaines autorités plutôt que tous les Juifs sans distinction.
- issue: Point de vue de l’accusation concernant le sabbat
  choice: il violait le sabbat
  alternative: il abolissait le sabbat / il enfreignait les règles du sabbat
  rationale: La traduction garde la formulation narrative concise et le motif invoqué contre Jésus, sans développer ni trancher ici la question de l’interprétation exacte de son acte.
translation_notes:
  register: Français international moderne, digne et accessible. « Voilà pourquoi » évite la redondance peu naturelle de « C’est pourquoi donc ». La phrase conserve l’intensification, le lien causal et la forte portée christologique du grec.
