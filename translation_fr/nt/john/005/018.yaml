revisions:
- from: 'Voilà pourquoi les Juifs[a] cherchaient encore davantage à le tuer : non seulement il violait le sabbat, mais encore il disait que Dieu était son propre Père, se faisant ainsi égal à Dieu.'
  to: 'C’est pourquoi les Juifs[a] cherchaient d’autant plus à le tuer : non seulement il violait le sabbat, mais encore il appelait Dieu son propre Père, se faisant égal à Dieu.'
  rationale: La révision améliore la correspondance avec la formulation grecque de l’affirmation filiale, tout en conservant l’imparfait, l’intensification, le vocabulaire du sabbat et la portée de « se faisant égal à Dieu ». La note existante est maintenue, car elle est pertinente et correctement ancrée à « les Juifs ».
  reviewer_model: gpt-5.6-terra
