review_pass:
  verdict: revise
  source_fidelity: Le sens général est fidèle, y compris l’imparfait (« cherchaient »), l’intensification et la proposition participiale finale. Toutefois, « il disait que Dieu était son propre Père » est moins directement fidèle à ἔλεγε (« il appelait/disait de Dieu qu’il était ») et peut créer une légère ambiguïté référentielle en français.
  naturalness: Le registre est moderne et accessible. « Voilà pourquoi » est possible, mais « C’est pourquoi » est plus neutre et plus approprié au style biblique français. « d’autant plus » rend naturellement μᾶλλον dans ce contexte.
  terminology: « les Juifs », « le sabbat », « Père » et « égal à Dieu » sont adéquats. La note contextualise utilement « les Juifs » sans modifier le référent textuel ni généraliser l’accusation à l’ensemble du peuple juif.
  issues:
  - severity: low
    issue: Rendu de πατέρα ἴδιον ἔλεγε τὸν θεόν
    rationale: « Il disait que Dieu était son propre Père » est compréhensible, mais « il appelait Dieu son propre Père » reproduit plus directement la construction grecque et évite que « son » paraisse momentanément renvoyer à Dieu plutôt qu’à Jésus.
  - severity: low
    issue: Rendu de μᾶλλον et de la transition initiale
    rationale: « C’est pourquoi ... d’autant plus » est une formulation française plus idiomatique et sobre, qui maintient la relation inférentielle ainsi que l’intensification comparative.
  - severity: low
    issue: Ajout de « ainsi »
    rationale: Le grec exprime le lien par le participe ποιῶν sans l’adverbe « ainsi ». Le supprimer rend la phrase plus resserrée sans perte de sens.
  revised_text: 'C’est pourquoi les Juifs[a] cherchaient d’autant plus à le tuer : non seulement il violait le sabbat, mais encore il appelait Dieu son propre Père, se faisant égal à Dieu.'
