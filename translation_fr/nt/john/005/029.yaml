  rationale: La révision rétablit le verbe unique du grec et rend explicitement les deux compléments parallèles introduits par εἰς, sans imposer que « jugement » signifie nécessairement « condamnation ». « À la vie » rend naturellement en français l’orientation de « résurrection de vie », tandis que « résurrection de jugement » maintient le parallélisme et la formulation plus formelle du second syntagme.
