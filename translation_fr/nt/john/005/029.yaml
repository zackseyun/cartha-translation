review_pass:
  verdict: revise
  source_fidelity: La traduction de κρίσεως par « jugement » est exacte et préserve utilement l’ampleur du grec. En revanche, le grec ne comporte qu’un verbe principal (« ils sortiront »), suivi de deux destinations introduites par εἰς. La répétition de « ressusciteront » transforme la construction en deux actions successives et affaiblit la formulation nominale « résurrection ».
  naturalness: Le français proposé est globalement clair, mais « ils sortiront … ressusciteront » est lourd et peut suggérer que la résurrection survient après la sortie. « Sortiront … pour une résurrection à la vie / pour une résurrection de jugement » est à la fois plus proche de la syntaxe source et lisible dans un registre biblique moderne.
  terminology: « le bien », « le mal », « jugement » et « condamnation » sont appropriés. « Pratiqué le mal » est naturel et peut refléter la distinction lexicale possible entre πράσσω et ποιέω, sans lui attribuer une force doctrinale. « Résurrection de jugement » conserve la formulation génitive grecque; la note explique avec justesse que « condamnation » est plus étroit.
  issues:
  - severity: medium
    issue: Ajout de deux verbes « ressusciteront »
    rationale: ἐκπορεύσονται est le seul verbe fini de la phrase. Les deux expressions εἰς ἀνάστασιν… indiquent l’aboutissement de la sortie; les rendre par « ressusciteront » après « sortiront » peut créer une succession d’événements absente du grec.
  - severity: low
    issue: Placement de l’appel de note
    rationale: L’appel concerne spécifiquement « jugement »; il doit suivre ce mot plutôt que le point final.
