source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: fr
  text: 'et ils sortiront : ceux qui auront fait le bien, pour une résurrection à la vie, mais ceux qui auront pratiqué le mal, pour une résurrection de jugement[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « une résurrection de condamnation ». Le grec dit « jugement », terme dont le sens est plus large ; « condamnation » en constitue ici une interprétation plus précise.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: ils sortiront
  rationale: Dans le contexte immédiat des tombeaux (v. 28), « sortiront » exprime naturellement le mouvement hors des sépulcres sans ajouter « viendront » ou « s’avanceront ».
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: ceux qui auront fait le bien
  rationale: L’adjectif substantivé désigne ce qui est bien; le futur antérieur français situe naturellement ces actes avant la résurrection envisagée au futur.
- source_word: ἀνάστασιν ζωῆς
  choice: ressusciteront pour la vie
  rationale: Cette formulation française explicite idiomatiquement la destination ou l’issue exprimée par εἰς, tout en conservant le parallélisme des deux groupes.
- source_word: τὰ φαῦλα πράξαντες
  choice: ceux qui auront pratiqué le mal
  rationale: « Pratiqué le mal » rend la nuance possible de conduite associée à πράσσω et maintient une légère distinction avec ποιέω, sans limiter le propos à des actes isolés.
- source_word: ἀνάστασιν κρίσεως
  choice: ressusciteront pour le jugement
  rationale: κρίσις signifie d’abord « jugement »; ce choix évite de réduire le terme à « condamnation » et conserve la portée exacte ainsi que la tension du grec.
- source_word: δὲ
  choice: mais
  rationale: « Mais » marque clairement le contraste entre les deux groupes et leurs issues respectives.
theological_decisions:
- issue: Faut-il rendre κρίσεως par « jugement » ou par le terme plus étroit « condamnation » ?
  choice: jugement
  alternative: condamnation
  rationale: Le contexte est solennel et négatif, mais κρίσις ne signifie pas nécessairement à lui seul « condamnation ». « Jugement » préserve la largeur sémantique du grec sans imposer une conclusion plus précise que le texte.
translation_notes:
  register: Français international moderne, clair et digne. La répétition de « ressusciteront » remplace naturellement en français les deux syntagmes grecs elliptiques avec εἰς ἀνάστασιν et rend le parallélisme immédiatement compréhensible. Le futur antérieur rend les participes aoristes comme des conduites antérieures à la résurrection future.
