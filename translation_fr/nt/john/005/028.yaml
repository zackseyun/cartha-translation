id: JHN.5.28
reference: John 5:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: fr
  text: Ne vous en étonnez pas, car l’heure vient où tous ceux qui sont dans les tombeaux[a] entendront sa voix.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « tombes ». Le grec peut désigner de manière générale des lieux de sépulture ; « tombeaux » conserve ici l’image concrète.
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάζετε τοῦτο
  choice: Ne vous en étonnez pas
  rationale: Le présent impératif avec μή exprime une interdiction. Cette tournure est naturelle en français moderne et rend le renvoi de τοῦτο par le pronom « en », sans alourdir par « Ne vous étonnez pas de cela ».
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit ici la raison de l’interdiction. « Car » exprime clairement ce lien causal dans un registre digne et courant.
- source_word: ἔρχεται ὥρα
  choice: l’heure vient
  rationale: La tournure conserve le terme « heure », important dans le vocabulaire johannique. L’article défini est idiomatique dans cette expression française sans imposer à lui seul une identification plus précise que le contexte.
- source_word: ἐν ᾗ
  choice: où
  rationale: « Où » rend naturellement la relative temporelle en français tout en maintenant le lien avec « l’heure ».
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: tous ceux qui sont dans les tombeaux
  rationale: πάντες οἱ est rendu par « tous ceux qui ». « Tombeaux » préserve l’image concrète de lieux funéraires portée par μνημεῖα.
- source_word: ἀκούσουσιν τῆς φωνῆς αὐτοῦ
  choice: entendront sa voix
  rationale: Le futur est conservé, et le génitif grec après ἀκούω se rend idiomatiquement par un complément direct en français.
theological_decisions:
- issue: La résurrection suggérée par ceux qui sont dans les tombeaux et qui entendent sa voix
  choice: Conserver l’image concrète des « tombeaux » sans ajouter d’explication doctrinale dans le verset.
  alternative: Employer « tombes » ou expliciter que les morts ressusciteront.
  rationale: Le texte prépare explicitement la sortie des tombeaux au verset suivant, mais ce verset-ci doit garder sa formulation propre et sa progression sans anticipation explicative.
translation_notes:
  register: Français international moderne, fluide et digne. La formulation « Ne vous en étonnez pas » évite l’archaïsme de « Ne vous émerveillez pas », tandis que « l’heure vient » conserve la résonance johannique du grec.
