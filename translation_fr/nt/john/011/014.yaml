lexical_decisions:
- source_word: τότε οὖν
  choice: Alors
  rationale: L’ensemble marque la progression du récit avec une nuance de conséquence ou de transition. En français, « Alors » rend naturellement ce mouvement sans alourdir la phrase.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: « Leur dit » correspond directement à la construction grecque et convient au registre narratif courant et digne.
- source_word: παρρησίᾳ
  choice: clairement
  rationale: Dans ce contexte, l’adverbe oppose la déclaration explicite de Jésus à son expression antérieure et figurée au sujet du sommeil. « Clairement » souligne que Jésus lève désormais toute ambiguïté.
- source_word: Λάζαρος
  choice: Lazare
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ἀπέθανεν
  choice: est mort
  rationale: Le passé composé exprime naturellement en français un événement accompli dont le résultat demeure pertinent dans la situation présente.
theological_decisions:
- issue: Nature de la déclaration de Jésus sur l’état de Lazare
  choice: Une déclaration directe de la mort physique de Lazare, qui explicite l’image précédente du sommeil.
  alternative: Conserver ici le langage figuré du sommeil.
  rationale: Le verbe ἀπέθανεν désigne explicitement la mort et le texte grec lui-même dissipe l’ambiguïté précédente. La traduction doit donc être tout aussi directe.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation reste concise et suit étroitement le mouvement du grec.
