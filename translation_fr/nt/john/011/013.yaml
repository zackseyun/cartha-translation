review_pass:
  verdict: revise
  source_fidelity: La formulation « sa mort » est ambiguë en français après le sujet « Jésus », alors que αὐτοῦ renvoie à Lazare dans le contexte. « De la mort de Lazare » restitue le référent voulu. La paire κοιμήσεως τοῦ ὕπνου désigne le sommeil au sens littéral, par opposition à la mort figurativement appelée sommeil.
  naturalness: « Du repos du sommeil » est peu idiomatique et ne rend pas naturellement le contraste visé. « Du sommeil au sens propre » est fluide en français international actuel et explicite le malentendu sans ajouter de doctrine.
  terminology: « Mort », « sommeil » et « au sens propre » préservent le contraste narratif. La note garde trace de la répétition grecque sans faire de « repos » un équivalent artificiel de κοιμήσεως.
  issues:
