    issue: Antécédent ambigu de « sa mort »
    rationale: En français, le possessif peut spontanément renvoyer à Jésus, sujet de la principale, tandis que le grec vise Lazare dans le contexte immédiat.
  - severity: medium
    issue: « du repos du sommeil » est artificiel et imprécis
    rationale: Le grec emploie deux termes apparentés au sommeil; « repos » n'est pas nécessaire et la tournure française est peu naturelle. Le sens contextuel est celui du sommeil littéral.
  - severity: low
    issue: Ancre de note placée après « mort »
    rationale: La note porte sur κοιμήσεως τοῦ ὕπνου, donc elle doit être attachée à l'expression française qui rend le sommeil littéral.
