id: JHN.11.13
reference: John 11:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: fr
  text: Jésus avait parlé de la mort de Lazare, mais eux pensaient qu’il parlait du sommeil au sens propre[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « du sommeil du sommeil ». La répétition souligne qu’ils comprenaient le sommeil au sens propre, et non la mort.'
    reason: La note rend compte de la construction grecque répétitive (κοιμήσεως τοῦ ὕπνου) et de son contraste contextuel avec la mort.
lexical_decisions:
- source_word: εἰρήκει
  choice: avait parlé
  rationale: Le plus-que-parfait grec situe les paroles de Jésus avant l’interprétation erronée des disciples ; « avait parlé » restitue naturellement cette antériorité.
- source_word: δὲ … δὲ
  choice: Ø … mais
  rationale: Le premier δέ assure une transition légère qui n’exige pas de mot introductif en français ; le second marque nettement le contraste et se rend par « mais ».
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: de sa mort
  rationale: La préposition περί avec le génitif signifie ici « au sujet de ». Le possessif reprend Lazare dans le contexte, tout en conservant la forme pronominale du grec.
- source_word: ἐκεῖνοι
  choice: eux
  rationale: Le pronom tonique met légèrement en relief les disciples face à Jésus et rend la valeur démonstrative de ἐκεῖνοι sans lourdeur.
- source_word: ἔδοξαν
  choice: pensaient
  rationale: Dans ce contexte, δοκέω exprime l’interprétation erronée des disciples. L’imparfait s’accorde naturellement avec « qu’il parlait ».
- source_word: κοιμήσεως τοῦ ὕπνου
  choice: du repos du sommeil
  rationale: Cette formulation conserve les deux noms grecs et distingue le sommeil littéral compris par les disciples de l’emploi figuré qui désignait la mort.
- source_word: λέγει
  choice: qu’il parlait
  rationale: Le présent grec a ici une valeur narrative ; l’imparfait français est naturel dans le discours indirect après « pensaient ».
theological_decisions:
- issue: Le rapport entre le sommeil et la mort
  choice: Présenter explicitement la mort comme ce dont Jésus parlait, puis le sommeil comme l’interprétation littérale des disciples.
  alternative: Employer une formulation qui ferait du verset un enseignement sur l’état des morts.
  rationale: Le texte explique un malentendu narratif entre l’usage figuré du sommeil et le sommeil physique ; il ne développe pas ici une doctrine de l’état intermédiaire.
translation_notes:
  register: Français international actuel, sobre et digne. La syntaxe reste proche du grec tout en étant naturelle ; « eux » conserve le léger contraste porté par le démonstratif grec.
