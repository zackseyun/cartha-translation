id: JHN.11.19
reference: John 11:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: fr
  text: Beaucoup de Juifs étaient venus auprès de Marthe et de Marie pour les consoler au sujet de leur frère[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Beaucoup de Judéens étaient venus auprès de Marthe et de Marie pour les consoler au sujet de leur frère. » Le terme grec peut désigner les Juifs en général ou, dans certains contextes de Jean, plus précisément les habitants de la Judée.'
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: Beaucoup
  rationale: πολλοί signifie « beaucoup ». δέ est ici un connecteur léger que le français naturel peut laisser implicite sans créer de contraste artificiel.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: de Juifs
  rationale: 'La construction est partitive : beaucoup parmi les Juifs. Dans ce contexte non polémique, « Juifs » désigne naturellement des membres du peuple juif; la possibilité « Judéens » est signalée en note.'
- source_word: ἐληλύθεισαν
  choice: étaient venus
  rationale: Le plus-que-parfait marque une venue antérieure au moment narratif.
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: auprès de Marthe et de Marie
  rationale: πρός avec l’accusatif indique ici qu’ils étaient venus trouver les deux sœurs; « auprès de » convient naturellement à une visite de deuil.
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: pour les consoler
  rationale: ἵνα avec le subjonctif exprime le but, et παραμυθέομαι désigne l’action de réconforter ou consoler des personnes en deuil.
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: de la mort de leur frère
  rationale: Littéralement « au sujet de leur frère ». Dans le contexte funéraire, le français idiomatique exprime la cause du deuil; « leur » rend explicite le lien commun des deux sœurs avec Lazare.
theological_decisions:
- issue: Sens de Ἰουδαίων dans l’Évangile selon Jean
  choice: Juifs
  alternative: Judéens
  rationale: Le contexte décrit des personnes venues consoler les sœurs et ne vise pas spécialement les autorités ni un groupe hostile. Le sens ethnoreligieux large convient, tout en conservant en note l’ambiguïté géographique possible.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation explicite sobrement le contexte de deuil, tandis que la note conserve une traduction plus littérale et l’ambiguïté de Ἰουδαίων.
