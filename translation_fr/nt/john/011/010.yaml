id: JHN.11.10
reference: John 11:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: fr
  text: Mais si quelqu’un marche dans la nuit, il trébuche, parce que la lumière n’est pas en lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la lumière n’est pas avec lui ». Le grec dit plus littéralement « en lui », ce qui peut suggérer davantage que la seule absence de lumière extérieure.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ
  choice: Mais si
  rationale: Exprime simplement la condition et le contraste avec le verset précédent.
- source_word: τις
  choice: quelqu’un
  rationale: Rend naturellement le pronom indéfini à portée générale.
- source_word: περιπατῇ
  choice: marche
  rationale: Conserve l’image concrète de la marche ainsi que sa possible portée métaphorique.
- source_word: ἐν τῇ νυκτί
  choice: dans la nuit
  rationale: Suit de près l’expression grecque et préserve l’image de la nuit sans la remplacer par son interprétation abstraite.
- source_word: προσκόπτει
  choice: trébuche
  rationale: Rend le sens physique tout en laissant percevoir une portée figurée.
- source_word: ὅτι
  choice: parce que
  rationale: Marque clairement la cause du fait de trébucher.
- source_word: τὸ φῶς
  choice: la lumière
  rationale: Conserve le caractère défini de la lumière dans le discours.
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: n’est pas en lui
  rationale: Reproduit le grec ἐν αὐτῷ et maintient la tension entre l’image de l’éclairage et une possible dimension intérieure.
theological_decisions:
- issue: Référent et portée de « la lumière n’est pas en lui »
  choice: Conserver la formulation intérieure « en lui » sans la réduire à la seule absence d’un éclairage extérieur.
  alternative: « la lumière n’est pas avec lui », compris comme une simple absence d’éclairage
  rationale: La préposition grecque ἐν signifie naturellement « en, dans ». Le langage johannique de la lumière peut aussi comporter une profondeur théologique; la formulation retenue préserve cette ambiguïté sans imposer une interprétation exclusivement matérielle ou spirituelle.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du grec tout en étant naturelle; « marche », « nuit », « trébuche » et « en lui » préservent à la fois l’image concrète et sa possible portée spirituelle.
