id: JHN.11.37
reference: John 11:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: fr
  text: 'Mais quelques-uns d’entre eux dirent[a] : « Celui qui a ouvert les yeux de l’aveugle ne pouvait-il pas aussi empêcher cet homme de mourir ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Cet homme qui a ouvert les yeux de l’aveugle ne pouvait-il pas aussi faire en sorte que celui-ci ne meure pas ? »'
    reason: Cette formulation restitue plus directement le premier οὗτος (« cet homme ») et la construction causative ποιῆσαι ἵνα, mais dans un français moins fluide.
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Mais quelques-uns d’entre eux
  rationale: « Quelques-uns d’entre eux » rend naturellement τινὲς ἐξ αὐτῶν, tandis que « mais » marque le contraste introduit par δέ avec la réaction précédente.
- source_word: εἶπαν
  choice: dirent
  rationale: L’aoriste narratif appelle ici un passé simple, registre naturel et digne dans un récit biblique écrit.
- source_word: Οὐκ ἐδύνατο
  choice: ne pouvait-il pas
  rationale: La question négative conserve la valeur rhétorique de la formulation grecque et situe la capacité dans le passé sans la transformer en accusation explicite.
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: Celui qui a ouvert les yeux de l’aveugle
  rationale: La relative française rend naturellement le participe aoriste substantivé et identifie Jésus par le signe rapporté en Jean 9. Employer « celui » évite la lourdeur et l’ambiguïté de deux occurrences rapprochées de « cet homme ».
- source_word: ποιῆσαι ἵνα
  choice: empêcher … de
  rationale: Dans ce contexte, la construction exprime le fait de produire un résultat, à savoir éviter la mort. « Empêcher … de mourir » est la formulation française la plus directe et naturelle; la note conserve une expression plus formellement proche de la structure grecque.
- source_word: καὶ
  choice: aussi
  rationale: « Aussi » exprime l’idée que celui qui avait guéri l’aveugle aurait également pu prévenir la mort.
- source_word: οὗτος
  choice: cet homme
  rationale: Le démonstratif désigne Lazare. « Cet homme » le restitue sans introduire son nom là où le grec ne le donne pas.
- source_word: μὴ ἀποθάνῃ
  choice: de mourir
  rationale: 'Avec « empêcher », l’infinitif négativement orienté rend idiomatiquement le résultat visé par la proposition en ἵνα : que Lazare ne meure pas.'
theological_decisions:
- issue: Tonalité de la question des intervenants
  choice: Une question rhétorique teintée de reproche concernant la capacité de Jésus à empêcher la mort de Lazare
  alternative: Une demande neutre portant simplement sur sa capacité
  rationale: La question négative introduite par Οὐκ suggère qu’ils estimaient possible une intervention de Jésus. La traduction laisse entendre cette critique sans expliciter davantage leurs intentions.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient à la narration écrite. La formulation principale privilégie une équivalence optimale et idiomatique, tandis que la note préserve les traits plus formels de la construction grecque.
