id: JHN.11.34
reference: John 11:34
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: fr
  text: 'Et il dit : « Où l’avez-vous déposé ? » Ils lui dirent : « Seigneur[a], viens et vois. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur ». Le grec κύριε peut être une formule d’adresse respectueuse ; « Seigneur » est retenu dans le texte principal.
    reason: Lecture alternative liée à l’ambivalence du titre κύριε.
lexical_decisions:
- source_word: εἶπεν
  choice: il dit
  rationale: Le verbe λέγω désigne normalement l’action de parler. Bien que la parole soit une question, « il dit » respecte la formulation grecque et reste naturel en français.
- source_word: Ποῦ
  choice: Où
  rationale: Adverbe interrogatif direct exprimant le lieu.
- source_word: τεθείκατε
  choice: avez-vous déposé
  rationale: Le parfait actif de τίθημι évoque ici l’action accomplie de placer le corps de Lazare. « Déposer » convient au contexte funéraire tout en restant sobre.
- source_word: αὐτόν
  choice: le
  rationale: Pronom masculin singulier renvoyant à Lazare; le français emploie naturellement le pronom objet direct « le » avec « déposer ».
- source_word: λέγουσιν
  choice: Ils lui répondirent
  rationale: Le présent historique grec est rendu par un passé simple, naturel dans ce récit. Puisque la parole répond directement à la question de Jésus, « répondirent » explicite sans ambiguïté la fonction du verbe de parole.
- source_word: Κύριε
  choice: Seigneur
  rationale: Comme adresse à Jésus, κύριε peut être un titre de respect ou porter une résonance christologique. « Seigneur » préserve ces deux possibilités mieux que « Monsieur ».
- source_word: ἔρχου
  choice: viens
  rationale: Impératif présent singulier de ἔρχομαι, rendu directement par « viens ».
- source_word: ἴδε
  choice: vois
  rationale: Impératif aoriste de ὁράω. « Viens et vois » restitue naturellement l’enchaînement des deux impératifs et fait écho à une expression johannique récurrente.
theological_decisions:
- issue: Sens de κύριε dans l’adresse faite à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: Le mot grec peut fonctionner comme une adresse respectueuse, mais « Seigneur » conserve aussi sa possible portée christologique sans imposer que les locuteurs en saisissent ici tout le sens.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple maintient un registre narratif soutenu mais courant dans la traduction biblique. « Déposé » convient au contexte du tombeau sans ajouter explicitement l’idée d’ensevelissement.
