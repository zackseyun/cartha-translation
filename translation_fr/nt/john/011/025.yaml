id: JHN.11.25
reference: John 11:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: fr
  text: 'Jésus lui dit : « Moi, je suis la résurrection et la vie. Celui[a] qui croit en moi, même s’il meurt, vivra. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Quiconque croit en moi, même s’il meurt, vivra ». Le grec emploie le masculin singulier (« celui qui croit… même s’il meurt ») dans un sens représentatif.
    reason: Préciser la portée générale du masculin singulier grec et signaler une autre formulation française possible.
lexical_decisions:
- source_word: εἶπεν αὐτῇ
  choice: Jésus lui dit
  rationale: Le passé simple « dit » convient à l’introduction narrative, et « lui » rend le datif féminin αὐτῇ, qui renvoie à Marthe dans le contexte.
- source_word: Ἐγώ εἰμι
  choice: Moi, je suis
  rationale: La dislocation naturelle en français met en relief le pronom ἐγώ tout en conservant directement l’affirmation « je suis ».
- source_word: ἡ ἀνάστασις
  choice: la résurrection
  rationale: Dans ce contexte, ἀνάστασις désigne la résurrection d’entre les morts. L’article défini et l’identification directe sont maintenus.
- source_word: ἡ ζωή
  choice: la vie
  rationale: L’article grec et le parallélisme avec « la résurrection » sont conservés, sans réduire l’affirmation à l’idée que Jésus donnerait seulement la vie.
- source_word: ὁ πιστεύων
  choice: Celui qui croit
  rationale: Cette formulation rend le participe substantivé au singulier et son sens général, tout en restant idiomatique en français.
- source_word: εἰς ἐμέ
  choice: en moi
  rationale: « Croire en » est l’équivalent français naturel de πιστεύω avec εἰς et exprime ici la confiance placée en Jésus.
- source_word: κἂν ἀποθάνῃ
  choice: même s’il meurt
  rationale: κἄν introduit une concession éventuelle; « même si » avec le présent est la tournure française idiomatique correspondante.
- source_word: ζήσεται
  choice: vivra
  rationale: Le futur simple reproduit la promesse sans préciser davantage que le grec s’il s’agit de revivre ou de continuer à vivre.
theological_decisions:
- issue: Le masculin singulier représentatif de ὁ πιστεύων et des formes verbales qui suivent
  choice: Celui qui croit en moi, même s’il meurt, vivra
  alternative: Quiconque croit en moi, même s’il meurt, vivra
  rationale: Le singulier du grec est conservé. En français, « celui qui » et « il » peuvent avoir une portée représentative; la note explicite que la promesse concerne toute personne qui croit.
- issue: La portée de l’identification Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή
  choice: Moi, je suis la résurrection et la vie
  alternative: C’est moi qui donne la résurrection et la vie
  rationale: La formulation retenue préserve l’identification directe et sa force christologique, sans la transformer en simple description fonctionnelle.
translation_notes:
  register: Français moderne, international et soutenu sans archaïsme. « Moi, je suis » rend l’emphase grecque de façon naturelle; le passé simple « dit » demeure courant dans la narration biblique écrite.
