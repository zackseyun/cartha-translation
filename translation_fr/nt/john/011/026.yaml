  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: fr
  text: Et toute personne qui vit et croit en moi ne mourra jamais. Crois-tu cela ?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν
  choice: toute personne qui vit
  rationale: Rend naturellement la construction grecque substantivée tout en conservant sa portée universelle et le verbe « vivre » sans en préciser le sens.
- source_word: πιστεύων εἰς ἐμέ
  choice: croit en moi
  rationale: Expression française naturelle correspondant à la foi dirigée vers Jésus.
- source_word: οὐ μὴ ἀποθάνῃ
  choice: ne mourra jamais
  rationale: La tournure française catégorique avec « jamais » exprime la négation grecque fortement emphatique sans lourdeur artificielle.
- source_word: εἰς τὸν αἰῶνα
  choice: jamais
  rationale: Dans cette construction négative, l’expression idiomatique signifie « à jamais / pour toujours » et se rend naturellement en français par « jamais ».
- source_word: πιστεύεις τοῦτο;
  choice: Crois-tu cela ?
  rationale: Conserve la question directe, personnelle et concise du grec.
theological_decisions:
- issue: Nature de la mort niée
  choice: Conserver l’affirmation non qualifiée « ne mourra jamais »
  alternative: Expliciter « ne connaîtra jamais la mort éternelle » ou « vivra éternellement »
  rationale: Le grec dit simplement « mourir » et laisse subsister la tension avec la mort physique; une précision sur la « mort éternelle » résoudrait interprétativement une ambiguïté que le texte ne formule pas.
- issue: Sens de « vivre »
  choice: Conserver le simple verbe « vit »
  alternative: Préciser « est spirituellement vivant » ou « reste en vie »
  rationale: Le contexte peut inviter plusieurs niveaux de lecture, mais le verset lui-même ne qualifie pas explicitement la vie en question.
translation_notes:
  register: Français international moderne, simple et digne. La formulation reste directe et mémorable, sans explicitation doctrinale ni note superflue.
