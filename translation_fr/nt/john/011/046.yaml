source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: fr
  text: Mais quelques-uns d’entre eux se rendirent auprès des Pharisiens et leur dirent ce que Jésus avait fait[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « leur rapportèrent ce que Jésus avait fait ». Le grec ne précise pas le motif de ceux qui se rendirent auprès des Pharisiens.'
    reason: Alternative lexicale et préservation de l’ambiguïté concernant leur intention.
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: Mais quelques-uns d’entre eux
  rationale: « Quelques-uns d’entre eux » désigne naturellement une partie du groupe mentionné auparavant. « Mais » rend le contraste marqué par δέ avec ceux qui avaient cru au verset précédent.
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: allèrent trouver les pharisiens
  rationale: Cette formulation française naturelle exprime le déplacement vers les pharisiens sans surcharger le verbe ἀπέρχομαι. Le nom du groupe est traité comme un nom commun en français moderne.
- source_word: εἶπαν αὐτοῖς
  choice: leur dirent
  rationale: Rend directement λέγω avec son complément indirect tout en conservant une formulation neutre qui n’attribue aucun motif aux personnes concernées.
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: ce que Jésus avait fait
  rationale: « Ce que » rend naturellement le relatif neutre pluriel ἃ. Le plus-que-parfait situe clairement l’action de Jésus avant le récit qui en est fait.
theological_decisions:
- issue: Motif des personnes allant trouver les pharisiens
  choice: 'Formulation neutre : « leur dirent »'
  alternative: « le dénoncèrent auprès d’eux » ou « les informèrent contre Jésus »
  rationale: Le grec rapporte leur déplacement et leurs paroles, mais ne précise pas explicitement s’ils agissent par hostilité, inquiétude ou pour une autre raison. La traduction ne tranche donc pas cette ambiguïté narrative.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste simple et accessible; la traduction conserve le contraste narratif sans prêter aux personnages une intention que le verset n’énonce pas.
