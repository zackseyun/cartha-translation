id: JHN.11.55
reference: John 11:55
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: fr
  text: La Pâque des Juifs était proche[a], et beaucoup de gens montèrent de la campagne à Jérusalem avant la Pâque, afin de se purifier[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la Pâque juive ». Le grec dit plus littéralement « la Pâque des Juifs », expression qui revient plusieurs fois dans l’Évangile selon Jean.
    reason: lexical_alternative
  - marker: b
    text: C’est-à-dire se soumettre à une purification rituelle en préparation de la Pâque.
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: était
  rationale: Le faible lien narratif exprimé par δέ peut rester implicite en français; ajouter « Or » ou « Maintenant » alourdirait le verset ou introduirait une nuance temporelle absente.
- source_word: ἐγγὺς
  choice: proche
  rationale: Ce terme exprime ici une proximité temporelle; « proche » est clair, naturel et fidèle.
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: la Pâque des Juifs
  rationale: Cette formulation conserve la construction génitive et l’expression récurrente de Jean, tout en restant compréhensible en français.
- source_word: ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα
  choice: beaucoup de gens montèrent ... à Jérusalem
  rationale: « Montèrent » préserve la manière conventionnelle et géographique de parler du voyage vers Jérusalem; « beaucoup de gens » rend naturellement l’adjectif substantivé πολλοί.
- source_word: ἐκ τῆς χώρας
  choice: de la campagne
  rationale: Dans ce contexte, χώρα désigne le territoire rural hors de la ville; « la campagne » rend clairement ce contraste sans préciser une région non nommée.
- source_word: πρὸ τοῦ πάσχα
  choice: avant la Pâque
  rationale: Rendu temporel direct et idiomatique.
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: afin de se purifier
  rationale: « Afin de » marque explicitement le but porté par ἵνα avec le subjonctif, tandis que « se purifier » conserve la portée rituelle sans la développer dans le texte principal.
theological_decisions:
- issue: Nature de la purification avant la Pâque
  choice: afin de se purifier
  alternative: afin de se purifier rituellement; afin de se consacrer
  rationale: Le contexte renvoie aux pratiques juives de purification préparant la célébration de la Pâque. Le texte principal garde le terme général du grec et la note précise le cadre rituel, sans importer une catégorie sacramentelle chrétienne ni réduire le geste à une purification morale intérieure.
translation_notes:
  register: Français international moderne, digne et accessible. La tournure « la Pâque des Juifs » maintient la formulation johannique; « montèrent à Jérusalem » conserve l’expression traditionnelle du pèlerinage sans paraître archaïque. Les appels de note sont placés auprès des expressions qu’ils expliquent.
