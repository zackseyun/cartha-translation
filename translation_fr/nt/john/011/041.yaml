id: JHN.11.41
reference: John 11:41
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: fr
  text: 'Ils enlevèrent donc la pierre. Jésus leva les yeux[a] et dit : « Père, je te remercie de ce que tu m’as entendu[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « leva les yeux vers le haut »; on peut aussi traduire : « regarda en haut ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « tu m’as écouté ». Dans ce contexte de prière, « entendre » peut impliquer une écoute favorable.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: enlevèrent
  rationale: Dans le contexte de l’entrée du tombeau, αἴρω désigne le fait d’ôter ou de déplacer la pierre. « Enlevèrent » est naturel en français et évite de suggérer qu’ils se contentent de la soulever.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque ici la conséquence narrative de l’ordre donné précédemment. « Donc » conserve clairement ce lien.
- source_word: λίθον
  choice: pierre
  rationale: « Pierre » est le terme français usuel pour l’objet qui fermait le tombeau.
- source_word: ὁ δὲ Ἰησοῦς
  choice: Jésus
  rationale: δέ assure une transition narrative légère, que l’enchaînement naturel des phrases françaises suffit à exprimer sans introduire un contraste artificiel.
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: leva les yeux
  rationale: Cette expression française naturelle conserve l’image du geste et implique déjà le mouvement vers le haut; une note signale la formulation grecque plus explicite.
- source_word: Πάτερ
  choice: Père
  rationale: Le vocatif direct convient à la prière de Jésus et garde à la fois la proximité et la dignité du grec.
- source_word: εὐχαριστῶ σοι
  choice: je te remercie
  rationale: Formulation française directe et actuelle qui rend fidèlement le présent de l’action de grâce.
- source_word: ὅτι ἤκουσάς μου
  choice: de ce que tu m’as entendu
  rationale: Le passé composé exprime naturellement en français une action accomplie dont la portée demeure présente. « Entendu » conserve aussi, dans ce contexte de prière, la possibilité d’une écoute favorable sans l’expliciter excessivement.
theological_decisions:
- issue: Adresse de Jésus à Dieu dans la prière
  choice: Père
  alternative: Ô Père
  rationale: Le simple vocatif traduit le texte sans lui ajouter une coloration liturgique ou archaïque.
- issue: Portée de ἤκουσάς μου dans le contexte de la prière
  choice: tu m’as entendu
  alternative: tu m’as écouté / tu m’entendis
  rationale: Cette formulation affirme que le Père a entendu Jésus sans développer au-delà du texte la nature de leur relation ni une doctrine générale de l’exaucement.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple fait avancer le récit, tandis que le passé composé dans la parole de Jésus souligne naturellement en français le résultat présent d’une action accomplie. Les marqueurs de notes ont été placés sur les expressions auxquelles les variantes lexicales se rapportent.
