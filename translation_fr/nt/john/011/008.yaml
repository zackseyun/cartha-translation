id: JHN.11.8
reference: John 11:8
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: fr
  text: 'Les disciples lui disent[a] : « Rabbi, tout récemment, les Juifs cherchaient à te lapider, et tu y retournes ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens » ou, selon le contexte, « les responsables juifs ». Dans l’Évangile selon Jean, l’expression « les Juifs » désigne souvent les adversaires de Jésus en Judée plutôt que le peuple juif dans son ensemble.
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: disent
  rationale: Le présent historique grec est conservé, car il est naturel dans la narration française et donne de la vivacité à la scène.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: Le titre sémitique transcrit par le grec est maintenu, conformément au style johannique, plutôt que remplacé par « Maître ».
- source_word: νῦν
  choice: tout récemment
  rationale: Dans ce contexte, l’adverbe renvoie à la proximité temporelle de la tentative de lapidation, non au moment présent au sens strict.
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait rend l’aspect duratif ou conatif du verbe grec sans préciser davantage si la tentative avait déjà commencé.
- source_word: λιθάσαι
  choice: à te lapider
  rationale: « Lapider » est l’équivalent français direct et idiomatique; la mort est impliquée mais n’est pas explicitement ajoutée.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Il s’agit du sens lexical direct. Comme l’usage johannique peut ici viser plus précisément des Judéens ou des responsables juifs hostiles, cette portée contextuelle est signalée en note plutôt qu’imposée dans le texte.
- source_word: πάλιν ὑπάγεις ἐκεῖ
  choice: tu veux retourner là-bas
  rationale: La question grecque exprime avec naturel l’étonnement devant l’intention de repartir au même endroit. « Retourner là-bas » rend ensemble πάλιν et ἐκεῖ; « tu veux » explicite idiomatiquement l’intention portée par la question, sans changer son enjeu.
theological_decisions:
- issue: Référent de οἱ Ἰουδαῖοι dans Jean
  choice: les Juifs
  alternative: les Judéens; les responsables juifs
  rationale: Le texte principal garde le sens lexical non spécifié. La note prévient toutefois une généralisation à l’ensemble du peuple juif et préserve l’ambiguïté entre désignation géographique, collective et opposition locale.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe des disciples à Jésus. La formulation interrogative conserve leur inquiétude et leur étonnement.
