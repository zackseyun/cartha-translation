id: JHN.11.56
reference: John 11:56
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: fr
  text: 'Ils cherchaient donc Jésus et se disaient entre eux, debout dans l’enceinte du Temple[a] : « Qu’en pensez-vous ? Il ne viendra certainement pas[b] à la fête ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne ici l’ensemble du domaine ou de l’enceinte du Temple, et non spécifiquement le sanctuaire intérieur.
    reason: cultural_note
  - marker: b
    text: 'Ou : « il ne viendra vraiment pas ». Le grec emploie une négation fortement appuyée (οὐ μή).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: cherchaient
  rationale: L’imparfait grec présente une recherche en cours ou répétée ; l’imparfait français en rend naturellement l’aspect.
- source_word: οὖν
  choice: donc
  rationale: Le terme relie cette scène au contexte précédent et marque ici la progression narrative ou la conséquence.
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: se disaient les uns aux autres
  rationale: Cette formulation rend à la fois l’action continue exprimée par l’imparfait et la réciprocité de l’échange.
- source_word: ἐν τῷ ἱερῷ
  choice: dans l’enceinte du Temple
  rationale: ἱερόν désigne l’ensemble du domaine du Temple plutôt que le sanctuaire intérieur ; « enceinte du Temple » communique cette distinction en français courant.
- source_word: ἑστηκότες
  choice: tandis qu’ils se tenaient
  rationale: Le participe parfait décrit leur position stable pendant la conversation.
- source_word: Τί δοκεῖ ὑμῖν;
  choice: Qu’en pensez-vous ?
  rationale: Expression française idiomatique qui restitue directement la demande d’opinion.
- source_word: οὐ μὴ ἔλθῃ
  choice: Il ne viendra certainement pas
  rationale: La double négation οὐ μή avec le subjonctif aoriste exprime une négation fortement appuyée ; « certainement pas » en conserve la force sans archaïsme.
- source_word: εἰς τὴν ἑορτήν
  choice: à la fête
  rationale: Dans le contexte, ἑορτή désigne la fête juive de la Pâque ; « la fête » reste concis et renvoie naturellement à cette célébration déjà connue du lecteur.
theological_decisions:
- issue: Force et portée de la question finale
  choice: 'Conserver deux interrogations successives : « Qu’en pensez-vous ? Il ne viendra certainement pas… ? »'
  alternative: « Qu’en pensez-vous ? Pensez-vous qu’il ne viendra pas à la fête ? »
  rationale: La formulation retenue suit la structure grecque, maintient l’insistance de οὐ μή et laisse subsister la nuance pragmatique de la question, qui peut exprimer l’incertitude ou l’attente des interlocuteurs sans imposer une interprétation.
translation_notes:
  register: Français international moderne, naturel et digne. « Temple » prend la majuscule puisqu’il s’agit du Temple de Jérusalem. La syntaxe conserve les deux questions du grec tout en restant fluide à l’oral.
