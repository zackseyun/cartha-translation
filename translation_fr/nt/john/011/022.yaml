  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: fr
  text: Mais maintenant encore[a], je sais que tout ce que tu demanderas à Dieu, Dieu te le donnera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Et maintenant, je sais ». Dans ce contexte, la conjonction grecque peut aussi se rendre simplement par « et » ; elle introduit ici un tournant après l''évocation de la mort de Lazare.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: Mais même maintenant
  rationale: Dans ce contexte, καί marque une transition à valeur contrastive après l'évocation de la mort de Lazare, tandis que νῦν conserve sa pleine valeur temporelle.
- source_word: οἶδα
  choice: je sais
  rationale: Le parfait grec a ici un sens présent; « je sais » est direct et naturel.
- source_word: ὅσα ἂν αἰτήσῃ
  choice: tout ce que tu demanderas
  rationale: Le relatif avec ἄν et le subjonctif exprime une généralité indéfinie. Le futur français convient naturellement dans cette proposition relative à portée éventuelle.
- source_word: αἰτήσῃ τὸν θεόν
  choice: tu demanderas à Dieu
  rationale: Le grec construit αἰτέω avec Dieu comme complément direct, mais le français idiomatique dit « demander à Dieu » lorsque la chose demandée est exprimée par « tout ce que ».
- source_word: δώσει σοι ὁ θεός
  choice: Dieu te le donnera
  rationale: Le pronom « le » reprend naturellement « tout ce que » en français; « donnera » reste proche de δίδωμι sans introduire l'idée plus interprétative d'exaucement.
theological_decisions:
- issue: La parole de Marthe distingue Jésus de Dieu dans la formulation de sa demande.
  choice: Conserver « tu demanderas à Dieu, Dieu te le donnera » sans développement doctrinal.
  alternative: Remplacer « Dieu » par « le Père » ou reformuler pour atténuer l'apparente subordination.
  rationale: Le verset rapporte les paroles de Marthe et leur tension narrative doit être préservée. Le texte ne justifie ni une expansion trinitaire ni une lecture antitrinitaire imposée.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue direct. La répétition de « Dieu » est conservée comme dans le grec, et le futur rend idiomatiquement la construction indéfinie grecque.
