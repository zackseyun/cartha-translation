  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: fr
  text: 'Après avoir dit cela, il cria d’une voix forte : « Lazare, sors ! »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: cela
  rationale: Le grec emploie un démonstratif neutre pluriel (« ces choses »), mais le français courant reprend naturellement l’ensemble des paroles précédentes par le singulier collectif « cela ».
- source_word: εἰπὼν
  choice: Après avoir dit
  rationale: Le participe aoriste exprime une action antérieure à celle du verbe principal ; cette tournure restitue clairement la succession temporelle.
- source_word: φωνῇ μεγάλῃ
  choice: d’une voix forte
  rationale: Le datif indique ici la manière ; « d’une voix forte » est une formulation française naturelle qui conserve l’accent mis sur le volume.
- source_word: ἐκραύγασεν
  choice: il cria
  rationale: Le verbe désigne un cri puissant ou un appel lancé à haute voix. « Il cria » en garde la vigueur sans lourdeur redondante.
- source_word: Λάζαρε
  choice: Lazare
  rationale: Le vocatif du nom propre est rendu selon sa forme française traditionnelle et courante.
- source_word: δεῦρο ἔξω
  choice: viens dehors
  rationale: δεῦρο fonctionne comme une invitation ou un impératif de mouvement (« viens »), tandis que ἔξω signifie « dehors, à l’extérieur ». « Viens dehors » conserve les deux éléments et convient à l’ordre adressé à Lazare de sortir du tombeau.
theological_decisions:
- issue: Rendre l’ordre du miracle sans archaïsme traditionnel
  choice: viens dehors
  alternative: sors ! / viens au-dehors !
  rationale: « Viens dehors » suit de près les deux adverbes grecs et reste intelligible en français moderne. « Sors ! » serait plus idiomatique mais condenserait l’appel orienté vers Jésus ; « viens au-dehors » aurait une tonalité plus littéraire.
translation_notes:
  register: Français moderne, digne et direct. La phrase conserve la solennité du récit sans recourir à une formulation archaïque. Aucun appel de note n’est nécessaire.
