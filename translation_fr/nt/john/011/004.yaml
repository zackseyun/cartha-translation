revisions:
- from: 'Mais quand Jésus l’apprit, il dit : « Cette maladie n’aboutira pas à la mort[a] ; elle servira plutôt à la gloire de Dieu, afin que, par elle, le Fils de Dieu soit glorifié. »'
  to: 'Mais, quand Jésus eut entendu cela, il dit : « Cette maladie ne mène pas à la mort[a], mais elle est pour la gloire de Dieu, afin que, par elle, le Fils de Dieu soit glorifié. »'
  rationale: 'La révision rétablit les présents de la déclaration grecque, traduit plus directement le participe ἀκούσας, et simplifie l’opposition introduite par ἀλλά. Elle préserve l’ambiguïté voulue : le verset ne nie pas nécessairement la mort immédiate de Lazare, mais indique que la maladie n’a pas la mort pour aboutissement ou finalité ultime.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:06:51Z'
review_pass:
  verdict: revise
  source_fidelity: Révision sûre recommandée. Le présent grec ἐστιν est mieux rendu par un présent français (« ne mène pas », « est pour ») que par les futurs « n’aboutira pas » et « servira ». Le rendu proposé conserve la finalité de πρὸς θάνατον sans prédire explicitement que Lazare ne mourra pas.
  naturalness: Le texte révisé est naturel en français international moderne tout en conservant le registre narratif et solennel approprié. « Quand Jésus eut entendu cela » rend explicitement l’objet sous-entendu par le contexte et évite de transformer ἀκούσας (« ayant entendu ») en « l’apprit » (« ayant appris »).
  terminology: « Maladie », « gloire de Dieu » et « Fils de Dieu » sont précis et cohérents. « Par elle » conserve le moyen exprimé par δι’ αὐτῆς et son antécédent féminin, « cette maladie ».
  issues:
  - severity: medium
    issue: Les verbes principaux sont rendus au futur (« n’aboutira pas », « servira »), alors que le grec emploie le présent ἐστιν dans les deux membres.
    rationale: Le futur français peut être compatible avec le contexte, mais il reformule la déclaration présente de Jésus en prédiction. Le présent « ne mène pas à la mort, mais est pour la gloire de Dieu » est plus proche de la syntaxe et de la nuance téléologique du grec.
  - severity: low
    issue: « Jésus l’apprit » rend davantage l’idée de recevoir une information que celle d’entendre le message.
    rationale: ἀκούσας signifie littéralement « ayant entendu ». « Quand Jésus eut entendu cela » est idiomatique et respecte mieux le verbe, tout en explicitant sobrement le référent contextuel.
  - severity: low
    issue: « plutôt » peut suggérer une alternative atténuée non explicitée par ἀλλά.
    rationale: « Mais » suffit à rendre l’opposition grecque et maintient plus directement les deux propositions.
