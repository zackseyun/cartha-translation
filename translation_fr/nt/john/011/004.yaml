source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: fr
  text: 'Mais, quand Jésus eut entendu cela, il dit : « Cette maladie ne mène pas à la mort[a], mais elle est pour la gloire de Dieu, afin que, par elle, le Fils de Dieu soit glorifié. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « n’est pas pour la mort ». L’expression grecque peut indiquer que la mort n’est pas l’issue ultime ou le but de cette maladie.
    reason: 'Alternative lexicale : elle rend plus littéralement πρὸς θάνατον et précise la portée possible de l’expression sans résoudre la tension narrative.'
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: Mais quand Jésus l’apprit
  rationale: Le participe aoriste situe la parole de Jésus après l’annonce de la maladie. « L’ » reprend naturellement cette annonce dans le contexte, tandis que « mais » marque la légère transition ou opposition introduite par δέ.
- source_word: ἀσθένεια
  choice: maladie
  rationale: Terme courant et suffisamment large pour désigner l’état de Lazare sans connotation clinique excessive.
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: n’aboutira pas à la mort
  rationale: 'Cette formulation rend la valeur de résultat ou d’issue de πρὸς avec l’accusatif et préserve la tension narrative : Lazare meurt effectivement, mais la mort n’est pas l’issue ultime de la maladie.'
- source_word: ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: elle servira plutôt à la gloire de Dieu
  rationale: « Servira à » exprime naturellement la visée ou le bénéfice porté par ὑπέρ, et « plutôt » fait entendre l’opposition de ἀλλά sans exiger de répéter le verbe grec sous-entendu.
- source_word: ἵνα δοξασθῇ
  choice: afin que ... soit glorifié
  rationale: « Afin que » conserve explicitement la relation de finalité et la voix passive du verbe grec.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Traduction française consacrée et précise de ce titre christologique.
- source_word: δι’ αὐτῆς
  choice: par elle
  rationale: διά avec le génitif indique ici le moyen ; le pronom féminin renvoie clairement à « cette maladie ».
theological_decisions:
- issue: Sens de « οὐκ ἔστιν πρὸς θάνατον » alors que Lazare meurt ensuite
  choice: « n’aboutira pas à la mort », avec une note indiquant que la mort n’est pas l’issue ultime
  alternative: « n’est pas mortelle » ou « ne conduit pas à la mort » compris comme l’affirmation que Lazare ne mourra pas
  rationale: Le récit affirme ensuite la mort de Lazare. La traduction garde donc la portée orientée vers l’issue de πρὸς et la tension du texte, sans nier la mort intermédiaire ni expliciter toute l’issue narrative dans le verset.
- issue: Rapport entre la gloire de Dieu et la glorification du Fils de Dieu
  choice: Maintenir les deux propositions distinctes et leur lien de finalité
  alternative: Les fondre en une affirmation générale sur la gloire divine
  rationale: Le grec mentionne expressément la gloire de Dieu puis la glorification du Fils de Dieu par cette maladie. Les conserver séparément respecte la structure et la portée christologique du texte sans ajout doctrinal.
translation_notes:
  register: Français international moderne, naturel et digne. « L’apprit » évite un complément lourd tout en reprenant l’annonce précédente. « N’aboutira pas à la mort » est plus idiomatique aujourd’hui que « n’est pas pour la mort » et moins archaïque que « ne mène point à la mort ». Le point-virgule clarifie l’opposition entre l’issue niée et la finalité affirmée.
