  text: ἐκείνη ⸀δὲ ὡς ἤκουσεν ⸀ἠγέρθη ταχὺ καὶ ⸀ἤρχετο πρὸς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: fr
  text: Lorsqu’elle entendit cela, elle se leva rapidement et alla vers lui.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: elle
  rationale: Le démonstratif renvoie à Marie dans le contexte immédiat. En français naturel, le pronom « elle » convient mieux que le littéral « celle-là ».
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, δέ est un connecteur narratif léger. La succession des propositions et « dès que » rendent naturellement la progression sans imposer un contraste absent du grec.
- source_word: ὡς
  choice: dès que
  rationale: Avec l’aoriste et l’action rapide qui suit, « dès que » exprime naturellement le rapport temporel. Cette formulation est un peu plus vive que « quand », mais elle convient au déroulement immédiat de la scène.
- source_word: ἤκουσεν
  choice: entendit cela
  rationale: Le verbe signifie « entendre »; « cela » reprend naturellement en français les paroles rapportées au verset précédent sans remplacer l’audition par une interprétation telle qu’« apprendre ».
- source_word: ἠγέρθη
  choice: se leva
  rationale: 'Bien que la forme grecque soit morphologiquement passive, le verbe a ici un sens intransitif : Marie se met debout. « Se leva » est naturel et n’introduit aucun agent extérieur.'
- source_word: ταχὺ
  choice: rapidement
  rationale: L’adverbe indique la promptitude de l’action. « Rapidement » est clair, courant et proche du grec.
- source_word: ἤρχετο
  choice: alla
  rationale: L’imparfait grec présente le déplacement en cours; dans une narration française, le passé simple « alla » enchaîne naturellement l’action. « Se dirigeait » préserverait davantage l’aspect progressif, mais serait plus lourd ici.
- source_word: πρὸς αὐτόν
  choice: vers lui
  rationale: πρός avec l’accusatif marque le mouvement en direction d’une personne. « Vers lui » conserve cette nuance sans présumer explicitement que la destination est déjà atteinte.
theological_decisions: []
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au registre narratif biblique sans être archaïque. Aucun marqueur de note n’est nécessaire, car les nuances du grec peuvent être rendues directement dans le texte.
