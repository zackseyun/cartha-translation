  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: fr
  text: 'Les disciples lui dirent donc : « Seigneur, s’il s’est endormi[a], il se rétablira[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « s’est couché pour dormir ». Jésus avait parlé de la mort de Lazare sous l’image du sommeil, mais les disciples pensent qu’il parle d’un sommeil ordinaire.
    reason: lexical_alternative
  - marker: b
    text: Le verbe grec peut aussi être traduit par « sera sauvé »; ici, dans le contexte de la maladie, il signifie qu’il retrouvera la santé.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la déduction que les disciples tirent des paroles précédentes de Jésus, tout en restant naturel dans le récit.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: Reproduit l’article grec et désigne naturellement le groupe déjà connu dans le contexte, sans ajouter « ses ».
- source_word: αὐτῷ
  choice: lui
  rationale: Conserve le pronom du texte grec; son référent, Jésus, est clair dans le contexte.
- source_word: Κύριε
  choice: Seigneur
  rationale: Rend l’adresse respectueuse à Jésus tout en préservant la portée christologique possible du titre dans l’Évangile selon Jean.
- source_word: εἰ
  choice: si
  rationale: Exprime directement la condition formulée par les disciples.
- source_word: κεκοίμηται
  choice: s’est endormi
  rationale: Le parfait de κοιμάομαι décrit l’état résultant de l’endormissement. Cette formulation évoque ici le sommeil ordinaire tel que le comprennent les disciples, tout en permettant au contexte de révéler l’emploi figuré pour la mort.
- source_word: σωθήσεται
  choice: se rétablira
  rationale: Dans un contexte de maladie, σῴζω peut signifier retrouver la santé. « Se rétablira » exprime idiomatiquement cette idée sans introduire dans le texte principal le sens sotériologique de « sera sauvé ».
theological_decisions:
- issue: Traduction de κύριος dans l’adresse directe à Jésus
  choice: Seigneur
  alternative: Maître; monsieur
  rationale: « Seigneur » conserve à la fois la valeur d’adresse respectueuse et la résonance christologique possible, sans imposer une interprétation plus précise que le grec.
- issue: Double sens possible de κεκοίμηται, sommeil ou mort
  choice: Employer le langage ordinaire du sommeil dans le texte principal
  alternative: Employer une formule plus ambiguë comme « s’est reposé »
  rationale: Les disciples comprennent littéralement l’image employée par Jésus. « S’est endormi » préserve leur méprise, tandis que la suite du récit en donnera l’explication.
- issue: Sens de σωθήσεται dans un contexte de maladie
  choice: il se rétablira
  alternative: il sera sauvé; il guérira
  rationale: Le contexte immédiat indique que les disciples parlent du retour à la santé. La note conserve néanmoins le sens plus général et théologiquement chargé que peut porter le verbe grec ailleurs.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe reste proche du grec sans être raide. « Se rétablira » est courant et précis dans un contexte médical; les notes signalent les deux ambiguïtés lexicales importantes.
