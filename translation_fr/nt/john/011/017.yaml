source:
  edition: SBLGNT
  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: fr
  text: Jésus arriva donc et constata que Lazare était déjà dans le tombeau depuis quatre jours.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν οὖν ὁ Ἰησοῦς
  choice: À son arrivée, Jésus
  rationale: Le participe aoriste Ἐλθών situe l’arrivée de Jésus avant le verbe principal. La tournure française « À son arrivée » restitue naturellement ce rapport temporel. Dans ce contexte, οὖν assure surtout la continuité narrative et n’exige pas un équivalent lexical distinct.
- source_word: εὗρεν
  choice: constata
  rationale: Ici, εὗρεν signifie que Jésus trouva la situation telle qu’elle était ou en fit le constat. « Constata » est idiomatique en français et introduit naturellement la proposition complétive.
- source_word: αὐτὸν
  choice: Lazare
  rationale: Le pronom renvoie clairement à Lazare dans le contexte immédiat. Nommer explicitement Lazare évite une formulation française ambiguë sans ajouter d’information nouvelle.
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα ἐν τῷ μνημείῳ
  choice: était déjà dans le tombeau depuis quatre jours
  rationale: La construction grecque exprime une durée déjà écoulée. « Depuis quatre jours » est la manière naturelle de rendre cette durée en français, tandis que « déjà » représente ἤδη.
- source_word: μνημείῳ
  choice: tombeau
  rationale: Dans ce récit, μνημεῖον désigne le lieu où le corps a été déposé. « Tombeau » est précis, courant et adapté au contexte johannique.
theological_decisions:
- issue: Explicitation du référent de αὐτόν
  choice: Nommer Lazare explicitement
  alternative: 'Conserver un pronom : « il constata qu’il était déjà dans le tombeau depuis quatre jours »'
  rationale: Le référent est explicite dans le contexte grec, mais la répétition de « il » serait ambiguë en français. L’explicitation améliore la clarté sans infléchir le sens théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La phrase reste proche de la structure et du sens grecs tout en évitant le calque peu naturel « l’ayant depuis quatre jours dans le tombeau ».
