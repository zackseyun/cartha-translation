    rationale: Le grec dit qu’après avoir appris la nouvelle, il demeura deux jours ; τότε μὲν marque « alors / à ce moment-là » et le μέν prépare la suite, sans lexicaliser à lui seul « encore ». Le contexte peut suggérer un délai, mais la traduction ne doit pas l’insérer.
  - severity: low
    issue: Le nom « Lazare » est explicitement ajouté dans la proposition complétive.
    rationale: Le référent est certain d’après le contexte, mais le texte grec de ce verset emploie seulement un sujet sous-entendu dans ἀσθενεῖ. Une formulation pronominale préserve plus exactement la forme du texte.
  - severity: low
    issue: « Quand donc » est peu naturel dans cette phrase déclarative moderne.
    rationale: Une construction telle que « Ainsi, lorsqu’il… » rend mieux en français actuel la combinaison narrative de ὡς οὖν.
