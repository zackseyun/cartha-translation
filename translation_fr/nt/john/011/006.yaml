  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: fr
  text: Ainsi, lorsqu’il apprit qu’il était malade[a], il resta alors deux jours à l’endroit où il se trouvait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « qu’il est malade ». Le grec emploie le présent après « apprit », mais le français rend naturellement ce présent par l’imparfait dans ce contexte.'
    reason: alternative_lexicale_et_temporelle
lexical_decisions:
- source_word: ὡς οὖν
  choice: Quand donc
  rationale: Cette formulation conserve à la fois la valeur temporelle de ὡς et la progression narrative marquée par οὖν, dans un français naturel et soutenu.
- source_word: ἤκουσεν
  choice: il apprit
  rationale: Dans ce contexte de nouvelle transmise, « apprit » exprime naturellement le sens de ἀκούω sans préciser indûment le moyen de l’information.
- source_word: ὅτι ἀσθενεῖ
  choice: que Lazare était malade
  rationale: ἀσθενέω désigne ici la maladie physique. Le nom « Lazare », fourni par le contexte immédiat, évite en français une ambiguïté pronominale gênante. L’imparfait suit naturellement le verbe introducteur au passé.
- source_word: τότε μὲν ἔμεινεν
  choice: il resta encore
  rationale: « Resta » rend le maintien sur place exprimé par μένω. « Encore » restitue naturellement la portée contextuelle de τότε μὲν et souligne le délai, sans employer une tournure française artificielle telle que « alors certes ».
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: à l’endroit où il se trouvait
  rationale: Cette formulation conserve l’insistance locative et la légère redondance du grec tout en restant idiomatique en français.
- source_word: δύο ἡμέρας
  choice: deux jours
  rationale: Accusatif de durée direct et sans ambiguïté.
theological_decisions:
- issue: Portée narrative du délai de Jésus après l’annonce de la maladie de Lazare
  choice: Énoncer sans atténuation qu’après avoir appris la maladie, il resta encore deux jours sur place.
  alternative: Ajouter une explication de son intention ou reformuler afin d’atténuer le contraste.
  rationale: Le texte maintient délibérément la tension entre l’annonce de la maladie et le délai de Jésus; la traduction ne doit ni l’expliquer ni la résoudre.
translation_notes:
  register: Français international moderne, naturel et digne. « Quand donc » garde le lien logique et temporel; « resta encore deux jours » met clairement en relief le délai sans surcharger la phrase.
