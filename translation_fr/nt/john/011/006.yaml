  verdict: revise
  source_fidelity: 'La traduction ajoute deux éléments qui ne sont pas explicitement dans le grec de ce verset : « Lazare » pour le pronom implicite et surtout « encore » pour τότε μὲν. Le référent de « il était malade » est fourni par le contexte immédiat, mais le grec ne le nomme pas ici. τότε μὲν situe l’action dans la suite narrative et introduit un contraste développé ensuite ; « alors » le rend sans ajouter l’idée de prolongation contenue dans « encore ».'
  naturalness: « Quand donc » est compréhensible, mais paraît peu idiomatique en français moderne affirmatif et peut prendre une coloration interrogative ou archaïsante. « Ainsi, lorsqu’il… » garde naturellement le lien inférentiel et temporel. « Il resta alors deux jours à l’endroit où il se trouvait » est clair et de registre international moderne.
  terminology: « malade », « resta », « endroit » et « deux jours » conviennent. Le présent grec ἀσθενεῖ peut être rendu par l’imparfait français après « apprit » sans perte de sens ; la note est donc utile comme variante temporelle.
