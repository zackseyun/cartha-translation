id: JHN.11.52
reference: John 11:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: fr
  text: et non pas seulement pour la nation[a], mais aussi afin de rassembler en un seul les enfants de Dieu dispersés.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « la nation » désigne la nation juive.
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: nation
  rationale: Dans le contexte immédiat, le singulier désigne la nation juive. « Nation » conserve le sens collectif sans explicitation excessive.
- source_word: ἵνα
  choice: afin de
  rationale: Cette expression naturelle en français conserve la valeur de but de la proposition grecque.
- source_word: τέκνα τοῦ θεοῦ
  choice: les enfants de Dieu
  rationale: τέκνα est inclusif et désigne des enfants, sans restriction au sexe masculin.
- source_word: διεσκορπισμένα
  choice: dispersés
  rationale: Le participe parfait passif décrit l’état durable de ceux qui se trouvent dispersés.
- source_word: συναγάγῃ
  choice: rassembler
  rationale: L’infinitif après « afin de » rend naturellement en français le subjonctif aoriste grec dans la proposition de but.
- source_word: εἰς ἕν
  choice: dans l’unité
  rationale: Cette formulation française exprime le mouvement vers l’unité sans ajouter « corps », absent du grec.
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: et non pas seulement pour la nation, mais aussi
  rationale: La structure contrastive est conservée et « pour » reprend naturellement l’idée de mourir en faveur de quelqu’un exprimée au verset précédent.
theological_decisions:
- issue: Identité des « enfants de Dieu »
  choice: Conserver cette désignation dans toute son étendue, au-delà de la nation juive, sans préciser davantage l’identité du groupe.
  alternative: Y voir exclusivement les Juifs de la diaspora, ou explicitement les élus issus des Juifs et des non-Juifs.
  rationale: Le texte oppose « la nation » à un ensemble plus large d’enfants de Dieu dispersés, mais n’en définit pas ici précisément les contours.
- issue: Sens de εἰς ἕν
  choice: dans l’unité
  alternative: en un seul corps ; pour ne faire qu’un
  rationale: Le grec ne nomme ni « corps » ni une structure institutionnelle précise ; la traduction préserve donc sa brièveté et son ouverture théologique.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase reste liée au verset précédent, comme l’indique son ouverture par « et ». Le contraste et la finalité sont clairement rendus sans développer les catégories théologiques laissées implicites dans le grec.
