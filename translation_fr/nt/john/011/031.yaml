id: JHN.11.31
reference: John 11:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: fr
  text: Alors, les Juifs[a] qui étaient avec Marie dans la maison et la consolaient la virent se lever rapidement et sortir. Ils la suivirent, pensant qu’elle allait au tombeau pour y pleurer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens ». Chez Jean, le terme grec peut parfois désigner plus précisément les habitants de la Judée ou les autorités judéennes; ici, il s’agit du groupe qui accompagne Marie dans son deuil.
    reason: Alternative lexicale et précision contextuelle concernant Ἰουδαῖοι.
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: Alors, les Juifs
  rationale: « Alors » marque naturellement la progression du récit. Dans ce contexte, Ἰουδαῖοι désigne les personnes qui entourent Marie dans le deuil; « les Juifs » reste la traduction directe, tandis que « les Judéens » est signalé en note comme possibilité contextuelle.
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν
  choice: qui étaient avec Marie dans la maison et la consolaient
  rationale: La reprise du nom « Marie » évite en français une succession ambiguë de pronoms. « Consolaient » exprime naturellement l’action continue de παραμυθέομαι dans un contexte de deuil.
- source_word: ἰδόντες τὴν Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: la virent se lever rapidement et sortir
  rationale: La construction française avec « voir » suivi de l’infinitif rend clairement la perception et la succession des deux actions, sans donner à ἀνέστη un sens de résurrection.
- source_word: ἠκολούθησαν αὐτῇ
  choice: Ils la suivirent
  rationale: Il s’agit ici du déplacement physique derrière Marie, sans nuance nécessaire de relation disciple-maître.
- source_word: δόξαντες ὅτι ὑπάγει
  choice: pensant qu’elle allait
  rationale: Le participe δόξαντες exprime leur supposition; l’imparfait français convient au discours indirect dépendant d’un verbe narratif au passé.
- source_word: εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ
  choice: au tombeau pour y pleurer
  rationale: « Tombeau » correspond au lieu d’ensevelissement dans ce récit. « Pour y pleurer » rend avec naturel le but exprimé par ἵνα et la valeur locative de ἐκεῖ.
theological_decisions:
- issue: Portée de Ἰουδαῖοι dans le récit johannique
  choice: les Juifs
  alternative: les Judéens
  rationale: Le terme a une portée variable chez Jean. Ici, il désigne concrètement le groupe présent auprès de Marie pour la consoler, sans généralisation à l’ensemble du peuple juif ni identification nécessaire aux autorités. La variante géographique demeure possible et est conservée en note.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase grecque longue est répartie en deux phrases pour améliorer la lisibilité sans modifier la progression narrative. Le marqueur de note est placé immédiatement après le terme qu’il explique.
