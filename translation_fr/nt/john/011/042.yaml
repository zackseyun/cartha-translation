source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: fr
  text: Mais moi, je savais que tu m’écoutes toujours. Cependant, j’ai dit cela à cause de la foule qui se tient autour[a], afin qu’ils croient que c’est toi qui m’as envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « pour la foule qui se tient autour » ou « en raison de la foule qui se tient autour ».
    reason: διά avec l’accusatif peut mettre l’accent sur le motif, la raison ou, selon le contexte, l’intérêt des personnes concernées.
lexical_decisions:
- source_word: ἐγὼ δὲ ᾔδειν
  choice: Mais moi, je savais
  rationale: Le pronom explicite ἐγώ est conservé par « moi », tandis que ᾔδειν, forme passée de οἶδα, se rend naturellement par l’imparfait français « je savais ». « Mais » maintient le contraste avec ce qui précède.
- source_word: πάντοτέ μου ἀκούεις
  choice: tu m’écoutes toujours
  rationale: ἀκούω avec le génitif peut exprimer une écoute réceptive. En français, « écouter » convient à la prière et évite que « entendre » soit compris comme une simple perception sonore.
- source_word: ἀλλὰ διὰ τὸν ὄχλον
  choice: Cependant, … à cause de la foule
  rationale: ἀλλά marque un contraste, rendu par « cependant ». διά avec l’accusatif indique ici le motif de la parole publique; « à cause de » en conserve la formulation directe sans exclure la nuance d’intérêt ou de bénéfice.
- source_word: τὸν περιεστῶτα
  choice: qui se tient autour de moi
  rationale: Le participe parfait décrit la foule présente autour de Jésus. « De moi » explicite seulement le centre spatial implicite nécessaire à une formulation française naturelle.
- source_word: εἶπον
  choice: j’ai dit cela
  rationale: L’aoriste de λέγω est rendu par le passé composé. « Cela » renvoie naturellement aux paroles que Jésus vient de prononcer sans développer davantage le texte.
- source_word: ἵνα πιστεύσωσιν
  choice: afin qu’ils croient
  rationale: « Afin que » conserve clairement la valeur de but de ἵνα avec le subjonctif. Le pluriel « ils » respecte le verbe grec au pluriel, qui vise les personnes composant la foule.
- source_word: ὅτι σύ με ἀπέστειλας
  choice: que c’est toi qui m’as envoyé
  rationale: La tournure clivée « c’est toi qui » restitue l’accent porté par le pronom explicite σύ. Le passé composé est naturel en français pour l’envoi antérieur dont les effets demeurent présents.
theological_decisions:
- issue: Portée de l’écoute du Père
  choice: Le Père écoute toujours Jésus, qui prononce publiquement ces paroles pour la foule.
  alternative: Comprendre l’énoncé surtout comme une affirmation générale sur l’exaucement de la prière.
  rationale: La traduction conserve l’affirmation directe et son contexte immédiat sans ajouter de formulation doctrinale sur la relation entre le Père et le Fils.
- issue: But de la parole publique de Jésus
  choice: La parole vise à amener les personnes présentes à croire que le Père a envoyé Jésus.
  alternative: Limiter ce but à l’authentification du seul miracle de Lazare.
  rationale: La proposition finale porte explicitement sur la mission de Jésus — « c’est toi qui m’as envoyé » — sans en préciser davantage la portée.
translation_notes:
  register: Français international moderne, digne et oralement fluide. La structure contrastive du grec est maintenue, l’emphase de σύ est rendue directement, et le pluriel grec visant les membres de la foule est conservé.
