id: JHN.11.15
reference: John 11:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: fr
  text: Et je me réjouis pour vous de ne pas avoir été là, afin que vous croyiez.[a] Mais allons vers lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « afin que vous en veniez à croire ». L’aoriste subjonctif grec peut mettre l’accent sur le fait de commencer à croire, mais « que vous croyiez » conserve ici une portée plus large.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: je me réjouis
  rationale: Le présent exprime la joie de Jésus. « Je me réjouis » est naturel et digne en français, sans atténuer l’affect positif du grec.
- source_word: δι’ ὑμᾶς
  choice: à cause de vous
  rationale: διά avec l’accusatif exprime ici que la joie de Jésus se rapporte aux disciples et au bénéfice qu’ils retireront de son absence. Cette tournure évite l’ambiguïté moderne de « pour vous », qui pourrait signifier « à votre place ».
- source_word: ἵνα πιστεύσητε
  choice: afin que vous croyiez
  rationale: ἵνα suivi de l’aoriste subjonctif exprime le but. Le simple verbe « croire » conserve la portée large de πιστεύω et n’impose pas l’idée que les disciples n’avaient encore aucune foi.
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: de ne pas avoir été là
  rationale: 'Après un verbe exprimant un sentiment, le français idiomatique emploie naturellement l’infinitif passé pour rendre le contenu introduit par ὅτι : Jésus se réjouit du fait qu’il n’était pas là.'
- source_word: ἀλλὰ
  choice: Mais
  rationale: La conjonction marque le contraste et le passage de l’explication à l’action.
- source_word: ἄγωμεν
  choice: allons
  rationale: Le subjonctif présent à la première personne du pluriel a une valeur exhortative, rendue naturellement par « allons ».
- source_word: πρὸς αὐτόν
  choice: vers lui
  rationale: πρός avec l’accusatif indique le mouvement en direction d’une personne. « Vers lui » préserve explicitement cette orientation.
theological_decisions:
- issue: Valeur de πιστεύσητε dans le contexte johannique
  choice: que vous croyiez
  alternative: que vous en veniez à croire
  rationale: L’aoriste subjonctif peut recevoir une nuance ingressive, mais celle-ci n’est pas certaine. La formulation retenue préserve le but déclaré par Jésus sans conclure que les disciples étaient jusque-là entièrement dépourvus de foi.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve le contraste entre la joie de Jésus liée à son absence et son invitation à rejoindre Lazare. Le marqueur [a] est placé immédiatement après la proposition concernée.
