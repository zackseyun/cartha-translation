revisions:
- from: Et, à cause de vous, je me réjouis de ne pas avoir été là, afin que vous croyiez.[a] Mais allons vers lui.
  to: Et je me réjouis pour vous de ne pas avoir été là, afin que vous croyiez.[a] Mais allons vers lui.
  rationale: La révision remplace « à cause de vous » par « pour vous » afin de rendre la portée favorable de δι’ ὑμᾶς dans son contexte, tout en conservant l’ambiguïté sémantique que le grec peut avoir isolément. La note est resserrée pour signaler prudemment la nuance ingressive possible de l’aoriste sans en tirer de conclusion doctrinale.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T11:06:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'La structure et les temps sont bien rendus : Jésus exprime sa joie, son absence passée, le but « afin que vous croyiez », puis l’exhortation à aller vers lui. Toutefois, « à cause de vous » présente les disciples comme la cause de sa joie et ne rend pas suffisamment la nuance de bénéfice/concerne les disciples que porte δι’ ὑμᾶς dans ce contexte.'
  naturalness: Le français est globalement naturel et le registre convient. « Je me réjouis pour vous de ne pas avoir été là » est à la fois idiomatique et plus précis dans le contexte. « Allons vers lui » conserve correctement le mouvement exprimé par πρός.
  terminology: « Croire » rend justement πιστεύσητε sans imposer une lecture doctrinale sur l’état antérieur des disciples. La note doit présenter « en venir à croire » comme une possibilité aspectuelle, sans transformer cette possibilité en affirmation d’une « entrée dans la foi ».
  issues:
  - severity: medium
    issue: « à cause de vous » pour δι’ ὑμᾶς
    rationale: En français moderne, cette expression signifie normalement « parce que vous en êtes la cause ». Ici, le contexte et la proposition finale indiquent plutôt la joie de Jésus en considération du bien des disciples. « Pour vous » préserve cette orientation sans surinterpréter.
  - severity: low
    issue: 'Formulation de la note : « l’entrée dans la foi »'
    rationale: Cette formulation explicite davantage que le grec ne le fait. L’aoriste peut suggérer le commencement de l’acte de croire, mais ne requiert pas une caractérisation théologique de leur état antérieur.
  revised_text: Et je me réjouis pour vous de ne pas avoir été là, afin que vous croyiez.[a] Mais allons vers lui.
  revised_footnotes:
  - marker: a
    text: 'Ou : « afin que vous en veniez à croire ». L’aoriste subjonctif grec peut mettre l’accent sur le fait de commencer à croire, mais « que vous croyiez » conserve ici une portée plus large.'
    reason: lexical_alternative
  revision_rationale: La révision remplace « à cause de vous » par « pour vous » afin de rendre la portée favorable de δι’ ὑμᾶς dans son contexte, tout en conservant l’ambiguïté sémantique que le grec peut avoir isolément. La note est resserrée pour signaler prudemment la nuance ingressive possible de l’aoriste sans en tirer de conclusion doctrinale.
