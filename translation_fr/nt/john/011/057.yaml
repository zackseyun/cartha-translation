id: JHN.11.57
reference: John 11:57
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: fr
  text: 'Or, les chefs des prêtres et les pharisiens avaient donné des ordres : si quelqu’un savait où il était[a], il devait le faire savoir, afin qu’ils le saisissent[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou, plus littéralement, « où il est ». Le grec emploie le présent, tandis que le français transpose souvent le temps dans le discours indirect après un verbe au passé.
    reason: lexical_alternative
  - marker: b
    text: On pourrait aussi traduire « afin qu’ils l’arrêtent » dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδώκεισαν
  choice: avaient donné
  rationale: Le plus-que-parfait grec situe ces ordres comme déjà donnés au moment du récit ; le plus-que-parfait français conserve naturellement ce rapport temporel.
- source_word: δὲ
  choice: Or
  rationale: La particule marque ici une progression narrative plutôt qu’une forte opposition. « Or » rend cette transition sans lui donner une valeur temporelle absente du grec.
- source_word: οἱ ἀρχιερεῖς
  choice: les chefs des prêtres
  rationale: Dans ce contexte johannique, le pluriel désigne les principales autorités sacerdotales, non plusieurs grands prêtres en fonction.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française courante de ce groupe juif.
- source_word: ἐντολὰς
  choice: des ordres
  rationale: Le pluriel et le caractère officiel et contraignant des directives sont ainsi conservés.
- source_word: ἵνα ἐάν τις γνῷ
  choice: si quelqu’un savait
  rationale: Cette formulation française naturelle préserve la condition générale intégrée au contenu des ordres.
- source_word: ποῦ ἐστιν
  choice: où il était
  rationale: Le présent grec est naturellement transposé à l’imparfait en français dans ce discours indirect dépendant d’un verbe au passé ; la forme plus littérale est signalée en note.
- source_word: μηνύσῃ
  choice: il devait le faire savoir
  rationale: Le verbe signifie faire connaître ou signaler une information, notamment aux autorités. La tournure exprime clairement l’obligation contenue dans les ordres sans ajouter un destinataire explicite.
- source_word: ὅπως
  choice: afin que
  rationale: La locution conserve nettement la valeur de but.
- source_word: πιάσωσιν αὐτόν
  choice: qu’ils puissent se saisir de lui
  rationale: « Se saisir de lui » rend l’idée de capture sans imposer la nuance juridique plus précise d’une arrestation formelle.
theological_decisions: []
translation_notes:
  register: Français international actuel, clair et digne. La structure avec deux-points rend lisible le contenu des ordres, tandis que « Or » conserve la légère articulation narrative de δέ.
