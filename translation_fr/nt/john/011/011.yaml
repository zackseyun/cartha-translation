id: JHN.11.11
reference: John 11:11
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: fr
  text: 'Après avoir dit cela, il leur dit : « Lazare, notre ami, s’est endormi[a], mais je vais aller le réveiller. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, Jésus parle de la mort comme d’un sommeil ; dans les versets suivants, les disciples comprennent d’abord ses paroles au sens propre.
    reason: Clarification de la métaphore sans la remplacer dans le texte principal.
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: Après avoir dit cela
  rationale: Cette formulation française naturelle exprime l’antériorité de la parole achevée et la transition temporelle. Le singulier collectif « cela » reprend idiomatiquement en français l’ensemble des propos précédents, malgré le pluriel grec ταῦτα.
- source_word: λέγει αὐτοῖς
  choice: il leur dit
  rationale: Le présent historique grec est conservé par le présent narratif français, naturel dans ce contexte et fidèle à l’effet vivant du récit.
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: Lazare, notre ami
  rationale: « Lazare » est la forme française traditionnelle du nom, et « notre ami » restitue simplement et naturellement la relation exprimée par ὁ φίλος ἡμῶν.
- source_word: κεκοίμηται
  choice: s’est endormi
  rationale: Le passé composé rend l’état résultant du parfait grec tout en préservant la métaphore du sommeil, que les disciples comprendront d’abord au sens propre.
- source_word: ἀλλὰ πορεύομαι
  choice: mais je vais
  rationale: « Mais » marque le contraste, tandis que « je vais » exprime naturellement le déplacement intentionnel et imminent.
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: le réveiller
  rationale: L’infinitif après « aller » exprime clairement le but en français moderne. « Réveiller » maintient le même champ métaphorique que « s’est endormi ».
theological_decisions:
- issue: Faut-il expliciter κεκοίμηται par « est mort » ou conserver l’image du sommeil ?
  choice: Conserver dans le texte « s’est endormi »
  alternative: « est mort »
  rationale: Jésus emploie délibérément l’image du sommeil, et les disciples la comprennent d’abord au sens littéral dans les versets suivants. L’expliciter immédiatement comme la mort supprimerait cette tension narrative et théologique.
translation_notes:
  register: Français international moderne, naturel et digne. Le présent narratif « il leur dit » reflète le présent historique grec. La tournure concise « je vais le réveiller » évite une formulation lourde tout en conservant le rapport de but.
