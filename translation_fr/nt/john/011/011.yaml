review_pass:
  verdict: revise
  source_fidelity: La métaphore de κεκοίμηται est bien conservée par « s’est endormi », et le présent historique λέγει est adéquatement rendu par « il leur dit ». Toutefois, « je vais le réveiller » emploie naturellement « vais » comme auxiliaire de futur et n’exprime plus clairement le déplacement de πορεύομαι ni le but introduit par ἵνα.
  naturalness: Le français est fluide, moderne et d’un registre approprié. « Je vais aller le réveiller » est également naturel dans ce contexte et restitue plus complètement le mouvement intentionnel de Jésus.
  terminology: « Lazare », « notre ami », « s’est endormi » et « réveiller » sont justes et cohérents. La note conserve à bon droit l’image du sommeil sans l’imposer comme lecture littérale dans le texte principal.
  issues:
  - severity: medium
    issue: « mais je vais le réveiller » ne rend pas explicitement πορεύομαι (« je vais / je me rends ») ni la proposition finale ἵνα ἐξυπνίσω.
    rationale: En français, « je vais le réveiller » se comprend normalement comme un futur proche (« je le réveillerai »), non comme « je vais [là-bas] afin de le réveiller ». Ajouter « aller » préserve le déplacement et le but sans alourdir indûment la phrase.
