  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: fr
  text: 'Marthe lui dit[a] : « Je sais qu’il ressuscitera lors de la résurrection, au dernier jour. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « à la résurrection, au dernier jour ».'
    reason: alternative_lexical
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, naturel dans la narration française écrite et approprié pour introduire une réplique.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif marque le destinataire de la parole ; « lui dit » est la tournure française naturelle.
- source_word: ἡ Μάρθα
  choice: Marthe
  rationale: Forme française traditionnelle et courante du nom propre Μάρθα.
- source_word: Οἶδα
  choice: Je sais
  rationale: Rend directement l’affirmation assurée de connaissance, sans renforcer celle-ci en certitude absolue ni l’affaiblir en simple compréhension.
- source_word: ἀναστήσεται
  choice: il ressuscitera
  rationale: Dans ce contexte de retour à la vie, le futur de ἀνίστημι est rendu naturellement par le verbe français « ressusciter » employé intransitivement ; la forme grecque ne requiert pas le passif « il sera ressuscité ».
- source_word: ἐν τῇ ἀναστάσει
  choice: lors de la résurrection
  rationale: La préposition ἐν a ici une valeur temporelle ou circonstancielle. « Lors de » exprime clairement et naturellement que sa résurrection aura lieu dans le cadre de la résurrection eschatologique.
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: au dernier jour
  rationale: Tournure française idiomatique qui conserve la référence temporelle précise de l’expression johannique.
- source_word: ἐσχάτῃ
  choice: dernier
  rationale: « Dernier » est l’équivalent direct et consacré dans l’expression eschatologique « le dernier jour ».
theological_decisions:
- issue: Référence à la résurrection eschatologique
  choice: La formulation désigne la résurrection future au dernier jour.
  alternative: Une espérance générale de vie après la mort.
  rationale: La répétition de ἀναστήσεται et ἀναστάσει, précisée par « au dernier jour », renvoie à une résurrection eschatologique déterminée plutôt qu’à une vague survie après la mort. La traduction n’ajoute toutefois aucun détail doctrinal absent du verset.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct et sobre. « Lors de la résurrection, au dernier jour » conserve les deux compléments grecs et leur relation sans alourdir la phrase.
