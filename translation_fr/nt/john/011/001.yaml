source:
  edition: SBLGNT
  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: fr
  text: 'Or, un homme était malade[a] : Lazare, de Béthanie, le village de Marie et de sa sœur Marthe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Autre traduction : « Il y avait un malade, Lazare, de Béthanie, du village de Marie et de sa sœur Marthe. »'
    reason: La construction grecque associe un verbe à l’imparfait et un participe présent; elle peut se rendre soit par « un homme était malade », soit par « il y avait un malade ».
lexical_decisions:
- source_word: Ἦν δέ
  choice: Or, … était
  rationale: δέ marque ici une transition narrative légère, rendue naturellement par « Or » sans lui donner une valeur temporelle; ἦν fournit le verbe « était ».
- source_word: τις
  choice: un homme
  rationale: Le pronom indéfini désigne une personne précise encore introduite dans le récit; comme il s’agit de Lazare, « un homme » est naturel et exact.
- source_word: ἀσθενῶν
  choice: malade
  rationale: Dans ce contexte, le participe exprime la maladie plutôt qu’une faiblesse générale.
- source_word: Λάζαρος
  choice: Lazare
  rationale: Forme française traditionnelle et courante de ce nom propre.
- source_word: ἀπὸ Βηθανίας
  choice: de Béthanie
  rationale: ἀπό indique ici l’origine ou la provenance.
- source_word: ἐκ τῆς κώμης
  choice: le village
  rationale: κώμη désigne une petite localité; en français, l’apposition « Béthanie, le village… » évite la répétition lourde de « de » tout en conservant le rapport géographique.
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: de Marie et de sa sœur Marthe
  rationale: La construction identifie Marthe comme la sœur de Marie. Cet ordre est idiomatique en français et rend explicite le référent féminin de αὐτῆς.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Or » rend la légère progression signalée par δέ sans introduire un “maintenant” temporel. Les deux mentions de provenance ont été allégées par une apposition naturelle en français.
