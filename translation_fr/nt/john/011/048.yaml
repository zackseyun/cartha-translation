id: JHN.11.48
reference: John 11:48
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: fr
  text: Si nous le laissons continuer ainsi, tous croiront en lui, et les Romains viendront nous enlever aussi bien notre lieu[a] que notre nation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « notre Temple »; le grec dit « notre lieu », expression qui peut désigner spécialement le Temple ou, plus largement, leur place ou leur position.
    reason: alternative_reading
  - marker: b
    text: Ou « notre peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: nous le laissons continuer ainsi
  rationale: ἀφίημι a ici un sens permissif (« laisser, permettre »), tandis que οὕτως renvoie à la manière dont Jésus agit. « Continuer ainsi » exprime naturellement en français la poursuite de cette situation sans préciser davantage son activité.
- source_word: πάντες
  choice: tous
  rationale: Le masculin pluriel a ici une portée générale. « Tous » conserve la brièveté et l'ampleur de l'affirmation grecque.
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: croiront en lui
  rationale: La construction johannique πιστεύω εἰς avec l'accusatif est rendue directement par l'expression française habituelle « croire en ».
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: les Romains viendront
  rationale: Rendu direct du futur de ἔρχομαι avec son sujet explicite.
- source_word: ἀροῦσιν
  choice: nous enlever
  rationale: αἴρω signifie ici « enlever, emporter ». Cette formulation conserve le noyau lexical sans imposer l'idée plus forte de destruction, même si celle-ci peut être impliquée par le contexte.
- source_word: τόπον
  choice: lieu
  rationale: τόπος signifie littéralement « lieu ». Le terme peut désigner le Temple, leur position ou leur espace collectif; « lieu » préserve cette ouverture.
- source_word: ἔθνος
  choice: nation
  rationale: ἔθνος peut désigner une nation ou un peuple. « Nation » convient à la crainte d'une intervention romaine et maintient la dimension politique du propos.
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: nous enlever aussi bien notre lieu que notre nation
  rationale: Le génitif ἡμῶν se rapporte aux deux compléments. La tournure corrélative « aussi bien… que… » restitue les deux καί tout en produisant une phrase française claire.
theological_decisions:
- issue: Référent de « notre lieu » (τόπον)
  choice: Maintien de « lieu » dans le texte principal
  alternative: « Temple » ou « position »
  rationale: Le contexte peut viser le Temple, le territoire ou la position institutionnelle des dirigeants. Puisque le grec ne tranche pas explicitement, la traduction conserve cette ambiguïté et signale les principales possibilités en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure accessible tout en conservant le parallélisme des deux objets redoutés par les dirigeants.
