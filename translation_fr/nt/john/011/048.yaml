  terminology: « Croiront en lui » est la formulation française établie et fidèle à πιστεύσουσιν εἰς αὐτόν. « Les Romains », « lieu » et « nation » sont exacts. La note sur « Temple » signale une possibilité contextuelle sans imposer une interprétation; la note sur « peuple » préserve l’alternative lexicale de ἔθνος.
