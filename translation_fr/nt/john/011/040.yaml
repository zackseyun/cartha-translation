  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: fr
  text: 'Jésus lui dit : « Ne t’ai-je pas dit que, si tu crois, tu verras la gloire de Dieu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: Jésus lui dit
  rationale: Le présent historique grec λέγει est rendu par le présent narratif français « dit », naturel et sobre dans ce contexte; αὐτῇ est repris par « lui ».
- source_word: Οὐκ εἶπόν σοι
  choice: Ne t’ai-je pas dit
  rationale: La question rhétorique attend une réponse affirmative. Le passé composé est idiomatique en français actuel et renvoie naturellement à une parole antérieure de Jésus.
- source_word: ἐὰν πιστεύσῃς
  choice: si tu crois
  rationale: « Croire » conserve le vocabulaire johannique et la forme verbale sans préciser davantage l’objet ou la nature de la foi.
- source_word: ὄψῃ
  choice: tu verras
  rationale: Le futur « tu verras » correspond directement au futur grec et demeure naturel en français contemporain.
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: la gloire de Dieu
  rationale: « Gloire » est le terme biblique français consacré pour δόξα et préserve ici l’idée de manifestation divine sans la réduire à la splendeur ou à la majesté.
theological_decisions:
- issue: Rapport entre la foi et la vision de la gloire de Dieu
  choice: Conserver la promesse conditionnelle adressée directement à Marthe
  alternative: En faire soit un principe général sur la foi et les miracles, soit une promesse explicitement limitée à la résurrection de Lazare
  rationale: Le grec formule simplement une condition et sa conséquence. La traduction n’explicite ni la portée générale ni la portée strictement circonstancielle de cette déclaration.
translation_notes:
  register: Français moderne, courant et digne. Le tutoiement reflète l’adresse personnelle au singulier. La formulation reste proche de la syntaxe grecque tout en étant idiomatique.
