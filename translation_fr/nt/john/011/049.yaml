  text: εἷς δέ τις ἐξ αὐτῶν Καϊάφας, ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου, εἶπεν αὐτοῖς· Ὑμεῖς οὐκ οἴδατε οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: fr
  text: 'Mais l’un d’eux, Caïphe, qui était grand-prêtre cette année-là, leur dit : « Vous ne savez absolument rien. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: Mais l’un d’eux
  rationale: εἷς…τις désigne idiomatiquement un membre du groupe sans qu’il soit nécessaire de rendre séparément les deux éléments en français. δέ marque ici une légère transition contrastive, rendue par « Mais ».
- source_word: Καϊάφας
  choice: Caïphe
  rationale: Forme française traditionnelle et courante du nom propre grec Καϊάφας.
- source_word: ἀρχιερεὺς
  choice: grand-prêtre
  rationale: Désigne précisément le titulaire de la fonction suprême, et non plus largement les chefs des prêtres.
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: qui était grand-prêtre cette année-là
  rationale: La proposition relative rend naturellement le participe ὢν, tandis que « cette année-là » traduit idiomatiquement τοῦ ἐνιαυτοῦ ἐκείνου.
- source_word: εἶπεν αὐτοῖς
  choice: leur dit
  rationale: Rend directement le verbe λέγω avec son complément au datif dans un français naturel.
- source_word: Ὑμεῖς οὐκ οἴδατε οὐδέν
  choice: Vous ne savez absolument rien
  rationale: Le pronom explicite et la construction négative grecque produisent une réprimande appuyée. « absolument rien » en conserve l’intensité en français naturel.
theological_decisions:
- issue: La précision temporelle concernant la fonction de Caïphe
  choice: qui était grand-prêtre cette année-là
  alternative: étant grand-prêtre cette année-là
  rationale: La formulation traduit la remarque historique sans expliquer le fonctionnement de la charge ni anticiper l’ironie narrative et la portée théologique du contexte.
translation_notes:
  register: Français international moderne, naturel et digne. La parole de Caïphe garde son ton de réprimande catégorique sans devenir familière ni inutilement littérale.
