id: JHN.11.30
reference: John 11:30
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: fr
  text: Jésus n’était pas encore entré dans le village, mais il se trouvait toujours à l’endroit où Marthe l’avait rencontré.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: n’était pas encore
  rationale: Cette tournure exprime naturellement en français qu’à ce moment du récit, l’entrée de Jésus dans le village n’avait pas encore eu lieu.
- source_word: δὲ
  choice: non rendu séparément
  rationale: La particule marque ici une légère transition narrative. En français, l’enchaînement se fait naturellement sans ajouter « or » ou « alors », qui alourdiraient ou accentueraient indûment la transition.
- source_word: ἐληλύθει
  choice: était entré
  rationale: Le plus-que-parfait grec situe l’action antérieurement au moment raconté. Avec « dans le village », « entrer » rend clairement le mouvement vers l’intérieur de la localité sans suggérer que Jésus venait seulement d’arriver à proximité.
- source_word: κώμην
  choice: village
  rationale: κώμη désigne couramment une petite localité ; « village » est le terme français direct et usuel.
- source_word: ἀλλ’
  choice: mais
  rationale: La conjonction oppose clairement l’absence d’entrée dans le village au maintien de Jésus au même endroit.
- source_word: ἔτι
  choice: toujours
  rationale: Le mot souligne que Jésus continuait à se trouver à cet endroit.
- source_word: τόπῳ
  choice: endroit
  rationale: « Endroit » est naturel dans ce contexte narratif et désigne simplement le lieu concerné.
- source_word: ὅπου
  choice: où
  rationale: Le relatif locatif grec se rend directement par « où ».
- source_word: ὑπήντησεν
  choice: avait rencontré
  rationale: Le verbe peut signifier « rencontrer » ou « aller à la rencontre de ». Ici, le verset identifie surtout le lieu de la rencontre ; « avait rencontré » reste concis, naturel et suffisamment ouvert.
- source_word: αὐτῷ
  choice: l’
  rationale: Le datif régi par le verbe grec devient naturellement en français le complément d’objet direct de « rencontrer ».
- source_word: Μάρθα
  choice: Marthe
  rationale: « Marthe » est la forme française traditionnelle et courante du nom Μάρθα.
