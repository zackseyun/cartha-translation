  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: fr
  text: Quand Marthe apprit que Jésus arrivait[a], elle alla donc à sa rencontre ; mais Marie était assise dans la maison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Jésus arrive ». Le grec emploie un présent dans la proposition rapportée, qui peut aussi être rendu par un présent en français.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la continuité narrative et le lien avec le contexte précédent, sans imposer une conclusion logique trop forte.
- source_word: ὡς
  choice: quand
  rationale: Introduit ici une proposition temporelle ; « quand » est naturel et n'ajoute pas l'idée plus forte d'immédiateté qu'exprimerait « dès que ».
- source_word: ἤκουσεν
  choice: apprit
  rationale: Dans ce contexte, ἀκούω désigne le fait de recevoir une information. « Apprit » est idiomatique en français tout en restant proche du sens de « entendre dire ».
- source_word: ἔρχεται
  choice: arrivait
  rationale: Le présent grec décrit Jésus en train d'approcher dans une proposition rapportée. L'imparfait convient au récit français et conserve cette progression.
- source_word: ὑπήντησεν αὐτῷ
  choice: elle alla à sa rencontre
  rationale: 'Rend la nuance directionnelle du verbe : Marthe se déplace pour rencontrer Jésus, plutôt que de simplement le rencontrer.'
- source_word: δὲ
  choice: mais
  rationale: Fait ressortir le contraste modéré entre le déplacement de Marthe et la position de Marie.
- source_word: ἐν τῷ οἴκῳ
  choice: dans la maison
  rationale: Traduction directe et naturelle qui conserve la référence concrète à la maison.
- source_word: ἐκαθέζετο
  choice: restait assise
  rationale: L'imparfait présente une situation continue et, dans le contraste narratif, indique que Marie demeure assise. La formulation reste naturelle en français.
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: Marthe / Marie / Jésus
  rationale: Formes françaises traditionnelles et couramment reconnues de ces noms.
