  text: ἀπ’ ἐκείνης οὖν τῆς ἡμέρας ⸀ἐβουλεύσαντο ἵνα ἀποκτείνωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: fr
  text: À partir de ce jour-là, ils décidèrent donc de le tuer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: À partir de ce jour-là
  rationale: La préposition ἀπό avec le groupe au génitif indique le point de départ temporel d’une ligne de conduite qui se poursuit. « À partir de ce jour-là » est idiomatique en français moderne et conserve cette valeur.
- source_word: οὖν
  choice: donc
  rationale: οὖν marque ici la conséquence du conseil rapporté dans le contexte précédent. « Donc » maintient clairement ce lien logique et narratif.
- source_word: ἐβουλεύσαντο
  choice: ils décidèrent
  rationale: Le verbe désigne ici une délibération qui aboutit à une résolution. « Ils décidèrent » exprime naturellement le caractère arrêté de leur intention; « ils tinrent conseil » insisterait davantage sur le processus déjà décrit au verset précédent.
- source_word: ἵνα ἀποκτείνωσιν
  choice: de le tuer
  rationale: Après « décidèrent », l’infinitif rend naturellement en français le contenu ou le but introduit par ἵνα. « Tuer » transmet le sens direct de ἀποκτείνω sans suggérer un cadre judiciaire absent de l’énoncé.
- source_word: αὐτόν
  choice: le
  rationale: Le pronom renvoie à Jésus dans le contexte immédiat. Le pronom français suffit, sans expliciter son nom là où le grec ne le fait pas.
theological_decisions:
- issue: Nature de l’intention des dirigeants envers Jésus
  choice: 'Présenter leur décision comme arrêtée : « ils décidèrent donc de le tuer »'
  alternative: « ils envisagèrent de le tuer » ou « ils discutèrent de sa mise à mort »
  rationale: Le grec exprime le résultat d’une délibération et un dessein meurtrier défini, non une simple possibilité à l’étude. La formulation conserve cette gravité sans ajouter d’interprétation juridique ou doctrinale.
translation_notes:
  register: Français international moderne, sobre et digne. L’ordre « À partir de ce jour-là ... donc » est naturel tout en conservant à la fois le repère temporel initial et le lien de conséquence. Aucun archaïsme ni vocabulaire confessionnel.
