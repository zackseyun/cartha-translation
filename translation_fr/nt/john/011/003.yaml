  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: fr
  text: 'Les sœurs lui envoyèrent donc ce message : « Seigneur, voici que celui que tu aimes est malade. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτὸν λέγουσαι
  choice: lui envoyèrent ... ce message
  rationale: Cette formulation française naturelle exprime l’envoi d’une parole à Jésus sans suggérer nécessairement que les sœurs se sont déplacées elles-mêmes.
- source_word: ἴδε
  choice: non rendu séparément
  rationale: Dans cet appel affectif, ἴδε attire l’attention plutôt qu’il ne commande littéralement de regarder. En français courant, « celui que tu aimes est malade » porte naturellement cet appel, tandis que « regarde » pourrait évoquer une perception visuelle immédiate absente de la scène.
- source_word: ὃν φιλεῖς
  choice: celui que tu aimes
  rationale: Rend directement la relation personnelle exprimée par φιλέω, sans surcharger le français d’une distinction lexicale avec ἀγαπάω que le contexte ne permet pas d’imposer.
- source_word: ἀσθενεῖ
  choice: est malade
  rationale: Équivalent idiomatique précis dans ce contexte de maladie physique.
theological_decisions: []
translation_notes:
  register: Français moderne, international et digne. La phrase reste concise et conserve l’appel respectueux « Seigneur ». Le discours indirect grec introduit par λέγουσαι est rendu idiomatiquement par « ce message » suivi de deux-points.
