  text: Jesus wept[a].
translation:
  language: fr
  text: Jésus versa des larmes[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Jésus pleura ». Le verbe grec désigne précisément le fait de verser des larmes et diffère du verbe exprimant les lamentations plus bruyantes mentionnées ailleurs dans ce contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: versa des larmes
  rationale: Aoriste actif de δακρύω, le verbe désigne précisément le fait de verser des larmes. Cette formulation française naturelle préserve la sobriété du grec et le distingue des lamentations bruyantes évoquées dans le contexte, sans imposer une valeur ingressive.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Le nom propre précédé de l’article est le sujet de la phrase. En français courant, l’article n’est pas employé devant « Jésus ».
theological_decisions:
- issue: Expression de l’émotion de Jésus
  choice: Jésus versa des larmes
  alternative: Jésus pleura
  rationale: Le texte présente directement et sobrement une véritable émotion humaine de Jésus. « Versa des larmes » rend la nuance lexicale particulière de δακρύω sans amplifier cette émotion en lamentation bruyante ni ajouter d’explication doctrinale.
translation_notes:
  register: Français moderne, international et digne. La brièveté exceptionnelle du verset est conservée; « versa des larmes » est clair et naturel tout en reflétant plus précisément le verbe grec.
