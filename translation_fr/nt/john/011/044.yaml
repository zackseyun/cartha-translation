source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: fr
  text: 'Celui qui était mort sortit, les pieds et les mains liés par des bandelettes, et le visage enveloppé d’un linge. Jésus leur dit : « Déliez-le et laissez-le aller. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: Le mort
  rationale: Le participe parfait substantivé désigne directement celui qui était mort; cette formulation française est naturelle et conserve la force concise du grec.
- source_word: κειρίαις
  choice: de bandelettes
  rationale: Le terme désigne des bandes de tissu utilisées ici comme liens funéraires; « bandelettes » est précis et idiomatique.
- source_word: ἡ ὄψις
  choice: le visage
  rationale: Dans ce contexte, le mot renvoie à la face ou au visage, couvert par le linge.
- source_word: σουδαρίῳ
  choice: d’un linge
  rationale: Il s’agit d’une pièce de tissu distincte des bandelettes; « linge » évite de préciser sans fondement sa forme exacte.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu au passé simple, temps narratif naturel et digne en français écrit.
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: laissez-le aller
  rationale: La formulation conserve le sens concret et l’ouverture sémantique de la construction grecque sans expliciter davantage la destination ou la portée.
theological_decisions:
- issue: Portée de « laissez-le aller »
  choice: Conserver l’expression sans complément explicatif
  alternative: « laissez-le partir » ou « laissez-le s’en aller »
  rationale: Le grec n’indique ni destination ni interprétation symbolique; la traduction préserve donc cette sobriété et cette possible tension.
translation_notes:
  register: Français international moderne, narratif et digne. Le passé simple convient au registre biblique écrit sans archaïsme lexical. La phrase reste concrète et concise, à l’image du grec.
