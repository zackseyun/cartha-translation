    issue: Construction « liés de bandelettes »
    rationale: Le grec exprime que les pieds et les mains étaient liés au moyen de bandes. En français international moderne, « liés par des bandelettes » est plus idiomatique et précis.
  - severity: low
    issue: Rendu de ὁ τεθνηκώς par « Le mort »
    rationale: La formulation est compréhensible, mais le parfait grec désigne explicitement celui qui était mort. « Celui qui était mort » conserve mieux cet aspect sans alourdir excessivement la phrase.
  revised_text: 'Celui qui était mort sortit, les pieds et les mains liés par des bandelettes, et le visage enveloppé d’un linge. Jésus leur dit : « Déliez-le et laissez-le aller. »'
