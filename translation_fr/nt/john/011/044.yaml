review_pass:
  verdict: revise
  source_fidelity: 'Le sens général est fidèlement rendu : le défunt sort, ses membres sont entravés par des bandes funéraires, son visage est couvert d’un linge, puis Jésus ordonne de le délier et de le laisser aller. « Le mort » est possible, mais « celui qui était mort » rend plus exactement le parfait substantivé ὁ τεθνηκώς et évite de présenter simplement Lazare comme encore mort.'
  naturalness: La phrase est claire et d’un registre narratif approprié. Toutefois, « liés de bandelettes » n’est pas idiomatique en français moderne dans ce sens instrumental ; « liés par des bandelettes » rend naturellement la relation exprimée par κειρίαις.
  terminology: « Bandelettes » convient pour κειρίαις et distingue correctement ces bandes du σουδάριον, rendu sobrement par « linge ». « Déliez-le et laissez-le aller » conserve sans ajout la portée de Λύσατε αὐτὸν καὶ ἄφετε αὐτὸν ὑπάγειν.
  issues:
