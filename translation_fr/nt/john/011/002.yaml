  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: fr
  text: Il s’agissait de Marie, celle qui avait oint le Seigneur de parfum[a] et lui avait essuyé les pieds avec ses cheveux, dont le frère, Lazare, était malade.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « d’onguent » ou « d’huile parfumée » ; le terme grec désigne une huile ou un onguent parfumé.
    reason: Alternative lexicale pour μύρον.
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ ἡ ἀλείψασα
  choice: Il s’agissait de Marie, celle qui avait répandu
  rationale: La tournure identificatrice rend l’article suivi du participe, tandis que « il s’agissait de » exprime naturellement en français la reprise explicative introduite par δέ. Le plus-que-parfait situe l’acte comme antérieur au cadre narratif évoqué.
- source_word: τὸν κύριον
  choice: sur le Seigneur
  rationale: « Seigneur » conserve la valeur honorifique et théologique de κύριος appliqué à Jésus.
- source_word: μύρῳ
  choice: du parfum
  rationale: μύρον désigne une huile ou un onguent parfumé. « Parfum » est une formulation moderne et immédiatement compréhensible; la note signale les nuances matérielles possibles.
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: et lui avait essuyé les pieds
  rationale: La construction française avec pronom datif possessif est naturelle et rend précisément l’action d’essuyer exprimée par ἐκμάσσω.
- source_word: ταῖς θριξὶν αὐτῆς
  choice: avec ses cheveux
  rationale: Le datif instrumental est rendu par « avec »; « ses cheveux » est l’expression française idiomatique.
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει
  choice: C’était son frère Lazare qui était malade
  rationale: Cette phrase autonome rattache sans ambiguïté Lazare à Marie et conserve la mise en relief de son lien familial ainsi que l’imparfait duratif de ἠσθένει.
theological_decisions:
- issue: Traduction de κύριος appliqué à Jésus
  choice: le Seigneur
  alternative: le maître
  rationale: « Le Seigneur » préserve le poids narratif et théologique du titre sans le réduire à une simple relation sociale.
translation_notes:
  register: Français international moderne, clair et digne. La division en deux phrases évite une relative finale lourde ou ambiguë, tout en maintenant l’identification de Marie et son lien avec Lazare.
