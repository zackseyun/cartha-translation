id: JHN.11.39
reference: John 11:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: fr
  text: 'Jésus dit : « Enlevez la pierre. » Marthe, la sœur de l’homme qui était mort, lui dit : « Seigneur, il sent déjà mauvais[a], car il est mort depuis quatre jours[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il dégage déjà une odeur » ; le verbe grec signifie « émettre une odeur », ici désagréable.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement : « car il est du quatrième jour », c’est-à-dire qu’il est mort depuis quatre jours.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε
  choice: Enlevez
  rationale: L’impératif aoriste pluriel de αἴρω ordonne aux personnes présentes de déplacer la pierre. « Enlevez » est naturel en français et convient précisément à cet objet.
- source_word: τὸν λίθον
  choice: la pierre
  rationale: Dans le contexte d’un tombeau, λίθος désigne la pierre qui en ferme l’entrée. « La pierre » est la formulation française habituelle et claire.
- source_word: τοῦ τετελευτηκότος
  choice: de l’homme qui était mort
  rationale: Le participe parfait de τελευτάω désigne celui qui est mort et demeure dans cet état. Cette formulation conserve la valeur résultative tout en restant naturelle.
- source_word: Κύριε
  choice: Seigneur
  rationale: Dans l’Évangile selon Jean, l’adresse κύριε peut exprimer le respect tout en portant une signification plus forte que le simple « Monsieur ». « Seigneur » préserve cette portée sans la préciser au-delà du texte.
- source_word: ἤδη ὄζει
  choice: il sent déjà mauvais
  rationale: ὄζω signifie dégager une odeur, ici manifestement désagréable, et ἤδη indique que cet état est désormais présent. « Il sent déjà mauvais » est idiomatique et digne, sans atténuer la réalité évoquée.
- source_word: τεταρταῖος γάρ ἐστιν
  choice: car il est mort depuis quatre jours
  rationale: L’adjectif τεταρταῖος signifie littéralement qu’il est « du quatrième jour ». Le français demande une explicitation ; le contexte indique qu’il s’agit du temps écoulé depuis sa mort.
theological_decisions:
- issue: Traduction de κύριος dans l’adresse de Marthe à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: « Seigneur » maintient le poids possible de l’adresse dans le contexte johannique, tandis que « Monsieur » la réduirait à une simple formule de politesse. Le verset lui-même n’impose toutefois pas de développer davantage la portée christologique du titre.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue reste direct ; « sent déjà mauvais » communique sans euphémisme excessif la décomposition évoquée, tandis que l’explicitation de τεταρταῖος rend immédiatement compréhensible une expression grecque non idiomatique en français.
