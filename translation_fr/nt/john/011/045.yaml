id: JHN.11.45
reference: John 11:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: fr
  text: Ainsi, beaucoup de Juifs[a] qui étaient venus auprès de Marie et avaient vu ce qu’il avait fait crurent en lui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « beaucoup parmi les Juifs ». Dans certains contextes de l’Évangile selon Jean, on propose aussi de traduire Ἰουδαῖοι par « Judéens ».'
    reason: Alternative lexicale et précision du sens partitif.
lexical_decisions:
- source_word: Πολλοὶ
  choice: beaucoup
  rationale: Rend simplement l’idée d’un nombre important mais indéterminé.
- source_word: οὖν
  choice: ainsi
  rationale: Marque naturellement en français la conséquence de l’événement raconté juste auparavant.
- source_word: ἐκ τῶν Ἰουδαίων
  choice: beaucoup de Juifs
  rationale: Cette tournure française naturelle conserve le sens partitif de « beaucoup parmi les Juifs ». La possibilité contextuelle de « Judéens » est signalée en note.
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: qui étaient venus auprès de Marie
  rationale: Le plus-que-parfait situe leur venue avant l’action principale, et « auprès de Marie » reste proche de la relation exprimée par πρός sans préciser davantage leur intention.
- source_word: θεασάμενοι
  choice: avaient vu
  rationale: Rend idiomatiquement la perception attentive exprimée par θεάομαι dans ce contexte narratif.
- source_word: ἃ ἐποίησεν
  choice: ce qu’il avait fait
  rationale: Formulation française naturelle qui conserve le pronom du texte grec sans expliciter inutilement le nom de Jésus.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: crurent en lui
  rationale: Expression française consacrée et directe pour la confiance personnelle orientée vers Jésus dans l’usage johannique.
theological_decisions:
- issue: Sens de πιστεύω εἰς dans le contexte johannique
  choice: crurent en lui
  alternative: mirent leur foi en lui
  rationale: « Crurent en lui » reproduit sobrement la construction grecque et évite d’ajouter une nuance doctrinale absente du verset.
- issue: Portée de Ἰουδαῖοι
  choice: Juifs
  alternative: Judéens
  rationale: « Juifs » est ici la désignation française la plus naturelle du groupe narratif, tandis que « Judéens » demeure une possibilité discutée dans certains contextes de Jean et mérite donc une note sans être imposée dans le texte.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple convient au registre narratif biblique écrit, tandis que les plus-que-parfaits rendent clairement l’antériorité des participes grecs.
