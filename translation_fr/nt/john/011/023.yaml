  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: fr
  text: 'Jésus lui dit : « Ton frère ressuscitera[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « se relèvera ». Le verbe grec signifie littéralement « se lever » ou « se relever » ; dans ce contexte, il désigne le retour à la vie.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent narratif grec est rendu par « dit », forme naturelle en français qui, dans ce contexte, se lit comme un présent narratif et conserve la vivacité du récit johannique.
- source_word: αὐτῇ
  choice: lui
  rationale: Le pronom datif désignant Marthe se rend naturellement par le pronom indirect français « lui ».
- source_word: Ἀναστήσεται
  choice: ressuscitera
  rationale: Dans le contexte de la mort de Lazare, le futur de ἀνίστημι désigne son retour à la vie. « Ressuscitera » exprime clairement ce sens en français sans introduire la formulation passive « sera ressuscité », qui mettrait davantage l’accent sur l’agent divin que ne le fait la forme grecque.
- source_word: ὁ ἀδελφός σου
  choice: ton frère
  rationale: Traduction française directe et idiomatique du groupe nominal possessif, qui désigne ici Lazare, le frère de Marthe.
- source_word: ὁ Ἰησοῦς
  choice: Jésus
  rationale: Le nom propre est rendu selon son usage français établi ; l’article grec n’est pas reproduit devant le nom propre.
theological_decisions:
- issue: Formulation de la résurrection
  choice: ressuscitera
  alternative: se relèvera
  rationale: '« Ressuscitera » rend sans ambiguïté le sens imposé par la mort de Lazare, tout en laissant ouverte la question du moment visé : le retour imminent de Lazare à la vie ou la résurrection au dernier jour. La traduction n’ajoute donc aucune précision doctrinale absente de cette déclaration.'
translation_notes:
  register: Français international moderne, simple et digne. Le tutoiement correspond à l’adresse personnelle de Jésus à Marthe. La phrase brève conserve la sobriété et la tension de l’original.
