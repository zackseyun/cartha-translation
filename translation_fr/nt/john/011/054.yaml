  variant: modern international French
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: fr
  text: Jésus ne circulait donc plus ouvertement parmi les Juifs[a] ; il partit de là pour la région voisine du désert, dans une ville appelée Éphraïm, et il y resta avec les disciples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « parmi les Judéens ». Dans l’Évangile selon Jean, « les Juifs » peut parfois désigner plus précisément les habitants de la Judée ou les autorités judéennes, selon le contexte.
    reason: Préserver l’étendue sémantique contextuelle de Ἰουδαῖοι et éviter une généralisation indue.
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la conséquence narrative du complot évoqué juste avant, tout en restant naturel en français moderne.
- source_word: οὐκέτι παρρησίᾳ περιεπάτει
  choice: ne circulait plus ouvertement
  rationale: « Ne… plus » rend la cessation indiquée par οὐκέτι ; « ouvertement » exprime ici la visibilité publique, et « circulait » restitue naturellement l’idée de se déplacer ou d’aller et venir.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: parmi les Juifs
  rationale: Conserve le terme johannique traditionnel sans limiter silencieusement son référent ; une note signale la nuance régionale possible, « les Judéens ».
- source_word: ἀλλὰ ἀπῆλθεν ἐκεῖθεν
  choice: il partit de là
  rationale: Le point-virgule exprime l’opposition avec la conduite précédente ; « partit de là » rend avec concision le mouvement d’éloignement.
- source_word: εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου
  choice: pour la région proche du désert
  rationale: χώρα désigne une zone ou un territoire, et ἔρημος une région déserte ou peu habitée ; cette formulation est claire sans suggérer un État moderne.
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: dans une ville appelée Éphraïm
  rationale: Rend directement πόλις et la construction participiale λεγομένην, avec l’orthographe française usuelle du nom propre.
- source_word: κἀκεῖ ἔμεινεν μετὰ τῶν μαθητῶν
  choice: et il y resta avec les disciples
  rationale: « Resta » convient au contexte de déplacement et de séjour ; l’article défini est conservé sans ajouter le possessif « ses », absent du grec.
theological_decisions:
- issue: Référent de Ἰουδαῖοι dans l’Évangile selon Jean
  choice: parmi les Juifs
  alternative: parmi les Judéens
  rationale: Le terme peut avoir une portée ethnique, régionale ou parfois institutionnelle selon le contexte. Le texte principal garde la désignation traditionnelle, tandis que la note préserve la possibilité d’un sens régional sans l’identifier automatiquement aux autorités.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve la progression narrative et l’opposition du grec sans employer de tournures inutilement littérales ou archaïques.
