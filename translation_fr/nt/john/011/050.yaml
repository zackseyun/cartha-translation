    issue: « même pas » pour οὐδέ
    rationale: Dans cette coordination négative, οὐδέ signifie plus naturellement « non plus » (« vous ne considérez pas non plus ») que « même pas », qui peut suggérer une emphase scalaire absente ou secondaire ici.
  - severity: low
    issue: « plutôt que » pour καὶ μὴ
    rationale: La tournure française rend bien l’idée générale, mais ajoute une relation comparative explicite. Une coordination par « et que ... ne » suit plus directement la syntaxe et laisse la relation pragmatique au contexte.
  revised_text: Vous ne réfléchissez pas non plus au fait qu’il est dans votre intérêt qu’un seul homme meure pour le peuple[a] et que la nation tout entière ne périsse pas.
