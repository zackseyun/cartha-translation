review_pass:
  verdict: revise
  source_fidelity: 'La proposition principale et les termes essentiels sont bien rendus : « il est dans votre intérêt », « un seul homme », « pour le peuple » et « la nation tout entière » reflètent adéquatement συμφέρει ὑμῖν, εἷς ἄνθρωπος, ὑπὲρ τοῦ λαοῦ et ὅλον τὸ ἔθνος. Toutefois, « même pas » tend à donner à οὐδέ le sens de « pas même », tandis qu’ici la conjonction introduit surtout un reproche additionnel (« non plus »). De plus, « plutôt que » explicite une comparaison qui n’est pas formulée ainsi en grec, où καὶ μὴ coordonne la seconde proposition négative.'
