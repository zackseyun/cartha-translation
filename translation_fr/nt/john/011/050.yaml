  terminology: « Peuple » et « nation » maintiennent utilement la distinction entre λαός et ἔθνος. « Pour le peuple » préserve l’ouverture sémantique de ὑπέρ sans imposer une interprétation théologique déterminée. La note conserve de façon appropriée les possibilités « en faveur de » et « à la place de ».
  issues:
