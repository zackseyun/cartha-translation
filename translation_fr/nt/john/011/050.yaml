  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: fr
  text: Vous ne réfléchissez pas non plus au fait qu’il est dans votre intérêt qu’un seul homme meure pour le peuple[a] et que la nation tout entière ne périsse pas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « en faveur du peuple » ; l’expression peut aussi signifier « à la place du peuple ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ λογίζεσθε
  choice: Vous ne réfléchissez même pas
  rationale: La tournure exprime un reproche supplémentaire et l’absence de raisonnement ou de prise en compte; « même pas » rend naturellement la force de οὐδέ.
- source_word: συμφέρει ὑμῖν
  choice: il est dans votre intérêt
  rationale: Cette formulation restitue explicitement l’idée d’avantage pragmatique et intéressé portée par συμφέρει avec le datif ὑμῖν.
- source_word: ἵνα εἷς ἄνθρωπος ἀποθάνῃ
  choice: qu’un seul homme meure
  rationale: Le subjonctif français après « il est dans votre intérêt que » correspond naturellement à la construction grecque et « un seul homme » souligne l’opposition avec la nation entière.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: pour le peuple
  rationale: « Pour » conserve l’étendue sémantique de ὑπέρ, entre bénéfice, représentation et possible substitution, sans trancher dans le texte principal.
- source_word: ὅλον τὸ ἔθνος
  choice: la nation tout entière
  rationale: La formulation désigne clairement l’ensemble national et politique visé dans le contexte.
- source_word: ἀπόληται
  choice: périsse
  rationale: « Périsse » exprime la ruine ou la destruction collective avec la gravité du grec, sans en préciser indûment le mode.
theological_decisions:
- issue: Sens de ὑπέρ à propos de la mort de Jésus
  choice: « pour le peuple » dans le texte principal
  alternative: « en faveur du peuple » ou « à la place du peuple »
  rationale: Caïphe parle immédiatement d’un calcul politique, tandis que l’évangéliste présente ensuite ses paroles comme prophétiques. La formulation large maintient ensemble le sens politique immédiat et la portée sacrificielle ou substitutive possible.
translation_notes:
  register: Français international moderne, naturel et digne. La structure conserve le ton de reproche de Caïphe et l’opposition rhétorique entre un seul homme et la nation tout entière.
