id: JHN.11.9
reference: John 11:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: fr
  text: 'Jésus répondit : « Le jour n’a-t-il pas douze heures[a] ? Si quelqu’un marche pendant le jour, il[b] ne trébuche pas, parce qu’il voit la lumière de ce monde[c]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « N’y a-t-il pas douze heures dans la journée ? »'
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie ici le singulier représentatif : « quelqu’un… il ».'
    reason: lexical_alternative
  - marker: c
    text: Dans l’Évangile selon Jean, le langage de la lumière peut avoir une portée plus large liée à l’illumination divine ; la traduction conserve ici l’expression telle quelle.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Verbe narratif courant qui rend directement l’aoriste sans ajouter de nuance.
- source_word: Οὐχὶ
  choice: n’a-t-il pas
  rationale: Cette tournure conserve la question rhétorique qui appelle une réponse affirmative.
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: Le jour n’a-t-il pas douze heures
  rationale: Formulation française naturelle qui garde le jour comme période comptant douze heures, selon la manière antique de diviser le temps diurne.
- source_word: ἐάν τις περιπατῇ
  choice: Si quelqu’un marche
  rationale: « Quelqu’un » exprime la valeur générique de τις, tandis que « marche » conserve l’image concrète et sa portée potentiellement figurée.
- source_word: ἐν τῇ ἡμέρᾳ
  choice: pendant le jour
  rationale: Expression idiomatique qui désigne le temps où il fait jour et maintient le lien lexical avec la première proposition.
- source_word: προσκόπτει
  choice: trébuche
  rationale: « Trébucher » préserve à la fois l’image littérale d’un obstacle rencontré en marchant et une éventuelle portée métaphorique.
- source_word: τὸ φῶς
  choice: la lumière
  rationale: Équivalent lexical direct qui laisse intacte la résonance johannique sans l’expliciter dans la traduction.
- source_word: τοῦ κόσμου τούτου
  choice: de ce monde
  rationale: Rend naturellement le génitif et la force du démonstratif τούτου.
- source_word: βλέπει
  choice: voit
  rationale: Rend directement le présent de βλέπω sans ajouter l’idée interprétative de capacité exprimée par « peut voir ».
theological_decisions:
- issue: Portée symbolique possible de « la lumière » dans le contexte johannique
  choice: Conserver dans le texte l’image ordinaire de « la lumière de ce monde » sans identifier explicitement cette lumière à Jésus ou à la direction divine.
  alternative: Expliciter la lumière comme une référence à Jésus ou à l’illumination divine.
  rationale: Le vocabulaire de la lumière possède une forte résonance théologique dans Jean, mais l’énoncé fonctionne aussi ici comme une observation concrète. La formulation source permet aux deux niveaux de sens de demeurer ouverts.
- issue: Singulier générique de τις avec les verbes au singulier
  choice: Employer « quelqu’un… il » afin de conserver le singulier représentatif.
  alternative: Employer une formulation au pluriel ou reformuler avec « on ».
  rationale: Le français permet de reproduire naturellement le mouvement singulier du grec sans limiter l’application de l’énoncé aux hommes.
translation_notes:
  register: Français international moderne, naturel et digne. La question rhétorique est maintenue, de même que les images concrètes de la marche, du trébuchement et de la lumière. « Pendant le jour » évite l’ambiguïté possible de « dans la journée » tout en restant idiomatique.
