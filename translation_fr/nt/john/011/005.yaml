  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: fr
  text: Jésus aimait Marthe, sa sœur et Lazare.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: aimait
  rationale: L’imparfait de ἀγαπάω décrit ici naturellement un amour durable dans le passé. « Aimait » conserve cet aspect sans la lourdeur de « était en train d’aimer ».
- source_word: δὲ
  choice: non traduit explicitement
  rationale: δέ marque une transition légère dans le récit. En français, l’enchaînement reste naturel sans ajouter « or » ou « mais », qui risqueraient de surinterpréter sa valeur.
- source_word: τὴν Μάρθαν
  choice: Marthe
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: sa sœur
  rationale: Rend idiomatiquement le nom accompagné du possessif, sans nommer Marie, que ce verset ne nomme pas.
- source_word: τὸν Λάζαρον
  choice: Lazare
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: καὶ ... καὶ
  choice: ponctuation puis « et »
  rationale: Le français coordonne naturellement une série de trois personnes par une virgule puis « et ». Répéter « et » serait possible, mais plus marqué stylistiquement.
theological_decisions:
- issue: Valeur de l’imparfait ἠγάπα concernant l’amour de Jésus
  choice: Une affirmation simple de l’amour durable de Jésus pour Marthe, sa sœur et Lazare
  alternative: Une valeur inchoative (« se mit à aimer ») ou fortement progressive (« était en train d’aimer »)
  rationale: Dans ce contexte, l’imparfait présente le plus naturellement un état continu dans le passé, sans ajouter de précision doctrinale ou émotionnelle absente du texte.
translation_notes:
  register: Français international moderne, simple et digne. La formulation est directe et idiomatique; aucun marqueur discursif artificiel n’est ajouté en tête de phrase.
