  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Ἴδε πῶς ἐφίλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: fr
  text: 'Les Juifs[a] disaient donc : « Voyez comme il l’aimait ! »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Les Judéens ». Dans ce contexte, l’expression désigne les personnes juives présentes sur les lieux ; elle peut aussi être comprise dans un sens régional plus précis.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente la parole comme en cours ou répétée dans la scène ; l’imparfait français en rend naturellement l’aspect.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur relie cette réaction aux pleurs de Jésus au verset précédent, avec une valeur à la fois narrative et inférentielle.
- source_word: οἱ Ἰουδαῖοι
  choice: les Juifs
  rationale: Cette expression johannique désigne ici les personnes juives présentes auprès de Marie ; la formulation directe du grec est conservée, tandis que la possibilité d’un sens régional plus précis est signalée en note.
- source_word: Ἴδε
  choice: Voyez
  rationale: L’impératif attire l’attention des auditeurs. Le pluriel est idiomatique en français puisque la remarque est prononcée devant un groupe.
- source_word: πῶς
  choice: comme
  rationale: Dans l’exclamation « Voyez comme… », ce terme peut évoquer à la fois la manière et l’intensité, sans imposer une précision absente du grec.
- source_word: ἐφίλει
  choice: il l’aimait
  rationale: Le verbe exprime ici l’affection personnelle de Jésus pour Lazare. « Aimait » est naturel, digne et garde l’imparfait du grec.
- source_word: αὐτόν
  choice: l’
  rationale: Le pronom masculin singulier renvoie à Lazare ; l’élision est exigée par la syntaxe française devant « aimait ».
theological_decisions:
- issue: Portée de l’expression οἱ Ἰουδαῖοι dans Jean
  choice: les Juifs
  alternative: les Judéens
  rationale: Le texte vise ici les personnes juives présentes dans la scène, et non le peuple juif pris globalement. La traduction principale reste proche de la désignation grecque, tandis qu’une note conserve l’interprétation régionale possible et évite une généralisation hostile.
translation_notes:
  register: Français international moderne, naturel et digne. « Voyez comme il l’aimait ! » conserve le ton spontané de l’exclamation ainsi que l’ambiguïté de πῶς entre manière et intensité.
