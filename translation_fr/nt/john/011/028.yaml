id: JHN.11.28
reference: John 11:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: fr
  text: 'Après avoir dit cela, elle s’en alla et appela Marie, sa sœur, à l’écart, en lui disant : « Le Maître est là et il t’appelle. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: Après avoir dit cela
  rationale: Le participe aoriste marque ici une action antérieure à celle du verbe principal. Cette formulation naturelle conserve l’enchaînement du récit.
- source_word: ἀπῆλθεν
  choice: elle s’en alla
  rationale: Le verbe exprime le départ de Marthe du lieu où elle se trouvait auprès de Jésus.
- source_word: ἐφώνησεν Μαριὰμ τὴν ἀδελφὴν αὐτῆς
  choice: appela […] Marie, sa sœur
  rationale: φωνέω signifie ici appeler quelqu’un pour le faire venir. L’apposition « sa sœur » identifie Marie sans lourdeur.
- source_word: λάθρᾳ
  choice: en privé
  rationale: L’adverbe indique que l’appel n’est pas fait publiquement ou à portée de tous. « En privé » évite d’attribuer à Marthe une intention clandestine que le texte ne précise pas.
- source_word: εἰποῦσα
  choice: en lui disant
  rationale: Cette tournure introduit directement les paroles adressées à Marie tout en conservant la valeur du participe grec.
- source_word: Ὁ διδάσκαλος
  choice: Le Maître
  rationale: Dans ce contexte, διδάσκαλος est un titre respectueux désignant celui qui enseigne. « Le Maître » est l’équivalent français naturel et traditionnel, sans ajouter un titre christologique absent du grec.
- source_word: πάρεστιν
  choice: est là
  rationale: La formule rend simplement la présence actuelle de Jésus et convient au discours direct.
- source_word: φωνεῖ σε
  choice: il t’appelle
  rationale: Le présent grec désigne l’appel actuel de Jésus, c’est-à-dire sa demande que Marie vienne le voir. Le français garde cette formulation brève et naturellement ambiguë.
theological_decisions:
- issue: Valeur du titre διδάσκαλος appliqué à Jésus
  choice: Le Maître
  alternative: L’Enseignant
  rationale: « Le Maître » fonctionne naturellement en français comme titre respectueux d’un enseignant. La traduction ne développe pas ce titre en affirmation doctrinale supplémentaire.
- issue: Nuance de λάθρᾳ
  choice: en privé
  alternative: en secret
  rationale: Le texte établit le caractère non public de la communication, mais n’en indique pas explicitement le motif. « En privé » préserve cette retenue.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe reste proche de la progression grecque tout en évitant un calque pesant. Aucun marqueur de note n’est requis, puisqu’aucune note n’est ajoutée.
