id: JHN.11.33
reference: John 11:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: fr
  text: Jésus donc, lorsqu’il la vit pleurer, ainsi que les Juifs[a] qui étaient venus avec elle, il fut profondément remué[b] dans son esprit et se troubla.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les Judéens ». Ici, le terme désigne les personnes juives venues auprès de Marie, et non le peuple juif dans son ensemble.
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi évoquer l’indignation ou une profonde agitation; il exprime une vive émotion intérieure.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Conserve le lien logique et narratif avec la scène précédente sans réduire le terme à une simple indication chronologique.
- source_word: ὡς εἶδεν
  choice: quand … vit
  rationale: ὡς suivi de l’aoriste a ici une valeur temporelle; cette formulation est naturelle en français et respecte la succession des faits.
- source_word: κλαίουσαν / κλαίοντας
  choice: pleurer
  rationale: Le verbe désigne des pleurs perceptibles, éventuellement accompagnés de lamentations. « Pleurer » convient aux deux occurrences sans imposer l’idée plus précise de lamentations rituelles.
- source_word: συνελθόντας αὐτῇ
  choice: qui étaient venus avec elle
  rationale: Rend directement l’idée de personnes venues avec Marie, sans préciser au-delà du grec qu’elles l’auraient accompagnée depuis un lieu particulier.
- source_word: Ἰουδαίους
  choice: les Juifs
  rationale: Traduction lexicale directe; dans ce contexte, le terme désigne les personnes juives venues auprès de Marie, et non le peuple juif dans son ensemble. Une note signale aussi la traduction possible « les Judéens ».
- source_word: ἐνεβριμήσατο
  choice: fut profondément remué
  rationale: Exprime la vive agitation intérieure portée par le verbe sans décider si elle relève surtout de la douleur, de l’indignation ou de la colère.
- source_word: τῷ πνεύματι
  choice: dans son esprit
  rationale: Préserve le datif indiquant la sphère intérieure où se produit cette vive émotion.
- source_word: ἐτάραξεν ἑαυτόν
  choice: se troubla lui-même
  rationale: Maintient la forme réflexive explicite du grec, qui présente Jésus non comme simplement soumis à un trouble passif, mais comme se troublant lui-même.
theological_decisions:
- issue: Nature de l’émotion de Jésus exprimée par ἐνεβριμήσατο
  choice: Employer une expression de vive émotion sans en préciser la cause ni la qualité exacte.
  alternative: « s’indigna », « fut pris d’indignation » ou « fut vivement bouleversé »
  rationale: Le verbe peut évoquer l’indignation, la sévérité ou une profonde agitation. Le contexte ne permet pas de trancher avec certitude entre douleur et indignation; la traduction conserve donc cette tension et la note présente les nuances plus fortes.
- issue: Caractère volontaire ou réflexif du trouble de Jésus
  choice: Conserver explicitement « lui-même ».
  alternative: « fut troublé » ou « devint troublé »
  rationale: Le grec emploie ἑαυτόν, pronom réfléchi explicite. La formulation retenue préserve cette donnée sans élaborer une doctrine sur la maîtrise émotionnelle de Jésus.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « pleurer » reflète celle du grec et relie les pleurs de Marie à ceux des personnes qui l’accompagnent. « Se troubla lui-même » est volontairement légèrement marqué afin de conserver la construction réflexive du texte source.
