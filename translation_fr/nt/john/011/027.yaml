id: JHN.11.27
reference: John 11:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: fr
  text: 'Elle lui dit : « Oui, Seigneur, moi, je crois que tu es le Messie[a], le Fils de Dieu, celui qui vient dans le monde[b]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Christ ». Le titre grec Christos signifie « Messie », c’est-à-dire « Oint ».
    reason: alternative_reading
  - marker: b
    text: Ou « qui vient dans le monde ». Le grec emploie une expression participiale pouvant être rendue plus explicitement par une proposition relative.
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: Elle lui dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit en français écrit. Le sujet féminin ressort du contexte immédiat.
- source_word: Ναί, κύριε
  choice: Oui, Seigneur
  rationale: « Oui » exprime directement l’affirmation, et « Seigneur » conserve la portée révérencielle de l’adresse dans cette confession.
- source_word: ἐγὼ πεπίστευκα
  choice: moi, je crois
  rationale: Le pronom explicite ἐγώ reçoit une légère mise en relief par « moi, je ». Le français idiomatique emploie le présent « je crois » pour exprimer la conviction acquise et toujours actuelle portée par le parfait grec.
- source_word: ὅτι σὺ εἶ
  choice: que tu es
  rationale: ὅτι introduit ici le contenu de la foi, tandis que le pronom σὺ met en relief l’identité de Jésus sans exiger une tournure française lourde.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Le titre est traduit selon son sens plutôt que simplement transcrit, ce qui conserve son arrière-plan juif et sa valeur royale et eschatologique.
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: le Fils de Dieu
  rationale: Cette formulation française traditionnelle et intelligible préserve la détermination et le poids christologique du titre.
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: celui qui vient dans le monde
  rationale: La proposition relative rend naturellement le participe présent substantivé et conserve l’idée de la figure attendue qui vient dans le monde.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Dans cette confession explicite d’identité, « Messie » communique le sens du titre grec et son enracinement dans l’attente juive, tandis que « Christ » peut être entendu comme un nom propre.
- issue: Portée de κύριε
  choice: Seigneur
  alternative: Monsieur / Maître
  rationale: Le contexte d’une confession de Jésus comme Messie et Fils de Dieu favorise une adresse révérencielle forte. « Seigneur » préserve cette portée sans préciser davantage la nature exacte de la reconnaissance de Marthe.
- issue: Valeur aspectuelle de πεπίστευκα
  choice: je crois
  alternative: j’ai cru / je suis arrivée à croire
  rationale: Le parfait grec présente une conviction établie qui demeure. En français actuel, « je crois » exprime le plus naturellement cet état présent; une note signale la nuance d’acquisition et de permanence sans imposer une paraphrase dans le texte.
- issue: Fonction de ὁ ἐρχόμενος
  choice: celui qui vient dans le monde
  alternative: celui qui doit venir dans le monde
  rationale: La traduction retenue préserve le présent participial et le caractère possiblement titulaire de l’expression sans introduire explicitement une modalité d’obligation absente du grec.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique écrit sans être archaïque. La dislocation « moi, je » reflète l’emphase de ἐγώ tout en restant idiomatique. Les titres « Messie », « Fils de Dieu » et « Seigneur » conservent leur densité théologique sans ajout confessionnel.
