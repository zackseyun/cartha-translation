id: JHN.11.21
reference: John 11:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: fr
  text: 'Marthe dit donc à Jésus : « Seigneur[a], si tu avais été ici, mon frère ne serait pas mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur ». Le grec κύριε peut servir de formule d’adresse respectueuse; « Seigneur » conserve aussi la possible portée théologique du terme dans l’Évangile selon Jean.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque ici la continuité du récit avec une nuance de conséquence; « donc » en conserve la force sans alourdir la phrase.
- source_word: εἶπεν
  choice: dit
  rationale: Dans ce contexte narratif, le verbe courant « dire » rend naturellement λέγω.
- source_word: πρὸς τὸν Ἰησοῦν
  choice: à Jésus
  rationale: Après un verbe de parole, πρός avec l’accusatif désigne l’interlocuteur; « à Jésus » est la tournure française naturelle.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » préserve à la fois la valeur d’adresse respectueuse et l’éventuelle portée christologique du terme dans l’Évangile selon Jean.
- source_word: εἰ ἦς ὧδε
  choice: si tu avais été ici
  rationale: L’imparfait ἦς appartient à une condition irréelle portant sur le passé; le plus-que-parfait français en exprime naturellement le sens. ὧδε est rendu simplement par « ici ».
- source_word: οὐκ ἂν ἀπέθανεν
  choice: ne serait pas mort
  rationale: La construction οὐκ avec ἄν et l’indicatif aoriste exprime le résultat irréel dans le passé; le conditionnel passé français est exact et idiomatique.
- source_word: ὁ ἀδελφός μου
  choice: mon frère
  rationale: Dans le contexte, ἀδελφός désigne Lazare, le frère de Marthe; « mon frère » est direct et sans ambiguïté.
theological_decisions:
- issue: Sens de κύριος dans l’adresse de Marthe à Jésus
  choice: Seigneur
  alternative: Monsieur; Maître
  rationale: « Seigneur » conserve l’ambivalence entre une formule respectueuse et une confession pouvant avoir une portée christologique, sans imposer que Marthe exprime ici explicitement cette dernière.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond à l’adresse directe au singulier et évite la distance moderne que créerait le vouvoiement. La formulation garde intacte la conviction de Marthe sans expliciter davantage son degré de foi.
