id: JHN.11.32
reference: John 11:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: fr
  text: 'Lorsque Marie arriva donc là où se trouvait Jésus et le vit, elle tomba à ses pieds et lui dit : « Seigneur[a], si tu avais été ici, mon frère ne serait pas mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur ». Le grec peut être une formule d’adresse respectueuse ; « Seigneur » en préserve aussi la portée possible dans la présentation de Jésus par cet Évangile.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la progression narrative liée au contexte précédent, tout en conservant explicitement la valeur connective du grec.
- source_word: ὡς ἦλθεν
  choice: quand … arriva
  rationale: Dans cette construction temporelle avec l’aoriste, « quand » introduit naturellement la circonstance de l’arrivée de Marie.
- source_word: ὅπου ἦν Ἰησοῦς
  choice: là où était Jésus
  rationale: Rend directement la proposition locative, avec un français naturel et sans ajout explicatif.
- source_word: ἰδοῦσα αὐτόν
  choice: et le vit
  rationale: Le participe aoriste circonstanciel est rendu par un verbe coordonné, ce qui exprime clairement la succession immédiate des actions.
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: elle tomba à ses pieds
  rationale: Expression française habituelle correspondant à la prosternation ou à l’effondrement devant quelqu’un.
- source_word: λέγουσα αὐτῷ
  choice: et lui dit
  rationale: Cette formulation idiomatique restitue le participe qui introduit les paroles de Marie, sans alourdir la phrase par « en lui disant ».
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » conserve la portée respectueuse et potentiellement théologique de l’adresse, conformément à l’usage johannique, sans trancher entièrement son degré de confession.
- source_word: εἰ ἦς ὧδε
  choice: si tu avais été ici
  rationale: Le plus-que-parfait français exprime naturellement cette condition passée contraire aux faits.
- source_word: οὐκ ἄν … ἀπέθανεν
  choice: ne serait pas mort
  rationale: Le conditionnel passé rend le résultat irréel dans le passé exprimé par οὐκ ἄν avec l’aoriste.
- source_word: μου ὁ ἀδελφός
  choice: mon frère
  rationale: Le possessif français rend naturellement le génitif μου.
theological_decisions:
- issue: Sens de Κύριε dans l’adresse de Marie à Jésus
  choice: Seigneur
  alternative: Maître / Monsieur
  rationale: « Seigneur » préserve à la fois le respect de l’adresse et la profondeur christologique possible dans l’Évangile selon Jean. La note signale que le vocatif grec peut aussi fonctionner comme une formule respectueuse, afin de ne pas imposer une confession plus précise que le contexte ne l’exige.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le connecteur « donc » et la structure conditionnelle irréelle du grec. Le tutoiement correspond à l’adresse directe naturelle dans ce contexte biblique.
