id: JHN.11.16
reference: John 11:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: fr
  text: 'Alors Thomas, appelé Didyme[a], dit aux autres disciples : « Allons-y, nous aussi, afin de mourir avec lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Didyme signifie « Jumeau » en grec.
    reason: Explicitation du sens de l’appellation grecque Δίδυμος.
lexical_decisions:
- source_word: οὖν
  choice: Alors
  rationale: Marque naturellement en français la progression narrative et la conséquence tirée de l’échange précédent, sans alourdir le style.
- source_word: Θωμᾶς
  choice: Thomas
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ὁ λεγόμενος Δίδυμος
  choice: appelé Didyme[a]
  rationale: Conserve l’appellation grecque sous sa forme française traditionnelle, tandis que la note en explicite le sens lexical.
- source_word: τοῖς συμμαθηταῖς
  choice: aux autres disciples
  rationale: Dans ce contexte, le terme désigne les disciples qui le sont avec Thomas. « Aux autres disciples » est plus idiomatique en français que « à ses condisciples ».
- source_word: Ἄγωμεν
  choice: Allons-y
  rationale: Rend naturellement le subjonctif d’exhortation à la première personne du pluriel et le mouvement envisagé dans le contexte.
- source_word: καὶ ἡμεῖς
  choice: nous aussi
  rationale: Préserve l’emphase explicite du grec sur l’inclusion de Thomas et des autres disciples.
- source_word: ἵνα
  choice: afin de
  rationale: Exprime le but ou le résultat envisagé sans imposer une interprétation psychologique du propos.
- source_word: ἀποθάνωμεν
  choice: mourir
  rationale: Après « afin de », l’infinitif français rend clairement et naturellement le subjonctif grec.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: Rend simplement l’accompagnement et laisse au contexte l’identification du référent comme Jésus.
theological_decisions:
- issue: Ton et intention de la déclaration de Thomas
  choice: Formulation directe, sans coloration interprétative ajoutée
  alternative: Loyauté courageuse, résignation fataliste ou pessimisme ironique
  rationale: Le grec rapporte l’exhortation sans préciser explicitement le ton de Thomas. La traduction maintient cette ambiguïté.
translation_notes:
  register: Français international moderne, naturel et digne. « Allons-y » évite une tournure raide, tandis que « afin de mourir avec lui » conserve la gravité et l’ambiguïté de l’énoncé.
