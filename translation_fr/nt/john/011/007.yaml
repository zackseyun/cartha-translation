  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: fr
  text: 'Puis, après cela, il dit aux disciples : « Allons de nouveau en Judée. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα
  choice: Puis
  rationale: Marque la progression du récit de manière naturelle en français, tout en restant distinct de la locution temporelle qui suit.
- source_word: μετὰ τοῦτο
  choice: après cela
  rationale: Rend directement la référence temporelle et conserve la légère redondance du grec avec « Puis ».
- source_word: λέγει
  choice: il dit
  rationale: Correspond au présent historique grec. En français, « dit » est formellement identique au présent et au passé simple, mais la tournure reste fidèle, naturelle et sobre.
- source_word: τοῖς μαθηταῖς
  choice: aux disciples
  rationale: Rend directement le datif sans ajouter le possessif « ses », absent du texte grec.
- source_word: Ἄγωμεν
  choice: Allons
  rationale: Rend clairement le subjonctif exhortatif à la première personne du pluriel, sans ajouter d'insistance.
- source_word: εἰς τὴν Ἰουδαίαν
  choice: en Judée
  rationale: Expression française naturelle pour un déplacement vers cette région; elle rend la direction indiquée par εἰς sans la formulation peu idiomatique « dans la Judée ».
- source_word: πάλιν
  choice: de nouveau
  rationale: Indique clairement le retour dans une région déjà visitée et s'intègre naturellement à l'impératif exhortatif.
theological_decisions:
- issue: Présent historique dans le récit johannique
  choice: Conserver « il dit »
  alternative: Lisser explicitement au passé avec une autre formulation comme « il leur déclara »
  rationale: « Il dit » reste au plus près de λέγει et peut porter le présent historique en français, même si sa forme écrite coïncide avec celle du passé simple. Aucun enjeu doctrinal ne justifie de modifier le verbe.
translation_notes:
  register: 'Français international moderne, clair et digne. La répétition temporelle « Puis, après cela » est conservée parce qu''elle appartient au texte grec. Aucune note n''est nécessaire : « en Judée » est l''équivalent français idiomatique de la construction directionnelle grecque.'
