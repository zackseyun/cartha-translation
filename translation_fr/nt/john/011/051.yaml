id: JHN.11.51
reference: John 11:51
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: fr
  text: Il ne dit pas cela de lui-même[a] ; mais, étant grand prêtre cette année-là, il prophétisa que Jésus allait mourir pour la nation[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « de sa propre initiative ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « en faveur de la nation » ; le grec peut aussi exprimer l’idée d’agir au nom de quelqu’un.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο δὲ
  choice: Il ne dit pas cela
  rationale: Le pronom « cela » reprend naturellement la déclaration précédente. La légère articulation portée par δέ est rendue par la structure contrastive de la phrase sans ajout d’un marqueur temporel absent du grec.
- source_word: ἀφ’ ἑαυτοῦ
  choice: de lui-même
  rationale: Cette expression conserve l’idée de source ou d’initiative personnelle, tout en restant idiomatique en français.
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: mais, étant grand prêtre cette année-là
  rationale: Le participe est conservé afin de ne pas expliciter davantage que le grec le rapport entre la fonction de Caïphe et sa prophétie. « Cette année-là » rend naturellement le génitif temporel.
- source_word: ἐπροφήτευσεν
  choice: il prophétisa
  rationale: Le verbe français préserve l’affirmation explicite du texte selon laquelle ses paroles avaient une portée prophétique.
- source_word: ἔμελλεν Ἰησοῦς ἀποθνῄσκειν
  choice: Jésus allait mourir
  rationale: « Allait mourir » exprime l’événement futur envisagé sans imposer soit une imminence très forte, soit une notion déterministe de destin.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: pour la nation
  rationale: « Pour » garde ouverte la portée bénéfactive ou représentative de ὑπέρ, tandis que « la nation » respecte le singulier et désigne ici la nation juive.
theological_decisions:
- issue: Portée prophétique des paroles de Caïphe
  choice: Affirmer simplement qu’il prophétisa en tant que grand prêtre cette année-là.
  alternative: Préciser qu’il prophétisa consciemment sous inspiration divine, ou réduire la formulation à une simple ironie narrative.
  rationale: Le texte qualifie explicitement sa parole de prophétie, mais ne précise ni son degré de conscience ni une théorie complète de l’inspiration.
- issue: Sens de ὑπὲρ dans la mort de Jésus
  choice: pour la nation
  alternative: au nom de la nation ; en faveur de la nation ; à la place de la nation
  rationale: La formulation retenue maintient la force théologique et représentative possible sans imposer à ce seul verset une définition technique particulière de l’expiation.
translation_notes:
  register: Français international moderne, digne et accessible. Le passé simple convient au registre narratif biblique soutenu sans être archaïque. La ponctuation met en relief le contraste sans alourdir la phrase.
