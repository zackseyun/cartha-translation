id: JHN.11.47
reference: John 11:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: fr
  text: 'Les grands prêtres et les pharisiens réunirent donc le conseil[a] et disaient : « Que faisons-nous ? Car cet homme accomplit de nombreux signes. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Sanhédrin », l’instance dirigeante juive.
    reason: Précise l’identification institutionnelle probable de συνέδριον tout en maintenant dans le texte principal une traduction non technique.
lexical_decisions:
- source_word: συνήγαγον
  choice: réunirent
  rationale: L’aoriste de συνάγω décrit ici l’action de réunir ou convoquer le conseil. « Réunirent » reste proche de la construction grecque tout en étant naturel en français.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque la conséquence narrative et logique des événements précédents, sans imposer une inférence plus forte que le grec.
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: Expression française usuelle pour les principales autorités sacerdotales; le pluriel ne signifie pas nécessairement que plusieurs personnes exerçaient simultanément la charge de grand prêtre.
- source_word: Φαρισαῖοι
  choice: pharisiens
  rationale: Translittération française consacrée du nom de ce groupe juif.
- source_word: συνέδριον
  choice: le conseil
  rationale: Le terme désigne ici très probablement l’instance dirigeante juive. « Le conseil » traduit le nom grec sans imposer dans le texte principal le terme technique traditionnel « Sanhédrin »; celui-ci figure en note.
- source_word: ἔλεγον
  choice: disaient
  rationale: L’imparfait grec présente la parole dans son déroulement; l’imparfait français en conserve naturellement l’aspect.
- source_word: Τί ποιοῦμεν
  choice: Que faisons-nous ?
  rationale: Cette formulation conserve l’indicatif présent du grec et l’alarme des interlocuteurs, sans transformer explicitement la question en « Que devons-nous faire ? ».
- source_word: ὅτι
  choice: Car
  rationale: Introduit la raison de leur question. « Car » rend clairement ce lien causal dans le discours direct.
- source_word: οὗτος ὁ ἄνθρωπος
  choice: cet homme
  rationale: Rend directement l’expression grecque et en conserve la possible nuance de distance ou de dédain.
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: accomplit de nombreux signes
  rationale: « Accomplit » est naturel pour des actes remarquables, tandis que « signes » préserve le vocabulaire théologiquement important de Jean plutôt que de le réduire à « miracles ».
theological_decisions:
- issue: Traduction de σημεῖα dans l’Évangile selon Jean
  choice: signes
  alternative: miracles; signes miraculeux
  rationale: Chez Jean, les œuvres de Jésus révèlent son identité et renvoient au-delà d’elles-mêmes. « Signes » conserve cette portée sans ajouter une interprétation dans le texte.
- issue: Identification de συνέδριον
  choice: le conseil
  alternative: le Sanhédrin; un conseil
  rationale: Le contexte indique vraisemblablement l’instance dirigeante de Jérusalem, mais le mot grec demeure un nom commun et n’impose pas à lui seul le titre technique. Le texte traduit donc le terme, tandis que la note donne l’identification traditionnelle.
- issue: Valeur de Τί ποιοῦμεν
  choice: Que faisons-nous ?
  alternative: Que devons-nous faire ?; Qu’allons-nous faire ?
  rationale: Le grec emploie l’indicatif présent. La traduction retenue préserve cette forme ainsi que la tension entre constat d’inaction et question délibérative.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe reste proche du grec sans devenir artificielle. « De nombreux signes » conserve le vocabulaire johannique tout en étant plus naturel que « beaucoup de signes ».
