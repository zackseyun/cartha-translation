  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: fr
  text: Alors Jésus, de nouveau profondément bouleversé intérieurement[a], arriva au tombeau. C’était une grotte, et une pierre était placée contre le tombeau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « indigné en lui-même » ou « profondément troublé en lui-même » ; le verbe grec est particulièrement fort et peut exprimer davantage que la seule tristesse.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: alors
  rationale: Marque naturellement en français la progression narrative et le lien avec la scène précédente.
- source_word: πάλιν
  choice: de nouveau
  rationale: Signale la répétition de la vive réaction de Jésus déjà mentionnée dans le contexte.
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: profondément bouleversé en lui-même
  rationale: Conserve l’intensité et le caractère intérieur de la réaction sans la réduire exclusivement au chagrin ou à l’indignation.
- source_word: ἔρχεται
  choice: se rendit
  rationale: Le présent historique grec est rendu par un passé simple naturel dans un récit français; le verbe exprime ici le déplacement vers le tombeau.
- source_word: μνημεῖον
  choice: tombeau
  rationale: Désigne ici un lieu funéraire aménagé, comme le confirme la description de la grotte.
- source_word: σπήλαιον
  choice: grotte
  rationale: Équivalent français courant et direct du nom grec.
- source_word: λίθος
  choice: pierre
  rationale: Terme usuel pour la pierre qui obture un tombeau.
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: en fermait l’entrée
  rationale: Rend explicitement la fonction de la pierre placée contre l’ouverture de ce tombeau-grotte, sans suggérer à tort une position horizontale sur le dessus.
theological_decisions:
- issue: Force émotionnelle de ἐμβριμώμενος appliqué à Jésus
  choice: Une agitation intérieure intense, sans en préciser exclusivement la nature
  alternative: « indigné en lui-même » ou « profondément troublé en lui-même »
  rationale: Le verbe grec est particulièrement fort et peut comporter une nuance d’indignation, mais le contexte ne permet pas de fixer avec certitude une seule émotion. Le texte principal maintient cette tension, et la note présente les principales possibilités.
translation_notes:
  register: Français international moderne, digne et accessible. « Se rendit » et le passé simple conviennent au registre narratif biblique sans archaïsme marqué. La formulation « en fermait l’entrée » privilégie la clarté concrète tout en respectant la configuration d’un tombeau creusé dans une grotte.
