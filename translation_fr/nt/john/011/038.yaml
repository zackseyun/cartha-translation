  to: Alors Jésus, de nouveau profondément bouleversé intérieurement[a], arriva au tombeau. C’était une grotte, et une pierre était placée contre le tombeau.
  rationale: La révision remplace l’explicitation « en fermait l’entrée » par une description spatiale qui correspond plus directement à ἐπέκειτο ἐπ’ αὐτῷ. Elle améliore aussi légèrement l’idiomaticité de l’expression de l’émotion intérieure, tout en gardant l’ambiguïté interprétative signalée par la note.
