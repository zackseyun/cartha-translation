id: JHN.18.31
reference: John 18:31
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: fr
  text: 'Pilate leur dit donc : « Prenez-le vous-mêmes et jugez-le selon votre loi. » Les Juifs[a] lui dirent : « Nous n’avons pas le droit de mettre qui que ce soit à mort. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Grec : « les Juifs » (hoi Ioudaioi). Dans ce contexte, l’expression désigne les autorités ou les accusateurs juifs qui parlent à Pilate, et non le peuple juif dans son ensemble.'
    reason: Clarification du référent contextuel afin d’éviter une généralisation étrangère à la scène.
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque naturellement en français la progression logique et narrative du dialogue.
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: Prenez-le vous-mêmes
  rationale: L’impératif traduit Λάβετε, tandis que « vous-mêmes » rend l’insistance du pronom explicite ὑμεῖς.
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: selon votre loi
  rationale: Rend κατά comme l’expression de la norme ou du critère, tout en conservant la distance marquée par « votre ».
- source_word: κρίνατε αὐτόν
  choice: jugez-le
  rationale: Conserve la portée juridique assez large de κρίνω sans préciser indûment la forme de la procédure.
- source_word: οἱ Ἰουδαῖοι
  choice: Les Juifs
  rationale: Traduction formelle de l’expression grecque; une note précise que le contexte désigne ici les autorités ou accusateurs juifs présents, et non l’ensemble du peuple juif.
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: Nous n’avons pas le droit
  rationale: Formulation française actuelle et naturelle exprimant l’absence d’autorisation légale ou reconnue.
- source_word: ἀποκτεῖναι οὐδένα
  choice: mettre qui que ce soit à mort
  rationale: Dans ce cadre judiciaire, « mettre à mort » rend mieux la portée de l’acte que le simple « tuer »; « qui que ce soit » restitue la portée indéfinie de οὐδένα.
theological_decisions:
- issue: Référent de οἱ Ἰουδαῖοι dans le récit johannique
  choice: « Les Juifs » dans le texte, avec une note contextuelle
  alternative: « les autorités juives » ou « les chefs juifs »
  rationale: Le texte conserve l’expression grecque sans en réduire silencieusement la portée lexicale, tandis que la note empêche de l’interpréter comme visant indistinctement tout le peuple juif; dans la scène, il s’agit du groupe d’autorités ou d’accusateurs qui parle à Pilate.
translation_notes:
  register: Français international moderne, digne et direct. La syntaxe du dialogue reste naturelle; « vous-mêmes » maintient l’insistance grecque, et « nous n’avons pas le droit » convient au contexte juridique sans archaïsme.
