id: JHN.18.15
reference: John 18:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἠκολούθει δὲ τῷ Ἰησοῦ Σίμων Πέτρος ⸀καὶ ἄλλος μαθητής. ὁ δὲ μαθητὴς ἐκεῖνος ἦν γνωστὸς τῷ ἀρχιερεῖ καὶ συνεισῆλθεν τῷ Ἰησοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: fr
  text: Simon Pierre suivait Jésus[a], ainsi qu’un autre disciple. Ce disciple était connu du grand prêtre et il entra avec Jésus dans la cour du grand prêtre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « Simon Pierre suivait Jésus, et un autre disciple. » En grec, le fait que le second disciple accomplissait la même action reste implicite.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: suivait
  rationale: L’imparfait grec présente l’action comme en cours dans le récit; l’imparfait français en conserve naturellement l’aspect.
- source_word: δὲ
  choice: non exprimé séparément
  rationale: Ici, la particule assure une transition narrative légère. Le français enchaîne naturellement sans ajouter « alors » ou « or », qui risqueraient de surcharger le texte.
- source_word: καὶ ἄλλος μαθητής
  choice: ainsi qu’un autre disciple
  rationale: Cette formulation française coordonne les deux disciples et rend naturellement explicite que l’autre disciple suivait lui aussi Jésus, action laissée implicite dans le second membre grec.
- source_word: μαθητής
  choice: disciple
  rationale: « Disciple » est le terme français courant et précis dans Jean pour une personne qui suit Jésus et reçoit son enseignement.
- source_word: ἐκεῖνος
  choice: ce
  rationale: « Ce disciple » renvoie clairement à l’autre disciple qui vient d’être mentionné, sans lourdeur.
- source_word: γνωστὸς
  choice: connu
  rationale: « Connu du grand prêtre » traduit directement la relation exprimée, sans supposer une intimité particulière comme pourrait le faire « proche ».
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: grand prêtre
  rationale: C’est l’équivalent français usuel de ἀρχιερεύς dans ce contexte; le singulier est conservé aux deux occurrences.
- source_word: συνεισῆλθεν
  choice: entra avec
  rationale: Le verbe composé exprime une entrée effectuée avec Jésus; « entra avec » en restitue sobrement le mouvement et l’association.
- source_word: αὐλήν
  choice: cour
  rationale: Dans ce contexte résidentiel, « cour » désigne naturellement l’espace intérieur ou clos de la demeure, sans ajouter l’idée non explicitée d’un palais.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe explicite avec « ainsi qu’ » facilite la lecture tout en signalant en note la coordination plus formelle du grec. La répétition de « grand prêtre » est conservée comme dans le texte source.
