id: JHN.18.37
reference: John 18:37
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: fr
  text: 'Pilate lui dit donc : « Tu es donc roi ? » Jésus répondit : « Tu dis que je suis roi.[a] C’est pour cela que je suis né, et c’est pour cela que je suis venu dans le monde : pour rendre témoignage à la vérité. Quiconque est de la vérité écoute ma voix. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Tu le dis : je suis roi », ou « Tu as raison de dire que je suis roi ». La formulation grecque est concise et peut s’entendre comme une affirmation nuancée.'
    reason: 'Lecture alternative : le grec laisse ouverte la force exacte de la réponse de Jésus.'
lexical_decisions:
- source_word: Οὐκοῦν
  choice: donc
  rationale: « Donc » restitue le caractère déductif de la question de Pilate, qui tire une conclusion de l’échange précédent, tout en restant naturel en français.
- source_word: βασιλεὺς
  choice: roi
  rationale: « Roi » est le sens normal dans cet interrogatoire romain et conserve à la fois les résonances politiques et messianiques du terme.
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: Tu dis que je suis roi
  rationale: Cette formulation suit de près la phrase grecque concise sans la transformer explicitement ni en affirmation appuyée ni en prise de distance. La note signale les nuances possibles.
- source_word: γεγέννημαι
  choice: je suis né
  rationale: Le passé composé français exprime naturellement la naissance comme fait accompli ayant une portée présente, sans introduire les associations théologiques que pourrait suggérer « engendré ».
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: je suis venu dans le monde
  rationale: Le passé composé rend naturellement le parfait grec et conserve distinctement le langage johannique de venue et de mission dans le monde.
- source_word: μαρτυρήσω
  choice: rendre témoignage
  rationale: Cette expression maintient le champ lexical juridique et testimonial caractéristique de Jean; après « pour », elle exprime clairement le but.
- source_word: τῇ ἀληθείᾳ
  choice: à la vérité
  rationale: « Rendre témoignage à la vérité » correspond à la construction grecque et préserve la portée johannique de « la vérité ».
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: Quiconque est de la vérité
  rationale: La formulation conserve le rapport d’origine ou d’appartenance exprimé par ἐκ, sans le réduire explicitement à une seule interprétation.
- source_word: ἀκούει μου τῆς φωνῆς
  choice: écoute ma voix
  rationale: « Écoute » peut exprimer ici une réception attentive et réceptive, tandis que « ma voix » conserve les échos johanniques, notamment ceux du berger.
theological_decisions:
- issue: Nuance de la réponse de Jésus à Pilate (Σὺ λέγεις ὅτι βασιλεύς εἰμι)
  choice: 'Une affirmation qualifiée et transparente : « Tu dis que je suis roi »'
  alternative: Une affirmation appuyée (« Tu as raison de dire que je suis roi ») ou une réponse plus distanciée (« C’est toi qui le dis »)
  rationale: Le grec permet plusieurs nuances sans exprimer clairement ni une approbation emphatique ni un refus du titre. Le texte principal reste donc proche de la forme grecque et la note préserve les lectures possibles.
- issue: Portée du langage de mission (« je suis né » et « je suis venu dans le monde »)
  choice: Conserver séparément les deux propositions
  alternative: Les fondre en une seule paraphrase sur la mission de Jésus
  rationale: Jean distingue la naissance de Jésus de sa venue dans le monde, distinction susceptible de porter une signification incarnationnelle. La traduction la conserve sans lui ajouter d’explication doctrinale.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe demeure accessible tout en conservant les formulations johanniques importantes, notamment « rendre témoignage à la vérité », « être de la vérité » et « écouter ma voix ».
