id: JHN.18.29
reference: John 18:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: fr
  text: 'Pilate sortit donc à leur rencontre et leur dit : « Quelle accusation portez-vous contre cet homme ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: sortit
  rationale: Le verbe préfixé ἐξέρχομαι exprime déjà le mouvement vers l’extérieur; en français, « sortit » restitue naturellement l’ensemble sans la redondance peu idiomatique « sortit dehors ».
- source_word: οὖν
  choice: donc
  rationale: « Donc » conserve la valeur de progression et de conséquence narrative du contexte précédent.
- source_word: πρὸς αὐτούς
  choice: à leur rencontre
  rationale: πρός avec l’accusatif indique ici que Pilate se dirige vers les accusateurs afin de les rencontrer; « à leur rencontre » rend ce mouvement plus explicitement que le simple pronom indirect repris avec « dit ».
- source_word: φησίν
  choice: dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel d’un récit français soutenu et cohérent avec « sortit ».
- source_word: Τίνα κατηγορίαν
  choice: Quelle accusation
  rationale: κατηγορία désigne une accusation ou un chef d’accusation dans un cadre judiciaire. « Accusation » reste clair, précis et proche du grec.
- source_word: φέρετε
  choice: portez-vous
  rationale: Dans un contexte judiciaire, « porter une accusation contre quelqu’un » est l’expression française consacrée et restitue la valeur active de φέρω.
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: contre cet homme
  rationale: κατά avec le génitif a ici le sens judiciaire de « contre », et ἄνθρωπος désigne cet individu masculin précis.
