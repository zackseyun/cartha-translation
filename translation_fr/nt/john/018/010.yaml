  source_fidelity: La traduction rend correctement la progression introduite par οὖν, l’action de tirer l’épée, l’identification de l’esclave du grand prêtre et son nom. Toutefois, « lui coupa l’oreille droite » peut décrire une simple blessure ou entaille, tandis que ἀπέκοψεν indique explicitement que l’oreille a été coupée et enlevée.
