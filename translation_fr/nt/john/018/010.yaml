id: JHN.18.10
reference: John 18:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: fr
  text: Alors Simon Pierre, qui avait une épée, la tira, frappa l’esclave[a] du grand prêtre et lui trancha l’oreille droite. Cet esclave s’appelait Malchus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le mot grec doulos peut désigner un esclave ou un serviteur selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Alors
  rationale: Marque naturellement la progression du récit et le lien avec la scène précédente, sans donner au connecteur une force strictement logique.
- source_word: ἔχων μάχαιραν
  choice: qui avait une épée
  rationale: Rend clairement le participe grec en français courant. μάχαιρα peut désigner une épée ou une arme plus courte, mais « épée » reste ici le terme général le plus naturel.
- source_word: εἵλκυσεν αὐτὴν
  choice: la tira
  rationale: Dans le contexte d’une arme portée, « tirer son épée » exprime idiomatiquement le fait de la sortir.
- source_word: ἔπαισεν
  choice: frappa
  rationale: Terme direct, naturel et digne qui conserve la force de l’action.
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: l’esclave du grand prêtre
  rationale: δοῦλος peut signifier « esclave » ou « serviteur » selon le contexte. Le rapport d’appartenance exprimé ici favorise « esclave », tandis que l’autre possibilité est conservée en note.
- source_word: ἀπέκοψεν αὐτοῦ τὸ ὠτάριον τὸ δεξιόν
  choice: lui coupa l’oreille droite
  rationale: Formulation française naturelle qui rend directement l’ablation par coupure; le diminutif ὠτάριον ne demande pas un diminutif en français et ne désigne pas nécessairement le lobe.
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: Cet esclave s’appelait Malchus
  rationale: Rend idiomatiquement la construction grecque qui donne le nom de l’esclave; « Cet » assure avec naturel la reprise narrative introduite par δέ.
theological_decisions:
- issue: Traduction de δοῦλος
  choice: esclave
  alternative: serviteur
  rationale: Le terme grec couvre les notions d’esclave et de serviteur. Dans l’expression « du grand prêtre », la relation de dépendance personnelle favorise « esclave », sans exclure « serviteur », signalé en note afin de préserver l’étendue sémantique.
translation_notes:
  register: Français international moderne, narratif et digne. La syntaxe est fluide sans effacer la succession rapide des actions. Le nom Μάλχος est transcrit sous la forme française traditionnelle « Malchus ».
