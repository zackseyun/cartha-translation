reference: John 18:35
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: fr
  text: 'Pilate répondit : « Je ne suis pas juif[a], n’est-ce pas ? Ta nation et les grands prêtres t’ont livré à moi. Qu’as-tu fait ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Judéen ». Le terme grec peut désigner une identité ethnique ou religieuse (« juif »), ou une identité régionale (« Judéen »), selon le contexte.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Verbe narratif courant qui introduit naturellement la réponse de Pilate.
- source_word: Μήτι
  choice: Je ne suis tout de même pas… n’est-ce pas ?
  rationale: La tournure négative avec reprise interrogative exprime l’attente d’une réponse négative et le ton de mise à distance de Pilate.
- source_word: Ἰουδαῖός
  choice: juif
  rationale: Dans ce contexte, Pilate oppose son identité à celle de Jésus et de ses accusateurs; « juif » rend le plus naturellement le sens ethnique et national, tout en signalant en note l’autre valeur possible.
- source_word: τὸ ἔθνος τὸ σὸν
  choice: ceux de ta nation
  rationale: Cette formulation rend la collectivité désignée par ἔθνος ainsi que l’emphase possessive, sans suggérer que chaque membre de la nation a personnellement livré Jésus.
- source_word: ἀρχιερεῖς
  choice: grands prêtres
  rationale: Équivalent français usuel pour les principaux membres de l’autorité sacerdotale de Jérusalem désignés au pluriel.
- source_word: παρέδωκάν σε ἐμοί
  choice: t’ont livré à moi
  rationale: « Livrer » conserve la nuance judiciaire de la remise de Jésus à l’autorité de Pilate, sans imposer ici le sens plus chargé de « trahir ».
- source_word: τί ἐποίησας
  choice: Qu’as-tu fait ?
  rationale: Le passé composé est naturel en français pour interroger un acte accompli dont les conséquences motivent la procédure présente.
theological_decisions:
- issue: Sens de Ἰουδαῖος dans Jean
  choice: juif
  alternative: Judéen
  rationale: La question rhétorique de Pilate, suivie de la mention de la nation de Jésus, favorise ici le sens ethnique et national plutôt qu’un sens strictement régional. Une note conserve néanmoins la possibilité lexicale de « Judéen ».
- issue: Portée de « ta nation » comme sujet de la remise
  choice: ceux de ta nation
  alternative: ta nation
  rationale: Le grec personnifie la nation comme sujet collectif. Le français « ceux de ta nation » garde cette portée collective tout en évitant une formulation pouvant être comprise comme une accusation individuelle et indistincte de tout le peuple.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement correspond au dialogue direct et la formulation conserve le caractère incisif de l’interrogatoire de Pilate.
