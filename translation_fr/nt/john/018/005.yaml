  text: ἀπεκρίθησαν αὐτῷ· Ἰησοῦν τὸν Ναζωραῖον. λέγει ⸀αὐτοῖς· Ἐγώ εἰμι. εἱστήκει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: fr
  text: 'Ils lui répondirent : « Jésus le Nazaréen. » Il leur dit : « Je suis[a]. » Judas, qui le livrait, se tenait lui aussi avec eux.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « C’est moi. » Littéralement : « Je suis. »'
    reason: Préserve la forme elliptique du grec Ἐγώ εἰμι tout en indiquant l’interprétation idiomatique exigée par le contexte.
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jésus le Nazaréen
  rationale: « Le Nazaréen » rend naturellement le gentilé grec et conserve l’identification de Jésus par son origine géographique.
- source_word: Ἐγώ εἰμι
  choice: C’est moi
  rationale: Dans ce dialogue d’identification, cette formulation française rend idiomatiquement « je suis [celui que vous cherchez] » sans imposer ici une explicitation théologique étrangère à la phrase.
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: celui qui le livrait
  rationale: Le participe présent désigne Judas par l’action en cours; l’imparfait français en préserve la valeur contextuelle.
- source_word: εἱστήκει
  choice: se tenait
  rationale: Le plus-que-parfait grec de ἵστημι décrit ici la position de Judas; « se tenait » est naturel en français et évite le calque lourd « était debout ».
theological_decisions:
- issue: Portée possible de Ἐγώ εἰμι
  choice: C’est moi
  alternative: Je suis
  rationale: « Je suis » préserverait plus formellement l’expression grecque et ses éventuels échos johanniques, mais son emploi isolé serait peu naturel et ambigu en français. « C’est moi » conserve la réponse d’auto-identification exigée par le contexte sans nier d’éventuelles résonances littéraires.
translation_notes:
  register: Français moderne, international et digne; narration fluide, dialogue direct naturel, sans archaïsmes ni ajout confessionnel.
