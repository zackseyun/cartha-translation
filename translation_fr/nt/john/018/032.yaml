  naturalness: La phrase est claire et d’un registre moderne et digne. Le remplacement de « de quelle mort » par « de quel genre de mort » rend la dernière proposition plus idiomatique tout en préservant sa précision.
  terminology: « Parole », « s’accomplisse » et « allait mourir » sont des choix justes. « Parole » ne doit pas être confondu ici avec le titre johannique de Jean 1.1; la note lexicale proposée aide utilement le lecteur. La note sur la crucifixion demeure prudente et ne transforme pas une allusion contextuelle en explicitation textuelle.
