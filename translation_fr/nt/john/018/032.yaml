id: JHN.18.32
reference: John 18:32
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: fr
  text: afin que s’accomplisse la parole de Jésus[a], qu’il avait prononcée en indiquant de quel genre de mort il allait mourir[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « la déclaration de Jésus ».
    reason: lexical_alternative
  - marker: b
    text: Jésus avait indiqué la manière dont il mourrait, vraisemblablement par crucifixion. Comparer Jean 12.32-33.
    reason: cross_reference
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit ici le résultat voulu ou accompli; « afin que » conserve la portée téléologique de la proposition.
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: la parole de Jésus
  rationale: Désigne une déclaration prononcée par Jésus, sans renvoyer au titre « la Parole » de Jean 1.1. La note signale l’équivalent plus explicite « déclaration ».
- source_word: πληρωθῇ
  choice: s’accomplisse
  rationale: Conserve le vocabulaire johannique de l’accomplissement et sa portée théologique, plutôt que de l’aplatir en « se réalise ».
- source_word: ὃν εἶπεν
  choice: qu’il avait prononcée
  rationale: Le relatif reprend « parole »; le plus-que-parfait marque naturellement l’antériorité de la déclaration de Jésus.
- source_word: σημαίνων
  choice: en indiquant
  rationale: Le participe circonstanciel se rapporte à l’acte de parler et précise que cette parole signalait la manière dont Jésus mourrait.
- source_word: ποίῳ θανάτῳ
  choice: de quelle mort
  rationale: Expression française naturelle qui porte sur la nature ou la manière de la mort, non sur son seul fait.
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: il allait mourir
  rationale: Rend le futur envisagé par μέλλω sans introduire l’idée plus forte qu’il était explicitement « destiné » à mourir ainsi.
theological_decisions:
- issue: Langage d’accomplissement appliqué à la parole antérieure de Jésus
  choice: « afin que s’accomplisse la parole de Jésus »
  alternative: « afin que ce que Jésus avait dit se réalise »
  rationale: Le verbe πληρόω appartient au motif biblique et johannique de l’accomplissement. Le conserver maintient la portée théologique de la formulation.
- issue: Portée de μέλλω concernant la mort de Jésus
  choice: « il allait mourir »
  alternative: « il était destiné à mourir »
  rationale: La formulation exprime le futur attendu sans renforcer indûment cette proposition par un langage déterministe.
- issue: Nature de la mort évoquée
  choice: Ne pas insérer « crucifixion » dans le texte
  alternative: « indiquant qu’il allait être crucifié »
  rationale: Le contexte renvoie vraisemblablement à la crucifixion, mais le grec dit littéralement « de quelle mort »; l’explicitation est donc réservée à une note.
translation_notes:
  register: Français international moderne, clair et digne. La tournure « s’accomplisse la parole » garde l’idiome biblique sans archaïsme marqué; « en indiquant » reflète naturellement le participe grec.
