id: JHN.18.13
reference: John 18:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: fr
  text: Ils conduisirent d’abord Jésus chez Anne, car celui-ci était le beau-père de Caïphe, qui était grand-prêtre cette année-là.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: ils conduisirent Jésus
  rationale: ἄγω signifie ici conduire ou emmener. Dans le contexte de l’arrestation, « conduisirent » exprime naturellement un déplacement sous garde. Le complément, implicite en grec, est rendu par « Jésus » pour éviter l’ambiguïté en français.
- source_word: πρὸς Ἅνναν
  choice: chez Anne
  rationale: πρός avec l’accusatif marque le mouvement vers une personne. En français, « chez Anne » indique naturellement qu’on mène Jésus là où se trouve Anne, sans suggérer nécessairement une comparution officielle.
- source_word: πρῶτον
  choice: d’abord
  rationale: L’adverbe indique l’ordre des étapes. « D’abord » est idiomatique et conserve clairement la priorité chronologique.
- source_word: πενθερὸς
  choice: beau-père
  rationale: πενθερός désigne précisément le père de l’épouse; « beau-père » est l’équivalent français usuel, même si ce terme peut avoir d’autres sens hors contexte.
- source_word: ἀρχιερεὺς
  choice: grand-prêtre
  rationale: « Grand-prêtre » est le terme français établi pour la fonction sacerdotale juive désignée par ἀρχιερεύς.
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: cette année-là
  rationale: Cette formulation française naturelle conserve le repère temporel exprimé par le génitif grec.
- source_word: Ἅνναν
  choice: Anne
  rationale: « Anne » est la forme française biblique traditionnelle du nom masculin Ἅννας.
- source_word: Καϊάφα
  choice: Caïphe
  rationale: « Caïphe » est la forme française biblique établie de Καϊάφας.
theological_decisions:
- issue: Référent de « qui était grand-prêtre cette année-là »
  choice: La proposition relative se rapporte à Caïphe.
  alternative: Une formulation française mal structurée pourrait faire croire qu’elle se rapporte à Anne.
  rationale: Le pronom relatif grec ὃς renvoie naturellement à l’antécédent le plus proche, Καϊάφα. La ponctuation et la formulation françaises maintiennent ce rattachement sans ajouter d’interprétation.
translation_notes:
  register: Français moderne, courant et digne. Le passé simple convient à la narration biblique écrite. « Celui-ci » clarifie que le beau-père est Anne, tandis que la relative placée immédiatement après « Caïphe » identifie sans équivoque ce dernier comme grand-prêtre.
