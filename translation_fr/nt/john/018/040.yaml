id: JHN.18.40
reference: John 18:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐκραύγασαν οὖν ⸀πάλιν λέγοντες· Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν. ἦν δὲ ὁ Βαραββᾶς λῃστής.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/040.yaml
  text: So they shouted again[a], saying, “Not this man, but Barabbas!” Now Barabbas was a robber.
translation:
  language: fr
  text: 'Alors ils crièrent de nouveau : « Pas cet homme, mais Barabbas ! » Or, Barabbas était un brigand.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « voleur » ou « bandit » ; le terme grec peut, dans certains contextes, désigner un insurgé violent.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκραύγασαν
  choice: ils crièrent
  rationale: Le verbe désigne un cri poussé à voix forte. « Crièrent » est naturel, actuel et conserve l’intensité sans être familier.
- source_word: οὖν
  choice: Alors
  rationale: Dans la suite du dialogue, οὖν marque ici la conséquence ou la progression du récit. « Alors » assure naturellement cette liaison en français.
- source_word: πάλιν
  choice: de nouveau
  rationale: Cette expression rend directement l’idée de répétition portée par πάλιν.
- source_word: λέγοντες
  choice: rendu par les paroles introduites après les deux-points
  rationale: Après « ils crièrent », traduire littéralement λέγοντες par « en disant » serait lourd en français. Les deux-points conservent sa fonction d’introduction du discours direct.
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: Pas cet homme, mais Barabbas !
  rationale: « Cet homme » préserve la valeur démonstrative de τοῦτον, tandis que la phrase elliptique et vigoureuse convient au cri de la foule.
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: Barabbas
  rationale: Le nom propre est rendu selon sa forme française traditionnelle et largement reconnue.
- source_word: ἦν δὲ
  choice: Or, ... était
  rationale: δέ introduit une précision explicative en arrière-plan. « Or » remplit cette fonction avec un registre narratif digne et courant.
- source_word: λῃστής
  choice: brigand
  rationale: « Brigand » couvre mieux que « voleur » la possibilité d’un malfaiteur violent ou d’un bandit, sans préciser indûment qu’il s’agissait d’un insurgé politique.
theological_decisions:
- issue: Portée de λῃστής appliqué à Barabbas
  choice: brigand
  alternative: voleur ; bandit ; insurgé
  rationale: Le terme grec peut désigner un voleur ou un brigand et, dans certains contextes, un rebelle violent. « Brigand » conserve cette amplitude sans transformer en certitude l’éventuelle dimension insurrectionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. La formulation brève du cri est préservée, tandis que la note maintient l’ambiguïté historique et lexicale de λῃστής.
