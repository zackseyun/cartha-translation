source:
  edition: SBLGNT
  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: fr
  text: Le grand prêtre interrogea donc Jésus sur ses disciples et sur son enseignement.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « demanda à Jésus ». Le verbe grec peut signifier « demander » ou « interroger »; « interrogea » a été retenu en raison du cadre formel de la comparution.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la continuité ou la conséquence narrative; « donc » conserve naturellement cette valeur en français.
- source_word: ἀρχιερεὺς
  choice: le grand prêtre
  rationale: Titre français usuel de la fonction juive désignée par le grec; le texte ne remplace pas le titre par le nom d’Anne.
- source_word: ἠρώτησεν
  choice: interrogea
  rationale: Le verbe peut signifier « demander » ou « interroger ». Dans le cadre formel de cette comparution, « interrogea » exprime l’enquête sans la durcir en « soumit à un interrogatoire ».
- source_word: περὶ
  choice: sur
  rationale: Avec le génitif, indique ici le sujet des questions; « sur » convient naturellement aux deux occurrences.
- source_word: μαθητῶν
  choice: disciples
  rationale: Terme établi et précis pour la relation entre un maître et ceux qui reçoivent son enseignement.
- source_word: διδαχῆς
  choice: enseignement
  rationale: Rend le sens de ce que Jésus enseigne sans les connotations plus techniques que pourrait porter « doctrine ».
- source_word: αὐτοῦ
  choice: ses / son
  rationale: Les deux possessifs renvoient à Jésus; leur forme française s’accorde respectivement avec « disciples » et « enseignement ».
theological_decisions:
- issue: Le titre ἀρχιερεύς dans un contexte narratif où il est question d’Anne plutôt que de Caïphe, grand prêtre reconnu par Rome en fonction
  choice: Traduire directement le titre grec par « le grand prêtre »
  alternative: « Anne, le grand prêtre » ou « le chef des prêtres »
  rationale: La traduction conserve la présentation du récit grec sans introduire un nom absent du verset ni harmoniser implicitement la donnée historique.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique courant sans être archaïque; la répétition de « sur » reflète la structure grecque et reste fluide.
