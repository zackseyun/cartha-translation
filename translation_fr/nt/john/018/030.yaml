  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: fr
  text: 'Ils lui répondirent : « Si cet homme ne faisait pas le mal, nous ne te l’aurions pas livré. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: Ils lui répondirent
  rationale: La double formule narrative, influencée par l’usage sémitique, signifie naturellement qu’ils lui répondirent. Répéter « répondirent et dirent » serait lourd en français moderne sans ajouter de contenu distinct.
- source_word: Εἰ μὴ ἦν
  choice: Si ... ne faisait pas
  rationale: Cette formulation rend la condition contraire aux faits de manière naturelle, en corrélation avec le conditionnel passé de la proposition principale.
- source_word: οὗτος
  choice: cet homme
  rationale: Le démonstratif désigne Jésus avec une certaine distance. « Cet homme » reste naturel sans ajouter le mépris que pourrait suggérer « cet individu ».
- source_word: κακὸν ποιῶν
  choice: faisait le mal
  rationale: Cette traduction conserve la valeur verbale du participe ποιῶν et la portée morale générale de κακόν, sans transformer l’accusation en qualification juridique précise.
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: nous ne te l’aurions pas livré
  rationale: Le conditionnel passé exprime correctement l’irréel du passé. « Livré » convient au contexte judiciaire et conserve le motif johannique de la remise de Jésus aux autorités.
theological_decisions:
- issue: Nature de l’accusation portée contre Jésus
  choice: faisait le mal
  alternative: était un malfaiteur
  rationale: Le grec κακὸν ποιῶν décrit littéralement une conduite mauvaise plutôt qu’un statut légal technique. La formulation choisie préserve le caractère général et évasif de l’accusation.
translation_notes:
  register: Français moderne, digne et direct. La formule grecque redondante « répondirent et dirent » est rendue idiomatiquement par « répondirent », tandis que la structure conditionnelle et la généralité de l’accusation sont conservées.
