  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: fr
  text: 'Jésus répondit : « Dis-tu cela de toi-même, ou bien d’autres te l’ont-ils dit à mon sujet ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Verbe narratif courant introduisant la réponse de Jésus ; « répondit » est naturel et précis en français.
- source_word: Ἀπὸ σεαυτοῦ
  choice: de toi-même
  rationale: 'Cette expression conserve l’idée de source ou d’origine personnelle : Jésus demande si les paroles de Pilate viennent de lui-même.'
- source_word: σὺ
  choice: tu
  rationale: Le pronom grec est explicite et emphatique. L’inversion « Dis-tu » exprime naturellement le sujet en français, sans ajouter d’interprétation.
- source_word: τοῦτο
  choice: cela
  rationale: Renvoie à la question précédente de Pilate ; « cela » convient au registre du dialogue et reste clair.
- source_word: λέγεις
  choice: dis-tu
  rationale: Le présent grec porte sur la déclaration que Pilate vient de formuler. Le présent français est direct et idiomatique.
- source_word: ἢ
  choice: ou bien
  rationale: Introduit clairement la seconde possibilité proposée par Jésus.
- source_word: ἄλλοι
  choice: d’autres
  rationale: Désigne sans précision supplémentaire d’autres personnes que Pilate.
- source_word: εἶπόν σοι
  choice: te l’ont-ils dit
  rationale: L’aoriste désigne ici une communication antérieure. Le pronom « l’ » reprend naturellement « cela » en français.
- source_word: περὶ ἐμοῦ
  choice: à mon sujet
  rationale: Rend clairement περί avec le génitif dans un français actuel et digne.
theological_decisions:
- issue: Portée de la question de Jésus à Pilate
  choice: Présenter la question comme portant sur l’origine personnelle ou extérieure des paroles de Pilate.
  alternative: 'Interpréter plus explicitement : « Est-ce de ta propre initiative que tu poses cette question ? »'
  rationale: Le grec demande si Pilate dit « cela » de lui-même ou sur la foi de ce que d’autres lui ont dit. La formulation retenue préserve cette tension sans préciser ses motivations ni transformer sa déclaration en simple acte de questionner.
translation_notes:
  register: Français international moderne, naturel et digne. « De toi-même » suit de près l’image grecque de la provenance tout en restant idiomatique. L’alternative avec « d’autres » est conservée sans identifier ces personnes ni expliciter leurs intentions.
