id: JHN.18.38
reference: John 18:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: fr
  text: 'Pilate lui dit : « Qu’est-ce que la vérité ? » Après avoir dit cela, il sortit de nouveau vers les Juifs[a] et leur dit : « Je ne trouve aucun motif d’accusation contre lui. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « les responsables juifs ». Dans l’Évangile selon Jean, l’expression « les Juifs » peut parfois désigner plus précisément les autorités de Judée ou le groupe représentant, dans le contexte immédiat, ceux qui s’opposent à Jésus.
    reason: Préserver la portée contextuelle possible de Ἰουδαῖοι sans remplacer dans le texte principal son sens lexical direct ni lui donner une portée ethnique indifférenciée.
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: Pilate lui dit
  rationale: Le présent grec λέγει est un présent historique. Le passé simple convient naturellement au récit français et maintient la progression narrative.
- source_word: Τί ἐστιν ἀλήθεια;
  choice: Qu’est-ce que la vérité ?
  rationale: Cette formulation française courante rend directement la question générale de Pilate. En français, l’article défini est normalement requis devant le nom abstrait « vérité » et ne supprime pas l’ouverture de la question grecque.
- source_word: Καὶ τοῦτο εἰπὼν
  choice: Après avoir dit cela
  rationale: La proposition infinitive temporelle exprime clairement l’antériorité du participe aoriste εἰπών sans alourdir la phrase.
- source_word: πάλιν ἐξῆλθεν
  choice: il sortit de nouveau
  rationale: « Sortit » conserve le mouvement vers l’extérieur exprimé par ἐξῆλθεν, tandis que « de nouveau » rend la répétition indiquée par πάλιν.
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: vers les Juifs
  rationale: Le texte principal conserve le terme lexical « les Juifs » et la préposition directionnelle πρὸς. Une note signale que, dans ce contexte, le groupe visé peut être plus précisément celui des responsables ou accusateurs juifs présents.
- source_word: καὶ λέγει αὐτοῖς
  choice: et leur dit
  rationale: Le second présent historique λέγει est lui aussi rendu au passé simple, selon l’usage naturel du récit en français.
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: Je ne trouve aucun motif d’accusation contre lui
  rationale: Dans ce cadre judiciaire, αἰτία désigne un motif d’accusation ou un fondement à une charge, plutôt qu’une faute morale vague. « Contre lui » est l’expression juridique française idiomatique correspondant ici à ἐν αὐτῷ.
theological_decisions:
- issue: Référent de Ἰουδαίοις dans le récit de la Passion selon Jean
  choice: Le texte principal porte « les Juifs », avec une note précisant le sens contextuel possible.
  alternative: les responsables juifs ; les Judéens
  rationale: Le choix principal reste transparent par rapport au terme grec, tout en évitant, grâce à la note, de laisser entendre nécessairement que Jean vise sans distinction l’ensemble du peuple juif. Dans la scène, il peut s’agir plus étroitement des autorités ou du groupe d’accusateurs présent devant Pilate.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé simple convient au registre narratif biblique sans être archaïque. La formulation juridique reste accessible, et la question de Pilate conserve sa brièveté ainsi que son ambiguïté.
