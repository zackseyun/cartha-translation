  text: ἀπέστειλεν ⸀οὖν αὐτὸν ὁ Ἅννας δεδεμένον πρὸς Καϊάφαν τὸν ἀρχιερέα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: fr
  text: Alors Anne l’envoya lié à Caïphe, le grand prêtre.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, si cette phrase est comprise comme une remarque rétrospective expliquant les événements précédents : « Or, Anne l’avait envoyé lié à Caïphe, le grand prêtre. »'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: l’envoya
  rationale: L’aoriste actif de ἀποστέλλω exprime ici une action narrative simple. « Envoya » est l’équivalent français naturel.
- source_word: οὖν
  choice: Alors
  rationale: Dans ce récit, οὖν marque la progression narrative. « Alors » rend ce lien avec naturel, sans donner une portée strictement logique à « donc ».
- source_word: δεδεμένον
  choice: toujours lié
  rationale: Le participe parfait passif décrit l’état dans lequel Jésus se trouve au moment de l’envoi. « Toujours lié » explicite la valeur résultative et continue du parfait sans modifier l’action principale.
- source_word: πρὸς
  choice: à
  rationale: Avec un verbe d’envoi et l’accusatif Καϊάφαν, πρός indique la destination vers une personne ; « à » est idiomatique en français.
- source_word: ὁ Ἅννας
  choice: Anne
  rationale: « Anne » est la forme française biblique traditionnelle et courante du nom Ἅννας.
- source_word: Καϊάφαν
  choice: Caïphe
  rationale: « Caïphe » est la forme française consacrée du nom Καϊάφας.
- source_word: τὸν ἀρχιερέα
  choice: le grand prêtre
  rationale: Dans le récit johannique de la Passion, ἀρχιερεύς désigne la fonction individuelle de grand prêtre. Cette traduction évite la confusion avec l’ensemble des chefs des prêtres.
theological_decisions:
- issue: Séquence narrative par rapport au contexte environnant
  choice: 'Présenter l’envoi comme l’événement suivant du récit : « Alors Anne l’envoya… »'
  alternative: 'Comprendre l’aoriste comme un plus-que-parfait dans une remarque rétrospective : « Or, Anne l’avait envoyé… »'
  rationale: L’aoriste indicatif se lit naturellement comme une action narrative passée. Le contexte permet toutefois une lecture rétrospective visant à expliquer les événements précédents ; la note conserve cette possibilité sans imposer une harmonisation dans le texte principal.
translation_notes:
  register: Français international moderne, clair et digne. Les formes françaises usuelles « Anne » et « Caïphe » sont retenues. « Alors » assure une progression narrative naturelle ; la variante temporelle et contextuelle est préservée en note.
