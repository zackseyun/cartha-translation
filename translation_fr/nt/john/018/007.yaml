source:
  edition: SBLGNT
  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: fr
  text: 'Il leur demanda donc de nouveau : « Qui cherchez-vous ? » Ils répondirent : « Jésus le Nazaréen[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou « Jésus de Nazareth » ; grec : « Jésus le Nazaréen ».'
    reason: Alternative lexicale pour Ναζωραῖος.
lexical_decisions:
- source_word: πάλιν οὖν
  choice: donc de nouveau
  rationale: « De nouveau » exprime la répétition indiquée par πάλιν, tandis que « donc » maintient l’enchaînement discursif marqué par οὖν.
- source_word: ἐπηρώτησεν αὐτούς
  choice: il leur demanda
  rationale: En français, demander quelque chose « à » des personnes exige le pronom indirect « leur » ; cette tournure rend naturellement l’acte de leur poser de nouveau la question.
- source_word: Τίνα ζητεῖτε
  choice: Qui cherchez-vous ?
  rationale: « Qui » est la forme française naturelle pour l’interrogatif personnel objet. « Chercher » conserve la portée de ζητέω et convient au contexte immédiat.
- source_word: οἱ δὲ εἶπαν
  choice: Ils répondirent
  rationale: Dans cet échange, « répondirent » exprime naturellement la prise de parole introduite par δέ et εἶπαν, sans donner à δέ une valeur adversative excessive.
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: Jésus le Nazaréen
  rationale: « Le Nazaréen » conserve la forme de désignation grecque Ναζωραῖος plutôt que de la remplacer silencieusement par une indication d’origine géographique.
theological_decisions:
- issue: Valeur de Ναζωραῖος comme désignation de Jésus
  choice: Jésus le Nazaréen
  alternative: Jésus de Nazareth
  rationale: Il s’agit d’abord d’une désignation lexicale et historique, non d’un titre doctrinal. Le texte principal garde la forme grecque au plus près, tandis que la formulation géographique courante est signalée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple convient au registre narratif biblique sans être archaïque ; le dialogue reste direct et immédiatement compréhensible.
