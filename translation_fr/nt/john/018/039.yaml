id: JHN.18.39
reference: John 18:39
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: fr
  text: Mais il est de coutume chez vous que je vous relâche un prisonnier à la Pâque. Voulez-vous donc que je vous relâche le roi des Juifs[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le roi des Judéens ». Selon le contexte, le terme grec peut désigner les Juifs ou les habitants de la Judée ; il apparaît ici dans le titre employé tout au long du récit de la Passion.
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: coutume
  rationale: « Coutume » exprime naturellement une pratique collective établie dans ce contexte judiciaire et festif.
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: que je vous relâche un prisonnier
  rationale: Le grec dit littéralement « que je vous en relâche un »; « un prisonnier » explicite en français le référent personnel clairement fourni par le contexte, sans ajouter une identité particulière.
- source_word: ἀπολύω
  choice: relâcher
  rationale: Dans le contexte de la libération d'un détenu par le gouverneur, « relâcher » est précis et idiomatique; le même verbe est conservé aux deux occurrences.
- source_word: ἐν τῷ πάσχα
  choice: à la Pâque
  rationale: Cette formulation française naturelle situe la coutume à l'occasion de la fête juive et conserve la valeur temporelle de la préposition.
- source_word: βούλεσθε οὖν
  choice: Voulez-vous donc
  rationale: « Donc » marque l'enchaînement logique de οὖν, tandis que « voulez-vous » rend βούλεσθε dans un registre courant et digne.
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: le roi des Juifs
  rationale: Cette expression conserve le titre et l'accusation royale établis dans le récit de la Passion. La minuscule à « roi » suit l'usage courant du français pour les titres accompagnés d'un complément.
theological_decisions:
- issue: Sens de Ἰουδαίων dans le titre τὸν βασιλέα τῶν Ἰουδαίων
  choice: le roi des Juifs
  alternative: le roi des Judéens
  rationale: Dans le récit johannique de la Passion, la formule fonctionne comme le titre royal et messianique associé à Jésus. « Juifs » en conserve le sens historique et narratif traditionnel, tandis que la note signale honnêtement la possibilité lexicale géographique sans l'imposer au texte.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase demeure proche de la structure grecque tout en explicitant « un prisonnier », requis par l'idiome et le contexte français. Le marqueur [a] est placé immédiatement après l'expression concernée.
