  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: fr
  text: Alors Pierre le nia de nouveau[a], et aussitôt un coq chanta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Alors Pierre nia de nouveau » ; le grec n’exprime pas explicitement l’objet du verbe, mais le contexte le fournit à partir de la question précédente.
    reason: alternative_lexicale
lexical_decisions:
- source_word: πάλιν
  choice: de nouveau
  rationale: L’adverbe marque la répétition du reniement; « de nouveau » est naturel et précis dans ce récit.
- source_word: οὖν
  choice: Alors
  rationale: La particule relie cette réponse à l’échange précédent tout en faisant progresser le récit, sans accentuer excessivement une conclusion logique.
- source_word: ἠρνήσατο
  choice: le nia
  rationale: Le verbe signifie ici « nier ». Le pronom « le » reprend naturellement en français le contenu de la question précédente, bien que l’objet ne soit pas exprimé en grec.
- source_word: Πέτρος
  choice: Pierre
  rationale: Forme française traditionnelle et courante du nom de l’apôtre.
- source_word: καὶ
  choice: et
  rationale: La conjonction coordonne simplement le reniement et l’événement qui suit.
- source_word: εὐθέως
  choice: aussitôt
  rationale: Ce terme exprime l’immédiateté; « aussitôt » convient au registre narratif et reste courant.
- source_word: ἀλέκτωρ
  choice: un coq
  rationale: Désigne le mâle de la poule; « un coq » est l’expression française naturelle.
- source_word: ἐφώνησεν
  choice: chanta
  rationale: Avec « coq » pour sujet, « chanter » est le verbe idiomatique en français pour rendre le cri de l’animal.
