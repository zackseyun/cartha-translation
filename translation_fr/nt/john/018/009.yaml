id: JHN.18.9
reference: John 18:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: fr
  text: 'afin que s’accomplisse la parole qu’il avait dite : « De ceux que tu m’as donnés, je n’en ai perdu aucun. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: afin que
  rationale: Introduit ici le but ou le résultat dans le déroulement voulu du récit; « afin que » conserve clairement cette valeur en français naturel.
- source_word: πληρωθῇ
  choice: s’accomplisse
  rationale: Le passif subjonctif après ἵνα exprime la réalisation de la parole antérieure de Jésus. « S’accomplisse » garde le vocabulaire johannique d’accomplissement sans en faire nécessairement une citation prophétique formelle.
- source_word: ὁ λόγος
  choice: la parole
  rationale: Désigne ici une déclaration précise de Jésus. « La parole » est idiomatique, digne et maintient l’écho johannique sans traiter λόγος comme un titre.
- source_word: ὃν εἶπεν
  choice: qu’il avait dite
  rationale: Le plus-que-parfait marque naturellement en français l’antériorité de cette déclaration. L’accord féminin de « dite » se fait avec « parole ».
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι introduit le contenu de la parole; les deux-points suivis d’une citation directe rendent cette relation clairement en français.
- source_word: Οὓς δέδωκάς μοι
  choice: De ceux que tu m’as donnés
  rationale: La tournure partitive anticipe ἐξ αὐτῶν et conserve le parfait grec par le passé composé, qui présente le don comme acquis avec un effet durable.
- source_word: ἀπώλεσα
  choice: je n’en ai perdu
  rationale: Dans ce contexte de protection des disciples, « perdre » convient mieux que « détruire » et maintient le lien verbal et théologique avec Jean 17.12.
- source_word: ἐξ αὐτῶν οὐδένα
  choice: aucun
  rationale: Avec le pronom partitif « en », « aucun » rend de façon naturelle et appuyée « pas un seul d’entre eux » sans répétition lourde.
theological_decisions:
- issue: Nature du langage d’accomplissement
  choice: Présenter la parole antérieure de Jésus comme s’accomplissant
  alternative: Traduire plus librement par « devienne réalité » ou « se réalise »
  rationale: Jean emploie le langage de l’accomplissement aussi pour les propres paroles de Jésus. « S’accomplisse » en conserve le poids narratif et théologique sans qualifier explicitement la parole de prophétie scripturaire.
- issue: Sens de ἀπώλεσα concernant les disciples
  choice: « je n’en ai perdu aucun », au sens de préserver ceux qui ont été confiés à Jésus
  alternative: « je n’en ai laissé périr aucun » ou « je n’en ai détruit aucun »
  rationale: Le contexte immédiat concerne la protection des disciples lors de l’arrestation et fait écho à Jean 17.12. « Perdu » préserve la formulation johannique et sa tension théologique sans imposer un système doctrinal particulier.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase conserve la structure d’accomplissement, la citation directe et la force partitive du grec sans ajouter d’explication confessionnelle.
