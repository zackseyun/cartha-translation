  source_fidelity: 'Le texte rend fidèlement la structure grecque : ἵνα avec « afin que », le subjonctif passif « s’accomplisse », λόγος comme « parole », et la citation introduite par les deux-points. « De ceux que tu m’as donnés, je n’en ai perdu aucun » restitue naturellement le parfait δέδωκάς et la négation partitive emphatique ἐξ αὐτῶν οὐδένα.'
  naturalness: Le français est moderne, fluide et d’un registre biblique sobre. Le plus-que-parfait « qu’il avait dite » est naturel pour situer la parole antérieurement à la scène racontée. La construction avec « en » évite une répétition pesante tout en conservant la valeur partitive.
  terminology: « Parole » et « s’accomplisse » sont appropriés au style johannique sans transformer la déclaration de Jésus en citation scripturaire. « Je n’en ai perdu aucun » conserve le sens contextuel de protection sans imposer une interprétation doctrinale.
