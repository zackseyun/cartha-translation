  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: fr
  text: Après avoir dit cela, Jésus sortit avec ses disciples et passa de l’autre côté du torrent du Cédron[a]. Il y avait là un jardin, dans lequel il entra avec ses disciples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «du ravin du Cédron». Le terme grec désigne un cours d’eau qui peut être saisonnier.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: Après avoir dit cela
  rationale: Le participe aoriste exprime ici une action antérieure. Cette formulation française naturelle conserve l’enchaînement du récit; «cela» reprend idiomatiquement les paroles précédentes.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Le verbe désigne concrètement le fait de sortir et ne doit pas être affaibli en simple départ.
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: avec ses disciples
  rationale: La préposition σύν avec le datif marque simplement l’accompagnement.
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: passa de l’autre côté du torrent du Cédron[a]
  rationale: πέραν indique le passage vers l’autre rive ou l’autre côté. «Torrent» rend χείμαρρος, cours d’eau souvent saisonnier, tandis que «Cédron» conserve le nom propre traditionnellement établi en français.
- source_word: ὅπου ἦν κῆπος
  choice: Il y avait là un jardin
  rationale: La phrase indépendante est plus naturelle en français tout en conservant la valeur locative et existentielle du grec.
- source_word: εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: dans lequel il entra avec ses disciples
  rationale: «Dans lequel» conserve le mouvement directionnel exprimé par εἰς; «avec ses disciples» rend naturellement la coordination grecque sans suraccentuer αὐτός.
