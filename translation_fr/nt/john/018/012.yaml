id: JHN.18.12
reference: John 18:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: fr
  text: Alors la cohorte, le commandant et les gardes des Juifs[a] se saisirent de Jésus et le lièrent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ici, « les Juifs » peut désigner plus précisément les dirigeants ou les autorités juives, ou encore les Judéens, selon la manière dont on comprend cette expression chez Jean; elle ne désigne pas nécessairement l’ensemble du peuple juif.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: Alors
  rationale: Marque la suite logique et narrative de la scène précédente, dans un français naturel.
- source_word: σπεῖρα
  choice: la cohorte
  rationale: Conserve le sens militaire précis du terme sans ajouter explicitement « romaine », précision probable dans le contexte mais absente du nom grec lui-même.
- source_word: χιλίαρχος
  choice: le commandant
  rationale: Rend clairement la fonction de l’officier à la tête de la cohorte. « Tribun » serait plus précis historiquement, mais moins immédiatement compréhensible.
- source_word: ὑπηρέται
  choice: les gardes
  rationale: Dans ce contexte d’arrestation, le terme désigne des agents officiels plutôt que des serviteurs domestiques. « Gardes » exprime leur rôle sans imposer la précision interprétative « police du Temple ».
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Rend formellement le génitif grec et maintient l’ambiguïté de l’usage johannique; une note prévient qu’il peut s’agir plus précisément des autorités juives ou des Judéens.
- source_word: συνέλαβον
  choice: se saisirent de
  rationale: Conserve l’idée de prise physique et de mise sous contrôle, sans réduire le verbe au seul sens juridique d’« arrêter ».
- source_word: ἔδησαν
  choice: ligotèrent
  rationale: Exprime directement le fait d’attacher quelqu’un pour l’immobiliser et convient à la scène d’arrestation.
theological_decisions:
- issue: Référent et portée de τῶν Ἰουδαίων dans l’Évangile selon Jean
  choice: « des Juifs » dans le texte principal
  alternative: « des dirigeants juifs », « des autorités juives » ou « des Judéens »
  rationale: Le texte principal préserve la formulation grecque sans trancher le débat sur sa portée dans Jean. La note empêche toutefois de comprendre automatiquement l’expression comme visant l’ensemble du peuple juif.
translation_notes:
  register: Français international moderne, narratif et digne. Le vocabulaire militaire reste précis mais accessible; la formulation évite d’ajouter des précisions historiques ou institutionnelles qui ne sont pas explicites dans le grec.
