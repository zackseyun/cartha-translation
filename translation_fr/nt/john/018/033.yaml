id: JHN.18.33
reference: John 18:33
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: fr
  text: 'Pilate rentra donc dans la résidence officielle du gouverneur[a], appela Jésus et lui dit : « Est-ce toi, le roi des Juifs[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le prétoire », résidence officielle ou quartier général du gouverneur romain.
    reason: lexical_alternative
  - marker: b
    text: Ou « des Judéens ». Le terme grec peut désigner les Juifs en général ou, dans certains contextes, les habitants de la Judée.
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν … πάλιν
  choice: rentra
  rationale: Le verbe de mouvement associé à πάλιν indique que Pilate entre de nouveau dans le lieu. « Rentra » exprime naturellement cette réentrée en français.
- source_word: οὖν
  choice: donc
  rationale: « Donc » conserve la fonction de liaison et de progression narrative du grec sans alourdir la phrase.
- source_word: πραιτώριον
  choice: palais du gouverneur
  rationale: Dans ce contexte, le terme désigne la résidence officielle ou le quartier général du gouverneur romain. « Palais du gouverneur » est clair, naturel et adapté à la scène, tandis qu’une note conserve le terme traditionnel « prétoire ».
- source_word: ἐφώνησεν
  choice: appela
  rationale: Le verbe signifie ici appeler quelqu’un, éventuellement le faire venir. « Appela » reste proche du grec sans renforcer inutilement le sens comme pourrait le faire « convoqua ».
- source_word: εἶπεν αὐτῷ
  choice: lui dit
  rationale: Cette formulation rend directement le verbe λέγω plutôt que de le préciser par « lui demanda »; la forme interrogative de la citation suffit à signaler la question.
- source_word: Σὺ εἶ
  choice: Est-ce toi
  rationale: Le pronom grec explicite σύ porte une certaine insistance. « Est-ce toi » la rend plus nettement que le simple « Es-tu », tout en restant naturel.
- source_word: ὁ βασιλεὺς
  choice: le roi
  rationale: L’article grec est conservé, et le groupe désigne l’identité ou le titre sur lequel Pilate interroge Jésus. La minuscule suit l’usage typographique français courant.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Dans l’accusation politique portée devant Pilate, « roi des Juifs » est la formulation historiquement et contextuellement la plus naturelle. Le sens possible « Judéens » est signalé en note.
theological_decisions:
- issue: Sens de Ἰουδαίων dans le titre royal
  choice: Juifs
  alternative: Judéens
  rationale: La scène rapporte l’intitulé politique de l’accusation examinée par le gouverneur romain; « roi des Juifs » convient donc le mieux. Comme Ἰουδαῖοι peut parfois désigner plus particulièrement les habitants de la Judée, cette possibilité est préservée en note sans être imposée au texte.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe narrative reste fluide; « Est-ce toi » préserve l’emphase du pronom grec, et les notes rendent accessibles les deux principales ambiguïtés lexicales.
