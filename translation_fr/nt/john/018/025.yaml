  variant: modern international French
source:
  edition: SBLGNT
  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: fr
  text: 'Simon Pierre se tenait debout et se réchauffait. Ils lui dirent donc[a] : « Toi aussi, tu n’es pas l’un de ses disciples ? » Il le nia et dit : « Je n’en suis pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils lui dirent donc : “Tu n’es tout de même pas, toi aussi, l’un de ses disciples ?” » En grec, la forme de la question laisse attendre une réponse négative.'
    reason: Préciser la nuance pragmatique de la question introduite par μή, qui n’est pas entièrement reproductible sans alourdir le texte principal.
lexical_decisions:
- source_word: Ἦν δὲ Σίμων Πέτρος ἑστὼς
  choice: Simon Pierre se tenait debout
  rationale: Le tour périphrastique décrit la posture continue de Pierre. Le léger lien narratif marqué par δέ n’exige pas ici un connecteur français explicite.
- source_word: θερμαινόμενος
  choice: se réchauffait
  rationale: Le pronominal français rend naturellement l’action de Pierre qui cherche à se réchauffer, sans ajouter « près du feu », absent de ce verset.
- source_word: εἶπον οὖν αὐτῷ
  choice: Ils lui dirent donc
  rationale: Le pluriel indéfini du contexte est conservé par « ils », et « donc » rend la progression ou la conséquence narrative signalée par οὖν.
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: Toi aussi, tu n’es pas… ?
  rationale: La question négative française conserve καὶ σὺ (« toi aussi ») et suggère, comme μή en grec, que les interlocuteurs s’attendent à une réponse négative.
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: l’un de ses disciples
  rationale: Cette formulation française exprime naturellement l’appartenance au groupe indiquée par ἐκ suivi du génitif.
- source_word: ἠρνήσατο ἐκεῖνος
  choice: Il le nia
  rationale: « Le » reprend le fait évoqué dans la question. Le pronom simple reste naturel tout en évitant d’élargir le déni au-delà de l’énoncé immédiat.
- source_word: Οὐκ εἰμί
  choice: Je n’en suis pas
  rationale: Cette réponse concise reprend idiomatiquement en français l’appartenance au groupe des disciples, implicite dans l’ellipse grecque.
theological_decisions:
- issue: Portée du reniement de Pierre
  choice: Présenter sa réponse comme le démenti direct de son appartenance au groupe des disciples de Jésus.
  alternative: Développer la réponse en « Je ne suis pas son disciple » ou en faire un reniement doctrinal plus général.
  rationale: Le grec répond brièvement et elliptiquement à la question posée. La traduction garde cette concision et n’élargit pas la portée théologique du déni.
translation_notes:
  register: Français international moderne, courant et digne. La syntaxe narrative reste simple; le tutoiement correspond au singulier σὺ et convient à l’interpellation directe. La réponse « Je n’en suis pas » conserve la brièveté du grec.
