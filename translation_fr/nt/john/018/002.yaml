id: JHN.18.2
reference: John 18:2
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: fr
  text: Judas, qui le trahissait[a], connaissait lui aussi l’endroit, car Jésus s’y était souvent réuni[b] avec ses disciples.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui le livrait ».
    reason: lexical_alternative
  - marker: b
    text: Ou « y avait souvent rencontré ses disciples ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: connaissait
  rationale: Le verbe exprime ici la connaissance familière d’un lieu. « Connaissait » est plus naturel en français que « savait » avec « l’endroit ».
- source_word: δὲ καὶ
  choice: lui aussi
  rationale: Le léger enchaînement marqué par δέ peut rester implicite en français, tandis que « lui aussi » rend clairement la valeur additive de καί.
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: qui le trahissait
  rationale: Dans le récit de la Passion, le participe présent désigne l’action de Judas et son rôle narratif. « Trahissait » en exprime naturellement la portée contextuelle; « livrait » demeure une possibilité plus littérale signalée en note.
- source_word: τὸν τόπον
  choice: l’endroit
  rationale: L’article renvoie au lieu précis mentionné dans le contexte. « L’endroit » est idiomatique et évite d’ajouter la valeur démonstrative de « cet endroit ».
- source_word: ὅτι
  choice: car
  rationale: La conjonction introduit la raison pour laquelle Judas connaissait l’endroit. « Car » conserve clairement ce rapport causal dans un registre narratif digne.
- source_word: πολλάκις
  choice: souvent
  rationale: « Souvent » rend directement l’idée d’occurrences répétées.
- source_word: συνήχθη
  choice: s’y était souvent réuni
  rationale: Le passif grec peut avoir ici un sens intransitif de rassemblement. La tournure pronominale française est naturelle, et le plus-que-parfait présente ces réunions répétées comme antérieures à la scène.
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: avec ses disciples
  rationale: Cette formulation rend directement l’association exprimée par μετά et conserve le terme établi « disciples ».
theological_decisions:
- issue: Portée de παραδιδοὺς appliqué à Judas
  choice: qui le trahissait
  alternative: qui le livrait
  rationale: Le contexte donne à l’acte une portée de trahison, que le texte principal communique naturellement. La note conserve toutefois le sens plus concret et lexicalement direct de la remise de Jésus à ses adversaires.
- issue: Valeur de συνήχθη
  choice: Jésus s’y était souvent réuni avec ses disciples
  alternative: Jésus y avait souvent rencontré ses disciples
  rationale: La tournure retenue conserve l’idée de rassemblement sans imposer un agent extérieur au passif grec. L’alternative « rencontré » est possible, mais exprime moins nettement le rassemblement du groupe.
translation_notes:
  register: Français international moderne, fluide et digne. La syntaxe reste simple; « lui aussi » porte l’addition de καί, et le léger δέ narratif n’est pas surtraduit par un connecteur artificiel.
