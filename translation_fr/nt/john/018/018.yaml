  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: fr
  text: Les esclaves[a] et les gardes[b] se tenaient debout, après avoir préparé un feu de charbon de bois, car il faisait froid, et ils se réchauffaient. Pierre aussi se tenait debout avec eux et se réchauffait.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs » ; le terme grec peut désigner des personnes en condition d’esclavage ou, plus largement, des serviteurs.
    reason: lexical_alternative
  - marker: b
    text: Ou « agents » ; le terme désigne des auxiliaires officiels, probablement liés au Temple ou à l’entourage du grand-prêtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: esclaves
  rationale: Le terme désigne ici vraisemblablement du personnel domestique de condition servile; « esclaves » préserve ce statut social plutôt que de l’atténuer.
- source_word: ὑπηρέται
  choice: gardes
  rationale: Dans ce contexte johannique, il s’agit d’agents officiels liés aux autorités religieuses, probablement chargés aussi de fonctions coercitives; « gardes » est naturel en français, sans les confondre avec les esclaves.
- source_word: ἀνθρακιὰν
  choice: un feu de braises
  rationale: Le nom désigne un feu de charbon de bois. « Feu de braises » est idiomatique et conserve le détail concret important dans le récit johannique.
- source_word: πεποιηκότες
  choice: qu’ils avaient allumé
  rationale: Le participe parfait présente une action accomplie dont le résultat demeure; la relative au plus-que-parfait restitue naturellement cette relation en français.
- source_word: ὅτι ψῦχος ἦν
  choice: car il faisait froid
  rationale: La proposition donne la raison d’avoir allumé le feu; « car » conserve clairement sa valeur causale.
- source_word: ἐθερμαίνοντο
  choice: ils se réchauffaient
  rationale: L’imparfait et la forme moyenne expriment une action continue et réflexive.
- source_word: ἑστὼς / εἱστήκεισαν
  choice: se tenait / se tenaient
  rationale: Cette formulation rend la posture debout sans la lourdeur de « étaient debout » et permet de préserver le parallélisme entre le groupe et Pierre.
- source_word: καὶ ὁ Πέτρος μετ’ αὐτῶν
  choice: Pierre aussi se tenait avec eux
  rationale: « Aussi » conserve la valeur additive de καί, et « avec eux » souligne que Pierre se trouve au milieu du groupe.
- source_word: θερμαινόμενος
  choice: se réchauffait
  rationale: Le participe présent décrit l’action en cours de Pierre, parallèle à celle du groupe.
- source_word: δέ
  choice: non rendu explicitement
  rationale: La particule assure ici une transition légère. En français, l’enchaînement des phrases suffit et évite d’introduire un contraste ou une indication temporelle absents du grec.
