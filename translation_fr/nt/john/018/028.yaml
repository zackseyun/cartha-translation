id: JHN.18.28
reference: John 18:28
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: fr
  text: Ils conduisirent donc Jésus de chez Caïphe à la résidence du gouverneur[a]. C’était tôt le matin. Eux-mêmes n’entrèrent pas dans la résidence du gouverneur, afin de ne pas être souillés[b], mais de pouvoir manger la Pâque[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « au prétoire », résidence officielle et siège judiciaire du gouverneur romain.
    reason: lexical_alternative
  - marker: b
    text: Il s’agit ici de devenir rituellement impur.
    reason: cultural_note
  - marker: c
    text: « Manger la Pâque » peut désigner précisément le repas pascal ou, plus largement, les repas et observances de la fête de la Pâque.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγουσιν
  choice: ils conduisirent
  rationale: Le présent historique grec est rendu par le passé simple, naturel dans une narration française écrite. « Conduisirent » convient au transfert de Jésus sous garde.
- source_word: οὖν
  choice: donc
  rationale: Le terme marque ici la continuation logique du récit; « donc » en conserve la valeur connective.
- source_word: ἀπὸ τοῦ Καϊάφα
  choice: de chez Caïphe
  rationale: La préposition avec le nom de personne désigne naturellement le lieu où se trouvait Caïphe, probablement sa résidence; « de chez Caïphe » reste idiomatique sans préciser davantage le bâtiment.
- source_word: πραιτώριον
  choice: siège du gouverneur
  rationale: Le mot désigne ici la résidence officielle et le centre judiciaire du gouverneur romain. Cette traduction communique la fonction du lieu, tandis qu’une note conserve le terme traditionnel.
- source_word: πρωΐ
  choice: tôt le matin
  rationale: L’adverbe désigne le début de la matinée sans imposer l’heure plus précise qu’évoquerait « à l’aube ».
- source_word: αὐτοὶ
  choice: eux-mêmes
  rationale: La forme emphatique souligne que ceux qui livraient Jésus refusèrent personnellement d’entrer.
- source_word: μιανθῶσιν
  choice: se rendre impurs
  rationale: Le verbe exprime ici une souillure rituelle. « Se rendre impurs » est clair en français actuel et la note explicite le sens cérémoniel.
- source_word: φάγωσιν τὸ πάσχα
  choice: pouvoir manger la Pâque
  rationale: Cette formulation conserve l’expression grecque et sa possible amplitude de sens sans trancher la question chronologique.
theological_decisions:
- issue: Sens de « manger la Pâque » dans la chronologie johannique
  choice: Conserver l’expression « manger la Pâque » sans préciser son référent exact.
  alternative: « manger le repas de la Pâque » ou « prendre les repas et offrandes de la fête »
  rationale: Le grec peut être compris comme visant précisément le repas pascal ou, plus largement, des repas et observances de la période pascale. Le texte principal préserve cette ambiguïté théologiquement sensible au lieu de résoudre une question d’harmonisation.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme marqué. La répétition de « siège du gouverneur » reflète celle de πραιτώριον et maintient la cohésion du verset.
