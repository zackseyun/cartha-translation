id: JHN.18.26
reference: John 18:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: fr
  text: 'L’un des esclaves du grand prêtre[a], qui était un parent de l’homme à qui Pierre avait coupé l’oreille, dit : « Ne t’ai-je pas vu dans le jardin avec lui ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le mot grec peut désigner des serviteurs ou des esclaves selon le contexte ; ici, « esclaves » souligne leur statut d’asservissement au sein de la maison du grand prêtre.
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλων
  choice: esclaves
  rationale: Dans ce contexte domestique non métaphorique, δοῦλος désigne des personnes placées sous l’autorité et la possession du grand prêtre. « Esclaves » préserve ce statut social, tandis que « serviteurs » pourrait l’atténuer.
- source_word: ἀρχιερέως
  choice: grand prêtre
  rationale: C’est le terme français courant pour la fonction sacerdotale suprême dans le récit johannique de la Passion.
- source_word: συγγενὴς ὢν
  choice: qui était un parent
  rationale: Cette formulation naturelle rend explicitement la tournure participiale et indique le lien familial sans employer un terme vieilli.
- source_word: οὗ
  choice: de l’homme à qui
  rationale: Le pronom relatif grec renvoie à l’homme auquel appartenait l’oreille. Le français explicite naturellement ce référent.
- source_word: ἀπέκοψεν
  choice: avait coupé
  rationale: Le plus-que-parfait situe clairement l’action de Pierre avant la prise de parole rapportée.
- source_word: ὠτίον
  choice: oreille
  rationale: Rendu direct et idiomatique ; la nuance diminutive éventuelle n’est pas naturelle à conserver ici en français.
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: Ne t’ai-je pas vu
  rationale: La question négative attend une réponse affirmative et conserve une forme digne et naturelle. La première personne exprime suffisamment l’insistance de ἐγώ dans ce contexte.
- source_word: ἐν τῷ κήπῳ
  choice: dans le jardin
  rationale: « Jardin » est le sens courant de κῆπος et correspond au lieu de l’arrestation de Jésus.
- source_word: μετ’ αὐτοῦ
  choice: avec lui
  rationale: Rendu direct ; dans le contexte, le pronom renvoie à Jésus.
theological_decisions:
- issue: Rendu de δοῦλος dans un contexte domestique non métaphorique
  choice: esclaves
  alternative: serviteurs
  rationale: Le texte désigne ici des membres asservis de la maison du grand prêtre, et non de simples assistants. « Esclaves » évite d’adoucir la réalité sociale exprimée par le terme grec, tout en signalant l’autre possibilité en note.
translation_notes:
  register: Français international moderne, clair et digne. La formulation maintient la question rhétorique et le lien familial, tout en évitant un vocabulaire archaïque. Le passé simple « dit » convient au registre narratif biblique sans être difficile à comprendre.
