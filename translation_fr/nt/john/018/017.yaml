source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: fr
  text: 'La jeune servante[a] qui était chargée de la porte dit donc à Pierre : « Toi aussi, tu n’es pas l’un des disciples de cet homme, n’est-ce pas ? » Il dit : « Je ne le suis pas. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « la jeune esclave qui était portière ».'
    reason: Alternative lexicale pour παιδίσκη (« jeune esclave ») et θυρωρός (« portière »).
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la progression et le lien narratifs; « donc » conserve naturellement la valeur connective du grec.
- source_word: παιδίσκη
  choice: jeune servante
  rationale: Le terme désigne ici une jeune femme au service de la maison; cette formulation rend l’âge et la fonction sans trancher inutilement la question de son statut juridique.
- source_word: θυρωρός
  choice: qui gardait la porte
  rationale: La proposition relative exprime clairement et naturellement sa fonction à l’entrée.
- source_word: Μὴ καὶ σὺ
  choice: Toi aussi, tu n’es pas… n’est-ce pas ?
  rationale: Cette tournure rend la question introduite par μή, qui appelle normalement une réponse négative, tout en mettant en relief καὶ σὺ, « toi aussi ».
- source_word: ἐκ τῶν μαθητῶν
  choice: l’un des disciples
  rationale: Formulation française idiomatique qui préserve le sens partitif de ἐκ.
- source_word: τοῦ ἀνθρώπου τούτου
  choice: de cet homme
  rationale: Rend littéralement et naturellement l’expression, avec sa tonalité quelque peu distante, sans faire de ἄνθρωπος un titre.
- source_word: ἐκεῖνος
  choice: Il
  rationale: Dans le contexte, le pronom renvoie sans ambiguïté à Pierre; « il » est la forme française naturelle.
- source_word: Οὐκ εἰμί
  choice: Je ne le suis pas
  rationale: Réponse brève qui conserve l’ellipse du grec tout en étant idiomatique en français.
theological_decisions:
- issue: Valeur de la question négative introduite par μή
  choice: 'Question formulée comme appelant une réponse négative : « tu n’es pas… n’est-ce pas ? »'
  alternative: 'Question plus neutre : « Es-tu, toi aussi… ? »'
  rationale: Le choix préserve l’orientation pragmatique de la question grecque sans exagérer le ton ni ajouter une interprétation doctrinale.
- issue: Nuance de statut social dans παιδίσκη
  choice: « jeune servante » dans le texte principal
  alternative: « jeune esclave »
  rationale: Le mot peut désigner une servante ou une esclave. Ici, le récit met surtout en avant son âge, son sexe et sa fonction; une note conserve l’autre possibilité sans résoudre abusivement l’ambiguïté sociale.
translation_notes:
  register: Français international moderne, naturel et digne. La question conserve son attente d’une réponse négative, et la réplique de Pierre demeure concise.
