  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: fr
  text: 'Après qu’il eut dit cela, l’un des gardes qui se tenait là frappa Jésus[a] et dit : « C’est ainsi que tu réponds au grand-prêtre ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « donna une gifle à Jésus » ; le terme grec désigne un coup porté de la main, qui peut être une gifle ou un coup semblable.
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ εἰπόντος
  choice: Après qu’il eut dit cela
  rationale: Le génitif absolu exprime une action antérieure. « Cela » reprend naturellement en français l’ensemble des paroles précédentes, malgré le pluriel grec ταῦτα.
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: l’un des gardes qui se tenaient là
  rationale: Dans ce contexte judiciaire, ὑπηρέται désigne vraisemblablement le personnel officiel au service des autorités religieuses. « Gardes » est naturel et évite de suggérer des domestiques; le participe précise leur présence sur place.
- source_word: ἔδωκεν ῥάπισμα τῷ Ἰησοῦ
  choice: frappa Jésus
  rationale: L’expression désigne un coup porté, probablement de la main, sans permettre de déterminer avec certitude s’il s’agissait précisément d’une gifle. « Frappa » conserve cette latitude.
- source_word: εἰπών
  choice: et dit
  rationale: La coordination est plus naturelle en français narratif que le participe « en disant », tout en conservant la succession immédiate.
- source_word: Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
  choice: C’est ainsi que tu réponds au grand-prêtre ?
  rationale: La formulation restitue la question de reproche portant sur la manière dont Jésus répond. « Grand-prêtre » est l’équivalent français usuel de ἀρχιερεύς.
theological_decisions:
- issue: Identification des ὑπηρέται
  choice: des gardes appartenant au personnel officiel
  alternative: des serviteurs ou des assistants
  rationale: Le contexte de l’interrogatoire auprès du grand-prêtre favorise des agents officiels, sans qu’il soit nécessaire de préciser davantage leur statut institutionnel.
- issue: Nature exacte du ῥάπισμα
  choice: un coup, rendu par « frappa »
  alternative: une gifle
  rationale: Le terme peut désigner une gifle ou un coup semblable porté de la main. La traduction ne tranche pas ce que le grec laisse ouvert.
translation_notes:
  register: Français international moderne, sobre et digne. Le passé antérieur s’accorde au registre narratif biblique sans être archaïque; le dialogue reste direct et naturel.
