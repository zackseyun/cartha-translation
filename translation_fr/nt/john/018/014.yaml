id: JHN.18.14
reference: John 18:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: fr
  text: Caïphe était celui qui avait conseillé aux Juifs[a] qu’il valait mieux qu’un seul homme meure pour le peuple[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou «aux chefs juifs» ou «aux Judéens», selon la manière dont on comprend ici l’expression employée par Jean.
    reason: alternative_reading
  - marker: b
    text: Ou «en faveur du peuple»; dans ce contexte, l’expression peut aussi avoir une portée représentative ou sacrificielle.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: était
  rationale: δέ est ici un léger lien narratif ou de reprise; le français n’a pas besoin d’un connecteur explicite, et l’imparfait rend naturellement ἦν.
- source_word: Καϊάφας
  choice: Caïphe
  rationale: Forme française traditionnelle et courante du nom propre.
- source_word: ὁ συμβουλεύσας
  choice: celui qui avait conseillé
  rationale: Le participe aoriste substantivé identifie Caïphe par un conseil donné antérieurement; le plus-que-parfait exprime cette antériorité.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: Le texte grec ne précise ni «dirigeants» ni «Judéens»; la traduction principale conserve donc l’expression formelle, avec une note sur ses référents contextuels possibles dans Jean.
- source_word: ὅτι συμφέρει
  choice: qu’il valait mieux
  rationale: Formulation française idiomatique exprimant l’avantage ou l’intérêt visé par συμφέρει dans ce contexte délibératif.
- source_word: ἕνα ἄνθρωπον
  choice: un seul homme
  rationale: Rend explicitement le numéral ἕνα et le référent masculin, tout en produisant une phrase française naturelle.
- source_word: ἀποθανεῖν
  choice: meure
  rationale: Après «il valait mieux que», le subjonctif est la construction française naturelle correspondant à l’infinitif grec.
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: pour le peuple
  rationale: Traduction concise qui conserve la portée bénéfactive ou représentative de ὑπέρ sans imposer dans le corps du texte une interprétation sacrificielle ou substitutive plus précise.
- source_word: λαοῦ
  choice: le peuple
  rationale: λαός signifie ici «peuple»; il ne faut pas le confondre avec ἔθνος, «nation», présent dans le contexte de Jean 11.50.
theological_decisions:
- issue: Portée potentiellement représentative ou substitutive de ὑπὲρ τοῦ λαοῦ
  choice: pour le peuple
  alternative: en faveur du peuple; à la place du peuple
  rationale: ὑπέρ peut exprimer le bénéfice ou la représentation et recevoir, dans le récit johannique, des résonances sacrificielles ou substitutives. La formulation principale préserve cette tension sans expliciter une doctrine au-delà de ce que dit le verset.
- issue: Référent de τοῖς Ἰουδαίοις dans l’usage johannique
  choice: aux Juifs
  alternative: aux chefs juifs; aux Judéens
  rationale: Le grec emploie Ἰουδαίοις sans qualification. Comme le référent exact varie selon le contexte dans Jean, la traduction formelle est maintenue et les possibilités interprétatives sont signalées en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe conserve l’identification emphatique de Caïphe comme «celui qui avait conseillé», tandis que les notes préservent les ambiguïtés lexicale et théologique réelles.
