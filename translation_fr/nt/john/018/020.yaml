  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: fr
  text: 'Jésus lui répondit : « J’ai parlé ouvertement au monde. J’ai toujours enseigné dans les synagogues et dans le Temple[a], là où tous les Juifs[b] se réunissent, et je n’ai rien dit en secret. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’enceinte du Temple ». Le mot grec désigne l’ensemble du complexe du Temple, et non seulement le sanctuaire intérieur.
    reason: lexical_alternative
  - marker: b
    text: Ou « tout le peuple juif » ou « tous les Judéens ». Dans l’Évangile selon Jean, le terme grec traduit par « Juifs » peut avoir des sens différents selon le contexte.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: ouvertement
  rationale: Dans ce contexte, le terme s’oppose à ἐν κρυπτῷ (« en secret »). « Ouvertement » exprime donc une parole publique et sans dissimulation, sans accentuer indûment l’idée de hardiesse.
- source_word: λελάληκα
  choice: j’ai parlé
  rationale: Le passé composé rend naturellement en français la valeur résultative du parfait grec et la pertinence présente des paroles publiques antérieures de Jésus.
- source_word: τῷ κόσμῳ
  choice: au monde
  rationale: Cette formulation conserve le vocabulaire caractéristique de Jean et sa possible ampleur théologique, tout en désignant ici la sphère publique.
- source_word: πάντοτε
  choice: toujours
  rationale: « Toujours » rend directement l’adverbe temporel et souligne le caractère habituellement public de l’enseignement de Jésus.
- source_word: ἐδίδαξα
  choice: j’ai enseigné
  rationale: Le passé composé est idiomatique en français dans cette rétrospective et rend convenablement l’aoriste grec.
- source_word: ἐν συναγωγῇ
  choice: dans les synagogues
  rationale: Le singulier grec a ici une valeur générique. Le pluriel français désigne naturellement les lieux où Jésus enseignait, sans laisser entendre qu’il ne s’agissait que d’une synagogue précise.
- source_word: ἐν τῷ ἱερῷ
  choice: dans le Temple
  rationale: ἱερόν désigne l’ensemble du complexe du Temple, et non spécifiquement le sanctuaire intérieur. « Temple » est la formulation française concise et usuelle; une note en précise l’étendue.
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: tous les Juifs
  rationale: La formulation directe conserve le référent ethnoreligieux qui convient au contexte de rassemblement dans les synagogues et le Temple. Une note signale la possibilité contextuelle de traduire « Judéens ».
- source_word: συνέρχονται
  choice: se réunissent
  rationale: Cette expression française naturelle rend l’idée de venir ensemble ou de s’assembler.
- source_word: ἐν κρυπτῷ
  choice: en secret
  rationale: La locution maintient l’opposition explicite avec « ouvertement ».
- source_word: ἐλάλησα οὐδέν
  choice: je n’ai rien dit
  rationale: Cette tournure idiomatique conserve la négation absolue du grec.
- source_word: ἀπεκρίθη αὐτῷ
  choice: lui répondit
  rationale: Formulation narrative française concise et naturelle, fidèle à la construction grecque.
theological_decisions:
- issue: Référent de Ἰουδαῖοι dans Jean
  choice: « les Juifs » dans le texte principal, compris ici comme une référence générale au peuple juif dans ses lieux publics de rassemblement
  alternative: « les Judéens »
  rationale: Chez Jean, Ἰουδαῖοι peut désigner, selon le contexte, les Judéens, certaines autorités juives ou le peuple juif plus largement. La mention des synagogues et du Temple favorise ici le sens communautaire général, sans limiter arbitrairement le référent aux autorités ni effacer l’ambiguïté lexicale.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conserve le contraste rhétorique entre « ouvertement » et « en secret ». Le pluriel « les synagogues » explicite naturellement la valeur générique du singulier grec. La majuscule à « Temple » distingue ici le Temple de Jérusalem comme lieu déterminé.
