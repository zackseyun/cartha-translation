  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: fr
  text: 'Jésus lui répondit : « Si j’ai mal parlé, témoigne de ce qui est mal ; mais si j’ai bien parlé, pourquoi me frappes-tu ? »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: Jésus lui répondit
  rationale: Tour narratif naturel en français, qui conserve explicitement le destinataire indiqué par le datif αὐτῷ.
- source_word: Εἰ κακῶς ἐλάλησα
  choice: Si j’ai mal parlé
  rationale: Le passé composé convient naturellement au français pour une parole antérieure encore en cause. « Mal » préserve la portée assez large de κακῶς sans préciser s’il s’agit d’une erreur factuelle, morale ou juridique.
- source_word: μαρτύρησον
  choice: témoigne
  rationale: L’impératif « témoigne » maintient la nuance judiciaire du verbe dans cette scène d’interrogatoire.
- source_word: περὶ τοῦ κακοῦ
  choice: de ce qui était mal
  rationale: Cette formulation française rend le substantif grec sans imposer « le mal » au sens théologique ni ajouter l’idée précise d’une infraction.
- source_word: εἰ δὲ καλῶς
  choice: mais si j’ai bien parlé
  rationale: 'La reprise explicite de « parlé » est naturelle en français et met en relief l’antithèse κακῶς/καλῶς : « mal parlé/bien parlé ».'
- source_word: τί με δέρεις
  choice: pourquoi me frappes-tu ?
  rationale: « Frapper » rend la portée générale de δέρω sans préciser indûment qu’il s’agit d’une gifle ou de coups répétés.
theological_decisions:
- issue: Nature de la réponse de Jésus à la violence subie
  choice: Une contestation juridico-morale fondée sur l’exigence d’un témoignage
  alternative: Une paraphrase accentuant soit la dénonciation de l’injustice, soit la douceur de la réponse
  rationale: Le texte oppose une accusation qui devrait être établie par témoignage à un coup dépourvu de justification. La traduction conserve cette logique sans y ajouter de commentaire doctrinal.
translation_notes:
  register: Français international moderne, sobre et digne. Le tutoiement correspond au singulier grec et au caractère direct de l’échange. La structure conditionnelle parallèle est conservée.
