source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: fr
  text: 'Jésus dit donc à Pierre : « Remets l’épée dans son fourreau[a]. La coupe[b] que le Père m’a donnée, ne la boirai-je pas ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans son étui » ou « dans sa gaine ».'
    reason: lexical_alternative
  - marker: b
    text: Dans la Bible, la « coupe » peut représenter la souffrance ou le destin fixé par Dieu. Comparer avec la prière de Jésus à Gethsémané en Matthieu 26.39, Marc 14.36 et Luc 22.42.
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la suite et la conséquence narrative sans alourdir la phrase.
- source_word: Βάλε
  choice: Remets
  rationale: Dans ce contexte, l’impératif demande à Pierre de replacer l’arme là où elle était; « remets » rend naturellement cette valeur contextuelle.
- source_word: μάχαιραν
  choice: l’épée
  rationale: Terme français courant et suffisamment large pour désigner l’arme blanche évoquée dans la scène, sans imposer le sens plus étroit de « dague ».
- source_word: θήκην
  choice: son fourreau
  rationale: « Fourreau » est le terme français naturel pour l’étui d’une épée et conserve l’image concrète du grec.
- source_word: ποτήριον
  choice: la coupe
  rationale: Conserve la métaphore biblique au lieu de la réduire explicitement à la souffrance, à la mort ou à la colère divine.
- source_word: δέδωκέν
  choice: m’a donnée
  rationale: Le passé composé exprime un don accompli dont la portée demeure présente; l’accord féminin suit « coupe ».
- source_word: ὁ πατήρ
  choice: le Père
  rationale: Respecte l’article grec et l’usage johannique sans ajouter le possessif « mon », absent du texte.
- source_word: οὐ μὴ πίω αὐτό;
  choice: ne la boirai-je pas ?
  rationale: La question rhétorique attend une réponse affirmative et conserve le pronom qui reprend « la coupe ».
theological_decisions:
- issue: Sens de « la coupe »
  choice: Maintenir la métaphore de la coupe pour la souffrance et le destin confiés par le Père, sans l’expliciter dans le corps du texte.
  alternative: Traduire par « la souffrance qui m’est destinée », « le destin que le Père m’a assigné » ou « la coupe de la colère divine ».
  rationale: Le contexte permet de comprendre une souffrance voulue ou permise par Dieu, mais le verset ne définit pas davantage la métaphore; la conserver évite une précision doctrinale importée.
- issue: Relation de Jésus au Père
  choice: Rendre simplement l’obéissance volontaire de Jésus par « que le Père m’a donnée ».
  alternative: Ajouter « mon Père » ou paraphraser par « que le Père m’a assignée ».
  rationale: Cette formulation suit directement le grec, préserve la dignité de Jésus et n’ajoute aucune explication doctrinale absente du verset.
translation_notes:
  register: Français international moderne, naturel et digne. L’ordre détaché « La coupe… ne la boirai-je pas ? » conserve l’accent du grec sur la coupe ainsi que la force de la question rhétorique.
