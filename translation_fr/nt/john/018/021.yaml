  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: fr
  text: 'Pourquoi m’interroges-tu ? Interroge ceux qui ont entendu ce que je leur ai dit. Regarde : eux, ils savent ce que j’ai dit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: Pourquoi m’interroges-tu ?
  rationale: Dans le cadre de l’audition devant le grand-prêtre, « interroger » rend naturellement la portée officielle de ἐρωτάω et conserve la question directe introduite par τί.
- source_word: ἐρώτησον
  choice: Interroge
  rationale: L’impératif reprend le même verbe que la question précédente. Répéter « interroger » préserve ce parallélisme et convient au contexte judiciaire sans aller jusqu’au sens plus fort d’« examiner ».
- source_word: τοὺς ἀκηκοότας
  choice: ceux qui ont entendu
  rationale: Le participe parfait désigne ceux qui ont entendu et restent en mesure de témoigner de ce qu’ils ont entendu. Le passé composé est naturel en français et conserve cette pertinence présente.
- source_word: τί ἐλάλησα αὐτοῖς
  choice: ce que je leur ai dit
  rationale: « Dire » rend ici λαλέω de manière idiomatique et sans ajouter l’idée plus précise d’un enseignement ou d’une confidence.
- source_word: ἴδε
  choice: Eux,
  rationale: Dans ce contexte, ἴδε attire l’attention sur les personnes qui viennent d’être désignées. Le détachement emphatique « Eux » en restitue naturellement la fonction en français, sans l’artificialité de « Vois » ou « Voici ».
- source_word: οὗτοι οἴδασιν
  choice: eux, ils savent
  rationale: Le démonstratif οὗτοι est emphatique. La dislocation « eux, ils » est naturelle en français oral soutenu et conserve la désignation appuyée des témoins.
- source_word: ἃ εἶπον ἐγώ
  choice: ce que j’ai dit
  rationale: Cette formulation est idiomatique. L’emphase de ἐγώ ressort suffisamment du contraste entre Jésus interrogé et ceux qui savent, sans ajouter l’expression plus lourde « moi-même ».
theological_decisions:
- issue: Tonalité judiciaire de la réponse de Jésus
  choice: Employer « interroger » pour les deux occurrences de ἐρωτάω.
  alternative: Employer « demander » dans les deux occurrences.
  rationale: Le contexte est celui d’une audition officielle devant le grand-prêtre. « Interroger » conserve cette tonalité tout en respectant la répétition grecque, sans transformer la scène en interrogatoire au sens technique moderne.
translation_notes:
  register: Français international moderne, direct et digne. Le tutoiement suit l’adresse grecque au singulier. La répétition de « interroger » et de « ce que j’ai dit » reproduit la structure insistante du verset. La tournure « Eux, ils savent » conserve la force déictique de οὗτοι et la fonction d’appel à l’attention de ἴδε dans un français naturel.
