source:
  edition: SBLGNT
  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: fr
  text: 'Alors, quand il leur dit : « C’est moi[a] », ils reculèrent et tombèrent à terre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus littéralement : « Moi, je suis. » L’expression grecque peut aussi faire écho aux déclarations caractéristiques de Jésus introduites par « Je suis » dans l’Évangile selon Jean.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς οὖν
  choice: Alors, quand
  rationale: Cette formulation naturelle conserve à la fois le lien logique marqué par οὖν et la valeur temporelle de ὡς.
- source_word: εἶπεν αὐτοῖς
  choice: il leur dit
  rationale: Rend directement le verbe λέγω et son complément αὐτοῖς, dans un style narratif français courant.
- source_word: Ἐγώ εἰμι
  choice: C’est moi
  rationale: Dans le contexte immédiat, Jésus répond à ceux qui le cherchent et s’identifie. « C’est moi » exprime naturellement cette fonction en français, tandis que la formulation plus littérale et sa possible résonance johannique sont signalées en note.
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: ils reculèrent
  rationale: Le verbe « reculer » rend clairement et sans lourdeur le mouvement vers l’arrière exprimé par εἰς τὰ ὀπίσω.
- source_word: ἔπεσαν χαμαί
  choice: tombèrent à terre
  rationale: Expression française naturelle qui conserve le sens physique précis de χαμαί.
theological_decisions:
- issue: Traduction de Ἐγώ εἰμι dans un contexte johannique susceptible de porter une résonance théologique
  choice: C’est moi
  alternative: 'Je suis ; plus littéralement : Moi, je suis'
  rationale: Le contexte immédiat favorise une formule d’identification personnelle. Toutefois, la traduction principale ne doit pas effacer la forme grecque ni sa possible résonance avec les déclarations « Je suis » dans l’Évangile selon Jean ; celles-ci sont donc conservées dans la note.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans archaïsme lexical. « Ils reculèrent » est plus naturel en français que la reproduction analytique « ils allèrent en arrière ».
