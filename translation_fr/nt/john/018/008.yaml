  variant: modern international French
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: fr
  text: 'Jésus répondit : « Je vous ai dit que c’est moi.[a] Si donc c’est moi que vous cherchez, laissez ceux-ci partir. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « je suis »; le grec ne fournit aucun attribut. Dans ce contexte, l’expression sert à identifier Jésus, mais sa formulation peut aussi faire écho aux emplois absolus de « je suis » dans l’Évangile selon Jean.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: répondit
  rationale: Rendu narratif courant et digne de ἀποκρίνομαι dans un dialogue.
- source_word: Εἶπον ὑμῖν
  choice: Je vous ai dit
  rationale: Le passé composé rappelle naturellement en français une parole prononcée peu auparavant; le pronom indirect rend explicitement ὑμῖν.
- source_word: ἐγώ εἰμι
  choice: c’est moi
  rationale: Dans ce contexte d’identification, « c’est moi » est la formulation française naturelle. La forme grecque littérale « je suis », susceptible de conserver une résonance johannique, est signalée en note.
- source_word: ἐμὲ ζητεῖτε
  choice: c’est moi que vous cherchez
  rationale: La tournure clivée rend l’emphase portée par ἐμέ et reste idiomatique en français.
- source_word: ἄφετε
  choice: laissez
  rationale: L’impératif signifie ici permettre le départ, sans imposer l’idée plus précise d’une libération de détention.
- source_word: τούτους
  choice: ceux-ci
  rationale: Le démonstratif désigne les compagnons présents de Jésus; « ceux-ci » conserve cette référence sans ajouter « hommes », absent du grec.
- source_word: ὑπάγειν
  choice: partir
  rationale: Après « laissez », « partir » exprime naturellement le départ permis; « aller » serait moins idiomatique dans cette construction.
theological_decisions:
- issue: Rendu de ἐγώ εἰμι dans le contexte johannique
  choice: c’est moi
  alternative: je suis
  rationale: Le contexte immédiat appelle une identification personnelle, que le français exprime naturellement par « c’est moi ». La note préserve toutefois la formulation littérale et sa possible résonance théologique, sans la trancher.
translation_notes:
  register: Français international moderne, naturel et digne. La construction « c’est moi que vous cherchez » conserve l’emphase grecque. « Ceux-ci » évite d’ajouter un nom absent du texte source.
