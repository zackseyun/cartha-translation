id: JHN.18.3
reference: John 18:3
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: fr
  text: Judas, ayant pris la cohorte[a] ainsi que des agents[b] des chefs des prêtres et des pharisiens, arrive là avec des lanternes, des torches et des armes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le détachement » ou « la troupe de soldats ». Le terme grec peut désigner une unité militaire sans impliquer que toute la cohorte était présente.
    reason: lexical_alternative
  - marker: b
    text: Ou « des gardes » ou « la police du Temple ». Le terme désigne des auxiliaires officiels au service des chefs des prêtres et des pharisiens.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la continuation et le lien logique avec le contexte précédent, sans alourdir le récit.
- source_word: λαβὼν
  choice: prend avec lui
  rationale: Exprime naturellement en français l’idée de s’adjoindre le groupe qui accompagne Judas; la coordination conserve la progression vers le verbe principal.
- source_word: σπεῖραν
  choice: la cohorte
  rationale: Conserve la désignation militaire historique tout en laissant ouverte, grâce à la note, la question de savoir si l’unité entière était présente.
- source_word: ὑπηρέτας
  choice: des gardes
  rationale: Dans ce contexte johannique, le terme désigne des agents officiels des autorités juives; «gardes» est clair sans préciser excessivement leur statut institutionnel.
- source_word: ἀρχιερέων
  choice: les chefs des prêtres
  rationale: Rend le pluriel désignant les principales autorités sacerdotales, sans suggérer plusieurs titulaires simultanés de la fonction de grand prêtre.
- source_word: Φαρισαίων
  choice: les pharisiens
  rationale: Désignation française courante de ce groupe.
- source_word: ἔρχεται
  choice: il arrive
  rationale: Maintient le présent historique de Jean et son effet narratif vivant.
- source_word: ἐκεῖ
  choice: là
  rationale: Reprend simplement le lieu mentionné dans le contexte immédiat.
- source_word: φανῶν
  choice: lanternes
  rationale: Désigne des sources de lumière portatives et maintient la distinction avec λαμπάδων.
- source_word: λαμπάδων
  choice: torches
  rationale: Rend le sens courant du terme et préserve le couple lexical «lanternes, torches».
- source_word: ὅπλων
  choice: armes
  rationale: Terme français général et direct pour des instruments employés par une troupe armée.
theological_decisions:
- issue: Identité et composition du groupe venu arrêter Jésus
  choice: «la cohorte» et «des gardes envoyés par les chefs des prêtres et par les pharisiens»
  alternative: «un détachement de soldats» et «des agents des autorités juives»
  rationale: La formulation conserve les deux composantes distinctes du groupe, militaire et liée aux autorités juives, sans affirmer que la cohorte romaine entière était présente ni préciser au-delà du texte le statut exact des ὑπηρέται.
translation_notes:
  register: Français international moderne, narratif et digne. Le présent historique est conservé. «Chefs des prêtres» évite l’ambiguïté moderne de «grands prêtres», tandis que les notes signalent les principales possibilités lexicales sans résoudre abusivement l’effectif ou le statut précis du groupe.
