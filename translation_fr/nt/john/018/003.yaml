  source_fidelity: La structure grecque distingue l’action antérieure de Judas (λαβών, « ayant pris ») de son arrivée au lieu (ἔρχεται). Le projet transforme cette relation en deux verbes coordonnés et ajoute « envoyés », qui n’est pas exprimé par le texte. La révision rend la participiale et exprime sobrement l’origine des ὑπηρέται.
  naturalness: « Judas, ayant pris ..., arrive là » est un français narratif moderne et fluide, tout en conservant le présent historique. « Agents » est naturel dans ce contexte et moins réducteur que « gardes ».
  terminology: « Cohorte » préserve la spécificité de σπεῖρα sans trancher la question de l’effectif. « Agents » rend ὑπηρέτας de manière suffisamment large; la note conserve les possibilités « gardes » et « police du Temple ». « Chefs des prêtres » et « pharisiens » sont appropriés.
