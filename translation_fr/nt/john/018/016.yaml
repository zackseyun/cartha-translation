id: JHN.18.16
reference: John 18:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: fr
  text: Mais Pierre se tenait dehors, près de la porte. L’autre disciple, qui était connu du grand-prêtre[a], sortit donc, parla à la gardienne de la porte[b] et fit entrer Pierre.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « qui était une connaissance du grand-prêtre ». Le grec ne précise pas le degré de proximité de cette relation.
    reason: lexical_alternative
  - marker: b
    text: Ou « la gardienne de l’entrée ». Le terme grec désigne la personne chargée de surveiller l’accès.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: se tenait
  rationale: Le plus-que-parfait grec décrit ici une position qui se prolonge; « se tenait » exprime naturellement cet état continu dans le récit.
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: dehors, près de la porte
  rationale: Cette formulation conserve à la fois l’idée d’être à l’extérieur et celle de se trouver à proximité immédiate de l’entrée.
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: l’autre disciple
  rationale: « Disciple » est le terme courant dans le récit évangélique et rend la dimension relationnelle de μαθητής.
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: qui était connu du grand-prêtre
  rationale: Cette traduction directe maintient l’indétermination du grec quant à la nature et au degré de la relation.
- source_word: ἀρχιερεύς
  choice: grand-prêtre
  rationale: Terme français usuel et précis pour cette fonction sacerdotale juive.
- source_word: θυρωρῷ
  choice: la gardienne de la porte
  rationale: L’article féminin indique que la personne chargée de l’entrée est une femme; la formulation explicite à la fois son sexe et sa fonction sans anticiper davantage le verset suivant.
- source_word: εἶπεν τῇ θυρωρῷ
  choice: parla à la gardienne de la porte
  rationale: Puisqu’aucune parole n’est citée, « parla à » est idiomatique et correspond bien à l’emploi de λέγω.
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: fit entrer Pierre
  rationale: Cette tournure française naturelle exprime l’action de faire passer Pierre à l’intérieur sans préciser indûment la manière.
theological_decisions: []
