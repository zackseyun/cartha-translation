source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: fr
  text: 'Jésus répondit : « Mon royaume ne vient pas de ce monde. Si mon royaume venait de ce monde, mes serviteurs combattraient pour que je ne sois pas livré aux Juifs[a]. Mais en réalité, mon royaume ne vient pas d’ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « aux Judéens » ; ici, le terme désigne peut-être plus précisément les autorités de Judée.'
    reason: Traduction alternative reflétant la portée contextuelle possible de Ἰουδαῖοι dans l’Évangile selon Jean.
lexical_decisions:
- source_word: βασιλεία
  choice: royaume
  rationale: « Royaume » est la traduction française la plus naturelle et la mieux établie ici ; selon le contexte, le mot peut désigner à la fois le domaine royal et l’exercice de la royauté.
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: ne vient pas de ce monde
  rationale: La préposition ἐκ exprime la provenance ou l’origine. « Ne vient pas de ce monde » conserve mieux cette nuance que « n’est pas de ce monde », tout en restant idiomatique.
- source_word: κόσμος
  choice: monde
  rationale: « Monde » rend directement κόσμος sans expliciter à l’excès la nuance johannique possible d’un ordre humain opposé à Dieu.
- source_word: ὑπηρέται
  choice: serviteurs
  rationale: Le terme désigne des personnes au service d’une autorité. « Serviteurs » convient au cadre royal et évite de préciser indûment une fonction officielle ou policière.
- source_word: ἠγωνίζοντο ἄν
  choice: combattraient
  rationale: Dans cette condition contraire aux faits, le verbe évoque l’action de lutter ou de combattre. Le conditionnel français exprime naturellement l’action hypothétique.
- source_word: ἵνα μὴ παραδοθῶ
  choice: pour que je ne sois pas livré
  rationale: Cette formulation conserve la valeur de but de ἵνα et rend παραδίδωμι par le terme français courant « livrer », approprié au contexte d’arrestation et de remise aux autorités.
- source_word: τοῖς Ἰουδαίοις
  choice: aux Juifs
  rationale: Le grec peut désigner les Juifs en général ou, selon le contexte johannique, les Judéens ou les autorités judéennes. Le texte principal reste proche du terme grec, tandis qu’une note signale le sens contextuel plus restreint possible.
- source_word: νῦν δὲ
  choice: Mais en réalité
  rationale: L’expression oppose la situation réelle à l’hypothèse qui précède. « Mais en réalité » rend cette opposition plus clairement qu’un simple « mais maintenant ».
- source_word: ἐντεῦθεν
  choice: ne vient pas d’ici
  rationale: L’adverbe signifie « d’ici » ou « de cet endroit ». Cette traduction préserve la formulation déictique finale sans la réduire à une répétition exacte de « de ce monde ».
theological_decisions:
- issue: Nature du royaume de Jésus par rapport au monde
  choice: « ne vient pas de ce monde »
  alternative: « n’est pas de ce monde » ou « ne fait pas partie de ce monde »
  rationale: Le grec met en avant l’origine ou la source du royaume. La traduction ne nie donc pas sa présence ou son action dans le monde, et elle préserve la tension théologique du texte sans l’interpréter comme un retrait de toute réalité terrestre.
- issue: Référent de Ἰουδαῖοι dans Jean
  choice: « aux Juifs » dans le texte, avec une autre traduction en note
  alternative: « aux Judéens » ou « aux autorités judéennes »
  rationale: Le terme grec est susceptible d’un sens large ou contextuellement plus étroit. Garder « aux Juifs » évite de trancher silencieusement, tandis que la note indique que les autorités de Judée peuvent être plus précisément visées ici.
translation_notes:
  register: Français international moderne, digne et accessible. La répétition de « mon royaume » et le contraste entre l’hypothèse et la situation réelle sont conservés. « Combatteraient » est plus naturel en français que la reproduction explicite d’un aspect progressif, sans perdre l’idée de résistance armée ou active.
