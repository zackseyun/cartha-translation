id: JHN.18.4
reference: John 18:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: fr
  text: 'Jésus donc, sachant tout ce qui allait lui arriver[a], sortit et leur dit : « Qui cherchez-vous ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « toutes les choses qui venaient sur lui ».'
    reason: La note rend plus explicitement la construction grecque avec πάντα et le participe présent τὰ ἐρχόμενα, tout en laissant au texte principal sa formulation française idiomatique.
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Marque la progression logique et narrative. Placé après « sachant », « donc » reste naturel en français tout en conservant sa valeur de liaison.
- source_word: εἰδὼς
  choice: sachant
  rationale: Le participe rend l’état de connaissance préalable de Jésus sans expliciter davantage la portée doctrinale de cette connaissance.
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: tout ce qui allait lui arriver
  rationale: Cette formulation française naturelle conserve l’idée de totalité et le caractère imminent des événements dirigés contre Jésus, sans en préciser la nature au-delà du grec.
- source_word: ἐξῆλθεν
  choice: sortit
  rationale: Rend directement le verbe ἐξέρχομαι sans ajouter l’idée interprétative qu’il se serait avancé ou serait allé à leur rencontre.
- source_word: λέγει
  choice: leur dit
  rationale: Le présent historique grec est rendu au passé simple, temps naturel du récit en français. Le pronom « leur » représente explicitement αὐτοῖς.
- source_word: Τίνα ζητεῖτε;
  choice: Qui cherchez-vous ?
  rationale: En français, « qui » sert naturellement de complément de personne. « Chercher » garde le registre sobre et légèrement soutenu de ζητέω.
theological_decisions:
- issue: La connaissance préalable de Jésus
  choice: Le texte affirme que Jésus savait tout ce qui allait lui arriver.
  alternative: Une formulation plus interprétative pourrait parler explicitement d’une connaissance exhaustive ou divine.
  rationale: La traduction conserve toute la force de πάντα et l’anticipation des événements, mais n’ajoute aucune formulation doctrinale absente du verset.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec sans devenir artificielle ; le passé simple convient au registre narratif biblique courant.
