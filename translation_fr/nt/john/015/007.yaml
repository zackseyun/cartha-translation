id: JHN.15.7
reference: John 15:7
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: fr
  text: Si vous demeurez en moi et que mes paroles demeurent en vous, demandez ce que vous voudrez, et cela vous sera accordé.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: demeurez / demeurent
  rationale: « Demeurer » rend la continuité relationnelle exprimée par μένω, terme important chez Jean, et permet de conserver la répétition du verbe grec dans un registre digne et naturel.
- source_word: ἐν ἐμοὶ
  choice: en moi
  rationale: La préposition « en » préserve sans paraphrase le langage johannique d’union et de relation.
- source_word: τὰ ῥήματά μου
  choice: mes paroles
  rationale: ῥήματα désigne ici les paroles prononcées par Jésus. « Mes paroles » est direct, naturel et plus adapté au registre que « mes mots ».
- source_word: ὃ ἐὰν θέλητε
  choice: ce que vous voudrez
  rationale: Cette tournure française exprime naturellement l’objet indéfini de la volonté tout en conservant l’ampleur de la formulation grecque.
- source_word: αἰτήσασθε
  choice: demandez
  rationale: L’impératif désigne une requête; « demandez » en est le rendu français direct et idiomatique.
- source_word: γενήσεται ὑμῖν
  choice: cela vous sera accordé
  rationale: Dans le contexte d’une demande, cette formulation rend naturellement le résultat promis par γενήσεται ὑμῖν, sans préciser qui agit lorsque le grec ne le fait pas explicitement.
theological_decisions:
- issue: Condition encadrant la promesse concernant la prière
  choice: La promesse demeure explicitement subordonnée au fait de demeurer en Jésus et de laisser ses paroles demeurer en soi.
  alternative: Formuler la promesse comme si toute demande était accordée sans condition.
  rationale: La proposition introduite par ἐὰν établit clairement la condition. La traduction conserve cette structure et ne transforme pas la promesse en garantie universelle et inconditionnelle.
- issue: Portée de ὃ ἐὰν θέλητε
  choice: ce que vous voudrez
  alternative: ce qui sera conforme à la volonté de Dieu
  rationale: Le verset ne formule pas ici cette restriction de manière explicite. La condition donnée dans le texte est conservée, sans ajout explicatif doctrinal.
translation_notes:
  register: Français international moderne, clair et digne. Le vouvoiement pluriel correspond au ὑμεῖς adressé aux disciples. La répétition de « demeurer » reproduit celle du grec et maintient le motif johannique.
