source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: fr
  text: Je vous ai dit ces choses afin que ma joie soit en vous[b] et que votre joie soit comblée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que votre joie soit complète ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « que ma joie soit parmi vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ces choses
  rationale: Le démonstratif neutre pluriel est conservé, ce qui reprend naturellement l’ensemble des paroles précédentes.
- source_word: λελάληκα ὑμῖν
  choice: Je vous ai dit
  rationale: Le passé composé rend naturellement en français le parfait grec et son lien avec la situation présente. « Dire » convient mieux que le plus littéral mais moins idiomatique « parler ces choses ».
- source_word: ἵνα
  choice: afin que
  rationale: Cette tournure exprime clairement la visée des paroles de Jésus tout en gardant un registre digne et courant.
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: ma joie
  rationale: La construction grecque souligne l’appartenance à Jésus; « ma joie » la restitue sans ajouter d’explication interprétative.
- source_word: ἐν ὑμῖν
  choice: en vous
  rationale: « En vous » conserve le sens intérieur possible de ἐν et l’ambiguïté théologique du texte; « parmi vous » demeure une possibilité signalée en note.
- source_word: ᾖ
  choice: soit
  rationale: Le présent du subjonctif français correspond naturellement au subjonctif grec introduit par ἵνα.
- source_word: καὶ
  choice: et
  rationale: La coordination simple entre les deux éléments de la visée est maintenue.
- source_word: ἡ χαρὰ ὑμῶν
  choice: votre joie
  rationale: Cette formulation idiomatique préserve le contraste direct avec « ma joie ».
- source_word: πληρωθῇ
  choice: soit complète
  rationale: Avec « joie », « complète » exprime naturellement l’idée de plénitude ou d’accomplissement portée par le passif de πληρόω. Une traduction plus formelle est donnée en note.
theological_decisions:
- issue: Nature de « ma joie » dans le contexte johannique
  choice: Conserver simplement « ma joie »
  alternative: « la joie que je vous donne » ou « la joie qui vient de moi »
  rationale: Le grec ne précise pas s’il s’agit de la joie propre de Jésus partagée avec les disciples ou d’une joie qu’il leur communique. La formulation retenue préserve cette richesse sans la résoudre.
- issue: Portée de ἐν ὑμῖν
  choice: « en vous » dans le texte, avec « parmi vous » en note
  alternative: « parmi vous » dans le texte principal
  rationale: La préposition peut désigner une présence intérieure ou collective. Le contexte favorise « en vous », mais la variante sémantique réelle mérite d’être conservée.
translation_notes:
  register: Français international moderne, clair et digne. Le passé composé évite une littéralité maladroite, tandis que « afin que » maintient explicitement la relation de visée. Tous les marqueurs de note figurent dans le texte principal.
