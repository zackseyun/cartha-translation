id: JHN.15.12
reference: John 15:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ ἵνα ἀγαπᾶτε ἀλλήλους καθὼς ἠγάπησα ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: fr
  text: 'Voici mon commandement : aimez-vous les uns les autres comme je vous ai aimés[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Voici mon commandement : que vous vous aimiez les uns les autres comme je vous ai aimés. »'
    reason: Alternative syntaxique reproduisant plus formellement la proposition grecque introduite par ἵνα.
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: Voici mon commandement
  rationale: La tournure française « Voici » présente et identifie naturellement le commandement précis de Jésus. « Mon commandement » conserve à la fois la possession emphatique et l’autorité de ἐντολή.
- source_word: ἵνα ἀγαπᾶτε
  choice: aimez-vous
  rationale: ἵνα introduit ici le contenu du commandement. En français, les deux-points suivis de l’impératif rendent ce contenu plus naturellement qu’une construction avec « que » et le subjonctif, tout en conservant sa force prescriptive.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Équivalent réciproque courant, clair et digne, adapté à un groupe de disciples.
- source_word: καθὼς
  choice: comme
  rationale: « Comme » exprime naturellement le rapport de comparaison et présente l’amour de Jésus comme modèle de l’amour mutuel.
- source_word: ἠγάπησα ὑμᾶς
  choice: je vous ai aimés
  rationale: Le passé composé rend naturellement en français l’aoriste ἠγάπησα dans ce contexte, en évoquant l’amour déjà manifesté par Jésus et toujours pertinent. L’accord « aimés » rend explicite le pluriel masculin ou mixte du groupe de disciples.
theological_decisions:
- issue: Rendu du langage de ἀγαπάω
  choice: aimez-vous / je vous ai aimés
  alternative: ayez de l’amour les uns pour les autres / je vous ai aimés
  rationale: Le verbe « aimer » conserve la continuité lexicale des deux formes de ἀγαπάω sans introduire une distinction théologique absente du texte.
- issue: Force du commandement de Jésus
  choice: 'Voici mon commandement : aimez-vous les uns les autres'
  alternative: 'Voici mon commandement : que vous vous aimiez les uns les autres'
  rationale: L’impératif français exprime clairement l’autorité du commandement. La variante avec le subjonctif suit plus étroitement la forme grecque introduite par ἵνα, mais elle est moins directe en français moderne.
- issue: Valeur temporelle de ἠγάπησα
  choice: je vous ai aimés
  alternative: je vous aimai
  rationale: Le passé composé est le passé narratif naturel en français moderne et garde la référence à l’amour déjà manifesté par Jésus, sans préciser davantage son étendue ou son moment.
translation_notes:
  register: Français international moderne, clair et digne. L’impératif offre une formulation orale et directe; « les uns les autres » maintient le registre biblique courant sans archaïsme marqué.
