id: JHN.15.14
reference: John 15:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ⸀ἃ ἐγὼ ἐντέλλομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/014.yaml
  text: You are my friends if you do what I command you[a].
translation:
  language: fr
  text: Vous êtes mes amis si vous faites ce que je vous commande.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus formellement : « Vous êtes mes amis si vous faites les choses que je vous commande. »'
    reason: Alternative lexicale reflétant plus explicitement le relatif neutre pluriel ἃ.
lexical_decisions:
- source_word: ὑμεῖς
  choice: Vous
  rationale: Le pronom de deuxième personne du pluriel est placé en tête pour l’accentuation. En français, « vous » suffit naturellement; le contexte et l’ordre de la phrase portent l’insistance sans qu’il soit nécessaire d’ajouter « vous-mêmes ».
- source_word: φίλοι μού
  choice: mes amis
  rationale: φίλοι exprime ici une relation de proximité, et le génitif μού marque l’appartenance relationnelle. « Mes amis » est l’équivalent français naturel et fidèle.
- source_word: ἐστε
  choice: êtes
  rationale: Présent de l’indicatif du verbe « être », rendu directement.
- source_word: ἐὰν
  choice: si
  rationale: Avec le subjonctif, ἐὰν introduit ici une condition. « Si » en préserve clairement la force conditionnelle.
- source_word: ποιῆτε
  choice: vous faites
  rationale: Le présent du subjonctif de ποιέω désigne l’accomplissement de ce qui est commandé. « Faites » est naturel et n’impose pas artificiellement une nuance durative.
- source_word: ἃ
  choice: ce que
  rationale: Le relatif neutre pluriel renvoie au contenu des commandements. « Ce que » est plus idiomatique en français moderne que « les choses que ».
- source_word: ἐγὼ
  choice: je
  rationale: Le pronom sujet explicite porte une certaine insistance en grec. Le français exige déjà le pronom « je »; « moi-même » serait ici trop appuyé.
- source_word: ἐντέλλομαι ὑμῖν
  choice: je vous commande
  rationale: ἐντέλλομαι exprime un ordre ou une prescription faisant autorité, et ὑμῖν en désigne les destinataires. « Je vous commande » conserve cette autorité dans une tournure française naturelle.
theological_decisions:
- issue: Nature du lien conditionnel entre l’amitié avec Jésus et l’obéissance
  choice: « Vous êtes mes amis si vous faites ce que je vous commande. »
  alternative: « Vous êtes mes amis quand vous faites ce que je vous commande. »
  rationale: La construction ἐὰν avec le subjonctif exprime le plus naturellement une condition, et non une simple circonstance temporelle. La traduction maintient le lien affirmé entre l’amitié et l’obéissance sans préciser s’il relève du mérite, de la preuve ou de la persévérance.
translation_notes:
  register: Français international moderne, naturel et digne. Le tutoiement est exclu puisque le grec s’adresse à plusieurs personnes; « vous » conserve donc le pluriel. La formulation reste concise et garde intacte la tension conditionnelle du texte.
