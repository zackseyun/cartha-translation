reference: John 15:26
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: fr
  text: Quand le Défenseur[a] viendra, que je vous enverrai d’auprès du Père — l’Esprit de vérité qui procède du Père[b] —, il témoignera[c] à mon sujet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le Consolateur », « l’Aide », « l’Avocat » ; le grec παράκλητος peut aussi être transcrit « le Paraclet ».
    reason: lexical_alternative
  - marker: b
    text: Le grec dit « procède du Père », formulation qui a pris par la suite une importance particulière dans la théologie trinitaire.
    reason: cross_reference
  - marker: c
    text: Ou « rendra témoignage à mon sujet ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: Quand viendra
  rationale: La construction ὅταν avec le subjonctif aoriste désigne ici un événement futur attendu. En français, « Quand viendra » est naturel et conserve cette orientation future.
- source_word: ὁ παράκλητος
  choice: le Défenseur
  rationale: παράκλητος désigne une personne appelée auprès de quelqu’un pour l’aider, le représenter ou prendre sa défense. « Défenseur » conserve la dimension personnelle et représentative du terme, particulièrement adaptée au contexte du témoignage, sans recourir à une translittération peu transparente.
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: que je vous enverrai
  rationale: Le futur πέμψω et le datif ὑμῖν sont rendus directement et naturellement.
- source_word: παρὰ τοῦ πατρός
  choice: d’auprès du Père
  rationale: παρά avec le génitif peut exprimer une provenance depuis la présence ou le côté de quelqu’un. « D’auprès du Père » préserve cette nuance tout en distinguant cette première expression du verbe ἐκπορεύεται qui suit.
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: l’Esprit de vérité
  rationale: Cette formulation reproduit fidèlement le génitif grec et conserve le titre johannique sans le réduire à « l’Esprit véridique ».
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: qui procède du Père
  rationale: « Procède » conserve la valeur spécifique de ἐκπορεύεται plutôt que de l’aplatir en « vient ». Le relatif personnel « qui » convient à la présentation personnelle de l’Esprit dans le contexte.
- source_word: ἐκεῖνος μαρτυρήσει
  choice: il témoignera
  rationale: Le pronom « il » reprend naturellement le Défenseur et l’Esprit. « Témoignera » est clair en français moderne et garde la dimension de témoignage portée par μαρτυρέω.
- source_word: περὶ ἐμοῦ
  choice: à mon sujet
  rationale: περί avec le génitif signifie ici « au sujet de » ou « concernant ». Cette traduction reste neutre et n’ajoute pas explicitement l’idée favorable que pourrait suggérer « en ma faveur ».
theological_decisions:
- issue: Traduction de παράκλητος dans un contexte trinitaire
  choice: le Défenseur
  alternative: le Consolateur, l’Aide, l’Avocat ou le Paraclet
  rationale: Aucun équivalent français ne couvre toute l’étendue du terme. « Défenseur » met en valeur le rôle personnel et représentatif lié au témoignage dans le contexte immédiat, tout en restant intelligible pour un large public. Une note signale les autres possibilités.
- issue: Référence personnelle à l’Esprit
  choice: qui procède… il témoignera
  alternative: qui procède… celui-ci témoignera
  rationale: Même si πνεῦμα est grammaticalement neutre, le grec reprend le Défenseur/l’Esprit par le masculin emphatique ἐκεῖνος. Le pronom personnel français « il » rend naturellement cette présentation sans tirer de conclusion doctrinale supplémentaire.
- issue: Traduction de ἐκπορεύεται
  choice: procède du Père
  alternative: vient du Père ou sort d’auprès du Père
  rationale: « Procède » conserve la précision lexicale du grec et la formulation qui a acquis plus tard une importance dans les débats trinitaires. La traduction ne développe toutefois pas ces formulations doctrinales ultérieures et ne dit rien au-delà du texte sur la relation de l’Esprit avec le Fils.
translation_notes:
  register: Français international moderne, clair et digne. « Défenseur » est accessible sans être familier. « D’auprès du Père » garde une légère solennité justifiée par la nuance de provenance de παρά, tandis que les tirets rendent lisible l’apposition « l’Esprit de vérité ». La formulation préserve la distinction entre l’envoi par Jésus et la procession depuis le Père, sans harmonisation doctrinale ajoutée.
