id: JHN.15.18
reference: John 15:18
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: fr
  text: Si le monde vous déteste, sachez qu’il m’a détesté avant vous.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « sachez qu’il m’a détesté le premier, avant de vous détester ». Le grec exprime la priorité temporelle au moyen de « premier » suivi de « vous ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: le monde
  rationale: Dans Jean, le terme peut désigner l’humanité dans son opposition à Dieu, mais « le monde » conserve naturellement l’étendue et l’ambiguïté du grec sans ajouter une interprétation.
- source_word: μισεῖ
  choice: déteste
  rationale: Le présent exprime ici une réalité générale ou actuelle. « Déteste » est naturel en français moderne et convient mieux au registre que « hait ».
- source_word: γινώσκετε
  choice: sachez
  rationale: La forme grecque peut être comprise comme un indicatif ou un impératif; dans ce contexte, l’exhortation « sachez » s’intègre le plus naturellement à la proposition conditionnelle.
- source_word: μεμίσηκεν
  choice: m’a détesté
  rationale: Le passé composé rend naturellement en français l’action antérieure dont la portée demeure pertinente.
- source_word: πρῶτον ὑμῶν
  choice: avant vous
  rationale: Avec le génitif, l’expression marque la priorité temporelle. « Avant vous » la rend clairement et sans lourdeur.
theological_decisions:
- issue: Sens de κόσμος dans la théologie johannique
  choice: Conserver « le monde » sans explicitation théologique.
  alternative: « l’humanité opposée à Dieu » ou « le système du monde »
  rationale: Le contexte donne au terme une coloration hostile, mais une paraphrase explicative réduirait la portée du mot et résoudrait indûment sa tension théologique.
- issue: Valeur de γινώσκετε
  choice: 'Le comprendre comme une exhortation: « sachez ».'
  alternative: 'Le comprendre comme un indicatif: « vous savez ».'
  rationale: Les deux analyses sont morphologiquement possibles, mais l’impératif donne le sens discursif le plus naturel après la condition, sans modifier le contenu théologique.
translation_notes:
  register: Français international moderne, naturel et digne. « Détester » est préféré à « haïr » pour rendre μισέω de façon courante sans affaiblir l’hostilité exprimée. Le pronom « il » reprend naturellement « le monde ».
