id: JHN.15.10
reference: John 15:10
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: fr
  text: Si vous gardez mes commandements, vous demeurerez dans mon amour, tout comme j’ai gardé les commandements de mon Père et je demeure dans son amour.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Si
  rationale: Introduit naturellement en français une condition réelle avec le subjonctif grec, sans ajouter une nuance de répétition.
- source_word: τὰς ἐντολάς
  choice: les commandements
  rationale: Conserve la force d’ordres faisant autorité et convient à l’usage johannique, tout en restant clair en français moderne.
- source_word: τηρήσητε / τετήρηκα
  choice: gardez / j’ai gardé
  rationale: Préserve la répétition de τηρέω et son sens d’observation fidèle, plus large que la seule idée d’obéir.
- source_word: μενεῖτε / μένω
  choice: vous demeurerez / je demeure
  rationale: Maintient le même verbe dans les deux propositions et rend le thème johannique de la continuité relationnelle dans un registre digne et courant.
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: dans mon amour / dans son amour
  rationale: Reproduit l’image de l’amour comme sphère relationnelle et conserve le parallélisme du grec.
- source_word: καθὼς
  choice: tout comme
  rationale: Signale clairement la correspondance entre la conduite des disciples et celle de Jésus.
- source_word: τοῦ πατρός μου
  choice: de mon Père
  rationale: Rend directement le génitif et emploie la majuscule à « Père » comme désignation divine en contexte.
theological_decisions:
- issue: Rapport entre l’obéissance et le fait de demeurer dans l’amour de Jésus
  choice: Formuler sans atténuation la relation conditionnelle exprimée par le grec.
  alternative: Présenter l’obéissance soit comme méritant l’amour divin, soit comme un simple signe dépourvu de véritable portée conditionnelle.
  rationale: Le verset pose une condition et l’éclaire par l’exemple de Jésus, mais ne tranche pas les débats plus larges sur le mérite, la persévérance ou la perte du salut.
- issue: Sens de ἀγάπη
  choice: amour
  alternative: charité
  rationale: « Amour » est le terme français moderne, naturel et précis ici; il préserve aussi la répétition lexicale du verset.
translation_notes:
  register: Français international moderne, clair et digne. « Demeurer » est retenu plutôt que « rester » afin de conserver la portée thématique de μένω chez Jean sans archaïsme marqué. Le pronom tonique « moi » rend l’emphase de ἐγώ et clarifie le parallélisme.
