id: JHN.15.20
reference: John 15:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: fr
  text: 'Souvenez-vous de la parole que je vous ai dite : « Un esclave[a] n’est pas plus grand que son maître. » S’ils m’ont persécuté, ils vous persécuteront aussi ; s’ils ont gardé ma parole[b], ils garderont aussi la vôtre.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteur ». Le grec δοῦλος peut désigner un esclave ou un serviteur selon le contexte ; ici, le contraste avec le maître met particulièrement en relief la condition subordonnée.
    reason: lexical_alternative
  - marker: b
    text: Ou « obéi à ma parole ». Chez Jean, « garder la parole » peut inclure le fait d’accueillir le message de Jésus et de lui obéir.
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: Souvenez-vous
  rationale: L’impératif présent appelle les disciples à garder continuellement en mémoire la parole déjà prononcée. « Souvenez-vous » est naturel et conserve la force impérative.
- source_word: λόγου
  choice: parole
  rationale: Le singulier, précisé par la proposition relative, désigne ici une parole particulière de Jésus. « Parole » préserve aussi le vocabulaire johannique et le lien avec « ma parole » plus loin dans le verset.
- source_word: οὗ ἐγὼ εἶπον ὑμῖν
  choice: que je vous ai dite
  rationale: Cette formulation française reprend directement la proposition relative grecque et maintient « parole » comme antécédent.
- source_word: δοῦλος
  choice: esclave
  rationale: Dans la comparaison avec κύριος, le terme souligne un statut de dépendance et de subordination. « Esclave » rend cette force plus précisément que « serviteur ».
- source_word: μείζων
  choice: plus grand
  rationale: Cette expression conserve l’étendue de la comparaison grecque, qui peut concerner le rang ou la condition, sans la réduire à « plus important » ou « supérieur ».
- source_word: κυρίου
  choice: maître
  rationale: Dans le couple δοῦλος–κύριος, κύριος désigne celui qui exerce l’autorité sur l’esclave. « Maître » convient au rapport social évoqué et évite d’en faire ici le titre divin « Seigneur ».
- source_word: ἐδίωξαν / διώξουσιν
  choice: ont persécuté / persécuteront
  rationale: Dans le contexte de l’hostilité envers Jésus et ses disciples, διώκω exprime la persécution plutôt qu’une simple poursuite.
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: ont gardé / garderont
  rationale: τηρέω peut exprimer le fait de conserver, d’observer ou d’obéir. « Garder la parole » maintient le parallélisme verbal et laisse subsister la richesse du sens johannique.
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: ma parole… la vôtre
  rationale: Cette traduction conserve le parallèle entre la parole de Jésus et celle de ses disciples, ainsi que la répétition de λόγος dans le verset.
theological_decisions:
- issue: Sens de δοῦλος dans la comparaison de statut
  choice: esclave
  alternative: serviteur
  rationale: L’aphorisme repose sur l’inégalité de condition entre le δοῦλος et son κύριος. « Esclave » rend explicitement ce rapport de dépendance sans ajouter une interprétation confessionnelle.
- issue: Sens de κύριος en relation avec δοῦλος
  choice: maître
  alternative: seigneur
  rationale: Ici, κύριος appartient au couple social esclave–maître. La minuscule et le choix de « maître » évitent de transformer le terme en titre christologique, tout en préservant l’application implicite de la parole à Jésus et aux disciples.
- issue: Portée de τηρέω appliqué à la parole
  choice: garder
  alternative: obéir à
  rationale: « Garder » préserve l’ambiguïté féconde du verbe, qui peut inclure l’accueil, l’attachement et l’obéissance, au lieu de limiter son sens à la seule exécution d’un commandement.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe reste proche du grec tout en étant naturelle. Le parallélisme « m’ont persécuté / vous persécuteront » et « ont gardé ma parole / garderont la vôtre » est conservé. Le marqueur [a] est placé après « esclave », conformément au terme réellement expliqué par la note.
