id: JHN.15.13
reference: John 15:13
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: fr
  text: 'Personne n’a de plus grand amour que celui-ci : donner sa vie pour ses amis.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « que quelqu’un donne sa vie pour ses amis ». Le grec emploie un sujet singulier indéfini.'
    reason: lexical_alternative
  - marker: b
    text: Le mot traduit par « vie » peut aussi signifier « âme » ou « personne elle-même »; ici, il s’agit de la vie livrée jusqu’à la mort.
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: de plus grand amour que celui-ci
  rationale: Le comparatif μείζονα avec le génitif ταύτης exprime « plus grand que celui-ci »; la proposition suivante précise en quoi consiste cet amour.
- source_word: οὐδεὶς ἔχει
  choice: Personne n’a
  rationale: Rend directement et naturellement l’expression négative de possession.
- source_word: ἵνα τις
  choice: donner
  rationale: ἵνα introduit ici le contenu qui définit « cet amour ». L’infinitif français formule naturellement la maxime et conserve la portée générale de τις, sans lui attribuer un genre.
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: donner sa vie
  rationale: Dans ce contexte johannique, ψυχή désigne la vie terrestre livrée jusqu’à la mort; « donner sa vie » est l’expression française naturelle correspondant à θῇ avec ψυχήν.
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: pour ses amis
  rationale: ὑπέρ exprime ici le bénéfice ou l’action en faveur d’autrui; « pour » préserve cette largeur de sens sans imposer à lui seul une valeur strictement substitutive.
theological_decisions:
- issue: Sens de ψυχή dans cette parole sur le sacrifice de soi
  choice: vie
  alternative: âme; personne elle-même
  rationale: Le contexte évoque le fait de se livrer à la mort. « Vie » communique ce sens concret sans introduire une opposition entre corps et âme absente de l’accent du verset.
- issue: Portée de ὑπέρ
  choice: pour
  alternative: en faveur de; à la place de
  rationale: La préposition peut comporter une nuance bénéficiaire ou représentative, mais le verset ne requiert pas que la traduction française tranche en faveur d’une substitution stricte.
- issue: Sujet indéfini τις et pronoms masculins αὐτοῦ
  choice: 'construction infinitive générale : « donner sa vie pour ses amis »'
  alternative: que quelqu’un donne sa vie pour ses amis
  rationale: La construction infinitive est idiomatique en français et préserve la portée générique du grec sans transformer le masculin grammatical en restriction visant les hommes.
translation_notes:
  register: Français international moderne, sobre et digne. La construction infinitive évite un masculin générique potentiellement restrictif tout en gardant la formulation concise d’une maxime. « Celui-ci » reprend explicitement le démonstratif grec et annonce l’explication qui suit.
