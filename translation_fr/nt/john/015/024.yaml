source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: fr
  text: Si je n’avais pas accompli parmi eux les œuvres que personne d’autre n’a accomplies, ils n’auraient pas de péché[a] ; mais maintenant, ils ont vu et haï aussi bien moi que mon Père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne seraient pas coupables de péché ». Le grec dit littéralement : « ils n’auraient pas de péché ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: les œuvres
  rationale: « Œuvres » conserve le vocabulaire johannique, où les actes de Jésus révèlent son identité et sa mission.
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: j’avais accompli parmi eux
  rationale: Dans cette condition contraire à la réalité, l’aoriste se rend naturellement par le plus-que-parfait français. « Parmi eux » exprime l’activité de Jésus en leur présence.
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: que personne d’autre n’a accomplies
  rationale: Cette formulation naturelle souligne le caractère unique des œuvres de Jésus et respecte l’accord français avec « œuvres ».
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: ils n’auraient pas de péché
  rationale: Le tour volontairement littéral préserve l’expression johannique « avoir du péché » sans la réduire d’emblée à une formulation sur la culpabilité.
- source_word: νῦν δὲ
  choice: Mais maintenant
  rationale: Cette expression marque nettement le contraste entre l’hypothèse irréelle et la situation présente.
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: ils ont vu et haï
  rationale: Le passé composé rend la portée actuelle des parfaits grecs, tandis que la coordination conserve les deux actions étroitement liées.
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: moi comme mon Père
  rationale: Cette tournure française applique sans ambiguïté les deux verbes à Jésus et à son Père, tout en conservant l’association emphatique des deux objets.
theological_decisions:
- issue: Sens de « ils n’auraient pas de péché » quant à la culpabilité
  choice: Conserver l’expression johannique « avoir du péché » dans le texte principal.
  alternative: ils ne seraient pas coupables de péché
  rationale: Le contexte concerne la culpabilité accrue devant les œuvres révélatrices de Jésus, mais la traduction garde la formulation du texte et sa tension au lieu de la remplacer par une explication doctrinale plus étroite.
translation_notes:
  register: Français international moderne, digne et accessible. « Accomplir les œuvres » maintient la tonalité johannique. La formulation « moi comme mon Père » évite une répétition pesante tout en indiquant clairement que Jésus et son Père ont tous deux été vus et haïs.
