  to: Si je n’avais pas accompli parmi eux les œuvres que personne d’autre n’a accomplies, ils n’auraient pas de péché[a] ; mais maintenant, ils ont vu et haï aussi bien moi que mon Père.
  rationale: La révision se limite à la dernière coordination, afin de rendre sans ambiguïté les deux objets corrélés du grec et d’éviter le sens comparatif possible de « moi comme mon Père ». La ponctuation est également normalisée pour une phrase française continue.
