id: JHN.15.19
reference: John 15:19
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: fr
  text: Si vous étiez du monde[a], le monde aimerait ce qui lui appartient. Mais parce que vous n’êtes pas du monde et que moi, je vous ai choisis du monde, le monde vous déteste pour cette raison.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « issus du monde » ; l’expression grecque ἐκ τοῦ κόσμου peut indiquer l’origine ou l’appartenance.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: du monde
  rationale: « Du monde » exprime naturellement en français tant l’origine que l’appartenance et permet de conserver la répétition de la formule johannique.
- source_word: κόσμος
  choice: monde
  rationale: « Monde » conserve l’ampleur de la catégorie johannique sans la réduire par une paraphrase interprétative telle que « système du monde ».
- source_word: ἂν ... ἐφίλει
  choice: aimerait
  rationale: Le conditionnel présent rend naturellement la conséquence de l’hypothèse contraire à la réalité introduite par « si vous étiez ».
- source_word: τὸ ἴδιον
  choice: ce qui lui appartient
  rationale: Le neutre singulier désigne ce qui est propre au monde. Cette formulation évite d’ajouter explicitement « les siens » ou « ses propres gens », même si les personnes sont probablement visées dans le contexte.
- source_word: φιλέω
  choice: aimer
  rationale: « Aimer » restitue clairement le verbe et maintient son opposition directe avec « détester ».
- source_word: ὅτι δὲ
  choice: Mais parce que
  rationale: La formulation conserve à la fois le contraste porté par δέ et la valeur causale de ὅτι.
- source_word: ἐξελεξάμην
  choice: je vous ai choisis
  rationale: Le passé composé rend naturellement l’aoriste en français. « Choisir » traduit le moyen sans surcharger sa portée théologique.
- source_word: ἐκ τοῦ κόσμου
  choice: en vous prenant du milieu du monde
  rationale: Avec le verbe « choisir », cette formulation rend explicite la valeur séparative de ἐκ sans laisser entendre que les disciples ont physiquement quitté le monde.
- source_word: διὰ τοῦτο
  choice: pour cette raison
  rationale: La locution conserve le lien causal explicite plutôt que de le réduire à un simple connecteur.
- source_word: μισεῖ
  choice: déteste
  rationale: « Détester » est ici un équivalent français courant et vigoureux de μισέω, plus naturel dans cette phrase que « haïr », sans atténuer l’opposition.
theological_decisions:
- issue: Sens de « monde » dans le contexte johannique
  choice: Conserver « monde » sans développement interprétatif.
  alternative: « système du monde » ou « société humaine opposée à Dieu »
  rationale: Le passage présente le monde comme une sphère humaine et morale opposée à Jésus, mais le terme simple préserve la richesse et l’ambiguïté de la catégorie johannique.
- issue: Portée du choix exprimé par ἐξελεξάμην
  choice: Traduire directement « je vous ai choisis » sans préciser un système doctrinal de l’élection.
  alternative: Employer une formulation chargée d’une doctrine particulière de prédestination ou d’élection.
  rationale: Le verset affirme clairement le choix des disciples par Jésus, mais ne tranche pas à lui seul les débats théologiques ultérieurs sur la nature ou l’étendue de l’élection.
translation_notes:
  register: Français international moderne, naturel et digne. Le rythme contrastif du grec est conservé. La reprise de « monde » est maintenue comme trait rhétorique important, tandis que la troisième occurrence de ἐκ est explicitée de façon idiomatique avec « en vous prenant du milieu du monde ».
