revisions:
- from: Si vous étiez du monde[a], le monde aimerait ce qui lui appartient. Mais parce que vous n’êtes pas du monde et que moi, je vous ai choisis en vous prenant du milieu du monde, le monde vous déteste pour cette raison.
  to: Si vous étiez du monde[a], le monde aimerait ce qui lui appartient. Mais parce que vous n’êtes pas du monde et que moi, je vous ai choisis du monde, le monde vous déteste pour cette raison.
  rationale: La révision remplace une paraphrase explicative par « je vous ai choisis du monde ». Cette formulation conserve la portée de ἐκ, évite d’ajouter l’idée d’une extraction « du milieu » et maintient la triple répétition de l’expression grecque. La ponctuation met sobrement en relief le « moi » emphatique (ἐγώ).
