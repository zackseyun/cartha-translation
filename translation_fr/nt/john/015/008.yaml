  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: fr
  text: 'C’est en ceci que mon Père est glorifié : que vous portiez beaucoup de fruit et deveniez mes disciples.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: en ceci
  rationale: Conserve le démonstratif et son lien avec ce qui suit, sans le réduire à une simple formule de manière.
- source_word: ἐδοξάσθη
  choice: est glorifié
  rationale: Le présent passif français exprime naturellement l’affirmation tout en préservant le sens passif du verbe grec.
- source_word: καρπὸν πολὺν φέρητε
  choice: vous portiez beaucoup de fruit
  rationale: Maintient l’image féconde centrale du contexte de la vigne et des sarments.
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: deveniez mes disciples
  rationale: Rend la valeur de γίνομαι (« devenir ») et traduit naturellement le datif relationnel ἐμοί par le possessif français.
theological_decisions:
- issue: Valeur de ἵνα après « en ceci »
  choice: Deux-points suivi de « que » et du subjonctif
  alternative: « afin que vous portiez… » ou « par le fait que vous portez… »
  rationale: La construction retenue laisse ouvertes les nuances de contenu, de finalité et de résultat présentes dans la formulation grecque, sans trancher silencieusement en faveur d’une seule.
- issue: Sens de « deveniez mes disciples »
  choice: Conserver « deveniez »
  alternative: « montriez que vous êtes mes disciples »
  rationale: Le texte grec dit γένησθε, « deveniez », et non « prouviez » ou « montriez ». La traduction évite donc d’ajouter une interprétation théologique.
translation_notes:
  register: Français international moderne, sobre et digne. La syntaxe avec deux-points reste proche du mouvement de la phrase grecque tout en étant claire à la lecture.
