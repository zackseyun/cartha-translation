id: JHN.15.25
reference: John 15:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: fr
  text: 'Mais cela est arrivé afin que s’accomplisse la parole écrite dans leur Loi : « Ils m’ont haï sans raison. »[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Plus formellement : « Mais afin que s’accomplisse la parole écrite dans leur Loi. » Le grec laisse la proposition principale sous-entendue; le français la restitue ici par « cela est arrivé », d’après le contexte.'
    reason: lexical_alternative
  - marker: b
    text: Ici, « leur Loi » désigne plus largement les Écritures juives; la citation vient des Psaumes (voir Ps 35.19; 69.5 dans la numérotation courante).
    reason: cross_reference
  - marker: c
    text: 'Ou : « sans motif ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: Mais cela est arrivé
  rationale: ἀλλά marque le contraste avec ce qui précède. Le grec laisse la proposition principale sous-entendue; « cela est arrivé » la restitue naturellement en français d’après le contexte.
- source_word: ἵνα πληρωθῇ
  choice: afin que s’accomplisse
  rationale: ἵνα avec le subjonctif passif peut exprimer le but ou le résultat. Cette formulation conserve le motif johannique de l’accomplissement sans trancher plus que la syntaxe grecque.
- source_word: ὁ λόγος
  choice: la parole
  rationale: Ici, λόγος désigne une parole précise de l’Écriture, et non le Logos du prologue. « La parole » convient naturellement à une formule de citation.
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: écrite dans leur Loi
  rationale: Le participe parfait passif indique ce qui demeure écrit. La formulation conserve αὐτῶν et le terme νόμος, tout en restant fluide.
- source_word: νόμῳ
  choice: Loi
  rationale: Bien que la citation provienne des Psaumes, νόμος peut désigner plus largement les Écritures juives chez Jean. « Loi » préserve le terme grec; la majuscule signale cet emploi scripturaire.
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι introduit ici le contenu de la parole citée. En français, les deux-points remplissent naturellement cette fonction.
- source_word: Ἐμίσησάν με
  choice: Ils m’ont haï
  rationale: Le passé composé exprime naturellement en français moderne l’aoriste de cette citation et son rapport au contexte.
- source_word: δωρεάν
  choice: sans raison
  rationale: Dans ce contexte, δωρεάν signifie « sans motif » ou « sans raison ». « Sans raison » est clair, courant et exprime le caractère injustifié de la haine.
theological_decisions:
- issue: Sens de « leur Loi » alors que la citation vient des Psaumes
  choice: Conserver « leur Loi » dans le texte, en comprenant « Loi » au sens large des Écritures juives.
  alternative: Traduire par « leurs Écritures » afin d’expliciter le sens large.
  rationale: Le grec porte explicitement νόμος et αὐτῶν. Garder « leur Loi » préserve à la fois la forme de la source et la distance rhétorique du discours, tandis qu’une note évite de limiter le mot au Pentateuque.
- issue: Proposition principale sous-entendue après ἀλλ’
  choice: Ajouter « cela est arrivé » pour former une phrase française naturelle.
  alternative: 'Traduire plus formellement : « Mais afin que s’accomplisse la parole… »'
  rationale: Le grec est elliptique et dépend du contexte précédent. L’ajout explicite ce lien sans apporter de contenu théologique nouveau.
- issue: Valeur de ἵνα dans la formule d’accomplissement
  choice: Employer « afin que », en laissant ouverte la relation de but et de résultat.
  alternative: Employer « de sorte que », qui mettrait davantage l’accent sur le résultat.
  rationale: La construction grecque peut porter une nuance de but ou de résultat. La traduction retenue conserve la tension de la formulation johannique sans développer une affirmation déterministe absente de la syntaxe seule.
translation_notes:
  register: Français international moderne, clair et digne. La phrase évite l’archaïsme tout en conservant la formule scripturaire « la parole écrite dans leur Loi » et l’ambiguïté relative de la construction d’accomplissement.
