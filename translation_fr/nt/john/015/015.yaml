id: JHN.15.15
reference: John 15:15
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: fr
  text: Je ne vous appelle plus esclaves[a], parce que l’esclave ne sait pas ce que fait son maître[b]. Mais je vous ai appelés amis, parce que je vous ai fait connaître tout ce que j’ai entendu de mon Père.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « serviteurs ». Le grec doulos peut désigner un serviteur ou un esclave; ici, « esclaves » fait mieux ressortir le contraste de statut avec les amis.
    reason: lexical_alternative
  - marker: b
    text: Littéralement « seigneur »; dans cette comparaison entre un esclave et celui qui a autorité sur lui, le terme signifie « maître ».
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: ne… plus
  rationale: Cette négation temporelle exprime clairement la fin d’une situation antérieure et se rend naturellement ainsi en français moderne.
- source_word: λέγω ὑμᾶς
  choice: je vous appelle
  rationale: Dans cette construction, λέγω signifie désigner ou appeler quelqu’un d’un certain nom; le présent grec est conservé.
- source_word: δούλους / δοῦλος
  choice: esclaves / l’esclave
  rationale: Le contraste avec les amis et l’ignorance de ce que fait le maître met en avant la condition de dépendance et la dissymétrie de statut; « esclaves » rend cette force plus précisément que « serviteurs ».
- source_word: οἶδεν τί ποιεῖ
  choice: ne sait pas ce que fait
  rationale: La formulation conserve le sens de connaissance de οἶδα et le présent de ποιεῖ, tout en restant idiomatique en français.
- source_word: αὐτοῦ ὁ κύριος
  choice: son maître
  rationale: Dans l’analogie sociale entre esclave et supérieur, κύριος désigne le maître plutôt qu’un titre divin.
- source_word: εἴρηκα
  choice: je vous ai appelés
  rationale: Le passé composé rend naturellement l’acte accompli de désignation dont le résultat demeure valable.
- source_word: φίλους
  choice: amis
  rationale: Le sens ordinaire de φίλος convient au contraste avec les esclaves et souligne la relation marquée par la communication de ce que Jésus a entendu.
- source_word: πάντα ἃ
  choice: tout ce que
  rationale: Cette expression française naturelle conserve la portée globale de la construction grecque.
- source_word: ἤκουσα παρὰ τοῦ πατρός μου
  choice: j’ai entendu de mon Père
  rationale: ἀκούω garde son sens direct d’entendre, tandis que παρά avec le génitif indique ici la source.
- source_word: ἐγνώρισα ὑμῖν
  choice: je vous ai fait connaître
  rationale: Cette expression rend précisément l’idée de communiquer ou de révéler une connaissance, avec une action accomplie dont l’effet reste pertinent.
theological_decisions:
- issue: Traduction de δοῦλος dans le contraste entre statut subordonné et amitié
  choice: esclaves
  alternative: serviteurs
  rationale: Le propos oppose l’ignorance liée à une condition subordonnée à la connaissance communiquée aux amis. « Esclaves » maintient nettement la dissymétrie sociale sans atténuer le terme grec.
- issue: Traduction de κύριος dans une analogie sociale
  choice: maître
  alternative: Seigneur
  rationale: Le mot désigne ici celui qui commande à l’esclave dans l’analogie, et non explicitement un titre divin ou messianique.
- issue: Valeur des parfaits εἴρηκα et ἐγνώρισα
  choice: je vous ai appelés… je vous ai fait connaître
  alternative: je vous appelle… je vous fais connaître
  rationale: Le passé composé français présente ces actes comme accomplis tout en permettant que leur résultat demeure dans la situation présente.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe reste proche du mouvement argumentatif grec, avec un vocabulaire courant. « Père » prend une majuscule puisqu’il désigne Dieu comme Père de Jésus.
