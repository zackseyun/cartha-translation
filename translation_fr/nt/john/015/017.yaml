id: JHN.15.17
reference: John 15:17
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ταῦτα ἐντέλλομαι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: fr
  text: Je vous commande tout cela afin que vous vous aimiez les uns les autres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Je vous commande ceci : aimez-vous les uns les autres. » La proposition grecque introduite par ἵνα peut exprimer le but ou se rapprocher ici du contenu du commandement.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: tout cela
  rationale: Le démonstratif neutre pluriel renvoie vraisemblablement aux paroles et instructions précédentes. « Tout cela » est naturel en français tout en conservant cette portée rétrospective.
- source_word: ἐντέλλομαι
  choice: je vous commande
  rationale: Le présent exprime ici directement l’acte de donner un ordre. Le présent simple français est idiomatique et garde la force du verbe grec.
- source_word: ὑμῖν
  choice: vous
  rationale: Le datif de deuxième personne du pluriel est naturellement intégré en français comme complément indirect dans « je vous commande ».
- source_word: ἵνα
  choice: afin que
  rationale: Cette locution conserve nettement la valeur de but ou de résultat visé de la proposition grecque, sans exclure sa nuance possible de contenu.
- source_word: ἀγαπᾶτε
  choice: vous vous aimiez
  rationale: Le présent du subjonctif grec après ἵνα est rendu par le subjonctif français après « afin que ». Le verbe « aimer » garde le sens direct et durable sans ajouter explicitement l’idée de continuité.
- source_word: ἀλλήλους
  choice: les uns les autres
  rationale: Cette expression rend clairement la réciprocité au sein du groupe et convient au registre johannique.
theological_decisions:
- issue: Rapport entre le commandement et la proposition introduite par ἵνα
  choice: 'La proposition est rendue comme exprimant le but : Jésus commande tout cela afin que les disciples s’aiment les uns les autres.'
  alternative: '« Je vous commande ceci : aimez-vous les uns les autres. »'
  rationale: ἵνα exprime le plus naturellement un but ou un résultat visé, mais peut, dans le style johannique, se rapprocher de l’énoncé du contenu du commandement. Le texte principal conserve la construction finale et la note signale l’autre analyse.
translation_notes:
  register: Français international moderne, digne et accessible. « Tout cela » évite la tournure peu naturelle « je vous commande ces choses » tout en gardant le renvoi pluriel au contexte précédent.
