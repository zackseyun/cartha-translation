  source_fidelity: Le texte rend fidèlement ταῦτα par « tout cela », ἐντέλλομαι par « je vous commande », et conserve la relation finale de ἵνα avec « afin que ». Le subjonctif « vous vous aimiez » correspond bien à ἀγαπᾶτε après ἵνα, et « les uns les autres » rend explicitement la réciprocité de ἀλλήλους. La note signale à juste titre l’analyse possible de la proposition en ἵνα comme quasi-épexégétique.
  naturalness: « Je vous commande tout cela afin que vous vous aimiez les uns les autres » est une formulation compréhensible, digne et naturelle dans un registre biblique moderne. « Tout cela » évite un calque lourd tel que « ces choses », tout en gardant une référence collective aux instructions précédentes.
  terminology: « Commander », « aimer » et « les uns les autres » conviennent au vocabulaire johannique et n’ajoutent aucune interprétation doctrinale. La formulation ne surdétermine ni la portée de l’amour ni le rapport exact entre le commandement et sa finalité.
