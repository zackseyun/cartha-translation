id: JHN.15.9
reference: John 15:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: fr
  text: Comme le Père m’a aimé, moi aussi je vous ai aimés[a]. Demeurez dans mon amour.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire avec un passé simple : « Comme le Père m’aima, moi aussi je vous aimai. » Les deux verbes grecs sont à l’aoriste; le texte principal emploie le passé composé, plus naturel en français moderne et apte à exprimer leur portée actuelle dans ce contexte.'
    reason: alternative_aspectuelle
lexical_decisions:
- source_word: καθὼς
  choice: Comme
  rationale: Introduit naturellement en français la comparaison entre l’amour du Père pour Jésus et celui de Jésus pour ses disciples, sans alourdir la phrase.
- source_word: ἠγάπησέν με ὁ πατήρ
  choice: le Père m’a aimé
  rationale: Le passé composé rend naturellement l’aoriste en français moderne tout en laissant percevoir la portée actuelle de cet amour dans le contexte. « Le Père » conserve la valeur de titre de la désignation johannique.
- source_word: κἀγὼ
  choice: moi aussi
  rationale: Rend à la fois le lien comparatif et l’insistance portée par le pronom grec.
- source_word: ὑμᾶς ἠγάπησα
  choice: je vous ai aimés
  rationale: Le passé composé fait écho au premier verbe et exprime idiomatiquement en français une action passée dont la portée demeure. L’accord « aimés » indique que « vous » est pluriel, comme ὑμᾶς.
- source_word: μείνατε
  choice: Demeurez
  rationale: « Demeurez » est naturel dans un registre biblique moderne et digne, et préserve le motif johannique de la permanence mieux que le plus courant mais moins dense « restez ».
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: dans mon amour
  rationale: Rend directement la préposition, le nom ἀγάπη et le possessif emphatique dans une formulation française claire.
theological_decisions:
- issue: Traduction de ἀγάπη
  choice: amour
  alternative: charité
  rationale: « Amour » est le terme français moderne normal et conserve l’étendue sémantique du grec; « charité » serait ici archaïque ou risquerait d’évoquer principalement l’aide aux nécessiteux.
- issue: Valeur des deux aoristes ἠγάπησέν et ἠγάπησα
  choice: passé composé (« m’a aimé » / « vous ai aimés »)
  alternative: passé simple (« m’aima » / « vous aimai »)
  rationale: Le passé composé est le temps passé naturel du français moderne et convient à l’importance persistante de ces actes d’amour dans le discours. La note signale toutefois que l’aoriste grec ne code pas à lui seul cette portée actuelle.
- issue: Portée de « mon amour »
  choice: conserver la formulation possessive sans l’expliciter
  alternative: « l’amour que j’ai pour vous » ou « votre amour pour moi »
  rationale: Le grec peut faire entendre la sphère de l’amour propre à Jésus sans préciser explicitement s’il s’agit uniquement de son amour envers les disciples ou de leur participation à cet amour. La traduction garde cette tension.
translation_notes:
  register: Français international moderne, clair et digne. « Demeurez » maintient le motif johannique tout en restant compréhensible. Le point entre les deux propositions rend nettement l’appel final sans modifier leur relation logique.
