id: JHN.15.23
reference: John 15:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: fr
  text: Celui qui me hait hait aussi mon Père.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: Celui qui déteste
  rationale: L’article suivi du participe présent a une valeur substantive et désigne de manière générale une personne caractérisée par cette attitude. « Celui qui… » est naturel et conserve le singulier générique.
- source_word: ἐμὲ
  choice: me
  rationale: Le pronom est le complément direct de μισῶν. La forme grecque accentuée n’exige pas ici une tournure française marquée.
- source_word: μισῶν / μισεῖ
  choice: déteste / déteste
  rationale: μισέω exprime la haine ou une forte aversion. « Détester » rend clairement ce sens en français moderne, tandis que la répétition du même verbe préserve celle du grec.
- source_word: καὶ
  choice: aussi
  rationale: Dans cette construction, καί associe la haine envers le Père à celle qui vise Jésus. « Aussi » exprime naturellement cette inclusion sans ajouter de relation causale absente du texte.
- source_word: τὸν πατέρα μου
  choice: mon Père
  rationale: Le possessif français rend naturellement πατέρα μου. La majuscule indique que « Père » désigne ici Dieu dans la relation exprimée par Jésus.
theological_decisions:
- issue: Majuscule à « Père » lorsqu’il désigne Dieu
  choice: mon Père
  alternative: mon père
  rationale: Dans ce contexte johannique, Jésus parle de Dieu comme de son Père. La majuscule clarifie le référent selon l’usage éditorial français sans développer davantage la relation théologique.
- issue: Portée de καί entre les deux haines
  choice: déteste aussi mon Père
  alternative: et déteste mon Père
  rationale: '« Aussi » conserve la portée inclusive naturelle de καί : la haine visant Jésus vise également son Père, sans préciser un mécanisme théologique que le verset ne formule pas.'
translation_notes:
  register: Français international moderne, bref et digne. La structure parallèle et la répétition verbale du grec sont conservées. « Détester » est préféré à « haïr » pour une formulation courante et immédiatement compréhensible, tout en gardant la force négative de μισέω.
