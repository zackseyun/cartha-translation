id: JHN.15.5
reference: John 15:5
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: fr
  text: Moi, je suis la vigne; vous, vous êtes les sarments. Celui qui demeure[a] en moi, et moi en lui[b], porte beaucoup de fruit, car, séparés de moi, vous ne pouvez rien faire.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « reste ». Le verbe grec évoque ici une relation qui se poursuit dans la durée; chez Jean, il est souvent rendu par « demeurer ».
    reason: lexical_alternative
  - marker: b
    text: 'Le grec emploie ici le masculin singulier, « celui qui… en lui », avec une portée représentative : la déclaration s’applique à tout disciple qui demeure en Jésus.'
    reason: grammatical_clarification
lexical_decisions:
- source_word: ἄμπελος
  choice: la vigne
  rationale: « Vigne » est l’équivalent français courant et naturel dans cette métaphore. « Cep » pourrait désigner plus précisément le pied de vigne, mais risquerait de restreindre l’image grecque de la plante dont dépendent les sarments.
- source_word: κλήματα
  choice: les sarments
  rationale: Dans un contexte viticole, κλήματα désigne les branches ou pousses de la vigne. « Sarments » maintient précisément l’image et demeure un terme français largement compréhensible.
- source_word: ὁ μένων
  choice: celui qui demeure
  rationale: Le participe présent exprime une relation qui se prolonge. « Demeure » conserve cette continuité, importante dans l’usage johannique de μένω, tout en restant digne et intelligible en français moderne.
- source_word: ἐν ἐμοὶ … ἐν αὐτῷ
  choice: en moi … en lui
  rationale: La répétition de « en » préserve le langage réciproque et profond du texte grec, sans l’affaiblir en une simple relation d’accompagnement.
- source_word: κἀγώ
  choice: et moi
  rationale: 'La crase signifie « et moi » et maintient la structure réciproque : le disciple demeure en Jésus, et Jésus en lui.'
- source_word: φέρει καρπὸν πολύν
  choice: porte beaucoup de fruit
  rationale: « Porter du fruit » est la collocation française naturelle dans l’image de la vigne; « beaucoup » rend directement l’idée de quantité exprimée par πολύν.
- source_word: χωρὶς ἐμοῦ
  choice: séparés de moi
  rationale: Cette formulation exprime la séparation indiquée par χωρίς et s’accorde avec l’image des sarments détachés de la vigne, sans réduire le propos à une simple absence d’aide.
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: vous ne pouvez rien faire
  rationale: Cette tournure française idiomatique rend clairement l’incapacité exprimée par οὐ δύνασθε et la négation totale de οὐδέν.
theological_decisions:
- issue: Langage johannique de l’habitation réciproque
  choice: « demeure en moi, et moi en lui »
  alternative: « reste avec moi, et moi avec lui »
  rationale: Le choix de « en » respecte la formulation grecque et conserve la tension théologique d’une union réciproque sans tenter de l’expliquer ni de la réduire.
- issue: Masculin singulier représentatif de ὁ μένων et αὐτῷ
  choice: « Celui qui … en lui »
  alternative: « Quiconque … en cette personne »
  rationale: Le masculin singulier correspond à la forme grammaticale grecque et française. Une note précise sa portée générale afin d’éviter de suggérer que la déclaration ne concernerait que les hommes.
- issue: Portée de l’incapacité sans Jésus
  choice: « vous ne pouvez rien faire »
  alternative: « vous ne pouvez produire aucun fruit »
  rationale: Le texte grec dit littéralement « rien faire » et ne limite pas explicitement l’énoncé à la production du fruit. La traduction conserve donc la portée et la tension de la formulation source.
translation_notes:
  register: Français international moderne, naturel et digne. La reprise emphatique « Moi, je…; vous, vous… » reflète les pronoms grecs exprimés. « Sarments » conserve avec précision la métaphore viticole, tandis que la syntaxe reste accessible à un lectorat général.
