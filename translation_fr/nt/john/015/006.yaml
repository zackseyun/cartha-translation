id: JHN.15.6
reference: John 15:6
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: fr
  text: Si quelqu’un ne demeure pas en moi[a], il est jeté dehors comme le sarment et se dessèche. Puis on ramasse ces sarments, on les jette au feu[b] et ils brûlent.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « ne reste pas en moi ». Le verbe grec désigne le fait de rester, de continuer ou de demeurer, terme important dans l’Évangile selon Jean.
    reason: lexical_alternative
  - marker: b
    text: L’image évoque l’exclusion et le feu, mais le verset ne précise pas si elle décrit la perte d’une véritable condition de disciple ou la mise en évidence d’un attachement seulement apparent.
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: demeure
  rationale: « Demeurer » rend le verbe johannique μένω et son idée de continuité relationnelle, tout en restant naturel dans ce contexte en français biblique moderne.
- source_word: ἐν ἐμοί
  choice: en moi
  rationale: La formulation littérale préserve la force relationnelle et théologique de l’expression sans la réduire à « avec moi ».
- source_word: ἐβλήθη ἔξω
  choice: il est jeté dehors
  rationale: Le présent français convient à la portée générale de la condition et conserve le passif ainsi que l’image concrète de l’exclusion.
- source_word: ὡς τὸ κλῆμα
  choice: comme le sarment
  rationale: Dans la métaphore de la vigne, κλῆμα désigne précisément un sarment plutôt qu’une branche quelconque.
- source_word: ἐξηράνθη
  choice: se dessèche
  rationale: Le verbe exprime le fait de devenir sec; « se dessèche » restitue directement cette image.
- source_word: συνάγουσιν
  choice: on ramasse
  rationale: Le pronom indéfini « on » rend naturellement en français le pluriel grec à agents non précisés.
- source_word: αὐτὰ
  choice: ces sarments
  rationale: L’explicitation du référent respecte le pluriel neutre grec et évite l’ambiguïté d’un simple pronom après le singulier « le sarment ».
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: on les jette au feu
  rationale: Cette expression française actuelle conserve l’action concrète et le but indiqué par le grec.
- source_word: καίεται
  choice: ils brûlent
  rationale: Bien que le verbe grec soit au singulier, il peut reprendre collectivement l’image représentative du sarment; le pluriel français s’accorde naturellement avec les sarments ramassés, sans ajouter « entièrement » ou une autre précision absente.
- source_word: τις
  choice: quelqu’un
  rationale: « Quelqu’un » restitue simplement la référence humaine indéfinie et singulière de la condition.
theological_decisions:
- issue: La nature exacte de la personne qui ne demeure pas en Jésus
  choice: Conserver l’avertissement métaphorique sans préciser son statut spirituel antérieur
  alternative: Présenter explicitement soit la perte du salut d’un véritable disciple, soit la révélation d’une appartenance seulement apparente
  rationale: Le verset avertit de l’exclusion et du feu, mais ne tranche pas à lui seul les débats ultérieurs sur l’apostasie, la persévérance ou l’attachement nominal.
translation_notes:
  register: Français international moderne, digne et accessible. « Sarment » maintient avec précision la métaphore viticole. La ponctuation en deux phrases allège la longue coordination grecque sans modifier sa progression.
