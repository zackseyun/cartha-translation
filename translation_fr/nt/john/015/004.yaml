id: JHN.15.4
reference: John 15:4
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: fr
  text: Demeurez en moi[a], et moi en vous. De même que le sarment ne peut porter de fruit par lui-même s’il ne demeure sur le cep, vous non plus, si vous ne demeurez pas en moi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Restez en moi, et moi en vous. » Le verbe grec μένω exprime l’idée de rester, de continuer ou de demeurer.'
    reason: alternative lexicale
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: demeurez / demeure / demeurez
  rationale: « Demeurer » rend de façon cohérente le verbe μένω et conserve à la fois l’idée de continuité et la dimension relationnelle centrale dans ce passage.
- source_word: ἐν ἐμοί
  choice: en moi
  rationale: La préposition « en » préserve l’image d’union et de participation, plutôt que de la réduire à la proximité exprimée par « avec moi ».
- source_word: κἀγὼ ἐν ὑμῖν
  choice: et moi en vous
  rationale: Cette formulation conserve l’ellipse du grec, qui n’exprime aucun verbe dans la seconde proposition, sans transformer celle-ci en promesse explicitement formulée.
- source_word: τὸ κλῆμα
  choice: le sarment
  rationale: « Sarment » est le terme français précis pour une branche de vigne et convient naturellement à l’image viticole.
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: ne peut porter de fruit
  rationale: Cette tournure française naturelle conserve explicitement l’idée d’incapacité exprimée par δύναμαι ainsi que l’expression métaphorique « porter du fruit ».
- source_word: ἀφ’ ἑαυτοῦ
  choice: par lui-même
  rationale: Cette expression rend idiomatiquement l’idée que le sarment ne saurait produire du fruit indépendamment de la vigne.
- source_word: ἐν τῇ ἀμπέλῳ
  choice: sur le cep
  rationale: Dans l’image concrète de la vigne, un sarment demeure « sur le cep » en français. Cette adaptation idiomatique exprime la relation spatiale indiquée par ἐν sans ajouter une explication telle que « attaché ».
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: vous non plus
  rationale: La capacité de porter du fruit est sous-entendue à partir de la proposition précédente. Le français peut conserver cette ellipse de manière claire et naturelle.
theological_decisions:
- issue: Sens de μένω dans le contexte de l’union entre Jésus et ses disciples
  choice: demeurer
  alternative: rester
  rationale: « Demeurer » est compréhensible en français moderne tout en gardant la profondeur relationnelle, la continuité et la réciprocité de l’image. « Rester » est possible, mais met moins nettement en valeur cette polysémie.
- issue: Proposition réciproque elliptique κἀγὼ ἐν ὑμῖν
  choice: et moi en vous
  alternative: et je demeurerai en vous
  rationale: Le grec ne précise ni verbe ni temps dans cette proposition. Maintenir l’ellipse préserve son ambiguïté et évite d’imposer une lecture exclusivement promissive ou conditionnelle.
translation_notes:
  register: Français international moderne, naturel et digne. « Sarment » et « cep » assurent la précision de l’image viticole. La répétition de « demeurer » reflète délibérément celle du verbe grec μένω, et les deux ellipses du texte source sont conservées autant que le permet un français clair.
