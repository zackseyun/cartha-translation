id: JHN.15.27
reference: John 15:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς δὲ μαρτυρεῖτε, ὅτι ἀπ’ ἀρχῆς μετ’ ἐμοῦ ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: fr
  text: Et vous aussi, vous témoignez[a], car vous êtes avec moi depuis le commencement.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « rendez témoignage ». La forme grecque peut être comprise comme un impératif.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: Et vous aussi
  rationale: 'Cette formulation rend à la fois le lien avec la phrase précédente et l’insistance portée par le pronom explicite : les disciples témoignent eux aussi, avec l’Esprit mentionné au verset précédent.'
- source_word: μαρτυρεῖτε
  choice: vous témoignez
  rationale: « Témoigner » est naturel en français moderne et conserve le sens de rendre un témoignage. La forme grecque peut être comprise comme un indicatif ou un impératif, d’où la note.
- source_word: ὅτι
  choice: car
  rationale: Dans ce contexte, ὅτι introduit le motif du témoignage des disciples. « Car » exprime clairement ce rapport causal dans un registre courant et digne.
- source_word: ἀπ’ ἀρχῆς
  choice: depuis le commencement
  rationale: La préposition marque ici le point de départ d’une situation qui se prolonge. « Le commencement » préserve la formulation johannique sans préciser davantage de quel commencement il s’agit.
- source_word: μετ’ ἐμοῦ ἐστε
  choice: vous êtes avec moi
  rationale: Le présent français associé à « depuis » exprime naturellement un état commencé dans le passé et toujours en cours, tout en restant formellement proche du présent grec.
theological_decisions:
- issue: Portée de « depuis le commencement »
  choice: Conserver la formule sans en préciser explicitement le référent
  alternative: 'Expliciter : « depuis le commencement de mon ministère » ou « depuis que j’ai commencé mon œuvre »'
  rationale: Le contexte suggère la présence historique des disciples auprès de Jésus depuis le début de son activité, mais le texte grec ne donne pas cette précision. La traduction préserve donc l’ouverture de l’expression.
- issue: Valeur verbale de μαρτυρεῖτε
  choice: 'Indicatif : « vous témoignez »'
  alternative: 'Impératif : « témoignez » ou « rendez témoignage »'
  rationale: La forme grecque permet grammaticalement les deux lectures. L’indicatif s’accorde bien avec le témoignage de l’Esprit énoncé au verset précédent, mais l’impératif demeure une possibilité réelle et est signalé en note.
translation_notes:
  register: Français international moderne, clair et digne. Le présent « vous êtes » avec « depuis » est idiomatique en français et rend directement la continuité exprimée par le grec, sans recourir à une transposition temporelle.
