  text: ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: fr
  text: Vous, vous êtes déjà purs à cause de la parole que je vous ai dite[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « par la parole que je vous ai dite ».'
    reason: 'Alternative lexicale : διά peut être compris avec une nuance instrumentale plutôt que strictement causale.'
lexical_decisions:
- source_word: ἤδη
  choice: déjà
  rationale: Exprime un état présent déjà établi et conserve le contraste avec l’action de nettoyer ou de tailler évoquée juste avant.
- source_word: ὑμεῖς
  choice: vous, vous
  rationale: Le redoublement naturel en français rend l’insistance du pronom grec explicitement exprimé.
- source_word: καθαροί
  choice: purs
  rationale: En français, « purs » convient naturellement à des personnes et conserve l’idée de purification; « propres » risquerait une lecture surtout matérielle, tandis que le contexte immédiat maintient lui-même le lien avec l’image de la vigne.
- source_word: διὰ τὸν λόγον
  choice: à cause de la parole
  rationale: διά avec l’accusatif exprime ici naturellement la cause; « à cause de » préserve cette valeur sans exclure entièrement la portée instrumentale possible.
- source_word: λόγον
  choice: parole
  rationale: Rendu direct qui conserve le vocabulaire johannique et évite de préciser indûment « message » ou « enseignement ».
- source_word: ὃν λελάληκα ὑμῖν
  choice: que je vous ai dite
  rationale: Le passé composé rend le parfait grec comme une parole prononcée dont l’effet demeure; l’accord de « dite » avec « parole » est idiomatique en français.
theological_decisions:
- issue: Nature de la pureté des disciples
  choice: Présenter leur pureté comme un état présent lié à la parole de Jésus, sans lui imposer une catégorie doctrinale technique.
  alternative: Préciser qu’il s’agit exclusivement d’une purification sacramentelle ou d’une déclaration juridique de justification.
  rationale: Le contexte de la vigne et de la taille emploie une image ouverte, et le verset rattache cet état à la parole de Jésus. La traduction doit conserver cette tension théologique.
- issue: Valeur de διά avec l’accusatif
  choice: « à cause de », valeur causale
  alternative: « par », valeur instrumentale
  rationale: La construction grecque favorise la cause, mais une nuance de moyen reste assez plausible pour être signalée en note plutôt que supprimée.
translation_notes:
  register: Français international moderne, digne et accessible. Le redoublement « Vous, vous » marque l’emphase sans lourdeur excessive; « parole » conserve la diction johannique.
