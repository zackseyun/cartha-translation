source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: fr
  text: Il enlève[a] tout sarment en moi qui ne porte pas de fruit ; et il taille[b] tout sarment qui porte du fruit afin qu’il porte davantage de fruit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « il retire ». Certains comprennent ici le verbe grec au sens de « il le soulève ».
    reason: alternative_reading
  - marker: b
    text: Le verbe traduit par « taille » peut aussi signifier « purifie ». Ce sens convient à l’image de la vigne et annonce le mot « purs » au verset suivant.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: Tout sarment
  rationale: Avec le nom singulier, πᾶν a une valeur distributive. « Tout sarment » est naturel dans l’image de la vigne et garde cette portée individualisante.
- source_word: ἐν ἐμοὶ
  choice: en moi
  rationale: La formulation directe préserve le langage johannique et son ouverture théologique sans l’expliciter par « uni à moi » ou « attaché à moi ».
- source_word: μὴ φέρον καρπὸν
  choice: qui ne porte pas de fruit
  rationale: La proposition relative rend clairement le participe grec tout en conservant l’idée de porter ou produire du fruit.
- source_word: αἴρει
  choice: il l’enlève
  rationale: Dans le contraste viticole avec καθαίρει, « enlève » exprime naturellement l’action exercée sur le sarment improductif. Le sens possible « soulève » est signalé en note.
- source_word: καρπός
  choice: fruit
  rationale: C’est l’équivalent français normal dans cette métaphore viticole.
- source_word: καθαίρει
  choice: il le taille
  rationale: Dans le contexte de la vigne, « tailler » désigne clairement l’action horticole visée. Une note conserve aussi le sens lexical de purification et l’écho avec « purs » au verset suivant.
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: afin qu’il porte encore plus de fruit
  rationale: « Afin que » marque le but exprimé par ἵνα. « Encore plus de fruit » rend naturellement le comparatif πλείονα et le progrès recherché.
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: et tout sarment qui porte du fruit
  rationale: Le nom « sarment », sous-entendu en grec, est repris en français pour préserver la clarté et le parallélisme.
theological_decisions:
- issue: Sens de αἴρει dans la première proposition
  choice: il l’enlève
  alternative: il le retire ; il le soulève
  rationale: « Enlève » rend le contraste immédiat entre le traitement du sarment improductif et la taille du sarment productif, sans préciser davantage la portée théologique de l’image. « Soulève » demeure une interprétation lexicale possible et figure donc en note.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe parallèle conserve la force de l’image, tandis que les notes préservent les ambiguïtés lexicales réelles sans imposer une lecture confessionnelle.
