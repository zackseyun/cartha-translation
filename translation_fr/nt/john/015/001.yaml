id: JHN.15.1
reference: John 15:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ἡ ἄμπελος ἡ ἀληθινή, καὶ ὁ πατήρ μου ὁ γεωργός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: fr
  text: Moi, je suis la vraie vigne, et mon Père est le vigneron[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le mot grec désigne plus généralement une personne qui cultive la terre ; ici, dans le contexte de la vigne, on pourrait aussi traduire par « cultivateur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: Moi, je suis
  rationale: Cette tournure française naturelle rend le pronom sujet grec explicite et emphatique sans alourdir excessivement la déclaration johannique.
- source_word: ἄμπελος
  choice: vigne
  rationale: « Vigne » est l’équivalent français courant et consacré dans cette image ; il conserve la métaphore sans l’expliciter.
- source_word: ἀληθινή
  choice: vraie
  rationale: « Vraie » préserve la portée johannique de ce qui est authentique et correspond pleinement à la réalité de Dieu, sans imposer une explication théologique.
- source_word: ὁ πατήρ μου
  choice: mon Père
  rationale: La majuscule signale naturellement en français qu’il s’agit de Dieu, dans sa relation personnelle avec Jésus.
- source_word: ὁ γεωργός
  choice: le vigneron
  rationale: Le terme grec désigne celui qui cultive la terre. Dans le contexte précis d’une vigne, « vigneron » est idiomatique, accessible et fidèle à l’image.
theological_decisions:
- issue: L’identification métaphorique dans la parole « je suis » de Jésus
  choice: 'Conserver directement l’image : « Moi, je suis la vraie vigne »'
  alternative: « Je suis la vigne véritable »
  rationale: La formulation retenue maintient la métaphore et la résonance du vocabulaire johannique sans développer ni résoudre son symbolisme dans la traduction.
- issue: Le rôle du Père exprimé par γεωργός
  choice: « le vigneron » dans le texte principal
  alternative: « le cultivateur » ou « celui qui cultive la vigne »
  rationale: « Vigneron » adapte justement le sens général de γεωργός à l’image immédiate de la vigne, sans y ajouter d’interprétation doctrinale.
translation_notes:
  register: Français international moderne, digne et accessible. « Moi, je suis » garde l’emphase du grec ; « vraie vigne » conserve une formulation simple et théologiquement ouverte.
