id: JHN.15.16
reference: John 15:16
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: fr
  text: Ce n’est pas vous qui m’avez choisi[a], mais c’est moi qui vous ai choisis et qui vous ai établis afin que vous alliez, que vous portiez du fruit et que votre fruit demeure[b], afin que le Père[c] vous donne tout ce que vous lui demanderez en mon nom.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « sélectionné » ; le verbe peut aussi se traduire par « élu », mais « choisi » convient au contexte immédiat sans imposer un terme théologique technique.
    reason: lexical_alternative
  - marker: b
    text: Ou « subsiste ». Jean emploie souvent ce verbe au sens de demeurer, de continuer ou de durer ; ici, il souligne que le fruit ne disparaît pas.
    reason: lexical_alternative
  - marker: c
    text: Le grec dit « le Père », et non « mon Père ».
    reason: textual_precision
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: avez choisi / ai choisis
  rationale: « Choisir » rend naturellement le contraste relationnel et l’initiative de Jésus, sans introduire dans le texte principal le terme théologique plus technique « élire ».
- source_word: ἔθηκα
  choice: ai établis
  rationale: Dans ce contexte, τίθημι exprime une désignation en vue d’un but. « Établir » communique cette mission sans la réduire à une ordination ecclésiastique précise.
- source_word: ἵνα
  choice: afin que
  rationale: La locution marque clairement les deux propositions de but et conserve leur enchaînement syntaxique.
- source_word: ὑπάγητε
  choice: vous alliez
  rationale: Cette formulation garde le sens large de « aller » et laisse le contexte préciser la dimension de mission ou d’activité.
- source_word: καρπὸν φέρητε
  choice: vous portiez du fruit
  rationale: L’expression française naturelle préserve la métaphore johannique.
- source_word: μένῃ
  choice: demeure
  rationale: « Demeurer » rend le verbe johannique μένω et évoque ici la continuité ou la durabilité du fruit.
- source_word: ὅ τι ἂν αἰτήσητε
  choice: tout ce que vous demanderez
  rationale: Cette formulation idiomatique exprime la portée indéfinie de la construction grecque avec ἄν.
- source_word: ἐν τῷ ὀνόματί μου
  choice: en mon nom
  rationale: La formule française consacrée préserve la portée relationnelle et théologique sans l’expliciter excessivement.
- source_word: δῷ
  choice: il vous le donne
  rationale: Le présent du subjonctif français dépend naturellement de « afin que » et reflète la proposition grecque de but ou de résultat, sans la transformer en simple futur autonome.
- source_word: τὸν πατέρα
  choice: au Père
  rationale: Le grec porte « le Père », et non « mon Père » ; la traduction respecte cette forme.
theological_decisions:
- issue: Risque de surinterprétation doctrinale de ἐξελεξάμην
  choice: « C’est moi qui vous ai choisis » dans le contexte immédiat du discipulat et de la mission.
  alternative: « C’est moi qui vous ai élus », avec une connotation théologique plus technique.
  rationale: Le verset affirme nettement l’initiative de Jésus, mais « choisis » laisse au contexte plus large le soin d’en préciser la portée doctrinale.
- issue: Portée de ἔθηκα ὑμᾶς
  choice: « Je vous ai établis », compris comme une désignation en vue d’aller et de porter du fruit.
  alternative: « Je vous ai placés » ou une formulation renvoyant explicitement à une ordination.
  rationale: Le contexte indique une mission orientée vers un but, sans préciser ici un office ecclésiastique particulier.
- issue: Force de la dernière proposition introduite par ἵνα
  choice: 'Conserver une proposition de but ou de résultat : « afin que… il vous le donne ».'
  alternative: 'En faire une promesse future autonome : « il vous le donnera ».'
  rationale: La structure grecque relie la demande au Père à l’élection, à l’établissement et au fruit porté ; le subjonctif français préserve ce lien sans affaiblir la promesse.
translation_notes:
  register: Français international moderne, digne et accessible. La phrase conserve le parallélisme et les deux propositions de but du grec. « Ce n’est pas vous… mais c’est moi » restitue l’emphase portée par les pronoms grecs. Le tutoiement pluriel correspond à l’adresse de Jésus aux disciples.
