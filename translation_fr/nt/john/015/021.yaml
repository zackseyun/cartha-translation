id: JHN.15.21
reference: John 15:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: fr
  text: Mais ils vous feront tout cela[a] à cause de mon nom, parce qu’ils ne connaissent pas celui qui m’a envoyé.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : ils feront tout cela contre vous. La tournure grecque peut désigner des actes dirigés contre les disciples dans un sens hostile.'
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque nettement le contraste avec l’affirmation précédente, dans un français naturel.
- source_word: ταῦτα πάντα
  choice: tout cela
  rationale: Rend à la fois la valeur démonstrative et l’idée de totalité sans lourdeur en français.
- source_word: ποιήσουσιν εἰς ὑμᾶς
  choice: ils vous feront tout cela
  rationale: Exprime naturellement des actes dirigés vers les disciples tout en évitant de préciser plus que le grec leur caractère hostile, déjà clair dans le contexte.
- source_word: διὰ τὸ ὄνομά μου
  choice: à cause de mon nom
  rationale: διά avec l’accusatif indique ici la cause. Le maintien de « nom » préserve sa portée représentative, liée à la personne et à l’autorité de Jésus.
- source_word: οὐκ οἴδασιν
  choice: ils ne connaissent pas
  rationale: Préserve la simplicité du grec ainsi que la profondeur relationnelle que le verbe peut avoir chez Jean.
- source_word: τὸν πέμψαντά με
  choice: celui qui m’a envoyé
  rationale: Rend naturellement le participe substantivé sans ajouter explicitement le titre « Père », absent de la formulation grecque.
theological_decisions:
- issue: Référent de « celui qui m’a envoyé »
  choice: Conserver la référence implicite sous la forme « celui qui m’a envoyé ».
  alternative: « le Père qui m’a envoyé »
  rationale: Dans Jean, le référent est clairement le Père, mais le grec emploie ici un participe substantivé et non le nom « Père ». La traduction n’explicite donc pas ce que le texte laisse implicite.
- issue: Portée de « mon nom »
  choice: Conserver littéralement « mon nom ».
  alternative: « à cause de moi » ou « à cause de mon identité »
  rationale: « Nom » représente la personne, l’identité et l’autorité de Jésus; le remplacer par une paraphrase réduirait la résonance johannique.
translation_notes:
  register: Français international moderne, clair et digne. La formulation « ils vous feront tout cela » est idiomatique et garde la relative ouverture de εἰς ὑμᾶς; la note signale explicitement la lecture hostile possible.
