base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: fr
  text: Si je n’étais pas venu et si je ne leur avais pas parlé, ils n’auraient pas de péché[a] ; mais maintenant, ils n’ont aucune excuse pour leur péché[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ils ne seraient pas coupables de péché » ou « ils n’auraient aucune culpabilité ». Le grec dit plus littéralement : « ils n’auraient pas de péché ».'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « ils n’ont aucun prétexte concernant leur péché ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: Si je n’étais pas venu et ne leur avais pas parlé
  rationale: Le plus-que-parfait français exprime naturellement la condition irréelle du passé. « Parler à quelqu’un » rend idiomatiquement λαλέω avec le datif αὐτοῖς.
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: ils n’auraient pas de péché
  rationale: Cette formulation conserve l’expression johannique littérale « avoir du péché » et la valeur conditionnelle de l’imparfait, sans l’expliciter en termes de culpabilité.
- source_word: νῦν δὲ
  choice: mais maintenant
  rationale: Rend directement le contraste marqué entre la situation hypothétique et la réalité présente.
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: ils n’ont aucune excuse
  rationale: « Excuse » est naturel en français moderne dans ce contexte et exprime le motif invoqué pour se justifier ; « prétexte » reste une possibilité lexicale.
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: pour leur péché
  rationale: Avec « avoir une excuse », la préposition « pour » est la tournure française la plus idiomatique, tout en rendant ici la relation exprimée par περί avec le génitif.
theological_decisions:
- issue: ἁμαρτίαν οὐκ εἴχοσαν désigne-t-il une absence absolue de péché ou l’absence de culpabilité liée au rejet de la révélation de Jésus ?
  choice: ils n’auraient pas de péché
  alternative: ils ne seraient pas coupables de péché / ils ne seraient pas responsables de ce péché
  rationale: Le contexte vise la responsabilité suscitée par la venue et les paroles de Jésus, mais le grec dit littéralement « avoir du péché ». Le texte principal préserve cette tension au lieu d’en imposer une interprétation.
translation_notes:
  register: Français international moderne, digne et accessible. La syntaxe conditionnelle est naturelle, tandis que l’expression « avoir du péché », légèrement marquée, est conservée afin de respecter la formulation et l’ambiguïté théologique du grec.
