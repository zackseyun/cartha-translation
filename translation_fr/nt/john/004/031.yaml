  text: ⸀Ἐν τῷ μεταξὺ ἠρώτων αὐτὸν οἱ μαθηταὶ λέγοντες· Ῥαββί, φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: fr
  text: 'Pendant ce temps[a], les disciples le pressaient[b] : « Rabbi[c], mange. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Entre-temps ».
    reason: lexical_alternative
  - marker: b
    text: Le verbe peut aussi se traduire par « lui demandaient » ou « ne cessaient de lui demander » ; ici, le contexte suggère qu’ils pressaient Jésus de manger.
    reason: lexical_alternative
  - marker: c
    text: « Rabbi » est un titre juif employé pour s’adresser à un maître ou enseignant.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: Pendant ce temps
  rationale: Cette locution rend naturellement l’intervalle narratif pendant lequel se déroule la scène, sans alourdir la phrase.
- source_word: ἠρώτων αὐτὸν
  choice: lui demandaient avec insistance
  rationale: L’imparfait grec présente une demande prolongée ou répétée. Le contexte indique qu’ils cherchent à amener Jésus à manger ; « avec insistance » exprime cette nuance sans transformer la demande en ordre.
- source_word: οἱ μαθηταὶ
  choice: les disciples
  rationale: L’article désigne le groupe déjà connu dans le récit ; le référent est clair sans ajout possessif.
- source_word: λέγοντες
  choice: introduit directement par les deux-points
  rationale: En français courant, les deux-points introduisent naturellement les paroles qui précisent la demande ; traduire mécaniquement par « en disant » serait possible mais plus lourd.
- source_word: Ῥαββί
  choice: Rabbi
  rationale: La translittération conserve le titre juif employé pour s’adresser à Jésus dans l’Évangile selon Jean.
- source_word: φάγε
  choice: mange
  rationale: L’impératif singulier est rendu directement, avec la même brièveté que le grec.
