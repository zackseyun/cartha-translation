id: JHN.4.23
reference: John 4:23
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: fr
  text: Mais l’heure vient, et elle est déjà là, où les vrais adorateurs adoreront le Père en esprit et en vérité[a] ; en effet, ce sont de tels adorateurs que le Père cherche.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans l’Esprit » ou « par l’Esprit ». Le grec peut évoquer une adoration animée par l’Esprit Saint, accomplie dans l’esprit humain, ou caractérisée par une réalité spirituelle.
    reason: Préserver l’ambiguïté réelle de ἐν πνεύματι et signaler une lecture pneumatologique possible sans l’imposer dans le texte.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Mais
  rationale: Marque le contraste avec la discussion précédente sur les lieux où adorer, dans un français naturel et concis.
- source_word: ἔρχεται ὥρα
  choice: l’heure vient
  rationale: Conserve le terme johannique « heure » et sa portée eschatologique. En français, l’article défini est idiomatique dans cette tournure malgré l’absence d’article en grec.
- source_word: καὶ νῦν ἐστιν
  choice: et elle est déjà là
  rationale: Exprime naturellement que l’heure annoncée a déjà commencé ; « déjà » rend ici la force contextuelle de νῦν.
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: les vrais adorateurs
  rationale: Préserve le sens johannique de ce qui est authentique ou pleinement conforme à la réalité divine, sans introduire une distinction sectaire.
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: adoreront le Père
  rationale: Rend directement le futur et le complément datif dans un français courant et digne.
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: en esprit et en vérité
  rationale: Maintient les deux substantifs et l’ambiguïté de πνεῦμα, plutôt que de préciser sans nécessité « par l’Esprit » ou de réduire l’expression à un adverbe.
- source_word: καὶ γὰρ
  choice: en effet
  rationale: Introduit naturellement en français la justification donnée par la proposition finale, tout en portant sa nuance d’insistance.
- source_word: τοιούτους ... τοὺς προσκυνοῦντας αὐτόν
  choice: ce sont de tels adorateurs que
  rationale: 'Rend clairement la construction grecque : le Père cherche des personnes de cette sorte, à savoir celles qui l’adorent, sans la lourdeur de « de telles personnes pour l’adorer ».'
- source_word: ζητεῖ
  choice: cherche
  rationale: Le présent simple français rend naturellement le présent grec et évite d’imposer une valeur progressive.
theological_decisions:
- issue: Sens de ἐν πνεύματι
  choice: « en esprit » dans le texte principal
  alternative: « dans l’Esprit » ou « par l’Esprit »
  rationale: 'Le grec sans article permet plusieurs compréhensions théologiquement significatives : l’esprit humain, l’Esprit Saint, ou le caractère spirituel de l’adoration. Le texte principal conserve cette ouverture et la note l’explicite.'
- issue: Portée de « vrais adorateurs »
  choice: 'Sens qualitatif : des adorateurs authentiques'
  alternative: « adorateurs véritables »
  rationale: La formulation préserve le contraste johannique sans suggérer l’appartenance à un groupe confessionnel particulier.
- issue: Objet de la recherche du Père
  choice: « ce sont de tels adorateurs que le Père cherche »
  alternative: « le Père cherche de telles personnes pour l’adorer »
  rationale: La construction retenue comprend le participe τοὺς προσκυνοῦντας comme précisant l’identité des personnes recherchées, sans transformer explicitement la phrase en recherche de candidats appelés à commencer à adorer.
translation_notes:
  register: Français international moderne, naturel et digne. La tournure « l’heure vient » conserve le vocabulaire caractéristique de Jean ; « elle est déjà là » clarifie idiomatiquement la présence actuelle de cette heure. Le point-virgule maintient le lien logique étroit entre l’annonce et sa justification.
