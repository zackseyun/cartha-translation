id: JHN.4.21
reference: John 4:21
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: fr
  text: 'Jésus lui dit : « Crois-moi[a], femme[b] : l’heure[c] vient où vous n’adorerez le Père ni sur cette montagne ni à Jérusalem. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Fais-moi confiance ». Le verbe grec peut signifier croire ce que quelqu’un dit ou placer sa confiance en cette personne.
    reason: lexical_alternative
  - marker: b
    text: Dans ce contexte, « femme » est une manière respectueuse de s’adresser à quelqu’un, et non une parole impolie.
    reason: cultural_note
  - marker: c
    text: Littéralement, « une heure vient ». Le grec n’emploie pas l’article ici, mais Jean utilise souvent « l’heure » comme expression thématique pour un moment décisif du projet de Dieu.
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: Crois-moi
  rationale: L’impératif présent suivi du pronom au datif appelle directement la femme à tenir pour vrai ce que Jésus va dire. « Crois-moi » est naturel en français et conserve le lien lexical avec le verbe πιστεύω dans Jean ; « Fais-moi confiance » reste possible, mais souligne davantage la confiance relationnelle.
- source_word: γύναι
  choice: femme
  rationale: Le vocatif signifie littéralement « femme ». Dans ce contexte, cette interpellation est respectueuse et non méprisante. La traduction littérale évite d’ajouter une nuance affective ou sociale absente du grec.
- source_word: ἔρχεται ὥρα
  choice: l’heure vient
  rationale: Cette formulation française naturelle conserve le motif johannique de « l’heure », qui désigne souvent un moment décisif. Le grec n’emploie toutefois pas l’article, d’où la variante signalée en note.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: sur cette montagne
  rationale: Avec une montagne comme lieu, le français idiomatique emploie « sur ». Le démonstratif « cette » maintient le renvoi au lieu saint samaritain évoqué dans le contexte.
- source_word: ἐν Ἱεροσολύμοις
  choice: à Jérusalem
  rationale: La préposition française usuelle devant un nom de ville est « à ». La forme grecque plurielle est une forme conventionnelle du nom de Jérusalem et ne doit pas être reproduite comme un pluriel.
- source_word: προσκυνήσετε
  choice: vous adorerez
  rationale: Le futur actif à la deuxième personne du pluriel est conservé. Dans le contexte de Jean 4, « adorer » exprime clairement l’acte religieux visé, mieux qu’une traduction limitée au geste de se prosterner.
- source_word: τῷ πατρί
  choice: le Père
  rationale: Dans ce contexte johannique, le terme désigne Dieu en tant que Père. La majuscule indique qu’il s’agit du titre divin sans développer davantage l’interprétation.
- source_word: οὔτε … οὔτε
  choice: ni … ni
  rationale: La paire corrélative française « ni … ni » conserve le contraste entre la montagne samaritaine et Jérusalem comme lieux d’adoration.
theological_decisions:
- issue: Ton de l’interpellation γύναι
  choice: Traduire littéralement par « femme » et expliquer le ton en note
  alternative: « Madame » ou « chère femme »
  rationale: Le texte ne présente pas Jésus comme impoli. Garder le terme littéral préserve la formulation grecque, tandis que la note prévient une lecture péjorative sans introduire dans le texte une nuance absente de la source.
- issue: Motif johannique de ὥρα
  choice: Conserver « heure »
  alternative: « moment » ou « temps »
  rationale: « Heure » maintient le vocabulaire thématique de Jean et la tension liée au tournant prochain dans l’adoration, sans préciser dans la traduction ce que le verset laisse à son contexte.
- issue: Portée du pluriel προσκυνήσετε
  choice: Conserver « vous adorerez », au pluriel
  alternative: Employer le singulier « tu adoreras » en accord avec l’interlocutrice immédiate
  rationale: 'La forme grecque est explicitement plurielle : Jésus s’adresse à la femme tout en incluant un groupe plus large. Le pluriel doit donc rester visible sans que ce groupe soit défini plus précisément.'
translation_notes:
  register: 'Français international moderne, digne et accessible. La phrase suit l’ordre naturel du français tout en conservant les éléments théologiquement marquants : « femme », « heure », le pluriel « vous » et l’opposition entre les deux lieux d’adoration.'
