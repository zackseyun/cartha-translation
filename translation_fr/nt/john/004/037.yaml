  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: fr
  text: 'Car en cela, cette parole[a] est vraie : « L’un sème et un autre moissonne. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ce proverbe est vrai ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: en cela
  rationale: Conserve le renvoi démonstratif à la situation évoquée, dans une formulation française concise et naturelle.
- source_word: γὰρ
  choice: car
  rationale: Marque que cette affirmation explique ou fonde ce qui précède.
- source_word: ὁ λόγος
  choice: ce proverbe
  rationale: Dans ce contexte, λόγος désigne une maxime reconnue. « Proverbe » rend naturellement cette valeur, sans faire de λόγος un titre théologique.
- source_word: ἀληθινός
  choice: vrai
  rationale: Exprime la validité de la maxime dans le contexte.
- source_word: ὅτι
  choice: ':'
  rationale: Les deux-points introduisent naturellement en français le contenu de la maxime.
- source_word: ἄλλος ... καὶ ἄλλος
  choice: l’un ... et un autre
  rationale: Préserve le contraste entre deux acteurs distincts sans préciser leur identité.
- source_word: ὁ σπείρων
  choice: sème
  rationale: Le verbe au présent rend naturellement le participe substantivé grec dans une maxime française, tout en gardant l’action au premier plan.
- source_word: ὁ θερίζων
  choice: moissonne
  rationale: Forme un parallèle idiomatique avec « sème » et rend l’action exprimée par le participe présent grec.
theological_decisions:
- issue: Identité du semeur et du moissonneur
  choice: Laisser la maxime générale sans identifier ses acteurs dans le verset.
  alternative: Préciser qu’il s’agit de Jésus, des prophètes, de Jean-Baptiste ou des disciples.
  rationale: Le grec ne nomme pas ici les acteurs. Leur identification relève de l’application contextuelle et ne doit pas être introduite dans la traduction.
translation_notes:
  register: Français international moderne, digne et proverbial. La formulation verbale « l’un sème, et un autre moissonne » est plus naturelle que des participes substantivés en français, tout en préservant le parallélisme et la distinction des acteurs.
