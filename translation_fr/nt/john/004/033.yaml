  text: ἔλεγον οὖν οἱ μαθηταὶ πρὸς ἀλλήλους· Μή τις ἤνεγκεν αὐτῷ φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: fr
  text: 'Les disciples se disaient donc entre eux : « Quelqu’un lui aurait-il apporté à manger[a] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'La question grecque introduite par μή laisse attendre une réponse négative. Autre traduction possible : « Personne ne lui aurait apporté à manger, tout de même ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: se disaient
  rationale: L’imparfait grec présente les paroles comme un échange en cours; l’imparfait français et la forme pronominale rendent naturellement cette réciprocité.
- source_word: οὖν
  choice: donc
  rationale: Le connecteur marque ici la suite logique et narrative par rapport aux paroles précédentes de Jésus.
- source_word: οἱ μαθηταί
  choice: les disciples
  rationale: « Disciples » est le terme français usuel et précis dans le contexte johannique.
- source_word: πρὸς ἀλλήλους
  choice: les uns aux autres
  rationale: Cette expression rend explicitement la réciprocité de l’échange au sein du groupe.
- source_word: Μή τις
  choice: Quelqu’un… aurait-il
  rationale: La tournure interrogative au conditionnel exprime naturellement en français l’étonnement et le doute des disciples, tandis qu’une note précise que μή oriente vers une réponse négative.
- source_word: ἤνεγκεν
  choice: apporté
  rationale: Dans ce contexte, le verbe désigne le fait d’apporter de la nourriture à Jésus.
- source_word: αὐτῷ
  choice: lui
  rationale: Le pronom datif français rend naturellement le bénéficiaire de l’action.
- source_word: φαγεῖν
  choice: à manger
  rationale: Cette expression idiomatique française restitue l’infinitif grec employé substantivement, sans préciser davantage la nourriture.
