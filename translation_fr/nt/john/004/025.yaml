id: JHN.4.25
reference: John 4:25
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: fr
  text: 'La femme lui dit : « Je sais que le Messie, celui qu’on appelle Christ[a], vient. Quand il viendra, il nous annoncera tout. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Littéralement : « Messie, celui qu’on appelle Christ ». « Messie » vient d’un titre sémitique ; « Christ » vient de son équivalent grec. Tous deux signifient « oint ».'
    reason: Préserver et expliquer la distinction lexicale que Jean établit entre Μεσσίας et χριστός.
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec se rend naturellement par le présent de narration en français; « dit » conserve ici une narration vive et idiomatique.
- source_word: γυνή
  choice: la femme
  rationale: Dans le contexte, il s’agit de la femme samaritaine; « la femme » est précis et naturel.
- source_word: Οἶδα
  choice: Je sais
  rationale: Rendu direct et courant exprimant la connaissance assurée.
- source_word: Μεσσίας
  choice: le Messie
  rationale: Le titre sémitique est traditionnellement et clairement rendu en français par « le Messie ».
- source_word: ἔρχεται
  choice: vient
  rationale: Le présent grec à portée future exprime une venue attendue; « vient » préserve son immédiateté.
- source_word: ὁ λεγόμενος χριστός
  choice: celui qu’on appelle Christ
  rationale: Cette formulation préserve la distinction explicative entre le terme sémitique « Messie » et son équivalent grec χριστός, passé en français sous la forme « Christ ».
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: Quand il viendra
  rationale: Le futur français rend naturellement l’éventualité future; le pronom suffit sans alourdir l’emphase de ἐκεῖνος.
- source_word: ἀναγγελεῖ
  choice: il nous annoncera
  rationale: « Annoncer » exprime le fait de faire connaître pleinement et correspond de près au verbe grec.
- source_word: ἡμῖν
  choice: nous
  rationale: Le pronom français placé avant le verbe rend naturellement le complément indirect grec.
- source_word: ἅπαντα
  choice: tout
  rationale: « Tout » est le rendu français idiomatique et global de ἅπαντα sans préciser indûment la nature des choses révélées.
theological_decisions:
- issue: Distinction entre Μεσσίας et χριστός dans la glose explicative
  choice: Rendre Μεσσίας par « Messie » et χριστός par « Christ » dans le texte, avec une note explicative.
  alternative: Rendre les deux termes par « Messie », ce qui effacerait la fonction bilingue de la glose grecque.
  rationale: Jean met côte à côte le titre sémitique translittéré et son équivalent grec. Employer deux formes françaises reconnues permet de conserver cette structure explicative sans leur attribuer deux sens théologiques différents.
- issue: Portée de ἅπαντα
  choice: Conserver l’expression générale « tout ».
  alternative: Préciser « toutes choses » ou « tout ce qui concerne le culte », ce dernier choix limitant le sens selon le contexte.
  rationale: Le grec demeure global; la traduction ne doit pas restreindre explicitement ce que le Messie fera connaître.
translation_notes:
  register: Français international moderne, clair et digne. Le discours reste naturel, tandis que le tiret met en valeur la glose explicative de Jean. La note évite que « Messie » et « Christ » soient compris comme deux titres différents dans ce passage.
