  text: ἀφῆκεν οὖν τὴν ὑδρίαν αὐτῆς ἡ γυνὴ καὶ ἀπῆλθεν εἰς τὴν πόλιν καὶ λέγει τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/028.yaml
  text: So the woman left her water jar and went into the town and says to the people,
translation:
  language: fr
  text: 'La femme laissa donc sa jarre, partit pour la ville et dit aux gens :'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρία
  choice: jarre
  rationale: Désigne ici le récipient à eau que la femme était venue remplir ; « jarre » est naturel et précis en français courant.
- source_word: ἀπῆλθεν εἰς τὴν πόλιν
  choice: retourna dans la ville
  rationale: Le verbe signifie qu’elle partit ou s’en alla vers la ville ; dans le contexte, « retourna » exprime naturellement son déplacement sans ajouter d’idée théologique.
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec anime le récit. Le passé simple est son équivalent narratif naturel en français et s’accorde avec les deux verbes précédents.
- source_word: τοῖς ἀνθρώποις
  choice: aux gens
  rationale: Le pluriel peut désigner les personnes de la ville sans préciser leur sexe ; « aux gens » préserve cette portée générale.
theological_decisions: []
translation_notes:
  register: Français international moderne, simple et digne. La ponctuation finale introduit directement les paroles rapportées au verset suivant. Aucun appel de note n’est nécessaire.
