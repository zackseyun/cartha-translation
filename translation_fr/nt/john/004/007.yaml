  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: fr
  text: 'Une femme de Samarie vint puiser de l’eau. Jésus lui dit[a] : « Donne-moi à boire. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, plus littéralement : « vient… dit » ; le grec emploie ici des présents historiques dans le récit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: vint
  rationale: Le présent grec est un présent historique fréquent dans le récit. Le passé simple convient au registre narratif français et exprime naturellement la succession des événements.
- source_word: γυνὴ
  choice: une femme
  rationale: Dans ce contexte, le nom désigne une personne de sexe féminin non encore identifiée, et non spécialement une épouse.
- source_word: ἐκ τῆς Σαμαρείας
  choice: de Samarie
  rationale: Cette formulation rend directement l’origine géographique indiquée par ἐκ, sans expliciter davantage que le texte grec.
- source_word: ἀντλῆσαι ὕδωρ
  choice: puiser de l’eau
  rationale: L’infinitif exprime le but de sa venue. « Puiser de l’eau » est l’expression française naturelle pour tirer de l’eau d’un puits.
- source_word: λέγει αὐτῇ
  choice: lui dit
  rationale: Comme ἔρχεται, λέγει est un présent historique. Le passé simple assure une narration française fluide tout en conservant l’enchaînement du grec.
- source_word: Δός μοι πεῖν
  choice: Donne-moi à boire
  rationale: La tournure française idiomatique conserve la demande directe exprimée par l’impératif suivi de l’infinitif, sans ajouter l’idée d’un récipient ou d’une quantité.
theological_decisions:
- issue: Portée de « Samarie »
  choice: La femme est dite « de Samarie », conformément à la formulation géographique du grec.
  alternative: « une Samaritaine » ou « de la ville de Samarie »
  rationale: Ce verset ne la qualifie pas explicitement de « Samaritaine » et ne précise pas « la ville de Samarie ». La traduction évite donc d’introduire dans le texte principal une identification ethnique ou une précision géographique supplémentaire, même si le contexte plus large les éclaire.
translation_notes:
  register: Français moderne, digne et accessible. Le passé simple est retenu pour les présents historiques, car il demeure naturel dans une narration biblique écrite. « Donne-moi à boire » est direct et idiomatique.
