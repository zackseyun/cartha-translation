id: JHN.4.45
reference: John 4:45
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: fr
  text: Quand donc il arriva en Galilée, les Galiléens lui firent bon accueil[a], ayant vu tout ce qu’il avait fait à Jérusalem pendant la fête[b] ; car eux aussi étaient allés à la fête.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « le reçurent ». Le verbe grec peut désigner le fait de recevoir quelqu’un ou de lui réserver un accueil favorable ; ici, le contexte suggère un bon accueil.
    reason: lexical_alternative
  - marker: b
    text: Ou « la célébration ». Le mot grec désigne une fête religieuse ; d’après le contexte, il s’agit probablement de la fête de la Pâque à Jérusalem.
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: Quand donc
  rationale: « Donc » conserve la fonction de progression et de liaison narrative de οὖν, tandis que « quand » rend naturellement la proposition temporelle.
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: il arriva en Galilée
  rationale: Cette formulation française exprime naturellement l’entrée et l’arrivée dans la région visées par ἔρχομαι avec εἰς.
- source_word: ἐδέξαντο αὐτὸν
  choice: lui firent bon accueil
  rationale: δέχομαι désigne ici une réception favorable. « Faire bon accueil » exprime clairement cette nuance sociale sans aller jusqu’à une acceptation de foi.
- source_word: οἱ Γαλιλαῖοι
  choice: les Galiléens
  rationale: Désignation géographique directe, concise et courante.
- source_word: πάντα ἑωρακότες ὅσα
  choice: car ils avaient vu tout ce que
  rationale: Le participe parfait indique une observation antérieure qui explique l’accueil présent. Une proposition causale est plus naturelle en français tout en conservant ce lien contextuel.
- source_word: ἐποίησεν
  choice: il avait fait
  rationale: Le plus-que-parfait marque clairement que les actes accomplis à Jérusalem précèdent l’accueil en Galilée.
- source_word: ἐν Ἱεροσολύμοις
  choice: à Jérusalem
  rationale: Formulation locative française standard avec un nom de ville.
- source_word: ἐν τῇ ἑορτῇ
  choice: pendant la fête
  rationale: « Pendant » explicite naturellement la valeur temporelle de ἐν, et « fête » convient à une célébration religieuse juive.
- source_word: καὶ αὐτοὶ γὰρ
  choice: eux aussi, en effet
  rationale: « Eux aussi » conserve l’emphase inclusive d’αὐτοὶ καί, et « en effet » rend la valeur explicative de γάρ.
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: étaient allés à la fête
  rationale: Le plus-que-parfait situe leur déplacement avant l’arrivée de Jésus en Galilée; « aller à la fête » est idiomatique en français.
theological_decisions:
- issue: Nature de l’accueil réservé à Jésus
  choice: lui firent bon accueil
  alternative: le reçurent
  rationale: Le contexte suggère une réception favorable, mais le texte ne dit pas explicitement qu’il s’agit d’une foi authentique. La formulation choisie préserve cette tension narrative.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase causale remplace le participe grec pour assurer la clarté, tandis que les temps verbaux maintiennent l’ordre des événements. Les deux occurrences de « la fête » sont conservées afin de refléter la répétition du texte source.
