id: JHN.4.29
reference: John 4:29
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: fr
  text: Venez voir un homme qui m’a dit tout ce que j’ai fait. Serait-ce le Messie[a] ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « le Christ ».'
    reason: Traduction traditionnelle possible du titre grec χριστός.
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: Venez voir
  rationale: Cette tournure française naturelle conserve l’invitation directe exprimée par les deux impératifs, sans recourir à l’archaïsme « voyez » au sens de « voici ».
- source_word: ἄνθρωπον
  choice: un homme
  rationale: Le nom grec désigne ici une personne de sexe masculin et renvoie à Jésus; « un homme » est précis et naturel.
- source_word: ὃς εἶπέ μοι
  choice: qui m’a dit
  rationale: Avec le complément qui suit, λέγω se rend naturellement en français par « dire à quelqu’un »; le passé composé convient au témoignage oral.
- source_word: πάντα ὅσα
  choice: tout ce que
  rationale: La formulation restitue de façon idiomatique l’idée englobante de la construction grecque.
- source_word: ἐποίησα
  choice: j’ai fait
  rationale: Le passé composé exprime naturellement en français les actes passés de la femme dont les conséquences restent pertinentes dans son témoignage.
- source_word: μήτι
  choice: Ne serait-ce pas
  rationale: La question négative au conditionnel préserve à la fois l’hésitation suggérée par μήτι et l’invitation adressée aux auditeurs à envisager cette possibilité.
- source_word: ὁ χριστός
  choice: le Messie
  rationale: Χριστός fonctionne ici comme le titre messianique attendu dans le contexte juif; « le Messie » en communique directement le sens en français.
theological_decisions:
- issue: Traduction du titre Χριστός
  choice: le Messie
  alternative: le Christ
  rationale: Le terme est employé comme un titre et non comme un nom propre. « Le Messie » rend son sens dans le contexte, tandis que « le Christ » demeure une traduction traditionnelle possible, signalée en note.
- issue: Force de la question introduite par μήτι
  choice: Ne serait-ce pas le Messie ?
  alternative: Serait-ce le Messie ?
  rationale: La négation française conserve la réserve ou l’attente négative associée à μήτι sans transformer la parole de la femme en affirmation catégorique.
translation_notes:
  register: Français international moderne, oral et digne. « Venez voir » convient à l’appel lancé aux habitants; la seconde phrase garde le caractère prudent et interrogatif du grec.
