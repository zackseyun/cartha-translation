id: JHN.4.40
reference: John 4:40
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: fr
  text: Ainsi, lorsque les Samaritains vinrent le trouver, ils lui demandèrent[a] de rester avec eux, et il resta là deux jours.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Le verbe grec est à l’imparfait : il peut suggérer qu’ils renouvelaient ou prolongeaient leur demande.'
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: ὡς οὖν
  choice: Ainsi, lorsque
  rationale: « Lorsque » exprime la relation temporelle de ὡς, tandis que « ainsi » conserve la liaison logique et narrative portée par οὖν, dans un français naturel.
- source_word: ἦλθον πρὸς αὐτὸν
  choice: vinrent le trouver
  rationale: Cette formulation française exprime naturellement le mouvement vers une personne indiqué par ἔρχομαι avec πρός, sans alourdir la phrase.
- source_word: οἱ Σαμαρῖται
  choice: les Samaritains
  rationale: Désignation directe et courante du groupe mentionné dans le texte grec.
- source_word: ἠρώτων
  choice: ils lui demandèrent
  rationale: Le passé simple convient à la narration française. L’imparfait grec peut toutefois évoquer une demande prolongée ou répétée, nuance signalée en note.
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: de rester chez eux
  rationale: « Rester » rend naturellement μένω, et « chez eux » exprime ici la proximité ou le séjour auprès des Samaritains indiqué par παρά avec le datif.
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: et il resta là
  rationale: La formulation conserve le même verbe français pour μεῖναι et ἔμεινεν et représente explicitement ἐκεῖ par « là ».
- source_word: δύο ἡμέρας
  choice: deux jours
  rationale: Traduction directe de l’accusatif exprimant la durée.
theological_decisions: []
translation_notes:
  register: Français international moderne, narratif et digne. « Vinrent le trouver » évite une tournure littérale pesante, tandis que la note préserve la nuance possible de l’imparfait grec sans la surinterpréter dans le corps du texte.
