id: JHN.4.44
reference: John 4:44
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: fr
  text: Car Jésus lui-même avait témoigné qu’un prophète n’est pas honoré dans son propre pays[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « dans sa propre patrie » ou « dans sa région d’origine ». Le grec πατρίς peut désigner le pays natal ou la région d’où quelqu’un est originaire.
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: Car
  rationale: Introduit l’explication qui relie cette affirmation au récit environnant, tout en conservant explicitement la fonction discursive du grec.
- source_word: αὐτὸς ... Ἰησοῦς
  choice: Jésus lui-même
  rationale: Rend l’insistance portée par αὐτός en apposition à Ἰησοῦς d’une manière naturelle en français.
- source_word: ἐμαρτύρησεν
  choice: avait témoigné
  rationale: Conserve le vocabulaire johannique du témoignage. Le plus-que-parfait situe naturellement ce témoignage antérieur par rapport au fil narratif français, sans modifier son contenu.
- source_word: ὅτι
  choice: que
  rationale: Introduit normalement en français le contenu du témoignage.
- source_word: προφήτης
  choice: un prophète
  rationale: L’indéfini exprime naturellement la portée proverbiale de l’énoncé grec sans article.
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: dans son propre pays
  rationale: πατρίς peut désigner le pays natal, la patrie ou la région d’origine. « Son propre pays » reste naturel, large et suffisamment indéterminé dans ce contexte.
- source_word: τιμὴν οὐκ ἔχει
  choice: n’est pas honoré
  rationale: Formulation française idiomatique qui exprime fidèlement l’absence d’honneur, là où une traduction littérale comme « n’a pas d’honneur » risquerait de suggérer que le prophète manque lui-même d’honorabilité.
theological_decisions:
- issue: Référent et portée de « son propre pays » dans le contexte johannique
  choice: Conserver la formulation générale du proverbe sans préciser le lieu visé.
  alternative: Identifier explicitement la Judée, la Galilée ou Nazareth.
  rationale: Le verset ne nomme pas le référent géographique. La traduction préserve donc l’ambiguïté du récit et n’impose aucune harmonisation.
translation_notes:
  register: Français international moderne, naturel et digne. « Car » maintient le lien explicatif; « avait témoigné » convient à la narration rétrospective; « n’est pas honoré » évite l’ambiguïté possible de « n’a pas d’honneur ».
