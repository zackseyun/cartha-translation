base_translation:
  language: en
  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: fr
  text: 'Il lui dit[a] : « Va appeler ton mari et viens ici. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Le grec emploie le présent (« il lui dit »), un présent historique souvent rendu par un temps du passé dans la narration française.
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: Il lui dit
  rationale: Le présent grec est un présent historique fréquent dans le récit. Le passé simple français convient naturellement à la narration tout en gardant une note sur la forme grecque.
- source_word: Ὕπαγε
  choice: Va
  rationale: L’impératif exprime ici l’ordre de partir accomplir l’action suivante ; « Va » est direct et naturel.
- source_word: φώνησον
  choice: appeler
  rationale: Dans ce contexte, φωνέω signifie faire venir quelqu’un en l’appelant ; « appeler » est l’équivalent courant le plus simple.
- source_word: τὸν ἄνδρα σου
  choice: ton mari
  rationale: ἀνήρ peut désigner un homme ou un mari. Le possessif et la suite immédiate du dialogue indiquent ici le sens de « mari ».
- source_word: ἐλθὲ ἐνθάδε
  choice: reviens ici
  rationale: Littéralement « viens ici ». Puisque la femme reçoit d’abord l’ordre de partir, « reviens ici » rend naturellement en français le mouvement de retour impliqué par la succession des deux impératifs.
theological_decisions: []
translation_notes:
  register: Français moderne, simple et digne. Le tutoiement correspond au singulier des impératifs grecs. La formulation conserve la brièveté et l’autorité de la parole de Jésus.
