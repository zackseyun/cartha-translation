id: JHN.4.1
reference: John 4:1
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: fr
  text: Donc, lorsque Jésus apprit que les Pharisiens avaient entendu dire qu’il faisait et baptisait plus de disciples que Jean[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « faisait plus de disciples et baptisait davantage que Jean ». La construction grecque peut aussi se comprendre comme comparant plus largement les deux activités de Jésus à celles de Jean.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Ainsi, quand
  rationale: Ὡς introduit la proposition temporelle (« quand »), tandis que οὖν marque ici la conséquence ou la progression du récit (« ainsi »). Cette formulation conserve les deux fonctions dans un français naturel.
- source_word: ἔγνω
  choice: apprit
  rationale: L’aoriste de γινώσκω indique ici que Jésus prit connaissance de l’information. « Apprit » exprime naturellement cette prise de connaissance dans le récit.
- source_word: οἱ Φαρισαῖοι
  choice: les pharisiens
  rationale: Désignation française courante du groupe, avec l’article défini du grec.
- source_word: ἤκουσαν
  choice: avaient entendu dire
  rationale: Le plus-que-parfait rend clairement l’antériorité de l’information reçue par les pharisiens; « entendre dire » convient au contenu d’un rapport introduit par ὅτι.
- source_word: πλείονας μαθητὰς
  choice: plus de disciples
  rationale: Rendu français direct et idiomatique du comparatif πλείονας avec μαθητάς.
- source_word: ποιεῖ
  choice: faisait
  rationale: Avec μαθητάς, ποιέω signifie « faire des disciples ». Le choix reste proche du grec sans anticiper la précision apportée au verset suivant.
- source_word: βαπτίζει
  choice: baptisait
  rationale: « Baptiser » est le terme français courant et précis pour βαπτίζω dans ce contexte narratif.
- source_word: ἢ Ἰωάννης
  choice: que Jean
  rationale: La conjonction comparative ἤ se rend naturellement par « que » après « plus de », sans répéter les verbes sous-entendus.
theological_decisions:
- issue: Possibilité de comprendre que Jésus baptisait personnellement
  choice: Conserver l’énoncé de surface selon lequel Jésus « faisait et baptisait » des disciples.
  alternative: Anticiper Jean 4.2 en précisant que les disciples de Jésus baptisaient.
  rationale: Le verset suivant précise que Jésus lui-même ne baptisait pas. Il convient de laisser cette précision au récit plutôt que de résoudre ici la tension par harmonisation.
- issue: Portée de la comparaison avec Jean
  choice: Rattacher « plus de disciples » aux deux verbes coordonnés, sans exclure une autre analyse de la portée comparative.
  alternative: « faisait plus de disciples et baptisait davantage que Jean »
  rationale: πλείονας μαθητάς est l’objet naturel de ποιεῖ et βαπτίζει, mais la coordination permet de percevoir la comparaison comme portant plus largement sur les deux activités; une note préserve cette nuance.
translation_notes:
  register: Français international moderne, naturel et digne. La phrase demeure volontairement inachevée, conformément au tiret du texte source et à la continuation syntaxique au verset suivant. Le nom « Jésus » n’est pas répété dans le discours rapporté, car le pronom français identifie clairement le même sujet sans perte de sens.
