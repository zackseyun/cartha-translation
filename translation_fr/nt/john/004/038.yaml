  source_fidelity: 'Le texte rend avec fidélité les éléments principaux du grec : l’envoi accompli (« je vous ai envoyés »), l’image de la moisson, l’effort antérieur nié pour les destinataires, l’indétermination de « d’autres », et l’entrée dans le labeur d’autrui. Le passé composé est un rendu français naturel de l’aoriste et des parfaits dans ce contexte. « Ce pour quoi vous n’avez pas peiné » explicite seulement le lien syntaxique implicite entre la moisson et l’effort, sans déterminer l’identité des « autres ».'
  naturalness: Le français est moderne, clair et d’un registre biblique accessible. « Moi, je » rend de manière recevable l’emphase de ἐγώ. « Entrés dans leur labeur » est volontairement un peu inhabituel, comme l’expression grecque, mais demeure intelligible et est adéquatement éclairé par la note.
