id: JHN.4.38
reference: John 4:38
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: fr
  text: Moi, je vous ai envoyés moissonner ce pour quoi vous n’avez pas peiné. D’autres ont peiné, et vous êtes entrés dans leur labeur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « vous avez pris part à leur travail »; selon le sens donné à l’image, on peut aussi comprendre « vous avez bénéficié du fruit de leur travail ». Le grec dit littéralement « vous êtes entrés dans leur labeur ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἀπέστειλα ὑμᾶς
  choice: Moi, je vous ai envoyés
  rationale: Le passé composé rend naturellement l’aoriste dans ce discours. « Moi, je » reflète l’emphase du pronom grec explicite sans développer « envoyés » en « chargés d’une mission ».
- source_word: θερίζειν
  choice: moissonner
  rationale: Ce verbe courant maintient l’image agricole du contexte et peut aussi porter son sens figuré.
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: ce pour quoi vous n’avez pas peiné
  rationale: « Ce pour quoi » conserve le relatif substantivé et le lien entre la moisson et l’effort antérieur. « Peiner » exprime l’effort soutenu de κοπιάω sans ajouter explicitement l’idée de produire la récolte.
- source_word: ἄλλοι κεκοπιάκασιν
  choice: D’autres ont peiné
  rationale: Le passé composé rend la valeur accomplie du parfait grec avec sa pertinence présente, tandis que la répétition de « peiné » préserve la reprise lexicale.
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: vous êtes entrés dans leur labeur
  rationale: Cette formulation suit de près l’expression grecque inhabituelle et conserve son ambiguïté plutôt que de la réduire au seul bénéfice ou fruit du travail d’autrui.
theological_decisions:
- issue: Identité de ceux qui ont peiné auparavant
  choice: Le référent de « d’autres » reste indéterminé.
  alternative: Préciser qu’il s’agit des prophètes, de Jean-Baptiste, de Jésus ou de plusieurs de ces figures.
  rationale: Le verset ne désigne pas explicitement ces personnes; la traduction ne doit donc pas imposer une identification particulière.
- issue: Sens de l’entrée dans le labeur d’autrui
  choice: Conserver l’image « entrer dans leur labeur ».
  alternative: Traduire « recueillir le fruit de leur travail » ou « prendre part à leur travail ».
  rationale: Ces solutions expliquent utilement certains aspects possibles, mais chacune restreint davantage la portée de l’expression grecque.
translation_notes:
  register: Français international moderne, digne et accessible. « Moissonner », « peiner » et « labeur » maintiennent l’image agricole ainsi que le lien entre l’effort antérieur et l’activité présente. La tournure volontairement inhabituelle « entrer dans leur labeur » est éclairée par une note sans que l’ambiguïté du texte soit supprimée.
