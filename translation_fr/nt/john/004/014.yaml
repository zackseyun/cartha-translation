id: JHN.4.14
reference: John 4:14
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: fr
  text: Mais celui qui boira de l’eau que je lui donnerai n’aura jamais plus soif. Au contraire, l’eau que je lui donnerai deviendra en lui une source d’eau jaillissant jusque dans la vie éternelle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: n’aura jamais plus soif
  rationale: La double négation οὐ μή exprime une négation catégorique, et εἰς τὸν αἰῶνα lui donne une portée permanente. Cette tournure française naturelle restitue l’ensemble sans le calque maladroit « n’aura jamais soif pour toujours ».
- source_word: πηγὴ ὕδατος
  choice: une source d’eau
  rationale: πηγή désigne une source vive ou jaillissante; « source d’eau » conserve l’image concrète et son lien avec le puits du contexte.
- source_word: ἁλλομένου
  choice: jaillissant
  rationale: Le participe de ἅλλομαι évoque une eau qui bondit ou jaillit; « jaillissant » rend le mouvement vigoureux de l’image.
- source_word: εἰς ζωὴν αἰώνιον
  choice: jusque dans la vie éternelle
  rationale: « Jusque dans » conserve la valeur directionnelle de εἰς et l’ambiguïté poétique entre l’aboutissement du jaillissement et son effet conduisant à la vie éternelle.
theological_decisions:
- issue: Portée de la promesse de ne plus avoir soif
  choice: n’aura jamais plus soif
  alternative: n’aura plus jamais soif pour l’éternité
  rationale: La formulation choisie affirme pleinement la permanence exprimée par οὐ μή… εἰς τὸν αἰῶνα sans ajouter une explication doctrinale sur la nature exacte de cette soif.
- issue: Rapport de la source à la vie éternelle
  choice: jaillissant jusque dans la vie éternelle
  alternative: jaillissant pour donner la vie éternelle
  rationale: La traduction maintient la construction métaphorique et directionnelle du grec; elle évite de réduire εἰς à une paraphrase causale qui trancherait davantage que le texte.
translation_notes:
  register: Français international moderne, naturel et digne. La répétition « l’eau que je lui donnerai » est conservée parce qu’elle structure l’opposition et l’insistance du verset grec.
