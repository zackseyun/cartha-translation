id: JHN.4.49
reference: John 4:49
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: fr
  text: 'Le fonctionnaire royal lui dit : « Seigneur[a], descends avant que mon enfant meure. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur ». Le grec κύριε est une formule d’adresse respectueuse qui peut aussi se traduire par « Monsieur ».
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: le fonctionnaire royal
  rationale: Le substantif désigne ici un homme attaché au roi ou à la cour. « Fonctionnaire royal » exprime clairement ce lien sans lui attribuer un rang de noblesse que le grec ne précise pas.
- source_word: Κύριε
  choice: Seigneur
  rationale: κύριε peut être une adresse respectueuse aussi bien que le titre « Seigneur ». « Seigneur » conserve la résonance possible du terme dans l’Évangile selon Jean, tandis que la note signale le sens plus simplement honorifique.
- source_word: κατάβηθι
  choice: descends
  rationale: L’impératif de καταβαίνω signifie littéralement « descendre ». Cette traduction préserve le mouvement topographique de Cana vers Capernaüm.
- source_word: πρὶν ἀποθανεῖν
  choice: avant que … meure
  rationale: πρίν suivi de l’infinitif marque l’antériorité. La tournure française naturelle explicite le sujet fourni par le contexte.
- source_word: τὸ παιδίον μου
  choice: mon enfant
  rationale: παιδίον désigne un enfant, souvent jeune, sans imposer ici le genre grammatical. « Mon enfant » évite de préciser davantage que ce verset.
- source_word: λέγει πρὸς αὐτόν
  choice: lui dit
  rationale: Le présent historique grec est rendu au passé simple, temps narratif naturel et digne en français écrit.
theological_decisions:
- issue: La portée de κύριος comme adresse à Jésus
  choice: Seigneur
  alternative: Monsieur
  rationale: Dans ce contexte, κύριε peut n’être qu’une formule respectueuse, mais il peut aussi porter la résonance plus forte de « Seigneur ». Le texte principal conserve cette tension et la note présente l’autre possibilité sans imposer au personnage une compréhension théologique explicite.
translation_notes:
  register: Français international moderne, clair et digne. La phrase reste concise comme le grec. « Descends » conserve le relief géographique, et « mon enfant » respecte l’absence de précision de genre dans παιδίον.
