  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: fr
  text: Il lui fallait traverser la Samarie[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Il devait passer par la Samarie ». Le grec exprime une nécessité sans en préciser exactement la raison.
    reason: alternative_lexicale
lexical_decisions:
- source_word: ἔδει
  choice: Il lui fallait
  rationale: L’imparfait de δεῖ exprime ici une nécessité dans un récit au passé. « Il lui fallait » est naturel et digne en français, tout en laissant ouverte la nature exacte de cette nécessité.
- source_word: δὲ
  choice: non rendu explicitement
  rationale: δέ assure ici une légère progression narrative plutôt qu’un contraste marqué. Le français n’exige pas de connecteur explicite dans ce verset isolé, et en ajouter un risquerait de surtraduire.
- source_word: αὐτὸν
  choice: lui
  rationale: Le pronom accusatif est le sujet logique de l’infinitif grec; la tournure impersonnelle française « il lui fallait » en rend naturellement la fonction.
- source_word: διέρχεσθαι
  choice: traverser
  rationale: Avec διά et le génitif d’un territoire, διέρχομαι désigne le fait de passer à travers une région. « Traverser » est précis et idiomatique.
- source_word: διὰ τῆς Σαμαρείας
  choice: la Samarie
  rationale: διά avec le génitif indique un déplacement à travers un lieu. En français, « traverser la Samarie » exprime directement cette relation spatiale sans qu’il soit nécessaire d’ajouter « la région de ».
theological_decisions:
- issue: Nature de la nécessité exprimée par ἔδει
  choice: Exprimer une nécessité réelle par « Il lui fallait », sans en préciser le fondement.
  alternative: « Il devait traverser », susceptible d’être compris comme une simple obligation pratique ou comme l’expression d’un projet divin.
  rationale: Le grec affirme la nécessité sans dire explicitement dans ce verset si elle est géographique, circonstancielle ou liée à la mission divine de Jésus. La traduction conserve cette tension.
translation_notes:
  register: Français international moderne, sobre et naturel. La formulation « Il lui fallait traverser » conserve la nécessité du grec tout en évitant de l’expliquer. Le marqueur [a] figure dans le texte principal.
