source:
  edition: SBLGNT
  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: fr
  text: 'Beaucoup de Samaritains de cette ville-là crurent en lui à cause de la parole[a] de la femme qui témoignait : « Il m’a dit tout ce que j’ai fait. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « à cause du message de la femme » ou « à cause du témoignage de la femme ». Le mot grec λόγος peut désigner une parole, un message ou un témoignage.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: de cette ville
  rationale: ἐκ indique l’origine. Dans ce contexte, « de cette ville » est naturel en français; δέ est rendu implicitement par la continuité narrative plutôt que par un connecteur lourd.
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: Beaucoup de Samaritains
  rationale: La construction partitive signifie qu’un grand nombre parmi les Samaritains crurent; cette formulation française en transmet naturellement le sens.
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: crurent en lui
  rationale: πιστεύω avec εἰς exprime ici une croyance ou une confiance dirigée vers Jésus. « Crurent en lui » conserve cette portée relationnelle sans amplification doctrinale.
- source_word: διὰ τὸν λόγον τῆς γυναικός
  choice: à cause du témoignage de la femme
  rationale: διά avec l’accusatif exprime la cause. Dans ce contexte, λόγος désigne ce que la femme disait en témoignant; « témoignage » est idiomatique et s’accorde avec μαρτυρούσης, tandis qu’une note conserve l’alternative plus littérale « parole » ou « message ».
- source_word: μαρτυρούσης
  choice: qui disait
  rationale: Le participe présent décrit la femme en train de rendre témoignage. « Qui disait » introduit naturellement en français le contenu direct de son témoignage, sans rendre la phrase pesante.
- source_word: Εἶπέν μοι πάντα ἃ ἐποίησα
  choice: Il m’a dit tout ce que j’ai fait
  rationale: Le passé composé est le choix narratif naturel en français pour les aoristes εἶπεν et ἐποίησα dans cette parole rapportée. « Tout ce que j’ai fait » conserve la portée globale de πάντα ἃ.
theological_decisions:
- issue: Portée de πιστεύω εἰς dans l’usage johannique
  choice: crurent en lui
  alternative: mirent leur foi en lui
  rationale: Le texte présente une croyance dirigée vers Jésus sans préciser davantage sa catégorisation doctrinale. « Crurent en lui » garde la formulation sobre et ouverte de l’original.
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple « crurent » convient au récit écrit, tandis que le passé composé dans la citation sonne naturel dans la parole directe. La note préserve l’étendue sémantique de λόγος.
