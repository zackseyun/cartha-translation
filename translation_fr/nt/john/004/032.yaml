  text: ὁ δὲ εἶπεν αὐτοῖς· Ἐγὼ βρῶσιν ἔχω φαγεῖν ἣν ὑμεῖς οὐκ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: fr
  text: 'Mais il leur dit : « Moi, j’ai une nourriture à manger que vous ne connaissez pas. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Mais
  rationale: Le connecteur marque ici une légère opposition entre l’insistance des disciples et la réponse de Jésus.
- source_word: εἶπεν αὐτοῖς
  choice: il leur dit
  rationale: Formulation narrative simple et directe, correspondant naturellement au grec.
- source_word: Ἐγώ
  choice: Moi, j’ai
  rationale: Le pronom grec explicite met le sujet en relief; la dislocation « Moi, j’ai » restitue naturellement ce contraste en français.
- source_word: βρῶσιν
  choice: une nourriture
  rationale: Le nom désigne ici ce qui sert de nourriture. Ce choix conserve l’image que le contexte expliquera ensuite sans l’interpréter prématurément.
- source_word: ἔχω φαγεῖν
  choice: j’ai à manger
  rationale: Cette tournure rend la possession de nourriture destinée à être mangée tout en restant intelligible et proche de la formulation grecque.
- source_word: ἣν ὑμεῖς οὐκ οἴδατε
  choice: que vous ne connaissez pas
  rationale: Le relatif renvoie à « nourriture » et le pronom explicite ὑμεῖς établit un contraste avec « moi »; la formulation française conserve cette relation sans ajouter « au sujet de laquelle ».
theological_decisions:
- issue: Sens métaphorique de la « nourriture » de Jésus
  choice: Conserver « nourriture » dans le texte principal sans en expliciter le sens.
  alternative: Paraphraser dès ce verset la nourriture comme l’accomplissement de la volonté du Père.
  rationale: Le contexte suivant révèle le sens métaphorique, tandis que ce verset entretient intentionnellement l’incompréhension des disciples. L’explication ne doit donc pas être anticipée.
translation_notes:
  register: Français moderne, digne et accessible. La tournure légèrement marquée « j’ai à manger une nourriture » préserve l’expression grecque et son image, tandis que la note propose une formulation plus idiomatique.
