review_pass:
  verdict: revise
  source_fidelity: Le sens de βρῶσιν ἔχω φαγεῖν est bien celui d’une nourriture que Jésus possède pour manger. Toutefois, « j’ai à manger une nourriture » se comprend naturellement comme une obligation (« j’ai à manger »), et non comme la possession d’une nourriture à manger. La révision restitue la construction grecque sans lever la portée métaphorique.
  naturalness: « Moi, j’ai une nourriture à manger » est une tournure française claire, légèrement solennelle mais naturelle dans ce contexte narratif. Elle maintient l’accent de Ἐγώ sans la maladresse ou l’ambiguïté de la formulation actuelle.
  terminology: « Nourriture » convient à βρῶσις et préserve l’image intentionnellement non expliquée du verset. « Que vous ne connaissez pas » rend sobrement οὐκ οἴδατε; il n’est pas nécessaire d’ajouter « au sujet de » ou d’expliciter la métaphore.
  issues:
  - severity: medium
    issue: La séquence « Moi, j’ai à manger une nourriture » est syntaxiquement et sémantiquement ambiguë en français.
    rationale: Après « avoir », « à manger » se lit couramment comme un infinitif d’obligation (« avoir à faire/manger »). Elle peut donc suggérer que Jésus doit manger une nourriture, plutôt qu’il possède une nourriture à manger, ce qui ne correspond pas à ἔχω φαγεῖν.
  revised_text: 'Mais il leur dit : « Moi, j’ai une nourriture à manger que vous ne connaissez pas. »'
  revised_footnotes:
  - marker: a
    text: 'Ou : « J’ai quelque chose à manger que vous ne connaissez pas. »'
    reason: Variante lexicale naturelle pour βρῶσιν et la construction ἔχω φαγεῖν.
  revision_rationale: 'Le déplacement de « une nourriture » avant « à manger » élimine l’ambiguïté française tout en conservant les deux éléments du grec : une nourriture et son rapport à l’acte de manger. Le contraste porté par le pronom explicite est maintenu par « Moi ». La note conserve une alternative idiomatique sans interpréter prématurément la nourriture métaphorique.'
