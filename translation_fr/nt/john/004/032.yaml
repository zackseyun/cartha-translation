revisions:
- from: 'Mais il leur dit : « Moi, j’ai à manger une nourriture[a] que vous ne connaissez pas. »'
  to: 'Mais il leur dit : « Moi, j’ai une nourriture à manger que vous ne connaissez pas. »'
  rationale: 'Le déplacement de « une nourriture » avant « à manger » élimine l’ambiguïté française tout en conservant les deux éléments du grec : une nourriture et son rapport à l’acte de manger. Le contraste porté par le pronom explicite est maintenu par « Moi ». La note conserve une alternative idiomatique sans interpréter prématurément la nourriture métaphorique.'
