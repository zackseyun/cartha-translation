id: JHN.4.42
reference: John 4:42
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: fr
  text: 'Et ils disaient à la femme : « Ce n’est plus à cause de ce que tu as dit que nous croyons, car nous l’avons entendu nous-mêmes, et nous savons qu’il est vraiment le Sauveur du monde. »'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: Et ils disaient à la femme
  rationale: L’imparfait ἔλεγον garde l’aspect d’une parole en cours ou répétée. La légère valeur connective de τε est naturellement portée par « Et ».
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: Ce n’est plus à cause de ce que tu as dit que nous croyons
  rationale: Cette tournure française naturelle conserve la négation temporelle οὐκέτι et présente la parole de la femme comme le premier fondement de leur foi. « Ce que tu as dit » rend ici λαλιά sans la connotation péjorative que peut avoir « façon de parler ».
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: car nous l’avons entendu nous-mêmes
  rationale: « Nous-mêmes » préserve l’insistance de αὐτοί. Le complément « l’ » explicite naturellement en français celui qu’ils ont entendu, Jésus, sans modifier le sens; le passé composé convient au parfait grec et à son résultat présent.
- source_word: καὶ οἴδαμεν
  choice: et nous savons
  rationale: οἴδαμεν est un parfait de forme employé avec le sens présent et statif de « savoir ».
- source_word: οὗτός ἐστιν ἀληθῶς
  choice: il est vraiment
  rationale: Le pronom « il » est plus idiomatique en français que « celui-ci » dans ce discours, tandis que « vraiment » conserve l’affirmation forte de ἀληθῶς.
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: le Sauveur du monde
  rationale: Rendu direct et consacré qui conserve à la fois le poids christologique de σωτήρ et l’étendue non restreinte de κόσμος.
theological_decisions:
- issue: Portée de la confession samaritaine
  choice: le Sauveur du monde
  alternative: le Sauveur de tous les êtres humains
  rationale: La traduction conserve la formulation large du texte sans définir davantage la manière dont le salut se rapporte au monde ni importer une qualification doctrinale.
- issue: Fondement désormais direct de la foi des Samaritains
  choice: Ce n’est plus à cause de ce que tu as dit que nous croyons
  alternative: Nous ne croyons plus à cause de ta parole
  rationale: La construction clivée évite de suggérer qu’ils ont cessé de croire; elle indique clairement que leur foi ne repose désormais plus seulement sur le témoignage indirect de la femme.
translation_notes:
  register: Français international moderne, naturel et digne. La syntaxe met clairement en contraste le témoignage initial de la femme et l’écoute directe des Samaritains, sans alourdir le verset par un calque grec.
