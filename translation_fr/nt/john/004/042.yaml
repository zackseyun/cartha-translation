  source_fidelity: 'Le texte français rend fidèlement les principaux éléments du grec : l’imparfait narratif (« ils disaient »), la cessation du fondement indirect (« Ce n’est plus à cause de ce que tu as dit »), l’insistance d’αὐτοί (« nous-mêmes »), le parfait à portée présente (« nous l’avons entendu »), le présent statif de οἴδαμεν (« nous savons ») et la confession universelle (« le Sauveur du monde »). L’explicitation de l’objet sous-entendu par « l’ » est justifiée par le contexte immédiat et ne modifie pas le sens.'
  naturalness: Le français est moderne, clair et soutenu sans être archaïsant. La phrase clivée évite avec bonheur la lecture erronée selon laquelle les Samaritains auraient cessé de croire. « Il est vraiment le Sauveur du monde » est idiomatique et garde la force confessionnelle du verset.
  terminology: « Sauveur du monde » est le terme français établi et correspond directement à ὁ σωτὴρ τοῦ κόσμου. « Ce que tu as dit » rend naturellement λαλιὰ sans introduire une nuance défavorable. Le pronom « il » est une adaptation française naturelle de οὗτός et ne réduit pas indûment l’emphase contextuelle.
