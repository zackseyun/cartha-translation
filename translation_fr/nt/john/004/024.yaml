id: JHN.4.24
reference: John 4:24
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: fr
  text: Dieu est esprit[b], et ceux qui l’adorent doivent l’adorer en esprit et en vérité[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « dans l’Esprit et dans la vérité ». Le grec peut être compris de manière plus précise, mais la formulation du texte conserve le sens plus large de l’expression.'
    reason: alternative_reading
  - marker: b
    text: « Dieu est esprit » exprime la nature de Dieu ; cela ne signifie pas simplement que Dieu est un esprit parmi d’autres.
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: esprit
  rationale: Prédicat sans article placé avant ὁ θεός, πνεῦμα décrit ici la nature de Dieu. « Dieu est esprit » évite de présenter Dieu comme « un esprit » parmi d’autres et ne précise pas qu’il s’agit ici de l’Esprit Saint.
- source_word: ὁ θεός
  choice: Dieu
  rationale: Équivalent français courant de θεός dans ce contexte ; l’article grec désigne ὁ θεός comme sujet de la proposition.
- source_word: τοὺς προσκυνοῦντας
  choice: ceux qui l’adorent
  rationale: Le participe présent substantivé désigne les adorateurs de manière générale. Cette formulation est naturelle en français moderne et conserve la valeur générale de l’expression.
- source_word: ἐν πνεύματι
  choice: en esprit
  rationale: La formulation conserve l’étendue et l’ambiguïté de l’expression grecque sans la réduire ni à la seule sincérité intérieure ni à une référence explicitement définie à l’Esprit Saint.
- source_word: ἀληθείᾳ
  choice: vérité
  rationale: « Vérité » est l’équivalent naturel et rend la portée factuelle et révélatrice du terme dans le vocabulaire johannique.
- source_word: δεῖ
  choice: doivent
  rationale: Le verbe exprime une nécessité. « Doivent » en restitue clairement la force dans une tournure française naturelle.
- source_word: προσκυνεῖν
  choice: adorer
  rationale: Dans ce contexte, « adorer » rend naturellement l’acte de culte exprimé par le verbe, sans imposer sa nuance historique de geste corporel.
theological_decisions:
- issue: Sens de « Dieu est esprit »
  choice: Une affirmation qualitative concernant la nature de Dieu.
  alternative: « Dieu est un esprit », qui pourrait le présenter comme un être spirituel parmi d’autres.
  rationale: L’ordre des mots grecs et l’absence d’article devant πνεῦμα favorisent un prédicat qualitatif. La traduction préserve l’affirmation du texte sans classer Dieu parmi d’autres esprits.
- issue: Sens de « en esprit et en vérité »
  choice: Une adoration caractérisée par l’esprit et la vérité, sans préciser davantage le rapport à l’Esprit Saint.
  alternative: « dans l’Esprit et dans la vérité » ou « avec sincérité et vérité ».
  rationale: Les noms πνεύματι et ἀληθείᾳ sont sans article et coordonnés sous la même préposition. La formulation retenue préserve la largeur et la tension interprétative du grec.
translation_notes:
  register: Français international moderne, sobre et digne. La répétition de « l’adorer » clarifie le référent et reproduit naturellement la structure du grec. La minuscule à « esprit » dans le texte principal maintient la valeur qualitative et évite de trancher explicitement en faveur d’une référence à l’Esprit Saint.
