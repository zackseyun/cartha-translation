  text: καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: fr
  text: Et beaucoup plus de gens crurent à cause de sa parole[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « un bien plus grand nombre crut ». Le grec emploie une expression comparative renforcée.'
    reason: lexical_alternative
  - marker: b
    text: 'Ou : « à cause de son message ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: beaucoup plus de gens
  rationale: Le datif πολλῷ renforce le comparatif πλείους. Cette formulation française exprime naturellement l’augmentation par rapport au verset précédent, tout en sous-entendant correctement « de gens ».
- source_word: ἐπίστευσαν
  choice: crurent
  rationale: L’aoriste actif est rendu simplement par le passé simple « crurent », sans lui imposer une nuance d’entrée dans la foi que la forme verbale n’explicite pas à elle seule.
- source_word: διὰ
  choice: à cause de
  rationale: 'Avec l’accusatif, διά exprime ici la cause : leur foi résulte de ce que Jésus a dit.'
- source_word: λόγον
  choice: parole
  rationale: Dans ce contexte, λόγος désigne ce que Jésus a dit. « Parole » reste intelligible et préserve le vocabulaire johannique, tandis que « message » demeure une possibilité de sens.
- source_word: αὐτοῦ
  choice: sa
  rationale: Le pronom renvoie à Jésus dans le contexte immédiat ; le possessif français en donne l’équivalent direct.
theological_decisions:
- issue: Rendu de πιστεύω dans un récit à portée sotériologique
  choice: crurent
  alternative: vinrent à la foi ; mirent leur foi en lui
  rationale: Le grec dit simplement qu’ils « crurent » et ne formule aucun complément d’objet dans ce verset. Le rendu retenu laisse le contexte johannique identifier celui en qui ils croient, sans développer le texte en une formulation doctrinale plus explicite.
translation_notes:
  register: Français international moderne, clair et digne. Le passé simple convient au registre narratif biblique sans être archaïque. « Beaucoup plus de gens » privilégie la compréhension immédiate ; les notes signalent la force du comparatif grec et l’autre sens contextuel possible de λόγος.
