id: JHN.4.50
reference: John 4:50
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: fr
  text: 'Jésus lui dit : « Va, ton fils vit. » L’homme crut[a] à la parole que Jésus lui avait dite et se mit en route.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : fit confiance à la parole que Jésus lui avait dite.'
    reason: Alternative lexicale pour πιστεύω avec le datif, qui peut exprimer le fait de croire une parole ou de s’y fier.
lexical_decisions:
- source_word: Πορεύου
  choice: Va
  rationale: L’impératif présent de πορεύομαι donne ici l’ordre simple de repartir. « Va » est bref, naturel et conserve le rythme du récit.
- source_word: ὁ υἱός σου
  choice: ton fils
  rationale: υἱός désigne précisément le fils, et non un enfant sans précision de sexe.
- source_word: ζῇ
  choice: vit
  rationale: Le présent de ζάω exprime que le fils est vivant. « Vit » préserve la formulation concise et directe de Jésus sans la transformer en promesse au futur.
- source_word: ἐπίστευσεν
  choice: crut
  rationale: Avec le datif τῷ λόγῳ, πιστεύω signifie croire la parole ou lui faire confiance. « Crut » maintient le vocabulaire johannique de la foi tout en laissant ouverte la portée exacte de cette réponse.
- source_word: ὁ ἄνθρωπος
  choice: L’homme
  rationale: Le verset emploie le terme général ἄνθρωπος. « L’homme » respecte ce choix au lieu de reprendre l’appellation d’« officier royal » donnée par le contexte antérieur.
- source_word: τῷ λόγῳ
  choice: à la parole
  rationale: λόγος désigne ici la déclaration prononcée par Jésus. « La parole » est clair dans ce contexte et conserve le lien lexical avec l’acte de parler.
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: que Jésus lui avait dite
  rationale: Le plus-que-parfait est naturel en français puisque la parole de Jésus précède la réaction de l’homme. L’accord de « dite » avec « parole » est requis.
- source_word: ἐπορεύετο
  choice: se mit en route
  rationale: L’imparfait grec présente l’homme en train de repartir après avoir cru. « Se mit en route » rend naturellement cette progression narrative.
theological_decisions:
- issue: Sens de πιστεύω comme réponse à la parole de Jésus
  choice: crut
  alternative: fit confiance à
  rationale: Le texte décrit l’accueil de la parole de Jésus sans préciser s’il s’agit ici de la foi au sens le plus complet ou d’une confiance ponctuelle en sa promesse. « Crut » préserve cette tension, tandis que la note signale la nuance possible de confiance.
translation_notes:
  register: Français moderne, sobre et digne. La déclaration « ton fils vit » conserve la force compacte du grec. « Crut à la parole » est légèrement soutenu, mais reste naturel et permet de préserver les liens lexicaux et théologiques du texte.
