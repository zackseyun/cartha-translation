source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: fr
  text: 'La femme lui dit : « Seigneur[a], donne-moi cette eau, afin que je n’aie plus soif et que je ne vienne plus ici puiser. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Monsieur, donne-moi cette eau… »
    reason: Le grec κύριε peut être soit un titre (« Seigneur »), soit une formule d’adresse respectueuse (« Monsieur ») dans ce dialogue.
lexical_decisions:
- source_word: λέγει
  choice: dit
  rationale: Le présent historique grec est rendu par le passé simple, temps naturel du récit écrit en français.
- source_word: γυνή
  choice: la femme
  rationale: Dans ce contexte, le mot désigne la Samaritaine, et non une épouse.
- source_word: Κύριε
  choice: Seigneur
  rationale: « Seigneur » préserve la portée possible du titre dans l’Évangile selon Jean, tandis que son emploi comme formule de politesse est signalé en note.
- source_word: δός μοι
  choice: donne-moi
  rationale: Impératif direct, idiomatique et fidèle au grec.
- source_word: τοῦτο τὸ ὕδωρ
  choice: cette eau
  rationale: Le verset dit seulement « cette eau » ; « vive » n’est donc pas ajouté depuis le contexte.
- source_word: ἵνα μὴ διψῶ
  choice: afin que je n’aie plus soif
  rationale: Cette formulation française exprime naturellement le but et, dans le contexte, la cessation durable de la soif, sans transformer explicitement le subjonctif en promesse certaine.
- source_word: μηδὲ διέρχωμαι ἐνθάδε ἀντλεῖν
  choice: et que je n’aie plus à venir puiser ici
  rationale: La coordination négative est rendue naturellement en français ; « venir » convient au déictique « ici », et « puiser » porte implicitement l’idée de puiser de l’eau sans répétition inutile.
theological_decisions:
- issue: Sens de κύριος dans l’adresse de la Samaritaine
  choice: Seigneur
  alternative: Monsieur
  rationale: Le terme peut être une adresse respectueuse au niveau immédiat du récit tout en ayant une résonance plus profonde chez Jean. Le texte principal conserve « Seigneur » et la note maintient l’autre possibilité.
translation_notes:
  register: Français international moderne, naturel et digne. Le tour « n’aie plus à venir » rend clairement le caractère récurrent de la corvée envisagée. Le marqueur [a] est placé immédiatement après le terme concerné.
