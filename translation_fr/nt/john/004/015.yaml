review_pass:
  verdict: revise
  source_fidelity: 'La traduction rend correctement les éléments essentiels du grec : l’adresse à Jésus, la demande de « cette eau », le but négatif, la soif et le retour à cet endroit pour puiser. Toutefois, « n’aie plus à venir » introduit plus nettement une idée d’obligation (« être obligé de ») qui n’est pas exprimée par διέρχωμαι. « Ne vienne plus ici puiser » restitue plus directement l’action envisagée, tout en conservant l’aspect répétitif naturellement impliqué par le contexte.'
  naturalness: Le français est moderne, fluide et d’un registre narratif approprié. La formulation révisée est tout aussi naturelle et évite l’inférence supplémentaire portée par « avoir à ». « La femme lui dit » est un présent narratif français recevable et correspond bien au présent historique λέγει.
  terminology: « Seigneur » est défendable comme rendu principal de Κύριε, avec « Monsieur » maintenu en note pour préserver l’ambiguïté pragmatique de l’adresse. « Cette eau » et « puiser » sont précis et naturels.
  issues:
  - severity: medium
    issue: « que je n’aie plus à venir puiser ici » ajoute une nuance d’obligation.
    rationale: Le grec μηδὲ διέρχωμαι ἐνθάδε ἀντλεῖν signifie qu’elle ne vienne/passe plus ici pour puiser ; il n’exprime pas explicitement qu’elle y soit contrainte. Supprimer « à » préserve mieux la portée du texte source.
  revised_text: 'La femme lui dit : « Seigneur[a], donne-moi cette eau, afin que je n’aie plus soif et que je ne vienne plus ici puiser. »'
  revised_footnotes:
  - marker: a
    text: Ou « Monsieur, donne-moi cette eau… »
    reason: Le grec κύριε peut être soit un titre (« Seigneur »), soit une formule d’adresse respectueuse (« Monsieur ») dans ce dialogue.
  revision_rationale: 'Révision limitée de la seconde proposition finale : « ne vienne plus ici puiser » rend directement le verbe grec et évite d’ajouter l’idée d’une obligation. La note maintient sans la résoudre l’ambiguïté de κύριε.'
