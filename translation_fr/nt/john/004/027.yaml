id: JHN.4.27
reference: John 4:27
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: fr
  text: 'À ce moment-là, ses disciples arrivèrent et s’étonnaient de le voir parler avec une femme. Pourtant, aucun ne dit : « Que cherches-tu[a] ? » ou : « Pourquoi parles-tu avec elle[b] ? »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « Que veux-tu ? » Le grec ne précise ni ce qui est recherché ni à qui cette question aurait été adressée.
    reason: lexical_alternative
  - marker: b
    text: 'Littéralement, « Que dis-tu avec elle ? » Dans ce contexte, le sens est : « Pourquoi parles-tu avec elle ? »'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: À ce moment-là
  rationale: 'L’expression a ici une valeur temporelle : elle situe l’arrivée des disciples au moment même de l’entretien.'
- source_word: ἐθαύμαζον
  choice: s’étonnaient
  rationale: L’imparfait grec présente leur étonnement comme une réaction en cours; « s’étonnaient » le conserve sans exagérer l’intensité.
- source_word: μετὰ γυναικὸς
  choice: avec une femme
  rationale: Le nom sans article est naturellement indéfini ici. Le contexte désigne la Samaritaine, mais le grec met l’accent sur le fait qu’il parle avec une femme.
- source_word: ἐλάλει
  choice: il parle
  rationale: Après « s’étonnaient que », le français moderne emploie naturellement le subjonctif présent « parle », qui représente la conversation en cours au moment de leur arrivée.
- source_word: μέντοι
  choice: Pourtant
  rationale: Le terme marque le contraste entre leur étonnement et le fait qu’aucun disciple n’exprime sa question.
- source_word: Τί ζητεῖς;
  choice: Que cherches-tu ?
  rationale: Cette formulation reste proche de ζητέω et conserve l’objet non exprimé ainsi que l’absence d’identification explicite de la personne à qui la question aurait été adressée.
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: Pourquoi parles-tu avec elle ?
  rationale: Avec τί dans ce contexte, la force pragmatique de la question est causale en français. Une traduction strictement littérale serait peu idiomatique.
theological_decisions:
- issue: Portée sociale de l’étonnement des disciples
  choice: Dire seulement qu’ils s’étonnaient de voir Jésus parler avec une femme
  alternative: Ajouter dans le verset une explication portant sur les conventions entre hommes et femmes ou entre Juifs et Samaritains
  rationale: Le texte grec constate leur étonnement sans en expliciter les motifs sociaux ou ethniques; la traduction maintient cette retenue.
- issue: Destinataire de la première question non prononcée
  choice: Ne pas identifier explicitement la personne visée par « Que cherches-tu ? »
  alternative: Préciser dans le texte que cette question aurait été adressée à la femme ou à Jésus
  rationale: Le grec ne nomme pas le destinataire de cette première question; la formulation française permet de préserver cette ambiguïté.
translation_notes:
  register: Français international moderne, sobre et narratif. « À ce moment-là » rend clairement la simultanéité; « s’étonnaient » conserve l’aspect imperfectif. Les questions restent directes et naturelles, sans ajouter d’explication sociale au corps du verset.
