id: JHN.4.52
reference: John 4:52
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: fr
  text: 'Il leur demanda donc à quelle heure son état avait commencé à s’améliorer. Ils lui répondirent : « Hier, à la septième heure[a], la fièvre l’a quitté. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Si l’on compte les heures à partir du lever du soleil, il s’agit d’environ treize heures; certains comprennent autrement la manière dont Jean compte les heures.
    reason: Signaler l’équivalent moderne possible tout en préservant l’incertitude sur le système horaire.
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: Il leur demanda donc
  rationale: πυνθάνομαι désigne ici le fait de demander un renseignement; « donc » conserve le lien narratif et logique marqué par οὖν.
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: à quelle heure
  rationale: Cette formulation française naturelle exprime la demande portant sur l’heure précise, tandis que « leur » rend idiomatiquement παρ’ αὐτῶν, la source du renseignement.
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: son état avait commencé à s’améliorer
  rationale: L’expression idiomatique grecque indique une amélioration de santé. Le plus-que-parfait situe naturellement ce commencement avant la demande, et « avait commencé à s’améliorer » rend la valeur contextuelle sans suggérer une guérison déjà complète.
- source_word: εἶπαν οὖν αὐτῷ
  choice: Ils lui répondirent
  rationale: Bien que le grec dise littéralement « ils lui dirent donc », « répondirent » exprime naturellement en français la fonction de cette parole dans l’échange.
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: Hier, à la septième heure
  rationale: La désignation littérale de l’heure est conservée afin de ne pas imposer un système antique de calcul du temps que le texte ne précise pas.
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: la fièvre l’a quitté
  rationale: Cette tournure claire et idiomatique conserve la fièvre comme sujet, conformément à la structure grecque.
theological_decisions:
- issue: Mode de calcul de « la septième heure »
  choice: Conserver « à la septième heure » dans le texte principal.
  alternative: Convertir en « vers treize heures » selon un calcul depuis le lever du soleil, ou éventuellement en « vers dix-neuf heures » selon une autre compréhension du mode de calcul johannique.
  rationale: Le verset ne précise pas le système horaire employé. La formulation littérale préserve cette ambiguïté historique au lieu de la trancher.
translation_notes:
  register: Français international moderne, naturel et digne. « Son état avait commencé à s’améliorer » explicite sobrement l’amélioration de santé impliquée par l’idiome grec; « la septième heure » maintient la forme antique dans le corps du texte.
