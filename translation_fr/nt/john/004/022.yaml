id: JHN.4.22
reference: John 4:22
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: fr
  text: Vous, vous adorez ce que vous ne connaissez pas ; nous, nous adorons ce que nous connaissons, car le salut vient des Juifs[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « du peuple juif ». Dans d’autres passages de Jean, le terme peut parfois désigner les Judéens ; ici, le contraste avec les Samaritains porte sur le culte et l’histoire du salut.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: adorez / adorons
  rationale: Dans ce contexte religieux, le verbe désigne le culte rendu à Dieu. « Adorer » est l’équivalent français naturel et conserve le parallélisme.
- source_word: ὃ
  choice: ce que
  rationale: Le pronom relatif neutre est rendu sans le personnaliser davantage que le grec ; « celui que » serait possible en contexte, mais expliciterait le référent.
- source_word: οἴδατε / οἴδαμεν
  choice: connaissez / connaissons
  rationale: « Connaître » maintient le contraste direct portant sur l’objet du culte et correspond au sens du verbe dans cette phrase.
- source_word: σωτηρία
  choice: le salut
  rationale: « Le salut » est le terme français usuel et approprié pour l’œuvre salvatrice de Dieu dans ce contexte johannique.
- source_word: ἐκ
  choice: vient de
  rationale: La préposition indique ici la source ou l’origine. La tournure verbale « vient de » est naturelle en français et rend clairement cette relation.
- source_word: τῶν Ἰουδαίων
  choice: des Juifs
  rationale: Ici, le contraste avec les Samaritains concerne le culte et l’histoire du salut ; le terme renvoie donc au peuple juif plutôt qu’aux seuls habitants de la Judée.
theological_decisions:
- issue: Sens de « le salut vient des Juifs »
  choice: Affirmation de l’origine historique du salut et de sa médiation à travers le peuple juif.
  alternative: Référence plus étroite à l’origine juive du Messie, ou affirmation plus large de la priorité de la révélation et du culte juifs.
  rationale: La traduction conserve la formulation de source et son ampleur sans la réduire à la seule naissance du Messie, ni en faire une affirmation de supériorité ethnique.
translation_notes:
  register: Français moderne, digne et accessible. La reprise des pronoms « Vous, vous… nous, nous… » restitue l’opposition marquée entre ὑμεῖς et ἡμεῖς. Le point-virgule conserve le parallélisme serré des deux propositions.
