id: JHN.4.47
reference: John 4:47
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: fr
  text: Quand cet homme apprit que Jésus était arrivé de Judée en Galilée, il alla le trouver et lui demanda[a] de descendre[b] et de guérir son fils, car celui-ci était sur le point de mourir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'On pourrait aussi traduire : « lui demandait avec insistance » ou « ne cessait de lui demander ». L’imparfait grec peut présenter la demande comme prolongée ou répétée.'
    reason: lexical_alternative
  - marker: b
    text: « Descendre » correspond au relief du trajet, probablement de Cana vers Capernaüm.
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: cet homme
  rationale: Renvoie naturellement à l’officier royal du verset précédent tout en conservant la valeur démonstrative.
- source_word: ἀκούσας
  choice: quand cet homme apprit
  rationale: Le participe aoriste est rendu par une proposition temporelle naturelle; « apprit » convient à une information reçue.
- source_word: ἥκει
  choice: était arrivé
  rationale: Exprime l’arrivée accomplie et la présence qui en résulte, dans le cadre d’un discours rapporté au passé.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: de Judée en Galilée
  rationale: Conserve le point de départ et la destination dans une formulation française idiomatique.
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: il alla le trouver
  rationale: Rend clairement le déplacement de l’homme vers Jésus dans un français narratif naturel.
- source_word: ἠρώτα
  choice: lui demanda
  rationale: Rend le sens de la demande sans lui attribuer une intensité émotionnelle absente du lexème; une note signale la possible valeur durative de l’imparfait grec.
- source_word: ἵνα καταβῇ
  choice: de descendre
  rationale: Après « demander », l’infinitif est naturel en français et « descendre » conserve l’indication topographique.
- source_word: ἰάσηται
  choice: guérir
  rationale: Terme courant et précis pour la guérison physique visée.
- source_word: αὐτοῦ τὸν υἱόν
  choice: son fils
  rationale: Rendu possessif français direct et non ambigu dans le contexte.
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: car celui-ci était sur le point de mourir
  rationale: « Sur le point de » exprime l’imminence portée par μέλλω; « celui-ci » explicite que le sujet est le fils.
theological_decisions:
- issue: Référent du sujet dans « était sur le point de mourir »
  choice: Le fils
  alternative: Jésus ou l’officier royal
  rationale: Le fils est le référent grammaticalement le plus proche et le seul qui convienne au contexte; « celui-ci » évite toute ambiguïté accidentelle en français.
- issue: Force de l’imparfait ἠρώτα
  choice: Demande exprimée sans intensification dans le texte principal
  alternative: « ne cessait de lui demander » ou « le suppliait »
  rationale: L’imparfait peut présenter l’action comme en cours ou répétée, mais n’impose ni l’itération ni la supplication; la note préserve cette nuance sans surtraduire.
translation_notes:
  register: Français international moderne, fluide et digne. Le passé simple maintient le registre narratif biblique sans archaïsme marqué; « celui-ci » clarifie le référent final.
