id: JHN.4.20
reference: John 4:20
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: fr
  text: Nos pères ont adoré sur cette montagne[a], et vous, vous dites que c’est à Jérusalem que se trouve le lieu où l’on doit adorer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Nos ancêtres ont adoré sur cette montagne. »'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: Nos pères
  rationale: Rend littéralement l’expression grecque et préserve la revendication de filiation communautaire. « Nos ancêtres » serait plus explicite en français courant, mais atténuerait l’idiome du texte.
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: sur cette montagne
  rationale: « Sur » est la préposition française naturelle pour situer un culte célébré en un lieu montagneux.
- source_word: προσεκύνησαν
  choice: ont adoré
  rationale: Dans cette discussion sur le lieu du culte, προσκυνέω désigne l’adoration religieuse plutôt que le seul geste de se prosterner.
- source_word: ὑμεῖς
  choice: vous, vous dites
  rationale: La reprise du pronom en français fait entendre le contraste explicite entre « nos pères » et les interlocuteurs, sans ajouter leur identité.
- source_word: ἐν Ἱεροσολύμοις
  choice: à Jérusalem
  rationale: « À Jérusalem » est la tournure idiomatique française pour situer un lieu ou une pratique dans cette ville.
- source_word: ὁ τόπος
  choice: le lieu
  rationale: Conserve le nom défini sans expliciter davantage l’idée implicite de lieu légitime ou exclusif.
- source_word: ὅπου προσκυνεῖν δεῖ
  choice: où l’on doit adorer
  rationale: La tournure impersonnelle « l’on doit » exprime clairement la nécessité générale portée par δεῖ, dans un registre digne et naturel.
- source_word: καὶ
  choice: et
  rationale: Préserve la coordination formelle du grec; le contraste ressort déjà de « nos pères » et « vous, vous dites ».
theological_decisions:
- issue: Explicitation de l’opposition entre le culte samaritain et le culte juif
  choice: L’opposition reste implicite dans « Nos pères… et vous, vous dites… »
  alternative: « Nos ancêtres samaritains… mais vous, les Juifs, vous dites… »
  rationale: Le verset ne nomme explicitement ni les Samaritains ni les Juifs. Les ajouter résoudrait par paraphrase ce que le grec laisse au contexte.
- issue: Portée de la nécessité dans προσκυνεῖν δεῖ
  choice: « où l’on doit adorer »
  alternative: « où il faut adorer »
  rationale: La formulation retenue conserve le caractère général et normatif de l’affirmation sans en faire un ordre adressé à une personne précise.
translation_notes:
  register: Français international moderne, clair et digne. « Nos pères » conserve l’idiome biblique sans archaïsme grammatical; la note propose l’équivalent plus immédiatement explicite « nos ancêtres ». La dislocation « vous, vous dites » marque naturellement le contraste du pronom grec explicite.
