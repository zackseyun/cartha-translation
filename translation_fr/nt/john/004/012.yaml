id: JHN.4.12
reference: John 4:12
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: fr
  text: Es-tu plus grand que notre père Jacob[a], qui nous a donné ce puits et qui en a bu lui-même, ainsi que ses fils et ses troupeaux ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou, de façon plus explicite : « Tu n’es tout de même pas plus grand que notre père Jacob, n’est-ce pas ? » La question grecque introduite par μή appelle une réponse négative.'
    reason: Préciser la valeur rhétorique de μή, difficile à reproduire entièrement dans une question française concise.
lexical_decisions:
- source_word: μὴ σὺ
  choice: Es-tu
  rationale: La question introduite par μή attend une réponse négative. En français naturel, la question rhétorique conserve cette attente, tandis que le pronom exprimé « tu » porte l’insistance de σὺ.
- source_word: μείζων
  choice: plus grand que
  rationale: Le comparatif concerne ici la grandeur ou le rang, non la taille physique. « Plus grand que » préserve aussi la portée potentiellement théologique de la question.
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: notre père Jacob
  rationale: Cette formulation naturelle conserve le langage d’ascendance et l’appel de la Samaritaine à l’héritage ancestral commun.
- source_word: ἔδωκεν ἡμῖν
  choice: nous a donné
  rationale: 'Le passé composé convient au français courant pour un don ancien dont le résultat demeure présent : le puits est encore en leur possession.'
- source_word: τὸ φρέαρ
  choice: ce puits
  rationale: φρέαρ désigne ici un puits. Le démonstratif français rend naturellement l’article grec dans la situation immédiate, où le puits est sous les yeux des interlocuteurs.
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: et qui en a bu lui-même
  rationale: « Lui-même » restitue l’emphase de αὐτός, et « en » reprend le puits de façon idiomatique en français.
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: ses fils
  rationale: υἱοί désigne précisément les fils de Jacob ; il n’y a pas lieu de généraliser en « enfants ».
- source_word: τὰ θρέμματα αὐτοῦ
  choice: ses troupeaux
  rationale: θρέμματα désigne les animaux domestiques nourris ou élevés. « Troupeaux » est naturel dans le cadre pastoral de Jacob, sans limiter le sens aux seuls bovins.
theological_decisions:
- issue: Valeur de la question introduite par μή
  choice: Une question rhétorique qui appelle la réponse « non », formulée simplement « Es-tu plus grand… ? »
  alternative: « Tu n’es tout de même pas plus grand que notre père Jacob, n’est-ce pas ? »
  rationale: La formulation principale reste naturelle et laisse entendre le défi de la femme sans transformer l’attente implicite du grec en négation explicite. La note signale la force précise de μή.
translation_notes:
  register: Français international moderne, clair et digne. La syntaxe conserve la progression du grec tout en évitant une coordination lourde. « Notre père Jacob » garde la portée ancestrale ; « plus grand » préserve la tension implicite sur l’identité de Jésus.
