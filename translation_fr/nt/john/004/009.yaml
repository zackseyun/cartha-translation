reference: John 4:9
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: fr
  text: 'La Samaritaine lui dit donc : « Comment peux-tu, toi qui es juif, me demander à boire, à moi qui suis une Samaritaine ? » (En effet, les Juifs n’ont pas de relations avec les Samaritains[a].)'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « ne partagent rien avec les Samaritains », peut-être au sens plus précis qu’ils n’utilisent pas les mêmes objets, notamment les récipients pour boire.'
    reason: Alternative lexicale pour συγχρῶνται, dont le sens peut être général ou viser l’usage commun d’objets dans le contexte immédiat.
lexical_decisions:
- source_word: λέγει οὖν
  choice: dit donc
  rationale: « Donc » conserve la valeur de progression et d’inférence de οὖν tout en restant naturel dans le récit.
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: La Samaritaine
  rationale: Cette formulation française idiomatique désigne clairement la femme par son identité samaritaine; son genre est porté par l’article et le nom féminins.
- source_word: Πῶς
  choice: Comment peux-tu
  rationale: La tournure exprime naturellement l’étonnement devant une demande jugée contraire aux usages sociaux, sans transformer explicitement la question en « pourquoi ».
- source_word: Ἰουδαῖος ὢν
  choice: toi qui es juif
  rationale: Le relatif rend naturellement le participe circonstanciel ὢν et maintient la mise en relief de « toi »; « juif » convient ici au contraste entre deux communautés ethnoreligieuses.
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: me demander à boire
  rationale: Expression française courante qui rend la demande de recevoir de quoi boire de la part de la femme.
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: à moi qui suis une Samaritaine
  rationale: La reprise emphatique de « moi » restitue le fondement de son étonnement et conserve à la fois la première personne, le genre et l’identité communautaire.
- source_word: συγχρῶνται
  choice: n’ont pas de relations avec
  rationale: Cette expression rend le sens général des rapports sociaux entre les groupes tout en laissant en note le sens contextuel plus précis de partager ou d’utiliser des objets en commun.
theological_decisions:
- issue: Sens de Ἰουδαῖος dans ce contexte johannique
  choice: juif
  alternative: Judéen
  rationale: Le contraste porte ici sur l’appartenance communautaire et les usages entre Juifs et Samaritains, plutôt que sur la seule provenance géographique.
- issue: Portée de συγχρῶνται
  choice: absence générale de relations sociales
  alternative: absence de partage ou d’usage commun d’objets, notamment de récipients
  rationale: Le verbe peut évoquer globalement les rapports entre les deux communautés; toutefois, la demande de boire rend plausible un sens plus précis lié à l’usage commun d’un récipient. Cette possibilité est conservée en note.
translation_notes:
  register: Français international moderne, naturel et digne. Le dialogue conserve l’étonnement et l’opposition emphatique entre « toi » et « moi ». La parenthèse est maintenue comme explication narrative.
