source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: fr
  text: Il revint donc à Cana, en Galilée, où il avait changé l’eau en vin. Or, il y avait un fonctionnaire royal[a] dont le fils était malade à Capernaüm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « un officier du roi » ou « un homme de la cour ». Le terme grec désigne une personne liée au pouvoir ou au service royal, sans préciser sa fonction.
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: donc
  rationale: Conserve le lien narratif et inférentiel avec le contexte précédent, dans un français naturel.
- source_word: πάλιν
  choice: revint
  rationale: Le préfixe re- exprime naturellement l’idée de « de nouveau » dans le contexte d’un retour à Cana.
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: Cana, en Galilée
  rationale: Formulation géographique idiomatique en français moderne, sans suggérer que « de Galilée » fait partie du nom propre.
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: avait changé l’eau en vin
  rationale: Rend clairement l’événement antérieur et le sens de la construction grecque, plus naturellement que le calque « avait fait l’eau vin ».
- source_word: βασιλικός
  choice: fonctionnaire royal
  rationale: Exprime l’attachement au pouvoir ou au service royal sans préciser indûment le rang, la charge ou la noblesse de l’homme.
- source_word: τις
  choice: un
  rationale: L’article indéfini introduit naturellement en français une personne particulière mais non nommée; « un certain » risquerait ici une nuance de distance ou de dépréciation absente du grec.
- source_word: υἱός
  choice: fils
  rationale: Respecte la désignation masculine précise du grec.
- source_word: ἠσθένει
  choice: était malade
  rationale: Dans ce contexte, le verbe désigne clairement une maladie physique.
- source_word: Καφαρναούμ
  choice: Capernaüm
  rationale: Translittération française usuelle du nom de lieu.
theological_decisions:
- issue: Identification historique et rang exact du βασιλικός
  choice: fonctionnaire royal
  alternative: officier du roi; homme de la cour; noble
  rationale: Le texte indique un lien avec l’autorité royale, mais ne précise ni la fonction exacte ni le statut social. La traduction retenue préserve cette indétermination.
translation_notes:
  register: Français international moderne, fluide et digne. « Or » marque naturellement l’introduction du nouveau personnage. La note est placée après la proposition entière, mais porte sur « fonctionnaire royal ».
