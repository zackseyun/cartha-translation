lexical_decisions:
- source_word: καίτοιγε
  choice: bien que
  rationale: Introduit naturellement en français la précision concessive qui nuance l’affirmation du verset précédent.
- source_word: αὐτὸς
  choice: lui-même
  rationale: Conserve l’insistance sur le fait que Jésus ne procédait pas personnellement aux baptêmes.
- source_word: οὐκ ἐβάπτιζεν
  choice: ne baptisât pas
  rationale: Après « bien que », le subjonctif imparfait maintient ici le cadre passé et la valeur durative ou habituelle de l’imparfait grec, dans un registre écrit digne.
- source_word: ἀλλ’
  choice: mais
  rationale: Marque directement le contraste entre Jésus et ses disciples.
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ses disciples
  rationale: Préserve l’ellipse du verbe grec; l’idée de baptiser se déduit clairement du premier membre.
theological_decisions:
- issue: Qui administrait les baptêmes dans le ministère de Jésus
  choice: Jésus ne baptisait pas personnellement; ses disciples le faisaient.
  alternative: « Jésus lui-même ne baptisa pas, mais ses disciples le firent. »
  rationale: Le texte apporte une précision narrative sans expliquer sa portée théologique. La formulation conserve l’emphase sur Jésus lui-même et, autant que possible, l’aspect duratif ou habituel de l’imparfait.
translation_notes:
  register: Français international, naturel et digne. Le verset forme une parenthèse liée à la phrase précédente et suivante; les tirets en signalent la fonction. Le subjonctif imparfait est grammaticalement précis mais plus soutenu que l’usage courant; la note donne une formulation plus transparente sur le plan aspectuel.
