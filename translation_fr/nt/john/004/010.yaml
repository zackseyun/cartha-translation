source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: fr
  text: 'Jésus lui répondit : « Si tu connaissais le don de Dieu et qui est celui qui te dit : “Donne-moi à boire”, tu lui aurais demandé, et il t’aurait donné de l’eau vive[a]. »'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « de l’eau courante » ou « de l’eau de source ». L’expression peut désigner une eau qui coule ou jaillit, mais « eau vive » en préserve ici le double sens.
    reason: alternative lexicale
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: Jésus lui répondit
  rationale: En français narratif, « répondit » introduit naturellement les paroles qui suivent. Reproduire le doublet grec par « répondit et lui dit » serait lourd sans ajouter de sens.
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: le don de Dieu
  rationale: Cette formulation naturelle conserve le génitif grec et laisse ouverte la nuance d’un don appartenant à Dieu ou venant de lui.
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: qui est celui qui te dit
  rationale: La tournure garde l’accent mis sur l’identité de celui qui parle, tout en rendant naturellement le participe présent grec dans ce contexte.
- source_word: Δός μοι πεῖν
  choice: Donne-moi à boire
  rationale: C’est l’équivalent français idiomatique et direct de l’impératif suivi de l’infinitif.
- source_word: σὺ ἂν ᾔτησας αὐτόν
  choice: tu le lui aurais demandé
  rationale: Le pronom « le » renvoie naturellement au don évoqué, sans expliciter davantage ce que le grec laisse implicite; « lui » rend la personne à qui la demande aurait été adressée.
- source_word: ἔδωκεν ἄν σοι
  choice: il t’aurait donné
  rationale: Le conditionnel passé rend la conséquence irréelle exprimée par ἄν avec l’indicatif aoriste.
- source_word: ὕδωρ ζῶν
  choice: de l’eau vive
  rationale: L’expression française traditionnelle et compréhensible préserve à la fois le sens concret d’une eau courante ou jaillissante et la portée plus profonde du propos de Jésus.
theological_decisions:
- issue: Maintien du double sens de ὕδωρ ζῶν
  choice: de l’eau vive
  alternative: de l’eau courante / de l’eau fraîche
  rationale: « Eau vive » permet de comprendre d’abord une eau qui coule ou jaillit, tout en préservant la portée symbolique que le contexte développe, sans réduire l’expression à un seul niveau de sens.
- issue: Référent implicite de la demande dans σὺ ἂν ᾔτησας αὐτόν
  choice: tu le lui aurais demandé
  alternative: tu lui aurais demandé à boire
  rationale: Le grec ne répète pas explicitement l’objet demandé. Le pronom « le » rattache la demande au « don de Dieu » sans imposer qu’elle porte simplement sur une boisson ordinaire.
translation_notes:
  register: Français international moderne, digne et accessible. Le tutoiement correspond au singulier grec et à l’usage naturel de la scène. La construction « Si tu connaissais… tu le lui aurais demandé » conserve la tension temporelle du grec entre une connaissance absente et la demande qui aurait dû en résulter.
