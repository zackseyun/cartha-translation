  verdict: revise
  source_fidelity: 'La construction « tu le lui aurais demandé » ne rend pas correctement αὐτόν : en grec, αὐτόν est la personne à qui la demande aurait été adressée (« tu lui aurais demandé »), tandis que l''objet de la demande demeure implicite. La suppression de « et dit » après « répondit » est idiomatique en français et ne compromet pas le sens.'
  naturalness: Le texte est globalement naturel, de registre narratif moderne et digne. « Tu lui aurais demandé » est à la fois idiomatique et plus fidèle que la formulation actuelle, sans devoir expliciter l'objet de la demande.
  terminology: « Le don de Dieu » et « de l’eau vive » sont appropriés. « Eau vive » conserve le double sens voulu; la note peut proposer plus précisément « eau courante » ou « eau de source », plutôt que « eau fraîche », qui décrit surtout une température ou une qualité et est moins directement lié au sens lexical ici.
  issues:
  - severity: high
    issue: « tu le lui aurais demandé » attribue un objet explicite à la demande et ne rend pas la fonction de αὐτόν.
    rationale: αὐτόν est l'objet direct de αἰτέω, soit « lui demander / lui adresser une demande » en français. Le grec ne dit pas que la femme aurait demandé « le don »; l'objet de la demande reste non exprimé. « Tu lui aurais demandé » préserve cette implicitation.
  - severity: low
    issue: La note propose « eau fraîche » comme alternative lexicale.
    rationale: Dans cet emploi, ὕδωρ ζῶν désigne normalement de l'eau courante, vive ou de source. « Eau de source » est une alternative française plus exacte; « eau fraîche » risque de suggérer une simple température.
