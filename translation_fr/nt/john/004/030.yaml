  text: ἐξῆλθον ἐκ τῆς πόλεως καὶ ἤρχοντο πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/030.yaml
  text: They went out of the city and were coming to him[a].
translation:
  language: fr
  text: Ils sortirent de la ville et se dirigeaient vers lui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ou : « Ils sortirent de la ville et venaient vers lui. »'
    reason: Alternative lexicale permettant de rendre plus directement ἤρχοντο par « venaient », tout en conservant l’action en cours exprimée par l’imparfait.
lexical_decisions:
- source_word: ἐξῆλθον
  choice: sortirent
  rationale: L’aoriste de ἐξέρχομαι exprime ici la sortie hors d’un lieu délimité. Le passé simple convient au registre narratif digne et marque naturellement l’événement.
- source_word: ἐκ τῆς πόλεως
  choice: de la ville
  rationale: Avec « sortir », la préposition française « de » exprime naturellement le mouvement depuis l’intérieur de la ville. « Ville » est le rendu courant et suffisamment large de πόλις.
- source_word: ἤρχοντο
  choice: se dirigeaient
  rationale: L’imparfait préserve le caractère progressif de l’action. « Se dirigeaient » rend le mouvement d’approche sans imposer en français le point de vue déictique parfois associé à « venir ».
- source_word: πρὸς αὐτόν
  choice: vers lui
  rationale: πρός avec l’accusatif marque un mouvement en direction d’une personne. « Vers lui » s’accorde naturellement avec « se dirigeaient » et conserve l’idée d’approche.
theological_decisions: []
translation_notes:
  register: Français international moderne, naturel et digne. Le passé simple porte l’action ponctuelle de sortie, tandis que l’imparfait présente la marche vers Jésus comme étant en cours.
