id: JHN.4.54
reference: John 4:54
language:
  code: fr
  name: French
  native_name: Français
  variant: modern international French
source:
  edition: SBLGNT
  text: τοῦτο ⸀δὲ πάλιν δεύτερον σημεῖον ἐποίησεν ὁ Ἰησοῦς ἐλθὼν ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: fr
  text: Ce fut, de nouveau, le deuxième signe que Jésus accomplit après être venu de Judée en Galilée[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ou « miracle ». Jean emploie souvent le mot « signe » pour souligner aussi bien la signification de l’acte que sa puissance.
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: Ce
  rationale: Le démonstratif renvoie à la guérison qui vient d’être racontée; « Ce fut » est naturel dans cette phrase récapitulative.
- source_word: δὲ πάλιν
  choice: de nouveau
  rationale: δέ assure une liaison légère, tandis que πάλιν marque la répétition; « de nouveau » restitue clairement l’idée sans imposer une opposition.
- source_word: δεύτερον
  choice: le deuxième
  rationale: L’ordinal qualifie « signe » et le présente comme le deuxième dans la séquence évoquée par le narrateur.
- source_word: σημεῖον
  choice: signe
  rationale: Dans Jean, le terme désigne une œuvre puissante qui révèle une réalité au-delà d’elle-même; « signe » conserve cette portée littéraire et théologique.
- source_word: ἐποίησεν
  choice: accomplit
  rationale: Avec « signe », « accomplit » est une formulation française naturelle et digne, moins littérale que « fit » sans ajouter l’idée technique de spectacle.
- source_word: ἐλθὼν
  choice: après être venu
  rationale: Le participe aoriste a ici une valeur temporelle; cette formulation maintient le lien entre la venue de Jésus et le signe.
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: de Judée en Galilée
  rationale: Cette tournure française exprime naturellement le mouvement depuis la Judée jusqu’en Galilée.
theological_decisions:
- issue: Terminologie johannique de σημεῖον
  choice: signe
  alternative: miracle
  rationale: '« Signe » préserve la catégorie propre à Jean: l’acte manifeste de la puissance, mais possède aussi une portée révélatrice. « Miracle » mettrait surtout l’accent sur son caractère extraordinaire.'
translation_notes:
  register: Français international moderne, clair et digne. La structure récapitulative du grec est conservée, tandis que « de Judée en Galilée » évite une formulation géographique artificielle.
